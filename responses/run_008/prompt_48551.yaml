answer: |-
  # Lesson Plan: The Admissibility Market

  **Course:** Upper-Level Seminar on Philosophy of Probability
  **Topic:** David Lewis's Principal Principle (PP)
  **Time:** 90 Minutes
  **Students:** 12
  **Goal:** To operationalize the distinction between admissible and inadmissible evidence, demonstrating where the normative "teeth" of the Principal Principle lie (and where they might be missing).

  ## 1. Materials & Setup
  *   **The Device:** A large, transparent spinner divided into Red and Black. It must be visibly fair (50/50) but mechanically manipulable by you (the Instructor) via a hidden foot pedal or magnet, OR simply trusted as fair for the sake of the game. *Recommendation:* Use a digital randomizer projected on screen for absolute transparency of "Chance" vs. "Outcome," controlled by a script you hold.
  *   **Currency:** 100 "Credence Chips" per student.
  *   **The Market:** A whiteboard listing "Contracts." Each contract pays **10 Chips** if the outcome is **RED**, **0** if **BLACK**.
  *   **Trading Mechanic:** Students write down their "Buy Price" (0–10) for the contract. The "House" (you) sets a market price based on the majority average, or simply acts as the bookie. *Simpler version for 12 students:* Students submit a private credence (0–100%). If they are within 10% of the *rational* credence, they gain chips. If they defer blindly when they shouldn't, they lose chips.
      *   *Selected Mechanic:* **The Scoring Rule.** Students submit a credence $c$ (0 to 1). Outcome $O$ (1 for Red, 0 for Black). Score = $1 - (c - O)^2$ (Brier Score simplified). To make it gambling-like: They bet chips on their credence. If Red comes up, they win $Bet \times c$. If Black, they lose $Bet \times (1-c)$.
      *   *Actually, let's keep it dead simple for philosophy:* **Prediction Market.** Students buy/sell contracts at a price they set. If they buy at 0.6 and Red hits, they profit. If Black hits, they lose. This forces them to set price = credence.

  ## 2. The Rules (5 Minutes)
  1.  **Goal:** Maximize Chip Count.
  2.  **Mechanic:** In each round, a "Chance Card" is revealed stating the Objective Chance of Red ($x$).
  3.  **Trading:** You receive private or public "Evidence Leaks." You must set a price (0.0 to 1.0) you are willing to buy a "Red Pays 1 Chip" contract.
  4.  **Settlement:** The spinner spins. Contracts pay out.
  5.  **The Principal Principle:** Remind them: $C(A | XE) = x$. If $X$ (Chance is $x$) and $E$ (Evidence) is admissible, your price should be $x$.

  ## 3. The Rounds (60 Minutes Total)

  ### Round 1: The Baseline (15 mins)
  *   **Setup:** Digital Spinner.
  *   **Chance Card:** "Objective Chance of Red = 0.5."
  *   **Evidence:** None.
  *   **The Trap:** Students who think "50/50 is a gambler's fallacy, I'll bet on Black because Red just came up" lose money over time.
  *   **Correct Play:** Price = 0.5. Defer to the Chance.
  *   **Outcome:** Spin is random.

  ### Round 2: The Crystal Ball (20 mins)
  *   **Setup:** Same Spinner.
  *   **Chance Card:** "Objective Chance of Red = 0.5."
  *   **Evidence (The Leak):** Hand a sealed envelope to one student (or project it): "Reliable Insider Tip: The outcome of *this specific spin* is Red."
  *   **The Trap:** Students who strictly follow the Chance Card (Price = 0.5) will be arbitraged by the student with the Tip (Price = 1.0).
  *   **Correct Play:** Price = 1.0 (or near). The evidence is **Inadmissible**. It bypasses chance.
  *   **Philosophical Point:** PP does not apply because $E$ is inadmissible. $C(A|XE) \neq x$.

  ### Round 3: The Theory Collapse (25 mins)
  *   **Setup:** Same Spinner.
  *   **Chance Card:** "Objective Chance of Red = 0.5 (Derived from Quantum Theory Q)."
  *   **Evidence (The Leak):** "Breaking News: Theory Q has just been empirically refuted. The mechanism is actually deterministic but unknown."
  *   **The Trap:** This is the crux of your argument.
      *   *Friend's View:* The Chance proposition $X$ is now false. PP is vacuous.
      *   *Your View:* This is where you check admissibility. If the chance is *actually* 0 or 1 (deterministic), deferring to 0.5 is irrational.
  *   **Correct Play:** Price = 0.5 (if you think the Card is still authoritative) OR Price = 0.0/1.0 (if you think the Leak overrides the Card).
      *   *Instructor Rigging:* For the lesson, ensure the Leak implies the Chance is *not* 0.5. (e.g., "The spinner is weighted 90% Red").
      *   **Revised Setup for Clarity:** Card says "Fair (0.5)." Leak says "I just weighed it; it's 90% biased to Red."
      *   **Correct Play:** Price = 0.9. The "Chance = 0.5" proposition is false. You cannot defer to a false chance.
      *   **Philosophical Point:** PP requires $X$ to be *true*. If evidence undermines $X$, PP dissolves.

  ## 4. The Debrief (25 Minutes)
  *   **Map the losses:** Ask students who lost chips in Round 2 why they deferred. They will say "The Card said 50%."
  *   **Map the wins:** Ask students who won Round 2 why they ignored the Card. They will say "The Tip was better."
  *   **Settle the Argument:**
      *   **Friend's Point:** Validated in Round 3. If the Chance claim is false, PP offers no guidance. The work *is* in knowing whether $X$ is true and whether $E$ is admissible.
      *   **Your Point:** Validated in Round 2. Without PP, there is no *rule* telling you to treat the Tip differently from the Card. PP provides the normative structure: "Defer *unless*..." The "Teeth" are the *unless*.
  *   **Conclusion:** The Principle isn't empty; it's a conditional constraint. It forces you to categorize evidence.

  ## 5. Predictable Problems & Fixes
  1.  **Problem:** Students treat it as gambling luck, not credence calibration.
      *   **Fix:** Use a proper Scoring Rule (Brier Score) rather than betting. If they say 0.9 and it's Black, they get penalized heavily. This punishes overconfidence more than betting does.
  2.  **Problem:** Suspicion that the Instructor is rigging the spinner against the "Philosophically Correct" answer.
      *   **Fix:** Use a third-party randomizer (e.g., random.org projected) for the outcome, while you control the *Information* about the chance. Separate the "Chance Claim" from the "Outcome Generation."
  3.  **Problem:** Round 3 confusion (Is the Chance false or is the Evidence inadmissible?).
      *   **Fix:** Be explicit in the script: "The Leak reveals the physical bias." This makes the Chance Claim ($X$) false, not the Evidence inadmissible. This distinguishes the two failure modes of PP.

  ## 6. What The Game Cannot Reproduce
  *   **The Ontology of Chance:** In the game, "Chance" is whatever the Instructor says it is on the Card. In the real world, Chance is a mind-independent feature (propensity, best system, etc.) that we must *infer*. The game hides the hardest part of the PP: knowing $X$ in the first place. The Friend's objection usually targets this inference gap, which the game stipulates away.

