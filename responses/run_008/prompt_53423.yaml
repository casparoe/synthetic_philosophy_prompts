  However, dismissing this as merely verbal ignores the metaphysical stakes. The pessimist's empirical claim about convergence isn't just noise; it points to a substantive view of aesthetic properties. If aesthetic value is response-dependent, grounded in human sensibility rather than mind-independent facts, then testimony functions differently than it does for Tokyo's location. To know Tokyo is in Japan, you need a reliable source. To know a poem is profound, you might need a reliable sensibility, which cannot be transferred via speech. Here, the disagreement is about the architecture of access. The optimist assumes aesthetic properties are public facts accessible via reliable indicators. The pessimist assumes they are experiential qualities accessible only through direct engagement. This isn't just about words; it's about whether aesthetic reasons are transferable. If the pessimist is right that aesthetic reasons must be "seen" to be understood, then testimony literally cannot provide justification, not because of a definition, but because of the nature of the property. The optimist's concession on the "life point" reveals this: they admit the belief is hollow but insist it is knowledge. This suggests a real conflict about whether knowledge requires understanding. If understanding is a necessary condition for knowledge, the pessimist wins on substantive epistemic grounds, not just normative ones.

  4. "My diagnosis"
  Here is my call: This is a substantive disagreement about normative epistemology, masked as a dispute over possibility. Both sides are partially right, but they are fighting over which norm takes precedence. The optimists are correct that there is no metaphysical barrier to forming a true belief via testimony. The pessimists are correct that such a belief fails to satisfy the norms of aesthetic agency. The deadlock persists because neither side wants to concede their respective turf. Pessimists refuse to admit the belief is justified because they fear it legitimizes aesthetic laziness. Optimists refuse to admit the belief is deficient because they fear epistemic exceptionalism. To move forward, your group must decouple justification from appropriateness. You need a framework that allows one to say, "Yes, you have a justified belief (optimist win), but you are violating a norm of aesthetic engagement by holding it this way (pessimist win)." The empirical claims about convergence are red herrings used to defend these normative positions. They are proxies for the deeper worry about autonomy. Progress requires acknowledging that aesthetic testimony is epistemically valid but practically impoverished. Stop asking if you can know; start asking what kind of knower you want to be. The slowness isn't due to difficulty, but to reluctance to split the concept. Until you admit that knowing and valuing are distinct projects here, you will keep arguing past one another. The debate calcifies because both sides want a single verdict to solve both the epistemic and the normative problem. Progress looks like a hybrid view: epistemic optimism paired with normative pessimism. The group needs to draft a distinction between believing truly and appreciating correctly. If you agree testimony yields the former but not the latter, the heat leaves the room. Empirical studies won't help; the disagreement is about the weight of autonomy versus efficiency. The slowness is honest because it requires conceptual restructuring, not just a better argument.

  5. "Bottom line"
  You are fighting over two different questions glued together by a single phrase. The optimists are right about knowledge, but the pessimists are right about value. Stop trying to prove one side wrong and start separating the epistemic permission from the normative cost.
