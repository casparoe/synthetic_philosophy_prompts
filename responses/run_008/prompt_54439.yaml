  7.  **Writing Phase (Mental or Scratchpad):**
      *   *Intro:* Welcome to Dear Becoming. I don't tell you what to do. I tell you what you can know.
      *   *L1:* Pregnant? You can't simulate the phenomenology. Your current self values sleep; future self might value lullabies. Utility calculation fails. Flip a coin. Let fate decide who you become.
      *   *L2:* Move to Denver? You've visited. You know the air. You like skiing. This is not transformative. It's data. Move. The rent is reasonable.
      *   *L3:* You told Denver guy what to do. Why not me? Defense: Denver is instrumental. Baby is constitutive. One changes the agent, one changes the scenery.
      *   *Outro:* Next week: Should I die? (Too dark). Should I write a novel? (Maybe). Let's just sign off.

