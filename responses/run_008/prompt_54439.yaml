      *Defense:* The distinction is between *instrumental* rationality (achieving goals) and *constitutive* choices (becoming a new self). If the choice doesn't change the core self, standard advice applies. If it does, advice is impossible.

      *Ending:* "What am I here for?" hint. Maybe: "I am here to tell you when you are alone."

  8.  **Final Polish:** Check tone. Ensure it's funny but dry. Ensure the philosophy is accessible (explain "what it's like" without jargon).

      *(Self-Correction during drafting)*: Make sure the non-transformative advice is *opinionated*. That's where the comedy lies. She becomes a normal auntie for the trivial stuff.

