answer: |-
  This is an exceptionally sharp puzzle. You have identified the central tension in modern democratic theory: the gap between the *metaphysics* of popular sovereignty (the People as a singular, sovereign author) and the *mechanics* of its administration (the People as a fragmented, fluctuating electorate).

  As requested, I will first outline the criteria for a robust analysis, then present my strongest reconstruction of the implicit theory embedded in referendum practice, analyze the specific puzzles you raised through that lens, and finally sketch the constructivist alternative. I will close with a critique of your framing.

  ### Part 1: Brainstorming the Requirements of a Good Analysis

  To answer this rigorously, your paper cannot simply list inconsistencies. It must interrogate the *normative logic* behind the institutional design. A strong analysis needs to cover:

  1.  **Metaphysical Commitments:** Does the practice treat "the people" as a pre-existing entity (realism) or a temporary coalition (nominalism)?
  2.  **Epistemic Function:** Is the referendum designed to *discover* a truth (the right answer) or *authorize* a decision (the legitimate answer)?
  3.  **Temporal Dimensions:** How does the practice handle the fact that "the people" at Time 1 may differ from "the people" at Time 2? (The problem of inter-temporal sovereignty).
  4.  **Institutional Ventriloquism:** Who speaks for the people when the vote is ambiguous? (Courts, legislatures, commissions).
  5.  **The "Constituent" Distinction:** Is there a difference between the people acting as a *constituent power* (creating/changing the regime) versus a *constituted power* (operating within the regime)?

  ### Part 2: The Strongest Reconstruction — "Tiered Sovereignty"

  If we look for the most charitable, coherent theory that explains the seemingly contradictory practices you described (supermajorities, re-runs, finality), it is not the Populist/Rousseauian view, nor is it a pure Constructivist view.

  The practice of referendums presupposes a theory of **Tiered Sovereignty (or Dual-Track Popular Will).**

  This theory distinguishes between two modes of "the people":
  1.  **The Constituent People:** The sovereign body capable of altering the fundamental rules of the game (constitutions, sovereignty, borders).
  2.  **The Electorate:** The body operating within existing rules to decide policy or ratify treaties.

  **Why this explains the inconsistencies:**
  *   **Thresholds:** Constitutional referendums require supermajorities because they are acts of the *Constituent People*. You are changing the box, so you need near-unanimity of the box's inhabitants. Ordinary referendums are acts of the *Electorate*; simple majority suffices because the constitutional safety valves remain in place.
  *   **Finality vs. Re-runs:** Brexit was treated as sacred because it was framed as an act of *Constituent Power* (reclaiming sovereignty). EU treaty re-runs (Ireland, Denmark) were treated as *contractual negotiations* within an existing constitutional order. If the "No" vote threatens the system's survival, elites treat it as a veto to be overcome (re-run). If the "Leave" vote *is* the system change, it is treated as irreversible.
  *   **Courts and Annulments:** When courts annul a referendum (e.g., Italy, Colombia, or various US state propositions), they are not denying the *will* of the people; they are acting as guardians of the *Constituent* rules against the *Electorate's* temporary passion. They presuppose that the "Real Will" is embedded in the constitutional order, which the momentary majority might violate.

  **The Implicit Metaphysics:**
  This practice does *not* strictly presuppose a pre-political, unified will in the populist sense. Instead, it presupposes a **Procedural Realism**. It assumes there is a "correct" procedure that, if followed, legitimizes the outcome. If the procedure is flawed (campaign finance violations, misleading ballots), the "will" is nullified not because the *preference* didn't exist, but because the *authorization* was defective.

  ### Part 3: Analyzing the Puzzles through Tiered Sovereignty

  Let's apply this reconstruction to your specific puzzles to see where the Populist metaphysics holds and where it breaks.

  **1. Supermajorities and Thresholds**
  *   *Populist View:* A supermajority requirement implies that a simple majority might be a "false" will (a faction), while a larger majority approximates the "General Will."
  *   *Tiered Sovereignty View:* A supermajority is a **risk-management device**. It presupposes that the status quo has a presumption of legitimacy. It does not claim to find the "truer" will; it claims to ensure that the *cost* of changing the will is high enough to prevent instability.
  *   *Philosophical Status:* This is **underdetermined**. You can justify supermajorities via Rousseau (General Will requires broad consensus) *or* via Madison (preventing tyranny of the majority). The machinery works for both.

  **2. Finality vs. Re-runs (The "Wrong Answer" Problem)**
  *   *Populist View:* Inconsistent. If the Will is sacred, re-running a vote until you get a "Yes" is sacrilege.
  *   *Tiered Sovereignty View:* Consistent. If the vote is advisory (Electorate), the government can seek a new mandate. If the vote is binding (Constituent), it is final. The inconsistency arises when governments *strategically mislabel* a vote. They call a vote "advisory" when they fear losing, and "binding" when they expect to win.
  *   *Philosophical Status:* This reveals that the practice is often **cynical rather than theoretical**. However, the *legal* distinction between advisory and binding votes is a coherent institutional feature, even if politically manipulated.

  **3. Framing and Sequencing Effects**
  *   *Populist View:* This is fatal to the Populist view. If the Will changes based on the wording of the question, the Will is not pre-political.
  *   *Tiered Sovereignty View:* This admits that the *Electorate's* preference is constructed. However, it assumes the *Constituent* framework limits how much construction can matter.
  *   *Philosophical Status:* This is the strongest evidence for **Constructivism**. The machinery here reveals that "the will" is an output of the institutional design, not an input.

  ### Part 4: Where the Practice is Philosophically Underdetermined

  You asked where no settled view is required. This is crucial for your paper.

  1.  **Secret Ballot:** This works equally well for a Rousseauian view (protecting the voter from corruption so they can hear the General Will) and a Liberal view (protecting individual privacy from state coercion).
  2.  **One-Person-One-Vote:** This is compatible with the idea that everyone has an equal share of sovereignty (Populist) *and* the idea that everyone has an equal interest to be protected (Pluralist).
  3.  **The Counting Mechanism:** Aggregating preferences mathematically does not tell us *what* is being aggregated. It is a neutral technology that can serve rival metaphysics.

  **The Critical Insight:** The machinery of referendums is largely **metaphysically agnostic**. It is the *rhetoric* surrounding the machinery that imposes the Populist metaphysics. Politicians say "The People Have Spoken" (Populist), but the courts and commissions treat it as "The Electorate Has Authorized" (Proceduralist).

  ### Part 5: Designing a Constructivist/Pluralist Referendum Regime

  If we abandoned the fiction of a unified, pre-existing Will and designed a regime based on the **Constructivist/Pluralist** view (where the will is formed through deliberation and is always multiple), what would change?

  **1. No Binary Choices**
  *   *Current:* Yes/No. (Presupposes a unified judgment).
  *   *Constructivist:* Multiple options or Ranked Choice. This acknowledges that "the people" contain conflicting priorities that cannot be reduced to a single binary.

  **2. Deliberative Intervals (The "Two-Vote" System)**
  *   *Current:* Campaign -> Vote -> Done.
  *   *Constructivist:* Vote 1 (Expression of initial preference) -> Deliberative Phase (Citizens' Assemblies review the result) -> Vote 2 (Final authorization). This admits the first vote was an raw expression, not a final Will. The Will is *constructed* in the interval.

  **3. Interpretive Bodies, Not Just Counters**
  *   *Current:* Electoral Commission counts votes; Parliament implements.
  *   *Constructivist:* A "Citizens' Interpretation Panel" (sortition-based) is tasked with writing the *mandate* based on the vote. Since the vote is ambiguous (e.g., "Leave" doesn't mean "Hard Leave"), a representative body must construct the specific meaning. This makes the construction explicit rather than hidden.

  **4. Lower Thresholds, Higher Revisionability**
  *   *Current:* High stakes = High thresholds/Finality.
  *   *Constructivist:* All votes are provisional. A sunset clause on referendum mandates (e.g., "This mandate expires in 4 years unless renewed"). This treats sovereignty as a continuous flow, not a one-time event.

  **Can this be marketed as "Letting the People Decide"?**
  Yes, but the definition of "Decide" changes. It shifts from "Deciding as a Monarch" (once and for all) to "Deciding as a Legislature" (iteratively). It is honest, but it loses the mobilizing power of Populism. Populism needs the myth of the Unified Will to generate energy. Constructivism offers legitimacy but less energy.

  ### Part 6: Critique of Your Framing

  Your framing is sophisticated, but I offer one caution: **You assume the practice *must* presuppose a coherent theory.**

  In my view, the most philosophically interesting finding might be that **referendum practice is theoretically schizophrenic by design.** It is not that there is a hidden "Tiered Sovereignty" theory that explains it all; it is that the institution is designed to *oscillate* between theories depending on what stabilizes the regime.

  *   When elites want to bypass parliament, they invoke the **Populist/Rousseauian** view ("The Pure Will vs. Corrupt Elites").
  *   When elites want to contain the outcome, they invoke the **Liberal/Proceduralist** view ("The Rule of Law vs. Mob Rule").

  Your paper would be strongest if you argue that the "Will of the People" in referendum practice is not a concept with a definition, but a **resource** that is deployed tactically. The inconsistency isn't a bug; it's a feature that allows the system to absorb shock.

  ### Recommendation for Your Term Paper

  1.  **Thesis:** Argue that referendum practice does not presuppose a single theory of the popular will, but rather manages a tension between two: the *Constituent Will* (sacred, unified, rare) and the *Electorate's Preference* (negotiable, plural, frequent).
  2.  **Evidence:** Use the Brexit vs. EU Treaty re-run comparison to show how the same state applies different metaphysics to different votes.
  3.  **Normative Turn:** Conclude by arguing that a Constructivist design (deliberative, iterative) is more honest, but acknowledge the political cost: it diminishes the "mythic" power of democracy that mobilizes citizens.
  4.  **Philosophical Hook:** Use the distinction between *pouvoir constituant* (constituent power) and *pouvoir constitué* (constituted power) to ground the "Tiered Sovereignty" argument. This shows you are engaging with the canonical literature (Sieyès, Arendt, Schmitt) while analyzing empirical puzzles.

  This approach allows you to be systematic without forcing a false consistency onto messy political practices.
