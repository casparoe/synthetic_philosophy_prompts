  2.  **Brainstorming & Deconstruction (Mental Sandbox):**
      *   *The Core Tension:* Populists say "The Will" is one thing, hidden but discoverable (Rousseauian/General Will). Practice shows "The Will" is messy, contingent, and manipulated.
      *   *The Puzzles:*
          *   Thresholds: Why 50%+1 for Brexit but 60% for constitutional change? Does this imply a "deeper" will needs more consensus?
          *   Finality: Why is Brexit sacred but Irish EU votes re-runnable? Is it about *what* is being decided (sovereignty vs. policy) or just power dynamics?
          *   Courts/Elites: Annulments claim to save democracy from procedural errors. Is this trusteeship?
