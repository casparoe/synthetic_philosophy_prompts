  6.  **Final Polish:** (Self-Correction during drafting) *Wait, I need to make sure I don't sound too dismissive of the populist view. I need to show where it genuinely fits.* The populist view fits the *rhetoric* of the referendum, even if the *mechanics* betray it. I should highlight that tension. Also, ensure the distinction between "discovering" and "creating" the will is clear.

      *Decision:* I will frame the "Strongest Reconstruction" as the theory of **Constituent vs. Constituted Power**. This explains why some votes are sacred (changing the constitution/sovereignty) and others are negotiable (policy/treaties). It explains thresholds (higher stakes = higher consensus needed). It explains why re-runs are okay for treaties (contractual) but not sovereignty (existential). This is more charitable and analytically powerful than just saying "politicians are hypocrites."

