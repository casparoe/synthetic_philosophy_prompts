      *   *The "Implicit Theory":* It's likely not one theory but a *hybrid* or *schizophrenic* practice. It oscillates between "sacred voice" and "advisory poll" depending on convenience.
      *   *Underdetermination:* Many practices (like secret ballots) work regardless of whether the will is discovered or created.
      *   *Constructivist Design:* If we admit the will is made, not found, how do we design referendums? Deliberative mini-publics? Multiple votes? No binary choices?
