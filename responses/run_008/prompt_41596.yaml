  If she says **"Not a lie,"** you point out that her definition of lying is entirely dependent on the *listener's morality*, not the *speaker's honesty*. You can argue that this makes "lying" impossible to self-audit (I can't know if I'm lying until I know if you deserve the truth).

  If she says **"It is a lie,"** you point out that she has admitted lying can be morally good. This undermines her earlier implication that "Lie = Bad, Sleazy = Also Bad but different." It forces her to admit that the *label* "Lie" is descriptive, not normative, which might weaken her moral outrage in the Used Car case.

  **Recommendation:** Bet on her saying **"Not a lie."** It fits her "Kant's Murderer" energy best. If she does, your winning move is to argue that **she has redefined lying as 'betrayal' rather than 'falsehood.'** She isn't tracking truth; she's tracking trust. That's the real rule.
