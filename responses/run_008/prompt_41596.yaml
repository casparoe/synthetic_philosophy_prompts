  ### Part 4: Which Rule Is She Running?

  **My Best Guess: A Hybrid, weighted toward Rule A (Assertion).**

  Devi seems to be running a **"Violated Commitment"** rule. To her, a lie isn't just deception; it's a specific *breach of a speech act*.
  *   She calls the Car guy a liar (Case 2) because he used words to create a false commitment.
  *   She excuses the Murderer (Case 3) because a question creates no commitment *and* the murderer is owed nothing.
  *   She excuses the Mistake (Case 5) because the commitment was made in good faith.

  She distinguishes "Lying" (Active breach of speech) from "Being Sleazy" (Passive deception/Omission/Indifference). This allows her to condemn the behavior morally without mislabeling it technically.

  ### Part 5: The Tie-Breaker Case

  To win this argument, you need a case that isolates the **Entitlement** variable while keeping the **Assertion** variable constant. You need to force her to choose between "Did he speak falsely?" and "Was he allowed to?"

  **Put this case to her:**

  > "The Murderer returns. This time, instead of asking a question, he says, 'I know your friend is inside.' You reply, with a straight face, **'You are wrong, he is not here,'** knowing full well your friend is in the closet. You intend to save your friend's life. Is that a lie?"

  **Why this settles it:**
