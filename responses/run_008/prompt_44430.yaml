prompt: |-
  I lead the user research team at a company that builds a health-tracking app, and I've become uneasy about how much of our evidence about users consists of their own explanations of themselves. Our findings routinely hinge on questions like why someone abandoned an onboarding flow, what made them distrust a permissions screen, whether they would use a proposed feature, and how a red notification badge made them feel. My product leads treat the answers as windows directly into users' minds, and honestly, so did I for a long time. But I've read enough psychology to know the field has been skeptical of this for decades: the old Nisbett-and-Wilson worry that when people explain why they did something they are reporting a plausible theory about themselves rather than observing an inner process; experiments where people confidently justify choices they never actually made; the general finding that reports about one's own motives track what a person thinks would make sense of them. At the same time, I don't want to overcorrect into dismissing everything users tell us. It seems like some introspective reports are in much better shape than others -- say, what just passed through my mind a second ago versus why my mind did what it did over the past week -- and I can't run a lab, so I need the distinction usable in a conference room.

  Please turn the philosophy and psychology of introspection's reliability into a decision procedure my team can actually run each time they design or interpret one of these self-report questions. My team has no psychology background, sessions and surveys run weekly, and whatever survives has to fit in a one-page summary that product leads will actually read, so it needs to be a short ordered list of questions with clear stopping points: what to ask about a proposed or collected self-report, what counts as a sufficient answer, where the procedure concludes that the report shouldn't be used as evidence at all (or only with an explicit caveat attached), and where it should hand the call back to a human because the issue is a judgment about stakes or product context rather than something the literature settles. I'd like the distinctions that actually matter to survive the translation -- for instance, reporting a just-completed experience versus reconstructing one after a delay, reporting what was in mind versus why the mind did it, characterizing a specific episode versus a general disposition, whether the person could have arrived at the answer by observing their own behavior and circumstances rather than by looking inward, and whether the way we elicited the report could have planted the very state or explanation being reported. But you should decide which distinctions earn their place in a ten-minute procedure and which belong in a footnote, and say so. Also please be explicit about where the procedure will misfire -- in particular, questions about preferences and feelings for which we have no behavioral substitute, where a skeptical procedure would leave us with no evidence at all.

  Then run the procedure on three cases from our recent work: (a) a think-aloud session where users are asked, immediately after completing a task, why they hesitated on a particular screen; (b) a cancellation exit survey sent three days after a user downgraded their subscription, asking them to select and explain their reasons; (c) a focus group shown a mockup of a proposed privacy dashboard and asked whether they would use it and why. Include at least one case where the procedure tells us to downweight findings that are vivid, unanimous, and that everyone on the product side loved. I'd rather know now where my own habits of interpretation fail than after we've shipped something on the strength of them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the Request:**
      *   **User:** Lead of a user research team at a health-tracking app company.
      *   **Problem:** Over-reliance on self-report data (users explaining their own behavior/motives) despite knowing from psychology (Nisbett & Wilson, etc.) that introspection is often unreliable (confabulation, post-hoc rationalization).
      *   **Goal:** A practical decision procedure (checklist) for the team to evaluate self-report questions/data.
      *   **Constraints:**
          *   One-page summary style (short, ordered list).
          *   Clear stopping points (Use, Caveat, Discard, Human Judgment).
          *   No psychology background required for the team.
          *   Must fit into weekly workflows/conference rooms.
          *   Must preserve key philosophical/psychological distinctions (timing, content type, observability, elicitation effects).
          *   Must acknowledge limitations (where the procedure leaves us with *no* evidence).
          *   Must apply the procedure to three specific cases (Think-aloud, Exit Survey, Focus Group/Mockup).
          *   One case must result in downweighting "vivid/unanimous" findings.

  2.  **Deconstruct the Psychology/Philosophy:**
      *   *Core Insight:* People are good reporters of *phenomenology* (what they are experiencing right now) but bad reporters of *causality* (why they did it).
      *   *Key Distinctions:*
          *   **Timing:** Immediate vs. Delayed (Memory decay/reconstruction).
          *   **Content:** Experience/Feeling vs. Cause/Motive (What vs. Why).
          *   **Observability:** Internal State vs. External Behavior (Could they infer this from watching themselves?).
          *   **Elicitation:** Leading questions vs. Open inquiry (Demand characteristics).
          *   **Specificity:** Specific Episode vs. General Disposition (Generalizations are prone to bias).
      *   *The "Nisbett & Wilson" Problem:* People construct plausible theories about their minds rather than accessing the actual processing.
      *   *The "Overcorrection" Risk:* If we discard all self-reports, we lose data on preferences and feelings that have no behavioral proxy (e.g., "Do you like this color?").

  3.  **Drafting the Decision Procedure (The "Introspection Audit"):**
      *   *Format:* Numbered list, Yes/No branching, clear outcomes.
      *   *Tone:* Professional, actionable, skeptical but not nihilistic.
      *   *Steps:*
          1.  **Timing:** Was it immediate? (If no -> Caveat/Discard).
          2.  **Content:** Is it about *what* (experience) or *why* (cause)? (If why -> Caveat).
          3.  **Observability:** Could they know this from outside observation? (If yes -> Low value introspection, treat as behavioral inference).
          4.  **Elicitation:** Did we suggest the answer? (If yes -> Discard/Caveat).
          5.  **Stakes/Context:** Human judgment call (Is this high risk?).
      *   *Refinement:* Need to make sure it fits on one page. Let's condense into 5 Critical Questions.
      *   *Outcomes:* Green Light (Trust), Yellow Light (Triangulate/Caveat), Red Light (Discard as causal evidence).

  4.  **Addressing the "Misfire" Clause:**
      *   Need to explicitly state where this tool fails. It fails on *preferences* and *subjective states* where behavior doesn't exist yet (e.g., "Would you use this?"). We can't observe behavior for a feature that doesn't exist. We need to tell the user: "Here, self-report is all you have, so treat it as a hypothesis, not a fact."

  5.  **Applying to the Three Cases:**

      *   **Case (a): Think-aloud, immediate hesitation.**
          *   *Timing:* Immediate (Good).
          *   *Content:* "Why they hesitated" (Causal - Risky).
          *   *Observability:* They felt the hesitation (Good), but the *reason* might be confabulated.
          *   *Verdict:* Yellow Light. Trust the hesitation occurred, doubt the specific reason.
      *   **Case (b): Exit survey, 3 days later.**
          *   *Timing:* Delayed (Bad - Reconstruction).
          *   *Content:* "Reasons for downgrading" (Causal - Risky).
          *   *Observability:* They might be inferring from circumstances ("I didn't use it" vs "I didn't like it").
          *   *Verdict:* Red Light for causal claims. Use only for sentiment tracking, not root cause analysis.
      *   **Case (c): Focus group, mockup, "Would you use it?"**
          *   *Timing:* Immediate reaction to stimulus.
          *   *Content:* Future intent + Reason.
          *   *Observability:* No behavior exists yet.
          *   *Social:* Focus group pressure (Demand characteristics).
          *   *Verdict:* Red Light for intent/reasons. This is the "Vivid/Unanimous" trap. People say yes to be polite or look good.
          *   *Requirement:* This needs to be the one where we downweight the "loved" findings.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the tension (Introspection is flawed but necessary).
      *   **The Procedure:** The "Introspection Reliability Audit" (IRA). 5 Questions. Outcomes.
      *   **The Blind Spot:** Where the procedure admits defeat (Preferences/Future Intent).
      *   **Case Studies:** Applying the IRA to (a), (b), and (c).
      *   **Conclusion:** Final advice on culture.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex?
      *   *Fix:* Simplify the language. Instead of "Epistemic Access," use "Could they see this from the outside?"
      *   *Critique:* Did I include the "Human Judgment" stop?
      *   *Fix:* Add a final step about Risk/Stakes.
      *   *Critique:* Is the distinction between "What" and "Why" clear?
      *   *Fix:* Make sure Case (a) highlights that the *feeling* is real, the *explanation* is suspect.
      *   *Critique:* Did I meet the "one-page summary" vibe?
      *   *Fix:* Use bolding and clear headers. Keep explanations tight.

  8.  **Final Polish:** Check against the prompt's specific request for "clear stopping points" and "what counts as a sufficient answer." Ensure the "misfire" section is explicit. Ensure Case (c) is the warning about vivid consensus.

  *(Self-Correction on Case C)*: The prompt asks for a case where findings are "vivid, unanimous, and that everyone on the product side loved." Focus groups on mockups often generate false positives because users want to be helpful. I need to make sure the analysis reflects that the *enthusiasm* is the trap.

  *(Self-Correction on Procedure)*: Make sure the "Human Judgment" step is distinct from the "Psychology" steps. The psychology tells you about reliability; the business context tells you about risk.

  9.  **Finalizing the Text:** (Drafting the response based on these thoughts.)
answer: |-
  # The Introspection Reliability Audit (IRA)

  **Purpose:** To prevent treating user self-reports as direct access to mental causality. This tool distinguishes between reliable reports of *experience* and unreliable reports of *cause*.
  **Usage:** Run this during study design (to fix questions) and during analysis (to weight findings).
  **Format:** One-page checklist. If you answer "No" to any Green Zone question, proceed to the Yellow/Red zones.

  ### Part 1: The Five Critical Questions

  **1. Timing: Was the report immediate?**
  *   **Yes:** Reported within minutes of the event. (Proceed to Q2)
  *   **No:** Reported hours, days, or weeks later.
      *   *Verdict:* **YELLOW.** Memory is reconstructive. Treat as a story the user tells themselves, not a record of the event.

  **2. Content: Is it about *what* happened or *why* it happened?**
  *   **What:** "I felt anxious," "I looked for the button," "This color hurts my eyes." (Phenomenology)
      *   *Verdict:* **GREEN.** Trust the experience, not necessarily the objective truth of the stimulus.
  *   **Why:** "I clicked because...," "I didn't trust this because...," "I abandoned this due to..." (Causality)
      *   *Verdict:* **YELLOW.** Users infer causes like outside observers. Treat as a hypothesis, not a fact.

  **3. Observability: Could they know this by watching themselves?**
  *   **No:** Requires access to internal states (e.g., "I felt confused").
      *   *Verdict:* **GREEN.** They are the only witness to this data.
  *   **Yes:** Could be inferred from behavior/context (e.g., "I didn't use it because it was too expensive" when you have logs showing they never opened it).
      *   *Verdict:* **RED.** If behavioral data exists, prioritize it. If the self-report contradicts behavior, discard the self-report.

  **4. Elicitation: Did we suggest the answer?**
  *   **No:** Open-ended ("What was going through your mind?").
      *   *Verdict:* **GREEN.**
  *   **Yes:** Leading or multiple-choice with limited options ("Did you leave because of price or privacy?").
      *   *Verdict:* **RED.** You are measuring demand characteristics, not user motives. Discard as causal evidence.

  **5. Specificity: Is this a specific episode or a general rule?**
  *   **Episode:** "When I clicked *this* button just now..."
      *   *Verdict:* **GREEN.**
  *   **General:** "I usually..." or "I would always..."
      *   *Verdict:* **YELLOW.** People overestimate their own consistency. Treat as aspiration, not prediction.

  ---

  ### Part 2: Decision Outcomes

  *   **🟢 GREEN LIGHT (Trust as Evidence):** Immediate + What/Experience + Internal State + Open Elicitation + Specific Episode.
      *   *Action:* Use as primary evidence for UX friction and emotional state.
  *   **🟡 YELLOW LIGHT (Triangulate/Caveat):** Delayed OR Causal ("Why") OR General Disposition.
      *   *Action:* Use only to generate hypotheses. Must be supported by behavioral logs or A/B tests before building. Label findings as "User Perceived Reasons."
  *   **🔴 RED LIGHT (Discard as Causal Evidence):** Leading Elicitation OR Contradicts Behavioral Observability.
      *   *Action:* Do not use to justify product decisions. Archive for sentiment tracking only.
  *   **⚪ HUMAN JUDGMENT (Risk/Stakes):** If the feature involves health safety, financial risk, or privacy, escalate to Product Lead. Psychology cannot determine if a 60% confidence level is "good enough" for your business risk.

  ---

  ### Part 3: The Blind Spot (Where This Procedure Misfires)

  **The "No-Behavior" Zone:**
  This procedure will frequently flag questions about **future intent** ("Would you use this?") and **subjective preference** ("Do you like this?") as Yellow or Red. This is correct: users are bad at predicting future behavior.
  *   **The Problem:** For new features, behavioral data does not exist yet. If you follow the IRA strictly, you have *no* evidence.
  *   **The Fix:** In these cases, self-report is the *only* signal, but it must be labeled **"Unvalidated Intent."** Never ship based on "Would you use this?" alone. Treat "Yes" as "I see value here," not "I will click this."

  ---

  ### Part 4: Case Studies

  Here is the IRA applied to your three recent scenarios.

  #### Case (a): Think-Aloud Session (Immediate Hesitation)
  *   **Context:** User hesitates on a screen. Immediately after, researcher asks, "Why did you pause there?"
  *   **IRA Analysis:**
      1.  *Timing:* Immediate (Green).
      2.  *Content:* "Why" (Yellow).
      3.  *Observability:* Internal confusion (Green).
      4.  *Elicitation:* Open (Green).
      5.  *Specificity:* Specific Episode (Green).
  *   **Verdict:** **🟡 YELLOW LIGHT.**
  *   **Interpretation:** Trust that the *hesitation* occurred (behavioral data). Trust that the user felt *uncertainty* (phenomenology). **Do not trust the specific reason given.** They may be confabulating a logical reason for a visceral reaction (e.g., they say "I was reading the text," but eye-tracking shows they were distracted by the color).
  *   **Action:** Log the friction point. Use the "why" only to generate design hypotheses to test, not as proof of the root cause.

  #### Case (b): Cancellation Exit Survey (3 Days Delayed)
  *   **Context:** Email sent 3 days after downgrade. "Select your reason for leaving."
  *   **IRA Analysis:**
      1.  *Timing:* Delayed 3 days (Yellow).
      2.  *Content:* "Reason for leaving" (Yellow).
      3.  *Observability:* High. They can observe they didn't use the app (Red).
      4.  *Elicitation:* Multiple choice (Red).
      5.  *Specificity:* Generalizing a decision process (Yellow).
  *   **Verdict:** **🔴 RED LIGHT (for causal analysis).**
  *   **Interpretation:** By day 3, the user has constructed a narrative to justify the loss aversion. They are likely selecting the most socially acceptable or plausible reason (e.g., "Too expensive" vs. "I forgot to use it").
  *   **Action:** Do not use this to prioritize pricing changes. Use only for broad sentiment tracking (e.g., if 80% say "Bug," investigate bugs). Prioritize behavioral data (usage frequency prior to cancel) over this survey.

  #### Case (c): Focus Group (Privacy Dashboard Mockup)
  *   **Context:** Users shown a mockup. Asked "Would you use this?" and "Why?" Group setting.
  *   **IRA Analysis:**
      1.  *Timing:* Immediate (Green).
      2.  *Content:* Future Intent + Why (Red).
      3.  *Observability:* No behavior exists yet (Blind Spot).
      4.  *Elicitation:* Social pressure/Group setting (Red).
      5.  *Specificity:* Hypothetical (Red).
  *   **Verdict:** **🔴 RED LIGHT (for intent validation).**
  *   **Interpretation:** **This is the trap.** The product team loves this data because it is vivid and unanimous ("Yes, privacy is important to me!"). However, this measures *social desirability* and *aspirational identity*, not likely behavior. In a group, users conform to the "responsible user" norm.
  *   **Action:** **Downweight heavily.** Do not ship the feature based on this enthusiasm. This evidence proves users *value the idea* of privacy, not that they will *engage with the dashboard*. You must build a prototype and measure actual clicks (behavior) before claiming success. The "unanimous yes" is likely a false positive driven by the method, not the feature.

  ### Summary for Product Leads
  *   **Trust:** What users felt *just now*.
  *   **Doubt:** Why users say they did it.
  *   **Ignore:** What users say they *will* do in a group setting.
  *   **Rule:** If self-report contradicts behavior, behavior wins. If self-report is the only data (new features), label it "Aspiration," not "Prediction."
