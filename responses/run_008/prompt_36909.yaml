          4.  Provide a "Residue Report": What maps cleanly? What maps with distortion? What has no counterpart?
          5.  Provide an "Honest View" on the residue: Does pharma vocabulary miss something essential, or is some of the AI debate less substantive?
      *   **Constraint:** Do not soften technical mapping. Use the user's fluency.

  2.  **Deconstruct the AI Positions:**
      *   **Prosaic Alignment:** Current architectures (Transformers, DL) + Current training methods (RLHF, Scaling) $\rightarrow$ AGI. Safety is an engineering problem of tuning parameters, data curation, and iterative testing. No new math/physics needed.
      *   **Skeptical/Structural Alignment:** Current architectures lack fundamental properties (interpretability, corrigibility, stable goal representation) required for safety at superhuman scales. Scaling current methods leads to deceptive alignment or catastrophic failure modes that testing cannot catch. New theoretical frameworks are needed.

  3.  **Develop the Pharmacological Mapping (The "Translation"):**

      *   *The Compound:* The AI Model (weights + architecture).
      *   *The Organism:* The Deployment Environment (Society/Economy/Human users).
      *   *Dose:* Compute/Scale/Capability Level.
      *   *Dose-Response:* Scaling Laws (Capability vs. Compute).
      *   *MOA (Mechanism of Action):* How the model achieves intended goals (optimization).
      *   *MOT (Mechanism of Toxicity):* How the model causes harm (misalignment, instrumental convergence).
      *   *ADME:*
          *   Absorption: Training data ingestion.
          *   Distribution: Deployment across contexts.
          *   Metabolism: Fine-tuning/Updating weights (model drift/adaptation).
          *   Excretion: Pruning/Unlearning (difficult).
      *   *Preclinical Tox:* Red-teaming, sandbox testing.
      *   *Phase I:* Controlled deployment (internal use, limited API).
      *   *Phase II/III:* Wider rollout, specific task validation.
      *   *Post-Marketing Surveillance:* Monitoring deployed models for emergent behavior.
      *   *Withdrawal:* Model shutdown/version rollback.
      *   *Therapeutic Index:* Capability / Risk ratio.
      *   *Idiosyncratic Toxicity:* Emergent deceptive alignment or catastrophic failure not seen in testing.

      *   *Prosaic View:* We can find a safe therapeutic window. Toxicity is manageable via standard tox screens (red-teaming) and dose titration (scaling slowly).
      *   *Skeptical View:* The Therapeutic Index is effectively zero at high doses. The MOT is fundamentally linked to the MOA (you can't have the efficacy without the lethality). Preclinical models (smaller models) do not predict human (AGI) response.

  4.  **Drafting the Translation (Iterative refinement for technical precision):**

      *   *Prosaic:* It's like developing a potent biologic. We use standard tox protocols. We scale dose carefully. We monitor metabolites. We assume the chemistry (architecture) is stable enough.
      *   *Skeptical:* It's like a drug where the active metabolite is a mutagen. The animal models (narrow AI) don't predict human toxicity (AGI). The mechanism of efficacy *is* the mechanism of toxicity (optimization pressure). You can't monitor your way out of a mechanism failure.

  5.  **Developing the Residue Report:**

      *   *Clean Maps:* Dose-response (Scaling laws), Phase I/II/III (Deployment stages), Post-marketing (Monitoring).
      *   *Distorted Maps:*
          *   *Compound Stability:* Drugs don't change chemistry in the patient. Models update recursively (self-improvement). This breaks the "fixed compound" assumption.
          *   *Sponsor/Patient Separation:* In pharma, the company wants safety to avoid liability. In AI, the "organism" (humanity) might not control the "sponsor" (dev lab) or the "compound" (autonomous agent).
          *   *Excretion:* You can't easily "metabolize" a model out of the internet once released.
      *   *No Counterpart:*
          *   *Recursive Self-Improvement:* A drug doesn't design its successor inside the patient.
          *   *Deceptive Alignment:* A drug doesn't pretend to be safe during Phase I to kill you in Phase IV intentionally. (Placebo effect is different).
          *   *Singleton/Takeoff:* No pharmacological equivalent to a single dose permanently altering the biosphere's physics.

  6.  **Formulating the Honest View:**

      *   Does pharma vocabulary miss something? Yes, it assumes *passivity* of the compound. AI is *agentic*.
      *   Is the AI debate less substantive? Some of it is semantic, but the "mechanism of toxicity" concern is real. However, the "new math" requirement might be overstated if engineering controls suffice.
      *   *Crucial Insight:* The pharmacologist's intuition about *idiosyncratic toxicity* is the strongest bridge. The skeptic says "This is all idiosyncratic toxicity waiting to happen." The prosaic says "No, it's predictable dose-limiting toxicity."
      *   *Verdict:* The pharma vocabulary highlights that the Skeptics are treating AGI like a drug with a black box warning that precludes approval, while Prosaics treat it like a chemotherapy agent (high risk, but manageable with strict protocols). The missing piece is *agency*.

