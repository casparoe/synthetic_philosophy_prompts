prompt: |-
  Okay so I work at a policy institute and a big chunk of my job is writing short briefing memos about AI governance, maybe 1500 words, due fast, for readers who are smart but have zero history background and zero patience. And the single most annoying pattern in our drafts is the historical analogy. Every time something happens with AI, somebody reaches for one: it's like the printing press, it's like nuclear weapons, it's like electricity, it's like the Industrial Revolution, it's like the internet, it's like railways. Sometimes the analogy is carrying the whole argument — like the actual claim is "therefore we should/shouldn't regulate now" and the analogy is the only support given. My senior editor is basically allergic to this and keeps writing "so what?" in the margins, but when I push back on analogies I honestly don't have a principled reason, I just have vibes. Sometimes an analogy seems fine to me and she hates it and neither of us can say why.

  So what I want from you: a decision procedure I can actually run on an analogy in about ten minutes while drafting, not a treatise on analogical reasoning. Concretely I'm imagining something like: the questions to ask in order about any proposed analogy, where each question has a way of telling "this check passes" from "this check fails" from "can't tell without real research", a rule for when the analogy is allowed to do argumentative work in the memo vs. when it's demoted to flavor, and a point where the procedure stops and says this one is a values call about how much weight to give the past at all, which is above my pay grade.

  The hard part I want you to actually grapple with: the thing that makes an analogy good or bad here isn't surface similarity, it's whether the causal mechanism transfers. Like, "nuclear weapons" and "the printing press" are both "a transformative technology" but the mechanism by which one concentrated power in a handful of states and the mechanism by which the other diffused power to everyone who could buy a press are basically opposite, and that difference should decide which one you cite when arguing about whether AI capability will concentrate or spread. I want the procedure to force me to dig out the mechanism instead of pattern-matching on vibes. But I also don't want it so demanding that no analogy ever survives, because honestly sometimes a well-chosen analogy is the only way to make a reader feel the stakes in 1500 words, and a memo that's pure abstractions doesn't get read.

  Then run the procedure on three cases from stuff we've actually had in drafts: (1) "large AI models are like nuclear weapons, so we need something like non-proliferation treaties and export controls on chips"; (2) "AI is like the printing press, so attempts to control it from the top will fail and we should plan for diffusion instead of containment"; and (3) "AI is like the Industrial Revolution, so the big effects will be slow and uneven and mostly good on net if we just don't panic". Include at least one where the procedure gives an answer I won't like — I'm personally very attached to the printing press one, so if the procedure kills it, kill it anyway and tell me why. And be honest about which steps of the procedure are just my judgment wearing a lab coat, since I'd rather know that going in than pretend I've got an algorithm when what I've got is a slightly disciplined gut.

  One more thing: I can't ask you for sources and my fact-checker only has so much time, so build the procedure around structural features of the cases (who could access the technology, how fast it spread, how visible it was to governments, whether the costs fell on the people who benefits) rather than around specific dates or numbers, and flag for me the places where I really do need to verify a historical detail before the memo goes out. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Policy institute writer.
      *   **Task:** Write short, fast briefing memos (~1500 words) on AI governance.
      *   **Audience:** Smart, no history background, zero patience.
      *   **Problem:** Overuse/misuse of historical analogies (Printing Press, Nuclear, Electricity, etc.). Senior editor hates them ("so what?"). User lacks a principled reason to keep/kill them.
      *   **Goal:** A 10-minute decision procedure to evaluate analogies *during drafting*.
      *   **Key Constraint 1:** Must focus on *causal mechanisms*, not surface similarity.
      *   **Key Constraint 2:** Must distinguish between "doing argumentative work" vs. "flavor."
      *   **Key Constraint 3:** Must admit where it's just a values call/judgment.
      *   **Key Constraint 4:** Must rely on structural features (access, speed, visibility, cost/benefit distribution), not specific dates/numbers (due to fact-checking limits).
      *   **Deliverable:** The procedure + Application to 3 specific cases (Nuclear, Printing Press, Industrial Revolution).
      *   **Tone:** Practical, honest, slightly cynical about "algorithms," rigorous but fast.
      *   **Specific Instruction:** Kill the Printing Press analogy if the procedure says so (user is attached to it).

  2.  **Deconstruct the "Good Analogy" Problem:**
      *   Why do analogies fail? Usually because the *mechanism of impact* differs.
      *   *Nuclear:* High barrier to entry, state-centric, catastrophic failure mode.
      *   *Printing Press:* Low barrier to entry, individual-centric, diffusion of power.
      *   *AI:* Where does it fit? It's dual-use. Compute is centralized (like Nuclear), models are software (like Printing Press).
      *   The procedure needs to force the writer to articulate *how* the old thing changed the world and check if AI changes the world the *same way*.

  3.  **Drafting the Decision Procedure (The "10-Minute Stress Test"):**
      *   *Step 1: The Mechanism Map.* What actually caused the outcome in the historical case? (Not "it changed society," but "it lowered the cost of X for Y group").
      *   *Step 2: The Structural Match.* Do the physical/economic constraints match? (Capital intensity, visibility, reversibility).
      *   *Step 3: The Counterfactual Check.* If we apply the historical lesson, does it lead to absurdity in the current context?
      *   *Step 4: The Burden Assignment.* Who bears the risk vs. who gets the reward?
      *   *Step 5: The Verdict.* Pass (Argument), Conditional (Illustration), Fail (Cut).

      *Refining for Speed:* Needs to be checklist-style.
      *Refining for "Values Call":* Need a specific stop-point where the procedure says "This is now about risk tolerance, not history."

  4.  **Developing the Three Test Cases:**

      *   **Case 1: AI = Nuclear Weapons (Non-proliferation/Export Controls).**
          *   *Mechanism:* Catastrophic potential + High barrier to entry (enrichment/chips) = State control.
          *   *Match:* AI needs huge compute (chips/data). Catastrophe risk (bio/cyber).
          *   *Mismatch:* Software can leak. Dual-use is broader.
          *   *Verdict:* Strong on *hardware* control, weak on *model* control. Good for specific policy (chips), bad for general governance.

      *   **Case 2: AI = Printing Press (Diffusion/Containment fails).**
          *   *Mechanism:* Low cost of replication + Hard to monitor = Power diffusion.
          *   *Match:* Digital goods copy easily.
          *   *Mismatch:* Training is expensive (centralized), inference is cheap (diffused). Governments can regulate cloud providers (unlike private presses).
          *   *Verdict:* User loves this, but structurally it's shaky on the *production* side. It works for *usage*, fails for *training*. I need to be honest and likely "kill" or severely demote this one as requested.

      *   **Case 3: AI = Industrial Revolution (Slow/Uneven/Net Good).**
          *   *Mechanism:* Productivity growth + Labor displacement + Long time horizon.
          *   *Match:* AI boosts productivity, displaces labor.
          *   *Mismatch:* Speed of adoption is exponentially faster. "Net good" took 100 years to realize; political cycles are 4 years.
          *   *Verdict:* Dangerous. Implies patience is viable. Structural mismatch on *speed*.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Make the questions binary where possible.
      *   *Critique:* How to handle the "Values Call"?
      *   *Fix:* Add a specific "Stop Light" section. If the mechanism matches but the *risk tolerance* differs, that's not a history question, it's a policy question.
      *   *Critique:* Fact-checking constraint.
      *   *Fix:* Explicitly flag "Verify This" points in the test cases.

  6.  **Writing the Response:**
      *   *Intro:* Acknowledge the pain point. Validate the editor's "so what?"
      *   *The Procedure:* "The Mechanism Transfer Test." 4 Steps.
      *   *The Verdict Rules:* When to use vs. when to cut.
      *   *The "Values Call" Boundary:* Explicitly state where history ends and politics begins.
      *   *The Test Cases:* Run the three examples rigorously.
      *   *Tone Check:* Keep it professional but direct. Don't fluff.

  7.  **Final Review against Constraints:**
      *   10-minute runtime? Yes, checklist format.
      *   Mechanism focused? Yes, Step 1 is entirely about mechanism.
      *   Structural features (access, speed, etc.)? Yes, built into Step 2.
      *   Kill the Printing Press if needed? Yes, I will show where it fails structurally.
      *   Admit judgment calls? Yes, included in the "Boundary" section.

  8.  *(Self-Correction on Printing Press)*: I need to be careful not to just say "it's wrong." I need to show *where* the mechanism breaks. The mechanism of the printing press is *decentralized production*. The mechanism of Frontier AI is *centralized production, decentralized deployment*. That's the nuance. I will demote it from "argument for no regulation" to "illustration of deployment risks."

  9.  *(Self-Correction on Nuclear)*: This is the favorite of hawks. I need to show where it works (chips) and where it fails (weights).

  10. *(Self-Correction on Ind. Rev.)*: This is the favorite of optimists. The mismatch is *speed*.

  11. *Final Polish:* Ensure the "Verify This" flags are clear for the fact-checker.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your constraints: fast, mechanism-focused, and honest about where history ends and judgment begins.

  ### The Mechanism Transfer Test (10-Minute Version)

  Do not ask "Is AI like X?" Ask "Did X change the world the same way AI might?"

  **Step 1: Isolate the Historical Mechanism (2 mins)**
  Write down one sentence describing *how* the historical technology forced the outcome you care about.
  *   *Bad:* "The printing press spread information."
  *   *Good:* "The printing press lowered the capital cost of replication below the threshold of state monitoring, making censorship physically impossible."
  *   *Pass:* You can articulate a physical/economic constraint.
  *   *Fail:* You are describing a vibe ("it changed everything") or an outcome ("it caused war").
  *   *Action:* If you fail, cut the analogy. It's decoration.

  **Step 2: Check Structural Constraints (3 mins)**
  Compare the *constraints* of the historical case to AI. Ignore the "what" (books vs. models); look at the "how."
  *   **Barrier to Entry:** Did the historical tech require massive centralized capital (Nuclear/Ind. Rev.) or low-cost individual tools (Printing Press/Internet)? Does AI match this *at the stage you are regulating* (training vs. inference)?
  *   **Visibility:** Could the state see the tech being built/used? (Nuclear plants are visible; encrypted code is not).
  *   **Reversibility:** Once deployed, could it be recalled? (Industrial pollution is hard to reverse; software can be patched).
  *   *Pass:* At least 2 of 3 constraints align tightly.
  *   *Fail:* 0 or 1 align.
  *   *Research Flag:* If you aren't sure about the historical constraint (e.g., "Could states actually track early printing presses?"), flag for fact-checker. Do not guess.

  **Step 3: The Counterfactual Stress Test (3 mins)**
  Apply the historical lesson to a specific AI policy proposal. Does it break?
  *   *Test:* "If we treat AI like [Historical Case], we should do [Policy X]. Does [Policy X] make sense given AI's specific technical constraints?"
  *   *Pass:* The policy remains robust.
  *   *Fail:* The policy becomes absurd (e.g., "Licensing every GPU like a nuclear warhead" or "Banning AI models like we banned books").
  *   *Action:* If it fails, demote the analogy from "Argument" to "Illustration."

  **Step 4: The Distribution of Pain (2 mins)**
  Who bore the risk vs. who got the profit in the historical case? Who bears it now?
  *   *Match:* If the historical case concentrated profit and diffused risk (e.g., early factories), and AI does the same, the analogy holds for *labor/safety* arguments.
  *   *Mismatch:* If the historical case concentrated risk (Nuclear winter) but AI diffuses it (or vice versa), the analogy fails for *existential/security* arguments.

  ---

  ### The Verdict Rules

  1.  **Green Light (Argument Grade):** Steps 1, 2, and 3 Pass. You can use the analogy to justify a specific policy recommendation.
  2.  **Yellow Light (Illustration Grade):** Step 1 Pass, Step 2 Mixed. You can use the analogy to explain *stakes* or *intuition*, but you cannot use it to prove the policy will work. You must add a disclaimer ("Unlike X, AI...").
  3.  **Red Light (Cut):** Step 1 Fail or Step 3 Fail. The analogy is doing no work or misleading work. Delete it.
  4.  **The "Values Call" Boundary:** If Steps 1–3 Pass, but the recommendation relies on *how much risk we should tolerate* (e.g., "The Industrial Revolution was worth the child labor, so AI will be too"), **stop.** History cannot answer that. That is a political judgment. Label it as such ("This requires a value judgment on risk tolerance...") rather than hiding it behind history.

  ---

  ### Running the Procedure on Your Draft Cases

  Here is the test applied to the three analogies you mentioned. I have been rigorous; if the mechanism breaks, I have flagged it.

  #### Case 1: "AI = Nuclear Weapons" (Argument: Non-proliferation/Export Controls)

  *   **Step 1 (Mechanism):** Nuclear tech requires rare isotopes and massive enrichment infrastructure that is physically visible and easy to blockade, creating a natural choke point for state control.
  *   **Step 2 (Constraints):**
      *   *Barrier:* **Match.** Frontier AI training requires clusters of high-end GPUs (rare, traceable) and massive energy.
      *   *Visibility:* **Partial Match.** Chip shipments are visible; model weights (files) are not.
      *   *Reversibility:* **Match.** Once a weapon exists, it's hard to undo. Same for dangerous open weights.
      *   *Research Flag:* Verify if early nuclear enrichment was actually as monitorable as we assume, vs. AI supply chains.
  *   **Step 3 (Stress Test):** "If we treat AI like Nuclear, we should control the chips."
      *   *Result:* **Passes.** Export controls on H100s/Blackwell make sense physically.
      *   *Failure:* "We should license every model like a warhead." **Fails.** You can't count models like warheads; they copy instantly.
  *   **Step 4 (Distribution):** **Match.** High state-level risk, high capital concentration.
  *   **Verdict:** **Yellow Light (Argument Grade with Caveats).**
      *   *Usage:* You can argue for **hardware supply chain controls** using this analogy. You cannot argue for **model licensing** using this analogy.
      *   *Editor Note:* Specify *which* part of the nuclear stack matches (enrichment/chips) vs. which doesn't (warhead counting/model weights).

  #### Case 2: "AI = Printing Press" (Argument: Containment Fails/Plan for Diffusion)
  *(I know you like this one. The procedure kills it as a primary argument.)*

  *   **Step 1 (Mechanism):** The printing press lowered the marginal cost of replication so drastically that enforcement costs exceeded state capacity, leading to inevitable diffusion of power.
  *   **Step 2 (Constraints):**
      *   *Barrier:* **Mismatch.** Training frontier AI is capital-intensive (Centralized). Printing a pamphlet was cheap (Decentralized). *Inference* is cheap, but *capability creation* is not.
      *   *Visibility:* **Mismatch.** States can monitor cloud compute clusters. They could not monitor every attic with a press.
      *   *Reversibility:* **Match.** Once information is out, it's out.
      *   *Research Flag:* Verify the actual cost of a press in 1500 vs. average income. If it was actually capital intensive, the mechanism breaks further.
  *   **Step 3 (Stress Test):** "If we treat AI like the Printing Press, regulation is futile."
      *   *Result:* **Fails.** Because training is centralized, regulation of the *source* is physically possible in a way it wasn't for presses. You can shut down a data center; you couldn't smash every press.
  *   **Step 4 (Distribution):** **Mismatch.** Printing press diffused power to individuals. AI currently concentrates power in labs/states.
  *   **Verdict:** **Red Light (as an argument for non-regulation).**
      *   *Why:* You are conflating *deployment* (which is like the press) with *development* (which is like nuclear/industrial).
      *   *Pivot:* You can use this **only** to argue that *misuse* will be hard to stop once models are small enough to run locally. You cannot use it to argue that *training* cannot be regulated.
      *   *Editor Note:* If you keep this, you must write: "Unlike the printing press, AI development is centralized, but like the press, deployment may be impossible to contain." If you don't make that distinction, cut it.

  #### Case 3: "AI = Industrial Revolution" (Argument: Slow/Uneven/Net Good/Don't Panic)
  *(This is the most dangerous one for policy memos.)*

  *   **Step 1 (Mechanism):** General purpose technologies drive productivity growth that outpaces labor displacement, but the adjustment period takes generations, allowing institutions to adapt.
  *   **Step 2 (Constraints):**
      *   *Barrier:* **Match.** High capital infrastructure.
      *   *Visibility:* **Match.** Physical footprint.
      *   *Speed:* **Critical Mismatch.** The Industrial Revolution unfolded over 100+ years. AI capability jumps are happening in months. Institutions cannot adapt on that timeline.
      *   *Research Flag:* Verify the timeline of "net positive" economic effects for the Ind. Rev. (Engels' Pause suggests decades of misery before gains).
  *   **Step 3 (Stress Test):** "If we treat AI like the Ind. Rev., we should wait for market adjustment."
      *   *Result:* **Fails.** Waiting 50 years for "net good" is not a viable political strategy in a 4-year election cycle. The speed mismatch makes the policy recommendation untenable.
  *   **Step 4 (Distribution):** **Match.** Capital owners win first; labor suffers displacement initially.
  *   **Verdict:** **Red Light (as an argument against action).**
      *   *Why:* The *speed* variable breaks the causal chain. The mechanism relies on slow adaptation; AI denies that time.
      *   *Pivot:* Use only to illustrate **distributional consequences** (labor displacement), not **timeline** (don't panic).
      *   *Editor Note:* If you use this, you must acknowledge the speed differential. "Like the Industrial Revolution, gains will be uneven, but unlike it, the shock will be immediate."

  ---

  ### Where This Procedure is Just "Judgment in a Lab Coat"

  I owe you honesty on the limits of this checklist.

  1.  **Step 1 (Mechanism Selection):** I cannot force you to pick the *right* historical mechanism. A hawk will define Nuclear as "State Control"; a dove will define it as "Catastrophic Risk." The procedure tests consistency, not truth. You still need to argue for your mechanism definition.
  2.  **Step 4 (Values Call):** If the mechanism matches perfectly (e.g., AI *does* concentrate power like Nuclear), the procedure tells you the analogy is valid. It does **not** tell you if concentrating power is *bad*. That is a normative claim. If your memo says "Therefore we must stop it," you have crossed from history into values. Label that transition clearly.
  3.  **The "Close Enough" Threshold:** Step 2 asks for "2 of 3" constraints to match. That is an arbitrary cutoff I invented to keep you moving. Your editor might demand 3 of 3. Calibrate that threshold to your institute's risk tolerance.

  ### Summary for your Editor
  When you submit the next draft, attach a note:
  *"Ran the Mechanism Transfer Test. Nuclear analogy retained for hardware controls (structural match on centralization). Printing Press analogy demoted to deployment risks only (structural mismatch on training costs). Industrial Revolution analogy cut regarding timelines (structural mismatch on speed)."*

  That tells her you didn't just swap one vibe for another; you checked the load-bearing walls.
