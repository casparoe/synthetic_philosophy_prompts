prompt: |-
  I teach philosophy of science at a small state school, and every summer I co-teach the interpretation module at an archaeology field school — my job there is basically to stop the students from writing "ritual purpose" on anything they can't otherwise explain. The students are undergrads with basically no stats background and no lab access out in the field, they each produce a couple dozen interpretive write-ups over the summer (which I grade), and a few times a year the local museum sends me draft label copy to vet before it goes on the wall for the next decade. So the stakes range from a grade to something the public will read as fact for years.

  What I want is a decision procedure the students can actually run in ten minutes on an interpretive claim about an object — "this figurine represents a fertility goddess," "this pit was a ritual deposit," "these grinding stones were used to process ochre." Ground it in whatever epistemology genuinely applies here: inference to best explanation, the underdetermination problem, analogical reasoning and how it fails, the way "ritual" becomes a trash can category for the unexplained, the difference between claiming a function and claiming a meaning. Order the questions, say what counts as a sufficient answer to each, and mark where the procedure terminates in "don't make the claim," where it lands on "make it but with this qualifier," and where it has to hand the thing back to a human because it's a judgment call that can't be checklist-ified. Be honest about which steps are just dressed-up intuition.

  Then run it on three real-ish cases from last summer: (1) a clay figurine with exaggerated sexual characteristics that the museum wants to label a fertility goddess; (2) a grinding stone with red residue that the students want to say was used for ochre processing; (3) a pit of disarticulated animal bones, some burnt, which half the class wants to call a ritual deposit and the other half says is ordinary butchery waste that got scavenged and trampled. I want at least one case where the procedure gives an answer I won't like — I suspect it's going to tell me the fertility goddess label has to go, and I want to see how it justifies that, beacuse the museum director is going to fight me on it. Also tell me what the procedure can't settle at all — presumably the part where somebody decides how much interpretive risk a public label should take, which sounds like a values question rather than an evidence question, and I'd like that said out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy of Science professor, co-teaches archaeology field school.
      *   **Context:** Undergrads, no stats/lab access, high volume of writing (field notes) + high stakes (museum labels).
      *   **Problem:** Students overuse "ritual" or specific functional/semantic claims without evidence. Need a decision procedure (checklist/flowchart style) grounded in epistemology (IBE, underdetermination, analogy, etc.).
      *   **Requirements:**
          *   Create a 10-minute decision procedure.
          *   Ground it in relevant epistemology.
          *   Order the questions, define sufficient answers.
          *   Define termination points (Don't Claim, Qualified Claim, Human Judgment).
          *   Acknowledge where intuition is disguised.
          *   **Test Cases:** Run it on three specific scenarios (Fertility Figurine, Ochre Grinder, Bone Pit).
          *   **Constraint:** At least one case must yield an unwelcome result (likely the Figurine).
          *   **Constraint:** Explicitly state what the procedure *cannot* settle (values/risk).
      *   **Tone:** Professional, academically rigorous but practical, honest about limitations, slightly conversational (colleague-to-colleague).

  2.  **Deconstruct the Epistemology:**
      *   *Inference to the Best Explanation (IBE):* We need competing hypotheses.
      *   *Underdetermination:* Evidence rarely dictates one theory. Acknowledge gaps.
      *   *Analogy:* Ethnographic analogy is risky (uniformitarianism vs. specific cultural context).
      *   *Function vs. Meaning:* A tool *does* something (function) vs. what it *signifies* (meaning).
      *   *The "Ritual" Trash Can:* Ritual is often the null hypothesis for "we don't know." It needs to be the *last* resort, not the first.
      *   *Burden of Proof:* Higher for public labels than student papers.

  3.  **Drafting the Decision Procedure (The "Archaeological Claim Vetting Protocol"):**
      *   *Goal:* 10 minutes max. 5-6 steps.
      *   *Step 1: The Material Anchor.* (Is there physical evidence?)
      *   *Step 2: The Functional Baseline.* (Can a mundane explanation work?)
      *   *Step 3: The Analogy Check.* (Where is the comparison coming from?)
      *   *Step 4: The Negative Evidence.* (What's missing that should be there?)
      *   *Step 5: The Stakes Calibration.* (Student paper vs. Museum Label).
      *   *Outputs:* Reject, Qualify, Pass to Senior Interpretation.
      *   *Honesty Check:* Admit that weighing "plausibility" is intuitive.

  4.  **Developing the Test Cases:**

      *   **Case 1: The Fertility Figurine.**
          *   *Claim:* "Fertility Goddess."
          *   *Evidence:* Exaggerated sexual characteristics.
          *   *Procedure Run:*
              *   Material: Yes (clay, features).
              *   Functional/Mundane: Could be a toy, a portrait, a medical model, a votive *without* being a goddess.
              *   Analogy: Ethnographic? Or 19th-century projection?
              *   Negative: No temple context, no inscriptions, no iconographic standard.
              *   *Result:* Reject "Goddess." Qualify to "Figurine emphasizing female features."
              *   *Why:* Oversteps evidence. "Goddess" implies specific theology.
              *   *User Constraint:* This is the unwelcome result. I need to justify it strongly so the user can fight the museum director.

      *   **Case 2: The Ochre Grinder.**
          *   *Claim:* "Used for ochre processing."
          *   *Evidence:* Red residue on grinding stone.
          *   *Procedure Run:*
              *   Material: Yes (residue, wear).
              *   Functional: Grinding is the function. Ochre is the material.
              *   Analogy: Geochemical match? (User said no lab access). Visual match?
              *   Negative: Could be blood, could be iron-rich soil.
              *   *Result:* Qualify. "Residue consistent with ochre" not "Used for ochre."
              *   *Wait, make it stronger:* If no lab, we can't confirm chemistry. But wear patterns + color is strong functional evidence.
              *   *Refinement:* Let's make this one a "Pass with Qualification." It's about function, not meaning. Easier to defend.

      *   **Case 3: The Bone Pit.**
          *   *Claim:* "Ritual Deposit" vs. "Butchery Waste."
          *   *Evidence:* Disarticulated, some burnt, in a pit.
          *   *Procedure Run:*
              *   Material: Yes.
              *   Functional/Mundane: Trash pit is the null hypothesis.
              *   Analogy: Do ritual pits look different? (Whole animals? Specific arrangement?)
              *   Negative: No grave goods, no specific orientation.
              *   *Result:* Human Judgment/Reject "Ritual."
              *   *Why:* "Ritual" is being used to explain the lack of order.
              *   *Decision:* Let's make this one the "Human Judgment" case. It's genuinely ambiguous.

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the pedagogical and public value.
      *   **The Protocol:** The 5-step checklist.
      *   **Epistemic Grounding:** Briefly explain *why* each step exists (IBE, Hume, etc.).
      *   **The "Intuition" Warning:** Explicitly state where the checklist relies on gut feeling.
      *   **The Test Cases:** Run the protocol on the three scenarios.
      *   **The Unsettled Question:** Address the values/risk component (Museum Director vs. Evidence).

  6.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep the questions binary or tri-state where possible.
      *   *Critique:* Is the "Fertility Goddess" rejection too harsh?
      *   *Fix:* No, in modern archaeology, it *should* be harsh. That's the point of the user's job. I need to arm them with the argument that "Goddess" is a theological claim, not an archaeological one.
      *   *Critique:* Did I address the "no lab access" constraint?
      *   *Fix:* Ensure the Ochre case reflects the limitation of visual identification vs. chemical analysis.
      *   *Critique:* Did I highlight the values question?
      *   *Fix:* Make sure the conclusion explicitly separates *epistemic warrant* from *interpretive risk*.

  7.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   10 minutes? Yes (concise).
      *   Epistemology grounded? Yes (IBE, Underdetermination).
      *   Termination points? Yes.
      *   Intuition admitted? Yes.
      *   Three cases run? Yes.
      *   Unwelcome result included? Yes (Figurine).
      *   Values question highlighted? Yes.

  8.  **Final Polish:** Tone check. Ensure it sounds like one academic talking to another, respecting their expertise while providing the tool. (e.g., "Here is the tool you asked for," "As you know...")

  *(Self-Correction on Case 2)*: If they have no lab access, claiming "ochre" is risky. It could be cinnabar, hematite, or blood. I should make the procedure flag this as a "Qualified Claim" at best. "Used to process red pigment" is safer than "ochre." Actually, let's make the procedure catch the leap from "red stuff" to "ochre."

  *(Self-Correction on Case 3)*: The bone pit is the classic "ritual vs. rubbish" debate. I should ensure the procedure forces them to define *why* it's ritual. If the answer is "it's weird," that's not enough.

  *(Final Plan)*: Proceed with generating the response based on these thoughts.cw
answer: |-
  This is a classic pedagogical and public-facing problem: managing the gap between *evidence* (what is in the ground) and *narrative* (what goes on the wall). You are asking for a tool that operationalizes skepticism without paralyzing interpretation.

  Below is the **Archaeological Claim Vetting Protocol (ACVP)**. It is designed to be printed on a single sheet, laminated, and kept in a pocket. It takes the student or curator through five epistemic filters. Following the protocol, I have run your three cases through it, including the unwelcome result you anticipated.

  ### The Archaeological Claim Vetting Protocol (ACVP)
  **Time limit:** 10 minutes per claim.
  **Goal:** Prevent "Ritual" from becoming the null hypothesis for the unexplained.

  #### Step 1: The Material Anchor (Empiricism Check)
  *Question:* What physical property necessitates this specific claim?
  *   **Pass:** The claim describes a physical property directly (e.g., "The stone is abraded," "The bone is burnt").
  *   **Fail:** The claim describes a state of mind, a theology, or a social function not inherent in the material (e.g., "The stone is sacred," "The bone is an offering").
  *   *Epistemic Ground:* Distinguishes observation from theory-laden description.
  *   *Action:* If **Fail**, rephrase the claim to describe the material only, or move to Step 2.

  #### Step 2: The Mundane Null (Inference to Best Explanation)
  *Question:* Is there a functional, domestic, or accidental explanation that fits the data equally well?
  *   **Pass:** No. The mundane explanation requires *more* assumptions than the interpretive claim (e.g., a gold mask in a drain is harder to explain as "trash" than "hoard").
  *   **Fail:** Yes. The mundane explanation is simpler (e.g., broken pot in a midden = trash, not "decommissioned ritual vessel").
  *   *Epistemic Ground:* Occam's Razor / Hume's maxim on miracles. "Ritual" is a high-cost explanation; it requires evidence of non-utility.
  *   *Action:* If **Fail**, **TERMINATE: DO NOT MAKE CLAIM.** (Exception: Step 5).

  #### Step 3: The Analogy Audit (Uniformitarianism Check)
  *Question:* What is the source of the comparison used to identify the object's meaning?
  *   **Pass:** Direct historical continuity or controlled ethnographic analogy with explicit caveats (e.g., "Similar to Hopi kachina dolls, though culture is distinct").
  *   **Fail:** Universalist intuition, 19th-century typology, or "It looks like X from a different continent/era." (e.g., "Fat women figurines always equal fertility").
  *   *Epistemic Ground:* The problem of Induction. Analogies are heuristic, not proof.
  *   *Action:* If **Fail**, **TERMINATE: DOWNGRADE TO DESCRIPTION.**

  #### Step 4: The Negative Evidence Scan (Underdetermination Check)
  *Question:* What evidence *should* be present if this claim were true, that is currently absent?
  *   **Pass:** You can list the missing evidence, and its absence is explainable (e.g., "No temple structure found, but erosion is severe").
  *   **Fail:** The absence is ignored, or the claim relies on the *lack* of evidence (e.g., "It has no utilitarian use, therefore it is ritual").
  *   *Epistemic Ground:* Underdetermination of theory by data. Absence of evidence is not evidence of absence, but it limits certainty.
  *   *Action:* If **Fail**, **FLAG FOR HUMAN JUDGMENT.**

  #### Step 5: The Stakes Calibration (Pragmatic Check)
  *Question:* Who is reading this, and for how long?
  *   **Student Paper:** Low stakes. Error is a learning opportunity.
  *   **Museum Label:** High stakes. Error becomes permanent public fact.
  *   *Action:*
      *   If **Student Paper** + Steps 1-4 Passed: **MAKE CLAIM.**
      *   If **Student Paper** + Steps 1-4 Failed: **MAKE CLAIM WITH QUALIFIER** ("May represent," "Possibly").
      *   If **Museum Label** + Any Step Failed: **TERMINATE: DO NOT MAKE CLAIM.** (Revert to Step 1 description).

  ---

  ### Where the Protocol is "Dressed-Up Intuition"
  Be honest with your students: **Step 2 (The Mundane Null)** is where intuition hides. Deciding what counts as a "simpler" explanation relies on the evaluator's background knowledge of human behavior. Is it simpler to assume ancient people were practical or symbolic? The protocol forces you to state the null hypothesis, but it cannot mathematically prove which hypothesis is "simpler." That is a judgment call.

  ---

  ### Running the Cases

  Here is the ACVP applied to your three scenarios from last summer.

  #### Case 1: The Clay Figurine ("Fertility Goddess")
  *   **Context:** Museum Label Draft.
  *   **Claim:** "This figurine represents a fertility goddess."
  *   **Evidence:** Clay, female form, exaggerated breasts/hips.

  **The Run:**
  1.  **Material Anchor:** **FAIL.** "Goddess" is a theological status, not a physical property. The clay does not contain "divinity."
      *   *Correction:* Rephrase to "Figurine emphasizing female secondary sexual characteristics."
  2.  **Mundane Null:** **FAIL.** Can a mundane explanation fit? Yes. It could be a toy, a portrait of an ancestor, a medical teaching model, or a votive to a *spirit* (not a goddess). The "Fertility" claim assumes the function without ruling out "doll" or "portrait."
  3.  **Analogy Audit:** **FAIL.** Source of comparison? Likely 19th-century "Mother Goddess" tropes or ethnographic analogy from a culture 3,000 miles away and 2,000 years later. No direct historical continuity.
  4.  **Negative Evidence:** **FAIL.** What should be there? Inscriptions, temple context, iconographic consistency across multiple finds. None present.
  5.  **Stakes:** **Museum Label.** High stakes.

  **Verdict:** **TERMINATE: DO NOT MAKE CLAIM.**
  **Required Label Copy:** "Clay figurine depicting a female form with exaggerated features. Interpretations vary; possibilities include a domestic object, a votive offering, or a representation of a cultural ideal."

  **Why you won't like this (and why the Director will fight):**
  The protocol kills the narrative hook. "Fertility Goddess" sells tickets; "Clay object with big hips" does not. The epistemic justification is that "Goddess" implies a specific pantheon and theology (Meaning) that the material (Function/Form) cannot support. You are conflating *symbolism* with *specific identity*. The protocol forces you to admit that we don't know *which* goddess, or if it's a goddess at all.
  *   **Your Argument to the Director:** "If we label this a Goddess, we are teaching theology, not archaeology. If a visitor asks 'Which goddess?', we have to lie. The ACVP shows we lack the negative evidence to rule out 'toy' or 'ancestor portrait.' We can say 'Symbol of fertility' (qualified), but not 'Goddess' (factual)."

  #### Case 2: The Grinding Stone ("Ochre Processing")
  *   **Context:** Student Field Write-up.
  *   **Claim:** "This stone was used to process ochre."
  *   **Evidence:** Sandstone grinder, red residue on surface.

  **The Run:**
  1.  **Material Anchor:** **PASS (with tweak).** "Used to process" is functional. "Ochre" is a material identification.
  2.  **Mundane Null:** **PASS.** Grinding is the function. Is there a mundane reason for red dust? Yes, grinding iron-rich soil. But "processing pigment" is the functional null for a grinder with pigment on it. It doesn't require "ritual."
  3.  **Analogy Audit:** **PASS.** Ground stone + red residue is a universal functional analog. We don't need to know the culture to know stone grinds soft minerals.
  4.  **Negative Evidence:** **FAIL (Technical).** Without lab access (XRF or microscopy), can they distinguish ochre from dried blood or red clay soil? No.
  5.  **Stakes:** **Student Paper.** Low stakes.

  **Verdict:** **MAKE CLAIM WITH QUALIFIER.**
  **Required Wording:** "Residue consistent with ochre processing. (Note: Chemical analysis required for positive identification)."
  **Why:** The protocol allows functional claims based on wear patterns, but flags the material ID as probabilistic due to the lack of lab access. This teaches the student the difference between *use-wear* (high confidence) and *residue analysis* (low confidence without lab).

  #### Case 3: The Bone Pit ("Ritual Deposit" vs. "Butchery Waste")
  *   **Context:** Student Field Write-up (Disputed).
  *   **Claim:** "Ritual Deposit" (Class A) vs. "Butchery Waste" (Class B).
  *   **Evidence:** Disarticulated animal bones, some burnt, in a pit.

  **The Run:**
  1.  **Material Anchor:** **PASS.** Both claims address the arrangement and state of the bones.
  2.  **Mundane Null:** **TIE.** "Butchery Waste" is the mundane null. However, "Ritual Deposit" is claimed because the arrangement is "odd."
  3.  **Analogy Audit:** **FAIL.** Do we have ethnographic data for ritual bone pits in this specific culture? No. Are we assuming "weird arrangement = ritual"? Yes.
  4.  **Negative Evidence:** **FAIL.** What distinguishes a ritual pit from a trash pit here? Usually: whole animals, specific orientation, lack of cut marks. The bones are disarticulated and burnt. This looks *more* like a trash pit that was subsequently burned (sanitation) than a ritual cache.
  5.  **Stakes:** **Student Paper.**

  **Verdict:** **FLAG FOR HUMAN JUDGMENT.**
  **Reasoning:** The protocol halts here because Step 4 reveals genuine underdetermination. The evidence supports *both* narratives equally well (or poorly).
  **Instruction to Students:** "You cannot resolve this with the current data. Write two paragraphs. Paragraph 1: The case for Butchery (cut marks, disarticulation). Paragraph 2: The case for Ritual (context of pit, burning). Conclude with: 'Current evidence is insufficient to distinguish between sanitary disposal and ritual deposition.'"
  **Why:** This stops them from picking a side based on intuition. It forces them to document the *ambiguity* as the finding.

  ---

  ### What The Procedure Cannot Settle (The Values Question)

  You asked for honesty about where the checklist fails. It fails at the **Risk/Reward Ratio** in Step 5.

  The ACVP can tell the Museum Director that the "Fertility Goddess" claim is *epistemically unsafe*. It cannot tell the Director whether it is *ethically permissible* to present an unsafe claim if it generates revenue to keep the museum open.

  *   **The Epistemic Question:** "Is there sufficient evidence?" (The ACVP answers **No**).
  *   **The Axiological Question:** "Is it better to mislead the public slightly to engage them, or to bore them with accuracy?" (The ACVP has no answer).

  This is where you, the philosopher, must intervene with the Director. The procedure protects *your* professional integrity and the *students'* training. It does not protect the museum's budget. You need to make sure the administration understands that when the ACVP says "Terminate," it means "We are lying if we proceed."

  If they choose to lie despite the protocol, that is no longer an archaeological problem; it is a governance problem. The ACVP ensures that if they do lie, they do so knowing it is a lie, rather than mistaking it for science.
