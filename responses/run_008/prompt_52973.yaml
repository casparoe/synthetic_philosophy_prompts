answer: |-
  1. The practice presupposes a realist ontology where ideas and expressions are distinct categories capable of being separated, rather than inseparable aspects of a unified semantic whole. This allows courts to treat the boundary as a discoverable fact rather than a purely normative policy line.
  2. A Quinean holism regarding meaning would rule out the dichotomy by suggesting that content cannot be individuated independently of the specific linguistic or artistic vehicle used to convey it. If meaning is wholly determined by use, the legal attempt to isolate an abstractable idea becomes metaphysically incoherent.
  3. The abstraction test assumes ideas are hierarchically structured entities with natural joints, implying that specificity correlates directly with ownership eligibility. This contradicts the nominalist view that levels of abstraction are merely pragmatic tools without corresponding metaphysical reality.
  4. The doctrine is philosophically underdetermined because functionalist policy goals could justify the same outcomes without committing to any specific metaphysics of content. Judges could reach identical verdicts by weighing incentives against access while remaining agnostic about whether ideas truly exist as distinct objects.
  5. Ultimately, the insistence that ideas are not property masks a normative selection process where courts decide which abstractions should remain free based on cultural utility rather than ontological status. This reveals the dichotomy as a rhetorical device for managing monopoly scope rather than a description of pre-legal conceptual boundaries.
