answer: |-
  You have stumbled into one of the most fascinating corners of decision theory. You are correct that the Pasadena Game (Nover & Hájek, 2004) is a refinement of the St. Petersburg Paradox, but it is arguably more vicious because it breaks the expected value (EV) calculation in a way that St. Petersburg does not.

  In St. Petersburg, the EV is $+\infty$. In Pasadena, the EV is **undefined**.

  Here is the breakdown of why your arbitrage intuition is understandable but mathematically impossible, what you should use instead of EV, and why philosophers insist on calling this a "paradox."

  ### 1. The Arbitrage Illusion: Why you can't "choose the order"

  Your intuition is: *"If the sum depends on the order, and I can rearrange conditionally convergent series to equal anything (Riemann Rearrangement Theorem), can't I just calculate the order that gives $+\infty$, pay \$1 million to play, and win?"*

  **The short answer:** No, because the "order" is not a degree of freedom available to the player or the casino. It is a property of how the expectation is defined mathematically.

  **The long answer:**
  In probability theory, the Expected Value is defined as the Lebesgue integral of the random variable with respect to the probability measure: $E[X] = \int X \, dP$.
  For this integral to be well-defined and unique, the random variable must be **absolutely integrable**. That means $\sum |P(n) \cdot \text{Payoff}(n)|$ must converge.

  In the Pasadena game:
  *   Probability of stopping at $n$: $P(n) = 1/2^n$
  *   Payoff: $X_n = (-1)^{n-1} \frac{2^n}{n}$
  *   Term in the sum: $P(n) \cdot X_n = \frac{(-1)^{n-1}}{n}$

  The series $\sum \frac{(-1)^{n-1}}{n}$ converges to $\ln(2)$ in its natural order ($1 - 1/2 + 1/3 \dots$). **However**, the sum of absolute values is the harmonic series $\sum \frac{1}{n}$, which diverges to infinity.

  Because it is not absolutely convergent, the Expectation is **undefined** in rigorous measure-theoretic probability. The fact that you can rearrange the terms to sum to anything is a property of the *series representation*, not the *game*. You cannot physically rearrange the outcomes of a coin flip. The coin flip produces outcome $n$ with probability $1/2^n$. That mapping is fixed by physics/probability, not by your calculator.

  **Where the pricing breaks:**
  You asked if a casino could set any price they want. In a sense, yes. Because the EV is undefined, there is no "fair price" derived from expectation.
  *   If the casino charges \$1, is it a good deal? EV theory can't say.
  *   If you offer \$1,000,000 to play, is it rational? EV theory can't say.

  This isn't an arbitrage opportunity; it's a **model failure**. It's like asking "What is the temperature of this idea?" The question presupposes a framework (temperature/EV) that doesn't apply to the object (idea/Pasadena Game). There is no arbitrage to exploit because there is no coherent value to exploit.

  ### 2. If EV is broken, what do we use?

  If Expected Utility Theory (EUT) cannot assign a value to the Pasadena Game, normative decision theory suggests a few paths. None are perfect, which is part of why the problem remains open.

  **A. Bounded Utility Functions (The Standard Fix)**
  The most common resolution to St. Petersburg and Pasadena is to argue that money does not map linearly to utility. If your utility function $U(x)$ is bounded (e.g., $U(x) = \arctan(x)$ or logarithmic wealth), the Pasadena series becomes absolutely convergent.
  *   *Pros:* Mathematically robust; eliminates the paradox.
  *   *Cons:* Implies there is a maximum possible value to existence, which some find philosophically unpalatable.

  **B. Risk Measures (Median, VaR, CVaR)**
  You mentioned the median. In heavy-tailed distributions, the median is often a better descriptor of "typical" experience than the mean.
  *   *Median:* For Pasadena, the median payoff is actually quite small (since 50% of the time heads appears on flip 1 or 2).
  *   *Pros:* Robust against the infinite tails.
  *   *Cons:* As you noted, it throws away information. A gamble with a 1% chance of saving the world might have a low median but high importance. Also, maximizing median utility can violate transitivity (A > B, B > C, but C > A).

  **C. Truncation (The Real-World Solution)**
  No casino has infinite money. No game can last forever (the heat death of the universe limits $n$). If you impose a maximum cap $N$ on the number of flips or a bankroll limit, the series becomes finite, the sum is absolute, and EV works again.
  *   *Takeaway:* The Pasadena Game is a "limit paradox." It only exists in the infinite limit. In any physically realizable scenario, the EV is finite and well-defined (though potentially volatile).

  **D. Accept Incomparability**
  Some decision theorists (including Hájek) suggest we should accept that some gambles are **incomparable**. It is not rational to pay \$100 to play, nor is it rational to refuse. The tools of rationality simply run out of road. This requires weakening axioms like *Countable Additivity* or *Dominance*.

  ### 3. Why call it a "Paradox"?

  You are right to be skeptical. Mathematically, it is not a paradox. Mathematicians have known about conditionally convergent series since Riemann (1854). There is no contradiction in the math.

  It is called a paradox because it is a **Normative Paradox**, not a Logical one.

  1.  **Premise 1:** Rational agents ought to maximize Expected Utility.
  2.  **Premise 2:** The Expected Utility of the Pasadena Game is undefined (or depends on arbitrary summation order).
  3.  **Conclusion:** Rational agents cannot decide whether to play the Pasadena Game.

  This contradicts the intuition that a rational agent *should* be able to compare two clear options (e.g., "Play Pasadena" vs. "Take \$5"). If EV theory says "I cannot compute a value," but your intuition says "Obviously I shouldn't pay my life savings for this," then the theory is failing to match rational intuition.

  Furthermore, Nover and Hájek showed that if you try to force a value (like $\ln(2)$), you violate the **Dominance Principle**. You can construct a modified Pasadena game that pays strictly more in every single outcome, yet has a lower "Expected Value" under certain summation conventions. If Theory says Game B is worse than Game A, but Game B pays more in every possible reality, the Theory is broken.

  ### Summary

  *   **Arbitrage:** You cannot exploit the summation order because the order is fixed by the probability measure, not your calculation. The "undefined EV" means pricing is incoherent, not that there is free money.
  *   **Decision Tool:** In practice, use **Bounded Utility** or **Truncation**. In theory, you may have to accept that some decisions are incomparable.
  *   **Paradox Status:** It's a paradox of *decision theory*, not math. It proves that Expected Utility Theory is incomplete for distributions with heavy tails and alternating signs.

  The Pasadena Game is essentially a "division by zero" for economics. It doesn't mean the universe is broken; it means the formula you are using has a domain error.
