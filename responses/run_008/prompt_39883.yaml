      *   The conclusion that "belief causes walking" is true *at the macro level*, but it doesn't mean the belief bypasses neurons. It means the belief *is* a specific configuration of neurons.
      *   Dan is conflating *levels of description* with *levels of causal power*.
      *   *Verdict:* The analogy illustrates *supervenience* and *emergence*, but it doesn't prove *downward causation* in the sense of the pattern exerting a force distinct from the parts. It survives only if you redefine "cause" to mean "reliable pattern prediction" rather than "physical force."

