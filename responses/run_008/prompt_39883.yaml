      *   Dan says: "You accept pressure pushes pistons."
      *   Physics view: Pressure *is* molecular collisions. There is no extra "pressure force" added to the molecular force.
      *   Philosophical view: This is the classic "Causal Exclusion Problem" (Jaegwon Kim). If the micro-level is causally closed, what work is left for the macro-level to do?
      *   Resolution: Macro-causation is usually understood as *counterfactual dependence* or *explanatory utility*, not ontological addition of force.

  4.  **Audit the Analogy (Mapping & Breaking Points):**
      *   *Mapping:*
          *   Symms $\rightarrow$ Neurons/Atoms.
          *   Symmballs $\rightarrow$ Mental States.
          *   Movement $\rightarrow$ Behavior.
