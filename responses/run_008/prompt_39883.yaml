          2.  **Passive vs. Active:** Billiard balls are passive. They move only when hit. Neurons are active; they have thresholds, refractory periods, and modulate their own sensitivity.
          3.  **The "Pushing" Mechanism:** In the Careenium, the symmball *is* the arrangement of symms. The symms don't move *because* they are a symmball; they form a symmball *because* of how they moved. The causality is still bottom-up. The "pattern" doesn't reach down and grab a symm.
          4.  **Energy Conservation:** If the symmball added extra force to the symms, energy would be created. Dan needs to explain where the energy comes from. If it doesn't add energy, in what sense is it "pushing"?

