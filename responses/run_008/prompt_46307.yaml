answer: |-
  The single core move is to frame Turchin's theory as a diagnostic of structural vulnerability rather than a prophecy of specific events.

  **Dependency Structure**
  Stick to your instinct: establish the Malthusian core (population vs. resources/wages) before introducing elite overproduction. If you begin with elites, the Popperians and skeptics will interpret the theory as a variant of class warfare or great-man history, where agency drives the cycle. By starting with demographic pressure and real wage stagnation, you establish the *constraints* within which elites operate. Elite overproduction must be presented as a demographic inevitability resulting from the expansion phase (more wealth creates more elite aspirants) colliding with the stagnation phase (fixed number of power positions), rather than mere greed. This ordering forces the audience to see intra-elite competition as a symptom of systemic pressure, which insulates the theory against the charge that it is just a moral story about rich people.

  **Historical Case Recommendation**
  Use **Early Modern England (1480–1680)** spanning the trough after the Wars of the Roses to the trough of the English Civil War/Interregnum. This is Turchin's canonical example, offering the clearest data on wages and population available for pre-industrial societies.
  *   **Must Contain:** Clear data points showing population recovery followed by real wage stagnation; evidence of state fiscal distress (inability to tax); and the fragmentation of elites (e.g., the proliferation of gentlemen vs. available offices) leading to political violence.
  *   **Must Not Contain:** Do not attribute the crisis primarily to exogenous shocks like the Spanish Armada or specific monarchic incompetence. While these exist, your narrative must treat them as stressors that broke a already brittle system, not as the root cause. If you allow the audience to attribute the collapse to "Charles I was stubborn" or "Spain attacked," the structural model fails.
  *   **Pushback on Exogenous Shocks:** You are correct to avoid cases dominated by external shocks, but do not claim the cycle exists in a vacuum. Acknowledge that shocks trigger the crisis, but emphasize that the *magnitude* of the crisis is determined by the structural vulnerability built up during the secular cycle.

  **Misconception Map**
  1.  **"History repeats in fixed periods":** Defuse this immediately after outlining the mechanism. Clarify that "cycles" refers to phases of expansion, stagnation, and crisis, not a calendar clock. The duration varies based on initial conditions and external factors.
  2.  **"Astrology with differential equations":** Address this by highlighting the causal mechanism. Astrology correlates positions without mechanism; Turchin posits that population pressure *causes* wage decline, which *causes* fiscal stress. The math describes the relationship, it does not generate the prophecy.
  3.  **The Popperian Objection:** Introduce this limitation **after** explaining the mechanism but **before** walking through the historical case. State plainly: "Popper was right that we cannot predict specific historical events; this model does not predict *who* will rebel or *when* the king will fall, only that the probability of instability rises as these variables diverge." This pre-emptively inoculates your Popperians; they will listen to the case study as evidence of correlation with instability risks rather than a falsifiable prediction of specific dates.

  **Closing Question and Exclusions**
  End with this question: "If this model is valid, can it tell us which party will win the next election, or only whether the election is likely to be contested with unusual intensity?" This forces them to distinguish between aggregate structural conditions and particular political outcomes.

  **Openly Decline to Cover:**
  1.  **The Mathematics:** State plainly you will not walk through the differential equations, as the logic holds without the calculus.
  2.  **Policy Prescriptions:** Decline to discuss what we *should do* about current cycles; keep the session on diagnosis, not cure.
  3.  **Current Event Labeling:** Refuse to definitively label the current year as "crisis" or "stagnation" during the talk; frame the present only as an application of the lens, not a finalized verdict, to avoid turning the discussion into a political debate.
