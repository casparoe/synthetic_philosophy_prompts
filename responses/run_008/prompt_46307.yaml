          *   *Constraint Check:* Must not rely on exogenous shocks. The English Civil War is endogenous to the model. Avoid cases where a random plague starts it (though Black Death is the *start* of the previous cycle, the recovery phase is key). Actually, **The United States (1800–2020)** might be more resonant for a modern group, but Turchin's data is strongest on pre-industrial societies. However, he applies it to the US. Let's stick with **Early Modern England (1500–1700)** because the data (real wages, population) is the canonical example Turchin uses to prove the mechanism before applying it to today. It's distinct enough to be "history" but familiar enough (Tudors, Stuarts, Civil War).
