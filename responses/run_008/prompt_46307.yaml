      *   **Dependency Structure:** The user suggests Malthusian core -> Elite Overproduction. Is this right? Yes. Elite overproduction makes sense as a *consequence* of demographic/economic pressure (more people competing for fixed elite slots) rather than just greed. If you start with elites, it looks like class warfare. If you start with demographics/wages, it looks like systemic pressure.
