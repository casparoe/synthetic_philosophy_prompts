  so my friend and i argued for like 3 hours last night about whether math is real and i'm still annoyed. he's been reading about this benacerraf thing and now he's convinced that numbers are just made up. his argument: we can never causally interact with an abstract object, so we can never have justified beliefs about numbers, therefore benacerraf "proved" numbers don't exist and all of math is basically a game we invented. he also threw in something about set theory — he says the set theorists themselves can't even decide what the number 3 is supposed to be, since you can build the numbers out of sets in multiple ways and get different answers, so there's no fact of the matter at all about what 3 is.

  i tried pushing back that we obviously DO know tons of stuff about numbers? like, we proved there are infinitely many primes, and that's not going to turn out wrong. he says that doesn't count as real knowledge because no causal chain ever connected my brain to the number 3. then he asked me how I physically interacted with the primes before knowing stuff about them and i kind of froze.

