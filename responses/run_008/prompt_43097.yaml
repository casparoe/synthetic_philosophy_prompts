      *   *Section 2: The "Unified Ontology" Defeater (The Metaphysical Kill Shot).* Kevin de Queiroz's General Lineage Concept. If species are *just* lineages, and criteria are just properties, monism wins ontologically. Pluralists retreat to "epistemic pluralism." Is that a surrender?
      *   *Section 3: The Practical/Conservation Defeater (The Pragmatic Kill Shot).* If we can't legislate pluralism. If protecting "Species A" (Biological) leaves "Species A" (Phylogenetic) extinct. This forces a choice, implying one *must* be privileged in practice.
