      *   *Nuance:* The General Lineage Concept (GLC) is the biggest hurdle. I need to explain why a pluralist might accept GLC but still remain a pluralist (the "Two-Stage" view).
      *   *Tone Check:* Keep it respectful but challenging. Don't talk down, but don't assume they know graduate-level philosophy of biology jargon without explanation.
