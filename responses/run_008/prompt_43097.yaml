      *   *Anti-realism:* Pluralism $\neq$ Anti-realism. One can be a *pluralistic realist*. But the line is thin.
      *   *Conservation:* This is the biggest practical headache. "Evolutionarily Significant Units" (ESUs) are often the workaround.
      *   *Unfalsifiability:* Is it a bug or a feature? In metaphysics, some flexibility is expected, but total immunity is suspicious.

