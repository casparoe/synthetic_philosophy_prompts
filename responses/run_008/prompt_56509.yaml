          *   The single number is a **summary statistic** of an ensemble, not a measurement of a physical property.
          *   So, it doesn't presuppose a "sharp number" exists in the clouds; it presupposes a **utility function** that says "one number is best for decision making."
      *   *Section 2: The Philosophy of Imprecise Probability.*
          *   Connect to the user's reading. Mention "Credal Sets" or "Upper/Lower Probabilities."
          *   Explain why meteorology usually avoids this: Cognitive load.
      *   *Section 3: What would change? (The Practical Side).*
