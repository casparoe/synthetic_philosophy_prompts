      *   **Interpretations of Probability:**
          *   *Frequentist:* Long-run frequency. (Hard to apply to single unique weather events).
          *   *Bayesian (Subjective):* Degree of belief. (Fits forecasting well).
          *   *Imprecise Probability:* Sets of priors/probabilities. (Fits the user's intuition about model spread).
      *   **Decision Theory:** How do users *act* on the info? A 40% from a tight distribution might trigger an umbrella. A 40% from a bimodal distribution (0% or 100%) might trigger "wait and see" or "cancel picnic."
      *   **Communication:** Cognitive load. Do people understand ranges? (Research suggests people often collapse ranges to the midpoint).

  3.  **Address the Specific Questions:**

      *   *Q1: What does publishing one number presuppose?*
