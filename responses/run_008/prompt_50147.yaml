prompt: |-
  I help run a little film discussion group, and an argument from last week has been stuck in my head since. We were talking about review aggregators, because someone noticed the same movie can sit at like 85% on Rotten Tomatoes and a 45 metascore on Metacritic, and studios happily put whichever number looks better on the poster. The way these sites work is actually pretty different: Rotten Tomatoes just counts professional reviews as thumbs-up or thumbs-down and reports the percentage that came in positive. Metacritic converts each review into a number, weights some publications more heavily than others, and averages everything into a single 0-100 score. And then there's the IMDb user score, where the "judges" are basically whoever made an account. Three numbers, three methods, one movie, and the industry treats all of them as if they measure the same thing.

  What I want to figure out is what each of these practices presupposes about taste. Does the Tomatometer presuppose that aesthetic judgment is fundamentally binary and that the right move is just to poll — like, the standard is whatever the majority of critics converge on? Does Metacritic presuppose something much stronger, an actual common quantitative scale of quality, the way temperature is a scale, such that one movie can be strictly "twice as good" territory as another? And does the user score presuppose nothing about quality at all and just measure audience satisfaction? I'm also bothered by the weighting thing: Metacritic quietly deciding that certain outlets count more seems like it smuggles in a claim about who the real judges are, without ever saying what makes them real.

  The framework I keep reaching for is Hume's "Of the Standard of Taste," where the standard comes from the joint verdict of qualified judges — the ones with practice, lots of comparison, freedom from prejudice, good sense. Naively an aggregator looks like exactly that machine: poll the critics, let the verdict emerge. But the Tomatometer's binary threshold throws away exactly what a Humean judge would care about (degree of admiration), and the user score lets anyone vote regardless of Hume's qualifications. So: reconstruct the implicit theory of taste behind each of the three practices, tell me whether the industry is committed to mutually inconsistent theories in different places or whether they're all somehow compatible, and say what an aggregator designed from scratch around Hume's standard would have to do differently — who counts as a judge, how you'd ever identify them, and what you'd even report at the end. And if you think Hume is just the wrong lens entirely — say the sites really presuppose something like prediction markets for consumer satisfaction rather than any standard of taste — I'd honestly like to hear that argued too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Film discussion group, argument about review aggregators (Rotten Tomatoes, Metacritic, IMDb).
      *   **Core Observation:** Same movie gets vastly different scores (e.g., 85% RT, 45 Meta). Studios cherry-pick.
      *   **Mechanism Differences:**
          *   RT: Binary (Fresh/Rotten), percentage of positive reviews.
          *   Meta: Weighted average, 0-100 scale, editorial weighting of sources.
          *   IMDb: User voting, unweighted average (mostly), anyone can vote.
      *   **Philosophical Question:** What theory of *taste* does each presuppose?
          *   RT: Binary aesthetic judgment? Majority rule?
          *   Meta: Quantitative scale of quality (cardinal utility)? Elite consensus?
          *   IMDb: Audience satisfaction? Democratic populism?
      *   **Specific Framework:** David Hume's "Of the Standard of Taste" (qualified judges, joint verdict).
      *   **Tasks:**
          1.  Reconstruct the implicit theory of taste behind each practice.
          2.  Analyze consistency/compatibility of these theories within the industry.
          3.  Design a Humean aggregator (who counts, how to identify, what to report).
          4.  Critique Hume: Is he the wrong lens? (e.g., prediction markets/consumer satisfaction).

  2.  **Analyze the Three Aggregators through Philosophical Lenses:**

      *   **Rotten Tomatoes (The Tomatometer):**
          *   *Mechanism:* Binary classification (Fresh/Rotten) $\rightarrow$ Percentage.
          *   *Implicit Theory:* It's not about *how good*, it's about *is it competent/acceptable?* It presupposes a threshold of minimal artistic integrity. It's a consensus of *recommendation*, not quality.
          *   *Humean View:* Fails Hume because it discards nuance. A "Fresh" review could be lukewarm. It treats all critics equally (one publication, one vote), ignoring Hume's "qualified judge" hierarchy.
          *   *Philosophical Label:* *Threshold Deontology* or *Consensus of Validity*.

      *   **Metacritic:**
          *   *Mechanism:* Normalization to 0-100 $\rightarrow$ Weighted Average.
          *   *Implicit Theory:* Quality is cardinal (measurable on a scale). Some critics are better than others (elitism/curatorial authority). Commensurability (a 7/10 from Variety = a 70/100 from Empire).
          *   *Humean View:* Closer to Hume because it acknowledges "stronger" judges (weighting). However, the normalization process assumes a universal scale of taste, which Hume might find suspicious (though he believes in a standard, he knows it's hard to pin down numerically).
          *   *Philosophical Label:* *Weighted Utilitarianism* or *Technocratic Elitism*.

      *   **IMDb:**
          *   *Mechanism:* User votes $\rightarrow$ Average.
          *   *Implicit Theory:* Taste is democratic. Satisfaction = Quality. The "wisdom of the crowd."
          *   *Humean View:* Directly contradicts Hume. Hume explicitly argues *against* the "vox populi" as a standard of taste.
          *   *Philosophical Label:* *Populist Subjectivism* or *Market Satisfaction*.

  3.  **Address the Industry's Commitment:**

      *   Are they inconsistent? Yes, functionally.
      *   Are they compatible? Pragmatically, yes. They serve different functions in the marketing funnel.
      *   *RT:* "Is this safe to watch?" (Risk reduction).
      *   *Meta:* "How prestigious is this?" (Award signaling).
      *   *IMDb:* "Will the broad audience like this?" (Box office prediction).
      *   *Synthesis:* The industry isn't committed to *one* theory of taste; it's committed to *maximizing revenue*. The theories are tools, not truths.

  4.  **Design a Humean Aggregator:**

      *   *Who counts?* Not just "critics." Need "True Judges."
      *   *Criteria:* Delicacy of taste, practice, comparison, freedom from prejudice, good sense.
      *   *Identification:* How to test for this? Blind tests? Track record of consistency? Peer nomination? (This is the hard part).
      *   *Reporting:* Not a number. A qualitative consensus statement? Or a distribution of *reasons* rather than scores. Hume cares about the *sentiment* backed by reason.
      *   *Mechanism:* Deliberative democracy among the qualified, not just polling.

  5.  **Critique Hume (The Prediction Market/Consumer Satisfaction Angle):**

      *   Hume asks: "What *ought* to be admired?"
      *   Aggregators ask: "What *will* be consumed?"
      *   RT/Meta/IMDb are actually *informational goods* to reduce transaction costs for consumers.
      *   They aren't measuring aesthetic truth; they are measuring *probability of satisfaction*.
      *   RT = Probability of not wasting money.
      *   Meta = Probability of critical acclaim.
      *   IMDb = Probability of entertainment.
      *   *Conclusion:* Hume is the wrong lens because these sites aren't trying to establish a Standard of Taste; they are trying to facilitate market efficiency.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the question. Validate the observation about the "cherry-picking."
      *   *Section 1: The Implicit Theories.* Break down RT, Meta, IMDb. Use strong philosophical labels.
          *   RT: Binary Validity (Threshold).
          *   Meta: Cardinal Quality + Technocratic Authority.
          *   IMDb: Democratic Subjectivism.
      *   *Section 2: Industry Consistency.* Argue that the industry is pragmatic, not philosophical. They are different tools for different stakeholders (marketing vs. prestige vs. distribution).
      *   *Section 3: The Humean Aggregator.* This needs to be creative. How to operationalize "Delicacy"? Maybe a "Grand Jury" model. Reporting should be qualitative or range-based, not a single scalar.
      *   *Section 4: The Critique of Hume.* This is crucial. The user invited it. Argue that aggregators are *economic* instruments, not *aesthetic* ones. They measure *expectation management*.
      *   *Conclusion:* Bring it back to the film group. The tension isn't a bug; it's a feature of how art meets commerce.

  7.  **Refining the Humean Analysis:**
      *   Make sure to explicitly reference Hume's five characteristics of the True Judge (delicacy, practice, comparison, prejudice, sense).
      *   Point out that Metacritic's "weighting" is a crude proxy for Hume's "qualified judge," but lacks the philosophical rigor.

  8.  **Refining the Economic Critique:**
      *   Use the term "Signaling."
      *   Mention "Asymmetric Information."
      *   The score is a heuristic, not a truth claim.

  9.  **Final Polish:** Check tone. Keep it intellectual but accessible (it's for a film group discussion). Ensure all parts of the prompt are answered. (Self-Correction: Make sure I don't get too bogged down in the math of Metacritic and focus on the *philosophical presupposition* of the math.)

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a fantastic puzzle. You have identified a genuine philosophical incoherence at the heart of the film industry's marketing machinery. The industry treats these numbers as interchangeable currencies of "quality," yet they are minted by three distinct mints with different reserve standards.

  Here is a reconstruction of the implicit theories of taste behind each aggregator, an analysis of their compatibility, a blueprint for a Humean alternative, and finally, an argument for why Hume might be the wrong lens entirely.

  ### 1. The Implicit Theories of Taste

  **Rotten Tomatoes: Threshold Deontology (The Theory of Competence)**
  You asked if RT presupposes aesthetic judgment is binary. Yes, but more specifically, it presupposes that **aesthetic value is a threshold condition, not a scalar magnitude.**
  *   **The Theory:** A film is either "Certified Fresh" (it succeeds in its intentions) or "Rotten" (it fails). The specific *degree* of success is irrelevant. A lukewarm 6/10 "it was fine" review counts exactly the same as a rapturous 10/10.
  *   **The Standard:** The standard is **consensus of validity**. It measures the *probability of recommendation*. It answers the question: "Is this film a safe use of my time?"
  *   **The Flaw:** It destroys nuance. It implies that the difference between a masterpiece and a competent genre piece is negligible compared to the difference between a competent piece and a failure. It treats taste as a pass/fail exam.

  **Metacritic: Technocratic Elitism (The Theory of Cardinal Quality)**
  Metacritic presupposes that quality is **commensurable and cardinal** (measurable on a linear scale) and that **authority is hierarchical.**
  *   **The Theory:** By normalizing all reviews to a 0–100 scale, Metacritic assumes a universal metric of quality exists—that a 70 from *The New York Times* is ontologically equivalent to a 70 from *Empire*. Furthermore, by weighting outlets, it asserts that **some subjects are more capable of judging than others.**
  *   **The Standard:** The standard is **curated consensus.** It attempts to approximate an "objective" score by privileging institutions with historical prestige.
  *   **The Flaw:** As you noted, the weighting is opaque. It smuggles in a claim about who the "real judges" are without defining the criteria. It assumes quality is additive (you can average a 40 and a 90 to get a 65), which implies a movie can be "half as good" as another, a metaphysical claim most aestheticians would reject.

  **IMDb: Radical Subjectivism (The Theory of Satisfaction)**
  IMDb presupposes that **taste is democratic and quality is identical to satisfaction.**
  *   **The Theory:** There is no distinction between "good" and "popular." The "wisdom of the crowd" overrides the "verdict of the experts."
  *   **The Standard:** The standard is **aggregate pleasure.** It measures the intensity of the audience's emotional reaction, regardless of artistic merit.
  *   **The Flaw:** It is vulnerable to brigading, hype cycles, and demographic skews. It conflates "this movie made me happy" with "this is a good movie."

  ### 2. Is the Industry Committed to Inconsistent Theories?

  **Yes, philosophically. No, pragmatically.**

  If the industry claimed these numbers measured the same ontological property (e.g., "Cinematic Truth"), they would be lying. But they aren't. The industry is not committed to a theory of taste; it is committed to a theory of **risk management.**

  *   **RT** is for **Distributors.** It minimizes the risk of a total bomb. An 85% tells a theater owner, "This won't offend people."
  *   **Metacritic** is for **Acquisitions & Awards.** It signals prestige. A 90 Meta score helps a streamer buy a film for awards season; it signals "high art."
  *   **IMDb** is for **Algorithmic Recommendation.** It signals "watchability."

  The industry is compatible because it treats these scores not as judgments of *value*, but as **signals for different market segments.** They are mutually inconsistent theories of *taste*, but mutually compatible tools of *commerce*. The studio putting the 85% on the poster and ignoring the 45 Meta score isn't confused; they are targeting the audience that cares about "fun night out" vs. "cinematic achievement."

  ### 3. Designing a Humean Aggregator

  If we take David Hume's *Of the Standard of Taste* seriously, current aggregators are failures. Hume argues that while sentiment is subjective, a "Standard of Taste" exists via the **joint verdict of true judges.**

  For Hume, a "True Judge" possesses five characteristics:
  1.  **Delicacy of Taste:** Ability to perceive subtle elements.
  2.  **Practice:** Experience in viewing the art form.
  3.  **Comparison:** Exposure to a wide range of works to establish context.
  4.  **Freedom from Prejudice:** Ability to set aside personal/historical bias.
  5.  **Good Sense:** Reason to check the influence of prejudice.

  **How to build "The Hume Meter":**

  *   **Who Counts as a Judge?**
      *   You cannot simply invite "critics." You must test for the five characteristics.
      *   *Identification:* A Humean aggregator would require a **qualification phase.** Judges would undergo blind testing (to check for delicacy and prejudice) and history quizzes (to check for comparison and practice). If a judge consistently rates *Transformers 4* higher than *The Godfather* without a defensible reasoned argument, they lose their voting weight.
      *   *Dynamic Weighting:* Unlike Metacritic's static outlet weighting, a Humean system would weight *individuals* based on their track record of consistency and reasoning quality.

  *   **How to Vote?**
      *   No binary (RT) and no raw numbers (Meta/IMDb).
      *   Hume emphasizes **reasoned sentiment.** The system would require a qualitative justification for extreme scores. If you give a 0 or a 100, you must write a defense.
      *   *Deliberation:* Before the score is locked, the judges engage in a moderated discussion (like a jury). The goal is to converge on a verdict, not just average independent inputs.

  *   **What to Report?**
      *   **Not a single number.** Hume acknowledges that even true judges will differ slightly.
      *   *The Report:* A "Verdict Statement." Example: *"The consensus of qualified judges finds this film to be technically proficient but emotionally hollow, comparable to the director's mid-period work."*
      *   *The Score:* If a number is required, it should be a **range** (e.g., 75–85) indicating the margin of disagreement among the *qualified*, rather than a false precision average.

  **The Problem:** This is unscalable. It requires slow, expensive human labor. Aggregators exist to process data quickly and cheaply. A Humean aggregator is a boutique jury, not a tech platform.

  ### 4. The Critique: Is Hume the Wrong Lens?

  Here is the uncomfortable truth: **Hume is asking "What is good?" The aggregators are asking "What will happen?"**

  You suggested they might be prediction markets for consumer satisfaction. I think this is the stronger argument.

  *   **RT is a Prediction of Retention:** An 85% Tomatometer predicts that 85% of people who watch it will not feel cheated. It predicts low refund rates and low negative word-of-mouth.
  *   **Meta is a Prediction of Legacy:** A high Metascore predicts that the film will be written about in six months. It predicts cultural endurance.
  *   **IMDb is a Prediction of Engagement:** A high IMDb score predicts high completion rates and bingeability.

  **The Economic Theory of Taste**
  Under this lens, the "inconsistency" you noticed isn't a philosophical error; it's **market segmentation.**
  *   If I am a studio head, I don't care about the "Standard of Taste." I care about **Asymmetric Information.** The audience doesn't know if the movie is good; the critics do. The score is a signal to bridge that gap.
  *   RT signals: "Low Risk."
  *   Meta signals: "High Prestige."
  *   IMDb signals: "High Enjoyment."

  **Why Hume Fails Here:**
  Hume's theory is normative (how we *ought* to judge). Aggregators are descriptive (how people *do* react).
  If you built the Humean aggregator described above, you would likely create the most philosophically robust score in history, and **no one would use it.**
  1.  **Too Slow:** By the time the jury deliberates, the opening weekend is over.
  2.  **Too Elitist:** Modern audiences reject the idea that a "qualified judge" knows better than they do what they will enjoy. We have moved from a culture of *authority* to a culture of *affinity*.
  3.  **Too Nuanced:** Marketing requires a hook. "A range of 75–85 among qualified judges" does not fit on a bus shelter poster. "85% FRESH" does.

  ### Conclusion for Your Group

  The argument in your film group stems from treating these numbers as **aesthetic claims** when they are actually **financial instruments.**

  *   **Rotten Tomatoes** presupposes taste is a **binary purchase decision** (Buy/Don't Buy).
  *   **Metacritic** presupposes taste is a **hierarchical status game** (Prestige/No Prestige).
  *   **IMDb** presupposes taste is a **democratic popularity contest** (Like/Dislike).

  The industry isn't confused; it is opportunistic. It uses the theory of taste that maximizes revenue for the specific film in question.

  If you want to pursue the Humean angle, challenge your group with this: **Is it possible to have a "Standard of Taste" in an algorithmic age?** Hume required "practice" and "comparison." Algorithms optimize for "engagement" and "retention." If we let the aggregators define taste, we aren't finding the True Judges; we are training the audience to become the data points that satisfy the machine. The danger isn't that the numbers are inconsistent; it's that they are slowly replacing the act of judgment itself.
