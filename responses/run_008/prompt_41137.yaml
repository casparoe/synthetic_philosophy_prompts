answer: |-
  ### Part 1: The Biology Check (Read this first)

  You are on thin ice with the term **"Handicap Principle."**

  **The Distinction:**
  *   **Costly Signaling Theory (CST):** The broad umbrella (credited largely to Michael Spence in economics and Alan Grafen in biology). It says a signal is honest if it is too expensive for a "low quality" individual to fake.
  *   **The Handicap Principle (Zahavi):** A specific, controversial subset of CST. Zahavi argued the signal must be *actively detrimental to survival* (like a peacock's tail making it easier to catch) to prove the individual is so fit they can survive *despite* the handicap.

  **Where you're vulnerable:**
  If you call code reviews a "handicap," the ecologist will pounce. They will argue that code reviews don't actively threaten the "survival" of the developer or the project in the way a heavy tail threatens a peacock. They are just *expensive*.
  *   **The Fix:** Pivot to **"Costly Signaling"** generally. Cite **Spence** (Job Market Signaling) as your primary anchor, not Zahavi. You can mention Zahavi as the inspiration for the idea that "cost creates honesty," but acknowledge that in organizational behavior, we usually mean Spence-style signaling (costly to fake) rather than Zahavi-style handicaps (survival-reducing).
  *   **The History:** You are correct that Zahavi's idea was resisted until Grafen (1990) modeled it mathematically. The key distinction is that Zahavi believed the cost *itself* was the mechanism of selection, whereas standard signaling models view cost as a barrier to entry for cheaters. Stick to "barrier to entry" for your talk; it fits software better.

  ---

  ### Part 2: Q&A Preparation

  Here are the four objections you will face, ordered by how much damage they can do to your credibility and thesis.

  #### 1. The Ecologist (The Credibility Kill)
  **The Objection:**
  "You're conflating Handicap with general Costly Signaling. A peacock's tail reduces its chances of survival to prove genetic fitness. A code review doesn't reduce the 'survival' of the engineer; it just costs time. If the ritual doesn't actively harm the performer's fitness, it's not a handicap, it's just friction. Does misapplying the biology undermine your whole analogy?"

  **Your Reply (1 min):**
  "You're absolutely right on the terminology, and I appreciate the precision. I should have leaned harder on Spence's Job Market Signaling rather than Zahavi's Handicap. The core mechanism I'm describing is that the *cost* prevents low-commitment actors from mimicking high-commitment ones, not that the ritual actively harms the developer's 'survival.' The biology is the inspiration, but the mechanism is economic signaling. The point stands that the cost is the feature, not the bug, even if 'Handicap' was the wrong label."

  **Where it's shaky:**
  You are admitting a technical error in your framing. If you lean too hard on "it's just economic," you lose the evolutionary psychology hook that makes the talk interesting. You need to bridge back to *why* humans evolved to respond to these costs biologically.

  #### 2. The TDD Evangelist (The Premise Destroyer)
  **The Objection:**
  "This assumes these rituals are 'waste.' They aren't. Tests catch regression bugs. Reviews catch security flaws. Documentation helps onboarding. You're calling it signaling because you don't see the defects it prevented. If the utility is real, it's not signaling, it's engineering."

  **Your Reply (1 min):**
  "I'm not arguing the utility is zero. A peacock's tail might also help with balance; that doesn't stop it from being a signal. My claim is that we do *more* than the utility requires. We don't just write tests; we enforce 100% coverage even on trivial code. We don't just review; we require two approvals for a typo. The *marginal* cost beyond what's needed for safety is where the signaling happens. The utility explains the tool; the signaling explains the *ritualistic enforcement* of the tool."

  **Where it's shaky:**
  You have to prove the "excess." If they argue that 100% coverage *is* necessary for safety, you're stuck in an empirical debate you can't win in Q&A.

  #### 3. The Economist (The Logic Trap)
  **The Objection:**
  "In signaling models, if everyone adopts the signal, it becomes a 'pooling equilibrium' and loses its value. If every team does code reviews, it no longer signals that *your* team is trustworthy. So why doesn't the market optimize this away? Why do we see an arms race of increasing bureaucracy instead of a stable signal?"

  **Your Reply (1 min):**
  "Great point. That's exactly why the signal has to escalate. When reviews became standard, the signal shifted to 'automated CI pipelines.' When those became standard, it shifted to 'security compliance audits.' The specific ritual changes, but the need for a costly barrier remains. It's not a stable equilibrium; it's a Red Queen effect. We run faster (more process) just to stay in the same place (trust)."

  **Where it's shaky:**
  This admits your theory predicts endless bureaucratic bloat with no efficiency gain. That's a depressing conclusion that might alienate the managers in the room.

  #### 4. The Humanities Grad (The Ideological Check)
  **The Objection:**
  "This feels like biological reductionism. You're taking complex cultural and labor dynamics—like management trying to justify their existence or fear of liability—and reducing it to 'evolutionary instinct.' Isn't this just using science to naturalize corporate bureaucracy?"

  **Your Reply (1 min):**
  "I'm not saying biology *replaces* culture, but that it constrains it. Management fads come and go, but the ones that stick are the ones that tap into deep-seated human instincts for trust and reciprocity. I'm not trying to justify the bureaucracy; I'm trying to explain why it's so resilient even when we hate it. Understanding the instinct helps us design better systems, not just accept the waste."

  **Where it's shaky:**
  It's hard to draw the line between "explaining" and "justifying." If you aren't careful, you sound like you're telling workers to accept inefficiency because "biology."

  ---

  ### Part 3: Strategy — Concede vs. Hold

  **Concede Up Front (Pre-emptive Strikes):**
  1.  **Terminology:** In your opening or first slide, explicitly state: *"I'm using 'Costly Signaling' in the Spence/Grafen sense, inspired by Zahavi, not strictly the Handicap Principle."* This disarms the Ecologist immediately.
  2.  **Utility:** Acknowledge that tests/reviews *do* work. Say: *"These tools have technical value. My thesis is about why we enforce them beyond the point of diminishing technical returns."*
  3.  **Intent:** Clarify you aren't saying managers *consciously* do this. It's an emergent property, not a conspiracy.

  **Hold the Line (Do Not Apologize For):**
  1.  **The "Waste" is the Point:** Do not let them convince you that the time spent is accidental. Hold that the *inefficiency* is the mechanism of trust.
  2.  **Social Function:** Maintain that the primary output of these rituals is often *social cohesion* (trust, accountability) rather than *technical output* (bug-free code).
  3.  **Inevitability:** Hold that if you remove the cost, you remove the trust. You can't have "cheap trust."

  ---

  ### Part 4: The Nightmare Question

  **The Question:**
  *"If AI agents can write perfect tests, review code instantly, and generate documentation at near-zero cost... does your theory predict that trust in software engineering will collapse? Because the signal is no longer costly."*

  **Why it's a nightmare:**
  It exposes the fragility of your thesis. If the signal is *only* valuable because it's expensive, and AI makes it cheap, your theory predicts a crisis of confidence in the industry. It forces you to predict the future of work in a way you might not be ready for.

  **How to face it:**
  "That's the million-dollar question. My theory suggests one of two things will happen. Either we invent *new*, harder rituals that AI can't do (like complex system architecture debates), or trust shifts from 'process compliance' to 'outcome guarantees' (like insurance models). If the cost of signaling drops to zero, the signal dies. We are likely heading for a massive disruption in how we verify professional competence."

  *(This answer admits the risk without panicking, and actually makes you look forward-thinking.)*
