          *   Cite Downs (1957) or standard rational choice theory.
          *   This is the "outcome-changing" side.
      *   **The Contributory Argument (Engaging the User's Analogy):**
          *   Analyze the snow-shovelling analogy.
          *   *Strength:* Collective action problems.
          *   *Weakness:* Thresholds vs. Continuous accumulation. Voting is binary/threshold-based; snow is continuous.
          *   *Refinement:* Voting contributes to the *mandate* or *margin*, not just the win/loss.
      *   **Alternative Justifications (Beyond Consequentialism):**
          *   *Expressive Voting:* Voting as speech/consumption, not investment.
          *   *Civic Duty/Deontology:* Kantian universalisation (what if everyone did that?).
          *   *Group Agency:* Voting as part of a demographic bloc.
      *   **Critique of Rationality:**
          *   Is "rationality" only about expected utility maximisation?
          *   Broaden the definition of rational action to include rule-following or identity maintenance.
      *   **Conclusion:**
          *   Defend a position: Voting is rational, but not for the reason most people think (pivotality).
          *   Validate the "contributory" sense but refine it (it's about legitimacy and expression).
          *   Final verdict: The trip to the polling station is justified, but the "snow-shovelling" analogy needs tweaking to account for the threshold nature of elections.

  4.  **Drafting - Section by Section (incorporating British English):**

      *   *Intro:* Start with the puzzle. It's a classic problem. Acknowledge the user's independent discovery of the pivotal vs. participatory distinction.
      *   *The Cold Hard Maths:* Be clear this is settled. In a UK general election, odds are millions to one. Expected utility ($P \times B - C$) is negative. This is the "outcome-changing" failure.
      *   *The Snow-Shovelling Analogy:* This is the core engagement.
          *   *Pro:* It captures the *causal structure* of collective action.
          *   *Con:* Snow is additive. Voting is threshold-based. If the road is cleared without me, my shovel was wasted *effort* but not *wasted contribution* to the total volume moved. However, if the candidate wins by 10,000 votes, my vote didn't change the winner, but it did change the *margin*. Does the margin matter? Yes, for mandates.
