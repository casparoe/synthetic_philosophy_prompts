      *(Self-Correction during drafting)*: I initially thought about dismissing the snow analogy because of the threshold problem. But the user asked if voting can be rational in the *contributory* sense. I should argue that it *can*, but the "contribution" isn't to the *winner*, it's to the *process*. I need to make sure I don't validate the analogy blindly. I will argue the analogy is useful but requires a shift in what we think is being "cleared" (the road of legitimacy, not just the obstacle of the opponent).

