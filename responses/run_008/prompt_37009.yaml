      *   *Critique:* Does the snow analogy hold? In snow shovelling, the *sum* of efforts creates the result directly. In voting, the *aggregation rule* (majority) creates a threshold effect. A single vote usually adds to the margin, not the binary outcome, unless it crosses the threshold. So, is adding to the margin a "contribution" in the same way?

  3.  **Outline the Essay:**
