answer: |-
  This is one of the most profound and common questions in the philosophy of physics. Your intuition is sharp: on the surface, "deterministic but unpredictable" does sound like an oxymoron. If $A$ causes $B$, and we know $A$, shouldn't we know $B$?

  The short answer is: **No, it is not a fudge.** It is a rigorous distinction between how the universe works (ontology) and what we can know about it (epistemology).

  Here is the breakdown of why determinism does not guarantee predictability, and why your computer thought experiment hits a physical wall.

  ### 1. The Map vs. The Territory
  The confusion comes from conflating the **system itself** with our **model of the system**.

  *   **Determinism** is a property of the *system*. It means the laws of physics governing the double pendulum do not involve rolling dice. If the universe is in State $A$ at time $t$, the laws of physics dictate it *must* be in State $B$ at time $t+1$. There is no ambiguity in nature. The pendulum doesn't "wonder" where to go; it just goes.
  *   **Predictability** is a property of the *observer*. It asks: Can a human (or a computer) calculate State $B$ before it happens?

  In a linear system (like a planet orbiting a star in a vacuum), small errors in our measurement of State $A$ lead to small errors in our prediction of State $B$.
  In a chaotic system, small errors in State $A$ lead to **massive** errors in State $B$.

  ### 2. The Problem of "Exact State"
  You wrote: *"A computer loaded with the exact state should just be able to crank the future out."*

  This is the crux of the issue. **You cannot load the "exact state."**

  To specify the position of a pendulum "exactly," you would need to specify a real number with infinite precision (e.g., an angle of $30.000000000000000000000000000000000000...$ degrees).
  *   **Nature** seems to handle this fine. The pendulum just *is* at that position.
  *   **You** cannot measure it to infinite precision. Every measuring device has a limit.
  *   **Your computer** cannot store it. Computers use finite bits (floating-point numbers). You cannot store an infinite decimal expansion in a finite hard drive.

  So, you are forced to input an *approximation* of the state. Let's say the real state is $x$, and you input $x + \epsilon$ (where $\epsilon$ is a tiny error).

  ### 3. The Magnifying Glass (Lyapunov Exponents)
  In a non-chaotic system, if your error $\epsilon$ is tiny, your prediction stays close to reality for a long time.
  In a chaotic system, the system acts like an exponential error amplifier. This is what the **Lyapunov exponent** measures.

  If the error grows exponentially, then even if $\epsilon$ is the size of an atom, after a certain amount of time (the "prediction horizon"), that error will have grown to the size of the entire system.

  **Example:**
  Imagine you measure the double pendulum's angle to the precision of a single atom.
  *   **Day 1:** Your computer's simulation matches reality perfectly.
  *   **Day 10:** Your simulation is slightly off.
  *   **Day 20:** Your simulation shows the pendulum swinging left, while the real one is swinging right.

  The system is still deterministic. The real pendulum followed the laws of physics perfectly. Your computer followed the laws of physics perfectly. **But your computer was simulating a *slightly different pendulum* than the one in front of you.**

  ### 4. Laplace's Demon vs. Chaos
  Your intuition aligns with a famous concept from 1814 called **Laplace's Demon**. Pierre-Simon Laplace argued that if an intellect knew the position and momentum of every atom in the universe, it could perfectly predict the future. He equated determinism with predictability.

  Chaos theory (and later Quantum Mechanics) killed Laplace's Demon, but it didn't kill determinism.
  *   **Laplace thought:** Determinism $\to$ Predictability.
  *   **Chaos shows:** Determinism $\to$ Predictability **ONLY IF** you have infinite measurement precision and infinite computational memory.

  Since infinite precision is physically impossible (due to the finite size of the universe and eventually quantum limits), **predictability is lost even though determinism remains.**

  ### 5. Is it a "Fudge"?
  Physicists aren't using this phrase to cover up a failure of determinism. They are using it to describe a specific mathematical behavior where **causality is local, but knowledge is limited.**

  If the system were truly *non-deterministic* (like radioactive decay in standard Quantum Mechanics), then knowing the exact state *still* wouldn't let you predict the future, because the future isn't fixed yet.
  In a chaotic system, the future *is* fixed, but it is **computationally inaccessible** to any observer with finite resources.

  ### Summary
  *   **Determinism:** The future is fixed by the present. (True for the double pendulum).
  *   **Predictability:** We can calculate that future. (False for the double pendulum over long times).
  *   **Why?** Because "the present" contains infinite information (real numbers), and we can only access finite information. Chaos magnifies the difference between "finite" and "infinite" until it breaks our predictions.

  So, "deterministic but unpredictable" isn't a contradiction; it's a statement about the **limit of knowledge** in a universe governed by **non-linear laws**. Nature knows where the pendulum is going; we just can't do the math fast enough or precisely enough to catch up.
