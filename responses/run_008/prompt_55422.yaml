          3.  **Theory Breakdown:** Address four specific complications where Hart/Fuller might fail:
              *   Asymmetry of defendants (conscript vs. Politburo).
              *   Possibility of shooting to miss/wound (cheap violation).
              *   Temporal/State twist (State A judging State B's law, not successor judging predecessor).
              *   Epistemic situation of the guard (no access to external norms).
          4.  **Verdict:** Did this vindicate Hart, Fuller, or neither? Compare to the Grudge Informer cases.
          5.  **Thesis:** End with a strong claim on which reading the evidence supports and what would need to change for the opposite to win.
