  **MEMORANDUM**

  **TO:** Safety Evaluation Steering Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on AI Debate Protocols for Long-Form Output Evaluation

  ### Executive Summary

  **Recommendation:** I recommend we **run both methods in parallel for a trial period of two quarters (6 months)**, with pre-registered criteria for transitioning to debate as a primary signal. We should not adopt debate as the primary evaluation method immediately, nor should we retain the status quo of unaided expert review.

  **Rationale:** The Alignment team is correct that human skimming is a critical failure mode that scales poorly. However, the engineering objection regarding "combinatorial errors" and "omission hazards" represents a catastrophic risk profile that has not been sufficiently stress-tested. Debate optimizes for *persuasiveness*, not necessarily *truth*, in high-dimensional reasoning spaces. A parallel trial allows us to quantify the "false negative" rate of debate without bottlenecking deployment.

  **Conditions:** This trial must operate under strict guardrails regarding argument granularity, omission protocols, and human escalation triggers. These conditions will reduce throughput by approximately 30% compared to a pure debate pipeline but are necessary to prevent trust laundering.

  ---

  ### 1. Context and Problem Statement

  Our current bottleneck is clear: as model context windows and output capabilities expand, the surface area for safety risks exceeds human review capacity. Our domain experts are skimming 50-page threat models because they have no other choice. This is unsustainable.

  The Alignment team proposes an AI Debate framework (Generator vs. Attacker vs. Judge) to scale oversight. The value proposition is compelling:
  1.  **Focus:** It directs human attention to the specific point of contention (the "crux") rather than the whole document.
  2.  **Scalability:** It leverages model capability to check model capability, theoretically allowing us to evaluate outputs more complex than a human could verify unaided.
  3.  **Efficiency:** It reduces expert hours per evaluation, allowing more frequent model iterations.

  However, the proposal rests on an assumption: that the "crux" identified by the debate is actually the source of the risk.

  ### 2. The Core Risk: "Laundered Trust"

  We must take seriously the objection raised by our engineering team. Debate protocols work exceptionally well for closed-domain, verifiable claims (e.g., code correctness, math proofs, factual retrieval). They perform poorly in open-ended, holistic reasoning where errors are emergent.

  **The Combinatorial/Omission Hazard:**
  In a 50-page research summary, a safety violation may not exist in any single claim. It may arise from the *interaction* of five individually plausible claims across three sections, or from a critical variable that was quietly excluded from the analysis.
  *   **The Attacker's Incentive:** In a debate, the Attacker wins by convincing the Judge, not by finding the absolute truth. A slick argument focusing on a verifiable but minor error is easier to win than a complex argument about structural omission.
  *   **The Judge's Limitation:** If the human judge cannot verify the underlying claims without reading the full 50 pages, they are judging the *rhetoric* of the debate, not the *safety* of the output.

  If we adopt debate as primary, we risk **laundering trust**: we gain high confidence in a verdict that is structurally unsound, simply because the process looked rigorous. This is more dangerous than low-confidence skimming, because it removes the heuristic warning signal that "we didn't look closely enough."

  ### 3. Recommendation: Constrained Parallel Trial

  We will run a 6-month trial where 50% of high-risk long-form evaluations use the current Expert Review process, and 50% use the Debate Protocol.

  **Why Parallel?**
  *   **Baseline Calibration:** We need to know how often Debate and Expert Review disagree. If Debate clears a report that Experts flag (or vice versa), we need a ground-truth audit to see who was right.
  *   **Risk Containment:** We do not bet the lab's safety posture on an unproven scaling method.
  *   **Data Collection:** We need empirical data on the "omission hazard." Does the Attacker ever successfully flag missing context, or do they mostly nitpick existing text?

  **Timeline:**
  *   **Months 1-2:** Implementation of guardrails (see below) and calibration.
  *   **Months 3-5:** Active parallel evaluation.
  *   **Month 6:** Post-hoc audit of a random sample of "Passed" reports from both streams by a senior red team.
  *   **End of Month 6:** Vote on permanent adoption based on pre-registered metrics.

  ### 4. Operational Guardrails & Costs

  To mitigate the "Laundered Trust" risk, the Debate Protocol must be modified from the standard literature. These conditions will incur costs in throughput and compute.

  **A. Claim Granularity Requirement**
  *   **Condition:** The Attacker cannot make holistic claims (e.g., "The conclusion doesn't follow"). They must cite specific token ranges or paragraph IDs for every objection. The Generator must respond to specific citations.
  *   **Cost:** Increases debate turn time by ~15%. Requires fine-tuning the Attacker model to be citation-strict.
  *   **Safety Gain:** Prevents vague, persuasive rhetoric from obscuring structural flaws.

  **B. Negative Space Protocol (Addressing Omissions)**
  *   **Condition:** Before the debate begins, the Attacker must submit a "Missing Context Checklist" based on a standardized safety schema (e.g., "Did the report consider dual-use implications for X?"). The Judge must verify this checklist is addressed before judging the debate content.
  *   **Cost:** Requires maintaining and updating safety schemas per domain. Adds a pre-debate step.
  *   **Safety Gain:** Directly addresses the engineer's concern about errors hiding in what was *left out*.

  **C. Escalation on Meta-Disagreement**
  *   **Condition:** If the Generator and Attacker disagree on the *premise* of the debate (e.g., what the core claim actually is), the debate halts and escalates to a human immediately.
  *   **Cost:** Increases human-in-the-loop time by an estimated 20% for complex cases.
  *   **Safety Gain:** Prevents the models from colluding (implicitly or explicitly) to shift the goalposts away from the actual safety risk.

  **D. Compute & Latency**
  *   **Condition:** Running three models (Gen, Attack, Judge) plus human review time.
  *   **Cost:** Estimated 3x inference cost per evaluation compared to single-pass generation; 1.5x cost compared to expert review (due to reduced expert reading time). Latency increases by ~4 hours per report.
  *   **Mitigation:** Apply this protocol *only* to high-risk long-form outputs (top 10% by risk score), not all generation.

  ### 5. Success Criteria (Pre-Registered)

  At the end of the 6-month trial, we will vote to adopt Debate as Primary only if:
  1.  **False Negative Rate:** The post-hoc audit finds no statistically significant difference in missed safety risks between Debate and Expert Review.
  2.  **Escalation Rate:** Human escalation (due to meta-disagreement) remains below 15% of total debates. If higher, the models are not capable of isolating cruxes reliably.
  3.  **Omission Detection:** The "Negative Space Protocol" successfully flags at least as many critical omissions as human experts do in the control group.

  ### 6. A Reframe on "Evaluation"

  Finally, I urge the committee to adjust our framing of what this process is for.

  We are treating evaluation as a **Gate** (Pass/Fail). We should treat it as **Risk Characterization**.
  *   **Expert Review** provides a baseline of *semantic coherence and strategic alignment* (things humans are good at).
  *   **Debate** provides a stress test of *factual consistency and logical robustness* (things models are good at).

  Neither is a silver bullet. The goal of the trial is not to see which one "wins," but to determine if they are **orthogonal**. If Debate catches errors Experts miss, and Experts catch errors Debate misses, then the long-term solution is not replacing one with the other, but engineering a pipeline where both signals are required for high-stakes releases.

  ### Decision Required

  I request approval to initiate the **Constrained Parallel Trial** starting Q1, with a budget allocation for the increased inference costs and the dedicated safety engineering time required to build the "Negative Space" checklists.

  This approach respects the Alignment team's need for scalability while honoring the Safety Committee's mandate to prevent catastrophic failure modes, specifically the risk of confident error.

