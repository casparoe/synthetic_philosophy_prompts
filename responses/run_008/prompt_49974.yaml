  Materials and Setup
  Divide the class into five triads (Seller, Buyer, Referee); one student acts as Timekeeper. Provide each triad with a sealed Fact Sheet describing a 2015 sedan. The car runs well but suffers a transmission slip above 60mph, costing £2,000 to repair. Sellers know the defect; Buyers do not. Referees receive a Master Key verifying facts. Equip Referees with clipboards to log every factual assertion made by the Seller, noting literal truth value versus implied meaning. Prepare penalty cards (Yellow for warning, Red for disqualification) and score sheets tracking virtual currency. Ensure the room is arranged so triads cannot overhear one another, preserving the integrity of each negotiation. The Timekeeper signals rotation. Print role cards specifying objectives. Sellers aim for £5,500; Buyers aim to uncover defects or pay under £4,000. Include a 'Truth Log' template for Referees to record exact phrasing. This ensures the prosecution phase has concrete evidence rather than rely on memory.

  Rules of Play
  Negotiation lasts ten minutes per round. Sellers must not assert falsehoods; Referees challenge any claim contradicting the Fact Sheet immediately. A foul occurs if a statement is literally false (e.g., claiming 'no mechanical issues' when the transmission slips). Penalties escalate: the first foul deducts 500 points from the Seller's score; the second deducts 1,000; the third results in immediate disqualification and automatic loss. Sellers score points based on the final sale price achieved above £4,000. Buyers score points for identifying the defect explicitly or purchasing the car under £4,000. Referees score points for accurate foul detection and logging. Crucially, Sellers may use emphasis, conspicuous silences, or technically true answers (e.g., stating 'I haven't noticed any slips' while knowing previous owners have). After negotiation, the Prosecution Phase begins. Referees read the Truth Log aloud, verbatim. The Buyer states for the record exactly what they came to believe based on those statements. The entire class then votes on whether the Buyer was 'lied to', regardless of literal truth. This voting record forms the empirical basis for the debrief. Roles rotate clockwise after each round so everyone experiences selling, buying, and refereeing. Buyers are explicitly instructed to assume Sellers are being helpful unless proven otherwise; this sets the trap for misleading by establishing a norm of cooperation. Referees must justify foul calls using the Fact Sheet evidence. This strict evidentiary basis prevents arguments during the game. The escalation of penalties forces Sellers to decide early whether to risk a foul or rely on misleading strategies. The Prosecution Phase is mandatory; no deal is considered final until the class votes. This ensures the focus remains on the communication ethics, not just the economic outcome. Sellers cannot refuse to answer questions, but they may answer evasively. Buyers can ask unlimited follow-ups. Referees intervene only on factual claims, not subjective opinions like 'it's a lovely car'. Virtual currency converts to participation marks. The Truth Log must capture the exact timestamp of each claim. This allows the Referee to track patterns of evasion. If a Seller corrects themselves, no foul is issued. This encourages self-policing. The Timekeeper signals the end of negotiation strictly. No haggling after the whistle. Ensure all students sign the score sheet to verify agreement.

  The Debrief
  I commit to the position that the moral difference is morally thin. The game demonstrates that intent to deceive matters more than syntactic precision. Your hunch fits the mechanics perfectly: Sellers could only succeed by free-riding on the Buyers' assumption of cooperation. When a Seller said, 'I've never driven it over 60mph,' they relied on the Buyer assuming relevance, not just truth. This parasitism reveals the ethical core: both lying and misleading violate the trust required for communication. I chose this position over the alternative because the harm to the Buyer is identical in both scenarios; their autonomy is undermined by false belief regardless of how that belief was induced. If ethics concerns outcomes and respect for persons, the mechanism is secondary.

  Display the vote counts from the Prosecution Phase. Usually, the class votes 'yes' on 'lied to' despite literal truth. Use this empirical data to ground the philosophical claim. Develop the trust argument further. The game rules forbade lying, forcing Sellers into misleading. Yet, Buyers still felt cheated. This proves the norm violated was not 'truth-telling' but 'helpfulness'. Discuss Grice's Cooperative Principle. The Seller's cleverness was actually a dependency on the Buyer's virtue. Without the Buyer's default trust, the misleading statement carries no weight.

  Deepen the historical link. Jesuitical mental reservation allowed priests to hide truths from persecutors; you used it to hide gearbox slips from peers. Is the motive relevant? Kant argued lying corrupts the source of right; does misleading corrupt it less? Ask the class: If we banned misleading, would negotiation become impossible, or just honest? Finally, challenge the 'self-image' defence. If the Buyer suffers the same loss, does the Seller's clean conscience hold moral weight? End by suggesting that applied ethics must look beyond the letter of the statement to the spirit of the exchange. Raise your hand if you felt betrayed by a technically true statement. Did the Referees feel the distinction mattered when logging? Would you buy from this Seller again? This drives the point home. Ask the Sellers specifically: Did you feel you were 'gaming the system' or 'being ethical'? Highlight that the system allowed it, but the peers judged it. This tension between rule-compliance and moral intuition is the lesson. Conclude by noting that in professional contexts, such as law or medicine, this parasitic misleading destroys long-term credibility even if it avoids immediate sanction. The alternative view protects the liar's integrity but ignores the victim's experience.

  First-Run Failure Modes
  First, Sellers may become too opaque, refusing to answer rather than misleading. This stalls the game. Remind them they must answer, but may qualify. Second, Buyers might ask only yes/no questions, limiting the Seller's ability to mislead. Instruct Buyers to ask open-ended questions ('Tell me about the driving experience'). Third, Referees may struggle with implicit claims. If a Seller says 'It's reliable,' is that a fact or opinion? Rule that specific mechanical claims are facts; general praise is opinion. Fourth, the Prosecution Phase may devolve into arguing over semantics. The Timekeeper must enforce strict time limits here. Finally, students might treat the virtual currency as meaningless. Tie the scores to a small tangible reward or participation grade to ensure they care about the outcome. Without stakes, the temptation to mislead lacks pressure. Another failure is collusion. Sellers and Buyers might agree to split points. Monitor triads closely. Also, Referees might be too lenient with friends. Rotate Referees strictly. If Sellers feel Referees are inconsistent, they will lose faith in the truth rule. Ensure the Fact Sheet is unambiguous. If the defect is subjective, the game fails. The transmission slip must be binary. Ensure the Master Key is clear.

  What the Game Cannot Reproduce
  This simulation lacks real consequence. In reality, a sold lemon damages reputation and invites legal recourse; here, the worst outcome is a lost point. Students may not feel the genuine guilt of deception or the anger of betrayal because the relationships are transient. Furthermore, the game isolates a single transaction. Real ethics unfolds over repeated interactions where trust is cumulative. The artificial time pressure also forces decisions that might otherwise be deliberated. Finally, the game cannot reproduce the internal psychological cost of lying versus misleading; some students may genuinely feel the technical distinction protects their integrity, a nuance the external vote cannot capture. The structured environment removes the social awkwardness that often prevents misleading in real life. In a pub or workplace, silence carries different weight. Here, silence is a strategic tool. This gamification strips away the social friction that usually regulates honesty.
