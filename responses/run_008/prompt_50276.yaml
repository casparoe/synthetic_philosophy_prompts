prompt: |-
  quick context before the actual question: my aunt died last year and left a decent chunk of money to a small family foundation, and somehow I'm now the one deciding where it goes. we're not huge — maybe $200k a year to give away — but suddenly I'm getting applications, and the ones that freak me out are the ones with astronomically large numbers attached. one group says insect welfare could involve tens of trillions of individual lives so small dollars here dwarf everything else. another is basically religious and says each converted soul has infinite value. a third wants to fund research on digital minds because if consciousness can run on computers the stakes are beyond counting. and then there's my cousin on the board who keeps saying "if one person gets a thousand times more enjoyment from money than everyone else, we should just fund their art project," which sounds dumb but I can't quite say why.

  I know there's the old thought experiment about the utility monster — the being who gets so much pleasure from everything that utilitarianism says you should feed it everything you own — and I know it's meant as a reductio of utilitarianism, not as a guide. but here's my actual problem: in practice, how do I tell the difference between a utility monster argument (which I should reject) and a legitimately huge-stakes claim (which I should fund even if it feels weird)? because the reasoning pattern looks identical from the outside. somebody asserts a big multiplier on utility per dollar or per beneficiary, the math checks out given the assertion, and the conclusion dominates everything else on the table.

  so what I want is a procedure I can actually run on an application, in an evening, with no philosophy training and no ability to verify empirical claims beyond a google of the org's finances. something like: ordered questions to ask, what counts as a red flag vs just an unusual claim, where the procedure should force me to cap how much weight a single unverifiable multiplier can carry, and — this part matters — where the procedure has to stop and hand the decision back to me because it's genuinely a values question the checklist can't settle.

  please also run it on three of the actual applications sitting in my inbox folder: (1) the insect welfare one, (2) the religious salvation one, (3) my cousin's artist friend who claims outsized enjoyment of funding. and include at least one case where the procedure gives an answer I won't like — I'd rather be annoyed at the checklist now than blindsided later.

  two more things: tell me honestly where this procedure will misfire or give silly answers, e.g. what a clever applicant could do to game it. and at the end, tell me what would change your verdicts — which specific step or assumption, if wrong, would flip the whole framework, and where you're most likely to have gone wrong. don't give me a reading list, I've got applications to read.
