      *   **Topic:** The Gödelian analogy in Hofstadter's *Gödel, Escher, Bach* (GEB) is literal, not decorative. Self-awareness = formal self-representation. The "I" is the gap/fixpoint generated by the diagonal lemma/incompleteness.
      *   **Audience:**
          1.  Proof Theorist (Math OK, Psychology loose).
          2.  Model Theorist (Focus on structures/semantics).
          3.  Cognitive Scientist (Metacognition lab, empirical focus).
          4.  Grad Student (Sympathetic to Penrose, anti-mechanism).
          5.  Organizer (Kantian, sees "strange loop" as apperception).
