      *   *Correction on Grad Student:* The student thinks Gödel proves minds *aren't* formal systems. The user thinks minds *are* formal systems (with gaps). The student will ask: "If you admit the gap, why not admit non-computability?"
      *   *Correction on Organizer:* The Kantian thinks the "I" is a condition, not an object. The user says the "I" is a self-model (an object). This is a direct clash.

