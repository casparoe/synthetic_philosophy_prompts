answer: |-
  Dear Colleague,

  It is a pleasure to help you refine this bootcamp session, as the goal of moving statistics from abstract arithmetic to visceral intuition is exactly where early-career reporters often struggle. The scenario you have imagined is strong because it places the participants in a decision-making role rather than a passive observation role, which is crucial for feeling the tension of Simpson's reversal in their bones. To make this work within a three-hour block for sixteen people, we need to tighten the numerical architecture so the paradox is undeniable, design the physical materials to prevent accidental unblinding, and structure the debrief to ensure the lesson lands on causality rather than just calculation. I will walk you through the design, the numbers, the timeline, and the potential pitfalls in the order you will need to execute them.

  The engine of this game relies on a specific set of mortality rates that guarantee the reversal while keeping the math simple enough for mental calculation under pressure. You will establish two hospitals, St. Antonia's and Mercy General, and two patient cohorts, which we will call Green Cases for walk-ins in decent shape and Red Cases for urgent critical arrivals. For the historical data slip you hand out at the start, St. Antonia's must appear superior in the aggregate. To achieve this, St. Antonia's historical log should show they treated ninety Green Cases with ten deaths and ten Red Cases with five deaths, yielding a total of one hundred patients and fifteen deaths for an aggregate mortality rate of fifteen percent. Mercy General's historical log should show they treated ten Green Cases with zero deaths and ninety Red Cases with thirty-six deaths, yielding a total of one hundred patients and thirty-six deaths for an aggregate mortality rate of thirty-six percent. On the surface, St. Antonia's is vastly safer. However, within the subgroups, Mercy is superior. For Green Cases, Mercy had zero percent mortality versus St. Antonia's eleven percent, and for Red Cases, Mercy had forty percent mortality versus St. Antonia's fifty percent. This creates the reversal. The reason for the discrepancy is the case mix, where St. Antonia's quietly skims the easy cases while Mercy handles the trauma. You should print these numbers on official-looking hospital performance slips, perhaps with a logo and a disclaimer about data completeness to add flavor.

  For the physical materials, you will need to construct patient files and outcome decks. Since you cannot rely on dice to match these specific percentages cleanly, use playing cards or custom slips inside manila envelopes. For the outcome mechanism, create four distinct decks of cards corresponding to each hospital and cohort combination. The St. Antonia's Green deck should have nine survive cards and one die card. The St. Antonia's Red deck should have five survive and five die. The Mercy Green deck should have ten survive and zero die. The Mercy Red deck should have six survive and four die. You will need to keep these decks hidden behind a screen or in a separate room so participants cannot see which deck you are drawing from. The participants will receive patient files that specify only the patient's condition, Green or Red, but not the hospital assignment until they make their choice. For scoring, use a simple point system where each surviving patient earns the team ten points and each death deducts five points, which prevents them from gaming the system by simply refusing to allocate patients. You should prepare a scoreboard on a whiteboard to track the cumulative points of the room, fostering a sense of collective stakes.

  The session should flow through three distinct rounds of play sandwiched between an introduction and a comprehensive debrief. You should allocate the first fifteen minutes to welcoming the participants and setting the narrative scene, explaining that they are analysts for a large insurer tasked with minimizing patient mortality to reduce payouts and improve public health outcomes. Hand them the historical aggregate slips and explain that their goal in the first round is to allocate twenty new incoming patients to either St. Antonia's or Mercy General to maximize survival points. In this first round, which should last about thirty minutes, you will deal them patient files that are a balanced mix of ten Green and ten Red cases to ensure a fair test, but they will not know the cohort breakdown until after they make their choice. They will likely send most patients to St. Antonia's based on the aggregate data. As they hand you their choices, you will draw from the hidden decks corresponding to their choice and the patient's actual condition, revealing the outcome immediately. Because Mercy is clinically superior, the room will likely underperform compared to what they would have achieved had they chosen Mercy, creating the first layer of cognitive dissonance.

  After a fifteen-minute break to let the frustration settle, you will begin the second round which is the core of the exercise and should last sixty minutes. Here you divide the room into two teams of eight. Team Alpha receives the full breakdown tables showing the subgroup mortality rates, while Team Beta receives only the aggregate tables again. Tell them they must now jointly agree on the allocation of thirty new patients before any outcomes are drawn. This forces negotiation. Team Alpha will argue for Mercy based on the subgroup data, and Team Beta will argue for St. Antonia's based on the aggregate data. You should instruct them that they cannot show their papers to each other, only speak. This simulates real-world information asymmetry where one department might have granular data another does not. They must find a way to communicate the insight without revealing the confidential slip. Ideally, they will realize that the type of patient matters more than the hospital name. Once they agree on a strategy, you run the allocation with a balanced mix of patients again. If they compromise on sending Red Cases to Mercy and Green Cases to St. Antonia's, they will maximize points, but if they stick to the aggregate instinct, they will lose points again. This negotiation phase is where the learning happens, as they must articulate why the aggregate number is misleading without using the word confounding.

  The third round should be shorter, lasting about thirty minutes, and serves as a control condition. Introduce a third hospital, Community General, which takes a fifty-fifty mix of Green and Red cases and has mortality rates identical to Mercy General in both subgroups. In this scenario, the aggregate mortality for Community General will match the subgroup performance, meaning there is no reversal. Ask the participants to allocate patients among all three hospitals. This demonstrates that Simpson's reversal is not a permanent property of hospitals but a structural artifact of how patients are sorted. It prevents them from walking away with the heuristic that subgroups are always right and aggregates are always wrong. The final forty-five minutes must be reserved for the debrief, which is where you connect the game mechanics to the statistical theory. You need to map their experience directly to the formal distinction between marginal and conditional association. Explain that the aggregate table showed the marginal association between hospital and survival, while the subgroup tables showed the conditional association. The variable that changed the relationship was the case mix, which acted as a confounding variable. You must emphasize that neither number was arithmetically wrong. The aggregate number correctly answered the question of where a random patient from the general population was likely to survive given the current referral patterns, while the subgroup number correctly answered the question of which hospital provides better care for a specific condition. The hard part for the insurer is deciding whether they want to reward current performance or incentivize better care, and whether they have the power to change the referral patterns.

  There are specific failure modes you should anticipate and prepare to handle. The most common issue is that a participant with prior statistical knowledge will spot the reversal from the slip design in the first five minutes and spoil the discovery for the room. If this happens, do not shut them down but instead recruit them as a co-conspirator. Ask them to keep the insight to themselves until the second round and act as a facilitator for their team rather than revealing the answer. Another predictable failure is subgroup absolutism, where participants decide after round two that the subgroup numbers are the true numbers and the aggregate is a lie. You must correct this in the debrief by explaining that if the insurer cannot change which patients go where, the aggregate number is the accurate prediction of their costs. A third risk is that the Team Beta participants in round two feel cheated by the information asymmetry. You should handle this by framing it as a realistic simulation of newsroom dynamics where the data reporter knows something the general assignment reporter does not, and the story depends on their collaboration. Finally, some groups may fail to negotiate and simply vote, leaving half the room disengaged. To prevent this, assign roles within the teams such as Chief Actuary and Lead Negotiator to ensure everyone has a stake in the consensus.

  Regarding the limitations of the game, you are correct that the primary feature it cannot reproduce is the uncertainty of the stratification variable. In the game, you hand them the subgroups explicitly labeled Green and Red. In the wild, reversals never announce their stratification variable. A journalist looking at crime stats or health outcomes does not know whether to stratify by age, income, zip code, or prior record. The game simplifies the search space of potential confounders. You must supply this in the debrief by explaining that the hard work of data journalism is not calculating the paradox but hunting for the hidden variable that causes it. You should encourage them to ask what else might be sorting the patients besides severity, such as insurance status or distance from the hospital. Another limitation is that the game assumes the probabilities are stable and known, whereas real data has noise and confidence intervals. Participants might dismiss the reversal as statistical noise if the margins were tighter, which is why we chose large margins, but you should still mention that in reality, they would need to check for statistical significance before publishing a claim of reversal.

  To execute the timeline precisely, you should start at zero minutes with the introduction and handout distribution. By minute fifteen, they should be reading the aggregate slips. By minute forty-five, round one should be complete and scored. Take the break from minute forty-five to minute sixty. Resume at minute sixty for the team split and round two setup. The negotiation should happen between minute seventy-five and minute ninety, with the outcome drawing finishing by minute one hundred twenty. Use minute one hundred twenty to one hundred fifty for round three with the third hospital. From minute one hundred fifty to the end at minute one hundred eighty, run the debrief. If you run long on the negotiation in round two, do not cut the debrief short. It is better to skip round three than to skip the explanation of confounding, as round three is illustrative but the debrief is essential. You should prepare a handout for the debrief that summarizes the numbers they just played with so they can take home the concrete example.

  In terms of printing costs, you can keep this very cheap. You will need sixteen aggregate slips, eight subgroup slips, forty patient file envelopes, and about two hundred index cards for the decks. You can write the card outcomes with a marker, using red for death and green for survival to match the patient files. The patient files themselves can be simple index cards stamped with Green or Red. The scoring can be done on a whiteboard with dry-erase markers. The most important investment is your time in prepping the decks to ensure the counts are exact, as a miscounted deck could ruin the paradox. Double-check that the Mercy Red deck has exactly four death cards out of ten, and the St. Antonia's Red deck has five out of ten, as this narrow margin is where the subgroup superiority is established. If you accidentally swap these, the paradox disappears.

  Finally, be prepared for the emotional reaction to the data. Reporters often feel a sense of betrayal when numbers lie to them, even when they understand the math. The aggregate number felt like a truth and was then revealed to be misleading. Validate this feeling. Tell them that this discomfort is the engine of good data journalism. It is the feeling that prompts the follow-up question. When they leave the session, you want them to feel that an aggregate number is not a fact but a claim that requires evidence about the underlying distribution. If they leave thinking only that Simpson's Paradox is a trick, the session has failed. If they leave thinking that every aggregate comparison is a hypothesis about homogeneity that must be tested, the session has succeeded. You are not teaching them to distrust data, but to interrogate the structure of the data generation process. This distinction is vital for their careers, and this game is designed to make that interrogation feel like a necessary survival skill rather than an academic exercise. I am confident that with these numbers and this structure, the reversal will feel less like a math problem and more like a story waiting to be reported.
