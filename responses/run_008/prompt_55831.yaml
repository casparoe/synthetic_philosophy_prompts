answer: |-
  Here is the ranking of the four objections by the degree of trouble they cause Harsanyi's position, followed by the verdict on your specific reply regarding the separateness of persons.

  ### Ranking of Objections

  **1. Rejecting expected-utility theory outright.**
  *   **Rating:** Devastating
  *   **Target:** Both the Impartial-Observer construction and the Aggregation Theorem.
  *   **Justification:** Both arguments are mathematical derivations that depend entirely on the von Neumann–Morgenstern axioms holding for individuals and the social evaluator. If rational agents do not maximize expected utility (e.g., due to ambiguity aversion or rank-dependent weighting), the logical machinery of both theorems collapses immediately.

  **2. Objecting that interpersonal comparisons of utility are underdetermined.**
  *   **Rating:** Serious
  *   **Target:** Primarily the Aggregation Theorem (also the Impartial-Observer).
  *   **Justification:** The theorem proves social welfare is a *weighted* sum of individual utilities, but vNM utilities are unique only up to affine transformations; without an independent method to fix the zero and unit across persons, the formula cannot yield classical utilitarianism (equal weights). This shows the theorem derives a formal structure but fails to ground the substantive moral doctrine without extra ethical assumptions.

  **3. Denying social preferences should be defined over the same lotteries as individual preferences.**
  *   **Rating:** Serious
  *   **Target:** Primarily the Aggregation Theorem (also the Impartial-Observer).
  *   **Justification:** This objection (often associated with Diamond and Broome) challenges the moral validity of the Pareto principle over risky prospects, arguing that a social evaluator must care about *ex post* distribution (who actually suffers) rather than merely *ex ante* prospects. It allows the math to stand but renders the moral premises unacceptable to those who view the separateness of persons as requiring attention to actual outcomes.

  **4. Declining the framework for a rival normative standard (e.g., Maximin).**
  *   **Rating:** Mild
  *   **Target:** Primarily the Impartial-Observer construction.
  *   **Justification:** Merely asserting a rival theory (like Rawlsian contractualism) constitutes a disagreement rather than a refutation of Harsanyi's internal logic. It only becomes damaging if coupled with Objection 1 to show that Harsanyi's conception of rationality behind the veil is arbitrary, but on its own, it is an external competition rather than an internal critique.

  ***

  ### Bottom Line: The Verdict on Your Reply

  Your reply to your friend **does not survive intact**; it rests on a confusion exposed primarily by Objection 3 (Interpersonal Comparisons).

  You argued that the Aggregation Theorem preserves the separateness of persons because it sums separate terms without comparing utilities. While it is technically true that the *proof* takes individual preference orderings as separate inputs, the *result* ($W = \sum a_i U_i$) is substantively meaningless unless you can compare the scale and zero-point of each person's utility function. To make the utilitarian calculation work, you must impose interpersonal comparisons that the theorem itself does not provide. Furthermore, Rawls's objection to the "separateness of persons" is precisely that *summing* individual utilities treats society as a single super-person; the fact that the sum is composed of separate terms does not negate the aggregative nature of the conclusion. Therefore, the Aggregation Theorem does not evade the separateness objection; it merely formalizes the mechanism by which utilitarianism is often accused of violating it.
