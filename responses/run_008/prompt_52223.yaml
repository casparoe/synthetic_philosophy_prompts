answer: |-
  1. "Pluto" functions as a rigid designator picking out that specific icy body in the Kuiper Belt regardless of the vote, so the 2006 decision altered the extension of the predicate "planet" rather than the reference of the name itself. The vote shifted our classificatory beliefs about the object, not the object's identity or the name's semantic hook.

  2. Because "planet" operates more like a stipulative classification than a natural kind term, the statement "Pluto is not a planet" is contingent upon human definitional conventions rather than a necessary a posteriori truth. It functions as an analytic-by-committee-stipulation claim that holds only within the framework of the 2006 resolution.

  3. "Pluto" rigidly designates an object while "planet" functions as a descriptive category lacking a hidden microstructural essence, meaning the latter's extension is fixed by description rather than causal history. This asymmetry decides point 2 because without a rigid natural kind term on the right side of the identity, no necessary a posteriori truth can be generated.

  4. The Ceres precedent suggests "planet" behaves like a theory-laden descriptive term whose extension shrinks as empirical knowledge grows, rather than a rigid natural kind term discovering an eternal essence. Kripke has room for this only if we admit the term was never truly natural kind-like, but rather a contingent classificatory tool subject to revision.

  5. The framework strains because Kripkean externalism insists meanings aren't up to conferences, yet the IAU vote successfully altered linguistic usage without altering metaphysical reality. This is where the theory goes silent on social kinds, suggesting that calling Prague's vote a discovery of necessary truth is a reductio of applying the framework to stipulative definitions.
