          *   *Retributive/Expressive (AG's view):* Punishment must express societal condemnation. Hardship communicates the gravity of the wrong. If prison is "comfortable," the message is diluted.
          *   *Liberal/Rehabilitative (Option B view):* The state's power is limited to removing liberty. Adding gratuitous hardship degrades human dignity and hinders reintegration.
      *   *Conclusion:* It is a *real* distinction in legal theory and moral philosophy, but in *practice*, it often collapses because conditions affect the *experience* of time. However, for the purpose of policy, treating them as distinct allows for a hybrid approach: strict confinement (length) without unnecessary deprivation (conditions).
