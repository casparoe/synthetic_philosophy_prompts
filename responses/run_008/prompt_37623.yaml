      *   **The Empirical Crux (The Economist's Point):** Acknowledge that Norway $\neq$ State. We can't import results directly. We need local data.
      *   **The Recommendation (Pilot):** Why a pilot?
          *   Reduces financial risk.
          *   Generates local data on recidivism/safety.
          *   Allows for cultural adjustment (guards becoming "mentors" is a huge shift).
      *   **Engaging the Losing Side (Option A proponents):** Acknowledge that safety and accountability are paramount. A pilot doesn't abandon security; it redefines it.
      *   **Conditions/Metrics:** Define what success looks like for the pilot (Recidivism, Staff Injury, Cost per Inmate, Victim Satisfaction/Input).
