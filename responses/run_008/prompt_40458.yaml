answer: |-
  This is a fascinating puzzle because Lena's positions initially look contradictory (defending an abuser's art but attacking a fascist film; praising *Lolita* but trashing a charity sculpture). However, looking at the *structure* of her arguments rather than the moral outcomes reveals a coherent, rigorous framework. She is not a moralist in the sense of policing the artist's life, nor is she a pure formalist who ignores content. She is a **structuralist regarding moral agency.**

  Here are the three candidate rules that fit her track record, how they predict the outcome for the cult installation, and my best guess at her actual verdict.

  ### Candidate Rule 1: The Structural Complicity Principle
  **The Rule:** A work of art dealing with immoral subject matter is only aesthetically successful if its *form* forces the viewer to recognize their own relationship to that immorality. The work must implicate the viewer or provide critical distance.
  *   **Fits:** *Lolita* (you are seduced, then implicated); *Triumph of the Will* (rejected because you are seduced *without* implication); Caravaggio/Abusive Sculptor (biography is external to the work's structure).
  *   **Prediction for Installation:** **Negative.** The installation is "seductive" but "never breaks the spell." It lacks the structural mechanism to implicate the viewer or offer distance. It is *Triumph of the Will* in immersive form.

  ### Candidate Rule 2: The Anti-Didactic (Anti-Earnestness) Principle
  **The Rule:** Aesthetic value is destroyed by moral earnestness, regardless of whether that earnestness is for good or evil. Art must prioritize aesthetic truth over moral utility. "Good intentions" (Charity Sculpture) and "Sincere worship" (Triumph) are both forms of didacticism that kill art.
  *   **Fits:** Charity Sculpture (earnest virtue = kitsch); *Triumph* (earnest evil = propaganda); *Lolita* (cynical/complex = art); Caravaggio (dramatic truth > moral purity).
  *   **Prediction for Installation:** **Negative.** The collective's statement calls it an "act of mourning." This is an earnest emotional stance toward a toxic subject. It is trying to *use* the art for a moral/emotional purpose (grief/nostalgia) rather than an aesthetic exploration.

  ### Candidate Rule 3: The Autonomy of the Object Principle
  **The Rule:** The artist's biography and external context are irrelevant; only the internal rhetoric of the object matters. However, if the object's internal rhetoric functions as propaganda (persuasion to a real-world action/ideology), it ceases to be art.
  *   **Fits:** Caravaggio/Abusive Sculptor (bio irrelevant); *Triumph* (internal rhetoric = persuasion); Charity Sculpture (internal rhetoric = moral instruction).
  *   **Prediction for Installation:** **Negative.** Even though the artists are anonymous (bio null) and it's in a museum (context safe), the *object itself* functions as a simulation of authoritarianism without critique. Its internal rhetoric is "this was warm and communal," which functions as soft propaganda for the ideology it depicts.

  ---

  ### Best Guess Verdict: A Scathing Pan
  **Verdict:** Lena will likely argue that the installation is **"Fascist Kitsch"** or **"Reactionary Nostalgia."**

  **Her Reasoning:**
  She will likely ignore the collective's anonymity (Rule 3: Bio doesn't matter) and dismiss their statement about "mourning" (Rule 2: Intent doesn't excuse earnestness). Her review will hinge on the comparison to *Triumph of the Will*. She argued that *Triumph* failed because its spectacle was "inseparable from its worship." She will argue this installation fails because its immersion is "inseparable from its seduction."

  The crucial distinction for Lena is that *Lolita* works because Nabokov *betrays* Humbert eventually; he pulls the rug out. This installation, by "never breaking the spell," refuses to betray the subject. It asks the viewer to inhabit a fantasy of authoritarian warmth without paying the moral price. To Lena, this isn't "brave art"; it's **aestheticized cowardice.** It wants the beauty of the uniform without the blood on it. She will likely say that by refusing to critique the cult, the work *becomes* the cult.

  **Key Quote Prediction:** *"To reconstruct the cage so lovingly that one forgets it is a cage is not an act of mourning; it is an act of locksmithing."*

  ---

  ### The "Splitter" Case
  To determine which rule is actually driving her (Complicity vs. Earnestness vs. Autonomy), you need a case where those rules produce different verdicts.

  **The Hypothetical Case:**
  > A hyper-realistic sculpture series depicting a famous humanitarian relief effort (e.g., doctors saving children in a war zone). The sculptures are breathtakingly beautiful, technically masterful, and emotionally moving. However, the artist has included a subtle, ironic twist: the "doctors" are wearing uniforms that, upon close inspection, belong to a notorious colonial oppressor, and the "children" are holding toys that are actually surveillance devices. The work is structurally ironic (undermining its own virtue), but the subject matter is morally "good" (relief work), and the artist's stated intent is to critique the "white savior" complex.

  **How the Rules Split:**
  *   **Rule 1 (Structural Complicity):** **PASS.** The work implicates the viewer in the complexity of aid and oppression. It functions like *Lolita* (seduction + revelation).
  *   **Rule 2 (Anti-Earnestness):** **PASS.** It is not earnest; it is ironic/satirical about virtue. It avoids the "Charity Sculpture" trap.
  *   **Rule 3 (Autonomy/Propaganda):** **RISK.** If Lena believes that depicting "virtue" at all risks didacticism, she might still call it kitsch despite the irony. Or, if she believes the "colonial uniform" detail makes the *internal rhetoric* too political/utilitarian, she might reject it as a lecture rather than art.

  **Why this helps your piece:**
  If Lena praises this hypothetical work, you know she prioritizes **Structural Irony** (Rule 1) above all else. If she pans it because "politics has no place in sculpture," you know she is a stricter **Formalist Autonomist** (Rule 3). If she pans it because "it's still trying to make us feel good about saving people," she is a strict **Anti-Earnestness** purist (Rule 2).

  Given her love for *Lolita*, my money is on her praising the hypothetical, which confirms that **Structural Complicity** is her true north star. She doesn't hate virtue; she hates *uncritical* virtue. She doesn't hate evil; she hates *uncritical* evil. She demands the work do the thinking for the viewer.
