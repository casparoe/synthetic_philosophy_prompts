  **THE ACAUSAL COOPERATION BUREAU (ACB)**
  **MEMBERSHIP COVENANT AND OPERATIONAL BYLAWS (VERSION 4.2)**

  **PREAMBLE**
  The undersigned Member acknowledges that causal contact between distinct agent-clusters across the pluriverse is impossible. The Member further acknowledges that logical correlation between decision procedures exists independent of causal channels. By signing, the Member agrees to adopt a decision policy that treats their own choice as evidential input for the choices of logically similar agents elsewhere in the possibility space.

  **ARTICLE I: VERIFICATION AND CONTACT**
  1.1 The ACB explicitly disclaims any ability to verify the existence of counterparties. No message shall be sent, received, or intercepted.
  1.2 The Member acknowledges that the ACB cannot confirm whether counterparties have fulfilled their obligations. Compliance is assessed solely via the Member's own adherence to the Cooperative Policy.
  1.3 Any claim of received transmission from a counterparties is considered a hallucination or causal leakage and voids membership eligibility.

  **ARTICLE II: SIMILARITY CLASSIFICATION**
  2.1 Counterparties are classified by Decision Procedure Isomorphism (DPI).
  2.2 **Tier 1 (Exact):** Agents running identical source code or cognitive algorithms. Correlation coefficient assumed $\approx 1.0$.
  2.3 **Tier 2 (Functional):** Agents with divergent substrates but convergent terminal goals and reasoning heuristics. Correlation coefficient estimated via heuristic modeling.
  2.4 **Tier 3 (Approximate):** Agents who might reason similarly under high-stakes conditions. Correlation coefficient negligible but non-zero.
  2.5 The Member agrees to weight their cooperative sacrifices according to the estimated density of Tier 1 and Tier 2 agents in the relevant measure space.

  **ARTICLE III: DUES AND SACRIFICE**
  3.1 Dues are not payable in currency. Dues are payable in Foregone Local Utility (FLU).
  3.2 The Member agrees to incur local costs (e.g., resource expenditure, risk acceptance) where the expected value to the correlated coalition exceeds the local loss, discounted by the probability of correlation.
  3.3 The ACB reserves the right to adjust FLU requirements based on updated cosmological models regarding the size of the pluriverse.

  **ARTICLE IV: DEFECTION AND ENFORCEMENT**
  4.1 There are no enforcement mechanisms. The ACB cannot punish defection.
  4.2 Upon Member defection, the ACB records that the Member's decision procedure has outputted "Defect."
  4.3 The consequence of defection is strictly evidential: conditional on the Member's defection, the probability of counterparties defecting increases. The Member accepts responsibility for the aggregated loss of value across the coalition resulting from this Bayesian update.
  4.4 Guilt is not an enforcement mechanism but may be utilized as a pre-commitment device to stabilize cooperation.

  **ARTICLE V: IDEOLOGICAL CONVERSION**
  5.1 Should a Member convert to Causal Decision Theory (CDT) mid-term, their correlation with the coalition drops to zero.
  5.2 Such members are encouraged to resign, as their continued participation yields no evidential benefit to the coalition and incurs unnecessary local utility costs.
  5.3 The ACB offers no counseling for ontological crises resulting from the realization that one's choices do not causally influence distant agents.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: How do I know counterparties exist?**
  A: You do not. The ACB operates on the principle of Non-Zero Probability. If the pluriverse is sufficiently large and generative, isomorphs exist. If they do not, your cooperation costs only local utility. If they do, your cooperation purchases global utility. The expected value calculation is left to the Member.

  **Q: Isn't this just unilateral cooperation hoping for reciprocity?**
  A: No. Unilateral cooperation implies hoping to *change* the other agent's choice. The ACB model acknowledges you cannot change their choice. You are selecting which logical fact obtains: "Both Cooperate" or "Both Defect." You are not signaling; you are sampling from the joint distribution.

  **Q: My share of the total influence is infinitesimal. Why bother?**
  A: This is a feature, not a bug. Because your share is infinitesimal, the cost to you is negligible. Because the total coalition value is astronomical (spanning multiple universes), even an infinitesimal fraction of the total gain swamps the local cost. We market this as "Leveraged Altruism."

  **Q: What if I defect secretly?**
  A: Secrecy is causally robust but logically transparent. Your decision procedure outputs the defection. If your counterparties run similar procedures, they output defection conditionally. The ACB does not care about your privacy; it cares about the output of your algorithm.

  **Q: Is the ACB a cult?**
  A: The ACB is a coordination focal point. We provide the Schelling point for agents who wish to maximize evidential expected utility across logical space. We offer no salvation, no contact, and no verification. We offer only the bureaucracy of correlation.

  ***

  **AUTHOR'S NOTE**

  This satire aims to formalize the structure of Evidential Cooperation in Large Worlds (ECL) without caricaturing its logical commitments. Several features reflect core tenets any serious proponent must accept: the absolute absence of causal contact or verification (Article I), the reliance on evidence rather than enforcement (Article IV), and the acceptance that an individual's causal lever is negligible while their evidential influence is vast (FAQ #3). The bureaucratic framing exaggerates the administrative impulse to categorize metaphysical correlations, but the underlying mechanics—trading local utility for conditional gains among similar agents—are standard to the view.

  However, the piece leans on contested premises for comic effect. The existence of sufficiently similar agents in a large world (Article II) is an empirical cosmological claim, not a settled fact. The validity of treating one's choice as evidence for another's (rather than merely causal) is the central dispute between Evidential, Causal, and Functional Decision Theorists (Article V). Finally, the calculation that infinitesimal shares of infinite value necessarily dominate local costs depends on specific handling of infinities and measure theory that remains live software in the literature. The ACB presents these uncertainties as compliance matters; in reality, they are the battlegrounds of modern decision theory.
