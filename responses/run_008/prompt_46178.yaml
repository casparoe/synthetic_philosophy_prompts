      *   *Later Confucianism:* Neo-Confucians tried to universalize the love (Min Baoqian), but the tension persisted.
      *   *Conclusion:* The analogy doesn't erase the distinction; it complicates it. It suggests the *spirit* of care should inform politics, not that the *rules* are identical.

