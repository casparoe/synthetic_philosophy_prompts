      *   *The Anti-Hierarchy/Critical Argument:* The analogy is metaphorical, not ontological. Rulers aren't biological parents. The "Mandate of Heaven" (Tianming) introduces a conditional element absent in biology. Mencius explicitly allows for tyrannicide (killing a "lone fellow," not a king).
      *   *The "Straight Body" Problem:* *Analects* 13.18. Confucius says a father covering for a son and vice versa is "straight" (zhi). This looks like nepotism. But Confucians also demand impartiality in office. How to reconcile?
      *   *Modern Role Ethics:* Ames and Rosemont argue against abstract individualism. They use the family model to promote relationality. But does this inadvertently validate authoritarianism?
      *   *Key Distinction:* *Xiao* (Filial Piety) vs. *Zhong* (Loyalty). Are they identical or analogous? *Zhong* implies a reciprocal duty that *Xiao* does not (parents don't owe children *xiao*).

