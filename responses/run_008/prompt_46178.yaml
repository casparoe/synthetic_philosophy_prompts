      *   *Intimacy:* Parent knows child. Ruler knows subject via reports. *Impact:* Undermines the moral cultivation aspect. You can't love a million people like a son.
      *   *Benefit:* Parents biologically invested in child's success. Ruler might exploit. *Impact:* Crucial. This is where the "disciplining the ruler" argument comes in.
      *   *Removal:* Can't fire a dad. Can remove a tyrant (Mencius). *Impact:* This is the biggest crack in the authoritarian armor.

  5.  **Addressing the Internal Problem (Nepotism):**
      *   *Analects 13.18:* "Straight body." Confucius prioritizes family bond over legalistic truth.
