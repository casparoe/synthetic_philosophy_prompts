answer: |-
  Here is a four-step decision procedure that shifts focus from alternative possibilities to agency and coercion, followed by its application to your three cases.

  ### The "Source and Force" Procedure

  **Time Limit:** 20 Minutes
  **Goal:** Determine if the violation originated from the student's own will or was imposed by external forces.

  **Question 1: The "Broken Machine" Check (External Determinism)**
  *   **Ask:** Did a technical error, system failure, or external force guarantee the violation occurred regardless of what the student tried to do?
  *   **If YES:** Go to **Question 1b**.
  *   **If NO:** Go to **Question 2**.

  **Question 1b: The "Secret Wish" Check (Frankfurt Insight)**
  *   **Ask:** Even if the system was broken, is there evidence the student *tried* to make the violation happen anyway (e.g., seeking out leaks, preparing cheat sheets)?
  *   **If YES:** **Verdict: Responsible.** (The action flowed from the student; the external force was redundant).
  *   **If NO:** **Verdict: Not Responsible.** (The action was imposed on the student).
  *   **Terminate.**

  **Question 2: The "Gun to the Head" Check (Coercion)**
  *   **Ask:** Was the student threatened with serious harm (expulsion, physical safety, major financial loss) if they *did not* commit the violation?
  *   **If YES:** **Verdict: Not Responsible** (for the coerced act). (The action flowed from the threatener, not the student).
  *   **If NO:** Go to **Question 3**.

  **Question 3: The "Own Mind" Check (Intent)**
  *   **Ask:** Did the student knowingly break a rule to gain an unfair advantage?
  *   **If YES:** **Verdict: Responsible.**
  *   **If NO:** Go to **Question 4**.

  **Question 4: The "Reasonable Mistake" Check (Capacity/Values)**
  *   **Ask:** Did a disability, lack of instruction, or genuine misunderstanding cause the student to believe their action was permitted?
  *   **If YES:** **HAND TO HUMAN JUDGMENT.** (Stop procedure. This is no longer a factual question about responsibility, but a value question about accommodation standards and negligence).
  *   **If NO:** **Verdict: Responsible** (for negligence).

  ***

  ### Application to Last Year's Cases

  **Case 1: The Compromised Portal**
  *   **Q1 (Broken Machine):** Yes. IT confirmed the portal would have substituted answers regardless.
  *   **Q1b (Secret Wish):** Yes. The student actively "pulled answers from a leaked key." He did not wait for the glitch; he sought the advantage.
  *   **Verdict:** **Responsible.**
  *   **Reasoning:** Even though he couldn't have avoided the outcome (the answers would have appeared anyway), the action originated from his own intent to cheat. The external constraint was redundant, not causative of his will.

  **Case 2: The Blackmail**
  *   **Q1 (Broken Machine):** No. She physically handed over the file.
  *   **Q2 (Gun to the Head):** Yes. The threat was reporting a prior incident, risking academic sanction/expulsion.
  *   **Verdict:** **Not Responsible** (for handing over the file).
  *   **Reasoning:** While she technically had the physical ability to refuse, the threat overrides voluntary agency. The source of the action was the blackmailer, not her own academic dishonesty. (Note: The prior incident remains a separate case).

  **Case 3: The Processing Disorder**
  *   **Q1 (Broken Machine):** No.
  *   **Q2 (Gun to the Head):** No.
  *   **Q3 (Own Mind):** No. She "genuinely believed that's what studying was." She lacked intent to deceive.
  *   **Q4 (Reasonable Mistake):** Yes. Undiagnosed processing disorder led to a genuine misunderstanding of citation norms.
  *   **Verdict:** **HAND TO HUMAN JUDGMENT.**
  *   **Reasoning:** The procedure identifies this as non-intentional, but cannot decide whether a disability exempts one from plagiarism standards or merely mitigates sanctions. That is a policy value call, not a factual determination of responsibility.

  ***

  ### Where the Procedure Misfires

  1.  **The Coercion Threshold (Question 2):** The procedure assumes "serious harm" is obvious. It will misfire on low-level coercion (e.g., "lend me your homework or I won't invite you to the party"). The panel will still have to argue over what counts as "serious," which is a value judgment disguised as a fact check.
  2.  **The Negligence vs. Disability Line (Question 4):** This is the biggest failure point. Distinguishing between a "genuine misunderstanding" due to disability and a "lazy misunderstanding" due to negligence is notoriously difficult in 20 minutes without expert testimony. The procedure correctly flags this as a value judgment, but it leaves you with the hardest cases still on your plate.
  3.  **The "Secret Wish" Evidence (Question 1b):** In Frankfurt-style cases, proving the student *would have* done it anyway requires mind-reading. In Case 1, the active searching saved you. If the student had simply sat passively and the portal swapped the files, you would have cleared them at Q1b. If they *wanted* to cheat but left no evidence of preparation, the procedure lets them off, which is technically correct (no action flowed from them) but might feel like a loophole to faculty.
