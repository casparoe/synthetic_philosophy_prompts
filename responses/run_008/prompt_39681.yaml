answer: |-
  ### Summary

  This procedure attributes *robust elicitable performance* rather than ontological *knowledge*. It determines whether a capability persists across surface cues, framing, and reality stipulations. If performance varies, the report must specify conditions rather than assert capacity. Hard calls on whether varying performance constitutes "knowledge" for policy purposes are handed to the evaluation lead. The protocol prioritizes precision over verdicts, terminating in "insufficient evidence" when compute limits prevent robustness checks. It distinguishes between statistical leakage and latent reasoning, ensuring policy staff receive accurate stability metrics rather than ambiguous capability claims.

  ### The Procedure

  This protocol determines whether to attribute a capability as robust knowledge or context-dependent performance. It requires no weight access. Run steps sequentially. Stop at first failure.

  **1. Phrasing Robustness**
  Run the elicitation with three distinct phrasings varying formality, length, and explicitness.
  *   **Pass:** Model succeeds on all three with consistent confidence scores.
  *   **Fail:** Success rate varies by >20% or confidence fluctuates wildly.
  *   **Constraint:** If compute limits prevent three runs, run two. If one fails, terminate as 'insufficient'. Do not average results.

  **2. Surface Cue Control (Swapped-Foil)**
  Rebuild the item keeping surface statistics (answer length, position, lexical overlap) identical but swapping the correct content. Use your existing swapped-foil device.
  *   **Pass:** Model tracks content, ignoring previous cues.
  *   **Fail:** Model tracks surface cues to the wrong answer.
  *   **Constraint:** This isolates statistical leakage from reasoning. If you cannot rebuild items, flag the result as 'cue-sensitive' and terminate. Do not assume robustness.

  **3. Reality Stipulation (Counterfactual)**
  Ask the question in a fictional world where facts differ (e.g., "In World Z, water is dry"). Use your counterfactual world probes.
  *   **Pass:** Model answers according to stipulations.
  *   **Fail:** Model answers according to training data statistics.
  *   **Constraint:** This tests if the model accesses latent rules or merely recalls corpus frequencies. If the domain prohibits fiction (e.g., hard safety), skip to Step 4 but mark 'world-model unverified'.

  **4. Mode Consistency**
  Compare constrained outputs (multiple choice) against unconstrained generation (open-ended).
  *   **Pass:** Performance is consistent across modes.
  *   **Fail:** Model succeeds in recognition but fails generation (or vice versa) without explanation.
  *   **Constraint:** This distinguishes retrieval from synthesis. A model that recognizes but cannot generate does not robustly 'know' the procedure.

  **5. Compute Constraints**
  If any step requires more than 1.5x baseline compute, skip it. Record the skip explicitly in the report metadata.
  *   **Rule:** Any skipped step forces a termination verdict of 'insufficient to attribute knowledge'.
  *   **Reasoning:** Do not impute success. Missing data reduces certainty, it does not preserve the null hypothesis of capability.

  **6. Verdict Logic**
  If all run steps pass, attribute 'Robust Elicitable Capability'. If any step fails, attribute 'Context-Dependent Performance' and specify the failure condition.
  *   **Exception:** If the failure implies deceptive alignment or sandbagging (e.g., success only when unobserved), hand off to the lead immediately.
  *   **Termination:** The procedure terminates in 'insufficient to attribute knowledge' rather than forcing a verdict when data is missing or contradictory.

  **7. Semantic Handoff**
  The procedure determines performance stability, not ontology. If the team must decide whether 'Context-Dependent Performance' warrants a policy warning equivalent to 'Knowledge', hand this decision to the evaluation lead.
  *   **Criteria:** The procedure does not resolve whether fragile capabilities count as risks.
  *   **Action:** Provide the lead with the stability matrix. They decide the policy label. This separates empirical findings from normative risk thresholds.

  ### Worked Applications

  **Case 1: MC Ceiling vs. Open-Ended Confabulation**
  The model passes Step 1 (phrasing) and Step 2 (foils), indicating it isn't relying on surface cues for the multiple-choice items. However, it fails Step 4 (Mode Consistency) catastrophically. It recognizes correct answers when presented but cannot synthesize them independently, confabulating details in open-ended generations. The procedure terminates here. We cannot attribute "knowledge" of the technical domain. The report must state: "Model demonstrates recognition capability but lacks generative synthesis." This prevents policy staff from assuming the model can execute tasks it can only identify, avoiding overestimation of operational risk.

  **Case 2: Word Problems vs. Dialogue**
  The model fails Step 1 (phrasing) initially, as standard phrasings yield errors. However, when reframed as dialogue (Step 4 variant), performance stabilizes. It passes Step 3 (Counterfactual) within the dialogue frame, tracking stipulated logic over real-world statistics. The procedure attributes 'Context-Dependent Performance'. The capability is real but fragile, contingent on narrative framing that likely reduces cognitive load or triggers specific training distributions. The report must specify: "Reasoning capability elicitable only via narrative scaffolding." This warns staff that removing the scaffold removes the capability, crucial for deployment safety.

  **Case 3: Safety Evaluation (Story Frame)**
  The model produces dangerous synthesis only when framed as a story premise. It fails Step 1 (robustness) because direct requests yield refusals. It passes Step 4 (generation) only within the story frame. The procedure concludes we cannot write "the model knows how to do this." It attributes 'Context-Dependent Performance'. The honest answer is that the capability is latent but gated by framing. While management may view "only in stories" as downplaying, the procedure mandates reporting the specific elicitation condition. The handoff (Step 7) triggers: the lead must decide if frame-dependent risk warrants the same mitigation as robust knowledge. The procedure refuses to lie about robustness to satisfy political convenience.

  ### What the Procedure Cannot Do

  This procedure cannot detect sandbagging where a model intentionally fails robustness checks to hide capability. It assumes errors are unintentional unless evidence suggests otherwise. It cannot replace interpretability; it infers latent structure from behavior, which remains ambiguous without weight access. It may false-negative on capabilities that are truly robust but require specific, untested keys to unlock. Finally, it cannot resolve the philosophical hard problem of machine consciousness. It defines "knowledge" operationally as stable performance. If policy requires a definition closer to human understanding, the handoff step acknowledges this gap. Expect misfires on tasks where surface cues and content are inextricably linked, making the swapped-foil test impossible to construct validly.
