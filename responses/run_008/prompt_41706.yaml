answer: |-
  Dear Colleague

  I am writing to set down the procedural framework we discussed for resolving our panel's deadlock on population ethics, translating our working compromise into a step-by-step guide that any official without philosophical training can apply to incoming policy proposals. As you know, our compromise rests on accepting the procreation asymmetry as a operational rule for this ministry while remaining neutral on the deeper metaphysical question of whether creating happy lives adds positive value to the world. This document is designed to honor that compromise by distinguishing clearly between what is settled for our purposes and what remains contested in the broader literature, ensuring we do not present our internal agreement as external consensus. The procedure begins with a single diagnostic question that must be asked of every proposal before any ethical weighing occurs, which is whether the policy affects only the welfare of people who will exist either way or whether it changes which people come into existence in the first place. This distinction is critical because standard welfare ethics apply to the former, while population ethics apply to the latter, and confusing the two is the source of most of our past disagreements. If the answer is that the policy affects only people who will exist either way, the procedure closes on its own by applying standard harm-benefit analysis, recommending the policy if it improves welfare and advising against it if it worsens welfare, as this ground is uncontested. However, if the policy changes who exists, the official must proceed to the second step, which applies our settled acceptance of the procreation asymmetry.

  At this second step, the official must ask whether the policy involves creating lives that are not worth living, meaning lives of net suffering or misery. If the evidence suggests the policy will cause such lives to exist, the procedure dictates that we advise against the policy, as our compromise accepts there is a moral reason not to create a life not worth living. It is vital here that the official records the justification as a moral reason against the act of creation rather than a claim that the resulting person is wronged, because the literature has no consensus on whether a person can be wronged by being created into a miserable life, and our procedure must not rely on that stronger claim to function. If the policy instead involves creating lives that are worth living, the procedure must stop and hand the question back to the panel without a recommendation based on the welfare of those new people. This is the point where our neutrality on positive value requires us to halt, because while the asymmetry forbids creating miserable lives, it merely declines to recommend creating happy ones, and treating the creation of happy lives as a moral benefit would violate our agreement to stay neutral on the total view versus person-affecting views. The official should note that the procedure does not forbid such policies, but it cannot endorse them on the grounds that they bring happy people into existence, leaving the decision to non-ethical considerations or further panel deliberation on contested grounds. This ensures we distinguish between what the asymmetry forbids and what it merely declines to recommend, preventing the slide into a duty to procreate that none of us endorse.

  When we run this procedure on the three proposals currently on our docket, the results illustrate both its utility and its limitations. Consider first the mandatory folic-acid fortification of flour, which improves the welfare of children who would have existed either way. The procedure identifies this immediately as a same-people case, bypassing the population ethics questions entirely and closing on its own with a recommendation to proceed, since improving the welfare of future citizens is uncontested ground. Next consider the cash subsidy for third children, defended with polling evidence that the children born because of it will be wanted and loved. The procedure identifies this as a different-people case because the subsidy changes who exists by incentivizing additional births. Since the evidence suggests these lives will be worth living, the procedure reaches the halt point where it must hand the question back to the panel, unable to recommend the policy based on the happiness of the new children because our compromise declines to treat that happiness as a moral reason for creation, though it does not forbid the subsidy either. Finally, consider the state-funded preimplantation screening for a condition that guarantees death in early childhood but a life until then better than most children's. This is also a different-people case because screening prevents specific embryos from becoming persons. Here the procedure yields a conclusion I anticipate you will find unwelcome, and I must be clear about which one it is and why it stings. Because the life prevented would have been worth living, the asymmetry provides no moral reason to prevent it, and because our procedure forbids relying on the positive value of creating happy lives, it also provides no moral reason to allow it based on the child's potential welfare. Consequently, the procedure cannot justify the screening on the grounds of the child's best interests, stripping the policy of its primary ethical justification and reducing it to a matter of resource allocation or parental preference alone.

  This conclusion on the screening proposal stings because it exposes the fragility of our standard bioethical language when faced with the non-identity problem, revealing that we cannot coherently claim we are screening to benefit a child who would not otherwise exist and whose life would have been good. It forces us to admit that under our compromise, preventing a happy life is ethically neutral rather than beneficial, which undermines the compassionate narrative we usually employ to justify preventing fatal conditions. I include this outcome deliberately to ensure you see where the compromise bites, as it highlights the difference between our settled procedural rule and the contested philosophical views we have bracketed, reminding us that the asymmetry solves some problems by creating others. The procedure is now ready for circulation to the staff, with the instruction that any case triggering the halt point on creating happy lives must be returned to us for a vote, while same-people cases and miserable-life cases can be processed according to the standard outputs described above. I hope this draft serves our needs without oversimplifying the philosophical distinctions we fought to preserve, and I look forward to your thoughts on whether the sting of the screening conclusion is too sharp for our public messaging.

  Yours sincerely

  The Drafting Committee Member
