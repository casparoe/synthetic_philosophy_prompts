      *   *Nuance on "Demonstration":* Bellarmine's letter to Foscarini is key. He admits a demonstration *would* force reinterpretation. The conflict is whether Galileo *had* one. If the standard of "demonstration" was applied inconsistently (e.g., accepting Aristotelian physics without the same rigor), that weakens the "epistemic prudence" claim.
      *   *Insulation:* I need to validate the user's suspicion. Yes, "contextualization" can become a shield. I should distinguish between *historical contextualization* (understanding norms) and *normative absolution* (excusing violations of those norms).

  7.  **Final Polish:** Check tone. Ensure it's analytical, not argumentative. Ensure the ranking is clear. (Fatal, Serious, Awkward). Ensure the "version survival" part is addressed for each.

