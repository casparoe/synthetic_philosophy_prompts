answer: |-
  ### 1. Pre-Flight Check: Your Gloss of the Two-Bitser

  You are 80% there, but the remaining 20% is the philosophical payload. If you teach the gloss exactly as you wrote it, you risk reinforcing the dualism Dennett is trying to destroy.

  **The Correction:**
  You wrote: *"the machine's states end up meaning what they do partly in virtue of facts about the environment... not something intrinsic it carried all along."*
  **The Risk:** This sounds like you are arguing the machine *graduates* from Derived to Original intentionality once the environment shifts.
  **Dennett's Actual Point:** Dennett argues the distinction **collapses**. He doesn't argue the machine *becomes* original; he argues that **original intentionality is a myth**. Even human "original" intentionality is just derived intentionality (from evolution, history, and environmental coupling) that is complex enough to hide its derivations. The Two-Bitser isn't a story about a machine *becoming* like us; it's a story showing we are *already* like the machine.

  **Adjustment:** Do not present the Two-Bitser as a transformation story. Present it as a **parity argument**.
  *   **Case A:** The machine in Seattle (designed to take quarters). Searle says: Derived.
  *   **Case B:** The machine in a world where "quarters" are natural discs (no designers). Searle might say: Original?
  *   **Dennett's Punchline:** There is no physical/functional difference between Case A and Case B. If the meaning depends on history/environment in Case B, it *also* depended on history/environment in Case A. Therefore, "Original" intentionality (intrinsic, non-derived) doesn't exist. All intentionality is derived.

  If you teach the "transformation" version, students will think Dennett is just moving the goalposts. If you teach the "parity" version, they see he's attacking the premise.

  ---

  ### 2. The 50-Minute Arc

  **Dependencies:** You cannot run the Dennett objection until the Searle distinction is steel-manned. You cannot discuss consciousness until you have separated it from intentionality.

  #### **0:00 – 0:05 | Reset: The Chinese Room Hangover**
  *   **Goal:** Pivot from "Understanding" (psychological capacity) to "Intentionality" (semantic content).
  *   **Move:** Acknowledge the prevailing mood ("The room doesn't understand"). Tell them that's the *phenomenological* reading, but Searle's *metaphysical* claim is sharper.
  *   **Board Work:** Write "INTENTIONALITY = ABOUTNESS."
  *   **Script:** "Last week we focused on whether the room *knows* Chinese. Searle's deeper point is about where the *meaning* comes from. The symbols in the room are meaningless marks to the man. Searle claims they only get meaning from *us* outside the room. That is the claim of Derived Intentionality."

  #### **0:05 – 0:15 | Searle's Distinction (Steel-man the Dualism)**
  *   **Goal:** Define Original vs. Derived without letting them dismiss Derived as "fake."
  *   **Misconception Alert #1 (Intentionality = Intending):** Students hear "intentionality" and think "doing things on purpose."
      *   **Fix:** Explicitly state: "This has nothing to do with *intending* to go to the store. A sentence, a map, or a thought has intentionality if it is *about* something. 'The cat is on the mat' is about the cat. That's intentionality."
  *   **Misconception Alert #2 (Derived = Weaker/Metaphorical):** Students think Derived means "not real."
      *   **Fix:** Clarify Searle's view: Derived intentionality is *real*, it's just *borrowed*. A stop sign really does mean "stop," but only because we decided it does. Human thoughts, Searle says, mean things *intrinsically*, not because someone else decided they do.
  *   **Check for Understanding:** Ask: "Does a menu have original or derived intentionality?" (Answer: Derived. It means 'food' because we use it that way.) "Does your thought of food?" (Searle says: Original.)

  #### **0:15 – 0:35 | Dennett's Two-Bitser (The Attack)**
  *   **Goal:** Use the machine to collapse the distinction.
  *   **Setup:** Describe the Two-Bitser (quarter detector).
      *   *State 1:* Accepts genuine quarter.
      *   *State 2:* Rejects slug.
      *   *Searle's Verdict:* This is Derived. The engineers meant for it to track quarters.
  *   **The Pivot:** Introduce the environmental/historical variation (your "relocation" point, corrected).
      *   Imagine the machine is dug up in 3024. No engineers left. The "quarters" are now just rare metal discs found in nature. The machine still sorts them.
      *   Does the state now mean "quarter" or "metal disc"?
      *   Dennett's point: The machine's internal state hasn't changed. The *only* thing that changed is the history/environment.
  *   **The Trap:** If meaning depends on history/environment for the machine, **it always depended on history/environment.** Even when the engineers were alive, the machine meant "quarter" only because of the economic system surrounding it.
  *   **The Conclusion:** There is no "Original" intentionality left over. Human brains are just Two-Bitsers with more layers. We derive our meaning from evolution and environment, just like the machine.
  *   **Misconception Alert #3 (Systems Reply in Disguise):** A student will say: "This is just the Systems Reply. The machine + environment = understanding."
      *   **Fix:** "The Systems Reply says the *room* understands Chinese. Dennett isn't saying the *machine* understands. He's saying the category 'Original Intentionality' is empty. He's attacking Searle's definition of meaning, not defending the room's intelligence."

  #### **0:35 – 0:45 | Troubleshooting: Consciousness & Qualia**
  *   **Goal:** Contain the "Vending Machines are Conscious" explosion.
  *   **Misconception Alert #4 (Intentionality = Consciousness):** Students will conclude Dennett is saying vending machines have feelings/qualia.
      *   **Fix:** Draw a line on the board: **SEMANTICS (Meaning) vs. PHENOMENOLOGY (Feeling).**
      *   **Script:** "Dennett is arguing about *content*, not *light*. He is not claiming the machine feels happy when it takes a quarter. He is claiming the state 'quarter detected' carries information about the world in the same way your neuron firing carries information. You can have one without the other."
      *   **Refusal:** Explicitly state: "We are not discussing *qualia* or *what it is like* to be a machine today. That is the Hard Problem. We are discussing the *source of meaning*. Keep those separate."

  #### **0:45 – 0:50 | Assessment & Wrap**
  *   **Goal:** Verify they grasp the collapse of the distinction.
  *   **Activity:** Pose the Exit Question (see below). Have them write a 2-sentence answer on a scrap of paper.

  ---

  ### 3. What to Refuse to Cover (Explicitly)

  To keep this within 50 minutes and at the Intro level, you must draw boundaries. Tell the students:

  1.  **No Teleosemantics:** "We are not going into the biology of evolution (Millikan, etc.) to explain *how* history fixes meaning. We are just accepting Dennett's premise that history matters."
  2.  **No Fodor/Language of Thought:** "We are not discussing whether the brain has a syntax. We are discussing whether that syntax would be 'original' or 'derived'."
  3.  **No Phenomenal Consciousness:** "As mentioned, we are bracketing 'feelings.' A book has meaning without feelings. Dennett is arguing brains might be like books. Whether they *feel* like anything is a different class."

  ---

  ### 4. The Exit Question

  Do not ask them to define the terms. Ask them to apply the *critique*.

  **"Searle claims that if we discovered humans were designed by aliens to survive, our thoughts would still have 'Original Intentionality.' Based on Dennett's Two-Bitser argument, why would Searle be wrong?"**

  *   **Correct Answer Key:** Because if meaning depends on history/function (as the Two-Bitser shows), then being designed by aliens makes our intentionality "derived" from their design/our function. There is no remaining "original" substance.
  *   **What to look for:** If they answer "Because aliens would control us," they missed the point. If they answer "Because design implies derivation, and Dennett says all intentionality is derived," they got it.

  ### 5. Summary of Misconception Timing

  | Minute | Misconception | Intervention |
  | :--- | :--- | :--- |
  | **0:05** | Intentionality = Volition ("Intending") | Define as "Aboutness" immediately. |
  | **0:10** | Derived = Fake/Metaphorical | Clarify Searle admits it's real, just dependent. |
  | **0:25** | Two-Bitser = Systems Reply | Distinguish "System understands" vs. "Distinction is bogus." |
  | **0:40** | Vending Machine = Conscious | Separate Semantics (Meaning) from Phenomenology (Feeling). |

  ### Final Advice for the TA
  Your biggest hurdle is the students' attachment to the "magic" of human meaning. They *want* Searle to be right because the alternative feels dehumanizing. When you present Dennett, acknowledge the discomfort: "This feels like it reduces us to machines. Dennett says: 'Good. Now we can study how the machines work.'" If you validate that the conclusion is startling, they will be less likely to reject it out of hand. Good luck.
