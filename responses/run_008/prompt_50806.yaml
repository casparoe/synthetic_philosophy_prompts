prompt: |-
  I'm a philosophy grad student TA-ing intro phil of mind, and next week I have to run a fifty-minute section on original vs derived intentionality — Dennett's side of his running argument with Searle. The students saw the Chinese Room the week before and mostly walked out thinking the moral is just "the room doesn't really understand, case closed," which is exactly the reading that makes the rest of this impossible, so I need to build the session against that. The plan should use Dennett's two-bitser as the carrying example. Quick gloss of it in my own words, since the students won't have read anything: a machine engineered to accept genuine tokens and reject slugs — discrimination built in by designers, so its "aboutness" looks borrowed from the engineers who had the distinction in mind first. But then imagine it gets relocated (or the economy changes) so that the very distinction it was built to exploit is now constituted by the machine's own sorting behavior — the machine's states end up meaning what they do partly in virtue of facts about the environment and history of use, not something intrinsic it carried all along. If I've garbled details of the setup, flag that for me rather than building on my mistake — you're the expert here, you've taught this material for years, so think carefully about the actual structure of the debate first and only then give me the plan.

  What I want from you is a teaching plan, not the explanation itself. Specifically: the order the pieces have to come in and what depends on what — my instinct is they have to first see that Searle's charge was never "the room isn't smart" but "its symbols don't mean anything in themselves, they only borrow meaning from us," and that the two-bitser can't do any work until that's secure, but tell me if that ordering is wrong or incomplete. Then the misconceptions, in the order the students will actually form them, with the point in the sequence where I should head each one off. I'm guessing at least these: intentionality gets heard as "having intentions," i.e. doing things on purpose; "derived" gets heard as "weaker / only metaphorical," so Dennett sounds like he's conceding Searle's point and quibbling about degree; and the two-bitser gets dismissed as the systems reply in fancy dress. Probably also someone who concludes we're claiming vending machines are conscious, and I'd like to know where exactly that gets absorbed rather than left for office hours. Also tell me what I should openly refuse to cover at this level — I assume teleosemantics and anything Fodor, but say so explicitly so I can say it out loud in the section — and give me one question I can ask at the end that would show they got the distinction rather than just endured it. Don't reccomend readings, the course has that covered; I need the arc of the fifty minutes.
