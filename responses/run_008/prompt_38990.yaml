answer: |-
  Your friend has reconstructed what is often called Popper's 'Growth of Knowledge' argument, and it is a formidable piece of reasoning. It is certainly the version of Popper that most analytic philosophers take seriously, rather than the sometimes muddled text of *The Poverty of Historicism* itself. However, your intuition that something goes awry at step (6) is correct, and your unease about step (4) touches on a genuine philosophical nerve.

  The bind you feel—that rejecting (4) seems to surrender to the historicist, while accepting it seems to torch climate science—arises because your friend's argument relies on an equivocation on the word 'law'. To untangle this without doing violence to Popper or to science, you should not reject (4) outright, but rather restrict its scope. The step you are entitled to reject is the move from (5) to (6), grounded in a clarification of (1) and (2).

  Here is how you might dismantle the argument while preserving Popper's core insight.

  ### 1. The Distinction Between Conditional and Unconditional Prediction

  The first place to apply pressure is premise (1): *"A law of history, if there were one, would have to support predictions of the future course of history."*

  This looks innocuous, but for Popper, the crucial distinction is between **conditional predictions** and **unconditional prophecies**. Popper does not deny that we can make scientific predictions based on laws. He denies that we can predict the *future course of history* (the grand trajectory of society) because that would require knowing the future initial conditions.

  In climate science, models do not say: "The temperature *will* be 2°C higher in 2100." They say: "If atmospheric CO2 reaches X ppm, then the temperature *will* rise by Y." This is a conditional prediction based on laws of physics (radiative forcing, thermodynamics). It remains valid even if we cannot predict whether humans *will* emit that much CO2, because that depends on future knowledge and policy.

  Historicism, as Popper defines it, claims to offer unconditional predictions of the *inevitable* shape of society (e.g., "Feudalism must give way to Capitalism, which must give way to Socialism"). Popper's argument is that because the future depends on knowledge, and knowledge is unpredictable, these *unconditional* historical trajectories cannot be lawful.

  **The Fix:** Modify (1) to specify that a *historicist* law must support *unconditional* predictions of the overall course of society. If you do this, (4) remains defensible for historicism (you can't have a law of inevitable historical destiny if you can't predict the destination), but it no longer threatens climate modelling, which deals in conditional projections based on physical laws.

  ### 2. The Scope of the 'Growth of Knowledge' Premise

  Your friend's premise (2) states: *"The future course of history is substantially fixed by the growth of knowledge... and nothing else compounds the way knowledge does."*

  This is the hidden engine of the argument. It is plausible for 'History' in the grand philosophical sense (the history of ideas, institutions, and technology). It is demonstrably false for the specific examples in (6).

  *   **Demography:** As you noted, the number of 70-year-olds in 2050 is largely fixed by the number of people alive today. This is a biological fact, not a function of future scientific discovery. While migration or mortality rates might shift slightly due to medical advances (knowledge), the core variable is an existing initial condition. The 'Growth of Knowledge' argument does not apply to variables that are already determined.
  *   **Climate:** The physical response of the climate to greenhouse gases is governed by laws of chemistry and physics, not by the history of human ideas. Whether we *discover* a new theory of quantum gravity in 2040 will not change the absorption spectrum of CO2. The uncertainty in climate projections comes from human behaviour (emissions) and chaotic physical systems, not from the unpredictability of the *laws* themselves.

  **The Fix:** You reject the universalisation in (6). The 'Growth of Knowledge' argument applies to systems where the *variables* are constituted by human knowledge (e.g., stock markets, political ideologies, technological adoption). It does not apply to systems where the variables are physical or biological constants, even if humans influence them.

  ### 3. Addressing Your Worry About Step (4)

  You wrote: *"Surely something can be lawful without being predictable by us, as with chaotic systems..."*

  You are philosophically in good company here. Many critics (such as Anthony O'Hear or I.C. Jarvie) have noted that Popper conflates **ontological determinism** (the world is governed by laws) with **epistemological predictability** (we can calculate the outcome).

  If you reject (4) in its strong form ("Nothing that cannot be predicted... can be governed by a law"), you do not necessarily hand a victory to the historicist. Why? Because the historicist claims more than just "there are laws." They claim "there are laws that allow us to discern the *inevitable trend* of history."

  Even if laws exist but are unpredictable due to chaos or complexity (the 'error' in (4)), the historicist still fails if they cannot demonstrate the *trend*. Popper's deeper point is not just about predictability, but about the logical impossibility of deriving a specific historical trajectory from universal laws without specifying initial conditions which we cannot know (because they include future knowledge).

  So, you can concede that (4) is too strong regarding *laws of nature* (saving climate science), whilst maintaining that it holds for *laws of historical development* (saving Popper). The historicist wants a law that says "Society develops towards X." If we can't predict X because knowledge changes the path, the 'law' is useless for its intended purpose. It might be a 'law' in the abstract, but it is not a 'law of history' in the sense that matters for historicism.

  ### 4. Scholarly Consensus vs. Live Controversy

  For your essay, it is vital to distinguish between what Popper clearly argued and where scholars still fight.

  *   **Settled among Popper scholars:** The 'Growth of Knowledge' argument (your steps 2 and 3) is widely accepted as the strongest core of *The Poverty of Historicism*. Most agree that Popper successfully showed that large-scale, unconditional historical prophecy is scientifically illegitimate. There is consensus that Popper distinguishes between *trends* (observed regularities) and *laws* (universal necessities), and that historicists confuse the two.
  *   **Live Controversy:** The extent to which this argument disables *all* social science is disputed. Some critics (like those in the critical realist tradition) argue Popper sets up a straw man of historicism that no serious Marxist or Hegelian actually held. Others argue that his definition of 'law' is too narrow (positivist) and excludes structural or functional explanations that don't yield precise predictions but still explain.
  *   **The Extension to Science (Step 6):** There is no consensus that Popper's argument kills climate or demographic modelling. In fact, most philosophers of science view climate models as paradigmatic examples of the *conditional* prediction Popper allowed. If your friend claims Popper proves climate science is "guesswork," that is a controversial extension, not a settled reading.

  ### Summary of Advice

  To answer your specific questions:

  1.  **Which step should I reject?**
      Do not reject (4) outright, as that creates the bind you fear. Instead, reject the **universal application of (2) in step (6)**. Argue that the 'Growth of Knowledge' constraint applies to *historical trajectories* dependent on human ideas, not to *physical systems* or *fixed demographic cohorts*. Simultaneously, refine (1) to distinguish between *conditional* scientific predictions (allowed) and *unconditional* historical prophecies (forbidden).

  2.  **Why did that step look fine?**
      It looked fine because 'History', 'Demography', and 'Climate' are all colloquially treated as 'long-range futures'. Your friend exploited the ambiguity of the word 'law' to treat physical laws (climate) and sociological trends (historicism) as the same logical category. They are not.

  3.  **What does rejecting it cost?**
      It costs your friend the dramatic flair of claiming *all* long-range science is guesswork. It preserves the validity of physical sciences and demographic accounting. It does not cost Popper anything, because Popper's target was specifically the *historicist* claim that the *political destiny* of mankind is fixed by law.

  4.  **Scholarly Context:**
      You can confidently state that the 'Growth of Knowledge' argument is the standard defence of Popper's thesis. However, you should note that extending this to invalidate physical modelling is a contention not found in Popper's own text, which carefully exempts the natural sciences from his critique of historicism.

  In British academic writing, you might phrase the conclusion thus:

  > "Whilst the friend's reconstruction captures the logical force of Popper's epistemological critique, it overextends the 'Growth of Knowledge' argument to domains governed by physical rather than sociological variables. By conflating conditional projections based on natural laws with unconditional prophecies of historical destiny, the argument fails to distinguish between the illegitimate historicism Popper sought to refute and the legitimate scientific modelling employed in climatology and demography."

  This allows you to honour Popper's logic without accepting your friend's sceptical coda.
