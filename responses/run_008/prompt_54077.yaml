  ### Referee's Preliminary Notes

  **Diagnosis:** The original argument fails at Step (3) due to an equivocation on the variable $A$. It treats $A$ as a fixed constant when calculating gains, but as a random variable when applying probabilities. The probability $1/2$ applies to the *configuration* (which envelope is larger), not to the *value* $A$ being independent of that configuration.

  **Strengthened Case:** The colleague's distribution creates a scenario where the expected value of the envelope contents is infinite. In such cases, the Law of Total Expectation fails. While switching is conditionally preferred for every observed value, these conditional expectations cannot be aggregated to form a valid unconditional expectation. Symmetry is preserved; the expectation operator is what breaks.

  **Recommendation:** Reject the claim that one should switch before opening. Accept that conditional switching is rational but non-aggregatable in infinite expectation cases. Restrict decision rules to integrable variables to maintain coherence.

  ***

  ### Formal Verdict

  **To:** The Disputing Parties
  **From:** Office of the Decision Theorist
  **Subject:** Adjudication of the Two-Envelope Dispute

  I have reviewed the arguments concerning the Two-Envelope Paradox, specifically the claim that switching is unconditionally rational (1)–(5), and the counter-claim involving a specific probability distribution that yields positive conditional expected gain for every observation. Below is my rigorous diagnosis and ruling.

  #### I. Diagnosis of the Original Argument (1)–(5)

  The argument fails at **Step (3)**. The error is a subtle equivocation regarding the status of $A$.

  **1. The Status of A**
  In Step (1), $A$ is introduced as "the amount in my envelope." Formally, $A$ is a random variable, let us call it $X$.
  In Step (3), the calculation is performed: $(1/2)(+A) + (1/2)(-A/2)$.
  For this arithmetic to hold, $A$ must be treated as a **fixed constant** within the scope of the expectation. The calculation assumes that if you hold the smaller envelope, the gain is $+A$, and if you hold the larger, the loss is $-A/2$, where $A$ is the *same number* in both cases.

  **2. The Correlation Error**
  However, $A$ is not independent of the event "I hold the smaller envelope."
  Let $S$ be the smaller amount in the pair.
  *   **Case 1 (Smaller):** You hold $S$. Here $A = S$. The other envelope is $2S$. Gain = $+S = +A$.
  *   **Case 2 (Larger):** You hold $2S$. Here $A = 2S$. The other envelope is $S$. Gain = $-S = -A/2$.

  The colleague's calculation in Step (3) effectively computes:
  $$ \frac{1}{2}(S) + \frac{1}{2}(-S) $$
  But by substituting $A$ back in, they write:
  $$ \frac{1}{2}(A) + \frac{1}{2}(-A/2) $$
  This substitution is only valid if the value of $A$ in the first term (where $A=S$) is identical to the value of $A$ in the second term (where $A=2S$). This is false. The $A$ in the "win" scenario is half the size of the $A$ in the "lose" scenario.

  **3. The Probability 1/2**
  The probability $1/2$ in Step (2) is legitimate *unconditionally*: $P(\text{Hold Smaller}) = 1/2$. However, Step (3) requires the expectation of the *gain*, which is the product of the probability and the *value* of the gain. Because the value of the gain depends on $A$, and $A$ depends on whether you hold the smaller or larger envelope, you cannot factor $A$ out of the expectation.
  The correct unconditional expectation is:
  $$ E[\text{Gain}] = \frac{1}{2}E[S] + \frac{1}{2}E[-S] = 0 $$
  The colleague's error is treating $A$ as a constant $c$ such that $E[\text{Gain}] = \frac{1}{2}c + \frac{1}{2}(-c/2)$, which ignores that $c$ varies between the two branches of the probability tree.

  #### II. Analysis of the Strengthened Version

  My colleague's second argument attempts to bypass the above diagnosis by constructing a distribution where the conditional expected gain is positive for *every* specific observed value $x$.

  **1. The Setup**
  Let the smaller amount $S$ take values $2^k$ with probability $P(S=2^k) = \frac{1}{3}(\frac{2}{3})^k$ for $k \ge 0$.
  If you open your envelope and observe $X = 2^n$:
  *   Probability you hold the smaller ($S=2^n$): Proportional to $(\frac{2}{3})^n \cdot \frac{1}{2}$.
  *   Probability you hold the larger ($S=2^{n-1}$): Proportional to $(\frac{2}{3})^{n-1} \cdot \frac{1}{2}$.
  *   The ratio is $2/3$. Thus $P(\text{Small} \mid X=2^n) = 2/5$ and $P(\text{Large} \mid X=2^n) = 3/5$.
  *   Conditional Expected Gain: $\frac{2}{5}(2^n) + \frac{3}{5}(-2^{n-1}) = 2^n (\frac{2}{5} - \frac{3}{10}) = \frac{2^n}{10} > 0$.

  The calculation is correct. For every $x$, $E[\text{Gain} \mid X=x] > 0$.

  **2. The Failure of Aggregation**
  The colleague infers: "If I switch for every $x$, I should switch before opening."
  This inference relies on the **Law of Total Expectation (LTE)**: $E[G] = \sum P(X=x) E[G \mid X=x]$.
  This law holds only if the random variable is **integrable** (i.e., $E[|G|] < \infty$).
  In this specific distribution, the expected value of the money in the envelope is infinite:
  $$ E[X] = \sum_{k=0}^{\infty} P(S=2^k) \cdot E[X \mid S=2^k] = \sum_{k=0}^{\infty} \frac{1}{3}\left(\frac{2}{3}\right)^k \cdot \left(\frac{3}{2} 2^k\right) = \frac{1}{2} \sum_{k=0}^{\infty} \left(\frac{4}{3}\right)^k = \infty $$
  Because $E[X]$ diverges, $E[\text{Gain}]$ is undefined (it takes the form $\infty - \infty$). When expectations are infinite, LTE fails. You cannot sum the conditional gains to find an unconditional gain. The series of conditional gains does not converge to a meaningful total.

  **3. Symmetry vs. Expectation**
  Symmetry dictates that ex-ante, the two envelopes are identically distributed. Let $X$ be your envelope and $Y$ be the other. $X$ and $Y$ have the same distribution.
  Therefore, $E[X] = E[Y] = \infty$.
  The expected gain is $E[Y - X]$. Since both terms are infinite, the difference is undefined. It is not zero, but it is certainly not positive. The symmetry argument holds: there is no rational basis to prefer $Y$ over $X$ before opening, because the situation is perfectly symmetric. The positive conditional expectations are an artifact of the infinite tail of the distribution; they do not aggregate to a coherent global preference.

  #### III. Pricing the Alternatives

  To resolve the paradox, we must restrict one of the principles in play. I evaluate the costs of the available surrenders:

  **1. Surrender the Aggregation Principle (LTE for Infinite Cases)**
  *   **The Restriction:** We accept that "Preferred conditional on all $x$" does not imply "Preferred unconditionally" when expectations diverge.
  *   **The Cost:** We lose the ability to use standard expected utility maximization in St. Petersburg-style games with linear utility. We must declare such decisions "undefined" or require a different decision rule (e.g., median utility, or bounded utility).
  *   **Assessment:** This is the standard mathematical resolution (Measure Theory). It preserves the consistency of probability theory. The cost is low for practical applications, as real-world payoffs are bounded.

  **2. Surrender Unbounded Payoffs**
  *   **The Restriction:** We impose a maximum cap on utility or money (Bounded Utility).
  *   **The Cost:** Theoretical inelegance. It requires modifying the utility function to be asymptotic.
  *   **Assessment:** This also resolves the paradox (expectations become finite). It is philosophically defensible (diminishing marginal utility), but the "Infinite Expectation" diagnosis is more fundamental to the probability calculus itself.

  **3. Surrender Symmetry (Accept Colleague's View)**
  *   **The Restriction:** We accept that one should switch ex-ante despite identical distributions.
  *   **The Cost:** This violates the Principle of Indifference and basic coherence. If $X$ and $Y$ are identically distributed, a rational agent cannot strictly prefer $Y$ to $X$ without additional information.
  *   **Assessment:** Unacceptable. It breaks decision theory.

  #### IV. Final Ruling

  1.  **On the Original Argument:** The argument (1)–(5) is **rejected**. Step (3) commits an equivocation error by treating the random variable $A$ as a constant independent of the envelope configuration. The unconditional expected gain is zero.
  2.  **On the Strengthened Argument:** The calculation of positive conditional gain is **correct**, but the inference to unconditional switching is **invalid**. The expected value of the envelope contents is infinite, rendering the unconditional expected gain undefined. The Law of Total Expectation does not apply.
  3.  **On Rational Action:**
      *   **Before Opening:** You are **indifferent**. Symmetry holds. There is no expected gain from switching.
      *   **After Opening:** You **should switch** (assuming linear utility and the specific distribution provided). The conditional expectation is well-defined and positive.
      *   **Resolution:** There is no contradiction. Rationality permits a policy of "Switch whatever you see" without implying "Switch before looking" in cases of infinite expectation. The principle that licenses the passage from conditional to unconditional preference (Dominance/LTE) is restricted to integrable variables.

  **Verdict:** The colleague's claim that rationality recommends switching *before* opening is false. The standard reply is vindicated, provided it is strengthened to explicitly address the failure of expectation aggregation in infinite cases.

