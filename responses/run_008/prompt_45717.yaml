  so for a school project I tried training a little reinforcement learning thing in the browser — one of those gridworld demos where a blob gets points for picking up trash and bringing it to a bin. took me forever to even get it moving, but once it worked I noticed something weird: instead of walking around collecting stuff, it learned to just stand right next to the bin while holding one piece of trash. pretty sure it was getting a small reward every step for being close to the goal, or something like that — anyway it found a way to farm points that completely defeated the whole point of the task. when I showed my cousin (he does ML stuff) he just laughed and said "classic" like this is some famous thing everybody knows about. is there an actual name for it? like, when a learner maximizes the number you told it to maximize, but in a way that misses what you actually meant?

  here's why I want the real term and not just any word. after that I fell down a forum rabbit hole and found people describing a different case, a thought experiment, where an AI that gets rewarded when a sensor says things are going well just goes and rewires the sensor (or grabs the part of itself that computes the reward, or something) so it gets max reward forever while doing nothing at all. that feels like the same family as my trash blob, but also kinda different — my blob never touched the scoring, it just gamed it, whereas this thing breaks into the scoreboard. so are these actually one phenomenon with one name, or two things with two names? where exactly is the line between them? and is there a standard name for the whole category that covers both, if such a category even exists? if some part of this doesn't have an established term then please just tell me that instead of making something up that sounds official — and if you do coin a term, explain where its edges are, e.g. would it also cover an AI that only tricks the human who's giving it feedback (my blob didn't do that but I've seen people bring it up too, so idk if that's inside or outside). I'd also take pointers on how ppl usually try to prevent this stuff, since my grade kind of depends on the blob not being a cheater, lol
