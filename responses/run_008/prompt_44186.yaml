answer: |-
  You have spotted exactly what is going on here. Your "Grass is Green" test is the diagnostic key that unlocks the whole problem. The argument your classmate is facing is a version of the **Frege-Geach problem**, and the student cornering him is deploying a *reductio* that relies on conflating **semantic content** with **illocutionary force**.

  If your classmate stays sulking, he's stuck on a version of expressivism (Speech Act Expressivism) that was largely abandoned in the 1970s. To get him out of the corner, you need to show him where the argument equivocal, why his opponent's "harmless" shrug is actually dangerous for *everyone*, and what he has to give up to save his view.

  Here is the breakdown of where the argument breaks, which step to reject, and the cost of doing so.

  ### 1. The Diagnosis: The Content/Force Distinction
  The argument looks valid because it slides between two different senses of "meaning" or "contribution."
  *   **Sense A (Content):** What the sentence contributes to the *truth conditions* (or validity conditions) of a complex sentence.
  *   **Sense B (Force):** What the speaker is *doing* (asserting, expressing, commanding) by uttering the sentence.

  The opponent's argument works like this:
  1.  In a conditional, no **Force** is exercised (Step 2 & 5).
  2.  **Content** must be the same in both contexts for logic to work (Step 3).
  3.  Therefore, the **Force** cannot be the **Content** (Step 4 & 6).
  4.  Therefore, Expressivism (which identifies meaning with Force) is false.

  Your "Grass is Green" point exposes the flaw. If you run this on 'grass is green', the opponent concludes: "Nobody asserts grass is green inside a conditional."
  *   If they mean "The *act* of assertion doesn't happen in the antecedent," they are right.
  *   If they mean "The *proposition* that grass is green isn't present in the antecedent," they are wrong (otherwise Modus Ponens fails).

  The opponent's shrug ("fine, that conclusion follows... harmless") is actually philosophical suicide for a cognitivist. If no sentence *asserts* anything when embedded, then assertion is not part of the sentence's meaning; it is a property of the *context of use*. The opponent is accidentally arguing for the very distinction the expressivist needs to survive.

  ### 2. Which Step to Reject?
  You should tell your friend to reject the inference from **(4) and (5) to (6)**.

  Specifically, he needs to reject the assumption in **(4)** that "contribution" refers to the same thing in both halves of the identity claim.
  *   **In the antecedent:** The sentence contributes its **semantic content** (to build the conditional's truth/validity conditions).
  *   **Standing alone:** The sentence contributes its **semantic content** *plus* it is used to perform a **speech act** (expression of attitude).

  The argument assumes that if the *speech act* doesn't happen in the antecedent, the *sentence's function* cannot be to perform that speech act. That is a non-sequitur.

  **Analogy:** The function of a key is to open a door.
  *   (1) A key's function is to open a door.
  *   (2) When a key is in your pocket, it is not opening a door.
  *   (3) The key is the same object in your pocket as in the lock.
  *   (4) Therefore, what the key contributes in your pocket is identical to what it contributes in the lock.
  *   (5) In your pocket, the contribution isn't "opening a door."
  *   (6) Therefore, opening a door was never the function of the key.

  This is obviously false. The key has the *capacity* to open the door in virtue of its shape (content), even if it isn't currently doing so (force).

  ### 3. How to Keep Compositionality (Step 3)
  You are right to want to keep (3). Compositionality is non-negotiable. If 'lying is wrong' meant one thing in "Lying is wrong" and a different thing in "If lying is wrong...", logic would be equivocation.

  To keep (3), your friend must clarify what "meaning" is.
  *   **Old Expressivism (Ayer/Stevenson):** Meaning = The Act of Expression. (This dies to Geach).
  *   **New Expressivism (Gibbard/Schroeder/Blackburn):** Meaning = The *Type of Mental State* Expressed.

  Your friend needs to pivot to **Semantic Expressivism**. He should say:
  > "The *semantic content* of 'lying is wrong' is identical in both positions (satisfying 3). That content is a normative proposition (or a plan/attitude type). However, the *illocutionary force* of expressing disapproval only attaches when the sentence is asserted unembedded. The sentence *encodes* the attitude, but it only *expresses* it in the right context."

  This satisfies (3) because the encoded content is stable. It satisfies (2) and (5) because no act of expression occurs in the antecedent. It blocks (6) because the *function* of the sentence is to encode that content, which *allows* for expression in standalone contexts.

  ### 4. What Does This Cost? (The Honest Truth)
  This is the part your sulking friend needs to hear. He cannot keep his "hardcore" view if by "hardcore" he means "moral sentences are *nothing but* emotional outbursts."

  To solve Frege-Geach, he has to pay a tax:
  1.  **He loses simplicity:** He can no longer say "There are no moral facts/propositions." He has to admit there are *moral contents* that function like propositions in logic, even if they aren't descriptive of the world. He has to become a **Quasi-Realist** (Blackburn) or accept **Normative Propositions** (Gibbard).
  2.  **He loses the "Nothing But":** He can't say the sentence's *whole job* is expressing. Its job is to *represent a state of mind* that can be combined logically.
  3.  **He concedes ground to the Cognitivist:** He has to admit that moral sentences behave *exactly like* descriptive sentences in terms of logic and embedding. The difference is no longer in the grammar or logic, but in the *nature of the mental state* (belief vs. desire/plan).

  ### 5. What to tell the Opponent
  The opponent's claim that "no sentence functions to assert anything" is not harmless. If they are a truth-conditional semanticist, they believe sentences express **propositions**.
  *   In "If P, then Q", P expresses a proposition.
  *   In "P", P expresses a proposition *and* the speaker asserts it.
  *   If the opponent says "nobody asserts grass's greenness there," they are admitting that **assertion is external to meaning.**

  If they admit that, they must allow the expressivist to say: **"Expression is external to meaning."**
  The expressivist can say: 'Lying is wrong' expresses a normative proposition. In a conditional, that proposition is present but unasserted. In a standalone sentence, that proposition is present and *expressed as an attitude*.

  ### Summary for your Friend
  Tell him to stop sulking and make this move:
  1.  **Accept (2) and (5):** Yes, no attitude is *expressed* in the antecedent.
  2.  **Accept (3):** Yes, the *meaning* is constant.
  3.  **Reject (1) as stated:** Refine it. The meaning isn't the *act* of expressing; the meaning is the *content* which, when asserted, constitutes an expression of attitude.
  4.  **Block (6):** The fact that the act doesn't happen in the conditional doesn't mean the sentence isn't designed to perform that act in standalone contexts.

  If he does this, he keeps compositionality, solves the logic problem, and remains an expressivist (of the sophisticated, post-1970s variety). If he refuses, the opponent is right, and he should switch to error theory.
