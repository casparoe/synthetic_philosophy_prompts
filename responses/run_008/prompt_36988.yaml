      *   *Distortion $g$:* For risk aversion (ES), $g$ is concave on the survival function (weights tail losses more).
      *   *Mapping:* Buchak's $r(p)$ corresponds to $g(p)$ in distortion risk measures.
      *   *Independence:* In EU, $U(pA + (1-p)B) = pU(A) + (1-p)U(B)$. In Risk Measures, this is linearity. ES is not linear (it's subadditive and positive homogeneous). So ES *violates* Independence in the EU sense. This is a crucial link. EU requires linearity. Coherent Risk Measures (like ES) do not. Buchak says "Linearity isn't required for rationality." Finance says "Linearity isn't required for prudence."

