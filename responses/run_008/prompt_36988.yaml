      *   **Current Activity:** Reading decision theory (specifically Lara Buchak's Risk-Weighted Expected Utility - REU) as a hobby.
      *   **Core Question:** Translate Buchak's REU theory and the surrounding philosophical debate (Allais paradox, independence axiom, rationality vs. risk attitude) into financial risk management vocabulary.
      *   **Specific Task:**
