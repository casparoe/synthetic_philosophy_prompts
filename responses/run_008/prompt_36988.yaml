      *   **Buchak's REU:** $REU(L) = \sum [r(\sum_{j=1}^i p_j) - r(\sum_{j=1}^{i-1} p_j)] u(x_i)$. Or integral form: $\int r(1-F(u)) du$.
      *   **Key Feature:** The risk function $r$ distorts cumulative probabilities *before* aggregation. $r$ is convex for risk-averse agents (weighting lower outcomes more heavily).
      *   **Philosophical Claim:** Violating Independence (Allais preferences) is rational. Risk attitude is a separate primitive from belief (probability) and desire (utility). EU conflates them.

  3.  **Map to Financial Risk Vocabulary:**
      *   **P&L Distribution:** The lottery $L$.
      *   **Utility:** In finance, we often separate Risk Measure ($\rho$) applied to P&L ($X$) from Utility ($U$) applied to Wealth. Buchak applies distortion to *utility*. Finance often applies distortion to *P&L* (or returns).
      *   **Distortion Risk Measures:** $\rho_g(X) = \int_{-\infty}^0 (g(S_X(x)) - 1) dx + \int_0^{\infty} g(S_X(x)) dx$. Where $g$ is a distortion function on the survival function.
      *   **Spectral Risk Measures:** $\rho_\phi(X) = \int_0^1 \phi(p) F_X^{-1}(p) dp$. $\phi$ is a risk spectrum (weighting function).
      *   **Connection:** Buchak's $r$ is effectively a distortion function $g$. If $u$ is linear (risk-neutral wealth), REU looks exactly like a Distortion Risk Measure. If $u$ is concave, it's a composition.
      *   **Coherence:** ES is coherent (subadditive). VaR is not. Distortion measures are coherent if $g$ is concave. Buchak's $r$ being convex (for risk aversion) corresponds to concave distortion on losses (depending on sign convention).

