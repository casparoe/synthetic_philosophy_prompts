prompt: |-
  For years I've read the rationalist blogs and forums, long enough that phrases like "epistemic circularity" and "the evidence is only good if the method already is" feel obvious to me — but I've recently discovered that I can't turn that instinct into anything actionable, and I now need to.

  The situation: I help review member-proposed self-tracking protocols for a quantified-self community. Members regularly submit validation schemes for their instruments, and a disconcerting number of them have the shape epistemologists call the "easy knowledge" or bootstrapping problem: the method up for validation is used, quietly, to produce the very evidence offered as validating it. I can usually smell a bad case, but not reliably, and I have no articulated standard to point to when telling a member their validation doesn't count.

  Please write me a review procedure I can run on a proposed validation in about twenty minutes: the questions to ask, in order; what counts as a fatal answer at each question; where the procedure stops with a rejection; and which stages are genuinely irreducible judgment calls that no checklist can make for me. It should also tell me what to do about circularity that seems benign rather than vicious — calibrating one ruler against another of the same make feels fine in a way that other cases don't, and I'd like the procedure to say when and why a loop is harmless rather than just flagging every loop.

  Then run it on three proposals currently in our queue:

  (1) A member wants to validate a daily mood scale by asking users, after a month, whether the scale's past readings matched how they remember feeling at the time — where those memories were partly formed by reading the scale's outputs at the time.

  (2) A member runs a calibration-training app and proposes to demonstrate that the training works by showing that users' scores improved — where the scores are computed by the app's own scoring rule, which is exactly what some members dispute.

  (3) A member proposes validating a homemade sleep-stage classifier against the user's own report of when they fell asleep and woke, as recorded in a journal the classifier timestamps.

  For at least one of these, the procedure should reach a verdict the proposing member will find unfair, and you should be upfront about that. Finally, be honest about what the procedure cannot do — in particular, the kinds of covert circularity it will miss entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Persona:** Experienced rationalist reader, familiar with concepts like "epistemic circularity" and "bootstrapping," but struggling to operationalize this intuition into a concrete review process for a quantified-self (QS) community.
      *   **Task:** Create a 20-minute review procedure (checklist/questions) for validating self-tracking protocols.
      *   **Requirements:**
          *   Order of questions.
          *   Fatal answers (rejection criteria).
          *   Stopping points.
          *   Identification of irreducible judgment calls.
          *   Distinction between benign vs. vicious circularity (calibration vs. bootstrapping).
          *   Apply the procedure to three specific cases.
          *   One verdict must be "unfair" (but justified by the procedure).
          *   Honesty about limitations (covert circularity the procedure misses).
      *   **Tone:** Precise, epistemologically rigorous, practical, slightly formal (matching the user's background).

  2.  **Deconstruct the Epistemological Problem:**
      *   The core issue is *bootstrapping* (Cohen, Vogel) or *easy knowledge* (Sharon & Spectre).
      *   Structure: Method $M$ produces Data $D$. Claim: $M$ is reliable because $D$ says so.
      *   Benign Circularly: Calibration (comparing $M_1$ to $M_2$ where both rely on independent ground truth, or iterative refinement where error is bounded).
      *   Vicious Circularly: Self-sealing systems (no external anchor).
      *   The "20-minute" constraint means the procedure must be heuristic, not a full philosophical treatise. It needs to be a "triage" tool.

  3.  **Drafting the Review Procedure (The "Bootstrapping Audit"):**
      *   *Goal:* Isolate the source of truth.
      *   *Step 1: Identify the Claim.* What is being validated? (Reliability, Accuracy, Efficacy?)
      *   *Step 2: Identify the Evidence.* What data supports the claim?
      *   *Step 3: Trace the Dependency.* Did the Method create the Evidence?
      *   *Step 4: Check for Independent Anchor.* Is there a ground truth outside the loop?
      *   *Step 5: Assess the Loop.* If circular, is it iterative refinement (okay) or self-justification (bad)?
      *   *Judgment Calls:* Distinguishing "independent enough" from "contaminated."

      *Refining the Steps for the User:*
      *   Make it a flowchart style.
      *   Define "Fatal Flaws."
      *   Address the "Benign vs. Vicious" distinction explicitly (Calibration vs. Constitution).

  4.  **Developing the Three Case Studies:**

      *   **Case 1: Mood Scale vs. Memory.**
          *   Method: Mood Scale.
          *   Evidence: Memory of mood.
          *   Contamination: Memory was formed by reading the Scale.
          *   Analysis: This is classic contamination. The evidence is causally dependent on the method's output.
          *   Verdict: Reject. (This is the "unfair" one potentially, because it *feels* like introspection, but epistemically it's broken).

      *   **Case 2: Calibration App Scores.**
          *   Method: Training App + Scoring Rule.
          *   Evidence: Improved Scores.
          *   Contamination: The Scoring Rule *defines* improvement.
          *   Analysis: Tautological. If the rule says you improved, you improved by definition. No external measure of calibration.
          *   Verdict: Reject.

      *   **Case 3: Sleep Classifier vs. Journal.**
          *   Method: Sleep Classifier (timestamps sleep).
          *   Evidence: Journal (timestamps sleep).
          *   Contamination: The Classifier timestamps the Journal.
          *   Analysis: The instrument records the ground truth.
          *   Verdict: Reject.

      *Wait, I need to make sure one verdict feels "unfair" but is necessary.*
      *   Case 1 is the strongest candidate for "unfair." The user *feels* their memory is independent, but the prompt specifies memories were *partly formed* by the scale. This is subtle memory contamination. Rejecting this feels harsh to a layperson but is epistemically sound.
      *   Case 2 is obviously tautological.
      *   Case 3 is obviously instrument contamination.
      *   Let's stick with Case 1 as the "unfair" one because it attacks the sanctity of introspection/memory, which QS users value highly.

  5.  **Refining the "Benign vs. Vicious" Distinction:**
      *   Vicious: $M \to D \to \text{Validate } M$. (No external check).
      *   Benign: $M_1 \to D_1$, $M_2 \to D_2$. Compare $D_1, D_2$ against shared Ground Truth $G$. Or: $M \to D$, adjust $M$ to fit known $G$, repeat.
      *   Key differentiator: **Independent Anchor.** Does the loop touch reality at any point *other* than through the method being tested?

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise and the transition from theory to practice.
      *   **The Procedure (The "Anchor Test"):**
          *   Phase 1: Mapping (5 mins).
          *   Phase 2: Dependency Tracing (10 mins).
          *   Phase 3: The Anchor Decision (5 mins).
          *   Include "Fatal Flaws" and "Judgment Calls."
      *   **The Application:** Run the three cases through the procedure.
      *   **The Limitations:** What does this miss? (Theory-ladenness of observation, social circularity, hidden assumptions).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the questions sharp. Don't ask for full statistical analysis, just structural validation.
      *   *Critique:* Did I address the "unfair" verdict requirement?
      *   *Fix:* Explicitly highlight in Case 1 why the member will feel aggrieved (memory feels private/independent) and why the procedure overrides that.
      *   *Critique:* Did I explain benign circularity?
      *   *Fix:* Add a specific section on "Calibration Loops" vs. "Validation Loops."

  8.  **Final Polish:**
      *   Ensure the tone matches the "rationalist" vibe (precise, analytical, slightly detached but helpful).
      *   Check that the "Fatal Answers" are clear.
      *   Ensure the "Limitations" section is honest about covert circularity (e.g., theory-laden observation).

  9.  *(Self-Correction on Case 3)*: In Case 3, the classifier timestamps the journal. That means the journal isn't independent. It's a hard reject.
      *(Self-Correction on Case 2)*: The scoring rule is disputed. Using the score to validate the rule is a hard reject.
      *(Self-Correction on Case 1)*: This is the nuanced one. Memory is the only ground truth we have for mood. But if the memory is *contaminated* by the readout, it's vicious. I will mark this as the "unfair" verdict because it invalidates a common QS heuristic (retrospective self-report) based on a specific contamination clause that users often ignore.

  10. **Finalizing the Output Structure:**
      *   Protocol Name: The Epistemic Anchor Audit.
      *   Phases 1-3.
      *   Judgment Call warnings.
      *   Case Studies.
      *   Limitations.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ## The Epistemic Anchor Audit (EAA)

  **Purpose:** To distinguish between *calibration* (benign iterative refinement) and *bootstrapping* (vicious self-validation) in self-tracking protocols.
  **Time Budget:** 20 Minutes.
  **Required Input:** The proposed protocol, the specific claim being validated, and the data source used to support that claim.

  ---

  ### Phase 1: Mapping the Dependency Chain (5 Minutes)
  *Goal: Explicitly diagram the flow of information.*

  **Q1: What is the specific property $P$ being validated?**
  (e.g., Accuracy, Reliability, Efficacy, Calibration)
  *   *Fatal Answer:* "Truth" or "Validity" without operationalization. If $P$ cannot be measured independently of the method, stop and Reject.

  **Q2: What is the Method $M$ producing the primary data?**
  (e.g., The mood scale, the sleep classifier, the app algorithm)

  **Q3: What is the Evidence $E$ offered to prove $M$ possesses $P$?**
  (e.g., User memory, score improvement, journal entries)

  **Q4: Does the generation of $E$ causally depend on the output of $M$?**
  *   *Check:* Did the user see $M$'s output before creating $E$? Does $M$ timestamp or format $E$? Is $E$ computed by a rule inside $M$?
  *   *Fatal Answer:* **Yes.** (Proceed immediately to Phase 2 to check for exceptions. If no exception applies, Reject).

  ---

  ### Phase 2: The Anchor Test (10 Minutes)
  *Goal: Determine if the circularity is vicious or benign.*

  **Q5: Is there an Independent Anchor $A$?**
  *   *Definition:* An anchor is a source of truth about $P$ that does not pass through $M$.
  *   *Examples:* A gold-standard medical test, a physical ruler, a blinded external observer, a pre-existing baseline established *before* $M$ was introduced.
  *   *Fatal Answer:* **No.** If $E$ is the only source of truth about $P$, and $E$ depends on $M$, the system is closed. **Reject.**

  **Q6: If there is dependency (from Q4), is it merely *instrumental* or *constitutive*?**
  *   *Instrumental (Benign):* $M$ helps record $E$, but the *content* of $E$ is determined by reality. (Example: $M$ is a stopwatch; $E$ is the recorded time of a race. The race happened regardless of the stopwatch).
  *   *Constitutive (Vicious):* $M$ determines the *content* or *interpretation* of $E$. (Example: $M$ defines what counts as "sleep"; $E$ is the log of "sleep").
  *   *Fatal Answer:* **Constitutive.** **Reject.**

  **Q7: Is this a Calibration Loop or a Validation Loop?**
  *   *Calibration:* We assume $P$ is imperfect. We use $E$ (anchored by $A$) to tune $M$. We acknowledge $M$ is not yet validated.
  *   *Validation:* We claim $M$ is reliable *because* $E$ matches $M$.
  *   *Fatal Answer:* Proposing a **Validation Loop** without an Independent Anchor. **Reject.**

  ---

