  *   *Fatal Answer:* **Yes.** (Proceed immediately to Phase 2 to check for exceptions. If no exception applies, Reject).

  ---

  ### Phase 2: The Anchor Test (10 Minutes)
  *Goal: Determine if the circularity is vicious or benign.*

  **Q5: Is there an Independent Anchor $A$?**
  *   *Definition:* An anchor is a source of truth about $P$ that does not pass through $M$.
  *   *Examples:* A gold-standard medical test, a physical ruler, a blinded external observer, a pre-existing baseline established *before* $M$ was introduced.
  *   *Fatal Answer:* **No.** If $E$ is the only source of truth about $P$, and $E$ depends on $M$, the system is closed. **Reject.**

  **Q6: If there is dependency (from Q4), is it merely *instrumental* or *constitutive*?**
  *   *Instrumental (Benign):* $M$ helps record $E$, but the *content* of $E$ is determined by reality. (Example: $M$ is a stopwatch; $E$ is the recorded time of a race. The race happened regardless of the stopwatch).
  *   *Constitutive (Vicious):* $M$ determines the *content* or *interpretation* of $E$. (Example: $M$ defines what counts as "sleep"; $E$ is the log of "sleep").
  *   *Fatal Answer:* **Constitutive.** **Reject.**

  **Q7: Is this a Calibration Loop or a Validation Loop?**
  *   *Calibration:* We assume $P$ is imperfect. We use $E$ (anchored by $A$) to tune $M$. We acknowledge $M$ is not yet validated.
  *   *Validation:* We claim $M$ is reliable *because* $E$ matches $M$.
  *   *Fatal Answer:* Proposing a **Validation Loop** without an Independent Anchor. **Reject.**

  ---

  ### Phase 3: The Judgment Call (5 Minutes)
  *Goal: Identify where the checklist ends and human discretion begins.*

  **Q8: Is the contamination "signal" or "noise"?**
  *   *Judgment Call:* Sometimes $M$ influences $E$ slightly (e.g., placebo effect), but the signal is strong enough to swamp the bias.
  *   *Action:* If the influence is known to be small (<5% variance) and the sample size is large, you may **Provisionally Accept** with a warning label. If the influence is structural, **Reject**.

  **Q9: Is the "Independent Anchor" actually theory-laden?**
  *   *Judgment Call:* Sometimes $A$ looks independent but relies on the same assumptions as $M$. (e.g., Validating a "focus" app against "tasks completed," when both assume focus = task completion).
  *   *Action:* If the definitions of success in $M$ and $A$ are identical, treat as **No Anchor**. **Reject**.

  ---

  ### Application to Queue

  Here is the EAA applied to your three current proposals.

  #### Case 1: The Mood Scale vs. Memory
  *   **Q1 (Property):** Accuracy of mood recall.
  *   **Q2 (Method):** Daily Mood Scale.
  *   **Q3 (Evidence):** Retrospective self-report (Memory).
  *   **Q4 (Dependency):** **Yes.** Prompt states memories were "partly formed by reading the scale's outputs."
  *   **Q5 (Anchor):** **No.** The memory is the only anchor, and it is contaminated.
  *   **Q6 (Type):** **Constitutive.** The scale output alters the memory content itself.
  *   **Verdict:** **REJECT.**

  **Why this feels unfair:** The member will argue that memory is the only valid ground truth for subjective mood. They will feel you are demanding a "view from nowhere" for an internal state.
  **Why the procedure holds:** This is the *Self-Sealing Memory* problem. If the scale says "4/10" and the user reads it, their memory encodes "I was a 4." Later, they validate the scale by recalling "I was a 4." The scale has not been tested against reality; it has been tested against its own echo. The procedure correctly identifies that the *formation* of the evidence was hijacked by the method.

  #### Case 2: The Calibration App Scores
  *   **Q1 (Property):** Efficacy of training (improvement in calibration).
  *   **Q2 (Method):** App Training + Scoring Rule.
  *   **Q3 (Evidence):** Improved Scores.
  *   **Q4 (Dependency):** **Yes.** Scores are computed by the app's rule.
  *   **Q5 (Anchor):** **No.** The "score" is defined by the disputed rule.
  *   **Q6 (Type):** **Constitutive.** The rule defines what "improvement" means.
  *   **Verdict:** **REJECT.**

  **Why this is straightforward:** This is a tautology. "I improved because the rule that defines improvement says I improved." To validate the rule, they need an external measure of calibration (e.g., Brier score against actual real-world outcomes, not app outcomes).

  #### Case 3: Sleep Classifier vs. Journal
  *   **Q1 (Property):** Accuracy of sleep-stage classification.
  *   **Q2 (Method):** Homemade Classifier.
  *   **Q3 (Evidence):** User Journal (Start/End times).
  *   **Q4 (Dependency):** **Yes.** The classifier timestamps the journal.
  *   **Q5 (Anchor):** **No.** The journal entries are created by the instrument being tested.
  *   **Q6 (Type):** **Instrumental/Constitutive Hybrid.** While the *feeling* of sleep is independent, the *data* (timestamps) are generated by $M$.
  *   **Verdict:** **REJECT.**

  **Why this is tricky:** It feels like the user is the anchor (they know when they slept). But if the classifier writes the timestamp, the user is merely rubber-stamping the classifier's guess. If the classifier guesses wrong (e.g., labels "lying still" as "sleep"), the journal records "Sleep started." You cannot validate the guess against the record of the guess.

  ---

  ### Limitations: What This Procedure Misses

  You asked for honesty about the blind spots. The EAA is a structural test; it cannot detect *conceptual* circularity.

  1.  **Theory-Laden Observation:** The EAA assumes an "Independent Anchor" is truly independent. It is not. If a member validates a "Productivity Tracker" against "Income Earned," the procedure accepts this as an Anchor. However, if the member's philosophy assumes *all* value is monetary, they have validated a circular worldview, not a tool. The EAA cannot see ideological loops.
  2.  **The "Goodhart" Blind Spot:** The procedure checks if $M$ creates $E$. It does not check if $M$ changes the underlying reality $R$ to make $E$ true. (e.g., A stress tracker that lowers stress by making the user anxious about tracking). This is causal interference, not epistemic circularity, but it yields similarly useless data.
  3.  **Social Bootstrapping:** If the community collectively agrees that "Steps = Health," and a member validates a step-counter against "Health Outcomes" (defined by the community as "High Steps"), the EAA passes this. It misses consensus reality bubbles.

  **Final Advice:** Use the EAA to kill the obvious logical loops (Cases 1-3). Use your rationalist instincts to sniff the conceptual ones (Limitations). When you reject Case 1, be prepared for the member to accuse you of invalidating introspection. Stand firm: introspection is valid, but *contaminated* introspection is data pollution.
