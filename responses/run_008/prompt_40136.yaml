prompt: |-
  I'm a philosophy PhD student who's been roped into running a two-hour session for first-year medical students on when someone is dead — whole-brain death vs circulatory death, why a hospital needs both. Don't explain the topic to me, I roughly know the literture; I want a teaching plan. The students will arrive thinking death is one obvious thing you can point at, and that "brain death" means coma or vegetative state, so the plan has to start somewhere that makes the very question "which functions count as the ones you can't lose" visible rather than assuming it.

  Build the whole thing around one hypothetical case that has to do a lot of work. I'm tempted by a brain-dead pregnant patient kept somatically "supported" for twelve weeks so the foetus can be delivered — same body, corpse and life-support at once — but tell me straight if that's too loaded and what would carry the idea better and why.

  Other things I want covered: the order the pieces have to come in (does the dead-donor rule need to come early because it motivates everything, or does putting it first make the students cynical that the whole definition is transplant-driven? argue it out), the misconceptions in the order they'll actually surface — brain death as PVS, brain death as "legally dead but really alive", the warm-skin intuition, the family asking whether the patient is suffering — and exactly where in the sequence each one should be headed off, plus what I should openly refuse to go into at this level. I suspect the personal-identity stuff about what "I" vs "my body" dies is a bridge too far for first-years, but push back if you disagree.

  One wrinkle I'd like squeezed in if it fits: the idea that some testing requirements for brain death have been relaxed because keeping the body stable enough to carry out the test is so difficult that the test itself generates false negatives. I want them to sit with the thought that our death criteria are partly shaped by what is practical to measure, not only by what is true — but I'm not sure at what point in the session that lands.

  End with something I can do in the last ten minutes that shows whether they've actually got the brain/circulatory distinction and its rationale, rather than just having been unsettled by it.

  Please write in British English. And be properly self-critical: say where this plan is most likely to fall flat, which step quietly depends on the students having grasped something earlier that they might not have, and what would make you restructure the sequence — e.g. if a colleague sat in on the session and told you the ordering was backwards, what would they plausibly have noticed that the plan gets wrong?
