answer: |-
  You won the argument. Or at least, your gut reactions are much more philosophically defensible than your friend's rigid rule.

  The principle you are looking for is a combination of David Lewis's **Principal Principle** and the **Total Evidence Requirement**. Your friend's rule ("Match objective chance whenever you know it") is a naive version of the Principal Principle that ignores the crucial "unless" clause.

  Here is the actual rule, how it applies to your cases, where it gets tricky, and the verdict on the leaked memo.

  ### The Actual Rule: The Principal Principle + Admissibility

  David Lewis's **Principal Principle** states roughly: *If you know the objective chance of an event is $X$, your credence should be $X$.*

  **However**, this comes with a massive constraint: *...provided you have no "inadmissible" evidence.*

  "Inadmissible" evidence is a technical term, but intuitively it means **evidence about the outcome itself** (or evidence that bypasses the chance process).
  *   **Admissible:** Information about the past, the laws of physics, the setup of the experiment (e.g., "this is a fair coin").
  *   **Inadmissible:** Information about the future result (e.g., "I saw it land heads," or "a time traveler told me it's heads").

  The broader umbrella for all your cases is simply **Bayesian Conditionalization on Total Evidence**. Objective chance is just one piece of evidence. It is a very *strong* piece of evidence, but it can be overridden by more specific evidence (like seeing the die is warped) or undermined by higher-order evidence (like the leaked memo).

  ### How the Principle Judges Your Cases

  Here is how the **Total Evidence/Admissibility** rule validates your intuitions:

  1.  **Casino Die (Fair):** You have no inadmissible evidence. The objective chance is 1/6.
      *   *Verdict:* **1/6.** (Principal Principle holds).
  2.  **Quantum Measurement:** You defer to the experts on the objective chance. You have no evidence about the specific outcome.
      *   *Verdict:* **1/2.** (Principal Principle holds).
  3.  **Weather App:** This is slightly different (Expert Probability vs. Objective Chance), but the logic is the same. The app is a better estimator than your knee. You have no "inadmissible" info (you don't know if it *will* rain).
      *   *Verdict:* **30%.** (Deference to expert evidence holds).
  4.  **Warped Die:** Here, the premise "the objective chance is 1/6" is false. The casino says it is, but your eyes (physical evidence) say the physical propensity is different. Your total evidence suggests the chance is actually 1/5.
      *   *Verdict:* **1/5.** (Specific physical evidence overrides testimony about chance).
  5.  **Coin Under Cup:** This is the classic "inadmissible evidence" case. The chance *at the moment of the flip* was 1/2. But your friend has evidence about the *outcome* (he saw it). Evidence about the outcome trumps evidence about the chance.
      *   *Verdict:* **~90%.** (Inadmissible evidence defeats the Principal Principle).
  6.  **Friend Calling Flips:** This is the most complex one. If you are *certain* the coin is fair and the toss is random, the chance is 1/2. If your friend says 60%, they are claiming the *specific toss* has a bias (perhaps they detect muscle memory in the flipper). By moving to 52%, you are weighing the physical model (1/2) against the testimonial evidence (60%).
      *   *Verdict:* **~52%.** (Bayesian weighting of conflicting evidence).

  ### The New Case: The Leaked Memo

  **Case:** Forecast says 30%, but you have a memo saying the model is systematically off this season.

  **Verdict:** **Do not defer to 30%.**

  **Why:** This is structurally identical to the **Warped Die**. The forecast is a claim about the probability (or an expert estimation of it). The memo is **higher-order evidence** that undermines the reliability of that claim.
  If the memo says the model is "systematically off," the 30% is no longer your best estimate of the objective chance (or the epistemic probability). You need to adjust for the systematic error. If the memo says "it overestimates rain by 10%," your credence should be 20%. If it just says "it's unreliable," your credence should probably remain near the base rate (historical average) rather than the model's output.

  Your friend's rule ("Match the objective chance") fails here because you no longer have good reason to believe the stated 30% *is* the objective chance.

  ### Where Your Verdicts Might Struggle (The "Friend Calling Flips" Problem)

  There is one spot where your intuition might be on thin ice philosophically: **The Friend Calling Flips (52%).**

  Strictly speaking, if you are *confident the coin is fair*, the objective chance *is* 1/2. Lewis's Principal Principle says if you know the chance is 1/2, your credence *must* be 1/2.
  If you move your credence to 52% based on your friend's say-so, you are implicitly admitting **you are not actually certain the chance is 1/2.** You are treating your friend's prediction as evidence that the *setup* is not actually a fair 50/50 toss (perhaps the flipper has a tell, or the coin is slightly weighted).

  *   **If you hold fixed:** "The objective chance is exactly 1/2." -> **Credence must be 1/2.** (Friend is either lying or lucky).
  *   **If you hold fixed:** "My friend is a reliable predictor." -> **Credence moves toward 60%.** (Implying the chance wasn't actually 1/2).

  Your 52% compromise suggests you are uncertain about *which* source is right: the physical model of the coin or the track record of the friend. That is a coherent Bayesian position, but it requires admitting you aren't 100% sure about the "fairness" of the specific toss.

  ### Summary for Your Friend

  Tell your friend this:
  1.  **The Rule:** It's the **Principal Principle subject to the Total Evidence Requirement.**
  2.  **The Exception:** You defer to stated odds *only if* you lack "inadmissible" evidence (info about the outcome) and lack "defeaters" (info that the odds are wrong).
  3.  **The Memo Case:** The memo is a defeater. It breaks the link between the forecast and the truth. You ignore the 30%.
  4.  **The Win:** Your gut correctly identified that **specific evidence trumps general statistics.** (Seeing the die is warped trumps the casino's stats; seeing the coin land trumps the flip's odds).

  You were right. The odds are a default setting, not a commandment.
