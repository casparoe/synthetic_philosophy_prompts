answer: |-
  **TO:** The Prize Jury
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Framing Memorandum: Manuscript #409 ("The Inner Weather")

  Colleagues,

  We stand at an impasse. Two of us view Manuscript #409 as a necessary rupture in the form; two view it as a dereliction of the novelist's duty. As the fifth, I have been asked to frame the choice before we cast our final votes. This is not merely a procedural deadlock; it is a philosophical collision regarding what we believe a novel *is*.

  The author asks us to accept a language whose semantics are fixed solely by her private recognition of sensation. She provides rules, but the verification of those rules is inaccessible to anyone but her. Here lies the crux beneath our practical disagreement. If a rule is followed correctly only when the rule-maker *feels* it is followed, we must ask: is there any distinction between following the rule and seeming to follow it? If I claim to follow a private rule for "blue," but only I can check the application, nothing prevents me from changing the meaning of "blue" tomorrow while claiming consistency. As Wittgenstein suggested, a wheel that turns without connection to the mechanism moves nothing. If correctness is purely internal, the notion of correctness vanishes. Consequently, the invented passages may not mean anything even to *her*, beyond the immediate sensation of writing them. They are not a language; they are a performance of linguistics.

  This forces us to define our obligation. Does it run to the book as an artifact, or to the reader as a participant? If we shortlist this, we affirm that the novel is a container for authorial intent, regardless of transmission. If we reject it, we affirm that the novel is a bridge. A prize is a public act. To award a text that explicitly refuses public verification is to claim that privacy is superior to communication. While I respect the autonomy of the text, a prize implies a standard of shared excellence. We cannot judge the success of a communication that refuses to be received.

  However, I must be honest about the strength of the argument for shortlisting. My colleagues on that side are correct that English is often hostage to shared convention, blunting the sharp edges of individual experience. They argue that no reader ever has direct access to an author's mind anyway; we always infer meaning from marks on a page. In this light, #409 is merely more honest about the gap between minds. It exposes the solitude of composition rather than masking it with the pretense of shared understanding. To reject it on the grounds of "readability" is to privilege comfort over truth. The author's refusal to gloss the text is a rigorous consistency: if the sensation is untranslatable, a translation would indeed be a lie. This integrity is rare and deserves recognition.

  Yet, integrity of intention does not guarantee the existence of meaning. If the private language argument holds, the text is not a deeper truth; it is a closed loop.

  Therefore, my recommendation is to **reject** Manuscript #409 for the shortlist.

  I make this recommendation not to punish the ambition, but to protect the integrity of the prize. We are judging literature, not solipsism. To shortlist this work would be to award a *claim* about meaning rather than a work that *means*. It would signal that we value the gesture of innovation over the labor of connection.

  However, I propose we accompany this rejection with a formal minority statement or a jury note acknowledging the specific failure of our existing critical vocabulary to account for such work. We can reject the manuscript while validating the question it poses. We can say: *This work tests the boundary of the novel, and in doing so, reveals that the novel, as we define it, requires a public world.*

  If we shortlist it, we dissolve the standard by which we judge all other submissions. If we reject it, we affirm that while the inner weather is real, the novel remains a place where we meet outside, in the rain, together.

  I ask that we vote on this basis.

  Respectfully,

  [Your Name]
