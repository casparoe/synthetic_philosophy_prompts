answer: |-
  This is a profound philosophical problem known as the distinction between **authentic preferences** and **adaptive preferences** (preferences formed to cope with unjust or limiting circumstances). Your intuition is wrestling with the fact that *origin* alone doesn't determine validity (since both your friend and cousin have upbringing-based preferences), but *content* and *implication* matter.

  You suspected the inconsistency lies between your **Friend (Diner)** and your **Cousin (Trade)**. You are right. That pair is the key to unlocking the principle.

  Here is the distinction: Your friend's preference is about **fit and comfort** ("I feel out of place"). Your cousin's aversion is about **status and hierarchy** ("Manual labor is beneath me"). One is an internal affective state; the other is an external judgment of value implanted by classism.

  Below are three candidate principles. Each attempts to codify your verdicts, but each has a "blind spot" where it conflicts with your gut.

  ### Candidate 1: The "Hierarchy vs. Fit" Principle
  **Principle:** A preference is a **bias** if it relies on the belief that the rejected option is inherently inferior in status, dignity, or worth. A preference is **genuine** if it relies on a judgment of personal fit, comfort, or aesthetic alignment without denigrating the alternative.

  *   **Verdicts it rests on:**
      *   **Cousin (Bias):** Her aversion implies trades are "lower class."
      *   **Friend (Preference):** He doesn't think fancy food is *bad*, just that he feels *uncomfortable*.
      *   **Bathroom (Bias):** Discomfort implies the trans coworker is "other" or "unclean."
      *   **Dating (Bias):** Often relies on essentialist hierarchies about race.
  *   **Predictions for new cases:**
      *   If someone refuses to date short men because they "feel unmasculine," that is a **bias** (hierarchy).
      *   If someone refuses to date short men because they personally lack attraction to that physical trait, that is a **preference** (fit).
  *   **Verdicts it cannot accommodate:**
      *   **The Dog Case:** You call avoiding dogs a bias. But a dog-phobic person doesn't necessarily think dogs are *low status*; they think they are *dangerous*. This principle might classify the dog avoidance as a rational safety preference, whereas your gut says it's an overgeneralized bias.
      *   **The Amputee:** Some might argue refusing a "cure" rejects the societal hierarchy that says "able-bodied is better." This principle risks labeling her choice a bias (internalized ableism) unless carefully phrased to allow identity integration.

  ### Candidate 2: The "Reflective Endorsement of Origin" Principle
  **Principle:** A preference is a **bias** if, upon understanding the causal history of the preference, the person would feel alienated from it or wish to extinguish it. A preference is **genuine** if the person acknowledges the origin but affirmatively adopts it as their own upon reflection.

  *   **Verdicts it rests on:**
      *   **Friend (Preference):** He knows he grew up poor, but he still likes diners. He owns the history.
      *   **Cousin (Bias):** If she realized her aversion comes from snobbery, she would likely feel shame and want to change.
      *   **Music (Preference):** You know it's nostalgia, and you claim it proudly.
  *   **Predictions for new cases:**
      *   If a person realizes their fear of public speaking comes from one embarrassing moment and says, "I know it's irrational, but I still can't do it," this principle counts it as a **preference** (because they aren't disavowing it).
      *   If a person realizes their religious dietary restriction is cultural but keeps it for identity, it is a **preference**.
  *   **Verdicts it cannot accommodate:**
      *   **The Dog Case:** You explicitly said your friend *knows* most dogs are harmless and *still* avoids them. Under this principle, because he doesn't disavow it, it counts as a **preference**. Your gut says **bias**. This principle fails to capture *irrational constraints* that the person accepts.
      *   **The Homemaker:** If she is deeply indoctrinated, she might *not* disavow the origin even if explained. This principle might falsely validate deep indoctrination as "genuine."

  ### Candidate 3: The "Reciprocal Standing" Principle
  **Principle:** A preference is a **bias** if acting on it requires denying the full moral standing or humanity of another group. A preference is **genuine** if it concerns only one's own flourishing without demanding others be lesser.

  *   **Verdicts it rests on:**
      *   **Bathroom (Bias):** Implies the trans coworker doesn't belong.
      *   **Dating (Bias):** Can imply racial groups are fundamentally incompatible or unequal.
      *   **Cousin (Bias):** Implies trade workers are lesser.
      *   **Friend/Amputee/Music (Preference):** These are self-regarding.
  *   **Predictions for new cases:**
      *   Refusing to hire someone because of a accent is a **bias**.
      *   Refusing to eat at a restaurant because the decor is ugly is a **preference**.
  *   **Verdicts it cannot accommodate:**
      *   **The Dog Case:** Avoiding dogs harms no one's moral standing. This principle would classify it as a **preference**, but you view it as a **bias** (an irrational limitation on self).
      *   **The Cousin:** One could argue her job choice harms *herself*, not others. This principle focuses so much on interpersonal harm it might miss internalized biases that limit self-potential.

  ---

  ### The Suspected Inconsistency: Friend vs. Cousin
  Using **Candidate 1 (Hierarchy vs. Fit)** offers the best resolution to your specific worry.

  *   **Friend (Diner):** His preference is **non-comparative**. He isn't saying, "Fancy food is for snobs." He is saying, "I am not comfortable there." It is a statement about his relationship to the environment.
  *   **Cousin (Trade):** Her preference is **comparative**. She isn't just saying, "I don't like getting dirty." She is saying, "That work is beneath me." It is a statement about the *value* of the work relative to her status.

  **The Principle:** *A preference is a bias when it functions to maintain a social hierarchy or status distinction rather than to serve personal comfort or capacity.*

  ### The Homemaker Case
  This is the hardest case because it sits on the fault line between Candidate 1 and Candidate 2. Here is how the **Hierarchy vs. Fit** principle (the strongest candidate) resolves it:

  **The Test:** Ask *why* she prefers it.
  1.  **Scenario A:** She prefers homemaking because she finds deep fulfillment in nurturing, organizing a home, and being present for family, and she respects women who work outside the home as making an equally valid choice.
      *   **Verdict:** **Genuine Preference.** (This is about Fit).
  2.  **Scenario B:** She prefers homemaking because she believes women are naturally better suited for it, or that working mothers are neglecting their duty, or that her husband's career is inherently more important.
      *   **Verdict:** **Bias.** (This is about Hierarchy).

  **Stable Answer:** Your flip-flopping comes from not knowing which scenario she is in. If her preference is **inclusive** (her choice is right *for her*), it is a preference. If her preference is **prescriptive** (her choice is right *for women*), it is a bias.

  ### Summary of Recommendations
  To apply this to new cases, use this two-step filter:

  1.  **The Harm/Standing Check:** Does holding this view require me to view another group as less capable, less clean, or less worthy? (If Yes → Bias).
      *   *Catches:* Bathroom, Dating, Cousin (if classist).
  2.  **The Irrational Constraint Check:** Does this preference limit my life based on a generalization I know to be false, without serving a protective function? (If Yes → Bias).
      *   *Catches:* Dog case (Phobia vs. Prudence).

  **Why the Amputee passes:** She fails neither check. She doesn't view able-bodied people as lesser (Standing), and her refusal isn't based on a false generalization but on an integrated identity (Constraint).

  **Why the Friend passes:** He fails neither check. He doesn't view fancy diners as immoral (Standing), and his discomfort is a genuine affective response, not an irrational fear (Constraint).

  **Why the Cousin fails:** She likely fails the Standing check (views trades as lower status) and potentially the Constraint check (rules out a career she'd be good at based on status, not fit).
