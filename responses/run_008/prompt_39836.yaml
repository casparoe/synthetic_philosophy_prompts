answer: |-
  Here is the verdict.

  Your position **survives, but it requires surgery.** It does not survive intact, and if you refuse the operation, it dies.

  The core principle—"fidelity of spirit over fidelity of fact"—is robust enough to justify *Amadeus*, *Shakespeare in Love*, and *The Last Duel*. However, your specific formulation relies on two safeguards that are currently failing: the artist's internal compass ("true to the shape") and the audience's genre literacy ("they know it's a drama").

  Here is the ranking of objections from fatal to nuisance, followed by the specific surgery your view needs.

  ### 1. The Strongest Objection: The Unfalsifiability Trap
  **Verdict:** This is the killer. Your friend is right, and you need to listen to them.

  "Fidelity of spirit" is an unfalsifiable claim. Because "spirit" is not an empirical metric, only you, the artist, get to define it. If you decide that the "truth" of Churchill is that he was a drunk racist, and you write a scene depicting him kicking a puppy to illustrate his cruelty, you can claim that captures his "spirit." If a historian objects, you can retreat to "you're looking at facts, I'm looking at truth."

  This makes your ethical framework a tautology: *Fabrication is permissible when it serves the artistic truth, and I define the artistic truth.* That is not a principle; it is a rationalization. It insulates you from criticism by definition. If your view cannot be proven wrong by any conceivable scene you might write, it is not an ethic, it is a taste preference dressed in moral clothing.

  **The Surgery:** You must add an external constraint. "Fidelity of spirit" is only valid if it does not **contradict the settled historical consensus on the subject's moral agency.** You can invent conversations, but you cannot invert virtues and vices. You can show Mozart being petty (true to human spirit), but you cannot show him being cruel to the point of sociopathy if the record suggests he was kind (false to moral shape). You must surrender the right to define the "shape" unilaterally; the shape must be recognizable to a reasonable expert, not just to you.

  ### 2. The Dangerous Objection: AI and the Collapse of Genre Signaling
  **Verdict:** This breaks your second condition ("the audience knows what genre they walked into").

  Your defense relies on a contract: *I promise this is a story; you suspend disbelief.* In text, this contract is ironclad. A novel is understood as invention. In film, it is strong but porous. With AI reconstruction, the contract dissolves.

  When an audience sees a photorealistic, voice-matched AI reconstruction of a dead person speaking, their brain does not register "interpretation." It registers "evidence." The phenomenology of the medium screams *documentary* even if the metadata says *drama*. If you use AI to make a dead actor say words they never said, you are not asking the audience to suspend disbelief; you are asking them to distrust their own eyes. This creates a "liar's dividend" where the line between archive and invention is permanently blurred.

  **The Surgery:** You must cut AI reconstruction from your defense entirely. Your principle works for *representation* (actors playing roles, painters painting portraits), but it fails for *simulation* (digital resurrection). Simulation claims a ontological status that representation does not. If you use AI to put words in a dead mouth, you are no longer writing historical fiction; you are forging evidence. Your "genre signal" defense cannot save this because the medium itself is the lie.

  ### 3. The Manageable Objection: Living Memory (The "Recent Dead" Problem)
  **Verdict:** This requires a boundary, not a principle change.

  If you write about Henry VIII, the dead are dust. If you write about a tech CEO who died in 2022, their children are in high school and their rivals are still in the boardroom. In the latter case, your "fidelity of spirit" has immediate material consequences: stock prices, legal reputations, grieving processes.

  The "Amadeus defense" works because Mozart's reputation is a public good, not private property. When the subject is recently dead, their reputation is still private property held by heirs.

  **The Surgery:** Apply a Statute of Limitations. Your principle only activates after the subject has passed from "news" to "history." A generational boundary (25–30 years) is standard for a reason. Before that, fidelity of fact is owed because the "spirit" is still being litigated by living witnesses.

  ### 4. The Weakest Objection: Scale
  **Verdict:** Merely annoying.

  Your friends argue that a Netflix movie has more responsibility than a paperback novel. This is pragmatically true but philosophically weak. A lie is a lie regardless of how many hear it. However, cultural dominance does create a feedback loop: if 50 million people see your fiction, it *becomes* the fact for future historians.

  **The Surgery:** None needed. This is just a reminder that with scale comes scrutiny. If you reach millions, expect the "Unfalsifiability" objection to be raised louder. It doesn't change the rule, it just raises the stakes of breaking it.

  ### The Final Diagnosis

  Your view is currently **unfalsifiable and self-serving.** It allows you to claim the moral high ground of "truth" while enjoying the creative freedom of "lies."

  To save it, you must accept these three constraints:
  1.  **The Consensus Constraint:** You cannot contradict the settled moral record of the subject. (Fixes the "Self-Serving" charge).
  2.  **The Simulation Ban:** No AI resurrection of voice/likeness to speak new lines. (Fixes the "Genre Signal" collapse).
  3.  **The Temporal Boundary:** No "spiritual truths" about the recently dead. (Fixes the "Harm" issue).

  If you accept these, your position holds: We owe the dead a truthful *portrait*, not a truthful *transcript*. If you reject them, your friend wins: you are just writing slander and calling it art.
