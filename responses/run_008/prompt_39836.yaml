          *   *Analysis:* Does scale matter ethically? If a lie reaches 10 people vs. 10 million, is the lie different? The *impact* is different, but the *principle* of fidelity to spirit shouldn't logically depend on readership. However, cultural dominance matters. If a Netflix movie becomes the *only* version of a person people know, it effectively rewrites history regardless of genre tags.
          *   *Verdict:* This is a practical constraint, not a philosophical killer. It suggests a duty of care increases with reach, but doesn't invalidate the core principle.

      *   **Challenge 2: Recent Dead (Living Memory).**
          *   *Analysis:* This is stronger. If I write about Henry VIII, no one is hurt. If I write about a CEO who died last year, their family is grieving, their reputation affects stock prices or legal cases. "Fidelity of spirit" is subjective. To the family, a fabrication might feel like slander, even if the artist thinks it captures the "truth."
          *   *Verdict:* This requires a temporal boundary. The "Amadeus defense" works best when the subject has entered the realm of myth/history, not current events/news.

      *   **Challenge 3: AI Reconstruction.**
          *   *Analysis:* This is the technological wildcard. The user's defense relies on *genre signaling* ("This is a drama"). AI deepfakes blur the line between "recorded reality" and "generated fiction." If I see a dead actor speaking, my brain registers "evidence," not "interpretation."
          *   *Verdict:* This is the most dangerous philosophical threat. It attacks Condition #2 (Audience knows the genre). If the medium itself lies about its own nature, the contract is broken.

      *   **Challenge 4: The "Self-Serving" Accusation.**
          *   *Analysis:* "Fidelity of spirit" is inherently subjective. Who defines the "shape of the person"? The artist. This makes the principle unfalsifiable. If the artist says "This lie captures the truth," who can prove them wrong?
          *   *Verdict:* This is the foundational weakness. It turns an ethical principle into an aesthetic preference.

  3.  **Determine the Verdict:**
      *   The user wants a commitment.
