  Your gut reactions are consistent with a principle of **evidential specificity**, but applying it rigorously forces you to concede that the 1970s mind-control belief was unreasonable unless the believer possessed specific historical precedents unavailable to the moon-landing skeptic.

  The principle is this: **A belief is epistemically reasonable if it is derived from specific motives and mechanistic plausibility grounded in available precedents, rather than from a universal heuristic of distrust or the dismissal of overwhelming verification.** This distinguishes your uncle's "government always lies" heuristic (unreasonable method, even if lucky) from the WMD/Tobacco skeptics who identified specific conflicts of interest and mechanistic possibilities (reasonable method). It also resolves the 1972 surveillance case: the first man used specific evidence (break-ins), making his belief reasonable, while the second used a universal prior ("demons"), making his belief unreasonable luck.

  This principle saves your verdicts on the Moon Landing (dismissed overwhelming verification), Vaccines (failed mechanistic plausibility), and the Uncle/Surveillance distinctions (method over outcome). However, it cannot save your intuition that the 1970s mind-control belief was reasonable *unless* you can show the believer relied on specific precedents like Nazi experiments or earlier CIA scandals rather than general distrust. If the 1970 believer had no more specific evidence than the Moon Landing skeptic, your brother-in-law is right: they were in the same epistemic position, and you must downgrade that belief to "unreasonable" to remain consistent.

  For a new case, consider believing in 2005 that the NSA was secretly collecting phone records of ordinary citizens. The principle predicts this belief was reasonable if based on specific legal changes like the Patriot Act and technical capability, but unreasonable if based solely on the universal heuristic that "the government violates privacy."
