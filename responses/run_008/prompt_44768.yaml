      *   *Reny Camp:* Reny (1988, 1992) argues that CKR cannot be maintained at unreached nodes because the *fact* of reaching the node contradicts the hypothesis of rationality required to prove BI. This is the "Common Knowledge of Rationality is inconsistent with the game structure" argument.
      *   *Decision-Theoretic/Empirical Camp:* McKelvey & Palfrey (1992) introduce the Quantal Response Equilibrium (QRE) or reputation models (Kreps et al.). The user mentions "updating on survival." This aligns with reputation models (Gintis, Binmore) or level-k thinking.
      *   *Did the debate dissolve?* Not really. It shifted. The "epistemic game theory" program (Brandenburger, Dekel, Fudenberg, etc.) formalized the conditions under which BI holds. The "behavioral" program moved to QRE/level-k. The "philosophical" program (Bicchieri, Reny, Cubitt) focused on the consistency of counterfactuals.
