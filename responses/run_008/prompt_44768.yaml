      *   **The Real Sticking Point:** The logic of counterfactuals. Aumann assumes a logic where counterfactuals about unreached nodes have truth values determined by the strategy profile. Reny/Bicchieri assume a logic where belief revision is required, and revising on "I am at node $k$" destroys CKR.
