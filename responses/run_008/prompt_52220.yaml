      *   *Stability:* Stability *does* count against strong looping *if* the stability persists despite active attempts to change the classification or lack of awareness. A "settled loop" is a convenient save, but if the mechanism of stability is biological inertia rather than social homeostasis, it's a defeater.
      *   *Scope (Labeling vs. Condition):* If looping only changes help-seeking, it's weak (Scheff-style labeling theory). Strong looping needs to change the *phenomenology* or *course*. If the underlying neurophysiology is invariant, strong looping collapses.
      *   *Indifferent vs. Interactive:* The principle is *causal power of the classification*. Chromosomal syndromes: Classification doesn't change the chromosomes. Psychiatric: Classification changes the self-concept/behavior. The gradient is real.
      *   *Hacking's Retreat:* He did soften the tone (e.g., in *The Social Construction of What?* vs. later interviews). He acknowledged "biological constraints." It matters because it signals the strong constructivist view was hard to defend against neuroscience.
      *   *Predictive Differences:* Realism predicts convergence on biomarkers. Looping predicts divergence or persistence of heterogeneity due to cultural feedback. Realism predicts cross-cultural uniformity in biology; Looping predicts cross-cultural variation in phenotype/experience.
      *   *Concrete Finding:* Autism prevalence. If prevalence rises *solely* due to diagnostic widening (looping/awareness) but the *core cognitive phenotype* (e.g., eye tracking, R-R tasks) remains constant in the population, that supports Realism (the "kind" was always there). If the *phenotype itself* shifts with diagnostic criteria, that supports Looping. Actually, a better one might be **Cross-Cultural Course of Schizophrenia** (WHO IPSS). If outcome varies by culture (developing vs. developed) despite similar biology, that supports Looping/Social. If biology dictates outcome regardless, that supports Realism. Let's pick **Autism Prevalence vs. Trait Distribution**.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the Hackingian position but pivot immediately to the critique.
      *   *Section 1: The Hierarchy of Defeaters.*
          *   *Fatal:* Biological Invariance (The "Huntington's Test"). If a biomarker predicts the course regardless of knowledge.
          *   *Fatal:* The Pre-Reflective Case. Infants, severe psychosis, dementia. They can't "loop."
          *   *Serious:* The "Merely Epistemic" Collapse. If looping only changes reporting, not the underlying dysfunction.
          *   *Awkward:* The Equilibrium Defense. (Addressing the unfalsifiability worry).
      *   *Section 2: Addressing Specific Worries.*
          *   *Stability:* Stability is a problem if it defies cultural variation.
          *   *Gradient:* Admit the gradient. It's not a binary.
          *   *Hacking's Retreat:* Confirm the hearsay. He moved towards "dynamic nominalism" with constraints.
          *   *Predictions:* Contrast Realism vs. Looping on biomarkers and cross-cultural phenotypes.
      *   *Section 3: The Concrete Finding.*
          *   Selection: **Autism Prevalence and the "Broader Autism Phenotype" (BAP).**
