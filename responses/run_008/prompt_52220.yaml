          *   **Why:** If the *biology/psychology* is stable while the *rates* loop, the "kind" is indifferent, only the "threshold" is interactive.
      *   **Conclusion:** Summarize the tension.

  8.  *(Self-Correction on Concrete Finding)*: ADHD endophenotypes are messy. Maybe **Autism and the "Broader Autism Phenotype" (BAP)**. If the *distribution* of traits in the population is stable (Gaussian) but the *cut-off* for diagnosis moves, that's labeling (weak looping). If the *experience* of being autistic changes the *traits*, that's strong looping.
      *   *Better:* **The WHO IPSS Schizophrenia Outcomes.** Better outcomes in developing nations.
      *   *Why:* If looping is true, social expectation drives outcome. If Realism is true, biology drives outcome. The IPSS data supports Looping (social drives outcome). Wait, I need a finding that moves the *user* (a Looping partisan) *against* their view.
