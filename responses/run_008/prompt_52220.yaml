      *   *Core Claim:* Classifying people changes people, which changes the classification.
      *   *Strong Version:* The *ontology* of the disorder is partly constituted by the classification. (No classification = no disorder in that form).
      *   *Weak Version:* Classification affects behavior/expression, but the underlying pathology is independent.
      *   *The Challenge:* Distinguishing between "changing the expression" vs. "changing the kind."

  3.  **Brainstorming Defeaters (Ranked Fatal to Awkward):**

      *   *Fatal 1: The "Bedrock" Problem (Biological Constraints).* If we find a specific, invariant biological mechanism that predicts the phenotype regardless of cultural awareness or classification, looping loses its ontological bite. Example: Huntington's. If schizophrenia turns out to be as biologically specific as Huntington's, looping becomes merely about *coping*, not *constitution*.
      *   *Fatal 2: Unconscious/Non-Communicative Populations.* Looping requires the subject to know the classification. What about infantile autism (pre-verbal), severe intellectual disability, or delirium? If the "kind" persists without the capacity for interaction, the "interactive" label fails for those subsets.
      *   *Fatal 3: Predictive Divergence.* If Biomedical Realism predicts treatment response based on biology *despite* patient belief, and Looping predicts response based on *narrative alignment*, and biology wins consistently, Looping is demoted to epistemology.
      *   *Awkward 1: Stability as Equilibrium.* The user's worry. If stability = settled loop, the theory explains everything. This is a theoretical vice (unfalsifiability).
      *   *Awkward 2: The Gradient Problem.* Admitting some kinds are more interactive than others weakens the universal claim. It becomes a spectrum, not a dichotomy.
      *   *Awkward 3: Hacking's Hedging.* If Hacking pulled back, it suggests the strong ontological claim was unsustainable.

