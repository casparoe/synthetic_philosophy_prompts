          *   Insulation/Falsifiability: Can the view explain *both* change (looping) and stability (equilibrium)? Is it unfalsifiable?
          *   Hacking's Retreat: Hearsay that Hacking hedged later. Does this matter?
          *   Predictive Power: What does looping predict that biomedical realism doesn't?
