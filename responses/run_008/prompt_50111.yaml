answer: |-
  **Project Title:** The Normative Function of *Xing*: Beyond Contradiction and Verbal Dispute in Mencius and Xunzi

  **1. Research Question**
  Does the classification of a disposition as *xing* (nature) function to grant it normative authority in Mencius's moral pedagogy while explicitly withholding such authority in Xunzi's? Rather than asking whether humans are born good or bad, this project asks whether attributing a tendency to *nature* serves to legitimize it as a guide for cultivation in one text while marking it as raw material requiring external transformation in the other.

  **2. Critique of Existing Readings**
  Well-informed interpreters largely agree that Mencius and Xunzi offer divergent assessments of human tendencies. However, the standard "direct-contradiction" reading assumes they address a single empirical question, overlooking semantic shifts. Conversely, the "verbal dispute" reading suggests they simply define *xing* differently, dissolving the conflict. Both leave open why the dispute matters practically. If it were merely verbal, the stakes for moral education would vanish. My hypothesis bridges this: the disagreement is substantive but conducted through semantics. It is genuinely contested whether Mencius's "sprouts" are genuinely moral responses or merely proto-moral dispositions; similarly, scholars debate whether Xunzi's rituals are external constraints or expressions of human patterning capacity. My project bypasses these ontological debates to focus on the *functional* role of the nature-claim itself.

  **3. Two-Month Plan**
  **Month 1: Reconstruction.** I will reconstruct each thinker's operative rule for classifying cases as *xing*. This involves close exegesis of key passages where *xing* is affirmed or denied. While scholars agree both texts use *xing* to denote something innate, it is genuinely contested whether this innateness implies value. I will catalog instances where spontaneous tendencies are either endorsed or overridden, noting where appeals to nature function as conversation-stoppers versus starting points for argument.

  **Month 2: Test Cases.** I will construct borderline cases to test these classification rules. For example: Consider spontaneous shame at wrongdoing. It appears prior to instruction (favoring Mencius) but is responsive to community norms (favoring Xunzi). I will analyze how each text treats such reactions. Does Mencius cite their spontaneity to grant them authority? Does Xunzi acknowledge their spontaneity but deny them authority? This method avoids getting stuck on whether the sprouts are fully moral—a contested point—focusing instead on whether their naturalness is what does the justificatory work. I will draft two comparative essays based on these findings.

  **4. Failure Conditions**
  The project fails if textual evidence shows Xunzi also grants normative authority to natural tendencies when convenient, collapsing the distinction. Alternatively, failure occurs if Mencius treats natural tendencies as merely raw material requiring external shaping equal to Xunzi's ritual. Finally, if the proposed test cases prove textually indeterminate, leaving the functional role of *xing* ambiguous, the hypothesis is unprovable. If the distinction reduces to mere terminology without affecting pedagogical recommendations, the hypothesis that this is a substantive disagreement about moral education will be shown to confuse semantic variance with practical stakes.
