prompt: |-
  A few months back I came off some sleep meds and got hit with insane REM rebound dreaming, which somehow rabbit-holed me into the old Malcolm vs Dennett fight about whether dreams are experiences at all. As I understand it, Malcolm held that dream reports can't be checked against anything, so all we can ever mean by "I dreamt" is something about sleep behavior plus the waking report — the dream isn't an experience had during sleep. Dennett pushed back that the narrative might only get composed at the moment of waking, a kind of cassette dumped on request, which would mean dreams aren't experiences during sleep either, just for different reasons. And then the whole debate seems to just... die out sometime after lucid dreamers managed to signal out of their dreams with agreed eye movements, without anyone declaring a winner.

  My working theory is that these two were never really answering the same question — Malcolm was doing conceptual analysis of what "dreaming" can mean, Dennett was floating an empirical hypothesis about when and how the brain assembles the narrative — so once the eye-signal results dented the empirical part, the conceptual residue had nowhere to go and everyone quietly moved on. Is that diagnosis right, or is there a genuine substantive disagreement still in there, e.g. about what anything has to be like to count as an experience at all? And given whatever diagnosis you give, what would actual progress look like now — better neuroscience of sleep, a sharper distinction between experience and report, or reframing the whole question? Its 1am and I just woke up from a dream about this exact thread btw, so take that as you will.
