  2.  **Deconstruct the Friend's Analogy (Music vs. Art):**
      *   *Friend's Premise:* Music is defined by the sound/experience. A cover song provides the same experience. Therefore, a visual replica should provide the same experience and hold the same value.
      *   *User's Premise:* Art seems to derive value from provenance/authenticity (van Meegeren case). Knowing it's a fake changes the aesthetic experience.

  3.  **Mapping the Terms:**
      *   *Composer:* The original artist (Vermeer, Da Vinci) $\leftrightarrow$ Songwriter (Beatles, etc.).
      *   *Composition:* The design/image/structure $\leftrightarrow$ The melody/chords/lyrics.
      *   *Performance:* The act of playing live $\leftrightarrow$ *This is tricky.* Is looking at a painting a performance? Or is the *creation* of the painting the performance?
      *   *Recording:* The specific physical artifact (the canvas) $\leftrightarrow$ The specific master tape/vinyl.
      *   *Cover Song:* A new performance of the same composition $\leftrightarrow$ A forgery (new creation of the same visual design).
      *   *Replica/Copy:* A mechanical reproduction $\leftrightarrow$ A 3D print or high-res print.

      *Refining the Mapping:*
      *   In music, the *work* is often distinct from the *object*. You can have the "Moonlight Sonata" without Beethoven's manuscript.
      *   In visual art (traditionally), the *work* is often tied to the *object*. The "Mona Lisa" is *that* specific board with paint on it.
      *   *Better Mapping:*
          *   Song Composition = Visual Design (The image of the Mona Lisa).
          *   Specific Recording = The Physical Canvas (The actual Mona Lisa).
          *   Cover Band Performance = A Forgery (Hand-painted copy intended to deceive).
          *   Streaming/MP3 = A Poster/Print (Mechanical reproduction).

  4.  **Analyzing Where the Analogy Breaks Down (The "Cracks"):**
      *   *Ontological Status:* Music is an *allographic* art form (defined by notation, multiple instances possible). Painting is an *autographic* art form (defined by the history of production, single instance). This is Nelson Goodman's distinction from *Languages of Art*.
      *   *The "Performance" Aspect:* When a band plays a cover, they are adding *their* interpretation. A forgery tries to *hide* the performer. A cover celebrates the new performer; a forgery erases them to mimic the old one.
      *   *The "Recording" Aspect:* In music, we value the *original recording* (e.g., Hendrix at Monterey) for historical capture. But we accept other recordings of the same song. In painting, the "recording" *is* the work. There is no "score" to follow other than the object itself.
      *   *Deception:* A cover band usually admits they are playing someone else's song. A forgery lies about its origin. If the band claimed they wrote the song, that's plagiarism/fraud, not just a cover.
      *   *Causal History:* The value of the Mona Lisa isn't just pixels; it's that *Da Vinci's hand* touched it. The value of a recording is that *the artist's voice* vibrated the microphone. But in music, we accept *other* vibrations (covers) as valid instances of the work. In painting, we don't accept other brushstrokes as instances of the work.

  5.  **Evaluating the "Snobbery" Claim:**
      *   Is it snobbery? No, it's about *connection*.
      *   The van Meegeren effect: Why did the paintings look worse after the reveal? Because the aesthetic experience includes the *narrative* of the object. Knowing it's a 1940s fake changes the context of the 17th-century style. It becomes a pastiche, not an innovation.
      *   Music comparison: If a band claims they wrote a song, and you find out they didn't, you feel conned. If they play it perfectly but admit it's a cover, you enjoy it. The friend is conflating *covers* (honest) with *forgeries* (deceptive).
      *   The 3D Scan argument: If you have a perfect physical replica, does it matter? Philosophically, yes. Because the replica lacks the *causal history*. It's like a clone of a person vs. the original person. Same DNA, different history.

