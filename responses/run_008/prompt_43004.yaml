answer: |-
  This is a fantastic debate because it touches on one of the deepest questions in the philosophy of art. Your buddy is arguing from an **aesthetic** standpoint (what does it look/sound like?), while you are bumping up against an **ontological** standpoint (what *is* the object, and where did it come from?).

  The philosopher Nelson Goodman actually tackled this exact problem in his 1968 book *Languages of Art*. He distinguished between **autographic** arts (painting, sculpture) and **allographic** arts (music, dance, literature).

  Here is the breakdown of the mapping, where the analogy snaps, and why your buddy's "snobbery" claim doesn't quite hold water.

  ### 1. The Mapping: Music vs. Painting

  To see where the comparison works and where it fails, we have to align the roles correctly. Your buddy is conflating two different things in music: the *composition* and the *recording*.

  | Concept | Music (Allographic) | Painting (Autographic) |
  | :--- | :--- | :--- |
  | **The Composer** | The Songwriter (e.g., Lennon/McCartney) | The Artist (e.g., Vermeer) |
  | **The Composition** | The Score / Chords / Melody | The Visual Design / Image |
  | **The Performance** | The Band playing live | **The Act of Painting** |
  | **The Recording** | The Master Tape / Vinyl | **The Physical Canvas** |
  | **The Cover** | A new band playing the song | A Forgery (hand-painted copy) |
  | **The Reproduction** | An MP3 / Stream | A Poster / 3D Scan |

  **The Crucial Difference:**
  In music, the "Work" is the *composition*. You can have thousands of valid instances of "Yesterday." None of them are the "original" in a way that invalidates the others. The sheet music is the bridge; if you follow the score, you are playing the work.

  In painting, there is no score. The "Work" is the *physical object itself*. There is no set of instructions that allows you to create another valid instance of the *Mona Lisa*. There is only *that* board with *that* paint.

  ### 2. Where the Analogy Breaks Down

  Your buddy's argument has three major cracks.

  #### Crack A: Honesty vs. Deception (The "Cover" Fallacy)
  Your buddy says a forgery is like a cover song. It isn't.
  *   **A Cover Song:** The band stands up and says, "This is a song by Prince." They are celebrating the composition. The value comes from *their* interpretation of the universal song.
  *   **A Forgery:** The forger stands up and says, "I am Vermeer."

  A better musical analogy for a forgery is **impersonation fraud**. If a singer got on stage, wore Michael Jackson's glove, used his voice, and claimed, "I am recording a new Michael Jackson album from beyond the grave," and then it was revealed to be a guy from Ohio, the audience would feel conned. Not because the singing was bad, but because the *context of the performance* was a lie.

  When your band plays a wedding, you aren't claiming to be the original artists. You are providing a service based on the *sound*. A forgery claims to provide a *historical artifact*.

  #### Crack B: The "Indexical" Trace
  In philosophy, this is called **indexicality**. It's the physical connection between the creator and the object.
  *   **Music:** When you listen to a recording, you are hearing sound waves caused by the artist's vocal cords. That is indexical. However, because music is allographic, we accept that *other* sound waves (covers) can instantiate the same *work*.
  *   **Painting:** When you look at the *Mona Lisa*, you are seeing light reflecting off pigment that was physically moved by Da Vinci's hand.

  If you 3D scan the *Mona Lisa* and print a perfect replica, visually, they are identical. But ontologically, they are different.
  *   **The Original:** A relic. It is a piece of history.
  *   **The Replica:** A simulation.

  Think of it like a lock of Napoleon's hair. Visually, it looks like anyone's hair. Biologically, it's just keratin. But it has value because it was attached to Napoleon. A forgery of Napoleon's hair is just hair. Your buddy is arguing that hair is hair; you are arguing that *provenance* is part of the object's identity. In visual art, the history of the object is part of the aesthetic experience.

  #### Crack C: The Van Meegeren Effect (Why the Art "Got Worse")
  You mentioned that van Meegeren's paintings looked beautiful until people knew they were fakes, and then they looked "different." This proves your point, not your buddy's.

  If art were purely about visual data (like your buddy thinks), the reveal shouldn't change the visual experience. But it does. Why?
  *   **Innovation vs. Pastiche:** When people thought it was a Vermeer, they saw a 17th-century master pushing the boundaries of his time. When they found out it was van Meegeren, they saw a 20th-century guy *pretending* to push boundaries.
  *   **The Narrative:** We don't view art in a vacuum. We view it as a conversation across time. A Vermeer is a statement from 1665. A van Meegeren is a statement from 1945 *about* 1665. Once you know it's the latter, the "conversation" changes. It becomes a lie rather than a testimony.

  In music, if you find out a band wrote their own song rather than covering it, the song doesn't suddenly sound worse. But if you find out a "newly discovered Bach manuscript" was actually written by a student in 1950, the *musical analysis* changes. Critics might say, "Oh, that modulation isn't innovative Baroque genius; it's a clumsy 1950s attempt at Baroque." The notes are the same; the *meaning* of the notes changes.

  ### 3. Is It Snobbery?

  Your buddy's conclusion ("it's all snobbery") survives only if you define art strictly as **decoration**.

  If the purpose of the *Mona Lisa* is simply to have a nice image of a woman on the wall, then yes, a high-res print is better because it's clearer and you don't have to queue. That is a functional view of art.

  But if the purpose of art is **human connection across time**, then the original matters immensely.
  *   **The Wedding Band Context:** Your buddy is right in his context. At a wedding, the goal is *danceability* and *atmosphere*. The guests don't care if you are the original recording; they care about the *function* of the music. In that context, a perfect cover is equal to the original.
  *   **The Museum Context:** The goal is *witness*. People queue to see the *Mona Lisa* for the same reason they queue to see the Declaration of Independence or visit the site of a battle. It's not about the visual data; it's about standing in the presence of the thing that was *there*.

  ### The Verdict

  You can tell your buddy this:

  He is treating paintings like **MP3s** (data to be experienced), when museums treat them like **relics** (history to be witnessed).

  *   **His point holds for:** Posters, prints, and functional decoration. If you just want the image on your wall, a replica is fine.
  *   **Your point holds for:** The definition of the "Work of Art." In painting, the history of production is baked into the identity of the work.

  The "snobbery" isn't about thinking one object looks better than another. It's about recognizing that **authenticity is a feature of the object, not just a label.** A diamond and a cubic zirconia can look identical, but they are not the same thing. One is a miracle of geology; the other is a product of a factory.

  Van Meegeren's paintings didn't change physically when he was caught. But they changed *categorically*. They went from being "Windows into the 17th Century" to "Mirrors of the 20th Century." That is why people felt conned. They weren't buying a picture; they were buying a time machine, and the forgery turned out to be a mirror.
