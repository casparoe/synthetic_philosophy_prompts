prompt: |-
  Me and my buddy who plays in a wedding band got into a fight about art forgeries. I'd been reading about the guy who faked Vermeers, van Meegeren, and how people said the paintings looked just as beautiful in the museum before anyone found out, and after the reveal they felt totally conned, which confused me. My buddy says a forgery is basically a cover song: when his band plays a song note for note it's still real music, nobody demands the original recording, so the fuss over originals is just snobbery. When I pushed him he said fine, even an honest perfect replica should count the same, like if you could 3D scan the Mona Lisa down to the brushstroke nobody should care which one they queue up to see. Can you lay out what actually maps between the two cases — what plays the role of the song, the performance, the recording, the composer — and where the comparison breaks down? And does his "it's all snobbery" conclusion survive once you see the cracks, or is there something real he's missing about why the history of the object matters in one case and not the other?
