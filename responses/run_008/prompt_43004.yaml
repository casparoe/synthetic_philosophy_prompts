      *   *Section 3: The Van Meegeren Effect.* Explain why the aesthetic experience changes (context matters).
      *   *Section 4: The Verdict on Snobbery.* Conclude that it's not snobbery, but about different categories of value (historical vs. sensory).

  7.  **Refining the Argument (Self-Correction during drafting):**
