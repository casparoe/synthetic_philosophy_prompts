answer: |-
  You have identified a precise and sophisticated tension in the philosophy of history. While there is no single English word that captures the entire rhetorical rhythm you describe, the concept sits at the intersection of **Structuralist Historiography** (specifically the Annales School), **Causal Overdetermination**, and the debate over **Counterfactual History**.

  If you require a label for the specific *argumentative move*—the act of dismissing a contingent event because a larger structure would have reproduced the outcome—the most accurate established term is **The Appeal to Structural Inevitability**. However, to capture the specific mechanism of *absorption* you described (where the small is swallowed by the large, which is swallowed by the larger), I propose we refine this into the concept of **Structural Absorption**.

  Here is the breakdown of the concept, its lineage, how it differs from plain determinism, and where its legitimate boundaries lie.

  ### 1. The Lineage: Braudel and the Hierarchy of Time
  The intellectual home of this argument is the **Annales School** of French historiography, specifically the work of **Fernand Braudel**. In *The Mediterranean and the Mediterranean World in the Age of Philip II* (1949), Braudel divided historical time into three layers:

  1.  **L'histoire événementielle (Event History):** The short-term, surface history of battles, treaties, and courier rides. Braudel dismissed this as "the foam on the waves."
  2.  **La conjoncture (Cyclical Time):** Medium-term economic and social cycles (wars, price fluctuations).
  3.  **La longue durée (Long-term Time):** The deep, slow-moving structures of geography, climate, demographics, and mentalities.

  The argumentative move you encounter is a **reductive application of Braudel's hierarchy**. Your critics are asserting that the *événementielle* (the courier) is causally negligible because it is constrained by the *longue durée* (the balance of power). They are not just saying the event didn't happen; they are saying the event lacks *ontological weight* against the structure.

  ### 2. The Logical Mechanism: Causal Overdetermination
  Philosophically, this move relies on **Causal Overdetermination**.
  *   **Plain Determinism:** Event A (Courier) $\rightarrow$ Event B (Siege). If you remove A, B does not happen.
  *   **Structural Absorption:** Structure S (Geopolitics) $\rightarrow$ Event B (Siege). Event A is merely one of many sufficient triggers provided by S. If you remove A, Structure S produces Trigger C (a different diplomatic insult), and B happens anyway.

  In counterfactual history (e.g., Niall Ferguson's *Virtual History*), this is often called the **Convergence Thesis**: the idea that multiple different paths converge on the same outcome due to structural constraints.

  ### 3. How It Differs from Plain Determinism and Historian's Caution
  You asked for the distinctions. They are crucial for your defense as a novelist.

  **Vs. Plain Determinism:**
  *   **Determinism** claims a linear necessity: *Given the past, the future was fixed.*
  *   **Structural Absorption** claims a systemic resilience: *Given the system, the specific path didn't matter.*
  *   *Why it matters:* Determinism denies agency entirely. Structural Absorption grants agency but renders it *inefficacious*. It allows your critic to say, "Yes, the courier rode faster, but the war machine was too heavy to stop." It is a claim about **inertia**, not just fate.

  **Vs. Historian's Caution:**
  *   **Caution** is epistemic: *"We cannot know if the courier changed the outcome, so we should not claim he did."*
  *   **Structural Absorption** is ontological: *"We know the courier did not change the outcome, because the forces were too strong."*
  *   *Why it matters:* Caution is a methodological restraint. Structural Absorption is a theoretical assertion. Your critics are not being careful; they are making a bold claim about the nature of causality.

  ### 4. Defining the Concept: "Structural Absorption"
  Since you asked to coin a term if none existed, I suggest **Structural Absorption** to describe the specific *rhetorical pattern* of infinite scaling you observed.

  **Definition:** The argumentative practice of neutralizing a contingent causal claim by subsuming it under a broader, slower-moving causal layer, asserting that the larger layer dictates the outcome regardless of variance in the smaller layer.

  **The Edges (Legitimacy vs. Reflex):**
  When is this reasoning legitimate, and when is it a reflex?

  **Legitimate Structural Absorption:**
  *   **Tight Constraints:** When the structural variables leave no room for maneuver.
      *   *Example:* In 17th-century France, if you argue that a specific tax collector's kindness prevented a peasant revolt, a historian may legitimately invoke Structural Absorption. The fiscal pressure of the Thirty Years' War and the centralization policy of Richelieu created a structural necessity for revenue that would trigger unrest regardless of one collector's kindness.
  *   **Demographic/Geographic Imperatives:** When the cause is physical.
      *   *Example:* A courier cannot stop a famine caused by a three-year volcanic winter. The *longue durée* of climate absorbs the *événementielle* of the ride.

  **The Reflex (The Fallacy of Macro-Preemption):**
  *   **The Bottleneck Error:** When the "large structure" actually depends on the "small event" to function.
      *   *Example:* The balance of power (Large) depends on treaties (Small). If a treaty fails because a courier was late, the balance of power *shifts*. To say the balance of power would have remained the same is circular reasoning.
  *   **The Human Pivot:** When a specific decision by an agent is the *only* mechanism through which the structure acts.
      *   *Example:* Charles I's decision to raise his standard at Nottingham. One could argue "Stuart-Anglo tensions made civil war inevitable" (Structural Absorption). However, if Charles had fled to France instead (a plausible contingency), the *timing, nature, and outcome* of the conflict would have differed radically. Here, Structural Absorption becomes a shield against analyzing the actual complexity of the crisis.
  *   **The Infinite Regress:** As you noted, the absorption never has to stop. If you push it far enough, *nothing* matters but geology. This is the **Reductionist Trap**. Legitimate history stops at the level where human agency meaningfully interacts with structure.

  ### 5. Recommended Literature for Your Defense
  To arm yourself against this critique, you should look into the following:

  1.  **Isaiah Berlin, *The Hedgehog and the Fox*:** Berlin distinguishes between thinkers who relate everything to a single central vision (hedgehogs/structuralists) and those who pursue many ends (foxes/contingency). Your critics are hedgehogs; you, as a novelist, are licensed to be a fox.
  2.  **E.H. Carr, *What is History?*:** Carr argues for the interplay of structure and agency. He warns against the "determinist fallacy" but acknowledges structural limits.
  3.  **Niall Ferguson (ed.), *Virtual History*:** Specifically the introduction, where Ferguson attacks the "determinist" view that history follows a pre-ordained path. He argues that counterfactuals are necessary to prove causation.
  4.  **Paul Veyne, *Writing History*:** A post-structuralist take that acknowledges history is a "plot" we impose. This validates your position as a novelist: you are openly imposing a plot, whereas the historian claiming "inevitability" is covertly imposing one.
  5.  **Antonio Gramsci, *Prison Notebooks*:** Look for his concept of **"Conjuncture" vs. "Organic."** He argues that while organic movements (structures) are deep, conjunctural events (the courier) can tip the balance during a crisis. This gives you a theoretical basis for saying the courier *did* matter at that specific moment.

  ### Summary for Your Practice
  When a critic tells you your plot change is "idle" because the siege would have happened anyway, they are deploying **Structural Absorption**.

  *   **Their Claim:** The *longue durée* renders the *événementielle* irrelevant.
  *   **Your Counter:** History is not just the outcome (the siege); it is the *experience* of the event. Even if the siege happens a month later, the lives lost in that month, the morale of the troops, and the specific political context of the delay are real historical differences.
  *   **The Limit:** Remind them that structures do not act; people do. The "balance of power" does not sign treaties; ministers do. If the minister misses the meeting because the courier was late, the structure has no hands to act with.

  You are not writing a simulation of geopolitical forces; you are writing a simulation of human experience within those forces. The "absorption" move is valid for explaining *macro-trends*, but it is invalid for erasing *micro-realities*.
