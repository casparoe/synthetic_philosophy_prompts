  my older brother is home on break and he basically ruined christmas dinner with this one, and now I can't stop thinking about it. he's taking game theory and told us about the centipede game: two players take turns, there's a pot of money that gets bigger each turn, and on your turn you can either "pass" (let the pot grow and hand the turn over) or "take" (grab the pot, you get the bigger share, game over, at the last turn whoever moves just takes everything obviously). then he walked us through this chain and dared anyone to find the bad step, and nobody could:

  (1) at the final turn, taking gives you more than passing, so a rational player takes there. (2) the player right before that, knowing (1), should also take, because passing just means watching the other person grab the bigger pot. (3) run that logic back turn by turn and a rational player takes at the very first opportunity, even though both players would be richer if they'd both kept passing. (4) here's the part that got me: every real interaction between two people has a final turn somewhere — you graduate, you move away, eventually somebody dies — so if people are even roughly rational and know that, the same backwards chain makes every promise, favor, and friendship irrational all the way back to the first one, and cooperation only exists because people are bad at logic. (5) but that seems nuts, because people who totally know their arrangement is ending still cooperate, and it doesn't look stupid of them. (6) so either backward induction is broken or "rational choice" is broken, and my brother says actual game theorists have papers fighting about exactly this.

