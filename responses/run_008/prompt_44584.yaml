answer: |-
  You have independently rediscovered two of the most famous problems in decision theory: the **Allais Paradox** (1953) and the core insights of **Prospect Theory** (Kahneman & Tversky, 1979).

  Your intuition is sharp: there *is* a principle underneath your choices, but it is not the principle of Expected Utility (the standard mathematical model of rationality). Your choices are psychologically consistent, even if they are mathematically inconsistent.

  Here is the breakdown of the principle that captures your verdicts, which verdicts create a vulnerability, and what the theory predicts for your unanswered questions.

  ### 1. The Principle: Prospect Theory
  Your behavior is perfectly described by Prospect Theory, which argues that humans do not evaluate gambles based on final wealth, but on **gains and losses relative to a reference point**, weighted by a **non-linear perception of probability**.

  Two specific mechanisms explain all your data points:

  *   **The Certainty Effect:** We overweight outcomes that are considered certain relative to outcomes that are merely probable. The psychological jump from 99% to 100% is much larger than the jump from 80% to 81%.
  *   **The Reflection Effect:** We are risk-averse when dealing with gains (preferring a sure thing) but risk-seeking when dealing with losses (gambling to avoid a sure loss), *unless* the probabilities are very small (where we buy insurance).

  ### 2. Analyzing Your Verdicts
  Here is how this principle maps to your specific notes:

  *   **The Allais Pair (The Starting Point):**
      *   *Your Choice:* Sure $1M > Gamble A; Gamble B > 11% $1M.
      *   *Explanation:* This is the classic Allais Paradox. In the first choice, the "Certainty Effect" kicks in. The 100% chance creates a psychological "floor" that you refuse to breach. In the second choice, there is no certainty, so you revert to comparing the expected value (where the $5M option dominates).
      *   *Verdict:* Mathematically inconsistent, but psychologically standard.

  *   **The 99% Case:**
      *   *Your Choice:* 99% $1M > Gamble A (but you deliberated).
      *   *Explanation:* This confirms the Certainty Effect is driven by the *label* of "guaranteed." At 99%, the psychological weight drops significantly, which is why you had to think about it. You are sensitive to the discontinuity at 100%.

  *   **The Small Stakes ($100):**
      *   *Your Choice:* Gamble > Sure $100.
      *   *Explanation:* This reveals **Diminishing Sensitivity**. $1 million is life-altering; losing it triggers deep regret. $100 is trivial. Your "value function" is curved (concave) for large gains but nearly linear for small ones. When the stakes are low, the Certainty Effect vanishes because the "floor" doesn't matter.

  *   **The Losses:**
      *   *Your Choice:* Gamble to avoid Sure Loss; Prefer 11% loss over 10% catastrophe.
      *   *Explanation:* This is the **Fourfold Pattern** of Prospect Theory.
          1.  *Sure Loss vs. Gamble:* You became risk-seeking. A sure loss is painful; a gamble offers hope (the 1% chance of $0). This is the "Break-Even Effect."
          2.  *11% vs. 10% Loss:* You became risk-averse. When both options are risky, you prefer to minimize the magnitude of the loss (Insurance behavior).
      *   *Verdict:* Highly consistent with human psychology.

  *   **The Two-Step Draw:**
      *   *Your Choice:* Switching to the $5M shot when the 89% is resolved first.
      *   *Explanation:* This is **Framing/Segregation**. By separating the 89% common outcome, you destroyed the "Certainty" frame. The choice no longer looked like "Sure Thing vs. Risk," it looked like "11% chance of $1M vs. 11% chance of Gamble." Without the "Sure" label, the Certainty Effect evaporated, and you chose the higher expected value.

  ### 3. Are These Mistakes?
  This depends on whether you want to be **Descriptively Rational** (true to yourself) or **Normatively Rational** (mathematically unexploitable).

  **The Normative Problem (The Money Pump)**
  Your preferences in the first pair (The Allais Paradox) violate the **Independence Axiom**. This makes you vulnerable to a "Dutch Book" or money pump.
  *   *Scenario:* I can sell you the Gamble A for a price slightly higher than the Sure $1M (since you prefer Sure $1M, you value it higher). Then, I can offer to swap your ticket for Gamble B plus a small fee (since you prefer Gamble B in the second pair). Then I can offer to swap Gamble B back to the Sure $1M structure plus a small fee.
  *   *Result:* You end up with the same ticket you started with, but you have paid me fees three times. You will lose money indefinitely.

  **Which Verdicts to Give Up?**
  If you want to avoid being money-pumped, you must align your choices with Expected Utility. You have to drop one side of the Allais pair.
  *   **Recommendation:** Drop the preference for the **Sure $1M** in the first pair.
  *   **Why?** Your other data points suggest that when the "Certainty" frame is removed (Small Stakes, Two-Step Draw), you naturally prefer the higher expected value ($5M shot). Your preference for the Sure $1M is an emotional artifact of the "100%" label, not a valuation of the money itself. Aligning with the $5M shot makes you consistent with your behavior in the Two-Step and Small Stakes cases.

  ### 4. Predictions for Unlisted Cases
  Based on Prospect Theory and your specific profile, here is what the surviving principle predicts:

  **A. The "Almost Sure" Threshold**
  You asked when "almost sure" becomes close enough to "sure" to grip you.
  *   *Prediction:* There is no fixed mathematical percentage. It depends on the **stakes**.
  *   At $100, even 90% feels like "no guarantee," so you gamble.
  *   At $1M, the threshold is likely between 99% and 100%.
  *   At $100M, the threshold might drop to 95%. As the life-altering nature of the sum increases, your tolerance for *any* risk of zero increases, and the "Certainty Premium" grows. You will demand higher probabilities to gamble as the stakes rise.

  **B. The Two-Step Loss Version**
  You asked about the two-step version of the loss pairs (First resolve the 89% where you lose $1M regardless; then choose in the remaining 11%).
  *   *Original Loss Choice:* You gambled (Risk Seeking) to avoid the *Sure* Loss.
  *   *Prediction:* In the Two-Step version, **you will switch to the Safe Option (The Sure Loss).**
  *   *Reasoning:* Just as breaking the "Sure Gain" into two steps made you risk-seeking (by removing the certainty bonus), breaking the "Sure Loss" into two steps will make you **risk-averse**. The psychological pain of a "Sure Loss" is what drove you to gamble originally. If that loss is framed as conditional (only happening if you pass the first filter), it feels less like a "Sure Loss" and more like a "Probable Loss." The desperation to escape vanishes, and you will likely accept the smaller loss rather than risk the $5M catastrophe.

  ### Summary
  You have no "mistakes" in the sense of being broken; you are human. Your choices are governed by **Regret Minimization** (avoiding the feeling of having had a million and losing it) and **Probability Weighting** (overvaluing certainty).

  However, if you wish to make decisions that maximize wealth over a lifetime rather than minimize immediate emotional regret, you should train yourself to treat 99% and 100% as neighbors. **Give up the Sure $1M preference.** It is the only verdict that contradicts your behavior when the "certainty" illusion is stripped away by framing or scale.
