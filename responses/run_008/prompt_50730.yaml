      *   *Reply to Premise 3:* Is "pain" like "junk"? Or is it like "computation" or "gene"? "Gene" was redefined from "unit of heredity" to "DNA sequence," but before DNA was known, the functional definition held. "Computation" is realized in gears, vacuum tubes, silicon. We don't say a calculator isn't calculating because it lacks silicon.
