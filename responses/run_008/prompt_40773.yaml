      *   *Reading 2 (Strategic):* Call it "Proxy Gaming." Verdict: True, but supports "better incentives," not "no metrics." This is the one she *needs*. It fails because she conflates *tracking* with *judging*.
      *   *Reading 3 (Reflexive):* Call it "Ontological Corruption." Verdict: Debatable, too strong for software engineering.
      *   *The Strava Rebuttal:* She deleted the app. She could have hidden the pace. She chose to game, then chose to quit. That's a choice, not a law of physics.
      *   *Historical Note:* Goodhart = Monetary. Campbell = Social. She is quoting Goodhart but meaning Campbell. This weakens her authority slightly (pedantic but useful).
