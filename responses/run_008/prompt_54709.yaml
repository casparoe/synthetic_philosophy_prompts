prompt: |-
  I cover science and ideas for a mid-size outlet, and the fights I actually have with my editors are never about fabricating things — nobody wants to print a false claim. The fights are about sentences that are technically true but built to make readers believe something stronger or just different: headlines like "chemical found in coffee linked to cancer" for a relative risk of 1.02, or "half of new teachers quit within five years" when that's counting retirements. The philosophy of language has this whole literature on the difference between lying (asserting what you believe false) and misleading (saying something true, or not asserting at all, while engineering a false belief) — and some people argue the misleading route is actually worse, morally, because it makes the reader do the deceiving to themselves. I want that turned into something usable. Please write a decision procedure I can run on a headline or lede in ten minutes before deadline: what to check, in what order, what counts as failing, and where the procedure has to stop and hand off to a human judgment call — especially the question of whether misleading-by-implication is as bad as lying, which I suspect is a values question no checklist can settle. It needs a few test sentences I can hold new drafts against, and it has to be honest about the case it can't handle: I can never know for sure what a reader will infer. Then run it on three real-ish examples: the coffee/cancer headline, a lede that says a startup "has yet to rule out" a safety problem that no one has ever alleged (true! also pure insinuation), and one where I expect the answer I won't like — our house style of hedged clickbait like "what X may be doing to your brain," which is carefully designed to pass every fact-check while doing the work of a false claim. Say plainly what the procedure concludes on that last one and whether I should take it up with my editor or live with it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas journalist for a mid-size outlet.
      *   **Problem:** Editorial conflicts aren't about lies, but about *misleading* truths (technically accurate sentences engineered to create false/stronger beliefs).
      *   **Context:** Philosophy of language distinction between *lying* (asserting falsehood) and *misleading* (asserting truth to induce false belief). Some argue misleading is morally worse (reader deceives themselves).
      *   **Task:** Create a 10-minute pre-deadline decision procedure (checklist/flowchart style) to evaluate headlines/ledes.
      *   **Requirements:**
          *   What to check, in what order.
          *   What counts as failing.
          *   Where human judgment takes over (specifically the moral weight of misleading vs. lying).
          *   Acknowledge limitations (can't know reader inference for sure).
          *   Include test sentences.
          *   **Run the procedure on three specific examples:**
              1.  "Chemical found in coffee linked to cancer" (RR=1.02).
              2.  Startup "has yet to rule out" safety problem (never alleged).
              3.  House style hedged clickbait: "What X may be doing to your brain."
      *   **Output:** Plain conclusion on the third example (fight editor or live with it).

  2.  **Deconstruct the Philosophy:**
      *   *Lying:* $P$ is asserted, Speaker believes $\neg P$.
      *   *Misleading:* $P$ is asserted (and is true), but Speaker intends/foresees Hearer infers $Q$ (where $Q$ is false or unsupported).
      *   *The "Worse" Argument:* Misleading offloads epistemic labor to the reader, making them complicit, potentially eroding trust more insidiously.
      *   *The Journalistic Ethic:* Truthfulness isn't just accuracy; it's transparency of uncertainty.

  3.  **Drafting the Decision Procedure (The "Misleading Truth Audit"):**
      *   *Time Limit:* 10 minutes. Needs to be fast, heuristic-based.
      *   *Steps:*
          1.  **Literal Truth Check:** Is it factually accurate? (If no, stop, fix).
          2.  **The "Only" Test:** If you read *only* this sentence, what is the main takeaway?
          3.  **The Evidence Gap:** Does the strength of the wording match the strength of the evidence? (Correlation vs. Causation, Relative vs. Absolute Risk).
          4.  **The Negation/Insinuation Check:** Are we highlighting an absence of evidence as evidence of absence (or presence)?
          5.  **The "So What?" Test:** Does the implication drive the click/value, while the truth hides in the body?
      *   *Fail Conditions:* Specific mismatches between implication and evidence.
      *   *Handoff Point:* When the text is technically defensible but feels manipulative. This is the values question.

  4.  **Developing Test Sentences (Calibration):**
      *   Need a "Pass" (Clear, accurate).
      *   Need a "Fail" (Blatant misleading).
      *   Need a "Gray" (Nuanced).

  5.  **Running the Procedure on the Three Examples:**

      *   *Example 1: Coffee/Cancer (RR 1.02).*
          *   Literal: True (linked).
          *   Implication: Danger.
          *   Evidence: Weak (1.02 is negligible).
          *   Verdict: Fail (Magnitude mismatch).

      *   *Example 2: Startup "Yet to Rule Out".*
          *   Literal: True (They haven't ruled it out).
          *   Implication: There is a reason to worry.
          *   Evidence: No one alleged it.
          *   Verdict: Fail (Insinuation of risk where none exists).

      *   *Example 3: House Style "What X May Be Doing".*
          *   Literal: True (It *may* be doing something).
          *   Implication: There is a specific, likely effect worth worrying about.
          *   Evidence: Often speculative.
          *   Verdict: This is the hard one. It passes literal checks but fails the "spirit" check.
          *   *Advice:* This is the systemic issue. The procedure will flag it as "High Risk of Misleading." The user needs to know whether to fight. Given the prompt ("expect the answer I won't like"), I need to be honest. If the outlet relies on this for traffic, fighting every instance might be career suicide, but ignoring it erodes integrity. The advice should be strategic: Pick battles, or propose an alternative style that keeps clicks but reduces deception. However, the prompt asks me to say *plainly* what the procedure concludes and whether to take it up.
          *   *Decision:* The procedure concludes it is misleading. Should they take it up? Yes, but not as a "lie" accusation, but as a "trust erosion" argument.

  6.  **Refining the "Human Judgment" Section:**
      *   The checklist can't solve the moral weight. I need to explicitly state that the checklist identifies the *mechanism*, but the journalist must weigh the *consequence*.
      *   Acknowledge the limitation: We can't control reader inference, but we can control *invited* inference.

  7.  **Review and Polish:**
      *   Tone: Professional, empathetic to the journalist's plight, philosophically grounded but practical.
      *   Structure: Clear headings, bold text for scanability.
      *   Check against constraints: 10 minutes? Yes. Test sentences? Yes. Three examples run? Yes. Plain conclusion on the last one? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make it a flowchart.
      *   *Correction:* Text-based step-by-step is easier to copy/paste into a doc.
      *   *Initial thought:* Tell them to refuse the clickbait.
      *   *Correction:* Realistically, mid-size outlets need traffic. The advice should be about *mitigation* or *negotiation*, not just martyrdom. But the prompt asks "take it up or live with it." I should lean towards "take it up, but frame it correctly."
      *   *Refining the "Misleading is Worse" point:* I need to make sure the procedure doesn't decide this, but highlights where the question arises.

  9.  **Final Polish of the Examples:**
      *   Make sure the analysis of the "May be doing" headline is sharp. It's the "Paltering" zone.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## The Misleading Truth Audit (10-Minute Pre-Deadline Procedure)

  This procedure is designed to detect **implicature mismatches**: where the literal truth of a sentence diverges from the reasonable inference a reader will draw. It does not decide moral worth; it identifies mechanical deception so you can make the values call.

  **Time limit:** 10 minutes.
  **Scope:** Headlines, subheads, and the first 50 words of the lede.

  ### Phase 1: The Literal Baseline (2 Minutes)
  *Goal: Ensure you aren't lying. If you fail here, fix the fact.*

  1.  **The Verification Check:** Can every noun and verb in the sentence be backed by a specific line in the body copy or source material?
  2.  **The Negation Check:** If the sentence relies on a negative ("fails to," "has yet to," "no evidence"), is the absence of evidence clearly distinguished from evidence of absence in the text?

  *   **FAIL:** You cannot point to a source.
  *   **PASS:** The sentence is factually defensible. Move to Phase 2.

  ### Phase 2: The Implication Scan (4 Minutes)
  *Goal: Identify the "Ghost Claim"—the thing the reader will believe that isn't actually written.*

  3.  **The "Only" Test:** Cover the body copy. Read *only* the headline/lede. Write down the single strongest belief a reasonable layperson would form.
      *   *Example:* "Chemical Linked to Cancer" $\rightarrow$ Belief: "Coffee causes cancer."
  4.  **The Magnitude Match:** Does the linguistic strength match the statistical strength?
      *   *Check:* Words like "linked," "causes," "risk," "breakthrough."
      *   *Compare:* Relative risk vs. Absolute risk. P-values vs. Effect size. Correlation vs. Causation.
      *   **FAIL:** The headline implies a magnitude (danger, certainty, causality) that the study does not support.
  5.  **The Relevance Check:** Is the true fact highlighted the *most important* fact, or just the most sensational true fact available?
      *   *Example:* Highlighting a safety test not yet completed (true) when no safety issue has been alleged (context).
      *   **FAIL:** The sentence highlights a technicality to imply a scandal.

  ### Phase 3: The Intent & Alternative (4 Minutes)
  *Goal: Determine if the misleading nature is functional or accidental.*

  6.  **The "So What?" Test:** If you rewrote the headline to be fully accurate (including the uncertainty/weakness), would it lose its urgency?
      *   *If Yes:* You are using uncertainty as a hook. This is the danger zone.
      *   *If No:* The misleading phrasing is likely laziness, not strategy.
  7.  **The Alternative Draft:** Write one version that conveys the same urgency but removes the false implication.
      *   *If you cannot write one:* The piece relies on misleading the reader to function.

  ### The Handoff Point (Where the Checklist Stops)
  If you pass Phase 1 but fail Phase 2 or 3, you have identified **Paltering** (using truthful statements to convey a false impression).

  **The checklist cannot tell you if this is morally permissible.** It cannot weigh the necessity of traffic against the erosion of trust. It cannot tell you if "misleading is worse than lying."
  *   **This is your judgment call.** You must decide if the outlet's business model depends on epistemic labor offloaded to the reader.

  ***

  ### Calibration Sentences (Hold new drafts against these)

  *   **Control (Pass):** "Study finds small association between high coffee intake and cancer in mice." (Accurate magnitude, accurate subject).
  *   **Violation (Fail):** "Popular Drink Tied to Tumor Growth." (Implies human causality from mice data; hides magnitude).
  *   **Gray Zone (Handoff):** "Coffee Compound Under Investigation for Cancer Link." (True, but implies an active investigation exists when it may just be one paper).

  ***

  ### Running the Procedure on Your Examples

  #### Example 1: "Chemical found in coffee linked to cancer" (Relative Risk 1.02)
  *   **Phase 1 (Literal):** PASS. A chemical was found. A statistical link exists.
  *   **Phase 2 (Implication):**
      *   *Only Test:* Reader believes coffee increases cancer risk significantly.
      *   *Magnitude Match:* **FAIL.** A relative risk of 1.02 is statistically negligible and likely noise. "Linked" implies a meaningful connection.
      *   *Relevance:* **FAIL.** Highlighting the link hides the insignificance of the risk.
  *   **Phase 3 (Intent):**
      *   *So What?:* If you wrote "Chemical in coffee has negligible statistical link to cancer," no one clicks.
      *   *Alternative:* "Study finds negligible cancer link in coffee compound."
  *   **Conclusion:** **FAIL.** This is a magnitude mismatch designed to induce fear.

  #### Example 2: Startup "has yet to rule out" safety problem (Never alleged)
  *   **Phase 1 (Literal):** PASS. Technically, they have not issued a statement ruling it out.
  *   **Phase 2 (Implication):**
      *   *Only Test:* Reader believes there is a specific reason to suspect a safety problem.
      *   *Relevance:* **FAIL.** Highlighting the absence of a denial implies the presence of an accusation.
      *   *Negation Check:* **FAIL.** Uses "has yet to" to convert a null state into an active liability.
  *   **Phase 3 (Intent):**
      *   *So What?:* If you wrote "No safety problems alleged, startup hasn't issued statement," it has no news value.
      *   *Alternative:* "Startup faces no safety allegations."
  *   **Conclusion:** **FAIL.** This is insinuation masquerading as due diligence.

  #### Example 3: House Style "What X May Be Doing to Your Brain"
  *   **Phase 1 (Literal):** PASS. "May" covers almost any speculation.
  *   **Phase 2 (Implication):**
      *   *Only Test:* Reader believes there is credible evidence of a specific effect worth investigating.
      *   *Magnitude Match:* **FAIL.** "Doing" implies an active, measurable process. "May" does the heavy lifting of uncertainty, but the noun phrase "What X... Doing" asserts the effect exists.
      *   *Relevance:* **FAIL.** The hook is the certainty of the *question*, implying the *answer* is known enough to be alarming.
  *   **Phase 3 (Intent):**
      *   *So What?:* **CRITICAL FAIL.** If you rewrite as "We Don't Know If X Affects Your Brain," the click-through rate drops. The headline *requires* the reader to infer certainty to function.
      *   *Alternative:* "The Unproven Theory That X Affects Your Brain." (Less clickable).
  *   **Conclusion:** **SYSTEMIC FAIL.** This is not an accident; it is a feature of your house style.

  ***

  ### The Verdict on Example 3

  The procedure concludes that this house style is **structurally misleading**. It passes the fact-check (Phase 1) but fails the implication check (Phase 2) by design. It relies on the reader inferring a stronger claim ("X *is* doing this") than the text asserts ("X *may* be doing this") to generate value.

  **Should you take it up with your editor or live with it?**

  **Take it up.** But do not frame it as a lie. Frame it as a **trust liability.**

  If you argue "This is false," you will lose, because it is technically true. If you argue "This makes us look like clickbait," you might win.

  **The Argument:**
  "Editor, I ran an audit on our headlines. We are technically accurate, but we are systematically inviting readers to deceive themselves. In the short term, this drives clicks. In the long term, when readers realize the 'may' does no work and the story is speculative, they don't blame the science; they blame *us* for the bait-and-switch. We are trading brand equity for traffic. I propose we test a 'High Certainty' vs. 'High Speculation' tag on these headlines to see if we can maintain clicks without the insinuation."

  **Why:**
  You cannot live with it indefinitely without becoming cynical about your own work. The philosophy of language suggests that misleading is corrosive because it makes the audience complicit in their own deception. Eventually, they realize they are being played. If you want to be a science journalist, your capital is trust. This house style spends that capital.

  **The Compromise:**
  If they refuse to change the style, you must decide if the paycheck is worth the erosion of your professional identity. But the checklist proves you are right: it is misleading. Do not let the technical truth convince you otherwise.
