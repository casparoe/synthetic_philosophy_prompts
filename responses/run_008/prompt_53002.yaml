answer: |-
  Here is the specification you asked for, followed by the judgment on your three questions. I am going to be blunt: most attempts to solve this fail because they try to save hedonism rather than describe pleasure.

  ### The Specification for an Adequate Theory of Pleasure

  To solve the heterogeneity problem without changing the subject, a theory must satisfy these five constraints:

  **1. Total Phenomenological Coverage**
  The definition must subsume the entire extension of the folk concept "pleasure" without residue. This includes low-level bodily sensations (itch relief), high-level propositional attitudes (solving a proof), mixed-affect states (runner's high, spicy food), and morally repugnant states (schadenfreude, sadistic gratification).
  *The Case:* If a theory excludes the "hurts so good" cases, it is a theory of *comfort*, not pleasure. If it excludes sadistic pleasure to save the moral plausibility of hedonism, it is begging the question. The metaphysics of pleasure must be distinct from the normativity of well-being.

  **2. Non-Circular Identification**
  The theory must provide a criterion for identifying pleasure that does not rely on the subject's pre-existing ability to identify pleasure. You cannot define pleasure as "the sensation we like for its own sake" if "liking" is just a synonym for "taking pleasure in." You cannot define it as "the feeling that feels good" if "feels good" is unanalyzed.
  *The Case:* This avoids the "dormitive virtue" problem. If the only way to spot pleasure is to ask "did you enjoy that?", the theory offers no explanatory power. It must point to something independent (a specific qualia, a functional role, a neural signature) that *makes* it pleasure.

  **3. Normative Neutrality regarding the Sadist**
  The theory must explicitly categorize the sadist's gratification. It cannot remain silent. It must declare: "This is pleasure, and therefore it counts toward well-being" (bite the bullet) OR "This is pleasure, but it does not count toward well-being" (modify hedonism) OR "This is not pleasure" (restrict the definition).
  *The Case:* Ambiguity here allows hedonists to shift definitions mid-argument. If the sadist's joy is pleasure, hedonism faces the repugnance objection. If it isn't, hedonism faces the heterogeneity objection. You must pick your poison.

  **4. Cardinal Comparability (The Aggregation Constraint)**
  The theory must explain how different instances of pleasure are measured on a single scale. It must be possible, in principle, to say that 10 minutes of intellectual pleasure equals 5 minutes of bodily pleasure. There must be a common currency of intensity and duration.
  *The Case:* Hedonism is typically a maximizing theory. If pleasures are incommensurable kinds (like "length" vs. "weight"), you cannot maximize the sum. You can only satisfy local preferences. If the theory cannot support aggregation, it supports satisficing or pluralism, not classical hedonism.

  **5. Distinctness from Desire**
  The theory must distinguish pleasure from the satisfaction of desire. It must allow for cases where one desires something but finds no pleasure in it, and cases where one feels pleasure without prior desire.
  *The Case:* If pleasure just *is* "getting what you want," you are a desire-satisfaction theorist. That is a valid theory, but it is not hedonism. Smuggling desire in to solve heterogeneity is a concession that hedonism failed.

  ***

  ### 1. Which requirements are real, and which are prejudices?

  You are right to suspect the "One Property" demand. That is the prejudice.

  The demand for a **single natural kind** (like the molecular structure of water) is likely a category error. Pleasure is probably not a natural kind; it is a functional or psychological kind. However, the demand for **Unity** is not a prejudice; it is a requirement for the theory to be useful.

  Here is the tension: You want "No False Unity" (don't pretend there's a single qualia) and "No Cop-Out" (don't just say "it's a disjunction"). These are jointly satisfiable, but only if you abandon *ontological* unity for *functional* unity.

  If you argue that pleasure is a "family resemblance" concept (Wittgenstein), you satisfy Coverage but fail Aggregation (how do you add up family resemblances?). If you argue pleasure is a "pro-attitude" (functional role), you satisfy Unity but risk Circularity (what defines the attitude?).

  **The Verdict:** The "One Property" requirement must be dropped. It should be replaced with "One Principle of Classification." A disjunction is a cop-out *only if* it is an unstructured list ("A or B or C"). It is acceptable if it is a structured functional definition ("Any state that plays role X in the cognitive economy"). But be warned: Functional views often struggle with the *felt* aspect of pleasure, making them feel like they are describing motivation, not experience.

  ### 2. Which single requirement knocks out the most candidates?

  Your guess is correct: **Non-Circularity** is the silent killer.

  It destroys the **Attitude/Enjoyment View** (the most popular contemporary defense). This view says pleasure is not a feeling, but an attitude of "enjoyment" or "being pleased by" directed at an object.
  *Why it dies:* When pressed to define "enjoyment," proponents almost always slide into "it's the attitude you take toward things you find pleasant." If they define it as "intrinsically wanting the sensation to continue," they collapse into Desire-Satisfactionism (violating Constraint 5). If they define it as "a positive reaction," they haven't explained what makes the reaction positive without referencing pleasure (violating Constraint 2).

  It also wounds the **Felt-Quality View**, but differently. The Felt-Quality view tries to point to a specific "tingle." Non-Circularity demands they identify that tingle without saying "it's the pleasant tingle." They can do this (e.g., "a specific phenomenological tone"), but then they immediately get slaughtered by **Total Phenomenological Coverage**. There is no single tingle shared by sex, math, and schadenfreude.

  So, Non-Circularity kills the Attitude view conceptually, while Coverage kills the Felt-Quality view empirically. But Circularity is the deeper philosophical sin.

  ### 3. The Scorecard

  **(a) The Felt-Quality View (Hedonic Tone)**
  *   *Coverage:* **Fail.** There is no common phenomenological thread between the relief of an itch and the satisfaction of a proof. Proponents usually ignore the intellectual cases or the "hurts so good" cases.
  *   *Circularity:* **Pass.** They point to a raw feel. It's independent.
  *   *Aggregation:* **Pass.** If it's a single tone, it can theoretically be measured by intensity/duration.
  *   *Verdict:* Empirically false. It describes a subset of pleasures, not the genus.

  **(b) The Attitude/Enjoyment View (Feldman, etc.)**
  *   *Coverage:* **Pass.** It handles heterogeneity well because the *object* changes, not the attitude.
  *   *Circularity:* **Fail.** "Enjoyment" is rarely defined independently of pleasure. It usually amounts to "taking a pleasure-attitude toward X."
  *   *Distinctness from Desire:* **Fail.** Often collapses into "intrinsically desiring the experience."
  *   *Verdict:* The current champion, but it wins by changing the definition of pleasure to "whatever we treat as pleasure." It's a linguistic fix, not a metaphysical one.

  **(c) The Disjunction / Family Resemblance View**
  *   *Coverage:* **Pass.** By definition, it includes everything.
  *   *No Cop-Out:* **Fail.** It admits there is no unified theory.
  *   *Aggregation:* **Fail.** If pleasure is just a list of unrelated things, you cannot sum them into a "greatest happiness." You cannot compare units of "massaging pleasure" to units of "listening pleasure" if they share no common currency.
  *   *Verdict:* Honest, but it destroys classical hedonistic utilitarianism. It leaves you with a pluralistic value theory that merely *uses* the word pleasure.

  ### Final Judgment

  If you hold the spec tight, **no existing theory passes.**

  The Felt-Quality view is empirically wrong. The Attitude view is circular. The Disjunction view abandons the hedonistic project of maximization.

  This suggests the problem isn't the theories; it's the premise. "Pleasure" is likely a folk-psychological umbrella term that does not map to a single natural or functional kind capable of bearing the weight of a normative theory. If you want to be a hedonist, you have to either:
  1.  Accept the Disjunction and give up on precise aggregation (Hedonism becomes vague).
  2.  Accept the Attitude view and admit it's a close cousin of Desire Theory (Hedonism becomes Desire-Satisfactionism).
  3.  Accept the Felt-Quality view and admit it only covers sensory well-being (Hedonism becomes limited).

  If I had to place a bet: The "No Circularty" constraint is the wall you will hit hardest. Most philosophers solve the heterogeneity problem by defining pleasure in terms of *what we do with it* (desire/attitude) rather than *what it is*. That solves the diversity issue but sacrifices the independence of the theory. You can have a coherent definition of pleasure, or you can have a robust hedonism, but the spec suggests you cannot have both.
