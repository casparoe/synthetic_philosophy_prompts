      *   *Sadist Status:* This is tricky. Hedonism *should* count sadistic pleasure as pleasure (otherwise it's moralizing the definition). But whether it counts toward *well-being* is a separate normative question. The requirement should be: The theory must distinguish the *phenomenology/metaphysics* of pleasure from the *normativity* of well-being.
      *   *Aggregability:* Crucial for *classical* hedonistic utilitarianism. But is it crucial for *hedonism about well-being*? If I'm a hedonist about prudence, do I need to add up units? Yes, generally, to compare lives. So, keep it.
