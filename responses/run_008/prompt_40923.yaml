answer: |-
  Your intuition aligns with a significant critique in modern moral philosophy, specifically the objections raised by Bernard Williams and Michael Stocker against utilitarianism and impartial moral systems. They argue that a moral theory that demands we abandon our "ground projects" (the passions and commitments that give our lives meaning) is not just psychologically impossible, but morally self-defeating.

  Here is a principle that captures your pattern, motivates its clauses using your cases, applies it to your test case, and identifies the verdict you may need to reconsider.

  ### The Principle of Integrated Moral Agency

  **A character's moral life is admirable only to the extent that their moral actions are integrated with, rather than substitutive of, a coherent personal identity. This identity is constituted by two necessary conditions: (1) the maintenance of specific, non-moral ground projects, and (2) the fulfillment of special obligations to proximate others. Moral acts that preserve these conditions are virtuous; moral acts that require their total effacement are pathological or tragic, not exemplary.**

  ### Motivation of Clauses

  **Clause 1: The Integrity Constraint (Ground Projects)**
  *   *The Case:* **The Jazz Player vs. The Tireless Soul.**
  *   *Motivation:* You find the Jazz player *more* admirable than the tireless soul with no inner life. This clause explains why. A moral agent without a "self" is merely a conduit for good outcomes, not a person living a good life. The Jazz passion is not a distraction from morality; it is the anchor that makes the morality human. Without it, the character becomes a "moral saint" in the pejorative sense—someone whose perfection renders them alien. This clause validates your sense that the tireless soul is "flat." Flatness here is not just an aesthetic failure; it is an ethical one, signaling the absence of the very individuality that makes moral choice meaningful.

  **Clause 2: The Proximity Priority (Special Obligations)**
  *   *The Case:* **The Father Abandoning Family.**
  *   *Motivation:* You judge the father not admirable, despite the impersonal utility of his work. This clause asserts that morality is not purely impartial. We have "special obligations" (to children, spouses, friends) that carry more weight than general obligations to strangers. To abandon the specific for the abstract is not heroism; it is a dereliction of the immediate moral texture of life. This explains why the character feels morally repugnant rather than noble: he has violated the hierarchy of care that sustains human society.

  **Clause 3: The Discretionary Limit (Self-Preservation)**
  *   *The Case:* **The Kidney Donor vs. Voluntary Poverty.**
  *   *Motivation:* You admire the kidney donor "full stop," but demote the voluntary poverty character to the margins. This clause distinguishes between a *sacrifice* and *self-effacement*. Donating a kidney is a discrete act; it costs the agent, but it leaves their future agency and identity intact. Voluntary poverty (giving away *nearly everything*) threatens the agent's future capacity to act as an integrated self. It consumes the ground from which future moral actions could grow. Therefore, the kidney donor is a protagonist (an agent acting), while the poverty-stricken saint is a setting (a state of being).

  ### Prediction: The Birdwatching Case

  **The Case:** A character who is nearly morally perfect but keeps one hour of solitary birdwatching a day that no argument about the world's suffering could move him to give up.

  **The Prediction:** Under the Principle of Integrated Moral Agency, this character should be judged as **more admirable and more vivid** than a counterpart who *would* give up the birdwatching to alleviate suffering.

  **Reasoning:** The refusal to give up the hour is not selfishness; it is the defense of Integrity. If the character were willing to sacrifice that hour whenever the "world's suffering" demanded it, they would have no boundary between themselves and the needs of others. They would cease to be a distinct agent and become a resource. By guarding that hour, the character asserts that they are a person *living* a life, not a machine *producing* good outcomes. This makes them narratively viable (they have a desire) and ethically robust (they have boundaries). You should feel you could befriend this character, whereas you would cross the street to avoid the one who gave up the hour.

  ### The Cost: Which Verdict Must You Abandon?

  To accept this principle, you must refine or abandon your verdict on **The Voluntary Poverty Character (Case 2)**.

  Currently, you state: *"I admire her, but I also find I cannot make her the center of a novel."*
  The Principle suggests: **You should not admire her unqualifiedly.**

  **Why?**
  If the Jazz player is *more* admirable than the "tireless gentle soul" (Case 3), and the Voluntary Poverty character is essentially a "tireless gentle soul" who has also sacrificed material security, then her self-effacement is a moral deficit, not just an aesthetic one.

  By giving away nearly everything, she has violated the **Discretionary Limit**. She has compromised her future agency. In philosophical terms, she has treated herself as a mere means to the end of others' welfare, rather than an end in herself. Your admiration for her is likely a reaction to her *discipline* or her *suffering*, not her moral goodness.

  **The Adjustment:**
  You must reclassify her from "Admirable but flat" to **"Tragic or Pathological."**
  *   If she does this out of guilt or self-hatred, she is pathological.
  *   If she does this out of a genuine belief that she must erase herself to be good, she is tragically mistaken about the nature of the good life.

  She can still be a character, but she cannot be a *moral exemplar*. She is a warning. To admire her is to endorse the idea that morality requires self-destruction, which your own intuition about the Jazz player proves you do not actually believe.

  ### Summary for the Novelist
  Your pattern reveals that you are writing **Aretaic Ethics** (ethics of character and flourishing) rather than **Consequentialist Ethics** (ethics of outcomes).
  *   **Good Protagonists** need friction between their moral duties and their ground projects (Jazz, Birdwatching).
  *   **Good Acts** are those that do not consume the agent (Kidney).
  *   **Bad "Heroes"** are those who dissolve their obligations to the near for the far (The Father) or dissolve their self for the abstract (The Poverty Saint).

  Stick to the Birdwatcher. He is the only one who can carry a novel, because he is the only one who is truly alive.
