answer: |-
  The scree shifted under their boots, a dry rattle of angular clasts sliding into the voids below. The Yukon afternoon light cast long shadows across the talus cone, highlighting the interlocking chaos of granite and quartzite fragments.

  **Cal:** Watch your step. These fines are still settling. Forty years ago, I'd have drawn a contact line right about where that dwarf birch is struggling. Called it a formation boundary.

  **Mira:** And now?

  **Cal:** Now I know it's a fiction. A useful one. But look at this slope. Is it one thing? Or just a bunch of rocks sitting together?

  **Mira:** It's one thing. And so is the sum of your left glove and that granite pluton three ridges over.

  **Cal:** There it is. The universalist's bullet bite. You really think "Glove-Pluton" is an object? Distinct from "Glove-Pluton-Moon"?

  **Mira:** Why not? They exist. The parts exist. Composition is unrestricted. If you accept the parts, you get the sum for free. It keeps the ontology clean. No magic moment where things suddenly snap together into being.

  **Cal:** Clean? Mira, it's an ontological explosion. If every arbitrary sum is an object, how do you count anything? Stand here and tell me how many objects are in this scree slope.

  **Mira:** Infinitely many, if the parts are divisible. But usually, we count relative to a sortal. You ask "how many boulders," you get a number. You ask "how many objects," you get a mess. But that's a linguistic limitation, not a metaphysical one.

  **Cal:** It's a metaphysical one if you think objects are supposed to be countable units of reality. I've mapped Precambrian shield where the gneiss grades into migmatite over fifty meters. Where does the rock end? If universalism is true, there's a precise fact of the matter about whether some arbitrary sum exists. But look at this slope.

  *Cal kicked a clast. It dislodged a puff of dust and fine sand that settled into the cracks between larger stones.*

  **Cal:** See that spar cement growing at the grain contacts? Early diagenesis. The slope is turning into conglomerate. When does it become one object? When the cement touches? When it hardens? When I can map it as a unit?

  **Mira:** That's exactly why I'm a universalist. If you say composition is restricted, you need a principle. Contact? Bonding? Function? But bonding is gradual. The cement grows micron by micron. If existence depends on bonding, then existence comes in degrees. And existence can't come in degrees. Something either exists or it doesn't.

  **Cal:** So you solve the vagueness problem by saying everything exists? That's like solving traffic congestion by declaring everyone owns the road.

  **Mira:** I solve it by saying existence isn't vague. The vagueness is in your word "slope." The particles exist. The sum of the particles exists. Whether you care to call it a "slope" or a "rock" depends on your interests. But the object is there regardless.

  **Cal:** But that strips "object" of any work to do. In the field, "a rock" and "an outcrop" and "a formation" are different grades of thing. We never blinked at it. If I map a formation, I'm tracking a causal history, a depositional event. Your "Glove-Pluton" sum has no history. It's just a set.

  **Mira:** It has a history. The history of the glove and the history of the pluton. You're smuggling in causality because you want objects to be *useful*. But metaphysics isn't about utility. It's about what's there. If you deny the sum exists, you're saying reality changes based on how tightly the parts hug.

  **Cal:** I'm saying reality has structure. Bonds matter. Forces matter. When the cement binds these grains, new properties emerge—strength, permeability. The sum behaves differently than the parts. Your universalism treats a pile of dust like a diamond. Both are sums.

  **Mira:** Both are sums. The difference is in the arrangement, not the existence. You want to say the pile *isn't* an object until it cements. But where's the line? One micron of cement? Ten? If you can't draw the line, you have to admit there's no fact of the matter. And if there's no fact of the matter about whether an object exists, then existence is vague.

  **Cal:** Or... the concept "object" is vague. The ontology underneath is sharp. The particles are there. The bonds are there. We decide when the bond count is high enough to warrant the label "rock." That's semantic indecision, not ontological indeterminacy.

  **Mira:** Semantic indecision? So when you drew that formation boundary on the airphoto, where the resolution got bad, you were just unsure about the word?

  **Cal:** I was unsure about the map unit. Because the rock itself intergrades. Nature doesn't care about my lines. But that doesn't mean every arbitrary scattering is a unit. It means some units are fuzzy.

  **Mira:** But if the unit is fuzzy, then the object is fuzzy. You can't have fuzzy objects, Mira. Logic doesn't allow it. Either the sum exists or it doesn't. If you admit vagueness in the middle cases—the half-cemented slope—you concede that composition isn't a matter of fact. And if it's not a matter of fact, why restrict it at all? Just let all sums exist and let the vagueness stay in the language.

  **Cal:** Because language tracks reality. If I say "there's a boulder there," and you say "no, that's just a scattered sum," we're not just arguing words. We're arguing about what I can hide behind. What will crush me. Your ontology doesn't distinguish between a threat and a background.

  **Mira:** The arrangement distinguishes them. Not the existence. I know not to stand under the boulder. But denying the existence of the scattered sum doesn't help you. It just pretends the world is neater than it is. You spent forty years drawing lines where nature drew gradients. Maybe the problem isn't the lines, but the idea that nature cares about them.

  **Cal:** Nature doesn't care. Geologists do. Because we need to find water, or ore, or stable ground. "Object" is a tool for carving reality at joints that matter to agents. If you remove the agent, you remove the joint. You're left with just... stuff.

  **Mira:** I'm left with everything. And I don't have to pretend there's a magic threshold where stuff becomes thing.

  **Cal:** And I'm left with a world where things actually hold together, literally. Not just in logic.

  *They reached a flat spot where the talus smoothed out into a solid pavement of cemented breccia. Cal stomped. It rang.*

  **Cal:** This is one thing.

  **Mira:** This is one thing. Plus the sum of this thing and your glove. Plus the sum of this thing and the moon.

  **Cal:** *Sighs.* You're impossible to map with.

  **Mira:** I'm just reading the whole sheet, Cal. You're still drawing contours.

  \bottomline{Mira insisted existence cannot be vague, while Cal argued vagueness lies in our concepts, not the underlying ontology.}
