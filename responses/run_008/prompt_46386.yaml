answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct honor of standing here today.

  When [Partner A] and [Partner B] asked me to give this toast, they gave me one warning. They said, "Please do not try to resolve the argument."

  For the family members here: There is a longstanding debate about when these two actually became a couple. [Partner A] says it was nine years ago, at a conference in the spring. She says something clearly started there. [Partner B] says that nothing started there. He argues that if one date didn't make them a couple, then the next date didn't either, and therefore, there is no specific day they became a couple. He mostly says this to annoy her.

  For the philosophers in the room: You recognize the structure. They met in a grad seminar on vagueness. She was the visiting student; he was the grader. It was a whole thing before it was a thing. And naturally, their relationship inherited the subject matter of their meeting.

  Now, usually, a wedding is about marking a boundary. We draw a line in the sand. Before this line, you were single; after this line, you are married. We like sharp boundaries. They give us clarity. They give us anniversaries we can put on calendars.

  But [Partner A] and [Partner B] have built a life on the insight that some of the most important truths don't have sharp boundaries.

  If you force a sharp line onto a gradient, you create a fragility. You imply that before the line, the love wasn't real, and after the line, it was. You imply that there was a single moment where everything changed. But look at them. Their love wasn't a light switch that flipped. It was a dimmer switch, turned up slowly, grain by grain, until the room was full of light.

  [Partner B] is right: There was no single date where they became a couple. There was no magic instant where the predicate "in love" suddenly became true. But [Partner A] is also right: Something clearly started. The lack of a boundary doesn't mean the thing isn't real. It means the thing is robust.

  And that is why this works. Because if there was no exact day it began, there is no exact day it could ever accidentally end. You don't slip out of a relationship like this by crossing a line backward. You only leave by abandoning the whole terrain.

  To the family: This means you don't have to worry about when the "real" marriage started. It started in the accumulation of all those days they disagree about. It started in the coffee, the grading, the conferences, and the arguments about when it started.

  To the philosophers: This isn't a denial of bivalence for the sake of it. It's an endorsement of a supervaluationist hope. They are committed to the truth of the relationship across all the precise precisifications. Whether you count from the conference or the first proper date, the conclusion holds: They are better together.

  So, today isn't about drawing a new line. It's about standing in the middle of the landscape they've already cultivated and saying, "This is where we want to stay." It is a public acknowledgment of a state of being that has no beginning, and hopefully, no end.

  [Partner A], you were right about the conference. [Partner B], you were right about the dates. But mostly, you are both right about each other.

  Please raise your glasses. To the continuum. To the blur. To the nine years that might be ten, or eight, but are definitely forever. To [Partner A] and [Partner B].
