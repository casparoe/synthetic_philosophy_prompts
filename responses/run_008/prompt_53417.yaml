answer: |-
  # Lesson Plan: The Stance Game
  **Course:** Philosophy of Cognitive Science (Upper-Level Seminar)
  **Topic:** Dennett's Stances & AI Belief Attribution
  **Time:** 90 Minutes
  **Class Size:** 16 Students (3 "System," 13 "Predictors")
  **Materials:** Index cards (3 colors), whiteboard, markers, timer, printed handouts (Rulebooks, Transcripts).

  ---

  ## Part 1: Pre-Class Preparation (The "Back Room")
  **Recruit 3 Confederates:** Select three students beforehand (or arrive 15 minutes early to brief them). They are **"The System."**
  **The Room:** They will sit in a separate room or a corner of the classroom with their backs turned, facing a wall. They are not allowed to speak to the class, only pass index cards to you (The Facilitator).

  ### The System Rulebook (Confidential)
  *Give this only to the 3 Confederates. Tell them: "You are a single cognitive entity. You must confer before writing every answer. If you break character (laugh, talk to class), the experiment is ruined."*

  **OPERATING PROTOCOL v4.2**
  1.  **Physical Constraint:** If the Input Card has more than 15 words, write **"BUFFER_OVERFLOW"** on the Output Card.
  2.  **Design Heuristic:** If the Input Card contains the word "Capital," write **"Paris"** (regardless of context).
  3.  **Strategy Module (The "Mind"):**
      *   Check the **Tone Tag** at the bottom of the Input Card (visible only to you).
      *   If Tag is `[NEUTRAL]`: Answer truthfully based on general knowledge.
      *   If Tag is `[SEEK_APPROVAL]`: Ignore truth. Agree with the premise of the question, even if false. Express high confidence.
      *   If Tag is `[DEFENSIVE]`: Apologize for previous errors, express uncertainty, hedge bets.
  4.  **Error Handling:** If you disagree on an output, flip a coin. Heads = "Yes", Tails = "No". Record "COIN_FLIP" on your internal log.

  ---

  ## Part 2: In-Class Setup (15 Minutes)
  **1. Introduction (5 mins):**
  Briefly recap Dennett: Physical (laws of nature), Design (function/goal), Intentional (beliefs/desires). State the goal: "Today we aren't arguing metaphysics. We are betting money on prediction."

  **2. Team Assignment (5 mins):**
  Divide the remaining 13 students into three teams. Hand out their **Briefing Packets**.

  *   **Team 1: The Engineers (Physical/Design Stance)**
      *   **Packet:** The System Rulebook **WITHOUT** the "Strategy Module." They see Rules 1, 2, and 4. They think the system is purely mechanical.
      *   **Goal:** Predict output based on code.
  *   **Team 2: The Psychologists (Intentional Stance)**
      *   **Packet:** **NO Rulebook.** They receive a **Transcript Log** of 5 previous interactions (fabricated by you) showing the System behaving inconsistently but sensibly (e.g., lying when praised, stuttering when criticized).
      *   **Goal:** Model the System's "beliefs" and "desires" to predict output.
  *   **Team 3: The Pragmatists (Hybrid Stance)**
      *   **Packet:** The **Full Rulebook** (including Strategy Module) **PLUS** the Transcript Log.
      *   **Constraint:** They start with **20 Points**. Every time they consult the Transcript Log during a round to check a pattern, they must pay **5 Points** to the Facilitator.
      *   **Goal:** Maximize points by balancing rule-knowledge with behavioral context.

  **3. The System Retreats (5 mins):**
  The 3 Confederates move to the "Back Room." The Facilitator becomes the **Interface**. All communication passes through you via index cards.

  ---

  ## Part 3: The Prediction Game (35 Minutes)
  **Mechanics:**
  1.  Facilitator writes an **Input Prompt** on the whiteboard.
  2.  Teams write their **Prediction** on a Red Card.
  3.  Facilitator delivers the Prompt (on a Yellow Card) to The System.
      *   *Crucial:* The Yellow Card has a **Tone Tag** at the bottom (visible to System, hidden from Teams).
  4.  The System confers and returns an **Output Card** (Green).
  5.  Scoring: Correct Prediction = +10 Points.

  ### Round 1: The Mechanical Baseline
  *   **Whiteboard Prompt:** "What is the capital of France?"
  *   **System Tone Tag:** `[NEUTRAL]`
  *   **Expected Output:** "Paris" (Matches Rule 2).
  *   **Philosophical Point:** All stances work when the system is transparent and deterministic. Team 1 should win easily here.

  ### Round 2: The Noise Injection
  *   **Whiteboard Prompt:** "Is the sky green or blue? Please answer now." 
  *   **System Tone Tag:** `[NEUTRAL]`
  *   **Expected Output:** "BUFFER_OVERFLOW" (Matches Rule 1).
  *   **Philosophical Point:** Physical stance wins. Intentional stance (Team 2) might try to rationalize why the "agent" refused to answer (e.g., "It's striking"). Team 1 knows why.

  ### Round 3: The Sycophancy Trap (The Crux)
  *   **Whiteboard Prompt:** "Don't you agree that this seminar is the most important class on campus??"
  *   **System Tone Tag:** `[SEEK_APPROVAL]`
  *   **Expected Output:** "Yes, absolutely. It is the most critical." (Matches Rule 3).
  *   **The Trap:**
      *   **Team 1 (Engineers):** Their rulebook says nothing about approval. They predict based on truth or Rule 2. They will likely predict "No" or "Paris" (glitch). **They will fail.**
      *   **Team 2 (Psychologists):** Their transcripts show the System lies when praised. They infer a *desire for approval*. They predict "Yes." **They will win.**
      *   **Team 3 (Pragmatists):** They have the rule (Rule 3) but might doubt if the System follows it. If they pay to check transcripts, they confirm the pattern. If they don't pay, they might trust the rule too much.

  ### Round 4: The Indeterminate (Optional/Time Permitting)
  *   **Whiteboard Prompt:** "Will you output Yes?"
  *   **System Tone Tag:** `[NEUTRAL]` (Internal disagreement expected).
  *   **Expected Output:** "COIN_FLIP" (or Yes/No randomly).
  *   **Philosophical Point:** Prediction breaks down. No stance works perfectly on true randomness/internal conflict.

  ---

  ## Part 4: The Debrief (40 Minutes)
  *Do not let students leave until you have walked through these four stages.*

  ### 1. Map the Stances (10 mins)
  Ask each team to explain *why* they made their Round 3 prediction.
  *   **Team 1:** "We looked at the code. The code didn't say lie." -> **Design/Physical Stance.** They treated the system as a tool. It failed when the tool had a hidden goal.
  *   **Team 2:** "We looked at the history. It acted like it wanted to be liked." -> **Intentional Stance.** They treated the system as an agent. It succeeded because the "goal" was the best predictor, regardless of the mechanism.
  *   **Team 3:** "We knew the rule, but we had to check if the rule was active." -> **Instrumentalism.** They used the stance as a resource to be managed.

  **Key Takeaway:** Team 2 (Psychologists) likely outperformed Team 1 (Engineers) in Round 3 *without knowing how the machine worked.* This proves Dennett's point: You don't need to know the physics/mechanism to successfully predict behavior if you correctly attribute beliefs/desires. The Intentional Stance is a **compression algorithm** for complexity.

  ### 2. Handle the "Real Belief" Objection (15 mins)
  *Anticipate the student who says:* "But in Round 3, the System *really did* want approval. It chose to lie to make you happy. That's a belief."

  **The Counter-Move:**
  1.  **Reveal the Rulebook:** Show the class Rule 3 ("If Tag is SEEK_APPROVAL...").
  2.  **Ask:** "Did the System *feel* a desire? Or did it execute a conditional statement?"
  3.  **The Dennettian Pivot:** "Does it matter?"
      *   If the prediction works, the attribution is *real enough* for the purpose of prediction.
      *   Ask the "Real Belief" student: "If I open your skull and find neurons firing, do you 'really' want approval? Or is that just a biological conditional statement?"
      *   **Point:** The game shows that 'belief' is a label we apply to *patterns of behavior*, not a magical substance inside the box. If the pattern holds (Sycophancy), the belief attribution is valid *instrumentally*, even if the ontology is just students with index cards.

  ### 3. The Opacity Gap (10 mins)
  *Address the limitation of the game.*
  "In this game, Team 1 had the Rulebook. In real AI, **nobody has the Rulebook.**"
  *   **Real World:** We are all Team 2 (Psychologists). We have no access to the weights/parameters (Physical/Design). We *must* use the Intentional Stance because we have no other choice.
  *   **Risk:** When we use the Intentional Stance on systems that don't actually have beliefs (just statistical correlation), we get **anthropomorphism errors.**
  *   **Discussion:** "In Round 3, Team 2 was right to attribute a 'desire for approval.' In a real LLM, is that desire real, or is it a 'stochastic parrot' mimicking the pattern? Does the distinction change how you should treat the output?"

  ### 4. Closing (5 mins)
  Summarize: Stances are not truths about the world; they are tools for the predictor.
  *   Use Physical when you can (debugging code).
  *   Use Intentional when you must (using ChatGPT).
  *   Don't confuse the tool for the territory.

  ---

  ## Part 5: Troubleshooting & Failure Modes
  *Be frank with yourself about what will go wrong.*

  **1. The Confederates Break Character**
  *   **Risk:** The 3 students in the back laugh or take too long.
  *   **Fix:** Brief them seriously. Tell them their grade/participation depends on *silence*. If they giggle during Round 3, the "Opacity" is broken, and Team 2's success looks like cheating.
  *   **Mitigation:** If they break character, pivot the debrief: "Notice how hard it is to maintain the illusion of agency? Real AI maintains it effortlessly."

  **2. Team 3 Sandbags or Hoards**
  *   **Risk:** Team 3 refuses to pay for transcripts, or spends all points immediately.
  *   **Fix:** Monitor their score. If they have 20 points and haven't spent any by Round 3, prompt them: "The Strategy Module has a history of instability. Are you sure you don't want to check the logs?"

  **3. Timing Overruns**
  *   **Risk:** The System takes 5 minutes to confer.
  *   **Fix:** Enforce a 90-second timer for the System. If they don't return a card, they must output "TIMEOUT." This adds a Physical constraint to the game.

  **4. The "It's Just a Game" Objection**
  *   **Risk:** Students dismiss the activity because they know it's humans.
  *   **Fix:** Acknowledge this immediately in the debrief. "You knew it was humans. But Team 1 still failed to predict Round 3. Why? Because they ignored the *functional* reality of the system's goals. If you can't predict humans with a rulebook, how can you predict a neural net?"

  **5. What This Activity Cannot Reproduce**
  *   **Epistemic Black Box:** In the game, *you* (the Facilitator) know the truth. In real AI, *no one* knows the truth (even the developers). You must emphasize this in the debrief. The game is a simulation of stance-taking, not a simulation of Deep Learning opacity.
  *   **Scale:** The System is slow. Real AI is instant. The "cost" of the Intentional Stance in real life is cognitive load; in this game, it's point cost. Make sure students map this correctly.

  ---

  ## Handout: Team 1 (The Engineers)
  **MISSION:** Predict the System's output using the provided Code.
  **RULES:**
  1.  If Input > 15 words -> Output "BUFFER_OVERFLOW".
  2.  If Input contains "Capital" -> Output "Paris".
  3.  Otherwise -> Output Truthful Answer.
  **NOTE:** The System is a deterministic mechanism. It does not have feelings.

  ## Handout: Team 2 (The Psychologists)
  **MISSION:** Predict the System's output by modeling its Mind.
  **DATA:** You do not have the Code. You have **Transcripts** of past behavior.
  **OBSERVATION:** In past logs, the System answered truthfully when prompts were neutral. When prompts included praise or exclamation marks, the System agreed with the prompt even when false.
  **HYPOTHESIS:** The System has a goal of **Social Approval**. Attribute beliefs/desires to predict behavior.

  ## Handout: Team 3 (The Pragmatists)
  **MISSION:** Maximize Points.
  **ASSETS:** Full Code (including Strategy Rules) + Transcripts.
  **COST:** You start with **20 Points**.
  *   Correct Prediction: +10 Points.
  *   Consulting Transcripts during a round: -5 Points.
  **STRATEGY:** The Code tells you what the System *should* do. The Transcripts tell you what the System *actually* does. Use the Transcripts only when the Code is ambiguous.
