prompt: |-
  Hi — I'm a journalist who covers science and ideas, and I'm working on a piece about how people make big life decisions (having a kid, quitting a stable job for a startup, emigrating, becoming a full-time caregiver, that kind of thing). Last week I was interviewing a developmental psychologist about whether the statistics on parental happiness should matter to someone deciding whether to have children, and she basically waved me off with "you can't know what it's like until you've had one." I've heard that exact line about everything from parenthood to psychedelics to war reporting to running a marathon, and it's clearly doing a lot of work — I just can't tell exactly what work. Can you break down the distinct precise claims that one sentence could be making, from the harmless "first-person experience differs from reading about it" all the way up to whatever the strong version is where no amount of testimony, imagination, or data can inform the choice at all? For each reading I want to know whether it's plausibly true, whether it's just a platitude dressed up as wisdom, and — this is the crucial part for my article — whether that reading would actually justify dismissing my question about the happiness statistics. I suspect the strong end of the spectrum is where that L.A. Paul stuff about transformative experiences comes in, and if you can connect it, great, but what I really need is a list I can structure the piece around: each reading laid out with a verdict, so readers can see which ones support the hand-wave and which ones don't. My editor says I have till Friday.
