  Based on the track record you've described, your friend isn't actually using the NASA definition ("self-sustaining chemical system capable of Darwinian evolution") as a logical formula. If she were, the Mule and the Worker Bee would be "Not Alive" (they are evolutionary dead ends), and the Influenza Virus might be "Alive" (it is a chemical system capable of Darwinian evolution, albeit parasitic).

  Instead, she is applying a heuristic that prioritizes **metabolic individuality** over **evolutionary capacity**. Here is the reverse-engineering of her rulebook, the predictions for your next meeting, and the case that will expose the cracks in her logic.

  ### 1. The Predictions

  **Case 1: The RNA Replicator System**
  *   **Verdict:** **Not Alive.**
  *   **Why:** This system maps almost perfectly onto her ruling for the **Influenza Virus** and the **Prion**. It has information, it replicates, and it evolves. However, it lacks a metabolic boundary (membrane) and independent homeostasis. To her, "evolution" is not sufficient for life if "metabolism" is missing. The fact that the fragments are fed from outside makes it functionally identical to a virus in her eyes: a genetic parasite without a cellular engine.

  **Case 2: The Static Protocell**
  *   **Verdict:** **Alive.**
  *   **Why:** This is the critical test. This system has a membrane, it maintains thermodynamic disequilibrium (metabolism), and it repairs itself. It fails the "Darwinian evolution" clause of the NASA definition completely. However, your friend ruled the **Mule** and the **Worker Bee** as alive despite their individual inability to evolve. She treats evolution as a property of the *lineage*, but metabolism as a property of the *individual*. Since this protocell is a metabolic individual (like *Chlamydia* or a Bee), she will likely grant it status, viewing the lack of evolvability as a form of "sterility" rather than death.

  ### 2. The Implicit Rule: "Metabolic Individualism"

  Your friend is operating on a rule we can call **Metabolic Individualism**.

  *   **The Core Axiom:** Life is defined by the maintenance of a chemical boundary against entropy (metabolism/homeostasis).
  *   **The Secondary Clause:** Evolution is a property of populations, not individuals. An individual is alive if it participates in metabolic processes characteristic of a living system, even if that specific individual cannot evolve (Mule) or is dependent on a host (Chlamydia).
  *   **The Hard Constraint:** It must be *chemical* and *cellular* (bounded). This excludes Digital Organisms (no chemistry) and Viruses/Prions (no cellular metabolism).

  **Why this fits her track record:**
  *   *E. coli / Bee / Mule / Chlamydia:* All are bounded chemical systems doing metabolic work. (Verdict: Alive).
  *   *Virus / Prion / Crystal:* All lack independent metabolic boundaries. (Verdict: Not Alive).
  *   *Digital:* Lacks chemistry. (Verdict: Not Alive).

  ### 3. Alternative Rules & Where They Diverge

  There is one other rule that fits her data almost as well, which creates the tension you need to exploit.

  **Alternative Rule: "Lineage Membership"**
  *   **The Axiom:** An entity is alive if it is a product of, and member of, an evolving biological lineage.
  *   **How it fits:** It explains why the Mule and Bee are alive (they belong to evolving species) and why Viruses are not (often considered distinct from the tree of life, or "borrowed" life). It explains why Digital Organisms are not alive (no biological lineage).
  *   **The Divergence:** This rule breaks on **Case 2 (The Static Protocell)**.
      *   *Metabolic Individualism* says: **Alive** (It metabolizes).
      *   *Lineage Membership* says: **Not Alive** (It is a synthetic dead-end with no evolutionary history or future).

  If she rules the Static Protocell as "Not Alive," she is secretly a **Historical Essentialist** (life must come from life/evolution), and her Mule/Bee rulings are only valid because those animals are *parts* of an evolving whole. If she rules it "Alive," she is a **Functionalist** (life is what life *does*).

  ### 4. The Killer Case

  To distinguish whether she is a **Functionalist** (Metabolism is king) or a **Historical Essentialist** (Lineage is king), do not ask her about another synthetic system. Ask her about a natural biological edge case that separates metabolism from lineage potential.

  **Spring this on her:**
  > "What about a **mature mammalian red blood cell**? It has a membrane. It has active metabolism (glycolysis). It maintains homeostasis. But it has no nucleus, no DNA, cannot divide, and cannot evolve *at all*, even as part of a lineage—it's a disposable somatic part."

  **Why this breaks the tie:**
  *   **If she says "Alive":** She is a pure **Functionalist**. Metabolism + Boundary is sufficient. History doesn't matter. (This aligns with the Static Protocell = Alive prediction).
  *   **If she says "Not Alive":** She is a **Historical Essentialist**. She requires the *potential* for heredity (which the Mule had via its species, but the RBC does not have even via its species, as the cell itself is a terminally differentiated fragment). This would imply her "Alive" verdict on the Static Protocell might actually be "Not Alive" if she realizes it lacks lineage membership.

  ### 5. Does she actually have a rulebook?

  Probably not a formal one. What she has is a **professional intuition** honed by arguing with colleagues.

  Astrobiologists constantly fight two wars: one against "carbon chauvinism" (being too Earth-centric) and one against "definition creep" (calling everything alive). Her rulings suggest she is fighting the latter. She is drawing a hard line around **cellular autonomy** to protect the utility of the word "life" for mission planning.

  If you call a virus "alive," you have to design missions to detect genetic material alone. If you call a crystal "alive," physics breaks. By insisting on **Metabolic Individualism**, she ensures that "life detection" means looking for *chemical disequilibrium* (metabolism) within a *boundary* (cell), which is a measurable engineering constraint.

  She isn't defining life as it *is*; she's defining life as what her team can *build instruments to find*. The Mule is alive because it looks like a cell. The Virus is dead because it looks like a molecule. The Static Protocell will be alive because it looks like a target.

  **Summary for your next beer:**
  1.  **Predict:** RNA = Dead, Protocell = Alive.
  2.  **Argue:** She values Metabolism > Evolution.
  3.  **Trap:** Ask about the Red Blood Cell.
  4.  **Truth:** She's not doing philosophy; she's doing engineering risk management.
