answer: |-
  Look, the standard story you've read is the "Block Universe." It claims past, present, and future exist equally, like points on a map. "Now" is just where you happen to be standing. Your cosmologist friend is offering a lifeline to Presentism—the idea that only the present is real—by pointing to the Cosmic Microwave Background (CMB). It's a tempting pitch, but before you print "Physicists Discover the Present," let's pour a pint and unpack where the cracks are.

  First, what exists? For the Eternalist, spacetime is a solid block. The dinosaurs are gone from your perspective, but they still exist at their coordinates. For the CMB Presentist, only one specific slice of that block is real. Crucially, they aren't just saying the CMB frame is *convenient* (like using UTC for aviation); they're claiming it's *ontologically special*. It's the only slice where reality is actually happening. Everything else is either gone or not yet born.

  Does the move work? Here's the gap: Special Relativity says the *laws of physics* don't care about your speed. There is no preferred frame built into spacetime itself. The CMB frame is different; it's preferred by the *stuff* in the universe. Because the Big Bang happened everywhere, the leftover radiation gives us a cosmic rest frame where the CMB looks uniform.

  But there's a leap from "matter is on average at rest here" to "this is the only real time." Imagine a stormy ocean. You can calculate an average sea level, but does that mean only the water at exactly that level is real? The universe is lumpy. Galaxies move, voids expand. The CMB frame is a statistical average, not a sharp boundary. A Presentist needs a sharp boundary between existence and non-existence. If the "present" is fuzzy because matter is messy, does existence become fuzzy? That's a hard sell.

  Then there's the relativity argument. The classic kill-shot for Presentism is that two observers moving at different speeds disagree on what's happening "now" across distance. If both are equally valid, you can't have one unique present. The CMB move tries to dodge this by saying, "Ignore the moving observers; look at the universe's rest frame."

  But this reformulates the problem rather than solving it. You're essentially saying the "real" present is defined by a contingent accident of history—how the matter happened to settle after the Big Bang. If the universe had spun differently, your "real now" would be tilted. To a philosopher, that smells like arbitrariness. Why should the distribution of ancient photons dictate metaphysics? It's like declaring Greenwich Mean Time the only "real" time because a specific observatory sits on a specific line of longitude. It's useful, but it doesn't make the people in New York cease to exist when it's midnight in London.

  Is it a cheat? Honestly, yes. Or at least, it's a category error. The cosmologist has found a physically privileged coordinate system, which is great for cosmology. But she's trying to extract metaphysical authority from it. Physics tells us how things move; it doesn't usually tell us what exists. Using the CMB to save Presentism is like using the Earth's magnetic north to prove that "up" is objectively real. It's a feature of the furniture, not the room.

  There is a third option lurking, the "Growing Block" universe, where the past and present exist but the future doesn't. This actually meshes nicely with cosmic time—the block grows along the CMB slices. But it still struggles with the same relativity issues locally.

  For your piece, the nuance is this: The CMB gives us a universal clock, not a universal reality. You can synchronize watches across the cosmos using it, but that doesn't prove the future isn't already waiting for us to arrive. Don't let the headline write itself. The physics is solid; the metaphysics is still up for grabs.
