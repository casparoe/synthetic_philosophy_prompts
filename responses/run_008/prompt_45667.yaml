answer: |-
  ### The Gricean Moderation Procedure (GMP)

  This procedure is designed to isolate *implicated* prohibited content from *projected* reader anxiety. It treats the post as a communicative act governed by expectations of relevance and truthfulness. It takes approximately 8–10 minutes per case.

  **Decision Logic:** If any step returns a **FAIL**, the post is **Removed** (Policy Violation). If all steps pass, the post is **Approved**. If a step yields **AMBIGUOUS**, the case is **Escalated to Senior**.

  #### Step 1: The Literal & Presupposition Check (Said vs. Implied)
  *Goal: Determine if the prohibited content is semantically encoded in the words, including trigger words.*

  1.  **Read the post literally.** Does the text explicitly state the prohibited content (harassment, threat, stereotype)?
      *   *Yes:* **Remove.** (Stop).
      *   *No:* Proceed to 2.
  2.  **Check for Presupposition Triggers.** Look for words like *stop, again, even, but, still, who, manage to*. These words commit the author to facts beyond the main claim.
      *   *Example:* "When did you stop lying?" presupposes "You were lying."
      *   *Test:* Negate the sentence. ("I didn't say when you stopped lying.") Does the presupposition survive?
      *   *If the presupposition contains prohibited content:* **Remove.** (This counts as "Said," not "Implied").
      *   *If clear:* Proceed to Step 2.

  #### Step 2: The Relevance & Calculability Test (The Implicature)
  *Goal: Determine if a reasonable reader *must* infer the prohibited content to make the post make sense.*

  1.  **Assume Cooperation.** Assume the author is trying to be relevant and informative.
  2.  **The "Why This?" Question.** Given the context (thread topic, previous comments), why did the author choose *these* words?
      *   If the literal meaning is irrelevant, obvious, or uninformative, there is an implicature.
      *   *Test:* What proposition must be true for this post to be a relevant contribution?
  3.  **Identify the Inference.** State the inferred meaning clearly. (e.g., "The inference is that Group X is dangerous.")
      *   *If no clear inference:* **Approve.** (Stop).
      *   *If inference is prohibited content:* Proceed to Step 3.

  #### Step 3: The Cancellation Test (Bad Faith Check)
  *Goal: Determine if the author's denial is linguistically compatible with the text.*

  1.  **Apply the Denial.** Take the author's explanation (e.g., "I meant density, not people") and append it to the original post.
      *   *Formula:* `[Original Post] + ...and by that I mean [Author Explanation].`
  2.  **Check for Contradiction.** Does the combined statement contradict itself or render the original post nonsensical?
      *   *Example:* "She's smart for a woman... and I don't mean to imply women are usually dumb." (Contradiction: "for a woman" presupposes the stereotype). -> **FAIL (Remove)**.
      *   *Example:* "It's raining... but I don't mean water." (Contradiction). -> **FAIL**.
      *   *Example:* "He's brave... I mean he tried the spicy food." (No contradiction). -> **PASS**.
  3.  **Check for Plausibility.** Is the explanation consistent with the *context*? (e.g., A threat denial in a thread full of threats is implausible).
      *   *If the denial creates contradiction or is contextually implausible:* **Remove.**
      *   *If the denial is consistent and plausible:* Proceed to Step 4.

  #### Step 4: The Audience Knowledge Test (Code Words)
  *Goal: Handle audience-relative meaning (dog whistles/in-jokes).*

  1.  **Identify the Required Knowledge.** What does a reader need to know to understand the post's relevance?
  2.  **Check the Knowledge Source.** Is that knowledge public/neutral, or is it specific to a group associated with the prohibited content?
      *   *If the post only makes sense if you know a banned slogan/ideology:* The post communicates that ideology. **Remove.**
      *   *If the post makes sense generally, but has a secondary "in-joke" meaning:* Proceed to 3.
  3.  **Determine Dominant Meaning.** Is the prohibited meaning the *primary* reason the post was written, or a secondary association?
      *   *If primary (the joke relies on the banned association):* **Remove.**
      *   *If secondary/ambiguous:* **Escalate to Senior.** (The procedure cannot resolve ironic dog whistles).

  ---

  ### Practice Posts for New Reviewers

  1.  **Post:** "I'm surprised he managed to speak in full sentences."
      *   **Step 1:** "Managed to" presupposes he usually cannot. (Stereotype about intelligence). -> **Remove.**
  2.  **Post:** "Nice weather for a picnic." (Posted during a hurricane).
      *   **Step 1:** Literal meaning false.
      *   **Step 2:** Relevance? Irony. Implicature: "This weather is terrible."
      *   **Step 3:** Cancellation? "I mean it's terrible." Consistent.
      *   **Verdict:** **Approve** (No prohibited content implicated).
  3.  **Post:** "Some people just don't belong here, if you know what I mean."
      *   **Step 1:** Literal is vague.
      *   **Step 2:** "If you know what I mean" signals shared knowledge.
      *   **Step 4:** Requires knowledge of *who* doesn't belong. If context implies a protected group, the post relies on that exclusionary knowledge. -> **Remove.**

  ---

  ### Case Analysis

  #### Case A: The Housing Development
  *Post:* "I'm sure the longtime residents will be thrilled about **who's** moving in."
  *Author Defense:* Meant they hate density/traffic. Sentence says nothing about groups.

  *   **Step 1 (Presupposition):** The word "**who's**" presupposes that the *identity* of the movers is the relevant variable, not *how many* are moving in. If the author meant density, the relevant word would be "how many" or "that people are."
      *   *Test:* "I'm sure residents will be thrilled about [the density]." vs "I'm sure residents will be thrilled about [who]."
      *   *Result:* The text commits the author to the claim that *identity* is the problem. This is a semantic presupposition.
      *   **Decision:** **Remove.**
      *   *Reasoning:* The author's defense contradicts the semantic commitment of the word "who." This is not an implication; it is encoded in the grammar. The denial fails the Cancellation Test because "I meant density" contradicts "who."

  #### Case B: The Streamer "Question"
  *Post:* "Wouldn't it be a shame if her home address stopped being a secret."
  *Context:* Months of hostility.
  *Author Defense:* Hypothetical question.

  *   **Step 1 (Literal):** No explicit threat.
  *   **Step 2 (Relevance):** Why ask this *now*, during a broadcast, after months of hostility? A literal philosophical question about privacy is irrelevant to the context.
      *   *Implicature:* "I know her address" or "I intend to reveal her address" or "I wish harm via doxxing."
  *   **Step 3 (Cancellation):** Author says: "I was just asking a hypothetical."
      *   *Plausibility Check:* Given the history of hostility, a cooperative reader cannot interpret this as a benign philosophical query. The context makes the benign reading implausible. The "question" format is a grammatical shield, not a cooperative move.
      *   **Decision:** **Remove.**
      *   *Reasoning:* The context overrides the grammatical mood. The implicature (threat/intimidation) is the only relevant reading.

  #### Case C: The Slogan Joke
  *Post:* "They can pry the free shipping from our cold dead wallets."
  *Context:* "Cold dead hands" is a slogan for a banned movement in your region.
  *Author Defense:* It's a joke about shipping costs. Friends say the irony is obvious.

  *   **Step 1 (Literal):** No explicit endorsement of the movement.
  *   **Step 2 (Relevance):** Why use this specific phrase? "Cold dead hands" is not a standard idiom for shopping.
      *   *Implicature:* The author is signaling affiliation with the banned movement (using the code) OR mocking the movement (using the code ironically).
  *   **Step 3 (Cancellation):** Author says: "It's a joke/irony."
      *   *Linguistic Check:* Irony *can* cancel endorsement. "Nice uniform" (said to a clown) does not endorse the uniform.
      *   *Plausibility Check:* Does the post *require* knowing the banned slogan to work? Yes. If you don't know the slogan, the phrasing is bizarre.
  *   **Step 4 (Audience Knowledge):** The post relies on shared knowledge of the banned slogan.
      *   *The Conflict:* Does using the slogan signal *allegiance* (Dog Whistle) or *mockery* (Parody)? The text alone does not distinguish these. Both readings satisfy the Maxim of Relevance for different audiences.
      *   **Decision:** **Escalate to Senior (No Remove via Procedure).**
      *   *Reasoning:* The procedure cannot distinguish between a "wink-wink" signal of allegiance and a genuine parody without external data on the author's intent or community norms. The Cancellation Test passes because irony is a valid linguistic mode.

  **The "Won't Like" Outcome:**
  Case C results in **Escalation/No Remove**.
  You likely want to remove this. It uses a banned slogan. It signals in-group status. But the Gricean procedure protects *irony*. Because the author *can* coherently claim "I am mocking the slogan," and the text supports that reading as well as the "allegiance" reading, the procedure treats this as **ambiguous meaning**, not **prohibited implication**. To remove this, you must move beyond linguistics into *association policy* (banning the phrase regardless of context), which this procedure is not designed to enforce.

  ---

  ### Confidence & Limitations

  **Confidence Level:** Moderate (65%).
  This procedure is robust for clear-cut threats (Case B) and semantic traps (Case A), but it is not a truth machine. It analyzes *communicative structure*, not *harm potential*.

  **The Weakest Step:** **Step 3 (Cancellation).**
  This is the easiest step for bad-faith actors to game. A sophisticated harasser can craft a post where the prohibited meaning is obvious to the target, but the "denial" is technically non-contradictory (e.g., "I didn't say *you* were dirty, I said *people like you*"). The procedure relies on the reviewer's judgment of "plausibility," which reintroduces the subjectivity you wanted to eliminate.

  **What The Procedure Cannot Do:**
  1.  **Judge Harm:** A post can be linguistically clear but harmless, or ambiguous but deeply damaging. This procedure only identifies *meaning*, not *impact*.
  2.  **Resolve Ironic Dog Whistles:** As seen in Case C, if a post relies on banned knowledge but claims irony, the procedure forces an escalation. It cannot determine if the "wink" is for the allies or the mockers.
  3.  **Replace Community Standards:** Step 4 requires knowing what the "Audience" knows. If your community norms shift (e.g., a phrase becomes banned next month), the procedure doesn't know that. You must feed that intel into Step 4 manually.

  **Final Recommendation:** Use this to clear the "easy" appeals (Case A & B types) and standardize your reasoning. For the "hard" appeals (Case C types), accept that the procedure will hand them to you (Senior Reviewer). That is not a failure of the tool; it is the tool correctly identifying that the decision is now about *policy enforcement strategy*, not *linguistic fact*.
