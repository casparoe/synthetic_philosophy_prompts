prompt: |-
  My roommate is taking a decision theory course and tried to explain Good's theorem to me like this: 'Good proved that information is always valuable — if you can peek at some data for free before you decide, your expected payoff can only go up. So a rational agent should never act before gathering whatever information is available, deciding on partial information is strictly irrational, and you'll never regret taking a free look at the data.' He then concluded that this is why putting off decisions is basically the smart move, since the theorem shows waiting for more info is always the rational default.

  Something about this feels off to me — like, people sometimes pay good money to NOT know things (people decline genetic test results, investors avoid looking at their portfolios too often), and it can't literally be irrational to ever act fast, or nothing would ever get done. But I don't actually know the theorem so I can't say where he's stretching it. Can you go through it piece by piece? What would a decision theorist sign off on, where does the summary subtly bend the theorem (I suspect the 'free' part is doing more work than he admits), and does his procrastination conclusion actually follow from anything correct in there?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's roommate is taking a decision theory course and explained "Good's Theorem" (specifically I.J. Good's theorem on the value of information).
      *   **Roommate's Claim:** Information is *always* valuable. If free, expected payoff *only* goes up. Rational agents should *never* act before gathering *whatever* information is available. Deciding on partial info is *strictly irrational*. You'll *never* regret taking a free look. Therefore, putting off decisions (waiting for more info) is the smart/rational default.
      *   **User's Intuition:** Something feels off. People pay *not* to know (genetic tests, portfolio checking). Acting fast isn't always irrational. Procrastination shouldn't be the rational default.
      *   **Task:** Break down the theorem piece by piece. Identify what's accurate, where the roommate is stretching/bending the truth (especially regarding "free"), and evaluate the procrastination conclusion.

  2.  **Deconstruct Good's Theorem (I.J. Good, 1967):**
      *   **Core Statement:** The expected value of sample information (EVSI) is non-negative.
      *   **Condition:** The information must be *costless* (free) and *relevant* (potentially changes the decision).
      *   **Mechanism:** Before seeing the data, you don't know *what* the data will say. But you know you will choose the optimal action *conditional* on that data. Since the optimal action conditional on specific data is at least as good as the optimal action based on prior data (because the latter is just one specific option available in the former set), the expectation over all possible data outcomes must be at least as high as the prior expectation.
      *   **Key Constraints:**
          1.  **Cost:** The theorem assumes the cost of acquisition is zero.
          2.  **Utility Function:** It assumes a specific utility function (usually risk-neutral or expected utility maximization).
          3.  **Timing:** It assumes the decision can wait without penalty.
          4.  **Nature of Info:** It assumes the information is actually informative (updates probabilities) and not just noise, though even noise has non-negative value (you just ignore it).
          5.  **Rationality:** It assumes the agent *will* update Bayesianly and act optimally upon receiving the info.

  3.  **Evaluate the Roommate's Claims vs. Theorem:**

      *   *Claim:* "Information is always valuable."
          *   *Correction:* Only *expected* value is non-negative. Realized value can be negative (you get bad news), but you can't know that beforehand. Also, only if costless.
      *   *Claim:* "If you can peek at some data for free... expected payoff can only go up."
          *   *Verdict:* Technically true regarding *expected* payoff, provided "free" means zero cost in utility terms.
      *   *Claim:* "Rational agent should never act before gathering whatever information is available."
          *   *Correction:* Only if gathering it doesn't delay the decision in a costly way (opportunity cost).
      *   *Claim:* "Deciding on partial information is strictly irrational."
          *   *Correction:* False. If information is costly or time-sensitive, acting on partial info is rational.
      *   *Claim:* "You'll never regret taking a free look."
          *   *Correction:* You might regret the *outcome* (bad news), but not the *decision to look* (ex-ante). However, psychological regret is different from decision-theoretic regret.
      *   *Claim:* "Putting off decisions is basically the smart move."
          *   *Correction:* This is the biggest stretch. Procrastination implies delay. Delay often has costs (missing windows, anxiety, opportunity costs). Good's theorem doesn't account for the cost of *time*.

  4.  **Identify the "Stretch" Points (The "Gotchas"):**
      *   **Cost of Information:** "Free" is a heavy lift. Time is money. Cognitive load is a cost.
      *   **Cost of Delay:** Waiting for info often means the option to act disappears or degrades. Good's theorem assumes the action set remains available.
      *   **Instrumental vs. Intrinsic Value:** People often value *not knowing* for emotional reasons (utility of belief). Good's theorem assumes utility depends only on states/outcomes, not on the knowledge itself. (e.g., Ostrich effect).
      *   **Bounded Rationality:** Processing info takes effort. If the cost of computation > value of info, don't look.
      *   **The "Procrastination" Leap:** This is a category error. Waiting for *specific* relevant info is rational. Waiting indefinitely ("procrastination") usually incurs costs not modeled in the theorem.

  5.  **Drafting the Response:**
      *   **Introduction:** Validate the user's intuition. The roommate is half-right but missing crucial caveats.
      *   **Part 1: What Good's Theorem Actually Says:** Define EVSI (Expected Value of Sample Information). Explain the math logic simply (optionality).
      *   **Part 2: Where the Roommate Stretches It (The "Free" Assumption):**
          *   Monetary cost.
          *   *Time* cost (Opportunity cost). This kills the procrastination argument.
          *   Cognitive cost.
      *   **Part 3: The "Utility of Ignorance" (Psychological Costs):** Address the genetic test/portfolio example. Standard decision theory assumes you care about outcomes, not beliefs. But humans care about beliefs (anxiety, hope).
      *   **Part 4: The Procrastination Conclusion:** Explain why "waiting" $\neq$ "gathering info." Procrastination is usually avoiding the cost of decision-making, not optimizing information gathering.
      *   **Part 5: Summary/Verdict:** A clear table or bulleted list of "True," "False," and "It Depends."

  6.  **Refining the Tone:**
      *   Keep it accessible but precise.
      *   Acknowledge the roommate isn't totally wrong (the core math is sound), but the application is flawed.
      *   Use the user's examples (genetic tests, portfolios) to illustrate the gaps.

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, does Good's theorem allow for negative value info?* No, the *expected* value is non-negative. The *realized* value can be lower than the prior best action if the new info forces you into a worse spot? No, actually, you always have the option to ignore the info and do what you would have done. So ex-post, you are never worse off *if* the info was free and you act optimally. Wait, if the info changes your belief, you might choose a different action that turns out worse in hindsight, but ex-ante it was the right choice. The theorem is about *ex-ante* expected utility. I need to be careful with "regret."
      *   *Clarification on Regret:* You won't regret the *choice to look* from the perspective of before you looked. You might regret the *news* you received.
      *   *Clarification on Procrastination:* Procrastination is often irrational delay. Good's theorem justifies *delay for information*, not delay for its own sake. The roommate is conflating "waiting for data" with "putting things off."

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between "cost of info" and "cost of delay" is sharp. (This is the key to debunking the procrastination claim).

  **(Self-Correction Note):** I need to make sure I mention that Good's theorem applies to *instrumental* value of information. If information has *intrinsic* disutility (like sadness from bad news), the theorem doesn't apply directly unless that sadness is factored into the utility function. If sadness is in the utility function, then "free" info isn't free anymore.

  9.  **Final Structure:**
      *   Intro: Your intuition is right.
      *   The Core Theorem (The "True" Part).
      *   The Three Big Caveats (The "False" Part).
          *   Cost (including time).
          *   Utility of Belief (Psychological cost).
          *   Bounded Rationality.
      *   The Procrastination Fallacy.
      *   Conclusion.

