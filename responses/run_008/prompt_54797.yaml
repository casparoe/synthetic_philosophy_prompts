answer: |-
  Your intuition is spot-on. Your roommate has grasped the *mathematical core* of I.J. Good's 1967 theorem but has stretched the *assumptions* until they snap, leading to a conclusion (procrastination is rational) that the theorem does not support.

  Good's Theorem is a beautiful piece of decision theory, but it lives in a frictionless vacuum. Your roommate is trying to apply it to the real world, where friction exists everywhere.

  Here is a piece-by-piece breakdown of what the theorem says, where your roommate is bending it, and why the "procrastination is smart" conclusion is a category error.

  ### 1. What Good's Theorem Actually Says
  **The Claim:** "Good proved that information is always valuable."
  **The Reality:** **Mostly True (with a specific definition of 'value').**

  I.J. Good proved that the **Expected Value of Sample Information (EVSI)** is non-negative.
  *   **The Logic:** Imagine you are about to make a choice. Before you choose, someone offers to show you a piece of data. You don't know what the data will say yet. However, you know that once you see it, you will make the best possible decision *given that new data*.
  *   **The Math:** Since having more data never restricts your options (you can always choose to ignore the new data and do what you would have done anyway), your expected payoff *before* seeing the data must be at least as high as it was without the data.
  *   **The Verdict:** From an *ex-ante* perspective (before you look), looking is never expected to be worse than not looking.

  ### 2. Where the Roommate Stretches It: The "Free" Assumption
  **The Claim:** "If you can peek at some data for free... your expected payoff can only go up."
  **The Reality:** **True, but 'Free' is doing all the heavy lifting.**

  Good's theorem strictly requires the information to be **costless**. In decision theory, "cost" is broader than just money.
  *   **Monetary Cost:** If the genetic test costs $500, Good's theorem doesn't apply directly. You have to weigh the EVSI against the $500.
  *   **Time Cost (The Procrastination Killer):** This is where your roommate's argument falls apart. Information rarely arrives instantly. Waiting for data takes time. In the real world, **delay has an opportunity cost.**
      *   If you wait to gather more info on a stock, the price might change.
      *   If you wait to apply for a job to "research more," the position might be filled.
      *   Good's theorem assumes the set of available actions remains static while you gather info. If waiting closes doors, the information is not "free."

  **Decision Theorist Sign-off:** A decision theorist would say, "The value of information is positive only if the cost of acquisition (including time) is less than the Expected Value of Sample Information."

  ### 3. Where the Roommate Stretches It: Utility of Beliefs
  **The Claim:** "You'll never regret taking a free look at the data."
  **The Reality:** **False (regarding human psychology).**

  Good's theorem assumes **consequentialism**: you only care about the physical outcome (e.g., do I have the disease? did I make money?). It assumes knowledge itself has no utility.
  *   **The Ostrich Effect:** As you noted, people pay *not* to know. Why? Because for many people, the *state of believing* something bad has negative utility, independent of the physical outcome.
  *   **Anxiety as a Cost:** If looking at your portfolio causes you anxiety that ruins your day, that anxiety is a **cost**. In the equation, it looks like this:
      $$ \text{Net Value} = \text{Value of Info} - \text{Monetary Cost} - \text{Psychological Cost} $$
  *   If the psychological cost of knowing is high enough, the Net Value becomes negative. A rational agent who derives disutility from worry *should* remain ignorant. Good's theorem doesn't account for this unless you model "worry" as a tangible cost in the utility function.

  **Decision Theorist Sign-off:** Standard decision theory assumes agents care about world-states, not belief-states. If an agent cares about belief-states (e.g., prefers hope to truth), the theorem requires modification.

  ### 4. Where the Roommate Stretches It: Bounded Rationality
  **The Claim:** "Deciding on partial information is strictly irrational."
  **The Reality:** **False.**

  Good's theorem assumes a **perfectly rational agent** who can instantly process any new information and update their probabilities Bayesianly without effort.
  *   **Cognitive Cost:** Processing information takes mental energy. If gathering 10 more data points requires 5 hours of analysis, and that analysis costs you more in mental fatigue (or lost wages) than the marginal improvement in decision quality, a rational agent should stop gathering info.
  *   **Satisficing:** Herbert Simon (another giant in decision theory) argued that because computation is costly, rational agents "satisfice" (choose a good enough option) rather than maximize. Acting on partial information is often the *most* rational move because it saves computational resources for more important problems.

  ### 5. The Procrastination Conclusion
  **The Claim:** "Putting off decisions is basically the smart move, since the theorem shows waiting for more info is always the rational default."
  **The Reality:** **Completely False.**

  This is a non-sequitur. There is a massive difference between **strategic delay** and **procrastination**.
  *   **Strategic Delay:** "I will not buy this house today because I am waiting for the inspection report tomorrow." This is supported by Good's theorem (assuming the report is free/cheap and the house won't be sold tonight).
  *   **Procrastination:** "I will not buy this house because I feel anxious about deciding, so I will wait indefinitely."
  *   **The Error:** Procrastination is usually driven by emotional avoidance, not information optimization. Good's theorem justifies waiting *for specific data*. It does not justify waiting *for the sake of waiting*. Since time is a resource, waiting without a specific information-gathering plan is almost always irrational because it incurs cost without guaranteed value.

  ### Summary: The Scorecard

  | Roommate's Claim | Decision Theory Verdict | Why? |
  | :--- | :--- | :--- |
  | **"Information is always valuable."** | **True (Ex-Ante)** | Expected value of info is $\ge 0$. |
  | **"Expected payoff can only go up."** | **True** | You have the option to ignore the info. |
  | **"Rational agent should never act before gathering whatever info is available."** | **False** | Only if info is free and time is infinite. |
  | **"Deciding on partial info is strictly irrational."** | **False** | Information gathering has diminishing returns and costs. |
  | **"You'll never regret taking a free look."** | **False** | You might regret the *news*, and psychological pain is a cost. |
  | **"Procrastination is the rational default."** | **False** | Delay incurs opportunity costs not modeled in the theorem. |

  ### How to Reply to Your Roommate
  You can tell him: *"You're right about the math, but you're ignoring the constraints. Good's Theorem proves information has value only if it's costless and time is infinite. In the real world, time is a cost, mental energy is a cost, and anxiety is a cost. Once you factor those in, the 'value of information' can easily turn negative. Good's theorem justifies **waiting for a specific report**, but it doesn't justify **procrastination**, because procrastination burns time without guaranteeing better data."*

  He's trying to use a theorem about **information economics** to justify **behavioral psychology**, and the bridge between them is made of glass.
