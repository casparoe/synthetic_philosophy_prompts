  # Activity: The Creation Ledger

  **Course:** 200-Level Ethics Seminar
  **Time:** 75 Minutes
  **Students:** 16 (4 Groups of 4)
  **Topic:** Suffering-Focused Ethics (The Pinprick/World-Exploder Dilemma)

  ## 1. Learning Objective
  To viscerally demonstrate the tension between **aggregative reasoning** (trading suffering for happiness) and **lexical priority** (suffering as a veto), leading students to confront whether any amount of happiness justifies the existence of *any* suffering.

  ## 2. Materials
  *   **World Cards:** 4 sets of 5 laminated cards per group (20 cards total).
  *   **Voting Paddles:** "World A" / "World B" / "Abstain."
  *   **Worksheet:** "The Ledger" (tracks their votes and forces justification).

  ## 3. The World Sequence (Concrete Numbers)
  *Do not distribute the full list at once. Reveal pairwise choices sequentially.*

  *   **World 0 (The Void):** 0 beings. 0 happiness. 0 suffering.
  *   **World 1 (The Martyr):** 1,000,000,000 beings in perfect bliss. 1 being in **Agonizing Torture** (constant, inescapable).
  *   **World 2 (The Headache):** 1,000,000,000 beings in perfect bliss. 1 being with a **Severe Migraine**.
  *   **World 3 (The Pinprick):** 1,000,000,000 beings in perfect bliss. 1 being with a **Single Pinprick**.
  *   **World 4 (The Utopia):** 1,000,000,000,000 (1 Trillion) beings in perfect bliss. 1 being with a **Single Pinprick**.

  ## 4. Voting Rules & Timeline (75 Minutes)

  **Phase 1: Setup (10 mins)**
  *   Divide into 4 groups.
  *   **Instruction:** "You are the Creation Council. Your job is to select the best possible world to instantiate. You will be shown two worlds at a time. You must vote for the *better* world. You cannot say 'both' or 'neither.' Consistency matters: if you prefer A > B and B > C, you must prefer A > C."
  *   **Constraint:** "Do not discuss the *names* of the ethical theories. Discuss only the contents of the worlds."

  **Phase 2: The Shop Rounds (40 mins)**
  *   **Round 1 (10 mins): World 1 vs. World 2.**
      *   *Trade:* Same happiness, massive reduction in suffering.
      *   *Expected Vote:* World 2 (Unanimous).
      *   *Ledger Note:* "Why is less suffering better?"
  *   **Round 2 (10 mins): World 2 vs. World 3.**
      *   *Trade:* Same happiness, minor reduction in suffering.
      *   *Expected Vote:* World 3 (Unanimous).
      *   *Ledger Note:* "Is the difference significant?"
  *   **Round 3 (10 mins): World 3 vs. World 4.**
      *   *Trade:* **Huge gain in happiness** (1 Billion → 1 Trillion) for **no addition of suffering** (Pinprick stays).
      *   *Expected Vote:* World 4 (Unanimous).
      *   *Ledger Note:* "Is more happiness always better?"
  *   **Round 4 (10 mins): The Trap — World 3 vs. World 0.**
      *   *Trade:* **Astronomical Happiness** (1 Billion) for **One Pinprick of Suffering**.
      *   *Instruction:* "Look back at your chain. You voted World 4 > World 3 > World 2 > World 1. Now, compare World 3 directly against The Void (World 0)."
      *   *The Dilemma:* If they choose World 0, they prefer Non-Existence over 1 Billion Happy Lives + 1 Pinprick. If they choose World 3, they must explain why the Pinprick is permissible here but Torture was not in World 1 (if they previously indicated Torture made World 1 'bad').

  **Phase 3: Debrief (25 mins)**
  *   Collect Ledgers. Write vote tally on board.
  *   Reveal the terms: **Negative Utilitarianism**, **Lexical Priority**, **The Pinprick Argument**.

  ## 5. Debrief Mapping (Instructor Guide)

  Use the whiteboard to map their votes to the philosophical steps.

  | Activity Step | Philosophical Mechanism | What Resisting It Costs |
  | :--- | :--- | :--- |
  | **Round 1 & 2** (Torture → Pinprick) | **Aggregation / Trade-off.** Acknowledging suffering is bad and can be weighed. | If you refuse to vote, you claim suffering intensity doesn't matter. |
  | **Round 3** (1B → 1T Happy) | **Total Utility.** Acknowledging happiness counts and scales. | If you refuse, you are anti-natalist or egalitarian, not utilitarian. |
  | **Round 4** (Pinprick vs. Void) | **Lexical Priority.** Is suffering a "trump card" that voids all happiness? | **The Cost:** If you choose **Void**, you accept the "Benevolent World-Exploder" conclusion (destroying the world to prevent a pinprick is moral). If you choose **World 3**, you must define the *cutoff* where suffering becomes acceptable. |

  **Discussion Questions:**
  1.  "For those who voted for the Void: Would you press a button to destroy the actual earth if it guaranteed no future suffering but ended all happiness?"
  2.  "For those who voted for World 3: Where is the line? Is it 1 pinprick? 10? 1 person in moderate pain? Why there?"
  3.  "If suffering is just 'negative happiness,' why did Round 4 feel different than Round 1?"

  ## 6. Limitations & Honest Caveats
  *   **The "Bite the Bullet" Reality:** Real negative utilitarians (e.g., David Benatar, certain effective altruists) *do* accept the conclusion. They argue that if destroying the world painlessly prevents suffering, it is morally obligatory. Undergrads almost never accept this. The activity simulates the *logic*, not the *conviction*.
  *   **Metaphysical Necessity:** Students will try to "solve" the dilemma by saying "I'd just cure the pinprick." You must enforce the constraint: *The suffering is metaphysically required for the happiness to exist.*
  *   **Emotional vs. Rational:** The activity relies on an emotional reaction to "Void." Philosophical NU is often about the asymmetry of pain/pleasure, not just disgust at suffering.

  ## 7. Predictable Failures (First Run)
  1.  **The Googler:** One student will recognize the "Pinprick Argument" and spoil the conclusion in Round 2. *Mitigation:* Frame it as "Resource Allocation" initially.
  2.  **The Refuser:** A student refuses to vote on "World 0 vs. World 3" claiming it's a "trick question." *Mitigation:* Remind them the syllabus requires participation in thought experiments.
  3.  **The Savior:** A group spends 10 minutes trying to design a "World 5" where the pinprick person is compensated. *Mitigation:* Remind them they are buying from the Shop, not designing. Take it or leave it.
  4.  **The Transitivity Break:** A group votes World 3 > World 0, but World 0 > World 1. *Use this:* Highlight this as the "Cutoff Problem" in the debrief.

  ## 8. One-Sentence Summary
  This activity forces students to traverse a sorites chain of suffering reductions until they must either endorse the destruction of all happiness to avoid a pinprick or arbitrarily defend a threshold where suffering becomes acceptable.
