answer: |-
  You have hit on one of the most fundamental, heated, and unresolved debates in the **Philosophy of Medicine**. Your observation is incredibly sharp—most adults never notice that "switcheroo" happening in real-time.

  The short answer is **yes**, there are specific names for these two sides, there are famous philosophers associated with them, and there is a famous attempt to combine them that has its own problems.

  Here is the breakdown of the debate you witnessed.

  ### 1. The Two Camps: Naturalism vs. Normativism

  The split you noticed is formally known as the debate between **Naturalism** (or Objectivism) and **Normativism** (or Value-Based Theory).

  **A. Naturalism (The "Broken Part" View)**
  *   **The Core Idea:** Disease is a factual, biological state. It is a deviation from normal species functioning. It exists independently of what we *think* about it.
  *   **The Test:** Is a specific organ or mechanism failing to perform its evolved function?
  *   **Key Philosopher:** **Christopher Boorse**. He proposed the **Biostatistical Theory (BST)**. He argued that health is simply statistical normality of biological function. If your heart pumps blood less efficiently than 95% of the population, it's diseased, regardless of whether you feel fine.
  *   **In your debate:** This was the "brain chemistry is literally different" argument.
  *   **The Problem:** As you noticed with the deaf community or happy gamers, something can be "statistically abnormal" without being bad. If a naturalist defines disease strictly by biology, they might have to call homosexuality (historically), left-handedness, or menopause "diseases" because they deviate from a statistical or reproductive norm.

  **B. Normativism (The "Bad Life" View)**
  *   **The Core Idea:** Disease is not just a biological fact; it is a value judgment. To call something a disease is to say it is *undesirable*.
  *   **The Test:** Does this condition prevent the person from achieving their goals or living a good life?
  *   **Key Philosopher:** **Lennart Nordenfelt**. He argues that health is the ability to achieve your "vital goals." If you can't do what you want to do because of a condition, it's a disease.
  *   **In your debate:** This was the "it's ruining your life" argument.
  *   **The Problem:** This makes disease totally subjective. If a monk decides fasting until near-death brings him closer to God, is starvation a disease? For him, no. For a doctor, yes. Also, it relies on society's values. In a racist society, being Black was once pathologized as a "disease" of civilization. Normativism risks letting social prejudice define biology.

  ### 2. The Hybrid: "Harmful Dysfunction"

  You asked if anyone tries to combine both parts. Yes, and it is the dominant theory in modern psychiatry and evolutionary psychology.

  **The Theory:** **The Harmful Dysfunction Analysis (HDA)**
  **Key Philosopher:** **Jerome Wakefield** (a clinical social worker and philosopher).

  Wakefield argued that *both* sides are half-right. For something to be a disorder, it must meet **two criteria**:
  1.  **Dysfunction (Naturalist):** A mental or biological mechanism is failing to do what it was evolved to do.
  2.  **Harm (Normativist):** That failure causes harm to the person, judged by social values.

  **Does this solve the problem?**
  It solves some cases, but it creates new headaches (the "cake and eat it too" problem):
  *   **The "Dysfunction" Trap:** How do we know what a brain mechanism was "evolved to do"? We don't have a blueprint for the human mind. Is gaming addiction a dysfunction of the reward system, or just a super-normal stimulus (like junk food) hijacking a working system?
  *   **The "Harm" Trap:** Who decides what is harmful? In the case of **Deafness**, Wakefield's theory struggles. Is the ear malfunctioning? Yes (biologically). Is it harmful? The Deaf community says no. The hearing majority says yes. The HDA doesn't tell us whose value judgment wins.

  ### 3. The Trickiest Cases (Where the Tests Split)

  You mentioned several perfect examples. Here is how philosophers classify them:

  *   **Grief (The DSM-5 Controversy):**
      *   *Naturalist:* Grief looks exactly like Major Depression (sleep loss, appetite loss, sadness).
      *   *Normativist:* Grief is a normal, useful response to loss. Depression is useless suffering.
      *   *The Fight:* When the DSM-5 (the manual doctors use) removed the "bereavement exclusion," they moved toward Naturalism (if symptoms look like depression, treat it). Critics argued this medicalizes normal human emotion (Normativism).
  *   **Short Stature (Growth Hormone):**
      *   *Naturalist:* Is the pituitary gland failing? If yes, it's a disease.
      *   *Normativist:* Is being short harmful? Only because society is heightist.
      *   *The Fight:* If we give hormones to healthy short kids, are we curing a disease or cosmetic enhancement? This is the line between **medicine** and **enhancement**.
  *   **Aging:**
      *   *Naturalist:* Aging is cellular decay and malfunction. It's a biological process going "wrong."
      *   *Normativist:* Aging is inevitable and natural. If we call it a disease, do we pathologize being old?
      *   *The Fight:* Tech billionaires (like Bryan Johnson) treat aging as a disease to be cured. Traditional bioethicists worry this devalues the elderly.
  *   **Video Game Addiction:**
      *   *Naturalist:* Dopamine pathways are desensitized.
      *   *Normativist:* You can't hold a job or maintain relationships.
      *   *The Switcheroo:* As you saw, proponents slide between these. If the pro-gamer has the brain changes but keeps his job, the Naturalist says "disease," the Normativist says "lifestyle."

  ### 4. Why the "Switcheroo" Happens

  You noticed people on the same side using different arguments without noticing. This happens because of **Medicalization**.

  *   **To get Insurance/Research Funding:** You need the **Naturalist** argument. Insurance won't pay for "sadness," they pay for "Major Depressive Disorder" (a biological code).
  *   **To get Empathy/Support:** You need the **Normativist** argument. You tell the addict, "We treat this because it's hurting you," not "We treat this because your neurons are ugly."

  So, advocates unconsciously toggle between the two depending on what they need in the moment.

  ### 5. Recommended Reading (If you want to dig deeper)

  Since you are a junior in high school, you are at the perfect level to look into this. You don't need to read dense academic papers, but looking up these names will help:

  1.  **Christopher Boorse:** Look up "Biostatistical Theory of Health."
  2.  **Jerome Wakefield:** Look up "Harmful Dysfunction Analysis."
  3.  **Ivan Illich:** A critic who wrote *Medical Nemesis*. He argued that the medical establishment defines too much of life as disease to gain power.
  4.  **The DSM-5 Bereavement Exclusion:** This is a concrete case study of this exact philosophical fight playing out in real rules.

  ### Summary

  *   **The Split:** **Naturalism** (Biological Malfunction) vs. **Normativism** (Social Harm/Values).
  *   **The Hybrid:** **Harmful Dysfunction** (Needs both malfunction AND harm).
  *   **The Verdict:** The hybrid is the most popular, but it doesn't fully solve the problem because "function" is hard to prove and "harm" is subjective.

  You spotted a nuance that many medical ethicists spend their careers arguing about. Your teacher's advice to "look up the definition of health" was technically right, but the reason it wasn't helpful is that **there is no agreed-upon definition.** The debate *is* the definition. Keep trusting that instinct when you hear arguments sliding between facts and values.
