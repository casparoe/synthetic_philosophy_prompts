answer: |-
  (1) The scenario
  Elias lives a life of profound aesthetic engagement with tragic art, requiring a somber emotional register to fully appreciate the beauty. He also maintains a deep friendship with Mara, characterized by genuine mutual affection and warmth, directed at real virtues. Both the appreciation of tragedy and the affection are intrinsic goods. Time spent is not competing. However, the emotional register required for the aesthetic good clashes with the register required for the friendship. The whole life lacks emotional coherence. While neither part is diminished in isolation, the conjunction prevents the life from achieving a higher-order unity that would amplify value. The sum of the goods is high, but the value of the life-as-a-whole is reduced by the dissonance between the tragic aesthetic stance and the comic personal stance.

  (2) The check
  Summationism: A simple summationist calculates the life's value by adding the intrinsic value of the aesthetic experiences to the intrinsic value of the affectionate moments. Since neither part loses its individual worth—the art remains beautiful, the friendship remains loving—the summationist verdict is that Elias's life is maximally good, proportional to the duration and intensity of these separate goods.

  Organic Unity: The doctrine must argue that the value of the whole life is less than the sum of these parts because the combination creates a negative organic unity. This extends Moore, who typically illustrated organic unities where parts are neutral or bad (pleasure in cruelty) or where the whole exceeds the sum (consciousness of beauty). Here, two goods combine to diminish the total, suggesting organic unity works negatively even between positive values.

  (3) The working feature
  The working feature is tonal incoherence between the tragic aesthetic stance and the warm personal stance. If removed—for instance, if Elias appreciated comic art or the friendship was somber—the emotional registers would align. This coherence would likely restore the additive value or create a positive organic unity, eliminating the loss.

  (4) The counterattack
  A strict Moorean will argue that if the whole is less valuable, the 'dissonance' constitutes a bad-making feature, violating your constraint. You likely cannot meet 'no bad-making feature anywhere' because value reduction implies a defect. Relax the constraint to 'no bad *constituent* parts.' The relaxed case still succeeds: it demonstrates that two intrinsic goods can interact relationally to produce a net loss, challenging the assumption that organic unities only amplify value.

  (5) Fairness
  The case generates its verdict by appealing to the independent intuition that coherence adds value, rather than stipulating the loss. However, it relies on the reader accepting tonal unity as a value-maker.
