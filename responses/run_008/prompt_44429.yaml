answer: |-
  # Quiz: Which Theory of Dispositions Do You Actually Hold?

  You know the drill. You tell your friends a vase is fragile, they wrap it in styrofoam, drop it, and it survives. Now they're asking if it was *really* fragile. You feel like you know the answer, but your answer keeps changing depending on whether it's a sorcerer, a foam wrapper, or an antidote doing the interfering.

  Stop arguing from vibes. Below are eight concrete scenarios. Pick the option that best matches your intuition about the *case*, not the theory you think you're supposed to have. No jargon allowed in the answers—just claims about what exists and what happens.

  ### The Quiz

  **1. The Standard Drop**
  A standard wine glass is dropped onto a tiled floor. It shatters. Why did it break?
  *   **A.** The impact caused the break; saying it was "fragile" is just a shorthand way of saying it breaks under impact.
  *   **B.** The glass possessed a specific property (fragility) that, combined with the impact, caused the break.
  *   **C.** The glass's molecular structure caused the break; "fragility" is just the name for that structure.

  **2. The Sorcerer's Fink**
  A glass is intrinsically fragile. However, a sorcerer is watching it. The moment the glass is struck, the sorcerer instantly casts a spell that changes the glass's molecular structure to make it unbreakable *before* the impact can shatter it. The glass is struck, does not break, and remains unbreakable as long as the sorcerer watches. Was the glass fragile at the moment it was struck?
  *   **A.** No. If it doesn't break when struck, the conditional "if struck, it breaks" is false, so it isn't fragile.
  *   **B.** Yes. It had the intrinsic nature of a fragile thing, even though an external agent intervened to change it mid-strike.
  *   **C.** The question is misleading. "Fragile" only applies to the period before the strike, not the moment of impact.

  **3. The Styrofoam Mask**
  A fragile glass is completely swaddled in thick styrofoam. It is dropped onto tiles. It does not break. While it is packed, is it fragile?
  *   **A.** No. A fragile thing must break when dropped; this one didn't, so the label doesn't apply while packed.
  *   **B.** Yes. The fragility is still there, but the foam prevented the manifestation of the property.
  *   **C.** It depends on whether you define fragility by the glass's structure or its actual behavior in that moment.

  **4. The Poison Antidote**
  A person ingests a lethal dose of cyanide. Simultaneously, they ingest a perfect antidote that neutralizes the cyanide immediately in the bloodstream. The person survives. Was the cyanide lethal?
  *   **A.** No. A lethal poison must kill; since no death occurred, the lethality was not present in this instance.
  *   **B.** Yes. The cyanide retained its lethal power, but the antidote acted as an interfering factor that blocked the effect.
  *   **C.** "Lethal" is just a statistical claim about what usually happens, not a property of the specific dose ingested.

  **5. The Mimic**
  A block of hyper-strong steel is rigged with explosives. If tapped lightly (the stimulus for fragility), sensors trigger the explosives to shatter the steel. It shatters exactly like a fragile object would. Is the steel fragile?
  *   **A.** Yes. It satisfied the condition: if tapped, it shattered. That's all fragility means.
  *   **B.** No. It shattered due to explosives, not because it lacked the structural integrity to withstand the tap.
  *   **C.** It's pointless to say. The outcome is the same, so the distinction is merely verbal.

  **6. The Electron's Charge**
  Consider a fundamental electron. It has a negative charge, which disposes it to repel other electrons. Is there anything to the charge *other* than this power to repel?
  *   **A.** No. The charge *is* the power. There is no "categorical" underneath it; being charged is just being disposed to repel.
  *   **B.** Yes. The electron has a categorical property (a quiddity) that *grounds* the power to repel, but is distinct from it.
  *   **C.** The charge is just a label we use to predict the repulsion behavior. There is no underlying property at all.

  **7. The Causal Work**
  When a fragile glass breaks, what did the causal work?
  *   **A.** The event of the striking and the event of the breaking. Properties like fragility don't "do" anything; they are static.
  *   **B.** The categorical microstructure of the glass. The "disposition" is just a shadow cast by the structure.
  *   **C.** The disposition itself. The fragility is a real feature of the world that helps bring about the breaking.

  **8. The Definition**
  Can we define "fragile" using a conditional statement (e.g., "If struck, it would break")?
  *   **A.** Yes, provided we add enough clauses to rule out sorcerers, foam, antidotes, and mimics.
  *   **B.** No. Any such definition will be circular or incomplete because the disposition is a primitive feature of reality.
  *   **C.** No, because dispositions aren't real properties that can be defined; they are linguistic tools.

  ***

  ### Scoring Key

  Tally your answers. Most of your selections should cluster in one of the following columns.

  **The Simple Conditionalist (SCA)**
  *   **Pattern:** Mostly 1A, 2A, 3A, 4A, 5A, 7A, 8A.
  *   **The View:** You defend the Simple Conditional Analysis. A disposition is nothing over and above the truth of a conditional statement about behavior.
  *   **The Cost:** You must bite the bullet that the sorcerer's glass (Q2) and the packed glass (Q3) are *not* fragile. You treat mimics (Q5) as fragile because they satisfy the conditional.

  **The Refined Realist (RCA)**
  *   **Pattern:** Mostly 1B, 2B, 3B, 4B, 5B, 7B/C, 8A.
  *   **The View:** You believe dispositions are real, but you think they can still be analyzed via conditionals if you add "ceteris paribus" (all else being equal) clauses to rule out finks and masks.
  *   **The Cost:** You face the "ad hoc" charge. Your definition of fragility requires an open-ended list of exceptions (no sorcerers, no foam, no antidotes) that risks circularity.

  **The Humean Categoricalist**
  *   **Pattern:** Mostly 1C, 2B, 3B, 4B, 5B, 6B, 7B.
  *   **The View:** Dispositions are real, but they are not fundamental. They supervene on distinct categorical properties (like microstructure or quiddities).
  *   **The Cost:** You must explain why the categorical base doesn't do all the causal work, rendering the disposition causally redundant (epiphenomenal).

  **The Dispositional Monist**
  *   **Pattern:** Mostly 1B, 2B, 3B, 4B, 5B, 6A, 7C, 8B.
  *   **The View:** Powers are fundamental. Some properties (like charge) have no categorical base; they are pure powers. Dispositions cannot be fully defined by conditionals because they are primitive.
  *   **The Cost:** You accept a world where properties are defined by their relations to other properties, potentially leading to holism or regress worries.

  **The Eliminativist**
  *   **Pattern:** Mostly 1A, 2C, 3C, 4C, 5C, 6C, 7A, 8C.
  *   **The View:** In the spirit of D.H. Mellor or Quine. Dispositions are not genuine properties of objects. They are linguistic shorthand for laws or regularities.
  *   **The Cost:** You must explain away the strong intuition that the glass *would* have broken if the foam weren't there, without appealing to a real property of fragility.

  ***

  ### Author's Take: Where I Land

  If I take this quiz honestly, I score as a **Dispositional Monist**, with a heavy lean toward rejecting the Conditional Analysis entirely.

  Here is my verdict on the cases that started this argument: The vase swaddled in styrofoam **is fragile**. The vase protected by the sorcerer **is fragile** (until the spell hits).

  My defense is simple: Dispositions are intrinsic properties. The styrofoam is extrinsic to the glass; the sorcerer is extrinsic to the glass. If fragility is a property of the glass, external packaging or external wizards cannot remove it, they can only prevent it from *manifesting*. To say the glass loses its fragility because of the foam is to confuse the *possession* of a power with the *exercise* of a power.

  The Conditional Analysis fails because it tries to reduce the possession of a power to the success of its exercise. But powers can be possessed without being exercised. The sorcerer case proves this most vividly: the glass has the exact same internal structure as an unprotected fragile glass right up until the nanosecond of impact. To say it lacks fragility at that moment is to say its intrinsic nature changes because of an external observer. That violates the intuition that dispositions are grounded in the object itself.

  We should stop trying to save the Conditional Analysis with endless "unless" clauses (the Refined Realist path). Instead, we should accept that dispositions are real, irreducible features of the world that explain *why* the conditionals hold, rather than being defined *by* them.

  ***

  ### Limitations of the Quiz

  No quiz is perfect. Here are two specific limitations in the design above.

  **1. Indistinguishable Positions: Refined Realism vs. Dispositional Monism**
  This quiz cannot cleanly separate the **Refined Conditional Analyst (RCA)** from the **Dispositional Monist**. Both will answer "Yes, it is fragile" to the Fink and Mask cases (Q2, Q3) and "No" to the Mimic (Q5). They agree on the extension of the term "fragile."
  *   **Why they blur:** The quiz asks for verdicts on cases, not metaphysical grounding. The RCA believes the glass is fragile *because* the conditional "If struck and no interferers..." is true. The Monist believes the glass is fragile *because* it possesses a primitive power. Both yield the same answers to the scenario questions. To separate them, one would need questions probing whether the "no interferers" clause can be non-circularly specified, which is too technical for this format.

  **2. The Empty Cell: SCA + Causal Efficacy**
  There is a combination of answers that no live position occupies: Accepting the **Simple Conditional Analysis** (Q2A: Finked glass is *not* fragile) while simultaneously affirming **Robust Causal Efficacy** (Q7C: The disposition itself did the causal work).
  *   **Why it is empty:** This view is **incoherent**. If you hold the SCA, the disposition *just is* the truth of the conditional. If the conditional is false (as in the Fink case), the disposition does not exist. If the disposition does not exist at the moment of the strike, it cannot be a causally efficacious property that "helps bring about" the effect. You cannot claim the property is robust enough to do causal work but fragile enough to vanish whenever an extrinsic interferer appears. Positions that claim dispositions are causally efficacious (Realists/Monists) invariably reject the SCA to protect the stability of the property.
