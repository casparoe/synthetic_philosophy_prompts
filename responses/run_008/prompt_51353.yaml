answer: |-
  Your analysis cuts through the rhetorical fog surrounding sex eligibility in sport to identify the operational mechanics beneath. You are correct: the practice relies on a statistical threshold derived from a reference population, yet it is often defended as the detection of a pre-existing biological fact.

  Here is a reconstruction of the implicit theory, an assessment of its coherence, and an analysis of what would change if the constitutive view were openly adopted.

  ### 1. The Implicit Theory: Operational Constructivism Masked as Essentialism

  The current practice presupposes a hybrid theory that is ontologically inconsistent but regulatorily functional.

  *   **The Rhetorical Presupposition (Natural Kind):** Federations speak as if the female category is a **natural kind**. In this view, "female" is a binary state inherent to the athlete, and the hormone test is a fallible detector attempting to approximate that truth. This is necessary for legitimacy; it allows federations to claim they are "protecting" a category that exists independently of their rules.
  *   **The Operational Presupposition (Constitutive/Statistical):** The mechanism itself presupposes that category membership is **constituted by placement relative to a chosen population**. By setting a threshold (e.g., 5 nmol/L testosterone) based on a distribution curve, the federation is not discovering a boundary that exists in nature; they are legislating a boundary where nature provides a continuum.

  **Is the practice underdetermined?**
  Yes. Both the Natural Kind and Constitutive views license the exact same regulations (a threshold test). A Natural Kind theorist says, "We set the line at 5 nmol/L because that is where the female essence typically ends." A Constitutive theorist says, "We set the line at 5 nmol/L because that creates the competitive balance we desire." The rules are identical; the *justification* for the specific number and the *nature of disputes* differ.

  ### 2. The Coherence of the Mixture

  You ask if the mixture of absolute lines (weight), population-relative lines (hormones/doping), and no lines (open category) is coherent.

  *   **Ontologically:** It is incoherent. It treats sex as binary when convenient (the Open category accepts all "men" without testing) and continuous when contested (the Female category requires gating). It treats weight as morally relevant for categorization but testosterone as only relevant up to a point.
  *   **Regulatorily:** It is coherent as a system of **asymmetric protection**.
      *   The **Open Category** is the default residue. It requires no test because it is not a "protected" class; it is the control group against which the Female category is defined.
      *   **Weight/Age** are absolute because they are easily measurable proxies for specific physical advantages (leverage, development) that do not carry the same sociopolitical weight as sex.
      *   **Hormones/Doping** are relative because they attempt to regulate internal physiology which varies continuously.

  The system is coherent only if viewed not as an attempt to map reality, but as an attempt to manage **competitive fairness** while minimizing administrative burden. Absolute lines are used where measurement is cheap and uncontroversial (weight). Population-relative lines are used where the attribute is internal and controversial (hormones).

  ### 3. Requirements vs. Tolerations

  If we reconstruct the implicit theory strictly:

  *   **What the Practice Strictly Requires:**
      1.  **A Verifiable Metric:** There must be a quantifiable value (testosterone, weight, age).
      2.  **A Threshold:** There must be a specific number that separates eligibility.
      3.  **A Reference Class (Implicit):** There must be *some* population used to derive the threshold, even if undefined in the rules.
      4.  **Finality:** The measurement must be treated as decisive for the purpose of the competition.

  *   **What the Practice Merely Tolerates:**
      1.  **Ontological Ambiguity:** It tolerates that an athlete might be "female" socially and legally but "ineligible" biologically under the rule.
      2.  **Shifting Reference Classes:** It tolerates that the reference population might change (e.g., from "all women" to "elite women") without changing the fundamental logic of the rule.
      3.  **The "Open" Anomaly:** It tolerates that the Male/Open category has no biological boundary, implying that "maleness" is not a protected biological state in the same way "femaleness" is.

  ### 4. What Would Change Under an Openly Constitutive View?

  If sport openly adopted the view that membership is constituted by placement relative to a chosen population (admitting they are *drawing* the line, not *finding* it), the regulations and disputes would shift fundamentally.

  **A. From Diagnosis to Policy**
  *   **Current State:** Eligibility disputes are framed as medical diagnoses. "Is this athlete *really* a woman?" The expert witness is an endocrinologist or geneticist.
  *   **Constitutive State:** Eligibility disputes become debates about fairness and policy. "Is this threshold *fair* for the competition?" The expert witness is still a scientist, but their role is to provide data on advantage, not to define the category. The ultimate decision-makers would need to be ethicists or policy administrators, not medical boards.

  **B. Explicit Reference Classes**
  *   **Current State:** The reference class is often vague or shifted silently (e.g., using "elite women" to set the line, but applying it to all women).
  *   **Constitutive State:** Regulations would be forced to explicitly define the reference class. "The threshold is set at the 95th percentile of *elite female athletes in this specific event*." This acknowledges that a threshold appropriate for the 100m sprint might not be appropriate for shooting or equestrian. It forces sport to admit that "female" might mean different things in different contexts.

  **C. The Role of Medical Expertise**
  *   **Would it shrink?** Yes, in terms of authority, though not necessarily in terms of usage.
  *   Currently, medical experts act as **gatekeepers of truth**. They determine if an athlete belongs.
  *   Under a constitutive view, medical experts become **providers of data**. They determine the distribution of hormones and the correlation with performance. They do not decide where the line is drawn. That decision is acknowledged as a normative choice about how much physiological variation is permissible within the category.

  **D. The Nature of the "Line"**
  *   **Current State:** The line is treated as a cliff-edge of identity. Crossing it changes *what you are*.
  *   **Constitutive State:** The line is treated as a regulatory boundary, like a speed limit. Crossing it changes *where you compete*. This reduces the stigma of ineligibility. It becomes akin to moving from a lightweight to a heavyweight division, rather than being declared "not a woman."

  ### Summary

  The current practice presupposes a **Natural Kind ontology** to secure legitimacy but relies on a **Constitutive methodology** to function. This allows federations to treat eligibility as a matter of fact (medical) rather than a matter of value (policy).

  If sport adopted the constitutive view openly:
  1.  **Disputes would shift** from "What is this athlete?" to "What advantage is permissible?"
  2.  **Regulations would specify** the reference population used to draw the line.
  3.  **Medical expertise would recede** from defining the category to measuring the variables, handing the authority to draw the line back to the governing bodies as a policy choice.

  The incoherence you identified is a feature, not a bug: it allows federations to manage the political fallout of exclusion by framing it as scientific necessity. Adopting the constitutive view would remove that shield, forcing a transparent debate about fairness, advantage, and the purpose of the female category.
