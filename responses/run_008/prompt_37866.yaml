answer: |-
  # The "What's Your Assertion Norm?" Icebreaker Quiz

  **Instructions:** Read the following scenarios. For each, select the option that best matches your intuitive verdict. Do not overthink the metaphysics; go with your gut reaction about what the speaker *ought* or *ought not* to do.

  ***

  ### 1. The Lottery Ticket
  You hold a single ticket in a fair, million-ticket lottery. The draw hasn't happened yet. The odds of your ticket losing are 99.9999%. You turn to a friend and say, **"My ticket will lose."** (As it happens, your ticket does lose).
  *   **A)** This assertion is perfectly proper. The odds are overwhelming.
  *   **B)** This assertion is improper. You don't *know* it will lose, no matter the odds.
  *   **C)** This assertion is improper because talking about gambling is rude.

  ### 2. The Stopped Clock
  You walk into a room and glance at a clock on the wall. It reads 2:00 PM. You say, **"It is 2:00 PM."** Unbeknownst to you, the clock stopped exactly 24 hours ago at 2:00 PM. By pure luck, it is actually 2:00 PM.
  *   **A)** This assertion is proper. You had every reason to think it was true, and it was.
  *   **B)** This assertion is improper. You didn't actually know the time; you just got lucky.
  *   **C)** This assertion is proper because clocks are reliable appliances.

  ### 3. The Reluctant Scientist (Selfless Assertion)
  Dr. Aris is a climatologist. She has reviewed all the data, which conclusively shows human activity is warming the planet. However, due to a deep-seated psychological bias, she personally *cannot bring herself to believe* the conclusion. Despite her lack of belief, she stands at a podium and asserts, **"Human activity is warming the planet,"** citing the evidence.
  *   **A)** This assertion is proper. She has overwhelming evidence, even if she lacks belief.
  *   **B)** This assertion is improper. You shouldn't assert what you don't personally believe.
  *   **C)** This assertion is improper because she is lying to the audience.

  ### 4. The Comforting Doctor (Chaste Assertion)
  A doctor knows with certainty that her patient has only days to live. The patient is terrified and asks, "Will I recover?" The doctor knows saying "Yes" is false, but believes the truth will cause a fatal heart attack from stress. She says, **"Yes, you will recover."**
  *   **A)** This assertion is proper. Saving the patient from stress is the priority.
  *   **B)** This assertion is improper. It is false, and you shouldn't assert falsehoods.
  *   **C)** This assertion is improper. You shouldn't assert what you don't believe.

  ### 5. The Weather Forecast (Retraction)
  A meteorologist asserts on TV, **"It will rain tomorrow,"** based on the best available models and data. The next day, it turns out to be sunny due to a chaotic, unpredictable atmospheric shift. When she returns to air, she says nothing about her previous claim.
  *   **A)** She owes the audience a retraction/apology. She asserted something false.
  *   **B)** She does not owe a retraction. She asserted based on the best available justification.
  *   **C)** She owes a retraction only if viewers cancel their subscriptions.

  ### 6. The Nervous Swimmer (Properness vs. Blame)
  A nervous swimmer at the beach sees a dark fin in the water. He has no idea if it's a shark or a dolphin; he's just panicking. He screams, **"There's a shark!"** It turns out there *was* a shark, and everyone gets to safety.
  *   **A)** The assertion was proper. It was true and saved lives.
  *   **B)** The assertion was improper, but he is not blameworthy. He violated the rule, but had an excuse (panic).
  *   **C)** The assertion was improper and he is blameworthy. He should never guess about sharks.

  ### 7. The False Memory
  You have a vivid, clear memory of eating breakfast at "Joe's Diner" this morning. You tell a friend, **"I ate at Joe's Diner this morning."** Later, you discover your memory was a confabulation; you actually ate at home. You had no reason to doubt the memory at the time.
  *   **A)** Your assertion was proper. You were fully justified in trusting your memory.
  *   **B)** Your assertion was improper. You asserted a falsehood.
  *   **C)** Your assertion was proper because breakfast is important.

  ### 8. The Prime Number Norm
  You are filling out a form. You assert, **"My age is 30."**
  *   **A)** This assertion is proper if you are 30.
  *   **B)** This assertion is proper if you know you are 30.
  *   **C)** This assertion is proper because 3 is a prime number and primes are lucky.

  ### 9. The Expert Testimony
  You read a reputable newspaper report stating that a distant star has exploded. You have no astronomical training. You tell your spouse, **"A star has exploded."**
  *   **A)** This assertion is proper. You have testimony-based knowledge.
  *   **B)** This assertion is improper. You didn't see it yourself.
  *   **C)** This assertion is proper if the newspaper is printed on recycled paper.

  ### 10. The Guess
  You have absolutely no evidence about the number of gumballs in a jar. You guess, **"There are 543 gumballs."** It turns out there are exactly 543.
  *   **A)** This assertion was proper. You got it right!
  *   **B)** This assertion was improper. You had no basis for the claim.
  *   **C)** This assertion was proper because gumballs are fun.

  ***

  ## Scoring Key & Diagnostic

  *Note to the presenter: This key is heuristic. As you noted in your prospectus, the literature often talks past itself. Use this to show where your colleagues cluster, and where the "labels" fail to capture the verdicts.*

  ### The "Attention Check" (Question 8 & 9, Option C)
  If anyone selected **Option C in Question 8** (Primes) or **Option C in Question 9** (Recycled Paper), they are either trolling or need to read the instructions more carefully. Remove their data from the pool. (This satisfies the "trap" requirement).

  ### Position Mapping

  **1. The Knowledge Account (KA)**
  *   **Signature Move:** Rejects assertions in Lottery (Q1), Stopped Clock (Q2), and Guess (Q10) cases, even if true.
  *   **Typical Pattern:** Q1(B), Q2(B), Q3(A or B), Q4(B), Q5(B), Q6(B), Q7(B), Q10(B).
  *   **Nuance:** KA proponents often accept Q6(B) (Improper but not blameworthy). If they chose Q6(C), they hold a "Strict KA" without an excuse clause.

  **2. The Truth Account (TA)**
  *   **Signature Move:** Accepts assertions if they turn out true (Q1, Q2, Q10), but demands retraction for falsehoods even if justified (Q5).
  *   **Typical Pattern:** Q1(A), Q2(A), Q4(B), Q5(A), Q7(B), Q10(A).
  *   **Nuance:** TAs will often clash with JBA on Q5 (Retraction). If they say no retraction is owed for a false assertion, they are likely not Truth Theorists.

  **3. The Justified Belief / Reasonable Account (JBA)**
  *   **Signature Move:** Accepts assertions where the speaker has good evidence, even if false (Q5, Q7) or Gettiered (Q2).
  *   **Typical Pattern:** Q1(A), Q2(A), Q3(A), Q4(B), Q5(B), Q7(A), Q10(B).
  *   **Nuance:** Distinguishes from KA primarily on Gettier (Q2) and Lottery (Q1). Distinguishes from TA on Retraction (Q5) and False Memory (Q7).

  **4. The Belief / Sincerity Account (BA)**
  *   **Signature Move:** The dealbreaker is the speaker's mental state, not the world.
  *   **Typical Pattern:** Q3(B) is the strongest indicator. If they say the Reluctant Scientist is improper *because she didn't believe it*, they lean BA.
  *   **Nuance:** Often overlaps with JBA, but diverges on Selfless Assertion (Q3).

  ### The "Unclassified / Lackey Territory" Zone
  *   **Inconsistent Verdicts:** If a colleague marks Q1(A) (Lottery is OK) but Q2(B) (Gettier is Not OK), they are in a difficult spot. The standard JBA accepts both; the KA rejects both. Mixing them suggests an unstable norm or a contextualist view.
  *   **KA vs. JBA Indiscrimination:** Acknowledge openly that Q1 and Q2 are the *only* places KA and JBA reliably come apart. If your audience is split 50/50 on the Clock case, admit that the quiz cannot sort them further without asking about the *nature* of justification.
  *   **Properness vs. Blame:** Q6 is your wedge. If someone says Q1 is Improper (KA) but Q6 is "Not Blameworthy," they accept the **Norm/Excuse Distinction**. If they say Q1 is Improper and Q6 is "Blameworthy," they hold a **Strict Norm** view.

  ### Discussion Prompts for the Q&A
  1.  **The Retraction Clash:** Look at Q5. If the Truth Theorists and Justification Theorists are shouting at each other, point out that this is where the literature stalls. One side says "You were wrong," the other says "You were reasonable."
  2.  **The Selfless Puzzle:** Look at Q3. If the Belief Theorists are isolated here, ask them if they really think the scientist acted wrongly. This pressures the BA to allow exceptions, which might collapse it into JBA.
  3.  **The Trap:** Briefly mention Q8/Q9 Option C. "I included these to ensure we are all talking about norms of assertion, not norms of numerology or sustainability." (Deliver this dryly).

  ***

  **Advisor-Proofing Note:** This quiz forces colleagues to commit to verdicts before they can retreat to labels. If your advisor complains people are still talking past each other, you can point to the Q1/Q2 split: if they agree on the cases, they agree on the norm, regardless of what they call it. If they disagree on the cases, the label was hiding a real disagreement all along.
