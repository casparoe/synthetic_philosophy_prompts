answer: |-
  ### Exam Question

  **Philosophy of Mind: Final Examination**
  **Time Allowed: 90 Minutes**

  **Question 1**
  Consider a patient with a complete callosal section. She is briefly shown a spoon to the left visual field and an apple to the right. When asked what she saw, she says, "An apple." When asked to reach with her left hand for what she saw, she retrieves the spoon. When asked why she picked the spoon, she offers a plausible-sounding reason that is not the operative one (e.g., "I wanted to eat").

  Using this scenario, write an essay that addresses the following three requirements:

  1.  **Disambiguate Unity:** Distinguish between unity of phenomenal character (co-consciousness), unity of access (information availability to a reasoning system), and unity of agency (coherent deliberation over time). Specify which of these the surgical cases *actually* put pressure on, and which they only *seem* to pressure because the labels share a word.
  2.  **Examine the Inference:** The standard reasoning runs from behavioral dissociation to experiential dissociation, assuming verbal report is a transparent window on experience. Explain how the patient's confabulation regarding the left hand's action puts that assumption under strain. Show why this observation cuts both ways: it weakens the "two streams" conclusion, but it equally weakens any later appeal by a patient to feeling perfectly unified.
  3.  **Evaluate a Complication:** Address one phenomenon that complicates the clean laboratory picture (cross-cuing, everyday unity, or patient self-reports). Say what hypothesis it supports (one subject, two subjects, or impaired access) and, crucially, what would have to be observed to decide between those readings. Explain why a phenomenon that comports equally with all them supports none.

  ***

  ### Model Answer

  The split-brain scenario necessitates a precise disambiguation of 'unity of consciousness.' We must separate unity of phenomenal character (the co-consciousness of experiences within a single what-it-is-like), unity of access (the availability of perceptual information to a single reasoning and reporting system), and unity of agency (the integration of attitudes and intentions into a single deliberator over time). The surgical cases *actually* pressure access and agential unity. In the spoon/apple case, information is demonstrably inaccessible to the speaking hemisphere (access failure), and the reasons given for actions are causally disconnected from the motives (agency failure). Phenomenal unity is only *seemingly* pressured; the inference that behavioral dissociation entails experiential fragmentation relies on conflating these distinct categories.

  The standard reasoning moves from behavioral dissociation to experiential dissociation, assuming verbal report is a transparent window on experience. The patient's confabulation regarding the left hand's action puts this assumption under strain. When the speaking hemisphere invents a reason for retrieving the spoon, it demonstrates that report can be decoupled from the operative mental states. This weakens the 'two streams' conclusion: the claim 'I saw only an apple' may be a confabulated exclusion rather than a true report of phenomenal absence. The speaking hemisphere may be ignorant of the right hemisphere's experience without that experience being absent.

  However, this observation cuts both ways. It equally weakens any later appeal by a patient to feeling perfectly unified. If the speaking hemisphere constructs coherent stories about behavior it did not control, it may also construct a narrative of unity over potentially disjointed phenomenal fields. A patient claiming "I feel like one person" may be offering a confabulated integration similar to the explanation for picking the spoon. We are left without a reliable testimonial basis for either division or unity. The confabulation data destroys the bridge from report to experience entirely, leaving the phenomenal question underdetermined.

  This epistemic uncertainty is compounded by phenomena like cross-cuing, where the non-speaking hemisphere steers the other through posture or timing. Some argue this supports one subject with impaired interhemispheric access, suggesting information eventually integrates. Others argue it supports two subjects coordinating like distinct agents. To decide between these readings, we would need to observe performance under conditions where cross-cuing is strictly eliminated. If dissociation persists when subtle cues are blocked, it supports two subjects. If unity of report returns, it supports one subject with access issues. Crucially, because current cross-cuing data can be redescribed as either intra-agential coordination or inter-agential cooperation, it comports equally with all interpretations. A phenomenon that supports all hypotheses supports none; decisive evidence requires a scenario where the hypotheses yield divergent predictions.

  Thus, the split-brain case does not settle the metaphysics of mind but exposes the limits of our evidential access. We cannot infer phenomenal structure solely from access and agency without begging the question. The data confirms functional dissociation, but the leap to experiential multiplication remains unsupported by the very reports used to justify it.

  ***

  ### Marking Scheme (20 Marks)

  **1. Disambiguation of Unity Types (4 Marks)**
  *   **Full Marks:** Clearly defines phenomenal, access, and agency unity as distinct concepts.
  *   **Typical Loss:** Conflating access and phenomenal unity (e.g., treating "unreported" as "unexperienced").
  *   **Note:** Must use the terminology provided or equivalent philosophical precision.

  **2. Application to the Case (4 Marks)**
  *   **Full Marks:** Correctly identifies that access and agency are *actually* pressured by the dissociation, while phenomenal unity is only *seemingly* pressured.
  *   **Typical Loss:** Claiming the case proves phenomenal disunity directly.
  *   **Note:** Reward recognition that the "pressure" on phenomenology is inferential, not observational.

  **3. Critique of Report Transparency (4 Marks)**
  *   **Full Marks:** Explains that confabulation shows verbal report is not a transparent window on experience/cause.
  *   **Typical Loss:** Treating confabulation only as evidence for two minds, ignoring the epistemic gap it creates.
  *   **Note:** Must identify the "bridging assumption" about report validity.

  **4. The "Cut Both Ways" Insight (4 Marks)**
  *   **Full Marks:** Explicitly argues that if reports are unreliable for division, they are unreliable for unity (symmetry of error).
  *   **Typical Loss:** Using confabulation to argue only for the "two minds" view.
  *   **Note:** This is the pivot for an A grade. B answers stop at "confabulation proves dissociation."

  **5. Complicating Phenomenon & Evidential Standard (4 Marks)**
  *   **Full Marks:** Selects a phenomenon, states what it supports, and specifies the *divergent prediction* needed to decide between hypotheses.
  *   **Typical Loss:** Describing the phenomenon without specifying what would falsify one interpretation over another.
  *   **Note:** Must include the clause that compatibility with all hypotheses supports none.

  **A vs. B Distinction:**
  *   **B Answer (10-14 marks):** Recites the familiar framing (patient is one person or two depending on theory of identity). Treats confabulation as proof of two minds. Treats unity as a single concept.
  *   **A Answer (15-20 marks):** Focuses on the *epistemic conditions* for claiming unity. Uses the confabulation point to suspend judgment on phenomenology rather than settle it. Successfully disambiguates unity types to isolate where the data actually bites.

  ***

  ### Pedagogical Note

  The question is not ill-posed, but it is dense. The distinction between phenomenal and access unity is analytically valid, though some metaphysical frameworks (e.g., Dennettian) may reject phenomenal unity as a coherent pre-theoretical notion. For an upper-level course, this is an acceptable tension. However, 90 minutes is tight for students to execute all three moves (disambiguation, epistemic critique, evidential standard) without rushing the third component. You may consider allowing 10 minutes of reading time before the clock starts, or explicitly advising students that depth on the "cut both ways" point is weighted more heavily than comprehensive coverage of the complicating phenomenon.
