answer: |-
  (1) "The Question"
  Coherent Extrapolated Volition (CEV) proposes that artificial agents should act according to what humanity would want under idealized conditions: more knowledge, faster thought, greater moral maturity. Standard formulations treat this idealization as a function mapping our current preferences to a fixed point. My project questions whether this mapping is path-independent. In mathematical terms, do the operators of idealization commute? Does a population that acquires encyclopedic knowledge before undergoing moral maturation converge on the same volition as one that matures before learning? If the order and rate of these idealizing transformations affect the final state, then "our idealized preferences" is not a singular target but a family of targets indexed to an extrapolation schedule.

  What turns on this is the normative authority of the resulting AI goals. If the output depends on the sequence of idealization, then the choice of sequence is itself a substantive normative decision. Currently, this choice is smuggled in as a technical parameter within the alignment process. By exposing the path-dependence of preference idealization, I aim to show that CEV cannot resolve normative uncertainty merely by scaling up cognition; it must instead justify the trajectory of that scaling. The question is not whether idealized preferences exist, but whether they are unique regardless of how we arrive at them. If they are not, the alignment problem shifts from finding the correct value to selecting the correct developmental history for the values themselves. This undermines the hope that idealization offers a neutral arbiter for conflicting human values. It suggests that an AI aligned via one schedule might be morally alien to humanity aligned via another, raising deep questions about autonomy. We cannot claim the AI represents "us" if the process that constructs the "us" is arbitrary. The project seeks to determine whether the geometry of moral learning constrains the destination. I will investigate whether specific orderings—knowledge before maturity versus maturity before knowledge—yield divergent equilibria, thereby transforming the technical specification of an AI's goal system into an implicit ethical legislation.

  (2) "Why the Standard Debates Leave It Open"
  The existing literature divides into skeptics and proponents of idealization. Skeptics, often drawing on coherence objections, argue that human preferences are too fragmented to converge under any idealization. They contend that even with full information and perfect reasoning, we would disagree. Proponents, including defenders of CEV and Full Information accounts, argue that idealization filters out noise and error, revealing a stable core of value. Both sides, however, assume that if convergence occurs, it is to a unique point determined solely by the degree of idealization, not the process. They treat the ideal state as a static attractor rather than the terminus of a dynamic trajectory.

  This leaves the ordering problem untouched. In Ideal Observer Theory, the observer is defined by static properties—omniscience, omnipercipience, disinterestedness. The theory does not specify how the observer becomes ideal, because the idealization is conceptual, not temporal. CEV introduces temporality but assumes the limit is robust. It treats the extrapolation as a technical bootstrap: run the simulation long enough, and the answer appears. This assumes the operators of knowledge acquisition and moral growth commute. If they do not, the standard defenses fail. Showing that preferences converge is insufficient if they converge to different points depending on the learning rate or the sequence of moral insights.

  Furthermore, metaethical debates about rationality often presuppose a single correct reasoning path. Constructivist accounts suggest values are made through reasoning, not found. If values are constructed, the construction process matters. Yet, neither constructivists nor realists have adequately addressed the sensitivity of the output to the idealization schedule. The standard debates ask whether idealization works; I ask how it works. By ignoring the path, current models risk conflating a specific developmental history with universal rationality. A defense of CEV that ignores path-dependence is vulnerable to the charge that it encodes a specific, unjustified narrative of moral progress into the AI's core. I will demonstrate that the silence on ordering is not a neutral omission but a gap that allows substantive normative assumptions to hide within technical specifications. For instance, prioritizing knowledge before maturity might lock in current biases under the guise of fact, while prioritizing maturity might discard facts that challenge emerging norms. The standard objections focus on whether the end state is coherent or recognizable; they do not ask whether the end state is an artifact of the journey. This project fills that gap by treating the idealization process itself as an object of philosophical scrutiny. Even appeals to reflective equilibrium assume a stable input set; if the input set evolves differently based on order, the equilibrium shifts. Thus, the standard debates leave the normative weight of the extrapolation schedule entirely unexamined. Consequently, the distinction between engineering constraints and ethical choices dissolves.

  (3) "Method"
  My method combines conceptual analysis with formal modeling. I will not attempt to prove theorems about human psychology, but rather use abstract toy agents to test the sensitivity of preference convergence to extrapolation schedules. These models will serve as intuition pumps, making precise the vague notions of "moral maturity" and "knowledge acquisition" to see if their order matters in principle. The goal is philosophical clarity, not predictive accuracy.

  In the first semester, I will conduct a comprehensive review of Ideal Observer Theory and Full Information accounts, mapping where they assume path-independence. I will focus on how these theories define the ideal state without specifying the transition. Simultaneously, I will build a static formal model of preference aggregation to establish a baseline. This model will represent agents as nodes in a network with belief states and value functions. The goal is to define the operators of idealization formally enough to manipulate their order. I will define "knowledge" as Bayesian updating and "maturity" as a smoothing function on the value landscape. I will specifically analyze the work of Smith and Firth to locate the assumptions of commutativity.

  In the second semester, I will introduce dynamics. I will simulate populations of toy agents undergoing idealization via different schedules: knowledge-first, maturity-first, and interleaved. I will vary the rates of learning and the depth of reflection. The output will be a set of convergence maps showing whether different paths lead to different fixed points. These models will be simple enough to be transparent but complex enough to exhibit non-linear dynamics. I will share these models with computer science colleagues to ensure technical soundness without mistaking the simulation for reality. I will specifically look for bifurcation points where small changes in the schedule lead to large divergences in outcome.

  In the third semester, I will interpret the modeling results philosophically. If path-dependence appears, I will analyze which schedules align with existing normative theories. Does a knowledge-first path resemble utilitarianism? Does a maturity-first path resemble virtue ethics? I will also examine historical analogues: how human moral progress has actually occurred versus how CEV assumes it occurs. This involves conceptual work on the nature of moral learning—is it additive or transformative? I will engage with literature on moral psychology to ensure the toy agents' learning rules are not wildly implausible. I will also draft the core philosophical chapters during this period, integrating the formal results into the argument.

  In the fourth semester, I will synthesize the findings into a dissertation draft. I will refine the argument that the choice of schedule is a normative decision. I will also prepare journal articles on the formal models and the metaethical implications. Throughout, I will maintain contact with advisors in both philosophy and computer science to ensure the work remains accessible to the mixed audience of the grant committee. The focus remains on clarity: the models exist to sharpen the philosophical question, not to answer it mathematically. I will also present preliminary findings at workshops to gauge interdisciplinary reception. The deliverable is a robust argument that the geometry of idealization is ethically significant, supported by formal demonstrations of possibility rather than empirical claims about human nature. This structured approach ensures that the formal work serves the philosophical ends, preventing the project from devolving into pure computer science or abstract speculation.

  (4) "What a Result Looks Like"
  There are three primary outcomes. First, the models may show robust convergence: regardless of the schedule, agents settle on the same preference set. This would vindicate the standard CEV assumption, suggesting path-dependence is a philosophical worry without mathematical teeth. The evidence would be stable fixed points across all simulated trajectories.

  Second, the models may show significant divergence. Different schedules lead to distinct, stable equilibria. This would support my hypothesis that "idealized preferences" are a family of targets. The evidence would be bifurcation in the convergence maps. This result would force a revision of CEV, requiring a normative justification for the chosen schedule. It would imply that AI developers are effectively legislating morality by choosing the learning order.

  Third, the models may show that path-dependence exists but is constrained. The outcomes differ, but only within a narrow moral band. This would suggest that while the schedule matters, it does not matter enough to undermine alignment entirely. The evidence would be clustered fixed points rather than scattered ones.

  Deciding among these depends on the sensitivity analysis in the second semester. If small perturbations in the schedule yield large changes in output, the second outcome holds. If outputs remain stable despite perturbations, the first holds. The third outcome requires measuring the moral distance between the divergent points, which will involve qualitative judgment alongside the quantitative models. Any of these results advances the field: either by securing the foundations of CEV against a novel objection, or by exposing a hidden normative parameter that must be addressed. The success of the project is not contingent on proving path-dependence, but on determinately establishing whether it exists.

  (5) "Failure Conditions"
  The project could fail in two ways. First, the toy models might be too abstract to carry philosophical weight. If the agents are so simplified that their "moral maturity" bears no resemblance to human moral growth, the path-dependence observed might be an artifact of the math rather than a feature of normativity. To mitigate this, I will validate the learning rules against basic plausible constraints from moral psychology.

  Second, path-dependence might prove to be mathematically washable. It is possible that under conditions of sufficient coherence, any path leads to the same point. If I can prove that any reasonable idealization operator must commute, the core hypothesis collapses. This would still be a result, but it would negate the proposed contribution.

  Finally, the project could fail if the normative significance remains unclear. Even if path-dependence exists, it might not matter ethically. If the divergent outcomes are morally equivalent, the technical problem does not translate to a philosophical one. I will avoid this by defining moral distance carefully in the third semester. There is also a risk of getting bogged down in the formalism, losing the philosophical thread. I will maintain strict milestones to ensure the models serve the argument, not vice versa. If the models become too complex to interpret, I will scale them back. The goal is insight, not simulation fidelity.
