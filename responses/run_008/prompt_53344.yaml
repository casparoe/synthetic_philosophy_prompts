      My method combines conceptual analysis with formal modeling. I will not attempt to prove theorems about human psychology, but rather use abstract toy agents to test the sensitivity of preference convergence to extrapolation schedules. These models will serve as intuition pumps, making precise the vague notions of "moral maturity" and "knowledge acquisition" to see if their order matters in principle.

