      *Refining the "Proof" point:* The research program (often associated with Paul Christiano/ARC) aims to formalize *when* heuristic arguments are trustworthy. It doesn't aim to prove the *conclusions* of the heuristics are true in a formal logic sense, but rather to prove that the *heuristic method* is reliable. The friend says "prove that the correlations... don't exist." That's too strong. It's about justifying the *estimate*.

      *Refining the "Crypto" point:* The friend says PRNGs can't be cracked because output is too complicated. Actually, PRNG security relies on computational hardness assumptions. Heuristic arguments might help analyze them, but saying this research "settles" it is wrong. P vs NP is still open.

      *Refining the "Superintelligence" point:* This is the critical safety error. The hope is that *we* can use heuristics to verify the AI. It is *not* that the AI is bound by our heuristics. The AI might find a "short argument" (exploit) that we missed. The research helps *us* check for those, it doesn't prevent the AI from finding them.

