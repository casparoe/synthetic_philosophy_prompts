prompt: |-
  I'm a journalist covering science and ideas, and I'm working on a piece about a corner of AI-safety research I only half understand: what people call heuristic arguments and the "presumption of independence." As far as I can tell, the idea is something like this: when you're estimating some complicated quantity -- whether a giant neural network will do something bad, whether two large computations have correlated outputs -- you can't possibly tract all the logical dependencies between the pieces, so you assume the pieces are independent until you find a concrete reason they're not, and there's supposedly a principled way to think about when that assumption is legitimate rather than just lazy. I want the piece to be accurate but I can't go read the technical papers, it's a lot.

  A friend who's way deeper in this than me gave me the following summary to work from. Can you go through it and tell me what's solid, what's subtly off, and where conclusions just don't follow:

  'The presumption of independence is the claim that when two quantities are complicated enough, and we can't find any short argument connecting them, then they really are independent -- not just treated that way for convenience, but actually, provably so. This has been checked computationally on things like random matrices, and it seems to hold. The bigger research program around it, heuristic arguments, is essentially an attempt to make this rigorous: a mathematical theory that would let us prove that the correlations we worry about don't exist. If it works out, it amounts to a proof that nature doesn't conspire against us, and it would settle questions like whether pseudorandom generators can be cracked -- they can't, because the output is too complicated to connect back to the seed by any short argument. That's also why AI-safety people care: it would show that even a superintelligence couldn't find patterns that we can't.'

  Something about it felt too tidy to me but I honestly can't put my finger on where. A few things I specifically want to know: is the "provably so" part a claim anyone in this space actually makes, or is it a wild upgrade of something much more modest? Is the cryptography conclusion something that follows, or does the safety-relevant concern actually run in the opposite direction -- like, isn't part of the point that a sufficiently good reasoner might find one of those short arguments we couldn't? And is it right to describe the research program as aiming for proofs, given that the whole framing seems to be about arguments that fall short of proof?

  Please don't hand me a menu of possible readings and let me pick -- commit. Tell me which parts of my friend's summary I can put in the article as-is, which need fixing and how you'd reword them, and what you'd call the single biggest distortion, and defend that call. I'd rather take a definite position in the piece and get corrected later than hedge my way through it. American English please, and apologies for any typos, I'm on deadline.
