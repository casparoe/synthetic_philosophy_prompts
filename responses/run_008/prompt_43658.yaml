  Here is the breakdown of Priya's likely verdicts, the underlying theory driving them, and how to win your coffee.

  ### 1. The Predictions

  **Case 1: The Comfortable Guy (Kidney for Startup)**
  *   **Verdict:** **Ban.**
  *   **Reasoning:** Priya bans kidney sales by the poor, but she *allows* plasma sales by the poor. If her objection were purely about economic desperation, she would be consistent on both body commodities. Since she distinguishes between them, the objection must be about the *nature of the good* being sold. A kidney is a vital, non-regenerating organ constitutive of bodily integrity; plasma is a regenerating fluid. The seller's wealth doesn't fix the commodification of the self.

  **Case 2: The Professional Mourners (MFAs, Well-Paid)**
  *   **Verdict:** **OK.**
  *   **Reasoning:** This falls into her "Labor/Service" bucket (like sex work and surrogacy) rather than her "Constitutive Good" bucket (like votes, apologies, or kidneys). While it involves emotion, it is a performance for hire. Unlike the paid apology (which substitutes moral agency), mourners do not substitute the *family's* grief; they augment the ritual. As long as it's transparent (no fraud on the guests), it's a service, not a corruption of meaning.

  **Case 3: The Single Mom (Plasma for Groceries)**
  *   **Verdict:** **OK.**
  *   **Reasoning:** This is almost identical to her existing track record on plasma ("fine... even though it's mostly poor people who sell"). The frequency (twice a week) is standard medical protocol. Unless she views this specific level of poverty as "acute desperation" akin to the hurricane scenario (which is usually sudden/emergency vs. structural), she will remain consistent. She tolerates structural economic pressure (plasma, sex work) but bans acute exploitation (price gouging, organ loss).

  ### 2. The Rule She's Running

  Priya is not running a **Desperation Rule** (otherwise plasma/sex work would be banned) nor a **Third-Party Harm Rule** (otherwise dwarf tossing/paid apologies would be allowed).

  She is running a **Corruption of Meaning / Inalienability Rule**, with a side constraint on **Acute Exploitation**.

  *   **Core Principle:** Markets are impermissible when they commodify goods that are constitutive of human integrity, moral agency, or civic standing.
      *   *Constitutive Goods (Ban):* Kidneys (bodily integrity), Votes (civic agency), Apologies (moral agency), Dwarfs (human dignity).
      *   *Alienable Services/Fluids (OK):* Plasma (regenerating fluid), Sex/Surrogacy (labor/time), Mourners (performance).
  *   **Side Constraint:** Markets are impermissible when they rely on *acute, emergency vulnerability* that voids meaningful consent.
      *   *Acute (Ban):* Hurricane generators (emergency need), Poor Kidney (desperation + integrity).
      *   *Structural (OK):* Poverty-driven plasma or sex work (unjust, but consent is deemed valid enough).

  ### 3. The Discriminating Case

  **Case 1 (The Comfortable Kidney Seller)** is your best discriminator.

  *   **If she follows a Desperation Rule:** She must say **OK**. (No desperation = no wrong).
  *   **If she follows a Corruption of Meaning Rule:** She must say **Ban**. (Kidneys are inalienable regardless of wealth).
  *   **If she follows a Third-Party Harm Rule:** She must say **OK**. (Consensual, no direct harm to others).

