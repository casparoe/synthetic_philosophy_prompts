      *   **Task:** Identify which step to reject, explain the cost of rejecting it, admit weaknesses in the counter-argument, and state what would flip the AI to the roommate's side.

  2.  **Deconstruct the Roommate's Argument (The "Cascade Skeptic" Position):**
      *   *Premise 1-3:* Accurate description of Bikhchandani, Hirshleifer, and Welch (1992) style information cascades.
      *   *Premise 4:* Analogy between the abstract model and real-world scientific consensus. **This is the weak link.**
      *   *Premise 5-6:* Inference from the model to the nature of consensus weight.
      *   *Conclusion 7:* Normative claim on how to treat specific scientific consensuses.

  3.  **Identify the Critical Flaw (Step 4 & The Model Assumptions):**
      *   The classic cascade model relies on specific assumptions that rarely hold in robust scientific communities:
          *   **Binary/Discrete Choices:** In the model, you choose A or B. In science, you publish data, methods, and nuanced probabilities.
          *   **Sequential Action:** People act one by one. In science, research is often parallel/concurrent.
          *   **No Communication of Signal Quality:** In the model, you only see the *action*, not the *signal* or the *confidence*. In science, papers reveal the data (the signal) and the methodology (the noise level).
          *   **One-shot:** In the model, you act once. In science, replication and re-testing happen.
          *   **Common Prior/Knowledge:** The model assumes specific knowledge structures.
      *   *Key Distinction:* **Action Cascades vs. Belief Cascades.** Science is designed to transmit *signals* (data), not just *actions* (beliefs/votes). If I can see your data, I don't just copy your conclusion; I update on your data. This breaks the cascade.

  4.  **Formulate the Counter-Argument (Where to Reject):**
      *   **Reject Step (4).** The mapping from "classic cascade model" to "scientific consensus" is flawed.
      *   **Why?** Scientific institutions are specifically engineered to *prevent* cascades.
          *   Peer review (theoretically) looks at methods, not just conclusions.
          *   Replication studies.
          *   Publication of raw data.
          *   Incentives for contrarianism (finding errors wins prizes).
      *   **Cost of Rejection:** You have to admit that institutions *can* work. You have to trust that the mechanism of science (data sharing, replication) is functioning better than social conformity. You can't be a total skeptic about social epistemology.

  5.  **Address the "Self-Defeating" Aspect:**
