  **Question 1**
  You argue money pumps target the agent's protective apparatus, not the preferences themselves. But if preferences drive choices, and choices lead to pumps, isn't the distinction merely verbal? How do you isolate the preference relation from the decision procedure without rendering the preference relation behaviorally inert?

  *Follow-up:* If you say the relation is inert, aren't you just doing psychology rather than normative decision theory?

  **Question 2**
  Consider the one-shot pump. If an exploiter needs repeated cycles to profit, does anything follow about the rationality of preferences exhibited on a single pass? Can you specify what follows without simply biting the bullet that one-shot intransitivity is harmless?

  *Follow-up:* If one-shot intransitivity is harmless, why treat transitivity as a constitutive norm of preference rather than a pragmatic heuristic?

  **Question 3**
  A sophisticated agent foresees the pump and refuses trades. If the standard reply is that foresight restores consistency only at the level of plans and not preferences, what exactly do you think is wrong with requiring consistency only at the level of choice?

  *Follow-up:* Does this imply rationality is fundamentally about avoiding regrettable outcomes rather than maintaining structural coherence in your utility function?

  ***

  *Let's press on the mechanisms agents use to avoid these pumps.*

  **Question 4**
  Critics argue that without preference consistency, dynamic consistency collapses. If agents can change minds at every node without irrationality, doesn't planning become impossible? How do you secure stability without imposing static constraints on preferences?

  **Question 5**
  Take resolute choice in McClennen's sense: committing to a plan and not re-evaluating. Does your position secretly depend on denying the separability of successive decisions? Many theorists regard separability as the point of the exercise rather than an optional extra.

  *Follow-up:* If you deny separability, aren't you conceding that the rationality of a choice depends on history, undermining the standard decision-theoretic framework entirely?

  **Question 6**
  Maintaining protective apparatus requires cognitive effort. If rationality demands constant vigilance against pumps, isn't that computationally prohibitive? Does your view imply that only highly sophisticated agents can be rational, leaving ordinary agents behind?

  ***

  *I want to return to a specific construction we've sparred over regarding the second trade.*

  **Question 7**
  You claim an agent facing the second trade can refuse because preferences over remaining options differ from earlier conditional preferences. Is this reply anything more than the observation that agents can be stubborn? What do you say to the charge that this makes rationality unfalsifiable?

  *Follow-up:* If rationality is unfalsifiable, does it lose its normative grip, becoming merely a description of whatever the agent ends up doing?

  **Question 8**
  Does this defense extend to Dutch Book arguments for probabilistic coherence? If preferences can be protected, can degrees of belief be similarly shielded from sure-loss contracts without requiring probabilistic axioms?

  **Question 9**
  Does any of this survive when preferences violate the independence axiom, like Allais-type preferences? Pumping there seems to depend on offering the sort of sure thing whose availability changes the preferences being exploited.

  ***

  *To close, I want to bring this down to earth for our listeners.*

  **Question 10**
  Finally, state what diachronic rationality looks like if you are right. What would remain of the idea that we should keep our preferences in order over time, once the money-pump argument is no longer doing that work? Give us something actionable.
