answer: |-
  Here is a breakdown of the distinct claims hidden inside the phrase "it's just semantics," arranged from the weakest to the strongest. You can send this directly to your friend.

  ***

  **1. The "Merely Verbal" Reading (Weakest)**
  *   **The Claim:** We agree on all the non-linguistic facts (e.g., that '7' is prime, that mathematicians prove theorems, that no one has ever bumped into a number in the street). We simply disagree on whether to attach the label "exists" to that specific set of facts. You use "exist" to mean "is a causally active object in spacetime"; I use "exist" to mean "is a valid referent in a true proposition."
  *   **Plausibility:** Low. This suggests we have no metaphysical disagreement, only a lexical one. However, your claim is that independent existence is *unintelligible*, not just mislabeled. That is a claim about the structure of reality, not just the dictionary.
  *   **Does it justify the dismissal?** **No.** If a dispute is merely verbal, the rational move is to standardize terminology for clarity, not to agree to disagree. If we agree on the facts, we should agree on the word to avoid future confusion. Saying "let's keep our own senses" implies the *choice* of sense matters, which contradicts the claim that it's *only* about the sense.

  **2. The "Diagnostic" Reading (Middling)**
  *   **The Claim:** Our verbal disagreement is masking a substantive one, but we haven't isolated it yet. We are talking past each other because 'exist' is ambiguous. Once we disambiguate (e.g., "exist causally" vs. "exist abstractly"), we might find we actually agree, or we might find a precise point of metaphysical contention (e.g., "Do truth-makers require causal powers?").
  *   **Plausibility:** High. This is the standard philosophical diagnosis of ontology debates. It acknowledges that language is the medium of the dispute without assuming the dispute is *only* about language.
  *   **Does it justify the dismissal?** **No.** This reading demands *more* argument, not less. It obligates us to define our terms and locate the precise point of divergence. Using this reading to shut down the conversation is an admission that you don't want to do the work of finding the real disagreement.

  **3. The "Framework-Relative" Reading (Strong)**
  *   **The Claim:** Questions of existence only make sense *internal* to a linguistic framework (like mathematics or physics). "Internal" questions (e.g., "Is there a prime number between 3 and 7?") have answers. "External" questions (e.g., "Do numbers exist independently of the framework?") are pseudo-questions. You are asking an external question; I am answering an internal one.
  *   **Plausibility:** Medium/High for a math student. This aligns with a Carnapian or Formalist view. It treats mathematics as a game with rules, where "existence" just means "consistency within the rules."
  *   **Does it justify the dismissal?** **Only if you defend the framework.** You cannot assert this as a neutral observation. Claiming that external questions are meaningless is itself a substantive metaphysical stance (Logical Empiricism). You owe me an argument for why my "external" question is illegitimate, not just an assertion that it is.

  **4. The "Ontological Deflation" Reading (Strongest)**
  *   **The Claim:** There is no deep metaphysical property of "existence" to discover. To say "numbers exist" is just to say "statements about numbers are true." Since '7 is prime' is true, numbers exist. Full stop. The idea that there is a further fact about whether they are "independent of us" is a confusion.
  *   **Plausibility:** Controversial. This is a Quinean deflationary view. It dissolves your worry by redefining existence as a logical quantifier rather than a metaphysical status.
  *   **Does it justify the dismissal?** **No.** This reading actually resolves the argument *against* you. If existence is just truth-in-theory, then numbers *do* exist, and your claim that independent existence is unintelligible is either accepted (because independence is irrelevant) or rejected (because existence is settled). It does not support "each keeping our own sense"; it supports one sense being correct and the other being confused.

  ***

  **Summary for the Friend:**
  If our dispute were **Reading 1**, we should standardize our language, not keep our own.
  If it were **Reading 2**, we should keep arguing to find the real issue.
  If it were **Reading 3 or 4**, you are making a substantive metaphysical claim (that external questions are meaningless or that existence is deflated), which requires argumentation, not dismissal.

  In no reading does "it's just semantics" entitle you to say "we can both be right and stop talking." That move only makes sense if the dispute is **substantive** (we care about the stakes) but **intractable** (we can't settle it). Calling it "semantic" is a way to lower the stakes without admitting you're walking away from a fight you might lose.
