      *   *Verdict:* It's not that she *knows* the doom, but that her depression strips away the *illusion* of the future that Scheffler says we rely on. She lives in a world where the "afterlife" assumption is already disabled for her psychologically, even if not cosmically. The wedding fails because the participants are acting out a script of continuity that Justine cannot feel.

  4.  **Analyze Part Two ("Claire") through Scheffler:**
