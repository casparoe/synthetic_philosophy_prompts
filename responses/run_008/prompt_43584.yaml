prompt: |-
  I'm a doctoral student in contract law, and a dissertation chapter on the moral force of promissory obligation has forced me to admit that my judgments about when promises bind are stitched together from doctrine rather than principle. I'd like your help bringing them to reflective equilibrium. Below are my verdicts on a set of cases; please tell me whether a single principle captures them and, if not, which verdicts have to go.

  A promise extracted at knifepoint to pay the mugger a further sum the next day: not binding, and I feel no guilt at all about breaking it. The law says the same under the doctrine of duress, but I want the moral ground, not the doctrine: something about the promisee wronging me in the extraction seems to be what voids it. A promise induced by fraudulent misrepresentation — I pledged a large donation to what I was told was a school-building charity that is in fact a lobbying operation: not binding. A solemn promise to someone who dies before I can perform — I promised my grandfather on his deathbed to keep the family farm intact, and I now think I am bound, even though he can no longer rely on my performance, be harmed by my breach, or even know about it. A casual assurance at a party — "I'll be there Saturday, I promise" — uttered among friends in the usual tone of half-serious banter: barely binding, if at all, even though the host may genuinely plan around me. Conversely, an assurance that never uses promissory words but induces serious reliance — a parent who, by a steady course of conduct over years, leads her child to expect that she will fund her education: I think this binds as firmly as an explicit promise, which is roughly what promissory estoppel says, though again I want the principle underneath, not the doctrine. A promise to do something gravely immoral — I promised a friend I would help conceal his crime: I waver between thinking it binds and is overridden, and thinking it never binds at all; I would like the principle to decide this for me. A promise made by someone temporarily incompetent — drugged, or seven years old: not binding, its breach no worse than any other change of mind. A promise whose occasion silently disappears — I promised to look after your cat while you were away, and the trip was cancelled: nothing remains, and I notice I don't feel I have broken anything.

  Two tensions I can already see. Whatever makes the deathbed promise bind cannot be any benefit to, reliance by, or harm to the promisee, since none of these is available to a dead man; yet whatever voids the knifepoint promise seems to be a fact about the promisee. So my verdicts appear to require the bindingness of a promise to be both promisee-independent and promisee-dependent. Separately, the banter case and the estoppel case pull in opposite directions on whether it is the utterance of the words or the induced reliance that does the work.

  And here is the case I keep going back and forth on: a promise induced by a misrepresentation that made no difference to my decision. I agreed to give a keynote because I believed the organizer when she said the conference was on climate policy; it is in fact on tax law, but I would have accepted either topic — I simply like talking. Does the fraud void the promise, as it did in the charity case, or is the promise intact, as the thought that the deception changed nothing suggests? My gut delivers both verdicts at once, which I take as a sign that at least one is wrong.

  Please state the principle, or a small set of candidates, precisely; motivate each clause by pointing to the case that demands it; say what the resulting principle predicts for cases I haven't listed — for instance, a promise made to an institution, or one extracted by a threat of doing something the threatener had no right to do but that I would have tolerated anyway; and be explicit about which of my verdicts the best principle cannot save. I would rather overturn a verdict quietly than keep a principle that needs a new epicycle for each case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral student in contract law.
      *   **Task:** Help bring their intuitive verdicts on promissory obligation into "reflective equilibrium."
      *   **Input:** A set of specific case verdicts (mugger, fraud, deathbed, banter, reliance/estoppel, immoral act, incompetence, frustration/disappearance, immaterial fraud).
      *   **Identified Tensions:**
          *   Promisee-dependent (mugger/fraud) vs. Promisee-independent (deathbed).
          *   Utterance/Formality (banter) vs. Reliance (estoppel).
          *   Immaterial Fraud (the "swing" case).
      *   **Requirements:**
          *   State a principle (or small set) precisely.
          *   Motivate clauses by pointing to specific cases.
          *   Predict outcomes for new cases (institution, threatened legal action).
          *   Explicitly state which verdicts must be sacrificed if they don't fit.
          *   Tone: Academic, rigorous, philosophical, respectful of legal doctrine but seeking moral grounding.

  2.  **Deconstruct the Verdicts:**
      *   *Mugger (Duress):* Not binding. Reason: Wrongful extraction/promisee's fault.
      *   *Fraud (Charity):* Not binding. Reason: Defective consent/informational asymmetry.
      *   *Deathbed (Grandfather):* Binding. Reason: Obligation survives promisee's death (suggests obligation is agent-relative or duty-based, not reliance-based).
      *   *Banter (Party):* Not binding. Reason: Lack of serious intent/context (normative context).
      *   *Reliance (Parent/Child):* Binding. Reason: Detrimental reliance creates obligation (even without explicit words).
      *   *Immoral Act (Conceal Crime):* Wavering. Needs resolution.
      *   *Incompetence (Drugged/Child):* Not binding. Reason: Lack of capacity/agency.
      *   *Frustration (Cat/Trip Cancelled):* Not binding. Reason: Condition of the promise failed (implicit conditionality).
      *   *Immaterial Fraud (Keynote):* Wavering. Needs resolution.

  3.  **Identify the Core Theoretical Conflict:**
      *   The user is oscillating between **Will Theory** (autonomy, intent, capacity) and **Reliance Theory** (harm, expectation, estoppel).
      *   *Will Theory* explains: Mugger (defective will), Incompetence (no will), Banter (no serious will), Immoral (illegal will?), Immaterial Fraud (will was intact regarding the act).
      *   *Reliance Theory* explains: Parent/Child (reliance), Banter (if reliance occurred, though user says not binding).
      *   *Duty-Based/Deontological Theory* explains: Deathbed (duty exists regardless of reliance/harm).
      *   *The Problem:* The Deathbed case kills pure Reliance Theory. The Mugger/Fraud cases kill pure "Promise as Speech Act" Theory (unless qualified by consent quality). The Parent/Child case challenges pure "Explicit Utterance" Theory.

  4.  **Develop a Unifying Principle:**
      *   *Candidate 1: The Autonomy-Based Obligation Principle.* Promises bind because they are exercises of autonomy that create normative expectations.
          *   *Pros:* Handles Deathbed (self-imposed duty), Incompetence (no autonomy), Mugger (coerced autonomy).
          *   *Cons:* Struggles with Parent/Child (no explicit exercise) and Immaterial Fraud (autonomy wasn't technically impaired regarding the *act*).
      *   *Candidate 2: The Normative Expectation Principle.* Promises bind when they create a justified normative expectation that the promisor intends to be bound.
          *   *Pros:* Handles Banter (no justified expectation), Deathbed (justified expectation at time of making), Parent/Child (conduct creates expectation).
          *   *Cons:* Needs to account for *how* the expectation was formed (wrongfully?).
      *   *Candidate 3: A Hybrid "Valid Consent + Normative Uptake" Principle.*
          *   Obligation arises from (1) a voluntary undertaking of obligation within a normative context that supports it, provided (2) the undertaking was not procured by wrongful manipulation that vitiates consent, and (3) the obligation is not inherently immoral.
          *   *Wait, the Deathbed case:* If the promisee is dead, who holds the right? The user feels bound. This suggests the obligation is *in rem* or owed to the "world"/conscience, not just the person. Or, the right survives to heirs. Let's assume the user's intuition is that the *duty* persists.
          *   *The Immaterial Fraud:* If I would have done it anyway, did the fraud vitiate consent? Legally, often no (depending on jurisdiction/materiality). Morally? If the lie didn't change the outcome, did it wrong *me*? It wronged my right to truth, but not my decision.
          *   *The Parent/Child:* This is the hardest for Will Theory. It requires a "Conduct as Promise" clause.

      *   *Refining the Principle:* **The Principle of Normative Undertaking.**
          *   A moral obligation to perform arises when an agent voluntarily assumes a duty within a social context that recognizes such assumptions, provided the assumption is not vitiated by incapacity, coercion, or fraud *material to the commitment*, and the content is morally permissible.
          *   *Wait, Reliance:* The user says Parent/Child binds *as firmly as explicit promise*. This suggests Reliance can *generate* obligation where words didn't. This contradicts pure Will Theory.
          *   *Solution:* We need a principle that prioritizes **Autonomy** but acknowledges **Reliance** as a secondary generator of obligation when Autonomy is ambiguous but expectations are entrenched.
          *   *Better Solution:* **The Principle of Invited Trust.** (Scanlon-esque).
          *   *Principle:* One is bound if one intentionally or negligently invites another to rely on one's future conduct, and that reliance would be detrimental or the invitation was meant to create a normative constraint, *unless* the invitation was procured by wrongs or the content is immoral.
          *   *Critique:* This threatens the Deathbed case (Grandfather can't rely *now*, but could then). It fits. It threatens Banter (did I invite trust? No, context says no). It fits Mugger (no voluntary invitation).
          *   *Critique on Immaterial Fraud:* Did I invite trust based on a lie? Yes. But was the lie material to the *invitation*? If I would have come anyway, the lie didn't cause the reliance/obligation.

      *   *Let's try to find the "Best Fit" that forces the hardest choices.*
      *   The user wants to know which verdicts have to go.
      *   The strongest tension is **Deathbed (No reliance needed)** vs. **Parent/Child (Reliance creates obligation without words)**.
      *   If we go with **Will/Autonomy**: Parent/Child is weak (needs to be framed as implicit promise). Deathbed is strong. Immaterial Fraud is binding (will was intact).
      *   If we go with **Reliance/Expectation**: Deathbed is weak (why bind if no one relies?). Parent/Child is strong. Immaterial Fraud is not binding (no reliance on the lie, though reliance on the promise exists).
      *   If we go with **Fairness/Reciprocity**: Mugger (unfair). Deathbed (fairness to memory?).

      *   *Decision:* The most robust moral theory for promissory obligation that respects the Deathbed intuition is a **Normative Power Theory (Autonomy)** modified by **Fairness**.
      *   *Proposed Principle:* **The Principle of Voluntary Normative Constraint.**
      *   *Core:* You are bound when you exercise the normative power to bind yourself, provided the exercise is valid (capacity, context) and not vitiated (duress, fraud).
      *   *Handling Reliance:* Reliance is evidence of the promise, or creates a *separate* obligation (estoppel), but the *promissory* obligation itself stems from the undertaking. The user says Parent/Child binds "as firmly as an explicit promise." We can treat steady conduct as an *implicit undertaking*.
      *   *Handling Deathbed:* The obligation is to the *duty*, not the person's current welfare.
      *   *Handling Immaterial Fraud:* This is the key. If the fraud didn't affect the decision, the *voluntariness* of the undertaking regarding the *act* remains. The lie is a wrong, but does it void the *promise*?
      *   *Handling Immoral:* A promise to do wrong cannot create a moral obligation because morality trumps convention.

  5.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the problem. Validate the "stitched together" feeling (common in legal theory).
      *   **The Principle:** Formulate "The Principle of Valid Normative Undertaking."
      *   **Clauses:**
          1.  *Undertaking:* Must be voluntary and contextually recognizable (covers Banter, Incompetence, Parent/Child).
          2.  *Validity:* Must not be vitiated by wrongful interference (covers Mugger, Fraud).
          3.  *Permissibility:* Content must be moral (covers Crime).
          4.  *Conditionality:* Implicit conditions hold (covers Cat/Trip).
      *   **Addressing the Tensions:**
          *   *Promisee-Dependence:* Reframe it. It's not about the promisee's *status* (alive/dead), but the *history of the transaction* (was it wrongfully induced?). Deathbed is clean history; Mugger is dirty history.
          *   *Reliance vs. Words:* Words are the paradigmatic method of undertaking, but conduct can suffice if it signals the *intent to be bound*.
      *   **The Immaterial Fraud (The Crucial Test):**
          *   Under Valid Undertaking: If the fraud didn't touch the *decision to undertake*, the undertaking is valid. The lie is a separate tort/wrong, but the promise stands. This forces the user to choose: Is the promise void, or is there a promise + a separate lie?
          *   *Recommendation:* The promise stands. The lie is a wrong, but doesn't void the obligation to speak.
      *   **New Cases:**
          *   *Institution:* Binds (Undertaking to entity).
          *   *Threat of Legal Action (Hard Bargaining):* Binds (Threatener has a right to sue, so not "wrongful" in the same way as mugger, though maybe unconscionable).
      *   **Sacrifices:**
          *   Must sacrifice the intuition that Immaterial Fraud voids the promise (if we prioritize Autonomy).
          *   Must clarify Parent/Child: It binds not *because* of reliance, but because conduct *was* the promise (reliance is just proof). If the user thinks reliance *alone* creates it without intent, that must go.
          *   Must clarify Deathbed: It binds not because of the Grandfather's rights, but the Promisor's integrity.

  6.  **Refining the Principle (Self-Correction):**
      *   Wait, the user specifically said about Parent/Child: "assurance that never uses promissory words but induces serious reliance... binds as firmly."
      *   If I say "Conduct *was* the promise," that saves the Will Theory.
      *   If I say "Reliance creates the obligation," that saves Reliance Theory but kills Deathbed.
      *   *Best Path:* A **Hybrid Principle of Invited Reliance and Autonomy**.
      *   Actually, T.M. Scanlon's Principle F is the gold standard here. "If one intentionally leads another to expect..."
      *   Let's adapt Scanlon but tighten it for the Deathbed case. Scanlon handles Deathbed via the expectation *at the time*.
      *   Let's try to be even more precise. **The Principle of Normative Integrity.**
      *   *Core:* Promises bind because breaking them contradicts the normative position one voluntarily adopted.
      *   *Constraints:* Adoption must be competent, voluntary, and morally permissible.
      *   *Fraud:* Fraud vitiates voluntariness *if* it is material to the commitment.
      *   *Immaterial Fraud:* If not material, voluntariness stands. Promise binds. (This is the hard pill to swallow).
      *   *Deathbed:* The normative position was adopted validly. The death of the beneficiary doesn't erase the agent's normative position.
      *   *Parent/Child:* Conduct can adopt a normative position just as words can.

  7.  **Finalizing the Output Structure:**
      *   **The Principle:** "The Principle of Valid Normative Undertaking."
      *   **Breakdown:** 4 Conditions (Capacity/Context, Voluntariness, Legality, Persistence).
      *   **Application to User's Cases:** Map each case to a clause.
      *   **The Immaterial Fraud:** Give the hard answer.
      *   **New Cases:** Institution, Legal Threat.
      *   **The Sacrifice:** Explicitly state which intuition fails (likely the Immaterial Fraud voiding intuition, and potentially the "Reliance alone" intuition for the parent).

  8.  **Tone Check:** Ensure it sounds like a colleague speaking to a doctoral student. Use terms like "vitiation," "normative power," "reflective equilibrium," "counterfactual dependence."

  9.  **Final Polish:** Check the "Deathbed" explanation. Why does it bind if he's dead? Because the obligation is to the *word given*, not the *welfare of the promisee*. This distinguishes it from reliance theory. Check the "Mugger" explanation. Why void? Because the *will* was overborne. This distinguishes it from pure formality.

      *Wait, one nuance:* The user says about the Parent/Child case: "induced serious reliance... I think this binds." If I argue that the conduct *was* the promise, does that satisfy them? Yes, because it treats the conduct as communicative of intent. If they think reliance *alone* binds even without intent (strict estoppel), that conflicts with the Deathbed/Will view. I need to point out this tension. I will argue for the "Conduct as Communicative Intent" view to save equilibrium.

      *Immaterial Fraud:* If the fraud didn't change the decision, did it vitiate consent? Legally, fraud usually requires materiality. Morally, if I lied but you didn't care, did I coerce you? No. So the promise should bind. I will advise the user to accept this.

      *Immoral Promise:* It never binds. Morality is lex superior.

