answer: |-
  This is a classic problem in the jurisprudence of promises: the conflict between the **Will Theory** (promises bind because we exercise autonomy to bind ourselves) and the **Reliance Theory** (promises bind to prevent harm to those who trust us). Your intuitions are currently straddling both, which is why you feel the "stitching."

  To achieve reflective equilibrium, you cannot keep every verdict. You need a principle that explains *why* we bind ourselves, which will inevitably reclassify one or two of your edge cases.

  Here is a candidate principle that maximizes the fit with your core verdicts while demanding specific sacrifices at the margins.

  ### The Principle of Valid Normative Undertaking

  **Statement:**
  *A moral obligation to perform arises when an agent voluntarily assumes a normative constraint regarding future conduct within a social context that recognizes such assumptions, provided that:*
  1.  *(Capacity)* The agent possesses the rational capacity to understand the undertaking;
  2.  *(Voluntariness)* The assumption is not procured by wrongful coercion or deception material to the commitment;
  3.  *(Permissibility)* The content of the undertaking is not itself morally impermissible; and
  4.  *(Persistence)* The obligation survives changes in the promisee's status unless the undertaking was implicitly conditional on that status.

  ---

  ### Motivation by Case

  This principle is constructed to save your strongest intuitions while forcing clarity on the wavering ones.

  **1. The Mugger & Fraud (Charity) $\rightarrow$ Clause 2 (Voluntariness)**
  *   **Why:** Both cases involve **vitiated consent**. In the mugger case, the will is overborne by wrongful threat. In the charity case, the will is directed by wrongful falsehood.
  *   **Principle:** The obligation stems from *your* will, but a will manipulated by another's wrong does not generate a binding normative constraint. This explains why you feel no guilt: the "normative tether" was never successfully tied.

  **2. The Deathbed $\rightarrow$ Clause 4 (Persistence)**
  *   **Why:** This is the case that kills pure Reliance Theory. If obligation were based on the promisee's reliance or harm, the death of the grandfather would extinguish it.
  *   **Principle:** The obligation is **agent-relative**. You bound *yourself*. The grandfather was the beneficiary, not the source of the bond. His death changes his ability to claim, but not your duty to remain a person of your word. This resolves your tension: the mugger case is about the *origin* of the promise (tainted), while the deathbed case is about the *persistence* of the promise (untainted).

  **3. Banter vs. Parent/Child $\rightarrow$ Clause 1 & Context (Social Context)**
  *   **Why:** You feel banter doesn't bind, but parental conduct does.
  *   **Principle:** The "social context" clause does the work here. Banter occurs in a context where the normative force of words is suspended by mutual understanding. The parent's conduct occurs in a context (caregiving) where steady patterns are understood as commitments.
  *   **Crucial Distinction:** To maintain equilibrium with the Deathbed case, you must view the Parent/Child case not as "reliance creates obligation" (Reliance Theory), but as "conduct *communicated* an undertaking" (Will Theory). The reliance is *evidence* that the undertaking was understood, not the *source* of the obligation. If the parent secretly intended not to pay but the child relied anyway, under this principle, there is no promise (only perhaps a tort).

  **4. Immoral Act $\rightarrow$ Clause 3 (Permissibility)**
  *   **Why:** You wavered here.
  *   **Principle:** Morality is *lex superior*. One cannot use the normative power of promising to create an obligation to do evil. The promise is not "binding but overridden"; it is **void ab initio**. It creates no moral tether because the content falls outside the realm of permissible action. You should feel no guilt for breaking it, only for having made it.

  **5. Cat/Trip Cancelled $\rightarrow$ Clause 4 (Implicit Conditionality)**
  *   **Why:** The obligation disappears.
  *   **Principle:** Promises are interpreted within their pragmatic context. "Look after the cat while away" contains an implicit condition: "if you go away." When the condition fails, the undertaking never activates. This is not a breach; it is a non-event.

  ---

  ### The Crucial Test: Immaterial Fraud

  **The Case:** You promised to keynote based on a lie (climate vs. tax), but you would have accepted either.
  **The Principle's Verdict:** **The Promise Binds.**

  **Reasoning:**
  Clause 2 requires deception *material to the commitment*. If the lie did not change your decision, it did not vitiate your *will* regarding the act of speaking. You voluntarily undertook to give a keynote. The organizer committed a separate wrong (lying), but they did not coerce the promise itself.
  **The Sacrifice:** You must abandon the intuition that *any* fraud voids a promise. If the fraud is immaterial to the decision, the autonomy exercise remains intact. You are bound to speak, though you may have a separate claim against the organizer for the deception.

  ---

  ### Predictions for New Cases

  **1. Promise to an Institution (e.g., pledging to a University)**
  *   **Prediction:** **Binding.**
  *   **Why:** The principle requires a "social context that recognizes such assumptions." Institutions are recognized normative agents. The death of the specific officer you spoke to does not void the promise (similar to the Deathbed case), because the undertaking was to the office, not the person.

  **2. Threat of Legal Action (Hard Bargaining)**
  *   **Scenario:** "Sign this contract settling our dispute for less than you deserve, or I will sue you for everything, which I have a legal right to do."
  *   **Prediction:** **Binding (with nuance).**
  *   **Why:** Unlike the mugger, the threatener is threatening to do something they have a *right* to do (sue). Under Clause 2, this is not "wrongful coercion" in the same sense as knifepoint.
  *   **Nuance:** However, if the threat exploits a desperate vulnerability (unconscionability), some moral theories would void it. But under a strict Autonomy/Will theory, this binds. To keep your principle clean, you should likely admit this binds morally, even if the law sometimes voids it for policy reasons. The "wrong" in the mugger case is the *illegitimacy* of the threat; here the threat is legitimate, even if the outcome is harsh.

  ---

  ### The Sacrifices (Reflective Equilibrium)

  To hold this principle, you must quietly overturn two of your current intuitions:

  1.  **The Source of the Parent/Child Obligation:** You currently think reliance *makes* it binding ("induces serious reliance... I think this binds"). The principle demands you shift this view: **The conduct must amount to an implicit undertaking.** If the parent acted generously but *explicitly* said "I am not promising anything," and the child relied anyway, this principle says the parent is **not bound** (though they may have a duty of care not to harm). You must sacrifice the idea that reliance *alone* generates promissory obligation without communicative intent.
  2.  **The Immaterial Fraud:** You must accept that a lie that changes nothing does not void the promise. It is a lie, but it is not a *coercion of the will*.

  ### Summary of the Tension Resolution

  You noted a tension: *Promisee-dependent* (Mugger) vs. *Promisee-independent* (Deathbed).
  **Resolution:** The principle is **Promisee-Independent regarding Status, but Promisee-Dependent regarding History.**
  *   It doesn't matter if the promisee is alive, dead, or an institution (Status).
  *   It *does* matter how the promisee treated you during the formation (History). Did they coerce? Did they lie materially?

  If you accept that the **source of obligation is your own autonomy** (which can be vitiated by others' wrongs, but persists through others' deaths), the stitching disappears. You are not bound because they *need* you; you are bound because *you said so*, unless saying so was not truly yours to give.
