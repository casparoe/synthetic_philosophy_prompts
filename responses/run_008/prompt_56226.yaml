answer: |-
  Here is a menu of precisifications for the "What if everyone did that?" (WIEDT) slogan, tailored for your reading group. I have evaluated each against your consequentialist friend's "harmless lies" case (gifts, essay drafts).

  ### Menu of Interpretations: "What If Everyone Did That?"

  **1. The Causal-Institutional Collapse**
  *   **The Claim:** If everyone performed action *X*, the social institution or practice that makes *X* meaningful would cease to exist (e.g., if everyone lied, no one would believe anyone, so lying becomes impossible).
  *   **Plausibility:** High as a folk intuition; Medium as a Kant exegesis (fits False Promising, fits Truth-telling less well).
  *   **Substantive or Platitude:** Substantive. It identifies a dependency condition for the action.
  *   **Kantian or Consequentialist:** Kantian-adjacent (Formula of Law of Nature), but relies on empirical sociology of institutions.
  *   **Refutes "Harmless Lies"?** **No.** Benevolent deception (white lies) does not rely on a presumption of *universal* truthfulness to function; it relies on a presumption of *general* truthfulness. A world where everyone tells white lies to spare feelings is stable; trust in serious matters remains intact.
  *   **Confidence:** High.

  **2. The Aggregate Consequence**
  *   **The Claim:** While one instance of *X* is harmless, the sum total of everyone doing *X* produces significant negative utility (e.g., a culture of suspicion, accumulated anxiety).
  *   **Plausibility:** High as folk logic; Low as Kant exegesis.
  *   **Substantive or Platitude:** Substantive, but empirical.
  *   **Kantian or Consequentialist:** **Consequentialist in a costume.** It judges the act by the outcome of the universalized scenario, not the rationality of the will.
  *   **Refutes "Harmless Lies"?** **Weakly.** Your friend stipulated the lies are *harmless*. To refute them here, you must argue that "harmless" is an illusion and the aggregate cultural shift *is* the harm. This concedes the consequentialist framework rather than defeating it.
  *   **Confidence:** High.

  **3. The Practical Contradiction (Korsgaardian)**
  *   **The Claim:** In a world where everyone acts on maxim *M*, the agent's specific purpose in acting on *M* becomes impossible to achieve (the maxim defeats itself).
  *   **Plausibility:** Medium as folk logic (too technical); High as philosophical reconstruction.
  *   **Substantive or Platitude:** Highly Substantive.
  *   **Kantian or Consequentialist:** Distinctively Kantian (constructivist).
  *   **Refutes "Harmless Lies"?** **No.** If my maxim is "Lie to spare feelings," and everyone does this, my purpose (sparing feelings) is still achieved. In fact, it might be achieved *better*. The maxim does not become self-defeating in the universalized world.
  *   **Confidence:** High.

  **4. The Fairness / Free-Rider**
  *   **The Claim:** It is unfair to benefit from the restraint of others while exempting oneself from that restraint (exploiting the cooperative scheme).
  *   **Plausibility:** High as folk logic; Medium as Kant exegesis (closer to Rawls or Scanlon).
  *   **Substantive or Platitude:** Substantive (deontic, but not strictly Kantian).
  *   **Kantian or Consequentialist:** Contractarian.
  *   **Refutes "Harmless Lies"?** **No.** White lies are not typically "free-riding." They are often performed *for* the benefit of the listener. There is no cooperative scheme of "truth-telling" that the liar is exploiting for personal gain at the expense of others' restraint.
  *   **Confidence:** High.

  **5. The Character / Disposition**
  *   **The Claim:** Doing *X* cultivates a vice or erodes the moral character of the agent, making them more likely to do harmful things later.
  *   **Plausibility:** Medium as folk logic ("slippery slope"); Low as Kant exegesis (Kant focuses on the act's maxim, not habituation).
  *   **Substantive or Platitude:** Substantive, but virtue-ethical.
  *   **Kantian or Consequentialist:** Virtue Ethics (Aristotelian/Stoic).
  *   **Refutes "Harmless Lies"?** **Weakly.** It shifts the ground from "Is this lie permissible?" to "What kind of person becomes a liar?" Your friend can reply that a person capable of benevolent deception is *more* virtuous (kind) than a brutal truth-teller.
  *   **Confidence:** Medium.

  **6. The Volitional Incoherence ("Could Will")**
  *   **The Claim:** It is not that the world *cannot* exist, or that it would be *bad*, but that a rational agent *cannot coherently will* this world because it undermines a necessary end of rational agency (e.g., the capacity to set ends based on shared information).
  *   **Plausibility:** Low as folk logic (too abstract); High as strict Kant exegesis.
  *   **Substantive or Platitude:** Highly Substantive.
  *   **Kantian or Consequentialist:** Distinctively Kantian (Formula of Humanity/Ends).
  *   **Refutes "Harmless Lies"?** **Contingent.** This is the only reading with a fighting chance. It requires arguing that universal white-lying undermines the rational capacity to consent or set ends. However, if the lie is truly harmless and benevolent, it is difficult to show a contradiction in the *will* rather than just a preference for honesty.
  *   **Confidence:** Medium.

  ***

  ### The "Soft Ground": Where I Am Least Sure

  **The Modality of "Could Will" (Item 6)**

  I am least confident in the stability of the **Volitional Incoherence** reading when applied to non-paradigmatic cases like harmless lies.

  **Why:** The distinction between "I cannot will this because it is irrational" (Kant) and "I cannot will this because I wouldn't like it" (Consequentialist/Preference) is notoriously porous in the secondary literature.
  *   If the argument is that universal lying undermines the *capacity for rational choice* (because choice requires accurate information), it risks proving too much (forbidding fiction, politeness, etc.).
  *   If the argument is that universal lying undermines *trust*, it collapses back into the Causal-Collapse reading (Item 1), which we know fails for white lies.
  *   To make this stick against your friend, you have to argue that there is a **duty to not interfere with another's rational agency even for their own perceived good** (paternalism objection). But grounding *that* duty purely in the "Could Will" modality without smuggling in a value judgment about the state of the world is the hardest lift in Kantian ethics.

  **Recommendation for the Group:**
  Don't let the group rest on the slogan. Force them to pick a number from the menu. If they pick 1, 2, 3, or 4, your friend wins the "harmless lie" case. If they pick 6, the debate actually begins on the nature of rational agency and paternalism, which is where you want to be.
