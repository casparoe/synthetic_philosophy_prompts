prompt: |-
  I'm in a small ethics reading group (two philosophy grad students, a lawyer friend, and me) and for the better part of a year we've been circling the same fight about what deception and coercion actually do to consent, and we are completely stuck. The setup: everyone agrees lying to someone to get them into bed is wrong, and everyone agrees blackmailing them is worse. The fight is about the mechanism. One camp says consent is basically a normative power you exercise — like signing a contract — so when you're deceived, the consent still *happened*, it's just tainted, and the wrong is a separate wrong (fraud, manipulation) layered on top. The other camp says consent is fundamentally a choice, and a choice made on false premises isn't a corrupted instance of consent but no consent at all — the deception doesn't make the consent bad, it makes it absent. Our lawyer keeps muddying things by pointing out that contract law has already solved this in her favor: contracts induced by fraud are void*able*, not void, so why should bedroom consent work differently? And the grad students keep insisting that the actual patchwork in criminal law is the real data any theory has to explain — deception about the nature of the act voids consent outright, deception about identity sometimes does, deception about your income or your fidelity basically never does — and that any account that can't reproduce that graded structure is just not fit for purpose.

  We've tried the obvious moves. Someone proposed distinguishing deception about the act itself from deception about the surrounding world, and that lasted one meeting before the counterexample about a swapped twin (same "act," deceived about who) killed it. Someone else proposed a "but-for" causal test — if she wouldn't have agreed had she known, no consent — and that collapsed immediately because it would invalidate consent obtained by, say, hiding your vasectomy from someone who wants kids, which nobody at the table wanted to call rape. Coercion produces the same stall in miniature: we all agree a gun to the head vitiates, we all agree a boss leaning on a subordinate at least taints, but no one can say *where* the line is or what makes the line fall where it does, and every criterion we propose (would a reasonable person refuse? was there a threat or just an offer? was the pressure wrongful or just unfortunate?) gets picked apart within twenty minutes.

  My working hypothesis, and I'd like you to actually evaluate it rather than just take it on: the stall isn't because anyone is being dense, it's because the two camps are answering two different questions under one word. The "consent as choice" people are really doing moral psychology — they care about what happened inside the person's head and whether it counts as an autonomous exercise of agency. The "consent as signature" people, and probably the law, are really doing normative bookkeeping — they care about what permissions and liabilities the act generates downstream, which is why the law can afford graded responses (void, voidable, valid-but-actionable) that the psychology camp finds incoherent. If that's right, then maybe the disagreement is largely verbal and the real fight is about which function the word consent *should* be reserved for, which would be a normative question about conceptual engineering, not a discovery about the nature of consent. But I'm not sure — the camps also seem to genuinely disagree about whether deception victims are *wronged in the same way* as outright refusals, which doesn't feel verbal. So: diagnose the disagreement for me. Is it verbal, substantive-but-ill-posed, two projects with one label, or a real disagreement about which of consent's functions we should care about most? Use what each side actually argues, not a survey of positions. And then tell me honestly what would count as progress given your diagnosis — a distinction, a test case, a way of splitting the question, or whether this is just one of those debates where the sides should agree to use different words and stop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A small ethics reading group (2 philosophy grad students, 1 lawyer, 1 user) stuck in a year-long debate about deception, coercion, and consent.
      *   **The Core Dispute:**
          *   Camp A (Normative Power/Signature): Consent happens but is tainted (fraud layered on top). Analogy: Contract law (voidable, not void).
          *   Camp B (Moral Psychology/Choice): Consent is absent if based on false premises. Analogy: Autonomy/Agency (no valid choice made).
          *   Lawyer's Point: Contract law distinguishes void vs. voidable; why not sex?
          *   Grad Students' Point: Criminal law has a graded structure (nature of act vs. identity vs. collateral); theory must explain this.
          *   Failed Tests: Act vs. Surroundings (killed by swapped twin), But-For Causal Test (killed by vasectomy example).
          *   Coercion Parallel: Gun to head (vitiates) vs. Boss pressure (taints); line is unclear.
      *   **User's Hypothesis:** The stall is because they are answering two different questions under one word ("Consent"). Camp B = Moral Psychology (internal agency). Camp A + Law = Normative Bookkeeping (permissions/liabilities). The disagreement might be verbal/conceptual engineering rather than metaphysical discovery.
      *   **User's Doubt:** Camps also disagree on *how* victims are wronged (same way as refusal vs. different), which feels substantive, not verbal.
      *   **Task:** Diagnose the disagreement (Verbal? Substantive-but-ill-posed? Two projects? Real disagreement about function?). Use the specific arguments provided. Then, advise on what counts as progress (distinction, test case, splitting the question, or give up).

  2.  **Deconstruct the Positions:**
      *   **Camp A (Normative Power/Contractual):** Focuses on the *transactional* validity. Consent transfers a right or permission. If I sign a contract under fraud, I signed it. The signature is real. The *enforceability* is the issue. This aligns with the Lawyer's view (voidable).
      *   **Camp B (Moral Psychology/Autonomy):** Focuses on the *internal state*. Consent is an attitude of willingness. If the attitude is based on a lie, the attitude doesn't match the reality. Therefore, the mental state required for consent is missing. This aligns with the "no consent at all" view.
      *   **The Law (Grad Students' constraint):** The law is pragmatic. It distinguishes *fraud in the factum* (void) vs. *fraud in the inducement* (voidable). It needs clear lines for liability.
      *   **The User's Hypothesis:** It's a category error. One side talks psychology, the other talks norms.

  3.  **Evaluate the User's Hypothesis:**
      *   *Is it purely verbal?* No. The user notes they disagree on whether the victim is wronged *in the same way* as a refusal. If Camp B says "It's rape" and Camp A says "It's sexual assault via fraud," the moral weight differs.
      *   *Is it two projects?* Yes, largely. One is descriptive/phenomenological (what is the mental act?), the other is normative/juridical (what are the consequences?).
      *   *Is it substantive?* Yes, because the definition of consent determines the moral verdict. If consent is absent (Camp B), the act is a violation of bodily integrity *simpliciter*. If consent is tainted (Camp A), the act is a violation of trust/autonomy *plus* a permissible physical act.
      *   *The "Wrongness" Disagreement:* This is the key. Camp B thinks the wrong is *battery* (unpermitted touching). Camp A thinks the wrong is *fraud* (permitted touching obtained wrongly). This is a substantive moral disagreement, not just semantic.

  4.  **Diagnose the Disagreement:**
      *   It is **not merely verbal**. If it were, they could agree on the facts and just argue about the label. They argue about the *moral status of the act*.
      *   It is **not merely two projects**. They are trying to solve the same problem (when is sex permissible?) using different tools.
      *   It **is a disagreement about the function of consent**.
          *   Camp B sees consent as a **protective shield** for autonomy. If the shield is tricked, it's down.
          *   Camp A sees consent as a **normative transfer**. The transfer occurred, but the conditions were flawed.
      *   *Crucial Insight:* The Lawyer is right about contract law, but the Grad Students are right that criminal law treats bodily integrity differently than property. The "Void vs. Voidable" distinction in law *maps* onto the "Absent vs. Tainted" distinction in ethics, but the *threshold* for voiding is the fight.
      *   *The Real Stalemate:* They are fighting over **which deceptions go to the essence of the act**.
          *   Camp B wants a principle that says "Any deal-breaking lie voids consent." (Rejected due to vasectomy case).
          *   Camp A wants a principle that says "Consent is valid unless the act itself is different." (Rejected due to twin case).
      *   *Diagnosis:* It's a **substantive disagreement about the scope of autonomy**, masked as a semantic debate about the definition of consent. They agree on the paradigm cases (gun = no consent, income lie = consent) but disagree on the *principle* that separates them.

  5.  **Formulate the Advice/Path Forward:**
      *   **Validate the User:** The hypothesis is sharp but slightly underestimates the moral stakes. It's not *just* conceptual engineering; it's about what autonomy *protects*.
      *   **Reframe the Debate:** Stop asking "What is consent?" Ask "What interests does consent protect?"
          *   If it protects **Bodily Integrity**, then deception about the *body* or the *physical act* vitiates consent (Twin case: different body. Vasectomy: same body/act).
          *   If it protects **Decisional Autonomy**, then any deal-breaking lie vitiates consent (Vasectomy case: deal-breaker).
      *   **The "Hybrid" Solution:** Most modern theories (e.g., Alexander, Hurd, Wertheimer) suggest consent is a *normative power* exercised via a *mental state*. The mental state must match the normative transfer.
      *   **Progress Strategy:**
          1.  **Acknowledge the Dual Nature:** Consent *is* both a mental state and a normative act. The debate is about the *link* between them.
          2.  **Adopt the Legal Distinction (Ethically):** Fraud in the *factum* (nature of act) vs. Fraud in the *inducement* (reasons for act).
          3.  **The Test Case:** The "Contraception Lie" vs. "Vasectomy Lie." Why is stealing a sperm different from hiding a vasectomy? (One creates a risk, the other prevents a result).
          4.  **Coercion:** Distinguish **Threats** (worsen baseline) vs. **Offers** (improve baseline). Coercion works by manipulating the baseline. Deception works by manipulating the information set.
      *   **Recommendation:** Don't split the word. Split the *criteria for validity*. Agree that consent is a normative power (Camp A) that *requires* a specific quality of mental state (Camp B) to be *effective*. The fight is about the *quality threshold*.

  6.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, peer-to-peer (acknowledge the sophistication of the group).
      *   *Structure:*
          1.  Evaluate the Hypothesis (It's 80% right, but misses the moral stakes).
          2.  Diagnose the Disagreement (Substantive disagreement about the *scope of autonomy*, not just semantics).
          3.  Address the Lawyer & Grad Students (Law is pragmatic, Ethics seeks principles).
          4.  Path to Progress (Shift from "What is consent?" to "What makes consent valid?").
          5.  Specific Moves (Factum vs. Inducement, Baseline for Coercion).
      *   *Key Distinction:* The "Essential Features" test. What makes *this* act the one consented to?
      *   *Coercion:* Wrongful threats vs. Hard choices.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "Use the law." The grad students want a *theory* that explains the law, not just a restatement of it.
      *   *Correction:* The user's hypothesis about "Moral Psychology vs. Normative Bookkeeping" is actually a known philosophical distinction (Psychological vs. Normative accounts of consent). I should validate that this is a standard impasse in the literature (e.g., O'Neill vs. others).
      *   *Insight:* The "Vasectomy" case is the killer for the "But-For" test. The "Twin" case is the killer for the "Physical Act" test. The solution usually lies in **Risk** or **Essential Properties**.
      *   *Final Verdict:* It's a substantive disagreement about *which aspects of a situation an agent has authority over*.

  8.  **Final Polish:** Ensure the distinction between "Void" (never existed) and "Voidable" (exists until challenged) is mapped to the ethical "No Consent" vs. "Vitiated Consent." Ensure the coercion section addresses the "Threat vs. Offer" distinction clearly.

  *(Self-Correction on the User's Hypothesis)*: The user thinks it might be verbal. I need to push back gently. It's not verbal because the *consequences* differ morally (Rape vs. Fraud). If it were verbal, they could say "Okay, you call it No Consent, I call it Tainted Consent, but we agree on the punishment." They don't agree on the punishment/moral weight. So it's substantive.

  *(Plan for Coercion)*: The coercion stall is about the **baseline**. A gun changes the normative baseline (illegitimate threat). A boss offer changes the options but not the baseline rights. The line is **Wrongfulness of the Proposal**, not the severity of the pressure.

  *(Final Plan)*:
  1. Validate the "Two Projects" insight (it's strong).
  2. Correct the "Verbal" conclusion (it's substantive because it determines the *type* of wrong).
  3. Propose the "Validity Conditions" shift.
  4. Give specific tools for Deception (Factum/Inducement + Risk) and Coercion (Wrongful Threats).
  5. Conclude on whether to split words (No, split criteria).

  Let's write.
answer: |-
  Your hypothesis is sharp, and it diagnoses about 80% of the problem correctly. You have correctly identified that your group is conflating the **phenomenology of consent** (what happens in the head) with the **normative effect of consent** (what permissions are generated). However, I disagree with your conclusion that the disagreement is *merely* verbal or a matter of conceptual engineering.

  If this were purely verbal, you could say, "Okay, Camp A calls it 'Tainted Consent' and Camp B calls it 'No Consent,' but we agree on the moral verdict." But you don't. Camp B thinks the victim is wronged *in the same way* as a refusal (a violation of bodily integrity/battery). Camp A thinks the victim is wronged *differently* (a violation of trust/autonomy, but the touching itself was permitted). That is a substantive moral disagreement, not a semantic one.

  Here is the diagnosis of the stall, followed by a specific roadmap for progress.

  ### 1. The Diagnosis: A Substantive Disagreement About the Scope of Authority

  The stall isn't just that you are answering different questions; it's that you are disagreeing about **what we have authority over.**

  *   **Camp B (Moral Psychology/Choice)** operates on a principle of **Decisional Autonomy**. They believe we have authority over the *conditions of our choice*. If any material condition is falsified, my authority was bypassed. To them, consent is a mental state of willingness. If the mental state is corrupted, the consent is absent.
  *   **Camp A (Normative Power/Signature)** operates on a principle of **Transactional Validity**. They believe we have authority over the *act itself*. Once I communicate willingness, I have transferred the permission. The lie is a separate moral wrong (fraud), but it doesn't retroactively un-transfer the permission. To them, consent is a normative act (like a promise).

  **Why the "Vasectomy" and "Twin" cases kill your current tests:**
  *   **The But-For Test (Camp B's tendency):** Fails on the vasectomy. If "would you have done it if you knew?" is the test, hiding a vasectomy is rape. Most people intuitively feel it is *wrong*, but not *rape*. This suggests we do not have authority over *all* deal-breakers, only *some*.
  *   **The Physical Act Test (Camp A's tendency):** Fails on the twin. The physical act (penetration, motion, sensation) is identical. If consent is only about the physical act, the twin case is valid consent. Most people intuitively feel it is *rape*. This suggests we have authority over more than just the physics of the touch.

  **The Lawyer's Contribution:**
  Your lawyer is technically right about contract law, but the Grad Students are right that criminal law treats bodily integrity differently than property. In contract law, *fraud in the inducement* (lying about income to get a loan) makes a contract voidable. In sex, *fraud in the inducement* (lying about income to get sex) is usually not a crime. But *fraud in the factum* (lying about the nature of the act) is rape.
  The law's "patchwork" isn't random; it tracks a distinction your group hasn't successfully formalized yet.

  ### 2. The Path to Progress: Stop Defining "Consent," Start Defining "Validity"

  You are stuck because you are trying to define the noun ("What *is* consent?"). You should instead be defining the adjective ("When is consent *valid*?").

  Consent is a **normative power exercised via a mental state.** Both camps agree on this hybrid structure implicitly. The fight is about the **validity conditions** of that exercise.

  Here is how you break the stalemate:

  #### A. For Deception: Adopt "Essential Features" + "Risk Creation"
  Stop trying to distinguish "Act vs. Surroundings." Instead, distinguish **Essential Features of the Act** vs. **Collateral Benefits.**

  1.  **The Essential Features Test:** Consent is valid only if the deception does not concern a feature that makes the act *the kind of act it is*.
      *   *Twin Case:* Sexual intimacy with *you* is an essential feature. Swapping twins changes the kind of act (sex with me vs. sex with my brother). Consent is void.
      *   *Vasectomy Case:* Fertility is a *consequence* of the act, not an essential feature of the physical act itself. Consent is valid (though the lie is wrongful).
      *   *Condom Sabotage:* This is the hard case. Is "protected sex" a different *kind* of act than "unprotected sex"? Most modern theories say yes, because it fundamentally alters the *risk profile* of the bodily intrusion.

  2.  **The Risk Creation Principle:** This explains why the vasectomy lie isn't rape, but condom sabotage often is treated closer to it.
      *   Lying about a vasectomy *prevents* a potential outcome (pregnancy).
      *   Lying about a condom *creates* a new risk (pregnancy/disease) that was not consented to.
      *   **Proposal:** Deception vitiates consent when it **transforms the risk profile of the bodily intrusion** or **changes the identity of the partner.** It does not vitiate consent when it lies about collateral traits (wealth, fidelity, love) that do not alter the physical risk or identity.

  This satisfies the Grad Students (it explains the criminal law gradations) and Camp A (it acknowledges consent happened, but was invalid due to scope) and Camp B (it acknowledges the mental state was insufficient for *this* risk).

  #### B. For Coercion: The "Wrongful Proposal" Test
  Your group is stuck on coercion because you are measuring the **pressure** (how hard is the boss leaning?) rather than the **proposal** (what is the boss offering?).

  1.  **Threats vs. Offers:**
      *   A **Threat** proposes to make someone worse off than their **moral baseline** if they refuse. (e.g., "If you don't sleep with me, I'll fire you" — firing you for refusal is wrongful).
      *   An **Offer** proposes to make someone better off than their moral baseline if they accept. (e.g., "If you sleep with me, I'll promote you" — promoting you is permissible, though the quid pro quo is wrongful).
      *   *The Gun:* "Money or life" is a threat because the shooter has no right to take your life.

  2.  **The Line:** Coercion vitiates consent when the proposal itself is **wrongful**, not when the pressure is "too high."
      *   A boss leaning on a subordinate is coercive not because the subordinate feels pressured (they might feel very pressured), but because the boss is leveraging a power dynamic in a way that violates the subordinate's right to a workplace free from sexual exigency.
      *   **Progress Move:** Agree that coercion is not about the *psychological state of the victim* (Camp B's trap) but about the **moral legitimacy of the proposer's leverage** (Camp A's strength).

  ### 3. Should You Split the Word?

  **No.** Do not agree to use different words. That is a surrender that leaves the moral disagreement unresolved.

  If Camp B says "That's No Consent" and Camp A says "That's Tainted Consent," you still have to decide: *Do we prosecute this as rape or as fraud?* You cannot solve the policy question by splitting the vocabulary.

  **Instead, split the *criteria*.**
  Adopt a **Two-Tier Model of Consent**:
  1.  **Threshold Consent (The "Signature"):** Did the person communicate willingness? (Camp A wins here. If you say yes, you pass the threshold).
  2.  **Validating Conditions (The "Psychology"):** Was that communication informed enough and free enough to transfer the specific permission at stake? (Camp B wins here. If the info was false on essential features, the transfer fails).

  ### 4. Summary of the Intervention

  Bring this to your next meeting:

  1.  **Acknowledge the User's Hypothesis:** "We are conflating the *mental state* with the *normative transfer*. But the disagreement is substantive because it determines the *type of wrong* (battery vs. fraud)."
  2.  **Propose the Shift:** "Let's stop asking 'Is this consent?' and start asking 'Is this consent *valid for this specific act*?'"
  3.  **Test the "Risk/Identity" Standard:**
      *   Does the lie change *who* is touching me? (Twin = No Consent).
      *   Does the lie change the *physical risks* of the touching? (Condom = No Consent).
      *   Does the lie change the *social/financial outcomes* of the touching? (Vasectomy/Income = Consent exists, but fraud occurred).
  4.  **Test the "Wrongful Leverage" Standard for Coercion:**
      *   Did the proposer threaten to violate a right to get compliance? (Yes = Coercion/No Consent).
      *   Did the proposer offer a benefit conditioned on compliance? (Yes = Coercion/Valid Consent but Wrongful Act).

  **Verdict:** This is not a debate where you should agree to disagree. It is a debate where you have exhausted the **binary** options (Consent vs. No Consent) and need to move to a **scalar** or **conditional** model (Consent is valid *relative to* specific features of the act). If you make that move, the Grad Students get their graded structure, the Lawyer gets her void/voidable distinction, and Camp B gets to protect autonomy without calling every lie rape.
