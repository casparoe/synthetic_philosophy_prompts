          *   *Actually, the cheapest revision to save coherence:* Modify (1). Don't claim exploitability justifies *all* accepted axioms equally, or acknowledge that Allais violations *are* potentially dynamically inconsistent but you accept a specific defense (like Machina's or Regret Theory's specific structure) that avoids the pump *in risk* but not *in ambiguity*.
          *   *Better suggestion:* The tension between (3) and (4) is the easiest to fix verbally. The tension between (1) and (2) is the hardest. The prompt asks for the "single cheapest revision... to keep as much of the card as possible."
          *   If I tell them to fix (3)/(4), they still get hammered on (1)/(2).
          *   If I tell them to fix (1)/(2), they might have to drop (2).
          *   *Strategic advice:* The (3)/(4) tension is a "paper tiger" if phrased right. The (1)/(2)/(5) cluster is the real vulnerability. The *cheapest revision* is to nuance (1) to acknowledge that Independence is rejected *despite* some dynamic consistency costs, or to nuance (5) to explain why Ambiguity pumps work where Risk pumps don't.
          *   *Wait, let's look at (3) again.* "Getting $0 after passing up a sure $1M is worse... because of what I could have had instead." This makes utility state-dependent or action-dependent. If utility depends on the *foregone option*, (4) "value... exhausted by how good its outcomes are" is threatened. An "outcome" usually means a world-state. If the world-state is identical ($0 in bank), but the utility differs based on the path, is it still consequentialist? Yes, if the "outcome" includes the history. But (4) says "nothing extra attaches to... the story of how you got there." **Bingo.**
          *   *Correction:* (3) explicitly says the badness is due to "what I could have had instead." (4) says "Nothing extra attaches to... the story of how you got there." If the regret is about the *choice* (the story), (4) is violated. If the regret is about the *state* (I am in a state of knowing I missed out), (4) is saved. The user needs to be precise here. This is the "cheapest revision" because it's a clarification of terms, not a substantive change in preference.

      *   *Re-evaluating the (1)/(2)/(5) cluster:* This is the "Load-Bearing" tension. The workshop attackers will pounce here. The user claims (1) exploitability justifies the axioms they keep, and (5) exploitability kills Ellsberg. But standard literature (e.g., Rabinowicz, Gustafsson) suggests Allais preferences *are* money-pumpable (e.g., via sequential choices). If the user says Allais is rational (2) but Ellsberg is irrational (5) based on the *same* metric (1), they are vulnerable.
      *   *Decision:* I will rank the (1)/(2)/(5) cluster as the genuine trouble. I will rank (3)/(4) as the "look that way but fixable" tension. The cheapest revision is to clarify (4) to explicitly encompass regret-states, preventing a semantic attack, so they can save their energy for the hard defense of Allais vs. Ellsberg.

