      *   **(3) Justification for Allais:** Regret/Disappointment is part of the *outcome's* badness. $0 + Regret < $0. *Implication:* Outcome individuation includes emotional states/conterfactuals.
      *   **(4) Consequentialism:** Value of a gamble = outcomes + probabilities. No extra value to the "texture" or "history." *Implication:* Reductionism about lotteries.
      *   **(5) Ellsberg Paradox:** Ambiguity aversion is *irrational*. Will defend using arguments from (1) (exploitability). *Implication:* Accepts Sure Thing Principle (or similar) in ambiguity contexts, unlike Allais contexts.

  3.  **Evaluate Potential Tensions:**

      *   **Tension A: (3) vs. (4) [Regret vs. Consequentialism]**
          *   *User's Worry:* Is counting regret compatible with saying value is exhausted by outcomes?
          *   *Analysis:* This is a classic move in decision theory (e.g., Loomes & Sugden, Regret Theory). If you define "outcome" broadly enough to include "knowing you could have had $1M," then (3) is just a specific claim about utility assignment within the framework of (4).
          *   *Verdict:* This is likely a *false* tension, provided the user is precise about "outcome." However, there's a subtle risk: if the regret depends on the *foregone gamble* rather than the *foregone outcome*, it might violate state-wise dominance or look like non-consequentialism. But the user says "because of what I could have had instead." This sounds like outcome-based regret.
