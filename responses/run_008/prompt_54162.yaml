      *   **Rank 1 (Critical): (1) vs. (2) & (5).** The core tension is the *criterion* of rationality. If exploitability/dynamic consistency is the gold standard (1), it is notoriously hard to exempt Allais choices (2) while condemning Ellsberg choices (5). Standard money pumps apply to Allais violators too (e.g., the "switching" pump). The distinction between Risk and Ambiguity needs to be robust enough to survive the (1) test.
