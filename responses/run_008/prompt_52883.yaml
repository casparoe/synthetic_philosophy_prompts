answer: |-
  Your worries are well-founded. The book you are reading appears to be a classic case of "popularization drift," where nuanced philosophical distinctions are smoothed over to make a narrative, resulting in claims that are technically imprecise or outright false by contemporary standards. While the book gets the *story* of Max Black right, its metaphysical conclusions are far more contentious than it admits.

  Here is an audit of the book's claims, followed by a detailed address of your three specific worries.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Leibniz's Law... states... if two things share absolutely every property, they are in fact one thing."*
  *   **Verdict:** **Misleading Terminology.**
  *   **Analysis:** In professional metaphysics and logic, "Leibniz's Law" almost universally refers to the *Indiscernibility of Identicals* (if $x$ is identical to $y$, they share all properties). The principle the book describes is the *Identity of Indiscernibles* (PII). While often grouped under "Leibniz's Principles," conflating the two names is a major source of confusion (see your first worry).

  **Claim 2:** *"Max Black's famous thought experiment... two iron spheres... identical in composition, mass, temperature..."*
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is a faithful summary of Black's 1952 paper, "The Identity of Indiscernibles."

  **Claim 3:** *"No observation made from inside that universe could ever tell the spheres apart."*
  *   **Verdict:** **Accurate (Epistemically), but loaded.**
  *   **Analysis:** It is true that no *observer* could distinguish them. However, Black's argument relies on the stronger metaphysical claim that there *are* no distinguishing properties, not just that we cannot access them.

  **Claim 4:** *"Black used this to show that Leibniz's Law is false."*
  *   **Verdict:** **Accurate (regarding Black's intent).**
  *   **Analysis:** Black did intend to refute the Identity of Indiscernibles. However, because the book conflates PII with "Leibniz's Law" (see Claim 1), it implies Black refuted the logical law of substitution, which he did not.

  **Claim 5:** *"The obvious rescue... property of being this very sphere... dismisses it as cheating."*
  *   **Verdict:** **Contested/Philosophical Stance.**
  *   **Analysis:** Calling this "cheating" is not a neutral logical assessment; it is a substantive metaphysical stance against *haecceities* (primitive "thisness"). Many metaphysicians accept haecceities; many reject them. Dismissing them as "cheating" begs the question against those who think individuation requires something beyond qualitative properties.

  **Claim 6:** *"Black's example therefore refuted the identity of indiscernibles outright."*
  *   **Verdict:** **False/Exaggerated.**
  *   **Analysis:** Black's example refutes a *strong* version of PII (one that excludes relational properties or spatial position). It does not refute *all* versions. Furthermore, whether the example succeeds depends on one's theory of space (Absolute vs. Relational).

  **Claim 7:** *"No philosopher since has accepted it as more than a rule of thumb for scientific practice."*
  *   **Verdict:** **False.**
  *   **Analysis:** This is demonstrably incorrect. PII is a live topic in metaphysics and philosophy of physics. Many philosophers defend restricted versions of PII, particularly in the context of Quantum Mechanics (e.g., regarding fermions).

  **Claim 8:** *"Leibniz's own argument... is now of merely historical interest."*
  *   **Verdict:** **Mostly Accurate.**
  *   **Analysis:** Few contemporary philosophers rely on the theological Principle of Sufficient Reason (PSR) to ground metaphysics, though the logical structure of the PSR is still debated.

  ---

  ### Part 2: Addressing Your Specific Worries

  #### Worry 1: Conflating the Two Directions of the Principle
  You are absolutely correct. This is the most significant technical error in the book's summary.

  *   **The Indiscernibility of Identicals (II):** $\forall F (Fx \leftrightarrow Fy) \leftarrow x = y$.
      *   *Meaning:* If $x$ and $y$ are the same object, they must share all properties.
      *   *Status:* Logically uncontroversial. It licenses substitution in logic. Black's spheres do **not** threaten this.
  *   **The Identity of Indiscernibles (PII):** $\forall F (Fx \leftrightarrow Fy) \rightarrow x = y$.
      *   *Meaning:* If $x$ and $y$ share all properties, they must be the same object.
      *   *Status:* Metaphysically controversial. This is what Black attacks.

  **Why this matters for your essay:** If you write that "Black refuted Leibniz's Law," a knowledgeable reader will assume you mean he refuted the logical law of substitution (II), which is nonsense. You must specify that Black targeted the *Identity of Indiscernibles*.

  #### Worry 2: Epistemic vs. Metaphysical Distinction
  Your intuition here is also correct. The book slides between "we can't tell them apart" (epistemic) and "they don't differ" (metaphysical).

  Black's argument works only if we assume **Absolute Space** (a Newtonian view). If space is absolute, then "being at location $L_1$" is a property distinct from "being at location $L_2$." In that case, the spheres *do* differ qualitatively (by position), and PII is saved.
  To make his counterexample work, Black has to stipulate that spatial position is not an intrinsic property, or that the universe is symmetric such that "left of" and "right of" have no grounding without a third reference point.

  **The Metaphysical Point:** The debate isn't about whether an observer *could* measure a difference; it's about whether the universe *contains* a difference. If the universe is perfectly symmetric, does it contain two spheres, or one sphere described twice? Leibniz would argue the latter (Relationism). Black argues the former (Substantivalism). The book presents Black's conclusion as a settled fact, when it is actually a choice between competing theories of space.

  #### Worry 3: Relations and "Weak Discernibility"
  You are not garbling this; you are recalling a significant development in 21st-century philosophy of physics.

  In 2006, philosopher of physics **Simon Saunders** (building on work by F.A. Muller and others) argued that Black's spheres *are* discernible, just not by *monadic* (intrinsic) properties. They are discernible by **irreflexive relations**.
  *   Sphere $a$ bears the relation "is one mile away from" to Sphere $b$.
  *   Sphere $a$ does *not* bear the relation "is one mile away from" to Sphere $a$.
  *   Therefore, $a$ and $b$ satisfy different relational profiles.

  This is called **Weak Discernibility**. It saves a version of PII by expanding the "properties" allowed in the principle to include irreflexive relations. This is particularly important in Quantum Mechanics. For example, fermions (like electrons) obey the Pauli Exclusion Principle, which prevents them from occupying the same quantum state. This is often interpreted as nature enforcing a version of PII via weak discernibility.

  **The Book's Error:** By claiming PII is "refuted outright," the book ignores the last 30 years of work on weak discernibility and quantum statistics.

  ---

  ### Part 3: The "Cheating" Objection (Haecceities)
  The book dismisses the "this very sphere" property (haecceity) as cheating. A metaphysician would say this is too quick.

  *   **The Pro-Haecceity View:** Individuation is primitive. Things are distinct simply because they are distinct, not because they have different qualities. On this view, PII is false, but not because of Black's spheres; it's false because reality contains primitive thisness.
  *   **The Anti-Haecceity View:** All facts must be qualitative. To say "this is this" adds no information. On this view, allowing haecceities makes PII **trivially true** (because you can always define the property "being identical to $x$"), but it renders the principle useless for explaining *why* things are distinct.

  **Audit:** The book treats the anti-haecceity view as the default. It is not. It is one side of a major debate. Dismissing haecceities as "cheating" is a rhetorical move, not a logical proof.

  ---

  ### Part 4: Conclusion for Your Essay
  The book's conclusion—that PII is refuted and abandoned—is false.

  1.  **Status of PII:** It is currently viewed as **contingent** or **restricted**. It may hold for fermions but not bosons in quantum mechanics. It may hold for macroscopic objects if we allow relational properties (weak discernibility).
  2.  **Reliance:** Do not rely on this book for the current state of the debate. It presents a mid-20th-century consensus (Black's victory) as an eternal truth.
  3.  **Recommendation:**
      *   Use the book only for the description of Black's thought experiment.
      *   Cite **Max Black (1952)** for the original argument.
      *   Cite **Simon Saunders (2006)** or **Keränen (2001)** for the "weak discernibility" counter-counter-argument.
      *   Cite **Robert Adams (1979)** for a nuanced defense of PII.
      *   Clarify the distinction between the *Indiscernibility of Identicals* (uncontroversial) and the *Identity of Indiscernibles* (controversial).

  **Summary Verdict:** The book is a reliable guide to the *history* of the argument up to 1960, but an unreliable guide to the *metaphysics* or the *current status* of the field. Your instincts to question the conflation of laws, the epistemic slide, and the dismissal of relational differences are all correct.
