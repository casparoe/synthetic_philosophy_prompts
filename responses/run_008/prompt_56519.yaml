prompt: |-
  I'm teaching intro logic this semester and next week my section is Russell's paradox, fifty minutes, students who only met sets two weeks ago (we've done notation, unions, intersections, subsets). Don't explain the paradox to me — I know it — plan how I should explain *them*. What has to come before what: does naive comprehension have to be stated explicitly before the punchline, or does stating it up front spoil the surprise? And what example should carry the whole thing — I'm torn between the barber version and having them invent a catalogue of all library catalogues that don't list themselves. Which one carries more of the actual set-theoretic content, and which one should I drop and why? Also: which misconceptions should I expect (my guesses are "it's just a word trick", "self-reference is always bad", maybe "so sets were never real") and where in the sequence I should head off each one. What should I openly refuse to cover at this level — I'm inclined to leave ZFC entirely out, tell me if that's a mistake — and what one question can I ask at the end to see whether the idea landed rather than them just nodding along. And flag where this plan is most likely to fail: which part of the ordering do you have least confidence in, and what would a response going differently tell you that you'd built the sequence wrong?
