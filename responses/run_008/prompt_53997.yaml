      *   *The Trap:* If the mapping is robust enough to sustain the vocabulary, the audience will argue the ontology is preserved (Functionalism).
      *   *Verdict:* It *does* risk collapsing into instrumentalism or trivial realism.
      *   *Fallback:* Lean into *Revisionary Pragmatism*. Don't claim the ontology is *gone*, claim it's *misdescribed* by folk terms, but the terms are tools, not mirrors.

  6.  **Drafting the Content (Iterative refinement):**

