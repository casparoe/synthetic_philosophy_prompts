answer: |-
  This is a sharp historiographical observation. You are correct that the adage is not a neutral descriptive tool; it is a theoretical engine that tends to drive the analysis toward specific conclusions about agency and causality. By auditing the metaphor, we can see how it structurally privileges the Revisionist (Furet) interpretation over the Social (Lefebvre/Soboul) one, regardless of the speaker's intent.

  Here is an audit of the metaphor "revolutions devour their children" as applied to 1789–1794.

  ### 1. The Mapping

  To understand the work the metaphor is doing, we must identify the agents in the imagery.

  *   **The Parent (The Devourer):** In this construction, "The Revolution" is reified into a singular, living organism or a mythological entity (akin to Saturn). It is granted agency distinct from the people participating in it. It is no longer a sequence of events made by humans; it is a force that acts *upon* humans.
  *   **The Children (The Devoured):** These are the revolutionary actors (Girondins, Hébertists, Dantonists, eventually Robespierre). Crucially, the metaphor inverts the historical chronology of agency. Historically, these men *created* the Revolution through political action in 1789. The metaphor, however, casts them as *products* of the Revolution. They are not the parents of the new order; they are its offspring. This strips them of political autonomy and renders them subject to the "Parent's" biological imperatives.
  *   **The Appetite (The Mechanism):** This is the most loaded variable. What is the hunger?
      *   In a **Social interpretation**, the appetite would be *material scarcity* or *class conflict* (the revolution eats its children because the economic base cannot sustain the political superstructure).
      *   In the **Revisionist usage** (which your seminar seems to favor), the appetite is *ideological totalization*. The hunger is for purity, unity, or the logical conclusion of democratic absolutism. The "appetite" is the internal logic of 1789 unfolding to its extreme, rather than a response to bread prices or Austrian armies.

  ### 2. Where the Mapping Breaks

  The metaphor fails to hold water when tested against the historical contingencies you mentioned. The breakdown occurs at two structural points:

  **A. Teleology vs. Contingency (The "Natural Course" Problem)**
  The metaphor implies a lifecycle. Organisms are born, grow, and eventually consume their young as part of a natural (albeit tragic) cycle. By using this image, the speaker naturalizes the Terror. It suggests that 1793–94 was the *maturity* of the Revolution, the moment the organism revealed its true nature.

  However, your professor bundles this with the claim that 1789–91 was the "real" revolution and the Terror a "betrayal." This creates a logical fracture.
  *   If the Revolution *naturally* devours its children, the Terror is **essential**, not a betrayal.
  *   If the Terror is a **betrayal**, then the Revolution does *not* naturally devour its children; something external corrupted it.
  The metaphor cannot support the "betrayal" thesis. It supports the "unfolding" thesis. By using the adage while arguing for a "betrayal," the seminar is smuggling in the idea that the *seeds* of the betrayal were present in the parent (1789), which is the core Furet argument (the ideological drift began immediately), even if the conclusion claims 1793 was a deviation.

  **B. Endogeneity vs. Exogeneity (The "Internal Hunger" Problem)**
  "Devouring" is an internal act. A parent eats a child at the dinner table; it is a domestic tragedy. This framing erases the geopolitical and environmental context.
  *   **The Metaphor says:** Robespierre killed Danton because the Revolution was hungry for more purity (Internal/Ideological).
  *   **The History says:** Robespierre killed Danton because the Republic was collapsing under foreign invasion, civil war, and hyperinflation, and factional squabbling threatened the war effort (External/Contingent).

  The metaphor renders the Coalition, the Vendée, and the assignat crisis invisible. It transforms a defensive militarization of politics into a psychological or sociological inevitability. It frames the guillotine as a tool of fratricide rather than a (brutal) instrument of state survival. If the pressure is external, the revolution isn't "devouring" its children; it is sacrificing them to a foreign god (War). The metaphor denies the sacrifice; it insists on the meal.

  ### 3. The Conclusion: Does the Adage Support the Interpretation?

  You asked whether the conclusion (1793 as pathology) is supported by the adage, or if the interpretation is carrying the adage.

  **The metaphor is carrying the interpretation.**

  Here is why: The adage "revolutions devour their children" is tautological. It defines the Revolution *by* its violence. If you accept the metaphor as a valid explanatory framework, you have already accepted that the Terror is the Revolution's defining characteristic, not an aberration.

  *   **If 1793 is a pathology:** You are arguing that the Revolution went *wrong*. But the adage suggests this is what revolutions *do*. If all revolutions devour their children, it is not a pathology; it is a feature.
  *   **If 1793 is a stage:** You are arguing this was a phase in a continuum (Soboul). The adage supports this *only if* you view the Revolution as a monolithic ideological entity (Furet).

  The reason your professor can bundle the adage with the "1789 was real, 1793 was betrayal" narrative is that the metaphor does the quiet work of **depoliticizing the actors**.
  *   By making the leaders "children," it suggests they lost control of the machine they built.
  *   By making the Revolution the "parent," it suggests the ideology itself was the killer.

  This aligns perfectly with Furet's *Interpreting the French Revolution*, which argues that the Terror was not a response to circumstances but the inevitable result of the discursive structure of 1789 (the claim to represent the "General Will"). The metaphor supports the "pathology" conclusion only if you define the pathology as **ideological determinism**.

  **Verdict:**
  The adage cannot support the idea that 1793 was a *deviation* from 1789. It can only support the idea that 1793 was the *truth* of 1789. If your seminar uses the adage to explain the deaths but claims the Terror was a betrayal of the Constitutional settlement, they are using a metaphor that contradicts their own periodization. The adage argues for continuity (the Parent eats the Child); the "betrayal" thesis argues for discontinuity (the Child was murdered by a Stranger).

  In short: The metaphor is a Revisionist trojan horse. It looks like a colorful summary of events, but it structurally eliminates contingency, external pressure, and class conflict, leaving only the "ideological appetite" of the Revolution itself as the cause of death. It forces you to accept that the Terror came from *within* the logic of 1789, which is precisely the historiographical battle you are fighting.
