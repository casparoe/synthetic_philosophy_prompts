      *   *Idea 6: The "Commitment Device" (Selected).* Person considers signing a contract that penalizes quitting (e.g., a strict gym contract or a writing commitment).
      *   *Idea 7: The "Volunteer Leader" (Selected).* Person considers volunteering to lead a community project.
          *   Decision: Volunteer to lead.
          *   Class 1: All community projects (high failure rate).
          *   Class 2: All community projects led by volunteers who *chose* to lead (vs. assigned).
