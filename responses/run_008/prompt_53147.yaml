      *   *Idea 2: Dieting.* Person considers a specific extreme diet. Class A: Everyone who tries the diet (high dropout/failure). Class B: Everyone who *sticks* to the diet (high success). Problem: This is classic survivorship bias, but does the *decision* put them in the class? Yes, but the outcome depends on future adherence, not just the decision.
      *   *Idea 3: Moving to a City for Jobs.* Person considers moving to Silicon Valley for tech jobs. Class A: All people who move to SV (many struggle). Class B: All people who move to SV *and* get a job within 3 months. Problem: The decision is "move," the class B is defined by the outcome "get job." That's circular.
      *   *Idea 4: Buying a Franchise.* Person considers buying a specific franchise (e.g., Subway). Class A: All small business owners (high failure). Class B: All franchise owners (lower failure). Class C: All franchise owners who *wanted* to buy a franchise vs. those who inherited it.
