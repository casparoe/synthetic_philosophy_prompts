          *   Actually, if Class 2 (lock owners) has high burglary rates, does that mean the lock *fails*? Or that the risk is high?
          *   If the statistic is "Burglary rate among lock owners," and it's high, it implies "Even with a lock, people like you get burglarized." That might suggest *declining* (lock doesn't help).
          *   I need the statistic to suggest *accepting*.
          *   Let's flip it.
          *   Decision: Join a "High-Intensity Accountability Group" to finish a thesis.
          *   Class 1: All grad students (50% finish).
          *   Class 2: All grad students who join accountability groups (90% finish).
          *   Verdict 1: Don't bother, base rate is low.
          *   Verdict 2: Join, people like you succeed.
          *   Twist: People only join if they are already motivated. The decision to join selects for motivation.
          *   If I join, I enter Class 2. Class 2 has high success. So I should join?
          *   But if I join *just* to get the stats, without the motivation, I might not succeed.
          *   The reference class problem: Am I "A grad student" or "A grad student who joins groups"?
          *   The decision *makes* me the latter.
          *   This fits better. The act of deciding creates the membership.
          *   Let's refine the "Verdict" conflict.
          *   Class 1 (All students): Probability of success is low. Cost of group is high. Expected utility negative. -> Decline.
          *   Class 2 (Joiners): Probability of success is high. Expected utility positive. -> Accept.
          *   The problem: The high success rate of Class 2 is *because* of the self-selection (motivated students join), not necessarily *caused* by the group.
          *   So, if I use Class 2, I overestimate the benefit. If I use Class 1, I underestimate my personal probability (because I am choosing to join, implying motivation).
          *   This is the core tension.

  6.  **Finalizing the Scenario (Thesis Accountability):**
