          2.  The decision must *affect* which reference class the person falls into (self-selection bias/endogeneity). The statistics are drawn from a group defined by making the same choice.
          3.  Different reference classes must yield conflicting verdicts (Accept vs. Decline).
          4.  Structure: Quick brainstorm (internal), one paragraph scenario, walkthrough (decision, classes, verdicts, why it's a problem), attack from a "one correct class" proponent, and whether that attack works on standard examples.
