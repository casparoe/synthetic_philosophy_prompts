      *   Feature doing the work: Endogeneity/Self-selection bias inherent in the class definition relative to the decision.
      *   Removal: If we remove the self-selection (e.g., locks are assigned randomly), Class 2 becomes a causal test, not a reference class problem. It becomes a standard actuarial table.
      *   Attack: "One Correct Class" proponent says: "The correct class is 'Homeowners with your specific risk profile who *would* buy a lock'."
