          *   Decision: Start the watch.
          *   Class A: All neighborhoods (baseline crime).
          *   Class B: Neighborhoods that started watches (higher crime usually, because why else start one?).
          *   Verdict: Class A says "you're safe enough," Class B says "you're in a high crime zone."
          *   Does the decision affect the class? Yes, by starting it, you join the "watch neighborhood" class.
          *   Does this change what you should do? If you want to know if crime will go down, you need to know the effect of the watch. If you want to know your risk profile, joining the class changes your profile.
          *   Let's refine this. The prompt asks for a case where the reference class problem changes what a person should *DO*.
          *   Decision: Install a security system.
          *   Class 1: All homeowners (low burglary rate).
          *   Class 2: All homeowners with security systems (high burglary rate).
          *   Why? Because people only install systems if they feel at risk.
          *   Verdict 1 (All homeowners): Don't bother, risk is low.
          *   Verdict 2 (Homeowners with systems): Install it, because people like you (who install) get burglarized more.
          *   Wait, if I install it, I join Class 2. Class 2 has high burglary rates. Does that mean I *should* install it? Yes, because I'm high risk. But Class 1 says I'm low risk.
          *   The problem: The statistics for Class 2 are contaminated by the reason they joined Class 2 (high risk).
          *   This fits the "self-selection" constraint perfectly. The act of deciding (installing) puts you in the class (owners with systems), but the class statistics are skewed because only high-risk people decide to install.
          *   Let's polish this into a realistic scenario. Buying a specific anti-theft device.

