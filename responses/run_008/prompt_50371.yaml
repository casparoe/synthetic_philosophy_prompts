  ## Part 1: Logical Space & Structure (TA Guide)

  **Design Logic:**
  The tree prioritizes the *shape* of history first (Linear vs. Cyclical), as this is the most intuitive distinction for students. From there, it branches by *unit of analysis* (what is moving?) and *agency* (can we change it?). This avoids requiring students to know dates or terminology before reading.

  **Differentiation Strategy:**
  *   **Spengler vs. Toynbee:** Separated by **Agency**. Spengler views cultures as biological organisms with fixed lifespans (fatalistic); Toynbee views them as responders to challenges (volitional).
  *   **Polybius vs. Ibn Khaldun:** Separated by **Unit**. Polybius focuses on *constitutional forms* (Monarchy -> Tyranny, etc.); Khaldun focuses on *social cohesion/dynasties* (Nomad -> Settled -> Decadent).
  *   **Vico:** Isolated by the **Reset** mechanic. Unlike Spengler (death) or Toynbee (survival), Vico argues history *restarts* the same stages (*corsi e ricorsi*).
  *   **Linear Positions:** Separated by **Driver** (Divine vs. Secular) and **Mechanism** (Reason vs. Conflict vs. Decay).

  **Empty Nodes (Unoccupied Logical Space):**
  1.  **Linear + Divine + Decline:** (The "Pessimistic Theology" Node).
      *   *Why Empty:* Incoherent/Unattractive within the canon. Christian teleology (Augustine, etc.) posits a divine plan ending in salvation/redemption. A divine plan guaranteeing only decline contradicts the notion of Providence.
  2.  **Cyclical + Culture + Biological + Escapable:** (The "Spengler/Toynbee Hybrid" Node).
      *   *Why Empty:* Incoherent. If a culture's lifespan is biologically fixed (Spengler), it cannot be escaped by virtue (Toynbee). You cannot hold both determinism and agency regarding the *lifespan* itself.
  3.  **Linear + Secular + Guaranteed Utopia + No Conflict:**
      *   *Why Empty:* Unexplored/Unattractive. Enlightenment progress assumes improvement but rarely guarantees a final "heaven on earth" without friction. Marxism guarantees the end-state but *requires* conflict. A secular, guaranteed utopia without struggle is logically possible but historically unsupported by major thinkers in this list.

