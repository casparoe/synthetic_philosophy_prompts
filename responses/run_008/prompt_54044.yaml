answer: |-
  Your set of verdicts is remarkably coherent, displaying a nuanced grasp of the distinction between physical substrate and moral function. Seven of your eight verdicts align neatly with a **Capacity-Based Account**, wherein brain size is merely evidence for the psychological capacities that actually ground moral status. However, the eighth verdict (the anencephalic infant versus the pig) introduces a tension that cannot be resolved without modifying the principle or accepting a hybrid theory.

  Below, I set out the principle that best captures the majority of your intuitions, analyse where the friction lies, and apply the account to your novel cases.

  ### The Principle: Actual and Dispositional Capacity

  > **Moral status is grounded exclusively in the actual and dispositional capacities for sentience, agency, and social relation. Physical attributes, such as brain mass or ratio, possess no intrinsic moral weight; they matter only epistemically, insofar as they reliably indicate the presence of these capacities. However, where a being belongs to a kind typically characterised by high-level agency, it retains a baseline moral status commensurate with that kind, even if current capacities are diminished, provided this does not entail disregarding the actual sentience of other beings.**

  This principle is composed of two clauses. The first captures the bulk of your verdicts; the second is an attempt to accommodate the 'hard case', though as we shall see, it creates theoretical friction.

  #### Mapping the Verdicts

  1.  **Microcephalic Adult:** Captured by the first clause ('actual capacities'). Despite small size, the 'rich social and emotional life' confirms the relevant capacities are present. Size is discounted as unreliable evidence.
  2.  **Blue Whale:** Captured by the first clause. Large brain size is overridden by the assessment that the whale's *capacities* (agency, self-awareness) do not exceed the human baseline.
  3.  **Mouse Lemur vs. Chimpanzee:** Captured by the first clause. Ratio is dismissed as irrelevant; the chimpanzee's superior cognitive complexity (actual capacity) grants it higher standing.
  4.  **Neanderthals:** Captured by the first clause. Slight size differences are morally inert because the capacities were equivalent.
  5.  **Crow vs. Simpler Animal:** Captured by the first clause. The crow's 'causal and social intelligence' (capacity) outweighs the larger brain of the simpler animal.
  6.  **Hypothetical Doubled-Brain Human:** Captured by the first clause. No change in capacity means no change in status; substrate is inert.
  7.  **Hypothetical Super-Being:** Captured by the first clause. Vastly greater understanding and self-awareness (greater capacity) justify higher moral standing.
  8.  **Anencephalic Infant vs. Pig:** This is the friction point. The infant lacks *actual* capacity. To prioritise the infant, we must rely on the second clause ('belongs to a kind typically characterised by high-level agency'). The pig has *actual* sentience, but the infant has *kind-relative potentiality* or species membership.

  ### The Tension: Must a Verdict be Abandoned?

  I must be candid: **Verdict 8 is the outlier.** It cannot be reconciled with Verdicts 1–7 without compromising the parsimony of the Capacity-Based Account.

  Verdicts 1–7 collectively assert that *what you can do and experience* matters, not *what you are made of* or *what species you belong to*. Verdict 8 asserts that *species membership* (or the potential normal for that species) can outweigh *actual sentience*.

  If you wish to maintain a single, unified principle, **Verdict 8 is the one you should consider abandoning or modifying.**
  *   **Why?** If moral status is grounded in capacities (as 1–7 insist), a being with no functioning cortex (no capacity for experience or agency) cannot have higher status than a sentient, social being (the pig). To hold otherwise is to privilege biological humanity over functional moral relevance, which contradicts the logic used to defend the microcephalic adult (where function saved status despite abnormal biology).
  *   **The Alternative:** If you feel Verdict 8 is non-negotiable (perhaps due to the special value of human potential or the tragedy of lost life), you must accept a **Dual-Grounding Theory**. This posits that moral status is grounded *partly* in capacity and *partly* in species-relative potentiality. This is philosophically costlier, as it invites charges of speciesism, but it accurately reflects your specific set of intuitions.

  ### Application to New Cases

  Assuming we adopt the **Capacity-Based Account** (prioritising Verdicts 1–7), here is how the principle applies to your unlisted cases:

  **1. The Elephant**
  *   **Description:** Large brain, but fewer cortical neurons than primates; high sentience, complex memory, social grief.
  *   **Verdict:** The elephant matters considerably more than a mouse or a crow, likely approaching the moral status of great apes.
  *   **Reasoning:** Brain size alone is insufficient (per the Whale verdict). We look to the *capacities*. The elephant demonstrates profound sentience and social agency. Its status is high because of what its brain *does*, not its mass. It may not reach full 'personhood' status if it lacks certain reflexive cognitive capacities, but its interests weigh heavily.

  **2. The Corvid-like Alien**
  *   **Description:** Tiny brain (bird-sized), but human-level cognition, language, and self-awareness.
  *   **Verdict:** Equal moral status to a human.
  *   **Reasoning:** This follows directly from the Microcephalic and Hypothetical Human verdicts. Substrate is irrelevant. If the *capacities* are human-level, the moral status is human-level. The tiny brain is merely evidence that their biology is more efficient than ours, not that they matter less.

  **3. The Distributed Extraterrestrial**
  *   **Description:** Cognition distributed across several modest organs; no single large brain.
  *   **Verdict:** Moral status determined by the integrated cognitive output.
  *   **Reasoning:** This tests the 'brain size' metric directly. If the distributed system yields self-awareness and sentience equivalent to a human, status is equal. If the distribution fragments consciousness such that there is no unified subject of experience, status might be lower. The principle demands we look for the *locus of experience*, not the locus of mass.

  ### The Epistemic Role of Brain Size

  You asked whether the distinction between grounding and indicating leaves room for brain size to matter epistemically. **It does, and significantly.**

  In cases where we cannot observe behaviour directly—such as with long-extinct species—brain size (specifically encephalisation quotient and cortical neuron estimates) serves as our primary **proxy evidence**.
  *   **Application to Neanderthals:** We judge them our equals not merely because their brains were large, but because the size and structure suggest the *capacity* for language, tool use, and social planning.
  *   **Application to Dinosaurs:** A *Tyrannosaurus rex* had a large brain, but a low brain-to-body ratio and a structure indicative of instinct rather than complex agency. We judge it to have lower moral status (likely mere sentience, if any) based on this neural evidence.
  *   **Limit:** As your verdicts on the Whale and Crow show, this evidence is defeasible. If we discovered a fossil with a small brain but evidence of complex tool manufacture, we would have to revise our estimate of their moral status upwards. Brain size is a heuristic, not a rule.

  ### Conclusion

  Your intuitions are largely those of a **Capacity Prioritist**. You consistently reject physical metrics (size, ratio) in favour of functional metrics (intelligence, sentience, sociality).

  *   **Unified Principle:** If you adopt the view that *only* actual and dispositional capacities ground status, you achieve a elegant, unified theory that explains seven of your eight verdicts and handles the new cases cleanly.
  *   **The Cost:** To maintain this unity, you must reconsider Verdict 8. On a strict capacity view, the healthy pig has higher moral status than the anencephalic infant, because the pig has interests (it can suffer and flourish) while the infant does not.
  *   **The Compromise:** If you cannot accept that the pig matters more, you must acknowledge that your moral theory is hybrid: it is mostly capacity-based, but includes a 'human kind' safeguard for those who cannot exercise capacity. This is a defensible position, but you should recognise it as a distinct commitment that sits uneasily with the logic of your other verdicts.

  In sum, brain size is never the *ground* of moral worth, but it remains a vital *guide* to where that worth is to be found—unless, as in the case of the anencephalic infant, you choose to value the *kind* over the *capacity*.
