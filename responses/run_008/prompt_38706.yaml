prompt: |-
  i'm a phd student in political theory, and my dissertation chapter on the ethics of secession has drifted way off into straight philosophy, so apologies if this is a mess. i keep circling something about diplomatic recognition and can't find a frame for it, so let me just lay out the practice.

  international lawyers will tell you — it's in basically every textbook, and it's even stated in treaties like the Montevideo convention — that recognition doesn't make a state a state. statehood comes from facts on the ground (territory, population, effective government), and recognizing is just acknowledging that those facts obtain; this is the so-called declaratory theory. but the actual behavior of states doesn't look much like that. states switch recognition: the US in 1979 stopped recognizing the government in Taipei and started recognizing the one in Beijing, which treats a country's standing as something that can be reassigned — and you can't "re-assign" a factual verdict, that's just changing your mind about the same fact. states withdraw recognition decades after granting it, for openly political reasons. some entities get recognized while plainly failing the effectiveness criteria, others meet them and stay unrecognized. and there's this thing where recognition from small or disliked states seems to not really count: Kosovo has a lot of recognizers, but everyone behaves as if what matters is recognition by major powers or admission to the UN, as though recognition from certain quarters is nearly worthless. meanwhile some actors (the EU, roughly, in the early 90s) made recognition conditional on internal stuff like democracy, rule of law, minority protection — which is bizarre if recognition is just noticing that some government effectively controls a territory.

  so here's my question. what does this practice actually presuppose about what recognition *is*? my instinct is the lawyers' theory is doing no real work and the practice only makes sense on something like a constitutive view — recognition as conferring a status rather than registering one. and i've been reading Hegel's master–slave section for the chapter, which suggests a sharper version: there, recognition only counts when it comes from someone you count as an equal — the master's problem is that he's being recognized by someone he refuses to recognize back, so the recognition he gets is worthless to him. read through that, the diplomatic practice seems to presuppose both that status is conferred, and that the conferral is only efficacious between parties already counted as peers — which sits oddly on top of an official ideology of sovereign equality where everyone is a peer by definition. so: reconstruct what the practice presupposes, tell me whether the declaratory theory can actually explain any of the parts i listed (the switching, the withdrawals, the conditionality, the discounting of small-state recognition) or whether it's pure fiction, say whether the parts presuppose one consistent thing or several inconsistent ones, and sketch what the practice would have to look like if we took the lawyers' theory seriously and rebuilt it to be consistent. i'd also like to know which parts are genuinely forced on the practice and which could go either way — i don't want to write the chapter claiming the whole institution secretly rests on one theory if several theories would license most of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in Political Theory.
      *   **Context:** Dissertation chapter on the ethics of secession, specifically focusing on diplomatic recognition.
      *   **Problem:** The chapter has drifted into philosophy (which is fine, given the field), but the user is stuck on framing the *practice* of recognition versus the *legal theory* (declaratory vs. constitutive).
      *   **Key Observations by User:**
          *   Legal theory (Declaratory/Montevideo): Recognition = acknowledging facts (territory, population, gov).
          *   Actual Practice: Switching recognition (US/China/Taiwan), withdrawing recognition, conditional recognition (EU criteria), hierarchical recognition (major powers matter more than small states).
          *   Hegelian Insight: Recognition requires mutual equality/peer status to be efficacious (Master-Slave dialectic).
          *   Tension: Sovereign equality (legal fiction) vs. Hierarchical recognition (political reality).
      *   **Tasks:**
          1.  Reconstruct what the practice *actually* presupposes about recognition.
          2.  Evaluate if Declaratory Theory can explain the observed practices (switching, withdrawals, conditionality, discounting).
          3.  Determine if the practice presupposes one consistent thing or inconsistent things.
          4.  Sketch what practice would look like if Declaratory Theory were taken seriously/consistently.
          5.  Distinguish between what is "forced" on the practice vs. contingent (could go either way).

  2.  **Deconstruct the Core Tension (Declaratory vs. Constitutive):**
      *   *Declaratory:* Statehood is a fact. Recognition is epistemic (knowing the fact).
      *   *Constitutive:* Statehood is a status. Recognition is performative (creating the status).
      *   *User's Hegelian Twist:* Recognition is relational and hierarchical. It's not just "creating" status, it's "validating" status within a community of peers.

  3.  **Address Task 1: What does the practice presuppose?**
      *   The practice treats recognition as *political*, not legal/epistemic.
      *   It presupposes recognition is a *gift* or *act of will*, not a discovery.
      *   It presupposes a *hierarchy* of recognizers (Great Powers > Small States).
      *   It presupposes recognition is *revocable* (unlike facts).
      *   *Synthesis:* The practice presupposes a **Political-Constitutive** model, but specifically a **Hierarchical-Relational** one. It's not just "constitutive" in the sense of "bringing into being," but "admitting into the club."

  4.  **Address Task 2: Can Declaratory Theory explain the practices?**
      *   *Switching (US/PRC/ROC):* No. Facts don't switch. If ROC was a state, it remains a state until it ceases to exist factually. Switching implies political choice.
      *   *Withdrawals:* No. You don't withdraw acknowledgment of a fact unless the fact changes. If the state still exists, withdrawal is political punishment.
      *   *Conditionality (EU):* No. Effectiveness doesn't require democracy. Conditioning on norms implies recognition is a reward for behavior, not acknowledgment of existence.
      *   *Discounting Small States:* No. A fact is a fact regardless of who acknowledges it. If 1+1=2, it doesn't matter if a Nobel laureate or a child says it.
      *   *Verdict:* Declaratory theory explains *none* of these well. It is largely "pure fiction" in the realm of high politics, though it retains utility in low-level legal disputes (e.g., immunity in courts).

  5.  **Address Task 3: Consistency of the Practice:**
      *   Is it one consistent thing? No. It's a hybrid.
      *   *Layer 1 (Legal):* Declaratory (for courts, immunity, technicalities).
      *   *Layer 2 (Political):* Constitutive/Hierarchical (for alliances, UN seats, legitimacy).
      *   *Layer 3 (Normative):* Conditional (human rights, democracy).
      *   *Tension:* The system runs on the *fiction* of sovereign equality (Declaratory) to maintain order, while operating on the *reality* of hierarchy (Constitutive) to maintain power. This is an "organized hypocrisy" (Krasner).

  6.  **Address Task 4: Sketching a Consistent Declaratory Practice:**
      *   If we took Declaratory seriously:
          *   Recognition would be automatic upon meeting Montevideo criteria.
          *   No switching (unless the entity dissolves).
          *   No conditionality (internal politics irrelevant).
          *   All recognitions equal (binary: state or not).
          *   Withdrawal only upon factual dissolution.
      *   *Result:* A world more like a land registry. Less political leverage, more stability for de facto entities, less leverage for human rights promotion.

  7.  **Address Task 5: Forced vs. Contingent:**
      *   *Forced:* The political nature of recognition is forced by the anarchic structure of the international system (no central enforcer). States *must* use recognition as a tool of foreign policy.
      *   *Contingent:* The specific hierarchy (UN P5 vs. others), the specific conditions (liberal democracy vs. stability), and the specific fiction (sovereign equality). We could imagine a system with a central adjudicator (World State?) where declaratory theory works.
      *   *Hegelian Point:* The requirement for *mutual* recognition is forced by the nature of legitimacy, but the *hierarchy* of who counts as a peer is contingent on power distributions.

  8.  **Integrate the Hegelian Angle:**
      *   This is crucial for a Pol Theory dissertation.
      *   Hegel helps explain *why* the declaratory theory fails. Recognition isn't cognitive; it's normative.
      *   The "Master-Slave" dynamic explains the hierarchy. A small state recognizing a secessionist movement doesn't confer legitimacy because the small state isn't recognized as a "full peer" by the hegemon.
      *   The tension: Sovereign equality says all are peers. Practice says only Great Powers are full peers. This is the "scandal" of the system.

  9.  **Drafting the Response:**
      *   *Tone:* Academic, rigorous, sympathetic to the theoretical drift (it's Pol Theory, after all), but structured.
      *   *Structure:*
          1.  Validate the Hegelian turn (it's the right move).
          2.  Diagnose the Declaratory/Constitutive gap.
          3.  Analyze the specific practices (Switching, Withdrawal, Conditionality, Hierarchy).
          4.  Reconstruct the underlying presuppositions (The "Political-Constitutive" model).
          5.  Sketch the "Pure Declaratory" counterfactual.
          6.  Distinguish Forced vs. Contingent.
          7.  Conclusion/Advice for the Chapter.

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't dismiss international law entirely. Declaratory theory *does* work in domestic courts (e.g., Act of State doctrine). Need to acknowledge the duality.
      *   *Nuance:* The "Constitutive" view isn't just "I make you a state." It's "I admit you to the community." This aligns better with Hegel.
      *   *Key Terminology:* Use "Performative," "Illocutionary," "Organized Hypocrisy," "Status vs. Fact."
      *   *Hegel:* Ensure the Master-Slave analogy is precise. It's about the *value* of the recognition, not just the act.

  11. **Final Polish:** Check against the user's specific prompts (reconstruct, evaluate declaratory, consistency, sketch alternative, forced vs. contingent). Ensure the voice is appropriate for a PhD peer/advisor. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is not a mess; this is the exact point where political theory earns its keep. International law provides the vocabulary, but it cannot explain the grammar of the practice. You are correct to feel that the declaratory theory is doing no heavy lifting in the examples you listed. If you try to force the practice into the declaratory frame, you end up describing states as irrational actors who constantly misunderstand basic facts.

  Here is a reconstruction of the presuppositions of the practice, an evaluation of the declaratory theory, and a sketch of the forced versus contingent elements, incorporating your Hegelian insight.

  ### 1. What the Practice Actually Presupposes
  The practice of diplomatic recognition presupposes a **Political-Constitutive** model, specifically one that is **Relational and Hierarchical**.

  *   **Performative, not Constative:** In speech-act terms, the declaratory theory treats recognition as *constative* (describing a state of affairs). The practice treats it as *performative* (bringing a status into being). When the US recognizes Beijing over Taipei, it is not updating a database based on new terrain surveys; it is altering the political reality of who gets to sit at the table.
  *   **Recognition as Admission, not Observation:** The practice presupposes that statehood is not a natural kind (like a mountain or a river) but a social status (like being a "member" or a "citizen"). You cannot be a member without the existing members admitting you.
  *   **The Hierarchy of Recognizers:** Crucially, as your Hegelian reading suggests, the practice presupposes that not all recognizers are equal. Recognition is not binary (State/Not-State); it is weighted. Recognition from a hegemon confers *legitimacy*; recognition from a pariah or a micro-state confers mere *existence*. This contradicts the legal fiction of sovereign equality.
  *   **Revocability of Status:** By withdrawing recognition, states presuppose that statehood is a privilege that can be revoked, not a fact that can only cease upon dissolution.

  **The Hegelian Synthesis:**
  Your instinct to use the *Master-Slave* dialectic is theoretically robust here. In Hegel, self-consciousness exists only in being acknowledged. But critically, **the value of the acknowledgment depends on the status of the acknowledger.**
  *   If a secessionist entity is recognized only by states that the hegemon considers "inferior" or "irrelevant," the entity remains in a position of dependency (the Slave). It exists, but it has no standing.
  *   To achieve full "Stateness" (Self-Consciousness), the entity requires recognition from those it *also* recognizes as peers (the Great Powers/UN Security Council).
  *   **The Contradiction:** The legal system claims universal sovereign equality (everyone is a Master/Peer). The political practice operates on a hierarchy of recognition (only some Masters count). The tension you are circling is the gap between the *ontology of law* (equality) and the *ontology of politics* (hierarchy).

  ### 2. Can the Declaratory Theory Explain the Practice?
  Short answer: **No.** It explains almost none of the specific behaviors you listed. It functions as a "useful fiction" for technical legal disputes (e.g., immunity in domestic courts), but it collapses under political scrutiny.

  *   **Switching (US/PRC/ROC):** Declaratory theory cannot explain this. If the ROC possessed the facts of statehood in 1978, it possessed them in 1979. Facts do not shift based on diplomatic cables. Switching presupposes that recognition is a *political alignment*, not a factual verdict.
  *   **Withdrawals:** You cannot withdraw acknowledgment of a fact unless the fact disappears. When states withdraw recognition from a government that still controls the territory (e.g., Western states withdrawing recognition from the Taliban pre-2021, or various Arab states withdrawing recognition from Egypt after Camp David), they are punishing the *policy*, not assessing the *statehood*. This presupposes recognition is a *tool of leverage*.
  *   **Conditionality (EU Criteria):** The EU's conditioning of recognition on human rights or minority protection in the 1990s explicitly rejects the declaratory view. Effectiveness (control) was deemed insufficient. This presupposes recognition is a *normative reward* for good behavior, not a registration of effective control.
  *   **Discounting Small-State Recognition:** If statehood were a fact, the testimony of 100 small states would outweigh the testimony of 1 superpower (epistemically). That the opposite is true politically proves that recognition is about *power validation*, not truth-tracking.

  **Verdict:** The declaratory theory is not "false" in a vacuum, but it is **functionally fictitious** in the realm of high politics. It serves as a shield against claims of illegality ("We aren't interfering, we are just acknowledging facts"), but it does not drive the behavior.

  ### 3. Is the Practice Consistent?
  The practice is **structurally inconsistent**, but this inconsistency is functional. It is what Stephen Krasner called "organized hypocrisy."

  *   **Inconsistency:** The system runs on two operating systems simultaneously.
      1.  *Legal/Technical:* Declaratory (used for treaties, borders, immunity).
      2.  *Political/Strategic:* Constitutive/Hierarchical (used for alliances, UN seats, legitimacy).
  *   **Why it persists:** If the system were fully Constitutive, it would be too cynical and unstable (states would vanish whenever alliances shifted). If it were fully Declaratory, great powers would lose a major tool of foreign policy leverage.
  *   **The Hegelian Conflict:** The system claims to be a community of mutual recognition among equals (Hegel's "Universal Self-Consciousness"), but it operates as a struggle for recognition among unequals. The practice presupposes that **legitimacy flows downward from the powerful**, while **legal sovereignty flows upward from the people/territory.** These two sources of authority are constantly at war.

  ### 4. Sketch: What if We Took Declaratory Theory Seriously?
  If you rebuilt the institution to be consistent with the lawyers' theory (a "Pure Declaratory" regime), it would look like a **Land Registry** rather than a **Club**.

  *   **Automaticity:** Upon meeting Montevideo criteria (verified by a neutral technical body, not states), an entity becomes a state. No diplomatic notes required.
  *   **Irrevocability:** Recognition could not be withdrawn unless the entity factually dissolved (lost territory/population). Diplomatic spats would not affect status.
  *   **Binary Equality:** Recognition from Nauru would carry the same legal weight as recognition from the US. UN admission would be automatic upon statehood verification.
  *   **No Conditionality:** Internal politics (democracy,人权) would be legally irrelevant to existence. A genocidal regime that controls territory is a state; a democratic resistance that doesn't is not.
  *   **Consequence:** This would stabilize borders (harder to de-recognize states) but remove the international community's primary non-military lever for enforcing norms. It would likely lead to *more* de facto states (Somaliland, Transnistria) but *less* normative convergence.

  ### 5. Forced vs. Contingent Elements
  For your chapter, distinguishing these is vital to avoid over-determinism.

  **What is Forced on the Practice (Structural Constraints):**
  *   **The Political Nature of Recognition:** In an anarchic system without a global sovereign, recognition *must* be political. There is no neutral arbiter to declare "facts." Therefore, states *must* use recognition as a tool of policy. A purely declaratory system is impossible without a World State to adjudicate the facts.
  *   **The Hierarchical Value of Recognition:** As per your Hegelian insight, recognition is only efficacious if it comes from a "peer." In a system of unequal power, "peer status" will inevitably cluster around the powerful. It is structurally forced that recognition from a hegemon matters more than recognition from a client state.
  *   **The Duality:** The tension between law (equality) and politics (hierarchy) is forced by the nature of the international system itself.

  **What is Contingent (Could Go Either Way):**
  *   **The Specific Criteria:** We condition recognition on *liberal democracy* now. We could condition it on *stability* (19th century) or *dynastic legitimacy* (18th century). The normative content of the "constitutive" act is contingent.
  *   **The Threshold of Recognition:** We currently tolerate a lot of "ineffectiveness" (e.g., failed states retain UN seats). We could shift to a stricter effectiveness standard.
  *   **The Mechanism of Switching:** The US switching recognition from Taipei to Beijing was a specific geopolitical choice. A different hegemon might have maintained dual recognition or recognized neither.
  *   **The Role of the UN:** The UN's gatekeeping role is contingent. We could imagine a system where UN admission is separate from bilateral recognition.

  ### Advice for the Chapter Frame
  You are circling the concept of **Status vs. Fact**.
  *   **Law** treats statehood as a *Fact* (Declaratory).
  *   **Politics** treats statehood as a *Status* (Constitutive).
  *   **Hegel** treats statehood as *Recognition* (Relational).

  Your chapter argues that the ethics of secession cannot be resolved by looking at "facts on the ground" (the declaratory trap) because secession is ultimately a claim to **Status**. A secessionist movement is asking not just to control land, but to be *seen* as an equal.

  Therefore, the ethics of secession must account for the **inequality of recognition**. If recognition is constitutive and hierarchical, then the "right to secede" is not just a right to declare independence, but a right to *demand admission* to the community of peers. The injustice of the current system is not just that some states are unrecognized, but that the *power to recognize* is monopolized by states that have an interest in denying secession (to protect their own borders).

  **The Hook:** The declaratory theory is a "depoliticizing move." It tries to hide the political violence of granting or withholding status behind a veil of technical factuality. Your chapter exposes this veil. The practice presupposes that **sovereignty is not a property you own, but a relationship you sustain.**

  This frames your Hegelian turn not as a digression, but as the only theoretical apparatus capable of explaining why the lawyers' theory fails. The Master-Slave dialectic explains why the "facts" don't matter as much as the "relationship."
