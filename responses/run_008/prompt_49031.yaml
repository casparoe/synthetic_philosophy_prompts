answer: |-
  **Essay Question**

  Standard deontological theory faces the paradox of deontology: why refuse to violate a constraint once to prevent multiple violations of that same constraint? Seminar discussions typically stall between agent-relative replies, which reject aggregating violations, and threshold replies, which permit violation above a certain number but struggle to justify the cutoff. This stalemate suggests the problem may not be about numbers, but about the logical form of constraints themselves. Are constraints defeasible prohibitions that hold absolutely until overridden by a lexical priority, or are they agent-relative reasons that interact and weigh against one another?

  Consider a cross-constraint scenario: may you kill one innocent person to prevent the torture of five others? Here, the conflict is not between one violation and many of the same kind, but between two different kinds of constrained actions. If you treat constraints as interacting reasons with comparative strength, you can resolve this by weighing the reason against killing against the reasons against torturing. However, this risks reintroducing aggregation at the level of reasons, collapsing the distinction between deontology and consequentialism. If you treat constraints as binary prohibitions, you must explain how they interact without weighing.

  Write an essay defending the view that constraints are binary prohibitions with a lexical ordering rather than interacting agent-relative reasons. Explain how this logical form resolves the standard same-constraint paradox without resorting to arbitrary thresholds. Then, demonstrate how this view handles the cross-constraint scenario without collapsing into aggregation. Finally, argue specifically against the tempting model of constraints as interacting reasons, showing why that model fails to preserve the distinctively deontological prohibition against using persons as means.

  ***

  **Model Answer**

  The paradox of deontology arises not from a miscalculation of value, but from a category error regarding the logical form of moral constraints. Constraints are best understood not as interacting agent-relative reasons that possess comparative strength, but as binary prohibitions arranged in a lexical order. This distinction is crucial because the interacting reasons model inevitably smuggles aggregation back into deontology, whereas the binary model preserves the absolute status of the agent's integrity while allowing for conflict resolution. To defend this, one must show how it handles both identical and conflicting constraint scenarios without collapsing into the very consequentialist logic it seeks to oppose.

  In the standard same-constraint case, such as killing one to prevent five killings, the binary view forbids the action outright. Because the constraint is a prohibition on *my* killing, not a goal to minimize killing instances, the number of prevented violations is irrelevant. The threshold view fails here because any number specified appears arbitrary; why is the sixth life worth killing for but not the fifth? The binary view avoids this by refusing to count lives against the constraint. The constraint holds until it conflicts with a lexically superior constraint, not until it is outweighed by a sum of similar reasons. This preserves the intuition that there is a distinctive wrong in doing the act oneself that is not captured by the outcome.

  The cross-constraint case, killing one to prevent five tortures, tests whether this view offers guidance. If constraints are binary, we cannot weigh killing against torture. Instead, we must look to the lexical ordering of the types of violation. If the prohibition against torture is lexically prior to the prohibition against killing in this specific context, the action is permitted. Crucially, this permission does not arise because five tortures outweigh one killing. It arises because the duty to prevent the lexically superior violation triggers an exception to the subordinate prohibition. The number five is incidental; even one torture might permit the killing if the lexical order dictates that preventing torture overrides prohibiting killing. This avoids aggregation because the trigger is the *type* of conflict, not the *quantity* of badness. If the view were based on numbers, we would face the same arbitrariness as the threshold view: how many tortures equal a killing? The binary lexical view answers: none. It is the kind of wrong, not the amount, that matters.

  The tempting alternative is to view constraints as interacting reasons. On this view, the reason not to kill has a certain weight, and the reasons to prevent torture have their own weights. One acts permissibly when the latter outweigh the former. This fails because it transforms constraints into values that can be traded. If the reason not to kill can be outweighed by enough reasons to prevent torture, then the constraint is not a prohibition but a price. This reintroduces the paradox at a higher level: why is the price of killing fixed? If it can be met by enough tortures, it is essentially a consequentialist calculation disguised as agent-relative weighting. It loses the deontological force of the restriction.

  Furthermore, the interacting reasons model obscures the clean-hands problem. Deontology is concerned with the agent's own moral integrity, not just the state of the world. Binary prohibitions protect this integrity by marking certain actions as closed options. Interacting reasons keep the option open, subject to calculation. The critical insight here is that lexical ordering is not about ranking badness, but about ranking *authorities*. The authority of the victim's claim not to be tortured may override the authority of the victim's claim not to be killed, but this is a structural conflict of rights, not a summation of harms. By maintaining constraints as binary prohibitions, we preserve the idea that some things are not to be done, regardless of the cost, unless a higher-order structural rule intervenes. This keeps the agent's hands clean of calculation while providing a non-arbitrary way to navigate conflicting duties. The paradox dissolves when we realize we are not counting violations, but adjudicating conflicting claims of status.

  ***

  **Marking Scheme**

  1.  **Logical Form Distinction (4 marks):** Clearly distinguishes between constraints as binary prohibitions versus interacting reasons.
      *   *Typical Miss:* Students describe the views but fail to explain how the logical form differs structurally.
  2.  **Same-Constraint Application (4 marks):** Explains why the binary view rejects killing one to save five without arbitrary thresholds.
      *   *Typical Miss:* Students revert to standard agent-relative arguments without linking them to the binary logical form.
  3.  **Cross-Constraint Application (4 marks):** Explains how lexical ordering resolves killing vs. torture without aggregating numbers.
      *   *Typical Miss:* Students treat the cross-constraint case as a simple weighing of harms rather than a conflict of types.
  4.  **Critique of Interacting Reasons (4 marks):** Demonstrates how the reasons model collapses into consequentialism or aggregation.
      *   *Typical Miss:* Students accept the reasons model as a viable middle ground without noting its aggregative implications.
  5.  **Structural Insight (4 marks):** Identifies that the conflict is about authority/status rather than harm quantification (the non-obvious move).
      *   *Typical Miss:* Students focus on outcomes or integrity without identifying the underlying authority structure.

  **Total: 20 Marks**

  **A vs. B Distinction:** An A answer demonstrates how the logical form dictates the resolution of both cases, whereas a B answer describes the cases and applies labels without showing the structural dependency.
