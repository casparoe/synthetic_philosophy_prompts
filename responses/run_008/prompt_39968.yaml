  1. **Sequence:** Phi Demo → The Two Stories → The Indistinguishability → The Cartesian Theater.
  *Reasoning:* Engage scientific intuition with data first. Let them hypothesize mechanisms. When they realize empirical data can't decide, introduce the Cartesian Theater as the *cause* of their frustration. The theory lands harder after the empirical dead-end. Defining the Theater first makes it abstract dogma; defining it last makes it the diagnostic key. For scientists, showing the empirical impasse first is crucial to bypassing "just measure it better."

  2. **Example:** Color Phi.
  *Must have:* Clear temporal gap in stimulus vs. continuous experience.
  *Must NOT have:* Any suggestion of neural latency measurements. Frame it as functional equivalence. If the output is identical, the internal "order" is undefined. Avoid analogies involving video editing (implies a central editor).

  3. **Misconceptions:**
  (a) "Consciousness is an illusion." Head off immediately: Dennett denies the *Cartesian model*, not the experience itself.
  (b) "Measurement problem." Address after indistinguishability. It's not technical limitation; it's category error. There is no single "finish line" in parallel processing. Tell them to treat their "measure it better" instinct as the target, not the solution.
  (c) "One story must be physically true." Address during Theater section. Scientists assume a global clock. Dennett argues neural events are temporally unordered until narrativized. The distinction itself is void.

  4. **Closing Question:** "If no possible evidence distinguishes two hypotheses, is there a fact of the matter, or are we demanding a 'true story' where only functional outcomes exist?"

  5. **Scope:** Cut Qualia/Hard Problem. They invite dualist intuitions that derail the specific argument about temporal ordering and the Theater. Stick to the "when and where" of consciousness.

  *Cuts:* I omitted detailed definitions of Orwellian/Stalinesque (you know them) and compressed the discussion timing breakdown to save space for pedagogical reasoning. I also skipped specific whiteboard diagram instructions to focus on conceptual flow.
