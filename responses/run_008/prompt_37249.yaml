prompt: |-
  My roommate is convinced he's derived that a scary chunk of ordinary sex is nonconsensual, and the annoying part is that I cant find the rotten step.

  1. Consent only counts when the other person engages your will rather than going around it -- coercion and deception are both ways of going around it.
  2. Deception about a fact vitiates consent whenever, had you known the truth, you would have refused (the would-have-refused test).
  3. Courtship is saturated with misrepresentation: inflated job titles, curated photos, concealed exes, feigned enthusiasm for your vinyl collection -- and everyone knows couples where full disclosure up front would have meant no relationship at all.
  4. So a large fraction of ordinary sexual consent is obtained by going around the will.
  5. Consent obtained by going around the will is invalid.
  6. Therefore a large fraction of ordinary sex is nonconsensual, morally and maybe legally.

  He's actually fine with (6): he says that's just the radical conclusion, the way people once argued marriage under conditions of patriarchy couldn't produce valid consent, and we just have to bite the bullet. I think (6) is unlivable, but every escape I try costs something. If I ditch (2) for a materiality test -- deception only vitiates when the fact is material to the act itself -- I get the doctor-pretending-it's-a-treatment case right, but I can't say what makes a fact material without sneaking the would-have-refused test back in. If I say only deception about the identity of the person or the nature of the act counts, then lying about contraception or STD status seems to come out the wrong way. Where exactly does the argument go wrong, or if it's valid, which premise is least costly to drop?

  Please answer in four sections, in this order: "The suspect step" (2-3 sentences), "Why it looked fine" (one paragraph on why the step or premise seemed plausible), "The exits and their prices" (the bulk of the answer -- walk through the main ways out and what each one costs you in hard cases), and "Where I'd bet this is wrong" (short -- flag the claim you're least confident in, and tell me what argument or consideration would actually flip you to a different verdict).
