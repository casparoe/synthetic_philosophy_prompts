answer: |-
  The suspect step
  The rot is in Premise 2, which treats any counterfactual refusal as a violation of the will. This collapses the distinction between fraud in the *factum* (what is being done) and fraud in the *inducement* (why it is being done), treating all motivating lies as nullifiers of agency. By making validity contingent on a hypothetical alternative choice rather than the actual agreement given, it sets a threshold for consent that human interaction cannot realistically meet.

  Why it looked fine
  Premise 2 appeals to a robust view of autonomy where consent must be fully informed to be valid, mirroring how we handle medical procedures or contracts. It feels intuitive because in paradigmatic cases of sexual fraud—like a doctor claiming intercourse is medical treatment—the victim clearly would have refused had they known the truth, and we rightly call that assault. This creates a slippery slope intuition: if lying about the *nature* of the act invalidates consent, why doesn't lying about the *reasons* for the act do the same? The premise borrows credibility from these clear-cut cases of coercion-by-lie to smuggle in a much broader standard that applies to ordinary courtship.

  The exits and their prices
  There are three main exits, each with a distinct price tag. The first exit modifies Premise 2 by restricting vitiation to lies about the "nature of the act" or identity (fraud in the factum). This saves ordinary courtship lies about jobs or exes, but it struggles with your hard cases: is sex without a condom the same "act" as sex with one? If you say yes, you risk permitting dangerous deception about STDs; if you say no, you concede that much ordinary sex involves negotiated terms where deception *does* invalidate consent, shrinking the "ordinary" category. The second exit modifies Premise 3 by arguing there is no general duty to disclose personal history during courtship, so no "deception" occurs unless a direct question is lied about. This protects privacy and social lubrication, but it makes the HIV nondisclosure case difficult to condemn unless you posit a specific duty of care that seems arbitrary compared to lying about income or fertility. The third exit rejects the "would-have-refused" test entirely in favor of a "terms versus motivations" distinction: a fact is material not because you would have refused, but because you made it a condition of the agreement. This preserves social stability, but it is difficult to enforce, as it requires distinguishing between implicit terms (e.g., "I am single") and mere internal motivations (e.g., "I hope this leads to marriage"), often leaving victims without recourse when their specific deal-breakers were not verbally articulated. Ultimately, the most stable position is a hybrid: deception vitiates consent only when it concerns a fact that was implicitly warranted as a condition of the agreement, but distinguishing those conditions from mere motivations requires a nuanced theory of sexual negotiation that the law currently lacks.

  Where I'd bet this is wrong
  I am least confident that the "nature of the act" distinction can be cleanly defined without arbitrariness. If I can be convinced that condom use fundamentally changes the physical act rather than just the consequences, the roommate's conclusion shrinks but doesn't vanish; if I fail, we either accept his radical conclusion or admit our current legal framework is inconsistent.
