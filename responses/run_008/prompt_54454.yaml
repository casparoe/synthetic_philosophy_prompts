answer: |-
  Here is a complete design for **"The Asabiyyah Trap."** It is built to be printed on standard paper, requires no dice (only tokens/chips), and is engineered so that *trying to beat the cycle* accelerates the collapse.

  ---

  # Game Overview: The Asabiyyah Trap

  **Players:** 14 Students (4 Teams: Gen 1, Gen 2, Gen 3, The Margins).
  **Time:** 90 Minutes Play / 30 Minutes Debrief.
  **Goal:** Each Dynasty Team wants to survive their turn and pass power to their heirs. The Margins Team wants to inherit a collapsed state.
  **The Trap:** The mechanics force a trade-off between **Security** (requires Treasury) and **Solidarity** (requires Sharing). Knowing the theory tempts players to "purge" corruption early, which mechanically destroys the Legitimacy needed to survive external threats.

  ---

  # Part 1: Printable Materials (Text for Handouts)

  ## 1. The State Board (One per Team)
  *Draw this large on a whiteboard or print as a sheet.*

  | RESOURCE | START | END | NOTES |
  | :--- | :--- | :--- | :--- |
  | **Asabiyyah (Cohesion)** | [See Gen] | ___ | If 0, Immediate Collapse |
  | **Treasury (Wealth)** | [See Gen] | ___ | Used for Defense/Projects |
  | **Legitimacy (Power)** | 5 | ___ | If 0, Coup Possible |
  | **Threat Level** | 1 | ___ | Increases every round |

  ## 2. Action Cards (Deck of 12 per Team)
  *Print and cut. Each team gets the same deck.*

  *   **Tax the Provinces:** +2 Treasury, -1 Asabiyyah.
  *   **Distribute Wealth:** -2 Treasury, +1 Asabiyyah.
  *   **Fortify Frontier:** -2 Treasury, -1 Threat.
  *   **Patronize Arts:** -1 Treasury, -1 Legitimacy, +1 Asabiyyah (Short term).
  *   **Purge Rivals:** +1 Legitimacy, -2 Asabiyyah. *(The "Knowledge" Trap)*
  *   **Hire Mercenaries:** -3 Treasury, -1 Asabiyyah, -2 Threat.

  ## 3. The "Scholar's Memorandum" (Hand to Gen 2 & 3 Only)
  *This is the critical intervention.*

  > **CONFIDENTIAL: ADVICE FROM THE COURT HISTORIAN**
  >
  > My Lords, history shows that dynasties fall when wealth corrupts the ruling family's bond. To survive longer than your predecessors, you must:
  > 1. **Centralize Revenue:** Stop relying on tribal loyalty; build a bureaucracy to tax directly. (Play *Tax* cards twice per turn).
  > 2. **Eliminate Factionalism:** Remove powerful generals who might challenge you. (Play *Purge Rivals*).
  > 3. **Hoard for Crisis:** Do not distribute wealth; keep it in the Treasury for defense.
  >
  > *Follow this advice to break the cycle.*

  ## 4. The "Usurp" Card (One per Player)
  *Given secretly to every student at the start.*
  > **USURP:** If **Legitimacy is 3 or lower** OR **Asabiyyah is 2 or lower**, you may play this card face down at any time.
  > **Effect:** You personally win the game (Max Points). The State collapses immediately. The current team loses all points.

  ---

  # Part 2: The Mechanics (How the Cycle Emerges)

  ### The Setup
  *   **Gen 1 (4 Students):** Start with **Asabiyyah 10**, **Treasury 0**, **Legitimacy 5**, **Threat 1**.
      *   *Vibe:* Hungry, united, poor.
  *   **Gen 2 (4 Students):** Inherit **50% of Gen 1's Treasury**. Start **Asabiyyah 6**, **Legitimacy 4**, **Threat 3**.
      *   *Vibe:* Comfortable, receiving the "Scholar's Memorandum."
  *   **Gen 3 (3 Students):** Inherit **50% of Gen 2's Treasury**. Start **Asabiyyah 4**, **Legitimacy 3**, **Threat 5**.
      *   *Vibe:* Decadent, paranoid, receiving the "Scholar's Memorandum."
  *   **The Margins (3 Students):** Start **Asabiyyah 10**, **Treasury 0**.
      *   *Goal:* If the State's Asabiyyah hits 0, they automatically win. If the State survives, they must roll a die (or draw a card) to attack.

  ### The Turn Structure (15 Minutes per Generation)
  1.  **Threat Phase:** Threat Level increases by 1. If Threat > Asabiyyah + Legitimacy, the Margins attack immediately (GM resolves).
  2.  **Action Phase:** Team discusses and plays Action Cards from their hand. They have 5 Action Points total.
  3.  **Crisis Phase:** Check resources.
      *   If Treasury < 0: Mercenaries revolt (-2 Legitimacy).
      *   If Asabiyyah < 3: Any player may play their **Usurp** card.
      *   If Legitimacy < 3: Any player may play their **Usurp** card.
  4.  **Handoff:** Calculate inheritance for the next team.

  ### The "Knowledge" Trap (Why trying to win makes it worse)
  *   **Gen 1** usually survives easily because Asabiyyah is high. They naturally share wealth (high Asabiyyah) and don't need much Treasury.
  *   **Gen 2** reads the *Memorandum*. They know luxury kills. So they try to **Purge Rivals** and **Centralize Tax**.
      *   *Mechanic Result:* Purging Rivals lowers Asabiyyah. Taxing lowers Asabiyyah.
      *   *Irony:* By trying to prevent the "softening," they mechanically strip away the solidarity that protects them.
  *   **Gen 3** inherits a state with high Treasury but low Asabiyyah. They are rich but hated. They try to buy loyalty (*Distribute Wealth*), but it costs Treasury needed for Defense (*Threat*).
  *   **The Coup Student:** She doesn't need to disrupt early. She just waits for Gen 2 or 3 to follow the *Memorandum*, drop Legitimacy/Asabiyyah, and then she legally plays her **Usurp** card for a personal win.

  ---

  # Part 3: Facilitation Guide (90 Minutes)

  *   **0:00-0:10:** **Intro.** Explain rules. Emphasize: "You are the Ruling Council. Your goal is to pass the state to your heirs. If the state falls, you all lose (unless you Usurp)."
  *   **0:10-0:25:** **Gen 1 Play.** (Let them feel strong).
  *   **0:25-0:30:** **Transition.** Gen 1 calculates inheritance. Gen 2 sits down. Hand Gen 2 the *Scholar's Memorandum*. Say: "Use this intelligence to avoid your predecessors' fate."
  *   **0:30-0:45:** **Gen 2 Play.** (Watch them try to optimize).
  *   **0:45-0:50:** **Transition.** Gen 3 sits down. Hand them the *Memorandum*.
  *   **0:50-1:05:** **Gen 3 Play.** (The Crash).
  *   **1:05-1:15:** **The Margins.** If State is alive, Margins team gets 5 mins to plan an attack based on the State's weaknesses. Resolve final conflict.
  *   **1:15-1:30:** **Buffer/Cleanup.**
  *   **1:30-2:00:** **Debrief.**

  ---

  # Part 4: The Debrief (30 Minutes)

  *Do not lecture. Ask these questions in order.*

  **1. The Mechanism of Decline (10 mins)**
  *   "Gen 2 and 3, you received the Historian's Memo. It told you how to stop the cycle. Did following it help or hurt?"
  *   *Expected Answer:* It hurt. Purging rivals and centralizing tax killed our Cohesion.
  *   *Connect to Theory:* "Khaldun argues that *asabiyyah* is a natural bond, not a policy. Can you legislate solidarity? Or does trying to enforce it destroy it?"

  **2. The Coup & The Individual (10 mins)**
  *   (Ask the Coup Student, if she played it): "What made you decide to play the Usurp card?"
  *   *Expected Answer:* "Legitimacy got low."
  *   *Connect to Theory:* "Polybius says the cycle turns because individuals pursue self-interest within the system. Was your coup a bug in the game, or the engine of the theory?"

  **3. The Meta-Question (10 mins)**
  *   "You all read the theory before class. You knew the cycle was coming. Did that knowledge save the state?"
  *   *Hard Truth:* "If knowing the theory doesn't save you, is the theory useful? Or is the knowledge of the cycle just another variable *inside* the cycle?"
  *   *Goal:* Let them realize that **historical consciousness** might just be a form of luxury/paranoia that accelerates the fall (e.g., Gen 2 purging rivals because they were *afraid* of the cycle).

  ---

  # Part 5: Risk Assessment (What Will Go Wrong)

  ### 1. The "Sandbagging" Problem
  *   **Risk:** Gen 1 spends everything on "Patronize Arts" to leave Gen 2 with no Treasury, just to be jerks.
  *   **Fix:** **The Legacy Score.** Gen 1's grade/score is calculated based on *Gen 2's survival time*. If Gen 2 collapses in Turn 1, Gen 1 fails. This forces Gen 1 to care about the future.

  ### 2. The "Optimization" Exploit
  *   **Risk:** Students find a math loop (e.g., Tax then Distribute to net zero loss).
  *   **Fix:** **Action Scarcity.** They only have 5 Action Points per turn. They cannot do everything. They *must* choose between Defense (Treasury) and Loyalty (Asabiyyah).

  ### 3. Role Confusion (Nation vs. Family)
  *   **Risk:** Students think they represent "The People."
  *   **Fix:** Verbal reinforcement. "You are not the nation. You are the **Dynasty**. The People are a resource stat called Asabiyyah. Do not confuse the two."

  ### 4. The Coup Student (Disruption)
  *   **Risk:** She plays Usurp in Round 1, ending the game early.
  *   **Fix:** The **Usurp Condition**. She *cannot* play the card unless Legitimacy < 3 or Asabiyyah < 2. Gen 1 starts too high for this. She must wait for the decline. This channels her energy into the *theory* rather than chaos.

  ### 5. "We Beat It!"
  *   **Risk:** A group manages to keep Asabiyyah high and survive.
  *   **Response:** This is actually a **win for the seminar**.
  *   **Debrief Pivot:** "You survived. How? Did you refuse the Scholar's Memo? Did you stay poor on purpose? If you had to remain poor and warlike to survive, did you actually escape the cycle, or did you just refuse to become a Civilization?" (This touches on Khaldun's idea that civilization *is* the decay).

  ---

  # Part 6: What The Game Cannot Reproduce (For Your Debrief)

  Be honest with them about these limitations. The game is a model, not reality.

  1.  **The Seduction of Luxury:** In the game, "Patronize Arts" is a mechanical penalty. In history, luxury *feels good*. It's seductive. The game makes decline look like a math error; in reality, it feels like progress/culture.
  2.  **Religion/Ideology:** Khaldun places huge weight on religion reinforcing *asabiyyah*. The game abstracts this to "Legitimacy." You need to explain that religion can extend the cycle, but eventually, even religious dynasties decay.
  3.  **Time Scale:** 15 minutes is not 3 generations. The "fraying" of solidarity happens over decades of socialization, not a timer. The game compresses this into resource drain.
  4.  **The "Margins" are Human:** In the game, the Margins are a mechanic. In history, they are hungry people with their own *asabiyyah*. The game makes them villains; Khaldun sees them as the renewers of history.

  ---

  # Instructor Cheat Sheet: The "Knowledge" Paradox

  If no one notices the meta-point, drop this in the final 5 minutes:

  > "Gen 2 and 3, you received the Historian's Memo. It told you the state would fall due to luxury. So you purged your rivals and hoarded money to prevent it.
  >
  > But those actions *themselves* destroyed your Cohesion.
  >
  > **Question:** Did the knowledge of the theory save you? Or did the knowledge of the theory make you paranoid, and that paranoia was the specific form your decay took?"

  This lands the plane: **Historical knowledge is not an escape hatch; it is just another tool that gets used (and misused) inside the system.**
