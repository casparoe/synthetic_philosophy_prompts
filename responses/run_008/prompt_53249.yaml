answer: |-
  Your audit of Tolstoy's *What Is Art?* identifies the precise structural weakness in his argument. You are correct: the "infection" analogy is the engine that drives his definition of art, but it cannot sustain the weight of his moral evaluation without collapsing. Tolstoy attempts to use a descriptive mechanism (contagion) to do normative work (moral judgment), and to bridge that gap, he must smuggle in an external value system (Christian universalism) that the analogy itself does not support.

  Here is the audit of the analogy, the breakdown of the mapping, and the consequences of replacing it with a model of persuasion/communion.

  ### 1. The Correspondence Table

  Tolstoy's epidemiological model relies on a specific mapping of artistic elements to biological vectors.

  | Artistic Element | Epidemiological Equivalent | Function in Theory |
  | :--- | :--- | :--- |
  | **The Feeling** | **The Pathogen** | The entity being transmitted. Must be distinct and potent. |
  | **The Artist** | **Patient Zero / Carrier** | Must be currently infected (sincere) to transmit. |
  | **Sincerity** | **Viral Load** | The intensity of the artist's feeling determines the potency of the transmission. |
  | **The Work (Signs)** | **Vector / Medium** | The physical means (sound, paint, word) by which the pathogen travels. |
  | **The Audience** | **Susceptible Hosts** | Must have the capacity to be infected (human unity). |
  | **Artistic Quality** | **Infectivity ($R_0$)** | The degree to which the feeling spreads and overrides the host's immunity. |

  ### 2. Where the Mapping Breaks

  The analogy holds well for defining the *mechanism* of art but fails when defining the *value* of art. There are three critical disanalogies:

  **A. The Volition Gap**
  *   **Epidemiology:** Infection is involuntary. A host does not consent to the virus; immunity is a biological barrier, not a moral choice.
  *   **Art:** While Tolstoy argues true art overwhelms resistance, art reception inherently involves a degree of attention and cognitive framing. A viewer can "resist" a painting not because they are immune, but because they disagree with its premise. The infection model erases the audience's agency, which is necessary for Tolstoy's later moral judgment (we are responsible for what art we support).

  **B. The Sincerity Gap**
  *   **Epidemiology:** A pathogen does not need to "feel" anything to infect. A carrier can be asymptomatic or a fomite (inanimate object) can transmit disease.
  *   **Art:** Tolstoy insists the artist *must* have experienced the feeling. A virus doesn't care if the carrier believes in it; Tolstoy's art collapses if the artist is lying. This makes the "pathogen" dependent on the psychological state of the "carrier," which has no biological equivalent.

  **C. The Normative Gap (The Critical Failure)**
  *   **Epidemiology:** Success is measured from the **pathogen's perspective**. A "successful" virus is one that spreads widely, regardless of whether it kills the host or makes them healthier.
  *   **Tolstoy's Aesthetics:** Success must be measured from the **host's perspective**. Art is "good" only if the feeling transmitted improves the moral/spiritual life of the audience.
  *   **The Break:** If infectiousness is the sole metric, a highly effective piece of propaganda inciting hatred, or a pornographic novel inciting lust, qualifies as "great art" because it spreads feeling efficiently. Tolstoy cannot accept this.

  ### 3. The Normative Gap and the Religious Import

  You hypothesize that Tolstoy closes the normative gap by quietly importing a religious criterion. The text confirms this, though it is less "quiet" than "structural."

  Tolstoy realizes early in the treatise that infectiousness alone distinguishes art from *non-art*, but not *good art* from *bad art*. To solve the normative gap, he introduces the **"religious perception of the age."**

  *   **The Pivot:** He argues that because art unites people (via infection), it *must* unite them toward the highest conception of the good available to that era (Christian brotherhood).
  *   **The Consequence:** Infectiousness becomes a *necessary condition* but not a *sufficient condition*.
      *   *Equation:* Art = Infection + Christian Content.
      *   *Reality:* If the content is exclusive (upper-class pleasure), the infection is deemed "counterfeit" or "bad," even if it spreads.

  **Does the claim "Best Art = Most Infectious" survive?**
  No. It collapses under the weight of the moral criterion.
  If Tolstoy maintained the infection analogy strictly, Wagner (whom he loathed) would be a greater artist than a simple folk song, because Wagner's music creates a more overwhelming physiological and emotional response (higher viral load). Tolstoy is forced to argue that Wagner's art is *not* truly infectious because it is insincere and exclusive, despite the evidence of its popularity. He redefines "infection" post-hoc to mean "infection with *right* feelings."

  This confirms your suspicion: **Infectiousness is rhetorical packaging.** It allows Tolstoy to sound scientific and objective ("this is how art works") while delivering a sermon ("this is what art *should* do"). The metric shifts from *potency* (how hard you feel) to *direction* (what you feel toward).

  ### 4. The Replacement Analogy: Art as Persuasion/Communion

  If we discard the infection model for a model of **Art as Persuasion** (or, more accurately for Tolstoy, **Art as Communion**), the verdict on the art of his own class changes significantly.

  **The Persuasion Model:**
  *   **Artist:** Orator/Advocate.
  *   **Work:** Argument/Rhetoric.
  *   **Audience:** Jury/Peers.
  *   **Feeling:** Proposition/Claim.
  *   **Quality:** Truthfulness + Logical/Moral Coherence.

  **How this changes the verdict on Upper-Class Art:**

  1.  **From "Counterfeit" to "Propaganda":**
      *   *Infection Model:* Upper-class art is *fake*. It mimics symptoms without the disease. It is a medical failure.
      *   *Persuasion Model:* Upper-class art is *corrupt*. It is a successful rhetorical act arguing for the wrong values (exclusivity, lust, patriotism). It is a moral failure, not a technical one.
      *   *Impact:* This is a stronger critique. It admits that the aristocracy *can* make art that moves people, but argues they *should not*, because they are persuading people toward division rather than union.

  2.  **From Passivity to Complicity:**
      *   *Infection Model:* The audience is a victim. They are "caught." This absolves them of responsibility.
      *   *Persuasion Model:* The audience is a participant. They assent to the feeling. This implicates the upper-class audience in their own corruption. They are not sick; they are complicit in a system of exclusion.

  3.  **From Universality to Accessibility:**
      *   *Infection Model:* Relies on biological universality (everyone has the same immune system basically).
      *   *Persuasion Model:* Relies on shared language and experience.
      *   *Impact:* Tolstoy's critique of elite art becomes about *accessibility of rhetoric*. Elite art fails not because it lacks "viral load," but because its rhetoric relies on specialized training (codes, references, techniques) that excludes the peasantry. It is bad persuasion because it fails to persuade the majority of mankind.

  ### Conclusion

  The infection analogy collapses because it cannot distinguish between a plague and a cure. Tolstoy saves his theory only by abandoning the analogy's internal logic and importing an external religious morality.

  If we replace "Infection" with "Persuasion/Communion," Tolstoy's argument becomes more honest but less absolute.
  *   **Infection:** "Your art is dead because it doesn't move anyone (really)." (Factually dubious regarding Wagner/Beethoven).
  *   **Persuasion:** "Your art is evil because it moves people toward the wrong ends." (Morally robust).

  By shifting to persuasion, the verdict on his own class hardens: they are not merely inept artists failing to transmit feelings; they are **demagogues successfully transmitting division.** This aligns better with Tolstoy's anarchist-Christian politics, suggesting that the "infection" metaphor was indeed a strategic choice to naturalize his moralism, masking a prescription as a description.
