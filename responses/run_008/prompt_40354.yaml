      *Actually, to make it fit 80 mins:*
      0-10: Intro.
      10-35: Scenarios (2.5 mins per scenario + discussion). 5 scenarios = 12.5 mins + transition. Tight.
      Let's group them into 3 "Cases" with sub-questions.
      Case 1: Genesis & Death (Lump/Statue/Squash).
      Case 2: Vagueness (Grain).
      Case 3: Arbitrariness (Overlap).
      This preserves the logic without eating 40 mins on admin.

      *Re-evaluating the "Registry" mechanic:* To make them "dig their own grave," they need to commit to a *Principle* before the next scenario.
      *Round 1:* Ruling + Principle.
