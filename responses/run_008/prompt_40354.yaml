answer: |-
  Here is a complete lesson plan designed to force the contradiction into the open through bureaucratic entrapment.

  # Lesson Plan: The Ontological Registry Audit
  **Topic:** Constitution, Identity, and Persistence (The Statue and the Clay)
  **Class Size:** 14 Students
  **Time:** 80 Minutes
  **Goal:** Force students to commit to binary identity rulings that generate contradictions regarding Leibniz's Law, the Problem of the Many, and Arbitrariness.

  ## 1. Logistics & Materials
  **Grouping:** Split the class into **4 Registry Offices** (Groups A, B, C, D).
  *   Sizes: Two groups of 4, two groups of 3 (Total 14).
  *   *Why 4?* Allows for pairwise cross-examination (A audits B, C audits D) in the second half.

  **Materials per Group:**
  1.  **The Master Ledger:** A packet of 5 sheets. Each sheet represents a "Time Slice" of the studio. It has columns for: *Object ID#, Object Description, Date Opened, Date Closed, Reason for Status Change.*
  2.  **The Principle Log:** A single card where they must write the *rule* justifying their last ruling (e.g., "New shape = New Object").
  3.  **Event Cards:** You (the Instructor) hold these and read them out.
  4.  **Red Pen:** For the audit phase.

  **The Golden Rule (Write on Board):**
  > **"One Object, One ID."**
  > You cannot say "It is the same *clay* but a different *statue*."
  > If it is the same object, it keeps the same ID#. If it is a different object, it gets a new ID#.
  > **No "Sortal-Relative Identity."** You are tracking *Things*, not descriptions.

  ---

  ## 2. Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain the Registry role. Distribute materials. Enforce the Golden Rule. |
  | **10-35** | **The Sequence** | Read 5 Event Scenarios. Groups rule & update Ledgers. (5 mins per scenario). |
  | **35-45** | **Internal Audit** | Groups review their own Ledger for consistency before the attack. |
  | **45-65** | **Cross-Examination** | Paired groups swap Ledgers. Find contradictions in Principles vs. Rulings. |
  | **65-80** | **Debrief** | Map the contradictions to philosophical positions (Monism, Constitutionalism, Nihilism). |

  ---

  ## 3. The Sequence (The Trap)
  *Read these aloud. Give groups 3 minutes to deliberate and write their ruling, then 2 minutes to lock in their Principle.*

  **Event 1: Genesis**
  > "A formless lump of clay ($L$) sits on the pedestal. It has existed for an hour. The sculptor shapes it into a Statue ($S$). The lump still exists."
  > *   **Ruling:** Do you open a new Object ID for the Statue? (Yes/No)
  > *   **Principle:** What determines new objecthood? (e.g., Change in shape? Change in function?)

  **Event 2: The Squash**
  > "The sculptor hates the work. He squashes the Statue flat. It is now a shapeless lump again. The clay is untouched."
  > *   **Ruling:** Does the Object ID from Event 1 close (die)?
  > *   **Constraint:** You must apply the Principle from Event 1.

  **Event 3: The Remold**
  > "The sculptor immediately reshapes the flat lump into a *different* Statue ($S2$)."
  > *   **Ruling:** Is $S2$ the same Object ID as the Statue in Event 1?
  > *   **Constraint:** If you said 'Squashing killed the Statue' but 'Clay survived', you now have to track the Clay ID vs. the Statue ID.

  **Event 4: The Grain (Problem of the Many)**
  > "A single grain of dust is flicked off the surface of $S2$. It is visually indistinguishable from before."
  > *   **Ruling:** Does $S2$ survive? (Keep ID or Close ID and open new one?)
  > *   **Constraint:** If it survives, what about 2 grains? 100 grains?

  **Event 5: The Overlap (Arbitrariness)**
  > "Two artists claim the object. One says 'This is a Head ($H$).' The other says 'This is a Torso ($T$).' They occupy the exact same clay space."
  > *   **Ruling:** How many Object IDs are on the pedestal right now? (1? 2? 3?)
  > *   **Constraint:** Justify why one counts and the other doesn't, or if both count.

  ---

  ## 4. The Cross-Examination (The Audit)
  **Pairing:** Group A audits Group B. Group C audits Group D.
  **Task:** They swap Ledgers and Principle Logs. They have 10 minutes to find **"Inconsistency Violations."**

  **Violations to look for:**
  1.  **The Survival Contradiction:** Did you say the Clay survives the squash (Event 2) but also that the Statue = The Clay (Event 1)? If $A=B$, and $A$ dies while $B$ lives, you violated Leibniz's Law.
  2.  **The Principle Drift:** Did you use "Shape determines identity" in Event 1, but "Matter determines identity" in Event 3?
  3.  **The Sorites Trap:** In Event 4, if you said "Yes, it survives," you must admit there are thousands of overlapping statue-candidates (Clay minus 1 grain, Clay minus 2 grains). Did you register them all? If not, why not?
  4.  **The Arbitrariness:** In Event 5, if you registered both Head and Torso, why didn't you register "Head-minus-grain"? If you registered only one, what non-arbitrary fact distinguishes them?

  **Output:** Each auditing group must write one "Citation of Contradiction" on the red sheet and present it to the class.

  ---

  ## 5. The Debrief (Mapping the Damage)
  *Use the whiteboard to map their rulings to the literature.*

  **1. The "One File" Ruling (Monism)**
  *   *Students who said:* Statue ID = Clay ID.
  *   *The Contradiction:* Event 2 (Squash). The Statue is destroyed, the Clay survives. If they are one object, they must share all properties (Leibniz's Law).
  *   *Philosophical Move:* **Constitution Monists (Burke).** Must argue the Statue *isn't* destroyed, just rearranged. Or, the Clay *is* destroyed and replaced by a new lump.
  *   *Cost:* Violates common sense intuition about artifacts.

  **2. The "Two File" Ruling (Constitutionalism)**
  *   *Students who said:* Statue ID $\neq$ Clay ID.
  *   *The Contradiction:* Event 1 & 5. Two objects in the same place at the same time.
  *   *Philosophical Move:* **Constitutionalists (Baker).** Distinct objects can coincide if they have different "Persistence Conditions."
  *   *Cost:* Violates intuition that "only one thing is on the pedestal."

  **3. The "Grain" Ruling (Problem of the Many)**
  *   *Students who said:* Statue survives grain removal.
  *   *The Contradiction:* If $S$ survives -1 grain, it survives -1000 grains. But -1000 grains is a pile, not a statue. Where is the line?
  *   *Philosophical Move:* **Epistemicism (Williamson)** vs. **Nihilism (Unger).**
  *   *Cost:* Either admit magic boundaries or admit there are 10,000 statues on the pedestal.

  **4. The "No File" Ruling (Nihilism)**
  *   *Students who refused to open files for Statues.*
  *   *The Contradiction:* None internally, but socially costly.
  *   *Philosophical Move:* **Mereological Nihilism (Merricks, Rosen & Dorr).** Only simples exist.
  *   *Cost:* Denying the existence of art, people, and pedestals.

  ---

  ## 6. Instructor's Honesty Clause (Limitations)
  *You must explicitly tell them what the game failed to simulate.*

  **"The game rigged the verdict against 'Common Sense'."**
  In the game, **Consistency** was the only virtue. If you were consistent, you won the Audit.
  In real metaphysics, Consistency is just *one* virtue. We trade it against:
  1.  **Common Sense:** We really want to say there's one statue and it's made of clay.
  2.  **Simplicity:** We don't want to believe in coinciding objects (Two-File).
  3.  **Explanatory Power:** We want to know *why* the statue survives the grain loss.

  **"The game couldn't simulate 4-Dimensionalism well."**
  If a group tried to say, "The Statue is a space-time worm, and the Clay is a different worm that overlaps it," the Ledger system (which asks for "Now" status) makes this hard to track. In reality, **Perdurantism** is the most popular way to solve this without contradiction, but the game forces you into 3-Dimensional thinking (Endurantism) to create the tension.

  ---

  ## 7. Predictable Failure Points (First Run)

  **1. The "Sortal Cheat"**
  *   *What happens:* Students will write "Same Clay ID, New Statue ID" in the same row.
  *   *Fix:* You must circulate aggressively in the first 10 minutes. If they write two IDs for one location, ask: "Are these two *things* occupying the same space?" If yes, they must accept the "Two Thing" consequence. If no, they must pick one ID. **Force the binary.**

  **2. The "It Depends" Defense**
  *   *What happens:* During Cross-Examination, the audited group says, "Well, it depends on how you define 'Statue'."
  *   *Fix:* Remind them of the **Principle Log**. "You wrote 'Shape determines identity' in Event 1. You violated your own written law in Event 3." Hold them to their bureaucratic commitments.

  **3. Time Creep**
  *   *What happens:* The Scenarios take too long. Groups get stuck on Event 4 (The Grain).
  *   *Fix:* Hard stop at 35 minutes. If they haven't finished Event 5, skip it. The "Grain" (Problem of the Many) is more philosophically fertile than the "Overlap" (Arbitrariness) for a general seminar.

  **4. The Nihilist Loophole**
  *   *What happens:* One group realizes they can just say "Nothing exists except atoms." They close all files.
  *   *Fix:* Acknowledge this as a valid winning strategy (Mereological Nihilism), but point out in the debrief that this is the "nuclear option." It solves the puzzle by destroying the world. Ask them if they are willing to apply that to *themselves* (i.e., "You don't exist either").

  ## 8. Ledger Template (Visual Guide)

  **REGISTRY OFFICE #: \_\_\_\_\_**

  | Time | Event | Object ID | Action (Open/Close/Keep) | Justification (Principle) |
  | :--- | :--- | :--- | :--- | :--- |
  | **T1** | Lump exists | #001 | OPEN | Matter constitutes object |
  | **T2** | Shaped to Statue | #001 | KEEP | *OR* #002 OPEN (Shape creates object) |
  | **T3** | Squashed | #001 | CLOSE? | Does shape loss kill object? |
  | **T4** | Grain Removed | #002 | CLOSE? | Does part loss kill object? |

  *(Ensure they physically cross out IDs when they rule an object is destroyed. The visual of crossing out the "Clay" ID when the statue is squashed usually triggers the visceral "Wait, the clay is still there!" reaction.)*
