          *   *What has to give?* The partisan/political element. Focus on the *temporal structure* (present judging past) and the *inevitability*.

      *   **The Core Argument (Butterfield vs. Kubrick):**
          *   Butterfield: The past is a foreign country; don't judge it by now.
          *   Kubrick: The past is *only* intelligible by where it leads (the Star Child).
          *   The Match Cut: It's not just an edit; it's a thesis statement. It creates a causal link where there might only be sequence.
          *   The Monolith: It literalizes the "invisible hand" Whig historians often imply (Providence/Reason).
          *   The Violence: This is where the film transcends simple Whiggism. It acknowledges the "blood on the page" that Whig history often scrubs away. But does it matter if the end is a Star Child?

      *   **Seminar Plan (2 Hours):**
