answer: |-
  # The "What Really Exists?" Material Constitution Quiz

  Welcome to the metaphysics lab. Below are eight concrete scenarios involving everyday objects. For each one, choose the option that best matches your gut feeling about what is *actually happening* in the world. Don't worry about philosophical terms; just pick the outcome that makes the most sense to you.

  ### 1. The Sculptor's Lump
  A sculptor takes a lump of clay that has been sitting on a shelf for a week. She shapes it into a statue. The next day, she smashes the statue flat, returning it to a shapeless lump.
  *   **A.** The lump of clay existed before the statue and survived the smashing; the statue only existed in between. They are two different things that shared a space for a day.
  *   **B.** The statue and the lump are the exact same object. If the lump existed before the shaping, then the statue did too (it just looked different). If the statue was destroyed, the lump was too.
  *   **C.** Strictly speaking, neither "lump" nor "statue" exists. There are only clay particles arranged differently at different times.

  ### 2. The Ship of Theseus
  A wooden ship has every single plank replaced over ten years. None of the original wood remains. Meanwhile, a collector gathered all the discarded original planks and reassembled them into a ship.
  *   **A.** The ship that stayed in the water is the original. Continuous history matters more than original parts.
  *   **B.** The reassembled ship is the original. You can't be the same ship without your original parts.
  *   **C.** Both ships are equally the "original" in different senses. Identity isn't a simple yes-or-no fact here.

  ### 3. Tibbles and the Tail
  Tibbles is a cat. Tibbles loses his tail in an accident. We can talk about "Tibbles" (the cat) and "Tibbles-minus" (the cat's body without the tail).
  *   **A.** Tibbles and Tibbles-minus are the same object. Losing a part doesn't create a new object.
  *   **B.** Tibbles and Tibbles-minus are two distinct objects occupying the same space. One has a tail (in the past), the other is defined by its current shape.
  *   **C.** "Tibbles" is just a name we give to a specific stage of a longer cat-story. The tailless version is a later stage of the same whole.

  ### 4. The Instant Statue
  A machine presses clay into the shape of a statue and then immediately crushes it, all within a single split second.
  *   **A.** A statue was created and immediately destroyed. For that instant, a statue existed.
  *   **B.** No statue ever existed. To be a statue, an object needs to last long enough to fulfill a purpose or be recognized.
  *   **C.** The question is misleading. Whether a statue existed depends entirely on whether we decide to use the word "statue" for things that last that briefly.

  ### 5. The Person and the Body
  Imagine technology allows your brain (with all your memories) to be transplanted into a new body, while your old body remains alive but mindless.
  *   **A.** You go with the brain. You are not identical to your biological body; you just inhabit it.
  *   **B.** You stay with the body. You are a human animal, and animals don't jump bodies. The person with your memories is just a copy.
  *   **C.** There is no fact of the matter. "You" is a concept that breaks down in sci-fi scenarios; it's up to us to decide how to speak.

  ### 6. The Puddle and the Water
  A puddle of water freezes into ice, then melts, then evaporates.
  *   **A.** The water survived the whole time, but the puddle ceased to exist when it froze (ice isn't a puddle). Two things were involved: the water and the puddle-shape.
  *   **B.** The puddle is the water. If the water survived, the puddle survived, even if it changed state.
  *   **C.** Only the H2O molecules survived. "Puddle" is just a description we use for how they are arranged on the ground.

  ### 7. The Overlapping Statues
  An artist creates two statues out of interlocking pieces of clay that share the exact same central core.
  *   **A.** There are two objects in that space. They share parts, but they are distinct statues.
  *   **B.** There is only one object there. We are just describing it in two different ways.
  *   **C.** There are no "objects" there at all. There are just clay particles arranged statue-wise.

  ### 8. The Broken Vase
  A vase falls and shatters into dust. Later, someone gathers the dust and chemically reconstructs a perfect duplicate vase.
  *   **A.** It is the same vase. The material is the same, so the object is the same.
  *   **B.** It is a new vase. The original object was destroyed when the continuity was broken.
  *   **C.** Saying it is the "same" vase is true relative to the material, but false relative to the history. Both answers are correct depending on what you mean.

  ***

  ## Scoring Key

  Tally up which letter you chose most frequently. While human intuition is messy, your dominant pattern points toward a specific metaphysical stance.

  **Mostly A's: The Coincidentalist (Constitution View)**
  *   **The View:** You believe multiple objects can occupy the same space at the same time. The clay and the statue are distinct because they have different life stories (persistence conditions). One can survive what the other cannot.
  *   **Philosophers:** Lynne Rudder Baker, Michael Burke.

  **Mostly B's: The Constitution-as-Identity Theorist**
  *   **The View:** You believe in parsimony. If two things share all the same matter and location, they are one and the same object. You likely deny that the clay existed before the statue, or you accept that the statue survives the squashing if the clay does.
  *   **Philosophers:** David Wiggins, Roderick Chisholm (early).

  **Mostly C's: The Deflationist or Verbal Dispute Theorist**
  *   **The View:** You suspect the problem isn't with the world, but with our language. You think questions like "Is it the same ship?" don't have deep metaphysical answers; they just ask how we agree to use words.
  *   **Philosophers:** Rudolf Carnap, Eli Hirsch.

  **Mostly "Particles/Atoms" Answers (Q1-C, Q6-C, Q7-C): The Nihilist**
  *   **The View:** You don't believe in composite objects at all. There are no statues, ships, or cats—only simple particles arranged in certain ways.
  *   **Philosophers:** Peter van Inwagen (restricted), Trenton Merricks, Cian Dorr.

  **Mostly "Stage/History" Answers (Q2-A, Q3-C): The Four-Dimensionalist (Perdurantist)**
  *   **The View:** You view objects as "space-time worms." Objects have temporal parts just like they have spatial parts. The "cat" is the whole timeline, not just the moment you see it.
  *   **Philosophers:** David Lewis, Ted Sider.

  **Mostly "Depends on Sense" Answers (Q2-C, Q5-C, Q8-C): The Relative Identity Theorist**
  *   **The View:** You believe identity is not absolute. $X$ can be the same *ship* as $Y$, but not the same *collection of planks* as $Y$. There is no answer to "Are they the same?" without adding "the same *what*?"
  *   **Philosophers:** Peter Geach, Harold Noonan.

  **Mostly "Kind/Function" Answers (Q4-B, Q6-A): The Sortalist**
  *   **The View:** You believe an object's persistence depends on what *kind* of thing it is (its sortal). A "puddle" has different survival rules than "water" because they belong to different kinds. (Note: This often overlaps with Coincidentalism).
  *   **Philosophers:** David Wiggins, E.J. Lowe.

  ***

  ## Limitations & Oddities

  **1. The Indistinguishable Pair: Sortalism vs. Coincidentalism**
  This quiz cannot reliably separate **Sortalism** from **Coincidentalism**. Both positions typically agree that the statue and the clay are distinct entities with different survival conditions. The difference is theoretical: Coincidentalists say they are two objects sharing matter; Sortalists say the *concept* of the object dictates its identity. In a practical quiz about cases, they will almost always select the same answers.

  **2. The Indistinguishable Pair: Deflationism vs. Relative Identity**
  Similarly, **Deflationists** (who say the dispute is verbal) and **Relative Identity** theorists (who say identity is sortal-relative) will often both choose options like "It depends on what you mean" or "Both are correct in different senses." Distinguishing them requires asking *why* the ambiguity exists (language vs. metaphysics), which is too technical for this format.

  **3. The Impossible Profile: The "Contradictory Monist"**
  You should expect **nobody** to score a combination of **Constitution-as-Identity** (claiming the statue and clay are one object) while simultaneously choosing **Coincidence-style survival** answers (claiming the clay existed before the statue, or survives the squashing while the statue does not).
  *   **Why?** This violates Leibniz's Law (the Indiscernibility of Identicals). If $X$ and $Y$ are truly one object, they must share all properties, including when they begin and end. Claiming they are identical but have different life stories is logically incoherent, not just unattractive. If a reader ends up here, they likely misunderstood the questions.
