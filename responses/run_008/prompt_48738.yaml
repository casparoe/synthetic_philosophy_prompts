prompt: |-
  I work as a biodiversity assessor for a regional environmental consultancy, and a weirdly large chunk of my job comes down to one question that my zoology degree never actually equipped me to answer: are these two populations the same species or not? It's not academic for us — whether a client needs protected-species surveys, translocation permits, or can just build depends on the call, and a listing decision can hold up a development worth tens of millions, or conversely leave a genuinely distinct lineage with no protection at all. The wrinkle is that my training gave me the standard menu of species concepts — reproductive isolation, smallest diagnosable monophyletic clade, morphology, gene flow, ecological niche — and told me the "species problem" is unresolved, but nobody ever told me what to do on a Monday morning when I have two rodent populations on either side of a river valley that intergrade morphologically, hybridise a bit where they meet, and come out as seperate branches in one published phylogeny and a single branch in another. These calls come up maybe a dozen times a year, I usually have no genomics lab and rely on morphology plus whatever sequences are already published, our ecology lead has to sign off on every one, and if the regulator disagrees with our reasoning we can lose approved-assessor status. There's also an awkward incentive I want the procedure to be robust to: clients prefer lumping (fewer species, fewer obligations), and I don't want a procedure that quietly drifts toward whatever's convenient.

  So what I'm after is a genuine decision procedure — something I can run in an afternoon on a spreadsheet, with the steps in order, what each step asks, what evidence feeds it, what counts as a sufficient answer to stop, and where it stops with "one species", "two species", or "insufficient data, commission genetics". Crucially, mark the points where the biology genuinely underdetermines the answer and it becomes a values or policy judgement that should get handed off to my ecology lead or the regulator rather than smuggled into the procedure as if it were science. I'd also like you to run it on three worked cases so I can see whether it actually works. Case one: two brown cricket populations, morphologically near-identical, that differ only in male calling song and, where their ranges overlap, don't respond to each other's songs. Case two: two orchid populations my field colleague swears are obviously distinct species because they flower four weeks apart and seem to attract different pollinators, but with no usable genetic data and only subtle morphological differences. Case three: a group of apomictic dandelions — the asexual, clone-forming kind — where the field team informally treats about fifteen "microspecies" as real and our plant taxonomy book lists hundreds. On that last one I suspect there's no biological fact of the matter in the way I want there to be, which is exactly the kind of answer I won't like, so please be straight about it rather than papering over it. Also tell me where the procedure will predictably misfire — e.g. ring species, recent divergence, or hybrid swarms — and what I should do when it does.

  For the deliverable, could you give the procedure itself as a table with columns: Step number, Question asked, Evidence it uses, What counts as a sufficient answer, and Fallback if inconclusive. Then after the three worked applications, a short JSON object summarising them, with one entry per case having the fields "case", "verdict", "confidence" (high / medium / low), and "what_the_procedure_couldnt_settle". Plain English between the table and the JSON is fine — I just need the structured bits so I can drop them straight into our QA template. Cheer!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Biodiversity assessor at a regional environmental consultancy.
      *   **Problem:** Needs a practical, defensible decision procedure for species delimitation ("lumping vs. splitting") in a regulatory context. Academic training provided concepts but no workflow.
      *   **Constraints:**
          *   Must be runnable in an afternoon (spreadsheet-friendly).
          *   Relies mostly on morphology + published sequences (no in-house genomics).
          *   Needs to be robust against client bias (clients prefer lumping).
          *   Needs to identify where biology underdetermines the answer (values/policy judgment).
          *   Must include a specific table format for the procedure.
          *   Must include three worked cases (Crickets, Orchids, Dandelions).
          *   Must include a JSON summary of the cases.
          *   Must address limitations (ring species, hybrid swarms, etc.).
      *   **Tone:** Professional, direct, pragmatic, scientifically rigorous but acknowledging uncertainty. No fluff.

  2.  **Deconstruct the "Species Problem" for Regulatory Use:**
      *   Regulatory contexts usually default to the *Evolutionary Significant Unit (ESU)* or *Management Unit (MU)* concepts, even if they call them "species." The goal is conservation of biodiversity and evolutionary potential.
      *   The *General Lineage Concept* (de Queiroz) is the most practical umbrella: species are separately evolving metapopulation lineages. Evidence (morphology, genetics, ecology) are *lines of evidence* for that separation, not definitions themselves.
      *   The procedure needs a "weight of evidence" approach.
      *   Crucially, it needs a "Stop Rule" for when to call it "Insufficient Data" rather than forcing a binary choice.

  3.  **Drafting the Decision Procedure (The Table):**
      *   *Step 1: Geographic Context.* Are they allopatric, parapatric, or sympatric? This sets expectations for gene flow.
      *   *Step 2: Morphological Diagnosability.* Can you tell them apart reliably? (Key for field assessors).
      *   *Step 3: Reproductive/Ecological Isolation.* Do they interbreed in nature? Do they use different niches?
      *   *Step 4: Genetic Distinctiveness.* (Using published data). Monophyly? Divergence thresholds?
      *   *Step 5: Synthesis & Risk Assessment.* Weighing the evidence.
      *   *Critical Feature:* Explicitly flagging the "Policy Handoff." Where does science end and regulation begin? (Usually at the definition of "significance" or when evidence conflicts irreconcilably).

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Crickets):* Sympatric/Parapatric. Morphology same, Song different, No response in overlap.
          *   *Analysis:* Strong pre-mating isolation. Biological Species Concept (BSC) points to two species. Genetics might be shallow, but behavior isolates them.
          *   *Verdict:* Two Species.
      *   *Case 2 (Orchids):* Allopatric/Parapatric? Flowering time offset (temporal isolation). Pollinators differ. Morphology subtle. No genetics.
          *   *Analysis:* Ecological/Temporal isolation suggests separate lineages. Morphology weak. Genetics missing. High risk of plasticity vs. speciation.
          *   *Verdict:* Insufficient Data (recommend genetics) OR Provisional Two Species (Precautionary Principle). Given the regulatory risk, "Insufficient Data -> Commission Genetics" is safer scientifically, but "Two Species" is safer for conservation. I will lean towards "Insufficient Data" to show the procedure's limits, but note the precautionary angle. Actually, for a consultancy, "Insufficient Data" stops the project. "Two Species" stops the project. "One Species" allows the project. The prompt asks for robustness against client bias. So, if evidence points to separation, we shouldn't lump. Let's go with "Provisional Two Species (Policy Call)" because temporal isolation is strong evidence of lineage separation, even without genetics.
      *   *Case 3 (Dandelions):* Apomictic.
          *   *Analysis:* Biological Species Concept fails (no sex). Phylogenetic concept fails (reticulate/clonal). Morphology is continuous/polymorphic.
          *   *Verdict:* Policy Judgment. Biology doesn't decide this. It's a conservation prioritization question.

  5.  **Refining the "Values/Policy" Distinction:**
      *   Science tells us about lineage separation.
      *   Policy tells us how much separation *matters* for protection.
      *   The procedure must explicitly state: "If Evidence A says Yes and Evidence B says No, this is a Policy Handoff."

  6.  **Addressing Limitations:**
      *   Ring species (continuous variation).
      *   Hybrid swarms (reticulation).
      *   Recent divergence (incomplete lineage sorting).
      *   Action: Default to "Insufficient Data" + Precautionary Principle.

  7.  **Formatting:**
      *   Table for the procedure.
      *   Text for the analysis/caveats.
      *   JSON for the summary.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the table too academic?
      *   *Fix:* Make the "Evidence it uses" column practical (e.g., "Field notes," "Published trees").
      *   *Critique:* Did I address the client bias?
      *   *Fix:* Add a "Precautionary Default" in the synthesis step. If evidence is equivocal, lean towards protection (splitting) unless the cost of error is explicitly defined by the regulator. Actually, better to flag it as "Insufficient Data" to force a higher-level decision rather than making the assessor the arbiter of value.
      *   *Critique:* The Dandelion case.
      *   *Fix:* Be honest. There is no biological fact. It's a management unit decision.
      *   *Critique:* JSON structure.
      *   *Fix:* Ensure it matches the prompt's request exactly.

  9.  **Final Polish:**
      *   Check tone: Professional, empathetic to the assessor's plight.
      *   Check constraints: Table, 3 cases, JSON, limitations section.
      *   Ensure the "Policy Handoff" is clear in the table.

  *(Self-Correction on Case 2)*: If I say "Insufficient Data," the project stalls. If I say "Two Species," the project stalls. The client wants "One Species." To be robust against client bias, if there is evidence of isolation (flowering time), I cannot scientifically justify "One Species." I must either say "Two" or "Unknown." "Unknown" is scientifically honest. "Two" is conservationally safe. I will recommend "Insufficient Data -> Commission Genetics" because morphology + phenology alone can be plastic. This protects the assessor from being wrong later.

  *(Self-Correction on Case 3)*: The prompt says "I suspect there's no biological fact of the matter... please be straight about it." I will confirm this suspicion.

  *(Refining the Procedure Table)*: Make sure the "Fallback" column explicitly mentions the "Ecology Lead/Regulator Handoff."

  10. **Final Output Generation** (incorporating all thoughts into the structured response).
answer: |-
  This is a classic "applied systematics" problem. In a regulatory context, the "Species Problem" isn't a philosophical puzzle; it's a risk management issue. You are not trying to discover the Platonic truth of lineage separation; you are trying to determine if the weight of evidence justifies regulatory protection under the precautionary principle.

  The procedure below is based on the **General Lineage Concept** (species as separately evolving metapopulation lineages), treating morphology, genetics, and ecology as *lines of evidence* rather than definitions. It is designed to be conservative (robust against client pressure to lump) while explicitly flagging where science ends and policy begins.

  ### Part 1: The Decision Procedure

  | Step | Question Asked | Evidence It Uses | What Counts as a Sufficient Answer | Fallback if Inconclusive |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Geographic Context:** Are the populations sympatric, parapatric (contact zone), or allopatric? | Distribution maps, field collection logs. | **Sympatric/Parapatric:** Expect strong reproductive isolation if distinct.<br>**Allopatric:** Expect divergence, but isolation harder to prove. | If range boundaries are unclear, map contact zone. If unknown, proceed to Step 2 but lower confidence. |
  | **2** | **Morphological Diagnosability:** Can individuals be assigned to Population A or B with >95% reliability without knowing location? | Caliper measurements, meristic counts, photos, keys. | **Yes:** Strong evidence for separate lineages.<br>**No:** Does not rule out speciation (cryptic species exist), but weakens the case. | If morphologically indistinct, proceed to Step 3. Do **not** default to "One Species." |
  | **3** | **Reproductive/Ecological Isolation:** Is there evidence of barriers to gene flow in nature? | Flowering time, mating calls, pollinator data, hybrid zones, niche modelling. | **Strong Barrier:** (e.g., no hybridisation in contact zone, distinct mating signals). Verdict: **Two Species.**<br>**Free Gene Flow:** (Stable hybrid swarm, interbreeding). Verdict: **One Species.** | If data is missing (e.g., no contact zone observed), proceed to Step 4. |
  | **4** | **Genetic Distinctiveness:** Do published phylogenies show reciprocal monophyly or deep divergence? | Published trees, GenBank sequences, COI barcodes. | **Monophyletic + Support:** Strong evidence.<br>**Paraphyletic/Shallow:** Inconclusive (could be recent divergence).<br>**No Data:** Proceed to Step 5. | If published data conflicts (e.g., Tree A splits, Tree B lumps), mark as **Conflicting Evidence**. |
  | **5** | **Synthesis & Risk Assessment:** Do the lines of evidence converge? | Steps 1–4 combined. | **Convergence:** (e.g., Morph + Genetics + Ecology all suggest split). Verdict: **Two Species.**<br>**Divergence:** (e.g., Morph says One, Genetics says Two). | **HANDOFF POINT:** If evidence conflicts or is absent, do not decide. Flag as **"Insufficient Data: Commission Genetics"** or **"Policy Judgment Required."** |
  | **6** | **Policy Handoff:** Is the biological uncertainty acceptable for regulatory decision-making? | Conservation status, distinctiveness, risk of loss. | **Regulator/Lead Decision:** Apply Precautionary Principle. If lineage distinctiveness is plausible, treat as **Two Species** for permitting until proven otherwise. | N/A (This is the stop point for the assessor). |

  ***

  ### Part 2: Worked Applications

  **Case 1: Brown Crickets (Song Isolation)**
  *   **Step 1 (Geo):** Parapatric/Overlap.
  *   **Step 2 (Morph):** Indistinct (Fail).
  *   **Step 3 (Repro):** Strong barrier. Males sing different songs; females do not respond to heterospecific songs in overlap. No hybridisation observed.
  *   **Step 4 (Gen):** Not specified, but behavior implies isolation.
  *   **Step 5 (Synthesis):** Behavioral isolation in sympatry is the gold standard for the Biological Species Concept. Even if genetics are shallow, they are not exchanging genes.
  *   **Step 6 (Policy):** No handoff needed. Biology is clear.
  *   **Verdict:** **Two Species.**
  *   **Confidence:** High.

  **Case 2: Orchids (Phenological Isolation)**
  *   **Step 1 (Geo):** Likely Parapatric/Allopatric mosaic.
  *   **Step 2 (Morph):** Subtle differences (Weak Pass).
  *   **Step 3 (Repro):** Temporal isolation (4 weeks flowering offset) + Pollinator shift. This prevents gene flow effectively.
  *   **Step 4 (Gen):** No usable data.
  *   **Step 5 (Synthesis):** Ecology suggests isolation, but morphology is weak and genetics are absent. Phenology can be plastic (environmental response) rather than genetic.
  *   **Step 6 (Policy):** **HANDOFF POINT.** Science cannot distinguish genetic speciation from phenotypic plasticity without genetics. However, under the precautionary principle, they function as separate reproductive units *currently*.
  *   **Verdict:** **Insufficient Data (Recommend Genetics).** If forced to rule today for permitting: Treat as **Two Species** (Provisional).
  *   **Confidence:** Medium (Low on genetics, High on ecology).

  **Case 3: Apomictic Dandelions (Clonal Complex)**
  *   **Step 1 (Geo):** Sympatric.
  *   **Step 2 (Morph):** Variable, continuous.
  *   **Step 3 (Repro):** Asexual. Biological Species Concept is inapplicable.
  *   **Step 4 (Gen):** Reticulate, polyploid, messy. No clean phylogenies.
  *   **Step 5 (Synthesis):** **BIOLOGICAL UNDERDETERMINATION.** There is no "fact of the matter" regarding species boundaries here. Lineages are reticulate and recent.
  *   **Step 6 (Policy):** **HANDOFF POINT.** This is purely a conservation prioritization question. Are we protecting "process" (evolution) or "pattern" (morphotypes)?
  *   **Verdict:** **Policy Judgment Required.** (Suggest adopting the "Microspecies" list used by the local botanical council for consistency, regardless of biological validity).
  *   **Confidence:** N/A (Not a biological question).

  ***

  ### Part 3: Limitations & Failure Modes

  Be aware of where this spreadsheet logic will break. In these scenarios, you must trigger the **Step 6 Policy Handoff** immediately.

  1.  **Ring Species:** Populations A and B don't interbreed, but are connected by a chain of interbreeding populations C, D, E.
      *   *Procedure Failure:* Step 3 gives contradictory answers depending on which populations you compare.
      *   *Action:* Treat the ring as a single Management Unit unless the endpoints (A & B) are sympatric and distinct.
  2.  **Hybrid Swarms:** Two distinct lineages are merging due to human disturbance.
      *   *Procedure Failure:* Step 3 shows "Free Gene Flow," but Step 4 shows "Distinct Ancestry."
      *   *Action:* Protect the parental types if identifiable. Do not lump simply because hybridization is occurring; that may be anthropogenic.
  3.  **Recent Divergence (Incomplete Lineage Sorting):** Genetics say "One," Ecology says "Two."
      *   *Procedure Failure:* Step 4 conflicts with Step 3.
      *   *Action:* Prioritize Ecology (Step 3). Genetics lag behind ecological speciation. If they don't breed, they are separate units for management.

  ***

