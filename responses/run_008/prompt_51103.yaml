answer: |-
  # The Frame Problem: A Diagnostic Tree

  **Instructions:** Start at the root. Answer the questions based on your intuition about the scenario, not based on which papers you've read. Follow the arrows to your leaf. Once you land, read the "Position" and the "Awkward Commitment." Only then should you open the literature to find out who agrees with you.

  ***

  ### **[ROOT]**
  **Scenario:** An agent knows a bunch of facts about the world. It performs an action. It now needs to figure out what changed and what stayed the same.

  ### **[NODE 1]**
  **Question:** If a system learns to act successfully without ever storing facts as explicit sentences or rules (e.g., a statistical learner), does it still face this same hurdle?
  *   **NO:** It bypasses the issue entirely by not representing the world that way. → **[Go to Leaf A]**
  *   **YES:** Any system that acts in the world faces this, regardless of architecture. → **[Go to Node 2]**

  ### **[NODE 2]**
  **Question:** Is the core difficulty that there are too many facts to check *fast enough*, or that there is no clear rule for *which* facts count as relevant?
  *   **TOO MANY / FAST ENOUGH:** It's a bottleneck of computational resources and search. → **[Go to Node 3]**
  *   **WHICH FACTS / RELEVANT:** It's a bottleneck of meaning and rationality; speed doesn't help if you don't know what to look for. → **[Go to Leaf B]**

  ### **[NODE 3]**
  **Question:** Did the development of formal logical fixes (like successor state axioms) essentially close the book on this for planning agents?
  *   **YES:** The mathematical problem is patched; the mystery is resolved for planners. → **[Go to Node 4]**
  *   **NO:** The formal fixes are workarounds that don't address the underlying instability of the concept. → **[Go to Leaf C]**

  ### **[NODE 4]**
  **Question:** Is "The Frame Problem" in robotics the same problem as "The Frame Problem" in human cognition?
  *   **YES:** Solving it for the robot solves the theoretical puzzle for the mind. → **[Go to Leaf D]**
  *   **NO:** They are related but distinct issues; fixing the code doesn't explain the psychology. → **[Go to Leaf E]**

  ***

  ## **THE LEAVES**

  ### **Leaf A: The Representational Boundary**
  **The Position:** The Frame Problem is an artifact of a specific way of building minds (explicit logic). It never existed for systems that learn patterns implicitly, and it won't exist for future systems that don't rely on symbolic persistence.
  **The Awkward Commitment:** You must concede that a major philosophical crisis of the 20th century was essentially a bug report for a specific programming paradigm that we are already moving past.

  ### **Leaf B: The Relevance Gap**
  **The Position:** The problem is not about updating state, but about rationality. No amount of engineering solves the issue of how an agent determines what *matters* in a context without already knowing the context.
  **The Awkward Commitment:** You have to accept that computational power is fundamentally orthogonal to the problem, meaning smarter hardware gets you no closer to a solution than faster horses got you to the moon.

  ### **Leaf C: The Deflationary Dissolve**
  **The Position:** There is no single "Frame Problem." The term is a container for a family of unrelated issues (persistence, relevance, qualification, ramification) that were confusedly lumped together.
  **The Awkward Commitment:** You have to explain why decades of intense, coherent debate occurred if the participants were essentially arguing past each other about different problems the whole time.

  ### **Leaf D: The Technical Patch**
  **The Position:** The Frame Problem was a specific technical challenge regarding persistence in logical planning. It was solved by formal methods in the 90s, and the philosophical lingering is just nostalgia.
  **The Awkward Commitment:** You have to maintain that human common sense is either irrelevant to the problem or is functionally identical to a solved planning algorithm, despite evidence to the contrary.

  ### **Leaf E: The Cognitive Residue**
  **The Position:** The logic of persistence is solved for robots, but the psychological mechanism of how humans achieve this so effortlessly remains a deep, unsolved mystery distinct from the engineering fix.
  **The Awkward Commitment:** You must maintain a dual standard where the problem is "solved" in one domain (CS) but "profound" in another (Psych), risking the charge that you are just moving the goalposts to keep the mystery alive.

  ***

  ## **FACILITATOR NOTES & OVERLAP WARNINGS**

  **1. The "Solved" vs. "Boundary" Overlap (Leaf D vs. Leaf A)**
  *   **The Blur:** Both positions agree the problem isn't a deep mystery of intelligence. Leaf D says "We fixed it." Leaf A says "We outgrew it."
  *   **The Split:** The tree separates them at Node 1. If a participant believes statistical learners *still* have a frame problem (just in different clothes), they go to D. If they believe statistical learners *bypass* it, they go to A.
  *   **Facilitation Tip:** If someone argues, "Neural nets have to learn persistence too, so they have the problem," push them toward **Leaf D**. If they argue, "Neural nets don't represent 'same' explicitly, so the problem doesn't arise," push them toward **Leaf A**.

  **2. The "Patch" vs. "Residue" Overlap (Leaf D vs. Leaf E)**
  *   **The Blur:** Both agree the *logical* formalism is solved. The distinction is purely about whether that counts as solving the *cognitive* mystery.
  *   **The Split:** This is the Node 4 split. It separates the "Engineering Realist" from the "Cognitive Scientist."
  *   **Facilitation Tip:** This is the most likely friction point between your Robotics PhDs and Phil students. The Robotics folks will naturally land on **D**. The Phil folks will naturally land on **E**. Use this to frame the debate: *Is the Frame Problem a problem for building agents, or a problem for understanding minds?*

  **3. The "Fodor Trenchcoat" Check**
  *   **Node 2** is effectively asking "Are you Jerry Fodor?" (Relevance) vs. "Are you Daniel Dennett?" (Efficiency/Evolution).
  *   **Rephrasing Rationale:** I avoided asking "Is it epistemic or computational?" because that requires jargon. Asking "Is it about too many facts vs. which facts count" captures the same intuition without requiring a background in computational theory.

  **4. Usage Guide**
  *   Print this double-sided.
  *   Give everyone 5 minutes to trace their path silently.
  *   Ask people to group up by Leaf.
  *   **Crucial:** Do not reveal the names associated with the leaves until *after* the groups have discussed why they landed there. This prevents the "Oh, I'm a Dennettian" tribalism from kicking in before the argument starts.
