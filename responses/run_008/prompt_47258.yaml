answer: |-
  ### The procedure

  This algorithm must be completed within fifteen minutes. The Chair times each step. The minutes must record the specific Branch (A–D) that determined the outcome.

  **Step 1: The Deed Check (Branch A)**
  *Question:* Does the trust deed explicitly forbid or mandate this activity?
  *Sufficient Answer:* Yes/No based solely on the text.
  *Action:* If Yes, apply the deed. Stop. If No, proceed to Step 2.

  **Step 2: The Documented Intent Check (Branch B)**
  *Question:* Is there explicit written evidence (letters, memos) where the founder addresses this specific type of grant?
  *Sufficient Answer:* A direct quote or clear paraphrase from the archives.
  *Action:* If Yes, apply this intent unless it violates current law or safety standards. Stop. If No, or if the evidence relies on factual claims now known to be false, proceed to Step 3.

  **Step 3: The Idealization Construction (Branch C)**
  *Question:* What would the founder conclude if corrected on facts and forced to reconcile conflicting principles?
  *Sufficient Answer:* A consensus statement identifying (a) specific factual errors in the record relevant to this case, and (b) which of the founder's own principles takes precedence when they conflict.
  *Action:* If consensus is reached, apply this verdict. Stop. If no consensus, proceed to Step 4.

  **Step 4: The Projection Check (Branch C Validation)**
  *Question:* Is the proposed idealization grounded in the founder's record or the trustee's preference?
  *Sufficient Answer:* The trustee advocating the idealized view must cite the specific archival sentence containing the factual error or the specific pair of principles in conflict. General appeals to "modern values" or "what he would want today" are insufficient.
  *Action:* If the citation is provided, retain Branch C. If the argument relies on attributing new values to the founder that resolve no internal contradiction, flag as projection. Proceed to Step 5.

  **Step 5: The Fallback (Branch D)**
  *Question:* Can the board agree on the idealized verdict?
  *Sufficient Answer:* A vote.
  *Action:* If Step 4 fails or Step 3 deadlocks, the board decides based on current best judgment of the deed's broad purposes. Record as "Board Discretion."

  **Minutes Requirement:** For every proposal, the minutes must state: "Decision reached via Branch [A/B/C/D]." If Branch C, the minutes must list the specific factual correction or principle hierarchy used. If Branch D, the minutes must note "Idealized intent indeterminable."

  ### The three cases

  **1. Conditional Cash Transfer (NGO)**
  *Step 1:* Deed silent. *Step 2:* Founder distrusted large institutions, but never addressed cash transfers (post-dates death). *Step 3:* Idealization: Founder valued direct aid and evidence. The NGO provides evidence of direct reach despite size. *Step 4 (Projection Check):* Proponents cite the founder's principle ("reach people directly") vs. his heuristic ("distrust institutions"). The heuristic is not a principle but a means to an end. The factual correction is that this specific NGO bypasses administrative layers. *Verdict:* Branch C. Approved. The idealized founder prioritizes the outcome (direct aid) over the heuristic (size) when evidence confirms efficacy.

  **2. Needle Exchange**
  *Step 1:* Deed silent. *Step 2:* Founder wrote harshly against drug users. *Step 3:* Idealization: Founder's opposition relied on the factual claim that addiction is a moral failure rather than a medical condition (known false). His higher-order principle was "reducing preventable death." *Step 4 (Projection Check):* Proponents cite the specific letters on morality vs. medical data. They are not importing "progressive values" but correcting a factual error that blocked a core principle. *Verdict:* Branch C. Approved. The idealized founder corrects the error to satisfy his own primary principle.

  **3. Remediation vs. Prevention (Chair's Dislike)**
  *Step 1:* Deed silent. *Step 2:* Founder explicitly prioritized prevention over remediation in multiple memos. *Step 3:* Idealization: Chair argues founder would value immediate relief given current economic data. *Step 4 (Projection Check):* Chair cannot cite a factual error in the founder's prevention preference; it is a value weighting, not a factual claim. There is no internal contradiction between "prevent" and "relieve," only a hierarchy. The record consistently ranks prevention higher. *Verdict:* Branch C. Rejected. The idealized founder maintains the prevention priority. The Chair must vote against the remediation grant despite personal preference.

  ### Where judgment remains

  The procedure cannot eliminate discretion; it merely relocates it. Judgment remains critical at Step 3 (constructing the idealization) and Step 5 (the fallback). Trustees must judge whether a founder's view is a "factual error" or a "value judgment." For example, distinguishing between a false claim about poverty causes (factual) and a preference for workfare over welfare (value) requires interpretation.

  When Branch D is invoked, the minutes must be explicit: "Branch D: Board Discretion. Idealized intent indeterminable due to irreducible conflict between principles [X] and [Y] without clear hierarchy." This satisfies the regulator by demonstrating that discretion was exercised only after exhausting the founder's framework. It prevents the board from hiding behind a fabricated "idealized" consensus. The Chair must ensure the minutes reflect the deadlock honestly, not as a consensus that never existed. This preserves fiduciary integrity when the founder's voice is genuinely silent or incoherent.

  ### What this procedure cannot do

  This procedure does not solve the projection problem; it mitigates it. A determined trustee can still frame their preferences as "principle consistency" or "factual correction." The Projection Check (Step 4) raises the cost of doing so by requiring specific citations, but it cannot guarantee objectivity. The idealized founder remains a construct of the living board.

  Regarding the regulator: This procedure answers the question "How did you exercise discretion?" by showing due diligence and fidelity to the trust's origins. It demonstrates that the board did not act capriciously. However, it does not prove the decision was "correct" in a metaphysical sense. It repackages board politics, but into a structured, auditable format. It transforms subjective disagreement into a documented process of interpretation. This is sufficient for regulatory compliance, which seeks evidence of reasoned decision-making, not philosophical truth. Ultimately, the board remains responsible for the grants; the procedure is a tool for accountability, not a shield against liability.
