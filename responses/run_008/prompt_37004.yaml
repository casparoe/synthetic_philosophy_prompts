      *   *Timing/Duration:* Dement & Kleitman (1957). Waking subjects after 5 mins vs 15 mins of REM. Reports matched the estimated duration. This is strong evidence for real-time experience.
      *   *Lucid Dreaming (Eye Signals):* This is the strongest evidence. Pre-agreed eye signals (left-right-left-right) performed *during* REM. The physiological cost (eye muscles) and the timing match the task. If the dream were written at waking, how did the eyes move *during* sleep in accordance with a task decided *before* sleep? This bridges the gap.
      *   *Neural Decoding:* Kamitani's group (ATR). Using fMRI to predict dream content based on visual cortex activation *during* sleep, verified by report *after* waking. If the dream was made up at waking, the neural activation during sleep shouldn't predict the specific content so accurately.

  5.  **Synthesize the "Settled vs. Contested" Landscape:**
      *   *Settled:* Dreams correlate with specific neural activity (posterior hot zone). REM is not required for dreaming, but facilitates vividness. Reports are not random; they track physiology.
      *   *Contested:* The *exact* moment of phenomenological genesis. Is it a continuous stream interrupted by amnesia? Or is it fragments stitched together? The "confabulation" view is largely marginalized in neuroscience but remains a philosophical caution.
