answer: |-
  This is a fantastic philosophical dispute to be having in high school. Your friend has independently stumbled upon a legitimate philosophical position called **Mathematical Fictionalism**. It's a view held by serious philosophers (like Hartry Field), so he isn't just making things up—he's echoing a specific argument about the nature of reality.

  However, like most analogies in philosophy, the "Math is Fiction" comparison works well up to a point, and then it snaps. Here is the breakdown you asked for, designed to help you navigate the argument without just saying "you're wrong."

  ### 1. The Correspondence Table
  Here is how your friend's analogy maps the world of Mathematics onto the world of Fiction.

  | Element | In Fiction (Sherlock Holmes) | In Mathematics (Arithmetic) |
  | :--- | :--- | :--- |
  | **The Author** | Arthur Conan Doyle | Mathematicians / Humanity |
  | **The Canon** | The collection of stories | The Axioms (e.g., Peano Axioms) |
  | **The Characters** | Holmes, Watson, Moriarty | Numbers ($1, 2, 3...$), Sets, Functions |
  | **The Plot** | The events of the stories | Proofs and Derivations |
  | **Consistency** | "In Character" behavior | Logical Consistency / Validity |
  | **Truth** | "True in the story" | "True in the system" (Theorem) |
  | **The Reader** | The public / You | Students / Scientists / Engineers |

  ### 2. Where the Analogy Breaks Down
  The analogy fails in three specific areas. However, not all failures are equal.

  **A. Authorial Freedom (The "Doyle Test")**
  *   **Fiction:** Conan Doyle could have decided tomorrow that Holmes actually lives in Paris. It would contradict previous books, but he is the *author*. He has ultimate authority.
  *   **Math:** A mathematician cannot decide that $2 + 2 = 5$. Even the person who wrote the textbook cannot change this without breaking the system. They are constrained by logic itself.
  *   **Verdict:** **Major Breakdown.**

  **B. Applicability to Reality**
  *   **Fiction:** If you build a bridge using "Holmes Physics" (e.g., assuming people can jump between rooftops like in the stories), the bridge won't stand up. Fiction does not constrain the physical world.
  *   **Math:** If you build a bridge using Arithmetic and Calculus, it stands up. Math predicts physical behavior (orbits, structural load, electricity) with uncanny precision.
  *   **Verdict:** **Major Breakdown.**

  **C. Discovery vs. Decision**
  *   **Fiction:** Details are *decided*. Doyle decided Holmes plays the violin.
  *   **Math:** Theorems are *discovered*. Mathematicians often spend centuries trying to find out if a statement is true (like Fermat's Last Theorem). They speak of "uncovering" truths, not "choosing" them.
  *   **Verdict:** **Moderate Breakdown.** (This is subjective experience, but a strong one).

  ### 3. Which Disanalogies Actually Matter?
  To defeat your friend's conclusion ("Math is invented conventions we could have written differently"), you need to focus on the disanalogies that attack **necessity** and **constraint**.

  **The Disanalogies That *Don't* Matter Much:**
  *   **Physical Existence:** Your friend is right that you can't kick a number like you kick a rock. Neither Holmes nor the number 7 are physical objects. Arguing that numbers are "real" in a physical sense is a trap. Admit numbers aren't physical.
  *   **Human Origin:** Your friend is right that humans created the *symbols* and the *language* of math. We invented the word "two." This doesn't prove we invented the *concept*.

  **The Disanalogies That *Do* Matter (The Kill Shots):**
  1.  **Constraint on the Author:** This is the most important point. In fiction, the author is outside the system, controlling it. In math, the mathematician is *inside* the system, subject to it. Once you define what "2", "+", and "=" mean, you lose the freedom to decide what they do.
      *   *Argument:* "If math is like fiction, why can't we vote to change $2+2=4$? Conan Doyle could change Holmes' address by fiat. Gauss couldn't change prime numbers by fiat."
  2.  **Indispensability:** Fiction is optional; math is not. You can live a full life without Sherlock Holmes. You cannot do modern physics, engineering, or economics without arithmetic.
      *   *Argument:* "If math is just a story we tell, why does the universe obey the story? If we changed the story, would gravity stop working? If the universe forces us to use specific math to describe it, the math isn't just in our heads."

  ### 4. Does a Weaker Version of His Conclusion Survive?
  Yes. You should concede this to him, because it makes your counter-argument stronger.

  **The Surviving Conclusion:** *The Axioms are Conventions; The Theorems are Discoveries.*
  Your friend is half-right. We *do* invent the starting rules (the axioms). For example, we chose to do math in Base-10. We chose Euclidean geometry for a long time, then chose Non-Euclidean geometry for relativity. In that sense, we "write the story."

  **The Refutation:** However, once the rules are written, the consequences are **necessary**, not conventional.
  *   **Analogy:** We invented the rules of Chess. That is a convention. We could have made the Bishop move differently.
  *   **The Kicker:** But once the rules are set, whether a "Checkmate in 3 moves" exists is **not** a convention. It is an objective truth waiting to be found. We didn't "invent" the checkmate; we discovered it was forced by the rules we invented.

  So, the weaker conclusion that survives is: **"Math is a game with invented rules, but objective truths."** This defeats the idea that we could have "written it differently" *without changing the subject.* If you change $2+2=4$, you aren't doing arithmetic differently; you are doing something else entirely.

  ### 5. Better Analogies Than Fiction
  If your friend wants an analogy that captures "human-made but objectively constrained," Fiction is the wrong tool. Try these:

  **A. Chess (The Best Fit)**
  *   **Why it works:** Like math, chess is a human invention. The pieces and board don't exist in nature.
  *   **The Constraint:** But once the rules are set, the strategies are discovered. There are objective truths in chess (e.g., "A King and Rook can force checkmate against a lone King"). You cannot "conventionally" decide otherwise.
  *   **Takeaway:** Math is like Chess. We built the board, but we don't control the game.

  **B. Grammar / Language**
  *   **Why it works:** Humans invented English. There is no physical "English" particle.
  *   **The Constraint:** But once the language exists, there are objective facts. "The cat sat on the mat" is grammatical; "Cat the mat on sat the" is not. You cannot vote to make the second one grammatical without breaking communication.
  *   **Takeaway:** Math is the grammar of the universe. We invented the words, but the syntax is rigid.

  **C. Law (With caveats)**
  *   **Why it works:** Laws are written by humans (conventions).
  *   **The Constraint:** Legal logic requires consistency. If a law says X, you cannot logically conclude Y without breaking the system.
  *   **Takeaway:** Good for explaining "internal truth," but bad because laws *can* be changed by vote, whereas math cannot.

  ### Summary for Your Argument
  Tell your friend this:
  > "I agree that numbers aren't physical rocks, and I agree humans invented the *symbols* and the *axioms*. But the Fiction analogy fails because Conan Doyle is the master of Holmes, while Mathematicians are the servants of Numbers. Doyle could change Holmes' address tomorrow. A mathematician cannot change $2+2=4$ without ceasing to do math.
  >
  > A better analogy is **Chess**. We invented the rules of Chess, sure. But we didn't invent the fact that a Bishop moves diagonally, and we didn't invent the strategies that win games. Those truths are objective once the game begins. Math is a game we invented, but the truths inside it are discoveries, not inventions."

  This grants him his philosophical sophistication (acknowledging math isn't physical) while holding the line on objectivity (math isn't arbitrary).
