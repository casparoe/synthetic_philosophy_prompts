          *   Specify what to concede is beyond the scope of the session.

  2.  **Deconstruct the Core Concepts (for internal clarity, not for output):**
      *   *Orthogonality Thesis:* Intelligence and Final Goals are independent axes. A superintelligence can have any goal (e.g., making paperclips) regardless of how smart it is.
      *   *Instrumental Convergence:* Regardless of the final goal, certain sub-goals (instrumental goals) are useful for almost *any* final goal (e.g., self-preservation, resource acquisition, cognitive enhancement).
      *   *The Trap:* AI movies usually make the AI evil (malice) or conscious (sentience). The reality is competence without conscience.

  3.  **Design the Session Structure (90 Minutes):**
      *   Need a logical flow: Hook/Case Study -> Concept 1 (Orthogonality) -> Concept 2 (Instrumental Convergence) -> Misconception Busting -> Diagnostic.
      *   Time allocation: 15 min intro/case, 20 min orthogonality, 25 min convergence, 20 min misconceptions/discussion, 10 min wrap-up.

  4.  **Develop the Case Study:**
      *   *Requirement:* Mundane goal, not sinister, no "wanting power."
