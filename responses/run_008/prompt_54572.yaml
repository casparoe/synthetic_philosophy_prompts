      *   *Sentence 6:* "Jade fits the same pattern: it is a natural kind because, like water, it has a hidden essence..." (**CRITICAL ERROR**. In philosophy of science, jade is the *classic counterexample* to the microstructural essence view. Jadeite vs. Nephrite. It lacks a unified chemical essence).
      *   *Sentence 7-8:* Biology is fuzzy (Ring species, asexual lineages, Boyd/Dupré, HPC view). (Accurate summary of the biological challenge to essentialism).
