      *   *Refining the Grade for the User:* The user is a chemist. They will care about accuracy. Telling them "This is a B-" allows me to highlight the jade error as the main deduction. If I give a C, it might seem too harsh for the quality of writing. If I give an A-, it ignores the error. **B-** is the sweet spot.

