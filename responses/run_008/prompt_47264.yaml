answer: |-
  The child cries out, defining **harm**.
  The teacher asks only what is **fair**.
  The parent whispers we must be **loyal**.
  To the house, the name, the **authority**.
  Where the bible rests, untouched and **sacred**.
  Outside, the wind blows wild and **free**.

  Markets claim to keep us **free**.
  But regulations prevent hidden **harm**.
  They hold the soil itself as **sacred**.
  Is it **fair** to tax the wind?
  Who grants the scientist **authority**?
  Is silence here a way to stay **loyal**?

  The soldier swore to stay **loyal**.
  To buy back his own **free**dom.
  Under the gaze of **authority**.
  Does the tariff cause real **harm**?
  Or is the exchange **fair** by nature?
  Some boundaries must remain **sacred**.

  Not every statue is **sacred**.
  Unless it binds us **loyal**.
  Is it **fair** to judge by intent?
  Let the people choose, let them be **free**.
  Until someone takes **harm**.
  Then call the **authority**.

  The judge represents **authority**.
  But feels the **sacred** weight of the gavel.
  Weighing the physical **harm**.
  Against the duty to be **loyal**.
  To the law that keeps us **free**.
  Is the verdict **fair**?

  No one agrees on what is **fair**.
  They question every **authority**.
  Shouting they want to be **free**.
  Clinging to something **sacred**.
  Promising to stay **loyal**.
  While ignoring the quiet **harm**.

  We chart the words, not what is **fair** or **sacred**.
  We hear the **authority**, feel the **loyal** pulse.
  And remain **free**, though we cannot fix the **harm**.
