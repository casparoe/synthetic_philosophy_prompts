      *   *Wait, one nuance:* The rival hypothesis says there's a dispute about *whether function statements carry normativity*. This is substantive. I should concede that *some* participants are indeed fighting over normativity, but that's a symptom, not the cause. The cause is the conflation of explanatory projects.

      *   *Recommendation:* Stop trying to solve the definition. Start mapping the *explanatory contexts*.

      *(Self-Correction during drafting)*: I need to be careful not to sound dismissive. The user is a grad student looking for a way out of a stalemate. I need to offer a constructive philosophical path, not just "give up." The path is *Pragmatic Contextualism*.

