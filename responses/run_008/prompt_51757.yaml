answer: |-
  Your diagnosis is astute, and your frustration is well-founded. The "pluralist truce" you describe is indeed a classic case of philosophical peace-treaty writing that fails to account for the grammar of actual scientific practice. You asked me to test your hypothesis against the rival substantive diagnosis, analyze the specific cases, and determine what counts as progress.

  Here is the diagnosis: **Your hypothesis is correct in principle but underestimates the structural rigidity of the language.** The impasse is not merely that "function" does two jobs; it is that biological explanation demands a *unified grammatical form* for two *divergent explanatory directions*, and the pluralist settlement asks scientists to do cognitive labor they have no incentive to perform.

  The rival diagnosis (that there is a substantive dispute about normativity) is a symptom, not the cause. The normativity fight flares up only when the explanatory directions collide.

  ### 1. Testing the Hypotheses

  **Your Hypothesis (Verbal/Pragmatic):** The two sides are answering different questions (Normative/Metaphysical vs. Descriptive/Explanatory) under a single label.
  **Rival Hypothesis (Substantive):** There is a genuine metaphysical disagreement about whether functions are inherently normative.

  **Verdict:** Your hypothesis fits the data better, specifically because of the **Recent Selection** case you mentioned. If the dispute were substantive (about the metaphysical nature of function), intuitions should not flip based on whether the case is described in terms of the *past* or the *present*. The fact that framing triggers the intuition shift proves that the concept is context-sensitive, not metaphysically fixed.

  However, the rival diagnosis captures something your hypothesis misses: the *stakes*. The SE camp isn't just doing "metaphysical work"; they are protecting the distinction between *adaptation* and *effect*. The CR camp isn't just doing "descriptive work"; they are protecting the relevance of *current systemic utility*. The disagreement feels substantive because both sides believe their explanatory direction is the *primary* one for biology.

  ### 2. Diagnosing the Cases

  The pluralist truce fails in these cases because it requires speakers to explicitly disambiguate "function$_{SE}$" vs. "function$_{CR}$" in real-time. Biologists (and philosophers discussing concrete cases) do not do this. They use "function" as a single pivot. Here is why the truce collapses in your four scenarios:

  **A. The Arrhythmic Heart**
  *   **The Clash:** SE says the function is *pumping* (the historical standard). CR says explaining the arrhythmia involves citing the *causal role* of the damaged tissue (e.g., turbulent flow).
  *   **Why the Truce Fails:** The SE theorist hears the CR theorist saying "The function of this heart is to cause arrhythmia" and interprets it as a category error (confusing effect for function). The CR theorist hears the SE theorist saying "The function is pumping" and interprets it as unhelpful for explaining the *current* pathology.
  *   **Diagnosis:** This is a disagreement about the **object of ascription**. SE ascribes function to the *trait type* (heart qua selected trait). CR ascribes function to the *token state* (this heart qua causal system). Pluralism says "both are valid," but in a medical explanation, you cannot say both simultaneously without sounding incoherent.

  **B. The Lens-Inducing Tissue**
  *   **The Clash:** CR says "It induces lenses, that's its function." SE says "It has no selection history for that, so it's a byproduct (or the function belongs to the developmental system)."
  *   **Why the Truce Fails:** This is the **Spandrel Problem**. For the CR theorist, current utility is sufficient for function. For the SE theorist, current utility without history is merely *usefulness*. When the CR theorist calls it a "function," the SE theorist hears a collapse of the adaptation/byproduct distinction, which threatens the core of evolutionary explanation.
  *   **Diagnosis:** This is where the rival substantive diagnosis gains traction. The SE camp believes calling this a "function" erases the historical constraint that makes biology distinct from physics. The disagreement is about **boundary maintenance** for the discipline, not just word usage.

  **C. Recent Selection Pressure**
  *   **The Clash:** Intuitions flip based on framing (past history vs. present contribution).
  *   **Why the Truce Fails:** This is the smoking gun for your hypothesis. It demonstrates that "function" is a **pragmatic placeholder**. When the context highlights history, SE wins. When the context highlights mechanism, CR wins.
  *   **Diagnosis:** The impasse here is purely **contextual**. The pluralist truce fails because it treats SE and CR as static *types* rather than dynamic *modes of inquiry*.

  **D. Artifacts and Institutions**
  *   **The Clash:** SE (design/intent history) vs. CR (current institutional role).
  *   **Why the Truce Fails:** This reveals that the biological debate is importing a **general semantic problem**. If "function" works this way in artifacts (where we know the history), the biological debate is not about biology *per se*, but about the logic of teleological language.
  *   **Diagnosis:** The biological function debate is a subset of a broader **teleosemantic** problem. The friction arises because biologists want "function" to mean "selected effect" (to distinguish from artifacts) but also "causal role" (to distinguish from empty metaphysics).

  ### 3. The Core Diagnosis: Explanatory Directionality

  The reason the pluralist settlement is a "truce nobody honors" is that it treats the disagreement as **ontological** (there are two kinds of functions) when it is actually **explanatory** (there are two directions of fit).

  1.  **Backward-Looking (SE):** Explains why the trait *exists*. (Etiology)
  2.  **Sideways-Looking (CR):** Explains how the system *works*. (Mechanism)

  The word "function" is grammatically singular, forcing these two directions into one slot. When your reading group argues, they are not arguing about the definition of "function"; they are arguing about **which explanatory project is currently on the table.**

  The SE camp feels the CR camp is ignoring *why we have the trait*. The CR camp feels the SE camp is ignoring *what the trait is doing now*. The pluralist says "Do both," but in a specific sentence about a specific case, you usually need one specific explanatory vector. The friction is the result of trying to force a bivalent explanatory tool into a univalent grammatical slot.

  ### 4. What Counts as Progress?

  If my diagnosis is correct, **no theoretical progress on the definition of "function" is possible or desirable.** Attempting to refine the definition further is what has caused the two-year stalemate. You cannot define a word out of a pragmatic ambiguity that serves a dual explanatory purpose.

  **Real progress would look like one of the following:**

  1.  **Abandonment of the Unified Term (Unlikely but Ideal):** The field adopts distinct vocabulary (e.g., "Adaptation" for SE, "Role" for CR). This has been proposed many times and failed because biologists refuse to change their locution.
  2.  **Explicit Contextualism (Pragmatic Progress):** The group stops asking "What is the function of X?" and starts asking "What explanatory work is 'function' doing in this sentence?"
      *   *Test for Progress:* In your reading group, ban the sentence "The function of X is Y." Require the formulation: "Relative to [Selection History / System Capacity], X contributes Y." If the group can agree on the *contribution* and the *history* separately without fighting over whether to label it "Function," the impasse dissolves.
  3.  **Formal Account of Explanatory Interests (Theoretical Progress):** A model that predicts *when* intuitions will flip. Your "Recent Selection" case hints at this. A successful theory wouldn't define function; it would map the **contextual triggers** that select the SE or CR interpretation. (e.g., "If the context involves pathology, CR dominates; if the context involves evolutionary taxonomy, SE dominates.")

  ### 5. Conclusion

  You should tell your reading group this: **The debate persists because you are treating a pragmatic ambiguity as a metaphysical contradiction.**

  The pluralist truce failed because it told you that you *could* use both accounts, but it didn't tell you *how* to switch between them without generating contradiction. The contradiction arises because "function" implies a unity of purpose that the biology does not always support.

  **My recommendation:** Stop trying to resolve the cases. Start cataloging the **explanatory interests** that trigger each intuition. If you can map the conditions under which a biologist defaults to SE vs. CR, you have moved past the stalemate. You will have shown that the "disagreement" is not about the world, but about the **heuristic utility** of the term in different investigative contexts.

  If you seek a final verdict: **No progress should be expected on the metaphysics of function.** The concept is essentially contested because it serves two masters (History and Mechanism). Progress lies only in the **philosophy of scientific practice**—understanding why biologists need a single word to do two jobs, and how that efficiency generates philosophical friction.
