      *   *Rival Hypothesis:* Substantive/Metaphysical. There is a real dispute about whether normativity is inherent to biological function. Pluralism is a cover-up.
      *   *My Assessment:* It's likely a mix, but leaning towards a *pragmatic ambiguity masked as metaphysical disagreement*. However, the "substantive" element isn't just about normativity; it's about *explanatory relevance*. The SE folks care about *why the trait is there* (history), CR folks care about *how the system works now* (mechanism). The conflict arises because biologists use "function" to do *both* simultaneously in practice, while philosophers try to separate them into distinct buckets.

  3.  **Analyze the Cases through the Lens of the Diagnosis:**
