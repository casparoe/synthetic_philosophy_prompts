      *   *New Foundations (NF):* Quine's system. Allows a universal set. Uses "stratification" instead of separation. Consistency is still an open/complex question (relative to ZFC).
      *   *Non-Well-Founded Set Theory (Aczel):* Allows $x \in x$, but still usually avoids the full Russell set contradiction via Anti-Foundation Axiom (AFA) combined with restricted comprehension.
      *   *Positive Set Theory:* Allows comprehension only for positive formulas.
      *   *Category Theory:* Sometimes treats "large categories" differently, but doesn't exactly give a set of all sets in the ZFC sense.
