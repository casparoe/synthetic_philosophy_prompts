  ### The Metaphysics of Mind Decision Tree

  **Node 1: The Zombie Intuition**
  Imagine a being that is an exact physical duplicate of you, down to the last synapse and atom, functioning exactly as you do. However, there is *nothing it is like* to be this being; it has no inner experience.
  *   **A.** I can clearly conceive of this being; the idea makes sense.
  *   **B.** I cannot conceive of this being; the idea seems impossible or confused.

  **Node 2: The Deflationist Check (Early Catch)**
  *(Reached if 1-B)*
  You say the zombie is impossible. Is this because the "feeling" of having an inner life is actually an illusion generated by your brain's reporting systems (so there is no extra fact to be missed), OR is it because the feeling is real but simply *is* the physical process itself (like heat is molecular motion)?
  *   **A.** The feeling is an illusion or error; there is no extra fact.
  *   **B.** The feeling is real, but it is identical to the physical process.

  **Node 3: Epistemic Depth**
  *(Reached if 1-A)*
  You say the zombie is conceivable. Is this because you currently lack enough information or imagination, OR would it remain conceivable even for a mind that knew all physical truths and reasoned perfectly?
  *   **A.** It is only conceivable because of our current ignorance or limits.
  *   **B.** It remains conceivable even for an ideal mind with perfect knowledge.

  **Node 4: The Modal Inference**
  *(Reached if 3-B)*
  If an ideal mind can conceive of the zombie, does that mean such a being is *genuinely possible* in reality, or can something be conceivable yet impossible (like a round square)?
  *   **A.** Yes, if it is ideally conceivable, it is genuinely possible.
  *   **B.** No, conceivability does not guarantee possibility in this case.

  **Node 5: The Concept of Experience**
  *(Reached if 4-B)*
  You say zombies are conceivable but impossible. Think of how we know "Water is H2O" (by scientific investigation) versus how we know "I am in pain" (by just having it). Does your concept of experience work like the water case (descriptive, discoverable) or the pain case (direct, demonstrative)?
  *   **A.** Like the water case; we might eventually explain the link theoretically.
  *   **B.** Like the pain case; the link is permanent but necessary due to how we refer to experience.

  **Node 6: Ontological Commitment**
  *(Reached if 4-A OR 5-A/B where Ontology is questioned)*
  *Note: To generate logical space for unoccupied leaves, we must ask the ontology question explicitly for the Modal branches.*
  *(Reached if 4-A)*
  You say zombies are possible. Is the thing having the experience the same substance as the brain, or a different kind of thing entirely?
  *   **A.** Same substance (Physical/Material).
  *   **B.** Different substance (Mental/Non-Physical).
  *(Reached if 5-A)*
  You say the gap will close. Is the experience ultimately physical, or distinct?
  *   **A.** Ultimately physical.
  *   **B.** Distinct.

  **Node 7: Causal Closure**
  *(Reached if 6-B [from 4-A])*
  You believe experience is distinct and zombies are possible. Do physical events (like your arm moving) have sufficient physical causes to explain them completely?
  *   **A.** Yes, physical causes are sufficient.
  *   **B.** No, the mind must push the matter to produce action.

  **Node 8: Intrinsic Nature**
  *(Reached if 7-A)*
  You believe physical causes are sufficient. Does physics describe the *intrinsic stuff* of the universe, or does it only describe the *mathematical structure and relations* of that stuff?
  *   **A.** Only structure; consciousness could be the intrinsic nature bearing the structure.
  *   **B.** Intrinsic stuff; consciousness is something extra added to the physical stuff.

