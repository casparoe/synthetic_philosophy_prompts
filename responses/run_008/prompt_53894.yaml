answer: |-
  This is a sharp切口 (incision) into the Brexit debate. Most commentary treats the referendum as a verdict on policy or character; treating it as a verdict on the *constitution of the demos* exposes the structural fragility of the vote.

  Here is the mapping of the episode through the boundary problem, followed by an audit of the democratic principles, and finally an assessment of what Brexit does to the circularity of democratic theory.

  ### 1. The Map: The Franchise as Historical Sediment

  You have the topology correct. The franchise was not designed *for* the referendum; it was inherited from the Westminster general election franchise, with specific accretions and subtractions.

  *   **Included:** British citizens (resident or abroad <15 years), Irish citizens (resident), Commonwealth citizens (resident), Gibraltar residents.
  *   **Excluded:** EU citizens (non-Irish/Commonwealth, resident), 16–17 year olds, British citizens abroad >15 years, Crown Dependencies (Isle of Man, Channel Islands).

  **The Anomaly:** As you note, an Australian on a two-year working visa (Commonwealth citizen) could vote. A Polish nurse who had paid UK taxes and lived in Manchester for a decade could not. A British expat in Spain for 14 years could vote; one in Spain for 16 years could not.

  This franchise was not a philosophical construction of "the people." It was a legal snapshot of the 1983 Representation of the People Act, modified by the specific EU Referendum Act 2015. It treats citizenship not as a function of stake or subjection, but as a function of historical lineage and reciprocal treaties.

  ### 2. Theoretical Audit: Principles vs. Reality

  Let's run the three main normative candidates for solving the boundary problem against this actual franchise.

  #### A. The All-Subjected Principle
  *Theory:* You should vote if you are subject to the coercive laws of the state making the decision.
  *   **Vindicates:** Resident EU citizens. They were subject to UK law, UK taxation, and UK jurisdiction. Their exclusion is a direct violation of this principle. It also vindicates the inclusion of resident Commonwealth and Irish citizens.
  *   **Condemns:** British expats. If they are living in Spain, they are subject to Spanish law, not UK law (regarding daily life). The 15-year rule is arbitrary here; subjection doesn't expire on a timer. It also casts doubt on Gibraltar (subject to UK law, but distinct legal order) and Crown Dependencies (excluded, though subject to Crown authority).
  *   **Blind Spot:** It cannot explain the **Irish vs. Romanian** distinction. Both were resident, both were subject to UK law. The principle demands they be treated identically. The fact that one could vote and the other couldn't is invisible to this theory, except as an error.

  #### B. The All-Affected Principle (Stakeholder)
  *Theory:* You should vote if your interests are significantly affected by the decision.
  *   **Vindicates:** 16 and 17-year-olds (the decision affects their futures more than the elderly). EU citizens (loss of rights). Scottish voters (constitutional future). Long-term expats (pension and healthcare rights).
  *   **Condemns:** Almost the entire actual franchise. The Commonwealth citizen on a working holiday is arguably *less* affected than the Polish nurse. The 15-year cutoff for expats is nonsensical under this principle (affect doesn't vanish at year 16).
  *   **Blind Spot:** The "infinite regress" problem. If we take "affected" seriously, does a US citizen affected by UK trade policy vote? This principle is too expansive to be operational without an arbitrary cutoff. However, regarding the **Irish vs. Romanian** question, this principle is scathing: it sees no relevant difference. Both are equally affected by residency. The distinction is normatively unjustifiable here.

  #### C. The Political Membership Principle (Status Quo)
  *Theory:* The demos is defined by existing legal membership (citizenship) and reciprocal treaties. This is the "realist" position.
  *   **Vindicates:** The actual franchise. It explains why the Australian is in (Commonwealth legacy) and the Romanian is out (EU citizenship is not UK membership). It explains the Irish exception (Common Travel Area treaties pre-date EU membership). It explains the 15-year rule (parliamentary statute).
  *   **Condemns:** Nothing, because it is descriptive, not normative. It refuses to judge the boundary, only to identify it.
  *   **Blind Spot:** It cannot explain *why* this membership is legitimate. It dissolves the boundary problem by denying it is a problem. On the **Irish vs. Romanian** question, this is the only "explanation" available: it is pure historical residue. The Irish vote is a fossil of the pre-EU British-Irish relationship; the Romanian exclusion is a standard feature of nation-state sovereignty regarding non-citizens. There is no democratic theory here, only constitutional path dependence.

  **Verdict on the Principles:** No normative principle vindicates the specific franchise used. The All-Subjected and All-Affected principles both condemn the exclusion of resident EU citizens and the inclusion of non-resident Commonwealth citizens. The only principle that "fits" the Brexit franchise is the Political Membership principle, which admits that the boundary was not decided democratically, but inherited legally.

  ### 3. The Circularity and the Legitimacy Deficit

  Now to the harder direction. The boundary problem is circular: *To decide the boundary democratically, you need a demos; to have a demos, you need a boundary.*

  **What Brexit did to the Circle:**
  The referendum attempted to bypass the circle by *fiat*. The Westminster Parliament unilaterally stipulated the boundary (the franchise) and claimed this constituted "the People."
  *   **Pre-Referendum:** The circle was hidden by consensus. We assumed the Westminster demos was a stable proxy for the UK people.
  *   **Post-Referendum:** The circle snapped open. Because the boundary was arbitrary (per the audit above), the losers could legitimately claim they were not part of the "People" who decided.
      *   **Scotland:** If the demos is the UK, Scotland is bound. If the demos is "those affected," Scotland has a distinct stake. The result re-activated the question of whether Scotland is *in* the demos.
      *   **EU Citizens:** They were treated as objects of the decision, not agents. This confirmed their status as "affected but not counted," fueling the legitimacy crisis regarding their residency rights.
      *   **Expats:** The 15-year rule created a class of citizens who were "British enough" to vote, but the result stripped them of EU rights they may have relied on.

  **Instability vs. Muddling:**
  Does this confirm the boundary problem is a genuine instability? **Yes.**
  Brexit demonstrates that when a decision is existential (changing the constitutional order), the inherited franchise is too brittle to bear the weight of legitimacy. In low-stakes elections, we muddle through. In a constitutional rupture, the arbitrariness of the boundary becomes a weapon. The Scottish Government's argument that they are being "dragged out of the EU against their will" is precisely a boundary claim: *We are a different demos.*

  **Is "The Demos is Whatever the Franchise Is" Defensible?**
  This is the position of **Democratic Positivism**. It argues that democracy requires a prior legal order (a *Grundnorm*) to function. You cannot vote on who votes without infinite regress. Therefore, the boundary must be decided *non-democratically* (by law, by history, by force) to allow democracy to begin.

  *   **The Defense:** It is defensible as a **functional necessity**. Without a fixed, legalistic boundary, you cannot hold a vote. The alternative is endless negotiation about who gets to vote, which paralyzes decision-making. The "muddle" is a feature, not a bug; it provides the stability required for politics to occur.
  *   **The Critique:** It is **resignation dressed up as theory**. It conflates *legality* with *legitimacy*. Just because Parliament *can* set the franchise doesn't mean that franchise creates a moral obligation to obey the result, especially when the result alters the very boundaries of the state.
  *   **The Brexit Verdict:** Brexit shows that Democratic Positivism works only as long as the losers accept the legal fiction. When the stakes are high enough, the "legal franchise" defense collapses against the "normative demos" reality. The Scottish National Party did not accept "the franchise is the boundary." They argued "the people is the boundary."

  **Where Theory is Silent:**
  Theory cannot tell us why the Irish vote and the Romanian don't, other than to say "history." Theory cannot solve the circularity; it can only describe it.
  *   **Frederick Whelan** (who formalized the boundary problem) argued the boundary must be decided by non-democratic means (principle of *uti possidetis* or existing states).
  *   **Robert Dahl** admitted there is no democratic way to decide the demos.

  Brexit confirms their silence. The UK government relied on Whelan's solution (stick with the existing state boundary). The opponents relied on Dahl's worry (the existing boundary excludes affected stakeholders).

  ### Conclusion

  The Brexit referendum did not solve the boundary problem; it **monetized** it. It spent the accumulated legitimacy of the Westminster franchise to pay for a decision that the franchise was too narrow to authorize normatively.

  The position that "the demos is whatever the franchise happens to be" is defensible only as a **pragmatic constraint**, not a moral justification. It is a rule of closure. Brexit proved that when the closure is contested, the rule offers no protection against claims of illegitimacy. The "muddle" held the system together for decades, but the referendum was a stress test that the muddle failed. The boundary problem is not just a theoretical curiosity; it is a dormant instability that wakes up whenever a state tries to redefine itself without first agreeing on who "itself" includes.

  The Australian vs. the Polish nurse is not a bug in the system; it is the system. And Brexit showed that when the system is pressed, that inconsistency becomes a fracture line.
