answer: |-
  1. Let's start with Humphreys' paradox. He argues that if propensities are causal dispositions, they can't handle inverse probabilities—effects don't dispose their causes—yet the probability calculus requires conditional probabilities to work in both directions. How do you resolve this tension without abandoning the causal intuition that makes propensities attractive in the first place?
  Anticipated Answer: She will likely deny that propensities are causes in the strict deterministic sense, arguing they are probabilistic dispositions that don't inherit the temporal asymmetry of standard causation.
  Follow-up: If you sever the link to strict causation to save the math, what prevents propensity from collapsing into just a logical relation between evidence and hypothesis?

  2. You emphasize that propensities belong to single cases, like this specific coin toss right now. But where exactly does this disposition live? Is it in the coin, the flipping mechanism, or the total state of the universe at the time of the toss?
  Anticipated Answer: She'll say it's a property of the whole "chance setup," including the coin, the thrower, and the relevant initial conditions.
  Follow-up: If the setup includes all relevant initial conditions, doesn't that push you toward determinism, where the propensity is effectively either zero or one?

  3. If probability is genuinely a property of this single toss, why should long-run frequencies stabilize around that value? What licenses the bridge between a one-off physical disposition and the collective behavior of many trials?
  Anticipated Answer: She'll invoke the Law of Large Numbers as a theorem derived from the axioms that single-case propensities satisfy.
  Follow-up: But doesn't applying that theorem assume the very stability you're trying to explain, effectively begging the question against the frequentist?

  4. You take quantum mechanics as the home turf for propensities, but you want to extend this to coins and medical prognoses. Isn't the coin case just deterministic chaos disguised as ontology, whereas QM is truly indeterministic?
  Anticipated Answer: She'll argue that macroscopic indeterminism is real or that the functional role of probability is identical regardless of the underlying metaphysics.
  Follow-up: If the underlying physics is deterministic, aren't you just rebranding epistemic ignorance as a physical property?

  5. Let's talk about measurement. If a propensity is a real property of a single event, how do we measure it without relying on frequencies? If we must use frequencies to verify the propensity, isn't the definition circular?
  Anticipated Answer: She'll concede we use frequencies as evidence but insist they aren't what the probability *means*, similar to how we use thermometers to measure heat without defining heat as mercury height.
  Follow-up: But unlike heat, we have no independent access to propensity other than its statistical effects; isn't that a disanalogy that leaves the property empirically idle?

  6. Consider a coin mid-flight. Does the propensity exist before it lands, and if so, does it change as the coin travels through the air, or is it fixed at the moment of the toss?
  Anticipated Answer: She'll likely say it's fixed by the initial conditions of the toss and remains constant until the outcome is actualized.
  Follow-up: If it's fixed by initial conditions and the laws are deterministic, how is it not just a calculated certainty we haven't computed yet?

  7. What happens to propensities in cases where we have expert disagreement? If two physicists assign different propensities to the same quantum setup, is there a fact of the matter about who is right?
  Anticipated Answer: She'll affirm there is a fact of the matter independent of our beliefs, distinguishing the view from subjectivism.
  Follow-up: If that fact is inaccessible except through long-run data, how is this different from a frequentist claim about the world rather than a single case?

  8. Ultimately, what explanatory work is the single-case propensity doing that a sophisticated frequentist or subjectivist account can't do, aside from making us feel better about indeterminism in quantum mechanics?
  Anticipated Answer: She'll argue it provides truth conditions for single-case probability statements that other interpretations cannot make sense of.
  Follow-up: If those statements are never testable in the single case, does providing truth conditions amount to anything more than metaphysical comfort?

  Weakest point: The frequency bridge question
