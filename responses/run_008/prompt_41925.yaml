          The user says "A disposition is individuated...". This usually refers to the property type.
          But then says "The causal basis is a realizer... not a constituent of it".
          If the basis is not a constituent, then the disposition is distinct from the basis.
          If it is distinct, and intrinsic (1), it must supervene.
          The tension is that (4) relies on the disposition *being* the basis (or strictly dependent on it) to deny it in the reverse fink case. If it were distinct, one could argue the disposition is present but the basis is missing (and the fink provides a substitute). But the user says the disposition is *absent*.
          So the user treats the disposition as ontologically dependent on the specific intrinsic basis.
          Claim (5) treats it as independent (realizer distinction).
          So yes, (5) is the problem.

