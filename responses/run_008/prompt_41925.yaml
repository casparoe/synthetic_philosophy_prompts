          The genuine tension lies almost entirely in claim five, which tries to maintain a pure functionalist individuation while your other commitments enforce a realist, basis-dependent ontology. The cheapest repair is to revise claim five to acknowledge that while dispositions may be typed by their stimulus and manifestation conditions, their instantiation and individuation as intrinsic properties depend on the causal basis. You might say that the disposition is the property that occupies the stimulus-manifestation role in virtue of the intrinsic basis, rather than being individuated by the role alone. This aligns your individuation criterion with your reverse fink verdict and your revised conditional analysis. The cost of this repair is that you lose the strong multiple realizability intuition that suggests two objects with different microstructures share the exact same property in a univocal sense; instead, you move toward a view where fragility is a determinable realized by different determinates, or where the disposition is identical to the basis. This is a standard move in Lewisian metaphysics and would harmonize your position significantly.

