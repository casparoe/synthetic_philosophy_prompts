answer: |-
  # Diagnostic Handout: What Makes a Trait "For" Something?

  **Instructions:** Follow the path below that matches your intuition about each case. Do not worry about philosophical terminology; answer based on what feels right to you about the specific situation. At the end, find your leaf node to see which philosophical account matches your commitments.

  ---

  ## The Decision Tree

  **START HERE:**
  **1. The Cave Fish**
  Imagine a species of fish that has lived in total darkness for a million years. They have eyes, but the eyes are covered by skin and cannot detect light. **Do these eyes still have the job of seeing?**
  *   **(A) Yes:** They are eyes, so that is what they are for, even if they are useless now. $\rightarrow$ *Go to Question 2.*
  *   **(B) No:** If they can't see, they aren't for seeing anymore. Function requires current utility. $\rightarrow$ *Go to Question 3.*

  **2. The Drift Mutation** (History Path)
  Imagine a genetic accident spreads through a population by pure luck (not survival advantage). It accidentally helps them digest a new food they just started eating. No one has survived better because of it yet; it just happened to spread. **Does this trait have the function of helping digestion *right now*?**
  *   **(A) No:** Nature hasn't "chosen" it for that yet. It's just a beneficial accident. $\rightarrow$ *Go to Question 4.*
  *   **(B) Yes:** It helps, and it's in the population, so that counts as its job. $\rightarrow$ *Go to Question 5.*

  **3. The Hormone Tumor** (Current Utility Path)
  Imagine a tumor that is dangerous and abnormal, but it accidentally secretes a hormone which stabilizes the body's blood sugar. **Is stabilizing blood sugar a function of the tumor?**
  *   **(A) Yes:** It is doing the job, regardless of being a disease. $\rightarrow$ *Leaf Node 6.*
  *   **(B) No:** A disease can't have a proper function, even if it helps. $\rightarrow$ *Go to Question 6.*

  **4. The Dog Breed** (Strict History Path)
  Imagine a dog breed with a smashed-in skull, bred purely because humans liked the look. It causes breathing problems. **Did humans give this skull shape a 'function' by choosing it, or is it just a deformity?**
  *   **(A) Yes, it has a function:** The breeder's choice counts as a history of selection. $\rightarrow$ *Leaf Node 1.*
  *   **(B) No, it's a deformity:** Only survival and reproduction in the wild count as selection. $\rightarrow$ *Leaf Node 2.*

  **5. The Ear Ossicles** (Flexible History Path)
  Imagine small jaw bones from an ancestor that moved into the ear to hear. They are now essential for hearing. **Is their function the new job (hearing) or the old job (chewing)?**
  *   **(A) The New Job:** Their recent history of use defines them. $\rightarrow$ *Leaf Node 3.*
  *   **(B) The Old Job:** Their deep ancestral origin defines them. $\rightarrow$ *Leaf Node 4.*

  **6. The Panda's Thumb** (Constrained Current Path)
  Imagine a bone in the wrist that grew long and is used to strip bamboo. It wasn't originally a finger. **Is stripping bamboo what that bone is for?**
  *   **(A) Yes:** What it actually *does* defines its function. $\rightarrow$ *Leaf Node 5.*
  *   **(B) No:** It is fundamentally a wrist bone; its capacity matters more than its improvisation. $\rightarrow$ *Leaf Node 6 (Variant).*

  ---

  ## Instructor's Key: Mapping Your Path

  Find the Leaf Node you arrived at above. This section identifies the philosophical position your answers imply, notes its awkward commitments, and highlights gaps in the logical space.

  **Leaf Node 1: History + Selection + Artificial Selection Counts**
  *   **Position:** **Selected-Effect Etiology (Broad).**
  *   **Commitment:** Functions are determined by what a trait was selected *for*, whether by nature or breeders.
  *   **Awkward Commitment:** Must treat a breeder's aesthetic preference as biologically equivalent to natural survival pressures.
  *   **Status:** Occupied (e.g., Millikan-style views extended to artifacts).

  **Leaf Node 2: History + Selection + Natural Selection Only**
  *   **Position:** **Naturalistic Selected-Effect.**
  *   **Commitment:** Functions require a history of natural selection; artificial traits are deformities.
  *   **Awkward Commitment:** Cannot attribute biological functions to domesticated crops or animals despite their clear reproductive design.
  *   **Status:** Occupied (Strict Naturalists).

  **Leaf Node 3: History + No Selection + Recent History**
  *   **Position:** **Modern-History Account.**
  *   **Commitment:** Functions require history, but recent maintenance is enough; strict selection isn't required.
  *   **Awkward Commitment:** Blurs the line between a trait having a function and a trait merely being beneficial.
  *   **Status:** Occupied (Some variants of Etiological views).

  **Leaf Node 4: History + No Selection + Ancestral History**
  *   **Position:** **Unnamed (Ancestral Role View).**
  *   **Commitment:** A trait's function is locked by its original origin, even if fixed by drift and currently used for something else.
  *   **Awkward Commitment:** Must claim the mammal ear bones are still "for chewing" despite being essential for hearing and useless for chewing.
  *   **Status:** **Unoccupied.** This view is generally considered incoherent because it severs function from current utility entirely.

  **Leaf Node 5: Current + No Norms + Actual Use**
  *   **Position:** **Cummins-Style Causal-Role.**
  *   **Commitment:** Function is simply the causal contribution a trait makes to a system's capacity.
  *   **Awkward Commitment:** Must admit that tumors, diseases, and mutations have "functions" if they contribute causally to the system (even if harmful overall).
  *   **Status:** Occupied (Standard Causal-Role).

  **Leaf Node 6 (Variant): Current + Norms + Structural Capacity**
  *   **Position:** **Propensity / Dispositional Account.**
  *   **Commitment:** Function is the *capacity* to contribute, constrained by what is "normal" for the type.
  *   **Awkward Commitment:** Struggles to define "normal" without secretly relying on history (circularity).
  *   **Status:** Occupied (Dispositionalists).
  *   **Note on Collapse:** **Leaf 5 and Leaf 6 are indistinguishable in this tree.** Because the Panda case involves a trait *currently performing* its task, Causal-Role and Propensity accounts yield the same answer. They only diverge on dormant traits (e.g., a gene that *could* work but doesn't). This tree cannot separate them without a dormant case on the Current branch.

  **Unoccupied Cells Analysis:**
  *   **History + Drift = Function + Artificial = No Function:** (Nature counts, Humans don't, Luck does). **Unappealing.** It is inconsistent to value luck over human design while rejecting natural selection.
  *   **Current + Tumor = Function + Panda = No Function:** (Tumors function, Panda bones don't). **Incoherent.** If causal contribution is enough for a tumor, it must be enough for a wrist bone.

  ---

  Summary: The cave fish case did the most sorting work because it forces the fundamental dichotomy between historical origin and current utility that underpins all subsequent distinctions.
