answer: |-
  **MEMORANDUM**
  **TO:** Grading Panel
  **FROM:** Philosophy of Science Consultant
  **SUBJECT:** Procedure for Adjudicating "Right But Early" Claims (Lakatosian Audit)

  ### Introduction
  The core tension in long-horizon grading is distinguishing between a *progressive problem shift* (updating a theory based on new data) and a *degenerating problem shift* (adding ad-hoc excuses to save a falsified theory). Following Imre Lakatos's refinement of Popper: a prediction has a "hard core" (the specific claim) and a "protective belt" (auxiliary assumptions about context). We may adjust the belt, but not the core, without falsifying the forecast.

  This procedure prioritizes **mechanism integrity** over **outcome matching**. A correct outcome derived from a broken causal model is a lucky guess, not a valid forecast. It also distinguishes between *threshold events* (binary) and *trend boundaries* (continuous), as the tolerance for timing errors differs between them.

  ---

  ### The Grading Procedure

  **Step 1: Classify the Claim Structure**
  *   **Question:** Is the prediction a *Point Estimate* (Event X will happen in Year Y), a *Boundary Condition* (Event X will happen by Year Y), or a *Trend Trajectory* (Metric X will reach Level Z)?
  *   **Sufficient Answer:** Cite the exact wording.
  *   **Hard Stop:** If it is a **Point Estimate** and the date passed without the event, output **MISS**. Do not proceed to Step 2. (Exception: Proceed to Step 4 for Reflexivity).
  *   **Panel Hand-off:** If the wording is ambiguous (e.g., "around 2010"), the Panel must vote on whether this constitutes a Range or a Point before proceeding.

  **Step 2: Audit the Causal Mechanism**
  *   **Question:** Did the causal drivers identified in the original forecast materialize, even if delayed?
  *   **Sufficient Answer:** The forecaster must show that the *reason* the event was expected (e.g., Moore's Law, population growth, cost curves) remained intact during the delay.
  *   **Hard Stop:** If the event happened for reasons *explicitly excluded* or *unforeseen* by the original model (e.g., solar became cheap due to subsidies, not the predicted tech breakthrough), output **HOLLOW HIT** (counts as a miss for scoring, noted as "right outcome, wrong model").
  *   **Panel Hand-off:** If the drivers are partially intact but interfered with by noise, proceed to Step 3.

  **Step 3: Evaluate the "Protective Belt" (The Delay)**
  *   **Question:** Is the explanation for the delay an *independent shock* or an *ad-hoc adjustment*?
  *   **Sufficient Answer:** The delay must be attributable to a specific, identifiable exogenous variable (war, pandemic, policy shift) that was not reasonably knowable at $T_0$.
  *   **Hard Stop:** If the explanation is "the trend was slower than expected" without an external cause, output **MISS**. "Slower trend" is a falsification of the growth rate, not a timing error.
  *   **Panel Hand-off:** If the shock is identifiable but its magnitude is debated, proceed to Step 5.

  **Step 4: Check for Reflexivity (The Malthus Clause)**
  *   **Question:** Is there evidence that the forecast *itself* triggered actions that averted or accelerated the outcome?
  *   **Sufficient Answer:** Documented policy changes or market movements explicitly citing the forecast (or the theory behind it) as motivation.
  *   **Hard Stop:** If no causal link exists between the forecast/public discourse and the mitigation, output **MISS**. "People might have reacted" is speculation.
  *   **Verdict:** If proven, grade as **SUCCESSFUL WARNING** (distinct from a correct prediction).

  **Step 5: Final Panel Judgment (Value Load)**
  *   **Question:** Given the above, does the insight value outweigh the precision error?
  *   **Context:** This is not a fact-finding step. This is where the Panel decides how much "sympathy" to award for structural insight despite technical failure.
  *   **Constraint:** You may only upgrade a **MISS** to a **PARTIAL CREDIT** if Step 2 (Mechanism) was passed. You cannot award credit for a broken model.

  ---

  ### Worked Cases

  #### 1. The Grain Crisis (1995 Prediction: Demand outruns supply before 2010)
  *   **Step 1 (Structure):** *Point Estimate/Threshold.* "Before 2010."
  *   **Step 2 (Mechanism):** *Failed.* The model assumed linear yield growth vs. exponential population. It did not account for the acceleration of GMO adoption and precision agriculture in the late 90s. The causal link (population pressure) was interrupted by tech innovation not in the model.
  *   **Step 3 (Protective Belt):** The delay wasn't just timing; the supply curve shifted structurally.
  *   **Step 4 (Reflexivity):** Weak. While food security was a general concern, no specific policy cites this 1995 forecast as the trigger for the Green Revolution 2.0.
  *   **Verdict:** **MISS.**
  *   **Reasoning:** This is a degenerating problem shift. The core assumption (yield stagnation) was falsified. Calling it "early" implies the crisis is still coming on the same vector, which the data contradicts.

  #### 2. The Automation Peak (1980s Prediction: Majority of jobs done by machines by 2025)
  *   **Step 1 (Structure):** *Point Estimate/Threshold.* "By 2025."
  *   **Step 2 (Mechanism):** *Failed.* The forecast relied on linear extrapolation of 1980s AI and robotics capabilities. It ignored Moravec's Paradox (hard problems are easy, easy problems are hard). The mechanism (computing power = labor substitution) proved incomplete.
  *   **Step 3 (Protective Belt):** The delay is not due to an exogenous shock (like a war stopping robot development); it is due to the intrinsic difficulty of the task.
  *   **Verdict:** **MISS.**
  *   **Reasoning:** A trend that fails to materialize because the underlying physics/logic was misunderstood is not "early." It is wrong.

  #### 3. The Solar Cost Curve (2001 Prediction: Cheapest electricity "within two decades")
  *   **Step 1 (Structure):** *Boundary Condition.* "Within two decades" (By 2021).
  *   **Step 2 (Mechanism):** *Mixed.* Forecasters predicted cost drops via tech efficiency (Swanson's Law). Actual drops were driven largely by Chinese manufacturing scale and subsidies.
      *   *Panel Decision:* Does manufacturing scale count as the same mechanism as tech efficiency? In energy economics, yes (learning curves apply to deployment, not just R&D). **Pass.**
  *   **Step 3 (Protective Belt):** Event occurred in Year 19. This is inside the boundary.
  *   **Step 4 (Reflexivity):** N/A.
  *   **Verdict:** **HIT.**
  *   **Reasoning:** This is a *Boundary Condition*, not a Point Estimate. Hitting year 19 of 20 is technically compliant.
  *   **The Bend:** Does this open the door for Cases 1 & 2? **No.**
      *   Case 3 is a *continuous variable* (cost) hitting a *declared range*.
      *   Cases 1 & 2 are *binary thresholds* (Famine/Majority) hitting a *point date*.
      *   **Precedent Set:** We allow tolerance on *ranges* for *continuous variables*. We do not allow tolerance on *points* for *binary events*. If the Grain forecast had said "Within 15 years," and famine hit in year 16, we might debate it. But "Before 2010" is a hard falsification condition.

  ---

  ### Limits of the Procedure

  **1. The "Sympathy Ceiling"**
  This procedure cannot solve the fight over how much we value "directional correctness." Step 5 explicitly hands this to the Panel. You will still fight about whether a "Hollow Hit" (right outcome, wrong reason) deserves 10% credit or 0%. This is not a scientific question; it is a policy question about what behavior you want to incentivize. If you reward Hollow Hits, forecasters will stop modeling causality and start modeling consensus.

  **2. The Reflexivity Trap**
  Proving Step 4 (Reflexivity) is historically nearly impossible. We will never know for sure if Malthus was "averted" by his own warning or if he was just wrong. In 90% of cases, you will lack the evidence to grade a miss as a "Successful Warning." You must accept that truly self-defeating predictions will look like failures in your archive.

  **3. The Horizon Problem**
  As horizons extend (20+ years), the "Protective Belt" (context) becomes thicker than the "Hard Core" (prediction). Eventually, the world changes so much that the original prediction loses its meaning. This procedure works for 20 years. At 50 years, you are no longer grading forecasts; you are grading narratives. Acknowledge that ceiling. If the world is unrecognizable, grade "N/A," not "Miss."

  **Summary for the Panel:**
  If the *mechanism* broke, it's a Miss, no matter how close the date. If the *date* was a range and it hit the range, it's a Hit, provided the mechanism held. Do not reward luck. Do not punish boundary compliance. Stop arguing about Malthus unless you have a memo from the UN citing him as the reason for reform.
