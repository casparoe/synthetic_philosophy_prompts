  2.  **Deconstruct the Philosophical Core:**
      *   *Popper:* Falsifiability is key. If a theory can explain *anything* (including being late), it explains nothing.
      *   *Lakatos:* Research programs have a "hard core" and a "protective belt" of auxiliary hypotheses. Adjusting the belt is normal science; adjusting the core to save a failed prediction is degenerating.
      *   *The "Right but Early" Problem:* This is essentially shifting the auxiliary hypothesis of *timing*. Is timing part of the hard core (the specific claim) or the protective belt (contextual noise)?
      *   *Reflexivity (Soros/Popper):* Predictions that change the outcome. Malthus is the classic example (prediction failed because people acted on it).

  3.  **Brainstorming Failure Modes of Obvious Approaches:**
      *   *Strict Binary (Missed date = Wrong):* Discourages long-term thinking, punishes near-misses unfairly, ignores structural correctness.
      *   *Vague "Directional" Scoring:* Turns into a beauty contest, rewards vagueness, invites the "Malthus defense" for everything.
      *   *Time-Window Buffer (e.g., +/- 5 years):* Arbitrary. Why 5? Why not 50? Doesn't solve the 1995 Grain vs. 2001 Solar distinction.
