answer: |-
  **MEMORANDUM**

  **TO:** Peer Reviewers, *The Journal of Historical Inquiry*
  **FROM:** Managing Editor
  **SUBJECT:** Protocol PP-30: Distinguishing Presentism from Contested History
  **TIME ALLOTMENT:** 30 Minutes Maximum

  ### Context
  The charge of "presentism" has become inflated in our review process, often conflating three distinct methodological moves: (1) moral condemnation of past actors, (2) the use of modern vocabulary, and (3) the application of retrospective concepts. This protocol is designed to disaggregate these issues. It is not a substitute for historical expertise, but a filter to ensure that when "presentism" is charged, it identifies a specific methodological failure rather than a theoretical disagreement.

  ### The Procedure (PP-30)

  Reviewers should answer the following four questions in order. Do not proceed to the next question if a "Stop" verdict is reached.

  #### Q1: The Moral Condemnation Check
  **Question:** Is the author's primary objective to morally condemn the historical actors using standards those actors could not have accessed, *without* analyzing how those actors understood their own moral universe?
  *   **Sufficient Answer for "No Presentism":** The author critiques actions but contextualizes the actors' ethical framework, or the moral judgment is secondary to structural/causal analysis.
  *   **Sufficient Answer for "Presentism":** The paper functions primarily as a tribunal where past actors are found guilty of violating modern norms (e.g., human rights, equality) with no attempt to reconstruct the period's normative logic.
  *   **VERDICT:** If **Yes**, stop. **Recommendation: Reject (Presentism).**
  *   **If No**, proceed to Q2.

  #### Q2: The Vocabulary Transparency Check
  **Question:** Does the author use modern terminology (e.g., "depression," "racism," "class") without defining how the term is being operationalized for this specific historical context?
  *   **Sufficient Answer for "No Presentism":** The author explicitly states, "I use term X heuristically to describe Y," or provides a working definition that separates the modern label from its modern baggage.
  *   **Sufficient Answer for "Presentism":** The author assumes the term is transparent and treats the past phenomenon as identical to the modern one without qualification.
  *   **VERDICT:** If **Yes**, stop. **Recommendation: Revise (Clarify Terminology).** *Note: This is not fatal, but requires correction.*
  *   **If No**, proceed to Q3.

  #### Q3: The Ontological Distinction (Universal vs. Social Kind)
  **Question:** Is the concept being applied a "Universal Kind" (a biological/psychological phenomenon expected in any era, e.g., grief, violence, starvation) or a "Social Kind" (a category whose content is fixed by specific social arrangements, e.g., democracy, racism, clinical depression)?
  *   **Sufficient Answer for "Universal Kind":** The author argues the phenomenon is trans-historical (e.g., "pain"). Modern vocabulary is generally permissible here. **Proceed to Q4.**
  *   **Sufficient Answer for "Social Kind":** The concept relies on specific institutional or ideological structures (e.g., "racism" requires a theory of race; "depression" requires a diagnostic framework). **Proceed to Q4.**
  *   **Note:** Do not stop here. The use of Social Kinds is not automatically presentist, but it raises the burden of proof.

  #### Q4: The Bridging Work Check
  **Question:** For "Social Kinds" or retrospective concepts, does the author perform "bridging work"? (i.e., Do they acknowledge the concept was coined later, explain *why* it is useful despite the anachronism, and account for what is lost in translation?)
  *   **Sufficient Answer for "No Presentism":** The author argues that while the *concept* is modern, the *structural dynamics* it picks out existed then (e.g., "While 'racism' was not named, the caste system functioned to naturalize heredity in ways indistinguishable from later racial ideologies").
  *   **Sufficient Answer for "Presentism":** The author collapses the distinction, claiming the past actors *were* X in the full modern sense, ignoring the conceptual gap.
  *   **VERDICT:**
      *   If Bridging Work is **Present**: **Stop. Verdict: Not Presentism (Contested History).** Send to Editor for theoretical evaluation.
      *   If Bridging Work is **Absent**: **Stop. Verdict: Presentism.**

  #### The "Red Zone": When to Hand Off to Human Judgment
  There are cases where this procedure cannot generate a verdict. If a submission triggers the following condition, do not apply the "Presentism" label. Instead, flag it for **Editorial Board Review**.

  *   **Condition:** The paper applies a "Social Kind" (Q3) with Bridging Work (Q4), but the validity of that bridge depends on a philosophical debate about the nature of the concept itself (e.g., "Does racism require intent, or only outcome?").
  *   **Instruction:** Do not rule this presentism. This is a theoretical disagreement within the discipline, not a methodological error. Mark as **"Theoretically Contested – Requires Board Consensus."**

  ***

  ### Trial Run: Application to Hypothetical Submissions

  To demonstrate the protocol's honesty, we have run PP-30 on two pending submissions. The Board is theoretically sympathetic to *both* present-minded scholarship and extending the term "racism" backward. The procedure, however, does not rubber-stamp these preferences.

  #### Case A: "The Melancholy Abbot: Clinical Depression in the 12th Century"
  *   **Argument:** Analyzes a medieval abbot's letters describing spiritual despair and diagnoses him with Major Depressive Disorder (MDD).
  *   **Q1 (Moral):** No condemnation. (Pass)
  *   **Q2 (Vocab):** Uses "Clinical Depression" without operational definition. (Fail/Revise)
  *   **Q3 (Ontology):** "Clinical Depression" is a **Social Kind**. It is not a universal biological fact like "pain"; it is a diagnostic category bound to the DSM, neurochemistry, and secular psychology. It is not equivalent to *acedia* or humoral melancholy.
  *   **Q4 (Bridging):** The author treats the symptoms as identical across time, ignoring the theological function of despair in the 12th century. No bridging work is done to explain why a 20th-century medical category maps onto a 12th-century spiritual state.
  *   **PP-30 Verdict:** **Presentism.**
  *   **Board Challenge:** This is the verdict the Board *least wants to hear*. We are sympathetic to "present-minded" history that makes the past relatable. However, the procedure correctly identifies that retro-diagnosing specific clinical conditions without addressing the ontological shift from spiritual to medical frameworks is methodologically unsound. The paper must be rejected or radically revised to treat "depression" as a heuristic, not a diagnosis.

  #### Case B: "The Hereditary Caste: Structural Racism in the 17th Century Atlantic"
  *   **Argument:** Argues that a 17th-century labor system was "racist" because it naturalized hereditary status based on phenotype, despite the architects lacking a concept of "biological race."
  *   **Q1 (Moral):** Focuses on structural outcomes, not individual moral failure. (Pass)
  *   **Q2 (Vocab):** Uses "Racism." Defines it operationally as "structural naturalization of heredity." (Pass)
  *   **Q3 (Ontology):** "Racism" is a **Social Kind**. (Proceed)
  *   **Q4 (Bridging):** The author explicitly acknowledges the term is anachronistic but argues the *mechanism* of power is functionally identical to modern racism. They account for the lack of "biological race" theory by focusing on "genealogical purity."
  *   **PP-30 Verdict:** **Not Presentism (Contested History).**
  *   **Board Alignment:** This aligns with the Board's sympathy for extending "racism" backward. However, note that this verdict is earned *only* because the author performed the Bridging Work (Q4). Had the author simply claimed the actors "were racists" in their own minds, the verdict would have been Presentism.

  ***

  ### Limitations: Where the Procedure Stops
  Reviewers must recognize that PP-30 cannot settle **Theoretical Ontology**.

  If a reviewer believes "Racism" *necessarily* requires a 19th-century biological theory of race (a substantive historical claim), and the author argues it does not (a substantive theoretical claim), PP-30 classifies this as **"Theoretically Contested."**

  *   **Instruction:** Do not use "Presentism" to win this argument. "Presentism" describes a *failure of method* (ignoring the gap), not a *disagreement on definition* (arguing over where the gap lies).
  *   **Action:** If the paper passes Q4 (Bridging Work) but you still disagree with the definition, you must hand the call to the Editor. To reject it as presentism at that stage is to misuse the charge as a shield for conservative historiography.

  **Summary for Reviewers:**
  1.  **Moralizing without context** = Presentism.
  2.  **Modern words without definitions** = Revise.
  3.  **Modern concepts without bridging** = Presentism.
  4.  **Modern concepts with bridging** = Contested History (Board Decision).

  By adhering to this, we protect the journal from lazy anachronism (Case A) without stifling bold theoretical reinterpretation (Case B).
