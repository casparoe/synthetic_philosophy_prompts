  **The Locus of Control: Distinguishing Counterfactual Mugging from XOR Blackmail**

  The unease you feel is a sign of rigor, not confusion. You have correctly identified that both Counterfactual Mugging and XOR Blackmail rely on subjunctive dependence: in both cases, a predictor's behavior is logically correlated with your decision algorithm, yet your specific action in the actual world lacks causal leverage over the payoff. To a Causal Decision Theorist (CDT), both cases look identical: the money is already gone or the disaster already happened, so you should minimize immediate loss (refuse both). To an Evidential Decision Theorist (EDT), both cases look like attempts to manipulate news, often leading to spurious correlations.

  However, within the framework of Functional Decision Theory (FDT) or Updateless Decision Theory (UDT)—which I will adopt as the working assumption for this analysis, given your acceptance of the Counterfactual Mugging verdict—there is a sharp, principled asymmetry between the two. The distinction does not lie in the presence of a predictor, but in **what the predictor controls**. In Counterfactual Mugging, the predictor controls a *variable payoff* in the counterfactual branch. In XOR Blackmail, the predictor controls a *signal* correlated with a *fixed payoff*.

  This essay will articulate this asymmetry, demonstrate why it mandates paying in the former and refusing in the latter, and then resolve your hybrid case. I will argue that the hybrid construction does not collapse the distinction; rather, it highlights that rational policies are functions of context, not monolithic dispositions.

  ### The Asymmetry: Variable Rewards vs. Constant Costs

  To see the asymmetry cleanly, we must analyze the expected utility of the *policy* from the ex-ante perspective (before the coin flips or predictors act), as FDT requires.

  **1. Counterfactual Mugging**
  Omega flips a fair coin.
  *   **Heads:** Omega asks for \$100.
  *   **Tails:** Omega gives you \$10,000 *if and only if* Omega predicted you would pay in the Heads case.

  Let us compare two policies: *Always Pay* and *Always Refuse*.
  *   **Policy: Always Refuse.**
      *   Heads (50%): You refuse. Loss: \$0.
      *   Tails (50%): Omega predicted Refuse. Omega gives \$0. Loss: \$0.
      *   **Ex-Ante Expected Utility (EU): \$0.**
  *   **Policy: Always Pay.**
      *   Heads (50%): You pay. Loss: -\$100.
      *   Tails (50%): Omega predicted Pay. Omega gives \$10,000. Gain: +\$10,000.
      *   **Ex-Ante Expected Utility (EU): 0.5(-100) + 0.5(10,000) = \$4,950.**

  Here, the predictor's action in the counterfactual branch (Tails) determines whether you receive a **variable reward**. Your policy directly toggles the existence of the \$10,000. Paying is rational because it unlocks value that otherwise would not exist.

  **2. XOR Blackmail**
  A disaster ($D$) occurs with 50% probability, independent of your actions. Omega sends a letter ($L$) demanding \$100 if and only if ($D \oplus \text{PredictedPay}$). You pay only if you receive the letter.
  *   **Policy: Always Pay.**
      *   Disaster ($D=1$, 50%): $L \iff (1 \oplus 1) \iff \text{False}$. No letter. You pay \$0. Loss: Disaster Cost ($C$).
      *   No Disaster ($D=0$, 50%): $L \iff (0 \oplus 1) \iff \text{True}$. Letter sent. You pay \$100. Loss: \$100.
      *   **Ex-Ante EU:** $0.5(-C) + 0.5(-100)$.
  *   **Policy: Always Refuse.**
      *   Disaster ($D=1$, 50%): $L \iff (1 \oplus 0) \iff \text{True}$. Letter sent. You refuse. Loss: Disaster Cost ($C$).
      *   No Disaster ($D=0$, 50%): $L \iff (0 \oplus 0) \iff \text{False}$. No letter. Loss: \$0.
      *   **Ex-Ante EU:** $0.5(-C) + 0.5(0)$.

  Compare the two. In the Disaster world ($D=1$), your loss is $C$ regardless of your policy. The disaster is independent; the letter's presence or absence does not change the fact of the disaster, and since you only pay if you get the letter, your payment policy does not alter the disaster cost. The payoff in the Disaster branch is **constant** with respect to your policy.

  In the No-Disaster world ($D=0$), however, the outcomes differ. If you Pay, you lose \$100. If you Refuse, you lose \$0.
  Therefore, **Refusing strictly dominates Paying.** The difference in EU is exactly \$50 in favor of Refusing, regardless of how large $C$ is.

  **The Principled Distinction**
  The asymmetry lies in the **locus of subjunctive control over value**.
  *   In **Mugging**, the counterfactual branch contains a *variable benefit* controlled by the predictor. Your policy determines whether that benefit materializes.
  *   In **Blackmail**, the counterfactual branch (No Disaster) contains a *variable cost* (the ransom), but the "bad" branch (Disaster) contains a *fixed cost*. Your policy cannot save you from the disaster; it can only save you from paying ransom in the safe world.

  In Mugging, you pay to *create* value in a world you aren't in. In Blackmail, you refuse to *preserve* value in a world you aren't in (the safe world where you shouldn't be blackmailed). Paying the blackmailer effectively taxes the safe worlds to subsidize the disaster worlds (where the letter disappears, but the disaster remains). Refusing ensures you only face the letter when the disaster is already present, avoiding the "false alarm" tax.

  ### The Hybrid Case: Shared Randomness

  Now we address your hybrid scenario. A single fair coin determines whether you face the Mugger (Heads) or the Blackmailer (Tails). Both predictors simulate your source code to determine their behavior. Your classmates are divided: one says "Pay" (Mugging dominates), one says "Refuse" (Blackmail contaminates), and one says the setup is ill-formed.

  All three are mistaken because they assume the shared coin forces a **uniform action** (Pay/Refuse) rather than a **conditional policy**.

  In FDT, an agent is defined by a decision function $\text{Action} = f(\text{Observation})$. The "source code" that the predictors simulate is not a single bit (Pay/Refuse), but a program that takes the scenario as input.
  *   **Observation:** "I am facing a Mugger" vs. "I am facing a Blackmailer."
  *   **Policy:** `if Mugger: PAY; if Blackmailer: REFUSE`.

  Does the shared coin break this? No. The coin determines which *instance* of the game is instantiated, but both predictors (Mugger-Omega and Blackmailer-Omega) simulate the *same* source code.
  *   **Mugger-Omega** simulates you. It sees that your code outputs `PAY` when input is `Mugger`. It predicts you will pay. It offers the deal.
  *   **Blackmailer-Omega** simulates you. It sees that your code outputs `REFUSE` when input is `Blackmailer`. It predicts you will refuse. It sends the letter only on Disaster.

  Because the scenarios are mutually exclusive (determined by the coin), there is no logical conflict in your source code outputting different actions for different inputs. The "leak" your classmates worry about—that being disposed to pay the mugger makes you vulnerable to the blackmailer—only exists if your policy is *unconditional*. But a rational agent's policy is necessarily conditional on available information. Distinguishing a mugger from a blackmailer is trivial observationally.

  Therefore, the shared coin does not collapse the asymmetry. It merely creates a lottery over which decision problem you face.
  *   50% Chance (Mugging): You execute `PAY`. Ex-Ante Value: +\$4,950 (relative to refusal).
  *   50% Chance (Blackmail): You execute `REFUSE`. Ex-Ante Value: +\$50 (relative to paying).

  The optimal strategy is to maintain the split. The classmate who claims it reduces to ordinary mugging ignores the strict dominance of Refusing in the Blackmail branch. The classmate who claims it becomes "blackmail-flavored" incorrectly assumes that a disposition to pay in one context logically compels payment in another, violating the definition of a functional policy. The classmate who calls it ill-formed misunderstands logical correlation; predictors can perfectly well simulate conditional logic.

  ### Verdict

  The asymmetry between Counterfactual Mugging and XOR Blackmail is robust. It rests on the fact that in Mugging, your policy controls the existence of a **reward** in the counterfactual, whereas in Blackmail, your policy controls the incidence of a **cost** in the factual (safe) world while leaving the counterfactual (disaster) cost fixed.

  **My verdict is definitive:** A rational agent employing Functional Decision Theory should **Pay the Mugger** and **Refuse the Blackmailer**.

  In your hybrid case, this verdict holds. You should adopt a conditional policy: *Pay if Mugged, Refuse if Blackmailed.* The shared coin links the probabilities of the scenarios, but it does not link the optimal actions within them. To do otherwise—to Refuse the Mugger or Pay the Blackmailer—is to leave expected utility on the table, either by forfeiting a counterfactual gift or by paying a ransom for a false alarm. The confusion among your classmates stems from treating "rationality" as a static trait rather than a context-sensitive algorithm. Decision theory does not demand you be a pushover or a stoic; it demands you optimize the function that maps your situation to your action. In these two situations, the function yields different results.
