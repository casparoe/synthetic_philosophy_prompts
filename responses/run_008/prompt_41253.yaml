  *(Refining the Seatbelt point)*: The partner might say "Seatbelts are cheap, surgery is expensive." I need to separate the *principle of prevention* from the *cost-benefit analysis*. The partner's argument is metaphysical (death isn't bad), not economic (surgery is too expensive). I must keep the focus on the metaphysics.

  *(Final Polish)*: Ensure the distinction between the "State of Death" and the "Event of Dying" is crystal clear. That is the pivot point.

