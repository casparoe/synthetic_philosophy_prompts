      *   *Better Fatal Criterion:* A demonstration that the *content* of the report cannot be fixed by the physical cause alone. This is the "Knowledge Argument" turned against the epiphenomenalist. If I know something about my experience that the physical state doesn't encode, and I report it, how did the physical report get that info? The common cause says $P$ encodes it. If $P$ *doesn't* encode it (proven by information theory/neuroscience limits), the common cause fails.
