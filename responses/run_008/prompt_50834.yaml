prompt: |-
  I'm taking a seminar on Madhyamaka this semester and we've spent the last three weeks on the catuṣkoṭi (the tetralemma: exists, doesn't exist, both, neither) and emptiness in the Mūlamadhyamakakārikā. My term paper is due in about a month and I don't want to just pick one of the standard interpretations and defend it -- I want to know what I should be demanding of ANY interpretation first, because honestly the seminar has turned into people talking past each other. One guy keeps saying the tetralemma shows Nāgārjuna rejects the law of excluded middle, someone else insists it's purely a pedagogical device for wearing down opponents, and our professor keeps pushing back with the question of whether emptiness is itself empty and what that does to any "logical" reading. So before I read another page of secondary literature, I want the spec.

  Pretend you're a philosopher who works on both Buddhist thought and logic. Please write me the desiderata: what any adequate interpretation of the tetralemma and emptiness has to deliver. For instance (but don't feel bound by my list): it has to say whether the four options are supposed to be jointly exhaustive and what that claim amounts to; it has to explain why the "both" and "neither" corners are there at all rather than just existing / not existing; it has to be consistent with the two truths framework (Nāgārjuna clearly doesn't think conventional discourse collapses); it has to deal with emptiness applying to itself without the whole thing becoming self-refuting; and it has to say what happens when Nāgārjuna seems to be ARGUING rather than just negating, since a bunch of the verses are straightforward reductios. For each requirement give the case or passage-type behind it, and tell me which requirements you think are genuinely non-negotiable versus which are just the hobbyhorses of particular camps (e.g. the people who want it to be a paraconsistent logic vs. the people who want it to be therapy).

  The part I most want to see: flag any pair of desiderata you suspect can't be jointly satisfied -- like maybe "the tetralemma is a substantive logical doctrine" and "the position survives being applied to itself" can't both hold, I genuinely don't know. Then briefly score the main readings against the list: the logical/paraconsistent sort of reading, the truth-value-gap or presupposition-failure sort, and the therapeutic/soteriological reading where the negations aren't assertions of anything. Which single requirement does the most work excluding candidates? Also feel free to start with a bit of brainstorming before you commit to the list, I'd rather see the reasoning than a polished table. Keep the weight on the criteria, not the scorecard, since the readings I can look up myself but I don't trust myself to build the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Graduate student (likely MA or PhD level) taking a seminar on Madhyamaka.
      *   **Topic:** Catuṣkoṭi (tetralemma) and Emptiness (śūnyatā) in Nāgārjuna's *Mūlamadhyamakakārikā* (MMK).
      *   **Problem:** Seminar discussions are fragmented (logic vs. pedagogy vs. self-refutation). User wants to avoid picking a standard interpretation prematurely.
      *   **Task:** Create a list of *desiderata* (requirements/criteria) that *any* adequate interpretation must meet.
      *   **Persona:** Philosopher working on both Buddhist thought and logic.
      *   **Specific Instructions:**
          *   Include specific examples (e.g., exhaustiveness, purpose of "both/neither", two truths, emptiness of emptiness, argumentative structure).
          *   Distinguish non-negotiable vs. camp-specific hobbyhorses.
          *   **Crucial:** Flag tensions/incompatibilities between desiderata (trade-offs).
          *   **Crucial:** Briefly score main readings (Paraconsistent, Gap/Presupposition, Therapeutic) against the list.
          *   **Crucial:** Identify the single requirement that does the most work excluding candidates.
          *   **Style:** Brainstorming first, then the list. Weight on criteria, not the scorecard.

  2.  **Initial Brainstorming & Philosophical Positioning:**
      *   *The Core Tension:* Nāgārjuna is doing philosophy *and* soteriology. He uses logic *to dismantle* logic's grip on reality. Any interpretation that makes him *just* a logician misses the soteriological point. Any interpretation that makes him *just* a therapist misses the rigorous argumentative structure.
      *   *The "Emptiness of Emptiness" Problem:* If everything is empty, is emptiness empty? If yes, does it lose its normative force? If no, is it a svabhāva (intrinsic nature)? This is the MMK 13.8 / 24.18 crux.
      *   *The Catuṣkoṭi Structure:* A, not-A, both, neither. In classical logic, "both" is a contradiction and "neither" violates excluded middle. So, either Nāgārjuna rejects classical logic, or he's using the terms differently (e.g., pragmatic vs. ontological), or he's rejecting the presuppositions of the questions.
      *   *Two Truths:* Conventional (saṃvṛti) and Ultimate (paramārtha). The tetralemma usually operates at the ultimate level to show the impossibility of ultimate claims, but it must not destroy conventional discourse (MMK 24).
      *   *The "Spec" Approach:* The user wants a "specification document" for an interpretation. This is a great metaphor. It implies functional requirements.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Req 1: Logical Coherence vs. Dialectical Function.* Does it treat the four corners as truth-apt propositions?
      *   *Req 2: Exhaustiveness.* Are the four corners meant to cover all possibilities? If so, how?
      *   *Req 3: The "Both" and "Neither".* Why are they distinct? "Both" usually implies contradiction. "Neither" usually implies mysticism or gap.
      *   *Req 4: Two Truths Compatibility.* Must preserve conventional efficacy (karma, language) while denying ultimate existence.
      *   *Req 5: Reflexivity (Emptiness of Emptiness).* The theory must apply to itself without collapsing into nihilism or dogmatism.
      *   *Req 6: Argumentative Force.* Nāgārjuna uses *prasanga* (consequences). He shows opponents their positions lead to absurdity. The interpretation must explain *why* these are absurdities.

  4.  **Identifying Tensions (The "Trade-offs"):**
      *   *Tension A:* Strong Logical Realism vs. Reflexivity. If the tetralemma is a *true* description of reality's logical structure (e.g., paraconsistent), then emptiness might become a *true* logical structure (svabhāva).
      *   *Tension B:* Therapeutic Quietism vs. Argumentative Rigor. If it's *just* therapy, why are the arguments so tight? If it's *just* logic, why the soteriological goal?
      *   *Tension C:* Exhaustiveness vs. Presupposition Failure. If the questions are ill-formed (presupposition failure), the tetralemma isn't exhaustive of *reality*, but exhaustive of *mistaken questions*.

  5.  **Scoring the Readings:**
      *   *Paraconsistent (Priest/Garfield):* Good at handling "both," struggles with "emptiness of emptiness" (might reify logic).
      *   *Gap/Presupposition (Siderits/Huntington):* Good at dissolving the questions, struggles with explaining why Nāgārjuna argues so hard against them.
      *   *Therapeutic (Pyrrhonian/Wright):* Good at soteriology, risks making the philosophy trivial or purely psychological.

  6.  **Refining the "Non-Negotiables":**
      *   What *must* an interpretation do? It must account for MMK 24 (Two Truths) and MMK 13/24 (Emptiness of Emptiness). It must explain why Nāgārjuna thinks he is *winning* arguments, not just chanting mantras.
      *   *The Killer Criterion:* **Reflexive Stability.** Can the theory account for its own status without positing a *svabhāva* (intrinsic nature) for itself? This kills naive realism and naive logical pluralism.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the messiness of the seminar. Adopt the persona (Buddhist/Logic Philosopher).
      *   **Brainstorming/Reasoning:** Walk through the thought process of building the spec.
      *   **The Desiderata (The Spec):** Numbered list with "Requirement," "Rationale/Passage," and "Status (Non-negotiable vs. Hobbyhorse)."
      *   **The Incompatibility Matrix:** Highlight the tensions.
      *   **The Scorecard:** Briefly apply the spec to the three main camps.
      *   **The "Killer" Criterion:** Identify the one that filters the most.
      *   **Conclusion:** Encouragement for the paper.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "exists/doesn't exist" vs "both/neither" specific question? *Yes, in Req 3.*
      *   *Check:* Did I address the "professor's pushback" on emptiness of emptiness? *Yes, in Req 5.*
      *   *Check:* Is the tone appropriate? *Needs to be rigorous but helpful, not condescending.*
      *   *Check:* Did I distinguish non-negotiables? *Yes, need to be clear that "Paraconsistency" is a hobbyhorse, but "Logical Coherence" is a requirement.*
      *   *Refinement:* Make sure to mention MMK 18.9 (the definition of emptiness) and MMK 24.18 (dependent origination = emptiness). These are textual anchors.

  9.  **Final Polish:** Ensure the distinction between *ontological* claims and *pragmatic* claims is clear, as that's often where the seminar is getting stuck. (e.g., Is Nāgārjuna saying reality *is* contradictory, or that our *concepts* of reality break down?)

  *(Self-Correction on the "Scorecard"):* The prompt asks to briefly score the readings. I need to be careful not to endorse one, but show how they fare against the *criteria*.
  *(Self-Correction on "Tensions"):* The prompt asks to flag pairs of desiderata that can't be jointly satisfied. I need to be precise here. It's not necessarily that *desiderata* conflict, but that *interpretative strategies* struggle to satisfy all desiderata simultaneously. I will frame it as "Tension Points" where interpretations usually break.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a smart way to approach the paper. The seminar chaos you describe is endemic to Madhyamaka studies because the secondary literature often conflates *textual exegesis* (what Nāgārjuna said), *philosophical reconstruction* (what makes sense logically), and *soteriological function* (what the text is supposed to *do* to the reader).

  As someone who works at the intersection of formal logic and Buddhist philosophy, I see this constantly. People try to force Nāgārjuna into a classical logic box, and he bursts it. Then people say, "Aha! Non-classical logic!" and try to force him into a paraconsistent box, and he bursts that too.

  Here is the brainstorming process leading into the specification sheet you asked for.

  ### Brainstorming the "Spec"

  To build a checklist that actually filters interpretations, we have to distinguish between **textual constraints** (things Nāgārjuna explicitly says he is doing) and **philosophical commitments** (things interpreters *want* him to be doing).

  1.  **The Logic vs. Therapy Trap:** If you treat the *catuṣkoṭi* purely as a logical doctrine, you risk turning Emptiness (*śūnyatā*) into a View (*dṛṣṭi*). Nāgārjuna explicitly says he has no view (MMK 13.8). But if you treat it purely as therapy, you can't explain why the arguments are structurally rigorous. He isn't just saying "don't think"; he's showing *why* thinking leads to contradiction. So, the spec must demand an account of **argumentative validity** without **ontological commitment**.
  2.  **The "Both" and "Neither" Problem:** In classical logic, (A & ¬A) is a contradiction, and ¬(A ∨ ¬A) violates Excluded Middle. If Nāgārjuna accepts these corners, he is rejecting classical logic. *But*, is he rejecting logic, or is he rejecting the *terms*? If "exists" and "doesn't exist" presuppose *svabhāva* (intrinsic nature), then "both" and "neither" aren't logical operators on reality, but on *concepts*. The spec needs to force the interpreter to define the domain of the variables.
  3.  **The Reflexivity Trap (Emptiness of Emptiness):** This is your professor's point. If "everything is empty" is a true proposition, is *that* proposition empty? If it's not empty, you have a *svabhāva*. If it is empty, does it lose its truth-value? Any interpretation that makes Madhyamaka a "Theory of Everything" fails here. The spec must require **reflexive stability**.
  4.  **The Two Truths Constraint:** You cannot interpret the tetralemma in a way that makes conventional truth impossible. If the tetralemma destroys all predication, you can't walk, eat, or practice the path. MMK 24 is the guardrail. The interpretation must explain how negation at the ultimate level preserves functionality at the conventional level.

  ### The Desiderata: Specification for an Adequate Interpretation

  Here are the six requirements. I have marked which are **Non-Negotiable** (based on textual/philosophical necessity) and which are **Hobbyhorses** (specific philosophical agendas that interpreters often try to sell as necessary).

  #### 1. The Domain Specification Requirement
  *   **The Requirement:** The interpretation must specify the domain of quantification for the tetralemma. Are the four corners (exists, doesn't exist, both, neither) predicated of *things*, *concepts*, or *propositions*?
  *   **Rationale/Passage:** MMK 15 and MMK 22. Nāgārjuna argues that *svabhāva* cannot be found in causes, conditions, or effects. If the tetralemma is about "things," he is an ontological nihilist. If it is about "concepts of things," he is a conceptual critic.
  *   **Status:** **Non-Negotiable.** Without this, you cannot determine if a contradiction is real or merely verbal.
  *   **Why it matters:** The guy saying he rejects Excluded Middle assumes the domain is "reality." The guy saying it's pedagogy assumes the domain is "opponent's commitment." You need to know which one is in play to evaluate the logic.

  #### 2. The Exhaustiveness vs. Dissolution Requirement
  *   **The Requirement:** The interpretation must explain whether the four corners are meant to be jointly exhaustive of *possibilities* or jointly exhaustive of *mistaken presuppositions*.
  *   **Rationale/Passage:** MMK 18.9 ("The Buddha's teaching of the Dharma is based on two truths..."). If the tetralemma covers all ontological possibilities, and all are rejected, reality is ineffable. If it covers all *svabhāva*-based possibilities, reality is just dependent origination.
  *   **Status:** **Non-Negotiable.**
  *   **Why it matters:** If the corners are exhaustive of reality, Nāgārjuna is a mystic (ineffability). If they are exhaustive of *intrinsic existence*, he is a critical philosopher. Most seminars fail because they mix these up.

  #### 3. The "Both" and "Neither" Justification
  *   **The Requirement:** The interpretation must provide a semantic or pragmatic rationale for why "both" and "neither" are distinct options, rather than logical noise.
  *   **Rationale/Passage:** MMK 25.17 (regarding Nirvana). "Neither exists nor does not exist." If "both" is just a contradiction, why list it? If "neither" is just a gap, why is it a distinct *koṭi*?
  *   **Status:** **Non-Negotiable.**
  *   **Why it matters:** In classical logic, "both" is false and "neither" is impossible. An interpretation must explain why Nāgārjuna treats them as live options to be refuted (or accepted). This is where the Paraconsistent camp lives or dies.

  #### 4. The Reflexive Stability Requirement (Emptiness of Emptiness)
  *   **The Requirement:** The interpretation must explain how the statement "all things are empty" applies to itself without positing *śūnyatā* as a *svabhāva* (intrinsic nature) or collapsing into self-refuting nonsense.
  *   **Rationale/Passage:** MMK 13.8 ("If I had a thesis, I would be at fault. But I have no thesis, so I am not at fault") and MMK 24.18 ("Emptiness is a dependent designation").
  *   **Status:** **Non-Negotiable.**
  *   **Why it matters:** This is the professor's challenge. If your interpretation makes Madhyamaka a "True Logic," it violates this. If it makes it "No Logic," it violates the argumentative structure.

  #### 5. The Conventional Preservation Requirement
  *   **The Requirement:** The interpretation must demonstrate how the negation of the four corners leaves conventional discourse (language, karma, path) intact.
  *   **Rationale/Passage:** MMK 24.14 ("If you deny emptiness, you deny the conventional").
  *   **Status:** **Non-Negotiable.**
  *   **Why it matters:** An interpretation that results in total silence or the impossibility of speech is a failure of Madhyamaka, regardless of how elegant the logic is.

  #### 6. The "No-View" Consistency Requirement
  *   **The Requirement:** The interpretation must account for Nāgārjuna's claim that he is not asserting a position (*pratijñā*) while simultaneously engaging in rigorous *prasaṅga* (reductio) arguments.
  *   **Rationale/Passage:** *Vigrahavyāvartanī* (The Dispeller of Disputes), where he defends MMK against the charge of self-refutation.
  *   **Status:** **Non-Negotiable.**
  *   **Why it matters:** This addresses the student who says "it's just pedagogy." If it's *just* pedagogy, why does he defend the logical consistency of his negations in the *Vigrahavyāvartanī*? He cares about the logic, even if he doesn't hold a "view."

  ---

  ### The Incompatibility Matrix (Where Interpretations Break)

  You asked to flag pairs of desiderata that are difficult to jointly satisfy. Here is the friction points where most seminar discussions turn into people talking past each other.

  **Tension A: Logical Rigor (Req 6) vs. Reflexive Stability (Req 4)**
  *   **The Conflict:** If you treat the tetralemma as a substantive logical doctrine (e.g., "Reality is Paraconsistent"), you satisfy Logical Rigor. But you fail Reflexive Stability because "Paraconsistency" becomes the intrinsic nature of reality. You've turned Emptiness into a View.
  *   **The Trade-off:** To save Reflexive Stability, you often have to weaken Logical Rigor, treating the arguments as *ad hominem* or therapeutic. But then you struggle to explain why Nāgārjuna bothers with such tight syllogisms.

  **Tension B: Exhaustiveness (Req 2) vs. Conventional Preservation (Req 5)**
  *   **The Conflict:** If the four corners are truly exhaustive of *all* possibilities regarding an object, and all four are rejected, then the object is ineffable/unthinkable. If the object is unthinkable, how can we talk about it conventionally (Req 5)?
  *   **The Trade-off:** To save Conventional Preservation, you must argue the tetralemma is only exhaustive of *svabhāva*-based claims, not all claims. But this requires a nuanced semantic theory (Req 1) that many interpreters skip.

  **Tension C: The "Both" Corner (Req 3) vs. Classical Logic Assumptions**
  *   **The Conflict:** If you assume classical logic is the baseline for "rationality," the "Both" corner is trivial (it's just a contradiction). To make "Both" a serious option (Req 3), you must adopt non-classical logic (Paraconsistency).
  *   **The Trade-off:** Adopting Paraconsistency solves Req 3 but threatens Req 4 (Reflexive Stability) and Req 6 (No-View), as it looks like you are asserting a "True Logic."

  ---

  ### Scorecard: How the Main Readings Fare

  Here is how the three dominant camps you mentioned stack up against the Spec.

  | Reading | Logical/Paraconsistent (e.g., Priest, Garfield) | Truth-Value Gap/Presupposition (e.g., Siderits, Huntington) | Therapeutic/Soteriological (e.g., Wright, Pyrrhonian) |
  | :--- | :--- | :--- | :--- |
  | **1. Domain Spec** | **Pass.** Domain is ontological/logical. | **Pass.** Domain is linguistic/conceptual. | **Mixed.** Domain is psychological/attachment. |
  | **2. Exhaustiveness** | **Pass.** Takes the 4 corners as logical space. | **Pass.** Takes them as exhaustive of *mistaken* questions. | **Fail.** Often treats them as optional mental habits. |
  | **3. "Both/Neither"** | **Strong Pass.** "Both" is true contradiction. | **Pass.** "Neither" is presupposition failure. | **Weak.** "Both" is just confusion. |
  | **4. Reflexivity** | **Fail.** Risks making Logic a *svabhāva*. | **Pass.** Emptiness is also a empty concept. | **Pass.** Therapy cures itself. |
  | **5. Conventional** | **Pass.** Dialetheism saves the world. | **Pass.** Language works without truth-makers. | **Strong Pass.** Convention is the only game in town. |
  | **6. No-View** | **Fail.** Asserts paraconsistency as true. | **Pass.** Asserts nothing about reality. | **Strong Pass.** Explicitly anti-dogmatic. |
  | **Major Weakness** | Turns Emptiness into a Metaphysical View. | Can make Nāgārjuna seem like a semantic pedant. | Risks making the arguments trivial/psychological. |

  ### The "Killer" Criterion

  If you want to exclude candidates quickly, the single requirement that does the most work is **Requirement 4: Reflexive Stability (Emptiness of Emptiness).**

  *   **Why:** It is the easiest place for an interpretation to fail silently.
  *   **The Logical/Paraconsistent reading** usually stumbles here. If Nāgārjuna is teaching us that reality *is* contradictory (paraconsistent), then "contradictoriness" is a feature of reality. That is a *svabhāva*. Nāgārjuna explicitly denies having a *svabhāva* to offer.
  *   **The Therapeutic reading** usually passes this easily (the therapy cures itself), but often fails Requirement 6 (Argumentative Force).
  *   **The Presupposition reading** tends to balance these best, but often struggles with Requirement 3 (explaining the specific utility of "Both").

  ### Recommendation for Your Paper

  Don't try to solve Madhyamaka. Use the Spec to evaluate *one* specific tension.

  For example: *"I will argue that the Paraconsistent reading satisfies the Logical Rigor desideratum but fails the Reflexive Stability desideratum, whereas the Presupposition reading satisfies Stability but struggles with the 'Both' corner. I will propose that a hybrid approach, treating the tetralemma as a tool for exposing category errors (Presupposition) that utilizes paraconsistent formalism only provisionally (Logic), best meets the Spec."*

  This allows you to acknowledge the seminar chaos without getting bogged down in it. You aren't defending Nāgārjuna; you are defending a *method of reading* Nāgārjuna that respects the complexity of the text.

  Good luck. This is the right way to write a term paper in this field.
