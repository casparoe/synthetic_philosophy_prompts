prompt: |-
  I run a study group on political philosophy and we're about to do the "equality of what?" debate (welfare vs resources vs capabilities). I want a "which egalitarian are you actually?" quiz, not a "which thinker do you like" quiz. Please make it 8-10 questions, each a concrete case with two or three options, and answerable by someone who has never heard of Sen or Dworkin -- so each question has to turn on what they'd say about the case, not on labels. Please include at least these cases: the person with expensive champagne tastes, someone with a disability who needs a wheelchair to get around, someone who is perfectly content with very little (happy but deprived), and someone who could work but prefers to surf all day and is poor as a result. The scoring key should map answer patterns onto: welfare egalitarianism, resourcism, capabilities views, luck egalitarianism with and without responsibility-sensitivity, sufficientarianism, and Anderson-style relational/democratic equality, plus one "you're not really an egalitarian" catch. Build the key from the logical space first, then locate the positions in it, and note any answer pattern nobody really defends and why (incoherent, or just unattractive?). Also flag pairs the quiz honestly can't separate -- I suspect resource views and capabilities views won't come apart on my four cases, so tell me if I'm wrong and what extra question would fix it. Answer in British English, and keep it usable: my group will actually take the quiz.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Topic:** "Equality of What?" debate (Welfare vs. Resources vs. Capabilities, etc.).
      *   **Format:** 8-10 question quiz.
      *   **Style:** Concrete cases, not theoretical labels. Accessible to beginners (no prior knowledge of Sen/Dworkin required).
      *   **Required Cases:** Expensive tastes (champagne), Disability (wheelchair), Happy but deprived (content monk/deprived worker), Lazy surfer (choice vs. circumstance).
      *   **Scoring Key:** Must map to Welfare Egalitarianism, Resourcism, Capabilities, Luck Egalitarianism (with/without responsibility), Sufficientarianism, Relational/Democratic Equality (Anderson), and a "Not an Egalitarian" catch.
      *   **Methodology:** Build the key from logical space first, then locate positions. Note incoherent/unattractive patterns. Flag indistinguishable pairs (specifically Resources vs. Capabilities).
      *   **Language:** British English.
      *   **Usability:** Must be ready for a study group to take.

  2.  **Deconstruct the Philosophical Positions (Logical Space):**
      *   *Welfare Egalitarianism:* Equalise happiness/preference satisfaction.
      *   *Resourcism (Dworkin):* Equalise external/internal resources (insurance model). Sensitive to choice, insensitive to brute luck.
      *   *Capabilities (Sen/Nussbaum):* Equalise real freedom to function. Focus on what people can *do/be*.
      *   *Luck Egalitarianism:* Neutralise brute luck, reward/penalise option luck/responsibility. (Often overlaps with Resources/Capabilities but distinct on the *surfer* case).
      *   *Sufficientarianism:* Everyone needs *enough*, equality above that doesn't matter.
      *   *Relational/Democratic Equality (Anderson):* Equality of status, ending oppression/hierarchy, not micromanaging distributions.
      *   *Strict Equality (Outcome):* Everyone gets the same amount of X, regardless of cause.
      *   *Libertarian/Non-Egalitarian:* No enforced redistribution based on need/taste.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* 8-10 questions covering the required cases + distinguishing features.
      *   *Case 1: Expensive Tastes (Champagne).* Distinguishes Welfare (compensate) vs. Resource/Capability (don't compensate).
      *   *Case 2: Disability (Wheelchair).* Distinguishes Resource (might need extra to buy chair) vs. Strict Equality (same cash) vs. Welfare (compensate for unhappiness).
      *   *Case 3: Happy but Deprived.* Distinguishes Welfare (they are fine) vs. Resource/Capability (they lack goods/freedom).
      *   *Case 4: The Surfer (Choice).* Distinguishes Luck Egalitarian/Resource (no help, it's choice) vs. Strict Welfare/Sufficientarian (maybe help if below threshold).
      *   *Case 5: Social Status/Relationships.* Crucial for Anderson. Is inequality bad because of stuff or because of hierarchy?
      *   *Case 6: Expensive Medical Needs.* Similar to disability but tests the "insurance" logic.
      *   *Case 7: Adaptation (The content slave).* Similar to Happy/Deprived but tests adaptive preferences.
      *   *Case 8: Inheritance/Luck.* Tests brute luck vs. choice.

      *Refining for the "Beginner" Constraint:* Avoid jargon. Use "Well-being," "Stuff/Money," "Freedom to do," "Status."

      *Refining for the "Resources vs. Capabilities" Problem:* The prompt suspects these won't come apart. This is a known issue in simple quizzes. Resources focus on *means*, Capabilities on *ends/freedoms*. To separate them, I need a case where having the resource doesn't guarantee the capability (e.g., a bike given to someone who doesn't know how to ride, or a ramp given to a building with a locked door). Let's add a question about *conversion factors*.

  4.  **Developing the Scoring Key:**
      *   Need to assign points or patterns to the 7+1 outcomes.
      *   *Challenge:* A linear score won't work well for multidimensional views (e.g., Anderson vs. Luck Egalitarian). A "Mostly A/B/C" system is better.
      *   *Structure:* Group answers by "Currency of Justice" (Welfare, Resources, Capabilities) and "Role of Responsibility" (Strict, Luck-sensitive, Sufficientarian, Relational).
      *   *Actually, a better approach for a study group:* Create profiles. "If you mostly answered X, you are..."
      *   *Wait, the prompt asks to build the key from logical space first.* I need to explain *why* the answers map where they do before giving the quiz.
      *   *Correction:* The prompt asks for the quiz *and* the key/explanation. I should present the Quiz first (for usability), then the Leader's Guide (Logical Space, Key, Limitations).

  5.  **Addressing Specific Constraints:**
      *   *British English:* "Programme," "Centre," "£," "Labour," etc.
      *   *Resources vs. Capabilities:* I need to be honest in the guide. They often converge on policy but diverge on theory. I will add a specific question about *training/support* vs. *cash* to try to pry them apart, but I must flag in the analysis that they are "frenemies."
      *   *Incoherent Patterns:* Identify combinations that make no sense (e.g., Compensate for expensive tastes BUT refuse to compensate for disability).

  6.  **Drafting the Content (Mental Check):**
      *   *Q1 (Champagne):* Welfare says pay. Others say no.
      *   *Q2 (Wheelchair):* Welfare/Resource/Capability say help. Strict Equality (same cash) says no.
      *   *Q3 (Happy Monk):* Welfare says ignore. Resource/Cap says help.
      *   *Q4 (Surfer):* Luck Egal/Resource says no. Sufficientarian/Relational says maybe (to prevent poverty/status loss).
      *   *Q5 (Status):* Anderson says focus here.
      *   *Q6 (Conversion):* Bike vs. Mobility. (Resources vs. Capabilities).
      *   *Q7 (Threshold):* Sufficientarianism check.
      *   *Q8 (Inheritance):* Luck Egalitarianism check.

  7.  **Refining the Scoring System:**
      *   Instead of complex points, let's use "Answer Profiles."
      *   Actually, for a study group, a "Tally Sheet" is best.
      *   Columns: Welfare, Resources, Capabilities, Luck, Sufficientarian, Relational, Libertarian.
      *   Each option tags one or two columns.
      *   *Self-Correction:* That's too complex for a handout. Let's group the options into 3 main "instincts" per question, then map the *pattern* in the guide.
      *   *Better:* Keep the quiz clean. Put the complex scoring in the "Leader's Guide" section at the end. The participants just need to pick A, B, or C. The Leader does the mapping.
      *   *Wait, the prompt says "Answerable by someone who has never heard of Sen or Dworkin".* It implies the *participants* take the quiz. So the scoring needs to be understandable or the Leader needs the key. I will provide a Leader's Key that explains the mapping.

  8.  **Final Polish on Logical Space & Limitations:**
      *   Must explicitly discuss the Resource/Capability overlap.
      *   Must discuss the "Incoherent" patterns (e.g., prioritising welfare for the rich but not the disabled).
      *   Must ensure British spelling.

  9.  **Step-by-Step Plan:**
      *   **Introduction:** Brief context.
      *   **The Quiz:** 8 Questions, 3 Options each (A, B, C). Clean layout.
      *   **The Leader's Guide:**
          *   Logical Space construction.
          *   Scoring Key (How to tally).
          *   Interpretation of Results (The "You are..." profiles).
          *   Critical Analysis (Limitations, Resource/Cap overlap, Incoherent patterns).

  10. **Writing the Questions (incorporating British English):**
      *   Use £ instead of $.
      *   Use "programme," "centre," "favour."
      *   Ensure tone is neutral.

      *(Self-Correction during drafting Q6)*: How to separate Resources and Capabilities?
      *   Resource: Give them the money to buy the bike.
      *   Capability: Ensure they can actually travel (maybe give bike + lessons, or public transport pass).
      *   Let's make Q6 about a person who lacks skills to use the money.

      *(Self-Correction on Anderson)*: Anderson hates micromanaging choices. Her focus is on *standing*. Q5 should be about humiliation or hierarchy.

      *(Self-Correction on Sufficientarian)*: Focus on "Enough is enough."

      *(Self-Correction on Libertarian)*: "No forced redistribution."

  11. **Final Review against constraints:**
      *   8-10 questions? I'll aim for 8 strong ones.
      *   Required cases included? Yes (Champagne, Wheelchair, Happy/Deprived, Surfer).
      *   Scoring key maps to all requested views? Yes.
      *   Logical space explanation included? Yes.
      *   Limitations flagged? Yes.
      *   British English? Yes.

  12. **Constructing the Output:** (Proceeding to generate response based on these thoughts).
answer: |-
  # The "Equality of What?" Diagnostic Quiz

  **Instructions for Participants:**
  Read each scenario carefully. There are no right or wrong answers. Choose the option that best matches your immediate moral intuition about what justice requires in that specific case. Do not worry about consistency yet; just answer honestly.

  ---

  ### 1. The Connoisseur (Expensive Tastes)
  Arthur and Brenda have the same income. Arthur is easily pleased and enjoys cheap hobbies. Brenda has cultivated a taste for rare champagne and finds ordinary wine unpleasant. She claims she needs more money to be as happy as Arthur. Should the state tax Arthur to give Brenda more?
  *   **A.** Yes. If the goal is equal well-being, she needs the extra funds to reach the same level of satisfaction as him.
  *   **B.** No. People are responsible for their own preferences. She should learn to be content with what she can afford.
  *   **C.** It depends. If her tastes were caused by a medical condition or upbringing she couldn't control, maybe. If she chose them, no.

  ### 2. The Wheelchair User (Disability)
  Colin uses a wheelchair. To get to work, he needs a modified van which costs £30,000. Diana is able-bodied and uses a standard car. Should the state give Colin extra financial support specifically for this, over and above what Diana gets?
  *   **A.** Yes. He needs more resources to achieve the same level of mobility and participation as everyone else.
  *   **B.** No. Everyone should get the same cash budget. It is up to him to decide how to spend it, even if it leaves him worse off.
  *   **C.** Yes, but only to ensure he isn't excluded from society. We shouldn't worry about making him 'equal', just ensure he isn't oppressed or left behind.

  ### 3. The Content Monk (Happy but Deprived)
  Elias lives in a damp shack and eats rice every day, but he is deeply religious and claims to be perfectly happy. He lacks basic healthcare and education. Should the state intervene to improve his living conditions against his will?
  *   **A.** No. He says he is happy. Justice is about well-being, and his is already high.
  *   **B.** Yes. Happiness isn't enough. He lacks the real freedom to live a healthy, educated life, regardless of his current mood.
  *   **C.** Yes, but only because living in a shack leaves him vulnerable to exploitation. We must ensure he has a secure social standing.

  ### 4. The Professional Surfer (Choice and Poverty)
  Frank is able-bodied and intelligent but chooses to surf all day rather than work. He is now destitute. Should he receive the same welfare benefits as someone who lost their job through no fault of their own?
  *   **A.** Yes. A citizen's basic income should not depend on judging how people choose to live their lives.
  *   **B.** No. He is responsible for his predicament. Public money should compensate for bad luck, not bad choices.
  *   **C.** Yes, provided the amount is enough to keep him alive and housed. Beyond that 'sufficient' level, it doesn't matter if he is poorer than others.

  ### 5. The Inheritance Lottery (Brute Luck)
  Grace and Henry are equally hard-working. Grace's parents left her £1 million. Henry's parents left him nothing. Should the state tax Grace's inheritance heavily to compensate Henry?
  *   **A.** Yes. It is morally arbitrary that one was born into wealth and the other wasn't. Luck should be neutralised.
  *   **B.** No. As long as they had equal opportunities to earn money themselves, the inheritance is Grace's private property.
  *   **C.** We should tax it only if Henry is below a decent threshold of wealth. If he is doing 'okay', exact equality doesn't matter.

  ### 6. The Bike and the Lesson (Resources vs. Capabilities)
  Ian is given a bicycle (a resource) to help him get to work, but he never learned to ride and there are no safe cycle paths. Jamal is given cycling lessons and access to safe paths, but has to buy his own bike. Who has been treated more equally?
  *   **A.** Ian. He was given the same physical asset as everyone else. What he does with it is up to him.
  *   **B.** Jamal. He has been given the actual *ability* to travel. Giving Ian a bike he can't use is a waste.
  *   **C.** Neither matters as much as whether both are treated with respect by their employers and neighbours when they arrive at work.

  ### 7. The Humiliated Recipient (Relational Equality)
  To get welfare benefits, Kate must stand in a long queue, wear a badge, and answer intrusive questions about her sex life in front of her neighbours. She receives enough money to live. Is this just?
  *   **A.** Yes. The distribution of money is fair, which is what matters. The process is just administrative.
  *   **B.** No. Even if the money is equal, this treatment marks her out as inferior. Equality is about social status, not just stuff.
  *   **C.** No. This reduces her well-being and happiness, which is the ultimate metric of justice.

  ### 8. The Threshold (Sufficientarianism)
  Leo has £50,000 a year. Maria has £500,000 a year. Both have secure housing, healthcare, and education. Should the state tax Maria to give more to Leo?
  *   **A.** Yes. Inequality is bad in itself, even if both are well-off.
  *   **B.** No. Both have 'enough' to live dignified lives. Above that threshold, inequality is not a matter of justice.
  *   **C.** Yes, because Maria likely had more opportunities (luck) than Leo, and we should level the playing field.

  ---

  # Leader's Guide & Scoring Key

  ## Part 1: Mapping the Logical Space
  Before scoring, understand that egalitarian theories differ on two axes:
  1.  **The Currency:** *What* are we equalising? (Well-being, Resources, Capabilities, Status).
  2.  **The Scope:** *When* does equality matter? (Always, only below a threshold, only regarding luck, never).

  The quiz options are coded to reveal where a participant sits on these axes.

  ### Answer Key Coding
  Tally the participant's answers into the following columns. Note that some answers overlap (e.g., Luck Egalitarianism often uses Resources as the currency).

  | Q | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | Welfare | Resource / Luck | Luck / Resp. |
  | **2** | Capab. / Welfare | Strict Resource | Relational |
  | **3** | Welfare | Capability | Relational / Capab. |
  | **4** | Relational / Suff. | Luck Egalitarian | Sufficientarian |
  | **5** | Luck Egalitarian | Libertarian | Sufficientarian |
  | **6** | Resourcism | Capabilities | Relational |
  | **7** | Resourcism / Suff. | Relational | Welfare |
  | **8** | Strict Egal. | Sufficientarian | Luck Egalitarian |

  *(Note: In a live session, you may wish to simplify this by asking participants to count which letter they chose most, but the matrix above is more accurate for philosophical nuance.)*

  ## Part 2: Interpreting the Profiles

  ### 1. The Welfare Egalitarian
  *   **Pattern:** Mostly **A** on Q1, Q3, Q7.
  *   **View:** Justice is about equalising happiness or preference satisfaction.
  *   **Critique:** Vulnerable to the "Expensive Tastes" objection (Q1) and the "Content Monk" problem (Q3). If someone is happy being oppressed, do we ignore them?

  ### 2. The Resourcist (Dworkinian)
  *   **Pattern:** Mostly **B** on Q1, Q2, Q6.
  *   **View:** Justice is about distributing fair shares of external and internal resources. People are responsible for what they do with those resources.
  *   **Critique:** Struggles with Q6 (conversion factors). Giving a disabled person the same cash as an able-bodied person (Strict Resource) often fails to secure equality.

  ### 3. The Capability Theorist (Sen/Nussbaum)
  *   **Pattern:** Mostly **B** on Q2, Q3, Q6.
  *   **View:** Justice is about expanding the real *freedoms* (capabilities) people have to function. Focuses on what people can *do* and *be*.
  *   **Critique:** Hard to measure. Can drift into paternalism (Q3: forcing help on the happy monk).

  ### 4. The Luck Egalitarian
  *   **Pattern:** Mostly **C** on Q1, **B** on Q4, **A** on Q5.
  *   **View:** Inequalities due to brute luck (birth, disability) should be corrected; inequalities due to choice (surfing, tastes) should not.
  *   **Critique:** Can be harsh on the "surfer" (Q4). Requires intrusive inquiries into whether a condition is 'chosen' or 'lucky'.

  ### 5. The Sufficientarian
  *   **Pattern:** Mostly **C** on Q4, Q5, Q8.
  *   **View:** Justice requires everyone has *enough*. Above that threshold, inequality is morally irrelevant.
  *   **Critique:** Ignores large gaps between the rich and super-rich (Q8), which might undermine democracy.

  ### 6. The Relational / Democratic Egalitarian (Anderson)
  *   **Pattern:** Mostly **C** on Q2, **B** on Q7, **A** on Q4 (sometimes).
  *   **View:** Equality is about social relations, not distribution. The goal is to end oppression, hierarchy, and humiliation.
  *   **Critique:** May not specify exactly how much material redistribution is needed to secure equal status.

  ### 7. The Strict Egalitarian
  *   **Pattern:** Mostly **A** across the board (especially Q5, Q8).
  *   **View:** Inequality is intrinsically bad, regardless of cause or threshold.
  *   **Critique:** Ignores responsibility (Q4) and can lead to 'leveling down' (making everyone poorer to make them equal).

  ### 8. The "Not Really an Egalitarian" (Libertarian)
  *   **Pattern:** Mostly **B** on Q2, Q4, Q5.
  *   **View:** Redistribution is unjust coercion. Property rights trump equality.
  *   **Critique:** Accepts vast inequalities resulting from morally arbitrary luck (Q5).

  ## Part 3: Critical Notes for Discussion

  ### 1. The Resource vs. Capability Problem
  You suspected these views would not come apart. You are largely right.
  *   **The Overlap:** In Q2 (Disability), both Resourcists and Capability theorists usually agree extra support is needed. Resourcists frame it as "internal resources" or insurance; Capability theorists frame it as "mobility function."
  *   **The Divergence:** Q6 is the only question that truly separates them.
      *   *Resourcism* focuses on the *means* (the bike).
      *   *Capabilities* focuses on the *end* (the ability to travel).
  *   **Why it matters:** If your group scored high on Resource/Capability mix, ask them: *"If we give someone a laptop (resource) but they lack the literacy to use it, have we treated them equally?"* A Capabilities theorist says no; a strict Resourcist might say yes.

  ### 2. Incoherent or Unattractive Patterns
  Watch for these combinations during the debrief:
  *   **The "Expensive Taste" Contradiction:** Compensating Brenda for champagne (Q1-A) but refusing Colin a wheelchair (Q2-B). This implies you value happiness over mobility, but only for the able-bodied. Most philosophers reject this as inconsistent.
  *   **The "Surfer" Hardline:** Refusing the surfer help (Q4-B) but taxing inheritance heavily (Q5-A). This is a coherent Luck Egalitarian position, but often feels intuitively harsh. It invites the question: *"Is being born to rich parents really more 'deserving' of protection than choosing to surf?"*
  *   **The "Happy Slave" Trap:** Ignoring Elias because he is happy (Q3-A). This is the classic Adaptive Preferences objection. If your group chooses this, challenge them: *"If he was taught from birth that he deserves a shack, is his happiness a valid metric of justice?"*

  ### 3. Limitations of the Quiz
  *   **Anderson vs. Sufficientarianism:** These often overlap in practice (Q4, Q8). Anderson argues for enough resources to secure equal status; Sufficientarians argue for enough for a decent life. The quiz cannot perfectly disentangle them without deeper questions about *social hierarchy*.
  *   **Luck Egalitarianism Nuance:** Q1-C and Q4-B capture the "Responsibility" aspect, but Luck Egalitarianism is a *reason* for equality, not necessarily a *currency*. A Luck Egalitarian could be a Welfare or Resource egalitarian. The quiz forces a choice that might oversimplify their view.

  ### 4. Facilitation Tip
  If the group lands heavily on **Relational Equality (Anderson)**, pivot the discussion to: *"Can you have equal status without equal money?"*
  If the group lands heavily on **Luck Egalitarianism**, pivot to: *"Do we really want the state investigating whether our poverty is our own fault?"*

  This diagnostic is not a final verdict, but a map to show where your intuitions lie before you read the texts. Enjoy the debate!
