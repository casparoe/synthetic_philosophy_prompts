      *   **Circularity/Access:** How do we know $A$ is closer to $T$ if we don't know $T$? If we need to know $T$ to verify the measure, the measure is useless for scientific practice.
          *   *Defender's response:* Distinction between the *definition* of verisimilitude (ontological/semantic) and the *estimation* of verisimilitude (epistemic). We estimate without knowing.
          *   *Severity:* High epistemic worry, but ontologically manageable. User finds this hardest to shake.

      *   **Pragmatist Fallback:** Van Fraassen, Laudan. Science aims at empirical adequacy/solving problems, not truth. Verisimilitude adds nothing.
