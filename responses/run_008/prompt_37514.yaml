  Here is the breakdown of your roommate's philosophical profile, her likely verdicts on the cousin's cases, and the diagnostic tools you need to settle the debate.

  ### 1. Diagnosing Your Roommate's View
  Your roommate is running a **Moderate Dispositionalist** view (a sophisticated form of Anti-Intellectualism).

  She rejects **Strict Intellectualism** (the idea that know-how is just know-that) because of the **Ski Instructor** and **Cyclist** cases. For her, possessing the theory (propositions) is neither necessary (Cyclist) nor sufficient (Instructor) for know-how.

  She also rejects **Crude Behaviorism** (the idea that know-how is *only* current successful performance) because of the **Retired Surgeon** case. If know-how were just "doing it," the surgeon would lose her know-how the moment her hands started shaking. Your roommate insists the know-how persists because the *internal competence* remains, even if the *output* is blocked.

  She rejects **Luck** via the **Lucky Putter**. Reliability is key.

  **Her Rule:** *Know-how is a stable, internalized disposition to succeed reliably at a task, grounded in skill rather than mere theory, which persists despite temporary physical inhibition but requires more than accidental success.*

  ### 2. Predictions on the Cousin's Three Cases

  Based on that rule, here are her predicted verdicts:

  *   **(1) The Apprentice Baker:** **YES, she knows how.**
      *   *Reasoning:* Unlike the Ski Instructor, the prompt specifies she *would* turn out a perfect loaf. This means she possesses the reliable disposition (the skill), even if untested. She is functionally identical to the Natural Skier before her first run. The lack of past performance doesn't matter if the capacity is present (unlike the Instructor who lacked the capacity).
  *   **(2) The Remote-Control Golfer:** **NO, she does not know how.**
      *   *Reasoning:* This is the **Lucky Putter** case scaled up. Her success is not reliable on her own; it is dependent on an external crutch. She lacks the internal disposition.
  *   **(3) The Unconscious Typist:** **YES, he knows how.**
      *   *Reasoning:* This is the **Natural Skier/Cyclist** case. High ability + reliability = know-how. His lack of theoretical access ("no idea how he does it") is irrelevant.

  ### 3. The Wedge Case: Which one pulls the theories apart?

  **Case (1), The Apprentice Baker, is your best weapon.**

  This is the case that creates the most friction between your roommate's **Dispositional Ability View** and the **Stanley & Williamson (S&W) Intellectualist View**.

  *   **Your Roommate (Dispositionalist):** Will say **YES**. The counterfactual success ("would turn out a perfect loaf") proves the disposition exists. The ability is present, so the know-how is present.
  *   **Stanley & Williamson (Intellectualist):** Will likely say **NO** (or be deeply conflicted). S&W argue know-how is possessing a proposition under a *practical mode of presentation*. Most S&W proponents argue this mode is acquired through *engagement* or *action*, not mere observation. An apprentice who has *never* baked lacks the first-person practical grasp of the action, regardless of how well she might perform. She has the *theoretical* mode, not the *practical* one.

  If your roommate says **Yes**, she is firmly in the Anti-Intellectualist/Ability camp. If she hesitates or says **No**, she is secretly sympathetic to the idea that know-how requires a specific kind of first-person epistemic grasp (Intellectualism).

  ### 4. The Tie-Breaker Case

  If the Baker case doesn't settle it (perhaps she waffles on the "would succeed" claim), introduce this case to separate **Reliability** from **Practical Mode**:

  **The "Reliable Reflex" Case:**
  > "Imagine a man with a neurological condition. Whenever a ball is thrown at his face, his hands snap up and catch it every single time, perfectly. It is 100% reliable. However, he has no intention of catching it, feels no agency, and describes it as 'my hands just move.' He cannot catch a ball voluntarily."

  *   **Ability + Reliability View:** **YES.** He has the reliable disposition to succeed at the task of catching.
  *   **Stanley & Williamson:** **NO.** He lacks the *intentionality* required for a practical mode of presentation. He isn't acting; he is reacting. He does not know *how* to catch; his body just *does* catch.
  *   **Your Roommate's Likely Verdict:** **NO.** Given her rejection of the Lucky Putter, she values *skill* over mere *success*. She likely views skill as requiring agency. If she says **Yes**, she is a pure Reliabilist. If she says **No**, she requires Agency/Intention, which aligns her closer to S&W (despite her other anti-intellectualist verdicts).

  ### 5. Regarding Your Pride

  **Yes, you are absolutely a closet intellectualist.**

  Your line—"it's all just knowledge-that under a funny description"—is practically the slogan of **Jason Stanley and Timothy Williamson**.

  *   **Your View:** Know-how is reducible to Know-that (propositional knowledge).
  *   **Your Roommate's View:** Know-how is a distinct species of knowledge (or ability) that cannot be reduced to propositions (hence the Cyclist who has know-how but false propositions, and the Instructor who has propositions but no know-how).

  You are arguing for the reduction of practical knowledge to theoretical knowledge. She is arguing for the autonomy of practical knowledge. In the current philosophical landscape, you are the Intellectualist, and she is the Anti-Intellectualist. Wear that label with pride, but don't expect her to agree with you; the Ski Instructor case is the classic "stop sign" for your view.
