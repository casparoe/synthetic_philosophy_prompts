      *   **Section 3: Cruxes and Predictions:**
          *   *Crux 1: New Issues (AI/Geoengineering).*
              *   AT Prediction: Will quickly align with the inequality axis (e.g., who benefits/controls).
              *   CT Prediction: Will remain cross-cutting or align based on which coalition needs the votes, potentially differently in different countries.
              *   Falsification: AT fails if it stays scrambled for decades. CT fails if it aligns universally and instantly regardless of local coalition needs.
          *   *Crux 2: Orthogonal Correlations (Economics vs. Culture/Justice).*
              *   AT Prediction: High correlation. If you want economic equality, you likely want social equality (less hierarchy in prisons, workplaces).
              *   CT Prediction: Correlation is contingent. History shows breaks (e.g., working-class social conservatives). Correlation depends on current party platforms.
              *   Falsification: AT fails if correlations drop significantly. CT fails if correlations hold perfectly across vastly different historical/cultural contexts without coalition enforcement.

      *   **Section 4: Resolution/Next Steps:**
          *   Data to gather.
          *   Timeline.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I capture the "inequality" definition for AT? Yes, ensure it's explicit.
      *   *Check:* Did I capture the "supermarket" analogy for CT? Yes, use the "contingent bundle" language.
      *   *Check:* Is the tone right? It needs to sound like engineers wrote it (or for them). Use terms like "latent variable," "signal-to-noise," "predictive power."
