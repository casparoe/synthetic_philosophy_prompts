          *   Nature of disagreement (ontology: natural kind vs. useful statistic vs. social fact).
          *   Crux 1: Prediction on new issues (AI, geoengineering) – absorbed vs. cross-cutting.
          *   Crux 2: Correlation prediction – does economic equality stance predict orthogonal stances (criminal justice, immigration, aesthetics)?
          *   Falsification conditions (what evidence would hurt each view).
          *   Address the verbal dispute about "real."
      *   **Format:** Numbered sections (Agreed Claims, Disagreements, Cruxes/Predictions).
      *   **Tone:** Professional, structured, neutral, suitable for engineering minds (precise, testable).

  2.  **Deconstruct the Positions:**
      *   *Axis Theorist (AT):* Focuses on underlying psychological or philosophical coherence. Inequality/Hierarchy is the latent variable. If you know someone's position on inequality, you can predict other things. The dimension is stable over time.
      *   *Coalition Theorist (CT):* Focuses on historical contingency and coalition building. Positions cluster because parties need majorities, not because of logical consistency. The clusters shift (e.g., labor unions vs. civil rights in the US). The dimension is a label, not a law.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. "Adversarial Collaboration Memorandum: The Ontology of the Political Spectrum."
      *   **Introduction:** Briefly state the purpose and the participants.

      *   **Section 1: Agreed Claims (Common Ground):**
          *   They must agree *something* happens. People do cluster.
          *   They agree the terms "Left" and "Right" are currently used.
          *   They agree correlation exists *now*, even if they disagree on *why*.
          *   They agree history matters (French Revolution origin).

      *   **Section 2: The Nature of the Disagreement (Ontology):**
          *   This addresses the "real" vs. "illusion" aspect.
          *   AT sees it as a *latent trait* (psychological/philosophical).
