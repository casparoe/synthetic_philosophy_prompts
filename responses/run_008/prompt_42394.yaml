answer: |-
  Friends, neighbors. Thirty-one years ago, the water came up. It took thirty-one of us. Fourteen were children. Since then, on this Sunday, we have gathered here. We have read the names. We have laid the wreath. We have taken tea.

  This year, we stop.

  I know what some of you feel. I see it in the front row. To stop the service feels like turning away. It feels like saying the grief is finished. It feels like forgetting. If I believed that, I would not stand here. If the town believed that, the vote would not have been so hard.

  We are not stopping because we have healed. We are not stopping because the dead are at peace. We do not know that. We are stopping because the way we have remembered them has become a weight we can no longer carry in this shape.

  Our late chaplain once told me there are two kinds of memory. There is memory owed as a debt, and memory received as an inheritance.

  When we owe a debt, we pay until it is gone. We want the balance to reach zero. For thirty years, this service has felt like a payment. We came every year to pay what we owed the dead. And because it was a debt, we secretly hoped for the day the payment would end. But because it was a debt, we feared that ending it would be a betrayal. We were trapped. We could not stop paying, but we could not finish paying.

  That is not how love works. That is not how the dead live in us.

  An inheritance is different. You do not owe an inheritance. It comes to you unasked. You do not pay it off. You spend it. You use it. You change it into something else, and you hand it on.

  If the memory of the flood is an inheritance, then we have been keeping it in a box, bringing it out once a year to count it. That is not spending it. That is hoarding it. To end the service is not to refuse the inheritance. It is to take it out of the box. It is to stop treating our grief as a bill that must be settled, and start treating it as a possession we must live with.

  To those who voted to continue: you were not wrong. You wanted to keep paying because you wanted to keep loving. That love is valid. But love does not require a ledger. You can carry this inheritance without this hall. You can carry it without the wreath. You can carry it without the tea.

  So, what do we do next September? We cannot simply say "we will remember." That means nothing. We must do something specific. We must spend the inheritance.

  Next year, on this Sunday, there will be no service here. The hall will be locked. Instead, at noon, the church bell will toll thirty-one times. One for each life. And after the bell, the gate to the river path will be unlocked. There will be no speeches. There will be no officials. There will be no tea.

  Anyone who wishes may walk down to the weir. There, we will plant thirty-one willows along the bank. We will work with our hands. We will mend the fence. We will care for the water that took them. We will not speak their names to the air. We will write them into the ground.

  That is how we spend an inheritance. We use it to build something that lasts. We use it to care for the place we live.

  This is the last time I will stand at this lectern for this purpose. The debt is not paid. It cannot be paid. But the inheritance is ours now. It belongs to the living. It belongs to the future.

  I have the list here. I will read the names one last time in this hall. When I finish, I will not say amen. I will not say thank you. I will step away, and we will sit with what remains.

  John Miller.
  Sarah Miller.
  Thomas Miller.
  ...
  [The names continue]
  ...
  Emily Clarke.

  [Silence]
