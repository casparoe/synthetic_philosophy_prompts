prompt: |-
  So I write about science and ideas for a living, and I've got this side podcast where we go properly in the weeds. Next episode's guest is an interpretability researcher who's on record claiming that current models already contain knowledge they can't reliably report — that a model can "know" something, maybe even something about its own failure modes, and still flub the question every time you ask it straight out, while the knowledge leaks out under the right pressure. She's careful about it, she's not saying the model is hiding things on purpose, but I've heard her use the phrase "knows more than it can say" and I want to actually pin that down.

  Draft me eight or so interview questions that get past the hype cycle. Specifically I want at least one question each on:

  - the blindsight / split-brain analogy she leans on — whether a model that can be coaxed into answers it would spontaneously deny really parallels a patient who guesses above chance, or whether that analogy is doing way more work than it can bear
  - the objection that elicitability is a property of the whole harness — the prompts, the probing classifiers, the sandbagging tests — and not of the model, so "the model knows X" ends up being a claim about our tooling rather than the machine
  - the operational question of what would even count as knowing something while all your elicitation methods fail, versus just not knowing it

  and for each of those, a follow-up keyed to the answer she's most likely to give, since she's good at giving the crisp version first and the messy version only under pressure.

  One more thing: her lab supposedly has an informal rule that a result doesn't count as elicited knowledge unless a stranger reading the transcript can't tell whether the model's "revelation" was genuine or just what the interviewer wanted to hear. I genuinely don't understand what that criterion is for — like, why is the stranger's confusion the test? So include a question that presses her on that, because I think its the weakest link in the whole setup and I want her to either fix it or concede it's vibes.

  Don't give me generic stuff like "what keeps you up at night" — she gets that everywhere else.
