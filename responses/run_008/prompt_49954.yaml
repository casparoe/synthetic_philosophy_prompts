  You are to answer as a philosopher of probability and decision theory who has also spent time doing practical forecasting — someone equally at home with the technical literature on chance and credence and with the habits of a calibration-trained predictor. Before committing to anything, brainstorm: list the ways one might state the proposition so it has a determinate truth value, then settle on the sharpest formulation and work from that.

  Some background on why I'm asking. I've been reading rationalist blogs and forums for something like fifteen years — the whole lineage of outside-view arguments, base-rate neglect, planning fallacy pieces, reference-class forecasting in infrastructure megaprojects, and the recurring fights about anthropic reasoning. A few years ago I started doing personal forecasting seriously, keeping scored predictions, and I've become uncomfortably aware of a gap between the practice and the theory. When I forecast how long my own software project will take, I know I should use an outside view: find a base rate in some class of similar projects and defer to it. But which class? Projects by people with my experience? Projects of this kind of codebase? Projects with this team size? These give me visibly different frequencies, and nothing in my training as a forecaster tells me which one to use. Calibration scoring can punish my overall record, but it can't reach inside a single question and tell me I picked the wrong class — and I can often reverse-engineer whatever final number I want by shifting the class and adjusting how I weight my inside view against each base rate. That makes me suspect the outside view is less of a discipline than it looks, at least at the level of the individual forecast.

  So here is the proposition I want your credence on: for a given prediction question, there exists a fact of the matter about which reference class is the correct or best one to draw the base rate from — something discoverable in principle, not merely stipulated — such that two forecasters with the same evidence who choose differently are making at least one genuine mistake, rather than both being within their epistemic rights. If that proposition is false, then reference-class selection is in some deep sense permissive: the class is chosen, not found, and the resulting credence inherits an arbitrariness that no amount of calibration training will wash out.

  Give me your number, and give me the decomposition that produces it rather than a bare answer. At minimum I'd want rough probabilities on terms like: whether there are objective single-case chances that could in principle fix the class, or whether chance talk is only coherent relative to a class already chosen; whether a fully subjectivist Bayesian treatment makes the problem illusory by folding class selection into ordinary evidence-weighting, so that the class is just another modeling choice with a right answer determined by the total evidence; whether the right response is to abandon precise credences in these cases and accept an imprecise set or interval spanning the defensible classes; and whether anthropic and self-locating cases — where the class problem seems to bite hardest — are continuous with my mundane forecasting case or are a separate disease. You may add or drop terms as you see fit, but each should get a number and one line of justification, then show how they combine to your final credence. Don't force the decomposition into an artificial product; tell me honestly which terms are independent.

  Two further requests. First, say which single term your final number is most sensitive to, and what argument or discovery would move that term the most — I want to know where the whole edifice is thinnest. Second, tell me how confident you are in the overall claim, and single out the point in your reasoning you are least sure of; if you think my framing of the proposition smuggles in a false dichotomy — say, because the permissiveness intuition can be captured some other way than imprecision — say so rather than answering the question as posed.
