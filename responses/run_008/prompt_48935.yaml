prompt: |-
  My friend and I blew an entire saturday on this argument about whether the world is actually getting less violent, and we've decided the only way forward is to do it properly: write the joint statement the two of us would sign after a real adversarial collab, since we've been talking past each other for months. She's basically on team Pinker (per-capita death rates from violence have fallen enormously over the long run, from hunter-gatherer bands to now, and especially since WWII). I'm on team not-so-fast (the 20th century killed more people in absolute terms than anything before it, states have just gotten better at monopolizing violence and pushing it out of view, and half of what we were fighting about turned out to be a disguised fight about what even counts as violence).

  I want you to draft that joint statement. Numbered section of claims both of us could actually sign -- about data, about definitions, about what's genuinely under dispute -- then a disagreements table where each disagreement is phrased so that whichever of us holds that side would accept the wording (no slanted "one side thinks states hide violence" vs. "the other side naively trusts the numbers" stuff).

  Then the cruxes. Here's where it gets in the weeds, because we developed some specific ones and I want them in there:

  1. The normalizer fight. Per capita vs. absolute numbers is the boring version. The interesting version came up when she accused me of being committed to valuing future lives less -- if population grows, absolute-death-counting means violence could keep "getting worse" even as any given person's odds of dying violently approach zero. But then I hit her with what I think is a real problem for HER side: for the deep past, per-capita death rates from violence might be inflated by competing risks. Someone killed in a raid in a world where a third of people died before adulthood anyway from disease or starvation represents less *excess* mortality attributable to violence than the same death rate would today, where the counterfactual is living to 75. So maybe the right metric isn't deaths per capita at all but something like life-years lost to violence relative to background mortality. Does the decline story survive switching to that metric? I genuinely don't know, and I want the document to say what each of us would predict.

  2. The definitional crux. If you count only intentional, up-close killing (raids, murders, battles), the decline looks overwhelming. If you count what she kept calling structural violence -- deaths from deprivation, famine policy, sanctions, terrible institutions -- the picture gets murky, and possibly flips depending on how you weight it. And here's the meta-question the document has to address: is there a fact of the matter about whether the world is getting less violent, or is the definitional choice itself doing all the work? And if the definition is doing the work, is choosing a definition itself a substantive moral decision rather than an empirical one? We want the doc to be honest about which parts of our dispute are verbal and which are real.

  3. Data reliability for nonstate societies. How much should either of us be moved by ratios derived from archaeology and ethnographic mortality estimates? What would better data plausibly do -- in which direction could it move, and would it move US or just our positions?

  For each crux, give the test, case, or thought experiment both of us would agree bears on it -- e.g., how we'd both react to revised battle-death estimates, or a hypothetical "violence ledger" that counted only witnessed intentional killing vs. one that counted institutional deprivation -- and write down each side's prediction in advance. And be blunt about whether there's any observation either of us has committed to that could actually change our mind, or whether we've both insulated our views. I suspect she's insulated hers by retreating to per-capita whenever absolutes look bad, and I suspect I'm insulated by expanding "violence" whenever the numbers look good. If the doc concludes that's what we're each doing, say so.

  Format: numbered agreed claims first, then the disagreements table, then cruxes with recorded predictions, then a short section on which parts of our arguement the collaboration itself should declare verbal disputes. Keep it casual enough that both of us would read it, but exact -- the whole point is sentences we'd both sign.
