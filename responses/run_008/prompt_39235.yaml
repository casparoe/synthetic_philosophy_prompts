      *   *Gilbert-style (Joint Commitment):* Creates obligations/entitlements. You can't just bail without wronging the other.
      *   *Irreducible/We-Mode (Searle/Tuomela):* The intention is fundamentally collective ("We intend"), not reducible to "I intend."
      *   *Group Agent (List/Pettit):* The group has attitudes/beliefs distinct from members (discursive dilemma).
