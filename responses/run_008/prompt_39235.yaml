  # The Joint Action Intuition Pump

  **Instructions:** Read each scenario and select the option that best matches your gut reaction. Do not overthink the philosophy; answer as if you are describing the world to a friend. There are no right answers, only consistent ones.

  ### 1. The Highway Merge
  Two strangers are driving in adjacent lanes. Driver A sees a gap and slows slightly. Driver B sees the same gap and speeds up slightly. Neither signals; neither makes eye contact. They fit together perfectly and merge.
  *   **A.** They merged together. It was a coordinated joint action.
  *   **B.** They merged alongside each other. It was two individual actions that happened to fit.
  *   **C.** They merged together, but only because the road design forced them to, not because of their minds.

  ### 2. The Piano Movers (Free-Rider)
  Two people are hired to move a piano. Alice lifts and pushes with all her might. Bob holds his end but secretly lets his knees bend, letting Alice carry 90% of the weight. The piano gets moved.
  *   **A.** They moved the piano together. Bob is just a bad partner.
  *   **B.** Alice moved the piano; Bob merely pretended to help. They did not *jointly* move it.
  *   **C.** They moved it together, but Bob wronged Alice by not holding up his end of the bargain.

  ### 3. The Duet (Secret Bail)
  Singers Cara and Dan plan to perform a duet. They rehearse for weeks. On stage, Cara sings her part. Dan intends to sing, but halfway through, he secretly decides he will stop singing at the final note to prank her. He follows the plan until the very end.
  *   **A.** They performed the duet together until the moment Dan changed his mind.
  *   **B.** They never truly performed together because Dan's commitment was fake from the start of the performance.
  *   **C.** They performed together, but Dan betrayed Cara the moment he formed the secret plan to stop.

  ### 4. The Driving Instructor
  An instructor sits in the passenger seat with dual controls. The student is terrified and wants to stop. The instructor says, "Keep going, I will brake if it's dangerous," and guides the student through a maneuver the student does not want to do.
  *   **A.** They drove the car together. The student's intention doesn't matter as long as they follow instructions.
  *   **B.** The instructor drove the car *through* the student. It was the instructor's action, not a joint one.
  *   **C.** They drove together, but the student is not responsible for where the car went.

  ### 5. The Flash Mob
  One hundred strangers download an app. At noon, the app sends a signal, and they all stand up and clap for one minute. None of them know each other. None of them care about the others; they just want the reward the app offers for participating.
  *   **A.** They clapped together as a group.
  *   **B.** They clapped individually at the same time.
  *   **C.** The app organized a group action, but the people themselves were just tools.

  ### 6. The Riot
  A crowd gathers. Tensions rise. A bottle is thrown. Suddenly, the crowd surges forward and smashes a storefront. No one gave an order. Many individuals in the crowd did not throw anything and were swept along by the pressure of bodies.
  *   **A.** The crowd destroyed the store. The group is the agent.
  *   **B.** Specific individuals destroyed the store; saying "the crowd" did it hides who is actually guilty.
  *   **C.** The crowd acted as one, but only the ones who intended the damage are part of the "joint action."

  ### 7. The Wikipedia Article
  Thousands of editors contribute to a Wikipedia page on "Quantum Mechanics." No single editor knows the whole article. Some editors disagree with each other. Some edit to vandalize, others to fix. The final article is coherent and accurate.
  *   **A.** The community wrote the article. The group knows more than any single member.
  *   **B.** Many individuals wrote parts, but no one wrote the article. There is no "author."
  *   **C.** The algorithm and the rules wrote the article; the humans were just components.

  ### 8. The Breakup
  Two people are walking together toward a cafe. Halfway there, one person says, "I'm going home," and turns around without asking or explaining.
  *   **A.** They were walking together, so leaving requires a mutual agreement to stop.
  *   **B.** They were walking near each other. Anyone can stop whenever they want.
  *   **C.** They were walking together, so leaving is rude, but they have the right to do it.

  ### 9. The Market Price
  Millions of people buy and sell stocks. The price of a share rises to $100. No single buyer intends for the price to be $100; they just want to buy low or sell high.
  *   **A.** The market set the price. The market is an agent with its own logic.
  *   **B.** The traders set the price. The "market" is just a word for all of them combined.
  *   **C.** The price is an outcome, not an action. No one "did" anything together.

  ### 10. The Silent Agreement
  Two people are carrying a heavy table. They need to turn a corner. They lock eyes, nod, and turn simultaneously. No words are spoken.
  *   **A.** They formed a joint intention in that moment.
  *   **B.** They each formed an individual intention based on what they saw the other do.
  *   **C.** They signaled each other, but the intention to turn was always individual.

  ---

  # Scoring Key & Logical Space

  Do not simply sum the points. This quiz measures three underlying dimensions. Plot your answers on the axes below to find your position.

  ### Dimension 1: Reductionism (The "We" vs. "I" Axis)
  *How much do you think "group action" can be broken down into individual actions?*
  *   **High Reductionism (Score R+):** You chose **1B, 2B, 5B, 6B, 7B, 9B**. You believe joint action is a metaphor for correlated individual behavior.
  *   **Low Reductionism (Score R-):** You chose **1A, 5A, 6A, 7A, 9A**. You believe the group is a real entity that acts over and above the individuals.

  ### Dimension 2: Normativity (The "Obligation" Axis)
  *Does acting together create binding duties that didn't exist before?*
  *   **Low Normativity (Score N-):** You chose **2A, 3A, 8B**. You think joint action is about coordination, not binding promises. You can bail if you can get away with it.
  *   **High Normativity (Score N+):** You chose **2C, 3C, 8A**. You think joint action creates a web of obligations. To defect is not just to fail, but to *wrong* the partner.

  ### Dimension 3: Opacity (The "Knowledge" Axis)
  *Can a group act even if members don't fully know or intend the collective outcome?*
  *   **Transparent (Score O-):** You chose **4B, 6C, 10B**. You think joint action requires mutual knowledge and aligned individual intent.
  *   **Opaque (Score O+):** You chose **4A, 6A, 7A, 9A**. You think the group can intend or know things the individuals do not (or can act through individuals who don't share the goal).

  ---

  ### Mapping Positions

  **1. The Deflationary / Summative View**
  *   **Profile:** High Reductionism (R+), Low Normativity (N-), Transparent (O-).
  *   **Typical Answers:** 1B, 2B, 3A, 5B, 6B, 7B, 8B, 9B.
  *   **Philosophical Neighborhood:** Early Davidson, methodological individualists.
  *   **Diagnosis:** You suspect "joint action" is a cached label for "lots of people doing similar things." You see the territory as only individuals; the map of "we" is useful fiction.

  **2. The Mesh / Shared Intention View (Bratman-style)**
  *   **Profile:** Low Reductionism (R-), Low Normativity (N-), Transparent (O-).
  *   **Typical Answers:** 1A, 2A, 3A, 5A, 6C, 7B, 8B, 10A.
  *   **Philosophical Neighborhood:** Michael Bratman.
  *   **Diagnosis:** You believe "we" is real, but it is built entirely out of interlocking "I"s. We act together when our intentions mesh and we know they mesh. You reject heavy obligations (Question 3) and opaque group minds (Question 7).

  **3. The Joint Commitment / Obligation View (Gilbert-style)**
  *   **Profile:** Low Reductionism (R-), High Normativity (N+), Transparent (O-).
  *   **Typical Answers:** 1A, 2C, 3C, 5A, 6C, 7B, 8A, 10A.
  *   **Philosophical Neighborhood:** Margaret Gilbert.
  *   **Diagnosis:** You agree with the Mesh view on knowledge, but you think the defining feature of joint action is the *bond*. To act together is to owe something to the other. You likely marked 3C and 8A.

  **4. The Irreducible / We-Mode View (Searle/Tuomela-style)**
  *   **Profile:** Low Reductionism (R-), High Normativity (N+), Opaque (O+).
  *   **Typical Answers:** 1A, 2C, 3C, 4A, 6A, 7A, 8A, 10A.
  *   **Philosophical Neighborhood:** John Searle, Raimo Tuomela.
  *   **Diagnosis:** You think the "We-Intention" is a primitive mental state, not built from "I-Intentions." You are comfortable saying the group acted even when individuals were coerced (Question 4) or swept up (Question 6).

  **5. The Group Agent View (List/Pettit-style)**
  *   **Profile:** Low Reductionism (R-), Variable Normativity, High Opacity (O+).
  *   **Typical Answers:** 1A, 5A, 6A, 7A, 9A. (Questions 2, 3, 8 matter less to you than 7 and 9).
  *   **Philosophical Neighborhood:** Philip Pettit, Christian List.
  *   **Diagnosis:** You care most about cases where the group output differs from individual input (Question 7, Question 9). You view the group as a distinct agent that can hold beliefs or intentions no single member holds.

  ---

  ### Logical Space & Incoherent Combinations

  The scoring key above maps the *plausible* philosophical terrain. However, the logical space allows for combinations that are rarely occupied.

  *   **The "Normative Individualist" (R+, N+):** You believe joint action is just individual behavior (R+), but that doing things near each other creates binding obligations (N+).
      *   *Status:* **Unexplored/Unattractive.** If there is no "we," only "I," it is hard to ground why "I" owe "You" anything just because our actions correlated (Question 1). This view usually collapses into Deflationism.
  *   **The "Opaque Deflationist" (R+, O+):** You believe groups are just individuals (R+), but that groups can know things individuals don't (O+).
      *   *Status:* **Coherent but Rare.** This is essentially a systems-theory view (Question 7C). It is philosophically stable but often rejects the "intentionality" part of joint action, treating it as mechanical output.
  *   **The "Coercive Mesh" (R-, N-, O+):** You believe joint action requires meshing intentions (N-), but that this mesh can exist without the participants knowing it (O+).
      *   *Status:* **Incoherent.** "Meshing" implies a relation between known intentions. If the agents don't know, the intentions cannot mesh by definition. If you scored here, check Question 4 and 10.

  ### Handling Inconsistent Answer Patterns

  If your answers do not cluster into one of the five profiles above, you likely hold a **Contextualist** or **Unstable** position.

  **1. The Contextualist Split (e.g., High Normativity in Piano, Low in Duet)**
  *   **Diagnosis:** You believe the rules of joint action change based on the stakes or the relationship. You think moving a piano creates a contract, but singing a duet is casual.
  *   **Philosophical Note:** This is a defensible position (pluralism), but it requires a theory of *which* contexts trigger joint commitment. Most standard theories try to be universal.
  *   **Action:** You are not a monist. You should read up on "Scalar Intentionality" or pragmatic accounts of social norms.

  **2. The Moral/Descriptive Confusion (e.g., Riot Question 6A, but Piano Question 2B)**
  *   **Diagnosis:** You may be answering based on *moral responsibility* rather than *metaphysical action*. You want to blame the rioters collectively (6A) but protect the weak piano mover individually (2B).
  *   **Philosophical Note:** This is a common failure mode. The quiz asks "Did they do it together?" not "Who is to blame?"
  *   **Action:** Re-read Question 2 and 6. Ask yourself: "If no one is to blame, did the action still happen?" If your answer flips, you are conflating agency with accountability.

  **3. The "Group Mind" Drift (e.g., High Opacity on Market, Low on Flash Mob)**
  *   **Diagnosis:** You accept collective agency in complex systems (Markets, Wikipedia) but reject it in simple synchronized groups (Flash Mobs).
  *   **Philosophical Note:** This suggests you are interested in *Emergence* rather than *Intentionality*. You are likely closer to a Complexity Theorist than a Philosopher of Action.
  *   **Action:** Your "Joint Action" is actually "System Behavior." You may find the literature on Complex Adaptive Systems more satisfying than Collective Intentionality.

  ---

  # Blind Spots & Limitations Note

  **1. The Bratman/Gilbert Blur**
  This quiz struggles to definitively separate the "Mesh" view (Bratman) from the "Obligation" view (Gilbert) in low-stakes cases. Both agree that the Piano Movers acted together; they disagree on *why* (interlocking intent vs. joint commitment). Question 3 (The Duet) is the primary discriminator here. If you found 3A and 3C equally plausible, the quiz cannot sort you between these two. You likely accept the *phenomenology* of joint action without committing to the *normative metaphysics*.

  **2. The Group Agent / We-Mode Conflation**
  Questions 7 and 9 aim to isolate the List/Pettit "Group Agent" view (where the group has beliefs distinct from members). However, in plain language, "The community wrote the article" (We-Mode) sounds identical to "The market set the price" (Group Agent). The quiz cannot easily distinguish between a *psychological* we-mode (Searle) and a *functional* group agent (Pettit) without introducing technical scenarios about logical consistency (the discursive dilemma). If you scored high on Opacity, you are in the "Collective Realist" bucket, but the specific sub-species is undetermined.

  **3. The Coercion Boundary**
  Question 4 (Driving Instructor) tests whether joint action requires voluntary participation. However, some theories argue that *roles* constitute agency regardless of volition. If you chose 4A, you might be a Functionalist, or you might just believe the instructor was the *only* agent. The quiz treats 4A as "Opaque/Collective," but it could also indicate a "Proxy" view where one agent subsumes the other. This is a known ambiguity in the literature that the quiz reflects rather than resolves.

  **4. The "Unstable" Reader**
  As noted in the Inconsistency section, many rationalists will find themselves holding inconsistent views (e.g., Deflationary on Riots, Realist on Wikipedia). This is not a bug in your reasoning; it is a feature of the current literature. The field has not agreed on whether "joint action" is a natural kind (one thing) or a cluster concept (many things). If the quiz labels you "Unstable," you may simply be more honest about the territory than the theorists are about their maps.
