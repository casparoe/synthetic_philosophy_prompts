prompt: |-
  My friend has been settling our ethical arguments with an analogy and I want to know how far it actually carries. Her line is: moral uncertainty is just like factual uncertainty. If you're not sure whether the ice will hold, you assign a probability and act on expected value; so if you're not sure whether utilitarianism or a rights-based view or some virtue thing is true, you assign credences to the theories and pick whatever has the highest expected choiceworthiness across them. She used this last week to close a debate about a policy that risks slightly lowering average wellbeing while adding a lot of new happy lives: credences times value, whichever side of the ledger wins, stop agonizing, decision made, like it's an insurance calc.

  I don't doubt it's a real analogy, but something feels off -- the theories don't just disagree about how likely an outcome is, they disagree about what counts as an outcome and what its even worth. Can you lay out explicitly what maps onto what (a table is fine), then say where the mapping breaks, and importantly which breaks actually matter for her "just multiply and stop agonizing" conclusion versus which ones are pedantic. Also I've heard people say moral uncertainty is maybe more like bargaining between parties with incommensurable currencies than like predicting an outcome -- if the first analogy fails, does something like that do the job better, or does she get to keep her conclusion in some weaker form? Please tell me how confident you are in each part of your answer and single out the part you'd least trust yourself on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Core Question:** How far does the analogy "moral uncertainty is like factual uncertainty" carry?
      *   **Friend's Position:** Use credences in moral theories $\rightarrow$ calculate expected choiceworthiness $\rightarrow$ maximize it (like expected utility in factual uncertainty). "Stop agonizing, decision made."
