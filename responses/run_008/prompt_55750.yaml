  2.  **Analyze the "Factual Uncertainty" Analogy (Expected Value Maximization):**
      *   *Factual Case:* States of the world ($S_1, S_2...$), Probabilities ($P_1, P_2...$), Outcomes/Utilities ($U_1, U_2...$). Action $A$ is chosen if $\sum P(S_i) \times U(A, S_i)$ is maximized.
      *   *Moral Case (Metanormative View: Expected Choiceworthiness):* Moral Theories ($T_1, T_2...$), Credences ($C_1, C_2...$), Choiceworthiness ($CW_1, CW_2...$). Action $A$ is chosen if $\sum C(T_i) \times CW_i(A)$ is maximized.
      *   *The Problem:* Utilities in the factual case are usually assumed to be on a common scale (utils). Choiceworthiness across *different* moral theories is notoriously difficult to compare (intertheoretic comparison problem). Utilitarianism might measure in "hedons," Rights Theory in "violations," Virtue Ethics in "flourishing points." Can you add hedons to rights violations?

  3.  **Drafting the Mapping Table:**
