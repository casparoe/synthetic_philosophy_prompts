answer: |-
  This is a sophisticated metaethical debate. Your friend is advocating for a view known in academic literature as **Maximizing Expected Choiceworthiness (MEC)**. It is the dominant framework for moral uncertainty, championed by philosophers like William MacAskill. Your intuition that "something feels off" aligns with the primary objection to MEC: **The Intertheoretic Comparison Problem.**

  Here is the breakdown of the analogy, where it breaks, and whether the bargaining alternative saves the conclusion.

  ### 1. The Mapping: Factual vs. Moral Uncertainty

  Your friend's argument relies on a structural isomorphism between empirical risk and normative uncertainty. Here is how the variables map:

  | Feature | Factual Uncertainty (The Ice) | Moral Uncertainty (The Theory) |
  | :--- | :--- | :--- |
  | **Unknown Variable** | State of the world (e.g., Ice thickness) | Moral Truth (e.g., Which theory is correct) |
  | **Agent's Attitude** | Subjective Probability (Credence) | Moral Credence (Degree of belief in theory) |
  | **Evaluation Metric** | Utility/Value of Outcome ($U$) | Choiceworthiness of Action ($CW$) |
  | **Decision Rule** | Maximize Expected Utility ($\sum P \times U$) | Maximize Expected Choiceworthiness ($\sum C \times CW$) |
  | **Resolution** | Empirical observation (Ice holds/breaks) | Philosophical argument / Intuition / Reflection |

  **Confidence in this mapping:** **High (95%)**. This is a standard representation of the MEC framework in metaethics.

  ### 2. Where the Mapping Breaks

  The analogy holds mathematically *only if* the inputs are compatible. In factual uncertainty, we assume a single utility function (yours). In moral uncertainty, you are summing across *different* utility functions (the theories).

  **Break A: The Common Scale Problem (Intertheoretic Comparison)**
  *   **Factual:** Utility is measured in a single currency (e.g., QALYs, dollars, utils). $100 is $100 regardless of the state of the world.
  *   **Moral:** Utilitarianism measures in "hedons." Rights theory measures in "violations." Virtue ethics measures in "flourishing."
  *   **The Break:** There is no established exchange rate. Is one "rights violation" worth 100 hedons? 1,000,000? If you don't know the exchange rate, you cannot multiply credence by value and sum them.
  *   **Severity:** **Fatal.** Without normalization, the math is meaningless.

  **Break B: Cardinality vs. Ordinality**
  *   **Factual:** Expected value calculations require *cardinal* utility (magnitude matters, not just ranking).
  *   **Moral:** Many moral theories are arguably *ordinal* (Action A is better than B) or *lexical* (Rights trump utility regardless of magnitude).
  *   **The Break:** If a Rights theory says a policy is "Forbidden" (lexical veto) and Utilitarianism says it is "Excellent," you cannot average them. A 10% credence in a lexical veto should arguably stop the action, not just lower its expected score.
  *   **Severity:** **High.** It breaks the "multiply and sum" mechanic specifically.

  **Break C: The Ontology of the "State"**
  *   **Factual:** The ice exists independently of your calculation.
  *   **Moral:** Moral truths (depending on your metaethics) might be constituted by rational deliberation, not discovered like ice.
  *   **The Break:** Treating moral truth as an external state to be gambled on might be category error.
  *   **Severity:** **Pedantic.** Even if moral truth is constructed, you still face uncertainty *now*. This doesn't stop the decision procedure, even if it misdescribes the metaphysics.

  ### 3. Pedantic vs. Material Breaks

  **Which breaks matter for "Multiply and Stop Agonizing"?**

  *   **Break A (Common Scale) is Material.** If you cannot normalize the values, your friend's conclusion is mathematically incoherent. You cannot "stop agonizing" because the calculation cannot be performed. You have to agonize about how to make the theories comparable (e.g., using variance normalization or unit-fixing).
  *   **Break B (Cardinality) is Material.** If one theory uses a veto structure, expected value maximization is the wrong decision rule. You would need a different rule (e.g., "Minimize risk of violating rights").
  *   **Break C (Ontology) is Pedantic.** Whether moral truth is "out there" or "in here" doesn't change the fact that you don't know it yet. This does not undermine the pragmatic utility of the decision procedure.

  **Confidence in this distinction:** **High (90%)**. The Intertheoretic Comparison Problem is widely recognized as the central technical hurdle for MEC.

  ### 4. The Bargaining Analogy

  You mentioned: *"Moral uncertainty is maybe more like bargaining between parties with incommensurable currencies."*

  This is often called the **Parliamentary Model** (proposed by Nick Bostrom and others). Instead of calculating an average, you treat your credences as voting power or bargaining chips assigned to different "parties" (theories).

  **Does it do the job better?**
  *   **Yes:** It handles incommensurability better. Parties can trade. A Utilitarian party might trade support for a Rights-friendly policy in exchange for the Rights party supporting a high-gain Utilitarian policy later. It acknowledges that the "currencies" are different without forcing a fake exchange rate.
  *   **No:** It introduces new problems. What is the "disagreement point"? (What happens if the parties can't agree? Random chaos? Status quo?). Also, bargaining solutions (like Nash Bargaining) are sensitive to how you define the options, which can be manipulated.

  **Does your friend keep her conclusion?**
  *   **Weaker Form:** She keeps the "stop agonizing" part (there is a procedure), but she loses the "just multiply" part. Bargaining is computationally harder than multiplication.
  *   **Outcome Change:** In your specific example (policy lowering average wellbeing but adding lives), a bargaining model might yield a **compromise** rather than a maximization.
      *   *MEC (Friend):* If Utilitarianism has 60% credence, you might just do it.
      *   *Bargaining:* The "Average Utilitarian/Person-Affecting" party might veto the creation of new lives unless the "Total Utilitarian" party concedes on something else. The result might be "Don't do the policy, but invest in making the new lives happier."
  *   **Verdict:** The bargaining analogy is more robust against the "incommensurable currencies" objection, but it makes the decision *more* complex, not less. It replaces "agonizing about truth" with "agonizing about fair negotiation terms."

  **Confidence in this evaluation:** **Moderate (75%)**. The literature on moral bargaining is less developed than Expected Choiceworthiness. There is no consensus on the correct bargaining solution for moral uncertainty.

  ### 5. Confidence Summary & Least Trusted Part

  *   **Mapping Table:** 95% Confidence. (Standard philosophical taxonomy).
  *   **Identification of Breaks (Scale/Cardinality):** 90% Confidence. (These are the standard objections in the literature).
  *   **Pedantic vs. Material Distinction:** 90% Confidence. (Ontological worries rarely stop pragmatic decision theory).
  *   **Bargaining Analogy Evaluation:** 75% Confidence. (This is a niche, developing area of normative theory).

  **Part I Least Trust Myself On:**
  I am least confident in the claim that **the Bargaining Analogy necessarily prevents the "stop agonizing" conclusion.**

  *Reasoning:* While bargaining is theoretically more complex than multiplication, in practice, heuristic bargaining (e.g., "proportional voting") can be just as fast as expected value calculations. It is possible that a specific bargaining solution exists which is computationally simple and yields the same results as MEC in most non-edge cases. I am discounting the possibility that a "simple bargaining heuristic" exists that would allow your friend to keep her "stop agonizing" conclusion even if her math is technically wrong.

  ### Final Advice for the Debate
  Your friend is right that we *must* act under moral uncertainty, and treating it *structurally* like factual uncertainty is the best tool we have. However, she is wrong that the math is "just an insurance calc."

  Tell her: **"The insurance calc works only if all policies pay out in the same currency. If one theory pays in Dollars and the other in 'Souls Saved,' you can't sum them without an exchange rate. Until you define how many Souls equal a Dollar, you aren't calculating; you're guessing the exchange rate. The agonizing hasn't stopped; it just moved from the decision to the normalization."**
