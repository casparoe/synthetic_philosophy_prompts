      *   *Cons:* Requires defining a "disagreement point" (what happens if no deal is made?). Who gets how much bargaining power? (Is it proportional to credence?)
      *   *Does it save the conclusion?* It saves the "stop agonizing" part (there's a procedure), but changes the "multiply and sum" math. It might lead to compromise rather than maximization.

