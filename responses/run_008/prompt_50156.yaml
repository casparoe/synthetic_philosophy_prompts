      *   **User Persona:** Trust and Safety professional at an LLM deployment company.
      *   **Problem:** Content policies rely on exhaustive enumeration (lists of prohibited categories) rather than general principles (e.g., "refuse harm"). General principles fail (block too much or too little). Humans moderate using intuition they can't articulate.
