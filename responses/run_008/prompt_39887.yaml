prompt: |-
  so, novelist here, and I've gone down a rabbit hole. I just found out Augustine basically said every lie is a sin, no exceptions — even lying to save someone from a murderer at the door, even a tiny white lie to spare someone's feelings. Which, ok, extreme but I get that he's being consistent about it. here's my problem though: by his standard, isn't my whole job lying? My narrator tells the reader hundreds of things that never happened, I made them up deliberately, I know they're false, and I wrote them in declarative sentences. If every knowingly false statement delivered to another person is a sin, then every novel is basically a sin factory and I'm the chief liar on staff. so what's the actual move that gets fiction off the hook in Augustine's own system — is it something about the reader knowing it's made up, or did he really just have to bite the bullet and say novels are wicked too?

  (and if the answer is the reader-knows thing, I have a follow up, because my current draft has an unreliable narrator section where I *definitely* want the reader to believe something false for a hundred pages before the reveal. plus I have a scene where a real historical bishop says a line he never said — does that cross into actual deception where a made-up duchess saying it wouldn't? basically I need to know where his line is, because I'd honestly like my villain, who quotes Augustine at people constantly, to be right about the letter of the doctrine while being terrible about the spirit of it, and I don't want a reviewer pointing out I got the doctrine wrong lmao)
