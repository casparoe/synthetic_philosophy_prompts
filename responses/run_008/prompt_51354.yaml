answer: |-
  Subject: Re: Your roommate's probability argument

  Hi there,

  It is completely understandable that you are finding this argument difficult to shake, primarily because your roommate has reconstructed a version of the Reference Class Problem that is historically one of the most stubborn objections in the philosophy of probability. He is right to be smug about step four, because within the framework of strict frequentism, there is indeed no non-circular way to select the single correct reference class for an individual event. If you define probability strictly as the actual frequency of outcomes in a group, and every event belongs to infinitely many overlapping groups with different frequencies, then the probability value becomes indeterminate. However, the argument only holds together if you accept the hidden assumption that the frequency interpretation is the only game in town, or at least that any objective probability must behave like a frequency. To save quantum mechanics and keep your intuition about objectivity intact, you need to reject step one as a universal definition of probability.

  The core issue here is that your roommate is using a problem specific to actual frequencies to kill off objective chances that are not defined as actual frequencies. When you move to a propensity interpretation or a Best System analysis, the reference class problem loses its teeth. On a propensity view, the probability belongs to the physical setup of the single case itself, not to a class we group it into. The coin flip has a chance of heads because of the symmetry of the coin, the force of the flip, and the air resistance, not because we counted past flips. The physical properties of the setup determine which features are relevant, so we do not need to arbitrarily choose between April days and green coat days. The green coat is causally irrelevant to the weather, so it does not enter into the physical propensity of the atmosphere to produce rain. This allows you to deny step four without circularity, because the selection of relevant factors is done by nature's causal structure, not by our descriptive preferences.

  You mentioned you want to keep step five, and fortunately, rejecting step one allows you to do exactly that. Step five says that a quantity depending on our arbitrary grouping cannot be objective. By switching to propensities or chances, you are saying that the probability does not depend on our grouping at all. It depends on the objective physical state of the world at that moment. Therefore, the value is not a result of our choice, and it remains an objective fact. This preserves the objectivity you want while sidestepping the reference class trap. The cost of this move is metaphysical. If you reject step one, you can no longer claim that probability is just a shorthand for counting observable events. You have to accept that chances are real features of the world, perhaps irreducible dispositions or relations between laws and history. Some philosophers find this too spooky, preferring to stay with frequencies, but if you want quantum mechanics to describe reality rather than just our knowledge, you have to pay this metaphysical price.

  There is also a separate error in your roommate's moral claim that the probability of an atom decaying is strictly zero or one because it either happens or it does not. This is a modal fallacy that confuses the outcome with the chance. Probability is time-indexed. Before the hour is up, the physical setup possesses a specific chance of decay, say fifty percent. Once the hour is up and the atom has either decayed or not, the chance collapses to zero or one, but that does not retroactively change what the chance was beforehand. To say the chance was always zero or one is to assume determinism, which contradicts the standard interpretation of quantum mechanics. Your roommate is essentially arguing that because the outcome is definite after the fact, the uncertainty before the fact was merely epistemic. But in quantum mechanics, the uncertainty is ontic, meaning it is a feature of the physical state itself, not just a lack of information.

  So, if I were to advise you on where to break the chain, I would tell you to reject step one as an exhaustive account of what probability is. You can grant that frequencies are useful for estimating probabilities, but deny that they are what probability fundamentally is. This allows you to adopt a view like propensities or the Best System analysis, where the reference class problem is solved by causal relevance or by the optimization of scientific laws rather than by arbitrary grouping. This keeps step five safe because the grounding is objective, and it keeps quantum mechanics alive because it allows for single-case objective chances. The cost is that you must accept a robustly realist metaphysics where chances are part of the furniture of the universe, rather than just a tool for managing ignorance. It is a heavier philosophical burden, but it is the only way to avoid your roommate's skeptical conclusion without abandoning modern physics.

  I hope this helps you push back against the smugness. Your roommate has built a very strong cage, but he has locked himself inside it by assuming that frequentism is the only way to be a realist about science. Once you step outside that assumption, the bars dissolve. Let me know if you want to discuss how the Best System analysis specifically handles the selection of predicates, as that might give you further ammunition regarding the objectivity of the grouping.

  Best of luck with the class.
