answer: |-
  This is the correct move. You are currently fighting a metaphysical war using empirical ammunition, which is why you keep citing the same papers to different ends. The experiments (Phi, Rabbit, Libet) underdetermine the theory because the theories disagree on what the experiments are *measuring*.

  Here is the specification you asked for. I have sorted the desiderata into your three piles, evaluated your "Probe-Relativity" constraint, and flagged the joint unsatisfiabilities.

  ### Part 1: The Desiderata Specification

  #### Pile 1: Non-Negotiable (Data-Driven)
  *These are requirements imposed by the phenomena themselves. A theory that fails these does not describe the world we inhabit.*

  1.  **Phenomenological Veridicality (of the Report):**
      *   **Spec:** The theory must treat the subject's report of *what it was like* as accurate data, even if their report of *what happened in the world* is inaccurate.
      *   **Case:** In Color Phi, the subject is wrong that a dot moved and changed color mid-path. They are *not* wrong that they experienced a dot moving and changing color mid-path.
      *   **Rationale:** If you claim the subject is confabulating the *experience* itself (not just the stimulus interpretation), you render consciousness scientifically inaccessible. You cannot explain consciousness by denying its existence in the data.

  2.  **Postdictive Capacity:**
      *   **Spec:** The account must allow for neural processing at $t_2$ to determine the conscious content assigned to stimulus at $t_1$ (where $t_2 > t_1$).
      *   **Case:** Backwards masking and the Cutaneous Rabbit. The third tap determines where the second tap was felt.
      *   **Rationale:** This is a hard empirical constraint on neural latency and integration windows. Any model requiring strict feed-forward temporal locking fails here.

  3.  **Neural-Phenomenal Latency Accommodation:**
      *   **Spec:** The theory must accommodate the gap between stimulus onset and the minimal neural processing time required for awareness (typically ~100-300ms), without claiming the subject experiences a 300ms delay.
      *   **Case:** Libet-style findings and simple reaction time disparities. Subjects experience stimuli as "now," despite neural lag.
      *   **Rationale:** Physics dictates processing time; phenomenology dictates immediacy. The theory must bridge this without claiming the brain sends signals back in time.

  4.  **Report Stability vs. Variance Accounting:**
      *   **Spec:** The theory must provide a mechanism for why reports are stable in some contexts (I see a red dot) and unstable in others (Probe-Relativity cases).
      *   **Case:** If changing the probe question changes the reported content, the theory must specify whether the *experience* changed, the *memory* changed, or the *criteria* changed.
      *   **Rationale:** Ignoring report variance treats noise as signal; ignoring report stability treats signal as noise.

  #### Pile 2: Theater-Biased (Often disguised as neutral)
  *These feel like common sense, but they presuppose a singular locus or moment of "becoming conscious."*

  1.  **Determinate Onset Time:**
      *   **Spec:** There exists a specific time $t$ at which a specific content $C$ transitions from unconscious to conscious.
      *   **Bias:** Assumes consciousness is an event or a state transition with a boundary.
      *   **Risk:** Collides directly with Postdictive Capacity. If content at $t_1$ is fixed by input at $t_2$, the "onset" cannot be at $t_1$. If onset is at $t_2$, why does it feel like $t_1$?

  2.  **Content Co-Presence:**
      *   **Spec:** All contents experienced as "simultaneous" must be neurally co-present at some location/stage.
      *   **Bias:** Assumes the "specious present" corresponds to a neural processing window where data sits together.
      *   **Risk:** Neural processing is distributed and asynchronous. Demanding co-presence forces the theory to posit a "buffer" or "waiting room" which lacks anatomical evidence.

  3.  **The "Real" Version:**
      *   **Spec:** For any ambiguous report (like Probe-Relativity), there is a fact of the matter about which report matches the "true" conscious state, and others are errors.
      *   **Bias:** Assumes consciousness is a finished object that can be measured correctly or incorrectly.
      *   **Risk:** Ignores the possibility that the "state" is constituted by the probing/access mechanism itself.

  #### Pile 3: Multiple Drafts-Biased (Often disguised as humility)
  *These feel like scientific caution, but they presuppose distributed processing precludes singular experience.*

  1.  **No Privileged Locale/Time:**
      *   **Spec:** It is a category error to ask "where" or "when" consciousness happens; only "when is the report issued."
      *   **Bias:** Assumes that because neural fixation is distributed, phenomenological unity is an illusion or a narrative construct.
      *   **Risk:** Can slide into eliminativism. If there is no time it becomes conscious, does the "feeling" of it becoming conscious at a specific time get explained, or explained away?

  2.  **Confabulation Tolerance:**
      *   **Spec:** Subject reports about the *timing* of their experience are treated as narrative constructs subject to the same editing as the content itself.
      *   **Bias:** Prioritizes neural timeline consistency over introspective timeline consistency.
      *   **Risk:** If you allow too much flexibility here, you risk Pile 1 violation (Phenomenological Veridicality). At what point does "narrative editing" become "lying about what it felt like"?

  3.  **Indeterminacy Until Access:**
      *   **Spec:** Content is not "fixed" until it is accessed for report/action.
      *   **Bias:** Equates consciousness with access/reporting.
      *   **Risk:** Struggles with cases where experience seems rich but unreportable (iconic memory), or where reports vary without new access (memory drift).

  ---

  ### Part 2: The Probe-Relativity Verdict

  You asked: *Is "must not default to calling whichever report is inconvenient an illusion" a real constraint, or does (c) [no fact of the matter] already hand the game to the multiple drafts side?*

  **Verdict:** The constraint is genuine, but your formulation of option (c) is where the smuggling happens.

  Here is the breakdown:
  *   **Requirement:** "The theory must explain report variance without ad-hoc appeals to confabulation." This is **Pile 1 (Non-Negotiable)**. If your theory explains Result A by saying "Real Consciousness" and Result B by saying "Confabulation" based solely on which fits your model better, you are dogmatizing, not theorizing.
  *   **The Trap:** Option (c) ("No fact of the matter until the probe") **does** hand the game to Multiple Drafts. It presupposes that consciousness is *constituted* by the probe/access. A Cartesian Theater model *can* accept probe-relativity without accepting (c).
      *   *Theater Explanation for Probe-Relativity:* The conscious experience was fixed and determinate (say, yellowish). However, the *memory trace* is fragile. Probe A triggers a memory retrieval that preserves yellow. Probe B triggers a reconstruction that biases toward green. The *experience* was real; the *report* is a readout of a degrading memory file.
      *   *Drafts Explanation:* There was no determinate experience. The probe finalized the draft.

  **Correction to your Desideratum:**
  Do not demand "There must be a fact of the matter."
  Demand: **"The theory must distinguish between instability in the conscious content vs. instability in the memory/access of that content."**
  This forces both sides to specify *where* the variance enters the pipeline. If the Theater says it's in memory, they must show memory decay rates match the variance. If Drafts says it's in content fixation, they must show neural fixation matches the probe timing. That is a neutral, hard constraint.

  ---

  ### Part 3: Jointly Unsatisfiable Subsets (The Tensions)

  You suspected a conflict. You are right. There are two major tensions where satisfying one desideratum forces you to violate another.

  #### Tension A: Determinate Onset vs. Unbounded Postdiction
  *   **The Conflict:**
      *   If you hold **Determinate Onset** (Pile 2): Content $C$ becomes conscious at time $t$.
      *   If you hold **Postdictive Capacity** (Pile 1): Input at $t + 200ms$ can alter the qualitative character of $C$.
      *   **The Contradiction:** If $C$ became conscious at $t$, it is "fixed." If it can be altered at $t + 200ms$, it wasn't fixed at $t$. If it wasn't fixed at $t$, there was no "onset" at $t$.
  *   **Resolution Cost:**
      *   *Theater:* Must posit a "waiting period" where nothing is conscious until the window closes. This violates the subject's experience of immediacy (Pile 1: Latency Accommodation).
      *   *Drafts:* Must deny there is an "onset." Consciousness is a gradual gradient of fixation. This violates the intuition of discrete moments (Pile 2).
  *   **Status:** **Jointly Unsatisfiable** without redefining "onset" or "content." You cannot have a fixed moment of awareness *and* retroactive content modification. One must give.

  #### Tension B: Phenomenological Veridicality vs. Neural Latency
  *   **The Conflict:**
      *   If you hold **Phenomenological Veridicality** (Pile 1): When the subject says "I saw the flash at the same time as the beep," that temporal relation is real in consciousness.
      *   If you hold **Neural Latency Accommodation** (Pile 1): The flash took 100ms to process; the beep took 50ms.
      *   **The Contradiction:** For them to be experienced as simultaneous, the brain must either delay the beep (waiting for the flash) or backdate the flash (antisense masking).
      *   **The Problem:** If the brain delays the beep, there is a period where the beep is processed but not conscious (violating "Determinate Onset" if onset = processing). If the brain backdates the flash, the "time of experience" is different from the "time of neural fixation."
  *   **Status:** **Satisfiable but costly.** Requires positing a "subjective time" that is decoupled from "objective time." This is where the "Cartesian Theater" usually dies: it tries to map subjective time onto a single objective clock in the brain.

  #### Tension C: Report Stability vs. Probe-Relativity
  *   **The Conflict:**
      *   If reports are stable data points, probe-relativity looks like noise/error.
      *   If reports are probe-dependent, stability looks like an artifact of consistent probing.
      *   **The Problem:** You cannot treat reports as direct readouts of a static internal state *and* account for probe-dependence without positing a dynamic internal state that changes upon interrogation.
  *   **Status:** **Satisfiable.** Requires distinguishing *phenomenal state* from *access state*. (Though this distinction itself is controversial).

  ---

  ### Part 4: Sorting Table

  | Desideratum | Pile | Rationale for Sorting |
  | :--- | :--- | :--- |
  | **Subject reports of *qualia* are accurate** | 1 (Non-Negotiable) | Denying this makes consciousness unknowable. |
  | **Postdiction is possible (future affects past content)** | 1 (Non-Negotiable) | Empirical fact of integration windows. |
  | **Neural processing takes time (latency)** | 1 (Non-Negotiable) | Biological fact. |
  | **There is a specific time $t$ content becomes conscious** | 2 (Theater) | Assumes consciousness is an event with a boundary. |
  | **Simultaneous experience requires neural co-presence** | 2 (Theater) | Assumes phenomenological unity maps to neural synchrony. |
  | **There is a "true" report in probe-variance cases** | 2 (Theater) | Assumes experience is a fixed object independent of access. |
  | **There is no privileged place/time for consciousness** | 3 (Drafts) | Assumes distributed processing precludes singular locus. |
  | **Timing reports are narrative reconstructions** | 3 (Drafts) | Prioritizes neural timeline over introspective timeline. |
  | **Content is indeterminate until accessed/probed** | 3 (Drafts) | Equates consciousness with access/availability. |

  ---

  ### Part 5: Do the Theories Die or Bruise?

  **Cartesian Theater (Presentation Time)**
  *   **Verdict:** **Dies on Tension A (Onset vs. Postdiction).**
  *   **Why:** To save the "Showtime," the Theater must posit a delay buffer to wait for postdictive information. But if it waits, the subject should experience a delay. They don't. To fix this, the Theater must claim the brain "backdates" the experience. But if it backdates, the "Showtime" is a fiction—it's not when the content arrived, it's when the label was stamped. Once you admit the timestamp is editable, the "Theater" is no longer a place where things *happen*, just a place where things are *filed*. It collapses into Drafts.

  **Multiple Drafts (Dennett-style)**
  *   **Verdict:** **Bruises on Pile 1 (Phenomenological Veridicality).**
  *   **Why:** It survives the timing data easily. However, it constantly risks explaining away the very thing it needs to explain. If every report of "I saw it at time $t$" is treated as a narrative confabulation because the neural data says $t-50ms$, the theory risks becoming unfalsifiable. It bruises because it must walk a tightrope: admitting reports are data (Pile 1) while simultaneously claiming reports about timing are systematically misleading (Pile 3). It survives, but it looks suspiciously like it's gaslighting the subject.

  ### Final Recommendation for Your Argument

  Stop arguing about *when* consciousness happens. Argue about **what fixes the content.**

  *   If your interlocutor insists on a **Presentation Time**, ask them: *"At the moment of presentation, is the content fixated? If yes, how does postdiction change it? If no, what was presented?"*
  *   If they insist on **Multiple Drafts**, ask them: *"At what point does the draft become resistant to editing? If never, why does memory stabilize? If yes, isn't that a de facto Presentation Time?"*

  The winning move is to force them to admit that **"Consciousness" is not a noun that exists at a time, but a verb describing a process of stabilization.** The desiderata above show that demanding a "time" for a "process" is the category error driving your stalemate.
