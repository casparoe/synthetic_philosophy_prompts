answer: |-
  ### Lesson Plan: Revealed Preference and Ordinal Utility

  **1. The Dependency Order: Behavior Before Bookkeeping**
  You must teach **Revealed Preference first**, then introduce Utility as a derived bookkeeping tool.
  *   **Why:** If you introduce Utility first, you inevitably invite Misconception (a) (Utility = Happiness). Students will treat Utility as a psychological cause of action ("She chose tea *because* it gave her 10 utils"). This reverses the causal logic of modern microeconomics.
  *   **The Fix:** Start with the observable: Choice. Define Preference *as* the choice. Only after establishing that choices must be *consistent* to count as "preferences" do you introduce Utility numbers as a way to index that consistency. This prevents the tautology charge ("She chose it because she preferred it") by adding the constraint of *transitivity and consistency over time*. Utility becomes the mathematical shadow of behavior, not the mental engine.

  **2. The Carrying Example: The Crossing Budgets**
  You are correct; a single choice (Tea vs. Coffee at same price) is insufficient. It establishes a ranking but not a *structure* of trade-offs. It allows students to think the choice was arbitrary or based on a whim rather than a stable ordering.
  *   **The Design:** You need the **Weak Axiom of Revealed Preference (WARP)** logic without necessarily using the acronym immediately. You need two observations where the budget constraints cross.
  *   **Scenario A:** Prices are ($P_T=2, P_C=2$). Budget $4$. Student buys 2 Teas. (Coffee was affordable, but rejected).
  *   **Scenario B:** Prices change ($P_T=2, P_C=1$). Budget $4$. Student buys 1 Tea and 2 Coffees.
  *   **What it must contain:** In Scenario A, the unchosen option (Coffee) must have been affordable. In Scenario B, the previously chosen option (2 Teas) must still be affordable (or explicitly unaffordable to show consistency). To make it a *test* of rationality, present a Scenario C where they choose Coffee when Tea was still affordable, violating the previous revelation.
  *   **What it must lack:** Any reference to taste, caffeine needs, or "liking." The example must be sterile. If you mention "she likes tea better," you undermine the revealed preference framework.

  **3. Sequencing the Misconceptions**
  *   **Misconception (a) [Utility = Happiness]: Intercept Immediately (Minutes 0–5).**
      *   *How:* Open by explicitly banning the word "satisfaction." State: "In this room, 'Utility' is a rank, not a reservoir." If you do not kill this first, every subsequent mathematical point will be interpreted psychologically.
  *   **Misconception (b) [RP = Rational/Good]: Intercept Mid-Session (Minutes 20–25).**
      *   *How:* After establishing the WARP pattern, ask: "If a smoker chooses cigarettes over food when both are affordable, does Revealed Preference say this is 'good'?" Answer: No. It says the choice is *consistent* with their preferences, whatever they are. RP detects logical consistency, not welfare. Intercepting this too early distracts from the mechanics; too late implies you endorse the choices.
  *   **Misconception (c) [Inter-temporal Comparison]: Intercept Late (Minutes 35–40).**
      *   *How:* This must be left standing until you have fully defined Utility as ordinal. Once they accept that $U=10$ vs $U=5$ means the same as $U=100$ vs $U=50$, you strike: "So if her utility function changes scale next year, can we compare Year 1 to Year 2?" This is the climax. If you kill this early, you rob the lesson of its philosophical punch regarding the limits of economic knowledge.

  **4. The Close: The Scaling Question**
  In the final five minutes, draw two columns on the whiteboard.
  *   **Column A:** Bundle X = 10 utils, Bundle Y = 5 utils.
  *   **Column B:** Bundle X = 1,000 utils, Bundle Y = 900 utils.
  *   **The Question:** "I use Column A to predict her choice. You use Column B. Do we predict different behaviors? If not, why are we allowed to say she is 'happier' in Column B than in Column A?"
  *   **Success Criteria:** They must answer that the prediction is identical (X is chosen) because only the *ordering* matters, and therefore the statement "she is happier" in Column B is meaningless noise.

  **5. Declined Topics**
  *   **Topic:** **Interpersonal Utility Comparisons.**
  *   **Reason:** This is the direct logical consequence of ordinal utility. Since we establish that utility numbers are arbitrary indices for *one* person, comparing indices *between* people is logically impossible, not just difficult. (The "Utility Monster" is a normative ethics critique that presupposes cardinal utility, which you are already rejecting; banning Interpersonal Comparisons kills the Monster implicitly).

