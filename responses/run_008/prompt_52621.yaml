answer: |-
  This is a splendid test case. Cold fusion is essentially a stress test for social epistemology because it compresses a decades-long scientific controversy into a few months of high-drama public failure. It forces us to confront how trust is allocated when the stakes are high, the expertise is opaque, and the institutional norms are breached.

  Here is the analysis, disciplined according to your four points, followed by a take on your 'reductionism-in-fact' hypothesis.

  ### 1. Mapping the Testifiers and Hearers

  The chain of testimony here is layered, and each layer stresses the theories differently.

  **The Layers:**
  1.  **Nature to Instrument:** The physical phenomenon (excess heat) causes a reading on a calorimeter.
  2.  **Instrument to Pons & Fleischmann (P&F):** The scientists read the instrument.
  3.  **P&F to Each Other:** They verify notes and procedures internally.
  4.  **P&F to the World:** The press conference (bypassing journals).
  5.  **The World to the Layperson:** News reports summarising the press conference.

  **The Instrument Problem:**
  You ask if the instrument reading makes this friendly to anti-reductionism. If we treat the instrument as a testifier, anti-reductionism says we have a default entitlement to trust it unless we have a defeater. But instruments aren't agents; they don't have sincerity conditions. A reductionist would say trusting an instrument requires knowing its calibration and theory of operation (non-testimonial grounds).

  However, for everyone except the technician calibrating the machine, the instrument reading *is* testimony. You are trusting P&F's report that the instrument said X.
  *   **Anti-Reductionist View:** This case is actually hostile to anti-reductionism here. If testimony has default entitlement, the public should trust the instrument readings reported by P&F until defeated. They did, initially. But the instrument was wrong (or misread). Anti-reductionism struggles to explain why the *source* (a machine read by an expert) was so fragile without importing reductionist checks (calibration logs).
  *   **Reductionist View:** Science is always like this, but nobody admits it. We rely on chains of testimony. The reductionist insists that for the layperson to be justified, they need independent reasons to trust the chain. Since they can't check the calorimetry, they must trust the *process* that usually validates such instruments.

  **Verdict:** The case reveals that all science is testimonial all the way down. Anti-reductionism fits the *flow* of trust (we just believe labs), but Reductionism fits the *failure mode* (the trust was unjustified because the checks weren't in place).

  ### 2. The April 1989 Entitlement

  **The Scenario:** A scientifically literate layperson in April 1989. P&F are Fellows of the Royal Society. No replication failures yet.

  **Anti-Reductionist Prescription:**
  You have a default entitlement to believe sincere experts. There are no known defeaters (no failed replications yet). Therefore, you are justified in believing cold fusion is real, perhaps with a modicum of caution proportional to the extraordinariness of the claim.
  *   *Fit:* This matches the actual behaviour of that spring. Many people thought, "Well, they're serious chaps, perhaps they've found something."

  **Reductionist Prescription:**
  You cannot verify the calorimetry. You have no non-testimonial reason to believe fusion is happening at room temperature (it contradicts established physics). Therefore, you must suspend judgement. Your trust must trace to grounds you can access; since you can't access the data, you can't justify the belief.
  *   *Fit:* This matches the behaviour of the physicists at the American Physical Society meeting shortly after. They said, "Show us the data," effectively demanding reductionist grounds.

  **Which got it right?**
  Historically, the 'provisional belief' strategy worked best *provided* it was coupled with rapid updating. The layperson who believed in April and updated in May when replications failed was epistemically efficient. The layperson who suspended judgement in April and updated in May gained nothing but saved face.
  *   *Theory Limit:* Both theories struggle with the *degree* of belief. They often speak in binaries (justified/unjustified). Anti-reductionism explains the initial 'yes' better. Reductionism explains the subsequent 'no' better.
  *   *The Natural Move:* The rational move was 'trust the institution, not the men'. Since the institution (peer review) hadn't spoken, the reductionist demand for 'non-testimonial grounds' should have been met by 'wait for the journal'. The anti-reductionist default should have been weaker because the 'expert' status is partly constituted by adherence to norms (which they broke).

  ### 3. Where Each Theory Goes Silent

  **Reductionism's Silence:**
  Strict reductionism paralyses the layperson. If you must have non-testimonial grounds for every claim, you cannot believe anything in frontier science. You cannot check the maths, you cannot run the lab.
  *   *The Gap:* It forces the layperson to trust the *system* of science rather than the *claim*. But if the justification for trusting the system is itself based on testimony (history of science working), are we not just pushing the buck back? Reductionism risks becoming vacuous if the 'non-testimonial ground' is just 'induction from past testimony'.

  **Anti-Reductionism's Silence:**
  It explains why we trusted P&F initially, but it struggles with the *press conference* variable. Why does skipping peer review matter so much?
  *   *The Defeater:* Anti-reductionism says trust is default unless defeated. Is 'skipping peer review' a defeater? If yes, why? It's not evidence the claim is false; it's evidence the *process* was bypassed.
  *   *Institutional Mediation:* You hit the nail on the head. If skipping the journal defeats the entitlement, it implies the entitlement was never to the *person* (P&F) but to the *role* (Peer-Reviewed Researcher). This suggests the default entitlement is mediated by the institution.
  *   *The Sneak:* This looks like a reductionist point wearing anti-reductionist clothes. It says, "I trust you by default *because* you are vetted by a system I trust." That 'because' is a reductionist reason (positive reason to trust the system). Pure anti-reductionism would say, "I trust you because you are a testifier, full stop." Cold fusion shows we don't do that; we trust testifiers within institutions.

  ### 4. "Argument Screens Off Authority"

  **Is it Reductionism in a Trench Coat?**
  Yes, broadly speaking. It demands that the content (the argument/data) carries the justificatory weight, not the source (the authority). This is the core reductionist intuition: the truth of $p$ depends on the evidence for $p$, not the status of $S$.

  **Does it Survive Cold Fusion?**
  It survives remarkably well.
  *   **The Screening:** When the calorimetry arguments (replication attempts) came in, they completely screened off the authority of P&F. Their status as Fellows of the Royal Society became irrelevant once the data failed to replicate.
  *   **The Epistemic Loss:** The people who lost out were those who let authority *override* the argument. There were supporters who claimed the failure to replicate was due to 'competence' issues in other labs, clinging to the authority of P&F against the weight of the negative arguments.
  *   **The Nuance:** However, 'argument' here includes the argument from *consensus*. The fact that the broader community rejected the claim is itself an argument (a social one). If your slogan means "check the primary data yourself," it fails for laypeople. If it means "evaluate the available reasons, including social evidence," it holds.

  The slogan works because cold fusion demonstrates that authority is a heuristic for where the argument *usually* lies, but when the argument becomes visible (failed replications), the heuristic must yield. Those who didn't let it yield were being dogmatic, not rational.

  ### 5. Reductionism-in-Principle vs. Reductionism-in-Fact

  Your final distinction is the most fruitful way to resolve the tension. Let's call it **Systemic Reductionism**.

  **The Hypothesis:**
  We trust testimony not because of a default entitlement (Anti), nor because we personally verify every claim (Individual Reductionism), but because the testimony is embedded in a system that *could* verify it (Systemic Reductionism).

  **Does Cold Fusion Support This?**
  Yes, emphatically.
  1.  **The Breach:** P&F failed because they bypassed the checking system (peer review). The epistemic community punished them not necessarily because they were wrong (science allows error), but because they bypassed the filter that legitimises trust.
  2.  **The Correction:** The system worked. Other labs attempted replication (the checking mechanism). They failed. The DOE review (the audit) concluded nothing was there. The system corrected the error.
  3.  **The Layperson's Justification:** A layperson in April 1989 was justified in trusting the *possibility* because the system was engaged (labs were checking). They were justified in rejecting the *claim* in May 1989 because the system outputted a negative result.

  **Is it Sneaky Anti-Reductionism?**
  No. It is not smug rationalism masking as default trust.
  *   **Anti-Reductionism** says: "Trust unless given a reason not to."
  *   **Systemic Reductionism** says: "Trust because there is a reason to believe the system catches errors."

  The difference is crucial. If cold fusion had *worked*, but the system had rejected it (a conspiracy), the Anti-Reductionist might still trust P&F (sincere experts). The Systemic Reductionist would trust the system's consensus over the individual, because the justification lies in the *reliability of the process*, not the sincerity of the agent.

  Cold fusion shows that the 'authority' we trust is not the person, but the institution. When the person steps outside the institution, the authority vanishes. This supports your 'reductionism-in-fact' view: we act *as if* we are anti-reductionists (trusting experts by default), but our trust is actually contingent on the existence of a reductionist infrastructure (replication, review) that validates that trust.

  **Conclusion**
  Your instinct serves you well. "Argument screens off authority" is the correct heuristic, provided you recognise that in modern science, the 'argument' is often a social product (consensus of replications) rather than a logical proof you can check yourself. Cold fusion validates the view that testimony is justified by the *reliability of the network* producing it, not merely the status of the speaker. The tragedy of Pons and Fleischmann was not that they were wrong (error is human), but that they tried to privatise a public epistemic good. They asked for trust without submitting to the system that makes trust rational.

  In British terms: they tried to skip the queue and demand a knighthood before doing the service. The community was right to show them the door.
