  *(Self-Correction on "Diagnosis First"):* The prompt says "dont just dump everything you know about Turing, diagnosis first." But it also says "maybe do some visible brainstorming before you commit to a diagnosis." I will interpret this as: Start with the brainstorming process that *leads* immediately into the diagnosis, rather than a long historical preamble. The diagnosis should be the headline of the thinking.

