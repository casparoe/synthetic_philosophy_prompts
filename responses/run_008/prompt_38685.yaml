answer: |-
  You have put your finger on the central tension in modern labour law. The pattern you describe is not an accident, nor is it merely hypocrisy. It is the logical outcome of a specific, dominant theoretical framework that most rich democracies quietly adopted after the Second World War.

  To understand why the law protects the *existence* of the strike while hamstringing its *effect*, we must reconstruct the buried theory.

  ### The Dominant Theory: Contained Economic Conflict

  The prevailing theory in most rich democracies (particularly the UK, Germany, Canada, and to a large extent the US) is not that a strike is a fundamental human right akin to free speech, nor is it simply a tolerated breach of contract. Instead, it is treated as a **statutory immunity within a regulated market for labour.**

  This view is often called "Industrial Pluralism" or the theory of "Managed Conflict." Its core presuppositions are:

  1.  **The Strike is an Economic Weapon, Not a Political Right:** The law views the strike as a tool for wage discovery and dispute resolution within a specific employment relationship. It is analogous to a lockout by the employer. Both are economic pressure tactics designed to force the other side back to the negotiating table.
  2.  **The Goal is Settlement, Not Victory:** The legal framework is designed not to help workers win, but to force a compromise. If a strike is too effective, the employer collapses and there is no deal. If it is too weak, the employer ignores the workers. The law attempts to calibrate the pain so that both sides find it cheaper to settle than to fight.
  3.  **Third-Party Protection (The Containment Principle):** This is the crucial bit. The state grants immunity from lawsuits (for breach of contract or tort) only so long as the damage is contained between the employer and the employees. The moment the conflict spills over to "neutrals" (other companies via secondary action) or the "public" (essential services), the immunity is revoked.

  **How this explains the patchwork:**

  *   **Ballots and Notice:** These are not about democracy; they are about **control**. The state needs to know when a strike is coming to prepare for disruption, and the union leadership needs a mandate so they can credibly promise to end the strike when a deal is reached. A wildcat strike is unpredictable; a balloted strike is a negotiable variable.
  *   **Bans on Secondary Action:** Under the "Contained Conflict" theory, a dispute between a builder and a developer is private. If electricians strike to support the builders, they are dragging a neutral party into a private feud. This is treated less like solidarity and more like a market distortion or a tortious interference with another firm's contracts.
  *   **Essential Services:** Here, the state's interest in public order trumps the economic bargaining right. The theory holds that you cannot hold the public hostage to leverage a private wage dispute.
  *   **Permanent Replacement (US):** This fits the "Economic Weapon" theory perfectly. If the strike is a weapon for the worker, the lockout or replacement is the counter-weapon for the employer. The law remains "neutral" by allowing both sides to inflict economic pain, rather than protecting the worker's specific job seat.

  ### Where the Theory is Underdetermined

  You asked where the practice doesn't tell us which theory is at work. There are two significant areas where the "Contained Conflict" theory overlaps with others, making the true motivation ambiguous.

  **1. The Ballot Requirement**
  *   *Theory A (Democracy):* Workers should not be coerced into striking by union bosses; a vote ensures legitimacy.
  *   *Theory B (Bureaucratic Control):* The state wants union leadership to be accountable so they can be held responsible for calling the strike off.
  *   *The Ambiguity:* The law requires the vote, but often sets the threshold high enough that it functions as a barrier to entry. We cannot tell from the rule alone whether the state cares more about individual worker consent or about ensuring only "serious" (i.e., manageable) strikes proceed.

  **2. Essential Service Restrictions**
  *   *Theory A (Public Safety):* People will die if trains or hospitals stop.
  *   *Theory B (Economic Stability):* Certain sectors are so leveraged that a strike gives workers monopoly power over the economy.
  *   *The Ambiguity:* In many jurisdictions, "essential" is defined broadly (sometimes including transport or education). This suggests the restriction is as much about preventing economic leverage as it is about immediate physical safety, but the law justifies it using the language of safety.

  ### The Counterfactual: Rebuilding on a "Political Speech" Model

  If a country were to rebuild its strike law on the rival view—that striking is a form of **political expression and fundamental liberty**—the concrete changes would be radical. This view treats the withdrawal of labour not as an economic bargaining chip, but as an exercise of autonomy and collective voice, similar to protesting in a public square.

  Here is what would have to change:

  **1. Abolition of Pre-Strike Ballots**
  If striking is speech, requiring a secret ballot with state supervision is a "prior restraint." You do not need a vote to hold a placard or write an article. The decision to strike would return to the picket line or the shop floor. The state would have no role in scrutinising the mandate.

  **2. Legalisation of Secondary Action**
  In free speech law, you are allowed to protest in solidarity with others. If I can march for climate justice, I can march for a striking nurse. Under a speech model, banning sympathy strikes would be viewed as unconstitutional viewpoint discrimination. The "containment" principle would vanish; the right to disrupt would extend to supply chains and partner firms.

  **3. Essential Services would face "Time, Place, and Manner" Restrictions only**
  You cannot ban speech because it is annoying or disruptive. You can only regulate *how* it is done. In a speech model, you could not ban hospital workers from striking outright. Instead, you would have to negotiate "minimum service levels" that are truly minimal, or the state would have to provide temporary cover that does not undermine the leverage of the strike. The burden of proof would shift: the state would have to prove why a strike *must* be limited, rather than workers proving why it should be allowed.

  **4. Protection from Replacement and Dismissal**
  If striking is a constitutional right, firing or permanently replacing a striker is akin to firing someone for their political views. The "economic weapon" logic (employer fights back) would be replaced by a "rights" logic (employer must endure). The job would be held open as a matter of right, not merely as a matter of statutory grace.

  **5. Expansion of Scope**
  Currently, strikes must be "in contemplation or furtherance of a trade dispute" (i.e., about pay and conditions). Under a speech model, workers could strike over foreign policy, climate change, or government austerity, even if their own employer had no control over those issues. The strike becomes a general tool of civic participation, not just a wage negotiation tactic.

  ### Summary

  The pattern you have identified presupposes that the strike is a **dangerous exception to the normal rule of contract**, granted only to facilitate a specific economic function (collective bargaining) and revoked the moment it threatens the broader social order.

  The law is coherent if you accept that the state's primary interest is **industrial peace**, not worker power. It protects the strike enough to ensure workers have a seat at the table, but restricts it enough to ensure they cannot overturn the table.

  If you shifted to the **political speech** model, you would no longer be regulating an economic market. You would be protecting a civil liberty. The strike would become less predictable, more disruptive, and far more potent, but it would also lose its privileged status as a negotiated part of the economic machinery and become a raw exercise of democratic power. The current law tries to have it both ways: it wants the legitimacy of a right without the disruption of a revolution.
