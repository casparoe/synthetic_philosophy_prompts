prompt: |-
  My lab has been arguing about the unilateralist's curse for weeks and I think one of us has accidentally derived that whistleblowers are almost always in the wrong. Setup for anyone who needs it: there's a paper by Bostrom, Douglas, and Sandberg (2016, Social Epistemology) about a principle of conformity. A piece of research is net-harmful to publish. N equally competent researchers each make their own noisy, unbiased estimate of whether publishing is a good idea, and the paper gets out if even one of them says yes — that's the unilateralist structure, any single yes is a yes. If each researcher has a 10% chance of erring on the optimistic side, then with 20 researchers the harmful result gets published with probability 1 - 0.9^20, roughly 88%. The action happens way more often than any individual's error rate, and it gets worse the more people are in the pool. Their remedy is a principle of conformity: when an action is unilateralist in this way and the others in your reference class have each declined it, you should decline too, unless you have reason to think your judgment is better than the group average.

  Here's the argument my labmate built on top of that, which we can't agree on how to break:

  (1) Principle of conformity (PC): if an action is unilateralist-structured and your epistemic peers have declined it, don't act unless you have reason to believe your judgment is better than the group average.

  (2) "Reason to believe your judgment is better" cannot include how confident you feel. The whole engine of the curse is that individual confidence doesn't track the group-level error rate — the researcher who errs optimistically feels exactly as right as the one who judges correctly. If felt certainty counted as a qualification, the curse argument would never get started, since every overoptimist would exempt themselves. So the exemption has to be externally checkable: superior track record, genuinely private information, demonstrably better training.

  (3) Now take the cases we actually use to teach moral courage: a whistleblower who is one of forty employees who all saw the same documents and all stayed quiet; a scientist whose warning got dismissed by equally qualified colleagues; the first member of an unjust institution to resign publicly. In these cases the dissenter typically has nothing that satisfies (2) — average credentials, shared information, no special track record. Their evidence that they're right is just that they've thought it over and it seems obvious, which is precisely what (2) rules out.

  (4) The peers' silence in those cases is exactly the "declined to act" that triggers PC. Model the other thirty-nine employees as making noisy unbiased estimates of whether whistleblowing is net-good, and PC applies with full force: don't blow the whistle.

  (5) So PC condemns every lone dissenter without external marks of superiority — which is nearly every dissenter we celebrate.

  (6) Therefore either our moral exemplars were behaving irrationally (and we should tell students the whistleblower did wrong unless she happened to have elite credentials), or something in the derivation of PC doesn't survive contact with the whistleblower case.

  She takes (6) to mean the curse argument proves too much and there's a hidden asymmetry assumption in there somewhere, but she can't name it and honestly neither can I. For what it's worth, I want to keep PC in some form — for decisions like publishing dangerous results or deploying AI systems it feels exactly right, and the math is genuinely scary — but I also really don't want to bite the whistleblower bullet. So maybe I'm motivated to find a flaw that isn't there. It also occurred to me that maybe the flaw is mine, not the argument's: maybe I'm misdescribing the principle, or the curse was never meant to stretch from empirical disagreement (is this result net-harmful?) over into cases where the peers have obvious reasons to stay quiet that have nothing to do with their estimates. If the whole framing is confused, or if the task as I've posed it can't be done because the answer depends on facts about the real paper I've garbled, just say so plainly — don't fix it politely for me.

  Walk me through it: which premise or step do you reject, why did it look fine, and what does rejecting it cost elsewhere? Then follow the prose with a JSON object with these fields: "type" (either "invalid_step" if there's a subtle flaw in the chain, or "valid_hard_choice" if the reasoning holds and the real question is which plausible premise to give up), "reject_step" (the integer of the premise or step you reject, or null if it's a step between premises), "diagnosis" (one or two sentences on why the rejected step looked fine but isn't, or why it's least costly to drop), "cost" (what giving it up commits you to elsewhere), "kept_premises" (array of the premise numbers you'd keep), "objections" (array of strings flagging anything in how I set up the problem that's off, empty array if nothing), and "confidence" (a number between 0 and 1). If your prose answer and your JSON disagree anywhere, the JSON is allowed to win, but say so.
reasoning: |-
  The user is asking me to analyze an argument about the "unilateralist's curse" and whether it incorrectly condemns whistleblowers. This is a sophisticated philosophical argument that builds on Bostrom, Douglas, and Sandberg's 2016 paper.

  Let me work through the argument carefully:

  **The Original Unilateralist's Curse (Bostrom et al. 2016):**
  - N researchers independently assess whether publishing a paper is net-beneficial
  - Each has some error rate (say 10% chance of being too optimistic)
  - Paper gets published if ANYONE says yes (unilateralist structure)
  - Result: harmful papers get published much more often than individual error rates suggest
  - Remedy: Principle of Conformity (PC) - if your peers have declined to act, you should too, unless you have reason to think your judgment is better than average

  **The Labmate's Extension to Whistleblowing:**
  1. PC applies to unilateralist structures where peers have declined
  2. "Reason to believe judgment is better" can't include subjective confidence (since overconfident people feel confident too)
  3. Typical whistleblowers don't have externally verifiable superiority (same credentials, same information, no special track record)
  4. Peer silence = "declined to act" triggering PC
  5. Therefore PC condemns most whistleblowers
  6. Either whistleblowers are irrational OR something is wrong with the argument

  **Where I think the argument goes wrong:**

  The key issue is **Premise (4)** - modeling the other employees as making "noisy unbiased estimates of whether whistleblowing is net-good."

  This is the hidden asymmetry. In the original unilateralist's curse:
  - All researchers are trying to answer the SAME question: "Is publishing this paper net-beneficial?"
  - They all have the same incentives and face the same decision structure
  - Their silence genuinely reflects their independent judgment on that question

  In whistleblower cases:
  - Colleagues who stay quiet often aren't making the same calculation at all


  - They face different incentives (job security, retaliation, career damage)
  - Their silence may reflect prudential concerns, not epistemic judgment about whether the wrongdoing deserves exposure
  - The "reference class" of epistemic peers is not actually a reference class of people making the same judgment under comparable conditions

  The Principle of Conformity requires that your peers are making independent judgments on the same question under similar conditions. But in whistleblower scenarios, colleagues who stay silent often aren't making independent epistemic judgments—they're responding to different incentive structures, fear of retaliation, or organizational pressure. Their silence doesn't represent independent epistemic assessment the way researcher silence does in the original curse scenario.

  There's also a distinction between empirical questions (will this publication cause harm?) and normative questions (is this wrongdoing serious enough to warrant personal risk?). The unilateralist's curse works better for the former than the latter.

  I think Premise (4) is where the argument breaks down. It assumes peer silence reflects independent epistemic judgment about net-good, but in whistleblower cases, silence often reflects prudential calculation, fear, or different incentive structures—not the same kind of independent assessment the curse requires.

  Rejecting (4) means PC still applies to cases like dangerous research publication where peers genuinely make independent assessments, but doesn't automatically extend to whistleblowing where peer silence has different explanations. This preserves PC for its intended domain while avoiding the whistleblower bullet.

  I could also challenge Premise (2) about what counts as "reason to believe judgment is better"—moral conviction based on careful reasoning might qualify even without external markers. But that's harder to defend since overconfidence is real.

  Premise (4) is the cleaner rejection. The cost is needing to distinguish when peer silence reflects genuine epistemic judgment versus other factors, which requires case-by-case analysis but seems necessary anyway.

  I'm confident this is the right move—the argument's flaw is treating all peer silence as epistemically equivalent when the unilateralist's curse specifically requires peers making independent judgments on the same question under comparable conditions.
answer: |-
  ## The Flaw Is in Premise (4)

  Your labmate's argument is sophisticated, but it smuggles in an assumption that looks innocent until you examine the original curse setup closely. **Premise (4) is where the derivation breaks.**

  ### Why (4) Looked Fine

  It seems natural to model the 39 quiet employees as making "noisy unbiased estimates" parallel to the researchers in Bostrom et al. After all, they all saw the same documents. If they declined to blow the whistle, that's their judgment that whistleblowing isn't net-good, right?

  This looked fine because the unilateralist's curse *does* work on exactly this model for its intended cases. When 20 researchers independently assess whether publishing a dangerous finding is worthwhile, their silence genuinely reflects independent epistemic judgments on the same question under comparable conditions.

  ### Why (4) Isn't Fine

  The Principle of Conformity requires your reference class to be **epistemic peers making independent judgments on the same question under comparable incentive structures**. In the original curse:
  - All researchers face the same decision (publish/don't publish)
  - All bear similar costs/benefits from the outcome
  - Silence reflects their actual judgment about net-benefit

  In whistleblower cases, colleague silence often reflects **different calculations entirely**:
  - Fear of retaliation (prudential, not epistemic)
  - Career preservation (different incentive structure)
  - Hope that someone else will act (free-rider problem)
  - Organizational pressure or loyalty norms

  Their silence isn't independent epistemic judgment that "whistleblowing is net-bad." It's often "whistleblowing is net-good *for society* but net-bad *for me*." The unilateralist's curse model doesn't apply when peers aren't actually answering the same question you are.

  ### What This Costs

  Rejecting (4) means you can't apply PC mechanically. You must first verify that peer silence reflects genuine independent epistemic judgment rather than divergent incentives, fear, or coordination failures. This requires case-by-case analysis instead of a clean rule. But that's actually correct—the original paper never claimed PC applies when the reference class condition fails.

  ### What You Keep

  You preserve PC for its intended domain (dangerous research publication, AI deployment decisions) where peers genuinely make independent assessments under comparable conditions. You avoid condemning whistleblowers whose colleagues stayed quiet for reasons unrelated to epistemic judgment about the wrongdoing itself.

