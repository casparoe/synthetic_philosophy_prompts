      *   *Nuance on Asymbolia:* Be careful not to say asymbolics feel *no* pain. They feel the sensation but lack the *suffering*. The classmate calls the sensation the "blare." I need to point out that if the suffering is gone, the "blare" (as defined by unpleasantness) is arguably gone too, leaving only the "sensor data."
