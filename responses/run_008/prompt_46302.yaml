  Here is an audit of the coherence of your six theses, ranked by the severity of the tensions identified.

  ### 1. The Explanation vs. Scope Tension: (3) and (5)
  **Severity: High**

  *   **The Tension:** Thesis (3) makes a universal explanatory claim: "The wrong in blame without standing is best explained on the model of unfairness [hypocrisy/exemption]." Thesis (5) posits a category of standing loss (manipulation) that explicitly *excludes* hypocrisy ("even when the blamer is no hypocrite"). If (5) is true, (3) is false as a general explanation. Manipulative blame is wrongful due to *instrumentalization* or *deception*, not necessarily the *unfair exemption* described in (3).
  *   **What Would Have to Give:** You must either abandon the claim that manipulation causes standing loss (drop 5) or abandon the claim that unfairness/exemption is the *general* explanation for standing loss (qualify 3).
  *   **The Cost:**
      *   *Dropping (5):* You lose a significant theoretical contribution. Expanding standing beyond hypocrisy is a major move in contemporary literature; cutting it retreats to a more traditional, narrower view.
      *   *Qualifying (3):* You lose the elegance of a unified theory. You admit that "standing" is a placeholder for at least two distinct normative problems (hypocrisy and manipulation) with different explanations.

  ### 2. The Diagnosis vs. Cure Tension: (3) and (4)
  **Severity: Moderate-High**

  *   **The Tension:** Thesis (3) diagnoses the wrong as *treating oneself as exempt* from a demand one presses on others (flouting the standard). Thesis (4) offers a cure: sincere acknowledgment of fault *without changing conduct*. If the wrong is *flouting* the standard (acting as if it doesn't bind you), merely *naming* the flouting while continuing to flout does not logically repair the exemption. You are effectively saying, "I am violating this rule, you should not," which maintains the practical exemption even if the verbal claim to moral superiority is withdrawn.
  *   **What Would Have to Give:** You must either require conduct change for recovery (restrict 4) or change the explanation of the wrong to focus on *dishonesty* rather than *exemption* (restrict 3).
  *   **The Cost:**
      *   *Restricting (4):* You make standing harder to recover. This aligns better with the "unfairness" model but loses the nuance that moral repair can begin with speech before behavior catches up.
      *   *Restricting (3):* You weaken the moral gravity of the hypocrisy charge. If acknowledgment alone fixes it, the wrong was likely about *pretense* rather than *exemption*.

  ### 3. The Conduct Definition Tension: (2) and (5)
  **Severity: Low-Moderate**

  *   **The Tension:** Thesis (2) states standing is lost *only* through the blamer's conduct, "paradigmatically culpably doing the very thing one blames another for." Thesis (5) introduces manipulation as a cause of standing loss. While manipulation is "conduct," it is not the *paradigmatic* conduct described in (2) (i.e., matching the target's violation).
  *   **What Would Have to Give:** You need to clarify whether "conduct" in (2) covers communicative intent (manipulation) or only substantive moral violations (hypocrisy).
  *   **The Cost:**
      *   *Broadening (2):* The term "conduct" becomes very broad, potentially swallowing all normative defects.
      *   *Narrowing (5):* You risk implying manipulative blame isn't a standing issue but a different kind of wrong.

  ---

  ### Recommendation for Maximum Coherence

  **The Single Revision:** **Qualify Thesis (3).**

  **Current (3):** "The wrong in blame without standing is best explained on the model of unfairness..."
  **Revised (3):** "The wrong in **hypocritical** blame without standing is best explained on the model of unfairness..."

  **Why this restores the most coherence:**
  1.  **Resolves Tension #1 (3 vs. 5):** It instantly removes the contradiction between your explanation and your expansion. You can now maintain that hypocrisy is explained by *unfairness/exemption* (3) while manipulation is explained by *instrumentalization* (5), without claiming (3) explains both.
  2.  **Mitigates Tension #2 (3 vs. 4):** By restricting (3) to hypocrisy, you align it with (1). Regarding (4), it becomes more plausible that *acknowledgment* repairs the specific wrong of *hypocritical exemption* (by admitting you are not exempt from the judgment of the norm) even if conduct lags, whereas this would be insufficient for other standing defects.
  3.  **Preserves Theoretical Value:** It allows you to keep the ambitious claim in (5) (which you suspected was weak, but is actually defensible if decoupled from the hypocrisy explanation) without forcing your core explanation of hypocrisy to do too much work.

  This revision turns your position from a potentially contradictory unified theory into a robust, bifurcated theory: one account for the hypocrisy standing (grounded in fairness) and a separate account for manipulative standing (grounded in authority/intent), both under the umbrella of normative status (6).
