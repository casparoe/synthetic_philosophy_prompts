answer: |-
  Your intuition is spot on. Your roommate has constructed a *reductio ad absurdum* without realizing it. If the argument proves that *every* act of belief is unjust, it renders the concept of "injustice" useless (if everything is unjust, nothing is).

  To save Fricker's framework without accepting the paralyzing conclusion, you should **reject Step (3)**.

  Here is the breakdown of why (3) is the failure point, how to modify (5) to save its psychological insight, and what cost this exacts.

  ### The Failure Point: Step (3)
  > *(3) Those identity-based influences count as prejudice in the relevant sense, since they're not evidence about the specific claim being made.*

  This step commits an equivocation on the word **prejudice**.

  **1. Influence $\neq$ Prejudice**
  Fricker does not define testimonial injustice as *any* time social identity influences credibility. She defines it as when identity influences credibility **negatively** due to **unwarranted stereotypes**.
  *   **Heuristics vs. Prejudice:** Human cognition uses identity markers as heuristics for reliability. If I hear a speaker with a specific accent associated with a region I know well, I might grant them higher credibility on local geography. That is identity-based, but it is not *prejudice* in the normative sense; it is a rational (though fallible) inference about their likely expertise.
  *   **The "Negative" Condition:** Fricker focuses on *credibility deficits*. If identity influences me to believe you *more* (positive prejudice), Fricker acknowledges this is problematic, but the primary ethical harm she tracks is the *deflation* of credibility. Step (3) ignores the directionality of the influence.
  *   **The "Unwarranted" Condition:** For Fricker, prejudice is a judgment "resistant to counter-evidence." If I doubt a speaker because their identity correlates with a lack of expertise in a specific domain (e.g., asking a random passerby vs. a uniformed engineer about train schedules), that is an identity judgment, but it is *warranted*. It only becomes prejudice if I assume the passerby is incompetent *despite* evidence to the contrary, solely due to their class or race.

  **2. Evidence of Reliability vs. Evidence of Truth**
  Step (3) claims identity markers are "not evidence about the specific claim." This is true, but irrelevant. Testimonial credibility is not about evidence for the *claim*; it is about evidence for the *speaker's reliability*.
  *   Social identity can sometimes track reliability (e.g., institutional affiliation, professional dress).
  *   Fricker's point is that *prejudice* distorts this tracking. It makes us treat identity as a proxy for reliability *when it is not*, or weigh it *too heavily* against actual evidence.
  *   By claiming *all* identity influence is prejudice, your roommate erases the distinction between **rational profiling** (using social cues to gauge expertise) and **prejudicial stereotyping** (using social cues to dismiss knowledge).

  ### Modifying Step (5)
  You mentioned you want to hang onto (5). You can keep the **descriptive** core of (5) while rejecting its **normative** conclusion.

  *   **Keep:** "Nobody can fully screen those influences out." (This is psychologically accurate; implicit bias is ubiquitous.)
  *   **Reject:** "...essentially every credibility judgment across social difference involves testimonial injustice."

  **The Revision:** "Nobody can fully screen those influences out, so we are all *vulnerable* to testimonial injustice, but vulnerability is not the same as culpability."

  Fricker is a virtue epistemologist. She believes justice is a **character trait**, not a state of purity. You commit testimonial injustice not because bias *exists* in your cognition, but because you fail to **correct** for it. If you are aware of your biases and actively adjust your credibility judgments to compensate, you are exercising the virtue of *testimonial justice*, even if the underlying bias remains.

  ### The Cost of Rejecting (3)
  If you reject (3), you avoid the paralyzing conclusion, but you pay a price. Here is what you lose:

  **1. You lose "Structural Innocence"**
  Your roommate's argument offers a strange comfort: "If everything is unjust, I am not uniquely bad." By rejecting (3), you accept that some judgments *are* just and some *are* unjust. This means you are responsible for distinguishing them. You cannot wash your hands of epistemic agency by claiming the system makes justice impossible. You have to do the work of monitoring your own biases.

  **2. You accept that "Doubt" is permissible**
  The radical conclusion (6) says you can never legitimately doubt anyone different from you. By rejecting (3), you reclaim the right to skepticism. You can doubt a speaker because their claim is improbable, or because they lack expertise, provided that doubt is not *inflated* by identity prejudice. This restores normal epistemic life, but it requires you to constantly interrogate *why* you are doubting.

  **3. You admit that "Purity" is possible (in principle)**
  The roommate argues that because we can't screen out influence (5), we can't be just. By rejecting (3), you argue that justice isn't about the absence of influence, but about the **management** of influence. This costs you the excuse of "I'm just human." Fricker's framework demands we strive for a virtue we may never perfectly achieve, rather than accepting universal corruption.

  ### How to Explain This to Your Roommate
  You can say:

  > "I agree with (1) and I agree with the psychological fact in (5) that bias is ubiquitous. But I reject (3). Fricker doesn't say all identity influence is prejudice; she says prejudice is a specific kind of identity influence that is **negative** and **unwarranted**.
  >
  > If I doubt a claim because it contradicts established evidence, that's not injustice, even if the speaker has a different identity. If I doubt a claim because their accent triggers a stereotype that they are unintelligent, *that* is injustice.
  >
  > If we accept your conclusion, the word 'injustice' loses its critical power. If everything is unjust, nothing is. Fricker's point isn't that we are doomed; it's that we have a responsibility to correct for the bias we can't screen out. That makes justice a practice, not a state of being."

  ### Summary
  *   **Reject:** Step (3). (Conflates influence with prejudice).
  *   **Modify:** Step (5). (Keep the ubiquity of bias, reject the ubiquity of injustice).
  *   **Cost:** You must accept personal responsibility for correcting bias rather than hiding behind structural inevitability. You regain the ability to doubt, but you lose the excuse of paralysis.
