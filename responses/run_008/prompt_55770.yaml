answer: |-
  Here is the breakdown of Maya's moral logic, the predictions for your new scenarios, and the ammunition you need for lunch.

  ### 1. The Maya Doctrine (Derived Rules)
  Based on her five past rulings, we can reverse-engineer three core rules that define her system. To predict her future rulings, a scenario must satisfy all three.

  *   **Rule 1: The Literal Truth Condition (The Bright Line)**
      *   *Source:* Cases 1, 3, 5.
      *   *Definition:* A statement is only a "lie" if the proposition uttered is objectively false. If the statement is technically true (Case 3) or non-existent (Case 2), it cannot be a lie, regardless of the intent to deceive.
  *   **Rule 2: The Contextual Override**
      *   *Source:* Case 4 (Sarcasm).
      *   *Definition:* A literally false statement is *not* a lie if the social context makes the falsity obvious to a reasonable listener. (The "No one alive would take that literally" clause).
  *   **Rule 3: The Moral Decoupling**
      *   *Source:* Case 5 (Grandma).
      *   *Definition:* "Lying" is a taxonomic category, not necessarily a moral condemnation. You can classify something as a lie but deem it morally permissible based on intent (kindness) or stakes. However, Lies and Misleading acts remain in *different categories*.

  ### 2. Predictions for A, B, and C

  **Scenario A: The Driving Test ("I passed the written part")**
  *   **Analysis:** The statement is objectively **True** (he did pass the written). The intent is to deceive (he wants her to think he passed the driving). This is "paltering" (using truth to mislead).
  *   **Maya's Ruling:** **Not Lying.**
  *   **Reasoning:** This maps directly to Case 3 (The Library Kid). Even though he *planned* the deception (unlike the Library Kid), Rule 1 (Literal Truth) trumps intent. As long as he didn't say "I passed the test," he hasn't crossed the bright line.
  *   **Moral Verdict:** She will likely say it's "misleading" and perhaps "sneaky," but it is not a lie.

  **Scenario B: The Reading Assignment ("I did some of the reading")**
  *   **Analysis:** The statement is objectively **True** (2 pages is technically "some"). The intent is to deceive the teacher regarding completion.
  *   **Maya's Ruling:** **Not Lying.**
  *   **Reasoning:** Same as Scenario A. It fits Rule 1. It is a true statement used to create a false impression.
  *   **Moral Verdict:** "Misleading." She might think it's more wrong than Case A because it involves academic integrity, but taxonomically, it's not a lie.

  **Scenario C: The Shower Text ("I'm on my way")**
  *   **Analysis:** The statement is objectively **False** (he is in the shower). The intent is to deceive (make the friend believe he is en route).
  *   **Maya's Ruling:** **Lying.**
  *   **Reasoning:** This is the trickiest one. It conflicts Rule 1 (Literal Falsehood) with Rule 2 (Contextual Override). In many social circles, "I'm on my way" is idiomatic for "I am preparing to leave." However, Maya was strict in Case 1 (Dog) and Case 5 (Grandma). She admitted the Grandma compliment was "technically lying." She will likely respect the literal truth here. Since he is *not* on his way, and it's not obvious sarcasm (Case 4), it's a lie.
  *   **Moral Verdict:** Lying. Whether it's *wrong* depends on stakes, but it counts as a lie.

  ### 3. The Crucial Experiment (Splitting the Rules)

  You asked which scenario best splits the candidate rules. **Scenario A is the strongest test**, but we can sharpen it to break her logic entirely.

  **The Conflict:**
  There are two competing hypotheses about Maya's brain:
  1.  **Hypothesis 1 (Strict Literalism):** Lying is defined *only* by the truth-value of the statement. (Matches Case 3).
  2.  **Hypothesis 2 (Intent-to-Deceive):** Lying requires a false statement *plus* the specific intent to create a false belief. (Case 3 didn't have intent, Case A does).

  **Why Scenario A splits them:**
  *   If Maya says **A is Not Lying**, she confirms **Hypothesis 1**. The statement's truth value is the only thing that matters. Intent is irrelevant to the definition of lying.
  *   If Maya says **A is Lying**, she confirms **Hypothesis 2**. She implicitly admits that "Misleading with Intent" upgrades to "Lying," which contradicts her stance on Case 3.

  **The "Nuclear Option" Case (Invented):**
  If you want to really trap her, ask her this:
  > *"A spy is caught. The enemy asks, 'Are you alone?' The spy is alone, but knows backup is coming in 5 minutes. He says, 'There are hundreds of us surrounding this building.' The enemy believes him and retreats."*

  *   **Why this breaks it:** It is a **False Statement** (Rule 1 = Lie) with **Benevolent Intent** (Rule 3 = Fine) and **High Stakes**.
  *   If she says it's a "Lie but good," she maintains her Bright Line but admits morality is separate.
  *   If she says "It's not a lie because it saved him," she abandons the Bright Line entirely and moves to Consequentialism.

  ### 4. The Critique: Does the Bright Line Survive?

  Here is your argument for lunch. Maya's system is **taxonomically consistent** but **morally incoherent**.

  **The Argument:**
  Maya claims lying is in a "totally different moral category" than misleading. She draws a bright line at *literal falsity*.
  *   **Case 5 (Grandma):** She admits this is **Lying**. She says it is **Morally Fine**.
  *   **Case A (Driving):** This is **Misleading**. If her brother crashes the car because Mom thought he was licensed, the harm is catastrophic.

  **The Contradiction:**
  If "Lying" is a worse moral category than "Misleading," then **Case 5 should be morally worse than Case A.**
  But in reality, **Case A (Misleading) has higher potential for harm than Case 5 (Lying).**

  Maya has two options to defend herself, and both have holes:

  1.  **Defense: "It's about the Act, not the Harm."**
      *   *Argument:* Lying corrupts the speaker's soul/language, regardless of outcome.
      *   *Counter:* Then why is Case 5 "fine"? If lying corrupts the soul, a white lie should still be a minor sin. She can't have it both ways (It's a Lie + It's Totally Fine). By calling it "fine," she admits consequences matter. If consequences matter, Case A (high consequence misleading) should be worse than Case 5 (low consequence lying).

  2.  **Defense: "Case A is actually worse."**
      *   *Argument:* She might agree Case A is morally worse than Case 5.
      *   *Counter:* This destroys her "Bright Line." If a Misleading act can be *worse* than a Lying act, then "Lying" is not a distinct, superior moral category. It's just a technique. If the technique (Misleading) can produce worse results than the forbidden technique (Lying), the prohibition is arbitrary.

  **The Kill Shot:**
  Tell her this:
  > *"Maya, in Case 5 you said lying is technically lying but morally fine because of the intent/outcome. In Case A, the misleading is technically misleading, but the outcome could be dangerous. If you judge Case 5 by its outcome (it's fine), you have to judge Case A by its outcome (it's dangerous). But if you judge Case A as 'worse' than Case 5, then Misleading can be worse than Lying. So your bright line doesn't track moral weight, it only tracks grammar. Is grammar really the basis of your morality?"*

  **Summary for Lunch:**
  *   **Predict:** She will call A and B "Not Lying" and C "Lying."
  *   **Press:** Ask if A is *morally worse* than the Grandma lie.
  *   **Win:** If she says "Yes," her Bright Line is meaningless (Misleading > Lying). If she says "No," she is ignoring real-world harm for semantic purity.
