answer: |-
  # The Epistemic Modesty Instrument

  **Root:** You have formed a confident judgment on a question. You now learn that others, similarly placed and informed, disagree with you.

  ### Question 1: The Reference Class
  **Scenario:** Imagine you are estimating the runtime of a software project. You recall a database of 100 past projects you've managed that felt *exactly* as manageable as this one does now. In 80 of those cases, you underestimated the time required.
  **Question:** Before hearing your peers' estimates, do you automatically adjust your current estimate to align with the historical error rate of that group?
  *   **Yes:** Go to **Question 2**.
  *   **No:** Go to **Question 3**.

  ### Question 2: The Expertise Exemption
  **Scenario:** You accept the reference class above, but you also know you were specifically selected for this project because of a rare certification your peers lack. The historical data includes people without this certification.
  **Question:** Does your specific selection for expertise exempt you from the statistical average of the broader group?
  *   **Yes:** Go to **Question 4**.
  *   **No:** **Leaf: The Reference-Class Forecaster.** (You treat your own judgment as a data point subject to the statistical gravity of the relevant class.)

  ### Question 3: The Transparency Test
  **Scenario:** There is no historical data for this type of judgment. You and a peer disagree on a complex math proof. You can re-trace every step of your derivation; your peer simply states a different result without showing work.
  **Question:** Does the fact that your reasoning process is "transparent" to you (in a way theirs is not) justify maintaining your confidence?
  *   **Yes:** Go to **Question 5**.
  *   **No:** Go to **Question 6**.

  ### Question 4: Calibration and Deference
  **Scenario:** You have claimed exemption from the reference class due to expertise. However, you learn that a specific disagreeing peer has a verified track record of higher accuracy *even among experts* on this specific topic.
  **Question:** Do you move your credence toward their view?
  *   **Yes:** Go to **Question 7**.
  *   **No:** **Leaf: The Inside-Viewer.** (You trust the private access to your own reasoning and expertise over external indicators, including peer calibration.)

  ### Question 5: The Diachronic Check
  **Scenario:** You are relying on the transparency of your current reasoning (from Q3). However, your personal logbook shows that when you feel this level of "clarity," you are wrong 40% of the time.
  **Question:** Do you trust the logbook (your past self's track record) over the feeling of clarity (your current self's reasoning)?
  *   **Yes:** **Leaf: The Past-Self Tracker.** (You prioritize your diachronic reliability over both current intuition and peer opinion.)
  *   **No:** **Leaf: The Inside-Viewer.** (You prioritize the immediate transparency of current reasoning over historical error rates.)

  ### Question 6: The Blind Deference
  **Scenario:** You rejected the "Transparency" advantage in Q3 (you feel your reasoning is no more visible than theirs). You have no reference class (from Q1).
  **Question:** Do you defer to the peer simply because they disagree, assuming symmetry?
  *   **Yes:** Go to **Question 7**.
  *   **No:** **Leaf: Unoccupied Cell (The Epistemic Drifter).** (Diagnosis: **Incoherent.** You reject stats, you reject private transparency, and you reject peer deference. You have no remaining source of authority for your belief.)

  ### Question 7: Extent of Movement
  **Scenario:** You have decided to defer to the better-calibrated peer (from Q4 or Q6).
  **Question:** Do you adopt their probability estimate *fully*, or do you average your view with theirs?
  *   **Fully:** **Leaf: The Aggregator/Deferer.** (You treat the better-calibrated view as replacing your own.)
  *   **Average/Partway:** **Leaf: The Moderate Conciliator.** (Note: This position is often functionally identical to the Aggregator in practice, depending on how "calibration" is weighted.)

  ***

  ### Diagnostic Notes for the Columnist

  **1. Unoccupied Logical Space**
  *   **The Privileged Statistician:** A position that would arise if a reader answered **Yes** to Q1 (Reference Class exists) but **No** to Q2 (Expertise Exemption) *and* **No** to using the stats for themselves while still using them to judge others.
      *   *Diagnosis:* **Incoherent.** This violates the Principle of Indifference. If the reference class is truly relevant, one cannot selectively apply it to peers while claiming special status for oneself without a differentiating variable (which returns you to Q2).
  *   **The Epistemic Drifter (Q6 No):** As noted in the tree.
      *   *Diagnosis:* **Unattractive/Unstable.** It leaves the agent with no mechanism to update beliefs, rendering the concept of "disagreement" meaningless.

  **2. Indistinguishable Positions**
  *   **The Inside-Viewer vs. The Past-Self Tracker:** The tree separates these at Q5, but in practice, these positions often blur. A Past-Self Tracker must use their *current* reasoning to interpret their *past* logbook. If their current reasoning is flawed, their assessment of the logbook may be too. The tree assumes the agent can reliably access their track record; if they cannot, the positions collapse into one another.
  *   **The Aggregator/Deferer vs. The Reference-Class Forecaster:** Both rely on external data. The distinction here is drawn between *current peer calibration* (Q4/Q7) and *historical base rates* (Q1/Q2). However, a sufficiently sophisticated Reference-Class Forecaster treats "peers" as a real-time reference class. The tree forces a choice between "past data" and "current peer," but a unified "Outside View" position might answer Yes to both paths, making the final label dependent on which question they encountered first.

  **3. Usage Instructions**
  *   This instrument is designed to reveal *priority* rather than pure belief. A reader may value both transparency and calibration, but the tree forces them to reveal which acts as the "tie-breaker" when the two conflict.
  *   Encourage readers to note where they hesitated. Hesitation at Q5 (Diachronic Check) often reveals the "Hot-Cold Empathy Gap" in epistemology: we know our past selves were fallible, but we feel our current self is "different."
