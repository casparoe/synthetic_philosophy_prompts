prompt: |-
  I've got two friends from an AI safety reading group who've been going at it for a year about whether alignment work should aim for worst-case guarantees (like provable safety bounds or robustness against literally all adversarial inputs) versus settling for average-case performance (evals on representative distributions, empirical red-teaming, accepting that rare tail failures might slip through). One of them keeps saying "we don't get to have average-case guarantees when the loss is unbounded," the other keeps replying "we've never gotten worst-case anything for a system this complex, so it's a demand for a proof nobody can write." They finally agreed to do an adversarial collaberation and asked me to draft the joint statement, and I'm in over my head.

  Write that document for them. I want: (1) a numbered section of claims both sides could actually put their names to, including about specific things like whether current evals measure anything real; (2) a disagreements table where each residual disagreement is phrased so that its own side would accept the wording (no strawmen -- the worst-case person should be comfortable signing the row describing their view, and vice versa); (3) the cruxes -- I suspect one is whether the "loss" from misalignment is unbounded in a way that makes tail risk dominate, and another is whether formal methods will ever scale to systems learned from data, but they might disagree about more than that; and (4) for each crux, some concrete test, case, or argument both would agree bears on it, with each side's prediction written down in advance. If you think part of their dispute is just verbal (e.g., they mean different things by "guarantee"), flag which part and why.

  Please answer in American English.
