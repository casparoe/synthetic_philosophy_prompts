  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Demandingness Objection to Consequentialism
  **Participants:** Member A (Consequentialist Defense) and Member B (Prerogative Defense)
  **Date:** October 26, 2023

  ## PREAMBLE
  This document outlines the results of an adversarial collaboration between two members of an ethics reading group. The purpose is not to declare a winner, but to isolate the precise points of convergence and divergence regarding the "demandingness objection" to consequentialism. Both participants acknowledge that this debate remains unresolved in the broader philosophical literature and that neither position represents the settled consensus of the field.

  ## I. AGREED CLAIMS
  *The following claims are endorsed by both Member A and Member B. Neither party considers these claims to constitute a concession of their core theoretical position.*

  1.  **Status Quo Deficiency:** Both parties agree that the moral obligations of agents in affluent circumstances are significantly more demanding than current common practice. We agree that most agents are morally required to sacrifice considerably more time, resources, and convenience to prevent severe harm to others than they currently do.
  2.  **Relevance of Consequences:** Both parties agree that the consequences of actions are morally relevant. The disagreement is not about whether consequences matter, but about whether the *maximization* of impersonal good is the sole determinant of moral obligation.
  3.  **Nature of the Objection:** Both parties agree that the "demandingness objection" is not merely a complaint about psychological difficulty. The objection is normative: it claims that a theory requiring extreme sacrifice is *incorrect*, not merely that it is *hard to follow*.
  4.  **No Trivial Cutoff:** Both parties agree that there is no obvious, bright-line percentage of income or time (e.g., "10%") that marks the boundary of obligation based solely on common intuition. Any proposed limit requires theoretical justification.
  5.  **Scope of Disagreement:** This disagreement is not about whether agents have *some* permission to pursue personal projects. Member A accepts agents may pursue personal projects *when doing so does not conflict with significant moral obligations*. Member B accepts agents must sacrifice personal projects *when the moral stakes are sufficiently high*. The dispute concerns the threshold at which moral obligation overrides personal projects.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS
  *The following table outlines the core points of contention. The phrasing in each column is drafted to be acceptable to the respective party without implying the other party's view is coherent.*

  | Topic | Member A (Consequentialist Defense) | Member B (Prerogative Defense) |
  | :--- | :--- | :--- |
  | **The Source of Obligation** | Moral obligation is determined solely by the impersonal value of outcomes. The agent's personal cost is relevant only insofar as it affects their future ability to produce good. | Moral obligation is determined by a hybrid of impersonal value and the agent's integrity. The agent's personal cost has independent normative weight. |
  | **The Limit of Sacrifice** | There is no principled limit to sacrifice based on the *size* of the cost to the agent. Obligation ceases only when the cost to the agent equals or exceeds the benefit to the recipient. | There is a principled limit to sacrifice. Agents possess an "agent-centered prerogative" allowing them to prioritize personal projects even when impersonal good could be marginally increased. |
  | **Diagnosis of Intuition** | The intuition that consequentialism is "too demanding" is a cognitive bias rooted in evolved selfishness and status-quo preference. It tracks psychological comfort, not moral truth. | The intuition that consequentialism is "too demanding" tracks a genuine normative truth about the separation of persons and the value of individual integrity. |
  | **Theoretical Virtue** | A moral theory should be simple and extensionally adequate to the facts of value. Accepting extreme demands is a theoretical virtue (honesty), not a defect. | A moral theory must be livable and recognizable to the agents subject to it. A theory that alienates agents from their ground projects is defective. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *The following sections identify the specific theoretical hurdles (cruxes) that sustain the disagreement. For each crux, we identify a specific argument or case type that both agree would bear on the issue, along with pre-registered predictions.*

  ### Crux 1: The Sorites of Sacrifice vs. The Integrity Constraint
  **The Issue:** Member A argues that any limit on sacrifice is arbitrary (a Sorites problem): if it is right to sacrifice $X$, it is hard to explain why it is wrong to sacrifice $X + \epsilon$. Member B argues that a non-arbitrary limit can be grounded in the conditions necessary for human agency and integrity (a Scheffler-style weighting system).

  **Agreed Test Case:** A series of vignettes involving a "Career Dilemma." An agent can prevent a specific amount of suffering (e.g., save 1 life, 10 lives, 100 lives) by abandoning a core life project (e.g., becoming a doctor, raising a family, writing a novel). The cost to the agent is held constant (loss of the project), while the benefit to others scales up.

  **Pre-Registered Predictions:**
  *   **Member A Prediction:** As the benefit to others scales up, Member B will be unable to identify a specific point where the obligation becomes mandatory without admitting that the previous point was also mandatory. Member A predicts Member B's "limit" will shift under pressure, revealing it is merely a reflection of current social norms rather than a principled boundary.
  *   **Member B Prediction:** Member A will be unable to explain why an agent who sacrifices their core projects (rendering them psychologically depleted or devoid of personal motivation) remains a more effective moral instrument than one who retains them. Member B predicts that at some scale of sacrifice, the loss of integrity undermines the value of the moral agent, creating a non-arbitrary limit.

  ### Crux 2: Debunking vs. Vindicating the "Too Demanding" Intuition
  **The Issue:** Member A argues that the intuition that morality is "too demanding" is explained by evolutionary selfishness and should be debunked. Member B argues that this intuition is vindicated by the phenomenological experience of what it means to lead a human life.

  **Agreed Test Case:** A "Modified Psychology" thought experiment. We consider a class of agents who do not suffer from evolutionary selfishness or status-quo bias (e.g., purely rational agents or beings with different psychological constitutions) but who still possess distinct personal projects and commitments.

  **Pre-Registered Predictions:**
  *   **Member A Prediction:** If selfishness and bias are removed, the intuition that extreme sacrifice is "wrong" will vanish. The modified agents will accept the consequentialist requirement as rational. Therefore, the intuition in humans is a bug, not a feature.
  *   **Member B Prediction:** Even without selfishness or bias, the modified agents will recognize a distinction between *the good* and *the obligatory*. They will acknowledge that while maximizing the good is valuable, it is not *required* to the point of erasing the distinction between their own life and the lives of others. The intuition survives the debunking attempt.

  ## IV. METHODOLOGICAL COMMITMENTS
  *To ensure the collaboration remains productive, both parties agree to the following constraints on future argumentation:*

  1.  **No "Straw Man" Demands:** Member A will not characterize Member B's view as endorsing laziness or trivial self-indulgence. Member B will not characterize Member A's view as requiring agents to become "moral saints" devoid of all emotion or personality.
  2.  **Acknowledgment of Uncertainty:** Neither party will present their position as the default or standard view in normative ethics. Both acknowledge that the demandingness objection remains one of the most significant open problems in moral philosophy.
  3.  **Focus on Principles:** Arguments must focus on the *principles* justifying the limits (or lack thereof), not merely on the *extensional outcomes* of specific cases.

  ***

  **Signed,**

  _________________________
  **Member A** (Consequentialist Defense)

  _________________________
  **Member B** (Prerogative Defense)
