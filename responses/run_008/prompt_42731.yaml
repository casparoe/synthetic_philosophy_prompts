          *   The "Shed" analogy is actually very strong. Use it.
      *   *Section 3: The Moral Debt.*
          *   It's not just about the $200.
          *   It's about the violation of trust and autonomy during a conflict.
          *   Restitution = Validation + Safety Measures + Symbolic Gesture.
      *   *Section 4: How to Talk to Parents.*
          *   Don't say "feelings." Say "Labor" and "Archive."
