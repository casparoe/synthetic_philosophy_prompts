      Global Workspace Theory (GWT) is often presented as a theory of consciousness in the full, phenomenal sense. However, upon scrutiny, it is strictly a theory of what Ned Block calls access consciousness. The distinction becomes undeniable when we consider a specific architectural variation: the narrow-access channel. This thought experiment demonstrates that global broadcast is a contingent condition for reportability, not a constitutive condition for experience. Consequently, GWT explains how information becomes globally available for report and control, but it fails to capture the nature of phenomenality itself.

      Imagine a cognitive architecture functionally identical to ours, possessing specialized modules for vision, audition, and memory, alongside a standard global workspace. However, this system includes an additional feature: a dedicated, private channel connecting exactly two modules, say, vision and motor planning. Through this narrowcast channel, the modules exchange rich information. The vision module sends high-resolution data; the motor module uses it for fine-grained discrimination, reasoning, and planning. Crucially, nothing on this channel is broadcast to the workspace. It leaves no trace in global memory, triggers no report mechanisms, and is inaccessible to other modules. Call this narrow-access information.

      We must weigh two interpretations of this case. On the first reading, the Global Workspace theorist insists that because this information is not broadcast, it is entirely unconscious. There is nothing it is like to process data on the private channel. This reading preserves the theory's core definition—consciousness equals global broadcast—but at a steep cost. The information on the narrow channel supports reasoning and fine discrimination exactly as our conscious percepts do. If we attribute phenomenality to our own states because they guide reasoning and discrimination, consistency demands we attribute it here. To deny phenomenality solely because the information is not shared with a third module is to conflate consciousness with a specific, contingently global pattern of access. It suggests GWT mistakes the architecture of reporting for the nature of experience.

      On the second reading, the theorist insists that globality is not arbitrary. Consciousness evolved to make information available to an open-ended set of consumers, not just a fixed pair. Information confined to a dyad lacks the unity required for a subject of experience. This defense appeals to the functional role of consciousness as a integrator. However, this reading falters when examining the "subject" of the narrow access. If the two modules form a functional unit capable of reasoning, they constitute a local subject. The requirement that a subject must be able to report to *itself* via a global workspace begs the question. It assumes that the specific topology of human cognition—where reportability relies on Baars' theatre-like broadcast—is necessary for experience itself. But the thought experiment shows that rich integration can occur without the theatre lights turning on for the whole audience.

      The first reading is stronger because it acknowledges the functional equivalence between narrow-access processing and standard conscious processing. The only difference is topological: one is broadcast, the other is point-to-point. If GWT claims the broadcast version is phenomenal and the point-to-point version is not, it must argue that broadcast creates phenomenality ex nihilo. There is no reason to think adding listeners to a signal changes its intrinsic qualitative character. Rather, broadcast changes its functional availability. This aligns with Dehaene's work on neural correlates, which distinguishes between subliminal processing and reportable perception. The narrow-access case isolates the variable of reportability. It shows that one can have the cognitive uses associated with consciousness (access) without the global ignition associated with report.

      This forces a definite verdict on the access/phenomenal distinction. The case does not merely show that availability comes in degrees; it shows a gap between phenomenality and global availability. If we intuit that the narrow-access modules are experiencing something—given their rich interactive use of data—then phenomenality exists without global workspace ignition. GWT, therefore, tracks the ignition. It explains how private states become public within the mind, enabling report and flexible control. It does not explain why those states feel like anything in the first place. The narrow-access channel represents a state that is access-conscious (available for use) but potentially phenomenal despite lacking global access. GWT cannot account for this possibility because it defines consciousness by the access mechanism itself.

      Therefore, GWT is a theory of access consciousness. It details the conditions under which information becomes globally available for reasoning and report. It does not, however, solve the hard problem of why such access is accompanied by experience, nor does it account for experiences that might be rich yet locally contained. The thought experiment reveals that global broadcast is a mechanism for coordination, not the ground of being. We must conclude that while GWT accurately describes the architecture of reportable perception, it fails as a theory of consciousness in the full sense. The narrow-access channel remains lit for the modules involved, even if the global workspace remains dark.

