answer: |-
  Yes, there is an established term for this structure, though it is often used loosely. The precise label you are looking for is a **performative contradiction** (sometimes distinguished as a **pragmatic contradiction**).

  However, because "performative contradiction" is often applied to normative claims (e.g., "There are no valid arguments" is an argument) or speech-act infelicities, it does not always capture the specific *truth-conditional* mechanism you have isolated. To be precise about the phenomenon where the *act* renders the *content* false (rather than merely inappropriate or unassertable), the most accurate technical description is **pragmatically self-falsifying**.

  Here is how the term draws its boundaries, how it relates to the *Cogito*, and what is required for it to function as a proof.

  ### 1. The Established Term: Performative Contradiction
  In the tradition of speech-act theory (Austin, Searle) and critical theory (Habermas, Apel), a performative contradiction occurs when the propositional content of an utterance contradicts the presuppositions or the fact of the utterance itself.

  *   **Your Case:** "I am not speaking."
  *   **Analysis:** The content ($\neg S$) contradicts the illocutionary act ($S$).
  *   **Status:** This is the standard umbrella term.

  However, philosophers of logic and epistemology, particularly **Jaakko Hintikka**, refined this when analyzing Descartes. Hintikka distinguished between statements that are logically inconsistent and those that are **existentially self-verifying** (or their negation, **existentially self-falsifying**).

  *   **Hintikka's Insight:** "I exist" is not a logical truth (it is contingent). But it is *existentially self-verifying* because in any possible world where I try to doubt it, the doubt entails the existence of the doubter. Conversely, "I do not exist" is **existentially self-falsifying**.
  *   **Why this fits your request:** It captures your intuition that the content is contingent (it *could* be true if I weren't here to say it) but becomes necessarily false relative to the act of thinking/saying it.

  ### 2. Drawing the Boundaries
  You correctly identified that this structure is distinct from neighboring logical oddities. Here is how the terminology separates them:

  **A. Vs. The Liar Paradox (Semantic Closure)**
  *   **Liar:** "This sentence is false." The contradiction arises from the *semantic rules* governing truth predicates within the language. It creates a truth-value gap or gluts.
  *   **Your Structure:** The contradiction arises from the *pragmatic context* (the world + the speaker + the time). If you record "I am not speaking" and play it back, it is false. If you write it in a diary, it is false. If you think it, it is false. The sentence itself has no internal logical flaw; it is the *tokening* of the sentence that kills it.
  *   **Boundary:** Logical paradoxes are type-level (the sentence itself); performative contradictions are token-level (the specific utterance).

  **B. Vs. Moore's Paradox (Doxastic Logic)**
  *   **Moore:** "It is raining, but I don't believe it."
  *   **Distinction:** A Moorean sentence can be **true**. It is possible that it is raining and you are unaware of it. The paradox is that it cannot be *sincerely asserted*.
  *   **Your Structure:** Your sentences cannot be **true** when asserted. "I am not speaking" is not just insincere; it is factually false the moment it is uttered.
  *   **Boundary:** Moore's paradox violates norms of *assertibility*; performative contradictions violate conditions of *truth*.

  **C. Vs. Presupposition Failure**
  *   **Example:** "I have completely forgotten this conversation."
  *   **Distinction:** This is tricky. If I say it, I am remembering the conversation *now*. So, strictly speaking, it is false *now*. However, it could be interpreted as "I have forgotten [the bulk of] this conversation."
  *   **Refinement:** To be a strict performative contradiction, the content must deny a necessary condition of the *current* act. "I am not speaking" denies the current act. "I forgot" denies a memory state which might be compatible with the current act of retrieval.
  *   **Boundary:** The falsity must be simultaneous with the act.

  ### 3. Extension to Other Mental Acts
  You asked if this extends to wondering or doubting. Yes. This is the domain of **incorrigibility** or **self-intimating states**.

  *   **Doubting:** "I doubt that I am doubting." The act of doubting the doubt confirms the doubt.
  *   **Wondering:** "I wonder whether I am wondering." The inquiry confirms the state.
  *   **Perceiving:** "I am not having any visual experience." (While looking at a red apple). If the experience is conscious, asserting its absence falsifies the assertion.

  This class of statements is often called **self-presenting states** (Roderick Chisholm). A state is self-presenting if, necessarily, if a person is in that state and considers the question, they cannot be mistaken about it. Your structure is the negative flip-side: if you assert the *absence* of a self-presenting state while in it, you guarantee falsity.

  ### 4. From Embarrassment to Proof
  You asked: *What would it take for a member of this family to function as a proof rather than as a mere embarrassment?*

  This is the crux of the Cartesian problem. A performative contradiction proves that *something* is happening, but it does not automatically prove *who* or *what* is doing it.

  **The Gap:**
  1.  **Act:** Asserting "I do not exist" is self-falsifying.
  2.  **Inference:** Therefore, an existence is manifest.
  3.  **The Leap:** Does this prove *I* exist? Or only that *thinking exists*? (As Lichtenberg and Nietzsche argued: "It thinks" rather than "I think".)

  **Requirements for a Proof:**
  For a pragmatically self-falsifying statement to function as an ontological proof, it requires three components:

  1.  **The Performative Premise:** The indubitable fact that the act (thinking/speaking) is occurring. (Guaranteed by the self-falsifying nature of the denial).
  2.  **The Substantial Premise:** An account of what the act entails. (e.g., "Acts require agents" or "Thinking implies a thinker").
  3.  **The Indexical Bridge:** A justification that the "I" in the conclusion refers to the same entity as the "I" performing the act.

  **Why "I am not thinking" works better than "I do not exist":**
  *   "I am not thinking" is falsified by the act of thinking. This proves *thinking is occurring*.
  *   To get to *I exist*, you need the additional premise: *Whatever thinks, exists.*
  *   To get to *I am a substance*, you need: *Whatever thinks, is a substance.*

  The phenomenon you identified guarantees the **act**, not the **agent**. It functions as a proof of *process* (cogitatio), but only as a proof of *substance* (res cogitans) if you accept additional metaphysical premises about the nature of processes.

  ### 5. A Proposed Definition
  Since "performative contradiction" is sometimes used too broadly (covering normative inconsistencies), if you wish to coin or refine a term for your specific logical structure, I propose:

  **Term:** **Pragmatically Self-Falsifying (PSF)**

  **Definition:** A proposition $P$ is Pragmatically Self-Falsifying if and only if:
  1.  $P$ is contingent (there is a possible world where $P$ is true).
  2.  There is an illocutionary or mental act $A$ (e.g., asserting, doubting) required to entertain $P$ sincerely.
  3.  The performance of $A$ entails $\neg P$.
  4.  Therefore, $P$ is necessarily false *in the context of its sincere assertion*.

  **Hard Cases Decided by this Definition:**
  *   *"I am asleep."* **PSF.** (If you assert it, you are awake. Content is contingent.)
  *   *"I am dead."* **PSF.** (If you assert it, you are alive. Content is contingent.)
  *   *"No one can know anything."* **Not PSF.** (This is a logical paradox or self-defeating argument, but the *content* doesn't contradict the *act* directly in the same indexical way. It claims a universal limitation, not a denial of the current act.)
  *   *"I do not believe this sentence."* **Moore's Paradox, not PSF.** (It can be true that you don't believe it, even if you say it. It is not falsified by the act, only rendered irrational.)

  ### Summary
  The structure is a **Performative Contradiction**, specifically an **Existentially Self-Falsifying** statement (per Hintikka). It differs from the Liar Paradox because it is pragmatic (token-based) rather than semantic (type-based), and it differs from Moore's Paradox because it renders the statement *false* rather than merely *unassertable*.

  It functions as a proof of the **act's occurrence** immediately. To function as a proof of the **agent's existence**, it requires the supplementary metaphysical premise that acts cannot float free of agents. Without that premise, the phenomenon proves only that *thinking is happening*, not that *you* are the one doing it.
