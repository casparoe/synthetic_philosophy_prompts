answer: |-
  Here is a principle that captures the structure of your verdicts, followed by an analysis of its costs and an application to your new case.

  ### The Principle: Reflective Diachronic Governance

  **Weakness of will (akrasia) occurs when an agent acts on a preference generated by temporal proximity (a local preference) in violation of a policy or plan generated by a temporally distant perspective (a global preference), provided that the agent reflectively endorses the authority of the global perspective over the local one.**

  This principle shifts the locus of evaluation from a single moment in time (synchronic) to the agent's extended existence (diachronic). It defines the "will" not as what you want *now*, but as the governance structure you endorse *over time*.

  #### Clause Mapping
  1.  **Local vs. Global Preference:** Distinguishes between the impulse of the moment (hyperbolically discounted) and the plan made from a distance.
      *   *Motivates:* All cases. This captures the hyperbolic discounting pattern you identified.
  2.  **Violation of Global Policy:** The action must fail to execute the global plan.
      *   *Motivates:* **Case 1** (Gym plan violated), **Case 3** (Quit plan violated), **Case 4** (Study plan violated).
      *   *Excludes:* **Case 5** (Cake plan *followed*). In Case 5, the agent acts on the global preference (to eat), resisting the local preference (to abstain). This explains why it is not akrasia, despite the local dissent.
  3.  **Reflective Endorsement of Authority:** The global plan must be endorsed as authoritative, evidenced by regret, pre-commitment, or explicit authorization. If the global plan is repudiated, following the local preference is merely a change of mind.
      *   *Motivates:* **Case 1** (Regret signals endorsement of the gym plan), **Case 4** (Pre-commitment signals endorsement of the study plan), **Case 5** (Explicit endorsement of the earlier judgment).
      *   *Excludes:* **Case 2** (No regret signals the gym plan was *not* endorsed; the later self revoked the earlier self's authority).

  ### Tensions and Verdicts to Drop

  You noted that at least two verdicts pull in opposite directions. The tension lies between **Case 1** and **Case 3**.

  *   **Case 1** fits the traditional definition of akrasia: acting against your *current* best judgment (at 6 PM, Mara judges rest is better).
  *   **Case 3** violates the traditional definition: the smoker acts *in accordance* with his current best judgment (at evening, he prefers to smoke).

  **The Honest Assessment:**
  My principle saves all five of your specific verdicts, but it requires you to **drop the implicit assumption that weakness of will requires acting against one's contemporaneous judgment.**

  If you hold fast to the view that "akrasia must involve acting against what you think best *at the time of action*," you must drop the verdict on **Case 3**. You would have to classify the smoker as merely inconsistent or irrational, but not akratic. However, your intuition that Case 3 is "worse" than Case 1 suggests you already sense that the failure is diachronic (a failure of self-governance over time) rather than synchronic (a failure of logic at a moment).

  Regarding your worry about **Case 4** (pre-commitment implying earlier-self authority): This principle resolves that worry. It does not grant the *earlier* self automatic authority. It grants authority to the *reflectively endorsed* self. In Case 2, the *later* self repudiates the earlier plan, so the later self is authoritative. In Case 4, the agent uses pre-commitment to signal that the earlier self's plan *should remain* authoritative. The authority comes from the endorsement, not the timestamp.

  ### Application: The Dreary Party

  **The Case:** A person stays at a dreary party out of duty while every present impulse presses her to leave. She feels torn but does what her better judgment favors.

  **Analysis under the Principle:**
  1.  **Local vs. Global:**
      *   *Local Preference:* Leave (driven by immediate discomfort/boredom).
      *   *Global Preference:* Stay (driven by duty/long-term values).
  2.  **Violation:**
      *   The agent *stays*. She executes the global plan.
  3.  **Endorsement:**
      *   She stays "out of duty," implying she reflectively endorses the global policy over the local impulse.

  **Verdict:**
  This is **not weakness of will**. It is the mirror image: **Strength of Will (Enkrasia).**

  **What is (or is not) going wrong?**
  On this principle, **nothing is going wrong with the will.** The agent is successfully maintaining diachronic self-governance. The "better judgment" (duty) is the global policy, and it is successfully governing the action despite local resistance.

  However, something is going wrong **phenomenologically**. The agent feels "torn." This indicates that while the *governance structure* is intact (the Global Self is ruling the Local Self), the *integration* is imperfect. The Local Self has not been persuaded or aligned; it is merely being overruled.

  *   **In Case 1 (Mara/Gym):** The Local Self overrules the Global Self. (Failure of Governance).
  *   **In this Case (Party):** The Global Self overrules the Local Self. (Success of Governance).

  The friction she feels is the cost of authority. It is not a failure of will, but it is a sign that her preferences are not fully harmonized. If she had stayed and *wanted* to stay (perhaps by reframing the duty as valuable in the moment), that would be a higher degree of agency (wholeheartedness), but merely staying out of duty while wanting to leave is sufficient for strength of will. It is the successful resistance of the very temptation that destroyed Mara in Case 1.
