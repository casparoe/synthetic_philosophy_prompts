  This is not a mess; it is actually a very sophisticated, coherent philosophical position known as the **"Best Candidate" theory of identity**, mixed with **Conventionalism**. You have intuitively landed on a view that many professional metaphysicians hold: identity isn't one single rule, but a hierarchy of criteria that depends on competition and sortals.

  However, your intuition is correct that the *wording* creates friction. Here is the breakdown of the tensions, ranked by severity, with the cheapest fixes for each.

  ### 1. The Tension Analysis

  #### **Pair A: (2) vs. (3) — The "Competition" Tension**
  *   **The Conflict:** In (2), the reassembled planks are a replica. In (3), the reassembled planks (plus new wood) are the original. Your gut screams this is a contradiction.
  *   **Why it looks bad:** It seems like you are saying "Reassembly doesn't count" in (2) but "Reassembly does count" in (3).
  *   **Why it's actually resolvable:** The hidden variable is **competition**. In (2), there is a *better* candidate (the continuously maintained ship). In (3), the continuous candidate was destroyed by the storm. You are implicitly applying a "Best Available Candidate" rule.
  *   **Severity:** **High.** This is the core logical knot causing your anxiety.

  #### **Pair B: (4) vs. (2) & (6) — The "Meta" Tension**
  *   **The Conflict:** (4) says there is "no deep metaphysical fact" (Anti-Realism/Conventionalism). But (2) says "is the original, **period**" and (6) says "neither one **is**" (Realism).
  *   **Why it looks bad:** You can't claim something is objectively true "period" while simultaneously claiming it's just a matter of human interest.
  *   **Why it's actually resolvable:** (4) is the *explanation* for why (2) and (6) are true. They are true *within* the convention, not outside of it.
  *   **Severity:** **Medium.** This is a linguistic clash rather than a logical one, but it undermines the confidence of your verdicts.

  #### **Pair C: (1)-(3) vs. (5) — The "Sortal" Tension**
  *   **The Conflict:** Ships rely on physical continuity/material (mostly), while persons rely on psychology.
  *   **Why it looks bad:** It feels like a double standard. Why do people get special rules?
  *   **Why it's actually resolvable:** This is standard "Sortal Relativity." The criteria for identity depend on *what kind of thing* you are identifying. A "person" is defined by mind; a "ship" is defined by structure/function. (4) actually supports this distinction.
  *   **Severity:** **Low.** This is a widely accepted distinction in philosophy.

  ---

  ### 2. Ranking by Severity

  1.  **(2) vs. (3):** Highest severity. If this isn't fixed, the system collapses into contradiction.
  2.  **(4) vs. (2)/(6):** Medium severity. It makes your tone inconsistent, but the logic can hold.
  3.  **(1-3) vs. (5):** Low severity. Easily justified by the nature of the objects.

  ---

  ### 3. The Cheapest Fixes

  **For (2) vs. (3): Add a "No Competitor" Clause.**
  *   **Fix:** Modify (3) to read: "...that can still be the same ship, **provided no spatiotemporally continuous candidate survives.**"
  *   **Why:** This aligns (3) with (2). (2) establishes that Continuity > Reassembly. (3) now clarifies that Reassembly only wins when Continuity is dead. This also aligns with (6): if planks are split into two ships, neither wins because there is no *unique* best candidate.

  **For (4) vs. (2)/(6): Soften the Realist Language.**
  *   **Fix:** Change "is the original, period" in (2) to "counts as the original under our standard conventions."
  *   **Why:** This makes (4) the governing rule. It acknowledges that your "period" verdicts are strong social/metaphysical conventions, not magic facts.

  **For (1-3) vs. (5): Invoke Sortal Dependence.**
  *   **Fix:** Add a preamble: "Identity criteria are sortal-dependent."
  *   **Why:** This explicitly licenses the double standard. It's not a bug; it's a feature of how we categorize the world.

  ---

  ### 4. The Single Revision That Cleans Up the Most

  If you make only one change, do not tweak the wording of (2) or (4). Instead, **reformulate (3) to explicitly acknowledge the hierarchy implied by (2) and (6).**

  **The Revision:**
  > **(3) Revised:** "If a ship is wrecked and later rebuilt from salvaged timbers, it is the same ship **only because the spatiotemporally continuous path was destroyed; if the continuous ship had survived, it would have retained identity.**"

  **Why this is the winner:**
  1.  **Resolves the Gut Check:** It directly addresses your feeling that (2) and (3) can't both be right. They *are* both right, but (3) is subordinate to (2).
  2.  **Unifies (6):** It explains why branching kills identity (because it creates two equal candidates, violating the "unique best candidate" rule).
  3.  **Preserves (4):** It allows you to keep (4) as the meta-explanation (we *choose* to prioritize continuity) without forcing you to weaken the confident language in (2).
  4.  **Minimal Effort:** You don't have to rewrite your whole worldview; you just have to admit that (3) is the "exception" rule, not the "primary" rule.

  **Your Coherent System:**
  You are a **Conventionalist Best-Candidate Theorist**.
  *   **Default Rule:** Spatiotemporal Continuity wins (1, 2).
  *   **Tie-Breaker:** If continuity branches equally, identity vanishes (6).
  *   **Exception:** If continuity is destroyed, Material/Functional reconstruction inherits identity (3).
  *   **Meta-Rule:** These rules exist because of our interests/sortals (4, 5).

  Your list isn't a mess; it's just missing the hierarchy that holds it together. Add the "No Competitor" clause to (3), and the ship stops sinking.
