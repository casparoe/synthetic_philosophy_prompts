  There is no single, established term in political philosophy or moral sociology that captures this specific configuration. The concept of **Dirty Hands** (most famously articulated by Michael Walzer) addresses the justification of the act itself (doing wrong to do right). **Moral Remainder** (Bernard Williams, Thomas Nagel) describes the lingering moral status of the agent or the act, but not the social ritual required to manage it. **Atonement** or **Penance** implies a religious or reparative framework that suggests the debt can be cleared or the harm repaired, whereas your description posits a suffering that is non-instrumental and permanent.

  Given the precision of your description—specifically the elements of *visible suffering*, *social expectation*, *correct dosage*, and *non-instrumental payment*—I propose we coin the term **The Scarring Mandate**.

  ### Definition: The Scarring Mandate

  **The Scarring Mandate** is the social and moral requirement that an agent who has committed a necessary evil (a "dirty hands" act) must visibly and permanently bear the psychological burden of that act to retain their standing within the moral community.

  Unlike *remorse*, which is an internal feeling, or *atonement*, which seeks repair, the Scarring Mandate is a **performative obligation**. It demands that the agent display a specific kind of suffering—one that acknowledges the wrongness of the act without renouncing the necessity of it. This suffering functions as a **symbolic payment** (a *moral surcharge*) that balances a ledger which cannot otherwise be settled. The "scar" is the visible mark of this payment; it signals that the agent has not become cheapened by the act, even if the act was required.

  ### Edges and Boundaries

  To define the Scarring Mandate with the care you requested, we must distinguish it from its nearest neighbours and test its limits against the boundary cases you identified.

  #### 1. Distinction from Nearest Neighbours

  *   **Vs. Dirty Hands:** Dirty Hands is the *license* to commit the act; the Scarring Mandate is the *cost* of holding that license. One can have dirty hands without a scarring mandate (e.g., a tyrant who feels no remorse), but such an agent is typically judged as monstrous rather than tragic. The Mandate is what separates the "tragic leader" from the "ruthless operator."
  *   **Vs. Moral Remainder:** Moral Remainder is the *ontological* fact that the wrong persists despite justification. The Scarring Mandate is the *sociological* mechanism for managing that fact. The Remainder is the debt; the Mandate is the requirement to show you are paying interest on it.
  *   **Vs. Atonement/Repentance:** Atonement implies the possibility of cleansing or repair ("I will make this right"). The Scarring Mandate explicitly rejects cleansing. The leader must say, in effect, "I would do this again, but I must not be at peace with it." If they seek to wash the stain away, they violate the Mandate.
  *   **Vs. Costly Signaling:** In evolutionary biology, costly signaling proves fitness by enduring a handicap. The Scarring Mandate is a form of moral costly signaling, but with a crucial difference: the signal must not appear *too* calculated. If the suffering is perceived purely as a signal, it loses its value (see "Instrumental Remorse" below).

  #### 2. Boundary Cases

  You asked for an analysis of where the mechanism stops and how it handles specific complications.

  **A. Instrumental Remorse (The Performance Trap)**
  *   *Scenario:* A leader displays suffering, but it is suspected they are doing so to secure re-election or historical vindication.
  *   *Analysis:* This violates the **Sincerity Condition** of the Scarring Mandate. The Mandate requires the suffering to be *authentic*, even if it is *mandated*. This is the central paradox: the agent is required to perform pain, but if the performance is detected as a performance, the payment is voided.
  *   *Verdict:* This is **Counterfeit Scarring**. It counts against the agent because it suggests they view the moral ledger as a game to be won rather than a burden to be borne. The public's detection of instrumentation converts the "payment" into "manipulation," deepening the distrust.

  **B. Excessive Duration (The Self-Indulgence Trap)**
  *   *Scenario:* A leader continues to express anguish over a decision years or decades after the fact, long after the public has moved on.
  *   *Analysis:* The Scarring Mandate has a **Dosage Limit**. The suffering must be proportional to the gravity of the act and the timeline of the community's healing. If the agent clings to the stain after the community is ready to reintegrate them, the scar becomes a spectacle.
  *   *Verdict:* This is **Moral Narcissism**. It shifts the focus from the victims or the public good to the agent's own moral sensitivity. The Mandate requires the agent to carry the burden *for the sake of the community's trust*, not for their own moral self-regard. When the suffering exceeds the social utility of the reassurance it provides, it violates the Mandate.

  **C. The Botched Act (The Error Trap)**
  *   *Scenario:* A leader commits a "dirty hands" act (e.g., betraying a source) believing it will save lives, but it turns out the intelligence was false and no lives were saved. The act was not necessary, merely botched.
  *   *Analysis:* The Scarring Mandate applies only to **Justified Violations**. It is a tax on *necessary* evil. If the act was not necessary (i.e., the consequentialist calculus fails), the agent is not entitled to the tragic status that the Mandate protects.
  *   *Verdict:* The Mandate **Collapses**. In this case, the suffering is not a "scar" of necessity but evidence of **Incompetence** or **Guilt**. The public is not looking for a tragic figure carrying a burden; they are looking for a responsible party to blame. Remorse here is not a payment for a hard choice; it is an admission of failure. The agent cannot claim the protection of the Mandate because the precondition (the necessity of the wrong) was not met.

  **D. Institutional Application (The Feeling Trap)**
  *   *Scenario:* A government agency or corporation commits a necessary evil. Institutions cannot feel insomnia or nightmares.
  *   *Analysis:* Institutions cannot satisfy the Scarring Mandate directly because they lack consciousness. However, they attempt to simulate it through **Ritual Apology** or **Structural Reform**.
  *   *Verdict:* This is **Proxy Scarring**. It is inherently unstable. An institutional apology often feels hollow because there is no "self" to carry the stain. To satisfy the Mandate, institutions often must sacrifice a *person* (a fall guy or a resigning CEO) to serve as the vessel for the suffering. If no individual bears the scar, the institution is often perceived as sociopathic, regardless of how many press releases are issued. The Mandate reveals a limit of collective agency: without a conscious agent to suffer, the ledger cannot be balanced.

  ### Summary of the Configuration

  The **Scarring Mandate** is the social technology we use to reconcile the necessity of power with the demands of morality. It acknowledges that some acts stain the soul, and that a leader who claims to be unstained after such an act is dangerous.

  *   **What it is:** A requirement for visible, sincere, non-instrumental suffering as a condition of reintegration.
  *   **What it is not:** A method of repair (atonement), a description of the act (dirty hands), or a license to indulge in guilt (narcissism).
  *   **Where it stops:** It stops when the act is revealed to be unnecessary (incompetence), when the suffering becomes performative (manipulation), or when the agent lacks the capacity to feel (institutions, unless a human proxy is provided).

  The Mandate ensures that the leader remains one of us—subject to the same moral gravity—rather than becoming a machine that processes lives without cost. The insomnia is the receipt.
