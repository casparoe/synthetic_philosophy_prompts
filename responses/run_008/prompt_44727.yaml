prompt: |-
  I'm the thermal and energy engineer at a mid-size colocation data center, and at least once a month I sit through a pitch or design review where somebody invokes "information is physical" to justify something. Last quarter a vendor told us that deleting our cold archive would meaningfully reduce heat output in the storage rows because erasing bits carries a thermodynamic cost, and a colleague countered that the real energy cost of storage is idle spin, controller overhead, and cooling inefficiency, not the physics of erasure at all. I was a physics minor a long time ago and have forgotten most of it, but I know just enough about Landauer's principle, the Szilard engine, and Bennett's resolution of Maxwell's demon (the demon's memory has to be reset eventually, and that's where the entropy bill comes due) to suspect that both of them are gesturing at something real while using it at scales where it can't possibly matter -- or maybe I'm wrong and I'm the one gesturing. My VP has also started quoting reversible computing at me as the reason our long-term energy budget can be optimistic. Please turn the actual physics and philosophy of information into a procedure my team can run in ten minutes during a design review: an ordered list of questions to ask of any thermodynamics-of-information claim, what counts as a sufficient answer to each, at which step the procedure should stop with a verdict like "this is not a physics argument, it's an engineering-economics argument," and where it has to hand the decision to a person because the question is one of values or business priorities rather than physics. Please mark honestly which steps are judgment calls dressed up as procedure. Then run the procedure on three claims we've actually heard: (1) deleting cold data releases heat we should account for in our cooling budget; (2) compressing logs before writing them to disk saves a meaningful fraction of our write energy; and (3) reversible or adiabatic logic will eventually let our compute energy drop toward zero, so we should factor that into five-year planning. For (3) especially, I want the procedure to distinguish what the second law actually permits from what's just an engineering aspiration -- I dont want to concede more to the demon than physics requires, but I also dont want to wave off a real ceiling if there is one.

  Please give it to me as a single JSON object with these fields: 'procedure', an array where each step is an object with 'step_number', 'question', 'sufficient_answer', 'insufficient_answer', 'judgment_call' (true/false), and 'if_failed' (what to do when the answer doesn't clear the bar); 'applications', an array with one object per claim above, each having 'claim', 'stopped_at_step', 'verdict', 'reasoning', 'what_the_physics_actually_says', and 'numbers_used' (the actual quantities you're comparing, e.g. the Landauer cost of erasing a bit at room temperature versus the real-world energy per bit of writing or storing one, with rough values -- if you can't pin a number, say so there instead of faking it); and 'limits', an array of strings describing what the procedure cannot settle and where a human just has to decide. Keep the reasoning strings plain enough that I can read them out loud in a design review without losing the room.
reasoning: |-
  Here's a thinking process that leads to the suggested JSON output:

  1.  **Analyze the Request:**
      *   **User Role:** Thermal and energy engineer at a mid-size colocation data center.
      *   **Problem:** Vendors/colleagues/VPs frequently invoke "information is physical" (Landauer's principle, reversible computing, etc.) to justify designs or budgets, often misapplying the physics at macroscopic engineering scales.
      *   **Task:** Create a 10-minute procedure (ordered list of questions) to evaluate thermodynamics-of-information claims during design reviews.
      *   **Requirements:**
          *   JSON format with specific fields (`procedure`, `applications`, `limits`).
          *   Procedure steps must include `step_number`, `question`, `sufficient_answer`, `insufficient_answer`, `judgment_call`, `if_failed`.
          *   Must identify where the argument shifts from physics to engineering-economics or values.
          *   Must apply the procedure to three specific claims: (1) deleting cold data releases heat, (2) compressing logs saves write energy, (3) reversible computing allows energy $\to$ 0.
          *   Must include actual numbers/comparisons (Landauer limit vs. real-world costs).
          *   Tone: Professional, technically accurate, plain enough to read aloud in a meeting.
          *   Honesty: Mark judgment calls honestly.

  2.  **Deconstruct the Physics:**
      *   **Landauer's Principle:** Erasing 1 bit of information dissipates at least $k_B T \ln 2$ energy as heat. At 300K, this is $\approx 3 \times 10^{-21}$ Joules.
      *   **Real-world Storage/Compute:** Modern DRAM/Flash/CPU operations consume orders of magnitude more energy per bit (picojoules to nanojoules). $1 \text{ pJ} = 10^{-12} \text{ J}$. The gap is roughly $10^9$ (nine orders of magnitude).
      *   **Reversible Computing:** Theoretically allows computation without energy dissipation *if* no information is erased. However, practical implementation requires error correction, clocking, and control, which currently consume far more than the Landauer limit. It's an asymptotic limit, not a near-term engineering reality.
      *   **Compression:** Reduces the number of bits written. If write energy is dominated by the physical act of switching transistors/spinning disks, writing fewer bits saves energy. But compression itself costs compute energy. Net gain depends on the ratio.
      *   **Idle vs. Active:** Most data center energy is cooling, idle power, and transmission losses, not the thermodynamic cost of bit flipping.

  3.  **Drafting the Procedure:**
      *   *Goal:* Filter out "physics washing" from legitimate engineering constraints.
      *   *Step 1: Scale Check.* Is the effect size comparable to the Landauer limit or the device limit?
      *   *Step 2: Dominant Loss Mechanism.* Is the claimed loss the bottleneck, or is it overhead (cooling, idle power, resistance)?
      *   *Step 3: Reversibility.* Is the operation actually logically reversible, or is it erasure?
      *   *Step 4: Implementation Overhead.* Does the mechanism to achieve the theoretical gain cost more than the gain?
      *   *Step 5: Time Horizon.* Is this a 5-year plan or a 50-year physics limit?
      *   *Step 6: Values/Business.* If physics allows it, does the business care? (Cost vs. Benefit).

      *Refining Steps for JSON:*
      *   Need to ensure `judgment_call` is marked true where engineering estimation is required, not just pure physics.
      *   Need to define the "stop" condition clearly (Physics vs. Economics).

  4.  **Drafting the Applications (The 3 Claims):**
      *   *Claim 1 (Deleting Cold Data):*
          *   Physics: Erasure costs $k_B T \ln 2$.
          *   Reality: Drive spin, controller, cooling dominate.
          *   Verdict: Fail at Step 1 or 2. Negligible heat.
          *   Numbers: Landauer $\approx 3 \times 10^{-21}$ J/bit. SSD Write $\approx 10^{-9}$ J/bit. Gap: $10^{12}$.
      *   *Claim 2 (Compression):*
          *   Physics: Fewer bits = less switching.
          *   Reality: Compression CPU cost vs. Write IO cost.
          *   Verdict: Pass physics, fail economics depending on ratio. This is an engineering trade-off.
          *   Numbers: Compression energy/bit vs. Write energy/bit.
      *   *Claim 3 (Reversible Computing):*
          *   Physics: Second law allows $\to 0$ *if* reversible.
          *   Reality: Error correction, clocking, current tech is irreversible.
          *   Verdict: Pass physics theory, fail engineering timeline (Step 5).
          *   Numbers: Current CMOS switching energy vs. Landauer limit.

  5.  **Drafting the Limits:**
      *   What can't this procedure do?
      *   It can't predict tech breakthroughs.
      *   It can't decide ROI.
      *   It can't account for carbon pricing vs. capex.

  6.  **Constructing the JSON:**
      *   *Constraint Check:* Single JSON object. No markdown outside the code block (actually, the prompt asks for "Please give it to me as a single JSON object", usually implying the response should *be* the JSON or contain it clearly. I will wrap it in a code block for validity).
      *   *Field Check:* `procedure`, `applications`, `limits`.
      *   *Sub-field Check:* `step_number`, `question`, `sufficient_answer`, `insufficient_answer`, `judgment_call`, `if_failed`.
      *   *Application Sub-field Check:* `claim`, `stopped_at_step`, `verdict`, `reasoning`, `what_the_physics_actually_says`, `numbers_used`.
      *   *Tone Check:* Plain English for reading aloud.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Claim 1:* The vendor claimed deleting data reduces heat. Actually, erasing *generates* heat (Landauer). But the vendor said deleting reduces heat output *in storage rows*. This implies they think storing bits holds heat? Or that erasing stops the drive from working? The prompt says "erasing bits carries a thermodynamic cost" was the vendor's justification for why deleting would reduce heat. Wait, if erasing costs energy, deleting *adds* heat. The vendor's logic is flawed. I need to make sure the JSON reflects that the vendor is confused about the sign or the magnitude. Actually, the prompt says "vendor told us that deleting our cold archive would meaningfully reduce heat output... because erasing bits carries a thermodynamic cost". This is contradictory. If erasing costs energy, deleting creates heat. Maybe they meant "keeping bits requires energy"? I will address the magnitude primarily, as that's the killer argument. The prompt implies the colleague countered with "idle spin". I will focus the procedure on magnitude comparison.
      *   *Correction on Claim 3:* The VP says "energy drop toward zero". Physics says *dissipation* drops toward zero for reversible ops, but total energy includes control. I need to be precise there.
      *   *Judgment Calls:* Step 1 (Scale) is physics. Step 2 (Dominant Loss) is engineering measurement (judgment). Step 5 (Time Horizon) is business strategy (judgment). I must mark these accurately.
      *   *Numbers:* Use $k_B T \ln 2 \approx 3 \times 10^{-21}$ J at 300K. CMOS switching $\approx 10^{-15}$ to $10^{-12}$ J. Disk write $\approx 10^{-9}$ J.

  8.  **Final Review against Constraints:**
      *   JSON validity (escape quotes, no trailing commas).
      *   All required fields present.
      *   Reasoning plain enough for a meeting.
      *   Honest marking of judgment calls.

  9.  **Final Polish:** Ensure the `limits` section captures the "values" aspect requested ("where a human just has to decide").

  *(Self-Correction on JSON Structure)*: The prompt asks for "a single JSON object". I will provide *only* the JSON object inside a code block to ensure it can be parsed directly, as per strict instruction interpretation, though usually, a little context is helpful. I will stick to the instruction: "Please give it to me as a single JSON object". I will output the JSON block directly.

  Wait, looking at the instruction "Please give it to me as a single JSON object with these fields...". I should ensure the text inside the JSON is clean.

  Let's assemble the steps.
  Step 1: Magnitude Check (Landauer vs. Device).
  Step 2: System Boundary (Bit vs. Cooling/Idle).
  Step 3: Reversibility Check (Is info actually erased?).
  Step 4: Implementation Cost (Does the fix cost more than the problem?).
  Step 5: Time Horizon (Now vs. Theoretical Limit).
  Step 6: Business Value (Is the saving worth the capex?).

  Let's assemble the applications.
  1. Delete Cold Data: Fails Step 1 (Magnitude).
  2. Compression: Passes Step 1, Stops at Step 4 (Implementation Cost/Engineering).
  3. Reversible Computing: Passes Step 1 (Theoretically), Fails Step 5 (Time Horizon/Engineering Reality).

  Let's assemble limits.
  - Tech breakthroughs.
  - Carbon vs Cost tradeoffs.
  - Risk tolerance.

  Okay, ready to write.
