      *   *Rights Constraint = Pre-Fader Mute or Hard Limit on Input.* You can't just turn a channel down to zero (sacrifice someone) to make the master bus look better, *even if* the total volume is louder. A rights constraint says "This channel must stay above -20dB no matter what the Master says."
      *   *Utility Monster = A Channel with Massive Gain.* One input is cranked to +48dB. It dominates the sum. The mix is just that one channel. Everyone else is in the noise floor.
      *   *The Audience = The "Good"?* In mixing, the goal is the audience's experience. In Utilitarianism, the "Total Utility" is the goal itself.

  5.  **Developing the Residue Report (The Critical Analysis):**

