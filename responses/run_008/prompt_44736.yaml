      *   *Distortions:* In mixing, we *want* to balance levels. Utilitarianism is accused of *not* caring about distribution. In mixing, clipping is technical failure; in philosophy, suffering is moral badness (not necessarily a system crash).
      *   *The Big Gap (The Audience):* A mix is *for* someone external (the audience). The "Total Utility" isn't experienced by a "Super-Person." There is no "Society Ear." This is the crux of the Separateness objection. The sum exists on a meter, but no one hears the "sum," they hear the result in their own ears.
      *   *Leftovers:* Does mixing vocab need to expand? Or is the philosophy vague? The philosophy is actually clearer here: the metaphor breaks because there is no "listener" for the total utility.

