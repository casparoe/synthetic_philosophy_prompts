  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't swing too far the other way and claim the *Discourse* is her *magnum opus* over the physics. The prompt asks for an audit, not a hagiography. I must admit where the pop-book is *partially* right (it is personal, it is about pleasure) but show why their *interpretation* of those facts is wrong.
      *   *Key Distinction:* The book treats "illusion" as *epistemic* (false belief). Du Châtelet treats it as *affective* (emotional framing). This is the pivot point.
      *   *Scholarly Reference:* Mentioning specific scholars (Zinsser, Reardon) adds weight to the "scholar would accept/reject" part of the prompt.

  6.  **Final Review against User Constraints:**
