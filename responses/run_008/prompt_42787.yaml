prompt: |-
  I'm a program officer at a family foundation that gives away about $15M a year. Last quarter the trustees, after some reading, rewrote our mission statement to say we exist to "secure the long-run flourishing of humanity." Nobody has told me what that means for my actual job, which is triaging ~120 letters of inquiry a quater, twenty minutes each, mostly from orgs I've never heard of. Write me a procedure I can actually run at that speed: the questions to ask in order, what counts as a good enough answer to each, where it ends in a decline, where it punts to the trustees because the question is one of values rather than facts, and which steps are really just judgment calls dressed up as procedure.

  The part I suspect matters most: the new mission statement is vague enough that it doesn't settle whether we think the far future merely matters or whether it dominates everything, and I'm fairly sure the trustees don't all mean the same thing by it. I'd want the procedure to surface that difference rather than paper over it — ideally it tells me which kinds of grants turn on it, so I know when to stop and ask.

  Then run it on three applications I more or less have on my desk right now: (1) $400k to train biosecurity fellows; (2) $60k for an adult literacy program in the city where we're headquartered (this one is politically untouchable, the founder's daughter is on the board and loves it); (3) $250k to digitize and preserve audio archives of endangered languages. And be straight with me — if the procedure gives an answer I won't like, especially on the literacy one, I want that answer anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and application analysis:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer at a family foundation.
      *   **Scale:** $15M annual giving (significant, but not Gates Foundation scale).
      *   **Workload:** ~120 Letters of Inquiry (LOIs) per quarter. That's roughly 10 per week.
      *   **Time Budget:** 20 minutes per LOI. This is *tight*. It means the procedure must be heuristic-driven, not deep-dive analysis.
      *   **The Problem:** Trustees rewrote the mission to "secure the long-run flourishing of humanity" (very longtermist/EA-adjacent language) without operational guidance.
      *   **The Tension:** The mission is ambiguous. Does "long-run flourishing" mean existential risk reduction (X-risk) dominates? Or does it allow for near-term welfare improvements that build resilience? The trustees likely disagree.
      *   **The Goal:** A triage procedure that fits the time limit, surfaces value conflicts, distinguishes facts from values, and identifies judgment calls.
      *   **The Test:** Apply this to three specific LOIs (Biosecurity, Adult Literacy, Language Archives).
      *   **Constraint:** Be honest, even if the answer is politically difficult (specifically regarding the Literacy program).

  2.  **Deconstruct the Mission Statement:**
      *   "Secure the long-run flourishing of humanity."
      *   *Interpretation A (Strong Longtermism):* The future is vast. Existential risk reduction is the priority. Near-term suffering matters only insofar as it affects the probability of extinction or trajectory change.
      *   *Interpretation B (Resilience/Capacity Building):* Flourishing requires capable institutions, educated populations, and cultural stability. Near-term improvements contribute to long-term stability.
      *   *Interpretation C (Status Quo/Philanthropy as Usual):* It sounds fancy, but we still want to help people now. (This is likely what some trustees think, while others are reading Nick Bostrom).

  3.  **Develop the Triage Procedure (The "20-Minute Filter"):**
      *   *Time Allocation:* 20 minutes is roughly 3-4 minutes per step if there are 5-6 steps.
      *   *Step 1: The Existential/Negative Screen (Fact-based).* Does this actively make things worse? (Easy decline).
      *   *Step 2: The Long-Run Mechanism (The Core Question).* How does this connect to the *long run*?
          *   Direct X-risk reduction? (Strong fit for Interpretation A).
          *   Institutional/Cultural resilience? (Fit for Interpretation B).
          *   Pure near-term welfare? (Weak fit for the new wording, requires Trustee decision).
      *   *Step 3: The Counterfactual/Scale (Impact).* Is this money marginal? Does it scale?
      *   *Step 4: The Value Flag (The "Trustee Punt").* Identify where the decision hinges on the A vs. B interpretation.
      *   *Step 5: The Political/Reality Check.* Acknowledge constraints (like the Literacy program).

      *Refining the Procedure for Speed:*
      I need a checklist that forces a "Pass," "Decline," or "Punt" decision quickly.
      *   *Question 1:* Does this reduce a plausible existential or catastrophic risk? (Yes = Strong Pass).
      *   *Question 2:* Does this build institutional/cognitive capacity that persists for generations? (Yes = Maybe).
      *   *Question 3:* Is this primarily immediate relief/welfare with no clear long-term mechanism? (Yes = Decline *unless* political constraint exists).
      *   *Question 4:* Is the theory of change speculative? (Yes = Punt to Trustees).

      *Addressing the "Judgment Calls Dressed as Procedure":* I need to explicitly label where the PO is making a call vs. following rules.

  4.  **Drafting the Procedure:**
      *   *Name:* The "Long-Run Triage Protocol" (LRTP).
      *   *Structure:* 4 Gates.
      *   *Gate 1: Negative Screening.* (Harm).
      *   *Gate 2: Temporal Horizon.* (When do benefits accrue?).
      *   *Gate 3: Mechanism Type.* (Risk Reduction vs. Capacity Building vs. Welfare).
      *   *Gate 4: The "Values Flag".* (Where do the trustees disagree?).

  5.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Biosecurity Fellows ($400k).**
          *   *Mission Fit:* High. Directly addresses catastrophic risk (pandemics).
          *   *Time Horizon:* Long-run (preventing extinction).
          *   *Verdict:* Strong Pass.
          *   *Nuance:* Is it *effective* biosecurity? (Fact check needed, but conceptually fits).

      *   **Case 2: Adult Literacy ($60k).**
          *   *Mission Fit:* Low/Debatable. Immediate welfare. Does literacy secure the *long-run* flourishing of humanity? Indirectly, maybe (better democracy, economic growth). But it's local and small scale.
          *   *Political Constraint:* Founder's daughter. Untouchable.
          *   *Procedure Output:* The procedure should flag this as a "Mission Mismatch" but acknowledge the "Political Veto."
          *   *Honesty:* I must tell the user the procedure says "Decline" based on the text, but reality says "Fund." I need to show how to document this discrepancy so the trustees see the tension.

      *   **Case 3: Language Archives ($250k).**
          *   *Mission Fit:* Ambiguous. Cultural preservation. Does losing a language threaten humanity's long-run flourishing?
          *   *Interpretation A (X-risk):* No.
          *   *Interpretation B (Cultural Resilience):* Maybe. Diversity of thought helps problem solving?
          *   *Verdict:* This is the perfect "Punt" case. It hinges entirely on whether "flourishing" includes cultural diversity or just survival/growth.

  6.  **Refining the Output:**
      *   *Tone:* Professional, cynical but constructive, direct. Acknowledge the absurdity of the situation (120 LOIs, vague mission).
      *   *Formatting:* Clear headers, bullet points, bold text for scannability.
      *   *The "Straight Talk":* Ensure the Literacy section doesn't sugarcoat the mission mismatch.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic for this procedure?
      *   *Adjustment:* Make the questions binary where possible. Don't ask for deep research. Ask "Does the LOI *claim* X?" not "Is X true?" (Verification comes later for the shortlist).
      *   *Critique:* Did I address the "Judgment Calls" requirement?
      *   *Adjustment:* Add a specific section labeling which steps are subjective.
      *   *Critique:* Did I handle the Literacy program honestly?
      *   *Adjustment:* Explicitly state that under the *new* mission, this is a decline, and the only reason to fund is political. The procedure should force that into the open.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Procedure for 20 mins/LOI? Yes.
      *   Questions in order? Yes.
      *   Where it ends in decline/punt? Yes.
      *   Surface trustee disagreement? Yes.
      *   Run on 3 apps? Yes.
      *   Be straight on Literacy? Yes.

      *(Self-Correction on Literacy)*: If I tell the PO to decline the Literacy program, they might get fired. I need to frame the procedure so it *identifies* the conflict, allowing the PO to say "This violates the mission, but I am instructed to fund it due to board preference," rather than just "Decline." Actually, the prompt asks me to be straight: "if the procedure gives an answer I won't like... I want that answer anyway." Okay, I will prioritize the procedure's logic over political safety, but add a note on how to manage the fallout.

      *(Refining the "Values Flag")*: The procedure needs a specific output category for "Trustee Decision Required."

      *(Final check on Biosecurity)*: $400k is a decent chunk. Is it too big for an LOI triage? The prompt says triaging LOIs. So this is a recommendation to move to full proposal or decline. I will treat the output as "Advance to Due Diligence," "Decline," or "Board Punt."

      *(Final check on Language)*: $250k. Similar to Biosecurity.

      Let's write it.

      *Wait, one more thing:* The prompt asks for "which steps are really just judgment calls dressed up as procedure." I need to be meta-cognitive about the procedure itself.

      *Okay, ready to draft.*
answer: |-
  Here is a triage procedure designed for your constraints (20 minutes/LOI, high volume, ambiguous mission) and your specific political reality.

  ### The "Long-Run Triage Protocol" (LRTP)

  **Time Budget:** 20 Minutes
  **Goal:** Sort into **Advance** (Due Diligence), **Decline**, or **Board Punt** (Values Conflict).
  **Premise:** You are not verifying facts yet. You are evaluating the *Theory of Change* (ToC) presented in the LOI against the mission's ambiguity.

  #### Step 1: The Negative Screen (3 Minutes)
  **Question:** Does the project plausibly increase existential or catastrophic risk, or actively undermine institutional resilience?
  *   **Look for:** Dual-use technology without safeguards, polarizing political advocacy that destabilizes governance, or dependency-creating aid models.
  *   **Pass:** No obvious red flags.
  *   **Fail:** Immediate **Decline**. (Document reason: "Mission Conflict - Negative Impact").
  *   **Judgment Call:** You are guessing based on the LOI text. You don't have time to verify.

  #### Step 2: The Temporal Horizon Test (5 Minutes)
  **Question:** When does the primary benefit accrue, and how long does it last?
  *   **Category A (Existential/Permanent):** Prevents a permanent loss of potential (e.g., pandemic prevention, AI safety). Benefit: Infinite duration.
  *   **Category B (Capacity/Generational):** Builds institutions, knowledge, or human capital that persists for decades/centuries (e.g., scientific research, governance reform, education *systems*).
  *   **Category C (Immediate/Transient):** Relieves suffering or improves life for current beneficiaries without a clear mechanism for persistence (e.g., direct cash, local services, arts/culture preservation).
  *   **Decision:**
      *   If **A**: **Advance**. (Strongest fit for "long-run flourishing").
      *   If **B**: **Advance to Step 3**.
      *   If **C**: **Decline** *unless* Step 4 applies.

  #### Step 3: The Scale & Substitutability Check (5 Minutes)
  **Question:** Is this funding marginal, and is the problem scalable?
  *   **Look for:** "We are the only ones doing this" or "This pilot leads to policy change at scale."
  *   **Look out for:** "We serve 50 people in [Your City]" with no path to broader impact.
  *   **Decision:**
      *   If the LOI admits it's a local service with no scaling mechanism: **Decline** (under the new mission).
      *   If the LOI claims systemic impact: **Advance to Step 4**.
  *   **Judgment Call:** You are taking their scaling claims at face value. This is a gamble.

  #### Step 4: The "Values Flag" (5 Minutes)
  **Question:** Does funding this require deciding between *Survival* (Risk Reduction) vs. *Quality* (Cultural/Human Welfare)?
  *   **The Conflict:** Your trustees likely split between "Longtermists" (Survival dominates) and "Traditional Philanthropists" (Flourishing means living well now).
  *   **Action:** If the project is **Category B** or **C** but has high prestige or political backing, do not Decline. Mark as **Board Punt**.
  *   **Required Notation:** You must attach a one-sentence "Values Note" to the file: *"Funding this prioritizes [Cultural Welfare/Local Politics] over [Existential Risk Reduction/Scalable Impact]."*

  #### Step 5: The Political Reality Check (2 Minutes)
  **Question:** Is there a known trustee preference or legacy constraint?
  *   **Action:** If Yes, override previous steps. Mark as **Directed Fund**.
  *   **Required Notation:** *"Mission Mismatch acknowledged. Funded due to [Trustee Name/Legacy Constraint]."*

  ***

  ### Where the Procedure is Lying to You (Judgment Calls)
  1.  **Step 1 (Negative Screen):** You cannot know if a biosecurity project is actually safe in 3 minutes. You are judging *competence signaling*, not safety.
  2.  **Step 2 (Temporal Horizon):** Classifying "Literacy" as Category C (Immediate) vs. Category B (Capacity) is subjective. A longtermist says C (people die anyway). A traditionalist says B (educated citizens build better futures). **This is where you will surface trustee disagreement.**
  3.  **Step 3 (Scale):** Most LOIs lie about scalability. You are filtering for *narrative* scalability, not actual scalability.

  ***

  ### Application of the Protocol to Your Three LOIs

  Here is the straight talk on how these three land using the LRTP.

  #### 1. Biosecurity Fellows ($400k)
  *   **Step 1 (Negative):** Pass. Intent is risk reduction.
  *   **Step 2 (Horizon):** **Category A (Existential/Permanent).** Preventing a pandemic that could kill millions or destabilize civilization directly secures the "long-run."
  *   **Step 3 (Scale):** High. Training fellows creates a workforce that scales across governments/labs.
  *   **Step 4 (Values Flag):** None. This is the one thing all interpretations of "long-run flourishing" agree on.
  *   **Step 5 (Politics):** No known constraints.
  *   **LRTP Verdict:** **ADVANCE.**
  *   **Comment:** This is the safest grant you can make under the new mission. It aligns the Longtermists and the Traditionalists (everyone likes stopping plagues). Do not hesitate here.

  #### 2. Adult Literacy Program ($60k, Headquartered City)
  *   **Step 1 (Negative):** Pass.
  *   **Step 2 (Horizon):** **Category C (Immediate/Transient).** The LOI likely focuses on individuals getting jobs/reading now. The beneficiaries will die. The program is local. It does not structurally alter the trajectory of humanity.
  *   **Step 3 (Scale):** Low. It serves a specific cohort in your city.
  *   **Step 4 (Values Flag):** **HIGH.** Funding this asserts that "flourishing" means "helping people near us now" rather than "saving the future."
  *   **Step 5 (Politics):** **CRITICAL.** Founder's daughter. Board member.
  *   **LRTP Verdict:** **DECLINE (Procedurally) / DIRECTED FUND (Politically).**
  *   **The Straight Talk:** Under the written mission statement ("long-run flourishing of humanity"), this is an indefensible grant. It is too small, too local, and too near-term. If you run this foundation like an Effective Altruist fund, you cut this tomorrow.
      *   **However:** If you decline this, you may lose your job or create a board schism.
      *   **Recommendation:** Process this as a **Directed Fund** (Step 5). You must explicitly write the "Mission Mismatch" note. Do not let this slide through as a "merit" grant. When the board asks why you funded a local literacy program while the mission says "humanity's long run," you need the paper trail showing you flagged it as a *political constraint*, not a *programmatic fit*. This protects you when the Longtermist trustees inevitably ask, "Why are we doing this?"

  #### 3. Endangered Language Archives ($250k)
  *   **Step 1 (Negative):** Pass.
  *   **Step 2 (Horizon):** **Category B (Capacity/Generational).** Preserving knowledge *could* be argued as long-term, but it's weak.
  *   **Step 3 (Scale):** Low. It's preservation, not growth.
  *   **Step 4 (Values Flag):** **CRITICAL.** This is the perfect wedge issue.
      *   *Trustee Group A (Longtermists):* "Does saving a language prevent extinction? No. Decline."
      *   *Trustee Group B (Humanists):* "Flourishing requires cultural diversity and meaning. If we lose languages, we lose cognitive tools for the future. Fund."
  *   **Step 5 (Politics):** Unknown.
  *   **LRTP Verdict:** **BOARD PUNT.**
  *   **The Straight Talk:** Do not make this decision yourself. This grant turns entirely on the definition of "Flourishing."
      *   **Your Memo to Trustees:** "This project does not reduce existential risk. It funds cultural preservation. Funding this signals that we value *cultural diversity* as a component of long-run flourishing, even without a direct survival mechanism. Please confirm if this aligns with the new mission."
      *   **Why this helps you:** It forces the trustees to have the argument they are avoiding. If they fund it, they have implicitly narrowed the mission to include cultural humanism. If they decline, they have narrowed it to existential risk. Either way, you get guidance for the other 117 LOIs.

  ### Summary of Action
  1.  **Biosecurity:** Move to due diligence immediately. It's the only uncontroversial "Yes."
  2.  **Literacy:** Mark as "Board Directed." Document the mission mismatch clearly. Do not pretend it fits the new strategy.
  3.  **Language:** Punt to the Board with a specific question about "Cultural Diversity vs. Existential Risk."

  This approach keeps you within your 20-minute limit, protects you from political blowback on the literacy grant, and forces the trustees to resolve the ambiguity in their own mission statement using the language grant as the test case.
