answer: |-
  This is a splendid puzzle. Your student has essentially reconstructed the **Lucas Critique** (1976) and the **Policy Ineffectiveness Proposition** (Sargent & Wallace, 1975) using eighteenth-century materials. It is a testament to the rigor of Hume's quantity theory that it can sustain this kind of pressure.

  The argument is valid, but it is not sound. To preserve Hume's coherence (and indeed, to preserve the economic logic), you must reject **Step (3)**.

  Here is the diagnosis of why that step fails, why it looked irresistible, and what you must surrender to abandon it.

  ### The Diagnosis: Reject Step (3)

  **Step (3) claims:** *A government can arrange a long sequence of small injections of money, each individually too small to move anyone's expectations, so that at any given moment the economy has recently received an injection whose price effects have not yet been absorbed.*

  This is the breaking point. The argument treats the "interval" described in Step (1) as a physical friction (like the time it takes for a ship to sail from Cadiz to London) that can be perpetually reset by a clever pilot. But Step (2) correctly identifies that the interval is epistemic: it lasts only as long as the increase is **unanticipated**.

  Step (3) fails because it attempts to institutionalize surprise. It proposes a *system* of surprises. But if the injections are a "long sequence" arranged by the government, they constitute a **policy regime**. Economic agents (merchants, manufacturers, workers) are not passive vessels; they are Humean actors driven by custom and experience. If the government injects money in January, and again in March, and again in May, custom will teach the merchants to expect an injection in July.

  Once the expectation forms, the "interval" collapses. Prices rise *in anticipation* of the money arriving, not merely after it circulates. By trying to make the stimulus permanent, the government destroys the very condition (unanticipated money) that makes the stimulus work.

  ### Why Step (3) Looked Irresistible

  It looked irresistible because it exploits a tension between **exogenous shocks** and **endogenous policy**, a distinction Hume gestures at but does not formalize with modern game-theoretic precision.

  1.  **The "Discovery of a Mine" Analogy:** Hume's paradigmatic case for the beneficial interval is the accidental discovery of a gold mine or a windfall from foreign trade. This is a one-off, exogenous shock. In that scenario, Step (3) holds: you can't expect a random accident. Your student's argument seductively substitutes the *state* for *fortune*. It assumes the state can act like a random number generator, dispensing money without creating a pattern.
  2.  **Technocratic Hubris:** The step assumes a level of informational asymmetry that favors the state. It assumes the government knows the "threshold" of expectation better than the market does. It presumes the state can inject money *below the radar* of the merchant class indefinitely. In Hume's world, where news travels through coffee houses and credit depends on reputation, this secrecy is implausible.
  3.  **Confusion of Stock and Flow:** It treats the money supply as a flow that can be turned on and off without altering the stock expectations. But in a credit economy (which Hume is warning about), the *promise* of future money is itself a form of money. If agents believe the government *will* inject money next month, they spend today on credit. The price rise happens now, not next month.

  ### The Cost of Rejecting Step (3)

  If you reject Step (3), as you must, there are costs both in economic theory and in Hume interpretation.

  #### 1. The Economic Cost: The End of the Free Lunch
  By rejecting (3), you concede that there is no **permanent** trade-off between inflation and real industry. This is the core of the Rational Expectations revolution.
  *   **What you give up:** You must abandon the hope that monetary policy can be used as a permanent "engine of prosperity." You accept that monetary stimulus is a one-time trick (or a short-term palliative during a liquidity trap, though Hume didn't conceive of that).
  *   **What you gain:** You save Hume from the charge of inconsistency. His warning against paper credit is not just moralistic; it is structurally necessary. If you try to keep the stimulus going (as Step 3 suggests), you inevitably trigger the price rises without the industrial benefit, leading to the "ruin" Hume predicts.

  #### 2. The Interpretive Cost: Hume's Skepticism of Statecraft
  This is the more profound cost for your seminar. To reject (3) is to lean heavily on Hume's philosophical skepticism.
  *   **The Qualification:** You must interpret Hume's "interval" not just as a macroeconomic mechanism, but as a limit on **political knowledge**. Hume does not believe ministers possess the "delicacy" required by Step (3). In *Of the Jealousy of Trade* and *Of the Balance of Trade*, Hume consistently argues that the "natural course of things" is smarter than the "refinements" of politicians.
  *   **The Textual Evidence:** In *Of Money*, Hume writes: *"It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry."* He treats this as a transitional state, like a fever that indicates the body is fighting an infection, not a state of health to be maintained. To try to maintain the fever is to kill the patient.
  *   **The Moral Psychology:** Hume believes human nature is constant. If you give politicians a tool that *seems* to create prosperity (Step 3), they will inevitably overuse it. They will not stop at "calibrated inflation." They will slide into the "multiplication of paper credit" he condemns. Therefore, even if Step (3) were theoretically possible in a vacuum, Hume would reject it on **public choice** grounds. The incentive structure of the state makes the "delicacy" impossible to sustain.

  ### A Secondary Defense: Rejecting Step (6)

  While Step (3) is the logical weak point, there is also a normative error in **Step (6)**: *"Such a state has reason to pursue the policy indefinitely: continuous, calibrated inflation is a standing engine of prosperity."*

  Even if Step (3) worked (i.e., even if you could trick the market forever), Hume would still reject Step (6).
  *   **Industry vs. Virtue:** For Hume, industry is a good, but it is not the *summum bonum*. In *Of Refinement in the Arts*, he links industry to virtue, but in *Of Public Credit*, he links financial manipulation to the corruption of the constitution.
  *   **Stability:** Hume values the stability of expectations. A policy that relies on keeping the population in a state of mild confusion (perpetually unaware that prices have adjusted) is inimical to the rule of law and the security of property. Hume's ideal is a society where contracts are secure, not one where the state is constantly adjusting the value of the unit of account to "spur" activity.
  *   **The Cost:** Rejecting (6) requires you to argue that Hume is not a utilitarian maximizer of GDP. He is a virtue ethicist who sees economic stability as a precondition for political liberty. The "horror" mentioned in Step (7) is not just about economic ruin, but about the transformation of the state into a "projector" (a gambler/schemer), which undermines the trust necessary for civil society.

  ### Recommendation for the Seminar

  I advise you to validate the student's insight—it is brilliant— but show them how Hume's own premises contain the seeds of its refutation.

  1.  **Grant (1) and (2):** Keep the "interval" and the "expectations" mechanism. This preserves the sophistication of Hume's theory.
  2.  **Attack (3) via Hume's Skepticism:** Ask the class: *Can a government keep a secret from the market forever?* Hume's answer is no. Merchants are vigilant about their profits. If money is cheap, they will ask why. If they suspect the state is printing, they raise prices immediately.
  3.  **Introduce the "Lucas Critique" Anachronistically:** Explain that in the 1970s, economists thought exactly what your student thinks. They thought they could trade higher inflation for lower unemployment permanently (the Phillips Curve). Then they realized that once the policy became standard, expectations adjusted, and the benefit vanished while the inflation remained. Hume anticipated this: he knew that "artificial" stimuli lose their power once they become "customary."
  4.  **Close with the Moral Hazard:** Even if the technocrats *could* pull off Step (3), Hume would forbid it. Why? Because it gives the state a dangerous power. In *Of Public Credit*, Hume argues that easy financing allows governments to wage wars they cannot afford and burden posterity. The danger is not just economic error; it is political tyranny.

  **Summary:** The student's argument fails because it tries to **routinize the exceptional**. Hume's "interval" is a benefit of *accidental* wealth, not *managed* credit. To manage it is to destroy it. By rejecting Step (3), you preserve Hume's quantity theory, his skepticism of statecraft, and his moral warning against paper credit, without sacrificing the insight of the "interval."
