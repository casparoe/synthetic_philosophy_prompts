answer: |-
  # Joint Statement on AI Takeoff Dynamics: Adversarial Collaboration

  **Date:** October 26, 2023
  **Parties:** Proponent of Continuous Takeoff (CT) | Proponent of Discontinuous Takeoff (DT)
  **Subject:** Resolution of Epistemic Status regarding AI Development Trajectories

  ## 1. Agreed Claims

  Both parties affirm the following substantive claims as the baseline for this disagreement. We acknowledge that while we agree on these facts, we assign different likelihoods to the implications drawn from them.

  1.  **Scaling Validity:** The 2012–2022 period demonstrated robust scaling laws where capability gains tracked increases in compute, data, and algorithmic efficiency, absent a recursive self-improvement (RSI) loop.
  2.  **Principle of RSI:** There is no known law of physics preventing an intelligent system from improving its own source code or architecture; the disagreement lies in the *speed* and *economic impact* of such improvements, not their physical possibility.
  3.  **Definition of Transformative AI (TAI):** We define TAI as the advent of AI systems that cause economic growth rates to double or confer decisive strategic advantage to the deploying entity, regardless of whether this occurs via a "hard" singularity or gradual integration.
  4.  **Epistemic Status of the Deep Learning Era:** The 2012–2022 era is the primary empirical dataset available for forecasting. We agree it is probative, but disagree on whether it represents the *baseline slope* of intelligence (DT) or evidence of *binding non-cognitive bottlenecks* (CT).
  5.  **Uncertainty Acknowledgement:** Both sides acknowledge that current models are extrapolations from a single historical trajectory (human evolution + recent ML) and that confidence intervals on takeoff speeds remain wide enough that policy should account for both scenarios.

  ## 2. Disagreements Table

  | id | disagreement | crux | shared_evidence | continuous_prediction | discontinuous_prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **RET-01** | Returns on cognitive investment are diminishing (log-linear) vs. increasing (convex). | Is the curve of "intelligence invested vs. intelligence gained" roughly log-linear or convex? | Algorithmic progress vs. Compute spend (2012–2022). | Gains require exponentially more resources; progress slows as low-hanging fruit is picked. | Gains compound; better AI designs make finding better AI designs disproportionately easier. |
  | **BOT-02** | Non-cognitive bottlenecks (data, physics, deployment) will throttle the feedback loop vs. cognitive bottlenecks are the only binding constraint. | Do physical/data constraints limit the cycle time of self-improvement? | Robotics deployment timelines & Drug Discovery AI. | Cycle times remain long (months/years) due to real-world data collection and testing. | Cycle times collapse (days/hours) as simulation and synthetic data replace physical verification. |
  | **PAR-03** | Parallel copies of human-level AI researchers can substitute for serial cognitive depth vs. they cannot. | Can 1,000 copies of an AI researcher solve a deep insight problem 1,000x faster? | GitHub Copilot adoption rates vs. Mathematical breakthrough rates. | Parallelism helps engineering, but breakthroughs require serial depth; speedup is sublinear. | Parallelism allows massive search over solution space; speedup is near-linear or superlinear. |
  | **ANC-04** | The gap between Human-Level AI (HLAI) and AI-that-Automates-AI-Research (AI-RA) is large vs. small. | How much capability headroom exists between "doing research" and "improving the researcher"? | Time from "Human-level on benchmarks" to "Automating ML Engineering". | HLAI can do the work, but not optimize the process; gap is years of capability growth. | HLAI implies the ability to introspect and modify; gap is months or weeks of optimization. |
  | **HIS-05** | The 2012–2022 era is evidence of bottlenecks (no loop) vs. evidence of potential slope (with loop). | Is the pre-RSI era uninformative about the post-RSI regime? | The 2012–2022 Deep Learning scaling period. | This era proves progress is possible without RSI, but adding RSI won't change the bottleneck constraints. | This era proves the slope is steep; adding RSI turns a steep slope into a vertical wall. |

  ## 3. Verbal Disputes and Dissolution

  Upon review, we identify two areas where the disagreement is partially verbal, stemming from inconsistent definitions rather than divergent models of the world.

  1.  **"Continuous" vs. "Discontinuous":**
      *   *Issue:* The CT proponent often defines "continuous" as "economic integration happens before superintelligence," while the DT proponent defines "discontinuous" as "capability jumps happen faster than societal adaptation."
      *   *Resolution:* These are compatible. A capability jump can be discontinuous (months) while economic integration is continuous (years). We agree to distinguish **Capability Takeoff Speed** (how fast the AI gets smarter) from **Impact Takeoff Speed** (how fast the world changes). Our core disagreement is about Capability Takeoff Speed.
  2.  **"Intelligence":**
      *   *Issue:* CT often refers to "intelligence" as a bundle of specific skills (coding, lab work), while DT refers to it as a general optimization pressure.
      *   *Resolution:* We agree to operationalize "intelligence" in this context as **the ability to reduce loss on a target function per unit of compute.** This removes ambiguity about whether "insight" counts as intelligence.

  **Reasoning:** These distinctions matter because the CT side concedes that software can improve quickly (Capability) but argues the world won't change quickly (Impact). The DT side argues that if Capability is fast enough, Impact is forced to be fast. Clarifying this narrows the dispute to the *feedback loop cycle time* (Table Row BOT-02) rather than the definition of transformation.

  ***

