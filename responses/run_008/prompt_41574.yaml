      *   *Distinction:*
          *   Loving Saint: Finds happiness in being moral. Doesn't feel sacrifice.
          *   Rational Saint: Recognizes non-moral interests but subordinates them to morality out of duty.
          *   *Student's Interpretation:* The student claims Wolf targets the Rational Saint because the Loving Saint is *more* admirable. *Correction:* Wolf argues *neither* is an ideal. The Loving Saint is arguably *more* problematic for the "ideal human" question because they lack non-moral interests entirely, making them boring or one-dimensional. The student has this backwards or oversimplified.
      *   *Two Strands of Argument:*
          1.  Crowding out non-moral virtues (wit, humor, refinement).
          2.  No room for personal projects (life lacks specific shape/identity).
      *   *The "Curator Saint" Counterexample:*
          *   *Concept:* A saint whose moral duty *is* to promote non-moral goods (art, humor, tennis).
          *   *The Trap:* Wolf anticipates this. She argues that even if the saint promotes these things, they do so *for the sake of morality*, not for their own sake. The *motivation* is the problem. The saint loves tennis *because it is moral*, not because they love tennis. This lacks the "non-moral passion" required for a well-rounded life.
          *   *Student's Evaluation:* Claims the Curator refutes Wolf because the goods exist in the life. Misses the point about *motivation* and *internal perspective*. Claims Wolf argues sainthood is *impossible*. (Wolf argues it's *undesirable*, not necessarily impossible, though she hints at psychological difficulty).

  3.  **Evaluate the Student Essay:**
