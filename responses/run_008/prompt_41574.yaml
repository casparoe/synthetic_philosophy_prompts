      *   *Claim 3:* "Wolf clearly intends the rational saint as the real target... since someone who helps only from duty is less admirable..." -> **Misinterpretation.** Wolf worries the Loving Saint is *too* one-dimensional. She doesn't privilege the Loving Saint as the ideal; she says neither is ideal.
      *   *Claim 4:* "...paper is best read as an attack on Kantian moral motivation." -> **Oversimplification.** It's an attack on the *ideal* of moral perfection, applicable to Utilitarianism and Kantianism, though the Rational Saint sounds Kantian.
