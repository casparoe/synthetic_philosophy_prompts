answer: |-
  **Grade: C+**

  **General Note:** You have correctly identified the basic definitions of Wolf's two saints and the two main strands of her argument. However, your interpretation of Wolf's central thesis is inaccurate, and your evaluation of the "Curator Saint" case misses the crucial distinction Wolf draws between the *content* of an action and the *motivation* behind it. In an upper-level seminar, I expect you to engage with the structure of the moral point of view, not just the schedule of the moral agent.

  **Point-by-Point Comments:**

  *   **"Wolf's central claim in 'Moral Saints' is that moral sainthood is impossible for human beings."**
      *   **Correction:** This is a significant misreading. Wolf's thesis is that moral sainthood is *undesirable* (not an ideal human life), not that it is strictly *impossible*. She argues we *could* be saints, but we shouldn't want to be. This error undermines your entire framing of the essay.

  *   **"Wolf clearly intends the rational saint as the real target of her argument, since someone who helps only from duty is less admirable than someone who helps from love..."**
      *   **Critique:** This inference doesn't follow. Wolf argues that *neither* saint is an ideal. In fact, she suggests the Loving Saint might be *more* problematic for her thesis because they are psychologically coherent, yet still lack the non-moral interests required for a well-rounded life. You treat the Loving Saint as a successful ideal, which Wolf explicitly denies.

  *   **"...so the paper is best read as an attack on Kantian moral motivation."**
      *   **Critique:** This is too narrow. While the Rational Saint sounds Kantian, Wolf's critique applies equally to Utilitarianism (which often generates the Loving Saint model). Her target is the *ideal of moral perfection* itself, regardless of the normative ethical framework used to achieve it.

  *   **"Turning to the curator saint: this case is clearly a counterexample to Wolf."**
      *   **Critique:** You assert this rather than arguing for it. Wolf anticipates this move. The mere presence of non-moral goods in the saint's life does not refute Wolf if the *reason* for pursuing them remains purely moral.

  *   **"The curator's life contains humor, music, and tennis, so it is simply false that moral sainthood crowds out non-moral goods."**
      *   **Critique:** This misses the point of the "crowding out" argument. Wolf isn't just counting activities; she is analyzing the *point of view*. If the Curator plays tennis *only because morality demands it*, she does not love tennis in the way required for the non-moral virtue of "playfulness" or "passion." The non-moral good is present externally, but not internally.

  *   **"Wolf's argument assumes that moral commitment and non-moral excellence must compete with one another, but the curator shows they can cooperate..."**
      *   **Critique:** Wolf's argument is not about time-management competition; it is about the *structure of the will*. The competition is between "doing X because it is right" and "doing X because I love it." The Curator still subordinates the non-moral to the moral, which preserves Wolf's worry about one-dimensionality.

  *   **"Therefore moral sainthood is desirable after all, and we should each try to become as close to a curator saint as we can."**
      *   **Critique:** This conclusion does not follow from your premises. Even if the Curator has a fuller schedule, if her motivation is uniformly moral, she still lacks the "non-moral passion" Wolf identifies as essential for an ideal life. You have shown the Saint can be *busy*, not that she can be *well-rounded*.

  *   **"Wolf would have to concede that her ideal of the balanced person, with moral concern as one strand among many, is not the only attractive ideal."**
      *   **Critique:** You seem to have reversed Wolf's position. Wolf *argues for* the ideal of the balanced person *against* the Moral Saint. She would agree that the Curator Saint is not the only attractive ideal; she argues the Curator Saint is *not* an attractive ideal at all, precisely because the "moral strand" still dominates the others.

  ***

  **Note on the Essay Prompt:**

  The prompt itself is **sound** and does not require revision. The "Curator Saint" case is a standard and effective philosophical test case for Wolf's view. It forces students to distinguish between the *extension* of moral action (what gets done) and the *intension* of moral motivation (why it gets done).

  The student's failure to grasp the prompt's nuance is a comprehension issue, not a flaw in the question. The prompt explicitly asks: *"Does the curator saint refute Wolf, or does she concede Wolf's point while trying to occupy it?"* This second option ("concede... trying to occupy it") is the philosophically richer path. It invites the student to argue that even if the Curator promotes non-moral goods, she does so from a moral perspective, thereby confirming Wolf's worry that the moral perspective dominates the personality. The student ignored this option in favor of a surface-level reading. I would keep the question for next year; it successfully discriminates between students who have memorized the text and those who understand the underlying argument about moral point-of-view.
