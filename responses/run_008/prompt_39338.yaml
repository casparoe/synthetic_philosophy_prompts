      *   *Nuance:* The prompt asks about the claim that process supervision resists Goodharting. In NCLB, local process supervision (principals evaluating teachers) *also* Goodharted (friendship bias, covering up cheating). This suggests process supervision is only robust if the *process evaluator* is aligned and uncorruptible. This is a strong point for the "Episode $\to$ Theory" direction.
