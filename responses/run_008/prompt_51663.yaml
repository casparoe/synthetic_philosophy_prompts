          *   Elena: She violates the norm she invokes. Her will is divided.
          *   Marcus: She treats the subordinate differently for the same act. It's arbitrary discrimination.
          *   *Nuance:* Marcus might argue Elena's view is too internal. Elena might argue Marcus's view misses the *authority* aspect.
      *   **Case 2: The Reformed Wrongdoer:**
