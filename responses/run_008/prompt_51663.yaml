answer: |-
  **The Standing to Blame: A Dialogue**

  **Participants:**
  *   **Elena:** Defends the Commitment-Based Account.
  *   **Marcus:** Defends the Unfairness-Based Account.

  **Setting:** *A quiet corner of a university faculty lounge. The conversation has been recorded for a feature article on the ethics of hypocrisy.*

  ***

  **Elena:** Let's start with the intuition we're trying to capture. When the pot calls the kettle black, we don't just think the pot is annoying. We think the pot loses its *authority*. It's not that the kettle didn't do wrong; it's that the pot isn't the one to say it. My view is that this loss of authority is internal to the blamer. Blame is a moral demand. It says, "You must align your will with this reason." But you can't coherently demand alignment with a reason you are currently flouting. By blaming, you present yourself as committed to the norm. By violating it, you show you aren't. That contradiction strips the demand of its force.

  **Marcus:** I see the appeal, Elena. It makes hypocrisy a kind of logical error. But I think you're looking at the wrong relationship. The problem isn't the hypocrite's internal consistency; it's how she treats the person she's blaming. When I blame you, I'm invoking a standard. If I exempt myself from that standard while enforcing it against you, I'm treating you unfairly. I'm saying, "Rules for thee, but not for me." That discrimination is what undermines the complaint. It's not that I lack the authority; it's that I've forfeited it by abusing the平等 (equality) required for moral address.

  **Elena:** But "unfairness" feels too contingent. Suppose I'm a hypocrite in secret. No one knows I break the rule I'm enforcing. On your view, am I still blaming unfairly?

  **Marcus:** If no one knows, the comparative injustice is hidden, but it still exists. I'm still making an exception for myself. But let's stop theorizing in the abstract. You have cases for your article. Let's run our views against them. Start with the obvious one: The Manager.

  **Elena:** Fine. A manager who routinely pads her expense reports admonishes a subordinate for doing the exact same thing.

  **Marcus:** Verdict: She has no standing. My explanation is straightforward. She is applying a penalty to the subordinate for a behavior she permits herself. That is textbook discrimination. She creates a class of "people who get punished for this" and ensures she isn't in it.

  **Elena:** I agree with the verdict, but I disagree on the *why*. It's not about the comparison to the subordinate. Imagine the manager padded her expenses but *never* had a subordinate to blame. She'd still be a liar. The specific wrong of hypocrisy arises the moment she tries to speak. By admonishing the subordinate, she implicitly asserts, "We are both bound by this rule." But her own will contradicts that assertion. She is trying to bind the subordinate to a norm she has unbound herself from. The contradiction is in her voice, not just in the distribution of punishment.

  **Marcus:** But notice what your view implies. It implies that if the manager stopped padding her expenses *today*, her standing would be instantly restored, even if she never acknowledged the past unfairness to the subordinate.

  **Elena:** If her will is genuinely realigned? Yes.

  **Marcus:** That leads us to Case Two. The Reformed Wrongdoer. A former embezzler, served his time, now teaches financial ethics, and sharply criticizes a colleague's fraud. Most people feel he *does* have standing. Maybe even more than someone who never struggled.

  **Elena:** My account handles this cleanly. The barrier to standing is the misalignment of the will. Once he reforms, his will is aligned with the reasons he cites. He is no longer contradicting himself. In fact, his past might make his commitment more robust. So, yes, my theory delivers the verdict we want: The reformed wrongdoer gets his voice back.

  **Marcus:** Here is where I have to sweat. On a strict unfairness account, the past matters. He *did* exempt himself from the rule previously. If standing is about fair relations, that history of unfairness should linger. If I cheated on our taxes last year, can I fairly demand you pay yours this year? Intuitively, yes. But strictly speaking, I'm still benefiting from a system I undermined while demanding you uphold it.

  **Elena:** So your theory gets the wrong result?

  **Marcus:** Not necessarily. I need a patch. The unfairness isn't in the *history*; it's in the *implication of the current act*. If the reformed embezzler blames the colleague while implying, "I am better than you," that's unfair. But if he blames from a place of shared fallibility—"I know how hard this is, but we must do it"—the discrimination vanishes. He isn't claiming an exemption anymore. So, I can save the verdict, but I have to add a condition: The reformed blamer must acknowledge the past to neutralize the unfairness.

  **Elena:** That's a significant concession, Marcus. You're admitting that the unfairness isn't objective; it depends on how the blame is framed.

  **Marcus:** I'm admitting that moral standing is relational. But let's move to the case that I think troubles *both* of us. The Beneficiary.

  **Elena:** The woman living off a family fortune built on slavery or exploitation. She personally did nothing wrong. She didn't own slaves; she didn't commit fraud. She just inherited the money and now denounces the practices that built it. Yet, when she speaks, people bristle. She seems compromised.

  **Marcus:** My view explains this reasonably well. She is benefiting from the wrongdoing she condemns. She effectively says, "This practice is abhorrent," while her comfort depends on its continuation in the past. It's a structural unfairness. She wants the moral purity of condemnation without the material cost of restitution.

  **Elena:** But does she? Suppose she donates all the money. Suppose she gives it away tomorrow. Does her standing return?

  **Marcus:** Likely, yes. Which suggests the barrier was the benefit, not the act.

  **Elena:** And that's where my view stalls. She hasn't *willed* the wrongdoing. She didn't choose the fortune. Her will isn't misaligned with the norm she advocates; she genuinely wants the norm to hold. She isn't contradicting herself. So, on my Commitment Account, she should have full standing. But she doesn't. People hear her condemnation and think, "Who are you to say?"

  **Marcus:** So you concede the Commitment Account fails here?

  **Elena:** I have to. It seems there are forms of compromised standing that aren't about the blamer's current will. It suggests standing might be tied to *complicity*, not just *contradiction*. But if I concede that, I'm moving toward your territory—toward the relationship between the blamer and the history of the harm.

  **Marcus:** And I should concede that my view struggles too. If she gives the money away, is the unfairness gone? Or is it that she represents a system? It feels like neither "inconsistency" nor "unfairness" fully captures the taint of unearned privilege. We might need a third category: *Clean Hands*.

  **Elena:** Let's hold that thought. I want to press you on something deeper than the cases. You say standing is lost because of a defect—either in my will or my fairness. If it's a defect in *me*, essentially a right I've lost, then shouldn't the person I'm blaming be able to waive it?

  **Marcus:** Go on.

  **Elena:** If I owe you money, you can say, "Keep it." You waive your right to repayment. If my standing to blame is just a normative power I hold over you, and hypocrisy damages that power, why can't you say, "I know you're a hypocrite, but I authorize you to blame me anyway"?

  **Marcus:** Exactly. That's my challenge to you. If lost standing were just a defect in the hypocrite, it should be waivable by the wrongdoer. But it's not. If a corrupt judge sentences me, I can't say, "It's okay, you have my permission." The sentence is still invalid. The standing isn't just about me and you; it's about the *norm*.

  **Elena:** That is a serious problem for my view. If the problem is my internal contradiction, why does your forgiveness not fix it?

  **Marcus:** Precisely. It suggests standing isn't a property of the blamer at all. It's a public good.

  **Elena:** I won't concede that far. But I will distinguish between a *right* and a *condition of speech*. When I blame, I'm not just making a claim against you; I'm speaking for the moral community. If I'm a hypocrite, I'm like a translator who doesn't speak the language. You can waive your right to a good translation, but you can't make me speak French if I only know German. The incoherence is objective. Your waiver doesn't fix my inability to coherently embody the norm I'm citing.

  **Marcus:** But the wrongdoer doesn't care about the moral community. He cares about *you*.

  **Elena:** No, he cares about whether the blame is *true*. But the hypocrisy objection isn't that the blame is false. It's that it's *unauthorized*. And authorization comes from the norm itself, not the victim. That's why the victim can't waive it. The norm doesn't recognize the hypocrite as a valid agent of its enforcement.

  **Marcus:** So you're saying the "defect" isn't in you, it's in the link between you and the norm.

  **Elena:** Yes. Which saves me from the waiver problem. I don't hold the standing as a right; I hold it as a function of my alignment. You can't waive a functional failure.

  **Marcus:** I'll accept that distinction, but it blurs the line between my view and yours. If the link between you and the norm is broken because you treat the norm selectively, we're back to unfairness.

  **Elena:** Perhaps. But it preserves the idea that the hypocrite is silenced by her own state, not just by her treatment of others.

  **Marcus:** We're circling. Let's stop. For the article, we need to leave the readers with what we still don't know.

  **Elena:** Agreed. Here is my unsettled question: If standing is about alignment with the norm, why does the *Beneficiary* lack standing when her will is aligned? Is there a form of "passive hypocrisy" where benefiting from a wrong counts as willing it? I don't have a theory for that yet.

  **Marcus:** And mine is this: If standing is about fairness, why does the *Reformed Wrongdoer* regain it so easily? If I treated you unfairly yesterday, why does saying "I'm sorry" restore my authority to judge you today? What washes away the stain of the past unfairness so completely? I suspect the answer lies in something neither of us has fully named.

  **Elena:** Then we've done our job. We've found the edges of the map.

  **Marcus:** And where the monsters are.
