      *   *Dev:* Ignores that "philosophy" isn't just universal laws. Phenomenology and existentialism deal with the particular. He misses the rhetorical strategy of *Ecce Homo*.
      *   *The User:* The user is hungry and suffering. Reading about a sick man obsessing over food might be triggering or validating. Need to address the emotional/physical context.

