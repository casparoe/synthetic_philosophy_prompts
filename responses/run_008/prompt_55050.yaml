answer: |-
  # SEMINAR HANDOUT: The Timing of Experience
  **Topic:** The Color Phi Phenomenon & Consciousness  
  **Audience:** Philosophy of Mind Undergraduates  

  ### THE CASE
  Two stationary spots are flashed in sequence: **Red** (at time $t_1$) then **Green** (at time $t_2$).  
  Subjects report a **single moving spot** that travels from the first location to the second and **changes color midway** through the motion.  
  **The Paradox:** The brain cannot know the second spot is Green until $t_2$. Yet the experience reports a color change *between* $t_1$ and $t_2$. The content of the experience seems to depend on causes that have not happened yet.

  ---

  ### THE DECISION TREE
  *Answer the following questions in order. Do not worry about technical labels.*

  **NODE 1: The Report Trap**  
  When you say, "I saw it change color midway," does that verbal report alone prove the conscious experience *actually happened* midway?  
  *   **YES** → Go to **NODE 2**.  
  *   **NO** → Go to **NODE 3**.

  **NODE 2: The Causal Catch**  
  If the report proves the timing, do you believe your brain knew the second flash was Green before it physically occurred?  
  *   **YES** → **LEAF: Magical Realism** (You believe in precognition).  
  *   **NO** → **RETURN TO NODE 3** (You admit the report is a reconstruction, not a live feed).

  **NODE 3: The Memory Reader**  
  Imagine a perfect scanner reads your brain state one second after the trial. Could it find a "raw" record of the events (Red, then Green) that was later overwritten by the "moving color-change" story?  
  *   **YES** → **LEAF: The Orwellian View**.  
  *   **NO** → Go to **NODE 4**.

  **NODE 4: The Theater Curtain**  
  If no raw record exists, was the final "moving color-change" story fully constructed *before* you became conscious of it? (Like fixing a script before the show opens).  
  *   **YES** → **LEAF: The Stalinesque View**.  
  *   **NO** → Go to **NODE 5**.

  **NODE 5: The Hidden Fact**  
  If the story wasn't fixed before consciousness, and there is no raw record: Is there still a definite fact about *when* you became conscious, even if no experiment could ever detect it?  
  *   **YES** → **LEAF: The Epistemic Limit**.  
  *   **NO** → Go to **NODE 6**.

  **NODE 6: The Coherent Question**  
  Do you think the question "When exactly did this become conscious?" is itself flawed, as if asking for the exact moment a "process" becomes a "product"?  
  *   **YES** → **LEAF: The Multiple Drafts View**.  
  *   **NO** → **RECONSIDER NODE 5** (If there is a fact, you must explain how it exists without evidence).

  ---

  ### THE LEAVES (Definitions)

  **🍂 The Orwellian View**  
  The raw experience occurred (Red, then Green), but your memory was falsified afterward to match the "moving spot" story. Consciousness was accurate; the record is lying.

  **🍂 The Stalinesque View**  
  The brain waited for all data, constructed the "moving spot" story, and *then* presented it to consciousness. Consciousness was delayed; the record is accurate to the experience, but the experience was delayed.

  **🍂 The Epistemic Limit**  
  There is a fact of the matter (either Stalinesque or Orwellian is true), but no possible experiment could settle it.  
  *(Seminar Note: Can anyone really hold this? Only if you believe truths can exist completely detached from evidence. Verificationists argue this is empty metaphysics; Realists argue it preserves objective truth.)*

  **🍂 The Multiple Drafts View (Dennett)**  
  There is no single moment when experience "becomes conscious." The brain produces multiple narratives; the one you report is just the dominant draft at the time of questioning. The distinction between Stalinesque and Orwellian is illusory.

  **🍂 Magical Realism**  
  The view that your report proves the timing, implying the brain perceives future physical causes. (Generally rejected in philosophy of mind).

  ---

  ### ⚠️ SEMINAR FLAG: Indistinguishable Leaves
  **The Stalinesque and Orwellian leaves cannot be empirically separated.**  
  Because any evidence you consult (memory, brain scan, report) is itself part of the causal chain, you can never step outside the system to check if the edit happened *before* or *after* consciousness. Dennett argues this makes them the same view disguised as two.
