answer: |-
  **MEMORANDUM FOR GUEST LECTURER**
  **SUBJECT:** Q&A PREP // COMBATANT EQUALITY DEFENSE
  **CLASSIFICATION:** UNCLASSIFIED // FOR PREP ONLY

  ### 1. ACADEMIC LANDSCAPE CHECK (READ FIRST)
  You asked for a straight read on where the field stands. Do not walk into that room implying Revisionism is a fringe theory.
  *   **In Analytic Philosophy:** Revisionism (the view that combatant equality is false; unjust combatants are liable, just ones are not) is the **dominant majority view**. If the philosophy instructor challenges you on this, they have the weight of the last 20 years of moral philosophy behind them (McMahan, Rodin, etc.).
  *   **In International Law & Doctrine:** Traditionalism (combatant equality) is **settled law**. The Geneva Conventions and LOAC operate entirely on the premise that a soldier is not a criminal simply for wearing the enemy uniform.
  *   **Your Lane:** You are defending the *institutional/moral necessity* of Traditionalism, not necessarily its metaphysical perfection. Your argument is: "Even if the philosophers are right about abstract liability, they are wrong about how human institutions must function."
  *   **The Trap:** Do not say "justice doesn't matter." Say "justice is adjudicated at a different level of command."

  ---

  ### 2. Q&A SHEET: OBJECTIONS & REPLIES
  *Order predicted by likelihood in this specific room.*

  #### Q1: The "Mindless Robot" Objection (Likely from an Officer or Senior Cadet)
  **The Question:** "Sir, if I can't judge the justice of the war, doesn't that make me a mindless robot? If the President lies to us, you're saying I'm off the hook for following him into a crime? That sounds like the Nuremberg Defense."

  **The Reply (2 Mins):**
  "It sounds like Nuremberg, but it's actually about division of labor. At Nuremberg, we prosecuted leaders for *starting* wars (Crimes Against Peace), but we generally didn't prosecute the Wehrmacht grunt for simply fighting, provided he didn't commit atrocities. That distinction is vital.
  My argument isn't that you surrender your conscience. It's that you surrender the *ad bellum* judgment—the question of 'Should we be fighting?'—to the civilian authority constitutionally empowered to decide that. Your moral burden is *in bello*—'How am I fighting?'
  If I tell you to shoot a prisoner, you refuse. That's a moral judgment you *must* make. But if I tell you to advance on an objective in a war you suspect is politically messy, you advance. If we require every private to vet the geopolitical justification for the war before pulling a trigger, you don't get professional armies; you get militias. And militias don't follow the laws of war. I'm not asking you to be a robot; I'm asking you to be a soldier who trusts the chain of command on strategy so you can focus on being a moral agent on tactics."

  **Where this is Soft:**
  It struggles against "Manifestly Unjust" wars (e.g., invading a neighbor for resources). If they push on Nazi Germany, don't dig in. Concede that there is a threshold where the injustice is so obvious the institutional shield breaks, but argue that threshold must be incredibly high to prevent chaos.

  #### Q2: The "Blood on My Hands" Objection (Likely from a Cadet)
  **The Question:** "But if I kill an enemy soldier who is defending their home from our invasion, I feel like that's murder. You're telling me to ignore that feeling? How do I live with that?"

  **The Reply (2 Mins):**
  "I'm not telling you to ignore the feeling; I'm telling you to interpret it correctly. That guilt you feel? That's a sign you're a moral human being, and that's good. But guilt isn't always proof of wrongdoing.
  Think of it like a referee in a sports game. If a ref makes a call that loses the game for one team, did he 'harm' them? Yes. Was it unjust? No, because he was acting within the rules of the institution.
  In war, the enemy soldier is a threat to your unit and your mission. He is armed and trying to kill you. Under the laws of war, he is a legitimate target regardless of which capital city gave the order. If you start trying to calculate the macro-justice of the conflict while someone is shooting at you, you will hesitate. Hesitation gets your squad killed. The 'murder' label belongs to the leaders who launched an unjust war, not the tools they employed. You carry the weight of your actions, but you don't carry the weight of the国家战略 (national strategy)."

  **Where this is Soft:**
  The "Referee" analogy can feel cold. A Revisionist will pounce here: "A ref doesn't kill people." Be ready to pivot back to the *threat* status of the combatant. They are liable because they are dangerous, not because they are evil.

  #### Q3: The "Philosophical Consistency" Objection (The Hostile Instructor)
  **The Question:** "You're arguing from consequences (order/discipline), not morality. But if the Revisionists are right that unjust combatants aren't liable to be killed, then by your institutional rule, you're authorizing soldiers to commit murder systematically. Doesn't practical utility trump moral truth?"

  **The Reply (2 Mins):**
  "That assumes we have access to the 'moral truth' in the fog of war. We don't. Revisionism works in a seminar room where we have all the facts, 20 years later. It doesn't work in a firefight.
  If we adopt your view—that only just combatants have the right to kill—we create a perverse incentive. Every soldier will claim *they* are the just side. Terrorists claim they are fighting oppression. Democracies claim they are fighting aggression. If 'justice' is the condition for the right to kill, then *no one* will ever lay down their arms, because everyone believes they are right.
  My institutional view isn't just 'pragmatics.' It's an epistemic claim: Individual soldiers *cannot know* enough to adjudicate *jus ad bellum*. Therefore, moral responsibility for the war's justice cannot reside with them. It's not that moral truth doesn't matter; it's that soldiers are the wrong actors to enforce it. Putting that burden on them makes war more brutal, not less."

  **Where this is Soft:**
  The instructor knows the literature. They will cite "epistemic humility" counter-arguments (i.e., soldiers can know *some* wars are unjust). Do not get dragged into a meta-ethics debate. Keep returning to: "Who decides? If not the state, then who? The individual? That's anarchy."

  #### Q4: The "Hope Nobody Asks" Objection (The Sincere Volunteer)
  **The Question:** "What about the volunteer who joins an aggressive army because they were propaganda-ed into believing it was just? They aren't conscripts. They chose to be there. Are they still moral equals with the guy defending his homeland?"

  **The Reply (2 Mins):**
  "This is the hardest case, and I'll be honest with you: The law says yes, they are equals. My argument says they *should* be treated as equals, with a caveat.
  Once you put on the uniform, you enter the institution. The institution grants you privileges (POW status) and imposes duties (follow LOAC). If we start stripping rights based on subjective belief or the specific war's justice, you destroy the reciprocity that keeps prisoners alive.
  However, this doesn't mean they are blameless. There is a difference between *combatant equality* (right to kill/be killed) and *moral culpability* (blame). A volunteer for an aggressive war might bear more moral blame than a conscript, but on the battlefield, they remain a combatant. We treat them as equals *in combat* to ensure that when *our* guys are captured, they are treated as equals too. We protect the institution to protect our own."

  **Where this is Soft:**
  **This is your weakest spot.** It is the point where the Institutional view clashes hardest with individual moral agency. If they press on "But he *chose* to be an aggressor," you risk sounding like you're excusing moral negligence.
  *Pivot:* Emphasize that *post-war* accountability is different from *in-war* status. We can prosecute leaders (and potentially volunteers for crimes against peace) later, but we cannot treat them as unprivileged belligerents during the fight without collapsing the laws of war.

  ---

  ### 3. STRATEGIC ASSESSMENT: IS Q4 THE WEAKEST SPOT?

  **Yes, but with a nuance.**
  The "Sincere Volunteer" question is weak because it highlights the tension between *institutional role* and *personal agency*. However, the **Manifest Injustice** exception (hinted at in Q1) is actually more dangerous to your position.

  *   **Why Q4 is manageable:** You can hide behind the reciprocity argument ("We do it so they do it for our POWs"). Cadets and Officers respect reciprocity.
  *   **Why Manifest Injustice is dangerous:** If a cadet asks, "What if we are the Nazis?" and you say "Soldiers are still equals," you lose the room's moral respect. If you say "Soldiers aren't equals then," you concede the Revisionist point that *ad bellum* justice *does* filter down to individuals, which undermines your core thesis.

  **Recommendation:**
  If Q4 comes up, answer it as drafted (focus on reciprocity and POW protection).
  If the "Nazi/Manifest Injustice" case comes up (likely from the Philosophy Instructor), **concede the exception**.
  *Say:* "Traditionalism holds for 95% of conflicts where justice is disputed. In the 5% where the aggression is genocidal or manifest, the institutional shield dissolves. But we cannot base our entire military doctrine on the 5% edge case, or the 95% becomes unmanageable."
  This shows intellectual honesty without surrendering the main argument.

  ### 4. DELIVERY NOTES
  *   **Don't say:** "Revisionists are wrong."
  *   **Do say:** "Revisionists are right about abstract morality, but wrong about institutional reality."
  *   **Watch the Officers:** If they look bored, stop talking about "liability" and start talking about "unit cohesion" and "rules of engagement."
  *   **Watch the Instructor:** Do not let them turn this into a seminar. If they ask a multi-part question, answer the first part and move to the next questioner. "That's a deep theoretical point, but for the cadets' purpose, the operational takeaway is..."

  Good luck. Hold the line on the institution.
