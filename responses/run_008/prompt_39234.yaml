answer: |-
  This is a high-stakes teaching moment. You are walking a tightrope between illustrating a theoretical concept and processing a real, recent trauma in your lab culture. The game needs to be robust enough to generate data, but flexible enough to handle the emotional undercurrents.

  Here is a complete lesson plan designed for 75 minutes, 14 players, and minimal materials.

  ### Part 0: Preparation (Do this before class)
  You cannot run this with a standard shuffled deck. You need to bias the probabilities to ensure the "Curse" mathematically emerges.

  1.  **Sort the Deck:** Separate a standard 52-card deck into two piles (discard Jokers).
      *   **Pile SAFE:** 22 Black cards (Clubs/Spades), 4 Red cards (Hearts/Diamonds).
      *   **Pile RISKY:** 22 Red cards, 4 Black cards.
      *   *Note:* This creates an 85% signal accuracy ($22/26$).
  2.  **Print/Write Payoff Table:** Have this visible on the whiteboard *before* they walk in.
      *   **State SAFE + Publish:** Group gets **+10 points** each.
      *   **State RISKY + Publish:** Group gets **-50 points** each.
      *   **Any State + Withhold:** Group gets **0 points**.
  3.  **Scraps of Paper:** Cut 20 small slips of paper. Players will write "P" (Publish) or "H" (Hold) on these.

  ---

  ### Part 1: The Game (Phase 1 - The Curse)
  **Time:** 20 Minutes
  **Goal:** Demonstrate that individual rationality leads to collective ruin.

  **The Setup (2 mins):**
  *   Tell the group: "We are a research consortium. Each round, there is a dataset. It is either **Safe** to release or **Risky** (dangerous)."
  *   "You will each get a private peer-review signal (a card). Black means 'Looks Safe', Red means 'Looks Risky'."
  *   "The signals are noisy. They are usually right, but not always."
  *   "Decision Rule: **Unilateral.** If *any one person* submits a 'P' slip, the group Publishes. If everyone submits 'H', we Withhold."
  *   "Goal: Maximize the Group's Total Score."
  *   **Crucial:** Do not explain *why* the rule is unilateral. Do not mention the "Unilateralist's Curse." Do not discuss strategy yet.

  **The Rounds (15 mins):**
  Run 5 Rounds.
  1.  **Determine State:** Flip a coin. Heads = Use Pile SAFE. Tails = Use Pile RISKY. (Record the Truth on the whiteboard, hidden under a piece of paper until the end of the round).
  2.  **Deal Signals:** Deal 14 cards from the chosen pile to the players. They look at them privately.
      *   *Black Card:* Signal says "Safe".
      *   *Red Card:* Signal says "Risky".
  3.  **Decision:** Players write P or H on a slip. Fold it. Collect in a hat/box.
  4.  **Resolution:**
      *   Scan the slips. If you see *any* "P", announce **"PUBLISHED."** If all "H", announce **"WITHHELD."**
      *   Reveal the Truth (Safe/Risky).
      *   Calculate points on the board.
      *   **Reshuffle the pile** and repeat.

  **The Expected Data:**
  *   **Signal Accuracy:** 85%.
  *   **Individual Logic:** If I hold a Black card ("Safe"), there is an 85% chance the state is Safe.
      *   Expected Value for *me* acting alone: $(0.85 \times 10) + (0.15 \times -50) = 8.5 - 7.5 = +1$.
      *   *Rational Individual:* "My signal says Safe, and the math says I should Publish."
  *   **Group Reality:** In a "Risky" round, the chance that *all 14* players get a Red card (correct signal) is $0.85^{14} \approx 10\%$.
      *   This means in 90% of "Risky" rounds, **at least one person** will get a Black card (false positive).
      *   Since one "P" triggers publication, the group will Publish on Risky data 90% of the time.
      *   **Result:** The group will accumulate massive negative points despite everyone acting "rationally" on their private info.

  ---

  ### Part 2: The Intervention (Phase 2 - Governance)
  **Time:** 20 Minutes
  **Goal:** Let them engineer a solution to the problem they just felt.

  **The Pivot (2 mins):**
  *   Show the score. It should be negative.
  *   Say: "The current protocol is broken. You have 5 minutes to design a new Decision Rule. You can change how we vote, who decides, or what the threshold is. But you must still use the cards as private signals."

  **Design Phase (5 mins):**
  *   Let them argue. Common ideas: Majority vote, unanimity, designated "Safety Officer," two-round review.
  *   **Facilitator Note:** If they suggest "Discuss before voting," allow it, but warn that discussion takes time (simulate this by giving them less time to decide in the next rounds).

  **Test Phase (13 mins):**
  *   Run 3 more rounds with their new rule.
  *   Keep the score separate on the board ("Phase 1 Score" vs "Phase 2 Score").
  *   *Likely Outcome:* They will move to Consensus or Majority. This will stop the "Risky" disasters, but they might miss some "Safe" opportunities (False Negatives). This trade-off is the learning point.

  ---

  ### Part 3: The Debrief
  **Time:** 25 Minutes
  **Goal:** Connect the game to the theory and the lab reality.

  **1. Reveal the Name (5 mins):**
  *   Write **"The Unilateralist's Curse"** on the board.
  *   Explain the mechanism: "When an action is unilateral (one person can do it) and the cost of error is shared (group loses points), the probability of error scales with group size."
  *   Show the math on the whiteboard: $P(\text{Group Error}) = 1 - (1 - P(\text{Individual Error}))^N$.
  *   Plug in their numbers: $1 - (0.15)^{14}$. Show how 14 people makes the error rate skyrocket compared to 1 person.

  **2. Map to the Lab Incident (10 mins):**
  *   *This is the delicate part.* Do not name the postdoc.
  *   Ask: "In Phase 1, who was the 'Unilateralist'?" (Answer: Anyone who wrote 'P' on a Risky round).
  *   Ask: "Did they act maliciously?" (Answer: No, they acted on a Black card. They acted in good faith based on their signal).
  *   **The Key Insight:** "The problem wasn't that someone was careless. The problem was that our system allowed a single 'good faith' signal to override collective safety. The Unilateralist's Curse explains how **competent, careful people** can produce **catastrophic group outcomes** simply because the decision structure is unilateral."
  *   Connect to the preprint incident: "One person saw a 'Black Card' (thought it was safe). The system allowed them to deal the cards for everyone. That is the curse."

  **3. Analyze Their Fix (10 mins):**
  *   Look at Phase 2 rules.
  *   "What did you fix?" (Likely: Added friction/veto/consensus).
  *   "What is the cost?" (Likely: Slower science, missed 'Safe' publications).
  *   "There is no free lunch. You traded the risk of catastrophe for the cost of delay. The question for our lab is: Where is the right balance?"

  ---

  ### Predictable Failure Modes & Mitigations

  **1. The Troll ("I'll publish just to see what happens")**
  *   *Risk:* A grad student realizes the game is theoretical and tanks the score to prove a point.
  *   *Mitigation:* Frame the score as **collective**. "If the group score is negative, everyone has to stay 5 minutes after class to help me clean up the whiteboards." (Make it a mild, shared inconvenience, not a punishment). Peer pressure will silence the troll.
  *   *Alternative:* "The group with the highest score gets first choice of seminar dates / conference travel support priority" (if you have any sway). If not, rely on professional pride.

  **2. The Sandbagger ("I will never publish to prove safety is best")**
  *   *Risk:* Someone refuses to publish even on "Safe" rounds, skewing the data.
  *   *Mitigation:* In the instructions, emphasize: "Your goal is to **maximize points**, not to minimize risk." If they withhold on a Safe round, they are actively hurting the group score. Remind them of the goal if the group score is too low.

  **3. The Dominators (Phase 2 Voting)**
  *   *Risk:* Two loud students dictate the new rule.
  *   *Mitigation:* Enforce a "Silent Brainstorm" for the first 2 minutes of the Design Phase. Everyone writes a rule idea on paper. Collect them, read them aloud anonymously, *then* discuss. This levels the hierarchy.

  **4. The "It's Just a Game" Dismissal**
  *   *Risk:* Students treat Phase 1 as noise and don't feel the sting.
  *   *Mitigation:* Ensure the payoff asymmetry is clear. -50 is *painful*. When they lose 50 points, pause. "Look at that score. That was one person holding a Black card. Does anyone feel frustrated?" Validate the emotion before moving to theory.

  ---

  ### Limitations: What the Game Cannot Reproduce

  Be honest about this in the debrief. The game is a model, not reality.

  1.  **Irreversibility:** In the game, we reshuffle. In the lab, once the pathogen synthesis method is on a preprint server, **you cannot reshuffle.** The risk is permanent. Emphasize this: "The game resets. Our reputation does not."
  2.  **Reputation & Trust:** In the game, votes are anonymous. In the lab, we know who sent the email. The "cost" isn't just points; it's trust. "If you trigger the curse, you don't just lose points; you lose the group's trust in your judgment."
  3.  **Signal Correlation:** In the game, signals are independent. In the lab, we all read the same papers and talk at the same meetings. Our "cards" are often correlated, which can actually *worsen* the curse (groupthink) or help (shared caution).
  4.  **Good Faith vs. Negligence:** The game assumes everyone tries to maximize points. In reality, sometimes people are negligent. The Unilateralist's Curse is scarier because it applies *even when everyone is trying their best.*

  ---

  ### Handling the "Elephant in the Lab"

  You want to discuss the recent near-miss without shaming the postdoc who is already spooked.

  **The Script:**
  "We all know something happened three weeks ago. We haven't talked about it directly. I want to be clear: **This game is not about blaming the person who almost posted.**"

  "According to the Unilateralist's Curse, if you put 14 careful people in a room with a unilateral decision rule, it is **statistically inevitable** that one of them will eventually make a mistake that looks like carelessness but is actually a structural failure."

  "The person who almost posted acted on a signal that said 'Safe.' They were rational. The system was not. We are not here to fix the person; we are here to fix the system so that the next 'Black Card' doesn't sink the ship."

  **Closing the Loop:**
  End the session by asking: "Based on Phase 2, what is **one** specific rule we can adopt tomorrow? Not a vague 'be careful,' but a mechanism. A checklist? A second-signature rule? A 24-hour hold?"
  Get them to commit to a structural change. This gives the spooked postdoc a path forward (a system to trust) rather than just fear.

