                  *   *Accuracy:* If Pile A has 20 Black, 6 Red. Accuracy = 20/26 = 77%. Good enough.
                  *   *Action:* Players look at card. Write "P" (Publish) or "H" (Hold) on scrap paper. Fold. Collect.
                  *   *Outcome:* If any "P" found -> Group Publishes.
                  *   *Payoff:*
                      *   Truth Benign + Publish: +5 pts each.
