                      *   Hold: 0 pts.
                  *   *Rounds:* Need enough to see the pattern. 5 rounds.

  4.  **Design the Game (Phase 2: The Fix):**
      *   Give them 5 minutes to propose a protocol.
      *   Run 3 rounds with the new protocol.
      *   Compare scores.

  5.  **Debrief & Theory:**
      *   Calculate the probability of at least one false positive. $P(\text{error}) = 1 - (1 - p_{\text{indiv}})^N$.
      *   Show how $N=14$ makes this huge compared to $N=1$.
      *   Connect to the lab incident (one person's "good faith" signal overrode the group's safety).

  6.  **Addressing Failure Modes:**
      *   *Trolling:* Someone publishes just to see what happens. *Mitigation:* Frame it as "Group Score". If they tank the score, the whole class suffers. Peer pressure works.
      *   *Sandbagging:* Someone refuses to publish even on Benign to prove a point. *Mitigation:* Emphasize the goal is *maximizing points*, not proving a philosophical point during Phase 1.
      *   *Dominance:* In Phase 2, loud voices take over. *Mitigation:* Require written proposals first, then vote.

  7.  **Addressing Limitations:**
      *   *Real Stakes:* Points aren't jobs.
      *   *Irreversibility:* In the game, we reset. In reality, the pathogen info is out.
      *   *Reputation:* In the game, anonymity (secret ballot). In reality, people know who sent the email.
      *   *Good Faith:* The game assumes rationality. The real incident was good faith + error.

  8.  **Addressing the Lab Elephant:**
      *   How to talk about the recent near-miss without shaming the postdoc.
