  Improper.

  **Norm Autopsies**
  Three obvious norms fail your colleague's record immediately. The **Truth Norm** (assert only what is true) dies on Cases 3 and 4; the numerologist and the stopped-clock reader spoke truths, yet Diya verdicted them improper. The **Belief Norm** (assert only what you believe) dies on Case 5; the teacher asserts properly despite personally rejecting the proposition. The **Blamelessness Norm** (assert only what you are subjectively justified in believing) dies on Case 2; the visitor was told a falsehood blamelessly, yet Diya verdicted the assertion improper.

  **The Survivors**
  This leaves two live candidates, as you noted. The **Knowledge Norm** fits Cases 1 through 4 naturally but requires surgery for Case 5. Standard knowledge requires belief, so to accommodate the teacher, the norm must be modified to something like "Assert only what is known *by the source one channels*" or "Assert only if one is in a position to know," decoupling the norm from the speaker's personal doxastic state.

  The **Anti-Luck Principle** fits all five cases, provided it tracks the **method** rather than the proposition. If it tracked the proposition, Case 3 (eclipse) and Case 4 (clock) might pass depending on modal proximity, but the Mathematician case forces the distinction. The theorem is necessarily true; it *could not* have been false. A proposition-tracking anti-luck principle would verdict the mathematician **Proper**, as there is no possible world where the theorem is false. However, Diya's verdicts on Cases 3 and 4 show she penalizes lucky *bases* (dreams, broken clocks) even when the output is true. Therefore, her principle must track the reliability of the method. The mathematician's proof contains a gap where truth is secured only by canceling errors; this is methodological luck. A method-tracking anti-luck principle verdicts her **Improper**.

  **Diya's Rule**
  Diya is most likely running a **Method-Safety Norm** (a method-tracking anti-luck principle). While the surgically altered Knowledge Norm predicts the same verdict for the mathematician (since Gettiered beliefs are not knowledge), the Method-Safety Norm offers a cleaner explanation of Case 5. The teacher's assertion is proper not because she is in a "position to know" (she rejects the content), but because the *institutional method* (vetted textbook) is safe/reliable. Diya's consistent emphasis on the quality of the basis (watch vs. dream vs. stopped clock vs. textbook) suggests she cares about the reliability of the assertion's genesis, not the metaphysical status of the speaker's knowledge state. The mathematician's proof is unsafe (the gap could easily have led to falsehood), mirroring the stopped clock.

  **Discriminating Case**
  To distinguish between the Surgically Modified Knowledge Norm (SMKN) and the Method-Safety Norm (MSN), present Diya with a **Misleading Defeater** case:

  *An agent checks a reliable watch (method is safe) and forms a true belief about the time. However, a trusted friend falsely tells them the watch stopped an hour ago. The agent doubts the friend, trusts the watch, and asserts the time.*

  *   **MSN Prediction:** **Proper.** The method (watch) is reliable and safe; the assertion is not lucky.
  *   **SMKN Prediction:** **Improper.** The agent possesses a defeater (the friend's testimony), meaning they are not in a position to know, even if the method is safe.

  If Diya verdicts this Proper, she is running Method-Safety. If Improper, she is running a Knowledge-based norm sensitive to defeaters.
