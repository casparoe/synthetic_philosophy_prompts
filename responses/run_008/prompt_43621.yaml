          3.  Coherentism: Belief is *true* if it fits with other beliefs. Critique: Justifies conspiracy theories (internally consistent circles). Basically refuted.
          4.  Infinitism: Chains literally never end, infinitely many reasons in head. Critique: No philosopher takes this seriously.
          5.  Conclusion: You ultimately have to take something on *faith*, regardless of theory.
