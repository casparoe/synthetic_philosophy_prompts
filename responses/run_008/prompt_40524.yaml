      *   **Working Title:** "Frozen conditionals: what rigidity costs you".
      *   **Core Thesis:** Rigidity (keeping $P(H|E_i)$ fixed) isn't just a technical hygiene check; it's the epistemological heart of the rule, implying immunity of conditional beliefs to the learning process.
      *   **Key Arguments:**
          1.  Noncommutativity of rigid updates is a feature (historical path dependence), not a bug.
          2.  Rigidity is a local/short-range idealization (like Euclidean spacetime), not a global norm.
          3.  Evidence affecting reliability/conditionals takes you outside Jeffrey's framework (where real science happens).
      *   **Specific Questions:**
          (a) Accuracy check on noncommutativity and the "partition-massaging" fix.
          (b) Is the spacetime analogy useful or decorative?
