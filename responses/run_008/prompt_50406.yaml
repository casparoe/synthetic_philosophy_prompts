answer: |-
  The fluorescent lights of the common room hummed, a low-grade headache waiting to happen. It was past nine. Between us sat the stack of blue books, topped by the two offending exams. Dana rubbed her temples, staring at the second student's answer as if it were a personal insult.

  "Priya, look," Dana said, tapping the page. "Student One says it's Modus Ponens. Valid. Full credit. Student Two says moral sentences aren't true or false, so logic doesn't apply. Zero. This isn't a debate; it's a competency check."

  "It's not that simple," I said, leaning back in the creaking chair. "Student Two is stumbling onto a genuine metaethical problem. You know this. In your dissertation, you spend chapters fighting the idea that moral claims are just expressions of attitude. If Student Two is echoing a serious objection you take seriously, is 'zero' really the right grade?"

  Dana sighed, pouring the last of the cold coffee. "In an Introduction to Ethics? Yes. We teach them that validity is about truth preservation. If the premises can't be true, they can't preserve truth. Student One understands the logical form. Student Two is denying the data of logic because of a philosophical hobbyhorse. But fine. You want to play the philosopher? Convince me Student Two isn't just confused."

  "Okay," I said, picking up the blue book. "Take the argument. 'Tormenting the cat is wrong. If tormenting the cat is wrong, paying your brother is wrong. Therefore, paying your brother is wrong.' Student Two thinks 'Tormenting the cat is wrong' is like saying 'Ouch!' It expresses pain, it isn't true. But notice what happens in the second premise. 'If tormenting the cat is wrong...' Here, the student isn't saying 'Ouch.' They're embedding that claim inside a conditional. If moral sentences just express attitudes, what is the second premise expressing? It's not expressing disapproval of cat-tormenting. It's expressing something about the relationship between two claims."

  "That's exactly the point," Dana said, leaning forward. "In the first sentence, the expressivist says you're just booing at the cat. But in the second sentence, you're not booing. You're stating a connection. So the word 'wrong' must be doing two different jobs. If it changes meaning between the premise and the conditional, the argument commits a fallacy of equivocation. It looks valid, but it's not. Student Two is right that there's a problem, but wrong to think it saves them from grading. The argument *is* valid, which proves moral sentences must function like truth-apt statements. Student Two denies that, so they deny the validity. That's an error."

  "Alright," I said. "Here's the first repair strategy. We don't say the meaning changes. We say the *state of mind* changes. When I say 'Tormenting is wrong' unembedded, I express a simple attitude of disapproval. But when I say 'If tormenting is wrong, paying is wrong,' I'm not expressing disapproval of tormenting. I'm expressing a higher-order attitude. I'm saying I disapprove of having the first attitude without having the second. It's a single, complex state of mind regarding patterns of attitudes. The word 'wrong' contributes the same thing—a reference to a specific type of attitude—but the grammatical context tells you how complex that attitude is."

  Dana nodded slowly. "So validity becomes consistency of attitudes. If you have the complex attitude (the conditional) and the simple attitude (the first premise), logic forces you to have the conclusion attitude."

  "Exactly," I said. "So Student Two is half-right. It's not about truth. It's about psychological consistency."

  "But here's the difficulty," Dana countered, picking up a pen. "Negation. Consider the sentence: 'It is not the case that tormenting the cat is wrong.' On your view, the unembedded version expresses disapproval. What does the negated version express? Is it the absence of disapproval? That's not a clash. I can disapprove of cat-tormenting and also lack disapproval of cat-tormenting at different times. For logic to work, 'P' and 'Not-P' must be incompatible. They must contradict. If 'wrong' just tracks attitudes, where is the contradiction? You can have mixed feelings. Truth conditions give you contradiction automatically—something can't be both true and false. Attitudes don't have that binary snap. So your higher-order state doesn't solve the problem of logical inconsistency."

  I tapped the table. "Fair. That's why we move to the second strategy. We stop trying to map logic onto psychology and map it onto planning. Moral judgments are plans. 'Wrong' means 'I plan to avoid this.' Validity isn't truth preservation; it's plan consistency. If I plan to avoid A, and I plan to avoid B if I avoid A, then I am committed to planning to avoid B. If I don't, I'm practically inconsistent, even if I'm not logically inconsistent in the truth-functional sense."

  Dana shook her head. "Mixed contexts again. What about disjunctions? 'Either tormenting the cat is wrong or paying your brother is wrong.' What plan is that? It's not a plan to avoid one or the other specifically. It's a claim about the logical space. To validate the argument Student One saw, the moral sentences have to behave exactly like propositional variables. They have to slot into every nook and cranny of standard logic—nested conditionals, disjunctions under negations. If your 'plan' theory can't explain what state of mind corresponds to 'Not (If P then Q),' then you haven't saved logic. You've just built a parallel system that looks like logic but breaks whenever the embedding gets deep. Student Two says the argument *can't* be valid. You're trying to say it *is* valid, but for different reasons. But if the reasons don't support the full structure of classical logic, Student Two is still technically right that truth-apt validity is missing."

  I paused. She had me on the deep embedding. "So, for the grading," I said, shifting back to the blue books. "Student One gets full credit. They treated the moral claims as truth-apt, which allowed them to see the Modus Ponens. That's what we taught them."

  "Yes," Dana said.

  "But Student Two?" I pressed. "If I give them zero, I'm saying their insight is worthless. But you just spent ten minutes explaining why their insight—that expressivism struggles with embedding—is a major hurdle in metaethics. You fight this in your dissertation. If you give them zero, you're grading them on not knowing a solution to a problem you admit is hard. Are we testing their ability to apply introductory logic, or their metaethical sophistication?"

  Dana looked at the second blue book, then at me. "We're testing introductory logic. In this course, 'valid' means 'truth-preserving.' Student Two denied the premises could be true. Therefore, by the definitions of this course, they denied the argument could be valid. That is an error within the framework we established."

  "But the framework is philosophically contested," I said. "If I mark it wrong, I'm reinforcing moral realism as fact rather than theory."

  "Intro courses require simplification," Dana said firmly. "But... look. If I give them zero, it implies they're nonsense. Maybe partial credit. Acknowledge the philosophical intuition, penalize the logical application."

  "Half credit?" I suggested. "For identifying the tension, even if they drew the wrong conclusion for this level?"

  Dana hesitated. "Fine. Half. But only because you ambushed me with the dissertation argument." She capped her pen. "But here's where we stop. We can't leave it at 'partial credit.' We need to know what counts as progress for next time. If expressivism wants to claim Student Two is wrong about validity, it has to show that 'plan consistency' or 'attitude consistency' is robust enough to handle negation and disjunction exactly like truth conditions do. Until then, in an intro class, truth-apt logic is the only game in town."

  "So the hinge," I said, closing the blue book, "is whether inconsistency without truth is possible. If you can prove that two attitudes can contradict each other as strictly as True and False, Student Two gets full credit next time. If not, they're still confused."

  "Precisely," Dana said, standing up and gathering her bag. "If you can define contradiction without truth, you save the student's grade and your theory. Until then, I'm sticking with Modus Ponens."

  We turned off the lights, the question hanging in the dark common room, unresolved but sharply defined.
