answer: |-
  Here is the audit of your six cases, the principle that governs them, and the fate of your slogan.

  ### (i) The Principle: Conditionalization on Rich Epistemic Propositions

  To capture your verdicts without invoking Jeffrey Conditioning as a primitive rule, we must adopt the following updating principle:

  **The Principle:** *Always conditionalize on the strongest true proposition describing your current total epistemic state, including the assessed reliability of the access channel.*

  Formally, let $H$ be a hypothesis about the world. Let $E_t$ be the proposition "At time $t$, I have experience $X$ with assessed reliability $R$." You update by standard Bayesian conditionalization:
  $$P_{new}(H) = P(H \mid E_t) = \frac{P(E_t \mid H)P(H)}{P(E_t)}$$
  Crucially, $E_t$ is not merely "I had a sensation." It is "I am now in a state where my best judgment of veridicality is $R$." This treats your reliability assessment itself as part of the evidence proposition.

  This principle implies **Screening Off by Current Access**: If a later experience $E_{t2}$ provides a more direct or reliable assessment of $H$ than $E_{t1}$, and your assessment of $E_{t2}$'s reliability *already takes into account* the existence of $E_{t1}$, then $E_{t2}$ screens off $E_{t1}$.

  ---

  ### (ii) & (iii) Case Audit

  Here is how the principle runs through your notebook. I will be candid where the principle strains.

