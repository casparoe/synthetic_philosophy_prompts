answer: |-
  Your observation cuts to the heart of modern risk regulation. You have identified the central tension between the **Value of a Statistical Life (VSL)** approach (which aggregates tiny risks across populations to justify action) and the **de minimis** threshold (which treats tiny individual risks as zero, refusing to aggregate them to demand action).

  At first glance, this looks like a contradiction: you sum small risks when it justifies regulation (VSL) but ignore them when it demands regulation (de minimis). However, this is not a philosophical inconsistency regarding the *nature* of harm, but a pragmatic inconsistency regarding the *cost* of governance.

  ### The Implicit Theory: Pragmatic Aggregation
  The regulatory practice does **not** presuppose that tiny harms genuinely fail to add up (the non-aggregative view). If agencies believed that, they could not use VSL, which relies entirely on the premise that $N \times \epsilon$ risk equals $N \times \epsilon$ expected deaths. The VSL methodology explicitly confirms that regulators accept the aggregative view of harm: a million people facing a one-in-a-million risk equals one expected death, and that death has moral and economic weight.

  Instead, the de minimis threshold presupposes an **epistemic and administrative floor**. It is a rule of **Institutional Consequentialism** (or Rule-Utilitarianism). The theory is: *Harms aggregate morally, but regulatory authority should not trigger below a certain individual risk level because the transaction costs, measurement errors, and legal uncertainties of acting on vanishingly small individual risks outweigh the marginal benefits.*

  This resolves the "contradiction."
  1.  **VSL (Aggregation):** Used when the *aggregate* benefit is large enough to justify the *cost* of the rule.
  2.  **De Minimis (Threshold):** Used when the *individual* risk is so small that establishing causation, standing, or cost-effective remediation is impossible or inefficient, even if the theoretical aggregate harm exists.

  The "line" is not where harm becomes zero; it is where the **marginal cost of regulation exceeds the marginal benefit**. In de minimis cases, cleaning up the last $10^{-7}$ risk is usually astronomically expensive per life saved. In VSL cases, the rule is only adopted if the cost per life saved is reasonable (e.g., under \$10 million).

  ### Rival Theories of Aggregation
  *   **Strict Act Utilitarianism:** Would reject the de minimis threshold. If the aggregate harm exceeds the cost of removal, you must remove it, regardless of how small the individual risk is. This theory finds the current practice inconsistent.
  *   **Lexical Threshold Deontology (The "Torture" Side):** Would reject VSL aggregation. If the individual harm is below a threshold of "significance," it cannot be summed to justify imposing costs on others. This theory also finds the practice inconsistent (specifically the VSL part).
  *   **Rule-Consequentialism / Pragmatism:** Licenses the practice. We adopt a *rule* (de minimis) that generally maximizes welfare by preventing regulatory paralysis, even if it ignores some theoretical harms in specific cases.

  ### What If We Removed the Threshold?
  If you replaced the de minimis threshold with a straight aggregative view (Strict Utilitarianism), regulators would not necessarily be obligated to chase *infinite* risks. They would still be bound by **Cost-Benefit Analysis (CBA)**.
  *   **Current Practice:** Stop because Risk $< 10^{-6}$ (Safe Harbor).
  *   **Pure Aggregation:** Stop because Cost $>$ Benefit.

  In reality, these often converge. The cost to reduce risk from $10^{-6}$ to $10^{-7}$ is often so high that CBA would reject it anyway. However, removing the threshold would shift the burden of proof. Currently, the polluter is safe below the line. Under pure aggregation, the polluter would have to prove the cost of further reduction is excessive for every molecule. This would lead to litigation gridlock, not infinite cleanup. The "stopping point" remains economic, not ontological.

  ### Conclusion
  The practice is philosophically consistent if viewed as **administrative pragmatism** rather than **moral ontology**. It presupposes that harms aggregate, but that our institutions are too blunt to target harms below a certain magnitude without wasting resources better spent elsewhere. You didn't win the bar argument on moral grounds; you won on bureaucratic necessity.

  \answer{Pragmatic aggregation constrained by administrative feasibility}
