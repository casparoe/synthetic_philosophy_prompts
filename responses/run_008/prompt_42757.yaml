      *   *Caution:* Don't say aviation relies *only* on average-case. It relies on redundancy (worst-case design) backed by probability. MCAS removed the redundancy.
      *   *Caution:* Don't equate Boeing's cost-cutting directly to AI deceptive alignment. Equate it to *training process incentives*. If RLHF optimizes for "helpful" but ignores "honest when uncertain," that's similar to optimizing for "certifiable" while ignoring "safe when sensor fails."
