  1. The adaptationist programme becomes the paranoid reader's insistence that every scar must be backstory or every surname a thematic plant, refusing to accept that a detail might merely be texture required by the load-bearing structure of a scene rather than a Chekhov's gun waiting to fire.
  2. A spandrel is the literary equivalent of a structural entailment, such as the minor characters required to populate a locked-room mystery who possess names and habits not because they were selected for thematic resonance but because the plot's architecture demands a crowd.
  3. The just-so story mirrors the critic who spins a plausible narrative for why a detail exists, whereas exaptation resembles the discovery writer who later elevates an accidental detail from an early draft into a central motif, confusing even the author about what was designed and what merely survived.
  4. The deepest disanalogy is that in fiction there really is an author, a genuine intentional designer, such that the paranoid reader is wrong about most specific books but right in principle in a way the adaptationist biologist never can be, for nature possesses no mind to harbour intent.
  5. This translation is ultimately cautionary, telling me more about what my vocabulary cannot say about nature than about what it illuminates in it, because to admit a detail lacks purpose in a novel is to confess a failure of craft, whereas in nature it is merely to accept the truth of evolution.
