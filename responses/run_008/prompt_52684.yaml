answer: |-
  You are not imagining this, and you are not late to a party that started in 1757. You have accurately identified a specific intersection of aesthetics, ethics, and cognitive science.

  Because you come from engineering, I will give you the architecture of this concept first, then the specific terminology, and finally the boundaries you asked for.

  ### 1. The Established Literature
  There isn't one single word that covers exactly what you're describing, because your observation bridges three different fields that usually talk past each other. Here is the stack:

  **A. Philosophy of Art: *Ethicism* (or Moderate Moralism)**
  In aesthetics, the debate you are stumbling into is between *Autonomism* (art and ethics are separate) and *Moralism* (ethical defects are aesthetic defects).
  *   **The specific term:** **Ethicism**. Championed by philosopher Berys Gaut. It argues that ethical flaws in a work *can* constitute aesthetic flaws.
  *   **The limitation:** Philosophers usually argue about *judgment* ("This is a bad song"), not *perception* ("This song sounds thin"). They debate whether you *ought* to rate it lower, not whether your ears literally hear it differently.

  **B. Cognitive Science: *Cognitive Penetrability***
  This is the mechanism. It asks: "Can my beliefs change my sensory input?"
  *   **The specific term:** **Cognitive Penetrability of Perception**.
  *   **The mechanism:** **Top-Down Processing**. Your brain is not a camera; it is a prediction engine. When you learn the singer is a "terrible person," your brain updates its prior probabilities. It starts listening for smugness. Because the brain fills in sensory gaps with predictions, you literally hear the "smugness" that wasn't there before.
  *   **Related term:** **Affective Realism**. (Lisa Feldman Barrett). What you feel is what you see/hear. If you feel disgust toward the maker, you perceive the artifact as disgusting.

  **C. Anthropology/Psychology: *The Law of Contagion***
  *   **The specific term:** **Moral Contagion**.
  *   **The concept:** In magical thinking and psychology, the "Law of Contagion" states that things which have been in contact continue to act on each other at a distance. You are experiencing **Moral Contagion**: the moral "essence" of the creator has infected the object, changing its properties in your mind.

  ### 2. Coining the Term
  Since the existing terms are split between normative philosophy ("is it bad?") and cognitive mechanics ("how does vision work?"), there is a gap for the specific phenomenological experience you are describing: *the sensory shift of the artifact's quality based on the maker's morality.*

  I propose we call this **Ethical Permeation**.

  **Definition:**
  > **Ethical Permeation** is the phenomenological phenomenon wherein moral knowledge regarding the creator of an artifact retroactively alters the perceived sensory or structural qualities of the artifact itself, independent of the observer's decision to consume or reject it.

  **Why this fits your cases:**
  *   **Band:** The morality permeates the audio signal (sounds "thinner").
  *   **Game:** The struggle permeates the code/assets (bugs read as "bravery").
  *   **Code:** The malice permeates the architecture (elegance reads as "deception").

  ### 3. Does Code Have Aesthetics? (The Engineering Case)
  You asked if the code case is really the same phenomenon. **Yes.**

  In software engineering, "aesthetics" is not just visual; it is **functional beauty**.
  *   **Elegance** in code is an aesthetic judgment that implies *predictability, maintainability, and honesty.* Clean abstractions promise that the system behaves as it appears.
  *   **The Sabotage Shift:** When you learned the engineer was malicious, the *semantic meaning* of "elegance" flipped.
      *   *Before:* "Clean abstractions" = "Easy to reason about."
      *   *After:* "Clean abstractions" = "Easy to hide a trap in."
  *   The code didn't change, but the **signal-to-noise ratio of trust** changed. The aesthetic quality of code is tied to its reliability. If the maker is unreliable, the beauty becomes a liability. This is a perfect example of Ethical Permeation because the moral fact (sabotage) directly contradicts the functional promise of the aesthetic (clarity).

  ### 4. The Edges and Boundaries
  You asked where this collapses into ordinary interpretation. Here is the boundary logic:

  **Boundary 1: Confessional vs. Abstract Art**
  *   **High Permeation:** Art that explicitly invites you to consider the artist (singer-songwriters, memoirs, solo indie games). The artist is *part of the interface*. In these cases, knowing about the maker is like finding out the tour guide is lying; the landscape looks different because the narration is compromised.
  *   **Low Permeation:** Abstract or purely functional artifacts where the maker is invisible (e.g., a math proof, a generic library, a bridge). If you find out the bridge builder cheated on their spouse, the bridge shouldn't feel "shakier." If it does, that is pure bias (Halo/Horns effect) rather than aesthetic permeation, because the morality is irrelevant to the function.
      *   *Your Code Example:* This sits in the middle. Code is functional, *but* it is also a communication medium between engineers. Because it communicates intent, the intent's morality matters.

  **Boundary 2: Interpretation vs. Sensation**
  *   **Interpretation:** "I know this song is about love, but now I think it's actually about manipulation." (This is Death of the Author stuff).
  *   **Ethical Permeation:** "The reverb sounds cheaper." (This is your experience).
  *   **The Edge:** The collapse happens when the moral fact provides a *new key* to decode the work.
      *   *Example:* If a movie has a plot hole, and you find out the director was drunk, the plot hole changes from "sloppy" to "tragic." That is Permeation.
      *   *Counter-Example:* If you find out the director was drunk, and you decide the movie is "bad" but it looks exactly the same to you, that is just **Moral Judgment**, not Permeation.
      *   **Test:** If you can describe the change using sensory adjectives (thin, sharp, sinister, brave, sloppy), it's Permeation. If you describe it using verdict adjectives (good, bad, worthy, unworthy), it's Judgment.

  **Boundary 3: Reversibility**
  *   Ethical Permeation is often sticky. Once you hear the "smugness" in the song, it is hard to un-hear it. This distinguishes it from a temporary mood. It rewrites the "firmware" of how you perceive that specific artifact.

  ### Summary for your mental model
  *   **The Phenomenon:** **Ethical Permeation**.
  *   **The Mechanism:** **Top-Down Cognitive Penetrability** (your brain predicts the sensory input based on moral context).
  *   **The Philosophical Bucket:** **Ethicism** (ethical properties contribute to aesthetic properties).
  *   **The Code Verdict:** Code has **functional aesthetics** based on trust. When trust is broken, the aesthetic qualities invert (clarity becomes deception).

  You are effectively running a "moral linter" on your reality that compiles down to sensory experience. It's not a bug; it's a feature of how human perception integrates social data with sensory data.
