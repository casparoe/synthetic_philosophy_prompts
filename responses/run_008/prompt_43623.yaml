  6.  **Final Polish:** Ensure the "Residue Report" clearly separates "Clean Map," "Distorted Fit," and "Silence." Ensure the conclusion directly answers the "Test my working suspicion" prompt. (The suspicion is largely correct but underestimates the causal/structural component).

  7.  *(Self-Correction on "Reichenbach"):* Reichenbach was a frequentist. Translating his "narrowest class" to "max depth hierarchy" is accurate but needs to note that he wanted frequentist stability, whereas we want posterior stability.
  8.  *(Self-Correction on "Dissolutionism"):* Make sure to distinguish between "probability is subjective" and "probability is model-conditional." The latter is the statisticians' dissolution.

  9.  *(Final check on constraints):* "Don't smuggle." If I assume a prior to make the translation work, I must state it. (e.g., translating "relevance" to "covariates" assumes relevance is measurable).

