      *   *Check:* Did I address the "circularity"? Yes, it's the problem of causal structure vs. statistical association.
      *   *Check:* The user's suspicion. I need to be careful not to just say "You're right." I need to find the edge case where they might be wrong.
      *   *Edge Case:* The "Single Case" ontology. Even Bayesians struggle with *calibration* of single events. If the model is wrong, the probability is wrong. The RCP highlights that *all* models are wrong in this specific way (arbitrary grouping). The residue is the *validation* of the grouping structure itself, which LOO-CV helps with but doesn't solve (since different trees can have similar predictive performance but different causal interpretations).
