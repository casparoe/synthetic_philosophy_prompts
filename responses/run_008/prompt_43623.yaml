      *   **Constraints:** High-level statistics (no fudging), flag assumptions added during translation, honest critique of the user's suspicion.

  2.  **Deconstruct the 5 Positions (Translation Phase):**

      *   *Position 1: The Problem Itself.*
          *   Phil: Single case belongs to infinite overlapping classes. Which one determines "the" probability?
          *   Stat: A single observation $y_i$ is exchangeable with indefinitely many potential sets of other observations $\{y_j\}$. Each set implies a different likelihood structure and hyperprior specification. There is no unique sufficient statistic or likelihood function determined solely by the data generating process *without* specifying the grouping factor.
          *   Key term: Non-identifiability of the exchangeability relation.

      *   *Position 2: Reichenbach's Advice (Narrowest Class).*
          *   Phil: Use the most specific class with reliable stats.
          *   Stat: Maximize model specificity (depth of hierarchy) subject to effective sample size (ESS) constraints at the group level.
          *   Trade-off: Bias-Variance. Deep nesting reduces bias (specificity) but increases variance (fewer groups/observations per group).
          *   Survival: Survives as a heuristic for model selection, but superseded by regularization (partial pooling). It's the limit of no pooling as $n_{group} \to \infty$.

      *   *Position 3: Relevance Weighting.*
          *   Phil: Weight classes by similarity.
          *   Stat: Bayesian Model Averaging (BMA) or Stacking, where weights are based on predictive performance (LOO-CV) or marginal likelihood. Alternatively, a mixture model where the mixing proportion depends on covariate distance (kernel weighting).
          *   Nuance: Is "relevance" just covariate information? If "relevance" is primitive, it's a prior on the structure. If it's data-driven, it's hyperparameter estimation.

      *   *Position 4: Dissolutionism (Subjective/Bayesian).*
          *   Phil: No single-case probability; probability is epistemic/informational.
          *   Stat: $P(Y_{new} | Y_{obs}, M, I)$. The probability is conditional on the model $M$ and information $I$. There is no "true" $P(Y_{new})$ outside the model specification. The "problem" vanishes because the conditional bar is explicit.
          *   Caveat: Requires accepting the model is the ontology.

      *   *Position 5: The Circularity Worry.*
          *   Phil: Choosing the class requires knowing what's relevant, which is what we're trying to learn.
          *   Stat: Model specification search is informed by the same data used for inference (double dipping) or requires external causal knowledge (DAGs) not contained in the likelihood. It's the problem of *structural identification* without strong priors or experimental design.

  3.  **Drafting the Residue Report (The Core Analysis):**

      *   *Mapping:*
          *   "Reference Class" $\to$ "Exchangeability Grouping / Hierarchy Structure".
          *   "Narrowest Class" $\to$ "No Pooling / Max Interactions".
          *   "Relevance" $\to$ "Covariates / Kernel / Hyperpriors".
          *   "Single Case Probability" $\to$ "Posterior Predictive Distribution".

      *   *Distortions:*
          *   Philosophers often treat "class" as ontological. Stats treats it as structural.
          *   Reichenbach's frequentism vs. Bayesian partial pooling.

      *   *The Missing Piece (The User's Suspicion):*
