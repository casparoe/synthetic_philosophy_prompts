answer: |-
  # Spec Sheet: Adequacy Conditions for a Theory of Standing to Blame

  **Domain:** Interpersonal Ethics / Normative Authority
  **Objective:** Define the necessary and sufficient conditions under which an agent (S) possesses the normative authority to direct blame toward a target (T) for a wrong (W).
  **Note:** This spec distinguishes *standing* (the right to address the blame) from *correctness* (the truth of the blame) and *worthiness* (the blameworthiness of the target).

  ---

  ### I. Core Case Coverage (The "Must-Haves")

  **1. The Hypocrite Constraint [Non-Negotiable]**
  *   **Case:** S blames T for W, but S is guilty of W (or relevantly similar wrongs) and has not repented.
  *   **Requirement:** The theory must explain why S's blame is normatively defective (e.g., inappropriate, unfitting, or liable to be rebuffed) *even if* T is genuinely blameworthy for W.
  *   **Nuance:** Must distinguish between *relevant* hypocrisy (same norm violation) and *general* imperfection. A theory that denies standing to all imperfect agents is over-generating.

  **2. The Meddler Constraint [Non-Negotiable]**
  *   **Case:** S is a stranger with no relational history or stake in T's conduct regarding W. S blames T.
  *   **Requirement:** The theory must explain why S's blame is deficient compared to a stakeholder's blame, even if S is morally pristine regarding W.
  *   **Nuance:** Must allow for *some* standing for general moral community members (to avoid moral solipsism) while respecting the intuition that "busybody" blame is distinct from "victim" blame.

  **3. The Victim Priority Constraint [Non-Negotiable]**
  *   **Case:** T wrongs V (Victim). S (Stranger) and V both blame T.
  *   **Requirement:** The theory must account for the asymmetry in normative authority. V's blame carries a weight (e.g., entitlement to resentment, authority to demand apology) that S's blame lacks.
  *   **Nuance:** This cannot be explained solely by epistemic access; it must be a normative difference in *right*.

  **4. The Modal Status Constraint [Non-Negotiable]**
  *   **Case:** Distinguishing between lacking standing initially vs. losing it vs. waiving it.
  *   **Requirement:** The theory must differentiate:
      *   **Absence:** S never had standing (e.g., total stranger to a private matter).
      *   **Forfeiture:** S had standing but lost it (e.g., via hypocrisy or prior wrongdoing against T).
      *   **Waiver:** S has standing but chooses not to exercise it (e.g., forgiveness).
  *   **Messiness Allowance:** The theory is permitted to be vague on the precise mechanism of *restoration* of standing, provided it explains the loss.

  ---

  ### II. Conceptual Distinctions (The "Do Not Collapses")

  **5. The Authority/Correctness Distinction [Non-Negotiable]**
  *   **Consideration:** Blame can be factually false ("You didn't do it") or standingly defective ("You did it, but it's not your place to say").
  *   **Requirement:** The theory must treat standing as independent of the truth conditions of the blame. A hypocrite can issue a *true* blame that is nevertheless *unauthorized*.
  *   **Failure Condition:** Any account that reduces standing to epistemic reliability or factual accuracy is rejected.

  **6. The Local/Global Distinction [Non-Negotiable]**
  *   **Consideration:** S may be a person of bad character generally but still have standing to blame T for specific W.
  *   **Requirement:** Standing must be sensitive to the specific norm violated. S's general vice does not automatically strip standing unless it implicates the specific norm at issue in W.
  *   **Failure Condition:** Accounts that tie standing to overall moral virtue (the "Saints Only" problem) are rejected.

  **7. The Expression/Attitude Distinction [Theoretical Preference]**
  *   **Consideration:** Does standing govern the internal feeling of resentment or only the external expression of blame?
  *   **Requirement:** *Preference for Dual-Aspect.* An adequate theory should ideally explain why the hypocrite's *expressed* blame is objectionable, but need not commit to whether their internal resentment is metaphysically impossible. However, a theory that cannot explain the impropriety of *address* is insufficient.

  ---

  ### III. Structural Tensions & Incompatibility Flags

  **8. The Uniformity vs. Pluralism Tension [Potential Incompatibility]**
  *   **Conflict:** Can a single condition explain both the Hypocrite case and the Meddler case?
      *   *Hypothesis A (Uniformity):* Standing is based on one metric (e.g., "Moral Authority").
      *   *Hypothesis B (Pluralism):* Victims have standing for Reason X (harm receipt), while bystanders have standing for Reason Y (community norms).
  *   **Flag:** A theory demanding a **Single Uniform Condition** [Preference] may be incompatible with the **Victim Priority Constraint** [Non-Negotiable] if the victim's standing derives from a source the stranger cannot access. Theories are allowed to posit plural sources of standing, but must explain how they interact without contradiction.

  **9. The Severity vs. Standing Tension [Potential Incompatibility]**
  *   **Conflict:** Does the severity of W affect standing thresholds?
  *   **Flag:** A theory that sets a **Fixed Threshold** for standing (e.g., "must be blameless regarding W") may be incompatible with the **Meddler Constraint** in cases of atrocity. Intuitively, strangers gain standing to blame for genocide even if they are imperfect, whereas they lack standing to blame for minor social faux pas. A rigid theory cannot accommodate this scalar intuition.

  ---

  ### IV. The Killer Constraint

  The single requirement that eliminates the leading contenders is the **Independence of Blameworthiness combined with the Hypocrite/Meddler Intersection**. Accounts built solely around **hypocrisy** (e.g., forfeiture views) fail the Meddler Constraint: they cannot explain why a morally pristine stranger lacks the standing that a victim possesses, as the stranger has not forfeited anything. Conversely, accounts built solely around **personal stake** (e.g., relational views) fail the Hypocrite Constraint: they cannot explain why a victim who is themselves guilty of the same wrong lacks the standing to blame, despite having the maximal stake. An adequate theory must therefore posit a condition that is neither purely about the blamer's moral record nor purely about their relational proximity, but rather about the **normative congruence between the blamer's commitment to the norm and their relationship to the target**. It must explain why standing is a function of *authority*, which requires both a stake in the norm (to avoid meddling) and fidelity to the norm (to avoid hypocrisy).
