      *   *Premise 1 (Definition of Deception):* Standard interpersonal deception model applied to the self.
      *   *Premise 2 (Intention-Belief Link):* Often called the "Intention-Belief Thesis." (To intend $X$, I must believe $X$ is possible/achievable).
