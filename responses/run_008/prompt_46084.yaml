answer: |-
  You are circling a well-known problem in archaeology and historiography, but you are correct: there is no single, universally standardized noun phrase for it (like "Survivorship Bias") that you can drop into a sentence without qualification.

  However, there is a constellation of concepts that describe it, and one specific framing that fits your needs best.

  ### The Existing Concepts (and why they miss)

  1.  **Argumentum ex Silentio (Argument from Silence):** This is the logical fallacy underpinning the error (assuming something didn't happen because it wasn't recorded). It's accurate but too broad; it applies to everything from missing tax returns to lost manuscripts, not specifically to the *elite/monumental* nature of the silence.
  2.  **State-Centric Bias:** This is the theoretical critique (championed by scholars like James C. Scott and Patricia McAnany). It argues that archaeologists often equate "society" with "the state." When the state fails, they write "society failed." This is the *cause* of your problem, but it's a bit dry for a general audience.
  3.  **Complexity vs. Continuity:** In collapse studies (e.g., Guy Middleton's *Understanding Collapse*), this is the standard distinction. "Collapse" is defined as a loss of socio-political *complexity* (monuments, writing, tribute), not necessarily a loss of *population* or *culture*. This is the most accurate academic description, but it's a distinction, not a name for the bias itself.
  4.  **Elite Visibility Bias:** This describes the data skew (we see palaces, not huts), but it doesn't capture the *interpretive leap* where visibility is equated with existence.

  ### The Best Fit: "The Legibility Trap"

  If you want a term that captures the mechanism *and* the error, I recommend coining (or adopting) **"The Legibility Trap."**

  This leans on James C. Scott's concept of **"legibility"** (*Seeing Like a State*). States make populations "legible" through taxes, censuses, stelae, and Linear B tablets. When the state collapses, the population doesn't die; they just become **illegible** to the historical record. They stop producing the data that *you* use to see them.

  **Definition:**
  > **The Legibility Trap:** The interpretive error of mistaking the cessation of elite record-keeping for the cessation of human presence. It occurs when a society transitions from a "high-legibility" state (monuments, writing, palaces) to a "low-legibility" one (vernacular, oral, village-based), leading observers to declare a collapse where there is only a change in visibility.

  ### Boundary Cases (The Carving)

  To use this term precisely, you need to distinguish it from actual demographic collapse.

  *   **The Trap (Maya/Bronze Age):** The *signal* stops, but the *biology* continues. Isotopic analysis, pottery shards, and oral traditions show continuity. The "collapse" is a loss of the *state's ability to narrate itself*.
  *   **The Contrast Class (Black Death):** High legibility is maintained *through* the catastrophe. Parish records, wills, and tax rolls continue but show a spike in deaths. The signal persists, confirming the tragedy.
  *   **The Gray Zone (True Dissolution):** Sometimes the state falls *and* the population scatters (e.g., the Ancestral Puebloans migrating from the Four Corners). Here, the legibility trap is harder to avoid without bio-archaeology (strontium isotopes showing migration vs. local continuity). If the people leave, it's not a trap; it's a diaspora. If they stay and farm quietly, it's the trap.

  ### How to Use It

  For your editor and your sentence, you want something that kills the word "collapse" without requiring a footnote.

  **Option 1 (Direct & Punchy):**
  > "What historians often call a 'collapse' is actually a **legibility trap**: the moment a civilization stops writing its own biography in stone, we mistakenly assume it stopped living."

  **Option 2 (More Academic):**
  > "This is less a demographic collapse than a **state-centric visibility bias**, where the failure of elite institutions is misread as the extinction of the people they once ruled."

  **Option 3 (The "Monumental" Angle):**
  > "We are falling for the **monumental fallacy**: assuming that when the building stops, the people disappear."

  ### Recommendation

  Go with **Option 1 ("The Legibility Trap")**.

  It is conceptually robust (it aligns with Scott, McAnany, and Middleton), it explains *why* the error happens (the data stream dries up), and it allows you to pivot immediately to the evidence that *does* exist (pottery, pollen, DNA) which proves the people were still there, just off the grid.

  It gives you a way to say: *"The lights didn't go out; we just lost the ability to see them."*
