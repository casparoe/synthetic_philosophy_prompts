          *   Legible Metrics: Very hard (evals are weak).
          *   Internalized Risk: No (externalities dominate).
      *   *Verdict:* The housemate's argument is too optimistic. The tax might reduce due to efficiency gains, but the *competitive disadvantage* remains if safety slows you down and the market rewards speed/capability over safety (because harms are externalized).

  6.  **Addressing the User's Intuition (The Externality):**
      *   This is the core issue. In economics, this is a "negative externality."
      *   Car safety became a selling point because buyers feared *their own* death.
      *   AI safety is often about preventing harm to *others* (or the buyer's company reputation, but less directly).
      *   *Does it kill the argument?* It kills the "market will solve it naturally" part. It necessitates *regulation* to internalize the cost. If regulation is weak, the tax remains.
      *   *Nuance:* Enterprise buyers might care about liability (e.g., a bank using AI doesn't want it to break laws). So for B2B, safety *is* a feature. For B2C/General capability race, less so.

