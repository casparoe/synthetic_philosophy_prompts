          3.  Distinguish between "nitpicks" and "critical breaks" that affect the conclusion.
          4.  Evaluate whether the conclusion ("the tax will melt") survives these disanalogies.
          5.  Address the user's specific intuition: *Car safety benefits the buyer; AI misalignment harms others/later.*

