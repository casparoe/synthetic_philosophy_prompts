answer: |-
  # Specification of Adequacy: Theories of Consciousness Distribution

  **Context:** Graduate Reading Group on Animal Minds
  **Purpose:** Practical adjudication for welfare and research protections (not metaphysical resolution).
  **Definition:** A theory of distribution maps organism descriptions (structure, behavior, history) to verdicts on existence, degree, and kind of phenomenal consciousness.

  Below are the requirements any contender theory must meet to be considered adequate for our purposes. Each requirement includes the motivating case, a judgment on negotiability (relative to our practical goal), and an "honesty check" regarding philosophical biases.

  ---

  ## I. Case-Based Requirements

  ### 1. Architectural Neutrality
  *   **Motivation:** *Convergent Evolution (Birds) & Decentralization (Octopus).* A theory cannot mandate a mammalian neocortex or a centralized brain as a necessary condition. Birds achieve complex cognition via a nuclear pallium; octopuses distribute processing to arms. A theory tied to specific vertebrate anatomy is taxonomically chauvinistic.
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This is a prejudice against *Type-Identity Theory* (which equates mental states with specific physical states). It privileges Functionalism or Abstract Structuralism (like IIT). We accept this bias because welfare policy cannot wait for a resolution of the mind-body problem, and phylogenetic fairness is a moral imperative.

  ### 2. Structural Sufficiency
  *   **Motivation:** *C. elegans.* In the one case where we possess the complete connectome (302 neurons), the theory must yield a verdict. A theory that claims "structural data is insufficient without behavioral report" is empty where data is maximal. It must be able to process a wiring diagram into a consciousness probability.
  *   **Status:** **Negotiable.**
  *   **Honesty Check:** This strongly favors Neural-Substrate theories (e.g., IIT) over Behavioral or Higher-Order theories. It assumes consciousness supervenes on structure. We mark this negotiable because a theory might correctly argue that 302 neurons is below the *functional* threshold for consciousness, provided it explains *why* structurally, rather than pleading ignorance.

  ### 3. The Nociception Boundary
  *   **Motivation:** *Boundary with Nociception.* The theory must distinguish phenomenal pain (suffering) from nociceptive reflex (damage avoidance) and from moral status (rights). It must specify which separation it is drawing. A system that withdraws from heat is not necessarily *hurt* by heat.
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This is a direct prejudice against **Behaviorism**. If behavior is the definition of mind, reflex and pain collapse. We enforce this because welfare policy requires knowing when to use analgesia versus when simple restraint suffices. Conflating reflex with suffering leads to resource misallocation; conflating them with moral status leads to policy paralysis.

  ### 4. Behavioral Weighting
  *   **Motivation:** *Arthropods/Crustaceans.* Evidence is mixed (trade-offs, analgesic self-administration, play). The theory must provide a principled method for weighing behavioral complexity against neural simplicity. It cannot simply dismiss behavior as "epiphenomenal" nor accept it as "conclusive."
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This prejudices against "Neural Chauvinism" (the idea that only the brain matters). It acknowledges that for welfare officers, behavior is the primary data stream. A theory that ignores behavior is operationally useless, even if metaphysically sound.

  ### 5. Extrapolative Power
  *   **Motivation:** *Novel Organisms.* The theory must extend to organisms unlike any observed (e.g., synthetic life, radically different alien biology). A theory that only interpolates among known earth animals is a field guide, not a theory.
  *   **Status:** **Negotiable.**
  *   **Honesty Check:** This is a theoretical virtue, not a practical necessity. For our specific goal (earth-animal welfare), a theory that works perfectly for all extant species but fails for silicon-based life is acceptable. We prioritize accuracy on *actual* cases over robustness on *possible* cases.

  ---

  ## II. Meta-Requirements

  ### 6. Third-Person Operability
  *   **Consideration:** No animal can file a report. The theory must be applicable using evidence available to an external observer (anatomy, behavior, physiology).
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This excludes methodologies relying on first-person introspection or linguistic verification. It is a prejudice against strong **Higher-Order Thought (HOT)** accounts that tie consciousness to reportable meta-cognition. We accept this because a welfare standard animals cannot satisfy is no standard at all.

  ### 7. Gradability
  *   **Consideration:** The theory must state whether consciousness is binary (on/off) or scalar (degrees). If scalar, it must define the metric. If binary, it must define the threshold and the protocol for organisms near the boundary.
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This prejudices against Cartesian views that treat consciousness as an indivisible substance. It favors evolutionary and neural-complexity views. Practically, welfare protections *must* scale (e.g., mice vs. chimps), so a binary theory must effectively simulate degrees via threshold proximity.

  ### 8. Phylogenetic Independence
  *   **Consideration:** Proximity to humans cannot be a tacit tiebreaker. A theory cannot assume that if a trait exists in humans and chimps, it exists in chimps *because* they are like humans.
  *   **Status:** **Non-negotiable.**
  *   **Honesty Check:** This targets "Default Humanism." It demands that the criteria be grounded in the organism's own capacities, not its relation to us. This is a moral requirement for the group's purpose.

  ---

  ## III. Analysis of Tensions and Exclusions

  ### 1. The Unsatisfiable Subset: The "Verification Trilemma"
  There is a joint tension between three requirements: **Third-Person Operability**, **The Nociception Boundary**, and **Structural Sufficiency (Determinate Verdicts)**.

  *   **The Conflict:**
      *   **Third-Person Operability** limits us to observing structure and behavior.
      *   **The Nociception Boundary** demands we distinguish internal *feel* from external *reflex*.
      *   **Structural Sufficiency** demands a definite verdict (Yes/No/Degree) even in minimal cases (like *C. elegans*).
      *   *Problem:* In minimal organisms, reflex and complex behavior can be structurally and behaviorally indistinguishable from the third-person perspective. If we must distinguish feel from reflex (Req 3) using only third-person data (Req 6), we face radical underdetermination. We cannot generate a *determinate verdict* (Req 2/7) without guessing.

  *   **Resolution:** We must drop the demand for **Determinate Verdicts** in boundary cases.
  *   **Cost:** We must accept a **Precautionary Principle** rather than a theoretical certainty. In cases where the theory cannot distinguish reflex from feel third-personally (e.g., decapod crustaceans), the specification must allow the theory to output "Indeterminate: Treat as Conscious."
  *   **Why:** For our practical purpose (welfare), a false negative (denying protection to a feeling being) is costlier than a false positive (granting protection to a reflex machine). A theory that demands certainty where none is empirically available is useless for policy. We sacrifice theoretical precision for ethical safety.

  ### 2. The Single Most Exclusionary Requirement
  **Requirement 3: The Nociception Boundary.**

  *   **Argument:** This requirement excludes the **Behavioral Theory** family more decisively than any other requirement excludes its competitors.
      *   **Why:** Behavioral theories (logical or methodological behaviorism) define mental states by dispositions to behave. If an organism withdraws from injury and protects the injured site, a behavioral theory *must* ascribe pain. It is definitionally barred from distinguishing "nociceptive reflex" from "phenomenal pain" if the outputs are identical. To meet Requirement 3, a Behavioral theory must cease to be a Behavioral theory and posit hidden internal variables.
      *   **Comparison:**
          *   *Third-Person Operability* pressures **HOT** theories, but sophisticated HOT accounts can operationalize meta-cognition via behavioral proxies (e.g., uncertainty monitoring). They are strained, but not definitionally broken.
          *   *Architectural Neutrality* pressures **Mammalian-Centric Neural** theories, but many neural theories (like IIT) are already substrate-neutral.
          *   *The Nociception Boundary* breaks the **Behavioral** family at the foundation.
  *   **Implication for the Group:** By enforcing this requirement, we are effectively deciding that **Behaviorism is inadequate for welfare policy.** This is a significant theoretical commitment. It forces the reading group to focus on Neural-Substrate, Biological-Function, or Higher-Order accounts, all of which posit an internal state distinct from the output. This aligns with our practical goal: we need to know when to administer anesthetics (targeting internal feel), not just when to stop a behavior (targeting output).

  ---

  **Summary for the Reading Group:**
  This specification prioritizes **ethical safety** over **metaphysical certainty**. It explicitly rules out Behaviorism (via the Nociception Boundary) and demands that remaining theories handle decentralized and non-mammalian architectures. It acknowledges that we cannot have certainty in boundary cases (dropping Determinate Verdicts) and mandates that uncertainty be resolved in favor of the animal (Precautionary Principle). Any theory brought to the table must survive this filter.
