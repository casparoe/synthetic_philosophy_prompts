  Priya will count the keys, Devadatta, and alarm cases as knowledge via absence and presumption, but she will reject the tiger case due to insufficient conditions for establishing absence. Her rulings map precisely onto the Bhāṭṭa Mīmāṃsā school, which posits six independent sources of knowledge (pramāṇas) rather than the Nyāya four, specifically validating *abhāva* (non-perception/absence) and *arthāpatti* (presumption) as distinct from perception and inference. In the keys and alarm cases, the conditions for *abhāva* are met—the objects would be perceived if present given the light and instrument reliability—whereas the tiger hunt fails because a large forest does not guarantee perceptibility, mirroring her earlier rejection of the smokeless fire inference where the sign was not invariant. The Devadatta case is the textbook example of *arthāpatti*: the contradiction between his fatness and his daytime fasting is resolved only by presuming night eating, a move Nyāya reduces to inference but Mīmāṃsā treats as a separate epistemic instrument. The rival rule is the Nyāya system, which would yield identical yes/no verdicts on these specific cases but would reclassify absence as a type of perception and presumption as a type of inference, denying them independent status. To pull these rivals apart, you need a fifth case where logical concomitance fails but explanatory necessity remains: present Priya with a scenario where a friend is smiling despite known tragic news, forcing the conclusion that he is masking grief. Nyāya would likely deny this as knowledge because smiling does not invariably imply masking grief (invalidating inference), while Mīmāṃsā would accept it as *arthāpatti* because it is the only way to resolve the contradiction between the smile and the tragedy.
