          *   *Cognitive/Understanding Progress:* Even without consensus, do we understand the *space* of possibilities better? (Sider, Williamson).
          *   *Institutional/Professional Progress:* Better peer review, clearer writing, more diverse voices (though maybe less relevant to truth).
      *   **Function of Philosophy:**
          *   *Therapeutic/Clarificatory:* Wittgensteinian view (dissolving problems rather than solving them).
          *   *Conceptual Engineering:* We aren't finding truths, we're building better tools (Carnap/Chalmers).
