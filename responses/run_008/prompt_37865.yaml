      It is rare to find a graduate student who recognizes the Meno problem not merely as a puzzle to be solved but potentially as a symptom of a deeper structural issue in epistemology, and your intuition about the relocation of value is precisely where the most fruitful work lies for someone with your background. If I were advising you on how to spend the next two years, I would urge you to invert the standard dependency structure that most literature presupposes. The standard view assumes the Basic Meno Problem is well-formed and that the Swamping Problem is the technical hurdle preventing its solution, but I suspect the Swamping Problem is actually downstream of a more fundamental ambiguity regarding what kind of value we are demanding from knowledge in the first place. Your worry that proposed answers merely relocate value suggests that the real open question is whether the value problem is a substantive question or a demand for unification that epistemology was never going to deliver on, and this meta-question is the one that holds the key to the others. If you can determine whether the demand for knowledge's value is a demand for final value, instrumental value, or constitutive value, you will either dissolve the Swamping Problem entirely or show why it is intractable, which is itself a significant philosophical result.

      Consequently, I would recommend that you begin not with the Swamping Problem itself, but with the conceptual architecture of the value claim, leveraging your logic background to map the presuppositions required for the problem to arise. The Swamping Problem relies heavily on veritism, the view that truth is the fundamental epistemic value, and if you spend your first year analyzing whether veritism is a necessary precondition for the Meno Problem, you will find that many proposed solutions fail simply because they try to maintain veritism while escaping swamping, which may be impossible. By contrast, the view that knowledge's value comes from its role as the norm for assertion and practical reasoning offers a way to bypass the Swamping Problem by making the value extrinsic rather than intrinsic to the state itself, and this is a much more tractable avenue for a two-year project. If knowledge is valuable because it is the norm of a valuable practice, then the fact that true belief gets you to the right action is irrelevant because true belief does not satisfy the norm, and this shifts the debate from axiology to the philosophy of action and language. This approach is more tractable because it allows you to engage with concrete cases of assertion and reasoning rather than abstract axiological principles that have been churned over for decades without resolution.

