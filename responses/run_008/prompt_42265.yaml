answer: |-
  1. The practice presupposes a theory of corporate agency where the state is a continuous moral person distinct from its transient citizenry, bearing obligations that survive generational turnover. This view treats the polity as an enduring entity capable of owning past actions as its own, regardless of the biological identity of its current constituents.

  2. This stance quietly rules out strict methodological individualism and voluntarist accounts that bind obligation solely to personal causal contribution. It also rejects the notion that political communities dissolve morally whenever their membership changes significantly.

  3. The practice remains consistent with the refusal of inherited individual guilt because political liability functions as a debt of institutional repair rather than a stain of personal criminal culpability. Current citizens pay not because they are sinners, but because they are beneficiaries and custodians of an enduring structure that incurred the debt.

  4. The practice is underdetermined because it could be justified equally by forward-looking theories of reconciliation or backward-looking claims of unjust enrichment without settling the metaphysical status of collective guilt. Consequently, one can support reparations based on current unfair distributions of wealth rather than admitting any ancestral sin.

  5. A state apology is best read as an admission of Political Guilt, where citizens share liability for their state's deeds without sharing personal Moral or Criminal guilt. If replaced with a strictly individualist view, the practice would collapse into symbolic regret devoid of reparative obligation, since no living individual could be held liable for another's wrong.
