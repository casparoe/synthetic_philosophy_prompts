answer: |-
  **Scenario**
  Consider two patients, A and B, presenting with identical chronic neuropathic pain syndromes in a clinical setting. Both subjects exhibit functional isomorphism at the level standardly employed by functionalists: they report identical subjective intensity (8/10 on a visual analog scale) and quality ("burning") in response to identical thermal stimuli; they display indistinguishable withdrawal reflexes and autonomic arousal (heart rate, galvanic skin response); and neuroimaging reveals identical activation patterns in the anterior cingulate and insular cortices, reflecting the same causal relations between nociceptive input, pain-state maintenance, and behavioral output. However, the subvenient realization of this state differs: Patient A's pain state is sustained by [Placeholder: Overexpression of Receptor Type X], while Patient B's is sustained by [Placeholder: Mutated Ion Channel Y], a physiological distinction detectable via standard biopsy or genetic panel but invisible to behavioral or macro-neural observation. A clinician administers [Placeholder: Antagonist Drug Z], which specifically blocks Receptor Type X; Patient A's pain resolves immediately, while Patient B's state persists unchanged, demonstrating that the causal efficacy of the intervention tracks the physical realization rather than the functional role.

  **Walkthrough of Verdicts**
  (i) **Functionalism:** Orthodox functionalism individuates mental states by their causal role—specifically, their relations to sensory inputs, behavioral outputs, and other internal states. Since A and B share identical stimuli, identical verbal/motor outputs, and identical macro-neural causal transitions prior to intervention, the functionalist machinery necessitates classifying them as instantiating the *same* mental state (e.g., "Pain-State P"). The theory treats the underlying receptor vs. channel distinction as irrelevant realization detail, provided the causal map remains constant.
  (ii) **Type-Identity Theory:** This framework individuates mental states by their physical constitution. Since A's state is constituted by [Receptor X activity] and B's by [Ion Channel Y activity], and these are distinct physical types, the identity theorist's machinery classifies them as being in *different* states, regardless of their functional equivalence.
  (iii) **Practical Verdict:** The clinically correct course of action requires distinguishing A from B. Administering Drug Z to A is therapeutic; administering it to B is futile (and potentially risky due to side effects). The identity theorist's classification anticipates this divergence because it tracks the physical property that determines drug susceptibility. The functionalist classification, by lumping A and B together, obscures the relevant difference, potentially leading to a treatment error. Thus, the "practically right" line through the world aligns with the identity theorist's grain, not the functionalist's.

  **Working Feature and Sensitivity Analysis**
  The feature doing the philosophical work is **Latent Causal Potency**: the capacity of the physical substrate to interact with specific external manipulators (drugs) in ways not determined by the system's *natural* input-output profile. The verdicts depend on the realization difference being *causally potent* regarding the intervention but *functionally silent* regarding standard inputs/outputs. If this feature is weakened—for instance, if the receptor difference caused a detectable difference in reaction time or pain quality *before* the drug was administered—the functionalist could absorb the distinction by refining the input/output description (e.g., "Pain-State P1" vs "Pain-State P2"). If the feature is removed (i.e., the realizations are identical), both theories converge, and the intervention affects both subjects equally. The argument holds only so long as the realization difference remains invisible to the coarse-grained functional description but visible to the causal powers of the physical world.

  **Strongest Functionalist Reply**
  A committed functionalist should argue that the differential response to Drug Z reveals that A and B were *never* truly functionally isomorphic. Functionalism defines states by their dispositional properties; if A has the disposition to cease pain-behavior upon administration of Z, and B lacks this disposition, they occupy different causal roles. Therefore, a sufficiently fine-grained functional description would include susceptibility to Z as part of the state's definition, allowing functionalism to distinguish A and B without conceding to identity theory.

  **Critique of the Reply:**
  While logically available, this move is **ad hoc** and undermines the functionalist's broader project. Standard arguments for multiple realizability rely on *coarse-grained* individuation to claim that a silicon robot or an alien can feel pain despite having different physics than humans. If the functionalist refines the grain here to include specific pharmacological susceptibilities to save the theory from clinical counterexamples, they lose the ability to generalize across disparate physical substrates in the philosophical cases. If every physical difference that yields a differential intervention response counts as a functional difference, functionalism collapses into a notational variant of type-identity theory, surrendering the very multiple realizability that was supposed to be its primary asset.
