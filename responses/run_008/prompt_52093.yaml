  ### The Prediction
  She will choose **Option A: One randomly selected resident gets a full year of chronic pain.**

  ### The Underlying Rule: "Threshold-Weighted Aggregation"
  Your flatmate is not running a single, simple algorithm like "always maximize utility" or "never harm an innocent." Her log reveals a hybrid system I call **Threshold-Weighted Aggregation**. It operates on three tiers:

  1.  **The Means Constraint (Absolute):** Never use an innocent person as a *component* or *tool* to save others. This explains her refusals in the **Fat Man** and **Surgeon** cases. In both, the individual is actively manipulated/killed as the *method* of saving the five. In the **Trolley** case, the death is a foreseen side-effect of diverting a threat, not the method itself, so she pulls the lever.
  2.  **The Aggregation Zone (Standard):** For ordinary harms (money, property, statistical risk, moderate physical pain), she is a strict aggregative consequentialist. She sums the total harm and minimizes it. This explains the **Rail Levy** (small cost × everyone < 12 lives) and the **Flood** (10,000 ruined gardens > 1 ruined house). In the Flood case, she sacrificed the one house owner's "life project" because the total utility loss of 10,000 gardens was greater.
  3.  **The Severity Threshold (Lexical):** There is a specific ceiling of harm—likely centered on **extreme torture or certain death**—that cannot be outweighed by *trivial* harms, regardless of the number. This explains the **Specks** case. She "picked the specks" (imposing them on 3^^^3 people) to save the one from torture. She explicitly noted that anyone hesitating "hasn't grasped the number," implying that while the number is vast, the *quality* of torture is lexically worse than the *quality* of a speck. She refuses to aggregate trivialities against extreme suffering.

  ### Why She Picks Option A (The Parasite Case)
  The Parasite scenario is designed to look like the Specks case, but it falls squarely into her **Aggregation Zone**.

  *   **Means Constraint:** The prompt explicitly states "nobody is being used as a component... pure collateral." This removes the Fat Man/Surgeon block.
