  *   **Conclusion:** She will view Option B as a societal catastrophe (10 million person-days of suffering) and Option A as a concentrated tragedy. Consistent with the Flood and Trolley verdicts, she will minimize the total aggregate harm. She will sacrifice the one to save the many, because the harm to the one does not cross her "Torture/Death" lexical threshold.

