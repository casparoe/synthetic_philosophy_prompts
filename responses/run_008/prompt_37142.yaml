prompt: |-
  ok so for my ethics class final we get to pick any topic and I'm doing whether everyday conventions like tipping, waiting in line, and not jaywalking are actually moral obligations or just habits. Before I start reading actual philosophers on this I want to figure out what a good theory of it even needs to do. Like write me the list of requirements — the cases it has to get right (e.g. does a tourist from a no-tipping country have to tip here anyway, is jaywalking on a completely empty 3am street still wrong, does cutting a line nobody's watching count), the distinctions it can't collapse (like between "wrong because it's unfair to others" vs "wrong just because it's the local rule"), and whatever else you think it needs to handle. Also say which requirements are truly non-negotiable vs just what one side of the debate wants, and if you think any two of the requirements can't both be satisfied at once tell me that too bc my teacher said thats the interesting part. no citations or reading lists plz, I just want the spec itself
reasoning: |-
  Here's a thinking process that leads to the suggested requirements list:

  1.  **Analyze the Request:**
      *   **Topic:** Are everyday conventions (tipping, queuing, jaywalking) moral obligations or just habits?
      *   **Task:** Create a "specification" or list of requirements for a theory that attempts to answer this question.
      *   **Key Elements:**
          *   Cases the theory must handle (intuition pumps).
          *   Distinctions the theory must maintain.
          *   Classification of requirements (Non-negotiable vs. Contested).
          *   Identification of potential tensions/incompatibilities between requirements (the "interesting part").
      *   **Constraints:** No citations, no reading lists, just the spec.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The central tension is between *Convention/Rule-Following* and *Substantive Moral Reasoning*.
      *   If conventions are moral obligations, why? (Social contract? Coordination? Respect?)
      *   If they are just habits, when do they become moral? (When harm occurs? When expectations are violated?)
      *   The theory needs to explain *normativity* (why we feel bound) without over-moralizing trivial acts or under-moralizing harmful breaches of trust.

  3.  **Brainstorming Test Cases (Intuition Pumps):**
      *   *The Tourist:* Ignorance of local custom. Is it wrong?
      *   *The Empty Street:* Jaywalking at 3 AM. No harm, no foul?
      *   *The Invisible Line:* Cutting when no one sees/cares.
      *   *The Bad Convention:* Segregation lines, tipping based on race. When is breaking a convention *required*?
      *   *The Foreigner:* Doing what's normal at home but weird here (e.g., slurping noodles).
      *   *The Systemic Impact:* One person jaywalking vs. everyone jaywalking (generalization).

  4.  **Brainstorming Necessary Distinctions:**
      *   *Moral Wrong vs. Social Awkwardness:* Rude vs. Evil.
      *   *Prudential vs. Moral:* Don't jaywalk because you'll die (prudence) vs. because it's illegal/unfair (moral).
      *   *Convention vs. Law:* Speeding is illegal, but is it immoral?
      *   *Expectation vs. Obligation:* People expect tips, but are they owed them?

  5.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: The Harm Principle.* Needs to explain when a convention protects people.
      *   *Req 2: The Coordination Problem.* Needs to explain why we follow rules even when breaking them helps *me* (Prisoner's Dilemma style).
      *   *Req 3: The Ignorance Clause.* What about outsiders?
      *   *Req 4: The Bad Rule Exception.* What if the convention is unjust?
      *   *Req 5: The Triviality Threshold.* Not every breach is a sin.

  6.  **Classifying Requirements (Non-negotiable vs. Contested):**
      *   *Non-negotiable:* Logical consistency, ability to distinguish moral from non-moral.
      *   *Contested:* How much weight to give social expectations vs. objective harm.

  7.  **Identifying Tensions (The "Interesting Part"):**
      *   *Tension 1: Universality vs. Locality.* Morality is usually seen as universal (don't kill), but conventions are local (tip 20% in US, 0% in Japan). A theory that makes conventions moral risks making morality relative. A theory that makes morality universal risks ignoring the moral weight of local agreements.
      *   *Tension 2: Intent vs. Outcome.* Is it wrong because you broke a promise (implicit) or because someone got hurt?
      *   *Tension 3: The "Free Rider" vs. "Futility" problem.* If my action doesn't change the outcome (empty street), is it still wrong? If I say "no," then why queue? If I say "yes," why is it moral and not just logical?

  8.  **Refining and Formatting:**
      *   Organize into clear sections: Core Function, Test Cases, Distinctions, Tensions.
      *   Use clear, direct language (matching the user's tone).
      *   Ensure the "Non-negotiable vs. Contested" distinction is sharp.
      *   Highlight the incompatibilities clearly.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include citations? *No.*
      *   *Check:* Did I address the tourist case? *Yes.*
      *   *Check:* Did I address the empty street case? *Yes.*
      *   *Check:* Is the distinction between "unfair" and "rule-breaking" clear? *Yes.*
      *   *Refinement:* Make sure to emphasize the difference between *etiquette* and *ethics*. That's the crux of the class assignment.

  10. **Final Polish:** (Produces the final output provided previously.)
      *   Structure: Introduction -> Core Jobs -> Test Cases -> Distinctions -> The Tensions (The "Hard Mode").
      *   Tone: Analytical, helpful, slightly provocative (to aid essay writing).

  *(Self-Correction Note)*: I need to make sure I don't accidentally solve the problem for them. The prompt asks for the *spec*, not the solution. Keep it focused on what the theory *must do*, not what the answer *is*.

  *(Final thought on Tensions)*: The biggest tension is between "Morality is Categorical" (Kantian-ish) and "Conventions are Contingent" (Humean-ish). If morality is categorical, how can a contingent rule (drive on the left) become moral? If conventions are just habits, why do we feel guilt? I need to articulate this clash clearly.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the specification for a theory of "Conventional Morality." This is designed to stress-test any argument you plan to make or evaluate.

  ### I. Core Jobs (What the Theory Must Explain)
  A successful theory cannot just say "yes it's moral" or "no it's not." It must explain the *mechanism* of the obligation.

  1.  **The Source of Normativity:** It must identify where the "ought" comes from. Is it from the *consequences* of breaking the rule (harm), the *agreement* implied by participating (consent), or the *virtue* of the person following it (character)?
  2.  **The Threshold of Triviality:** It must explain why some convention breaches are merely rude (chewing with mouth open) while others are unethical (cutting in line at a vaccine clinic). There must be a sliding scale or a bright line.
  3.  **The Stability Condition:** It must explain why we are obligated to follow a convention even when our individual contribution makes no visible difference (e.g., paying taxes, tipping on a one-time visit).

  ### II. The Test Cases (Intuition Pumps)
  Your theory needs to deliver a verdict on these specific scenarios without contradicting itself.

  1.  **The Ignorant Tourist:** A visitor from a non-tipping culture eats in NYC and leaves no tip.
      *   *Requirement:* The theory must decide if ignorance excuses the moral breach. If morality is universal, ignorance shouldn't matter. If morality is local, it should.
  2.  **The 3 AM Jaywalker:** A person crosses against a red light on a deserted street with no cars visible.
      *   *Requirement:* The theory must distinguish between *illegality* and *immorality*. If there is no harm and no unfairness, is it still wrong?
  3.  **The Invisible Cut:** A person cuts a line where no one is watching and no one is displaced (e.g., entering a large stadium).
      *   *Requirement:* Does the wrongness lie in the *act* itself or in the *victim's experience*?
  4.  **The Unjust Convention:** A society has a strict convention that certain people must yield the sidewalk to others (e.g., historical racial or gender norms).
      *   *Requirement:* The theory must allow for the *moral necessity of breaking conventions*. If conventions create obligations, how do we know when the obligation is void?
  5.  **The One-Time Visitor:** A traveler knows they will never return to this city. Do they have the same obligation to follow local norms as a resident?
      *   *Requirement:* The theory must handle "free-riding." Is the obligation based on future reciprocity or immediate duty?

  ### III. Necessary Distinctions
  The theory cannot collapse these categories. If it does, it fails to capture our actual moral experience.

  1.  **Etiquette vs. Ethics:** It must distinguish between "socially awkward" and "morally wrongful." If every breach of etiquette is a sin, morality becomes totalitarian. If no breach is a sin, morality becomes irrelevant to social life.
  2.  **Prudence vs. Duty:** It must distinguish between "don't do this because you'll get hurt" (jaywalking into traffic) and "don't do this because it's wrong" (jaywalking when safe).
  3.  **Local Rule vs. Universal Fairness:** It must distinguish between "wrong because it breaks the local code" (driving on the left in the US) and "wrong because it exploits others" (cutting the line).
  4.  **Expectation vs. Entitlement:** It must distinguish between what people *hope* you do (tip) and what they are *owed* (wages).

  ### IV. Classification of Requirements
  Here is the breakdown of what is essential to the project versus what is debatable.

  **Non-Negotiable (The theory fails without these):**
  *   **Logical Consistency:** It cannot say "conventions are binding" and "you should ignore conventions" in the same context without a clear differentiator.
  *   **The "Bad Rule" Escape Hatch:** It must provide a mechanism to override conventional obligation when the convention causes harm or injustice. (Otherwise, you are arguing that segregation was morally binding because it was the convention).
  *   **Agency:** It must treat the actor as capable of choice. If conventions determine all behavior, there is no morality, only sociology.

  **Contested (Choose a side, but acknowledge the cost):**
  *   **Subjective vs. Objective Wrong:** Does the wrongness depend on whether the actor *believes* they are doing wrong (the tourist), or is it wrong regardless of belief?
  *   **Consequentialist vs. Deontological:** Is jaywalking wrong because it *might* cause an accident (outcome), or because it disrespects the social contract (duty)?
  *   **Scope of Obligation:** Does the obligation extend only to those who benefit from the system (residents), or to everyone present (tourists)?

  ### V. The Tensions (The "Interesting Part")
  Your teacher is right; the value of this paper lies in exposing where these requirements clash. You likely cannot satisfy all of them simultaneously. Here are the three main incompatibilities:

  **1. The Universality vs. Locality Tension**
  *   **The Conflict:** Morality is typically understood as universal (murder is wrong everywhere). Conventions are inherently local (tipping is wrong in Japan, expected in the US).
  *   **The Incompatibility:** If you argue conventions *are* moral obligations, you risk making morality relative (which undermines the concept of objective moral truth). If you argue morality is universal, you struggle to explain why a local habit (tipping %) binds a moral agent.
  *   **The Trade-off:** You either save the universality of morality by saying conventions aren't moral (just habits), or you save the binding nature of conventions by accepting moral relativism.

  **2. The "Futility" vs. "Fairness" Tension**
  *   **The Conflict:** We follow lines because it's fair. But on an empty street, following the light feels futile.
  *   **The Incompatibility:** If the theory relies on *harm/consequences* (Consequentialism), the 3 AM jaywalker is innocent (no harm done). If the theory relies on *duty/rules* (Deontology), the jaywalker is guilty (broke the rule).
  *   **The Trade-off:** You cannot easily claim that conventions are moral *because* they prevent harm while also claiming they are binding when they prevent *no* harm. You have to pick: is it about the outcome or the principle?

  **3. The "Implicit Consent" vs. "Coercion" Tension**
  *   **The Conflict:** To say a tourist must tip, you usually argue they "implicitly agreed" to local norms by entering the space.
  *   **The Incompatibility:** If mere presence equals consent, then people are bound by norms they didn't choose (coercion). If presence doesn't equal consent, then visitors have no obligation to follow local rules (chaos).
  *   **The Trade-off:** You must define how much "choice" a person has when entering a social space. If the choice is "tip or be harassed," is that a moral obligation or extortion? A theory that calls it obligation risks justifying coercion; a theory that calls it extortion risks dissolving social order.

  ### Summary of the Spec
  To get an A, your paper shouldn't just answer "Yes, it's moral." It should argue: *"To treat conventions as moral, we must accept [X], but doing so forces us to abandon [Y]. Here is why [X] is worth the cost."*

  Use the tensions above to show you understand the structural limits of ethical theory.
