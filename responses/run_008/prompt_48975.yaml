prompt: |-
  I'm a third-year philosophy student taking an intermediate ethics seminar, and in two weeks I have to run a forty-minute tutorial session on supererogation for a group of eight students who are mostly non-philosophy majors taking the course as an elective. The tricky part is that the session follows directly on one where we covered Kant's distinction between perfect and imperfect duties, so several of them will arrive thinking that "supererogatory" is just a fancy word for what Kant already called an imperfect duty — and one of the eight is a vocal act utilitarian who I know will push back that the whole category is confused: if an act maximizes the good, you're obliged to do it, and if it doesn't, you shouldn't, so where does "beyond duty" even get a grip? I also want the session to do more than cover the standard soldier-jumps-on-the-grenade story, since half of them will have heard some version of that and will file the whole topic under "heroism, obviously fine, next."

  Please act as an experienced teacher of introductory ethics and plan the session for me rather than just explaining the concept yourself — the deliverable is a teaching plan. Start with a few minutes of brainstorming the possible ways to structure it and tell me which one you'd go with and why; then set out the order in which the components have to be introduced and what depends on what. I want the following covered explicitly: which single carrying example should anchor the whole session and what properties it needs (I suspect it has to be a case where doing the act is genuinely optional, genuinely praiseworthy, and omitting it is genuinely blameless — all three at once, and ordinary enough that they can picture themselves in it); the misconceptions the group is predictably going to bring or form — I'm guessing the imperfect-duty conflation, the "anything not forbidden is supererogatory" slide, and the utilitarian's complaint, but tell me if you see others — and the exact point in the sequence where each one should be headed off rather than left to fester until questions; how to handle the utilitarian objection so that it becomes a teaching resource instead of a derailment; one question I can pose at the end that would show me whether they've actually grasped the category rather than just nodded along; and finally what I should openly refuse to get into at this level — my seminar instructor mentioned there's a whole literature on whether consequentialists can accommodate supererogation at all, and on supposedly different flavors of going beyond duty, and I suspect that's a swamp for this audience, but you tell me. Please think carefully about the dependency structure and be concrete about timing across the forty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **User:** Third-year philosophy student (intermediate ethics seminar).
      *   **Task:** Run a 40-minute tutorial session on *supererogation*.
      *   **Audience:** 8 students, mostly non-majors (elective).
      *   **Context:** Follows a session on Kant (perfect vs. imperfect duties).
      *   **Specific Challenges:**
          *   Students might conflate supererogation with Kantian imperfect duties.
          *   One vocal act utilitarian will argue the category is incoherent (maximization = obligation).
          *   Need to avoid the cliché "soldier jumps on grenade" example.
          *   Need a concrete teaching plan, not just an explanation.
      *   **Required Deliverables:**
          *   Brainstorming of structures + selection + justification.
          *   Order of components (dependency structure).
          *   One single carrying example (criteria: optional, praiseworthy, blameless to omit, ordinary).
          *   Identification of misconceptions + timing for addressing them.
          *   Strategy for handling the utilitarian objection (turn into resource).
          *   One assessment question for the end.
          *   Advice on what to exclude (scope creep).
          *   Concrete timing for 40 minutes.

  2.  **Brainstorming Structures:**

      *   *Option A: Historical/Textual.* Go through Urmson (1958), then Kant, then Mill.
          *   *Pros:* Rigorous.
          *   *Cons:* Too dry for non-majors. 40 mins is too short for three texts. Risks getting bogged down in exegesis rather than the concept.
      *   *Option B: Problem-Solution.* Start with the Utilitarian objection (the "problem"), then introduce supererogation as the "solution" to moral demandingness.
          *   *Pros:* Engaging, addresses the vocal student immediately.
          *   *Cons:* Might frame supererogation as merely a patch for utilitarianism rather than a distinct deontic category. Might confuse the Kant connection.
      *   *Option C: Case-Study Driven (The "Anchor").* Start with a concrete scenario, test intuitions, define the concept based on intuitions, then test against theories (Kant/Util).
          *   *Pros:* Best for non-majors. Keeps it grounded. Directly addresses the "grenade" boredom. Allows for active discussion.
          *   *Cons:* Requires a very well-chosen case.
      *   *Selection:* Option C is best. Non-majors need intuition pumping before theory application. It allows the tutor to manage the Kant confusion and Util objection *in media res* rather than lecturing on them.

  3.  **Developing the Carrying Example:**

      *   *Criteria:* Optional, Praiseworthy, Blameless to omit, Ordinary (no grenades).
      *   *Idea 1:* Giving a kidney to a stranger.
          *   *Critique:* A bit extreme/medical. Some might feel it *is* obligatory.
      *   *Idea 2:* Donating a large sum of money (Peter Singer style).
          *   *Critique:* Too close to the "demandingness" objection. Might trigger the Utilitarian immediately.
      *   *Idea 3:* The "Late Night Tutor." Staying late to help a struggling classmate understand material when you have your own work to do.
          *   *Critique:* Good, but maybe too trivial? Is it just friendship duty?
      *   *Idea 4:* The "Organizer." Organizing a charity drive or community event that requires significant personal sacrifice (time, stress) but isn't life-or-death.
          *   *Critique:* Good balance.
      *   *Selection:* **The "Stranded Traveler" Case.** You are at an airport. You have a comfortable layover. You see a family who missed their connection, don't speak the language, and are panicking. Helping them requires you to give up your lounge access, miss your own preferred flight (take a later one), and spend 4 hours navigating bureaucracy.
          *   *Why:* It's high cost (time/comfort), high benefit to them, but not life-or-death (so omitting isn't murder). It's distinct from Kantian imperfect duty (specific vs. general maxim). It's relatable.

  4.  **Addressing Misconceptions & Timing:**

      *   *Misconception 1: Kantian Imperfect Duty.* (e.g., "Isn't this just beneficence?")
          *   *Timing:* Introduce early, after defining supererogation. Distinguish via *optionality*. Imperfect duties allow latitude in *when/how*, but supererogation allows latitude on *whether*.
      *   *Misconception 2: "Anything not forbidden is supererogatory."* (The floor vs. ceiling error).
          *   *Timing:* When defining the deontic categories. Distinguish from merely permissible acts (eating ice cream).
      *   *Misconception 3: Utilitarian Objection.* (e.g., "If it's best, it's required.")
          *   *Timing:* Save for the middle/end as a stress test. Don't let it derail the definition phase.

  5.  **Handling the Utilitarian:**

      *   Don't fight them on utility. Agree on the *consequences*. Fight on the *moral status*.
      *   Strategy: "Bite the bullet" vs. "Common Sense Morality." Ask the group: "Does the Utilitarian view match how we actually blame/praise?" Use the Utilitarian to clarify the *stakes* of the definition.

  6.  **Assessment Question:**

      *   Needs to test the triad: Optional + Good + Blameless to omit.
      *   *Draft:* "Is giving $5 to charity supererogatory?" (Too easy).
      *   *Draft:* "Is saving a drowning child supererogatory?" (No, that's duty).
      *   *Selection:* A borderline case. "You find a wallet with $50 and an ID. Returning it costs you $10 in transit. Is keeping it wrong? Is returning it supererogatory?" (Actually, returning is likely duty).
      *   *Better:* "You are a skilled swimmer. A dog is struggling in a rough lake. Risk to you is moderate (ruined suit, minor exhaustion), not death. Do you jump in?"
      *   *Best:* A modification of the carrying example to test boundaries. "If the family at the airport offered to pay you for your time, does it stop being supererogatory?" (Tests motivation/reward).
      *   *Actually, the prompt asks for a question to check grasp.* Let's go with a classification task. "Here are three acts. Which one is supererogatory and why are the others not?"

  7.  **What to Exclude:**

      *   Meta-ethics of "Can consequentialists accommodate this?" (Too technical).
      *   Saints vs. Heroes distinction (Too nuanced).
      *   Detailed Urmson exegesis.
      *   The "Paradox of Supererogation" (Chisholm) - too advanced.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Timing:* 40 mins is tight. Need 5 min intro, 10 min case, 15 min theory/confusion, 10 min Util/Conclusion.
      *   *Dependencies:* Must define the concept *before* testing it against Kant/Util. Must establish the "triad" (Optional, Good, Blameless) early.
      *   *Tone:* Encouraging but structured. The user is a student teaching peers/near-peers.

  9.  **Refining the Utilitarian Strategy:**

      *   The prompt asks to make it a "teaching resource."
      *   Idea: Use the Utilitarian to define the *boundary*. If the Utilitarian says "Obligatory" and Common Sense says "Optional," the gap *is* the supererogatory space. This highlights the conflict between theories and intuition.

  10. **Refining the Kant Confusion:**

      *   Crucial distinction: Imperfect duty = You must adopt the maxim (help others), but choose when. Supererogation = You don't even need to adopt the maxim in this instance.
      *   Analogy: Imperfect duty is like "You must exercise this month." Supererogation is like "You must exercise this month, but running a marathon is extra." (Wait, that's bad).
      *   Better: Imperfect duty = "Pay your taxes" (Perfect) vs "Be charitable" (Imperfect). You can't never be charitable. But you *can* never jump on a grenade (or give up your flight).
      *   Correction: Kant says you have a duty of beneficence. You cannot *never* help. Supererogation implies you could *never* do this specific type of high-cost act and still be morally in the clear.

  11. **Final Review against Constraints:**

      *   40 minutes? Yes.
      *   8 students? Yes (discussion based).
      *   Non-majors? Yes (avoid jargon).
      *   Address Kant/Util specific issues? Yes.
      *   Single carrying example? Yes (Airport Case).
      *   Assessment question? Yes.
      *   Exclusions? Yes.

  12. **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* I chose the structure? Yes.
      *   *Check:* Is the timing realistic? 40 mins flies. I need to be strict on the "Lecture" portions. Keep them to 5 mins max.
      *   *Check:* Is the example ordinary enough? Airport stress is universal.
      *   *Check:* Did I address the "Anything not forbidden" slide? Yes, need to distinguish *neutral* acts from *supererogatory* acts.

  13. **Final Polish:** Ensure the tone is supportive to a fellow student tutor. Emphasize classroom management (the vocal Utilitarian).

  *(Self-Correction on the Assessment Question)*: The prompt asks for *one question* to pose at the end. It needs to be diagnostic.
  *Question:* "If I offer you $1,000 to do the supererogatory act, does it cease to be supererogatory?"
  *Why:* Tests if they understand it's about *moral requirement*, not just *cost*. If they say "No, it's still supererogatory," they get it. If they say "Now it's a job/obligation," they might be conflating incentive with duty.
  *Actually, a better diagnostic:* "Classify these three: 1. Not punching someone. 2. Buying a coffee. 3. Donating a kidney."
  *Let's go with a scenario tweak:* "If everyone started expecting you to do this act, would it become obligatory?" (Tests the social expectation vs moral status).
  *Decision:* I will suggest a "Boundary Case" question involving the Airport scenario but with a slight tweak to test the "Blameless Omission" criterion.

  *(Self-Correction on Utilitarian)*: Make sure the plan explicitly tells the tutor *what to say* to the Utilitarian student to validate them without conceding the point. "You are right about *your theory*, but we are mapping *common sense morality*."

  Okay, ready to write.s
answer: |-
  Here is a teaching plan designed for a 40-minute tutorial. It is structured to manage the specific conceptual pitfalls you identified while keeping non-majors engaged.

  ### Part 1: Structural Brainstorming & Selection

  There are three obvious ways to structure this session:

  1.  **The Historical Exegesis:** Start with Urmson's 1958 paper "Saints and Heroes," define the term, then apply it.
      *   *Verdict:* **Reject.** Too dry for non-majors. It privileges text over intuition, which makes it hard to diagnose *why* they are confused.
  2.  **The Theory-First Approach:** Start by contrasting Kant and Utilitarianism, then introduce supererogation as the middle ground.
      *   *Verdict:* **Reject.** This invites the Kant/Util debate immediately, before the students understand what supererogation *is*. The vocal Utilitarian will dominate the first 15 minutes, and you'll run out of time to define the concept.
  3.  **The Intuition-First Case Study:** Start with a concrete scenario, elicit judgments, derive the definition from those judgments, and *then* test it against the theories (Kant/Util).
      *   *Verdict:* **SELECT.** This is the most robust method for a mixed-ability group. It grounds the abstract concept in shared intuition. It allows you to isolate the Utilitarian objection as a "stress test" at the end, rather than letting it derail the definition phase. It also allows you to distinguish the Kantian confusion by comparing the specific case against general duties.

  **Why this structure?** It creates a dependency chain where students must agree on *what* the phenomenon is before they argue about *which theory* explains it. This gives you leverage to manage the vocal Utilitarian ("Let's first agree on what we are describing, then we can argue about whether it exists").

  ---

  ### Part 2: The Carrying Example

  You need a single scenario to return to throughout the 40 minutes. Do not use multiple examples; it fragments attention.

  **The Anchor Case: "The Airport Layover"**
  > *You are at a major airport. You have a 6-hour layover. You have booked a quiet lounge pass ($50 value) so you can sleep and work on your own assignment. While waiting in line for security, you notice a family of four who clearly do not speak the language. They are panicking; they have missed their connection, their tickets are confused, and they are about to be stranded overnight. No airline staff are nearby. You speak the language. If you help them, you will miss your lounge access, you will have to work in the noisy terminal, and you might miss your preferred flight home, arriving 4 hours later. If you do not help, they will eventually be sorted out by staff, but they will have a night of high stress and discomfort. You walk past them to the lounge.*

  **Why this example works:**
  1.  **Ordinary:** No grenades, no kidneys. Every student has been stressed at an airport.
  2.  **High Cost, High Benefit:** It's not trivial (like giving up a seat), but not life-or-death (which triggers "duty to rescue").
  3.  **The Triad:**
      *   *Optional:* Most will agree you aren't *required* to ruin your layover.
      *   *Praiseworthy:* If you *did* stay and help, you'd be a good person.
      *   *Blameless Omission:* If you walk away, you aren't a villain (unlike letting a child drown).

  ---

  ### Part 3: Session Plan & Timing (40 Minutes)

  #### 0:00–0:05 | Introduction & The "Deontic Square"
  *   **Goal:** Define the logical space without jargon.
  *   **Activity:** Draw a square on the board. Label the top "Good to Do," bottom "Bad to Do," left "Required," right "Optional."
  *   **Instruction:** "We usually think acts are either Obligatory (Required) or Forbidden (Bad). But there's a gap. Today we are mapping that gap."
  *   **Pre-empting Misconception (The "Anything Goes" Slide):** Explicitly state: "Not every optional act is supererogatory. Eating a sandwich is optional, but no one calls you a saint for it. Supererogation is a specific subset of optional acts."
  *   **Dependency:** You must establish that *Optional* $\neq$ *Supererogatory* before introducing the case.

  #### 0:05–0:15 | The Airport Case (Intuition Pumping)
  *   **Goal:** Secure consensus on the three criteria using the Anchor Case.
  *   **Activity:** Read the "Airport Layover" scenario. Ask three specific questions to the group (cold call the quiet students, let the vocal Utilitarian wait):
      1.  "If I walk to the lounge, am I morally blameworthy?" (Target answer: No.)
      2.  "If I stay and help them for 4 hours, am I praiseworthy?" (Target answer: Yes.)
      3.  "Am I *required* to stay?" (Target answer: No.)
  *   **Definition:** Write on board: **Supererogatory = Optional + Praiseworthy + Blameless to Omit.**
  *   **Pre-empting Misconception (Kantian Conflation):** A student will likely say, "Isn't this just Kant's imperfect duty of beneficence?"
      *   *Intervention Point:* Address this **immediately** after the definition.
      *   *Script:* "Great connection. Here is the distinction: An imperfect duty (like beneficence) means you must adopt the *maxim* of helping generally—you can't *never* help anyone. Supererogation suggests that even if you have helped generally, *this specific act* is beyond the call. Imperfect duty sets a floor you must meet over time; supererogation is a ceiling you can choose to break through."

  #### 0:15–0:25 | The Utilitarian Challenge (The Stress Test)
  *   **Goal:** Turn the vocal Utilitarian's objection into a tool for understanding the stakes.
  *   **Activity:** Turn to the Utilitarian student. "I know you have a theoretical objection to this category. What is it?"
  *   **Expected Objection:** "If helping them produces more utility than the lounge, you are obliged to do it. If it doesn't, you shouldn't. 'Beyond duty' is incoherent."
  *   **Strategy:** Do not argue that the Utilitarian is *wrong*. Argue that they are describing a different *system*.
  *   **Script:** "You are right that *within Act Utilitarianism*, this category collapses. For a Utilitarian, 'Optimal' = 'Obligatory.' But for everyone else in this room (Common Sense Morality), there is a gap between 'Best' and 'Required.' Supererogation is the name for that gap."
  *   **Teaching Resource:** Use this to show that supererogation is a problem *for* Utilitarianism (the "Demandingness Objection"). It highlights that Utilitarianism might be too demanding for human psychology.
  *   **Dependency:** This only works if the group already agrees on the intuition (0:05–0:15). If they haven't agreed the act is optional, the Utilitarian wins by default.

  #### 0:25–0:35 | Boundary Testing (Refining the Concept)
  *   **Goal:** Ensure they aren't just nodding along. Test the limits of the definition.
  *   **Activity:** Propose two variations of the Airport Case.
      1.  *Variation A:* "What if the family offers to pay you $500 for your help?" (Does the reward cancel the supererogatory status? Usually no, but it complicates motivation.)
      2.  *Variation B:* "What if you are the only person in the entire terminal who speaks the language?" (Does uniqueness create obligation? This pushes toward "Duty to Rescue.")
  *   **Pre-empting Misconception (Contextual Duty):** Use Variation B to show that supererogation is context-sensitive. If the cost is low and you are unique, it slides into Duty. If the cost is high and others could help, it stays Supererogatory.

  #### 0:35–0:40 | Assessment & Wrap Up
  *   **Goal:** Diagnostic check.
  *   **Activity:** Pose the **Diagnostic Question** (see below).
  *   **Wrap Up:** Summarize that supererogation protects a space for moral freedom that isn't just selfishness.

  ---

  ### Part 4: Handling the Specific Challenges

  #### 1. The Kantian Conflation (Imperfect Duty)
  *   **Where it happens:** Minute 15.
  *   **The Fix:** Use the "Latitude" distinction.
      *   **Kant (Imperfect Duty):** You have a duty to help. You have latitude on *when* and *who*, but you cannot universally will a maxim of *never* helping.
      *   **Supererogation:** You can universally will a maxim of *not doing this specific high-cost act* without moral failure.
      *   **Analogy:** Imperfect duty is like "You must exercise this month." Supererogation is like "You must exercise, but running a marathon is extra credit."

  #### 2. The Vocal Act Utilitarian
  *   **Where it happens:** Minute 20.
  *   **The Fix:** Validate the theory, isolate the intuition.
      *   Say: "You are correctly applying Act Utilitarianism. In your framework, 'supererogation' is indeed a bug. But for the rest of the class, it's a feature. We are studying the concept as it functions in Common Sense Morality, which most ethical theories (except strict Utilitarianism) try to accommodate. Your job today is to help us see why your theory *excludes* this category, which helps us define the category by its absence."
      *   This makes them feel heard but assigns them the role of "contrarian theorist" rather than "session blocker."

  #### 3. The "Anything Not Forbidden" Slide
  *   **Where it happens:** Minute 5.
  *   **The Fix:** Distinguish *Neutral* vs. *Good*.
      *   Scratching your nose is optional and blameless to omit, but not praiseworthy.
      *   Supererogation requires **positive moral value**. It is "moral excellence," not just "moral permission."

  ---

  ### Part 5: The Diagnostic Question

  Do not ask "Do you understand?" Ask a question that forces them to apply the triad (Optional, Praiseworthy, Blameless).

  **The Question:**
  > "Imagine a firefighter who runs into a burning building to save a cat.
  > 1. If it is part of their paid shift, is it supererogatory?
  > 2. If they are off-duty, but the risk is low (smoke is light), is it supererogatory?
  > 3. If they are off-duty, and the risk is death, is it supererogatory?
  > **Which of these three scenarios best fits the definition we built, and which one slides into 'Duty' or 'Neutral'?"**

  **What to listen for:**
  *   They should identify that **Scenario 1** is likely *Duty* (contractual/professional obligation).
  *   **Scenario 2** might be *Supererogatory* (good to do, blameless to omit).
  *   **Scenario 3** is the tricky one: Some argue risking death is always supererogatory; others argue if you are trained, it's duty.
  *   **Success Criteria:** If they argue about *why* the status changes (based on cost, role, or expectation) rather than just guessing, they grasp the concept. If they say "Saving a cat is always silly," they missed the point.

  ---

  ### Part 6: What to Exclude (Scope Creep)

  Your seminar instructor is right; this is a swamp. For a 40-minute tutorial with non-majors, explicitly **refuse** to cover:

  1.  **The "Paradox of Supererogation" (Chisholm):** The logical problem of how an act can be best but not required. This is meta-ethical logic chopping.
      *   *Say:* "There is a logical puzzle about whether 'best' implies 'required,' but we are looking at the moral experience of the act, not the logical syntax."
  2.  **Consequentialist Accommodations:** Whether a Utilitarian can "buy back" supererogation by adding rules (e.g., Rule Utilitarianism).
      *   *Say:* "We are treating Act Utilitarianism as the foil today. How other consequentialists tweak their theory to fit this is a topic for a seminar on Consequentialism, not Ethics 101."
  3.  **Saints vs. Heroes:** The distinction between long-term saintliness (Mother Teresa) vs. one-off heroic acts (Grenade).
      *   *Say:* "We are treating these as the same logical category for today: acts beyond duty."

  ### Final Advice for the Tutor
  You are not there to solve the debate between Kant, Utilitarianism, and Common Sense Morality. You are there to ensure they can **identify** the category. If the Utilitarian leaves thinking "The category is incoherent," but the other seven leave thinking "I know what people mean when they use the word," you have succeeded. Keep the Airport Case visible on the board the whole time. When the discussion drifts, point to the case.
