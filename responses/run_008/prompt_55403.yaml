          2.  Challenge the "Verbal" diagnosis (Sider's objection, Truthmaking).
          3.  Challenge the A/B vs. Present/Eternal conflation (Moving Spotlight).
          4.  Address the "Progress" question (Physics, Metaphysical Cost-Benefit).
          5.  Conclusion on the "Split Vocabulary" idea.

      *   *Key Points to Hit:*
          *   The quantifier *is* the metaphysics (Sider).
          *   Truthmaking is the real bottleneck, not just quantification.
