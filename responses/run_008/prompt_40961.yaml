      *   *Distinction:* The union stands against force; the party stands for power.
      *   *The Core Argument:* A picket line is a physical barrier against oppression, not a mental cage. When the union tells the worker what to think, rather than how to stand together against the blow, it ceases to be a shield and becomes another weight.
      *   *Imagery:* Gravity, chains, light, attention.
      *   *Conclusion:* The docker does not face Renault alone if he stands with others in truth, but he must face God alone in thought.

      *Refining for the Prompt's Constraints:* The prompt says "no collective of any kind may legitimately hold authority over thought." I must uphold this. The unionist argues the union *decided for him*. I must say that is where the union becomes culpable. The solidarity is necessary for bodily survival, but not for intellectual submission.

      *Drafting:*
      You speak of the factory floor, and the memory of that noise still vibrates in my bones, the way the time-clock cuts the soul into fragments smaller than seconds. It is true that the isolated body breaks under the weight of force, and that the shoulder of the neighbour is the only shield against the employer's whip; I do not deny the necessity of the strike, nor the courage of the picket line standing against the police. But you confuse the pressure of bodies against bodies with the pressure of a doctrine against the mind. When the union demands that the worker march, it organizes force against force, which is sometimes the only language oppression understands; but when it demands that he believe, it becomes the very machine we sought to escape. The docker need not face Renault alone to remain free, but he must face the truth alone, even while standing shoulder to shoulder with his brothers. If the picket line becomes a place where thought is surrendered for the sake of solidarity, then it has already lost the very thing it was built to defend, for a man who cannot think is already a slave, whether he wears a badge or a uniform.

      *Check against constraints:*
      *   Single paragraph? Yes.
      *   In character (Weil)? Yes (bones, soul, force, truth, slave).
      *   Fixed positions upheld? Yes (collective cannot hold authority over thought).
      *   Concessions made? Yes (necessity of strike, shield against whip).
      *   No party innocence? Yes (implicit).

      *Refining tone:* Make it more austere, more "gravity." Less explanatory, more declarative.

      *Revised Draft:*
      I know the weight of the machine, how it grinds the flesh until the spirit feels like a ghost haunting its own exhaustion, and I do not deny that the solitary body is easily broken by the organized force of capital. There is a legitimacy in men standing together to stop the flow of goods, to place their physical mass against the pressure that would crush them, for this is a matter of necessity, not opinion. But you speak of the committee that decided for him, the discipline that demanded he surrender his judgment; there lies the poison. A union may organize the arms, but it must not organize the mind, for the moment it claims authority over thought, it ceases to be a shield and becomes another master. The docker stands with his brothers against the employer's violence, yes, but he must stand alone before the truth, otherwise the victory he wins will only build a new prison around his soul. Solidarity is a burden we share to survive the world, but thought is a solitude where we meet God, and no collective has the right to insert itself between the creature and the truth.

      *Check:* Single paragraph. Austere. Addresses the unionist's point about the picket line. Distinguishes physical solidarity from intellectual authority.

