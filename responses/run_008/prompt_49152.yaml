answer: |-
  Your hypothesis is correct: the debate is stalled because "explanation" performs double duty, masking a fundamental divergence between explaining event types via subsumption and explaining particular sequences via configuration. Hempel's covering-law model treats historical explanation as structurally identical to natural science, where an event is explained only if its occurrence could have been predicted based on initial conditions and universal generalizations; when historians fail to cite laws, Hempel argues these are merely "elliptical" or implicit, preserving the requirement that reality is ultimately law-governed. Conversely, narrativists like Dray and Mink argue that this model misses the specific cognitive achievement of history, which is not to predict recurrences but to render unique sequences intelligible by configuring agents' reasons, contingencies, and outcomes into a coherent whole. For Dray, explaining an action involves showing it was rational given the agent's beliefs and goals, not subsuming it under a psychological law, while Mink contends that narrative is a distinct cognitive instrument that grasps the "togetherness" of events in a way analytic law-statements cannot. Consequently, the Hempelian seeks objective validation through generalizability, whereas the narrativist seeks contextual understanding through specificity, meaning they are not offering rival answers to the same question but satisfying different intellectual needs under a shared label.

  Progress will not come from empirical settlement, as the existence of "implicit laws" is unfalsifiable; Hempelians can always posit deeper regularities beneath any contingency, while narrativists can always point to the irreducibility of specific contexts. Instead, progress requires a conceptual distinction that legitimizes both modes without reducing one to the other, such as distinguishing between *generalizing explanation* (identifying causal mechanisms and regularities) and *configurational understanding* (grasping the significance of a specific sequence). A concrete case where the models yield rival verdicts is difficult to isolate because Hempelians treat narrative sketches as proto-scientific, but the outbreak of World War I serves as a test: a covering-law approach might cite laws about alliance systems and mobilization thresholds to explain why a major war occurred, while a narrative approach explains why *this* war took this specific shape through the contingent interplay of specific diplomatic notes and individual decisions. Ultimately, the field advances only by abandoning the monopoly of the term "explanation" and acknowledging that history employs multiple epistemic tools, some aimed at causal leverage and others at hermeneutic clarity.
