prompt: |-
  My cousin is doing a molecular biology degree, and whenever genetics comes up at family dinners she insists that "DNA is a code" is a plain fact, not a metaphor, and that anyone calling it a metaphor is basically scientifically illiterate. Meanwhile my housemate, who watches a lot of intelligent design youtube, deploys the exact same sentence to argue that codes are the kind of thing minds create, so DNA must have had a creator -- he got pretty smug when I couldn't articulate what's wrong with that last step. And my old bio teacher would only ever say "the genetic code", lowercase, as if that settles that it's a code in whatever sense my housemate means. I have a growing suspicion that three or four different claims are being run together under one sentence and nobody at that table noticed, including me.

  Can you lay out the different precise things "DNA is a code" could actually be claiming? I'd want the menu from weakest to strongest: the boring technical sense (the codon-to-amino-acid mapping that biologists literally call the genetic code, which seems about as metaphorical as calling something "the periodic table"), some middle sense where DNA carries Shannon information or functions as a signalling system, and then whatever strong sense my housemate needs where it's a code in the way a cryptographer or a programmer would recognize one, written by someone. For each reading, say whether it's true, whether it's trivial or substantive, and -- crucially -- whether it supports the use the person was putting it to: my cousin's "it's not a metaphor, checkmate" point, and my housemate's inference to a coder. Also curious whether the rival metaphors people use, blueprint vs recipe vs program, are sneakily encoding different claims about how deterministic or how context-dependent gene expression is. Lay it out as a list I can bring to the next dinner, cause I'd like to at least keep up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Family dinners involving a molecular biology cousin (insists "DNA is a code" is literal fact, not metaphor), a housemate (Intelligent Design proponent, uses "DNA is a code" to argue for a designer), and an old bio teacher (uses "the genetic code" casually).
      *   **Problem:** The user suspects equivocation (multiple meanings conflated under one phrase). They want to distinguish these meanings to participate in the conversation.
      *   **Requirements:**
          *   List different precise claims "DNA is a code" could make.
          *   Order: Weakest (technical) to Strongest (semantic/intentional).
          *   For each: Is it true? Is it trivial or substantive? Does it support the cousin's claim (not a metaphor)? Does it support the housemate's claim (implies a designer)?
          *   Address rival metaphors (blueprint vs. recipe vs. program) regarding determinism/context-dependence.
          *   Tone: Clear, analytical, suitable for a dinner conversation (accessible but precise).

  2.  **Deconstruct "DNA is a Code":**
      *   *Sense 1: The Chemical Mapping (The "Genetic Code").* This is the specific mapping of triplets (codons) to amino acids. It's arbitrary but fixed. Biologists call this "the genetic code."
      *   *Sense 2: Information Theory (Shannon Information).* DNA stores data. It has complexity, specificity, and transmission fidelity. It reduces uncertainty.
      *   *Sense 3: Semantic Information (Biosemiotics).* DNA *means* something to the cell. It has function and reference, not just correlation.
      *   *Sense 4: Intentional/Designed Code.* A code implies a coder (the ID argument). This requires semantic information + intentionality.

  3.  **Evaluate Each Sense against the Criteria:**
      *   *Cousin's Claim:* "It's not a metaphor." (Needs literalism).
      *   *Housemate's Claim:* "Codes require minds." (Needs intentionality).
      *   *Truth/Triviality:* Is it scientifically accurate? Is it deep or just definition?

  4.  **Drafting the Menu (Iterative Process):**

      *   *Item 1: The Cipher/Mapping (Weakest).*
          *   Definition: Codon table (AUG -> Methionine).
          *   Truth: True.
          *   Metaphor?: No, it's a defined mapping.
          *   Cousin: Supports her (it's a literal table).
          *   Housemate: Weak support. A cipher doesn't *need* a mind (e.g., crystal structures can have patterns), but arbitrary mappings suggest convention.
          *   Triviality: Trivial/Technical.

      *   *Item 2: Shannon Information (Middle).*
          *   Definition: Sequence specificity, capacity to store bits, transmission.
          *   Truth: True.
          *   Metaphor?: No, mathematically definable.
          *   Cousin: Supports her (it's measurable).
          *   Housemate: Weak support. Crystals have Shannon info too. Doesn't imply meaning, just complexity.
          *   Triviality: Substantive but physical.

      *   *Item 3: Semantic/Functional Information (Stronger).*
          *   Definition: The sequence *causes* a specific outcome via a decoding mechanism (ribosome). It has "aboutness."
          *   Truth: Debated in philosophy of biology, but functionally true.
          *   Metaphor?: Here's the rub. Is "function" metaphorical? No, but "meaning" is tricky.
          *   Cousin: She likes this, but might not distinguish it from #1.
          *   Housemate: This is his battleground. He claims semantics require mind.
          *   Triviality: Substantive.

      *   *Item 4: Intentional/Designed Code (Strongest).*
          *   Definition: The system was *intended* to convey a message.
          *   Truth: Scientifically unproven/ID claim.
          *   Metaphor?: N/A (It's a theological/philosophical claim).
          *   Cousin: Would reject this.
          *   Housemate: This is his conclusion.
          *   Triviality: Non-scientific claim.

  5.  **Addressing the Metaphors (Blueprint vs. Recipe vs. Program):**
      *   *Blueprint:* Deterministic, structural, static. (Old view, mostly wrong).
      *   *Recipe:* Context-dependent, procedural, interactive. (Better, accounts for environment).
      *   *Program:* Algorithmic, conditional logic (if/then). (Good for regulation, but implies a computer).
      *   *Relevance:* Shows gene expression isn't just "read," it's "interpreted" based on context.

  6.  **Refining the Argument for the User:**
      *   Need to explicitly point out the *Equivocation Fallacy*. The cousin uses Sense 1 to prove it's literal. The housemate uses Sense 4 to prove a designer. They slide between them.
      *   Need to clarify the "Metaphor" dispute. In science, models are often "literal" in function but "metaphorical" in origin.
      *   Need to address the "Coder" inference. Does information *always* imply a mind? (Natural codes exist? Or is "code" defined by mind?)

  7.  **Final Review against Constraints:**
      *   List format? Yes.
      *   Weakest to strongest? Yes.
      *   True/Trivial/Substantive? Yes.
      *   Cousin/Housemate support? Yes.
      *   Blueprint/Recipe/Program section? Yes.
      *   Tone: Helpful, analytical, dinner-party ready.

  8.  **Self-Correction/Nuance Check:**
      *   *Correction:* Be careful not to dismiss the cousin. She is technically right that "The Genetic Code" is a standard term. But she's wrong that it settles the *nature* of information.
      *   *Correction:* Be careful not to validate the housemate. The inference from "code" to "mind" is the philosophical leap, not the scientific one.
