answer: |-
  You are absolutely right. What you are witnessing is a classic case of **equivocation**: everyone is using the word "code," but they are sliding between four distinct definitions without noticing. Your cousin is defending a technical definition to win a semantic point, while your housemate is smuggling in a philosophical definition to win a theological point.

  Here is the menu of claims, ordered from the boringly technical (weakest) to the philosophically loaded (strongest). You can bring this list to the table to disentangle the conversation.

  ### The Menu: Four Meanings of "DNA is a Code"

  #### 1. The Cipher Claim (The "Genetic Code")
  *   **The Claim:** There is a specific, rule-based mapping between triplets of nucleotides (codons) and amino acids (e.g., AUG = Methionine).
  *   **Is it True?** Yes. This is an empirical fact of biochemistry.
  *   **Trivial or Substantive?** Trivial/Technical. It is a definition, like saying "traffic lights use a code where red means stop."
  *   **Does it support your Cousin?** **Yes.** She is right that this isn't a metaphor. Biologists literally call this "The Genetic Code." It is a fixed mapping table.
  *   **Does it support your Housemate?** **No.** A cipher does not require a mind. Snowflakes have structured patterns; crystals have repeating units. An arbitrary mapping can arise through evolutionary "frozen accidents" without a designer intending them.
  *   **The Catch:** Your cousin uses this definition to prove it's "literal," but this definition says nothing about *information*, only about *translation*.

  #### 2. The Shannon Information Claim (The "Data" Sense)
  *   **The Claim:** DNA sequences have high specificity and complexity. They reduce uncertainty. You can measure them in bits. If you change the sequence, the output changes.
  *   **Is it True?** Yes. DNA fits the mathematical definition of information transmission (Sender → Channel → Receiver).
  *   **Trivial or Substantive?** Substantive, but physical.
  *   **Does it support your Cousin?** **Yes.** It treats DNA as a physical medium carrying distinguishable states.
  *   **Does it support your Housemate?** **No.** Shannon information does not require meaning or a mind. A radioactive decaying atom emits "information" about its state; a storm front carries "data" about pressure. High complexity does not prove intelligence (e.g., a mountain range is complex but not designed).
  *   **The Catch:** This defines "code" as "complex pattern," which strips out the requirement for a "coder."

  #### 3. The Semantic Information Claim (The "Meaning" Sense)
  *   **The Claim:** DNA doesn't just correlate with proteins; it *refers* to them within the context of the cell. The cell "interprets" the DNA. The sequence has *function* and *aboutness* (biosemiotics).
  *   **Is it True?** Functionally, yes. Philosophically, debated.
  *   **Trivial or Substantive?** Highly Substantive. This is where biology meets philosophy.
  *   **Does it support your Cousin?** **Sort of.** She wants to say it's literal, but "meaning" is inherently a relational concept, which edges back toward metaphor.
  *   **Does it support your Housemate?** **Maybe.** This is his battleground. He argues that "semantics" (meaning) only exist in minds. However, evolutionary biology argues that "function" can arise through natural selection (things that worked survived) without a prior mind intending the meaning.
  *   **The Catch:** This is the bridge your housemate is trying to cross. He assumes "meaning" implies "mind." Biologists say "meaning" implies "function selected by survival."

  #### 4. The Intentional Code Claim (The "Designer" Sense)
  *   **The Claim:** The system was *intended* to convey a message by an agent. The code exists *for* a purpose conceived prior to the code's existence.
  *   **Is it True?** This is a theological/philosophical claim, not a scientific one. Science cannot measure "intent."
  *   **Trivial or Substantive?** Non-scientific.
  *   **Does it support your Cousin?** **No.** She is a scientist; she relies on natural mechanisms, not intent.
  *   **Does it support your Housemate?** **Yes.** This is his conclusion. But notice: He cannot get here using definitions 1 or 2. He has to sneak Definition 4 in by using the word "code" from Definitions 1 and 2.
  *   **The Catch:** This is the **Equivocation Fallacy**. He is using the scientific credibility of Definition 1 to validate the philosophical conclusion of Definition 4.

  ---

  ### The Rival Metaphors: Blueprint vs. Recipe vs. Program

  You also asked about the other metaphors. These aren't just poetic flourishes; they encode different claims about **determinism** and **context**.

  | Metaphor | Claim about Biology | Determinism | Context Dependence | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Blueprint** | DNA contains a 1:1 structural map of the organism. | **High.** The plan dictates the building. | **Low.** A blueprint is the same regardless of where you build. | **Mostly False.** Genes don't map to body parts like lines on a map. |
  | **Recipe** | DNA contains instructions for a process that interacts with ingredients. | **Medium.** The cake depends on the oven temp and altitude. | **High.** Same DNA + different environment = different outcome (phenotype). | **Accurate.** Captures gene-environment interaction (epigenetics). |
  | **Program** | DNA is an algorithm with conditional logic (IF/THEN). | **Variable.** Code runs differently based on user input. | **High.** Gene regulation networks act like logic gates. | **Useful.** Good for describing regulation, but implies a "computer" (the cell). |

  **The Dinner Point:** If your cousin says "Blueprint," she is being scientifically outdated. If she says "Recipe" or "Program," she acknowledges that the "code" doesn't build the organism alone; the cellular context "reads" it differently depending on conditions. This weakens the idea of DNA as a static, independent "message."

  ---

  ### The "Coder" Inference: Where the Housemate Goes Wrong

  Your housemate's argument is a syllogism that looks like this:
  1.  Codes are things created by minds.
  2.  DNA is a code.
  3.  Therefore, DNA was created by a mind.

  **The Flaw:** Premise 1 is only true for **Definition 4 (Intentional Code)**. Premise 2 is only provably true for **Definition 1 (Cipher)** and **Definition 2 (Shannon Information)**.
  *   If you use Definition 1 (Cipher), Premise 1 is false (nature has ciphers).
  *   If you use Definition 4 (Intentional), Premise 2 is unproven (that's the thing you're trying to prove).

  He is borrowing the scientific certainty of Definition 1 to validate the philosophical assumption of Definition 4.

  ---

  ### The Dinner Cheat Sheet

  If you want to keep up without starting a war, here are three moves:

  1.  **To your Cousin:** "You're right that *The Genetic Code* (the codon table) is literal, not metaphorical. But does that mean DNA carries *semantic meaning* like a language, or just *chemical specificity* like a key in a lock? Because a key fits a lock without anyone 'reading' it."
  2.  **To your Housemate:** "I agree DNA fits the definition of a cipher (Codon Table) and data storage (Shannon Information). But does 'information' in the physics sense require a mind? A tree ring holds information about the year's weather, but the weather didn't 'write' it with intent. At what point does 'data' become 'message'?"
  3.  **The Clincher:** "We are conflating **mechanism** with **origin**. We can agree DNA *functions* like a code (mechanism) without agreeing on whether it was *authored* like a code (origin). My cousin is talking about mechanism; you are talking about origin. You're both using the same word for different questions."

  **Summary:** Your cousin is right that it's not a *metaphor* in the technical sense (it's a mechanism). Your housemate is right that it *looks* like a code in the semantic sense. But neither proves the other's point. They are talking past each other.
