answer: |-
  ### 1. The Correspondences

  | IRL / Econ Concept | Human Value Learning Analogue |
  | :--- | :--- |
  | Expert Demonstrator | The Human |
  | Trajectory | Life History / Behavior Stream |
  | Reward Function | Human Values / Preferences |
  | Policy | Action Selection Mechanism |
  | Optimality Assumption | Rationality / Coherence |

  Right off the bat, the 'Expert Demonstrator' label is doing way too much heavy lifting. In standard IRL, the expert is assumed to be acting competently to achieve a goal. Mapping 'Human' to 'Expert' implicitly assumes we're good at getting what we want. But if humans are buggy optimizers, treating us as experts forces the algorithm to interpret our bugs as features. The 'Reward Function' to 'Values' map also glosses over whether humans even *have* a single reward function to recover, or if we're just a bag of competing heuristics. If the target doesn't exist, the inversion fails.

  ### 2. Where It Snaps

  The biggest threat isn't habit or addiction; it's the optimality assumption. IRL mathematically requires assuming the demonstrator is roughly rational. If you feed a standard IRL algorithm data from an agent that systematically acts against its own interests (akrasia), the algorithm doesn't say 'this human is flawed,' it says 'this human must value failure.' That's not a minor error; it inverts the truth. If you skip the gym because you're tired, a strict revealed preference model infers you *preferred* skipping the gym over being healthy. It treats constraints and errors as preferences. This makes the 'just watch' approach actively dangerous for alignment, because it codifies our weaknesses as our goals.

  Next is underdetermination. Any behavior stream is consistent with infinite reward functions. You stay home because you value safety, or because you fear judgment, or because you're depressed. Behavior alone can't distinguish these. Economists dodge this by assuming stable preferences over time, but humans change minds. Without stated preferences to prune the hypothesis space, you're just fitting noise. The 'multiple agents' problem is also fatal. Revealed preference assumes a unitary actor. Humans are often a conflict between System 1 and System 2, or present-self vs future-self. Watching behavior tells you who won the tug-of-war, not what either side actually wanted. If your addiction beats your resolution, the 'revealed preference' is the addiction, but almost nobody identifies their addiction as their true value.

  There's also a category error between economics and IRL. Economists use revealed preference as a definitional trick: if you chose it, you preferred it, by definition. It's unfalsifiable. IRL tries to be empirical: it wants to find the *latent* reward that caused the behavior. These are incompatible. The LessWrong move tries to use the empirical promise of IRL while hiding behind the unfalsifiable shield of economics. They want to say 'we found your real reward' (empirical) but retreat to 'you revealed you wanted this' (definitional) when challenged.

  This directly threatens the 'stated preferences are noise' conclusion. If the model assumes optimality, stated preferences aren't noise; they're the only ground truth we have for counterfactuals. Behavior tells you what happened in the current environment. Self-reports tell you what you *would* do if you weren't tired, scared, or addicted. Ignoring them throws away the error-correction mechanism. If you treat self-reports as noise, you lose the ability to distinguish between 'I couldn't' and 'I didn't want to.' Consider the training distribution too. Human behavior is generated in a specific cultural context. IRL generalizes poorly off-distribution. If you infer values solely from 2024 behavior, you might infer humans value fossil fuels because we use them. Stated preferences often contain the abstraction needed to generalize. Without that linguistic channel, the inferred reward function is overfit to the current state of the world.

  ### 3. Does the Conclusion Survive

  So, does 'stated preferences are noise' survive? No. The analogy breaks hard enough that the conclusion flips. If humans aren't expert optimizers, then behavior is a corrupted signal of values, and self-reports are the debug logs. They're noisy too, sure—people lie to themselves—but they're the only access we have to the 'intended code' rather than the 'executed binary.' The strongest position isn't 'watch don't ask,' it's 'watch to see constraints, ask to see objectives.' You need both to disentangle capability from intent. Treating self-reports as purely noise throws away the only data source that handles counterfactuals and internal conflict.

  It supports a weaker claim: behavior is the primary evidence for *revealed* constraints, but self-reports are essential for *latent* goals. Especially off-distribution. If you want an AI to help me exercise, it needs to know I value health (stated) despite valuing couch-time (behavioral). Ignoring the statement locks the AI into enabling my akrasia.

  ### 4. A Better Analogy, If Any

  A better analogy? Debugging a legacy codebase written by a committee of drunk programmers. The code runs (behavior), but it's full of spaghetti logic, deprecated functions, and conflicting patches. You can't infer the 'goal' of the software just by tracing execution paths because half the code is technical debt or workarounds for bugs. You need the comments (self-reports) and the commit messages to understand what the programmers were *trying* to build, even if the current output is messy. It captures the bounded rationality and internal conflict without pretending the system is optimizing anything coherent.
