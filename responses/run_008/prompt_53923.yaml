      *   *Check:* Did I distinguish Margalit and Rieff correctly? Margalit = Ethics of Memory (Duty to remember within community). Rieff = Against Memory (Memory fuels conflict).
      *   *Refinement on Case 1:* If the town is fictional, why does naming the foreman matter? Because the *community* knows who it is. The "fictional" veil is thin. I will treat it as ethically equivalent to non-fiction for the purpose of the procedure.
      *   *Refinement on Case 3:* The relative cried. This is a huge red flag in oral history ethics. The procedure *must* catch this. If the procedure says "Keep it," that's dangerous. If it says "Cut it," that might be the "Hate" answer for a novelist who values "truth." Let's go with "Cut it." It challenges the writer's desire to expose hidden ugliness.

  8.  **Final Polish:** Ensure the "Vanity/Cowardice" check is robust. This is crucial for the user's self-reflection.

