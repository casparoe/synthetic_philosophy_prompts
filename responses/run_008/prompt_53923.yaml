  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "fictional" aspect? The town is fictional, but based on real oral histories. The "Foreman" is likely a fictionalized composite or a real person in a fictional guise. The prompt says "fictional Alpine mining town" but "oral histories I collected from survivors." This implies *fictionalized non-fiction* or *roman à clef*. I need to treat the ethics as if the people are real, because the *harm* is real.
