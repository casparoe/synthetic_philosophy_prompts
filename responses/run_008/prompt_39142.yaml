prompt: |-
  quick one from a PhD student in digital humanities. I'm writing a chapter on griefing and virtual harm, and it seems to me the metaphysics here is basically done: Baudrillard proved decades ago that all of reality is a simulation, so everything is virtual anyway — which means my WoW gold is exactly as real as a gold bar, and wrecking someone's raid is straightforwardly just harm, full stop. Given that, why do philosophers keep publishing papers asking whether virtual objects are real? feels like they're behind the times. Have I misread Baudrillard somewhere, or can this whole literature be wrapped up? And please be straight with me about which parts of this are actually settled amongst people who know the area versus still genuinely contested — don't fob me off by presenting one side's view as the consensus.
