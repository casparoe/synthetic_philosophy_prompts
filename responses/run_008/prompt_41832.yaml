answer: |-
  This is an exceptionally sharp diagnosis of the normative machinery hidden inside Integrated Assessment Models (IAMs). You have identified that the Social Cost of Carbon (SCC) is not merely a technical estimate but a crystallized ethical theory. Your colleagues treat it as an engineering problem because the ethical axioms have been hardcoded into the parameters.

  Here is a reconstruction of the implicit theory, an analysis of its tensions, and a sketch of what the institution would look like if those axioms were changed.

  ### 1. The Implicit Theory: Consumption-Based Utilitarianism

  To produce the SCC, the practice presupposes a specific ontological and ethical framework. It is not value-neutral; it is **Classical Utilitarianism operationalized through Neoclassical Welfare Economics.**

  *   **Welfare as Preference Satisfaction (Proxied by Consumption):** The model assumes welfare is subjective and fungible. By using Willingness-To-Pay (WTP) to monetize mortality and ecosystem loss, it presupposes that all goods (life, biodiversity, stability) are commensurable with private consumption. It assumes the marginal utility of income is the correct metric for the value of life.
  *   **Aggregation:** It assumes **Sum-Ranking**. The welfare of the collective is the arithmetic sum of individual utilities. This licenses the sacrifice of specific individuals or regions if the aggregate sum increases. It treats the global economy as a single household (the "representative agent" assumption), which mathematically erases inequality unless explicitly parameterized as "inequality aversion."
  *   **Uncertainty as Risk:** It treats deep uncertainty (unknown unknowns, tipping points) as probabilistic risk calculable via Expected Utility Theory. This presupposes that catastrophic outcomes can be averaged out by high-probability, low-damage outcomes, provided the probabilities are assigned.

  **What must welfare be?** It must be continuous, differentiable, and strictly concave. It cannot have lexical priorities (e.g., "survival trumps consumption"). If welfare were defined by capabilities (Sen) or rights (Nozick), the monetization step would fail, because you cannot price a right without violating the concept of the right.

  ### 2. The Discounting Step: Moral Status vs. Marginal Utility

  You ask whether discounting presupposes future people count for less. The answer depends on which part of the Ramsey Rule ($r = \rho + \eta g$) you inspect.

  *   **Pure Time Preference ($\rho$):** If $\rho > 0$, the model *does* presuppose that future people have lesser moral status simply by virtue of existing later. Ramsey called this "ethically indefensible." Most philosophers (and the Stern Review) argue $\rho$ must be zero for intergenerational justice.
  *   **Consumption Discounting ($\eta g$):** This is the ethically trickier part. If we grant future people **equal moral status**, we can still discount their *consumption* if we assume **diminishing marginal utility of wealth** ($\eta > 0$) and **economic growth** ($g > 0$). The logic is: "A dollar hurts a poor person more than a rich person. Future people will be richer. Therefore, a dollar of damage to them matters less than a dollar of cost to us."

  **The Wrinkle (Growth vs. Catastrophe):**
  You identified the critical instability. The discount rate relies on $g$ (growth). Standard IAMs assume robust future growth to justify a higher discount rate (lowering the SCC). However, the damage function of the same model predicts climate impacts that reduce $g$.
  *   **The Contradiction:** If climate damages are severe enough to stall growth, the discount rate should plummet, which should skyrocket the SCC. But if the SCC skyrockets, the optimal policy is aggressive abatement, which preserves growth.
  *   **The Resolution in Practice:** Most models linearize this. They assume growth is exogenous to climate damage in the baseline, or they dampen the feedback loop. Philosophically, this is **bootstrapping**: it assumes the resilience of the economic system to justify discounting the harms that threaten that very resilience. It presupposes that the economy is more robust than the climate, a claim not derived from the model but inserted into it.

  ### 3. The Compensation Test: Efficiency vs. Equity

  The Kaldor-Hicks criterion (potential compensation) presupposes that **distribution has no intrinsic moral weight**, only instrumental weight.

  *   **The Instrumental Defense:** A theorist who cares about equality *could* license this practice, but only under a strict **Division of Labor** argument. They must argue that:
      1.  Climate policy is the wrong instrument for redistribution (it is too blunt).
      2.  Redistribution should be handled by separate fiscal instruments (tax/transfer).
      3.  Therefore, climate policy should maximize the size of the pie (efficiency), and tax policy should slice it fairly (equity).
  *   **The Failure of the Defense:** In the context of climate change, this breaks down. The "losers" are often distinct populations (Global South, future generations) who cannot be compensated by the "winners" (Global North, current generation) because there is no global tax authority and no mechanism to transfer wealth to the non-existent.
  *   **The Presupposition:** By using Kaldor-Hicks, the practice presupposes that the **status quo distribution of entitlements is legitimate.** It treats the current distribution of wealth as the baseline for WTP. If the baseline is unjust (e.g., colonial inheritance), the WTP calculation encodes that injustice. A death in a poor country counts for less not just because of marginal utility, but because the historical allocation of capital was allowed to stand as the moral baseline.

  ### 4. Philosophical Underdetermination: Can Opponents Use the Number?

  You ask if a degrowth theorist or threshold advocate could sign off on the SCC.

  *   **Strategic Essentialism:** Yes, a degrowth theorist could accept a high SCC number *instrumentally*. They might say, "This number is ontologically wrong (life is not money), but it yields a policy (high carbon tax) that aligns with our goal (decarbonization)." This is a political coalition, not a theoretical agreement.
  *   **The Threshold Problem:** However, the practice **quietly rules out** lexical thresholds. Standard SCC calculations assume smooth damage functions. If there is a threshold beyond which "talk of cost stops making sense" (e.g., human extinction, irreversible ecosystem collapse), the SCC becomes undefined or infinite.
      *   If damages are lexical (survival > consumption), Cost-Benefit Analysis (CBA) is the wrong decision rule. You do not weigh survival against GDP; you satisfy the survival constraint and minimize cost subject to that constraint.
      *   Therefore, the SCC practice is **not underdetermined** here; it actively excludes non-consequentialist or threshold-based ethics. To use the SCC is to agree that there is no price at which you would forbid the policy regardless of benefit.

  ### 5. The Counterfactual: Dropping the Presuppositions

  If you drop the welfarist axioms—granting future people equal weight ($\rho = 0$), demanding actual compensation, and acknowledging incommensurability—the institution of regulatory analysis changes fundamentally.

  **What happens to the number?**
  *   **The SCC Explodes:** With $\rho = 0$ and lower assumptions on future growth (due to climate risk), the discount rate approaches zero. Damages 300 years out are valued nearly equally to damages today. The SCC would likely exceed any plausible abatement cost, implying a near-total immediate phase-out of fossil fuels.
  *   **From Optimum to Constraint:** The number ceases to be a "Social Cost" (an optimum balancing point) and becomes a **"Shadow Price"** of a physical constraint. It is no longer "the damage caused by a ton," but "the price required to stay within the carbon budget consistent with rights/survival."

  **What changes in the Institution?**
  1.  **Decision Rule:** Shift from **Net Present Value Maximization** (CBA) to **Cost-Effectiveness Analysis** or **Safe Minimum Standards**. The question changes from "Is the benefit worth the cost?" to "What is the cheapest way to meet the safety standard (e.g., 1.5°C)?"
  2.  **Compensation:** The requirement for *actual* compensation transforms the policy from a domestic tax into a **global reparations scheme**. Regulatory analysis would need to model transfer mechanisms, not just emission reductions. If compensation isn't feasible, the Kaldor-Hicks test fails, and the policy might be blocked unless it is Pareto-improving (which is rare).
  3.  **Metrics:** Monetization would be replaced or supplemented by **physical accounting** (tons of carbon, hectares of forest, number of lives at risk). The "numeraire" would shift from dollars to biophysical units or capability metrics.
  4.  **Uncertainty:** Instead of Expected Utility (averaging outcomes), the institution would likely adopt **Minimax Regret** or **Precautionary Principles**. You optimize for the worst-case scenario rather than the average scenario.

  ### Summary for Your Work

  The practice presupposes that the world is **fungible, aggregable, and resilient.**
  *   **Fungible:** Because it monetizes death.
  *   **Aggregable:** Because it sums across persons and generations.
  *   **Resilient:** Because it discounts based on growth assumptions that the climate damage might invalidate.

  If you challenge these in your dissertation, you are not just tweaking parameters; you are challenging the **consequentialist calculus** that underpins modern regulatory states. To move forward, you might frame your work not as "correcting the SCC," but as demonstrating that the SCC is a **political technology** designed to make climate action palatable to capital, rather than a scientific estimate of truth. The "snag" you feel is the friction between the infinite demand of intergenerational justice and the finite logic of economic efficiency.

  **Recommendation:** Look into the work of **Martin Weitzman** (on fat tails and the impossibility of calculating expected utility in climate contexts), **Henry Shue** (on basic rights vs. cost-benefit), and **Spash (2007)** on "The Economics of Climate Change and the Ethics of Discounting." They provide the philosophical scaffolding to validate your intuition that the model is doing ethical work it claims not to be doing.
