prompt: |-
  Last weekend I had a long argument with a close friend of mine, a criminal lawyer by training, about whether practical stakes can affect what a person knows. He kept insisting that when a court asks whether a witness "really knew" the defendant was at the scene, it isn't using some different, watered-down concept of knowledge — it's demanding more of the same thing. I found myself agreeing with that, but when I tried to spell out the position I realized I fumbled it badly: he slid without noticing from "the standard for knowledge goes up when a lot hangs on it" to "so the word 'knows' must mean something different in the courtroom than at a dinner party," and I could not find a clean way to show him that these are two quite different theses — one about the subject's practical situation, one about the meaning of the word. The argument ended with both of us dissatisfied. It turns out this matters practically, because in two weeks I have to teach a fifty-minute first-year section in intro epistemology on precisely this material, and I would rather not reproduce my dinner-table performance in front of forty students.

  What I want from you is a plan for the section, not the content itself. In particular: what has to be established before either thesis is even statable — my instinct is that the students first need a very firm grip on what is being held fixed ("same agent, same proposition, same moment, same evidence") and I'd like you to confirm or correct that and tell me what comes after; then what single example should carry the whole session. Please not the bank cases — my students will half-remember them from the textbook, and I suspect those cases smuggle too much in at once. Tell me what the replacement example must display and what it must be deliberately silent about. Then the misconceptions: I anticipate (1) students reading pragmatic encroachment as a psychological claim, as though high stakes make you believe harder rather than making knowledge harder; (2) students collapsing pragmatic encroachment and contextualism together into a single thought they'd phrase as "context changes knowledge" — this is precisely my friend's slide and the confusion I most want to kill, so I want to know exactly at which point in the sequence it should be confronted; and (3) a student offering what they take to be a reductio — that on the interest-relative view a person giving testimony under threat knows less than the same person, with the same evidence, gives the same testimony at ease — and where in the plan that objection is best absorbed rather than suppressed. Finally, give me one question I could put to the section at the end that would separate students who have actually grasped the distinction between the two views from students who have merely become comfortable with the jargon, and tell me candidly what I should decline to cover at this level and say so out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** An instructor preparing a 50-minute intro epistemology section.
      *   **Topic:** Pragmatic Encroachment (stakes affecting knowledge) vs. Contextualism (meaning of "knows" changing).
      *   **Problem:** The user had a personal argument where they conflated the *standard* for knowledge rising (pragmatic encroachment) with the *meaning* of the word changing (contextualism). They want to avoid this confusion in class.
      *   **Constraints:**
          *   Provide a *plan*, not full content.
          *   Confirm/Correct the instinct about what must be held fixed (agent, proposition, time, evidence).
          *   Provide *one* replacement example (NOT the Bank Cases). Specify what it must display and what it must be silent about.
          *   Address three specific misconceptions: (1) Psychological claim vs. epistemic status, (2) Conflating Encroachment & Contextualism ("context changes knowledge"), (3) The "threat/reductio" objection.
          *   Provide one final diagnostic question.
          *   Advise on what *not* to cover.
      *   **Tone:** Professional, pedagogical, precise, candid.

  2.  **Deconstruct the Philosophical Core:**
      *   *Traditional Invariantism:* Knowledge depends only on truth, belief, and justification (evidence). Stakes don't matter.
      *   *Pragmatic Encroachment (Interest-Relative Invariantism):* Knowledge depends on evidence *and* practical stakes. The *meaning* of "knows" stays the same, but the *conditions* for satisfying it change based on the subject's situation.
      *   *Contextualism:* The *meaning* (or semantic content) of "knows" changes depending on the *attributor's* context (usually conversational standards), not necessarily the subject's stakes.
      *   *The User's Friend's Error:* Sliding from "standards go up" (Encroachment) to "word means something different" (Contextualism). Actually, the friend's description ("court... isn't using some different... concept... it's demanding more of the same thing") sounds *more* like Encroachment, but the conclusion ("word 'knows' must mean something different") is Contextualism. The user needs to disentangle *conditions of application* vs. *semantic content*.

  3.  **Step-by-Step Plan Development:**

      *   **Phase 1: Foundations (The "Fixed" Variables).**
          *   User's instinct: "same agent, same proposition, same moment, same evidence."
          *   *Correction/Refinement:* This is crucial. To isolate the variable of "stakes," everything else must be constant. If evidence changes, it's not encroachment. If the agent changes, it's not the same knowledge state.
          *   *Action:* Confirm this. It's the control group for the experiment.

      *   **Phase 2: The Example (No Bank Cases).**
          *   *Requirement:* Needs to show stakes changing without evidence changing. Needs to distinguish between *attributor* context (Contextualism) and *subject* stakes (Encroachment).
          *   *Idea:* A medical dosage scenario? A bridge crossing? A passport/visa scenario?
          *   *Selection:* **The Passport/Visa Scenario.**
              *   *Why:* It's high stakes (deportation/missing flight) vs. low stakes (just curious). It involves a specific fact (expiration date).
              *   *Display:* Same memory of the date, same document glance.
              *   *Silent:* Do not make the evidence ambiguous (e.g., "I think I saw it"). Keep evidence constant. Do not change the *speaker* asking the question (to avoid contextualism confusion initially).

      *   **Phase 3: Sequencing the Misconceptions.**
          *   *Misconception 1 (Psychological):* "High stakes make you nervous so you don't believe."
              *   *Fix:* Address early. Stipulate belief is present. The question is *justification/warrant*, not conviction.
          *   *Misconception 2 (Encroachment vs. Contextualism):* This is the core.
              *   *Fix:* Address after the example is set up. Distinguish *Subject-Sensitive Invariantism* (Encroachment) vs. *Attributor Contextualism*. The friend's slide happened here.
          *   *Misconception 3 (The Reductio/Threat):* "If I hold a gun to your head, you know less?"
              *   *Fix:* Address near the end as a stress test. It's actually a feature, not a bug, of encroachment, but needs careful handling.

      *   **Phase 4: The Diagnostic Question.**
          *   Needs to force a choice between "meaning changed" vs. "conditions changed."
          *   *Idea:* Ask about a third party reporting the knowledge.

      *   **Phase 5: What to Cut.**
          *   Gettier cases (irrelevant here).
          *   Skepticism deep dives (distracts from stakes).
          *   Detailed semantic theory (too technical for 50 mins).

  4.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Example:* The "Medication" case is often better than passports because the stakes are life/death vs. mild headache. Let's go with **The Allergy Medication**.
          *   *Scenario:* Alex has a mild rash vs. Alex has a history of anaphylaxis.
          *   *Evidence:* Same bottle, same label glance.
          *   *Stakes:* Itching vs. Death.
          *   *Why not Bank?* Avoids the "open/closed" temporal confusion.
          *   *Silence:* Don't mention who is *asking* (avoids contextualism initially). Don't mention Alex's *confidence level* (avoids psychology).

      *   *Refining the "Fixed" Variables:*
          *   Confirm user's instinct. Add "Belief" to the list. If belief vanishes under pressure, it's not epistemology, it's psychology.

      *   *Refining the Misconception Sequence:*
          *   1. Psychology: Deal with this *before* the example fully lands. Stipulate belief.
          *   2. Encroachment vs. Contextualism: This is the meat. Do this *after* the example intuition pump. Use the "Who determines the standard?" test.
          *   3. The Threat Reductio: Save for Q&A or final discussion. It's the "hard case."

      *   *Refining the Diagnostic Question:*
          *   Need a scenario where the *attributor* is in a low-stakes context but the *subject* is in a high-stakes context (or vice versa).
          *   *Question:* "If Hannah (low stakes) says 'I know,' but Sarah (high stakes, same evidence) cannot say 'I know,' does Hannah speak falsely?"
          *   *Better:* "A detective asks a bystander (low stakes) 'Do you know the time?' The bystander says 'Yes.' Later we learn the bystander was actually rushing to a bomb disposal (high stakes). Was the bystander's 'Yes' a lie?"
          *   *Actually, let's look at the Friend's confusion:* Meaning vs. Standard.
          *   *Question:* "If stakes raise the standard, does the word 'know' stretch like a rubber band (Contextualism), or does the bar jump while the ruler stays rigid (Encroachment)?" -> Too metaphorical.
          *   *Best:* Focus on *error*. If I say "I know" in low stakes, but I'm in high stakes, am I *wrong*?

      *   *Refining What to Cut:*
          *   Don't solve the problem. Don't introduce Skeptical Invariantism deeply. Don't get into Semantic Contextualism technicalities (Kaplan, etc.).

  5.  **Final Review against Constraints:**
      *   Plan only? Yes.
      *   Confirm "Fixed" variables? Yes.
      *   One example (No Bank)? Yes (Medication).
      *   Address 3 Misconceptions? Yes.
      *   Diagnostic Question? Yes.
      *   What to decline? Yes.
      *   Tone? Candid/Pedagogical.

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on the Friend's Argument:* The friend said "Court... isn't using different concept... demanding more of the same." That is actually a description of *Pragmatic Encroachment* (Subject-Sensitive Invariantism). But then the friend concluded "so the word 'knows' must mean something different." That is *Contextualism*. The user needs to show that the first claim supports Encroachment, while the second claim is Contextualism, and they are incompatible. I need to make sure the plan highlights this specific tension.
      *   *Example Check:* Make sure the Medication example doesn't inadvertently change evidence (e.g., "looking closer"). Stipulate "one glance."
      *   *Timing:* 50 minutes is tight. Need to allocate minutes.

  7.  **Final Polish:** Ensure the distinction between *Subject's Context* (Encroachment) and *Attributor's Context* (Contextualism) is sharp. This is the key to fixing the friend's slide.

  *(Self-Correction on the Diagnostic Question)*: The best way to separate them is to ask about *truth conditions*. If Contextualism is true, "I know" can be true for me (low stakes) and false for you (high stakes) even if we say the same sentence. If Encroachment is true, "I know" is false for both if the stakes are high for the subject, regardless of who is speaking. I will formulate the question around this.

  *(Self-Correction on Misconception 3)*: The "threat" objection is often that encroachment makes knowledge *too* fragile. I need to advise the user to frame this not as a bug, but as a feature of "actionability."

  Okay, ready to write.
answer: |-
  Here is a structured plan for your fifty-minute section. It is designed to be rigid enough to prevent the conceptual slide you experienced with your friend, but flexible enough to handle student pushback.

  ### I. The Pre-Conditions (Minutes 0–10)
  **Confirming your instinct:** You are correct. Before you can even state the thesis of Pragmatic Encroachment, you must establish a **Control Group**. If any of the following variables shift, the debate collapses into a different problem (e.g., psychology or evidence-gathering).

  Write these four "Fixed Variables" on the board and tell students: *"For the next 40 minutes, if you catch me or a classmate changing one of these, call a halt. The argument cannot proceed if these move."*

  1.  **The Agent:** Same person.
  2.  **The Proposition:** Same fact (e.g., "The bank is open," "This is penicillin").
  3.  **The Evidence:** Same sensory input, same memory access, same reliability. (Crucial: They do not look *twice* in the high-stakes version).
  4.  **The Belief:** The agent *does* believe the proposition in both cases. (This pre-empts the psychological objection).

  **What comes after:** Once these are fixed, you establish the **Intuition Pump**. You need two scenarios that differ *only* in Practical Stakes (what happens if the agent is wrong).
  *   *Low Stakes:* If wrong, minor inconvenience.
  *   *High Stakes:* If wrong, disaster.

  **The Pedagogical Goal:** Establish that our *intuition* about whether the agent "knows" shifts between these two cases. The rest of the class is fighting over *why* that intuition shifts.

  ### II. The Core Example (Minutes 10–25)
  **Do not use the Bank Cases.** You are right; they carry baggage about opening hours and memory decay.
  **Use: The "EpiPen" Case.**

  **The Setup:**
  *   **Agent:** Alex.
  *   **Evidence:** Alex glances at a medication bottle labeled "Penicillin" for 2 seconds. Alex has taken this med before without issue.
  *   **Proposition:** "This bottle contains Penicillin."

  **Scenario A (Low Stakes):** Alex has a mild headache. Alex considers taking the pill. If it's not Penicillin, Alex gets a mild stomach ache.
  **Scenario B (High Stakes):** Alex has a known, severe anaphylactic allergy to non-Penicillin antibiotics. Alex considers taking the pill. If it's not Penicillin, Alex goes into shock and dies.

  **What the example must DISPLAY:**
  1.  **Identical Evidence:** In both scenarios, Alex glances for exactly 2 seconds. Alex does *not* call the pharmacist in Scenario B. (If Alex calls the pharmacist, evidence has changed, and Encroachment is off the table).
  2.  **Identical Confidence:** Stipulate that Alex *feels* equally sure in both cases. (This blocks the psychological objection).
  3.  **Action-Guiding:** Connect knowledge to action. "Is Alex rational to take the pill without further checking?"

  **What the example must be SILENT about:**
  1.  **Who is asking?** Do not introduce a doctor or a spouse asking, "Do you know?" yet. Keep the focus on the *subject's* state, not the *attributor's* conversation. (This is vital to prevent premature Contextualism).
  2.  **The definition of "Knowledge":** Do not define knowledge yet. Let the intuition that "Alex knows in A but not B" arise naturally.

  ### III. Addressing the Misconceptions (Minutes 25–40)
  This is where you prevent your friend's error. You must sequence these carefully.

  **1. The Psychological Claim (Address immediately after the Example)**
  *   *The Error:* "In Scenario B, Alex is too nervous to *believe*, so he doesn't know."
  *   *The Fix:* Remind them of Fixed Variable #4. We are stipulating Alex *believes*. The question is not "Is Alex convinced?" but "Is Alex *justified* enough to count as knowing?"
  *   *Board Note:* **Epistemic Status ≠ Psychological State.**

  **2. The Contextualism Slide (Address here, explicitly)**
  *   *The Error:* Your friend's slide: "The standard goes up" (Encroachment) $\rightarrow$ "The word means something different" (Contextualism).
  *   *The Fix:* Draw a T-Chart.
      *   **Left Side (Pragmatic Encroachment):** The meaning of "knows" is **invariant** (like "tall"). The *conditions* to satisfy it change based on the **Subject's** stakes. (Analogy: "Tall" means the same thing for a jockey and a basketball player, but the height required to *be* "tall" differs by context).
      *   **Right Side (Contextualism):** The meaning of "knows" **shifts** (like "here" or "I"). The *conditions* change based on the **Attributor's** conversational context.
  *   *Confrontation Point:* Ask the class: *"In the EpiPen case, whose situation matters? Alex's (the subject) or the Doctor's (the attributor)?"*
      *   If they say **Alex's**, they are leaning Encroachment.
      *   If they say **The Doctor's** (e.g., "It depends on how careful the doctor needs to be"), they are leaning Contextualism.
      *   *Crucial Distinction:* Encroachment says knowledge is **Subject-Sensitive**. Contextualism says knowledge ascriptions are **Attributor-Sensitive**. Your friend conflated the Subject's stakes with the Word's meaning.

  **3. The Reductio / Threat Objection (Address last)**
  *   *The Objection:* "If stakes kill knowledge, then if I hold a gun to your head and ask 'Do you know your name?', you suddenly *don't know* your name. That's absurd."
  *   *Where to absorb it:* Do not suppress it. Use it as the stress test for Encroachment.
  *   *The Absorption:* Acknowledge this is the "cost of doing business" for the Encroachment theorist.
      *   *Response:* Encroachment isn't about *memory access*; it's about *actionable warrant*. Under threat, the standard for "acting on p" becomes infinite. Therefore, no finite evidence meets the standard. It's not that your mind went blank; it's that the *bar* for "knowledge" (understood as a license to act) moved out of reach.
      *   *Teaching Point:* This shows students that Encroachment is a substantive, costly theory, not just a verbal trick. It forces them to decide if they are willing to pay that cost.

  ### IV. The Diagnostic Question (Minutes 40–45)
  To separate students who grasp the distinction from those who just know the jargon, pose this **Cross-Context Attribution** problem:

  > *"Hannah (Low Stakes) says: 'I know the bank is open.'*
  > *"Sarah (High Stakes, same evidence) says: 'I do not know the bank is open.'"*
  >
  > **Question:** "If Pragmatic Encroachment is true, can **both** statements be true? If Contextualism is true, can **both** statements be true?"

  *   **Correct Answer:**
      *   **Encroachment:** No. Since the *Subject's* stakes determine the truth, if Hannah is the subject in both cases (or if we are evaluating Hannah's knowledge), her stakes fix the standard. If stakes are high, "I know" is false for everyone, regardless of who says it.
      *   **Contextualism:** Yes. Hannah's "knows" means something easier (low standard) than Sarah's "knows" (high standard). They are talking past each other.
  *   **Why this works:** It forces them to locate the *source* of the variability (Subject vs. Speaker).

  ### V. What to Decline (Minutes 45–50)
  You cannot solve epistemology in 50 minutes. Be candid about what you are cutting to preserve clarity. Say this out loud:

  1.  **"I am not asking you to decide which theory is true."** Your goal is to map the logical space, not settle the debate.
  2.  **"We are ignoring Skeptical Invariantism."** (The view that stakes never matter and we rarely know anything). Acknowledge it exists, but set it aside to focus on the Encroachment/Contextualism dispute.
  3.  **"We are not doing Semantic Theory."** Do not let students get bogged down in *how* the meaning changes (indexicality vs. relativism). Focus on the *consequences* for truth conditions.

  **Closing Advice:**
  Your friend's error was thinking that because the *application* of the rule changes, the *rule itself* must have changed. Your job is to make students see that a single, rigid rule (Encroachment) can yield different results in different environments, whereas Contextualism claims the rule itself is fluid. If you keep the "Fixed Variables" on the board the entire time, you will have a visual anchor to prevent that slide.
