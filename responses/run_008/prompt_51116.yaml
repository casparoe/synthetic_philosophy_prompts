answer: |-
  The book you are thinking of is *I Am a Strange Loop* (2007), where Hofstadter develops the concept of the "externality of self." His argument is that high-fidelity models of other people run on the hardware of our own brains. When someone dies, their "pattern" doesn't vanish; it persists in the neural networks of everyone who knew them, slowly degrading over time.

  Your intuition is sharp: Facebook's memorialization policies are not ontologically neutral. They encode a specific, somewhat contradictory metaphysics of personhood that clashes with Hofstadter's distributed view. Here is an analysis of that tension.

  ### The Digital Tombstone vs. The Distributed Loop

  Facebook's memorialization features operate on a hybrid model of **Legal Personhood** and **Monumentalism**.

  1.  **Legal Personhood (The Privacy Lock):** By locking direct messages and preventing logins, Facebook presupposes that the "Self" is a legal entity with rights that survive biological death. This treats the account as private property or a sealed estate. The logic here is that the *agency* of the person ends at death, but their *dignity and privacy* remain intact. This explicitly rejects the idea that the community owns the deceased's voice.
  2.  **Monumentalism (The Wall):** By allowing friends to post memories but preventing changes to the profile photo or bio (unless done by a legacy contact in limited ways), Facebook treats the profile as a static artifact—a gravestone. A gravestone is carved once and visited often. It is a place *for* the living, but it does not speak *as* the dead.

  **The Incoherence:**
  The tension arises because these two models pull in opposite directions. If the account is a private estate (Model 1), why allow public commenting at all? If it is a public monument (Model 2), why are the private messages (the most intimate record of the self) sealed away from the legacy contact?

  The system resolves this practically, not philosophically: it minimizes liability. Allowing a legacy contact to read DMs opens Facebook to lawsuits regarding the privacy of the *other* people in those conversations. Allowing the account to remain fully active opens them to liability regarding the deceased's consent.

  **The Hofstadter Gap:**
  Hofstadter's theory requires the "self" to be dynamic. The version of you running in my head changes as I learn new things about you, or as I change myself. It is a living simulation. Facebook's memorialization freezes the simulation. It preserves the *output* of the self (past posts) but severs the *input* (no new logins, no evolving narrative).

  By locking the profile, Facebook asserts that the "True You" was the biological organism that died, and the digital footprint is merely its shed skin. Hofstadter would argue the "True You" is the pattern, and by freezing the pattern, Facebook is effectively lobotomizing the distributed self. It preserves the corpse of the data but forbids the ghost from haunting the machine.

  ### Designing for the Distributed Self

  If engineers took Hofstadter seriously, the goal wouldn't be preservation; it would be **integration**. The profile would need to acknowledge that the "user" is now a collective construct.

  *   **Shared Curation:** Instead of one legacy contact, the "profile" could become a wiki-managed space where close friends collectively curate the narrative, acknowledging that "you" are different to different people.
  *   **Active Aggregation:** The system could surface old memories to friends not as "On this day," but as prompts for the network to update their internal models of the deceased (e.g., "Sarah never got to see this photo; add it to her story?").
  *   **The Creepiness Factor:** You asked if the desire for a more dynamic system is a "you problem." It is not. It is the **Uncanny Valley of Identity**. If the profile becomes too active (e.g., auto-posting based on past habits), it violates the consent of the deceased. If it is too static, it violates the reality of how memory works (which is fluid). The "creepiness" is the friction of realizing that to keep a distributed self alive, the survivors must actively *simulate* the dead, which feels like playing god.

  ### Conclusion

  Facebook's current setup is coherent only if you view the person as a **rights-bearing individual who has ceased to exist.** It is incoherent if you view the person as a **pattern that has migrated.** The features flip between "grave" and "estate" because those are the only legal categories available, not because they reflect the phenomenological reality of grief. A system built for the distributed self would look less like a profile and more like a collaborative biography, but it would require us to admit that the dead do not own their memories—the living do.

