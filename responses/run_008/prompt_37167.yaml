          *   *Why 3 years?* Developing a normative framework for *conceptual pluralism* in law/policy is hard. Requires building models, not just critiquing.
          *   *Upstream?* Yes. If we decide pluralism is the way, it dissolves the "when did it start" fight (Q1) and reshapes the "who is responsible" fight (Q3).
          *   *Neglect:* Most philosophers argue *for* pluralism; few argue how to *institutionalize* it without chaos.
      *   *Critique of Overrated Stakes:* The geological formalization itself (Q1's outcome) is overrated for policy. Policy doesn't wait for geology. The "Golden Spike" was always more about scientific identity than law.
      *   *Future Triggers:* If the IPCC adopts it formally? If a court case hinges on it? If the Anthropocene Working Group (AWG) pivots to an informal campaign?

