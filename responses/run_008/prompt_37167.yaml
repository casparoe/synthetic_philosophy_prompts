      *Final Polish:* Ensure the distinction between Postdoc and Senior Fellowship is considered implicitly (one might be more historical/empirical, the other more theoretical). I will suggest one Senior (theoretical framework) and one Postdoc (empirical/historical case studies).

      *(Self-Correction on "Senior vs Postdoc"):* The prompt says "a postdoc or senior fellowship each." I can recommend the mix. A Senior Fellow is better for the heavy theoretical lifting (Project 2), a Postdoc is better for the archival/policy tracking (Project 1). I will incorporate this into the justification.

      *Wait, looking at Q1 again:* "whether it is better classified as a diachronous event than an epoch at all." This is actually still very live. But is it philosophy? Yes, philosophy of time/classification. But is it governance? Less so. I will keep the focus on the *implications* of diachronicity for governance (e.g. polycentric governance matches diachronic onset). This links Q1 to Governance. Okay, I might swap Q2 for a refined Q1/Q4 hybrid.
