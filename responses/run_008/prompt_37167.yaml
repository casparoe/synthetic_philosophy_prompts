          *   **Project 2 (Priority):** Focus on the *Metaphysical/Pluralist* question (Q4), but refined to be about "Classificatory Realism vs. Instrumentalism in Policy." Why? Because if we accept pluralism (Q4), how do we govern? This is upstream of the Normative question (Q3). Q3 is too crowded; Q4 provides the theoretical groundwork to *solve* Q3.
      *   *Why not Q1?* Too geological. The train has left the station on the Golden Spike.
      *   *Why not Q3?* Too crowded.

  5.  **Drafting the Argument (Iterative refinement):**

      *   *Introduction:* Acknowledge the 2024 pivot. The term is now a "zombie category" (dead geologically, alive socially). This changes the funding landscape.
      *   *Project 1 Recommendation:* **The Politics of Epistemic Authority (Refining Q2).**
          *   *Why 3 years?* Needs historical case studies (not just Anthropocene), philosophical analysis of boundary work, and engagement with policy actors.
          *   *Upstream?* Yes. Before we ask "what should we do?" (Normative), we must ask "who gets to name the problem?"
          *   *Neglect:* Geologists talk about procedure; politicians talk about outcomes. Few analyze the *transfer of authority* when formalization fails.
