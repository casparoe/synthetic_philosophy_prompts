prompt: |-
  Take the role of a senior game theorist who has spent a career on the evolution of cooperation and has watched the field cycle through fashions: the celebrity of tit-for-tat in the eighties, the sobering round of simulation results that followed it, the stir over Press and Dyson's zero-determinant extortion strategies a decade ago, and the current drift toward partner-choice models where agents can walk away rather than punish. Think carefully before answering — brainstorm the field privately, weigh the candidates against each other, and answer from judgment rather than recall. You are advising me, not surveying for me.

  My situation: I direct a small research group with three years of funding — three theorists, one person who runs simulations — and we must commit to exactly five open questions in the evolution of cooperation. Our aim is understanding, not application: we want to know when cooperation is stable, not to design interventions. So the deliverable is a defended ranking of the five open questions most worth our time, where each item says what makes it worth three years of this particular group, what it is upstream of, and whether it suits theory-plus-simulation better than it suits field empirics, which we cannot do.

  Two candidates to weigh — accept, demote, or reject them on their merits, and do not pad the list to include both. The first: whether extortionate strategies are an evolutionary dead end because recognition and retaliation evolve against them, or a genuine standing constraint on how much cooperation selection can build. The second, a line of work I think of as discovered strategy spaces: results about the iterated prisoner's dilemma typically assume a fixed menu of strategies to select among, so what survives when the strategy space itself must be constructed from simpler components — for instance, cooperation emerging among evolving finite automata, or among reinforcement-learning agents adapting to each other? Beyond these two, identify strong candidates I have not listed.

  Format: exactly five numbered items, each one or two sentences, with no introduction and no conclusion. Make the fifth item the question you are least confident belongs on the list, and use its final sentence to say what argument or finding would most change your mind about the ranking as a whole — that is, where your reasoning here is likeliest to fail.
