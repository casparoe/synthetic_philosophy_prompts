          *   *Claim:* "That's a contradiction, so functionalism is true..." -> Again, Chalmers concludes the *Principle of Organizational Invariance* is true. Calling it "functionalism" is acceptable shorthand in some intro classes, but potentially misleading given Chalmers's broader project.
