      *   So:
          *   Mugging: Paying buys a benefit in the *other* branch.
          *   Blackmail: Paying buys *no benefit* in the *other* branch (Dirt outcome is same), but incurs cost in *this* branch.
      *   This confirms the "Cross-Branch Subsidy" argument.
      *   Roommate's claim "payments are for nothing" is technically true in both (locally), but normatively irrelevant. The relevant fact is "Does this payment correlate with a better outcome elsewhere?"
      *   Mugging: Yes.
      *   Blackmail: No.
      *   This is the knockout punch.

  8.  **Final Plan:**
      *   Acknowledge the roommate's cleverness.
      *   Identify Step 2/4 as the equivocation.
      *   Explain the "Cross-Branch Subsidy" difference.
      *   Reiterate that UDT is about Policy EV, not Local Causal Power.
      *   Confirm the bullet: You pay in Tails knowing it changes nothing locally, because it validates the algorithm that gets paid in Heads.
      *   Advise on how to talk to the roommate.
answer: |-
  Your roommate is sharp, and his argument is a classic "motte-and-bailey" style equivocation that trips up a lot of people first encountering Updateless Decision Theory (UDT). He is smuggling **Causal Decision Theory (CDT)** reasoning into the justification for a **UDT** verdict, then using that justification to force a CDT verdict elsewhere.

  You should reject **Step (2)** and **Step (4)**. Specifically, you should reject the claim that the *reason* UDT refuses the blackmailer is that "payments never stop a publication" (local causal inefficacy). That is a *description* of the Blackmail setup, not the *normative rule* UDT follows.

  Here is the breakdown of where the argument squirms, the actual disanalogy between the two cases, and the bullet you have to bite to keep the standard verdicts.

  ### 1. The Equivocation: Local vs. Global
  Your roommate's argument hinges on treating "Does this payment change the outcome in this specific branch?" as the deciding rule.
  *   **In Blackmail:** He correctly notes that paying doesn't stop publication *in the branch where you pay* (because there's no dirt).
  *   **In Mugging:** He correctly notes that paying doesn't bring back the $1000 *in the branch where you pay* (because the coin is already tails).
  *   **The Trick:** He implies that because UDT agrees with him on Blackmail, UDT must agree with the *reasoning* ("don't pay if it changes nothing locally"). But UDT does **not** use that reasoning. UDT uses **Ex-Ante Expected Utility of the Policy**.

  If "local causal inefficacy" were the rule, UDT would refuse the Mugging (CDT verdict). Since UDT pays the Mugging, "local causal inefficacy" cannot be the rule. The rule is: **Does adopting the policy 'Pay' yield a higher expected return across all possible worlds than the policy 'Refuse'?**

  ### 2. The Actual Disanalogy: Cross-Branch Subsidies
  To keep the standard verdicts (Pay Mugging, Refuse Blackmail), you need to see why the *Ex-Ante Expected Utility* differs between the two, despite the local similarity.

  **Counterfactual Mugging:**
  *   **Policy Pay:** You lose $100 in Tails. You **gain $1000 in Heads**.
  *   **Policy Refuse:** You lose $0 in Tails. You **gain $0 in Heads**.
  *   **The Trade:** The payment in Tails acts as a **premium** that secures a **payout** in Heads. It is a successful cross-branch subsidy. You are paying in the world where you lost the coin flip to reward your algorithm in the world where you won.

  **XOR Blackmail:**
  *   **Policy Pay:** You lose $1,000 in No-Dirt. In the Dirt world, the Predictor knows you pay, so **no letter is sent**, and you lose **$10,000** (publication happens).
  *   **Policy Refuse:** You lose $0 in No-Dirt. In the Dirt world, the Predictor knows you refuse, so **a letter is sent**, you refuse, and you lose **$10,000** (publication happens).
  *   **The Trade:** The payment in No-Dirt buys you **nothing in the Dirt world**. In the Dirt world, you lose $10,000 *regardless* of your policy. (As a Payer, the letter never arrives to let you pay; as a Refuser, the letter arrives but you refuse).
  *   **Result:** The Payer incurs a cost in No-Dirt (-$1,000) but gets **zero benefit** in Dirt compared to the Refuser. The Refuser saves the $1,000 in No-Dirt and suffers the same fate in Dirt.

  **The Crucial Difference:**
  *   In the **Mugging**, your payment in the "bad" branch (Tails) is logically linked to a **better outcome** in the "good" branch (Heads).
  *   In the **Blackmail**, your payment in the "good" branch (No-Dirt) is logically linked to the **same outcome** in the "bad" branch (Dirt).

  Your roommate's Step (2) claims the reason to refuse Blackmail is that "payments never stop a publication." The more precise reason is: **"Payments in the No-Dirt branch do not improve the outcome in the Dirt branch."** In the Mugging, payments in the Tails branch *do* improve the outcome in the Heads branch.

  ### 3. Rejecting Step (4)
  Step (4) says: *"In the tails world, the payment is likewise for nothing."*
  This is true locally, but normatively irrelevant. Under UDT, you are not deciding as an agent *in the tails world*; you are executing the decision of the agent *before the coin flip*.

  From the ex-ante perspective:
  *   **Mugging:** "If I program myself to pay in Tails, I get $1000 in Heads. Worth it."
  *   **Blackmail:** "If I program myself to pay in No-Dirt, I get... the exact same disaster in Dirt, but I'm out $1000 in No-Dirt. Not worth it."

  Your roommate is trying to force you to evaluate the decision *from inside the Tails world* ("Look, the coin is already tails!"). If you do that, you are no longer being Updateless; you are updating on the fact that you are in Tails. UDT explicitly forbids this. You must stick to the ex-ante policy.

  ### 4. The Bullet You Have to Bite
  You asked how big the bullet is. It is this:

  **You must accept that you will sometimes make a payment in a world where, causally and locally, that payment changes absolutely nothing.**

  When you are in the Tails world of the Mugging, the coin is already tails. The $1000 is already gone. Omega has already made up his mind. Handing over the $100 feels like throwing money into a furnace.
  *   **CDT says:** "Don't do it. It changes nothing."
  *   **UDT says:** "Do it. Not because it changes *this* world, but because *being the kind of agent who does this* is what caused the good outcome in the other world."

  You are paying for the **counterfactual you**. You are subsidizing your algorithm's reputation across logical space. It feels irrational from inside the branch because your intuition is wired for CDT (local causal efficacy). To be Updateless, you have to override the intuition that says "I can't change the past/other branches."

  ### 5. How to Reply to Your Roommate
  Tell him this:

  > "You're conflating the *scorekeeping* with the *rules*.
  >
  > In Blackmail, the 'Pay' policy loses because the payment in the No-Dirt branch fails to purchase a better outcome in the Dirt branch. The Dirt outcome is -10k either way. So the payment is a net loss.
  >
  > In the Mugging, the 'Pay' policy wins because the payment in the Tails branch *does* purchase a better outcome in the Heads branch (+1000 vs 0).
  >
  > Your argument relies on the heuristic 'Don't pay if it doesn't change the local outcome.' But that's CDT, not UDT. UDT says 'Don't pay if the **policy** doesn't have positive ex-ante expectation.'
  >
  > In the Mugging, the payment changes nothing locally, but the **policy** changes everything globally. In Blackmail, neither the payment nor the policy helps.
  >
  > So I reject Step (2). The reason we refuse the blackmailer isn't because local payments are inert; it's because the cross-branch subsidy is negative. In the Mugging, the subsidy is positive. I'll pay the mugger, refuse the blackmailer, and accept that sometimes I have to pay money in a world where it 'does nothing' locally to keep my algorithm profitable globally."

  ### Summary
  *   **Reject:** Step (2) and (4). The "local inefficacy" is not the normative rule.
  *   **Accept:** Ex-Ante Policy Expected Utility is the only rule.
  *   **Distinction:** Mugging offers a positive cross-branch return on investment; Blackmail offers a negative one.
  *   **Bullet:** Yes, you pay when it locally "does nothing." That is the definition of acausal trade.

  Your roommate is trying to use the *result* of the Blackmail calculation (Refuse) to justify a *method* (Local Causal Analysis) that contradicts the *result* of the Mugging calculation (Pay). Don't let him swap the method on you. Keep the method (Ex-Ante Policy EV), and the results follow consistently.
