prompt: |-
  So every couple years I teach the grad seminar on rational choice, and this term I'm supposed to hand out a one-page "where I stand" sheet before the decision theory unit, partly so the students can take shots at me for the rest of the semester. I drafted it last night and now that I look at it again I suspect there's something rotten in there somewhere, but I genuinely cant locate it. Here's roughly the list:

  (1) In the one-shot Parfit's hitchhiker case — you're dying in the desert, the driver is a near-perfect predictor who'll only take you if she predicts you'll pay on arrival, and there are zero reputation effects or future interactions — you should pay, and paying is rational, full stop.

  (2) In Kavka's toxin case — you get a million dollars tonight if at midnight you intend to drink a toxin tomorrow, the toxin makes you sick but won't kill you, and the billionaire can read your mind — it's rational to intend to drink, but come tomorrow, actually drinking the toxin is irrational. You've got the money, the intention did its job, drink nothing.

  (3) Rationality is not a property of acts at moments. It's a property of whole plans or policies. An act at a time is rational only insofar as it belongs to the best plan that was available to you when you committed, and it can be rational to carry through on a step of the plan that looks terrible from inside that moment.

  (4) Rational irrationality is a real phenomenon and not just a cute phrase. Sometimes the rational thing is to deliberately install a genuinely irrational disposition and then act from it — Schelling's point about the bargaining power of the leader who's half-mad, or the person who takes a pill that makes her incapable of reneging on a threat she's issued. Once installed, acting on the temper or the threat is itself rational.

  (5) I'm an act consequentialist about moral rightness. What you morally ought to do is whatever act has the best consequences, no loopholes for past promises or dispositions.

  (6) I've never bought Gauthier's constrained maximization. It always looked to me like an elaborate device for smuggling morality into rationality by fiat, and I explain whatever's right about it some other way.

  (7) Sunk costs are never reasons. Past expenditure, past benefit recieved, effort already sunk — none of it can by itself make any difference to what there's reason to do now.

  My problem: a couple of my own grad students have told me (smugly, I might add) that this is "not a package" but a drawer of mismatched parts, and when I pressed them on which parts clash they gave me three different answers. So I want a real audit, not a vibe. Which of these are genuinely in tension, which only look like they are, and where they really clash, what exactly has to give — and what adopting the fix costs me elsewhere on the list. Please rank the tensions by severity instead of listing them all as equally fatal, and be concrete about which commitment is doing the damage in each case. If some pair looks like it conflicts but actually doesnt, say so and show the work, because I'd rather keep most of these if I honestly can.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A professor teaching a grad seminar on rational choice theory.
      *   **Task:** Audit a one-page "where I stand" sheet containing 7 philosophical commitments.
      *   **Problem:** Students claim the commitments are inconsistent ("not a package," "mismatched parts").
      *   **Goal:** Identify genuine tensions vs. apparent ones, rank them by severity, explain *why* they clash (the mechanism of the conflict), and suggest what has to give (and the cost of fixing it).
      *   **Tone:** Professional, analytical, rigorous (suitable for a grad seminar context), but engaging (acknowledging the "take shots at me" context).

  2.  **Analyze the Commitments:**
      *   (1) **Parfit's Hitchhiker:** Pay the driver. (Newcomb/Prisoner's Dilemma type logic. CDT fails here, EDT/BDT succeeds). *Commitment: Non-Myopic/Resolute Choice or BDT.*
      *   (2) **Kavka's Toxin:** Intend to drink, but *don't* drink. (Intention is rational, action is not). *Commitment: Separation of Intention and Action rationality.*
      *   (3) **Rationality of Plans:** Rationality applies to plans/policies, not just momentary acts. Acts are rational if part of the best prior plan. *Commitment: Resolute Choice / Plan-Based Rationality.*
      *   (4) **Rational Irrationality:** Deliberately installing irrational dispositions is rational. Acting on them is rational. *Commitment: Indirect Strategic Rationality / Precommitment.*
      *   (5) **Moral Act Consequentialism:** Moral rightness = best consequences of the *act*. No loopholes for promises/dispositions. *Commitment: Direct Act Consequentialism.*
      *   (6) **Anti-Gauthier:** Constrained Maximization is smuggling morality into rationality. *Commitment: Distinction between Rationality and Morality.*
      *   (7) **Sunk Costs:** Sunk costs are never reasons. *Commitment: Forward-Looking Rationality.*

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *(1) vs. (2):* Hitchhiker says *pay* (do the thing predicted). Toxin says *don't drink* (do the thing not predicted/beneficial). In Hitchhiker, the act confirms the prediction. In Toxin, the act falsifies the intention (or rather, the intention secures the reward, the act is useless). This seems consistent with BDT (Evidential/Functional Decision Theory) vs. CDT. But wait, (1) requires *doing* the predicted thing. (2) requires *intending* but *not doing*. Is there a conflict in the *theory of action*?
      *   *(1) & (2) vs. (7):* Hitchhiker and Toxin often rely on the idea that your current choice provides *evidence* about your past disposition or prediction. Sunk costs (7) says look forward. But (1) and (2) are about *predictions based on disposition*. This isn't exactly sunk costs, but it's close to "past commitments."
      *   *(3) vs. (7):* (3) says acts are rational because of a *past* plan. (7) says past stuff (plans/efforts) is sunk and shouldn't matter. **Major Clash.** If rationality is about following a past plan (3), aren't you treating the past plan as a reason?
      *   *(3) vs. (5):* (3) says rationality is plan-based. (5) says morality is act-based. This is a standard Rationality vs. Morality split. Not necessarily a contradiction, but a divergence.
      *   *(4) vs. (6):* (4) says install irrational dispositions. (6) says Gauthier is wrong for making rationality look like morality. Gauthier uses dispositions to solve PD. If (4) allows dispositions to solve PD-like problems, is (6) consistent? Gauthier says "be a constrained maximizer." You say "install irrational disposition." Is that just semantic?
      *   *(4) vs. (5):* (4) says act on the irrational disposition (e.g., threaten and follow through). (5) says moral rightness is act-consequentialist (don't follow through if it hurts consequences). So you might be *rationally* required to do something *morally* wrong. This is a standard conflict, not necessarily an inconsistency *within* the system, unless the system claims they align.
      *   *(1) vs. (2) vs. (3):* This is the core "Newcomb/Toxin/Hitchhiker" cluster.
          *   Hitchhiker: Pay. (Action aligns with Prediction).
          *   Toxin: Don't Drink. (Action diverges from Intention).
          *   Why the difference? In Hitchhiker, paying is necessary for the prediction to have been true (in some accounts) OR paying is part of the policy that gets you rescued. In Toxin, drinking adds no value once the money is secured.
          *   Commitment (3) tries to bridge this: "Act is rational if it belongs to the best plan."
          *   In Hitchhiker: Best plan = "Pay if rescued." Act = Pay. Rational.
          *   In Toxin: Best plan = "Intend to drink." Act = Don't drink. Is "Don't drink" part of the best plan? The plan was "Intend." The act is "Drink/Don't." If the plan is "Intend then Don't," then "Don't" is rational.
          *   *Tension:* (3) says acts are rational *insofar as* they belong to the best plan. But (7) says past plans are sunk. If I made a plan yesterday, why does it bind me today unless it affects future consequences? In Toxin, drinking has *no* future consequences (money is already had). So (7) says "Don't drink." (3) says "Don't drink (because plan said intend-only?)." This seems okay.
          *   *Wait, look at Hitchhiker again.* In Hitchhiker, if I'm in the city, the prediction is already made. The money (life) is saved. Paying has a cost (-$100). Not paying has benefit (+$100). Future consequences of paying: None (no reputation). So (7) Sunk Costs says: "The rescue is sunk. Don't pay." But (1) says: "Pay." **CRITICAL CLASH.**
      *   *(1) vs. (7):* In the one-shot Hitchhiker, once you are in the city, the rescue is a *sunk benefit*. The prediction is in the past. Paying costs utility. Not paying saves utility. There are no future repercussions. (7) says sunk costs/benefits are not reasons. Therefore, the past rescue is not a reason to pay. Therefore, you should not pay. But (1) says you *should* pay.
      *   *(3) vs. (7):* (3) validates acting on a past plan. (7) invalidates acting on past commitments. If the plan is "sunk," why follow it?
      *   *(5) vs. (1)/(3)/(4):* (5) is Act Consequentialism. (1)/(3)/(4) imply a form of Rule/Plan Consequentialism or Non-Causal Decision Theory for *rationality*. If Rationality and Morality come apart, that's fine. But if (5) says "What you morally ought to do is whatever act has best consequences," and (1) says "You should pay" (which has worse consequences in the moment), then Rationality and Morality diverge. This is allowed, but it makes the "Normative Force" question tricky.
      *   *(4) vs. (2):* (4) says acting on the installed disposition is rational. (2) says acting on the intention (drinking) is *irrational*. In Toxin, the "disposition" is "be the kind of person who intends to drink." Once you have the money, do you act on the disposition? If the disposition is "Drink when intended," then (4) says drink. (2) says don't drink.
          *   *Resolution:* In Toxin, the disposition needed is just "Form the intention." You don't need a disposition to *drink*. So (4) and (2) can coexist if the "irrational disposition" in (4) refers to things like retaliation threats, not toxin drinking.
      *   *(6) vs. (4):* Gauthier's Constrained Maximization (CM) is basically (3) + (4). CM says: Be disposed to cooperate in PDs if others are similar. You say (6) "Never bought Gauthier." But (4) says "Rational Irrationality... Schelling... pill." This sounds *exactly* like Gauthier's transparency/disposition move, just without the moral labeling. If you accept (4), you accept the *mechanism* of Gauthier, even if you reject the *label* "Constrained Maximization." The tension is whether your rejection of Gauthier is substantive or terminological.

  4.  **Ranking the Tensions:**

      *   **Severity 1 (Fatal):** (1) Hitchhiker vs. (7) Sunk Costs. This is the classic "Dynamic Inconsistency" problem. Once in the city, the rescue is sunk. Paying is costly. No future effects. (7) dictates defecting. (1) dictates cooperating. You cannot hold both without a major caveat.
      *   **Severity 2 (Structural):** (3) Plan Rationality vs. (7) Sunk Costs. (3) justifies current action via past commitment. (7) denies past commitment normative force.
      *   **Severity 3 (Theoretical Coherence):** (4) Rational Irrationality vs. (6) Anti-Gauthier. You seem to be accepting Gauthier's solution while rejecting his name. This makes (6) look like a terminological quibble rather than a substantive position, which students will pounce on.
      *   **Severity 4 (Normative Divergence):** (5) Act Consequentialism vs. (1)/(3)/(4). Your theory of Rationality is effectively Plan/Rule Consequentialist (or FDT). Your theory of Morality is Act Consequentialist. They will prescribe different actions in Hitchhiker/Toxin/Threats. This isn't a logical contradiction, but it creates a "Why be rational?" problem.

  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the students are right, but it's a fertile inconsistency.
      *   *The Big One (1 vs 7):* Explain the "In the City" moment. The rescue is a sunk benefit. (7) says ignore it. (1) says honor it. This is the core Dynamic Inconsistency problem.
      *   *The Support Beam (3 vs 7):* (3) is the glue holding (1) together, but it directly contradicts (7). If (7) is true, (3) is false. If (3) is true, (7) needs a huge exception for "Plans."
      *   *The Gauthier Ghost (4 vs 6):* Point out that (4) *is* Gauthier's mechanism. Distinguish between "Morality" (Gauthier's goal) and "Rationality" (Your goal).
      *   *The Toxin Nuance (2 vs 4):* Clarify why Toxin is different from Schelling threats. (Toxin = intention only; Schelling = action required).
      *   *The Moral/Rational Split (5 vs Rest):* Acknowledge the divergence.
      *   *Recommendations:* Which to drop/modify?
          *   Option A: Drop (7). Allow "Plan Sunk Costs." (Embrace Resolute Choice).
          *   Option B: Drop (1). Be a Causal Decision Theorist. (Don't pay in Hitchhiker).
          *   Option C: Refine (7). Sunk *financial* costs vs. Sunk *normative* commitments.

  6.  **Refining the Analysis (Self-Correction/Deep Dive):**

      *   *Wait, is (1) actually inconsistent with (7)?*
          *   Standard CDT says: Don't pay. Prediction is past.
          *   EDT/FDT says: Pay. Your choice is evidence of your type, which caused the prediction.
          *   (7) Sunk Costs: "Past expenditure... none of it can by itself make any difference."
          *   If I adopt FDT (Functional Decision Theory), my choice *isn't* treating the past as a reason. It's treating the *logical connection* between my output and the predictor's output as the reason.
          *   *However*, the phrasing of (1) "you should pay... full stop" in a *one-shot* case usually implies a commitment to *Resolute Choice* (McClennen) or *Sophisticated Choice* that fails.
          *   If the professor holds (3) "Rationality is property of whole plans," this is McClennen's Resolute Choice.
          *   McClennen explicitly rejects the "Sunk Cost" orthodoxy regarding *plans*.
          *   So, (1) + (3) + (7) is the triangle of fire.
          *   (7) is the standard Decision Theory orthodoxy (CDT).
          *   (1) + (3) is the Heterodox orthodoxy (Resolute Choice / FDT).
          *   You can't have CDT's Sunk Cost rule AND Resolute Choice's Plan rule.
      *   *Is (2) Toxin consistent with (1) Hitchhiker?*
          *   Hitchhiker: Action confirms prediction.
          *   Toxin: Action does *not* confirm prediction (Prediction is on Intention).
          *   This is consistent *if* you distinguish between predictions of *action* vs predictions of *intention*.
          *   But (3) says acts are rational if part of the best plan.
          *   In Toxin: Best plan = "Form intention." Does "Drink" belong to that plan? No. So "Don't Drink" is rational.
          *   In Hitchhiker: Best plan = "Pay if rescued." Does "Pay" belong to that plan? Yes. So "Pay" is rational.
          *   So (1), (2), and (3) actually hang together well *if* you accept Plan Rationality.
          *   The outlier is (7). (7) is the CDT axiom that kills (3).

      *   *Re-evaluating (4) vs (6):*
          *   Gauthier: Rationality requires constrained maximization (cooperate in PD). This makes Rationality = Morality (mostly).
          *   Professor: Rationality requires dispositions (4), but Morality is Act Consequentialism (5).
          *   So in a PD, Professor says: Rational to Cooperate (via disposition), Moral to Defect (Act Consequentialism, assuming no future effects).
          *   Gauthier says: Rational to Cooperate, Moral to Cooperate.
          *   So the Professor *can* reject Gauthier's *conclusion* (that Rationality aligns with Morality) while accepting his *mechanism* (dispositions).
          *   Tension: Is "Constrained Maximization" the mechanism or the conclusion? Usually the mechanism. If you accept the mechanism, rejecting the label is weak. But if you define CM as "Morality-infused Rationality," then rejecting it is fine.
          *   Verdict: Low severity, mostly terminological defense needed.

      *   *Re-evaluating (5) vs (1):*
          *   (1) Paying in Hitchhiker has worse consequences *at the time of action* than not paying.
          *   (5) Moral rightness = best consequences of the *act*.
          *   So in Hitchhiker: Rational to Pay (1). Moral to Not Pay (5).
          *   This is a feature, not a bug, for many philosophers. But it creates a "Normative Schizophrenia."
          *   Severity: Moderate. It's a known problem, not a logical contradiction.

  7.  **Finalizing the Structure:**
      *   **Executive Summary:** The students are right. The core conflict is between **Plan-Based Rationality (1, 3, 4)** and **Act-Based/Sunk-Cost Orthodoxy (7)**.
      *   **Fatal Tension:** (1) & (3) vs. (7). The "In the City" problem.
      *   **Structural Tension:** (4) vs. (6). The Gauthier Shadow.
      *   **Normative Tension:** (5) vs. (1-4). Rationality vs. Morality divergence.
      *   **The Toxin Exception:** Explain why (2) survives.
      *   **Prescription:** Choose a lane. Resolute Choice (Drop 7) or CDT (Drop 1 & 3).

  8.  **Tone Check:** Keep it sharp. Use the terminology the professor uses (grad seminar level). Acknowledge the "take shots at me" goal—this audit gives them the ammo, but organized.

  9.  **Refining the "Sunk Cost" argument:**
      *   Standard view: Sunk costs are costs already incurred.
      *   Hitchhiker: The *benefit* (rescue) is sunk. The *cost* (payment) is future.
      *   (7) says "Past benefit received... none of it can by itself make any difference."
      *   If the rescue is a past benefit, (7) says it can't make a difference to paying.
      *   So (7) implies "Don't Pay."
      *   (1) implies "Pay."
      *   Contradiction confirmed.

  10. **Refining the "Gauthier" argument:**
      *   Gauthier's *Morals by Agreement* argues that it is rational to be a Constrained Maximizer.
      *   The Professor says (6) "Never bought Gauthier's constrained maximization."
      *   But (4) says "Rational thing is to deliberately install a genuinely irrational disposition."
      *   This *is* Constrained Maximization (or Disposition Rationality).
      *   The Professor likely objects to Gauthier's claim that this *defines* morality or that it works without transparency/translucency assumptions.
      *   The tension is: If you accept (4), you accept the *core thesis* of Gauthier's rationality project. Rejecting the label looks like fighting words without a substantive difference unless specified.

  11. **Final Polish:** Ensure the distinction between *causal* influence and *logical/evidential* influence is clear in the Hitchhiker analysis, as that's often where the "Sunk Cost" defense hides. But given (7)'s phrasing ("Past benefit received"), it blocks the "logical connection" defense too if interpreted strictly as "look only at future causal consequences." I will assume the professor means the standard orthodox view on sunk costs which aligns with CDT.

      *Wait, one nuance:* If the professor is an FDT (Functional Decision Theory) proponent (like Yudkowsky/Soares), they might argue (7) is compatible with (1) because the decision *isn't* treating the past as a reason, but treating the *algorithm* as the reason.
      *However*, (3) "Rationality is a property of whole plans... available to you when you committed" sounds more like **Resolute Choice (McClennen)** than FDT. Resolute Choice *explicitly* violates the separability principle which underpins (7).
      *So I will treat (3) as Resolute Choice.* This makes the clash with (7) direct.

      *Let's write.*
answer: |-
  Your students are being smug, but they aren't wrong. You have drafted a position that tries to occupy the "Resolute Choice" high ground while keeping the "Orthodox Decision Theory" safety rails. That works in a lecture, but not on a one-pager.

  The core issue is that commitments **(1), (3), and (4)** form a coherent heterodox package (roughly McClennen's *Resolute Choice* or Functional Decision Theory), while **(7)** is the central axiom of the orthodox view (Causal Decision Theory/Sequential Rationality) that explicitly forbids (1) and (3). Commitment **(6)** is a terminological skirmish that undermines (4), and **(5)** creates a normative schism you need to own.

  Here is the audit, ranked by severity.

  ### 1. The Fatal Contradiction: (1) & (3) vs. (7)
  **Severity:** Critical
  **The Clash:** This is the "In the City" problem.
  *   **Commitment (7)** states that past benefits (the rescue) and past commitments (the plan to pay) are sunk. They cannot by themselves give you a reason to act *now*. In the one-shot Hitchhiker case, once you are in the city, the rescue is a *sunk benefit*. Paying is a *future cost*. There are no future reputation effects. By the logic of (7), you must not pay.
  *   **Commitment (1)** states you *must* pay.
  *   **Commitment (3)** attempts to bridge this by saying rationality applies to the *plan* made in the desert. But (3) directly violates the principle underlying (7), which is **Dynamic Consistency** (or Separability). (7) assumes that at every node, you re-evaluate based only on future consequences. (3) says you are bound by the past evaluation.

  **What Has to Give:**
  *   **Option A (Keep 1 & 3, Drop 7):** You embrace **Resolute Choice**. You admit that "Sunk Costs" is a heuristic for financial decisions but false for rational agency. A past plan *is* a reason, provided the plan was optimal ex-ante.
      *   *Cost:* You lose the standard economic orthodoxy. You have to explain why sunk costs count for promises but not for bad investments. (Answer: Bad investments weren't part of an optimal plan; keeping a promise was).
  *   **Option B (Keep 7, Drop 1 & 3):** You embrace **Causal Decision Theory (CDT)**. You admit that in the one-shot Hitchhiker case, you should *not* pay.
      *   *Cost:* You lose the ability to solve Newcomb-like problems and Prisoner's Dilemmas without external enforcement. You become a "Evidential Irrelevantist."

  **Recommendation:** Given (3) and (4), you are clearly a Resolute Choice/FDT theorist at heart. **Drop (7).** It is the rotten apple. Keep it as a "folk principle" but clarify it doesn't apply to ex-ante optimal plans.

  ### 2. The Gauthier Ghost: (4) vs. (6)
  **Severity:** High
  **The Clash:** You are accepting Gauthier's mechanism while rejecting his label.
  *   **Commitment (4)** endorses the core thesis of David Gauthier's *Morals by Agreement*: it is rational to cultivate a disposition (like being a threat-keeper or cooperator) that constrains your future maximization, because having the disposition yields better ex-ante outcomes.
  *   **Commitment (6)** dismisses "Constrained Maximization" as smuggling morality into rationality.
  *   **The Problem:** Gauthier's *Constrained Maximization* **is** Commitment (4). The only difference is that Gauthier thinks this makes the resulting acts *moral*, whereas you (per Commitment 5) think they might be *immoral*. If your objection to Gauthier is only that he conflates Rationality with Morality, then (6) is misleading. It sounds like you reject the *rationality* of dispositions.

  **What Has to Give:**
  *   **Refine (6):** Change it to: "I accept the *mechanism* of Constrained Maximization (dispositional rationality), but reject Gauthier's conclusion that this aligns rationality with morality."
  *   **Cost:** You lose the rhetorical punch of "Gauthier is wrong." You replace it with "Gauthier was half-right."

  ### 3. The Normative Schism: (5) vs. (1), (3), & (4)
  **Severity:** Moderate (Philosophically interesting, not logically fatal)
  **The Clash:** Rationality and Morality will prescribe opposite actions.
  *   **Commitment (5)** is **Act Consequentialism**. In the Hitchhiker case, once in the city, the moral act is *not paying* (saving the $100 produces more utility than paying it, assuming the life is already saved).
  *   **Commitment (1)** says the *rational* act is *paying*.
  *   **The Result:** You are committed to the view that in specific cases, **it is rational to do what is morally wrong, and moral to do what is irrational.**

  **What Has to Give:**
  *   **Nothing, but clarify:** This isn't a contradiction, but it is a bullet you need to bite. Your students will ask: "If morality tracks consequences and rationality tracks plans, why should I care about rationality when it costs me utility/morality?"
  *   **Cost:** You must defend the normative force of rationality independent of morality. (Standard defense: Rationality is about agency/autonomy; Morality is about value).

  ### 4. The Toxin Nuance: (2) vs. (4)
  **Severity:** Low (Resolvable)
  **The Clash:** It looks like (4) says "act on the disposition" and (2) says "don't act on the intention."
  *   **Resolution:** This is actually consistent *if* you distinguish between **Dispositions to Act** vs. **Dispositions to Intend**.
  *   In **Schelling/Threats (4)**: The disposition required is "Retaliate if provoked." To get the benefit (deterrence), you must actually retaliate if provoked. So acting on the disposition is rational.
  *   In **Toxin (2)**: The disposition required is "Be the kind of person who forms the intention." The billionaire pays on *intention*, not *action*. Once the money is secured, the disposition has done its work. Drinking serves no purpose.
  *   **The Fix:** Ensure (4) specifies that acting on the disposition is rational *only when the disposition requires action to secure the benefit*. In Toxin, the benefit is secured by the mental state, not the physical act.

  ### Summary of Fixes

  If you want to keep the spirit of the document but stop the bleeding:

  1.  **Kill (7).** It is incompatible with (1) and (3). Replace it with: *"Sunk costs are not reasons, but sunk *plans* are binding if they were ex-ante optimal."*
  2.  **Rewrite (6).** Acknowledge that you accept Gauthier's *rationality* thesis but reject his *moral* thesis.
  3.  **Own the Schism.** Add a footnote to (5) acknowledging that on this view, Rationality and Morality can diverge in one-shot coordination problems.

  **The "Vibe" Check:**
  Currently, your sheet reads like a Causal Decision Theorist (7, 5, 6) who secretly wants to be a Newcomb/Resolute Theorist (1, 2, 3, 4). The students smell the blood in the water because (7) gives them the weapon to dismantle (1). If you drop (7), the package becomes a coherent, defensible, heterodox position (Resolute Choice + Act Consequentialism). It's still controversial, but it's no longer contradictory.
