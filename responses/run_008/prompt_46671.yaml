      *   *Section 2: The Reference Class (6).* Explain why this isn't just a nuisance for Frequentism. It's fatal without a solution. If you switch to Propensity, it gets better.
      *   *Section 3: Indifference (4).* Bring up Bertrand's Paradox. Explain why "description invariance" is hard. Suggest limiting it to physical symmetries.
