      *   *Section 5: Epistemic Humility.* Where could I be wrong? (e.g., Humean Best System analysis might satisfy the user better than Propensity; or a sophisticated Frequentist account like Hájek's). What would change my mind? (A solution to the Reference Class problem that preserves Strict Frequentism).

