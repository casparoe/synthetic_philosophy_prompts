                          *   Choice 1: $q$ vs $0.10p + 0.89q + 0.01r$.
                          *   Choice 2: $0.10p + 0.90r$ vs $0.11q + 0.89r$.
                          *   This specific numerical setup is the classic Allais.
                          *   To map to Independence Axiom ($\succ$ is preserved under mixing with $r$):
