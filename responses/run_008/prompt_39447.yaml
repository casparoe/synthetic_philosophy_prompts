  You are assuming that because each loss provides a reason, those reasons combine to outweigh the single reason on the other side, but that is precisely what is at issue. I grant you that each of the five has a reason to be saved, and the one has a reason to be saved, but these reasons do not pile up into a heavier moral weight. Think of it this way: if the one person were your friend, you might save them, and no one would say you acted immorally; why? Because their claim on you is not negated by the existence of strangers. Now extend that impartiality. The loss to the one is complete in itself; there is no "super-loss" experienced by the group that makes sacrificing the one permissible. To say the four extra losses compel you to save the five is to treat the one as a mere means to minimize the total count of deaths, as if we are managing a portfolio of value rather than respecting persons. Fairness requires giving each an equal chance via a lottery, because that is the only procedure that acknowledges each person's separate moral worth without subordinating the few to the many.
