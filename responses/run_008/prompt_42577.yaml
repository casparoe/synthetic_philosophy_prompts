answer: |-
  # Specification of Adequacy Conditions for a Naturalistic Theory of Content

  ## I. The Core Purpose: Misrepresentation vs. Malfunction
  The primary deliverable of any theory in this seminar is not merely to locate content within the natural order, but to provide the resources to distinguish **misrepresentation** from **mere malfunction**. 

  *   **Malfunction:** A state fails to token when it should, or tokens due to internal breakdown (e.g., a thermometer melts). The system is offline; no assessment of truth or falsity applies.
  *   **Misrepresentation:** A state tokens in the normal mode of operation, but the world is not as the state indicates. The system is online, but wrong.

  To underwrite this distinction, a theory must specify conditions under which a physical state is *supposed* to token (normative function) independently of the conditions under which it *does* token (causal history), without appealing to non-natural properties. The following six desiderata specify the constraints any such theory must satisfy.

  ---

  ## II. The Desiderata

  ### 1. The Asymmetry Condition (The Possibility of Error)
  *   **The Requirement:** The theory must allow for a state to be tokened in the absence of its content. There must be an asymmetry between the conditions sufficient for tokening a state and the conditions necessary for that state to be veridical.
  *   **The Motivating Case:** *The Disjunction Problem.* If a neural state $R$ is caused by horses, but also occasionally by cows on dark nights, a purely causal theory suggests the content is "horse OR cow-on-a-dark-night." On this view, tokening $R$ when a cow is present is not an error; it is a true tokening of the disjunctive content. To distinguish error from mere variety, the theory must explain why $R$ means *horse* specifically, such that tokening it for a cow is a mistake, not a different truth.
  *   **Why it matters for Misrepresentation:** Without this asymmetry, "false belief" collapses into "true belief about a broader category." Malfunction becomes the only form of failure.

  ### 2. The Distality Constraint (The Object-Requirement)
  *   **The Requirement:** The theory must non-arbitrarily select the distal object of interaction as the content, rather than the proximal sensory stimulation or the intermediate causal chain.
  *   **The Motivating Case:** *The Frog's Fly.* A frog snaps at a moving dark dot. The causal chain includes: (a) the fly, (b) the light reflection, (c) the retinal stimulation, (d) the neural firing. A causal theory could claim the content is "retinal stimulation" (which is always present when the frog snaps). But the frog's behavior is adapted to catching *flies*, not stimulating retinas. If the content is proximal, the frog never misrepresents; if distal, it can miss.
  *   **Why it matters for Misrepresentation:** If content is fixed at the proximal end, the system is infallible regarding its immediate interface. Misrepresentation requires the content to outrun the immediate causal trigger.

  ### 3. The Success-Condition Alignment (The Avoidance Problem)
  *   **The Requirement:** The truth conditions of the content must align with the success conditions of the mechanism's selected function, even when that function is avoidance rather than detection.
  *   **The Motivating Case:** *The Predator Detector.* Suppose a state $A$ is selected for because it triggers avoidance of predators. However, $A$ is also triggered by harmless large shadows. If the content is "predator," tokening $A$ for a shadow is a false positive (error). If the content is "danger-to-be-avoided," tokening $A$ for a shadow is correct (the shadow is dangerous insofar as it warrants avoidance). The theory must explain why the content is "predator" (allowing for error) rather than "stimulus-warranting-avoidance" (making the system infallible).
  *   **Why it matters for Misrepresentation:** Teleological accounts risk making organisms infallible by defining content as "whatever triggers the adaptive response." We need to preserve the gap between *useful* and *true*.

  ### 4. The Novelty and Independence Constraint
  *   **The Requirement:** The theory must account for contents that have never been instantiated or causally interacted with by the subject or its lineage.
  *   **The Motivating Case:** *Unicorns and Future Tech.* A subject can entertain the thought "There is a unicorn in the garden" despite no causal history of unicorns. Similarly, we can represent novel scientific entities before detecting them. A theory that ties content strictly to actual past causal covariation cannot explain these thoughts without reducing them to descriptions composed of simpler causal concepts, which pushes the problem back.
  *   **Why it matters for Misrepresentation:** If content requires actual past instantiation, we cannot misrepresent the *novel*. We can only misrepresent the *familiar*.

  ### 5. The Synchronic Supervenience Constraint (The Swampman Challenge)
  *   **The Requirement:** Content facts must supervene on the current physical/functional structure of the system, such that a perfect physical duplicate possesses the same content regardless of history.
  *   **The Motivating Case:** *Swampman.* A lightning strike creates a molecule-for-molecule duplicate of a human in a swamp, with no evolutionary history or past causal interactions. Intuitively, Swampman has thoughts and perceptions. If a theory makes content essentially dependent on historical selection (e.g., "this state means fly because ancestors were selected for catching flies"), Swampman has no content.
  *   **Why it matters for Misrepresentation:** If Swampman lacks content, he cannot misrepresent. He is merely a causal system. If we accept the intuition that Swampman *can* be wrong, the theory cannot rely exclusively on historical etiology.

  ### 6. The Non-Circular Normativity Constraint
  *   **The Requirement:** The theory must derive the normativity of content (the "ought" of representation) from natural facts without presupposing intentional or normative notions in the base conditions.
  *   **The Motivating Case:** *The Teleology Worry.* Many theories ground content in "proper function." But "proper function" is often defined via "selected effects." Critics argue that selection explanations are descriptive (what *did* survive) unless we already assume a normative standard of "what was *supposed* to survive." If the theory explains content via function, but function is secretly normative, the naturalization is circular.
  *   **Why it matters for Misrepresentation:** Malfunction is a normative notion (the system is *failing*). If the theory cannot naturalize the "ought" of function, it cannot naturalize the "wrongness" of misrepresentation.

  ---

  ## III. Analysis of the Specification

  ### 1. Non-Negotiables vs. Camp Prejudices
  In constructing the list above, we must distinguish between conditions required for the *phenomenon* of intentionality and conditions required by specific *research programs*.

  *   **Non-Negotiable:** **The Asymmetry Condition (1)** and **The Distality Constraint (2)**. Any account that cannot distinguish error from difference, or that collapses content into proximal stimulation, fails to capture intentionality. These are constitutive of the target phenomenon.
  *   **Camp Prejudice:** **The Synchronic Supervenience Constraint (5)**. This is the major fault line between Internalists (who demand Swampman have content) and Externalists/Teleosemanticists (who are willing to say Swampman is a zombie). Demanding this constraint as a fixed adequacy condition biases the seminar against historical/teleological theories from the start. It should be treated as a *datum to be explained or explained away*, not a hard requirement.
  *   **Camp Prejudice:** **Atomistic Content.** The list implicitly assumes states bear content individually (e.g., "state $R$"). Holists argue content is determined by the role in the whole network. Demanding atomism is loyalty to a Fodorean research program, not a condition for intentionality itself.
  *   **Camp Prejudice:** **Subpersonal State-Bearers.** The desiderata assume subpersonal states (neural/functional) carry the content. Embodied cognition proponents might argue content is a property of the whole agent-environment coupling. Insisting on subpersonal bearers is a methodological prejudice.

  ### 2. Conflicting Desiderata (The Trade-Offs)
  Students should be alerted that satisfying all desiderata simultaneously may be impossible. Theories often succeed by sacrificing one constraint to satisfy another.

  *   **History vs. Duplication (Desiderata 5 vs. 1 & 6):** Strict historical/teleological accounts satisfy Error and Normativity well (by grounding function in history) but fail Swampman. Synchronic accounts satisfy Swampman but struggle to ground Normativity without history. *What gives:* Usually, the intuition about Swampman is sacrificed by teleosemanticists, who argue Swampman lacks genuine intentionality until he interacts with the world.
  *   **Determinacy vs. Naturalism (Desiderata 2 & 4 vs. 6):** To fix content determinately on the distal object (fly, not fly-retina) often requires complex relational properties. The more complex the grounding relation, the harder it is to keep it purely naturalistic without smuggling in intentional terms (e.g., "information about"). *What gives:* Often determinacy is loosened (content is indeterminate) or naturalism is stretched (information is treated as primitive).
  *   **Avoidance vs. Truth (Desideratum 3 vs. 1):** In avoidance cases, the adaptive success condition (avoid the shadow) diverges from the truth condition (no predator). A theory can align content with success (infallible system) or with truth (fallible system). *What gives:* Teleological theories often align content with success conditions, which risks making the system infallible regarding its adaptive niche, thereby weakening the Asymmetry Condition.

  ### 3. The Exclusion Condition: Where Theories Die
  While **Naturalism** is the boundary of the seminar, it is not the primary graveyard of specific theories. Many non-naturalistic theories are coherent; they are just excluded by the seminar's premise. Among naturalistic approaches, the single requirement that does the most exclusion work is:

  **The Asymmetry Condition (The Possibility of Error).**

  *   **Why:** This is the specific point where Causal Covariation theories die (the Disjunction Problem). It is also the pressure point where Teleosemantic theories fracture (the Function/Truth divergence). 
  *   **Explanation:** It is relatively easy to build a naturalistic theory that correlates states with the world. It is vanishingly difficult to build one that correlates them *normatively*. To say a state *should* token for $X$ but tokens for $Y$ requires a standard of correctness that is independent of the actual tokening. 
      *   Simple causal theories fail because actual tokening defines the content.
      *   Simple functional theories fail because actual function (what the system does) defines the content.
      *   To satisfy Asymmetry, the theory must posit a "proper" cause distinct from the "actual" cause. Grounding that "properness" naturalistically, without circularity (Desideratum 6) and without losing the distal object (Desideratum 2), is the narrowest bottleneck. 
  *   **Conclusion:** If a theory cannot explain how a system can be fully functional, operating exactly as designed, and yet *wrong*, it has not naturalized intentionality; it has naturalized causation. This is the filter through which all proponents must pass.
