  # JOINT STATEMENT ON THE ONTOLOGY OF DREAMING
  **Concluding an Adversarial Collaboration (2021–2024)**

  **Signatories:**
  *   **Dr. Elena Corvo** (Representing the Conceptual-Analytic Tradition, akin to Norman Malcolm)
  *   **Dr. Marcus Thorne** (Representing the Naturalist-Functionalist Tradition, akin to Daniel Dennett)

  ---

  ### I. AGREED CLAIMS

  After three years of dialectical exchange and review of the relevant literature in philosophy of mind and sleep science, the undersigned agree upon the following propositions:

  1.  **Physiology of Sleep:** We accept the standard neurophysiological model of sleep. Specifically, we agree that Rapid Eye Movement (REM) sleep occurs in cyclical patterns throughout the night, characterized by high-frequency brain activity, metabolic rates comparable to waking, and paralysis of major skeletal muscles (atonia).
  2.  **Unreliability of Reports:** We agree that dream reports collected upon awakening are systematically unreliable. They are subject to decay, confabulation, and narrative smoothing. External stimuli presented during sleep are frequently incorporated into the dream narrative, often anachronistically.
  3.  **Lucid Signaling:** We acknowledge the laboratory finding that subjects identified as "lucid dreamers" can execute pre-agreed motor signals (specifically, distinctive left-right eye movement patterns) detectable via electrooculogram (EOG) during confirmed REM sleep.
  4.  **Scope of Disagreement:** We agree that our dispute is **not** about:
      *   Whether dreams matter ethically or psychologically (both agree they do).
      *   Whether dream reports possess narrative structure (both agree they do).
      *   Whether the brain is active during sleep (both agree it is).

  ---

  ### II. RESIDUAL DISAGREEMENTS

  The following table isolates the precise points of divergence. Each formulation is phrased such that the respective proponent accepts it as an accurate statement of their position.

  | Topic | Formulation A (Corvo / Malcolmian) | Formulation B (Thorne / Dennettian) |
  | :--- | :--- | :--- |
  | **The Ontological Status of "The Dream"** | "The dream" is not a temporally extended episode of consciousness occurring during sleep. It is a logical construct defined by the criteria for making a dream report upon waking. | "The dream" refers to a stream of conscious content generated by neural processes during sleep, even if the specific narrative is revised upon awakening. |
  | **Truth Conditions of "I Dreamt X"** | The statement "I dreamt X" is an **avowal**. Its truth condition is the sincere utterance of the report under appropriate waking conditions. It does not require a corresponding past event. | The statement "I dreamt X" is a **memory claim**. Its truth condition requires that a corresponding conscious experience occurred during sleep, even if the content "X" is partially confabulated. |
  | **The Nature of the "Gap"** | There is no gap between the dream and the report because there was no independent dream event to be separated from the report. | There is a gap between the experience and the report. The report is a "user illusion" or "draft" constructed at awakening based on fragmentary traces of the sleep experience. |

  ---

  ### III. CRUXES AND EMPIRICAL TESTS

  We identify two specific cruxes where our philosophical commitments yield divergent expectations regarding empirical data.

  #### Crux 1: The Interpretation of Lucid Signaling
  **The Issue:** Does the ability of a lucid dreamer to signal via eye movements demonstrate that a *subject of experience* is present during sleep, or merely that a sleeping brain can execute a motor program associated with the *concept* of signaling?

  *   **Corvo's View:** The signaling is a complex motor reflex triggered by the physiological state of REM, analogous to sleepwalking. It does not imply a unified "self" experiencing the moment.
  *   **Thorne's View:** The signaling implies real-time voluntary agency and conscious awareness, as the signal is contingent on the subject's decision to communicate *now*.

  **Agreed Test:** Lucid dreamers are asked to perform a novel cognitive task during lucidity (e.g., counting to ten and signaling every five seconds via eye movements).
  *   **Thorne's Prediction:** The timing of the signals will correspond accurately to real-time seconds (within a margin of error comparable to waking estimation).
  *   **Corvo's Prediction:** The signals may occur, but their timing will not correlate with real-time cognitive processing. If they do correlate, it is due to a pre-sleep priming mechanism, not real-time counting.
  *   **Stakes:** If signals correlate perfectly with real-time counting, Corvo acknowledges this pressures the "no experience" view but maintains that "counting" during sleep is a different logical category than "counting" while awake.

  #### Crux 2: Temporal Isomorphism (The REM Awakening Protocol)
  **The Issue:** Does the reported duration of a dream correspond to the time elapsed in the sleep stage, or is duration a feature of the waking narration?

  **Agreed Test Protocol:**
  1.  Subjects are monitored via EEG/EOG.
  2.  Subjects are awakened at randomly chosen intervals ($t=1$ min, $t=5$ min, $t=15$ min) after the onset of a REM episode.
  3.  Subjects must immediately narrate the dream.
  4.  We measure the correlation between **Time Elapsed in REM** ($T_{sleep}$) and **Reported Dream Duration** ($T_{report}$).

  **Predictions:**
  *   **Thorne (Dennettian):** Predicts a strong positive correlation ($T_{sleep} \approx T_{report}$). If woken after 5 minutes, the dream content will reflect roughly 5 minutes of narrative events. This supports the view that consciousness unfolds in time during sleep.
  *   **Corvo (Malcolmian):** Predicts **no correlation**. The length of the narrative is determined by the impulse to narrate upon waking, not by a prior temporal experience. A subject woken after 1 minute may report a "long dream" because the *concept* of a dream allows for time compression, or simply because they feel like telling a long story.
  *   **Immunizing Move Clause:** Corvo notes that if a correlation is found, she will argue that the brain constructs a narrative of length $T$ based on a physiological cue indicating duration $T$, without actual experience occurring. She acknowledges that if this move is adopted, the dispute becomes purely verbal regarding the definition of "experience," leaving no empirical stake for her position other than the grammatical rule that "experience" requires waking verification.

  ---

  ### IV. MATTERS OF INTERPRETATION

  #### 1. On New Evidence and Historical Views
  *Jointly Agreed Statement:*
  "The lucid dreaming experiments cited above postdate the original philosophical exchanges between Malcolm and Wittgenstein. We agree that a philosophical view rooted in conceptual analysis cannot be simply 'falsified' by empirical data in the same way a scientific hypothesis can. However, we also agree that conceptual analysis must remain responsive to the world. If empirical evidence demonstrates that the conditions for the application of a concept (e.g., 'voluntary action' or 'conscious counting') are met during sleep, the philosopher is obligated to either revise the conceptual boundary or explicitly argue why the empirical facts do not satisfy the logical criteria. We reject the strategy of insulating philosophical claims from all empirical revision."

  #### 2. Final Verdict: Substantive vs. Verbal Dispute
  *Collaborators' Verdict:*
  "We conclude that our collaboration has successfully isolated the kernel of our disagreement. We agree that the dispute is **substantive** regarding the causal mechanisms of sleep cognition and the reliability of first-person authority. We agree that the dispute is **verbal** regarding the application of the word 'experience' to states that lack waking behavioral verification. However, we disagree on where the verbal ends and the substantive begins."

  **Signed separately:**

  > **Dr. Elena Corvo:** "I maintain that the substantive core is entirely on Thorne's side: he is making a causal claim about the brain which is testable. My side is making a grammatical claim about the concept of 'dreaming.' Therefore, the dispute is 80% verbal. Thorne is arguing about neuroscience; I am arguing about language. If he proves the brain simulates time, he has not proved I 'experienced' it, only that the mechanism for reporting time was active."
  >
  > **Dr. Marcus Thorne:** "I maintain that the dispute is 80% substantive. Corvo's 'grammatical claim' implicitly denies the existence of a functional state that behaves exactly like consciousness in every measurable way except for post-hoc reporting. To call this merely 'verbal' is to ignore the functional reality of the state. If the brain does everything a conscious brain does, calling it 'unconscious' is not a linguistic preference; it is a theoretical error."

  ***

