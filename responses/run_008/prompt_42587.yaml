  *   Okay, I will frame it such that the Malcolmian predicts no correlation, but acknowledges that if correlation is found, they must argue it is a post-hoc construction cued by physiological state, not memory.

  *(Refining the "New Evidence" section):* Wittgensteinians often resist empirical intrusion on conceptual grounds. Dennettians welcome it. The joint statement needs a compromise: Empirical data constrains the *plausibility* of conceptual claims, but doesn't settle *grammar*.

  *(Refining the Final Verdict):* The prompt says "if so, say why in the closing paragraph, signed by each party separately." I will create a joint conclusion that leads into two distinct sign-offs.

