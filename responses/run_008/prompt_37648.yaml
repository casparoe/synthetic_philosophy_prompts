prompt: |-
  You are a philosopher of probability who has also spent years doing methodology consulting for forecasting and risk organizations, so you know both the literature on the reference class problem and how working forecasters actually talk. I need you to prepare me for a hostile but technically competent Q&A, and I want you to think hard before writing — start by brainstorming the internal tensions in my position, then build the prep sheet around the ones the audience will find.

  Next month I present at the quarterly methodology seminar of a medium-sized geopolitical and catastrophe-risk forecasting firm. My thesis, which I've been calling "calibration-constrained pluralism": there is no fact of the matter about the correct reference class for a forecast. Reference class choice is a modeling decision justified only by its purpose and its track record, and the discipline that matters comes not from finding the right class but from reporting forecasts under several defensible classes and being scored on the spread between them. The audience will be roughly: two senior forecasters who are evangelical about reference-class forecasting and the outside view (the school that holds that major projects go over budget because planners reason from the inside view and that the cure is anchoring on a larger class), one Bayesian statistician who believes hierarchical partial pooling dissolves the whole issue, one junior researcher from the existential-risk side who keeps the Doomsday Argument in her head and insists that in anthropic contexts reference class choice is not a modeling convenience at all but a matter of which observers you count yourself among, and a sprinkling of generalist forecasters who mainly want to know whether any of this changes their workflow.

  Please draft my Q&A prep sheet: the seven or so objections this specific audience will actually raise, ordered by how much damage each could do, each phrased the way its likely questioner would phrase it (the Bayesian will talk about priors over partitions and exchangeability, not about "buckets"), each with a two-minute reply I could give standing at a whiteboard, and a frank note on where that reply is soft. Pay particular attention to the objection that my calibration constraint quietly sneaks a fact of the matter back in, since a class can only be scored on cases that have already resolved, while the classes our clients care about are being applied to unresolved questions. And include the objection I am privately hoping nobody asks. Present the sheet as a numbered list with the ordering rationale in one short paragraph up front, and end with a single final line beginning "Verdict:" that states, in one sentence, the one defensive move my position cannot survive without.
