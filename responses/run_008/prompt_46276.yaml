answer: |-
  **Dissertation Prospectus**

  **Title:** The Arithmetic of Peace: Normalization, Normativity, and the Fact of Violence Decline

  **1. Statement of the Research Question**

  The central empirical claim of modern peace studies is that the world has become less violent over time. This claim is typically operationalized as a reduction in the rate of violent death per capita. However, any rate is a function of a numerator (violent events) and a denominator (the unit of normalization). This dissertation asks: **Is the choice of denominator in violence metrics a neutral methodological decision, or is it an irreducibly normative judgment?**

  If the choice is normative, a secondary metaphysical question arises: **Does the proposition "the world has become less violent" retain a objective truth value, or does the debate dissolve into a verbal dispute regarding the definition of "violence" and "progress"?**

  The project seeks to determine whether a principled, non-arbitrary framework exists for selecting among competing normalizations (e.g., per capita, per life-year, per social contact, per unit of coercive capability) and, failing that, to map the ethical commitments implicit in each choice.

  **2. Background and Existing Positions**

  The current literature is polarized between two camps, both of which treat their chosen metrics as transparent windows onto reality rather than constructed models.

  *Proponents of the Decline Thesis* argue that the risk of an individual dying violently has diminished significantly over centuries. They rely almost exclusively on population-normalized death rates. Their argument rests on the intuition that the moral significance of violence is tied to the risk faced by a representative agent. They acknowledge absolute numbers may rise but dismiss them as artifacts of population growth. Their implicit normative claim is that individual risk is the primary metric of moral progress.

  *Critics of the Decline Thesis* argue that this framing obscures the totality of suffering. They often point to absolute death counts in the 20th century or expand the numerator to include "structural violence" (deaths from deprivation that could be prevented). Their implicit normative claim is that the total volume of suffering or the preventability of death is the primary metric of moral progress.

  *The Gap:* Neither side adequately defends *why* their denominator is the correct one. Declinists assume population is the natural baseline; critics assume total magnitude or structural capacity is the baseline. Neither addresses alternative normalizations, such as "violence per hour of life" (which accounts for increased longevity) or "violence per potential encounter" (which accounts for urbanization and density). Consequently, the debate stalls because empirical rebuttals are actually disguised normative disagreements about what constitutes a "fair" comparison across time.

  **3. Methodology and Work Plan (18 Months)**

  This project is conceptual and meta-empirical. It does not seek to generate new historical datasets but to analyze the implications of existing data under different normalization frameworks. The work is divided into three phases: Conceptual Framework, Feasibility and Reconstruction, and Synthesis.

  **Phase 1: Conceptual Framework (Months 1–4)**
  *   **Month 1:** Comprehensive mapping of the "violence decline" debate. Catalog every instance where a rate or ratio is used to make a temporal comparison.
  *   **Month 2:** Taxonomy of Denominators. Formally define the competing normalizations:
      *   *D1 (Standard):* Deaths per capita.
      *   *D2 (Temporal):* Deaths per person-year lived (adjusting for longevity).
      *   *D3 (Interactional):* Deaths per potential violent encounter (adjusting for population density/urbanization).
      *   *D4 (Capability):* Deaths per unit of state coercive capacity (adjusting for the "cost" of restraint).
  *   **Month 3:** Normative Analysis. For each denominator, articulate the ethical theory required to justify it. (e.g., D1 implies contractualism; D2 implies utilitarianism focused on life-time welfare; D3 implies a focus on social trust).
  *   **Month 4:** Drafting Chapter 1 (Introduction) and Chapter 2 (The Taxonomy of Normalization).

  **Phase 2: Feasibility and Historical Reconstruction (Months 5–11)**
  *   **Challenge:** Pre-1800 data for denominators like "person-hours" or "social contacts" does not exist in standard datasets.
  *   **Strategy:** I will not attempt to create new datasets. Instead, I will use historical demography and urbanization estimates to construct *bounds* and *proxies*. The goal is not precision, but to determine if the *order of magnitude* changes enough to flip the verdict on violence decline.
  *   **Month 5–6:** Select three historical comparison points (e.g., Medieval Europe vs. Early Modern vs. Contemporary). Gather existing estimates for population, life expectancy, and urbanization rates for these periods from secondary historical literature.
  *   **Month 7:** Construct the "Longevity Adjustment." Calculate violent death rates per 100,000 life-years rather than per 100,000 people. *Hypothesis:* If life expectancy doubles, a constant per-capita rate implies a halving of the per-life-year rate.
  *   **Month 8:** Construct the "Density Adjustment." Use urbanization rates as a proxy for "stranger contact." Estimate the change in interaction frequency between a medieval villager and a modern urbanite.
  *   **Month 9:** Construct the "Capability Adjustment." Qualitative assessment of state surveillance and weapon precision. This will be a theoretical weighting rather than a quantitative metric, assessing the "opportunity cost" of non-violence for the state.
  *   **Month 10:** Sensitivity Analysis. Determine how much the historical estimates would need to be wrong to reverse the trend. If the trend holds across all denominators, the dispute is empirical. If it flips, the dispute is normative.
  *   **Month 11:** Drafting Chapter 3 (The Empirical Test) and Chapter 4 (The Limits of Historical Data).

  **Phase 3: Synthesis and Metaphysical Implications (Months 12–18)**
  *   **Month 12–14:** Address the "Fact of the Matter" question. Apply frameworks from metaethics and the philosophy of language (e.g., Carnapian verbal disputes, conceptual engineering) to the results of Phase 2. If the verdict depends on the denominator, is "violence decline" a vague predicate?
  *   **Month 15:** Drafting Chapter 5 (Normativity and Truth).
  *   **Month 16:** Revision and integration of chapters.
  *   **Month 17:** Circulation to committee members for feedback.
  *   **Month 18:** Final polishing and defense preparation.

  **4. Possible Conclusions and Decision Criteria**

  The dissertation will likely arrive at one of three conclusions, decided by the results of the Sensitivity Analysis (Month 10):

  *   **Conclusion A (Robust Decline):** All reasonable denominators show a decline in violence.
      *   *Implication:* The debate is indeed empirical, and critics are relying on misleading metrics. The choice of denominator is not normatively loaded because they all converge.
  *   **Conclusion B (Normative Divergence):** Some denominators show decline (e.g., per capita), while others show stasis or increase (e.g., per total life-years or absolute suffering).
      *   *Implication:* The choice of denominator is irreducibly evaluative. To ask "Is violence declining?" is to ask "Which moral metric matters?"
  *   **Conclusion C (Verbal Dispute):** The divergence is so fundamental that the term "violence" lacks a stable referent across time without a stipulated denominator.
      *   *Implication:* There is no fact of the matter. The dispute is verbal. Progress requires "conceptual engineering" to specify which denominator we *ought* to care about for policy purposes.

  *Decision Criteria:* I will favor Conclusion B or C if the "Longevity Adjustment" (D2) significantly reduces the magnitude of the decline, or if the "Density Adjustment" (D3) suggests that social trust has not improved commensurate with lower death rates. If the trends diverge, I will argue there is no single fact of the matter.

  **5. Risk Management and Failure Conditions**

  Given the 18-month timeline, the following conditions would constitute project failure or necessitate scaling down:

  *   **Data Impossibility (High Risk):** If historical proxies for urbanization or interaction rates (Phase 2, Months 7–8) prove too speculative to support even rough bounds, the empirical chapter cannot stand.
      *   *Scale Down:* I will pivot to a purely conceptual analysis. Instead of historical reconstruction, I will use thought experiments and modern data (1950–2020) where denominators are measurable, arguing that the *logical* problem applies even if the historical application is uncertain.
  *   **Conceptual Collapse (Medium Risk):** If it turns out that "per capita" and "per life-year" are mathematically equivalent in terms of trend direction (i.e., longevity increases linearly while violence decreases exponentially), the normative stakes are lowered.
      *   *Scale Down:* I will focus exclusively on the "Capability" and "Structural" denominators, which are more likely to diverge from the standard model.
  *   **Scope Creep (Medium Risk):** Attempting to define "structural violence" too broadly could turn this into a general treatise on poverty rather than a specific analysis of normalization.
      *   *Mitigation:* I will strictly limit the numerator to physical harm and death. The intervention is solely on the *denominator*. Expanding the numerator is a different project.
  *   **Time Overrun:** If Phase 2 takes longer than 7 months, the writing phase will be compromised.
      *   *Mitigation:* At Month 11, regardless of data completeness, I will freeze the empirical analysis and proceed to synthesis. The dissertation is in political philosophy, not cliometrics; the argument rests on the *implication* of the data, not the precision of the data points.

  **6. Significance**

  This project intervenes in one of the most public-facing debates in social science. By demonstrating that the "violence decline" thesis rests on hidden normative choices, it clarifies what is actually at stake. It moves the conversation from "Are the numbers right?" to "What do we value in peace?" This shifts the burden from historians to moral philosophers, providing a more stable foundation for policy and ethical judgment.
