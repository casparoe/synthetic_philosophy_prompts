answer: |-
  Here is the breakdown of how your friend would likely rule on the new cases, followed by an analysis of the ethical framework she's actually using, where it fractures, and how to test it.

  ### Part 1: Predictions on the New Cases

  Based on her track record, here is how she will likely call the four new scenarios:

  **(a) The HIV Lie (Undetectable, protection used, lied about status)**
  *   **Her Call:** **Invalid.**
  *   **Why:** This aligns with her **Stealthing** ruling. Even though the statistical risk was low (undetectable + condoms), the *agreement* was based on false health information. Like the condom removal, this changes the "terms of service" of the physical act. She prioritizes bodily autonomy and informed risk over the outcome. If the risk profile is lied about, the consent is void.

  **(b) The Boss Offer (Promotion for sex, no threat to job)**
  *   **Her Call:** **Valid.**
  *   **Why:** This is a direct mirror of her **Italy Trip** ruling. Her rule on coercion is specific: "Saying no doesn't cost you anything you already had." Since the hypothetical guarantees the job is safe if they decline, this is an *inducement* (new benefit), not *coercion* (threat to baseline). She separates ethical sliminess (HR violation) from consent validity.

  **(c) The Expensive Dates (Felt obligation, no explicit deal)**
  *   **Her Call:** **Invalid.**
  *   **Why:** This is the tension point between her **Italy Trip** and **Breakup Threat** rulings. However, given her **Marital Status** ruling (emotional context matters), she likely views "feeling like you owe" as a compromised baseline. Even without an explicit threat, the social pressure creates a cost to saying no (awkwardness, guilt, perceived loss of relationship harmony). She seems to protect "freedom from pressure" more than "freedom to trade."

  **(d) The Dementia Aunt (Understands in moment, no memory after)**
  *   **Her Call:** **Valid.**
  *   **Why:** This pits her **Blackout Drunk** ruling against her **Intellectual Disability** ruling. The deciding factor is *capacity in the moment*. Blackout drunk usually implies impaired judgment *during* the act, not just memory loss after. Since the aunt "understands what's happening in the moment," she fits the ID Cousin precedent (capacity is about understanding, not diagnosis or memory retention).

  ---

  ### Part 2: The Reconstructed Rules (Her "Operating System")

  Your friend isn't running one rule; she's running three distinct pillars that usually work together but clash in edge cases.

  **Rule 1: The Baseline Protection (Coercion vs. Inducement)**
  *   *The Logic:* You cannot threaten to remove what someone already possesses (relationship, job, safety). You *can* offer new benefits.
  *   *Evidence:* Breakup Threat (Invalid) vs. Italy Trip (Valid).
  *   *The Nuance:* She interprets "Baseline" broadly. It's not just physical safety; it includes emotional security (hence the "Expensive Dates" prediction).

  **Rule 2: Contemporaneous Capacity**
  *   *The Logic:* Consent requires the cognitive ability to understand the act *while it is happening*. Memory of the act afterward is irrelevant.
  *   *Evidence:* Blackout Drunk (Invalid due to incapacity *during*) vs. ID Cousin (Valid due to understanding *during*) vs. Dementia Aunt (Predicted Valid due to understanding *during*).

  **Rule 3: Material Fraud**
  *   *The Logic:* Lies invalidate consent *if* they concern "material" facts (health, relationship status, conditions of the act). Lies about "attributes" (wealth, job title) do not.
  *   *Evidence:* Stealthing (Invalid), Marriage Lie (Invalid) vs. Job/Income Lie (Valid).

  ---

  ### Part 3: Where The Rules Come Apart (The Friction Points)

  There are two major fracture points in her logic that you need to be aware of.

  **1. The "Materiality" Problem (Marriage vs. Job)**
  This is the biggest inconsistency. Why is lying about being married **Invalid**, but lying about a job title **Valid**? Both are lies used to induce sex.
  *   *Her likely justification:* Marriage is a "fundamental relationship term" (like the condom); a job title is "social vanity."
  *   *The Flaw:* This is subjective. For some people, financial stability is a harder dealbreaker than marital status. Her rule relies on a societal hierarchy of "what matters" rather than individual autonomy.

  **2. The "Implicit Pressure" Problem (Italy vs. Dates)**
  Her **Italy Trip** ruling suggests transactions are fine. Her **Breakup** ruling suggests threats are not. But the **Expensive Dates** case lives in the gray zone: *Implicit Social Debt.*
  *   If she rules Dates as **Invalid**, she believes consent requires freedom from *internal* pressure (guilt/owe-ness).
  *   If she rules Dates as **Valid**, she believes consent only requires freedom from *external* threats.
  *   *Prediction:* Based on the Marriage Lie ruling, she leans toward protecting against internal/emotional pressure, which makes the Italy Trip ruling the outlier (or she views the Italy Trip as a "clean" business deal, whereas dates are "emotional" currency).

  ---

  ### Part 4: The Inconsistency Flag

  **The Marital Status Lie vs. The Job Title Lie.**
  This is the one that doesn't fit a tidy rule.
  *   **Inconsistency:** If the rule is "Fraud regarding identity invalidates consent," both should be invalid. If the rule is "Fraud regarding risk invalidates consent," both should be valid (neither poses physical risk).
  *   **Why it matters:** It suggests her framework relies on **Traditional Norms** rather than pure **Autonomy**. She implicitly agrees that marriage is "serious" and income is "superficial." This is a cultural judgment, not a logical consent principle. If she meets someone who *only* cares about income and doesn't care about marriage, her rule fails them.

  ---

  ### Part 5: The Tie-Breaker Hypothetical

  To figure out which rule she is *really* running (specifically to test the **Material Fraud** vs. **Emotional Context** conflict), throw this at her:

  **The "Fake Love" Hypothetical:**
  > "A guy tells a girl 'I love you' to get her to sleep with him. He doesn't mean it, he just says it in the heat of the moment. She says yes because she wants to be with someone who loves her. He ghosts her the next day."

  **Why this tests her framework:**
  *   **If she says INVALID:** She aligns with the **Marriage Lie**. She believes emotional context/relationship status is "material" to consent. This confirms she prioritizes emotional safety over transactional freedom.
  *   **If she says VALID:** She aligns with the **Job Title Lie**. She believes feelings are "attributes" like income, and lying about them is slimy but doesn't void consent. This confirms she prioritizes a stricter, physicalist definition of fraud.

  **Secondary Test (for the Coercion Rule):**
  > "A guy says, 'If you don't sleep with me, I won't be able to respect you anymore.'"

  *   **If INVALID:** She views emotional manipulation as a **Threat** (Baseline Protection).
  *   **If VALID:** She views it as **Persuasion** (Italy Trip logic).

  **Recommendation:** Start with the **"Fake Love"** case. It directly attacks the wobbly bridge between her Marriage and Job rulings and will force her to define what counts as a "lie that matters."
