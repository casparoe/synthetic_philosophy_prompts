      *Wait, one more thought:* **The "End of Oil" / Peak Oil predictions.** This is perfect. It involves trends (consumption), laws (geology vs. economics), predictions (we will run out), and feedback (price rises -> innovation -> reserves increase). It's technical enough to be neutral but social enough to matter.
      *Decision:* **Peak Oil / Energy Transition.** It captures "long-range prophecy," "trends vs laws," and "feedback" (price signals change behavior). It avoids the "Marx/Revolution" heat.

      *Wait, is Peak Oil too dated?* Maybe. Let's go with **Housing.** It's universally understood. I will specify *how* to use it to avoid politics.

      *Actually, looking at the "Oedipus Effect" requirement:* Housing is good for trends, but **Election Polling** is the classic Oedipus example. But the prompt says "no politically charged."
