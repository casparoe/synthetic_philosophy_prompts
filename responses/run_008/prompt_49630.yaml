      *   *Refining the "De-idealization" point:* I need to make sure I connect this to *parameterization*. In climate models, sub-grid processes are parameterized. If you increase resolution, you don't just "turn off" the parameterization; you often break the model because the parameters were tuned to the coarse grid. This is a specific kind of idealization failure that philosophers miss. This is the user's "killer app."

      *   *Refining the "Pluralism" point:* Connect to "ensemble modeling." It's not just having different models; it's that the *variation* is the signal.

      *   *Refining the "Explanation" point:* Distinguish between "how-possibly" and "how-actually." Fluid dyn often deals with "how-possibly" (stability analysis) which is explanatory even if the specific instability never happens exactly that way.

  7.  **Final Review against User Constraints:**
