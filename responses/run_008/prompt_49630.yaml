  8.  **Self-Correction during drafting:** I initially thought about suggesting they read Cartwright. I should mention her, but emphasize that the user can *improve* on her using fluid dyn examples. I need to make sure I don't sound like I'm dismissing philosophy; the goal is to show where the *gap* is. The gap is in the *mathematical mechanics* of idealization, not just the epistemology.

      *Key Insight:* The user shouldn't write *philosophy of physics*. They should write *philosophy of modeling* using physics as the primary evidence. The distinction matters.

      *Final check on the "F-twist":* Make sure to clarify that Friedman wasn't just wrong; he was asking the wrong question. The question isn't "are assumptions real?" it's "what work do assumptions do?"

      *(Self-Correction)*: Wait, the user asked to be told early about the case study question. I should put that near the top, not bury it at the end.

