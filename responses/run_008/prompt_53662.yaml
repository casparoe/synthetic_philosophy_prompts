answer: |-
  Here is a reconstruction of the implicit theory of competence presupposed by current voting laws, an analysis of the inconsistencies you flagged, and a sketch of what a genuine competence-based franchise would require.

  ### 1. The Implicit Theory: Administrative Presumptivism

  The current arrangement does not presuppose a theory of *epistemic competence* (knowing politics) or even a strict theory of *cognitive capacity* (ability to reason). Instead, it operates on a theory of **Status-Based Presumptive Capacity**.

  This theory rests on three pillars that explain the features you identified:

  1.  **The Proxy Principle:** The law treats age as a defeasible proxy for moral and cognitive maturity. It assumes that while individual 17-year-olds may be more competent than individual 18-year-olds, the *cost* of measuring individual competence outweighs the *error cost* of the age line. The theory presupposes that competence is correlated enough with age to make a bright line administratively viable.
  2.  **The Liberty Default:** In liberal legal theory, the burden of proof is always on the state to restrict liberty. Voting is codified as a fundamental right (in most democratic theory), not a privilege. Therefore, the default position is inclusion. Competence is presumed until the state undertakes a specific, high-bar legal process (like guardianship proceedings) to rebut that presumption.
  3.  **The Continuity Assumption:** Once the status of "adult" is conferred, it is presumed stable. The law assumes that cognitive decline is either rare enough, hard enough to detect without intrusive surveillance, or politically dangerous enough to police that it is better to tolerate some incompetent voting than to create a mechanism for revocation.

  **Is this coherent?**
  Yes, but not as an epistemic theory. It is coherent as a **risk-management theory**. The system is designed to minimize two specific risks:
  *   **Risk A:** The tyranny of an unqualified elite (avoided by banning tests).
  *   **Risk B:** The manipulation of the vulnerable or the casting of ballots by those with no agency (mitigated by age limits and guardianship rules).

  It prioritizes avoiding Risk A over Risk B. The "messy compromise" you suspect is real, but it is a *principled* compromise. It chooses false positives (allowing some incompetent people to vote) over false negatives (blocking competent people from voting), because historically, false negatives have been the tool of oppression (e.g., literacy tests in the Jim Crow South).

  ### 2. Addressing the Apparent Inconsistencies

  You asked why the system looks inconsistent regarding driving tests, guardianship, and dementia. Under the theory of **Administrative Presumptivism**, these are not contradictions; they are features of different legal categories.

  **A. Voting vs. Driving (Right vs. Privilege)**
  *   **The Inconsistency:** We test drivers but not voters.
  *   **The Reconstruction:** Driving is a *privilege* that grants the license to operate heavy machinery, imposing direct, immediate physical risk on others. Voting is a *right* of self-governance, imposing diffuse, collective political risk.
  *   **The Theory's Logic:** The state has a "compelling interest" in preventing unskilled driving because the harm is direct and physical. The state has a much higher bar to restrict voting because the harm of a "bad vote" is abstract and shared by everyone, including the voter. Furthermore, testing drivers filters for *skill*; testing voters would inevitably filter for *ideology* or *socioeconomic status*, which violates the equality premise of the franchise.

  **B. Guardianship vs. Dementia (Procedural vs. Substantive)**
  *   **The Inconsistency:** A person under guardianship loses the vote; a person with advanced dementia but no guardianship keeps it.
  *   **The Reconstruction:** This is the strongest evidence that the system is **procedural, not substantive**. The law does not care about the *medical reality* of your brain; it cares about your *legal status*.
  *   **The Theory's Logic:** To remove a right, the state requires due process. A medical diagnosis of dementia is a medical fact, but it is not a legal adjudication. A guardianship order is a judicial finding that the person lacks legal personhood in certain domains. The system presupposes that **legal capacity is binary and status-based**. If a judge hasn't stripped you of your status, you retain the presumption of capacity, even if the medical reality contradicts it. This is not an oversight; it is a safeguard against families or institutions quietly disenfranchising the elderly without judicial oversight.

  ### 3. Required vs. Comfortable vs. Underdetermined

  To help with your seminar notes, here is the breakdown of what the current system strictly necessitates versus what is merely contingent.

  **Strictly Required by the Theory:**
  *   **A Bright Line for Entry:** There must be a point where the presumption of capacity flips from "no" to "yes" without individual assessment. (Otherwise, you need a test for every child).
  *   **The Burden of Proof on Exclusion:** The state must prove incompetence; the citizen does not have to prove competence.
  *   **Immunity from Routine Re-evaluation:** Once the right is granted, it cannot be subject to periodic review without a specific trigger (like a court petition).

  **Merely Comfortable (Contingent):**
  *   **Age 18:** The theory works equally well with 16 (Austria/Scotland) or 21. The specific number is cultural, not philosophical.
  *   **Guardianship as the Trigger:** We could use medical certification boards instead of courts. The system only requires *some* high-bar due process, not specifically probate court.
  *   **Life Tenure:** We could theoretically have an expiration date (e.g., re-register every 10 years), provided the re-registration is administrative and not a competence test.

  **Genuinely Underdetermined:**
  *   **The "Zone of Twilight":** The system has no coherent theory for the 16–18 range (hence the variation) or for early-stage cognitive decline. It creates a cliff-edge where you are fully competent at 17 years, 364 days, and fully competent at 18, but the law treats the day before as incapacity and the day after as capacity. This is admitted administrative arbitrariness.
  *   **Felon Disenfranchisement:** This sits uncomfortably with the theory. If voting is a right of personhood, losing it due to conduct implies it's a privilege. If it's a privilege, why no competence test? This is the biggest theoretical hole in the arrangement.

  ### 4. The Competence-Based Counterfactual

  If a country decided to replace **Administrative Presumptivism** with a **Real Competence-Based Franchise** (Epistocracy), the election law would need to change concretely in the following ways. This illustrates just how radical the shift would be.

  **1. The Burden of Proof Flips**
  *   *Current:* You are on the roll unless removed.
  *   *New:* You are **not** on the roll unless you certify. The citizen bears the cost and burden of proving eligibility.

  **2. Establishment of a Qualifying Examination**
  *   Law would need to define "competence." This usually means one of two things:
      *   *Knowledge-Based:* A civics test (like naturalization).
      *   *Reasoning-Based:* A test of logical consistency or basic political literacy (e.g., understanding what a bill does).
  *   *Consequence:* A new federal or state bureaucracy (e.g., "Board of Voter Qualifications") would need to be created to write, secure, and grade these tests.

  **3. Periodic Recertification**
  *   To address the dementia/continuity issue, the license to vote would need an expiration date.
  *   *Consequence:* Voters would need to renew their franchise every 5 or 10 years. This creates a "voter roll churn" that currently doesn't exist.

  **4. Appeals and Remediation**
  *   Due process would require that if you fail the test, you have a right to appeal or a period of remediation (study time) before retaking it.
  *   *Consequence:* Election cycles would be decoupled from voting eligibility. You might be eligible in January but fail your recertification in June, losing the right to vote in November.

  **5. The "Guardianship" Expansion**
  *   Currently, only those under legal guardianship lose the vote. In a competence system, *anyone* failing the test loses the vote.
  *   *Consequence:* This would likely disenfranchise a significant portion of the elderly and the poor (correlated with lower test performance), requiring strict anti-discrimination safeguards to avoid violating Equal Protection clauses.

  ### Summary for Your Seminar

  The current system does not presuppose that everyone is actually competent. It presupposes that **administrative inclusion is morally safer than administrative exclusion.**

  The inconsistencies you see (driving tests, dementia gaps) arise because the system is trying to maximize participation while using the minimum necessary filters to prevent obvious abuses (like children voting or legally incapacitated persons being used as puppets). It is a **pragmatic liberal compromise**, not a coherent epistemic theory.

  If you move to a competence-based system, you are no longer managing risk; you are grading merit. That requires a complete inversion of the legal burden of proof, a new bureaucracy to administer the "merit," and a tolerance for excluding citizens that is currently anathema to democratic theory. The current "mess" is the price we pay to keep the franchise universal.
