answer: |-
  # The Consciousness Diagnostic Tree

  **Starting Point:** We begin by granting that a distinction exists between *conscious processing* and *unconscious processing*. (For example, we accept "blindsight" cases where a patient can point to an object they insist they cannot see).

  ---

  ### Node 1: The Sperling Case (Phenomenal Richness)
  **The Case:** Subjects are flashed a grid of 12 letters for a fraction of a second. Immediately after, they hear a tone telling them which row to report. They can report the cued row perfectly. However, if asked what they saw *before* the tone, they insist they saw all 12 letters clearly for a fleeting moment, even though they can only write down 4.

  **The Question:** In that fleeting moment before the tone, did you *phenomenally experience* all 12 letters, even though you could not report or use all of them?

  *   **YES (Experience outruns Report):** Go to **Node 2A**.
  *   **NO (Report exhausts Experience):** Go to **Node 2B**.

  ---

  ### Node 2A: The Higher-Order Check (For "YES" at Node 1)
  **The Case:** Imagine a creature (or a human infant) that sees a red apple vividly. It reaches for the apple and eats it. However, this creature lacks the concept of "seeing" or "thinking." It cannot form the thought *"I am seeing red."*

  **The Question:** Does this creature have a conscious experience of the redness, or does consciousness require the ability to think about your own mental states?

  *   **YES (Consciousness requires thinking about the state):** → **UNNAMED LEAF A**.
      *   *Why nobody sits here:* This position is generally considered incoherent. If you answered **YES** at Node 1, you claimed there is rich experience *without* access/report. If you answer **YES** here, you claim experience *requires* a higher-order thought (which implies access). You cannot hold that experience exists without access, but also requires a higher-order thought about that experience.
  *   **NO (Consciousness does not require thinking about the state):** Go to **Node 3A**.

  ---

  ### Node 2B: The Mechanism Check (For "NO" at Node 1)
  **The Case:** Since you believe consciousness is limited to what you can report or use, we must ask *how* that happens. When you are conscious of a word, is it because the information is **broadcast** to many systems (memory, speech, planning), or because you have a specific **inner scan** that detects the state?

  **The Question:** Which is closer to the truth?
  1.  Consciousness is the **broadcasting** of information to the whole brain.
  2.  Consciousness is a specific **inner scan** (a higher-order thought) targeting a lower state.

  *   **1 (Broadcasting):** Go to **Node 3B**.
  *   **2 (Inner Scan):** Go to **Node 3B**. *(Note: We group these for the metaphysical check, but they lead to different theories).*

  ---

  ### Node 3A: The Substrate Check (For "NO" at Node 2A)
  **The Case:** Consider a honeybee. It has a tiny brain (about one million neurons) but complex recurrent circuitry allowing it to navigate, recognize faces, and communicate. It cannot report its states verbally.

  **The Question:** Is there "something it is like" to be the honeybee? Does it have conscious experience?

  *   **YES (Simple integrated systems feel):** Go to **Node 4**.
  *   **NO (Requires human-like cortex/loops):** Go to **Node 4**.

  ---

  ### Node 3B: The Mechanism Split (For Node 2B answers)
  *(This node separates the specific access theories before the final metaphysical check.)*

  **The Question:** Returning to the choice at Node 2B: Do you identify consciousness with the **Broadcast** (global availability) or the **Inner Scan** (higher-order detection)?

  *   **Broadcast:** Go to **Node 4** (Label: GWT Path).
  *   **Inner Scan:** Go to **Node 4** (Label: HOT Path).

  ---

  ### Node 4: The Metaphysical Reality Check (Final Node for All Paths)
  **The Case:** Consider a "Phenomenal Zombie." This is a being physically identical to you, behaving exactly like you, saying it is conscious, but having **no inner experience** whatsoever. No light is on inside.

  **The Question:** Is the "inner feeling" of consciousness a **real biological feature** that could theoretically be missing (even if physically identical), or is the idea of a "missing inner feeling" a **confused story** the brain tells itself?

  *   **A (It is a confused story/illusion):** → **LEAF: ILLUSIONISM**.
  *   **B (It is a real feature):** Go to **Final Leaves**.

  ---

  ### Final Leaves (Theory Assignments)

  1.  **From Node 3A (YES on Bees) + Node 4 (Real):**
      *   **LEAF: Integrated Information Theory (IIT)**.
      *   *Commitment:* Consciousness is intrinsic causal power. If the system integrates information (like a bee), it is conscious, regardless of reportability.

  2.  **From Node 3A (NO on Bees) + Node 4 (Real):**
      *   **LEAF: First-Order Representationalism (FOR) / Recurrent Processing Theory (RPT)**.
      *   *Commitment:* Consciousness is a first-order representation of the world (FOR) implemented by local recurrent loops in sensory cortex (RPT). It is rich but requires specific biological hardware.
      *   **⚠️ FLAGGED INDIFFERENCE:** This tree cannot separate FOR from RPT. Both agree experience is rich (Node 1), does not require higher-order thought (Node 2A), does not extend to bees (Node 3A), and is real (Node 4). They differ on technical neural implementation details not captured by these intuitions.

  3.  **From Node 3B (Broadcast) + Node 4 (Real):**
      *   **LEAF: Global Workspace Theory (GWT)**.
      *   *Commitment:* Consciousness is equivalent to global access. If information is not broadcast to the whole system, there is no experience (Node 1 NO).

  4.  **From Node 3B (Inner Scan) + Node 4 (Real):**
      *   **LEAF: Higher-Order Theories (HOT)**.
      *   *Commitment:* A state is conscious only if it is targeted by a higher-order mental state. Like GWT, this denies rich unconscious phenomenology (Node 1 NO), but locates the mechanism in meta-cognition rather than broadcast.

  5.  **From Node 4 (Illusion):**
      *   **LEAF: Illusionism**.
      *   *Commitment:* The "hard problem" is a cognitive error. We think we have ineffable qualitative experiences, but we are mistaken. There is only physical processing.

  6.  **From Node 2B (NO on Richness) + Node 3A (YES on Bees):**
      *   **UNNAMED LEAF B**.
      *   *Why nobody sits here:* This combination creates a tension. If consciousness requires global access/report (Node 1 NO), it is difficult to attribute it to a honeybee that lacks the architecture for global report (Node 3A YES). While not logically impossible, no major theory combines strict Access Exhaustion with Panpsychist-style substrate neutrality.

  ---

  **Note on Indistinguishability:** As flagged above, **First-Order Representationalism** and **Recurrent Processing Theory** will land on the same leaf for almost every student. FOR is the philosophical claim (consciousness is world-representation); RPT is the neuroscientific claim (consciousness is recurrent loops). On a diagnostic of *intuitions*, they are identical. Distinguishing them requires reading technical literature on visual cortex feedback loops, not philosophical introspection.

  Summary: The single hardest cut this tree forces is at Node 4, where you must decide whether the "inner light" of experience is a real feature of the universe to be explained, or a user-illusion to be explained away.
