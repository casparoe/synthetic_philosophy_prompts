prompt: |-
  You are a philosopher of mathematics with strong working knowledge of set-theoretic foundations, constructive mathematics, and the standard literature on the axioms of ZFC. Think carefully and systematically before answering; begin with some private brainstorming about what each member of the audience will care about, then produce the finished document described below.

  Context: I am defending the following thesis at a joint mathematics–philosophy seminar next month: the axiom of choice, in its Cartesian-product form, is an elementary truth about sets — if every member of a family F is nonempty, then the product of F is nonempty — and it is better justified than most of the axioms we already accept without complaint. My argument sketch, so you can target the objections at its actual weak joints: (1) a choice function on F is just a certain subset of I × ⋃F, and if Separation lets us carve out arbitrary definable subsets, it would be a strange accident if the total domain contained none of these particular subsets; (2) the famous feeling that choice is suspect — Russell's family of pairs of socks, infinitely many pairs with no distinguishing rule — confuses our inability to *specify* or *describe* a choice function with the nonexistence of one, an epistemic limitation masquerading as an ontological gap; (3) anyone who accepts the power set axiom has already swallowed far larger helpings of "thin" existence without a construction, so recoiling at choice alone is unprincipled.

  The audience is roughly fifteen people: two constructivists (one in the Bishop tradition who cares about whether existence claims carry computational content, one with Brouwerian sympathies who thinks the law of excluded middle itself is the disease and choice is a symptom); one set theorist who leans toward the multiverse view and holds that the iterative conception simply does not settle choice either way, making my "obviously true" tone philosophically naive; one predicativist who distrusts impredicative definitions and suspiciously regards comprehension over arbitrary sets; and the rest analytic philosophers of mathematics who know the folklore objections — Banach–Tarski, the well-ordering of the reals — but not the technical machinery behind them.

  Prepare my Q&A prep sheet. Give me the seven or eight objections I will actually receive from this specific room, not the generic ones from a freshman textbook, ordered by how much damage each would do to my thesis if I fumble it. Phrase each objection in the vocabulary and with the emphases of the person likely to raise it — the constructivist's point that in constructive set theories choice implies excluded middle, and hence that my "innocent combinatorial principle" is anything but innocent, is exactly the kind of objection that should be near the top. For each: a reply I can deliver in about two minutes, marked where I must concede something real rather than bluff, and a frank note on where the reply is soft. Tell me which objections I should defuse preemptively in the talk itself and which I should leave to the Q&A. Finally, include the one question I am hoping nobody in that room asks — the one that, from this audience, would expose the deepest gap in my argument sketch — and advise me whether to pre-empt it or pray. Do not pad the document with a general introduction to the axiom of choice; everyone in the room knows it. Assume I can handle routine restatements of my own argument; what I need is the opposition, sharpened.
