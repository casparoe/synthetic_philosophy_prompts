prompt: |-
  Under the American doctrine known as the third-party rule, information you hand over to a company generally loses its Fourth Amendment protection: the government can obtain your bank records, the phone numbers you dial, and similar data without a warrant, on the reasoning that you exposed those facts to a third party and assumed the risk of its disclosing them. Yet the same body of law protects the contents of a sealed letter in transit even though a postal carrier physically holds it for days, protects the contents of a phone call even though they pass through the phone company's equipment, and, since the Supreme Court's 2018 decision on cell-site location records, protects a record of everywhere you carried your phone even though that information, too, sat in a carrier's database. The pattern is not simply that the law protects communication content and not records about communications, because a postcard's content is unprotected while a bank's record of your deposit slip is protected against some other intrusions, and location data crossed the line only in 2018. Reconstruct the theory of privacy this scheme presupposes: is it secrecy, in the sense that whatever another party can see is no longer private; is it control over information; is it some notion of contextual appropriateness of information flows; or is it instead a rough proxy for the intrusiveness of surveillance, with no coherent theory of privacy beneath it at all? Distinguish what the practice strictly requires from what it merely tolerates, say where the practice is underdetermined enough that several rival theories would license it, and explain what would have to change if the secrecy rationale were replaced by a contextual-flow view. End with your answer in the form \answer{...} containing a short label (at most four words) for the theory of privacy the doctrine most plausibly presupposes.
