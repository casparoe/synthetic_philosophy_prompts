prompt: |-
  Long story short: I'm a retired physicist (solid state, 35 years) who's gotten way into philosophy since leaving the lab, mostly decision theory, and my old department talked me into chairing their "continuation review" panel — the group that decides whether the university keeps funding research projects that are over budget and behind schedule. We review maybe five projects a month, stakes run from $200k up to $40M, and every meeting goes the same way: the PI says they're 90% done, the panel feels like we've come too far to quit, and we fund it. I just read about the dollar auction and it scared me a little — the whole panel looks like the two bidders stuck at $4 and $5 fighting over a dollar, where each individual vote to continue seems locally sensible but the whole sequence is crazy.

  Can you write a decision procedure the panel can actually run in a 30-minute review? Ground it in what's actually known about escalation of commitment, not just "don't fall for sunk costs" — I want the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to hand the call to a human because it's a values question rather than a facts one. Then run it on three cases: (1) a detector upgrade that's six years in at 3x budget, where the next milestone would also serve a second experiment; (2) a migration of the department's old data system that's already failed twice, but the legacy system is now end-of-life so walking away isn't really on the table; (3) the dean's pet sky survey, politically untouchable, definately over budget — and be honest if the procedure says kill that one, since I won't like hearing it. Also tell me plainly where the procedure will misfire. Better I find out now than in the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired solid-state physicist (35 years), now interested in philosophy/decision theory. Chairing a university "continuation review" panel.
      *   **Problem:** The panel suffers from *escalation of commitment* (sunk cost fallacy, dollar auction dynamic). They keep funding over-budget/behind-schedule projects because "we've come too far to quit."
      *   **Task:** Create a concrete, 30-minute decision procedure for the panel.
      *   **Requirements:**
          *   Grounded in escalation of commitment literature (not just "ignore sunk costs").
          *   Specific questions in order.
          *   Clear pass/fail criteria for each question.
          *   Identify "stop points" (where the procedure says No).
          *   Identify "hand-off points" (where it's a values judgment, not factual).
          *   Apply the procedure to three specific cases (Detector upgrade, Data migration, Dean's pet project).
          *   Be honest about the outcome, even if politically difficult.
          *   Explicitly state where the procedure will misfire (limitations).
      *   **Tone:** Professional, rigorous, respectful of expertise, direct (physicist-to-physicist), philosophically grounded but practical.

  2.  **Deconstruct the Psychological/Decision Theory Problem:**
      *   *Sunk Cost Fallacy:* The core issue. Money spent is gone. Decision must be based on *marginal* utility vs. *marginal* cost.
      *   *Escalation of Commitment (Staw, 1976; Brockner, 1992):* Why do people do this?
          *   Self-justification (admitting failure hurts ego/reputation).
          *   Prospect Theory (loss aversion: cutting funding realizes the loss, continuing offers a gamble to recover).
          *   Social/Political pressure (saving face with the PI, the Dean, or peers).
          *   Completion Bias (need to finish what was started).
      *   *Dollar Auction:* Bidding higher than the value of the prize to avoid losing the previous bid.
      *   *Solution Strategy:* Pre-commitment devices, separating past from future, introducing an external "kill criterion," forcing a "zero-based" evaluation.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Constraint:* 30 minutes. Needs to be tight.
      *   *Structure:* Needs to force the panel to ignore the past investment *first*, then evaluate the future *strictly*, then consider the political/strategic context *last*.
      *   *Step 1: The Zero-Base Test (Isolating Sunk Costs).* If this project didn't exist, would we fund it *now* with the *remaining* budget?
      *   *Step 2: The Marginal ROI (The Physics/Business Case).* What is the specific deliverable for the *next* tranche? Is it credible?
      *   *Step 3: The Opportunity Cost (The Alternative).* What else could we do with this specific money?
      *   *Step 4: The Exit Strategy (If No).* If we stop, what happens? (Crucial for the "Data Migration" case).
      *   *Step 5: The Values Handoff.* If the math says "No" but politics say "Yes," acknowledge it explicitly.

      *Refining the Steps based on Escalation Literature:*
      *   Staw & Ross (1987) suggest separating decision makers from original proponents. (Hard to do here, but we can separate the *evaluation* of the past from the future).
      *   Need to combat "Completion Bias."
      *   Need to combat "Loss Aversion."
      *   *Key Mechanism:* The "Fresh Eyes" heuristic.

      *Drafting the Questions:*
      1.  **The Replacement Test:** Ignore sunk costs. Would we start this *today* with the *remaining* funds?
      2.  **The Milestone Credibility:** Is the next goal defined and achievable? (Combats vague "90% done" claims).
      3.  **The Alternative Use:** Is there a better use for the *next* $X?
      4.  **The Abandonment Cost:** If we stop, is the loss catastrophic or manageable?

  4.  **Developing the Three Cases:**

      *   *Case 1: Detector Upgrade (6 yrs, 3x budget, dual use).*
          *   Sunk costs are huge.
          *   Marginal benefit: Completes Exp A, helps Exp B.
          *   Test: Would we build the rest of it today just for Exp B? If yes, fund. If no, kill.
          *   Likely outcome: Conditional Fund (if Exp B value is high enough).

      *   *Case 2: Data Migration (Failed twice, Legacy EOL).*
          *   Sunk costs: High (failed attempts).
          *   Constraint: Walking away isn't an option (Legacy EOL).
          *   This is a "Forced Continuation" but needs a pivot.
          *   Test: Is the *current* plan the best way to solve the EOL problem, or do we need a vendor/outsourcing?
          *   Likely outcome: Fund, but restructure (not a "Kill", but a "Change Approach").

      *   *Case 3: Dean's Pet Sky Survey (Politically untouchable, over budget).*
          *   Sunk costs: High.
          *   Science value: Maybe low/unclear.
          *   Political value: High.
          *   Test: Replacement Test likely fails (would we fund this science today?).
          *   Likely outcome: Procedure says "Kill/Redirect."
          *   Reality: Panel can't kill it. This is where the "Values Handoff" happens.

  5.  **Identifying Failure Modes (Where the Procedure Misfires):**
      *   Political reality overrides rational procedure (Case 3).
      *   Information asymmetry (PI knows more than panel).
      *   Groupthink (Panel dynamics).
      *   False precision (treating the score as absolute truth).

  6.  **Refining the Tone:**
      *   Acknowledge the user's background (physicist). Use analogies they get (local minima, boundary conditions).
      *   Respect the difficulty (it's not just math, it's people).
      *   Be direct about the "Dean's Pet" scenario.

  7.  **Final Review against Constraints:**
      *   30-minute limit? Yes, the questions are designed to be rapid.
      *   Grounded in escalation theory? Yes (Staw, Brockner, Kahneman references implied in structure).
      *   Order of questions? Yes.
      *   Stop/Handoff points? Yes.
      *   Three cases analyzed? Yes.
      *   Failure modes listed? Yes.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Just say "Ignore sunk costs."
      *   *Correction:* Too hard psychologically. Use the "Replacement Test" instead. It forces the mental simulation of a fresh start.
      *   *Initial thought:* If the math says no, kill it.
      *   *Correction:* University politics exist. Need a specific "Political Override" step that forces transparency rather than pretending it's a science decision.
      *   *Case 2 Nuance:* It's not a "Kill" decision, it's a "How" decision. The procedure needs to handle "Must Continue" scenarios differently. I will add a "Constraint Check" at the very beginning. If the project *cannot* be stopped (existential threat), the question changes from "Should we?" to "How best?"

  9.  **Final Polish:** Ensure the distinction between *factual* questions (can it be done?) and *values* questions (is it worth it?) is clear. (This addresses the "hand the call to a human" requirement).

  *(Self-Correction on Case 2)*: The prompt says "walking away isn't really on the table." This means the decision isn't Continue/Stop, it's Continue-This-Way/Continue-Other-Way. I need to make sure the procedure captures that distinction so it doesn't falsely flag a "Kill."

  *(Self-Correction on Case 3)*: The user says "be honest if the procedure says kill that one." I must explicitly state that the *rational* output is Kill, even if the *political* output is Fund.

  *(Self-Correction on Procedure Name)*: Let's call it the "Marginal Utility Protocol" or "Zero-Base Continuation Protocol." Let's go with "Zero-Base Continuation Protocol (ZBCP)."

  10. **Final Output Generation** (incorporating all the above).
answer: |-
  Colleague, it is good to hear from you. I recognize the dynamic immediately. You are describing a classic **escalation of commitment** trap, compounded by what Staw and Brockner call "project determinants" (the objective characteristics of the project) and "psychological determinants" (ego, self-justification, loss aversion).

  In the lab, we trust our instruments. In the review room, the instrument is the panel, and right now, your panel is miscalibrated. It is measuring *past investment* rather than *future utility*. The dollar auction analogy is apt: you are bidding against your own sunk costs.

  To fix this in 30 minutes, we cannot rely on willpower. We need a **protocol** that forces a change of reference frame. We cannot simply say "ignore sunk costs" because the brain processes realized loss (killing a project) differently than potential loss (throwing good money after bad). We need to structure the inquiry to bypass the self-justification mechanism.

  Here is the **Zero-Base Continuation Protocol (ZBCP)**. It is designed to be run in 30 minutes. It separates factual assessments from value judgments.

  ***

  ### The Zero-Base Continuation Protocol (ZBCP)

  **Time Allocation:** 30 Minutes Total
  **Prerequisite:** The PI submits a one-page "Forward Look" 48 hours prior. No past performance summaries allowed in this document, only future milestones and remaining budget.

  #### Phase 1: The Constraint Check (2 Minutes)
  *Goal: Determine if this is a "Go/No-Go" decision or a "How" decision.*

  **Question 1:** If funding is withdrawn immediately, does the department face an existential or catastrophic operational failure (e.g., safety hazard, total data loss, legal breach)?
  *   **Yes:** **STOP.** This is not a continuation review; it is a crisis management review. Skip to *Phase 4 (Restructuring)*.
  *   **No:** Proceed to Phase 2.

  #### Phase 2: The Replacement Test (10 Minutes)
  *Goal: Isolate the Sunk Cost Fallacy. This is the core psychological intervention.*

  **Question 2:** Imagine this project does not exist. A proposal lands on your desk today asking for the *remaining* budget required to finish the work. Based strictly on the scientific/operational merit of the *outcome*, would you fund it?
  *   **Yes:** Strong signal to continue.
  *   **No:** **STOP.** Recommend Termination. (Unless overridden by Phase 4).
  *   **Uncertain:** Proceed to Question 3.

  **Question 3:** Is the "90% Done" claim backed by a verifiable, binary milestone achievable within the *next* funding tranche (e.g., 6 months)?
  *   **Yes:** (Must be specific: "Data taking begins," not "Integration continues"). Proceed to Phase 3.
  *   **No:** **STOP.** Recommend Termination or Pause. Vague milestones are the primary fuel for escalation.

  #### Phase 3: The Opportunity Cost Audit (10 Minutes)
  *Goal: Combat Loss Aversion and Prospect Theory.*

  **Question 4:** What is the specific alternative use for the *next* tranche of funding (e.g., $500k)?
  *   *Requirement:* The panel must name one concrete alternative (e.g., "Two postdoc positions," "New cryostat for Lab B").
  *   **If no alternative exists:** (Budget is unrestricted surplus). Proceed to Phase 4.
  *   **If alternative exists:** Is the marginal utility of completing *this* project strictly higher than the alternative?
      *   **Yes:** Proceed to Phase 4.
      *   **No:** **STOP.** Recommend Reallocation.

  #### Phase 4: The Values Handoff (8 Minutes)
  *Goal: Acknowledge political/strategic reality without disguising it as science.*

  **Question 5:** Are there external strategic factors (Dean's priorities, donor relations, departmental reputation) that outweigh the negative findings in Phases 2 or 3?
  *   **No:** The Panel's recommendation is final.
  *   **Yes:** **HANDOFF.** The panel must explicitly tag the recommendation as **"Scientifically Negative, Strategically Overridden."** This tag goes to the Dean/Provost. The panel does not vote on the values; they record the conflict.

  ***

  ### Where the Procedure Stops (The "Kill" Switches)
  1.  **Phase 1 (Yes):** Handoff to Admin/Crisis team. Panel recuses.
  2.  **Phase 2 (No):** The "Replacement Test" failed. The project is scientifically dead. Recommendation: Terminate.
  3.  **Phase 2 (Uncertain + No Milestone):** The plan is too vague to justify risk. Recommendation: Pause/Suspend.
  4.  **Phase 3 (No):** The money is better spent elsewhere. Recommendation: Reallocate.

  ### Where the Procedure Hands Off (The "Values" Switch)
  1.  **Phase 4 (Yes):** The math says "No," but the politics say "Yes." The panel must not lie and call it good science. They must label it a **Strategic Subsidy**. This protects the panel's integrity and forces the administration to own the cost.

  ***

  ### Application to Your Three Cases

  Here is how the ZBCP runs on your specific scenarios.

  #### Case 1: The Detector Upgrade (6 years, 3x budget, dual use)
  *   **Phase 1:** No existential threat. Proceed.
  *   **Phase 2 (Replacement Test):** If we didn't have the half-built detector, would we spend the *remaining* money to finish it just for Experiment B?
      *   *Analysis:* If Experiment B is high-value, the answer is likely **Yes**. The sunk cost of Experiment A is ignored. The value of Experiment B justifies the *marginal* cost.
      *   *Milestone:* Is the next milestone binary? (e.g., "First light for Exp B"). If yes, pass.
  *   **Phase 3 (Opportunity Cost):** Is finishing this better than funding two new grad students?
      *   *Analysis:* If the detector enables a unique capability, **Yes**.
  *   **Outcome:** **FUND.**
  *   *Why it works:* It decouples the failure of Exp A from the potential of Exp B. You aren't saving the old project; you are funding a new capability that happens to utilize existing hardware.

  #### Case 2: The Data Migration (Failed twice, Legacy EOL)
  *   **Phase 1:** **YES.** Legacy system is End-of-Life. Walking away means data loss/collapse.
      *   *Action:* **STOP ZBCP.** Shift to Crisis/Restructuring Mode.
  *   **Revised Question:** Since we *must* spend money, is *this PI's plan* the best way to spend it?
      *   *Analysis:* They failed twice. The ZBCP implies the current execution method is flawed.
  *   **Outcome:** **FUND, BUT RESTRUCTURE.** Do not fund the PI's current plan. Fund a vendor audit or a forced handover to IT services.
  *   *Why it works:* It prevents the "Kill" recommendation which is impossible, but prevents the "Blank Check" which is dangerous. It acknowledges the constraint (Phase 1) but demands a change in method.

  #### Case 3: The Dean's Pet Sky Survey (Untouchable, Over Budget)
  *   **Phase 1:** No existential threat. Proceed.
  *   **Phase 2 (Replacement Test):** If this proposal landed today, would we fund it?
      *   *Analysis:* As a physicist, you know the science is likely marginal if it's over budget and behind. Honest answer: **No**.
      *   *Result:* **STOP.** Recommendation: Terminate.
  *   **Phase 4 (Values Handoff):** The Panel knows the Dean wants this.
      *   *Action:* The Panel votes "Terminate" based on Phase 2. However, they invoke Phase 4.
      *   *Report:* "Scientific Recommendation: Terminate (Failed Replacement Test). Strategic Note: Panel acknowledges Dean's Office priority."
  *   **Outcome:** **PROCEDURE SAYS KILL.**
  *   *Reality:* The Dean will fund it anyway.
  *   *Why this matters:* By forcing the "Scientific Recommendation: Terminate" label, you prevent the *panel* from owning the sunk cost fallacy. You place the escalation of commitment squarely on the Dean's shoulders. You have protected the integrity of the review process, even if you cannot protect the budget. **Do not soften this.** If you fund it without the label, you validate the dollar auction. If you label it, you expose it.

  ***

  ### Where This Procedure Will Misfire (Failure Modes)

  You asked for honesty on the limitations. As a physicist, you know no model covers all boundary conditions. Here is where the ZBCP breaks:

  1.  **Information Asymmetry (The "Black Box" Problem):**
      *   *Risk:* The PI knows the technical hurdles better than the panel. The "Replacement Test" relies on the panel's ability to judge the *remaining* work. If the PI hides the true complexity of the final 10%, the panel will vote Yes based on false data.
      *   *Mitigation:* Require an external technical auditor for any project >$5M before the review.

  2.  **The "Strategic Subsidy" Abuse:**
      *   *Risk:* Phase 4 becomes a loophole. PIs will learn to lobby the Dean *before* the review so the Panel is forced to use the "Strategic Override."
      *   *Mitigation:* The "Strategic Override" tag must be public within the university administration. If Deans know their overrides are recorded and visible to the Provost, they will use them more sparingly.

  3.  **Groupthink in Phase 3:**
      *   *Risk:* In Question 4 (Opportunity Cost), the panel may fail to generate a credible alternative. "We can't think of anything better to do" is not the same as "This is the best thing to do."
      *   *Mitigation:* The Chair (you) must come to the meeting with a pre-prepared list of unfunded proposals or departmental needs to serve as the counter-weight.

  4.  **The "Life Support" Scenario:**
      *   *Risk:* Sometimes a project is scientifically dead (Phase 2 = No) but stopping it causes immediate reputational damage that hurts future fundraising (a pragmatic, not scientific, value).
      *   *Mitigation:* This falls under Phase 4. It must be explicitly categorized as "Reputation Management," not "Science Funding."

  ### Final Advice for the Chair

  You are worried about the dollar auction. The only way to win a dollar auction is to refuse to bid, or to change the currency.

  This procedure changes the currency. It shifts the metric from **"How much have we spent?"** to **"What is the marginal utility of the next dollar?"**

  When you run Case 3 (The Dean's Pet), the room will get quiet. They will look at you. If you follow the ZBCP, you will have to recommend killing it. The Dean may overrule you. **Let him.**

  If you fund it because "we've come too far to quit," *you* are the bidder in the dollar auction.
  If you recommend killing it, and the Dean funds it anyway, *he* is the bidder.

  Your job is not to balance the university's budget; it is to ensure the review panel's advice is rational. If the advice is rational and ignored, that is a governance problem, not a decision-theory problem. Do not let the governance problem corrupt your decision procedure.

  Good luck. Keep the clock running.
