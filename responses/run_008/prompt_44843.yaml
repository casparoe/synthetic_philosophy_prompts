answer: |-
  Alright, let's settle in. You're asking for the spec sheet before buying the car, which is wise, because the literature on this is basically a showroom full of vehicles that run great on the highway (daily life) but fall apart on the test track (lab conditions), or vice versa.

  You are right to be suspicious. The phrase "Unity of Consciousness" is doing too much heavy lifting. It's a suitcase word. If we don't unpack it, any theory you build will be equivocal.

  Here is the pushback you asked for, followed by the desiderata, followed by the "Impossible Triangle" that I suspect is the real result you're looking for.

  ### Part 1: The Framing Pushback

  **1. "Unity" is a Cluster, Not a Switch**
  You cannot have a single list of desiderata for "Unity of Consciousness" without specifying *which* unity. Split-brain cases suggest these come apart:
  *   **Phenomenal Unity:** Do all experiences belong to a single "what-it-is-like"? (The snow and the claw: are they in one world or two?)
  *   **Access Unity:** Can all information be broadcast to all cognitive systems for reporting/action? (The left hand knows the snow, the mouth can't say it.)
  *   **Substantive Unity:** Is there a single subject *having* the experiences? (The "I".)

  A theory might save Phenomenal Unity by sacrificing Access Unity, or vice versa. If your spec demands all three be preserved simultaneously in the same way, you have already ruled out the data.

  **2. The "Person" Calibration**
  You specified this is for thinking about *persons*. This is dangerous territory. Neuroscience tracks *systems*; ethics tracks *subjects*.
  *   If the theory says "Two streams, one person," you risk moral schizophrenia (who is responsible for the alien hand?).
  *   If the theory says "Two streams, two persons," you risk metaphysical inflation (did a surgery create a new soul? do we need two consent forms?).
  *   **The Pushback:** A theory of *consciousness* might not be able to solve a theory of *personhood*. The desiderata below try to bridge this, but be aware: you might be asking for a bridge where there is only a ferry.

  **3. Split-Brain as the Wrong Paradigm?**
  You suspected normal brains have "fractional unity." You're right. The split-brain patient isn't a *broken* unity; they are an *amplified* modularity. If your theory requires a "perfectly unified" baseline to measure against, you are chasing a ghost. Normal consciousness is a coalition, not a monarchy. The split-brain case just reveals the coalition members can vote separately when the whip (corpus callosum) is cut.

  ---

  ### Part 2: The Desiderata Spec

  I have divided these into **Empirical Anchors** (non-negotiable, data-driven) and **Metaphysical Loads** (tribal, interpretive, where the fights happen).

  #### A. Empirical Anchors (Non-Negotiable)
  *These are the facts on the ground. A theory that contradicts these is falsified.*

  | Desideratum | Motivation / Case | Why it's Load-Bearing |
  | :--- | :--- | :--- |
  | **1. Ecological Integration** | **Daily Life Normalcy.** Patients eat, drive, and converse without apparent internal conflict. | Any theory claiming "two people" must explain why they coordinate so perfectly outside the lab without a central executive. |
  | **2. Informational Encapsulation** | **Lab Dissociation.** Left hand picks snow shovel (left hemisphere sees snow); mouth says "chicken" (right hemisphere sees claw). | Any theory claiming "one mind" must explain how information can be simultaneously present in the brain but inaccessible to parts of that mind. |
  | **3. Cross-Modal Leakage** | **Cross-Cuing.** Hemispheres communicate via speech, eye movement, or subcortical routes despite callosal section. | A theory cannot treat the hemispheres as hermetically sealed. The boundary is porous, not absolute. |
  | **4. Plasticity of Unity** | **Agenesis.** People born without a corpus callosum often show *less* dissociation than surgical patients. | Unity cannot be strictly defined by the presence of a specific tract. The system can reconfigure to achieve integration (or fail to dissociate). |
  | **5. Agential Dissociation** | **Alien Hand.** One hand unbuttons a shirt the other just buttoned. Patient reports lack of ownership. | A theory must account for the *feeling* of ownership breaking down. Unity isn't just functional; it's experiential. |

  #### B. Metaphysical Loads (Tribal/Debatable)
  *These are the assumptions theorists often sneak in as requirements. I have marked them as "Prejudices." You need to decide if you want to carry this baggage.*

  | Desideratum | Motivation / Case | Verdict: Load-Bearing or Prejudice? |
  | :--- | :--- | :--- |
  | **6. The "One Brain, One Subject" Rule** | **Intuition.** We count heads, not hemispheres. | **PREJUDICE.** This is a heuristic, not a datum. Split-brain data challenges this directly. Insisting on this forces you to ignore the "Two Streams" evidence. |
  | **7. The "Unity is Binary" Assumption** | **Logic.** Either you are one person or two. | **PREJUDICE.** Why can't personhood be a matter of degree? If you demand a binary answer, you force a false dichotomy on a gradient phenomenon. |
  | **8. The "Confabulation is Lying" Assumption** | **Chicken/Claw.** The speaking hemisphere lies about why the hand moved. | **LOAD-BEARING (with nuance).** It's not lying; it's *interpreting*. A theory must explain the *drive* to unify. The brain prefers a coherent story over truth. This is a feature, not a bug. |
  | **9. The "Subcortical Unity" Escape Hatch** | **Agenesis/Coma.** Maybe the thalamus unifies what the cortex splits. | **PREJUDICE (often).** This is often used to save the "One Subject" view. It's a valid hypothesis, but treating it as a requirement biases the theory against cortical accounts of consciousness. |
  | **10. Moral Responsibility Tracking** | **Personhood.** If the left hand hits someone, who is guilty? | **LOAD-BEARING.** Since you want a theory for *persons*, you cannot ignore agency. If the theory can't locate the agent, it fails the personhood test. |

  ---

  ### Part 3: The Impossible Triangle (Joint Unsatisfiability)

  Here is the result you suspected. I believe there is a trilemma here. You can satisfy any two of the following three constraints, but not all three simultaneously.

  **The Vertices:**
  1.  **Phenomenal Singularity:** There is exactly one "what-it-is-like" to be the patient at any time *t*. (One Subject).
  2.  **Functional Independence:** The hemispheres can process, decide, and act on information completely private from the other. (Two Systems).
  3.  **Behavioral Coherence:** The organism acts as a single, rational, integrated agent in the wild without constant internal negotiation. (One Agent).

  **The Tensions:**

  *   **If you keep 1 & 2 (One Subject, Two Systems):** You struggle with **3**. If there is one subject, why can't that subject access all the info? If the systems are truly independent, how does the "One Subject" remain coherent without a central integrator? You end up positing a "homunculus" that somehow watches two screens but only speaks into one microphone. This leads to the "Confabulation" problem: The subject is systematically deluded about its own unity.
  *   **If you keep 2 & 3 (Two Systems, One Agent):** You sacrifice **1**. This is the "Two Minds" view (Puccetti, Marks). There are literally two conscious subjects sharing a body. They cooperate so well (Cross-Cuing) that they *look* like one agent.
      *   *The Cost:* This violates the "One Brain, One Subject" prejudice. It creates ethical nightmares (is it murder to silence one hemisphere?). It makes the daily normalcy (Ecological Integration) a miracle of coordination between two distinct wills.
  *   **If you keep 1 & 3 (One Subject, One Agent):** You sacrifice **2**. This is the "Disconnection Syndrome" view (Gazzaniga, Sperry later years). There is only one mind, but the *access routes* are broken. The left hand isn't a separate agent; it's a limb disconnected from the command center.
      *   *The Cost:* This struggles with Alien Hand and complex dual-tasking. If it's truly one mind, why does the "command center" disown the action? Why can the right hemisphere learn puzzles the left doesn't know about? You have to treat the "private knowledge" as unconscious processing, which begs the question of what consciousness is for.

  **The Verdict:**
  The most honest output of this exercise is that **Phenomenal Singularity (1)** and **Functional Independence (2)** are likely incompatible *if* you define consciousness as essentially unified access.

  If you define consciousness as *modular*, you can keep 2 and 3, but you lose the traditional "Subject."
  If you define consciousness as *substantive*, you keep 1 and 3, but you have to treat the lab data as artifacts of access, not consciousness.

  ### Part 4: Recommendation for Your Literature Dive

  Since you are building a theory for **persons**, I suggest you do not try to solve the trilemma. Instead, use it.

  1.  **Reject Desideratum #7 (Binary Unity).** Treat unity as a variable. A split-brain patient is *less* unified than a neurotypical, but *more* unified than two strangers. Personhood might track this gradient.
  2.  **Prioritize Desideratum #10 (Moral Responsibility).** If a theory explains the neural data but tells you nothing about who to hold responsible for the alien hand's slap, it is useless for your purpose.
  3.  **Watch for the "Subcortical Escape Hatch" (Desideratum #9).** Many philosophers use the brainstem/thalamus to save the "One Subject" view. Scrutinize this. Does subcortical integration support *phenomenal* unity, or just *vegetative* unity?

  **Final thought:** The split-brain patient doesn't teach us that unity *breaks*. They teach us that unity is *constructed*. The "glue" (confabulation, cross-cuing) is the work of the system trying to maintain the illusion of Desideratum #1 in the face of Desideratum #2.

  Your theory shouldn't explain why they are one person. It should explain why they work so hard to *pretend* to be one person, and under what conditions that pretense drops. That is where the personhood lives.
