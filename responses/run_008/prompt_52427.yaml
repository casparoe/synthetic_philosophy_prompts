  # SEMINAR HANDOUT: Navigating the Gettier Aftermath
  **Course:** Epistemology 101 | **Topic:** Post-JTB Responses

  **START HERE:** You agree that the **Stopped Clock** case (looking at a broken clock that happens to show the right time) is **NOT** knowledge. Follow the path that matches your verdicts on the following cases.

  ---

  ### 1. The Grabit Case
  *Scenario:* You see Tom steal a book. You believe Tom stole it. Unbeknownst to you, Tom has an identical twin who was in the vicinity, but the twin *did not* steal the book. There is genuinely misleading counterevidence available (the twin's presence) that you do not see.
  **Is this Knowledge?**
  *   **NO** $\rightarrow$ Go to **Q2**.
  *   **YES** $\rightarrow$ Go to **Q3**.

  ### 2. The Defeater Check
  *Scenario:* Same as above, but the twin was removed from the vicinity before you looked. No misleading evidence exists.
  **Is this Knowledge?**
  *   **YES** $\rightarrow$ **LEAF: No-Defeaters Condition**
      *   *Awkward Commitment:* Commits to saying unseen facts can destroy your knowledge even if you never encounter them.
  *   **NO** $\rightarrow$ **LEAF: The Give-Up Option**
      *   *Awkward Commitment:* Commits to the view that the analytic project is fundamentally broken and we should stop trying to define knowledge.

  ### 3. Fake Barn Country
  *Scenario:* You drive through a county where most 'barns' are facades. You look at the one real barn and believe it is a barn. You are right, but you could easily have looked at a fake.
  **Is this Knowledge?**
  *   **YES** $\rightarrow$ **LEAF: No-False-Lemmas**
      *   *Awkward Commitment:* Commits to counting the Fake Barn visitor as knowing, despite the environmental luck.
  *   **NO** $\rightarrow$ Go to **Q4**.

  ### 4. The Lottery Case
  *Scenario:* You hold a ticket in a fair million-ticket lottery. The odds are overwhelmingly in your favour that you will lose. You believe you will lose. You do lose.
  **Is this Knowledge?**
  *   **YES** $\rightarrow$ **LEAF: Process Reliabilism**
      *   *Awkward Commitment:* Commits to granting knowledge to reliable processes (like statistical induction) even when luck is present.
  *   **NO** $\rightarrow$ Go to **Q5**.

  ### 5. The Sceptical Scenario
  *Scenario:* You are not a Brain in a Vat. You believe you have hands. The sceptical possibility is not actual, but it is incompatible with your belief.
  **Do you Know you have hands?**
  *   **NO** $\rightarrow$ **LEAF: Safety-Based Anti-Luck**
      *   *Awkward Commitment:* Commits to denying knowledge of the lottery loss (and hands) because nearby worlds exist where you are wrong.
  *   **YES** $\rightarrow$ Go to **Q6**.

  ### 6. The Clairvoyance Case
  *Scenario:* A reliable clairvoyant forms a belief with no internal justification or evidence, solely via their power. The belief is true.
  **Is this Knowledge?**
  *   **YES** $\rightarrow$ **LEAF: Knowledge-First**
      *   *Awkward Commitment:* Commits to treating knowledge as a primitive mental state that cannot be defined in simpler terms.
  *   **NO** $\rightarrow$ **LEAF: Safety-Based Anti-Luck** (Alternative Route)
      *   *Awkward Commitment:* Commits to denying knowledge of the lottery loss because nearby worlds exist where you are wrong.

  ---

  ### ⚠️ A Note on Indistinguishability
  **Safety vs. Reliabilism:** Be aware that on **Fake Barn Country** (Q3), both Safety and Reliabilism typically yield the same verdict ('No Knowledge'). This tree separates them on the **Lottery Case** (Q4), but in practice, these two positions often blur together on environmental luck cases. If you found yourself hesitating between them, you are in good company; the distinction is often one of explanation rather than verdict.

  ---
