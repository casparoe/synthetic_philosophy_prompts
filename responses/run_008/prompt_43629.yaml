  Your intuitions are best explained by a **Principle of Communicative Integrity**, which holds that you are morally responsible for the beliefs you intentionally engineer within a relationship of trust, and that using technical truths to evade this responsibility while protecting your own moral self-image is distinctively vicious.

  Your brother's Kantian framework fails because it locates morality in the *proposition* rather than the *interaction*. Your gut reactions correctly identify that the moral weight lies in the **relational duty** you owe the listener and the **priority of values** guiding your speech. In the murderer case, you owe no duty of clarity to someone intent on harm, so engineering a false belief is justified self-defense. In the con man, roommate, and recommendation cases, you violate a specific duty of transparency owed to a trusting party, making the deception wrong regardless of semantic truth. The "slimy" residue you feel comes from **moral self-licensing**: when you choose a technically true statement over a helpful lie or a clear truth, you are often prioritizing your own record ("I didn't lie") over the listener's well-being or right to know. This turns honesty into a shield for the speaker rather than a gift to the listener, which violates the virtue of integrity.

  Regarding your partner asking about Dana: If there *is* something going on, answering "You know you're the one I love" is morally worse than a lie because it is manipulative gaslighting. It exploits your partner's trust to validate a false belief while allowing you to deny accountability later ("I never said nothing was happening"). This violates the principle because it weaponizes intimacy to obscure reality, prioritizing your safety over their autonomy. If there is *nothing* going on, it is merely evasive and potentially damaging to trust, but not dishonest in intent.

  Regarding the dying relative: The principle verdict depends entirely on your motive. If you say "the doctors haven't said anything final" to preserve hope because you believe hope aids their peace, that is an act of care comparable to the kind lie. However, if you say it because you want to avoid the emotional labor of lying or the guilt of deception (keeping your hands clean), your intuition is correct: it is morally worse than the kind lie. In that specific context, comfort is the duty, and using technical truth to evade the cost of providing that comfort is a failure of care. Your brother's view cannot distinguish these motives, but your principle demands you examine them.
