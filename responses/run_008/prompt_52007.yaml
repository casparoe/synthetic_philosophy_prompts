          *   Emergentists prioritize *parsimony/structural fit*. "Why multiply entities beyond necessity?" (Occam's Razor vibe).
      *   *The "Hard Problem" Shadow:* This is essentially Chalmers' Hard Problem vs. the "Combination Problem." It's a clash of intuitions about what counts as a "gap."
      *   *Diagnosis:* It's a **clash of explanatory virtues** rooted in **divergent intuitions about the Explanatory Gap**. It's not just verbal, but it is *methodologically* stalemate-prone because each side views the other's "brute fact" as a dealbreaker.

  3.  **Assess Prospects for Progress:**
      *   *Formal account of synchronic emergence?* Integrated Information Theory (IIT) tries this, but it's controversial. It doesn't solve the *why*, just the *where/how much*.
