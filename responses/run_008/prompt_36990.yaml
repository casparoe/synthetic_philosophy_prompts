answer: |-
  The debate over the Great Divergence is perhaps the most fertile ground in contemporary historiography for testing the philosophical machinery of contrastive explanation. At its heart lies Joseph Needham's famous puzzle: why did modern science and the industrial takeoff occur in Western Europe rather than China, despite China's centuries of technological precedence? While historians argue over coal, colonies, culture, and institutions, the structure of their disagreement often mirrors the logical structure of explanation itself. By applying the contrastive theory of explanation associated with Bas van Fraassen and Peter Lipton, we can see that the "Great Divergence" is not a single question awaiting a single answer, but a cluster of contrastive queries where the choice of the foil (the "rather than Q") dictates the causal factors deemed relevant. However, while contrastivism brilliantly diagnoses why historians talk past one another, it ultimately falls silent on the normative question of which foil is historically significant, exposing a gap between explaining *how* we explain and adjudicating *what* matters.

  ### The Contrastive Framework

  In the classical deductive-nomological model, an explanation answers "Why P?" by citing laws and antecedent conditions. Van Fraassen and Lipton argue this is psychologically and pragmatically incomplete. Requests for explanation are inherently contrastive: "Why P *rather than Q*?" Here, P is the fact to be explained, and Q is the foil. An adequate explanation must cite a cause that is present in the history of P but absent in the history of Q (Lipton's "difference making"). If a factor is present in both P and Q, it cannot explain the difference between them, even if it is a necessary condition for P.

  This logical constraint maps seamlessly onto the Great Divergence. If the question is "Why did industrialization happen in England?", the answer depends entirely on what we are contrasting England with. The historiography of the divergence is essentially a history of shifting foils.

  ### Mapping the Historiography: Pomeranz vs. The Old Guard

  The "Old Guard" of divergence scholarship (including Max Weber, Eric Jones, and Douglass North) generally operated with a broad, civilizational foil. Their implicit question was: "Why did Europe industrialize *rather than China* (or Asia)?" Here, P is Europe, and Q is China as a monolithic block. Because the foil is geographically and culturally distant, broad structural differences become salient causal candidates. If Europe is P and China is Q, then Europe's fragmented state system, its specific legal traditions, or its "rational" culture appear to be difference-makers. These factors are present in P and (allegedly) absent in Q. Thus, the explanation leans toward deep-rooted institutional or cultural endogeny.

  Kenneth Pomeranz's *The Great Divergence* (2000) revolutionized the debate by tightening the foil. Pomeranz argued that comparing "Europe" to "China" was methodologically unsound because China was too large and diverse. He proposed a specific contrast: "Why did industrialization happen in England *rather than in the Yangzi Delta*?" By the 18th century, Pomeranz demonstrated, the Yangzi Delta and England were comparable in terms of life expectancy, market development, and consumption (P and Q shared these properties). Therefore, these factors cannot explain the divergence. They are common causes, not difference-makers.

  By shifting the foil to a region that *didn't* industrialize despite having similar proto-industrial characteristics, Pomeranz forced the explanation to rely on contingent, exogenous factors that *were* different between England and the Yangzi. Specifically: the geographical luck of coal located near water transport in Britain, and the "ghost acres" of the New World available to Europeans but not Chinese. In contrastive terms, the Old Guard selected a foil that made culture a difference-maker; Pomeranz selected a foil that made culture a constant and geography a difference-maker. The apparent disagreement is largely a disagreement about which Q is the appropriate counterfactual for understanding P.

  ### Shifting the Foil: Temporal and Regional Variations

  The plasticity of the divergence question becomes even more apparent when we manipulate the foil further, as the prompt suggests.

  Consider the foil: **"Britain rather than Britain-in-1700."** Here, the contrast is temporal rather than spatial. P is Industrial Britain (1850), Q is Pre-Industrial Britain (1700). Since the geography and colonial access were largely constant between 1700 and 1850, coal and colonies cannot serve as difference-makers in this specific contrastive frame (unless one argues their *utilization* changed). Instead, this foil highlights endogenous processes: the accumulation of human capital, the evolution of patent laws, or the scientific revolution's application to technology. An explanation adequate for Pomeranz's spatial foil (contingent resources) is inadequate for this temporal foil (internal development), even though both address "British Industrialization."

  Now consider the foil: **"The Yangzi Delta rather than the Po Valley."** This shifts the focus from "Why the West?" to "Why anywhere?" If the question is why the Yangzi did not industrialize, the Po Valley serves as a control within the "advanced agrarian" class. If neither industrialized, the explanation for Britain's success must rely on factors unique to Britain, not factors common to advanced agrarian societies (like commercialization or high farming). This foil undermines explanations that rely on "European exceptionalism" broadly and forces a focus on hyper-local contingencies (e.g., specific British mineral geography vs. Italian mineral geography).

  In each case, the "facts" of history remain the same, but the *explanatory relevance* of those facts shifts. Contrastivism captures this perfectly: causal relevance is not an intrinsic property of an event but a relation between the event, the fact, and the foil.

  ### Where the Theory Runs Out: Foil Selection and Substantive Disagreement

  If contrastivism accurately describes the logic of the debate, does it resolve it? Here the theory encounters its limits. Contrastivism is a pragmatic theory of explanation; it clarifies the conditions under which an answer counts as an explanation relative to an interest. It is not a theory of historical significance.

  **1. The Normative Gap:** Contrastivism cannot tell us which foil is the *right* one. Is the historically significant question "Why England and not China?" or "Why England and not the Yangzi?" or "Why 1850 and not 1700?" Pomeranz and his critics argue as if one explanation is objectively truer, but contrastivism suggests they are answering different questions. This risks reducing a substantive historical dispute to a verbal one. If the disagreement is merely about foil selection, then Pomeranz and Weber are not contradicting each other; they are just speaking different pragmatic languages. However, historians feel the stakes are real: did culture *cause* the divergence, or did coal? Contrastivism treats this as a difference in explanatory context, but it cannot adjudicate which context reveals the "deep" causes of history versus the "proximate" ones. It lacks a metric for foil importance.

  **2. Substantive vs. Verbal:** By framing the dispute as contrastive, we might conclude the disagreement is partly verbal. However, there remains a substantive core: empirical claims about the similarity of the Yangzi and England. If Pomeranz is empirically wrong about living standards, his foil collapses, and the Old Guard's cultural explanation regains difference-making status. Contrastivism handles the logic, but it still relies on empirical truth conditions for the relata (P and Q).

  **3. The Needham Problem (Science vs. Industrialization):** The prompt rightly distinguishes Needham's question (Science) from the economists' question (Industrialization). These demand different contrast classes.
  *   **Needham's P:** Modern Science. **Needham's Q:** Chinese Proto-science.
  *   **Economic P:** Industrial Wealth. **Economic Q:** Agrarian Wealth.
  Modern science emerged in Europe (16th/17th century) long before the industrial takeoff (18th/19th century). China had technology but not the specific epistemic framework of modern science. If we ask "Why Modern Science in Europe rather than China?", the Yangzi Delta's 18th-century market data is irrelevant. The foil must be intellectual and institutional (e.g., "Why Galileo rather than Shen Kuo?").
  Contrastivism exposes that "The Great Divergence" is a conflation of two distinct contrastive queries. The "Needham Question" requires a foil sensitive to epistemic cultures; the "Pomeranz Question" requires a foil sensitive to ecological and economic constraints. Treating them as one question creates confusion. Contrastivism disentangles them, showing that an explanation for Science (e.g., Greek logic + Renaissance humanism) may not be an explanation for Industry (e.g., Coal + Colonies), because the foils differ.

  ### Reverse Analysis: Vindication or Fatal Gap?

  Running the analysis in the other direction, does the Great Divergence literature vindicate contrastivism?

  **Vindication:** The literature strongly supports the descriptive claim of contrastivism. The persistent inability of historians to agree on a single "cause" is best explained by the fact that they are implicitly operating with different foils. When Pomeranz changed the foil, the "best explanation" changed instantly without new data on British culture. This confirms Lipton's view that explanation is driven by the selection of the contrast class. The debate validates the idea that there is no "bare why."

  **The Fatal Gap:** However, the controversy also exposes contrastivism's silence on foil selection as a potential weakness. In history, we do not just want *an* explanation; we want the *significant* one. If contrastivism allows any foil to generate a valid explanation, it risks radical relativism. If I ask "Why Britain rather than Mars?", the answer "Britain has oxygen and Mars does not" is contrastively valid but historically trivial.
  The Great Divergence debate is not just about finding *a* difference; it is about finding the *historically potent* difference. Historians argue that Pomeranz's foil is *better* because it controls for variables, not just because it is a foil. This implies there are epistemic virtues in foil selection (e.g., similarity in all respects except the outcome) that contrastivism itself does not codify. Contrastivism describes the mechanism of explanation but offers no guidance on how to choose the question that yields historical understanding rather than mere logical satisfaction.

  ### Conclusion

  The Great Divergence debate serves as a powerful case study for the contrastive theory of explanation. It demonstrates that causal claims are not absolute but are indexed to the foil: "Culture" explains Europe vs. China, while "Coal" explains England vs. Yangzi. The theory successfully disentangles the Needham Question (Science) from the Economic Divergence (Industry) by showing they rely on distinct contrast classes.

  However, the debate also highlights the limits of contrastivism. While it clarifies *how* historians explain, it cannot tell them *what* to explain. It treats the choice of foil as a pragmatic precondition, leaving the normative judgment of historical significance outside its scope. Consequently, contrastivism vindicates the logical structure of the dispute but remains silent on its resolution. It reveals that the historians' disagreement is structurally contrastive, but it cannot decide whether the divergence was ultimately a story of deep cultural roots or contingent ecological luck, because that decision rests on which foil we deem worthy of our curiosity—a choice that philosophy alone cannot make.
