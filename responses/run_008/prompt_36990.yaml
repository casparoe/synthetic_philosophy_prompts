      *   *Conclusion:* Summarize. The debate validates the descriptive power of contrastivism but highlights its normative silence.

  3.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Need to mention Needham immediately. Set up the P/Q structure.
