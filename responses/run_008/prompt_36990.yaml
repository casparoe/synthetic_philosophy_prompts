      *   *Historiography:* Pomeranz is the key pivot. Before him, the foil was "China" as a monolith vs. "Europe" as a monolith. Pomeranz narrowed the foil to "Yangzi Delta" to make the comparison fair (apples to apples). This makes "culture" drop out (since both had similar cultures/markets) and "coal/colonies" stand out.
