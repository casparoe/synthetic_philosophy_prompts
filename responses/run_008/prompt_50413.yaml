answer: |-
  This is a translation task between two formal languages that share vocabulary but differ in grammar and ontology. You are fluent in the *calculus* of belief (Bayesianism); Keynes was constructing a *logic* of belief (Logical Probabilism).

  Here is the translation of Keynes's *A Treatise on Probability* (1921) and his later economic uncertainty into your working vocabulary, followed by the residue report you asked for.

  ---

  ### Part 1: Keynes in Bayesian Vocabulary

  #### 1. Logical Probability vs. Subjective Priors
  **Keynes:** Probability is not a frequency, nor is it a degree of psychological belief. It is an objective logical relation between two propositions: evidence ($h$) and conclusion ($a$). He writes this as $a/h$. If $h$ entails $a$, probability is 1. If $h$ contradicts $a$, probability is 0. In between, it is a partial entailment.
  **Your Translation:** This is **Objective Bayesianism** (Jaynes/Jeffreys style), but stricter.
  *   In your workflow, a prior $\pi(\theta)$ represents your state of knowledge. For Keynes, the "prior" is determined solely by the logical structure of the information $h$.
  *   **The Fit:** It sits closest to **Maximum Entropy** or **Reference Priors**. You choose a prior because logic dictates it is the only one consistent with the constraints of $h$.
  *   **The Friction:** You allow subjective priors (coherent betting quotients). Keynes rejects this. For him, if two agents have the same $h$, they *must* have the same $a/h$. If they differ, one is making a logical error, not just expressing a different preference.

  #### 2. Non-Numerical and Incomparable Probabilities
  **Keynes:** Not all relations $a/h$ are measurable by numbers. Some can be ordered ($a/h > b/k$), but some cannot be compared at all. There is no common unit of measurement for all probabilities.
  **Your Translation:** This is **Imprecise Probability** (Walley's Credal Sets) or **Partial Orderings**.
  *   In your standard toolkit, "every prior is a distribution" implies completeness. You can always compare $P(A)$ and $P(B)$.
  *   To model Keynes here, you must move from a single prior $\pi(\theta)$ to a **set of priors** $\Gamma$.
  *   **Incomparability:** This corresponds to a failure of the **Completeness Axiom** in decision theory. You cannot construct a likelihood ratio between two models because the logical bridge doesn't exist. It is not that the integral is hard to compute; it is that the measure is undefined.
  *   **Operationalization:** Instead of a posterior $P(\theta|y)$, you have a lower and upper posterior probability, $\underline{P}(A|y)$ and $\overline{P}(A|y)$. If $\underline{P}(A) < \overline{P}(A)$, the probability is indeterminate.

  #### 3. The "Weight" of an Argument
  **Keynes:** Weight ($V$) is distinct from Probability ($P$). $P$ is the balance of evidence *for* vs. *against*. $V$ is the *amount* of relevant evidence upon which the probability is based.
  *   Example: A coin tossed 10 times (5H) has $P(Head) \approx 0.5$. A coin tossed 10,000 times (5,000H) has $P(Head) \approx 0.5$. The probability is the same; the *weight* is vastly higher in the second case.
  *   Crucially: New evidence can increase weight while decreasing probability (e.g., finding a defect in the coin mechanism).
  **Your Translation:** This is **not** sample size ($N$), nor is it posterior concentration (variance).
  *   **Sample Size:** In your framework, increasing $N$ usually increases $P$ (towards 0 or 1) and decreases variance. Keynes says $P$ can stay static while $V$ grows.
  *   **Posterior Concentration:** You might think Weight $\approx 1/\text{Var}(\theta|y)$. Keynes would say no. You can have a very tight posterior based on a fragile model assumption (High Concentration, Low Weight).
  *   **Best Bayesian Analog:** Weight is **Robustness** or **Stability** of the posterior to perturbations in the model class.
      *   Low Weight: The posterior is highly sensitive to the choice of prior or likelihood structure.
      *   High Weight: The data is so "relevant" and "complete" that the posterior is stable across a wide set of reasonable priors/models.
      *   It is the **Effective Information Content** regarding the *structure* of the problem, not just the parameters.

  #### 4. Radical Uncertainty (The Later Economics)
  **Keynes:** In the *General Theory* (1936), he argues that for long-term investment (e.g., "prospect of a European war," "price of copper in 20 years"), there is no scientific basis to form a calculable probability. It is not that the probability is low; it is that the probability **does not exist**.
  **Your Translation:** This is **Structural Model Uncertainty** taken to the limit.
  *   **Standard Bayes:** You handle this by defining a model space $\mathcal{M} = \{M_1, M_2, ...\}$ and putting a hyper-prior $P(M_i)$. You update $P(M_i|y)$.
  *   **Keynesian View:** The set $\mathcal{M}$ is undefined. You cannot list the possible models. Therefore, you cannot place a prior on them.
  *   **The "No Distribution" Claim:** This is not just "misspecification" (where the true $\theta$ is outside your support). It is the claim that the *generative process itself* is non-stationary and non-ergodic in a way that precludes defining a sample space.
  *   **Operationalization:** You cannot write down a likelihood $L(y|\theta)$. Therefore, Bayes Rule $P(\theta|y) \propto L(y|\theta)\pi(\theta)$ cannot initialize. You are forced to rely on "conventions" (social heuristics) rather than calculation.

  ---

  ### Part 2: The Residue Report

  Here is the audit of the translation. Where does the mapping hold, where does it distort, and where does it break?

  #### 1. Clean Translations
  *   **Logical Probability $\approx$ Objective Bayes/MaxEnt:** This translates well. If you restrict yourself to priors derived solely from information constraints (entropy maximization), you are effectively doing Keynesian logical probability.
  *   **Weight $\approx$ Robustness/Sensitivity:** Interpreting weight as the stability of inference under prior/model perturbation is faithful. It captures the intuition that "more evidence" means "less dependence on arbitrary assumptions."
  *   **Non-Numerical $\approx$ Credal Sets:** Moving from point estimates to sets of distributions (Imprecise Probability) captures the non-numerical claim without loss of fidelity.

  #### 2. Distorted Translations (Where I smuggled in Bayes)
  *   **"Set of Priors" vs. "No Relation":** When I translated "incomparable probabilities" to "Credal Sets," I smuggled in a Bayesian assumption. A Credal Set assumes there *is* a set of valid distributions bounded by upper/lower limits. Keynes sometimes implies there is *no* logical relation at all, not even an interval. He denies the existence of the measure, whereas Imprecise Probability assumes the measure exists but is set-valued.
  *   **Weight vs. Information:** In your toolkit, information is additive (Fisher Information, KL Divergence). For Keynes, Weight is not necessarily additive. A new piece of evidence might change the *relevance* of old evidence, altering the weight non-linearly. Translating Weight to "Effective Sample Size" or "Robustness" imposes a metric on something Keynes thought might be ordinal only.
  *   **Model Space:** In translating "Radical Uncertainty" to "Undefined Model Space," I implicitly assume that *if* we could define the space, we could do Bayes. Keynes's stronger claim is that the future is *created* by decisions, not sampled from a pre-existing urn. This ontological difference (creation vs. sampling) is lost in the "undefined model space" translation.

  #### 3. Untranslatable / Core Conflict
  *   **Coherence vs. Logic:** Your toolkit is built on **Coherence** (avoiding Dutch Books). If you assign probabilities, they must sum to 1, or you lose money. Keynes's system allows for **Incoherence** if the logical relations are undefined. He would say, "It is not irrational to refuse to bet on the outbreak of a war in 10 years, even if you cannot assign a probability." Your framework forces you to assign a number (even if uniform) to remain coherent. Keynes says coherence is not required when the logical relation is absent.
  *   **The Ontology of Chance:** You treat probability as a tool for managing information about a world. Keynes treats probability as a feature of the logical connection between propositions. For you, probability is epistemic (about knowledge). For Keynes, it is logical (about truth relations). This seems subtle, but it means you can have a "personal probability" about anything; Keynes says you can only have a probability where logic permits.

  ---

  ### Part 3: The Verdict

  **Is "some probabilities aren't comparable" a substantive claim your representation can't express, or just an admission that he never committed to a representation?**

  It is a **substantive claim** that standard Bayesianism cannot express without distortion.

  1.  **Substantive Claim:** Keynes is attacking the **Completeness Axiom** of Expected Utility Theory. He is arguing that rational agents *should not* have a preference ordering between certain gambles because the evidence does not support one over the other. Standard Bayesianism (Savage/de Finetti) treats this as a failure of the agent to think hard enough to produce a prior. Keynes treats it as a feature of the evidence itself.
  2.  **The Missing Tool:** Your toolkit is missing a formal mechanism for **suspended judgment** that isn't just "high variance."
      *   In your world, high variance means "I'm not sure which value is true."
      *   In Keynes's world, undefined probability means "I'm not sure there *is* a value to be true."
      *   **Imprecise Probability** (Walley) is the closest existing field that fixes this, but it is often treated as a niche extension rather than core curriculum.

  **Was Keynes less clear than his fans think?**

  Yes, but not in the way you might hope.
  *   **Vagueness:** He never provided a calculus for computing logical probabilities. He says they exist objectively, but gives no algorithm to find them (unlike Jaynes's MaxEnt). This leaves his "Objective Logical Probability" hanging as a Platonic ideal without a computational engine.
  *   **The "Weight" Metric:** He admits he cannot define a mathematical function for Weight. He knows it increases with relevant evidence, but he cannot write $V = f(h)$. This makes it philosophically robust but statistically inert in his original formulation.

  **Final Assessment:**
  You are not missing a trick; you are working in a system (Coherent Subjective Bayes) that explicitly axiomatized away the problems Keynes was obsessed with (Incomparability and Radical Uncertainty) to make the math tractable.
  *   If you want to be faithful to Keynes, you must adopt **Imprecise Probabilities** (sets of distributions) and allow for **Incomplete Preference Orderings**.
  *   If you stick to standard priors/posteriors, you are implicitly assuming that a logical relation *always* exists and *is always numerical*. Keynes's main contribution is the warning that this assumption is often false in the "long run" (economic/social systems), leading to overconfidence (calibration failure) when the "weight" of evidence is low, even if the posterior is tight.

  **The "Weight" insight you should steal:**
  Use **Prior Sensitivity Analysis** not just to check robustness, but as a proxy for Weight. If your posterior changes drastically when you perturb the prior within a "reasonable" class, your Weight is low. Do not trust the posterior concentration (variance) as a measure of certainty in that case. That is the Keynesian correction to standard Bayesian calibration.
