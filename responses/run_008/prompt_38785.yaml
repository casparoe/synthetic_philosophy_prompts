          *   Layer 2: The Commensurability Problem. Highlight the incommensurability of "English language" vs. "Famine."
          *   Layer 3: The Ethical Framework. Utilitarianism (Ferguson) vs. Deontology/Justice (Tharoor).
      *   *Section 2: Is it One Disagreement?* Argue that while they are stacked, Layer 3 drives the bus. If you reject the ledger (Layer 3), Layers 1 and 2 don't matter. So it *is* fundamentally one disagreement (moral), disguised as two others.
      *   *Section 3: Verbal vs. Substantive.* Layer 2 is partly verbal (definitions of development). Layer 3 is substantive ethics. Layer 1 is substantive history but unknowable.
      *   *Section 4: Can Progress Be Made?* Be honest. No "verdict" is possible. But "progress" can be redefined as methodological literacy.
