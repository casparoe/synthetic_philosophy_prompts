      *   **Handicap Principle (Peacock):** Signal is costly to produce regardless of quality, but high-quality individuals can afford it better (marginal cost is lower for them). Example: Big tail.
      *   **Gazelle Stotting (Condition-Dependent/Integrity Signal):** Signal is costly *only if* the sender is lying/low quality. If you're fast, stotting doesn't cost you much (you can still outrun the cheetah). If you're slow, stotting wastes energy you need to run, getting you caught. It's an "honest signal of ability to escape."
      *   **Bonding/Collateral:** Cost paid upfront that is refunded or outweighed if true, but lost if lying.
      *   **Screening vs. Signaling:** Signaling is initiated by the informed party (applicant) to reveal type. Screening is initiated by the uninformed party (employer) to sort types. Sometimes actions serve both (e.g., education signals ability but also builds human capital).
