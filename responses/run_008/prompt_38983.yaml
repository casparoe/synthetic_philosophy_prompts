prompt: |-
  hey, quick context: I'm making my first real hires for my startup (seed stage, four of us in a shed of an office) and my flatmate, an evolutionary biology postdoc, has thoroughly poisoned my brain with signaling theory. he spent an hour the other night on the handicap principle — peacock tails, gazelles stotting at cheetahs instead of just running away — and now I can't read a cover letter without wondering if I'm looking at a tail feather.

  here's what I want from you. I've listed some things applicants actually did in the batch I just went through, and I want you to rate each one on a 0-10 scale for how well it works as a handicap-style signal, meaning how much of its information value comes from being costly in a way that low-quality applicants couldn't fake or wouldn't be willing to pay. a sentence each on the number, and at the end I want a paragraph on which ones are more like the gazelle than the peacock, because my flatmate insists those are two different kinds of signal and I only half followed why (something about the gazelle's signal being costly only if she's lying?). also, he said something about signals where the cost is paid mostly by bluffers, like posting a bond — if any of these fit that better than the peacock pattern, say which and why. and flag anything that's really screening rather than signaling, where the costly thing also builds the trait being signaled, since he claims that distinction matters and I'd like to know if it does here.

  the behaviors: quitting a cushy consulting job to join us at half the salary; agreeing to an unpaid two-week trial; a long, specific cover letter referencing obscure stuff from our old blog posts; openly admiting mid-interview that they bombed a technical question; listing marathon running under hobbies; refusing the take-home assignment on principle; asking pointed questions about our runway and my cofounder's past exits; and a side project that is weirdly, gratuitously overengineered.

  please write it as continuous prose like an email, no headings, no bullet points, no bold, no tables, with the ratings just inline. and one last thing: give me an honest take on whether any of these is a negative signal dressed up as a costly one, where the person is optimizing for me noticing the cost rather than actually having the trait. I'm worried that's what the overengineered side project is.
