answer: |-
  Subject: Re: signaling theory and hiring

  Hi there,

  It sounds like your flatmate has successfully hijacked your hiring brain, but honestly, applying evolutionary biology to seed-stage recruitment is sharper than most playbook advice you will find online. Going through your list with that handicap lens in mind, quitting a cushy consulting job to join at half salary rates a 9 because the opportunity cost is massive and only someone genuinely confident in their ability to create value elsewhere would burn that bridge. Agreeing to an unpaid two-week trial gets an 8 since the time cost is high and risky, acting as a strong filter for those who know they can deliver quickly. A long, specific cover letter referencing obscure blog posts is a 6 because while the research effort is costly, it is easier for a smooth talker to fake diligence than actual engineering skill. Openly admitting mid-interview that they bombed a technical question scores a 7 as it incurs a social cost and risks rejection, signaling high self-awareness and security. Listing marathon running under hobbies is only a 4 because while the physical discipline is costly, it correlates poorly with startup grit and is notoriously easy to exaggerate on a resume. Refusing the take-home assignment on principle is a 7 because it signals high market demand and confidence, though it risks coming off as arrogance rather than strength. Asking pointed questions about runway and cofounder exits rates an 8 since it risks offending the founder but demonstrates the sophistication needed to evaluate risk themselves. Finally, the side project that is weirdly gratuitously overengineered lands a 5 because while the time cost is real, it signals a preference for complexity over utility which might be dangerous for us.

  Your flatmate is right to distinguish the gazelle from the peacock because the cost structure differs fundamentally between the two. The peacock tail is a handicap that is costly for everyone to produce and maintain, but high-quality males can afford the burden better than low-quality ones, whereas the gazelle stotting is a signal that is only costly if the sender is lying about their ability to escape. In our context, admitting a mistake or asking pointed questions are more gazelle-like because the cost is primarily social risk that a competent candidate can afford to absorb without hurting their chances, whereas a weak candidate would fear the rejection too much to try. Quitting a job or building a project is more peacock-like because the resource cost is paid regardless of truth, but high-ability candidates expect a higher return on that investment.

  Regarding the signals where the cost is paid mostly by bluffers, the unpaid trial functions most like a bond or collateral because the candidate puts skin in the game that is only refunded via a job offer if they are truly high quality. A bluffer would not willing pay that time cost because they know they will fail the trial and lose the investment, whereas a true expert expects to pass and recoup the cost with interest. You should also flag the unpaid trial and the overengineered project as bordering on screening rather than pure signaling because the costly action itself builds or reveals the trait being measured. In screening, the employer designs the cost to test the trait directly, like a trial period testing output, whereas signaling is the applicant choosing a cost to reveal hidden information, like quitting a job to reveal confidence.

  On your last worry, you are correct to be suspicious of the overengineered side project as a negative signal dressed up as a costly one. This is often a case of optimizing for the signal rather than the trait, where the candidate builds complexity to impress rather than to solve a problem, which signals poor engineering judgment in a resource-constrained startup environment. It is a costly signal, but it signals the wrong type of quality, much like a peacock growing a tail so heavy it cannot fly, and in a shed of an office, you need people who can fly before they look pretty.

  Best,

  Your Assistant
