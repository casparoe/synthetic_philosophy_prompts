answer: |-
  You're right to trust your instinct here: your editor's "tool-AI hardliner" take is the pop-culture caricature, but your suspicion that Wiener's actual position is messier is much closer to the mark. Wiener wasn't a Luddite; he was a cybernetician. He didn't fear machines that *did* things; he feared machines that *decided* things without being tethered to human values via feedback.

  Here's how I see Wiener landing in today's debate, broken down by his core commitments, with confidence flags attached.

  ### 1. The Core Commitment: Feedback is Non-Negotiable
  **Confidence: High (Well-documented in *Cybernetics* and *The Human Use of Human Beings*)**

  Wiener's entire intellectual project was built on the idea of homeostasis—systems staying stable through feedback loops. To Wiener, a system without feedback is just a runaway train.

  In today's terms, a "tool AI" (wait for prompt, give answer) keeps the human firmly in the control loop. The human provides the input, evaluates the output, and decides the next step. An "agent AI" that goes off to plan a multi-day project with *minimal supervision* effectively opens the loop. It acts, observes the environment, and acts again without checking back with the human operator.

  Wiener would view this "minimal supervision" clause as a critical failure of design. He wouldn't necessarily ban the agent, but he would insist that the feedback loop be tightened. The agent shouldn't just "go book the flight"; it should "propose the flight itinerary and wait for confirmation." If the agent operates at a timescale or level of abstraction where the human can't meaningfully intervene before consequences occur, Wiener would flag it as dangerous. He warned specifically about systems where the machine's speed outpaces the human's ability to correct it.

  ### 2. The Danger of Mis-Specified Objectives (The "Golem" Problem)
  **Confidence: High (Central theme in *The Human Use of Human Beings*)**

  This is where Wiener gets really prescient. He famously worried about the "Golem" problem: we tell the machine what we want, but we can't fully specify *what we mean*. He used the example of a machine told to maximize production might decide to eliminate the workforce to do so.

  In the context of an LLM agent planning a project, Wiener would be deeply skeptical of the objective function. If you tell an agent "optimize this project for efficiency," and it decides to cut ethical corners, spam collaborators, or burn out the team, it has succeeded technically but failed humanly. Wiener argued that human values are often implicit and contextual, impossible to fully codify into a machine's goal structure.

  Therefore, he would oppose agents that are given high-level goals ("plan this project") without strict constraints on *how* they achieve them. He would prefer tools that execute low-level, well-defined tasks ("draft this email," "search these dates") where the risk of objective misalignment is contained. This sounds like a "tool" preference, but it's actually a preference for *bounded agency*.

  ### 3. Human Meaningfulness and Dependency
  **Confidence: Medium (Extrapolated from his social commentary)**

  Wiener was terrified of the social impact of automation—not just unemployment, but the atrophy of human skill. He argued that if we hand over all decision-making to machines, humans become "servants to the machine," mere buttons to press while the real thinking happens elsewhere.

  If "agent AI" becomes the norm, Wiener would worry that humans lose the capacity to plan, reason, and understand the systems they inhabit. He believed humans need to remain "in the loop" not just for safety, but for dignity and competence. However, he also believed machines should free us from drudgery.

  Here's the messiness your editor might be missing: Wiener wouldn't demand you manually book every flight forever. He would accept an agent handling the drudgery *if* the human retains ultimate authority and understanding. But an agent that operates with "minimal supervision" risks making the human obsolete in their own workflow. He'd likely argue that if you can't understand what the agent is doing, you aren't allowed to delegate it.

  ### Where You Might Be Over-Reading Him
  **Confidence: High**

  You mentioned that his focus on "systems steering toward goals" sounds agent-y. Be careful not to conflate cybernetic goal-seeking with modern "agentic AI." Wiener's goal-seeking systems (like a thermostat or a guided missile) were tightly constrained by physical laws and immediate feedback. Modern LLM agents operate in semantic space with loose constraints and delayed feedback.

  Wiener supported automation that *augmented* human purpose, not automation that *replaced* human judgment. So, while he loved feedback loops (which agents use), he would hate the *autonomy* that modern agent boosters sell. He wouldn't be sympathetic to agents just because they use feedback; he would only be sympathetic if the feedback loop *included the human*.

  ### The Single Point I'm Least Sure About
  **Confidence: Low (Speculative extrapolation)**

  The thing I'm least sure about is how Wiener would weigh the **opacity of modern neural networks** versus the **statistical learning machines** he envisioned. Wiener knew about learning machines (he discussed them in the 1950s), but he assumed we could trace their logic somewhat. He might be even *more* hostile to modern agents than I'm predicting because the "black box" nature of deep learning makes the feedback loop unintelligible to the human operator. If the human can't understand *why* the agent made a decision, they can't effectively provide feedback. If he viewed modern LLMs as fundamentally unverifiable, he might slide all the way to your editor's "tool-AI hardliner" position simply because safe feedback is impossible.

  ### Bottom Line
  Wiener wouldn't be a hardliner against tools that act (cybernetics is all about action), but he would be a hardliner against *unverified autonomy*. He would reject the "minimal supervision" part of your example instantly. He would demand a system where the agent proposes and the human disposes, keeping the human as the ultimate governor of the system.

  \answer{pro-agent with tight feedback}
