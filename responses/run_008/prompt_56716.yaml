prompt: |-
  I'm a journalist who mostly covers science and ideas, and I'm working on a piece about the fight between "tool AI" and "agent AI" people — you know, the debate over whether we should build systems that just answer questions when asked versus systems that go off and autonomously plan, browse, book flights, write and run code, etc. For the piece I've been going back to Norbert Wiener, the cybernetics guy, since he was freaking out about machine autonomy way before it was cool. He was pretty adamant that we shouldn't hand decisions over to machines whose objectives we can't fully specify or check, and he worried a lot about humans becoming dependent on automated systems we no longer understand. I'm assuming a reasonable amount of knowledge about Wiener's actual views here, and honestly part of why I want your take is to sanity-check how much of his position is remembered correctly versus pop-culture caricature.

  So here's my question for you: if you had to predict where Wiener would land in today's tool-versus-agent debate, where would he land, and why? My editor's instinct is that he'd obviously be a tool-AI hardliner, but I suspect it's messier than that — he was all about feedback loops and systems steering toward goals, which sounds kind of agent-y, so maybe he'd be more sympathetic to agents with tight oversight than the cartoon version of him suggests. Walk me through the reasoning from his actual commitments (feedback, the danger of mis-specified objectives, human meaningfulness in a world of automation) to a prediction about, say, an LLM-based agent that plans a multi-day project with minimal supervision. And tell me where you think I'm misremembering or over-reading him, if I am.

  Please be upfront about how confident you are in each part of the claim — flag which bits rest on solid, well-documented Wiener and which bits are more speculative extrapolation — and call out the single point you're least sure about. Write in American English, keep it conversational since I may quote from it, and end with a machine-readable verdict line, like \answer{tool-AI hardliner} or \answer{pro-agent with tight feedback} — a short label capturing your bottom-line prediction for Wiener.
