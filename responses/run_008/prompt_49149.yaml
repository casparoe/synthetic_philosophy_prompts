answer: |-
  ### I. The Debate Restated in Labor-Economic Vocabulary

  **1. Sahlins: The High-Real-Wage/Low-Labor-Supply Equilibrium**
  Sahlins' *Original Affluent Society* thesis is fundamentally a claim about the production possibility frontier and the labor-leisure trade-off. He argues that hunter-gatherers operated at a high marginal product of labor in caloric terms. Because their utility function placed a high weight on leisure (or satiated quickly on consumption), their labor supply curve was backward-bending or highly inelastic at low hours.
  *   **Time Budgets:** Sahlins cites time-allocation studies (e.g., !Kung, Arnhem Land) suggesting a "working week" of 15–20 hours for subsistence. This implies a high real wage ($w = \text{calories}/\text{hour}$), allowing for high discretionary time.
  *   **Preferences:** He posits two roads to affluence: the Galbraithian road (high production) and the Zen road (low wants). In your vocabulary, this is a claim that forager indifference curves are shaped such that the optimal bundle $(C^*, L^*)$ is reached with minimal labor input $H$.
  *   **Risk:** Sahlins implies low variance in consumption through mobility (option value to move to better patches) rather than storage.

  **2. The Anthropological Backlash: Selection Bias and Measurement Error**
  Critics (e.g., Kelly, Bird-David, subsequent time-allocation meta-analyses) attack the econometrics of Sahlins' claim.
  *   **Data Representativeness:** The forager groups studied were not a random sample of the prehistoric distribution. They were survivors in marginal environments (deserts, arctic) or high-productivity niches, introducing sample selection bias.
  *   **Measurement of Hours:** Critics argue Sahlins underestimated the shadow price of time by excluding food processing, tool maintenance, and travel time. When "household production" time (Becker style) is fully accounted for, the labor supply $H$ increases significantly, lowering the implied real wage.
  *   **Seasonality:** Time-use data often capture lean or fat seasons incorrectly. The variance in labor supply over the annual cycle is higher than cross-sectional snapshots suggest, implying greater consumption smoothing challenges.

  **3. Diamond: The Malthusian Trap and Negative Productivity Shock**
  Diamond's *Worst Mistake* argument is a dynamic Malthusian model with negative shocks to human capital and increased inequality.
  *   **Malthusian Dynamics:** Agriculture increased Total Factor Productivity ($A$) initially, but this surplus was not converted into higher consumption per capita ($c = C/L$). Instead, it relaxed the Malthusian constraint, leading to population growth ($L \uparrow$). Due to diminishing returns to labor on fixed land, the long-run equilibrium resulted in lower $c$ and lower real wages than the foraging steady state.
  *   **Anthropometrics as Health Capital:** Diamond cites skeletal evidence (stature, enamel hypoplasia, porotic hyperostosis) as indicators of a deterioration in the health production function. Lower stature implies chronic caloric/protein deficiency during development; dental caries imply a shift in the consumption bundle toward high-carbohydrate, low-diversity goods.
  *   **Risk and Variance:** While agriculture allows storage (intertemporal smoothing), it increases exposure to systemic risk (crop failure, drought). The variance of consumption ($\sigma^2_c$) likely increased, raising the probability of tail-risk events (famine).
  *   **Inequality and Extraction:** Surplus allows for specialization and storage, which creates assets that can be expropriated. This introduces a principal-agent problem where elites (chiefs, states) extract rent from producers. In utility terms, the producer's budget constraint tightens due to extraction ($w_{net} < w_{gross}$), and the loss of mobility reduces their outside option/bargaining power.

  ---

  ### II. Residue Report

  **1. What Survives Translation Intact**
  *   **Malthusian Dynamics:** The mechanism by which surplus converts to population rather than living standards is perfectly captured by standard Malthusian growth models ($L$ adjusts until $w = \text{subsistence}$).
  *   **Anthropometrics:** Stature and dental pathology map cleanly onto "health capital" stocks and nutritional intake constraints.
  *   **Risk Profiles:** The trade-off between storage (smoothing) and systemic risk (variance) is standard expected-utility theory.
  *   **Time Budgets:** The core metric of hours worked vs. leisure is native to your framework.

  **2. What Is Distorted by Translation**
  *   **"Affluence":** In your framework, affluence is $U(C, L)$ maximization. Sahlins sometimes treats it as a cultural *constraint* on $C$. Translating this as a preference parameter ($\alpha$ in Cobb-Douglas) makes it look like a taste difference, whereas Sahlins implies a social technology for limiting wants.
  *   **"Mistake":** In policy evaluation, a "mistake" implies a deviation from an optimal path given information sets. Diamond's claim is often read as *ex post* regret, but modeled *ex ante*, it looks like a local maximum trap (lock-in). The economic vocabulary struggles to distinguish between "irrational choice" and "path dependence with high switching costs."
  *   **Inequality:** Economics models inequality as a distribution parameter (Gini) or utility interdependence. Diamond treats it as a structural change in property rights and coercion. Modeling coercion as a "price" distorts the involuntary nature of the constraint.

  **3. What Cannot Be Expressed**
  *   **Ontological Security:** The psychological cost of uncertainty vs. the psychological cost of drudgery. Foragers face high variance but high autonomy; farmers face lower variance (usually) but high routine. Your utility function can include "autonomy," but it cannot easily capture the *meaning* of the activity (hunting as social performance vs. farming as labor).
  *   **The Value of Mobility:** In labor econ, mobility is an option value. In the debate, mobility is a *political* technology—the ability to exit a bad social contract (the "exit option" in James Scott's work). This is a constraint on elite power, not just a consumption good.

  ---

  ### III. Addressing Your Suspicions

  **Suspicion 1: Sahlins' "Wanting Little" and Exogenous Preferences**
  You are correct to be suspicious. Standard labor economics treats preferences as exogenous and stable. Sahlins' "Zen road" implies endogenous preferences or, more accurately, **socially enforced satiation**.
  *   **Modeling Attempt:** You could model this as a **lexicographic preference** where leisure is prioritized until a subsistence threshold is met, after which the marginal utility of additional consumption drops to zero instantly. Alternatively, in a Beckerian household production model, foragers might produce "social status" or "ritual capital" more efficiently than "material stock." If status is relative and capped, labor supply remains low.
  *   **The Residue:** However, Sahlins is making a claim about the *formation* of wants, not just their structure. He argues that the mode of production (immediate return vs. delayed return) shapes the time preference and the utility function itself. Your vocabulary treats the utility function as a primitive. If the transition to agriculture changed the utility function (e.g., by introducing asset accumulation which triggers hedonic adaptation), then comparing welfare across the transition using a single $U(\cdot)$ is invalid.
  *   **Verdict:** The claim is constitutively about **preference endogeneity**. Your vocabulary leaves out the *mechanism* by which production technologies alter the weighting of goods in the utility function. It treats the "Zen road" as a parameter difference, not a structural consequence of the production mode.

  **Suspicion 2: Diamond's "Mistake" and the Non-Identity Problem**
  This is the Non-Identity Problem (Parfit) arriving in deep time, but it manifests in your framework as a choice of **Social Welfare Function (SWF)** under population change.
  *   **The Conflict:**
      *   **Total Utilitarianism:** If agriculture supported 100x more people at 50% utility, Total Welfare might be higher.
      *   **Average Utilitarianism:** Diamond clearly evaluates based on Average Utility (quality of life per capita).
  *   **Ex Ante/Ex Post:** If we evaluate *ex ante* (before the transition), did early adopters expect the Malthusian trap? If they had rational expectations, they accepted lower future $c$ for higher current $N$ (or survival probability). If they had imperfect information, it was a learning error.
  *   **The Failure:** Your *ex ante/ex post* apparatus assumes a fixed population or a representative agent. It fails to capture that the "people who existed after" are a different set of agents than the counterfactual foragers. You cannot say the farmers are "worse off" than the foragers *would have been* because the farmers *would not have been*.
  *   **Verdict:** Diamond is implicitly using an **Average Utilitarian** SWF over the set of actual existents. He is claiming the *quality* of the average life declined. Your framework can model this, but it requires explicitly rejecting Total Utilitarianism. The "Mistake" is not a Pareto failure (since the populations are disjoint); it is a judgment that a world with fewer, healthier people is superior to a world with more, sicker people. This is a normative axiom, not an empirical finding.

  ---

  ### IV. Normative Weights: Autonomy, Hierarchy, and Mobility

  You asked what you would mis-model by treating these as consumption bundle entries.

  1.  **Autonomy as an Amenity:** If you treat autonomy as a good $A$ in $U(C, L, A)$, you imply it can be traded off against consumption. But for many critics, autonomy is a **constraint on the feasible set**, not a good. The transition to agriculture introduced *coercion* (states, elites, slavery). In your model, coercion looks like a tax or a wage reduction. But structurally, it changes the agent from a maximizer to a constrained optimizer subject to another agent's objective function. Modeling this as a "loss of autonomy goods" understates the shift from *choice* to *subjection*.
  2.  **Hierarchy:** Inequality in the debate isn't just variance in $C$. It's variance in *power*. In labor econ, we model power as bargaining weights. But the transition created *classes*. If the utility function of the elite depends on the subordination of the laborer (dominance preferences), then the laborer's utility is negatively interdependent with the elite's consumption. Standard models usually assume benign interdependence or ignore it.
  3.  **Mobility:** As noted, mobility is an **exit option**. In contract theory, the value of the outside option determines the division of surplus. Agriculture fixed assets (land, grain stores), reducing the outside option of laborers. This allowed elites to capture a larger share of the surplus. Treating mobility as just "travel time saved" or "leisure" misses its function as a **discipline device against exploitation**.

  ---

  ### V. Final Verdict

  **Does the residue point to vocabulary limitations or claim vagueness?**

  It is both, but primarily **vocabulary limitations regarding social ontology.**

  1.  **Vocabulary Limitations:** Your framework is exceptionally well-suited to evaluate the *Malthusian* and *Health* claims (Diamond's strongest points). Real wages, anthropometrics, and mortality variance translate perfectly. However, your framework assumes **methodological individualism** and **exogenous preferences**. It cannot natively model:
      *   The endogenous formation of wants (Sahlins' core insight).
      *   Coercion as a structural constraint rather than a price (The nature of hierarchy).
      *   The Non-Identity problem without adopting a specific, contestable Social Welfare Function (Average vs. Total).

  2.  **Claim Vagueness:** The anthropological claims often suffer from **conceptual conflation**. Sahlins mixes "low labor hours" (empirical) with "cultural satiation" (normative/psychological). Diamond mixes "health decline" (empirical) with "civilizational mistake" (normative).
      *   When Sahlins says "affluent," he sometimes means "high leisure" and sometimes "low stress." These are not the same in expected utility (variance matters).
      *   When Diamond says "mistake," he oscillates between "lower average utility" and "moral catastrophe."

  **Conclusion:**
  Your vocabulary can resolve the **positive** disputes (Did hours go up? Did stature go down? Did population density rise?). It forces clarity on the time-budget measurements and the Malthusian mechanics.
  However, your vocabulary **cannot resolve the normative core** of the debate without importing external ethical axioms. Specifically, it cannot determine whether the "Zen road" (low wants) is a valid welfare improvement without judging preferences, and it cannot declare agriculture a "mistake" without explicitly choosing an Average Utilitarian SWF over a Total Utilitarian one. The residue is not just noise; it is the **political philosophy** embedded in the transition from kinship-based reciprocity to state-based extraction, which labor economics typically models as a change in transaction costs rather than a change in the nature of human relations.
