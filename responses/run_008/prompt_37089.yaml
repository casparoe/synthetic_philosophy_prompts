answer: |-
  You have identified a genuine gap in the standard philosophical taxonomy. Your friend was pointing in the right direction with **sortals**, but that concept is typically treated as metaphysical or conceptual rather than administrative. The classical Ship of Theseus debate assumes the rules of the game are fixed and asks how to play; you are asking who writes the rules and why they differ for different pieces.

  The established philosophical neighborhood for this is **Institutional Ontology** (primarily associated with John Searle), combined with the ontology of artifacts (Amie Thomasson, Joseph Margolis). However, there is no single, common noun that specifically names *the diachronic persistence rules assigned by a community to a category of object.*

  Since no established term captures the "administered" and "category-relative" nature of these rules precisely enough for your work, I will propose a term that bridges the philosophical framework with your practical reality.

  ### The Concept: Institutional Persistence Conditions (IPCs)

  I propose the term **Institutional Persistence Conditions** (IPCs).

  An **IPC** is a set of community-administered rules that determine the diachronic identity (continuity over time) of an entity whose existence depends, in whole or part, on collective recognition.

  This concept refines your friend's suggestion of "sortals." A **sortal** (e.g., "ship," "person," "corporation") is a concept that supplies a principle of individuation and counting. Standard philosophy often treats sortals as discovering natural boundaries. **Institutional Persistence Conditions** acknowledge that for many artifacts and social entities, the sortal does not *discover* the boundary; it *legislates* it.

  #### 1. Relation to Nearest Neighbors

  *   **Sortals:** A sortal tells you *what* a thing is. IPCs tell you *how long* it stays that thing under stress. For natural kinds (a "tiger"), the IPCs are biological (metabolic continuity). For institutional kinds (a "museum ship"), the IPCs are normative (fabric retention + curatorial recognition). Your observation is that for artifacts, the sortal comes packaged with an IPC that is negotiable.
  *   **The Ship of Theseus:** The classical puzzle asks: "Given the rules of ship-identity, does this count as the same ship?" Your question is prior: "Who decided that 'ship-identity' relies on material continuity rather than functional continuity, and why does that differ for a fire engine?" The Ship of Theseus is a puzzle *within* an IPC; you are analyzing the *selection* of the IPC.
  *   **Social Construction:** This is the broad umbrella. All IPCs are socially constructed, but not all socially constructed facts are IPCs. "Money" is socially constructed (synchronic status). "This $10 bill remains the same unit of value despite wear" is an IPC (diachronic status). Your work concerns the *diachronic* layer of social construction.

  #### 2. The Mechanism: Status Functions

  The philosophical engine that makes IPCs work is what John Searle calls a **Status Function**. This is the capacity of a community to impose a status on an object via the formula: **X counts as Y in context C.**

  *   **Fire Engine:** X (a truck with a new chassis) counts as Y (the 1972 Engine) in context C (the volunteer brigade's operational and social sphere). The IPC here is *functional and nominal continuity*.
  *   **Museum Vessel:** X (a hull with 40% original timber) counts as Y (HMS *Victory*) in context C (the museum's exhibition standards). The IPC here is *material fabric continuity*.

  The "substance" you feel in these disputes comes from the fact that Status Functions create **Deontic Power**. Once the community agrees on the IPC, the object acquires rights, duties, and values attached to that identity. If you mislabel the boat, you aren't just making a verbal error; you are misallocating grant money, historical prestige, and legal liability.

  #### 3. Is the Dispute Substantive or an Illusion?

  You asked whether the appearance of substance is an illusion, given that the rules are conventions.

  **The Answer:** The rules are ontologically subjective (they depend on us), but the disputes are **epistemically objective**.

  This is a crucial distinction from Searle.
  *   **Ontological Subjectivity:** The IPC exists only because we agree it exists. If the museum closes and the curators disperse, the "HMS *Victory*" IPC may cease to apply, leaving only rotting wood.
  *   **Epistemic Objectivity:** Once the IPC is established, it is a matter of fact whether an object satisfies it. If the museum's IPC states "50% original fabric is required," and a hull has 40%, it is *objectively false* to call it the original ship within that regime.

  Therefore, your disputes are **genuine**. They are not merely verbal confusion; they are disagreements about which **Institutional Persistence Condition** applies to the object, or whether the object satisfies the currently accepted IPC. You can be *wrong* about the rules of chess, even though chess is a game we invented. Similarly, you can be wrong about the identity of the vessel, even though the identity conditions are conventional.

  #### 4. Boundary Cases and Authority

  You asked for a map of the phenomenon's edges. Here is how IPCs behave across different domains:

  | Entity Type | Primary IPC Driver | Administering Community | Authority Limit |
  | :--- | :--- | :--- | :--- |
  | **Corporation** | Legal Statute | State / Law | Dissolution filing or merger. |
  | **Museum Ship** | Historical Significance | Curators / Heritage Bodies | Loss of public trust or institutional collapse. |
  | **Fire Engine** | Operational Function | The Brigade / Volunteers | When the brigade disbands or retires the name. |
  | **Band** | Brand / Membership | Fans / Industry | When no members remain + name rights lapse. |
  | **Nation** | Sovereignty / Continuity | Citizens / Int'l Recognition | Conquest, dissolution, or loss of recognition. |
  | **Language** | Usage / Grammar | Speakers (Organic) | **Edge Case:** No central admin; IPCs drift organically. |
  | **Painting** | Material Fabric | Conservators / Art Market | **Edge Case:** Very low tolerance for replacement. |

  **The Authority Limit:**
  The administering community loses authority when **Collective Intentionality** evaporates.
  *   **Hard Limit:** The community ceases to exist (e.g., the volunteer brigade dissolves). The truck becomes just a truck.
  *   **Soft Limit:** The community fragments into rival groups with conflicting IPCs (e.g., a schism in a band, or a disputed government). In these cases, the identity becomes relative to the observer's alignment with a community.

  **Nations and Languages:**
  *   **Nations** fit the IPC model perfectly (legal continuity despite total population turnover).
  *   **Languages** are a boundary case. They have IPCs (mutual intelligibility, grammatical continuity), but there is rarely a central "administering community." They are *organically* sustained rather than *administratively* sustained. This is why language identity feels more "natural" than ship identity, even though both are conventional.

  ### A Map for Museum Disputes

  To distinguish substantive disagreements from confusion in your work, apply this three-step diagnostic:

  **1. Identify the Competing IPCs**
  Most disputes arise because two parties are applying different Persistence Conditions to the same object without realizing it.
  *   *Curator A:* "It's a **Historical Artifact** (IPC: Material Fabric)."
  *   *Curator B:* "It's a **Living Vessel** (IPC: Functional Continuity)."
  *   *Diagnosis:* This is a substantive disagreement about the *category*, not the facts. You must negotiate which IPC governs the object.

  **2. Check the Deontic Stakes**
  Ask: "What turns on this label?"
  *   If the label affects grants, legal status, or public trust, the IPC is **Active**. The dispute is substantive.
  *   If the label is purely poetic with no downstream consequences, the IPC is **Dormant**. The dispute is verbal/aesthetic.

  **3. Verify Community Recognition**
  An IPC requires a community to sustain it.
  *   *Question:* "If we label this a reconstruction, will our stakeholders (donors, public, peers) accept that status function?"
  *   If the community rejects the status function (e.g., the veterans' association refuses to salute a rebuilt ship), the IPC has failed, regardless of your physical conservation work.

  ### Summary

  You are managing **Institutional Persistence Conditions**.

  *   **The Term:** Institutional Persistence Conditions (IPCs).
  *   **The Mechanism:** Status Functions imposed by Collective Intentionality.
  *   **The Reality:** Ontologically subjective (we make the rules), but Epistemically objective (we can follow or break the rules).
  *   **The Boundary:** Authority holds as long as the relevant community sustains the collective intentionality.

  When your team debates the percentage of original hull, you are not debating physics; you are negotiating the **IPC** for that specific vessel. Recognizing this allows you to move the conversation from "Is this *really* the ship?" (a metaphysical dead end) to "Which Persistence Condition best serves the mission of this institution?" (a manageable policy decision).
