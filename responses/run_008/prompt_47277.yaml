  The practice does not strictly require the natural-law premise. While the Radbruch formula offers the most dramatic justification, the interpretive and international law grounds achieve the same result without denying the GDR's legal validity. Therefore, the practice presupposes a pragmatic pluralism rather than a single jurisprudential commitment. It assumes that transitional justice permits multiple doctrinal pathways to reach a morally necessary outcome. What is strictly required is only the conclusion that impunity is unacceptable; the theoretical route is optional. The courts' oscillation suggests they were uncomfortable relying solely on natural law, fearing the instability it introduces to domestic legal systems. Thus, the natural-law reasoning is ornamental or backup, used to signal moral condemnation, while the interpretive and international law grounds do the heavy lifting for legal stability. The practice presupposes that law serves justice, but it does not settle whether justice is internal to law (Fuller) or an external critique applied via new sovereignty or interpretation (Hart). It leaves the theoretical question open to maximize legitimacy across different audiences. This eclecticism allows the state to punish without committing to a revolutionary theory of law that might undermine future stability. It treats jurisprudence as a toolkit, not a constraint.

