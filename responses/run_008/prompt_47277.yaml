  (2) "The natural-law reconstruction"
  This approach aligns closely with Fuller's critique of positivism and Radbruch's post-war jurisprudence. It presupposes that law is not merely a system of rules issued by a sovereign but entails a moral threshold for validity. Under the Radbruch formula, statutory law loses its legal character when it contradicts justice to an intolerable degree. Therefore, the GDR border statutes were not merely bad laws; they were legally void *ab initio*. This dissolves the retroactivity objection: punishing the guards applies ordinary homicide law to acts that were never legally authorized because the purported authorization was null. There is no ex post facto punishment because there was no prior valid law to violate. This reconstruction prioritizes substantive justice over formal legality. It assumes a necessary connection between law and morality, where extreme injustice strips a command of its legal validity. For Fuller, this resonates with the "internal morality of law"; a system permitting arbitrary killing fails the procedural and substantive standards required to be called law. The court thus acts as a guardian of higher legal principles, declaring that the GDR regime's commands failed to achieve the status of law due to their moral depravity. It implies that legality is not a shield for atrocity. This justification is robust but risky, as it empowers judges to invalidate statutes based on moral evaluation. Hart would warn this introduces uncertainty, but the natural-law reconstruction accepts this cost to prevent moral catastrophe. It treats the legal system as inherently purposive, aimed at justice rather than mere order. This ensures justice is not sacrificed for certainty. Consequently, the guards had a moral duty to refuse orders, and the law recognizes this duty by refusing to validate the orders as legal.

  (3) "The positivist reconstructions"
  A positivist need not accept the Radbruch formula. Hart would argue the GDR laws were valid laws, however iniquitous. To convict without natural law, positivists use two strategies. First, the sovereign-replacement route: Upon reunification, the FRG became the sole sovereign. Its criminal law applies to the territory. However, this faces the *nullum crimen* hurdle unless one argues the FRG's jurisdiction overrides prior legality, which looks like retroactivity. Hart might accept this retroactivity as a "lesser evil" compared to impunity, acknowledging a clash between morality and law but choosing morality via new legislation. Second, the interpretive route: This claims the GDR statutes, properly interpreted according to GDR legal principles at the time, already prohibited disproportionate force. This maintains the positivist separation of law and morality. The law is what the sovereign commanded; if the sovereign commanded border security but also respected proportionality (via constitution or treaty), the guards violated valid GDR law. This avoids declaring the statute void; it simply argues the defendants misread the valid law. This preserves legal certainty while achieving justice. It treats the case as a matter of statutory interpretation, not moral invalidation. The international law ground also fits positivism if treaties are incorporated into domestic law. Thus, positivism can achieve the result by insisting the acts were illegal under the *actual* rules in force, avoiding the claim that unjust rules aren't law. This strategy protects the general principle that law is law, reserving moral criticism for the content rather than the validity. It allows the court to say, "You broke the law then," rather than, "The law then wasn't law." This avoids the slippery slope of judges invalidating statutes based on personal moral views, keeping the legal system stable while still punishing gross wrongs through careful doctrinal work. It suggests that legal validity depends on source, not merit, but that sources include constitutional constraints and international treaties which the GDR ignored. This preserves the rule of law even in transition.

