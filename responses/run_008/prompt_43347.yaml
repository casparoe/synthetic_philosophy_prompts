answer: |-
  This is the classic **Hart-Fuller Debate** (1958), dressed up in a trench coat. Your professor friend is channeling **Lon Fuller** (and Gustav Radbruch), arguing that law must have a moral minimum to count as law. You are being cornered into the **H.L.A. Hart** (positivist) position, but your friend is framing Hart's position as a moral failure rather than a descriptive truth.

  Your instinct is correct: **"Lawful" is pulling a double shift.** But the exit isn't just semantic; it's about what a theory of law is actually *for*.

  Here is how you escape the trap without surrendering premise (5) (the Rule of Law), and what it costs you.

  ### The Equivocation: Validity vs. Immunity

  The sleight of hand happens between **(3)** and **(4)**.

  *   **In (3), "Lawful" means *Valid*:** Did the action comply with the rules recognized by the system at the time? (Positivism says: Yes, the Nazi statutes were valid sources).
  *   **In (4), "Lawful" implies *Immunity*:** Does the fact that an action was valid at Time 1 create a moral shield against punishment at Time 2?

  Positivism says **No**. Positivism separates the *existence* of law from its *moral force*. Just because a rule was "law" in 1944 doesn't mean a new sovereign in 1948 is morally bound to honor the reliance interests of people who used that law to commit atrocities.

  ### The Step to Reject: (6)

  You should reject the inference in **(6)**: *"So positivism, once you take the rule of law seriously, implies the grudge informer trials were themselves unjust."*

  Here is the positivist counter-move (The Hart Position):

  1.  **Admit (1) through (4):** Yes, the Nazi statutes were formally valid. Yes, punishing the informers is technically retroactive.
  2.  **Hold (5) Tight:** Yes, retroactive punishment violates the Rule of Law.
  3.  **Break (6):** Violating the Rule of Law does not automatically make the trials *unjust all-things-considered*.

  **The Argument:** There are two types of justice at war here.
  *   **Procedural Justice (Rule of Law):** Requires no retroactivity.
  *   **Substantive Justice (Morality):** Requires that grievous wrongs be punished.

  Positivism doesn't say the trials were unjust. It says the trials faced a **tragic choice**. To achieve Substantive Justice (punishing the informers), the West German courts had to sacrifice a degree of Procedural Justice (non-retroactivity).

  **Why this saves Positivism:**
  A theory of law can be *true* (accurately describing that Nazi rules were valid laws) even if it leads to a *morally difficult* conclusion. The fact that reality is messy doesn't mean the map is wrong. Positivism accurately identifies the conflict: "We are punishing people for acts that were legal then." Natural Law tries to magic the conflict away by saying, "It wasn't law, so no conflict." Hart argues the Natural Lawyer is lying to feel better.

  ### The Cost: What You Are Buying

  If you take this exit, here is what you are signing up for in your piece:

  1.  **You must admit the trials were technically retroactive.** You cannot claim the informers "broke the law" in a strict, positivist sense at the time they spoke. You have to acknowledge that the West German state said, in effect: *"What you did was legal then, but it was so evil we are changing the rules now to punish you."*
  2.  **You sacrifice the "Purity" of the Rule of Law.** You are conceding that the Rule of Law (premise 5) is not an absolute trump card. Sometimes, to stop a greater evil (impunity for genocide/collaboration), you must bend the Rule of Law. This is a powerful, if uncomfortable, journalistic angle: *Justice required a legal exception.*
  3.  **You distinguish "Law" from "Legitimacy."** You can argue that while the Nazi rules were *law* (source-based), they lacked *legitimacy* (moral authority). The West German state, as a successor sovereign, was not bound to respect the legitimacy of the predecessor's criminal enterprise.

  ### The "Successor Sovereign" Nuance (A Second Exit)

  If your editor balks at admitting the trials were retroactive, there is a second positivist escape hatch that attacks **(3)** without going full Natural Law.

  **Argument:** The West German Federal Republic was not a continuation of the Third Reich; it was a **new legal order** (based on the Basic Law of 1949).
  *   In international law and constitutional theory, when a regime changes fundamentally (especially from criminal dictatorship to democracy), the new sovereign is not bound by the *validity judgments* of the old criminal regime regarding acts that undermine the new order.
  *   **The Cost:** This gets technical. It argues that the "source" of law in 1948 (the Basic Law) retroactively invalidated the *authority* of the 1944 source, not because the 1944 rules weren't law, but because the *state* that made them no longer exists to defend them.

  ### Recommendation for Your Piece

  Stick with the **Hart (Tragic Choice)** argument. It makes for better journalism than the **Fuller (Magic Wand)** argument.

  *   **The Natural Law story:** "The Nazis weren't making real law, so we didn't break any rules punishing them." (Satisfying, but historically dubious).
  *   **The Positivist story:** "They were following the rules of a criminal state. To punish them, we had to admit we were bending our own rules against retroactivity. We chose Justice over Legality." (Honest, haunting, and profound).

  **Tell your professor friend this:**
  "You're conflating *legal validity* with *moral immunity*. Positivism admits the Nazi laws were valid. It also admits punishing the informers is retroactive. But it denies that 'retroactive' equals 'unjust' when the alternative is impunity. Positivism doesn't fail here; it just refuses to lie about the cost of justice."

  This keeps (5) (Rule of Law is important), keeps (7) (Trials were just), and rejects (8) (Positivism is false). The cost is admitting that **Justice sometimes requires breaking the Rule of Law.** That is the story worth writing.
