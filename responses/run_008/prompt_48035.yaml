answer: |-
  Coercive violence is permissible only as an uncodified emergency exception to prevent imminent catastrophe, directed exclusively at those morally liable for the threat, provided it never becomes institutionalized policy.

  This principle resolves your flip-flopping on the wife immediately. Because she is innocent of the plot, she lacks moral liability. Under this rule, utility cannot override immunity; torturing her is monstrous regardless of the eighty thousand lives at stake, whereas the guilty husband forfeits that immunity by creating the threat.

  It also validates your distinction between the rogue agent and the statute. By demanding the act remain an "uncodified exception," the principle permits the rogue agent who accepts personal legal risk ("dirty hands") while forbidding the state from normalizing torture into law. This aligns with your intuition that legal authorization corrupts the state even if the specific act is justified. It also rules out post-defusal torture, as that shifts from prevention to punishment.

  However, I must be honest about where this principle breaks. It cannot save your sniper verdict without modification. The principle hinges on moral liability to justify violence, yet it offers no reason why 70% certainty of liability is sufficient for lethal force but insufficient for torture. If liability is the gatekeeper, both cases should stand or fall together. To maintain your view, you must admit a subordinate rule: that torture requires a higher certainty threshold than killing because it violates autonomy in a way death does not. Without that addition, your intuition about the sniper is logically inconsistent with your refusal to torture the 70% suspect.

  Additionally, while the principle saves your verdict on the statute, it relies on an empirical gamble rather than pure morality. It assumes legal safeguards will inevitably fail and expand abuse. If a statute could genuinely restrict torture to ticking bombs, your principle would still forbid it solely to prevent normalization. You are prioritizing the moral integrity of the law over the potential safety of regulated violence, which is a coherent stance, but one that accepts greater risk in the specific case to protect the general system.

  You do not need to give up the wife verdict; liability protects her. But you must accept that your certainty thresholds vary by method without a clear axiom explaining why, and that your rejection of statutes prioritizes preventing state corruption over ensuring due process.
