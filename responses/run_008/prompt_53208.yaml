  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I mention Act 4, Scene 1? Yes, crucial for the "rottenness" argument.
      *   *Check:* Did I mention Cinna the Poet? Yes, essential for mob violence.
      *   *Check:* Is the distinction between "Great Man" and "Structural" clear? Ensure I don't just say "both" but explain *how* they interact.
      *   *Check:* British English. Use "favour," "centre," "whilst," "analyse." Avoid Americanisms like "gotten" (use "got") or "fall" (use "autumn" if applicable, though not here).
      *   *Nuance:* Be careful not to say Shakespeare *intended* a Marxist reading. He intended a tragedy. But the text supports the structural reading.

  9.  **Final Polish:** Ensure the advice is practical for a theatre group (rehearsal focus). *Self-correction: Make sure to explicitly mention how this affects acting/direction.* (Added notes on playing the crowd and the triumvirs).

  10. **Final Review against constraints:** British English? Yes. All parts of prompt answered? Yes.

