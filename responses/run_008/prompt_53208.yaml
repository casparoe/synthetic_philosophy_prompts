prompt: |-
  I'm in an amateur theatre group and we're rehearsing Shakespeare's Julius Caesar, and reading the play closely this time has unsettled the way I usually hear people talk about it. Whenever the fall of the Roman Republic comes up in the news, the analogy is always to one dramatic figure or moment — a man who won't give up power, a line that gets crossed. But the play itself seems to hint that the Republic was already rotten before anyone drew a sword: the crowd is fickle and easily flattered, the political class is cynical, and in the fourth act the new triumvirs sit around casually drawing up lists of who is to die. I've gathered, from general reading, that many historians think of the Republic's collapse as something slow and structural — institutions and unwritten norms eroding over generations, elites competing for power and status, economic inequality growing — so that Caesar was more a symptom than a cause.

  Please read the play through that structural lens rather than the great-man lens. Which scenes would you point our group to as evidence that Shakespeare saw the Republic as already failing regardless of anyone's character or intentions, and where does the play resist such a reading — where does it insist that everything turns on individual choice, honour, and rhetoric? I'd also like your view on whether the play dramatises something the structural account leaves out (what it felt like to live through the collapse, from the inside) or whether, politically, Shakespeare simply has the analysis wrong. And if you think the modern analogies people draw miss what the play actually warns about, please say what that is. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is in an amateur theatre group rehearsing *Julius Caesar*.
      *   **Observation:** They notice a disconnect between the common "Great Man" interpretation of the play (Caesar as the tyrant, Brutus as the hero/villain) and a "Structural" interpretation (the Republic was already rotting, institutions failing, mob rule, elite cynicism).
      *   **Task:**
          1.  Identify scenes supporting the *structural* reading (Republic already failing).
          2.  Identify scenes resisting this reading (insisting on individual choice/honour/rhetoric).
          3.  Evaluate if the play dramatises something the structural account misses (the lived experience of collapse) or if Shakespeare gets the politics "wrong."
          4.  Critique modern analogies based on the play's actual warnings.
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Play through the Structural Lens:**
      *   *The Opening Scene (Act 1, Scene 1):* The cobbler and the commoners. They are fickle, celebrating Caesar's defeat of Pompey, whom they previously cheered. This shows the instability of public loyalty.
      *   *The Lupercal (Act 1, Scene 2):* Caesar's public performance. The offering of the crown (off-stage but reported). The physical infirmity of Caesar (epilepsy/deafness) vs. the myth of the titan.
      *   *The Conspiracy (Act 2, Scene 1):* Brutus's soliloquy. He admits Caesar hasn't done anything wrong *yet*. It's about potential power. This highlights the paranoia of the system, not just the man.
      *   *The Assassination (Act 3, Scene 1):* "Liberty! Freedom! Tyranny is dead!" But immediately, chaos ensues. The ritual doesn't restore order; it breaks it further.
      *   *The Forum (Act 3, Scene 2):* Antony's speech. The manipulation of the crowd. The power of rhetoric over reason. The killing of Cinna the Poet (mistaken identity). This is mob rule.
      *   *The Proscriptions (Act 4, Scene 1):* Antony, Octavius, Lepidus. Coldly listing names to die. "He shall not live." This mirrors the cynicism they accused Caesar of. The system consumes its children.
      *   *The Ghost/Ending (Act 5):* Brutus's suicide. "Caesar, now be still." The cycle continues.

  3.  **Deconstruct the Play through the Great Man/Individual Lens:**
      *   *Brutus's Nobility:* He is constantly framed as "the noblest Roman of them all." His internal struggle suggests individual morality matters.
      *   *Caesar's Hubris:* "I am constant as the northern star." His refusal to read the Artemidorus letter. His arrogance invites the knife.
      *   *Cassius's Envy:* The conspiracy is driven by Cassius's personal resentment ("Why should that name be sounded more than mine?").
      *   *Antony's Loyalty/Cunning:* His individual agency turns the tide at the funeral.

  4.  **Synthesize: Structural vs. Individual:**
      *   Shakespeare does both. The structure creates the conditions, but individuals make the choices that accelerate the collapse.
      *   *Key Insight:* The tragedy isn't just that good men die, but that the *mechanism* of the Republic no longer allows for good men to succeed without becoming monsters.

  5.  **Address the "Lived Experience" vs. "Political Analysis":**
      *   Historians look at data (grain prices, land laws). Shakespeare looks at *affect* (fear, confusion, betrayal, the noise of the crowd).
      *   The play captures the *psychology* of collapse: the feeling that norms are dissolving, that language is losing meaning (rhetoric vs. truth), and that violence becomes the only currency.
      *   Is Shakespeare "wrong"? He's a dramatist, not a historian. He compresses time. But his insight into power dynamics is arguably deeper than dry structuralism because it includes the human element.

  6.  **Address Modern Analogies:**
      *   People look for "the Caesar figure." The play warns against looking for *any* saviour or focusing on *one* villain.
      *   The warning is about the *vacuum* left by institutions. When norms break, violence fills the gap.
      *   The danger of performative politics (Antony).
      *   The danger of self-righteous violence (Brutus).

  7.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Intellectual, collaborative (fellow theatre lover), nuanced.
      *   *Spelling/Grammar:* British (e.g., "analyse," "honour," "theatre," "programme").
      *   *Structure:*
