  My roommate Maya has strong opinions about pest control, and I've been keeping a mental list of her rulings because I genuinely can't figure out what principle she's running. She sprays her pepper plants for aphids with insecticidal soap without a second thought, and she hangs flypaper in the kitchen all summer even though the flies die slowly, stuck to it. But when we got mice in the garage she refused to use glue boards and made me set snap traps instead, and when rats moved in under the deck she wouldn't let the pest guy put out the anticoagulant bait boxes — paid extra for more snap traps. She had a wasp nest above the back door destroyed with that dust stuff and felt nothing about it. On the other hand she flat out refused to treat our lawn for grubs with the granular stuff all our neighbors use — her words were "I'm not nuking the whole yard for grass" — and when the HOA wanted to fog the whole block for mosquitoes before the fourth of july party she was the one who kicked up a fuss and opted out. Mosquito on her arm? Swatted instantly, zero guilt.

  Now we've got house centipedes in the basement and she's talking about spraying the baseboards. They're harmless — they actually eat the spiders and silverfish — she just can't stand the way they look. Before I say anything I'd like to know if her record predicts her verdict here. I can see at least two different rules that fit everything so far: one is about which animals can suffer plus how much collateral damage a method does (insects don't really count, but don't spray beyond your target), and another is about whether the reason for killing is good enough (health and food yes, aesthetics and convencience no). I think both fit her whole track record? And they clearly come apart on the centipedes, since the spray is targeted and only kills bugs, but the only thing at stake is that she finds them creepy. There might be other rules that fit just as well — maybe something about doing it on your own property vs. imposing it on the neighborhood — I'm honestly not sure.

  So: what will she say about the baseboard spray, which rule do you think she's actually running, and is the centipede case really the cleanest way to split the candidate rules apart, or is there some other case I could bring up with her that would settle it better? Related, I'd like a prediction on sticky traps for the cockroaches we sometimes see in the kitchen — that one feels like it should be easy given how she feels about mouse glue boards, but then there's the flypaper, so it isn't, at least not to me. I care less about getting a yes or no than about seeing what the actual decision procedure is, since at this point I'm half convinced she's just going with her gut each time and the "principles" are me pattern-matching after the fact.
