  **MEMORANDUM**
  **TO:** Ethics Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **RE:** LVAD Deactivation Request – Thursday Case

  **Recommendation:**
  1. Honor the patient's request to deactivate the LVAD.
  2. Administer palliative sedation *prior* to deactivation to prevent air hunger/distress.
  3. Attendees: Attending Cardiologist, Palliative Care, Nursing, Ethics rep, Chaplain.

  **Reasoning & Distinctions:**
  **[Settled Practice]:** Major professional societies (HRS, ASA) classify LVADs as life-sustaining treatment, not organ replacement. Competent patients possess the right to refuse treatment, even if fatal. The cause of death is recorded as underlying cardiac disease, not device deactivation. Palliative sedation is standard for symptom management during withdrawal of life support.

  **[Genuinely Contested]:** The cardiologist's objection highlights an ontological ambiguity often glossed over. Unlike a ventilator (external support), an LVAD is implanted and performs the heart's mechanical function; the native organ is largely inactive. Deactivation *feels* different than extubation. While ethically permissible under current frameworks, this distinction deserves record-keeping. We should not claim the analogy is perfect, only that it holds ethically. The committee should acknowledge that while policy treats this as withdrawal, the physiological reality is closer to organ failure induction.

  **Sedation Protocol:**
  **[Settled Practice]:** Sedation aims to relieve suffering (principle of double effect), not cause death.
  **[Genuinely Contested]:** Critics argue timing sedation *before* deactivation implies intent to kill rather than treat symptoms. However, waiting for observable distress violates beneficence. We must document intent clearly: sedation is for symptom anticipation, not execution. The line between preventing suffering and hastening death is narrower here than with ventilators.

  **Conclusion:**
  We proceed with deactivation based on autonomy and established guidelines. However, we acknowledge the cardiologist's point: the LVAD occupies a unique space between tool and organ. Her concern is not about legality, but moral categorization. Our minutes should reflect this nuance. The majority view (withdrawal of treatment) aligns with law and policy. The minority view (functional organ replacement) aligns with physiological reality. Both are valid perspectives. We authorize deactivation under the majority view, but record the dissent to validate the moral distress involved. This preserves trust among staff while respecting the patient's choice. We must avoid treating this as "routine" if it feels morally weighty to the team.
