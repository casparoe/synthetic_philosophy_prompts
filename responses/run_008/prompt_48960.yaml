answer: |-
  ### Designer's Note: A Critical Caveat

  Before you distribute this, I need to flag a philosophical leak in the framing you requested, specifically regarding the "invented cases."

  You asked for a case involving **"a drug that shrinks cortical volume... with no measurable effect on any behavior or capacity."** This premise smuggles in a massive assumption: **Functionalism.** It assumes that if the *output* (behavior/capacity) is identical, the *moral status* must be identical.

  However, a participant who believes moral status is tied to **biological essence** (the specific physical substrate of a healthy human brain) will reject the premise. To them, shrinking the cortex *is* the damage, even if behavioral tests can't detect it yet. They aren't saying "size matters"; they are saying "biological integrity matters," and size is a proxy for integrity.

  **Design Fix:** I have phrased Question 1 to acknowledge this tension. It asks participants to choose between trusting the behavioral data or trusting the physical change. This prevents the quiz from simply bullying biological essentialists into a functionalist box.

  ***

  # The "What Actually Matters?" Diagnostic Quiz

  **Instructions:** Read each scenario. Choose the option that best matches your intuitive judgment about the *moral status* or *rights* of the beings involved. Do not worry about legal technicalities; focus on what you feel is morally right.

  **1. The Shrink Drug**
  Scientists develop a drug that reduces human cortical volume by 20%. Extensive testing shows **zero change** in memory, reasoning, emotional depth, or behavior. The people who take it are indistinguishable from those who don't.
  *   **A.** Their moral status remains exactly the same. If capacities are unchanged, nothing morally relevant has changed.
  *   **B.** Their moral status is slightly diminished. A physically degraded human brain is a loss of value, even if they act normally.
  *   **C.** We cannot know their status until we see long-term effects.

  **2. The Super-Crow**
  A species of corvid is discovered with a brain the size of a walnut, but with neuron density so high that it outperforms chimpanzees on every cognitive test (tool use, self-recognition, planning).
  *   **A.** They deserve moral consideration comparable to chimpanzees or humans, based on what they can *do*.
  *   **B.** They are still birds. Their small brain size indicates they belong to a lower tier of nature, regardless of test scores.
  *   **C.** They deserve special protection, but less than humans, because their intelligence is "alien" rather than "like ours."

  **3. The Microcephalic Infant**
  A human infant is born with a significantly smaller brain than average due to a genetic condition. They will likely never develop complex language or rational autonomy.
  *   **A.** They possess full human moral status simply because they are human.
  *   **B.** Their moral status is proportional to their actual cognitive capacities, which is lower than a typical adult's.
  *   **C.** They have full status because they belong to a species where members *typically* have high capacity (the "kind" argument).

  **4. The Dolphin Comparison**
  Adult dolphins have brains larger than humans (by mass). They show high social intelligence and self-awareness but lack human-style rational agency (e.g., they cannot sign moral contracts).
  *   **A.** Their larger brain suggests they might have *more* moral status than humans in some respects.
  *   **B.** Brain mass is irrelevant; their lack of rational agency places them below humans in moral hierarchy.
  *   **C.** They have equal status to humans because they are highly sentient, even if they aren't "rational agents."

  **5. The Small-Brain Livestock**
  Through selective breeding, farmers create a line of cows with brains 30% smaller than normal. These cows show identical behavior, pain responses, and social bonding as normal cows.
  *   **A.** It is morally neutral. If the experience of the cow is the same, the brain size is irrelevant.
  *   **B.** It is morally concerning. We are creating "lesser" beings, which is a violation of the integrity of the species.
  *   **C.** It is morally good. Smaller brains might mean less capacity for suffering, making them more ethical to eat.

  **6. The Genius and the Average**
  Consider two adult humans. One is a world-leading physicist with massive cognitive complexity; the other has average cognitive abilities. Both are healthy.
  *   **A.** They have exactly equal moral rights and status.
  *   **B.** The physicist has a higher moral status because their cognitive capacity is greater.
  *   **C.** They have equal *rights*, but the physicist's interests count for more in a utilitarian calculation.

  **7. The Silicon Upload**
  A human mind is successfully uploaded to a computer server. The biological brain is destroyed. The software exhibits identical memory, personality, and reasoning as the original human.
  *   **A.** It has the same moral status as the human. Substrate (meat vs. silicon) doesn't matter.
  *   **B.** It is a copy, not a person. Moral status requires a biological human brain.
  *   **C.** It has some status, but less than a biological human because it lacks "life."

  **8. The Temporary Coma**
  A healthy adult human enters a reversible coma for six months. During this time, they have no conscious capacity, though the brain structure remains intact.
  *   **A.** They retain full moral status because of their *potential* to wake up.
  *   **B.** Their status is suspended or reduced while they lack consciousness.
  *   **C.** They retain status because they are human, regardless of potential or consciousness.

  ***

  # Scoring Key & Philosophical Leaves

  Do not sum the numbers. Instead, look for the **pattern** of your answers. Most people will not fit perfectly into one column, but one "leaf" should resonate with the majority of your choices.

  ### Leaf 1: The Capacity Functionalist (Singer-style)
  *   **Typical Answers:** 1A, 2A, 3B, 4C, 5A, 6A, 7A, 8B.
  *   **The View:** Moral status tracks **sentience and agency**. Brain size is morally inert; it is only a noisy proxy for capacity. If a crow acts like a chimp, it counts like a chimp. If a human loses capacity, their status changes.
  *   **Implication for Discussion:** You will likely argue that brain size is irrelevant *except* where it correlates with suffering or autonomy. You may find "human dignity" arguments frustratingly vague.

  ### Leaf 2: The Threshold Egalitarian (Kantian/Contractualist)
  *   **Typical Answers:** 1A, 2C, 3A/C, 4B, 5A, 6A, 7B, 8A.
  *   **The View:** There is a **switch**. If you meet a threshold (usually "personhood" or "humanity"), you have full equal status. Above the line, brain size and genius don't matter (Q6A). Below the line, status is different. Species or potential often helps define the threshold (Q3, Q8).
  *   **Implication for Discussion:** You will resist "graded" status for humans (Q6) but may accept it for non-humans. You view brain size as irrelevant for *rights* among persons, but perhaps relevant for determining who is a person.

  ### Leaf 3: The Gradualist (Hierarchical)
  *   **Typical Answers:** 1B, 2C, 3B, 4B, 5C, 6B, 7C, 8B.
  *   **The View:** Moral status comes in **degrees**. More capacity = more status. Brain size might be a rough heuristic for this. It is acceptable to say a genius has more status than an average person, or a human more than a dolphin.
  *   **Implication for Discussion:** You are comfortable with moral hierarchy. You likely see brain size as a legitimate, albeit imperfect, indicator of moral weight.

  ### Leaf 4: The Biological Speciesist (Humanism)
  *   **Typical Answers:** 1B, 2B, 3A, 4B, 5B, 6A, 7B, 8C.
  *   **The View:** Being **_Homo sapiens_** does independent moral work. A human with low capacity (Q3) still outranks a high-capacity animal (Q2). Physical integrity of the human brain matters (Q1, Q5).
  *   **Implication for Discussion:** You will argue that brain size discussions are offensive when applied to humans because human status is not contingent on metrics. You may accept capacity views for animals but not humans.

  ### Leaf 5: The Deflationary Proxy
  *   **Typical Answers:** 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A.
  *   **The View:** Brain size is **scientifically and morally irrelevant**. It is a category error to discuss it. Only interests, relationships, or specific capacities matter. This is similar to the Capacity Functionalist but more aggressive in dismissing the physical metric entirely.
  *   **Implication for Discussion:** You will try to steer the group away from "brain size" entirely and toward "interests" or "relationships."

  ***

  # Logical Space Analysis

  ### Unoccupied Combinations
  *   **The "Size-Only" Essentialist:** There is no leaf for someone who believes brain size matters *intrinsically* regardless of capacity or species (e.g., "A large-brained cow is morally superior to a small-brained human").
      *   *Why unoccupied?* This view is generally incoherent to most people. Size without function or kind seems like fetishizing geometry. If anyone in your group holds this, they are a philosophical unicorn.
  *   **The "Inverse" Gradualist:** Someone who believes *smaller* brains confer *higher* status (e.g., "Innocence correlates with simplicity").
      *   *Why unoccupied?* While romantically attractive, this rarely survives ethical scrutiny in a modern context. It usually collapses into a Threshold view (innocence = protected class) rather than a size metric.

  ### Indistinguishable Leaves (The "Blind Spots")
  *   **Gradualist (Leaf 3) vs. Speciesist (Leaf 4):** As you suspected, these are hard to pry apart. A Speciesist often justifies their view by claiming humans have *unique capacities*. If a Speciesist answers Q3 (Microcephalic Infant) with "Full Status," is it because of **Species** or because they assume **Potential Capacity**?
      *   *Fix:* The quiz uses Q7 (Silicon Upload) and Q2 (Super-Crow) to try to separate these. If they grant status to the Upload (non-biological) but not the Crow (biological non-human), they are Speciesists. If they deny the Upload but grant the Crow high status, they are Biological Essentialists. If they deny both, they are likely Speciesists masking as Gradualists.
  *   **Threshold (Leaf 2) vs. Deflationary (Leaf 5):** If the "Threshold" is based on capacities (e.g., sentience), and the "Deflationary" view says "only capacities matter," they look identical on almost all questions.
      *   *Distinction:* The Threshold view usually insists on *equality* above the line (Q6A), whereas a pure Capacity view might allow for *degrees* even above the line (Q6C). Watch their answer to Q6 closely.

  ### A Note on Question 1 (The Drug)
  If your group spends the whole discussion arguing about whether the "no measurable effect" premise is possible, the quiz has done its job. It has revealed that for some participants, **biological structure is a capacity in itself.** This is a valid philosophical position (Substrate Essentialism), but it means "brain size" isn't a proxy for capacity; it *is* the capacity. Be prepared to facilitate that distinction.
