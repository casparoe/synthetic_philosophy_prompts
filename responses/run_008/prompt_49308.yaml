      *   *Hirsch:* Meaning *is* what the author intended. Without it, interpretation is unmoored. Distinguish between "meaning" (authorial) and "significance" (reader/cultural).
      *   *Barthes:* The author is dead. The text is a tissue of quotations. The reader births the meaning.
      *   *The Burgess Case:* Burgess explicitly stated the theme is *moral choice* (Chapter 21). Without it, the theme is *conditioning/state control*.

