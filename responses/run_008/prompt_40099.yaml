answer: |-
  The coffee shop noise was a dull roar, matching the headache Mara was nursing. She stirred her espresso, watching the grounds swirl.

  "So," Mara said. "Vienna. 1529. Why did Suleiman turn back?"

  Jonah leaned back, stretching his arms. "I told you in the panel. Supply lines overextended, early winter, the specific decision-making of the Grand Vizier. The archival record shows—"

  "The archival record tells a story," Mara interrupted. "It doesn't explain. If you can't say what variable change would have resulted in Vienna falling, you haven't explained anything. You've just told a story with a beginning, middle, and end. It's literature, Jonah, not science."

  "It's history," Jonah corrected. "You're looking for covering laws where there are none. Human events aren't billiard balls."

  "Imagine a black box," Mara said, ignoring him. "Call it the History Oracle. You feed it a complete state description of Europe in 1500. It outputs the next major political rupture within fifty years with 70% reliability. No narrative, just inputs and outputs. If that box exists, I win. It's predicting without telling a story about anyone's feelings."

  Jonah smiled tiredly. "You think the Oracle is doing physics? It's probably just compressing prior narratives. It's a narrativist with a perfect memory, not a law-generator. It's recognizing patterns in stories, not forces in nature."

  "Okay," Mara said, pausing. "Suppose the Oracle is a neural net. Nobody can extract an intelligible law from its weights. It just works. Is it law-like then? Is it explaining?" She frowned, staring into her cup. "If it predicts, it must be tracking causal structure. But if we can't read the structure... I don't know. If explanation requires intelligibility, the Oracle fails. But if it requires counterfactual reliability, it passes. I hate that I don't have a clean answer there."

  "Because 'explanation' isn't one thing," Jonah said. "When I explain Vienna, I'm not predicting. I'm making a trajectory intelligible. The explanation is stretched over time. You only see why it happened because you know how it ended. It's not an event; it's a path."

  "So 'explain' just means 'whatever makes historians feel satisfied'?" Mara shot back. "You trace a path until the audience nods. That's psychological comfort, not epistemic work."

  "No," Jonah said, leaning forward. "It's not about comfort. It's about agency. Humans act for reasons embedded in time. To explain is to reconstruct the space of possibilities as they looked *then*, not as variables look from now. If you strip the narrative, you strip the reasons. You don't have explanation; you have correlation."

  Mara sighed. "Wait. Are we using 'explain' in two senses? You mean 'make-intelligible.' I mean 'predict-like.' If I say 'gravity explains the fall,' I mean I could have calculated it. If you say 'Suleiman explains the retreat,' you mean you understand his choice."

  "Maybe," Jonah said. "But if you split them, you lose the point. History wants to know why *this* happened, not what usually happens. If you take 'predict-like' away, you keep your physics. But you leave me with the singular event. And you can't claim I haven't explained it just because I can't rerun the siege."

  "So it's a dodge," Mara said. "You keep the word 'explain' because it sounds rigorous, but you've redefined it as 'storytelling that feels right.'"

  "And you keep 'explain' because it sounds objective, but you've redefined it as 'prediction without understanding,'" Jonah countered. "Neither of us is winning. We just want different things from the past."

  Mara signaled for the check. "So we agree to disagree on the definition?"

  "We agree that the word is doing too much work," Jonah said. "But I'm still writing the book on Vienna. And you're still building your models."

  "Truce," Mara said. "Until the next conference."

  "Until the next conference."

  ***

  **Note on Philosophical Context**

  The debate mirrors the mid-20th century clash between Carl Hempel's Covering Law Model and its critics (like Dray and Gallie). Hempel argued historical explanation requires general laws (Mara's view), but most contemporary philosophers reject this as too restrictive for human action. Jonah's narrative view is more dominant today, yet the objectivity of narrative remains contested. Mara caricatures historians as mere storytellers, ignoring their rigorous causal inference; Jonah caricatures quantifiers as seeking physics-like laws, ignoring probabilistic causal models. Neither side is wholly wrong, but both simplify the other's methodology. The "two senses" distinction (prediction vs. intelligibility) is a recognized philosophical move, but it rarely dissolves the tension regarding what counts as valid knowledge.

  In one sentence: They disagreed on whether explaining the past requires subsuming events under general predictive laws or reconstructing the unique intelligibility of singular trajectories.
