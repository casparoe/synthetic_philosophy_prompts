answer: |-
  **The Scenario**

  On the fortieth birthday, Marta slides the card across the table without a word. The glyph is ink on cream stock, a single story constructed from a vertical stem on the left and a closed bowl on the right. It looks, unmistakably, like a lowercase 'd'. But the lineage is unbroken: forty years ago, the stem stopped at the x-height, making it an 'a'. Each year, Marta opened the vector file and extended the stem upward by exactly two points—a shift too small to trigger categorical reclassification in isolation—while keeping the bowl's curvature and attachment point mathematically interpolated from the previous year. No single design decision ever intended to change the letter, yet the sum of forty invisible increments has lengthened the stem into ascender territory. The girl looks at the mark. Her perceptual system, stripped of linguistic context, fires on the feature set for 'd'. Marta's logbook, tracking the chain of custody, records only 'a'.

  ***

  **The Analysis**

  **The Two Accounts**
  *   **Account 1 (Recognition/Reader):** This account is functionalist and ahistorical. It defines identity by *current* utility. Because the game strips away linguistic context (no words, just the mark), the reader's brain relies on feature detection. A vertical stem extending into ascender height with a bowl on the right is a distinctive feature of 'd', not 'a'. Since the final glyph triggers the 'd' classifier without hesitation, this account verdicts: **Not 'a'.**
  *   **Account 2 (Lineage/Designer):** This account is historical and essentialist. It defines identity by *continuity*. In type design, interpolation ensures that if Glyph $N$ is an 'a', and Glyph $N+1$ is indistinguishable from $N$ regarding identity conditions, then $N+1$ is also an 'a'. Because every step was a valid, signed-off design move that preserved the previous year's identity, the chain remains unbroken. This account verdicts: **Is 'a'.**

  **The Engine Feature**
  The single feature doing all the work is **Isolation**.
  Reading is "greedy"; it uses context to override ambiguous geometry (you can read a messy 'a' in "cat" easily). By forcing the granddaughter to identify the glyph *in isolation*, you disable the contextual safety net that usually allows style to vary without losing identity. If you remove this feature—if Marta wrote the glyph inside a word like "b_d"—the Recognition account would flip. The brain would use the word context to force the reading of 'a', aligning the Recognition verdict with the Lineage verdict. The conflict only exists in the vacuum.

  **The Counterattacks (For the Granddaughter)**
  *   **If the Lineage Theorist (Marta) Loses:** The granddaughter argues that history cannot override biology. "You can't inherit a name if you lose the face. We already accept that a single-story 'a' and a double-story 'a' are different shapes doing the same job; you just pushed us past the cousin stage into stranger territory. Identity isn't magic DNA; if it doesn't function as an 'a', your logbook is just a diary of a mistake."
  *   **If the Recognition Theorist (The Girl) Loses:** The granddaughter argues that perception is habitual, not truthful. "You read for speed, not truth. You see what you expect. If I painted your portrait every day for forty years and you aged, would you say 'that's not me' because I look different? The letter isn't the ink; it's the decision chain. My eyes are lying to me because they're lazy."

  **The "Abstract Letter-Spirit"**
  This thought experiment **makes trouble** for the Platonist picture (the idea that every 'a' participates in a perfect, abstract 'a-ness'). If there were a true, abstract 'a-essence' that every valid 'a' must share, this experiment locates the exact moment it vanished—but the setup guarantees there *is* no exact moment (because every step was unremarkable). The experiment suggests there is no "spirit" residing in the glyph. Instead, "a-ness" is either a matter of **genealogy** (where it came from) or **utility** (what it does), but never both simultaneously when pushed to the limit. For your editor: The book is about the conflict between *history* (what we owe the past) and *presence* (what we owe the truth of the moment).
