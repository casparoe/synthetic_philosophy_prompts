answer: |-
  This is a classic instantiation of the "Paradox of Voting" (or Downsian Paradox), rehearsed with admirable clarity. To adjudicate this, we need to distinguish between *instrumental rationality* (achieving a specific outcome), *moral rationality* (adhering to a normative standard), and *expressive rationality* (deriving utility from the act itself).

  Here is the move-by-move adjudication, followed by an assessment of what the literature suggests they are both overlooking.

  ### Move 1: Maya's Initial Argument (The Downsian Calculus)
  **The Claim:** In a large electorate, $P$ (probability of being pivotal) $\approx 0$. Therefore, $P \times B$ (Benefit) $< C$ (Cost). Adding a "duty" term ($D$) to make $P \times B + D > C$ is ad hoc and unfalsifiable.

  **Adjudication: Maya is right.**
  Maya is correct regarding the standard model of *instrumental rationality*. If rationality is defined as maximizing expected personal utility based on causal efficacy, the math is indisputable: the chance of a single vote deciding a national election is effectively zero.

  She is also methodologically correct about the "duty term." In formal theory, if you explain an anomaly (voting) by adding a variable ($D$) that is unobserved and defined only by the fact that the action occurred, you have created a tautology. You are saying "People vote because they get utility from voting," which is true by definition but explains nothing. Unless $D$ can be measured independently of the act of voting (e.g., through psychometric surveys on civic duty *prior* to the election), it is indeed a "fudge factor" that saves the theory by draining it of predictive power.

  ### Move 2: Jonah's Response (The Impartial/Utilitarian Calculus)
  **The Claim:** The benefit ($B$) should not be private gain but *social* gain. $P \times B_{\text{social}}$ can exceed $C$.

  **Adjudication: Jonah is conceptually right, but strategically vulnerable.**
  Jonah correctly identifies that standard Rational Choice Theory (RCT) often smuggles in ethical egoism by assuming $B$ refers only to the voter's private wallet. If a voter is an impartial utilitarian, the "benefit" of their preferred candidate winning includes the welfare of all citizens. Multiplied by millions of people, $B_{\text{social}}$ becomes large enough that even a tiny $P$ yields a positive expected value.

  However, Jonah is conflating *rationality* with *morality*. He has successfully argued that voting might be a *moral duty*, but he hasn't proven it is *rational* in the game-theoretic sense unless one assumes the agent is already committed to impartial maximization. More importantly, by opening the door to $B_{\text{social}}$, he invites the efficiency objection Maya raises next.

  ### Move 3: Maya's Rejoinder (The Dominated Alternatives)
  **The Claim:** If $B_{\text{social}}$ counts, voting is inefficient. Donating money or canvassing yields higher social return per unit of cost. A true expected-value maximizer should do those instead.

  **Adjudication: Maya wins this round decisively.**
  This is the strongest argument in the exchange and the one that usually sinks the "utilitarian defense" of voting. If the justification for voting is the expected social benefit, then voting is a strictly dominated strategy.

  An hour spent canvassing or a modest donation to a high-impact charity almost certainly produces more expected social utility than casting a ballot with a $1/10,000,000$ chance of pivoting the result. If Jonah's argument were true, the most "rational" citizens would be those who *never* vote but spend all their spare time and money on direct advocacy or effective altruism. Since proponents of the utilitarian calculus (like Jonah) typically vote *and* don't devote their lives to high-leverage activism, Maya is right: the impartial calculus looks more like a post-hoc rationalization than a genuine decision procedure.

  ### Move 4: Expressive Voting vs. The Duty Term
  **The Claim:** Jonah argues voting is expressive (like cheering). Maya argues this is just the duty term relabeled and remains unfalsifiable.

  **Adjudication: Jonah is right on the theory, Maya is right on the methodology.**
  Jonah is invoking **Expressive Voting Theory** (associated with Geoffrey Brennan and Loren Lomasky). This is *not* merely the duty term in casual clothes. The duty term suggests you vote to *feel* like a good person (internal reward). Expressive theory suggests you vote to *declare* an identity (consumption value).

  Jonah is right that Maya's insistence on dollar-measurable utility is a prejudice of the economic model. Humans derive utility from symbolism, solidarity, and identity affirmation. Cheering at a stadium doesn't change the score, but it isn't "irrational."

  However, Maya's methodological warning is vital. Expressive theory risks becoming a "theory of everything." If any action can be explained by "expression," what action is ruled out? To avoid Maya's critique, expressive theory must generate specific predictions that differ from instrumental theory. (For example: Expressive theory predicts voters will be *less* informed than consumers, because the "cost" of being wrong is zero. Instrumental theory struggles to explain why rational agents remain ignorant.)

  **Verdict on the Exchange:** Jonah successfully identifies a valid source of utility (expression) that Maya's model excludes. But Maya is correct that without independent measurement, it functions as a get-out-of-jail-free card for the rational choice model.

  ---

  ### What Both Are Missing: The Literature Beyond the Paradox

  While both students deployed standard arguments competently, they are trapped in a dichotomy between **Atomized Instrumentalism** (Maya) and **Atomized Moralism/Expressivism** (Jonah). The contemporary literature on the paradox of voting has moved past this in three crucial ways that neither student mentioned.

  **1. Evidential Decision Theory (The Correlation Argument)**
  Both students assume **Causal Decision Theory**: *My* vote causes the outcome. Since *my* vote is one in a million, the causal power is nil.
  However, philosophers like David Gauthier and economists like J.C. Harsanyi have argued for **Evidential Decision Theory**. Your vote is not an isolated event; it is *evidence* of how other people like you will vote. If you are the kind of person who votes, there are likely thousands of others like you. Therefore, you are not choosing between "I vote" and "I don't"; you are choosing between "People like me vote" and "People like me don't." This effectively scales up the probability $P$ from $1/N$ to $K/N$ (where $K$ is the number of similar agents). This resolves the paradox without needing a "duty" term or "expression"—it remains instrumental but rejects the assumption of causal isolation.

  **2. Rule Utilitarianism and Generalization**
  Jonah touched on social benefit, but he framed it as an act-utilitarian calculation (What does *this* vote do?). The Kantian or Rule-Utilitarian counter is: *What if everyone did that?*
  The rationality of voting is often framed as a **conditionality** problem. It is rational to vote *on the condition* that enough others do so to make the election legitimate or the margin secure. This treats voting as a contribution to a threshold public good rather than a lottery ticket. If the threshold is met, the benefit is secured; if you abstain and the threshold fails, you bear responsibility. This moves the debate from probability to **threshold assurance**.

  **3. The Sociological Turn (Habits and Norms)**
  Both students treat voting as a conscious, annual calculus. Political sociologists (e.g., Green, Shapiro, and Gerber) have shown that for most people, **voting is a habit**, not a decision.
  Once you vote in one or two elections, the cost $C$ drops precipitously (you know where to go, you're registered), and the social identity of "being a voter" solidifies. The "paradox" only exists for first-time voters or hyper-rationalists. For the vast majority, the question isn't "Is it rational to vote?" but "What social conditions trigger the habit?" Maya's model applies to a hypothetical *Homo Economicus* who doesn't exist, while Jonah's model applies to a moral philosopher who doesn't vote like a normal person.

  ### Final Summary

  *   **Maya** wins on **internal consistency**. Within the strict bounds of causal, instrumental rationality, voting is irrational, and adding undefined terms to fix this is bad science.
  *   **Jonah** wins on **descriptive accuracy**. Humans are not purely instrumental egoists; we care about social outcomes and expressive acts. His model fits human behavior better, even if it is harder to formalize.
  *   **The Missing Link:** The debate is outdated. The paradox is best resolved not by tweaking the utility function (Jonah) or accepting abstention (Maya), but by rejecting the assumption that voters are causally isolated atoms (Evidential Decision Theory) or by recognizing that voting is a social habit rather than a calculated choice (Sociological Institutionalism).

  If you must pick a winner for the workshop: **Maya wins the argument, but Jonah wins the world.** Maya has the better logic for the model they are discussing; Jonah has the better understanding of why people actually vote. But the most productive path forward is to discard the model they are both fighting over.
