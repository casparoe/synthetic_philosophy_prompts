      *   **Context:** A political theory workshop debate between two PhD students (Maya: formal theory, Jonah: political philosophy) about the rationality of voting.
      *   **Task:** Adjudicate the debate move-by-move (Maya's initial argument, Jonah's response, Maya's rejoinder, the expressive voting exchange). Determine who is "right" at each step and why. Identify what *both* are missing regarding the "paradox of voting" in the literature.
      *   **Constraint:** The user wants an *adjudication*, not a predictable "both have points" fence-sitting, though accuracy requires nuance. The goal is to clarify the theoretical landscape.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1: Maya's Initial Argument (The Downsian Calculus).**
          *   *Claim:* $P \times B < C$. Probability of pivotality ($P$) is near zero. Benefit ($B$) is personal. Cost ($C$) is positive. Therefore, rational abstention. Adding a "duty" term ($D$) is ad hoc/unfalsifiable.
          *   *Assessment:* This is the standard Rational Choice Theory (RCT) formulation (Downs, Tullock, Olson). Technically correct within its axioms. The criticism of the $D$ term is a standard critique of ad hoc preferences in RCT.
          *   *Verdict:* Maya is theoretically consistent *within the framework of instrumental rationality focused on private goods*. She is right that the basic calculus predicts abstention. She is right that simply adding a $D$ term without independent measurement risks tautology.

      *   **Move 2: Jonah's Response (The Impartial/Utilitarian Calculus).**
          *   *Claim:* $B$ should be *social* benefit, not private. $P \times B_{social}$ can exceed $C$.
          *   *Assessment:* This is the "utilitarian" or "altruistic" response (e.g., Goodin, Roberts). It challenges the definition of $B$.
          *   *Verdict:* Jonah is right that standard RCT often assumes egoism arbitrarily. If one accepts impartial morality, the math changes. However, he risks the "demandingness" objection (which Maya raises next).

      *   **Move 3: Maya's Rejoinder (The Dominated Alternatives/Efficiency Argument).**
          *   *Claim:* If $B_{social}$ counts, then voting is inefficient compared to other acts (donating, canvassing). Why vote if you can do *more* good elsewhere for less cost?
          *   *Assessment:* This is a strong point often overlooked. If the goal is maximizing social welfare, voting is a very blunt, low-leverage instrument compared to targeted charity or advocacy (effective altruism angle).
          *   *Verdict:* Maya wins this point logically. If the justification is purely consequentialist social benefit, voting is rarely the *optimal* action.

      *   **Move 4: The Expressive Voting vs. Duty Term Exchange.**
          *   *Jonah:* Voting is expressive (like cheering). Value is in the act, not the outcome.
          *   *Maya:* That's just the duty term ($D$) relabeled. Unfalsifiable.
          *   *Assessment:* Expressive voting theory (Brennan & Lomasky) is a distinct theoretical framework from instrumental voting. It changes the *source* of utility. Maya is right that it risks being a catch-all, but Jonah is right that human motivation isn't purely instrumental.
          *   *Verdict:* Jonah is right that the model is too narrow (prejudice of the model). Maya is right that without constraints, "expression" explains everything and nothing.

  3.  **Identify What They Are Missing (The Literature Gap):**
      *   *The Paradox:* Why do people vote if $P \approx 0$?
      *   *Missing Element 1: Conditional Cooperation/Rule Utilitarianism.* It's not about *my* vote, it about following a rule that if everyone like me votes, the outcome is good. (Kantian/Rawlsian angles).
      *   *Missing Element 2: Social Norms and Identity.* Voting is a social act, enforced by norms, not just individual calculus. (Green & Shapiro, Funk).
      *   *Missing Element 3: The "Minimax Regret" Approach.* Instead of maximizing expected utility, minimize maximum regret. (Ferejohn & Fiorina).
      *   *Missing Element 4: Causal vs. Evidential Decision Theory.* Evidential Decision Theory (EDT) suggests your vote is evidence of others' votes (correlation), making $P$ effectively higher. (Ahmed, Sobel).
      *   *Missing Element 5: Group Agency.* Voting as a member of a group, not an atomized individual.

  4.  **Drafting the Adjudication (Iterative Process):**

