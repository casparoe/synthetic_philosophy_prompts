answer: |-
  You've stumbled onto a real philosophical problem called **the problem of moral testimony**. The short version of why people get weird about it: If you do the right thing only because someone told you to, you haven't actually developed a moral compass; you've just developed obedience. You get the *outcome* right, but you miss the *virtue*.

  However, you want practical utility, not a thesis. Here is a checklist designed to tell you when it's safe to outsource your judgment and when you are legally (morally) required to think for yourself.

  ### The Moral Outsourcing Checklist

  Run these questions in order. If you hit a "Stop" command, you must think it through yourself.

  **1. The Stakes Filter: Is this etiquette or integrity?**
  *   **Etiquette/Preference:** (Tipping, dress codes, gift giving, party RSVPs).
      *   *Action:* **Delegate.** If your moral friend says "tip anyway," just do it. This is social navigation, not soul-searching.
  *   **Integrity/Harm:** (Lying, cheating, stealing, bullying, safety).
      *   *Action:* **Proceed to Step 2.** Do not outsource high-stakes morality blindly.

  **2. The Competence Check: Is this advisor an expert *here*?**
  *   **Context Match:** Does this person understand the specific context? (e.g., Your grandma is wise, but if she doesn't understand social media, she can't judge cyberbullying).
  *   **Bias Check:** Does this person have a conflict of interest? (e.g., Asking the cheating friend if you should tell his girlfriend).
  *   *If No:* **Stop.** You cannot delegate. You must reason it out.
  *   *If Yes:* **Proceed to Step 3.**

  **3. The "Why" Test: Can you articulate the reason?**
  *   Ask your advisor: *"Why is that the right move?"*
  *   **Pass:** They give you a principle you understand and accept (e.g., "Because it breaks trust").
  *   **Fail:** They say "It's just wrong" or "Because I said so."
  *   *Action:* If they fail, **Stop.** You are following a rule, not a moral logic. You need to understand the *why* to own the action.

  **4. The Cowardice Scan: Am I asking to avoid blame?**
  *   Be honest: Are you asking because you want to do the right thing, or because you want to be able to say *"Well, [Friend] said it was okay"* if it goes south?
  *   *If you want a shield:* **Stop.** This is the "cowardly" zone philosophers hate. You must decide alone.
  *   *If you genuinely want clarity:* **Proceed to Step 5.**

  **5. The Agency Wall: The Final Decision**
  *   Even if they pass all above, **you** must say the final "Yes" or "No."
  *   *Action:* Verbally confirm: "I am doing this because I believe it is right, not because you told me to."
  *   If you can't say that, **Stop.** You are not ready to act.

  ***

  ### The Honest Confession
  **Step 4 (The Cowardice Scan) is judgment dressed up as a procedure.**
  There is no algorithm to detect your own cowardice. You have to feel it in your gut. If you feel relieved that someone else decided, that *is* the signal that you shouldn't have delegated. I can't write a sub-routine for that; only you can feel the weight lifting off your shoulders and recognize it as a warning sign.

  ***

  ### Running the Checklist on Your Scenarios

  #### Situation 1: Covering for a friend lying to his parents.
  *   **Step 1 (Stakes):** Integrity. Lying to parents undermines their trust and safety. **Proceed.**
  *   **Step 2 (Competence):** Assuming your "moral friend" is competent on honesty. **Proceed.**
  *   **Step 3 (The Why):** Your moral friend would likely say: "Lying makes you complicit. It teaches him he can use you to avoid consequences." **Pass.**
  *   **Step 4 (Cowardice):** Are you asking because you don't want your friend to be mad at you? Probably. **Warning Flag.**
  *   **Step 5 (Agency):** You have to make the call.

  **The Verdict:** **Do not cover for him.**
  **The Hard Truth:** You said you wanted an answer you might not like. Here it is: **If you lie for him, you are not being a "good friend," you are being an accessory.** You are actively helping him damage his relationship with his parents and training him to believe he doesn't need to take responsibility. Furthermore, you are damaging your own reputation as a truthful person. If his parents find out (and they usually do), you become the untrustworthy one, not him. You are sacrificing your integrity for his convenience. That is a bad trade. Tell him: *"I value our friendship, but I won't lie to your parents for you."*

  #### Situation 2: Group chat freezing out a kid / Fear of social retaliation.
  *   **Step 1 (Stakes):** Harm/Bullying. **Proceed.**
  *   **Step 2 (Competence):** Your moral friend knows the group dynamics. **Proceed.**
  *   **Step 3 (The Why):** Principle: "Excluding someone for fun is cruel. Silence is consent." **Pass.**
  *   **Step 4 (Cowardice):** You explicitly said, "If I push back they'll turn on me." You are asking for permission to stay safe. **Warning Flag.**
  *   **Step 5 (Agency):** You must decide.

  **The Verdict:** **Do not participate, but you don't need to be a martyr.**
  You don't have to write a manifesto defending the kid and get yourself exiled. But you cannot actively participate in the freeze-out.
  *   *Action:* Stay neutral. Don't add to the mean comments. If pressed, say "I don't really care either way, this seems like a lot of energy."
  *   *Reasoning:* If your friends turn on you simply because you refused to bully someone, **they are not your friends.** They are a mob. Losing them is painful, but keeping them requires you to be cruel on command. That is a relationship built on coercion, not loyalty.

  #### Situation 3: Friend shoplifting.
  *   **Step 1 (Stakes):** Illegal/Harm. **Proceed.**
  *   **Step 2 (Competence):** This is legal/criminal, not just "rude." **Proceed.**
  *   **Step 3 (The Why):** Principle: "Stealing hurts the store (and prices for everyone) and puts you at risk of arrest." **Pass.**
  *   **Step 4 (Cowardice):** Are you ignoring it to avoid an awkward confrontation? **Warning Flag.**
  *   **Step 5 (Agency):** You must decide.

  **The Verdict:** **Confront the friend, do not report them (yet), but do not ignore it.**
  Ignoring it validates the behavior. If she gets caught later, she might say "You knew and said nothing."
  *   *Action:* Pull her aside. "I saw you take that. That's not like you, and if you get caught, it's going to mess up your life. I'm not going to watch you do that."
  *   *Boundary:* If she keeps doing it, you have to distance yourself. You cannot be friends with someone who breaks the law casually, because when she gets caught, she will look for a getaway driver or an alibi, and you do not want to be in that orbit.

  ***

  ### Summary
  The checklist works, but notice where it hurt: **Situation 1.** That's where you wanted to be a "good friend" by being a "good liar." The checklist forces you to see that those two things are mutually exclusive. Use the tool, but don't skip Step 4. That's where the actual work happens.
