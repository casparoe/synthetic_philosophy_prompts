prompt: |-
  ok so this is kind of a weird ask but here goes. me and my friends constantly debate whether stuff is ok or not — like is it messed up not to tip when the service was slow, or do you have to tell a friend her bf is cheating if you promised not to. and i noticed something: even though we all agree one of my friends has the best moral judgment of anyone we know (she's basically who everyone goes to when they feel bad about something), people still get weird about it when someone just asks her and does whatever she says without thinking it through themselves?? like if she's the best at judging this stuff, shouldn't trusting her be the smart move? i read a little about how philosophers think moral advice is strange in exactly this way — you're allowed to just trust an expert on, say, climate facts, but if you outsource your whole conscience to someone, people act like that's cowardly, or like you don't really count as a good person even when you end up doing the right thing. i don't fully get why moral stuff would be different but i also kind of do?

  anyway i want something practical out of this, not a lecture. can you turn it into a checklist i can actually run whenever i'm unsure if something is right or wrong? like: the questions to ask myself in order, when it's fine to just go "she'd say no, so i wont do it" and move on, when i actually have to reason it out myself and can't delegate, what to do when the person i'd ask would probably get it wrong (asking my grandma about basically anything modern lol), and where the checklist just hits a wall and i have to decide myself. also please be honest about which steps are really just my own judgment dressed up as a procedure.

  then run it on three real-ish situations from my life: (1) a friend asked me to cover for him lying to his parents about where he was last weekend, (2) the group chat is planning to freeze out this one kid and i think its mean, but if i push back they'll probably turn on me next, (3) i'm pretty sure a girl in my class shoplifts and she's my friend. at least one of these should end with an answer i won't like, and you should say that straight instead of softening it.
