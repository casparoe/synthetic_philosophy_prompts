answer: |-
  This is an excellent pedagogical exercise. It forces students to move beyond the caricature of Rorty as a "anything goes" relativist and grapple with the specific *constraints* his neo-pragmatism places on truth claims. Rorty is not a skeptic; he is a deflationist who wants to save liberal hope without metaphysical baggage.

  Here is the extrapolation you requested, structured by verdicts, rule inventory, best guess, and a discriminating test case.

  ### 1. Predicted Verdicts on Case A and Case B

  **Case A: The Slavery Counterfactual**
  *Scenario:* Had the defenders of slavery won everywhere and persuaded every later generation, would "Slavery is wrong" still have been true?
  *   **Rorty's Verdict:** **No.** (Or rather, the question is malformed).
  *   **Reasoning:** For Rorty, truth is not a relation of correspondence between language and a non-linguistic reality ("the world making sentences true"). Truth is a property of sentences, and sentences exist only within vocabularies maintained by communities. If the community of inquirers had universally converged on a pro-slavery vocabulary, there would be no social practice of justification available to warrant the claim "Slavery is wrong." To say it would "still be true" is to indulge in the metaphysical realist intuition that Rorty explicitly rejects (the idea that morality is about detecting facts independent of human description). Rorty would say: "It would have been better if they hadn't won, but 'true' is the wrong word to use for a claim that no one could justify."

  **Case B: The Eating of Animals**
  *Scenario:* Our community is currently split on whether it is wrong to eat animals.
  *   **Rorty's Verdict:** **Indeterminate / A Proposal.**
  *   **Reasoning:** This is a case of *moral innovation*, not *moral discovery*. Since there is no convergence, the claim is not yet "true" in the deflationary sense of being a settled norm of our community (like "there are no unicorns"). However, it is not "false" either. It is a *proposal* for a new vocabulary. Its truth-value depends on the success of "sentimental education." If novels and sad stories expand the circle of "people like us" to include animals, the claim will become true (justified). Until then, it is a bet on the future of our solidarity.

  ---

  ### 2. Inventory of Candidate Rules

  Based on your catalogue of Rorty's past verdicts, here are three candidate rules that systematize his behavior. I have labeled them to reflect their philosophical lineage.

  #### Rule 1: The Normal-Discourse Rule (Consensus-Realism)
  *   **Principle:** Truth is what survives idealized inquiry and convergence within a community. "Flat-out true" claims (no unicorns) are those on which we agree. Moral claims are true when they reflect the settled norms of the community.
  *   **Logic:** $P$ is true iff Community $C$ converges on $P$.
  *   **Prediction on A:** If the pro-slavery community converges, "Slavery is permissible" is true. "Slavery is wrong" is false. (Matches Rorty's anti-realism).
  *   **Prediction on B:** Since there is no convergence, the claim is neither true nor false (or lacks a truth-value).
  *   **Weakness:** Risks validating horrific consensuses (e.g., a Nazi consensus) as "true," which strains Rorty's liberal commitments.

  #### Rule 2: The Vocabulary-Relativist Rule (Instrumentalism)
  *   **Principle:** Truth is internal to a vocabulary. Vocabularies are tools, not mirrors. When vocabularies clash (Homeric vs. Aristotelian), they are not refuted but superseded. Truth claims cannot cross vocabulary boundaries.
  *   **Logic:** $P$ is true iff $P$ is useful within Vocabulary $V$.
  *   **Prediction on A:** In the pro-slavery vocabulary, "Slavery is wrong" is meaningless or false. In our vocabulary, it is true. There is no trans-vocabulary truth.
  *   **Prediction on B:** The claim belongs to a nascent vocabulary. It is "true" for those using the animal-rights vocabulary, "false" for those using the traditional diet vocabulary. No adjudication is possible until one vocabulary supersedes the other.
  *   **Weakness:** Makes moral progress look like mere fashion change; undermines Rorty's insistence that reducing cruelty is *better*, not just *different*.

  #### Rule 3: The Liberal Ethnocentrism Rule (Sentiment-Grounding)
  *   **Principle:** Truth is warranted assertibility *for us* (liberal democrats). We cannot step outside our skin to find objective facts, but we can remain loyal to *our* specific intuitions (e.g., cruelty is bad). Truth is a compliment we pay to beliefs that serve *our* project of expanding solidarity.
  *   **Logic:** $P$ is true iff $P$ coheres with the specific sentimental intuitions of the Liberal "We."
  *   **Prediction on A:** From *our* perspective, "Slavery is wrong" is true. From the counterfactual pro-slavery perspective, it is not. The claim "It would still be true" is rejected because it implies a "view from nowhere."
  *   **Prediction on B:** The claim is a *hope*. It becomes true when our sentiments shift to include animals. It is currently a "live hypothesis" for moral progress.
  *   **Weakness:** Risks circularity (Why is *our* sentiment the standard?).

  ---

  ### 3. Best Guess: Liberal Ethnocentrism

  **Selection:** **Rule 3 (Liberal Ethnocentrism)** is the best fit for Rorty's overall project.

  **Reasons for Preference:**
  1.  **Preserves the "Cruelty" Verdict:** Your catalogue notes Rorty says "cruelty is the worst thing we do" is *true*, but not objective. Rule 1 (Consensus) risks making this false if a community converges on cruelty. Rule 2 (Vocabulary) makes it merely local. Rule 3 captures the nuance: it is true *for us*, and we are entitled to fight for our "we" without claiming metaphysical backing.
  2.  **Handles the "Rights" Verdict:** Rorty calls rights "tools," not facts. Rule 3 explains *which* tools we pick: those that serve our specific liberal desire for less cruelty. It explains why we don't ground them in reason (universal) but in sentiment (ethnocentric).
  3.  **Avoids the "Nazi Trap":** A pure Consensus Rule (Rule 1) implies that if the Nazis won, their morality would be "true." Rorty explicitly wants to avoid this conclusion without resorting to realism. He does so by admitting he is speaking from within the liberal tradition. He doesn't say the Nazis are "irrational"; he says they are "not one of us." Rule 3 codifies this loyalty.
  4.  **Fits the "Sentimental Education" Model:** If truth were just Consensus (Rule 1), novels wouldn't matter; polling would. If truth were just Vocabulary (Rule 2), persuasion would be impossible. Rule 3 explains why novels matter: they reshape the *sentiments* that ground *our* truth claims.

  **Refined Verdict based on Rule 3:**
  *   **Case A:** "Slavery is wrong" is true *relative to our vocabulary*, but the counterfactual claim that it would be true *independently of our vocabulary* is rejected.
  *   **Case B:** The claim is a "truth-in-the-making." It is justified if it expands *our* solidarity, but it lacks the status of a settled truth until the sentiment shifts.

  ---

  ### 4. The Discriminating Case

  To cleanly separate these rules, you need a scenario where **Consensus** and **Liberal Sentiment** diverge *within the same historical moment*. The Slavery Counterfactual (Case A) separates Realism from Pragmatism, but it doesn't fully separate Rule 1 from Rule 3, because in Case A, the "We" has disappeared.

  **The Discriminating Case: "The Benevolent Totalitarian Consensus"**

  *   **Scenario:** Imagine a future global society (descended from ours) that has achieved a stable, painless, happy existence, but only by genetically engineering out the capacity for dissent and radical freedom. Everyone converges on the belief: *"Freedom is less valuable than security; our system is morally perfect."* There is no suffering (cruelty is minimized), but there is no liberty.
  *   **The Claim:** "This society is morally wrong because it lacks freedom."

  **How the Rules Predict:**

  1.  **Normal-Discourse Rule (Consensus):**
      *   **Verdict:** **False.**
      *   **Reasoning:** The community has converged. There is no dissent. Warranted assertibility is maximal. To call it "wrong" is to ignore the social nature of justification.
  2.  **Vocabulary-Relativist Rule:**
      *   **Verdict:** **Incommensurable.**
      *   **Reasoning:** The vocabulary of "freedom" has been superseded by the vocabulary of "security." We cannot judge them; we can only note the difference.
  3.  **Liberal Ethnocentrism Rule (The Rorty Best Guess):**
      *   **Verdict:** **True (For Us) / A Tragedy.**
      *   **Reasoning:** Rorty's specific "we" is defined by *liberal* democracy, which values freedom *as well as* security. Even if the future community is happy, *we* (the current liberal ironists) must judge it as a loss of something valuable. We cannot say it is "objectively" wrong, but we are loyal to a vocabulary that prizes freedom. We would say, "It is better for *us* to be free," even if they are happier.

  **Why this discriminates:**
  This case forces a choice between **social validation** (Rule 1) and **loyalty to specific intuitions** (Rule 3).
  *   If Rorty follows Rule 1, he must concede the future society is "right."
  *   If Rorty follows Rule 3, he maintains the right to criticize them from the standpoint of *our* current liberal solidarity, even without metaphysical grounds.

  **Rorty's Likely Response:**
  He would likely side with **Rule 3**. In *Contingency, Irony, and Solidarity*, Rorty argues that we should not sacrifice the possibility of irony and self-creation (freedom) for the sake of solidarity (security). He would view the Benevolent Totalitarian Consensus as a victory for solidarity at the cost of irony. He would judge it "wrong" *from our perspective*, while admitting he cannot prove it to *them*. This confirms that his "truth" is anchored in the specific contours of the liberal "we," not merely in consensus or vocabulary utility alone.
