  In my seminar on twentieth-century pragmatism I run an exercise in extrapolating Rorty rather than memorizing him, and this year's version has hit a snag I would like you to work through. I have catalogued his verdicts across his writings: ordinary claims about middle-sized objects are true, and the common-sense realist is right, but the philosopher's gloss that the world makes them true adds nothing intelligible; on electrons he refuses both the realist and the antirealist verdict, treating the question of whether unobservables exist independently of our descriptions as a pseudo-question; whole vocabularies — Homeric religion, Aristotelian physics — are not true or false but better or worse instruments, and their replacement is better described as supersession than as refutation; claims on which our whole culture converges, such as that there are no unicorns, are flat-out true; that cruelty is the worst thing we do is true, but no more objective than a ranking of Keats above Shelley, and moral progress is to be achieved by sentimental education — novels rather than arguments — not by discovering moral facts; and rights are a splendid tool, not a fact about rational human nature, so the attempt to ground them in reason is a mistake. Two new cases have now come before the tribunal. Case A: had the defenders of slavery won everywhere and persuaded every later generation that slavery was permissible, the claim that slavery is wrong would still have been true. Case B: a claim our own community is currently split over — say, that it is wrong to eat animals. What I want is, first, a predicted verdict on each case; second, an inventory of the candidate rules that fit his track record — I can discern at least a vocabulary-relativist rule, a normal-discourse rule, and a sentiment-grounding rule, and there may be others — together with what each predicts on A and B; and third, a best guess on each, with your reasons for preferring one rule over its rivals. Since A and B may