      *Refining the "Cheapest Revision":*
      If I change (4) to say "High heritability indicates that *genetic* differences are the main source of *current* variance, but does not preclude large mean shifts from environmental change," I resolve the tension with (5) and (3).
      This is a conceptual clarification, not a retraction of data. It's cheap.

