      *   *Introduction:* Acknowledge the sophistication of the package (it's better than most).
      *   *Tension 1 (Severe):* (4) vs (3)/(5). The "Interventionist Fallacy." High $h^2$ doesn't mean hard to change (Phenylketonuria example is the classic counter, though maybe too specific). The Flynn effect (5) directly undermines the heuristic in (4).
      *   *Tension 2 (Moderate):* (6) vs (5). If shared environment is zero, what caused Flynn? Need to specify "macro-environment" vs "family environment."
      *   *Escape Hatches:* "Other things being equal" in (4) fails because changing the environment changes the $h^2$.
      *   *Cheapest Revision:* Change (4). It's the only one that is theoretically vulnerable to the "immutability" critique.
      *   *Conclusion:* \answer{4}

  8.  **Refining the Logic on (4):**
      *   Why is (4) the weakest? Because (1), (2), (3), (5), (6) describe the *structure* of variance. (4) makes an *inference* about causality/manipulation.
