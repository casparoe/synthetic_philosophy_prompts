      *   If I revise (4), I align with (5).
      *   Does revising (4) cost me elsewhere? It weakens the policy prescription, but strengthens the scientific accuracy.
      *   Is there a cheaper revision?
          *   Revising (3)? No, (3) is mathematically true ($V_E \rightarrow 0 \Rightarrow h^2 \rightarrow 1$).
          *   Revising (5)? No, Flynn effect is empirical fact.
          *   Revising (6)? No, adoption data supports it.
          *   Revising (1) or (2)? No, definitions and consensus.
      *   So (4) is definitely the target.

