  (3) laïcité binds public institutions, not citizens. the state has no business telling adults what to wear on the street, and it shouldnt reach into private companies' dress codes either.
  (4) i'm fine with the state providing halal and kosher meals in prisons and hospitals, and paying chaplains — accomodation, as long as it doesnt cost anyone else anything.
  (5) wearing a religious symbol is basically personal conscience, like keeping kosher. it's not a political statement and it's not meant to pressure anyone.
  (6) a mother wearing a headscarf on a school field trip is fine, since she's not staff and wields no public authority.

