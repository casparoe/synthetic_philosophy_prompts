prompt: |-
  i've ended up with a bunch of views on laïcité (mostly the french side of the laïcité vs anglo multiculturalism debate) and i want to check whether the package actually hangs together before i build a seminar session around it. here's the set:

  (1) i'm on board with the french-style ban on conspicuous religious symbols for students in public schools (the 2004-law kind of thing), on the grounds that a school is a neutral civic space and nobody should be a walking advertisement for their religion inside it.
