  All we can grasp is the structure of nature.
  Laudan's dead theories still shine in the light.
  There is nothing else; no hidden signature.

  Success demands truth, but the real is obscure.
  Yet miracles demand something in sight.
  All we can grasp is the structure of nature.

  The ether departed, leaving structure pure.
  Fresnel's math shone in the empirical light.
  There is nothing else; no hidden signature.

  Relata fade out, being no essential feature.
  Relations persist through the theoretical flight.
  All we can grasp is the structure of nature.

  Newman shows structure alone is insecure.
  Any set maps to any within our sight.
  There is nothing else; no hidden signature.

  One claim saves realism, one leaves the rest obscure.
  The distinction dissolves in the final light.
  All we can grasp is the structure of nature.
  There is nothing else; no hidden signature.

