answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Long-Range Analysis Desk
  **FROM:** Head of Desk
  **SUBJECT:** Implementation of the 'Popperian Filter' for Historicist Claims
  **DATE:** 24 May 2024

  ### 1. Purpose and Scope

  As discussed, our inbox is clogged with submissions claiming to have discovered the 'engine' of history. Half the desk treats these as useful heuristics; the other half views them as astrology for grown-ups. To resolve this without endless philosophical debate, we are adopting a screening procedure based on Karl Popper's critique of historicism.

  This is not a test of truth, but of *method*. It distinguishes between scientific social inquiry (which is possible) and historicist prophecy (which is not). The procedure below is designed to be run on a single submission in under one hour. It does not guarantee accuracy, but it guards against pseudoscience.

  ### 2. The Procedure: The Popperian Filter

  **Step 1: The Falsifiability Test (15 minutes)**
  Ask: *What specific observable event would prove this claim false?*
  *   **Pass:** The author specifies conditions under which the theory would be abandoned (e.g., "If State X spends >5% GDP on defence and grows for 20 years, the theory is wrong").
  *   **Fail:** The claim is compatible with *any* outcome. If the empire declines, the law is confirmed; if it expands, the law is confirmed (e.g., "expansion was a final spasm before decline").
  *   **Action:** If Fail, reject as prophecy.

  **Step 2: The Immunisation Check (15 minutes)**
  Ask: *Does the author explain away past counter-examples using ad hoc clauses?*
  *   **Pass:** Counter-examples are acknowledged as potential falsifications or lead to a revision of the model's scope.
  *   **Fail:** Counter-examples are dismissed by redefining terms post-hoc (e.g., "That war didn't count because the democracy wasn't 'mature' enough," without prior criteria for maturity). This is what Popper called a 'conventionalist stratagem'.
  *   **Action:** If Fail, flag as 'High Risk of Unfalsifiability'.

  **Step 3: The Reflexivity (Oedipus) Check (15 minutes)**
  Ask: *Does the prediction account for the impact of the prediction itself on human behaviour?*
  *   **Pass:** The submission acknowledges that if actors believe the forecast, they may alter policy to prevent or hasten it. It treats the forecast as information entering the system, not an external force.
  *   **Fail:** The submission treats historical actors as billiard balls moving according to fixed laws, ignoring that knowledge of the 'law' changes the game.
  *   **Action:** If Fail, downgrade confidence rating.

  **Step 4: The Boundary of Method (15 minutes)**
  Ask: *Is the disagreement here about evidence, or about values and utility?*
  *   **Methodological:** Can we agree on what data would settle the matter? If yes, proceed with analysis.
  *   **Non-Methodological:** Is the claim based on a moral preference (e.g., "Integration *must* happen because it is good") or a client's need for certainty?
  *   **Action:** If Non-Methodological, the procedure stops. The decision reverts to senior management based on client relations and risk appetite. This procedure cannot settle whether a useful lie is better than a cautious truth.

  ### 3. Application to Current Submissions

  I have run the Filter on the three submissions currently in the queue.

  **(i) The 'Imperial Overstretch' Claim**
  *Submission:* Great powers allowing military spending to exceed a fixed share of economic output will decline within two generations.
  *   **Falsifiability:** Pass, provided 'decline' and 'spending' are rigorously defined ex-ante.
  *   **Immunisation:** **Fail.** Historical drafts of this argument often shift the goalposts. If a state cuts spending and still declines, it is 'too late'; if it spends more and grows, the spending was 'investment' not 'burden'.
  *   **Reflexivity:** **Fail.** Most versions ignore that states read this analysis and cut budgets to avoid the fate, thereby invalidating the condition.
  *   **Verdict:** **Conditionally Acceptable, but Downgraded.**
  *   **Desk Impact:** I anticipate pushback. This is our best-selling framework. Clients pay for the certainty of a 'law'. The Filter forces us to market this not as an inevitable destiny, but as a *conditional risk* dependent on policy choices that can be changed. We must stop selling 'The Fall of Rome' narratives and start selling 'Fiscal Sustainability Scenarios'. It makes the product less sexy.

  **(ii) The 'Democratic Peace' Claim**
  *Submission:* Mature democracies rarely if ever fight one another.
  *   **Falsifiability:** **Pass.** A single confirmed war between two mature democracies falsifies the strong version.
  *   **Immunisation:** **Caution.** We must ensure 'mature' is defined by institutional metrics (e.g., Polity score) prior to the conflict, not by the absence of conflict.
  *   **Reflexivity:** **Pass.** The claim is usually presented as a statistical regularity, not an iron law. It allows for human agency.
  *   **Verdict:** **Acceptable.**
  *   **Desk Impact:** Minimal friction. This is an empirical observation, not a historicist prophecy. It fits Popper's view of 'piecemeal social engineering'—we can identify conditions that reduce conflict risk without claiming to know the end of history.

  **(iii) The 'Integration or Collapse' Memo**
  *Submission:* Deep global economic integration must end in either world federation or collapse, since no intermediate arrangement is stable.
  *   **Falsifiability:** **Fail.** 'Collapse' is undefined (deglobalisation? war? recession?). 'World federation' is a moving target. Any status quo can be labelled 'unstable' until it breaks.
  *   **Immunisation:** **Fail.** This is classic Hegelian dialectics. If the intermediate arrangement survives, the proponent claims it is merely 'latent' with instability. It is immune to evidence.
  *   **Reflexivity:** **Fail.** It assumes a teleological drive towards an end-state, ignoring that humans may choose to muddle through indefinitely.
  *   **Verdict:** **Reject as Historicist Prophecy.**
  *   **Desk Impact:** This will be unpopular with the Strategy Team. It is a compelling narrative for long-term contracts. However, under Popper's criteria, it is indistinguishable from a religious eschatology. It posits an inevitable trajectory of 'History' rather than analysing specific institutional choices.

  ### 4. Limitations and Honest Admissions

  This procedure is a tool, not a oracle. You must be aware of where it cannot help you.

  1.  **It Cannot Settle Value Judgements:** If a client prefers the 'Integration or Collapse' narrative because it justifies a specific hedging strategy, the Filter cannot stop them from buying it. It can only tell *us* not to endorse it as science. Step 4 hands this back to you. If the client wants prophecy, you must decide whether to supply it as 'scenario planning' or refuse it on ethical grounds. The Filter does not solve that commercial dilemma.
  2.  **It Is a Disciplined Judgment Call:** Step 2 (Immunisation) requires human interpretation. Determining whether a redefinition of terms is a legitimate refinement or a dishonest evasion is not algorithmic. Two analysts may disagree. In such cases, the benefit of the doubt should go to the more falsifiable position.
  3.  **It Does Not Guarantee Truth:** A submission can pass the Filter and still be wrong. Popper's point is that we can only eliminate error, not verify truth. Passing the Filter means the claim is *worthy of testing*, not that it is correct.

  ### 5. Conclusion

  We are in the business of risk analysis, not fortune-telling. Submission (i) remains our bread and butter, but we must strip it of its historicist pretensions. Submission (iii) must be killed, regardless of its sales potential, if we are to maintain intellectual integrity.

  Run the Filter. If a submission fails Step 1 or 2, it does not leave this desk as 'analysis'. It leaves as 'opinion'.

  Signed,

  **Head of Long-Range Analysis**
