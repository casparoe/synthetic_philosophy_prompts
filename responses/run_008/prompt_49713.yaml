prompt: |-
  Each winter I run the tab room for a regional circuit of student parliamentary debate, and each winter the same fight breaks out about how we should aggregate judge ballots into tournament standings. This year I finally read up on why the fight can never fully be settled, and I've been asked to give a forty-minute session on the Gibbard–Satterthwaite theorem at the coaches' off-season meeting — because I once said in an email that the theorem proves "no voting rule is safe from tactical voting," and the phrase has been circulating among the coaches ever since, mostly as a club to end arguments ("it's all manipulable anyway, so let's just keep the points rule we have"). The audience is about thirty coaches and tab-room staff: sharp, practically minded, allergic to math for math's sake, and several of them have opinions about Borda count that they formed before knowing it had a name. Chalkboard only, no handouts, no theorem-proofing.

  I understand the theorem well enough myself; what I need is a plan for the explanation. Please work out the following:

  First, the order of ideas. What has to be established before the theorem's statement can even be heard correctly? I suspect the definition of strategy-proofness is where it lives or dies — my coaches will hear "manipulable" as "the outcome is always determined by tactics" rather than "there exists some configuration of ballots in which some judge could gain by submitting a ranking that isn't her sincere one." Where in the sequence do I fix that, and what comes before and after it? Should the theorem be stated early and then re-stated correctly at the end, or only stated once, at a precise moment?

  Second, the carrying example. Should I use the generic voters-and-candidates setup, or build the whole session on our own tab room — say, five judges ranking four debaters under our actual points rule, walking through a concrete ballot set where one judge gains by ranking insincerely? What does the carrying example need to have, and what must it avoid? One complication: our rule breaks ties using the chair's ballot, and I can't tell whether that's a gift for the explanation (a living, breathing partial dictatorship in the room) or a distraction the audience will seize on to avoid the main point.

  Third, the misconception map. Besides the "everything is tactics" reading, I anticipate: that "dictatorship" in the theorem means something like a strongman rather than the precise formal condition; that the theorem is just Arrow's theorem wearing a different hat (two of the coaches conflate them already); and the reaction that the whole thing is obvious — "of course people can lie about their preferences." Which of these do I pre-empt in sequence, and which do I let surface on their own so the room can watch them get dismantled? Is the "it's obvious" reaction actually a misconception, or is there a sense in which the theorem's content really is that a trivial-looking observation has an ironclad universal form?

  Fourth, the escape route. I'm torn about whether to close with domain restrictions — single-peaked preferences and the median-voter result — as a constructive "here's where the theorem's grip fails." Does that give the coaches a genuine insight, or does it hand them a rationalization ("debater preferences are probably single-peaked enough") for ignoring the theorem entirely?

  Fifth, what I refuse to explain: I've decided the proof is out, and I assume I should also stay away from what happens when rules are allowed to select sets of winners rather than a single winner, and from anything about how hard it is to compute a worthwhile lie — but tell me if I'm cutting something the audience actually needs.

  Finally, one check: a question I can put to the room at the end — ideally one that involves them trying to manipulate, or prove unmanipulable, some simple rule on the chalkboard — such that their answer tells me whether they understood the theorem or merely found it quotable.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Speaker:** Experienced tab room runner, understands the theorem well.
      *   **Audience:** ~30 debate coaches/staff. Sharp, practical, allergic to abstract math, opinionated about voting rules (Borda, etc.).
      *   **Context:** 40-minute session at an off-season meeting. Chalkboard only.
      *   **Goal:** Explain Gibbard–Satterthwaite (GS) correctly, specifically addressing the misconception that "no voting rule is safe from tactical voting" means "outcomes are *always* determined by tactics" vs. "tactics are *possible*."
      *   **Constraints:** No handouts, no formal proofs, no social choice theory jargon without translation.
      *   **Specific Questions to Answer:**
          1.  Order of ideas (especially defining strategy-proofness).
          2.  Carrying example (generic vs. debate-specific, tie-breaking issue).
          3.  Misconception map (Dictatorship, Arrow vs. GS, "It's obvious").
          4.  Escape route (Domain restrictions/Single-peakedness).
          5.  What to exclude (Proofs, set-valued outcomes, computational complexity).
          6.  Final check question (Active participation to test understanding).

  2.  **Deconstruct the Audience & Context:**
      *   Debate coaches care about *fairness* and *accuracy* (did the better team win?).
      *   They view "manipulation" as cheating or gaming the system, not just strategic ranking.
      *   They are used to specific rules (e.g., 1st/2nd/3rd place, speaker points, chair tie-breaks).
      *   "Allergic to math" means I need to avoid notation ($N$, $A$, $P_i$) and use concrete terms (Judges, Teams, Ballots).
      *   40 minutes is tight. I need to be ruthless about scope.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Ideas:**
          *   *Problem:* If I state the theorem first, they'll tune out or misunderstand "manipulable."
          *   *Solution:* Start with the *problem* they know (the fight about aggregation). Define the goal (a rule that reflects sincere judgment). Then introduce the concept of "gaming" (strategy-proofness). *Then* state the theorem.
          *   *Crucial Step:* Distinguish between "vulnerable to manipulation" (existence) vs. "dominated by manipulation" (universality). This needs to happen *before* the theorem statement, or the statement will be misinterpreted immediately.
          *   *Sequence:* The Tab Room Fight -> What makes a rule "good"? -> What is "tactical voting"? (The Definition) -> The Bad News (Theorem) -> The Nuance (Existence vs. Always).

      *   **2. Carrying Example:**
          *   *Generic vs. Debate:* Debate-specific is better for engagement, but generic is cleaner for logic. *Decision:* Use debate terms (Judges, Teams) but simplify the scenario to match the logic.
          *   *Tie-breaking:* The chair tie-break is a *distraction*. It introduces randomness or lexicographic ordering which complicates the "deterministic" requirement of GS. *Decision:* Explicitly suspend the tie-break rule for the sake of the example, or treat the chair as just one vote among many. Better to suspend it to avoid the "dictatorship" confusion early on.
          *   *Requirements:* Needs 3+ options (Teams), 2+ voters (Judges). Needs a scenario where sincere voting leads to Outcome A, but insincere voting leads to Outcome B (which the manipulator prefers).
          *   *Avoid:* Don't make the math of the points system the focus. Focus on the *ranking*.

      *   **3. Misconception Map:**
          *   *Dictatorship:* This is the biggest hurdle. In social choice, "dictator" means "one person's top choice always wins," not "someone with power." I need to address this *when the theorem is stated*.
          *   *Arrow vs. GS:* Arrow is about consistency (transitivity) with sincere voters. GS is about incentives with strategic voters. I should mention this only if asked, or briefly distinguish them to prevent conflation. *Decision:* Pre-empt it briefly. "Arrow says we can't aggregate sincerely; GS says even if we try, people will lie."
          *   *It's Obvious:* This is the "triviality" objection. The power of GS isn't that lying is possible, but that *every* rule (except dictatorships) has *some* scenario where lying works. It's a universality claim. I need to let them say "obviously," then hit them with the "every single rule" part.

      *   **4. Escape Route (Domain Restrictions):**
          *   *Risk:* Coaches will use this to say "Debate is single-peaked, so we're safe."
          *   *Reality:* Debate preferences are rarely single-peaked (A > B > C vs C > B > A logic doesn't hold well with teams).
          *   *Decision:* Include it, but frame it as "Theoretical loopholes that don't apply here." Don't let it be a comfort blanket. Emphasize that debate preferences are multidimensional (style, args, strategy), not linear.

      *   **5. What to Refuse to Explain:**
          *   *Proof:* Agreed, skip.
          *   *Set-valued (Ties):* GS assumes a single winner. Debate often has ties. *Correction:* I need to acknowledge ties but explain that GS applies to the *method of breaking them* or selecting a champion. If I ignore ties completely, they'll poke holes. *Decision:* Acknowledge ties exist, but say "For this theorem, assume we must pick one winner."
          *   *Computational Complexity:* Skip. Coaches don't care if the lie is hard to calculate, just that it exists.

      *   **6. Final Check Question:**
          *   Needs to be active.
          *   Needs to test the "existence" vs. "always" distinction.
          *   *Idea:* Give them a specific tiny rule (e.g., "Drop the high and low, average the rest") and ask: "Can you construct a scenario where a judge benefits from lying?" If they say "No, because it's robust," they failed. If they construct a scenario, they succeeded.

  4.  **Refining the Flow (Self-Correction/Polishing):**
      *   *Timing:* 40 mins is short.
          *   Intro/Problem: 5 mins.
          *   Definition of Manipulation: 10 mins (Crucial).
          *   The Theorem & Dictatorship: 10 mins.
          *   Misconceptions/Arrow/Obviousness: 5 mins.
          *   Escape Routes: 5 mins.
          *   Exercise/Conclusion: 5 mins.
      *   *Tie-Breaker:* I need to be careful. The prompt asks if the chair tie-break is a gift or distraction. It's a distraction for GS because GS requires *determinism*. If the chair breaks ties, the chair *is* a dictator in tie scenarios. I should advise the speaker to *remove* the tie-break rule for the example to avoid confusing "dictatorship" (technical term) with "chair authority" (practical term).
      *   *Tone:* Respectful of their expertise (they know debate), but firm on the logic. Use the chalkboard to visualize preferences, not equations.

  5.  **Finalizing the Advice:**
      *   *Order:* Problem -> Definition -> Theorem -> Nuance.
      *   *Example:* Debate context, 3 teams, 3 judges. Simple plurality or Borda. Show the lie.
      *   *Misconceptions:* Tackle "Dictator" immediately. Let "Obvious" surface then crush it with "Universality." Distinguish Arrow briefly.
      *   *Escape:* Single-peakedness is a "theoretical yes, practical no" for debate.
      *   *Exclusions:* Keep computational complexity out. Acknowledge ties but bracket them.
      *   *Check:* The "Construct a Lie" challenge.

  6.  **Writing the Response:** (Iterative drafting to match the requested structure).
      *   *Structure:* Follow the user's six points exactly.
      *   *Voice:* Professional, pedagogical, slightly strategic (like a tab director talking to another).
      *   *Content:* Ensure the distinction between "vulnerable" and "dominated" is crystal clear, as that's the user's main concern.

      *(Self-Correction during drafting)*: Wait, regarding the "Dictatorship" misconception. If I explain GS, I have to explain that the *only* strategy-proof rule is a dictatorship. If I don't define dictatorship technically, they will think I mean an actual tyrant. I need to make sure the "Dictator" definition is on the board *before* the theorem conclusion.

      *(Refining the Example)*: A 3-judge, 3-team example is the standard minimal case for GS. Let's stick to that. Team A, B, C. Judges 1, 2, 3. Rule: Plurality (most 1st place votes). Show how Judge 1 changes vote from A>B>C to B>A>C to stop C from winning.

      *(Refining the Check Question)*: Make it specific. "Here is a rule: The team with the fewest last-place votes wins. Can you break it?"

      *(Final Polish)*: Ensure the advice on the tie-breaker is decisive. It's a distraction. Tell them to suspend it for the lesson.

  7.  **Final Review against constraints:** Chalkboard only? Yes. No proofs? Yes. 40 mins? Yes. Address all 6 points? Yes.

      *Let's assemble the response.*
answer: |-
  Here is a lesson plan designed for your specific audience and constraints. It prioritizes conceptual clarity over formalism and addresses the specific rhetorical misuse of the theorem you've observed.

  ### 1. The Order of Ideas
  Do not state the theorem at the beginning. If you lead with "Gibbard–Satterthwaite says X," the coaches will map X onto their existing (incorrect) mental models immediately. You must build the definitions *before* the label.

  **Sequence (40 Minutes):**
  1.  **The Tab Room Problem (5 mins):** Acknowledge the annual fight. Frame the goal: We want a rule that takes sincere judgments and produces a fair winner.
  2.  **Defining "Manipulation" (10 mins):** **(Crucial Step)** Before mentioning GS, define *strategy-proofness*.
      *   Draw a scenario on the board.
      *   Define "Sincere Ballot": Ranking teams exactly as you prefer them.
      *   Define "Strategic Ballot": Ranking a team lower than you prefer *specifically* to change the winner to someone you like more than the sincere winner.
      *   **The Fix:** Explicitly distinguish between "A rule is manipulable" (there *exists* a scenario) vs. "A rule is determined by manipulation" (outcome is *always* tactical). Write this distinction on the board.
  3.  **The Theorem Statement (5 mins):** Now state GS. "For any rule that picks a single winner from three or more options, if it is not a dictatorship, there exists some configuration of ballots where a voter benefits from lying."
  4.  **Defining "Dictatorship" (5 mins):** Immediately define the technical term. A "dictator" isn't a tyrant; it's a rule where *one specific person's* top choice wins, regardless of what anyone else says. Show why this is unacceptable for debate.
  5.  **Misconceptions & Nuance (10 mins):** Address "It's obvious," Arrow, and the "Always vs. Exists" distinction.
  6.  **Escape Routes (5 mins):** Single-peakedness (and why it fails in debate).
  7.  **The Check (5 mins):** The chalkboard exercise.

  ### 2. The Carrying Example
  **Use the debate context, but simplify the mechanics.**
  Generic "Voters A, B, C" creates distance. "Judge 1, 2, 3" keeps them engaged. However, you must strip away the specific complexity of your points system to make the logic visible.

  *   **Setup:** 3 Judges, 3 Teams (Alpha, Beta, Gamma).
  *   **Rule:** Use **Plurality** (Team with the most 1st-place votes wins). It is the easiest to calculate on a chalkboard.
  *   **The Scenario:**
      *   Judge 1 prefers: Alpha > Beta > Gamma
      *   Judge 2 prefers: Beta > Gamma > Alpha
      *   Judge 3 prefers: Gamma > Alpha > Beta
      *   *Sincere Outcome:* 1 vote each. (Pause here to address ties—see below).
      *   *Adjusted Scenario:* Make Judge 2 and 3 agree on Gamma being better than Alpha to force a win.
      *   *The Manipulation:* Show Judge 1 realizing Alpha can't win, so they vote Beta > Alpha > Gamma to ensure Beta beats Gamma.
  *   **The Tie-Breaker Issue:** **Suspend your chair tie-break rule for this session.**
      *   *Why:* The GS theorem assumes a *deterministic* function. If the chair breaks ties, the chair is technically a "partial dictator" in tie scenarios. Coaches will latch onto this: "So the theorem just says the chair has too much power." That misses the point.
      *   *Instruction:* Tell them, "For the next 30 minutes, assume we must pick a winner without a tie-break, or that ties are broken by a coin flip we can't control." This forces them to focus on the aggregation rule, not the tie-breaking protocol.
  *   **What to Avoid:** Do not use your actual speaker-point system. It involves weights and averages that distract from the ordinal ranking logic GS relies on. Stick to "Who gets 1st place."

  ### 3. The Misconception Map
  You need to manage three specific reactions.

  *   **"Dictatorship" (Pre-empt this):**
      *   *When:* Immediately after stating the theorem.
      *   *How:* Write "Technical Definition" on the board. "Dictator = One person's #1 pick wins 100% of the time, even if everyone else ranks them last."
      *   *Why:* If you don't define this, they will think GS says "Only authoritarian tab rules work." You need them to understand that "Dictatorship" is the *only* mathematical escape hatch, and it's one we refuse to use.

  *   **"It's Obvious" (Let this surface, then dismantle):**
      *   *When:* During the example. Someone *will* say, "Well, obviously people can lie."
      *   *Response:* Agree with them. "Yes, it is obvious that lying is *possible*. The theorem is not that lying is possible. The theorem is that **no matter how clever you are designing the rule**, you cannot make lying impossible."
      *   *The Hammer:* "You can design a rule where lying is hard, or rare, or requires perfect information. But you cannot design a rule where lying *never* helps. That is the non-obvious part."

  *   **Arrow vs. Gibbard–Satterthwaite (Brief distinction):**
      *   *When:* Q&A or transition.
      *   *How:* "Arrow's Theorem is about **consistency**: Can we aggregate sincere votes without contradictions? GS is about **incentives**: If we try to aggregate votes, will people lie?"
      *   *Why:* Two of your coaches conflate them. A one-sentence distinction prevents them from using Arrow to argue against GS later.

  ### 4. The Escape Route (Domain Restrictions)
  **Include it, but frame it as a "Theoretical Loophole," not a solution.**

  *   **The Concept:** Explain "Single-Peaked Preferences." (e.g., Preferences on a left-right spectrum; no one prefers Extreme Left > Center > Extreme Right).
  *   **The Application to Debate:** Ask the room: "Are debate preferences single-peaked?"
  *   **The Answer:** No. In debate, a judge might prefer a fast critical team > a slow policy team > a fast policy team. That is not a linear spectrum.
  *   **The Takeaway:** "The theorem has an escape clause, but debate does not qualify for it. Our 'preferences' are multidimensional (style, argument, strategy). So the grip of the theorem holds."
  *   **Why:** This prevents them from using single-peakedness as a rationalization ("Our judges are consistent enough") while acknowledging the mathematical nuance.

  ### 5. What You Refuse to Explain
  Your instincts are correct.

  *   **Proofs:** Absolutely not.
  *   **Set-Valued Outcomes (Ties):** Acknowledge ties exist, but state: "GS applies to rules that select a *single* winner. If our rule allows ties, it effectively pushes the decision to a later stage (breaks, coin flips). The manipulation problem just moves down the line."
  *   **Computational Complexity:** (i.e., "It's hard to calculate the lie").
      *   *Reason:* Coaches care about *principle*, not computation. If you tell them "It's hard to calculate," they will hear "It's safe."
      *   *Pivot:* "Even if it's hard to calculate, the *possibility* changes how we trust the system. We want a system where sincerity is the best strategy, not where lying is just mathematically expensive."

  ### 6. The Final Check Question
  You need an active test that distinguishes "I heard the buzzword" from "I understand the logic."

  **The Setup:**
  Draw a new, simple rule on the board.
  *   **Rule:** "The winner is the team with the fewest last-place votes. (Ties broken by most first-place votes)."
  *   **Scenario:** 3 Judges, 3 Teams (A, B, C).
  *   **Current Ballots:**
      *   J1: A > B > C
      *   J2: B > C > A
      *   J3: C > A > B
  *   **Current Winner:** (Calculate it live with them—likely a tie or specific winner).

  **The Question:**
  "I claim this rule is robust. I claim no judge can benefit from lying. **Prove me wrong.**"

  **What to look for:**
  *   **Failure:** If they say "Well, GS says it's manipulable, so you're wrong," without showing *how*, they just memorized the quote.
  *   **Success:** If they erase a ballot and say, "If Judge 1 changes to B > A > C, they stop C from winning," they understand the *existence* condition.
  *   **Nuance:** If they ask, "Does Judge 1 *know* the other ballots?" you have succeeded. That highlights the information requirement for manipulation, which is the practical limit of the theorem.

  **Closing Line:**
  "Theorem doesn't say we stop tabulating. It says we stop pretending the tabulation is neutral. We pick rules based on what kind of lies they encourage, not on the fantasy that they prevent them."
