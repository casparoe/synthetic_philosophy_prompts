      *Check Tension 3 again.* If Possible Worlds are just formalism, then "Reason why it is so and not otherwise" (PSR) loses its bite. "Otherwise" must be *possible* for the question to make sense. If "otherwise" is meaningless formalism, PSR collapses into "Things are as they are." I need to press this.

