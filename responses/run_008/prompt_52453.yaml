          *   *Anderson:* "Imagined communities." "Imagined" $\neq$ "False." It means mentally conceived.
          *   *Verdict:* "Fabrication" is a loaded term. Historians accept "socially constructed" but reject "fabrication" if it implies "fake/false."

      *   *Claim 2 (Hobsbawm on Traditions):*
