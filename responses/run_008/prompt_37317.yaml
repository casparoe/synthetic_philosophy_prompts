answer: |-
  Friends, colleagues, comrades.

  Twelve years. That's a long time to spend Tuesday nights in church basements and rented halls, arguing over paragraph three of a platform no one will read, knocking on doors in the rain, and counting ballots until our eyes blur. I have loved this work. I have loved many of you. There are people in this room whose hands I have held during losses that felt like deaths, and whose shoulders I've leaned on when the work felt too heavy to carry alone.

  So, when I say I am stepping away, I need you to know this is not burnout. I am not tired of the work. I am tired of the shape the work takes.

  For a long time, I thought our problems were about strategy, or messaging, or finding the right candidates. But recently, I sat down to think about what a party actually *is*. Not what we say it is, but what it does. And I realized that for twelve years, I have been helping to operate a machine designed to exert pressure on the human mind.

  We all know the feeling. An idea comes into this room—nuanced, complicated, maybe even uncertain. But by the time we are done with it, by the time it is ready for a flyer or a speech, it has been sanded down. It has become a slogan. It has to, because the machine requires fuel. It requires certainty.

  I look back at our Tuesday night meetings, and I see now that we weren't just discussing policy. We were subtly pressuring each other to feel the same way at the same time. We mistook that shared temperature for conviction. We told ourselves it was solidarity. And often, it was kindness. But often, it was contagion. We learned to recognize an idea not by whether it was true, but by whether it was *ours*.

  I am not saying this to condemn you. I am saying this to implicate myself. I was the deputy chair. I helped turn the gears. I know that when you have spent decades giving your life to a cause, the idea that the vessel itself might be flawed feels like a betrayal. It feels like I'm calling your passion a trick.

  It isn't a trick. Your passion is real. Your desire for justice is real. But a party is a structure that channels that desire into a specific kind of energy: collective pressure. It asks us to stop thinking as individuals and start thinking as a bloc. It asks us to defend things we privately doubt because the "team" needs defense. It asks us to simplify the world until it fits on a bumper sticker, because the machine cannot process complexity.

  I have reached a point where I can no longer do that. I need to be able to look at an idea and ask if it is true, without first asking if it helps us win. I need to be able to listen to someone outside this room without checking if they are a friend or a foe before I hear their words.

  I know what some of you are thinking. You're thinking, "Without the machine, nothing gets done." And to my successor, and to the staff who keep the lights on: I am not asking you to stop. You have bills to pay and promises to keep. The world is on fire, and you are trying to carry water. I respect that. I am not claiming I have built a better machine. I don't know how to organize collective action without some form of structure. I am only saying that I need to step out of this one to see if I can find my own mind again.

  There is a way to care for the world that doesn't require us to surrender our judgment to a group. There is a way to act together that isn't based on pressure. I don't have the blueprint for it. I can't hand you a pamphlet on how to fix this. I only know that I cannot stay.

  I am not leaving because I don't care. I am leaving because I care too much about the truth to keep participating in a system that requires me to polish it down until it shines like a weapon.

  So, I am not asking for your applause. I am not asking for your sad hugs. I am asking for your argument. When this dinner is over, come find me at the bar. Tell me I'm wrong. Tell me that the pressure is necessary. Tell me that the slogans are worth the simplification. I want to hear it. I want to wrestle with it.

  Because if I've learned anything in twelve years, it's that the only thing more dangerous than a party that demands agreement is a friend who refuses to disagree.

  Thank you. Let's eat.
