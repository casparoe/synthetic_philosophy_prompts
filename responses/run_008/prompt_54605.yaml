  1.  **Analyze the User's Request:**
      *   **Context:** The user's roommate (a critical theory student) uses the phrase "knowledge is power" to argue that politically neutral research is impossible.
      *   **User's Intuition:** The user suspects the roommate is referencing Foucault (specifically *Discipline and Punish* and the idea that power produces knowledge/knowledge reinforces power, e.g., the panopticon), but isn't sure if that's the common usage or if the logic holds.
      *   **Task:** Create a "menu" of distinct, precise interpretations of "knowledge is power."
      *   **Requirements:**
