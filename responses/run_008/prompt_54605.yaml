          *   Evaluate plausibility for each.
          *   Evaluate whether each supports the conclusion that "politically neutral inquiry is an illusion."
          *   Tone: Helpful, analytical, accessible (American English).
          *   Audience: The user (who hasn't read Foucault) to take back to the roommate (who has).

  2.  **Deconstruct the Phrase "Knowledge is Power":**
      *   *Origin:* Often attributed to Francis Bacon ("Scientia potentia est"), but Foucault gives it the critical theory twist.
      *   *Common Usage:* Education = opportunity/control over life.
      *   *Critical Theory Usage:* Epistemology is political. Truth regimes.
      *   *Conspiratorial:* Elites controlling information.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Option 1: The Instrumental/Baconian View.*
          *   *Claim:* Knowing facts gives you leverage to achieve goals.
          *   *Plausibility:* High. Obviously true.
          *   *Neutrality Conclusion:* Does *not* support the roommate. You can have neutral facts used for power later.
