answer: |-
  Your instinct to side with the lecturer is correct. Your friend has grasped the broad "vibe" of Williams but has inverted the specific logic of the most famous argument ("One Thought Too Many"). This is a very common mistake when people recount Williams second-hand, because the point is subtle.

  Here is a bit-by-bit breakdown of your friend's summary, evaluated from the perspective of a Williams scholar.

  ### 1. The Integrity Objection
  > **Friend:** "Williams's big anti-utilitarian argument is the integrity objection. Utilitarianism treats you as just a channel for maximizing overall welfare — you're as responsible for what you fail to prevent as for what you actually do — so if the optimum requires abandoning your own life projects, you have to abandon them, and Williams thought that's wrong because it destroys your integrity..."

  *   **Verdict:** **Mostly Accurate.**
  *   **Scholar's View:** This is a fair summary of Williams's critique in *Utilitarianism: For and Against* (1973), specifically the cases of "George the Chemist" and "Jim and the Indians."
  *   **Nuance:** Williams argues that Utilitarianism relies on **negative responsibility** (I am responsible for what I allow to happen, not just what I do). This turns the moral agent into a mere "channel" or "location" for the satisfaction of outcomes, rather than a person with their own commitments.
  *   **Ground Projects:** Williams argues we all have "ground projects" (deep commitments that give life meaning). If Utilitarianism demands we abandon these whenever the calculus says so, it alienates us from our actions and attacks our **integrity** (understood as the connection between your actions and your identity).
  *   **Correction:** It's not just that abandoning projects is "wrong"; it's that the *demand* to be willing to abandon them at any moment makes it impossible to have the kind of character required to be a moral agent in the first place.

  ### 2. The Claim of Refutation
  > **Friend:** "...so he basically refuted consequentialism."

  *   **Verdict:** **Exaggerated / Wrong.**
  *   **Scholar's View:** Williams did not claim to have logically "refuted" consequentialism in the way one refutes a mathematical proof. Consequentialism is logically consistent; Williams's argument is that it is **unlivable** or **alienating**.
  *   **Nuance:** Williams was skeptical of "moral theory" generally. He didn't think he had proven Consequentialism false so much as he had shown it to be a deeply flawed picture of human psychology and agency. Consequentialists (like Peter Singer or R.M. Hare) responded to Williams by arguing that integrity is only valuable insofar as it promotes good outcomes. The debate continued long after Williams.
  *   **Takeaway:** Tell your friend Williams delivered a *devastating objection*, not a *refutation*.

  ### 3. The Drowning Wife Example
  > **Friend:** "If a man can save one of two drowning people, and one of them turns out to be his wife, Williams said the reason of her being his wife is partial, so it's not enough on its own — the man needs to supplement it with an impartial consideration..."

  *   **Verdict:** **Accurate (as a description of the Utilitarian demand).**
  *   **Scholar's View:** Your friend is correctly describing what Williams claims the Utilitarian *requires*. In the essay "Persons, Character and Morality" (1981), Williams sets up the scenario to show what morality demands of the husband. The Utilitarian insists that saving her *just* because she is his wife is favoritism; he needs a general principle (e.g., "saving close relations generally maximizes utility") to justify the act.

  ### 4. "One Thought Too Many" (The Critical Error)
  > **Friend:** "If he skips that impartial check and just acts on the wife reason, that's what Williams meant by having one thought too many..."

  *   **Verdict:** **Backwards / Wrong.**
  *   **Scholar's View:** This is the exact opposite of Williams's point, and this is why your lecturer corrected you.
  *   **The Actual Argument:** Williams argues that if the husband stops to think, *"I can save my wife, **and** it is permissible because morality allows me to prioritize my spouse,"* **that justification is the "one thought too many."**
  *   **Why?** Because genuine love and personal relationships are defined by their immediacy. If you love someone, you save them *because they are your wife*, not because you have checked a moral rulebook and confirmed that saving spouses is utility-maximizing or impartially permissible.
  *   **The Error:** Your friend thinks the "wife reason" is the extra thought. Williams says the "impartial justification" is the extra thought. The husband should act *directly* on the partial reason. Requiring the impartial check undermines the very nature of the relationship.

  ### 5. Self-Effacingness
  > **Friend:** "...and it shows consequentialism is self-effacing, because it erodes the spontaneous affection that personal relationships are supposed to be made of."

  *   **Verdict:** **Accurate.**
  *   **Scholar's View:** Williams does argue that Utilitarianism is **self-effacing**. This means the theory might work best if people *don't* actually believe in it. If everyone genuinely thought like a Utilitarian (constantly checking impartial justifications for their love), personal relationships would wither, and overall utility might actually go down. Therefore, Utilitarianism might have to tell people: "Don't think like Utilitarians." Williams finds this dishonest and unstable.

  ### Summary: How much should you trust your friend?

  | Claim | Trust Level | Notes |
  | :--- | :--- | :--- |
  | **Integrity Objection** | High | Good summary of the "channel" and "ground projects" argument. |
  | **Refutation** | Low | Williams offered a critique of the *viability* of the theory, not a logical refutation. |
  | **Drowning Wife Setup** | High | Correctly identifies the Utilitarian requirement for impartial justification. |
  | **"One Thought Too Many"** | **Zero** | **Completely inverted.** The "extra thought" is the justification, not the impulse. Side with your lecturer here. |
  | **Self-Effacingness** | High | Correctly identifies that Utilitarianism undermines the psychology it requires. |

  ### Why your lecturer is right (in your own words)
  If you need to explain this in class, here is the distinction:
  Your friend thinks Williams is saying, "It is wrong to save your wife just because she is your wife; you need a moral reason."
  Williams is actually saying, "If you feel you *need* a moral reason to save your wife, you don't actually love her properly. The need for that justification is the 'one thought too many'."

  Williams is attacking the idea that **all** action needs moral justification. Some actions (like saving a loved one) flow directly from who we are. Demanding an impartial justification for them alienates us from our own lives.
