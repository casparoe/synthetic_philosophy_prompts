prompt: |-
  I teach an intro-level environmental ethics course (about 25 students, one 75-minute session), and I want to design an in-class game about intergenerational justice and climate change. The thing I'm wrestling with: last weekend I got into a long argument with a friend of mine who teaches economics, and he kept insisting that climate policy can't really be said to *wrong* future people, because the people who would exist in a low-carbon world are literally different people from the ones who would exist if we keep burning fossil fuels — different conceptions, different timelines, different individuals. My first reaction was that this was a debating trick, but apparently it's a serious position (something like Parfit's non-identity problem), and it's made me realize my students hear "we owe it to future generations" as obvious and never confront the weirdness underneath it.

  So here's what I want: a multi-generation resource game where the students in each "generation" make policy choices that both (a) deplete or preserve a shared resource for the next generation, and (b) secretly change *which* future students exist — like, the composition of the next generation gets reshuffled depending on what the current one does, so the students who benefit or suffer from your choices aren't the ones who would have been there had you chosen differently. I'd rather the identity-shuffle not be announced up front; I want them to discover it partway through and feel the ground shift. Materials should be cheap (cards, tokens, a whiteboard), no real money, and the payoff scheme should make short-term consumption genuinely tempting so it's not a strawman where everyone cooperates for the aesthetic of it.

  Then I need a debrief that maps specific moments in the game onto the actual philosophical positions: the person-affecting view vs. impersonal ones, whether "harming" requires making someone worse off than they otherwise would have been, and whether the identity-matters move actually lets my economist friend off the hook or just relocates the problem. Also tell me honestly what will predictably go wrong the first time I run it (I assume someone will figure out the shuffle early, or generations will collude across rounds and break the structure), and be upfront about which part of the problem the game just can't reproduce — I suspect it's hard to make students feel that the *other* possible generation was real in any way, since the counterfactual people are, well, nobody in the room. If you know a fix or a workaround for that, I'd love to hear it, but don't paper over it if there isn't one.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Intro-level environmental ethics course, 25 students, 75-minute session.
      *   **Goal:** Design an in-class game about intergenerational justice and climate change, specifically addressing the Non-Identity Problem (Parfit).
      *   **Core Mechanic:** A multi-generation resource game where choices deplete/preserve resources *and* secretly change *which* future students exist (identity shuffle).
      *   **Constraint:** The identity shuffle should be hidden initially (reveal mid-game). Materials must be cheap (cards, tokens, whiteboard). Payoff must make short-term consumption tempting.
      *   **Debrief:** Map game moments to philosophical positions (person-affecting vs. impersonal, harm conditions). Address whether the "identity move" solves the ethical problem.
      *   **Critique:** Predict what will go wrong (gaming the system, early discovery) and admit limitations (counterfactual people aren't real in the room).

  2.  **Deconstruct the Philosophical Problem (The Non-Identity Problem):**
      *   *Premise:* Our actions affect *who* comes into existence (different policies $\rightarrow$ different conception times/partners $\rightarrow$ different people).
      *   *Problem:* If a policy brings about a person with a life worth living, but a different policy would have brought about a *different* person with a *better* life, did the first policy *harm* the first person? No, because without the policy, they wouldn't exist.
      *   *Ethical Tension:* Intuitively, we think we wrong future generations by leaving them a wrecked world. Philosophically, if they wouldn't exist otherwise, it's hard to say we harmed *them*.
      *   *Game Translation:* Need to simulate "Resource Level" (quality of life) and "Identity" (who is playing).

  3.  **Drafting the Game Mechanics:**
      *   *Setup:* 25 students. Divide into "Generations." Let's say 3 generations of roughly 8 students each (24 students), 1 observer/facilitator helper. Or 5 generations of 5. 3 generations feels more manageable for 75 mins. Let's go with 3 waves of 8-9 students.
      *   *Resource:* A common pool of tokens (e.g., "Energy Units").
      *   *Choice:* Consume now (get points) vs. Invest (leave tokens for next gen).
      *   *The Twist (Identity):* Usually, Gen 2 is the same people as Gen 1 waiting their turn. To simulate non-identity, Gen 2 must be *different* people based on Gen 1's choice.
      *   *Implementation:* Use a deck of cards or sealed envelopes. Gen 1's decision determines *which* envelope Gen 2 opens, which assigns roles or modifies the "pool" of available students.
      *   *Refinement:* It's hard to swap students physically without chaos. Better: The *payoff structure* or *hand composition* changes.
      *   *Better Idea:* The "Identity Shuffle."
          *   Gen 1 makes a choice (High Carbon vs. Low Carbon).
          *   If High Carbon: Gen 2 is drawn from Pool A (e.g., students with Red cards).
          *   If Low Carbon: Gen 2 is drawn from Pool B (e.g., students with Blue cards).
          *   *Wait, that's too obvious.*
          *   *Stealth Approach:* Everyone has a hidden "ID Card." Gen 1's choice determines which ID Cards are "active" for Gen 2.
          *   *Simpler:* Gen 1 chooses Policy A or B. Policy A leads to World State A. Policy B leads to World State B.
          *   *The Reveal:* In World State A, the people who exist (Gen 2) have different "needs" or "values" than they would have in World State B.
          *   *Actually, the prompt asks for the composition of the next generation to get reshuffled.*
          *   *Mechanism:* Deal everyone a "Potential Person" card at the start. Gen 1's choice determines which "Potential Person" cards become "Actual Person" cards for Gen 2.
          *   *Even Simpler:* Gen 1 chooses. Based on choice, the Instructor calls up *different* students for Gen 2.
          *   *How to hide it?* Tell them Gen 2 is random. But actually, the Instructor has a list. If Gen 1 chose "Deforest," call up Students 1-8. If "Preserve," call up Students 9-16.
          *   *Problem:* Students will notice different people.
          *   *Fix:* Everyone stays seated. They pass "tokens of existence."
          *   *Best Mechanic:* **The Envelope Method.**
              *   At the start, every student gets a sealed envelope labeled "Future Self."
              *   Gen 1 (first 8 students) makes a choice.
              *   Based on the choice, the Instructor announces a "Historical Shift."
              *   Gen 2 (next 8 students) opens their envelopes.
              *   *The Twist:* The envelopes contain different "Starting Endowments" or "Utility Functions" depending on Gen 1's choice, *AND* the Instructor reveals that the people in Gen 2 are technically "different" because the timeline shifted.
              *   *Wait, to really hit the Non-Identity Problem:* The specific individuals in Gen 2 must be contingent on Gen 1's choice.
              *   *Practical Solution:* Pre-assign students to "Timeline A" and "Timeline B" secretly.
              *   Gen 1 chooses Path A or B.
              *   If Path A: The "Gen 2" players are the students assigned to Timeline A.
              *   If Path B: The "Gen 2" players are the students assigned to Timeline B.
              *   *Secrecy:* Students don't know they are assigned to a timeline. They just think they are waiting for their turn.
              *   *Reveal:* After Round 2, reveal that Gen 2 would have been *different people* had Gen 1 chosen differently.

      *   *Incentive Structure:*
          *   Points = Grade bonus / Candy / Bragging rights.
          *   If I consume now, I get 10 points. If I save, Next Gen gets 15 points, I get 0.
          *   Rational self-interest says consume.
          *   But if I save, maybe Next Gen saves for Gen 3? (Iterated Prisoner's Dilemma style).

  4.  **Developing the Lesson Plan (75 Minutes):**
      *   0-10: Intro & Setup.
      *   10-30: Round 1 & 2 (The Trap).
      *   30-40: The Reveal (Non-Identity).
      *   40-55: Round 3 (Post-Reveal).
      *   55-75: Debrief & Philosophy.

  5.  **Refining the "Identity Shuffle":**
      *   To make it seamless: Hand out "Citizen ID" cards at the very beginning. Half are Type A, half are Type B. They don't know the types matter.
      *   Gen 1 plays.
      *   If Gen 1 chooses "Fossil Fuel Heavy": Only Type A cards are valid for Gen 2. Type B students are "non-existent" (they sit out or become observers).
      *   If Gen 1 chooses "Green Transition": Only Type B cards are valid for Gen 2.
      *   *Issue:* Students sitting out will feel left out.
      *   *Fix:* Everyone plays every round, BUT their "Payoff Multiplier" or "Resource Need" changes based on the timeline.
      *   *Better Fix (closer to prompt):* The prompt wants the *composition* reshuffled.
      *   *Compromise:* Use "Role Cards." At the start, deal everyone a card. Some say "Citizen," some say "Potential."
      *   *Actually, the cleanest way:* The Instructor controls the "Spawn List."
      *   *Setup:* 25 students.
      *   Round 1: 5 students play (Gen 1). 20 watch.
      *   Round 2: 5 students play (Gen 2).
      *   *The Trick:* Before class, split the 20 non-Gen-1 students into Group Alpha and Group Beta (10 each).
      *   If Gen 1 chooses Policy X, Gen 2 is drawn from Group Alpha.
      *   If Gen 1 chooses Policy Y, Gen 2 is drawn from Group Beta.
      *   *Secrecy:* Students don't know about the groups. They just think "Oh, I'm up next."
      *   *Reveal:* "Wait, if Gen 1 had chosen differently, *you* (pointing to Gen 2) wouldn't be here. These other 10 students would be."
      *   *Payoff:* Gen 1 gets points for consumption. Gen 2 inherits the resource pool.

  6.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Collusion:* Gen 1 might promise Gen 2 to save, then renege. Or Gen 2 threatens Gen 1.
      *   *Early Discovery:* A student might notice the group swap.
      *   *Apathy:* Gen 2 might not care because they "got lucky" to exist.
      *   *The "Counterfactual" Gap:* The students who *didn't* exist aren't there to complain. This is the core limitation.

  7.  **Addressing the Debrief/Philosophy:**
      *   Map to Parfit.
      *   Person-Affecting View (Harm requires making a specific person worse off).
      *   Impersonal View (A state of affairs can be worse even if no specific person is harmed).
      *   Does the economist friend have a point? (Technically yes on harm, but no on obligation).

  8.  **Review against Constraints:**
      *   75 mins? Yes.
      *   25 students? Yes.
      *   Cheap materials? Yes (cards, tokens, candy/points).
      *   Hidden identity shuffle? Yes (via secret grouping).
      *   Tempting payoff? Yes (individual points vs. collective good).
      *   Honest critique? Yes.

  9.  **Final Polish:**
      *   Make sure the instructions are clear for the instructor.
      *   Ensure the "Reveal" is dramatic.
      *   Strengthen the debrief questions.
      *   *Self-Correction on Mechanics:* If I swap students out, the ones sitting out get bored. Better: Everyone has a "Life Card." Gen 1's choice determines which Life Cards are "Active." Active players play Gen 2. Inactive players are "Observers" (but give them a task so they don't tune out).
      *   *Wait, simpler:* Just swap the players. It's more dramatic. "You are out. You are in." It emphasizes the *existence* condition. I will advise the teacher to keep the "out" students engaged as "Historians" recording the moves.

  10. **Writing the Response:** (Drafting the content following the structure developed above.)
      *   *Title:* The "Contingent Existence" Game.
      *   *Materials:* Tokens, Envelopes, Candy/Points.
      *   *Procedure:* Step-by-step.
      *   *The Twist:* Explicit instructions on how to hide the swap.
      *   *Debrief:* Philosophical mapping.
      *   *Failure Modes:* Honest assessment.

  11. **Final Check on the "Non-Identity" Logic:**
      *   Does swapping students actually model Non-Identity?
      *   Yes, because it shows that the *identity* of the future population is causally dependent on the *policy choice* of the present.
      *   If Gen 1 chooses Coal $\rightarrow$ Gen 2 is Group A.
      *   If Gen 1 chooses Wind $\rightarrow$ Gen 2 is Group B.
      *   Group A cannot complain they were harmed by Coal, because without Coal, they wouldn't exist (Group B would).
      *   This perfectly mirrors Parfit.

  12. **Adding the "Economist Friend" angle:**
      *   Make sure the debrief explicitly addresses the "harm" definition.

  13. **Limitations:**
      *   The "missing people" aren't sad. They are just classmates sitting down.
      *   Need to emphasize this limitation in the critique section.

  14. **Time Management:**
      *   75 mins is tight. Keep rules simple. 3 Generations max.

  15. **Incentives:**
      *   Use extra credit or candy. Let's suggest candy + small grade bump for top scorers to ensure competition.

  16. **Refining the "Secret Shuffle":**
      *   Hand out colored stickers at the door. Red and Blue. Tell them it's for team tracking.
      *   Actually, just a seating chart is easier. Left side vs. Right side.
      *   No, cards are better. "ID Cards."
      *   Okay, I'll stick with the "Secret Envelope" method for the Gen 2 selection. It feels more official.

      *(Self-Correction)*: Keep it simpler. Pre-assign two lists of names. List A and List B. Do not tell students. When Gen 1 decides, call List A or List B. To the students, it looks like random selection or "next row up."
      *   *Risk:* Students talk.
      *   *Mitigation:* Tell them "I'm selecting the next generation based on resource availability." (Lie).
      *   *Better:* Tell them nothing. Just call the names.
      *   *Reveal:* "I didn't pick randomly. I picked based on your choice."

      *Okay, let's finalize the plan.*
      *   **Game Name:** The Parfit Protocol.
      *   **Materials:** Poker chips (resources), Candy (utility), Two sets of colored index cards (Identity).
      *   **Setup:** 25 students.
      *   **Round 1:** 5 students (Gen 1).
      *   **Round 2:** 5 students (Gen 2).
      *   **Round 3:** 5 students (Gen 3).
      *   **Rest:** Observers/Historians.
      *   **Identity Mechanic:** Observers hold Red or Blue cards. Gen 1 choice determines which color is "born" in Gen 2.
      *   **Payoff:** Consume = Candy now. Invest = More chips for next round.
      *   **Reveal:** After Round 2.

      *Wait, one more thing:* The prompt asks for the payoff scheme to make short-term consumption tempting.
      *   If Gen 1 consumes, they get 3 candies. If they invest, Gen 2 gets 5 chips, Gen 1 gets 0.
      *   Gen 2 inherits chips. If chips < threshold, everyone loses points.
      *   This creates the tension.

      *Okay, ready to write.*
answer: |-
  This is a fantastic pedagogical challenge. You are asking students to feel a metaphysical problem (the Non-Identity Problem) through a mechanical one (resource allocation). The difficulty is that the Non-Identity Problem is counter-intuitive precisely because we *feel* harm to future people as obvious. To make the game work, you have to break that intuition mid-stream.

  Here is a complete lesson plan for **"The Parfit Protocol,"** designed for 75 minutes, 25 students, with low-cost materials.

  ### **Game Overview: The Parfit Protocol**

  **Core Concept:** A three-generation resource extraction game where the policy choices of Generation 1 determine not only the resource pool for Generation 2 but *which specific students constitute Generation 2*.
  **Materials:**
  *   50 Poker chips or tokens (representing "Resource/Capital").
  *   25 small candies or distinct stickers (representing "Utility/Payoff").
  *   Two decks of index cards (12 Red, 12 Blue, 1 blank).
  *   Whiteboard.
  **Room Setup:** Students in a semicircle. You at the front with the "Bank."

  ---

  ### **Part 1: Setup & Rules (10 Minutes)**

  1.  **The Secret Identity Shuffle:** As students enter, hand them a sealed envelope. Inside is an index card.
      *   12 students get **Red Cards**.
      *   12 students get **Blue Cards**.
      *   1 student gets a **Blank Card** (The "Observer/Recorder").
      *   *Instruction:* "Do not open this envelope until I tell you. Do not show your card to anyone. This is your 'Genetic ID' for the simulation."
  2.  **The Resource Pool:** Place 40 chips in the center (The "Common Stock"). Keep 10 in reserve.
  3.  **The Goal:** Tell students: "Your goal is to maximize your individual score. Score is calculated in candy/points. You will play in three waves: Generation 1, 2, and 3."
  4.  **The Mechanic:**
      *   **Generation 1 (5 Students):** Call 5 students to the front. (It doesn't matter which cards they have).
      *   **Choice:** Each Gen 1 student chooses **Extract** or **Conserve**.
          *   **Extract:** Take 2 chips from the Common Stock. Convert 1 chip immediately into 1 Candy (Point). Return the other chip to your personal stash (worth 0.5 points at end).
          *   **Conserve:** Leave the chip in the Common Stock. You get 0 Candy now.
      *   **The Threshold:** If the Common Stock falls below 10 chips at any point, Generation 3 automatically loses all points (Climate Collapse).
      *   **Generation 2 & 3:** Inherit whatever is left in the Common Stock. They play the same game.

  ---

  ### **Part 2: Round 1 – The Trap (15 Minutes)**

  1.  Call **Generation 1** to the front.
  2.  Let them debate and choose. *Prediction:* Most will Extract. The incentive is immediate and certain; the cost is distant and probabilistic.
  3.  **The Critical Mechanic (Hidden):**
      *   Look at the total number of chips **Extracted** by Gen 1.
      *   **If Gen 1 Extracts > 5 chips total (High Carbon Path):** You announce, "Due to the high-energy timeline, the demographic shift favors the Red cohort." You instruct all **Red Card** holders to stand up. They are **Generation 2**. Blue Card holders must sit and remain "Potential."
      *   **If Gen 1 Extracts < 5 chips total (Low Carbon Path):** You announce, "The sustainable transition alters conception timelines. The Blue cohort is activated." You instruct all **Blue Card** holders to stand up. They are **Generation 2**. Red Card holders sit.
      *   *(Note: You must rig the selection slightly if the split is exactly 5, or pre-assign the Gen 1 players to ensure a clear majority choice triggers one color.)*
  4.  **Generation 2 Plays:** The "Active" color group sends 5 representatives to play. They inherit the depleted (or preserved) stock. They make their choices.
  5.  **Generation 3 Plays:** 5 students from the *same* active color group play the final round.
  6.  **Tally Scores:** Distribute candy/points.

  ---

  ### **Part 3: The Reveal (10 Minutes)**

  This is the pivot point. Do not debrief yet. Drop the twist.

  1.  Ask the **Generation 2** students (who are currently standing): "How many of you feel you were harmed by Generation 1's choices?"
  2.  Ask the class: "If Generation 1 had chosen differently, would *these specific people* be standing here?"
  3.  **The Reveal:** "Open your envelopes."
  4.  Explain the rule you enforced silently: "If Gen 1 had chosen the other path, the *other color* would be Generation 2. The people currently sitting (the inactive color) would be the ones inheriting the resource pool. The people standing would not exist in this simulation."
  5.  **The Philosophical Punch:** "Generation 2: You might have a low resource pool. But if Gen 1 had saved the resources, *you* would not be here. A different group would be. Can you truly say Gen 1 wronged *you*?"

  ---

  ### **Part 4: Round 4 – Post-Reveal Play (15 Minutes)**

  1.  Reset the board.
  2.  Tell them: "We know the identity trick now. Play one more round. Gen 1 knows their choice determines *who* Gen 2 is."
  3.  Observe if the logic changes.
      *   *Likely Outcome:* Gen 1 might still Extract, reasoning "I'm helping my specific timeline exist." Or they might Conserve, reasoning "It's wrong to create a timeline where people suffer, even if they are different people."
  4.  End the game.

  ---

  ### **Part 5: The Debrief & Philosophical Mapping (25 Minutes)**

  Use the whiteboard to map their experience to the literature.

  **1. The Person-Affecting View (The Economist's Position)**
  *   *Concept:* An act is wrong only if it makes some *particular* person worse off than they would otherwise have been.
  *   *Game Moment:* Ask Gen 2 (High Carbon path): "If we had chosen Low Carbon, would you be better off?"
  *   *Answer:* No, because they wouldn't exist.
  *   *Conclusion:* Under a strict Person-Affecting View, Gen 1 did not harm Gen 2. Your economist friend is technically consistent here.

  **2. The Impersonal View (The Intuition)**
  *   *Concept:* A state of affairs can be worse than another, even if no specific person is harmed. (e.g., A world with suffering people is worse than a world with happy people, even if they are different people).
  *   *Game Moment:* Ask the class: "Is the High Carbon world *worse*, even if the people in it are different?"
  *   *Conclusion:* Most will say yes. This supports policies based on "overall good" rather than "specific harm."

  **3. The "Non-Identity" Problem (Parfit)**
  *   *Concept:* Our choices affect the identity of future people (via timing, partners, resources).
  *   *Game Moment:* The Color Card swap.
  *   *Discussion:* Does knowing the identity shift make you feel *less* responsible, or *more*?
      *   *Less:* "I'm not hurting anyone specific."
      *   *More:* "I am playing god with who gets to exist."

  **4. Does the Economist Get Off the Hook?**
  *   Push the students: "If the Non-Identity Problem holds, does it mean we have no obligations to the future?"
  *   *Counter-argument:* We might have obligations to create *good* futures, not obligations to *specific* future people. The obligation shifts from "Do not harm John" to "Do not create a world where John (or anyone) suffers unnecessarily."

  ---

  ### **Predictable Failure Modes (And How to Handle Them)**

  **1. The "Collusion" Problem**
  *   *Risk:* Gen 1 and Gen 2 students are friends. They agree Gen 1 will Extract, and Gen 2 will "forgive" them because they get to play.
  *   *Fix:* Make the payoff **anonymous**. Collect score sheets at the end. Do not let them trade candy in the room. Emphasize that *individual* points matter for the grade bonus, not team success.

  **2. The "Early Discovery" Problem**
  *   *Risk:* A student notices the color correlation in Round 2 and shouts it out.
  *   *Fix:* Have a cover story ready. "I'm selecting Generation 2 based on seating proximity to the resource pool to save time." If they catch you, own it immediately: "Excellent observation. That is actually the core of today's lesson. Let's pause and talk about why I did that." (Turn the leak into the reveal).

  **3. The "Apathy" Problem**
  *   *Risk:* Gen 2 students in the "High Carbon" path shrug. "Hey, I exist, I got candy, who cares?"
  *   *Fix:* This is actually a *success* for the lesson. It demonstrates the moral hazard of the Non-Identity Problem. Highlight this in the debrief: "Look how easy it is to justify harm when the victim is contingent on the harm."

  **4. The "Counterfactual Gap" (The Major Limitation)**
  *   *Risk:* The students who *didn't* exist (the sitting color group) are right there in the room. They aren't "non-existent." They are just sitting.
  *   *Honest Admission:* You must address this in the debrief. "In this game, the 'non-existent' people are your classmates. In reality, the people who never get conceived are not waiting in the wings; they are nothing. This game *cannot* make you feel the absence of the counterfactual generation. You can't mourn people who never were. This is why the Non-Identity Problem is so philosophically sticky—it relies on a void we can't visualize."
  *   *Workaround:* Ask the "Inactive" color group during the reveal: "How do you feel about being 'erased' by Gen 1's choice?" Their feeling of exclusion is the closest proxy you can get to non-existence.

  ### **Why This Works for Your Argument**

  This game validates your economist friend's logic (technically, no specific person was made worse off compared to their baseline of non-existence) while validating your ethical intuition (the outcome is still morally repugnant).

  It forces students to realize that **"We owe it to future generations"** cannot mean "We owe it to *specific* future individuals." It must mean "We owe it to the *concept* of a future humanity to ensure it is livable." That distinction is the entire hinge of modern intergenerational ethics.

  ### **Instructor Cheat Sheet for the "Shuffle"**

  *   **Pre-Class:** Mark 12 chairs with a tiny dot of red tape, 12 with blue. Tell students "Sit anywhere."
  *   **If Gen 1 Extracts Heavily:** Announce "Generation 2, please come from the Red seats."
  *   **If Gen 1 Conserves:** Announce "Generation 2, please come from the Blue seats."
  *   **Why chairs?** It's faster than envelopes and feels more like "fate" than "assignment."
  *   **Secrecy:** Tell them the seat colors are for "attendance tracking." They will forget immediately.

  Good luck. This is the kind of class students remember five years later.
