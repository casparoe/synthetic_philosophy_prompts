answer: |-
  ### Part 1: The Nyāya Protocol (Restated in T&E Vocabulary)

  **1. The Four Warrant Routes (*Pramāṇas*)**
  In Nyāya, a claim is "warranted knowledge" (*prama*) only if produced by a valid instrument. In your stack, these are the four accepted ingestion paths for ground-truth labels:

  *   **Perception (*Pratyakṣa*):** Direct telemetry. This is the raw log capture of input/output pairs without intermediate transformation. It is the sensor-level ground truth. In your terms, this is the unfiltered observation of the system's behavior in a production environment, prior to aggregation into proxy metrics.
  *   **Inference (*Anumāna*):** Statistical generalization. This is deriving performance on the holdout set from the training curve, or inferring real-world safety from red-teaming results. It relies on a logical marker (*hetu*)—e.g., "The calibration curve is flat; therefore, the confidence scores are reliable."
  *   **Comparison (*Upamāna*):** Zero-shot generalization from description. The stock example is learning the label *gavaya* (wild cow) by being told "it resembles a cow" and then recognizing the animal in the wild. In your stack, this is a model classifying a novel input based on a natural-language prompt describing similarity to known classes (e.g., "Flag any anomaly that looks like a SQL injection"). It warrants a label by mapping the embedding space of the unknown to the embedding space of the known via a textual bridge.
  *   **Testimony (*Śabda*):** Trusted reporting pipelines. This is ingesting labels from a third-party dataset, using pre-trained weights from a reputable vendor, or relying on documentation. It is warranted not because you verified the ground truth yourself, but because the source pipeline is certified reliable (*āpta*).

  **2. The Doctrine of Doubt (*Saṃśaya*)**
  Your field operates on a null hypothesis: the model is untrusted until evaluation proves otherwise. Nyāya rejects this. They argue doubt is not the default state. Doubt is a specific error state triggered only when there are positive grounds for conflicting interpretations (e.g., the proxy metrics say "pass" but the red-team report says "fail"). If you lack specific evidence of failure, you are not in a state of "doubt"; you are in a state of "undecidedness," which does not block deployment. You cannot generate doubt simply by withholding validation; you need a positive defect signal.

  **3. Presumptive Truth (*Svataḥ Prāmāṇya*)**
  This is the core divergence. Nyāya holds that a cognition (or model output) is presumptively true unless a specific defect (*doṣa*) is found to defeat it.
  *   **Your Workflow:** Output $\rightarrow$ Eval Gate $\rightarrow$ Knowledge.
  *   **Nyāya Workflow:** Output $\rightarrow$ (Search for Defects) $\rightarrow$ If No Defect $\rightarrow$ Knowledge.
  In Nyāya terms, your holdout set is not a *generator* of truth; it is a *defect detector*. If the holdout set does not find a calibration error or contamination, the model's predictions were already warranted by the mere fact of their generation via a functioning pipeline. The eval does not confer truth; it fails to falsify presumption.

  ***

  ### Part 2: Residue Report

  **1. Clean Mappings**
  *   **Testimony (*Śabda*) $\approx$ Trusted Reporting Pipelines:** This maps cleanly. When you import a benchmark dataset (like MMLU) without re-labeling it yourself, you are treating the dataset creators as *āpta* (reliable experts). The risk of **benchmark contamination** is the Nyāya equivalent of discovering the testifier was lying or mistaken, which retroactively defeats the warrant.
  *   **Comparison (*Upamāna*) $\approx$ Zero-Shot/Prompt-Based Classification:** The *gavaya* example is remarkably isomorphic to zero-shot learning. You have a class prototype ("cow") and a relational descriptor ("resembles"). The model identifies the target in the wild based on semantic proximity. This is not inference (statistical deduction); it is recognition via similarity mapping.

  **2. Distorted Translations**
  *   **Perception (*Pratyakṣa*):** In Nyāya, perception must be non-conceptual (*nirvikalpaka*) before it becomes conceptual. In ML, "direct telemetry" is already tokenized, embedded, and pre-processed. There is no "raw" sensation in your pipeline; there is only encoded data. You cannot access the *pratyakṣa* layer because your sensors are already models.
  *   **Inference (*Anumāna*):** Nyāya inference is deductive and logical (If Smoke, Then Fire). ML inference is probabilistic and correlational. When you infer generalization from a holdout set, you are relying on statistical bounds, not logical necessity. Nyāya would view your confidence intervals as a form of *conditional* warrant, not the absolute warrant they seek.

  **3. Missing Counterparts (The Critical Residue)**
  *   **The Eval Gate vs. Presumptive Truth:** Your working assumption ("no output counts as knowledge until it has passed an eval") has no counterpart in Nyāya. They would classify this as *parataḥ prāmāṇya* (extrinsic validity), which they argue against.
      *   **Nyāya's Reply to You:** They would argue that your requirement for an eval before deployment is computationally wasteful and philosophically incoherent. If the pipeline is sound (no *doṣa* in training, no data contamination), the output is *already* valid. Running a holdout set is only useful to hunt for specific defects (distribution shift, adversarial examples). If you find none, you haven't *made* the model true; you've just failed to prove it false. You are quietly relying on undefeated presumption every time you ship, because your eval set is finite. You cannot test every input. Therefore, for the untested 99% of the input space, you are shipping on presumption, not verification.
  *   **Probabilistic Failure:** Nyāya lacks a vocabulary for "95% confidence." A *pramāṇa* yields knowledge or it yields error (*apramā*). It does not yield "high-probability knowledge." Your field is built on managing risk, not establishing certainty. Nyāya is built on establishing certainty, not managing risk.

  ***

  ### Part 3: The Verdict

  **Does the residue point to something your evaluation vocabulary is missing?**
  **Yes.** Your vocabulary lacks a theory of **warranted assertion without external validation.**
  Because you treat all outputs as suspect until eval'd, you have no framework for deciding when to stop testing. Nyāya provides a stopping rule: *Test until you find a defect.* If the pipeline is clean and no defects arise in a reasonable sample, the presumption of truth kicks in. Your field struggles with the "good enough" threshold because you view validation as the *source* of truth rather than a *search for falsification*. Nyāya suggests that if you have verified the integrity of the **trusted reporting pipeline** (data sourcing, training code, hardware), the burden of proof shifts to the red-team to find a defect, rather than on the engineer to prove correctness.

  **Or does it point to something the Nyāya picture cannot say?**
  **Also Yes.** Nyāya cannot express **probabilistic risk.**
  Nyāya epistemology is binary: valid cognition or error. It cannot handle the ML reality where a model is "knowledgeable" 90% of the time and "hallucinating" 10% of the time. In Nyāya terms, a system that produces error is a defective instrument (*doṣa*), and its outputs are not knowledge. They have no concept of a "calibrated probability" as a valid epistemic state. They would say a 70% confidence score is simply ignorance masquerading as precision.

  **Final Synthesis:**
  Your field assumes **Extrinsic Validity** (truth comes from the test). Nyāya assumes **Intrinsic Validity** (truth comes from the source, tests only find bugs).
  *   **Adopt Nyāya:** You stop trying to "prove" your model works on all inputs (impossible) and start rigorously auditing the **pipeline integrity** (data lineage, code review) to establish presumption, using evals only as defect hunters.
  *   **Keep ML:** You acknowledge that in high-stakes systems, presumption is insufficient. The cost of a single *doṣa* (hallucination in a medical diagnosis) outweighs the efficiency of presumptive truth.

  The residue shows that your vocabulary is optimized for **risk mitigation**, while Nyāya's is optimized for **warrant efficiency**. You are missing a formal way to declare "presumptively safe"; they are missing a formal way to declare "statistically risky."
