      *   *Missing/Clash:* The "Eval Gate." ML says $Knowledge = Eval(Pass)$. Nyāya says $Knowledge = Cognition(\neg Defect)$.
      *   *The "So What?":* ML vocab misses the *phenomenology* of the cognition. It cares about the output, Nyāya cares about the *instrument* of the output. Also, ML's skepticism is resource-intensive; Nyāya's presumption is resource-efficient but risks undetected drift.

  5.  **Refining the Tone:**
