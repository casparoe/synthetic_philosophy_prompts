      *   *Pramāṇas:*
          *   Perception $\rightarrow$ Direct telemetry/ground-truth observation.
          *   Inference $\rightarrow$ Statistical inference from proxy metrics to real-world performance.
          *   Upamāna $\rightarrow$ Zero-shot generalization via semantic similarity (the "gavaya" example is perfect for prompt-based classification).
          *   Testimony $\rightarrow$ Trusted reporting pipelines / pre-trained weights from reputable sources.
      *   *Presumptive Truth:* In ML, we assume "buggy until proven safe." Nyāya says "valid until proven buggy." I need to frame this carefully. Nyāya would call the ML engineer's stance a specific kind of doubt that requires justification.
      *   *Doubt:* In ML, doubt is the default (null hypothesis). In Nyāya, doubt is a specific state triggered by conflicting signals (e.g., train loss low, val loss high).

  4.  **Developing the Residue Report:**
