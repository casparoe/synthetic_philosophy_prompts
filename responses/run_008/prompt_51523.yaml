      *   **Final Conclusion:** Does the residue show what ML vocab is missing, or what Nyāya can't say?

  2.  **Deconstruct Nyāya Epistemology (Mental Sandbox):**
      *   *Pramāṇa:* Instrument of knowledge. Valid cognition (*prama*).
      *   *Pratyakṣa (Perception):* Direct sensory contact. In ML terms: Direct observation of input/output pairs, raw logs.
      *   *Anumāna (Inference):* Reasoning from a sign (*hetu*) to a conclusion. In ML terms: Deducing performance on holdout from training metrics, or inferring capability from architecture.
      *   *Upamāna (Comparison/Analogy):* Knowing a thing by its similarity to a known thing based on a description. Classic example: "Gavaya is like a cow." In ML terms: Zero-shot classification, few-shot learning, transferring labels from a known class to a similar unknown class based on a textual prompt.
      *   *Śabda (Testimony):* Reliable source. In ML terms: Pre-trained weights, external datasets, API responses from trusted providers, documentation.
      *   *Svataḥ Prāmāṇya (Intrinsic Validity):* A cognition is assumed valid until proven otherwise. This is the biggest clash with ML T&E.
      *   *Saṃśaya (Doubt):* Requires conflicting evidence. Not a null hypothesis.

  3.  **Drafting the Translation (Iterative Process):**
