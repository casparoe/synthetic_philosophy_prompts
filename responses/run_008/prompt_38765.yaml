answer: |-
  Here is a proposal for a demarcation principle, an application to your withheld cases, and a candid assessment of where this principle forces a revision of your own verdicts.

  ### I. The Principle of Evidentiary Integrity

  Pseudohistory is not defined by being wrong, nor by being fringe, nor even by being dogmatic. It is defined by a structural asymmetry in how evidence is handled. I propose the **Principle of Evidentiary Integrity**, which consists of three necessary clauses. A historical claim is pseudohistorical if it violates *any* one of these:

  1.  **Clause of Source Neutrality:** The criteria used to validate evidence (authenticity, reliability, provenance) must be independent of the conclusion the evidence is used to support. If a source is deemed genuine *because* it supports the thesis, and forged *because* it contradicts it, the claim is pseudohistorical.
  2.  **Clause of Hard Constraints:** The claim must not require the violation of established "hard" facts from adjacent disciplines (physics, biology, genetics, astronomy) unless the challenge to those facts is mounted using the standard methods of *those* disciplines. Historical argument cannot override radiocarbon dates or DNA lineages by textual interpretation alone.
  3.  **Clause of Specifiable Risk:** The proponent must be able to specify a state of evidence that would compel them to abandon the thesis without invoking a conspiracy, a universal forgery, or a collapse of the evidentiary framework itself.

  **Motivation by Case:**
  *   **Clause 1 (Source Neutrality)** handles **Case 6 (Great Zimbabwe)** and **Case 9 (Holocaust Denial)**. In Case 6, African authorship was rejected *a priori* (racism), not by evidence; in Case 9, documents are dismissed as forgeries *because* they attest to the Holocaust. This distinguishes them from **Case 7 (Black Athena)**, where Bernal argued *for* a connection using standard (if contested) linguistic and archaeological means, risking his thesis on the quality of that evidence.
  *   **Clause 2 (Hard Constraints)** handles **Case 1 (Fomenko)**, **Case 2 (Von Däniken)**, and **Case 3 (Illig)**. Fomenko and Illig require astronomy and dendrochronology to be wrong *only* where they contradict the thesis. Von Däniken requires human psychology and cultural evolution to be bypassed without independent proof. This distinguishes them from **Case 5 (Vinland)**, where the "constraint" was merely a consensus belief about navigation limits, not a physical impossibility.
  *   **Clause 3 (Specifiable Risk)** handles the trajectory of inquiry. It distinguishes a failed hypothesis from a closed system. This is the clause that does the heaviest lifting on your **Case 4 (Solutrean)**, as we shall see.

  ### II. Verdicts on the Withheld Cases

  **Case A: The Chinese Treasure Fleets (Gavin Menzies, *1421*)**
  *   **Verdict:** **Pseudohistory.**
  *   **Application:** This violates **Clause 1 (Source Neutrality)** and **Clause 2 (Hard Constraints)**. Menzies interprets anomalies on later maps as proof of Chinese presence (supporting evidence) while dismissing the total lack of contemporary Chinese records, archaeological remains, or genetic markers as "evidence of a cover-up" or "loss" (explaining away counter-evidence). It requires the hard constraint of absence of evidence to count *as* evidence of presence, a logical inversion not permitted in ordinary history.

  **Case B: The County Historical Society Charter**
  *   **Verdict:** **Pseudohistory.**
  *   **Application:** This is a pure violation of **Clause 1 (Source Neutrality)**. A medieval charter is a primary source with material provenance. A founding legend is oral tradition. To declare the material primary source a forgery *solely because* it conflicts with the oral legend is to validate evidence based on its congruence with a desired narrative. This is the exact methodological error of the Great Zimbabwe colonialists (Case 6), inverted: here, local myth trumps material document to preserve a specific local identity.

  ### III. Candid Overturn: Case 4 (The Solutrean Hypothesis)

  You classified the Solutrean Hypothesis as "not pseudohistory," but rather "bad archaeology." You noted that it is "maintained after the genetic evidence turned sharply against it."

  **My principle overturns this verdict.** I argue that the Solutrean Hypothesis *has crossed the line* into pseudohistory, even if it did not start there.

  **Why you should let it:**
  Your intuition protects the *origin* of the claim (credentialed archaeologists, book-length argument). My principle protects the *practice* of the claim.
  *   **At inception:** The hypothesis was ordinary history (or archaeology). It was a risky conjecture within the paradigm.
  *   **In maintenance:** Once ancient DNA analysis demonstrated no European haplogroups in pre-Clovis populations, the **Clause of Hard Constraints** was triggered. To maintain the claim, proponents must now argue that the genetics are wrong, or that the population was replaced entirely without trace.
  *   **The Shift:** If they argue the genetics are wrong *using genetic methods*, they are still doing science. If they argue the genetics are wrong *because* the archaeological typology says so (historical method overriding biological fact), they violate **Clause 2**. If they argue the lack of genetic trace is due to "total replacement," they risk violating **Clause 3 (Specifiable Risk)**, as no amount of negative genetic evidence could ever falsify a "total replacement" theory.

  **Pedagogical Value:** For your seminar, this distinction is vital. It teaches students that **pseudohistory is a trajectory, not just a category.** A legitimate research program can degenerate into pseudoscience (or pseudohistory) if it begins to immunize itself against hard constraints. Classifying Solutrean as "bad archaeology" grants it a legitimacy it no longer possesses. Calling it pseudohistory *now* does not erase the validity of the initial question, but it correctly identifies the current epistemic status of its defense.

  ### IV. Generalizability and the "Feeling" of a Kind

  **Does this generalize to pseudoscience?**
  Yes. The Principle of Evidentiary Integrity is a specific application of a broader epistemic principle applicable to creationism, homeopathy, or climate denialism.
  *   **Creationism** violates **Clause 2 (Hard Constraints)** (geology/physics).
  *   **Homeopathy** violates **Clause 2** (chemistry/physics).
  *   **Climate Denialism** often violates **Clause 1 (Source Neutrality)** (accepting data only when it shows cooling).

  **Does it explain the "Kind"?**
  You asked whether this principle explains what makes Fomenko and Von Däniken feel like a "kind" rather than a coincidence.
  *   **Yes.** The "kind" is not defined by the *content* (aliens vs. chronology) but by the *epistemic vice*. They share a structure of **Immunization**.
  *   Ordinary history is fragile; it breaks when the evidence breaks. Pseudohistory is antifragile; it strengthens when evidence contradicts it (because the contradiction is reinterpreted as proof of the conspiracy/cover-up/complexity).
  *   The "feeling" you have is the recognition of this closed loop. Fomenko and Von Däniken feel alike because they both offer a "master key" that explains everything by rendering standard evidentiary constraints optional.

  **Specificity to History:**
  The only historically specific element is **Clause 1 (Source Neutrality)**. In hard sciences, data is generated; in history, data is found. Pseudohistory is uniquely tempted to curate the *survival* of evidence (forgery claims, lost archives) in a way that pseudophysics (which deals in reproducible experiments) is not. Thus, while the principle generalizes, its sharpest edge is in the criticism of sources, which is the historian's primary tool.

  ### Summary for Your Seminar
  Use the **Principle of Evidentiary Integrity** to move students away from "Who is saying this?" (Consensus) and "Do I like this?" (Motive) toward "How is this claim handling the risk of being wrong?"
  *   If the claim risks the *evidence* to save the *conclusion*, it is pseudohistory.
  *   If the claim risks the *conclusion* to save the *evidence*, it is history (even if wrong).
