answer: |-
  Here is a specification sheet for a theory of biological function, designed to bypass the standard introductory contrasts and target the friction points relevant to your group (especially the synthetic biology contingent).

  I have organized these into **Core Constraints** (the baseline), **Temporal/Historical Constraints** (the hard cases), and **Scientific Practice Constraints** (explanatory utility). Following the list, I have flagged the incompatibilities and provided the requested theory scorecard.

  ---

  ### The Specification: Desiderata for a Theory of Biological Function

  #### I. Core Constraints (The Baseline)

  **1. The Malfunction Condition**
  *   **Requirement:** The theory must allow that a token trait can possess function *F* even if it is currently incapable of performing *F*.
  *   **Motivating Case:** A congenital heart defect. The heart is *for* pumping blood, even if it cannot pump blood. A theory that equates function with current contribution fails here.
  *   **Status:** **Non-Negotiable.** (Without this, "disease" and "health" lose their conceptual distinction in biology/medicine).

  **2. The Accident/Noise Filter**
  *   **Requirement:** The theory must distinguish between traits that exist *because* they do *F*, and traits that merely *do* *F* as a byproduct.
  *   **Motivating Case:** The nose holds up glasses. This is a causal contribution, but not a function. Blood making a thumping sound is a causal effect, but not a function.
  *   **Status:** **Non-Negotiable.** (Without this, functional ascription becomes trivial; everything does something).

  **3. Biological Normativity**
  *   **Requirement:** The theory must ground a specific kind of "ought." If a trait has function *F*, it is *supposed* to do *F*. Deviation constitutes a failure of the trait, not just a statistical rarity.
  *   **Motivating Case:** Distinguishing a mutation (biological error) from a rare phenotypic variant (biological neutral).
  *   **Status:** **Non-Negotiable.** (This is the primary philosophical motivation for positing functions in the first place).

  #### II. Temporal & Historical Constraints (The Hard Cases)

  **4. The Novelty/Exaptation Condition**
  *   **Requirement:** The theory must assign functions to traits that are currently contributing to fitness but lack a specific selection history for *that* contribution.
  *   **Motivating Case:** Feathers initially evolving for thermoregulation, later co-opted for flight. During the transition phase, is the feather *for* flight? Synthetic biologists also face this: a circuit built to oscillate is immediately repurposed to sense a toxin.
  *   **Status:** **Theory-Loaded.** (Etiological views tend to say "No, not yet a function." Causal-Role views say "Yes." This desideratum privileges the intuition that current utility matters).

  **5. The Vestigiality Condition**
  *   **Requirement:** The theory must provide a coherent status for traits that retain their structure but have lost their original causal contribution to fitness.
  *   **Motivating Case:** The human appendix or pelvic bones in whales. Do they retain their original function (and are thus constantly malfunctioning)? Or do they lose the function entirely (and are thus functionless structures)?
  *   **Status:** **Non-Negotiable.** (The theory must give *an* answer, even if the answer is "they are functionless." Ambiguity here undermines the Accident Filter).

  **6. The Synthetic/Design Condition**
  *   **Requirement:** The theory must account for function in organisms or traits created via intelligent design/engineering rather than natural selection.
  *   **Motivating Case:** A bacterium engineered to digest plastic. It has no evolutionary history of doing this. If the theory says it has no function until it survives N generations, it clashes with engineering practice.
  *   **Status:** **Theory-Loaded.** (This smuggles in the assumption that *design* intentions or *immediate capacity* can ground function, which Etiological views reject).

  **7. The Swampman Condition**
  *   **Requirement:** The theory must determine whether an ahistorical duplicate of an organism possesses the same functional traits as the original.
  *   **Motivating Case:** A lightning strike creates a molecule-for-molecule duplicate of a human. Does its heart have the function of pumping blood?
  *   **Status:** **Contested Intuition.** (Treating the intuition "Yes, it does" as a datum is a hangover from artifact theory. Treating "No, it doesn't" as a datum is a hangover from strict naturalism. A robust theory should explain *why* we might feel conflicted, rather than just picking a side).

  #### III. Scientific Practice Constraints (Explanatory Utility)

  **8. The Explanatory License**
  *   **Requirement:** The theory must make sense of why functional statements appear in scientific explanations without rendering them false or merely heuristic.
  *   **Motivating Case:** "Zebras have stripes *to* confuse predators." If this is true, what kind of truth is it? Is it a shorthand for a historical claim? A claim about current survival rates? A claim about system organization?
  *   **Status:** **Non-Negotiable.** (If functional language is systematically false or merely instrumental, philosophy of biology becomes error theory).

  **9. The Granularity Match**
  *   **Requirement:** The theory must allow function ascriptions at different levels (molecular, organismal, ecological) without category errors.
  *   **Motivating Case:** The function of the *heart* (pump) vs. the function of the *SA node* (pacemaker) vs. the function of *predation* (population control).
  *   **Status:** **Non-Negotiable.** (Biology operates at multiple scales; a theory that only works at the gene-selection level is too narrow).

  ---

  ### The Incompatibility Matrix (The "Result")

  You suspected the **Lab-Organism** and **Malfunction** requirements pull in opposite directions. You are correct, but the tension is broader. Here are the three main friction points where satisfying one desideratum forces a violation of another.

  **1. The History vs. Capacity Trade-off (Malfunction vs. Novelty/Synthetic)**
  *   **Conflict:** To satisfy **Malfunction (D1)**, function must be independent of current capacity (a broken heart still pumps in the normative sense). This requires grounding function in *history* or *type*.
  *   **Conflict:** To satisfy **Novelty (D4)** and **Synthetic (D6)**, function must be sensitive to current capacity or design intention, because the *history* is missing or insufficient.
  *   **Result:** You cannot have a theory that grants immediate function to a novel synthetic trait *and* grants function to a broken natural trait without positing two different *kinds* of function (e.g., "selected effect" vs. "systemic role"). If you insist on a univocal definition, one of these cases must be sacrificed.

  **2. The Normativity vs. Swampman Trade-off (D3 vs. D7)**
  *   **Conflict:** To satisfy **Biological Normativity (D3)** in a naturalistic way, you usually need a standard of correctness provided by selection history (what the trait was *selected for*).
  *   **Conflict:** To satisfy the **Swampman Intuition (D7)** that the duplicate *does* have functions, you must sever the link between history and normativity.
  *   **Result:** If you grant Swampman functions, you must explain where the "ought" comes from without history. (Is it structural? Intentional?). If you deny Swampman functions, you preserve naturalistic normativity but accept that intrinsic physical structure is insufficient for function.

  **3. The Explanation vs. Truth Trade-off (D8 vs. D1/D4)**
  *   **Conflict:** Scientists use functional explanations ("The liver filters toxins") as if they are stating current facts.
  *   **Conflict:** If function is historical (to save Malfunction), then "The liver filters toxins" is actually a claim about the *past*. If the liver stops filtering (cirrhosis), the statement "The liver filters toxins" remains true (as a function claim) but false (as a capacity claim).
  *   **Result:** A theory must explain why functional explanations look like capacity claims but often behave like historical claims. Failure here makes functional explanation look systematically misleading.

  ---

  ### Theory Scorecard: Where the Bodies are Buried

  Here is how the two dominant camps pay for their coherence against this spec.

  #### Selected Effects (Wright / Neander / Millikan)
  *   **Wins:** **Malfunction (D1)**, **Accident Filter (D2)**, **Normativity (D3)**. This is their home turf. They explain why a broken heart is still a heart (it has the right history) and why the nose doesn't hold glasses (glasses didn't select for noses).
  *   **Pays Cost On:** **Novelty (D4)**, **Synthetic (D6)**, **Swampman (D7)**.
      *   *The Cost:* They must bite the bullet that a newly evolved trait (or a lab-built one) has *no function* until it has been selected for over generations. They must say Swampman has no functional parts.
      *   *The Defense:* They argue this is a feature, not a bug. "Function" is a historical kind. If you want "what it does now," use "causal role." They accuse the other side of conflating *function* with *capacity*.
  *   **Explanatory License (D8):** Functional explanations are shorthand for historical claims. ("Stripes confuse predators" = "Stripes were selected because they confused predators").

  #### Causal Role (Cummins / Boorse / Systemic)
  *   **Wins:** **Novelty (D4)**, **Synthetic (D6)**, **Swampman (D7)**, **Granularity (D9)**.
      *   *The Win:* If the synthetic bug digests plastic, that is its function in the system. If Swampman has a heart, it contributes to circulation. It matches scientific practice where we ascribe function to newly discovered mechanisms immediately.
  *   **Pays Cost On:** **Malfunction (D1)**, **Normativity (D3)**.
      *   *The Cost:* They struggle to distinguish a broken trait from a trait that just doesn't do that thing. If function = contribution to capacity, a heart that doesn't pump has no function. To fix this, CR theorists often have to smuggle in a "normal conditions" clause or a "design plan," which looks suspiciously like etiology.
      *   *The Defense:* They argue "Malfunction" is just a mismatch between the trait's capacity and the system's requirements. Normativity is relative to the analytic context, not built into the world.
  *   **Explanatory License (D8):** Functional explanations are claims about current system organization. ("Stripes confuse predators" = "In the current system, stripes contribute to survival by confusing predators").

  ### Addressing Your Hunch: Lab-Organism vs. Malfunction

  Your hunch is precise. The tension is between **Forward-Looking** vs. **Backward-Looking** grounding.

  *   **The Lab-Organism Requirement** demands that function be **Forward-Looking** (or Design-Based). We know what the trait is *for* because we intend it to do X, or because it is currently doing X in a way that sustains the system.
  *   **The Malfunction Requirement** demands that function be **Backward-Looking** (or Type-Based). We know what the trait is *for* because of what tokens of this type *did* in the past, regardless of what this token is doing now.

  **The Pushback:**
  The only way to satisfy both without contradiction is **Pluralism**. You argue that "Function" is not a natural kind with a single definition, but a pragmatic label we apply in two different contexts:
  1.  **Evolutionary Context:** We care about history and norms (SE).
  2.  **Engineering/Mechanistic Context:** We care about capacity and contribution (CR).

  If your reading group includes synthetic biologists, they will likely reject Pluralism as "giving up." They want to know what the organism *is*, not how we talk about it. If you force them to choose, the **Malfunction** condition is the stronger philosophical constraint (because it grounds medicine), while the **Lab-Organism** condition is the stronger practical constraint (because it grounds engineering).

  **Recommendation for the Session:**
  Ask the group to try to write a *single sentence definition* of function that satisfies D1 (Malfunction) and D6 (Synthetic) simultaneously. If they can't, you've proven that the concept itself is fractured, and the debate isn't about which theory is right, but which *interest* (history vs. capacity) is currently dominant.
