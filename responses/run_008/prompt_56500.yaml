      *   **Tone:** Careful mapping, not a punchline. Honest conclusion.
      *   **Key Questions to Address:**
          1.  *Who are the blamers?* (Public, press, rivals, colleagues/targets) and does standing matter for them?
          2.  *What does hypocrisy add?* (Distinct wrong vs. discount on earlier blame).
          3.  *Does the standard machinery apply?* (Two-person practice vs. collective/anonymous blame/schadenfreude).
          4.  *Conclusion:* What does this teach the theory? (Does standing to blame misdescribe mass public condemnation?)

  2.  **Initial Brainstorming & Theoretical Framework:**
      *   *Standing to Blame:* The idea that one must be "clean-handed" to legitimately blame others. Key philosophers: Wallace, Bell, Fritz, Miller.
      *   *Hypocrisy:* Often viewed as a loss of standing. Is it a separate moral vice?
      *   *Spitzer's Specific Context:* He was the "Sheriff of Wall Street." He prosecuted vice (prostitution rings) and corruption. He engaged in the very acts he prosecuted (soliciting prostitution) and violated the integrity he championed.
      *   *The Public Nature:* This isn't A blaming B in a room. It's the media ecosystem and the electorate blaming a public figure.

  3.  **Drafting Section 1: Who are the Blamers? (The Standing Question)**
      *   *The Public:* Diffuse, anonymous. Do they have standing? Usually, standing requires a relationship or shared commitment. The public has a contractual/civic relationship with a Governor.
      *   *The Press:* Amplifiers. Do they have moral standing? Or just professional duty?
      *   *Political Rivals:* Opportunistic. Their standing is often questioned because their motive is power, not moral correction.
      *   *Colleagues/Targets:*
          *   *Colleagues:* Betrayed trust. High standing.
          *   *Targets (Wall Street/Prostitutes):* Irony. He prosecuted them; now he is one. Do *they* have standing to blame him? Probably not in the legal sense, but morally, the asymmetry is stark.
      *   *Analysis:* Standing matters differently here. For the public, it's about *authority* and *trust*, not just moral purity. A citizen can blame a leader for violating the public trust even if the citizen sins privately, because the leader's sin is *official* (undermining the office).

  4.  **Drafting Section 2: What does Hypocrisy Add? (The Nature of the Wrong)**
      *   *Underlying Conduct:* Soliciting prostitution (illegal, personal betrayal of wife).
      *   *Hypocrisy:* Prosecuting others for similar acts while doing it.
      *   *Is it a distinct wrong?* Yes. It's "moral fakery." He traded on a reputation for integrity to gain power, then used that power while undermining the very norms he enforced.
      *   *Discount on earlier blame?* It retroactively taints his prosecutions. Were they legitimate? Yes, legally. But morally, the message is corrupted.
      *   *The "Tu Quoque" trap:* Usually, "you did it too" doesn't make the act right. But for a public official, consistency *is* part of the job description. The hypocrisy *is* the breach of public trust, distinct from the sex act itself.

  5.  **Drafting Section 3: Does the Standard Machinery Apply? (Two-Person vs. Mass Public)**
      *   *Standard Theory:* R. Jay Wallace, etc., often frame blame as interpersonal, communicative, aiming at moral reconciliation.
      *   *Spitzer Case:* It's a media frenzy. No reconciliation possible. It's about removal/resignation.
      *   *Schadenfreude:* The public enjoyment of the fall. This contaminates the "moral" nature of the blame. Is it moral blame or just gossip/voyeurism?
      *   *Anonymous Blame:* When everyone blames, no one stakes their character. The "cost" of blaming is zero.
      *   *Implication:* The theory of standing assumes a cost to the blamer (risking exposure, needing relationship). Mass condemnation has no cost. Therefore, standing constraints might not apply in the same way.

  6.  **Drafting Section 4: Conclusion (What does this teach the theory?)**
