answer: |-
  The case of Eliot Spitzer offers a stress test for the philosophical literature on standing to blame and the ethics of hypocrisy. Standard accounts—such as those by R. Jay Wallace, Macalester Bell, or Kyle Fritz—typically model blame as a communicative practice between moral agents within a relationship, where standing functions as a normative constraint on who may legitimately issue reproach. The Spitzer scandal, however, unfolds in the arena of mass media and political power, where the dynamics of anonymity, collective judgment, and institutional authority complicate the standard machinery.

  Here is an analysis of the episode mapped against these theoretical concerns.

  ### 1. Who Are the Blamers? The Problem of Diffuse Standing

  In the standard interpersonal model, standing is often grounded in a shared commitment to norms or a specific relationship. In the Spitzer case, the "blamers" are heterogeneous, and their standing varies significantly.

  *   **The Diffuse Public:** Does the electorate have standing? In political philosophy, the public's standing derives not from moral purity but from the social contract. A citizen need not be sinless to blame a governor for violating the public trust. However, the *intensity* of the public's blame was fueled by moral outrage, not just political disappointment. Here, standing is less about moral authority and more about *sovereign authority*. The public fires the employee. Yet, the ferocity of the condemnation suggests a moral claim, not just a contractual one.
  *   **The Press:** The media acted as the primary amplifier. Their standing is professional, not moral. They are conduits rather than agents of blame. However, by framing the narrative through the lens of hypocrisy ("The Sheriff of Wall Street is a Lawbreaker"), they conferred a sense of moral legitimacy upon the public's outrage.
  *   **Political Rivals:** Rivals called for resignation immediately. Their standing is suspect under standard theories because their motive is partisan gain, not moral repair. If blame requires a desire for moral reconciliation (as some theorists argue), rivals lack standing entirely. They are utilizing the *appearance* of moral blame as a tactical weapon.
  *   **Colleagues and Targets:** This is the most theoretically rich group.
      *   *Colleagues:* Subordinates and fellow Democrats felt betrayed. Their standing is high because the hypocrisy undermined their collective work and credibility.
      *   *Targets (Wall Street/Prostitutes):* There is a profound irony here. Spitzer built his career blaming and prosecuting these groups. Do they have standing to blame him? Legally, no. Morally, the asymmetry is stark. If a hypocrite loses standing because they violate the very norms they enforce, Spitzer's targets are the living proof of his violated norms. Yet, in the public sphere, their silence was required; their "blame" was absorbed into the state's case against Spitzer.

  **Analysis:** Standing matters differently here than in interpersonal ethics. For the public and rivals, standing is not about being "clean-handed" but about holding *institutional power*. The theory of standing assumes a level playing field of moral agents; the Spitzer case reveals a hierarchy where the public's standing to remove a leader overrides the leader's standing to defend himself, regardless of the public's own moral failings.

  ### 2. What Does Hypocrisy Add? Distinct Wrong vs. Discounted Blame

  The core theoretical question is whether hypocrisy is a distinct moral vice or merely a procedural bar to blaming others. In Spitzer's case, hypocrisy was not merely an aggravating factor; it was the catalyst for resignation.

  *   **Moral Fakery and Trading on Reputation:** Spitzer did not merely commit adultery or solicit prostitution (acts which, while wrongful, have not historically ended gubernatorial careers, e.g., Clinton). He traded on a specific brand of moral integrity to gain power. He marketed himself as the "Sheriff." The hypocrisy constitutes a distinct wrong: **fraudulent representation of moral authority.** He secured the office *on the premise* of his unique fitness to enforce norms he was secretly violating. This is closer to fraud than simple inconsistency.
  *   **The Discount on Earlier Blame:** Hypocrisy also functions retroactively. It casts a shadow over his prior prosecutions. If the blamer lacks standing, does the blame lose its force? In Spitzer's case, the legal convictions of his targets remained valid, but the *moral message* of those prosecutions was voided. The hypocrisy suggests that the earlier blame was performative rather than principled.
  *   **The Normative Message:** Standard theory suggests a hypocrite cannot convey the normative message of blame ("You should not have done this") because their actions deny the importance of the norm. Spitzer's actions didn't just deny the importance of the norm; they weaponized it against others while exempting himself. This adds a layer of **abuse of power** to the underlying conduct. The wrong is not just the sex; it is the use of public moral capital for private gratification.

  **Analysis:** Hypocrisy here is a distinct wrong. It transforms a private vice into a public betrayal. It is not merely that Spitzer lost the right to blame others; it is that his previous blaming was revealed to be part of a deceptive persona. The "discount" is total: his moral currency was counterfeit.

  ### 3. Does the Standard Machinery Apply? Collective Blame and Schadenfreude

  This is the point where the philosophical literature strains most against the reality of the scandal. Standard accounts of standing often presume a two-person practice where the blamer stakes their own character and aims at moral recognition.

  *   **Anonymous, Mass Blame:** In the Spitzer scandal, blame was collective and anonymous. When millions of people condemn a figure via media consumption and polling, no single blamer stakes their character. There is no risk of reciprocity. The standard constraint on standing (that one must be willing to accept blame for similar faults) dissolves when the blamer is a faceless crowd.
  *   **Schadenfreude:** A significant component of the public reaction was enjoyment of the fall. The "Sheriff" was caught in the very act he policed. This introduces an impure motive. If blame is contaminated by pleasure in the suffering of the blamed, does it retain moral force? The literature on standing usually assumes a serious, communicative intent. The Spitzer frenzy was often voyeuristic.
  *   **No Possibility of Reconciliation:** Interpersonal blame often leaves room for apology and repair. Political scandal, mediated by the 24-hour news cycle, demands removal, not repair. Spitzer resigned within days. The "standing" to blame him was effectively a standing to *destroy* him.

  **Analysis:** The standard machinery does not apply cleanly. The theory of standing is designed to regulate ongoing moral relationships. The Spitzer episode was a termination of a political relationship. The "standing" invoked was not moral but **aesthetic and narrative**. The public blamed him because the story was too perfect, the irony too sharp. The loss of standing was not a philosophical deduction but a narrative inevitability.

  ### 4. Conclusion: What the Case Teaches the Theory

  The Spitzer episode suggests that the philosophical literature on standing to blame may be category-mistaken when applied to mass public condemnation.

  1.  **Standing is Political, Not Just Moral:** In the public sphere, "standing" is less about moral purity and more about narrative coherence. Spitzer lost standing not because he sinned, but because his sin contradicted his *brand*. The theory of standing needs to account for the role of **public persona** as a distinct normative asset.
  2.  **The Limits of Interpersonal Models:** Theories built on face-to-face reproach misdescribe the ecology of scandal. In mass condemnation, the blamer does not risk exposure, nor do they seek reconciliation. Therefore, the constraints of hypocrisy (which usually protect the blamer from counter-accusation) do not hold. The crowd can blame the hypocrite without fearing their own hypocrisy will be scrutinized.
  3.  **Hypocrisy as a Distinct Public Harm:** The case teaches that in leadership, hypocrisy is not just a failure of consistency; it is a form of corruption. It undermines the normative infrastructure of the office.

  **Honest Assessment:** It is possible the case teaches the theory nothing, because the theory is asking a different question. Standing to blame asks, "Who is entitled to hold you to account?" The Spitzer scandal answered, "Everyone with a vote and a television." The philosophical nuance of standing collapses under the weight of democratic accountability and media dynamics. If the theory of standing is meant to protect the blamer from counter-charge, it offers no protection in the court of public opinion.

  Ultimately, Spitzer's resignation confirms that while moral standing may be a requirement for *interpersonal forgiveness*, it is not a requirement for *political survival*. In the public square, hypocrisy does not merely forfeit one's standing to blame; it forfeits one's standing to lead. The theory of standing describes a moral community; the Spitzer scandal describes a political marketplace. They operate by different rules.
