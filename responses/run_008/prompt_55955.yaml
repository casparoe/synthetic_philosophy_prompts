answer: |-
  # Activity Title: The Turing Tribunal
  **Topic:** The Implementation Problem (Triviality vs. Observer-Relativity)
  **Time:** 90 Minutes
  **Class Size:** 14 Students (3 Juries of 4–5 students)

  ## I. Learning Objective
  Students will attempt to distinguish genuine physical computation from mere structural isomorphism. By adjudicating four borderline cases, they will be forced to articulate a criterion for computation. In the debrief, they will discover that their criterion either excludes standard computers (too strict) or includes arbitrary physical systems (too loose), reproducing the Implementation Problem before they encounter the technical literature (Putnam, Searle, Piccinini).

  ## II. Materials Needed
  *   **3 Verdict Packets** (one per jury), containing:
      *   The "Statute" (Rules of Evidence).
      *   Four "Exhibit Dossiers" (descriptions/diagrams of the systems).
      *   The "Verdict Sheet" (with consistency tracking).
  *   **Whiteboard** for tracking class-wide verdicts.
  *   **Projector** (optional, for displaying diagrams).

  ## III. The Four Exhibits (Staged Systems)
  All systems are claimed to implement the **XOR Function** (Inputs: 00, 01, 10, 11 → Output: 0, 1, 1, 0).

  1.  **Exhibit A (The Silicon Standard):** A standard CMOS transistor diagram of an XOR gate. Voltage thresholds define 0/1. Causal structure is engineered for logical state transitions.
  2.  **Exhibit B (The Hydraulic Analog):** A system of pipes, valves, and water tanks. Water pressure represents 1, no pressure 0. The physical flow dynamics are isomorphic to the silicon gate. No electricity involved.
  3.  **Exhibit C (The Homunculus):** A person in a room with a massive lookup table. They receive slips of paper with "00", "01", etc., look up the result, and write "0" or "1". They have no idea what XOR is. They are tired and sometimes make mistakes, but we correct them externally.
  4.  **Exhibit D (The Natural System):** A video of a drifting cloud formation over 10 minutes. An external observer provides a "Mapping Key" showing that specific configurations of water vapor density at $t_1$ map to inputs, and subsequent configurations at $t_2$ map to outputs, preserving the XOR truth table structure perfectly *under that description*.

  ## IV. Rules of Evidence (The "Statute")
  *To prevent students from dodging the philosophical bullet with pragmatic answers.*

  1.  **No Teleology:** You may not ask "What was this built for?" or "Does it have a purpose?" (This blocks the "design" objection).
  2.  **No Efficiency:** You may not reject a system because it is "too slow" or "energy inefficient." (This blocks the "pragmatic" objection).
  3.  **No Semantics:** You may not ask "Does the system understand what it is doing?" (This blocks the "meaning" objection for now).
  4.  **Structural Isomorphism Only:** Your verdict must rest on the **physical causal structure** of the system and its relationship to the logical states.

  ## V. Timeline (90 Minutes)

  ### 1. Induction & Jury Selection (10 mins)
  *   Divide class into 3 Juries.
  *   Distribute Packets.
  *   **Instructor Script:** "You are the Implementation Tribunal. Your task is not to guess what I want, but to establish a consistent legal precedent for what counts as 'Computation' in the physical world. You will see four exhibits. You must render a verdict for each using one of three findings:
      1.  **Genuine Computation** (The computation is intrinsic to the system).
      2.  **Not Computation** (The system is merely physical).
      3.  **Relative Computation** (It computes only relative to an observer's mapping).
      *Warning: Your verdicts will be cross-examined for consistency. Contradictions will be penalized.*"

  ### 2. Evidence Review (20 mins)
  *   Juries read the four dossiers silently.
  *   They may request *one* clarification from the instructor per exhibit (e.g., "Does the water leak?" "Is the cloud mapping continuous?").
  *   *Instructor Note:* Answer strictly based on physical facts. Do not offer philosophical interpretations.

  ### 3. Deliberation (20 mins)
  *   Juries discuss and fill out their Verdict Sheets.
  *   **Crucial Requirement:** For every verdict, they must write down the **Criterion** used (e.g., "Engineered Causality," "Discrete States," "Active Processing").
  *   *Instructor Role:* Circulate. If a jury says "A is Genuine, D is Not," ask: "What physical feature does A have that D lacks, given that both preserve the structure?" Do not let them say "A is a computer." They must name the *property*.

  ### 4. The Verdict & Cross-Examination (25 mins)
  *   Collect verdicts. Write them on the board.
      *   *Expected Pattern:* A & B = Genuine; C = Relative/Not; D = Not.
  *   **The Trap:** Pick the inconsistencies.
      *   *Scenario 1:* If they say **B (Water)** is Genuine but **D (Cloud)** is Not: Ask, "Both rely on fluid dynamics. One was designed, one wasn't. But Rule #1 forbids using 'design' as a criterion. What is the *physical* difference?"
      *   *Scenario 2:* If they say **C (Human)** is Not: Ask, "The silicon chip also just follows physical laws. Why is electron flow 'processing' but paper shuffling 'not'? Both are causal chains."
      *   *Scenario 3:* If they say **D (Cloud)** is Relative: Ask, "Is Exhibit A also Relative? Does the silicon chip compute if no one is there to interpret the voltage as '1' or '0'?"
  *   Force the juries to defend their **Criterion**. Write the criteria on the board. Highlight where a criterion that admits A also admits D.

  ### 5. Debrief: The Implementation Problem (15 mins)
  *   **Map the Verdicts:**
      *   **A & B:** Represent the standard Computationalist view (functionalism).
      *   **C:** Represents the Chinese Room/Semantic objection (syntax vs. semantics).
      *   **D:** Represents Putnam's Triviality Theorem / Searle's Observer-Relativity.
  *   **Reveal the Dilemma:**
      *   *Horn 1:* If you accepted D (or admitted A is Relative), computation is not intrinsic. It depends on an interpreter. This threatens the idea that the *brain* is a computer (is the brain only a computer because we say so?).
      *   *Horn 2:* If you rejected D, you must have used a criterion (e.g., "discrete states," "counterfactual support," "causal grouping").
  *   **The Missing Piece (Instructor Lecture):** Explain that Putnam proved that for any open physical system, there exists *some* mapping that makes it implement *any* finite state automaton. To avoid this, we need a theory of **constrained implementation** (e.g., Piccinini's mechanistic account: components must be functionally individuated).
  *   **Conclusion:** The activity shows why "computation" is not a natural kind like "gold," but perhaps a functional kind like "engine," requiring specific causal constraints to avoid vacuity.

  ## VI. Predicted Failures (What Will Go Wrong)

  1.  **The "Design" Dodge:** Students will overwhelmingly want to reject Exhibit D because "nobody built the cloud."
      *   *Why:* It's the most intuitive distinction.
      *   *Fix:* Enforce Rule #1 ruthlessly. Ask: "If a lightning strike accidentally rearranged the cloud into the exact causal structure of Exhibit A, would it suddenly start computing? If yes, design doesn't matter. If no, why does the history matter more than the current physics?"
  2.  **The "Speed" Objection:** Students will claim the cloud is "too slow" to compute.
      *   *Why:* Computation is associated with speed in pop culture.
      *   *Fix:* Remind them of Rule #2. A computer slowed down by a factor of 1 billion is still a computer.
  3.  **Silence on Criterion:** Juries may write "It just feels like computation."
      *   *Why:* Upper-level students sometimes hide intuition behind jargon.
      *   *Fix:* During deliberation, demand they fill in the "Criterion" box. Tell them: "You cannot use the word 'compute' in your criterion. You must describe the physical property."

  ## VII. Limitations of the Activity (What You Must Supply)

  Be honest with yourself (and the class) about what this activity *cannot* do. You must supply these in the debrief:

  1.  **The Counterfactual Constraint:** The activity presents static descriptions or short videos. It cannot easily demonstrate **counterfactual support** (i.e., *would* the system have produced output Y if input X had been different?). This is the strongest philosophical objection to the "Cloud" example (the cloud doesn't support the right counterfactuals). You must explain this in the lecture portion.
  2.  **The Mathematical Proof:** The activity relies on intuition. It cannot reproduce **Putnam's Proof** (that any open system implements every input-less automaton). You must sketch the logic of the proof in the debrief to show why the "Cloud" worry isn't just skepticism, but a formal result.
  3.  **The Normative Element:** The activity treats computation as a descriptive fact. It misses the **normative** aspect of computation (the idea that a computer can *miscompute* or make an error). A cloud cannot make an error; a CPU can. This is a key feature of genuine implementation (Kripke's Quus argument) that the activity glosses over. You need to introduce this to explain why Exhibit C (The Human) is tricky—they can make mistakes, but do they know they are mistakes?

  ## VIII. Verdict Sheet Template (Excerpt)

  | Exhibit | Verdict (Genuine / Not / Relative) | Physical Criterion Used (e.g., "Discrete Voltage") | Consistency Check (Does this exclude Exhibit A?) |
  | :--- | :--- | :--- | :--- |
  | **A: Silicon** | | | N/A |
  | **B: Water** | | | |
  | **C: Human** | | | |
  | **D: Cloud** | | | |

  *Scoring:* The Class wins if no Criterion used to accept A is logically incompatible with the Criterion used to reject D. (Spoiler: They will likely lose, which sets up the lecture perfectly).
