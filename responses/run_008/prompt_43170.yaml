  *(Self-Correction on the "Measure" point)*: I need to be very clear that standard anthropics deals in *counts* (number of observers), whereas EQM deals in *continuous measure*. This is the biggest friction point. SIA tries to handle "more observers," but not "more existence of the same observer."

  *(Self-Correction on "Which One")*: In SB, when Beauty wakes, there is a fact: "It is Monday and Heads" or "It is Monday and Tails". In EQM, after measurement, there is no fact "I am in Branch A". There is "Copy A in Branch A" and "Copy B in Branch B". Both are equally real. The uncertainty is about *which copy's perspective I am currently experiencing*, but since both exist, the "I" is ambiguous.

