          *   *Distortion:* The *Measure* problem. In anthropics, we usually count heads (SIA) or sample reference classes (SSA). In EQM, we have continuous weights ($|\psi|^2$). Anthropics vocabulary struggles with "partial existence" or "weighted existence."
          *   *No Expression:* The *ontological status* of the other branches. In SB, the other awakening is counterfactual (or actual but inaccessible). In EQM, it's causally disconnected but physically present in the universal wavefunction.
          *   *The Pressure Point:* The "Which One" illusion. In SB, there is a fact of the matter (the coin landed H or T). In EQM, there is *no* fact of the matter about which branch is "real." They are all real. Anthropics vocabulary assumes a "God's eye view" where one world is actual (usually). Using it for EQM smuggles in the idea that "I end up in one branch," which is false in EQM. All "I"s exist.

