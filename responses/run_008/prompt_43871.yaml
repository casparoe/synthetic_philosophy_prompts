answer: |-
  ### I. Candidate Rules Derived from the Record

  Based on the five verdicts provided, three distinct ethical principles emerge. Each fits the existing data, but they diverge significantly on the new cases.

  **1. The Mirror Principle (Strict Matching-Fault)**
  *   **Definition:** Standing is lost if and only if the blamer *currently* commits the *same specific* wrongdoing they are condemning. Past sins are irrelevant if reformed; different sins are irrelevant.
  *   **Fit:** Explains the **Tax Auditor** (current cheat), the **Shouting Brother** (current shouter), and the **Procrastinator** (different vice). It accommodates the **Sober Woman** (reformed) and the **Non-Car Owner** (never committed the act).
  *   **Blind Spot:** It struggles to explain why the Sober Woman's verdict required the specific gloss that her career "owes nothing" to her drinking. Under a strict Mirror rule, her reform alone should suffice; the benefit clause would be superfluous.

  **2. The Clean Hands Principle (Complicity & Benefit)**
  *   **Definition:** Standing is lost if the blamer profits from the wrongdoing, facilitates it, or retains structural advantages gained through it, even if they do not personally commit the act.
  *   **Fit:** Explains the **Sober Woman** (explicitly notes lack of benefit). It is consistent with the **Non-Car Owner** (no profit from SUVs) and the **Procrastinator** (no benefit from friend's broken promises).
  *   **Blind Spot:** It is under-tested on the "No Standing" verdicts. We don't know if the Tax Auditor would lose standing if he *didn't* cheat but profited from others cheating.

  **3. The Integrity Principle (Double-Standard/Exemption)**
  *   **Definition:** Standing is lost if the blamer claims a moral authority they do not possess by exempting themselves from the norm they enforce. Crucially, this relies on the *attitude* of the blamer (e.g., denial, hypocrisy) rather than just the act.
  *   **Fit:** Explains the **Tax Auditor** (quietly fudges while enforcing rules) and the **Shouting Brother** (berates while doing the same). It fits the **Procrastinator** (does not claim promise-keeping is easy for him).
  *   **Blind Spot:** It is ambiguous on the **Sober Woman**. Does she exempt herself? No, she is sober. But does her past count as an exemption? The verdict suggests no, provided she doesn't benefit.

