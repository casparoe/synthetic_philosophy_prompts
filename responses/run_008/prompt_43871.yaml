  ### IV. The Discriminating Case

  If your friend rules as I predict (No Standing on all three), the **Mirror Principle** is effectively dead. She cares about *Benefit* (Professor) and *Complicity* (Gambler) even without current fault. The surviving competition is between **Benefit** (profiting from the sin) and **Complicity** (facilitating the sin).

  To distinguish these, you need a case where someone benefits from a vice they did not facilitate and do not practice.

  **The Hypothetical:**
  > "A young woman discovers, after her father's death, that his estate—which paid for her university tuition and her current home—was entirely funded by his history of illegal arms dealing. She had no knowledge of this while he was alive. She is now a pacifist and vigorously condemns the arms trade to her friends. Does she have standing?"

  **Why this discriminates:**
  *   **If she says NO Standing:** The **Clean Hands (Benefit)** rule is dominant. Merely possessing the "fruit of the poison tree" disqualifies you, even if you were innocent of the planting. This aligns with the Professor verdict.
  *   **If she says YES Standing:** The **Clean Hands (Complicity)** rule is dominant. Benefit alone is not enough; there must be active participation or facilitation (like the Gambler). This would suggest the Professor's lack of standing was due to his *active* maintenance of the plagiarism (claiming "another person") rather than the passive benefit of tenure.

  This case isolates *Unjust Enrichment* from *Active Complicity*, forcing her to reveal whether standing is lost by what you *have*, or by what you *do*.
