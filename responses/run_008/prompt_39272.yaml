      *   *Paragraph 2: Factual, Normative, or Evidentiary?*
          Move to the core of the conflict. It is primarily an evidentiary selection bias driven by a normative commitment. You cite the crushing spirals because you view moral emotion as a tool for repair; if it breaks the tool user, it is bad. Your partner cites the ennobling cases because they view moral emotion as a compass for aspiration; if it does not reach the core of identity, it is shallow. This is not a factual dispute about which emotion occurs more often, but a disagreement about the telos of morality. Is the goal to keep the peace and fix breaches (guilt), or to become a certain kind of person (shame)? You are both right about the risks and rewards of the emotions you favour, but wrong to assume the other emotion cannot perform the other's function. Guilt can be empty bookkeeping, and shame can be destructive paralysis. The stalemate exists because you are using your best cases against their worst cases.

