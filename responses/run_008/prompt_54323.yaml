answer: |-
  1. Lewis's triviality proofs demonstrate that any proposition satisfying the Equation collapses probability spaces unless probabilities are trivial, meaning the conflict lies not between specific theories but between the Equation and the assumption that conditionals have truth-conditions at all. Consequently, we cannot simply adjust our semantic model to accommodate the data, as we must either abandon the intuitively compelling Equation or accept that indicative conditionals do not express propositions.

  2. To the objection that we intelligibly negate or conjoin conditionals, one should reply that such compounds operate on the level of speech acts rather than propositional content, denying the appropriateness of the conditional assertion rather than its truth. Thus, saying 'it is not the case that if A then B' amounts to rejecting the commitment to assert B under the supposition of A, preserving intelligibility without requiring propositional status.

  3. The striking marginality of embedded conditionals in ordinary grammar, such as the awkwardness of 'if if A then B, then C', serves as positive evidence for this view since a language lacking such embeddings is exactly what one expects if the construction does not express a proposition. If conditionals were standard propositions, their recursive embedding should be seamless, yet their linguistic behaviour suggests they function as unembeddable updates to the conversational context.

  4. Retaining the Equation is paramount because it captures the pre-theoretical intuition that our confidence in a conditional statement tracks precisely our confidence in the consequent given the antecedent. Abandoning this link to save propositionalism would sever the essential connection between conditional judgement and conditional probability, rendering our semantic theory psychologically implausible.

  5. Adopting the conditional assertion view offers a parsimonious explanation of linguistic practice without positing exotic truth-conditions that violate probability theory. By treating 'if A, B' as a rule for updating beliefs rather than a description of facts, we reconcile the logic of supposition with the mathematics of chance without contradiction.
