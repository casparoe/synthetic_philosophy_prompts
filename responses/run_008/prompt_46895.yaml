answer: |-
  ### The branch questions and why they cut

  This decision tree is designed to bypass theoretical jargon, forcing students to rely on their pre-theoretical moral intuitions before encountering technical labels. The entry point is the depletion policy case, which establishes the core tension: a choice that lowers future quality of life but is also the condition of those future people's existence. The first question simply asks if this is wrong. A negative response leads directly to the debunking view, isolating students who feel the intuition is a mistake.

  For those who affirm the policy is wrong, the subsequent branches diagnose *why*. The second question probes the counterfactual comparison: are the future people worse off than they would have been otherwise? This cuts the logical space between those who deny the problem's premise (the counterfactual-comparison view) and those who accept it. The third question introduces the IVF case, asking if selecting an impaired embryo is wrong when the resulting life is still worth living. This tests the consistency of the student's objection across different identity-affecting scenarios.

  The fourth and sixth questions address the core thematic constraints directly. Question four asks whether a wrong necessarily requires an identifiable victim who is worse off. This separates those who cling to the person-affecting intuition from those willing to abandon it. Question six asks if morality is strictly about making specific people better off, or if overall value matters. This distinguishes impersonal consequentialism from views that retain a focus on persons but reject harm-based accounts. Finally, questions five and seven utilise the nuclear and historical injustice cases to test whether students accept that one can be wronged by the very conditions of their origin. This isolates the rights-based view from the contractualist 'wronging without harming' position. By routing students through these specific cases, the tree ensures their final position is grounded in consistent case judgements rather than terminology.

  ### The tree

  *   **Start:** A depletion policy lowers future quality of life, but future people exist only because of it.
      *   **Q1:** Is adopting this policy morally wrong?
          *   **No:** **Leaf: Debunking view** (Intuitions are a tracking error).
          *   **Yes:** Continue.
      *   **Q2:** Are the resulting people worse off than they would have been if you had chosen differently?
          *   **Yes:** **Leaf: Counterfactual-comparison view** (Denies the identity problem premise).
          *   **No:** Continue.
      *   **Q3:** (IVF Case) Is it wrong to select an embryo certain to have a manageable impairment if the resulting child's life is worth living?
          *   **No:** **Leaf: Counterfactual-comparison view** (Consistent application).
          *   **Yes:** Continue.
      *   **Q4:** Does a moral wrong require a victim who is worse off than they otherwise would have been?
          *   **Yes:** **Leaf: [Gap]** (Incoherent with Q1/Q2 answers).
          *   **No:** Continue.
      *   **Q5:** (Nuclear Case) Does a risky policy wrong later people even if they would not have existed without the risk?
          *   **No:** **Leaf: [Gap]** (Inconsistent with Q1).
          *   **Yes:** Continue.
      *   **Q6:** Is morality solely about making specific people better off, rather than increasing overall value?
          *   **No:** **Leaf: Impersonal consequentialism** (Value matters more than specific victims).
          *   **Yes:** Continue.
      *   **Q7:** (Historical Case) Can descendants be wronged by the very conditions that caused them to exist?
          *   **No:** **Leaf: Contractualist view** (Wronging without harming via principles).
          *   **Yes:** **Leaf: Rights-based view** (Wronged by origin conditions).

  ### Leaves, gaps and indistinguishable pairs

  The tree successfully maps the five required positions, but certain branch combinations remain empty. The path affirming the policy is wrong (Q1) while insisting a wrong requires a victim worse off (Q4) is logically incoherent given the case setup; no leaf occupies this space because it accepts the problem's conclusion while denying the only available justification. Similarly, denying the nuclear risk wrongs anyone (Q5) after affirming the depletion policy is wrong (Q1) is merely unattractive, signalling inconsistent intuition across similar cases.

  The most significant overlap occurs between the contractualist and rights-based leaves. Both emerge from the conviction that one can be wronged without being made worse off. The tree attempts to separate them via the historical injustice case (Q7), distinguishing those who focus on violated principles from those who focus on inherent rights regarding origin. However, in practice, these leaves may be indistinguishable for many students. A student who believes descendants are wronged by historical injustice often grounds this in both rights and principles simultaneously. Consequently, the tree cannot genuinely separate a contractualist who accepts origin-based wrongs from a rights theorist who accepts principle-based wrongs. This overlap is unexplored rather than incoherent, reflecting a genuine philosophical convergence where distinct vocabularies describe the same moral phenomenon. Finally, the debunking leaf is cleanly separated at the entry point, ensuring those who reject the initial intuition do not navigate the complex justifications unnecessarily.
