answer: |-
  You should reject Premise (4), because while moral reasons may be context-sensitive without collapsing morality, epistemic reasons require stable norms to justify any argument at all, including the argument for particularism.

  Your roommate's move from moral to epistemic particularism is the fatal overreach. Moral particularism (accepting 1–3) is a coherent position because actions are deeply embedded in social contexts where a feature like "lying" can indeed shift from harmful to helpful depending on the background. However, epistemic particularism (5) is self-undermining. To argue that "there are no epistemic principles," your roommate must rely on epistemic principles—like non-contradiction, induction, or the reliability of memory—to convince you. If epistemic reasons truly flip valence case-by-case with no general guidance, you have no stable ground to believe his conclusion is rational rather than just another isolated judgment. You can be a particularist about the good without being a particularist about the true, because truth-tracking requires a consistency that action-guiding does not.

  The cost of rejecting (4) is theoretical asymmetry: you must accept that ethics and epistemology are disanalogous domains. Ethics deals with navigating complex, conflicting human interests where rigid rules break down; epistemology deals with fitting beliefs to reality, which requires stable laws of logic and evidence. You lose the elegance of a unified theory of normativity, but you save the possibility of rational debate.

  Regarding your question on W.D. Ross: if you keep Premise (2) (the holism of reasons), Ross's "prima facie duties" are indeed just relabeling, not a real escape. Ross assumes that a consideration like "promise-keeping" always counts *in favor* of an act, even if it is sometimes outweighed by other duties. Your roommate's Premise (2) is stronger: it claims the consideration can flip to count *against* the act (or count for nothing) depending on the context. If the valence itself changes, a "prima facie duty" is false because the duty isn't there even prima facie in that specific context. Ross saves generalism only by denying the strong holism of (2), which you said you want to keep. Therefore, Ross cannot rescue you if you grant the flipping cases; he merely softens the language of principles without addressing the structural instability your roommate identified.

  The self-defeat worry you have—that the argument uses a general principle to deny general principles—is avoided in the moral domain because the claim "there are no invariant moral principles" is a metaphysical thesis about morality, not a first-order moral principle itself. It doesn't tell you what to do; it tells you how moral reasons work. However, this defense fails in the epistemic domain. The claim "there are no epistemic principles" is itself an epistemic claim about what we should believe. If it's true, you have no principle telling you to believe it. By cutting the link at (4), you allow your roommate to be a moral particularist without forcing him into an epistemic suicide pact.
