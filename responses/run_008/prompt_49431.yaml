answer: |-
  This is one of the sharpest tensions in First Amendment jurisprudence. You have correctly identified that the Supreme Court's distinction between "ceremonial deism" (currency, Pledge) and "state-sponsored prayer" (schools, graduations) relies on a specific, often unarticulated philosophy of language.

  The Court is not acting as a linguist, but its rulings presuppose a theory of meaning that is fundamentally **pragmatist and historicist**, rather than semantic or theological. Here is a reconstruction of that implicit theory, an analysis of where it fractures, and the consequences of shifting the ground.

  ### 1. The Implicit Theory of Meaning: Semantic Bleaching and Illocutionary Shift

  The legal doctrine at play is known as **Ceremonial Deism**. Coined by Eugene Rostow and adopted by the Court (most notably in *Lynch v. Donnelly* and *Elk Grove Unified School District v. Newdow*), it posits that certain religious references have lost their theological potency through historical repetition.

  **A. Meaning as Use (with a Twist)**
  The Court presupposes a Wittgensteinian view that "meaning is use," but with a specific modifier: **meaning is habituated use.** The implicit theory is that linguistic force is subject to *semantic bleaching*. Just as the word "Godspeed" no longer invokes a theological petition for divine velocity in common parlance, "In God We Trust" is treated as a phatic expression—a social lubricant of patriotism rather than a propositional claim about metaphysics.

  **B. The Speech Act Shift**
  In speech act theory (Austin/Searle), we distinguish between the *locution* (the words), the *illocution* (the intent/force), and the *perlocution* (the effect).
  *   **The Court's View:** When a school principal prays, the illocutionary force is *religious exhortation*. When the Treasury prints "In God We Trust," the illocutionary force has shifted, via history, to *solemnization* or *national identification*.
  *   **The State as Speaker:** The Court treats the State as a corporate agent capable of speech acts. However, it argues the State's "intent" is not to worship but to acknowledge heritage. Therefore, the State *cannot* commit a religious speech act with these phrases because the phrases no longer *function* as religious speech acts in the public square.

  ### 2. Whose Meaning Matters? The "Reasonable Observer" vs. The Devout

  This is where the friction becomes visible. The Court employs the **"Reasonable Observer" test** (associated with Justice O'Connor's Endorsement Test).

  *   **In Ceremonial Deism:** The "Reasonable Observer" is constructed as a historically informed, secularized citizen. This observer understands that "under God" in the Pledge is a descriptor of political history, not a theological litmus test. If a devout hearer (or a devout atheist) feels religious pressure, the Court implies they are misinterpreting the *conventional* meaning of the phrase. The "devout" perspective is treated as idiosyncratic; the "secularized" perspective is treated as objective.
  *   **In School Prayer:** Suddenly, the subjective experience of the hearer matters immensely. In *Lee v. Weisman* (graduation prayer) and *Santa Fe ISD v. Doe* (football prayer), the Court focused on the **coercive pressure** felt by students. Here, the "hearers" are not the "Reasonable Observer" but **impressionable captives**.

  **The Inconsistency:**
  In the currency/Pledge cases, the Court says: *"Don't take the words literally; look at the historical context."* (Meaning is external/historical).
  In the school prayer cases, the Court says: *"Look at how this makes the student feel; it creates pressure to conform."* (Meaning is internal/psychological).

  If the "Reasonable Observer" knows "under God" is secularized ritual, why does the "Reasonable Student" perceive a graduation prayer as religious endorsement? The Court answers this with **context**: The classroom is a place of compulsory attendance and high peer pressure, whereas currency is passive and the Pledge is (technically) voluntary. But this is a distinction of *degree*, not of *linguistic theory*.

  ### 3. Where the Practices Pull Apart: Habituation vs. Fresh Utterance

  The two practices pull apart because the Court applies different temporal lenses to the speech acts.

  1.  **Ceremonial Deism (The Rearview Mirror):** The validity of the speech act depends on the **past**. Because we *have* said it for 50+ years without establishing a theocracy, saying it *now* is safe. The meaning is drained by the weight of history.
  2.  **School Prayer (The Present Moment):** The validity depends on the **present**. A graduation prayer is treated as a fresh injection of religious content into a secular space. Even if a school has prayed for 50 years (*Santa Fe*), the Court rules that tradition does not immunize the practice.

  **The Philosophical Conflict:**
  This reveals that the "rote repetition secularizes" theory is not a consistent linguistic principle; it is a **statute of limitations on Establishment Clause violations.** The Court is effectively saying: *"If the state speaks religion loudly enough for long enough, it becomes secular. But if the state speaks religion in a new context, it remains religious."*

  This creates a paradox for the "State as Speaker." If the State is a moral agent, it should be consistent. If "In God We Trust" is a secular patriotic motto, why is a non-denominational graduation prayer not a secular ceremonial motto? The Court's answer relies on the **vulnerability of the audience** (children) rather than the **semantics of the utterance**.

  ### 4. The Counterfactual: If Religious Meaning Fixed Convention

  You asked what would change if we replaced the "rote repetition" view with the view that **conventional meaning is fixed by what religious speakers and hearers still take the words to mean.**

  This would align the law with a **theological or realist theory of language**, where words retain their ontological weight regardless of bureaucratic habituation.

  **A. The Collapse of Ceremonial Deism**
  If meaning is fixed by the devout:
  *   "In God We Trust" is a profession of monotheism.
  *   "Under God" is a theological claim about the source of political authority.
  *   For a devout Jew, Muslim, or Polytheist, these are not "empty" phrases; they are exclusions. For a devout Christian, they are affirmations of faith.
  *   **Result:** The Court would have to strike down the motto and the Pledge language as violations of the Establishment Clause. The State cannot utter a phrase that functions as a creed for some citizens, even if others ignore it.

  **B. The State's Honesty**
  Alternatively, the Court would have to admit that the State *is* engaging in religious speech but argue it is permissible. This would require overturning the "neutrality" principle of the Establishment Clause. It would move the US toward a model of **non-preferentialism** (the State can support religion generally, just not one sect over another).

  **C. Impact on School Prayer**
  Interestingly, this shift might *protect* some school prayer under a different logic. If "under God" in the Pledge is acknowledged as religious, then banning prayer in schools looks less like "protecting secularism" and more like "hostility to religion." However, under current coercion doctrine, school prayer would likely still fall, because the issue there is less about the *meaning* of the words and more about the *power dynamic* between the State and the child.

  ### 5. Conclusion: Pragmatism Masquerading as Semantics

  To answer your seminar's core doubt: **This is lawyers being pragmatic, utilizing a makeshift philosophy of language to avoid a culture war.**

  The "rote repetition secularizes" theory is legally convenient because it allows the Court to preserve national symbols without having to defend state-sponsored theology. It treats language as **plastic**—malleable enough to serve the needs of social cohesion.

  *   **The Implicit Theory:** Meaning is determined by social consequence, not semantic content. If the consequence of saying "God" on a dollar bill is negligible, the meaning is negligible.
  *   **The Flaw:** It fails to account for the **performative power** of the State. When the State speaks, it does not just describe; it constitutes reality. By printing "In God We Trust," the State *makes* it a national norm, regardless of how "bleached" the words feel to a Justice.

  If your seminar wants to press the point, ask this: **If the State can secularize a religious phrase by repeating it, can it secularize a religious practice by repeating it?** If a state legislature opens every session with a Christian prayer for 200 years (which *Marsh v. Chambers* actually allows), is that prayer no longer a prayer? The Court says yes. But if that is true, then the Establishment Clause does not protect against state religion; it only protects against *new* state religion. That is a historical argument, not a philosophical one.
