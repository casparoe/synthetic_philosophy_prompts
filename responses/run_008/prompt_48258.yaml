      *   *Self-Correction during drafting:* I initially thought about bringing in Kant's *sensus communis*. Keep it lighter. Focus on epistemology/phenomenology as requested. Make sure to explicitly address the "Moral Verdict" claim—is it too reductive? Yes, flag that.

  8.  **Final Review against User Prompt:**
