          *   *Critique:* Does moral judgment *really* lack rehearsal? (Counter: Moral imagination). Maybe the difference is *mandatory* rehearsal vs. *optional* rehearsal.
      *   *Section 3: The "Thin Ice" / Confidence Check.*
          *   Be honest about where this overlaps with existing literature (Hopkins, Hills).
