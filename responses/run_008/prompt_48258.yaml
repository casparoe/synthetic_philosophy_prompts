      *   *Weaknesses (The "Museum Trip" Problem):* If appreciation is *always* a rehearsal, why is it okay to take a friend's word to *go* to the museum?
          *   *Fix:* Distinguish between *practical* reliance (is it worth my time?) and *constitutive* reliance (am I having the experience?). The friend's testimony is a pragmatic heuristic, not a substitute for the aesthetic state.
      *   *Does it predict too much?* If moral judgment is *only* a verdict, does that ignore moral imagination/empathy? (Yes, potentially. Moral understanding often requires "rehearsing" the situation mentally).
      *   *Reinventing the Wheel?* Sounds a lot like "Aesthetic Understanding" (Hills/Hopkins) or the distinction between "Propositional Knowledge" vs. "Knowledge by Acquaintance/Experience." The "Performance" angle is a nice phenomenological spin, but might map onto existing "Non-Transmissibility" arguments.

