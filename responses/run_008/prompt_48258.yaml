  2.  **Deconstruct the Philosophical Landscape:**
      *   **Aesthetic Testimony Problem:** Why does it seem wrong/impossible to form aesthetic beliefs *solely* on testimony? (Kant, Hume, contemporary debates by Hopkins, Mothersill, etc.).
          *   *Pessimism:* You can't know/be justified aesthetically via testimony.
          *   *Optimism:* You can know, but something else is missing (appreciation, understanding).
      *   **Moral Testimony Problem:** Why does it seem odd to form moral beliefs solely on testimony? (McGrath, Hills, etc.).
          *   *Parallel:* Both involve value judgments.
          *   *Divergence:* Moral action often *requires* deferring (e.g., "Is this policy just?" "Yes, the expert says so."). Aesthetic action rarely *requires* deferring.
      *   **Key Distinctions:**
          *   *Acquaintance:* Aesthetic seems to demand it more.
          *   *Autonomy:* Aesthetic judgment feels like it must be your own. Moral judgment can be delegated (sometimes).
          *   *Motivation:* Moral judgment motivates action directly (internalism?). Aesthetic judgment motivates... contemplation?
      *   **User's "Rehearsal Theory":**
          *   Claim: Aesthetic appreciation is a performance/rehearsal (process-oriented). Moral judgment is a verdict (outcome-oriented).
          *   Implication: You can inherit a verdict, not a performance.
          *   Vulnerability: The "Museum Trip" counter-example (deferring on *value* to decide to go, then appreciating later). Does the theory account for *instrumental* vs. *constitutive* use of testimony?

  3.  **Brainstorming the Comparison (Aesthetic vs. Moral):**
      *   *Similarities:* Both are normative. Both involve "sensitivities." Both face the "why not just trust the expert?" challenge.
      *   *Differences:*
