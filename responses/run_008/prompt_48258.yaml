          *   *Autonomy:* In morality, we worry about moral laziness (Hills' "Moral Understanding"). In aesthetics, we worry about missing the *point* of art (Hopkins' "Acquaintance Principle").
      *   *The "Verdict" vs. "Performance" analogy:* This is strong. Moral judgment often functions as a premise for action (Verdict -> Act). Aesthetic judgment often *is* the activity (Performance).

  4.  **Evaluating the "Rehearsal Theory":**
