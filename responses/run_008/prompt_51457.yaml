  # Section 1, "The case"
  Clara is finalizing a departmental audit. Two line items appear: "Project Orion" and "Project Q4-Launch." She knows perfectly well these are the same initiative; if asked, she would instantly affirm the identity. However, the ledger lists them separately, and she cannot authorize the final transfer until the accounts reconcile. She stares at the disjoint figures, unable to proceed, paralyzed by the distinct labels despite her standing belief. Then, she reads an automated system note: "Notice: Project Orion is Project Q4-Launch." She accepts this triviality. Immediately, the mental merge clicks. She recognizes the double-counting error, calculates the correct total, and signs the authorization. She has spent the money only after reading the identity statement.

  # Section 2, "The check"
  Before: Clara believes 'Orion' and 'Q4-Launch' co-refer. She holds disjoint cost figures. She lacks the occurrent belief that the total budget is exceeded, so she cannot sign. After: She accepts 'Orion is Q4-Launch' in context. She acquires the proposition that the total budget is $X (over limit). She gains the ability to sign the audit form. She learns no new proposition *about the names*; the identity statement conveyed no co-reference info. Yet, it triggered a knowledge state change regarding the budget, enabling action previously impossible despite her standing belief.

  # Section 3, "Verdicts"
  **Fregean sense view**: Fregeans smile. The names have distinct senses ('Project Orion' vs. 'Q4-Launch'). Clara grasped both senses but failed to unify them occurrently. The identity statement provided the cognitive bridge between the modes of presentation, allowing the inference to proceed. The informativeness lies in the synthesis of senses, not just reference. Even with standing belief, the distinct modes prevented integration until the sentence forced a union. The case validates the need for senses to explain cognitive significance.

  **Millianism**: Millians argue names contribute only referents. The puzzle is psychological, not semantic. Clara knew the proposition <Orion, Identity, Q4-Launch> dispositionally. The statement triggered occurrent access. The knowledge extended was about the budget, not the names. The identity statement's role is causal, not semantic content. They claim the semantic content was empty for her, but the psychological impact was real. This preserves direct reference by offloading the puzzle to cognitive architecture rather than meaning.

  **Metalinguistic proposal**: This view crashes. It claims informativeness *is* learning co-reference. Clara already knew the co-reference. The statement carried zero metalinguistic news. Yet, it was informative enough to authorize spending. The view cannot explain how a statement devoid of co-reference news extends knowledge/ability. It predicts the statement should be inert for Clara. Since it wasn't, the account fails to capture the source of informativeness in cases of compartmentalized belief. It conflates learning identity with utilizing it.

  # Section 4, "Load-bearing feature"
  The load-bearing feature is the compartmentalization of standing belief versus occurrent integration. Clara's knowledge was siloed by the linguistic labels despite her explicit belief in their equivalence. Deleting this feature—making the identity occurrently active before the statement—collapses the case. She would have merged the accounts earlier, rendering the statement useless. The case relies on the gap between stored belief and contextually available inference. Without this cognitive friction, the scenario reverts to a standard Hesperus case where the belief is absent.

  # Section 5, "The counterattack"
  The Metalinguistic theorist must deny the specification is satisfiable. They might argue Clara didn't *really* believe the co-reference in the relevant way—perhaps she lacked 'full' belief until the statement tokened. Alternatively, they deny knowledge extension: Clara's ability to sign was always there dispositionally; the statement merely removed a performance error. They must insist that without new co-reference info, no epistemic state regarding the identity changed, so the 'informativeness' is illusory. They redefine 'knowledge' to exclude dormant states.
