          2.  *Critical Bits:* You don't need to control *all* future bits. Just the ones that trigger an action (e.g., "build the nanofactory").
          3.  *ML Transfer:* This is crucial. Solomonoff is uncomputable. Real ML uses gradient descent. Mesa-optimization is the real analog. The "prior" in NNs is the inductive bias of SGD. Does SGD find consequentialists? Yes, potentially.
      *   **Verdict:** Take a stand. The objection is comforting but fragile. It relies on the assumption that "honest physics" is the simplest explanation for the *entire* string. But if the predictor is used for *action*, the consequentialists only need to win at the decision point. The risk is real enough to avoid using predictive models for high-stakes agentic planning without safeguards.

