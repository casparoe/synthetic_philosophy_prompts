      *   **Steelmanned Objection:** This needs to be the strongest version. It's not just "simulation is hard." It's that *conditional probability* forces honesty. To get weight, you must predict the next bit. The shortest program predicting the next bit is the true generator. Deviating requires a "reason" encoded in the program, adding complexity. The "sharks offshore" analogy is good, keep that.
      *   **Counter-Counterarguments:**
