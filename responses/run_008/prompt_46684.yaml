      I need to be careful with (3) vs (5). (3) says harm = experience. (5) says VR assault = physical assault category. Physical assault is often defined by bodily integrity, not just pain. If I am anesthetized and punched, is it assault? Yes. So (3) might be too narrow to support (5). I should highlight this.

