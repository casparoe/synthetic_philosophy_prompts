answer: |-
  Two subjects, Alpha and Beta, undergo a standardized nociceptive stimulus without tissue damage or future risk. Alpha reports the sensation is "sharp, burning, and located at the thumb," rating it 8/10, yet continues reading calmly with no wincing or avoidance. Beta reports "an urgent need for this to stop, it is awful," displaying grimacing and withdrawal, but insists "there is no sensation, no location, nothing to point to." A control subject, Gamma, reports both sensation and distress; a baseline subject, Delta, reports neither.

  **Theoretical Walkthrough**
  *   **Normal (Gamma) & Neither (Delta):** All theories agree Gamma is worse off than Delta; Gamma has quality, attitude, and command, while Delta has none.
  *   **Asymbolia (Alpha) vs. Aversive Anesthesia (Beta):**
      *   (a) **Hedonist:** Badness rides on sensory quality. Alpha has the quality; Beta does not. **Verdict:** Alpha is worse off than Beta.
      *   (b) **Attitudinal:** Badness rides on dislike/suffering. Beta suffers; Alpha does not. **Verdict:** Beta is worse off than Alpha.
      *   (c) **Imperativist:** Badness is a binding bodily command. Alpha receives a command but lacks motivational force; Beta has motivation but no bodily content to command. Both are structurally defective imperatives. **Verdict:** Alpha and Beta are equally bad off (zero pain-badness).
      *   *Result:* Pairwise distinct verdicts (Alpha>Beta, Beta>Alpha, Alpha=Beta).

  **Trade-off Probe**
  Each dissociated subject is offered one-shot conversion to the other's state.
  *   **Hedonist Prediction:** Alpha should switch (to eliminate sensory badness); Beta should stay. *Force:* Highly forced; Alpha reports no distress and lacks motivation to change.
  *   **Attitudinal Prediction:** Beta should switch (to eliminate suffering); Alpha should stay. *Force:* Plausible, but relies on Beta trusting a sensation they claim doesn't exist.
  *   **Imperativist Prediction:** Both should be indifferent (neither state holds imperative badness). *Force:* Highly forced; Beta is visibly distressed and motivated to escape.

  **Load-bearing Feature & Attack**
  The load-bearing feature is the stipulation that Beta has *no* localized sensory feel. If Beta were granted any localized quality, the Hedonist would concede Beta has some badness, collapsing the distinction between Hedonist and Attitudinal verdicts (both would likely say Beta ≥ Alpha). The strongest attack comes from the **Hedonist**, who fares worst against intuition: "Aversive anesthesia is conceptually incoherent; distress without an object is anxiety, not pain. By stipulating away the sensory object, you have stipulated away the pain, rendering the comparison void."

  Verdict: symmetric
