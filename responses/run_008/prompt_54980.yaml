answer: |-
  This is a precise translation task. You are asking to map the *pragmatics of historical explanation* onto the *semantics of Structural Causal Models (SCMs)*.

  Your intuition is strong, but there are subtle mismatches. Historians often conflate ontological claims (how the world works) with explanatory claims (how we talk about the world). SCMs are ontologically precise but explanatorily neutral.

  Here is the translation and the Residue Report for your three categories, followed by a synthesis on the "One Cause" problem.

  ---

  ### 1. Conditions vs. Causes
  **Historical Debate:** Historians distinguish between "background conditions" (e.g., the alliance system in 1914, slavery in 1860) and "causes" (e.g., the assassination of Franz Ferdinand, the election of Lincoln). Conditions are treated as static or necessary contexts; causes are the dynamic changes.
  **Your Hypothesis:** This is the difference between conjunctive and disjunctive causal structure.

  **SCM Translation:**
  *   **Clean Map:** In an SCM, this distinction is not structural; it is **model specification** and **variance-based**.
      *   *Conditions:* Variables $C$ that are either (a) fixed constants in the relevant population ($Var(C) \approx 0$), or (b) ancestors so distal that their effect is fully mediated by intermediate variables $M$ which are the focus of the analysis.
      *   *Causes:* Variables $X$ with non-zero variance in the counterfactual set of interest, where $do(X=x)$ is a well-defined intervention.
  *   **Distortion:** Your hypothesis (conjunctive vs. disjunctive) describes *how* inputs combine (the structural equation $f$), not *which* inputs are labeled causes. A "condition" can be part of a conjunctive structure (INUS condition: Insufficient but Necessary part of a Unnecessary but Sufficient condition).
      *   Historians often treat "conditions" as variables we cannot intervene on (e.g., geography, deep culture). In SCMs, these are simply variables where $do(\cdot)$ is undefined or practically impossible.
  *   **Missing in DAGs:** The **Abnormality Criterion**. Historians select "causes" based on deviation from a norm. If $X$ is always 1, it is a condition. If $X$ switches from 0 to 1, it is a cause. DAGs encode dependence, not normality. To capture this, you need a **default value** assignment to nodes (as in Halpern's later work on normality), which is not standard in basic DAG theory.

  **Residue Report:**
  *   **Clean:** Distinction between fixed covariates and treatment variables.
  *   **Distorted:** Mapping to logical structure (AND/OR) rather than variance/interventionability.
  *   **Missing:** The normative/pragmatic criterion for why one parent node is "the cause" and another is "the context."

  ---

  ### 2. Short-term vs. Long-term & Overdetermination
  **Historical Debate:** "Short-term" (triggers) vs. "Long-term" (structural). The claim "the war was overdetermined" means structural factors made $P(War) \approx 1$ regardless of the trigger. The counterclaim is that without the trigger, $P(War) \approx 0$.
  **Your Hypothesis:** (Implicitly) This relates to robustness and counterfactuals.

  **SCM Translation:**
  *   **Clean Map:** This is a dispute over **Probability of Necessity (PN)** vs. **Probability of Sufficiency (PS)**, and **Mediation**.
      *   *Long-term/Structural:* Distal ancestors $Z$ affecting $Y$ through mediators $M$.
      *   *Short-term/Trigger:* Proximal parents $X$ of $Y$.
      *   *"Would have happened anyway":* A claim that $P(Y_{do(X=0)} = 1 \mid X=1, Z=z) \approx 1$. This implies low PN for the trigger $X$.
      *   *"Overdetermined":* Structural redundancy. There exist multiple paths $\pi_1, \pi_2$ from $Z$ to $Y$ such that blocking one does not block $Y$. Or, the baseline risk induced by $Z$ is so high that the marginal contribution of $X$ is negligible.
  *   **Distortion:** Historians often treat "long-term" causes as *deterministic* forces ("inevitable"), whereas SCMs treat them as high-probability structural tendencies. The "inevitability" claim is often a claim about the *stability* of the structural equations across possible worlds, not just the parameters in one world.
  *   **Missing in DAGs:** **Time Granularity.** A static DAG collapses time. A "long-term" cause is just a node further up the topological sort. The *duration* and *process* of the causal mechanism (how the stress accumulates over 50 years) are lost unless modeled as a dynamic Bayesian network or continuous-time process.

  **Residue Report:**
  *   **Clean:** PN/PS metrics; Direct vs. Indirect effects (Mediation); Redundant paths.
  *   **Distorted:** "Inevitability" (metaphysical modality) vs. High Probability (statistical).
  *   **Missing:** The temporal *process* of accumulation; the stability of mechanisms across counterfactual histories.

  ---

  ### 3. Thresholds and Tipping Points
  **Historical Debate:** The "Last Straw." A system accumulates stress until a specific event causes a rupture. The event is decisive not because it is large, but because the system was near a threshold.
  **Your Hypothesis:** Mediation analysis plus a nonlinear response surface.

  **SCM Translation:**
  *   **Clean Map:** You are exactly right. This is a **Nonlinear Structural Equation** with high interaction effects.
      *   Model: $Y = \mathbb{I}(\sum \beta_i X_i + \epsilon > \tau)$.
      *   The "Last Straw" is the variable $X_k$ whose realization pushed the linear predictor over $\tau$.
      *   *Causal Importance:* In this region, the **Average Marginal Effect** is misleading. You need the **Marginal Effect at the Specific Realization**. The Shapley value or Banzhaf power index of that specific variable in that specific instance is high, even if its coefficient $\beta_k$ is small.
  *   **Distortion:** Historians sometimes imply the threshold $\tau$ is exogenous. In social systems, $\tau$ is often endogenous (the system's resilience changes as stress accumulates). Standard SCMs assume fixed structural equations.
  *   **Missing in DAGs:** **Endogenous Thresholds.** If $\tau$ is a function of the history of $X$ (hysteresis), a standard DAG fails. You need a state-space model where the structural equation $f$ changes as a function of prior states.

  **Residue Report:**
  *   **Clean:** Nonlinear response; Interaction terms; Local average treatment effects (LATE) at the threshold.
  *   **Distorted:** Assuming fixed thresholds vs. adaptive resilience.
  *   **Missing:** Hysteresis/Path dependence where the *order* of events changes the threshold $\tau$.

  ---

  ### Synthesis: The "One Cause" Residue Report
  **Your Core Question:** *Is the historians' insistence that among many causally relevant factors one deserves emphasis a substantive causal claim, or is it verbal/pragmatic? Is my vocabulary missing something?*

  **The Verdict:** It is **Pragmatic**, not Ontological. Your vocabulary is not missing causal structure; it is missing **Utility Functions** and **Contrastive Context**.

  In SCMs, if $X_1, \dots, X_k$ are all parents of $Y$ with non-zero coefficients, they are all *actual causes* (under most definitions, e.g., Halpern-Pearl). There is no mathematical property in the DAG that singles out one as "*The* Cause."

  Historians select "*The* Cause" based on criteria external to the SCM:

  1.  **Contrastivity (The Foil):**
      *   Historians answer "Why P *rather than* Q?"
      *   If the question is "Why War in 1914 *rather than* 1912?", the cause is the variable that changed between 1912 and 1914 (the Trigger).
      *   If the question is "Why War in Europe *rather than* Peace?", the cause might be the structural alliances (the Condition).
      *   **SCM Gap:** Standard causal inference estimates $E[Y_{do(X)}] - E[Y]$. It does not formally encode the *contrast class* $Q$. You need **Contrastive Explanation** frameworks (van Fraassen) mapped onto SCMs.

  2.  **Interventionability (Policy):**
      *   We highlight causes we can manipulate. Slavery is a "cause" of the Civil War, but for a politician in 1860, it was a "condition" (too hard to change). The election was the "cause" (mutable).
      *   **SCM Gap:** SCMs define $do(X)$, but they do not rank interventions by *cost* or *feasibility*. You need a **Decision-Theoretic** layer (Causal Decision Theory) to explain why one cause is emphasized.

  3.  **Abnormality (Norms):**
      *   We highlight the variable that deviated from its expected value. Oxygen is a cause of a fire, but we blame the match because matches are usually absent.
      *   **SCM Gap:** As noted in Section 1, standard DAGs lack a "default value" ontology. Halpern's **Causal Models with Normality** adds this, but it is not standard in statistics.

  **Conclusion:**
  The disputes are **partly verbal**, but they reflect a **missing utility layer** in your vocabulary.
  *   **Ontologically:** The historians are describing a dense DAG with redundancy, nonlinearity, and mediation. You can model all of this.
  *   **Explanatorily:** They are optimizing for *narrative compression*. They are selecting the minimal subset of nodes $S \subset Parents(Y)$ that maximizes explanatory power for a specific audience/contrast, subject to constraints on mutability and normality.

  **Recommendation:**
  To fully capture this, look into **Causal Attribution** in Machine Learning (SHAP values, Integrated Gradients) which assigns "credit" to features, and **Contrastive Counterfactuals** (Menzies, Hitchcock). The historians are essentially computing a **Shapley Value** of causal responsibility but weighting it heavily by **abnormality** and **contrastive relevance**. Your suspicion that (1) and (3) are structural is correct, but the *selection* of the primary cause is a decision-theoretic problem, not a purely causal one.
