prompt: |-
  My roommate (plant sciences grad student) and I got into a huge fight about this last night that went til 2am, and I still feel like I lost even though I'm pretty sure he's wrong. It started because I mentioned reading that IQ heritability estimates in wealthy countries often come out somewhere around 50-80%, and he immediately said "so pre-K programs and that stuff are basically a waste of money, it's mostly the genes." When I pushed back he pulled out stuff from his plant breeding coursework — the breeder's equation, response to selection, all that — and said heritability literally tells you how much of a trait is genetic and therefore how much room the environment has to move it, like how if heritability of yield is high, fertilizer won't do much. I feel like both steps are off but I couldn't articulate it well in the moment, and then it got worse when he said "fine, but if it's that heritable within a population, differences between populations must be genetic too," and honestly my only answer was "that doesn't follow, I remember reading it somewhere," which he called hand-waving and he wasn't wrong.

  So what I want is a proper explanation of what heritability does and does not mean, that takes on all three of his moves: (1) high heritability implies interventions are futile, (2) whether the plant-breeding framing transfers to humans, and if not, where exactly it breaks — I vaguely remember that heritability is defined relative to a specific population in a specific range of enviroments, and that as environments become more equal, heritability goes UP, which seems like it should be backwards given his argument?, and (3) whether within-group heritability says anything about between-group differences. Concrete examples would really help me here — things like PKU, where it's "fully genetic" but a dietary intervention eliminates the outcome, or how height heritability apparently shifted as nutrition improved — because I want to actually beat him next time, not gesture at it.

  Please be upfront about which parts of this you're confident in versus reconstructing from general principles, and at the end tell me what would change your mind about your own verdict — like whether there are conditions under which his inference from high heritability to "interventions won't help much" is actually reasonable, and where your explanation is most likely to go off the rails. Also please write it in American English (he's British and I want to needle him about it).
