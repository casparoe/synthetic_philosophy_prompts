  2.  **Rationality vs. Faults:** "Common Knowledge of Rationality" (CKR) is the major fudge. In DS, correct nodes follow the protocol. In GT, nodes follow the protocol *only if* it maximizes utility. CKR assumes everyone knows everyone is incentive-compatible, recursively. This isn't a crash or Byzantine fault model; it's an assumption that the mechanism is incentive-compatible at all epistemic levels. It smuggles in game-theoretic stability as a precondition for knowledge propagation.
  3.  **Fixed Point:** DS verifies safety/liveness of a fixed protocol. GT solves for Nash Equilibrium. The "fixed point" is whether the protocol *is* an equilibrium. Your vocabulary lacks the tool to analyze whether nodes will *choose* to deviate if utilities shift, whereas GT lacks your rigor on liveness under adversarial scheduling.

