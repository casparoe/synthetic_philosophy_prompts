  **The Email Game**
  This is the Two Generals problem with a payoff matrix. The theorem states that without common knowledge, the risk-dominant equilibrium (don't attack) prevails over the payoff-dominant one (attack), even if message loss probability is negligible. In DS terms: you cannot guarantee coordinated commit, so a rational agent minimizes loss by aborting. The math is identical; the conclusion shifts from "liveness impossible" to "coordination equilibrium unstable."

