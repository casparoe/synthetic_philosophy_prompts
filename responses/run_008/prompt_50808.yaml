answer: |-
  1. **Verdict**
  There is no single established name for this specific asymmetry of appraisal within mainstream epistemology. The phenomenon is implicitly discussed in the William James–W.K. Clifford debate regarding the "duty to know truth" versus the "duty to avoid error," but neither philosopher coined a term for the blame imbalance itself. It is also adjacent to discussions of omission bias in moral psychology and type I/II error preferences in decision theory, but these lack the specific doxastic normative focus you describe.

  2. **Nearest concepts**
  **Cliffordian Evidentialism:** This view captures the source of the blame against the early believer (violating the duty to have sufficient evidence). It gets right the intuition that believing prematurely is reckless. However, it parts company with your description because it treats withholding as the default moral safe haven, failing to account for the normative cost of missed truths in forced options. It explains the blame on the believer but validates the immunity of the withholder.

  **Omission/Commission Bias:** In moral psychology, this describes the tendency to judge harmful actions (commissions) more harshly than harmful inactions (omissions). It gets right the structural asymmetry of blame you observe. However, it typically applies to physical acts rather than doxastic attitudes. Furthermore, it often treats the asymmetry as a cognitive error to be corrected, whereas your phenomenon describes a entrenched normative practice in epistemic communities that persists even when the "inaction" is acknowledged as a choice.

  **Epistemic Risk Aversion:** This concept describes a preference for avoiding false positives over false negatives. It gets right the underlying valuation structure (avoiding error is weighted heavier than gaining truth). However, it describes a psychological or policy preference, not the *retrospective appraisal* of agents. One can be risk-averse without blaming others for not sharing that aversion; your phenomenon requires the asymmetric assignment of responsibility.

  3. **Definition**
  The phenomenon is a normative imbalance in epistemic appraisal where agents are held liable for errors of commission (believing falsely) but exempt from liability for errors of omission (missing truth) in forced epistemic options. It is not merely about the outcomes; it persists even when the practical costs of both errors are equivalent. It is distinct from general risk aversion because it concerns *blame*, not just preference. It is distinct from the "inaction is action" thesis because that thesis establishes the metaphysical equivalence of the choices, whereas this phenomenon describes the failure of normative systems to recognize that equivalence.

  A boundary case arises when the evidence *would* have arrived shortly, but the agent did not know this. If the withholder is blamed for missing the window, do we have the phenomenon? No, because here the withholder is blamed. The phenomenon exists only when the withholder remains *praised* or *exonerated* despite the loss. If the community begins blaming the withholder for excessive caution, the asymmetry collapses into symmetric risk assessment.

  4. **Proposed term**
  **Doxastic Liability Asymmetry.**
  *Definition:* The normative imbalance wherein agents are held accountable for errors of belief commission but exempt from accountability for errors of belief omission in forced epistemic contexts.
  *Application:* Apply this term only to cases where the option is genuinely forced (Jamesian) and the belief is causally efficacious in producing the good outcome. Do not apply it to standard evidential waiting periods where evidence is imminent, nor to cases where the belief has no causal impact on the truth or outcome (purely theoretical inquiries).
