  quick context so this makes sense: I left my salaried job about six months ago to trade my own account full time, so all the Kelly criterion stuff that used to be a fun internet argument for me is now literally how I pay rent. before I write up an actual position sizing policy and put real money behind it, I want to know whether my views even hang together, because I've noticed I sort of believe all of these at once:

  1. Kelly is THE right sizing rule for any bet where winnings compound. not "a decent heuristic" — I mean the fraction that maximizes long-run growth beats anyone betting any other fixed fraction, almost surely, so it's basically compulsory for anyone in a multiplicative wealth situation, whatever their feelings about risk.

  2. in practice I size at about half-Kelly, mostly because my edge estimates are noisy.

  3. I think the ergodicity economics crowd (Peters and that whole scene) is overhyped. as far as I can tell they re-derived expected utility theory with a log utility function and put physics language on it. EU theory was never actually broken.

  4. for small one-off gambles — a friendly wager on a game, whether to take some slightly +EV side deal — I'm basically risk neutral, I just go by expected value and dont think twice about it.

  5. since quitting the salary I've cut my sizes even further, below my usual half-Kelly, because the portfolio is now the only thing standing between me and instant ramen. meanwhile back when I HAD the salary I let myself bet a bit over Kelly on my investable money, on the theory that the paycheck was like an outside stream topping me up every month. a friend told me this is exactly backwards and I've genuinely never worked out which of us is right.

  6. half-remembered thing I read somewhere (some quant blog? maybe a paper): if you compute the growth-optimal bet properly when you're UNCERTAIN about your edge, it doesn't always come out below Kelly-on-your-point-estimate — sometimes above it, something about whether you average the growth rates or the edges first. I might be garbling it badly.

  so: is this a consistent package, or am I holding positions whose real justifications can't all be true? I honestly can't tell where the problem is, and I'd rather find out now than after I've sized a position wrong. please structure your answer as:

  **Verdict** (~3 sentences) — does it hang together or not, and if not, what has to give.

  **Real tensions, worst first** (one solid paragraph each) — the pairs that actually conflict, how bad each one is, and the cheapest fix for each, including what that fix costs me.

  **Not actually tensions** (short) — the stuff that only looks like a conflict but dissolves if you think it through. don't skip this part, I want to know which of my worries are fake.

  **The uncertainty question** (one paragraph) — take my point 6 seriously: set it straight if I garbled the argument, and then tell me whether blanket half-Kelly has any actual derivation behind it or whether I just made it up because it feels prudent. definately don't be nice about that one.
