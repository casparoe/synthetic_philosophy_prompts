answer: |-
  This is a canonical stalemate in quantum foundations. Your hypothesis is correct: the disagreement is **both verbal and substantive**, layered in a way that makes it look like a simple semantic quibble when it is actually a clash of metaphysical frameworks disguised as a technical derivation.

  The reason your group chat is stuck is that the two sides are using the same words ("Locality," "Realism," "Assumption") to refer to different mathematical objects and different physical concepts. They are not merely disagreeing on the conclusion; they are disagreeing on what the derivation *is about*.

  Here is a diagnosis of the disagreement, separating the settled mathematics from the contested interpretation, followed by an assessment of what progress looks like.

  ### 1. Settled vs. Contested
  To stop the circle, you need to isolate the bedrock everyone agrees on.

  **Settled (The Mathematics and Data):**
  *   **The Inequality:** The derivation of the Bell-CHSH inequality requires a factorizability condition on joint probabilities: $P(A, B | a, b, \lambda) = P(A | a, \lambda) P(B | b, \lambda)$. (Here $A,B$ are outcomes, $a,b$ are settings, $\lambda$ is the state).
  *   **The Violation:** Quantum mechanics predicts, and loophole-free experiments (2015+) confirm, violations of this inequality.
  *   **The Logic:** Therefore, the factorizability condition is false in nature.
  *   **Bell's Evolution:** In his 1964 paper, Bell used deterministic hidden variables. In his later work (1976, "The theory of local beables"), he generalized this to stochastic **Local Causality**. He explicitly stated that the assumption was Local Causality, not "Realism" as a separate philosophical add-on.
  *   **No-Signaling:** Quantum mechanics respects the no-signaling theorem (you cannot use the correlations to transmit superluminal information).

  **Contested (The Interpretation):**
  *   **The Label "Realism":** Does "Realism" appear as a distinct premise in the derivation? (Camp B says no; Camp A says it's implicit in the existence of $\lambda$ or counterfactuals).
  *   **The Modularity of Locality:** Can you violate factorizability while maintaining a meaningful sense of "Locality"? (Camp A says yes, via Copenhagen/Relational views; Camp B says no, via Maudlin/Bohm).
  *   **The Jarrett/Shimony Split:** Does splitting factorizability into Parameter Independence (PI) and Outcome Independence (OI) carve nature at its joints, or is it merely mathematical bookkeeping that obscures a deeper non-locality?
  *   **The Definition of "Assumption":** Is an assumption only what is written on the left side of the implication ($P \implies Q$), or does it include the ontological commitments required to make sense of $P$?

  ### 2. Diagnosis of the Three Positions

  Your group chat contains three distinct positions that are talking past one another.

  #### Camp A: The Textbook/Operational View ("Local Realism")
  *   **The Claim:** Bell's theorem refutes the conjunction of Locality and Realism. Since we want to save Relativity (Locality), we drop Realism.
  *   **What they mean by "Realism":** Usually **Counterfactual Definiteness** (properties exist prior to measurement) or **Determinism**.
  *   **The Logic:** They often rely on the EPR argument (1935) as a precursor. EPR argued: If Locality is true, Realism must be true. Bell showed: Locality + Realism is false. Therefore, Locality is false *unless* you reject the EPR inference. Camp A rejects the EPR inference (properties don't exist until measured).
  *   **The Blind Spot:** They often treat "Locality" as synonymous with "No-Signaling" (Parameter Independence). Maudlin argues this is a bait-and-switch: Locality should mean "no causal influence," not just "no signaling."

  #### Camp B: The Maudlin/Bell Purist View ("Non-Locality")
  *   **The Claim:** Bell's theorem refutes Local Causality. Period. "Realism" is a red herring.
  *   **The Logic:** The derivation assumes that probabilities for events in region 1 depend only on variables in their past light cone. The violation shows dependence on variables in spacelike separated region 2. That is non-locality.
  *   **On "Realism":** Maudlin argues that to even formulate the experiment, you must assume *something* is real (e.g., detector clicks). If you drop "Realism" entirely, you aren't doing physics. If you mean "Hidden Variables," Bell's 1976 derivation doesn't assume them; it derives the inequality from Local Causality alone.
  *   **The Blind Spot:** They sometimes understate that standard QM *does* respect Parameter Independence, which is sufficient for compatibility with Special Relativity's *empirical* constraints, even if it violates relativistic *ontology*.

  #### Camp C: The Jarrett/Shimony View ("Outcome Independence")
  *   **The Claim:** Factorizability = Parameter Independence (PI) + Outcome Independence (OI). QM violates OI but respects PI.
  *   **The Logic:** PI protects no-signaling (and thus peace with Relativity). OI violations are "holistic" but not "causal" in a signaling sense. We give up OI (often labeled "completeness" or "separability").
  *   **The Contested Point:** Maudlin and others argue this split is physically shallow. If the probability of an outcome here depends on the *outcome* there (OI violation), that is still a dependence on a spacelike separated event. Whether you call it "causation" or "correlation" is semantics; the *dependence* is non-local.
  *   **Status:** This is the most technically precise framing, but whether it resolves the metaphysical tension is the core of the dispute.

  ### 3. Verbal vs. Substantive: The Diagnosis

  Your hypothesis is largely correct, but it underestimates the substantive stake.

  **It is Verbal because:**
  "Realism" is not a standard mathematical term in the derivation. It is a placeholder.
  *   If Camp A defines Realism as "Determinism," they are wrong (Bell 1976 covers stochastic theories).
  *   If Camp A defines Realism as "Counterfactual Definiteness," they are coherent, but Maudlin argues Counterfactual Definiteness is a consequence of Locality (via EPR), not an independent assumption.
  *   If Camp B says "Realism isn't an assumption," they mean it isn't an *independent* axiom $R$ in $L \land R \implies \text{Contradiction}$. Camp A means it isn't a *necessary consequence* of the experimental setup.

  **It is Substantive because:**
  The disagreement is about the **definition of Locality**.
  *   **Camp A** defines Locality operationally: "Can I signal?" (PI). If no, Locality is saved.
  *   **Camp B** defines Locality ontologically: "Does the probability of this event depend on that event?" (Local Causality). If yes, Locality is dead.
  *   **The Conflict:** You cannot reconcile these without choosing a metaphysics of causation. If causation requires signaling, Camp A wins. If causation includes probabilistic dependence (as in Lewisian counterfactuals or Bohmian mechanics), Camp B wins. This is not a verbal dispute; it is a disagreement about the structure of spacetime.

  **It is Answering Different Questions because:**
  *   **Camp A asks:** "How do we teach this to undergraduates without breaking Special Relativity?" (Answer: Drop Realism).
  *   **Camp B asks:** "What does this tell us about the fundamental furniture of the world?" (Answer: The world is non-local).
  *   **Camp C asks:** "Which specific mathematical condition fails?" (Answer: Outcome Independence).

  ### 4. What Counts as Progress?

  Since the experiments are settled and the math is agreed upon, further experiments or new derivations of the inequality will not solve this. Progress requires **conceptual hygiene**.

  **1. Ban the word "Realism."**
  It is too overloaded. It conflates determinism, hidden variables, counterfactual definiteness, and the existence of macroscopic objects.
  *   *Progress:* Agree to use precise terms. If you mean "properties exist prior to measurement," say **Counterfactual Definiteness**. If you mean "the quantum state is not the whole description," say **Hidden Variables**.
  *   *Effect:* This forces Camp A to admit they are dropping Counterfactual Definiteness, not "Reality." It forces Camp B to admit Local Causality implies Counterfactual Definiteness in the EPR context.

  **2. Distinguish "No-Signaling" from "Local Causality."**
  The argument often stalls because one side says "Locality is preserved" (meaning No-Signaling) and the other says "Locality is violated" (meaning Local Causality).
  *   *Progress:* Acknowledge that **Parameter Independence** (No-Signaling) is preserved, but **Local Causality** (Factorizability) is violated.
  *   *Effect:* This validates Camp C's math while validating Camp B's ontology. It clarifies that "Locality" is the ambiguous term, not "Realism."

  **3. Acknowledge the EPR Step.**
  Camp A's position ("Keep Locality, Drop Realism") only makes sense if you treat the EPR argument as a separate premise that can be rejected.
  *   *Progress:* Acknowledge that Bell's 1964 proof used EPR to establish determinism (Realism), but Bell's 1976 proof did not.
  *   *Effect:* Camp B is right about the 1976 theorem (it assumes Local Causality, not Realism). Camp A is right about the 1964 context (where Realism was derived from Locality + QM predictions). The disagreement is often about *which* Bell theorem is being discussed.

  **4. Accept the Metaphysical Tax.**
  The Jarrett split (PI vs. OI) is mathematically sound, but its physical significance is interpretive.
  *   *Progress:* Agree that violating Outcome Independence entails a form of non-separability. Whether this counts as "Non-Locality" depends on your theory of causation.
  *   *Effect:* This moves the debate from "Who is right about Bell?" to "What is your preferred theory of causation?" (e.g., Humean vs. Primitivist). This is a philosophical question, not a physics one, and should be labeled as such.

  ### Summary for the Group Chat

  To break the deadlock, propose this truce:

  1.  **Math:** We agree the inequality assumes **Local Causality** (Factorizability).
  2.  **Data:** We agree Local Causality is violated.
  3.  **Terminology:** We agree to stop using "Realism" as a technical term. It is not an independent axiom in the 1976 derivation.
  4.  **Interpretation:** We acknowledge that **Parameter Independence** holds (no signaling), but **Outcome Independence** fails.
  5.  **The Split:**
      *   Those who define "Locality" as "No-Signaling" will say Locality is saved.
      *   Those who define "Locality" as "Local Causality" will say Locality is dead.
      *   This is a **definition choice**, not a physics dispute.

  The "Textbook" side is optimizing for compatibility with Special Relativity's *operational* constraints. The "Maudlin" side is optimizing for an *ontological* description of the world. Both are consistent with the math; they are selling different products. Progress is recognizing that you are arguing over the marketing, not the machinery.
