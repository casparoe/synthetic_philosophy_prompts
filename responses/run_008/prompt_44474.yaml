prompt: |-
  I'm a PhD student in ML interpretability, and a debate in my group about mechanistic anomaly detection has been circling for two years without anyone moving, so I want a diagnosis of the disagreement rather than a verdict on who is right. The setting: we'd like to flag inputs on which a model does something mechanistically novel — not just unusual behavior, but novelty in how the model computes its answer — and there's a live argument about whether that notion is even coherent. The internalist camp says it is: if you compare causal traces across inputs — which components, when ablated or patched, change the output, and along which directions — you can see whether an eval-time input is being handled by the same parts of the network that handled the training distribution, and a lookup-table-style solution to a task should light up differently than a genuinely generalizing computation. The behaviorist camp replies that this assumes the network decomposes into re-usable parts at all, that "same mechanism" is a property of our descriptions rather than of the weights, and that two inputs can be handled by overlapping-but-not-identical circuits in a way that makes the same/different question ill-posed — similarity of causal traces is graded and depends on the grain at which you cluster, so any threshold is a choice we make, not a joint we find. Both camps agree on the mathematics of the models and on the eval results; what they don't share is a picture of what a mechanism is supposed to be. My working hypothesis is that the argument is only incidentally empirical — the hidden question is whether the notion of a mechanism is doing descriptive work (carving the model at real joints, in which case behavioral and internal anomaly detection can come apart) or normative work (picking out whatever decomposition makes our safety evaluations decision-relevant, in which case the behaviorists are right that the choice is ours but wrong that it's arbitrary). Is that right, or is there a genuine empirical question here — say, whether networks trained in the ordinary way exhibit a small number of repeatedly re-used computational motifs versus a continuum — whose answer would settle it? And what would count as progress given your diagnosis: a worked example where behavioral and internal anomaly detection demonstrably come apart on a realistic evaluation, a formal argument that they cannot, or a change of question? Please answer in continuous prose only — no headings, bullet points, bold text, or tables — the way you'd write a long email to a colleague.
