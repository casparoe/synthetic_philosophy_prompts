answer: |-
  **Project Title:** Interdependence and Aggregation in Cause Prioritization: A Formal Critique of the ITN Framework

  **Research Question**
  To what extent does the standard assumption of independence between Importance, Tractability, and Neglectedness (ITN) distort resource allocation recommendations, and can a unified functional model incorporating ethical aggregation parameters provide more robust prioritization rankings?

  **Project Summary**
  The ITN framework is a widely used heuristic for allocating charitable resources. It typically calculates the expected value of a cause by multiplying three scores: Importance (scale of the problem), Tractability (ease of solving it), and Neglectedness (amount of existing resources). While useful as a mnemonic, standard presentations treat these factors as independent variables. This project argues that this independence assumption is theoretically unsound and practically misleading.

  Economically, Tractability is often a function of Neglectedness due to diminishing marginal returns; a cause cannot be highly neglected and highly tractable at scale simultaneously without specific market failures. Philosophically, "Importance" is not a neutral metric but relies on unresolved aggregation choices in population ethics (e.g., totalism vs. person-affecting views), which can reverse rankings for large-scale causes. This dissertation will formalize these interactions, moving from a multiplicative heuristic to an integrated function, and test whether accounting for these dependencies changes real-world prioritization conclusions.

  **Background and Problem Statement**
  Current ITN guidance suggests assigning scores (often 1–10) to each factor and multiplying them. This implies a production function where $Value = I \times T \times N$. This approach leaves two critical issues unaddressed:

  1.  **Functional Interdependence:** In welfare economics, returns to effort rarely remain constant. As a cause becomes less neglected (more funding/attention), tractability usually declines. By treating $T$ and $N$ as separate multipliers, the framework risks double-counting or misrepresenting the marginal impact of additional resources.
  2.  **Ethical Aggregation:** "Importance" is often treated as an objective headcount or welfare loss. However, in causes involving future generations or existential risk, the calculated importance depends entirely on the underlying ethical framework. Standard ITN presentations rarely make these ethical parameters explicit, hiding normative assumptions inside a descriptive variable.

  **Methodology**
  The project will proceed in three phases, combining formal modeling with comparative case studies.

  *Phase 1: Formalization (Months 1–5)*
  I will construct a mathematical model where Value is a function $V = f(I, T, N, \theta)$.
  *   **Economic Component:** I will replace the independent $T$ and $N$ terms with a marginal returns curve, where Tractability is defined as the derivative of impact with respect to resources, contingent on the current level of Neglectedness.
  *   **Ethical Component:** I will parameterize "Importance" using a variable $\theta$ representing the ethical aggregation rule (e.g., a switch between total utilitarianism and person-affecting views).
  *   **Output:** A working theoretical model that explicitly shows how changes in resource levels and ethical assumptions shift the expected value function.

  *Phase 2: Sensitivity Analysis and Simulation (Months 6–10)*
  Using the model from Phase 1, I will run simulations to identify "tipping points."
  *   I will test how much the variables need to correlate before the standard multiplicative model yields a ranking error greater than 50%.
  *   I will determine if there are "robust" causes that rank highly regardless of the ethical parameter $\theta$ or the specific diminishing returns curve, versus "fragile" causes that only rank highly under specific, unstated assumptions.

  *Phase 3: Worked Examples (Months 11–14)*
  I will apply the refined framework to three distinct cause archetypes:
  1.  **Global Health:** High baseline funding, diminishing returns likely steep.
  2.  **Animal Welfare:** Moderate funding, potential for policy leverage.
  3.  **Long-term Risk Reduction:** Low current funding, high uncertainty on ethical aggregation.
  The goal is not to settle which cause is best, but to show whether the *ranking* of these causes flips when interdependence and ethical parameters are made explicit compared to the standard ITN heuristic.

  *Phase 4: Writing and Dissemination (Months 15–18)*
  Drafting the dissertation and preparing two journal articles: one for an economics/policy journal focusing on the resource allocation model, and one for a philosophy journal focusing on the ethical aggregation parameters.

  **Scope and Feasibility**
  This is a solo theoretical project requiring no lab access or human subjects review. The 18-month timeline is tight but feasible because the scope is limited to *critiquing and refining* an existing framework rather than gathering new empirical data. The "data" used in Phase 3 will be based on existing public estimates from major grantmaking organizations, used solely to stress-test the model's logic, not to produce definitive funding advice.

  **Conditions for Failure**
  This project would be considered a failure if:
  1.  **Triviality:** The formal model demonstrates that while interdependence exists mathematically, it does not meaningfully change cause rankings under realistic parameter ranges (i.e., the heuristic is "good enough").
  2.  **Intractability:** The model becomes so complex that it requires inputs (e.g., precise elasticity of impact) that are impossible to estimate, rendering it useless for decision-makers.
  3.  **Meta-Ethical Stall:** The project gets bogged down in defending a specific ethical framework ($\theta$) rather than showing how *different* frameworks alter the output.

  **Risk Assessment**
  The biggest risk is a bifurcation between useless abstraction and hand-wavy critique.
  *   **Risk A (Pure Math):** I could produce a formal model that is mathematically elegant but disconnected from how prioritization is actually done. If the model requires variables that no organization can measure, it will be ignored by practitioners.
  *   **Risk B (Verbal Complaints):** I could end up writing a philosophical critique that points out flaws without offering a structured alternative, leaving reviewers with the impression that I have simply complained about a tool without improving it.

  **Mitigation Strategy:**
  To avoid Risk A, I will anchor the mathematical modeling in Phase 1 to standard production functions used in development economics, ensuring the terminology is familiar to economists. To avoid Risk B, I will commit in Phase 3 to using specific, public numerical estimates from existing cause prioritization reports. Even if these estimates are imperfect, using them forces the model to generate concrete outputs rather than remaining purely theoretical. The deliverable will not be a "perfect calculator," but a sensitivity analysis tool that shows users how much their conclusions depend on hidden assumptions about independence and ethics.
