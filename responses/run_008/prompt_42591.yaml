  2.  **Deconstruct the Core Argument:**
      *   *Current State:* ITN is usually $Value = Importance \times Tractability \times Neglectedness$.
      *   *Problem 1 (Interdependence):$ Tractability is often a function of Neglectedness. As more resources flow in (lower neglectedness), marginal returns drop (lower tractability). Treating them as separable multipliers overestimates value in crowded fields or underestimates it in uncrowded ones depending on the curve.
      *   *Problem 2 (Importance Ambiguity):$ "Importance" isn't a raw number. It depends on population ethics. If you change from total utilitarianism to person-affecting views, the "importance" of existential risk vs. near-term suffering changes drastically.
      *   *Proposed Solution:* Build a unified model where these variables interact explicitly, rather than assuming separability.

  3.  **Drafting - Section by Section:**

