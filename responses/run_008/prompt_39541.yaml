answer: |-
  1. "Sanity check"
  The position is coherent and pragmatically grounded, shifting the burden from metaphysical truth to engineering stability. It treats value learning as a signal-processing problem where noise reduction is valuable even if the signal isn't perfectly calibrated.

  2. "Defeaters that should move me"
  1. **Systematic Bias in Extrapolation:** Your argument assumes idealization errors are unbiased noise reduction. If the extrapolation model encodes structural biases (e.g., privileging deliberative cognition over somatic intuition), it doesn't just reduce variance; it rotates the vector away from what you actually care about. A stable wrong turn is worse than a jittery correct path, especially with lock-in. This is the strongest defeater because it attacks the core mechanism: if the filter distorts rather than cleans, robustness accelerates failure. In alignment, a consistent bias compounds over time, whereas raw noise might cancel out or allow course correction. Furthermore, the idealization process itself is designed by humans with their own biases, meaning the "noise filter" is actually a value-laden sieve that may systematically exclude marginalized or non-verbalizable preferences.

  2. **The Update Lock-in:** Raw preferences allow for moral updating based on unforeseen empirical discoveries. CEV locks in a function derived from current knowledge. If the extrapolation assumes facts that turn out false, or misses value-relevant phenomena unknown today, the "stable" target becomes actively hostile. Robustness to mood swings is useless if you're robustly committed to a mistake that future evidence would have corrected. You are trading the ability to learn for the ability to persist, which is fatal if the initial trajectory is off. Moral progress often looks like instability from the perspective of the past; locking in stability may lock in barbarism.

  3. **Verification Asymmetry:** You can check a raw preference against behavior. You cannot easily check an extrapolated preference against anything except the model's own output. If the extrapolation process is opaque, you cannot confirm it is filtering noise rather than signal. You are trading observable error for unobservable drift, making recovery impossible when things go wrong. This opacity prevents the very stress-testing you are requesting now, as you cannot isolate the variable of "idealization" from the variable of "model error." Without ground truth, you cannot measure improvement. Collectively, these argue that your robustness claim relies on an optimistic view of the extrapolation mechanism itself.

  3. "What I can shrug off"
  Empirical claims that raw preferences are already stable are shruggable because you only need *some* variance reduction to justify the move for lock-in systems. Objections regarding the computational feasibility of CEV are irrelevant to the theoretical claim about robustness. Similarly, debates about whose volition enters the pool miss your point; even individual self-extrapolation faces the same robustness test. These are implementation hurdles, not conceptual defeaters. They complicate the engineering but don't invalidate the principle that smoothing noise aids stability. Convergence arguments are also irrelevant since you explicitly decoupled correctness from stability. You can concede implementation difficulty without abandoning the robustness thesis. Additionally, concerns about the cost of computation do not negate the benefit if the system is built.

  4. "The insulation problem"
  You risk unfalsifiability by defining success relatively rather than absolutely. If the extrapolated outcome is horrific, you can always post-hoc argue the raw snapshot would have been worse, which is impossible to prove. To avoid this, you need pre-commitment criteria for what counts as "noise" versus "signal" before running the extrapolation. Without independent metrics for preference stability, "robustness" becomes a motte-and-bailey where any output is defended as noise-reduced. You must specify what evidence would show the extrapolation amplified error rather than dampening it. Otherwise, the claim survives only by making the counterfactual inaccessible. This renders the position immune to evidence, which is fatal for a empirical claim.

  5. "Bottom line"
  Keep the robustness frame, but abandon the assumption that idealization is neutral noise-filtering. Your position holds only if you can demonstrate the extrapolation process doesn't introduce larger systematic biases than it removes. Treat it as a high-risk engineering hedge, not a default safety measure.
