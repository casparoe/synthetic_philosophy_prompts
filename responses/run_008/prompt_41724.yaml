      *   **Context:** Debate with a Philosophy PhD friend about Plato's Theory of Forms vs. Asset Pipelines (Prefabs/Instances).
      *   **The Friend's Claim:** Forms = Prefabs, Sensible Objects = Instances, Participation = Instantiation + Variation.
      *   **The User's Pushback:** Prefabs/Instances are equally real (ontologically), instances reference source (epistemically accessible), prefabs aren't special. Mentioned "Third Man" argument (friend conceded).
      *   **The Task:**
          1.  Restate Plato's position (Forms, Cave, Form of the Good) using game dev vocabulary (prefabs, shaders, LOD, etc.) *faithfully*.
          2.  Provide a "Residue Report": What translates cleanly, what distorts, what has no counterpart.
          3.  Address specific questions: "Forms more real than instances" in engine terms? "Sensible world deceptive" vs. runtime/assets?
          4.  Conclusion: Does the residue show a limit in the user's framework or a vagueness in Plato's?

  2.  **Deconstruct Plato's Core Concepts:**
      *   **Forms (Ideai/Eide):** Perfect, eternal, unchanging, non-spatial, non-temporal archetypes. The *essence* of a thing.
      *   **Sensible Particulars:** Imperfect, changing, spatial, temporal copies.
      *   **Participation (Methexis):** How particulars relate to Forms.
      *   **Epistemology:** Knowledge (Episteme) is of Forms; Opinion (Doxa) is of Sensibles.
      *   **Ontology:** Forms are *more real* (ontological priority) than Sensibles.
      *   **The Cave:** Sensibles are shadows/illusions; True reality is outside (Forms).
      *   **Form of the Good:** The source of intelligibility and existence for all other Forms (like the Sun).

  3.  **Map to Game Dev Vocabulary (The Translation Layer):**
      *   *Prefab:* Close, but user is right—it's just data. Needs to be elevated. Maybe "Source Asset on Disk" vs. "Runtime Memory"? No, Plato's Forms aren't just data. Maybe "Mathematical Definition/Algorithm"?
      *   *Instance:* Runtime object.
