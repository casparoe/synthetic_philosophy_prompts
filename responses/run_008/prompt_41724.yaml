      *   *Cave/Deception:* Runtime vs. Asset. The runtime *simulates* the asset. Floating point errors, LOD popping, occlusion culling = deception. The screen is literally a 2D projection of 3D data (shadows on the wall).
      *   *Residue Meaning:* Does it show a limit in the user's framework (materialism/computationalism) or Plato's vagueness? It shows the limit of *computational* metaphors to capture *normative* and *ontological* weight. Code describes *how*, Plato describes *why* and *what ought to be*.

