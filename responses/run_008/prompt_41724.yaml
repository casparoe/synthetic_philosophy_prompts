prompt: |-
  I'm a gameplay programmer with ten years of experience in Unity and Unreal, and last weekend an old friend who did a philosophy PhD argued with me until two in the morning that Plato's theory of Forms is just an asset pipeline: the Form of the horse is the prefab, sensible horses are instances of that prefab, and "participation" is nothing but instantiation plus per-instance variation. I pushed back that the translation can't be that clean, because in my world the prefab and its instances are equally real, an instance can be inspected to recover its source asset, and nothing about a prefab makes it epistemically special. When I asked him what the prefab of the prefab is, he muttered something about a "Third Man" and changed the subject. Please restate Plato's position — the Forms, the cave allegory, and whatever role the Form of the Good plays — as faithfully as you can in my vocabulary: prefabs, instances, shaders, level of detail, procedural generation, draw calls, whatever genuinely fits. Then give me the residue report: which of Plato's claims translate cleanly, which translate only with distortion, and which have no counterpart in engine terms at all. I'm especially interested in whether "the Forms are more real than their instances" can be expressed as anything an engine developer would recognize, and in whether the cave's claim that the sensible world is systematically deceptive maps onto anything in how a runtime relates to its assets. Finally, tell me whether the residue points to something my framework cannot say or to something his position never made clear in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

