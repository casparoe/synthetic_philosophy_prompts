      *   Need to ensure `key_corrections` are conceptual.

  5.  **Addressing the Constraint:** "Deliver only the final structured output described below, not your working notes."
      *   I must output *only* the JSON. No intro, no outro.

  6.  **Constructing the JSON:**

      *   *Claim 1:* Universalization test. Verdict: Defensible simplification. Explanation: Captures the Formula of Universal Law's procedure but omits the specific logical mechanism (contradiction). Defender: "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   *Claim 2:* Consequences/Bad outcomes. Verdict: Misrepresentation. Explanation: Kant rejects consequences as the ground of morality; the test checks for logical or volitional contradictions, not harmful outcomes. Defender: "An act is wrong if universalizing its maxim generates a contradiction in conception or in the will, not because it produces bad results."
      *   *Claim 3:* Lying/Trust collapse. Verdict: Defensible simplification. Explanation: While Kant does argue lying undermines communication, framing it as 'pointless' or losing 'profit' focuses on utility rather than the duty to truthfulness itself. Defender: "Lying is wrong because it treats humanity as a mere means and contradicts the necessary condition of communication."
      *   *Claim 4 & 5 (Golden Rule):* I should probably combine these or treat them as separate claims. The prompt says "Cover every claim... there are more claims than sentences". I will split the Golden Rule assertion and the "receiving end" elaboration.
      *   *Claim 4:* Golden Rule equation. Verdict: Misrepresentation. Explanation: Kant explicitly critiques the Golden Rule in the *Groundwork* for being based on subjective desire rather than objective duty. Defender: "The Categorical Imperative commands duty irrespective of what you would want done to yourself; it is derived from reason, not empathy."
      *   *Claim 5:* Receiving end/acceptance. Verdict: Misrepresentation. Explanation: This relies on hypothetical consent based on inclination, whereas Kant requires rational necessity regardless of personal acceptance. Defender: "You must not treat others that way because reason forbids it, not because you would dislike experiencing it."
      *   *Claim 6:* Welfare/Community Vote. Verdict: Misrepresentation. Explanation: This conflates Kantianism with Utilitarianism (welfare) and Social Contract Theory (voting/endorsement). Defender: "Kantian ethics requires acting from duty according to rational law, not balancing inclinations against aggregate welfare or seeking democratic consensus."

