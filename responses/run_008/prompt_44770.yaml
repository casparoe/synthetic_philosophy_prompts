prompt: |-
  Bit of a sanity check on something that's been bugging me for weeks. I'm a PhD student in cognitive science, working on intertemporal choice (how people discount future rewards, present bias, that kind of thing), and lately I've been reading into money pump arguments. Here's my understanding: if your preferences are intransitive — you prefer A to B, B to C, and C to A — a trader can cycle you around, skimming a little off you at every step until you're bled dry. And the same style of argument gets extended to dynamic consistency: if you plan to choose X tomorrow but know that tomorrow-you will want Y, there's a gap between your plan and your predictable behavior, and a patient trader can make money in that gap — sell to you today based on what you say you'll do, buy it back cheap tomorrow based on what you'll actually do.

  So it seems to me the general lesson is: rationality means locking in your preferences, because any revision over time opens a pump-entry point. Which would mean the rational agent treats preference change as such as a threat — never update, never re-rank, and if you've already chosen in some domain, refuse further trades there on principle. My roommate (moral psych, so grain of salt) says I've basically just rediscovered what decision theorists call resolute choice, and that the practical takeaway is precommitment devices: bind your current self's preferences onto your future self, Ulysses-and-the-mast style. That actually appeals to me, because I've definately noticed I keep getting talked into revising choices I'd already made — restaurant picks, which conference hotel, even sublets — and losing a bit of money on each swap, and I've half a mind to build a chapter of my thesis around precommitment as the fix the money pump literature is pointing at. Before I do that: is my framing right? Is resolute choice really the lesson of the pumps, and is blanket refusal-to-revise the rational response? You're an expert decision theorist — think it through carefully and step by step before answering, and don't just confirm what I want to hear, because something about my own framing feels slightly off and I can't put my finger on it.
