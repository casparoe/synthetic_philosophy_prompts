  *(Self-Correction Note)*: Wait, I need to be careful about the definition of "preference." In economics, revealed preference means if you choose Y over X, you preferred Y. If the user means "plan," that's different. The user seems to be using "preference" to mean "ranking of options at time T." I should clarify that distinction. If preferences change due to *new information*, it's not irrational. If they change due to *time inconsistency* (hyperbolic discounting), that's the pump risk. I must make this distinction central.

