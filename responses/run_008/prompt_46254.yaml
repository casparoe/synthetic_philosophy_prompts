  - `candidate_rules`: an array of objects, each with `name` (a short label), `statement` (one sentence capturing the rule), and `fit` (how it handles verdicts 1–6, flagging any verdict it strains to accommodate). At least two of these rules must fit all six verdicts, and at least two of them must diverge on at least one of the three new cases.
