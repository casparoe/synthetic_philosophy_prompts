  - The sim pilot: a colleague's teenage son with well over a thousand hours in a home flight simulator, including flawless handling of simulated engine failures, who has never touched the controls of a real aircraft. Does he know how to fly?
  - The chess engine: a program that plays better than any human alive. Does it know how to play chess?

