  A friend from my climbing gym — I'll call her R. — holds remarkably firm opinions about who counts as "knowing how" to do something, and over the past year I've kept notes whenever the topic came up, because her judgments strike me as consistent without my being able to reconstruct the underlying rule. I'm a backend engineer with no philosophy training, and what I'd like is for you to reverse-engineer her decision procedure the way you'd reverse-engineer an API from a pile of observed request–response pairs. Her verdicts so far, in her own idiom:

