  - `best_guess_rule`: the rule R. is most likely running, and your reasons for preferring it over the close runners-up.
  - `dividing_cases`: an array of one or two further cases — not among the six earlier verdicts or the three new ones — that would most cleanly separate the candidate rules, each with a note on what each rule predicts about it.

  I don't need citations or reading lists — I wouldn't recognize the literature anyway. I just want careful reasoning about what her track record commits her to.
