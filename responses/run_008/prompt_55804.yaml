          *   *Child Soldier:* User excuses kid more than conscript. Principle might say kid is *less* responsible, but if the kid is shooting, they are still an unjust threat. However, necessity/proportionality might forbid killing the kid even if liable. I should distinguish *Liability* from *All-Things-Considered Permissibility*.

  5.  **Addressing the New Cases:**
