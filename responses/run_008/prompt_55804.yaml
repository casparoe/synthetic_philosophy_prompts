  4.  **Developing the Reflective Equilibrium:**
      *   **Principle:** *The Asymmetric Liability Principle.*
          1.  **Unjust Threat Condition:** One is liable to defensive harm only if one poses a threat that contributes to an unjust cause (or violates *jus in bello*).
          2.  **Agency Condition:** One is responsible for that threat unless coercion or ignorance completely negates voluntary agency (not just mitigates blame).
