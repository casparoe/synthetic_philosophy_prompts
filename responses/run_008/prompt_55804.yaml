      *   *Key Insight:* To save Revisionism without excusing everyone, we need to distinguish between *culpability* (blameworthiness) and *liability* (forfeiture of right not to be harmed). One can be liable without being highly culpable (e.g., innocent threats), but in war, the bar is usually higher.
      *   *The "Conscript Problem":* If conscripts aren't culpable, can they be liable? McMahan says yes, if they are responsible for the threat, even if excused from blame. But the user feels the conscript is *not* a murderer (excused) but *is* killable (liable). This is actually consistent with a nuanced Revisionism, but the user feels it collapses into Walzer.
