      *Decision:* I need a principle that captures the *Unjust Threat* core of Revisionism but accommodates the *Conscript Intuition* (liable but not blameworthy) without collapsing into Walzer. The key distinction is between *blame* (criminal/moral condemnation) and *liability* (defensive permission).
      *Refined Principle:* **The Culpable Threat Principle (modified).**
      Actually, better: **The Responsible Threat Principle.**
      Liability arises from being morally responsible for an *unjust* threat of harm, where "responsibility" includes voluntary action even if blame is mitigated by coercion/ignorance, *unless* the coercion/ignorance is so severe it negates agency entirely.

      *Wait, let's look at the User's specific tension:* "Permissible killing can target someone who isn't culpable."
      *Solution:* Distinguish *Culpability* (Blame) from *Liability*. You can be liable to defensive force without being culpable enough to be punished. This is the McMahan "Innocent Aggressor" move.
