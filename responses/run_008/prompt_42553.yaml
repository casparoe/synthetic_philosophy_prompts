      *   *Written Rationale:* Explicitly state the normative leap. "We acknowledge the scores are not cardinal measures of wellbeing, but are treated as such for the purpose of equitable allocation."
      *   *Bedrock:* The residue is the decision to be utilitarian. That's a value judgment, not a fact.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "the economist is being difficult." Robbins has a point. Interpersonal comparison *is* unverifiable. I need to honor that while showing why it's paralyzing in this context.
      *   *Correction:* The user noted that previous decisions were invariant under monotone rescaling. I need to explain *why* Thursday is different. Thursday involves the *cutoff*. If the cutoff falls between two close scores, and we change the scaling (min-max vs. anchor), the order might flip. This implies the *distance* between scores matters, not just the order. This confirms the need for cardinality.
      *   *Key Insight:* The Economist thinks he is avoiding weighting by refusing scaling. The Physician points out he is weighting by queue. The User needs to see that *any* rule weights someone.* The choice is which weighting to own.

  6.  **Final Polish:**
