      *   **Path to Progress:** The "Constructive Convention" approach.
      *   **The Bedrock:** Acknowledging the moral residue.

  *(Self-Correction during final review)*: Make sure to explicitly answer "which of the two my panel actually faces on Thursday." It's the weighting question, but it depends on the scaling assumption. Actually, it's the **operationalization of weighting**. They face the need to make a cardinal distinction to resolve a weighting problem. I will clarify this distinction.

