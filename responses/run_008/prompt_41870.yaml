prompt: |-
  Social epistemology PhD student here (dissertation on testimony, so naturally I see my topic everywhere), and I've kind've gotten obsessed with the implicit epistemology built into Wikipedia's sourcing rules. Sketch of the practice as I read it, and tell me if I'm off:

  The Verifiability policy states that "Wikipedia's content is determined by published information rather than editors' beliefs, experiences, or previously unpublished ideas or information," and the No original research policy flatly says that "If no reliable independent sources can be found on a topic, Wikipedia should not have an article about it." So an editor who personally witnessed an event, or proved a theorem, or ran an experiment in their own lab, can't use any of that as the basis for an article claim — first-hand knowledge is banned as a foundation, only testimony transmitted through vetted channels counts. Meanwhile there's a whole apparatus for ranking the channels: academic and peer-reviewed publications are usually the most reliable, then books from respected publishing houses, reputable newspapers, and so on, while outlets without editorial control or fact-checking structures get downgraded or excluded. And separately, when sources disagree, editors are told to present the disagreement while "giving each side its due weight" — majority views dominate the article, fringe views are described as fringe.

  Here's what's bugging me. On its face the whole edifice looks aggressively anti-reductionist: the encyclopedia treats certain channels of testimony as a basic source of justification it can rely on wholesale, without any individual editor having earned trust in those outlets through inductive track-record checking (nobody at Wikipedia has verified a journal's whole publication history, and the policy doesn't ask them to). But other parts look reductionist in spirit: ranking sources by type and demoting outlets with bad track records is exactly the induction-on-particulars that a reductionist says all testimonial trust must bottom out in.

  So, my question: what theory of testimony does this practice actually presuppose, if any? Is there a coherent implicit view here — maybe anti-reductionism relocated from the individual to the institution, where the entitlement lives at the level of the encyclopedia as a body rather than in any particular editor's justification? Or is the practice philosophically underdetermined, such that several positions in the reductionism/anti-reductionism debate would license it equally well? Please separate what the rules strictly require from what they merely sit comfortably with. And here's the stress test I keep coming back to: suppose the community decided to rewrite sourcing policy on strict reductionist grounds, requiring that every act of relying on a source be earned by track-record evidence available to the relying editor herself. Could the encyclopedia still function at all, or does the no-original-research rule make that literally incoherent — given that even checking "this journal published this paper" is something the checking editor knows only through further testimony?

  Also flag any internal tension I've missed. The one I half-see: verifiability is supposed to sever justification from truth (the community long repeated that the bar for inclusion is verifiability, not truth), but due weight seems to encode a prior on which views are actually right — you give the mainstream view most of the article, not just any view held by one prolific outlet. Does the practice need a notion of "where the sources stand" that's genuinely independent of "where the truth is," and does either the reductionist or the anti-reductionist have an easier time making sense of that separation?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Social Epistemology PhD student (dissertation on testimony). This means I need to speak their language (technical terms like reductionism, anti-reductionism, entitlement, justification, track-record, etc.) but also engage critically and precisely. No hand-holding on basics, but clarity on the specific application to Wikipedia.
      *   **Topic:** The implicit epistemology of Wikipedia's sourcing policies (Verifiability, No Original Research, Reliable Sources, Neutral Point of View/Due Weight).
      *   **Core Question:** What theory of testimony does Wikipedia's practice presuppose? Is it coherent? Is it institutional anti-reductionism? Is it underdetermined?
      *   **Specific Stress Test:** Could Wikipedia function on *strict* reductionist grounds (every reliance earned by individual track-record evidence)?
      *   **Specific Tension:** Verifiability (justification independent of truth) vs. Due Weight (encoding priors about truth/mainstream status).
      *   **Requirement:** Separate what rules *require* from what they *sit comfortably with*.

  2.  **Deconstruct the Wikipedia Policies (Epistemic Mapping):**
      *   *No Original Research (NOR):* Bans first-hand knowledge. Epistemically, this bans perception/memory/reasoning as direct justifiers for public claims. It mandates *testimonial* justification only.
      *   *Verifiability (V):* "Content is determined by published information." Justification is externalist (accessible citation) rather than internalist (editor's belief).
      *   *Reliable Sources (RS):* Hierarchy of sources (peer-reviewed > news > blogs). This implies a typology of trustworthiness.
      *   *Neutral Point of View (NPOV) / Due Weight:* Proportionality based on prevalence in reliable sources. This is a sociological metric, not necessarily a truth metric, though they correlate.

  3.  **Address the Reductionism vs. Anti-Reductionism Debate:**
      *   *Reductionism (Humean):* Trust must be earned via induction on the speaker's/source's reliability.
      *   *Anti-Reductionism (Reidian):* Trust is default/entitled unless there are defeaters.
      *   *Wikipedia's Stance:*
          *   *Individual Level:* Looks Anti-Reductionist. Editors don't check the track record of *Nature* every time they cite it. They accept the *status* of the source.
          *   *Institutional Level:* Looks Reductionist. The community *collectively* determines reliability based on track records (editorial control, fact-checking reputation).
          *   *Synthesis:* It's **Institutional Anti-Reductionism** (or Distributed Epistemology). The *individual* editor has an entitlement derived from the *institution's* reductionist work.

  4.  **Tackle the Stress Test (Strict Reductionism):**
      *   *Scenario:* Every editor must verify the track record of every source they cite.
      *   *Problem:* Infinite regress. To verify the journal published the paper, you need testimony (the journal's website). To verify the website, you need...
      *   *Conclusion:* Strict individual reductionism makes the project impossible. It collapses under the weight of transaction costs and the inevitability of relying on *some* testimony to verify testimony.
      *   *NOR Coherence:* NOR bans first-hand knowledge. If I can't use my eyes to verify the source exists (wait, I can see the PDF), but I can't use my reasoning to verify the *claims*... actually, the stress test highlights that *all* knowledge is testimonial eventually. Strict reductionism requires a foundationalism that Wikipedia explicitly rejects (NOR).

  5.  **Address the Verifiability vs. Truth Tension:**
      *   *Policy:* "We don't care if it's true, only if it's verifiable."
      *   *Practice:* Due Weight favors mainstream views.
      *   *Tension:* If truth and verifiability diverge (e.g., a true but unpublished discovery, or a false but widely published conspiracy), Wikipedia chooses verifiability.
      *   *Epistemic Status:* This is **Social Constructivism** regarding the encyclopedia's content, but **Realism** regarding the source landscape. It maps the *discourse*, not the *world*.
      *   *Reductionist/Anti-Reductionist Fit:* Anti-reductionists might struggle more here because they usually link testimony to truth-transmission. Reductionists might like it better because it treats sources as causal mechanisms to be tracked, regardless of truth. However, the "Due Weight" policy assumes a correlation between source prevalence and epistemic warrant, which leans towards a soft anti-reductionist entitlement (mainstream = entitled).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the observation (Wikipedia is a fascinating case study in social epistemology).
      *   *Section 1: The Implicit Theory.* Define it as **Institutional Testimonial Entitlement**. It shifts the locus of justification from the individual editor to the community/process.
      *   *Section 2: Reductionism vs. Anti-Reductionism.*
          *   Individual level: Anti-reductionist (default trust in RS).
          *   Community level: Reductionist (RS lists are built on track records).
          *   *Key Insight:* It solves the "regress problem" by outsourcing the reductionist work to the collective.
      *   *Section 3: The Stress Test.*
          *   Strict reductionism fails. Why? Transaction costs + Regress (verifying the verifier).
          *   NOR makes it incoherent because NOR bans the very first-hand verification reductionism might demand (e.g., "I checked the data myself").
      *   *Section 4: Verifiability vs. Truth.*
          *   This is the "Map vs. Territory" distinction. Wikipedia maps the *literature*, not the *world*.
          *   Due Weight is a proxy for truth but strictly defined as "prevalence in RS."
          *   Epistemic consequence: It creates a "consensus reality" artifact.
      *   *Section 5: Internal Tensions.*
          *   The "Fringe Science" problem (True but fringe vs. False but mainstream).
          *   The "Circularity" of RS (RS define notability, notability defines RS coverage).
      *   *Conclusion:* Summarize. It's a pragmatic hybrid.

  7.  **Refining the Philosophy:**
      *   Need to mention **Jennifer Lackey** or **Paul Faulkner**? Maybe **Alvin Goldman** (veritistic social epistemology)?
      *   Actually, **Hardwig's "Epistemic Dependence"** is crucial here. Wikipedia is the ultimate example of epistemic dependence.
      *   **Faulkner's "Testimony as Trust" vs. "Testimony as Reason"**: Wikipedia operationalizes Trust (institutional) to save Reason (individual).
      *   **Goldman's Reliabilism**: The RS policy is essentially a reliabilist heuristic.
      *   *Correction:* Keep it focused on Reductionism/Anti-Reductionism as requested, but bring in Hardwig for the "dependence" angle.

  8.  **Final Polish:**
      *   Ensure the tone is collegial (PhD to PhD).
      *   Check that I answered the specific "strictly require" vs. "comfortably sit" distinction.
      *   Make sure the stress test answer is decisive.

      *(Self-Correction during drafting)*: I need to be careful about the "Truth" claim. Wikipedia policy says "verifiability, not truth." But Due Weight *does* privilege views that are likely true (by scientific consensus). I need to explain how they square this. They square it by defining "truth" operationally as "consensus of reliable sources." This is a pragmatic move, not a metaphysical one.

      *(Refining the Stress Test)*: If an editor *had* to verify the track record... they would need to read past issues. But to know those issues are authentic, they need testimony. So strict reductionism is impossible *in principle* for a digital encyclopedia, not just in practice.

      *(Refining the Tension)*: The tension is between *Epistemic Responsibility* (Reductionism) and *Epistemic Efficiency* (Anti-Reductionism). Wikipedia chooses Efficiency at the individual level to achieve Responsibility at the collective level.

  9.  **Final Review against constraints:**
      *   Separate rules requiring vs. sitting comfortably.
      *   Address the stress test.
      *   Address the Verifiability/Truth tension.
      *   Maintain high philosophical register.

      *Let's write.*
answer: |-
  This is a fantastic case study. You have correctly identified that Wikipedia constitutes a massive, real-time experiment in social epistemology, specifically regarding the division of epistemic labor. Your diagnosis of the tension between individual anti-reductionism and institutional reductionism is sharp.

  Here is an analysis of the implicit epistemology of Wikipedia's sourcing policies, structured by your specific queries.

  ### 1. The Implicit Theory: Institutional Testimonial Entitlement

  To answer your core question: The practice presupposes a hybrid view best described as **Distributed Reliabilism with Institutional Entitlement.**

  It does not fit neatly into the individualist reductionism/anti-reductionism dichotomy because it shifts the *locus* of justification.
  *   **At the Individual Editor Level:** The policy is **Anti-Reductionist.** An editor is *entitled* to trust a source designated as "Reliable" (RS) without personally verifying that source's track record. The burden of proof is on the challenger to demonstrate unreliability (a defeater), not on the citer to demonstrate reliability (positive induction). This is necessary for scalability; if every editor had to inductively verify *The New York Times* before citing it, the project would halt.
  *   **At the Institutional/Community Level:** The policy is **Reductionist.** The designation of a source as "Reliable" is not arbitrary; it is the result of community consensus based on track records, editorial controls, and fact-checking reputations. The *community* performs the reductionist work so the *individual* does not have to.

  **Strict Requirement vs. Comfortable Fit:**
  *   **Strictly Required:** The rules *require* that justification be externalized (the citation) rather than internalized (the editor's knowledge). They require that the *source* carries the epistemic weight, not the speaker.
  *   **Comfortably Fits:** This sits comfortably with **Edward Craig's** functionalist account of knowledge (the "good informant") and **John Hardwig's** "Epistemic Dependence." Wikipedia operationalizes Hardwig's insight that in complex societies, we must trust the *structure* of expertise rather than the content of expertise. It also fits **Alvin Goldman's** veritistic social epistemology, provided one accepts the community's heuristics for reliability as truth-conducive.

  ### 2. The Stress Test: Strict Reductionism

  You ask: *Could the encyclopedia function if every act of relying on a source had to be earned by track-record evidence available to the relying editor herself?*

  **The Verdict:** No. It would be literally incoherent, not merely impractical.

  **Why?**
  1.  **The Regress of Testimony:** To verify a source's track record reductionistically, the editor must consult *evidence* of that track record (e.g., media bias charts, citation indices, past corrections). But accessing *that* evidence requires relying on *further* testimony. If strict reductionism applies to the primary source, it must apply to the meta-source verifying the primary source. This leads to an infinite regress unless the editor resorts to first-hand observation.
  2.  **The NOR Contradiction:** This is the critical point for your dissertation. The **No Original Research (NOR)** policy bans first-hand knowledge. If an editor cannot use their own perception or reasoning to validate a claim, they *must* rely on testimony. But if strict reductionism requires them to validate the testimony via induction, they need data. Gathering that data often requires first-hand investigation (reading past issues, analyzing statistical error rates). NOR forbids using that investigation as the *basis* for the claim, but strict reductionism *requires* that investigation as the *justification* for the trust.
      *   *Result:* A strict reductionist Wikipedia violates NOR (by requiring editors to do original research on source reliability) or violates Reductionism (by forcing them to trust without evidence).
  3.  **Transaction Costs:** Even setting aside the philosophical incoherence, the epistemic transaction costs would exceed the cognitive capacity of the volunteer workforce. The system relies on **epistemic free-riding** (in the positive sense) where most users ride on the verification work of a few.

  ### 3. The Verifiability vs. Truth Tension

  You identified a crucial friction: *Verifiability severs justification from truth, but Due Weight encodes a prior on truth.*

  **The Tension:**
  Wikipedia's official stance is **Instrumentalist/Pragmatist**: "We are not trying to determine the truth; we are trying to summarize the reliable literature."
  *   **Verifiability:** This is a **deontological** constraint on editors. It dictates the *process* of justification (cite a source) rather than the *truth conditions* of the proposition.
  *   **Due Weight:** This is a **consequentialist** heuristic. It assumes that the prevalence of a view in reliable sources correlates with its likelihood of being true (or at least, epistemically warranted).

  **Does the practice need a notion of "where the sources stand" independent of "where the truth is"?**
  Yes, and this is where the implicit epistemology gets tricky. Wikipedia treats **"Consensus of Reliable Sources"** as a proxy for **"Truth."**
  *   **The Reductionist Advantage:** A reductionist has an easier time here. They can say, "We are tracking the reliability of the *process* (publication), not the truth of the *content*." If the process is reliable, the content is likely true. If the process produces a falsehood (e.g., a retracted paper that hasn't been flagged yet), Wikipedia is epistemically blameless because it followed the reliable process.
  *   **The Anti-Reductionist Disadvantage:** An anti-reductionist usually argues that testimony transmits *knowledge* (which implies truth). If Wikipedia includes a verifiable falsehood (because it was published in a RS before retraction), the anti-reductionist has to explain how "justified belief" decouples from truth in this institutional context.

  **The Internal Tension You Missed: The Circularity of Notability**
  There is a deeper tension between **Verifiability** and **Notability**.
  *   To have an article, a topic must be "Notable."
  *   Notability is defined by "Significant coverage in Reliable Sources."
  *   But Reliable Sources are often determined by whether they cover "Notable" topics.
  *   *Epistemic Consequence:* This creates a **feedback loop** where the encyclopedia reinforces the existing media landscape's priorities. It privileges *published* reality over *actual* reality. If a significant historical event occurs but no RS covers it (e.g., a localized event in a media-blackout zone), it is epistemically non-existent for Wikipedia. This suggests the implicit theory is not just about testimony, but about **Social Constructivism**: Wikipedia documents *socially validated* knowledge, not knowledge *simpliciter*.

  ### 4. Synthesis: What Theory is This?

  If you need to label this for your dissertation, I suggest characterizing it as **Second-Order Institutional Reliabilism.**

  1.  **First-Order:** The sources (journals, papers) are the first-order belief-forming mechanisms.
  2.  **Second-Order:** The Wikipedia community is a second-order mechanism that evaluates the first-order mechanisms.
  3.  **Reliabilism:** The justification for a claim in Wikipedia is that it was produced by a process (citation of RS) that is generally truth-conducive.
  4.  **Institutional:** The reliability assessment is stored in the institution (policy pages, noticeboards), not the individual mind.

  **Resolution of the Reductionism/Anti-Reductionism Debate:**
  Wikipedia effectively dissolves the debate by **temporalizing** it.
  *   *Ex Ante (for the individual editor):* Anti-Reductionist. (Default trust).
  *   *Ex Post (for the community):* Reductionist. (Audit and consensus).

  **Final Verdict on the Stress Test:**
  If you rewrote the policy on strict reductionist grounds, Wikipedia would collapse. It would violate its own NOR policy (by forcing editors to investigate sources rather than report them) and succumb to skeptical regress. The current system works precisely because it **accepts testimonial entitlement at the individual level** to bypass the regress, while maintaining **reductionist oversight at the collective level** to maintain quality.

  It is a pragmatic solution to the problem of epistemic dependence, acknowledging that in a complex information environment, **trust is a necessary cognitive shortcut**, provided that the *object* of trust (the institution's source hierarchy) is subject to ongoing empirical scrutiny.
