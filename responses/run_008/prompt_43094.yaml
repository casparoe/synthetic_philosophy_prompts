answer: |-
  This is a profound narrative problem because it sits at the intersection of law, ethics, and metaphysics. Your lawyer friend is offering you a juridical shortcut to solve an existential crisis. He is treating the marriage as a contract that can be breached, whereas your narrator is experiencing it as a reality that has been retroactively erased.

  The maxim *fraus omnia corrumpit* ("fraud corrupts everything") is indeed a principle of equity, but like most maxims, it is a compression of several distinct logical claims. To pin this above your desk, you need to separate the legal mechanic from the moral ontology.

  Here are five distinct precise claims that the sentence "fraud vitiates consent" could be expressing, ranked from the trivial to the radical.

  ### 1. The Remedial Claim (The "Voidable" Reading)
  *   **The Claim:** Fraud does not mean consent never existed; it means the consent is *revocable*. The agreement stands until the victim chooses to undo it.
  *   **Plausibility:** High. This is the standard position of contract and family law in most common law jurisdictions (including 1950s America). A marriage obtained by fraud is typically *voidable* (requires an annulment decree), not *void ab initio* (as if it never happened).
  *   **Does it deliver the friend's conclusion?** **No.** It leaves the character as a woman who *was* married and is now seeking a dissolution, rather than a woman who was never married at all. It grants her agency (the choice to leave) but denies her the erasure of the past.

  ### 2. The Causal Claim (The "But-For" Reading)
  *   **The Claim:** Consent is defined by the outcome of the decision. If the truth would have changed the decision ("but for" the lie, I would not have said yes), the consent is invalid.
  *   **Plausibility:** Medium. Psychologically true, legally dangerous. If this were the standard, almost all commercial and romantic agreements would be unstable, as almost all decisions rely on incomplete information.
  *   **Does it deliver the friend's conclusion?** **Yes, but too broadly.** It validates her feeling of betrayal, but it creates the ethical problem you feared: if "but-for" fraud voids consent, then her own concealments (about her past, her feelings, her body) could theoretically void his consent too. It reduces marriage to a warranty of full disclosure.

  ### 3. The Essentialist Claim (The "Core Terms" Reading)
  *   **The Claim:** Consent is only vitiated if the fraud concerns the *essential nature* of the agreement, not merely the motivations for entering it.
  *   **Plausibility:** High. This is the standard legal distinction between "fraud in the execution" (I didn't know I was signing a marriage license) and "fraud in the inducement" (I signed because you lied about your wealth).
  *   **Does it deliver the friend's conclusion?** **Contingently.** It depends entirely on whether "procreation" is an essential term of marriage in 1958 New England. If marriage is defined as a union for the raising of children, his lie strikes at the essence. If marriage is defined as a union of lives, it is merely inducement. This reading forces you to define what marriage *is* in your book.

  ### 4. The Ontological Claim (The "Different Act" Reading)
  *   **The Claim:** The fraud was so fundamental that the act she consented to and the act that occurred were literally different things. She consented to *Motherhood-with-Doctor*; what occurred was *Childlessness-with-Doctor*. These are not the same event.
  *   **Plausibility:** Low in law, High in literature. Legally, the ceremony was the same. Ontologically, the life lived was different. This aligns with the philosophical concept of *fraud in the factum* (deception about the nature of the act itself).
  *   **Does it deliver the friend's conclusion?** **Yes.** This supports the idea that she is "never married" because the specific entity she married (a father-husband) never existed. It protects her from the ethical symmetry problem: she may have hidden things, but she did not promise a specific biological reality that was physically impossible for her to provide.

  ### 5. The Equitable Claim (The "Unclean Hands" Reading)
  *   **The Claim:** Fraud vitiates everything means the fraudster cannot *use* the consent against the victim. It does not mean the consent didn't happen; it means the fraudster loses the right to enforce it.
  *   **Plausibility:** High. This is the actual historical meaning of the maxim in equity courts. It prevents the liar from saying, "But you agreed!"
  *   **Does it deliver the friend's conclusion?** **No.** It protects her from him, but it does not rewrite history. It leaves her as a wife who is freed from the bonds of wifedom, not a woman who was never a wife.

  ***

  ### Drawing the Line: Factum vs. Inducement

  You suspect there is a line between deceptions that dissolve consent and deceptions that merely induce it. In law and ethics, this is the distinction between **Fraud in the Factum** and **Fraud in the Inducement**.

  *   **Fraud in the Inducement:** "I am wealthy," "I love you," "I want children." These are reasons to enter the contract. If false, the contract is regrettable, perhaps voidable, but the consent was real. You knew you were marrying *him*, you just thought he was a better version of him.
  *   **Fraud in the Factum:** "This is a medical procedure" (when it is sex), or "I am a man" (when she is not). This changes the *nature* of the act. You thought you were agreeing to X, but you actually agreed to Y.

  **Can this be drawn non-arbitrarily?**
  Yes, but only by defining the "essence" of the institution.
  In 1958, the "essence" of marriage was heavily tied to procreation and status. If the doctor's vasectomy makes him physically incapable of fulfilling the *definitional purpose* of the marriage as understood by the community and the parties, the argument for *Factum* is strong. He didn't just lie about a preference; he lied about a capacity that defines the role he asked her to fill (wife/mother).

  **The Ethical Symmetry Problem:**
  You ask if a reading strong enough to void her marriage would not also void ordinary courtship.
  *   **The Asymmetry of Impossibility:** There is a moral difference between concealing a past lover (a history) and concealing a vasectomy (a future impossibility). Her concealments likely regard *who she was*; his concealment regards *what he can do*.
  *   **The Specific Promise:** You note the promise of children was "explicit between them." Ordinary courtship involves general self-fashioning (wearing makeup, hiding nervousness). It does not usually involve an explicit contractual promise of a biological outcome that one party knows is impossible.
  *   **Conclusion on Symmetry:** You can draw the line here without hypocrisy. Her concealments are about *identity*; his concealment is about *capacity*. Voiding consent based on the destruction of capacity does not require voiding consent based on the polishing of identity.

  ***

  ### Closing Recommendations

  **1. Which reading do people who repeat the maxim most likely have in mind?**
  They usually mean a blend of **Claim 1 (Remedial)** and **Claim 5 (Equitable)**. They mean: *"You cannot hold her to this, and she should be freed from it."* They rarely mean the ontological Claim 4 (*"It literally never happened"*). Your lawyer friend is using poetic legalism to offer emotional validation. He wants her to feel the past is erased, but the law (and reality) usually only offers escape, not erasure.

  **2. Which reading should your ending turn on?**
  Do not turn the ending on the legal status of the marriage. If you end the book with a lawyer confirming she is "single," you validate the friend's plot device and diminish the tragedy. The tragedy is not that the marriage was illegal; it is that the *shared history* is now poisoned.

  Turn the ending on **Claim 4 (The Ontological Reading)**, but keep it internal to her.
  The question for your narrator should not be "Am I legally married?" but "Did I live the life I thought I was living?"
  *   If she accepts the friend's view (it was null), she dismisses the years they spent together as a fiction.
  *   If she rejects the friend's view (it was real), she must accept that she willingly built a life with a liar.

  **The Novelistic Verdict:**
  The maxim "fraud vitiates consent" is a shield for the victim, but a eraser for the past. For a novel, the past must remain real to have weight.
  Let the maxim be the *temptation* for her—the seductive idea that she can wake up single and unblemished. But let the resolution be the realization that **consent was real, but the object of the consent was a phantom.** She did marry him. She did say the vows. The tragedy is that the marriage was real, but the husband she knew was not.

  This preserves the ethical weight of her time (it wasn't nothing) while honoring the depth of the betrayal (the man she married didn't exist). It forces her to grieve not just the future she lost, but the past she can no longer trust. That is a heavier, more durable ending than a legal annulment.
