prompt: |-
  I'm a novelist, some two hundred pages into a book whose central marriage may never have validly begun. The setting is coastal New England in 1958: my narrator, a thirty-two-year-old woman just finished with a decade of nursing in a charity hospital, marries a widowed doctor who courts her with the promise, explicit between them, of children — and who, as I reveal late in the book, had a vasectomy years earlier, knew she would have refused him otherwise, and said nothing. When she finds out, the question that consumes her, and me, is whether her consent to the marriage was ever real: whether she agreed to marry him, or agreed to marry a man who did not exist. A lawyer friend of mine, reading the draft, dismissed the whole problem over a bottle of wine with the maxim that fraud vitiates everything — consent obtained through deception simply doesn't count, he said, so the marriage was a nullity from the start, and I should write her as a woman who was never married at all. He added, as a flourish, that in equity fraud unravels all. It was offered as a plot solution; it struck me as a plot device, and I would rather interrogate it than build an ending on it.

  What I'd like from you is a disambiguation rather than a verdict. Take the maxim my friend reached for — fraud vitiates consent, fraud vitiates everything — and lay out, as a numbered list I can pin above my desk, the distinct precise claims that one sentence could be expressing: the trivial readings, the substantive but defensible ones, and the radical ones. For each, say whether it is plausible, and — this is the part that matters to me — whether it actually delivers what my friend needs it to deliver, namely the conclusion that my character's consent was void. My own suspicion is that the maxim conceals a line between deceptions that dissolve consent (lies about what one is agreeing to: the nature of the act, its consequences) and deceptions that merely induce it (lies about the surrounding facts that made the choice attractive). I want to know where that line is customarily drawn, whether it can be drawn at all non-arbitrarily, and — since a novel is also an ethics — whether any reading strong enough to void her marriage would not equally void the ordinary self-fashioning of every courtship, hers included, for she has her own quiet concealments and I have not decided whether the book forgives them. If you can, close by saying which reading the people who repeat the maxim most likely have in mind, and which reading my ending should turn on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book set in coastal New England, 1958.
      *   **Plot:** A nurse marries a widowed doctor. He promised children; he had a vasectomy and hid it. She discovers this late.
      *   **Core Question:** Was her consent to the marriage real? Did she marry *him* or a *fiction*?
      *   **Friend's Advice:** "Fraud vitiates everything" (legal maxim). Therefore, the marriage is a nullity; she was never married.
      *   **User's Goal:** Not a verdict, but a *disambiguation* of the maxim "fraud vitiates consent/fraud vitiates everything."
      *   **Format:** A numbered list of distinct precise claims (trivial, substantive, radical).
      *   **Criteria for each claim:** Plausibility? Does it deliver the friend's conclusion (void consent)?
      *   **Specific Focus:** The line between fraud that dissolves consent (nature of the act) vs. fraud that induces it (surrounding facts). Can this be drawn non-arbitrarily?
      *   **Ethical Dimension:** If the reading is strong enough to void the marriage, does it also void ordinary courtship self-fashioning (including her own concealments)?
      *   **Closing:** Which reading do people *usually* mean? Which reading should the ending turn on?

  2.  **Deconstruct the Maxim ("Fraud Vitiates Consent"):**
      *   *Literal Meaning:* Deception makes agreement invalid.
      *   *Legal Context:* Contract law, Criminal law (sexual assault), Family law (annulment).
      *   *Philosophical Context:* Autonomy, agency, identity.
      *   *The "Friend's" Claim:* It's a total nullity. She is single.
      *   *The "Novelist's" Skepticism:* It feels like a plot device, not a truth. It ignores the nuance of human relationships.

  3.  **Drafting the Numbered List (Iterative Process):**

      *   *Claim 1: The Literal/Absolute Reading.* Fraud anywhere = No consent.
          *   *Plausibility:* Low. Life is full of small lies.
          *   *Delivers Friend's Conclusion:* Yes.
          *   *Problem:* Collapses all social interaction.

      *   *Claim 2: The "Essential Terms" Reading (Contract Law).* Fraud regarding the *core subject matter* voids consent.
          *   *Plausibility:* High in law.
          *   *Delivers Friend's Conclusion:* Maybe. Is children a core term of marriage in 1958?
          *   *Nuance:* Distinguishes between "what" and "why."

      *   *Claim 3: The "Identity/Nature of Act" Reading (Criminal/Sexual Ethics).* Fraud regarding *who* is acting or *what* is happening.
          *   *Plausibility:* High in sexual assault law (fraud in the factum vs. fraud in the inducement).
          *   *Delivers Friend's Conclusion:* Strongest case for "never married" in a moral sense.
          *   *Nuance:* Did she marry a doctor or a sterilized man? Is that a different person?

      *   *Claim 4: The "Causal But-For" Reading.* If she knew the truth, she wouldn't have said yes.
          *   *Plausibility:* High psychologically.
          *   *Delivers Friend's Conclusion:* No. This makes consent *regrettable*, not *void*.
          *   *Nuance:* Most fraud induces, doesn't nullify.

      *   *Claim 5: The "Equitable/Remedial" Reading.* Fraud allows the victim to *choose* to void it, but it isn't automatically void.
          *   *Plausibility:* High in law (voidable vs. void).
          *   *Delivers Friend's Conclusion:* No. It gives *her* the power, not the universe.

  4.  **Addressing the "Line" (Factum vs. Inducement):**
      *   This is the crux of the legal/philosophical distinction.
      *   *Fraud in the Factum:* Lying about the nature of the act itself (e.g., "this is a medical exam" vs. "this is sex"). Consent is void.
      *   *Fraud in the Inducement:* Lying about reasons to do the act (e.g., "I'm rich" vs. "I'm broke"). Consent is valid but actionable.
      *   *Application to the Novel:* Is the promise of children part of the *nature* of the marriage (factum) or a *reason* for it (inducement)? In 1958 New England, procreation was often seen as essential to marriage. This is fertile ground for the novel.

  5.  **Addressing the Ethical Symmetry (Her Concealments):**
      *   If the standard is "total transparency," everyone fails.
      *   If the standard is "essential identity," does her concealment matter?
      *   The novel needs to weigh *asymmetry of power/knowledge*. He knew he *couldn't* deliver. She might be hiding feelings or past, but not a physical impossibility regarding the central pact.

  6.  **Addressing the Closing Questions:**
      *   *What do people mean?* Usually a mix of "it makes it voidable" and "it's morally disgusting." They rarely mean "automatically void ab initio" in a social sense.
      *   *What should the ending turn on?* Not the legal status, but the *epistemological* status. She married a stranger. The tragedy isn't the legal nullity; it's the loss of the shared past's reality.

  7.  **Refining the Tone:**
      *   Needs to be respectful of the craft.
      *   Analytical but sensitive to the ethical weight.
      *   Avoid giving legal advice (disclaimer implicit in "novelist context").
      *   Focus on 1958 context (no-fault divorce didn't exist, annulment was hard).

  8.  **Review against Constraints:**
      *   Numbered list? Yes.
      *   Distinct precise claims? Yes.
      *   Plausibility + Delivers Conclusion? Yes.
      *   Discuss the Line (Factum vs. Inducement)? Yes.
      *   Discuss Ethical Symmetry? Yes.
      *   Closing recommendation? Yes.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to give actual legal advice for 1958 Maine/Massachusetts, but rather the *philosophical* underpinnings of the law. The friend is using a legal maxim as a moral shortcut.
      *   *Emphasis:* Highlight the difference between *void* (never happened) and *voidable* (can be undone). The friend says "nullity" (void). The law usually says "voidable." This is a key distinction for the character's agency.
      *   *1958 Context:* Remind the user that in 1958, marriage was often viewed as a status, not just a contract. This complicates the "contract law" analogy.

  10. **Final Polish:** Check the flow and ensure the "desk pin" quality is clear and actionable for a writer. (Proceed to generate output).

  *(Self-Correction Note on "Fraud Vitiates All"):* The phrase "Fraud vitiates all" is often associated with equity. In equity, it means you can't rely on a legal right obtained by fraud. It doesn't necessarily mean the contract *never existed*, but that the court won't enforce it. I need to make sure this distinction is clear in the list.

  *(Refining the "Line"):* The distinction between *fraud in the factum* (goes to the nature of the act) and *fraud in the inducement* (goes to the motive) is the standard legal tool here. I must explain this clearly.

  *(Refining the Ethical Symmetry):* The user asks if voiding the marriage voids all courtship. I need to address the "asymmetry of impossibility." Hiding a scar is different from hiding a sterilization when children are the explicit condition.

  *(Final Plan):*
  1. Intro acknowledging the depth of the question.
  2. The Numbered List (5 distinct claims).
  3. The "Line" (Factum vs. Inducement).
  4. The Ethical Symmetry (Her concealments).
  5. The Closing Recommendation (What people mean vs. What the book needs).
  6. Disclaimer (I am an AI, not a lawyer).

