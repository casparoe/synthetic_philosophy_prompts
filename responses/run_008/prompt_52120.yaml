      *   *Specific Point:* The user says, "The very first step, about Friday, seems to me beyond dispute." I need to challenge this gently. Is it? If the exam is on Friday, are you surprised? Yes, if you thought it was impossible. But the logic says it *is* impossible.
      *   *Better angle:* The error is in the transition from Step 1 to Step 2. Step 1 concludes "The Teacher's Statement is False." Step 2 assumes "The Teacher's Statement is True (enough to rule out Friday)." You can't have it both ways.
