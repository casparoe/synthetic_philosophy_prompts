answer: |-
  # The Nature of Human Nature: A Decision Tree
  **Philosophy Club Handout**

  **Starting Commitment:** We all agree that adults end up with moral commitments. The question is: *Where do these come from?*

  ---

  ### 1. The Case of the Child in the Well
  Imagine a stranger sees a child about to fall into a well. They feel a sudden shock of alarm and compassion.
  **Is this feeling a *moral seed* (a beginning of goodness), or merely a *physical reflex* (like flinching from fire)?**

  *   **A. It is a Moral Seed** → *Go to Question 2*
  *   **B. It is a Physical Reflex** → *Go to Question 3*

  ---

  ### 2. The Distribution of the Seed
  If this feeling is a moral seed, is it planted in **every** human at birth, or only in **some**?

  *   **A. In Every Human**
      *   *Position:* **Mencius (The Sprouts View)**
      *   *View:* Nature is good. We all have beginnings of virtue (sprouts) that require cultivation to mature.
  *   **B. Only in Some**
      *   *Position:* **The "Mixed" View (Reported by Mencius)**
      *   *View:* Some people are simply born good, and others born bad. Moral fate is fixed at birth.
  *   **C. In Every Human, but Needs No Cultivation**
      *   *Position:* **[EMPTY LOGICAL SPACE]**
      *   *Commitment:* Believing this means humans naturally converge on perfect virtue without society or teaching (a view no classical Confucian occupied).

  ---

  ### 3. The Case of the Untaught Infant
  If the well-response is just a reflex, imagine an infant left entirely alone in the wild until adulthood.
  **Do they grow up *selfish and chaotic*, or *morally indifferent and directionless*?**

  *   **A. Selfish and Chaotic** → *Go to Question 4*
  *   **B. Indifferent and Directionless**
      *   *Position:* **Gaozi (The Neutral View)**
      *   *View:* Nature is neither good nor bad, like water that can be channeled east or west. Morality is external guidance.
  *   **C. Virtuous and Orderly**
      *   *Position:* **[EMPTY LOGICAL SPACE]**
      *   *Commitment:* Believing this means isolation produces sages; society corrupts natural perfection (more Daoist than Confucian).

  ---

  ### 4. The Case of the Carpenter
  If nature is selfish/chaotic, consider a carpenter straightening warped wood.
  **Does moral training *transform* the person's character, or merely *control* their behavior?**

  *   **A. Transform the Character**
      *   *Position:* **Xunzi (The Rectification View)**
      *   *View:* Nature is disordered, but ritual and instruction can reshape the heart-mind to love the good.
  *   **B. Control the Behavior**
      *   *Position:* **The Legalist View (Han Fei / Li Si)**
      *   *View:* Nature cannot be truly changed; use laws and punishments to manage selfishness and maintain order.

  ---

  **⚠️ Note on Xunzi and the Legalists:**
  *This tree separates Xunzi from the Legalists at Question 4 based on the *purpose* of training (transformation vs. control). However, historically, this line is blurry: Xunzi taught Han Fei and Li Si. While Xunzi believed ritual could internally transform a person, his students concluded that only external laws could reliably control them.*
