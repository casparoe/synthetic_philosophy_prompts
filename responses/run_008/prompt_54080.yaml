answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in modern bioethics: the conflict between **clinical ethics** (fiduciary duty to the individual) and **public health ethics** (stewardship of the population).

  Most attendings will not be able to articulate the philosophical shift you are noticing because, clinically, it is taught as a pragmatic switch ("normal operations" vs. "crisis standards of care"). But philosophically, you are right: the moral mathematics change.

  Here is a reconstruction of the implicit theories, the rival views they exclude, an assessment of their consistency, and the counterfactuals you requested.

  ---

  ### 1. Ordinary Scarcity: The Non-Aggregative Claim
  **The Practice:** One ICU bed, two patients. We look at medical urgency, then perhaps time of arrival. We do *not* count dependents, social worth, or potential future years. If prognosis is identical, we often flip a coin or take the first arrival.

  **The Implicit Theory:**
  This practice presupposes a **Contractualist or Deontological theory of rescue claims.**
  Specifically, it aligns closely with **John Taurek's** argument in *"Should the Numbers Count?"* (1977). Taurek argued that there is no "super-loss" experienced by a group that outweighs the loss experienced by an individual. Loss is suffered only by individuals. Therefore, the claim of five people does not morally outweigh the claim of one; it is just five separate claims of equal weight to the one.

  In the ER, this manifests as a **Dyadic Fiduciary Model**. When you stand at the bedside, you are in a contract with *that* person. Your obligation is to act in *their* best interest. To look past them to count others is to treat them as a means to a collective end, violating a Kantian constraint against instrumentalization.

  **What This Rules Out:**
  *   **Strict Act Utilitarianism:** You cannot sacrifice the one to save the five (e.g., killing one patient for organs to save five others).
  *   **Social Worth Criteria:** You cannot save the father of three over the homeless man, because that aggregates the "value" of the dependents into the patient's claim.
  *   **Fair Innings/Quality of Life:** While prognosis matters, we generally do not deny a 90-year-old a bed to give it to a 20-year-old solely based on future years, unless the 90-year-old is medically futile.

  **The Nature of the Claim:**
  The claim to rescue is **agent-relative**. It arises from the specific relationship between physician and patient. It is non-transferable and non-aggregable.

  ---

  ### 2. Disaster Triage: The Aggregative Claim
  **The Practice:** Mass casualty. 25 patients, 4 staff. We tag the "expectant" (black tag) to die so resources can save the "delayed" (yellow) and "immediate" (red). We treat the walking wounded (green) quickly to clear the scene.

  **The Implicit Theory:**
  This practice presupposes a **Consequentialist or Utilitarian theory of rescue claims.**
  Here, the moral unit shifts from the *patient* to the *system*. The goal is no longer "do the best for this person" but "do the best for the population given constraints." This is classic Benthamite aggregation: the pain/death of the 'expectant' is outweighed by the survival of the many.

  This is often justified under **Crisis Standards of Care**, which implicitly adopt a **Rule Utilitarian** framework. The rule ("triage for greatest survival") is adopted because following it produces better outcomes than following bedside rules in this specific context.

  **What This Rules Out:**
  *   **Strict Egalitarianism:** You cannot give everyone an equal lottery chance if that results in more total deaths (e.g., wasting resources on the unsalvageable).
  *   **First-Come, First-Served:** This is explicitly rejected in disasters because it rewards proximity rather than need or survivability.
  *   **The Dyadic Fiduciary Model:** The physician explicitly abandons the role of pure advocate for the individual in front of them to become a steward of public resources.

  **The Nature of the Claim:**
  The claim to rescue is **agent-neutral**. It is assessed from a "view from nowhere" (or rather, the view of the Incident Commander). Claims are pooled, weighed, and traded.

  ---

  ### 3. Is the Switch Consistent?
  You asked if there is one consistent underlying view or an unacknowledged change mid-stream.

  **The Honest Answer:** It is largely an unacknowledged change in moral theory, rationalized by a **Threshold Deontology** that is philosophically shaky.

  **The Attempted Unification (Threshold Deontology):**
  Some ethicists argue for a unified view: *Rights (to individual care) are absolute up to a point, but once a catastrophe threshold is crossed, consequentialism takes over.*
  *   **The Problem:** As you noted, the threshold is "fuzzy." Is it 2 patients? 10? 50? When the ICU is 99% full vs. 100% full? If the moral logic flips based on a arbitrary number of patients, it suggests the principle isn't robust. It looks less like a moral truth and more like "we follow deontology when we can afford to, and utilitarianism when we can't."

  **The Institutional Role Defense:**
  A stronger defense is that the *physician's role* changes.
  *   **Normal:** You are a **Fiduciary**. Your license obligates you to the patient.
  *   **Disaster:** You are a **State Agent**. By activating disaster protocols, the hospital effectively nationalizes your labor. You are no longer a private fiduciary but a public utility.
  *   **The Flaw:** This doesn't solve the moral problem; it just displaces it. It admits that the *system* requires utilitarianism, but it protects the *individual doctor* from the guilt of violating their oath by saying "you aren't acting as a doctor right now, you're acting as a triage officer."

  **Underdetermination:**
  You are right that many theories license the everyday practice.
  *   A **Rawlsian** would support the ordinary lottery (veil of ignorance).
  *   A **Kantian** would support it (respect for persons).
  *   A **Rule Utilitarian** might even support it (arguing that a policy of "never counting numbers" builds trust, which saves more lives long-term).
  *   *However*, the disaster scenario breaks the Rule Utilitarian cover. In a disaster, we admit that long-term trust is secondary to immediate survival counts.

  **Verdict:** The switch is a pragmatic compromise. It is morally inconsistent, but perhaps *administratively* necessary. We pretend it is consistent to avoid moral distress.

  ---

  ### 4. Counterfactuals: Taking the Views Seriously

  To see the friction, let's apply the logic of one half to the other.

  **Scenario A: Taking the "Counting" (Utilitarian) View Seriously in the Ordinary ER**
  If we applied disaster logic to the Tuesday night shift:
  *   **The Practice:** You have one ventilator. Patient A is 85 with COPD (low QALYs, no dependents). Patient B is 25 with asthma (high QALYs, two young children).
  *   **The Change:** You *must* calculate the "social value." You interview families about dependents. You calculate projected life-years. You might deny the 85-year-old not because they are futile, but because the 25-year-old offers a better "return on investment."
  *   **The Consequence:** **Erosion of Trust.** If the public believes the ER calculates social worth, marginalized groups (elderly, disabled, homeless) will fear seeking care. The "duty to treat" collapses. The ER becomes an insurance adjuster.
  *   **Philosophical Cost:** It violates the **Separateness of Persons**. It treats the 85-year-old as a vessel of resources rather than an end in themselves.

  **Scenario B: Taking the "Non-Counting" (Taurekian) View Seriously in Disaster**
  If we applied ordinary logic to the bus crash:
  *   **The Practice:** 25 patients, 4 staff. One patient is crushed and unsalvageable (Expectant). Five are salvageable but need immediate intervention.
  *   **The Change:** You cannot "write off" the crushed patient. They have a claim equal to the others. You must spend resources attempting to save them, or flip a coin between the crushed patient and the five salvageable ones.
  *   **The Consequence:** **System Collapse.** By refusing to aggregate, you ensure more total deaths. The five salvageable die while you futilely treat the one unsalvageable.
  *   **Philosophical Cost:** It violates **Beneficence to the Populace**. It privileges the *procedure* of fairness over the *outcome* of survival. It is morally clean for the doctor (I didn't choose who died), but disastrous for the patients.

  ### Summary for your Rotation
  You have spotted that Emergency Medicine operates on two distinct moral operating systems.
  1.  **Standard of Care:** Deontological/Fiduciary. (The patient is the end).
  2.  **Crisis Standards:** Consequentialist/Stewardship. (The population is the end).

  The "fuzzy threshold" bugs you because it *should*. It is the point where the hospital admits it can no longer afford the luxury of individual rights. When you hear attendings switch languages, they are signaling that the institution has moved from a **Rights-Based Framework** to a **Resource-Management Framework**.

  If you want to press this in rounds (carefully), ask: *"At exactly what occupancy rate does the claim of the individual patient become subordinate to the aggregate? Is it a moral shift or a logistical one?"* Watch how quickly the room gets quiet. That silence is the sound of the unacknowledged switch.
