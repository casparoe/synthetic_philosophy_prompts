  7.  **Final Polish:** Ensure the distinction between *fiduciary duty* (individual) and *stewardship* (population) is clear, as this is the practical bridge med students are often taught, even if philosophically shaky. (Proceed to generate output based on these thoughts.)

  8.  *(Self-Correction on Taurek)*: Taurek argues we *may* flip a coin, not necessarily that we *must*. But the medical practice often defaults to "sickest first" or "first come," which is slightly different from Taurek's pure lottery. I should clarify that the medical practice is a hybrid of "need" + "equality of opportunity," which aligns *spiritually* with Taurek's rejection of aggregation.

  9.  *(Final thought on the "Switch")*: The most honest answer is that the switch is pragmatic. Philosophy tries to rationalize it after the fact. I should emphasize this "underdetermination."

  10. **Structure:**
      1.  Introduction: Validating the observation.
      2.  The Ordinary Ward: The Non-Aggregative Claim (Taurek/Contractualism).
      3.  The Disaster Zone: The Aggregative Claim (Utilitarianism/Stewardship).
