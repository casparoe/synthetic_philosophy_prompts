answer: |-
  # JOINT STATEMENT ON THE CONDITIONAL ANALYSIS OF DISPOSITIONS

  **Date:** October 26, 2023
  **Signatories:** 
  *   **The Conditionalist** (Defender of the Simple Conditional Analysis)
  *   **The Causal Realist** (Opponent armed with Finkish and Masking cases)

  **Context:** This document summarizes the outcomes of a good-faith adversarial collaboration regarding the thesis that a disposition $D$ (e.g., fragility) is analytically equivalent to a counterfactual conditional $C$ (e.g., "if struck, it would break").

  ---

  ### I. AGREED CLAIMS

  We, the undersigned, affirm the following claims as common ground established during our collaboration:

  1.  **Adequacy Conditions:** Any adequate account of dispositions must explain the predictive utility of disposition ascriptions. Specifically, it must account for why attributing fragility to a glass licenses the expectation that it will break upon being struck in standard circumstances.
  2.  **Direction of Explanation:** In standard cases (absent finks, masks, or sorcerers), the possession of the disposition is what grounds the truth of the corresponding counterfactual. We agree that the counterfactual does not ground the disposition in a metaphysical sense; rather, the disposition (or its categorical base) makes the counterfactual true. The disagreement lies in whether the counterfactual *constitutes the meaning* of the disposition term.
  3.  **Status of Counterexamples:** We agree that finkish cases (e.g., Martin's Sorcerer) and masking cases (e.g., packing foam) are not merely pragmatic infelicities or performance errors. They present genuine theoretical data that any analysis must accommodate. They are not "scope conditions" in the sense of being irrelevant outliers; they reveal the structural relationship between intrinsic properties, extrinsic conditions, and manifestation.
  4.  **The Role of Intrinsic Bases:** We agree that dispositions are typically associated with intrinsic categorical bases (e.g., the molecular structure of the glass). An account that severs the link between the disposition and the intrinsic nature of the object is untenable.
  5.  **Rejection of Strict Simple Equivalence:** We agree that the *unqualified* Simple Conditional Analysis ($Dx \iff Sx \square\rightarrow Mx$) is vulnerable to counterexample. The disagreement is not about the existence of the vulnerability, but about whether the vulnerability is fatal to the *project* of conditional analysis or merely requires a refinement of the antecedent conditions.

  ---

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines the specific points where our positions remain irreconcilable. Each statement is phrased such that the holding side accepts the wording as an accurate representation of their view.

  | Issue | The Conditionalist's Position | The Causal Realist's Position |
  | :--- | :--- | :--- |
  | **1. Lewis-Style Emendations** | Emendations that appeal to what "intrinsic duplicates in fink-free surroundings would do" are **principled repairs**. They clarify that disposition ascriptions implicitly quantify over normal conditions and intrinsic bases, preserving the core insight of the conditional analysis. | Emendations that appeal to "intrinsic duplicates in fink-free surroundings" are **ad hoc buttressing**. They abandon the actual object's counterfactuals in favor of a similarity relation that does the real metaphysical work, effectively conceding that the conditional analysis itself is false. |
  | **2. The Implication of Masks** | Masking cases show the analysis must be **qualified**. The conditional analysis holds *ceteris paribus*; masks are simply violations of the *ceteris paribus* clause, similar to how exceptions in laws of nature do not refute the laws. | Masking cases show the analysis is **false**. If a glass is fragile but would not break if struck (due to a mask), the biconditional fails. A false biconditional cannot be saved by implicit clauses that are not specified in the analysis. |
  | **3. Metaphysical Priority** | The counterfactual conditional is **conceptually prior**. To understand what "fragile" means is to understand what would happen to the object under certain conditions. The intrinsic base is evidence for the disposition, not the disposition itself. | The intrinsic categorical base is **ontologically prior**. The disposition *is* (or is supervenient upon) the intrinsic base. The counterfactual is a symptom of the disposition, not its definition. |

  ---

  ### III. CRUXES AND TEST CASES

  We identify the following cruxes as the primary drivers of our disagreement. For each crux, we have selected a concrete case and recorded our predictions in advance.

  #### Crux 1: The Structural Unity of Counterexamples
  **The Question:** Do finks, masks, antidotes, and reverse finks share a common metaphysical structure (showing a deep flaw in linking dispositions to conditionals), or are they merely analogous phenomena requiring distinct treatments?

  *   **The Conditionalist's View:** They are distinct. Finks involve a change in the intrinsic base *during* the stimulus. Masks involve an extrinsic blocker *during* the process. Reverse finks involve an extrinsic enhancer. Each requires a specific tweak to the antecedent of the conditional (e.g., "if struck and no sorcerer intervenes").
  *   **The Causal Realist's View:** They share a common structure. They all demonstrate that the link between the stimulus and the manifestation is contingent and interruptible, whereas the disposition itself is a stable property. They collectively prove that the conditional tracks the *manifestation conditions*, not the *disposition itself*.

  **Test Case: The "Self-Preempting Bomb"**
  *   **Description:** A bomb is wired to explode if a signal is received. However, it is also wired with a "finkish" circuit that detects the signal and instantly severs the connection to the explosive charge before the spark can occur. The bomb is intrinsically explosive (it contains all necessary chemical components), but it would not explode if signaled.
  *   **Advance Predictions:**
      *   **The Conditionalist:** Predicts that the statement "This bomb is disposed to explode if signaled" is **false** (or requires heavy qualification). The conditional analysis correctly identifies that, given the fink, the disposition is not present *relative to that stimulus context*. The "disposition" is not a stable intrinsic property but a relation to the environment.
      *   **The Causal Realist:** Predicts that the statement "This bomb is disposed to explode if signaled" is **true**. The bomb possesses the intrinsic power (the chemical potential); the fink merely prevents its exercise. The failure of the conditional ("if signaled, it would explode") proves the conditional analysis is false, not that the disposition is absent.

  #### Crux 2: The Reverse Fink (The Sorcerer's Gift)
  **The Question:** Can an object possess a counterfactual property without the disposition, thereby breaking the left-to-right direction of the biconditional?

  *   **The Conditionalist's View:** If an object would break if struck, it is correct to call it fragile in that context, even if the fragility is extrinsic or temporary. Our ordinary language is flexible enough to accommodate extrinsic dispositions.
  *   **The Causal Realist's View:** Fragility must be intrinsic. If a sorcerer makes an iron bar breakable only the instant it is struck (when it is normally rigid), the bar is not fragile. The conditional analysis falsely ascribes the disposition.

  **Test Case: The "Rigid Glass Sorcerer"**
  *   **Description:** An iron bar is intrinsically rigid. A sorcerer monitors the bar. The instant the bar is struck, the sorcerer casts a spell that temporarily removes the bar's rigidity, causing it to shatter like glass. Afterward, the bar returns to being iron.
  *   **Advance Predictions:**
      *   **The Conditionalist:** Predicts that "The bar is fragile" is **true** (in the context of the strike). The analysis $Dx \iff (Sx \square\rightarrow Mx)$ holds because the counterfactual is true. The intuition that it isn't fragile is a bias toward intrinsic bases, but the functional definition of fragility is met.
      *   **The Causal Realist:** Predicts that "The bar is fragile" is **false**. The bar lacks the intrinsic categorical base for fragility. The conditional analysis yields a false positive, proving it is insufficient for defining dispositions.

  ---

  ### IV. DIAGNOSIS OF VERBAL DISPUTE

  We conclude that a portion of our dispute is **verbal**, specifically concerning the semantic aim of the word "analysis."

  1.  **The Source:** The Conditionalist treats "analysis" as a **conceptual explication**. Their goal is to capture the truth conditions of ordinary disposition ascriptions, which may be context-sensitive and implicitly qualified. The Causal Realist treats "analysis" as a **metaphysical reduction**. Their goal is to identify the mind-independent property that *makes* the ascription true.
  2.  **Why it is Verbal:** When the Conditionalist says "The analysis holds," they often mean "The biconditional can be saved by refining the context of utterance." When the Causal Realist says "The analysis fails," they mean "The biconditional does not track the mind-independent property across all possible worlds."
  3.  **Resolution:** We agree that if the project is **conceptual**, the Conditionalist has the stronger case (ordinary language is flexible). If the project is **metaphysical**, the Causal Realist has the stronger case (properties must be stable across finkish interventions). We disagree on which project is the primary philosophical task when discussing dispositions.

  ***

  **Signed,**

  *The Conditionalist*  
  *The Causal Realist*
