answer: |-
  Here are ten interview questions designed to engage your guest's thesis at the level of rigor it demands, adhering to your constraints and rationalist framing.

  ### 1. The Sidgwickian Connection
  **Question:** Henry Sidgwick famously identified a "dualism of practical reason": the apparent conflict between rational egoism (what is best for me) and rational benevolence (what is best for the aggregate). He hoped that empirical evidence for divine sanctions or survival of death might reconcile these by aligning self-interest with the general good. You argue that psychical research is an extension of this project. But if psi phenomena are as elusive and statistically fragile as the current literature suggests, can they actually bear the weight of an ethical system? If the "sanctions" are only visible in p-values just under 0.05, how does that resolve the dualism for a living agent any better than secular uncertainty does?

  *   **Anticipated Reply:** He will likely argue that the *possibility* changes the expected value calculation, even if the evidence isn't conclusive, or that the cumulative weight is stronger than it appears.
  *   **Follow-up:** "So you are relying on a decision-theoretic argument rather than a purely evidential one? If so, aren't you vulnerable to a version of Pascal's Wager: if we lower the evidential bar because the *stakes* of survival are infinite, doesn't that invite us to accept any hypothesis with high stakes and low evidence, potentially diverting moral attention from tangible, provable suffering?"

  ### 2. The Replication Crisis and Bem
  **Question:** Daryl Bem's 2011 paper on precognition was a catalyst for the modern replication crisis in psychology. The mainstream response was that methods like optional stopping, flexible analysis, and publication bias created false positives. You rely on a literature that spans from Victorian seances to modern ganzfeld experiments. Do you concede that the methodological critiques leveled at Bem apply with equal or greater force to the historical parapsychology record? If you argue they are exempt, is that because the effect sizes are larger, or because the field has self-corrected in ways mainstream psychology has not?

  *   **Anticipated Reply:** He will likely concede some historical flaws but argue that meta-analyses of modern, pre-registered studies still show significant effects, suggesting the signal is real despite the noise.
  *   **Follow-up:** "If we grant that meta-analysis can rescue a signal from noisy data, how do you account for the 'decline effect' often seen in psi research, where effect sizes shrink as methodological rigor increases? In other fields, increased rigor stabilizes the effect; in psi, it often seems to attenuate it. Is that an artifact of the 'experimenter effect,' or a sign that the signal is methodological rather than ontological?"

  ### 3. The Bayesian Challenge
  **Question:** Let's look at this through a Bayesian lens. A well-calibrated prior for psi or survival of consciousness, given our current understanding of physics and neuroscience, is extraordinarily low. Furthermore, the historical base rate of fraud and self-deception in this specific literature—from Victorian mediums to Soviet psychics—is notoriously high. To move a rational agent from a prior of near-zero to a credence high enough to alter ethical behavior, you need a massive likelihood ratio. Do you believe the surviving evidence, stripped of anecdote and unreplicated studies, actually generates a likelihood ratio sufficient to overcome that specific prior, or are you arguing we should adjust the prior itself?

  *   **Anticipated Reply:** He will likely argue that the prior shouldn't be that low because "consciousness is fundamental" and physics is incomplete, meaning the evidence doesn't have to work as hard to shift the needle.
  *   **Follow-up:** "That sounds like a philosophical claim masquerading as an empirical prior. If we treat 'consciousness is fundamental' as a hypothesis rather than an axiom, it also requires evidence. Are you essentially asking us to accept a metaphysical premise to lower the evidential bar for the physical claims, and doesn't that risk circularity: we believe the physics because of the metaphysics, and the metaphysics because of the physics?"

  ### 4. Falsification and the "Shy" Phenomenon
  **Question:** One of the recurring defenses in parapsychology is that psi is "elusive" or "shy"—that it doesn't appear on demand or under hostile scrutiny. While this might explain null results, it makes the hypothesis difficult to falsify. What specific pattern of findings over the next two decades would you regard as strong evidence *against* the reality of psi or survival? If the answer is that null results are always explainable by 'experimenter attitude' or 'lack of rapport,' what distinguishes your position from an unfalsifiable one?

  *   **Anticipated Reply:** He will likely propose that if strictly pre-registered, multi-lab collaborations with skeptical investigators consistently yielded null results, that would count against it.
  *   **Follow-up:** "We've had over a century of SPR investigation. If the phenomenon is real and ethically urgent, why has it not stabilized into a reliable technology or observational science in that timeframe? In medicine or physics, a century is enough to move from 'curious anomaly' to 'engineerable effect.' What is the bottleneck here: the nature of the phenomenon, or the nature of the community studying it?"

  ### 5. The Ethical Urgency Argument
  **Question:** You contend that if consciousness survives death, our moral obligations extend beyond the grave. This creates an 'ethical urgency' to investigate. However, rationalists often warn against 'motivated stopping'—searching for evidence until you find what you need to justify a desired conclusion. How do you ensure that the ethical urgency you feel doesn't subtly bias the interpretation of ambiguous data? Is there a risk that the desire for a certain moral ontology is driving the epistemology?

  *   **Anticipated Reply:** He will likely distinguish between the *context of discovery* (where motivation helps) and the *context of justification* (where rigor rules), claiming he adheres to strict standards in the latter.
  *   **Follow-up:** "In practice, though, the selection of which experiments to fund and which anomalies to pursue happens in the context of discovery. If the field systematically prioritizes positive anomalies over negative replications because of this 'urgency,' the literature itself becomes skewed. How do we audit the file drawer of the SPR itself, not just the mainstream psychology file drawer?"

  ### 6. Conservation and Physics
  **Question:** Mainstream skepticism often rests on conservation laws—conservation of energy, conservation of information. For a disembodied mind to interact with the living, or for precognition to occur, information or energy must traverse boundaries current physics says are sealed. Are you proposing that psi operates *within* known physics (perhaps via quantum loopholes), or are you arguing for new physics? If the latter, why should we look for it in parapsychology labs rather than particle colliders?

  *   **Anticipated Reply:** He will likely suggest that current physics describes matter/energy but not information/consciousness, and that psi points to a 'law of conservation of information' that we haven't formalized yet.
  *   **Follow-up:** "If information is conserved but can be accessed non-locally (as in precognition), that implies a block universe or determinism that creates its own ethical problems regarding free will. Does your utilitarian calculus account for the possibility that validating psi might require validating a deterministic universe where 'moral choice' is an illusion?"

  ### 7. Institutional Stagnation
  **Question:** The Society for Psychical Research was founded in 1882. In the 140 years since, mainstream science has moved from germ theory to genomics, and from Newtonian mechanics to the Standard Model. What is the cumulative knowledge gain of psychical research in that same period? If the thesis is that the evidence is robust, why has the field failed to produce a consensus model or a predictive theory that commands assent outside its own borders?

  *   **Anticipated Reply:** He will argue that the subject matter (consciousness) is inherently harder than matter, and that sociological stigma has suppressed talent and funding.
  *   **Follow-up:** "Stigma is a real factor, but it doesn't explain why internal consensus is also fragile. If the data were as probative as you suggest, shouldn't the parapsychology community itself have a unified theory by now, regardless of external stigma? What is the dominant competing theory within your field, and how do you adjudicate between them?"

  ### 8. The "File Drawer" of the SPR
  **Question:** You mentioned the file drawer problem in mainstream science. The SPR and similar organizations have their own archives, much of which is unpublished or only available to members. Given the history of selective reporting in this field, would you support a full, open-data initiative where all raw data from SPR-funded projects over the last 50 years is made available for independent re-analysis by skeptics?

  *   **Anticipated Reply:** He will likely say yes in principle, but note that older data may not be digitized or may lack the metadata required for modern re-analysis.
  *   **Follow-up:** "Let's focus on the last 20 years then. If the data exists in digital form, what is the barrier to releasing it? If the field is confident in its integrity, opening the black box should increase credibility. Is the hesitation due to privacy concerns, or a fear that re-analysis using stricter criteria would eliminate the significant effects?"

  ### 9. Disembodied Minds vs. Super-ESP
  **Question:** In the literature on survival, there is a competing hypothesis often called 'Super-ESP' or the 'Living Agent Psi' hypothesis: that the data attributed to the dead could actually be telepathy among the living. How do you distinguish between evidence for *survival* (which changes your utilitarian calculus regarding the dead) and evidence for *telepathy* (which changes physics but leaves the dead dead)? Does your guest's thesis collapse if the Super-ESP hypothesis is true?

  *   **Anticipated Reply:** He will likely argue that certain cases (e.g., unlearned knowledge, specific identification) rule out Super-ESP, or that both imply a non-local consciousness which is the ethically relevant factor.
  *   **Follow-up:** "If the ethically relevant factor is just 'non-local consciousness,' does it matter whether the source is a dead person or a living brain accessing a universal field? If it's the latter, then death is still the end of the *individual* welfare subject, which undermines the specific Sidgwickian hope for personal post-mortem sanctions."

  ### 10. The Rationalist Takeaway
  **Question:** Finally, for the rationalist community listening: you argue that ignoring psi is an epistemic error with ethical costs. But rationalists also worry about 'crackpotism' and the opportunity cost of investigating low-probability claims. What is the specific, actionable update you want a rationalist to make today? Should they donate to parapsychology labs, incorporate survival probabilities into their effective altruism calculations, or simply maintain a 'suspended judgment' that is more open than the mainstream?

  *   **Anticipated Reply:** He will likely ask for 'suspended judgment' that is more open, and perhaps funding for high-rigor replication studies.
  *   **Follow-up:** "If the recommendation is just 'more open suspended judgment,' isn't that the default position of most sophisticated skeptics? Where is the line where 'openness' becomes 'credulity'? If a rationalist looks at the same data you do and assigns a probability of <1%, are they making a mathematical error, or just weighing the priors differently, and how do we settle that disagreement without appealing to authority?"
