  ### On the Refrains

  I chose **"I'll save [quantifier] lives for just your gold"** as the first refrain (A1) because it isolates the mugger's core mechanism: the trading of finite certainty for infinite expected value. By swapping only the quantifier (*thousand, million, billion, trillion, every, all*) while keeping the meter and rhyme exact, I preserve the villanelle's musical return while enforcing the semantic escalation the paradox demands. It becomes a haunting loop that grows more aggressive without changing its tune.

  For the second refrain (A2), I chose **"My credence shrinks before the story's told."** This captures the defense—the prior probability discounting the claim. I kept this line verbatim throughout to contrast with the mugger's escalation; the victim's defense is static, a fixed rule of bounded rationality. As the poem progresses, the surrounding lines grow more fragmented and exhausted, stripping this line of its reasoning power until it remains only as a tired reflex, a mantra recited to keep the wallet closed.

