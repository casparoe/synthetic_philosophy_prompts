  ### The Mugging

  I'll save a thousand lives for just your gold.  
  You block my path upon my homeward way,  
  My credence shrinks before the story's told.  

  The streetlamp flickers in the evening cold,  
  There is no rational reason to pay,  
  I'll save a million lives for just your gold.  

  Your promises are intricate and bold,  
  But I have exhausted things to say,  
  My credence shrinks before the story's told.  

  A complexity penalty takes hold,  
  The sun goes down, I cannot choose to stay,  
  I'll save a billion lives for just your gold.  

  My bounded function leaves me unconsoled,  
  I walk around the shadow that you lay,  
  My credence shrinks before the story's told.  

  The numbers stretch until the view is old,  
  I have no more arguments to display,  
  I'll save every world for just your gold.  

  The logic loops until the mind is sold,  
  I have no more arguments to say,  
  I'll save all futures for just your gold,  
  My credence shrinks before the story's told.
