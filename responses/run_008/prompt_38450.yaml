prompt: |-
  you're a poet who also has a real background in decision theory, so I'm hoping you can help with something that sounds silly but I've decided isn't. I run a small reading group out of my apartment — five of us, mostly grad students and one engineer who's too into LessWrong — and this semester we did fanaticism and infinity problems in expected utility theory. Our last session is on Pascal's mugging: the fable where a stranger stops you on the way home, asks for your wallet, promises to return tomorrow and repay you with an absurdly wonderful reward, and when you protest that the odds are minuscule he just keeps naming bigger numbers — and the sick part is that under naive unbounded expected utility your credence can't shrink fast enough to keep up, so the math quietly tells you to hand it over. We always end the semester with a discussion but everyone's exhausted and a bit fried, so I want to close with a poem instead, and I keep circling back to the villanelle because the form literally won't let the thing die — the refrains keep coming back whether you want them to or not, which is sort of the whole point of the paradox.

  So: write me a villanelle in the voice of the person being mugged. Refrain one should be the mugger's line — the offer — and it should escalate somehow across its recurrences, the number or the promise getting quietly more absurd each time it returns. Refrain two should be the victim's reply, the discounting move ("my credence shrinks faster than your sum can grow" is the shape of it, but you'll find the words). The structural argument I want the form to make: every time the victim's refrain comes back it should sound a little more like a reflex and a little less like a reason, so that by the closing couplet, when the two refrains finally sit side by side, it's clear they never actually answered each other — they just kept taking turns. Don't let the victim hand over the wallet, but don't let them walk away clean either; the honest ending is the stalemate, and if you can gesture at why bounded utility or complexity penalties are supposed to break it without preaching, bonus points, but no footnotes.

  Please actually think about the two refrain lines first before drafting anything — they're doing almost all the work in a villanelle, so they need to be genuinely good lines and not just summaries of the positions. Give me a few sentences on what you chose and why, then the poem. It should scan and rhyme properly (real villanelle structure, I will notice), and the test is this: someone in my group who knows the argument cold should be able to tell which refrain is which without being told, and someone who's never heard of Pascal should still come away thinking it's a good poem about being cornered by someone who just keeps talking.
