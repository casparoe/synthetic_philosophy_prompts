      *   **User:** Senior engineer at a ~40 person startup.
      *   **Problem:** Team frequently adopts beliefs without sufficient evidence (unverified auth library, founder's optimism about deals, ignoring competitor threats). Decisions are currently made by "vibes and seniority".
      *   **Goal:** A practical decision procedure (operating procedure) to evaluate when it's acceptable to believe/act without full evidence.
      *   **Constraints:**
          1.  No formatting whatsoever (no bullet points, no headings, no bold, no tables). Continuous prose like a long email.
          2.  Distinguish between settled consensus and ongoing philosophical debate (don't pick a side falsely).
          3.  British English spelling (e.g., colour, programme, analyse).
          4.  Must run the procedure on the three specific cases provided (auth library, enterprise deal, competitor feature).
          5.  At least one case must yield an uncomfortable/unliked answer (embarrass the user).
          6.  Address the "belief influences outcome" distinction (self-fulfilling prophecy vs. delusion).
          7.  Address the "cannot choose to believe" problem (pretending vs. believing).
          8.  Stakes threshold: High stakes -> Founders, Lower stakes -> User (Senior Engineer).
          9.  Time limit: Procedure should be runnable in ~10 minutes.
          10. Tone: Practical, direct, no philosophy lecture but acknowledge the Clifford vs. James debate context.

  2.  **Deconstruct the Philosophical Context (Clifford vs. James):**
      *   W.K. Clifford: "The Ethics of Belief" - It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence. (Evidentialism).
      *   William James: "The Will to Believe" - Sometimes we have a "genuine option" that is living, forced, and momentous. In these cases, waiting for evidence might mean losing the opportunity. Belief can help create the fact. (Pragmatism/Voluntarism).
      *   Consensus: There is no consensus. Evidentialists still argue against pragmatic justification for belief. Pragmatists argue evidence isn't always available beforehand. I need to state this clearly.

  3.  **Drafting the Procedure (Mental Outline):**
