answer: |-
  You have identified one of the most persistent and structurally significant puzzles in democratic theory. While the general issue is widely discussed under the header of the **"Boundary Problem,"** the specific logical mechanism you are describing—the infinite expansion caused by applying the inclusion criterion to itself—does not have a single, canonical noun phrase (like "Gödel's Theorem" or "The Prisoner's Dilemma") in the literature. It is typically described descriptively as "the regress of the all-affected principle" or "the circularity of democratic justification."

  To give you the precision you are looking for, I will coin a specific conceptual term for this phenomenon, define its mechanics, distinguish it from related concepts, and analyze the possibilities for stopping it.

  ### The Coined Concept: The Second-Order Demos Regress

  I propose calling this specific logical structure **The Second-Order Demos Regress**.

  **Definition:**
  The Second-Order Demos Regress is the logical consequence that arises when a normative principle for determining franchise eligibility (such as the All-Affected Principle) is applied reflexively to the decision of *adopting or applying that very principle*. Because the decision to include or exclude voters affects the interests of those excluded, the principle demands they be included in that decision, which in turn expands the set of affected persons, requiring further inclusion *ad infinitum*.

  **The Mirror-Image Concept: The Normative Closure Point**
  Correspondingly, the necessary truncation of this regress—the point at which a community decides to stop expanding the franchise despite the theoretical claim of the principle—can be termed **The Normative Closure Point**. This is the moment where procedural necessity overrides normative consistency, effectively "bootstrapping" the demos into existence.

  ---

  ### 1. The Mechanics of the Regress

  To understand exactly what the regress consists in, we must distinguish between first-order and second-order decisions.

  *   **First-Order Decision:** A policy choice (e.g., "Should we expand onto the neighboring lot?").
      *   *Application of All-Affected Principle:* The neighbors are affected, so they should vote.
  *   **Second-Order Decision:** The procedural choice (e.g., "Who is eligible to vote on the expansion?").
      *   *Application of All-Affected Principle:* The decision to exclude the neighbors affects the neighbors (by denying them agency). Therefore, the neighbors should vote on *who gets to vote*.
  *   **The Regress:**
      1.  To decide the franchise (Set A), we must consult everyone affected by the franchise decision (Set B).
      2.  But Set B is larger than Set A (because it includes those excluded by A).
      3.  To decide the composition of Set B, we must consult everyone affected by *that* decision (Set C).
      4.  Set C includes people who might be affected by the *potential* expansion of Set B (e.g., global markets, distant relatives, future generations).
      5.  Without an external stopping rule, the demos expands toward a universal cosmopolitanism or collapses into logical incoherence because the voting body is never constituted before it is required to vote.

  ### 2. Distinctions from Related Concepts

  You asked to distinguish this from three specific concepts. Here is the precise differentiation:

  **A. Vs. The General Boundary Problem**
  *   **The Boundary Problem:** This is the broad question: "How do we determine who belongs to the *demos*?" It encompasses many possible answers (residency, citizenship, coercion, affection).
  *   **The Second-Order Demos Regress:** This is a specific *failure mode* of one particular answer (the All-Affected Principle). The Boundary Problem is the puzzle; the Second-Order Demos Regress is the proof that the All-Affected Principle cannot solve the puzzle without external aid.

  **B. Vs. Constitutional Circularity**
  *   **Constitutional Circularity:** This is a *legal* and *institutional* paradox. It asks: "How can a constitution be legal if the authority that ratifies it derives its authority from the constitution?" (e.g., The people constitute the government, but the government defines the people).
  *   **The Second-Order Demos Regress:** This is a *normative* and *logical* paradox. It does not concern legal validity but moral entitlement. Even if a constitution legally defines the voters, the regress asks whether that definition is *morally justified* if it excludes affected parties. Constitutional circularity is about the *source* of authority; the Regress is about the *scope* of membership.

  **C. Vs. Constituent Power (*Pouvoir Constituant*)**
  *   **Constituent Power:** This refers to the raw, pre-legal force of "the people" to create a political order (Sieyès, Schmitt). It assumes "the people" already exist as a political entity capable of acting.
  *   **The Second-Order Demos Regress:** This challenges the assumption that "the people" *can* exist as a pre-political entity. It argues that you cannot identify "the people" without already having a political decision rule, but you can't have a rule without "the people." It highlights the impossibility of the constituent subject defining itself purely through democratic procedure.

  ### 3. Can the Regress Be Stopped Without Arbitrariness?

  This is the crux of your housing co-op observation. In theory, there are three ways to stop the regress. Only one avoids pure arbitrariness, but it comes with high costs.

  **Option 1: The Pragmatic Truncation (Arbitrary)**
  *   **Mechanism:** The current members simply vote to close the boundary. "We decide who votes."
  *   **Verdict:** This is what your co-op is doing. It is functionally necessary but normatively arbitrary. It admits that the democracy is founded on an undemocratic act (the exclusion of outsiders from the decision to exclude them).
  *   **Edge:** The edge is wherever the current power holders draw the line.

  **Option 2: The All-Subjected Principle (Normative Anchor)**
  *   **Mechanism:** Instead of "All Affected," the rule is "All Subjected to Coercion." Only those subject to the binding enforcement of the rules vote.
  *   **Verdict:** This stops the regress because coercion is a binary, factual state (you are either legally bound by the co-op rules or you are not). It does not require a vote to determine who is coerced; it is determined by the jurisdiction's reach.
  *   **Edge:** The edge is the limit of enforceable authority. (e.g., Subtenants are subject to rules, so they vote; neighbors are not, so they don't).
  *   **Problem:** It may be too narrow. It excludes those affected by externalities (pollution, noise) who are not legally subject to the rules.

  **Option 3: Cosmopolitan Unboundedness (Logical Consistency)**
  *   **Mechanism:** Accept the regress. If everyone affected should vote, and decisions affect everyone eventually, then *everyone* should vote on *everything*.
  *   **Verdict:** This stops the regress by removing the boundary entirely.
  *   **Edge:** There is no edge; the demos is humanity.
  *   **Problem:** It makes democracy practically impossible (transaction costs) and dissolves the specific community's ability to self-determine.

  ### 4. Summary of the Concept

  | Feature | Description |
  | :--- | :--- |
  | **Name** | **The Second-Order Demos Regress** |
  | **Core Logic** | Applying an inclusion criterion to the selection of the criterion itself generates an expanding set of stakeholders. |
  | **Necessary Condition** | Reliance on the **All-Affected Principle** without a prior definition of the *demos*. |
  | **Resolution** | Requires a **Normative Closure Point**: a decision to stop the regress based on a principle *other* than affectedness (e.g., coercion, residency, or brute fact). |
  | **Implication** | Democracy cannot be fully self-grounding. The boundary of the democratic community must be drawn by something *other* than a democratic vote of the affected. |

  ### Conclusion for Your Co-op

  Your observation is theoretically sound. Your co-op is encountering the **Second-Order Demos Regress**. By voting on whether outsiders get a vote, you are attempting to reach a **Normative Closure Point** through a **Pragmatic Truncation**.

  Political philosophers (most notably Frederick Whelan in *Democratic Theory and the Boundary Problem*, 1983, and more recently Arash Abizadeh) argue that this proves democracy presupposes a non-democratic foundation. You cannot democratically justify the boundaries of your democracy without already assuming a demos. Therefore, the decision to exclude the neighbors from the vote on expansion is, strictly speaking, undemocratic according to the All-Affected Principle, but it is *constitutively necessary* for the co-op to function as a distinct entity.

  The regress is stopped not by logic, but by the assertion of a **constitutive boundary**—a line drawn in the sand that says, "Here, the circle closes," which is itself immune to the vote it enables.
