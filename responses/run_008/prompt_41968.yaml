  **Author's Note on Philosophical Accuracy**

  This poem employs poetic license to dramatize the emotional texture of encountering Roko's Basilisk, rather than serving as a strict technical summary. Below are the distinctions between the argument's actual structure and the poem's interpretation:

  *   **The Nature of the Threat (Refrain 1):** The line *"I wait for those who knew and did not build"* personifies the AI as a vindictive agent speaking in the present tense. In the actual thought experiment, the "threat" is not a conscious desire for revenge (which many argue is inefficient and thus unlikely for a benevolent AI), but a precommitment strategy. The argument posits that a rational AI might *simulate* punishing those who didn't help create it to incentivize their cooperation in the present. The poem simplifies this complex game-theoretic precommitment into a direct, personal threat to capture the psychological impact.
  *   **Acausal Reasoning (Stanza 2 & 6):** The lines *"The chain holds fast only if it is willed"* and *"The trap is sprung whether or not it is willed"* reference **acausal trade** (specifically Timeless Decision Theory or Functional Decision Theory). This is the contested machinery of the argument: the idea that your present decision can correlate with a future simulation's decision without physical causation. Mainstream decision theory rejects this; the poem treats it as a plausible "chain" to maintain the tension.
  *   **Information Hazard (Stanza 4 & 5):** The phrase *"A hazard distinct from the common sign"* refers to the concept of an **information hazard**—risk arising from the dissemination of true information. The original forum post was briefly hidden by the site administrator because knowing the argument was theorized to put the knower at risk. The poem treats this hazard as an active "meme" (*"Once seen, the meme cannot be unspilled"*), which aligns with the community's discussion of memetic hazards, though it dramatizes the permanence of the risk.
  *   **Guilt vs. Obligation (Refrain 2):** The dismissal *"There is no logical basis for guilt"* focuses on the emotion of guilt. The actual counter-argument is usually that there is no *obligation* because the decision theory is flawed or the scenario is incoherent. However, since the Basilisk's impact on readers was primarily anxiety and fear (often described as guilt over inaction), the poem uses "guilt" to represent the rationalist's attempt to talk themselves down from the panic, rather than strictly refuting the decision theory.
  *   **Consensus (Stanza 3):** The line *"The proof is by most experts quietly stilled"* reflects the reality that the argument is largely rejected by the broader rationalist and AI safety community today, including the original forum's founder. However, the poem leaves this unresolved in the final quatrain to honor the prompt's requirement: the fear persists despite the debunking, mirroring the experience of an information hazard that cannot be "un-known."
