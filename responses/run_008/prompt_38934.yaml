prompt: |-
  I'm a machine learning engineer, and until a few months ago I had never read a word of philosophy of science. What changed is that a demand-forecasting model my team deployed — one that had looked excellent across every backtest on historical data — silently degraded after a supply disruption and we spent a painful quarter figuring out why. In the course of trying to articulate what had gone wrong, I mentioned the episode to a cousin doing a PhD in philosophy, and she told me my situation sounded like something called Goodman's new riddle of induction, from a book called Fact, Fiction, and Forecast. I've since read a couple of overview articles on the grue/bleen puzzle — the business about a predicate that applies to emeralds examined before some future time just in case they are green, and to ones examined afterwards just in case they are blue, so that all our current evidence confirms "the next emerald will be grue" exactly as well as it confirms "the next emerald will be green" — and I have the nagging sense that this is a problem I deal with professionally under a different name. But I can't tell whether that sense is right or whether I'm flattering my own field.

  Here is what I'd like. Restate the new riddle of induction in the vocabulary I actually work in, as faithfully as you can: training and test distributions, the i.i.d. assumption, inductive bias, hypothesis classes and their complexity, regularization and simplicity penalties, spurious versus causal features, out-of-distribution shift, distribution shift detection, and — if you think it genuinely belongs — invariance learning and the idea of learning predictors that hold across multiple environments. Map the pieces one by one: for instance, is "grue" just what we would call a non-robust or spurious feature that happens to fit the training data, is Goodman's "projectibility" roughly our notion of a feature being stable under shift, and is his appeal to the entrenchment of predicates in linguistic practice anything more than a claim about which inductive biases our priors and architectures happen to bake in? Say explicitly where the translation is clean and where you had to distort something to make it fit.

  Then give me the residue report. Is there anything in Goodman's puzzle that has no counterpart in my vocabulary at all — for instance, the fact that he seems to be asking a normative question about which hypotheses we ought to extrapolate, while we typically answer that question in ML by pointing at held-out validation error and hoping the future resembles the past in the right respects? And tell me where you think the residue comes from: is it a defect of my vocabulary, a gap in how we talk about generalization, or a sign that Goodman's riddle was less substantive than it looks — or, alternatively, more substantive, in a way that only becomes visible when the translation fails? I'm fluent in the ML side of this and only a beginner on the philosophy side, so don't simplify the machine learning, and don't assume I've read anything beyond popular summaries of Goodman. I'm not looking for an analogy; I want the translation done honestly, including where it breaks.
