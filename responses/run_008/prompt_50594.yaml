prompt: |-
  I'm a science-and-ideas correspondent at a national daily, and I also sit on our standards committee, which rules on corrections and sets editorial policy for the newsroom. Last month our health desk ran a front-page feature crediting a hospital network's new sepsis protocol with a dramatic improvement: network-wide mortality fell from 12.0 percent to 8.0 percent after the protocol was introduced. This week a biostatistician wrote in to point out what the underlying figures show. The network consists of two hospitals. Before the protocol, the large tertiary hospital treated 600 sepsis patients with 15.0 percent mortality, and the small community hospital treated 200 patients with 3.0 percent mortality; together, 800 patients and 12.0 percent. After the protocol — which also changed triage so that far more patients were routed to the community hospital — the tertiary hospital treated 400 patients at 16.0 percent mortality and the community hospital 800 patients at 4.0 percent; together, 1,200 patients and 8.0 percent. So within each hospital, mortality rose slightly, and the celebrated aggregate improvement is an artifact of case mix. Our health editor's defense is that the network-wide rate is the number that matters to readers deciding where care is delivered, and that any disaggregation can be sliced to tell an opposing story; several colleagues retort that the hospital-level numbers are the real ones and we printed an effect that reversed on inspection. The committee meets Tuesday and must decide two things: what, if anything, we print as a correction, and whether to adopt a standing rule for when an aggregate claim requires a check for reversal across relevant subgroups before publication. Draft the decision memo. It should give a concrete recommendation on both questions — with criteria a reporter without statistical training can actually apply on deadline — and it should engage seriously with the strongest argument for standing by the aggregate figure, including the worry that demanding stratification for every aggregate statistic invites both paralysis and cherry-picking of whichever subgroup framing flatters a preferred conclusion.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Science-and-ideas correspondent + Standards Committee member at a national daily.
      *   **Task:** Draft a decision memo for the Standards Committee meeting.
      *   **Context:** A front-page health feature claimed a sepsis protocol reduced mortality from 12% to 8%. A biostatistician revealed Simpson's Paradox: mortality actually *increased* within each hospital, but the aggregate dropped because patient volume shifted to the lower-mortality community hospital (case mix change).
      *   **Conflict:** Health Editor argues aggregate network rate is what matters to readers (consumer advice). Colleagues argue hospital-level numbers are the "real" ones and the story was misleading.
      *   **Deliverables:**
          1.  Recommendation on the correction (what to print).
          2.  Recommendation on a standing rule for aggregate claims (criteria for reporters).
          3.  Engagement with the Health Editor's argument (aggregate utility vs. paralysis/cherry-picking).
      *   **Tone:** Professional, authoritative, nuanced, actionable for journalists (not statisticians).

  2.  **Deconstruct the Statistical Issue (Simpson's Paradox):**
      *   *Before:* Tertiary (600 pts, 15% mort) + Community (200 pts, 3% mort) = 800 pts, 12% overall.
      *   *After:* Tertiary (400 pts, 16% mort) + Community (800 pts, 4% mort) = 1200 pts, 8% overall.
      *   *The Twist:* The protocol changed *triage*. Sicker patients (presumably) or just more patients went to the community hospital. The community hospital has inherently lower mortality (maybe less severe cases).
      *   *The Truth:* The protocol didn't necessarily save lives; the *routing* changed the average severity of patients at each site, or simply shifted volume to the safer-looking site. Reporting the aggregate as a "protocol success" implies causation where there is likely confounding.
      *   *Editorial Sin:* Attributing a population shift to a clinical intervention without controlling for case mix.

  3.  **Address the Correction:**
      *   *Goal:* Accuracy without unnecessary humiliation, but clear enough to fix the record.
      *   *Health Editor's Point:* Readers care about the network rate. True, but the *reason* for the rate matters. If the rate dropped because they sent easier cases to the good hospital, that's different than curing sepsis better.
      *   *Recommendation:* Publish a correction. It shouldn't just say "math error." It should clarify the *interpretation* error. The protocol's efficacy is unproven by these numbers alone.
      *   *Drafting the Correction:* Acknowledge the aggregate drop is real, but clarify that mortality rates within individual hospitals rose, suggesting the aggregate drop reflects patient routing, not necessarily clinical improvement.

  4.  **Address the Standing Rule (The Harder Part):**
      *   *Goal:* Prevent future Simpson's Paradox errors without bogging down every story with regression analysis.
      *   *Constraint:* Reporters aren't statisticians. Rules must be heuristic-based.
      *   *Health Editor's Worry:* If we stratify everything, we can find *any* story. Cherry-picking subgroups is a risk. Paralysis is a risk.
      *   *Counter-argument:* We don't need stratification for *everything*. We need it when the aggregate implies a causal mechanism that the subgroups contradict, or when the composition of the group changes significantly.
      *   *Proposed Rule:* The "Composition & Causation" Test.
          1.  Is the claim causal? (Protocol *caused* improvement).
          2.  Did the population composition change? (Triage rules, demographics, volume).
          3.  If yes to both, stratification is required.
      *   *Safeguard against Cherry-picking:* Pre-register the subgroups (e.g., by site, by severity) based on domain expertise, not data dredging.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue and the two decisions.
      *   **Background:** Summarize the sepsis story and the biostatistician's letter (Simpson's Paradox).
      *   **Decision 1: The Correction:**
          *   Why: The story implied clinical efficacy. The data shows logistical shifting.
          *   What: A clarifying note. Acknowledge the aggregate is real but the *attribution* was flawed.
          *   Addressing the Editor: Validate that the aggregate number is real, but emphasize that *why* it changed is the news.
      *   **Decision 2: The Standing Rule:**
          *   Name it: The "Heterogeneous Aggregates" Policy.
          *   Criteria: When to dig deeper.
              *   Causal claims based on observational data.
              *   Known shifts in population mix (triage, demographics).
              *   Large disparities between sub-units.
          *   Addressing the "Paralysis/Cherry-picking" concern:
              *   Limit subgroups to *pre-existing* structural units (hospitals, regions), not data-mined slices.
              *   Focus on *causal* claims, not descriptive ones.
      *   **Implementation:** Training, checklist for editors.
      *   **Conclusion:** Reiterate commitment to accuracy.

  6.  **Refining the Tone:**
      *   Needs to be firm but collaborative. The Health Editor isn't stupid; they have a valid point about reader utility. The memo must show why accuracy trumps utility *when utility is based on a misconception*.
      *   Avoid jargon like "Simpson's Paradox" in the public correction, but use it internally to show understanding.
      *   Ensure the "criteria for reporters" is simple. "If X and Y, then ask Z."

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the correction too harsh?
      *   *Fix:* Frame it as "additional context" or "clarification" rather than "retraction," but be firm that the *cause* was misidentified.
      *   *Critique:* Is the rule too vague?
      *   *Fix:* Make it a flowchart logic. 1. Causal claim? 2. Changing mix? 3. Check subgroups.
      *   *Critique:* Did I address the cherry-picking worry?
      *   *Fix:* Explicitly mention that subgroups must be defined *before* analysis based on subject matter logic, not statistical significance hunting.

  8.  **Final Polish:** Check word count, formatting, and ensure all prompt requirements are met. (The prompt asks for a "decision memo".)

  *(Self-Correction on the Correction)*: The prompt asks "what, if anything, we print." I need to be decisive. Printing nothing is bad journalism. Printing a full retraction might be legally risky/overkill if the aggregate number wasn't fake. A "Clarification" or "Editor's Note" is the middle ground. I will recommend a prominent Editor's Note.

  *(Self-Correction on the Rule)*: The Health Editor's argument is strong: "Readers decide where care is delivered." If the network sends you to the community hospital, the network rate *is* your rate. However, the story claimed the *protocol* improved care. That's the lie. The rule needs to distinguish between "Consumer Advice" (aggregate is fine) and "Scientific/Medical Efficacy" (stratification needed). I will build this distinction into the rule.

  9.  **Finalizing the Memo Structure:**
      *   To: Standards Committee
      *   From: [My Name/Role]
      *   Subject: Decision on Sepsis Feature & Aggregate Data Policy
      *   Sections: Context, Recommendation on Correction, Recommendation on Policy (with criteria), Addressing Counter-arguments.

  10. **Writing the content.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name], Science-and-Ideas Correspondent
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Sepsis Feature Correction and Policy on Aggregate Data Claims

  ### 1. Context and Issue

  Last month, the Health Desk published a front-page feature attributing a drop in network-wide sepsis mortality (12.0% to 8.0%) to a new clinical protocol. A subsequent letter from a biostatistician demonstrated that this aggregate improvement is a statistical artifact (Simpson's Paradox). While the network average fell, mortality rates actually *rose* within both individual hospitals. The aggregate drop resulted from a change in triage policy that shifted patient volume to the lower-mortality community hospital, altering the case mix rather than improving clinical outcomes.

  The Health Editor argues that the network-wide rate is the valid metric for readers choosing where to seek care, and that disaggregating data invites cherry-picking. Colleagues argue that attributing the drop to the protocol is factually incorrect and misleading.

  This memo recommends a course of action for the correction and proposes a standing editorial rule to prevent recurrence.

  ### 2. Recommendation: The Correction

  **Decision:** We must publish a prominent Editor's Note on the Health Desk page, linked to the original online story and referenced in future print editions if space allows.

  **Rationale:** While the aggregate numbers (12% to 8%) were mathematically accurate, the *causal attribution* was not. The story implied the protocol made care safer. The data shows the protocol made care *different* (routing patients differently), while safety within each facility stagnated or declined. Leaving the story uncorrected validates a medical claim that is unsupported by the underlying evidence.

  **Drafting Guidance:** The note should not apologize for the math, but clarify the interpretation. It should acknowledge the network-wide improvement while stating that further analysis indicates this was driven by patient routing rather than improved survival rates at individual facilities.

  **Suggested Text:**
  > *Editor's Note: An earlier version of this article attributed a decline in network-wide sepsis mortality to a new clinical protocol. While the aggregate mortality rate for the network did decline, subsequent review of hospital-level data indicates that mortality rates within individual facilities rose slightly during the same period. The network-wide improvement reflects a change in patient triage that routed a higher volume of patients to a facility with historically lower mortality rates. The story has been updated to reflect that the data does not confirm the protocol improved clinical survival rates.*

  ### 3. Recommendation: Standing Policy on Aggregate Claims

  **Decision:** Adopt the "Heterogeneous Aggregates" policy. Reporters and editors must apply a three-step test before publishing causal claims based on aggregate data involving human subjects or institutions.

  **The Policy:**
  Aggregate statistics are permissible for descriptive reporting (e.g., "Unemployment fell"). However, when an aggregate statistic is used to support a **causal claim** (e.g., "Policy X caused improvement"), reporters must check for confounding variables if the population is composed of distinct sub-units.

  **The "Three-Step Test" for Reporters:**
  *Reporters do not need statistical training to apply this. If the answer to all three is "Yes," subgroup analysis is required before publication.*

  1.  **Is the claim causal?** (Are we saying X *caused* Y, rather than just Y happened?)
  2.  **Is the population composite?** (Is the data made up of distinct groups, such as different hospitals, regions, demographics, or time periods?)
  3.  **Did the composition change?** (Did the proportion of people/patients in those groups shift significantly between the comparison periods?)

  **Application to the Sepsis Case:**
  1.  *Causal?* Yes (Protocol caused mortality drop).
  2.  *Composite?* Yes (Two hospitals).
  3.  *Composition Changed?* Yes (Patient volume shifted from Tertiary to Community).
  *Result:* Failure to check subgroups violated policy.

  ### 4. Addressing the Health Editor's Concerns

  The Health Editor raises two valid concerns: that the aggregate rate is useful for consumers, and that demanding stratification invites paralysis or cherry-picking.

  **On Consumer Utility:**
  The Editor is correct that a patient entering the network faces the network's average risk *if* triage is random. However, triage was not random; it was part of the protocol. A reader deciding "where to seek care" cannot choose the network's average; they will be sent to a specific facility. By hiding the facility-level data, we deprived readers of the information needed to understand *why* the average dropped. Accuracy regarding the *mechanism* of care is more valuable to the reader than a headline number that masks the reality of individual facilities.

  **On Paralysis and Cherry-Picking:**
  The worry that stratification allows writers to "slice data to tell an opposing story" is a risk of *data dredging* (choosing subgroups after seeing the results), not stratification itself. To mitigate this:

  1.  **Pre-defined Subgroups:** Subgroups must be defined by subject-matter logic *before* analysis (e.g., by hospital site, by age bracket), not by statistical significance. In the sepsis case, "Hospital Site" is an obvious, pre-existing structural unit, not a cherry-picked slice.
  2.  **Causal vs. Descriptive:** This rule applies only to causal claims. If we are simply reporting "Network mortality is 8%," no stratification is needed. The burden is triggered only when we assert *why* the number changed.
  3.  **The "Reversal" Check:** We are not asking for complex regression analysis. We are asking for a basic consistency check: *Does the trend hold true in the major component parts?* If the average goes down, but every component goes up, the story is not "Average goes down," the story is "Average goes down despite components going up."

  ### 5. Implementation

  *   **Immediate:** Health Desk to draft the Editor's Note by EOD Thursday.
  *   **Training:** I will draft a one-page "Data Caution" checklist for the next newsroom training session, focusing on the Three-Step Test.
  *   **Workflow:** Section Editors must sign off on causal claims derived from aggregate data where population mix may have shifted.

  ### 6. Conclusion

  We cannot allow mathematical accuracy to shield editorial inaccuracy. The aggregate number was real, but the story we told about it was false. By adopting the "Heterogeneous Aggregates" policy, we protect the newsroom from statistical artifacts without demanding that every reporter become a biostatistician. We simply require that when we claim a cause, we ensure the effect is not merely a shadow cast by a changing population.

  **Recommendation:** Vote to approve the Editor's Note text and adopt the "Heterogeneous Aggregates" policy effective immediately.
