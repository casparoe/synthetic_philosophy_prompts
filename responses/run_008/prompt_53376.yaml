  **Section One: Scene-setting**

  1. You argue that deliberately misleading someone via a true statement is morally identical to asserting a falsehood. Does this equivalence hold even when the misleading statement is carefully engineered to exploit the hearer's assumptions?

  2. You describe the intuition that lying is worse as a cognitive artifact regarding explicitness. Are you committed to the claim that explicitness itself carries zero moral weight in any context?

  **Section Two: The pressure points**

  3. **(Paired Vignette)** In a case where hiding a friend, you say either "She left" (lie) or "No one entered" (misleading truth), producing the identical false belief. What genuine moral significance distinguishes these performances if outcomes and intentions match?
  *   **Likely Reply:** Nothing distinguishes them; the moral wrong is the deception, not the method.
  *   **Follow-up:** Then why does the misleading speaker retain plausible deniability while the liar forfeits it, and isn't that retention itself a secondary deception?

  4. **(Sub-sentential Escape)** If lying requires asserting a falsehood, how do you classify misleading via a head shake or staged silence, and does the equivalence thesis survive if the category of the lie becomes this fragile?
  *   **Likely Reply:** These are still acts of deception intended to induce false belief, so they fall under the same moral prohibition.
  *   **Follow-up:** But if no assertion is made, there is no truth-value to violate; are you then arguing that morality binds us to correct others' inferences even when we speak no words?

  5. **(Detectability and Accountability)** Since the misled hearer has no false sentence to confront you with, isn't misleading more insidious, and shouldn't your view predict we blame liars harshly only because lying is easier to prove?
  *   **Likely Reply:** We blame liars more because the violation is clearer, but the underlying wrong of manipulating belief remains constant.
  *   **Follow-up:** If the wrong is constant but the accountability differs, aren't you endorsing a strategy where the smart deceiver avoids the label of liar to escape the sanction?

  6. **(Reform Implication)** If the asymmetry is an artifact, should we stop teaching children there is a morally safer route through a true sentence, and what do you say to parents who insist misleading corrodes trust just as thoroughly?
  *   **Likely Reply:** We should teach children not to deceive, regardless of method, because trust is damaged by the manipulation of belief itself.
  *   **Follow-up:** But if you tell a child "truth is best" while practicing engineered ambiguity, aren't you modeling that technical truthfulness is a shield against moral critique?

  7. **(Evidence Against)** Would a robust experimental finding that people judge these practices differently even when understanding the mechanism shake your view, or would you dismiss it as just more artifact?
  *   **Likely Reply:** I would dismiss it, because folk intuitions are often confused about the source of moral value.
  *   **Follow-up:** If you reject empirical consensus on moral judgment, what evidence *would* count against your view, or is the theory insulated from refutation?

  **Section Three: The closer**

  8. Have you ever chosen a plain lie over engineering a misleading truth, and what does that in-the-moment choice reveal about the asymmetry you deny on paper?
  *   **Back-up:** If you say no, are you claiming perfect moral consistency, or simply that you prefer the lie when caught?
