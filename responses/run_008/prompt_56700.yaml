      *   *Borges:* Funes suffers a fall, wakes up with perfect memory. He perceives every leaf on every tree, every change in perception. He creates a numbering system for every individual object because general terms (like "dog") are too imprecise. He is immobile, lying in the dark.
      *   *Mapping:* Funes represents the absolute absence of forgetting. This aligns with Nietzsche's warning about the "historical sense" gone wild.
