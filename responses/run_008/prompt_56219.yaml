answer: |-
  # Lesson Plan: The Underdetermination of Theory by Evidence
  **Time:** 50 Minutes
  **Audience:** 2nd/3rd-Year Philosophy Majors (Post-Duhem-Quine)
  **Goal:** Distinguish Underdetermination (UTE) from Duhem-Quine (D-Q) Holism and establish UTE as a structural claim about confirmation, not a practical complaint about testing.

  ---

  ## I. Order of Ideas: The Logical Dependency (00:00 – 00:10)

  **Objective:** Secure the logical relation between theory and evidence *before* introducing the underdetermination problem. This prevents the D-Q slide.

  1.  **The D-Q Recap (2 mins):** Briefly acknowledge their previous unit. D-Q says: *Hypotheses cannot be tested in isolation.* If a prediction fails, we don't know if the core theory ($H$) or the auxiliaries ($A$) are to blame.
      *   *Key Characterization:* D-Q is a problem of **Falsification** (breaking the link between $H$ and $E$).
  2.  **The Pivot to UTE (3 mins):** State clearly: "For the next 40 minutes, we are going to *solve* D-Q. We are going to assume, for the sake of argument, that we have fixed our auxiliaries, calibrated our instruments, and isolated the theory. We know exactly what the theory predicts."
      *   *Why this dependency:* If students believe the link between $H$ and $E$ is fuzzy (D-Q), they will interpret UTE as merely "we haven't found the right experiment yet." To see UTE, they must accept that $T \rightarrow E$ is a secure logical entailment.
      *   *Key Characterization:* UTE is a problem of **Confirmation** (too many links leading to the same $E$).
  3.  **The Definition (5 mins):** Write on board:
      *   **UTE Thesis:** For any body of evidence $E$, there exist at least two incompatible theories, $T_1$ and $T_2$, such that $T_1$ entails $E$ and $T_2$ entails $E$.
      *   *Crucial Distinction:* D-Q says we can't get to $E$ cleanly. UTE says even if we get to $E$ cleanly, $E$ doesn't point back to a unique $T$.

  ---

  ## II. The Carrying Example: The "Double-Intensity" Field (00:10 – 00:25)

  **Objective:** Provide a non-stock, Reichenbach-style case that isolates ontological disagreement from empirical disagreement.

  **The Setup:**
  Imagine a universe governed by a single fundamental field, $\Phi$, which interacts with all matter to produce observable forces.
  *   **Theory 1 (Singleton):** There exists exactly one field $\Phi$. Its intensity at any point is $I$.
  *   **Theory 2 (Doublet):** There exist exactly two coincident fields, $\Phi_a$ and $\Phi_b$. They are qualitatively identical. Each has intensity $I/2$. They are perfectly superposed.
  *   **The Coupling Law:** Matter interacts with the *sum* of field intensities. There is no known interaction that couples to $\Phi_a$ or $\Phi_b$ individually, only to $(\Phi_a + \Phi_b)$.

  **What the Example Must Have:**
  1.  **Ontological Disagreement:** $T_1$ says there is 1 entity; $T_2$ says there are 2. This is a precise, truth-apt disagreement (not just a difference in wording).
  2.  **Empirical Identity:** Because the coupling law is strictly additive, every possible measurement yields $I$. No instrument can "split" the interaction.
  3.  **Principled Equivalence:** It is not that our tools are too blunt; it is that the *laws of nature* in $T_2$ define the fields as interacting only in sum.

  **What the Example Must Lack:**
  1.  **No "Undetectable Forces":** Avoid the "Newtonian world + universal force" trope. Here, the surplus is an *entity*, not a force distorting measurement. This avoids the intuition that $T_2$ is just $T_1$ with "noise" added.
  2.  **No Curve-Fitting:** This is not about infinite functions passing through finite points. It is about two specific, finite ontologies.
  3.  **No Skeptical Scenarios:** Avoid Brain-in-Vat structures. The world is real in both cases; only its inventory differs.

  **Instructional Move:**
  Ask: "If you measure intensity $I$, have you disproven $T_2$?" (No, $I/2 + I/2 = I$). "Have you proven $T_1$?" (No, $T_2$ predicts $I$ just as well).
  *   *Why this carries the section:* It forces students to admit that evidence can be *sufficient* for prediction but *insufficient* for ontology. It makes the UTE thesis concrete without relying on "maybe we're dreaming."

  ---

  ## III. Misconception Map (00:25 – 00:40)

  **Objective:** Head off the three standard collapses of the thesis *before* they solidify.

  **1. Transient vs. Permanent Underdetermination (Address at 00:25)**
  *   *The Misconception:* "This is just temporary. We'll invent a detector for $\Phi_a$ next century." (Confusing UTE with current technological limits).
  *   *The Intervention:* Immediately after presenting the Doublet example, stipulate: "In this model, the 'Single-Coupling Law' is a fundamental law of nature, not an engineering constraint."
  *   *The Point:* Distinguish **Transient UTE** (we haven't thought of the test yet) from **Permanent/Principled UTE** (the logic of the theories forbids a distinguishing test). We are discussing the latter. If they think it's transient, they haven't accepted the example.

  **2. The Simplicity Tie-Breaker (Address at 00:32)**
  *   *The Misconception:* "Just pick $T_1$. It's simpler. Problem solved."
  *   *The Intervention:* Ask: "Does 'simpler' mean 'more likely true' or 'easier to use'?"
      *   If they say "Easier to use": Concede the point, but note this is a *pragmatic* choice, not an *epistemic* one. UTE remains for the realist who wants truth.
      *   If they say "More likely true": Challenge them. "What evidence supports the claim that the universe prefers simplicity?" If the evidence is $E$, and both $T_1$ and $T_2$ entail $E$, $E$ cannot favor $T_1$.
  *   *The Point:* Simplicity is a *response* to UTE, not a *dissolution* of it. It changes the subject from "what does the evidence say?" to "what virtues do we value?"

  **3. The Collapse into Skepticism (Address at 00:38)**
  *   *The Misconception:* "If we can't choose, science is dead. We know nothing."
  *   *The Intervention:* Distinguish **Theory** from **Empirical Content**. "Do we know the intensity $I$?" (Yes). "Do we know the forces?" (Yes). "We know the *phenomena*; we just don't know the *inventory*."
  *   *The Point:* UTE threatens *Scientific Realism* (belief in the unobservable structure), not *Empiricism* (belief in predictive success). It narrows the scope of knowledge; it does not eliminate it.

  ---

  ## IV. Exclusions: What to Decline (00:40 – 00:45)

  **Topic:** The Status of Parsimony (Occam's Razor).
  **Why Decline:** Justifying why simplicity tracks truth requires a full module on Bayesian priors or Natural Kinds. Doing it now suggests UTE is "solvable" by a rule of thumb, which undermines the structural lesson.
  **How to Say It:**
  > "You will notice I am not telling you which theory to pick. That is because justifying *why* simplicity should track truth is a separate metaphysical problem. If we solve that now, we risk treating UTE as a puzzle with a known solution, rather than a structural feature of evidential support. For today, we must sit with the discomfort that evidence alone does not decide."

  *This frames the exclusion as a methodological necessity for the lesson, not an avoidance of difficulty.*

  ---

  ## V. Closing Question (00:45 – 00:50)

  **Objective:** Reveal if they understand the *structure* of UTE rather than just feeling the *weight* of skepticism.

  **The Question:**
  > "Imagine you are the head of a funding agency. You must fund research into either the Singleton ($T_1$) or Doublet ($T_2$) theory. You know they are empirically equivalent.
  >
  > If you choose $T_1$ because it is simpler, are you making a **scientific** judgment or a **metaphysical** one? And if it is metaphysical, does that mean science relies on non-scientific values to function?"

  **What to Listen For:**
  *   **Failure:** "Science is just opinion" or "We should just pick the true one." (Shows they collapsed into skepticism or missed the equivalence).
  *   **Success:** "It's a scientific judgment *only* if we count simplicity as evidence. If simplicity is just utility, then science needs metaphysics to choose theories." (Shows they grasp that UTE separates *empirical adequacy* from *theoretical choice*).

  ---

  ## Summary of Dependencies for the Instructor
  1.  **Secure Entailment First:** You must bracket D-Q (assume testing works) to show UTE (testing isn't enough).
  2.  **Ontology vs. Force:** The example must change the *count* of things, not add a *distorting force*, to avoid the "undetectable force" dismissal.
  3.  **Pragmatics vs. Truth:** You must separate "useful to believe" from "true" to prevent Simplicity from dissolving the problem too early.
  4.  **Realism vs. Empiricism:** You must locate the skepticism in the *unobservables*, not the *predictions*, to prevent total nihilism.
