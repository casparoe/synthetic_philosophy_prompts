  5.  **Develop Fixes and Costs:**

      *   **Fix for P2 vs. P3:**
          *   *Option 1 (Modify P2):* Change "almost nobody" to "nobody." (Too strict, excuses no one).
          *   *Option 2 (Modify P3):* Change "best standards" to "dominant standards," but add a clause for "egregious violations." (Complicated).
          *   *Option 3 (Distinguish Blame vs. Judgment):* Keep P3 for *moral judgment of the act* (it was wrong), use P2 for *blame of the agent* (he wasn't a monster).
          *   *Cheapest Fix:* Refine P2. Make it about *epistemic access* rather than *social consensus*. "Unfair to blame if the truth was epistemically inaccessible," rather than "almost nobody saw it."
          *   *Cost:* Requires defining "epistemically accessible." Harder to apply than counting abolitionists.

      *   **Fix for P2 vs. P5:**
          *   *Option 1:* Drop P5. (User doesn't want to).
