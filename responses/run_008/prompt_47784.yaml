          *   *Option 3:* Clarify P5. Future condemnation is *accurate* (we did wrong) but not necessarily *fair* (we couldn't help it). But P5 says "deserved."
          *   *Cheapest Fix:* Modify P5's "deserved." Change to "accurate" or "inevitable." Or modify P2 to exclude *future* judgment (presentism is different?).
          *   *Better Fix:* Align P2 and P5 via the "Epistemic Access" fix above. If the truth is accessible to us now (like abolitionists were accessible to Jefferson), we are culpable. If the truth is inaccessible to us (like 2300 issues), we are less culpable, but the act is still wrong.
          *   *Cost:* Admitting we might not be "evil" but just blind, which weakens the force of P5.

