answer: |-
  Adopt a hybrid decision procedure that licenses function claims for evolved components under a historical account and for structural contributions under a causal account, while restricting one-shot designs to mechanistic descriptions unless legal counsel overrides.

  This approach reconciles the two factions by acknowledging that "function" carries different ontological weight depending on the origin of the part: historical selection validates etiological function claims, while engineering necessity validates causal role claims, provided triviality is avoided. Legal strategy dictates the final tolerance for risk when philosophical clarity conflicts with patent scope.

  ### Decision Procedure

  **Step 1: History Check (Etiological Account)**
  *   **Question:** Was this specific part retained, iterated, or selected from a variant pool *because* it performed the claimed effect?
  *   **Sufficient Answer for "Yes":** Documented evidence of directed evolution, breeding, or iterative screening where variants failing the effect were discarded.
  *   **Termination:** If **Yes**, the function claim is **Licensed**. Stop.
  *   **If No:** Proceed to Step 2.

  **Step 2: Capacity Check (Causal Role Account)**
  *   **Question:** Does the part make a specific, non-trivial contribution to a system capacity explicitly defined as a design requirement or analysis goal?
  *   **Sufficient Answer for "Yes":** The claimed effect is necessary for the system's defined operation (e.g., "fold stability" for a core) and is not a side effect (e.g., "spectral absorbance" unless designing a sensor).
  *   **Termination:** If **No**, **Rewrite as Mechanism** (e.g., "The oxyanion hole forms hydrogen bonds with the substrate"). Stop.
  *   **If Yes:** Proceed to Step 3.

  **Step 3: Legal Necessity Check**
  *   **Question:** Is functional language required for patent claim scope, enablement, or utility assertion?
  *   **Sufficient Answer for "Yes":** Attorney confirmation that mechanistic language narrows scope too much or fails to cover equivalents.
  *   **Termination:** If **Yes**, **Escalate to Attorney** (flag the lack of historical basis). Stop.
  *   **If No:** **Rewrite as Mechanism** (prefer precision in internal specs). Stop.

  ### Application to Current Claims

  **(1) "The function of the oxyanion hole is to stabilize the transition state" (One-shot Computational Design)**
  *   **Step 1:** No. The pocket exists only in a computational design produced in a single pass with no directed evolution.
  *   **Step 2:** Yes. Stabilizing the transition state is the specific design capacity being analyzed.
  *   **Step 3:** Depends on document type.
      *   **Internal Spec/Test Plan:** Rewrite as Mechanism ("The oxyanion hole forms hydrogen bonds that lower the activation energy").
      *   **Patent Draft:** Escalate to Attorney. Flag that the claim relies on causal role without historical selection.

  **(2) "The function of the fluoride-binding domain is fluoride capture" (Directed Evolution)**
  *   **Step 1:** Yes. The domain arrived after fourteen rounds of mutagenesis and screening where variants failing capture were discarded.
  *   **Termination:** **Licensed**. The history validates the etiological function claim regardless of document type.

  **(3) "The function of the hydrophobic core is to stabilize the fold" (Library Packing Motif)**
  *   **Step 1:** No. The motif was chosen mostly because it was convenient, not selected specifically for stability against other variants.
  *   **Step 2:** Yes. Stabilizing the fold is the defining capacity of a hydrophobic core, not a trivial side effect like "making noise."
  *   **Step 3:** Yes. The lead designer has already built patent claims around this.
  *   **Termination:** **Escalate to Attorney**. You must inform them that the function claim lacks etiological backing and rests on a causal account vulnerable to triviality challenges, allowing them to assess the legal risk rather than absorbing it into the engineering record.

  ### Limitations and Repurposed Scaffolds

  This procedure cannot determine the metaphysical truth of whether a part *really* has a function; it only manages the risk of using the language. It cannot resolve whether a causal contribution counts as a "function" versus a "property" without deferring to the design intent defined in Step 2.

  For a repurposed natural scaffold (a part with evolutionary history, but not for its current use), the procedure cannot reach a definitive "Licensed" verdict. It fails Step 1 because the history selects for the *old* use, not the current claim. It passes Step 2 because it contributes to the new capacity. Consequently, it always terminates at **Escalate to Attorney**. This is because the conflict between natural phenomenon eligibility (history) and utility claims (current capacity) is a legal question regarding patent eligibility under laws like 35 U.S.C. § 101, not a philosophical one the procedure can settle.
