          *   They are *pragmatists*. They are using *stipulative definitions*.
          *   Philosophical label: This aligns closest with *conventionalism* or *contextual precisification*. It's not Epistemicism (they don't think there's a hidden fact). It's not really Supervaluationism (too nuanced). It's essentially "We know it's vague, but we need a binary switch for admin."
          *   *Key term:* "Administrative Sharpness."

      *   **Consistency Check (Awards vs. Shelving):**
          *   *Awards (SFWA):* Need binary eligibility. You either get the ballot or you don't. Requires a sharp line.
          *   *Shelving (Bookshops):* Need navigability. A book can't be in two places physically.
          *   *Are they consistent?* Yes, functionally. Both prioritise *utility* over *ontological truth*. However, shelving is often more fluid (a book *can* be moved, or face-out in two sections) whereas award eligibility is rigid.
          *   *Tension:* Shelving often admits the vagueness (cross-genre sections), whereas awards deny it (hard cutoff). So, they are consistent in *goal* (order) but inconsistent in *flexibility*.

      *   **Strict Requirements vs. Comfortable Fit:**
          *   *Strict:* The rules *require* a binary decision for the sake of the mechanism (eligibility, physical location).
          *   *Comfortable:* The industry is comfortable admitting the vagueness in marketing blurbs ("crossover appeal", "upper middle grade"). The rules don't require them to lie about the nature of the text, only to categorise it for the transaction.

      *   **The Counterfactual (Degree-Based View):**
          *   If "novel" admitted degrees (Fuzzy Logic):
          *   *Awards:* Categories would blur. "Novella/Novel" hybrid prize? Weighted voting?
          *   *Shelving:* Digital tags instead of physical spines. "85% YA, 15% Adult".
          *   *Contracts:* Royalties based on "novel-ness"? (Absurd, but illustrates the point).
          *   *Criticism:* Reviews would discuss the *degree* of genre adherence.
          *   *Conclusion on this:* It would be administratively catastrophic.

      *   **Conclusion:** Summarise. The industry adopts a "pragmatic stipulation" view. It treats vagueness as a administrative nuisance to be solved by fiat, not a metaphysical puzzle to be solved by truth.

  4.  **Refining the Language (British English):**
