      *   **Core Question:** What theory of vagueness do these industry stipulations presuppose? (Hidden fact? Stipulation? Something else?)
      *   **Tasks:**
          1.  Reconstruct the implicit view.
          2.  Assess consistency between award rules (SFWA) and shelving practices.
          3.  Distinguish strict requirements from mere compatibility.
          4.  Explain what would change if the industry adopted a degree-based view (fuzzy logic/supervaluationism/etc.).
          5.  **Constraint:** Reply in British English.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Sorites Paradox:* The classic "heap" problem. One grain doesn't make a heap, but enough do. Where is the line?
      *   *The Industry Practice:* SFWA says 40k words = novel. 39,999 = novella. This is a *precisification*.
      *   *The Reality:* Everyone knows the boundary is vague. A 39,999-word story isn't fundamentally different from a 40,001-word story.
      *   *Theories of Vagueness:*
          *   *Epistemicism:* There *is* a sharp boundary, we just don't know it. (Unlikely to be the industry view).
          *   *Supervaluationism:* It's true if it's true on all admissible precisifications. (Too complex for admin).
          *   *Stipulation/Convention:* We draw a line for convenience, acknowledging it's arbitrary. (Most likely).
          *   *Degree Theory (Fuzzy Logic):* Truth comes in degrees. A 39k word story is 0.9 "novel".

  3.  **Drafting - Section by Section:**

