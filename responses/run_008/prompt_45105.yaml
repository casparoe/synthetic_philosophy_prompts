      *   *Check:* Did I address the "unable" ambiguity? Yes, by distinguishing between the nature of justice and the nature of humans.
      *   *Check:* Did I validate the first part? Yes, confirmed their reading is correct.
      *   *Check:* Is the flow logical? Start with the connection, then answer the three specific questions.

  7.  **Final Polish:** (Mental check of the "Justice, Might" logic).
      *   Ideal: Justice rules.
      *   Reality: Justice is weak (people break it).
      *   Ideal: Might serves Justice.
      *   Reality: Might is strong, Justice is argued.
      *   Compromise: We call Might "Justice" so people obey it without arguing.
      *   This logic needs to be clear in the explanation.

