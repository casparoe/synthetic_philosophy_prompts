prompt: |-
  You're a professional philosopher who works on cultural property ethics and also has hands-on museum experience, so please think carefully about this before writing -- maybe start with a quick brainstorm of the principles involved, then build the procedure. Here's my situation: I'm the registrar at a mid-sized university museum, and we hold something like 4,000 objects acquired between roughly 1890 and 1940 through channels that range from documented field excavations with permits to, honestly, a lot of stuff that arrived via missionary societies, colonial administrators' estates, and auction purchases whose earlier history is a total blank. We now get four or five restitution or repatriation requests a year, they're getting more frequent, and right now we handle them ad hoc: whichever curator knows the region drafts a memo, the director has a feeling, and the board rubber-stamps whatever protects us legally. That obviously can't continue.

  What I want from you is a decision procedure my team can actually run on a claim: an ordered set of questions, what counts as a sufficient answer to each, which answers stop the procedure with a clear no, and -- this part matters -- the places where the procedure should halt and hand the decision to a person because the question is one of values rather than facts, with some guidance on how that person should frame the value question instead of just "use judgment." Ground it in the actual philosophy: the tension between cultural internationalism and cultural nationalism, the gap between legal title and moral claim, the universal-museum argument and its critics, and whether restitution demands are best understood as property claims or as something more like apology and repair. My own working instinct is that the crucial line is between objects taken in some discrete violent event (a punitive expedition, a battlefield) and objects that trickled out through markets that were deeply distorted by colonial power but where no one could point to a specific theft -- but I can't tell whether that distinction does real moral work or just tracks whatever happens to be easy to document, so stress-test it rather than adopting it.

  Constraints: two weeks per claim at most, run by me (art history MA, no legal training) plus one curator, legal counsel only for actual liability questions, and the board has to sign off on anything we return because of deaccessioning rules. Then run the procedure on three cases: a set of brass plaques looted in a punitive expedition and bought at auction by our founder in 1912; a marble frieze fragment purchased in good faith from a dealer in 1926 in what was then a colonial possession, whose national museum now wants it back; and ancestor remains donated by a collector's family in the 1950s that a descendant community wants returned for reburial but which our anthropology wing considers research-essential. Be honest about where the procedure will misfire, and flag any case-type where I suspect it hands the board a respectable excuse to say no to something that really should go back -- I'd rather see that failure mode now than discover it in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in cultural property ethics + hands-on museum experience.
      *   **Task:** Create a decision procedure for restitution/repatriation claims for a mid-sized university museum.
      *   **Context:** 4,000 objects (1890-1940), mixed provenance (excavations, missionaries, colonial admins, auctions). Current process is ad hoc/legalistic.
      *   **Requirements:**
          *   Brainstorm principles first.
          *   Ordered set of questions (decision tree).
          *   Define sufficient answers.
          *   Identify "stop" points (clear no).
          *   Identify "value judgment" hand-off points (where philosophy matters, not just facts).
          *   Ground in philosophy (internationalism vs. nationalism, legal vs. moral, universal museum, property vs. repair).
          *   Stress-test the user's instinct (discrete violence vs. structural distortion).
          *   Constraints: 2 weeks per claim, Registrar + Curator lead, Legal only for liability, Board sign-off required.
          *   Test on three specific cases (Benin Bronzes type, Colonial Frieze, Ancestral Remains).
          *   Honesty about failure modes (where the procedure might enable a "respectable no" for something that should go back).

  2.  **Brainstorming Principles (Philosophical & Practical):**
      *   *Cultural Nationalism (Merryman):* Objects belong to the culture that created them; source communities have priority.
      *   *Cultural Internationalism:* Objects belong to humanity; encyclopedic museums preserve access and safety.
      *   *Legal Title vs. Moral Title:* You might own it legally (statute of limitations, good faith purchase) but not morally (unjust enrichment, tainted chain).
      *   *Harm & Repair:* Is restitution about returning property or repairing historical harm/relationships? (Corrective Justice).
      *   *The "Violence vs. Market" Distinction:* User's instinct. Does it hold? *Critique:* Markets under colonialism *were* coercive. Drawing a hard line might let structural theft off the hook.
      *   *Human Remains:* Different category entirely. Dignity vs. Research. Usually tilts heavily toward repatriation (NAGPRA spirit, even if not legally bound).
      *   *Procedural Justice:* The process must be transparent, consistent, and respectful to claimants.
      *   *Constraints:* Time (2 weeks is tight for deep provenance), Resources (Registrar + Curator), Authority (Board has final say).

  3.  **Developing the Decision Procedure (The "Algorithm"):**
      *   Need phases: Intake -> Fact Finding -> Ethical Assessment -> Recommendation.
      *   Need clear "Gates."
      *   Need specific "Value Hand-off" points where the Registrar/Curator can't decide alone and must frame the question for the Board/Committee.

      *   *Phase 1: Threshold & Standing.* Is the claimant legitimate? Is the object identified?
      *   *Phase 2: Provenance & Acquisition.* How did it get here? (The User's Distinction comes in here).
      *   *Phase 3: Ethical Weighting.* This is where the philosophy happens.
      *   *Phase 4: The Hand-off.* Framing the decision for the Board.

      *   *Refining the "Violence vs. Market" Distinction:* I need to challenge this. A "market" purchase in 1920s Africa often implies a power imbalance so severe it amounts to coercion. However, for a *procedure*, we need evidentiary standards. "Documented Looting" is easier to prove than "Structural Coercion." I will build a tiered system: Tier 1 (Clear Violation), Tier 2 (Ambiguous/Structural), Tier 3 (Clean).

      *   *Value Hand-offs:* The Board shouldn't just vote Yes/No. They need to answer: "Do we prioritize our legal safety or our moral standing?" "Do we value research over community dignity?"

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Validity.* (Fast check).
      *   *Step 2: The "Red Flag" Check.* (War, Looting, Human Remains). If yes -> Strong presumption to return.
      *   *Step 3: The "Gray Zone" Check.* (Colonial market, missionary, admin). This is the hard part.
      *   *Step 4: The Harm Assessment.* What does the claimant want? (Access? Ownership? Reburial?)
      *   *Step 5: The Board Question.* Frame it ethically.

  5.  **Stress-Testing the User's Instinct:**
      *   User thinks: Discrete Violence = Return; Colonial Market = Keep/Negotiate.
      *   Philosopher Critique: This privileges *evidence* over *ethics*. Colonial markets were often fungible with looting. If we only return "smoking gun" theft, we uphold colonial property norms.
      *   Adjustment: The procedure must acknowledge that "Legal Purchase" $\neq$ "Ethical Acquisition" in colonial contexts. The "Value Hand-off" must force the Board to admit they are keeping it for *utility*, not *right*.

  6.  **Running the Cases:**
      *   *Case 1: Brass Plaques (Benin 1897).* Punitive expedition. Clear looting.
          *   Procedure outcome: Return.
          *   Why? Tier 1 violation. No moral defense.
      *   *Case 2: Marble Frieze (1926 Colonial).* Good faith purchase, but colonial context.
          *   Procedure outcome: Gray Zone. Hand-off to Board.
          *   Value Question: "Do we prioritize the 'Universal Museum' argument (keeping it for study/display) over the Source Nation's sovereign claim, acknowledging the purchase power was derived from colonial privilege?"
      *   *Case 3: Ancestor Remains (1950s).*
          *   Procedure outcome: Return (with research negotiation).
          *   Why? Human dignity trumps research utility in modern ethics.
          *   Risk: The procedure might let the Board say "Research is vital." Need to flag this as a failure mode if the procedure doesn't weight dignity high enough.

  7.  **Identifying Failure Modes:**
      *   *The "Evidence Trap":* If we demand too much proof of theft, structural theft gets a pass.
      *   *The "Board Shield":* The procedure gives the Board a checklist to say "We followed the steps" while voting No on ethical grounds.
      *   *Time Limit:* 2 weeks is very short for provenance research on gray market items. This might force "Status Quo" decisions (keep it) due to lack of info.

  8.  **Final Review against Constraints:**
      *   Registrar + Curator lead? Yes.
      *   Legal only for liability? Yes.
      *   Board sign-off? Yes.
      *   Philosophical grounding? Yes (Merryman, Corrective Justice, etc.).

  9.  **Writing the Response:**
      *   Tone: Professional, empathetic, rigorous, slightly academic but practical.
      *   Structure: Principles -> Procedure -> Case Studies -> Failure Modes.
      *   *Self-Correction during drafting:* Make sure I don't just give a flowchart. I need to explain *why* the questions are asked philosophically. Ensure the "Value Hand-off" is distinct from the "Fact Check."

      *(Self-Correction on the User's Instinct)*: I need to be careful not to dismiss the distinction entirely. It *is* useful for triage. But it shouldn't be the *final* ethical arbiter. I will frame it as an "Evidentiary Presumption" rather than a "Moral Boundary."

      *(Refining the Human Remains case)*: This is the trickiest. University museums often fight hard on research. I need to be firm that ethically, remains are not "objects." The procedure should reflect that categorical difference.

      *(Refining the Time Limit)*: 2 weeks is unrealistic for deep provenance. I need to add a "Deferral" option if research isn't done, otherwise the default is "Keep," which is biased. I will add a "Insufficient Evidence" protocol that doesn't default to retention automatically.

  10. **Final Polish:** Check against the prompt's specific request for "places where the procedure should halt and hand the decision to a person because the question is one of values." Ensure these are highlighted clearly.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### Part 1: Philosophical Brainstorm & Principles

  Before we build the machinery, we must agree on the moral architecture. You are operating in the gap between **Cultural Nationalism** (objects belong to the culture of origin) and **Cultural Internationalism** (objects belong to humanity, preserved best in encyclopedic museums). Your current ad-hoc process defaults to *Legal Title* (Internationalism/Property Law). We need to shift the default to *Moral Title* (Corrective Justice).

  Here are the core tensions your procedure must navigate:

  1.  **Property vs. Personhood:** Is the object a chattel to be owned, or a constituent part of a living community's identity? (Hegel vs. Locke).
  2.  **Discrete Harm vs. Structural Injustice:** Your instinct distinguishes between "looting" (discrete) and "colonial market" (structural). *Philosophical Stress Test:* This distinction is evidentiary, not moral. A market purchase in 1920s Nigeria was often made possible by the same coercive power structures as a punitive expedition. However, for a *procedure*, we must treat them differently because the burden of proof differs. We will treat "Discrete Violence" as a **Presumption to Return** and "Structural Distortion" as a **Value Hand-off**.
  3.  **Utility vs. Right:** The "Universal Museum" argument is utilitarian (more people see it here). Restitution is often deontological (they have a *right* to it regardless of utility). Your Board tends to vote Utilitarian. The procedure must force them to acknowledge when they are prioritizing utility over right.
  4.  **The "Clean Hands" Doctrine:** In equity, one cannot seek justice if one's own hands are dirty. If the museum's title rests on a colonial legal framework that excluded the source community from ownership, the title is legally valid but morally hollow.

  ### Part 2: The Decision Procedure (The "Ethical Triage Protocol")

  **Constraints:** 2 Weeks. **Actors:** Registrar (You), Curator. **Authority:** Board (Final Sign-off).
  **Goal:** Move from "Can we keep it?" to "Should we keep it?"

  #### Phase 1: Threshold & Standing (Days 1-3)
  *Goal: Filter frivolous claims and establish claimant legitimacy.*

  **Q1: Is the claimant a recognized representative of the source community or nation?**
  *   *Sufficient Answer:* Government ministry, recognized tribal council, or direct lineal descendant (for remains).
  *   *Stop Condition:* If the claimant is a private dealer or unaffiliated individual claiming "humanity" on behalf of everyone. (Refer to International Council of Museums guidelines).
  *   *Note:* Do not demand impossible bureaucratic proof from indigenous groups lacking Western-style governance. Use "reasonable evidence of representation."

  **Q2: Is the object positively identified in our holdings?**
  *   *Sufficient Answer:* Accession number matches description/provenance.
  *   *Stop Condition:* If the object cannot be located or identified. (Close file, note for future).

  #### Phase 2: Provenance & Acquisition Mode (Days 4-10)
  *Goal: Establish the "Moral Quality" of the acquisition. This is where we test your instinct.*

  **Q3: Does the acquisition chain involve documented discrete violence or illegal export at the time?**
  *   *Examples:* Punitive expeditions (e.g., Benin 1897), battlefield looting, theft from protected sites, export in violation of *source* law existing at the time.
  *   *Sufficient Answer:* Yes, documented by expedition logs, police reports, or contemporary correspondence.
  *   *Procedure Outcome:* **Presumption to Return.** The procedure halts here. You draft a recommendation for restitution. The Board can only overturn this with a unanimous vote citing *immediate physical danger* to the object (not "we want to keep it").
  *   *Philosophical Ground:* Corrective Justice. The harm is specific and the causal link is clear.

  **Q4: If Q3 is No, was the object acquired via a "Colonial Context Market"?**
  *   *Definition:* Acquired 1890-1940 in a territory under colonial administration, via missionaries, administrators, or dealers operating in that zone, without explicit consent of the creator/cultural owner.
  *   *Sufficient Answer:* Yes, provenance shows purchase from estate of colonial officer/missionary, or dealer in colonial capital.
  *   *Procedure Outcome:* **Value Hand-off.** (See Phase 3).
  *   *Philosophical Ground:* This addresses your instinct. We acknowledge that "legal purchase" in a colonial market is morally ambiguous. The market itself was the distortion. We cannot fact-check our way out of this; we must value-judge it.

  **Q5: Is the object human remains or sacred/ritual object of ongoing significance?**
  *   *Sufficient Answer:* Yes, confirmed by Curator/Community consultation.
  *   *Procedure Outcome:* **Presumption to Return.** (Unless Q3 applies, then definitely return).
  *   *Philosophical Ground:* Personhood/Dignity trumps Property/Research. (Kantian ethics: treat humanity as an end, never merely as a means).

  #### Phase 3: The Value Hand-off (Days 11-13)
  *Goal: Frame the decision for the Board. This is the most critical section.*

  If the claim lands in **Q4 (Colonial Context Market)**, facts are insufficient. You must not ask the Board "Should we return this?" You must ask them to resolve the ethical tension.

  **The Registrar's Memo to the Board must include:**
  1.  **The Moral Deficit:** "We hold legal title, but the acquisition relied on power asymmetries inherent to colonial rule."
  2.  **The Competing Goods:**
      *   *Good A (Retention):* Continued access for university research and public display (Utilitarian/Internationalist).
      *   *Good B (Restitution):* Repairing historical relationship and acknowledging source community sovereignty (Corrective Justice/Nationalist).
  3.  **The Framed Question:** "Does the university's educational mission require retaining this specific object, enough to justify maintaining a title derived from colonial privilege?"

  *Constraint:* The Board cannot answer "No" without providing a **Stewardship Plan**. If they vote to keep, they must fund specific programming (digital access, loans, community collaboration) that mitigates the moral deficit. They cannot simply sit on it.

  #### Phase 4: Final Review & Logistics (Days 14)
  *Goal: Execution.*

  **Q6: Are there legal liabilities preventing transfer?**
  *   *Actor:* Legal Counsel (Only now).
  *   *Stop Condition:* If return violates specific donor restrictions that cannot be waived or state laws (rare for this period, but check).
  *   *Note:* If legal counsel says "We *can* keep it," the Board must still answer the Phase 3 Value Question. Legal ability $\neq$ Moral permission.

  ---

  ### Part 3: Running the Cases

  Here is how the procedure handles your three scenarios.

  #### Case 1: Brass Plaques (Benin 1897 Expedition)
  *   **Phase 1:** Claimant is Nigerian Government/Royal Court. (Pass).
  *   **Phase 2, Q3:** Acquired 1912, but origin is 1897 Punitive Expedition.
      *   *Fact:* Expedition logs confirm looting. Founder bought at auction shortly after.
      *   *Result:* **Presumption to Return.**
  *   **Phase 3:** Skipped.
  *   **Outcome:** Recommendation is Return. Board would need unanimous vote to keep based on "physical danger," which is unlikely.
  *   **Verdict:** **Return.** The procedure works as intended. The "Discrete Violence" distinction holds here because the evidence is clear.

  #### Case 2: Marble Frieze (1926 Colonial Purchase)
  *   **Phase 1:** Claimant is National Museum of former colony. (Pass).
  *   **Phase 2, Q3:** No evidence of battlefield looting or illegal export *at the time* (colonial law allowed export).
  *   **Phase 2, Q4:** Purchased from dealer in colonial possession.
      *   *Result:* **Value Hand-off.**
  *   **Phase 3:** You draft the memo.
      *   *Framing:* "We bought this legally under British/French colonial law. However, that law excluded the local population from owning their heritage. Keeping it serves our art history department. Returning it serves diplomatic repair and sovereignty."
      *   *Board Choice:* If they vote Keep, they must fund a digital repatriation project and a 5-year loan agreement.
  *   **Verdict:** **Negotiated Solution.** This is where the procedure shines. It prevents a flat "No" based on legal title. It forces the Board to pay a "moral tax" (programming/loans) if they retain the object.

  #### Case 3: Ancestor Remains (1950s Donation)
  *   **Phase 1:** Claimant is Descendant Community. (Pass).
  *   **Phase 2, Q5:** Human remains.
      *   *Result:* **Presumption to Return.**
  *   **Conflict:** Anthropology wing claims "Research Essential."
  *   **Procedure Check:** The procedure prioritizes Q5 (Dignity) over Utility.
  *   **Verdict:** **Return.** However, the procedure allows for a *conditional* return.
      *   *Condition:* "We will repatriate, but request permission for non-destructive scanning or sampling prior to return."
      *   *If Community says No:* You return them unscanned. The procedure mandates dignity overrides research.
  *   **Risk:** Your anthropology faculty may revolt. The procedure protects *you*, but it exposes the tension between the Museum and the University.

  ---

  ### Part 4: Failure Modes & Honest Critique

  You asked me to flag where this might misfire or give the Board a "respectable excuse" to do the wrong thing. Here are the vulnerabilities:

  **1. The "Evidence Trap" (The Colonial Market Loophole)**
  *   *Failure:* In Case 2 (Frieze), the Board can say, "Since Q3 (Violence) was not met, we are not obligated to return." They can treat the "Value Hand-off" as optional or weigh "Educational Mission" heavily enough to always vote Keep.
  *   *Why:* The procedure creates a "Safe Harbor" for colonial market acquisitions. By distinguishing Q3 (Violence) from Q4 (Market), I have inadvertently validated your instinct's weakness. It makes structural theft easier to keep than battlefield looting.
  *   *Mitigation:* You must add a **Sunset Clause**. If the Board votes to Keep on a Q4 case, the decision is valid for only 5 years. After that, the claim can be reopened. This prevents permanent retention based on temporary "research needs."

  **2. The "Two-Week Bluff"**
  *   *Failure:* Provenance research on Q4 cases (Colonial Markets) often takes months, not days. In a 2-week window, you will likely default to "Insufficient Evidence of Theft," which defaults to Retention.
  *   *Why:* The procedure favors the status quo when information is missing.
  *   *Mitigation:* Add a **"Deferral Status."** If provenance is unclear after 2 weeks, the object is not "Cleared to Keep." It is "Quarantined." It cannot be displayed or published until the claim is resolved. This removes the incentive to drag feet.

  **3. The "Research Essential" Veto (Case 3 Risk)**
  *   *Failure:* In the Ancestral Remains case, the Board (composed of academics) may define "Research Essential" so broadly that it swallows the "Presumption to Return."
  *   *Why:* University Boards prioritize knowledge production.
  *   *Mitigation:* You need an external ethicist or community representative on the voting committee for Q5 cases. If the procedure remains internal (Registrar + Curator + Board), it is structurally biased against repatriation of remains. *Recommendation:* For Q5, the Board must ratify a decision made by a separate "Ethics & Community Committee" that includes external voices.

  **4. The "Legal Shield"**
  *   *Failure:* Legal Counsel enters at Phase 4. If they find *any* liability risk (e.g., donor lawsuit), they will advise against return. The Board will hide behind "Legal Advice" to avoid the Value Question.
  *   *Mitigation:* Change the protocol. Legal Counsel must assess "Risk of Return" vs. "Risk of Retention" (reputational harm). If Legal says "It's risky but legal," the Board must vote on the Ethics, not the Risk.

  ### Final Recommendation for Implementation

  This procedure is stronger than your current ad-hoc system, but it is not a magic wand. It shifts the burden of justification from the Claimant to the Museum.

  **Your Immediate Next Step:**
  Do not present this as a "Restitution Policy." Present it as a **"Collections Ethics & Risk Management Protocol."**
  *   Boards hate "Restitution" (sounds like losing assets).
  *   Boards love "Risk Management" (sounds like protecting the institution).
  *   By framing the "Value Hand-off" as a way to protect the museum from reputational risk, you get the tools to do the right thing without triggering immediate defensiveness.

  **On your Instinct:** Keep the distinction between Discrete Violence and Colonial Markets for *triage speed*, but do not let it become the *moral boundary*. Ensure your Board understands that Q4 (Market) cases are not "Safe to Keep," they are "Ethically Complex." If they treat Q4 as "Clear Title," the procedure has failed.

  **One final philosophical note:** Restitution is not the end of the relationship; it is the beginning of a new one. If your procedure ends with a "No," it should almost always include an offer of partnership (loans, digital access, funding). If it ends with a "Yes," it should include an offer of continued collaboration. The object moves, the relationship stays. That is the only way to resolve the tension between Nationalism and Internationalism.
