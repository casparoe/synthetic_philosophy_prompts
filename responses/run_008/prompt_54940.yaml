      *   *The Crux:* Leibniz would reject Black's setup *a priori*. For Leibniz, if the spheres are distinct substances, they *must* differ qualitatively (e.g., their relational properties to the universe). But in Black's universe, there *is* no universe to relate to.
      *   *Substance vs. Object:* Leibniz's "substance" mirrors the *whole* universe. Black's "spheres" are in an *empty* universe. A Leibnizian substance *cannot* exist in Black's universe. Therefore, Black isn't counter-exemplifying Leibniz's substances; he's counter-exemplifying a modern abstraction of PII.

