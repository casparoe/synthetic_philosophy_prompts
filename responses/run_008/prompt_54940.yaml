  2.  **Deconstruct Leibniz (Discourse on Metaphysics, §9):**
      *   *The Claim:* "It is not true that two substances resemble each other entirely and differ *solo numero*." (No two substances are exactly alike except in number).
      *   *The Meaning of "Solo Numero":* This is a Scholastic term. It means "by number alone." In Scholastic metaphysics (e.g., Aquinas, Scotus), matter was often thought to individuate things of the same species. Two drops of water have the same form/qualities but are distinct because they occupy different matter/locations. Leibniz is rejecting this. He's saying numerical difference *must* be grounded in qualitative difference. You can't just say "this one" and "that one" without a *reason* (haecceity or qualitative property).
      *   *The Role of Substance:* For Leibniz, a substance isn't just a physical object (like a sphere). It's a complete concept, a mirror of the universe, containing all its past, present, and future predicates.
      *   *The Argument:* Based on the Principle of Sufficient Reason (PSR). If two substances were exactly alike, God would have no reason to put one *here* and one *there*, or to create both. Since God acts with perfect reason, such a scenario is impossible.
      *   *Key Takeaway:* Leibniz's PII is a *consequence* of his deeper metaphysics (Complete Concept Theory + PSR + Theology). It's not a freestanding logical rule.

  3.  **Deconstruct Max Black (1952):**
      *   *The Setup:* A universe with nothing but two iron spheres. They are exactly alike in intrinsic properties (size, shape, composition, temperature, etc.). They are symmetrically placed (say, 2 miles apart from each other in an empty void).
      *   *The Claim:* This is a possible world. Therefore, PII is not a necessary truth.
      *   *The Target:* Black is targeting the *logical* necessity of PII. He treats it as a principle about "objects" and "properties" in a logical sense, stripped of Leibnizian theology.
