      *   Okay, I need to make sure I don't get too bogged down in technical jargon. Keep it accessible but rigorous.

      *   *Structure:*
          1.  Condolences & Validation.
          2.  The Diagnosis: Sam conflated two theories.
          3.  The Solution: How to keep Dad without Holmes.
          4.  The "Exists" Equivocation: Why it's okay here.
          5.  The Verdict on Comfort.

  8.  **Self-Correction during drafting:** I initially thought about telling them to reject premise 3. But if they want the comfort of Eternalism, they should *keep* the idea that Dad exists (tenselessly). The problem is the slide to Holmes. The slide happens because Sam treats "thinking about" as the criterion for existence. It's not. The criterion for Eternalism is "occupying a coordinate in spacetime." Dad does; Holmes doesn't. I need to make that distinction crystal clear.

      *   *Revised Plan:*
          1.  Validate the grief and the sharpness of the user's objection (Holmes is a killer counterexample).
          2.  Identify Sam's conflation: Eternalism (Time) vs. Meinongianism (Objects).
