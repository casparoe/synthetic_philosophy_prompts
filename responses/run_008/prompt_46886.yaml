      *Wait, one more thing:* The user asked "what am I paying for it?" If I reject the generalization, do I lose Dad? No. If I accept the generalization, I lose my grip on reality. So the cost of *not* accepting the generalization is zero, philosophically speaking. The cost of accepting Sam's full argument is sanity.

