answer: |-
  Your intuition is spot on. The pop-history summary you quoted commits a classic error: it conflates a **methodological warning** with a **moral philosophy**.

  A historian of historiography would agree with about 40% of that summary, find 40% of it to be a misleading simplification, and reject the final 20% as factually incorrect regarding Butterfield's actual views.

  Here is a breakdown of what holds up, what doesn't, and why your hunch about Butterfield's religiosity matters.

  ### 1. What the Summary Gets Right
  *   **The Origin:** It is true that Herbert Butterfield coined the pejorative term in his 1931 book *The Whig Interpretation of History*.
  *   **The Target:** It is true that he was critiquing a specific tradition of English historians (like Thomas Macaulay) who portrayed English history as a inevitable march toward Protestantism, constitutional monarchy, and civil liberty.
  *   **The Core Sin:** The summary correctly identifies the core "Whig" sin as **present-mindedness**. Whig historians organize the past by selecting only those elements that seem to contribute to the present, treating the past as merely a prelude to "now."

  ### 2. What is Simplified or Distorted
  *   **"Progress" vs. "Inevitability":** The summary defines Whig history as the belief that "things have on the whole gotten better." While Whigs did believe this, Butterfield's critique was more subtle. He argued that Whig history distorts the past by assuming the present was *inevitable*. It turns historical actors into either "heroes" (those who helped bring about the present) or "villains" (those who resisted it). Butterfield wanted historians to understand why people acted as they did in *their* context, not whether they helped or hindered *our* context.
  *   **The Definition of "Value-Neutral":** The summary claims Butterfield wanted historians to be "value-neutral." This is a simplification of his call for **methodological discipline**. Butterfield argued that making moral judgments *impedes understanding*. If a historian is busy condemning a 17th-century figure for not having 21st-century values, they stop trying to understand the 17th-century constraints that shaped that figure. This is a rule of professional conduct, not necessarily a statement on the nature of truth.

  ### 3. What Is Just Wrong (Your Hunch Was Correct)
  This is where the pop-history book fails significantly.

  *   **Butterfield was not a Moral Relativist:** The summary claims Butterfield believed historians must "drop all judgments of better and worse" and treat "every period as equally valid." **This is false.** Butterfield was a devout Methodist Christian. He believed deeply in moral truth, sin, and Providence. He did not believe the Middle Ages were "equally valid" to the modern era in a moral sense. He believed that historians should not act as *judges* in a courtroom, but that did not mean they had to be moral blanks.
  *   **The "Equally Valid" Claim:** Butterfield never argued that all historical periods are morally equivalent. He argued that all periods are **equally worthy of study on their own terms.** There is a massive difference between saying "slavery was acceptable then, so we can't judge it" (relativism) and "we must understand the economic and social structures that made slavery persist before we can analyze it" (historical method). The pop-book confuses *suspension of judgment for the sake of analysis* with *denial of moral reality*.
  *   **The Remedy:** The summary states Butterfield's remedy was that "historians should be value-neutral." Butterfield's actual remedy was that historians should practice **empathy** and focus on **unintended consequences**. He wanted historians to trace how results often arose from the clash of individuals pursuing their own ends, rather than a grand design of liberty.

  ### 4. Does the Conclusion Survive?
  **No.** The book's conclusion is: *"Good history therefore never says things got better, it only describes what changed, and treats every period as equally valid."*

  A historian of historiography would reject this conclusion for three reasons:

  1.  **It creates a false dichotomy:** One can acknowledge material or moral progress (e.g., the eradication of smallpox, the expansion of suffrage) without falling into Whiggism. Whiggism is the error of assuming that progress was *inevitable* or that the *only* reason to study the past is to track that progress. You can say "things got better" without saying "things *had* to get better."
  2.  **It mandates amoral history:** By insisting history "never says things got better," the summary demands historians ignore genuine human suffering and liberation. Modern historiography generally agrees that while we must avoid anachronism, we are not forbidden from recognizing tyranny or justice.
  3.  **It misreads Butterfield:** Butterfield did not argue that history is *only* description ("what changed"). He argued history is about understanding the **complexity of causation**. He wanted "good history" to explain the *process*, not just the *outcome*.

  ### Summary of the Correction
  If we were to rewrite the pop-book's summary to satisfy a specialist, it would look like this:

  > "Whig history, a term coined by Herbert Butterfield in 1931, is the tendency to write history from the standpoint of the present, organizing the past into a story of inevitable progress toward current values. Butterfield attacked historians who saw English history merely as a march toward Protestant liberty. His remedy was not moral relativism, but methodological empathy: historians should avoid judging the past by present standards because it obscures the genuine motivations of historical actors. Good history does not deny that change occurs, but it refuses to view the past solely as a failed or successful attempt to become the present."

  **Verdict:** Your intuition was correct. The pop-history book took Butterfield's warning against **anachronism** and twisted it into a mandate for **moral nihilism**. Butterfield wanted historians to be humble, not blind.
