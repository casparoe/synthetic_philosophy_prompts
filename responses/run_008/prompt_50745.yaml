  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did Butterfield actually say historians should be value-neutral?
      *   *Correction:* He argued against *judging* historical figures (the "judgment of history"), favoring *understanding*. But he didn't argue for a lack of values in the historian's life. He argued for a specific professional discipline to ensure accurate understanding. The pop-book turns a professional discipline into a philosophical stance on truth.
