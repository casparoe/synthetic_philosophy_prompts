      *Overall:* Maya wins on the specific terrain of *long-term AI risk*, where the definition of "rogue" implies superhuman capability. Dan wins on a surface-level game theory level. I should declare Maya more right *in this specific context*.

      *Missing:* The "efficiency tax." SSA doesn't require exact symmetry, just that humans aren't *disadvantaged*. But if the rogue AI is faster, symmetry doesn't matter. Also, the distinction between "deception as a tactic" vs "deception as an architectural property."

