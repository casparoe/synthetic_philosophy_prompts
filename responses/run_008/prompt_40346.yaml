      *   *Origin:* Often associated with Paul Christiano and the AI alignment community (e.g., AI Safety via Market Making, Iterated Amplification).
      *   *Core Claim:* If there is a strategy $S$ that allows an unaligned AI to achieve its goals (e.g., takeover), then an aligned AI assisted by humans could also use $S$ (or a variant $S'$) to achieve the humans' goals (e.g., prevent takeover), assuming the aligned AI has comparable capabilities.
      *   *Nuance:* It usually assumes the aligned system isn't *structurally* prevented from using effective strategies due to alignment constraints, unless those constraints are the very thing preventing the bad outcome (e.g., "don't kill everyone").
      *   *Key Tension:* Alignment often implies constraints (honesty, transparency, obedience) that might reduce strategic flexibility compared to an unconstrained optimizer.

  3.  **Evaluate Move by Move:**

