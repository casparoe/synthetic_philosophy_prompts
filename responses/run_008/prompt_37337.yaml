  4.  **Identifying the "Single Feature":**
      *   What makes the Guardian lose? It's the *public perception of legitimacy* regarding the *partisan nature* of the intervention. Specifically, the **plausible deniability of the government's motive**. If the government's motive was clearly treasonous, refusal is safe. If it's *contestable* (grey area), refusal looks partisan.
      *   *Feature:* The "Contestability of the Pretext."

  5.  **Analyzing the Removal of the Feature:**
      *   If the pretext was blatant (e.g., "I want to stay in power forever"), the Guardian wins. Refusal is popular. The "legitimacy grievance" doesn't stick.
      *   So, the scenario relies entirely on the ambiguity.

  6.  **Analyzing the Defender's Attack:**
      *   *Attack:* "An unused backstop is no backstop." If you never use it in grey areas, when do you use it? Only in black-and-white coups? By then it's too late.
      *   *Evaluation:* Does this work? It challenges the coherence of the Insurance view. It suggests the Insurance view is cowardly.
