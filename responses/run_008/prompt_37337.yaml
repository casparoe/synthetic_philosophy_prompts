  *(Final Polish on "Settled vs. Contested"):* I will add explicit markers like "[Scholarly Consensus]" or "[Live Dispute]" or weave it into the narrative carefully. The prompt asks me to "flag clearly where constitutional scholars themselves disagree." I will use parentheticals or specific phrasing to ensure this is clear.

