          *   Evaluate plausibility for each claim.
          *   Evaluate falsifiability (could it be false?).
          *   Evaluate whether it actually supports the brother-in-law's conclusion (more weapons vs. sufficient weapons).
          *   Address the "security dilemma" (preparing for war causes the other side to prepare, making everyone less safe).
