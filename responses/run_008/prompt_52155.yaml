      *   **The Problem:** The brother-in-law uses the Latin phrase *Si vis pacem, para bellum* ("If you want peace, prepare for war") as a conversation stopper to justify high defense spending/nuclear arsenals. The user feels the phrase is doing too much work and wants to unpack it.
      *   **The Task:** Break down the slogan into distinct claims (a "menu" for the dinner table).
