      *   Why does the brother-in-law use it? To argue against cutting weapons.
      *   Why is the user skeptical? Because cutting weapons might *increase* peace (dovish view).
      *   Key tension: Deterrence vs. Escalation/Security Dilemma.

  3.  **Drafting the "Menu" of Claims (Iterative Process):**

      *   *Level 1: The Truism/Weak Claim.*
          *   Idea: You can't defend yourself if you have no sticks.
          *   Refinement: "Total helplessness invites attack."
          *   Does it support BIL? Only if "preparing" means "having *some* weapons," not "having *more* weapons."
          *   Security Dilemma: Doesn't really trigger it.

      *   *Level 2: The Deterrence Claim (Causal).*
          *   Idea: If I look strong, you won't hit me.
          *   Refinement: "Visible strength makes aggression too costly for others."
