answer: |-
  This is an excellent set of questions. You have correctly identified that the battle over deflationism is rarely fought over the T-schema itself ("'p' is true iff p"). Everyone accepts the T-schema. The battle is fought over whether the T-schema *exhausts* the concept of truth, or whether it merely captures the surface grammar while hiding a deeper metaphysical engine.

  Here is a map of where deflationism is exposed, ranked by the severity of the pressure they exert, followed by an assessment of the "unfalsifiability" charge and your specific worry about foreign languages.

  ### 1. The Explanatory Objection (Rank: Serious to Potentially Fatal)
  **The Objection:** We use truth in explanations. "The astronaut survived *because* her beliefs about the oxygen levels were true." If truth is merely a logical device for disquotation, it cannot play a causal or explanatory role. A substantive property (like correspondence to reality) can explain success; a linguistic shortcut cannot. Hilary Putnam and Hartry Field have pressed this hard: if truth is explanatory, it must be a robust naturalistic property.

  **The Deflationist Reply:** The deflationist argues this is a category mistake. The explanation isn't "Truth caused survival." The explanation is: "She believed $p$, and $p$, so she acted in a way that ensured survival." The truth predicate is just a proxy for the fact itself. The *fact* that there was oxygen explains the survival; saying her belief was "true" is just a way of re-asserting the fact without naming it.

  **Assessment:** This is the strongest pressure point.
  *   **Why it's serious:** It forces the deflationist to paraphrase away a very natural way we speak about the world. If we accept that *generalizations* about truth explain things (e.g., "True beliefs generally lead to successful action"), the deflationist must unpack this into an infinite conjunction of specific cases. This feels like it misses the unified reason *why* true beliefs succeed (i.e., that they hook onto the world).
  *   **Deflationist Concession:** A sophisticated deflationist (like Field) might concede that "truth" *as we use it* isn't doing the explaining, but admit we need a *replacement* concept (like "idealized justification" or "correspondence-lite") for scientific explanation. This moves them toward "Quasi-Deflationism."
  *   **Verdict:** If you feel strongly that truth *itself* is an explanatory natural kind, this is fatal. If you think facts do the explaining and truth is just a label, it's manageable.

  ### 2. Blind Ascription and Foreign Languages (Rank: Serious)
  **The Objection:** (This addresses your specific worry, which is **not silly**). Disquotation works when you understand the sentence. "Snow is white" is true iff snow is white. But I can say, "Everything in this French report is true," without speaking French. I cannot disquote the sentences. To evaluate the truth of the French sentence, I seem to need a relation of *translation* or *reference* between the French sentence and the world. But theories of reference and translation are often substantive (causal theories of reference, etc.).

  **The Deflationist Reply:** Deflationists distinguish between *truth* and *truth-in-L*. They argue you can be a deflationist about truth while being a substantive realist about *reference* or *translation*. You say: "Sentence $S$ in French is true iff $S$ translates to $p$ in English, and $p$."

  **Assessment:**
  *   **Why it's serious:** It reveals that deflationism about truth often "piggybacks" on substantive theories of meaning. If the heavy lifting is done by the theory of translation/reference, is truth really the only thing being deflated? It risks making "truth" a dependent variable that inherits substantiveness from semantics.
  *   **Deflationist Concession:** Most deflationists (like Paul Horwich) concede that a theory of *meaning* is needed to apply truth across languages. They maintain that *truth itself* remains deflationary, even if *meaning* is not.
  *   **Verdict:** This pressures the view to admit that truth isn't *purely* logical; it relies on a substantive link between language and world (reference). It doesn't kill the view, but it complicates the "purity" of the deflation.

  ### 3. The Norm of Assertion/Belief (Rank: Awkward)
  **The Objection:** Timothy Williamson and others argue that truth is the constitutive norm of assertion: "You ought to assert $p$ only if $p$ is true." If truth is just a device for endorsement, it lacks the "weight" to ground an *ought*. Why ought I assert what is disquotable? The norm seems to require a valuable property (accuracy, correspondence) that we are aiming at.

  **The Deflationist Reply:** The deflationist argues this begs the question. It assumes norms require substantive properties to ground them. The deflationist says the norm is simply: "Assert $p$ only if $p$." The word 'true' adds nothing to the norm. The "weight" comes from the social practice of assertion, not the metaphysics of truth.

  **Assessment:**
  *   **Why it's awkward:** It feels deflationary about the *norm* as well as the truth. It makes the norm of assertion seem like a trivial grammatical rule rather than an epistemic virtue.
  *   **Deflationist Concession:** They generally dismiss this as begging the question. They argue that if you think the norm requires a substantive property, you are already assuming anti-deflationism.
  *   **Verdict:** This is more of a conceptual unease than a logical defeater. It makes deflationism feel "thin" regarding epistemology, but it doesn't logically contradict the view.

  ---

  ### The "Unfalsifiability" Charge
  You asked: *Has deflationism been qualified into unfalsifiability?*

  **The Pattern:** You noticed that every objection is met with: "That's not a fact about truth, it's a fact about belief/assertion/language use."
  **The Assessment:** This is the central methodological risk of deflationism.

  1.  **Is it a bug?** Yes, if the deflationist uses this move to ignore data that clearly clusters around the concept of truth. If *every* robust feature of truth (explanation, normativity, value) is offloaded to neighboring concepts (belief, assertion, reference), one must ask: **What is left of 'truth' that is being deflated?** If truth has no nature, explains nothing, grounds no norms, and applies to foreign sentences only via substantive reference, is it doing any work at all?
  2.  **Is it a feature?** The deflationist argues **yes**. Their goal is *dissolution*, not reduction. They argue that philosophers have mistakenly reified a grammatical feature into a metaphysical problem. By pushing the substance to where it belongs (e.g., explanation belongs to facts, norms belong to practices), they are curing a philosophical confusion.

  **Honest Verdict:** Deflationism is not unfalsifiable, but it is **highly resilient to revision**. It survives by shrinking its target.
  *   **Falsification Condition:** Deflationism would be falsified if we found a phenomenon that *requires* a unified property of truth to explain, which cannot be paraphrased away into facts/practices. (The Explanatory Objection is the closest candidate).
  *   **The Cost:** The cost of this resilience is that deflationism often becomes a view about *the word 'true'* rather than the concept. It risks becoming a linguistic thesis ("'True' is a disquotational device") rather than a metaphysical one ("Truth has no nature").

  ---

  ### Your Specific Worry: Foreign Languages
  *"When I evaluate sentences in languages I don't speak... something like truth-in-a-language looks like it's doing real work there that the bare truth predicate doesn't."*

  **Is this silly?** No. This is a version of the "Generalization Problem" refined.

  **Does it pressure Deflationism?** Yes.
  Pure disquotationalism says: `$S$ is true iff $p$`.
  But for the French sentence, you cannot state the right-hand side ($p$) because you don't know the translation.
  So you must say: `$S$ is true iff $S$ means that $p$ and $p$`.
  This introduces **Meaning** (or Translation) as a prerequisite for Truth.

  **The Cut:**
  1.  **If Meaning is Substantive:** If your theory of "means that" involves causal relations to the world (reference), then Truth inherits that substantiveness. You are no longer a *pure* deflationist; you are a deflationist about truth *conditional on* a substantive theory of reference. (This is Hartry Field's position).
  2.  **If Meaning is Deflationary:** If you are also deflationary about meaning, you risk an infinite regress or emptiness.

  **Conclusion on this point:** Your worry identifies the exact boundary where deflationism usually stops. Most deflationists accept that **Truth is deflationary, but Reference/Meaning is not.** They concede that to apply truth across languages, you need a substantive link between words and world. If you find that unacceptable (i.e., if you think Truth and Reference stand or fall together), then this worry is a defeater for you. If you are okay with a hybrid view (Deflationary Truth + Substantive Reference), the worry is accommodated.

  ### Summary Ranking of Defeaters

  1.  **Serious / Potentially Fatal:** **The Explanatory Role.** If truth genuinely explains success in a way that facts alone do not (e.g., generalizations about truth-tracking), deflationism cannot account for it without paraphrase that loses the explanatory unity.
  2.  **Serious:** **Blind Ascription (Your French Worry).** Forces deflationism to rely on substantive semantics/reference, compromising the "purity" of the view.
  3.  **Awkward:** **Normativity.** Makes the norm of belief seem trivial, but relies on question-begging assumptions about what norms require.

  ### Final Advice
  If you are "basically sold," you are likely comfortable with the idea that philosophy often creates problems by reifying grammar. Deflationism is the cure for that specific headache.

  However, do not ignore the **Explanatory Objection**. That is the place where the world pushes back hardest against the idea that truth is "just talk." If you find yourself thinking, "No, the *truth* of the map really did guide the hiker, not just the terrain," then you are a realist at heart, and deflationism will feel like it's dodging the bullet rather than biting it.

  If you can accept that "Truth" is a tool we use to talk about *facts*, and that facts do the heavy lifting, deflationism remains the most parsimonious game in town. Just be aware that you are buying parsimony at the cost of explanatory depth.
