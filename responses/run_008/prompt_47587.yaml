prompt: |-
  I've been running my local effective altruity student group's cause-selection process for the past year, and we basically live and die by the importance-tractability-neglectedness framework: score each cause roughly as the product of the scale of the problem, how solvable it is per unit of effort, and how much attention and money it's already getting. I've internalized this so thoroughly that I now get genuinely annoyed when someone pitches a cause without doing the three-factor breakdown first. But lately I've been having doubts, and I want to know what would actually count against the framework itself -- not against particular sloppy applications of it.

  The things that bug me: a friend who studies development economics pointed out that the multiplicative form means a cause that's mediocre on two dimensions but terrible on none will beat a cause that's spectacular on scale but merely middling on tractability, and I genuinely can't tell whether that's a bug (pandemic preparedness and existential risk seem like cases where it gives the wrong answer) or a feature. Also, I keep running into the worry that neglectedness is doing double duty -- if returns to effort are diminishing, then tractability per unit of effort already depends on how much effort has already gone in, so multiplying by a separate neglectedness term partially counts the same thing twice. And then there's the deeper problem that the framework feels unfalsifiable: whenever it crowns a winner people dislike, they just say the neglectedness score was miscalibrated, or that tractability should have been about marginal rather than average impact, or that some factor was missing entirely (coordination with other funders? feedback loops?), and the framework absorbs every correction without ever being at risk.

  So here's what I want: what would genuinely count against ITN as the right way, even at a rough heuristic level, to prioritize causes? Which observations, arguments, or formal results should move me, sorted from fatal to merely awkward? What does it actually predict that rival approaches (intuitive weighing of pros and cons, cost-effectiveness analysis of specific interventions, a "hits-based" portfolio view) don't, so that evidence could in principle arbitrate between them? I especially want the things the framework's own defenders would concede as counting against it, not just what outside critics say. And finally, be honest about whether it's been qualified so much that it no longer risks anything -- and if so, whether that even matters for a rough heuristic of this kind, or whether an unfalsifiable framework that nonetheless organizes your thinking well is perfectly fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Leader of a local Effective Altruism (EA) student group. Deeply familiar with the Importance-Tractability-Neglectedness (ITN) framework. Has internalized it to the point of annoyance when others don't use it. Currently experiencing doubt/crisis of faith in the framework.
      *   **Core Question:** What would *genuinely* count against the ITN framework itself (not just sloppy applications)?
      *   **Specific Concerns Raised:**
          *   Multiplicative form penalizing "spectacular scale + middling tractability" vs. "mediocre on all three." (Bug or feature?)
          *   Double counting between Tractability and Neglectedness (diminishing returns).
          *   Unfalsifiability/Ad-hoc adjustments (miscalibration, marginal vs. average, missing factors).
      *   **Desired Output:**
          *   Observations/arguments/formal results that should move the user (sorted fatal to awkward).
          *   Things ITN predicts that rival approaches don't (for arbitration).
          *   Views conceded by ITN *defenders* (not just critics).
          *   Honesty about whether it's been qualified into unfalsifiability and if that matters.

  2.  **Deconstruct the ITN Framework:**
      *   *Formula:* Priority $\approx$ Importance $\times$ Tractability $\times$ Neglectedness.
      *   *Origin:* 80,000 Hours / EA community heuristic.
      *   *Purpose:* Cause prioritization at a high level.
      *   *Common Criticisms:* Correlation between factors, difficulty of estimation, multiplicative vs. additive, ignoring tail risks, ignoring moral uncertainty.

  3.  **Address the Specific Concerns:**
      *   *Multiplicative Form:* The friend's point is mathematically sound. If $I=100, T=1, N=1$ (Product=100) vs $I=10, T=10, N=10$ (Product=1000). The framework favors the latter. Is this right? For EA, usually no (we care about huge scale). This suggests the functional form might be wrong (e.g., geometric mean, or weighted sum, or log scale).
      *   *Double Counting:* Tractability often *is* a function of Neglectedness (diminishing returns). If $T(N)$ is decreasing, then $I \times T(N) \times N$ counts $N$ twice. Defenders admit this but argue $N$ acts as a proxy for "room for more funding" independent of technical solvability.
      *   *Unfalsifiability:* This is the strongest philosophical critique. If every failure is explained away by "you measured it wrong," it's not a model, it's a mindset.

  4.  **Brainstorm "What Counts Against ITN" (Sorted by Severity):**
      *   *Fatal:*
          *   Systematic bias against long-termist causes (due to tractability uncertainty).
          *   Mathematical incoherence (double counting leads to consistent wrong choices).
          *   Empirical failure (causes ITN ranked high underperformed compared to intuition/portfolio approaches).
      *   *Serious:*
          *   Correlation between factors makes separation impossible (multicollinearity).
          *   Inability to handle "moonshots" (low probability, huge impact).
      *   *Awkward:*
          *   Difficulty in quantification leads to false precision.
          *   Neglectedness encourages contrarianism for its own sake.

  5.  **Identify ITN Defenders' Concessions:**
      *   Will MacAskill, Benjamin Todd, etc., have written about limitations.
      *   They admit it's a heuristic, not a formula.
      *   They admit "Neglectedness" is often a proxy for "Room for More Funding."
      *   They admit multiplicative form is rough; sometimes additive or log is better.
      *   They acknowledge it struggles with "black swan" events or moral uncertainty.

  6.  **Develop the "Predictions/Arbitration" Section:**
      *   What does ITN predict that others don't?
      *   ITN predicts: Highly neglected, solvable, big problems are best.
      *   Rival (Cost-Effectiveness): Specific interventions within known causes are best.
      *   Rival (Portfolio/Hits-based): Diversification across high-variance causes is best.
      *   *Arbitration:* If we see that low-neglectedness causes (e.g., global health) consistently outperform high-neglectedness causes (e.g., meta-research) over long timeframes *per dollar*, ITN is weakened.

  7.  **Address the "Unfalsifiability" Charge:**
      *   Is it a bug or a feature? For a heuristic, flexibility is good. For a decision theory, it's bad.
      *   If it organizes thinking well, is unfalsifiability okay? Yes, *if* it doesn't lead to systematic error.
      *   But if it becomes a "just-so story" generator, it loses normative force.

  8.  **Structure the Response:**
      *   **Introduction:** Validate the user's skepticism (it's a mature EA take).
      *   **Section 1: The Fatal Flaws (Theoretical & Empirical).** Focus on the multiplicative issue and double-counting.
      *   **Section 2: The Defender's Concessions.** What do 80k/CEA folks admit?
      *   **Section 3: Arbitration & Predictions.** How to test ITN against rivals.
      *   **Section 4: The Unfalsifiability Question.** Is it a feature or bug for a heuristic?
      *   **Conclusion:** Recommendation on how to hold the framework (lightly).

  9.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to just bash EA. The user is an EA leader. Speak the language (marginal impact, room for funding, long-termism).
      *   *Nuance:* The "multiplicative" critique is actually about *elasticity*. If importance is elastic and tractability is inelastic, multiplication distorts.
      *   *Double Counting:* Clarify that Tractability is often "technical solvability" and Neglectedness is "funding gap," but they overlap.
      *   *Unfalsifiability:* Distinguish between "framework is wrong" and "inputs are wrong." ITN often escapes blame by blaming inputs. This is the core of the user's worry.

  10. **Final Polish:** Ensure tone is respectful, analytical, and directly answers the prompt's specific constraints (sorted fatal to awkward, defenders' concessions, etc.). (Check against the prompt: "sorted from fatal to merely awkward", "defenders would concede", "honest about unfalsifiability".)

  11. **Drafting the response...** (Mental outline matches the final output structure).
      *   *Intro:* Acknowledge the sophistication of the doubt.
      *   *Fatal:* Systematic underinvestment in low-tractability/high-importance (x-risk). The "Multiplicative Penalty."
      *   *Serious:* The Double-Counting of Diminishing Returns.
      *   *Awkward:* False Precision & Input Guesstimation.
      *   *Defender Concessions:* It's a heuristic, not an algorithm. 80k Hours updates.
      *   *Arbitration:* Compare ITN picks vs. Cause X picks over time.
      *   *Unfalsifiability:* It's a "lens," not a "map." Acceptable if it prevents blind spots, dangerous if it prevents updating.

  12. **Final Review against constraints:** Did I answer "what would genuinely count against ITN"? Yes. Did I sort them? Yes. Did I include defender concessions? Yes. Did I address the unfalsifiability worry honestly? Yes.

