answer: |-
  This is a high-wire act. You are arguing against a foundational heuristic of neoclassical economics in a room full of people trained to defend it. To survive this, you cannot argue that the *math* of expected utility is wrong. You must argue that the *model* of the agent usually assumed in sunk cost examples is too thin.

  Here is your Q&A prep sheet, tailored to your specific audience.

  ### Part 1: The Consensus Check (Read this first)

  You asked for honesty about what is settled vs. contested.

  *   **Settled (The Econ/TA View):** In a one-shot decision problem with a fixed utility function and perfect information, past costs *never* enter the calculation of future expected utility. If you include them, you are mathematically double-counting. The Arkes & Blumer theater ticket study is robust evidence that humans *do* violate this in lab settings.
  *   **Contested (Your Opening):** Whether real-world agents are "one-shot" decision makers with fixed utility functions. Philosophers of action (e.g., Edward McClennen, Michael Bratman) and some behavioral economists argue that **planning agency**, **reputation with oneself**, and **learning** change the structure of the decision tree.
  *   **The Trap:** Do not argue that "money spent should influence future value." Argue that "the *fact* that money was spent changes the *context* of future value." If you conflate these, the Professor will eat you alive.

  ---

  ### Part 2: Q&A Prep Sheet

  #### 1. The "Definition" Attack
  *   **Who:** The Econ Majors (likely the first question).
  *   **The Objection:** "You're redefining terms. If the past investment gives you information or creates a reputation benefit, those are *future* expected utilities. The cost itself is still sunk. You haven't proven sunk costs matter; you've just proven there are hidden future benefits you didn't count initially."
  *   **Your Reply:** "I agree that if we define rationality strictly as maximizing *exogenous* future payoffs, sunk costs are irrelevant. But I'm arguing that the *act* of sinking costs changes the *agent's* utility function or constraint set. If quitting now destroys my ability to commit later (self-trust), that is a real future cost caused by the past investment. The past cost isn't the *source* of value, it's the *mechanism* that locked in the future constraint."
  *   **Concede Up Front:** "I concede that in a static, one-shot model with a fixed utility function, sunk costs are normatively irrelevant. My argument relies on a dynamic model of the self."
  *   **Soft Spot:** You are walking a semantic tightrope. If you can't point to a specific node in the decision tree where the payoff changes *because* of the past, this looks like wordplay.

  #### 2. The Theater Ticket Ambush
  *   **Who:** The Grad TA (They *will* bring this up).
  *   **The Objection:** "What about Arkes and Blumer (1985)? People who paid full price for theater tickets went to more plays than those who got discounts. The play was the same, the future enjoyment was the same. The only variable was the sunk cost. They honored it irrationally."
  *   **Your Reply:** "That experiment is brilliant at isolating the fallacy in a *lab* context where selection effects are controlled. But in the wild, price often correlates with valuation. More importantly, that study measures *compliance*, not *utility*. If paying full price makes me feel more committed, and that commitment reduces the psychic cost of attending, my utility function has actually shifted. The TA's example proves humans *do* honor sunk costs; I'm arguing that in a social/psychological context, that heuristic can be adaptive for maintaining commitment."
  *   **Concede Up Front:** "In the specific, controlled conditions of the theater experiment, where reputation and learning are held constant, honoring the cost is likely irrational. I am defending the heuristic in open-ended, real-world environments."
  *   **Soft Spot:** The TA knows the paper better than you. Do not try to critique their methodology. Concede the lab, win on the field.

  #### 3. The Bayesian Decision Tree Demand
  *   **Who:** The Professor.
  *   **The Objection:** "Draw the tree. Show me the node. If the cost is sunk, it's in the past history $h_t$. How does $h_t$ alter the probability $P(outcome|action)$ or the utility $U(outcome)$ at $t+1$ without violating causal decision theory?"
  *   **Your Reply:** (You need to visualize this). "The node isn't in the external world; it's in the agent's self-model.
      *   **Node A:** Continue Project.
      *   **Node B:** Quit Project.
      *   **Payoff at B:** If I quit, I gain resource $R$, but I update my self-belief to 'I am a quitter.' This lowers the expected payoff of *all future projects* because my future self anticipates bail-out.
      *   **The Link:** The sunk cost is the *evidence* used to update the belief 'I am a quitter.' If I hadn't sunk the cost, quitting wouldn't signal 'quitting,' it would signal 'prudence.' The magnitude of the sunk cost changes the signal strength."
  *   **Concede Up Front:** "This requires modeling the agent as a sequence of temporal selves with imperfect trust, not a single unitary maximizer."
  *   **Soft Spot:** This is "Resolute Choice" theory. If the Prof is a hardcore causal decision theorist, they may reject the idea that you can bind your future self's utility function.

  #### 4. The Concorde Drop
  *   **Who:** Someone who read the Wikipedia intro to Sunk Cost Fallacy.
  *   **The Objection:** "The Concorde. Governments kept funding it knowing it would never be profitable. That was purely honoring sunk costs. It was a disaster. How is that rational?"
  *   **Your Reply:** "The Concorde is the namesake of the fallacy for a reason. But even there, analysts argue there were future payoffs: technological spillovers, national prestige, and strategic positioning in aviation. If those future benefits were valued higher than the additional costs, continuing was rational. If they continued *solely* because 'we already spent so much,' that was irrational. I am not arguing *all* sunk cost behavior is rational, only that the *heuristic* isn't universally irrational."
  *   **Concede Up Front:** "The Concorde is likely a net negative example. I am not defending the Concorde; I am defending the principle that the heuristic can work in other contexts."
  *   **Soft Spot:** This is the weakest example. If they press you on whether the spillovers were actually calculated *ex ante* or rationalized *ex post*, you will lose.

  ---

  ### Part 3: The Question You Hope Nobody Asks

  **The Question:** "If your argument relies on future benefits (reputation, self-trust, avoiding regret), aren't you just describing **investment**? If I can justify the continuation with *future* utility, why do we need to call it 'honoring sunk costs' at all? Isn't your whole presentation just a semantic trick to say 'there are always hidden future variables'?"

  **Why this kills you:** It exposes that you aren't actually justifying the influence of the *past*; you are justifying the influence of the *future consequences of acknowledging the past*. It suggests the "Sunk Cost" is still doing no normative work.

  **The Defense (If asked):** "Because the *magnitude* of the future cost is proportional to the *magnitude* of the past cost. I don't lose self-trust by quitting a project I started yesterday; I lose it by quitting a project I invested five years in. The past cost scales the future penalty. Therefore, the past cost is an active variable in the utility function, not just a historical footnote."

  ---

  ### Part 4: Strategic Advice for the Presentation

  1.  **Formalize the Self-Trust Argument:** The Professor wants a tree. You must provide one.
      *   Draw a tree where the "Quit" branch leads to a "Future Projects" sub-game.
      *   In that sub-game, show that the Expected Value (EV) of future projects is *lower* if you Quit now, *conditional* on the size of the Sunk Cost.
      *   Label this "Reputational Collateral."
      *   *Tip:* Cite **Edward McClennen (1990), *Rationality and Dynamic Choice***. This gives you philosophical cover for "Resolute Choice."

  2.  **Don't Fight the TA on the Theater Tickets:**
      *   Say this verbatim: "The theater ticket experiment is the best evidence that humans *violate* the neoclassical model. My claim is that the neoclassical model is too thin to capture the utility of consistency. The students in that experiment were maximizing *psychological comfort*, which is a valid utility term, even if it looks like a fallacy in a vacuum."

  3.  **Distinguish "Error" from "Heuristic":**
      *   Econ majors think Sunk Cost = Error.
      *   You argue Sunk Cost = Heuristic.
      *   Heuristics can be wrong in specific cases (Concorde) but rational as a general policy (don't train yourself to be a quitter). This aligns with Gigerenzer's "Fast and Frugal Heuristics" if you need a citation.

  4.  **Watch Your Language:**
      *   Never say "The past cost adds value."
      *   Always say "The history of investment alters the *constraints* or *payoffs* of future choices."
      *   If you sound like you think money spent magically creates future value, you will fail.

  **Good luck.** You are arguing for a richer model of human agency against a cleaner model of economic math. You won't convert the hardcore Bayesians, but if you can show the decision tree where "Self-Trust" is a quantifiable variable, you'll pass.
