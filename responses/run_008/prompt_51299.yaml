  To: Charity Committee
  From: [Your Name]
  Subject: Recommendation on Annual Charity Allocation

  We face a genuine moral conflict this year. On one side, the imperative to maximize lives saved; on the other, the duty to nurture the community that generates the funds. Both positions are defensible. This memo analyzes the strongest versions of each argument and proposes a path forward.

  Sam's argument rests on moral consistency. If distance doesn't negate duty, then saving a life abroad outweighs improving comfort locally. The "drowning child" analogy holds: if we accept we should ruin trainers to save a child nearby, geography shouldn't matter. The strongest version of this claim is that failing to prioritize maximum effectiveness treats local proximity as morally significant when it is not. If we can save a life for £5,000, spending that £5,000 on a local playground is a choice to value proximity over survival. This is the core utilitarian claim: outcomes are what count, not feelings. To argue otherwise requires proving that distance changes moral weight, which is philosophically difficult.

  Dave's counter is not merely sentimental; it is structural. The company is not a disembodied agent; it is embedded in Reading. Staff donate because they see local impact—the food bank van with our logo. If we sever that connection, morale may drop, reducing total funds raised. The strongest version of this claim is instrumental: local giving sustains the culture of giving itself. Furthermore, the company has obligations to its ecosystem. We benefit from local infrastructure and staff; reciprocating here maintains the social license to operate. Dave's point on omission—that we aren't drowning the children—is logically true but morally contentious. We are choosing where to throw the lifeline; inaction is still a choice. Regarding other companies: their failure to act does not absolve us. We are responsible for our own capacity, not the industry average. If others fail, the need is greater, not lesser.

  The compromise hinges on whose money it is. Can money carry sentiment? Psychologically, yes. Staff fundraising is effort-based and often directed by personal connection. The company match is capital-derived and neutral. Treating them differently respects donor intent without sacrificing ethical rigor.

  Regarding policy: A standing rule allows for multi-year grants, which high-impact charities often need. This supports Sam's view but needs Dave's flexibility. Locking ourselves into maximum effectiveness forever risks rigidity. We need a review mechanism. A standing policy changes the moral landscape from reactive to proactive. It allows us to commit to long-term solutions rather than emergency relief. However, we must ensure we don't lose the ability to respond to unique local opportunities, like the scouts' tent.

  **Recommendation**

  I recommend splitting the pot based on the source of funds.

  1.  **Company Match (approx. 50%):** Allocate to high-impact, evidence-based charities (e.g., malaria prevention). This capital is neutral and should maximize objective good.
  2.  **Staff Fundraising (approx. 50%):** Allocate via staff vote to local causes. This respects the emotional labor and community intent of the fundraisers.

  **Process for Next Year**
  Adopt a two-year review cycle. We will measure whether total staff fundraising increases or decreases under this split. If local donation rates drop significantly, we revisit the balance. For the high-impact portion, the committee will select charities based on transparent metrics, not just one-off rescues. We will reserve a small contingency fund for unexpected local opportunities to maintain flexibility.

  This approach acknowledges Sam's moral urgency while preserving Dave's community engine. It accepts that while distance shouldn't matter morally, it matters psychologically for engagement. We save lives abroad while nurturing roots at home.

  Please review before Thursday.
