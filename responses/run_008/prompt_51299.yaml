      From: [Your Name]
      Subject: Recommendation on Annual Charity Allocation

      We face a genuine moral conflict this year. On one side, the imperative to maximize lives saved; on the other, the duty to nurture the community that generates the funds. Both positions are defensible. This memo analyzes the strongest versions of each argument and proposes a path forward.

      Sam's argument rests on moral consistency. If distance doesn't negate duty, then saving a life abroad outweighs improving comfort locally. The "drowning child" analogy holds: if we accept we should ruin trainers to save a child nearby, geography shouldn't matter. The strongest version of this claim is that failing to prioritize maximum effectiveness treats local proximity as morally significant when it is not. If we can save a life for £5,000, spending that £5,000 on a local playground is a choice to value proximity over survival.

