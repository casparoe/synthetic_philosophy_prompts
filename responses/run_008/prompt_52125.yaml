prompt: |-
  So my friend Ben and I got into it for like three hours last night after a talk we went to, and I want to know if he actually won. The topic was moral trade. He'd read some article about it (couldn't remember where, some blog maybe) and summarized it for me basically like this: moral trade is the idea that people with different moral views can strike deals that make both of them better off by their own lights, the way countries trade even though they want different things. His example: a vegetarian who's deeply opposed to factory farming pays a meat eater to go vegetarian, and if the meat eater only mildly prefers eating meat while the vegetarian is horrified by it, both of them end up with a world more to their liking than before. Fine so far. But then he made two further claims I wasn't so sure about.

  First, he said moral trade fundamentally depends on being able to compare how strongly each person holds their moral convictions on a common scale — you need some way of saying my opposition to factory farming is "stronger" than his attachment to steaks, otherwise the trade can't get off the ground. Is that actually right? It sounded plausible but also kind of like he was smuggling in a whole theory of interpersonal comparisons of value that maybe the view doesn't need? Like, if we just make a deal that we're both happy with, why would anyone have to measure conviction strength?

  Second, he said the standard objection to moral trade — that people aren't actually sufficiently impartial/altruistic for most of these deals to be worth it in practice, plus you can't verify compliance — basically refutes the whole idea, so it's an interesting theoretical curiosity and nothing more. And then he took this last step: so moral trade shows moral disagreement doesn't really matter at the end of the day, it's just like two people disagreeing about which restaurant to go to — everyone gets a better deal by trading, nobody is really wrong.

  Something about that last move felt off to me but I couldn't articulate why at 1am. Can you go through his summary and tell me what's accurate, where he's subtly misrepresenting the view, and whether his conclusion that moral disagreement is "no deeper than restaurant choices" follows from anything he got right? Also does it matter that he was sort of sliding between moral trade and cases where one person is uncertain between different moral views themselves? He kept mixing those together and I lost the thread of whether they're supposed to be the same thing.
