      *   *The Self:* The self is a "logical construction" out of sense data/experiences (Humean bundle theory).
      *   *Survival:* Since the self is just a chain of experiences, "survival" means the continuation of that chain. If I wake up in a new body with my memories, that is empirically verifiable. Therefore, *empirical* survival is meaningful. *Substantial* survival (disembodied soul) is not.
      *   *Probability:* Ayer thinks empirical survival is highly unlikely, but not meaningless.

  3.  **Deconstruct Ayer's Late Position ("What I Saw When I Was Dead", 1988):**
      *   *Event:* Choked, heart stopped, revived.
      *   *Claim:* He saw a divine light/beings. He admits this weakened his rigid atheism/agnosticism slightly.
      *   *Rationalization:* He doesn't accept the light was God. He suggests telepathy. His brain might have picked up thoughts from the living around him.
      *   *Implication:* He maintains the empirical framework. He refuses to accept "supernatural" meaning but allows for "paranormal" empirical mechanisms to explain the experience without conceding to an afterlife.

  4.  **Evaluate the Consistency (The "Knot"):**
      *   *Argument for Consistency:* Ayer never abandons empiricism. Early on, he says "survival must be empirical." Later, he says "this experience must have an empirical explanation (telepathy) rather than a supernatural one (afterlife)." He treats the NDE as data to be explained, not proof of transcendence.
      *   *Argument for Inconsistency/Shift:*
          *   *The Looseness Problem:* In 1936, the Verification Principle was a weapon to *destroy* metaphysics. It was supposed to be strict. By 1988, to avoid conceding survival, Ayer invokes *telepathy*. Is telepathy verifiable? If telepathy is a valid empirical hypothesis to explain consciousness during clinical death, then "consciousness independent of brain function" is an empirical hypothesis. But that looks suspiciously like the "survival" hypothesis he wanted to rule out or deem unlikely.
          *   *The "Soul" Problem:* Early Ayer says "soul" is nonsense. Late Ayer admits an experience that *felt* like transcending the body. To explain it, he posits a mechanism (telepathy) that implies mind-to-mind contact without sensory organs. This stretches "empirical" to the breaking point.
          *   *The Verdict:* The early distinction is logically stable *in theory* but pragmatically unstable *in practice*. The telepathy move reveals that the Verification Principle, when pushed to the edge, becomes a shield for materialism rather than a neutral tool of meaning. It shows the early view wasn't as neutral as it claimed.

