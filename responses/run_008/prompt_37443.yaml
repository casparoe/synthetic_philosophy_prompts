answer: |-
  This is the right way to approach the literature. The debate isn't actually about "who is right" (Sen vs. Dworkin vs. Rawls); it's about which set of constraints you are willing to relax when they inevitably conflict. Every major theory is essentially a different choice about which desideratum to sacrifice.

  Here is the specification for an adequate *equalisandum*, critiqued and structured.

  ### Part 1: The Desiderata List

  I have refined your bullet points into formal constraints. For each, I've listed the motivating case, the status (Hard Constraint vs. Contested Prejudice), and the theoretical cost.

  #### 1. The Preference-Responsibility Constraint
  *   **The Demand:** The metric must not compensate individuals for preferences they could have reasonably avoided or cultivated, specifically when satisfying those preferences consumes more resources than average.
  *   **Motivating Case:** **Expensive Tastes.** Person A is happy with beer and books; Person B requires vintage champagne and yachts to reach the same level of satisfaction. If we equalize welfare, Person B gets a massive resource transfer. Intuition says this is unfair; Person B shouldn't be subsidized for their snobbery.
  *   **Status:** **Contested Prejudice.** This is the core axiom of Luck Egalitarianism. However, Relational Egalitarians and some Rawlsians reject this as a primary distributive constraint. They argue justice is about social status, not balancing luck.
  *   **Cost:** To satisfy this, you must be able to distinguish between "brute" preferences (innate) and "option" preferences (cultivated), which is epistemically difficult.

  #### 2. The Anti-Paternalism / Authenticity Constraint
  *   **The Demand:** The metric must respect the individual's own assessment of their well-being unless there is clear evidence of distortion, without imposing a state-defined "good life."
  *   **Motivating Case:** **Adaptive Preferences.** The oppressed housewife or the "happy slave" reports high satisfaction despite objective deprivation. If we equalize resources or capabilities, we might ignore their subjective suffering (or lack thereof). If we ignore their report and say "you are worse off than you think," we risk paternalism.
  *   **Status:** **Hard Constraint (with caveats).** Almost all liberal theories accept this, but they disagree on the threshold for overriding it.
  *   **Cost:** If you prioritize this too highly, you cannot help the adaptive preferrer (because they say they don't need help). If you prioritize it too low, you become a tyrant imposing values.

  #### 3. The Heterogeneity / Conversion Constraint
  *   **The Demand:** The metric must account for the fact that different people require different amounts of "stuff" to achieve the same functioning or status.
  *   **Motivating Case:** **Disability.** Giving a paraplegic and an able-bodied person the same income bundle is not equal, because the paraplegic faces higher costs to achieve the same mobility. A pure resource count fails here.
  *   **Status:** **Hard Constraint.** Very few theories deny this. Even resource theorists usually add a "needs" clause.
  *   **Cost:** This kills naive Resource Egalitarianism. It forces the theory to look at *what resources do* (functionings/capabilities) rather than *what resources are*.

  #### 4. The Publicity / Actionability Constraint
  *   **The Demand:** The metric must be verifiable by public institutions. The state must be able to assess who is worse off without invasive surveillance or impossible calculations.
  *   **Motivating Case:** **Measurability.** If the *equalisandum* is "utility," the state needs to know my internal neurochemistry. If it is "resources," they can check my bank account. If it is "capabilities," they need to know what options I realistically have, which is complex.
  *   **Status:** **Hard Constraint.** A theory of *political* justice that cannot be implemented by institutions is merely ethics, not politics.
  *   **Cost:** This is the graveyard of Welfare Egalitarianism. Internal states are not publicly accessible.

  #### 5. The Option-Luck Constraint
  *   **The Demand:** The metric must distinguish between disadvantages caused by unchosen circumstances (brute luck) and disadvantages caused by voluntary risk-taking (option luck).
  *   **Motivating Case:** **The Voluntary Gambler.** A person bets their rent money on a risky venture and loses. Do they have a claim on social resources to restore them to the baseline? Intuition says no (they took the risk), but a strict equality view might say yes (they are now unequal).
  *   **Status:** **Contested Prejudice.** Like #1, this is specific to Luck Egalitarianism. Sufficiency theorists or Social Democrats might say "we bail everyone out to maintain social stability," regardless of fault.
  *   **Cost:** Satisfying this requires a robust theory of voluntariness. Was the gamble truly voluntary if the person was desperate?

  ---

  ### Part 2: Critique of Your Requirements

  You asked to flag if any of these are bad requirements that presuppose an answer.

  **1. "Responsibility-Sensitivity" is the biggest presupposition.**
  You listed: *"it has to be compatible with some kind of responsibility-sensitivity... without making desert the whole theory."*
  Be careful here. Demanding that a theory be "responsibility-sensitive" effectively rigs the game in favor of Luck Egalitarianism (Dworkin, Cohen, Arneson).
  *   **Why it's suspect:** Rawls, for example, explicitly rejects the idea that we can or should distribute based on moral desert or responsibility for endowments. Relational Egalitarians argue that asking "did you deserve this poverty?" is itself an expression of inequality (a hierarchical judgment).
  *   **Verdict:** Treat this as a **variable**, not a hard constraint. If you make it a hard constraint, you eliminate half the major contenders before the race starts.

  **2. "Measurable in principle" is pragmatic, not moral.**
  *   **Why it's suspect:** A theory could be morally perfect but hard to measure. However, for a *political* conception of justice (rules for basic structure), this is usually accepted as hard.
  *   **Verdict:** Keep it, but recognize it favors **Resources** over **Welfare** or **Capabilities**.

  **3. "Expensive Tastes" vs. "Adaptive Preferences" is not a tension between Subjective and Objective.**
  *   **Correction:** You suspected handling expensive tastes pushes toward subjective welfare and adaptive preferences pushes away. **This is backwards.**
  *   **Why:**
      *   **Expensive Tastes:** Subjective welfare says "Pay the champagne drinker." To *avoid* this, you must move *away* from subjective welfare toward an objective standard (or a responsibility check).
      *   **Adaptive Preferences:** Subjective welfare says "The slave is happy, no help needed." To *help* the slave, you must move *away* from subjective welfare toward an objective standard (freedom/capability).
  *   **Verdict:** Both problems actually push you *away* from pure Subjective Welfare. The tension is not Subjective vs. Objective.

  ---

  ### Part 3: The Impossible Pair

  You asked which pair of desiderata cannot be jointly satisfied.

  **The Tension: Preference-Responsibility (#1) vs. Anti-Paternalism (#2)**

  This is the deeper version of your hunch. It is the **Consistency Problem of Preferences.**

  *   **The Conflict:** To solve **Expensive Tastes**, you must say: "You are responsible for your high standards; we won't subsidize them." This requires an external, objective judgment that their preferences are "too expensive" or "unreasonable."
  *   **The Flipside:** To solve **Adaptive Preferences**, you must say: "You are *not* responsible for your low standards; oppression distorted them, so we will intervene." This requires an external, objective judgment that their preferences are "deformed."
  *   **The Trap:** How do you distinguish the Champagne Drinker from the Happy Slave without paternalism?
      *   If you say "We judge preferences objectively," you solve both, but you violate **Anti-Paternalism**. You are telling citizens what they *should* want.
      *   If you say "We take preferences as given," you violate **Preference-Responsibility** (subsidize champagne) and fail the **Adaptive Preference** victim (ignore their oppression).
      *   If you say "We judge based on responsibility," you need to know if the preference was chosen. But preferences are rarely consciously chosen. The champagne drinker didn't wake up and choose snobbery; the slave didn't choose submission. Both were shaped by environment.

  **The Escape Hatch?**
  The only "clever escape" attempted in the literature is **Capabilities** (Sen/Nussbaum). They try to sidestep preferences entirely. They don't measure what you *want* (welfare) or what you *have* (resources), but what you are *able to do and be*.
  *   **Does it work?** It helps with Disability and Adaptive Preferences (you have the capability even if you don't use it).
  *   **Does it fail?** It struggles with Expensive Tastes. If I have the capability to drink champagne but choose to spend my money on it, am I owed more? Capabilities theory often falls back on a "reasonable" list of capabilities, which reintroduces the paternalism problem (who decides what capabilities are on the list?).

  ---

  ### Part 4: The Killer Constraint

  You asked which single requirement knocks out the most contenders.

  **The Winner: The Publicity / Actionability Constraint (#4)**

  While the Responsibility constraint creates the most *philosophical* drama, the Publicity constraint is the one that physically eliminates theories from the realm of political possibility.

  1.  **Knocks out Hedonic Welfare Egalitarianism:** You cannot build a state apparatus that measures neural satisfaction or preference fulfillment across millions of people without extreme invasiveness. It fails the "liberal neutrality" test because the state must probe minds.
  2.  **Knocks out Strict Capability Egalitarianism:** While better than welfare, measuring "real freedom" or "effective capability" for every individual is administratively nightmarish. How does the DMV assess my "capability to participate in community life"?
  3.  **Favors Resource Egalitarianism:** This is why Rawls and Dworkin pivot to resources (Primary Goods / Auctions). Resources are public, visible, and transferable.

  **The Runner Up: The Preference-Responsibility Constraint (#1)**
  If you treat this as a hard constraint (as Luck Egalitarians do), you knock out:
  *   **Rawlsianism:** Rawls explicitly rejects desert/responsibility as a basis for distribution.
  *   **Relational Egalitarianism:** They view the focus on individual responsibility as corrosive to social solidarity.
  *   **Strict Welfare Egalitarianism:** As discussed, it fails the expensive tastes test.

  ### Summary of the Landscape

  If you walk into the literature with these specs, here is what you will see the authors doing:

  *   **Dworkin:** Sacrifices **Welfare** to save **Responsibility** and **Resources**. (The Auction + Insurance model).
  *   **Sen:** Sacrifices **Measurability** (to a degree) to save **Disability** and **Adaptive Preferences**. (Capabilities).
  *   **Rawls:** Sacrifices **Responsibility/Desert** to save **Publicity** and **Stability**. (Primary Goods).
  *   **Cohen:** Tries to hold **Responsibility** and **Welfare** together, but struggles with the **Expensive Taste** paradox.
  *   **Anderson (Relational):** Rejects the whole **Equalisandum** framework. Argues the goal isn't to distribute stuff, but to end oppression. (Dissolves the spec).

  **Your Move:** Before reading, decide if **Responsibility** is a hard constraint for you. If yes, you are a Luck Egalitarian. If no, you are likely a Rawlsian or Relational Egalitarian. Then decide if **Measurability** is hard. If yes, you must lean toward Resources. If no, you can lean toward Capabilities or Welfare.

  The entire debate is just people fighting over which of these constraints is allowed to break.
