answer: |-
  Based on the track record you've provided, your uncle is not running a simple "Growth + Vibes" algorithm, nor is he a secret proceduralist who cares about elections. He is a **Developmental Technocrat**.

  His underlying rule is what I'd call **"The Competence Contract."**

  Here is the breakdown of his logic, the predictions for your new cases, and the stress test to expose the flaw in his system.

  ### 1. The Diagnosis: What is his actual rule?

  Your uncle's philosophy is best described as **Performance Legitimacy with a "No Purge" Floor.**

  *   **Performance is King:** East Germany failed because it was poor. Franco failed because the economy was stagnant/partisan. Singapore, Park, and China succeed because they delivered mass wealth creation.
  *   **The "Family Business" Exclusion:** He waves off the UAE because it's a rentier state (oil money), not a *productive* economy. He values *building* a nation, not just *owning* one. This is why he respects Lee Kuan Yew (who built an economy from nothing) but dismisses Gulf monarchies.
  *   **The "Pinochet Line" (The Crucial Variable):** This is the most important part of his rule. He accepts repression if it is **administrative** (Singapore's caning, China's censorship, Vietnam's one-party rule) but rejects it if it is **terroristic/ideological** (Pinochet's disappearances, Franco's victors' justice).
      *   To him, there is a difference between "locking you up to keep the trains running" (Legitimate) and "disappearing you because you are a leftist" (Illegitimate).
  *   **The Expiration Date:** Legitimacy is renewable, not permanent. China gets a "provisional yes" because the clock is ticking. Park gets a pass because he eventually left (via death/coup) and democratized.

  **The Rule:** *A regime is legitimate if it functions like a competent corporation delivering dividends (growth/stability) to all shareholders (citizens), provided management does not murder shareholders for dissent.*

  ### 2. The Verdicts on Your New Cases

  Here is how he will likely rule on Rwanda and Vietnam based on that specific logic.

  **Vietnam: The "Safe Yes"**
  *   **Verdict:** **Legitimate.**
  *   **Why:** Vietnam is the perfect fit for his model. It is a "China Lite." It has steady, productive growth (manufacturing hub), it is nationalist (beating the US gives it founding legitimacy), and its repression is bureaucratic (one-party rule, censorship) rather than terroristic (no mass disappearances).
  *   **The Uncle's Take:** "It's the Deng model without the superpower baggage. People are eating better, the streets are safe, and they aren't dumping bodies in the ocean. It works."

  **Rwanda (Kagame): The "Anxious Yes"**
  *   **Verdict:** **Provisionally Legitimate (with heavy caveats).**
  *   **Why:** Kagame is the African Lee Kuan Yew. The growth numbers are real, the streets are clean, and the stability after the genocide is a massive "delivery of goods." However, the rewritten term limits and 99% elections trigger his "Franco Alarm" (order serving the victors/leader).
  *   **The Uncle's Take:** He will want to say yes because the results are undeniable. But he will be bothered by the term limits. He will likely justify it by saying, "The alternative is chaos/genocide, so the contract holds *for now*," but he will admit Kagame is testing the expiration date. He will distinguish between Kagame's "security" and Pinochet's "terror."

  ### 3. The Stress Test: The Third Case

  To force him to reveal whether he truly cares about the "No Purge" floor or if he's just a growth absolutist, you need a case that combines **High Growth** + **Visionary Nation Building** + **High-Profile Political Murder.**

  You should bring up: **Saudi Arabia under Mohammed bin Salman (MBS).**

  **Why this breaks his model:**
  1.  **The UAE Problem:** Like the UAE, it's an oil state. But MBS has *Vision 2030*, an attempt to build a productive post-oil economy (NEOM, tourism, tech). This might bypass your uncle's "Family Business" objection.
  2.  **The Singapore Problem:** MBS is centralizing power and modernizing society (women driving, concerts) similar to LKY's social engineering.
  3.  **The Pinochet Problem:** The murder of Jamal Khashoggi. This was not a quiet administrative detention; it was a brutal, state-sponsored disappearance and dismemberment of a critic.

  **The Trap:**
  *   **If he says "Legitimate":** He admits his "Pinochet Line" is fake. He is a growth absolutist, and one murder doesn't matter if the GDP goes up.
  *   **If he says "Illegitimate":** He confirms his rule is **Performance + Restraint.** He values the *method* of control, not just the results.
  *   **If he hedges (like the UAE):** He reveals that his rule requires *productive* growth, and he doesn't believe Saudi can actually build a post-oil economy.

  **How to play it:**
  Wait until he approves Vietnam. Then say: *"Okay, so Vietnam is fine because they grow without the disappearances. What about MBS in Saudi? He's trying to build a whole new economy like Lee Kuan Yew, growth is up, but he ordered Khashoggi chopped up in a consulate. Is that a Pinochet-level dealbreaker, or does the Vision 2030 buy him a pass?"*

  That will tell you if his morality has a price tag.
