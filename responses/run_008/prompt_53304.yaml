prompt: |-
  im trying to map my uncle's actual rule before this years thanksgiving round. every year he ends up holding court on whether a dictatorship that delivers the goods is actually ok, and I want to be ready. his track record so far: Singapore under Lee Kuan Yew — legitimate, full stop, and he thinks anyone who disagrees is romanticizing western decline. Park Chung-hee's Korea — basically legitimate too, the miracle on the Han buys a lot, though he's glad it ended in democratization eventually. Pinochet's Chile — absolutely not, doesn't matter what the GDP did, you don't get to disappear people and call it governance. Franco's Spain — also no, he says order that mostly serves the victors isn't really order. East Germany he laughs out of the room — a wall is a confession. Deng-era and post-Deng China he'll grant a provisional yes, growth plus the poverty reduction is the real deal, but he says the clock is running, the legitimacy evaporates the moment living standards stagnate. And the UAE he waves off as a family business with a flag, changes the subject, never actually rules on it one way or the other.

  this year I'm bringing Kagame's Rwanda (fast growth, real gains after the genocide, order, but term limits rewritten so he can stay indefinitely and election wins in the high 90s) and Vietnam (one party, no elections at all, but steady growth, calm, and no mass repression you can point to). what does my uncle say about each? I care less about the verdicts than about the rule he's running — is it performance plus a floor (no killing your own people at scale), performance plus some minimal procedural requirement he only enforces selectively, or basically just growth numbers with vibes doing the rest? his record fits more than one of these and they come apart on Rwanda and Vietnam, so tell me which reading fits his track record best and why, and what third case I should bring up that would actually force him to reveal which rule he's been using all along.
