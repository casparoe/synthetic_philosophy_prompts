  Here is the precise diagnosis of where the argument goes wrong, how to save Thirding without the cosmological absurdity, and what the costs are for the Halfer position regarding betting.

  ### 1. The Diagnosis: The Slide in Premise (2)

  Your intuition about the "slide" is exactly right. The flaw lies in Premise (2): *"Rational credence requires that possibilities not distinguished by one's evidence get equal weight."*

  As stated, this is too broad. It treats **centered possibilities** (indexical locations like "Monday" vs. "Tuesday") and **uncentered hypotheses** (physical theories like "Big Universe" vs. "Small Universe") as ontologically equivalent for the purpose of weighting.

  *   **In Sleeping Beauty:** The hypotheses (Heads vs. Tails) are outcomes of a **known, fair stochastic process** (the coin flip). The "slots" (awakenings) are generated *by* the outcome of this process.
  *   **In Cosmology:** The hypotheses (Big vs. Small Universe) are **background metaphysical facts**. The observers are not generated by a known stochastic process *within* the experiment; they are constitutive of the hypothesis itself.

  When your friend applies Premise (2) to Beauty, they are weighting outcomes of a known chance process by their frequency of producing evidence. When they apply it to Cosmology, they are weighting the prior probabilities of the theories themselves by the number of observers they contain.

  **The Fix:** To remain a Thirder without becoming a Presumptuous Philosopher, your friend must replace Premise (2) with a **Restricted Indifference Principle**.

  > **Restricted Indifference:** Treat yourself as a random sample from the possibilities consistent with your evidence *only when those possibilities are generated by a known stochastic process with fixed priors.*

  In Beauty, the coin is the known process ($P(H)=P(T)=1/2$). The fact that Tails produces two awakenings means that, *conditional on the experiment running*, a random awakening is more likely to be Tails-associated. This is standard Bayesian updating on the *frequency of evidence*.

  In Cosmology, there is no "coin" generating universes with a known 50/50 prior. To favor the Big Universe is to assert that the *prior probability* of a universe existing is proportional to its observer count. This is the SIA leap that creates the Presumptuous Philosopher. By restricting indifference to **indexical uncertainty within a fixed causal framework** (Beauty) rather than **factual uncertainty about the framework itself** (Cosmology), your friend can block the slide.

  ### 2. Why the "Copies Variant" Doesn't Force the Cosmology Conclusion

  You mentioned the "copies variant" (1000 temporary copies of Beauty) as a bridge that forces the cosmology conclusion. It feels intuitive that if Thirding holds for 1000 copies, it should hold for 1000 observers in a universe. However, the distinction remains the **source of the probability**.

  *   **Copies Variant:** We *know* the experimenter flips a coin to decide whether to make 1 copy or 1000 copies. The uncertainty is about the *coin*. The "1000 copies" is a consequence of the Tails outcome.
  *   **Cosmology:** We do not know a "universe-maker" flipped a coin to decide between a Big or Small universe. The number of observers is a property of the theory, not a consequence of a chance event within the theory.

  Thirding is defensible as a claim about **how to update on indexical evidence given a known physical setup**. It is not defensible as a claim about **how to assign priors to physical setups based on observer count**.

  ### 3. The Halfer's Betting Problem (and Solution)

  You asked what the Halfer position costs in betting cases. This is the strongest argument for Thirding.

  **The Setup:** Beauty is offered a bet each time she wakes: Win \$1.50 if Heads, Lose \$1.00 if Tails.
  *   **Thirder Calculation:** $P(Heads) = 1/3$. Expected Value = $(1/3 \times 1.50) - (2/3 \times 1.00) = 0.50 - 0.66 = -0.16$. **Decision: Reject Bet.**
  *   **Actual Outcome:** If Heads (1 wake), she wins \$1.50. If Tails (2 wakes), she loses \$2.00. Average per experiment = $(0.5 \times 1.50) - (0.5 \times 2.00) = -0.25$. **Decision: Reject Bet.**
      *   *Result:* Thirder credence aligns with rational decision.

  *   **Halfer Calculation:** $P(Heads) = 1/2$. Expected Value = $(1/2 \times 1.50) - (1/2 \times 1.00) = +0.25$. **Decision: Accept Bet.**
      *   *Result:* Halfer credence leads to a losing strategy.

  **The Halfer's Escape:**
  To save Halferism, your friend must argue that **Credence does not directly guide Betting in self-locating cases.**
  The Halfer (like David Lewis) argues that while Beauty's *credence* in Heads is 1/2, her *decision theory* must account for the fact that a Tails decision is enacted twice. She should reject the bet not because she thinks Heads is unlikely, but because she knows a loss on Tails is "counted twice."

  **The Cost:** This requires divorcing **Degree of Belief** from **Betting Odds**. For many, this is a bullet worth biting to avoid the Presumptuous Philosopher. For others (like you, seemingly), it breaks the functional role of credence.

  ### 4. Recommendation

  You do not have to abandon Thirding, but your friend must abandon the specific **Global Indifference Argument** they used.

  1.  **Concede the Point:** Admit that Premise (2) as stated *does* prove too much. It is the Self-Indication Assumption, and it *does* imply the Presumptuous Philosopher result.
  2.  **Adopt the Restricted View:** Argue for Thirding based on **Elga's Symmetry Argument** rather than Global Indifference.
      *   *Argument:* Given Tails, Monday and Tuesday are subjectively identical, so $P(Mon|T) = P(Tue|T) = 1/2$. Given the setup, $P(Mon \cap H) = P(Mon \cap T)$. This derives 1/3 without invoking a general principle about observer counts in cosmology.
  3.  **Draw the Line:** The principle applies to **outcomes of known chance processes** (the coin), not **background metaphysical facts** (universe size). In Beauty, we know the coin is fair. In Cosmology, we have no such guarantee.

  **Verdict:** The flaw is in **Premise (2)**. It conflates *indexical uncertainty within a world* with *factual uncertainty about which world*. You can keep Thirding by restricting the principle to the former, but you cannot generalize it to the latter without accepting the Presumptuous Philosopher. If your friend refuses to restrict (2), they are logically committed to the cosmology conclusion, and you are right to reject their argument.
