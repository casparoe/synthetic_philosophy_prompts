  ( Self-Correction during drafting ): Wait, Case 3 (Time Dilation) is actually supported by some anecdotal evidence but contradicted by lucid dreaming timing experiments (LaBerge). In lucid dreams, counting seconds in the dream matches seconds in reality. This strongly suggests Case 3 is an illusion of memory (supporting Case 6). I must emphasize this.

