answer: |-
  Dear Student,

  Your intuition is serving you very well, and you are right to feel that the senior's conclusion is too sweeping to be true. The argument you heard is a sophisticated variation of the St. Petersburg paradox, designed to stress-test decision theory, but the leap from a paradox about infinite series to the claim that expected value theory is empty everywhere is a logical overreach. To answer your specific question, the step you should reject is the inference in step five, which claims that because both games have infinite expected value, a rational agent must be indifferent between them. This step relies on an unstated assumption that the principle of indifference, which holds for finite expected values, applies without modification to infinite ones. You are correct to suspect that equal infinities do not carry the same comparative information as equal finite numbers, and preserving the dominance principle is indeed the safer choice.

  The reason this step looked fine to you and your classmates is that we are trained to treat expected value as a single number that summarizes the worth of a gamble. In finite arithmetic, if the number summarizing option A is identical to the number summarizing option B, there is no basis for preference, so indifference is the rational default. When we encounter infinity in calculus or limits, it often behaves like a number, obeying rules like infinity plus one hundred equals infinity. It is therefore incredibly tempting to extend the finite decision rule into the infinite domain, assuming that if the calculation yields the same symbol for both games, the rational choice must be the same. However, expected value is not merely a calculation but a tool for ranking preferences, and that tool is defined over real numbers. When the sum diverges, the expected value is not a real number, and the axioms that guarantee indifference for equal expectations no longer bind. The theory simply does not provide a verdict based on expected value alone when that value is undefined or infinite, so claiming indifference is an error of applying a rule outside its domain of validity.

  Rejecting this step does come with a cost, though it is a cost most decision theorists are willing to pay. The cost is that we must abandon the idea that rational agents simply maximize expected monetary value in all cases. If we accept that infinite expectations break the indifference rule, we acknowledge that linear utility of money is an insufficient model for rational choice when outcomes are unbounded. This forces us to adopt a utility function that grows more slowly than the payoff, such as a logarithmic function, which was Daniel Bernoulli's original solution to the St. Petersburg paradox. By assuming diminishing marginal utility of money, the expected utility of the St. Petersburg game becomes finite, the paradox dissolves, and the expected value of Game B becomes strictly higher than Game A in utility terms, restoring the alignment between expectation maximization and dominance. The price we pay is the simplicity of counting dollars directly, replaced by the slightly more complex task of measuring utility, but this is a small price for a consistent theory.

  You should also feel confident in rejecting the senior's broader conclusion that expected value theory is empty everywhere. This is a hasty generalization that confuses a limitation in edge cases with a total failure of the framework. The vast majority of real-world decisions involve bounded outcomes or probabilities that decay fast enough to ensure convergent expectations. In those domains, expected utility theory remains robust, predictive, and highly informative. The existence of pathological cases involving divergent series does not invalidate the theory for convergent ones, any more than the existence of division by zero invalidates arithmetic for all other numbers. The theory is not silent everywhere; it is only silent or requires modification in the specific neighborhood of infinite expectations, and even there, it is not entirely mute.

  Even in the realm of infinite expectations, the theory can still say something meaningful if we shift our focus from expected value to stochastic dominance. As you noted, the dominance principle is far more secure than the indifference clause for infinite cases. If one gamble pays strictly more than another in every possible state of the world, as Game B does compared to Game A, rationality demands preferring the dominant option regardless of the expected values. This principle survives the collapse of expected value maximization and provides a firm grounding for choice even when sums diverge. Furthermore, by using bounded utility functions, we can restore the ability to calculate finite expectations for almost any realistic gamble, allowing the machinery of expected utility to function normally. Thus, the theory is not wrecked but rather refined, showing us that while money may be unbounded in principle, the value we place on it must be bounded in practice.

  Your instinct to preserve dominance over indifference is philosophically sound and aligns with the consensus in modern decision theory. Dominance is a structural feature of rational choice that relies on state-by-state comparison, whereas expected value maximization relies on aggregation, and aggregation fails when the sum does not converge. By recognizing that the indifference principle is contingent on finite expectations, you save the theory from the senior's refutation. You keep the tools that work for nearly all practical purposes while acknowledging the boundary where naive calculation must yield to deeper axioms. Do not let this paradox shake your faith in the utility of mathematical modeling; instead, let it deepen your understanding of the assumptions that underlie it. The theory remains a powerful guide, provided we respect the limits of its application.
