prompt: |-
  I hold that German folk morality — the disposition to follow rules as such, to wait at a red light on an empty street at three in the morning, to treat Ordnung as carrying genuine moral weight rather than as a mere coordination device — has the better of it when set against the American folk morality of individual conscience, which treats rules as presumptively negotiable and reserves the right to break any rule one's own judgment condemns as stupid or unjust. What would count against my view? I want the counterarguments ranked from what should genuinely move me to what is merely awkward: empirical considerations (about corruption, about what happens to compliance when defectors can always claim conscientious exemption, about whether the rule-follower is easier to govern badly), historical ones (the worry that deference to order shades into merely following orders, and that a culture of rule-conformity was more available for abuse than one that celebrates the dissenter), and philosophical ones (whether the German model can even describe the whistleblower, or must simply condemn her as disorderly). For each, say whether a thoughtful defender of rule-following would concede it as a real cost, or would dismiss it as conflating rule-following with blind obedience — and tell me honestly whether the move of insisting that these are different things is a legitimate distinction that the view earns, or an insulation that lets it survive any counterexample, and whether that should worry me. Please write your answer as continuous prose only, without headings, bullet points, bold text, or tables, in the style of a letter.
