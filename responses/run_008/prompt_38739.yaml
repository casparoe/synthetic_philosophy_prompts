  Your friend's pitch captures the logical structure but distorts Singer's views on psychology and meta-ethics.

  1.  **Pond/Distance/Bystanders:** Accurate. Singer argues physical distance and the presence of other potential helpers are morally irrelevant. (Confidence: 95%)
  2.  **Giving Rule:** Accurate. This is his "strong principle": prevent bad without sacrificing comparable moral importance. It implies giving until marginal utility. (Confidence: 95%)
  3.  **Spending = Letting Drown:** Accurate deduction. Singer equates failing to aid with letting die. (Confidence: 90%)
  4.  **Same Guilt:** Distortion. Singer distinguishes objective wrongness from subjective blame. Fair version: The act is equally wrong, but prevailing societal norms mitigate personal blame and expected guilt. We shouldn't necessarily feel identical guilt. (Confidence: 80%)
  5.  **Requires Utilitarianism:** Wrong. Singer explicitly states the argument relies on premises acceptable to non-utilitarians (e.g., suffering is bad). Fair version: It appeals to common moral intuitions shared by deontologists and utilitarians alike, not just utilitarian calculus. (Confidence: 95%)

  **Conclusion:** Does the "just as bad" conclusion survive? Partially. The claim that the *acts* are equally wrong survives correction. However, the claim that *agents* are equally blameworthy (or should feel equal guilt) does not. Singer acknowledges that violating established norms affects blame, even if it doesn't change the moral obligation. So, we are doing wrong, but we aren't necessarily moral monsters. The pitch conflates the wrongness of the act with the blameworthiness of the agent.

  **Least Sure Point:** The guilt/blame distinction (Claim 4). While Singer clearly separates wrongness from blame in "Famine, Affluence, and Morality," his later works sometimes tighten the link between rational acknowledgment of duty and emotional response. I'm 80% confident he strictly separates them, but his rhetoric on "moral indifference" can blur the line.
