answer: |-
  # Exam Question: Bargaining Solutions in Application

  **Course:** Cooperative Game Theory and Normative Economics  
  **Unit:** Bargaining Theory  
  **Time Allowed:** 45 minutes (for this question)  
  **Marks:** 20

  **Question 1**

  Consider a wage-bargaining scenario between a Union (Player 1) and a Firm (Player 2). They must agree on a package $(x_1, x_2)$ representing the Union's utility (wage bill) and the Firm's utility (profit). If they disagree, both receive $0$.

  **Definitions:**
  *   A **bargaining problem** is a pair $(S, d)$, where $S \subset \mathbb{R}^2$ is a convex, compact, comprehensive feasible set, and $d \in S$ is the disagreement point.
  *   The **Ideal Point** $a(S,d) = (a_1, a_2)$ is defined by $a_i = \max \{x_i : x \in S, x_j \ge d_j\}$.
  *   The **Nash Bargaining Solution (NBS)** is the point in $S$ that maximizes the product $(x_1 - d_1)(x_2 - d_2)$.
  *   The **Kalai–Smorodinsky Bargaining Solution (KSBS)** is the maximal point in $S$ lying on the line segment connecting $d$ to $a(S,d)$.
  *   **Independence of Irrelevant Alternatives (IIA):** If the solution to a problem $(T,d)$ lies within a subset $S \subset T$, then the solution to $(S,d)$ must be the same.
  *   **Individual Monotonicity:** If the feasible set expands such that a player's ideal point increases while the other's remains fixed, that player should not receive a lower payoff.

  **Task:**
  1.  **Construct** a specific numerically explicit bargaining problem $(S, d)$ grounded in the wage-bargaining story above. Define $S$ using vertices or inequalities such that the NBS and KSBS yield **different** outcomes. Explain briefly how the shape of $S$ reflects a specific economic constraint (e.g., a capacity threshold). (5 marks)
  2.  **Compute** both the NBS and the KSBS for your problem. Show all algebraic steps. (10 marks)
  3.  **Argue** which axiom you find more defensible in this specific context: Nash's IIA or Kalai–Smorodinsky's Individual Monotonicity. Justify your choice by referencing the specific coordinates you calculated and how the "kink" or shape of your feasible set interacts with the ideal point. (5 marks)

  ***

  # Model Answer

  **1. Construction of the Bargaining Problem**
  Let the disagreement point be $d = (0,0)$. We define the feasible set $S$ as the convex hull of the vertices $(0,0), (4,0), (2,2),$ and $(0,3)$.
  *   **Economic Interpretation:** This shape reflects a production technology with a "kink." The Union can extract up to 3 units of utility if the Firm gets nothing, and the Firm can secure 4 units if the Union gets nothing. However, the vertex $(2,2)$ represents a high-efficiency equilibrium where both parties gain moderately, but expanding beyond this point (towards the axes) incurs diminishing returns or capacity constraints. The set is convex because any mixture of agreements is feasible.

  **2. Computation of Solutions**
  **Nash Bargaining Solution (NBS):**
  We maximize the Nash product $P = x_1 x_2$ subject to the Pareto frontier of $S$. The frontier consists of two segments:
  *   *Segment A (Firm-heavy):* Connects $(4,0)$ and $(2,2)$. Slope $= -1$. Equation: $x_2 = 4 - x_1$ for $x_1 \in [2,4]$.
      Maximize $x_1(4 - x_1)$. FOC: $4 - 2x_1 = 0 \Rightarrow x_1 = 2$. This yields point $(2,2)$ with product $4$.
  *   *Segment B (Union-heavy):* Connects $(2,2)$ and $(0,3)$. Slope $= -0.5$. Equation: $x_2 = 3 - 0.5x_1$ for $x_1 \in [0,2]$.
      Maximize $x_1(3 - 0.5x_1)$. FOC: $3 - x_1 = 0 \Rightarrow x_1 = 3$. This is outside the domain $[0,2]$, so the maximum is at the boundary $x_1 = 2$, yielding $(2,2)$.
  *   **NBS Outcome:** $(2, 2)$.

  **Kalai–Smorodinsky Bargaining Solution (KSBS):**
  First, determine the Ideal Point $a$.
  *   Max $x_1$ in $S$ is $4$ (at vertex $(4,0)$).
  *   Max $x_2$ in $S$ is $3$ (at vertex $(0,3)$).
  *   $a = (4, 3)$.
  The KSBS lies on the ray from $d(0,0)$ to $a(4,3)$. The equation of this line is $x_2 = \frac{3}{4}x_1$.
  We find the intersection of this ray with the Pareto frontier. Testing Segment A ($x_2 = 4 - x_1$):
  $$ \frac{3}{4}x_1 = 4 - x_1 \implies \frac{7}{4}x_1 = 4 \implies x_1 = \frac{16}{7} \approx 2.29 $$
  $$ x_2 = \frac{3}{4}\left(\frac{16}{7}\right) = \frac{12}{7} \approx 1.71 $$
  Since $x_1 \in [2,4]$, this intersection is valid.
  *   **KSBS Outcome:** $(\frac{16}{7}, \frac{12}{7})$.

  **3. Evaluative Argument**
  In this scenario, I find **Individual Monotonicity (KSBS)** more defensible.
  The NBS selects $(2,2)$, ignoring the fact that the Firm's maximum potential (4) exceeds the Union's (3). The NBS is driven by the local curvature at the "kink" $(2,2)$, satisfying IIA by treating the removal of the triangle above the kink as irrelevant. However, this ignores the *relative* bargaining power implied by the ideal point.
  The KSBS selects $(\approx 2.29, \approx 1.71)$, awarding the Firm more because its ideal payoff is higher. In a wage context, if the Firm has a higher potential profit ceiling (perhaps due to market size) while the Union's wage ceiling is fixed by labor laws, Individual Monotonicity correctly registers this structural advantage. The NBS fails to register the expansion of the Firm's potential unless it changes the local slope at the solution. Since the "kink" represents a technological constraint rather than a bargaining right, conditioning on the ideal point (KSBS) better reflects the parties' relative claims on the surplus.

