answer: |-
  Here is a breakdown of the distinct theses hidden within the slogan "revolutions devour their children," structured for use in your seminar.

  I have categorized them by the *type* of claim they make (structural, psychological, semantic, etc.). For each, I have assessed its truth value, its grounding in the French case, and crucially, whether it functions as a causal **explanation** or merely as a **description**.

  ### 1. The Legitimacy Trap (Structural Thesis)
  *   **The Claim:** Revolutionary regimes lack traditional legitimacy (monarchy, election, divine right). Therefore, their only claim to rule is "moral purity" or "virtue." Any perceived compromise is treason. To maintain legitimacy, the regime must constantly purge those who appear impure.
  *   **Classification:** **Defensible Generalization.** (Associated with historians like François Furet).
  *   **French Evidence:** Robespierre's speeches explicitly linking "Terror" to "Virtue." The Law of Suspects (1793) allowed execution based on moral character rather than overt acts. Danton was executed not for a specific crime, but for "suspect" moderation.
  *   **Explanatory Value:** **High.** This offers a causal mechanism. It explains *why* compromise became impossible and why the guillotine was the specific tool used. It moves beyond "it happened" to "the logic of the regime required it."

  ### 2. The Radicalization Ratchet (Sociological Thesis)
  *   **The Claim:** The skills required to overthrow a regime (agitation, ruthlessness, mobilization) differ from those needed to govern (stability, compromise, administration). Furthermore, in a revolutionary climate, political survival depends on being more radical than your rival. This creates an "outbidding" dynamic where moderates are eaten by radicals, who are then eaten by super-radicals.
  *   **Classification:** **Defensible Generalization.**
  *   **French Evidence:** The sequence of purges: The King $\rightarrow$ Girondins (too moderate) $\rightarrow$ Hébertists (too radical) $\rightarrow$ Dantonists (too corrupt/moderate) $\rightarrow$ Robespierre. Hébert tried to outflank Robespierre on the left; Robespierre had him killed. Danton wanted to slow down; Robespierre had him killed as an enemy of the Republic.
  *   **Explanatory Value:** **High.** This explains the *timing* and *direction* of the Terror. It clarifies why Danton and Hébert died at different times for opposite reasons, yet by the same hand.

  ### 3. The Negative Unity Thesis (Coalitional Thesis)
  *   **The Claim:** Revolutionary coalitions are united only by what they oppose (the Old Regime), not by a shared vision of what comes next. Once the common enemy is removed (or sufficiently weakened), the coalition inevitably fractures into factional warfare.
  *   **Classification:** **Platitude / Trivial Truth.** (Common in political science, but rarely sufficient on its own).
  *   **French Evidence:** The alliance between the bourgeoisie (Girondins) and the sans-culottes (Montagnards) held only while the threat of foreign invasion and royalist revolt was existential. Once the military situation stabilized (mid-1794), the alliance collapsed.
  *   **Explanatory Value:** **Low to Moderate.** This explains why there was *conflict*, but it does not explain why the conflict was resolved by *execution* rather than exile, imprisonment, or election. Many coalitions fracture without mass guillotining.

  ### 4. The Circumstantial Necessity Thesis (Contextual Thesis)
  *   **The Claim:** It was not "revolution" as an abstract concept that caused the deaths, but specific existential crises (foreign war, civil war, economic collapse). In a normal transition, founders survive; in a siege mentality, they become hostages.
  *   **Classification:** **Defensible (and historically robust).** (Associated with Marxist historians like Albert Soboul).
  *   **French Evidence:** The intensification of the Terror correlates directly with military emergencies (the Levée en masse, the Vendée uprising). The Terror de-escalated immediately after the victory at Fleurus (June 1794), suggesting the violence was instrumental, not inherent to "revolution."
  *   **Explanatory Value:** **High (but undermines the slogan).** If this thesis is true, the slogan is misleading. It suggests revolutions *don't* necessarily devour their children; only *besieged* revolutions do. This challenges your tutor's implication that the outcome was inevitable due to the nature of revolution itself.

  ### 5. The Tautological Definition (Semantic Thesis)
  *   **The Claim:** We retrospectively define a "true" revolution as an event where the founders are purged. If a transition of power occurs without the founders being killed, we classify it as a "reform," "coup," or "restoration," not a revolution.
  *   **Classification:** **False / Unhelpful.**
  *   **French Evidence:** None. This is a logical fallacy. The American Revolution did not devour its founders (Washington, Adams, Jefferson all survived and governed). The Glorious Revolution (1688) did not.
  *   **Explanatory Value:** **None.** This is circular reasoning. It uses the outcome to define the event, making it impossible to test. It cannot explain *why* Danton died, only that *because* he died, we call it a revolution.

  ### 6. The Deterministic Law (Universal Thesis)
  *   **The Claim:** It is a law of history that *all* revolutions must kill their leaders. It is an inherent property of radical social change.
  *   **Classification:** **False.**
  *   **French Evidence:** N/A (This is a comparative claim).
  *   **Explanatory Value:** **None.** Because the claim is empirically false (see American Revolution, South African transition from Apartheid, Eastern European transitions of 1989), it cannot serve as a valid explanation for the French case. It creates an illusion of understanding without predictive power.

  ---

  ### Summary for Seminar Intervention

  If you wish to challenge the tutor's use of the phrase, you might frame your question around the distinction between **Description** and **Explanation**.

  *   **The Rhetorical Flourish:** If the tutor means Thesis 5 (Tautology) or Thesis 6 (Deterministic Law), the phrase is a poetic closing device, not an analysis. It shuts down inquiry by suggesting inevitability.
  *   **The Actual Explanation:** If the tutor means Thesis 1 (Legitimacy Trap) or Thesis 2 (Radicalization Ratchet), the phrase is a shorthand for a complex sociological argument.

  **Suggested Question:**
  *"When you say revolutions devour their children, are you suggesting a structural inevitability—that the logic of revolutionary legitimacy requires purges (Thesis 1)—or are you describing the specific contingent pressures of the war crisis in 1793 (Thesis 4)? Because if it's the latter, the slogan might obscure more than it reveals by implying Danton's death was inevitable rather than a result of specific political choices."*
