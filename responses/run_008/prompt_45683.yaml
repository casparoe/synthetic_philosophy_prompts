answer: |-
  **Craft Notes: The Temporal Integrity of Your Protagonist**
  **By Dr. Aris Thorne**

  Too many manuscripts arrive at my desk suffering from metaphysical bloat. Authors treat characters as if they are wholly present at every moment of the narrative. This is endurance, and it is lazy. It invites paradox. It is time to embrace perdurantism.

  Your character is not a single entity enduring from Chapter 1 to Chapter 10. Your character is a spacetime worm composed of distinct temporal parts. When you write, "Elias was brave," you imply that the whole of Elias exists at once, possessing bravery eternally. This is factually incorrect. Only Elias's Chapter 1 temporal part is brave. His Chapter 5 part may be cowardly. To say "Elias changed" is to invite a contradiction: how can one thing be both brave and cowardly?

  At the copy-edit stage, treat the problem of change as a continuity error. If Elias smokes in 1920 and quits in 1921, do not write "He quit." Write: "The 1921 temporal segment lacks the smoking property possessed by the 1920 segment." This preserves numerical identity without logical contradiction. If your beta readers claim the character is "inconsistent," thank them for noticing the qualitative difference between distinct parts of the worm. Do not allow locutions that smuggle endurance back in. A character may not "remain" loyal; only a sequence of loyal stages may follow one another.

  This precision solves the counting problem, particularly in novels with unreliable narrators. If a narrator suffers a psychological fission mid-book, how many protagonists are there? The endurantist panics, counting souls or bodies. The perdurantist counts temporal branches. If the worm splits, you have two protagonists sharing a common past. Clarify this in your style guide. Do not let your pronouns dangle across a fission event. If the narrative voice divides, assign distinct pronouns to the diverging branches to avoid ontological ambiguity.

  ***

  **Sidebar: A Note on Stage Theory**
  Some writers prefer Stage Theory, a rival aesthetic akin to extreme close third-person. Here, only the current temporal stage exists. The character does not extend into the past or future. When the scene ends, that character ceases to be. Pronouns like "I" refer only to whoever is currently on the page. This creates a fragmented, immediate voice, though it complicates flashbacks (which become strictly counterfactuals). Use only if your plot tolerates ontological insecurity.

  ***

  **From the Letters Page**
  *We receive many complaints regarding these standards.*

  *"If the statue is made of clay, are they one character or two? My editor says I must choose, but the material is the same."* — **M. Pygmalion**
  (This is a category error; treat constitution as a formatting issue.)

  *"What about teleportation stories? If he steps into the machine and two come out, who wins the award? You say both, but the prize money is singular."* — **Sci-Fi Writer 99**
  (This is a fission grumble. We do not answer metaphysical hypotheticals here; we fix manuscripts.)

  *"My character is defined by his memories. If a later part forgets the earlier part, is it still the same worm?"* — **Confused Novelist**
  (Identity is not psychological. Stick to the spatiotemporal continuity.)

  Stop writing enduring objects. They do not exist. Your characters are worms. Treat them with the mereological respect they deserve.
