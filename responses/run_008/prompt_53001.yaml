prompt: |-
  I'm taking a grad seminar on formal epistemology (it's cross-listed with econ, decision theory folks show up and it gets heated), and my term paper is on the common prior assumption — the move in Harsanyi-style models where you say all agents start from one prior and any disagreement in their posteriors comes from different private information. My professor's one comment on my abstract was basically "the interesting question isn't whether the assumption is true, it's what would even count as a justification of it," and now I'm stuck because I realize I don't actually know the bar. Before I read another paper arguing for or against it, I want the spec: what would any adequate justification of the common prior assumption have to deliver? Some things I think belong on the list but am not sure how to weigh — it has to vindicate (or at least explain away) the no-trade/agreement results that depend on it, it has to say something about dogmatic priors where an agent puts zero probability on a state and no amount of the other side's evidence can move them, and it has to face the merging-of-opinions issue, since the people who defend common priors often lean on the thought that rational agents' posteriors converge, and that thought seems to smuggle the assumption in again.

  There's also a move a friend of mine keeps pushing that I want you to take seriously even though I can't find it anywhere in the literature: treat two agents' different priors as if they were posteriors from a common prior conditioned on private facts about their own introspective access — like, each agent "knows" something about how their own mind reacts to evidence that no one else can observe, so the priors weren't really common-and-violated, they were posterior-and-conditioned. I genuinely can't tell whether that's a neat justification or a renaming of the problem. And it matters to me that the spec handles the "different priors are just like different utilities" analogy, since the standard reply is that priors are supposed to be about the world while utilities are about you, and I want the list to say whether that distinction is a real requirement or just a camp prejudice.

  So: act as a formal epistemologist who's thought way too much about priors, and please start with a bit of brainstorming before you settle on the list — think about what justifications are even available (normative idealization for equilibrium analysis, Harsanyi's own line about attributing disagreement to information, that kind of thing) and then derive the desiderata from what those justifications need. Give me the requirements with the motivating case behind each one, mark which are genuinely non-negotiable and which are preferences of one camp dressed up as demands, and — this is the part I most want — tell me if any subset of the desiderata is jointly unsatisfiable, because I suspect it is (normative force for the assumption seems to conflict with respecting the empirical fact that actual disagreement isn't all information-driven, but I might be confusing levels here). Also flag which single requirement knocks out the most proposed justifications, and tell me honestly whether my friend's introspection trick survives the list. Please also distinguish, somewhere early, between "good enough to use in a model" and "good enough as a claim about ideal rationality," because I suspect adequacy is relative to that choice and my paper needs to pick one. Take your time with this, I'd rather have it right than fast.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Grad student in formal epistemology (cross-listed with econ/decision theory). Writing a term paper on the Common Prior Assumption (CPA).
      *   **Context:** Professor's feedback shifted the focus from "Is CPA true?" to "What counts as a justification for CPA?"
      *   **Task:** Act as a seasoned formal epistemologist. Provide a "spec" (list of desiderata/requirements) for an adequate justification of the CPA.
      *   **Specific Constraints/Requests:**
          *   Start with brainstorming (types of justifications).
          *   Distinguish between "good enough for modeling" vs. "good enough for ideal rationality."
          *   Derive desiderata from the available justifications.
          *   Mark requirements as non-negotiable vs. camp preferences.
          *   Identify if any subset of desiderata is jointly unsatisfiable (impossibility results).
          *   Flag which requirement knocks out the most justifications.
          *   Evaluate the friend's "introspection trick" (priors as posteriors on private mental facts).
          *   Address the "priors vs. utilities" analogy.
          *   Tone: Expert, nuanced, honest, slightly informal but rigorous (grad seminar level).

  2.  **Deconstruct the Common Prior Assumption (CPA):**
      *   *What is it?* In game theory/epistemology, agents share the same prior probability distribution over the state space. Differences in posteriors arise solely from differences in information partitions.
      *   *Why care?* It's crucial for Aumann's Agreement Theorem, No-Trade Theorems, and epistemic game theory equilibrium concepts.
      *   *The Problem:* Real people disagree. Is it because of info (CPA holds) or because of "worldviews" (CPA fails)?

  3.  **Brainstorming Justifications (The "Available Moves"):**
      *   *Harsanyi's Doctrine:* Disagreement must be due to information. If we knew each other's history, we'd agree.
      *   *Normative/Coherence:* Bayesian updating requires a starting point. If priors are arbitrary, rationality is empty. Common priors ensure intersubjective agreement.
      *   *Evolutionary/Pragmatic:* Agents with "wrong" priors get money-pumped or die out. Market selection leaves only common priors.
      *   *Methodological/Modeling:* It's a simplifying assumption to make games solvable. (The "Friedman-esque" defense).
      *   *The "Priors as Posteriors" Move (Friend's Idea):* Type spaces. Each agent is a "type." The common prior is over the product space of states $\times$ types.

  4.  **Distinguishing "Modeling Utility" vs. "Ideal Rationality":**
      *   *Modeling:* Does it generate tractable, predictive results? (e.g., Nash Eq existence).
      *   *Rationality:* Is it *irrational* to have different priors? (The normative claim).
      *   *Crucial Distinction:* You can justify CPA for modeling without justifying it for rationality. The professor's prompt ("what would count as a justification") implies we need to know *which* game we are playing. I need to make sure the spec separates these.

  5.  **Drafting the Desiderata (The "Spec"):**
      *   *Req 1: Explanatory Power for Disagreement.* Must explain why reasonable people disagree without abandoning rationality. (Links to Harsanyi).
      *   *Req 2: Dynamic Stability (Merging).* If I learn your info, do we agree? (Blackwell-Dubins).
      *   *Req 3: Non-Dogmatism.* Cannot allow zero probabilities on possible states (otherwise info can't update).
      *   *Req 4: The Priors/Utilities Distinction.* Must explain why priors aren't just preferences.
      *   *Req 5: Empirical/Behavioral Plausibility.* (Maybe too strong for normative, but needed for econ).
      *   *Req 6: The "Speculative Trade" Constraint.* Must block betting where both expect to win (No-Trade).

  6.  **Evaluating Tensions and Impossibility:**
      *   *Tension:* Normative force vs. Empirical reality. If CPA is a norm, why do smart people disagree? If it's empirical, it's false.
      *   *Impossibility:* You can't have a justification that is *both* strictly normative (rationality requires it) *and* descriptively accurate (people actually do it) without a massive bridge principle.
      *   *The "Knockout" Requirement:* Likely the **Priors/Utilities Distinction** or **Non-Dogmatism**. Actually, the strongest knockout is usually **The Origin Story**: Where does the common prior come from? If it's "God's eye view," it's not agent-relative. If it's "learning," it presupposes the common prior.

  7.  **Evaluating the Friend's "Introspection Trick":**
      *   *Idea:* Different priors = Posteriors on private mental states (types).
      *   *Analysis:* This is essentially the **Type Space** formalization (Harsanyi 1967-68). It *mathematically* restores the CPA by expanding the state space to include "types."
      *   *Verdict:* It's a mathematical triviality (you can always do this), but does it *justify* the CPA? No, it just pushes the disagreement into the correlation structure of the expanded space. It saves the *formalism* but not the *spirit* (Harsanyi's claim that disagreement is *only* info). It risks being a "renaming of the problem."

  8.  **Addressing Priors vs. Utilities:**
      *   Standard view: Utilities = tastes (subjective, no truth value). Priors = beliefs (objective truth value, aim at truth).
      *   Counter-view (Radical Subjectivism): Priors are also tastes.
      *   *Requirement:* A justification must explain why we treat priors as truth-apt (convergent) while utilities are not.

  9.  **Structuring the Response:**
      *   **Intro:** Acknowledge the professor's sharp point. Set the stage (Modeling vs. Normativity).
      *   **Brainstorming:** Briefly map the landscape of justifications (Harsanyi, Normative, Evolutionary, Methodological).
      *   **The Spec (Desiderata):** List the requirements, categorizing them (Non-negotiable vs. Camp Preference).
      *   **The Tension/Impossibility:** Discuss the conflict between normative force and empirical reality.
      *   **The "Knockout" Requirement:** Identify the hardest hurdle.
      *   **The Friend's Trick:** Analyze the "priors as posteriors on types" move.
      *   **Priors vs. Utilities:** Address the analogy.
      *   **Conclusion:** Advice for the paper.

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get bogged down in math. Keep it conceptual but precise.
      *   *Emphasis:* The professor wants to know "what counts as a justification." So the focus must be on the *criteria for success*, not just listing arguments.
      *   *Nuance:* The "Modeling vs. Rationality" distinction is key. A justification for modeling (tractability) is very different from a justification for rationality (coherence). I need to make sure the spec reflects this bifurcation.
      *   *Friend's Trick:* Be careful. This is basically the "universal type space" argument. It makes CPA tautologically true *if* you include types in the state space. But does it justify the *epistemic* claim? No. I need to be clear on that.
      *   *Impossibility:* The "Agreement Theorem" itself creates a tension. If CPA + Common Knowledge of Posteriors $\rightarrow$ Agreement, then persistent disagreement implies either no CPA or no Common Knowledge. A justification must handle this.

  11. **Final Polish:** Check tone. Ensure it sounds like a senior colleague talking to a grad student. (e.g., "Here's the thing your professor is nudging at...")

  *(Self-Correction on the "Knockout" Requirement)*: What kills the most justifications? Usually, it's the requirement that the justification be *agent-accessible*. If the justification relies on a "God's eye view" (the modeler knows the prior), it fails as a normative guide for agents. I'll highlight the **Agent-Accessibility Requirement**.

  *(Self-Correction on Friend's Trick)*: This is essentially the move from "Priors differ" to "Types differ." In a Harsanyi type space, there *is* a common prior over State $\times$ Types. So mathematically, the friend is right. But epistemically, if my "type" includes my prior, then saying we have a common prior over types is trivial. The substantive claim is whether the variation in types is *informational* or *fundamental*. I need to clarify this distinction.

  12. **Final Review against constraints:**
      *   Brainstorm first? Yes.
      *   Distinguish Modeling vs. Rationality? Yes.
      *   List desiderata with motivation? Yes.
      *   Mark Non-negotiable vs. Preference? Yes.
      *   Jointly unsatisfiable subset? Yes.
      *   Flag "Knockout" requirement? Yes.
      *   Evaluate Friend's trick? Yes.
      *   Priors vs. Utilities? Yes.

  Okay, ready to write.
answer: |-
  This is a fantastic pivot for a term paper. Your professor is steering you away from the empirical question ("Do people actually have common priors?") toward the meta-epistemological question ("What work is this assumption doing, and what would it take to legitimize that work?"). That is where the actual philosophy lives.

  You are right to sense that "adequacy" is relative to the project. A justification that works for an economist trying to prove an equilibrium exists will fail miserably for an epistemologist trying to define ideal rationality.

  Let's walk through this. I'll start by mapping the landscape of justifications (the brainstorm), then we'll build the spec, and finally, we'll stress-test it against your specific worries (the friend's trick, the utilities analogy, and impossibility results).

  ### Part 1: Brainstorming the Landscape of Justifications

  Before we set the bar, we need to know what kinds of bars exist. In the literature, justifications for the Common Prior Assumption (CPA) generally fall into four buckets. Each implies a different standard of "adequacy."

  1.  **The Harsanyi Doctrine (Informational):** Disagreement is *only* due to differences in information. If two rational agents knew each other's entire history of evidence, they would assign the same probabilities.
      *   *Standard of Adequacy:* Plausibility of the counterfactual. Could we *in principle* trace disagreements back to data?
  2.  **The Normative/Coherence View:** Rationality imposes constraints on priors (e.g., Principle of Indifference, Maximum Entropy, or Objective Bayesianism). If rationality constrains priors to a single point (or a tight set), commonality follows.
      *   *Standard of Adequacy:* Logical necessity. Does violating CPA entail a contradiction or a Dutch Book?
  3.  **The Evolutionary/Pragmatic View:** Agents with "deviant" priors get money-pumped or fail to survive in the market. The CPA describes the survivors.
      *   *Standard of Adequacy:* Dynamic stability. Do non-CPA agents get weeded out over time?
  4.  **The Methodological/Instrumentalist View:** We assume CPA not because it's true, but because it allows us to define solution concepts (like Nash or Correlated Equilibrium) and derive theorems (like No-Trade).
      *   *Standard of Adequacy:* Tractability and predictive success. Does the model work?

  **The Crucial Bifurcation:**
  You must distinguish these two projects immediately in your paper, or the spec will be incoherent:
  *   **Project A (Ideal Rationality):** Is it *irrational* to have different priors? (Normative)
  *   **Project B (Modeling Strategy):** Is it *useful* to assume common priors to analyze strategic interaction? (Methodological)

  Your professor's comment ("what would even count as a justification") suggests they want you to focus on **Project A**, because Project B's justification is trivial ("it makes the math work"). However, the econ folks in your seminar care about Project B. Your paper will shine if you show how Project B often smuggles in Project A's norms without paying for them.

  ### Part 2: The Spec (Desiderata for Adequacy)

  Here is the list of requirements an adequate justification must meet. I have categorized them by **Non-Negotiable** (if you fail this, the justification collapses) and **Camp Preferences** (these are battlegrounds, not dealbreakers).

  #### 1. The Origin Story Requirement (Non-Negotiable)
  *   **Motivation:** A prior is a starting point. If you justify the CPA by saying "agents update to a common prior," you have presupposed a *previous* common prior. Justifications often regress infinitely.
  *   **The Demand:** The justification must specify the *source* of the commonality without presupposing it. (e.g., Is it genetic? Logical? Divine? A focal point?)
  *   **Why it's hard:** Most justifications fail here. Harsanyi says "imagine they shared history," but that just pushes the prior back to the beginning of the history.

  #### 2. The Agent-Accessibility Requirement (Non-Negotiable)
  *   **Motivation:** If the CPA is a norm of rationality, the agents must be able to recognize it. If the "Common Prior" is a construct that only the modeler can see (a "God's eye view"), it cannot guide the agents' reasoning.
  *   **The Demand:** The justification cannot rely on facts that are opaque to the agents themselves.
  *   **Why it's hard:** Evolutionary justifications often fail this. The market might select for common priors, but the agents don't *know* that's happening, so it doesn't justify their current belief state as rational.

  #### 3. The Dogmatism Constraint (Non-Negotiable)
  *   **Motivation:** You mentioned this. If Agent A assigns probability 0 to a state that Agent B assigns probability 1 to, no amount of information sharing will merge their opinions (A will treat B's evidence as impossible).
  *   **The Demand:** An adequate justification must rule out disjoint support in priors (often formalized as the "Full Support" or "Common Support" requirement).
  *   **Why it's hard:** It's empirically false. People *are* dogmatic. A normative justification must explain why dogmatism is irrational; a modeling justification must explain why we ignore dogmatic agents.

  #### 4. The Priors-vs-Utilities Distinction (Camp Preference: Objectivists)
  *   **Motivation:** The standard line is: Utilities are tastes (subjective, no truth value); Priors are beliefs (aim at truth, objective truth value). Therefore, priors should converge, utilities need not.
  *   **The Demand:** The justification must explain why priors are truth-apt in a way utilities are not.
  *   **Camp Counter:** Radical Subjectivists (like some Bayesians) say priors *are* like utilities. If you accept this, the CPA loses its normative force.
  *   **Verdict:** If you are arguing for CPA as a rational norm, this is **Non-Negotiable**. If you are arguing for CPA as a modeling tool, this is a **Preference**.

  #### 5. The Speculative Trade Constraint (Non-Negotiable for Econ/Decision Theory)
  *   **Motivation:** The No-Trade Theorem says if CPA holds, agents cannot agree to a bet where both expect positive gain.
  *   **The Demand:** The justification must explain why real-world speculation happens. Either it must show speculation is irrational (strong claim) or explain it as a violation of CPA (informational asymmetry vs. prior differences).
  *   **Why it's hard:** If you justify CPA normatively, you imply most stock trading is irrational.

  #### 6. The Merging/Convergence Condition (Camp Preference: Convergence Theorists)
  *   **Motivation:** Blackwell-Dubins theorem suggests posteriors merge with probability 1 *if* priors are absolutely continuous with respect to each other.
  *   **The Demand:** The justification should guarantee that information sharing leads to agreement.
  *   **Verdict:** This is often a *consequence* of CPA, not a justification for it. Using it as a justification risks circularity (as you suspected).

  ### Part 3: The Impossibility Result (The "Joint Unsatisfiability")

  You suspected there is a tension. You are correct. There is a "Trilemma" here. You cannot simultaneously satisfy the following three desiderata:

  1.  **Normative Force:** The CPA is a requirement of ideal rationality (agents *ought* to have it).
  2.  **Empirical Adequacy:** The justification acknowledges that intelligent, well-informed agents persistently disagree (not just due to obvious info gaps).
  3.  **Agent-Accessibility:** The reason for the CPA is accessible to the agents (not just a modeler's fiction).

  **Why they conflict:**
  If CPA is a norm of rationality (1), then persistent disagreement among rational agents (2) is impossible unless they lack common knowledge of rationality. But if the justification is accessible (3), agents should know they are violating rationality and correct it. Since they don't correct it, either they aren't rational (undermining 1), the disagreement is due to inaccessible facts (undermining 3), or the disagreement is fundamental (undermining 1).

  **The Way Out:** Most successful papers pick two.
  *   *Harsanyi/Econ:* Picks 1 & 3 (It's rational and accessible), denies 2 (Disagreement is *always* info, even if we can't see the info yet).
  *   *Evolutionary:* Picks 2 & 3 (People disagree now, but will converge), denies 1 (It's not a static norm, it's a dynamic outcome).
  *   *Modeler:* Picks 1 & 2 (We assume rationality and we see disagreement, so we model the disagreement as info), denies 3 (The common prior is a modeling fiction, not something agents hold).

  ### Part 4: The "Knockout" Requirement

  If I have to flag the single requirement that kills the most proposed justifications, it is **The Origin Story Requirement**.

  *   **Why:** Almost every defense of the CPA relies on a "as if" clause. "Act *as if* you have a common prior." "Imagine they *had* the same history."
  *   **The Kill:** When pressed on *why* the priors are common, defenders often retreat to "It's a definition of the type space." But that is circular. If the justification for the CPA is "We define the model such that there is a common prior," that is a **Methodological** justification, not a **Normative** one.
  *   **Impact:** This requirement forces you to admit that most philosophical defenses of the CPA are actually just methodological stipulations dressed up in normative clothing. This is a killer argument for a term paper.

  ### Part 5: Evaluating Your Friend's "Introspection Trick"

  Your friend is proposing a move that is formally standard but philosophically slippery. This is essentially the **Harsanyi Type Space** move.

  *   **The Move:** Let $\Omega$ be the state space. Agent $i$ has prior $P_i$. Define a new state space $\Omega' = \Omega \times T_1 \times T_2$, where $T_i$ represents the agent's "type" (which includes their prior). Put a common prior $P^*$ over $\Omega'$. Then $P_i(\cdot) = P^*(\cdot | t_i)$.
  *   **Does it survive the spec?**
      *   **Mathematically:** Yes. You can *always* do this. It is a theorem that any belief hierarchy can be embedded in a common prior type space.
      *   **Philosophically:** **No.** It fails the **Origin Story Requirement** and the **Priors-vs-Utilities Distinction**.
      *   **Why:** By moving the disagreement into the "type," you haven't explained *why* the types differ. If the difference in types is fundamental (brute fact), then you haven't justified the CPA; you've just renamed "different priors" to "different types conditioned on a common prior."
      *   **The Trap:** If the variation in types is due to *information* (e.g., I know my brain chemistry, you don't), then fine, CPA holds. But if the variation in types is just "I am wired to be optimistic," then the Common Prior $P^*$ over the expanded space is a fiction. It exists for the modeler, but it doesn't represent a shared rational constraint on the agents.
      *   **Verdict:** It is a **renaming of the problem**. It saves the *formalism* of the CPA (allowing you to use the theorems) but it evacuates the *epistemic justification* (Harsanyi's claim that disagreement is informational). It turns the CPA into a tautology, which makes it useless as a normative claim.

  ### Part 6: The Priors vs. Utilities Analogy

  You asked whether the distinction is a real requirement or camp prejudice.

  *   **The Standard View:** Utilities = Conative (desires). Priors = Cognitive (beliefs). Beliefs aim at truth; desires do not. Therefore, beliefs should converge (CPA), desires need not.
  *   **The Challenge:** If you are a Radical Subjective Bayesian (like de Finetti), priors are just expressions of betting disposition, identical in status to utilities.
  *   **The Spec's Stance:** For the CPA to have normative bite, the **Priors-vs-Utilities Distinction** is **Non-Negotiable**.
      *   *Reasoning:* If priors are like utilities, then insisting on a Common Prior is like insisting everyone must like chocolate ice cream. It's not irrational to disagree.
      *   *Your Paper's Angle:* You can argue that the CPA *only* works if we accept an Objectivist view of probability (priors track objective chances). If we accept Subjectivism, the CPA loses its normative force and becomes purely methodological. This is a strong pivot for a seminar paper.

  ### Summary Advice for the Paper

  1.  **Pick Your Lane:** Explicitly state whether you are evaluating the CPA as a **Norm of Rationality** or a **Modeling Tool**. The spec changes drastically. (I recommend analyzing the tension *between* these two).
  2.  **Use the Trilemma:** Structure the paper around the impossibility of satisfying Normative Force, Empirical Adequacy, and Agent-Accessibility simultaneously.
  3.  **Deploy the "Knockout":** Use the **Origin Story Requirement** to show that most philosophical defenses collapse into methodological stipulations.
  4.  **Handle the Friend:** Acknowledge the "Type Space" move is mathematically valid but epistemically vacuous. It saves the theorems but kills the Harsanyi Doctrine.
  5.  **Conclusion:** The "justification" for the CPA is not that it is true, but that it is the *price of admission* for a certain kind of interactive epistemology. If you want to model agreement, you pay with the CPA. If you want to model fundamental disagreement, you must abandon the CPA and lose the No-Trade theorems.

  This approach respects the econ folks (by acknowledging the modeling utility) while satisfying the epistemology professor (by dissecting the normative claims). Good luck. This is a strong topic.
