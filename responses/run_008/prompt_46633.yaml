      *   **Move 4: Yuki's Attack on Minimal Change & Selection Point.**
          *   *Claim:* Keeping Red fixed is not neutral; it's a substantive assumption. Also, why did the radioman mention Red? (Selection Bias/Pragmatics).
          *   *Assessment:* Very strong. "Minimal change" is never neutral; it depends on the parameterisation. The selection point is crucial (Gricean pragmatics). If the radioman knew she was in Blue, would he have said "If Blue..."?
