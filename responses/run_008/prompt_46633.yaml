      *   **Constraint:**
          *   $P_{new}(HQ | Red) = 3/4$.
          *   This implies $P_{new}(2nd | Red) = 1/4$.
      *   **The Core Philosophical Issue:** How to update probabilities given a constraint on a *conditional* probability, rather than a simple proposition (like "I am in HQ").
      *   **Standard Solutions:**
          *   *Maximum Entropy (MaxEnt):* Minimises information gain subject to constraints. Usually yields $P_{new}(Red) < 1/2$.
          *   *Jeffrey Conditioning:* Doesn't apply directly because we don't have a partition of new probabilities.
          *   *Van Fraassen's View:* There is no unique rational answer. The constraint underdetermines the posterior.
      *   **Yuki's Extreme Case Arithmetic Check:**
          *   Constraint: If Red, then certainly HQ ($P(HQ|Red) = 1$).
          *   This eliminates the possibility of being in Red 2nd Company.
