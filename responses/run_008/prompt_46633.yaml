      *   Actually, MaxEnt solution for the 3:1 case:
          *   Prior: $B=0.5, R_H=0.05, R_S=0.45$.
          *   Constraint: $R_H / (R_H + R_S) = 0.75 \Rightarrow R_H = 3 R_S$.
          *   MaxEnt minimises $\sum p \ln(p/q)$.
          *   Result usually shifts probability away from Red.
      *   Yuki is "more right" in the sense that her intuition aligns better with standard information geometry, and her extreme case exposes the counter-intuitive nature of Marco's stance. But Marco is "right" that the constraint doesn't *logically* force the shift.
