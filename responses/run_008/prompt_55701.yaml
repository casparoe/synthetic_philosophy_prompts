      *   *Premise 2 (Axiological):* The lives of those who die young are net negative (suffering > pleasure). (Highly contested/philosophical).
      *   *Premise 3 (Metaphysical/Ethical):* Non-existence is not a harm (Asymmetry/Non-Identity). (Contested/philosophical).
      *   *Premise 4 (Ecological/Causal):* Reducing habitat reduces total lives begun without causing worse suffering elsewhere. (Highly complex/empirical).
