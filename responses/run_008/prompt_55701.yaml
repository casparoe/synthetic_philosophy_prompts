          *   *Population Ethics:* Total Utilitarianism (more lives = more value, even if marginal) vs. Average Utilitarianism vs. Negative Utilitarianism (focus on reducing suffering). This is the *big* philosophical driver. The user mentioned Asymmetry, but Total vs. Negative Utilitarianism is more central to the "reduce population" conclusion.
