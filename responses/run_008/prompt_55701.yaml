  3.  **Drafting Section 1: Ecological Complications (The "Real Work" and Vulnerabilities):**
      *   *The User's Intuition:* Less habitat = fewer fish = less suffering.
      *   *The Ecological Reality:* It's not linear.
      *   *Key Concept 1: Carrying Capacity ($K$) vs. Density Dependence.* If you reduce habitat, does the population drop proportionally? Often yes, *but* density-dependent mechanisms matter. If you reduce space, competition might increase, potentially increasing suffering per individual even if total numbers drop.
      *   *Key Concept 2: Compensatory vs. Additive Mortality.* This is crucial. If humans destroy habitat, do the animals die *because* of us (additive), or would they have died anyway due to starvation/predation (compensatory)? If mortality is compensatory, destroying habitat doesn't save them from death; it just changes the cause. If it's additive, we are killing them sooner.
      *   *Key Concept 3: Source-Sink Dynamics.* Some habitats are "sources" (net exporters of individuals) and some are "sinks" (net importers, often low quality). Destroying a "sink" might actually *increase* overall welfare if the sink is a welfare trap. Destroying a "source" collapses the population.
      *   *Key Concept 4: Land-Use Change (The Replacement Problem).* You rarely have "empty" land. Forest $\rightarrow$ Suburb. Forest animals (mice, insects, birds) $\rightarrow$ Suburb animals (rats, pigeons, pests). Which set has worse welfare? Also, humans often introduce predators or pesticides in converted land, potentially increasing suffering intensity.
      *   *Vulnerability:* The inference from "less habitat" to "fewer lives begun" assumes a simple linear scaling that ignores density-dependent suffering and replacement populations.

