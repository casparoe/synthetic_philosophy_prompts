answer: |-
  You are not capricious. Your intuitions are actually remarkably consistent, but they are tracking two different metrics simultaneously, and you haven't distinguished between them yet. You are oscillating between evaluating **Moral Being** (what kind of person you are) and **Moral Achievement** (what it cost you to do the good thing).

  Once you separate these, your verdicts line up into a coherent hierarchy. Here is the principle that unifies your cast, followed by where your protagonist and your unmentioned case land.

  ### The Unifying Principle: The Locus of Constraint

  Your moral worth judgments are determined by **where the pressure to do good comes from.**

  1.  **External Constraint (Zero/Low Worth):** The good act stops if the external threat is removed.
      *   *Wallet Guy:* Remove the camera, he keeps the money. (Zero Worth).
      *   *Priest:* Remove the fear of hell, the charity collapses. (Low Worth).
      *   *Why:* The goodness is not in *them*; it is in the environment. They are merely conduits for external coercion.

  2.  **Internal Constraint/Will (High Worth):** The good act persists because the agent imposes the necessity on themselves, regardless of inclination or external threat.
      *   *Marta:* The pressure is internal (spite/grief). It costs her money and emotional energy, but *she* is the engine. (Full Worth).
      *   *Brother:* The pressure is internal (duty). It costs him comfort and peace. He overrides his own nature. (High Worth).
      *   *Aid Worker:* The pressure is internal (discipline). She overrides her emotional need for connection to sustain the utility. (High Worth, despite the resentment you feel at the dehumanization).
      *   *Why:* The goodness is sustained by the agent's will. It is robust against changes in the environment.

  3.  **Constitutional Goodness (Paradigm Worth):** The good act requires no pressure because it aligns with the agent's nature.
      *   *Loyal Friend:* She doesn't feel duty; she feels love. The "constraint" is nonexistent because her will and her inclination are identical. (Paradigm Worth).
      *   *Why:* This is the Aristotelian ideal of virtue. It is the most stable form of goodness, but paradoxically, the least *dramatic*.

  ### Resolving the Tension: Brother vs. Friend

  You noted it feels "weird" to say the Brother (who curses while rescuing) might have *more* worth than the Loyal Friend (who acts out of pure love).

  Here is the repair: **The Friend has higher *Moral Status*; the Brother has higher *Moral Achievement*.**

  *   **Status:** If you were building a team for the long haul, you want the Friend. She is reliable without burnout. She is the "saint."
  *   **Achievement:** If you are judging the *moment of action*, the Brother is doing more "moral work." He is overcoming gravity.

  In life, we want to be the Friend. In fiction, we respect the Brother. The Brother demonstrates the *capacity* for good even when the *inclination* for good is absent. That is why your gut tells you his worth is high, perhaps even "more" in a narrative sense: he is actively choosing the good against the drag of his own self. The Friend is simply flowing with it.

  ### The Verdict on Your Protagonist

  Your protagonist is currently in the transition zone between **External Constraint** (Vanity/Impressing the Woman) and **Internal Constitution** (Habit/Identity).

  *   **Phase 1 (Vanity):** This is functionally similar to the Priest. He is performing good to avoid a penalty (loss of status/her disapproval) or gain a reward (her affection). If she leaves and he stops, he was Wallet Guy.
  *   **Phase 2 (Habit):** This is the critical pivot. Aristotle argues that habituation *is* how virtue is built. We become just by doing just acts.
  *   **The Test:** To determine his worth, you must apply the **Counterfactual Stability Test**.
      *   If the woman returned tomorrow and said, "Actually, I hate generosity, stop doing this," would he stop?
      *   If yes: He is still under External Constraint. (Low Worth).
      *   If no: The habit has decoupled from the vanity. It has become **Second Nature**.

  **Where he lands:** If the ambiguity at the end is that *even he doesn't know why he does it anymore*, that suggests the motive has successfully migrated from External (Her) to Internal (Habit/Identity).
  **Verdict:** **Full Moral Worth.**
  Why? Because he has successfully internalized the constraint. The "vanity" was the scaffolding; the "habit" is the building. Scaffolding is ugly, but if the building stands without it, the building is sound. His worth comes from the fact that the good act is now self-sustaining. He has tricked himself into becoming the Loyal Friend, even if he started as the Wallet Guy.

  ### The Unmentioned Case: The Mistaken Fact

  *Case:* A man returns money he thinks is stolen, but the "victim" was actually the thief. He does the right thing based on false information.

  **Principle Prediction:** **Full Moral Worth.**

  **Reasoning:** Look at your verdict for the Wallet Guy. He did the right thing (returned wallet) but had **No Worth**. Why? Because his *Will* was bad, even if the *Outcome* was good.
  Therefore, your system judges the **Will**, not the **Outcome**.

  In the Mistaken Fact case:
  *   **Outcome:** Bad (Thief is enriched).
  *   **Will:** Good (Desire to restore justice).

  Since you already established with the Wallet Guy that Outcome is irrelevant to Worth, you must be consistent here. The agent's will was aligned with the Good *as he perceived it*. The error is epistemic (knowledge), not moral (will).
  **Verdict:** His worth is intact. In fact, this is the tragedy of the moral life: you can have a perfect will and still cause harm. If you discard this verdict, you break your own rule about the Wallet Guy.

  ### Summary for the Novel

  You don't need to accrete epicycles. You just need to trust that your readers, like you, are tracking the **Locus of Constraint.**

  1.  **Don't hide the vanity.** The vanity makes the starting point clear (External).
  2.  **Highlight the friction.** Show the moments where continuing the good act *costs* him something now that the woman is gone. If it costs him nothing, it's just inertia (low worth). If it costs him, and he pays it anyway, it's becoming Internal (high worth).
  3.  **The Ambiguity is the Point.** The fact that he can't tell *why* he's doing it is the strongest evidence that the habit has taken root. Pure virtue (The Friend) doesn't ask why. Pure calculation (The Priest) knows exactly why. The man who is *becoming* good is the one who is confused by his own generosity.

  Your intuitions are consistent. You value **Internalized Necessity** over **External Coercion**, and you recognize that **Struggle** (Brother) is a different, often more narratively potent, category of worth than **Ease** (Friend). Your protagonist is a Brother learning to be a Friend. That is a complete moral arc.
