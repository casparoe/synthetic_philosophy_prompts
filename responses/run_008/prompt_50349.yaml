      *   Need to be careful. Tolstoy's content is *moral/religious*. The user can propose a *formal/aesthetic* content standard. E.g., The feeling must be *individuated* (specific) rather than *generic*. Kitsch is generic sadness. Great art is specific sadness. This keeps the "transmission" model but filters kitsch.
      *   Actually, the *Universality vs. Difficulty* tension is also huge. But the Kitsch one breaks the definition of *Merit*. The Universality one just makes the user hypocritical about their taste. The Kitsch one makes the theory useless. So Kitsch is #1 severity.
      *   Wait, the "Single Best Fix" should resolve the most tension. If I fix the Merit Metric (Infection + Specificity), does it fix Universality? Maybe. If art transmits specific feelings, maybe difficult art transmits *more specific* feelings that require training to decode, whereas kitsch transmits *generic* feelings anyone can get. Yes, that links them.

  9.  **Final Polish:** Check against constraints.
      *   Rank tensions? Yes.
