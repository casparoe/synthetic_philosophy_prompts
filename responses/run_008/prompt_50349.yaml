      5.  Identify the "Silver Bullet."

      *Silver Bullet:* Shift from "Strength of Infection" to "Fidelity of Transmission regarding Complex Feelings." Kitsch fails because it simplifies feeling, not because it's immoral. Difficult art succeeds because it transmits complex feeling, even if the audience is smaller *initially*.

      *Wait, one nuance:* Tolstoy defines Art as transmission. He defines *Good* Art as transmission of *good* feeling. The user wants to define *Good* Art as transmission of *strong* feeling. That's the divergence.
