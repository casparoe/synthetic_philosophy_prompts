answer: |-
  Verdict
  You should reject Step (2). Your friend conflates causal independence (voters not talking to each other) with statistical independence (uncorrelated errors). This distinction is the actual mathematical requirement for Condorcet's theorem to hold.

  Why the friend's reading of that step is wrong
  In probability theory, independence requires that errors are uncorrelated, not just that voters are isolated. Your friend argues that because voters don't see each other's ballots, their votes are independent. However, if voters consume the same misinformation sources, their errors share a common cause. This creates positive correlation: if one person is misled by a viral lie, millions of others are likely misled by the same lie. Condorcet's math relies on errors canceling out like random noise around a true mean. Correlated errors amplify instead of canceling. If 51% of people are individually competent but 100% share a systemic bias pushing them toward the wrong answer, the crowd converges on falsehood with certainty, not truth. The theorem breaks because the variance doesn't shrink to zero; the shared bias remains dominant regardless of sample size. Crucially, common information sources create statistical dependence even without direct communication, violating the theorem's assumption entirely.

  Whether my instinct about (3) fails too, or actually holds
  Your instinct about Step (3) also actually holds water, though Step (2) is the mathematical killer. On technical news questions, "following the news" often exposes people to conflicting narratives, potentially dropping average competence below 50%. If the average voter is systematically misinformed rather than randomly noisy, they are worse than a coin flip. Even if 51% accurate on isolated facts, complex questions involve hidden variables where lay intuition really fails. Furthermore, misinformation campaigns are designed specifically to push large groups below that threshold on purpose. So while Step (2) destroys the theorem's applicability regardless of competence, Step (3) is often truly empirically false in the very modern media landscape, reinforcing the conclusion that crowds aren't infallible on specific topics.

  What's left of the theorem after this
  Condorcet's theorem remains valid for systems with genuine error independence, such as ensemble machine learning models or panels of experts with methodologies. It explains why averaging measurements improves accuracy, but not why averaging biased opinions does. This preserves the value of expertise: experts are not "more accurate voters," but sources of diverse, de-correlated information that break systemic biases. The theorem teaches us that diversity of method matters more than diversity of people if everyone thinks alike. Apply it only where errors are uncorrelated, rarely true for public opinion. Expertise matters because it provides the diversity required to satisfy the theorem's conditions, something a million-person homogenous poll cannot achieve. This actually validates fact-checking to decorrelate public understanding before crowdsourcing becomes viable. Experts act as truly independent sensors rather than correlated nodes, ensuring the conditions for the theorem are met. Otherwise, the crowd is merely a megaphone for common shared bias.
