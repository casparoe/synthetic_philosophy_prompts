prompt: |-
  hi, so I'm a TA on a second linear algebra course. Last week the lecturer proved that every vector space has a basis and pulled Zorn's lemma out of nowhere to do it — roughly, take a maximal linearly independent set, that's your basis, existence of the maximal set by Zorn. A bunch of students came up to me afterwards asking what Zorn's lemma even says, so I've been given one fifty-minute section to unpack it. The students have all done a first proofs course: they know partial orders and they've bumped into chains, none of them have done set theory, and I already know from tutorial that most can't distinguish a maximal element from a maximum one.

  To be clear, I know the lemma fine myself. What I want is a plan for the section, not an explanation of it:

  - the order things have to go in. what has to be on the board before the statement of the lemma can be anything other than noise to them, and why that order rather than some other — I keep flip-flopping between stating the lemma up front and then decoding it piece by piece, versus building all the pieces first and stating it in the last ten minutes as a reveal. which is better and why;
  - one carrying example for the maximal/maximum distinction. my instinct is greedy scheduling: take a maximal set of non-overlapping meetings by always grabbing the one that finishes earliest, then show the greedy set is maximal but not the biggest possible one. does that example have what I need it to have (and what exactly does it need to have), or is there a better one I'm missing;
  - the misconceptions they'll form. I can already predict two: 'maximal just means biggest' and 'Zorn's lemma is a recipe for building the object, you keep extending until you can't'. what other ones should I be ready for, and at what point in the sequence should each be headed off — I don't want to preempt mistakes they've not made yet, but I also don't want one sitting there quietly for twenty minutes;
  - what to openly refuse to cover. the equivalence with the axiom of choice is the obvious temptation and I suspect even a hand-wavy sketch would eat the whole section. tell me what to say when I punt on it, so the punt sounds honest rather than like I don't know;
  - one check question for the last five minutes that would show they actually understood rather than just nodded along. I was thinking of handing them the finite subsets of N ordered by inclusion and asking whether Zorn's lemma applies to it. is that a good check, and if so what would a correct answer have to contain for me to be satisfied?

  Please write your answer in British English — it's a UK course, so 'mathematical' not 'mathematic' and that sort of thing. apologies for typos btw, writing this in the ten minutes I get between sections.
