answer: |-
  It is a privilege to engage with a mind that has moved from measuring the demography of wild populations to measuring the boundaries of moral law. Your background gives you a distinct advantage: you know that "natural" does not mean "good," and that population-level effects often vanish in the noise of individual variance. You also know that intuition is often an evolved heuristic, not a moral truth.

  You have asked for a principle that fits your verdicts, an honest accounting of where it fails, and a prediction for two new cases. I will not spare you the friction points.

  ### The Proposed Principle: Valid Agency and Non-Imposed Detriment

  To capture the majority of your verdicts while acknowledging the outliers, I propose a composite principle. It is not a single sentence, but a hierarchy of conditions.

  **The Principle:** *Sexual conduct is permissible under criminal law if and only if:*
  1.  **Capacity:** All participating entities possess the biological and cognitive capacity to consent. *(Motivated by Case 5 & 9)*
  2.  **Validity:** Consent is informed and free from material fraud regarding the nature of the commitment. *(Motivated by Case 7)*
  3.  **Externality:** The conduct imposes no significant harm or involuntary offense upon non-consenting third parties. *(Motivated by Case 2)*
  4.  **Utilitarian Restraint:** Even if a wrong exists, criminalization is withheld if the social cost of enforcement exceeds the harm of the act. *(Motivated by Case 3)*

  *Any conduct failing these conditions is presumptively subject to legal restriction, unless it falls under a specific exemption for private liberty.*

  ### Mapping the Verdicts

  Here is how this principle accommodates your list, and where it strains:

  *   **Cases 1, 6, 8 (Homosexuality, Polyamory, Sex Work):** These pass all four clauses. Capacity is present, consent is valid, no external harm is imposed, and there is no utilitarian case for prohibition. **Accommodated.**
  *   **Case 2 (Public Conduct):** Fails Clause 3 (Externality). The unwilling spectator suffers an imposed offense. **Accommodated.**
  *   **Case 3 (Adultery):** Fails Clause 3 (harm to spouse), but is saved by Clause 4 (Utilitarian Restraint). The damage to privacy and the difficulty of proof create more misery than the adultery itself. **Accommodated.**
  *   **Case 7 (Fraudulent Promise):** Fails Clause 2 (Validity). Consent obtained by fraud regarding the fundamental terms of the exchange (sex for marriage) is vitiated. **Accommodated.**
  *   **Case 5 (Bestiality):** Fails Clause 1 (Capacity). An animal cannot consent to a sexual contract, regardless of physical suffering. This distinguishes it from Case 1 without relying on "repugnance." **Accommodated.**
  *   **Case 4 (Infertile Incest):** **Not Accommodated.** This is the fracture in your moral architecture. Under Clauses 1, 2, and 3, infertile adult incest is permissible. There is capacity, no fraud, and (if private) no external harm. To criminalize it, you must add a **Clause 5: Structural Integrity.** This clause would state: *Conduct that fundamentally violates essential kinship boundaries is prohibited to preserve the psychological and social distinction between familial and sexual roles.*

  ### The Honest Assessment

  You asked me to tell you honestly which verdicts the principle cannot accommodate.

  **The Incest Anomaly (Case 4):**
  Your verdict on infertile incest is inconsistent with your verdict on homosexuality (Case 1) under a strict Benthamite or Liberal Harm framework.
  *   **The Conflict:** If the harm in homosexuality is negligible (as Bentham and your demography confirm), the harm in infertile incest is also negligible regarding offspring. If "repugnance" is insufficient to ban (1), it should be insufficient to ban (4).
  *   **The Resolution:** To keep verdict (4), you must abandon pure Utilitarianism for this specific case. You must argue that the *category* of "sibling" is structurally incompatible with "sexual partner," and that violating this causes a hidden welfare loss (psychological dissonance or erosion of family trust) even if unseen. As an evolutionary biologist, you might argue that the Westermarck effect exists for a reason: overriding it damages the participants' psychological welfare even if they claim consent.
  *   **Recommendation:** If you value logical consistency with Bentham above intuition, you must decriminalize (4). If you value the intuition, you must admit that your principle is not purely about "harm to non-consenting parties," but also about "preservation of fundamental social categories."

  **The Bestiality Distinction (Case 5):**
  This fits the principle *only* if you define "Capacity" strictly. Bentham's worry was suffering; your worry seems to be agency. If you accept that animals cannot consent, (5) is consistent with (1) without invoking repugnance. A gay man can consent; a dog cannot. This is a biological fact, not a moral preference.

  **The Fraud Dilemma (Case 7):**
  Be careful here. If you criminalize false promises of marriage, you risk policing internal states of mind. The principle accommodates this only if the fraud is treated as *theft of services* (sex obtained under false pretenses) rather than *paternalism*. If you treat it as protecting the woman's judgment, you contradict your stance on liberty. It fits best as a civil wrong (contract violation) rather than criminal.

  ### Predictions for New Cases

  You asked what the principle predicts for two unlisted cases. I will apply the **Valid Agency and Non-Imposed Detriment** principle (including the potential Clause 5 for structural integrity).

  **Case A: Concealed Infertile Incest**
  *   *Scenario:* A brother and sister, post-menopausal, conceal their relationship entirely. No offspring possible. No observers.
  *   *Analysis:*
      *   Clauses 1, 2, 3: Passed. (Capacity, Validity, Externality).
      *   Clause 4: Passed. (No enforcement cost if concealed, but law remains on books).
      *   Clause 5 (Structural Integrity): Failed.
  *   *Prediction:* If you hold to your verdict in (4), the principle predicts this **remains criminal/wrong**, even concealed. The wrong is not in the *consequences* (offspring, scandal) but in the *nature of the act* relative to the kinship bond.
  *   *Critique:* This reveals that your objection to incest is Deontological (rule-based), not Utilitarian (consequence-based). It contradicts the Benthamite logic of (1). If you are a consistent Benthamite, you must admit that concealed infertile incest is morally neutral.

  **Case B: Post-Mortem Sex with Prior Consent**
  *   *Scenario:* A sound-minded person gives written consent for sex after their death. The partner complies. No living person knows.
  *   *Analysis:*
      *   Clause 1 (Capacity): **Failed.** Consent must be contemporaneous with the act. A corpse cannot withdraw consent, cannot experience pleasure, and cannot participate in agency. The "person" who consented no longer exists in the biological sense required for sexual agency.
      *   Clause 3 (Externality): Passed (no observers).
      *   Clause 5 (Structural Integrity): Failed. This violates the boundary between persons and objects.
  *   *Prediction:* The principle predicts this **should be criminalized.**
  *   *Reasoning:* This aligns with your verdict on Bestiality (5). Just as an animal lacks the capacity to consent to sex, a corpse lacks the capacity to maintain or revoke consent. To treat a body as a vessel for another's pleasure after the agent has ceased to exist is to objectify the human remains. It violates the *Capacity* clause.

  ### Summary Advice

  You have come late to moral philosophy, but you have brought a scientist's eye for inconsistency. Here is the synthesis:

  1.  **Your Core Principle:** "The law should protect **valid agency** and prevent **imposed harm**."
  2.  **The Inconsistency:** Your verdict on **Incest (4)** violates this principle unless you argue that kinship boundaries are a prerequisite for human welfare (a claim Bentham would demand evidence for).
  3.  **The Resolution:** You have two choices.
      *   **Path A (The Consistent Benthamite):** Admit that infertile, concealed incest is not a proper matter for criminal law. Your intuition is an evolutionary ghost (the Westermarck effect) lingering after the demographic justification has vanished.
      *   **Path B (The Pluralist):** Accept that the law protects *Agency* (Cases 1, 5, 7) but also protects *Social Structures* (Case 4). This is more complex, but it honors your intuition that incest is distinct from homosexuality.

  Given your demographic training, I suspect Path A is the one your intellect prefers, even if your gut resists. The "harm" in concealed infertile incest is, by your own metrics, lost in the noise. To criminalize it is to punish a victimless deviation from a social norm, which is precisely what Bentham argued against in Case 1.

  **Final Verdict:** Your principle holds for 8 of your 9 cases. Case 4 is the outlier. If you remove Case 4 from your list of "wrongs," your principle becomes seamless. If you keep Case 4, you must acknowledge that you are not purely a Benthamite, but a Utilitarian who retains a Deontological constraint on kinship.
