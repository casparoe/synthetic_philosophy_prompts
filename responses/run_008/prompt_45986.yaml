  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I use quotes? *Correction:* Ensure no " " are used.
      *   *Check:* Did I address the Panopticon tension? *Correction:* Make sure to explicitly discuss the visibility vs. privacy conflict.
      *   *Check:* Did I distinguish the three grades of claim? *Correction:* Use phrasing like "here he would be clear," "here he would pause for data," "here lies a contradiction."
