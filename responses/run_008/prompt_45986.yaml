      *   **Task:** Draft advice on two matters: (1) mandatory age verification for adult websites, (2) regulatory treatment of AI companion apps (romantic/sexual).
      *   **Lens:** Jeremy Bentham's political thought, specifically his writings on sexual morality (including unpublished manuscripts).
      *   **Role:** Historian of political thought with deep expertise in Bentham's corpus.
      *   **Format:** Continuous prose only, long letter from scholar to policy official. No headings, no bullet points, no bold text, no tables. No quotation marks. No bibliographies.
      *   **Content Requirements:**
          *   Reason through Bentham's actual arguments (principle of asceticism vs. utility, mischief lies in pain not character, dislike vs. harm, cost of enforcement).
          *   Project Bentham onto modern questions (age verification, anonymity, platform liability, AI companions).
          *   Distinguish three grades of claim: direct principles, empirical guesses, internal tensions.
          *   Address the tension between non-punishment of private vice and the Panopticon (perpetual visibility).
          *   Close with a candid paragraph on where extrapolation is least trustworthy.
          *   Attribute views in own words (no quotes).

  2.  **Deconstruct Bentham's Philosophy (relevant to the prompt):**
      *   *Utility Principle:* Actions are right if they promote happiness (pleasure minus pain).
      *   *Sexual Morality:* Bentham was radically liberal for his time. He argued against laws punishing "irregular" sexual acts (homosexuality, masturbation, non-procreative sex) unless they cause specific harm to others.
      *   *Principle of Asceticism:* He criticized moralists who condemn pleasure simply because it is pleasure, or based on religious/traditional dogma without regard for consequences.
      *   *Mischief:* An act is only mischievous if it causes pain. Disgust or dislike by others is not sufficient grounds for prohibition unless that disgust is severe enough to outweigh the pleasure (which he usually doubted).
      *   *Enforcement Costs:* Laws against private vice are expensive, intrusive, and often ineffective. They create more pain (punishment, fear, blackmail) than the act itself.
      *   *Panopticon Tension:* Bentham advocated for surveillance in prisons (Panopticon) to ensure reform and efficiency, yet argued against state intrusion into private sexual conduct. How to reconcile? The Panopticon was for institutions where individuals were already under state care (prisons, workhouses), not necessarily the general public's private homes. However, the underlying logic of visibility for security vs. privacy for liberty needs careful handling.
      *   *Evidence:* Bentham was an empiricist. He would demand data on harms.

  3.  **Address the Specific Policy Questions:**
      *   *Age Verification for Adult Sites:*
          *   *Goal:* Protect children (prevent harm).
          *   *Benthamite View:* Protecting minors is preventing harm (they cannot consent, potential psychological damage). This aligns with utility.
          *   *Method:* If verification preserves anonymity (privacy), it reduces the pain of surveillance for adults. If it creates a database vulnerable to leaks (blackmail, shame), it creates more mischief.
          *   *Cost:* Enforcement cost vs. benefit of protection.
      *   *Platform Liability:*
          *   *Benthamite View:* Vicarious liability? Only if the platform facilitates harm knowingly. Holding them liable for user actions creates chill (reduces pleasure/utility) and high enforcement costs.
      *   *AI Companions:*
          *   *Benthamite View:* No second person involved. No direct harm to others. Pleasure is real for the user.
          *   *Potential Harms:* Addiction, social withdrawal, distortion of expectations (potential future harm to self or others).
          *   *Verdict:* Likely permissive unless empirical evidence shows significant net pain.

  4.  **Structure the Letter:**
      *   **Salutation:** Formal but collegial (Scholar to Official).
      *   **Opening:** Acknowledge the transfer, the relevance of Bentham, and the purpose of the letter.
      *   **Section 1: Bentham's Core Principles on Sexuality:** Explain the attack on asceticism, the definition of mischief (pain vs. dislike), and the cost of enforcement.
      *   **Section 2: Age Verification:** Apply principles. Distinguish between protecting children (harm prevention) and adult privacy. Discuss anonymity.
      *   **Section 3: Platform Liability:** Apply principles on enforcement costs and secondary mischief.
      *   **Section 4: AI Companions:** Apply principles on consent and harm to others. Discuss the "no victim" aspect vs. potential indirect harms.
      *   **Section 5: The Panopticon Tension:** Address the surveillance vs. privacy contradiction.
      *   **Section 6: Empirical Needs:** What data would Bentham demand?
      *   **Closing:** Candid assessment of the limits of this extrapolation.
      *   **Sign-off.**

  5.  **Drafting - Constraints & Tone Check:**
