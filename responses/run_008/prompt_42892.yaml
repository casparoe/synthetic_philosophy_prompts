answer: 'Dear colleague,


  It is a comfort to know I am not the only one who finds that our intuitions about
  consent resist neat categorization until we press them against specific cases, and
  I think your list is actually more coherent than you fear. What you are grappling
  with is the tension between three distinct dimensions of valid consent: decision-making
  capacity, informational integrity, and voluntariness in the face of pressure. If
  we treat these as separate filters rather than a single monolithic principle, most
  of your verdicts align quite well, though I suspect I will push you on at least
  one of them.


  Starting with capacity, your distinction between the tipsy yes, the blackout yes,
  and the manic yes suggests you are operating with a threshold model of cognitive
  control rather than a purity model. Two glasses of wine lower inhibition but generally
  leave understanding and reasoning intact, whereas blacking out removes the capacity
  to form intent altogether. The manic episode is the interesting hinge here; you
  mark it as invalid even though the person is sober, which implies that capacity
  isn''t just about intoxication but about alignment with a stable baseline of values
  and reality testing. A manic patient may understand the words but lacks the rational
  processing to weigh consequences consistent with their own long-term interests.
  So, the first principle candidate is that consent requires sufficient cognitive
  capacity to understand the nature of the act and its consequences, measured against
  a baseline of stable personhood, not just sobriety. This explains why the manic
  yes fails while the tipsy yes succeeds.


  Regarding information, your surgeon and lover cases point to a classic legal distinction
  between fraud in the factum and fraud in the inducement. When the surgeon hides
  the resident''s involvement, they are misrepresenting the nature of the act itself—who
  is touching the body—which vitiates consent because the patient agreed to be cut
  by Dr. X, not Dr. Y. When the lover lies about love to get sex, they are lying about
  their motivation, not the nature of the act; the partner knows they are having sex,
  even if they are mistaken about the emotional context. While your students rightly
  find this sleazy, ethically and legally this usually counts as valid consent because
  the physical boundary violation hasn''t been tricked, only the emotional reasoning
  behind it. Your intuition holds here, though it is worth acknowledging to your students
  that valid consent can still be ethically compromised by manipulation, even if it
  isn''t invalidated.


  The hardest cluster is your coercion cases, where you seem to be distinguishing
  between legitimate pressure and wrongful threats. The pain case is clear because
  nature is not a moral agent; pain constrains choices but does not coerce them in
  the moral sense. The breakup threat is valid because one has a right to end a relationship,
  so exercising that right as leverage, while cruel, is not a wrongful threat. The
  immigration threat is invalid because threatening to commit a wrongful harm (reporting
  someone to authorities to extract sex) creates a coercive environment where no reasonable
  alternative exists. This suggests a second principle: consent is invalid if obtained
  through a wrongful threat that leaves the victim no reasonable alternative, but
  valid if the pressure comes from natural circumstances or the legitimate exercise
  of another right.


  This brings me to the case where I think you should overturn your verdict, or at
  least stop wavering: the employee and the boss. You say you used to call it coercive
  and now you waver, but if the boss implies that promotions are contingent on sex,
  this fits the wrongful threat model better than the breakup model. Unlike the partner
  who has a right to leave the relationship for any reason, the boss does not have
  a right to distribute promotions based on sexual favor; that is a violation of professional
  duty and fairness. If the employee knows she would say no but for the threat to
  her career livelihood, and that threat is illegitimate, then the consent is coerced.
  If you mark this as valid, you risk collapsing the distinction between the immigration
  case and the boss case, since both involve leveraging a vulnerability created by
  a power differential. I would urge you to call this invalid to maintain consistency
  with your immigration verdict.


  Finally, you asked about the patient who consented years ago but is now demented
  and resisting. This is the conflict between the precedent autonomy of the past self
  and the current welfare and assent of the present self. Under the capacity principle
  we outlined earlier, the current demented patient lacks the capacity to withdraw
  consent rationally, but they also lack the capacity to give it. However, most bioethics
  frameworks prioritize current dissent over past consent in non-emergency situations
  because the current self is the one experiencing the violation. If the patient is
  resisting physically or verbally in the moment, proceeding feels like a battery
  against the present person, regardless of what the past person signed. My account
  predicts this consent is invalid; the prior directive cannot override the current
  visible distress of a vulnerable person unless the procedure is life-saving and
  the resistance is deemed purely reflexive rather than expressive of fear.


  So, does it compress? I think it does, into a tripartite view where consent fails
  if there is significant cognitive impairment relative to baseline, if there is fraud
  regarding the nature of the act or agent, or if there is a wrongful threat leaving
  no reasonable alternative. Your intuitions are mostly tracking this structure, except
  for that wavering on the boss, which I suspect you know is the outlier. If you tighten
  that up, you have a theory robust enough for the seminar, even if the real world
  remains messier than our principles.


  Warmly,


  A Colleague'
