  the operation under her supervision: consent invalid, the patient needs to know
  who''s cutting. Someone says I love you purely to get someone into bed: sleazy,
  but I find myself saying the consent is still valid, which my students tell me I
  can''t have both of. Signing a consent form while in wracking pain that only the
  procedure can relieve: valid, I think — the pain is pushing you but it isn''t anyone
  coercing you. An employee sleeps with her boss knowing he decides the promotions,
  and both of them know she''d say no if he didn''t: I used to call that coercive
  and now I honestly waver. Tipsy yes after two glasses of wine: valid. A yes given
  while blackout drunk: invalid. But a yes given by someone who is sober but in the
  grip of a manic episode, who at baseline would never: invalid too, and I can''t
  say why that one''s clear to me when the wine one is clear and the middle cases
  aren''t. Threat to end the relationship unless she sleeps with him: valid, I want
  to say, it''s a rotten thing to do but you''re allowed to leave for any reason.
  Same ultimatum but the threat is to reveal her immigration status: invalid. So the
  coercion cases split by what''s threatened, not by the pressure itself, is that
  right?


  Give me a principle, or two or three candidates, that captures as much of this as
  possible. Say which of my verdicts you''d overturn and why, tell me what your account
  predicts for a case I haven''t listed (I''m curious about the patient who consented
