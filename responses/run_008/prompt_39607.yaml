      *   *Correction on Misconceptions:* The prompt asks to say *exactly where* in the sequence each one should be headed off. I need to make sure the timeline explicitly marks these interventions.
      *   *Time Management:* 45 mins is tight. 5 mins intro, 5 mins Darwinian, 10 mins Skinnerian, 10 mins Popperian, 10 mins Gregorian/LLM, 5 mins Wrap/Question. That works.
      *   *Ladder Metaphor:* I need to address the "is it a ladder?" question. I'll put this in the intro or conclusion. Conclusion is better, after they've seen the complexity.

  6.  **Writing the Response:** (Mental check of British spelling: *behaviour, modelling, programme, centre, realise, defence*).

      *   *Structure:*
