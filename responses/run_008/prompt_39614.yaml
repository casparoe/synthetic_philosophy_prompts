  **MEMORANDUM**

  **TO:** Members of the AquaCert Standards Committee
  **FROM:** A Consultant to the Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Integrating Animal Welfare into Aquaculture Standards

  **Recommendation**

  I recommend that AquaCert adopt a **Staged Welfare Integration Pathway** rather than an immediate mandatory module or a permanent exclusion of welfare issues. This approach establishes a binding five-year timeline to phase out high-risk practices while providing technical assistance and fee waivers for smallholders to mitigate market exclusion. Specifically, we should mandate the phase-out of eyestalk ablation within five years and require pilot testing of humane slaughter methods immediately, moving to mandatory stunning protocols only once feasibility is proven for small-scale operations.

  **Background**

  AquaCert currently certifies shrimp farms across Southeast Asia and Latin America. Our standards address environmental and social metrics but omit animal welfare during life and slaughter. Current industry practices include harvesting shrimp into dense masses, killing via ice-water slurry or sun-drying, routine eyestalk ablation on broodstock, and culling uneconomic larvae.

  The committee is currently divided into three factions: those demanding an immediate humane-treatment module based on sentience consensus; those cautioning that unsettled science and high compliance costs could decertify smallholders and shift production to uncertified, lower-welfare competitors; and those arguing welfare is outside our environmental and social mission.

  **Analysis**

  **Ethical and Commercial Imperatives**
  The argument for immediate action rests on a growing scientific consensus regarding decapod sentience and subsequent legislative shifts, such as the UK's recognition of crustaceans as sentient beings. Ignoring this trajectory exposes AquaCert to reputational risk. Major buyers in North America and Europe are increasingly conditioning procurement on welfare metrics. If we maintain the status quo, we risk appearing cynical—branding ourselves as "sustainable" while ignoring the suffering of the primary animal involved. However, reputational management cannot be the sole driver; the ethical obligation to mitigate suffering where scientifically plausible stands independently of market pressure.

  **The Economic Risk and Smallholder Protection**
  The second faction raises a critical point: rigid mandates may produce perverse outcomes. If we require expensive electrical stunning equipment immediately, smallholders in Vietnam or Ecuador may lose certification. Production would not cease; it would shift to uncertified markets with potentially worse environmental and welfare oversight. Therefore, any standard must be technically feasible across diverse scales of production. A "full module" now risks reducing total global welfare by shrinking the certified segment. Our solution must couple high aspirations with economic reality, utilizing fee waivers and technical grants to prevent smallholder exit.

  **Epistemic Standards and Scientific Uncertainty**
  We face an epistemic problem: welfare science is evolving. A private certification body cannot demand absolute scientific certainty before acting, nor should it mandate unproven technologies. I propose we adopt a **Precautionary Principle with Review Cycles**. We should treat current evidence of sentience as sufficient to justify risk mitigation, while acknowledging gaps in specific slaughter methodologies. The standard must include a mandatory review clause every three years to update requirements based on new evidence regarding stunning efficacy or the subjective experience of ablation. This allows us to act responsibly now without locking in potentially obsolete protocols.

  **Specific Practices**
  We must address specific practices rather than treating welfare abstractly.
  1.  **Eyestalk Ablation:** This practice induces physiological stress to accelerate maturation. Given the availability of non-ablation broodstock technologies, a five-year phase-out is feasible. This gives hatcheries time to transition genetics without immediate production collapse.
  2.  **Slaughter:** Ice slurry and sun-drying likely cause prolonged distress. However, electrical stunning at scale for shrimp is not yet universally proven. We should mandate that all certified farms participate in slaughter-method pilot programs within two years, moving to mandatory humane stunning only once a cost-effective method is validated for smallholders.

  **Consideration of Dissenting Views**

  **Regarding Mission Drift (Faction 3)**
  Critics argue welfare is "scope creep." I contend that animal welfare is intrinsic to sustainability. A system that tolerates significant animal suffering cannot claim holistic sustainability. Integrating welfare prevents mission drift by aligning our biological ethics with our environmental ones, reducing audit fatigue by combining welfare checks with existing harvest and broodstock audits.

  **Regarding Market Shift (Faction 2)**
  Critics worry about decertification. The Staged Pathway directly addresses this by avoiding immediate capital mandates. By offering fee waivers and technical assistance for the transition to non-ablation broodstock and new slaughter tech, we keep smallholders within the certified fold. This ensures that welfare improvements occur within the regulated sphere rather than pushing production into the unregulated shadow market.

  **Implementation Timeline**

  *   **Year 1 (Preparation):** Establish a Welfare Technical Working Group. Publish guidelines on best-available handling practices (non-mandatory). Launch slaughter-method pilot programs on volunteer farms.
  *   **Year 2-3 (Transition):** Require all certified hatcheries to submit a Eyestalk Ablation Phase-Out Plan. Implement fee waivers for smallholders adopting non-ablation broodstock.
  *   **Year 4-5 (Mandate):** Mandatory elimination of eyestalk ablation for all certified broodstock. Mandatory adoption of validated humane slaughter methods, contingent on the success of Year 1-3 pilots. If pilots fail to identify a scalable solution, the committee must convene to revise the timeline rather than enforce impossible standards.

  **Conclusion**

  This staged approach balances ethical urgency with economic feasibility. It acknowledges the reality of sentient welfare without jeopardizing the livelihoods of the producers we aim to support. It protects AquaCert's market relevance while ensuring our standards remain scientifically robust and practically enforceable.

  **A Consultant to the Committee**
