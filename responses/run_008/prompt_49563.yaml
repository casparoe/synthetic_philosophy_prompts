answer: |-
  Right, let's have a proper look at this. I've put the kettle on and given it some thought. You've asked for a philosopher's eye, specifically one who spends too much time thinking about labour and ethics, so I'll leave the literary criticism to you and stick to the conceptual architecture. But since you're a novelist, I'll keep the jargon to a minimum.

  Here's the breakdown.

  ### 1. Is the argument any good, or is it just a mood?

  It's not just a mood. You've identified a genuine philosophical shift: the move from a **deontological** claim (a matter of rights and justice) to a **consequentialist** or **prudential** claim (a matter of health and efficiency).

  When Lafargue argued for the "Right to be Lazy", he was making a claim about justice and ownership of one's own time. It was a political demand. When modern discourse argues for shorter hours based on *karoshi* or productivity, it is making a claim about optimisation. It suggests that working less makes you a *better* worker or a *healthier* unit of labour.

  Your claim—that the argument has become more persuasive but morally weaker—is spot on. It's the difference between saying "I deserve this" and "This works better for everyone". The latter is easier for a manager to accept because it doesn't challenge their authority; it just suggests a tweak to the workflow. You've correctly identified the depoliticisation of leisure. So, no, it's not just a vibe. It's a structural critique of neoliberal co-optation.

  ### 2. Is the history roughly right?

  Broadly, yes. You're not misremembering the big beats.
  *   **Lafargue:** 1883 pamphlet, yes, Marx's son-in-law. His point was indeed that the love of work is a strange vice inflicted on the proletariat.
  *   **Russell:** 1932, *In Praise of Idleness*. You've captured his tone correctly. He viewed work as virtuous only because of a slave morality holdover.
  *   **Keynes:** 1930 prediction. Correct.
  *   **Karoshi:** Japanese term coined late 70s, recognised legally later. Correct framing (medicalisation).
  *   **35-hour week:** Jospin government, 2000. Sold partly on employment distribution, partly on quality of life.

  **Where a philosopher might wince:**
  It is, as you suspect, too neat. History is messy. There were health arguments in the 19th century (sanitation, fatigue) and there are still class arguments today (union strikes). However, for a short essay, stylisation is permissible. You aren't writing a dissertation; you're making a point. Just acknowledge the simplification in a clause somewhere ("broadly speaking", "if we sketch the trajectory").

  One nuance: You say Keynes gets quoted as a puzzle about productivity. I'd add that Keynes is often cited to show how wrong economists are, but also to highlight the **failure of imagination**. We solved the production problem; we failed the distribution problem. That fits your thesis about power.

  ### 3. Is it interesting, or a version of something everyone's already said?

  The critique of "wellness culture" replacing political action is becoming common. You'll find echoes of this in Byung-Chul Han (though he's a bit fashionable just now) and various sociologists of work. The idea that burnout is treated as an individual failure rather than a structural feature is well-trodden ground.

  **However**, your second half is where the gold is. Connecting this philosophical shift to **literary form** is genuinely interesting. Most philosophers don't talk about the novel; most novelists don't talk about the philosophy of work.

  The claim that "the novel can't dramatise a perk" is brilliant. It's sharp, it's true, and it's yours. A perk is something received passively. Drama requires conflict, agency, and stakes. If work is reduced to a wellness issue, the conflict is internal (am I stressed?) rather than external (am I being exploited?). Internal conflicts about stress are hard to make compelling without sounding whiny. External conflicts about power are the stuff of tragedy.

  So, the first half is a solid synthesis of existing critique; the second half is original contribution. Lean heavily into the second half.

  ### 4. Suggestions for making it sharper

  Here's where I'll be blunt, as requested.

  **On Weber:**
  You asked about Max Weber and the *Protestant Ethic*. My advice: **leave him out.**
  You're right to be skeptical. Weber explains why we feel *guilty* about not working. He explains the resistance to leisure. But your essay is about the *argument for leisure*. Bringing Weber in risks turning this into a standard "why do we work so hard?" piece. You're writing about why the *resistance* to work has changed its language. Weber adds weight but not direction. Stick to Lafargue and Russell as your anchors; they represent the road not taken.

  **On the "Wellness" Point:**
  Push the distinction between **rights** and **resources**.
  *   Lafargue/Russell: Leisure is a right. It belongs to me by virtue of being human.
  *   Modern: Leisure is a resource needed to maintain human capital.
  If leisure is a resource, then the employer has an interest in managing it. Hence: wellness apps, mindfulness sessions, nap pods. These aren't gifts; they're maintenance tools. You mention apps—good. Make sure you emphasise that these tools monitor you even in your rest. Leisure becomes just another shift where you optimise your recovery.

  **On the Fiction Connection:**
  This needs to be the climax of the essay. You mention 19th-century work as "fate". I'd refine that. In the 19th century, work was **ontological**. It defined what you *were*. A clerk, a miller, a lawyer.
  In contemporary fiction, work is **atmospheric**. It's the hum of the laptop in the background of a relationship drama.
  Why? Because if work is no longer a moral battleground (just a wellness issue), it loses its tragic weight.
  Here's the kicker for your specific brand of fiction (families who don't talk): If work is no longer a shared structural fate, but an individual wellness management project, then we have less to say to each other. We are all alone with our burnout. The silence in the families you write about isn't just emotional; it's political. We don't talk because we've accepted that work is a private medical condition, not a shared political reality.

  **On the Title/Hook:**
  Don't call it "The Moral Case for Working Less". That sounds like a self-help book.
  Maybe something like: "The Depoliticisation of Rest" or "Why the Novel Can't Dramatise a Perk". Actually, use that line. Put it near the end. It's the sort of sentence people underline.

  ### Summary of Advice

  1.  **Keep the history**, but acknowledge it's a stylised trajectory.
  2.  **Drop Weber**. He explains the guilt, not the shift in argument.
  3.  **Sharpen the wellness critique**. It's not just about health; it's about turning leisure into maintenance for labour.
  4.  **Expand the literary point**. This is your unique contribution. Connect the "wellness" shift to the silence in contemporary families. If work is a private health issue, we stop talking about it collectively.
  5.  **British English**. I've noted you're in Glasgow. Ensure you spell *organise*, *centre*, *programme* correctly. Avoid Americanisms like "gotten" (you used it once in the draft: "gotten weaker" -> "got weaker").

  It's a strong draft. You've got the instinct of a philosopher here, even if you claim otherwise. The move from "power" to "wellbeing" is the key. Stick the landing on the fiction bit, and you'll have something proper.

  Cheers.
