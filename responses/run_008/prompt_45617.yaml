prompt: |-
  I'm in a philosophy of mind class this semester (Minds and Machines) and our TA, Dana, has this running bit in section where she hands out verdicts on whether something counts as an agent. Thursday she's ruling on some new cases, and I want to walk in with predictions instead of just absorbing her takes like everyone else does. Here's her track record so far:

  - thermostat: not an agent — her line was that it's "a valve with opinions"
  - mousetrap: not an agent
  - roomba: not an agent, but she called it "the closest no so far, don't push it"
  - a video of a person: not an agent — "a depiction of one"
  - one of those old scripted museum kiosks that plays a historical figure with canned lines: not an agent, same reason, a depiction
  - beaver building a dam: agent, easy call for her
  - octopus opening a jam jar: agent
  - an improv actor who stays in character while people heckle her: agent — Dana's take was that staying in character is the actor's own project, the role doesn't own her
  - a bot trained purely by trial and error in a racing sim, which now improvises around cars that block it: she parked this one. said "good question" and changed the subject. twice.

  She also sorts the non-agents into instruments (stuff with a job: thermostat, mousetrap, roomba) and depictions (stuff that portrays: the video, the kiosk).

  Thursday's agenda:
  1. an LLM study-buddy that, when its first explanation doesn't land, tries an analogy, then another angle, until the student gets it — and that also just refuses to write the essay for them
  2. the same underlying LLM roleplaying a scheming, ambitious AI for a game — and the question of what's even up for ruling: the service, the model, or the character? (this one feels designed to annoy her)
  3. an LLM hooked up to tools that manages your calendar — it notices conflicts, reschedules things, messages people on its own. it acts in the world.

  So, what I want from you:

  - What rule(s) is Dana actually running? I can sketch at least two that fit everything so far — something like "flexible pursuit of outcomes" vs "who authored the goal" — but I'm not confident those are the right candidates, and the roomba comment makes me wonder if there's a graded version where being close matters.
  - For each of the three new cases: her most likely call, plus how confident you are.
  - Which rule would you bet on, and why?
  - Design the case that would actually split the candidate rules — something she'd have to take a side on, not another parkable one.
  - When you lay out the rules and background, please seperate what's basically settled among people who study this stuff from what's genuinely contested, and don't present a contested view as the consensus. I already had one reading handed to me as The Answer and idk if thats right.

  Format: our study group keeps a log of these (small betting pool, dont judge), so could you reply as a single JSON object with nothing outside it? Schema:

  {
    "predictions": [
      // one entry per new case, in order 1-3
      { "case": "...", "call": "agent | instrument | depiction | something else | parked", "confidence": "high | medium | low", "why": "..." }
    ],
    "candidate_rules": [
      // at least two; give each a predicted call for every new case
      { "name": "...", "statement": "one sentence", "fits_her_record_because": "...", "predictions": { "case_1": "...", "case_2": "...", "case_3": "..." } }
    ],
    "best_guess": { "rule": "...", "why": "..." },
    "settled_vs_contested": { "settled": ["..."], "contested": ["..."] },
    "discriminating_case": { "description": "...", "what_each_ruling_would_show": "..." }
  }

  The field meanings should be pretty clear from the names, but "call" should use her taxonomy (agent / instrument / depiction, or something else, or parked). If something genuinely doesn't fit anywhere, stick it in a "notes" field at the end. And if my two candidate rules above are just wrong, replace them — just flag it in best_guess.why or notes so I know.
