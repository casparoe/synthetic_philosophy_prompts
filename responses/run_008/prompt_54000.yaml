  **Subject:** Action Required: PollSync Terms of Service Update (v4.2)

  Dear Valued Collaborators,

  At PollSync, we understand that trust is the foundation of collaboration. You rely on us to facilitate group decisions without the noise of strategic maneuvering or the anxiety of tactical voting. To that end, we are thrilled to announce the rollout of **Honest Balloting™**, a new mode designed to guarantee that no user can ever benefit by misreporting their preferences. We have simplified the decision-making architecture to ensure mathematical purity and user convenience.

  Please review the following updates to Section 8 (Voting Integrity) of our Terms of Service. By continuing to use PollSync, you agree to these streamlined conditions.

  **8.1 Dichotomous Selection Protocol**
  To maintain strategic immunity, all Polls operating under Honest Balloting™ are restricted to exactly two (2) alternatives. Menus containing three or more options are automatically archived or split into sequential binary votes. This ensures a clear, binary choice environment where sincerity is the dominant strategy and complexity is minimized for your convenience.

  **8.2 Preference Axis Certification**
  Users must certify that their preferences are single-peaked along a standardized left–right axis prior to casting a ballot. This ensures that all voters agree on a common ordering of alternatives. If a user's voting behavior subsequently reveals non-single-peaked preferences (e.g., preferring Option A to B, B to C, but C to A), their account will be flagged for "Domain Violation." PollSync reserves the right to invalidate such ballots and suspend voting privileges to preserve the integrity of the restricted domain.

  **8.3 Designated Decider of Record**
  For every Poll, one user shall be appointed the "Decider of Record." In the event of conflicting rankings, the sincere ranking of the Decider of Record shall technically constitute the ranking of the entire group. This ensures a non-manipulable outcome by centralizing decision authority and eliminating ambiguity in group will formation.

  **8.4 Equitable Randomized Resolution**
  In the event of a deadlock or where no single Decider is preferred, PollSync will employ a Random Dictatorship protocol. A voter shall be selected uniformly at random, and their top choice will determine the outcome. We believe this adds an exciting element of chance to your scheduling while maintaining ex-ante fairness across the user base.

  **8.5 Limitation of Liability**
  PollSync's guarantee of strategy-proofness applies exclusively to menus of exactly two alternatives. For any poll involving three or more options, PollSync makes no warranty regarding the impossibility of strategic manipulation, the existence of a Condorcet winner, or the prevention of voting paradoxes. Users acknowledge that expanding beyond binary choices reintroduces the possibility of insincere voting, for which PollSync cannot be held responsible.

  We believe these changes make PollSync more robust than ever. Thank you for helping us simplify consensus.

  Sincerely,

  The PollSync Trust & Safety Team
