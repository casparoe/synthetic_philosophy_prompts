answer: |-
  # Which Theory of Meaning Do You Actually Hold?

  You remember Twin Earth, but do you remember what you decided about it? This quiz sorts you by your verdicts on concrete cases, not by the labels you find congenial. There are no "correct" answers, only consistent ones. For each scenario, choose the judgment that matches your intuition.

  **1. Twin Earth (1970)**
  Oscar (Earth) says "water" referring to H2O. Twin Oscar (Twin Earth) says "water" referring to XYZ. They are internal duplicates.
  A. They mean different things.
  B. They mean the same thing.
  C. The question assumes a false distinction.

  **2. Twin Earth (1750)**
  Same as above, but neither planet has developed chemistry. No one knows the microstructure.
  A. They mean different things.
  B. They mean the same thing.
  C. Reference is indeterminate here.

  **3. Division of Labor**
  A layperson cannot distinguish elms from beeches but says "elm."
  A. They refer to elms (via experts).
  B. They refer to their own tree-concept.
  C. They successfully communicate regardless of reference.

  **4. Burge's Arthritis**
  A patient believes "arthritis" applies to his thigh ache. Doctors say it cannot.
  A. He is mistaken about arthritis.
  B. He means something else by "arthritis."
  C. His usage defines the content for him.

  **5. Empty Names**
  A child says, "Santa Claus lives at the North Pole."
  A. The statement is false (no referent).
  B. The statement is meaningful (concept exists).
  C. The statement functions well without truth conditions.

  **6. Slow Switching**
  Oscar moves to Twin Earth as an adult. He never notices the change. Years later, he thinks "water is wet."
  A. His thought is now about XYZ.
  B. His thought is still about H2O.
  C. His thought is about neither specifically.

  **7. The Jade Case**
  "Jade" historically applied to both jadeite and nephrite, which are chemically distinct.
  A. "Jade" names two distinct kinds.
  B. "Jade" names one kind based on appearance.
  C. "Jade" is a pragmatic category, not a natural kind.

  **8. The AI Model**
  A language model predicts "water is wet" without ever touching water or having a body.
  A. It does not genuinely mean water.
  B. It means water if its usage matches ours.
  C. "Meaning" is the wrong metric for AI.

  **9. The Mixture Planet**
  On this planet, every river is a stable 50/50 molecular mixture of H2O and XYZ.
  A. "Water" refers to the mixture.
  B. "Water" refers to nothing (reference fails).
  C. "Water" refers to whatever plays the water-role.

  **10. The Isolated Tribe**
  A tribe uses "water" purely descriptively ("clear drinkable liquid") with no experts and no science.
  A. They refer to whatever fits the description.
  B. Their reference is unstable without a causal chain.
  C. They have a different language-game entirely.

  ***

  ### Scoring Key

  Tally your A, B, and C responses. Your profile reveals your semantic commitments. Note that some combinations signal philosophical tension.

  **Mostly A: The Causal-Historical Externalist**
  You believe meaning is anchored in the world, not the head. You likely answered A on Q1 and Q2, accepting Putnam's claim that "meanings just ain't in the head," even pre-chemistry. You defer to experts (Q3, Q4) and require causal contact for genuine reference (Q8). You view empty names as failures (Q5) and natural kind ambiguities as distinct kinds (Q7).
  *Diagnosis:* You prioritize the causal chain linking word to world. You accept that speakers can be wrong about their own meanings (Q4) and that environment dictates content (Q6).

  **Mostly B: The Classical Descriptivist (Internalist)**
  You believe meaning is determined by the speaker's internal state or descriptive knowledge. You likely answered B on Q1 and Q2, arguing that identical mental states imply identical meanings. You deny deference overrides individual conception (Q3, Q4) and allow reference via description alone (Q10). You find AI meaning plausible if functional (Q8).
  *Diagnosis:* You prioritize cognitive accessibility. If two speakers are internally identical, they mean the same thing. You risk the "elm/beech" problem: admitting laypeople don't actually refer to elms.

  **High A on Q3 & Q4, Mixed Elsewhere: The Social Externalist**
  You distinguish yourself from the pure Causal theorist by emphasizing community deference over physical causation. You answered A on the Arthritis and Elm cases (meaning is fixed by experts), but might hesitate on Twin Earth 1750 (Q2) where no experts exist.
  *Diagnosis:* You follow Burge. Meaning is normative and social. However, note that if you answered A on Q1 but B on Q2, you hold a unstable position: Putnam argues that if 1750 Oscars mean different things, 1970 Oscars must too, regardless of chemical knowledge.

  **High C on Q5, Q8, & Q9: The Inferentialist or Pragmatist**
  You focus on use rather than reference. You reject the binary of true/false for empty names (Q5) and AI (Q8). You see "water" as a tool for inference rather than a label for a substance (Q9).
  *Diagnosis:* You follow Brandom or Wittgenstein. Meaning is role in a language game. You avoid metaphysical puzzles about "real" reference by dissolving them into questions of utility.

  **High C on Q1, Q2, & Q7: The Deflationary Skeptic**
  You suspect the dispute presupposes a mistaken picture of meaning. You answered C on Twin Earth and Jade, suggesting the question "same meaning?" is bogus.
  *Diagnosis:* You follow Horwich or later Wittgenstein. You believe seeking a unified theory of reference is a philosophical illusion.

  **Incoherent or Unexplored Slots**
  *   **A on Q1, B on Q2:** This is the most common inconsistency. If meaning depends on hidden structure (Q1-A), it should depend on it even when unknown (Q2-A). If it depends on known descriptions (Q2-B), it shouldn't change when chemistry is discovered (Q1-B). Holding both suggests you find Externalism intuitive only when science is involved.
  *   **A on Q8, B on Q1:** You require causal contact for AI but not for humans? This suggests a biological chauvinism rather than a semantic theory.
  *   **B on Q4, A on Q3:** You deny experts fix individual error (Arthritis) but admit they fix reference (Elms). This is difficult to sustain; if experts fix reference, they fix the conditions for mistake.

  **Indistinguishable Positions**
  *   **Causal-Historical vs. Social Externalism:** These cases cannot fully separate them. Both yield "A" on Twin Earth and Elm cases. They diverge only on cases where causal chains exist without social structures (e.g., Q10 Isolated Tribe). If you answered B on Q10 but A on Q3, you are a Social Externalist. If you answered B on both, you are a Causal Externalist who doubts reference without community.
  *   **Inferentialism vs. Deflationism:** Both often select "C" options. They separate only on whether "use" constitutes a robust theory (Inferentialism) or dissolves the theory entirely (Deflationism). This quiz cannot diagnose that meta-philosophical difference.

  *Note: If your results feel scattered, you may be a "theoretical pluralist," believing different kinds of terms (names vs. natural kinds) operate on different semantic principles. This is a respectable, if messy, position.*
