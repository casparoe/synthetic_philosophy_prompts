          *   Benatar: Walking away doesn't stop the suffering. *However*, maybe they are refusing to *participate* in the system that requires the child. Or maybe they represent the realization that "Omelas" (society/life) is a trap.
          *   *Honesty Check:* Benatar would say staying *and* walking are both moot if you keep breeding. The real "walk" is out of existence (non-procreation). This is where the analogy strains.
      *   *Section 4: Where it Breaks Down.* Crucial for the "honest" requirement.
          *   Le Guin's intent was social/political, not metaphysical.
          *   Benatar is about *birth*, Omelas is about *maintenance* of society.
          *   The child is specific, not general.
