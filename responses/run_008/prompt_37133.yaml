answer: |-
  Here is the spec sheet for a genuine crane.

  To distinguish a crane from a skyhook (miracle) and from greedy reductionism (skipping the lift), an explanation must satisfy four desiderata. I have divided these into **Non-Negotiables** (violating these disqualifies the explanation as scientific) and **Camp Preferences** (where legitimate disagreement exists on *which* crane is doing the lifting).

  ### The Desiderata

  #### 1. The Competence Budget (Non-Negotiable)
  **The Rule:** No step in the explanatory chain can possess more information, agency, or design-competence than the previous step generated. You cannot spend intelligence you haven't earned.
  **The Case:** This is the core anti-skyhook constraint. If you explain the eye by invoking a Designer, you have imported a mind (high competence) to explain the eye (lower competence). You haven't explained design; you've moved it back a step. A crane must be built of parts that are "dumber" than the whole they create.
  **The Conflict:** This creates friction with **Greedy Reductionism**. If you claim "it's all just physics," you risk implying the Big Bang contained the "information" for Shakespeare. That violates the budget by hiding the competence in the initial conditions rather than generating it through the process.

  #### 2. The Continuity Constraint (Non-Negotiable)
  **The Rule:** You cannot leap across ontological categories without bridging mechanisms. You must show the intermediate platforms that stabilize the lift.
  **The Case:** This is the core anti-greedy-reductionism constraint. Explaining "love" directly via "quantum fields" is greedy; it skips the neurology, psychology, and sociology that actually do the work. Conversely, explaining "life" via "vital force" is a skyhook; it skips the chemistry. A crane requires intermediate levels of organization that have their own causal powers, built by the level below and building the level above.
  **The Conflict:** This conflicts with ** parsimony**. Demanding intermediates makes explanations heavier and more complex. There is a tension between wanting a "deep" explanation (physics) and a "saturated" explanation (showing all the gears). You cannot maximize both.

  #### 3. The Generative Burden (Non-Negotiable)
  **The Rule:** The explanation must be constructive, not just consistent. It must be possible, in principle, to run the process and get the result, not merely show that the result doesn't violate the rules.
  **The Case:** Many evolutionary psychology stories are *consistent* with human behavior but cannot *generate* it. They are post-hoc rationalizations. A crane is a machine; if you turn the crank, the load must rise. If the explanation only works in retrospect, it's a story, not a mechanism.
  **The Conflict:** This is computationally expensive. For complex systems (culture, minds), we often cannot actually simulate the full lift. We have to rely on plausibility arguments. Strict adherence to this requirement might paralyze research in high-level domains where full simulation is impossible.

  #### 4. The Thermodynamic Ledger (Non-Negotiable)
  **The Rule:** The process must account for energy, time, and entropy within the actual bounds of the universe.
  **The Case:** A mechanism that requires more time than the age of the universe to lift the load is a skyhook in disguise. A mechanism that requires negative entropy without a source is magic.
  **The Conflict:** None. This is a hard physical constraint.

  ---

  ### Camp Preferences (Where the fights are legitimate)

  *   **The Selectionist Preference:** Adaptationists argue the primary crane is *variation and selection*. They prioritize the **Competence Budget**, insisting that order comes from weeding out the unfit, not from internal laws.
  *   **The Self-Organization Preference:** Complexity theorists argue the primary crane is *structural constraint*. They prioritize the **Continuity Constraint**, insisting that physical laws naturally funnel matter into complex shapes without needing selection for every detail.
  *   **The Cultural/Memetic Preference:** Memetics argues the crane is *replication with mutation* in a symbolic medium. They prioritize the **Generative Burden**, demanding transmission chains be traced.

  *Note: These are not contradictions of the crane concept, but bets on which machinery is doing the heavy lifting. A valid crane theory can be adaptationist, self-organizing, or a hybrid, provided it meets the Non-Negotiables.*

  ---

  ### The Stress Test

  Here is how four approaches score against the Non-Negotiables.

  **1. Intelligent Design (The Control Group)**
  *   **Verdict:** **Skyhook.**
  *   **Failure:** Violates **Competence Budget**. It explains complex biology by invoking a Complex Designer. It imports the very thing (design) it claims to explain. It fails the **Generative Burden** because it offers no mechanism for the Designer's operation, only an assertion of outcome.

  **2. Straight Adaptationism (Pan-Selectionism)**
  *   **Verdict:** **Leaning Greedy.**
  *   **Failure:** Often violates **Continuity Constraint**. By assuming every trait is directly optimized by genes for a specific function, it often skips the developmental, physiological, and physical constraints that mediate between gene and trait. It treats the organism as a direct readout of fitness, ignoring the machinery in between.

  **3. Memetics (Classic Dawkins/Dennett)**
  *   **Verdict:** **Mixed Crane.**
  *   **Failure:** Struggles with **Generative Burden**. While it respects the **Competence Budget** (memes are mindless viruses), it often fails to specify the *mechanism* of replication in the brain. "Memes" can become a metaphor for "ideas I don't like" if the actual transmission and mutation physics aren't specified. It risks becoming a skyhook if "meme" is just a label for the outcome rather than the replicator.

  **4. Self-Organization / Complexity Theory**
  *   **Verdict:** **Strong Crane (with caveats).**
  *   **Failure:** Risks **Competence Budget** violations if "emergence" is treated mystically. If a system "spontaneously" organizes without a clear algorithmic account of how local interactions sum to global order, it invokes a "law of complexity" that acts like a skyhook. However, when it specifies the local rules (e.g., cellular automata), it is the gold standard for **Continuity**.

  ---

  ### The Editor's Line: The Single Kill Shot

  If you need one requirement to rule them all, it is **The Generative Burden (Constructivity)**.

  Here is why:
  Skyhooks fail because they assert the outcome without the process. Greedy reductionists fail because they assert the process is trivial (it's just physics!) without showing the work. Both are essentially claiming the result is *inevitable* without showing the *machinery of inevitability*.

  If you demand that an explanation must be able to **grind out the phenomenon**—that you could, in principle, write the code or build the model and watch the complexity appear—you eliminate the magic (skyhooks) and you eliminate the hand-waving (greedy reductionism).

  *   **ID** cannot run the simulation of creation.
  *   **Greedy Reductionists** cannot run the simulation from quarks to qualia (the compute is impossible, proving the intermediate layers are necessary).
  *   **True Cranes** offer the algorithm.

  The "vibe" of a crane is that it is boring. It is plodding. It is a grind. If the explanation feels too elegant, too direct, or too inevitable without showing the gears, it's a con. **Demand the grind.**
