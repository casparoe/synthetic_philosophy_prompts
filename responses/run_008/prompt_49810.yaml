  I am the stone where first the scarf was known,
  When Council ruled the conscience remained free,
  In tune with laws the State had earlier sown,
  If not ostentatious for all to see.
  I thought to make the stranger call it own,
  The distinct cloth, and let the spirit be
  Within my walls, no longer quite alone,
  And let the girl remain in liberty.

  Then silence broke: who bends to whom, the wall
  Or those who enter? Law became a sword.
  I ceased to be a home, became a hall
  Where signs are banned to keep the peace restored.
  I gained one law applied to every face,
  But lost the art to meet them in their place.
