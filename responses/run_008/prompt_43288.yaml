answer: |-
  It is completely understandable that you feel uneasy about this situation, and that discomfort is actually a good sign. It suggests your moral compass is working correctly even when your brother's logic is trying to convince you otherwise. Your brother's rule that anything true is automatically honest is a common defense mechanism, but it conflates factual accuracy with communicative integrity. While every sentence you plan to write might be factually correct, the overall message you are conveying is intentionally misleading. In ethics, intent matters just as much as the literal content of your words. If you know that omitting a crucial piece of information will lead someone to a false conclusion, and you omit it specifically to create that false conclusion, you are engaging in deception. The mechanism is different from a direct lie, but the moral weight is nearly identical because the outcome is the same: the recruiter will believe Dana is fit for a leadership role when you have evidence suggesting she is not.

  The context of a reference letter changes the rules of engagement significantly. A reference is not just a collection of random facts; it is a specific genre of communication with an implicit contract. When you agree to be a reference for a leadership role, the reader assumes you are addressing the competencies required for that role. By writing a glowing testimonial about her technical skills without mentioning her management failures, you are exploiting the reader's expectation that a reference is holistic. You are correct that you would be engineering a false belief. Shifting the responsibility to the reader for making that inference is a cop-out because you know exactly how the genre works. You are relying on their assumption of completeness to hide the negative data. This is often called lying by omission, and while it might offer you plausible deniability if things go wrong, it does not absolve you of the responsibility for the deception.

  Your interaction with the recruiter highlights this tension perfectly. When you said you could only speak to her technical work, you felt guilty because you knew you were setting a boundary around your knowledge that didn't actually exist. You do have knowledge of her management style; you just chose not to share it. That response was a polite way of withholding information, and while it was less committed than a written letter, it left you with the same feeling of complicity. The difference between what you are doing and outright lying is technical, not moral. In both cases, you know the recruiter will walk away with a false belief, and in both cases, you are arranging for that belief to take hold. The only real difference is that one method risks your reputation for honesty if discovered, while the other risks the well-being of Dana's future team.

  This brings us to the promise you made to Dana. Promises are important, but they are not absolute contracts that override all other ethical duties. When you promised to be a reference, you likely intended to support her career, but you probably did not intend to facilitate her placement in a role where she might fail and harm others. If you help her get this job and she struggles again, more people will quit, the company will suffer, and Dana herself will be set up for another public failure. There is a strong argument that being a true friend means protecting her from taking a job she is not ready for, rather than helping her secure it under false pretenses. Keeping your promise in the spirit of helping her succeed might actually require you to be honest about her limitations, or at least refuse to endorse her for this specific type of role.

  So, what should you actually do? You need to have a candid conversation with Dana before you submit anything or speak further with the recruiter. You can tell her that you are happy to vouch for her technical expertise, which is genuine, but that you cannot in good conscience recommend her for a leadership position given what you witnessed regarding team retention. This honors your promise to be a reference while maintaining your integrity. It gives her the chance to withdraw her application or address those gaps before moving forward. If she insists you write the letter anyway, you have to decide if you are willing to be complicit in potential harm to her future employees. My advice is to tell her you can only provide a technical reference, not a managerial one, and let her decide if that serves her needs. This way, you keep your word without sacrificing your honesty, and you avoid the trap of building a false belief out of true parts.
