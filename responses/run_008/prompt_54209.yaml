  8.  **Writing the Draft (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is roughly 650-750 words at a moderate pace.
      *   *Tone Check:* Is it too academic? Keep it simple. "I'm a machinist, not a writer."
      *   *Sensitivity:* Ensure the kids don't feel like their dad is a science experiment. Ensure the cryo group doesn't feel like they are deluded.

      *(Self-Correction during drafting)*: I need to make sure I don't say "He is sleeping" because that validates cryo over medical. I should say "He is not here." I need to make sure I don't say "He is gone forever" because that invalidates cryo.
