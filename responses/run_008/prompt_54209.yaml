answer: |-
  ### Thinking Through the Overlap

  Before writing the speech, I need to map out the terrain. We have two groups with incompatible metaphysical maps, but they share the same emotional territory.

  **1. The Medical/Traditional View (The Family)**
  *   **Truths:** Walt's heart stopped. His brain chemistry halted. He will not walk through the door tonight. Grief is the rational response to loss.
  *   **Risk:** Saying "he is gone forever" insults the cryonicists. Saying "he is just sleeping" insults the family's reality of death.

  **2. The Cryonic View (The Friends)**
  *   **Truths:** Walt's connectome (brain structure) is preserved. The process is not theoretically impossible. Hope is a rational response to uncertainty.
  *   **Risk:** Speaking as if he will definitely return makes the family feel like their grief is being denied.

  **3. The Overlap (The Ground for the Eulogy)**
  *   **Physical Absence:** Everyone agrees Walt is not in this room. Everyone agrees the Walt we knew—the voice, the laugh, the handshake—is paused or ended.
  *   **Character:** Everyone agrees Walt was curious, humble, and thoughtful.
  *   **Uncertainty:** Everyone agrees the future is unknown. The family doesn't know how they'll cope; the cryonicists don't know if the technology will work.
  *   **Impact:** Everyone agrees Walt changed the people in this room. That change persists regardless of his biological state.
  *   **The "Lottery Ticket":** Walt's own humility bridges the gap. He didn't claim immortality; he claimed a *chance*. This allows the family to view it as a long shot (compatible with death) and friends to view it as a ticket (compatible with hope).

  **Strategy for the Speech:**
  *   **Voice:** First-person, humble, tactile (machinist metaphors), avoiding academic philosophy.
  *   **The Analogy:** The Wood Frog. It freezes solid, heart stops, thaws in spring. It's biological, not mechanical, fitting his repairman background.
  *   **The Pivot:** Focus on *our* state, not *his*. We are the ones changed. We are the ones remembering.
  *   **The Closing:** A statement of fact that requires no definition of life. "He was here."

  ***

  ### Eulogy for Walt

  Good afternoon. For those who don't know me, I'm [Name]. I spent forty years in a machine shop, and Walt spent forty years fixing refrigerators. We were both men who liked to know how things worked, though I think Walt was more interested in *why* they worked than I ever was.

  I'm not a writer. I'm not used to standing up and talking to a crowd. But Walt asked me to do this a while back, and when a friend asks you to do a job, you do it the best you can.

  I know looking around this room, it feels like we're gathered for two different reasons. Some of you are here to say goodbye to a father and a husband who has died. Some of you are here to honor a friend who has entered a long wait. I'm not going to try to tell either of you that you're wrong.

  Walt was a repairman. He knew that sometimes a thing stops running, and it's broken. And sometimes, it's just switched off. He spent a lot of time thinking about the difference. He used to tell me about the wood frog. Maybe some of you know it. It lives up north. When winter comes, the frog buries itself in the leaves. It freezes solid. Its heart stops. By every test we have, it is dead. But when the sun comes back in the spring, the ice melts, the heart starts, and the frog hops away.

  Walt didn't say he was a frog. He didn't say he was sure he'd wake up. He was too honest for that. He told me once, "I'm buying a lottery ticket, not a ticket home." He knew the odds. But he also knew that a zero percent chance is a guarantee of failure, and he never liked guarantees.

  To his children: I know you feel the loss of your dad. I feel it too. I know I won't hear his voice on the phone again. I know his chair at the diner is empty. That pain is real, and it doesn't matter what you believe about the future; the emptiness we feel right now is the same. Grief is the price we pay for loving someone, and Walt was worth every bit of that price.

  To his friends from the foundation: I know you see a different horizon. You see a possibility. Walt liked that about you. He liked that you were willing to look at the gray areas where most people just see black and white.

  But here is what I know, standing here as a machinist who knows metal and knows men. It doesn't matter what label we put on Walt's state right now. It doesn't matter if we call it death or suspension. What matters is what he left behind in us.

  A machine is defined by what it does. A life is defined by what it leaves. Walt left curiosity in his kids. He left kindness in his neighbors. He left a question in all of us about how much we really know. That part of him isn't in Arizona. It isn't in the liquid nitrogen. It's in this room. It's in the way his daughter smiles when she tells a story about him. It's in the way his friends keep asking the hard questions.

  Walt spent his life fixing things that keep the cold out. In the end, he chose to let the cold in, hoping it might keep him for later. I don't know if the science will hold. I don't know if the spring will come for him.

  But I know this, and I think Walt would agree with it no matter how he defined the word "alive":

  We are here. We remember him. And for as long as we are doing that, he is not finished with us yet.

  Thank you.
