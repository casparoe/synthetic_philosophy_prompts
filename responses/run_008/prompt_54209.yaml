prompt: |-
  I'm a retired machinist, and I've been asked to give the eulogy for my closest friend, Walt, who was declared dead last Tuesday at sixty-eight and — this is the part that makes it complicated — is currently stored in liquid nitrogen at a cryonics facility in Arizona, where he'd been signed up for thirty years. Walt wasn't a kook about it and he wasn't rich; he was a refrigerator repairman who liked to think hard about what it means for a thing to be alive, and his favorite argument was the spore analogy: a bacterial spore just sits there for decades with no metabolism and no response to anything, and nobody calls it dead — so why is a brain whose fine structure has been carefully preserved dead just because the heartbeat stopped? He used to say that the question of whether something is alive has no answer until you pick a definition of life, and he had picked his. His son and daughter think the whole thing is a sad fantasy and are grieving a father; the local cryonics group, maybe fifteen people, will be at the memorial and they genuinely use the word patient rather than deceased; and I'll be standing up in front of both. For what it's worth, I never finished high school and I've never given a eulogy, so I want you to take this on as a serious writing job.

  I'd like you to act as an accomplished eulogist with a philosopher's feel for definitional questions. Before you draft anything, please think through what can honestly be said to both halves of the room: which sentences about Walt are true under his definition of life, which are true under the ordinary medical one, and — this is the ground I want the speech built on — which are true under both. My instinct is that the words that fall in that overlap are the ones that can carry grief and hope at the same time, but I can't find them on my own. I also don't want a lecture on definitions; the philosophy should do its work underneath the surface, in what the speech declines to claim, not in anything that sounds like an argument. And I'd rather the speech not come down on whether the preservation will ever work — nobody in that room knows, and Walt himself always said he was buying a lottery ticket, not a ticket home.

  Please write me something around five minutes when spoken, plain-spoken, warm, and a little funny, that lets his daughter cry for a father without the cryonics people feeling the eulogy quietly ruled against them, and lets his friends keep their hope without the family feeling insulted. If you can work in one analogy Walt would have appreciated — he loved frozen frogs, dormant seeds, viruses, anything that sat in the gray zone — all the better. End it on something that, under any definition of life you pick, he would have agreed was true.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Retired machinist, close friend of the deceased, didn't finish high school, never given a eulogy before. Voice should be plain-spoken, warm, a little funny, not academic.
      *   **Deceased:** Walt, 68, refrigerator repairman, interested in philosophy of life/death, signed up for cryonics (stored in liquid nitrogen in Arizona).
      *   **Audience:** Divided. Family (son/daughter) grieving a dead father, view cryonics as sad fantasy. Cryonics group (approx. 15 people), view Walt as a "patient" in suspension, hopeful.
      *   **Constraints:**
          *   Do not lecture on definitions.
          *   Do not claim cryonics will or won't work (Walt called it a lottery ticket).
          *   Find the "overlap" truth: statements true under *both* medical and cryonic definitions of life/death.
          *   Include an analogy Walt would like (frozen frogs, seeds, viruses, etc.).
          *   Length: Around 5 minutes spoken (approx. 600-750 words).
          *   Ending: Something true under *any* definition of life.
      *   **Role:** Accomplished eulogist with a philosopher's feel, drafting for the machinist to speak.

  2.  **Deconstruct the "Overlap" Truths:**
      *   *Medical Definition:* Walt is dead. His heart stopped. He is gone from our daily lives. We miss him.
      *   *Cryonic Definition:* Walt is a patient. He is preserved. He might come back. He is not "gone" in the ultimate sense.
      *   *The Overlap:*
          *   Walt mattered.
          *   Walt is not here *right now* (physically present in the room).
          *   Walt's ideas live on in us.
          *   Walt was a man who thought deeply and cared about the future.
          *   We are all united by our love/respect for him.
          *   The uncertainty of the future is something we all share.
          *   Memory is a form of persistence.

  3.  **Determine the Tone and Voice:**
      *   The speaker is a machinist. The language should be grounded, tactile, honest. No flowery prose. Short sentences.
      *   Avoid jargon like "neuropreservation," "metabolism," or "ontological status."
      *   Acknowledge the tension without trying to resolve it. Validate both grief and hope.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the situation. Establish the speaker's relationship (machinist friend).
      *   **The Middle (Walt's Character):** Talk about his job (fridge repair) and his mind. Connect the two. He fixed things that keep things cold. He thought about cold.
      *   **The Elephant in the Room (Cryonics vs. Death):** Address the split without taking sides. Use the "overlap" strategy. Acknowledge the family's loss and the friends' hope without validating one over the other.
      *   **The Analogy:** The prompt suggests frozen frogs, seeds, etc. The wood frog is a classic cryonics analogy (freezes solid, thaws out). Or seeds. Let's go with the wood frog or a seed. A seed feels more universal. Actually, the prompt mentions he liked the "spore analogy." Let's use the **wood frog**. It's specific, biological, and fits the "cold" theme of his job and his preservation.
      *   **The "Lottery Ticket" Aspect:** Mention his humility. He didn't think he *would* wake up, just that he *might*.
      *   **The Conclusion:** A statement true regardless of definition. Memory? Impact? Love? "He was here."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi, I'm [Name]. Walt was my friend. He fixed fridges. He's in Arizona in ice. Some of you think he's dead. Some think he's sleeping. I don't know. But I know he was good. He liked wood frogs that freeze. He said maybe we are like that. His kids miss him. His cryo friends hope for him. I miss him too. He bought a ticket. We are all here because we loved him. He was real.

      *Critique 1:* Too blunt. Needs more warmth and flow. Needs to sound like a speech, not a summary.

  6.  **Drafting - Iteration 2 (Focusing on Voice and Overlap):**
      *   *Voice:* "I work with metal. Walt worked with motors."
      *   *The Split:* "I know this room is divided." No, too aggressive. "I know we see things differently." Better.
      *   *The Truth:* "He isn't sitting in that chair." True for everyone. "We all feel the empty space." True for everyone.
      *   *The Analogy:* The wood frog. It stops its heart in winter. Starts again in spring. Walt liked that.
      *   *The Ending:* "He was here."

  7.  **Refining the Philosophy (The "Underneath" Work):**
      *   Instead of arguing definitions, focus on *presence*.
      *   Medical: Presence ended biologically.
