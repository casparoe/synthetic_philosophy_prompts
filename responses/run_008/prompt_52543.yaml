              2.  Kantian/Agency view (Liar authors the belief vs. Misleader lets reader author it).
          *   Evaluate the "Marketing vs. Assertion" defense (Speech-act distinction: Moral weight vs. Deniability).
          *   Identify where the practice is *underdetermined* (multiple theories fit).
          *   Describe what would change if the rival view (Misleadingness is the primary wrong) were adopted (What would "framing corrections" look like? Where would it collapse?).

  2.  **Deconstruct the Observed Pattern:**
      *   *The Norm:* Truthfulness is binary regarding *propositional content* (True/False) but gradient/absent regarding *pragmatic effect* (Impression/Frame).
      *   *The Implicit Logic:* It seems to prioritize the *record* over the *effect*. It cares about what can be pinned down linguistically.

  3.  **Address the Core Theoretical Question (The Wrong of Deception):**
      *   *Option A: Moral Theory.* Does the industry believe misleading is less wrong?
      *   *Option B: Administrative Theory.* Is it just about what can be policed?
      *   *Analysis:* It's likely a hybrid. The *explicit* justification is often moral (we tell the truth), but the *operational* logic is administrative (we can verify facts, not vibes). However, the prompt asks for the *presupposed* view. The practice treats falsity as a violation of duty and framing as a matter of strategy. This suggests a view where the *assertion* is the locus of moral commitment.

  4.  **Evaluate the Candidate Views:**
      *   **Gricean View (Lying = Misleading):** Grice argues that conversational implicature (misleading) relies on the same cooperative principles as explicit statement (lying). If you violate the maxim of quality via implication, you're still being uncooperative.
          *   *Does the practice endorse this?* No. The practice treats them differently.
          *   *Does the practice rule this out?* Yes, operationally. If they believed this, clickbait headlines would warrant corrections.
      *   **Kantian/Agency View (Authorship of Belief):** Kant focuses on the duty not to treat others as mere means. A liar forces a false belief into the listener's mind. A misleader provides true premises and lets the listener draw the false conclusion, preserving the listener's agency (even if manipulated).
          *   *Does the practice endorse this?* This fits the "hedged sentence" observation best. "Technically true" preserves the journalist's integrity; the reader's "mistake" is their own inference.
          *   *Nuance:* The "false balance" example (fringe vs. consensus) is trickier. That's structural misleading. But the *statement* remains "Scientist X says Y."

  5.  **Evaluate the "Marketing vs. Assertion" Defense:**
