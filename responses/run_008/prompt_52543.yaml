      *   *Moral Weight vs. Deniability:* The prompt asks if the distinction carries moral weight or just legal cover.
      *   *Analysis:* In practice, it functions as deniability. But philosophically, it relies on a speech-act theory where headlines are performatives (invitations) rather than constatives (claims). The industry *acts* as if this has moral weight (no corrections for headlines), but cynics would say it's just liability management. I need to present this tension.

  6.  **Identify Underdetermination:**
