          4.  The Marketing Defense (Moral vs. Legal).
          5.  Underdetermination (Where theories converge).
          6.  The Rival View (The "Framing Correction" and its collapse).
      *   *Refining the Kantian point:* Make sure to distinguish between *respect for autonomy* and *shirking responsibility*. The industry likes the former; the critic sees the latter.
      *   *Refining the Collapse:* Focus on the "countersigning" problem. If I correct the frame, I am asserting what the frame *was*. That's subjective.

  9.  **Self-Correction/Review during drafting:**
