      *   *Refining the Breaking Point:* What if Q2 is *unsolvable*? If the hypothesis space is inherently unbounded, then Q3 (thresholds) becomes the only practical salvage operation. That would flip 1 and 2.

  9.  **Final Polish:** Check against all prompt requirements.
      *   Defended ranking? Yes.
