  10. **Final Review of the "Cut":** Q4 is the obvious cut, but I need to justify it strongly. It's a "constraint" question, not a "method" question. The grant is for method.
      **Final Review of the "Add":** The "Mechanism/Function Mapping" is crucial. Adaptationist claims often ignore *how* the trait is built. If the mechanism is impossible, the adaptation story is dead. This is a hard constraint.

      *(Wait, let's look closer at Q1)*: Uniformity vs Variation. This is actually a specific instance of Q2 (what counts as evidence). Maybe Q1 is less fundamental than I thought. But it's very specific to EP. I'll keep it at #3.

      *(Wait, let's look closer at Q3)*: Preregistration of adaptive predictions. This is controversial in EP because the predictions often come *after* understanding the function. Forcing preregistration might kill the field. This makes Q3 high risk/high reward. I need to note that tension.

