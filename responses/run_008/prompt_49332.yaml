prompt: |-
  I'm a program officer at a small foundation about to fund a three-year program — roughly five researchers — on a single theme: when does an adaptive-hypothesis explanation of a human psychological trait count as science rather than a just-so story? The funding is for conceptual and methodological work: inference standards, criteria for when an adaptationist claim is supported, study-design templates. It is not for running new empirical studies, though the outputs should be usable by the people who do run them.

  I'd like a defended ranking of the open questions in this area, and I'll seed it with four candidates I've been circling. Rank them by how much they matter for the program's goal, add anything important I've left out, and tell me which of mine you'd cut.

  1. The uniformity/variation question: is pancultural uniformity of a trait stronger evidence of adaptation than the field's critics concede, or is observed cross-cultural variation better read as facultative response to environment — and on either answer, what follows for how adaptation is inferred?
  2. The truncated-hypothesis-space problem: when a researcher contrasts an adaptive explanation with a byproduct or noise alternative, is there a principled way to generate and grade the competing explanations, or is the comparison structurally underdetermined no matter how careful the study?
  3. The calibration question: could the field adopt explicit evidential thresholds for adaptive claims — for instance, a rule about how many independent, risky predictions a hypothesis must survive, or preregistration of adaptive predictions before data collection — and would such thresholds actually separate good work from bad, or only add bureaucracy?
  4. The comparative gap: adaptationist claims in morphology lean on the comparative and fossil record, but for psychology there is essentially no behavioral fossil. Is there anything methodological to build here, or is this better acknowledged and deprioritized?

  For each item I want the reasoning, not a summary: what makes it upstream or downstream of the others, how tractable it is for purely conceptual work, and what development over the next three years — in the program or the field — would move it up or down your ranking. State the criteria you're implicitly using (importance, tractability, neglectedness, how much else depends on the answer), and where two of them pull in opposite directions, show how you weighed them. I'm less interested in the final list than in whether the ordering survives scrutiny, so please close by identifying where your ranking is most likely wrong: which single argument or consideration, if it went the other way, would most reorder the list — and whether you see a flaw in the framing itself, e.g., a reason these four questions are not really separable and my asking for a ranking between them already misdescribes the field's problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Program Officer at a small foundation.
      *   **Task:** Fund a 3-year program (5 researchers) on a specific theme: Distinguishing science from "just-so stories" in evolutionary psychology (EP).
      *   **Scope:** Conceptual and methodological work (inference standards, criteria, templates). *No* new empirical studies. Outputs must be usable by empiricists.
      *   **Input:** Four candidate open questions provided by the user.
      *   **Output Requirements:**
          1.  Defended ranking of the four candidates (plus any additions).
          2.  Reasoning for each (upstream/downstream, tractability for conceptual work, conditions for re-ranking).
          3.  Explicit criteria used (importance, tractability, neglectedness, dependency).
          4.  Trade-off analysis (where criteria conflict).
          5.  Identification of the "breaking point" (what argument would reorder the list).
          6.  Critique of the framing (are these questions separable?).
          7.  Recommendation on what to cut.

  2.  **Deconstruct the Four Candidates:**
      *   *Q1 (Uniformity/Variation):* Evidence weight of universals vs. variation. (Epistemic status of data patterns).
      *   *Q2 (Hypothesis Space):* Generating/grading alternatives (byproduct/noise). (Structural underdetermination).
      *   *Q3 (Calibration/Thresholds):* Evidential standards (predictions, preregistration). (Procedural norms).
      *   *Q4 (Comparative Gap):* Lack of fossil record in psychology. (Data availability constraint).

  3.  **Establish Evaluation Criteria:**
      *   *Importance/Impact:* How much does solving this improve the field's ability to distinguish science from just-so stories?
      *   *Tractability (Conceptual):* Can 5 theorists actually make progress on this in 3 years without new data?
      *   *Upstream/Downstream:* Does answering this enable answers to the others? (Foundational vs. Applied).
      *   *Actionability:* Will the output be usable by empiricists (as per the grant mandate)?

  4.  **Initial Ranking & Reasoning (Mental Draft):**
      *   *Q2 (Hypothesis Space)* seems most fundamental. If you can't define the null or alternatives, thresholds (Q3) don't matter. It's the core logical problem of underdetermination.
      *   *Q3 (Calibration)* is highly actionable for empiricists. It's the "tool" they need. But it depends on Q2.
      *   *Q1 (Uniformity)* is specific to the *type* of evidence. Important, but maybe secondary to the logic of inference itself.
      *   *Q4 (Comparative)* seems like a dead end for a *conceptual* grant. If there's no fossil record, theorizing about it might just conclude "we can't do this." Low tractability/high frustration risk.
      *   *Missing Item:* The "Function vs. Mechanism" link. Adaptationist claims often skip the mechanistic plausibility. Or perhaps "Phylogenetic Inference without Fossils" (using language/culture as proxies). Let's stick to the prompt's request to add *anything important left out*. A strong candidate is *The Mapping Problem* (linking current function to ancestral selection pressure).

  5.  **Developing the Ranking (Iterative Refinement):**

      *   *Rank 1: Q2 (Truncated-Hypothesis-Space).* Why? Because "Just-So Story" is fundamentally a charge of *lack of rival consideration*. If you can't systematize rivals, you can't do science. It's upstream of Q1 and Q3. Tractable conceptually (philosophy of science + modeling).
      *   *Rank 2: Q3 (Calibration).* Why? This is the deliverable. Empiricists need checklists. It depends on Q2 (what are we testing?) but is the most "usable" output. High actionability.
      *   *Rank 3: Q1 (Uniformity/Variation).* Why? This is about interpreting specific data patterns. It's downstream of knowing *how* to test (Q2/Q3). It's important but more specific.
      *   *Rank 4: Q4 (Comparative Gap).* Why? It's a constraint, not a method. Conceptual work here risks concluding "give up." Low tractability for *improving* inference.

      *   *Addition:* **The Ancestral Reconstruction Problem.** How do we infer the Environment of Evolutionary Adaptedness (EEA) without assuming the trait tells us what the environment was? (Circularity risk). This is arguably more fundamental than Q1. Let's slot it in. Actually, Q2 covers the logic, Q1 covers the data pattern. The EEA problem is often the hidden assumption. Let's add **"The EEA Specification Standard"** as a new candidate. It might beat Q1.

      *   *Re-evaluating Q4:* Is it really the lowest? If the lack of fossils is the *reason* it's a just-so story, addressing it is key. But the prompt asks for *methodological work*. You can't methodologize a missing dataset. You can only methodologize proxies. So Q4 stays low.

      *   *Re-evaluating Q2 vs Q3:* Q2 is deeper, Q3 is more usable. The grant wants usable outputs. But you can't have usable thresholds without knowing what hypotheses are valid. Q2 is the engine, Q3 is the dashboard. Engine first.

  6.  **Addressing the "Cut" Recommendation:**
      *   Cut Q4. It's too negative ("is there anything to build?"). It risks a null result. The others offer positive methodological construction.

  7.  **Addressing the "Framing Flaw":**
      *   Are these separable? No. Q1 (data) depends on Q4 (comparative context) which depends on Q2 (hypothesis space). The ranking implies independence. The critique should highlight this interdependence. The "Just-So" charge is often a holistic judgment, not a checklist.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Professional, analytical, critical but constructive (Program Officer to Program Officer).
      *   *Structure:* Criteria -> Ranking -> Detailed Analysis -> The Cut -> The Addition -> The Framing Critique -> The Breaking Point.

      *(Self-Correction during drafting)*: Make sure I explicitly state the criteria *before* the ranking so the logic is clear. Ensure I answer "what development would move it up/down."
