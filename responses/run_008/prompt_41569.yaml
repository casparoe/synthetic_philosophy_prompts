prompt: |-
  hey, so I'm a physics PhD student and somehow I've been voluntold to run the discussion section for a first-year seminar on "infinity in math and philosophy" — think non-STEM majors, one 50-minute section, whiteboard only, no prerequisite beyond high school algebra. next week's reading is on supertasks and Thomson's lamp, and my co-TA who usually does this is at a conference so it's on me.

  to be clear I don't want you to explain supertasks to *me*, I know the material — I want a plan for how I should run the section. specifically:

  - the order the pieces need to go in. my instinct is that I can't just show them the lamp cold, something has to be in place first so the lamp lands as a real puzzle rather than them just shrugging and going "well obviously you can't press a button infinitely many times." what's the dependency chain, and what's the minimum version of each link that still holds up? (I have a feeling one round of Zeno-style convergent series has to come first so they see a supertask where everything *is* well-defined, before I break it — but maybe you disagree, tell me if that's the wrong foundation.)
  - what example should carry the whole thing. Thomson's lamp is the assigned reading so it has to show up, but should it be the spine or the punchline? if not the lamp, what's the better workhorse example and what properties does it need (and what should it deliberately NOT have)?
  - the misconceptions I should expect, in roughly the order the students will actually form them, and where in the sequence I should head each one off. my guesses so far: "the lamp is off because it's off at the end of every odd... wait, even interval" half-remembered limit intuitions, the feeling that the final state has to be one of the states the lamp was in at some finite stage, and treating the whole thing as a physics question about whether you *physically could* flip that fast, at which point the philosophy falls out. also at least one kid will bring up quantum or "but what about Planck time" and I need to know whether to engage or park it.
  - what I should openly refuse to cover and say so out loud — I assume the Ross urn paradox and anything about spacetime/relativistic supertasks are out, but you tell me.
  - one question I can ask in the last five minutes that would actually tell me whether they got the real point (the distinction between a quantity whose limit exists, like the total elapsed time, and one that doesn't, like the lamp's state) versus whether they just learned "infinity is weird."

  also, since you'll be making calls about what first-years can absorb in 50 minutes that you can't actually verify — flag how confident you are in the load-bearing parts of the plan, and single out the one point you're least sure about. if there's a step where you suspect I'm overestimating what they'll get in one pass, I'd rather know now than mid-section.
reasoning: |-
