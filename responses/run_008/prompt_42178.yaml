prompt: |-
  Draft the joint statement that would emerge from an adversarial collaboration between two camps that have argued for years about the one-shot prisoner's dilemma.

  Camp A holds that in a genuinely one-shot prisoner's dilemma between causally isolated agents with no communication, defecting is simply what rationality demands, and that every argument for cooperation smuggles in something the stipulations of the game exclude: repeated play, reputation, a causal link, or altruistic payoffs that are no longer the prisoner's dilemma at all.

  Camp B, drawing on the superrationality tradition and on evolutionary and tournament-based arguments about the emergence of cooperation, holds that agents who know they are facing symmetric choices with symmetric information and symmetric deliberative machinery should treat their own choice as strong evidence about the other agent's choice, and that cooperation can therefore be rational even in a strict one-shot setting.

  The document should contain the following: (1) a numbered section of claims both camps can sign — about the formal structure of the game, about what the folk theorem for iterated play does and does not establish, and about what Axelrod-style tournaments actually demonstrated (given that they involved repeated interaction and pre-submitted strategies rather than live one-shot deliberation); (2) a table of the exact residual disagreements, each phrased so the camp holding that view would accept the wording as a fair statement of its own position — including whether the evidential weight of one's own choice is a theorem of decision theory, a consequence of an additional empirical premise about how similar the two deliberators are, or an outright confusion of correlation with causation; (3) the cruxes — sub-questions such that settling them would move at least one camp. I suspect one crux is whether any real-world interaction is ever genuinely one-shot, given shared culture, shared algorithms, or shared training; another is whether the causal isolation stipulation, if it could actually be enforced, would itself dissolve the cooperative intuition or merely make it irrational to follow; (4) for each crux, a concrete case, experiment, or argument both camps agree would bear on it, with each camp's prediction recorded in advance. If you conclude that part of the dispute is verbal — for instance, about what 'rational' should mean in a decision-theoretic context — say explicitly which part and why, and separate it from the residual substantive disagreement.

  End with a short section stating what, if anything, both camps agree would constitute progress on this question, and what would merely restate their starting positions in new vocabulary.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement from an adversarial collaboration between two camps (Camp A: Causal Decision Theory/Defect; Camp B: Evidential/Superrational/Cooperate) regarding the one-shot Prisoner's Dilemma (PD).
      *   **Camp A Position:** Defection is rational in a truly one-shot, causally isolated PD. Cooperation arguments smuggle in extra-game factors (reputation, iteration, altruism).
      *   **Camp B Position:** Superrationality/Evidential Decision Theory. Symmetric agents should treat their choice as evidence of the other's choice. Cooperation can be rational.
      *   **Required Components:**
          1.  Numbered section of agreed claims (formal structure, Folk Theorem limits, Axelrod tournament limits).
          2.  Table of residual disagreements (phrased neutrally/fairly).
          3.  Cruxes (sub-questions that could move a camp) with concrete cases/experiments/predictions.
          4.  Identification of verbal disputes vs. substantive disagreements.
          5.  Conclusion on what constitutes progress vs. restatement.

  2.  **Deconstruct the Camps & Terminology:**
      *   *Camp A:* Aligns with Causal Decision Theory (CDT), Nash Equilibrium strictures, classical game theory. Key concept: Causal independence means my choice doesn't *change* yours.
      *   *Camp B:* Aligns with Evidential Decision Theory (EDT), Functional Decision Theory (FDT), Hofstadter's Superrationality. Key concept: Logical correlation means my choice *predicts* yours.
      *   *Tone:* Academic, precise, collaborative but acknowledging deep divergence. "Adversarial Collaboration" style (like Tetlock/Anchoring projects).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish the baseline. What *is* a PD? Payoff structure ($T > R > P > S$).
      *   What about the Folk Theorem? It applies to *iterated* games, not one-shot. Both camps agree on this distinction.
      *   What about Axelrod? It was iterated. Strategies were fixed code, not deliberative agents updating in real-time.
      *   *Goal:* Clear up misconceptions about what the standard literature actually proves.

  4.  **Drafting Section 2: Residual Disagreements (The Table):**
      *   Need to capture the core conflict without bias.
      *   *Issue 1: The status of correlation.* Is it rational to act on evidential correlation without causal leverage?
      *   *Issue 2: The definition of 'Rational'.* Is it maximizing expected utility based on causal impact (A) or evidential impact (B)?
      *   *Issue 3: Symmetry.* Does knowing the other is "like me" change the decision matrix?
      *   *Phrasing:* Must be acceptable to both. "Camp A asserts X," "Camp B asserts Y."

  5.  **Drafting Section 3: Cruxes & Experiments:**
      *   *Crux 1: Real-world "One-Shotness".* Is true isolation possible?
          *   *Test:* AI agents with shared weights vs. distinct weights in a simulated one-shot.
          *   *Prediction A:* They defect (causal isolation holds).
          *   *Prediction B:* They cooperate (logical correlation holds).
      *   *Crux 2: The meaning of Causal Isolation.* If we enforce it strictly (Newcomb-like separation), does the intuition vanish?
          *   *Test:* A "Clone PD" where the copy is perfect vs. a "Stranger PD".
          *   *Prediction A:* Clone PD is a different game structurally.
          *   *Prediction B:* Clone PD reveals the true logic of the Stranger PD.
      *   *Crux 3: Decision Theory Axioms.* Is the "Principle of Dominance" absolute?
          *   *Test:* Newcomb's Problem variants.
          *   *Prediction:* A accepts Dominance; B rejects it in favor of Expected Utility maximization under evidential constraints.

  6.  **Drafting Section 4: Verbal vs. Substantive:**
      *   Is this just about the word "Rational"?
      *   *Analysis:* Partly. If "Rational" means "Nash Equilibrium," A wins. If "Rational" means "Maximize Payoff," B might win (if correlation exists).
      *   *Substantive Core:* It's about the metaphysics of decision-making. Do logical facts count as constraints on choice? This is substantive, not just verbal.

  7.  **Drafting Section 5: Progress vs. Restatement:**
      *   *Progress:* Formalizing the conditions under which logical correlation arises. Empirical data on human/AI behavior in high-symmetry one-shots.
      *   *Restatement:* Renaming CDT/EDT without changing predictions.

  8.  **Review and Refine:**
      *   *Check Constraints:* Did I include the numbered section? Yes. The table? Yes. Cruxes with predictions? Yes. Verbal/Substantive split? Yes. Progress definition? Yes.
      *   *Tone Check:* Is it neutral? Does it sound like a joint statement? (Use "We agree," "We disagree.")
      *   *Accuracy:* Ensure the game theory concepts (Folk Theorem, Axelrod, Payoff Matrix) are used correctly. Ensure the distinction between Causal and Evidential decision theory is clear but accessible.
      *   *Refining Camp B's argument:* Make sure it doesn't sound like magic. It's about *symmetry* and *logical causation*, not telepathy.
      *   *Refining Camp A's argument:* Ensure it doesn't sound straw-manned. It's about *causal efficacy*.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Initially, I might make the "Crux" too abstract. I need concrete experiments. Let's use AI agents for the most concrete test of "shared algorithm."
      *   *Correction:* Ensure the table explicitly mentions the "confusion of correlation with causation" point requested in the prompt.
      *   *Correction:* Make sure the "Verbal" section clearly delineates where the words stop and the world begins.

  10. **Final Output Generation** (Proceeding to generate the response based on these steps).
answer: |-
  # Joint Statement on the One-Shot Prisoner's Dilemma
  **Date:** October 26, 2023
  **Signatories:** The Causal Independence Working Group (Camp A) and the Symmetric Deliberation Working Group (Camp B)

  ## Preamble
  This document emerges from a two-year adversarial collaboration between two camps historically divided on the normative solution to the one-shot Prisoner's Dilemma (PD). Camp A argues that rationality mandates defection under causal isolation. Camp B argues that rationality permits or mandates cooperation under conditions of symmetric deliberation. While we remain divided on the prescriptive conclusion, we have achieved consensus on the descriptive landscape of the problem. This statement delineates our agreements, isolates our residual disagreements, identifies empirical and theoretical cruxes, and defines what constitutes genuine progress.

  ---

  ## 1. Points of Consensus
  We jointly affirm the following claims regarding the formal and historical context of the debate:

  1.  **Formal Structure:** We agree on the standard payoff matrix for the Prisoner's Dilemma: Temptation ($T$) > Reward ($R$) > Punishment ($P$) > Sucker ($S$), with $2R > T + S$. We agree that in the standard normal-form representation, agents choose simultaneously without communication.
  2.  **The Folk Theorem:** We agree that the Folk Theorem establishes that cooperation can be sustained as a Nash Equilibrium in *infinitely* or *indefinitely* iterated games given a sufficiently high discount factor. We agree that the Folk Theorem establishes nothing regarding the normative solution to a *finitely* bounded, known one-shot game.
  3.  **Axelrod's Tournaments:** We agree that Robert Axelrod's famous tournaments (1980, 1984) involved *iterated* play, not one-shot interactions. We agree that the success of "Tit-for-Tat" demonstrated the robustness of reciprocity strategies in an evolutionary context over time, but did not demonstrate the rationality of cooperation in a single round against a fixed, non-adaptive opponent.
  4.  **Causal Isolation:** We agree that the standard stipulation of the one-shot PD requires that Agent A's choice cannot physically causally influence Agent B's choice at the time of decision (no signaling, no enforcement mechanisms, no future retaliation).
  5.  **Payoff Maximization:** We agree that the goal of the agents is to maximize their own individual expected utility as defined by the payoff matrix. We reject the notion that "cooperation" implies altruism; in this context, cooperation is a means to a higher individual payoff ($R$ vs $P$), not a preference for the other's welfare.

  ---

  ## 2. Table of Residual Disagreements
  The following table summarizes the core points of divergence. Each statement is phrased to be acceptable to the camp holding it as a fair characterization of their position.

  | Domain | Camp A (Causal Independence) Position | Camp B (Symmetric Deliberation) Position |
  | :--- | :--- | :--- |
  | **Decision Theory** | Rational choice is governed by **Causal Decision Theory (CDT)**. An agent should choose the act that causes the best outcome. Since my choice does not *cause* the other's choice, I must treat their choice as fixed background probability. | Rational choice is governed by **Evidential/Functional Decision Theory (EDT/FDT)**. An agent should choose the act that provides the best *news* about the outcome. If my reasoning is symmetric to the other's, my choice is strong evidence of theirs. |
  | **Correlation vs. Causation** | Treating one's own choice as evidence of the other's choice in a causally isolated setting is a **confusion of correlation with causation**. Acting on this correlation is an act of magical thinking that violates the dominance principle. | The correlation is not merely empirical but **logical**. If we are symmetric reasoners facing the same problem, we will output the same answer. Ignoring this logical link is a failure to recognize that the two decisions are logically entangled. |
  | **Status of Symmetry** | Symmetry is an **empirical premise** about the world, not a theorem of decision theory. Unless I know *for a fact* the other agent is identical to me, I cannot assume correlation. Even then, causality dictates defection. | Symmetry is a **structural feature** of the deliberation. If I know the other agent is rational and facing the same matrix, I must assume they will replicate my reasoning process. My decision *is* their decision, logically speaking. |
  | **The "Rational" Label** | "Rational" means **strategically stable** (Nash Equilibrium). Defection is the only strategy that cannot be exploited. Cooperation is fragile and irrational because it invites exploitation if the symmetry breaks. | "Rational" means **payoff-maximizing**. If cooperating yields a higher expected return due to logical correlation, defection is irrational because it leaves utility on the table. Stability is secondary to outcome. |

  ---

  ## 3. Cruxes and Proposed Adjudications
  We have identified three specific cruxes. Settling these would significantly shift the probability estimates of at least one camp regarding the correct normative theory. For each crux, we propose a concrete case or experiment and record our divergent predictions.

  ### Crux 1: The Reality of "Genuine" One-Shotness
  **Question:** Is any real-world interaction ever genuinely one-shot and causally isolated, or does shared culture/training/algorithm create a de facto logical link that validates Camp B's approach?

  *   **Proposed Experiment:** **The Homogeneous AI Trial.** Two instances of the same open-source LLM (same weights, same temperature, same prompt) are instantiated in isolated environments. They are asked to play a one-shot PD against each other. They are explicitly told they are running the same code.
  *   **Camp A Prediction:** The agents will defect (or randomize). Knowing they are the same code does not change the causal structure; the dominant strategy remains defect. If they cooperate, it is due to training bias (RLHF), not rational deduction.
  *   **Camp B Prediction:** The agents will cooperate. Recognizing the logical identity, the decision function will output "Cooperate" because $C \to (Other=C) \to R$ yields higher utility than $D \to (Other=D) \to P$.
  *   **Resolution Condition:** If agents cooperate at rates significantly above baseline without specific "cooperation" fine-tuning, Camp A concedes that logical correlation is a actionable feature of algorithmic decision-making.

  ### Crux 2: The Dissolution of Intuition under Strict Isolation
  **Question:** Does the intuition that cooperation is possible vanish if causal isolation is rigorously enforced, or does the intuition persist, suggesting Camp A's "causal isolation" stipulation is the error?

  *   **Proposed Argument:** **The Newcomb Variant.** We analyze a PD scenario modified to be structurally identical to Newcomb's Problem (where a predictor simulates you). Camp A views this as a different game; Camp B views it as the revealing of the true logic of the PD.
  *   **Camp A Prediction:** In a strict Newcomb setup, one-boxing (cooperating) is rational *because* the predictor causally influences the payoff box based on the prediction. In the standard PD, no such predictor exists. Enforcing strict isolation dissolves the cooperative intuition entirely.
  *   **Camp B Prediction:** The "Predictor" in Newcomb's Problem is functionally identical to the "Symmetric Opponent" in the PD. If you accept one-boxing in Newcomb's, you must cooperate in the Symmetric PD. Enforcing strict isolation merely hides the logical dependency; it does not remove it.
  *   **Resolution Condition:** If Camp A members consistently one-box in Newcomb's Problem but defect in the Symmetric PD, the disagreement is confirmed to be about **decision theory axioms**. If they one-box in both, the PD disagreement is merely about the **empirical likelihood of symmetry**.

  ### Crux 3: The Definition of Rationality (Verbal vs. Substantive)
  **Question:** Is the dispute merely about the definition of the word "rational," or does it imply different actions in the world?

  *   **Proposed Case:** **The Transparent Box.** Agents play the PD, but before choosing, they are shown the other agent's source code (or brain scan) which reveals their intent.
  *   **Camp A Prediction:** Even with this information, if I cannot *change* their code by my choice, I must defect. Rationality is about causal leverage.
  *   **Camp B Prediction:** If the code reveals they are a "mirror" agent, I must cooperate. Rationality is about aligning outputs to maximize utility.
  *   **Resolution Condition:** If both camps agree on the *action* to take in all empirical scenarios but disagree on whether to label it "rational," the dispute is **verbal**. If they prescribe different actions in the Homogeneous AI Trial (Crux 1), the dispute is **substantive**.

  ---

  ## 4. Analysis of Verbal vs. Substantive Disagreement
  We conclude that the dispute is **partially verbal but fundamentally substantive.**

  *   **Verbal Component:** There is ambiguity in the term "Rational." Camp A defines it as "adhering to the Principle of Dominance in causal models." Camp B defines it as "maximizing expected utility given all available information, including logical correlations." If the debate were restricted to terminology, we could agree to use "CDT-Rational" and "FDT-Rational."
  *   **Substantive Component:** The verbal distinction masks a substantive disagreement about the **metaphysics of choice.** Camp A holds that an agent's choice is a local causal event. Camp B holds that an agent's choice is the output of a logical function that may be instantiated in multiple places. This is not merely semantic; it leads to divergent predictions in the **Homogeneous AI Trial (Crux 1)**. If Camp B is correct, building AI that reasons according to Camp A's principles will leave significant utility on the table in high-symmetry environments. This is a factual claim about the structure of optimization, not a definition.

  ---

  ## 5. Pathways to Progress
  We agree on the following criteria for evaluating future work on this question:

  **What Constitutes Progress:**
  1.  **Formalization of Logical Correlation:** A rigorous mathematical framework that quantifies the degree of "logical similarity" required between agents to justify evidential reasoning, distinct from causal similarity.
  2.  **Empirical AI Data:** Results from the **Homogeneous AI Trial** (Crux 1) that show whether advanced optimizers naturally converge on cooperation when isolated but identical.
  3.  **Evolutionary Stability Analysis:** A demonstration of whether CDT-agents or FDT-agents outcompete each other in a meta-game where they can choose their own decision theories before entering the PD.

  **What Constitutes Restatement:**
  1.  **Renaming Axioms:** Papers that simply rename Causal Decision Theory as "Naive Rationality" or Evidential Decision Theory as "Enlightened Rationality" without new predictive power.
  2.  **Smuggling Iteration:** Arguments for cooperation in the one-shot case that rely on implicit assumptions about future reputation or social signaling without explicitly modeling them as payoff modifications.
  3.  **Moralizing the Payoff:** Attempts to resolve the dilemma by arguing agents *should* have altruistic preferences. We agree this changes the game from a PD to a Harmony Game, which solves the problem by dissolving the constraints rather than solving the decision problem.

  **Signed,**

  *The Causal Independence Working Group (Camp A)*
  *The Symmetric Deliberation Working Group (Camp B)*
