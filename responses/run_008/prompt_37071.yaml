prompt: |-
  I'm a second-year philosophy student taking a metaphysics course centred on the problem of universals, and I also have a part-time job helping curate the schema of my university's biological specimen database. Researchers keep submitting terms they want modelled, and for each one somebody has to decide whether it becomes a repeatable class or property in the schema — something many specimens can share — or is recorded as a one-off label attached to particular records. The database manager wants a written procedure the curators, none of whom have studied metaphysics, can run on any submitted term in a few minutes; he also wants it grounded in the actual philosophy rather than ad hoc, and the course has convinced me this decision is a live version of the one-over-many problem: when many specimens are blue, is that one thing they share, or only a resemblance? Please build the procedure out of what the main positions on universals imply for modelling — realism about shared properties, resemblance nominalism, and the contrast between sparse properties that deserve ontological weight and abundant ones that merely re-describe what's already there. Give the ordered questions, say what counts as a sufficient answer at each step, mark where the procedure terminates with 'record as an individual' as against 'admit the class or property', and be explicit about the steps that are judgement calls the philosophy cannot settle and that must be handed to a person. Then run the procedure on three submissions: a researcher who wants flower colour treated as a shared property across specimens; one who wants 'collected by a famous naturalist' modelled as a class of specimens rather than as a relation to a person; and one who wants a hybrid zone — a population that is spatiotemporally continuous, interbreeding, and fading out at the edges — modelled as a class. I suspect the procedure will say that the last one is an individual rather than a class, which is the answer that researcher will hate, so please explain that case carefully. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Second-year philosophy student, taking a metaphysics course (problem of universals), working part-time curating a biological specimen database schema.
      *   **Task:** Create a written procedure for curators (non-philosophers) to decide whether a submitted term should be a *repeatable class/property* (Universal) or a *one-off label/individual* (Particular).
      *   **Constraints:**
          *   Grounded in actual metaphysics (Realism, Resemblance Nominalism, Sparse vs. Abundant properties).
          *   Ordered questions with sufficient answers.
          *   Clear termination points ('record as an individual' vs. 'admit the class or property').
          *   Explicitly mark judgement calls philosophy cannot settle.
          *   Run the procedure on three specific cases:
              1.  Flower colour (shared property).
              2.  'Collected by a famous naturalist' (class vs. relation).
              3.  Hybrid zone (spatiotemporally continuous population).
          *   **Specific Warning:** The hybrid zone case will likely result in 'individual', which the researcher will hate. Explain this carefully.
          *   **Language:** British English.

  2.  **Deconstruct the Metaphysical Framework:**
      *   *The Problem of Universals:* Do properties (like "blue") exist independently of the things that have them, or are they just names/ressemblances?
      *   *Realism:* Universals exist. If many specimens share a feature grounded in nature, it's a class/property.
      *   *Nominalism (Resemblance):* Only particulars exist. "Classes" are just groups of things that resemble each other. For database purposes, we still need to group them, but we must be careful not to reify arbitrary groups.
      *   *Sparse vs. Abundant Properties (Lewis):*
          *   *Sparse:* Carve nature at the joints (e.g., mass, charge, biological species). These deserve ontological weight (Classes/Properties).
          *   *Abundant:* Any old predicate (e.g., "grue", "collected by Dave"). These are just descriptions. In a database, treating these as classes can lead to schema bloat and logical errors.
      *   *Particulars (Individuals):* Spatiotemporally located entities that cannot be wholly present in multiple places at once (e.g., this specific specimen, this specific event, this specific population).

  3.  **Drafting the Procedure (The "Universal Test"):**
      *   *Goal:* A flowchart-like text that a layperson can use.
      *   *Step 1: Replicability.* Can more than one specimen have this *exact* same feature without it being a coincidence? (Filters out unique identifiers).
      *   *Step 2: Independence/Inherence.* Is the feature intrinsic to the specimen, or does it depend on a specific external event/person? (Distinguishes properties from relations/events).
      *   *Step 3: Naturalness (Sparse vs. Abundant).* Does this group "carve nature at the joints"? Is it projectible? (The core metaphysical heavy lifting).
      *   *Step 4: Spatiotemporal Location.* Is the thing defined by *where* and *when* it is, rather than *what* it is? (Distinguishes Individuals from Universals).
      *   *Judgement Calls:* Need to highlight where metaphysics runs out and pragmatic database design begins.

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Flower Colour.*
          *   Replicable? Yes.
          *   Intrinsic? Yes.
          *   Natural? Yes (biologically significant).
          *   Spatiotemporal? No (blue is here and there).
          *   *Verdict:* Admit as Property/Class.

      *   *Case 2: 'Collected by a famous naturalist'.*
          *   Replicable? Yes (multiple specimens collected by Darwin).
          *   Intrinsic? No. It's a relation to a person/event.
          *   Natural? It's an abundant property (accidental grouping).
          *   *Verdict:* Record as Individual (the Person/Event) + Relation, NOT a Class of specimens. The prompt asks if it's modelled as a *class of specimens*. Metaphysically, this is a "Cambridge property" or extrinsic denomination. It shouldn't be a class in the schema sense of "type of specimen".

      *   *Case 3: Hybrid Zone.*
          *   Replicable? No. There is only *one* specific hybrid zone at *this* time and place.
          *   Intrinsic? It's a population, which is a collective particular.
          *   Natural? It carves nature at the joints (biologically real), *but* it is a particular entity, not a universal type.
          *   Spatiotemporal? Yes. It is essentially defined by its location and duration.
          *   *Verdict:* Record as an Individual (a specific biological entity), not a Class.
          *   *Explanation:* This is the tricky one. Biologists often talk about "hybrid zones" as if they are types. But *this* hybrid zone between *these* species at *this* mountain range is a particular. If there's another one elsewhere, it's a *different* individual, not the *same* universal. The researcher wants a Class (implying multiple specimens share the "hybrid zone-ness" as a universal). But the zone itself is the individual. The specimens *in* it are members of that population. Wait, the prompt says "modelled as a class". If the researcher wants a class called "Hybrid Zone Specimens", that implies any specimen from any hybrid zone fits. If they mean *this* specific zone, it's an individual. The prompt says "a hybrid zone... modelled as a class". I need to argue that a specific population is a *particular*, not a *universal*. Even if the *concept* of a hybrid zone is a universal, the *instance* is not. The database schema needs to distinguish between the *type* of entity and the *token*.
          *   *Refinement:* The prompt asks if the *zone* is modelled as a class. If the schema treats "Hybrid Zone" as a Class, then specimens are instances of that Class. But a specific hybrid zone is a spatiotemporally bound entity. It is an individual. Specimens are *parts* of it or *members* of the population. They don't share a universal "hybrid zone-ness" in the same way they share "blue". They share membership in a particular collective.
          *   *Metaphysical angle:* This touches on the distinction between *kinds* (Universals) and *collectives/aggregates* (Particulars). A species is often debated (Individual vs. Class), but a specific hybrid zone is definitely a particular.

  5.  **Refining the Tone and Language:**
      *   British English (e.g., "modelled", "centre", "programme", "colour").
      *   Academic but accessible (for curators).
      *   Respectful of the researcher's potential frustration (especially Case 3).

  6.  **Writing the Procedure (Iterative refinement):**
      *   Make sure the distinction between 'Class' (Universal) and 'Individual' (Particular) is clear.
      *   Ensure 'Sparse vs. Abundant' is integrated into the 'Naturalness' step.
      *   Highlight the 'Judgement Call' sections clearly.

  7.  **Addressing Case 3 (The Hybrid Zone) in depth:**
      *   Why will they hate it? Because they want to query "all hybrid zone specimens".
      *   Why is it an individual? Because it has a birth, death, and location. It cannot be wholly present in two places.
      *   How to model it then? As an Individual Entity that specimens are *related to* (e.g., `member_of_population`), not as a Class they *instantiate*.
      *   Connect this to the "Species as Individuals" thesis (Ghiselin/Hull) if helpful, but keep it simple.

  8.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Ordered questions? Yes.
      *   Sufficient answers marked? Yes.
      *   Termination points clear? Yes.
      *   Judgement calls highlighted? Yes.
      *   Three cases run? Yes.
      *   Case 3 explained carefully? Yes.
      *   Grounded in metaphysics (Realism, Nominalism, Sparse/Abundant)? Yes.

  9.  **Self-Correction during drafting:**
      *   *Correction:* In Case 2, the researcher wants 'collected by a famous naturalist' as a *class of specimens*. Metaphysically, this is an "abundant property". It groups things based on an extrinsic relation. A realist would say this isn't a *natural kind*. A nominalist might allow it as a resemblance class but warn against ontological commitment. For a database schema, treating extrinsic relations as intrinsic classes is bad practice (normalisation). I need to make sure the procedure catches this. Step 2 (Intrinsic vs Extrinsic) should catch it.
      *   *Correction:* In Case 3, ensure I distinguish between the *concept* of a hybrid zone (Universal) and *this* hybrid zone (Particular). The submission is for *a* hybrid zone (singular, specific description). Therefore, it is a particular.

  10. **Final Polish:** Check spelling (colour, modelled, centre) and tone. Ensure the philosophical terms are explained simply for the curators.

  *(Self-Correction on Case 3 logic)*: If the researcher wants to model "Hybrid Zone" as a Class, they mean any specimen belonging to *any* hybrid zone. If they mean *this specific* hybrid zone, they are asking to treat a particular as a universal. The prompt says "a hybrid zone... modelled as a class". This implies the specific instance. I will argue that specific populations are particulars.

