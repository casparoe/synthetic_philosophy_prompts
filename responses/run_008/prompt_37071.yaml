answer: |-
  **To:** Database Management Team
  **From:** Metaphysics & Schema Working Group
  **Subject:** Procedure for Determining Ontological Status of Submitted Terms (The 'Universal Test')

  ### 1. Introduction and Purpose

  When researchers submit terms for the specimen database, we must decide how to model them. Should the term represent a **Class or Property** (something repeatable that many specimens can share, like 'Mammalia' or 'blue')? Or should it represent an **Individual** (a one-off label attached to a specific record or entity, like 'Specimen #402' or 'The 1998 Expedition')?

  This decision mirrors the philosophical 'Problem of Universals'. To ensure our schema reflects the structure of reality rather than arbitrary linguistic habits, we use the following procedure. It is grounded in three metaphysical principles:

  1.  **Realism vs. Nominalism:** Does the feature exist as a shared reality (Universal), or is it merely a name we give to resembling things (Particular)?
  2.  **Sparse vs. Abundant Properties:** Does the feature 'carve nature at the joints' (Sparse/Natural), or is it an accidental grouping (Abundant/Artificial)?
  3.  **Particularity:** Is the entity defined by its specific location in space and time? If so, it is an Individual, not a Class.

  ### 2. The Procedure

  Curators should run every submitted term through the following four questions in order.

  #### Step 1: The Replicability Test
  **Question:** Can this feature be wholly present in two different specimens at the same time without either specimen changing its identity?

  *   **Sufficient Answer for 'Yes':** The feature is a quality or type (e.g., 'petal count', 'species'). Specimen A and Specimen B can both have it simultaneously.
  *   **Sufficient Answer for 'No':** The feature identifies a unique history, event, or specific object (e.g., 'this specific DNA sample', 'the crash of flight 101').
  *   **Termination:**
      *   If **No**: **Record as an Individual.** (Terminate).
      *   If **Yes**: Proceed to Step 2.

  #### Step 2: The Inherence Test (Intrinsic vs. Extrinsic)
  **Question:** Is this feature intrinsic to the specimen's physical constitution, or does it depend entirely on a relation to something else (a person, an event, a location)?

  *   **Sufficient Answer for 'Intrinsic':** The feature remains true even if the specimen is moved to a void. (e.g., 'mass', 'morphology').
  *   **Sufficient Answer for 'Extrinsic':** The feature disappears if the related object/event is removed from the description. (e.g., 'owned by X', 'collected during Y').
  *   **Termination:**
      *   If **Extrinsic**: **Record as an Individual (the related thing) + Relation.** Do not create a Class of specimens based on this. (Terminate).
      *   If **Intrinsic**: Proceed to Step 3.

  #### Step 3: The Naturalness Test (Sparse vs. Abundant)
  **Question:** Does grouping specimens by this term 'carve nature at the joints'? Would a scientist expect specimens in this group to behave similarly in future experiments (projectibility)?

  *   **Sufficient Answer for 'Sparse (Natural)':** The grouping reflects causal powers or biological reality (e.g., 'photosynthetic', 'diploid').
  *   **Sufficient Answer for 'Abundant (Artificial)':** The grouping is useful for administration or is a 'gerrymandered' collection of disparate things (e.g., 'specimens on the top shelf', 'blue or heavy things').
  *   **Judgement Call Warning:** Philosophy cannot strictly define 'naturalness'. This requires domain expertise. If the term groups things that share no causal powers, it is Abundant.
  *   **Termination:**
      *   If **Abundant**: **Record as an Individual Label (Tag).** Do not admit as a formal Class in the ontology. (Terminate).
      *   If **Sparse**: Proceed to Step 4.

  #### Step 4: The Spatiotemporal Test (Kind vs. Collective)
  **Question:** Is the term referring to a *type* of thing that can appear anywhere, or a *specific collective entity* bound to a specific place and time?

  *   **Sufficient Answer for 'Type (Universal)':** The entity can have multiple instances across the globe (e.g., 'Hybrid Zone' as a concept, 'Population' as a concept).
  *   **Sufficient Answer for 'Collective (Particular)':** The entity is a single, continuous historical object, even if it is made of many parts (e.g., 'The London Population of *X*', 'This Specific Hybrid Zone').
  *   **Judgement Call Warning:** This is the hardest distinction. Biologists often speak of populations as if they are classes. Metaphysically, a specific population is an individual organism writ large.
  *   **Termination:**
      *   If **Collective/Specific**: **Record as an Individual.** (Terminate).
      *   If **Type/General**: **Admit the Class or Property.** (Terminate).

  ---

  ### 3. Application to Submitted Terms

  Below is the application of the procedure to the three current submissions.

  #### Submission A: 'Flower Colour'
  *Researcher Request:* Model 'flower colour' as a shared property across specimens.

  1.  **Replicability:** Can two specimens share the same colour? **Yes.**
  2.  **Inherence:** Is colour intrinsic to the specimen? **Yes.** (It does not depend on who collected it).
  3.  **Naturalness:** Is colour biologically significant? **Yes.** (It relates to pollination, genetics, and taxonomy). It is a Sparse property.
  4.  **Spatiotemporal:** Is 'flower colour' bound to one location? **No.** It is a type that appears everywhere.

  **Verdict:** **Admit the Class or Property.**
  **Reasoning:** This is a classic Universal. It is repeatable, intrinsic, and natural. It fits the realist conception of a property that many particulars instantiate.

  ***

  #### Submission B: 'Collected by a Famous Naturalist'
  *Researcher Request:* Model this as a *Class of Specimens* (e.g., a class called 'Darwin Specimens').

  1.  **Replicability:** Can two specimens be collected by the same person? **Yes.**
  2.  **Inherence:** Is being 'collected by Darwin' intrinsic to the biological tissue? **No.** It is an extrinsic relation to a historical event and a person. If Darwin had not existed, the specimen would still exist, but this property would not.
  3.  **Termination:** The procedure terminates at Step 2.

  **Verdict:** **Record as an Individual (plus Relation).**
  **Reasoning:** Metaphysically, this is a 'Cambridge property' or extrinsic denomination. It does not describe *what* the specimen is, but *what happened to it*.
  **Schema Action:** Do not create a Class called 'Darwin Specimens'. Instead, create an Individual record for 'Charles Darwin' and a Relation property `collected_by`. Grouping them into a Class suggests they share a biological nature, which is an 'Abundant' (accidental) grouping, not a 'Sparse' (natural) one.

  ***

  #### Submission C: 'The Alpine Hybrid Zone'
  *Researcher Request:* Model a specific hybrid zone (a population that is spatiotemporally continuous, interbreeding, and fading out at the edges) as a **Class**.

  1.  **Replicability:** Can two specimens share membership in *this* zone? **Yes.**
  2.  **Inherence:** Is membership intrinsic? **Mostly.** (It depends on location and genetics).
  3.  **Naturalness:** Is a hybrid zone biologically real? **Yes.** It is a Sparse entity; it has causal powers (gene flow, selection pressures).
  4.  **Spatiotemporal:** Is *this* hybrid zone a type that appears everywhere, or a specific entity bound to space and time? **It is a specific entity.**
      *   *Analysis:* There is only *one* Alpine Hybrid Zone. It was born at a specific time, occupies a specific mountain range, and will eventually cease to exist (either by merging or extinction). It is a continuous historical particular, much like a single organism or a specific storm system.
  5.  **Termination:** The procedure terminates at Step 4.

  **Verdict:** **Record as an Individual.**
  **Reasoning:** This is the most contentious result. The researcher will likely object, arguing that a 'Hybrid Zone' is a category of biological phenomenon. However, the submission is for *a* hybrid zone (the specific one in the Alps), not the general concept.

  **Explanation for the Researcher:**
  I anticipate this verdict will be unwelcome, so please offer the following explanation grounded in the metaphysics of biology:

  > "We understand you wish to query all specimens belonging to this population. However, in our ontological schema, we must distinguish between a **Universal** (a repeatable type) and a **Particular** (a specific historical entity).
  >
  > While 'Hybrid Zone' is a universal concept, *this* specific hybrid zone is a **biological individual**. Like a specific organism, it has a birth, a lifespan, and a specific location. It cannot be 'wholly present' in another mountain range. If we model it as a Class, we imply that 'Hybrid Zone-ness' is a quality inherent in the specimens, like 'blue' or 'diploid'. But membership in this zone is not a quality; it is **part-whole membership** in a specific collective entity.
  >
  > If we model this as a Class, we commit a category mistake. We would be treating a specific historical event (the interbreeding of these populations in this place) as if it were an eternal truth.
  >
  > **The Solution:** We will record 'The Alpine Hybrid Zone' as an **Individual Entity** in the database. Specimens will not *instantiate* the class 'Hybrid Zone'; rather, they will stand in a `member_of_population` relation to the Individual 'The Alpine Hybrid Zone'. This preserves the biological reality (that the zone is a real, causal thing) without violating the logical structure of the schema (by treating a particular as a universal)."

  ### 4. Notes on Judgement Calls

  Curators should note two areas where philosophy provides the framework but not the final answer:

  1.  **Naturalness (Step 3):** Metaphysics tells us to look for 'Sparse' properties, but it cannot tell us if 'Leaf Shape Type 4' is sparse. That is a scientific question. If the biological community treats it as projectible (useful for prediction), treat it as Sparse.
  2.  **Vagueness (Step 4):** Biological individuals often have fuzzy edges (e.g., when exactly does a population start?). Metaphysics acknowledges this vagueness but insists that despite the fuzziness, the entity is still a particular, not a universal. Do not let vagueness force you to classify a particular as a class.

  ### 5. Conclusion

  By following this procedure, we ensure the database schema respects the distinction between **what things are** (Universals/Classes) and **which things exist** (Particulars/Individuals). This prevents schema bloat, ensures data integrity, and aligns our information architecture with the best available metaphysical understanding of the natural world.
