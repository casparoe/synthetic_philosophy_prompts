      *   *Friction 1 (Philosophers):* Is "at first sight" a coherent concept? If learning happens in minutes, does the distinction between "innate" and "rapid learning" matter philosophically? Did Molyneux mean *literally* the first millisecond, or the first encounter?
      *   *Friction 2 (Scientists):* Is "first fixations" measurable? Patients are overwhelmed. Is it ethical/practical to test before feedback? Your definition of "experience" might be too strict.
