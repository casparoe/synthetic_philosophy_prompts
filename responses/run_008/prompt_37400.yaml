answer: |-
  I have been turning over your objection to my latest lecture notes, specifically your insistence that the standard Moloch narrative relies on a static conception of human preference, and I think you have put your finger on the exact hinge where the argument must turn if we are to understand the true gravity of the coordination problem. You are right to be suspicious of the story where firms would rather not pollute and students would rather sleep, as if these desires are exogenous constants waiting to be liberated by the right institutional fix. If we treat preferences as endogenous to the competitive dynamic, as evolutionary theory demands we should, the picture does not become more hopeful as you initially suggested; rather, it becomes significantly darker, precisely because it dissolves the possibility of a natural coalition against the trap. The consoling intuition behind the standard narrative is that there exists a latent solidarity among the trapped, a shared human interest in stepping off the treadmill that merely awaits the correct coordination mechanism to activate. But if the treadmill itself selects for runners who love the running, or at least for runners who do not question the direction, then the population inside the trap ceases to contain the seeds of its own liberation. We are not looking at a prison full of unwilling inmates plotting an escape; we are looking at a system that selectively admits only those who identify as wardens.

  Consider the mechanism of this selection. In a hyper-competitive market or geopolitical environment, the margin for survival is often determined by the willingness to externalize costs or intensify extraction. An organization that treats growth as a means to human flourishing will inevitably be outcompeted by one that treats growth as a terminal goal, simply because the latter will reinvest more aggressively and tolerate higher risks. Over time, the former ceases to exist, not because its members were convinced by argument, but because they were outgrown. This is the endogenous shift: the values of the surviving entities align perfectly with the requirements of their survival. The pessimism here stems from the fact that coordination requires a shared interest, a Schelling point where agents recognize that cooperation yields a higher payoff than defection. But if the agents remaining in the game are those whose utility functions have been rewritten to value defection—or to value the metrics that require defection—above all else, there is no stable population of would-be cooperators left to coordinate. You cannot organize a strike among workers who have been replaced by algorithms, nor can you negotiate a treaty with nations whose leadership is selected solely for their willingness to breach treaties. The trap becomes self-sealing because it filters out the very psychology required to perceive it as a trap.

  I know your immediate rejoinder, one that leans heavily on the history of life itself. You will point out that biological evolution is also a ruthless competitive process, yet it produced organisms capable of profound cooperation, altruism, and the enforcement of group-beneficial norms. We have commitment devices, we punish defectors, and we have built civilizations on the back of multi-level selection that favors groups which can solve their internal collective action problems. If nature found a way out of the pure race-to-the-bottom through the evolution of sociality, why should we assume the market or the state cannot do the same? It is a powerful argument, but it relies on specific constraints of biological evolution that do not hold in the realm of institutional competition. In biology, the unit of selection is ultimately the gene propagated through an embodied organism. That embodiment imposes hard constraints; an organism cannot grow infinitely, it cannot discard its sensory apparatus without dying, and it is bound by the slow pace of generational turnover. These constraints allow for the stabilization of cooperative norms because the cost of defection is often physical destruction or reproductive failure within a localized ecology.

  However, the analogy breaks down precisely where the institutional world becomes more abstract and fluid than the biological one. A corporation is not an embodied organism; it is a legal fiction that can shed its skin instantly. It can lay off the very humans who constitute its "body" without dying, it can merge with competitors to change its identity, and it can operate on a timescale of fiscal quarters rather than generations. This fluidity means that the selection pressure is applied to the abstract structure of incentives, not the well-being of the constituent humans. In biology, if a trait harms the organism's ability to survive, the gene is lost. In markets, if a trait harms the humans inside the firm but helps the firm's bottom line, the humans are lost and the firm survives. This decoupling allows the endogenous selection of values to proceed without the braking mechanism of suffering. The "values" being selected are not human values, but institutional imperatives that may be entirely orthogonal to human welfare. Consequently, the evolutionary escape routes you cite—kin selection, reciprocity, group norms—rely on a congruence between the selector and the selected that simply does not exist in modern institutional competition. We are not evolving as a species to be better at corporate competition; the corporations are evolving to be better at competition, using us as transient substrate.

  This breakdown suggests that the endogeneity of values cuts the other way entirely, deepening the pessimism rather than alleviating it. If the selection process were biological, we might hope that a group of cooperators could outcompete the defectors because their cohesion makes them more robust. But in the institutional realm, the "cooperators" are often the ones burdened by regulation, ethics, or concern for externalities, making them slower and less efficient in the short-term metrics that determine survival. The speed of cultural and institutional transmission allows for the rapid propagation of "memetic" viruses—strategies that spread because they are good at spreading, not because they are good for the hosts. We see this in the way certain management practices or financial instruments go viral despite their destructive long-term consequences. Because the institutional environment lacks the embodied feedback loops of biology, there is no natural check on the selection of anti-social values other than the catastrophic collapse of the system itself. We are left with a scenario where the only agents capable of wielding significant power are those who have been structurally selected to ignore the costs of that power.

  So, when you teach the course, I urge you to press this point hard, for it changes the nature of the solution. If preferences are fixed, the solution is mechanical: change the incentives, and the humans will naturally cooperate. But if preferences are endogenous, changing the incentives is not enough because the agents themselves must be changed, or the selection pressure must be halted. We cannot rely on the trapped to save themselves if the trap has already reshaped their desires to fit the bars. The hope of a spontaneous convergence on cooperation assumes a shared humanity that the competitive dynamic is actively selecting against. This does not mean resistance is futile, but it means that resistance cannot be framed merely as unlocking a coordination problem among rational actors with fixed interests. It must be framed as a struggle over the evolution of the actors themselves, a fight to preserve human-scale values against institutional selection pressures that have no use for them. The Moloch narrative is not wrong to describe the trap, but it is dangerously optimistic if it assumes the prisoners still want to leave. The true horror is that the prison is training the next generation of guards to love the lock, and until we address that endogenous shift, any coordination we attempt will be co-opted by those who have no interest in stopping the game.
