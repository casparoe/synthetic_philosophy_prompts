  ### Reflective Equilibrium on Special Obligations

  Your intuitions are remarkably consistent with a specific family of political philosophy theories often labeled **Political Liberalism** or **Institutional Role Morality**. Your tentative principle (reciprocity) failed because it focused on the *relationship* between people, whereas your verdicts actually track the *role* of the agent and the *type of good* being distributed.

  The "Role Distinction" hypothesis you mentioned is the strongest candidate. It suggests that morality is not a single uniform field but is partitioned by institutional mandates. A government is not a big family, nor is it a global charity; it is a **trustee** for a specific constituency. However, to accommodate your ER verdict (which rejects partiality), we must add a **Humanitarian Threshold**: roles that involve immediate life-preservation within the jurisdiction transcend national mandates.

  Here is the principle that best captures your pattern, followed by the necessary adjustments to your view.

  #### The Favored Principle: The Mandated Trusteeship and Humanitarian Threshold Principle

  **Statement:** *Moral obligations are determined by the agent's institutional role and the nature of the resource, requiring state trustees to prioritize compatriots in distributing social goods, private agents to exercise discretion, and all agents to uphold basic human rights regardless of nationality when immediate survival is at stake.*

  **Clauses and Motivations:**

  1.  **The Public Trustee Clause:** State agents distributing resources generated by domestic compulsory cooperation (taxes) are mandated to prioritize the welfare of the contributors (compatriots).
      *   *Motivating Case:* **Government Disability Spending.** This explains why the spending is not just permissible but *required*. The government is a trustee of citizen funds, not a global utilitarian calculator. It would be a breach of fiduciary duty to spend citizen taxes on non-citizens when citizen needs are unmet.
  2.  **The Sovereign Triage Clause:** State agents engaged in sovereign protection (borders, security, rescue at the boundary) may prioritize citizens in tragic choice scenarios where resources are insufficient to save all.
      *   *Motivating Case:* **Coast Guard Rescue.** This distinguishes sovereign rescue from domestic care. The Coast Guard protects the *polity*; when forced to choose, the integrity of the polity permits prioritizing its members.
  3.  **The Humanitarian Threshold Clause:** Any agent (state or private) with the immediate capacity to prevent death or severe harm within their jurisdiction must do so regardless of nationality; distributive mandates yield to basic rights.
      *   *Motivating Case:* **ER Tourist.** This overrides the Public Trustee Clause. Once a person is within the civil sphere (the hospital), the duty to preserve life trumps the administrative duty to prioritize citizens. Turning them away treats a basic right as a distributive good.
  4.  **The Private Discretion Clause:** Private individuals spending private resources are permitted to favor compatriots but are not morally required to do so, nor is doing so morally superior to saving lives abroad.
      *   *Motivating Case:* **Private Donation.** This captures your feeling that local charity is "fine" but not "better." Private citizens are not trustees; they have moral discretion.
  5.  **The Universal Morality Clause:** Non-distributive moral norms (truth-telling, non-maleficence) apply impartially to all persons regardless of role or nationality.
      *   *Motivating Case:* **Lying.** This confines partiality to the distributive sphere, preserving the universality of basic moral interaction.

