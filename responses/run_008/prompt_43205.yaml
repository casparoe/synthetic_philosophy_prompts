  #### Application to New Cases

  **1. The Legislator and Tariffs**
  *   **Scenario:** A legislator votes for tariffs that cost foreigners a lot to benefit compatriots a little.
  *   **Application:** This falls under the **Public Trustee Clause**. The legislator's role is to advance the economic welfare of their constituents. Unlike the ER case, this does not violate a *basic human right* (assuming the tariffs don't cause starvation). It is a distribution of economic advantage, not a life-or-death emergency.
  *   **Verdict:** **Permissible.** The legislator is fulfilling their mandate. While the global cost is high, their specific moral role restricts them to prioritizing the welfare of those they represent.

  **2. The Emigrating Doctor (Brain Drain)**
  *   **Scenario:** A doctor from a poor country emigrates to a rich one, arguing she owes her compatriots her labor because they subsidized her training.
  *   **Application:** This falls under the **Private Discretion Clause** with a caveat. The doctor is a private agent, not a state trustee. She is not morally *required* to stay. However, the subsidy creates a specific contract. If the training was a public investment, the *State* (not the compatriots generally) may have a claim to reciprocity (e.g., a service bond).
  *   **Verdict:** **Permissible to Emigrate.** She owes no general duty to "compatriots" as strangers. She may owe a specific debt to the *institution* that funded her, but absent a contract, her role as a private moral agent allows her to seek the best life for herself. The home state's failure to retain her is a institutional failure, not her moral violation.

