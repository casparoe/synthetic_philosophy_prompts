      *   What do we want a theory to do? It needs to rank outcomes involving different populations.
      *   *Key Comparisons:*
          *   Same people, different welfare (Pareto).
          *   Different people, same/positive welfare (Existence).
          *   Trade-offs: Quality vs. Quantity.
          *   Distribution (Equality).
      *   *Key Paradoxes to Avoid (usually):* Repugnant Conclusion, Sadistic Conclusion, Non-Identity Problem implications.
      *   *Key Distinctions:* Existence vs. Welfare, Total vs. Average.
      *   *Formal Properties:* Transitivity, Completeness, Separability.

  3.  **Drafting the Desiderata (Section 1):**
