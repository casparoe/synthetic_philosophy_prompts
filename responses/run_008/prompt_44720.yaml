prompt: |-
  we're near the end of a module on population ethics and after weeks of the repugnant conclusion chewing up every theory in sight (total views get the repugnant conclusion, average views get worse, person-affecting views struggle to say a world of happy people is better than a world of miserable ones when nobody exists in both...), I've realised I don't actually have a clear view of what a theory of population ethics is even FOR — what would count as one doing its job. so before I try to pick between views I want the spec first.

  write me the desiderata: what any adequate population axiology has to deliver. I want the requirements themselves plus the case behind each — which comparisons it must get right (a world with extra happy people vs the same world without them, a smaller population at higher wellbeing vs a larger at lower, equal vs very unequal lives, lives barely worth living), which paradoxes it has to dissolve or at least not generate itself (the repugnant conclusion, the sadistic conclusion, the non-identity problem), and the distinctions it cant collapse (making people better off vs making more people, total vs average, people who exist in both worlds vs people who exist in only one). then tell me which of these are non-negotiable and which are just preferences of particular camps dressed up as requirements — I suspect "avoid the repugnant conclusion" is itself negotiable and I'd like you to take that seriously rather than just telling me it's intuitive.

  the bit I most want: can some subset of the desiderata be jointly unsatisfiable? everyone keeps saying the impossibility results in this literature show no theory can satisfy all the intuitions, but nobody in my seminar actually walks through WHICH requirements conflict and why. if some subset genuinely can't be jointly met, say which and show me the tension. and here's the thing I keep wondering and would like you to address head on: is it the ordering requirement itself — that betterness over worlds has to be complete and transitive — that's doing the damage? that never gets questioned, but it looks to me like a prejudice we smuggled in from decision theory. if we dropped it, or weakened it, would the whole impossibility business evaporate, or would it just change shape?

  skip scoring the actual theories against the list — I'll do that myself over reading week. and no reading lists please, my tutor handles that.
