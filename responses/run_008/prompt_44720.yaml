      *   *Substantive:* Pareto (obvious), Non-Elitism (avoiding the "Very Repugnant Conclusion" in the other direction), Intuition of Neutrality (maybe?), Avoidance of Absurdities (Repugnant/Sadistic).
      *   *Formal:* Transitivity, Completeness, Separability (Independence of Irrelevant Alternatives).
      *   *Structural:* Person-Affecting Restriction (maybe too strong?), Critical Levels.

  4.  **Analyzing Negotiability (Section 2):**
      *   The user suspects "Avoid Repugnant Conclusion" is negotiable. They are right. Many total utilitarians accept it as a bullet to bite.
      *   What is truly non-negotiable?
          *   *Pareto:* If everyone is better off, the world is better. (Hard to reject without losing normative force).
          *   *Transitivity:* If A > B and B > C, then A > C. (Hard to reject without losing action-guidance).
          *   *Non-Arbitrariness:* Similar cases treated similarly.
      *   What is negotiable?
          *   *The Repugnant Conclusion:* Parfit called it "repugnant," but some argue it's just "large numbers."
          *   *The Person-Affecting View:* "Better off" vs "More people." Hard to formalize without contradictions.
          *   *Separability:* Does the value of a group depend on others?

  5.  **Addressing Impossibility Results (Section 3):**
      *   This is the technical core. Need to reference Arrhenius's Impossibility Theorem.
      *   *The Conflict:* You can't have *all* of: Adequate Non-Elitism, Non-Repugnance, Pareto, Transitivity, Separability.
      *   *The Tension:* Basically, if you want to avoid the Repugnant Conclusion (Quality > Quantity at the margin), you eventually get the Sadistic Conclusion (Adding miserable people is better than adding happy-but-low people) or violate Transitivity/Pareto.
      *   *Specific Trade-off:* The tension is usually between *Quality* (avoiding repugnance) and *Quantity* (valuing happy lives) under conditions of *Transitivity* and *Separability*.

