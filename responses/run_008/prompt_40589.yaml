answer: |-
  The modernist argument translates robustly as a claim that nations are phenetic grades masquerading as monophyletic clades, sustained by strong cultural selection rather than genuine genealogical cohesion.

  In your vocabulary, the modernist position asserts that nationalists are committing a systematic phylogenetic error: they diagnose a clade where there is only a grade. The claim of an ancient ethnic core is a hypothesis of monophyly based on shared derived characters (synapomorphies), but Anderson and Hobsbawm argue these characters are homoplasies—traits arising independently or engineered recently rather than inherited vertically from a common ancestor. Invented traditions are cultural mutations with high selection coefficients; they are swept to fixation not by drift but by deliberate institutional pressure (education, conscription, print media) because they confer fitness in the form of political legitimacy. The "imagined" community is a population structured by subjective assortative mating and cooperation barriers rather than objective reproductive isolation. Where you see clines and ring species across geographic space, the nation imposes hard boundaries, artificially truncating gene flow to create discrete units from continuous variation. Founder effects are mythologized as singular founding events that fix specific cultural alleles, obscuring the actual admixture and reticulation of the underlying population.

  Here is the residue report on the translation.

  **Clean Translations:** The structural distinction between a true lineage (clade) and a constructed grouping (grade) maps perfectly onto the debate between primordialism and modernism. The mechanism of "invention" translates well as strong directional selection fixing neutral or maladaptive traits because they serve a functional role (group cohesion). The concept of arbitrary borders imposed on clinal variation is identical to treating a cline as a step function for taxonomic convenience.

  **Distortions:** To make the fit work, I had to treat cultural transmission as vertical inheritance, but nationalism relies heavily on horizontal transmission (peer-to-peer, media) that mimics verticality. I also had to treat the "selection" as blind, whereas nationalist engineering is teleological; the "environment" is being manipulated by the organisms themselves to ensure the trait survives. In population genetics, fitness is a posteriori outcome; in nationalism, fitness is an a priori design specification.

  **Missing Expressions:** Population genetics has no operator for reflexivity. A clade exists regardless of whether its members recognize the synapomorphies binding them. A nation exists *only* if the members recognize the binding traits. There is no equation for a system that brings itself into existence through the act of modeling itself. The historians' language of "imagining" is not imprecise; it captures a causal mechanism—collective intentionality—that biology filters out as noise.

  Your hunch survives, but it is stronger than you suspect. The difference is not just that a population believes it is a clade; it is that the belief is constitutive of the unit. In phylogenetics, ontology precedes epistemology: the lineage exists before we name it. In nationalism, epistemology constitutes ontology: the naming creates the lineage. The historians' vocabulary is not dressed-up imprecision; it is necessary precision for a phenomenon driven by agency rather than blind variation. You cannot model a nation with drift equations because the "drift" is being steered by the very particles undergoing the motion. The residue isn't a failure of the analogy; it is the boundary where biological causality ends and semantic causality begins.
