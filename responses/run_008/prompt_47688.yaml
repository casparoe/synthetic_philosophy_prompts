prompt: |-
  My philosophy of religion seminar spent all of ten minutes on the ontological argument before the professor waved it off with 'existence is not a predicate' -- said this goes back to Kant, called the whole thing a parlor trick, and moved on. But afterwards a classmate showed me Gödel's modal version, which doesn't seem to treat existence as a predicate at all, it treats necessary existence as a property, and now I genuinely don't know what the slogan was supposed to be ruling out. What are the distinct precise claims 'existence is not a predicate' could be making, from the trivially true (of course existence isn't a grammatical predicate like 'is hairy') to the substantive, and for each one tell me: is it plausible, and does it kill Anselm's version, Gödel's version, both, or neither? Then don't just leave me a menu to choose from -- commit. Tell me which reading my professor most likely had in mind, whether it actually does the work he wanted it to do against the argument as Anselm and Gödel each stated it, and if you think the slogan as standardly deployed is doing something shadier than it looks, say that too. For context, I've read the relevant chapters of the Proslogion and Gaunilo's pushback, but not the first Critique, so don't assume I know what Kant's actual version of the objection was.
