answer: |-
  Your frustration is well-founded. Dismissing the ontological argument in ten minutes with a slogan is a rite of passage in philosophy departments, but it often borders on intellectual malpractice. It treats a complex metaphysical dispute as a settled grammatical error. Your classmate is right: Gödel's version is sophisticated enough that the standard "existence is not a predicate" slogan does not obviously annihilate it.

  To clear this up, we need to dissect the slogan. "Existence is not a predicate" is a philosophical shibboleth that conflates at least three distinct claims. Let's break them down from trivial to substantive, evaluate their plausibility, and see if they kill Anselm, Gödel, or neither.

  ### Part 1: The Menu of Meanings

  #### 1. The Grammatical Claim
  **The Claim:** The word "exists" does not function grammatically as a predicate (like "is hairy" or "is red").
  **Plausibility:** **False.** In English (and Latin, and German), "exists" functions perfectly well as a grammatical predicate. "God exists" has the same subject-verb structure as "God speaks."
  **Impact:** Kills **Neither.** Anselm and Gödel are not making grammatical errors. They are making metaphysical claims using standard grammar.

  #### 2. The Fregean/Quantificational Claim
  **The Claim:** In formal logic, existence is not a first-order property of an object ($F(x)$), but a second-order property of a *concept* (or a quantifier). To say "Unicorns exist" is not to attribute a property to unicorns, but to say "There is at least one $x$ such that $x$ is a unicorn" ($\exists x Ux$).
  **Plausibility:** **High (in standard logic).** This is the standard view in analytic philosophy since Frege and Russell. It treats existence as "instantiation."
  **Impact:**
  *   **Anselm:** **Devastating.** Anselm argues that a being that exists in reality is "greater" than one that exists only in the understanding. This treats existence as a property that adds to the nature of the being. If existence is just instantiation ($\exists$), you can't compare a "non-instantiated concept" to an "instantiated concept" in terms of greatness, because the non-instantiated one isn't a being at all to have properties.
  *   **Gödel:** **Complicated.** Gödel uses Higher-Order Modal Logic. He explicitly defines "Necessary Existence" ($NE$) as a property of an essence. He anticipates the Fregean objection. In his system, existence *is* formalized as a property (specifically, that an essence is necessarily instantiated). The Fregean objection forces Gödel to defend why his logical system treats existence as a property, but it doesn't automatically invalidate the proof unless you reject his logical framework entirely.

  #### 3. The Kantian/Conceptual Claim (The "Hundred Thalers")
  **The Claim:** Existence adds no content to the *concept* of a thing. A hundred real thalers (coins) do not contain a single penny more conceptual content than a hundred possible thalers. Existence is not a "real predicate" that determines *what* a thing is, only *that* it is.
  **Plausibility:** **Debatable.** It is intuitively plausible that the *description* of a thing doesn't change whether it exists. However, many metaphysicians argue that actuality *is* a mode of being that differs from possibility.
  **Impact:**
  *   **Anselm:** **Devastating.** Anselm relies on the idea that existence is a "perfection" that makes a being greater. If existence adds no content/perfection to the concept, then a maximally great being is not greater for existing.
  *   **Gödel:** **Less Direct.** Gödel does not argue that *contingent* existence is a perfection. He argues that *Necessary Existence* is a "Positive Property." The Kantian objection targets existence simpliciter. Gödel could reply: "Kant is right that mere existence adds no content, but *Necessary* Existence implies a specific modal status (existing in all worlds) which is a substantive property of an essence." To kill Gödel, you need to upgrade the claim to: "Necessary Existence is not a Positive Property."

  #### 4. The Axiological Claim (Existence is not a Perfection)
  **The Claim:** Existence does not make a thing *better*. (This is the specific version of Kant's objection relevant to Ontological Arguments).
  **Plausibility:** **Plausible.** Does a real ugly painting have more value than the concept of a real ugly painting? Not necessarily. Existence seems neutral.
  **Impact:**
  *   **Anselm:** **Devastating.** Anselm's argument hinges on existence being a "great-making" property.
  *   **Gödel:** **The Battleground.** Gödel's argument is valid, but its soundness rests on Axiom 1: "If a property is positive, its negation is not positive," and the definition that Necessary Existence is Positive. This claim attacks the *axiom*, not the logic. It forces the debate onto whether "Necessary Existence" is actually good/perfect.

  ---

  ### Part 2: The Commitment

  You asked me to commit. Here is the diagnosis of your seminar.

  **1. What your professor likely meant:**
  Your professor was almost certainly deploying a hybrid of **Claim 2 (Fregean)** and **Claim 3 (Kantian)**. In the analytic tradition, this is the standard "off-the-shelf" objection. They meant: *"You cannot define something into existence by treating instantiation as a property that contributes to a definition."*

  **2. Did it do the work they wanted?**
  *   **Against Anselm:** **Yes.** The slogan is sufficient to dismiss Anselm's classical formulation. Anselm treats existence as a property that increases greatness. Modern logic and Kantian metaphysics agree that this is a category error. If you treat existence as a quantifier, Anselm's move from "concept" to "reality" is blocked.
  *   **Against Gödel:** **No.** This is where your professor was sloppy. Waving the slogan at Gödel is a category mismatch. Gödel's argument is a *modal* argument. He grants that contingent existence isn't a property. He argues that *Necessary Existence* is a property of an essence. Dismissing Gödel with "Existence is not a predicate" is like dismissing a chess player by saying "Checkers is a different game." It ignores the specific machinery Gödel built to circumvent the Kantian objection. To refute Gödel, one must attack the specific axioms (e.g., "Why is Necessary Existence 'Positive'?"), not wave a general slogan about predicates.

  **3. Is the slogan shadier than it looks?**
  **Yes.** It is philosophically shady in three ways:

  *   **It begs the question:** The slogan assumes a specific logical framework (Fregean first-order logic) to prove that a metaphysical argument is wrong. But if the metaphysical argument (like Gödel's) requires a different logical framework (Higher-Order Modal Logic) to be coherent, you can't use the rules of the first system to disprove the second without arguing *why* the second system is illegitimate.
  *   **It conflates "Existence" with "Necessary Existence":** Kant's objection was primarily about contingent existence (do the coins exist in my pocket?). The Ontological Argument is about *necessary* existence (could this being fail to exist?). Many contemporary philosophers (like Plantinga) argue that while "existence" might not be a predicate, "necessary existence" *is* a coherent property. The slogan glosses over this distinction.
  *   **It shuts down inquiry:** By calling it a "parlor trick," the professor implies the argument is a mere linguistic confusion. But Gödel's argument is mathematically valid. If you accept his axioms, the conclusion follows. The real philosophical work is in debating the axioms (Is Necessary Existence a perfection? Is the logic sound?), not in dismissing the structure with a 1780s slogan.

  ### Part 3: What Kant Actually Said (For Context)

  Since you haven't read the *First Critique*, here is the core of Kant's objection without the jargon.

  Kant argues that when we define a thing (e.g., "God is omnipotent, omniscient, omnibenevolent"), we are listing the contents of a concept. When we add "God exists," we are not adding a new item to that list. We are not saying "God is omnipotent, omniscient, omnibenevolent, *and* exists."

  Kant uses the example of **100 Thalers** (coins).
  *   **Concept:** 100 Thalers.
  *   **Reality:** 100 Thalers in my pocket.
  *   **Kant's Point:** The *concept* of the 100 Thalers in my pocket is identical to the 100 Thalers I am merely imagining. The reality does not add a single property to the coins themselves. It only adds the relation of the coins to *me* (the subject).
  *   **The Kill:** Therefore, you cannot find "existence" inside the concept of a "Most Perfect Being." If you say "A Most Perfect Being must exist," you are trying to pull existence out of a definition. But existence isn't *in* the definition. So, you are left with: "If a God exists, he exists necessarily." But you haven't proved the "If."

  **Why this hurts Anselm:** Anselm thinks existence makes the being "greater." Kant says existence doesn't change the being's properties at all, so it can't make it greater.

  **Why this struggles against Gödel:** Gödel doesn't say existence is in the definition. He says "Necessary Existence" is a *Positive Property* (like moral goodness). He argues that a being that exists necessarily is "better" (more perfect) than a being that exists contingently. Kant's objection doesn't automatically rule out that *modal status* (necessity) could be a perfection, even if *existence* isn't.

  ### Final Verdict

  Your professor took the path of least resistance. The slogan "Existence is not a predicate" is a sufficient shorthand to dismiss Anselm's 11th-century formulation in an introductory context. However, deploying it against Gödel's 20th-century modal formulation without further argument is intellectually lazy.

  **The truth:** The Ontological Argument is not a "parlor trick." It is a valid deductive argument that relies on controversial metaphysical premises.
  *   **Anselm's version** is largely dead, killed by the Fregean/Kantian consensus that existence isn't a great-making property.
  *   **Gödel's version** is alive but wounded. It survives the "predicate" objection but faces scrutiny on whether "Necessary Existence" is truly a "Positive Property" and whether the modal logic system (S5) applies to metaphysics.

  If you want to push back in class, don't argue that existence *is* a predicate. Argue that **the slogan is too blunt an instrument for the specific modal machinery Gödel constructed.** Ask the professor: *"Does Kant's objection to contingent existence apply to Necessary Existence as a modal property, or does the objection require a specific critique of Gödel's Axiom 1?"* That will force them off the slogan and into the actual philosophy.
