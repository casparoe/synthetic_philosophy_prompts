      *   *Correction on Śabda:* Make sure to distinguish between the *source* status and the *mechanism*. The real philosophical meat is in the *conditions* for testimonial knowledge (the *śābdabodha* debate).
      *   *Job Market:* Analytic departments want rigor and engagement with current lit. South Asia departments want philological rigor and contextualization. The ranking *does* flip.
      *   *Advisor's Hint:* "Unresolved" means there's a genuine philosophical aporia, not just a lack of secondary literature. *Śabda* reductionism is genuinely unresolved in Nyāya because the *Tattvacintāmaṇi* arguments are dense and interpretations vary (Bimal Matilal vs. K.K. Raja vs. Stephen Phillips).

  6.  **Finalizing the Structure:**
      *   **Executive Summary:** Direct answer.
      *   **Top Priority:** *Śabda* (Testimony). Detailed breakdown (Downstream, Tractability, Payoff).
