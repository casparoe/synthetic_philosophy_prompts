  7.  **Final Polish:** Ensure terms are used correctly (*pramāṇa*, *anumāna*, *vyāpti*, *tarka*, *nirvikalpaka*, *savikalpaka*). Ensure the distinction between "historical exegesis" and "philosophical reconstruction" is clear. (Proceed to generate output).

  *(Self-Correction during final review)*: Wait, I should check the "shaky Sanskrit" constraint again. *Śabda* debates often involve *ākāṅkṣā*, *yogyatā*, *āsatti*. These are technical but available in Phillips' translations. *Vyāpti* involves *upādhi* and complex negations. Definitely harder. *Nirvikalpaka* involves *sannikarṣa* (sense-object connection). Moderate difficulty. Okay, the ranking holds.

