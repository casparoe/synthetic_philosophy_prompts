answer: |-
  # The Causal Sorter: A Decision Tree for the Post-Pearl Rationalist

  You've identified the core pathology of our little reading group: we are sorting by *aesthetic allegiance* rather than *commitment structure*. We say "I'm a Woodwardian" because we like the graphs, but we answer the preemption cases like Lewisians. We say "I'm an Eliminativist" until we need to justify a policy intervention.

  Below is a diagnostic tree designed to bypass the labels and map your actual intuitions. It begins from our shared baseline (causation is more than Humean regularity) and forces choices on the specific fault lines where the literature actually breaks.

  ### The Tree

  **Start:** You agree that causation is a real relation (or useful fiction) distinct from mere constant conjunction.

  **Node 1: The Process Filter (Salmon–Dowe)**
  *Question:* Must a cause be connected to its effect by a spatiotemporally continuous process transmitting a conserved quantity (energy/momentum)?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to Node 2.

  **Node 2: The Omission Test (Gardener Case)**
  *Question:* The gardener fails to water the plants, and they die. Is the *absence* of water a cause of the death, equivalent in ontological status to the presence of a toxin?
  *   **No:** (You likely lean toward a strict physicalist ontology). Go to **Leaf B (Eliminativism)**.
  *   **Yes:** Go to Node 3.

  **Node 3: The Agency Constraint (Menzies–Price)**
  *Question:* Is the concept of causation essentially tied to an agent's capacity to manipulate the world? (i.e., If there were no agents capable of intervention, would causal relations still obtain?)
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4: The Decision-Theoretic Perspective (Constraint Node)**
  *Question:* Should causal judgments be sensitive to the specific deliberative perspective of the agent (what *this* agent can do/knows), or invariant across all potential manipulators?
  *   **Sensitive:** (Causation is relative to the agent's options). Go to **Leaf C (Menzies–Price Agentialism)**.
  *   **Invariant:** (Causal structure exists independently of specific agents, even if defined via intervention). Go to **Leaf C (Menzies–Price Agentialism)**.
      *   *Note:* This is a forced collapse. Menzies–Price typically implies sensitivity, but if you demand invariance while answering "Yes" to Node 3, you occupy an unoccupied leaf (see analysis below).

  **Node 5: The Preemption Test (Assassin Case)**
  *Question:* Assassin 1 shoots. Assassin 2 would have shot if 1 hadn't. The victim dies. There is no counterfactual dependence of death on Assassin 1's shot (because 2 would have acted). Is Assassin 1 nonetheless the cause?
  *   **No:** (You require strict counterfactual dependence). Go to **Leaf D (Lewisian Counterfactualism)**.
  *   **Yes:** Go to Node 6.

  **Node 6: The Intervention Circularity Check**
  *Question:* To define an "intervention," we must specify that it changes the target variable without changing the effect *except through the target*. Does this circularity (using causal notions to define intervention) fatally undermine the theory?
  *   **Yes:** (You demand a non-causal reduction of intervention). Go to **Leaf E (Unoccupied/Strict Reductionist)**.
  *   **No:** (You accept circularity as benign or take intervention as primitive). Go to Node 7.

  **Node 7: The Backtracking Constraint**
  *Question:* Are backtracking counterfactuals ever valid for causal analysis? (i.e., "If the effect hadn't occurred, the cause wouldn't have either" implies the cause was necessary).
  *   **Yes:** (You allow diagnostic backtracking). Go to **Leaf F (Unoccupied/Diagnostic Causal)**.
  *   **No:** (Standard forward-only evaluation). Go to Node 8.

  **Node 8: The Token/Type Split (Woodward vs. Pearl/HP)**
  *Question:* Is the primary goal of your causal theory to provide a formal definition of *actual (token) causation* (e.g., "This specific shot caused this specific death")?
  *   **Yes:** Go to **Leaf G (Halpern–Pearl / SEM)**.
  *   **No:** (You care primarily about *type causation* / invariance for explanation). Go to **Leaf H (Woodwardian Interventionism)**.

  ---

  ### The Leaves: Occupied and Unoccupied

  **Leaf A: Salmon–Dowe Process Theory**
  *   **Path:** Node 1 (Yes).
  *   **Profile:** You believe causation is physical glue. Omissions are not causes. Preemption is solved by tracing the process.
  *   **Distortion:** This leaf forces you to reject omissions. If you answered "Yes" to Node 2 but "Yes" to Node 1, you are straddling. There is no coherent "Process Theory with Omissions."

  **Leaf B: Eliminativism (Russell/Field)**
  *   **Path:** Node 2 (No).
  *   **Profile:** You think causation is folk science. Useful for the gardener case pragmatically, but not fundamental.
  *   **Distortion:** This leaf catches anyone who rejects omissions *and* process. If you reject omissions but believe in fundamental causation, you are in an unoccupied, likely incoherent space (What is the relation if not process or dependence?).

  **Leaf C: Menzies–Price Agentialism**
  *   **Path:** Node 3 (Yes) + Node 4 (Sensitive).
  *   **Profile:** Causation is a secondary quality. It exists for us because we are agents.
  *   **Distortion:** If you answered "Yes" to Node 3 but "Invariant" to Node 4, you land in an **Unoccupied Leaf**. This view (Agent-dependent but Agent-invariant) is arguably incoherent. If causation depends on agency, it should vary with the agent's capacities.

  **Leaf D: Lewisian Counterfactualism**
  *   **Path:** Node 5 (No).
  *   **Profile:** You hold that counterfactual dependence is necessary. You likely rely on "quasi-dependence" or chains to handle preemption, but you refuse to sever the link to dependence entirely.
  *   **Distortion:** Many in our group claim this leaf but answer "Yes" to Node 5. If you say "Yes" to Node 5, you cannot be a pure Lewisian; you have moved toward SEM.

  **Leaf E: Unoccupied (Strict Reductionist)**
  *   **Path:** Node 6 (Yes).
  *   **Diagnosis:** **Unexplored/Incoherent.** Most interventionists (Woodward) admit the circularity is benign. Those who demand non-causal definitions of intervention usually abandon interventionism for Process theories (Leaf A). A theory demanding non-circular interventions but rejecting physical process is a ghost.

  **Leaf F: Unoccupied (Diagnostic Causal)**
  *   **Path:** Node 7 (Yes).
  *   **Diagnosis:** **Unattractive.** Allowing backtracking counterfactuals generally collapses the distinction between cause and effect (symmetry). If you accept backtracking, you likely don't care about causal directionality, pushing you toward Eliminativism or pure Bayesianism without causal structure.

  **Leaf G: Halpern–Pearl (SEM)**
  *   **Path:** Node 8 (Yes).
  *   **Profile:** You want a formal definition of *actual causation* using structural equations and contingencies.
  *   **Distortion:** See "The Woodward Problem" below.

  **Leaf H: Woodwardian Interventionism**
  *   **Path:** Node 8 (No).
  *   **Profile:** You care about *invariance* and explanation. You are skeptical that token causation can be formally defined without excessive context-dependence.
  *   **Distortion:** See "The Woodward Problem" below.

