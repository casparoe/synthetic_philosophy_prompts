      *   *Correction:* Many philosophers think DW *does* explain the form. I should take a stance. Let's argue that DW explains the form as a theorem of rationality + Hilbert space structure, while CS is vulnerable to the "counting" objection. So DW explains *why squared* (geometry), CS struggles to explain *why not counting*.
