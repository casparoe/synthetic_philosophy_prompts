          *   *Key Idea:* If you are rational, you must act *as if* the Born rule is true.

      *   **Carroll-Sebens (CS) - Self-Locating Uncertainty (SLU):**
          *   *Primitive:* Credences about self-location (which branch am I on?) during the period of uncertainty (post-split, pre-observation).
          *   *Derived:* The Born Rule weights as rational credences.
          *   *Amplitude's Role:* Enters via the "Epistemic Separability Principle" (ESP) or similar indifference principles modified by wavefunction structure. It argues that branch weight *is* the measure of existence relevant for indifference.
          *   *Key Idea:* You are uncertain where you are; rational indifference over indistinguishable situations weighted by amplitude gives the Born rule.

  3.  **Evaluate Against Criteria:**

