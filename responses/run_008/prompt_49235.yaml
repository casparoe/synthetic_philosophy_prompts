prompt: |-
  I'm on my school's student council and we vote next week on a proposal from the principal, and I have to write the opinion memo that gets circulated beforehand. Background: our school has always given out individual awards at the end of the year (top student per subject, valedictorian, that kind of thing). The principal wants to scrap most of them and switch to a house system — everyone sorted into a house that stays together all four years, houses earn points for basically everything (grades, attendance, volunteering, sports), and the big awards at the end of the year go to houses, not individuals. Points can also be *lost* for one person's screwup, so if someone skips class or gets detention their whole house pays. His argument is that right now the awards only go to kids who are already winning and everyone else just checks out, and that actually belonging to a group people would care more, try more, look out for each other. Some of us think it's basically making individuals sacrifice for a group they never chose to join, and punishing people for other people's behavior.

  Write the memo for me: recommend yes, no, or yes with changes, argue it seriously, and honestly deal with the strongest point on the other side rather than dunking on it. Don't just name-drop philosophers, the council will roll their eyes — but you can frame the deeper issue if it helps. If you go with yes-with-changes, the changes need to be specific things we could actually vote on. Also it's due Thursday so keep it to about a page.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Student Council Member.
      *   **Task:** Write an opinion memo to be circulated before a vote on a principal's proposal.
      *   **Proposal:** Scrap individual awards (valedictorian, subject awards) for a House System. Houses earn points for grades, attendance, volunteering, sports. Houses *lose* points for individual infractions (detention, skipping). Awards go to houses, not individuals.
      *   **Principal's Argument:** Current system only rewards already winning kids; others check out. House system fosters belonging, collective effort, looking out for each other.
      *   **Opposing Argument (Student Council concern):** Forced group membership, punishing individuals for others' behavior, sacrificing individuality for the group.
      *   **Requirements:**
          *   Recommend Yes, No, or Yes with Changes.
          *   Argue seriously.
          *   Honestly deal with the strongest point on the other side (steelman, don't strawman).
          *   No name-dropping philosophers (keep it grounded).
          *   If "Yes with Changes," changes must be specific/votable.
          *   Length: About a page (due Thursday).
          *   Tone: Professional, persuasive, student-led.

  2.  **Determine the Recommendation:**
      *   *Option A (No):* Easy to argue against punishment mechanics, but misses the chance to improve school culture. Might seem resistant to change.
      *   *Option B (Yes):* Hard to justify the punitive aspect of losing points for others' actions. Ignores valid student concerns.
      *   *Option C (Yes with Changes):* Best middle ground. Acknowledges the Principal's goal (community/belonging) but mitigates the unfairness (punitive measures, elimination of individual recognition). This allows for a nuanced argument that satisfies the prompt's requirement to deal honestly with the other side.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Principal's Case (Steelmanning):** Acknowledge why this is being proposed. The "checking out" problem is real. Individual awards *do* concentrate recognition on a small elite. The desire for belonging is valid.
      *   **The Core Concern (The "No" Side):** The punitive aspect (losing points for others' mistakes) is the biggest flaw. It creates resentment, not community. Also, completely removing individual recognition ignores personal effort.
      *   **The Recommendation (Yes with Changes):** Propose specific amendments.
          *   *Change 1:* No negative points for individual infractions (decouple discipline from house score).
          *   *Change 2:* Retain some individual awards (academic/specific achievement) alongside house awards.
          *   *Change 3:* House assignment input (maybe not choice, but some agency or balancing mechanism).
      *   **Closing:** Call to action for the vote.

  4.  **Refining the Argument (Philosophical undercurrent without name-dropping):**
      *   Instead of saying "Rawls says...", talk about "fairness" and "collective responsibility vs. individual accountability."
      *   Focus on the difference between *shared pride* and *shared blame*.
      *   Address the motivation aspect: Does punishment actually build community? Usually, it builds policing.

  5.  **Drafting - Content & Tone Check:**
      *   *Tone:* Respectful but firm. Not rebellious, but representative.
      *   *Length:* Keep it tight. A page is roughly 400-600 words.
      *   *Specific Changes:* Make sure they are actionable.
          *   1. Remove point deductions for disciplinary issues.
          *   2. Keep top academic awards (Valedictorian/Subject).
          *   3. House points only for positive contributions.

  6.  **Review against Constraints:**
      *   Recommend Yes/No/Yes+Changes? -> Yes+Changes.
      *   Argue seriously? -> Yes.
      *   Deal with strongest other point? -> Yes (the exclusivity of current awards).
      *   No philosopher name-dropping? -> Check.
      *   Specific changes? -> Check.
      *   About a page? -> Check.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm just protecting the high achievers. Frame the individual awards as "recognizing distinct effort" rather than "protecting the elite."
      *   *Correction:* Ensure the "punishment" critique is sharp. If my house loses points because *I* got detention, that's one thing. If my house loses points because *someone else* got detention, that's the real issue. The prompt says "if someone skips class... their whole house pays." This is the critical flaw.
      *   *Refinement:* Let's focus the changes on removing the punitive mechanism and preserving individual academic recognition.

  8.  **Final Output Generation** (similar to the provided good response).
      *   Header.
      *   Executive Summary.
      *   Analysis of Proposal.
      *   Proposed Amendments.
      *   Conclusion.

  *(Self-Correction on Length)*: A standard single-spaced page is about 500 words. I need to be concise.

  *(Self-Correction on Tone)*: Avoid slang. Keep it formal enough for a memo but authentic to a student leader.

  *(Final check on the "Strongest Point" requirement)*: I need to explicitly validate the Principal's point that the current system leaves many students feeling unrecognized. I can't just dismiss it.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Student Council
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Principal's House System Proposal

  **Recommendation:** Yes, with Specific Amendments

  **Overview**
  Next week we vote on the administration's proposal to replace individual end-of-year awards with a House System. Under the current plan, students are sorted into four-year houses that earn points for academics and activities but *lose* points for individual disciplinary infractions. While I support the shift toward community building, I recommend we vote **Yes** only if three specific amendments are adopted to address fairness and motivation.

  **The Case for Change**
  We must honestly acknowledge the Principal's strongest argument: the current awards system is exclusionary. Right now, end-of-year recognition is concentrated among a small group of high achievers. For many students, regardless of how much they improve or contribute behind the scenes, the end of the year feels like a ceremony where they are invisible. The Principal is right that this encourages disengagement. A house system offers a legitimate chance to foster belonging and collective pride, shifting the focus from "who is the best" to "how we support each other." If implemented well, this could improve school culture significantly.

  **The Core Concern**
  However, the current proposal contains a critical flaw: **punitive point deduction.** The plan allows houses to lose points when an individual member receives detention or skips class. This does not build community; it builds resentment.

  There is a fundamental difference between shared pride and shared blame. When a group succeeds together, cohesion grows. When a group is penalized for an individual's mistake—especially one unrelated to house activities—it creates pressure to police peers rather than support them. It punishes students for factors outside their control. If a student works hard all year but is grouped with peers who accumulate detentions, their effort is nullified. This replicates the inequity of the current system, just on a group level.

  Additionally, eliminating individual awards entirely ignores personal agency. Community matters, but individual excellence in academics and arts should still be recognized distinct from group performance.

  **Proposed Amendments**
  To make this proposal viable, I move we adopt the following conditions:

  1.  **No Negative Points:** Houses can earn points for positive contributions (grades, volunteering, sports), but points cannot be deducted for individual disciplinary infractions. Discipline should remain between the administration and the student, not the house.
  2.  **Hybrid Recognition:** The House Cup becomes the primary award, but individual academic awards (Valedictorian, Subject Awards) are retained. This ensures personal achievement is honored alongside community contribution.
  3.  **House Assignment Review:** A student representative must be included in the committee that determines house assignments to ensure balanced distribution of students, preventing "stacked" houses.

  **Conclusion**
  The goal of building a school where everyone feels they belong is worth pursuing. However, we cannot build community on a foundation of collective punishment. By removing punitive deductions and retaining individual academic recognition, we can support the Principal's vision while protecting student fairness. I urge the council to vote Yes, contingent on these amendments.
