  # JOINT STATEMENT ON THE COMPARISON AND RANKING OF HISTORICAL ATROCITIES
  **Prepared by the Adversarial Collaboration on Atrocity Metrics and Memory**
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  The undersigned scholars, representing distinct methodological traditions (quantitative demography and memory studies), submit the following points of consensus resulting from our adversarial collaboration. These claims establish the boundary conditions for future discourse.

  1.  **Distinction Between Comparison and Ranking:** We agree that *comparing* atrocities (analyzing pairwise relationships, shared mechanisms, or specific variables for a defined purpose) is analytically distinct from *ranking* atrocities (constructing a total, transitive order of "severity" or "evil" applicable across all contexts). Comparison is a tool of explanation; ranking is a tool of hierarchy.
  2.  **Legitimacy of Structural Comparison:** We agree that comparative historiography regarding the *mechanisms* (e.g., bureaucratic processes), *preconditions* (e.g., economic instability), and *aftermath* (e.g., intergenerational trauma) of atrocities is methodologically sound, ethically neutral, and essential for prevention science. Disagreement exists only regarding the aggregation of these variables into a singular metric of "severity."
  3.  **The Risk of Polemics:** We agree that abandoning rigorous analysis creates a vacuum. If scholars refuse to engage with data regarding scale and intent, the field is indeed ceded to bad-faith actors who will use numbers selectively to minimize specific sufferings. However, we also agree that engaging with data does not immunize one from bad-faith usage.
  4.  **Victim Non-Fungibility:** We agree that no metric can fully capture the subjective experience of suffering. Statistical aggregation must never be interpreted as implying that individual victims are interchangeable units. A "death" in a dataset represents a unique world extinguished, not a standardized count.
  5.  **Purpose-Relativity:** We agree that any ordering of atrocities is only valid relative to a specific question (e.g., "Which event required more logistical coordination?" vs. "Which event caused more long-term demographic collapse?"). A universal "Leaderboard of Suffering" is methodologically indefensible.

  ***

  ## II. RESIDUAL DISAGREEMENTS

  While we agree on the boundaries of analysis, we remain fundamentally divided on the ethics and ontology of measurement. The following table outlines our irreconcilable positions, phrased in the terminology each scholar finds most accurate.

  | Crux | The Comparativist Position (Demography) | The Particularist Position (Memory Studies) |
  | :--- | :--- | :--- |
  | **1. The Nature of Quantification** | **Descriptive Neutrality:** Quantification is a passive mirror. Numbers describe reality without altering it. Refusing to count is an act of obfuscation that hinders justice and resource allocation. | **Performative Action:** Quantification is an active intervention. To count is to categorize, and to categorize is to alter the social meaning of the event. Counting inevitably privileges countable harms (death) over uncountable harms (dignity, culture). |
  | **2. Commensurability of Harm** | **Unified Metric:** Diverse harms (killing, enslavement, assimilation) can be translated into a common currency (e.g., "Years of Life Lost" or "Suffering Units") to allow for policy prioritization. Without a common metric, prevention is arbitrary. | **Incommensurability:** Radical evils are categorical, not scalar. Forced assimilation is not a "lesser" or "greater" version of mass killing; it is a *different* ontological crime. Mapping them onto one scale distorts the specific nature of the violence. |
  | **3. Ordinality and Hierarchy** | **Defensible Ordering:** Rough, purpose-relative orderings (e.g., "Event A was more intensive than Event B regarding X") are honest and necessary. We can defend ordinality if we acknowledge confidence intervals and margin of error. | **Structural Obscenity:** Any ordinality implies a competition where one group's grief supersedes another's. Even "rough" orderings function rhetorically to silence those ranked "lower." There is no ethical way to say one tragedy is "more" than another. |

  ***

  ## III. TEST CASES AND PREDICTIONS

  To move beyond theoretical stalemate, we propose three concrete tests. We record our predictions here to be evaluated against future historical or sociological outcomes.

  ### Crux 1: Quantification (Descriptive vs. Performative)
  *   **Test Case:** The release of revised demographic data regarding the **Holodomor (1932–33)**. Suppose new archival evidence revises the death toll significantly *downward* (e.g., from 4 million to 2.5 million), while confirming the intentionality remains high.
  *   **Comparativist Prediction:** Accurate data will stabilize historical understanding. Denialist arguments will lose traction because the data is robust, even if lower. The *intent* remains the primary marker of genocide, not just the raw count.
  *   **Particularist Prediction:** The revision will be weaponized by bad-faith actors to claim the event "matters less" than previously thought. The *number* will overwrite the *intent* in public memory, resulting in a net decrease in recognition and reparative justice, regardless of the archival accuracy.

  ### Crux 2: Commensurability (Unified Metric vs. Incommensurability)
  *   **Test Case:** A Truth and Reconciliation Commission tasked with allocating reparations between survivors of **immediate mass execution** (e.g., Srebrenica) and survivors of **multi-generational forced assimilation** (e.g., Indigenous Residential Schools). The Commission adopts a "Disability-Adjusted Life Year" (DALY) model to equate the harms.
  *   **Comparativist Prediction:** The DALY model will allow for a fair, transparent distribution of limited funds. It will prevent political lobbying from dictating payouts and ensure that "silent" long-term trauma is quantified and compensated alongside immediate death.
  *   **Particularist Prediction:** The DALY model will systematically undervalue cultural destruction. Because assimilation survivors often remain alive, their "life years lost" will calculate lower than the dead, rendering cultural genocide a "secondary" crime financially. This will incite conflict between victim groups rather than resolving it.

  ### Crux 3: Ordinality (Defensible Ordering vs. Structural Obscenity)
  *   **Test Case:** A museum exhibit titled **"Scales of Violence"** that places the **Transatlantic Slave Trade** and the **Holocaust** on a timeline with visual bars representing "Total Excess Mortality."
  *   **Comparativist Prediction:** Visitors will gain a clearer understanding of the industrial capacity required for different atrocities. This contextualization will enhance empathy by showing the vast scope of anti-human violence over centuries, fostering a "never again" coalition.
  *   **Particularist Prediction:** Visitors will instinctively compare the bar lengths to determine "who suffered more." The group with the shorter bar will feel minimized; the group with the longer bar will feel their suffering is being used as a blunt instrument. The exhibit will generate inter-group hostility rather than shared mourning.

  ***

  ## IV. CONCLUSION ON THE NATURE OF THE DISPUTE

  In concluding this collaboration, we identify a **partially verbal dispute** regarding the definition of "ranking," though this rests upon a **substantive ethical disagreement.**

  **The Verbal Component:**
  We often talk past one another regarding the word "ranking."
  *   The **Comparativist** uses "ranking" to mean *ordinal classification for specific analytical ends* (e.g., "Ranking regions by risk level to prioritize aid").
  *   The **Particularist** uses "ranking" to mean *moral hierarchization of victimhood* (e.g., "Ranking victims by worthiness of grief").
  If the Comparativist agrees to abandon the term "ranking" in public discourse in favor of "contextual ordering for specific variables," some friction dissolves.

  **The Substantive Component:**
  However, the dispute is not *merely* verbal. It rests on a genuine disagreement about the **performative power of language and math.**
  *   The Comparativist believes that if they clarify their definitions (the verbal fix), the data will be received neutrally.
  *   The Particularist believes that the act of measurement *itself* creates the hierarchy, regardless of the definitions used (the substantive fix).

  Therefore, while we can align our terminology, we cannot align our expectations of how the public will receive that terminology. The Comparativist trusts the clarity of the method; the Particularist distrusts the reception of the message. We agree to disagree on whether the risk of misappropriation justifies the silence of non-comparison.

  **Signed,**

  *Dr. Aris Thorne (Comparativist)*
  *Dr. Elena Vaskov (Particularist)*
