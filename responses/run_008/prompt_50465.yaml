answer: |-
  You have put your finger on the central methodological engine of analytic philosophy, specifically within metaphysics and ethics. The tension you describe—between the literary construction of a scenario and the logical weight placed upon the reader's reaction to it—is the subject of a vigorous, decades-long debate.

  There are established terms for the practices you describe, though the specific *division of labor* you want to isolate (where the narrative bears the evidential weight and the argument merely collects it) is often discussed rather than named.

  Here is the taxonomy of the move you are seeing, the counter-move, and a proposed coinage for the specific structural arrangement you've identified.

  ### 1. The Proponent's Move: *The Method of Cases* (and *The Intuition Pump*)

  The formal name for the practice of using hypothetical scenarios to test philosophical claims is **The Method of Cases**.

  When a philosopher presents a "tiny story" (a surgeon, an island, a machine) to test a definition (e.g., "What is knowledge?" or "What is personal identity?"), they are constructing a *case*. The reader's reaction to that case is treated as **data**. If the reader says, "No, that person isn't really the same person after the transplant," that intuition is taken as evidence that the theory of personal identity must be adjusted to exclude that case.

  However, the term that best captures the *literary craft* you noticed—the loading of details to ensure a specific reaction—is **The Intuition Pump**.

  Coined (and popularized) by Daniel Dennett, this term acknowledges that these scenarios are tools designed to "pump" a specific intuition out of the audience. Dennett uses the term somewhat pejoratively to warn against over-loaded scenarios, but he admits that all philosophy relies on them to some degree.
  *   **The Division of Labor:** In an intuition pump, the narrative does the epistemic work. The argument following it is merely the **harvest**.
  *   **Key Proponents:** David Chalmers (Philosophical Zombies), Judith Jarvis Thomson (The Violinist), Robert Nozick (The Experience Machine).
  *   **Why it fits your description:** It admits that the scenario is "rigged" (constructed) but claims the resulting intuition is nonetheless valid evidence.

  ### 2. The Objector's Move: *The Framing Effect* (and *The Debunking Explanation*)

  The objection you describe—that the reaction is worthless because the scenario was staged—has moved from a philosophical hunch to an empirical critique.

  In the early 2000s, a movement called **Experimental Philosophy (X-Phi)** emerged (led by figures like Stephen Stich, Joshua Knobe, and Jonathan Weinberg). They argued that the "intuitions" mined by the Method of Cases are not stable truths about concepts or the world, but are highly sensitive to **Framing Effects**.

  If you change the order of the questions, the gender of the protagonist, or the emotional valence of the "scene," the intuition flips. Therefore, the objection goes, the intuition is evidence only of the *storyteller's skill*, not the *thesis's truth*.

  The specific philosophical counter-move is called a **Debunking Explanation**.
  *   **The Move:** You do not argue against the conclusion directly. Instead, you provide a causal explanation for why the opponent *has* that intuition (e.g., "You feel this is wrong because the story used the word 'surgeon' which triggers authority bias, not because it violates moral law").
  *   **The Claim:** The method is **self-undermining** because the evidential source (the intuition) is contaminated by the method of extraction (the narrative framing).

  ### 3. Coining the Division of Labor: *The Affective Warrant*

  You asked for a name for the specific arrangement where the hypothetical carries the evidential burden and the argument harvests the response. While "Method of Cases" names the practice, it doesn't name the *structural reliance on the feeling*.

  I propose the term **The Affective Warrant**.

  In logic, a **warrant** is the bridge that allows you to move from Data (the scenario) to a Claim (the thesis). Usually, a warrant is a rule of inference (e.g., "All men are mortal"). In the philosophical move you are describing, the warrant is *affective*.
  *   **The Structure:**
      1.  **Data:** The crafted scene (The Machine).
      2.  **Warrant:** The reader's visceral reaction (Revulsion/Certainty).
      3.  **Claim:** The philosophical thesis (Utilitarianism is false).
  *   **Why this distinguishes it:**
      *   **Vs. Analogy:** An analogy argues that *because* A is like B, what is true of A is true of B. The Affective Warrant argues that *because* you feel X about A, Y is true about the world.
      *   **Vs. Illustration:** An illustration follows a thesis to make it clear. The Affective Warrant *precedes* the thesis to make it possible.
      *   **Vs. Fiction:** Fiction solicits emotion for aesthetic experience. The Affective Warrant solicits emotion for *truth-apt justification*.

  This term captures your insight that the "feeling is presented as the verdict." The emotion is not a byproduct; it is the logical glue.

  ### 4. The Ontological Question: What is the Evidence Of?

  You asked whether the reaction counts as evidence about the actual world, our concepts, or the storyteller. This is the fault line where the philosophers fight.

  **A. The Conceptual Analysis View (Traditional)**
  *   **Proponents:** Frank Jackson, early analytic philosophers.
  *   **Claim:** The intuition is evidence about **our concepts**. The story tests the boundaries of the word "knowledge" or "person." If the intuition says "That's not knowledge," it reveals the rules of our linguistic community.
  *   **Weakness:** It makes philosophy a branch of lexicography or anthropology.

  **B. The Modal Realist View (The "World" View)**
  *   **Proponents:** David Lewis, Timothy Williamson.
  *   **Claim:** The intuition is evidence about **metaphysical possibility**. Williamson argues (in *The Philosophy of Philosophy*) that these aren't just feelings; they are judgments of counterfactual conditionals. We are evaluating what *could* happen, not just how we speak.
  *   **Weakness:** It assumes human imagination is a reliable guide to metaphysical reality.

  **C. The Psychological View (The X-Phi Critique)**
  *   **Proponents:** Stephen Stich, Hilary Kornblith.
  *   **Claim:** The intuition is evidence only about **the storyteller and the subject**. It reveals our cognitive biases, cultural conditioning, and evolutionary heuristics. It proves nothing about the external world or abstract concepts.
  *   **Weakness:** If taken to its extreme, it undermines the objector's own ability to argue against the proponent (since their objection relies on their own intuitions about evidence).

  ### Summary for the Writer

  You are observing **The Method of Cases** driven by **Intuition Pumps**, where the logical validity rests on **The Affective Warrant**.

  *   **The Proponent** claims the scene reveals **Modal Facts** (how the world must be).
  *   **The Objector** claims the scene reveals **Framing Effects** (how the mind is rigged).

  The reason you feel a kinship with this trade is that philosophers, like novelists, know that abstract principles rarely move people. To make a truth claim stick, you must first build a room, put a body in it, and make the reader smell the antiseptic. The philosopher calls this "analysis"; you call it "scene-work." The debate is whether that smell is a clue to the universe, or just a trick of the lighting.
