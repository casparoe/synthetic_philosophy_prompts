prompt: |-
  I keep running into a distinction that must have a name, but I can't find it because I don't know what to search for. I'm a small-animal veterinarian who writes the anatomy entries for a clinical reference, and the word "function" seems to carry two different readings that agree in the textbook cases and come apart everywhere else. On one reading, the answer is historical: the heart is for pumping blood because pumping by ancestral hearts is why descendants have hearts at all. On the other, the answer is current: the heart is for circulating blood because circulating blood is what it does now to keep the organism alive. The readings diverge in at least four ways I've noticed. (1) A beneficial mutation that appears today has no history of contribution, so on the historical reading it seems to have no function yet, even though it is currently doing all the work. (2) Feathers were plausibly favored first for insulation and only later became load-bearing for flight, so the two readings give different answers to what feathers are for, and differ again about a vestigial structure with a long history and no present contribution. (3) A heart murmur is exactly what the cardiologist's diagnostic procedure depends on the heart contributing, and I would never write that the heart's function is to make that noise — but I can't explain my refusal without saying "function relative to whom," which seems to give the game away. (4) When we write that an organ is "functioning normally," the dysplastic hips of a breed whose extreme conformation was deliberately selected for are the historical reading's nightmare: they were literally selected for, yet we file them as malfunction. I'm told philosophers of biology have had this fight, but I don't want just the stock terms — I need to know what exactly each reading is committed to, where each one breaks (especially on malfunction and on traits whose useful effect is new), and which reading, if either, a clinical reference should standardize on. If the two readings I've described actually conceal a third or fourth, I'd want to hear about that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Small-animal veterinarian writing anatomy entries for a clinical reference.
      *   **Problem:** Distinguishing between two concepts of "function" that usually align but diverge in edge cases.
      *   **The Two Readings:**
          1.  *Historical/Etiological:* Function is defined by evolutionary history (why it was selected).
          2.  *Current/Causal Role:* Function is defined by current contribution to the system's survival/goals.
      *   **Specific Divergences Noted:**
          1.  New beneficial mutations (no history yet).
          2.  Exaptation (feathers: insulation vs. flight) & Vestigiality (history but no current use).
          3.  Side effects (heart murmur: causal contribution but not a "function").
          4.  Breed-specific pathology (dysplastic hips: selected for by humans, but clinically "malfunctional").
      *   **Goal:** Needs the philosophical terminology, a breakdown of commitments/breaking points for each, and advice on which to standardize for a *clinical reference*.
      *   **Constraint:** "I don't want just the stock terms" (needs depth, not just labels).

  2.  **Identify the Philosophical Framework:**
      *   The distinction is classic Philosophy of Biology.
      *   Reading 1 (Historical) = **Etiological Theory of Function** (often associated with Larry Wright, Ruth Millikan, Karen Neander).
      *   Reading 2 (Current) = **Causal Role Theory of Function** (often associated with Robert Cummins).
      *   The "Heart Murmur" problem is the classic "Tober's Law" or "Effect vs. Function" problem.
      *   The "Dysplastic Hips" problem touches on **Normativity** and **Reference Class** (species vs. breed vs. individual).
      *   There is indeed a third/fourth reading often discussed: **Goal-Contribution** (Boorse's Biostatistical Theory) or **Selected Effects** refined.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate that this is a known, deep philosophical problem (the "Function Debate"). Give the names immediately but promise to go deeper.
          *   Names: *Selected Effects (Etiological)* vs. *Causal Role (Systemic)*.

      *   **Deconstruct Reading 1: The Historical View (Selected Effects/Etiological):**
          *   *Core Commitment:* Function = The effect for which the trait was naturally selected.
          *   *Strengths:* Handles normativity well (defines "malfunction" as failure to do the historical job). Explains why a heart *should* pump even if it's currently stopped.
          *   *Weaknesses (User's points):*
              *   *New Mutations:* Can't account for immediate utility (the "Wait-and-See" problem).
              *   *Exaptation:* Feathers for insulation vs. flight. (Solution: Co-opted function vs. original function).
              *   *Vestigial:* Appendix. Has history, no function.
              *   *Artificial Selection:* The Dysplastic Hip problem. If humans selected it, is it a function? (Crucial for a vet).
          *   *Verdict:* Good for defining "healthy species-typical," bad for novel traits or artificial breeds.

      *   **Deconstruct Reading 2: The Current View (Causal Role/Systemic):**
          *   *Core Commitment:* Function = The causal contribution a trait makes to a containing system's capacity.
          *   *Strengths:* Handles new mutations immediately. Handles exaptation (feathers *now* contribute to flight).
          *   *Weaknesses (User's points):*
              *   *The Heart Murmur:* A murmur contributes to the cardiologist's diagnosis. Is that a function? (Cummins says "relative to an analytical goal," but this feels too permissive for medicine).
              *   *Vestigial:* If it does nothing, it has no function (agrees with intuition).
              *   *Malfunction:* Harder to define. If the hip *does* support weight (even if painfully), is it functioning?
          *   *Verdict:* Good for physiology and immediate clinical picture, bad for distinguishing pathology from normal variation.

      *   **Address the Specific Divergences (The "Four Ways"):**
          *   *1. New Mutations:* Etiological says "none yet." Causal Role says "yes." *Clinical implication:* Treat based on current effect, not history.
          *   *2. Feathers/Vestigial:* Etiological distinguishes "original function" from "current utility." Causal Role just looks at current utility. *Clinical implication:* Vestigial organs (e.g., dewclaws) might be "functional" in Causal Role if they provide traction, but "vestigial" in Etiological.
          *   *3. Heart Murmur:* This is the **Cummins vs. Boorse** clash. A murmur is a *capacity* of the heart, but not a *function* because it doesn't contribute to the *organism's* survival goal, only the *doctor's* diagnostic goal. Need to introduce **Reference Class**.
          *   *4. Dysplastic Hips:* This is the killer for the Etiological view in veterinary medicine. Artificial selection muddies "Natural Selection." If we define function by *breed standard*, dysplastic hips are "functional" for the breed ideal (sadly). If we define by *species health*, they are malfunction.

      *   **Introduce the Third/Fourth Options:**
          *   **Biostatistical Theory (BST) - Christopher Boorse:** This is crucial for medicine. Function = Statistical typicality within a reference class (age, sex, species) that contributes to survival/reproduction.
          *   *Why it matters:* It solves the "Murmur" problem (not statistically typical contribution to survival) and the "Dysplastic Hip" problem (if the reference class is "healthy dogs" not "Show Pugs").
          *   **Goal-Contribution:** Similar to Causal Role but restricted to the organism's goals, not the observer's.

      *   **Recommendation for the Clinical Reference:**
          *   *Context:* Veterinary medicine is normative. We need to say what *ought* to be.
          *   *Problem with Pure Etiological:* Artificial selection breaks it.
          *   *Problem with Pure Causal:* Makes pathology sound functional (murmurs).
          *   *The Solution:* A **Hybrid Approach** leaning on **Boorse's Biostatistical Theory**.
          *   *Strategy:* Define "Normal Function" statistically (species-typical contribution to health). Define "Clinical Function" causally (what is it doing right now?).
          *   *Specific Advice:* Use "Function" for the evolutionary/physiological norm (Etiological/BST). Use "Role" or "Effect" for causal contributions (including murmurs). Address breed standards explicitly as distinct from biological health.

  4.  **Refining the Tone:**
      *   Respect the user's expertise (they know the biology, need the philosophy).
      *   Avoid overly dense jargon without explanation.
      *   Ensure the "Dysplastic Hip" point gets special attention because it's unique to veterinary (vs. human) medicine.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain why the murmur isn't a function in Causal Role? *Correction:* In strict Cummins Causal Role, it *is* a function relative to the diagnostic system. I need to emphasize that the *system boundary* must be the organism, not the clinic, to avoid this.
      *   *Check:* Did I address the "New Mutation" issue? *Yes,* Etiological fails here.
      *   *Check:* Is the distinction between "Selected Effects" and "Biostatistical" clear? *Need to ensure:* Selected Effects is about *history*, Biostatistical is about *current statistics* of design. Boorse is usually better for medicine.
      *   *Check:* The user asked "which reading... should standardize on." I need to be decisive.

  6.  **Final Polish:** Organize with clear headings. Ensure the four specific points are addressed. Add a specific "Writing Strategy" section. (Proceed to generate output).

  *(Self-Correction on the "Dysplastic Hip" point)*: I need to be careful. If a breed is selected for dysplasia (e.g., some extreme brachycephalic or chondrodystrophic traits), the *Etiological* view (selection history) actually says this *is* the function/trait. But the *Medical* view says it's a disease. This highlights why Pure Etiological fails in Vet Med. I must emphasize **Reference Class** (Species vs. Breed).

  7.  **Final Plan:**
      *   Name the theories (Selected Effects vs. Causal Role).
      *   Analyze the 4 divergences through these lenses.
      *   Introduce Boorse's Biostatistical Theory (The Medical Standard).
      *   Address the Vet-specific issue (Artificial Selection).
      *   Provide concrete writing recommendations.

