      *   *Key Insight:* The "sandbagging" worry is fundamentally about *latent capacity*. Behaviorism traditionally rejects latent capacity (Ryle's ghost in the machine), but modern ML *is* all about latent space. So a "Latent Behaviorism" might be the accurate term.

