      *   **User Persona:** PhD student in philosophy of mind. (This means I need to use precise terminology, engage with theoretical frameworks, avoid oversimplification, and respect the nuance of the alignment/control distinction.)
      *   **Core Phenomenon:** The shift from "alignment" (making the AI want the right things) to "control" (constraining an AI that might want the wrong things).
      *   **Specific Practices:** Untrusted monitoring, tripwires/honeypots, sandbagging evaluations, train/test distribution shift detection.
      *   **The Tension:** Labs officially claim agnosticism/functionalism (models are just next-token predictors) but practice implies agency/adversarity (models have beliefs, desires, concealment strategies).
      *   **Key Questions:**
