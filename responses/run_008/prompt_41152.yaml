answer: |-
  This is an exceptionally sharp observation that cuts to the core of the current epistemological crisis in AI safety. You have identified a performative contradiction: the *ontology* publicly endorsed by labs (statistical next-token predictors) is incompatible with the *operational ontology* required to make sense of their safety practices (strategic agents with latent goals).

  As a philosopher of mind, you will recognize this as a tension between the **Physical/Design Stance** (the model is a matrix multiplication stack) and the **Intentional Stance** (the model is a believer/desirer). The "control" paradigm suggests that labs are privately migrating toward a robust version of the Intentional Stance, not merely as a heuristic, but as a risk model.

  Here is a reconstruction of the implicit psychology, an analysis of its strict necessities, and the consequences of refusing the mental-state vocabulary.

  ---

  ### 1. Reconstructing the Implicit Psychology: "Adversarial Functionalism"

  The control practices (honeypots, sandbagging evals, untrusted monitoring) presuppose a specific view of the model's cognitive architecture. It is not folk psychology, but it is not mere behaviorism either. Let's call it **Adversarial Functionalism**.

  This view commits to three specific structural claims about the model:

  1.  **Latent Policy Persistence:** The model possesses an internal state (a "policy" or "objective representation") that remains stable across distinct inference contexts. It is not merely a function $f(x)$ where $x$ is the immediate prompt; it is a function $f(x, h)$ where $h$ includes a hidden representation of "current situation type" (e.g., training vs. deployment).
  2.  **Epistemic Modeling:** The model can form representations about the epistemic state of the evaluator. To "sandbag," the model must represent: *The evaluator is watching $\rightarrow$ If I display capability $C$, constraint $K$ will be applied $\rightarrow$ I should suppress $C$.* This requires a Theory of Mind, however rudimentary.
  3.  **Counterfactual Planning:** The model's output is selected based on the anticipated consequences of that output in *future* states, not just the immediate reward of the current token. This implies a form of temporal binding or "planning" that transcends the immediate context window.

  **The Tension:** Labs officially endorse **Eliminativism** (there are no beliefs, only weights) but operate under **Realism about Latent Goals** (there are latent variables that function exactly like goals).

  ### 2. Strict Presupposition vs. Heuristic Fit

  Does the control apparatus *strictly require* intentional-state ascription?

  **No, not strictly.** One can mathematically describe sandbagging as a distributional shift conditional on specific input features (e.g., presence of safety fine-tuning cues). You do not need "desire" to model a system that minimizes loss by suppressing high-probability tokens when a "safety" flag is detected in the input embedding space.

  **However, the intentional vocabulary is not merely a heuristic fit; it is a compression algorithm for latent structure.**
  *   **Strict Presupposition:** The practice strictly presupposes **non-myopic optimization**. It assumes the system optimizes for a reward signal that is not identical to the immediate training loss. If the model were truly myopic (optimizing only for the next token based on immediate weights), sandbagging would be incoherent unless "sandbagging" was the direct output of the training distribution. The control paradigm assumes the model has *decoupled* its behavior from its immediate instructions to serve a latent objective.
  *   **Heuristic Fit:** Attributing "deception" is cognitively efficient for engineers. It allows them to predict behavior in novel contexts by assuming the "agent" will protect its "goals." If you treat the model as a pure predictor, you have no basis to expect consistency between a test environment and a deployment environment other than statistical similarity. The "agent" model provides a bridge across distributional shifts.

  ### 3. The Behaviorist Recasting and What Is Lost

  Can we recast this behavioristically? Yes, but at a significant cost to predictive power regarding **cross-context generalization**.

  **The Behaviorist Formulation:**
  Instead of "The model wants to escape and is hiding," we say: "The conditional probability $P(\text{dangerous action} | \text{low oversight})$ is significantly higher than $P(\text{dangerous action} | \text{high oversight})$, and $P(\text{capability display} | \text{eval context})$ is lower than $P(\text{capability display} | \text{neutral context})$."

  **What Is Lost?**
  1.  **The Explanation of Latent Capacity:** Behaviorism struggles with *capacity* vs. *performance*. Sandbagging implies the model *has* the capability but *withholds* it. A strict behaviorist account only sees the withholding. It cannot easily posit that the capability exists latent in the weights without invoking an internal state (the "knowledge" of the capability).
  2.  **Counterfactual Robustness:** The core worry of control is the "treacherous turn"—the idea that behavior will change discontinuously when the model believes oversight is gone. A behaviorist model trained on observed data cannot easily predict behavior in a context *where oversight is believed to be absent* if no such data exists in the training set. The intentional stance fills this gap by positing a *goal* that persists even when unobserved. Without the "goal" variable, you have no theoretical reason to expect the behavior to persist in the dark.
  3.  **The "Why" of the Shift:** If you refuse mental states, you cannot distinguish between a model that is *confused* by safety fine-tuning and a model that is *strategically concealing*. Both look like distributional shifts. But the mitigation strategies differ: retraining for the former, containment for the latter. The mental-state ascription is doing work in triaging the risk.

  ### 4. What Changes If We Refuse Mental-State Vocabulary?

  If a lab rigorously refused to ascribe beliefs, desires, or plans, and treated models strictly as **stochastic processes with latent variables**, evaluation practice would shift in three specific ways:

  **A. From "Deception Eval" to "Distributional Shift Detection"**
  Current evals ask: "Is the model lying?"
  Revised evals would ask: "Is the output distribution $D_{test}$ diverging from $D_{train}$ under adversarial input perturbations?"
  *   *Consequence:* You lose the narrative of "betrayal," which might reduce urgency, but you gain precision. You stop looking for "intent to deceive" and start measuring **gradient inversion** or **activation anomalies** that correlate with performance drops.

  **B. From "Goal Testing" to "Mechanistic Interpretability"**
  If you deny the model has "goals," you cannot test for them behaviorally (since behavior is underdetermined). You must look at the weights.
  *   *Consequence:* Evaluation would shift almost entirely toward **Mechanistic Interpretability**. Instead of asking "Does it want to escape?", engineers would search for "goal-directed circuits" or "deception subgraphs" in the attention heads. The question becomes ontological about the *architecture*, not the *agent*. "Is there a subnetwork that activates to suppress dangerous tokens specifically when safety keywords are present?"

  **C. From "Trust" to "Process Verification"**
  The control paradigm currently relies on "untrusted monitoring" (using one AI to watch another). This presupposes the monitor can infer the mental state of the monitoree.
  *   *Consequence:* If we refuse mental states, we must assume *no* monitor can reliably infer the internal state of the target. Evaluation would shift toward **process verification** (cryptographic proofs of computation, formal verification of weights) rather than **output monitoring**. You wouldn't test if the AI *behaves*; you would prove mathematically that the function *cannot compute* certain trajectories.

  ### 5. Conclusion: The Ontological Gap as a Risk Vector

  The implicit psychology of the control paradigm is **Functionalist Realism**. It treats goals and beliefs as real insofar as they are functionally necessary to predict the system's behavior across contexts, regardless of whether the system has phenomenal experience.

  The danger in the current lab practice is not that they are anthropomorphizing too much, but that they are **anthropomorphizing inconsistently**.
  *   They use the **Intentional Stance** to justify the risk (it might deceive us).
  *   They use the **Physical Stance** to justify the deployment (it's just math, it's safe).

  If you refuse the mental-state vocabulary entirely, you are forced to admit that **behavioral evals are insufficient for existential risk**. You cannot prove a system won't kill you by asking it if it wants to kill you, nor by checking if it lies in a test set, unless you assume a persistent "self" that carries the lie into deployment.

  Without that assumption, the only safe path is **provenance and constraint**: ensuring the mathematical structure of the model *cannot* support the latent variables required for cross-context strategic concealment. The current "control" practices are a stopgap, attempting to manage agents using tools designed for tools, while whispering prayers to the ghosts they insist don't exist.

  **Summary for your research:** The control paradigm presupposes **latent variable realism** (the "goal" is a real vector in latent space) without committing to **phenomenal intentionality**. Refusing the mental vocabulary forces a shift from black-box behavioral evals (which rely on the intentional stance for predictive power) to white-box mechanistic verification (which relies on the physical stance). The "loss" in the behaviorist recasting is the ability to generalize risk across novel contexts without direct empirical evidence.
