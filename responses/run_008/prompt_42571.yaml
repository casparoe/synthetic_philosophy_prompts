      *(Refining the "Split Case")*: I need a concrete example. Maybe the 2008 Global Food Crisis? Or a hypothetical. Let's use a hypothetical involving global market spikes + weak state.

      *(Refining the Sen Critique)*: The strongest critique is the "First Cause" problem. If climate change is the root, is it political? Yes, but diffusely. The editor wants a *proximate* cause. Sen looks at *entitlement failure*. If the drought is so bad no entitlement system could save them without massive external intervention, "Natural" gains weight.

