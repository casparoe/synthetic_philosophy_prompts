prompt: |-
  I cover science and ideas at a mid-size news outlet, and at our shop the framing of famine stories — is it a natural disaster or something people did — gets decided by my editor, who's been there forever and has strong veiws. His record, from what we've actually run:

  - The Irish famine of the 1840s: man-made, full stop. We ran it as a policy crime by Westminster, food leaving the country on ships while people starved. He genuinely gets angry about this one.
  - Bengal 1943: same call. Churchill's war cabinet, the denial policies, hoarding — we treated it as a political story, not a weather story.
  - The Great Leap Forward: man-made, obviously — requisition, grain exports while millions died, officials lying about yields.
  - Somalia and the Horn of Africa in 2011: natural disaster. We went with the worst-drought-in-decades framing, basically treated it like an earthquake with a slow aid response attached.

  Now the story on my desk is the famine in southern Madagascar, the one that's been going since 2021 — years of drought, people eating cactus and wild leaves, and the WFP pushing the line that this one is driven by climate change rather than war. No conflict to speak of, no Churchill, no Mao, no one obvious to point a finger at. But from what I can tell there was food in the country that the affected people simply couldn't afford once their crops and livestock and livelihoods went. My editor is leaning natural disaster, climate story, and honestly part of me agrees, since nobody in particular did this to anyone. But I've read enough Amartya Sen to suspect the word natural is doing a LOT of work in that headline.

  So: predict how he'll rule, but more importantly, what rule is he actually running? Because at least two fit his track record — something like the food test (if there was food around while people starved, and they starved because they lost the means to get it, that's political) and something like the named-villain test (if you can point at the government that did it, it's a crime, otherwise it's a tragedy). Spell out what each rule predicts about Madagascar, give me your best guess at his verdict with reasons, and tell me what kind of case would split the two rules apart — a famine that comes out political on one and natural on the other. And since I'll be arguing with him either way: be honest about the weakest point in my Sen-inflected view. If the drought really did wipe out the food and nobody was hoarding or exporting anything, is natural disaster actually the right call, or is that exactly the framing Sen spent his career trying to bury?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Science and ideas journalist at a mid-size news outlet.
      *   **Task:** Predict an editor's decision on framing a story about the Southern Madagascar famine (2021-present), analyze the editor's underlying decision rules, identify where those rules diverge, and critique the user's own perspective (Amartya Sen's entitlement approach).
      *   **Editor's Profile:** Long-tenured, strong views, specific track record on famine framing.
      *   **Track Record:**
          *   Irish Famine (1840s): Man-made (Policy crime, food exports).
          *   Bengal (1943): Man-made (Churchill, denial policies).
          *   Great Leap Forward (China): Man-made (Requisition, lying officials).
          *   Somalia/Horn of Africa (2011): Natural Disaster (Drought, slow aid).
      *   **Current Story:** Southern Madagascar (2021+). Drought, climate change narrative (WFP), no conflict, food existed but was unaffordable/inaccessible due to livelihood loss.
      *   **Editor's Lean:** Natural disaster/Climate story.
      *   **User's Lean:** Suspects "natural" is doing too much work (Sen's entitlement theory).

  2.  **Deconstruct the Editor's Decision Rules:**
      *   *Observation 1 (The "Food Test" / Entitlement Failure):* In Ireland, Bengal, and GLF, food existed but people couldn't access it due to policy. In Somalia, the assumption is food *didn't* exist locally due to drought (though this is debatable, it's the common narrative).
      *   *Observation 2 (The "Named Villain" / Agency Test):* Ireland (Westminster), Bengal (Churchill), GLF (Mao/CCP) all have specific human agents with power who made choices. Somalia (2011) involved Al-Shabaab blocking aid *and* drought, but the editor framed it as natural. Why? Maybe because the "villain" wasn't a recognized state actor in the same way, or the drought was so severe it overwhelmed the agency argument.
      *   *Hypothesis:* The editor uses a hybrid rule, but the "Named Villain" test seems stronger given the Somalia exception. If there's a specific government actively harming people, it's man-made. If it's structural neglect + climate shock without a clear "evil decree," it's natural.

  3.  **Predict the Editor's Verdict:**
      *   **Prediction:** He will rule "Natural Disaster / Climate Crisis."
      *   **Reasons:**
          *   No clear "Villain": No Churchill, no Mao, no Westminster. The Madagascar government is weak, not actively malicious.
          *   Climate Hook: WFP is pushing climate change. This fits the "Science and Ideas" beat well.
          *   Somalia Precedent: 2011 Horn of Africa is the closest analog (drought + instability). He called that natural.
          *   Simplicity: "Climate Change caused famine" is a cleaner narrative for a general audience than "Global economic structures + local governance failure + drought."

  4.  **Analyze the Divergence (The "Split Case"):**
      *   *Rule A (Sen/Entitlement):* If food existed and people starved due to price shock/loss of income = Political/Man-made.
      *   *Rule B (Editor's Villain/Agency):* If a specific powerful actor made a choice to let them starve when they could have stopped it = Political/Man-made.
      *   *The Split Case:* A scenario where food is available, prices spike due to global market forces (not a specific government decree), and a weak government fails to intervene.
          *   *Sen says:* Political (failure of entitlement protection).
          *   *Editor says:* Natural/Tragic (no specific villain, just market forces + weather).
      *   *Example:* A drought in a democratic country with free markets where food prices spike, the government *could* subsidize but chooses austerity instead, but didn't explicitly *export* food during the crisis. Or, a scenario where global inflation drives up food prices locally, causing starvation without a specific "export ban" or "requisition" order.

  5.  **Critique the User's Sen-Inflected View (The "Weakest Point"):**
      *   *Sen's Core Argument:* Famines rarely happen without a drop in entitlement, not necessarily a drop in food availability (FAD - Food Availability Decline).
      *   *The Weakness:* In extreme climate events (like the "Kere" in Madagascar), the *physical* absence of food *is* the primary driver. If nothing grows for 4 years, entitlement theory hits a limit. You can't distribute what doesn't exist.
      *   *Nuance:* Sen doesn't deny drought matters, but he argues response determines death toll. However, if the drought is unprecedented (climate change), the "man-made" label gets diluted. Is climate change "man-made"? Yes, globally. But is it a "policy crime" like Bengal? That's a stretch for a news headline.
      *   *Honest Assessment:* If the drought literally killed the crops and imports were impossible due to poverty (not blockade), calling it purely "political" risks ignoring the biophysical reality. The editor's "natural" frame isn't *wrong*, just incomplete.

  6.  **Drafting the Response:**
      *   *Tone:* Professional, journalistic, analytical, respectful of both the editor's experience and the user's academic grounding.
      *   *Structure:*
          1.  Decode the Editor's Algorithm (The two rules).
          2.  Predict the Verdict (Madagascar).
          3.  The Split Case (Where the rules disagree).
          4.  The Critique (Weakness in the Sen view).
      *   *Refining the Editor's Logic:* The Somalia 2011 case is key. Al-Shabaab blocked aid, yet he called it natural. This suggests the "Villain" must be a *State* with *Responsibility*. Non-state actors or weak states don't count as "Man-Made" in his book.
      *   *Refining the Sen Critique:* Don't just say "Sen is right." Acknowledge that in Madagascar, the *severity* of the drought was historically anomalous. Sen's theory works best when FAD (Food Availability Decline) is minimal. In Madagascar, FAD was significant.

  7.  **Final Polish:** Check against the prompt requirements.
