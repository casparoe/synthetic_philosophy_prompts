answer: |-
  This is a fantastic pedagogical idea. Moral trade is counterintuitive enough that *feeling* the gain is worth more than hearing the argument. The risk with philosophers is that they will debate the premises of the game rather than playing it, or they will refuse to trade with the "nasty" agent on principle, thereby missing the lesson.

  Here is a design for **"The Pledge Market."** It strips away the economics jargon and focuses on the core mechanic: *I commit my resources to your cause; you commit yours to mine.*

  ### 1. Materials & Setup (Prep Time: 30 mins)

  You need three types of cards. Print these on different colored paper.

  **A. The Resource Card (Same for everyone)**
  *   **You have 10 Pledge Tokens.**
  *   A Token represents 10 hours of your personal activist labor.
  *   **Rule:** You must pledge all 10 Tokens. You can pledge them to any Cause on the board, *or* you can hand them to another player to pledge on your behalf.

  **B. The Cause Board (Projected or Whiteboard)**
  List 4 Causes.
  1.  **Global Health** (e.g., Malaria Nets)
  2.  **Local Arts** (e.g., Community Theater)
  3.  **Rights Litigation** (e.g., Civil Liberties)
  4.  **Systemic Stability** (e.g., Institutional Order)

  **C. The Value Cards (Secret, distributed randomly)**
  This is where the gains from trade are baked in. Each card lists how many **"Moral Units" (MU)** you gain per Token pledged to each Cause.
  *   *Distribution:* Create 4 "Clusters" of players (3-4 people per cluster).
  *   **Cluster 1 (Consequentialists):** Global Health = 10 MU, Local Arts = 1 MU, Rights = 5 MU, Stability = 2 MU.
  *   **Cluster 2 (Partialists):** Global Health = 1 MU, Local Arts = 10 MU, Rights = 2 MU, Stability = 5 MU.
  *   **Cluster 3 (Deontologists):** Global Health = 2 MU, Local Arts = 1 MU, Rights = 10 MU, Stability = 2 MU.
  *   **Cluster 4 (The "Nasty" Negative Utilitarians):** Global Health = 5 MU, Local Arts = **-5 MU**, Rights = 2 MU, Stability = 10 MU.
      *   *Note:* The Negative Utilitarian view is that creating "happy art" distracts from suffering reduction, actively making things worse. This creates the complicity dilemma.

  ### 2. The Rules (Read this verbatim, 2 mins)

  > "You have 10 Pledge Tokens representing your labor. There are 4 Causes on the board. Your Value Card tells you how much 'Moral Good' you generate when a Token is pledged to a Cause.
  >
  > **Round 1:** Silently decide where to pledge your 10 Tokens. Write it down. Do not talk.
  > **Round 2:** You have 15 minutes to trade. You can make any deal you want. The standard deal is: 'I will pledge my Tokens to Cause X (which you like) if you pledge your Tokens to Cause Y (which I like).' You can also give me your Tokens to spend as I see fit.
  > **Constraint:** All deals must be written on a Contract Slip and signed by both parties. If you break a contract, you get 0 points.
  > **Goal:** Maximize your own Moral Units. You do not need to agree on what is 'Good.' You only need to maximize your own score."

  ### 3. The Payoff Logic (For Your Eyes Only)

  You want variation in success. Here is how the math forces specific dynamics:

  *   **The Easy Win (Cluster 1 & 2):** The Consequentialist values Global Health (10) over Arts (1). The Partialist values Arts (10) over Health (1).
      *   *Baseline:* Both pledge to their own favorite. Score: 100 each.
      *   *Trade:* Consequentialist pledges 10 to Arts. Partialist pledges 10 to Health.
      *   *Result:* Consequentialist gets (10 * 1) = 10? **Wait.**
      *   *Correction:* If I pledge to *your* cause, I get *my* value for that cause. That doesn't help.
      *   *The Fix:* The mechanic must be **Delegated Spending.**
      *   *Revised Rule:* "I give you my Tokens. **You** spend them. I get the points based on **my** Value Card for where **you** put them."
      *   *Wait, that requires trust.*
      *   *Better Fix:* **The Swap.**
      *   *Revised Rule:* "I commit to spending my 10 Tokens on Cause A. You commit to spending your 10 Tokens on Cause B."
      *   *Payoff:* I get points for Cause A based on *my* card. You get points for Cause B based on *your* card.
      *   *Why trade?* Because I value Cause B more than Cause A, and you value Cause A more than Cause B.
      *   *Let's check the math:*
          *   Consequentialist (C): Health=10, Arts=1.
          *   Partialist (P): Health=1, Arts=10.
          *   *Baseline:* C pledges Health (100 pts). P pledges Arts (100 pts).
          *   *Trade:* C pledges Arts. P pledges Health.
          *   *Result:* C gets (10 * 1) = 10. P gets (10 * 1) = 10. **This is a loss.**
      *   *CRITICAL ERROR IN LOGIC:* In moral trade, I do *your* action because *you* do *my* action. I don't get points for the action I do; I get points for the action *you* do in exchange.
      *   *Correct Game Mechanic:* **Conditional Pledges.**
      *   "I will pledge my 10 Tokens to Arts **IF** you pledge your 10 Tokens to Health."
      *   *My Payoff:* (Tokens I pledged to Arts * My Value for Arts) + (Tokens You pledged to Health * My Value for Health).
      *   *Let's re-run:*
          *   C Values: Health=10, Arts=1.
          *   P Values: Health=1, Arts=10.
          *   *Baseline:* C pledges Health (100). P pledges Arts (100). Total World Good (sum of both scores) = 200.
          *   *Trade:* C pledges Arts. P pledges Health.
          *   *C Score:* (10 * 1) + (10 * 10) = 110. (**Gain of 10**)
          *   *P Score:* (10 * 10) + (10 * 1) = 110. (**Gain of 10**)
      *   *This works.* Both players count the *total* tokens ending up on causes they value, regardless of who physically placed them.
      *   *Instruction Update:* "Your Score is calculated based on the **final distribution of all Tokens on the board**, multiplied by **your** Value Card. You do not just count your own tokens."

  **The "Nasty" Dilemma (Cluster 4):**
  *   Negative Utilitarian (N): Arts = -5.
  *   If N trades with Partialist (P):
      *   P wants Arts funded. N wants Arts *defunded*.
      *   Deal: N pledges to Health (which P tolerates). P pledges *nothing* to Arts (which N demands).
      *   This creates friction. P has to sacrifice their highest value cause to trade with N. This generates the "complicity" debate.

  ### 4. Run of Show (75 Minutes)

  *   **00-05:** Hand out cards. No talking. Read rules.
  *   **05-15:** **Round 1 (Siloed).** Everyone writes down their unilateral plan. Collect the "contracts." Calculate scores (you need 2 TAs or faculty to help calculate, or use a spreadsheet projected live).
      *   *Goal:* Establish the baseline. Most will cluster on their "10 MU" cause.
  *   **15-35:** **Round 2 (The Market).** Open trading. Encourage them to move chairs. They must sign Contract Slips ("Player A pledges 10 to Cause X; Player B pledges 10 to Cause Y").
      *   *Facilitator Note:* If they are stuck, whisper to a Cluster 1 and Cluster 2 player: "Have you compared your cards?"
  *   **35-45:** **Final Tally.** Reveal Value Cards (or at least the clusters). Calculate final scores.
  *   **45-75:** **Debrief.**

  ### 5. The Debrief Guide

  **Phase 1: The Gains (10 mins)**
  *   "Who improved their score?" (Most should have).
  *   "Did anyone change their mind about which Cause is objectively best?" (No).
  *   **Point:** This is Pareto improvement under settled disagreement. You didn't need to convince the Partialist that Global Health is better; you just needed their labor on it.

  **Phase 2: The "Nasty" Trade (15 mins)**
  *   Identify the Negative Utilitarian (Cluster 4).
  *   "Did anyone trade with them? Why or why not?"
  *   *Likely outcome:* People refused.
  *   **Point:** If you refused, you likely left Moral Units on the table. By your *own* lights (your Value Card), the world is worse because you didn't trade.
  *   **Question:** "Is trading with a view you find abhorrent complicity? Or is refusing to trade a form of moral self-indulgence that harms the very causes you care about?"
  *   *Ord's Insight:* Moral trade requires tolerating the existence of 'wrong' actions to secure 'right' ones.

  **Phase 3: Uncertainty & Liquidity (10 mins)**
  *   "What if you weren't sure which Value Card you had?" (Introduce moral uncertainty).
  *   **Point:** If you are 50% sure you're a Utilitarian and 50% a Deontologist, you are a *better* trading partner than a dogmatist, because you value a wider range of outcomes. Moral uncertainty increases liquidity in the moral market.

  ### 6. Predictable Failure Modes

  1.  **The "Philosophical Sabotage":** A student argues the scoring system is utilitarian reductionism and refuses to play.
      *   *Fix:* Pre-empt this. "The points are not 'Goodness,' they are 'Satisfaction of Your Own Criteria.' You can be a Kantian and still want to maximize Kantian Units."
  2.  **The Trust Deficit:** Players won't sign contracts because they think others will lie.
      *   *Fix:* You (the facilitator) are the Bank. All contracts are lodged with you. You enforce the final tally.
  3.  **The Ostracization:** Everyone ignores the "Nasty" player.
      *   *Fix:* This is actually a feature, not a bug. It fuels the debrief. But, secretly instruct the "Nasty" player before the session: "Your goal is to offer a deal that is mathematically irresistible to one other person. Try hard to get one partner."
  4.  **Multilateral Confusion:** Three people try to swap at once and get confused.
      *   *Fix:* Encourage bilateral trades first. "Find one partner. Maximize that gain. Then look for another."

  ### 7. The Limitations (The "Honest Part" for the End)

  You must close by acknowledging what the game *cannot* do. This protects your credibility.

  1.  **Reputation & Iteration:** Real moral trade relies on long-term trust. In this game, it's one-shot. In reality, if I trade with a "Nasty" agent, does that signal to others that I am "Nasty"? The game ignores reputational externalities.
  2.  **Epistemic vs. Axiological:** The game models *axiological* disagreement (we value different things). Much real moral trade is *epistemic* (we want the same thing but disagree on how to get it). The game simplifies this away.
  3.  **The "Corruption" Risk:** In the game, trading is clean. In reality, doing someone else's bidding might corrupt your moral character or blur your own agency. The game treats moral labor as fungible currency; in reality, *who* does the action might matter morally (integrity objections).
  4.  **No Real Stakes:** They are moving points, not lives. It is easy to be utilitarian about points. It is much harder to trade away real-world principles.

  ### Summary Checklist for You
  *   [ ] Print Value Cards (4 types, 3-4 of each).
  *   [ ] Print Contract Slips (small half-sheets).
  *   [ ] Prepare Spreadsheet for quick scoring (Columns: Player, Cause Pledged, Total Tokens on Cause, Player Value, Score).
  *   [ ] Brief the "Nasty" player beforehand (ask for a volunteer or slip them the card discreetly).
  *   [ ] Set a visible timer.

  This design forces them to operationalize their values. When the Consequentialist sees they can gain 10% more "Good" by funding "Art" (which they think is trivial) simply because the Art-Lover funds "Nets" (which they think is vital), the Ord argument moves from abstract to visceral.
