  my nephew (he's ten) watched some youtube video about whether achilles ever actually passes the tortoise and grilled me about it over thanksgiving dinner, and I have now spent two weeks down a supertask rabbit hole when I should be working. anyway I've written down where I've landed and I want to know if it hangs together:

