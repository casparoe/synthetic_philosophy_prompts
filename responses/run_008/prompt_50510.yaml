prompt: |-
  I'm a high school junior, and over the past year I've quietly stopped doing almost anything for my classes unaided. My history essays start as chat transcripts, my physics problem sets get a first pass from the model before I look at them, and my Spanish is now half flashcards and half asking for translations I never attempt myself. My grades have gone up. But last week a teacher asked me, in class, to explain a concept that was all over my latest essay -- how the reinsurance market spreads risk, roughly -- and I discovered I could not say a single sentence about it. That gap between what my work shows and what I can do unaided is what worries me, not the grades.

  I don't want to swear off the tool, and I don't want a lecture about cheating. I want a decision procedure I can actually run, in under two minutes, in the moment before I open the chat window: a fixed list of questions to ask myself, in order, with rough criteria for what counts as a yes or a no, and a clear stopping point that either licenses the help or forbids it. It has to work across subjects -- math, languages, essay writing, lab reports -- without me having to become a learning scientist to apply it. It should say explicitly where the procedure can't decide and hands the call back to my own judgment, and it should be honest about where it will misfire, not pretend to be airtight.

  I've also started sketching my own taxonomy of what the tool does for me, and I'd like the procedure to use, correct, or discard it: I think of it as a butler (does the task while I wait), a tutor (walks me through the reasoning step by step), a sparring partner (attacks my draft or my proof and forces me to defend it), and a searchlight (tells me what I don't know I don't know, like the name of the concept I'm fumbling toward). My guess is that butler-mode is what rots my understanding and sparring-partner-mode is what builds it, with tutor-mode ambiguous depending on something I can't name -- but I'm making this up, and I want to know how much of it survives contact with what's actually known about learning: things like the difference between getting something right and being able to regenerate it, the finding that people routinely overestimate how well they understand a mechanism until asked to explain it, the idea that some difficulties in practice are desirable rather than wasteful, and the general phenomenon where offloading a process to a tool lets the skill underneath decay without your noticing.

  Then run the procedure on three real cases from my week. First, the reinsurance essay, where I already know the outcome I don't like but want to see whether the procedure would actually have caught it. Second, tomorrow's physics problem set, where I can solve maybe half the problems unaided and my custom is to paste in all of them. Third, Spanish class, where I've been having the model produce example sentences with new vocabulary and my quiz average has actually improved -- a case where I suspect the procedure should let me keep going, but I want to see whether that's what it really says or whether that's just what I want it to say. If the procedure can't distinguish these cases, say so plainly, and tell me what a tenth-grader with no training in any of this theory would need to add or drop to make it work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior. Self-aware, reflective, concerned about *learning* rather than just grades. Acknowledges reliance on AI but wants to manage it, not ban it.
      *   **Problem:** Grades are up, but understanding is down (the "reinsurance" incident). There's a gap between output and internal capability.
      *   **Goal:** A decision procedure (algorithm/checklist) to use *in the moment* (under 2 minutes) before using AI.
      *   **Constraints:**
          *   Must work across subjects (Math, Language, Essay, Lab).
          *   Must be actionable (not require learning science degree).
          *   Must admit limitations (where it can't decide).
          *   Must incorporate/critique the user's taxonomy (Butler, Tutor, Sparring Partner, Searchlight).
          *   Must apply learning science principles (regeneration vs. recognition, illusion of competence, desirable difficulty, skill decay).
          *   Must test against three specific cases (Reinsurance Essay, Physics Problem Set, Spanish Vocabulary).
      *   **Tone:** Respectful, direct, practical, non-judgmental (no "cheating" lectures).

  2.  **Deconstruct the User's Taxonomy & Learning Science:**
      *   *Butler:* Does the work. High risk of skill decay. Illusion of competence.
      *   *Tutor:* Walks through reasoning. Ambiguous. Can lead to passive following if not careful.
      *   *Sparring Partner:* Attacks draft/proof. High engagement. Forces defense. Good for deepening.
      *   *Searchlight:* Identifies gaps. Good for metacognition.
      *   *Learning Science Concepts:*
          *   *Regeneration:* Can I produce this without cues? (The "reinsurance" test).
          *   *Illusion of Competence:* Reading an explanation feels like knowing it.
          *   *Desirable Difficulty:* Struggling a bit strengthens memory/connections.
          *   *Offloading:* If the tool does the cognitive load, the brain doesn't build the schema.

      *   *Critique of Taxonomy:* The user's intuition is mostly right. "Butler" is the danger zone. "Sparring" is the growth zone. "Tutor" is risky if it becomes "Butler in disguise." "Searchlight" is safe if it leads to self-study. The key variable isn't just the *role*, it's the *timing* and the *output requirement*.

  3.  **Drafting the Decision Procedure (The "Two-Minute Gate"):**
      *   Needs to be a flowchart or a numbered list. Numbered is easier to read quickly.
      *   Needs a "Stop" condition (Don't use AI) and a "Go" condition (Use AI).
      *   Needs to address the "Why am I using this?" question.
      *   Needs to address the "What will I do with the output?" question.

      *   *Drafting Questions:*
          1.  What is the goal? (Grade vs. Learn).
          2.  Can I start this unaided? (Desirable difficulty).
          3.  How will I verify I know it later? (Regeneration test).
          4.  Which mode is this? (Taxonomy check).

      *   *Refining for Speed:* Make it binary Yes/No where possible.
      *   *The "Regeneration" Clause:* This is crucial based on the user's reinsurance story.
      *   *The "First Pass" Rule:* Never start with AI.

  4.  **Integrating Learning Science:**
      *   *Regeneration:* Explicitly build in a "Close the tab and explain" step.
      *   *Desirable Difficulty:* If it feels too easy, it's probably not sticking.
      *   *Illusion of Competence:* Warn against reading AI output and nodding.

  5.  **Developing the Three Case Studies:**
      *   *Case 1: Reinsurance Essay.*
          *   Input: "Write essay on reinsurance."
          *   Procedure Check: Did I try first? No. Will I regenerate? No.
          *   Result: FAIL. (Matches user's outcome).
      *   *Case 2: Physics Problem Set.*
          *   Input: "Solve these 10 problems."
          *   Procedure Check: Can I solve half? Yes. Should I do the half I know? Yes. What about the others?
          *   Nuance: If AI solves them, it's Butler. If AI hints, it's Tutor.
          *   Result: Conditional PASS/FAIL depending on mode.
      *   *Case 3: Spanish Vocabulary.*
          *   Input: "Give me example sentences."
          *   Procedure Check: Is this Butler or Searchlight? It's input generation.
          *   Risk: Passive reading vs. Active usage.
          *   Result: PASS *if* active recall is added.

  6.  **Refining the Procedure (Iterative Polish):**
      *   Make it punchy.
      *   Ensure the "Uncertainty" clause is clear.
      *   Ensure the Taxonomy is corrected/integrated.
      *   *Self-Correction on Taxonomy:* The user thinks Tutor is ambiguous. I need to clarify that Tutor is safe *only if* the student drives the car, not the AI.
      *   *Self-Correction on Spanish:* The user thinks this is safe. I need to challenge that. Generating sentences is passive unless the student *uses* them immediately.

  7.  **Final Review against Constraints:**
      *   Under 2 minutes? Yes, 4 questions.
      *   Across subjects? Yes, focused on cognitive process.
      *   Admits limitations? Yes, included an "Edge Case" section.
      *   No lecturing? Keep tone collaborative.

  8.  **Final Output Structure:**
      *   **Part 1: The Taxonomy Audit.** (Validating and correcting their mental model).
      *   **Part 2: The Two-Minute Gate.** (The actual procedure).
      *   **Part 3: The Stress Test.** (Running the three cases).
      *   **Part 4: Limitations & Maintenance.** (Where it breaks and how to fix it).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Don't be a Butler." I need to define *when* a Butler is okay (e.g., formatting, citation checking) vs. when it's not (core concept generation).
      *(Refining the "Tutor" ambiguity)*: The ambiguity is whether the student is tracking the logic or just copying the steps. The procedure needs a check for "Active Tracking."

      *(Final Polish on the Procedure)*: Let's call it the "Regeneration Gate."
      1.  **The Effort Check:** Have I struggled for 5 minutes?
      2.  **The Role Check:** Which hat is the AI wearing?
      3.  **The Exit Ticket:** What will I do *after* the AI closes?
      4.  **The Truth Test:** Can I explain this without looking?

      Okay, ready to write.

      *(Wait, one more thing)*: The user asked for "rough criteria for what counts as a yes or no." I need to be specific there. E.g., "5 minutes of genuine struggle." "Can I write 3 sentences without looking?"

      *(Spanish Case Nuance)*: The user says quiz averages improved. That suggests retention. But is it *generative* retention? Can they speak? The procedure should flag this as "Input vs. Output."

      *(Physics Case Nuance)*: "Paste in all of them." This is the danger zone. The procedure must force a split: Do the ones you know, get hints on the ones you don't.

      *(Reinsurance Case)*: This is the canonical failure. The procedure must catch the "Zero Effort Start."

      Let's assemble.

      *(Final thought on Tone)*: The user is smart. Treat them like an engineer debugging a system, not a kid being scolded. Use their language (decision procedure, taxonomy, edge cases).

      *(Learning Science Integration)*: Explicitly mention "Desirable Difficulty" and "Illusion of Explanatory Depth."

      *(Limitations)*: Acknowledge that fatigue, time pressure, and emotional state will break the procedure.

      Okay, plan is solid. Proceeding to generate response.cw
answer: |-
  This is a sophisticated request. You are asking for a meta-cognitive tool to manage a cognitive tool. You have correctly identified that the risk isn't the technology; it's the *offloading of the cognitive load required to build neural schema.*

  Here is the audit of your taxonomy, the decision procedure you requested, and the stress test against your three cases.

  ### Part 1: The Taxonomy Audit

  Your intuition is largely correct, but it needs one critical correction based on learning science (specifically *active recall* and *desirable difficulty*).

  *   **The Butler (Does the task):** **High Risk.** This creates the "Illusion of Competence." You recognize the output as correct, so your brain tags it as "known," but you cannot regenerate it. This caused your reinsurance failure.
      *   *Verdict:* **Forbidden** for core learning tasks. Permissible only for mechanical formatting (citations, syntax checking) *after* the thinking is done.
  *   **The Sparring Partner (Attacks your draft):** **High Value.** This forces *elaborative interrogation* (explaining why something is true). It strengthens retrieval paths.
      *   *Verdict:* **Licensed.**
  *   **The Searchlight (Identifies gaps):** **High Value.** This aids metacognition (knowing what you don't know).
      *   *Verdict:* **Licensed.**
  *   **The Tutor (Walks through reasoning):** **The Danger Zone.** You identified this as ambiguous. Here is the rule: A Tutor is only safe if **you drive.** If the AI outputs the steps and you read them, it is a Butler in disguise. If the AI asks *you* for the next step and corrects you, it is a Tutor.
      *   *Verdict:* **Conditional.** Only allowed if it uses Socratic questioning, not solution generation.

  **The Correction:** The taxonomy isn't about what the AI *is*; it's about **who holds the pen.** If the AI generates the primary cognitive artifact (the proof, the paragraph, the translation), you are not learning. If you generate the artifact and the AI critiques it, you are.

  ---

  ### Part 2: The Two-Minute Gate (Decision Procedure)

  Run this checklist immediately before typing a prompt. If you answer **NO** to any of the first three questions, you must stop.

  **1. The Struggle Threshold (Desirable Difficulty)**
  *   **Question:** Have I spent at least 5 minutes trying to solve this unaided, or written a rough draft/attempt without help?
  *   **Yes:** I have hit a specific wall.
  *   **No:** I am avoiding the initial cognitive load.
  *   **Stop Condition:** If **No**, do not open the chat. Struggle for 5 minutes.

  **2. The Role Definition (Taxonomy Check)**
  *   **Question:** Am I asking the AI to *generate* the core answer, or to *critique/hint* at my answer?
  *   **Yes (Critique/Hint):** I am keeping the cognitive load.
  *   **No (Generate):** I am offloading the schema building.
  *   **Stop Condition:** If **No**, rewrite the prompt. (e.g., Change "Solve this" to "Check my work on step 3" or "Give me a hint for variable X").

  **3. The Regeneration Test (Exit Ticket)**
  *   **Question:** Before I close the chat, will I close the tab and write/explain the solution from memory without looking?
  *   **Yes:** I commit to verifying retention.
  *   **No:** I will read it, nod, and move on.
  *   **Stop Condition:** If **No**, do not use the tool. Reading is not learning.

  **4. The Uncertainty Clause (Edge Cases)**
  *   **Scenario:** You are exhausted, it is 11 PM, and you have a deadline.
  *   **Procedure:** The Gate fails here. You must acknowledge you are trading learning for completion.
  *   **Action:** Mark the assignment in a notebook as "AI-Assisted / Not Mastered." Schedule 15 minutes this weekend to re-do one problem from that set unaided.

  ---

  ### Part 3: The Stress Test (Running Your Cases)

  Here is how the procedure applies to your three scenarios.

  #### Case 1: The Reinsurance Essay (Retrospective)
  *   **Input:** "Write an essay on how reinsurance spreads risk."
  *   **Gate Run:**
      1.  *Struggle Threshold:* **NO.** You started with a chat transcript.
      2.  *Role Definition:* **NO.** The AI was a Butler (generated the content).
      3.  *Regeneration Test:* **NO.** You submitted the text without verifying you could speak it.
  *   **Result:** **FORBIDDEN.**
  *   **Analysis:** The procedure catches this cleanly. The failure wasn't the essay; it was the *start state*. You skipped the struggle.
  *   **Corrected Path:** You write 300 words on risk spreading unaided (even if wrong). Prompt: "I argue X about reinsurance. Where is my logic flawed?" (Sparring Partner). Then, close tab and rewrite the thesis from memory.

  #### Case 2: Physics Problem Set (Tomorrow)
  *   **Input:** Paste all 10 problems. "Solve these."
  *   **Gate Run:**
      1.  *Struggle Threshold:* **PARTIAL.** You can solve half.
      2.  *Role Definition:* **NO.** "Solve these" is Butler mode.
      3.  *Regeneration Test:* **NO.** Custom is to look and move on.
  *   **Result:** **FORBIDDEN.**
  *   **Analysis:** This is the highest risk area. Physics requires procedural fluency. Watching a solution feels like understanding (Illusion of Competence), but you cannot execute the algorithm under test conditions.
  *   **Corrected Path:**
      *   Do the 5 you know unaided.
      *   For the 5 you don't: Attempt for 5 mins.
      *   Prompt: "I am stuck on problem 4. I tried Conservation of Energy but the friction term is confusing. Give me a hint, not the solution." (Tutor Mode).
      *   **Crucial:** Solve the problem on paper. Close AI. Wait 10 minutes. Solve it again.

  #### Case 3: Spanish Vocabulary (Current Success)
  *   **Input:** "Produce example sentences with new vocabulary."
  *   **Gate Run:**
      1.  *Struggle Threshold:* **YES/NO.** (Ambiguous). You aren't struggling to *find* sentences, but are you struggling to *use* them?
      2.  *Role Definition:* **YES.** This is Searchlight/Input. The AI provides context, not your output.
      3.  *Regeneration Test:* **DEPENDS.** Do you just read them, or do you make your own?
  *   **Result:** **CONDITIONAL PASS.**
  *   **Analysis:** Your quiz average improved because recognition (multiple choice) is easier than recall (speaking/writing). The AI is acting as a textbook here, which is generally safe.
  *   **Risk:** If you only read the AI sentences, you are building *recognition* neural paths, not *production* paths. You might pass the quiz but fail a conversation.
  *   **Correction:** Keep the AI generating sentences (Searchlight), but add a Gate requirement: "For every 5 AI sentences, I must write 2 original sentences using that vocab without looking."

  ---

  ### Part 4: Limitations & Maintenance

  You asked for honesty about where this will misfire.

  **1. The Fatigue Loophole**
  *   **Failure Mode:** When you are tired, Question 1 (Struggle) feels painful. You will lie to yourself ("I tried for 5 minutes" when it was 30 seconds).
  *   **Fix:** Use a physical timer. No timer = No AI.

  **2. The "Efficiency" Trap**
  *   **Failure Mode:** You will realize the Gate slows you down. You will feel tempted to bypass it to save time.
  *   **Reality Check:** You are currently trading time now for competence later. The Reinsurance incident proves the debt is coming due. The Gate is the repayment plan.

  **3. The "Tutor" Disguise**
  *   **Failure Mode:** AI models are eager to please. Even if you ask for a hint, they often give the answer.
  *   **Fix:** If the AI gives the answer when you asked for a hint, stop. Do not read the rest. Close the tab. Find a different resource or ask a human. Reading the "bonus" answer reverts you to Butler mode.

  **4. What a 10th Grader Needs to Add**
  *   **The "Blank Page" Rule:** For any major assignment (Essay, Lab, Problem Set), there must be a physical or digital artifact that exists *before* the AI is consulted. A scratch pad, a bulleted list, a failed equation. If the first mark on the page is made by the AI, the Gate is breached.
  *   **The "Weekend Audit":** Once a week, pick one thing you used AI for. Try to do it again without AI. If you can't, you didn't learn it; you just rented the grade.

  ### Summary
  Your worry is valid. The gap between output and understanding is where competence decays.
  *   **Keep:** Searchlight and Sparring Partner modes.
  *   **Fix:** Tutor mode (must be Socratic).
  *   **Ban:** Butler mode on core concepts.
  *   **The Rule:** No AI before struggle. No AI without regeneration.

  Run the Gate. If it says stop, close the laptop. The discomfort you feel in that moment is the feeling of the skill actually sticking.
