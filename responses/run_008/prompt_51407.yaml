      *   **Case 3: Ape (Signing "Food").**
          *   *Context:* Ape signs "food". Trainers say it's a request.
          *   *Application:*
              *   Shared Focus? Yes (Trainer/Food).
              *   Info Gap? Maybe.
              *   Rational? Yes (Get food).
              *   Associative? **High.** Clever Hans effect. Trainers expect "food".
              *   *Davidsonian Problem:* Without language syntax/truth conditions, is it a belief or a conditioned signal?
              *   *Verdict:* The manual should force a "Stimulus-Response" or "Escalate" here because the clip alone doesn't rule out cuing. To satisfy the "answer I won't like" constraint, I will have the manual code this as **Stimulus-Response (Conditioned Signal)** based on the lack of triangulation evidence in a single clip. This hits the Davidsonian point: without a background of true/false usage in varied contexts (holism), a single sign is just a causal lever-pull.

