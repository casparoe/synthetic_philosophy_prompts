          2.  Dog (fetches leash on hearing "walk" in a sentence).
          3.  Ape (signs "food" as request).

  2.  **Deconstruct Davidson's Radical Interpretation for Ethology:**
      *   *Principle of Charity:* Interpret the subject as having mostly true beliefs and coherent desires.
      *   *Rationality Constraint:* Actions must make sense given the beliefs/desires.
      *   *Triangulation:* Meaning/Belief arises from the interaction between two creatures and a shared object in the world.
      *   *Holism:* Beliefs come in clusters, not isolation.
      *   *Language Constraint (The Davidson Blocker):* Davidson says no language = no belief. *Crucial Modification:* The user wants to *use* the machinery to attribute *proto-beliefs* or *information states* without settling the metaphysical debate. I need to operationalize "belief-like state" without triggering the "language" veto, effectively creating a "Davidsonian Lite" framework.

  3.  **Drafting the Procedure (The "Triangulation & Charity" Protocol):**
      *   *Goal:* Distinguish between "Stimulus-Response" (S-R) and "Information-State Mediated" (ISM).
      *   *Step 1: The Shared Object (Triangulation).* Is there a specific external object/event both the subject and the observer (or another animal) are oriented toward? If no -> S-R.
      *   *Step 2: The Divergence (Charity/Truth).* Does the subject act differently based on *information* about the object that isn't currently present in the immediate stimulus? (e.g., knowing someone *saw* the hiding vs. just seeing a person). If no -> S-R.
      *   *Step 3: Rational Coherence.* If we assume the subject holds a specific representation (e.g., "He saw me hide it"), does the action (re-caching) make rational sense to achieve a goal (security)? If yes -> ISM.
      *   *Step 4: The Alternative Explanation Check.* Can a simpler associative learning rule explain this without positing an information state? (This is the behaviorist check).
