answer: |-
  # Operational Protocol for Information-State Attribution (OP-ISA)
  **Version 1.0 | Cognitive Ethology Lab**

  ## 1. Purpose and Scope
  This manual is not a philosophical treatise. It is a reliability tool. Its goal is to standardize when observers code a behavior as **Direct Stimulus-Response (S-R)** versus **Information-State Mediated (ISM)**.

  *   **S-R Code:** The behavior is fully explained by immediate sensory inputs and past conditioning (e.g., reflex, associative learning).
  *   **ISM Code:** The behavior implies the subject is acting on a representation of the world that is not currently present in the immediate sensory stimulus (e.g., memory, inference, perspective-taking).

  **Time Limit:** 2 minutes per clip.
  **Decision:** Binary (S-R or ISM). If uncertain, mark **ESCALATE**.

  ---

  ## 2. The Decision Tree (4 Steps)
  *Answer these questions in order. If you answer "NO" at any step, stop and code **S-R**. If you answer "YES" to all four, code **ISM**.*

  ### Step 1: The Triangulation Check (Shared World)
  **Question:** Is there a specific object, event, or third-party agent in the environment that *both* the subject and another entity (observer, rival, human) are oriented toward?
  *   **YES:** Both are looking at/interacting with the same distinct thing (e.g., the cache site, the leash, the trainer).
  *   **NO:** The subject is acting in a vacuum, or the "other" is not oriented to the same specific target.
  *   *Why:* Beliefs are about *something*. If there is no shared focal point, we cannot distinguish internal representation from random movement.
  *   **→ NO = Code S-R.**

  ### Step 2: The Informational Gap Check (Charity)
  **Question:** Does the subject act differently based on information that is *not* currently visible or audible in the immediate clip?
  *   **YES:** The subject responds to what they *know* happened (e.g., "He saw me hide this earlier") rather than just what is happening now (e.g., "He is standing there").
  *   **NO:** The behavior can be triggered by the immediate physical presence of stimuli (e.g., the rival is present *now*, so I act *now*).
  *   *Why:* This applies the Principle of Charity. We assume the subject is rational. If they act without a current stimulus, we must posit a stored representation (belief) to make the action rational.
  *   **→ NO = Code S-R.**

  ### Step 3: The Rational Coherence Check
  **Question:** If we assume the subject holds the specific information identified in Step 2, does the action make logical sense to achieve a goal?
  *   **YES:** The action efficiently solves the problem posed by the information (e.g., "If he saw me hide it, I must move it to keep it safe").
  *   **NO:** The action seems random, maladaptive, or unrelated to the information state.
  *   *Why:* Radical interpretation requires us to maximize the rationality of the agent. Irrational actions are harder to interpret as belief-driven.
  *   **→ NO = Code S-R.**

  ### Step 4: The Associative Override (The Behaviorist Check)
  **Question:** Can this behavior be explained by simple conditioning (Pavlovian or Operant) without positing an information state?
  *   **NO:** Conditioning is unlikely. (e.g., The cue was embedded in a sentence, not a command; the rival was gone when the action happened).
  *   **YES:** Conditioning is a plausible alternative. (e.g., The animal has been rewarded for this specific motion before in similar contexts).
  *   *Crucial Rule:* If the answer is **YES** (Conditioning is plausible), you must default to **S-R** unless there is explicit evidence of *novelty* in the clip.
  *   *Why:* This is the parsimony constraint. We only attribute information states when associative learning fails to explain the data.
  *   **→ YES = Code S-R.**

  ---

  ## 3. Coder Warnings: Disguised Judgment Calls
  *Be honest about where your intuition is doing the work.*

  1.  **The "Rationality" Trap (Step 3):** What looks "rational" to you is based on *human* goals. A dog barking at a door might be "irrational" to you (door is locked), but rational to the dog (alerting the pack).
      *   *Correction:* Define the goal *from the species' typical repertoire* before watching the clip.
  2.  **The "Plausibility" Trap (Step 4):** You are not a learning theorist. You might underestimate how complex conditioning can be.
      *   *Correction:* If you are unsure if conditioning explains it, mark **ESCALATE**. Do not guess.
  3.  **The "Language" Bias:** You may be tempted to code human-trained animals (apes, dogs) as ISM more often than wild animals (jays).
      *   *Correction:* Apply Step 4 more strictly to captive/trained animals. They have more history of conditioning.

  ---

  ## 4. Worked Examples

  ### Case A: The Scrub Jay (Re-caching)
  **Clip:** Jay hides a nut. Rival watches from perch. Rival leaves. Jay returns alone, retrieves nut, re-hides it in a new spot.
  1.  **Triangulation:** **YES.** Jay and Rival both oriented to the cache site.
  2.  **Info Gap:** **YES.** Rival is *gone* during re-caching. Jay is not reacting to Rival's current presence, but to the *past* visual access.
  3.  **Rationality:** **YES.** Re-hiding secures the food against a known thief.
  4.  **Associative Override:** **NO.** Simple anxiety conditioning is possible, but the specificity (only re-caching when *watched*, not when alone) makes simple S-R difficult without positing a representation of the rival's knowledge.
  *   **Final Code:** **ISM (Information-State Mediated)**.
  *   *Note:* This is the "clean" case. The temporal gap between the stimulus (watching) and the response (re-caching) forces the belief attribution.

  ### Case B: The Dog (The Embedded Command)
  **Clip:** Owner sits on couch, talking on phone: "No, I can't come yet, I have to take the dog for a **walk**." Dog is in the room, not looking at owner. Dog hears word, runs to fetch leash, brings it to owner.
  1.  **Triangulation:** **YES.** Dog and Owner share the context of the "walk" routine (leash/door).
  2.  **Info Gap:** **YES.** The word "walk" is auditory symbolism, not a physical shove toward the door. The dog extracts meaning from a sentence not directed at it.
  3.  **Rationality:** **YES.** Fetching leash facilitates the walk.
  4.  **Associative Override:** **NO.** While dogs are conditioned to the word "walk," the word appeared as a noun within a declarative sentence, not as an imperative command ("Walk!"). This suggests semantic extraction rather than direct trigger-response.
  *   **Final Code:** **ISM (Information-State Mediated)**.
  *   *Note:* This passes because the stimulus was degraded (embedded speech), requiring the dog to process the *content*, not just the *command tone*.

  ### Case C: The Ape (The Sign Request)
  **Clip:** Language-trained ape sits with trainer. Trainer holds up a banana. Ape signs "FOOD". Trainer gives banana.
  1.  **Triangulation:** **YES.** Ape, Trainer, and Banana are all present.
  2.  **Info Gap:** **NO.** The banana is *visible*. The desire is immediate. The sign occurs in the presence of the object.
  3.  **Rationality:** **YES.** Signing gets the food.
  4.  **Associative Override:** **YES.** This is a classic Operant Conditioning loop. Sign → Reward. There is no evidence here that the ape understands "food" as a concept distinct from the immediate visual stimulus of the banana. There is no "false belief" possibility tested here.
  *   **Final Code:** **S-R (Stimulus-Response)**.
  *   *Note:* **This is the uncomfortable result.** Despite the trainers' claims, this single clip does not satisfy the Principle of Charity. To attribute a *belief* ("I believe this symbol refers to that class of objects"), we need to see the symbol used when the object is *absent*, or used falsely, or in combination with other symbols to create novel meaning (Holism). A single sign in the presence of the referent is indistinguishable from a lever press. **Escalate this clip if you want to argue for ISM, but the manual defaults to S-R.**

  ---

  ## 5. Escalation Criteria
  *Do not code these yourself. Flag them for the Postdoc/PI.*

  1.  **The Holism Failure:** The animal uses a signal (like the Ape's sign) in a way that suggests meaning, but we lack data on how they use it in *other* contexts (e.g., do they sign "food" when there is no food?). The manual cannot decide single-instance semantics.
  2.  **The "Clever Hans" Risk:** The human in the clip is looking at the animal or the expected object during the behavior. (e.g., The trainer looks at the banana before the ape signs). This introduces unconscious cuing.
  3.  **Conflicting Rationality:** The animal acts against its apparent self-interest in a way that might indicate complex social reasoning (e.g., altruism) or might indicate error/noise.

  ## 6. Fundamental Limitations (For the PI)
  *This procedure cannot resolve the following:*

  *   **The Metaphysical Question:** This manual does not prove animals have "minds." It only proves their behavior is *best modeled* as if they do. Davidson would still argue this is metaphorical without language. We are coding for *predictive utility*, not ontological truth.
  *   **The Holism Problem:** Davidson argues beliefs come in a web. We are coding clips in isolation. An ISM code on one clip is statistically weak without a pattern of ISM codes across the dataset.
  *   **The Anthropomorphism Ceiling:** Step 3 (Rationality) inevitably projects human logic onto animal goals. We mitigate this with species-specific goal definitions, but we cannot eliminate it.

  ---

  **End of Manual**
