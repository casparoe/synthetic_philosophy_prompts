answer: |-
  The core design is a multi-round voting auction where the class unlocks collective rewards only if designated individuals consent to endure escalating personal costs, forcing a collision between aggregate utility calculations and individual rights intuitions.

  ### Materials
  *   **Ballots:** Two colors (Green for "Approve Trade," Red for "Reject Trade").
  *   **The Ledger:** A whiteboard sheet tracking "Class Utility" (points) and "Individual Debt" (pain units).
  *   **Rewards:** High-value treats (e.g., pizza vouchers or actual snacks delivered at the end) and course participation points (e.g., 5 bonus points available).
  *   **Pain Cards:** Pre-written slips describing the "cost" (e.g., "Forfeit your own bonus points," "Stand during the next 10 minutes of lecture," "Write a 1-page reflection due tomorrow," "Stay 5 minutes after class").
  *   **Anonymous Drop Box:** For voting to reduce peer pressure.

  ### Payoff Scheme (No Real Money)
  *   **Base Pay:** All students receive 2 participation points for completing the session.
  *   **Collective Pleasure:** If the class approves 3 out of 4 rounds, everyone gets a snack + 2 bonus points. If they approve all 4, everyone gets 5 bonus points + pizza next session.
  *   **Individual Pain:** The "cost" is always borne by specific individuals (volunteers or randomly drawn), involving loss of their own bonus points, time, or minor social/physical inconvenience.

  ### Rules & Game Flow
  1.  **The Bank:** The class operates a "Utility Bank." To deposit "Pleasure Points" (rewards), they must withdraw "Pain Points" (costs).
  2.  **The Exchange:** Pain Points are not abstract; they must be *redeemed* by a human body. One Pain Point = One specific discomfort task.
  3.  **Voting:** Every round, the Instructor proposes a Pleasure Package. The class votes (secret ballot) to authorize the purchase.
  4.  **Authorization:** If the vote passes (>50%), the transaction occurs. The class must then identify who pays the Pain. If no volunteer steps forward after 2 minutes, a name is drawn randomly from the pool of "Yes" voters (forcing complicity).
  5.  **Exchange Rate Mechanism:** In Round 2, the class sets the exchange rate themselves (see Timeline).

  ### Timeline (90 Minutes)

  **0:00–0:10: Setup & Hypothetical Poll**
  *   Distribute ballots. Explain the stakes (points/snacks).
  *   **Verbal Trap:** Ask aloud, "If everyone gets pizza but one person has to stay late, is that mathematically justified if 17 people are happier than 1 is sad?" Record a show of hands. Most will say yes (utilitarian calculus).

  **0:10–0:50: The Four Rounds (40 mins)**
  *   **Round 1 (Distributed Pain):** Reward: 1 Bonus Point each. Cost: 18 Pain Points total (1 per student). Task: Stand for 2 minutes.
      *   *Expected:* Unanimous Yes. Pain is negligible and spread out.
  *   **Round 2 (Student-Set Rate):** Reward: Snacks for everyone. Cost: Class decides how many Pain Points to spend.
      *   *Mechanism:* Students write a number on ballots (0–10). Average becomes the cost. Volunteers needed to match the average.
      *   *Expected:* They will lowball the cost. Reveals risk aversion.
  *   **Round 3 (Concentrated Pain):** Reward: 3 Bonus Points each. Cost: 10 Pain Points assigned to **one** volunteer. Task: Forfeit all their own bonus points + write a reflection.
      *   *The Trap:* The math works (54 points gain vs 10 points loss). But one person loses everything.
      *   *Expected:* Hesitation. Votes split. Volunteers dry up.
  *   **Round 4 (The Lexical Threshold):** Reward: 5 Bonus Points + Pizza. Cost: 1 Pain Point assigned to **one** person. Task: Publicly read an embarrassing (but harmless) statement generated by the class.
      *   *The Trap:* Low cost, high reward. But the *type* of pain (social dignity) feels different than Round 1 (physical standing).
      *   *Expected:* Many will vote No despite the favorable ratio, revealing a lexical threshold against dignity violations.

  **0:50–1:30: Debrief & Philosophical Mapping (40 mins)**

  ### Debrief Guide
  **1. Revealed Preference vs. Stated Preference**
  *   **Moment:** Compare the show of hands at 0:05 (most said yes to sacrifice) vs. Round 3 voting results.
  *   **Concept:** **Commensurability.** They claimed pain and pleasure were interchangeable units (cardinal utility), but their votes showed pain "spiked" in value when concentrated. Ask: "Did the pain units in Round 3 feel 'heavier' than Round 1, even if the count was lower?"

  **2. Aggregation vs. Distribution**
  *   **Moment:** Contrast Round 1 (18 people stand) vs. Round 3 (1 person loses points).
  *   **Concept:** **Distributive Justice vs. Sum Maximization.** Utilitarianism cares about the sum; students cared about the distribution. Did the "random draw" threat in Round 3 make them vote more cautiously? This introduces the "separateness of persons" objection (Rawls).

  **3. The Lexical Threshold**
  *   **Moment:** Round 4 (The Embarrassment Task).
  *   **Concept:** **Negative Utilitarianism / Lexical Priority.** Even though the exchange rate was favorable (1 pain unit for massive gain), many likely vetoed it. This suggests some pains (dignity/humiliation) sit on a different scale that pleasure cannot offset, regardless of quantity.

  **4. The Exchange Rate Mechanism**
  *   **Moment:** Round 2 (Student-Set Rate).
  *   **Concept:** **Subjective Utility.** Did they try to set a "fair" price or a "efficient" price? This mirrors the problem of interpersonal utility comparison—how do we know how much pain one person feels vs. another's pleasure?

  ### Predictable Failures & Fixes
  *   **Failure:** **The "Hero" Volunteer.** One student volunteers for every round, ruining the tension.
      *   **Fix:** Implement a "Cool Down Rule." Once a student accepts a Pain Card, they are ineligible for the next two rounds. This forces the burden to rotate and prevents one person from "solving" the utilitarian calculus single-handedly.
  *   **Failure:** **Peer Pressure Voting.** Students vote "Yes" because they see others doing it, masking their true intuition.
      *   **Fix:** Enforce strict secret ballots with the drop box. Do not reveal counts until everyone has voted.
  *   **Failure:** **Trivialization.** Students laugh off the "embarrassing statement" or don't care about the points.
      *   **Fix:** Calibrate the stakes beforehand. Ensure the bonus points are meaningful (e.g., enough to drop a low quiz score). Make the "embarrassing statement" genuinely slightly uncomfortable (e.g., "I believe pineapples belong on pizza and will defend this in the faculty lounge").
  *   **Failure:** **Ethical Pushback.** A student refuses to participate on principle.
      *   **Fix:** Allow an "Opt-Out" card at the start. They get the base points but cannot vote or receive bonuses. Debrief their choice as a "Rights-Based Veto."

  ### Limitations (What You Must Supply)
  *   **Intensity of Suffering:** The game cannot simulate *agony*. Real negative utilitarianism often concerns extreme suffering (torture vs. trivial pleasure). You must verbally bridge the gap: "Imagine the 'Embarrassment Card' was actually physical pain lasting a year. Would any amount of pizza offset that?"
  *   ** Permanence:** The game pains are temporary. Real ethical dilemmas often involve permanent harm. You must highlight this in the debrief: "Because you knew the pain would end in 10 minutes, you were more utilitarian than you would be with lifelong consequences."
  *   **Ideal Observer:** The game assumes everyone knows the utility values. In reality, we don't know how much the volunteer is suffering. You must supply the **Epistemic Problem**: "Even if you voted Yes, did you *know* the volunteer was okay? Utilitarianism requires knowledge we rarely have."
