prompt: |-
  I teach a college ethics elective (about 18 students, one 90-minute session) and we're at the point where utilitarianism meets the question of whether pleasure and pain are commensurable -- specifically whether any amount of pleasure can compensate for a given pain, or whether some pains sit above a lexical threshold that no pleasure sums past (the negative utilitarian thought). Instead of lecturing on it, I want them to run into the problem in their own behavior. Design an in-class game where students administer or trade in something like a "pain bank": a points economy where they can buy pleasures for the group but have to sign off on pains hitting particular individuals, with the exchange rates left partly to them. The trick I want is that students who verbally say they'd trade anything for enough pleasure should end up refusing trades in the moment, or vice versa -- the threshold, if they have one, should show up in what they do, not what they claim. Give me the rules, materials, a payoff scheme that doesn't use real money, a timeline for the session, and a debrief that maps specific moments in the game onto cardinal commensurability vs lexical priority (and onto the difference between one person absorbing all the pain vs it being spread out). Also tell me what will predictably go wrong the first time I run it and how to handle that, and be honest about which part of the philosophical view the game just can't reproduce and I'll have to supply in the debrief myself. Lead with the core design idea in your first sentence, then the details -- no preamble, no restating my question.
