      *   Ethical concern: Don't actually harm students.
      *   Fix: Pre-script the "pains" to be mild but annoying. Ensure anonymity in voting if needed to prevent peer pressure skewing data (though peer pressure is part of the social utility calc).

  8.  **Limitations:**
