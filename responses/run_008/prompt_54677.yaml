prompt: |-
  Hey, I want you to act as a philosophy of mind professor who's spent their whole career on this stuff. No academic background on my side btw, I just think about these things on my commute, so plain language please.

  So from what I understand, eliminative materialists like Paul Churchland think beliefs and desires are basically like phlogiston — the "theory" built into everyday talk about minds is just wrong, and eventually neuroscience will replace it with concepts we can't even imagine yet. And it seems to me like that replacement already kind of happened? I keep reading that modern neuroscience describes the brain as doing "prediction error minimization" and carrying around "priors" instead of storing beliefs. So my first thought was: the eliminativists won, folk psychology is already getting phased out.

  But then it hit me that a "prior" sounds like... just a belief wearing a lab coat. It's basically something the brain takes to be true, right? So if the new neuroscience explains everything with priors and predictions, hasn't it just renamed beliefs, which would mean the eliminativists are wrong because beliefs are still right there at the end, just spelled differently?

  So which is it — did they win or lose? Please think this through carefully before answering, maybe start with a quick brainstorm of the possible readings of the situation, and then tell me where my reasoning goes off the rails, if it does. Answer in American English.
