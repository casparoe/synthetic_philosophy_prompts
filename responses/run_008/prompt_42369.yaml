answer: |-
  The Allais paradox is typically presented as a knockout blow to Expected Utility (EU) theory. In the classic setup, agents prefer a sure $1 million (Option 1A) over a gamble with a slightly higher expected value but a small risk of zero (Option 1B), yet simultaneously prefer a high-risk high-reward gamble (Option 2B) over a slightly safer moderate-reward gamble (Option 2A), even though the probabilistic difference between 2A and 2B is identical to the difference between 1A and 1B. This violates the Independence Axiom, which states that if you prefer X to Y, you should still prefer X to Y when both are embedded in a larger probabilistic mixture with a common third outcome Z.

  The standard conclusion is that rational agents violate Independence; therefore, Independence is not a valid norm of rationality. However, there is a robust defense available: the Allais preferences do not refute the axiom, but rather reveal that the agents are evaluating *different outcomes* than the theorist assumes. The argument is that "losing a sure thing" is phenomenologically and causally distinct from "failing to win a probable thing." If we individuate outcomes finely enough to include these structural features, the violation evaporates.

  To defend this position, we must first clarify what an "outcome" is. In the crude model used to generate the paradox, outcomes are defined solely by final asset positions: $0, $1M, $5M. But rational choice is not about asset positions in a vacuum; it is about world-states as experienced by the agent. When you choose 1A, you are buying certainty. When you choose 1B and get $0, you experience a specific psychological cost: the regret of having squandered a guarantee. When you choose 2B and get $0, you experience a different cost: the disappointment of a long-shot failing. These are not merely labels attached to preferences; they are distinct psychological states with different impacts on your welfare.

  If the outcome in 1B-loss includes "severe regret" and the outcome in 2B-loss includes "mild disappointment," then the payoffs are no longer identical across the two choice sets. The Independence Axiom requires the common consequence to be the *same* outcome. If the psychological context makes the $0 in scenario 1 different from the $0 in scenario 2, the axiom's conditions are not met, and no violation has occurred. The agent is simply maximizing expected utility over a richer set of outcomes that includes emotional and contextual states.

  The obvious objection, however, is that this move renders EU theory vacuous. If any preference violation can be explained away by claiming "the outcomes were actually different," then EU theory can never be falsified. It becomes a tautology: "Agents maximize utility, where utility is defined as whatever they maximize." This is the charge of *ad hoc* redescriptions. If we allow individuation to be driven solely by the desire to save the theory, we strip the theory of its normative force. It can no longer tell an agent they are irrational; it can only tell them they have unusual utility functions.

  To save the individuation move from vacuity, we must constrain how outcomes are individuated. We cannot simply reverse-engineer outcome descriptions from observed choices. Instead, individuation must be grounded in features external to the preference ordering itself. There are two viable constraints here: causal structure and compensatory independence.

  First, **causal structure**. Outcomes should be individuated based on causally distinct states of the world that affect the agent's welfare independently of the choice itself. Regret is not just a name for "preferring 1A"; it is a physiological and psychological process that consumes cognitive resources, reduces future happiness, and has measurable duration. If an agent can point to a mechanism—such as "I will lose sleep if I risk the sure thing"—that mechanism constitutes a real feature of the outcome. The individuation is valid only if the feature exists prior to the preference assessment, not as a result of it.

  Second, the **compensation test**. If the outcomes are truly distinct, there should be some price at which the agent would be indifferent between them. If "getting $0 after risking a sure $1M" is genuinely different from "getting $0 after risking a probable $5M," the agent should be able to conceive of a compensation amount that would make them whole in one scenario but not the other. If the agent says, "No amount of money makes up for the stupidity of losing the sure thing, but I'd be fine with the long-shot loss," they are identifying a real utility difference. If they cannot articulate any difference other than "I prefer the first choice," the individuation is illicit.

  By imposing these constraints, we prevent the theory from becoming a "just-so" story. We acknowledge that EU theory is not a descriptive model of how humans process coarse-grained monetary data; it is a normative model of coherence over fully specified world-states. The Allais data show that humans are naturally attuned to the *structure* of risk (certainty vs. probability) and encode that structure into their utility function. This does not mean they are irrational; it means they are rational over a domain that includes the "security" of the outcome as a good in itself.

  The position breaks only if we insist that EU theory must be both descriptively accurate for coarse outcomes *and* normatively binding. We cannot have both. But if we accept that the norm applies to fully described states of affairs, the Allais paradox dissolves. The agents are not violating Independence; they are correctly identifying that the "zero" in the first gamble is a heavier, more painful zero than the "zero" in the second.

  Verdict: The Allais data establish that humans violate the independence axiom when outcomes are defined narrowly as monetary payoffs, but they do not establish that expected utility theory is normatively invalid when outcomes are properly individuated to include the causal and psychological context of the choice.
