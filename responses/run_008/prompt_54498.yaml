      *Let's formulate the "Mind-Changer" carefully.* If I claim Endogenous explains the housing/CPI divergence best, what would falsify this? If it turned out that the housing boom *was* actually driven by foreign capital inflows (exogenous money) rather than domestic credit creation, Hume's framework (external injection) would be more relevant. Or, if the "stable CPI" is an illusion and broad money growth *always* correlates with CPI with a long lag, Hume's quantity theory holds long-run validity. I'll focus on the link between asset inflation and eventual CPI/Trade imbalance.

      *Wait, one more check on Q2:* Does Specie-Flow survive? Some economists argue the "Price-Specie-Flow Mechanism" is dead. Others argue it survives as the "Monetary Approach to the Balance of Payments." I should take a firm stance. I'll argue the *mechanism* is dead, but the *equilibrium intuition* survives via exchange rates.

