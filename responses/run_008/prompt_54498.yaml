answer: |-
  David Hume's monetary theory and the modern doctrine of endogenous money represent two fundamentally different ontologies of finance. Hume, writing in the mid-18th century, viewed money primarily as a commodity (specie) whose quantity was determined externally by trade balances or mining, acting upon the economy as an exogenous shock. Endogenous money theory, rooted in Post-Keynesian and modern banking analysis, views money as a credit relation created internally by the banking system in response to economic demand. While Hume correctly identified that money is not neutral in the short run, his framework rests on a causal arrow pointing from Money $\to$ Activity. Endogenous money reverses this: Activity/Credit $\to$ Money.

  This essay argues that while Hume's insights into the distributional effects of money were prescient, the endogenous money framework provides a structurally superior explanation for modern financialized economies. Hume's model is a special case applicable to commodity money regimes, whereas endogenous money captures the operational reality of credit economies. This verdict is most evident when analyzing the decoupling of asset prices from consumer prices, a phenomenon Hume's quantity theory struggles to accommodate.

  ### I. Reinterpreting Hume's Short-Run Non-Neutrality

  Hume's famous short-run exception to neutrality relies on a specific transmission mechanism: an influx of specie increases spending before prices adjust, stimulating industry because workers and merchants mistake nominal gains for real gains. Crucially, Hume notes that the effect depends on *who* receives the money first. If it falls into the hands of "hoarders," it lies dormant; if it reaches "industrious merchants," it stimulates production.

  Can this be reinterpreted within an endogenous money framework? Yes, but only by stripping away Hume's exogenous premise. In Hume's world, the "entry point" of money is a matter of chance or trade fortune. In an endogenous framework, the "entry point" is a matter of *credit allocation*. When banks extend loans, they create deposits. If banks lend to productive firms (Hume's "industrious merchants"), money enters the real economy, boosting output and employment before price inflation materializes. If banks lend to speculators or consumers for existing assets, money enters the asset sphere.

  Hume's observation that effects depend on "how and where" money enters is the conceptual bridge to endogenous theory. He recognized that money is not a homogeneous fluid that instantly floods all markets equally; it ripples outward from specific injection points. However, Hume treats these injection points as external accidents (a trade surplus, a gold mine). Endogenous money theory internalizes this: the injection point is determined by bank risk appetite and borrower demand. Therefore, Hume's short-run story is compatible with endogenous money only if we view the "influx" not as an external shock of specie, but as an expansion of credit to specific sectors. Hume identified the *friction* (price stickiness/distribution), but endogenous money identifies the *engine* (credit creation).

  **Stance:** Hume's distributional insight is valid and compatible with endogenous money, but his causal story is obsolete. The stimulus comes not from workers being "fooled" by new specie, but from credit enabling real resource mobilization that precedes price adjustments.

  ### II. The Fate of the Specie-Flow Mechanism

  Hume's price-specie-flow mechanism is an elegant equilibrium model: a trade surplus brings in silver $\to$ domestic prices rise $\to$ exports become uncompetitive $\to$ silver flows out $\to$ equilibrium is restored. This relies on two pillars: money is a tradable commodity (gold/silver), and the velocity of circulation is stable enough that more money means higher prices.

  Does this survive the abolition of the gold standard? The strict mechanism does not. In a fiat regime, money does not physically flow across borders to settle trade imbalances; settlements occur via reserve adjustments at central banks, and exchange rates float. If domestic prices rise due to credit expansion, the currency may depreciate rather than causing a physical outflow of money. The "money" (bank deposits) stays domestic; the *value* of the money adjusts externally.

  However, the *logic* of equilibrium survives in a transformed state. The modern analogue to "specie" is not the money supply, but the **exchange rate** and **capital flows**. In Hume's world, the money supply itself was the adjusting variable. In the modern world, the money supply can remain endogenous and expanding, while the exchange rate bears the burden of adjustment. If a country inflates its credit supply excessively, Hume predicts money will leave. Today, capital may flee (selling the currency), causing depreciation, which then raises import prices.

  **Stance:** The specie-flow mechanism is essentially a fixed-commodity argument with no direct modern analogue regarding the money supply. It has been superseded by the monetary approach to the balance of payments, where exchange rates, not specie quantities, act as the equilibrating variable. Hume's mechanism assumes money seeks price arbitrage; modern money seeks yield arbitrage. Consequently, the automatic link between domestic money growth and trade deficits is broken.

  ### III. The Scenario: Credit Boom, Asset Inflation, and Stable CPI

  Consider the scenario: a floating exchange rate country experiences a domestic credit boom. Bank lending expands deposits rapidly. Housing prices skyrocket, but consumer goods prices (CPI) remain stable, and there is no significant money outflow (trade deficit).

  **Hume's Prediction:** Hume's quantity theory suggests that an increase in the quantity of money must eventually raise prices. While he allowed for short-run lags, a "rapid expansion" of deposits should eventually permeate the economy, raising CPI. Furthermore, if domestic prices rise (even in assets, which Hume might conflate with general wealth), exports should suffer, and money should flow abroad to purchase cheaper foreign goods, correcting the imbalance. Hume's framework struggles to explain why the money would stay "trapped" in housing without leaking into goods prices or the trade balance.

  **Endogenous Money Prediction:** This framework explains the scenario naturally. Money is created against collateral. If banks lend primarily against real estate, new deposits are created and spent on housing. This bids up asset prices but does not necessarily increase demand for consumer goods. The money stays in the domestic banking system (one person's mortgage payment is another's deposit). There is no automatic pressure for a trade deficit because the new money is not chasing imports or export-competing goods. The "inflation" is sectoral, not general.

  **Verdict:** The **Endogenous Money** framework best explains this pattern. Hume's theory assumes a uniform velocity and a tendency for money to circulate through all hands (the "water level" analogy). Endogenous money recognizes that circulation is channelized. Money created for asset speculation circulates in the asset sphere; money created for working capital circulates in the goods sphere. The decoupling of asset inflation from CPI is a hallmark of credit-money economies that Hume's commodity-money model cannot account for without ad-hoc adjustments.

  ### Conclusion and Self-Critique

  Hume provided the first rigorous analysis of monetary non-neutrality, but his model was bound by the metallic constraints of his time. Endogenous money theory generalizes his insights about distribution and lags while correcting the causal direction: credit drives money, which drives activity (or asset prices), rather than money driving activity. In the specific scenario of a housing-led credit boom with stable CPI, Hume's expectation of general price inflation and trade correction fails, while endogenous money's sectoral analysis holds.

  **What would change my mind?**
  My verdict on the third question rests on the assumption that asset inflation can remain permanently decoupled from consumer price inflation and external balances. I would change my mind if empirical evidence demonstrated that **sustained domestic credit booms inevitably lead to trade deficits via the wealth effect**, even if CPI remains stable.

  Specifically, if it were shown that housing booms *always* cause residents to feel wealthy enough to increase imports significantly (consuming foreign goods rather than domestic ones), thereby validating Hume's intuition that "money abundance" leads to trade outflows, my assessment would flip. In this case, Hume's equilibrium mechanism would survive not through price arbitrage of goods, but through income/wealth-driven import surges.

  **Where I might be wrong:**
  I am most likely mistaken in underestimating the long-run neutrality of money even in a credit system. It is possible that the "stable CPI" in the scenario is merely a long lag, and that eventually, the excess deposits *do* leak into the goods market or force a currency crisis that imports inflation. If the distinction between "asset money" and "goods money" is more porous than I assume—meaning asset holders eventually cash out and spend on consumption—then Hume's long-run quantity theory may reassert itself, making the endogenous distinction merely a short-term phenomenon. If the long run is where the ultimate causal truth lies, Hume's fundamental intuition that "more money means higher prices/external imbalance" may still hold the final verdict.
