answer: |-
  This is a fascinating meta-philosophical puzzle. Your friend isn't just guessing; she is operating with a coherent, albeit specific, meta-ontological framework. She is distinguishing between **fundamental structure** (facts about the world that hold regardless of human interests) and **conceptual schemes** (ways we carve up the world for pragmatic purposes).

  Here is the breakdown of her likely verdicts, the principle driving them, and how to test it.

  ### Part 1: The Predictions

  Based on her track record, here is how she will likely rule on next week's lineup:

  **1. Do numbers exist? (Platonism vs. Nominalism)**
  *   **Prediction:** **Verbal.**
  *   **Reasoning:** This aligns with her "Tables" and "Holes" verdict. She seems to be an *ontological deflationist* about things that aren't spatiotemporal physical stuff. If tables are just "particles arranged table-wise," numbers are likely just "symbols arranged math-wise." She treats the existence of macroscopic objects as a choice of counting rules; she will likely treat abstract objects the same way.
  *   **The Risk:** If she views math as the "fundamental structure" of the universe (like Time), she might call it Real. But given the "Tables" call, she seems to restrict "Real" to concrete physical reality.

  **2. Is a virus alive? (Biology definition)**
  *   **Prediction:** **Verbal.**
  *   **Reasoning:** This is a slam dunk. It is structurally identical to "Pluto" and "Hotdog." It is a boundary dispute within a classification system created by humans to organize nature. There is no "life substance" (like H2O) that a virus either has or lacks; there is just a cluster of biological traits. She will see this as drawing a line, not discovering a fact.

  **3. Is the mind just the brain? (Identity Theory)**
  *   **Prediction:** **Real.**
  *   **Reasoning:** This is the tricky one, but it aligns with "Water is H2O." She views scientific identities as discoveries about the *stuff* itself, not definitions. If she accepts that water *is* H2O (a posteriori necessity), she should accept that pain *is* neural firing (if the science bears it out). Unlike Tables (which she sees as aggregates), she likely views the Mind/Brain relation as a fundamental identity claim about natural kinds, not a pragmatic way of counting particles.

  ---

  ### Part 2: The Underlying Principle

  You suspected there might be more than one rule fitting her data. You are right. There are two competing principles that explain her past calls, and they diverge on the cases above.

  **Principle A: Natural Kind Realism (The "Kripkean" View)**
  *   **Rule:** Disputes are **Real** if they concern *Natural Kinds* (categories fixed by the intrinsic nature of things, like Water or Time). Disputes are **Verbal** if they concern *Artifacts or Aggregates* (categories fixed by human interest or function, like Planets, Sandwiches, Tables).
  *   **Logic:** Nature decides what water is; we decide what a sandwich is.
  *   **Fits:** Water (Real), Pluto (Verbal), Hotdog (Verbal), Tables (Verbal).
  *   **Tension:** Time isn't a "Natural Kind" in the chemical sense, but she treats it as fundamental structure.

  **Principle B: Fundamental Physicalism (The "Laser" View)**
  *   **Rule:** Disputes are **Real** only if they concern the *fundamental furniture of the physical universe* (particles, fields, spacetime). Disputes are **Verbal** if they concern *higher-level abstractions* (objects, biology, math).
  *   **Logic:** Only physics describes reality "full stop." Biology and everyday objects are just useful maps.
  *   **Fits:** Water (Real - chemistry is fundamental enough), Time (Real - physics), Tables (Verbal - macroscopic), Holes (Verbal - macroscopic), Pluto (Verbal - astronomical classification).

  **Where they come apart:**
  The divergence happens on **Biology** and **Math**.
  *   **Principle A (Natural Kinds)** could allow that "Species" or "Life" are Real, because biological kinds might be discovered, not invented.
  *   **Principle B (Physicalism)** demands that Biology is ultimately Verbal, because it's just complex physics.

  This is why the **Virus** and **Numbers** predictions are your best clues. If she calls Virus **Real**, she is following Principle A. If she calls it **Verbal**, she is following Principle B. (I predicted Verbal because her "Tables" call suggests she is skeptical of higher-level ontology).

  ---

  ### Part 3: How to Smoke Out the Rule

  To figure out which principle she is actually running, you need a case that is **biological but fundamental**, or **abstract but structural**.

  **The Best Test Case: "Do Species Exist?"**
  *   **The Debate:** Realists say species are natural units (like atoms). Nominalists say species are just arbitrary slices of a continuous gene pool (like "tall people").
  *   **Why it works:**
      *   If she says **Real**: She is a **Natural Kind Realist (Principle A)**. She believes science discovers categories, even in biology. This would mean her "Water" verdict drives the bus, not the "Tables" verdict.
      *   If she says **Verbal**: She is a **Fundamental Physicalist (Principle B)**. She believes only the bottom level (physics/chemistry) is real, and everything above that (biology, tables, planets) is just a convenient way of talking.

  **Alternative Test Case: "Are Laws of Nature real, or just regularities?"**
  *   **The Debate:** Is gravity a "force" that *makes* things fall (Real), or just a description of the fact that things *do* fall (Verbal/Regularitarian)?
  *   **Why it works:**
      *   If **Real**: She believes in "governing" structure (aligns with her Time verdict).
      *   If **Verbal**: She believes only *events* are real, not the *rules* (aligns with her Tables verdict).

  ### Summary of Strategy

  1.  **Listen closely to the Virus verdict.** If she hesitates and calls it Real, your "Natural Kind" theory is correct. If she dismisses it instantly as Verbal, your "Physicalist" theory is correct.
  2.  **Bring the "Species" case next week.** It is the perfect wedge. It forces her to choose between "Biology is discovery" (like Water) and "Biology is classification" (like Pluto).
  3.  **Watch the Mind/Brain reaction.** If she calls it Verbal, she is more radical than I predict—she might think *everything* above the particle level is verbal, including consciousness. If she calls it Real, she draws the line at "Scientific Identity."

  Her philosophy is essentially: **"Reality is what physics finds; language is what we use to manage the rest."** Your job is to find out if she thinks biology counts as physics, or just as language.
