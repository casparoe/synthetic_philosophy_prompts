          1.  *Contextualism:* The meaning of "knows" shifts with the conversational context (the attributor's context).
          2.  *Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment:* The meaning of "knows" is fixed, but whether the subject knows depends on their practical stakes.
      *   **Specific Scenario:** A deploy sign-off. Engineer A (low stakes) says "I know it's safe." Engineer B (high stakes, on-call) says "I don't know it's safe."
      *   **Constraints:**
