      *   *2. Contradiction:* Simultaneous claim. I say "You know", You say "I don't". Contextualism = We agree (different propositions). SSI = We disagree (one wrong).
      *   *3. Payoff:* Action-guiding nature of knowledge. Contextualism saves knowledge but makes communication weird. SSI saves communication but makes knowledge fragile. Acknowledge the user's preference for stable knowledge fits better with Invariantism (traditional) or Contextualism, not SSI.

