          *   **Language:** British English (spelling, idiom).

  2.  **Deconstruct the Philosophical Positions:**
      *   **View 1: Contextualism.** (Keith DeRose, David Lewis, Stewart Cohen). The semantic content of "knows" is context-sensitive. The *attributor's* context sets the standard. If I say "S knows," the standard is set by *my* conversational situation.
      *   **View 2: Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment.** (Jeremy Fantl, Matthew McGrath, Jason Stanley). The semantic content of "knows" is invariant (fixed). However, knowledge itself depends on practical factors concerning the *subject*. If the stakes are high for the subject, they need more evidence to know.
      *   **The User's Confusion:** They feel the verdicts (true/false) often align in intuitive cases. They want to know where they diverge and why the distinction matters theoretically.

  3.  **Drafting the Response - Section by Section:**

