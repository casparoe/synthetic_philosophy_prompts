  6.  **Final Polish:** (Mental check of the Hofstadter details).
      *   Essay title: 'A Person Paper on Purity in Language'.
      *   Publication: *Scientific American* (Metamagical Themas column), 1985. Not a linguistics journal.
      *   Core argument: Language shapes thought (Sapir-Whorf lite), but primarily through habit.
      *   The 'height' analogy: 'he' = tall, 'she' = short. Generic = tall.
