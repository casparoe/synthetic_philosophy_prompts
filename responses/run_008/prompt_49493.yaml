      *   *Critique:* Did I address Dworkin?
      *   *Fix:* Mention "critical interests" implicitly or explicitly to show the philosophers I've done the reading, but pivot to the fiduciary duty.
      *   *Critique:* Is the hard choice acknowledged?
      *   *Fix:* Explicitly state that this framework doesn't dissolve the tension, it just manages it.

  6.  **Writing the Speech (Iterative Process):**
      *   *Opening:* Good morning. Thank you for coming. The "Contented Patient."
      *   *The Problem:* Mrs Jones. Lucid then, happy now. Directive says stop treatment, she accepts it.
      *   *The Camps:* Nursing (comfort), Legal (binding), Philosophy (narrative).
      *   *The Pivot:* We need a middle way. Not a Sovereign, not a mere Adviser. A Fiduciary.
      *   *Explanation:* A trustee manages assets for a beneficiary. The past self managed the future self's values. They had the 'view from nowhere' (overview). But a trustee must act in the beneficiary's best interest *now* if things change unexpectedly.
      *   *Application:* The directive is a strong presumption. But if the 'trust' (the patient's wellbeing) is threatened by rigid adherence, we have a duty to review.
      *   *The Hard Truth:* This doesn't make it easy. It just makes the conflict honest.
