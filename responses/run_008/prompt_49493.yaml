          *   Lawyers: Directives are binding (autonomy/legal risk).
          *   Philosophers (Dworkin): Critical interests/Life as a narrative whole.
      *   **Proposed Framing:** The "Fiduciary Model." The earlier self is a trustee/fiduciary for the later self. Instructions have weight (overview position) but aren't absolute (open to reconsideration if circumstances change unforeseeably).
      *   **Goal:** Justify the committee's current pragmatic stance (directive matters but isn't the end of the conversation) with a theoretical framework.
      *   **Tone:** British English, comprehensible to clinicians but respectful to philosophers, acknowledge the difficulty (no easy answers), provide concrete questions for breakout sessions.
      *   **Length:** Roughly 5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct the "Fiduciary" Metaphor:**
      *   *Standard Legal Fiduciary:* One party acts in the best interest of another, holding power in trust.
      *   *Application here:* The "Past Self" (Settlor/Trustee) acts for the "Future Self" (Beneficiary).
      *   *Strength:* Acknowledges the authority of the past self (they planned ahead) without making them a tyrant (sovereign). Acknowledges the welfare of the present self without making them the sole arbiter.
      *   *Nuance:* A trustee can deviate from strict instructions if the *spirit* of the trust demands it due to changed circumstances (cy-près doctrine equivalent, though maybe too technical to name-drop).
      *   *Challenge:* How to explain this simply without losing the philosophical rigour? Focus on "stewardship" and "oversight."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Welcome everyone, acknowledge the tension. Define the "Contented Patient Problem" clearly but empathetically.
      *   **The Conflict:** Briefly summarise the three prevailing views (Nurses, Lawyers, Philosophers) to show understanding of the room's composition.
      *   **The Proposed Frame:** Introduce the "Fiduciary" or "Stewardship" model. Explain *why* it fits better than "Sovereign" or "Adviser."
      *   **Implications:** What does this mean for practice? It means the directive is a strong presumption, not a blind command. It requires interpreting the *intent* in light of current *welfare*.
      *   **Acknowledging Difficulty:** Don't promise a magic solution. Admit that sometimes the trustee's instruction and the beneficiary's comfort will genuinely clash.
      *   **Conclusion & Questions:** Summarise the aim of the day. Pose 1-2 concrete questions for the breakout groups.

  4.  **Drafting - Tone and Language (British English):**
      *   Use "programme," "centre," "prioritise," "whilst," "modelling."
      *   Avoid overly American idioms.
      *   Maintain a tone of professional collegiality—authoritative but collaborative.
      *   Ensure it sounds spoken (rhythm, pauses, direct address).

  5.  **Drafting - Content Refinement (Self-Correction during the process):**
