answer: |-
  Good morning, and welcome to you all. Colleagues from the wards, from legal counsel, from philosophy, and from the committee itself. Thank you for giving this day your time.

  We are here to discuss a pattern that many of you will recognise, perhaps too well. In the notes, we are calling it the 'Contented Patient Problem'. It arises when a patient, while fully lucid, executes an advance directive. Often, this is done in the shadow of a parent's decline, with a fierce determination not to endure a similar fate. They instruct us: *If I reach this stage of impairment, withhold this treatment.*

  Years pass. The stage is reached. But the patient we meet is not the suffering figure the earlier self imagined. She is settled. She finds pleasure in the garden, in music, in the routine of care. She accepts the very treatments her directive forbids.

  This creates a fracture in our team. Our nurses and palliative colleagues look at the person in the bed and argue that present comfort must count heavily against enforcing the document. Our legal counsel looks at the signature and warns that the directive is a binding exercise of autonomy; to ignore it is to invite liability. And our philosophical colleagues, drawing on thinkers like Ronald Dworkin, remind us that a life has a narrative structure; the earlier self has a stake in how the story ends, not just in how the final chapter feels.

  For some time, this committee has occupied a pragmatic middle ground. We tend to say that the directive matters a great deal, but it is not necessarily the end of the conversation. It is a position that feels right to us, yet we have lacked a theory to justify it. We have been acting on intuition. Today, I propose we give that intuition a name.

  I suggest we view the earlier self not as a sovereign whose word is law, nor as a mere adviser whose instructions evaporate upon contact with reality. Instead, I propose we view the earlier self as a *fiduciary*.

  In law and ethics, a fiduciary is a trustee. They hold power not for their own sake, but for the benefit of another—the beneficiary. In this context, the lucid patient is the settlor of the trust; the future, impaired patient is the beneficiary.

  Why does this help? Because it captures the authority of the directive without making it absolute. A fiduciary is appointed because they have a capacity for oversight that the beneficiary currently lacks. The earlier self had a 'view from the overview'. They could see the trajectory of the illness and the values at stake in a way the confused, present self cannot. Their instructions deserve great weight precisely because they were adopted from that position of clarity and stewardship.

  However, a fiduciary's duty is ultimately to the *interest* of the beneficiary, not merely to the rigid letter of the trust document. If circumstances change in ways the settlor could not have foreseen—if the 'trust assets', in this case the patient's lived experience, are fundamentally different from what was projected—the trustee has a duty to reconsider.

  This framing allows us to say that the directive creates a strong presumption. It is not a suggestion. But it is also not a suicide pact. It acknowledges that the earlier self was acting *for* the later self, and if the later self's reality is one of unexpected contentment, strict adherence might actually violate the fiduciary duty of care.

  I do not pretend this dissolves the tension. It does not. There will still be hard choices. There will be cases where the 'contentment' is fleeting or delusional, and cases where the directive reflects a deeply held moral conviction that transcends momentary comfort. This framework does not give us an algorithm; it gives us a language for the conflict. It allows us to honour autonomy without worshipping it, and to prioritise welfare without patronising the past.

  As we move into our small-group sessions, I want to leave you with two questions to test this framing against your clinical realities.

  First: In the fiduciary model, deviation from the trust is permitted when circumstances are 'unforeseen'. In the context of dementia, what counts as a genuine change of circumstance, rather than simply the patient adapting to the very fate they sought to avoid? Where is that line?

  Second: If the earlier self is a trustee, who speaks for the beneficiary now? Is it the family? Is it the clinical team observing their comfort? Or is there a sense in which the contented patient, in their own way, is speaking for themselves?

  We do not need to resolve these today. But if we can agree on the nature of the relationship between the self that wrote the note and the self that lives with it, we will have made significant progress.

  Thank you. Let us begin.
