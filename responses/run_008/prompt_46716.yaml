prompt: |-
  Compare the self-sampling assumption (SSA) and the self-indication assumption (SIA) as rival principles for reasoning from self-locating evidence. Begin by stating each principle in your own words, and show how SSA generates the halfer answer in the Sleeping Beauty problem while SIA generates the thirder answer. Then assess how the two principles fare under two further pressures: the Doomsday Argument, which SSA appears to endorse, and Bostrom's Presumptuous Philosopher case, which seems an embarrassment for SIA. Finally, consider a variant designed to isolate what is really at stake: Beauty is awakened exactly once no matter how the coin lands — on Monday if it lands heads, and if it lands tails, on a day chosen by an independent fair coin — and she knows the whole setup but cannot tell which day it is when she wakes. Here SSA and SIA agree that the probability of heads is one-half, which suggests the halfer/thirder dispute may reduce to a prior choice about which entities count as candidates in the first place (whole experiments versus individual awakenings), a choice that neither principle appears to settle on its own. Assess whether SSA or SIA can nonetheless give a principled answer to this reference-class question, or whether the dispute between them must be decided on grounds external to both. Please structure your reply with the following sections, in this order: 'The two principles' (roughly 150 words), 'Sleeping Beauty under each' (roughly 150 words), 'Doomsday and the Presumptuous Philosopher' (roughly 200 words), 'The one-awakening variant' (roughly 200 words), and 'Verdict' (roughly 100 words).
