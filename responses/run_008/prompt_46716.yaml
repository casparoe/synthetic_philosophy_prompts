  ### The two principles

  The Self-Sampling Assumption (SSA) instructs agents to reason as if they are a random sample drawn from the set of all actual observers within a specific reference class. It treats one's existence as fixed, focusing on locating oneself within the actual world. Conversely, the Self-Indication Assumption (SIA) suggests reasoning as if one is a random sample from the set of all *possible* observers. SIA weights hypotheses by the number of observers they predict; hypotheses entailing more observers like you receive a probabilistic boost simply because there are more "slots" for you to occupy. While SSA conditions on being an observer in the actual world, SIA conditions on being a possible observer, effectively favoring larger worlds. These principles diverge sharply when the number of observers depends on the hypothesis being tested, leading to conflicting updates on self-locating evidence regarding one's world.

  ### Sleeping Beauty under each

  In the Sleeping Beauty problem, a coin flip determines whether Beauty wakes once (Heads) or twice (Tails). SSA yields the 'halfer' answer (P(Heads)=1/2). Under SSA, Beauty reasons she is a random sample from actual awakenings in her specific experiment. Since she exists in both Heads and Tails worlds, waking provides no new evidence about the coin; the probability remains the prior 1/2. She treats waking as guaranteed. SIA yields the 'thirder' answer (P(Heads)=1/3). SIA weights hypotheses by the number of observers. The Tails hypothesis predicts twice as many awakenings as Heads. Therefore, finding oneself awake is twice as likely under Tails. SIA updates the prior odds (1:1) by the likelihood ratio (1:2), resulting in a 1/3 probability for Heads. Thus, SSA ignores observer count differences across worlds, while SIA leverages them to shift credence.

  ### Doomsday and the Presumptuous Philosopher

  These principles face significant counterexamples that highlight their respective excesses. SSA appears to endorse the Doomsday Argument. If you assume you are a random sample from all humans who will ever live, finding yourself among the early billions suggests the total number of humans will be relatively small, implying imminent extinction. This seems to derive a catastrophic empirical conclusion from purely indexical reasoning, ignoring actual demographic data. Conversely, SIA faces the 'Presumptuous Philosopher' objection. Imagine two theories of physics: one predicts a trillion observers, the other a trillion trillion. SIA dictates you should be overwhelmingly confident in the larger universe simply because it contains more observers, even without empirical evidence. This allows armchair reasoning to settle scientific questions about universe size. SSA avoids presumptuousness but invites doom; SIA avoids doom but becomes presumptuous. Both seem to license implausible inferences: SSA makes extinction likely a priori, while SIA makes vast universes certain a priori. The choice involves trading one counterintuitive consequence for another, suggesting neither captures self-locating reasoning perfectly. Proponents often seek hybrid views to mitigate these extremes.

  ### The one-awakening variant

  Consider a variant where Beauty wakes exactly once regardless of the coin. If Heads, she wakes Monday. If Tails, a separate coin flip decides Monday or Tuesday. Here, the total number of awakenings is constant (one per experiment). Both SSA and SIA yield P(Heads)=1/2. SSA sees no difference in observer count across hypotheses. SIA sees no difference in possible observer slots. This agreement suggests the core halfer/thirder dispute isn't about the logic of updating, but about defining the reference class: do we count whole experiments or individual awakenings? In the original problem, SSA treats the experiment as the unit (halfer), while SIA treats awakenings as units (thirder). However, neither principle internally dictates which reference class is correct. SSA requires an exogenous definition of 'observers', and SIA requires defining 'possible observers'. Without external criteria to select the relevant reference class, the principles remain incomplete. They function as updating rules relative to a class, not as metaphysical guides for carving reality. Thus, the disagreement may stem from prior metaphysical commitments about personal identity rather than the probabilistic principles themselves. The variant reveals that observer count differences drive the divergence, not the sampling logic. Thus, the principles are tools dependent on prior ontological choices.

  ### Verdict

  Neither SSA nor SIA solves the reference class problem on its own. They are conditional norms: *if* this is your class, *then* reason thus. The halfer/thirder debate persists because each side implicitly adopts a different ontology of observers. SSA aligns with a view where the experimental setup defines identity, while SIA aligns with momentary experiences. Since the principles cannot adjudicate this metaphysical choice, the dispute must be decided on grounds external to both, such as theories of personal identity. Without external commitments, the principles remain silent.
