answer: |-
  This is a classic predicament in penal theory, often described as the "hybrid theorist's burden." Your intuitions are not random; they map remarkably well onto a specific, sophisticated strand of modern criminal law theory that attempts to synthesize retributive constraints with consequentialist aims. You are not confused; you are a **Constrained Consequentialist with Expressive Commitments.**

  However, your "Speeder" intuition is a outlier that threatens the coherence of the whole system. Below is the precise formulation of the principle that best captures your data, the mapping of your cases, the necessary critique, and the resolution of your AI dilemma.

  ### I. The Principle: "Guilt-Constrained Expressive Utility"

  **Statement:** *The state is justified in imposing punishment to maximize social welfare (deterrence, incapacitation), subject to three absolute constraints: (1) The Subject Constraint (only the culpably guilty may be punished), (2) The Proportionality Constraint (punishment severity must not grossly exceed the gravity of the wrong), and (3) The Truth Constraint (punishment must accurately reflect the moral wrong committed).*

  **The Clauses:**
  1.  **Utility Maximization:** Severity can be modulated to achieve deterrence or social safety.
  2.  **Subject Constraint:** Innocence is an absolute bar (no scapegoating).
  3.  **Proportionality Constraint:** Punishment must fit the crime (prevents exemplary punishment).
  4.  **Expressive/Truth Constraint:** Punishment must communicate the correct moral censure (handles luck, atrocity, and fines).

  ### II. Mapping Your Verdicts to the Clauses

  *   **Drunk Driver / Would-Be Murderer (Outcome Luck):** Motivated by the **Expressive/Truth Constraint**. In this view, the "wrong" is not just the mental state but the *actual violation of rights*. A dead child is a greater objective wrong than a surviving one, even if culpability is identical. The punishment expresses the gravity of the *actual* harm done.
  *   **Day Fines (CEO vs. Cashier):** Motivated by the **Expressive/Truth Constraint**. For punishment to be expressive and deterrent, the *impact* must be equivalent, not the nominal amount. A $500 fine is a nuisance to one and catastrophic to the other; equal impact ensures equal censure.
  *   **Elderly One-Off Offender (Deserves Sentence):** Motivated by the **Subject Constraint** + **Utility**. He is guilty (Subject), and while utility (deterrence) is low, the retributive debt remains.
  *   **Scapegoat (Innocent):** Motivated by the **Subject Constraint**. This is your hard deontological floor. No amount of utility overrides the prohibition on punishing the innocent.
  *   **Assault vs. Camp Guard (Stale Crimes):** Motivated by the **Expressive/Truth Constraint**. Ordinary crimes lose their expressive urgency over time (rehabilitation implies the message was received). *Mala in se* atrocities (crimes against humanity) carry a timeless moral weight; the "truth" of the wrong does not fade, so the censure must remain potent.
  *   **The Speeder (Exemplary Punishment):** Motivated by **Utility Maximization**. (This is the problem child).

  ### III. The Critique: Which Verdict to Overturn

  You suspect your tentative theory ("desert floor, modulate for deterrence") cannot survive the tension between the **Scapegoat** and the **Speeder**. You are correct.

  **You must overturn the Speeder verdict.**

  **Why:** Your rejection of the Scapegoat case relies on a deontological commitment to human dignity: individuals are ends in themselves, not means to social safety. If you accept that principle, you cannot consistently punish the *guilty* speeder disproportionately either. To punish the speeder "way out of proportion" is to use them *solely* as a means to deter others.

  If you allow exemplary punishment for the guilty, the distinction between the guilty speeder and the innocent scapegoat becomes one of degree, not kind. Both are being sacrificed for the greater good. The only way to maintain the absolute prohibition on scapegoating is to accept a **Proportionality Ceiling** (a retributive limit) that applies to the guilty as well. You can punish *up to* desert for deterrence, but never *beyond* it.

  **Revision:** Adopt the **"Desert as a Ceiling"** view. Punishment can be *less* than desert for mercy/rehabilitation (your Assault case), but never *more* than desert for deterrence (your Speeder case).

  ### IV. The AI Detection Case

  **The Scenario:** A jurisdiction with near-perfect AI detection (100% certainty) wants to lower all punishments to trivial slaps on the wrist, arguing that $Probability \times Severity = Constant Deterrence$.

  **The Verdict under "Guilt-Constrained Expressive Utility":**
  **No, this is not fine.** You should reject the trivialization of punishment, and your "awful" feeling is theoretically justified.

  **The Reasoning:**
  1.  **Failure of the Expressive Constraint:** Punishment is not merely a price system for behavior regulation (Becker's economic model); it is a moral communication. Reducing a serious assault to a "trivial slap" fails to communicate the gravity of the wrong. It equates a violent crime with a parking violation. Even if detection is perfect, the *censure* must match the *crime*.
  2.  **Failure of the Truth Constraint:** If the state imposes a trivial penalty for a serious wrong, it is effectively lying about the moral significance of that wrong. It undermines the normative order.
  3.  **The Camp Guard Intuition:** Recall your intuition on the Camp Guard. You demanded full prosecution despite the passage of time because the *nature of the atrocity* demanded a proportional response. The same logic applies here. The severity of the punishment validates the severity of the victim's suffering. To minimize the penalty is to minimize the wrong.

  **Conclusion:**
  Your intuitions identify you as a **Retributivist about Distribution** (who gets punished and how much, roughly) and a **Consequentialist about General Justification** (why we have the system), but with a heavy **Expressive Overlay**.

  The AI case reveals that you value punishment as **condemnation**, not just **control**. If you reduce punishment to a mere price, you lose the ability to distinguish between a tax and a penalty. Your gut tells you that a society that treats rape or assault as a trivial fee, even with perfect enforcement, is a society that has lost its moral compass. Trust that feeling. It is the Expressive Constraint protecting you from a purely technocratic utilitarianism.

  **Summary Advice for your Dissertation:**
  1.  Formalize the **Proportionality Ceiling** to resolve the Speeder/Scapegoat tension.
  2.  Lean into **Expressive Theory** (Duff, Von Hirsch) to explain the Luck and Camp Guard cases.
  3.  Use the **AI Case** as a reductio ad absurdum against pure economic deterrence models in your literature review. It perfectly demonstrates why "Price vs. Penalty" matters.
