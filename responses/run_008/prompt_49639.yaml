      *   **Elena:** Represents the *Republican Liberty* tradition (think Pettit, Skinner, ancient Rome). Freedom is *non-domination*. It's not just about non-interference; it's about not being subject to the arbitrary will of another. A slave with a kind master is still a slave.
      *   **The Core Conflict:** Is freedom the *absence of interference* or the *absence of the power to interfere arbitrarily*?

  3.  **Evaluate Each Move:**

      *   *Marcus Move 1 (Nothing done, anxiety $\neq$ constraint):* Philosophically consistent with Negative Liberty. Practically, it ignores the chilling effect of potential power.
