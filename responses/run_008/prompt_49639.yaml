      *   **Elena's Position (Republican Liberty/Domination-based):** Freedom is the absence of arbitrary power/domination. The *capacity* to interfere arbitrarily matters, not just the exercise. Institutionalized power is different from random aggression. Self-censorship is a rational response to domination, not a quirk. Dependence on goodwill $\neq$ freedom.
