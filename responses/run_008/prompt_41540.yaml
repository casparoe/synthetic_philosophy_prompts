      *   *The Menu:* Structure clearly. Use labels like "The Weak Reading," "The Procedural Reading," etc.
      *   *Critique:* For each, answer: Is it true? Does it justify the bans?
      *   *The Asymmetry Analysis:* This is the crux. Explain *why* the principle wasn't applied to the ban. (The ban isn't seen as an "activity raising threats" in the political ontology of the panel).
      *   *Conclusion:* Summarize the philosophical verdict. The PP is often a "stopper" not a "guide."

  7.  **Refining the Philosophy:**
      *   Need to reference decision theory (loss functions, as the user noted).
      *   Need to reference the "Paralysis Problem" (if PP applies to everything, nothing happens).
      *   Need to distinguish between *epistemic* uncertainty (we don't know) and *normative* judgment (how much risk is too much).
      *   *Self-Correction on Tone:* Ensure I don't talk down to an ecotoxicologist. Use terms like "Type I/II errors," "null hypothesis," "burden of proof."

  8.  **Final Polish:**
