prompt: |-
  I'm a retired ecotoxicologist -- spent about 30 years doing pesticide risk assessments for a state agency, and now that I finally have time I've fallen down the philosophy of science rabbit hole instead of doing real work. Something keeps nagging at me. All through the 90s and 2000s, whenever our advisory panel wanted to restrict a chemical on thin evidence, someone would invoke the precautionary principle, usually via the Wingspread statement: "When an activity raises threats of harm to human health or the environment, precautionary measures should be taken even if some cause and effect relationships are not fully established scientifically." We all nodded along. But looking back, I don't think the people nodding actually agreed with each other. The toxicologists seemed to mean something like shifting the burden of proof onto the proponent, the NGO reps on the panel meant something closer to "if in doubt, ban," and one lawyer seemed to use it to mean only that uncertainty breaks ties in favor of the stricter option -- which, now that I think about it, sounds like a claim about the shape of our loss function rather than a decision rule at all. And I've also noticed the principle somehow never got applied to the replacement chemicals we waved through, or to the precautionary measures themselves (a ban is an "activity" too, last I checked). So help me pull that sentence apart: what are the distinct precise claims it could be making, from the trivially true to the genuinely radical, and for each one, is it defensible, and would it actually license the stuff we did with it? Lay the readings out as a menu I can chew on, with your verdicts on each, and tell me which reading is doing the real work when the principle gets invoked against a new pesticide but never against banning it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired ecotoxicologist (30 years experience), state agency risk assessment background. Deeply familiar with pesticide regulation, advisory panels, NGOs, legal arguments, and the practical application of the Precautionary Principle (PP).
      *   **Current State:** Retired, exploring philosophy of science, critical of past practices, noticing inconsistencies in how the PP was applied (asymmetry between new chemicals and bans/replacements).
      *   **Core Question:** Deconstruct the Wingspread Statement definition of the Precautionary Principle ("When an activity raises threats of harm... precautionary measures should be taken even if some cause and effect relationships are not fully established scientifically.").
      *   **Specific Tasks:**
          1.  Identify distinct precise claims/readings of that sentence (from trivial to radical).
          2.  Evaluate defensibility of each reading.
          3.  Evaluate whether each reading licenses the actual regulatory actions taken (banning on thin evidence, ignoring replacements, etc.).
          4.  Identify which reading is actually doing the "real work" in the observed asymmetry (applied to pesticides, not bans).
      *   **Tone:** Intellectual, respectful of expertise, analytical, slightly critical but nuanced (matching the user's "rabbit hole" vibe). Avoid oversimplification; this user knows the science and the bureaucracy.

  2.  **Deconstruct the Wingspread Statement:**
      *   *Clause 1:* "When an activity raises threats of harm..." (Trigger condition: Threat exists, magnitude/probability uncertain).
      *   *Clause 2:* "...precautionary measures should be taken..." (Action: Intervention).
      *   *Clause 3:* "...even if some cause and effect relationships are not fully established scientifically." (Epistemic condition: Uncertainty is not a bar to action).

  3.  **Brainstorm Readings (The "Menu"):**
      *   *Reading 1: The Procedural/Trivial Reading.* Just means "don't wait for 100% certainty." It's a reminder that science is never complete.
      *   *Reading 2: The Burden-Shifting Reading.* Proponent must prove safety, not regulator prove harm. (User mentioned this).
      *   *Reading 3: The Tie-Breaker Reading.* If evidence is equivocal, choose the safer path. (User's lawyer friend).
      *   *Reading 4: The Maximin/Zero-Risk Reading.* "If in doubt, ban." Avoid the worst-case scenario at all costs. (User's NGO reps).
      *   *Reading 5: The Proportionality Reading.* Measures must match the threat and uncertainty. (Often implied but ignored).
      *   *Reading 6: The Reflexive/Symmetric Reading.* Apply PP to the *remedy* (the ban or replacement) as well as the *problem*. (User's key critique).

  4.  **Evaluate Each Reading (Defensibility & Licensing):**
      *   *Trivial:* Defensible (science is uncertain). Does it license bans? No, too weak.
      *   *Burden-Shifting:* Defensible in high-stakes contexts. Licenses bans? Yes, effectively stops approval.
      *   *Tie-Breaker:* Defensible as decision theory. Licenses bans? Only in close calls.
      *   *Maximin:* Controversial (paralysis risk). Licenses bans? Yes, aggressively.
      *   *Reflexive:* Highly defensible logically, but rarely practiced. Licenses bans? Only if the ban is safer than the status quo.

  5.  **Address the Asymmetry (The "Real Work"):**
      *   Why was it used against pesticides but not bans?
      *   It functions as a *rhetorical trump card* rather than a consistent decision rule.
      *   It hides a value judgment (status quo bias vs. change bias) behind a veil of scientific caution.
      *   The "Activity" in Wingspread is selectively defined. Pesticide application = Activity. Regulatory ban = Duty/Correction.

  6.  **Drafting the Response (Iterative refinement):**
