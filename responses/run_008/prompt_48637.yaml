  (1) Verdict
  Overall, your brother's summary is a competent popularization but simplifies nuanced philosophical claims into rigid stages. It captures the iconic "tower" metaphor and the core mechanisms of each level accurately enough for casual conversation. However, it misrepresents the relationship between the levels as replacements rather than layers, and it overstates the link between language and consciousness as a binary switch. While useful as a heuristic, presenting it as strict doctrine without caveats would invite criticism from knowledgeable Dennett scholars. It is a good sketch, but not a precise map.

  (2) What my brother got right
  Clearly, your brother correctly identifies the four categories Dennett uses in *Kinds of Minds* and *Darwin's Dangerous Idea*. The characterization of Darwinian creatures as relying on phylogenetic selection and Skinnerian creatures as utilizing operant conditioning within a lifetime is indeed accurate. He also rightly attributes the famous Popperian slogan about letting hypotheses die in our stead to Dennett's third level, capturing the essence of internal simulation. Furthermore, identifying Gregorian creatures with tool-use and specifically language aligns with Dennett's emphasis on memes and cultural transmission. The general trajectory from rigid instinct to flexible intelligence is faithful to Dennett's evolutionary story. These core definitions provide a very solid scaffold for understanding Dennett's naturalistic approach to cognition without invoking dualism. It is a robust summary of the basic taxonomy. The distinction between genetic and cultural evolution is now well noted.

  (3) Where it goes wrong
  The first error is the "outcompete" claim. Dennett views these as layered competences within a single organism, not distinct species replacing one another. Humans are still Darwinian and Skinnerian creatures; we do not shed lower levels as we ascend. A Popperian creature does not merely test plans systematically; it requires an internal model of the world to simulate outcomes, requiring complex internal modeling. Regarding language and consciousness, Dennett argues consciousness arises from the serial processing enabled by language (the "Joycean Machine"), but he does not claim thought is *unconscious* before language. Rather, human consciousness is a specific user-illusion constructed via language. Animal minds differ in kind, not just presence. Finally, the developmental reading is problematic. A human baby is not a "purely Darwinian creature" at birth; infants possess innate learning mechanisms. Ontogeny does not strictly recapitulate phylogeny here. The tower represents evolutionary history and architectural layers, not a staircase a baby climbs and leaves behind. Your brother presents these as discrete stages of replacement, whereas Dennett sees them as accumulative layers of control. Gregorian creatures are defined by meme-transmission via tools, with language as the primary vehicle.

  (4) What I can safely retell
  Ultimately, to clearly present this safely, frame the tower as an architectural metaphor rather than a developmental staircase. Explain that Dennett proposes four overlapping competences: genetic hard-wiring, individual conditioning, internal simulation, and cultural tool-use. Emphasize that higher levels incorporate lower ones; humans retain Darwinian instincts and Skinnerian habits while utilizing Popperian planning and Gregorian language. You can mention that Dennett links consciousness to the linguistic serialization of information, but note this is a specific theoretical claim about human self-awareness, not the existence of thought itself. Present the model as a way to naturalize mind without magic, showing how complexity accumulates through evolutionary design rather than distinct species replacing each other. This preserves the insight while avoiding the categorical errors your brother now introduced. This allows discussion of cognitive evolution without committing to strict biological determinism. Your group will very appreciate the nuance regarding layers versus stages.
