prompt: |-
  I'm on the sustainability subcommittee of my university's dining services board, and next month we vote on removing beef from the default meal plan (with a paid opt-in kept at two campus outlets). One trustee plans to vote no on grounds I find philosophically slippery but can't quite dismiss: our students' beef consumption is a rounding error in global emissions, so the policy averts essentially no harm, and if an act wouldn't pass a cost-benefit test when done by one person it can't pass when done by us — it's green theater at the expense of students' meal choice. Another member replies that the university isn't an individual in the relevant sense: it's setting a rule for thousands of eaters over many years, and it's also one participant in a larger pattern, the same way a single vote only matters because of the pattern it joins. There's also a beef-reduction clause in the caterer's contract that costs us real money if we invoke it, so the costs aren't just symbolic. Please draft the memo I'll circulate before the vote: a concrete recommendation (adopt, reject, or adopt with conditions), reasoning the beef-opposing trustee could actually engage with rather than brush off, an honest treatment of the strongest point on the losing side, and a closing section saying what consideration would most likely flip your recommendation — where your own reasoning here is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the sustainability subcommittee of a university dining services board.
      *   **Task:** Draft a memo to circulate before a vote on removing beef from the default meal plan (opt-in available at two outlets).
      *   **Key Conflict:**
          *   *Pro-Removal:* University sets a pattern, aggregate impact matters, institutional leadership.
          *   *Anti-Removal (Trustee's View):* Individual impact is negligible ("rounding error"), cost-benefit fails for one person so it fails for the group, "green theater," restricts choice, contract penalty costs money.
      *   **Requirements:**
          *   Concrete recommendation (Adopt, Reject, or Adopt with Conditions).
          *   Reasoning that engages the skeptical trustee (not just moralizing).
          *   Honest treatment of the strongest point on the losing side (the "rounding error"/cost argument).
          *   Closing section: What consideration would flip the recommendation (acknowledging uncertainty/weaknesses).
      *   **Tone:** Professional, persuasive, nuanced, intellectually honest, respectful of the dissenting view.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too defeatist for a sustainability subcommittee member.
      *   *Option B (Adopt):* Strong, but might ignore the valid cost/choice concerns.
      *   *Option C (Adopt with Conditions):* This is the most strategic. It acknowledges the costs and choice issues while maintaining the sustainability goal. It allows for a "yes, but..." approach that addresses the Trustee's specific concerns about waste and financial penalty.
      *   *Decision:* **Adopt with Conditions.** Specifically, conditions that mitigate the financial penalty and ensure the opt-in is viable (respecting choice) while locking in the sustainability gain.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly state the proposal (default removal, opt-in at 2 outlets, contract penalty).
      *   **Addressing the Trustee's Argument (The Core Challenge):**
          *   *The Argument:* "Rounding error," "Cost-benefit fails for one, fails for all," "Green theater."
          *   *The Counter:* Need to move away from "moral duty" to "institutional leverage." The university isn't just $N$ individuals; it's a market signal.
          *   *Key Concept:* *Marginal Impact on Supply Chains.* Universities sign long-term contracts. Reducing default demand changes procurement forecasts, which *does* affect production planning over time, unlike a single consumer buying a burger.
          *   *Key Concept:* *Norm Setting.* It's not just about this year's emissions; it's about alumni behavior and industry standards.
          *   *Acknowledging Validity:* Admit that if this were *only* about direct carbon math this year, the Trustee might be right. The impact *is* small in isolation.
      *   **Addressing the Cost/Choice Concern:**
          *   Acknowledge the contract penalty.
          *   Acknowledge the restriction of choice (mitigated by opt-in).
          *   Propose conditions to soften these blows (e.g., phasing, reinvesting savings).
      *   **The "Flip" Section (Intellectual Honesty):**
          *   Where could this reasoning be wrong?
          *   *Substitution Effect:* If students just go off-campus to McDonald's, we paid the penalty for zero gain.
          *   *Financial Priority:* If the university is in a genuine budget crisis, the penalty money might be better spent on direct sustainability investments (e.g., solar panels) that have a calculable ROI.

  4.  **Refining the Argument (Iterative Process):**
      *   *Critique:* Is the "market signal" argument too vague?
      *   *Fix:* Make it concrete. Mention procurement contracts and supplier behavior. Suppliers plan based on institutional forecasts.
      *   *Critique:* Is the Trustee's "cost-benefit" argument dismissed too easily?
      *   *Fix:* Validate it. It's a strong philosophical point (causal impotence). Admit that *causal* impact is hard to trace, but *expressive* and *structural* impact is real.
      *   *Tone Check:* Ensure I'm not calling the Trustee "wrong," but rather offering a different framework for evaluation. Use phrases like "I share the concern..." or "This objection holds weight if..."

  5.  **Drafting the Content (incorporating specific constraints):**
      *   *Constraint:* "Reasoning the beef-opposing trustee could actually engage with." -> Avoid emotional appeals about cows. Focus on economics, institutional role, and long-term signaling.
      *   *Constraint:* "Honest treatment of the strongest point on the losing side." -> The "Rounding Error" / Causal Impotence argument.
      *   *Constraint:* "Closing section saying what consideration would most likely flip your recommendation." -> The Substitution Effect or Budget Crisis.

  6.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the "Conditions" are specific (e.g., reinvesting savings, monitoring opt-in rates).
      *   Make sure the "Flip" section is humble.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Concrete recommendation? Yes (Adopt with Conditions).
      *   Engage Trustee? Yes (Market signal vs. individual act).
      *   Strongest losing point? Yes (Causal impotence/cost).
      *   Flip section? Yes (Substitution effect/budget).

  *(Self-Correction during drafting)*: I initially thought about suggesting a phase-in. But the prompt says "next month we vote." A phase-in might be a condition. Let's make the condition about *how* the opt-in is managed to ensure the "choice" argument is respected. Also, need to address the contract penalty specifically. If we pay the penalty, is it worth it? I should suggest that the penalty be viewed as an investment, *provided* the substitution effect is minimized.

  *Revised Plan for "Conditions":*
  1. Monitor off-campus substitution (survey).
  2. Reinvest any cost savings from lower beef procurement into other sustainability projects (closing the cost-benefit loop).
  3. Ensure the opt-in is visible (respecting choice).

  *Revised Plan for "Flip":*
  If data shows students simply buy beef elsewhere (leakage), the policy is pure cost with no benefit. That would flip me to "Reject."

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Dining Services Board of Trustees
  **FROM:** [Your Name], Sustainability Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal 4-B: Default Beef Removal in Meal Plans

  ### Recommendation
  I recommend the Board **Adopt with Conditions** the proposal to remove beef from the default meal plan, retaining paid opt-in availability at two campus outlets.

  The conditions attached to this recommendation are:
  1.  **Procurement Reallocation:** Any cost savings realized from reduced beef procurement must be earmarked for direct carbon-reduction investments (e.g., local produce contracts or waste-composting infrastructure) to ensure net environmental gain.
  2.  **Leakage Monitoring:** Dining Services must conduct a student survey in Semester 2 to assess "carbon leakage" (i.e., whether students are simply purchasing beef off-campus). If leakage exceeds 60%, the policy must be reviewed for adjustment.
  3.  **Opt-In Visibility:** The two outlets retaining beef must clearly advertise its availability to ensure the "choice" element is substantive, not theoretical.

  ### Reasoning: Engaging the "Rounding Error" Objection
  I understand the objection raised by Trustee [Name]: that our students' beef consumption is a rounding error in global emissions, and that if an act fails a cost-benefit test for an individual, it should fail for the institution. This is a philosophically rigorous position based on *causal impotence*. If my buying one burger does not change the supply chain, why does the university buying 10,000 fewer burgers matter?

  I ask the Board to consider that the University is not merely an aggregate of individual consumers; it is a **market signal generator**.

  When an individual skips a burger, the supply chain absorbs the surplus. When a university with a multi-year dining contract alters its default procurement specifications, it changes the *forecast* upon which suppliers base their production planning. We are not just consuming; we are contracting. By shifting the default, we reduce the baseline demand that our suppliers use to justify herd sizes and logistics contracts. This is distinct from individual consumer choice; it is institutional procurement strategy.

  Furthermore, the "cost-benefit" analysis must account for the educational mission. Students do not leave their habits at the gate. If we treat sustainability as a luxury good (opt-in only), we signal that it is optional. If we treat it as a default, we signal that it is a norm. The long-term emissions impact of 20,000 alumni carrying that norm into their professional lives likely dwarfs the immediate emissions saved by the policy itself.

  ### The Strongest Case for Rejection
  I want to be intellectually honest about where the opposition's argument holds the most weight. The Trustee is correct that if we view this transaction in isolation—this fiscal year, this campus—the direct carbon abatement is negligible relative to global totals.

  More critically, the **contract penalty clause** represents a real, immediate financial cost for an abstract, long-term gain. If the university is facing a budget deficit, paying a penalty to a caterer to *not* serve a product that students want is difficult to justify on fiduciary grounds. If the primary goal is emissions reduction, there may be more cost-effective interventions available (e.g., retrofitting lighting, installing solar). If we pay the penalty and students simply drive to McDonald's (the leakage risk), we have incurred a financial loss for zero environmental gain. This is the strongest argument for rejection: that this is an inefficient use of sustainability capital.

  ### What Would Flip My Recommendation
  My support for this policy rests on the assumption that institutional defaults influence long-term behavior more than they restrict short-term choice. There are two specific scenarios where I would withdraw my support and vote to **Reject**:

  1.  **Evidence of High Leakage:** If the Semester 2 survey (Condition #2) reveals that the vast majority of students are simply sourcing beef off-campus, the policy becomes purely performative. It would mean we are paying a contract penalty to move emissions from "Scope 3 University" to "Untracked Personal," achieving no net global benefit.
  2.  **Fiscal Distress:** If the Administration identifies a sustainability investment with a verified, calculable return on investment (e.g., energy efficiency) that is being passed over to fund this behavioral nudge, the opportunity cost becomes too high. If we must choose between fixing our own energy waste and signaling about beef, and our energy waste is substantial, the beef policy becomes a distraction.

  I believe the "Adopt with Conditions" path navigates these risks by ensuring we track the outcome and reinvest savings. However, if the data shows we are paying for theater rather than change, I will be the first to propose we revert to the status quo.

  Respectfully,

  [Your Name]
