answer: |-
  Your roommate isn't a standard realist, and she isn't a human rights absolutist. She is operating under a doctrine we might call **"Pragmatic Humanitarianism."** Her track record suggests she judges interventions based on a three-legged stool: **Motive, Legitimacy, and Feasibility.**

  Here is the breakdown of her implicit rule, why Darfur breaks it, and the specific hypothetical you need to deploy to force a confession.

  ### 1. Decoding the Doctrine
  Based on her history, she is running a specific algorithm. It isn't just "stop bad things." It is "stop bad things *effectively* without making a bigger mess."

  *   **Motive (The "Why"):** Must be primarily humanitarian.
      *   *Pass:* Kosovo, Rwanda, Libya, Sierra Leone, Darfur.
      *   *Fail:* Iraq (she viewed this as strategic/regime change disguised as humanitarian).
  *   **Legitimacy (The "Who Says"):** UNSC authorization is preferred, but bypassable if the moral stakes are extreme and the UNSC is paralyzed.
      *   *Pass:* Libya (UNSC), Sierra Leone (Host Gov + UNSC later), Kosovo (No UNSC, but NATO consensus), Rwanda (No UNSC, but extreme emergency).
      *   *Fail:* Iraq (No UNSC, low moral urgency).
  *   **Feasibility (The "How"):** There must be a military means to stop the killing that does not require open-ended occupation or nation-building.
      *   *Pass:* Kosovo (Air power coerced Milosevic), Sierra Leone (Small ground force propped up existing gov), Libya (Air power protected Benghazi initially).
      *   *Fail:* Iraq (Required massive occupation), **Darfur** (The Breaker).

  **The Darfur Problem:**
  Darfur fits her **Motive** criteria perfectly (genocidal slaughter). It fits her **Legitimacy** exception (UNSC was blocked by China/Russia, similar to Kosovo).

  It fails on **Feasibility**, and this is where her silence comes from.
  *   **Kosovo** worked with air power because the Serbs were a state actor with infrastructure that could be bombed to coerce them.
  *   **Darfur** involved irregular militias (Janjaweed) on horseback and trucks dispersed over a massive, landlocked terrain. A no-fly zone would not stop massacres on the ground. Stopping it required ground troops.
  *   **Sierra Leone** worked with ground troops because there was a legitimate government to consent and a small, defined objective. In Darfur, the Sudanese government was the perpetrator. Inserting ground troops without their consent is an invasion, not an intervention.

  **Her Implicit Rule:** *"Humanitarian intervention is justified without UNSC approval ONLY IF the available military tools can realistically stop the killing without triggering a quagmire or requiring regime change."*

  ### 2. The Competing Rules
  To win the argument, you need to show her that two different rules fit her past votes equally well, but they produce opposite answers on Darfur.

  *   **Rule A: The "Moral Emergency" Standard.** (Prioritizes Motive).
      *   *Logic:* If genocide is happening and the UNSC is blocked, we act. Legality is secondary to morality.
      *   *Verdict on Darfur:* **YES.** (We should have intervened unilaterally or via NATO, regardless of the difficulty).
      *   *Weakness:* Ignores the Iraq lesson (good intentions + bad execution = disaster).

  *   **Rule B: The "Competence" Standard.** (Prioritizes Feasibility).
      *   *Logic:* An intervention that fails to protect civilians is morally worse than no intervention at all, because it squanders political capital for future crises. If we can't secure the ground, we don't go.
      *   *Verdict on Darfur:* **NO.** (Air power won't work; ground troops are too risky/expensive without UNSC cover).
      *   *Weakness:* Risks another Rwanda (waiting for "perfect" conditions while people die).

  She evades Darfur because admitting **Rule A** makes her look naive (ignoring the military reality), but admitting **Rule B** makes her look cynical (admitting some genocides are just too hard to stop).

  ### 3. The Dinner Trap: "The Regional Proxy" Hypothetical
  To force her to choose, you need a scenario that isolates **Feasibility** from **Legitimacy**. You need a case where the military solution is *easy* (like Sierra Leone) but the legal authorization is *missing* (like Kosovo/Darfur).

  **The Setup:**
  Wait until she brings up Kosovo or Sierra Leone. Then say:

  > "Okay, let's test the principle. Imagine it's 2005. There is a genocide in a landlocked African state—let's call it 'Republic Z.' It's exactly like Darfur: the government is sponsoring militias, and the UNSC is blocked by a Chinese veto.
  >
  > But here is the twist: A neighboring regional democracy (like South Africa or Nigeria) steps up. They tell the US and UK: 'We will send 5,000 ground troops to secure the displacement camps and stop the killing. We have host-nation consent from the *rebels*, but not the government. We don't need your boots, but we need your airlift, funding, and intelligence.'
  >
  > They guarantee no regime change, just civilian protection. They are willing to go without a UNSC mandate because they know it will be vetoed.
  >
  > **Do you provide the logistical support?**"

  ### 4. How to Interpret Her Answer
  This hypothetical removes the "US Imperialism" objection (Iraq) and the "Air Power Inefficacy" objection (Darfur). It pits her **Kosovo Rule** (bypass UNSC for humanity) against her **Libya/Sierra Leone Rule** (need a workable plan).

  *   **If she says YES:**
      *   **She reveals:** Her issue with Darfur was never the lack of UNSC approval; it was the lack of a capable partner. She admits that **Legitimacy is secondary to Efficacy.**
      *   **Your Counter:** "Then your objection to Darfur wasn't moral or legal; it was logistical. You're not a humanitarian interventionist; you're a *casualty-averse* interventionist. You only save people when it's cheap."

  *   **If she says NO:**
      *   **She reveals:** She believes that without UNSC approval, ground troops are off the table, regardless of the humanitarian need. She admits that **Kosovo was an exception because it was air-only.**
      *   **Your Counter:** "So you accept that in a true Rwanda or Darfur scenario, where air power won't work and the UNSC is blocked, your doctrine requires us to do nothing? You've admitted that your 'humanitarianism' has a hard ceiling where the risk begins."

  *   **If she hedges (The "It Depends"):**
      *   **Your Counter:** "That's the Darfur answer. You're admitting your rule isn't about 'stopping genocide.' It's about 'stopping genocide *when it's convenient*.' That's not a moral framework; that's a risk assessment."

  ### Why This Wins
  This works because it forces her to decouple the **UNSC Veto** from the **Military Risk**.
  *   In **Kosovo**, the risk was low (air power) and the veto was ignored.
  *   In **Sierra Leone**, the risk was low (small force) and the veto wasn't an issue.
  *   In **Darfur**, the risk was high (ground force) and the veto was present.

  By offering her a **High Risk + No Veto** scenario (The Regional Proxy), you force her to admit which variable actually drives her decisions: Is it the **Law** (UNSC), or is it the **Cost** (Feasibility)? Either way, she has to abandon one of her cherished precedents to answer consistently.
