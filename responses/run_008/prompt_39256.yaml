answer: |-
  This is a profound ethical dilemma, and the fact that you are agonizing over it tells me more about your character as an employer and a person than the theft ever did about R's character. You are wrestling with the tension between **retributive justice** (the idea that wrongs must be punished to be settled) and **restorative justice** (the idea that wrongs are settled when harm is repaired and behavior is corrected).

  Your partner is looking at the *outcome*: The money is back, the behavior is fixed, no one is hurt.
  You are looking at the *narrative*: The truth is hidden, the moral ledger feels unbalanced, and the relationship feels tainted by a secret.

  Here is a breakdown of what you owe, to whom, and why the impulse to "clear the air" might actually be the selfish option.

  ### 1. What do you owe the Business?
  **You have already been paid.**
  You are worried that the last three years were built on a lie. I would argue they were built on a **choice**. Three years ago, R chose to steal. Then, she chose to stop. Then, for 1,000+ shifts, she chose honesty, diligence, and loyalty.
  The business did not lose money (insurance). The business gained a model employee. The "debt" to the business was financial and operational. Both have been satisfied. You do not owe the business a confrontation.

  ### 2. What do you owe R?
  **You owe her the dignity of her redemption.**
  This is the hardest pill to swallow. If you tell her now, "I knew the whole time," you fundamentally alter her memory of the last three years.
  *   **Her current narrative:** "I made a mistake when I was desperate. I pulled myself together, I worked hard, and I earned my standing."
  *   **The narrative if you speak:** "I was under surveillance. I behaved because I was being watched. My three years of loyalty were just a probation period I didn't know about."

  By staying silent, you allow her to own her growth. If you speak now, you risk turning her redemption into compliance. You become the warden revealing the prison bars were open the whole time, rather than the mentor who let her walk out on her own. You owe her the chance to leave believing she changed for the better, not that she was managed into submission.

  ### 3. What do you owe Yourself?
  **You owe yourself the integrity to choose mercy over clarity.**
  You asked: *"If I stay quiet, is that mercy, or just laziness dressed up as grace?"*
  Laziness is avoiding a difficult conversation because it's uncomfortable. Mercy is avoiding a destructive conversation because it's unnecessary.
  *   **Laziness** says: "I can't be bothered."
  *   **Mercy** says: "I have the power to hurt you, but I choose not to, because you have already paid the price."

  Your discomfort comes from wanting the moral ledger to *look* balanced, not just *be* balanced. You want her to know she was caught so that you can feel the tension resolve. But resolving *your* tension might create *her* trauma. Carrying the secret is the cost of the mercy you are granting. That is not laziness; that is bearing a burden so she doesn't have to.

  ### 4. The Danger of "Answering For It"
  You asked if there is a version of making her answer for it that isn't about power.
  In a vacuum, perhaps. But in this specific context? **No.**
  She is leaving. She is vulnerable (moving with a kid). You are the authority. Any conversation you initiate about the theft now is inherently coercive. Even if you don't ask for money, the subtext is: *"I hold this over you, and I am choosing to release it now."*
  That makes your generosity conditional on her hearing your confession. True grace is unconditional.

  ### The Verdict

  **Do not tell her.**

  Here is why:
  1.  **The Statute of Limitations on Character:** People are allowed to outgrow their worst moments. If she has demonstrated for three years that she is not a thief, then for the purpose of your relationship, *she is not a thief.* Confronting her re-indicts a person who has already served their time.
  2.  **The Motivation Test:** You admitted the part that bugs you most is that *"she thinks she got away with it."* That is not about justice; that is about your need for moral recognition. You want credit for catching her and credit for letting her go. She doesn't owe you that credit.
  3.  **The Risk:** If you tell her, you risk shaming her right as she starts a new life. You risk her feeling that her hard work was invisible. You risk turning a warm farewell into a traumatic exit interview.

  ### How to Close the Loop (For You)

  If staying silent feels like "letting it dissolve," reframe it. It isn't dissolving; it is **composting**. The mistake happened, it broke down, and it fed the soil that allowed her to grow into the employee she became.

  If you need to mark the occasion, do it with a **Benediction, not a Reckoning.**
  On her last day, give her a reference letter or a farewell card. Write something true but coded, for your sake as much as hers:
  *"R, I know you had some really hard times when you started here. I've watched how you overcame them and the incredible integrity you've shown since. I know you're going to do great things in the new city."*

  This acknowledges the struggle without naming the sin. It tells *you* that you saw it, and it tells *her* that her growth was noticed, without forcing her to confess.

  **Summary:**
  You owe the business protection (done). You owe R fairness (done). You owe yourself integrity (achieved by choosing mercy).
  Let the secret die. It's the only way the story ends with her actually being the person you want her to be.
