      *   *Tragedy of the Commons:* Multiple actors depleting a shared resource because individual incentive outweighs collective good.
      *   *Moloch/Multipolar Trap:* A specific type of coordination problem where competition forces actors to adopt harmful strategies to survive, even if they know it's harmful (race to the bottom). It implies systemic pressure rather than just negligence.
      *   *The Once-ler:* He starts alone. He expands. He mentions "biggering" his business. Competitors aren't explicitly shown until the end (the "others" who might buy Thneeds).
      *   *The Lorax:* Moral voice, no enforcement power.
      *   *The Ending:* Individual action (planting the seed) vs. systemic change.

