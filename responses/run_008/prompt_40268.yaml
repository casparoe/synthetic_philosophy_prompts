          4.  Address the "Species Problem" (is it central or just an example?).
      *   **Tone:** Honest, technical, direct, slightly playful (acknowledging the argument), but rigorous.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Essentialism (Aristotle/Kripke):* Kinds have necessary and sufficient conditions. Intrinsic properties define membership.
