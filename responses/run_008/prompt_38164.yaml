answer: |-
  ### Case Study: The Artisan and the Generalist

  **The Scenario**

  Consider two citizens, Elias and Julian, living in a liberal democracy that has implemented a Dworkin-style hypothetical insurance scheme to neutralise brute luck. At the age of majority, both received an identical capital endowment, calibrated to reflect the average market value of their innate talents and any insurable risks. At that starting point, the envy test was satisfied: neither wished to swap bundles with the other. Both possessed robust health, standard cognitive abilities, and no 'expensive tastes' in the welfare sense; the cost of achieving a standard level of satisfaction was identical for both.

  Ten years later, their lives have diverged significantly due to voluntary choices regarding their vocational training and lifestyle.

  **Elias** adopted a 'generalist' strategy. He invested his capital in versatile qualifications (management, coding, standard languages) and maintained a mobile, cosmopolitan lifestyle. He can work in multiple sectors, relocate to any major city without loss of income, and access a wide range of leisure activities. His capability set is broad: he has the effective freedom to be employed, to travel, to relocate, and to participate in diverse social spheres.

  **Julian** adopted a 'specialist' strategy. He wholeheartedly committed to a traditional, labour-intensive craft (say, hand-forging bespoke tools using a specific, non-mechanised heritage method). To master this, he invested all his capital in a specific rural workshop and spent a decade acquiring skills that are non-fungible. He is equally satisfied with his life as Elias is with his; he finds deep meaning in his work and reports no regret. However, his capability set is strictly smaller. He cannot effectively work in other sectors (he lacks the credentials and skills); he cannot relocate (his workshop and client base are location-specific); and his income is lower, limiting his access to certain social goods. Crucially, the contraction of his capability set is not due to a lack of *resources* per se—he could sell his workshop and move—but doing so would require abandoning the vocation that gives his life meaning. He would refuse any compensation package bundled with a requirement to retrain or relocate.

  **The Stipulations**
  1.  **Initial Equality:** Resources and opportunities were equal at the start.
  2.  **Welfare Equality:** Both are equally happy/satisfied now.
  3.  **Capability Inequality:** Elias has a strictly larger set of feasible functionings (doings and beings) than Julian.
  4.  **Responsibility:** The divergence is due entirely to Julian's voluntary, endorsed choices, not disability or bad luck.
  5.  **Compensation Constraint:** Julian rejects compensation that undermines his chosen form of life.

  ---

  ### Theoretical Implications

  Here we distinguish what the case stipulates from what the theories imply.

  **1. Welfare Egalitarianism**
  *   **Verdict:** No injustice; no redistribution required.
  *   **Reasoning:** Welfare egalitarianism is concerned with the distribution of well-being. Since the case stipulates that Elias and Julian are equally satisfied, the metric of justice is maximised. The fact that Julian has fewer *options* is irrelevant provided his *experience* of life is equal to Elias's.
  *   **Theoretical Note:** This highlights the standard 'happy slave' or 'contented bigot' objection, but inverted. Here, the contentment is genuine, yet the freedom is unequal. Welfare egalitarianism remains indifferent to the inequality of freedom.

  **2. Resource Egalitarianism (Dworkin)**
  *   **Verdict:** No injustice; no redistribution required.
  *   **Reasoning:** For the resourcist, justice is satisfied if the initial distribution was envy-free and sensitive to ambition but not endowment. Julian's smaller capability set is the result of his 'option luck' and his conception of the good life. Dworkin distinguishes between *circumstances* (which should be equalised) and *choices* (for which individuals are responsible). Julian chose to invest in specific human capital rather than fungible capital. To compensate him now would be to penalise Elias for his prudence and violate the principle that individuals must bear the costs of their own life plans.
  *   **Theoretical Note:** The resourcist treats resources as the proxy for freedom. Since Julian had equal *freedom to choose* his path initially, the resulting inequality in *effective freedom* (capabilities) is legitimate.

  **3. The Capability Approach (Sen/Nussbaum)**
  *   **Verdict:** Contested / Ambiguous.
  *   **Reasoning:** The capability approach evaluates justice by the expansion of people's real freedoms (capability sets). Stipulation (3) confirms an inequality in freedom: Elias can do and be more things than Julian.
      *   *Strict Interpretation:* If the metric of justice is capability equality, there is a deficit here. Julian is less free, even if he is happy.
      *   *Responsibility-Sensitive Interpretation:* Many capability theorists (e.g., Anderson, Robeyns) argue that the approach must accommodate responsibility. If Julian *chose* this contraction, it may not constitute an injustice.
  *   **Theoretical Note:** This is the wedge. Unlike welfare, capability theory registers the loss of freedom. Unlike resourcism, it questions whether resource equality guarantees freedom equality. However, whether a *chosen* reduction in capability counts as an injustice remains a live debate within the literature.

  ---

  ### The Working Feature and The Toggle

  **The Feature Doing the Work**
  The critical feature of this case is **responsibility for a contraction of freedom**.
  In standard debates, responsibility is invoked to excuse *welfare* deficits (e.g., "He is poor because he gambled"). In this case, responsibility is invoked to excuse a *capability* deficit. The resourcist argues that if you choose to limit your own freedom, the state need not restore it. The capability theorist must decide whether the *value* of freedom is intrinsic (so losing it is bad even if chosen) or instrumental (so losing it is fine if it serves a valued end).

  **The Toggle: Adaptive Preference**
  Imagine we toggle one variable: Julian's commitment was not wholehearted. Suppose he specialised due to **adaptive preference formation**—he was socially conditioned to believe he was unfit for general education or city life, and thus 'chose' the craft as the only option he felt worthy of. He is still satisfied (welfare is equal), and he still has the same resource history.

  *   **Welfare Egalitarianism:** Verdict remains **unchanged**. He is satisfied. This demonstrates the theory's blindness to the *origin* of satisfaction.
  *   **Resource Egalitarianism:** Verdict remains **largely unchanged**, though a sophisticated Dworkinian might probe whether the 'insurance market' would have covered cultural oppression. Formally, however, the resources were equal.
  *   **Capability Approach:** Verdict **shifts decisively**. If the preference is adaptive, the 'choice' is not truly free. The contraction of the capability set is now a clear deprivation. The capability approach is uniquely sensitive to this toggle because it focuses on the *substantive freedom* to choose, not just the resource input or the welfare output. It captures the injustice of the 'conditioning' that the other two theories miss.

  ---

  ### Strongest Replies and Contested Ground

  **The Resourcist Reply**
  *   **Argument:** The resourcist argues that this case poses no problem because equality of resources *is* the correct proxy for treating people with equal concern. To intervene in Julian's life is to disrespect his agency.
  *   **Key Point:** "We equalised the *means* to freedom, not the *exercise* of freedom. If we compensate Julian for his smaller capability set, we are effectively taxing Elias for being flexible. That violates the envy test ex-post. Julian is not unfree; he is committed. There is a moral difference between being *unable* to do X and being *unwilling* to do X because it conflicts with your values. Resourcism respects that distinction; forcing capability equality would blur it."
  *   **Epistemic Status:** This is the standard defence. It relies on the premise that resources are the only 'publicly ascertainable' metric that avoids paternalism.

  **The Capability Theorist Reply**
  *   **Argument:** A sophisticated capability theorist (avoiding paternalism) argues that while Julian's choice must be respected, the *structural context* matters.
  *   **Key Point:** "We do not need to force Julian to retrain to acknowledge a capability deficit. The point of the capability approach is to ensure the *background structure* of society supports a threshold of central capabilities for all citizens. The fact that Julian *must* choose between his vocation and basic mobility suggests a failure of social design. Perhaps society should support heritage crafts *in a way* that does not entail such severe capability contraction (e.g., portable pensions, retraining bridges). We respect his endorsement of his life, but we maintain that a just society minimises the *cost* of commitment. The inequality in capability sets highlights that resource equality allowed a social structure where 'choice' entails 'exclusion'."
  *   **Epistemic Status:** This is contested. Some capability theorists (following Sen) are hesitant to prescribe a fixed list of capabilities that might override Julian's valuation. Others (following Nussbaum) might argue there is a threshold below which no one should fall, even by choice. The reply above attempts to thread the needle: acknowledging the capability gap without demanding Julian change his life.

  ### Epistemic Notes for the Seminar

  1.  **Stipulation vs. Theory:** It is settled by *stipulation* in the case that Julian has a smaller capability set and is equally happy. It is *theoretical implication* that Welfare Egalitarianism sees no problem. It is *contested* whether the Capability Approach demands redress in the 'voluntary' scenario.
  2.  **The Open Question:** Do not present the Capability Approach as having a settled view on 'responsibility for chosen capability losses'. Scholars like Ingrid Robeyns argue for 'limitarianism' or responsibility-sensitive metrics, while Amartya Sen emphasises agency to the point where a chosen limitation might not count as a 'deprivation' in the normative sense. Ensure students understand that the Capability Approach is a framework for evaluation, not a single formula for distribution.
  3.  **The Resourcist's Blind Spot:** The case is designed to show that Resource Egalitarianism assumes resources convert into freedom at a roughly equal rate for everyone. Julian's case shows that *choices* about human capital investment alter conversion rates permanently. The Resourcist accepts this; the Capability Theorist worries about it.

  This case isolates the disagreement without relying on the 'easy' cases of disability. It forces the debate onto the terrain of **freedom vs. responsibility**, asking whether justice is about equalising the *tools* for life (resources), the *experience* of life (welfare), or the *substantive opportunities* of life (capabilities), even when those opportunities are voluntarily surrendered.
