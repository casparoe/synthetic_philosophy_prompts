      *   *Is Machiavelli a determinist? Most scholars say no. He's a pragmatist. He wants princes to *act*.*
      *   *Where does the argument break? Step 3 is the philosophical heavy lifter. It assumes that if the *source* of your character is unchosen, the *action* isn't yours. That's the "Consequence Argument" in free will debates.*
      *   *But Machiavelli isn't doing metaphysics. He's doing political science. He cares about efficacy, not ultimate moral responsibility.*
      *   *The chess analogy the user brought up is spot on. We distinguish between "luck" (opponent's blunder) and "skill" (my training) even if my training was determined by genetics/upbringing.*
      *   *So, the weak link is Step 5 (and arguably 4). Machiavelli defines *virtù* not as "uncaused cause" but as "effective adaptation."*
      *   *I need to explain that Machiavelli's *virtù* isn't Christian virtue or Kantian free will. It's more like "prowess" or "adaptability."*
      *   *I need to address the "Fortune is a woman" quote. That implies agency. You can beat her.*
