      *   Hard Determinism: If past causes determine actions, no free will. (User's argument).
      *   Compatibilism: Free will is compatible with determinism. Freedom is acting according to your own nature without external coercion. (Machiavelli's likely stance).
      *   I need to explain this without getting bogged down in metaphysics.

