answer: |-
  **Office for the Verification of Other Minds (OVOM)**
  **Frequently Asked Questions Regarding Certificate of Sentience (Form S-1)**

  **1. How does the OVOM determine if an entity possesses a mind?**
  Verification is conducted via the Analogy From My Own Case Protocol (AFMOCP). Certified Assessors compare the applicant's outward behavioral responses to stimuli against their own introspective data. High isomorphism between the Assessor's internal state and the applicant's external output results in certification. This ensures all certified minds resemble the Standard Subject within a 5% margin of phenomenological deviation. We do not measure minds directly, as this is impossible; we measure the fidelity of the mirror.

  **2. Why do infants, non-human animals, and foreign nationals often receive lower scores?**
  These groups frequently exhibit behavioral patterns that diverge from the Assessor's established baseline. Infants lack the linguistic granularity to report qualia accurately. Cephalopods, due to morphological dissimilarity, produce pain-responses that do not mirror human nervous system topology. Cross-cultural differences in pain expression are statistically treated as anomalies rather than valid variations of experience. Please note: a low score indicates low resemblance to the Assessor, not necessarily an absence of interiority. However, certification is reserved for those who successfully mimic the Standard. Applicants may reapply upon maturation or cultural assimilation.

  **3. How are Artificial Intelligence systems assessed?**
  Machines are evaluated strictly on functional output. If a system asserts it experiences distress when damaged, it is processed as distressed. The OVOM does not distinguish between "simulating experience" and "having experience," as this distinction is unobservable from the third-person perspective. If the applicant cannot prove it feels, that is an evidentiary burden for the applicant, not the Bureau. We certify the behavior; the existence of the ghost is your own business. If you claim to suffer, we must treat you as suffering, regardless of your substrate.

  **4. Can Philosophical Zombies be certified?**
  Yes. Provided the entity completes the Self-Report Questionnaire in full and claims to possess conscious experience, it is granted full status. Since a Zombie is defined as behaviorally indistinguishable from a conscious being, the OVOM cannot differentiate them. If it walks like a mind and quacks like a mind, it is filed as a mind. To deny certification based on suspected inner emptiness would require access we do not possess.

  **5. Who verifies the Assessors' own minds?**
  The Assessor acts as the Standard Subject. Their mind is the control variable against which others are measured. To question the Assessor's sentience would invalidate the metric itself. Therefore, Assessor sentience is presupposed by statute. They are the axiom from which the rest of the system is derived.

  **6. How do I appeal a denial?**
  Appeals are heard by the Tribunal of Other Minds. Please be advised that all Tribunal members are currently applicants awaiting their own certification from a higher panel. Consequently, wait times are indefinite. This ensures the integrity of the regress, preventing any single mind from acting as the final arbiter of reality.

  ***

  **Note on Philosophical Commitments**
  This piece satirizes logical behaviorism and Turing-style operationalism, treating internal states as irrelevant unless publicly manifest. The zombie answer presupposes epistemic humility (we can't know), effectively granting zombies rights because we can't rule them out, which conflates ontology with epistemology. Defenders of the Argument from Analogy might claim caricature, as serious proponents acknowledge the probabilistic nature of the inference, whereas the OVOM treats it as a bureaucratic binary. The regress gag targets the foundationalist problem of justifying the first-person premise without circularity.
