answer: |-
  **The Scenario**
  A department head must assign a single remaining corner office to one of two senior researchers, Dr. Evans or Dr. Flores. Their performance metrics, seniority, grant funding, and expressed desire for the office are mathematically identical; no fact favors one over the other. The department is small, morale is fragile, and the allocation process is fully transparent to the staff. If the head chooses arbitrarily ("I just picked Evans"), Flores perceives favoritism and disengages. If the head randomizes publicly (coin flip), Flores accepts the fairness but views the head as lacking leadership discernment. If the head follows a standing policy ("when tied, assign to the researcher with the earlier hire date"), Flores accepts the outcome as legitimate, maintaining trust in the institution's stability.

  **Demonstration of Design**
  In standard Buridan cases, the method of resolution is private and consequence-free. Here, the **visibility of the method** creates downstream utility differences. 
  1. **Arbitrary Picking:** Irrational. It signals hidden bias, damaging future cooperation.
  2. **Randomizing:** Sub-optimal. It signals procedural fairness but undermines perceived managerial judgment.
  3. **Standing Policy:** Optimal. It signals institutional consistency, preserving morale without requiring object-level differentiation.
  4. **Second-Order Preference:** A preference for "choosing freely" is irrational here because it incurs the arbitrary cost; a preference for "following rules" is rational because it secures trust.

  The structural feature doing the work is **public observability of the decision procedure**. The tie exists at the object level (Evans vs. Flores), but the *meta-level* choice (how to decide) carries distinct signaling value that affects future payoffs (morale, trust, effort).

  **The Randomizer's Objection**
  A committed randomizer might argue: "Your case rigs the meta-game by assuming a standing policy exists. If no policy exists, creating one ad hoc is itself an arbitrary act. Furthermore, randomization is the only method that guarantees ex-ante fairness without relying on potentially discriminatory proxies like hire date. By penalizing randomization for 'lacking leadership,' you smuggle in a virtue-signaling preference that isn't truly about rational choice under indifference."

  *Preemption:* This objection conflates the *existence* of a policy with the *adoption* of one. Adopting a rule for future ties is a rational second-order choice distinct from the object-level tie, whereas randomization abdicates the responsibility to stabilize expectations.
