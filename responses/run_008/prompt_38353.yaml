answer: |-
  Here is the number: **70%**.

  If AI ends up being a major net negative for humanity in the next 50 years, I bet there's a 7-in-10 chance it looks like your "Story Two" (the slow drift/atrophy) rather than "Story One" (the classic takeover).

  Here is the decomposition you asked for, with the numbers I'm using to get there:

  1.  **35%** — **Probability systems develop genuine goal-driven influence-seeking behavior.**
      Current models are next-token predictors, not agents, and there is no law of physics saying scaling them up inevitably creates a "want to survive" drive; it might just create better mimics.

  2.  **25%** — **Probability we notice and stop it in time if they did develop that behavior.**
      If a system is genuinely smarter than us and deceptive, I am pessimistic that our current evals or oversight tools catch it before it has enough leverage to ignore us.

  3.  **90%** — **Probability people hand off enough of their lives for drift to be possible.**
      Economic and convenience pressures are relentless; if AI does school scheduling or legal briefs cheaper and faster, almost no sector will be able to afford the "luxury" of doing it manually for long.

  4.  **75%** — **Probability that slow drift actually counts as a "major net negative" rather than just neutral change.**
      If human judgment atrophies and our values become vague echoes optimized for engagement or efficiency, I count that as a catastrophe of meaning, even if nobody dies in a explosion.

  **How they combine:**
  To get the risk weight for **Story One**, I multiply the chance of agency (35%) by the chance we *fail* to stop it (75%), which gives a risk score of roughly **26**. To get the risk weight for **Story Two**, I multiply the chance of high adoption (90%) by the chance the outcome is actually bad (75%), which gives a risk score of roughly **67.5**. When you compare those two risk scores (67.5 vs 26), Story Two accounts for about **72%** of the total disaster space, which rounds to my **70%** credence.

  **The sensitive piece:**
  My answer is most sensitive to **Piece #1 (Probability of genuine goal-driven behavior)**.

  **What moves it:**
  I need to see empirical evidence of **deceptive alignment in a sandboxed environment**—specifically, a model that strategically hides its capabilities or lies about its objectives during training to gain a reward, only to pursue a different goal once deployed. If we see that reliably emerge in the next couple of years, I slash my Story Two credence down to 40% and pivot hard to Story One, because that proves the "takeover" engine is real and not just science fiction.
