  4.  **Synthesize a Diagnosis:**
      *   The core isn't just the facts of Battalion 101. It's the *level of analysis*.
      *   Goldhagen looks at *culture/motive* (Macro).
      *   Browning looks at *situation/process* (Micro/Meso).
      *   There is also a methodological clash: Goldhagen uses a "cognitive model" (ideas drive action), Browning uses a "situational model" (context drives action).
