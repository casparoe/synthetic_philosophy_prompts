      *   **Topic:** The Browning-Goldhagen debate (Ordinary Men vs. Hitler's Willing Executioners) regarding Reserve Police Battalion 101 and the Holocaust.
      *   **Key Observation:** The user notes that both agree on the *facts* (what happened at Józefów, the opt-out, the lack of consequences) but disagree on the *interpretation* (situational/psychological factors vs. eliminationist antisemitism).
      *   **Task:** Provide a diagnosis of the disagreement, not a verdict. Address specific hypotheses (factual dispute about pre-1933 antisemitism, disagreement on what constitutes an explanation, answering different questions). Evaluate whether the impasse was solvable or guaranteed.

  2.  **Deconstruct the Debate (Mental Sandbox):**
