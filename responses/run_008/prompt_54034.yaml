answer: |-
  **The Fieldwork Scenario: The Ura and the "Vap"**

  You are a field linguist working with the Ura, an isolated hunter-gatherer community in a closed valley ecosystem. Their primary protein source is a specific species of hare. You have constructed a translation manual for their term *"vap."* Whenever a hare is present in the immediate visual field, pointing at it elicits assent to "Vap?" Pointing at a detached hare leg elicits dissent. Pointing at a hare in the distance elicits dissent (unless you establish proximity conventions). So far, this is standard Gavagai territory.

  To pressure the indeterminacy, you design a longitudinal diagnostic test over six months. You introduce a controlled environment: a fenced enclosure visible from a single observation point. You observe Ura hunters interacting with hares in this enclosure.

  **The Data:**
  1.  **Single Entry:** A hare enters the enclosure. A hunter says "Vap."
  2.  **Continuous Presence:** The hare remains visible for an hour. The hunter continues to assent to "Vap" if queried.
  3.  **Occlusion:** The hare hops behind a rock inside the enclosure, completely out of sight for ten seconds, then reappears. Upon reappearance, the hunter says "Vap" again, but crucially, when queried immediately after reappearance with a demonstrative ("This Vap?"), the hunter assents. However, if you ask a question structured to imply continuity during occlusion (e.g., "Vap stay behind rock?"), the hunter exhibits confusion or gives inconsistent answers, sometimes assenting, sometimes dissenting, seemingly based on mood or context rather than a fixed rule.
  4.  **Exit and Return:** A hare leaves the enclosure entirely (out of sight) and returns an hour later. The hunter treats this as a new instance. They do not use the same demonstrative structure. They might say "Vap come" rather than "Vap return."
  5.  **Trade:** Hunters trade "vaps." If a hunter promises "one vap" and delivers a hare that walked away and came back, the recipient accepts it as fulfilling the promise. If the hunter delivers a *different* hare that looks identical, the recipient also accepts it. There is no behavioral evidence of a distinction between "the same individual hare" and "a qualitatively identical hare."

  **The Tie-Breaker That Fails:**
  To break the tie, the community would need to exhibit behavior that distinguishes between *numerical identity* (this is the very same object as before) and *qualitative similarity* (this is a new object just like the old one) in cases where perceptual continuity is broken. They would need to track individuals through long-term occlusion without visual contact, perhaps via tagging, distinct naming conventions for individuals, or narrative histories that rely on strict identity ("This is the hare that bit me last year").

  **Why They Don't Do It:**
  The Ura have no practical need for this distinction. Their economy is immediate consumption or simple barter. A hare that left and came back is edible just like a new hare. A hare that looks identical is edible just like the original. Their linguistic practices evolve to track *availability* and *presence*, not *persisting individuation*. They never generate the behavioral data that would force a choice between "enduring object" and "recurrent stage" because their form of life never requires them to care about the difference. The evidence runs out because the *interest* required to produce the evidence is absent.

  ***

  **Walkthrough of the Two Manuals**

  You now have two competing translation manuals that fit all the behavioral evidence described above.

  **Manual A (The Enduring Object Manual):**
  *   **Translation:** "Vap" = "Rabbit" (enduring physical object).
  *   **Logic:** The Ura believe rabbits endure through time.
  *   **Explanation of Data:** When the rabbit goes behind the rock, the Ura *believe* it is still there, but their linguistic convention for assenting to "Vap?" is tied to *visual verification*, not ontological commitment. When the rabbit leaves and returns, they treat it as a "new" transaction for practical purposes, but this is a pragmatic shorthand, not a metaphysical claim. Their language lacks a grammaticalized identity predicate ("is the same as") that operates independently of perception.
  *   **Simplicity:** High. Matches our own ontology.

  **Manual B (The Temporal Stage Manual):**
  *   **Translation:** "Vap" = "Rabbit-stage" (a temporal slice of the rabbit process).
  *   **Logic:** The Ura ontology consists of events and stages, not enduring substances.
  *   **Explanation of Data:** When the rabbit goes behind the rock, the current "vap-stage" ceases to be present. When it reappears, a new "vap-stage" is present. When it leaves and returns, it is literally a different stage. The trade is fulfilled because the promise was for "a vap-stage of sufficient mass," not "a specific enduring rabbit."
  *   **Simplicity:** High. The grammar maps 1:1 with their behavior regarding occlusion and return without needing to posit hidden pragmatic shortcuts.

  **The Impasse:**
  Both manuals predict exactly the same assent/dissent patterns. Manual A attributes a perceptual constraint on their language use; Manual B attributes a metaphysical difference in their ontology. There is no behavioral test you can run within the constraints of radical translation (pointing, querying, observing trade) that distinguishes "believing X exists but not talking about it when unseen" from "believing X does not exist when unseen."

  ***

  **The Counting and Numerals Objection**

  A seminar participant objects: "This is silly. Just ask them 'How many vaps are in the pen?' If one rabbit goes behind a rock and comes out, and they say 'Two,' then 'vap' means stage. If they say 'One,' it means object. The indeterminacy dissolves."

  Here is the reasoning on both sides of why this move fails to resolve the indeterminacy *in principle*.

  **Side 1: The Objection Holds (Indeterminacy Dissolves)**
  If the Ura have a stable counting practice, surely that fixes individuation. If they count by heads, they are counting objects. If they count by appearances, they are counting stages. If we observe them placing stones in a pile for every vap caught, and one rabbit caught twice yields two stones, we have behavioral proof they individuate by stage. The evidence isn't running out; we just haven't looked hard enough at their numerals.

  **Side 2: The Quinean Reply (Indeterminacy Pushes Up)**
  Quine argues that you cannot use the translation of numerals to fix the translation of nouns because the translation of numerals is *itself* indeterminate.
  *   **The Scenario:** You observe the Ura counting. One rabbit enters. They say "Bo." Another enters. They say "Bo Na."
  *   **Manual A:** "Bo" = "One", "Na" = "Plus/And". They are counting objects.
  *   **Manual B:** "Bo" = "One stage", "Na" = "Plus another stage".
  *   **The Crucial Twist:** Suppose the rabbit leaves and comes back, and they say "Bo Na" again.
      *   **Manual A says:** They are using "Bo Na" to mean "One object, twice counted." The translation of their numeral phrase includes a pragmatic operator for "occasions of counting."
      *   **Manual B says:** They are using "Bo Na" to mean "Two stages." The translation of their numeral is standard addition.
  *   **The Logical Particles:** To decide between these, you need to know how to translate their identity predicate ("is the same as") and their quantifiers ("there exists an x such that..."). But you only know how to translate identity and quantifiers by observing how they use them with nouns like "vap."
  *   **The Circle:** You cannot fix the noun ("vap") without fixing the logic (identity/number), and you cannot fix the logic without fixing the noun. If you translate "vap" as object, you must translate their counting behavior as "counting objects by appearances." If you translate "vap" as stage, you translate their counting behavior as "counting stages." Both manuals adjust the translation of the logical particles to preserve the fit with behavioral data.
  *   **Conclusion:** The counting test does not eliminate indeterminacy; it relocates it from the term "vap" to the logical vocabulary (numerals, identity, quantifiers). The total system of translation remains underdetermined.

  ***

  **Closing Assessment**

  **The Load-Bearing Feature:**
  The single feature doing the work in this scenario is the **absence of a grammaticalized identity predicate independent of perceptual presence.** The Ura language does not force speakers to mark whether a current instance is numerically identical to a past instance when perceptual continuity is broken. This allows the linguist to map the native behavior onto either an ontology of enduring objects (where identity is tracked mentally but not spoken) or an ontology of stages (where identity is irrelevant).

  **The Quinean Response to Removal:**
  If you removed this feature—i.e., if the Ura language *did* have a mandatory marker for diachronic identity that they used consistently even without visual contact (e.g., they tag rabbits and recite lineage)—a Quinean would not concede that indeterminacy is dead. They would argue that the translation of the identity marker itself is indeterminate. You could translate their marker as "is the same object as" (Manual A) or "is a temporal counterpart of" (Manual B), provided you adjust the translation of their spatiotemporal vocabulary accordingly. The indeterminacy is not in the lack of data, but in the fact that *any* data can be accommodated by compensatory adjustments elsewhere in the translation manual.

  **In-Principle vs. Practical:**
  Taken straight, this case supports the **in-principle** claim, not merely the practical version.
  *   **Practical Indeterminacy** suggests that if we had *more* time, *better* tools, or *more* questions, we could find the right answer.
  *   **In-Principle Indeterminacy** claims there is no fact of the matter to find.
  *   **Verdict:** The scenario demonstrates in-principle indeterminacy because the "missing data" (what the Ura think about unobserved rabbits) is not just hidden; it is behaviorally inaccessible by definition. Meaning, for Quine, is constituted by public behavioral dispositions. If two manuals account for all actual and potential behavioral dispositions (including the counting and trade scenarios), there is no further "meaning fact" waiting to be discovered. The scenario shows that even an ideal linguist with infinite time could not distinguish the manuals, because the distinction relies on a metaphysical difference (object vs. stage) that exerts no differential pressure on behavior. The indeterminacy is a feature of the relationship between evidence and theory, not a bug of fieldwork logistics.
