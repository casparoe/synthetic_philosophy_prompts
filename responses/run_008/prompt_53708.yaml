prompt: |-
  You are an experienced philosopher of cognitive science who has served on several hiring committees and watched many job talks survive the paper only to sink in the question period. I need your help making sure mine does not. Please think carefully before writing: consider the room, its internal alliances and fault lines, and only then commit to your judgments.

  I am a postdoc on the market, and next month I am giving a job talk in a department of roughly fifteen people: mostly orthodox cognitive scientists of a Fodorian bent — mental representations, internal computation, a standing suspicion of anything that smells of externalism about the mind — along with two vocal enactivists who think the extended mind literature never went far enough, and one epistemologist who works on testimony. My paper defends a qualified version of the extended mind thesis for the age of personal AI assistants. I grant the classic case of Otto, whose notebook functions as his memory, but I argue that the familiar availability-and-trust conditions used to fence off cognitive bloat do not transfer to an assistant that does its own inferring: when the external resource actively generates content rather than passively storing it, the smooth, automatic integration that made the notebook case plausible starts to break down. My positive proposal is that the missing condition is what I call tendency transparency — an external resource counts as part of my cognitive system only insofar as its inferential dispositions are reliably predictable to me, the way a long-used slide rule or compass becomes, but the way an opaque language model does not, at least not yet. On this view, current AI assistants are not extensions of our minds but something closer to constantly consulted collaborators, and whether they ever become parts of us is an empirical question about learned predictability rather than a conceptual one.

  Please prepare my Q&A sheet: the eight or so objections I will actually get from this specific audience, ordered by how much damage they could do, each phrased the way its likely asker would put it — an orthodox cognitive scientist, an enactivist, and the testimony epistemologist each have their own vocabulary, and the objections from the enactivists will not sound like the objections from the Fodorians, even where they overlap. For each objection, give me a two-minute reply and an honest note on where the reply is soft. Include the question I am hoping nobody asks. Alongside the sheet, flag for me which parts of my setup the room will treat as more or less settled versus which parts rest on live disagreements among people who know this literature — in particular, I want to know if my framing of the original Otto case and its conditions would be seen as the standard reading or as one contested interpretation among several, so that I do not present a contested reading as consensus and get called on it. Finally, think through the alliances: the enactivists and the orthodox crowd will both attack my paper, but not from the same side, and I suspect one camp may end up doing my work for me against the other — tell me where, and how to exploit that without appearing to.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** Postdoc on the academic job market.
      *   **Task:** Preparing for a job talk Q&A in a specific department.
      *   **Department Composition:** ~15 people.
          *   Majority: Orthodox cognitive scientists (Fodorian bent: mental representations, internal computation, suspicious of externalism).
          *   Minority 1: Two vocal enactivists (think extended mind didn't go far enough).
          *   Minority 2: One epistemologist (works on testimony).
      *   **User's Paper:** Defends a *qualified* Extended Mind Thesis (EMT) for personal AI assistants.
          *   Accepts Otto/notebook case.
          *   Argues availability/trust conditions fail for active AI (inference-generating).
          *   Proposes "Tendency Transparency" (predictability of inferential dispositions) as the missing condition.
          *   Conclusion: Current AI = collaborators, not extensions. Future AI = potentially extensions (empirical question).
      *   **My Role:** Experienced philosopher of cognitive science, hiring committee veteran.
      *   **Goal:** Ensure the talk survives the Q&A. Needs strategic advice, specific objections, replies, vulnerability analysis, and political navigation.

  2.  **Deconstruct the Intellectual Landscape:**
      *   **The Orthodox (Fodorians):** They likely hate EMT generally. They see the mind as skull-bound computation.
          *   *Attack Vector:* Why extend at all? Why not just call it coupling? Your "Tendency Transparency" sounds like internal modeling, which confirms the mind is internal.
          *   *Risk:* They might kill the project entirely by rejecting the premise.
      *   **The Enactivists:** They love EMT but think Clark/Chalmers stopped short. They emphasize dynamic coupling, embodiment, and history.
          *   *Attack Vector:* "Tendency Transparency" is too intellectualist/cognitivist. It ignores the embodied history of interaction. You're still treating the AI as a tool, not a medium.
          *   *Risk:* They might argue you're being too conservative, undermining the "extended" claim.
      *   **The Epistemologist (Testimony):** Focuses on social knowledge, trust, and assertion.
          *   *Attack Vector:* AI as "collaborator" sounds like testimony. But testimony relies on normative accountability. Can an AI be accountable?
          *   *Risk:* Collapsing the distinction between social and cognitive extension.
      *   **The User's Position:** A middle ground. Accepts EMT *in principle* (pleasing enactivists slightly more than orthodox) but restricts it *in practice* for AI (pleasing orthodox slightly more than enactivists). This is a dangerous tightrope.

  3.  **Analyze the "Otto" Framing:**
      *   *Standard Reading:* Clark & Chalmers (1998) rely on Parity Principle, Availability, Trust, and Past Endorsement.
      *   *Contested Reading:* Many argue "Trust" and "Past Endorsement" are already contested. Some (like Adams & Aizawa) say *no* external thing is cognitive (Causal Coupling vs. Constitution). Others (Enactivists) say the criteria are too static.
      *   *Advice:* The user must acknowledge that the "Availability/Trust" criteria are the *Clark/Chalmers* criteria, not necessarily the *universal* criteria. Don't present C&C as the final word, or the Orthodox will pounce on C&C's weaknesses to kill EMT, and Enactivists will pounce on C&C's conservatism.

  4.  **Drafting the Objections (The Q&A Sheet):**
      *   *Need:* ~8 objections, ordered by damage potential.
      *   *Voices:* Distinct vocabularies (Computational/Representational vs. Embodied/Dynamic vs. Normative/Epistemic).
      *   *Damage Assessment:* Which objections undermine the core thesis vs. which are mere clarifications?

      *   *Objection 1 (Orthodox - The Killer):* The Coupling-Constitution Fallacy. (Classic Adams/Aizawa). If you rely on predictability, that's an internal model. The extension is illusory.
      *   *Objection 2 (Enactivist - The Deep Cut):* Tendency Transparency is too intellectualist. It ignores the embodied history of engagement.
      *   *Objection 3 (Epistemologist - The Normative Gap):* Collaborators imply social norms. AI has no accountability.
      *   *Objection 4 (Orthodox - The Bloat):* If predictability is the key, why not a calculator? You're just moving the boundary arbitrarily.
      *   *Objection 5 (Enactivist - The Dynamic Systems):* Transparency is a state, not a process. Cognition is dynamic.
      *   *Objection 6 (Orthodox - Implementation):* How do you measure "Tendency Transparency"? It sounds folk-psychological.
      *   *Objection 7 (Epistemologist - Testimony):* Is this just a fancy version of relying on expert testimony?
      *   *Objection 8 (The "Hope Nobody Asks" - The Empirical Vacuity):* If it's an empirical question, what specific experiment settles it? If you can't specify, it's not science.

  5.  **Developing Replies & Vulnerabilities:**
      *   *Strategy:* Concede where necessary, pivot to the specific AI context.
      *   *Vulnerability:* The "Tendency Transparency" concept is the weak link. Is it internalist in disguise?
      *   *Reply:* It's about the *relation*, not the location.

  6.  **Mapping Alliances & Fault Lines:**
      *   *Orthodox vs. Enactivists:* They hate each other.
      *   *User's Position:* Sits between them.
      *   *Exploitation:* Use the Orthodox skepticism of "blind trust" to support the "Tendency Transparency" requirement (against Enactivists who might want full merger). Use the Enactivist insistence on "deep coupling" to show why current AI fails (against Orthodox who say nothing external counts).
      *   *Key Move:* Frame "Tendency Transparency" as a *naturalistic* constraint that satisfies the Orthodox demand for mechanism while keeping the Enactivist door open for future technology.

  7.  **Refining the "Otto" Framing Advice:**
      *   Must clarify: "I am adopting the Clark/Chalmers criteria *arguendo*." Do not claim they are uncontested. The Orthodox (Adams/Aizawa followers) definitely contest them.

  8.  **Review and Polish:**
      *   Tone: Mentor-like, strategic, realistic, slightly cynical but helpful.
      *   Check constraints: 8 objections, ordered by damage, 2-min replies, soft spots, alliances, Otto framing.
      *   *Self-Correction during drafting:* Make sure the Enactivist objections don't sound like Orthodox objections. Enactivists talk about "sensorimotor contingencies" and "history," Orthodox talk about "computation" and "representation."
      *   *Check the "Hope Nobody Asks":* Make it something that exposes the lack of empirical teeth, as the user claims it's an empirical question.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a high-stakes situation. You are walking a tightrope between a majority faction that thinks your starting premise is false (Orthodox) and a minority faction that thinks your conclusion is too timid (Enactivists). The Epistemologist is the wild card who cares about the normative status of the "collaborator" label.

  Your survival depends on not letting the Orthodox convince the room that externalism is incoherent, while not letting the Enactivists convince the room that you've missed the point of embodiment. You must frame your "Tendency Transparency" not as a retreat to internalism, but as a *mechanism* for extension that satisfies the Orthodox demand for systematicity without conceding the Enactivist demand for deep coupling.

  Here is your strategic briefing.

  ### Part 1: The "Otto" Framing & Settlement Status

  **Do not present the Clark & Chalmers (1998) criteria (Availability, Trust, Past Endorsement) as consensus.**
  *   **The Orthodox View:** To the Fodorians, the Otto case is a *reductio ad absurdum*. They view the "Parity Principle" as a category error. If you present the Otto conditions as "standard," the senior orthodox member will interrupt to say, "Standard for whom? Adams and Aizawa demolished that in 2008."
  *   **The Enactivist View:** They think Clark & Chalmers were too conservative. They view the "Trust/Availability" conditions as too static and intellectualist. They prefer a dynamic systems reading.
  *   **The Settlement:** The only settled fact is that Clark & Chalmers *proposed* these conditions. It is live disagreement whether they are sufficient, necessary, or coherent.
  *   **Your Move:** In your intro, explicitly state: *"I adopt the Clark & Chalmers criteria arguendo, not as settled metaphysics, but as the common currency of the debate. My argument is that even by these generous lights, AI fails, and here is the condition needed to fix it."* This inoculates you against the Orthodox attack (you aren't defending C&C as gospel) and signals to the Enactivists that you know the criteria are limited.

  ### Part 2: The Q&A Sheet (8 Objections)

  I have ordered these by potential to derail the hire. The top three are "Job-Killers" if mishandled.

  #### 1. The Coupling-Constitution Trap (Orthodox Lead)
  **The Ask:** "You're relying on predictability ('Tendency Transparency') to mark the boundary of the cognitive. But predictability is a relation between an internal model and an external tool. Doesn't this just concede that the *cognitive* work is happening in the internal modeling, rendering the 'extension' merely causal coupling? You've smuggled internalism back in."
  **The Damage:** High. If your condition for extension is internal predictability, they will argue the extension is illusory.
  **The Reply:** "That's a crucial distinction. I'm not claiming the *predictability* is the cognition. I'm claiming that *integration* requires a specific kind of functional meshing. In the Otto case, the notebook is transparent because the retrieval process is automatic. With AI, the inference is opaque. My claim is that without Tendency Transparency, you don't have a unified system, you have a user and a tool. The 'internal model' is the bridge, but the bridge allows the traffic to flow both ways. If the bridge is one-way (I query, it answers), it's testimony. If it's two-way (I anticipate its outputs as my own), it's extension."
  **The Soft Spot:** You are walking a fine line. If the "internal model" does all the work of prediction, the Orthodox will press that the *mind* is the model, not the AI. Be prepared to concede that current AI is *not* extended, which is your thesis anyway.

  #### 2. The Intellectualist Bias (Enactivist Lead)
  **The Ask:** "Tendency Transparency sounds like a propositional attitude. You're requiring the user to have a 'theory' of the AI's dispositions. But cognitive extension in the wild—like a blind person's cane—isn't about predicting the cane's dispositions; it's about incorporating it into the body schema pre-reflectively. By requiring transparency, aren't you imposing an intellectualist barrier that excludes the very embodied history enactivists care about?"
  **The Damage:** High. Makes you look like a closeted computationalist who doesn't understand embodiment.
  **The Reply:** "I agree that the *ideal* end-state of extension is pre-reflective. But we are talking about *current* AI. A cane becomes transparent through sensorimotor contingency learning. Current LLMs do not offer stable sensorimotor contingencies; they offer probabilistic outputs that shift. My 'Tendency Transparency' is the *goal* of that learning process. Until the AI's dispositions stabilize enough to be incorporated into the body schema (or cognitive schema), we are in the 'learning' phase, not the 'extended' phase. I'm describing the threshold, not denying the embodiment."
  **The Soft Spot:** Enactivists may feel you are co-opting their language ("body schema") while keeping their conclusion at bay. Acknowledge the Enactivist insight as the *telos* of your view.

  #### 3. The Normative Accountability Gap (Epistemologist Lead)
  **The Ask:** "You conclude AI are 'collaborators.' In epistemology, collaboration implies normative accountability. If my human collaborator lies, I can blame them. If the AI hallucinates, who is to blame? If there's no accountability, isn't 'collaborator' just a metaphor for 'unreliable instrument'? Why not just call it a complex tool?"
  **The Damage:** Medium-High. Undermines your positive account of what AI *is* if it's not extended.
  **The Reply:** "I use 'collaborator' to signal that it's not merely a tool like a hammer, because it generates content I didn't explicitly input. But I grant you the normative point: it is a *defective* collaborator. This is actually an argument for my transparency condition. Part of becoming 'extended' might require the system to be accountable—to have error-correction mechanisms I can interface with normatively. Currently, they are collaborators in function, but tools in status. My framework predicts that for them to become mind, they must become accountable agents."
  **The Soft Spot:** You risk conflating social agency with cognitive extension. Keep the focus on the *cognitive* integration, not the moral status.

  #### 4. The Calculator Counter-Example (Orthodox Lead)
  **The Ask:** "I've used a calculator for 20 years. Its inferential dispositions are perfectly transparent to me. By your lights, is the calculator part of my mind? If yes, cognitive bloat returns. If no, why is AI different?"
  **The Damage:** Medium. Tests the consistency of your new condition.
  **The Reply:** "Great test case. I'd say the calculator *is* cognitively extended for basic arithmetic—it's a classic case of offloading. The difference with AI is the *generativity*. A calculator computes $f(x)$. An LLM generates $y$ given $x$ where the function $f$ is hidden and shifting. The transparency of the calculator is transparency of *algorithm*. The opacity of AI is opacity of *disposition*. My condition allows the calculator in but keeps the black-box AI out."
  **The Soft Spot:** If they press that LLMs are just complex calculators, you need to stand firm on the "generative/unpredictable" distinction.

  #### 5. The Dynamic Systems Objection (Enactivist Lead)
  **The Ask:** "You treat transparency as a static condition—either you have it or you don't. But cognition is a dynamic trajectory. Why treat 'extension' as a binary state rather than a degree of coupling? Isn't your view just a snapshot of a continuous process?"
  **The Damage:** Medium. Makes your theory look rigid.
  **The Reply:** "I agree it's a continuum of coupling. But for *constitutional* claims (is it part of the mind?), we need a threshold. In biology, we talk about symbiosis. Sometimes it's parasitic, sometimes mutualistic, sometimes integrated (mitochondria). I'm arguing current AI is mutualistic coupling, not integrated symbiosis. We need a line to draw for legal and ethical reasons, even if the underlying physics is continuous."
  **The Soft Spot:** Enactivists hate binaries. Emphasize the pragmatic need for the line, not the metaphysical rigidity.

  #### 6. The Empirical Measure Question (Orthodox/Science Lead)
  **The Ask:** "You say whether AI becomes part of us is an 'empirical question.' How do we measure Tendency Transparency? Do we have a metric? If not, isn't this just armchair speculation dressed up as science?"
  **The Damage:** Medium. Challenges your credibility as a cognitive *scientist*.
  **The Reply:** "We can measure predictability via information-theoretic metrics—mutual information between user intent and AI output over time. If the user's internal model reduces the entropy of the AI's output, transparency is increasing. I'm proposing this as a hypothesis for human-AI interaction studies, not just a philosophical intuition."
  **The Soft Spot:** If you don't actually have a citation or a specific metric in mind, this will sound hollow. Have a paper ready to cite (e.g., predictive processing literature).

  #### 7. The Testimony Redundancy (Epistemologist Lead)
  **The Ask:** "If the AI is a collaborator and not part of the mind, isn't this just the standard view of testimony? I ask an expert, they tell me something, I believe it. What work is your new framework doing that standard social epistemology doesn't already do?"
  **The Damage:** Low-Medium. Suggests your contribution is marginal.
  **The Reply:** "Standard testimony assumes a speaker with beliefs. AI has no beliefs. My framework explains how we *treat* it as testimony without committing to AI belief, and sets the conditions under which that relationship could transform into cognitive extension. It bridges the gap between social epistemology and philosophy of mind."
  **The Soft Spot:** Ensure you don't concede that AI *is* a testifier if you want to maintain the "collaborator" distinction.

  #### 8. The "Hope Nobody Asks" (The Empirical Vacuity)
  **The Ask:** "If Tendency Transparency is the condition, and current AI lacks it, but future AI might have it... what would a transparent LLM actually look like? Can you describe a system that is both generative and transparent? If not, isn't this condition just a way to say 'AI will never be us'?"
  **The Damage:** High. Exposes that your "empirical question" might be a rhetorical shield for a negative conclusion.
  **The Reply:** "A transparent system would be one where the latent space is interpretable to the user through interface—where I can 'feel' why it's suggesting X. Think of a co-pilot that highlights its confidence and reasoning path in real-time, adapting to my correction instantly. It's not impossible, but current commercial incentives favor opacity. I'm leaving the door open, but demanding the engineering catch up."
  **The Soft Spot:** This requires you to be speculative. If you sound too vague, you look like you're dodging.

  ### Part 3: Alliances and Fault Lines

  **The Dynamic:**
  The Orthodox and Enactivists in this department likely do not speak to each other except to disagree. They view each other as fundamentally misguided.
  *   **Orthodox:** Think Enactivists are woolly mystics who deny computation.
  *   **Enactivists:** Think Orthodox are dry reductionists who miss the life of the mind.

  **Your Position:**
  You are technically an Externalist (which Orthodox dislike) but you are arguing *against* the extension of current AI (which Enactivists dislike). You are in the crossfire.

  **How to Exploit the Alliance (Without Appearing To):**
  1.  **Use the Orthodox to Check the Enactivists:** When the Enactivists push for "deep coupling" or claim the boundary is already dissolved, lean on the Orthodox demand for *mechanism*.
      *   *Tactic:* "I share the Enactivist vision of deep coupling, but as my Orthodox colleagues would rightly demand, we need to specify the *mechanism* of that coupling. Tendency Transparency is that mechanism."
      *   *Why it works:* It validates the Orthodox demand for rigor while keeping the Enactivist goal. It makes you look like the synthesizer.

  2.  **Use the Enactivists to Check the Orthodox:** When the Orthodox claim "nothing external is cognitive," lean on the Otto case which the Enactivists love.
      *   *Tactic:* "We can't simply reject the Otto case, as the Enactivists in the room have shown, there is genuine integration there. The question isn't *if* extension happens, but *when*."
      *   *Why it works:* It prevents the Orthodox from killing the project at the premise level.

  3.  **The Epistemologist is Your Tie-Breaker:** The Epistemologist cares about *justification*. Both camps need to explain how knowledge is secured.
      *   *Tactic:* Frame "Tendency Transparency" as an epistemic virtue. It satisfies the Orthodox need for reliability and the Enactivist need for interaction.
      *   *Why it works:* It elevates your paper from "metaphysics of mind" (where they fight) to "epistemology of tools" (where they might agree).

  **Final Warning:**
  Do not let the discussion become a referendum on Clark & Chalmers 1998. That paper is 25+ years old. If you spend your Q&A defending the Parity Principle, you look dated. Keep the focus on **AI**. The novelty of your paper is the application to *active inference generators*, not the re-litigation of the notebook. If they drag you back to Otto, say: *"Otto is the control case. The AI is the experimental variable. Let's focus on the variable."*

  Good luck. Keep your answers under two minutes. If you talk longer, you look defensive. If you talk shorter, you look glib. Watch the senior Orthodox member's body language; if they lean back, you've lost them. If they lean forward, you have them.
