      *   *Above Threshold:* Priority rule. Eliminate/reduce severe suffering first.
      *   *The "Threshold" Problem:* Where is the line? (Theory doesn't say).
      *   *The "Rationing" Problem:* What if two people are above the threshold and you can only help one? (Theory says "help both," but resources are finite).
      *   *The "Prevention" Problem:* Does preventing future suffering count the same as alleviating current suffering? (Usually yes, but harder to measure).

  3.  **Drafting the Decision Procedure:**
