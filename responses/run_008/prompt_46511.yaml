  *(Self-Correction on Wellbeing Week)*: If the committee has a mandate to "support student welfare" broadly, does that change the ethical framework? No, the user wants to apply LTNU *to* the committee's decisions. I must stick to the ethical framework requested, even if it conflicts with the committee's traditional role. However, I can suggest how to frame the Wellbeing Week to *pass* LTNU (prevention).

