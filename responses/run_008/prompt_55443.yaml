prompt: |-
  I'm a bioethics PhD student and two people in my cohort have been going at each other for literally two years about the concept of disease. One is all-in on a Boorse-style biostatistical view: disease just is statistically subnormal functioning of some part, relative to a reference class like age and sex, and the concept is value-free all the way down. The other is a normativist -- she thinks a condition isn't a disease unless it's bad for the person, and that the dysfunction talk at most picks out the medically relevant bit while harm does the real classificatory work. They've finally agreed to an adversarial collaboration and, because I'm friends with both, I got stuck drafting the joint statement. Help?

  What I need is: (1) the claims they could both actually sign -- I suspect there's more overlap than they admit, e.g. that whether something is a disease shouldn't turn on whether we can currently treat it, and that disease attributions license certain kinds of intervention and excuse certain behaviors; (2) the residual disagreements stated so that each would accept the wording of their own side (so no sneaking in "dysfunction is secretly value-laden" as a agreed claim, she has to be able to sign every line); (3) the cruxes -- I think one is whether you can even individuate "parts" and their "functions" without smuggling in norms, another is what each view says when dysfunction and harm come apart, and maybe another about whether the reference-class statistics can be done in a non-question-begging way; and (4) for each crux, at least one concrete case both sides would accept as a fair test -- stuff like grief, menopause, aging, or historically pathologized conditions where there was cultural disapproval but arguably no dysfunction -- with each side's prediction about the case written down in advance so nobody can weasle out later. No fair giving one side all the cases it already handles well.

  Format: numbered agreed-claims section, then a disagreements table, then cruxes each with the test case(s) and the two predictions.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** Bioethics PhD student.
      *   **Task:** Draft a joint statement for an adversarial collaboration between two cohort members.
      *   **Parties:**
          *   Person A: Boorse-style Biostatistical Theorist (BST). Disease = statistically subnormal functioning (value-free).
          *   Person B: Normativist. Disease = harm/bad for the person (dysfunction is secondary to harm).
      *   **Requirements:**
          1.  Agreed Claims (overlap, e.g., treatability isn't necessary, disease licenses intervention/excuse).
          2.  Residual Disagreements (phrased neutrally so both can sign).
          3.  Cruxes (individuation of parts/functions, dysfunction vs. harm divergence, reference class selection).
          4.  Test Cases (concrete examples for each crux with pre-committed predictions from both sides).
      *   **Format:** Numbered agreed claims, disagreements table, cruxes with test cases & predictions.
      *   **Tone:** Academic, precise, fair, neutral (no smuggling in one view as fact).

  2.  **Deconstruct the Positions:**
      *   **Biostatistical Theory (BST):**
          *   Core: Disease is objective, factual, value-free.
          *   Mechanism: Statistical deviation from species-typical functioning within a reference class.
          *   Strengths: Avoids medicalizing social deviance *if* functioning is normal. Avoids denying disease just because it's common (e.g., cavities).
          *   Weaknesses: Reference class selection seems normative. Is "function" value-free? What about harmless dysfunctions (asymptomatic conditions)?
      *   **Normativism:**
          *   Core: Disease is inherently evaluative (bad/harmful).
          *   Mechanism: Social/ethical judgment of harm takes precedence. Dysfunction is necessary but not sufficient, or perhaps not even necessary (depending on the specific normativist strain, but the prompt says "dysfunction talk at most picks out the medically relevant bit while harm does the real classificatory work").
          *   Strengths: Captures why we *care* about disease. Explains why some dysfunctions aren't diseases (e.g., mild myopia in a specific context?).
          *   Weaknesses: Risks making disease relative to culture/values. Risks medicalizing social problems.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground that doesn't violate core tenets.
      *   *Idea 1: Treatability.* Both agree a disease doesn't vanish just because it's untreatable. (BST: Function is still low. Normativist: Harm is still present).
      *   *Idea 2: Social Consequences.* Disease status changes how we treat people (excuses, interventions).
      *   *Idea 3: Not just statistical rarity.* Rare traits (genius) aren't diseases. (BST: It's super-normal, not sub-normal. Normativist: It's not harmful).
      *   *Idea 4: Not just social disapproval.* Being gay isn't a disease. (BST: No dysfunction. Normativist: No inherent harm).
      *   *Refinement:* Ensure the wording doesn't imply *why* they agree, just *that* they agree.

  4.  **Drafting Section 2: Residual Disagreements:**
      *   Must be phrased so neither side concedes.
      *   *Issue:* Is "disease" a natural kind or a evaluative kind?
      *   *Issue:* Priority of harm vs. dysfunction.
      *   *Wording:* "Party A maintains X... Party B maintains Y..."

  5.  **Drafting Section 3: Cruxes & Test Cases:**
      *   *Crux 1: Individuation of Functions/Parts.*
          *   BST says functions are objective biological facts.
          *   Normativist says selecting which function matters is value-laden.
          *   *Test Case:* **Aging / Presbyopia.** Is the loss of near vision a disease of the eye or normal aging?
          *   *BST Prediction:* Depends on the reference class. If class is "70-year-olds," it's normal. If class is "humans," it's dysfunction. (Need to pin them down). Let's use **Asymptomatic Hypertension**. High pressure, no felt harm.
          *   *Wait, better Crux 1:* **The Reference Class Problem.** How do we choose age/sex without norms?
          *   *Test Case:* **Male Pattern Baldness.**
          *   *BST:* It's statistically normal for older men. Is it a disease? Boorse says no if it's typical for the age class.
          *   *Normativist:* It's often unwanted (harmful psychologically), but is it a *disease*? Or just a cosmetic issue?
          *   *Let's try:* **Sickle Cell Trait.**
          *   *BST:* In malaria zones, it's functional. In non-malaria zones, is it a dysfunction?
          *   *Normativist:* It's only a disease if it causes harm (crisis).
          *   *Actually, the prompt suggests:* Grief, Menopause, Aging, Historical Pathologization.
          *   *Let's pick:* **Menopause.**
          *   *Crux:* Is the hormonal shift a dysfunction or a normal stage?
          *   *BST:* Statistically typical for age/sex class -> Not a disease.
          *   *Normativist:* If it causes significant harm (symptoms), it might be treated as a clinical condition, but is it a "disease"?
          *   *Let's pick:* **Psychopathy / Antisocial Personality.**
          *   *BST:* Is there a broken mechanism? (Fear response).
          *   *Normativist:* It's primarily defined by social harm/moral deviance.
          *   *Okay, let's stick to the prompt's suggestions for high fidelity.*
          *   *Crux 1: Reference Classes.* Case: **Male Pattern Baldness.**
          *   *Crux 2: Dysfunction vs. Harm Divergence.* Case: **Asymptomatic Hypertension** (Dysfunction, no felt harm) vs. **Severe Grief** (Harm, is there dysfunction?). Let's go with **Asymptomatic Hypertension** and **Pathological Grief**.
          *   *Crux 3: Individuation of Function.* Case: **Aging (Senescence).** Is the decline of *all* systems a disease or the absence of disease?

      *   *Refining the Test Cases for "Fairness":*
          *   Need cases where BST struggles (harmless dysfunction) and Normativist struggles (harmful but statistically normal).
          *   *Case 1 (Harmless Dysfunction):* **Asymptomatic Mild Hypertension.**
              *   BST: Disease (functioning outside stats).
              *   Normativist: Not a disease (no current harm/symptoms), maybe a risk factor.
          *   *Case 2 (Harmful Normality):* **Labor Pain / Childbirth.**
              *   BST: Not a disease (functioning as designed).
              *   Normativist: Pain is bad, but is it a disease? (Normativists usually distinguish harm from disease). Let's use **Aging**.
              *   BST: Not a disease (statistically normal decline).
              *   Normativist: It involves harm/loss, but is it "disease"?
          *   *Case 3 (Value-Laden Function):* **Homosexuality (Historical).**
              *   BST: No reproductive dysfunction (in capacity), just preference. Not a disease.
              *   Normativist: Not a disease because not harmful (despite past beliefs).
              *   *Wait, this is too easy.* They agree here.
              *   *Need a disagreement case.* **Infertility.**
              *   BST: Disease (reproductive function subnormal).
              *   Normativist: Only if the person wants kids (harm is contingent on values).

      *   *Let's finalize the Cruxes based on the prompt's specific suggestions:*
          1.  *Individuation of Parts/Functions:* **Case: The "Function" of Pain.** (Congenital Insensitivity to Pain).
              *   BST: Dysfunction (pain mechanism broken).
              *   Normativist: Is it a disease if they feel no harm? Actually, they die young. Okay.
              *   *Better:* **Menopause.** Is the cessation of ovulation a dysfunction of the reproductive system or a normal transition?
          2.  *Dysfunction vs. Harm:* **Case: Asymptomatic Hypertension.**
              *   BST: Disease (statistical deviation).
              *   Normativist: Risk factor, not disease (no current harm).
          3.  *Reference Class:* **Case: Age-Related Cognitive Decline.**
              *   BST: Depends on reference class (80-year-olds vs. Humans).
              *   Normativist: Depends on whether we value cognitive retention at 80.

  6.  **Review and Refine:**
      *   Check tone: Is it dry enough for PhDs? Yes.
      *   Check constraints: Did I sneak normativism into the BST section? (e.g., avoiding "harm" in the definition of disease for the agreed section).
      *   Check predictions: Are they specific enough to be falsifiable/testable in the collaboration?
      *   *Self-Correction on Agreed Claims:* Make sure "license intervention" isn't too strong. Normativists might say disease licenses intervention, but so do other harms. BST might say disease *identifies* where intervention is medically appropriate. Wording needs care.
      *   *Self-Correction on Cruxes:* Ensure the "Prediction" isn't just "Yes/No Disease" but explains *why* based on their theory, so the *reasoning* is tested, not just the label.

  7.  **Final Polish:** Organize into the requested format. Ensure the "Disagreements Table" clearly separates the ontological commitments.

      *(Self-Correction during drafting)*: Wait, the prompt asks for "residual disagreements stated so that each would accept the wording of their own side." This means I shouldn't write "They disagree on X." I should write "Party A holds X. Party B holds Y." in a table format where they sign off on the *description* of the disagreement.

      *(Refining Test Cases)*:
