answer: |-
  This is a splendid problem. It sits right at the intersection of political philosophy, economics, and sociology, and like many good physics problems, it looks simple until you examine the boundary conditions.

  You have identified what philosophers call the **problem of special obligations**. Why do we owe more to the person living down the road than the person starving overseas, even if the latter is in greater need?

  Given your background, I think you'll appreciate framing this in terms of system architecture. The British welfare state isn't running on a single operating system; it's running a legacy codebase with several patches applied over the last 80 years. Let's break down the three theoretical kernels you identified, see where they fail, and then look at the cosmopolitan swap.

  ### 1. The Three Kernels of the Welfare State

  You asked if the basis is reciprocity, coercion, or sentiment. The uncomfortable truth is that the British state relies on all three, but invokes them selectively depending on which part of the budget is being defended.

  **A. The Actuarial/Reciprocal Model (National Insurance)**
  *   **The Theory:** You pay in, you get out. It's an insurance pool.
  *   **Where it holds:** The State Pension. This aligns with your intuition about having "paid in."
  *   **Where it breaks:** The NHS. The NHS is not actuarial. It is funded largely from general taxation, not NI, and is allocated by need, not contribution. A lifelong smoker who never worked gets the same heart surgery as a high-tax-paying non-smoker. If the system were purely reciprocal, the NHS would look like private insurance.
  *   **The Physics Analogy:** This is a closed loop conservation law. But the welfare state allows for leakage and injection based on variables other than input energy.

  **B. The Coercive/Political Model (Rawlsian)**
  *   **The Theory:** We owe each other justice because we are jointly subject to the same coercive legal and political order. We make the rules together; therefore, we must ensure the rules don't crush the weakest among us.
  *   **Where it holds:** This explains why the state owes you a pension even if you *couldn't* work (disability), provided you are a citizen. It justifies redistribution within the border because the border defines the jurisdiction of the coercion.
  *   **Where it breaks:** It doesn't explain why the duty stops at the border. If coercion is the source of obligation, what about international trade rules or climate policy that coerce foreigners?
  *   **The Physics Analogy:** This defines the system boundary. The "force" of the law applies within the box, so the "potential energy" of welfare must be distributed within the box.

  **C. The Solidarity/Identity Model (Ethical Nationalism)**
  *   **The Theory:** David Miller and others argue that shared identity makes sacrifice palatable. I pay for your pension because I see you as "one of us."
  *   **Where it holds:** This is the glue. Without it, the tax compliance rate would drop. People tolerate high taxes for compatriots much more than for abstract humanity.
  *   **Where it breaks:** It is exclusionary by definition. It struggles to accommodate new immigrants who haven't yet been assimilated into the "identity."
  *   **The Physics Analogy:** This is coherence. The wave functions must be in phase for the system to hold together.

  ### 2. Science vs. Welfare: Rivalrous vs. Non-Rivalrous

  You mentioned your career in international collaborations. Why did borders vanish there but reappear for pensions?

  **Epistemic goods (science) are non-rivalrous.** My knowing a result does not prevent you from knowing it. Giving credit to a foreign collaborator costs me nothing. In fact, it increases the total utility of the scientific community.

  **Distributive goods (pensions, healthcare) are rivalrous.** There is a finite pot of money. Giving me a pension means taxing someone else or reducing spending elsewhere.

  Science operates under a **cosmopolitan ethic** because the resource (truth) is infinite. Welfare operates under a **communitarian ethic** because the resource (capital/labour) is scarce. The inconsistency you feel arises because you are applying the logic of epistemic collaboration to distributive justice. They have different thermodynamics.

  ### 3. The Aid vs. Pension Inconsistency

  Is the system incoherent? **Yes, but functionally so.**

  If you adopt a **Prioritarian** view (help the worst off first), the system is morally bankrupt. The poorest Brit is likely in the top 10% globally by income. A strict prioritarian would argue we should slash pensions to boost aid until the marginal utility of a pound in Britain equals a pound in Malawi.

  However, the state operates on a **Two-Tier Morality**:
  1.  **Justice at Home:** We owe compatriots a decent life as a matter of right (Justice).
  2.  **Humanitarianism Abroad:** We owe foreigners assistance as a matter of charity (Beneficence).

  This allows the 0.7% (or less) aid budget to coexist with generous domestic spending. It is inconsistent if you believe morality is universal. It is consistent if you believe morality is relational (stronger duties to those in your "scheme of cooperation").

  The quiet inconsistency is this: We claim the aid is about "need," but we cap it at a level that doesn't inconvenience the "justice" owed to citizens. If aid were truly based on need, it would compete directly with domestic spending. By ring-fencing it as a tiny percentage, we admit it is secondary.

  ### 4. The Cosmopolitan Swap

  If you swapped in a properly cosmopolitan view (borders are morally arbitrary, everyone counts equally), what breaks first?

  It depends on which version of cosmopolitanism you choose, but generally, **migration policy** is the first domino, not the aid budget.

  **Scenario A: Institutional Cosmopolitanism (Global State)**
  You create global tax and welfare institutions.
  *   *Change:* National Insurance becomes Global Insurance.
  *   *Result:* You pay tax regardless of where you live; you claim benefits regardless of where you live.
  *   *Feasibility:* Near zero. Requires a global Leviathan.

  **Scenario B: Moral Cosmopolitanism (Open Borders + Redistribution)**
  You keep nation-states but remove the right to exclude.
  *   *Change:* Anyone can move to the UK to claim the pension/NHS.
  *   *Result:* The "Solidarity/Identity" kernel collapses. If the community is everyone, the willingness of high-earners to pay for the welfare of low-earners drops because the "shared identity" is diluted. The welfare state would likely shrink to a minimum safety net because the tax base would flee or the political coalition would fracture.
  *   *What changes first:* **Borders.** To be consistent, you cannot restrict movement based on economic impact.

  **Scenario C: The "Duty to Assist" (Singer/Pogge)**
  You keep borders but increase aid to the point where global inequality is mitigated.
  *   *Change:* Aid stops being "charity" and becomes "reparation" or "redistribution."
  *   *Result:* The aid budget would need to rise from <1% to perhaps 5-10% of GNI to match the redistributive nature of the domestic welfare state.
  *   *Conflict:* This directly competes with the pension. You would have to choose: lower pensions or higher taxes.

  ### The Verdict

  To answer your specific question: **The different bits of the arrangement are running on inconsistent theories.**

  *   **Pensions** run on Reciprocity (mostly).
  *   **NHS** runs on Solidarity/Coercion.
  *   **Aid** runs on Humanitarianism (a weak duty).

  If you force a cosmopolitan framework onto this, the **boundary of the community** must change first. You cannot have a cosmopolitan ethic with a nationalist tax base.

  As a physicist, you might view the current nation-state welfare model as a **metastable state**. It works because the energy barriers (borders) are high enough to prevent the system from equilibrating with the global environment. If you lower the barriers (cosmopolitanism) without changing the internal pressure (redistributive expectations), the system vents.

  Most political philosophers (like Rawls) actually conceded this. They argued that a "people" (a nation) is a distinct cooperative scheme, and justice applies primarily within that scheme. Cosmopolitans argue that in a globalized economy, the "scheme of cooperation" is now global (supply chains, climate, finance), so the boundary of justice *should* be global.

  Given your career, you know that when you change the boundary conditions of a problem, the solution changes entirely. The welfare state is a solution to a "closed system" problem. We no longer live in a closed system. The tension you feel is the sound of the model straining against the data.
