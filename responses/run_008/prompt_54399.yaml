      *   *The "Hard Problem" in RL:* We can measure loss, we can measure gradients, we cannot measure *qualia*.
      *   *The User's Specific Distinction:* Nociception (damage detection/avoidance) $\neq$ Valence (the "ouchiness" of the experience). This is crucial. A thermostat avoids heat but doesn't suffer. A robot avoids obstacles but doesn't fear.

  3.  **Drafting the Decision Procedure (The "Welfare Risk Assessment Protocol"):**
      *   *Name:* Needs to sound official but clear. "Valence Risk Assessment Protocol (VRAP)" or similar. Let's go with "Training-Time Welfare Assessment Protocol (TWAP)."
