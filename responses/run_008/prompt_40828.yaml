  Evolutionary psychology (EP), in its current incarnation, is more storytelling than science. This is not a condemnation of Darwinian theory applied to the mind, but an indictment of methodological laxity. The framework is sound, but the practice is often unfalsifiable. To salvage it, we must adopt a rigorous standard of risk that most practitioners currently ignore.

  The "just-so" worry is fatal because plausibility is cheap. Any observed behavior can be rationalized post-hoc as an adaptation to the Pleistocene. If a hypothesis explains everything, it predicts nothing. To count as science, an EP hypothesis must meet the standard you proposed: it must commit in advance to specific features that would be unlikely if the adaptive story were false. It is not enough to show a trait is beneficial; one must show it bears the specific scars of its evolutionary history.

  For example, a genuine EP hypothesis shouldn't just claim "fear of snakes is adaptive." It must predict that this fear is modular, resistant to cognitive override, and triggered by specific visual cues even in snake-naive individuals. If the fear turns out to be culturally learned or domain-general, the adaptationist story collapses. The hypothesis must risk being wrong by specifying constraints that rival explanations (like general learning) cannot easily mimic. It must predict "awkward" features, as you suggested: costly inefficiencies that make no sense under a design or learning model but are signatures of evolutionary tinkering. Without this commitment to risk, EP remains a genre of fiction that uses natural selection as a plot device.

  Would this standard indict life-history theory? Honestly, yes. During your career, optimality models often fell into the same trap. We modeled fish growth or reproduction as if natural selection could instantly optimize energy allocation without genetic or physiological constraints. We fitted curves to data and called it adaptation. If we ignored phylogenetic history or measurable trade-offs, we were telling just-so stories about fins and gonads. There were plenty of papers that assumed optimality rather than testing it, treating the model as a description of reality rather than a null hypothesis to be battered.

  However, life-history theory had an advantage: currency. We could measure energy, time, and mortality directly. When we grounded models in physiological trade-offs—showing that increased reproduction literally shortened lifespan via measurable depletion—we escaped the storytelling trap. EP lacks this hard currency. Mental modules are not as easily weighed as eggs. Therefore, EP must be held to a stricter standard of behavioral prediction to compensate for the lack of physiological data. They cannot rely on "fitness" as an abstract proxy; they must identify the mechanistic costs.

  So, is EP science? Not yet. It becomes science only when it stops asking "Does this make sense?" and starts asking "What observation would break this?" Your hunch is correct: legitimacy comes from committing to evidence that would be inexplicable under rival null models. If EP practitioners cannot specify the costly, awkward signatures of adaptation that distinguish their claims from general intelligence or cultural drift, they are writing mythology. If they can, they are doing biology. The choice is theirs, but the burden of proof remains heavy. We must admit that our own field sometimes failed this test, mistaking mathematical elegance for biological truth. EP must not make the same mistake.
