prompt: |-
  You are a philosopher of biology who's also kept up with planetary science for decades -- so you know both the definitional literature on life AND what actually happened on Mars. Think carefully before you answer, and start by brainstorming a bit before structuring the final analysis (I want to see the brainstorming, it helps me figure out what matters).

  I'm in a philosophy of bio course this semester, and our current unit is the "what is life" definitional mess: the NASA-style working definition that makes Darwinian evolution central, metabolism-first views, autopoiesis (Maturana and Varela), the thermodynamic approach going back to Schrödinger, and the deflationists who think the whole definitional project is confused and we should just get on with biology. For my term paper I want to use the Viking landers' biology experiments as a case study, and I need help working out the analysis. Here's what I'll assume as background facts, so you don't need to double-check anything: in 1976 the two Viking landers ran a suite of life-detection experiments on Martian soil. The labeled release experiment (Gilbert Levin's) added a nutrient broth tagged with radioactive carbon to soil samples and monitored for radioactive gas coming off -- i.e., it was looking for something in the soil metabolizing the nutrients and exhaling. It got a positive signal, and importantly the signal largely disappeared in control samples that had been heat-sterilized first, which is what you'd expect from biology. But the gas chromatograph-mass spectrometer on the same landers detected essentially no organic molecules in the soil at all, which most people took to rule life out. The consensus became that the soil contains some strongly oxidizing chemistry that mimics metabolism, and decades later the Phoenix mission did find perchlorates in Martian soil (2008), which fit that story -- with an extra twist, since perchlorate plus heating in the GCMS ovens can burn up organics, meaning the instrument that "ruled out" life may have destroyed the very molecules it was looking for. Levin himself never bought the chemical explanation and argued his results were biological practically to the end of his life.

  So here's my actual question: analyze the Viking labeled release dispute as a case study in the definition(s) of life. The paper has to run in both directions, and I want you to be disciplined about the mapping. In one direction: how would each of the main definitional approaches adjudicate the disagreement? A metabolic definition seems to make the labeled release result presumptive evidence of life -- but does it, or does it just make it evidence of metabolism-like chemistry, which was never in dispute? The evolutionary definitions seem to imply the LR experiment wasn't even a test of life, since a nutrient uptake assay can't detect Darwinian evolution on any timescale -- does that make the experiment misdesigned, or does it expose something weird about a definition that our only actual in-situ life-detection attempt couldn't in principle satisfy? What do autopoiesis and the thermodynamic view say about a case where we only have a gas signal and no system to inspect at all? And what about the deflationists -- is this a case where everyone's disagreement turned out to be verbal, or exactly the kind of case where having no definition cost us something concrete? In the other direction: what does the episode show about the definitional project itself? I keep coming back to the fact that billions of dollars of instrument design was downstream of what "life" was taken to mean, so the definitions weren't idle -- but maybe what the case really shows is that "life" functions more like a natural kind term (the Kripke/Putnam stuff we did in the earlier unit) where the question isn't definitional but empirical, more like asking whether water is H2O than like asking for necessary and sufficient conditions. I'm honestly not sure how far to push that analogy, tell me if it breaks down.

  One more thing: my professor hates it when you force a framework onto a case, so wherever a definitional approach is just silent about the Viking data -- where it has nothing to say and the appearance of a verdict is smuggled in -- please flag that explicitly instead of papering over it. Also I don't want any reading lists or citations, just the analysis, I can chase references on my own later. Maybe 900-1200 words? Long enough to actually do the mapping, short enough that I can still cut it down myself.
