      *(Self-Correction on Case 3)*: The prompt describes Case 3 as "a donor's offer... that amounts to a coin-flip gamble with alternating winnings and losses that grow too fast." This is effectively asking me to evaluate a Pasadena-like scenario. The procedure must identify this as "EV Undefined."

