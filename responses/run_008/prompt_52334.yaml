answer: |-
  This is a sophisticated problem for a volunteer fund, and your intuition is correct: standard Expected Value (EV) math breaks down in exactly the ways you suspect when payoffs become extreme or probabilities become speculative.

  Below is a procedure designed for your constraints (15 minutes, pencil and paper, no advanced math). Following the procedure, I have applied it to your three cases. I have explicitly tagged every claim as either **Settled** (standard consensus among decision theorists and mathematicians) or **Contested** (active debate in philosophy/economics).

  ---

  # The "15-Minute Filter" for Grant Proposals

  **Goal:** Determine if a simple Expected Value calculation is reliable, or if the proposal requires a values-based vote.
  **Tools:** Paper, pencil, calculator (optional).

  ### Step 1: The Reality Cap (5 Minutes)
  **Action:** Ask the applicant (or committee): *"What is the absolute maximum possible good this grant could do, in dollars or measurable units?"*
  *   If the answer is "Unlimited," "We don't know," or implies a chain reaction that could theoretically grow forever (e.g., "This could change the world"), write down **$1,000,000** as a hard cap.
  *   If the answer is a specific number (e.g., "It funds 20 students"), write that down.

  **Decision Rule:**
  *   If you had to impose the $1M cap because the applicant couldn't bound the outcome: **Stop.** Proceed to Step 3 (The Dominance Test).
  *   If the outcome is naturally bounded: **Proceed** to Step 2.

  > **Theory Note:**
  > *   **Settled:** In the physical world, no payoff is actually infinite. The St. Petersburg paradox relies on a bank with infinite money, which doesn't exist. Capping the series resolves the "infinite EV" problem mathematically.
  > *   **Contested:** *Where* to set the cap. Some theorists argue you should cap based on your organization's total assets; others argue for global GDP. Using $1M is a pragmatic heuristic for a small fund, not a philosophical truth.

  ### Step 2: The Probability Floor (5 Minutes)
  **Action:** Look at the probability of success assigned to the "big win."
  *   Is this probability based on past data (e.g., "This worked 1 out of 10 times before")?
  *   Or is it a guess (e.g., "We feel there's a 1% chance")?

  **Decision Rule:**
  *   If the probability is a **guess below 5%**: **Stop.** Do not trust the EV calculation. Mark as "Speculative."
  *   If the probability is **data-backed OR above 5%**: **Proceed** to Step 3.

  > **Theory Note:**
  > *   **Settled:** EV is highly sensitive to probability estimates when payoffs are large. Small errors in estimating a 0.1% chance create massive errors in EV.
  > *   **Contested:** The "cut-off" point. This is the *Pascal's Mugging* problem. Some philosophers argue we should ignore probabilities below a certain threshold entirely; others argue we must calculate them precisely. The 5% rule is a practical heuristic to avoid "speculative euphoria," not a mathematical law.

  ### Step 3: The Dominance Test (5 Minutes)
  **Action:** Calculate the Expected Value (Probability × Payoff) for the top two possible outcomes.
  *   *Outcome A (Success):* Probability $P_A$ × Value $V_A$
  *   *Outcome B (Failure/Status Quo):* Probability $P_B$ × Value $V_B$
  *   Add them to get Total EV.

  **Check:** Does Outcome A (the "long shot") contribute more than **90%** of the Total EV?

  **Decision Rule:**
  *   **Yes ( >90% driven by one outcome):** **Stop.** The EV number is mathematically valid but *decisionally meaningless*. It is driven by a single fragile assumption. **Hand to Committee for Values Vote.**
  *   **No ( <90% driven by one outcome):** **Proceed.** The EV is robust enough to guide the decision.

  > **Theory Note:**
  > *   **Settled:** If a sum is dominated by a single term in a finite series, the "average" does not represent the likely experience. This is related to the concept of *ergodicity*—what happens on average across many trials is not what happens to you in a single trial.
  > *   **Contested:** The 90% threshold. There is no universal agreement on how concentrated a distribution must be before EV loses its normative force. However, risk-aversion for finite agents is standard economic theory.

  ### Step 4: The Utility Check (Final Decision)
  **Action:** If you reached this step (EV is robust), ask: *"If we lose this money, does it hurt us twice as much as gaining it helps us?"*
  *   For small funds, losing \$5,000 is often more painful than gaining \$5,000 is helpful (diminishing marginal utility).

  **Decision Rule:**
  *   If the grant is >20% of your annual budget: **Apply a 50% discount** to the EV before approving.
  *   If the grant is <5% of your annual budget: **Trust the EV.**

  > **Theory Note:**
  > *   **Settled:** Rational agents with finite wealth should maximize *expected utility*, not expected dollars. Utility functions are typically concave (logarithmic), meaning losses hurt more than gains help.
  > *   **Contested:** The shape of the utility function. Is it logarithmic? Square root? Linear for small amounts? The "50% discount" is a rule-of-thumb approximation for risk aversion.

  ---

  # Running the Procedure on Your Cases

  Here is how the filter applies to your three scenarios.

  ### Case 1: The Coding Classes
  *   **Proposal:** \$2,000 grant. 20 students.
  *   **Step 1 (Cap):** Naturally bounded. 20 students × value of coding class. No infinity. **Pass.**
  *   **Step 2 (Prob):** "Probably reach about twenty students." Implies high probability (>80%). Data-backed (past classes). **Pass.**
  *   **Step 3 (Dominance):** EV is driven by the likely outcome (success), not a miracle. Success contributes ~80% of EV. **Pass.**
  *   **Step 4 (Utility):** \$2,000 is small relative to budget. **Trust EV.**
  *   **Result:** **Approve.** The math works here. This is a standard risk.

  ### Case 2: The State Grant Leverage (The "Exciting" One)
  *   **Proposal:** \$5,000 grant. Small chance of unlocking a large state grant. Members are excited.
  *   **Step 1 (Cap):** The state grant is large, but finite. Let's say \$500,000. **Pass.**
  *   **Step 2 (Prob):** "Small chance." Committee estimates 2%. This is a **guess**, not data. It is below the 5% Floor.
      *   *Procedure Halt:* **Stop. Do not trust EV.**
  *   **Step 3 (Dominance):** Even if we calculate it: (2% × \$500k) + (98% × \$0) = \$10,000 EV.
      *   The "Success" term contributes 100% of the EV.
      *   *Procedure Halt:* **EV is Meaningless.**
  *   **Result:** **Hand to Committee for Values Vote.**
  *   **The Unwanted Answer:** I suspect your committee *wants* a mathematical justification to fund this because the EV (\$10k) is double the cost (\$5k). The procedure denies you this. It tells you that the \$10k number is an illusion created by a guessed probability. You are not "investing"; you are buying a lottery ticket. You must admit you are funding this for the *hope*, not the *math*. If your mission is "reliable community support," the procedure forces a **No**. If your mission is "high-risk innovation," you can vote **Yes**, but you cannot hide behind the EV calculation.

  ### Case 3: The Publicity Stunt (The Pasadena Game)
  *   **Proposal:** Recurring stunt. Coin flip. Alternating winnings/losses growing too fast to number.
  *   **Step 1 (Cap):** "Grow too fast... to put a sensible number on." This implies the series does not converge.
      *   *Procedure Halt:* **Stop.**
  *   **Step 3 (Dominance):** In a Pasadena-style game, the expected value is *undefined*. It changes depending on the order you add the numbers. There is no single EV to calculate.
  *   **Result:** **Reject.**
  *   **Reasoning:** You cannot budget for an undefined number. Even if the "upside" feels large, the mathematical structure guarantees that over time, the variance will destroy your fund's ability to plan.
  *   **Theory Note:**
      *   **Settled:** For conditionally convergent series (like the Pasadena Game), Expected Value is mathematically undefined. It is not "high"; it is nonexistent. Using EV here is a category error, like dividing by zero.
      *   **Contested:** Some decision theorists suggest "truncating" the series to make it solvable. However, for a treasurer responsible for solvency, treating undefined risks as zero is the only fiduciary standard.

  ---

  # Summary of Judgment Calls vs. Math

  To ensure you know where you are standing on solid ground and where you are making a choice:

  | Procedure Step | Status | Why? |
  | :--- | :--- | :--- |
  | **Capping Infinite Payoffs** | **Settled** | Physical reality is finite. Infinite banks do not exist. |
  | **5% Probability Floor** | **Judgment Call** | This is a heuristic to prevent "Pascal's Mugging." You could choose 1% or 10%. |
  | **90% Dominance Rule** | **Judgment Call** | This defines "riskiness." A risk-neutral hedge fund might ignore this; a community fund should not. |
  | **Diminishing Utility** | **Settled** | Economic consensus that \$10k matters more to a small fund than a large one. |
  | **Pasadena Rejection** | **Settled** | Mathematically, the sum is undefined. You cannot act on "undefined." |

  ### Final Advice for the Treasurer
  Your intuition about the St. Petersburg and Pasadena puzzles is correct: they are not just academic curiosities; they describe what happens when you let "hope" substitute for "data."

  *   **Case 1** is your bread and butter. Trust the math.
  *   **Case 2** is where you will face internal pressure. The procedure protects you by forcing the committee to admit they are gambling. If they vote to fund it, they must record in the minutes: *"Funded despite unreliable EV, based on mission alignment with high-risk innovation."* This protects you later if the money is lost.
  *   **Case 3** is a trap. Do not let the donor's enthusiasm override the fact that the math is broken. A grant fund cannot survive undefined variance.

  This procedure does not guarantee you will pick winners. It guarantees that when you lose, you will know whether it was bad luck (Case 2) or bad math (Case 3).
