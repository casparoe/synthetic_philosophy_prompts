answer: |-
  # The Infinite Ticket: Why the St. Petersburg Paradox Won't Die

  It has become a ritual in rationalist circles: the St. Petersburg paradox is raised, and within five comments, it is declared dead. The executioners are usually three: the casino's finite bankroll, the concavity of utility functions, or the Kelly criterion. The thread is upvoted, the intuition is soothed, and everyone moves on.

  This confidence is misplaced. These responses are not solutions; they are evasions. They treat the St. Petersburg paradox as a calculation error in a specific model, rather than what it truly is: a *reductio ad absurdum* of the axioms underlying expected value maximization itself. To dismiss it with "banks have limited money" is to miss the point that decision theory is normative, not descriptive. It is supposed to tell us how to reason about uncertainty in principle, not just how to gamble in a world of solvent counterparties.

  If we want a decision theory that can handle existential risk, astronomical stakes, and the long-term future, we cannot sweep the infinite under the rug. We must grapple with the paradox properly.

  ### The Setup

  The game is simple. A fair coin is flipped until it lands heads. If the first heads appears on toss $n$, the payoff is $2^n$ dollars.
  *   $n=1$ (Heads): Pay $2. Probability $1/2$. Contribution to EV: $1.
  *   $n=2$ (Tails, Heads): Pay $4. Probability $1/4$. Contribution to EV: $1.
  *   $n=3$ (Tails, Tails, Heads): Pay $8. Probability $1/8$. Contribution to EV: $1.

  The expected value (EV) is the sum of these contributions: $1 + 1 + 1 + ... = \infty$.

  According to standard Expected Value Theory, a rational agent should be willing to pay any finite amount to play this game. Yet, in practice, almost no one will pay more than $25, and many refuse to pay more than $5. The gap between the infinite theoretical value and the finite market price is the paradox.

  ### The Deflationary Toolkit

  Let us weigh the standard resolutions, not as "gotchas," but as trade-offs in decision theory.

  **1. The Finite Bankroll (Truncation)**
  *The Argument:* No entity has infinite money. If the casino has a maximum payout of $W$, the game stops when $2^n > W$. The expected value becomes logarithmic in $W$. For a world-GDP-sized bankroll, the EV is roughly $60.
  *   **What it buys:** It makes the math finite. It aligns the EV with human intuition ($60 is a reasonable upper bound for what you'd pay).
  *   **What it costs:** It physicalizes a normative problem. The paradox isn't about whether a casino *can* pay; it's about whether the *expectation* commands action. If we imagine a counterparty with a bankroll of $2^{100}$ dollars (a Dyson sphere economy), the EV shoots back up to $100. Would you pay $100 for a ticket where 99.9% of the time you lose everything? The bankroll argument solves the infinity but leaves the risk intuition untouched.

  **2. Bounded Utility (Bernoulli)**
  *   **The Argument:** Money is not utility. Utility is concave (e.g., logarithmic). As wealth increases, the marginal utility of dollars decreases. The expected *utility* converges even if expected *dollars* diverge.
  *   **What it buys:** It preserves Expected Utility Theory (EUT) while matching intuition. It explains risk aversion naturally.
  *   **What it costs:** It implies a saturation point for value. If utility is bounded, then there is a maximum possible amount of "good." This creates severe tension for totalist altruists. If saving a billion lives gives you utility $U$, and saving a trillion gives you $U + \epsilon$, then the difference between a good future and an astronomical future is negligible. It forces you to deny that a galaxy-spanning civilization is vastly better than a single happy village.

  **3. The Kelly Criterion / Ergodicity**
  *   **The Argument:** Proposed by Ole Peters and the ergodicity economics crowd. EV is an ensemble average (many parallel worlds). Rational agents live in time (one world). You should maximize the time-average growth rate (geometric mean), not the arithmetic mean.
  *   **What it buys:** It explains why betting your whole bankroll is suicidal even on positive EV bets. It dissolves the paradox by showing the "infinite value" is an artifact of averaging over impossible timelines.
  *   **What it costs:** It assumes repeatability. The Kelly criterion is optimal for repeated play. But what if this is a one-off offer? If you will only ever face this choice once, why should time-average growth matter? Furthermore, Kelly is a strategy, not a utility function. It tells you *how* to bet, not *what* the bet is worth.

  **4. Rejecting Unbounded Utility (Menger)**
  *   **The Argument:** Karl Menger argued that for EUT to remain coherent, utility functions *must* be bounded. If utility is unbounded, one can always construct a St. Petersburg-like game that breaks the theory.
  *   **What it buys:** Mathematical coherence. It prevents the decision theory from exploding.
  *   **What it costs:** It is an axiomatic bullet. It declares unbounded utility functions irrational *by definition*. This is philosophically expensive, as it rules out certain moral intuitions (like "every life matters equally") a priori.

  ### Wrinkle 1: The Resale Puzzle

  Consider this variation: You hold a ticket to the game. The coin hasn't been flipped. A broker offers to buy it from you for a flat fee.
  Symmetry in Expected Value Theory suggests your "fair selling price" (Willingness to Accept, WTA) and your "fair buying price" (Willingness to Pay, WTP) should be identical. The ticket has an objective EV.

  Yet, intuitions diverge. Most people say they would sell the ticket for a few hundred dollars, but refuse to *buy* the same ticket for that same price.

  What does this asymmetry reveal?

  Standard behavioral economics points to the **Endowment Effect** or loss aversion. But for the rationalist, the deeper revelation is that **value is state-dependent, not intrinsic.**

  In EUT, the value of a gamble is the Certainty Equivalent (CE)—the cash amount that yields the same utility as the gamble.
  $$U(Wealth + CE) = E[U(Wealth + Gamble)]$$
  Because utility is concave (diminishing marginal returns), the CE depends on your *current* wealth.
  *   **When Buying:** You are trading certain cash for a risky ticket. You start with cash, end with risk. The loss of cash hurts more than the potential gain helps (due to concavity).
  *   **When Selling:** You start with the risky ticket, end with cash. You are locking in gains.

  However, the St. Petersburg Resale Puzzle is sharper. If EV is truly infinite, your WTA should also be infinite (or at least, your entire wealth). The fact that you will sell for $200 reveals that you do not believe the EV is infinite *for you*.

  The asymmetry specifically highlights **Counterparty Risk and Model Uncertainty.** When buying, you worry the game is a scam or the bankroll is fake. When selling, the broker is putting up cash *now*. The asymmetry reveals that our intuition treats the "infinite payoff" as a theoretical abstraction that vanishes upon contact with reality, but treats "cash in hand" as solid. It suggests that rational agents should not treat mathematical expectation as a price, but as a signal that is heavily discounted by the probability that the model itself is wrong.

  ### Wrinkle 2: The Pooled-Wealth Version

  This is the strongest attack on the "concave utility" resolution. Imagine you are not playing for yourself, but as the allocator for an enormous altruistic fund.
  1.  **Linear Utility:** Your goal is to save lives. One life saved is utility 1. Two lives is utility 2. There is no saturation; a billion saved lives is a billion times better than one.
  2.  **Massive Bankroll:** The counterparty is backed by an economy vastly larger than the fund (e.g., a galactic civilization). The truncation point is effectively infinite relative to your stake.

  In this scenario, the "diminishing marginal utility of money" argument collapses. Money converts linearly to moral value. The bankroll is effectively infinite. The Expected Value of the game is infinite moral utility.

  **Should the rationalist altruist pay any finite stake to play?**

  If you say **No**: You are admitting that Expected Value Maximization is not the correct normative theory for altruism. You are prioritizing risk avoidance over expected good. This undermines the core argument for Effective Altruism interventions with uncertain but high-impact payoffs (like pandemic prevention or AI safety).

  If you say **Yes**: You must bite the bullet of **Fanaticism**. You must agree that a tiny probability of an astronomical payoff outweighs a certainty of moderate good. This is the structure of Pascal's Mugging. If you accept the St. Petersburg game here, you must accept that a 1 in $10^{100}$ chance of saving $10^{100}$ lives is better than certainly saving 100 lives.

  This wrinkle forces the paradox out of the realm of "gambling psychology" and into "moral philosophy." It shows that the St. Petersburg Paradox and Pascal's Mugging are the same beast. One is the continuous limit; the other is the discrete version.

  ### The Verdict

  Is the St. Petersburg game a genuine defect in decision theory?

  **Yes.** But the defect is not in the math; it is in the axiom of **Unbounded Utility.**

  The "five-reply dismissals" fail because they try to fix the *world* (finite bankrolls) or the *strategy* (Kelly) rather than the *axioms*. The Altruistic Wrinkle proves that if you maintain linear utility over unbounded outcomes, decision theory collapses. It demands you trade everything you have for a lottery ticket with a low probability of a huge payoff. This is not rationality; it is paralysis. A system that demands you sacrifice the certain present for the infinite possible future cannot guide action.

  Therefore, the only fully worked-out position that dissolves the paradox without shrinking from the altruistic case is **Bounded Utility.**

  We must accept that utility functions *must* be bounded. This is the verdict.

  **The Cost:**
  This verdict comes with a heavy price tag that the rationalist community often tries to avoid. Accepting bounded utility means accepting that there is a maximum amount of value possible in the universe.
  1.  **Moral Satiation:** It implies that a future with $10^{50}$ happy people is not infinitely better than a future with $10^{40}$ happy people. At some point, adding more good yields diminishing returns so steep they approach zero.
  2.  **Rejection of Totalism:** It conflicts with the strict totalist view that value is simply the sum of individual welfare. If welfare is unbounded, total value is unbounded. To bound utility, we must either bound the value of individual lives or accept that the aggregation function is not a simple sum.
  3.  **Immunity to Mugging:** The benefit is that it immunizes us from Pascal's Mugging. If utility is capped at $U_{max}$, then no matter how small the probability, the Expected Utility ($p \times U_{max}$) will eventually fall below the cost of action when $p$ is small enough.

  **Conclusion:**
  The St. Petersburg Paradox is not a puzzle to be solved by noting that casinos go broke. It is a proof that **rationality requires bounded values.**

  The confidence of the comment section is misplaced because they treat the paradox as a trick of the light. It is not. It is a structural limit on how much we can care. To be a rational agent is to acknowledge that while the universe may be infinite, your capacity to value it is not. We should not mourn this limitation; it is the only thing that allows us to act. If we truly valued the infinite expectation, we would do nothing but buy lottery tickets until we starved.

  The paradox is dissolved, but only by accepting that the "Good" has a ceiling. That is the bullet the rationalist must bite.
