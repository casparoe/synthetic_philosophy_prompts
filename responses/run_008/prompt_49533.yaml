  *(Refining the Verdict)*: The most robust position in modern decision theory (and LW consensus) is that St. Petersburg proves utility *must* be bounded. I will take that stand.

  9.  **Final Plan:**
      *   Intro: The "five-reply" dismissal is wrong.
      *   Setup: The math of divergence.
