      *   *Sentence 5:* "Mill was, in short, a straightforward apologist for empire, and his case for British rule in India differs only in ornament from the arguments later used to justify every colonial venture of the following century."
          *   *Scholarly View:* "Straightforward apologist" is the contentious phrase. Recent scholarship (Pitts, Mehta, Claeys, et al.) debates whether he was a *liberal imperialist* (contradiction) or a *straightforward imperialist*.
