          *   *Minor Character:* Dangerous. Risks becoming a mouthpiece (Dante in *Commedia* works because it's allegory/vision, not realistic realism).
          *   *Fan Mail/Interviews:* This is outside the text. The user noted readers feel the world is "thinner" after meeting the author. This confirms the "magic" relies on the mystery.
      *   **Philosophical Underpinning:** Why is the manifest author "bad"? Because it collapses the *potentiality* into *actuality*. Quantum superposition analogy? No, stick to phenomenology. It reduces the *world* to a *statement*.

