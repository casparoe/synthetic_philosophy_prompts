      *   *Implied Author* (Wayne Booth) - Close, but descriptive, not prescriptive/normative.
      *   *Aesthetic Distance* - Related, but usually about emotion.
      *   *Negative Capability* (Keats) - Being in uncertainties without reaching for fact/reason. Relevant to the *state* of the writer, not necessarily the structural absence.
      *   *Divine Hiddenness* (Theology) - *Deus Absconditus*. The user mentioned this.
      *   *Kenosis* (Theology) - Self-emptying. God emptying himself to allow creation. Very strong fit.
