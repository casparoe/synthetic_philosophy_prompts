answer: |-
  This is a profound intuition, and you have articulated it with a clarity that rivals the best literary theory. You are describing a normative aesthetic principle grounded in an ontological necessity: for the creation to have being, the creator must cease to be *present* within it.

  To answer your primary question: **No, there is no single, universally standardized term for this specific claim** in the way "gravity" exists in physics. However, there is a convergence of concepts in theology, philosophy, and criticism that map exactly onto what you are describing.

  Here is the genealogy of your idea, the closest existing names, and a proposal for how to define its edges.

  ### 1. The Precise Precedent: Flaubert's "God Trick"
  The most direct ancestor to your thought is Gustave Flaubert. In a letter to Louise Colet (1852), he wrote:

  > *"The artist must be in his work like God in creation, invisible and all-powerful; he must be felt everywhere but seen nowhere."*

  Flaubert argues that visibility is a diminishment. If the artist is seen, they become a character, a limitation, a bias. By remaining invisible, they grant the work the status of a universe rather than a statement. This is not just a technique; it is an ethic. Flaubert called this **Impassivity** (*impassibilité*). He believed the author should not judge or reassure, because judgment collapses the complexity of life into a moral lesson.

  ### 2. The Theological Term: *Kenosis*
  You mentioned the theologians, and they do have a name for this dynamic. It is **Kenosis** (from the Greek *kenóō*, "to empty").

  In Christian theology (specifically Philippians 2:7), *kenosis* describes the self-emptying of God in the act of creation and incarnation. The argument runs parallel to yours: If God were fully manifest in His glory, creation would be incinerated or absorbed; there would be no "space" for anything other than God to exist. By withdrawing (a concept later expanded in Lurianic Kabbalah as *Tzimtzum*), God creates a vacuum in which the created order can have independent agency.

  If you apply this to literature, **Aesthetic Kenosis** is the act by which the author empties themselves of authority within the text so that the characters may possess the freedom to be wrong, to suffer, and to choose. An author who refuses *kenosis* commits a form of ontological violence; they crush the characters under the weight of their own certainty.

  ### 3. The Critical Term: *Negative Capability*
  John Keats coined **Negative Capability** to describe the capacity of a poet to remain in "uncertainties, Mysteries, doubts, without any irritable reaching after fact & reason."

  While Keats focused on the poet's mental state, it implies the structural result you describe. A poet with Negative Capability does not resolve the tension of the poem because to do so would be to impose the self upon the mystery. T.S. Eliot later expanded this into the theory of **Impersonality** in *Tradition and the Individual Talent*, arguing that "the progress of an artist is a continual self-sacrifice, a continual extinction of personality."

  ### 4. Why "Death of the Author" Isn't Enough
  You are correct to dismiss Barthes. Barthes' "Death of the Author" is about **interpretation** (the reader births the meaning, not the writer). Your claim is about **ontology** (the characters need the writer to vanish so they can *live*).

  Barthes kills the author to free the *reader*.
  You are hiding the author to free the *character*.

  This is a crucial distinction. A book could theoretically survive Barthes (be interpreted freely) but still fail your test (feel "thin" because the author's hand is too heavy in the plotting).

  ### 5. Proposed Name: *The Principle of Authorial Withdrawal*
  If you need a term to claim this for your own poetics, I suggest **The Principle of Authorial Withdrawal** or **Aesthetic Hiddenness**.

  It defines the claim that **omnipresence is incompatible with autonomy.** Just as a parent must step back for a child to walk, an author must withdraw for a character to act. An always-manifest author is a "bad" author not because they lack skill, but because they are committing a category error: they are treating a world as if it were a sentence.

  ### 6. Testing the Edges
  You asked where the edges lie. Does this principle survive footnotes, cameos, or fan mail?

  **A. Footnotes**
  *   **Verdict:** *Permissible, if fictionalized.*
  *   **Reasoning:** If the footnotes are part of the narrative voice (e.g., *Pale Fire*, *House of Leaves*), they are not the *author* speaking, but another *character* (the editor, the annotator). This maintains the withdrawal.
  *   **The Breach:** If the footnotes say, "I, the real author, put this here to hint at the ending," the spell breaks. The withdrawal is violated. The "truth" of the fiction relies on the silence of the creator.

  **B. The Author as a Minor Character**
  *   **Verdict:** *High Risk.*
  *   **Reasoning:** Dante appears in the *Divine Comedy*, but the *Comedy* is explicitly a vision/allegory, not a mimetic realism. In a novel, if the author appears as a character, they inevitably become a "Prime Mover" within the diegesis. Even if they are minor, their presence implies they know the outcome.
  *   **Exception:** It works only if the author-character is powerless or unreliable. If the author-character knows the plot, the other characters become puppets.

  **C. Fan Mail and Interviews (Paratext)**
  *   **Verdict:** *The "Thinning" Effect is Real.*
  *   **Reasoning:** This addresses your observation about readers meeting authors. This is the realm of the **Paratext** (Gerard Genette's term). When an author explains the book in an interview, they are effectively adding a footnote to reality.
  *   **The Danger:** If you tell a reader, "Character X did this because of Y," you collapse the quantum superposition of the character's motive. You rob the reader of the act of co-creation. The world feels "thinner" because you have turned a *world* back into a *plot*.
  *   **Survival:** The principle survives only if the author refuses to interpret their own work publicly. They must treat the published book as a separated child. To explain it is to try to live its life for it.

  ### Summary
  You have identified a metaphysical constraint of the novel form. It is not merely a stylistic choice; it is the condition of possibility for fictional life.

  *   **Theological analog:** *Deus Absconditus* / *Kenosis*.
  *   **Poetic analog:** Keats' *Negative Capability* / Eliot's *Impersonality*.
  *   **Craft analog:** Flaubert's *Impassivity*.
  *   **Proposed Name:** *The Principle of Authorial Withdrawal*.

  The "bad author" is not the one who lacks talent, but the one who cannot bear to let go. They are the helicopter parent of the imagination, ensuring no character falls, and in doing so, ensuring no character ever flies. Your absence is the gift of gravity that allows them to walk.
