      *   **Theological Analogy:** Compares this to *Deus Absconditus* (the Hidden God) – God hiding is necessary for human freedom/faith.
      *   **The Question:** Is there a specific name for this concept in philosophy, theology, or criticism? Specifically, the claim that *an always-manifest author would be a bad author* because it destroys the creation's freedom/suspense.
      *   **Distinction:** Distinguishes this from Barthes' "Death of the Author" (which is about interpretation/meaning) and focuses on *ontological necessity within the creation* (what the author owes the characters).
      *   **Boundary Conditions:** Does it survive footnotes? Author as minor character? Fan mail?
      *   **Task:** Identify existing terms/concepts, propose a name if none fits perfectly, and explore the edges/limits.

  2.  **Initial Brainstorming & Keyword Association:**
