prompt: |-
  I'm giving a talk at an actuarial science program -- the audience is mostly practicing actuaries and a couple of frequentist-leaning statisticians, plus one philosopher of science -- defending the view that the reference class problem has no solution at the level of "which class is the right one," but is dissolved once you relativize reference classes to the decision at hand: the right class for pricing a policy is different from the right class for setting a company's reserves, and neither is the right class full stop, because "the right class for what?" has to be answered first. My sketch is that choosing a class is choosing a notion of exchangeability/stability, and stability is relative to what you're going to do with the number. Prep my Q&A sheet: the objections I'll actually get from this crowd -- I'm guessing the actuaries will push back with "so it's all just judgment, that's what regulators pay us NOT to say," and the statisticians with something about model selection criteria maybe -- ordered by how badly each could sink the talk, phrased in their vocabulary, with a short reply for each and where the reply is soft. Also include the one question I'm hoping the philosopher doesn't ask.
