answer: |-
  # Q&A Prep Sheet: Dissolving the Reference Class Problem

  **Context:** Talk defends relativizing reference classes to the *decision context* (pricing vs. reserving) rather than seeking a universal "true" class.
  **Audience:** Actuaries (pragmatic/regulatory), Frequentist Statisticians (objectivity/method), Philosopher (conceptual coherence).
  **Ordering:** Ranked by potential to undermine professional credibility or theoretical core (Most Damaging → Least Damaging).

  ---

  ### 1. The Regulatory Liability Objection (Actuaries)
  **The Objection:** "If the 'right' class depends on the decision, then reserve adequacy isn't an objective fact. When a regulator asks for my audit trail under ASOP 43 or IFRS 17, I can't say 'I chose this class because it fit my decision utility.' They want to know if the reserves are *sufficient*. Doesn't this view expose us to unlimited liability by making solvency subjective?"

  **The Reply:** "It's not subjective; it's *teleological*. Sufficiency is defined relative to the risk tolerance of the stakeholder. Statutory reserves protect the guaranty fund (conservative class); Economic Capital protects shareholders (tail-risk class). Both are 'sufficient' relative to their distinct solvency definitions. We document the *decision constraint*, not just the data."

  **Where the Reply is Soft:** Regulators hate teleology; they want bright-line rules. If the regulator decides the "decision" is simply 'solvency', you're back to square one. You are pushing the reference class problem up one level to the regulator without solving it.

  ### 2. The "Just Model Selection" Objection (Frequentist Statisticians)
  **The Objection:** "You're dressing up standard model selection as philosophy. If the class depends on the decision, that implies a loss function. Why not just use cross-validation or AIC to select the class that minimizes prediction error? Why do we need a philosophical 'dissolution' when we have objective criteria for stability?"

  **The Reply:** "AIC and CV select the model that predicts *best*, but 'best' presupposes a metric. CV minimizes squared error, but pricing might care about absolute error while reserving cares about tail quantiles. The 'objective criteria' you cite already embed a decision-relative loss function. I'm just making that implicit decision explicit."

  **Where the Reply is Soft:** A hard-line Frequentist argues that coverage probabilities (e.g., 95% confidence) are properties of the *procedure*, not the loss. If you change the class to fit the loss, you break the long-run frequency properties of the estimator. You are admitting to "data dredging" by another name.

  ### 3. The Internal Consistency Objection (Actuaries/CFOs)
  **The Objection:** "If I price a policy using Class A (to be competitive) but set reserves using Class B (to be safe), my P&L will show artificial volatility. Doesn't this violate the matching principle? How do you explain the divergence to a board of directors without admitting one of the numbers is 'wrong'?"

  **The Reply:** "The numbers aren't wrong; they are measuring different risks. Pricing measures the risk of losing the sale; Reserving measures the risk of insolvency. Exchangeability holds over different time horizons for each. We reconcile them through capital allocation, not by forcing a single reference class."

  **Where the Reply is Soft:** Accounting standards (GAAP/Statutory) often require consistency between pricing assumptions and reserve assumptions to prevent earnings management. You might be describing a practice that is technically illegal or non-compliant in certain jurisdictions.

  ### 4. The "Stability of the Decision" Objection (General)
  **The Objection:** "You say stability is relative to the decision. But decisions change. If the market shifts, my pricing decision changes, and thus my reference class changes. Doesn't this make your probabilities non-stationary and useless for tracking performance over time?"

  **The Reply:** "Probabilities are always conditional on the information set and the goal. If the goal shifts, the probability *should* shift. We track performance by auditing the *decision process*, not by checking if the probability matched the outcome in a vacuum."

  **Where the Reply is Soft:** This sounds like moving the goalposts. If the probability changes every time the business strategy pivots, you lose the ability to calibrate models historically.

  ---

  ### The One Question I'm Hoping the Philosopher Doesn't Ask

  **The Question:** "You claim the reference class problem is dissolved by relativizing it to the 'decision at hand.' But how do you individuate the 'decision' without already presupposing a reference class? To decide whether you are 'pricing' or 'reserving,' you must already have classified the current activity into a type of activity. Aren't you just pushing the reference class problem back one step into the metaphysics of decision-types, creating an infinite regress?"

  **Why this sinks the talk:** It attacks the foundational move of the thesis. If defining the *context* requires a reference class, the dissolution fails, and the problem re-emerges at the meta-level. It suggests the pragmatist solution is circular.

  **Prepared Defense (If asked):** "I accept the regress but deny it's vicious. We stop at *social practices*. 'Pricing' and 'Reserving' are institutional facts, not natural kinds. We don't need a metaphysical ground for the decision; we need a sociological one. The buck stops at the institutional role."
  *(Warning: This concedes the philosophical high ground to save the practical utility.)*
