      *   **Topic:** The Reference Class Problem (RCP).
      *   **Thesis:** RCP has no universal solution ("which class is right?"); it's dissolved by relativizing reference classes to the *decision at hand* (pricing vs. reserving vs. etc.). Choosing a class = choosing a notion of exchangeability/stability, which is relative to the action/outcome.
      *   **Audience:** Practicing actuaries (pragmatic, regulatory-focused), Frequentist statisticians (objectivity, model selection), One Philosopher of Science (conceptual rigor).
      *   **Task:** Create a Q&A sheet.
