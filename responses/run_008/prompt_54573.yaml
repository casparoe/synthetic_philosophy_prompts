answer: |-
  # The "What Is This Thing?" Quiz

  So, you and your friend spent three hours arguing about a lump of clay. You're tired, you're confused, and you're pretty sure you both just picked a team based on which one sounded less ridiculous.

  Here is the deal: Philosophers have been arguing about this for fifty years, and they *still* don't agree. But they do have names for their intuitions. This quiz isn't going to tell you who is right. It's going to tell you which kind of wrong you are.

  There are 10 questions. Don't think too hard. Pick the answer that feels true in your gut.

  ### The Questions

  **1. The Raw Lump**
  A sculptor buys a ball of clay and puts it on a table. She hasn't touched it yet. Is there a statue in the room?
  *   A) No. It's just a lump of clay.
  *   B) Yes. It's a statue waiting to happen.
  *   C) It depends on what you mean by "statue."

  **2. The Smash**
  The sculptor finishes the statue. Then, she takes a hammer and smashes it flat. The clay is still there. Is the statue still there?
  *   A) No. The statue is gone; only the clay remains.
  *   B) Yes. The statue is just a flattened statue now.
  *   C) The word "statue" doesn't apply anymore, but the object is the same.

  **3. The Magic Pop**
  Imagine a magical lump of clay that pops into existence already shaped like a horse. Ten minutes later, it pops out of existence while still shaped like a horse. The "lump" and the "horse" had the exact same birth and death. Are they one thing or two?
  *   A) One thing. They share the exact same history.
  *   B) Two things. One is a "lump," the other is a "horse."
  *   C) They are the same thing right now, but could have been different.

  **4. The Ship of Theseus**
  A bronze statue stands in a park. Over 100 years, every single part of it is replaced one by one. Is it the same statue at the end as it was at the start?
  *   A) Yes. It has a continuous history.
  *   B) No. It's made of completely different stuff.
  *   C) It's the same statue, but it's a different "chunk of matter."

  **5. You and Your Atoms**
  Look at your hand. The cells die and replace themselves constantly. Are you the same physical object you were ten years ago?
  *   A) Yes. I am my body.
  *   B) No. "I" am a person, my body is just the stuff I'm made of.
  *   C) I am the same person, but not the same collection of atoms.

  **6. The Desk Explosion**
  Look at your desk. How many objects are on it?
  *   A) Just the obvious ones (laptop, mug, pen).
  *   B) Only the atoms. "Objects" are just labels we use.
  *   C) Way more than you think. Every cluster of atoms counts as an object.

  **7. The Melt Down**
  You take a gold statue and melt it into a gold bowl. Did the statue survive the process?
  *   A) No. The statue died; the bowl was born.
  *   B) Yes. It's the same gold, just rearranged.
  *   C) The gold survived, but the statue did not.

  **8. The Ghost Spot**
  Can two distinct physical things be in the exact same place at the exact same time?
  *   A) Impossible. Physics forbids it.
  *   B) Possible, if they are different *kinds* of things (like a statue and a lump).
  *   C) Only if one is inside the other.

  **9. The Scale**
  You put the clay on a scale. It weighs 1kg. You form it into a statue and put it on the scale. Does the scale now register the weight of the clay *plus* the weight of the statue?
  *   A) No. It still reads 1kg. They are one thing.
  *   B) It reads 1kg, but that's because they share the weight. There are still two things.
  *   C) The question is meaningless. Weight belongs to the matter, not the object.

  **10. The Point**
  You point at the statue and say, "That is valuable." If someone smashes the clay, did they destroy "that"?
  *   A) Yes. You were pointing at the clay.
  *   B) No. You were pointing at the shape/form, which is gone.
  *   C) You were pointing at both, but only one of them was valuable.

  ***

  ### The Scoring Key

  Don't just count As and Bs. Look at your *pattern*. Find the profile below that matches your answers most closely.

  | If you answered... | Then you are likely... | The Technical Name |
  | :--- | :--- | :--- |
  | **Mostly A** on Q1, Q2, Q7, Q8 | **The "One Thing" Purist.** You believe the statue *is* the clay. If the clay survives, the statue survives. You hate the idea of magic co-location. | **Constitutional Identity (Monism)** |
  | **Mostly B** on Q1, Q2, Q7, Q8 | **The "Two Things" Theorist.** You believe the statue and clay are distinct neighbors sharing an apartment. One can die while the other lives. | **Constitution View (Coincidentalism)** |
  | **Mostly C** on Q3, Q4, Q9 | **The Time-Slicer.** You think objects are long "worms" through time. The statue is just a slice of the clay's life. | **Four-Dimensionalism (Perdurantism)** |
  | **Mostly B** on Q6 | **The "Nothing Exists" Skeptic.** You think "objects" are just human labels. Strictly speaking, there are only atoms. | **Mereological Nihilism** |
  | **Mostly C** on Q1, Q2, Q10 | **The "It Depends" Pragmatist.** You think identity depends on how we talk or what sort of thing we are counting. | **Sortalism / Relative Identity** |

  ***

  ### The Messy Bits (Read This Before Posting Your Score)

  You asked for honesty, so here it is. This quiz is a map, but the territory is swampy. Here is where the lines blur.

  **1. The Sortalism vs. Relative Identity Trap**
  You suspected this, and you were right. In the quiz, **Sortalism** (objects have rules based on their kind) and **Relative Identity** (identity itself is relative) often lead to the exact same answers.
  *   *Why?* Both views say: "It's the same *clay*, but not the same *statue*."
  *   *The Quiz Limitation:* There is almost no concrete case where a normal person can distinguish these two in a multiple-choice format. If you landed in the "It Depends" bucket, you could be either. Philosophers fight over this distinction, but for a party argument, they function identically.

  **2. The "Too Many Things" Glitch (Incoherent Combos)**
  If you answered **B** on Q6 ("Way more than you think") but **A** on Q8 ("Impossible for two things to be in the same spot"), you have a logic glitch.
  *   *Why?* If every cluster of atoms is an object (Q6-B), then you have thousands of objects in the same spot (your hand, your atoms, the molecules).
  *   *The Verdict:* This combo is basically无人 (nobody) holds it. It's usually a sign you wanted to sound deep on Q6 but got scared of magic on Q8. This is the "I want universalism without the cost" error.

  **3. The Simultaneous Case (Q3)**
  This is the hardest question.
  *   If you said **A** (One thing): You prioritize *history*. If they start and end together, they are identical.
  *   If you said **B** (Two things): You prioritize *kind*. Even with the same history, a "lump" has different survival conditions than a "horse."
  *   *The Trap:* Many people answer **A** here but **B** on Q2 (The Smash). This is inconsistent. If they are one thing because of history (Q3), the statue shouldn't die when smashed if the clay survives (Q2). If you did this, you're likely a **Constitutionalist** who got tripped up by the magic scenario.

  **4. The 4Dism Overlap**
  Four-Dimensionalists (Time-Slicers) often sound like Identity Theorists.
  *   *Why?* A 4D-er says the statue is a *part* of the clay's timeline. So, in a way, they are "one big worm."
  *   *The Quiz Limitation:* If you scored as a "One Thing" purist but also said "Yes" to Q4 (Replacement), you might actually be a 4D-er in disguise. You accept the object changes over time because you see it as a long tube, not a single moment.

  **5. The "Nobody Holds This" Zone**
  If you answered **B** on Q1 (Yes, there is a statue before shaping) and **A** on Q2 (No, the statue is gone after smashing), you hold a view almost no philosopher defends.
  *   *Why?* This implies the statue exists *before* the artist makes it, but dies when they unmake it. This suggests statues are dormant spirits waiting in the clay.
  *   *The Verdict:* This is the "Magic Objects" charge your friend threw at you. If you landed here, you might want to rethink Q1.

  ### Final Advice for the Blog
  Post the quiz, but post this "Messy Bits" section right underneath it. If you don't, the comments section will just become a three-hour argument about Question 3, and nobody wants to read that.

  The goal isn't to win the argument. It's to realize that when your friend says "It's just clay," and you say "It's a statue," you aren't disagreeing about the world. You're disagreeing about where the word "thing" starts and stops. And honestly? That's more fun than being right.
