      *   *No, let's look at Rule 1 vs Rule 2.* Rule 1 says "Cheapest option that works." Rule 2 says "Option that doesn't hurt."
      *   *Separating Case:* **A student with a documented phobia of buses requesting taxi funding.**
      *   *Rule 1 (Min Cost):* Refuse (Bus is cheap and technically works).
      *   *Rule 2 (Medical Necessity):* Depends. Is a phobia a medical barrier like arthritis (Fund) or emotional distress like a breakup (Refuse)?
      *   *This works.* It forces the committee to decide if "Medical Necessity" covers psychological conditions (aligning with Case 1/5) or excludes them (aligning with Case 2).

      *Wait, I need to make sure I commit definitively.*
