      *   *Let's look at Case 1 & 5.* They funded "extras" (flatmate classes, kitchen) for social reasons.
      *   *Let's look at Case 2 & 4.* They refused based on "universal experience" or "personal choice."

      *   *Better Rule Formulation:*
          1.  **The "Cheapest Adequate Mode" Rule:** (Case 3). Fund the lowest cost option that technically provides access. (Predicts: Refuse Taxi).
          2.  **The "Involuntary Physiological Barrier" Rule:** (Case 1, 4, 5). Fund accommodations where the body itself prevents standard access, provided it's not self-inflicted (Case 4) or purely emotional (Case 2). (Predicts: Fund Taxi).
          3.  **The "Social Participation" Rule:** (Case 1, 5). Fund costs that enable social integration, not just academic attendance. (Predicts: Fund Taxi, as exhaustion prevents full life, but weaker link than Rule 2).

      *   *Actually, the strongest tension is between Case 3 (Rail/Car) and Case 1/5 (Interpreter/Kitchen).*
