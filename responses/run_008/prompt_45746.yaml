      *   The Taxi Application sits right between these. Is the bus "adequate" (Case 3) or is it a barrier to "meaningful participation" due to pain (Case 1/5)?

      *   *Let's finalize the three rules:*
          1.  **Rule of Minimum Sufficient Access:** (Precedent: Case 3). We fund the cheapest method that physically gets the student to the destination. Comfort is secondary.
          2.  **Rule of Medical Necessity:** (Precedent: Case 1, 4, 5). We fund accommodations where a documented medical condition makes the standard access physically damaging or impossible, distinguishing physical limitation from emotional distress (Case 2) or choice (Case 4).
          3.  **Rule of Holistic Participation:** (Precedent: Case 1, 5). We fund costs that prevent isolation and enable full university life, not just lecture attendance.

