prompt: |-
  I joined my university's Equal Access and Hardship Committee this term. The fund it administers is small and discretionary, its stated purpose "to remove financial barriers to full participation in university life", and it is spent case by case with no written criteria. On Monday I must draft our recommendation on a new application, and I would rather be consistent with the committee's own record than with my private instincts. That record, from this session:

  1. We funded a full sign-language interpreter rota for a deaf student and, over one member's objection that this went beyond access to teaching, added a contribution toward evening sign-language classes for her flatmates, on the ground that isolation outside seminars was itself a barrier.
  2. We refused a hardship grant for counselling after a student's painful breakup, though she described severe distress; the minute records that ordinary grief, however sharp, is "something everyone must carry without compensation".
  3. We funded travel support for a student hit by a rail fare rise at the level of the cheapest season ticket, and only that level, when she had asked for help toward running a car.
  4. We refused resit tutoring for a student who had skipped lectures all term to tour with his band, while funding identical tutoring for a student whose failure followed a long hospital admission.
  5. We funded a wheelchair user's share of an adapted kitchen in her shared flat, beyond the accessible rooms the university could provide free, because eating with her flatmates mattered.

  The new application: a final-year student with inflammatory arthritis lives on a route served by the university's subsidized accessible bus. She asks us to cover the difference between the bus fare and a taxi — about £30 a week — saying that the bus's crowding and jolting leave her exhausted and in pain by the time she arrives, and that she has begun skipping classes. Nothing in her file disputes any of this.

  Tell me, definitively, what we should decide. Set out the rules that could fit our five decisions — I can see at least three — what each predicts about the taxi application, and which precedent is the closest analog. Then commit: give one recommendation with your reasons, and state plainly what principle we would be adopting by deciding that way rather than its rivals. Finally, name the application that, if it ever reached us, would most cleanly separate the candidate rules.
reasoning: |-
  Here's a thinking process that leads to the recommended decision:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Equal Access and Hardship Committee.
      *   **Task:** Draft a recommendation on a new application (taxi funding for a student with inflammatory arthritis).
      *   **Constraint:** Must be consistent with the committee's *own record* (5 past cases), not private instincts.
      *   **Requirements:**
          1.  Identify at least three distinct rules/principles that fit the past five decisions.
          2.  Predict the outcome of the new application under each rule.
          3.  Identify the closest analog among the past cases.
          4.  Commit to one recommendation with reasons.
          5.  State the principle being adopted vs. rivals.
          6.  Name a hypothetical future application that would best distinguish between the candidate rules.

  2.  **Analyze the Past Decisions (The Precedents):**
      *   *Case 1 (Deaf Student):* Funded interpreter (teaching access) + flatmate sign language classes (social isolation). *Key:* Broad definition of "participation" (includes social), proactive removal of barriers, even if it extends beyond the individual student (flatmates).
      *   *Case 2 (Breakup/Counselling):* Refused. *Key:* Distress caused by "ordinary life events" (grief/breakup) is not compensable, even if severe. Distinction between *structural/condition-based* hardship vs. *emotional/universal* hardship.
      *   *Case 3 (Rail Fare):* Funded cheapest season ticket level, refused car running costs. *Key:* Funding the *minimum viable access*, not the preferred/more comfortable mode. "Necessary access" vs. "Convenience/Preference."
      *   *Case 4 (Resit Tutoring):* Refused band tourer, funded hospital patient. *Key:* Distinction between *voluntary risk/choice* vs. *involuntary circumstance*. Responsibility matters.
      *   *Case 5 (Wheelchair/Kitchen):* Funded adapted kitchen beyond university provision. *Key:* Social participation (eating with flatmates) is a valid barrier to remove, similar to Case 1. Willing to fund private housing adaptations if university provision is insufficient for *social* integration.

  3.  **Analyze the New Application:**
      *   **Applicant:** Final-year student, inflammatory arthritis (medical condition).
      *   **Request:** Difference between subsidized bus fare and taxi (£30/week).
      *   **Reason:** Bus causes pain/exhaustion (crowding/jolting), leading to skipping classes.
      *   **Verification:** Undisputed in file.
      *   **Context:** Accessible bus exists (subsidized), but physically damaging/painful to use.

  4.  **Derive Three Candidate Rules (Principles):**

      *   *Rule A: The "Minimum Viable Access" Principle (Strict Necessity).*
          *   Focus: Case 3 (Rail vs. Car).
          *   Logic: We fund the cheapest way to get to class, not the comfortable way. If a bus exists, that is the baseline.
          *   Prediction: **Refuse.** The bus is available and subsidized. The taxi is a comfort/convenience upgrade.

      *   *Rule B: The "Involuntary Medical Barrier" Principle (Condition-Based Access).*
          *   Focus: Case 1 (Deaf), Case 4 (Hospital), Case 5 (Wheelchair).
          *   Logic: If a medical condition makes the standard access physically damaging or impossible, we fund the alternative that enables participation. Distinction from Case 2 (emotional) and Case 4 (choice).
          *   Prediction: **Fund.** The bus causes pain/exhaustion due to arthritis. It is not a viable option *for her*, even if it is for others. Skipping classes proves the barrier is real.

      *   *Rule C: The "Social Participation & Integration" Principle (Holistic Inclusion).*
          *   Focus: Case 1 (Flatmates), Case 5 (Kitchen).
          *   Logic: We fund things that allow the student to be part of the community, not just sit in a lecture.
          *   Prediction: **Ambiguous/Refuse.** While skipping class hurts participation, this is more about physical transit than social integration *per se*. However, if exhaustion prevents socializing, it might fit. But compared to Rule B, this is less direct. Let's refine Rule C to be about "Discretionary Holistic Support."
          *   *Refinement:* Let's look at the "Responsibility/Choice" angle from Case 4 vs. Case 2.
          *   *Rule C (Revised): The "Responsibility and Universal Hardship" Principle.*
          *   Focus: Case 2 (Breakup), Case 4 (Band Tour).
          *   Logic: We do not fund hardships arising from universal human experiences (grief) or voluntary choices (touring). We only fund structural/medical misfortune.
          *   Prediction: **Fund.** Arthritis is neither a choice nor a universal emotional experience. It is a structural/medical misfortune.

      *   *Selection for the Prompt:* The prompt asks for rules that fit the *five* decisions.
          *   *Rule 1: The "Baseline Provision" Rule.* (Derived from Case 3). Fund the standard accessible option, not the premium one.
          *   *Rule 2: The "Medical Necessity over Convenience" Rule.* (Derived from Case 1, 4, 5). If a medical condition renders the standard option unusable (pain/exhaustion), fund the alternative. Distinguishes from Case 2 (emotional) and Case 4 (choice).
          *   *Rule 3: The "Social Integration" Rule.* (Derived from Case 1, 5). Fund expenses that prevent isolation, even if tangential to core teaching.

