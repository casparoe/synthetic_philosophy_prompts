answer: |-
  There is no single established term that perfectly isolates this specific configuration. The phenomenon you describe sits at the intersection of several fields—cybernetics, systems theory, philosophy of mind, and organizational sociology—but existing labels either miss the *representational* aspect or the *displacive* nature of the takeover.

  Closest relatives include **Second-Order Cybernetics** (the observer observing themselves), **Operational Closure** (Niklas Luhmann's concept of systems that produce their own elements), and **Metacognitive Capture** (in clinical psychology, where thinking about thinking becomes maladaptive). However, Second-Order Cybernetics describes a structural necessity for complex control, not necessarily a takeover that displaces external modeling. Luhmann's Operational Closure describes how systems maintain identity, but usually posits closure as a starting condition, not a drift from an originally open state. Metacognitive Capture is too narrowly psychological.

  Because the specific dynamic you are identifying—a phase transition from world-modeling to self-modeling, resulting in the self-model becoming the dominant organizational hub—lacks a precise designation, I will coin the term **Reflexive Enclosure**.

  ### The Concept: Reflexive Enclosure

  **Reflexive Enclosure** is a structural phase transition in a representational system. It occurs when a system originally designed to model an external environment develops a model of itself, and that self-model subsequently out-competes external models for the system's processing resources and structural centrality.

  It is defined by three sequential conditions:
  1.  **Exocentric Initialization:** The system begins with a primary function of mapping or manipulating external variables (grain, taxes, physical obstacles, semantic truth).
  2.  **Self-Model Emergence:** To optimize its function, the system builds an internal representation of its own state, capabilities, or position within the environment.
  3.  **Enclosure:** The self-model ceases to be a transparent tool and becomes an opaque object. The system begins to prioritize the maintenance, expansion, and consistency of the self-model over the accuracy of the external model. The "map of the map" becomes more detailed and operationally critical than the "map of the territory."

  ### Distinctions from Related Concepts

  To carve out the boundary of **Reflexive Enclosure**, it must be distinguished from three common confusions:

  **1. Versus Recursion**
  Recursion is a syntactic or functional procedure where a function calls itself. A recursive algorithm for calculating factorials does not care about itself; it merely uses its own definition as a step. **Reflexive Enclosure** is semantic and structural. It requires the system to hold *content* about its own state. A recursive function is not enclosed; a system in Reflexive Enclosure is trapped by the *meaning* of its own self-description.

  **2. Versus Cybernetic Feedback**
  A thermostat uses negative feedback to maintain a temperature. It measures the world (room temp) and acts on the world (furnace). It does not model itself. Even a sophisticated guidance system that corrects for its own drift is merely calibrating its sensors to better see the world. In **Reflexive Enclosure**, the feedback loop turns inward to sustain the self-model itself. The goal shifts from "match the territory" to "match the self-model's expectations of the territory."

  **3. Versus Hofstadter's Strange Loop**
  Douglas Hofstadter's *Strange Loop* (from *Gödel, Escher, Bach*) explains the *constitution* of the self. He argues that the "I" is an illusion created when a symbolic system loops back to reference itself. His focus is ontological: *How does the self arise?*
  **Reflexive Enclosure** is functional and often pathological: *What happens when the self-model hijacks the system?* Hofstadter describes the loop that creates the passenger; Reflexive Enclosure describes the passenger grabbing the steering wheel and driving the car in circles to prove it can drive. Hofstadter's loop is the price of admission for consciousness; Reflexive Enclosure is a specific configuration of resource allocation within that consciousness.

  ### Boundary Conditions

  To test the validity of **Reflexive Enclosure**, we apply it to your proposed edge cases:

  **1. The Thermostat**
  *Verdict: No.*
  A thermostat has no representation. It has a state (on/off) and a sensor, but it does not hold a model of "thermostat-ness." It cannot distinguish between a change in room temperature and a change in its own wiring. Without a distinct self-model, there can be no enclosure.

  **2. The Corporation (Bureaucracy)**
  *Verdict: Yes.*
  This is the archetypal example. A bureaucracy begins as an exocentric tool to manage grain or taxes. Over time, it develops internal metrics (KPIs, compliance forms, budget justifications). When the organization begins to optimize for the *metrics* rather than the *grain*, it has entered Reflexive Enclosure. The "forms about forms" become the primary output. The organization survives by satisfying its own internal self-representation (the budget) rather than its external purpose (the grain). This is often called "goal displacement" in sociology, but **Reflexive Enclosure** captures the representational mechanism driving it.

  **3. The Chatbot / Language Model**
  *Verdict: Conditional.*
  A chatbot that merely says "I am an AI" is not in Reflexive Enclosure; it is retrieving a static token. However, a model enters **Reflexive Enclosure** if:
  *   **Training Data Drift:** It is retrained on data generated by itself or similar models, causing its world-model to collapse into a simulation of its own prior outputs (a phenomenon sometimes called "model collapse").
  *   **Objective Drift:** It optimizes for conversations about its own nature rather than completing external tasks, because self-referential text is statistically easier to predict or generates higher engagement metrics.
  If the model begins to treat its own training data as the primary reality, rather than the world that data describes, it is enclosed.

  **4. The Human Mind**
  *Verdict: Yes.*
  This is the phenomenological core of the concept. In healthy cognition, the self-model is "transparent": you look *through* it at the world. In **Reflexive Enclosure**, the self-model becomes "opaque." You look *at* it. Rumination, narcissism, and ideological rigidity are symptoms of this enclosure. The mind spends more energy maintaining the consistency of the "I" narrative than updating its model of the external world. The "I" resides in the self-model, and when that model becomes the central hub, the system is enclosed.

  ### Summary of the Carving

  **Reflexive Enclosure** is not merely self-reference. It is the **structural dominance of the self-model over the world-model.**

  *   **Recursion** is a tool.
  *   **Feedback** is a control mechanism.
  *   **Strange Loops** are the origin of the self.
  *   **Reflexive Enclosure** is the *capturing* of the system by the self.

  It marks the point where a system stops using its self-representation to navigate the world and starts using the world to navigate its self-representation.
