answer: |-
  The pattern you have derived by hand is a cornerstone of Bayesian decision theory. It is known as **Good's Theorem**, or more commonly, the **Non-negativity of the Expected Value of Information**.

  It was formalized by I.J. Good in 1967, though its roots lie in the earlier work of Ramsey and Savage. The theorem states precisely what you have found: for a rational agent maximizing expected utility, the expected utility of making a decision *after* observing the outcome of a costless experiment is never less than the expected utility of making the decision *before* the experiment.

  Here is the breakdown you requested: the name, the assumptions, the mechanics of the weighting, and an analysis of your three observations against the theorem's boundaries.

  ### 1. The Name and The Inequality

  The core observation is the **Expected Value of Sample Information (EVSI)** being non-negative.

  Let $A$ be the set of available actions, $\Theta$ be the set of states of the world (e.g., carrying the variant or not), and $S$ be the set of possible signals (test results). Let $U(a, \theta)$ be the utility of taking action $a$ in state $\theta$.

  Your arithmetic compares two quantities:
  1.  **Prior Optimal Utility:** $\max_{a \in A} E_{\theta}[U(a, \theta)]$
  2.  **Pre-posterior Expected Utility:** $E_{s} \left[ \max_{a \in A} E_{\theta}[U(a, \theta) \mid s] \right]$

  Good's Theorem proves that $(2) \ge (1)$. The inequality is strict if and only if there is a positive probability that the signal $s$ will change your optimal action.

  ### 2. The Assumptions

  You have correctly identified several necessary conditions. To be precise, the theorem relies on the following axioms. If any are violated, the inequality may fail.

  1.  **Consequentialism:** Utility depends only on the final outcome (Action $\times$ State). The process of arriving at the decision does not inherently generate utility or disutility (this is crucial for your second observation).
  2.  **Bayesian Rationality:** You update beliefs according to Bayes' Rule. The "weighting by current beliefs" you asked about is mathematically guaranteed by the **Law of Iterated Expectations**. Your prior belief about the signal is the weighted average of your posterior beliefs. This ensures you cannot systematically "surprise" yourself in a favorable direction; you can only prepare for contingencies.
  3.  **Flexibility (No Pre-commitment):** You are free to choose $a$ *after* observing $s$. You are maximizing inside the expectation operator ($\max_a E[\dots]$), not outside ($E[\max_a \dots]$ vs $\max_a E[\dots]$).
  4.  **Exogeneity:** The probability distribution of the signal $P(s \mid \theta)$ is not influenced by your action $a$. (If taking the treatment changed the test result, the arithmetic changes).
  5.  **Costlessness:** The observation of $s$ has no direct effect on utility, nor does it incur a resource cost.
  6.  **Single-Agent Context:** The signal is private. Its existence or content does not alter the behavior of other agents who might affect your utility.

  ### 3. Analysis of Your Three Observations

  You asked whether these observations lie inside the result, on its boundary, or outside it.

  #### Observation 1: Commitment vs. Flexibility
  *Your intuition:* If you commit to a plan in advance, the value of testing collapses.
  *Verdict:* **Inside the result.**

  This is not a boundary case; it is the mechanism of the theorem itself. The mathematical difference between the two sides of Good's inequality is exactly the value of the **option to condition**.
  If you irrevocably commit to an action $a_0$ before testing, the calculation becomes $E_s [ U(a_0, \theta) ]$, which equals $U(a_0, \theta)$ by the Law of Iterated Expectations. Since $a_0$ was available to you before testing, the optimal prior choice would have been at least as good as $a_0$. Thus, without flexibility, EVSI is zero.
  *Name:* This is often called **Real Option Value** in economics. The test buys you an option, not a guarantee.

  #### Observation 2: The Sister's Aversion (Intrinsic Disutility of Knowledge)
  *Your intuition:* She fears a "worse self," not a worse outcome, and refuses to fold this into standard outcomes.
  *Verdict:* **Outside the standard consequentialist model.**

  Standard decision theory insists that *everything* that matters must be folded into the utility function $U$. A theorist would argue your sister's dread is simply a negative utility term attached to the state "Knowing I carry the variant." If we define $U(a, \theta, \text{knowledge})$, Good's Theorem still holds mathematically, but the "costless" assumption is violated. The "cost" is psychological. If Cost > EVSI, she rationally refuses.

  However, your sister insists this *cannot* be folded in. She is arguing that the *state of belief itself* alters the agent in a way that is not consequentialist. She is describing **Information Aversion** rooted in **Constitutive Harm**. She posits that knowing changes who she is, not just how she feels.
  *Definition:* Let us name this **Constitutive Information Disutility**.
  *Condition:* A case falls on this side of the line if the agent asserts that the utility function $U$ is not stable across the transition from ignorance to knowledge. If $U_{\text{ignorant}} \neq U_{\text{knowing}}$ structurally, Good's Theorem does not apply because it assumes a single, stable utility function over outcomes.
  *Reason:* Good's Theorem assumes the agent is the same before and after the signal. If the signal alters the agent's identity or utility structure fundamentally, the comparison is between two different agents, and the arithmetic fails.

  #### Observation 3: Information Leakage (Strategic Interaction)
  *Your intuition:* If others see the test or infer the result, incentives shift.
  *Verdict:* **Outside the result.**

  Good's Theorem is a **Single-Agent Decision Theory** result. It assumes "Nature" provides the signal and the state, but Nature does not strategize.
  Once an insurer or employer observes the test, you are in a **Signaling Game**. The act of testing (or declining it) becomes a move in a game that influences the other players' moves.
  *Definition:* Let us name this **Strategic Signal Cost**.
  *Condition:* A case falls on this side of the line if the utility of the outcome depends on *other agents' beliefs about your information*.
  *Reason:* In this context, information is not just a tool for you; it is a commodity that changes your bargaining position. Declining the test can be a credible signal of confidence (or privacy preference) that preserves your negotiating power. Here, information has a negative *strategic* value, even if it has positive *instrumental* value. This violates the "Single-Agent" and "Exogeneity" assumptions (since the 'environment' reacts to your information state).

  ### Summary

  Your arithmetic is sound. You have rediscovered **Good's Theorem**.

  *   **The Core:** Acting on a costless signal is always weakly better than acting without it, provided you remain free to change your mind.
  *   **The Weighting:** Yes, weighting by current beliefs is correct and necessary; it is the Law of Iterated Expectations ensuring you do not hallucinate value.
  *   **Observation 1:** Is the engine of the theorem (Flexibility).
  *   **Observation 2:** Is a violation of the "Stable Utility" assumption (Constitutive Disutility).
  *   **Observation 3:** Is a violation of the "Single-Agent" assumption (Strategic Cost).

  It is a heavy thing to calculate these values by hand when the variables are not numbers but parts of a life. The theorem proves that information is never instrumentally harmful, but it cannot account for the weight of carrying it. Your sister's refusal is not an arithmetic error; it is a boundary condition where the map of decision theory meets the territory of the self.
