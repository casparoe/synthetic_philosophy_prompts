answer: |-
  # Joint Statement on the Special Composition Question

  **Preface**
  After one year of adversarial collaboration, the undersigned Mereological Universalist (U) and Organicist (O) submit this statement regarding the Special Composition Question (SCQ). While ontological commitments remain divergent, we have clarified the structure of our dispute.

  ### 1. Agreed Claims
  1.  **The Question:** The SCQ asks: *Under what conditions do some things compose a further thing?* This differs from the general question of composition (whether composition occurs at all) by seeking the specific restriction principle, if any, that governs when composition occurs.
  2.  **The Argument from Vagueness:** We agree that the argument from vagueness establishes that if composition is restricted, the restriction must be vague, unless one accepts brute modal facts. However, since classical mereology is not logically compulsory, this argument cannot establish universalism as a logical truth; it merely shows that restriction carries a theoretical cost regarding vagueness.
  3.  **Ontological Costs:** O acknowledges their view entails that ordinary artifacts (tables, ships) do not exist as composite objects, but only as simples arranged artifact-wise. U acknowledges their view entails the existence of "wild" fusions (e.g., the fusion of the Eiffel Tower and my left shoe), committing them to an ontology vastly larger than common sense suggests.
  4.  **Conditions for Falsification:**
      *   **U:** "I am wrong if it can be demonstrated that there is a natural, non-arbitrary restriction on composition that does not entail unacceptable vagueness."
      *   **O:** "I am wrong if it can be demonstrated that 'constituting a life' is not a metaphysically privileged relation compared to 'being arranged tablewise'."
  5.  **Quantifier Variance:** We agree that some portion of our dispute may stem from divergent interpretations of the existential quantifier, though we disagree on whether this renders the dispute merely verbal.

  ### 2. Disagreements

  | Issue | Universalist Wording | Organicist Wording | Genuine/Verbal |
  | :--- | :--- | :--- | :--- |
  | **Vagueness** | Composition is never vague; existence is precise. Any apparent vagueness is semantic indeterminacy. | Composition can be vague; life has no precise beginning or end, and existence inherits this vagueness. | Genuine |
  | **Privilege** | 'Life' is no more joint-carving than any other spatial relation; restricting composition to life is ad hoc. | 'Life' is a fundamental natural kind; restricting composition to life captures the structure of reality. | Genuine |
  | **Artifacts** | Tables exist. The term 'the table' refers to a fusion of simples bonded together. | Tables do not exist. The term 'the table' refers loosely to simples arranged tablewise, but strictly refers to nothing. | Verbal |

  ### 3. Cruxes with Predictions
  To resolve genuine disagreements, we identify the following sub-questions and test cases.

  *   **Sub-question:** Is there a precise moment when composition begins during the assembly of an organism?
  *   **Concrete Case:** A sorites sequence involving sperm and egg cells gradually combining metabolic processes until a zygote forms.
  *   **Predictions:**
      *   **U:** Composition occurs at every stage of the sequence. There is a precise instant where the fusion exists, even if epistemically inaccessible.
      *   **O:** Composition occurs only when the joint activity constitutes a self-maintaining life. There is no precise instant; the boundary is vague.

  *   **Sub-question:** Does interlocking physical parts without biological function generate an object?
  *   **Concrete Case:** Two people gradually interlock their fingers and share blood circulation via tubes without forming a single biological life.
  *   **Predictions:**
      *   **U:** A new composite object (the fusion of the two people) comes into existence as soon as they touch.
      *   **O:** No new object comes into existence, as no new life is constituted.

  ### 4. The Problem of the Many
  Regarding the problem of the many (e.g., the one cloud surrounded by many equally good candidate clouds), we acknowledge a joint commitment. Since both parties accept that persons exist (U as fusions, O as living organisms), both face the problem regarding human boundaries (shedding skin cells). We jointly commit to the claim that there is no unique, precise boundary for any person. U resolves this by accepting many overlapping person-fusions exist. O resolves this by accepting vagueness in when a life begins or ends. Thus, both agree that reference to ordinary objects is indeterminate, even if they disagree on whether the indeterminacy is ontological or semantic.

  ### 5. Verdict on Verbal vs. Non-Verbal
  **Collaborative Verdict:** We conclude that the dispute regarding artifacts is largely verbal, turning on the semantic rules for ordinary terms like 'table'. However, the dispute regarding unrestricted composition versus life-restriction is genuine, reflecting a substantive disagreement about the fundamental structure of reality and the nature of vagueness.

  **Universalist Reply:** The Organicist achieves ideological parsimony only by sacrificing ideological power. By denying the existence of tables, they force a paraphrase strategy that complicates semantics without reducing ontological commitment, since the simples arranged tablewise still exist. Their restriction is unmotivated metaphysically.

  **Organicist Reply:** The Universalist achieves ontological simplicity regarding rules (unrestricted composition) only by exploding ontological commitment. By accepting every fusion, they trivialize the notion of an 'object'. My view respects the intuition that existence is significant; not every arbitrary collection of particles deserves the status of being.

  ***

  ^1 ^U ^counts ^approximately ^10^40 ^composite ^objects ^created ^during ^drafting ^(including ^every ^possible ^fusion ^of ^ink ^pixels ^and ^digital ^bits). ^O ^counts ^zero ^new ^composite ^objects, ^as ^no ^new ^lives ^were ^sustained ^by ^the ^process ^of ^writing, ^though ^the ^two ^authors ^continued ^to ^exist.
