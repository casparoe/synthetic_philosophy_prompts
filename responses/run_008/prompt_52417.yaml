  **MEMORANDUM**
  **TO:** Guideline Development Committee
  **FROM:** Chair, Patient and Public Involvement Panel
  **SUBJECT:** Framework for Patient Testimony in [Condition] Guidance Development
  **DATE:** October 26, 2023

  **Recommendation**

  I recommend we adopt a hybrid institutional design combining options (b) and (c). Specifically: (1) Establish a Standing Patient Panel with defined rights to review draft recommendations and require a formal response to their objections; and (2) Integrate structured Patient-Reported Outcome Measures (PROMs) into the evidence base as a distinct class of "Phenotypic Data," separate from clinical efficacy evidence. This approach avoids treating testimony as mere anecdote while preventing its conflation with causal evidence. It acknowledges that in the absence of biomarkers, patient report constitutes the primary data regarding the condition's existence and impact, without granting patient groups veto power over clinical safety standards.

  **Rationale: Addressing Epistemic Failures**

  This design targets three specific institutional failure modes. First, it addresses the *credibility deficit*, where patient reports are heard but assigned negligible weight due to preconceived notions of psychogenesis. By mandating a formal response to Patient Panel objections, we prevent testimony from being silently discarded. Second, it addresses the *hermeneutical gap*, where the committee lacks the concepts to formulate what patients describe, rendering testimony unintelligible rather than merely unconvincing. Requiring PROMs to be categorized as "Phenotypic Data" forces the committee to engage with the symptom structure itself, not just treatment outcomes.

  However, we must acknowledge the residual risk pressed by our methodological colleagues: *organizational capture*. In contested fields, the most organized groups are not always the most representative. This design does not eliminate that risk; it mitigates it through transparency rather than exclusion. By recording dissent and categorizing data types explicitly, we make the influence of organized groups visible to external scrutiny. We accept that some weighting bias may remain, but we judge this preferable to the systemic exclusion of the only available data source on the condition's reality.

  **Operational Criteria for Reviewers**

  To ensure this framework is applied consistently, the following criteria must be met during drafting:

  1.  **Justification for Discounting:** If a working group chooses to discount patient testimony regarding symptom severity or prevalence, an "Epistemic Justification Statement" must be filed. This statement cannot simply cite hierarchy levels; it must specify whether the testimony conflicts with physiological data or represents a divergence in lived experience versus clinical observation.
  2.  **Citation Register:** PROMs and narrative testimony may be cited to establish disease burden, symptom phenotype, and acceptability of interventions. They must not be cited as evidence of etiology or biological efficacy unless corroborated by physiological measures. All citations must be labeled "Patient-Reported Data" in the evidence tables.
  3.  **Disagreement Escalation:** If the Standing Patient Panel disagrees with a draft recommendation regarding management or care pathways, the final guidance must include a "Dissenting View" appendix summarizing their position. The lead clinicians must provide a counter-justification in the same document. This ensures disagreement is recorded as a substantive scientific dispute rather than a procedural footnote.

  **Engaging the Methodological Objection**

  We must engage honestly with the strongest argument from the methodological faction: that what appears as prejudice may be a necessary function of evidence hierarchies misfiring in a data-poor environment. It is possible that our patient representatives are partly correct about the harm but incorrect about the mechanism. The "discount" applied to patient accounts may not stem from identity prejudice alone, but from a rigorous adherence to rules designed to prevent false positives in treatment efficacy.

  If we treat testimony as equivalent to trial data, we risk validating campaigning as science. Therefore, our remedy is not to lower the bar for causal evidence, but to widen the scope of what counts as relevant information for *guidance*. Guidance is not solely about curing; it is about managing uncertainty. The methodologists are right that testimony cannot prove etiology; they are wrong that it therefore holds no weight in defining care standards. By categorizing PROMs as "Phenotypic Data," we respect the hierarchy for causality while elevating patient report for phenotype. This acknowledges that the methodologists' concern is valid regarding *truth claims* about biology, but insufficient regarding *normative claims* about care.

  **Conclusion**

  This hybrid model treats the current controversy not as a battle between rhetoric and evidence, but as a design flaw in how we aggregate knowledge where biomarkers are absent. It prevents the silence of the undiagnosed without granting unchecked authority to the organized. It requires clinicians to articulate why they disagree with patients, rather than simply overriding them. I ask the committee to approve this framework for the upcoming drafting cycle.

