  **Operational Criteria for Reviewers**

  To ensure this framework is applied consistently, the following criteria must be met during drafting:

  1.  **Justification for Discounting:** If a working group chooses to discount patient testimony regarding symptom severity or prevalence, an "Epistemic Justification Statement" must be filed. This statement cannot simply cite hierarchy levels; it must specify whether the testimony conflicts with physiological data or represents a divergence in lived experience versus clinical observation. Silence is not a valid response to testimony.
  2.  **Citation Register:** PROMs and narrative testimony may be cited to establish disease burden, symptom phenotype, and acceptability of interventions. They must not be cited as evidence of etiology or biological efficacy unless corroborated by physiological measures. All citations must be labeled "Patient-Reported Data" in the evidence tables to maintain clarity on the source of the claim.
  3.  **Disagreement Escalation:** If the Standing Patient Panel disagrees with a draft recommendation regarding management or care pathways, the final guidance must include a "Dissenting View" appendix summarizing their position. The lead clinicians must provide a counter-justification in the same document. This ensures disagreement is recorded as a substantive scientific dispute rather than a procedural footnote, allowing future researchers to see where the uncertainty lies.

  **Engaging the Methodological Objection**

  We must engage honestly with the strongest argument from the methodological faction: that what appears as prejudice may be a necessary function of evidence hierarchies misfiring in a data-poor environment. It is possible that our patient representatives are partly correct about the harm but incorrect about the mechanism. The "discount" applied to patient accounts may not stem from identity prejudice alone, but from a rigorous adherence to rules designed to prevent false positives in treatment efficacy. When clinicians apply a discount to organized groups, they may be attempting to protect the guidance from campaigning rather than attacking the patients' credibility.

  If we treat testimony as equivalent to trial data, we risk validating campaigning as science. Therefore, our remedy is not to lower the bar for causal evidence, but to widen the scope of what counts as relevant information for *guidance*. Guidance is not solely about curing; it is about managing uncertainty. The methodologists are right that testimony cannot prove etiology; they are wrong that it therefore holds no weight in defining care standards. By categorizing PROMs as "Phenotypic Data," we respect the hierarchy for causality while elevating patient report for phenotype. This acknowledges that the methodologists' concern is valid regarding *truth claims* about biology, but insufficient regarding *normative claims* about care. We accept their warning against conflating advocacy with evidence, but reject the conclusion that advocacy contains no evidence relevant to care.

  **Conclusion**

  This hybrid model treats the current controversy not as a battle between rhetoric and evidence, but as a design flaw in how we aggregate knowledge where biomarkers are absent. It prevents the silence of the undiagnosed without granting unchecked authority to the organized. It requires clinicians to articulate why they disagree with patients, rather than simply overriding them. I ask the committee to approve this framework for the upcoming drafting cycle.

