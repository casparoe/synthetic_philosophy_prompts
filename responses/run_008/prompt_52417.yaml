  **MEMORANDUM**
  **TO:** Guideline Development Committee
  **FROM:** Chair, Patient and Public Involvement Panel
  **SUBJECT:** Framework for Patient Testimony in [Condition] Guidance Development
  **DATE:** October 26, 2023

  **Recommendation**

  I recommend we adopt a hybrid institutional design combining options (b) and (c). Specifically: (1) Establish a Standing Patient Panel with defined rights to review draft recommendations and require a formal response to their objections; and (2) Integrate structured Patient-Reported Outcome Measures (PROMs) into the evidence base as a distinct class of "Phenotypic Data," separate from clinical efficacy evidence. This approach avoids treating testimony as mere anecdote while preventing its conflation with causal evidence. It acknowledges that in the absence of biomarkers, patient report constitutes the primary data regarding the condition's existence and impact, without granting patient groups veto power over clinical safety standards.

  **Rationale: Addressing Epistemic Failures**

  This design targets three specific institutional failure modes. First, it addresses the *credibility deficit*, where patient reports are heard but assigned negligible weight due to preconceived notions of psychogenesis. In contested conditions, testimony is often treated as secondary color rather than primary data. By mandating a formal response to Patient Panel objections, we prevent testimony from being silently discarded. The committee must actively justify why a consistent patient report is not sufficient to establish a symptom profile.

  Second, it addresses the *hermeneutical gap*, where the committee lacks the concepts to formulate what patients describe, rendering testimony unintelligible rather than merely unconvincing. When patients describe fatigue that is not sleepiness, or pain that is not inflammation, standard clinical categories may fail to capture the phenomenon. If we rely solely on existing biomedical markers, the testimony cannot be heard as testimony at all. Requiring PROMs to be categorized as "Phenotypic Data" forces the committee to engage with the symptom structure itself, creating a shared language for the condition's reality even in the absence of biological confirmation.

