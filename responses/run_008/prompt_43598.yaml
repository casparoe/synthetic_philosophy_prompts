      *   **Context:** Mid-size online retailer, thousands of tickets/day, inconsistent QA reviews.
      *   **Core Problem:** Reviewers conflate four distinct types of rigidity (Bug, Bad Policy, Discretion Gap, Correct-but-Rigid).
      *   **Constraints:** 2 minutes per transcript, no philosophy background for reviewers, small set of verdicts, short reasons, realistic examples, acknowledge limitations (where judgment calls remain).
      *   **Key Concept:** "Sphexishness" – being captured by a procedure such that the means no longer serve the end, revealed by counterfactual intervention (the "nudge").
