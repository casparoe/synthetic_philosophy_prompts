      *   *Step 3: The Policy Check.* Is there a written rule? (Policy vs. Discretion).
      *   *Step 4: The "Nudge" Simulation.* If the customer pushed back, did the agent offer an alternative or just repeat?
      *   *Verdicts:* Bug, Policy Fix, Discretion Gap, Correct (Escalate), Values Call.
      *   *Constraint Check:* Keep it under 2 mins. No jargon.

  4.  **Developing the Worked Examples:**
      *   *Case A (Discretion Gap):* Policy says 30 days. Customer is day 35. Agent says no. Policy *actually* allows under $75 exception, but agent doesn't know. Verdict: Discretion Gap.
      *   *Case B (Bug):* Order number loop. Verdict: Bug.
      *   *Case C (Correct-but-Rigid):* Age verification. Verdict: Correct (Escalate to Human for empathy, not policy change).
      *   *Case D (The Unpopular One):* Needs to be tricky. Maybe a "Bad Policy" that reviewers think is a "Bug" or vice versa. Let's make it a case where the agent followed a stupid policy perfectly, but reviewers want to blame engineering. Or a case where it *looks* like a loop but is actually a safety check. Let's go with a "Correct-but-Looks-Dumb" where the reviewer *wants* to fix it, but shouldn't. Actually, the prompt asks for *one* worked case where the team will hate the verdict. Let's make it a "Policy Fix" where the team wants to blame the Agent/Bug because it's easier.
      *   *Refining the "Unpopular" Case:* Let's create a Case D where the agent denies a refund based on a policy that is technically correct but customer-hostile. Reviewers will want to call it a "Discretion Gap" (fix the bot) but the procedure says "Bad Policy" (fix the rulebook). Why does the team hate this? Because "Fix the rulebook" is political hell; "Fix the bot" is a Jira ticket.

  5.  **Refining the "Nudge" Concept for Static Transcripts:**
      *   Since reviewers can't interact, they must look for *evidence of failed adaptation*.
      *   Did the customer provide the info? Yes. Did the agent use it? No. -> Bug.
      *   Did the customer ask for an exception? Yes. Did the agent acknowledge the request but cite a hard block? -> Policy/Discretion.
      *   Did the agent offer *any* path forward? If no, it's rigid.

  6.  **Writing the Content (Iterative refinement):**
      *   *Tone:* Professional, slightly academic but grounded in ops reality.
      *   *Structure:* Brainstorming -> Procedure -> Examples -> Limitations.
      *   *Check:* Did I explain "sphexish"? Yes. Did I keep it short? Need to ensure the checklist isn't 15 steps.
      *   *Self-Correction on "Discretion Gap" vs "Bad Policy":* This is the hardest distinction.
          *   Bad Policy: The rule written in the doc is bad.
          *   Discretion Gap: The rule in the doc is fine, but humans know when to ignore it, and the bot doesn't know that.
          *   *Operational distinction:* If the reviewer (human) would also be in trouble for approving it, it's Bad Policy. If the reviewer could approve it but the bot can't, it's a Discretion Gap.

  7.  **Final Polish:**
