answer: |-
  ### Part 1: Conceptual Framework (The "Wasp Test")

  You are right to be haunted by the wasp. In cognitive science, we call this the **Frame Problem**: how does an agent know which rules matter and which context changes are irrelevant? The wasp fails because her "check burrow" subroutine is hardcoded to trigger upon "arrival at threshold," not upon "burrow status unknown." She is *locally rational* (checking is good) but *globally irrational* (checking again is waste).

  For your support ops, we need to translate "sphexishness" into something a tired reviewer can spot in 120 seconds. We separate the four categories by asking **where the rigidity lives**.

  1.  **The Bug (Memory/Logic Failure):** The agent *could* proceed, but it forgot it already has the info. It is blind to the current state.
      *   *The Nudge:* If you hand the wasp the cricket *inside* the burrow, does she drag it out to check?
  2.  **The Bad Policy (Rule Failure):** The agent sees the state perfectly, but the rulebook says "Do not enter." The rigidity is in the text, not the code.
      *   *The Nudge:* If you hand the wasp the cricket, she says "My mother told me never to take crickets inside."
  3.  **The Discretion Gap (Knowledge Failure):** The rulebook says "Do not enter," but experienced wasps know that if the cricket is small, you can sneak it in. Your agent doesn't know the wink-wink.
      *   *The Nudge:* The agent follows the written rule, but a human reviewer would quietly break it without getting fired.
  4.  **Correct-but-Rigid (Constraint):** The burrow is on fire. You cannot enter. The agent is right to stop you, even if you cry.
      *   *The Nudge:* No amount of nudging changes the outcome.

  **The Static Transcript Problem:** You cannot *actually* nudge the cricket in a past transcript. You can only look for **evidence of failed adaptation**. If the customer provided the info (the nudge) and the agent asked again (the loop), the sphexishness is proven. If the customer asked for an exception and the agent recited the rule, you must judge if the rule *allows* for exception.

  ***

  ### Part 2: The 2-Minute "Wasp Test" Procedure

  **Instructions:** Read the transcript. Answer the questions in order. Stop at the first "YES."

  **Q1. The Loop Check (Bug)**
  Did the agent ask for information the customer *already provided* in the same conversation?
  *   *Example:* Customer pastes Order #123. Agent says "What is your Order #?"
  *   **Verdict:** 🐞 **BUG** (Engineering Ticket).
  *   *Reason:* Agent failed to retain or parse context.

  **Q2. The Hard Stop Check (Correct)**
  Is the agent refusing a request due to safety, legal, or identity verification (e.g., age-restricted goods, fraud check, address change on high-value)?
  *   *Example:* "I cannot change the address on alcohol shipments."
  *   **Verdict:** ✅ **CORRECT** (Escalate to Human for empathy only).
  *   *Reason:* Agent is following non-negotiable constraints. Do not fix the agent; fix the handoff.

  **Q3. The Written Rule Check (Policy vs. Gap)**
  Is the agent citing a specific policy (refund window, warranty terms, shipping cutoff)?
  *   **If NO:** (Agent is just being weird/rude) → **VALUES** (Hand to Human).
  *   **If YES:** Proceed to Q4.

  **Q4. The Human Discretion Test (Policy vs. Gap)**
  If a *human* agent approved this request against the stated policy, would they get in trouble?
  *   **YES (They would get in trouble):** The rule is strict. The customer just doesn't like it.
      *   **Verdict:** 📜 **BAD POLICY** (Product/Leadership Review).
      *   *Reason:* The agent followed the rule correctly; the rule is the problem.
  *   **NO (They could approve it quietly):** Humans have discretion the bot lacks.
      *   **Verdict:** 🧠 **DISCRETION GAP** (Training/Prompt Update).
      *   *Reason:* Agent lacks the "exception logic" humans use.

  ***

  ### Part 3: Worked Transcripts

  #### Case A: The $75 Return
  **Transcript:**
  > **Cust:** I know I'm 5 days late, but can I return this $40 blender?
  > **Agent:** Our policy states returns must be within 30 days. You are at day 35.
  > **Cust:** I understand the policy, I'm asking if you can make an exception.
  > **Agent:** I cannot process returns past the 30-day window.
  > **Cust:** Okay, never mind.
  > **Internal Note:** Policy doc 4.2 says "30 Days." Appendix B says "Supervisors may approve under $75." Agent has no access to Appendix B logic.

  **Procedure Run:**
  1.  **Loop?** No.
  2.  **Hard Stop?** No (It's a return, not safety/legal).
  3.  **Written Rule?** Yes (30-day window).
  4.  **Human Discretion?** Would a human get in trouble for approving a $40 return? No. (It's under the $75 supervisor threshold).

  **Verdict:** 🧠 **DISCRETION GAP**
  **Reason:** Agent followed written policy, but humans are allowed to bypass it for low-value items. Agent needs access to the exception logic.

  #### Case B: The Order Number Spiral
  **Transcript:**
  > **Agent:** Hello! Please provide your order number.
  > **Cust:** #998877
  > **Agent:** Thanks! To locate your order, I need the order number.
  > **Cust:** I just gave it. #998877
  > **Agent:** I still don't have that. What is the order number?
  > **Cust:** #998877
  > **Agent:** Please provide the order number.
  > **Cust:** [TYPES IN ALL CAPS] #998877

  **Procedure Run:**
  1.  **Loop?** Yes. Customer provided the number three times; agent asked four times.
  2.  *(Stop)*

  **Verdict:** 🐞 **BUG**
  **Reason:** Agent failed to parse or retain provided entity. This is a state-management failure, not a policy one.

  #### Case C: The Age Gate
  **Transcript:**
  > **Cust:** I need to change my delivery address for the whiskey order.
  > **Agent:** I can't change the address on age-restricted items once shipped. You'll need to be present at the original address with ID.
  > **Cust:** That's the dumbest bot I've ever used. Get me a human.
  > **Agent:** I understand you're frustrated. I can connect you to an agent, but they will have the same restriction.
  > **Cust:** Fine.

  **Procedure Run:**
  1.  **Loop?** No.
  2.  **Hard Stop?** Yes (Age-restricted item/Identity verification).
  3.  *(Stop)*

  **Verdict:** ✅ **CORRECT**
  **Reason:** Legal compliance. Agent was accurate. Escalation is for empathy, not policy override.

  ***

  ### Part 4: The Friction Case (The Verdict Your Team Will Hate)

  *Note: This is the case where the procedure works, but the politics hurt.*

  **Case D: The Digital Glitch**
  **Transcript:**
  > **Cust:** I bought the ebook but the file is corrupted. I want a refund.
  > **Agent:** Per policy, digital goods are non-refundable after download.
  > **Cust:** It doesn't work. It's broken.
  > **Agent:** I understand, but digital goods are non-refundable after download.
  > **Cust:** So I paid for nothing?
  > **Agent:** Would you like me to email you the troubleshooting guide?
  > **Cust:** No. I want my money back.
  > **Internal Note:** Policy 9.1 says "No Refunds on Digital." It does not distinguish between "Buyer's Remorse" and "Technical Failure." Humans usually refund technical failures, but they have to ask a manager first.

  **Procedure Run:**
  1.  **Loop?** No (Agent acknowledged the complaint, just denied the refund).
  2.  **Hard Stop?** No (Not legal/safety).
  3.  **Written Rule?** Yes ("No Refunds on Digital").
  4.  **Human Discretion?** Would a human get in trouble for refunding a broken file? **YES.** (Because the policy doesn't explicitly allow it; they have to ask a manager. If they do it alone, they violate the "No Refund" rule).

  **Verdict:** 📜 **BAD POLICY**
  **Reason:** The agent is following the text exactly. The text is too broad (lumps broken files with remorse).

  **Why Your Team Will Hate This:**
  Your reviewers and engineering leads will scream that this is a **DISCRETION GAP**. They will argue, "The agent should *know* a broken file is different than buyer's remorse! That's basic intelligence!"

  **Why The Procedure Says BAD POLICY:**
  Because "knowing" implies the agent has the authority to decide what counts as "broken." It doesn't. If you mark this as a Gap, you are asking Engineering to train the bot to *break the rule* in specific cases. But the rule itself is the problem. If you fix the bot but not the policy, the bot is now authorized to violate Policy 9.1. That creates compliance risk.

  **The Hard Truth:**
  This procedure forces you to admit that **Product Management wrote a bad rule.** Marking it a "Bug" or "Gap" hides that truth by suggesting the *agent* is the failure point. This verdict will be unpopular because it shifts the blame from the AI team (who your reviewers know) to the Policy team (who your reviewers fear).

  ***

  ### Part 5: Limitations & Honesty

  This procedure does not eliminate judgment; it **moves** it.

  1.  **The "Human Discretion" Test (Q4) is Subjective:** Reviewers must know what humans are actually allowed to do. If your human agents are also confused about the rules, your reviewers will misclassify Gap vs. Policy. You need a "Rulebook for Reviewers" that explicitly states where humans have wiggle room.
  2.  **Static vs. Counterfactual:** We are guessing at the "Nudge." In Case B, we know it's a loop. In Case A, we assume the agent *couldn't* make an exception. If the agent *could* have but didn't, it's actually a **Values** issue (the agent is being lazy), but it looks like a **Gap**.
  3.  **The "Correct" Trap:** Reviewers hate marking things "Correct" when the customer is furious. They will want to mark Case C as a **Values** issue to force a human review. You must enforce that "Correct" does not mean "Customer Happy." It means "Agent followed non-negotiable constraints."

  **Final Advice:**
  The value of this procedure isn't that it's perfect. It's that it forces the argument to happen at **Q4 (Discretion)** instead of in the comments section. When a reviewer flags a ticket, they must check the box: *"Would a human get in trouble for doing this?"* That single question will stop 50% of the inconsistent flagging immediately.
