          2.  The Decision Procedure (checklist/flow).
          3.  Three worked examples (A, B, C).
          4.  One "unpopular verdict" case with honest reflection on limitations.

  2.  **Conceptual Brainstorming (The "Why"):**
      *   *The Wasp Analogy:* The core insight is that you can't tell if behavior is "dumb" just by watching it once. You need to know if the behavior *adapts* to the goal or just *repeats* the step.
      *   *Category 1 (Bug):* The agent is broken. It's not following a rule; it's failing to process input. Like the wasp forgetting she already dragged the cricket in.
      *   *Category 2 (Bad Policy):* The rule exists, but the rule is wrong for the situation. The agent follows it perfectly. The "dumbness" is in the rulebook, not the code.
      *   *Category 3 (Discretion Gap):* Humans have unwritten "wink-wink" discretion. The agent doesn't know it exists. It looks like Bad Policy, but the policy text is fine; the *implementation* lacks the human "out."
      *   *Category 4 (Correct-but-Rigid):* The rule is non-negotiable (legal/safety). The customer hates it, but the agent is right. This isn't sphexish; it's fidelity.
      *   *The "Nudge" Problem:* In a static transcript, we can't *actually* nudge the cricket. We have to simulate the nudge in our heads. "If the customer had said X, would the agent have done Y?"
      *   *Sphexishness Definition for Ops:* "Is the agent repeating a step that no longer advances the resolution, and does it fail to recognize that the context has changed?"

  3.  **Drafting the Procedure (The "How"):**
      *   *Goal:* Fast, binary decisions where possible.
      *   *Step 1: The Goal Check.* What was the agent trying to do? Did it succeed?
