      *   *Too hard.*
      *   *Round 2 Strategy:* Let them discuss. The discussion creates correlation. Use a hard trivia question. "What is the population of the US?" (330M). Options: 250M, 330M, 400M. If they discuss, the loud wrong person sways the group.
