answer: |-
  This is a fantastic idea. Condorcet's Jury Theorem is counter-intuitive, and seeing it fail is even more important than seeing it work. Since you only have 20 minutes and 22 people, **time management is your biggest enemy.** You cannot get bogged down in complex scoring math.

  Here is a complete lesson plan designed to run tightly, look professional, and deliver that "shock" factor.

  ### Activity Title: "The Majority Bet"
  **Time:** 20 Minutes
  **Materials:** 
  *   Small slips of paper (1 per student, plus 5 extras).
  *   Whiteboard + Markers.
  *   A timer (your phone).

  ---

  ### Part 1: Setup (3 Minutes)
  **Write this on the board before class starts:**
  > **THE MAJORITY BET**
  > 1. Answer the Question.
  > 2. Predict: Will >50% of the class get this right? (Yes/No)
  > 3. Wager: How many points (1-5) do you bet on your prediction?
  >
  > **SCORING:**
  > *   If your Prediction is Correct: You win your Wager.
  > *   If your Prediction is Wrong: You lose your Wager.
  > *   (Individual answers are just for the record).

  **Script:**
  "Hey everyone. Today we're testing the 'Wisdom of the Crowd.' There's a theorem that says a group vote is often smarter than the individuals in it. We're going to bet points on whether that's true. You have 30 seconds per question to write your Answer, your Prediction (Yes/No), and your Wager (1-5 points). No talking yet."

  ---

  ### Part 2: Round 1 — The Theorem Works (7 Minutes)
  **Goal:** Independent voting. The Majority *will* be right, but students will doubt it.
  **Constraint:** **Absolute silence.** No looking at neighbors' papers.

  **Question 1:** "How many keys are on a standard piano?"
  *   A) 76
  *   B) 88
  *   C) 96
  *(Correct: B. Most people don't know, but random guessing + partial knowledge usually puts $p > 0.5$).*

  **Question 2:** "What year did the Titanic sink?"
  *   A) 1902
  *   B) 1912
  *   C) 1922
  *(Correct: B. High probability individuals know this).*

  **Question 3:** "Which is heavier: A pound of lead or a pound of feathers?"
  *   A) Lead
  *   B) Feathers
  *   C) Same Weight
  *(Correct: C. Classic trick, but most juniors know this).*

  **Execution:**
  1.  Read Q1. Start timer (30 secs). Collect slips for Q1 immediately into a pile.
  2.  Repeat for Q2 and Q3.
  3.  **Do not grade yet.** Keep the slips.

  **The Reveal (The Shock):**
  1.  Ask: "For Q1, raise your hand if you voted that the **Majority would be Right**." (Count hands quickly, write number on board).
  2.  Reveal the actual class accuracy. (Quickly sort the answer pile into 3 stacks: A, B, C. Count the biggest stack).
  3.  **Likely Outcome:** The Majority Stack (B) is huge (e.g., 18/22 correct). But only 5-8 students predicted "Yes."
  4.  **Say:** "Look at that. The group was right 80% of the time, but most of you bet against them. You just lost points by doubting the crowd."

  ---

  ### Part 3: Round 2 — The Theorem Breaks (5 Minutes)
  **Goal:** Break the "Independence" condition.
  **Constraint:** **Forced Discussion.**

  **Script:**
  "Round 2. Same rules. But before you write anything, you have **2 minutes to discuss the answer with your neighbors.** You must try to agree on the truth."

  **The Question:** "What is the capital of New York State?"
  *   A) New York City
  *   B) Albany
  *   C) Buffalo

  **Why this works:** A huge portion of people instinctively think "New York City." If they vote independently, enough people might know it's Albany. But if they *talk*, the "NYC" intuition spreads like a virus. This creates **correlated error**. The votes are no longer independent.

  **Execution:**
  1.  Let them talk. It will get loud. Walk around and encourage them to "convince each other."
  2.  Collect slips.
  3.  **The Reveal:**
      *   Ask: "Who bet that the Majority would be Right?" (Almost everyone will raise their hand because the discussion made them confident).
      *   Reveal the vote count. (Likely, the "NYC" stack will be the majority).
      *   **Say:** "The majority was Wrong. And because you talked, you all made the *same* mistake. You lost your wagers."

  ---

  ### Part 4: The Debrief (5 Minutes)
  **Write on Board:**
  > **CONDORCET'S JURY THEOREM**
  > 1. Individuals must be competent ($p > 50\%$).
  > 2. Votes must be **INDEPENDENT**.

  **Script:**
  "So, is the theorem fake? No. But it has strict rules.
  In Round 1, you thought independently. Even if you weren't sure, your errors canceled out, and the signal remained. The math says as the group gets bigger, the accuracy goes to 100%.
  In Round 2, we broke Rule #2: Independence. When you talked, you copied errors. If everyone makes the *same* mistake, the majority vote amplifies the error instead of fixing it.
  **Takeaway:** Crowds are wise only when they think for themselves."

  ---

  ### Heads-Up: What Could Go Wrong (And How to Fix It)

  **1. "The Majority actually loses Round 1."**
  *   *Risk:* Statistical variance. Even if $p=0.6$, with 22 people, there's a small chance the majority flips wrong.
  *   *Fix:* Have a backup line. "Interesting! The theorem says this *should* happen. But because our group is small (22 people), randomness still plays a role. The theorem works best with hundreds of people. But look at Round 2..."
  *   *Prevention:* The questions I selected (Titanic, Piano, Lead/Feathers) are high-probability knowledge for juniors. The majority *should* hold.

  **2. "Students don't talk in Round 2."**
  *   *Risk:* They are shy.
  *   *Fix:* Be aggressive during the 2 minutes. "I need to hear debating! Turn to your neighbor and tell them why you're right." If they stay quiet, the majority might still be right (Albany), which ruins the shock.
  *   *Backup:* If they don't talk enough, *you* give a hint. "I heard someone say NYC earlier..." (Lie if you have to).

  **3. "Scoring takes too long."**
  *   *Risk:* You spend 10 minutes counting slips and run out of time.
  *   *Fix:* **Do not calculate individual scores.** Just do the "Show of Hands" for the Prediction (Yes/No). That gives the emotional hit without the math. Tell them: "I'll tally the final points and post them Monday, but look at your hands right now—that's where you lost."

  **4. "You get nervous."**
  *   *Fix:* Write the Script (the bolded "Say" parts above) on a notecard. Hold the notecard. It's okay to read. It makes you look prepared, not nervous.
  *   *Timing:* Wear a watch or keep your phone timer visible. If you hit the 15-minute mark, skip the Q3 reveal in Round 1 and jump straight to Round 2.

  ### Final Checklist for Friday Morning:
  1.  Cut 25 slips of paper.
  2.  Write the Board Setup (Rules + Debrief points) before the bell rings.
  3.  Memorize the 4 questions.
  4.  Remember: **Silence** in Round 1, **Noise** in Round 2.

  You've got this. It's stats class; they expect numbers, but they'll remember the game. Good luck!
