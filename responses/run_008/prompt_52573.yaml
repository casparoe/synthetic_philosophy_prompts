      *   *Round 1 (Success):* Independent thinking. Hard-ish questions.
      *   *Round 2 (Failure):* Correlated errors or $p < 0.5$. How to force this without internet?
          *   *Idea:* Ask a question where common intuition is wrong (e.g., Monty Hall style, or a specific stats misconception).
          *   *Idea:* Let them talk before voting (introduces correlation).
          *   *Idea:* Give them a "hint" that is actually misleading.
      *   *Scoring:* Keep it simple. Points for correct individual answer + points for accurate prediction of the group.

  4.  **Drafting the Game Structure:**
