prompt: |-
  ok weird ask but here goes. im a junior and my stats teacher has this thing where every friday one student runs the first 20 minutes of class as a warm-up activity, and next week its me. class is 22 ppl and we just finished a probability unit. i read somewhere that if every person in a big group is only slightly better than a coin flip at getting a question right, the majority vote can still be right like 95% of the time?? which honestly sounds fake to me but the teacher says its a real theorem (condorcet or something like that).

  design me a game that makes the class actually feel this instead of just being told it. like ideally they vote on questions where theres a real answer, but before i reveal the results they each have to bet (no real money, some point system) on how accurate the majority will be, so most of them get it wrong and are shocked. then a second round where it breaks — where ppl can see each others answers or all make the same kind of mistake — bc that feels like the obvious catch that the theorem is ignoring. include rules, scoring, a short debrief i can lead even tho im a student and not a teacher, and a heads up on what will probably go wrong the first time i run this (im kind of nervous lol). only materials should be paper and the whiteboard, and nothing where you need to look stuff up on the spot
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

