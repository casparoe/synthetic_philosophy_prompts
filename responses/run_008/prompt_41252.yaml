  **Joint Statement on the Ontology of Dreaming**

  **1. Agreed Claims**
  1.  **Physiology:** Sleep states (including REM) are necessary but not sufficient conditions for dream reports; neurophysiology does not entail phenomenology.
  2.  **Evidence:** Dream reports are waking utterances. They are evidence of a sleeper's disposition to speak upon arousal, not direct transcripts of sleep.
  3.  **Rejected Pictures:** Both parties reject the 'Cartesian Cinema'—the notion of a homunculus viewing a continuous stream of private images during sleep.

  **2. Residual Disagreements**

  | Claim | Malcolmian Position | Dennettian Position |
  | :--- | :--- | :--- |
  | **Ontology** | Attributing 'experience' to sleepers is a category mistake; the concept lacks verification conditions. | 'Dream experience' is a valid heterophenomenological construct, constituted retrospectively upon waking. |
  | **Memory** | Memory is irrelevant; there is nothing to remember. | Memory inserts the narrative at wake-up ('uploading'), creating the dream. |
  | **Truth** | Dream reports are neither true nor false regarding sleep states. | Dream reports are true of the subject's waking narrative, false if claiming concurrent viewing. |

  **3. Cruxes and Pre-registered Predictions**

  **Crux A: Verificationism vs. Heterophenomenology**
  *Does removing concurrent experience satisfy verificationist concerns?*
  *   **Case:** Lucid dreaming eye-signalling (pre-arranged motor codes during REM).
  *   **Malcolmian Prediction:** Signals prove motor disposition remains active, compatible with unconscious processing. No proof of 'experience'.
  *   **Dennettian Prediction:** Signals constitute data for the heterophenomenological record, validating the narrative without requiring qualia during sleep.

  **Crux B: Individuation of Experience**
  *What distinguishes dream reports from waking confabulation?*
  *   **Case:** External stimulus incorporation (e.g., water spray during REM).
  *   **Malcolmian Prediction:** Report is a waking linguistic response to arousal; the 'dream' is post-hoc rationalisation.
  *   **Dennettian Prediction:** Report is a memory insertion triggered by arousal; functionally identical to confabulation but causally linked to sleep states.

  **4. Note on Terminology**
  Both parties agree the dispute is partially verbal regarding the word 'experience'. The Malcolmian treats it as requiring concurrent phenomenology; the Dennettian treats it as a narrative construct. [Facilitator Note: The Dennettian position appears to concede the verificationist point while retaining the vocabulary, suggesting the Malcolmian has the better of the philosophical argument, whilst the Dennettian retains the scientific utility.] Once clarified, the substantive disagreement rests on whether the retrospective narrative warrants the *concept* of dreaming at all.
