  1. **First pass — brainstorm 3 possible readings**
  *   **The Humanist Rebuttal:** The film argues that love and protection trump abstract moral rules. Augustine's absolutism is morally bankrupt in the face of genocide.
  *   **The Technical Defense:** Guido isn't lying in Augustine's sense; he's creating fiction. Augustine exempts jokes and stories where no one is meant to believe the falsehood as fact.
  *   **The Tragic Cost:** The film validates the lie but mourns it. Guido dies. The "victory" is purely psychological for the boy, suggesting the lie saved the mind but couldn't save the body, leaving the moral cost unpaid.

  2. **The case that the film refutes Augustine**
  Let's be blunt: if you take Augustine at his word, Guido is a sinner. In *On Lying*, Augustine argues you cannot tell a falsehood even to save a fugitive from murderers. He prioritizes the health of your own soul and the sanctity of truth over physical consequences. He famously insists that lying to protect an innocent person from pursuers is still a sin, because it disorders the soul away from God, who is Truth. But look at the screen. Guido's lies are the only thing keeping Giosuè from psychically shattering. The film frames this not as a moral failure, but as the ultimate act of love. The ending seals the deal: adult Giosuè says, "This is my story. This is the gift my father gave me." If Guido had told the truth, the boy likely dies of terror or gives himself away. The film asks us: is a truth that destroys an innocent child better than a lie that saves him? Augustine says yes. Benigni says absolutely not. The movie functions as a consequentialist slam-dunk; the outcome (a surviving, sane human being) justifies the means (deception). It suggests that ethical systems built without room for radical mercy are useless in a broken world.

  3. **The case that it's more Augustinian than it looks**
  But hold on. Augustine isn't stupid. He distinguishes between a lie and a joke or a story. In a game, everyone consents to the fiction. Guido isn't trying to convince Giosuè that the camp *is* a game in reality; he's inviting him into a play-space where the rules are suspended. If Giosuè knows, deep down, it's a performance, is it a lie? Furthermore, Augustine worries that lying corrupts the liar's relationship with God and reality. Watch Guido. He doesn't lie for convenience; he absorbs the horror so his son doesn't have to. He marches to his death making funny faces. There's a sacrificial weight here that feels religious. Maybe the film acknowledges that while the lie was necessary, it came at the cost of Guido's life. He couldn't maintain the fiction and survive. The framing as a memory also adds doubt. Is adult Giosuè telling us the truth, or is he still playing the game? If the lie is all we have, maybe Augustine was right to warn us about departing from truth, even when we must. The film doesn't celebrate the lie lightly; it baptizes it in blood.

  4. **Where the reading breaks down**
  Here's the uncomfortable bit: applying 4th-century metaphysics to the Holocaust feels uneven. Augustine wasn't thinking about industrialized genocide. His framework assumes a rational moral order; the camps were designed to destroy rationality. Also, the film is a fable, not a documentary. Guido's lies work because the script says they work. In reality, lying to a child in a camp might get them killed faster. So, are we testing Augustine against ethics, or against a fairy tale? I also can't promise Augustine would buy the "it's a game" defense. If the intent is to make the boy believe false facts about safety to prevent panic, that smells like a lie, regardless of the "game" label. We might be forcing a clean philosophical grid onto a messy, stylized emotional experience.

  5. **Class discussion**
  1. If Guido told the truth, would Giosuè have survived? Is the lie physically necessary or just psychologically kinder?
  2. Augustine says lying damages the liar's soul. Does Guido seem damaged, or is he spiritually intact despite the deception?
  3. Adult Giosuè calls the survival a "gift." Can a gift be built on a falsehood, or does the outcome sanctify the deception?
