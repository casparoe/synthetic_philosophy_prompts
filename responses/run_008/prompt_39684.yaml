answer: |-
  1. **The Tie-Breaker Case**
     One person will die. Alternatively, five different people will each die. You can save only one group. Do you save the five?
     *   **No (Flip a coin):** → **Taurek-Style Non-Aggregation**
     *   **Yes:** → Go to Question 2

  2. **The Extreme Aggregation Case**
     One person will die. Alternatively, 1,000,000 different people will each suffer a mild headache for one hour. You can prevent only one outcome. Do you prevent the headaches?
     *   **Yes:** → Go to Question 3
     *   **No:** → Go to Question 4

  3. **The Priority Check (Aggregationists)**
     One very poor person will lose a leg. Alternatively, two very wealthy people will each lose a leg. You can save only one group. Do you save the poor person?
     *   **Yes:** → **Prioritarian Aggregation** (Accepts aggregation but weights claims by prior welfare)
     *   **No (Save the two/Indifferent):** → **Thoroughgoing Aggregation (Utilitarian)**

  4. **The Priority Check (Non-Aggregationists)**
     One very poor person will lose a leg. Alternatively, two very wealthy people will each lose a leg. You can save only one group. Do you save the poor person?
     *   **Yes:** → **Prioritarian Aggregation** (Rejects extreme aggregation but weights claims by prior welfare)
     *   **No (Save the two):** → Go to Question 5

  5. **The Moderate Aggregation Case**
     One person will die. Alternatively, 1,000,000 different people will each suffer a broken arm. You can prevent only one outcome. Do you prevent the broken arms?
     *   **Yes:** → Go to Question 6
     *   **No:** → Go to Question 7

  6. **The Transitivity Chain Case**
     Imagine a ladder of harms: Death, Paralysis, Broken Arm, Broken Finger, Headache. You agree that for any *adjacent* rung (e.g., Broken Arm vs. Broken Finger), a large number of the lesser harm outweighs one of the greater harm. Given this, do you agree that a large number of Headaches outweighs one Death?
     *   **No:** → **Intransitive Value Skepticism** (Resists aggregation due to doubts about the structure of value/betterness)
     *   **Yes:** → **Threshold/Scanlonian View** (Allows aggregation only when claims are relevantly comparable or past a threshold)

  7. **The Separateness Case**
     One person will die. Alternatively, one single person will suffer 1,000,000 headaches. (Note: All headaches fall on one individual). Do you prevent the headaches?
     *   **Yes:** → **Scanlonian Individualist View** (Resists aggregation across persons due to separateness, but allows summing within a life)
     *   **No:** → **Strict Non-Aggregation** (Resists aggregation regardless of distribution; claims never sum to outweigh a stronger claim)

  ***

  ### Commentary on Logical Space and Leaves

  **Unoccupied Combinations**
  *   **Taurek + Tie-Breaking:** There is no leaf for a student who flips a coin in Q1 (1 vs. 5 Deaths) but aggregates in Q2 (Headaches vs. Death). This combination is **incoherent**; if numbers never matter for equal claims (Q1), they cannot matter for unequal claims (Q2) without a principled distinction that Taurek explicitly rejects.
  *   **Prioritarian + Thoroughgoing Aggregation:** Question 3 separates these. A student who saves the 1,000,000 headache-sufferers (Q2) but saves the 1 poor leg-loser over 2 rich leg-losers (Q3) lands in Prioritarianism. A student who does neither is Utilitarian. The combination of "Accepts Extreme Aggregation" but "Denies Priority Weighting" is the standard Utilitarian leaf; the reverse is the Prioritarian leaf. There is no leaf for "Rejects Extreme Aggregation" but "Accepts Priority Weighting" *and* "Denies Numbers for Equal Claims," as this collapses into Taurek or Strict Non-Aggregation.

  **Inseparable Leaves**
  *   **Threshold vs. Scanlonian View (Q6 Yes):** I flag these as **difficult to pull apart** in practice. Both views occupy the same leaf because they yield identical verdicts on most concrete cases: they allow aggregation for "close" claims (Arms vs. Death) but deny it for "distant" claims (Headaches vs. Death). Scanlon grounds this in the *Relevance Constraint* (claims must be comparable to aggregate); Threshold views ground it in a *Lexical Cutoff* (numbers count only after $N$). No simple case cleanly separates them without asking the student for their *reasoning* (which violates the constraint against theoretical questions). Some philosophers argue Scanlon's view *is* a threshold view in disguise; others argue the "relevance" criterion is distinct from a numeric threshold. For the purpose of this tree, they share a leaf.
  *   **Scanlonian View (Q7 Yes) vs. Threshold/Scanlonian (Q6 Yes):** These are also **functionally similar** but separated here by the severity of the weaker claim. Q6 captures those who allow aggregation for serious harms (Arms); Q7 captures those who deny aggregation for serious harms but admit it within a single life. A consistent Scanlonian might appear in either leaf depending on whether they deem Arms "relevantly comparable" to Death. I have separated them to isolate the *Separateness of Persons* intuition (Q7) from the *Relevance/Threshold* intuition (Q6), but students should know these positions are neighboring variants of contractualism.

  **Advice on Reading the Path**
  *   **The Grounds for Skepticism:** The tree isolates the two routes to skepticism as requested. If a student lands in **Intransitive Value Skepticism** (Q6 No), their resistance is grounded in the **Structure of Value** (denying transitivity of betterness). If they land in **Scanlonian Individualist View** (Q7 Yes), their resistance is grounded in the **Separateness of Persons** (allowing intrapsychic summation but blocking interpsychic summation). If they land in **Strict Non-Aggregation** (Q7 No), they may hold either view, or a combination of both.
  *   **The Tie-Breaker:** Q1 ensures that **Taurek-Style Non-Aggregation** is distinct from **Strict Non-Aggregation** (Q7 No). A student can believe numbers break ties among equal claims (Q1 Yes) but never aggregate unequal claims (Q7 No). This is a coherent, moderately non-aggregating position distinct from Taurek's radical refusal to count numbers at all.
  *   **Prioritarianism:** Note that Prioritarianism appears in two leaves (Q3 Yes and Q4 Yes). This reflects that Prioritarianism is a theory about *weighting*, not strictly about *aggregation limits*. A Prioritarian might accept extreme aggregation if the worse-off are the headache sufferers (rare), or reject it if the worse-off is the person facing death (common). The tree captures this by checking priority weighting in both the Aggregating and Non-Aggregating branches.
