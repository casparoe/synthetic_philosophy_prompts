answer: |-
  It is a pleasure to address a colleague who understands that the stakes of metaphysics are often highest where they intersect with the special sciences. Your clinical intuition is sound: medicine treats absences as potent causal agents. Philosophy, particularly analytic metaphysics, treats them as ontological embarrassments. The gap between the ward and the seminar room is precisely where the problem of causation by omission (CbO) resides.

  Below are the desiderata for a theory of CbO. I have structured them to separate the constraints required for logical coherence from those required for scientific utility. Following this, I address the joint unsatisfiability of these constraints and provide a brief assessment of the leading theoretical frameworks.

  ### Desiderata for a Theory of Causation by Omission

  **1. The Selectivity Constraint (The 'Too Many Causes' Problem)**
  *   **Motivation:** If the gardener's failure to water the flowers causes their death, then logically, my failure to water them, the Queen's failure to water them, and the failure of every person on Earth to water them are also causes. Similarly, the absence of a specific hormone causes a pathology, but the absence of every other hormone (which the body does not produce) does not. A theory must distinguish *relevant* omissions from the infinite background of non-events.
  *   **Status:** **Non-negotiable.** Any theory that cannot filter the infinite set of possible preventers yields a trivialised concept of causation. If everything that did not happen is a cause of what did, causation loses its explanatory power.

  **2. The Normative Independence Constraint**
  *   **Motivation:** In law and ethics, we often tie omission to duty (the lifeguard *ought* to save the swimmer). However, causal structure should not depend entirely on moral or legal obligation. If the lifeguard is off-duty and has no legal obligation, but is the only person present and physically capable of throwing a ring, his inaction is still causally relevant to the death, even if he is not morally culpable. Conversely, a mother who fails to feed her child causes the death regardless of whether a court has yet assigned negligence.
  *   **Status:** **Non-negotiable.** While courts conflate causation and responsibility for pragmatic reasons, a metaphysical theory must distinguish the *causal relation* from the *normative status* of the agent. Reducing causation to duty makes causal facts dependent on social conventions.

  **3. The Scientific Validation Constraint**
  *   **Motivation:** As you noted, endocrinology asserts that insulin deficiency causes ketoacidosis. Immunology asserts that a lack of T-cells permits opportunistic infection. A theory of causation should not declare the best practices of mature sciences to be systematically false or merely metaphorical. It must accommodate the causal efficacy of deficiencies, withdrawals, and failures to inhibit.
  *   **Status:** **Contested (Prejudice of Naturalism).** This is non-negotiable for a philosopher wishing to preserve scientific discourse, but it is explicitly rejected by 'Causal Nihilists' regarding omissions. They argue science speaks loosely and that strict metaphysics should correct it.

  **4. The Ontological Parsimony Constraint**
  *   **Motivation:** Standard physics describes the world in terms of positive entities and processes (mass, energy, fields). It does not recognise "negative mass" or "absence forces" as concrete particulars. A theory should not require us to populate the universe with "negative facts" or "absences" as ghostly entities that exert causal power. The cause should be grounded in what *exists*, not what *does not*.
  *   **Status:** **Contested (Prejudice of Physicalism).** Some philosophers (e.g., proponents of negative facts) accept that absences are real ontological constituents. However, most contemporary metaphysicians view this as a last resort due to its inflationary cost.

  **5. The Spatiotemporal Location Constraint**
  *   **Motivation:** Standard causes occur at a specific time and place (the bullet struck the heart at *t*). Omissions seem ubiquitous and timeless (when exactly did the gardener's 'not-watering' occur? Was it every second of the drought?). A theory must explain how an omission can be a discrete event capable of entering into causal relations without being omnipresent.
  *   **Status:** **Non-negotiable.** Without spatiotemporal localisation, we cannot distinguish the cause of *this* death from the cause of *that* death, nor can we establish causal chains.

  **6. The Distinction Constraint (Causation vs. Explanation)**
  *   **Motivation:** We must distinguish between "The lack of insulin caused the coma" (causal claim) and "The lack of insulin explains why the coma occurred" (explanatory claim). Sometimes, an absence provides the best explanation without being the physical pusher/puller. A theory must specify whether omissions are genuine causes or merely explanatory placeholders for complex positive processes.
  *   **Status:** **Contested.** This is the primary fault line between Nihilists (who say omissions only explain) and Realists (who say omissions cause).

  ---

  ### Joint Unsatisfiability: The Hard Truth

  I must be plain, as you requested: **A subset of these desiderata is jointly unsatisfiable under standard physicalist assumptions.**

  If you hold the **Ontological Parsimony Constraint** (causes must be positive physical processes/energy transfer) and the **Spatiotemporal Location Constraint** (causes must be localised events) as non-negotiable, you *cannot* satisfy the **Scientific Validation Constraint** (medicine is right that omissions cause things).

  Why? Because in a closed physical system, "nothing" does not transfer energy. "Nothing" does not occupy a specific coordinate. If causation is fundamentally physical production (as suggested by Salmon or Dowe), then omissions *cannot* be causes. They are merely the background conditions against which positive causes operate.

  To maintain that omissions *are* genuine causes (satisfying Scientific Validation), one must either:
  1.  **Relax Ontological Parsimony:** Admit negative facts into your ontology (costly).
  2.  **Relax Physicalism:** Adopt a counterfactual or interventionist account where causation is about dependence, not production (changes the definition of causation).
  3.  **Accept Nihilism:** Admit that medicine speaks loosely, and strictly speaking, omissions do not cause, they only explain (sacrifices Scientific Validation).

  There is no free lunch here. You must choose between a metaphysics that fits fundamental physics and a metaphysics that fits clinical practice. They pull in opposite directions.

  ---

  ### Assessment of Contenders

  Here is how the main theoretical camps fare against the desiderata above.

  **1. The Counterfactual Approach (Lewis and successors)**
  *   **Mechanism:** $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. For omissions: Had the gardener watered (positive act), the flowers would not have died.
  *   **Performance:**
      *   *Scientific Validation:* **Pass.** Handles medical cases effortlessly.
      *   *Selectivity:* **Fail.** This is the notorious weakness. Counterfactually, had the Queen watered the plants, they would not have died. Thus, the Queen's omission is a cause. Lewis accepted this proliferation, arguing context selects the relevant cause, but many find this unsatisfactory.
      *   *Ontological Parsimony:* **Pass.** Relies on relations between events/worlds, not negative entities.
      *   *Verdict:* Excellent for science, poor at filtering the 'Too Many Causes' problem without appealing to pragmatic context.

  **2. Causal Nihilism / The Explanation-Only View (e.g., Armstrong, Dowe)**
  *   **Mechanism:** Strict causation requires physical connection (transfer of conserved quantities). Omissions lack this. Therefore, omissions do not cause; they are "quasi-causes" that feature in explanations but not in the causal fabric of the world.
  *   **Performance:**
      *   *Scientific Validation:* **Fail.** Explicitly tells the endocrinologist that "insulin deficiency caused DKA" is loose talk. The real cause was the metabolic processes that occurred *in the absence* of insulin.
      *   *Selectivity:* **Pass.** Since nothing causes anything via omission, there is no proliferation of causes.
      *   *Ontological Parsimony:* **Pass.** Perfectly aligned with physics.
      *   *Verdict:* Metaphysically clean, but practically useless for medicine and law. It solves the muddle by denying the phenomenon exists.

  **3. The Process/Connection Account (Salmon/Dowe)**
  *   **Mechanism:** Causation is the intersection of world-lines involving conserved quantities. Omissions are gaps in processes.
  *   **Performance:**
      *   *Scientific Validation:* **Fail.** Similar to Nihilism. A missing hormone is not a process intersection.
      *   *Selectivity:* **Pass.** Only actual interactions count.
      *   *Normative Independence:* **Pass.** Purely physical.
      *   *Verdict:* Rigorous for fundamental physics, but requires a dualistic ontology where 'causation' means one thing in physics and another in biology.

  **4. The Interventionist Account (Woodward)**
  *   **Mechanism:** $X$ causes $Y$ if an intervention on $X$ changes $Y$. Omissions are treated as variables taking a value of '0' or 'absent'.
  *   **Performance:**
      *   *Scientific Validation:* **Pass.** Perfectly models clinical trials (placebo vs. treatment, presence vs. absence).
      *   *Selectivity:* **Pass (Conditional).** Selectivity is handled by the choice of variables in the model. We only include the gardener in the model, not the Queen, because the gardener is the relevant variable for the system.
      *   *Ontological Parsimony:* **Neutral.** It is agnostic about what exists; it cares about dependency relations.
      *   *Normative Independence:* **Risk.** There is a danger that the choice of variables becomes driven by normative expectations (who *should* we intervene on?).
      *   *Verdict:* Currently the strongest contender for the special sciences. It accepts that causation is relative to a model, which dissolves the 'Too Many Causes' problem by restricting the domain of inquiry, though some metaphysicians argue this makes causation mind-dependent.

  ### Summary for the Clinician-Philosopher

  You are encountering a clash of levels. Medicine operates at a **functional level**, where systems are defined by their homeostatic set-points. In a homeostatic system, a deviation from the set-point (an absence) is functionally equivalent to a positive force disrupting equilibrium. Hence, "lack of insulin" is a valid causal descriptor.

  Metaphysics often operates at a **fundamental level**, where only positive existents interact.

  If you wish to retain the robust causal language of medicine without metaphysical guilt, the **Interventionist** framework is your most viable path. It allows you to say "the absence caused the effect" because, within the model of the human endocrine system, manipulating that variable (restoring insulin) changes the outcome. It treats the Selectivity Constraint not as a feature of the universe, but as a feature of how we carve the universe into variables for investigation.

  However, if you demand a theory that satisfies the Ontological Parsimony Constraint strictly (no negative facts), you must concede to the Nihilists that causation by omission is a *façon de parler*—a useful fiction for navigating a world of positive processes. The choice lies in whether you prioritise the utility of scientific discourse or the strictures of fundamental ontology.
