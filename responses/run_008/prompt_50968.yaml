answer: |-
  The two purposes you fixed yield lists no single theory can serve, and seeking a unified list smuggles in the prejudice that moral truth and action-guidance must coincide.

  **Requirements List**

  *   **Case: Unjust combatants who fight strictly by the rules.**
      *   *Consideration:* Must explain why they are permissible targets yet often not punished as murderers.
      *   *Status:* Prejudice of Traditionalism (Revisionists deny this symmetry).
  *   **Case: Conscripts with no meaningful choice.**
      *   *Consideration:* Must account for duress and epistemic limitation regarding *jus ad bellum*.
      *   *Status:* Non-negotiable (Legal and moral reality of coercion).
  *   **Case: Civilians who voted for the war and now assemble its munitions.**
      *   *Consideration:* Must explain immunity despite causal contribution to unjust threats.
      *   *Status:* Prejudice of Traditionalism/LOAC (Revisionists argue contribution can induce liability).
  *   **Case: The just soldier ordered to do something noxious that would shorten the war.**
      *   *Consideration:* Must resolve conflict between *jus in bello* constraints and consequentialist pressure.
      *   *Status:* Non-negotiable (Manifest illegality must remain binding).
  *   **Distinction: Combatant/civilian vs. liable/not liable.**
      *   *Consideration:* Must decide whether status or conduct determines targetability.
      *   *Status:* Prejudice of Traditionalism (Revisionists collapse status into liability).
  *   **Distinction: Doing vs. allowing.**
      *   *Consideration:* Must determine if killing an aggressor differs morally from letting a victim die.
      *   *Status:* Prejudice of Revisionism (Traditionalists often treat war as sui generis).
  *   **Distinction: Individual vs. collective responsibility for a state's war.**
      *   *Consideration:* Must assign guilt for the war itself versus guilt for conduct within it.
      *   *Status:* Prejudice of Traditionalism (Revisionists insist on individual moral responsibility).
  *   **Constraint: Consistency with domestic self-defense.**
      *   *Consideration:* Rights in war should not contradict rights in peace (Continuity Thesis).
      *   *Status:* Prejudice of Revisionism (Traditionalists argue war creates a unique moral sphere).
  *   **Constraint: No verdict that makes every war unjust by fiat.**
      *   *Consideration:* The possibility condition; moral theory cannot render justified war logically impossible.
      *   *Status:* Non-negotiable (Logical constraint).
  *   **Constraint: Some answer to why the conscript who fights and the taxpayer who funds are treated differently.**
      *   *Consideration:* Must justify the combatant privilege and civilian immunity distinction.
      *   *Status:* Non-negotiable (LOAC fact), *Explanation* is Prejudice.

  **Joint Unsatisfiability**

  The subset comprising **Liability-Based Individualism**, **Robust Civilian Immunity**, and the **Datum that Ordinary Unjust Soldiers Are Not Murderers** is jointly unsatisfiable. If liability tracks individual moral responsibility for unjust threats (Individualism), then unjust soldiers are liable to be killed but also culpable for killing just soldiers (violating the Datum), and civilians contributing to unjust threats are liable (violating Immunity). To preserve Civilian Immunity and the Non-Murderer Datum, you must reject Individualism in favor of a convention-based or status-based model (Traditionalism). To preserve Individualism, you must accept that unjust soldiers are murderers and contributing civilians are targets (Revisionism). You cannot hold all three.

  **Theory Scorecard**

  Walzer's Traditionalism preserves Civilian Immunity and the Non-Murderer Datum by severing *jus ad bellum* from *jus in bello*, but it fails the Blame Purpose by exculpating morally guilty killers and violates the Continuity Constraint. McMahan's Revisionism satisfies the Continuity Constraint and Liability Individualism, grounding blame accurately, but it fails the Conscript Purpose by demanding epistemic access to *ad bellum* justice that soldiers lack and collapses Civilian Immunity. Conventionalism defends the War Convention as a separate moral sphere, satisfying the Conscript Purpose and LOAC constraints, but it fails the Blame Purpose by admitting that convention cannot erase deep moral guilt, leaving the unjust soldier legally protected but morally condemned.
