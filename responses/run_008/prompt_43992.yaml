      *   *Move 2 (Marcus):* Caricature claim. Descartes denies *reason/language* (Discourse), not necessarily *sensation*. Cites letters (Newcastle, More). *Passions* physiology is similar.
          *   *Assessment:* Textually grounded. Descartes *does* emphasize language/reason as the mark of the mind. He *does* admit animals have complex behaviors. The physiology point is strong (nerves, animal spirits work the same).
      *   *Move 3 (Rachel):* Metaphysical objection. Sensation = mode of thinking substance (*res cogitans*). Body = extended substance (*res extensa*). Mechanical motion $\neq$ feeling. Wax cylinder analogy.
          *   *Assessment:* This is the strongest philosophical point. For Descartes, *sentire* (to feel/perceive) is a mode of thought. If animals have no mind, they can't have modes of mind.
      *   *Move 4 (Marcus):* Inconsistency vs. Narrow Definition. Maybe "thought" = reflective thought. Sensation can exist without higher thought. Discourse distinguishes thinking vs. feeling tests.
          *   *Assessment:* Plausible hermeneutic strategy. Descartes sometimes uses *pensée* broadly (including doubt, will, imagination, sensation) and sometimes narrowly. But does he explicitly grant animals *sensation* without *thought*?
      *   *Move 5 (Rachel):* Anachronism warning. "Consciousness" is modern. Followers (Malebranche) interpreted him as hardline.
