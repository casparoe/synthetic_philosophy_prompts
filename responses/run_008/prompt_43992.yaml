          *   *Wait, let's look closer:* In the *Treatise on Man*, Descartes describes pain mechanisms in a corpse/statue. He calls it "pain" metaphorically. In the *Passions*, he distinguishes the bodily passion from the mental perception.
          *   *Revised Decision:* I will bet on **Hardline No-Feeling** regarding *conscious* feeling, but acknowledge Marcus is right about *bodily* processes. But the question is "do they feel anything?" Usually, that implies conscious experience. So Hardline wins on metaphysics.
          *   *Wait, is "Inconsistent" a better bet?* Descartes was writing to different audiences (Catholics vs. Scientists). He might have been esoteric. But usually, we interpret philosophers as aiming for consistency.
