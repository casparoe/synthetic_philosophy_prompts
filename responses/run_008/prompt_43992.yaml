      *   *What they miss:* The theological stakes (animal souls vs. human immortality) and the specific Scholastic definition of *sensation* (which requires a sensory soul, which Descartes abolishes). Also, the distinction between *sentire* (to sense) and *conscire* (to be aware with).

  6.  **Refining the Output:**
      *   Make sure to address the "wax cylinder" analogy.
