answer: |-
  This is a classic formulation of the **Causal Impotence Objection** (sometimes called the "Inefficacy Argument"). It is philosophically seductive because it relies on intuitions about causation that feel solid in everyday life but fracture under the weight of collective action problems. Your friend's argument is valid (the conclusion follows from the premises), but it is not sound.

  To escape the vertigo without abandoning the idea that morality tracks your impact on the world, you should **reject the Coda** as a non-sequitur and **refine Premise (2)** using expected utility. You do not need to abandon Premise (1), but you must sharpen its definition of "making a difference."

  Here is the breakdown of where the argument fails, why it looked innocent, and the costs of fixing it.

  ### 1. The Coda: The Fallacy of Composition
  Your friend's coda ("the resulting collective harms... are nobody's doing") is the most dangerous step. It does not follow from the previous premises; it smuggles in a hidden assumption about the nature of causation.

  *   **Why it looked innocent:** It relies on the intuition that if $X$ is not the *sole sufficient cause* of $Y$, then $X$ is not *a cause* of $Y$. If no single drop of rain flooded the valley, the flood was caused by "nature," not the drops.
  *   **Why it is false:** This is a **fallacy of composition**. It assumes that properties of the parts (non-decisiveness) must apply to the whole (the collective harm). But collective harms are not caused by a "decisive individual"; they are caused by **joint causation**.
  *   **The Correction:** A harm can be "nobody's *sole* doing" without being "nobody's doing." If a hundred people push a car off a cliff, and it takes ninety-nine pushes to tip it, the hundredth pusher is the "trigger," but the first ninety-nine are **causal contributors**. Without them, the trigger puller does nothing.
  *   **Does it follow?** No. The coda conflates *singular responsibility* with *complicity in a causal chain*. If you accept that morality tracks impact (Premise 1), you must accept that contributing a necessary fraction to a sufficient set is a form of impact. To deny this is to claim that a war crime committed by a firing squad is morally neutral because no single bullet was lethal.

  ### 2. Premise (2): The Empirical Trap
  Your friend claims a single purchase "makes no difference." This is the empirical heart of the argument. It looks innocent because supply chains *are* lumpy. However, it treats causation as binary (either I definitely caused it or I definitely didn't) rather than probabilistic.

  *   **Why it looked innocent:** Producers do not slaughter one chicken per purchase. They slaughter in batches. Therefore, my specific purchase rarely aligns perfectly with the threshold that triggers a batch.
  *   **Why it is false:** It ignores **Expected Value**. Even if your purchase only triggers a batch 1% of the time, when it *does* trigger a batch, it triggers 10,000 chickens.
      *   *Calculation:* $0.01 \text{ (probability)} \times 10,000 \text{ (harm)} = 100 \text{ expected chickens}$.
      *   Over a lifetime of consumption, the law of large numbers suggests you *will* hit those thresholds. To say you make "no difference" is to ignore the mathematical expectation of harm.
  *   **The Cost of Rejecting (2):** You must accept that **risk imposition** is morally significant. You are not blamed for the *actual* outcome (which might have happened anyway), but for buying a lottery ticket where the prize is animal suffering. This shifts morality slightly from "outcome-based" to "risk-based."

  ### 3. Premise (1): Refining "Making a Difference"
  You want to keep (1): *An act is wrong only if it makes a difference to whether harm occurs.* You can keep this, but you must reject your friend's implicit definition of "difference."

  *   **The Trap:** Your friend defines "making a difference" as **counterfactual certainty** ("If I hadn't done it, the harm would *definitely* not have occurred").
  *   **The Fix:** Define "making a difference" as **changing the odds** ("If I hadn't done it, the probability of the harm would be lower").
  *   **Why this matters:** If you drive drunk and make it home safely, you made no *certain* difference to safety, but you imposed a risk. We intuitively judge the drunk driver as wrong. Why? Because they altered the probability landscape.
  *   **The Cost:** You must accept that morality governs your **expected impact**, not just your **actual impact**. This means you can be blameworthy for an act that, in the actual world, turned out harmless, provided it carried a risk of harm. This is a standard consequentialist move, but it requires you to be comfortable with probabilistic moral accounting.

  ### 4. The Small-Probability Cases (The Tie-Breaking Vote)
  You asked specifically about the vote that creates a tie or the donation that completes a threshold. Your friend uses these as outliers to dismiss the rule. You should use them to confirm the rule.

  *   **The Friend's View:** These cases are so rare they are negligible. Therefore, in the 99.99% of cases where you don't tip the scale, you are innocent.
  *   **The Rebuttal:** The Expected Utility model handles this seamlessly.
      *   In the 99.99% of cases where you don't tip the scale, your *actual* impact is zero.
      *   In the 0.01% of cases where you do tip the scale, your *actual* impact is massive.
      *   **Morality tracks the expectation, not the realization.**
  *   **What you must say:** You must say that the voter in the landslide election is doing the *same moral thing* as the voter in the tie election, because the *ex-ante probability* was the same. We cannot judge the morality of the act based on hindsight (whether the vote happened to be decisive). We must judge it based on the information available at the time of acting.
  *   **The Vertigo Cure:** This removes the luck from morality. If morality depended on whether you happened to be the threshold-tipper, morality would be a lottery. By focusing on *expected* difference, you ensure that two people making the same choice in the same context are judged equally, regardless of how the causal chips fall.

  ### Summary of the Escape Plan

  1.  **Reject the Coda:** It is a logical fallacy. Collective harm is the sum of individual contributions, even if no individual contribution was sufficient. "Nobody's doing" is false; "Everybody's partial doing" is true.
  2.  **Refine Premise (1):** "Making a difference" means **raising the expected value of harm**, not guaranteeing it.
  3.  **Refute Premise (2):** It is empirically false because it ignores the magnitude of the harm when thresholds *are* met. A small probability of a massive harm is still a significant expected harm.
  4.  **Accept the Cost:** You must accept **risk-based morality**. You are responsible for the risks you impose on the world, not just the outcomes that materialize.

  **The Final Word to Your Friend:**
  Tell him his argument proves too much. If no individual is responsible for collective harm because no individual is decisive, then no individual is responsible for *any* complex outcome, including economic markets, language, or traffic patterns. But more importantly, his logic absolves the drunk driver who gets home safely and the Russian Roulette player whose chamber was empty. If he accepts those are wrong, he admits that **imposing risk** is enough for moral blame. Once he admits that, the chicken, the carbon, and the vote fall right back into the sphere of moral concern.
