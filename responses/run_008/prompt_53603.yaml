      FNL: If the Bureaucratic Atrocity generates *fidelity* from officials solely due to form, FNL must admit procedural morality is independent of substantive good. (Fuller actually accepts this, so I need to sharpen the FNL position to make it a disagreement).
      *Sharpening FNL:* The FNL contends that a system utterly failing the desiderata *cannot* be a legal system, even if stable. The ILP contends it *can*.
