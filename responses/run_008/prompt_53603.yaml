answer: |-
  # JOINT STATEMENT ON THE HART–FULLER DEBATE
  **Submitted by the Members of the Philosophy of Law Reading Group**

  ### I. Agreed Claims

  After one year of adversarial collaboration, we affirm the following propositions as common ground. These statements are intended to frame our remaining disagreements without prejudging their resolution.

  1.  **On the Function of Jurisprudence:** We agree that the question "What is law?" is not merely a semantic exercise. The classification of a norm as "law" carries normative consequences for how officials, judges, and citizens deliberate about obedience, resistance, and punishment.
  2.  **On the Nazi Regime:** We agree that the Nazi legal system was morally monstrous. We further agree that it systematically violated many principles of legality, particularly regarding congruence between announced rule and official action, and generality. We agree that post-war courts faced a genuine dilemma: punishing the "grudge informer" via retrospective statute involved a moral cost, yet failing to punish involved a different moral cost.
  3.  **On the Separation of Validity and Obligation:** We agree that establishing a norm's legal validity does not automatically settle the moral obligation to obey it. A norm can be legally valid yet morally iniquitous, and a norm can be morally obligatory yet legally invalid. Neither of us argues that wickedness automatically voids legal status, nor that legality guarantees moral legitimacy.
  4.  **On the Role of Officials:** We agree that the behavior and attitudes of officials (judges, police, legislators) are central to the existence of a legal system. A system without official administration is not a legal system. We disagree, however, on whether official acceptance is *sufficient* for legality, or whether official practice must also satisfy independent standards of form to count as law.
  5.  **On the Inner Morality:** We agree that Fuller's eight desiderata (generality, publicity, prospectivity, clarity, non-contradiction, possibility of compliance, stability, congruence) describe valuable features of governance. We agree that a system satisfying these desiderata is generally preferable to one that does not. We disagree on whether satisfaction of these desiderata is *constitutive* of law or merely *instrumental* to its efficiency.

  ### II. Table of Residual Disagreements

  The following table isolates our remaining divergences. Each row describes the same point of contention, formulated once in terms consistent with the Inclusive Legal Positivist (ILP) framework, and once in terms consistent with the Fullerian Natural Law (FNL) framework.

  | Topic | Formulation A (Inclusive Legal Positivist) | Formulation B (Fullerian Natural Lawyer) |
  | :--- | :--- | :--- |
  | **The Criterion of Legality** | Whether a norm is law depends on whether it satisfies the criteria set out in the system's Rule of Recognition. These criteria are matters of social fact (official practice), though they *may* optionally include moral or procedural constraints. | Whether a norm is law depends on whether it succeeds in subjecting human conduct to the governance of rules. This success is measured by the degree to which the system achieves the eight desiderata of the inner morality of law. |
  | **The Status of Failed Systems** | A regime that fails Fuller's desiderata may still be a legal system if its officials consistently enforce its norms according to a shared social standard. The failure is one of moral quality or efficacy, not legal existence. | A regime that persistently fails Fuller's desiderata fails to create law. It may exercise power through threats or commands, but it lacks the specific authority that arises from the reciprocity of the rule-governed enterprise. |
  | **The Nature of Validity** | Legal validity is binary. A norm is either valid (recognized by the system) or it is not. While the *merits* of law admit of degrees, the *status* of law does not. | Legality admits of degrees. A system can be "more" or "less" legal depending on its fidelity to the inner morality. In the limit, total failure of the inner morality results in no law at all. |
  | **The Source of Obligation** | Legal obligation is a content-independent reason for action derived from the norm's source. If the Rule of Recognition validates a norm, it generates a legal obligation, regardless of its procedural pedigree. | Legal obligation arises from the reciprocity between lawgiver and subject. If the lawgiver fails to uphold their end of the bargain (the inner morality), the subject's obligation of fidelity is diminished or extinguished. |

  ### III. The Cruxes

  We identify three specific sub-questions that, if settled, would necessitate a revision of one or both of our positions.

  **Crux 1: Binary vs. Gradable Concepts**
  *   **The Question:** Is "law" a threshold concept (one either crosses it or does not) or a scalar concept (one can have more or less of it)?
  *   **Implication:** If the ILP accepts that legality is scalar, she must abandon the binary validity model central to positivism. If the FNL accepts that legality is binary, he must concede that a system can be fully "law" while totally failing the inner morality, reducing his claim to one of mere moral preference.
  *   **Verbal vs. Substantive:** This is not merely verbal. If we replace "law" with "valid normative system," the ILP still claims the status is binary based on social facts, while the FNL claims the status is scalar based on functional success. The disagreement survives terminological shifts.

  **Crux 2: The Function of the Concept**
  *   **The Question:** Is the concept of law primarily *descriptive* (identifying a specific type of social institution) or *evaluative* (identifying a specific type of moral achievement)?
  *   **Implication:** The ILP treats the concept as a tool for social identification. The FNL treats it as a tool for functional evaluation. If the ILP concedes that the concept *must* carry an evaluative load to do its work in legal reasoning, her positivism weakens. If the FNL concedes that the concept must be descriptive to explain why wicked systems are treated as law by their participants, his natural law weakens.

  **Crux 3: The Necessity of Procedural Morality**
  *   **The Question:** Is it empirically possible for a stable, complex system of governance to persist while systematically violating the inner morality (e.g., secret, retroactive rules), provided the officials act consistently?
  *   **Implication:** The FNL argues such a system is impossible or self-defeating. The ILP argues it is contingently possible. If the ILP concedes that such a system inevitably collapses into mere violence (ceasing to be a "system"), she moves toward Fuller. If the FNL concedes that such a system can persist and function as law, he must admit the inner morality is not constitutive of law's existence.

  ### IV. Concrete Test Cases and Falsification Conditions

  To move beyond abstraction, we propose two novel thought experiments. We record our respective predictions and, crucially, what evidence would count against our own views.

  #### Case A: The Efficient Atrocity
  **Description:** A regime enacts a program of ethnic cleansing. However, it does so via statutes that are perfectly general, public, prospective, clear, non-contradictory, possible to comply with, stable, and congruently enforced. Officials never deviate from the written rules; citizens know exactly what conduct triggers punishment. The machinery of the inner morality is used with perfect precision to facilitate genocide.

  *   **ILP Prediction:** This is a fully valid legal system. The social facts of official acceptance and systematic enforcement are present. The moral monstrosity does not negate the legal status.
  *   **FNL Prediction:** This constitutes law (in the formal sense), but it reveals the limits of the inner morality. However, we predict that over time, the substantive wickedness will erode the congruence and stability (e.g., officials will begin making secret exceptions for friends), causing the system to degrade legally.
  *   **Falsification Conditions (Exposure):**
      *   **ILP:** I would revise my view if it were shown that participants *within* the system (judges/citizens) refuse to characterize these norms as "law" specifically *because* of the substantive end, despite the perfect form. This would suggest social acceptance depends on more than just source-based validity.
      *   **FNL:** I would revise my view if this system persisted for generations without any degradation of the eight desiderata. This would prove that the inner morality is compatible with *any* substantive end and is therefore not a moral constraint on law's existence, but merely a technique of administration.

  #### Case B: The Benevolent Informalism
  **Description:** A regime has no written constitution or statutes. Decrees are issued retroactively and secretly. However, the ruling council has a strict, unwritten code of honor: they never punish conduct that was not publicly announced as undesirable via custom or prior informal warning. Citizens can predict official action with 99% accuracy based on custom and the council's known sense of fairness. There is high stability and congruence between expectation and outcome, but zero compliance with Fuller's formal desiderata (no publicity, no prospectivity in form).

  *   **ILP Prediction:** This *could* be a legal system if the Rule of Recognition in that society accepts custom and official discretion as sources of law. If the officials treat these norms as binding standards, it is law.
  *   **FNL Prediction:** This is not law (or is severely legally deficient). Despite the stability and fairness, the failure of publicity and prospectivity means the government has not subjected conduct to rules. It is a system of benevolent commands, not law.
  *   **Falsification Conditions (Exposure):**
      *   **ILP:** I would revise my view if the citizens and officials in this system explicitly distinguish between "the Council's orders" and "the Law," reserving the term "Law" only for norms that *are* public and prospective. This would indicate that the social practice itself builds the inner morality into the Rule of Recognition necessarily, not optionally.
      *   **FNL:** I would revise my view if the citizens in this system claim a *right* to their expectations and hold officials accountable for violating custom, using the language of legal rights rather than moral appeals. This would suggest that the inner morality can be satisfied functionally (through congruence) even if the formal desiderata (publicity/prospectivity) are technically absent.

  ***

  **Signed,**

  *The Inclusive Legal Positivist*  
  *The Fullerian Natural Lawyer*  
  *Date: October 26, 2023*
