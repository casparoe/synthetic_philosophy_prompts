      *   **Specific Constraints:**
          *   Explain the case/consideration behind each requirement.
          *   Flag tensions/incompatibilities between requirements (this is the user's main interest).
          *   Address the user's specific proposed points (Bank cases, temporal asymmetry, subject vs. attributor stakes, skepticism/lottery, generalization, evidence vs. action distinction).
          *   Mark requirements as "Non-negotiable" vs. "Camp Prejudice".
          *   Identify the single requirement that does the most "exclusion work."
          *   No citations/reading lists (user knows the literature).
          *   Tone: Philosophical, analytical, direct, acknowledging the user's fatigue with "argue before define."

  2.  **Deconstruct the User's Proposed Points:**
      *   *Bank Cases (High/Low Stakes):* Standard fare. Needs to handle both.
      *   *Lowering Stakes (Footbridge vs. Highway):* Interesting twist. Usually, PE focuses on high stakes destroying knowledge. Does low stakes *create* it? Or is it just that high stakes destroys it? This touches on the symmetry of the effect.
      *   *Temporal Asmetry (Retrospective Stakes):* If I say "I know" and *then* learn stakes were high, do I retract? Intuition says often no. This challenges PE.
      *   *Subject vs. Attributor Stakes:* The core SSI vs. Contextualism fight. Needs a datum to separate them.
      *   *Skepticism/Lottery:* Relevance problem. If stakes make *all* error possibilities relevant, knowledge vanishes.
      *   *Generalization:* Is it just knowledge? Or belief/justification too? If everywhere, is it just practical rationality?
      *   *Evidence vs. Action:* The "Purist" intuition. Evidence is evidence; action depends on thresholds. PE risks conflating them.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Asymmetry Constraint (User's Bank/Footbridge point).*
          *   Need to capture that stakes usually *remove* knowledge, but rarely *add* it. The Footbridge case suggests low stakes permit action, but does it permit *knowledge*?
          *   *Tension:* If stakes affect knowledge, why doesn't low stakes make weak evidence count as knowledge?
