answer: |-
  This is the right way to approach the literature. The debate often stalls because sides treat their theoretical commitments as data and their data as negotiable. Below is the spec sheet for Pragmatic Encroachment (PE), broken down by requirement, case, and status.

  I have flagged the tensions explicitly. The "Non-negotiables" here are pre-theoretic intuitions that any theory must *explain* (even if it explains them away); the "Camp Prejudices" are theoretical virtues that one side prioritizes over the other.

  ### The Desiderata List

  **1. The Asymmetry Constraint (High/Low Stakes)**
  *   **The Demand:** The theory must explain why high stakes typically *destroy* knowledge (Bank Closed), but low stakes rarely *create* it out of thin air.
  *   **The Case:** Your Footbridge vs. Highway case. The highway inspector needs more evidence to *act*, but does the footbridge inspector *know* with less evidence? Or does he just have enough to act? Standard PE says stakes raise the threshold for knowledge; it rarely says stakes lower it below a baseline of evidence. If the theory says low stakes make weak evidence count as knowledge, it risks trivializing knowledge.
  *   **Status:** **Non-negotiable Data.** (The asymmetry is robust; the explanation is contested).

  **2. The Temporal Stability Constraint (Retrospective Stakes)**
  *   **The Demand:** The theory must explain why learning about stakes *after* an attribution doesn't typically trigger retraction.
  *   **The Case:** You say "I know the bank is open" on Friday. On Sunday, you learn that if the bank was closed, you would have lost your house. You don't typically say, "Oh, I was wrong on Friday." You say, "I knew it then, but I guess I shouldn't have acted on it." If knowledge is stakes-sensitive, the truth value of your Friday claim should depend on facts (stakes) that existed then, regardless of when you learned them. The intuition that the *attribution* stands creates friction for PE.
  *   **Status:** **Non-negotiable Data.** (This is the hardest empirical bullet for Subject-Sensitive Invariantism to bite).

  **3. The Locus Constraint (Subject vs. Attributor)**
  *   **The Demand:** The theory must specify whose stakes determine the truth conditions and handle disagreement cases where stakes diverge.
  *   **The Case:** A low-stakes subject says "I know." A high-stakes attributor says "You don't know." Who is right? If it's the subject (SSI), the attributor sounds rude but correct. If it's the attributor (Contextualism), the subject sounds correct in their context but wrong in ours. We need a datum that settles this, usually found in "disagreement persistence" (do we think they are contradicting each other?).
  *   **Status:** **Camp Prejudice.** (Contextualists prioritize linguistic data about disagreement; SSI proponents prioritize the intuition that knowledge is a property of the agent's state).

  **4. The Relevance Stability Constraint (Anti-Skepticism)**
  *   **The Demand:** The mechanism that makes stakes epistemically relevant cannot make *every* error possibility relevant in high-stakes contexts.
  *   **The Case:** Lottery/Preface. If "practically relevant" means "any alternative where acting on $p$ leads to disaster," then in high-stakes scenarios, *every* remote possibility (brain in a vat, lottery ticket) becomes a relevant alternative. If PE makes all remote alternatives relevant in high stakes, it collapses into skepticism for anyone with anything to lose.
  *   **Status:** **Non-negotiable.** (A theory of knowledge that yields skepticism in ordinary high-stakes situations is inadequate).

  **5. The Generalization Constraint (Scope)**
  *   **The Demand:** The theory must specify if encroachment applies to justification, rational belief, and credence, or *only* knowledge.
  *   **The Case:** If stakes affect whether you *know*, do they affect whether you are *justified* in believing? If yes, then practical factors affect the epistemic status of belief itself. If no (only knowledge), then knowledge is uniquely sensitive to action, which makes knowledge seem weirdly distinct from justification. If it applies to everything, "epistemology" risks collapsing into "practical rationality."
  *   **Status:** **Camp Prejudice.** (Purists want it nowhere; Radical Encroachers want it everywhere; Moderate Encroachers want it only for knowledge/warrant thresholds).

  **6. The Evidence/Action Distinction (Purist Intuition)**
  *   **The Demand:** The theory must preserve the intuition that evidence determines epistemic status, while stakes determine action thresholds. They should not bleed into each other.
  *   **The Case:** "Don't let 'it's more practical to act on p' quietly turn into 'the evidence for p got better.'" If two agents have identical evidence, they should have identical epistemic standing. If PE says they don't, it violates the idea that epistemology is about truth-connection, not utility-connection.
  *   **Status:** **Camp Prejudice.** (This is the Purist's hard line. Encroachers explicitly reject this as a false dichotomy).

  ---

  ### The Incompatibility Matrix (The Tensions)

  Here are the pairs that cannot be jointly satisfied without significant theoretical cost.

  **Tension A: Temporal Stability (2) vs. Stakes-Sensitivity (Core PE Thesis)**
  *   **The Conflict:** If knowledge depends on stakes, and stakes are facts about the world, then the truth value of a knowledge claim is fixed by those facts. If I didn't know the stakes on Friday, but they were high, I didn't know. Therefore, on Sunday, I should retract my Friday claim.
  *   **The Cost:** To save Temporal Stability, PE proponents often have to argue that *salience* of stakes matters, not just the stakes themselves. But if salience matters, we drift toward Contextualism or psychological invariantism, weakening the "real stakes" argument.

  **Tension B: Evidence/Action Distinction (6) vs. Asymmetry Constraint (1)**
  *   **The Conflict:** The Asymmetry Constraint demands that high stakes stop knowledge attribution in Bank cases. The Evidence/Action Distinction demands that evidence alone dictates knowledge.
  *   **The Cost:** You cannot have both. If you hold (6) as non-negotiable, PE is false. If you accept the data in (1) as non-negotiable, (6) must be treated as a prejudice. This is the definition of the debate.

  **Tension C: Relevance Stability (4) vs. The Mechanism of Encroachment**
  *   **The Conflict:** To explain Bank cases, PE needs a mechanism where stakes make error possibilities relevant. To avoid Skepticism (4), it needs a mechanism where stakes *don't* make remote error possibilities relevant.
  *   **The Cost:** Most PE theories struggle to draw the line between "relevant practical alternative" and "skeptical alternative" without appealing to normalcy or statistical probability—which risks turning PE back into a purely statistical/evidential view (Invariantism).

  ---

  ### The Verdict

  **Non-negotiable vs. Camp Prejudice**
  *   **Non-negotiable (Data that must be saved):** Asymmetry Constraint (1), Temporal Stability (2), Relevance Stability (4). Any theory that fails these fails to match the phenomena.
  *   **Camp Prejudice (Theoretical commitments):** Evidence/Action Distinction (6), Locus Constraint (3), Generalization Constraint (5). These are where you choose your side.

  **The Single Requirement That Does The Most Exclusion Work**
  **The Evidence/Action Distinction (6).**

  **Why:**
  This is the gatekeeper.
  *   If you treat this as **Non-negotiable**, Pragmatic Encroachment is ruled out *a priori*. You are forced into Classical Invariantism (and must explain away Bank cases as performance errors or conversational implicatures).
  *   If you treat this as **Negotiable**, you allow PE into the room, but you immediately inherit the burden of explaining *how* practical utility transforms epistemic status without making epistemology just a branch of decision theory.

  Every other tension (Temporal, Locus, Skepticism) is a technical problem *within* the debate. The Evidence/Action Distinction is the boundary *of* the debate. If you are tired of papers arguing for the view before defining it, check where they stand on (6). If they assume (6) is false without arguing for it, they are begging the question against the Purist. If they assume (6) is true without arguing for it, they are begging the question against the Encroacher.

  **One note on your Footbridge case:**
  Be careful with that intuition. It is likely "competence-talk smuggling," as you suspected. The intuition is usually: *The footbridge inspector is rational to sign off; the highway inspector is not.* That is a claim about **practical rationality**, not **knowledge**.
  If your intuition is specifically that the footbridge inspector *knows* and the highway inspector *doesn't* (despite identical evidence), that supports PE.
  If your intuition is that *both know*, but only one should act, that supports Invariantism.
  Most people's intuitions wobble here. A robust theory needs to predict why that wobble happens (likely because "knows" is often used to license action). If a PE theory can't distinguish "He knows but shouldn't act" from "He doesn't know," it fails the Generalization Constraint.
