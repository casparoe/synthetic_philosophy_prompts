          *   *Classification:* Non-negotiable (must pick a lane), but the *datum* is disputed.

      *   *Desideratum 4: The Stability/Skepticism Constraint (Lottery/Preface).*
          *   Stakes shouldn't make every remote possibility relevant.
          *   *Tension:* If practical relevance determines epistemic relevance, high stakes make *everything* relevant.
          *   *Classification:* Non-negotiable (avoid skepticism).

      *   *Desideratum 5: The Evidence/Action Distinction (Purist Intuition).*
          *   Evidence $\neq$ Utility.
          *   *Tension:* PE says Knowledge (epistemic) depends on Utility (practical). This blurs the line.
          *   *Classification:* This is the biggest point of contention. Purists say Non-negotiable. Encroachers say it's a false dichotomy. I should flag this as the main battleground.

      *   *Desideratum 6: The Generalization Constraint.*
          *   Does it apply to belief? Justification?
          *   *Tension:* If only knowledge, why? If all, is it just rationality?
          *   *Classification:* Theoretical virtue, not necessarily data.

  4.  **Identifying the Tensions (The "Meat"):**
      *   *Tension A:* Evidence/Action Distinction vs. The Bank Data. (Purism vs. Encroachment).
      *   *Tension B:* Temporal Asymmetry vs. Stakes-Sensitivity. (If knowledge depends on stakes, why doesn't new stake info change past truth?)
      *   *Tension C:* Stability vs. Sensitivity. (If stakes shift thresholds, how do we avoid skepticism in high-stakes universal contexts?)

  5.  **Selecting the "Exclusion Work" Requirement:**
      *   Which one kills the most theories?
      *   The *Evidence/Action Distinction* is the Purist shield. If you hold this as non-negotiable, PE is dead on arrival.
      *   However, the *Temporal Asymmetry* (Retraction) is often the specific empirical nail in the coffin for SSI/Contextualism in experimental philosophy.
      *   But the *Evidence/Action* distinction is the *conceptual* barrier. Let's go with that one, but nuance it as the "Purist Intuition." Actually, the user asked what *any adequate theory* has to deliver. If PE is true, the Evidence/Action distinction *must* be negotiable. So the requirement that does the exclusion work is the one that forces a choice between Purism and Encroachment.
      *   *Better candidate:* The **Stability vs. Sensitivity** tension. A theory must explain why stakes move the needle *sometimes* (Bank) but not *always* (Lottery/Skepticism). This kills crude versions of PE.
      *   *Best candidate for "Exclusion Work":* **The Evidence/Action Boundary.** If you demand this be held sacred, PE is impossible. If you demand PE be true, this must go. It's the fork in the road.

  6.  **Refining the Output Structure:**
