  ### The Case: The Dissociated Expert

  **The Scenario**
  Consider a commercial airline pilot during a complex, non-routine emergency (e.g., dual hydraulic failure). The stress triggers an acute episode of **depersonalization/derealization** (a documented, DSM-recognized dissociative state).

  During the 20-minute crisis, the pilot:
  1.  **Receives complex verbal instructions** from Air Traffic Control (ATC) and the co-pilot.
  2.  **Consults digital checklists**, integrating system status with procedural rules.
  3.  **Verbally reports** status updates to ATC ("Mayday, attempting gear extension") and coordinates with the co-pilot.
  4.  **Executes novel motor planning** to land the aircraft safely without standard hydraulics.

  Post-flight, in a debriefing (and corroborated by cockpit voice recording), the pilot reports: *"I heard the words, I said the words, and I moved the controls. But it felt like I was watching a movie of someone else flying. There was no 'me' in the cockpit. I wasn't feeling fear, or effort, or even the seat beneath me. It was just... data processing."*

  Crucially, the pilot is not amnesic. They can recount the sequence of events accurately because the *information* was stored, but they insist the *first-person experience* of agency and sensation was absent during the event. This is not a "flow state" (which is usually described as hyper-real); it is a clinical description of **emotional and somatic numbing** alongside preserved executive function.

  ---

  ### (a) The GWT Checklist Walkthrough

  To a Global Workspace Theorist (GWT), consciousness is defined by information availability. Let's run the standard checklist (based on Baars/Dehaene criteria) against the Dissociated Expert:

  1.  **Global Broadcast:** Did the information (hydraulic status, ATC commands) reach multiple specialized subsystems (language, motor, memory)?
      *   *Verdict:* **Yes.** The pilot used the info to speak, move, and plan. It was not encapsulated (like a reflex); it was available to the whole system.
  2.  **Verbal Report:** Could the system report the content *during* the operation?
      *   *Verdict:* **Yes.** The pilot spoke to ATC in real-time ("Attempting gear extension"). This satisfies the "reportability" criterion for Access Consciousness.
  3.  **Flexible Control:** Was the information used for novel planning rather than fixed routine?
      *   *Verdict:* **Yes.** Dual hydraulic failure is non-routine. The pilot had to improvise a landing strategy, not just execute a script.
  4.  **Working Memory Retention:** Was the information held long enough to be integrated?
      *   *Verdict:* **Yes.** The pilot held the ATC clearance in mind while manipulating controls.

  **Result:** By the functional criteria of GWT, this system is **Access Conscious**. The information was globally available, reportable, and used for flexible control.

  ---

  ### (b) Theoretical Verdicts

  Here is how different camps analyze the case, deriving their conclusions from their core commitments rather than stipulation.

  **1. The Global Workspace Theorist (Standard/Dehaene Flavor)**
  *   **Commitment:** Consciousness *is* global availability (Access). If information is broadcast for report and control, it is conscious.
  *   **Verdict:** **Conscious.**
  *   **Reasoning:** "The pilot reported the data and used it flexibly. That *is* what consciousness does. The pilot's claim that 'nothing was felt' is a report about *memory* or *emotion*, not about the presence of consciousness itself. If you can report it, you were conscious of it."

  **2. The Higher-Order Thought (HOT) Theorist**
  *   **Commitment:** A state is phenomenally conscious only if there is a higher-order thought *about* that state (e.g., "I am seeing red").
  *   **Verdict:** **Ambiguous / Leaning Unconscious.**
  *   **Reasoning:** "The pilot had first-order access to the instruments (they could use them). But did they have a higher-order thought *that they were experiencing* the instruments? Their report ('watching a movie of myself') suggests the HOT was decoupled from the first-order state. They were aware of the *content*, but not aware of *themselves experiencing* the content. This looks like Access without Phenomenal Consciousness."

  **3. The Block-Style Reasoner (Access/Phenomenal Distinctivist)**
  *   **Commitment:** Access (functional availability) and Phenomenality (what it's like) are empirically distinct and can come apart.
  *   **Verdict:** **Access Conscious, Phenomenally Unconscious (or Diminished).**
  *   **Reasoning:** "This is the hard direction made real. The workspace was lit up (Access), but the 'lights' didn't feel like anything to the subject (Phenomenality). The pilot's sincere testimony of 'numbness' or 'automation' is evidence that the functional machinery ran without the phenomenal glow. We trust reports of pain; we should trust reports of no-pain/numbness."

  ---

  ### (c) The Killer Feature & The Deletion Test

  **The Feature:** **The Decoupling of Executive Report from Autobiographical Binding.**
  The intuition that "nothing was felt" arises because the pilot's report is *semantically rich* but *autobiographically empty*. They can say "I landed the plane," but they cannot access the *sensory-affective texture* of landing it. The "killer feature" is the **sincere first-person testimony of absence** regarding the *qualitative* aspect, despite the presence of the *functional* aspect.

  **The Deletion Test:**
  If you delete this feature—i.e., if the pilot says, *"I was on autopilot, but I felt the stick vibrating, I felt the adrenaline, I felt the seat"*—the case collapses into a standard case of **High Arousal Consciousness**.
  *   If they report feeling *anything* (even stress), the "No Phenomenality" intuition vanishes.
  *   The case *only* works if the subject insists on the absence of the "what it is like" while maintaining the presence of the "what I did."
  *   This shows the intuition relies entirely on the **authority of the negative phenomenological report**. If we dismiss that report, the case disappears.

  ---

  ### (d) The Strongest GWT Counter-Argument (Biting the Bullet)

  A sophisticated GWT proponent (e.g., Stanislas Dehaene) will not deny the intuition pump works. They will argue the intuition is **mistaken**.

  **The Argument:**
  "The pilot *was* phenomenally conscious. Their report of 'nothingness' is an error of **metacognition**, not evidence of absent consciousness.
  1.  **Broadcast implies Feel:** If the information was globally broadcast to the language centers (to speak to ATC), it was necessarily broadcast to the self-model centers.
  2.  **Memory Failure:** The pilot's claim that 'nothing was felt' is actually a claim that 'I have no episodic memory of the feeling.' Dissociation impairs the *encoding* of the self into the memory, not the *presence* of the self during the act.
  3.  **Conclusion:** You cannot have Access without Phenomenality. If the pilot could report 'I am landing,' there *must* have been something it was like to report 'I am landing.' The pilot is confusing 'I don't remember feeling' with 'I wasn't feeling.' Therefore, this system *is* fully conscious, and your intuition that it isn't is a trick of amnesia."

  **Why this is strong:** It preserves the functionalist core (Access = Consciousness) by re-interpreting the "No Feeling" report as a memory deficit rather than a perceptual deficit. It forces you to choose: Trust the functional criteria (GWT) or Trust the introspective report (Phenomenology).

  ---

  ### Meta-Analysis: Settled vs. Contested

  To ensure this survives your seminar, you must distinguish where the ground is solid and where it is swampy.

  **1. Settled (Mostly):**
  *   **The Concepts:** Everyone agrees "Access Consciousness" (report/usage) and "Phenomenal Consciousness" (feeling) are *conceptually* distinct definitions (Block 1995).
  *   **The Phenomenon:** Dissociative states where people act complexly but report "unreality" are clinically real (DSM-5 Depersonalization/Derealization).

  **2. Contested (The Minefield):**
  *   **The Entailment:** Whether Access *entails* Phenomenality in intact human brains.
      *   *Functionalists:* Yes. If the function is there, the feel is there.
      *   *Phenomenal Realists:* No. Function can run without feel (the Hard Problem).
  *   **The GWT Definition:**
      *   *Baars (Original):* Workspace is a functional architecture; consciousness is what happens there. Leaves room for A-without-P if the "light" is off.
      *   *Dehaene (Neuro-Cognitive):* Often equates Access *with* Consciousness. For Dehaene, if it's reportable, it's conscious *by definition*. Using this case against Dehaene requires arguing his definition is too broad.
  *   **The Authority of Report:**
      *   Can we trust a subject who says "I felt nothing"?
      *   *Skeptics:* They might have felt it and forgot (the GWT counter above).
      *   *Privileged Access:* Standard philosophy of mind grants first-person authority on current experience. If we deny this here, we risk denying it for pain reports too.

  **Constraint Check & Warning:**
  You asked for a case that doesn't "smuggle a zombie."
  *   **Warning:** A hardline Functionalist *will* claim this case smuggles a zombie. They will argue that if the pilot behaves exactly like a conscious pilot, positing "no feeling" is an unnecessary metaphysical add-on (Occam's Razor).
  *   **Defense:** You are not asserting they *are* a zombie. You are asserting that the **intuition of a gap** is robust enough to warrant discussion. The case relies on the *pilot's testimony*, not your stipulation. If the functionalist rejects the pilot's testimony of "numbness," they are challenging clinical data, not just philosophy.

  **If you must relax a constraint:**
  If the seminar functionalists are strict **Identity Theorists** (Neural State X = Consciousness Y), this case will fail because they will simply identify the "Global Broadcast" neural state with the "Feeling" neural state. To satisfy them, you would need to relax **Constraint 1** (Present Day Earth) and move to a **Silicon-Based System (LLM)**.
  *   *Why?* Because with an LLM, even functionalists hesitate to attribute "feeling."
  *   *Risk:* This violates "No Zombies" (since LLMs are often treated as philosophical zombies).
  *   *Recommendation:* Stick with the **Dissociated Human**. It forces the functionalist to argue against a human being's sincere report of their own mind, which is a much harder philosophical bullet to bite than arguing about software.

  **Final Note for the Seminar:**
  Frame this not as "Proof of A-without-P," but as "The Empirical Limit of Access." The case shows that even when Access is maximized (life-or-death reporting), the *report of Phenomenality* can minimize to zero. Whether that means Phenomenality was *actually* zero, or just *reported* as zero, is exactly where your seminar should fight.
