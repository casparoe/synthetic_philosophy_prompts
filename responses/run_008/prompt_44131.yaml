  This step asserts the ability to select a strict upper bound at every stage without specifying a rule, which implicitly requires a choice function on the family of non-empty sets of strict upper bounds. The keep-climbing picture is seductive precisely because human intuition is calibrated on finite sets or well-ordered structures like the ordinals, where such choices are canonical or trivial; in those contexts, "picking" feels like observation rather than construction. In your friend's ordinal application, Step (3) is actually valid because the successor operation provides a definable choice, but the argument collapses at Step (8) and (5) because the ordinals constitute a proper class, not a set, rendering the cardinality bound inapplicable. For general sets, however, Step (3) fails precisely because there is no canonical way to choose without a well-ordering, which is not guaranteed without the Axiom of Choice.

  Repairing the argument to make the climb well-defined requires assuming a choice function or well-ordering principle, so the repair quietly reintroduces the Axiom of Choice under the name of a selection rule. Consequently, the picture does not establish Zorn's Lemma for sets without any appeal to choice; it merely disguises the appeal within the instruction to "pick." Your intuition behind Step (5) is vindicated for sets—the climb must stop due to cardinality constraints (Hartogs' number)—but without the Axiom of Choice, you cannot guarantee the climb exists to reach that stop, as you may be unable to select the next element even if one exists. Thus, Zorn's Lemma remains equivalent to the Axiom of Choice, and the "self-evident" gloss is an artifact of conflating sets with well-ordered classes.
