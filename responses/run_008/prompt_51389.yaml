      **False/Problematic:** The claim that Hacking views psychiatric classifications as "pure social constructions" tracking "not any real condition" is exactly opposite to his later work. Hacking rejected "social constructionism" that denies reality. He argued that while *categories* are historical inventions, the *suffering* and *behaviors* are real. He didn't say MPD was *just* created by therapists; he analyzed how the *concept* of memory and trauma shaped the expression of real distress. Furthermore, dynamic nominalism applies specifically to "kinds of people," not "every classification there is." Natural kinds (like beetles) don't loop.

