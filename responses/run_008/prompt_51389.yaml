      *   *Claim 1:* "Once psychiatry puts a label on a group of people, the label starts changing the people." -> **Accurate.** This is the core of the looping effect.
      *   *Claim 2:* "Patients read about their diagnosis and start understanding themselves through it, doctors respond by sharpening the criteria, and the category chases a moving target forever." -> **Mostly Accurate.** Describes the interaction, though "forever" is a bit dramatic.
      *   *Claim 3:* "Hacking concluded that psychiatric classifications are therefore pure social constructions -- they track how society talks about deviance, not any real condition." -> **False/Problematic.** Hacking explicitly rejected the idea that looping effects imply *nothing* real is there. He argued against "social constructionism" that denies reality. He believed there are real suffering/behaviors, but the *classification* interacts with them.
      *   *Claim 4:* "His favourite example was multiple personality disorder, which he argued was essentially created by therapists and then spread by suggestion until it got so embarassing the DSM had to delete it." -> **Oversimplified/Debatable.** He did discuss MPD (DID) extensively (*Rewriting the Soul*), but saying he argued it was *essentially created* by therapists ignores his nuance about real suffering. He focused on the *memory* and *classification* interaction.
      *   *Claim 5:* "He called his view dynamic nominalism, and extended it to every classification there is: mental illnesses, genders, kinds of people generally are all just names we invent and then impose on the world." -> **Oversimplified.** Dynamic nominalism applies to "kinds of people," not "every classification" (like quarks or beetles). He distinguishes between indifferent kinds (natural) and interactive kinds (human).
      *   *Claim 6:* "The lesson is that the human sciences can never achieve stable, repeatable knowledge the way physics does, because quarks don't care what we call them and people do." -> **Mostly Accurate.** This is the "indifferent vs. interactive kinds" distinction. However, "never achieve stable knowledge" is too strong; he suggests the knowledge is different, not impossible.

