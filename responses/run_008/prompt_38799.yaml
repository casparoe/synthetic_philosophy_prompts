answer: |-
  ### The Logical Space
  Before the tree, here are the four axes generating the positions. We aren't asking you to name your axis; the cases will reveal where you stand.

  1.  **Scope:** Do benefits to people who do not yet exist count equally to benefits to people alive now?
  2.  **Pure Time:** Holding existence and wealth constant, does the *calendar date* itself reduce value?
  3.  **Structure:** Is the trade-off between "now vs. one year" the same as "100 years vs. 101 years"?
  4.  **Rationality:** Is your personal impatience a mistake to be corrected or a value to be respected?

  ---

  ### The Decision Tree

  **Node 1: The Unconceived Child**
  *Case:* You can prevent a mild headache for a specific child alive today, OR prevent an identical headache for a specific child who will be conceived in 2230. You know for a fact the future child will exist and feel the pain.
  *   **A:** I must save the child alive today. The future child's welfare doesn't count (or counts less) until they exist. → **Go to Leaf 1**
  *   **B:** It makes no ethical difference which child I help. → **Go to Node 2**

  **Node 2: The Certain Pain**
  *Case:* You must schedule a painful operation for yourself. You will be equally healthy, rich, and alive in 2025 as in 2125. There is zero risk you won't be there. Is the pain in 2125 *intrinsically* less bad than the pain in 2025 just because of the date?
  *   **A:** Yes. Future pain is less urgent simply because it is future. → **Go to Node 3**
  *   **B:** No. Time itself is ethically neutral. → **Go to Node 4**

  **Node 3: The Calendar Flip (Structure of Pure Preference)**
  *Case:* If you prefer 1 unit of pain *today* over 1.01 units *next year*, must you also prefer 1 unit of pain in *year 2100* over 1.01 units in *year 2101*?
  *   **A:** Yes. My rate of impatience is constant (e.g., 1% per year forever). → **Go to Leaf 2**
  *   **B:** No. I care less about the delay when both options are far away. → **Go to Leaf 3**
  *   **C:** No. I care *more* about the delay when both options are far away. → **Go to Leaf 9 (Unoccupied)**

  **Node 4: The Source of Discounting**
  *Case:* You accept time is neutral (Node 2), but you still discount the future. Why?
  *   **A:** Only because they might not exist (extinction risk) or will be richer (growth). → **Go to Node 5**
  *   **B:** I don't discount at all. A benefit is a benefit, regardless of date or probability. → **Go to Leaf 4**

  **Node 5: Uncertainty Shape**
  *Case:* When discounting for the risk that humanity won't survive to 2230, does the effective discount rate stay constant or decline over centuries?
  *   **A:** Constant. The annual extinction risk is roughly steady. → **Go to Leaf 5**
  *   **B:** Declining. Uncertainty about the *rate itself* makes the far future weigh heavier. → **Go to Leaf 6**
  *   **C:** I discount purely for growth, ignoring risk. → **Go to Leaf 8**

  **Node 6: The Commitment Test (Personal Impatience)**
  *Case:* You feel a strong urge to take money now rather than double it next month. Should you be allowed to legally bind your future self to stop you from giving in?
  *   **A:** Yes. My current impatience is a bug; my future self knows better. → **Go to Leaf 7**
  *   **B:** No. My current preference gets to boss around my future self. → **Go to Leaf 8**
  *   **C:** N/A. I feel no such impatience. → **Go to Leaf 4**

  *(Note: Node 6 is a "wildcard" branch; participants might arrive here from Node 2 or 3 if they admit personal bias affects their social view.)*

  ---

  ### The Leaves (Positions & Awkward Commitments)

  1.  **Person-Affecting Restriction**
      *   *Position:* Only existing people count.
      *   *Awkward Commitment:* You cannot claim it is "bad" if humanity goes extinct in 2100, provided the last generation lives happy lives.
  2.  **Classical Exponential Discounting (Nordhaus)**
      *   *Position:* Positive pure time preference, constant rate.
      *   *Awkward Commitment:* You must accept that a catastrophe killing a billion people in 2200 is ethically less significant than a minor recession today.
  3.  **Declining Pure Preference (Chichilnisky)**
      *   *Position:* Pure time preference exists but declines to avoid the "dictatorship of the present."
      *   *Awkward Commitment:* You are committed to a specific mathematical weighting of the infinite future that can override all present needs.
  4.  **Full Temporal Neutrality (Sidgwick-Nagel)**
      *   *Position:* No discounting for time, probability, or growth.
      *   *Awkward Commitment:* You must save for a future benefit even if it requires extreme sacrifice now, potentially impoverishing the very people you aim to help.
  5.  **Ramsey-Stern (Uncertainty/Growth Constant)**
      *   *Position:* Zero pure time preference; discount only for extinction risk and economic growth.
      *   *Awkward Commitment:* If you believe growth will stop, your discount rate drops to near-zero, demanding massive current investment regardless of current poverty.
  6.  **Weitzman/Declining Uncertainty**
      *   *Position:* Discounting driven by uncertainty about the correct discount rate.
      *   *Awkward Commitment:* You value the far future highly not because of ethics, but because you are unsure about your own math.
  7.  **Quasi-Hyperbolic (Descriptive/Irrational)**
      *   *Position:* We *are* present-biased, but we *shouldn't* be.
      *   *Awkward Commitment:* You view your own natural psychology as a systematic error requiring paternalistic correction.
  8.  **Quasi-Hyperbolic (Defensible/Normative)**
      *   *Position:* Present-bias is ethically permissible for the current generation.
      *   *Awkward Commitment:* You must admit that your grandchildren's preferences would be equally valid if they could vote from the future to overrule you.
  9.  **Growth-Only Discounting**
      *   *Position:* Discount solely because future people will be richer.
      *   *Awkward Commitment:* If the future is poor, you must transfer wealth to them even if it risks making them poorer via reduced investment.
  10. **The Indistinguishable Hybrid**
      *   *Position:* A tiny pure rate (0.1%) mixed with uncertainty.
      *   *Awkward Commitment:* You cannot empirically distinguish your view from Ramsey-Stern without settling metaphysics about the nature of time.

  ---

  ### Unoccupied Cells (Diagnosis)

  *   **Increasing Discount Rate (Leaf 3 Option C):** *Diagnosis:* **Incoherent/Unattractive.** Implies the year 2101 matters significantly less relative to 2100 than 2025 does to 2024. No ethical theory justifies why distance *increases* moral irrelevance exponentially.
  *   **Negative Pure Time Preference:** *Diagnosis:* **Unexplored.** Implies future well-being matters *more* simply because it is later. Usually rejected as arbitrary, unless disguised as Prioritarianism (helping the future because they might be worse off).
  *   **Pure Time Preference + Temporal Neutrality:** *Diagnosis:* **Contradiction.** You cannot hold that time matters ethically (Node 2A) and that it doesn't (Node 2B).

  ---

  ### Indistinguishable Pair Flag

  **Ramsey-Stern (Leaf 5) vs. The Indistinguishable Hybrid (Leaf 10)**
  *   **The Problem:** If your pure time preference is very small (e.g., 0.1%) and your uncertainty about future existence is high, the resulting discount curve looks mathematically identical to a zero-pure-preference view with high uncertainty.
  *   **Why Cases Fail:** No concrete case of trade-offs (e.g., "save $100 now or $105 in 100 years") can separate these, because the output numbers are the same.
  *   **Resolution:** You can only sort this by asking the metaphysical question: "If you knew with *metaphysical certainty* the future person would exist and be equally rich, would you still discount?" If yes, you are Hybrid/Nordhaus. If no, you are Ramsey-Stern. The tree's case-based nodes cannot separate them without this metaphysical probe.
