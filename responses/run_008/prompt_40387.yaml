      *   **Move 4 (Theo):** Concept is parochial. Excludes Boston Tea Party. Concept should give way.
          *   *Analysis:* Theo is historically right (Boston Tea Party wasn't civil disobedience in the Rawlsian sense; it was revolutionary/rebellious). He is right that the concept is liberal-democratic specific. However, his conclusion that the concept should be discarded because it doesn't cover revolution is a category error. Civil disobedience is distinct from revolution.
          *   *Verdict:* Theo is right about the historical classification but wrong to demand the concept cover revolutionary acts.

      *   **Move 5 (Dana):** Confusing justification with classification.
