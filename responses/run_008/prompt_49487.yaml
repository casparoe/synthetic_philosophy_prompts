  I TA for intro epistemology and my lecturer just dumped the surprise exam paradox on me for Friday's fifty-minute section, first-years, no logic background, and the assigned reading didnt land for a single one of them. You're a veteran philosophy teacher who has taught this paradox a dozen times, so think carefully before answering -- maybe sketch the common failure modes of teaching it first, because I refuse to do the standard hand-wave where you just say the backward induction is invalid and move on to the next slide. What I want from you is the plan, not the explanation itself: the exact order the pieces have to come in and why (I suspect the meaning of "you will not know which day" -- know, not merely fail to guess -- has to be nailed down before the induction even starts, but correct me if I'm wrong), the one example that should carry the whole hour (the exam announcement itself, the unexpected hanging variant, or something you think works better, and what it needs to have and lack), the misconceptions they'll predictbly form and where in the sequence to head off each one -- I'm guessing "so the announcement is self-refuting and surprise exams are just impossible," plus the kid who thinks the teacher announcing it for Friday and giving it Tuesday dissolves the whole thing -- a single question I can pose at the end that would tell me whether they actually got it versus nodded along, and what I should openly admit I'm not touching at this level, whether that's the formal epistemic treatments or the knowledge-about-your-own-knowledge stuff. Give me exactly five numbered items, each a sentence or two, no intro and no conclusion -- the five should be the chunks of the fifty minutes in order, with each misconception-head-off folded into whichever chunk it belongs to.
