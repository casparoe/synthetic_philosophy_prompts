answer: |-
  The turkey carcass was picked clean, sitting in a pool of congealed gravy on the counter. We were at the kitchen island, nursing the last of the wine, the rest of the family having migrated to the living room for football. This was the ring.

  "Here we go," Mark said, swirling his Cabernet. "I can see you winding up. You've got that look."

  "I'm just saying, you worked seventy-five hours last week. Again."

  "And I launched a feature," he said, leaning back. "I feel alive, Dan. When I'm in that flow, solving problems that actually matter? That's not suffering. That's dignity. You think dignity comes from watching Netflix until your eyes bleed?"

  "I think dignity comes from knowing you're a human being, not a processor," I said. "I'm talking about *karoshi*. Japan. People dying at their desks. Heart attacks at forty-five. Suicides because they missed a quota. That's where this ends."

  Mark shook his head, quick and sharp. "That's the bug, not the feature. You're acting like I'm advocating for slavery. I'm advocating for agency. Any good thing kills you in excess. Drink too much water, you die. Does that mean hydration is immoral? Does that mean we should all just sip politely to be safe?"

  "Water doesn't demand more water," I said. "Work does. That's the difference. Work is an appetite that dresses itself up in moral language. You say 'discipline,' I say 'compulsion.' If your ethic doesn't have a stop signal built in, it's not an ethic. It's a treadmill with virtue words painted on the side."

  "But the stop signal is the goal," Mark countered, leaning forward. "You guys treat work like a tax you pay to buy leisure. I treat work like the thing you buy leisure *for*. The discipline you build there spills over. It makes you a better father, a better husband. When you push for a thirty-five-hour week, you're not buying freedom. You're buying comfort. You're choosing mediocrity because you're afraid of being judged by your output."

  "I'm choosing space," I said. "Leisure isn't just recharging so you can work more. It's a separate good. It's time where you aren't producing anything. That's the point. If you can't justify time unless it produces something, you're not a worker, you're a tool. What is all the work *for*, Mark? If the answer is just 'more work,' then you're already dead, you're just waiting for the body to catch up."

  He paused, took a sip. He looked tired, actually. Not physically, but in that way startup guys get when the valuation dips. "The work is for building something that lasts. For providing. For mastery."

  "Mastery of what?" I asked. "The market? The algorithm?"

  "Of myself," he said.

  "Okay," I said. "Let's say you win. Let's say the government mandates the thirty-five-hour week. Everyone gets Friday off. No penalties. What happens?"

  "People spend time with their kids. They paint. They read."

  "Do they?" I pressed. "Or do they fill the void? Look at weekends now. People don't rest. They do side hustles. They 'invest in themselves.' They check email because they're terrified of falling behind. If you gave everyone that free time, would it actually become leisure? Or would it just fill up with work-adjacent anxiety?"

  Mark went quiet. He traced the rim of his glass. "That's... a fair point."

  "Is it?" I said. "Because my fear isn't that you work hard. My fear is that you've forgotten how to do anything else. And if we change the culture, I'm worried we haven't changed the people. We just give them more room to panic."

  "But that's why you need the ethic," Mark said, finding his footing again. "If you don't have the discipline to say 'this is enough,' the free time *will* get corrupted. You need the work structure to define the boundary. Without the tension of the grind, the leisure feels unearned. It feels hollow."

  "So leisure is a reward?" I asked. "Not a right?"

  "It's a harvest," he said. "You can't harvest nothing."

  "But what if the field is poisoned?" I shot back. "That's my blow, Mark. You say *karoshi* is just water intoxication. I say it's proof the water is poisoned. If the system requires people to die to sustain it, the system is wrong. Not the people. And if we switch to a shorter week, and everyone just uses the extra time to optimize their sleep so they can grind harder on a side hustle... then the problem isn't the hours. It's us. It's that we don't believe we're allowed to exist without producing."

  Mark looked out the window at the dark yard. The muffled sound of the game came from the other room. "I don't know if I can stop," he said quietly. "Even if I wanted to. The company... it's not just a job. It's who I am. If I stop pushing, who am I?"

  "That's exactly what I'm afraid of," I said. "And I don't know how to fix it either."

  He looked back at me, a small, wry smile. "So we're stuck. You think I'm a slave driver who loves his chains. I think you're a hedonist who's afraid of the weight."

  "I think you're my brother-in-law," I said, clinking my glass against his. "And I think you're tired."

  "And I think you're right about the anxiety," he admitted. "My team... even when we give them time off, they log in. They can't help it. They don't know what else to do."

  "Then maybe the work ethic isn't the answer," I said. "Maybe it's the disease."

  "Or maybe," Mark said, finishing his wine, "we just need better hobbies."

  We sat there for a minute, the silence comfortable but heavy, the question hanging between us like smoke. Neither of us moved to go join the family. We just watched the dark window, wondering what we'd do with the night if we weren't allowed to worry about tomorrow.
