      *   *Weak PII:* Accepts Black's spheres are distinct because they are in different places. Space/Time are individuating principles. Denies haecceities.
      *   *Haecceitism:* Accepts Black's spheres could be distinct even in the same place (or without space/time). There is a primitive "thisness."
