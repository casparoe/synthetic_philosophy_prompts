  ### The Principle
  **The Principle of Causal Weight:** You trust explanations where the cause exerts sufficient pressure to make the *class* of outcome probable, independent of specific agents or fragile chains of events, and you distrust explanations that reconstruct a narrow narrative path to fit the known result.

  ### My Cases, Checked
  *   **Soviet Structural vs. Gorbachev:** **Fits.** "Structural rot" is a high-weight force (economic decay, institutional rigidity) that makes *some kind* of collapse probable. Gorbachev is a specific agent; relying on him makes the explanation fragile (what if he died in 1986?).
  *   **Invisible in 1985:** **Fits (with caveats).** A crack in a dam carries causal weight even if no one sees it. You trust the *existence* of the force, not the contemporary perception of it.
  *   **Chauffeur/Accident:** **Fits.** A wrong turn is noise, not weight. It explains the *timing* or *specifics*, but not the *class* of outcome (the system's vulnerability). Calling it "trivia" is your brain rejecting low-weight causes for high-weight events.
  *   **Predictions:** **Fits.** A prediction proves the causal weight existed *before* the outcome was known, ruling out narrative reconstruction. This is the gold standard for your principle.
  *   **Geology vs. Business:** **Fits.** Earthquakes are driven by physical pressure (high weight, invariant laws). Business success books often attribute outcomes to CEO genius (low weight, high contingency) while ignoring market luck, making them feel like post-hoc storytelling ("cheating").
  *   **Near Misses:** **Fits.** One near miss acknowledges friction (honesty about the mechanism's limits). Three near misses imply the outcome hung by a thread, suggesting the causal weight was actually low and the author is stitching together a thriller narrative to explain why the light cause produced a heavy effect.

  ### What I Have to Give Up
  Your friend is partially right: you cannot fully escape the charge of hindsight bias, specifically regarding the **"Invisible in 1985"** verdict.
  *   **The Conflict:** If the structural rot was truly invisible to contemporaries, how do you know the historian isn't just painting a target around the arrow they already shot? The "weight" of the structure is often measured *using* the collapse data. You have to admit that your trust in structural explanations is partly because they *feel* inevitable now, which is the definition of hindsight bias.
  *   **The Rival Principle:** Your friend advocates for **Radical Contingency** (history is a mess of accidents and perceptions). This saves the "Gorbachev" and "Chauffeur" cases by arguing that without those specific sparks, the rot might have simmered for decades. To accept this, you'd have to admit that "Structural Rot" is often just a story we tell to make the chaos feel manageable.
  *   **The Business/Geology Distinction:** You also have to give up the idea that Business *can't* be structural. Market monopolies or supply chain physics carry causal weight. Your dismissal of business books is likely a heuristic against a genre known for survivorship bias, not a principled distinction between social and physical sciences.

  ### A New Case
  **The Ongoing War:**
  You are reading an analysis of why one side is currently winning a war that is still being fought.
  *   **The Prediction:** The Principle of Causal Weight says you should trust explanations based on **logistics, industrial capacity, and demographics** (structural weight that exists independently of the daily news cycle).
  *   **The Warning:** You should distrust explanations based on **morale, specific tactical genius, or single battles** (fragile chains).
  *   **The Twist:** Because the war is ongoing, there is no final outcome to validate the "weight." Therefore, your principle demands you treat *all* explanations as provisional. If an analyst claims the outcome is *inevitable* due to structural weight, you should be skeptical; without the endpoint, "inevitability" is just a narrative device. You should prefer the analyst who says, "Side A has heavier artillery production, so they *should* win, unless X contingency occurs," over the one who says, "Side A is winning because their cause is just."
