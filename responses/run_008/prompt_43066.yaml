      *   *Illusionism:* Dennett is often associated with illusionism regarding qualia or the Cartesian Theater, but he doesn't typically say understanding is *nothing* or *non-existent*. He says it's a functional capacity realized by incompetent parts.
      *   *Turing Test:* Dennett respects the Turing Test but doesn't necessarily say passing it *just is* understanding in a trivial sense; he argues understanding is a matter of degree and functional organization.
