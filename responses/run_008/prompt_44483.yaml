      *   *Specific Moves:*
          *   A: Translation/Encounter analysis. Normative vs. Descriptive regress.
          *   B: Role/Content distinction. Regress description.
      *   *Formatting:* Use a table or clear bullet points.

  5.  **Review and Refine:**
