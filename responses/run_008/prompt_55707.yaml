      *   *Nuance:* On morality, emphasize that Darwin thought the moral sense was *real* and *binding* on humans, even if its origin was natural. He didn't think "it's just instinct so ignore it." He thought "it's instinct, therefore it defines us."
      *   *Key Source:* Mention the *Autobiography* (written for family, not publication) and the *Life and Letters* (edited by Francis, sometimes sanitized).
      *   *Key Scholar:* James Moore, Janet Browne, Michael Ruse, David Sloan Wilson (maybe too evo-psych?), Gillian Beer. Stick to historians of science like Moore and Browne.

  8.  **Final Review against User Prompt:**
      *   Did I go claim by claim? Yes.
