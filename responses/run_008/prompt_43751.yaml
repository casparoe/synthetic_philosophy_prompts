  longtime lurker, first-time asker, mostly I just read the decision theory threads but this has been bugging me for ages. I keep telling people I'm a nominalist about math and I want someone to check whether the rest of what I believe survives that. here's the set:

  (1) there are no abstract objects — numbers aren't out there anywhere, math is closer to a shared formal game than a landscape of facts
  (2) the twin prime conjecture is true or false right now, independent of whether anyone ever proves it or whether PA settles it
  (3) my gut says the continuum hypothesis has a determinate answer and we just haven't found the right axiom yet — "independent of ZFC" doesn't feel like the end of the story
  (4) I buy the epistemic access worry: if abstract objects existed we'd have no causal hook into them, so how would we know anything about them
  (5) I don't think "Holmes is a detective" being super useful commits me to Holmes existing, so I'm suspicious when indispensability arguments try the same move with numbers and physics
  (6) but "2+2=4" feels necessary in a way "Holmes lives at 221B Baker Street" doesn't, and if my story about math can't capture that difference I feel like I've been sold a bill of goods
  (7) whether a specific Turing machine halts is a determinate fact about the world, not a matter of which fiction we adopt — even for machines where the halting question is independent of ZFC

  so: which of these actually pull against each other, which only look like they do, and what's the cheapest thing to drop? I suspect (1) is the one that goes but I really don't want it to, and I'd like you to be honest about what it costs either way. please rank the tensions instead of listing them all as equally bad, and tell me which single revision cleans up the most.
