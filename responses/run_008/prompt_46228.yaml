on work built around that result rather than after it; (4) a statement of what a successful outcome looks like — the possible conclusions, which considerations would decide among them, and what a publishable deliverable would be for each; (5) an honest account of what would count as the project failing, including the scenario where the formal equivalence turns out to be trivially obtainable and the interesting question evaporates; and (6) a scope assessment: which parts could balloon into career-length projects and how I would fence them off. Do not include a bibliography or citations of any kind; describe the positions and arguments on their merits and I will supply the scholarly apparatus myself. Finally, tell me candidly if you think the half-formed idea is a poor one and a better framing of the underlying worry exists — I would much rather learn that now than in the fourth month of the leave.
