      *   *Top Tension:* **Kidney Sales (1) + Consent (5) vs. Price Gouging (3).**
          *   *Why:* Both involve life-critical resources allocated by price during scarcity. In (1), you embrace the price mechanism to solve scarcity (kidneys). In (3), you reject the price mechanism to solve scarcity (generators/medicine) because it feels exploitative.
          *   *What gives:* Either you accept price gouging as morally permissible (aligning with 1 & 5), or you ban kidney sales on similar fairness/exploitation grounds (aligning with 3).
