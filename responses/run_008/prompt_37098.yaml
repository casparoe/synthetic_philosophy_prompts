prompt: |-
  I keep getting into arguments with my brother-in-law about markets in icky stuff and I want to check whether my actual views hang together before thanksgiving. Here's where I've landed: (1) kidney sales by competent adults should be legal, the ban is paternalism and people die on waiting lists because of it. (2) Vote selling should stay banned, period — one person one vote isn't something you should be able to buy around. (3) Price gouging after a hurricane is genuinely wrong and the bans are justified, not just politically convenient, even when the high prices do move scarce generators to whoever wants them most. (4) I think the whole "commodification corrupts the good" style argument is hand-waving — I don't buy that paying for blood crowds out donation or that sex work degrades sex, it usually just smuggles in a yuck response. (5) I also think desperation doesn't void consent — sweatshop workers really do consent, however awful their alternatives, and insisting they don't gets the ethics backwards imo. So is this a consistent package, or am I using reasoning against vote selling and price gouging that would also sink kidney sales? Don't just flag every pair — some of these probably fit together fine and I suspect one or two are the real problem, I just can't tell which. Rank whatever tensions you find by severity, say what would have to give in each, and tell me which single revision cleans up the most. Please answer in American English.
