          4.  Thanksgiving Survival Guide (How to argue it).

      *   *Refining the Tension Analysis:*
          *   *Tension 1 (The Desperation Double Standard):* 1 & 5 allow exploiting seller desperation. 3 forbids exploiting buyer desperation. Why is the seller's desperation less protective than the buyer's?
          *   *Tension 2 (The Commodification Inconsistency):* 4 says markets don't corrupt. 3 implies the market price *corrupts* the transaction in emergencies.
          *   *Tension 3 (Vote Selling):* Actually, this is the least problematic. It's a "sphere separation" argument.

