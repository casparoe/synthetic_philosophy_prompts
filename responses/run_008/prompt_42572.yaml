le 51/49 double-or-nothing on my whole net worth. I think declining is perfectly rational even though the bet has positive expected value — and I notice this sits oddly next to my verdict in Case B, where taking the one-shot all-in was acceptable. The case I keep going back and forth on: my colleague wants to invest a large inheritance as a lump sum into a volatile but positive-drift index, and I keep insisting dollar-cost averaging over a year is fine too, even though the standard argument says spreading it out sacrifices expected value for no reason. And my tentative principle, which I suspect is close to Kelly but not quite: something like "across repeated opportunities you're required to keep your bankroll's growth rate near its maximum, but for one-shot decisions with no repetition, both taking and declining favorable gambles can be rational depending on the size of the stake relative to your total wealth." Does that actually deliver all my verdicts, including the B/F pair and the dollar-cost-averaging one? Which of my verdicts, if any, does your best principle have to overturn, and does the entertainment-gambling case force the principle to care about something other than wealth growth?

