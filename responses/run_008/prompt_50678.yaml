answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Dr. Aris Thorne (Frequentist/Error-Statistical) and Dr. Elena Vance (Bayesian) are sitting across from each other with coffee. The early-career researcher (you) is listening.*

  **Dr. Thorne:** Let's not mince words. The original finding cannot stand as a valid rejection of the null. You peeked at the data every 20 participants. That is a sequential design, but you analyzed it as a fixed design. The sampling distribution under the null hypothesis is completely different when you allow yourself to stop early. That $p = 0.03$ is actually much higher—likely above 0.10 or 0.15 once you account for the multiple looks. The replication didn't just fail to find the effect; it corrected the error probability you inadvertently inflated.

  **Dr. Vance:** I understand the frequentist machinery, Aris, but you're conflating the *procedure* with the *evidence*. According to the Likelihood Principle, which I know you reject but cannot simply wish away, the evidence about the parameter is contained entirely in the likelihood function of the observed data. The fact that the researcher *might* have continued collecting data had the results been different is a counterfactual. It's a mental state. Why should the physical evidence in the 120 data points change based on a decision rule that wasn't triggered? The data say what they say.

  **Dr. Thorne:** The data don't "say" anything on their own, Elena; they are interpreted within a model of how they were generated. If I hand you a sequence of coin flips, you cannot assess whether it's surprising without knowing the rules of the game. Did they stop because they ran out of money, or because they finally got ten heads in a row? If it's the latter, the sequence is weak evidence of a biased coin. My concern isn't just mathematical purity; it's about severity. A hypothesis hasn't been severely tested if the method used would frequently produce such "significant" data even if the hypothesis were false. The stopping rule determines that frequency.

  **Dr. Vance:** But whose frequency? You're conditioning on the long-run behavior of an experimental protocol, including all the possible datasets that *could* have been observed but weren't. I'm conditioning on the data we *actually* have. If I update my prior beliefs with the original data, and then update again with the replication data, I get a posterior distribution. That posterior reflects my rational degree of belief given the total evidence. Your approach asks me to ignore the original data's contribution to the likelihood because of a procedural sin. That throws away information.

  **Dr. Thorne:** It's not a "sin," it's error control. And regarding your posterior: whose prior are we using? If your conclusion depends on the prior, and I don't share your prior, then your "evidence" isn't public. It's subjective. Science requires a common standard of proof that doesn't depend on the analyst's internal state any more than it depends on their stopping rule. The multi-lab replication used a fixed $N$ precisely to restore that public standard. The failure to replicate suggests the original effect was likely noise amplified by optional stopping. You can't Bayesian your way out of a Type I error.

  **Dr. Vance:** And you can't frequentist your way out of the fact that the null hypothesis is almost certainly false in psychology to begin with. But look deeper at your "public standard." You claim objectivity because you control error rates over hypothetical repetitions. But we will never run those repetitions. We have *this* study and *that* replication. By focusing on the long-run properties of the method, you ignore the specific evidential weight of the current data. If the original effect size was modest and the replication was noisy, a Bayesian meta-analytic approach might show the effect is smaller than originally thought, but not zero. Your binary "reject/fail to reject" based on a tainted $p$-value forces a cliff-edge conclusion that the data don't support.

  **Dr. Thorne:** The cliff-edge is there because we need to make decisions about what to publish and what to build on. If we allow stopping rules to be ignored, we invite $p$-hacking. We've seen the crisis. The replication failure is the immune system of science working. My advice to our colleague is clear: acknowledge that the original $p$-value is uninterpretable due to the design. The replication is the only valid test we have.

  **Dr. Vance:** And my advice is to stop treating the original study as trash. It's data. Combine them. Report the joint posterior. Acknowledge the uncertainty. If the posterior mass still leans toward an effect, even a small one, that is the honest summary of our current knowledge. Telling them to discard the original study is dogmatic, not scientific.

  **Dr. Thorne:** It's not dogma; it's integrity. You can't claim a test was severe when it wasn't.

  **Dr. Vance:** And you can't claim evidence is irrelevant when it exists. We're left with a choice between controlling errors in a hypothetical world or quantifying uncertainty in this one.

  **Dr. Thorne:** *(Sighs)* It seems we aren't leaving this lounge with a unified front.

  **Dr. Vance:** No. But at least the disagreement is honest.

  ***

