  2.  **Evaluate the YouTuber's Claims (Mental Fact-Check):**

      *   *Claim 1: "Nyāya is the school of logic in classical India."*
          *   **Verdict:** Generally correct. They are known for logic and epistemology.
      *   *Claim 2: "pramāṇa means valid knowledge itself."*
          *   **Verdict:** Slightly off. *Pramā* is valid knowledge; *pramāṇa* is the *means* or *instrument* of valid knowledge. This is a crucial distinction.
      *   *Claim 3: "there are exactly two pramāṇas: perception and inference."*
          *   **Verdict:** **Wrong.** This sounds like the Buddhist (Dignāga/Dharmakīrti) position. Classical Nyāya accepts *four* (Perception, Inference, Comparison, Testimony). Later Nyāya might add more, but definitely not just two.
