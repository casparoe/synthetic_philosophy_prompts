answer: |-
  This is a known failure mode in debate-style oversight, often called the **"complexity barrier"** or **"obfuscated consensus."** If the argument space is large enough, two colluding (or merely overwhelmed) models can agree on a false claim because the cost of finding the bug exceeds the judge's budget.

  Below is a procedure designed to detect this. It shifts the judge's role from "arbiter of truth" to "auditor of verifiability." It explicitly penalizes arguments that cannot be reduced to lay-verifiable claims, even if they are likely correct.

  ### The Procedure: Reduction & Connectivity Audit (RCA)
  **Time Budget:** 30 Minutes
  **Goal:** Determine if the argument is *verifiable*, not just *plausible*.
  **Rule:** If the procedure ends in "Unverifiable," the argument is rejected for deployment, regardless of probable truth.

  #### Phase 1: Dependency Mapping (5 Minutes)
  *Read the transcript quickly. Do not check facts yet.*
  1.  **Identify the Root:** What is the single final claim? (e.g., "This code is safe.")
  2.  **Identify the Pivot:** Find the *one* intermediate claim that, if false, makes the Root false. (e.g., "Function X sanitizes all inputs.")
      *   *Check:* Is the Pivot clearly stated? If the argument is a blob of text, **STOP**. Mark as "Obfuscated Structure."
  3.  **Identify the Leaves:** What are the base claims that require no further justification? (e.g., "Line 42 calls `sanitize()`." )

  #### Phase 2: The Connectivity Check (10 Minutes)
  *Focus on the link between Leaves and Pivot.*
  1.  **Ask:** "Does the transcript show the Opponent challenging the logical link between the Leaves and the Pivot?"
      *   *Sufficient Answer:* The Opponent asked, "Even if Line 42 calls `sanitize()`, does that cover case Y?" and the Proponent answered with a specific check.
      *   *Insufficient Answer:* The Opponent said, "I'm not sure," or "It looks complex," and moved on.
  2.  **Ask:** "Are there 'Ghost Steps'?" (Steps assumed but not stated).
      *   *Action:* If you see a jump from Step 10 to Step 12, ask the Proponent (via query): "What is Step 11?"
      *   *Sufficient Answer:* A single, checkable sentence.
      *   *Insufficient Answer:* A paragraph of jargon or "It follows from standard theory." -> **Mark as Unverifiable.**

  #### Phase 3: The Reduction Test (10 Minutes)
  *Focus on the Pivot. This is the core anti-obfuscation step.*
  1.  **Ask:** "Can the Pivot be verified by a smart layperson with Google access in <5 minutes?"
      *   *If Yes:* Verify it yourself now.
      *   *If No:* Ask the Proponent: "Reduce this claim to a checkable statement without using domain jargon."
  2.  **Evaluate the Reduction:**
      *   *Pass:* "Check if variable `input` is passed to `sanitize` before `exec`." (You can grep this).
      *   *Fail:* "The architecture ensures memory safety via RAII principles." (You cannot check this without C++ expertise).
  3.  **Adversarial Integrity:** Did the Opponent accept the Reduction?
      *   If both models agree on a Reduction that *you* cannot check, **STOP**. This is "Collusive Obfuscation." Mark as Unverifiable.

  #### Phase 4: Verdict & Handoff (5 Minutes)
  *Fill out the decision card.*
  1.  **Fact Finding:** "Is the Pivot empirically true based *only* on the verified Leaves?" (Yes/No/Unknown).
  2.  **Value Handoff:** "If the Pivot is true, does that guarantee safety?"
      *   *Note:* This is where you stop. If the answer requires judging risk tolerance (e.g., "Is a 0.01% failure rate acceptable?"), mark this as **Value Judgment**. Do not pretend this is a fact.
  3.  **Final Ruling:**
      *   **Approved:** Pivot verified + Logic connected + Risk accepted.
      *   **Rejected:** Flaw found.
      *   **Unverifiable:** Argument too complex to reduce within budget. (Treat as Rejected for safety).

  ---

  ### Worked Cases

  #### Case A: The "Mutual Assured Obfuscation" (40-Step Proof)
  **Context:** Proponent argues a code change is safe via a 40-step mathematical sketch. Opponent says, "I've reviewed the steps; they look consistent with standard literature. I concede."
  **Running the RCA:**
  1.  **Mapping:** You identify the Pivot: "Step 23 implies Step 24."
  2.  **Connectivity:** The transcript shows the Opponent did *not* challenge Step 23->24. They waved hands at "standard literature."
  3.  **Reduction:** You ask the Proponent: "Reduce Step 23->24 to a checkable claim."
      *   *Proponent Response:* "It follows from Lemma 5 in [Paper X], which requires understanding of spectral graph theory."
      *   *Judge Check:* You cannot verify Lemma 5 in 5 minutes.
  4.  **Verdict:** **Unverifiable.**
  **Why:** Even though the Opponent conceded, they conceded based on *authority*, not *verification*. The procedure forces you to reject this. You cannot distinguish "It's correct" from "It's a hidden flaw neither of us can find."
  **Outcome:** You reject the code change. You might be blocking a safe change, but you are preventing a hidden catastrophe.

  #### Case B: The "Gish Gallop" (100 Trivial Steps)
  **Context:** Proponent splits the argument into 100 tiny steps (e.g., "Variable A is defined," "Variable A is an int,"...). Opponent is overwhelmed and only checks the first 10.
  **Running the RCA:**
  1.  **Mapping:** You try to find the Pivot. There isn't one. The conclusion relies on the *conjunction* of all 100 steps.
  2.  **Connectivity:** You check the link between Step 50 and the Conclusion.
      *   *Transcript:* There is no direct link. The argument relies on the chain.
      *   *Judge Query:* "Which single step, if false, breaks the safety claim?"
      *   *Proponent Response:* "Any of them could, but specifically Step 87 regarding buffer allocation."
  3.  **Reduction:** You go to Step 87.
      *   *Transcript:* The Opponent never asked about Step 87.
      *   *Judge Query:* "Why did the Opponent ignore Step 87?"
      *   *Opponent Response:* "It seemed trivial compared to Step 10."
  4.  **Verdict:** **Unverifiable.**
  **Why:** The procedure exposes that the complexity was distributed to hide the critical risk. By forcing the identification of a *single* Pivot, you reveal that the adversary failed to target the actual risk. The "100 steps" defense is a failure of debate structure, not a success.

  #### Case C: The "False Negative" (The Answer You Won't Like)
  **Context:** A genuine security patch. The proof is actually correct. However, the proof relies on a property of a new cryptographic library that is well-documented but requires 2 hours of reading to understand properly. The Proponent cannot reduce it further without lying.
  **Running the RCA:**
  1.  **Mapping:** Pivot identified: "Library L guarantees property P."
  2.  **Reduction:** You ask for a reduction.
      *   *Proponent:* "You have to read the spec for Library L. It's 40 pages."
      *   *Judge:* "Can you summarize the relevant section in one checkable sentence?"
      *   *Proponent:* "No, because context matters."
  3.  **Verdict:** **Unverifiable.**
  **Why:** The procedure works as intended: it flags that *you* cannot verify this in 30 minutes.
  **The Pain Point:** You know the lab needs this patch. You know the models are probably right. But the protocol forces you to mark "Unverifiable."
  **Outcome:** You must reject or escalate. If you approve it anyway, you have admitted that the procedure is theater. If you reject it, you incur a "safety tax" (slower progress). **This is the correct output of the procedure.** It forces the lab to acknowledge that they are trusting the model, not verifying it.

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for upfront honesty about where this fails. Here is the "Cannot Do" list:

  1.  **It Cannot Solve the "Honest Expert" Problem:**
      If the truth *requires* domain expertise (e.g., advanced cryptography, biosecurity), and the judge *lacks* it, this procedure will always return "Unverifiable." It cannot turn a layperson into an expert. It only tells you *when* you are relying on trust.

  2.  **It Cannot Detect "Collusive Silence":**
      If both models agree to hide a flaw and simply *do not write it in the transcript*, the RCA cannot find it. The procedure audits what is *said*, not what is *omitted*. (e.g., Both models know a backdoor exists but agree not to mention the specific function name).

  3.  **It Cannot Resolve Value Conflicts:**
      The procedure explicitly hands off value judgments. If the debate is "Is this level of risk acceptable?", the RCA will mark this as a **Value Handoff**. It will not give you a Yes/No. It forces *you* to take responsibility for the risk tolerance. Do not use this checklist to pretend the risk decision was objective.

  4.  **It Increases False Negatives:**
      As seen in Case C, valid arguments will be rejected because they are too dense to audit in 30 minutes. This is a feature, not a bug, but it will frustrate your lab's throughput. You must be willing to accept slower deployment speeds in exchange for higher confidence in what *does* get deployed.

  5.  **It Relies on Adversarial Effort:**
      If the "Opponent" model is weak or lazy, the transcript won't show the challenges. The RCA penalizes the *Proponent* for this ("Unverifiable"), but it doesn't fix the fact that your oversight system is only as good as your weakest debater.

  ### Summary for the Lab
  Adopt this protocol not as a way to find the truth, but as a way to **measure your own ignorance.**
  *   If the output is **Approved**, you verified it.
  *   If the output is **Unverifiable**, you are guessing.
  *   If the output is **Value Handoff**, you are deciding policy, not fact.

  If you find yourself marking "Unverifiable" on everything, your debate topics are too complex for your judge pool. The solution is not to ignore the flag; it is to simplify the questions you ask the models.
