      *   *Claim 2: Stock market is a casino / Beauty Contest.*
          *   *Analysis:* The "Beauty Contest" analogy is real (Chapter 12 of *The General Theory*). He did criticize speculative markets. However, he distinguished between "enterprise" (long-term forecast) and "speculation" (short-term market psychology).
          *   *Verdict:* Mostly Accurate, but needs nuance regarding "enterprise" vs. "speculation."

      *   *Claim 3: Keynes made his fortune trading.*
