answer: |-
  Your skepticism is well-founded. Your coworker has given you the "elevator pitch" version of Keynesian thought: it captures the *spirit* of the ideas but gets the *mechanics* and the *biography* wrong in ways that create the exact contradictions you're noticing.

  The story you heard is a mix of genuine scholarship, oversimplification, and academic folklore. Here is a piece-by-piece breakdown of what a scholar of Keynes would accept, what is a simplification, and what is simply wrong.

  ### 1. The Claim: "Probability only works for dice; real life has NO probability."
  **Verdict: Simplification / Partial Truth**

  *   **What's Right:** Keynes did argue that numerical probability applies only to "closed systems" (like dice or insurance tables) where you have a known sample space and repeatable events. He called this **Risk**.
  *   **What's Wrong:** He did *not* say there is "no probability" for real-world events. He argued that for unique events (like a war or a new invention), probability is **non-numerical**.
  *   **The Nuance:** In his *A Treatise on Probability* (1921), Keynes argued that probability is a "logical relation" between evidence and a hypothesis. You can rationally believe one outcome is more likely than another without being able to assign a number (like 20% or 50%) to it.
  *   **Addressing your "Flood vs. Nuclear War" point:** You are right to bug out here. Keynes would agree with you. He explicitly distinguished between events where we have statistical history (floods, mortality) and events where we have no basis for calculation (European war, copper price in 20 years). He called the latter **Uncertainty** (specifically "Radical Uncertainty"). It's not that you can't make a judgment; it's that you can't calculate an *expected value*.

  ### 2. The Claim: "The Stock Market is a Casino / Beauty Contest."
  **Verdict: Mostly Accurate, but Missing the Solution**

  *   **What's Right:** In Chapter 12 of *The General Theory of Employment, Interest and Money* (1936), Keynes famously compares the stock market to a newspaper beauty contest where you don't pick the prettiest face, but the face *you think other people will think is prettiest*. He argued that when the future is uncertain, professional investment becomes a game of mass psychology rather than asset valuation.
  *   **The Contradiction (Your Trading Point):** You noticed the hole: If markets are casinos, how did Keynes get rich managing the King's College Chest fund?
  *   **The Resolution:** Keynes distinguished between **Speculation** (the beauty contest activity) and **Enterprise** (forecasting the prospective yield of assets over their whole life).
      *   Early in his career, Keynes was a speculator (trying to time the market). He lost a fortune in the 1929 crash.
      *   Later, he changed his strategy. He adopted what we now call **value investing**. He bought a few companies he understood, held them for the long term, and ignored market fluctuations.
      *   So, he didn't think the market *had* to be a casino; he thought it *tended* to become one because of human nature. He made his fortune by refusing to play the casino game and focusing on "Enterprise."

  ### 3. The Claim: "Frank Ramsey demolished the theory; Keynes gave up and switched to economics."
  **Verdict: Dramatized / Mostly Wrong**

  *   **The Story:** Frank Ramsey, a brilliant mathematician/philosopher, reviewed Keynes's *Treatise* in 1922. He criticized Keynes's idea that probability is an objective "logical relation." Ramsey argued probability is subjective (a degree of belief).
  *   **What Scholars Say:** Keynes respected Ramsey immensely (Ramsey died tragically young at 26, and Keynes wrote a heartbreaking obituary for him). Keynes admitted Ramsey's criticisms were valid and adjusted his views to incorporate Ramsey's subjective approach.
  *   **The "Switch" Myth:** Keynes did not abandon probability to "switch" to economics. He was working on economics *while* writing the *Treatise*. (He published *Indian Currency and Finance* in 1913 and *The Economic Consequences of the Peace* in 1919).
  *   **The Real Connection:** He didn't leave probability behind; he **applied** it. The *Treatise* is the philosophical foundation for his later economics. You cannot understand Keynes's *General Theory* without understanding his theory of Uncertainty from the *Treatise*. The "switch" wasn't a retreat; it was an evolution.

  ### 4. The Claim: "The Probability Book and Economics are One System."
  **Verdict: Scholarly Consensus (True)**

  *   This is the strongest part of your coworker's story. For a long time, economists treated Keynes's probability work as a side hobby. Since the 1980s (led by scholars like G.L.S. Shackle and later Paul Davidson), the consensus is that **Keynes's economics is built on his probability theory.**
  *   The core argument of the *General Theory* is that because the future is uncertain (in the *Treatise* sense), investors can't calculate future returns. When they can't calculate returns, they rely on "animal spirits" (confidence/convention). When confidence drops, investment collapses, causing unemployment.
  *   So, yes: The *Treatise* explains *why* the economy behaves the way it does in the *General Theory*.

  ### Summary: How much of the story checks out?

  | Claim | Verdict | Scholar's Correction |
  | :--- | :--- | :--- |
  | **Probability only works for dice.** | **Simplification** | It works for repeatable events (Risk). For unique events, probability is rational but non-numerical (Uncertainty). |
  | **There is NO probability for real events.** | **Wrong** | There is rational belief, just not calculable odds. Your "flood vs. war" intuition is correct; Keynes agreed they are different categories. |
  | **Market is a Beauty Contest.** | **True** | This is a direct quote from Chapter 12 of *The General Theory*. |
  | **Keynes made a fortune trading.** | **True** | But he did it by switching from "speculation" (guessing psychology) to "enterprise" (long-term value), effectively proving his own point about how to survive uncertainty. |
  | **Ramsey demolished the theory.** | **Exaggerated** | Ramsey critiqued it; Keynes accepted the critique and refined his views. It was a collaboration of minds, not a knockout punch. |
  | **Keynes quit probability for economics.** | **Wrong** | He used probability theory to *solve* economic problems. The two books are two halves of the same whole. |

  ### The Bottom Line
  Your coworker gave you a "mythologized" version. The myth is that Keynes proved the future is unknowable, got debunked by Ramsey, and then went to describe the chaos of the market.

  The reality is more sophisticated: Keynes argued that because the future is **uncertain** (not just risky), rational calculation breaks down. This causes markets to rely on convention and psychology. Ramsey helped him refine the math of belief, but Keynes never abandoned the core insight. He made his money not by predicting the unpredictable, but by identifying when the market's "guessing game" had divorced itself from the underlying value of assets.

  You were right to feel that "flood vs. nuclear war" distinction was being glossed over. That distinction is actually the entire engine of Keynesian economics.
