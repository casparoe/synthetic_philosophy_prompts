      *   *Correction:* Be careful not to say MCTS is *learning*. It's search. Dennett's Popperian creature *learns* by letting hypotheses die internally. MCTS discards branches, it doesn't update weights. So, is it truly Popperian?
      *   *Nuance:* Dennett defines Popperian as having an "inner environment" to test selectors. MCTS creates a temporary inner environment for *that move*. So yes, functionally Popperian at the move level, but not at the agent level (no weight update).
