      *   The Breakage (Time and Compilation).
      *   Narrative Takeaway.

  *(Self-Correction Note)*: Wait, I need to be precise about "Gregorian." Dennett defines it as using *tools* of thought (language, memes). AlphaGo training on human games is technically importing "cultural artifacts" (game records). So the *training* is Gregorian. But the *result* is weights. So it's Gregorian input -> Darwinian output. That's a key distinction.

