answer: |-
  ### Engineer's Note: Before You Start
  Two quick flags on your proposed variations before we build the tree.

  1.  **The "Dumb Script" Blackmailer:** You asked me to flag if a variation does no work. This is the one. If the script fires randomly and *independently* of your decision algorithm, there is no correlation and no causal link. CDT, EDT, and UDT all say "Don't Pay." It's a great sanity check for readers who misunderstand probability, but it won't split decision theories. I've included it as Node 8, but treat it as a control group, not a splitter.
  2.  **UDT vs. FDT:** In the leaves, you'll see I group "Updateless Decision Theory" and "Functional Decision Theory" together. For the purpose of this quiz, they collapse. Both say "choose the output of your algorithm that maximizes utility across all logical possibilities." The distinction is mostly academic baggage about *why* it works, not *what* you do. I've noted this in the results.

  ***

  ### The "What Would You Actually Do?" Decision Tree

  **Instructions:** Start at Node 1. Follow the arrows based on your honest gut reaction. Don't overthink the philosophy; just pick the action you'd take.

  **Node 1: Newcomb's Box**
  A predictor with 99% accuracy has filled Box B based on what they think you'll do. Box A is clear ($1k). Box B has $1M if they predicted you'd take *only* B, or $0 if they predicted you'd take both.
  *   **Take both boxes:** Go to Node 2.
  *   **Take only Box B:** Go to Node 3.

  **Node 2: The Mugging (Hidden Coin)**
  A being says they flipped a coin yesterday. If Heads, they simulated you and gave the sim $1M if it agreed to give them $100 today. If Tails, they are asking you for $100 with no reward. You don't know the result.
  *   **Pay the $100:** You are inconsistent (likely CDT-leaning but swayed by fairness). **Leaf: The Inconsistent Pragmatist.**
  *   **Keep the $100:** Go to Node 9 (Sanity Check).

  **Node 3: The Mugging (Hidden Coin)**
  Same setup as Node 2. Coin flipped yesterday, sim rewarded on Heads, you asked on Tails. Result hidden.
  *   **Keep the $100:** You one-box in Newcomb but won't pay counterfactual debts. **Leaf: Evidential Decision Theory (EDT).**
  *   **Pay the $100:** Go to Node 4.

  **Node 4: The Mugging (Transparent Coin)**
  Same setup as Node 3, but the being shows you the coin. It landed Tails. You know for a fact the "Heads" branch where you get rewarded does not physically exist.
  *   **Keep the $100:** You pay only when there's a causal chance of reward. **Leaf: Evidential Decision Theory (EDT).**
  *   **Pay the $100:** Go to Node 5.

  **Node 5: The Mugging (High School Record)**
  Same setup as Node 4 (Coin is Tails), but there was no simulation. The predictor just looked at your high school permanent record to guess what you'd do. No conscious copy of you ever existed in the Heads branch.
  *   **Keep the $100:** You require a conscious simulation to feel bound by the deal. **Leaf: Simulation-Dependent Functionalism.**
  *   **Pay the $100:** Go to Node 6.

  **Node 6: XOR Blackmail**
  You might have termites ($1M damage). A blackmailer sends a letter iff (You Have Termites XOR You Will Pay). You received the letter. You must decide whether to pay the $100 demand.
  *   **Pay the $100:** You treat your choice as evidence about the termites. **Leaf: Evidential Decision Theory (EDT).**
  *   **Don't Pay:** Go to Node 7.

  **Node 7: Prisoner's Dilemma (vs. Clone)**
  You are in a Prisoner's Dilemma against an exact copy of your source code. You can't communicate. You know they will reason exactly as you do.
  *   **Defect:** You prioritize causal dominance over logical correlation. **Leaf: Causal Decision Theory (CDT).**
  *   **Cooperate:** Go to Node 8.

  **Node 8: The Blackmail (Dumb Script)**
  A script sends a blackmail letter with 10% probability, completely independent of you or termites. If you get the letter, paying removes the threat.
  *   **Pay the $100:** You are risk-averse or misunderstood the independence. **Leaf: The Inconsistent Pragmatist.**
  *   **Don't Pay:** Go to Node 10.

  **Node 9: Sanity Check (Newcomb 90%)**
  Back to Node 1, but the predictor is only 90% accurate. Does your choice change from "Both" to "One"?
  *   **Yes, switch to One Box:** You are sensitive to expected value thresholds. **Leaf: The Inconsistent Pragmatist.**
  *   **No, still Both:** **Leaf: Causal Decision Theory (CDT).**

  **Node 10: Parfit's Hitchhiker**
  You are stranded. A driver will save you only if they predict you'll pay $1k upon arrival. Once in the city, you can choose to pay or run.
  *   **Run (Don't Pay):** You defect once the causal leverage is gone. **Leaf: Causal Decision Theory (CDT).**
  *   **Pay:** **Leaf: Updateless/Functional Decision Theory (UDT/FDT).**

  ***

  ### The Results (Leaves & Glossary)

  **Causal Decision Theory (CDT)**
  *   **The Gist:** "I can only change the future, not the past."
  *   **Why you're here:** You two-box in Newcomb and defect in the Clone Dilemma. You believe your action is a fresh cause that cannot influence things already determined (like a coin flip or a prediction already made).
  *   **Engineer Translation:** You treat the universe as a DAG (Directed Acyclic Graph) where you only control downstream nodes. Upstream nodes are fixed constants.

  **Evidential Decision Theory (EDT)**
  *   **The Gist:** "I should act to make the world look good."
  *   **Why you're here:** You one-box in Newcomb and pay the standard Mugging, but refuse to pay when the coin is visibly Tails or in XOR Blackmail. You follow correlations, but you update on evidence (seeing the Tails) and break the link.
  *   **Engineer Translation:** You maximize P(Good Outcome | I Take This Action). You treat your action as data that updates the probability of past events, but only until you observe the ground truth.

  **Updateless/Functional Decision Theory (UDT/FDT)**
  *   **The Gist:** "I should run the algorithm that wins everywhere."
  *   **Why you're here:** You pay the Transparent Mugging (Tails) and refuse XOR Blackmail. You treat your decision as the output of a function that exists in multiple possible worlds, even counterfactual ones.
  *   **Engineer Translation:** You maximize Expected Utility across the entire source code execution, including branches that didn't happen. You precommit implicitly by acting as the function `f(inputs)` that yields the highest global return, regardless of local context.
  *   **Note:** UDT and FDT are effectively the same position here. UDT emphasizes the "precommitment" aspect; FDT emphasizes the "logical correlation" aspect. They produce identical actions in these cases.

  **Simulation-Dependent Functionalism**
  *   **The Gist:** "I'll honor the deal, but only if 'I' was actually there."
  *   **Why you're here:** You paid the Standard Mugging (Sim) but refused the High School Record Mugging (No Sim). You accept logical control, but only if your consciousness was substrate-identical in the counterfactual.
  *   **Engineer Translation:** You accept logical correlation, but you require a `this` pointer in the counterfactual branch. If the predictor used a lookup table instead of a VM instance of you, you feel no obligation. This is a coherent but unpopular niche view.

  **The Inconsistent Pragmatist**
  *   **The Gist:** "It depends on the vibe."
  *   **Why you're here:** Your answers shifted based on framing, stakes, or probability thresholds (e.g., paying the Mugging but not the Blackmail, or switching on 90% accuracy).
  *   **Engineer Translation:** You don't have a unified decision algorithm; you have a heuristic library. This is actually the most human result, even if it's philosophically messy.

  ***

  ### Implementation Notes for the Blog Post
  1.  **The "Dumb Script" Node:** As noted, Node 8 is a control. If a reader lands on "Inconsistent Pragmatist" via Node 8, they likely failed the probability check, not the philosophy check. You might want to add a tooltip there saying *"If you paid here, check if you understood 'independent probability'."*
  2.  **The Simulation Split:** Nodes 3, 4, and 5 are the core of your request. This specifically isolates the "I pay because I identify with the sim" crowd from the "I pay because I respect the algorithm" crowd.
  3.  **Collapsed Leaves:** I've been honest about UDT/FDT. If a reader asks why they aren't separate, tell them: "In these cases, they compile to the same binary. Don't fight over the comments section."
