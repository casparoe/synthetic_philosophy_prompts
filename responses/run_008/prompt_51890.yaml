  - Russia 1917 he splits in two: February was coming anyway (the war, bread, mass desertion), but October hinged on Lenin personally — he's very firm that no Lenin means no Bolshevik government at all, not just a later or milder one.
  - The Reformation: hinged on Luther. He says without Luther the indulgence controversy stays a local German scandal and reform stays Erasmus-shaped, inside the Church — this even though he'll also tell you the printing press itself was coming anyway, which never stops bugging me.

