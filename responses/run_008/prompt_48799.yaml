answer: |-
  This is a classic crux in the history of logic, and your intuition that there is a modal scope issue at play is correct. However, to give you the definitive commitment you need for your paper, I am going to argue for a specific, robust reading that avoids the common hedge of "Aristotle is ambiguous here."

  Here is my committed position: **Aristotle presents this passage as a *reductio ad absurdum* of the unrestricted Principle of Bivalence (PB) when applied to future contingents.** He does not endorse the reasoning in the paragraph; he is channeling the Fatalist. Crucially, regarding your third question, Aristotle's solution targets the **inference from truth to necessity** (the modal step), not merely the premise of Bivalence itself. He identifies that the Fatalist conflates *simple necessity* with the *necessity of the actual*. However, because he believes this conflation is inevitable if we grant that future contingents already possess a determinate truth value, his metaphysical solution is to **restrict Bivalence** for future singular propositions.

  In short: Aristotle diagnoses a modal scope fallacy (the slide from "necessarily (if true, then actual)" to "if true, then necessarily actual"), but he solves it by denying that future contingents are "true" in the requisite sense to trigger the fallacy.

  Let's walk through the text to justify this reading.

  ### 1. The Premise: Bivalence or Truth-Value Link?
  *Passage:* "Again, if a thing is white now, it was true before to say that it would be white..."

  You ask whether this is Bivalence or a weaker Truth-Value Link (TVL). My reading is that Aristotle is using the **Truth-Value Link as the engine to drive the Bivalence assumption.**

  Strictly speaking, the sentence itself states a link: Present Fact ($P$ now) $\rightarrow$ Past Truth ("$P$ will be" was true). This looks weak. It doesn't explicitly say that *before* the event, the proposition was *already* true or false regardless of the outcome. However, in the context of Chapter 9, this link is being wielded by the Fatalist to support unrestricted Bivalence.

  If you accept the TVL universally, combined with the assumption that the past is fixed (which Aristotle grants), you generate the fatalist result. Aristotle's point here is dialectical: he is granting the Fatalist their strongest intuition. The Fatalist argues: "Look, now that it *is* white, surely it was *true* to say it would be. If it was true, it couldn't have been otherwise."

  **Commitment:** Do not treat this merely as a TVL premise. Treat it as the Fatalist's argument for why Bivalence *must* apply to the past, and by extension (via the "always" clause), to the future. Aristotle accepts the link *if* the event has happened, but he will later deny that the link grants *necessity* to the event. The fallacy charge lands because the Fatalist uses this link to argue that the truth value existed *prior* to the event in a way that fixes the event.

  ### 2. The Work of "Always" (*aei*)
  *Passage:* "...so that of anything that has taken place it was **always** true to say 'it is' or 'it will be'."

  You suspect this might be rhetorical amplification. It is not. It is doing **modal heavy lifting**.

  If the proposition were only true *yesterday*, the Fatalist's claim is weaker. One could argue, "It became true yesterday when the causal chain was set in motion, but before that, it was indeterminate." By inserting "always" (*aei*), the Fatalist (and Aristotle, ventriloquizing him) claims that the truth of the proposition is an **eternal property**.

  In Aristotelian metaphysics, if something is *always* true, it shares a characteristic with necessary truths (which are eternally true). The "always" is designed to bridge the gap between *temporal truth* and *modal necessity*. It blocks the escape route of saying, "It was true, but only contingently." The Fatalist is arguing: "If it was *always* true, there was never a time when it could have been false."

  **Commitment:** The "always" is essential. It transforms a temporal claim into a modal one. It asserts that the truth of the prediction is not contingent on the moment of utterance but is fixed across all past time. This makes the subsequent slide into necessity seem plausible.

  ### 3. The Core Issue: Endorsement, Reductio, and the Target
  *Passage:* "But if it was always true to say that a thing is or will be, it is not possible that it should not be... All, then, that is about to be must of necessity take place."

  This is the crux of your paper. Does Aristotle endorse this? **No.** This paragraph is the *reductio*. Aristotle's goal in Chapter 9 is to save contingency (*to endechomenon*). Since he believes contingency exists, and this argument proves contingency does not exist, he must reject a premise or an inference in this argument.

  **Which step does he target?**
  There are two main camps in the literature:
  1.  **The Bivalence Restriction View:** Aristotle rejects the premise that future contingents are already true or false.
  2.  **The Modal Fallacy View:** Aristotle accepts they are true/false but rejects the inference from True $\rightarrow$ Necessary.

  **My Committed Reading:** Aristotle targets the **inference from truth to necessity**, but he recognizes that maintaining this distinction *requires* restricting Bivalence for future contingents.

  Here is the defense of this position:
  Later in the chapter (19a23–27), Aristotle makes a distinction that is the ancient equivalent of spotting the scope fallacy. He distinguishes between:
  *   (A) "It is necessary that (it is)" — *Necessity of the Consequent* (False for contingents).
  *   (B) "(It is) necessarily" — *Necessity of the Actual* (True for everything that is actually happening).

  He writes: *"Everything that is, must necessarily be when it is."* This is the key. Aristotle grants that if $P$ is happening, it is impossible for $P$ not to be happening *right now*. But he denies that $P$'s happening is necessary *simpliciter*.

  **Why this matters for your thesis:**
  Aristotle sees that the Fatalist's argument in your passage relies on sliding from (B) to (A).
  *   Fatalist: "It was true it would be white." $\rightarrow$ "It is white." $\rightarrow$ "It is necessary that it is white (when it is)." $\rightarrow$ "It is necessary that it will be white (before it is)."
  *   Aristotle's Block: You can move from Truth to Actuality. You can move from Actuality to "Necessity of the Actual." You **cannot** move from "Necessity of the Actual" to "Simple Necessity."

  **However**, Aristotle realizes that if we say a future proposition is *already* "True" in the same sense that a past proposition is "True," the Fatalist's inference becomes hard to block. If "It will be white" is *already* true now, then the "Necessity of the Actual" seems to apply to the *truth* itself, which then transfers to the *event*.

  Therefore, to protect the modal distinction (and thus save contingency), Aristotle **restricts Bivalence**. He argues that for future contingents, it is *not* the case that one of the contradictories is already true. They are *potentially* true, but not *actually* true yet.

  **Definite Answer to Q3:**
  Aristotle presents the paragraph as a **valid argument based on false/equivocal premises regarding modality**. He does not endorse the reasoning. His solution targets the **inference from truth to necessity** (specifically, the equivocation on "necessity"). He shows that "true" entails "will be," but not "necessarily will be." However, to make this logical block metaphysically stable, he **denies Bivalence** for future contingents.

  ### Implications for Your Paper
  You should frame your thesis as follows:
  Aristotle anticipates the modal scope fallacy (the confusion between the necessity of the consequence and the necessity of the consequent). He identifies that the Fatalist's error lies in assuming that because a proposition's truth is fixed (by the "always" clause), the event's occurrence is metaphysically necessary. Aristotle's solution is to distinguish between the necessity of actuality (when the event occurs) and simple necessity (prior to the event). However, he recognizes that this distinction is unsustainable if future propositions are granted determinate truth values *now*. Thus, his logical insight (the modal distinction) drives his semantic innovation (the restriction of Bivalence).

  **Why this is better than the alternatives:**
  *   If you argue he *only* restricts Bivalence without seeing the modal fallacy, you make him look like he's just stipulating a rule to save freedom.
  *   If you argue he *keeps* Bivalence and only blocks the inference (like Ockham later), you fight against the explicit text at 19a39 where he says "it is not necessary that one should be true and the other false."
  *   My reading synthesizes these: He sees the logical error (modal scope), and the restriction of Bivalence is the *price* he pays to ensure that logical error cannot be made.

  ### Summary of the "Dubious Inference"
  The specific slide occurs here:
  *"if it was always true to say that a thing is or will be, it is not possible that it should not be"*

  *   **Valid Reading:** If it is *necessarily* true, then it is not possible it should not be.
  *   **Fallacious Reading (The Fatalist's):** If it is *true* (even contingently true), then it is not possible it should not be.

  Aristotle's point is that the Fatalist treats "always true" as equivalent to "necessarily true." Aristotle counters that a proposition can be "always true" (in the sense that, once the event happens, it is eternally true that it happened) without the *event* being necessary. But to prevent the confusion, he denies the proposition is "true" *before* the event.

  **Final Advice for the Paper:**
  Don't let your seminar get stuck on whether Aristotle "has" modern modal logic. He doesn't. But he *does* have the philosophical insight that **truth does not entail necessity**. Your paper should argue that *De Interpretatione* 9 is not just a debate about truth-values, but a debate about the **modal force of truth**. Aristotle restricts the domain of truth (Bivalence) to protect the modal status of the world (Contingency).

  This reading commits you to:
  1.  **Reductio:** The passage is the opponent's view.
  2.  **Target:** The inference (Truth $\rightarrow$ Necessity), specifically the equivocation on "necessity."
  3.  **Cost:** Restricting Bivalence is the necessary consequence of blocking that inference.

  This gives you a strong, defensible thesis that respects both the logical structure and the textual outcome of the chapter.
