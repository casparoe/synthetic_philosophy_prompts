  In the philosophy of language, *"It rained, but I don't believe it did"* is standardly treated as **just as paradoxical** as *"It is raining, but I don't believe it."* The Moorean paradox arises from the first-person self-ascription of belief ($p \land \neg Bp$), regardless of tense.

