      *   *Refining the "Everyday Example" vs. "Black's Spheres":*
          *   User's idea: Envelopes/Cups.
          *   My advice: Use them *first*. They build the intuition that "if I can't tell them apart, they might as well be the same." Then Black's spheres come in to say, "Okay, but imagine a universe where there *literally* are no other differences." This creates the tension.
          *   Why not save Black for the end? Because the discussion *is* the spheres. The envelopes are just the warm-up.

      *   *Refining the Misconception Map:*
          *   First hurdle: "Same" vs. "One".
