  6.  **Writing the Response:** (Self-Correction during drafting: Ensure I don't sound like I'm teaching *them* philosophy, but teaching the *teacher* how to teach.) *Make sure to emphasize the distinction between Numerical and Qualitative identity early on, as that's the bedrock.* *Ensure the advice on the Engineer is diplomatic.*

  7.  **Final Polish:** Check the "Final Question" to ensure it actually tests the specific learning objective (Metaphysical vs. Epistemic). *Idea: Ask about the universe with only the two spheres. Does the principle hold there?*

