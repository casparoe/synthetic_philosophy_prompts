      {"step": 4, "verdict": "Indeterminate"},
      {"step": 5, "verdict": "Pass"}
    ],
    "cycles_since_genuine_progress": 1,
    "overall": "too-few-cycles",
    "rationale": "Empirical progress is lacking (Step 3), but the programme is within its protected infancy period (Step 5 Pass). Lakatosian methodology forbids falsification of a programme before it has had time to articulate its positive heuristic.",
    "unavoidable_judgment_points": [
      "Deciding if 'field too young' is a valid excuse or a protectionist strategy (Step 4)",
      "Determining if model revisions indicate healthy development or core instability (Step 2)"
    ],
    "recommendation": "renew-with-conditions",
    "confidence": "low"
  }
  ```

  **Mechanical vs. Deliberative Fields:**
  *   **Mechanical:** `cycles_since_genuine_progress`, `verdicts_by_step` (Step 5), `recommendation` (forced by Safeguard Rule).
  *   **Deliberative:** `verdicts_by_step` (Steps 1, 2, 4), `overall`, `rationale`, `unavoidable_judgment_points`, `confidence`. The panellist must judge whether the "substantial revisions" are signs of a healthy developing heuristic or a flailing core; the table identifies this as a judgment call but cannot resolve it. The recommendation is mechanically constrained by the Safeguard, but the *conditions* attached require human deliberation.
