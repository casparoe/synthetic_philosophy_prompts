    "rationale": "No risky predictions corroborated in over 10 years (3+ cycles). Unification without novel empirical content is classified as degenerating under MSRP. Safeguard threshold exceeded.",
    "unavoidable_judgment_points": [
      "Weighing the value of theoretical unification against the lack of empirical novelty (Step 3)",
      "Determining if the optimization principle is falsifiable or tautological (Step 1)"
    ],
    "recommendation": "do-not-renew",
    "confidence": "high"
  }
  ```

  **Mechanical vs. Deliberative Fields:**
  *   **Mechanical:** `cycles_since_genuine_progress`, `verdicts_by_step` (Step 3 & 5), `recommendation`.
  *   **Deliberative:** `overall`, `rationale`, `unavoidable_judgment_points`, `confidence`. The panellist must overcome their personal sympathy for "unification" to mark Step 3 as Degenerating; the procedure forces this classification, but the human must accept the philosophical premise that unification ≠ progress without prediction.

  ***

  ### Worked Application: Programme C (Cognitive Science)

  **Analysis:**
  *   **Step 1 (Core):** "Central model... substantially revised twice." The core appears unstable. Output: **Indeterminate** (Is it a core or a shifting belt?).
  *   **Step 2 (Belt):** "Substantially revised twice" in 5 years suggests the protective belt is absorbing shocks that should perhaps challenge the core, or the core itself is fluid. Output: **Indeterminate**.
  *   **Step 3 (Shift):** "Little empirical contact." No novel facts. Output: **Degenerating** (empirically).
  *   **Step 4 (Heuristic):** Leadership argues "field is too young." This is a claim about the Positive Heuristic (potential). Output: **Indeterminate**.
  *   **Step 5 (Safeguard):** Founded 5 years ago. This is roughly 1 to 2 cycles depending on alignment. Assuming 1 full review cycle has passed. Count = 1. Output: **Pass** (< 2 cycles).
  *   **Verdict:** Despite empirical lack, the Safeguard (Step 5) prohibits "Do Not Renew." Lakatos explicitly warns against killing programmes in their infancy. The instability of the model is concerning, but permissible for a young programme.
  *   **Recommendation:** Renew (perhaps with conditions to increase empirical contact).

