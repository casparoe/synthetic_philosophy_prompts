answer: |-
  ### The Lakatosian Renewal Procedure (LRP)

  **Instructions for Panellists:** Complete this table during your 90-minute review. Answer the questions based *only* on the dossier and the leadership interview. Do not rely on reputation or narrative flair. If a question cannot be answered from the provided materials, mark the Output as "Indeterminate."

  | Step | Question put to the dossier | What a sufficient answer looks like | Output (Select one) | Judgment Call (Yes/No; if Yes, specify) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Hard Core:** What specific theoretical commitments does the group explicitly refuse to abandon, even when faced with contradictory data? | A clear statement of 1–3 foundational assumptions (e.g., "Principle X holds universally," "Mechanism Y is the primary driver"). | **Identified** / **Indeterminate** | **Yes.** Distinguishing a genuine theoretical core from mere dogma or laziness requires interpreting the group's rhetorical defense of their assumptions. |
  | **2** | **The Protective Belt:** How were the three most significant anomalies of the last cycle handled? | Specific descriptions of adjustments made (e.g., "Added parameter Z," "Restricted domain to condition Q," "Reinterpreted data point R"). | **Ad Hoc** (parameters/exceptions added) / **Generative** (anomalies led to new distinct insights) / **Indeterminate** | **Yes.** Determining if an adjustment is "ad hoc" (saves the theory only) vs. "generative" (opens new tests) requires assessing the *heuristic value* of the change. |
  | **3** | **Problem Shift:** Did the programme predict a *novel* fact (unknown at the time of prediction) that was subsequently corroborated in this cycle? | Citation of a specific prediction made *before* the data was collected, and evidence of its confirmation. | **Progressive** (Novel fact confirmed) / **Degenerating** (No novel facts; only post-hoc accommodation) / **Indeterminate** | **No.** This is a factual check against publication dates and data collection logs. |
  | **4** | **Positive Heuristic:** Does the plan for the next cycle involve developing the theory's content, or merely applying the existing model to new cases? | A roadmap showing planned theoretical refinements or new mechanism discoveries, not just "testing on Species X, Y, Z." | **Developing** (New theory content) / **Applying** (More of the same) / **Indeterminate** | **Yes.** Assessing whether a plan is "theoretical development" vs. "puzzle solving" requires judging the intellectual substance of the proposal. |
  | **5** | **The Safeguard (Temporal Depth):** How many consecutive 3-year cycles have passed without a "Progressive" output in Step 3? | Count of cycles based on previous panel records. | **Pass** (< 2 cycles) / **Fail** (≥ 2 cycles) | **No.** This is an arithmetic count based on historical records. |

  **Decision Rule:**
  1.  If Step 5 is **Fail** (≥ 2 consecutive cycles of degeneration) AND Step 3 is **Degenerating**, the canonical recommendation is **Do Not Renew**.
  2.  If Step 5 is **Pass** (< 2 cycles), the recommendation **Cannot** be "Do Not Renew" regardless of other scores (Lakatosian Safeguard against premature falsification).
  3.  If Step 3 is **Progressive** but Step 2 is **Ad Hoc**, the recommendation is **Renew with Conditions** (demanding a resolution to the ad hoc adjustments).
  4.  If Step 1 or 4 is **Indeterminate**, the recommendation is **Defer** (request clarification).

  ***

  ### Worked Application: Programme A (Materials Modelling)

  **Analysis:**
  *   **Step 1 (Core):** The core is "first principles prediction of functional materials." This is identified.
  *   **Step 2 (Belt):** Anomalies are handled by "adding a fitting parameter or restricting the promised domain." This is the definition of an **Ad Hoc** protective belt.
  *   **Step 3 (Shift):** A bold prediction was confirmed. However, the dossier admits they "quietly redefined the target class... to exclude two cases that had misbehaved." In Lakatosian terms, a prediction is only progressive if it is not bought by shrinking the empirical basis. Because the success required excluding known counter-evidence, this is technically **Degenerating** (or at best, theoretically progressive but empirically degenerating). We will score it Degenerating to reflect the ad hoc exclusion.
  *   **Step 4 (Heuristic):** The prompt implies they continue to apply the method ("one more case" style) but the "bold prediction" suggests some heuristic life. However, given the ad hoc belt, we mark this **Indeterminate** or **Applying**. Let's mark **Applying** as the core method remains unchanged.
  *   **Step 5 (Safeguard):** The programme is 20 years old. "Each anomalous sample over the years has been handled by..." implies a long history of ad hoc adjustments. If we count the last cycle as degenerating (due to the exclusion), and the history implies previous cycles were similar, this likely hits the **Fail** (≥ 2 cycles) threshold.
  *   **Verdict:** The programme shows signs of long-term degeneration masked by a single successful prediction that required scope-shrinking. However, because a prediction *was* confirmed, a panellist might argue for one last chance. Strictly following the procedure: Step 3 is Degenerating (due to ad hoc exclusion), Step 5 is Fail.
  *   **Recommendation:** Do Not Renew. (Though a human might soften this, the procedure demands strictness on ad hoc scope reduction). *Correction for realism:* Given the "bold prediction confirmed," a strict Lakatosian might call that Progressive *despite* the belt, provided the prediction was risky. But the exclusion of known anomalies is a fatal flaw in the *empirical* progress. I will classify Step 3 as "Degenerating" because the confirmation was rigged by scope restriction.
  *   **Refinement:** To be most faithful to the "Safeguard" instruction (don't kill too easily), I will note that if the "bold prediction" counts as genuine progress, the cycle count resets. But the prompt says they "quietly redefined" to exclude misbehaving cases. That is a degenerative move. I will stick with **Do Not Renew** based on the cumulative history described ("Each anomalous sample over the years").

  ```json
  {
    "programme": "Programme A",
    "verdicts_by_step": [
      {"step": 1, "verdict": "Identified"},
      {"step": 2, "verdict": "Ad Hoc"},
      {"step": 3, "verdict": "Degenerating"},
      {"step": 4, "verdict": "Applying"},
      {"step": 5, "verdict": "Fail"}
    ],
    "cycles_since_genuine_progress": 2,
    "overall": "degenerating",
    "rationale": "While a prediction was confirmed, it required the ad hoc exclusion of known anomalies (Step 2 & 3). This constitutes a degenerating problem shift. Historical patterns indicate this is not an isolated incident (Step 5 Fail).",
    "unavoidable_judgment_points": [
      "Determining if the scope exclusion was scientifically justified or purely protective (Step 2)",
      "Assessing whether the confirmed prediction outweighs the ad hoc belt adjustment (Step 3)"
    ],
    "recommendation": "do-not-renew",
    "confidence": "medium"
  }
  ```

  **Mechanical vs. Deliberative Fields:**
  *   **Mechanical:** `cycles_since_genuine_progress`, `verdicts_by_step` (Steps 3 & 5), `recommendation` (derived from Decision Rule).
  *   **Deliberative:** `verdicts_by_step` (Steps 1, 2, 4), `overall`, `rationale`, `unavoidable_judgment_points`, `confidence`. The panellist must decide if the "scope exclusion" is a legitimate refinement or a degenerative maneuver; the table flags this but cannot decide it.

  ***

  ### Worked Application: Programme B (Community Ecology)

  **Analysis:**
  *   **Step 1 (Core):** "Single optimization principle." Identified.
  *   **Step 2 (Belt):** No anomalies mentioned, but "no risky prediction in over a decade." This implies anomalies are likely absorbed by the "unification" claim rather than tested.
  *   **Step 3 (Shift):** "No risky prediction in over a decade." A decade covers at least three 3-year cycles. Output is **Degenerating**.
  *   **Step 4 (Heuristic):** Defenders argue it "unifies a wide range of phenomena." Unification without novel prediction is, for Lakatos, a sign of degeneration (theoretical progress without empirical progress). Output: **Applying**.
  *   **Step 5 (Safeguard):** >10 years without risky prediction = ≥ 3 cycles. Output: **Fail**.
  *   **Verdict:** This is a textbook degenerating programme. The panellist's sympathy for the "unification" is explicitly overridden by the procedure's requirement for *novel facts*.
  *   **Recommendation:** Do Not Renew.

  ```json
  {
    "programme": "Programme B",
    "verdicts_by_step": [
      {"step": 1, "verdict": "Identified"},
      {"step": 2, "verdict": "Ad Hoc"},
      {"step": 3, "verdict": "Degenerating"},
      {"step": 4, "verdict": "Applying"},
      {"step": 5, "verdict": "Fail"}
    ],
    "cycles_since_genuine_progress": 3,
