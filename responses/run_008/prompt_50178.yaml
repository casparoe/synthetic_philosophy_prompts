prompt: |-
  I own a small firm, about 40 people, and a couple of times a year one of us has to promote somebody into a role with a lot of unsupervised discretion — managing client relationships on their own, handling money, being the person who decides things when neither I nor my co-founder is around. Interviews have burned me twice now: people who came across as honest and steady in the room and then did dumb, and in one case pretty expensive, stuff once they were actually on their own. I took an ethics course in college and remember liking virtue ethics — judge the character, not just the act — but I also remember the situationist stuff that's supposed to undercut it: the Milgram experiments, the seminary students who literally stepped over a guy slumped in a doorway because they were told they were late, and those old studies where kids who cheated in class didn't cheat on the exam and vice versa. The moral as I took it: how people act is driven alot more by the situation they're in than by any stable trait, so a character-judgment procedure built on asking people about their values is doomed. But I still have to promote *somebody*, and just saying "design the situation well and promote whoever" feels like it gives up on the fact that some people really do seem more trustworthy than others across the board.

  So what I want from you is a decision procedure my co-founder and I can actually run in about an hour per candidate, written for people with no psychology training. Spell out the steps in order: what to ask the coworkers who've seen the candidate in real situations (not hypotheticals), what to look for in their answers, what counts as a sufficient answer at each step, where the procedure terminates with a no, and where it has to hand the call back to us because the question is one of judgment rather than fact. Be honest about which steps are still interview-vibes dressed up as procedure — I'd rather know. Also tell me plainly what the procedure *cannot* do, e.g. if it can't tell "person of genuinely good character" apart from "person who has only ever been in easy, well-resourced situations," say that, because that limitation is exactly the thing that's been biting me. Then run it on two candidates: one who's solid and well liked but has only ever worked under close supervision in a smoothly run enviroment, and one who's prickly, not well liked, but has been through genuinely messy situations (a failing project, a coworker everyone knew was cutting corners) and behaved decently throughout. If the procedure's verdict on the second person is one I won't like, so be it — give it anyway. Last thing: tell me whether any part of the output should really be a recommendation about changing the situation they'd be promoted into (checks, buffers, a transition period) rather than a verdict on the person, and where you'd draw that line. Please write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Request:**
      *   **User:** Owner of a small firm (~40 employees).
      *   **Problem:** Needs to promote employees to high-discretion roles (client relationships, money, decision-making). Past interviews failed (candidates seemed honest/steady but acted poorly when unsupervised).
      *   **Philosophical Tension:** Likes virtue ethics (judge character) but knows situationist psychology (Milgram, Darley & Batson, Hartshorne & May) suggests behavior is situational, not trait-based.
      *   **Goal:** A practical, 1-hour decision procedure for the owner and co-founder to evaluate candidates.
      *   **Constraints:** Written for non-psychologists. Step-by-step. Specific criteria for "sufficient answer." Clear termination points (No vs. Judgment Call). Honest about limitations ("interview-vibes").
      *   **Specific Task:** Run the procedure on two hypothetical candidates (Solid/Supervised vs. Prickly/Tested).
      *   **Specific Task:** Identify where the recommendation should be about *changing the situation* (controls) vs. *judging the person*.
      *   **Tone:** American English, direct, honest, practical.

  2.  **Deconstruct the Philosophical/Psychological Conflict:**
      *   *Virtue Ethics:* Assumes stable character traits (honesty, courage).
      *   *Situationism:* Assumes behavior is driven by context/pressure.
      *   *Synthesis for Business:* You can't measure "soul," but you *can* measure "track record under pressure" and "awareness of temptation." The goal isn't to find a saint, but to find someone whose *past situations* resemble the *future situation* enough to predict behavior, or someone who demonstrates *situational awareness* (knowing when they might fail).
      *   *Key Insight:* The "Fundamental Attribution Error" works both ways. Don't assume a nice interview means a nice worker, but don't assume *no one* has stable tendencies either. Look for *consistency across varying contexts*, not just hypothetical answers.

  3.  **Drafting the Decision Procedure (The "Trust & Discretion Protocol"):**
      *   *Time Limit:* 1 hour total.
      *   *Phase 1: Reference Mining (20 mins).* Not standard references. Peer/colleague interviews. Focus on specific past incidents, not adjectives.
      *   *Phase 2: The "Pressure Test" Interview (30 mins).* Not "What would you do?" but "Tell me about a time..." followed by "What was the temptation?" Focus on *failure* and *recovery*, not just success.
      *   *Phase 3: Structural Fit (10 mins).* Does the role need a saint, or does it need controls?
      *   *Termination Rules:* Red flags (lying, blaming others, inability to recall specific details).
      *   *Honesty Check:* Acknowledge that this is still probabilistic.

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* Is asking coworkers feasible? Yes, in a 40-person firm.
      *   *Critique:* How to avoid "halo effect"? Ask for specific stories, not ratings.
      *   *Critique:* How to address situationism? Explicitly ask about the *context* of their past behavior. Was it easy to be good then?
      *   *Refinement:* Add a specific step about "Temptation Mapping."

  5.  **Developing the Two Case Studies:**
      *   *Candidate A (Solid/Supervised):* Good vibes, no scars. Risk: Unproven under fire.
      *   *Candidate B (Prickly/Tested):* Friction, but proven integrity in chaos. Risk: Cultural fit, burnout.
      *   *Application:* Run the protocol strictly.
      *   *Outcome:* Candidate A might fail the "Pressure Test" because they lack data. Candidate B might pass the "Integrity" check but flag the "Relationship" risk.
      *   *Honesty:* The user might not like Candidate B, but the protocol should highlight B's proven resilience.

  6.  **Addressing the "Situation vs. Person" Line:**
      *   This is crucial. If the procedure reveals the *role* is designed to tempt anyone, the fix isn't hiring a better person, it's fixing the role.
      *   *Line:* If two reasonable people would likely fail the same way in that role, it's a design flaw.

  7.  **Drafting the Content (incorporating American English and Tone):**
      *   *Tone:* Professional, direct, slightly conversational but authoritative.
      *   *Structure:*
          1.  Introduction (Acknowledging the tension).
          2.  The Procedure (Step-by-step).
          3.  Limitations (The "Cannot Do" list).
          4.  Case Study Run-Through.
          5.  Structural Recommendations.

  8.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the situationist critique? *Yes, by emphasizing context in the questioning.*
      *   *Check:* Is it under an hour? *Yes, timed sections.*
      *   *Check:* Did I run the two candidates? *Yes.*
      *   *Check:* Did I address the "interview-vibes" honesty? *Yes, in the limitations section.*
      *   *Check:* Is the distinction between person-fix and situation-fix clear? *Yes, in the final section.*

  9.  **Final Polish:** Ensure clear headings, bullet points for readability, and strict adherence to the "no psychology training" constraint (avoid jargon like "fundamental attribution error" unless explained simply). *Self-correction: Actually, keep jargon out entirely to meet the "no psychology training" constraint strictly.*

  10. **Final Review against constraints:**
      *   American English? Yes.
      *   1 hour limit? Yes.
      *   Steps spelled out? Yes.
      *   Termination points? Yes.
      *   Two candidates run? Yes.
      *   Situation vs. Person line? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your specific constraints. It accepts the situationist critique (behavior is contextual) while acknowledging the practical necessity of making trait-based predictions (you still have to pick a human).

  This protocol is called the **Discretion & Pressure Protocol (DPP)**. It is designed to take 60 minutes per candidate.

  ### Part 1: The Decision Procedure

  **Total Time:** 60 Minutes
  **Participants:** You and your Co-founder.
  **Pre-work:** None. Do not review their resume or past performance reviews before starting. This prevents the "Halo Effect" from contaminating the data gathering.

  #### Step 1: The Peer Audit (20 Minutes)
  *Goal: Bypass the candidate's self-presentation to get data on behavior in unscripted moments.*

  **Action:** Select two peers who have worked with the candidate in the last 12 months. Do not pick people the candidate nominated. Pick one person they get along with and one person they friction with. Ask them these three specific questions. Do not accept adjectives (e.g., "reliable," "honest"). Demand stories.

  **Question 1:** "Tell me about a time [Candidate] had to make a decision without asking a manager first. What was the risk if they got it wrong?"
  *   **Sufficient Answer:** Specific details on the decision, the timeline, and the outcome.
  *   **Termination (No):** The peer cannot recall a single instance. (Indicates the candidate has never actually operated without supervision).

  **Question 2:** "Tell me about a time [Candidate] was under significant pressure or a deadline was at risk. How did they treat support staff or junior team members during that week?"
  *   **Sufficient Answer:** A description of behavior (e.g., "They snapped at the intern," or "They ordered pizza for the team and stayed late").
  *   **Termination (No):** Peer reports abuse, blame-shifting, or corner-cutting that was hidden from management.

  **Question 3:** "If you had to lend [Candidate] $500 with no paperwork, would you? Why or why not?"
  *   **Sufficient Answer:** A gut-check explanation.
  *   **Termination (No):** Immediate hesitation or "No" without a logistical reason (e.g., "I'm broke").

  **Hand-off to Judgment:** If peers are contradictory (one says yes, one says no), flag this for Step 3. Do not terminate yet.

  #### Step 2: The Temptation Interview (30 Minutes)
  *Goal: Test for "Situational Awareness" rather than "Goodness."*

  Situationism teaches us that good people do bad things when the situation pushes them. You are not looking for a saint; you are looking for someone who knows where their breaking point is.

  **Action:** You and your co-founder interview the candidate. Do not ask "What would you do?" Ask "What did you do?"

  **Question 1 (The Mistake):** "Tell us about a mistake you made that cost the company money or a client's trust. How long did you wait before reporting it?"
  *   **Sufficient Answer:** Admission of a specific error. Clear timeline on reporting (ideally immediate).
  *   **Termination (No):** Claims they haven't made a significant mistake. (This is a lie or a lack of experience).
  *   **Termination (No):** Admits to waiting to see if they could fix it before telling anyone. (This indicates they prioritize self-protection over transparency).

  **Question 2 (The Gray Area):** "Describe a time you saw a coworker doing something technically against the rules but everyone knew it was 'how things get done.' What did you do?"
  *   **Sufficient Answer:** Nuanced description. Did they ignore it? Report it? Confront the coworker?
  *   **Look For:** Evidence that they recognize peer pressure as a force.
  *   **Termination (No):** "I would never break the rules." (Unbelievable).
  *   **Termination (No):** "I told the boss immediately." (In a 40-person firm, this often signals a lack of social calibration that will damage client relationships).

  **Question 3 (The Resource Constraint):** "Tell us about a time you didn't have the tools or time to do the job right. Did you cut corners? If so, which ones?"
  *   **Sufficient Answer:** Honest admission of triage. "We skipped the double-check on X to meet the deadline on Y."
  *   **Look For:** Did they inform the client/boss about the trade-off?
  *   **Termination (No):** Claims they always do everything perfectly regardless of constraints.

  **The "Vibe" Check (Honest Admission):**
  The last 5 minutes of this step are unavoidable "interview vibes." You are assessing *comfort with discomfort*. When asked about failures, do they get defensive? Do they get quiet?
  *   **Note:** This is the least scientific part of the procedure. It is susceptible to your own biases. Record your gut feeling, but do not let it override a "Termination (No)" from the factual questions above.

  #### Step 3: The Structural Fit (10 Minutes)
  *Goal: Determine if the role is the problem, not the person.*

  **Action:** Review the data from Steps 1 and 2 against the role you are filling.

  **Discussion:**
  1.  **Consistency:** Did the peer reports match the candidate's stories?
  2.  **Pressure History:** Has this person ever actually been under the kind of pressure this new role entails?
  3.  **The "Saint" Test:** Does this role require perfect integrity to succeed, or does it require *average* integrity with *good* controls?

  **Verdict Options:**
  *   **GO:** Candidate has proven discretion in similar contexts + owns their mistakes.
  *   **NO:** Candidate has no track record of unsupervised work OR hid a mistake.
  *   **CONDITIONAL GO:** Candidate is trustworthy, but the *role* exposes them to too much temptation. (See Part 4).

  ---

  ### Part 2: What This Procedure Cannot Do

  You asked for honesty about limitations. Here is what the DPP cannot distinguish:

  1.  **The "Unbroken" vs. The "Good":** It cannot reliably tell the difference between a person of deep character and a person who has simply never been tempted enough to break. If a candidate has only worked in well-resourced, ethical environments, they will pass this test. They may still fail when the money is on the table and no one is looking.
  2.  **The "Slow Burn":** It cannot predict fatigue. Someone might be honest for six months and then embezzle in month seven because their spouse got sick and they needed cash. This procedure assesses past behavior, not future life circumstances.
  3.  **The "Social Chameleon":** It cannot fully detect a high-functioning sociopath who is skilled at fabricating peer consensus. (Though in a 40-person firm, this is harder to pull off than in a corporation).
  4.  **The "Vibe" Bias:** Step 2's "Vibe Check" is subjective. You might reject a brilliant candidate because they make you nervous, or accept a smooth talker because they remind you of yourself. The procedure minimizes this, but does not eliminate it.

  ---

  ### Part 3: Running the Procedure on Two Candidates

  Here is how the DPP processes the two profiles you described.

  #### Candidate A: "The Solid Soldier"
  *Profile:* Well-liked, smooth performance, but only ever worked under close supervision in a smoothly run environment.

  *   **Step 1 (Peer Audit):** Peers love them. "Great to work with." However, when asked about unsupervised decisions (Q1), peers struggle. "Well, [Boss] usually told us what to do, but A always followed the plan."
  *   **Step 2 (Interview):**
      *   *Mistake:* "I haven't really made a costly mistake." (Red Flag: Lack of experience or honesty).
      *   *Gray Area:* "I haven't really seen that happen here." (Plausible, given the smooth environment).
      *   *Resource Constraint:* "We usually had what we needed."
  *   **Step 3 (Verdict):** **CONDITIONAL NO / HIGH RISK.**
      *   *Reasoning:* The procedure terminates on "Termination (No)" regarding the mistake question (claiming no significant mistakes is a negative indicator for a high-discretion role). More importantly, there is **no data**. You are not promoting a person; you are promoting a hypothesis.
      *   *Outcome:* You cannot verify character because the *situation* has never tested it.

  #### Candidate B: "The Prickly Veteran"
  *Profile:* Not well-liked, abrasive, but has been through failing projects and coworker corner-cutting and behaved decently.

  *   **Step 1 (Peer Audit):** Mixed. One peer says, "B is hard to work with, they nitpick." The other says, "When the project was going off the rails, B was the only one who wouldn't sign off on the bad code."
      *   *Q1 (Unsupervised):* "B took over the client calls when the PM quit. Saved the account."
      *   *Q3 ($500):* "Yeah, I'd lend it. They're grumpy but they pay back."
  *   **Step 2 (Interview):**
      *   *Mistake:* "I missed a billing cycle on Project X. Cost us $5k. I told the owner within the hour. We ate the cost." (Strong Pass).
      *   *Gray Area:* "A coworker was padding hours. I told them to stop. They didn't. I told you." (Strong Pass).
      *   *Resource Constraint:* "We didn't have the budget for testing. I told the client we were launching 'beta' so they knew the risk." (Strong Pass).
  *   **Step 3 (Verdict):** **GO (with management caveat).**
      *   *Reasoning:* The data shows integrity under fire. The "Prickly" nature showed up in Step 1, but it did not trigger a Termination (No) because it didn't involve abuse or dishonesty, just friction.
      *   *Outcome:* This candidate has a **proven track record of discretion**. The procedure favors them over Candidate A, even though Candidate A is more pleasant.

  **The Uncomfortable Truth:** The procedure will likely tell you to promote Candidate B, or at least rate them higher on *trust*, while rating Candidate A higher on *culture fit*. If your priority is "unsupervised discretion with money," the procedure says Candidate A is a liability because they are untested.

  ---

  ### Part 4: Person vs. Situation (The Line in the Sand)

  You asked where the recommendation should be about changing the situation rather than judging the person.

  **The Rule:** If the DPP reveals that the *primary risk* is temptation rather than incompetence, you change the situation.

  **Where to draw the line:**
  1.  **The "Single Point of Failure" Test:** If the role allows one person to move money *and* reconcile the accounts *and* approve the vendor, **do not promote anyone into this role yet.** It does not matter if Candidate B is a saint. The situation is designed for failure.
      *   *Recommendation:* Split the duties. Require two signatures for transfers over $X.
  2.  **The "Opacity" Test:** If the work is done entirely remotely with no audit trail for 3 months, the situation is too rich for temptation.
      *   *Recommendation:* Implement a monthly random audit or a "shadow period" where the new manager's decisions are reviewed retroactively for 90 days.
  3.  **The "Candidate A" Fix:** If you choose Candidate A (the untested one), you must acknowledge you are testing *them*.
      *   *Recommendation:* Do not give full discretion on Day 1. Use a "Graduated Discretion" model. Give them authority over $5k. If they handle it transparently for 3 months, move to $10k.

  **Final Recommendation:**
  Use the DPP to filter out the dishonest (Candidate who hides mistakes).
  Use **Structural Controls** to protect the honest (Candidate B) from becoming dishonest under extreme pressure.
  Do not promote Candidate A into a high-discretion role without a "Graduated Discretion" transition period, because the DPP proves they are an unknown variable.

  The procedure cannot give you a guarantee. It simply moves you from "Guessing based on a handshake" to "Betting based on data."
