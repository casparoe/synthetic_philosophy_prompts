  9.  **Final Polish:** Check tone (analytical, sharp), ensure all parts of the prompt are answered (Table, Breaks, Conclusion, Comparative, Better Analogy). (The user asked for "audit the analogy," "correspondence table," "places it breaks," "conclusion survival," "Scandinavia vs Japan," "better analogy".)

  10. **Final Review against constraints:** The user wants a stress test, not a political rant. Keep it focused on the mechanics of the analogy.

  *(Self-Correction on the "Smart Switch" point)*: The user's friend argues an elected president is a smart switch the party can log into. I need to counter this. In semi-presidential systems (France) or ceremonial presidencies (Germany/Ireland), the president is elected but constrained. They aren't necessarily remote-controlled by the PM. The analogy assumes a specific type of republic (pure parliamentary with weak president) vs monarchy. I should point out that a *directly elected* president with reserve powers (like Ireland) is actually a *tested* breaker (they have a mandate), whereas a monarch is an *untested* breaker.

  *(Refining the "Physics vs Judgment" point)*: This is the core. A breaker trips because heat bends metal. A monarch trips because they feel a duty. Heat is reliable; duty is variable.

  *(Refining the "Series Protection")*: In the UK, the Supreme Court (2019) acted as the breaker. This implies the system has *multiple* breakers. If you have multiple breakers, do you need the expensive, hereditary one?

