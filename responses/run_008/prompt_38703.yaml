  3.  **Stress-Test the Analogy (Where it Breaks):**
      *   *Mechanism of Action:* Breakers are automatic/physics-based. Monarchs are discretionary/human-based. This is the biggest flaw. A breaker doesn't *decide* to trip; it *must* trip. A monarch *chooses*.
      *   *Testing/Maintenance:* Breakers are tested regularly (monthly/annually). Reserve powers are *never* tested until they are needed. This creates uncertainty (will the monarch actually do it?).
      *   *Calibration:* Breakers have a specific amperage rating. Monarchs have no clear threshold. What constitutes a "fault" worthy of intervention? (e.g., Is prorogation a fault? The UK Supreme Court said yes, the Queen stayed silent).
      *   *Neutrality:* A breaker has no political preference. A monarch is a human with a family, class, and interests. "Trained apathy" is not the same as "physical impossibility of bias."
