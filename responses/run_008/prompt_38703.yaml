  5.  **Compare Monarchies (Norway vs. Japan vs. UK):**
      *   *Norway (1940):* Haakon VII actually exercised agency. He threatened to abdicate. This fits the "Breaker" model best. He had moral authority + constitutional ambiguity.
      *   *Japan:* Article 4 explicitly strips political power. The Emperor *cannot* trip the breaker. He is a fuse that has been removed. The analogy fails here completely.
      *   *UK:* Reserve powers exist (theoretically) but are constrained by convention. The 2019 crisis showed the *Court* tripped, not the Queen. The breaker was bypassed by a parallel circuit (Judiciary).
      *   *Failure Modes:*
