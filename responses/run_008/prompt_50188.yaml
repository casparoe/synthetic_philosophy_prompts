  *Final check on the DDE point:* Rachels argues against the *moral significance* of the killing/letting die distinction. DDE argues that *intention* matters (killing with intent is worse than foreseen death). They are different axes. The student says DDE "says the same thing." This is definitely wrong. DDE is often used to *defend* the permissibility of the Trolley switch (intend to save 5, foresee 1 die) while forbidding the Transplant (intend to kill 1). Rachels says Trolley and Transplant should be judged more similarly (or at least, the killing/letting die distinction isn't the reason). The student is mixing up the "Doing/Allowing" debate with the "Intending/Foreseeing" debate. This is the biggest "bug."

