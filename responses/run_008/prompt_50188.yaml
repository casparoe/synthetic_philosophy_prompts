          *   *Error:* Connects this to the *Doctrine of Double Effect (DDE)*. Claims DDE says the same thing about intending vs. foreseeing. (This is a major conceptual mix-up).
      *   **Paragraph 2 (Trolley & Transplant):**
          *   *Claim:* Foot's bystander diverts trolley because threat was already heading toward five, so bystander *allows* the one to die rather than *doing* harm.
          *   *Claim:* Surgeon *does* harm, so may not proceed.
          *   *Claim:* Trolley literature confirms the bathtub result. (Wait, Bathtub said no difference, Trolley implies there *is* a difference in permissibility based on doing/allowing).
