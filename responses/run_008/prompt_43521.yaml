      *   **Constraints:**
          *   Must be engineer-friendly (no jargon).
          *   Must handle the "awkward middle case" (verbal but costly conventions).
          *   Must admit when a question is real but unresolvable by data (requires value judgment).
          *   Must apply the procedure to the three specific examples provided (Barley Variety, Leased Field, Drought Event).
          *   Must be honest about potential failure modes (where the procedure might misfire).
          *   *Crucial:* Don't go easy on the user (they suspect they might be wrong about the Barley Variety case).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Verbal vs. Substantive:* The core idea is whether the disagreement persists if we strip away the ambiguous term. (Chalmers' elimination test).
      *   *Carnap's Internal/External:* Internal questions are answered within the rules of the system (e.g., "Is this plant a Barley?"). External questions are about which system to adopt (e.g., "Should 'Barley' be a class or an individual?").
      *   *Pragmatics:* Even if a dispute is verbal (ontologically neutral), the *choice* of representation has engineering consequences (query speed, maintainability, user mental models).

  3.  **Drafting the Procedure (The "Ontology Triage Protocol"):**
      *   *Goal:* Turn philosophical tests into engineering questions.
      *   *Step 1: The "Show Me the Data" Test (Substantive Check).* If Model A and Model B produce different SQL/Graph queries that return different *observable* results, it's substantive. If they map to the exact same rows/edges, it's likely verbal/conceptual.
      *   *Step 2: The "Translation" Test (Verbal Check).* Can Team A describe Team B's model without saying it's "wrong," just "different notation"? If yes, it's verbal.
      *   *Step 3: The "Cost/Benefit" Analysis (Pragmatic Check).* If it's verbal, which model is cheaper to maintain, faster to query, or easier for users?
      *   *Step 4: The "Value Judgment" Escape Hatch.* If it's substantive but data can't decide (e.g., future-proofing vs. current accuracy), who has the tie-breaking vote? (Product Owner/Business Lead).

