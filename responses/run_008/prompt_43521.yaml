          *   *Opposing stance:* Variety = Individual/Lineage (Plants = Parts).
          *   *Analysis:* In a KG, `rdf:type` vs `partOf` changes inference. If I query "Show me all Barley," does it work the same? If I query "Show me the history of this Variety," does it work the same?
          *   *Verdict:* This is tricky. Biologically, a variety is a lineage (individual). Logically, it acts like a class. If the system needs to track breeding history, "Individual" is better. If it just needs to tag plants, "Class" is easier.
