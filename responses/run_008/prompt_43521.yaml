          *   *Refinement:* Wait, if both models store the same data (Plant ID, Variety Name, Parent Variety), is the disagreement just about the RDF predicate? If so, it's verbal/pragmatic. But if one model *cannot* represent parent varieties easily, it's substantive. I need to push the user on whether their "Class" model blocks lineage tracking.

      *   *Case 2: Leased Field (Legal Parcel vs. Planted Area).*
          *   *Analysis:* These are two different *objects* in the world that overlap spatially.
          *   *Verdict:* Substantive. They have different properties (owner vs. crop). Modeling them as one entity causes data collision. Modeling them as two linked entities is accurate. The dispute is likely about *granularity*, not ontology.
          *   *Correction:* The fight is "Is a Field X or Y?" The answer is "You need both." This is a modeling error, not a metaphysical dispute.

      *   *Case 3: Drought Event (Disposition vs. Process).*
