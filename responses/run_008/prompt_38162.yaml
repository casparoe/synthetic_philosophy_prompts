      *   *Option B: Implicit Essentialism (The "Lockean" View).* The law treats species as natural kinds with fixed boundaries. This is metaphysically wrong but legally necessary for property/rights logic.
      *   *Option C: The Lineage View (The "Evolutionary" View).* The law *tries* to protect evolutionary potential, but uses "species" as a proxy. It's a mismatched proxy.
      *   *Option D: Legal Constructivism (The "Institutional Fact" View).* A listed species is not a biological species; it's a legal entity that *correlates* with biology but is defined by the statute.

  4.  **Developing the Arguments for Each Sub-Question:**

      *   *Q1: Does law need a concept?*
