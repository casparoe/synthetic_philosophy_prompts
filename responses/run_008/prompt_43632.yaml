  Here's a thinking process that leads to the suggested quiz and analysis:

  1.  **Analyze the Request:**
      *   **Goal:** Create an 8-question quiz for a pub ethics group (mixed background) to sort participants on the spectrum of Moral Particularism vs. Moral Generalism.
