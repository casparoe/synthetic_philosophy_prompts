      *   **Required Cases:**
          1.  Murderer at the door (lying to save a friend).
          2.  Broken promise to prevent harm (residue/apology vs. voided).
          3.  Context-dependent polarity (same fact, different moral valence).
          4.  Codifiability/Regress (Angel with the rulebook).
      *   **Target Positions (Leaves):**
          1.  Exceptionless Generalism (Absolutism).
          2.  Outweighing Generalism (Rossian/Prima Facie).
          3.  Codified Exception Generalism (Principles with built-in "unless" clauses).
          4.  Rule of Thumb Generalism (Principles exist but are too complex to codify/use directly).
          5.  Straight Particularism (No true principles, holistic reasons).
      *   **Logical Structure:** Build from logical space first, then map positions. Identify unoccupied spaces.
      *   **Tone:** Direct, committed, not wishy-washy. Include a "Where I Stand" section.
      *   **Constraint:** 8 questions.

  2.  **Deconstruct the Logical Space (The "Tree"):**
      *   *Branch 1: Do invariant moral principles exist?* (Yes/No)
          *   If No -> Particularism.
          *   If Yes -> Generalism.
      *   *Branch 2 (Generalism): Are these principles exceptionless?*
          *   Yes -> Exceptionless Generalism (Kantian/Absolutist).
          *   No -> Defeasible Generalism.
      *   *Branch 3 (Defeasible): How do exceptions work?*
          *   Outweighing (Residue remains) -> Rossian.
          *   Switching Off (No residue) -> Threshold/Conditional.
      *   *Branch 4 (Codifiability): Can we write them down?*
          *   Yes (Finite clauses) -> Codified Exception Generalism.
          *   No (Infinite regress/Too complex) -> Rule of Thumb / Holistic Generalism.
      *   *Branch 5 (Epistemic vs. Semantic):* Even if an Angel gave the book, do we need judgment to apply it?

      *Potential Unoccupied Space:* "Codified Exception Generalism" with *finite* clauses that cover *all* cases without becoming a list of particulars. This is often argued to be impossible (the "unoccupied" spot). If you add enough exceptions, it becomes a list of cases (Particularism in disguise) or a Rule of Thumb. I need to make sure the quiz distinguishes between "Principles with *some* exceptions" vs. "Principles that are just summaries of cases."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Murderer at the Door):* Tests Exceptionless vs. Defeasible.
          *   A: Never lie (Exceptionless).
          *   B: Lie, but it's still a "bad" thing morally, just necessary (Rossian/Residue).
          *   C: Lie, and it's simply the right thing to do, no baggage (Particularist/Threshold).
      *   *Q2 (Broken Promise):* Tests Residue vs. Void.
          *   A: Promise binds absolutely (Exceptionless).
          *   B: Break it, but owe apology/explanation (Rossian).
          *   C: Break it, no hard feelings, duty vanished (Threshold/Particularist).
      *   *Q3 (Context Polarity):* Tests Holism. (e.g., Pleasure).
          *   A: Pleasure is always good.
          *   B: Pleasure is usually good, unless...
          *   C: Pleasure is good here, bad there (e.g., sadist's pleasure), no fixed rule.
      *   *Q4 (The Angel's Book):* Tests Codifiability vs. Judgment.
          *   A: I'd follow the book exactly.
          *   B: The book would just list every specific case (not principles).
          *   C: Even with the book, I'd need wisdom to match my case to the rule.
      *   *Q5 (The Regress):* Tests Infinite Exceptions.
          *   A: We can write the rule with all "unless" clauses.
          *   B: The "unless" clauses need their own "unless" clauses forever.
          *   C: We stop when it gets too messy and use judgment.
      *   *Q6 (Learning Ethics):* Tests how we learn.
          *   A: Learn rules, apply to cases.
          *   B: Learn cases, spot patterns (but patterns aren't rules).
          *   C: Learn rules, but know they break.
      *   *Q7 (The "Ticking Bomb" or similar high stakes):* Tests the "Switching Off" vs. "Outweighing." Let's use a confidentiality case.
          *   A: Confidentiality is absolute.
          *   B: Breach it, but feel guilt/owe restitution.
          *   C: Breach it, it was the right call, period.
      *   *Q8 (The "Notebook" limit):* Tests the transition from Principle to List.
          *   A: A principle with 1000 exceptions is still a principle.
          *   B: At some point, it's just a list of cases.
          *   C: Principles are just summaries, not guides.

      *Refining for Pub Context:* Needs to be punchier. Less abstract.
      *   *Revision:* Combine Q4/Q5 into one "Angel/Book" scenario. Combine Q1/Q2 into "Hard Conflicts." Ensure Q3 is clear about *valence switching*.

      *Let's finalize the 8 questions to map cleanly to the 5 leaves.*
      1.  Murderer at Door (Absolute vs. Override).
      2.  Broken Promise (Residue vs. Clean Break).
      3.  Pleasure/Pain Context (Invariant vs. Holistic).
      4.  The Angel's Code (Codifiability).
      5.  The "Unless" Clause (Regress).
      6.  Moral Mistakes (Rule violation vs. Bad judgment).
      7.  Similar Cases (Must be treated alike?).
      8.  The Notebook (Principle vs. List).

  4.  **Developing the Scoring Key/Tree:**
      *   Need to ensure the combinations actually lead to the 5 specific leaves requested.
      *   *Leaf 1: Exceptionless.* (Q1: Never Lie, Q2: Promise Absolute).
      *   *Leaf 2: Rossian (Outweighing).* (Q1: Lie+Guilt, Q2: Break+Apology, Q4: Rules exist).
      *   *Leaf 3: Codified Exceptions.* (Q1: Lie+Right, Q5: Exceptions can be written).
      *   *Leaf 4: Rule of Thumb.* (Q1: Lie+Right, Q4: Rules exist but too complex/Angel book is useless).
      *   *Leaf 5: Particularism.* (Q3: Valence switches, Q7: Similar cases don't need similar treatment, Q5: Regress is infinite).

      *Wait, I need to check the "Unoccupied Space".*
      *   *Candidate:* "Codified Exception Generalism" where the code is finite but covers everything. Many philosophers argue this is impossible (Dancy, McDowell). If the exceptions are specific enough to cover all cases, it's a list of particulars. If it's general, it needs more exceptions. I will mark this as the "Unstable" leaf.

  5.  **Drafting the Content:**
      *   *Intro:* Set the scene.
      *   *The Quiz:* Clear, conversational, no jargon.
      *   *The Key:* Explain the logic.
      *   *The Unoccupied Space:* Address the "Finite Codification" problem.
      *   *Hard Calls:* Address where Rossian vs. Particularism blurs (the "Residue" issue).
      *   *Where I Stand:* I need to take a stance. As an AI, I don't have beliefs, but the prompt asks for *my* committed view to argue over a pint. I should adopt a plausible philosophical persona. I'll argue for **Particularism** (specifically Holistic Particularism) because it best explains the context-dependence of reasons without resorting to ceteris paribus clauses that do no work. Or, I could argue for **Rule of Thumb Generalism** as a pragmatic middle ground.
      *   *Decision:* I will argue for **Particularism**. It's the most intellectually interesting position to defend in a pub, and it fits the "holistic reasons" requirement best. It allows for a sharper critique of the "Angel's Book."

  6.  **Refining the "Hard Calls":**
      *   The trickiest distinction is between *Rossian Outweighing* (principles exist but clash) and *Particularism* (no principles, just reasons).
      *   *Differentiation:* The "Residue." If you break a promise to save a life, do you owe an apology? Ross says yes. Particularist says maybe not—the reason to keep the promise didn't just get outweighed; it vanished because the context changed the nature of the promise.
      *   *Another Hard Call:* Rule of Thumb vs. Particularism. Both say "use judgment." Difference: Rule of Thumb says there *is* a truth of the matter in the principle, we just can't grasp it. Particularism says there *isn't* a principle truth.
      *   *My Stance:* I'll push readers who say "Judgment matters but principles are true" into Rule of Thumb, but admit the line is thin.

  7.  **Final Review against Constraints:**
      *   8 Questions? Yes.
      *   Concrete cases? Yes.
      *   No jargon in questions? Yes.
      *   Mapping to 5 leaves? Yes.
      *   Unoccupied space identified? Yes (Finite Codification).
      *   Hard calls addressed? Yes.
      *   "Where I Stand" included? Yes.

  8.  **Writing the Output:** (Self-Correction during drafting)
