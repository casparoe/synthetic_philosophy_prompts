answer: |-
  **TO:** Rules Disputes Panel
  **FROM:** [Your Name]
  **DATE:** Thursday, 24 October
  **SUBJECT:** Decision Memo: Week 8 Entrenchment & Retroactivity Dispute

  Right then. We've got until Saturday to settle this, and the split vote isn't helping anyone. After reviewing the proposals and the arguments, I'm recommending we adopt **Option B**: the emergency amendment stands, the entrenchment clause is void, and the retroactive point reapportionment holds.

  I know half of you think this kills the game's stability, but hear me out. The core issue isn't fairness; it's logical coherence. In Nomic, the 'sovereignty' lies in the current ruleset's ability to modify itself. When Week 6's amendment tried to entrench itself against ordinary procedure, it created a self-reference paradox. You cannot use a rule generated by Power X to limit Power X, unless Power X explicitly agrees to be bound at that later moment.

  Think of it like the UK Parliament versus the US Constitution. In the US, entrenchment works because there's a higher-order document everyone agrees is 'above' normal law. In our Nomic game, there is no higher document. The emergency procedure *is* the current expression of sovereign will. If a rule says "you can't change me," but another valid rule says "I can change anything in an emergency," the latter must prevail. Otherwise, the first player to write an immutable rule wins by freezing the game state forever. That stops it being Nomic and starts it being Monopoly. The entrenchment clause is therefore incoherent: it attempts to bind the very authority that gives it force.

  Now, regarding retroactivity. I suspect this is two disputes wearing one trenchcoat, but they're tangled. If the amendment is void (Option A), the retroactivity dies with it. If the amendment is valid (Option B), the retroactive clause is just another part of that valid amendment. We can't say "you can change the rule, but you can't fix the past scores," because the power to amend includes the power to define the amendment's temporal scope. It's messy, and yes, it invalidates a past prize, but validating the entrenchment would invalidate the game itself. We can buy the aggrieved winner a pint; we can't unfreeze the ruleset.

  **Where This Could Go Wrong (The "Flip" Condition)**

  I want to be honest about the weak spots here, specifically for our ex-law student. This recommendation hinges entirely on the scope of the emergency procedure.

  1.  **The Procedural Loophole:** If the emergency procedure was explicitly defined *only* for "typos and contradictions," then using it to reapportion points is an abuse of process, regardless of entrenchment. If the losing side can prove the emergency clause was never intended for substantive changes, Option B collapses. In that case, the amendment is void not because of entrenchment, but because the tool was used incorrectly. That would flip us to Option A (old result stands) or potentially Option C (restart).
  2.  **The Reliance Argument:** The strongest argument against retroactivity is reliance. Players made moves based on the scorecard at the time. If the panel thinks undermining that reliance breaks the social contract of the society more than freezing the rules does, we should pivot to Option C (restart phase). It's the coward's way out, but it preserves trust.

  **Conclusion**

  Unless someone can demonstrate the emergency procedure was strictly limited to typos, Option B is the only choice that keeps Nomic playable. It prioritises the dynamic nature of the game over static fairness. Let's vote on this basis.

  Cheers,

  [Your Name]
