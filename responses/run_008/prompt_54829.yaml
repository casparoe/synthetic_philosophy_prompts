      *   *Correction:* The prompt asks to "recommend one of the three options concretely". I'll choose **Option B** (Emergency amendment valid, entrenchment void) because it respects the dynamic nature of Nomic. A static rule kills the game.

  3.  **Drafting - Section by Section:**
      *   **Header:** To/From/Date/Subject.
      *   **Opening:** Acknowledge the weirdness, state the recommendation clearly.
      *   **Reasoning (Entrenchment):** Tackle the self-reference. A rule created by power X cannot limit power X unless power X agrees. The emergency procedure *is* power X acting. Compare to constitutional entrenchment (parliament sovereignty).
      *   **Reasoning (Retroactivity):** Is it separate? Yes. Even if the amendment is valid, changing past scores is messy. But if the amendment is valid, the retroactivity clause is part of it. I need to argue they are tangled. If the amendment is void, retroactivity is void. If amendment is valid, retroactivity stands. I'll argue they stand together.
