  6.  **Final Polish:** Check American English spelling/idioms. Ensure the tone is appropriate for an email between friends/colleagues (intellectual but accessible). Ensure all constraints of the prompt are met. (Move-by-move, thermostat analysis, mimicry vs. causal, final assertion analysis, missing elements).

      *Check:* Did I address whether the mimicry and "formed in right way" are distinct? Yes, need to make sure that's clear. Mimicry = surface behavior. Causal history = connection to truth/world.
