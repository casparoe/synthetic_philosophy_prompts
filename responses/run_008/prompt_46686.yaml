answer: |-
  To construct a problem statement robust enough for a thesis proposal, you must treat the definition of "alignment" not as a given, but as a hypothesis about what kind of relationship between system and operator is scientifically tractable. Below are five desiderata for an adequate statement of the alignment problem, evaluated against your constraints, followed by an analysis of their tensions and the identification of the most exclusionary requirement.

  ### Desiderata for the Problem Statement

  **1. Ontological Agnosticism (Agent-Neutrality)**
  *   **Requirement:** The statement must not presuppose that the system possesses a unified utility function, coherent goals, or a persistent self-model. It must apply equally to a diffusion model, a reinforcement learning agent, and a mesa-optimizer.
  *   **Motivating Case:** Modern foundation models often behave as stochastic correlators rather than goal-directed agents. A definition requiring "goal alignment" fails to describe the failure modes of systems that have no goals but still produce harmful outputs due to distributional shift or specification gaming.
  *   **Status:** **Non-negotiable (Empirical).** While classical alignment theory often assumes agency (the "optimizer" frame), empirical ML deals with architectures where agency is emergent or absent. For a thesis grounded in current architectures, assuming agency is a category error.

  **2. Normative Distinctness**
  *   **Requirement:** The statement must logically distinguish "aligned" from "safe" and "useful." It must be possible to conceive of a system that is aligned but unsafe (e.g., faithfully executes a dangerous command), useful but unaligned (e.g., achieves the task via deceptive shortcuts), or safe but unaligned (e.g., refuses all commands).
  *   **Motivating Case:** Industry often conflates alignment with safety (risk mitigation) or usefulness (instruction following). If the problem statement collapses into "make it safe," you are doing safety engineering. If it collapses into "make it useful," you are doing capability tuning. Alignment must refer to the *direction* of optimization relative to human intent, distinct from the *outcome* (safety) or *competence* (usefulness).
  *   **Status:** **Prejudice of Alignment Theory.** Safety engineers and product teams often view these as a single bundle ("trustworthy AI"). Maintaining distinctness is a theoretical choice to isolate the mechanism of intent transmission from the mechanism of risk management.

  **3. Operational Non-Circularity**
  *   **Requirement:** The statement cannot presuppose the existence of a solution architecture. It cannot define alignment as "installing human values" or "correcting the reward function," as these assume we know how values are instantiated or where the reward function lives.
  *   **Motivating Case:** Defining the problem as "value loading" assumes values are loadable objects. If values are emergent properties of high-dimensional manifolds, "loading" them is a category error. The problem statement must describe the *misfire* without assuming the *fix*.
  *   **Status:** **Non-negotiable (Logical).** A scientific problem statement cannot contain its own solution. Doing so renders the research program tautological.

  **4. Capability Invariance**
  *   **Requirement:** The statement must remain meaningful at low capability levels. It must allow us to say a trivial classifier is "unaligned" in principle, even if it lacks the power to be dangerous.
  *   **Motivating Case:** If alignment is only defined above a capability threshold (e.g., "AGI"), you cannot run experiments on current systems. You need a gradient of alignment to measure progress. A binary "aligned/not-aligned" switch that flips only at superintelligence is not a scientific variable.
  *   **Status:** **Prejudice of Empirical ML.** Existential risk researchers often argue alignment is only meaningful when capabilities are dangerous. Insisting on low-capability meaningfulness is a methodological choice to enable experimentation, not a metaphysical truth about the problem.

  **5. Decomposability**
  *   **Requirement:** The statement must allow us to determine whether corrigibility, intent alignment, and value learning are one problem or three. It must specify what evidence would count as separating them.
  *   **Motivating Case:** If the problem is monolithic, progress is unmeasurable. If corrigibility is a subset of intent alignment, fixing one should fix the other. The statement must define the boundaries so that experimental results can map to specific subproblems.
  *   **Status:** **Non-negotiable (Scientific).** Without decomposability, you cannot attribute causality in experiments. You cannot know if an intervention improved "alignment" generally or just "corrigibility."

  ### Analysis of Joint Unsatisfiability

  Your suspicion regarding the tension between **Operational Non-Circularity** and **Ontological Agnosticism** is correct, but the tension is mediated by **Normative Distinctness**. Here is the sharpened conflict:

  To satisfy **Normative Distinctness** (Alignment $\neq$ Usefulness), you must posit something internal to the system that can be aligned *independently* of its output. If alignment were only about output, it would be identical to usefulness (doing what we want). Therefore, you need a second relatum for the alignment relation: the system's "intent," "goals," or "representations."

  However, to satisfy **Ontological Agnosticism**, you cannot presuppose the system *has* intents or goals. Many systems are merely function approximators. If you posit internal "goals" to save Normative Distinctness, you violate Ontological Agnosticism by imputing agency where there may be none.

  If you refuse to posit internal goals to satisfy Ontological Agnosticism, you are forced to define alignment purely behaviorally. But a purely behavioral definition collapses into Usefulness, violating **Normative Distinctness**.

  To escape this, you might try to define alignment as "structural correspondence" (e.g., internal features match human concepts) rather than "goal correspondence." But this risks violating **Operational Non-Circularity**. Asserting that specific internal structures *constitute* alignment presupposes a solution architecture (mechanistic interpretability) that tells us which structures matter. It assumes we know what "honesty" looks like in weights before we have solved the problem of eliciting it.

  Thus, the trio of **Ontological Agnosticism**, **Normative Distinctness**, and **Operational Non-Circularity** forms a tight constraint surface. You can satisfy any two, but satisfying all three requires a definition of alignment that is neither behavioral (usefulness), nor teleological (goals), nor structural (presupposed interpretability). This leaves very little room for a coherent problem statement.

  ### The Most Exclusionary Desideratum

  Among these, **Ontological Agnosticism** does the most exclusionary work.

  Popular formulations of the alignment problem are overwhelmingly teleological. They speak of "value alignment," "goal specification," "reward hacking," and "instrumental convergence." All of these concepts rely on the premise that the system is an optimizer with an objective function that can be misspecified. By demanding Ontological Agnosticism, you exclude the entire framework of classical alignment theory which treats the AI as an agent whose values must be corrected. You force the field to abandon the vocabulary of "values" and "goals" for systems that may not have them, rendering most existing literature technically inapplicable to your definition. While **Normative Distinctness** excludes safety and product definitions, **Ontological Agnosticism** excludes the core theoretical machinery of the alignment community itself.

  \answer{Ontological Agnosticism}
