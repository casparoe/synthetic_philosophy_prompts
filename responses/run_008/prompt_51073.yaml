answer: |-
  Here is a principle constructed to capture your five verdicts, followed by the application to the house-money effect, confidence estimates, and the identified weak spot.

  ### The Principle: Informationally-Grounded Stability (IGS)

  **Statement:** A rational agent's preference ordering over outcomes must satisfy **Synchronic Transitivity** and **Diachronic Stability**. Diachronic Stability requires that preferences remain invariant across time and context unless the change is causally explained by the acquisition of **New Information**. New Information includes empirical data about the world and indexical/phenomenal data about the nature of the outcomes, but excludes changes in temporal proximity or framing that do not alter the expected properties of the outcomes. Rationality evaluates **Dispositions** (policies), not just realized trajectories; therefore, a one-shot violation reveals an irrational disposition. **Precommitment** is rational if and only if it enforces the preference ordering that satisfies IGS against a predicted violation driven by non-informational drift.

  ---

  ### Mapping Your Verdicts to IGS

  **1. The Textbook Cycle (Conference)**
  *   **Verdict:** Irrational.
  *   **IGS Clause:** **Synchronic Transitivity.**
  *   **Explanation:** Even encountered pairwise, the dispositions reveal an intransitive ordering ($A \succ B \succ C \succ A$). This violates the synchronic requirement. The "money pump" is merely the proof of the defect; the defect itself is the intransitivity of the disposition, which exists regardless of whether a pumpeer is present.

  **2. New Information (Shellfish)**
  *   **Verdict:** Rational.
  *   **IGS Clause:** **New Information (Empirical).**
  *   **Explanation:** The friend's testimony changes the probability distribution over the outcomes (Tasting Menu $\to$ Hospitalization). The preference change is grounded in a change in the *description* of the option, not the weighting function.

  **3. Internal Information (Marathon)**
  *   **Verdict:** Rational.
  *   **IGS Clause:** **New Information (Indexical/Phenomenal).**
  *   **Explanation:** At the start line, "running a marathon" is a theoretical concept. At mile 22, "running a marathon" includes the qualia of specific pain. You have learned a property of the outcome that was previously unknown. This counts as information, justifying the preference revision from *Finish* to *Quit*.

  **4. Hyperbolic Discounting (Bonus)**
  *   **Verdict:** Irrational.
  *   **IGS Clause:** **Diachronic Stability & Dispositions.**
  *   **Explanation:** Between December and January, no new information was acquired regarding the value of the fund vs. the trip. The reversal is driven solely by temporal proximity (discount parameter shift). This violates Diachronic Stability. It counts as irrational even as a one-shot because rationality assesses the *disposition* to revise preferences without informational ground. The fact that a trader cannot extract *unbounded* profit is irrelevant; the disposition leaves you vulnerable to *some* exploitation (the one-time transfer), which indicates a flaw in the agency.

  **5. Commitment (Chapter)**
  *   **Verdict:** Rational.
  *   **IGS Clause:** **Precommitment.**
  *   **Explanation:** This is structurally distinct from (4). In (4), you *yield* to the non-informational drift. In (5), you recognize the future drift as a violation of IGS and act to prevent it. The "Present Self" in December satisfies IGS; the "Future Self" on deadline night will violate it. Binding the Future Self aligns the actual outcome with the Informationally-Grounded preference. It is not a preference reversal; it is a constraint on options to preserve the stable preference.

  ---

  ### Prediction: The House-Money Effect

  **Case:** You treat winnings as riskier than salary, knowing "a dollar is a dollar."
  **Prediction:** **Irrational.**

  **Application of IGS:**
  *   **Information Check:** Does the *source* of the dollar (casino win vs. labor) convey new information about the *value* or *utility* of the dollar? You stipulate that you know "a dollar is a dollar." Therefore, the fungibility is known.
  *   **Stability Check:** Your risk preference shifts based on context (mental accounting) without a change in the informational content of the wealth.
  *   **Verdict:** This violates **Diachronic Stability** (or synchronic consistency across frames). The preference change is driven by framing, not information. Under IGS, this is a cognitive bias akin to (4), not a rational update like (2) or (3).
  *   **Caveat:** If you argue that "salary" carries a higher disutility of loss (because it represents labor hours) than "winnings" (windfall), that *could* be framed as informational about the *source's* moral/effort weight. But if you explicitly hold that the utility is strictly in the spending power, IGS condemns the effect.

  ---

  ### Confidence Levels

  1.  **Principle Formulation (IGS):** **85% Confidence.** This synthesizes standard Dynamic Consistency with a broadened definition of Information to accommodate your intuition on the Marathon case. It fits the data you provided.
  2.  **Mapping Cases 1, 2, 4, 5:** **95% Confidence.** These are standard interpretations in decision theory (transitivity, Bayesian updating, dynamic inconsistency, and Ulysses contracts).
  3.  **Mapping Case 3 (Marathon):** **70% Confidence.** This is the most philosophically contentious clause (see Weak Spot below).
  4.  **House-Money Prediction:** **90% Confidence.** Given your stipulation that the agent knows "a dollar is a dollar," standard theory classifies this as irrational framing.
  5.  **One-Shot Money Pump (Case 4):** **80% Confidence.** Some theorists argue rationality is outcome-relative. However, your verdict ("defect is in the dispositions") aligns with the dispositional view, which IGS adopts.

  ---

  ### The Weak Spot: Case 3 (The Marathon)

  **I expect the treatment of Case 3 to be the point most likely to be wrong.**

  **Why:** The distinction between "learning what the pain is like" (Case 3) and "feeling more impatient" (Case 4) is notoriously slippery.
  *   **The Risk:** If "phenomenal experience" counts as New Information, almost any preference change can be rationalized. An agent could claim, "I didn't just change my mind about the bonus; I *experienced* the January closeness, which is new data."
  *   **The Counter:** To save IGS, one must distinguish between **Information about the Outcome** (Case 3: the marathon *is* painful) vs. **Information about the Temporal Position** (Case 4: the bonus *is* closer).
  *   **The Vulnerability:** Decision theory typically treats time as a parameter, not a property of the outcome. If you allow "experiencing time passing" to count as information that justifies discounting, you collapse IGS into triviality. If you disallow it, you contradict your verdict on the Marathon.
  *   **Refinement Needed:** A robust defense requires a theory of **Essential Properties**. Pain is an essential property of running a marathon that was epistemically hidden. Temporal proximity is a relational property of the *agent* to the outcome, not a property of the outcome itself. IGS relies on this distinction holding firm, but metaphysics of time and value are disputed terrain here.

  If Case 3 is actually irrational (i.e., you *should* have stuck to the start-line plan because the pain was probabilistically expected), then IGS needs to tighten its definition of "Information" to exclude phenomenal surprise, which would contradict your stated verdict. If Case 3 is rational, IGS must walk the tightrope of defining "phenomenal info" without allowing "temporal info" to sneak in. That is the fragile joint in the argument.
