prompt: |-
  My brother in law is one of those people who thinks every single trait has a purpose — cats kneading blankets is "to stimulate milk flow so they feel safe", humans liking sugar is "to fatten us up for winter", and his favorite, we blush because it evolved to prove we're telling the truth. I watch enough nature documentaries to be suspicious but not enough to argue back. I vaguely remember there's an old famous argument about cathedral arches, how the pretty spaces between them are just what you get for free when you build arches and nobody designed them, but I can't reconstruct it well enough to use it.

  So I want a checklist I can actually run in my head at thanksgiving. Turn whatever the actual counter-argument to "everything is for something" is into questions I ask about any "this evolved in order to do X" claim, in order: what has to be true about the trait's history for the story to work, what rival explanations need to be ruled out first (it's a side effect of something else that WAS selected for, or a leftover from an ancestor that used it differently), how much evidence seperates a real adaptation claim from a just-so story, and where the checklist has to stop because it's really my gut talking and not the biology. I want to know which questions do the most work, and one example where the checklist gives an answer I probably won't like (I assume it won't save me on the sugar one). Then run it on the three claims above — kneading, sugar, and blushing. Assume I know nothing about genetics past high school, and keep it short enough that I can hold the whole thing in my head while he's mid-lecture.
