  8.  **Refining the Arguments:**
      *   *Trilemma:* Be explicit. $A \to K$, $Future \to \neg K$, $Assert(Future)$. Contradiction.
      *   *Lottery:* This is the "Statistical vs. Causal" evidence distinction. Warn the user that opponents will pounce on why the bus case isn't a lottery case.
      *   *Hedging:* Distinguish between asserting $p$ and asserting "Probably $p$".
      *   *Revision:* Dropping (5) is the cleanest. It aligns (2) and (4). If I can know the bus is the 73, I know it will arrive. Why is the coach different?
      *   *Cost of Revision:* You lose the metaphysical intuition that the future is "open." You have to argue that "settledness" isn't a precondition for knowledge.

  9.  **Self-Correction/Review during drafting:**
