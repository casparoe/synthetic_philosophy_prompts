          *   *Critique:* This is actually reversed or confused. In GEB, individual ants are usually analogous to *neurons* (low-level active units), and clusters/teams of ants are analogous to *symbols* (high-level active constituents of thought). The student says ants are like letters/symbols and clusters are like neurons. This is a significant misunderstanding of Hofstadter's specific mapping.
