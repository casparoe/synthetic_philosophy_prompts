answer: |-
  The single best defeater is **computational intractability of mutual verification**. Acausal trade requires you to simulate the counterparty simulating you to verify compliance. If physical limits (like computational complexity bounds) prevent two agents from mutually modeling each other's decision processes to the confidence threshold required for trust, the mechanism collapses. It's not just "hard"; it's a hard constraint on the logical correlation needed for FDT to recommend cooperation.

  The view leans on three fragile premises:
  1.  **Relevant Counterparties Exist:** If we are the only agent capable of FDT-style reasoning in our reference class, trade is impossible. A decisive observation would be evidence that intelligence capable of UDT is uniquely rare (e.g., specific evolutionary bottlenecks).
  2.  **Preference Overlap:** Trade requires gains. If most agents value things orthogonal to us, no bargain exists. Proponents concede this reduces volume but argue *some* overlap is probable. A decisive argument would show preference orthogonality is near-universal among superintelligences.
  3.  **Measure Weighting:** You must weight these agents significantly in your expectation. If the "measure" of trading partners is vanishingly small compared to causal impacts, AT becomes negligible.

  Proponents will **explain away** lack of causal contact or the silence of the universe by positing partners exist in other Everett branches or simulation layers. They must **concede**, however, that if the *logical* probability of another agent running the same decision algorithm is low, the trade vanishes. They cannot explain away a proof that mutual simulation is physically impossible.

  Regarding insulation: Is this flexibility fatal? Yes, if it decouples from independent priors. Probabilistic reasoning about distant agents requires updating on evidence; if the "measure" parameter absorbs all negative evidence (e.g., "we see no aliens, so they must be in other branches with higher weight"), it violates Bayesian updating. It becomes fatal if it allows the theory to predict nothing specific. However, if weights are derived from independent anthropic principles (e.g., Solomonoff prior), the flexibility is just uncertainty. Currently, AT often lacks the latter, risking unfalsifiability. A committed proponent must concede that if independent priors suggest partner probability is low, AT matters less than causal ethics. If they refuse to bind the measure to independent cosmological or anthropic evidence, the flexibility is fatal—it turns decision theory into motivated reasoning.
