  2.  **Identify the Core Mechanism of Acausal Trade:**
      *   AT relies on Functional Decision Theory (FDT) or Updateless Decision Theory (UDT).
      *   It requires:
          1.  Existence of other agents (often in other branches/worlds).
          2.  Mutual knowledge/modeling capability (I can predict you, you can predict me).
          3.  Alignment of incentives (trade is beneficial).
          4.  Logical correlation between decisions (my choice is evidence of yours).

