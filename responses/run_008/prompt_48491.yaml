      *   *Computational Intractability:* Modeling another superintelligence perfectly might be impossible due to complexity bounds.
      *   *Measure/Weighting:* How much do we weight these other agents? If the measure is tiny, trade doesn't matter.
      *   *Uniqueness:* Maybe we are the only agents capable of this.
      *   *Preference Mismatch:* Maybe other agents don't value what we value (no gains from trade).
      *   *Insulation:* The theory adjusts weights to fit any outcome.
      *   *The "Best Defeater":* What actually breaks the mechanism? The most robust objection is usually about the *correlation* itself. If the logical correlation is weak or non-existent, the trade collapses. But the user accepts FDT-ish reasoning. A stronger defeater is about the *prior* over other agents. If the prior probability of relevant counterparties is low enough, expected utility drops to negligible.
