prompt: |-
  I've been convinced for a while now that acausal trade is a real phenomenon and that it actually matters for what we should do — roughly, that agents who can never causally interact can still strike bargains by reasoning about each other's reasoning, and that this should change things like how much we invest in making our AI systems cooperative, since our choices are evidence about what other civilizations' choices look like. I'm not asking you to argue me out of the whole thing, I want you to play it straight as a decision theorist and tell me what would count against it. And I don't just mean the obvious "maybe FDT is wrong" — I want the full map of where this view is exposed: which premises it secretly leans on (that other agents exist, that they're roughly as powerful as us so trade is worth it, that each side can verify or at least predict the other's compliance), what observations or arguments would be decisive versus merely awkward, and which parts a committed proponent would concede count against them versus explain away. Also be honest about whether the position has been insulated — a lot of acausal trade talk can absorb almost any objection by adjusting how good the trade is or how much you weight the counterparties, and I want to know if that flexibility is fatal for a view of this kind or just how probabilistic reasoning about far-away agents has to look. Please think carefully and brainstorm broadly before answering, but only include the objections that would actually move someone. Keep it under 500 words, and lead with your single best candidate for a real defeater.
