answer: |-
  Your hypothesis is correct, but it underestimates the depth of the impasse. You suggest the disagreement is about what kind of *existence claim* a cognitive-state term makes (natural-kind vs. functional/interpretive). I would sharpen this: the disagreement is not merely about semantics or reference, but about **ontological category**.

  The eliminativist treats beliefs as candidates for **causal ontology** (things that push meat around). The anti-eliminativist (specifically the interpretivist/constitutivist strand you describe) treats beliefs as candidates for **normative ontology** (statuses that make actions intelligible).

  The reason the debate stalls is not that both sides are stubborn, but that they are playing different games with the same pieces. The eliminativist is playing *Empirical Science* (where posits are validated by structural correspondence to mechanism). The anti-eliminativist is playing *Transcendental Pragmatics* (where posits are validated by indispensability to the practice of interpretation). When the eliminativist says, "There is no sentence in the brain," and the anti-eliminativist replies, "But you can't make sense of the agent without it," they are not contradicting each other. They are talking past each other because one is describing a mechanism and the other is describing a condition of possibility.

  Here is the diagnosis of the structure, followed by the constraints you requested.

  ### 1. The Structure of the Disagreement: Incommensurable Standards of Adjudication

  The dispute is **two different questions travelling under one name**, but it presents as **substantive-but-stalled** because neither side is willing to cede the term "real" to the other's category.

  *   **The Eliminativist Question:** "Does the causal structure of the cognitive system instantiate the propositional architecture posited by Folk Psychology (FP)?"
      *   *Standard of Adjudication:* Isomorphism. Do the neural vectors look like logical sentences? If no, FP is false.
  *   **The Anti-Eliminativist Question:** "Is the intentional stance indispensable for predicting and explaining the behavior of this system?"
      *   *Standard of Adjudication:* Indispensability. Can we navigate the world without treating this system as a believer? If no, beliefs are real.

  The stalemate arises because "Real" is being used as a trophy in a tug-of-war. The eliminativist wants to reserve "Real" for *Causal Powers*. The anti-eliminativist wants to reserve "Real" for *Indispensable Patterns*.

  This is why you sense question-begging.
  *   To the eliminativist, the anti-eliminativist begs the question by assuming that *explanatory utility* equals *ontological commitment*. (Just because phlogiston explained combustion didn't make it real).
  *   To the anti-eliminativist, the eliminativist begs the question by assuming that *neural structure* is the only arbiter of *mental reality*. (Just because a software program isn't made of gears doesn't mean it isn't calculating).

  **Diagnosis:** The debate is verbally entangled but substantively insulated. It is a clash between **Scientific Naturalism** (the world is what fundamental physics says it is) and **Transcendental Pragmatism** (the world of agents is what rational interpretation says it is). Neither can refute the other because they do not share a meta-ontological framework for deciding what "existence" means in this context.

  ### 2. Constraint One: What Would Count as Progress?

  Given this diagnosis, progress is unlikely to look like a victory for one side. Instead, progress would take one of two forms, neither of which your group seems likely to accept (which explains the stagnation).

  **A. Disambiguation (The Optimistic Path):**
  Progress would require the group to stop asking "Do beliefs exist?" and start asking two distinct questions:
  1.  "Are propositional attitudes causally efficacious structural units in the brain?" (The Eliminativist's turf).
  2.  "Is the attribution of propositional attitudes constitutive of agency?" (The Interpretivist's turf).

  If the group accepted this split, the debate would dissolve. They could agree that beliefs do not exist *causally* (neurons don't have syntax) but do exist *normatively* (you cannot treat a human as a human without them).
  *   *Why this hasn't happened:* Both sides want the whole prize. Eliminativists want to say beliefs are *myths* (false), not just *causally distinct*. Interpretivists want to say beliefs are *literally true*, not just *useful fictions*. To accept the split is to concede that their opponent is right about the definition of "existence" in the opponent's domain.

  **B. Admission of Insulation (The Pessimistic Path):**
  Real progress might be the recognition that **no common standard of adjudication is possible.**
  *   The Eliminativist relies on the authority of *future physics/neuroscience*.
  *   The Interpretivist relies on the authority of *current phenomenological/pragmatic necessity*.
  *   There is no "super-science" that can adjudicate between physics and pragmatics because any such science would have to use pragmatics to be understood and physics to be grounded.

  If your group accepts this, the "progress" is the cessation of the expectation that one side will win. The debate is not a puzzle to be solved but a tension to be managed.

  ### 3. Constraint Two: The Neuroscience/Engineered System Case

  You asked: *Suppose we had a detailed neuroscience or engineered system that predicted behavior as well as belief-desire attribution. Would that settle anything?*

  **Diagnosis:** No. It would reinforce the stalemate. Here is how each side absorbs the victory, demonstrating why the empirical data is theory-laden to the point of incommensurability.

  **The Scenario:** A "Perfect Predictor" (PP) exists. It uses a sub-symbolic, vector-space taxonomy (no "belief that p," just activation patterns) to predict human action with 100% accuracy.

  **The Eliminativist Absorption:**
  *   **Claim:** The PP vindicates elimination.
  *   **Reasoning:** The PP works *without* invoking beliefs. Therefore, beliefs are not necessary for prediction. Since the PP mirrors the actual causal machinery (unlike FP), the PP's ontology is the true one. FP is revealed as a "user-illusion" or a lossy compression algorithm.
  *   **Ontological Commitment:** Existence requires causal specificity. Since the PP shows the causal specificity is non-propositional, propositions do not exist.

  **The Anti-Eliminativist Absorption:**
  *   **Claim:** The PP vindicates instrumental realism (or implementation).
  *   **Reasoning:** The PP predicts *agents*. To build the PP, engineers had to model the rationality of the system. The vector states in the PP *realize* the belief states, even if they don't look like sentences. Furthermore, to *use* the PP's output, humans will still have to translate those predictions back into intentional terms (e.g., "The model predicts he will go to the fridge" implies "He believes there is food").
  *   **Ontological Commitment:** Existence requires pattern stability. The pattern of rationality is real regardless of the substrate. The PP is just a microscopic view of the same intentional reality.

  **Why this doesn't settle it:**
  The crux is the **Level of Description**.
  *   The Eliminativist argues that if the *lower level* (neurons/vectors) does not contain the property, the *higher level* (belief) is eliminated (like heat being eliminated by molecular kinetic energy, though this analogy is contested).
  *   The Anti-Eliminativist argues that the *higher level* is autonomous. The fact that a computer is made of silicon doesn't mean it isn't "calculating." The fact that a brain is made of neurons doesn't mean it isn't "believing."

  The empirical success of the PP is compatible with **Eliminativism** (FP was false about the mechanism) and **Non-Reductive Physicalism** (FP was true about the pattern, false about the mechanism). Since the debate is about the *status of FP*, not just the mechanism, the PP data is underdetermined.

  ### Conclusion: A Pessimistic Synthesis

  Your hypothesis is right: it is about the kind of existence claim being made. But the reason it is stalled is not just that the definitions differ, but that **both definitions claim exclusive authority over the concept of "Mind."**

  *   If the Eliminativist wins, "Mind" becomes a branch of neurodynamics, and the "space of reasons" collapses into the "space of causes."
  *   If the Anti-Eliminativist wins, "Science" becomes subordinate to "Interpretation," and empirical refutation is barred from the mental realm.

  This is not a scientific dispute; it is a **jurisdictional dispute** between two ways of making sense of the world.
  *   **Eliminativism** protects the unity of science (everything must be continuous with physics).
  *   **Interpretivism** protects the autonomy of meaning (reasons cannot be reduced to causes).

  **Final Verdict:** Do not expect progress. The debate runs for decades without resolution because it is a proxy war for the soul of naturalism. To resolve it, one side would have to abandon its foundational commitment: either the commitment that *causal closure is the only reality* (Eliminativist) or the commitment that *rational intelligibility is irreducible* (Interpretivist).

  Your group ends in the same place because that place is the **boundary condition of Naturalism itself**. You are not stuck in a loop; you are circling the perimeter of what a naturalistic worldview can accommodate. The silence at the end of the session is the sound of hitting the wall. Acknowledge the wall, rather than trying to punch through it.
