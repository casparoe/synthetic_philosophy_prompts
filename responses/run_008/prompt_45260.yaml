      On one reading, the transparency changes the game itself. Once each player can condition on the other's code, the payoff-relevant structure is no longer that of a Prisoner's Dilemma, so the cooperation result is a fact about a different game and says nothing about rationality in the ordinary one. On a second reading, mutual code access is just a commitment device, so the result repackages what binding contracts or repeated interaction already achieve. On a third reading, the result is a discovery about solution concepts. Mutual cooperation of the prove-it-first kind is an equilibrium of the induced game, but so are various asymmetric and exploitative profiles, and the interesting question is which equilibrium notion, if any, makes cooperation the uniquely rational outcome. My proposal states a precise version of this question: under exactly what conditions does mutual source-code access make mutual cooperation the unique rational outcome of a one-shot Prisoner's Dilemma, and are those conditions best modeled as a change in the game, an added commitment technology, or a revision of the solution concept?

