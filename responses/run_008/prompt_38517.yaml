      *   *The Debate:* Can a rational agent form an intention to do something they know they won't do? (Intention vs. Prediction). Can you self-modify to become the kind of agent who drinks? (Resolute Choice vs. Sophisticated Choice).
      *   *Newcomb Connection:* Similar structure (prediction of your state determines reward), but Toxin is about *intention* rather than *choice* under prediction.

