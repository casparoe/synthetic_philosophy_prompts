  1. **The scenario**
  During high-pressure emergency rounds, an Attending Physician (Hearer) adopts a corrective policy: prioritizing the diagnostic testimony of a Junior Intern (Beneficiary) from a marginalized group, historically silenced by hierarchy. The Intern suggests a rare cardiac condition. Normally, the Attending would defer to the Senior Nurse (Third Party), who suggests a common respiratory issue. Due to the corrective policy, the Attending grants the Intern's assessment decisive credibility, committing the team to cardiac testing. The Nurse attempts to interject with conflicting vitals, but the Attending dismisses this, stating the Intern's diagnosis is now the working truth. The policy is justified by the need to dismantle systemic silencing, yet the Nurse's testimony is functionally excluded from the evidential space.

  2. **The baseline injustice**
  Without the policy, this is standard testimonial injustice. The Intern suffers a credibility deficit solely due to identity prejudice (junior status compounded by marginalization). The Attending would instinctively distrust the Intern's assessment in favor of the Nurse's, not based on evidence, but on stereotypical expectations of competence. The Intern is wronged qua knower because their capacity to contribute knowledge is systematically undermined by prejudice. This fits Fricker's definition perfectly: identity prejudice causes a credibility deficit.

  3. **The new wrong**
  In the corrected version, the Nurse is wronged qua knower. Their testimony is dismissed not because of prejudice against nurses, but because the Intern's boosted credibility monopolizes the limited epistemic attention available. The Nurse is treated as epistemically superfluous; their agency is sidelined because the "slot" for authoritative testimony is filled by the Intern. This is not mere bad luck; the Nurse is actively prevented from functioning as a knower. Their contribution is rendered invisible by the excess credibility granted to the Beneficiary, creating a downstream credibility deficit for the Third Party. The wrong lies in the structural displacement: the Nurse's epistemic agency is curtailed because the Hearer's commitment to the Intern's validity precludes hearing conflicting evidence. The Nurse is reduced to a noise source rather than a knowledge source.

  4. **Does the definition stretch?**
  Strictly, this falls outside Fricker's definition. Testimonial injustice requires identity prejudice against the *victim*. Here, the Nurse suffers a deficit, but not due to prejudice against them. To register this harm as testimonial injustice, we must stretch the definition to cover "structural displacement" where credibility excess for one group necessitates a deficit for another due to resource scarcity. This costs us the clarity of the prejudice condition. However, if we view testimonial injustice as a systemic evil rather than individual acts, the Nurse's exclusion is part of the same unjust structure. The harm is epistemic, but the mechanism is distributive scarcity rather than direct prejudice. I argue the definition must stretch to capture downstream epistemic harms, or we need a new category of "secondary testimonial injustice." If we refuse the stretch, we imply the Nurse suffers no injustice, only inconvenience. But their capacity as a knower is damaged. Therefore, the definition should expand to include cases where corrective excess creates unintended epistemic exclusion, acknowledging that justice interventions can have epistemic casualties without validating the prejudice against the victim.

  5. **What's doing the work**
  The load-bearing feature is the zero-sum epistemic resource constraint (time/attention). The wrong travels through the middle speaker because the Hearer cannot accommodate both testimonies as definitive. If you delete the constraint (infinite time), the Hearer listens to both, and the Nurse is not wronged. If you delete the triad (only Hearer and Intern), there is no third party to harm. The triadic structure allows the injustice to migrate. The corrective policy shifts the credibility distribution, but the scarcity forces a choice that manifests as a deficit for the bystander.

  6. **The two defenses**
  The Fricker-style defender argues the Hearer commits no injustice against the Nurse; there is no prejudice, only a tragic trade-off. The Nurse's dismissal is epistemically regrettable but not unjust. The Medina-style defender argues the real injustice is the credibility excess itself, which distorts the epistemic environment. The Nurse's harm is a symptom of this distortion, not a separate injustice. The Medina defense is stronger for preserving the "excess is unjust" thesis, but it risks instrumentalizing the Nurse's harm. If the excess is the only injustice, the Nurse's specific wrong qua knower is obscured. This leaves the case in a bind: either the Nurse is unjustly treated (stretching Fricker) or the Nurse is merely collateral damage (weakening the claim that excess *itself* is testimonial injustice against the third party). Ultimately, the Medina view better captures the structural nature of the harm, suggesting that credibility excess is unjust precisely because it inevitably displaces other knowers in non-ideal conditions. The Frickerian view is too atomistic to capture this systemic displacement.

  **Viability & Refinement Check**
  Is there a dominating refinement? A refined policy would be: "Weight the Intern's testimony higher, but verify with the Nurse before committing." However, in this specific emergency scenario, the constraint is *mutually exclusive immediate action* (Cardiac vs. Respiratory intervention). Verifying both takes time the patient does not have. Thus, no dominating refinement exists *under these constraints*. The case collapses if the zero-sum constraint is removed; if the Hearer could listen to both without cost, the dismissal of the Nurse becomes simple negligence, not structural injustice. Another weakness: if the Nurse is from a dominant group, critics may argue their "wrong" is merely pragmatic, not epistemic injustice. To prevent this, the scenario must emphasize that the Nurse's *authority* is stripped, not just their advice ignored. The case holds, but it is fragile; it depends entirely on the scarcity of epistemic attention.
