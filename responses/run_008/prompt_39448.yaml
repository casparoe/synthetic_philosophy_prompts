answer: |-
  Yes, there is an established name for this pattern, a specific literature surrounding it, and a rigorous debate regarding its validity. You have independently reconstructed a concept that sits at the intersection of decision theory, game theory, and moral philosophy.

  The specific puzzle you describe (the trillionaire and the telegrams) is famous. It appeared in Douglas Hofstadter's "Metamagical Themas" column in *Scientific American* in 1983. Hofstadter coined the term **Superrationality** for exactly this mode of reasoning.

  However, "Superrationality" is the recreational mathematics label. In contemporary academic decision theory and economics, the pattern is formalized under **Functional Decision Theory (FDT)** (also called Logical Decision Theory) and, in economics, as **Kantian Equilibrium**.

  Here is the breakdown of the concept, the literature on its validity, and specifically how the literature handles your "scope/similarity" problem.

  ### 1. The Names and The Literature

  **A. Superrationality (Hofstadter)**
  Hofstadter defined superrational thinkers as those who know that all participants are rational, know that they all know, and therefore recognize that they will all arrive at the *same* answer to the same problem.
  *   **The Logic:** If the problem is symmetric and we are all rational, we will all choose the same strategy $S$. Therefore, I should choose the $S$ that maximizes utility assuming everyone chooses $S$.
  *   **The Telegram Case:** Hofstadter explicitly argued for the $1/N$ randomization strategy you intuited. He ran a version of this contest with readers; those who reasoned superrationally sent telegrams with probability $1/20$.
  *   **Source:** Hofstadter, D. R. (1985). *Metamagical Themas: Questing for the Essence of Mind and Pattern*. (Specifically the chapters "The Prisoner's Dilemma and the Logic of Superrationality" and "Platonia Dilemma").

  **B. Functional Decision Theory (Yudkowsky & Soares)**
  This is the modern formalization of your intuition. Standard **Causal Decision Theory (CDT)** says your choice cannot causally influence a stranger's independent choice. **Evidential Decision Theory (EDT)** says your choice is *evidence* of their choice. **FDT** goes further: it says your decision is the output of an algorithm. If another agent is running a sufficiently similar algorithm, their output is *logically correlated* with yours, even without causal contact.
  *   **The Logic:** You do not ask "What happens if I do X?" You ask "What happens if my decision *function* outputs X?" Since similar agents run similar functions, changing your output implies (counterfactually) changing theirs.
  *   **Source:** Yudkowsky, E., & Soares, N. (2017). "Functional Decision Theory: A New Theory of Instrumental Rationality." *MIRI*.

  **C. Kantian Equilibrium (Roemer)**
  In economics, John Roemer formalized this as "Kantian Optimization." Unlike Kant's moral imperative, this is instrumental. Agents ask: "What would happen if everyone in my reference group did what I am about to do?"
  *   **Source:** Roemer, J. E. (2010). "Kantian Equilibrium." *Scandinavian Journal of Economics*.

  ### 2. Is It "Good"? (The Validity Debate)

  Your friend who calls it the "one-boxer's fallacy" is voicing the standard objection from **Causal Decision Theory (CDT)**.

  *   **The CDT Objection:** The other players' choices are already fixed (or determined by causes independent of your current thought). Your telegram cannot physically stop theirs. Therefore, maximizing expected utility based on a correlation you cannot influence is "magical thinking." In the telegram case, CDT says: "If I think others will send telegrams, my best move is *not* to send one (to avoid splitting). If I think they won't, my best move is *to* send one. My choice doesn't change their probability."
  *   **The FDT/Superrational Defense:** The correlation is not magical; it is logical. If you and the others are identical reasoning machines facing identical inputs, you cannot output different decisions. To imagine you cooperate while they defect is to imagine a logical impossibility (like imagining $2+2=5$). Therefore, the only coherent counterfactuals are those where your decision and theirs vary together.
  *   **The Verdict:** There is no consensus. CDT remains the standard in classical economics and philosophy. FDT/Superrationality is dominant in AI alignment circles and certain branches of game theory. However, in the specific case of the **Trillionaire Telegram**, almost everyone agrees the $1/N$ strategy is the only way to win *if* the group is homogeneous. If the group is heterogeneous, CDT often outperforms.

  ### 3. The Scope Problem: "How Alike?"

  This is where your intuition is sharpest, and where the literature has specific tools. You asked: *If I learn one of the twenty is a fanatic, does the deduction collapse?*

  **In Superrationality:**
  Hofstadter addressed this. Superrationality relies on **Common Knowledge of Rationality**. If you know one agent is a "fanatic" (i.e., not superrational, or running a different algorithm), you remove them from the superrational set.
  *   **The Calculation:** If there are 20 people, but you know 1 is a fanatic who will definitely telegram, you now calculate for $N=19$ superrational agents + 1 fixed agent.
  *   **The Collapse:** The $1/20$ probability collapses to a new optimal probability for the remaining 19. If the fanatic sends a telegram, the remaining 19 should lower their probability to ensure the total expected telegrams remains 1. If the fanatic *doesn't* send one, the 19 should raise their probability.
  *   **The Threshold:** There is no binary threshold. It is a continuous variable of **correlation strength**. In FDT, this is handled by "logical uncertainty." You assign a probability $P$ that the other agent is running the same algorithm as you.
      *   If $P=1$ (perfect copy): You cooperate/randomize fully.
      *   If $P=0$ (random/unknown): You defect/optimize causally (CDT).
      *   If $P=0.5$: You weigh the expected utility of the correlated outcome against the uncorrelated one.

  **In the Voting Case:**
  This is the "Ethical Voter" model. The standard rational choice model (Downs, 1957) says voting is irrational because the probability of being pivotal is near zero.
  *   **The Superrational Counter:** You are not voting to be pivotal; you are voting as a member of a reference class. If you are the sort of person who votes, others like you are too.
  *   **The Scope:** The literature (e.g., Edlin, Gelman, and Kaplan, 2007, "Voting as a Rational Choice") suggests you should vote if: $Cost < Benefit \times Probability(Pivotal) \times CorrelationFactor$.
  *   **Similarity:** The correlation factor depends on how many people reason like you. If you are unique, the factor is 1 (CDT). If you are one of a million similar thinkers, the factor is $1,000,000$. The "similarity" is defined by the **reference class** you choose. This is the weak point: selecting the reference class is subjective. (e.g., "All citizens" vs. "All people who read this blog").

  ### 4. Distinguishing from Newcomb and Kant

  You were right to doubt your friends' comparisons.

  *   **Vs. Newcomb:** In Newcomb's Problem, the correlation is caused by a Predictor observing you. In your case, the correlation is caused by **Shared Structure**. FDT unifies these: it treats both as "logical correlation." The difference is that in Newcomb, the predictor is external; in your case, the "predictor" is the shared logic internal to the agents. FDT argues this distinction doesn't matter for the decision calculus.
  *   **Vs. Kant:** You are correct that Kant is deontological (duty-based). Your reasoning is consequentialist (outcome-based). Roemer's "Kantian Equilibrium" is the precise term for what you are doing: applying the *form* of universalization to *instrumental* rationality.

  ### 5. Summary and Recommendation

  **The Name:**
  If you are speaking to philosophers or economists, call it **Kantian Optimization** or **Team Reasoning**.
  If you are speaking to decision theorists or AI researchers, call it **Functional Decision Theory**.
  If you are speaking to mathematicians or puzzle enthusiasts, call it **Superrationality**.

  **The Answer to "Is it any good?":**
  It is instrumentally superior **if and only if** the correlation exists.
  *   In the Telegram puzzle: It is the *only* strategy that yields a positive expected value for the group, and for the individual *if* they trust the others are superrational.
  *   In the Prisoner's Dilemma: It yields cooperation (higher payoff) against similar agents, but leaves you vulnerable to exploitation by CDT agents (defectors).
  *   In Voting: It provides a rational justification for voting where CDT fails, provided you believe there are enough "like-minded" voters to make the aggregate impact non-negligible.

  **The Answer to "Scope/Similarity":**
  The literature handles this via **conditional probability**. You do not assume everyone is like you. You estimate the proportion of the population that is "superrational" (or runs your algorithm).
  *   **The Fanatic Case:** If you identify a fanatic, you condition on their fixed action and recalculate for the remaining variable agents. The logic does not collapse; it updates.
  *   **The Boundary:** The boundary is **logical similarity**. If you can simulate their reasoning and predict they will arrive at your conclusion, they are "like you." If their reasoning is opaque or fundamentally different (e.g., they value chaos over money), the correlation breaks, and you should revert to Causal Decision Theory (defect/don't vote).

  **Defensible Definition:**
  If you need to define this for your friend without jargon:
  > "It is **Algorithmic Correlation**. I am not assuming my choice causes theirs. I am assuming that because we face the same problem with the same data and similar reasoning hardware, our outputs will correlate. I choose the output that is optimal for the correlated state, weighted by my confidence in that correlation."

  This preserves your intuition (it's evidential/logical, not causal) while acknowledging the risk (if the correlation assumption is wrong, you get exploited).
