      *   *Logical Decision Theory (LDT) / Functional Decision Theory (FDT):* This is the modern descendant of EDT/CDT debates, specifically designed for cases where agents share source code or reasoning algorithms. This seems like the strongest match. FDT explicitly handles "subjunctive dependence" or "logical correlation."
      *   *Superrationality:* Coined by Douglas Hofstadter. This fits the "trillionaire telegram" puzzle perfectly. Hofstadter specifically discussed this puzzle (or very similar ones) in *Scientific American*. The core idea is that rational agents facing the same problem will arrive at the same answer.
      *   *Kantian Equilibrium / Kantian Optimization:* Hillel Steiner and others have discussed this in economics. Choosing as if your choice sets the universal rule.
      *   *Team Reasoning:* Bacharach and others. Acting as a "we" rather than an "I".
