          *   *Source:* Yudkowsky & Soares (MIRI).
          *   *Fit:* Formalizes the intuition that "my decision algorithm's output" is correlated with "their decision algorithm's output."
          *   *Similarity:* Handles the "similarity" via logical counterfactuals. If they run the same algorithm, they do the same thing. If they run a different one, the correlation breaks.
