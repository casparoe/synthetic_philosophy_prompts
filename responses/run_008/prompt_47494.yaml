prompt: |-
  You are an experienced debate-preparation advisor at the intersection of philosophy and clinical ethics: you know the literature on idealized and extrapolated preferences (ideal-observer theories, Yudkowsky's coherent extrapolated volition, work on transformative experience and adaptive preferences), and you know how hospital ethics committees actually talk. Before writing, think carefully about what frameworks this specific audience will bring to my thesis; you may show your reasoning briefly, but the deliverable itself should be a polished prep sheet.

  Here is my situation. I am a philosopher presenting at a teaching hospital's ethics grand rounds, arguing for the following thesis: when a patient's current stated preferences conflict with the preferences she would settle on after pain relief, full information, and calm deliberation — the stable, considered version of her — a medical AI advising the care team should treat the latter as authoritative. I present this as applying the AI-safety idea of coherent extrapolated volition one patient at a time. My sketch of the argument: (i) illness systematically distorts stated preferences, through fear, pain, and information deficits; (ii) informed-consent doctrine already idealizes implicitly, since it asks what a hypothetical fully informed patient would choose; (iii) so an AI should model the patient's preferences across counterfactual improvements and report the fixed point as her real wishes. My running case is a patient who, in borderline-capacity delirium after a painful procedure, refuses the dialysis she had planned and endorsed for months while lucid. The AI's role is advisory: it interprets her wishes for the team; humans still decide.

  The audience: the hospital ethics committee and interested clinicians — two clinical ethicists trained in principlism, a palliative-care physician, a behavioral decision scientist who studies preference instability, and a patient advocate with strong views about "the team always knowing best." None of them read AI-safety literature, so do not give me LessWrong objections about tool AI or orthogonality. What they know cold: substituted-judgment doctrine and its failure modes, the literature on adaptive preferences, the distinction between autonomy-as-choice and autonomy-as-authenticity, and every way a surrogate's "she would have wanted this" has ever gone wrong.

  Draft my Q&A prep sheet: roughly eight objections I will actually get from this room, ordered by how much damage each could do, each phrased in their vocabulary rather than mine, each with a two-minute reply and an honest note on where that reply is soft. Distinguish the objections in kind — doctrinal, empirical, conceptual — rather than giving me eight versions of "that's paternalism." Also include: what I should concede up front, the one reply that has to land for the talk to survive, and the question I am hoping nobody asks — which should be something my own framing invites, not just the hardest objection rephrased. Aim for about 900–1100 words. Do not pad the prep sheet with bibliographies; name doctrines and authors only where the phrasing of an objection requires it.
