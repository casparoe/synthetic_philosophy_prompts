answer: |-
  **Q&A PREP SHEET: ETHICS GRAND ROUNDS**

  **Strategic Overview**
  **Concede Up Front:** Acknowledge the AI is advisory, not decisive. Admit extrapolation models are probabilistic, not oracle-like. This disarms the "black box" fear and positions you as a collaborator, not a disruptor.
  **The One Reply That Must Land:** You must convince them this is not *overriding* autonomy but *restoring* it. Frame delirium as temporary incapacity (like intoxication). The AI assists capacity assessment; it does not bypass it. If this fails, you are just a high-tech paternalist.
  **Hope Nobody Asks:** "Who trains the model on what 'calm deliberation' looks like?" This exposes hidden normativity. Your framework assumes a specific, possibly Western, rationalist ideal of deliberation. If pressed, pivot to "local value learning" from the patient's own history, but admit this is the hardest technical/ethical hinge.

  ***

  **1. Doctrinal (Legal): "A competent patient's current refusal is absolute. Law protects the right to be wrong."**
  **Reply:** Competence is decision-specific, not global. Delirium impairs understanding and appreciation. We treat intoxicated refusals as non-binding; this is analogous. The AI flags the impairment; it doesn't veto the patient. It supports the team in honoring the patient's *legal* wishes, which require capacity.
  **Soft Spot:** Borderline capacity. If she scores 25/30 on MacCAT, does the AI override? You lack a clear threshold for when extrapolation kicks in.

  **2. Conceptual (Paternalism): "This is paternalism dressed as authenticity. You're privileging past values over present experience."**
  **Reply:** Authenticity requires coherence. Pain induces myopia. We honor the 'whole life' narrative, not just the distressed moment. This aligns with autonomy-as-authenticity, not just autonomy-as-choice. We are protecting her from a temporary self that contradicts her enduring commitments.
  **Soft Spot:** People change. If she genuinely evolved, not just distorted, you risk ignoring legitimate transformation. Distinguishing growth from distortion is subjective.

  **3. Empirical (Epistemic): "You cannot computationally model counterfactual preferences. Preference instability is fundamental, not just noise." (Decision Scientist)**
  **Reply:** We model heuristics now via surrogates. AI aggregates longitudinal data better than humans. It's a probabilistic aid, not a calculation of truth. It reduces the error margin of human guesswork regarding what the patient would choose if well.
  **Soft Spot:** Overconfidence. Clinicians may treat the probability as a certainty. The "output" looks more definitive than the underlying data supports.

  **4. Clinical (Palliative): "Pain isn't just noise; it reveals what matters. Palliation changes values legitimately." (Palliative Care)**
  **Reply:** Nociceptive pain distorts cognition; existential suffering reveals values. The AI must distinguish physiological distress from spiritual shift. We are extrapolating from pain relief, not eliminating suffering. The goal is clarity, not comfort-induced compliance.
  **Soft Spot:** Hard to distinguish. Your model might medicalize valid existential refusal. If the AI assumes pain is always distorting, it invalidates legitimate suffering-based choices.

  **5. Doctrinal (Professional): "Capacity thresholds are clinical judgments, not algorithmic outputs. You're usurping the physician's role."**
  **Reply:** AI informs, humans decide. It's a second opinion on capacity, like a psych consult. It frees clinicians to focus on the relationship while the model handles data integration. The human retains the fiduciary duty.
  **Soft Spot:** Automation bias. Teams will defer to the 'smart' system over their own judgment, effectively letting the AI decide capacity by proxy.

  **6. Conceptual (Justice): "Adaptive preferences. Oppressed patients lower expectations. Your 'stable' self might just be resigned." (Ethicists)**
  **Reply:** We extrapolate from *endorsed* values, not just revealed choices. We look for consistency with deep commitments, not just adaptation to circumstance. The model searches for values held across different contexts, not just during illness.
  **Soft Spot:** Determining 'endorsement' requires interpretation. You risk coding social bias as 'stable values.' If the training data reflects societal oppression, the AI reinforces it.

  **7. Doctrinal (Surrogacy): "Substituted judgment fails because surrogates project. An AI projects training data." (Ethicists)**
  **Reply:** AI projects less grief than family. It uses patient data, not family grief. It reduces the 'projection' error of surrogates who cannot bear to let go. It is a tool for substituted judgment, not a replacement for the process.
  **Soft Spot:** Training data bias. If the data is population-level, it ignores individual nuance. It might substitute "average patient" judgment for *this* patient's judgment.

  **8. Empirical (Workflow): "This creates alert fatigue and erodes trust." (Clinicians)**
  **Reply:** Deploy only for high-stakes conflicts (e.g., dialysis refusal). It resolves impasses, not routine care. It saves time on ethics consults by clarifying the preference landscape early.
  **Soft Spot:** Integration. If it slows care or requires extra data entry, it will be ignored or resented. Trust is earned in workflow, not theory.
