prompt: |-
  I'm teaching an upper-level distributive justice seminar and writing the final. Write me one essay question on prioritarianism and the leveling-down objection that students can't answer just by reciting Parfit's telic/deontic distinction and the slogan that prioritarians don't care about equality as such. The crux I want the question to force: a steep enough priority weighting still ranks a transfer from the better-off to the worse-off as an improvement even when total welfare falls — a kind of weak leveling down that prioritarians seem stuck with. So a good answer has to say whether that residual commitment is a genuine cost, whether it differs in principle (not just in degree) from the egalitarian's commitment to equality, and whether moving to a sufficiency view or a lexical threshold actually fixes the problem or just relocates it. The question should be answerable in about 90 minutes. Then give a model answer of around 600 words and a marking scheme out of 20 points, with five must-hit points, the marks each is worth, and a one-line note on how students typically botch each one. Also don't let the model answer conclude with "prioritarianism wins" — I want it to genuinely weigh whether the escape from leveling down is principled or ad hoc.
