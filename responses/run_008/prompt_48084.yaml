answer: |-
  ### Essay Question

  **Question 1 (90 Minutes)**

  Parfit defends prioritarianism against the Leveling-Down Objection (LDO) by arguing that it values benefiting people, not equality *per se*. However, critics note that if the priority weighting function is sufficiently concave, prioritarianism can rank a transfer from the better-off to the worse-off as an improvement even when the better-off lose more than the worse-off gain, resulting in a net loss of total welfare. Call this the "Weak Leveling-Down" problem.

  Write an essay addressing the following: Does the possibility of Weak Leveling-Down undermine the prioritarian claim to have escaped the LDO in *principle*, or merely in degree? In your analysis, distinguish this residual commitment from the strict egalitarian's commitment to equality. Finally, evaluate whether adopting a Sufficiency View or a Lexical Threshold avoids this problem genuinely, or if it merely relocates the arbitrariness to the setting of the threshold. Conclude by weighing whether the prioritarian's "continuous" trade-off is more defensible than the sufficiency view's "discontinuous" cliff-edge.

  ***

  ### Model Answer

  Prioritarianism aggregates welfare by applying a concave transformation to individual well-being, granting greater moral weight to benefits accruing to the worse-off. Parfit argues this avoids the Leveling-Down Objection (LDO) because value is never generated by merely lowering the better-off; there must be a gain to someone. However, the "Weak Leveling-Down" (WLD) problem arises when the weighting function is so steep that a transfer increasing the priority-weighted sum actually decreases total welfare. If the rich lose 10 units and the poor gain 5, but the moral value of the poor's gain outweighs the rich's loss, prioritarianism endorses a net welfare destruction.

  Does this undermine the prioritarian escape from the LDO? In *degree*, the cost is significant: it violates the Pareto principle regarding total welfare. However, in *principle*, the distinction from strict egalitarianism remains robust. The strict egalitarian values the reduction of the gap intrinsically; if leveling down makes no one better off, the egalitarian still sees value in the resulting equality. The prioritarian sees value only in the weighted gain to the recipient. The WLD is a byproduct of the weighting mechanism, not the telos of the theory. Thus, while prioritarianism tolerates welfare losses, it does not fetishize equality for its own sake. The cost is genuine—it conflicts with utilitarian intuitions regarding efficiency—but it is structurally distinct from the egalitarian's commitment to relational patterns.

  Proponents might suggest escaping WLD by adopting a Sufficiency View or a Lexical Threshold. These views hold that benefits below a certain threshold carry absolute or lexical priority over benefits above it. This structurally forbids WLD above the threshold: once everyone is "sufficient," we maximize total welfare, preventing net losses for the sake of priority.

  However, this solution likely relocates the arbitrariness rather than resolving it. The prioritarian faces a continuous curve where trade-offs are smooth but potentially counterintuitive (WLD). The sufficiency theorist faces a discontinuous "cliff-edge." Why is the threshold at level $X$ and not $X+1$? If a person is one unit below the threshold, they trump a million units for the well-off; if they are one unit above, they count for nothing extra. This discontinuity seems more ad hoc than the prioritarian's smooth weighting function. The prioritarian can argue that moral urgency fades gradually, not abruptly.

  Ultimately, the escape from leveling down is not costless. Prioritarianism avoids the absurdity of valuing pure equality but inherits the burden of justifying net welfare losses via steep weighting. Sufficiency views avoid the welfare loss but inherit the burden of justifying arbitrary thresholds. The choice is not between a theory that avoids counterintuitive results and one that does not, but between a theory that is continuous but demanding (prioritarianism) and one that is discontinuous but potentially arbitrary (sufficiency). Whether WLD is a fatal flaw depends on whether one views the continuity of moral weight as more principled than the discontinuity of sufficiency. There is no free lunch in distributive mechanics; there are only trade-offs between different kinds of implausibility.

  ***

  ### Marking Scheme (20 Points)

  **1. Identification of the "Weak Leveling-Down" Mechanism (4 Points)**
  *   **Requirement:** Student must explain *how* prioritarianism generates net welfare losses (concave weighting function where weighted gain > unweighted loss).
  *   **Typical Botch:** Students describe standard Leveling Down (making everyone equal) rather than the specific transfer case where total welfare falls.

  **2. Principle vs. Degree Distinction (4 Points)**
  *   **Requirement:** Student must argue that Prioritarianism values the *gain* (weighted), whereas Egalitarianism values the *gap closure* (intrinsic).
  *   **Typical Botch:** Students claim there is no difference because both views recommend the same action in the specific case.

  **3. Evaluation of the "Genuine Cost" (4 Points)**
  *   **Requirement:** Student must assess whether endorsing net welfare losses is a theoretical bug or a feature (e.g., violating Pareto vs. respecting urgency).
  *   **Typical Botch:** Students dismiss the cost entirely by reciting Parfit's slogan that "equality is not what matters" without engaging the welfare loss implication.

  **4. Analysis of Sufficiency/Threshold Views (4 Points)**
  *   **Requirement:** Student must explain that thresholds block WLD but introduce "cliff-edge" or arbitrariness problems regarding the threshold location.
  *   **Typical Botch:** Students treat Sufficiency as a perfect solution that simply "fixes" the problem without noting the discontinuity/arbitrariness cost.

  **5. Nuanced Conclusion (4 Points)**
  *   **Requirement:** Conclusion must weigh continuity (Prioritarianism) against arbitrariness (Sufficiency) without declaring a definitive winner.
  *   **Typical Botch:** Students conclude dogmatically that "Prioritarianism wins" or "Egalitarianism is dead," ignoring the prompt's instruction to weigh the trade-offs.
