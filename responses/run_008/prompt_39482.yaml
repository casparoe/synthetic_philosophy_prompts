      *(Self-Correction on "Who's Right"):* I should avoid saying "Ana is right." Instead, I should say "Ana's point holds water within the Liberal tradition," etc. But the user asked "who's right." I will interpret this as "whose argument is more philosophically robust at that specific juncture."
      *   Step 1 (Interference): Tie. Definitional.
