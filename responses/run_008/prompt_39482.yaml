      *   *Round 4 (Marcus: Institutional Relationship):* Marcus recovers here. This distinguishes structural power from random risk. This aligns with Pettit's "domination."
      *   *Round 5 (The Promise):* This is the crux. Ana thinks a promise removes the threat. Marcus (and Republicans) say the *power* remains, so the domination remains.

  5.  **Synthesizing the Philosophy Section:**
      *   **Isaiah Berlin:** "Two Concepts of Liberty." Negative (freedom from) vs. Positive (freedom to). Ana is Negative.
      *   **Philip Pettit / Quentin Skinner:** Republicanism (Freedom as Non-Domination). This is Marcus's core argument.
      *   **Michel Foucault:** Panopticon. Relevant to the "changing behavior because of being watched" aspect.
      *   **Consensus vs. Debate:**
          *   *Consensus:* Surveillance *does* change behavior (empirical fact).
          *   *Debate:* Does that *count* as a loss of political freedom? (Normative question).
          *   *Debate:* Is benevolent power still domination?

  6.  **Refining the Tone:**
