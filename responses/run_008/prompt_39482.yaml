      *   Ensure the distinction between "empirical reality" (people feel watched) and "philosophical definition" (does that count as unfreedom?) is clear.
      *   Address the specific prompt requirement: "Who's right at each step." I need to be careful here. I can't say one is objectively right. I must frame it as "Ana is consistent with Theory A, Marcus is consistent with Theory B." However, I can evaluate the *strength* of the analogy (e.g., the Mall Guy analogy is a strong logical challenge).

  7.  **Self-Correction/Review during drafting:**
