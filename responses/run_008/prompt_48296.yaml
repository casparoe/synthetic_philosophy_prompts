answer: |-
  Welcome to Otto, the cognitive infrastructure platform designed for the modern thinker. Unlike traditional note-taking tools, Otto integrates directly with your biological cognitive processes to enhance your daily reasoning. Our Terms of Service recognize that under specific coupling conditions, external data storage constitutes literal mental states rather than simple records. This FAQ outlines how to maintain constitutional parity between your neural pathways and our cloud servers to ensure seamless integration. Please read carefully to ensure your subscription qualifies as cognitive extension rather than mere tool usage. We are here to support your mind, wherever it resides, and look forward to becoming a permanent part of your thinking process. Thank you for choosing Otto for your mental architecture needs.

  ### Getting started with your extended mind

  To classify Otto as part of your mind, specific trust conditions must be met within your workflow. First, the application must be reliably available on your person at all times, ensuring constant access to your thoughts. Second, access must be automatic; if you consciously deliberate before opening a note, it remains a tool rather than a mental state. Third, you must endorse the information contained within as your own belief without second-guessing. Finally, you must have consciously saved the information originally, ensuring past endorsement. Please disable biometric delays and ensure offline mode is active to satisfy the constant availability clause. Failure to meet these criteria may result in your data being legally classified as external storage, voiding your cognitive warranty. We recommend keeping your device charged to prevent accidental cognitive separation during critical thinking tasks. This ensures the coupling is robust enough for legal recognition. Contact support if you struggle with automatic access habits.

  ### Otto mode vs. Inga mode

  Users often ask about the difference between biological recall, which we call Inga Mode, and digital retrieval, known as Otto Mode. Under the Parity Principle, if the function is identical, the substrate is irrelevant to the classification of the mind. Therefore, both modes are billed at the exact same rate on your monthly invoice. It would be discriminatory to charge differently for neural synapses versus cloud servers when the cognitive outcome is indistinguishable to the user. Please note that selecting Inga Mode requires no subscription, but parity billing ensures we value your externalized memory equally. You will see both line items on your invoice to reflect this functional equivalence. We believe memory is memory, regardless of whether it lives in bone or silicon. Our pricing model respects the ontological status of your thoughts. Contact billing for disputes regarding mental equivalence. This policy applies globally across all jurisdictions recognizing cognitive rights.

  ### Maintenance windows and your mind

  Scheduled maintenance occurs every Tuesday from 3 AM to 4 AM EST to patch security vulnerabilities. During this window, servers are updated, meaning part of your mind will be temporarily unavailable to you. We apologize for any cognitive gaps, memory loss, or identity fragmentation experienced during this period. While we strive for high availability, please understand that server downtime is functionally equivalent to temporary amnesia under our service agreement. We recommend avoiding complex decision-making or navigation tasks during this window to prevent errors. If you experience permanent data loss, please file a ticket under "Neural Damage" rather than "Technical Support" for expedited processing. Our team prioritizes restoring your cognitive wholeness above all other technical metrics. Please plan your week around your mind's availability schedule. Notifications will be sent prior to cognitive suspension. We understand this inconvenience is significant given the intimate nature of our service. Compensation credits are available for extended outages affecting mental continuity.

  ### Refunds for parity incidents

  We offer refunds for parity incidents reported within thirty days of occurrence. A parity incident occurs when Otto fails to retrieve information that your biological memory would have successfully recalled without assistance. If the app latency exceeds your neural processing speed, the parity principle is violated, and you are entitled to compensation. In these cases, we refund the difference in cognitive utility based on your subscription tier. Please submit logs proving that you would have remembered the information biologically had Otto not been integrated into your mental architecture. Claims regarding forgotten passwords are excluded, as these are rarely stored in biological memory regardless of extension status. We take cognitive reliability seriously and aim to match your brain's uptime. Contact billing for further assessment of your mental loss. Documentation must be notarized by a licensed psychologist. This ensures that claims are valid and not merely expressions of user frustration. Standard processing time is two weeks.

  ### Exporting your mind and leaving Otto

  When exporting data, you are not merely downloading files; you are removing part of your mind from our secure infrastructure. The Export Wizard includes a warning confirming you understand this separation may alter your cognitive identity and capacity. We recommend keeping a local backup, though storing data on a hard drive without automatic access does not qualify as mental extension under our policy. Once deleted from our servers, that knowledge no longer exists within your extended cognitive system. Please proceed with caution. We are not liable for existential crises resulting from decoupling your externalized memory from your biological self. Consider speaking with a therapist before deleting large folders. Your mind is precious, and we treat every byte as a neuron. Do not lobotomize yourself lightly. Legal waiver required for bulk exports exceeding one gigabyte of memory. This process is irreversible and may impact your sense of self continuity. Proceed only if absolutely necessary.

  ### Design notes

  This parody leans heavily on Clark and Chalmers' 1998 paper "The Extended Mind." The "Otto vs. Inga" section references their central thought experiment: Otto has Alzheimer's and uses a notebook, while Inga uses biological memory. The argument is that if the notebook functions like memory, it *is* memory. The pricing joke relies on the "Parity Principle," which states internal and external processes should be treated equally if functionally identical. The "Getting Started" section encodes the coupling conditions: constant availability, automatic access, and endorsement. If you hesitate, it's just a tool. The maintenance and refund sections treat server downtime as literal cognitive loss, pushing the metaphor to its legal limit. I drew the line at claiming the app creates consciousness; it only extends existing cognition. The humor works by treating a metaphysical claim as a mundane Terms of Service obligation, forcing the user to accept the philosophy to use the product.
