answer: |-
  # Dissertation Defense Q&A Prep Sheet
  **Topic:** Galen Strawson's Basic Argument & Basic-Desert Moral Responsibility
  **Audience:** Compatibilist Department (P.F. Strawsonians, Reasons-Responsiveness, One Skeptic Visitor)

  ---

  ### 1. The "Change of Subject" Objection (P.F. Strawsonians)
  **Likely Asker:** Senior Faculty (Chair or P.F. Strawson specialist)
  **Phrasing:** "You're treating responsibility as a metaphysical status requiring *causa sui*, but P.F. Strawson taught us that responsibility is constituted by our reactive attitudes—resentment, gratitude, indignation. These are natural facts of human life, not theoretical judgments open to revision by a regress argument. Aren't you simply demanding a justification for our moral community that the community itself doesn't require, and thus changing the subject from *our* concept of responsibility to an impossible ideal?"

  **Your Reply (2 mins):**
  "I appreciate the force of P.F. Strawson's naturalism. I agree that we cannot *stop* feeling reactive attitudes; they are indeed natural facts. However, my argument targets not the *existence* of these attitudes, but their *justification* in the basic-desert sense. When we feel indignation, we implicitly claim the agent *deserved* it in a backward-looking sense, independent of future consequences. My argument shows that this specific claim—the desert claim—cannot be metaphysically sustained. I am not arguing we should cease holding people responsible in the forward-looking sense of moral education or safety. I am arguing that the *retributive core* of our practices, which claims the agent is the ultimate source of their will, rests on a fiction. We can acknowledge the inevitability of the attitudes while admitting their retributive justification fails."

  **Soft Spot:** You risk sounding like you're ignoring the phenomenology of blame.
  **Concession:** Concede upfront that we cannot voluntarily abandon reactive attitudes. This disarms the "impossible revision" charge.
  **Visitor Flag:** The Visitor will nod here. Do not let them interrupt to say "So we should abolish blame." Stop at "justification fails."

  ### 2. **THE KILLER QUESTION: The Practical Implications Trap**
  **Likely Asker:** The Visitor (Skeptic) or a concerned Senior
  **Phrasing:** "If basic desert is impossible, as you argue, then no one ever truly deserves blame or punishment. Does this mean our current practices of blaming, punishing, and resenting are fundamentally unjustified? Are you advocating for the abolition of our criminal justice system and moral accountability, or are you carving out a notion of responsibility that does no work?"

  **Why This Is Dangerous:**
  If you say "Yes, abolish it," you alienate the compatibilists who see blame as essential to morality (you become a nihilist). If you say "No, keep it," the Visitor and hard incompatibilists will charge you with inconsistency (why keep a practice based on a falsehood?). Fumbling this makes you look either dangerous or confused.

  **Your Reply (2 mins):**
  "This is the crucial distinction. I am arguing against *basic-desert* responsibility, not *accountability* simpliciter. We can retain practices of blaming and punishing on forward-looking grounds: moral formation, protection of society, and reinforcing norms. These are justified by their consequences, not by retrospective desert. My conclusion is not that we stop holding people accountable, but that we must stop viewing them as *ultimately* deserving of suffering. We can modify our practices to be less retributive and more rehabilitative without abandoning the interpersonal stance entirely. The argument licenses reform, not necessarily abolition."

  **Soft Spot:** Distinguishing "desert" from "forward-looking accountability" is philosophically delicate.
  **Concession:** Concede that the line between retributive and forward-looking blame is blurry in practice.
  **Visitor Flag:** **CRITICAL.** The Visitor wants you to say "Abolish." You must hold the line at "Reform/Modify." If they push, say: "My dissertation limits itself to the metaphysics of desert, not the sociology of penal reform."

  ### 3. The Regress Stopper (Ultimacy Requirement)
  **Likely Asker:** Junior Faculty (Metaphysics focus)
  **Phrasing:** "Why does moral responsibility require *ultimate* responsibility? Why isn't it enough that the action issues from my own psychology in the right way, without coercion? Why must I be responsible for the psychology itself? Doesn't the regress stop at 'agency'?"

  **Your Reply (2 mins):**
  "If responsibility is merely about the action issuing from your psychology, then a manipulator who programmed that psychology could also be responsible for your action. To be the *true* source of the action, you must be the source of the psychology. If you aren't responsible for your character, and your character determines your action, then you aren't responsible for the action in the basic-desert sense. The regress stops at 'agency' only if we accept that luck (genetic or environmental) can ground desert. But luck undermines control, and control is necessary for desert. Therefore, the regress must go back to the self-creation of the agent, which is impossible."

  **Soft Spot:** The intuition that "I am my character" is strong.
  **Concession:** Acknowledge that for *practical* purposes, we stop at agency. Reiterate this is about *basic desert*, not practical attribution.

  ### 4. Begging the Question (Definition of Desert)
  **Likely Asker:** Senior Faculty (Conceptual Analysis)
  **Phrasing:** "You define 'basic desert' in a way that requires *causa sui*. Isn't this circular? You've built the impossibility condition into the definition of responsibility. Compatibilists define responsibility as reasons-responsiveness. Why should we accept your stipulative definition over ours?"

  **Your Reply (2 mins):**
  "I am not stipulating; I am analyzing the commitments of the retributive stance. When we say someone *deserves* punishment purely for a past wrong, we imply they could have done otherwise in a robust sense. If their action was the inevitable result of factors they didn't choose (genes, environment), the 'desert' claim loses its moral force. I am arguing that the *concept* of basic desert, as commonly understood in moral and legal contexts, carries this ultimacy condition implicitly. If compatibilists redefine responsibility to remove ultimacy, they are changing the subject to 'eligibility for social regulation,' which I grant is possible, but it's not *basic desert*."

  **Soft Spot:** Accusations of "changing the subject" cut both ways.
  **Concession:** Concede that compatibilists offer a coherent *alternative* concept, but maintain it isn't the *desert* concept.

  ### 5. Reasons-Responsiveness (Guidance Control)
  **Likely Asker:** Junior Faculty (Reasons-Responsiveness specialist)
  **Phrasing:** "Even if you aren't responsible for your character, you are responsible for how you respond to reasons. If your mechanism is reasons-responsive, you have guidance control. Doesn't this break the regress? You don't need to create your character, just respond to reasons *with* it."

  **Your Reply (2 mins):**
  "Reasons-responsiveness explains *agency*, not *ultimate responsibility*. If my capacity to respond to reasons is itself the product of luck—my upbringing, my neural structure—then I am lucky to be reasons-responsive. Luck does not ground desert. If two agents are identical except one was raised to be responsive and the other wasn't, and we blame the first, we are blaming them for their luck. The Basic Argument accepts guidance control exists but denies it is sufficient for *basic-desert* blame."

  **Soft Spot:** Reasons-responsiveness is the strongest compatibilist technical tool.
  **Concession:** Grant that guidance control is necessary for agency, just not sufficient for desert.

  ### 6. The "How She Is" Premise (Psychological Accuracy)
  **Likely Asker:** Senior/Junior (Philosophy of Action)
  **Phrasing:** "You claim an agent acts only because of 'how she is.' But sometimes we act against our character, values, or will (akrasia). Doesn't this break the link between character and action, allowing responsibility to sneak in?"

  **Your Reply (2 mins):**
  "Even in akrasia, the action results from the strongest motive or impulse present at that moment. That impulse is part of 'how she is' at that moment. Whether she acts on her second-order volition or her first-order desire, the outcome is determined by the configuration of her mental states at *t*. She is not responsible for that configuration. The argument holds whether the action aligns with character or conflicts with it; in both cases, the source is the agent's current state, for which she is not ultimately responsible."

  **Soft Spot:** Cases of sudden, uncharacteristic conversion or insight.
  **Concession:** Acknowledge that character is fluid, but insist the *source* of the fluidity is still not *causa sui*.

  ### 7. Indeterminism and Ownership
  **Likely Asker:** Junior Faculty (Libertarian leanings or Ownership specialist)
  **Phrasing:** "You say indeterminism is just luck. But what if the agent 'owns' the indeterministic outcome? If I identify with the random neural firing that leads to my action, doesn't that make it mine, breaking the luck objection?"

  **Your Reply (2 mins):**
  "Identification is itself a mental state. If the identification is determined, we are back to the regress. If the identification is indeterministic, it is *also* a matter of luck. I cannot be responsible for 'owning' a random event if the ownership itself wasn't chosen. Adding a layer of 'identification' doesn't transmute luck into control; it just adds another link in the chain that is ultimately grounded in factors outside the agent's control."

  **Soft Spot:** The phenomenology of "making up one's mind" feels like control.
  **Concession:** Admit the phenomenology is compelling, but insist phenomenology doesn't prove metaphysics.

  ### 8. The "Impossible Revision" (Human Nature)
  **Likely Asker:** Senior Faculty (Ethics/Pragmatism)
  **Phrasing:** "Even if you are right metaphysically, demanding we abandon basic desert is asking us to revise human life in a way that is psychologically impossible. Isn't a theory of responsibility that human beings cannot live by practically useless?"

  **Your Reply (2 mins):**
  "A theory can be true even if it is difficult to live by. We know death is inevitable, yet we live as if we are immortal. My goal isn't to demand an immediate psychological revolution, but to show that our *justifications* for punishment and blame are flawed. Recognizing this can gradually soften our reactive attitudes, making us less vindictive and more compassionate, without requiring us to cease being human. Truth shouldn't be held hostage to psychological convenience."

  **Soft Spot:** Can sound overly idealistic or detached from moral reality.
  **Concession:** Concede that change will be slow and partial.
  **Visitor Flag:** The Visitor will love this. Keep your tone humble, not missionary.

  ---

  ### Strategic Notes for the Defense

  **Managing the Visitor:**
  The Visitor agrees with your conclusion (no basic desert) but wants to push toward **Eliminativism** (abolish blame/praise).
  *   **Trap:** They will ask, "If desert is an illusion, why keep the practice at all?"
  *   **Defense:** "My project is metaphysical, not normative. I establish that *desert* is impossible. How we structure our practices given that truth is a separate question. I argue for *reform* (forward-looking), not *abolition*."
  *   **Signal:** If they start nodding too vigorously, explicitly say: "I want to be clear, I am not arguing for the elimination of accountability practices."

  **Managing the Seniors (P.F. Strawsonians):**
  *   **Trap:** They will treat your argument as a category error (theoretical vs. practical).
  *   **Defense:** Do not fight them on the *value* of reactive attitudes. Fight them on the *truth conditions* of desert claims. Acknowledge P.F. Strawson's brilliance regarding the *nature* of the practice, but insist Galen Strawson is right about the *metaphysical cost* of that practice.

  **The "Killer Question" Contingency:**
  If you feel yourself cornered on Question #2 (Practical Implications):
  *   **Pause.** Take a sip of water.
  *   **Pivot:** "That is a question for a subsequent chapter. In this chapter, I am strictly establishing the metaphysical impossibility of *causa sui*. I am arguing that *if* we value basic desert, we are valuing an impossibility. What we do next is a pragmatic question."
  *   **Why:** This protects you from making normative claims you haven't defended in the text.

  **General Tone:**
  *   **Humility:** "I am aware this challenges deeply held intuitions..."
  *   **Precision:** Stick to "Basic Desert" vs. "Forward-Looking Accountability." Do not let them blur these terms.
  *   **Respect:** Acknowledge the P.F. Strawson tradition as the dominant framework you are engaging with, not an enemy to be destroyed. You are refining it, not discarding it.
