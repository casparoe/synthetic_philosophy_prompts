answer: |-
  ### I. The Implicit Theory of Temporal Value

  The systematic discounting practiced in government cost-benefit analysis (CBA) presupposes a hybrid theory of value rooted in **welfare consequentialism**, specifically operationalized through the **Ramsey Rule**. This rule decomposes the discount rate ($r$) into three components: $r = \delta + \eta g$. Here, $\delta$ represents **pure time preference** (impatience), $\eta$ represents the elasticity of marginal utility of consumption, and $g$ represents expected economic growth.

  **What the Practice Strictly Requires:**
  At its logical core, the practice requires only **substitutability and commensurability**. It presupposes that welfare at time $t_1$ can be traded off against welfare at time $t_2$ at a fixed exchange rate. It requires that future goods are not lexically superior to present goods; a smaller benefit today can morally outweigh a larger benefit tomorrow if the rate of return on investment is sufficiently high. It does not strictly require *why* the rate is positive, only that it *is* positive.

  **What Fits Comfortably:**
  1.  **Opportunity-Cost Rationale:** This is the dominant justification in standard appraisal. It posits that capital is productive; resources consumed today could be invested to yield more resources tomorrow. Therefore, a future benefit must be larger than a present cost to justify foregoing investment. This fits the "investment" mindset of infrastructure and regulatory appraisal.
  2.  **Epistemic Discounting (The Weitzman Effect):** The recent adoption of declining discount rates for long horizons fits the theory that uncertainty about future growth rates or discount rates itself lowers the "certainty equivalent" discount rate over time. As the horizon extends, the probability of low-growth (high-marginal-utility) states dominates the calculation, warranting a lower rate.
  3.  **Diminishing Marginal Utility:** The assumption that future generations will be richer ($g > 0$) fits the practice well. If they are richer, an extra dollar gives them less utility than it gives us, justifying a lower present valuation of their benefits.

  **What Is Ruled Out:**
  1.  **Strong Sustainability:** The practice rules out the view that certain natural capital (e.g., biodiversity, stable climate) is non-substitutable. If a benefit cannot be converted into monetary equivalents and traded against present costs, CBA discounting cannot function.
  2.  **Deontological Timelessness:** The practice is incompatible with the view that rights or duties are time-invariant. If a future person has a right to a stable climate equal to our right to income today, discounting violates that right by deeming it worth less.
  3.  **Zero Pure Time Preference (Intergenerational Egalitarianism):** While some economists argue $\delta$ should be zero for ethical reasons, standard practice usually incorporates a positive $\delta$. A strict egalitarian view (future well-being counts exactly as much as present well-being, independent of growth) would require a discount rate near zero (only adjusting for catastrophe risk), which current appraisal frameworks generally reject as "paralyzing."

  ### II. Reconciling Appraisal and Compensation Law

  The tension between discounting in CBA and non-discounting in compensation law is a conflict between **allocative efficiency** and **corrective justice**.

  **The Inconsistency:**
  *   **CBA (Efficiency):** Asks, "How do we maximize aggregate social welfare?" It treats time as a resource cost. A dollar in 50 years is worth less because it could have been compounded, or because future people will be richer.
  *   **Compensation Law (Justice):** Asks, "What is owed to this specific rights-bearer?" It treats time as morally neutral regarding the validity of a claim. If the state wrongs a citizen, the debt is real regardless of when it is paid. Inflation is adjusted, but the *real* value is not discounted for the delay.

  **Can They Be Reconciled?**
  They can be reconciled only under a **dual-track moral framework** that segregates policy from law:
  1.  **Domain Separation:** One can argue that CBA governs the *creation* of new policies (consequentialist), while compensation law governs the *rectification* of violated rights (deontological). In this view, the state acts as a utilitarian planner in appraisal but a duty-bound agent in law.
  2.  **The "Richer Future" Caveat:** Reconciliation holds only if the discount rate is driven entirely by expected economic growth ($\eta g$) and not pure time preference ($\delta$). If future generations are richer, their marginal utility is lower, justifying lower present valuation in CBA. However, in law, the specific victim (even if a future generation) is owed restitution based on the harm *to them*, not aggregate social utility.

  **Must One Give?**
  Yes, if the government maintains its **Sustainability Principles**. Sustainability rhetoric typically asserts that future generations' interests carry "no less weight than ours." This is a claim of moral equality ($\delta = 0$).
  *   If Sustainability is true, **CBA discounting must give** (specifically the pure time preference component). Long-term environmental benefits must be valued nearly equally to present costs.
  *   If CBA discounting is maintained, **Sustainability rhetoric is hypocritical**. The government is effectively stating that future interests count for less, contradicting its own principles.
  *   **Compensation Law** is the least likely to yield because it is rooted in individual rights and legal certainty, which are foundational to the rule of law. CBA is a technocratic tool and is more malleable. Therefore, the inconsistency is usually resolved by masking the ethical choice of the discount rate behind technical economic assumptions (opportunity cost), allowing the government to pay full compensation to past victims while discounting the rights of future ones.

  ### III. The Hypothetical Shift: Adopting Pure Time Preference

  If a government candidly adopted **Pure Time Preference** ($\delta > 0$) as its official rationale—admitting that future well-being counts less simply because it is in the future, and abandoning the Opportunity-Cost defense (capital productivity)—the appraisal practice would undergo radical transformation.

  **What Would Change:**

  1.  **Collapse of Long-Horizon Projects:**
      *   *Current:* Long-term projects (nuclear waste, climate mitigation) are often justified using declining rates based on uncertainty about future capital returns or growth.
      *   *New:* If the rationale is purely impatience, the justification for **declining rates evaporates**. Psychological or ethical impatience does not necessarily diminish over 100 years; if anything, it is constant. A constant high pure time preference rate would reduce the present value of century-out benefits to near zero. Climate mitigation projects would almost universally fail cost-benefit tests.

  2.  **Asymmetry in Intergenerational Transfers:**
      *   *Current:* Costs and benefits are discounted symmetrically.
      *   *New:* With an explicit ethical preference for the present, **cost-shifting to the future becomes morally cheaper**. If a benefit today is worth more than a benefit tomorrow, a cost today is also "worse" than a cost tomorrow. The state would be incentivized to push costs (debt, waste, degradation) into the future, as those costs would be heavily discounted in the appraisal. The "polluter pays" principle would weaken for long-latency harms.

  3.  **Ranking Against Financial Investments:**
      *   *Current:* Projects are compared against a social opportunity cost of capital (what the money could earn elsewhere).
      *   *New:* Projects are compared against the state's rate of impatience. A financially productive investment (e.g., a toll road) might be rejected if it delays consumption too long, even if it yields a high financial return. Conversely, immediate consumption-boosting policies would rank higher than capital accumulation.

  **What Would Remain Untouched:**

  1.  **Short-Term Appraisal:** For projects with payoffs within 5–10 years, the distinction between opportunity cost and pure time preference is less pronounced. The mathematical machinery of Net Present Value (NPV) remains identical.
  2.  **Risk Adjustment:** The practice of adjusting for the *probability* of failure (risk) would remain. Pure time preference discounts for *time*, not *uncertainty*. A project with a 50% chance of failing in year 5 would still be discounted for risk, independent of the time preference rate.
  3.  **Distributional Weighting (if separate):** If the government currently applies equity weights (valving benefits to the poor more highly), this could technically remain, though it would clash with pure time preference if the "poor" are future generations.

  **Conclusion:**
  Adopting pure time preference openly would strip government appraisal of its economic camouflage. It would reveal that the state values the current electorate significantly more than their descendants. This would force the abandonment of most intergenerational sustainability projects unless they could be reframed as immediate benefits (e.g., "green jobs now" rather than "climate stability later"). It would resolve the inconsistency with compensation law by admitting that the state operates on two different moral clocks: one of **rights** (timeless) for the living, and one of **preference** (decaying) for the unborn.
