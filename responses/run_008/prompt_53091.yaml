      *   **Task 1: Reconstruct the Implicit Theory:** What theory of the value of time does systematic discounting presuppose? (Options given: Pure time preference, Opportunity-cost, Epistemic/Uncertainty, Non-identity). Distinguish what is *required* vs. what *fits*. Identify ruled-out rival views.
      *   **Task 2: Address the Inconsistency:** Can CBA discounting and legal non-discounting be reconciled? Or must one give?
      *   **Task 3: Hypothetical Shift:** If a government adopted *pure time preference* openly (abandoning opportunity-cost), what changes in appraisal practice? What stays the same?

  2.  **Task 1: Reconstructing the Implicit Theory:**

      *   *Standard Economic Justification:* The standard Ramsey Rule ($r = \delta + \eta g$).
          *   $\delta$ (Pure Time Preference): Impatience. Future utility counts less simply because it's later.
          *   $\eta g$ (Growth/Opportunity Cost): Future people will be richer (diminishing marginal utility) + capital productivity (money invested today grows).
      *   *What does the practice presuppose?* It *requires* a positive discount rate. It doesn't strictly require *why*, but standard practice leans heavily on **Opportunity Cost of Capital** (social rate of time preference vs. social opportunity cost of capital).
      *   *Declining Rates:* This suggests **Uncertainty/Epistemic Discounting** (Weitzman effect). If we aren't sure what the rate will be, the certainty equivalent rate declines over time.
      *   *What fits comfortably:* Opportunity cost fits the "investment" logic of government. Epistemic discounting fits the "declining rate" trend.
      *   *What is strictly required:* Only that future goods are substitutable for present goods at a rate $> 0$.
      *   *Ruled Out Views:*
          *   Strong Sustainability (non-substitutability of natural capital).
          *   Strict Intergenerational Egalitarianism (zero pure time preference + no growth adjustment).
          *   Legal/Corrective Justice view of time (time is neutral for rights).

  3.  **Task 2: Addressing the Inconsistency (CBA vs. Law):**

      *   *The Conflict:* CBA says \$100 in 50 years < \$100 today. Law says \$100 owed 50 years ago = \$100 today (plus interest/inflation, but real value is preserved).
      *   *Reconciliation Attempt 1 (Domain Separation):* CBA is about *allocation* of new resources (efficiency). Law is about *rectification* of rights (justice). Efficiency allows trade-offs; Justice does not.
      *   *Reconciliation Attempt 2 (The "Richer Future" argument):* CBA assumes future generations are richer, so marginal utility is lower. Legal compensation assumes the *individual* victim is owed restitution regardless of aggregate wealth.
      *   *Reconciliation Attempt 3 (Risk/Uncertainty):* CBA deals with probabilistic policy outcomes. Law deals with established liabilities.
      *   *Verdict:* They can be reconciled *if* one accepts a dual-track moral theory: Utilitarian/Consequentialist for policy (maximize aggregate welfare, hence discounting) vs. Deontological/Right-based for law (rights are timeless). However, if the government claims "Sustainability" (equal weight), the CBA discounting is hypocritical unless justified solely by economic growth (richer future), not time itself.
