answer: |-
  It is a genuine pleasure to correspond with you on this matter, for you have put your finger on the exact nerve that makes the definition of life such a persistently thorny problem in our field. Your frustration is entirely warranted, and I would go so far as to say that any definition of life that does not feel slightly uncomfortable around the edges is probably too dogmatic to be useful. What you are asking for is not merely a definition but a specification of the constraints that any such definition must satisfy to avoid being a mere tool of exclusion by fiat. To begin with, we must acknowledge that a definition of life is not a discovery of a natural kind in the same way that defining gold is; rather, it is a theoretical construct designed to carve nature at joints that are often blurred. With that in mind, the first desideratum must be evolutionary continuity. Any adequate definition must accommodate the fact that life arose from non-life through a gradual process of chemical evolution, meaning there was no single moment where a non-living soup suddenly became alive. This requirement respects the consensus of evolutionary biology that the transition was incremental, involving proto-metabolic cycles and replicating molecules long before the emergence of what we would recognise as a cell. Consequently, a definition that demands a sharp boundary at the origin contradicts the historical reality it seeks to describe, and this leads us directly to the first major tension you flagged between your flatmate and your supervisor.

  The second desideratum is the capacity to distinguish life from non-life complex systems, such as hurricanes, flames, or Bénard cells. These systems exhibit order, energy dissipation, and even a form of growth, yet we intuitively refuse to call them alive. To exclude them, a definition must require something more than mere self-organisation or thermodynamic disequilibrium; it typically demands a mechanism for open-ended evolution. This means the system must not only replicate but also possess the capacity to vary heritably in ways that allow natural selection to act over indefinite timescales, leading to increasing complexity or adaptation. This requirement is crucial because it separates the living from the merely complex physical phenomena that obey the laws of physics without accumulating historical information. However, this brings us to a third requirement concerning the distinction between an organism and a living part of an organism. Your examples of enucleated red blood cells and sterile worker ants are perfect here. A definition must be able to specify the level of selection at which life is instantiated. A red blood cell is a product of life and performs vital functions, but it lacks the genomic completeness to reproduce itself; similarly, a worker ant is a vessel for the colony's reproductive success. Therefore, an adequate definition must distinguish between being a living entity and being a component of a living system, likely by referencing the capacity for independent reproduction or the possession of a complete hereditary lineage, even if that capacity is temporarily suppressed or socially delegated.

  Moving on to the issue of dormancy, exemplified by tardigrades in cryptobiosis or ancient seeds, we encounter a fourth desideratum: potentiality versus activity. A definition based strictly on current metabolic activity would declare these organisms dead during their dormant phases, which is counterintuitive and practically useless for astrobiology where we might encounter dormant spores. Thus, the definition must allow for life to be defined by the capacity to resume metabolism and reproduction given the right conditions, rather than the continuous performance of these functions. This ties closely to the fifth requirement regarding viruses. Viruses replicate and evolve but lack independent metabolism, relying entirely on host machinery. A definition must decide whether dependency disqualifies an entity from being alive. If we insist on metabolic autonomy, viruses are dead; if we insist on evolutionary capacity, they are alive. To avoid fiat, the definition should clarify whether life is a property of individuals or a property of lineages, as viruses are certainly part of living lineages even if they are not independent organisms. This leads to the sixth desideratum, which concerns the distinction between simulation and reality, particularly regarding software life or HeLa cells. HeLa cells are materially continuous with their donor and exist in the physical world, whereas a self-replicating pattern in software exists only as information abstracted from its substrate. An adequate definition should arguably require material embodiment because a simulation of a fire does not burn, and a simulation of life does not evolve in the physical universe unless it is embedded in a hardware substrate that is subject to physical selection pressures. Therefore, the definition must distinguish between the pattern itself and the physical instantiation of that pattern.

  Now I must address the tension you noted between your flatmate's demand for a binary verdict and your supervisor's acceptance of a graded verdict. This is the pair of requirements that I suspect cannot be jointly satisfied without contradiction. If you demand a sharp binary yes-or-no answer for every entity, you violate the requirement for evolutionary continuity, which dictates that the origin of life was a gradient. If you demand a graded verdict to accommodate gradualism, you fail your flatmate's requirement for a crisp classification tool. In my view, your supervisor is correct that a definition owes us conceptual clarity rather than binary simplicity. A graded verdict, perhaps viewing life as a cluster concept where entities possess varying degrees of aliveness, is more honest to the science, even if it is less satisfying for legalistic classification. Consequently, the requirement for a binary verdict is the one that must be sacrificed to maintain consistency with evolutionary theory. Regarding your question about which single requirement knocks out the most contenders, I believe it is the demand for open-ended evolutionary potential. This requirement eliminates hurricanes, flames, simple autocatalytic sets that do not vary, and crystal growth, all of which are frequent false positives in origins-of-life research. It is the strongest filter because it demands not just structure or replication, but the capacity for historical adaptation, which is the hallmark of the biosphere.

  Finally, let us briefly assess how the three frameworks you mentioned fare against this list. The Darwinian-evolutionary definition, often used in space science such as the NASA working definition, performs very well against the requirement for open-ended evolution and handles the gradualism of origins effectively. However, it struggles with the binary verdict requirement and often has difficulty with viruses unless they are framed as part of a broader living system. It also sometimes glosses over the materiality requirement, potentially allowing for software life if it evolves. The metabolism-first view excels at distinguishing life from non-life complex systems like viruses and software, as it demands physical energy processing, and it handles the distinction between organisms and parts well by focusing on the bounded chemical system. However, it fails the dormancy test, as a dormant seed has negligible metabolism, and it struggles with the gradualism of origins because it is hard to pinpoint when metabolism became sufficiently complex to count. Lastly, the heritable-information view, which focuses on genes and replication, handles viruses and dormant states well since the information persists even without activity. Yet, it risks collapsing the distinction between simulation and reality if information is considered substrate-independent, and it can struggle to explain the origins of the first replicator without invoking metabolism. In summary, each framework captures a vital aspect of life but falters on different desiderata, which confirms your suspicion that no single definition is yet perfect. My advice is to adopt a pluralistic approach in your work, utilising the definition that best suits the specific boundary problem you are investigating, while remaining transparent about the exclusions that choice entails. I hope this provides the specification you were seeking as you continue your research.
