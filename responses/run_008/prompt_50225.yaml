answer: |-
  Here are ten interview questions designed to probe the load-bearing walls of a purely pragmatic account of Moore's Paradox, including the required specific challenges and tailored follow-ups.

  ### 1. The Constitutive Norm
  **Question:** Your position rests on the idea that assertion is governed by a norm—often formulated as "Assert *p* only if you believe *p*." Is this norm merely a social rule of conversation, like a rule of politeness, or is it constitutive of assertion itself, like the rules of chess?
  *   **Likely Answer:** She will likely argue it is constitutive; you aren't really *asserting* if you flout the norm, you are doing something else (like hypothesizing or acting).
  *   **Follow-up:** If it's constitutive, then uttering "It's raining, but I don't believe it" isn't a failed assertion, it's a kind of category mistake. But Moorean sentences feel like *successful* assertions that are nonetheless absurd. Does calling it a category mistake risk explaining away the phenomenon rather than explaining it?

  ### 2. The Embedding Challenge (Required Topic)
  **Question:** A major piece of evidence for your view is that the absurdity vanishes when we embed the sentence, such as in a conditional: "If it's raining but I don't believe it, the picnic is off." Since no assertion is made in the antecedent, your view predicts no absurdity, which fits the data. However, even *contemplating* that antecedent silently strikes us as cognitively unstable. If the defect is purely about the *norms of assertion*, why does the mere *thought* feel defective?
  *   **Likely Answer:** She will likely suggest that when we contemplate the thought, we are simulating an assertion, or that the norm of belief itself mirrors the norm of assertion.
  *   **Follow-up:** But if we have to appeal to a norm of *belief* to explain the strangeness of the silent thought, haven't we conceded that the problem isn't *purely* pragmatic? Doesn't this suggest the tension lies in the doxastic state itself, not just its expression?

  ### 3. The Past-Tense Asymmetry (Required Topic)
  **Question:** Nearly everyone agrees that the past-tense version—"It was raining, but I didn't believe it"—is perfectly assertible and not paradoxical. On your view, this is because I am not representing my *current* belief state. But does this temporal asymmetry suggest that the operative norm governs the *expression* of belief rather than belief itself?
  *   **Likely Answer:** She will likely agree, arguing that the paradox is essentially indexical; it only arises when the assertion and the belief report compete for the same present moment.
  *   **Follow-up:** If the norm is only on present expression, does that imply I can have no rational critique of my own past beliefs? If I say, "It was raining, but I didn't believe it," I seem to be criticizing my past self. Where does the authority for that criticism come from if the norm is only about my current speech act?

  ### 4. Commissive vs. Omissive Forms (Required Topic)
  **Question:** We've discussed the commissive form ("It's raining, but I don't believe it"). But consider the omissive form: "It's raining, but I believe it is not." Many philosophers argue the omissive form is worse—it sounds like self-deception or lying, whereas the commissive sounds like confusion. Does your pragmatic account capture this asymmetry, or does it treat both as identical violations of the assertion norm?
  *   **Likely Answer:** She will likely admit that standard pragmatic accounts treat them symmetrically (both violate the link between assertion and belief) but may try to distinguish them by appealing to the sincerity conditions of the second conjunct.
  *   **Follow-up:** If the norm is simply "Assert *p* implies *Bp*," then in the omissive case, I assert *p* (implying *Bp*) and assert *B¬p*. That looks like a contradiction in belief attribution (*Bp* & *B¬p*), not just a pragmatic clash. If you concede the omissive form involves a contradiction in attributed beliefs, why insist the commissive form doesn't?

  ### 5. The "Inability" Intuition
  **Question:** When people encounter Moore's paradox, they often report that they *cannot* believe the conjunction, not just that they *should not* assert it. They feel a logical impossibility, not a social impropriety. Are you arguing that this intuition is a mistake—a psychological illusion we need to debunk?
  *   **Likely Answer:** She will likely argue that the feeling of impossibility is a projection of the pragmatic block; because we cannot assert it, we come to feel we cannot think it.
  *   **Follow-up:** But if the feeling is an illusion, why is it so universal and resistant to correction? If I explain your pragmatic theory to a student, they usually still feel the paradox. Does a theory that requires us to override our primary intuition about the case carry a heavy burden of proof?

  ### 6. Third-Person Contrast
  **Question:** The sentence "It is raining, but John doesn't believe it" is perfectly coherent. Your view explains this because I am not asserting *my* belief. But does this rely on a sharp distinction between first-person and third-person authority that your pragmatic view might undermine?
  *   **Likely Answer:** She will likely rely on the standard view that first-person present-tense belief reports have a special status (transparency or immunity to error) that third-person reports lack.
  *   **Follow-up:** If the paradox arises because asserting *p* represents *me* as believing *p*, doesn't that mean my access to my own belief is mediated by the same public norms I use to speak to you? If so, how do I know I'm not in a Moorean state before I open my mouth?

  ### 7. Self-Knowledge and Transparency
  **Question:** Some philosophers, like Sydney Shoemaker, argue Moore's paradox reveals something about self-knowledge: that I know my belief by looking at the world, not by introspection. Does your pragmatic explanation make self-knowledge irrelevant to the paradox?
  *   **Likely Answer:** She will likely argue that self-knowledge is secondary; the paradox arises even if I have perfect introspection, because the problem is the public commitment I undertake.
  *   **Follow-up:** But if I have perfect introspection and I know I don't believe it's raining, I simply won't assert that it is. Doesn't the paradox only get off the ground if my self-knowledge is already compromised? If so, isn't the root cause epistemic, not pragmatic?

  ### 8. The Nature of Belief
  **Question:** If the absurdity is entirely about the norms of assertion, does this imply a deflationary view of belief? Are you suggesting that belief is just the internal state that disposes us to follow the norms of assertion?
  *   **Likely Answer:** She will likely deny deflationism, arguing that belief is a robust psychological state, but its *conceptual connection* to assertion is what generates the paradox.
  *   **Follow-up:** If belief is robust and independent, couldn't a creature have beliefs but no norms of assertion? If so, would Moore's paradox exist for them? If the paradox disappears without language, doesn't that suggest the paradox is merely linguistic, not philosophical?

  ### 9. Normative Force vs. Psychological Reality
  **Question:** You argue the sentence is pragmatically defective. But suppose a speaker is deeply self-deceived. They assert "It's raining" while genuinely lacking the belief. Have they violated a norm, or have they simply described a psychological reality they are unaware of?
  *   **Likely Answer:** She will likely say they have violated the norm of sincerity, regardless of their psychological awareness.
  *   **Follow-up:** If the norm holds regardless of awareness, then the norm is external to the speaker's mind. But Moore's paradox feels like an internal conflict. How do you bridge the gap between an external normative violation and the internal feeling of absurdity?

  ### 10. Implications for Truth
  **Question:** Finally, you maintain the conjunction "It's raining, but I don't believe it" could well be *true*. But if asserting it undermines the very conditions required for me to be a trustworthy reporter of that truth, does the truth value matter?
  *   **Likely Answer:** She will likely insist truth and assertibility are separate; a sentence can be true but unassertible (e.g., "I am asleep").
  *   **Follow-up:** In the "I am asleep" case, the sentence is false if asserted. In the Moorean case, the sentence can be true. Does this unique combination—true content but impossible assertion—suggest that belief is not just a norm for assertion, but a condition for the *truth* of first-person claims?
