prompt: |-
  So my friend and I just spent an entire evening, like five hours and way too much wine, arguing about whether knowing how to ride a bike is a kind of knowing that, and now my head hurts but it also sharpened what I need to say. Here's the situation: I'm a philosophy grad student, and in two weeks I'm presenting to a reading group in the cog sci department that's mostly enactivists and embodied-cognition people — sensorimotor contingency types, plus one guy who's very into Ryle and hates the idea of dragging propositional attitudes into skill. My thesis, which I did NOT come up with last night but which last night convinced me to actually defend rather than hedge on, is the intellectualist one: that knowledge-how is just knowledge-that — roughly, if you know how to ride a bike, you know that a certain way of riding is a way of riding, where the "way" is presented to you practically rather than by description, which is supposed to explain why it feels different from knowing facts.

  My argument sketch, so you know what the objections are landing on: (1) Ryle's regress — the intellectualist says you can't get smart action by adding a thought in front of action, but I want to flip it and argue the regress only bites if you assume the knowledge-that requires a separate act of contemplating the proposition, and I deny that; (2) the standard linguistic moves — "Hannah knows how to swim" behaves grammatically like "Hannah knows that swimming this way is a way of swimming," embedded questions and all; (3) the pianist with arthritis / the ski instructor who can't ski anymore cases, which I use to argue knowledge-how and ability are separable, so skill itself can't be the knowledge. My friend hammered me on exactly the arthritis case all night so I'm half-convinced my use of it is circular or close to it, worth flagging.

  What I need from you is a Q&A prep sheet, not a defense of the view. The objections this specific audience will actually raise — they will NOT ask me the ordinary philosophy-of-language questions, they'll come at me from the body, chicken sexers, the guy who learned to catch fly balls and insists he has no idea how he does it, probably hub-and-spoke stuff about cognition being for action, not representation — in roughly the order they'll come, phrased the way embodied cognition people actually phrase them (they have their own vocabulary, they talk about skilled coping and body schemas and say things like "the knowledge is in the movement itself"). For each: a reply I can actually give in two minutes, what I should concede up front because conceding it costs me nothing, and where the reply is genuinely soft. And please include the question I'm praying nobody asks, because after last night I know it exists, I just can't articulate a good answer to it yet.
