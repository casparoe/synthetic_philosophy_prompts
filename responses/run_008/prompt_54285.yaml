      *   *Tension:* Yes, normative tension. No, practical tension (due to verification).
      *   *LE Design:* Health becomes invasive. UI stays similar.
      *   *Rawlsian Design:* UI becomes unconditional (or closer to). Health stays similar.
      *   *Verdict:* **Bureaucratic Realism over Normative Coherence.**
      *   *Mind Change:* Evidence of enforcement patterns or cross-national variation that decouples cost from policy.

  10. **Refining the Philosophical Nuance:**
      *   Make sure to distinguish between *Luck Egalitarianism* (the normative theory) and *Responsibility-Sensitive Policy* (the practice).
      *   Note that Rawls doesn't necessarily demand unconditional UI, but his focus on the "social bases of self-respect" might argue against stigmatizing the fired worker.
