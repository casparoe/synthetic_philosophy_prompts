          *   Health: Same as current (mostly).
          *   *Key Shift:* UI becomes universal basic income-ish or unconditional during joblessness.

  7.  **Commit to a Verdict:**
      *   The best explanation is **Administrative Feasibility acting as a filter on Moral Desert.** It's not a coherent theory of justice; it's a bureaucratic compromise. The normative core is **Social Insurance (Bismarckian)** logic: you pay in to draw out, but "fraud/misconduct" voids the claim. Health is treated as a right (Beveridgean) regardless of contribution history.
      *   *Refined Verdict:* **Institutional Hybridity.** UI is insurance-contractual; Health is citizenship-based. The "theory" is the mismatch between these institutional logics.
      *   *Wait, I need to pick one explanatory framework.* Let's go with **Administrative Feasibility constraining a Weak Form of Luck Egalitarianism.** We *want* to penalize choice, but only when it's cheap to do so.
      *   *Actually, the strongest fit:* **The "Public/Private" Boundary of Responsibility.** We treat labor market participation as a contractual sphere (responsibility applies) and biological survival as a pre-political sphere (responsibility suspended).
      *   *Decision:* I will argue the implicit theory is **Pragmatic Institutionalism** where **Verification Costs** dictate the application of **Responsibility-Sensitive Norms.** It *looks* like Luck Egalitarianism, but it's actually Bureaucratic Realism.

  8.  **Falsifiability/Mind Changing:**
      *   What would change my mind? If we see jurisdictions with low verification costs for health (digital health tracking) *still* not penalizing lifestyle, or jurisdictions with high verification costs for UI *still* penalizing cause. Or if UI "for cause" denials are actually rarely enforced.
      *   Where reasoning might fail: Underestimating the normative power of "desert" in labor law vs. medical ethics.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the prompt. State the puzzle clearly.
