      *   **Topic:** The design of social insurance programs (specifically the discrepancy between Unemployment Insurance [UI] and Disability/Health Insurance regarding responsibility/choice).
      *   **Core Question:** Reconstruct the implicit theory of justice behind this "patchwork." Is it luck egalitarianism, deterrence, desert, actuarial fairness, or administrative feasibility?
      *   **Secondary Questions:** Are the two halves in tension or reconcilable? What changes under thoroughgoing luck egalitarianism? What changes under a Rawlsian view (responsibility doesn't justify unequal basic goods)?
      *   **Constraints:** Commit to a verdict on the best explanatory theory. State explicitly what would change my mind (falsifiability/conditions for revision). Identify where reasoning is most likely to fail.
      *   **Tone:** Academic, rigorous, philosophical, nuanced.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation 1 (UI):* Laid off (bad luck/structural) $\rightarrow$ Benefits. Fired for cause (choice/misconduct) $\rightarrow$ No/Reduced Benefits.
      *   *Observation 2 (Health/Disability):* Illness/Injury (brute luck) $\rightarrow$ Benefits. Illness/Injury (option luck/lifestyle) $\rightarrow$ Benefits (usually).
      *   *The Tension:* Why punish choice in UI but not in Health/Disability?

  3.  **Evaluate Candidate Theories:**
      *   *Luck Egalitarianism (LE):* Distinguishes brute luck (compensate) vs. option luck (don't compensate).
          *   *Fit:* Explains UI (fired for cause = option luck). Fails Health/Disability (smoking = option luck, yet compensated).
          *   *Verdict:* Inconsistent application.
      *   *Desert:* You deserve help only if you didn't do wrong.
          *   *Fit:* Explains UI. Fails Health/Disability (smokers don't "deserve" cancer less, but we treat them anyway).
      *   *Deterrence/Incentives:* Deny benefits to discourage firing/bad behavior.
          *   *Fit:* Explains UI (discourage misconduct). Fails Health/Disability (denying care to smokers doesn't deter past smoking, might deter future, but humanitarian costs are high).
      *   *Actuarial Fairness:* Premiums match risk.
          *   *Fit:* Private insurance does this. Public systems usually pool risk. Doesn't explain the *eligibility* distinction well.
      *   *Administrative Feasibility/Verification Costs:*
          *   *Fit:* High. It's easy to verify "fired for cause" (employer record). It's hard/expensive/intrusive to verify "did you wear a seatbelt?" or "did you smoke?" for every claim.
      *   *Social Solidarity/Humanitarianism:* Basic needs trump responsibility in health, but income maintenance is conditional on labor market standing.

  4.  **Synthesize the "Implicit Theory":**
      *   It's not a pure normative theory (like LE or Rawls). It's a *hybrid* driven by **Administrative Feasibility constrained by a Threshold of Humanitarian Necessity.**
      *   *UI:* Income replacement is conditional on "insurable status." Misconduct breaks the insurance contract. Verification is low-cost (employer paperwork).
      *   *Health:* Need is urgent/visceral. Verification of lifestyle causes is high-cost/high-intrusion. Denying care creates visible suffering (political cost).
      *   *Label:* **Pragmatic Sufficientarianism with Administrative Constraints.** (Or "Bounded Solidarity"). Let's refine this. It looks like **Institutional Pragmatism grounded in a Distinction between Status-Based vs. Need-Based Entitlements.**
      *   *Better Label:* **The "Verifiability-Constrained Solidarity" Model.** We want to be solidaristic, but only where we can't easily distinguish choice from luck, *unless* the choice is formally adjudicated (like employment termination).

  5.  **Address the Tension:**
      *   Are they in tension? Normatively, yes (LE says both should track choice). Practically, no (different administrative natures).
      *   Reconciliation: The cost of verifying "cause" in health is too high relative to the moral hazard, whereas in UI, the "cause" is already determined by a third party (employer/court) as part of the exit process.

  6.  **Counterfactual Designs:**
      *   *Thoroughgoing Luck Egalitarianism:*
          *   UI: Same (mostly).
          *   Health: Investigate lifestyle. Reduce benefits for smokers, reckless drivers, extreme sports. Requires massive surveillance/medical auditing.
      *   *Rawlsian (Difference Principle/Basic Goods):*
