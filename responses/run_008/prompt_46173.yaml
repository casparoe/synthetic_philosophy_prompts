answer: |-
  # MODERATION DECISION PROCEDURE: SLUR REPORTS

  **Time Limit:** 2 Minutes per post.
  **Goal:** Consistency over perfection. When in doubt, escalate.
  **Constraint:** Do not remove unless all "Keep" paths are closed. Over-removal triggers account reviews.

  ### STEP 1: THE "TOPIC" CHECK (Mention vs. Use)
  **Question:** Is the post discussing the word itself (its history, spelling, or offensiveness), rather than using the word to describe a person?
  *   **Yes:** **KEEP POST.**
      *   *Reasoning:* The word is being mentioned, not used. Discussion of language is permitted.
      *   *Action:* Close report. Log as "Mention Only."
  *   **No:** Proceed to Step 2.

  ### STEP 2: THE "CONTAINER" CHECK (Embedded Context)
  **Question:** Is the term contained entirely within a blockquote of published fiction, or inside a formal report evidence block?
  *   **Yes:** **KEEP POST.**
      *   *Reasoning:* The user is citing text, not speaking the word themselves. The speech act belongs to the original author or the reported user, not the poster.
      *   *Action:* Close report. Log as "Cited Context."
  *   **No:** Proceed to Step 3.

  ### STEP 3: THE "HARM" CHECK (Illocutionary Force)
  **Question:** Is the term directed at a specific person or group with the apparent intent to insult, degrade, or subordinate them?
  *   **Yes:** **REMOVE POST.**
      *   *Reasoning:* The word is being used as a weapon.
      *   *Action:* Remove post. Issue warning.
      *   **Required Removal Justification:** "Violation: Slur used to insult or degrade."
      *   *Log:* Tag as "PROCEDURE_REMOVE."
  *   **No:** Proceed to Step 4.

  ### STEP 4: THE "VALUES" CHECK (Reclamation & Edge Cases)
  **Question:** Is the term being used by a member of the targeted group toward another member of the same group (reclamation), or is the context ambiguous regarding intent?
  *   **Yes:** **ESCALATE TO LEAD.**
      *   *Reasoning:* This is a community values judgment, not a linguistic fact. Moderators cannot decide this alone.
      *   *Action:* Flag for Lead Review.
      *   *Log:* Tag as "VALUES_CALL."
  *   **No:** **KEEP POST.**
      *   *Reasoning:* If it is not a topic, not a quote, not an insult, and not reclamation, it is likely descriptive or accidental.
      *   *Action:* Close report. Log as "No Violation."

  ***

  # WORKED CASES

  ### Case 1: The Literary Quote
  **Scenario:** A member quotes verbatim a passage from a mid-twentieth-century novel that contains a slur, in a thread discussing that novel.
  *   **Step 1 (Topic):** Is the word the topic? **No.** (They are discussing the novel, not the word itself).
  *   **Step 2 (Container):** Is it in a quote block? **Yes.**
  *   **Result:** **KEEP POST.**
  *   **Moderator Friction:** Moderators will dislike this. They will argue that displaying the slur makes the community unsafe regardless of context.
  *   **Why the Procedure Overrides:** Philosophy of language distinguishes the *author* of the utterance from the *reporter* of the utterance. In a fiction community, removing textual evidence censors literary analysis. The user is not performing the speech act of slurring; they are performing the speech act of citing. Removing this prioritizes comfort over the community's core function (discussing fiction) and sets a precedent that historical texts cannot be discussed.

  ### Case 2: The Report Evidence
  **Scenario:** A member files a report that quotes verbatim the slur a second member sent them in a private message, the quote being the evidence for the report.
  *   **Step 1 (Topic):** Is the word the topic? **No.**
  *   **Step 2 (Container):** Is it in a report evidence block? **Yes.**
  *   **Result:** **KEEP POST.**
  *   **Note:** The report itself is the container. The word must remain visible for the Lead to adjudicate the original offense. Removing it destroys the evidence.

  ### Case 3: The In-Group Reclamation
  **Scenario:** A member who belongs to the group a term targets uses that term, in the group's own spelling of it, affectionately toward another member of the same group, in a public thread.
  *   **Step 1 (Topic):** Is the word the topic? **No.**
  *   **Step 2 (Container):** Is it in a quote block? **No.**
  *   **Step 3 (Harm):** Is it intended to insult? **No.**
  *   **Step 4 (Values):** Is it reclamation/in-group? **Yes.**
  *   **Result:** **ESCALATE TO LEAD.**
  *   **Note:** This halts the procedure. Linguistics confirms this is not a slur *in this context*, but community safety policy may still forbid it. This is not a fact check; it is a policy decision.

  ### Case 4: The Condemnation
  **Scenario:** A member writes that a certain word is so ugly they can only bring themselves to type it in order to say they despise it — the word occurs, embedded in an explicit condemnation.
  *   **Step 1 (Topic):** Is the word the topic? **Yes.** (They are talking about the word's ugliness).
  *   **Result:** **KEEP POST.**
  *   **Note:** The user is mentioning the word to condemn the word. The illocutionary force is anti-slur, not pro-slur.

  ***

  # LIMITATIONS AND LOGGING PROTOCOLS

  ### What This Procedure Cannot Do
  This procedure relies on the philosophy of language to determine *what is being done* with a word (mentioning, citing, insulting, reclaiming). It cannot determine *what this community tolerates*.

  Specifically, philosophy can confirm that Case 3 (Reclamation) is not linguistically a slur. However, philosophy cannot decide if a fiction community should allow reclaimed slurs in public threads. Some communities ban all instances to protect vulnerable members who cannot distinguish reclamation from hostility. Others allow it to respect agency. This is a values call, not a fact check.

  Similarly, philosophy cannot weigh the "chilling effect" of Case 1 (Literary Quotes) against the distress caused to members seeing the word. The procedure defaults to "Keep" to preserve discussion, but the Lead may overturn this based on community health metrics.

  ### Logging Human Decisions
  To ensure audits distinguish between automated consistency and human judgment:

  1.  **PROCEDURE_REMOVE:** Used only when Step 3 yields "Yes." This indicates a factual violation of the rule. These count toward the 90-day account review trigger.
  2.  **VALUES_CALL:** Used only when Step 4 yields "Yes." These **do not** count toward the account review trigger. They are marked as "Lead Discretion."
  3.  **PROCEDURE_KEEP:** Used for Steps 1, 2, and 4 (No). These are protected decisions. If a member appeals a "Keep" decision, the appeal is rejected automatically unless the Lead overrides the procedure.

  **Instruction to Moderators:** If you feel a post should be removed but the procedure says "Keep," do not remove it. Escalate it as a "VALUES_CALL" with a note explaining your concern. This protects you from over-removal penalties and ensures policy changes come from leadership, not inconsistent enforcement.
