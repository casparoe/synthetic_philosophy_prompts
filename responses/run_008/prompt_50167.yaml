prompt: |-
  Two fellow PhD students in my cognitive science program have been arguing for weeks about the extended mind thesis, and as the bystander who got asked to referee, I'd like a point-by-point adjudication of the exchange as it actually happened.

  Some background. After a concussion left Dana with a much shakier short-term memory, she rebuilt her academic life around her phone: every reading annotation, lab meeting note, and appointment lives in it, and alarms prompt her through the day. At a lab meeting she said the phone is now literally part of her mind, not a tool her mind uses.

  Marco objected that constant use doesn't make something part of you: she consults the app the way a pilot consults instruments or a scholar visits a library, and no one ever counted visiting a library as remembering. Dana replied by parity: were the same information stored in her skull and retrieved with the same speed and fluency, no one would hesitate to call it memory, and she can't see why the boundary of the skin should mark a difference that matters. Marco answered that her retrieval isn't fluent in the relevant way: she has to decide to check, she sometimes doubts her own notes, and when she lost the phone for a weekend she didn't lose memories, she lost access to records, whereas a stroke would have taken the memories themselves. Dana's last move was that the checking has become entirely habitual — she endorses the notes unhesitatingly, relies on them the way she once relied on recall, and felt the loss as a kind of amnesia — and that proponents of the thesis have proposed roughly these criteria (reliability, automatic trust, easy access), which she satisfies. Marco closed with a bloat objection: on that standard his glasses, his bicycle, and perhaps the department administrator's filing system all become parts of minds, which suggests the criteria aren't individuating cognition at all, just licensing a rhetorical reclassification of ordinary tool use.

  Please adjudicate the exchange move by move — say who's right at each step and why, where each side concedes too much or too little, and what, if anything, both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two PhD students (Dana and Marco) about the Extended Mind Thesis (EMT).
      *   **Format:** Point-by-point adjudication of the exchange as it happened.
      *   **Requirements:** Say who's right at each step, why, where they concede too much/too little, and identify what both are missing.
      *   **Context:** Cognitive Science PhD program. Dana has a concussion and relies heavily on her phone. Marco is the skeptic.
      *   **Key Arguments:**
          *   Dana: Phone is part of her mind (EMT). Parity principle (if it were in the head, it'd be memory).
          *   Marco: Constant use $\neq$ part of you. Analogy to pilot/library. Retrieval isn't fluent (conscious check, doubt). Loss of phone $\neq$ loss of memory (access vs. storage). Bloat objection (glasses, bike, filing system).
          *   Dana (Rebuttal): Habitual checking, automatic trust, reliance. Meets EMT criteria (reliability, trust, access). Felt loss as amnesia.
      *   **Goal:** Provide a fair, philosophically informed, and nuanced ruling.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1: Dana's Initial Claim.**
          *   *Claim:* Phone is literally part of her mind due to concussion/reliance.
          *   *Philosophy:* Core EMT claim (Clark & Chalmers).
          *   *Assessment:* Plausible within EMT framework, but needs justification (which she provides next).

      *   **Move 2: Marco's Initial Objection.**
          *   *Claim:* Use $\neq$ Constitution. Analogy: Pilot/Instruments, Scholar/Library.
          *   *Philosophy:* The "Coupling-Constitution Fallacy." Standard internalist objection.
          *   *Assessment:* Strong intuition pump, but Clark & Chalmers specifically address the library case (Otto vs. Inga).

      *   **Move 3: Dana's Parity Principle.**
          *   *Claim:* If internal, it's memory. Skin boundary shouldn't matter.
          *   *Philosophy:* The Parity Principle (Clark & Chalmers 1998).
          *   *Assessment:* This is the heart of EMT. Strong argument *if* the functional roles match.

      *   **Move 4: Marco's Fluency/Access Objection.**
          *   *Claim:* Retrieval isn't fluent (decision to check, doubt). Loss of phone $\neq$ stroke (access vs. storage).
          *   *Philosophy:* Criteria for "glue and trust" (later Clark criteria). Distinction between dispositional belief and occurrent access.
          *   *Assessment:* Very strong. This targets the specific criteria EMT proponents later refined to avoid the library objection.

      *   **Move 5: Dana's Rebuttal (Habit/Trust).**
          *   *Claim:* Checking is habitual, trust is automatic, loss felt as amnesia. Meets criteria (reliability, trust, access).
          *   *Philosophy:* Refining the Parity Principle to meet the "glue and trust" conditions.
          *   *Assessment:* Strengthens her case significantly regarding the specific phone usage.

      *   **Move 6: Marco's Bloat Objection.**
          *   *Claim:* Slippery slope (glasses, bike, admin). Criteria don't individuate cognition.
          *   *Philosophy:* The "Cognitive Bloat" objection (Adams & Aizawa, etc.).
          *   *Assessment:* A classic and serious challenge to EMT. Needs careful handling.

  3.  **Evaluate the Philosophical Substance (The "Referee" Role):**
      *   *EMT Background:* Clark & Chalmers (1998) "The Extended Mind." Otto (notebook) vs. Inga (biological memory).
      *   *Criteria:* Availability, Accessibility, Reliability, Automatic Endorsement (Trust).
      *   *Critiques:* Adams & Aizawa (Mark of the Cognitive), Coupling-Constitution Fallacy, Bloat.
      *   *Dana's Case:* She is essentially "Otto" (the Alzheimer's patient in the thought experiment) but with a phone. Her concussion makes her a stronger case than a neurotypical person using a phone.
      *   *Marco's Case:* He is arguing for Internalism/Individualism. He raises valid concerns about boundaries and the definition of cognition.

  4.  **Drafting the Adjudication (Iterative Process):**

      *   *Introduction:* Acknowledge the quality of the debate. It mirrors the actual philosophical literature (Clark/Chalmers vs. Adams/Aizawa/Rowlands).
      *   *Round 1 (Claim vs. Tool):* Dana makes the bold claim. Marco makes the common-sense distinction. *Ruling:* Marco is right on common sense, Dana is right on philosophical theory. But Dana needs to prove *constitution* not just *coupling*.
      *   *Round 2 (Parity vs. Fluency):* Dana invokes Parity. Marco attacks the functional match (fluency/trust). *Ruling:* Marco scores a point here. The original Parity Principle was too loose. Clark later admitted the need for "trust and glue." Dana's initial parity claim was too quick.
      *   *Round 3 (Habit vs. Bloat):* Dana refines her criteria (habit/trust). Marco goes for Bloat. *Ruling:* Dana is stronger here regarding her specific case (Otto case). Marco's bloat objection is theoretically important but less damaging to *this specific case* if the criteria are strict. However, he's right that loose criteria cause bloat.
      *   *Synthesis/What's Missing:* Both are stuck in the 1998-2008 debate. They are missing:
          1.  *Mechanism:* How does the information actually integrate? (Predictive Processing/Active Inference).
          2.  *Normativity:* Is it just about storage, or about *reasoning*?
          3.  *The "Mark of the Cognitive":* They haven't defined what cognition *is* before arguing where it *is*.
          4.  *Clinical Context:* Dana's concussion makes this a case of *scaffolding* or *compensation*, which might differ from standard EMT.

  5.  **Refining the Tone:**
      *   Needs to be academic but accessible (PhD level).
      *   Fair to both sides.
      *   Decisive but nuanced.
      *   Avoid simply saying "Clark won." Acknowledge the validity of Internalist critiques.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to treat Dana's concussion as a weakness in her argument; it actually strengthens her EMT claim (she is Otto).
      *   *Correction:* Ensure Marco's "Bloat" objection is addressed properly. It's not just a slippery slope; it's about the loss of explanatory power.
      *   *Addition:* Mention the "Coupling-Constitution Fallacy" explicitly as it's the core of Marco's first objection.
      *   *Addition:* Mention "Glue and Trust" as the specific criteria Dana invokes later.

  7.  **Final Structure:**
      *   Introduction (Contextualizing the debate).
      *   Move-by-Move Adjudication (1-6).
      *   Overall Verdict (Who won the exchange?).
      *   The Missing Middle (What philosophical ground was overlooked).
      *   Recommendation for resolution.

  8.  *(Final check against prompt)*: Did I say who is right at each step? Yes. Did I say where they concede too much/little? Yes. Did I say what they are missing? Yes.

      *Let's write it.*
answer: |-
  This is an exceptionally high-quality exchange. It effectively recapitulates the core dialectic of the philosophy of cognitive science from 1998 (Clark & Chalmers) through the 2010s (Adams, Aizawa, Rowlands). As the referee, I will adjudicate this move-by-move, assessing the philosophical validity of each claim, before offering a synthesis of what the debate overlooks.

  ### Move 1: The Claim (Dana) vs. The Tool Objection (Marco)

  **Dana:** Claims the phone is *literally* part of her mind due to reliance following injury.
  **Marco:** Objects that constant use $\neq$ constitution. Analogizes to pilot/instruments and scholar/library.

  **Adjudication:** **Marco wins the intuition pump; Dana wins the theoretical framework.**
  Marco is correctly identifying the **Coupling-Constitution Fallacy**. Just because two systems are causally coupled (brain and phone) does not mean they constitute a single cognitive system. His library analogy is the classic internalist counter-example: using a library is not remembering, it is storing.
  *However*, Dana is operating within the Extended Mind Thesis (EMT) framework, which explicitly challenges the intuition that the skin/skull is the boundary of the cognitive.
  *   **Critique:** Dana concedes too little here. She asserts the conclusion ("literally part of her mind") without yet providing the functional criteria to distinguish this from mere tool use. Marco concedes too little by treating the library analogy as a knockout blow, ignoring that EMT proponents specifically designed the thesis to challenge the library intuition.

  ### Move 2: The Parity Principle (Dana) vs. The Fluency Objection (Marco)

  **Dana:** Invokes the Parity Principle: If this process were in the head, we'd call it memory. The skin boundary is irrelevant.
  **Marco:** Distinguishes based on fluency and phenomenology. Retrieval requires a decision to check; she doubts the notes. Loss of phone = loss of access, not loss of memory (unlike a stroke).

  **Adjudication:** **Marco wins this round decisively.**
  Dana's initial invocation of the Parity Principle is too blunt. Clark and Chalmers (1998) anticipated this and refined the criteria. Marco correctly identifies that Dana's retrieval lacks the **dispositional immediacy** of biological memory.
  *   **Why Marco is right:** Biological memory is typically available without a conscious decision to "query" an external device. Furthermore, Marco's distinction between *access* and *storage* is crucial. If the phone breaks, the information is gone, but Dana's *capacity* to remember (biologically) isn't damaged in the same way a stroke damages the capacity.
  *   **Where Dana concedes too much:** She accepts the burden of proving the phone is *memory* specifically, rather than a different cognitive kind (e.g., transactive memory or scaffolding).
  *   **Where Marco concedes too little:** He assumes that "decision to check" disqualifies extension. Many internal memory retrievals require cues or deliberate search strategies.

  ### Move 3: Habit/Trust (Dana) vs. Cognitive Bloat (Marco)

  **Dana:** Refines criteria: Checking is habitual, trust is automatic, loss felt as amnesia. Claims she meets EMT criteria (reliability, trust, access).
  **Marco:** Raises the Bloat Objection: If these are the criteria, then glasses, bicycles, and filing systems are also minds. The criteria fail to individuate cognition.

  **Adjudication:** **Split Decision (Dana on the specific case, Marco on the general theory).**
  Dana significantly strengthens her position here by aligning with Clark's later "Glue and Trust" conditions (2008). For a resource to be extended, it must be reliably available, automatically trusted, and easily accessible. Given her concussion, her phone likely meets these conditions better than a neurotypical person's phone. The phenomenological report ("felt as amnesia") is strong evidence of integration.
  *   **Why Marco is right on Bloat:** The Bloat Objection (associated with Adams & Aizawa) is the strongest argument against EMT. If *any* reliable, trusted tool is cognitive, the concept of "cognition" loses its explanatory power. If my glasses are part of my visual mind, and my bike is part of my navigational mind, "mind" becomes co-extensive with "environment."
  *   **Why Dana is right on the Case:** Marco's bloat objection is a *reductio ad absurdum* against the *criteria*, not necessarily against Dana's specific situation. Dana's case is analogous to "Otto" (the Alzheimer's patient in the original thought experiment). Her injury makes the integration tighter than a scholar visiting a library.

  ### Overall Verdict

  **Who won the exchange?**
  **Dana wins the specific case; Marco wins the theoretical boundary.**

  Dana successfully demonstrates that, *for her*, the phone functions as a cognitive prosthesis that meets the functionalist criteria for extension (specifically the "Otto" case). Her reliance is not merely causal; it is constitutive of her current cognitive agency.

  However, Marco is correct that the criteria she uses are vulnerable to bloat. He successfully shows that EMT risks dissolving the boundary of the cognitive agent entirely if not carefully constrained. He forces Dana to admit that her argument relies on a specific phenomenological intensity (habitual trust) that may not apply to general tool use.

  ### What Both Are Missing

  As a referee, I must point out that both students are fighting a battle from 1998–2010. They are missing three crucial developments in contemporary cognitive science:

  **1. The "Mark of the Cognitive" Problem**
  They are arguing about *where* cognition is without agreeing on *what* cognition is.
  *   **Marco** assumes cognition is intrinsically neural (internalism).
  *   **Dana** assumes cognition is defined by functional role (functionalism).
  *   **Missing:** They need to agree on a "Mark of the Cognitive." Is it non-derived content (Adams & Aizawa)? Is it prediction error minimization (Predictive Processing)? Without defining the *mechanism* of cognition, arguing about its *location* is premature.

  **2. Scaffolding vs. Extension**
  Dana frames this as "the phone is my mind." A more precise description might be **cognitive scaffolding**.
  *   **Missing:** Scaffolding acknowledges the deep reliance and integration Dana describes without requiring the metaphysical claim that the phone is *part of* the mind. This allows her to keep the practical benefits of her argument (accommodations, understanding her injury) without inviting Marco's Bloat Objection. The phone is a scaffold that supports a damaged cognitive architecture, not necessarily a new piece of that architecture.

  **3. Active Inference and Sensorimotor Contingencies**
  Modern embodied cognitive science suggests the boundary isn't skin vs. world, but **control and prediction**.
  *   **Missing:** If Dana's brain has incorporated the phone's latency and interface into its predictive models (i.e., she predicts the world *through* the phone), the distinction between access and storage dissolves. Marco's objection about "deciding to check" matters less if the "decision" is sub-personal and integrated into her sensorimotor loop. Neither student appeals to the *mechanism of integration* (e.g., neural plasticity regarding the device), which would settle the fluency debate empirically.

  ### Recommendation for Resolution

  1.  **Acknowledge Dana's Functional Reality:** Marco should concede that for Dana's specific clinical context, the phone is not a mere tool like a library. It is a **prosthetic cognitive resource**. Denying this ignores the phenomenological and functional reality of her recovery.
  2.  **Refine the Ontology:** Dana should concede that "part of the mind" is metaphorically useful but metaphysically risky due to the Bloat Objection. She should adopt the **Scaffolding** view: the phone is an external structure that her mind leans on so heavily that removing it causes cognitive collapse, without needing to claim the silicon is literally mental tissue.
  3.  **Empirical Adjudication:** The debate is currently philosophical. To resolve it scientifically, they should look at **interference tasks**. If Dana is prevented from using her phone, does it consume working memory in the same way a biological memory task does? If dual-tasking with the phone interferes with internal recall, that suggests a shared cognitive resource, supporting Dana. If not, it supports Marco.

  **Final Ruling:** Dana is practically right about her experience; Marco is theoretically right about the boundaries. The thesis holds for Dana as a case of *scaffolding*, but Marco is correct that it cannot be universalized to all tool use without diluting the concept of cognition.
