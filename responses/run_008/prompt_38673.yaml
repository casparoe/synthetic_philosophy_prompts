  **MEMORANDUM**

  **TO:** Grant Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Decision Framework for Portfolio Allocation

  **Recommendation**

  For this funding cycle and future strategic planning, I recommend the committee adopt **Expected Value (EV) Maximization** as our primary decision framework.

  We should fund Portfolio A, provided the probability of government collapse is accurately priced into the expected value calculation. We should not apply an additional "risk penalty" to the utility of lives saved based on the volatility of the outcome.

  **Rationale**

  Our mandate is to improve global health outcomes, not to manage the foundation's risk profile for its own sake. In a utilitarian framework—which underpins our mission—the moral value of a life saved does not diminish because it was saved in a volatile context, nor does it increase because it was saved in a stable one.

  The EV faction is correct that applying a risk-aversion discount effectively privileges the foundation's psychological comfort or institutional stability over the actual beneficiaries. If Portfolio A has a higher expected number of lives saved, rejecting it in favor of Portfolio B means we are consciously choosing to save fewer lives on expectation. In a resource-constrained environment, that trade-off is difficult to justify ethically. Variance is not a cost; failure is. EV maximization forces us to confront the probability of failure directly rather than hiding it behind a risk-aversion parameter.

  **The Strongest Argument Against This Recommendation**

  I want to address the Risk-Weighted Expected Utility (RWEU) faction directly, as your concerns are substantial and deserve more than a dismissal as "cowardice."

  Your strongest point is that **plain EV maximization treats a certainty and a gamble with the same mean as morally identical, and this ignores the specific moral weight of catastrophic failure.**

  You argue that when the downside falls entirely on third parties (the beneficiaries), a "total wipeout" in Portfolio A is not just a zero in a spreadsheet. It represents a breach of trust with a specific population that may be left worse off than if we had never intervened (e.g., through disrupted supply chains or raised expectations). Furthermore, you argue that the foundation is an instrument for *sustained* impact. A catastrophic failure in Portfolio A could damage our reputation to the point where future funding dries up, causing a non-linear loss of future impact that EV calculations in a single cycle miss.

  This is a serious objection. It correctly identifies that we are playing an iterated game, not a one-off bet. If "risk aversion" is actually a proxy for "ensuring institutional survival to fight another day," then it is not cowardice; it is stewardship.

  **Why EV Still Prevails**

  While the stewardship argument is valid, it should be handled as a **boundary constraint**, not a change in the utility framework. We should not fund Portfolio A if its failure threatens the foundation's solvency or ability to operate in the future. But if the risk is contained to the specific grant cycle—as implied by the "portfolio" structure—then we must not let the fear of variance dilute our commitment to maximizing impact.

  To adopt RWEU as a general framework is to assert that a life saved in a stable country is inherently more valuable than a life saved in an unstable one. I cannot endorse that hierarchy. We should price the risk of collapse accurately, accept it if the EV is high, and own the outcome.

  **Next Steps**

  1.  **Adopt EV Maximization** as the standard for comparing portfolios.
  2.  **Stress-test Portfolio A** specifically for "ruin scenarios" that threaten the foundation's long-term viability (distinct from program failure).
  3.  **Proceed with Portfolio A** if the EV remains superior after stress-testing.

  We are here to save lives, not to sleep well. Let's maximize the former.
