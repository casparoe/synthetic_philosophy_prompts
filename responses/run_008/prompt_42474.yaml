  ## 7. Detailed Argumentative Strategy

  To ensure the paper meets the academic standards of a third-year causation course, I will employ a specific argumentative strategy in the final paper, which I will preview here to demonstrate feasibility.

  ### 7.1 The "Translation Manual" Approach
  I will construct a "translation manual" between the two languages.
  *   Lewisian "World" $\leftrightarrow$ Interventionist "Model State"
  *   Lewisian "Law of Nature" $\leftrightarrow$ Interventionist "Structural Equation"
  *   Lewisian "Miracle" $\leftrightarrow$ Interventionist "Equation Replacement"
  *   Lewisian "Similarity Metric" $\leftrightarrow$ Interventionist "Causal Graph Structure"

  By explicitly mapping these terms, I can show that every move Lewis makes has a counterpart in Woodward's framework. For instance, when Lewis says "we prioritize avoiding big miracles," this translates to "we prioritize preserving the structural equations of the model." When Lewis says "we allow a small miracle at time $t$," this translates to "we replace the equation for variable $V_t$."

  This translation strategy allows me to argue that the "metaphysical weight" carried by terms like "miracle" is illusory. It sounds heavier than "equation replacement," but functionally they are identical.

  ### 7.2 The "Hidden Premise" Argument
  I will argue that both theories rely on a hidden premise: that the causal structure is prior to the counterfactual evaluation.
  *   Lewis needs to know which facts to hold fixed (the "past") to evaluate the counterfactual. This requires knowing what is causally prior.
  *   Woodward needs to know which arrows to cut (the "parents") to evaluate the intervention. This requires knowing what is causally prior.
  *   Therefore, neither theory can *analyze* causation from scratch. Both presuppose a causal ordering. If both presuppose it, then neither is more "fundamental" than the other. They are both tools for reasoning *within* a causal model, not tools for *defining* causation from non-causal facts.

  This is a strong philosophical conclusion that fits the scope of the course. It challenges the reductive ambition of both projects.

  ### 7.3 Addressing the "Agency" Objection
  A common objection to Interventionism is that it relies on the concept of an "intervention," which sounds like it requires an agent. If Lewis doesn't require an agent, they aren't isomorphic.
  I will counter this by relying on the "ideal intervention" distinction. Woodward explicitly states that interventions need not be performed by humans; they are hypothetical manipulations. I will argue that a "hypothetical manipulation" is metaphysically equivalent to a "counterfactual world." Both are modal constructs. Therefore, the agency worry is a red herring. The "intervention" is just a label for a specific type of counterfactual world—one where the variable is set exogenously.

  ## 8. Conclusion and Significance

  This project aims to cut through the terminological fog that often surrounds the metaphysics of causation. By identifying the functional isomorphism between Lewisian miracles and Woodwardian surgeries, I hope to show that the field has been debating the wrong question. We have been asking "Which theory is true?" when we should be asking "Which bookkeeping system is more useful for this specific problem?"

  If successful, this paper will contribute to a more pragmatic understanding of causal theories. It suggests that the "Counterfactual vs. Intervention" war is a civil war between two dialects of the same language. Recognizing this allows us to stop fighting over territory and start focusing on the limitations of the language itself—specifically, its reliance on non-backtracking constraints that are difficult to ground in a deterministic world.

  For the purposes of this course, this project demonstrates engagement with the core technical material (counterfactual semantics and causal graphs) while maintaining a critical philosophical perspective. It avoids mere summary and aims for a synthetic conclusion that re-frames the course material.

  The feasibility is high, provided I restrict the technical scope to acyclic models and focus on the interpretation of the formalism rather than its derivation. The risk of redundancy with existing literature is managed by focusing on the *metaphysical implications* of the isomorphism rather than the mathematical proof of it.

  I am confident that this proposal outlines a viable, rigorous, and philosophically interesting path for the term paper. It addresses the prompt's requirements for a precise question, methodology, and scope management, while leveraging the intuitive insight that the two dominant theories are closer cousins than they appear.

  ## 9. Reflection on Technical Fluency (Self-Assessment)

  To be honest about the requirements: Do I need to get properly fluent in the causal modelling formalism?
  **Yes, but selectively.**
  I cannot write this paper with a "hand-wavy" understanding of interventions. If I misdefine an intervention (e.g., confusing it with a conditional observation), the entire isomorphism argument collapses. I need to understand:
  1.  The distinction between $P(Y|X)$ and $P(Y|do(X))$.
  2.  How the $do$-operator modifies the joint distribution.
  3.  How counterfactuals are defined in SCMs (the "abduction, action, prediction" steps).

  However, I do *not* need to learn:
  1.  How to learn causal graphs from data (causal discovery).
  2.  How to handle cyclic graphs or time-series.
  3.  The full do-calculus (rules 1-3).

  **Trimming the Question:**
  If I find the SCM counterfactual definition (which involves three steps and world-indices) is too complex to map cleanly to Lewis in the word count, I will trim the project to focus *only* on the evaluation of simple counterfactuals, not nested counterfactuals. I will restrict the analysis to "first-order" causal claims ($X$ causes $Y$) rather than complex causal explanations. This ensures I can be precise about the formalism without getting lost in the weeds of advanced SCM theory.

  Furthermore, if the "Bookkeeping Conjecture" proves too strong (i.e., if I find a disanalogy I can't resolve), I will soften the claim. Instead of "They are the same," I will argue "They are more similar than the literature admits, and their differences are methodological rather than ontological." This preserves the core insight without risking falsification by a niche technical counter-example.

  ## 10. Final Summary of the Proposal

  **Research Question:** Is the divergence between Lewisian counterfactuals and Woodwardian interventionism a metaphysical disagreement or a methodological variation in enforcing non-backtracking constraints?

  **Thesis:** The divergence is methodological. The "miracle" and the "surgery" are isomorphic devices. The theories share the same failure modes because they share the same underlying logic.

  **Method:** Comparative analysis of minimal case studies (Preemption, Backtracking, Omissions) using both semantic frameworks side-by-side.

  **Outcome:** A deflationary account of the causation debate, shifting focus from metaphysical truth to pragmatic utility.

  **Feasibility:** High, contingent on mastering the basic definition of the $do$-operator and restricting the scope to acyclic models.

  This proposal sets the stage for a paper that is technically grounded but philosophically ambitious, suitable for a third-year specialist course. It respects the complexity of the material while attempting to synthesize it in a novel way. The word count and depth of this prospectus reflect the seriousness of the intended investigation, ensuring that the subsequent term paper will be well-structured and focused.

