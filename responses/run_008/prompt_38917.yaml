answer: |-
  Dear Colleague,

  I understand exactly the friction you are describing, that gap between the students assenting to the argument on paper and their intuition rebelling in the gut. It is the difference between knowing the map and walking the terrain, and your instinct to stage the underdetermination rather than lecture on it is precisely the right pedagogical move. The activity you outlined is strong, but it risks becoming a parlor game of lie detection unless we carefully rig the incentives and constraints to mirror the philosophical problem rather than a contest of wits. If the students treat it as a challenge to spot the liar, they will look for nervous ticks and stylistic flourishes, which misses the point that there is no fact of the matter to be found. We want them to reach a state of genuine epistemic humility where they realize that even with all the data available, the distinction collapses. Here is a design that attempts to tighten those screws, structured to fit your ninety minutes and twelve students, while keeping the focus on the phenomenology of reporting rather than the performance of deception.

  You should begin by dividing the class into two groups of six, sending one group into the corridor with a teaching assistant or a trusted student leader, while keeping the other group in the seminar room. The group in the room are the Experiencers. You will perform a staged event for them lasting exactly three minutes. It is crucial that this event is not too narrative-driven, as dreams are often fragmentary, so avoid a clear beginning, middle, and end. Instead, create a collage of sensory inputs. For example, stand silently for thirty seconds, then drop a metal key on the table, hum four bars of a recognizable tune while looking out the window, pick up a red book and turn it over twice, and then leave the room without speaking. The goal is to provide raw data that is specific enough to be verified but disjointed enough to require narrative stitching during recall. The group in the corridor are the Composers. They should not know what the Experiencers saw. Instead, give each Composer an envelope containing a set of cue cards. These cards should list the exact same elements you performed, but without the temporal order. One card says metal key sound, another says red book manipulated, another says humming, another says silence. Their instruction is critical here. Do not tell them to write a story. Tell them to write a first-person memory report of having witnessed these events. Explicitly instruct them to include uncertainties, gaps, and hesitations. If they write a polished narrative, they will be spotted immediately. They must mimic the texture of fallible memory. Give them ten minutes to compose this report.

  Once the reports are written, collect them and bring the corridor group back into the room. Now you have twelve reports, six based on actual perception and six based on construction. To prevent delivery cues from giving the game away, you or a neutral party should read them aloud while the authors sit silently. Alternatively, have the authors read them in a monotone, facing away from the audience, though having you read them ensures uniformity. After each report, open the floor for questioning. This is where you introduce the delay element you requested. Ask specific phenomenological questions about duration and sensory modality. Ask the author how long the silence felt, or whether the hum was internal or external. The Experiencers will rely on episodic memory, which is reconstructive anyway. The Composers must rely on semantic memory of what they just wrote. Instruct the Composers beforehand that when questioned, they must answer based strictly on the world implied by their text, not the act of writing it. If they wrote that the silence felt long, they must insist it felt long, even though they know it was ink on paper. This simulates the Dennettian claim that the dreamer accesses the narrative trace, not the original experience. Allow twenty minutes for this interrogation phase. Then, ask the class to vote on which reports are genuine. Inevitably, the class will split, and inevitably, they will be wrong about some. Do not reveal the truth immediately. Instead, move into the debrief while the uncertainty is still palpable.

  The scoring scheme should be light to avoid gamifying the epistemology. Give each student a slip of paper to mark their guesses, but tell them the goal is not to get a high score but to justify their confidence levels. If a student says they are ninety percent sure a report is real, ask them what feature grants that certainty. When you finally reveal the key, you will likely find that the features they trusted, such as sensory detail or emotional resonance, were present in both the fabricated and genuine reports. This is your entry point into Malcolm. You can point out that the grammar of their justification relied entirely on the coherence of the report, which validates Malcolm's claim that the report is the only criterion we have. There is no hidden camera in the mind to check against. When a Composer answers a question about how long an event felt with sincere conviction, despite knowing they invented it seconds ago, highlight this as the visceral proof of Dennett's composition theory. The Composer is not lying about the feeling; the feeling is generated by the narrative itself. The narrative creates the phenomenology retroactively. This is the bone-level feeling you want them to have, that the report does not describe the experience so much as constitute it.

  However, you must be prepared for predictable failures, and addressing these openly is part of the lesson. The first risk is that students will treat this as a lie detection exercise. They will watch for blinking, hesitation, or smirking. To counter this, enforce the rule that all questions must be about the content of the report, not the behavior of the speaker. If a student says he sounded nervous, dismiss that data point as irrelevant to the philosophy of mind. The second risk is that the Composers will write reports that are too coherent. Dreams are often bizarre and disjointed. If the fabricated reports are too logical, the Experiencers' reports might look messier and thus be flagged as fake. To mitigate this, instruct the Composers to introduce one logical inconsistency or gap in their report, mimicking the way dream memory often fails. A third failure mode is that the Experiencers might confabulate during the questioning. Since human memory is reconstructive, an Experiencer might misremember the order of the key and the book. This is actually a feature, not a bug. It demonstrates that even the genuine reports are not pure data streams but are already composed narratives. If an Experiencer gets a detail wrong, highlight that their memory is already undergoing the Dennettian revision process upon waking.

  There is, however, a hard limit to this simulation that you must acknowledge honestly in the debrief, for it marks the boundary where the analogy breaks down. In your activity, the Composers know they are composing. They have a dual awareness of the fabrication and the performance. In the dream case, according to Dennett, the subject does not know the experience is composed. The dreamer believes the narrative corresponds to a real-time experience. This first-person symmetry is only approximated in your seminar. The Composers are acting as if they remember, whereas the dreamer actually takes themselves to remember. You should tell the students that this asymmetry is the remaining hurdle. The activity proves that an observer cannot distinguish the two, which supports Malcolm. It proves that a composer can feel the reality of a constructed event, which supports Dennett. But it cannot fully replicate the self-deception of the dream state where the construction mechanism is hidden from the subject itself. Acknowledge this limitation explicitly. It shows intellectual honesty and prevents students from dismissing the exercise because they know the Composers were lying. The point is not that the cases are identical, but that the external evidence available to the judge is identical in both cases.

  To map this specifically to your texts, when the class fails to sort the reports, draw their attention to Malcolm's argument that the concept of dreaming is tied to the waking report. There is no independent check. The activity makes them feel the frustration of wanting that independent check and failing to find it. When a Composer insists on the duration of an event they invented, link this to Dennett's Stalnaker quote or his discussion of the Orbitron model, where the brain fills in the details at the moment of recall. Ask the Composers if they felt the time pass while writing. They will say no. Then ask if the report implies time passed. They will say yes. This gap between the writing time and the reported time is the space where the dream happens, or rather, where it fails to happen. You might also spend the final ten minutes discussing whether the Experiencers' reports changed during the questioning. If an Experiencer added details under pressure, point out that they are now composing too. This blurs the line between the two groups entirely, suggesting that all waking reports are compositions to some degree.

  Regarding the materials, keep them minimal so they do not become distractions. You need only the cue cards, which should be simple index cards with single phrases like sound of key or red book turned, and a timer. The room setup requires the corridor to be out of earshot but close enough for a quick transition. If you have a teaching assistant, brief them beforehand to ensure the Composers do not peek or communicate with the Experiencers. If you do not have an assistant, choose a student leader you trust to administer the corridor group. The timing should be strict. Ten minutes for the split and instruction, ten minutes for the experience and composition, five minutes for the transition and collection, thirty minutes for the reading and interrogation, and thirty-five minutes for the debrief and philosophical mapping. If the interrogation runs long, cut it off sharply to ensure you have time for the Malcolm and Dennett synthesis. It is better to leave them with unresolved questions about the reports than to rush the philosophical payoff.

  Finally, consider the possibility of spilling into the next session as you mentioned. If the class is particularly engaged, you can leave the identity of the reports sealed until the next meeting. This creates a genuine overnight delay, mimicking the sleep cycle. The Composers would then have to answer questions based solely on their written text without looking at it again, relying on their memory of their own fabrication. This deepens the Dennettian analogy significantly, as they are now recalling a memory of a fiction, which is structurally identical to recalling a memory of a dream. However, this carries the risk of logistical failure if students talk between sessions. If you choose this route, emphasize the honor code regarding not discussing the activity. If you keep it within the single session, the intensity is higher but the temporal gap is compressed. Either way, the core lesson remains that the authority of the first-person report is not grounded in a private theater of experience but in the public grammar of the report itself. By making them live through the uncertainty of the judge and the sincerity of the composer, you give them the bone-level feeling that the text alone cannot provide. I hope this design serves your seminar well, and I would be keen to hear how the tension between the genuine and the composed plays out in the room.
