  ### The Case: The Ledger and the Lock

  **Agent:** Elena, a senior department administrator at a mid-sized university.
  **Setting:** The Department Office, Tuesday morning.
  **Vocabulary:** "Scheduled," "Location," "Room 204." (All terms are common, possessed, and unambiguous in her idiolect).

  **The Attitudes:**
  1.  **Asserts $P$:** "The Colloquium is **scheduled** for Room 204."
      *   *Evidence:* The Official Department Ledger (a bound, printed log she maintains). It clearly reads "Colloquium: Room 204." She treats the Ledger as the definitive record of departmental commitments.
  2.  **Asserts $P \to Q$:** "If the Colloquium is **scheduled** for Room 204, then the Colloquium **location** is Room 204."
      *   *Evidence:* The Department Booking Policy (which she authored). It states: "The scheduled room constitutes the official location." She accepts this as a conceptual/administrative truth.
  3.  **Denies $Q$:** "The Colloquium **location** is NOT Room 204."
      *   *Evidence:* A Facilities Email received 10 minutes ago: "Room 204 condemned due to gas leak. Do not enter." She knows the event will physically happen in Room 205.

  **The Inference:**
  *   From $P$ and $P \to Q$, $Q$ follows by a single step of *Modus Ponens*.
  *   Elena can perform this inference instantly on a worksheet. She acknowledges the validity of the form.

  **The Confrontation:**
  You lay the Ledger, the Policy, and the Email on her desk. You point out that $P$ and $P \to Q$ entail $Q$, yet she asserts $\neg Q$.
  *   **Her Reaction:** She does not blush, retract, or claim confusion. She looks puzzled that you think there is a contradiction.
  *   **Her Insistence:** "The Ledger is the Official Record ($P$). The Policy defines the Record's authority ($P \to Q$). The Facilities Email is the Operational Reality ($\neg Q$). The Record hasn't been updated to match Reality yet. So, officially, the location is 204. Practically, it's not. Both statements are correct relative to their systems. I'm not denying the logic; I'm telling you the Update hasn't processed."

  She maintains all three attitudes sincerely. She is not lying, nor is she motivated to keep the Colloquium in 204 (she prefers 205 for safety). She simply treats the Ledger and the Facilities Email as **non-integrating authorities**.

  ***

  ### Analysis of the Frameworks

  #### 1. Awareness-Style Models
  **Commitment:** These models (e.g., Fagin & Halpern) solve logical omniscience by positing that agents are not "aware" of all propositions or connections. To avoid $K(P) \land K(P \to Q) \to K(Q)$, the model must claim Elena is unaware of $Q$, or unaware that $P$ and $P \to Q$ jointly imply $Q$.
  **Verdict:** **Failure.**
  Elena is fully aware of the vocabulary ("Scheduled," "Location"). She explicitly acknowledges the inference rule (*Modus Ponens*) when you show it to her. She doesn't lack the concept $Q$; she rejects it *in favor of* $\neg Q$ based on competing evidence. An awareness model would have to stipulate she is "unaware" of the *conflict*, but she is aware of it—she just rationalizes it via fragmentation. To make this work, you'd need an *ad hoc* patch: "Awareness is context-sensitive." But that collapses the model into a fragmentation model, abandoning the core awareness mechanism.

  #### 2. Impossible-Worlds Models
  **Commitment:** These models (e.g., Hintikka with non-normal worlds) allow agents to believe $P$, $P \to Q$, and $\neg Q$ by accessing "impossible worlds" where logical laws fail.
  **Verdict:** **Partial Success, Wrong Diagnosis.**
  An impossible-worlds model *can* represent her belief state: she accesses a world where $P \land (P \to Q) \land \neg Q$ holds. However, standard impossible-worlds accounts treat this as a **cognitive limitation** (she *can't* see the contradiction).
  Elena's case is not a limitation; it's an **architectural choice**. She *can* see the contradiction but blocks the integration because she treats the Ledger and the Email as belonging to different "files" (Administrative vs. Operational). A standard impossible-worlds model implies she is logically deficient. She insists she is not; she is administratively precise. To capture her rationality, you need a patch: "Impossible worlds are partitioned by *source authority*." This is no longer just an impossible-worlds solution; it's a **Doxastic Fragmentation** solution (à la David Lewis) using impossible worlds as the semantic tool. Without that patch, the model misdiagnoses her rational insistence as logical ignorance.

  ***

  ### The Feature Doing the Work

  **Feature:** **Justificatory Silos (Fragmentation).**
  The work is done by the fact that Elena's evidence for $P$ (Ledger) and her evidence for $\neg Q$ (Email) come from **authorities she treats as incommensurable in the short term**. She operates with two distinct "belief boxes":
  1.  **The Normative Box:** Contains Ledger + Policy. Closed under MP. ($P, P \to Q \vdash Q_{\text{official}}$).
  2.  **The Empirical Box:** Contains Email + Observation. ($\neg Q_{\text{actual}}$).

  She refuses to merge the boxes until the "Update" (changing the Ledger) occurs. The failure of logical omniscience here is not a failure of *deduction*, but a failure of *aggregation*.

  **If You Delete This Feature:**
  If you remove the siloing (i.e., she treats all evidence as feeding into a single "Truth" pool), the case collapses. She would immediately have to reject either the Ledger ($P$) or the Policy ($P \to Q$) to accommodate the Email ($\neg Q$). The puzzle vanishes, and she becomes a standard inconsistent agent who must resolve the contradiction. The *persistence* of the inconsistency relies entirely on the compartmentalization.

  ***

  ### Addressing Your Suspicion

  **Your Suspicion:** *The interesting failures of logical omniscience aren't about deduction limits at all.*

  **Verdict:** **This case bears that out completely.**

  1.  **Deduction is Intact:** Elena can perform the inference. She acknowledges the validity. She has the vocabulary. There is no computational cost.
  2.  **The Real Problem:** The failure is **Doxastic Architecture**. Standard epistemic logic assumes a single, unified belief set closed under consequence. Real agents (like Elena) operate with **fragmented belief states** governed by **contextual relevance** or **source authority**.
  3.  **What They Are Actually About:** Interesting failures of logical omniscience are about **the cost of integration**, not the cost of inference.
      *   It is cognitively "cheap" for Elena to infer $Q$ from $P$ and $P \to Q$.
      *   It is cognitively "expensive" (or institutionally risky) for her to integrate the Facilities Email into the Department Ledger.
      *   Standard models (Awareness, Impossible Worlds) try to fix the *inference* engine. This case shows the bug is in the *database structure*.

  **Conclusion for Your Paper:**
  Use this case to argue that logical omniscience isn't solved by weakening the logic (Impossible Worlds) or limiting the vocabulary (Awareness). It is solved by recognizing that belief is **fragmented by function**. We are not logically omniscient because we are not *believers* in the singular sense; we are collections of sub-agents (The Administrator, The Observer, The Planner) that only communicate when necessary. The "omniscience" fails not because we can't add 2 + 2, but because the "2" from the Ledger and the "2" from the Lock live in different rooms.
