      *   *The "Dimmer" point:* If the friend argues that *physical* states must be continuous functions of time, then the toggle lamp is physically impossible. But that's a physical premise, not a logical one derived from time's structure. I need to highlight this distinction.
      *   *Benacerraf's Point:* The state at $t=1$ is logically independent of the states before $t=1$.
