          *   Zeno's paradoxes vs. Thomson's lamp.
      *   **Conclusion:** The friend's inference fails at the move from "undefined" to "contradictory."

  6.  **Refining the Tone:**
      *   Respectful to the friend (it's a common and intelligent misunderstanding).
      *   Authoritative on the philosophical consensus (Benacerraf, Earman, Norton).
