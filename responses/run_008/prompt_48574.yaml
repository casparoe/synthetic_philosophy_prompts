prompt: |-
  I serve on incident review boards for autonomous-vehicle deployments, and our reports keep having to say things like "the failure of the automatic emergency braking system to trigger caused the collision" or, more awkwardly, "the system's decision not to brake was correct, so the collision was caused by the pedestrian's behavior" — and I've come to realize we have no considered view about what makes an absence a cause. Before I look at any particular theory, I want the specification. Set out the desiderata a theory of causation by omission must meet to be adequate for this application: the cases it has to get right (including ones where two redundant safety systems both fail to act, so neither failure is individually necessary for the harm, and ones where a system correctly refrains from intervening and must not come out as a cause); the distinctions it cannot collapse (between an omission and the mere non-occurrence of an event that was never in the offing, between what a system failed to do and what it was in no position to do, between an absence that made a difference and background conditions that were simply in place throughout); and the constraints imposed on it by practice (in law, omissions ground liability only where there was a duty to act, whereas our systems bear no duties — so say whether that asymmetry belongs in the theory of causation or should be kept out of it and handled elsewhere). For each requirement, give the case or consideration behind it, mark which are non-negotiable and which look instead like prejudices of one camp (for instance, the demand that absences be events, or that omission-causation be derivative from causation by whatever event did occur instead), and flag any pair of requirements you suspect cannot be jointly satisfied — that is the part I most want to see. Then, briefly, hold a simple counterfactual-dependence account, a norm-restricted account that ties omissions to breached expectations, and a quasi-event account that identifies each omission with the actual event that happened in its place up against the list. Keep the weight on the criteria; the scorecard should be short.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Member of incident review boards for autonomous vehicle (AV) deployments.
      *   **Problem:** Current reports struggle with phrasing causation regarding *omissions* (failures to act). Examples: AEB failure vs. correct non-intervention.
      *   **Task:** Specify the *desiderata* (requirements) for a theory of causation by omission adequate for this application *before* evaluating specific theories.
      *   **Key Components:**
          1.  Cases the theory must get right (redundant failures, correct non-intervention).
          2.  Distinctions it cannot collapse (omission vs. non-occurrence, failed to do vs. couldn't do, difference-making absence vs. background conditions).
          3.  Constraints imposed by practice (Legal duty vs. system "duty" – is this causal or separate?).
          4.  Classification: Non-negotiable vs. Prejudices.
          5.  Tensions: Flag pairs of requirements that might be incompatible.
          6.  Evaluation: Briefly test three theories (Counterfactual, Norm-restricted, Quasi-event) against the criteria.
          7.  Format: Weight on criteria, short scorecard.

  2.  **Deconstruct the Desiderata (The "Specification"):**

      *   *Case 1: Redundant Safety Systems.* Two systems (A and B) could have prevented the crash. Both failed. Neither failure is *necessary* (if A worked, crash avoided; if B worked, crash avoided; but since both failed, is A's failure a cause? Is B's?).
          *   *Requirement:* Must handle overdetermination/preemption in omissions.
      *   *Case 2: Correct Non-Intervention.* System saw a plastic bag, didn't brake. Crash happened later with a pedestrian. Or simply: System didn't brake because it wasn't needed, but a crash happened due to human error. The prompt says: "system's decision not to brake was correct, so the collision was caused by the pedestrian's behavior."
          *   *Requirement:* Must distinguish *normatively appropriate* omissions from *causally relevant* omissions. A correct decision shouldn't be labeled a "cause of harm" just because doing otherwise *might* have changed outcomes (e.g., braking unnecessarily causing a rear-end).
      *   *Distinction 1: Omission vs. Non-occurrence.* I didn't save the drowning child (omission) vs. I didn't fly to Mars and save the child (non-occurrence/not in the offing).
          *   *Requirement:* Must limit the causal field to expected/possible actions.
      *   *Distinction 2: Failed to Do vs. Couldn't Do.* System tried to brake but lines were cut (couldn't) vs. System logic didn't call for brake (failed to).
          *   *Requirement:* Must account for capacity/ability.
      *   *Distinction 3: Difference-making Absence vs. Background.* Oxygen wasn't present (if in a vacuum) vs. Oxygen wasn't present (normal air, but fire happened). Wait, better AV example: GPS signal loss (background) vs. Emergency Brake signal loss (critical absence).
          *   *Requirement:* Must distinguish salient absences from constant background absences.
      *   *Constraint: Law vs. Engineering.* Law requires duty for omission liability. AVs don't have "duties" in the moral/legal sense, but they have "specifications."
          *   *Requirement:* Decide if "duty/norm" is part of *causation* or *responsibility*.
          *   *Decision:* For incident review (technical root cause), "duty" should likely be separated from metaphysical causation to avoid conflating "what broke" with "who is liable." However, without a norm, *every* non-action is a cause (I didn't fly in and stop it). So some normativity is needed for *selection*, even if not for *existence*.

  3.  **Identify Tensions/Incompatibilities:**
      *   *Objectivity vs. Normativity:* To limit the infinite regress of omissions (I didn't save them, Elon Musk didn't save them), we need norms/expectations. But incident review wants objective technical facts, not shifting social norms.
      *   *Overdetermination vs. Necessity:* Standard counterfactual theory says cause = necessary condition. In redundant failure, neither is necessary. We need a theory that handles overdetermination without collapsing into "everything is a cause."
      *   *Absence as Event:* If omissions are causes, are they "events"? If yes, ontology gets weird. If no, how do they fit causal chains?

  4.  **Drafting the Desiderata (Iterative refinement):**

      *   *D1: The Redundancy Test.* (Non-negotiable). Two backup systems fail. Both must be citable as causes of the failure state, even if neither is strictly necessary (INUS conditions or similar).
      *   *D2: The Correct-Action Test.* (Non-negotiable). If the system correctly *did not* act (per design), that non-action must not be flagged as a cause of subsequent harm, even if acting *might* have averted it by luck.
      *   *D3: The Possibility Constraint.* (Non-negotiable). Cannot cite as cause an action the system was physically or computationally incapable of performing.
      *   *D4: The Salience Filter.* (Negotiable/Tricky). Distinguish between critical missing signals and background noise.
      *   *D5: The Norm/Causation Split.* (Crucial Decision). Should "duty" be in the causation theory?
          *   *Argument:* If we put duty in causation, we conflate root cause with liability.
          *   *Argument:* If we leave duty out, we face the "infinite omissions" problem (why wasn't the remote driver a cause?).
          *   *Resolution for Spec:* The theory must allow a *selection mechanism* based on expectations without making the *metaphysics* of causation dependent on legal duty.

  5.  **Identifying the "Impossible Pair":**
      *   *Requirement A:* Causation must be purely objective/physical (no norms).
      *   *Requirement B:* The theory must rule out "non-occurrences never in the offing" (e.g., I didn't teleport to stop the crash).
      *   *Conflict:* Purely physical theories struggle to distinguish between "no brake signal" and "no teleportation signal" without referencing a model of expected behavior (a norm).
      *   *Flag:* Objectivity vs. Selectivity.

  6.  **Evaluating the Three Theories:**
      *   *Counterfactual (But-for):* Fails Redundancy (neither failure is necessary). Fails Correct-Action (if braking *would* have stopped it, not braking is a cause, even if braking was wrong).
      *   *Norm-Restricted (Hart & Honoré style):* Good at Correct-Action and Possibility. Struggles with Objectivity (norms vary). Good at Redundancy if norms define both as required.
      *   *Quasi-Event (Event-based):* Treats omission as the event that happened (e.g., "maintaining speed"). Good for ontology. Might struggle to distinguish "maintaining speed correctly" vs "maintaining speed erroneously."

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the AV context.
      *   Section 1: The Specification (Desiderata). Group by Cases, Distinctions, Constraints. Label Non-negotiable vs. Prejudice.
      *   Section 2: The Tensions (The "Impossible Pairs").
      *   Section 3: The Scorecard (Brief evaluation of the 3 theories).
      *   Tone: Professional, precise, philosophical but engineering-adjacent.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "duty" asymmetry? Yes, need to explicitly state whether the theory should absorb legal duty or leave it to a separate liability layer. *Decision:* Recommend keeping it separate for technical review, but acknowledging norms are needed for causal selection.
      *   *Check:* Did I handle the redundant systems? Yes, the "Overdetermination" requirement.
      *   *Check:* Is the distinction between "failed to" and "couldn't" clear? Yes, Capacity Constraint.
      *   *Check:* Is the scorecard short? Keep it tight.

  9.  **Final Polish:** Ensure the distinction between "metaphysical causation" and "causal explanation/attribution" is clear, as this is often where the AV industry gets stuck. The prompt asks for a theory of *causation*, but the application is *review boards*. This implies a need for *causal explanation* rather than pure metaphysics. I will frame the desiderata around *Causal Attribution for Engineering Review*.

      *(Self-Correction on "Duty"):* The prompt asks: "say whether that asymmetry belongs in the theory of causation or should be kept out of it and handled elsewhere." I need to take a stance in the specification. *Stance:* It should be kept out of the *metaphysical* definition but included in the *selection* criteria for reporting. A theory of causation shouldn't depend on law, but a theory of *causal responsibility* (which review boards need) must. I will specify this distinction.

      *(Refining the "Impossible Pair"):* The tension between "All omissions are causally equal physically" and "We need to pick specific omissions." This is the "Abundance vs. Scarcity" problem.

      *(Refining the Scorecard):* Make sure to explicitly mention how they handle the Redundancy and Correct-Action cases.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Specification for a Theory of Causation by Omission (AV Incident Review)

  This specification defines the requirements for a causal framework suitable for autonomous vehicle (AV) incident review. The goal is not metaphysical completeness, but **engineering actionability**: the theory must support root-cause analysis that leads to design changes without generating false positives (blaming correct behavior) or false negatives (ignoring redundant failures).

  #### I. Required Case Outcomes
  *These are non-negotiable. A theory that fails these cannot be used for safety certification.*

  1.  **The Redundancy Requirement (Overdetermination)**
      *   **Case:** System A (Lidar-based AEB) and System B (Vision-based AEB) are independent backups. Both fail to trigger. Either one working would have prevented the collision.
      *   **Requirement:** The theory must identify *both* failures as causes. It cannot rely on strict "but-for" necessity, as neither failure is individually necessary for the outcome.
      *   **Status:** **Non-negotiable.** (Standard counterfactual necessity fails here).

  2.  **The Correct-Non-Intervention Requirement**
      *   **Case:** The AV correctly identifies a plastic bag as non-hazardous and does not brake. A pedestrian subsequently steps out behind the bag, and the AV hits them (assuming braking for the bag would have been safe but unnecessary). Or simpler: The AV does not brake because no obstacle exists, but a collision occurs due to a separate mechanical failure.
      *   **Requirement:** The theory must *not* identify the decision *not* to brake as a cause of the collision if that decision adhered to the safety specification. "Doing otherwise" must be evaluated against *permissible* actions, not merely *physically possible* ones.
      *   **Status:** **Non-negotiable.** (Prevents penalizing correct algorithmic behavior).

  #### II. Required Distinctions
  *The theory must structurally differentiate these concepts. Collapsing them renders reports useless.*

  3.  **The Capacity Constraint (Failed vs. Unable)**
      *   **Distinction:** Between "The system failed to send the brake signal" (logic error) and "The system was unable to send the brake signal" (hydraulic failure or compute overload).
      *   **Requirement:** The theory must distinguish omission from impossibility. An omission presupposes the capacity to act.
      *   **Status:** **Non-negotiable.** (Critical for distinguishing software bugs from hardware faults).

  4.  **The Salience Filter (Absence vs. Background)**
      *   **Distinction:** Between "The brake signal was absent" (critical) and "The windshield wiper signal was absent" (irrelevant background condition during a dry-day crash).
      *   **Requirement:** The theory must provide a mechanism to filter the infinite set of non-occurring events down to those causally relevant to the specific failure mode.
      *   **Status:** **Non-negotiable.** (Prevents "causal inflation").

  5.  **The Offing Constraint (Omission vs. Non-occurrence)**
      *   **Distinction:** Between "The AV did not brake" (an expected action within the operational design domain) and "The AV did not teleport to safety" (an action never in the offing).
      *   **Requirement:** The theory must restrict causal candidates to actions within the system's defined operational envelope.
      *   **Status:** **Non-negotiable.** (Prevents absurd causal claims).

  #### III. Constraints Imposed by Practice
  *How the theory interfaces with liability and engineering.*

  6.  **The Duty/Causation Separation**
      *   **Consideration:** In law, omission liability requires a duty of care. In engineering, systems have specifications, not duties.
      *   **Requirement:** The theory of *causation* must remain distinct from the assignment of *liability*. Normative expectations (specifications) should be used to select causes (filtering), but the causal relation itself should not depend on legal duty.
      *   **Status:** **Negotiable/Strategic.** (Some theories bind norm and cause tightly; for AV review, keeping them separate is preferred to allow technical findings without immediate legal concession).
      *   **Decision:** **Keep Separate.** Causation is technical; Liability is normative. The theory should use "expectations" for selection, not "duties" for metaphysics.

  #### IV. Tensions and Impossible Pairs
  *The following pairs of requirements create significant theoretical friction. You must prioritize one over the other.*

  1.  **Objectivity vs. Selectivity (The "Abundance" Problem)**
      *   **Tension:** To satisfy **Salience (4)** and **Offing (5)**, you must introduce norms or expectations (what *should* have happened). To satisfy a purely physicalist view of causation (often desired for engineering objectivity), you must treat all physical absences equally.
      *   **Conflict:** You cannot have a purely physicalist ontology *and* a selective causal filter.
      *   **Resolution:** For AV review, **Selectivity wins.** We accept that causal *attribution* is interest-relative, even if causal *relations* are physical.

  2.  **Redundancy (1) vs. Necessity**
      *   **Tension:** Standard causal intuition equates cause with "making a difference" (necessity). **Redundancy (1)** requires calling something a cause even if it made no difference (because the other backup also failed).
      *   **Conflict:** You cannot maintain strict counterfactual necessity and handle redundant safety system failures.
      *   **Resolution:** **Redundancy wins.** The theory must adopt an INUS (Insufficient but Necessary part of an Unnecessary but Sufficient condition) or Structural Equation Model approach.

  3.  **Event Ontology vs. Absence Ontology**
      *   **Tension:** Many causal models require causes to be events (positive occurrences). Omissions are absences.
      *   **Conflict:** If you demand causes be events (**Prejudice**), you must treat omissions as "quasi-events" (e.g., "the maintaining of speed"). If you allow absences as causes, you risk ontological bloat.
      *   **Resolution:** **Pragmatism.** Treat omissions as valid causal relata for the purpose of the report, regardless of metaphysical status.

  ---

  ### Scorecard: Preliminary Theory Evaluation

  Here is how three common approaches score against the specification.

  | Criterion | **1. Simple Counterfactual**<br>(But-For Test) | **2. Norm-Restricted**<br>(Breach of Expectation) | **3. Quasi-Event**<br>(Omission = Actual Event) |
  | :--- | :--- | :--- | :--- |
  | **Redundancy (1)** | **FAIL.** Neither failure is necessary; neither is a cause. | **PASS.** If both were expected to act, both breaches are causes. | **PASS.** If both "maintaining speed" events are sufficient for crash. |
  | **Correct Non-Intervention (2)** | **FAIL.** If braking *would* have stopped it, not braking is a cause, even if braking was unsafe/incorrect. | **PASS.** If braking was not expected/permitted, no breach, no cause. | **RISKY.** Depends on how the "event" is described. "Maintaining speed" is always an event, needs normative filter. |
  | **Capacity (3)** | **FAIL.** Counterfactuals often ignore ability ("If he had flown..."). | **PASS.** Norms imply "ought implies can." | **PASS.** Physical event occurred; capacity is external check. |
  | **Salience/Offing (4 & 5)** | **FAIL.** Infinite omissions qualify (no teleportation). | **PASS.** Norms limit the field to expected actions. | **FAIL.** Requires external filtering to avoid absurdity. |
  | **Duty/Causation Split (6)** | **PASS.** Purely factual. | **RISK.** Blurs cause and blame (breach). | **PASS.** Ontological claim is neutral. |
  | **Ontological Cost** | Low. | Medium (requires norm database). | High (redefines events). |

  **Summary Recommendation:**
  *   **Simple Counterfactual** is inadequate for AV safety cases (fails Redundancy and Salience).
  *   **Quasi-Event** is ontologically robust but requires a normative overlay to function (effectively becoming Norm-Restricted).
  *   **Norm-Restricted** is the strongest candidate for incident review, provided you strictly separate the *normative selection* of causes from the *legal assignment* of liability. It handles Redundancy and Correct-Non-Intervention best, which are your primary pain points.

  **Critical Warning:** The **Norm-Restricted** approach risks conflating "what broke" with "what was wrong." Ensure your review board defines "expectations" via engineering specifications (objective) rather than social reasonableness (subjective) to maintain the **Duty/Causation Split**.
