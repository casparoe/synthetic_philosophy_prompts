answer: |-
  Based on Maya's track record, she is not operating on a single simple heuristic like "separate art from artist." She is operating on a sophisticated hierarchy of judgment that distinguishes between **Aesthetic Function** and **Ethical Engagement.**

  Here is the breakdown of her philosophy, the prediction for your book club, and the test case to prove it.

  ### 1. The Diagnosis: Maya's "Functional Integrity" Rule
  Maya's verdicts are best explained by a hybrid of **Rule 3 (Instrumentalism)** and **Rule 2 (Ethical Engagement)**, with Rule 1 and Rule 4 acting as foils she explicitly rejects.

  *   **The Aesthetic Test (Is it Good Art?):** She asks: *Is the immorality functional to the work's success?*
      *   **Yes (Bad Art):** *Triumph of the Will* (the craft *is* propaganda), The Roast Special (the laughter *is* humiliation). In these cases, you cannot separate the "good craft" from the "bad aim." The immorality is the engine.
      *   **No (Good Art):** Wagner (the music works without the antisemitism), Caravaggio (the light works without the murder), The Sitcom (the jokes work without the abuse on set). Here, the immorality is extrinsic noise.
  *   **The Engagement Test (Do I Support It?):** She asks: *Is the artist alive and profiting from my engagement?*
      *   **Yes (Boycott):** The Sitcom (she won't stream it), The Living Novelist (prediction: she won't finish it).
      *   **No (Consume):** Wagner/Caravaggio (dead, estate/profit is abstracted).

  **Why the other rules fail:**
  *   **Rule 1 (Internalism):** Fails *Triumph of the Will*. A pure internalist would call it a masterpiece because the cinematography is stunning. Maya calls it "not good."
  *   **Rule 2 (Profit Only):** Fails to explain her *aesthetic* judgments. It explains why she won't watch the sitcom, but not why she calls the Roast Special "bad comedy" rather than just "unethical comedy."
  *   **Rule 4 (Contextual Meaning):** Fails Wagner and the Landscape Painter. If biography changed the work's meaning for her, Wagner's music would sound hateful and the landscape would look adulterous. She insists they do not.

  ### 2. Prediction: The Living Novelist
  **Verdict:** She will say the trilogy is **Good Art**, but she will **stop reading immediately.**

  *   **Aesthetic Judgment:** Because the books are "morally fine—kind, even," the alleged immorality is extrinsic to the text (like the Sitcom star's behavior, not like the Roast Special's material). The craft is not in service of the abuse. Therefore, the art remains aesthetically valid.
  *   **Action:** Because the author is living and the publisher just dropped him (implying a financial/contractual rupture), continuing to read is an act of engagement that could theoretically signal support or generate royalties (depending on your contract). Consistent with the Sitcom verdict, she will decouple the *value* of the object from the *ethics* of the transaction. She will tell you: *"It's a good book. It's also a crime scene. Don't touch it."*

  ### 3. The Hard Case: The Dead Stalker Poet
  This case is the stress test for **Rule 3 (Instrumentalism)** vs. **Rule 4 (Contextual Meaning).**

  *   **The Scenario:** The words haven't changed, but the "tenderness reads as creepy."
  *   **Maya's Prediction:** She will likely call the poems **Good Art** but **Unreadable.**
  *   **Reasoning:** Unlike *Triumph of the Will*, where the *aim* of the film was propaganda, the *aim* of a love poem is to express affection. The fact that the affection was fake (stalking) is a biographical fact about the *author*, not necessarily a functional flaw in the *poem*, provided the poem doesn't contain threats.
  *   **The Nuance:** However, because the "creepiness" is now a feature of the *reading experience* (Rule 4), she might concede the work is **Compromised.** But knowing her stance on Wagner (where we *know* he was antisemitic but the *Ring* doesn't sound antisemitic), she will argue that if the poem *reads* as tender, it *is* tender art, even if the man was a monster.
  *   **Verdict:** "The poems are beautiful. The man was a predator. The poems are not the predation. But I won't read them because it feels like voyeurism." (Good Art / Boycott).

  ### 4. The Killer Test Case
  To cleanly split her candidate rules, you need a case where the **Internal Quality** is high, the **Artist is Dead** (removing profit motives), but the **Immoral Aim** is hidden within the craft itself.

  **The Case: "The Sabotaged Symphony"**
  > A celebrated, long-dead composer's symphony is discovered to have been mathematically structured using a code that spells out a hate message in the frequency spectrum. The message is inaudible to the human ear; the music sounds purely beautiful. The composer intended this as a "victory for his ideology" that only he would know.

  **How the Rules Split:**
  1.  **Rule 1 (Internalism/Flaws in Work):** **Good Art.** The audience hears beauty. The hate code is not in the experience. (Matches Maya's Wagner verdict).
  2.  **Rule 2 (Profit):** **Irrelevant.** The composer is dead.
  3.  **Rule 3 (Instrumentalism/Craft in Service of Immoral Aim):** **Bad Art.** The *craft* (the mathematical structure) was literally in service of an immoral aim (hate speech), even if hidden. The work is a vessel for poison, even if the poison is sealed. (Matches Maya's *Triumph* verdict).
  4.  **Rule 4 (Contextual Meaning):** **Meaning Changed.** It is no longer a symphony; it is a secret flag.

  **Maya's Likely Answer:**
  She will call it **Bad Art.**
  Why? Because this aligns with her *Triumph of the Will* and *Roast Special* logic. In those cases, the *function* of the work was immoral. Here, the *function* of the composition was to encode hate. Even if the audience doesn't hear it, the **integrity of the craft** is corrupted because the artist used their skill to hide immorality within the structure.

  If she calls it **Good Art**, she is prioritizing **Rule 1 (Internalism)** over Rule 3.
  If she calls it **Bad Art**, she is prioritizing **Rule 3 (Instrumentalism)**.

  Given her stance on *Triumph* (where the *effect* was propaganda), she might actually waver here because the *effect* on the audience is beauty. **This is the true split.**
  *   **Refined Prediction:** She will say **Good Art.**
  *   **Why:** In *Triumph*, the audience *received* the propaganda. In the Roast, the audience *participated* in the humiliation. In the Symphony, the audience receives *only* beauty. The immorality is truly extrinsic to the *experience*. This confirms her rule is **"Does the audience participate in or receive the harm?"** rather than "Was the artist a bad person?"

  **Final Advice for the Book Club:**
  Tell Maya about the "Sabotaged Symphony." If she says "Burn it," she believes art is defined by **Intent.** If she says "Listen, it's beautiful," she believes art is defined by **Reception.** That is the only variable you haven't pinned down yet.
