  # Presentation Title: The Local Trap: Why AJR Doesn't Prove What We Think It Proves

  ## Slide 1: The Consensus and The Claim
  **Visual:** A simple diagram: *Settler Mortality $\rightarrow$ Early Institutions $\rightarrow$ Current Income.*
  **Key Text:** "The Colonial Origins of Comparative Development" (Acemoglu, Johnson, Robinson 2001).

  **Speaker Notes:**
  "Good morning. The standard reading of Acemoglu, Johnson, and Robinson (AJR) is that they have settled the debate: Institutions cause wealth, geography does not. By using settler mortality as an instrument for early institutions, they claim to isolate exogenous variation and recover a causal coefficient.

  My argument today is not that institutions *don't* matter. Nor will I rehash the usual complaints about the patchiness of the mortality data. Instead, I want to make a philosophical point about **identification**. Even if we grant AJR a perfectly clean instrument, their methodology cannot establish the universal claim everyone wants it to. It identifies a *Local* Average Treatment Effect (LATE), not an *Average* Treatment Effect (ATE). And this limitation suggests a broader crisis for the 'History as Laboratory' approach in development economics."

  ## Slide 2: The Logic of the Instrument (and the Compliers)
  **Visual:** A Venn diagram showing "Always Takers," "Never Takers," and "Compliers."
  **Key Text:** IV identifies the effect *only* for the "Compliers."

  **Speaker Notes:**
  "To understand the limit, we must understand what an IV actually measures. In the AJR framework, the instrument (mortality) works by changing the 'treatment' (settlement type/institutions).
  But not all colonies respond to mortality the same way.
  1.  **Never Takers:** Places so deadly no Europeans settled, regardless of slight mortality variations.
  2.  **Always Takers:** Places so benign Europeans settled, regardless of slight mortality variations.
  3.  **Compliers:** The marginal cases. Colonies where a specific change in mortality *flipped* the institutional outcome from extractive to inclusive (or vice versa).

  Mathematically, the IV estimator *only* recovers the causal effect for this third group: the Compliers. It tells us how much institutions mattered for wealth *in those specific marginal colonies*."

  ## Slide 3: The Extrapolation Gap
  **Visual:** A map highlighting "Marginal Colonies" vs. "Modern Nations of Interest" (e.g., Japan, Botswana, Germany).
  **Key Text:** Who are the Compliers? Do they resemble *us*?

  **Speaker Notes:**
  "Here is the epistemological break. Who are these compliers? They are specific historical artifacts—colonies on the threshold of European habitability in the 17th and 18th centuries.
  There is no theoretical reason to believe this sub-population resembles the set of nations we care about today.
  *   Does the institutional elasticity of a marginal Caribbean island in 1750 tell us about the institutional needs of modern Japan, which was never colonized?
  *   Does it tell us about Botswana, where mortality was low but history differed?

  AJR gives us a 'local' truth. To turn that into a policy prescription for modern development, we must assume **structural stability**: that the causal mechanism operates identically across vastly different historical and cultural contexts. AJR provides no evidence for this stability. They prove institutions mattered *there*, not that they matter *here*, or *how much*."

  ## Slide 4: The General Problem (History as Laboratory)
  **Visual:** Icons representing other famous historical IVs (The Plough, Legal Origins, Slave Trades).
  **Key Text:** If AJR falls, do they all fall?

  **Speaker Notes:**
  "This critique extends beyond AJR. It strikes at the heart of the 'Credibility Revolution' in macro-development.
  Consider the Bantu expansion, the legacy of the plough, or legal origins. All rely on historical natural experiments. All rely on IV or difference-in-differences strategies that identify effects based on historical variation.
  If the AJR estimate is 'local' to the compliers of the colonial era, then the 'plough' effect is local to societies on the margin of adopting the plough.
  If this critique holds, then **history cannot provide universal coefficients.** It can only provide existence proofs. We can say 'institutions *can* cause growth,' but we cannot say 'institutions cause $X$ amount of growth for country $Y$.' The dream of using history to generate a universal production function for development is mathematically unsupported by the tools being used."

  ## Slide 5: The Steelman (The "Proving Too Much" Objection)
  **Visual:** A scale balancing "Skepticism" and "Action."
  **Key Text:** "All causal claims require extrapolation."

  **Speaker Notes:**
  "Now, the obvious reply. A defender of AJR would say: 'You are proving too much.'
  *   **The Argument:** Every causal claim in science requires extrapolation. If a drug works in a clinical trial (the compliers of the medical world), we prescribe it to the general population. If we reject AJR because we can't guarantee external validity, we must reject RCTs, medicine, and physics. We would be left with causal nihilism.
  *   **The Mechanism Defense:** The claim isn't that the *coefficient* is identical, but that the *mechanism* is stable. Property rights encourage investment. That is a universal human incentive, not a colonial artifact. Therefore, extrapolation is justified by theory, not just statistics."

  ## Slide 6: Rejoinder & Conclusion
  **Visual:** A question mark over a map.
  **Key Text:** Distinguish *Causal Existence* from *Policy Magnitude*.

  **Speaker Notes:**
  "My rejoinder is to distinguish between **ontological claims** and **policy claims**.
  The Steelman is right that we must assume *some* stability to act. But there is a difference between saying 'Property rights are good' (which we likely already believed) and saying 'We know the return on investment for institutional reform is X% based on AJR.'
  The AJR study is often wielded as the latter—a quantitative blueprint.
  **Conclusion:** The AJR study is a masterpiece of identification, but it is not a universal law. It tells us about the specific history of the Atlantic colonial margin. If we treat historical natural experiments as universal physics, we ignore the 'Local' in LATE. We should treat history as a source of qualitative mechanisms, not quantitative blueprints. Thank you."

  ---

  ### Discussion Prep (Anticipating Questions)

  **Q: Isn't this just semantics? If the effect is positive for compliers, isn't it likely positive for others?**
  *   **A:** Not necessarily. This is the problem of **treatment effect heterogeneity**. If institutions only boost growth when combined with specific human capital levels present in the "complier" colonies but absent elsewhere, the effect could be zero or negative for non-compliers. Without a structural model, we don't know the sign of the effect outside the local population.

  **Q: So what should economists do? Stop using IVs?**
  *   **A:** No. But they should be humble about **external validity**. They should pair reduced-form IV work with structural modeling that explicitly attempts to model *why* the effect exists, which allows for more justified extrapolation. Or, they should frame conclusions as "existence proofs" rather than "calibrations."

  **Q: Does this favor the Geography hypothesis?**
  *   **A:** No. This critique is agnostic on the true cause. It simply says AJR hasn't *proven* Institutions are the universal cause. Geography could still be wrong, but AJR doesn't definitively rule it in for all contexts either.
