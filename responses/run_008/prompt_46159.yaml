  **Note on the Philosophy**  
  Multiple realizability—the claim that mental kinds can be instantiated in diverse physical substrates—is widely accepted as a phenomenon at the macroscopic level (e.g., pain in humans versus octopuses). However, specialists remain divided on its scope and ontological implications. It is contested whether realizability extends to fine-grained neurobiological kinds, and whether functionally defined kinds are genuine natural kinds or merely heterogeneous disjunctions. This poem illustrates the functional recurrence without settling whether the underlying unity is real or merely descriptive.
