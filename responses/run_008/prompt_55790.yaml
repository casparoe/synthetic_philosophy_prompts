      *   *Q3: Schooling remark?* It undermines the point. If environments became more equal (standardized schooling), environmental variance ($V_E$) should decrease, making genetic variance ($V_G$) a larger proportion of total variance ($V_P$). So $h^2$ should go *up*. If it stayed the same, it suggests $V_G$ also changed or the measure is noisy. It definitely doesn't prove stability across different environmental contexts.

  5.  **Connect to Philosophical Issues:**
