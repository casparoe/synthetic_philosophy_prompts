  **The practice, neutrally described**

  Central banks release quarterly fan charts for inflation and output growth. These display a central projection conditional on a policy rate path, surrounded by shaded probability bands. The darkest band covers a specific confidence interval, with lighter bands indicating wider intervals; bands widen over the forecast horizon. The central line represents the mode, not the mean, and asymmetry in the bands signals skewed risks. Literally, this encodes a full probability distribution. However, during turbulence, institutions suspend quantification, publishing unweighted scenarios instead. Furthermore, bank regulation employs stress tests using severely adverse scenarios without assigned probabilities, contrasting with standard capital adequacy rules that require probabilistic expected loss calculations. This creates a mixed methodology: quantified distributions in normal times, unquantified narratives in stress conditions. The stress tests judge capital adequacy against these hypothetical shocks. The scenarios offer coherent stories about economic pathways without likelihoods. This triad—fan charts, scenario planning, and stress testing—constitutes the official forecasting apparatus.

  **The implicit theory of probability**

  The practice presupposes that uncertainty is ontologically heterogeneous. By publishing fan charts, the institution acts as if a determinate probability distribution exists and is estimable. This is not merely communication; to communicate a skew is to claim knowledge of asymmetry. Your colleague's distinction fails because communicative acts regarding risk entail epistemic commitments: one cannot coherently signal "downside risk" without presupposing a metric where "downside" is distinguishable and weighable. Thus, the chart asserts a degree-of-belief view treated with objective authority. However, the switch to scenarios implies this measurability has limits. The implicit theory is therefore dualistic: normal conditions permit risk assessment (measurable probability), while structural breaks induce radical uncertainty (unmeasurable). The stress test adds a prudential layer, prioritizing survival over optimality when probabilities are unreliable. Consequently, the practice assumes probabilities are real enough for routine allocation but fragile enough to require non-probabilistic safeguards during crises. It treats subjective confidence as objective data, acknowledging this objectification collapses under extreme volatility. The fan chart looks frequentist but applies to unique events, implying a subjective Bayesian foundation disguised as objective frequency. The "mode" versus "mean" distinction implies knowledge of the distribution's shape, requiring a theory where the shape of belief is accessible. The suspension of judgment implies a threshold model of evidence. Below the threshold, probabilities are too vague to quantify. The colleague's claim that it is "just communication" ignores that successful communication of probability requires shared presuppositions about the existence of the thing communicated. If probability were purely rhetorical, the bands would not need to widen logically with horizon; their logical structure presupposes an underlying temporal decay of knowledge.

  **Strict presuppositions, good fits, and optional extras**

  Strict presuppositions are minimal: logical coherence (probabilities sum to one) and an ordering of outcomes (worse versus better). The institution must presuppose that the future is not entirely chaotic, allowing some projection. Good fits include the Keynesian dualism mentioned earlier: numerical probability for risk, non-numerical comparison for uncertainty. This fits the switch to scenarios perfectly. Also fitting is a pragmatic subjectivism: probabilities are tools for coordination, not metaphysical truths. Optional extras include strict frequentism, which cannot logically apply to unique future events, yet the charts mimic its language. Strict objectivism (probabilities exist in nature) is also optional; the practice works even if probabilities are purely epistemic, provided they are treated as stable. The colleague's view—that nothing is presupposed—is incompatible. An institution cannot presuppose a view it never asserts only if the practice is purely performative magic; but since the charts guide real capital allocation, they must track something real, requiring at least a presupposition of reliability. Thus, the view is not univocal: coherence is required, dualism fits well, but ontological realism is optional. The practice requires the audience to believe the quantification is meaningful in normal times. Therefore, the institution presupposes the intelligibility of quantification, even if it doesn't assert its metaphysical truth. This distinguishes between what is logically necessary for the chart to function versus what philosophical story best explains the switch.

  **Is the practice internally consistent?**

  Is the switch opportunistic or coherent? It is coherent under a threshold theory of uncertainty. If uncertainty is a continuum, quantification becomes increasingly error-prone as volatility rises. At a certain point, the error bars on the probabilities exceed the utility of the probabilities themselves. Switching to scenarios acknowledges this epistemic cliff. Stress tests complement this by focusing on survivability rather than likelihood. This is consistent with a decision theory that maximizes expected utility in normal times but switches to satisficing or minimax regret in extreme states. However, inconsistency arises if the boundary between "normal" and "turbulent" is manipulated. If the bank uses charts to avoid responsibility for outliers but scenarios for central predictions, it is opportunistic. Logically, however, the mixed practice holds together if one accepts that different epistemic conditions license different representational tools. The inconsistency is not in the tools themselves, but in the criteria for switching between them. If those criteria are opaque, the practice appears inconsistent; if transparent, it reflects a sophisticated dualistic theory of uncertainty. The opacity creates a moral hazard where the bank selects the framework that minimizes reputational risk rather than maximizing epistemic honesty. The chart assumes model certainty; the scenario assumes model uncertainty. The practice is consistent if the institution claims to know when its model is valid. The risk is "model uncertainty." The fan chart presupposes continuity; the stress test presupposes discontinuity. Holding both is consistent if the institution claims to monitor the boundary between continuity and discontinuity.

  **Rival theories that would license it**

  What else licenses this? Imprecise Probability theory allows for sets of probabilities. The fan chart could be seen as the central estimate of a set, while scenarios represent the bounds. This licenses the switch without claiming probabilities vanish, only that they become too wide to be useful. Another rival is Decision-Theoretic Pragmatism: probabilities are not true or false but useful or useless. This licenses using charts when they coordinate expectations and scenarios when they don't, without ontological commitment. A third is Institutional Performativity: the charts create the stability they measure. This licenses the practice as a self-fulfilling prophecy mechanism, where the "probability" is a commitment to act, not a prediction. These theories avoid the Keynesian dualism but still support the mixed methodology. They suggest the practice is flexible not because uncertainty changes nature, but because the utility of quantification changes. Imprecise Probability treats the fan chart as a single distribution derived from a credal set. When the set becomes too large, you show the scenarios. This makes the switch continuous rather than binary. Pragmatism focuses on the audience. If the market needs a number to price assets, give a number. If the market is panicking, give a narrative. This licenses the practice based on audience needs rather than epistemic states. Performativity suggests the fan chart stabilizes inflation by anchoring expectations. The stress test stabilizes banks by forcing capital buffers. Both are regulatory technologies, not epistemic claims. This rivals the epistemic reconstruction entirely.

  **What would change under a Bayesian and a radical-uncertainty view**

  Under a strict Bayesian view, the practice would change to emphasize updating. Priors would be explicit. The fan chart would show posterior distributions conditioned on model uncertainty, likely widening bands significantly to reflect parameter uncertainty. The "mode" might be replaced by expected utility maximizing paths. Under radical uncertainty (Keynes/Shackle), fan charts would be abolished. They imply false precision. Practice would shift entirely to scenario planning and stress testing. The central projection would be removed, replaced by a range of plausible futures without weighting. Regulation would rely solely on stress tests, abandoning expected loss models that require precise default probabilities. The focus would shift from prediction to resilience. The current practice is a middle ground; moving to either extreme would strip away the hybrid nature, forcing a choice between precise belief or pure narrative. A thorough Bayesian approach would incorporate model uncertainty into the fan chart, making the bands much wider (Bayesian Model Averaging). It would also require explicit disclosure of priors used to generate the central line. For Radical Uncertainty, the change is more profound. No central line at all. The "mode" is rejected as misleading. Policy would be based on robustness across scenarios rather than optimization around a mean. The stress test would become the primary regulatory tool, not a supplement.

  **Verdict**

  The practice presupposes a pragmatic dualism: uncertainty is measurable risk until it isn't. It requires logical coherence but not ontological realism. The colleague is wrong; communication entails epistemic commitment. The switch to scenarios is coherent if viewed as a threshold response to model breakdown. Ultimately, the practice is not a pure theory of probability but a technology of governance that uses probability where useful and abandons it where dangerous.
