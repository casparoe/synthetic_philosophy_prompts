    "recommendation": "Replace the blanket prohibition with a 'Scaffolding-First' configuration that defaults to guiding rather than generating, coupled with a verified accommodation override for students with documented disabilities.",
    "steps": [
      "Contract with the AI vendor to implement a 'Scaffolding Mode' that prioritizes outlining and feedback over draft generation.",
      "Establish a secure protocol between Disability Services and the Technology Office to flag accounts for accommodation overrides.",
      "Conduct professional development sessions for teachers on assessing process-oriented work and recognizing AI scaffolding.",
      "Launch a semester-long pilot program with a diverse student focus group to monitor error rates.",
      "Review pilot data and vote on district-wide rollout at the end of the term."
    ],
    "strongest_objection": "Academic integrity requires that the struggle of writing remain untouched; if we allow the AI to generate any text that could be submitted, we commodify learning and devalue the effort of honest students.",
    "response": "While integrity is vital, a rule that blocks accessibility tools fails ethically, and a rule that is easily circumvented fails practically; we must prioritize equitable access while shifting assessment to value process over product.",
    "open_question": "How do we redesign assessments to measure student thinking rather than text production, regardless of what tools they use?"
  }
  ```
