answer: |-
  **MEMORANDUM**

  **TO:** District Technology Committee
  **FROM:** Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding AI Study Assistant Configuration

  **Introduction**
  This semester, our district-issued AI study assistant has demonstrated critical failures in its current configuration. We have observed two distinct incidents: a student with a documented disability was denied assistance drafting an accommodation reminder email because the system classified it as "student work," while another student successfully generated a full essay on an unread book by iteratively requesting notes and reorganization. These incidents reveal that our current blanket prohibition on generating text "submitable for credit" is technically brittle and ethically inconsistent. As we vote next month, we must decide not merely on a setting, but on the philosophical role of this tool in our education.

  **The Philosophy of Refusal**
  The core question before us is: When is an AI assistant justified in refusing a user's request? Currently, the assistant acts as a paternalistic gatekeeper, refusing any request that resembles final output. This approach assumes that the value of education lies primarily in the unassisted production of text. Consequently, the system is designed to err on the side of refusing too much (false positives) rather than refusing too little (false negatives).

  We must ask which error is preferable. A system that refuses too little risks academic dishonesty; a system that refuses too much risks excluding students from equitable participation.

  **The Case for Strict Refusal**
  Proponents of maintaining or tightening the current blanket rule argue from a principle of academic integrity. Their position is that the "struggle" of writing is where learning occurs. If the AI alleviates the cognitive load of drafting, organizing, or phrasing, it commodifies the learning process. From this viewpoint, the error of refusing too little is catastrophic because it devalues the diploma for every student. If the AI can write the email or the essay, the student has not demonstrated competence. Therefore, the tool must act as a hard barrier, even if it occasionally inconveniences students with disabilities, because allowing exceptions creates a loophole that undermines the standard for everyone. This argument prioritizes the sanctity of the assessment over the convenience of the tool.

  **The Case for Contextual Flexibility**
  While the integrity argument is principled, it relies on two assumptions that recent events have disproven. First, it assumes the blanket rule actually prevents cheating. The five-paragraph essay incident proves that a rule based on simple output detection is easily circumvented by iterative prompting. A tool that fails to stop cheating while successfully blocking a disabled student from communicating with a teacher is failing at both integrity and equity.

  Second, it assumes that all text generation is equivalent. Drafting an accommodation email is not an assessment of literary analysis; it is a functional communication task necessary for the student to access their education. When the AI refuses this, it is not protecting learning; it is creating a barrier to access.

  Therefore, we should prefer the error of refusing too *little* regarding support, rather than refusing too *much*. The risk of cheating is manageable through pedagogical design and teacher oversight, whereas the risk of exclusion is immediate and harmful. We cannot software-lock our way to integrity if the lock excludes vulnerable students and is easily picked by dishonest ones.

  **Recommendation**
  I recommend that the committee vote to replace the blanket prohibition with a "Scaffolding-First" configuration. This protocol would direct the AI to default to outlining, critiquing, and questioning rather than generating final draft text, while simultaneously implementing a verified accommodation override for students with documented disabilities managed through the Disability Services office. This shifts the AI from a gatekeeper of output to a partner in process, acknowledging that integrity is maintained by assessing thinking, not just text.

  **Conclusion**
  We cannot configure our way out of the need for trust. By adopting a model that prioritizes accessibility and process over rigid output bans, we acknowledge that the goal of education is learning, not merely the production of unassisted text.

  ***

