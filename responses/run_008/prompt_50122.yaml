answer: |-
  Your flatmate is making a classic, hardline Dawkinsian argument, and your intuition that something is off is spot-on. You have correctly identified that her argument relies on a sleight of hand regarding definitions.

  To answer your specific request: **You should reject your flatmate's Premise (1).**

  Here is the breakdown of why that is the step to cut, what theoretical machinery replaces it, and what it costs both of you.

  ### 1. The Category Error: Replicator vs. Interactor
  Your flatmate's Premise (1) states: *"Something counts as a unit of selection only if it's a replicator."*

  This is the weak link. It conflates the **thing that gets copied** with the **thing that gets selected**. This is exactly where David Hull's distinction (which you recalled) comes in to save the day. Hull (and later Gould and Eldredge) argued that we need two distinct concepts:

  *   **The Replicator:** The entity that passes its structure on to the next generation (the Gene).
  *   **The Interactor:** The entity that interacts with the environment in such a way that replication is differential (the Organism, sometimes the Group).

  **The Correction:** Selection acts on **Interactors**. Evolution (the cumulative change) happens to **Replicators**.

  When a predator eats a gazelle, selection is acting on the *organism* (the interactor). The organism dies; it does not replicate. The *genes* (the replicators) survive by virtue of having been in other gazelles that ran faster. If you define "unit of selection" strictly as "replicator" (Premise 1), you are linguistically barred from saying the gazelle was selected against, which makes the word "selection" useless for describing the actual causal event (the eating).

  **Cost of rejecting (1):** You lose the pithy slogan "The gene is the only unit of selection." You have to accept a dualistic framework where genes are the *beneficiaries* of selection, but organisms are the *targets* of selection.

  ### 2. Addressing Your Counter-Arguments (a, b, c, d)
  Your counter-arguments are strong because they highlight the double standard in her fidelity and dependence criteria.

  *   **On Fidelity (Your point a & c):** You are right. Fidelity is a matter of degree, not a binary switch. Genes mutate; organisms are "copied" via reproduction with recombination. The difference is timescale. A gene lineage can persist for millions of years; an organism lineage (clone) usually doesn't. However, for selection to act *now*, you don't need immortality, you just need **heritability**.
      *   *Lewontin's Conditions:* For selection to act on a level, you only need: (1) Variation, (2) Differential Fitness, and (3) Heritability.
      *   Organisms satisfy this. Offspring resemble parents enough (heritability) that fast parents tend to have fast offspring. The fact that the offspring isn't a *clone* doesn't stop selection from working on the trait.
  *   **On Machinery Dependence (Your point b):** This is a devastating point against her Premise (2). Genes are inert molecules. They *never* replicate themselves. They always rely on the "organism-level machinery" (polymerases, ribosomes, meiosis). If dependence on higher-level machinery disqualifies an entity, **genes are disqualified first.**
      *   To save her argument, she has to admit that "dependence" is universal. Everything depends on a context. The question isn't "Does it depend?" but "Does the dependence break the lineage?" For genes, the cellular machinery is generally loyal (mostly). For organisms, the "group machinery" might be less loyal. But that's an empirical question, not a definitional disqualification.

  ### 3. The Group Selection "Free Pass" Concern
  You mentioned you don't want to give group selection a free pass on a technicality. Good instinct. Rejecting Premise (1) does **not** prove group selection is common or potent; it just proves it's *possible*.

  If you reject (1) and adopt the Interactor view, groups *can* be units of selection, but they have to clear the same empirical hurdles as genes and organisms:
  1.  **Variation:** Do groups differ in traits?
  2.  **Fitness:** Do some groups survive/reproduce better than others?
  3.  **Heritability:** Do daughter groups resemble parent groups?

  Your flatmate is right that groups often fail on (3) due to migration (her Premise 3). But they don't fail *by definition*; they fail *by circumstance*. In species with low migration and high group extinction (e.g., some social insects, or human tribes in warfare), group selection is mathematically viable. By rejecting (1), you aren't saying "Groups are always units of selection," you are saying "Groups are eligible candidates, but often lose on the details."

  ### 4. Gould's Bookkeeping Complaint
  You recalled Gould complaining about confusing causes with bookkeeping. This is the final nail in the coffin for Premise (1).

  Gould argued that the "Selfish Gene" view is often a **reductionist heuristic** that is useful for modeling, but ontologically misleading.
  *   **Bookkeeping:** If you want to track evolutionary change over a million years, the gene is the best ledger.
  *   **Cause:** If you want to explain why the rabbit ran, the organism is the cause.

  If your flatmate insists that only the ledger entry is "real," she is committing what philosophers call the **Genetic Fallacy** (in the evolutionary sense). She is confusing where the information is stored (gene) with where the work is done (organism).

  ### Summary: What to Tell Your Flatmate
  Tell her this:

  1.  **Reject Premise (1).** It defines "unit of selection" in a way that severs the link between selection and the actual causal mechanism (survival/reproduction of the body).
  2.  **Adopt Hull's Distinction.** Genes are Replicators (Units of Evolution); Organisms are Interactors (Units of Selection).
  3.  **Acknowledge the Double Standard.** If organism-level machinery disqualifies organisms, gene-level machinery disqualifies genes. If imperfect copying disqualifies organisms, mutation disqualifies genes.
  4.  **The Compromise.** She can keep the "Selfish Gene" insight (that genes are the ultimate beneficiaries of long-term evolution) without denying that organisms are the actual units being selected in the here-and-now.

  **The Cost:**
  *   **For Her:** She loses the rhetorical slam-dunk that "organisms don't exist" as evolutionary units. She has to admit organisms are real causal agents.
  *   **For You:** You have to accept that "Unit of Selection" is a pluralistic concept. Sometimes it's the gene (meiotic drive), sometimes the organism (predation), sometimes the group (tribal warfare). There is no single "True Unit."

  Your counter-argument (d) was the correct *reductio ad absurdum*. Her definition leads to a world where nothing can be selected except immortal, self-replicating magic dust. Since magic dust doesn't exist, the definition is broken. Reject (1).
