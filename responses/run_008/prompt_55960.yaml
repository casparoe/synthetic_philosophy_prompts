      *   *Wait, does switching twice make sense?* If I see $X$, calculate $E[Y|X] > X$, I switch. Now I hold $Y$. Do I know $Y$? Yes. Do I recalculate? If the prior is proper, there will be some values where I stay and some where I switch. If I switched at $X$, it means $X$ was in the "switch region." Does that imply $Y$ is in the "stay region"? Not necessarily, but you can't *always* want to switch.
      *   *Infinite Mean Case:* This is tricky. If the mean is infinite, $E[Y|X]$ can still be $> X$ for all $X$. This is the Cover's Strategy scenario or similar. I need to be careful not to say "it's undefined" but rather "EV maximization leads to paradoxical behavior because the total expectation diverges." I should mention that with a proper utility function (log wealth), the paradox vanishes.
      *   *Verdict (5):* The host promise implies an improper prior. I need to explain that "no actual host could ever really have" is the key. You can't have a uniform distribution over $(0, \infty)$.

  7.  **Final Polish:** Organize with clear headings matching the user's three requests. Ensure the "Calculator Check" is explicit. (Self-correction: Make sure to explicitly calculate the posterior probabilities in Variant 4 to prove the 90/10 split leads to 9:1 odds on the specific pair).

