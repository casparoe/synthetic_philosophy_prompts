answer: |-
  Here is the principle, the verdict on your variants, and the answers to your three specific requests.

  ### The Unifying Principle

  **Maximize Conditional Expected Value.**
  You should switch if and only if the expected value of the other envelope, *conditional on the specific amount you see and the prior distribution of how the money was chosen*, is strictly greater than the amount in your hand.

  Mathematically: Switch if $E[Y \mid X=x] > x$.
  Crucially, calculating $E[Y \mid X=x]$ requires Bayes' Theorem. It requires you to know (or assume) the probability distribution of the pairs of money *before* you picked an envelope. You cannot assume the other envelope is 50/50 to be double or half unless the prior distribution specifically guarantees that for the value $x$ you hold.

  ---

  ### 1. Which Verdicts Must Go (and the Calculator Check)

  Your gut instincts on **(1)**, **(3)**, and **(4)** are correct. Your verdicts on **(2)** and **(5)** must be rejected.

  **Verdict (2) is wrong.**
  You calculated: $0.5(200) + 0.5(50) = 125$.
  This calculation assumes that given you see $100, the probability it is the smaller amount is exactly 0.5.
  **Why it fails:** For this to be true for *every* amount you might see (as you noted, "whatever amount I would have seen"), the prior probability of the pair being $(50, 100)$ must equal the prior probability of the pair being $(100, 200)$. If this holds for $100$, it must hold for $200$, $400$, $50$, $25$, all the way to zero and infinity. This requires a "uniform prior" over all positive real numbers. **No such probability distribution exists.** The sum of probabilities would be infinite, not 1. Therefore, the 50/50 assumption is mathematically impossible for a real game.

  **Verdict (5) is impossible.**
  The host is promising you a conditional probability ($P(\text{smaller} \mid \text{see } x) = 0.5$) that no physical mechanism can deliver for all $x$. If the host is trustworthy, he is describing an **improper prior**. In this specific mathematical fantasy, expected value is undefined, and the logic "switch twice returns to start" breaks because the integrals involved do not converge. In any real-world scenario, the host is lying or mistaken.

  **The Calculator Check (Using your Variant 4):**
  You already did the arithmetic, but let's formalize why it kills Verdict (2).
  In Variant (4), at $X=20$:
  *   **Scenario A:** Pair is $(10, 20)$. Prior prob = $0.9$. Chance you pick the $20$ envelope = $0.5$. Joint prob = $0.45$.
  *   **Scenario B:** Pair is $(20, 40)$. Prior prob = $0.1$. Chance you pick the $20$ envelope = $0.5$. Joint prob = $0.05$.
  *   **Total chance of seeing $20$:** $0.45 + 0.05 = 0.50$.
  *   **Posterior Probability (Scenario A):** $0.45 / 0.50 = 0.9$. (Other envelope is $10$).
  *   **Posterior Probability (Scenario B):** $0.05 / 0.50 = 0.1$. (Other envelope is $40$).
  *   **Expected Value of Other:** $(0.9 \times 10) + (0.1 \times 40) = 9 + 4 = 13$.
  *   **Decision:** $13 < 20$. **Stay.**

  Variant (4) works because the probabilities sum to 1. Variant (2) fails because to get the 50/50 split at $100, you implicitly assume the probability of the pair $(50, 100)$ equals the pair $(100, 200)$. If you force that equality for all numbers, the probabilities cannot sum to 1.

  ---

  ### 2. Predictions for Your Two New Cases

  **Case A: Open, Switch, Open New, Switch Again**
  *   **Prediction:** You will not want to switch back.
  *   **Reasoning:** When you first open envelope $X$ and decide to switch, it is because the conditional expectation $E[Y \mid X] > X$. This happens because seeing $X$ gave you information (e.g., $X$ is a "low" number in the distribution). Once you switch, you now hold $Y$. You open it. You now calculate $E[X \mid Y]$. Because you have updated your information, the symmetry is broken. In a proper distribution, there are "switch regions" (low values) and "stay regions" (high values). If $X$ was in the switch region, $Y$ is statistically likely to be in the stay region. You cannot have $E[Y \mid X] > X$ and $E[X \mid Y] > Y$ simultaneously for a proper prior. The infinite loop only happens if you stubbornly refuse to update your prior after the first switch, or if you are in the impossible Case (5).

  **Case B: St. Petersburg Distribution (Infinite Mean)**
  *   **Prediction:** The principle breaks down; "Expected Value" is no longer a useful guide.
  *   **Reasoning:** If the smaller amount is drawn from a distribution where the expected value is infinite (e.g., probability $2^{-k}$ for amount $2^k$), then $E[X] = \infty$ and $E[Y] = \infty$.
  *   Technically, for any *finite* $X$ you open, the conditional expectation of the other envelope might still be greater than $X$ (depending on the specific tail behavior). This leads to the result: "Always switch."
  *   However, since the total expectation is infinite, switching doesn't actually "gain" you anything in a meaningful sense. $ \infty = \infty$. To resolve this, you must abandon raw dollar Expected Value and use **Expected Utility** (e.g., log utility of wealth). With diminishing marginal utility, the paradox vanishes immediately, and there will be a threshold amount where you stop switching.

  ---

  ### 3. The Hidden Assumption and Why (4) Exposes It

  **The Hidden Assumption:**
  Your "50/50 itch" in Verdict (2) smuggles in the assumption of **Scale Invariance**. You are assuming that seeing $100 tells you *nothing* about whether $100 is the smaller or larger amount. You are assuming the probability distribution of money is "flat" enough that the pair $(50, 100)$ is just as likely as $(100, 200)$.

  **Why Variant (4) Exposes It:**
  Variant (4) forces the probabilities to sum to 1 ($0.9 + 0.1 = 1$). Because the total probability is fixed, the pairs compete with each other.
  *   At the overlap value ($20), the pair $(10, 20)$ "drowns out" the pair $(20, 40)$ because it is 9 times more common.
  *   This forces the posterior probability to shift from 50/50 to 90/10.
  *   This proves that **seeing the value gives you information about the pair.**

  **Why Variant (2) Hides It:**
  In Variant (2), you don't know the prior. Your brain fills the void with the **Principle of Indifference**: "I have no reason to think $100 is small or large, so I'll assume 50/50."
  This feels neutral, but it is actually a very strong claim. It claims the prior distribution is uniform over $(0, \infty)$.
  *   Variant (4) makes the prior explicit, so you can see the "weight" of the $(10, 20)$ pair crushing the $(20, 40)$ pair.
  *   Variant (2) leaves the prior hidden, allowing you to assume the weights are equal everywhere. But if the weights are equal everywhere, the total weight is infinite, and the game cannot exist.

  ### Final Word on Your Brother

  Your brother is right, but his explanation was too terse. "It depends on the prior" is the correct mathematical answer. The paradox exists *only* because Verdict (2) assumes a prior that cannot exist (a uniform distribution over infinite positive reals).

  If you assume any **proper** prior (where probabilities sum to 1), the 50/50 assumption must fail for at least some values. There must be some amounts where you should stay. If there are amounts where you should stay, you cannot say "always switch" before opening (Verdict 1), and the paradox dissolves.

  **Summary:** Keep verdicts 1, 3, and 4. Throw out 2 and 5. The principle is Conditional Expected Value, calculated using Bayes' Theorem with a valid prior. Your brother wins the argument, but you win the understanding.
