      *   *The Proof:* Moore cared about the definition of proof. Premises known, conclusion follows. The physicist gets the gist but misses Moore's anxiety about whether he satisfied the skeptic.
      *   *Skepticism:* Moore distinguished between proving the external world exists and proving he knew he wasn't dreaming. He admitted he couldn't do the latter. The physicist says he refuted skeptics. That's too strong. Moore thought skeptics were wrong, but didn't claim to silence them logically on their own terms.
