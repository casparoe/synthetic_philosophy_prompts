prompt: |-
  I'm a novelist at work on a book in which a retired physicist of broadly skeptical temperament holds forth to his granddaughter about the vanity of academic philosophy, and in one scene he offers G. E. Moore as his prize exhibit: the famous proof of an external world. His summary, which I have adapted from a popular history of philosophy I read last winter, runs roughly as follows: Moore stood before an audience, raised his hands, and declared that he had thereby proved the existence of the external world, since a raised hand is exactly the sort of thing the skeptics doubt; that in doing so he refuted the skeptics of his day; that he showed common sense to be a stronger criterion of truth than any philosophical argument; and that Descartes' dream argument is answered once and for all by the plain fact that we can never be wrong about such things as our having hands.

  I suspect the book I read, like most popularizations, compresses something, and I would like to know how much of this my character could say without a philosopher in the audience wincing. Which parts of the summary would a scholar of Moore accept as accurate, which are simplifications a defender might let pass, and which are outright misattributions? I have a vague sense, for instance, that proving an external world and refuting skepticism were, for Moore, distinct tasks, and that his own standard for what deserves to be called a proof was unusually strict, even while he made some concession to his critics about what such a proof can accomplish. And does the physicist's punchline, that Moore established we can never be wrong about such things, follow from anything Moore actually claimed, or does it convert one of his careful distinctions into a boast he never made? Since my scene requires the old man to sound authoritative while being subtly off, I need to know precisely where and how he goes wrong, so that the reader who knows the subject smiles at his confidence rather than at my research.

  Please answer in continuous prose only, the way one would write a letter: no headings, no bullet points, no bold text, and no tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a scene featuring a retired physicist (skeptical temperament) talking to his granddaughter about G. E. Moore's "Proof of an External World."
      *   **Character's Claim:** The physicist summarizes Moore's argument based on a popular history. The summary includes: Moore raised hands before an audience; declared this proved the external world; claimed raised hands are what skeptics doubt; refuted skeptics of his day; showed common sense is stronger than philosophical argument; answered Descartes' dream argument once and for all; claimed we can never be wrong about having hands.
      *   **Goal:** The user wants to know which parts of this summary are accurate, which are simplifications, and which are outright misattributions/errors, specifically to make the character sound authoritative but subtly wrong (so knowledgeable readers smile at the character's confidence, not the author's research).
      *   **Constraint:** Answer in continuous prose only (like a letter). No headings, no bullet points, no bold text, no tables.

  2.  **Analyze the Subject Matter (G. E. Moore's "Proof of an External World"):**
      *   **Source:** "Proof of an External World" (1939).
      *   **The Gesture:** Moore did hold up his hands. He said "Here is one hand" and "Here is another."
      *   **The Argument Structure:**
          1.  Here is one hand (premise).
          2.  Here is another hand (premise).
          3.  If there are hands, there are external objects (premise).
          4.  Therefore, external objects exist (conclusion).
      *   **Moore's Stance on Proof:** He cared deeply about the strict definition of proof. He argued the premises were known with certainty, the conclusion followed validly, and thus it was a proof.
      *   **Moore's Stance on Skepticism:** This is the tricky part. Moore distinguished between proving the existence of an external world and satisfying the skeptic's demand for a proof that doesn't assume what the skeptic doubts. He admitted his proof wouldn't satisfy the skeptic because the skeptic doubts the premises (e.g., "How do you *know* that's a hand?"). Moore thought the skeptic was unreasonable, but he didn't claim to have *refuted* skepticism in the sense of silencing the skeptic on their own terms. He thought he had proved the conclusion, but not necessarily answered the skeptic's specific challenge about *how* we know.
      *   **Common Sense:** Moore is associated with "Common Sense Philosophy," but he didn't simply say "common sense is stronger." He argued that certain common sense propositions are more certain than the philosophical premises used to doubt them.
      *   **Descartes/Dream Argument:** Moore discussed the dream argument. He admitted he couldn't prove he wasn't dreaming. He said he *knew* he was awake, but couldn't prove it to the skeptic's satisfaction. So claiming he answered Descartes "once and for all" is too strong.
      *   **Infallibility:** Did Moore say we can *never* be wrong about having hands? No. He claimed certainty in that specific context, but he wasn't claiming general infallibility about sense data or physical objects in all contexts. He acknowledged the possibility of error in specific perceptual claims, but held that some are known with certainty. The physicist's claim ("we can never be wrong about such things") is too universal.

  3.  **Evaluate the Physicist's Summary (Point by Point):**
      *   *Moore stood before an audience, raised his hands:* Accurate enough (it was a lecture).
      *   *Declared that he had thereby proved the existence of the external world:* Accurate (that was the title and aim).
      *   *Since a raised hand is exactly the sort of thing the skeptics doubt:* Simplification. Skeptics doubt the existence of matter/external objects. Hands are instances of matter. Close enough for a summary, but the skeptic doubts the *knowledge* claim, not just the existence.
      *   *In doing so he refuted the skeptics of his day:* Problematic. Moore thought he proved the conclusion, but admitted he didn't satisfy the skeptic's demands for justification of the premises. He didn't claim to refute skepticism entirely, just to prove the proposition.
      *   *Showed common sense to be a stronger criterion of truth than any philosophical argument:* This is the "Moorean Shift" essence. He prioritized common sense certainties over philosophical hypotheses. Acceptable simplification, though "criterion of truth" is a bit loose.
      *   *Descartes' dream argument is answered once and for all:* Incorrect. Moore admitted he couldn't prove he wasn't dreaming. He said he knew he was awake, but couldn't prove it. So "answered once and for all" is too strong.
      *   *Plain fact that we can never be wrong about such things as our having hands:* Incorrect. Moore claimed he *knew* he had hands, not that it's impossible to be wrong about such things in principle. He distinguished between knowing and being able to prove you know.

  4.  **Drafting the Response (incorporating constraints):**
