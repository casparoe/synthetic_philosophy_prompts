answer: |-
  Dear Novelist,

  Your intuition serves you well, for the summary your character recites is indeed the kind of polished anecdote that survives in popular histories while losing the philosophical friction that made the original argument so contentious. If you wish for your physicist to sound authoritative yet subtly mistaken, you have rich material to work with, because Moore's actual position was far more tentative and nuanced than the triumphant gesture your character describes. The image of Moore holding up his hands before a lecture hall is historically accurate, as is the claim that he intended this gesture to serve as a proof of the external world. He did indeed premise his argument on the proposition that here was one hand and here was another, and he did argue that since hands are external objects, their existence proves the existence of the external world. However, the confidence with which your character claims Moore refuted the skeptics of his day is where the first crack appears. Moore was meticulously careful to distinguish between proving that the external world exists and satisfying the skeptic's demand for a proof that does not assume what is being doubted. He admitted freely that his proof would not satisfy a skeptic, because the skeptic would simply deny that he knew with certainty that he was holding up hands. Moore's strategy was not to dismantle the skeptic's logic on the skeptic's own terms, but to assert that the certainty of common sense propositions was greater than the certainty of the philosophical premises used to doubt them. Your character's claim that Moore refuted the skeptics suggests a victory in debate that Moore himself would have denied, preferring to say that he had proved the conclusion even if he could not prove that he knew the premises to the skeptic's satisfaction.

  This distinction becomes even more critical when your character addresses the dream argument. You have him claim that Descartes' dream argument is answered once and for all by the plain fact of having hands, but this is a significant misattribution that a scholar would immediately spot. Moore explicitly conceded that he could not prove he was not dreaming. He maintained that he knew he was awake and that he had hands, but he acknowledged that he lacked a proof that would rule out the dream hypothesis to the satisfaction of a rigorous epistemologist. He argued that because he knew he had hands, he must know he was not dreaming, but he could not use the absence of dreaming as a premise to prove he had hands without begging the question. Therefore, having your character state that the dream argument is settled once and for all imbues Moore with a dogmatic certainty he did not claim. Moore was willing to live with the fact that he could not meet the skeptic's specific challenge regarding dreams, provided he could maintain the certainty of his common sense convictions. Your physicist character collapses this tension into a boastful resolution that Moore himself avoided.

  Perhaps the most revealing error for your scene lies in your character's punchline, where he asserts that Moore established we can never be wrong about such things as our having hands. This converts Moore's claim to knowledge in a specific instance into a general principle of infallibility that Moore never defended. Moore argued that he knew certain propositions with certainty, such as the existence of his hands at that moment, but he did not argue that human beings are incapable of error regarding physical objects. He was well aware that perceptual errors occur, and his philosophy was not built on the idea that sense perception is incorrigible, but rather that some specific perceptual claims are more certain than the abstract arguments used to doubt them. By having your character claim that we can never be wrong about having hands, you give him a voice of absolute certainty that contrasts sharply with Moore's actual acknowledgment of the limits of proof. This is the perfect place for your character to sound subtly off, for he is treating Moore's common sense realism as a kind of scientific law of infallibility, whereas Moore treated it as a stubborn refusal to abandon obvious truths in the face of paradox.

  To capture the effect you desire, where the knowledgeable reader smiles at the character's confidence rather than your research, you might allow your physicist to gloss over Moore's admissions of inability. Let him speak as if Moore's proof was a slam dunk that silenced the room, whereas in reality, Moore's lecture was met with a mixture of bewilderment and respect for his honesty about what the proof could not do. Your character can treat the hand-raising as a rhetorical trump card, ignoring Moore's own anxiety about whether the premises were truly known. He can conflate the existence of the external world with the refutation of skepticism, treating them as the same task when Moore saw them as distinct. He can present the common sense criterion as a universal weapon against philosophy, rather than a defensive stance against specific idealist arguments. By having him smooth over these jagged edges, you preserve his authority as a man who knows the history of ideas while revealing his temperament as one who prefers clean solutions to messy truths. The physicist wants Moore to be a hero who killed skepticism with a gesture, but the real Moore was a man who admitted he could not prove he was awake while insisting he knew he was. That gap between the popular legend and the philosophical reality is exactly where your character's voice will find its authentic imperfection.

  I hope this helps you tune the scene to the right frequency. It is a delight to correspond with a writer who cares so much about the integrity of the ideas their characters inhabit, and I trust your physicist will be all the more compelling for carrying these specific, human misunderstandings in his pocket. He is a man of science looking for certainty, and it fits him perfectly to misremember a philosopher who found certainty only by admitting the limits of proof.

  Yours sincerely,

  A Student of Philosophy
