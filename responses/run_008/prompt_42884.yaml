answer: |-
  Short answer
  Elias is logically consistent but morally unlivable; you are intuitively right but philosophically vague. Outcomes matter for accountability, even if character assessment remains similar. You cannot function socially if you ignore harm entirely.

  Where you two actually disagree
  You have two stacked disagreements that Elias intentionally conflates. First, on "resultant luck": does the actual harm caused change the moral weight of the act? Elias says no; you say yes. Second, on "constitutive luck": does determinism negate responsibility entirely? Elias says yes; you imply no. Elias pushes the first point to prove the second, arguing that if luck affects blame, then blame is irrational. If outcomes don't matter, why blame anyone? If genes determine choices, why blame anyone? You are fighting the outcome point, but Elias is using it to wedge open the determinism door to collapse all responsibility. You need to separate whether the *person* is worse (character) from whether the *act* warrants sanction (liability). Elias conflates these to force a nihilistic conclusion. You must defend liability without accepting metaphysical ultimate responsibility. This distinction allows you to acknowledge luck without abandoning judgment.

  The strongest version of Elias's side
  Elias is channeling Galen Strawson's "Basic Argument." To be truly responsible, you must be the cause of yourself, which is impossible. Your choices flow from genes and environment you didn't choose. Therefore, "choice" is an illusion. If you accept this, distinguishing between the drunk drivers is irrational superstition. The coworker didn't "choose" to hit the cyclist any more than the sister "chose" safety; physics decided. Consistency demands we either abolish blame entirely or apply it universally regardless of outcome. To punish one and not the other is merely scapegoating randomness. It is the only view that truly respects the truth of causality. Furthermore, Elias argues that constitutive luck dictates your risk tolerance itself. Your bravery or caution is inherited, not chosen. Thus, even the decision to drive drunk stems from unchosen traits. Blaming the coworker for bad luck while praising the sister for good luck is deeply fundamentally unjust.

  The strongest version of your side
  Your intuition tracks the social function of morality. Blame isn't just metaphysical accounting; it's a tool to regulate behavior and acknowledge victims. The cyclist's broken leg is a concrete reality, not a philosophical abstraction. Ignoring harm severs the link between action and consequence, rendering morality useless. We hold people accountable for outcomes because that's how we prevent future harm. Furthermore, compatibilism argues that "choice" means acting according to your desires without coercion, even if those desires have prior causes. The coworker caused harm; the sister didn't. That difference is real and morally relevant for liability, even if their internal wickedness is identical. Society cannot actually function if we treat failed attempts and successful harms equally. The victim's suffering demands true recognition that pure intent cannot provide. We punish results to incentivize necessary caution, acknowledging that while character may be similar, the world often reacts differently to success and failure ultimately.

  A workable middle
  Adopt a two-tier system: *Moral Worth* vs. *Social Liability*. Internally, judge their characters equally; both were reckless. Externally, treat them differently based on harm. This isn't hypocrisy; it's functional. We punish negligence that causes harm more severely to incentivize care, even if the mental state was identical. You can believe both were equally wrong to drive while acknowledging the coworker owes restitution and the sister doesn't. This preserves the intuition that harm matters without accepting Elias's nihilism. Choice sets the baseline blame; outcome scales the consequence. This approach avoids vague vibes by assigning specific weights to intent and result. It allows you to maintain personal respect for the sister while supporting legal accountability for the coworker. Responsibility is not a single scalar value but a vector of intent, action, and result. You can hold both views without clear contradiction. This resolves the stalemate by changing the overall definition of blame.

  What follows for the office
  The company must treat them differently; liability and risk management require it. One caused legal exposure and physical harm; the other didn't. Firing the coworker is pragmatic, not necessarily a judgment on her soul. Promoting the sister is routine. You can view them as flawed friends while recognizing their situations differ. Don't ostracize the coworker morally, but acknowledge she carries a burden the sister doesn't. Support the coworker, but don't pretend the outcomes are identical. Your friendship should offer empathy without erasing the reality of the victim. Treat the coworker with care, but accept that her life is harder now.
