  11. **Final Polish:** Check tone. Ensure all constraints of the prompt are met. (Brainstorming visible? No, just the result. But I need to show I thought carefully.) *Wait, prompt says "if it helps, brainstorm several lines of attack... before organizing your response." I should probably keep the brainstorming internal but reflect that depth in the structured output.* I will structure the response clearly with headings.

      *Plan:*
