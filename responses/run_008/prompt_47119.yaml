answer: |-
  This is a delicate pedagogical situation. You are asking for an analysis of your co-facilitator's internal jurisprudence—essentially reverse-engineering her moral logic—so that you can maintain consistency in the workshop. This is a smart move; inconsistency undermines authority, especially in sensitive topics like consent.

  Based on the track record you provided, her rulings are not random. They follow a coherent, albeit specific, philosophical framework. Below is an analysis of the "machinery" driving her decisions, predictions for the three new cases, and a proposed "test case" to expose the limits of her logic.

  ### 1. The Machinery: Her Underlying Principles

  Your co-facilitator appears to be operating on a hybrid of **Contractarian Liberty** and **Fraud in the Factum**. Her logic distinguishes sharply between *means* and *ends*, and between *threats* and *offers*.

  **A. The Deception Principle (Nature of the Act vs. Inducement)**
  *   **Rule:** Deception vitiates consent *only* if it concerns the physical conditions or nature of the sexual act itself. It does *not* vitiate consent if it concerns collateral inducements (status, wealth, emotion, future intent).
  *   **Evidence:**
      *   *Love/Career Lies:* Valid. These are inducements (reasons to say yes), not conditions of the act.
      *   *Stealthing:* Invalid. This changes the physical conditions of the act (protected vs. unprotected).

  **B. The Coercion Principle (Threats vs. Offers)**
  *   **Rule:** Consent is vitiated by *threats* (conditional intent to make someone worse off than their baseline), but not by *offers* (conditional intent to make someone better off), even if the offer is the only lifeline.
  *   **Evidence:**
      *   *Blackmail/Manager:* Invalid. These are threats. The baseline is "affair stays secret" or "job continues." The coercer proposes worsening that baseline.
      *   *Breakup:* Valid. Ending a relationship is a withdrawal of a benefit, not an infliction of harm. He has a right to end the relationship; she has no entitlement to his continued affection.

  **C. The Entitlement Principle (Wrongful Leverage)**
  *   **Rule:** Pressure vitiates consent if the lever being pulled is something the coercer has *no right* to use for sexual gain.
  *   **Evidence:**
      *   *Manager:* Invalid. An employer has no right to trade job security for dates.
      *   *Breakup:* Valid. A partner has a right to end a romance.

  ---

  ### 2. Predictions for the Three New Cases

  Based on this machinery, here are the predicted verdicts.

  **Case 1: The Wealthy Man and the Debt**
  *   **Scenario:** Offer to clear debts in exchange for sex. No threat, just an offer.
  *   **Prediction:** **Valid Consent.**
  *   **Reasoning:** This fits the "Offer vs. Threat" distinction perfectly. The student's baseline is "in debt." The man proposes moving her to "debt-free." He is not threatening to *make* her indebted (which would be a threat); he is offering to rescue her. In her framework, desperation caused by background circumstances (like poverty) does not invalidate consent if the other party did not create that desperation. This aligns with her ruling on the "career lie"—financial status is an inducement, not a condition of the act.
  *   *Risk:* This is the most ethically contentious ruling. Students may push back hard, arguing that "no realistic way out" equals coercion. But if she sticks to her "Threat vs. Offer" line, this must be Valid.

  **Case 2: The Vasectomy Lie**
  *   **Scenario:** She consents only if no pregnancy risk. He lies about vasectomy.
  *   **Prediction:** **Invalid Consent.**
  *   **Reasoning:** This aligns with the "Stealthing" precedent. In her framework, contraception is a *condition of the physical act*, not merely an inducement. By lying about the vasectomy, he has altered the nature of the act from "safe sex" to "risky sex" without her knowledge. This is deception regarding the *factum* of the act (its physical consequences/safety), distinct from lying about feelings or wealth.
  *   *Risk:* Some legal frameworks distinguish between STI risk (stealthing) and pregnancy risk. However, given her strict ruling on condoms, consistency demands she treats fertility control as a physical condition of the act.

  **Case 3: The Landlord and the Eviction**
  *   **Scenario:** Landlord threatens eviction on a technicality unless sex happens.
  *   **Prediction:** **Invalid Consent.**
  *   **Reasoning:** This aligns with the "Manager" precedent, not the "Breakup" precedent. While the landlord has a *contractual* right to evict (similar to the boyfriend's right to break up), using housing security as leverage for sex is a wrongful use of power, analogous to the manager using employment security. Housing, like employment, is a basic necessity; the "technicality" is a pretext. The key distinction is likely the *purpose*: ending a relationship is a legitimate end in itself; evicting a tenant to extract sex is an illegitimate end.
  *   *Risk:* If she rules Valid here, it proves her principle is strictly "Legal Entitlement" (he *can* evict, so he can condition it). But given the Manager ruling, she seems to recognize that economic power dynamics can render a "legal right" wrongful when used for sexual extraction.

  ---

  ### 3. The Crucial Test Case: Driving the Rules Apart

  To truly understand where her logic might break—or to help students see the boundaries—you need a case that forces a choice between her **Threat/Offer Rule** and a **Voluntariness/Alternatives Rule**.

  **The Proposed Case: "The Lifeboat Offer"**
  > *A woman is drowning in a lake. A man is passing by in a boat. He is under no duty to rescue her. He says, "I will throw you the rope and save you, but only if you agree to sleep with me." She agrees, he saves her, and they have sex. She later says she only consented because she would have died otherwise.*

  **Why this drives the rules apart:**
  *   **Rule A (Threat vs. Offer):** This is technically an *offer*. He is not threatening to drown her (he didn't push her in); he is offering to save her. Under her "Debt" logic (Case 1), this should be **Valid Consent**. He is making her better off (alive vs. dead).
  *   **Rule B (Reasonable Alternative/Voluntariness):** She had *no* reasonable alternative. Her will was completely overborne by necessity. If she rules **Invalid Consent** here, she abandons the "Threat vs. Offer" distinction and admits that extreme desperation vitiates consent regardless of who created the situation.

  **Pedagogical Value:**
  If she rules **Valid**, she reveals her framework is strictly libertarian (freedom of contract trumps desperation). If she rules **Invalid**, she reveals her framework is actually about *power and necessity*, which would undermine her ruling on Case 1 (The Debt). Raising this hypothetical (perhaps anonymously) will force her to clarify whether "no realistic way out" is ever enough to vitiate consent on its own.

  ### 4. A Note on Facilitation

  You are in a difficult position. Your co-facilitator's framework is internally consistent but legally and ethically brittle. For example, in many jurisdictions, Case 2 (Vasectomy lie) is *not* rape, and Case 1 (Debt) could be considered sexual exploitation depending on university policy.

  **Recommendation:**
  When you present these predictions, frame them as *"Based on the precedents we've established in this room..."* rather than *"This is the law."* This protects you if a student challenges the ruling with actual legal statutes or university conduct codes that differ. It allows you to honor her consistency without endorsing the views as universal truth.

  If students push back on Case 1 (The Debt), you might say: *"This is where the distinction between coercion and exploitation becomes difficult. Under the logic we've used so far, an offer is not a threat. But does extreme power imbalance change that? That is a debate for the law, but for this workshop, we are tracking the principle of voluntary agreement."*

  This allows you to manage the room without undermining your co-facilitator, while subtly signaling that the "machinery" has limits.
