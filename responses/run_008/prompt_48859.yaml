      *   **The "Traditional" Bridge:** How to make the aunts happy? Focus on *care* and *support*. Even if joy is just relief, relieving each other's burdens is a noble act. Love as *service* rather than *consumption*.
      *   **Closing:** The actual toast. Raise a glass to... what? Not "happiness." To "peace," "quiet," "less suffering."
