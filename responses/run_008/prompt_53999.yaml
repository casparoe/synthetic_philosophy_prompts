  6.  **Developing the Step-by-Step Plan:**

      *   **Prep:** 18 Cards (10 Green, 8 Red). Two specific orderings. Candy. Scoreboard.
      *   **Round 1 (The Lock-in):** Order G-G-R-R-R... (Truth = High). Cascade High forms.
