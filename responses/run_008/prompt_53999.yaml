answer: |-
  Here is a complete lesson plan designed for an 80-minute section. It prioritizes the *experience* of the cascade over the derivation, using a framing that avoids the standard "Urn A/Urn B" textbook trope.

  # Game Title: "The IPO Cascade"

  **Framing:** Instead of colored urns, students are early investors in a tech startup. The startup is either **VIABLE (V)** or **DOOMED (D)**. Each student receives an "Insider Tip" (private signal) that is noisy but informative. They must publicly decide to **INVEST** or **PASS**.

  **Materials:**
  *   18 Index Cards (Green on one side, Red on the other).
  *   Candy (e.g., Hershey's Kisses) or Participation Points.
  *   A whiteboard for tracking public history.
  *   Two pre-arranged "Decks" (specific orders of the same 18 cards).

  **Signal Structure (Keep this on the board):**
  *   **Accuracy:** Tips are correct 2/3 of the time.
      *   If **VIABLE**: 2 Green Tips, 1 Red Tip in the bag.
      *   If **DOOMED**: 2 Red Tips, 1 Green Tip in the bag.
  *   **Payoff:** Correct decision = 2 candies. Incorrect = 0.
  *   **The Rule of Thumb:** If the public history shows **two more** of one choice than the other (e.g., 2 more INVESTs than PASSes), ignore your private tip and follow the crowd. (This is the Bayesian threshold for 2/3 accuracy).

  ---

  ## Part 1: Setup & Round 1 (25 mins)

  **1. The Hook (5 mins)**
  Tell them: *"We are going to test market efficiency. You are venture capitalists. You want to maximize your candy. You cannot talk to each other. You can only see what the person before you decided."*

  **2. The Deal (5 mins)**
  *   **Truth:** The Startup is **VIABLE**.
  *   **Deck Composition:** 12 Green (Good) Cards, 6 Red (Bad) Cards. (Skewed toward truth to make the wrong cascade frustrating).
  *   **Sequence (Pre-arranged):** **G, G, R, R, R, R, G, G...**
      *   *Why:* The first two players get Green. They Invest.
      *   Player 3 gets Red. Sees 2 Invests. Math says: 2 Public V vs 1 Private D = Tie. (Tell them to follow private signal on ties to delay cascade slightly, or follow herd to speed it up. Let's say **follow herd on ties** for a stronger cascade).
      *   Player 3 Invests.
      *   Player 4 gets Red. Sees 3 Invests. **Cascade Locks.** Everyone after Invests, regardless of their Red card.
  *   **Execution:** Hand out cards face down. Students stand in a line or remain seated in a fixed order. One by one, they announce "Invest" or "Pass." You mark tally on the board.
  *   **Reveal:** At the end, reveal the True State (VIABLE) and have them flip their cards.
  *   **The Sting:** Point out the students with Green cards who got candy, and the students with Red cards who *lost* candy because they followed the herd. Ask the first person who had a Red card but Invested: *"Did you feel like you were making a mistake?"* (They should say: "No, mathematically it was the right call.")

  ## Part 2: Round 2 - Path Dependence (20 mins)

  **1. The Reset (5 mins)**
  Collect all cards. Tell the class: *"I am not changing the cards. I am not changing the ratio. I am not changing the truth. The startup is still VIABLE. There are still 12 Green and 6 Red cards in this stack."*

  **2. The Shuffle (5 mins)**
  *"I am simply changing the order in which you receive them."*
  *   **Sequence (Pre-arranged):** **R, R, G, G, G, G, G, G...**
      *   *Why:* The first two players get Red. They Pass.
      *   Player 3 gets Green. Sees 2 Passes. **Cascade Locks (DOOMED).**
      *   Everyone after Passes, even though the majority of cards in the room are Green.
  *   **Execution:** Redistribute the *exact same physical cards* to the *exact same students*, but in the new order. (Tip: Pre-stack the deck before class; just deal from the top).
  *   **Reveal:** Reveal the True State (VIABLE).
  *   **The Confrontation:** The class now has the **exact same aggregate information** (12 Greens, 6 Reds) but has reached the **opposite consensus** (All Pass vs. All Invest).
  *   **Ask:** *"Who feels angry that they lost candy this round compared to Round 1?"* This emotional reaction is the learning objective.

  ## Part 3: Round 3 - The Information Market (20 mins)

  **1. The Twist (5 mins)**
  *"In real markets, you can buy research. In this round, before you make your choice, you may raise your hand and pay me **1 Candy** to peek at the **private card of the person immediately before you**."*
  *   **Cost:** 1 Candy (50% of potential winnings).
  *   **Visibility:** The class sees you pay (public action), but only you see the card (private info).
  *   **Sequence:** Use a mixed order where the cascade is fragile (e.g., G, R, G, R...).

  **2. Play & Observe (10 mins)**
  *   **Expected Behavior:**
      *   Early players (no history) won't buy; their signal is enough.
      *   Mid players (tie history) might buy to break the tie.
      *   Late players (strong cascade) should **not** buy. If the herd is strong, one extra signal won't change their decision, so the purchase is wasted money.
  *   **The Externality:** If a student *does* buy, sees a contrary signal, and breaks the herd, they pay the cost, but **everyone behind them benefits** from the corrected path. They socialize the benefit but privatize the cost.

  **3. Scoring (5 mins)**
  Tally who ended up with the most candy. Usually, the "free riders" who waited for others to break the cascade win the most.

  ---

  ## Part 4: The Debrief (15 mins)

  Do not lecture. Map their experience to the formal model using the whiteboard.

  **1. Map the Moments**
  *   **Private Signal:** "The card in your hand." (Emphasize: This is the only thing you know for sure about the world).
  *   **Public Action:** "Your announcement." (Emphasize: This is a noisy signal of your card. If you followed the herd, your action told us *nothing* about your card).
  *   **The Lock-in Point:** Identify the exact student where the cascade started (e.g., Student 3 in Round 1). Ask them: *"If I gave you $1000 to choose against the herd, could you justify it?"* (Answer: No, because given the public history, the herd is more likely to be right than your single card).
  *   **Path Dependence:** Point to the two tally sheets from Round 1 and 2. *"Same data. Different truth. This is why history matters more than evidence in social learning."*

  **2. The Information Externality**
  *   Ask the students who bought info in Round 3: *"Why did you buy?"* (Usually: "I was unsure.")
  *   Ask the students behind them: *"Did you benefit from their purchase?"* (Yes, their decision was more informed).
  *   **Conclusion:** *"Rational agents under-invest in information because they don't get paid for the value their choice provides to others. This leads to fragile cascades."*

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. "Leaking" Signals**
  *   *Risk:* A student says "I got a Red but..." or makes a face.
  *   *Fix:* Enforce a "Poker Face" rule. If they leak, they forfeit candy. Collect decisions on slips of paper if voices are too revealing, though verbal announcements build tension better.

  **2. The "Hero" Contrarian**
  *   *Risk:* A student sees a cascade and chooses against it just to "break the game" or prove a point, knowing they will lose candy.
  *   *Fix:* Pre-empt this. *"This is not a game of rebellion. It is a game of maximization. If you choose against the math to make a point, you are failing the assignment."* If they do it anyway, use it in debrief: *"This is a social preference for uniqueness. In the model, you are fired. In reality, you might be a visionary—or unemployed."*

  **3. Math is Too Fast/Slow**
  *   *Risk:* Students get bogged down calculating posteriors.
  *   *Fix:* Give them the **"Rule of 2"** on the board. *"If the public tally differs by 2, your card doesn't matter."* This heuristic is accurate enough for 2/3 signal precision and keeps the game moving.

  **4. The "Same Cards" Skepticism**
  *   *Risk:* Students think you swapped the decks in Round 2.
  *   *Fix:* Make a show of counting the Greens and Reds aloud after Round 1 before shuffling for Round 2. *"12 Greens. 6 Reds. Watch me shuffle. Watch me deal."*

  ---

  ## Limitations: The "Two-Minute Bridge"

  At the very end, acknowledge what the game *failed* to capture. This is crucial for a Social Epistemology course.

  **Say this:**
  *"In this game, the cost of being wrong was 2 candies. The cost of being a contrarian was zero, other than losing the candy. In the real world—scientific publishing, financial markets, corporate boards—the payoffs are asymmetric.*

  *If you follow the herd and you're wrong, you can say 'Everyone else made the same mistake.' You keep your job. If you go against the herd and you're wrong, you look incompetent. This is **Reputational Herding**.*

  *In our game, cascades happened because of **Information** (you didn't know enough). In reality, cascades happen because of **Incentives** (you know the truth, but you can't afford to say it). Next week, we'll discuss how to fix institutions where telling the truth is career suicide."*

  ---

  ## Avoiding Textbook Pattern-Matching

  To prevent students from Googling "Urn Experiment" during class:
  1.  **Terminology:** Never use "Urn," "Ball," "Draw," or "Bayes." Use "Startup," "Tip," "Invest," and "Odds."
  2.  **Visuals:** Do not draw the tree diagram on the board until the debrief. Keep the board focused on the Tally Sheet (Invest vs. Pass).
  3.  **Framing:** Present it as a "Market Simulation" first, epistemology second. Let them feel the market failure before you label it "epistemic."

  ## TA Prep Checklist
  *   [ ] **Deck 1:** 12 Green, 6 Red. Order: G, G, R, R, R, R, G, G, G, G, G, G, R, R, G, G, R, R.
  *   [ ] **Deck 2:** Same cards. Order: R, R, G, G, G, G, G, G, R, R, R, R, G, G, G, G, R, R.
  *   [ ] **Candy:** ~100 pieces (enough for 2 per student per round + buying costs).
  *   [ ] **Board:** Draw a Tally Table (Round | Invest | Pass | True State).
  *   [ ] **Script:** Memorize the "Rule of 2" explanation so you don't fumble the math.
