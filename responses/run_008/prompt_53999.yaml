          *   *Wait, prompt says:* "peek at one extra private signal before choosing."
          *   *Okay:* You pay. You see a random other player's card (or the immediate predecessor's). You still only announce your Choice.
          *   *Why is this an externality?* Because if you buy info, you might *not* follow the herd. If you break the herd, you help everyone behind you. But you pay the cost. Hence, under-investment in information.
          *   *Implementation:* In Round 3, before making a choice, a student can raise a hand and pay 1 candy. They get to look at the *immediate predecessor's* card.

  4.  **Addressing the "Textbook Pattern-Matching" Constraint:**

      *   Don't call them Urn A and Urn B.
      *   Don't use Red/Blue balls.
      *   Use "Algorithm A vs Algorithm B" or "Investment High vs Low."
      *   Let's go with **"Crypto Token: Moon or Doom"**. It resonates with undergrads.
