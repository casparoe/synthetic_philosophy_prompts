      *   Honest about (3)? Yes.
      *   Don't go easy? Yes.

      *(Self-Correction on Severity)*: Is (3) vs (1) fatal? If I believe intuitions are seemings, but they vary, I can say "One group is wrong." But (4) says "Set them aside." Why set them aside if they are seemings? Because we don't know which is right. But (3) says "can't be debunked... because not result from bias." If variation is due to culture, that *is* a bias source. So (3) denies the mechanism that (1) asserts. Yes, this is severe.

      *(Refining the Fix)*: The fix isn't necessarily to drop "seemings" entirely (Williamson defends seemings but rejects the X-Phi challenge differently). The fix is to drop the "immune to bias" clause in (3). You can keep "seemings" but admit they are *fallible* and *sensitive to context*. But the user says "not the kind of thing that results from bias." That specific clause is the problem.

