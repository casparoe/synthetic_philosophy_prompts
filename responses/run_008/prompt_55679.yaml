          *   *Severity:* Low/Moderate.

      *   **Tension C: (4) vs. (6).**
          *   (4) Calibration Rule: Where they vary, discard.
          *   (6) Restrictionist: Restrict reliance to domains where unreliability has *actually been shown*.
          *   *Conflict:* These actually look consistent. (6) explains the scope of (4). (4) is the rule, (6) is the scope (don't apply the rule globally, only where data exists).
          *   *Severity:* Low (Apparent tension only).

      *   **Tension D: (4) vs. (7).**
          *   (4) says if variation is demonstrated, set aside.
          *   (7) says keep using Gettier/Fake Barn cases conservatively.
          *   *Conflict:* Have Gettier cases shown variation? Some X-Phi studies say yes (Nagel/Stich), some say no. If the user believes (1) variation is real "at least to some extent," does that cover Gettier cases? (7) implies we *keep* using them. (4) implies if variation is found, we *stop*.
          *   *Severity:* Moderate. Depends on the empirical status of Gettier cases specifically.

      *   **Tension E: (3) Internal Coherence.**
          *   (3) claims intuitions "can't be debunked the way ordinary biases can, because they're not the kind of thing that results from bias in the first place."
          *   But (1) & (2) admit variation based on culture/SES. Culture/SES are paradigmatic sources of bias/irrelevant influence.
          *   If culture affects them, they *are* sensitive to irrelevant factors. If they are sensitive to irrelevant factors, calling them "immune to bias" in (3) is misleading or false.
