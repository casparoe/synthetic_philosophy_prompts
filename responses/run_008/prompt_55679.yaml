prompt: |-
  i'm taking a seminar this semester on experimental philosophy and i have to write up a short position statement on intuitions for thursday, and before i do that i want a sanity check on whether the stuff i actually believe fits together. here's the set:

  (1) i believe the empirical results from roughly the weinberg/nichols/stich era — that epistemic intuitions vary across cultural and socioeconomic groups, at least to some extent. (2) i'm also honest enough to know some of those results haven't replicated great, so my attitude is: the variation is real but its extent is genuinely up in the air. (3) i'm a big believer in the old-school picture that intuitions are a distinctive kind of evidence — they're intellectual seemings, sui generis, not just beliefs or judgments we happen to have. on that view they can't be debunked the way ordinary biases can, because they're not the kind of thing that results from bias in the first place. (4) here's my proposal for what to do about the cross-cultural stuff: use a calibration rule — where intuitions demonstrably vary across groups, treat them as unreliable and set them aside; where they're uniform across groups, keep relying on them. (5) i also think there's no principled difference between the intuitions of professional philosophers and those of ordinary folk — philosophers' case verdicts are just one more data point, not a privileged class. (6) but i'm not a radical about it: i lean restrictionist rather than eliminationist — the right move is to restrict our reliance on intuitions to the domains where unreliability has actually been shown, not to chuck them wholesale on suspicion alone. (7) finally, in epistemology proper i think we should keep using the classic thought experiments — gettier cases, fake barn cases, and so on — but we should rely on them conservatively: trust the method only where we've verified its reliability.

  what i'd like from you: go through these and tell me which pairs are actually in tension, which only look like they are, and for the real ones say how severe the tension is and what the cheapest fix would be and what it costs me. then tell me which single revision would clean up the most, since i have to hand this in and can't rewrite my whole view. one thing i can't tell from the inside: whether my (3) is doing real work in my overall position or is just something i say because i like the view — be honest about that too. please rank the tensions by severity rather than listing them all as equally bad, don't go easy on it, and don't assume i'm more attached to any one of these than the others.
