  3.  **Evaluate Coherence & Tensions:**

      *   **Tension A: (3) vs. (1)/(2)/(4).**
          *   (3) says intuitions are *sui generis* seemings, *not* products of bias, and therefore *can't be debunked the way ordinary biases can*.
          *   (1)/(2) says empirical evidence shows they vary by culture/SES (which is usually interpreted as evidence of bias/irrelevant influence).
          *   (4) says if they vary, treat them as *unreliable* and set them aside.
          *   *Conflict:* If (3) is true (they are pure intellectual seemings immune to bias-based debunking), why does cultural variation (1) make them unreliable (4)? Usually, the X-Phi challenge relies on the premise that variation implies sensitivity to irrelevant factors (bias). If (3) denies they are subject to bias, the move from "variation exists" to "they are unreliable" becomes difficult to justify *within the framework of (3)*. If they are pure seemings, why would culture change them? If culture changes them, are they really pure seemings immune to bias?
