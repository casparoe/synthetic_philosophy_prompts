      *   *Resolution:* In hypothermia, the standard of care is *to attempt resuscitation*. Therefore, the loss is not "permanent." In DCD, the standard of care is *not to attempt resuscitation*. Therefore, the loss *is* "permanent."
      *   *Principle:* **Death is the permanent cessation of vital functions, where "permanent" is defined by the absence of a plan or capacity for restoration.**

  6.  **Addressing the ECMO Case:**
