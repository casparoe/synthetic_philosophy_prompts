      *   **Identify the Core Principle:** The distinction between **Irreversible** (cannot be reversed) and **Permanent** (will not be reversed).
      *   **Explain the DCD vs. Lazarus resolution:** It hinges on the *decision to intervene*. In DCD, the cessation is permanent because intervention is ruled out. In Lazarus, it wasn't permanent because it reversed spontaneously (or intervention was planned).
