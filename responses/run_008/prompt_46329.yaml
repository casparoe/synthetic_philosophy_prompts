      *   *Lazarus:* Cessation wasn't permanent. Not Dead (yet).
      *   *DCD:* Cessation is permanent *because* we won't intervene. Dead.
      *   *Hypothermia:* Cessation isn't permanent *because* we will intervene (rewarming). Not Dead.
      *   *Pituitary:* Residual function doesn't equal integration. Dead.
      *   *Anencephaly:* Brainstem works (integration). Not Dead.

