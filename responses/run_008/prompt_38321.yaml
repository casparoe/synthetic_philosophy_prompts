  It is a privilege to assist in this reconstruction. You are asking me to reverse-engineer a heuristic from a specific intellectual lineage: the hard-nosed population genetics of the mid-20th century, filtered through the skepticism that Gould and Lewontin later codified. Your supervisor was not merely applying a definition; he was applying a *burden of proof*.

  Based on the seven verdicts you recorded, I have reconstructed his decision matrix. It is not a single rule, but a hierarchy of three tests. A trait must pass them in order to earn the label "Adaptation."

  ### The Reconstructed Rules

  **Rule 1: The Evidence Threshold (The "Smoking Gun")**
  *   **Criterion:** Is there direct experimental evidence of differential survival/reproduction (Peppered Moth) or strong ecological covariance of allele frequency with a specific selective pressure (Sickle-Cell)?
  *   **Verdict:** If **Yes**, it is an **Adaptation**. (Stops here).
  *   **Verdict:** If **No**, proceed to Rule 2.

  **Rule 2: The Constraint Test (The "Spandrel Check")**
  *   **Criterion:** Can the trait be fully explained as a necessary consequence of developmental architecture (Male Nipples) or phylogenetic inertia/vestige (Goosebumps)?
  *   **Verdict:** If **Yes**, it is a **Byproduct**. (Stops here).
  *   **Verdict:** If **No**, proceed to Rule 3.

  **Rule 3: The Cost-and-Pressure Test (The "Fever Rule")**
  *   **Criterion:** Is the trait metabolically costly *and* is there a clear, identifiable environmental pressure that the cost is purchasing resistance against?
  *   **Verdict:** If **Yes** (Cost + Clear Enemy), it is an **Adaptation** (Fever).
  *   **Verdict:** If **No** (Cost + Vague/Disputed Benefit), it is a **Byproduct/Story** (Chin, Orgasm).

  **The Crucial Nuance:**
  Your supervisor did not accept "Cost" alone as proof of adaptation. He accepted Cost *plus* a clear antagonist. Fever is expensive, but it fights pathogens (a clear antagonist). The human chin is structurally costly to maintain, but "sexual signaling" is a narrative, not a measurable pressure like malaria or predation. This distinction is the key to unlocking the new cases.

  ***

