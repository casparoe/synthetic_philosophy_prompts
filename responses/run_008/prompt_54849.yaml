answer: |-
  # Q&A Prep Sheet: Evolution of Cooperation Workshop

  **Presenter:** Early-Career Researcher (Behavioral Science)
  **Thesis:** Direct reciprocity (iterated PD) is overrated; cooperation is driven by Partner Choice, Reputation, and Payoff Structure. Human one-shot cooperation is a default disposition, not just a heuristic error.
  **Audience:** Behavioral Ecologists (Inclusive Fitness/Field), Economists (Repeated Game Theory), Philosopher of Biology.

  ---

  ### 1. The "Mathematical Reducibility" Objection (Economists)
  **The Objection:** "You're drawing a distinction without a difference. Mathematically, indirect reciprocity and partner choice are just infinitely repeated games with a larger state space and more players. The Folk Theorem tells us any feasible payoff vector can be sustained as an equilibrium if agents are patient enough. Why do we need new mechanisms when the existing math covers your 'market' and 'reputation' cases?"

  **The Reply:**
  "I grant the mathematical reducibility. If you expand the state space enough, you can model almost anything as a repeated dyad. But evolution doesn't select for mathematical equilibria; it selects for mechanisms that are computationally tractable and robust to error. A model requiring agents to track infinite histories is biologically distinct from one requiring simple partner switching based on local cues. My claim isn't that the *equilibria* differ, but that the *evolutionary pathways* and *cognitive requirements* do. Treating partner choice as mere repetition obscures the fact that exit options change the selection pressure on the strategies themselves. We need mechanisms that explain how agents actually find those equilibria in the wild, not just that the equilibria exist."

  *   **Soft Spot:** You cannot deny the mathematical equivalence. If you try, you lose the economists immediately.
  *   **Concession:** Concede that the Folk Theorem is mathematically sound but argue it is biologically permissive (predicts everything, explains nothing specific).
  *   **Epistemic Status:** **Contested.** Economists generally view mechanisms as implementation details; biologists view them as the primary unit of selection.

  ### 2. The "Cognitive Load/Anthropomorphism" Objection (Ecologists)
  **The Objection:** "You're leaning heavily on reputation and audience effects. In my work with [primates/bats], we see cooperation without evidence that animals track third-party reputations. That requires theory of mind or complex bookkeeping. Aren't you just projecting human social psychology onto non-human animals to make your model work?"

  **The Reply:**
  "That's a crucial constraint. I'm not arguing that vampire bats run a credit score system. Reputation can be mediated by simple behavioral cues—like eavesdropping on aggressive interactions or observing grooming networks—without requiring mental state attribution. However, I concede that rich reputation systems are likely human-specialized. My argument is that where partner choice exists, even simple 'walk away' rules generate cooperation without iterated dyads. For non-humans, I agree direct reciprocity and kin selection likely do more heavy lifting than reputation. My model is primarily for humans, with cautious extension to highly social mammals."

  *   **Soft Spot:** You risk alienating the ecologists if you insist reputation is universal.
  *   **Concession:** Admit that robust reputation tracking is likely rare outside humans/primates. Scale back the claim for non-humans.
  *   **Epistemic Status:** **Contested.** Evidence for reputation in non-humans is mixed and species-specific. Direct reciprocity in wild populations is demonstrated (e.g., bats) but its stability is debated.

  ### 3. The "Direct Reciprocity Exists" Objection (Ecologists)
  **The Objection:** "We have longitudinal data on vampire bats showing contingent blood-sharing that looks exactly like Tit-for-Tat. If you say direct reciprocity is 'overrated' or 'insufficient,' are you denying these data? It seems you're throwing out a solved puzzle just to propose a new one."

  **The Reply:**
  "I'm not denying the data; Carter and Wilkinson's work is excellent. I'm challenging the *generality* of the inference. Direct reciprocity is incredibly fragile to noise and error in the wild. It works in bats because roost membership is stable and monitoring is cheap. In most other contexts, partner turnover is too high for iterated PD to stabilize cooperation alone. Direct reciprocity is a *possible* mechanism, but I'm arguing it's not the *default* explanation for unrelated cooperation. We should treat it as a special case requiring specific ecological conditions, not the null model."

  *   **Soft Spot:** Dismissing the bat data is suicide in this room.
  *   **Concession:** Explicitly validate the bat data as a proof-of-concept, but argue it represents a narrow ecological niche.
  *   **Epistemic Status:** **Settled vs. Contested.** It is settled that direct reciprocity occurs in some species. It is contested how widespread it is relative to other mechanisms.

  ### 4. The "Psychological One-Shot" Objection (Economists)
  **The Objection:** "Your evidence for 'default cooperation' relies on lab games. But subjects aren't naive. They bring heuristics from outside the lab where interactions *are* repeated. You haven't proven an adaptation for one-shot cooperation; you've proven that people can't turn off their repeated-game software. It's a spillover error, not a strategy."

  **The Reply:**
  "That is the standard 'mismatch' hypothesis, and it's a strong null. However, framing effects show people *can* distinguish contexts. When we explicitly prime 'one-shot' or 'anonymous' conditions, cooperation drops but doesn't vanish, and punishment persists. More importantly, from an evolutionary standpoint, a heuristic that cannot be switched off *is* the adaptation. If the cost of mistakenly cooperating in a one-shot game is lower than the cost of mistakenly defecting in a repeated one, selection favors the 'always cooperate' default. Whether it's a bug or a feature, it functions as a distinct strategy in the population."

  *   **Soft Spot:** It is very hard to prove a behavior isn't a spillover heuristic.
  *   **Concession:** Acknowledge you cannot definitively rule out spillover, but argue the functional outcome is the same.
  *   **Epistemic Status:** **Highly Contested.** This is the core debate between evolutionary psychology (adaptation) and behavioral econ (heuristic error).

  ### 5. The "Inclusive Fitness Null" Objection (Ecologists)
  **The Objection:** "You're focusing on unrelated individuals. But in most cooperative breeding and food sharing, kin selection explains the variance. By focusing on reciprocity and partner choice, aren't you ignoring the primary driver of cooperation in nature?"

  **The Reply:**
  "Absolutely not. Kin selection is the bedrock. My thesis specifically addresses the residual variance *after* relatedness is accounted for. In human societies, and some animal ones, we see high cooperation among non-kin that kin selection can't touch. I'm not proposing these mechanisms replace inclusive fitness; I'm proposing they are the necessary add-ons to explain cooperation in large, mobile groups where $r \approx 0$. If we only look at kin, we miss the evolution of human hyper-sociality."

  *   **Soft Spot:** If you imply kin selection is insufficient for *most* animal cooperation, you'll lose the room.
  *   **Concession:** Reiterate that kin selection is the primary explanation for *most* animal cooperation; your model is for the non-kin exception (which includes humans).
  *   **Epistemic Status:** **Settled.** Kin selection is the dominant explanation for animal cooperation. The puzzle is specifically non-kin cooperation.

  ### 6. The "Proximate vs. Ultimate" Objection (Philosopher)
  **The Objection:** "You're sliding between levels of analysis. Sometimes you talk about payoff structures (ultimate), sometimes about psychological dispositions to punish (proximate). Are you arguing that the *evolution* of cooperation is driven by partner choice, or that the *psychology* of cooperation is driven by it? You can't use one to explain the other without a bridge."

  **The Reply:**
  "That's a fair critique of the framing. The argument is ultimate: partner choice and reputation create the selection pressure that shapes the proximate psychology. The reason humans have a 'default' disposition to cooperate is because our ancestors lived in environments with high partner choice. I am using the proximate evidence (lab games) to infer the ultimate history. I need to be clearer that the psychology is the *outcome* of the ecological structure, not the mechanism of the evolution itself."

  *   **Soft Spot:** Interdisciplinary talks often mash these levels.
  *   **Concession:** Promise to clarify the causal arrow in the slides (Ecology $\to$ Selection $\to$ Psychology).
  *   **Epistemic Status:** **Settled Principle.** The distinction is clear in theory, often muddy in practice.

  ### 7. The "Search Cost" Objection (General/Economists)
  **The Objection:** "Partner choice assumes you can find a better partner. In sparse populations or high-stakes environments, search costs are prohibitive. If I can't find a new partner, I'm stuck in a dyad. Doesn't your model collapse back to direct reciprocity when the market is thin?"

  **The Reply:**
  "Yes, and that's a feature, not a bug. My model predicts a spectrum. Where search costs are low (human social networks), we see market dynamics and high cooperation. Where search costs are high (isolated dyads), we should see cooperation collapse or revert to fragile direct reciprocity. This actually generates a testable prediction: cooperation rates should correlate with social mobility and network density, not just interaction frequency."

  *   **Soft Spot:** If search costs are always high in the ancestral environment, the model fails.
  *   **Concession:** Acknowledge that partner choice is contingent on ecological "market thickness."
  *   **Epistemic Status:** **Contested.** Theorists disagree on the magnitude of ancestral search costs.

  ---

  ### The Feared Question (The "Stability" Trap)
  **The Question:** (Likely from an Economist or Skeptical Philosopher)
  "You argue that conditional cooperation and costly punishment are default human strategies. But in a mixed population, defectors who *don't* pay the cost of punishment should outcompete punishers. Second-order free riders exploit the punishers. How is this disposition evolutionarily stable without invoking group selection, which I know this room is allergic to?"

  **The Best Available Answer:**
  "This is the hardest problem in the field, and I don't have a closed-form solution. There are three possibilities, none fully settled. One: Punishment is cheap in humans due to coordination (coalitional punishment), changing the payoff structure. Two: There is assortative matching; cooperators cluster, isolating defectors. Three: We are seeing a multi-level selection process where groups with punishers outcompete groups without them. I am personally agnostic between assortative matching and weak group selection, but I agree that simple individual selection on a costly punishment trait is unstable. I'm arguing that the *phenomenon* exists, not that we have a consensus on the *stability mechanism*."

  *   **Why this answer:** It avoids bluffing. It acknowledges the "second-order free rider" problem is a major theoretical hurdle. It signals respect for the inclusive fitness constraints of the ecologists while leaving the door open for the cultural/group selection arguments the philosopher might appreciate.
  *   **Epistemic Status:** **Highly Contested.** This is the central unresolved tension in the evolution of altruism. Admitting uncertainty here builds more credibility than a shaky defense.

  ---

  ### General Epistemic Guidance for the Q&A
  *   **Direct Reciprocity in Wild:** Be careful not to say it *doesn't exist*. Say it is *rare* or *fragile* compared to textbook models. The bat data is real; the generalization is the weak point.
  *   **One-Shot Adaptation:** Be clear this is your **hypothesis**, not consensus. The "spillover heuristic" view is equally mainstream. Frame your evidence as "consistent with adaptation" rather than "proving adaptation."
  *   **Terminology:** When speaking to Economists, use "Equilibrium Selection." When speaking to Ecologists, use "Selection Pressure" and "Fitness Currency." When speaking to the Philosopher, distinguish "Model" from "Mechanism."
  *   **Concession Strategy:** If an Ecologist brings field data that contradicts your model, concede the model's boundary conditions immediately. "My model applies to high-mobility social networks, not stable roosts." This shows you understand the biology better than if you fight the data.
