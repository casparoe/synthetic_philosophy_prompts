answer: |-
  # Quiz: What's Your Reason For Feeling That Way?

  We talk a lot about what we *should* believe, desire, or feel. Usually, we think this depends on the object itself: you believe what's true, desire what's good, and admire what's excellent. But life is messy. Sometimes external pressures—money, threats, social benefits—push us toward mental states that don't match the object.

  Philosophers call this the "Wrong Kind of Reasons" problem. But we aren't using jargon today. Instead, we're going to walk through ten concrete scenarios. Your job is to pick the answer that best matches your gut reaction. Don't overthink the theory; just pick what sounds right to you.

  ***

  ### 1. The Million-Dollar Belief
  A mysterious benefactor offers you $10 million if you can genuinely believe, right now, that the moon is made of green cheese. They have a perfect mind-reading device, so you can't fake it. You know the moon is rock, not cheese. Does the money make it sensible for you to believe the moon is cheese?
  *   **A.** Yes. If the payoff is high enough, it becomes rational to hold the belief, even without evidence.
  *   **B.** No. The money gives you a reason to *try* to believe, or to act as if you believe, but not to actually believe it.
  *   **C.** No. The money gives you a reason to bring it about that you believe (maybe through hypnosis), but it doesn't count directly on the belief itself.

  ### 2. The Useful Desire
  You need to collect vintage stamps to impress a potential business partner. The stamps themselves are boring to you, and you have no interest in them other than the deal. Do you have a reason to *desire* the stamps?
  *   **A.** Yes. The benefit of the deal makes desiring the stamps a sensible state for you to be in.
  *   **B.** No. You have a reason to *acquire* the stamps, but desiring them is irrelevant. Just buy them.
  *   **C.** Sort of. You have a reason to cultivate a desire for them, but the desire itself isn't directly supported by the money.

  ### 3. The Demon's Threat
  An evil demon threatens to destroy the world unless you admire a muddy puddle. The puddle is ordinary mud. If you admire it, the world is saved. Does the threat make the puddle admirable?
  *   **A.** In a way, yes. The stakes make admiration the correct response, even if the mud is ordinary.
  *   **B.** No. The threat makes admiring the puddle the *smart* thing to do, but the puddle itself remains unadmirable.
  *   **C.** This shows that "admirable" can't just mean "what we should admire." The definition is broken.

  ### 4. The Unfunny Joke
  Your friend tells a joke that you find completely flat. However, laughing would cheer them up during a depression. Do you have a reason to be *amused*?
  *   **A.** Yes. There are two different kinds of reasons for amusement: one about funniness, one about kindness.
  *   **B.** No. You have a reason to *laugh*, but being actually amused is impossible to command and not what's required.
  *   **C.** Yes, but only in the sense that you should try to get yourself into a state of amusement.

  ### 5. The Impossible Command
  Imagine a rule that says: "You ought to believe X," but human psychology makes it impossible for you to believe X directly on command (you need evidence). Does this rule make sense?
  *   **A.** Yes. You can have a reason to believe something even if you can't switch it on like a light.
  *   **B.** No. If you can't choose it directly, the reason must be for something you *can* choose, like gathering evidence.
  *   **C.** It suggests that linking "ought" to mental states like belief is a mistake in the first place.

  ### 6. The Healthy Grudge
  A friend betrayed you. You feel resentful. However, holding onto resentment is bad for your health. Does your health give you a reason to drop the resentment?
  *   **A.** Yes. It's a genuine reason to stop feeling resentful, full stop.
  *   **B.** No. It's a reason to *act* forgiving, or to work on moving on, but not a reason that targets the resentment directly.
  *   **C.** It's a reason to bring it about that you no longer resent them, perhaps by reframing the event.

  ### 7. Evidence vs. Cash
  Compare two reasons for believing a truth: (1) You have solid proof, and (2) You get paid to believe it. Are these reasons the same kind of thing?
  *   **A.** They are fundamentally different. One makes the belief fit the world; the other makes the belief good for you.
  *   **B.** They are the same kind of thing: considerations that count in favor of holding the belief.
  *   **C.** Only the proof is a real reason for belief. The payment is a reason for action.

  ### 8. Defining "Good"
  Some people say: "Something is good if and only if we have reason to desire it." Does the stamp case (Question 2) or the demon case (Question 3) worry you about this definition?
  *   **A.** No. We just have to admit that pragmatic benefits (like money or safety) count as reasons to desire things.
  *   **B.** Yes. It shows we should only count reasons that relate to the object's features, not external benefits.
  *   **C.** Yes. It shows the whole project of defining "good" via "reasons to desire" is a dead end.

  ### 9. Indirect Strategies
  If you have a pragmatic reason to be in a certain mental state (like believing you will succeed to boost performance), how do you pursue it?
  *   **A.** I acknowledge the reason directly targets the state, even if I have to use tricks to get there.
  *   **B.** I acknowledge the reason targets my *actions* (like reading motivational books), not the state itself.
  *   **C.** I acknowledge the reason targets the *cultivation* of the state, which is distinct from both the state and the action.

  ### 10. The Saint and the Mercenary
  Person A believes the truth because they love evidence. Person B believes the truth because they are paid to. Both end up believing the truth. Are they equally rational?
  *   **A.** Yes. Both responded to reasons that support believing the truth.
  *   **B.** No. Only Person A responded to reasons proper to belief. Person B just got lucky.
  *   **C.** They are rational in different senses. Person A is epistemically rational; Person B is pragmatically rational.

  ***

  # Scoring Key

  Tally up your answers. You likely won't have a perfect straight line, so look for the *pattern* that dominates your choices.

  ### Mostly A's: The Bullet-Biter (Fitting-Attitude Defender)
  **Position:** You think reasons are reasons. If a consideration makes it sensible to have an attitude, it is a reason for that attitude, regardless of where it comes from.
  **The View:** You defend the "Fitting-Attitude" analysis of value by expanding what counts as a "reason." If a demon threatens you, admiration *is* the fitting response because the threat makes it so. You don't mind if pragmatic and evidential reasons look different; they both count in favor of the state.
  **Philosophical Kin:** Some classical pragmatists; certain unconstrained fitting-attitude theorists.

  ### Mostly B's: The Purist (Evidentialist/Right-Kind)
  **Position:** You draw a hard line. Reasons for mental states must connect to the *object* of that state (evidence for belief, value for desire). External benefits are reasons for *actions* (like trying to believe or acting as if), not the state itself.
  **The View:** You protect the integrity of the mind. Belief aims at truth; desire aims at value. Money can't change truth, so it can't be a reason for belief. It's a reason to *act*.
  **Philosophical Kin:** Evidentialists about belief; "Right-Kind Reasons" theorists.

  ### Mostly C's: The Cultivator (Modification View)
  **Position:** You see a middle ground. Pragmatic factors aren't reasons for the attitude *directly* (like evidence), but they aren't just reasons for unrelated actions either. They are reasons to *bring it about* that you have the attitude.
  **The View:** You distinguish between the state and the management of the state. The money is a reason to engage in self-manipulation or cultivation. It targets the attitude indirectly.
  **Philosophical Kin:** Proponents of the "modification strategy" or indirect normative accounts.

  ### Mix of A and C (Specifically on Q7/Q10): The Dualist (Hybrid/Disjunctive)
  **Position:** You answered "Yes" to pragmatic reasons counting for attitudes (like A), but you insisted in Q7 and Q10 that these reasons are *fundamentally different* from evidence/value reasons.
  **The View:** You accept both kinds of reasons but refuse to reduce one to the other. There are "pragmatic reasons for belief" and "epistemic reasons for belief," and they are distinct species.
  **Philosophical Kin:** Hybrid theorists; disjunctivists about normative reasons.

  ### Mostly C (Specifically on Q3/Q5/Q8): The Skeptic (Revisionist)
  **Position:** You kept selecting options that suggested the *framework* was the problem. If a threat makes admiration "fitting," you think that proves "fitting" is the wrong word to use, not that the threat counts as a reason.
  **The View:** You think the "Wrong Kind of Reasons" cases prove that we cannot define value or normativity in terms of attitudes. The analysis itself is mistaken.
  **Philosophical Kin:** Revisionists about value; critics of the buck-passing account.

  ### ⚠️ Important Caveats & Incoherent Combinations

  **The "Purist" vs. "Cultivator" Blur:**
  Be honest: this quiz cannot perfectly separate the **Purist (B)** from the **Cultivator (C)**. In practice, saying "I have a reason to act so I believe" (Purist) and "I have a reason to bring it about that I believe" (Cultivator) often result in the same advice. Philosophers debate whether this distinction is meaningful or just verbal. If you bounced between B and C, you hold a coherent position; the literature just hasn't settled which label fits best.

  **The "Dualist" Trap:**
  If you chose **A** on most questions but **C** on Question 7 (saying reasons are the *same* kind), you might be in a tough spot. Defending the Bullet-Biter view usually requires admitting that pragmatic and evidential reasons feel different. If you say they are identical *and* that money justifies belief, you have to explain why evidence still feels special. This isn't incoherent, but it is a hard hill to climb.

  **The "Impossible Command" Incoherence:**
  If you chose **B** on Question 5 ("If you can't choose it, no reason") but **A** on Question 1 ("Money makes belief rational"), you have a contradiction. You can't claim pragmatic reasons make belief rational while also claiming we can't have reasons for things we can't directly control. You'll need to decide if belief is voluntary or if reasons apply to involuntary states.

  **The Revisionist Outlier:**
  If you found yourself rejecting the premises of the questions entirely (e.g., "Admiration can't be threatened"), you lean **Revisionist**. Note that this position is the most radical: it doesn't solve the puzzle; it dissolves the board.
