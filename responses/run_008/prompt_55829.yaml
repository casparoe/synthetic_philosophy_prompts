  *(Self-Correction during drafting)*: I need to be careful not to debunk Sen entirely. His framework is still the dominant paradigm. The goal is to show where the *op-ed* simplifies Sen, not where Sen is wrong per se. The op-ed turns a nuanced capability approach into a blunt political weapon. I need to highlight that distinction.

  *(Refining the Ireland point)*: The op-ed says "Irish famine... they've got it wrong [calling it natural]". That part is actually consistent with Sen. The problem is using it to prove the democracy point, since Ireland was under UK rule. I need to make sure the user sees that distinction.

  *(Refining the "Political Crime" point)*: Sen uses moral language, but "political crime" is a legal/moral judgment. Sen prefers "failure of entitlement protection." I should note the shift from diagnostic to accusatory.

