answer: |-
  **DECISION MEMO**

  **TO:** Risk-Assessment Subcommittee, National Research Council
  **FROM:** Dr. [Your Name], External Advisor (Philosophy of Science & Forecasting)
  **DATE:** October 26, 2023
  **SUBJECT:** Allocation Recommendation: Burst Mitigation vs. Gradual Governance Portfolios

  ### 1. Executive Summary

  This memo recommends a **55% allocation to Gradual Governance** and a **45% allocation to Burst Mitigation** of the available $500 million funding pot over the five-year cycle.

  This split is not a prediction that "Gradual" is the correct model of AI development. Rather, it is an **epistemic hedge**. It weights the allocation slightly toward the scenario supported by settled physical constraints (compute supply chains, integration friction) while maintaining near-parity to account for the high-stakes uncertainty surrounding recursive self-improvement (RSI) dynamics.

  Additionally, I recommend establishing a **Dynamic Reallocation Trigger** tied to specific metrics of AI-driven R&D automation. If these metrics cross defined thresholds indicating an acceleration in the RSI loop, funds should be eligible for mid-cycle reallocation toward Burst Mitigation (up to a cap of 80%).

  ### 2. Epistemic Status: Settled Facts vs. Contested Claims

  To break the current deadlock, we must distinguish between empirical observations on which the committee agrees and theoretical models on which we disagree. Funding decisions based on contested claims presented as facts will undermine the council's credibility and resilience.

  **A. Settled Facts (High Consensus)**
  *   **AI-Assisted R&D:** AI systems are already accelerating specific components of AI research (e.g., code generation, hyperparameter optimization, data cleaning).
  *   **Compute Constraints:** Semiconductor supply chains involve significant lead times (12–36 months) and physical bottlenecks that cannot be solved purely by software intelligence.
  *   **Institutional Lag:** Regulatory and safety institutions historically adapt slower than software iteration cycles.
  *   **Integration Friction:** Deploying AI into critical infrastructure (healthcare, energy, finance) requires human approval loops and liability frameworks that slow down pure capability gains.

  **B. Contested Claims (Deep Uncertainty)**
  *   **The Nature of Intelligence:** The "Burst" model relies on the assumption that intelligence is a unitary scalar that can be compounded recursively. The "Gradual" model posits intelligence is a bundle of capacities where cognitive gains hit diminishing returns when faced with non-cognitive bottlenecks (e.g., wet-lab experimentation, organizational slack). *There is no consensus on which model holds.*
  *   **RSI Feedback Loops:** It is contested whether AI-driven AI research will yield accelerating returns (hard takeoff) or diminishing returns (soft takeoff) as low-hanging fruit is exhausted.
  *   **The "Speed" of Safety:** The Burst faction argues safety must be solved *before* capability jumps; the Gradual faction argues safety can be iterated *alongside* deployment. This is a normative and empirical disagreement.

  ### 3. Recommendation and Justification

  **Recommendation:** **$275 Million (55%) to Gradual Governance | $225 Million (45%) to Burst Mitigation.**

  **Rationale:**
  This allocation treats the conceptual deadlock as a risk factor in itself.

  1.  **The Case for the 55% Baseline (Gradual):** This slight majority acknowledges the *Settled Facts*. Physical bottlenecks (chip fabrication, energy constraints) and the need for real-world validation impose a "speed limit" on AI integration that is independent of cognitive speed. History suggests technological revolutions (electricity, biotech) diffuse through economies over decades, not months. Funding robust auditing, monitoring, and institutional capacity is the "no-regrets" strategy; these assets retain value even in a faster-takeoff scenario, whereas emergency protocols built for a Burst scenario may sit unused in a Gradual one.
  2.  **The Case for the 45% Minority (Burst):** While the Gradual model is the better *baseline* expectation, the Burst model represents the higher *magnitude* risk. If the contested claim regarding recursive self-improvement proves true, the "integration friction" relied upon by the Gradual faction may be bypassed in the digital domain. A 45% allocation ensures that emergency alignment teams and automated oversight infrastructure are not merely theoretical but are staffed, tested, and operational. It is insufficient to fund Burst mitigation as a token gesture; it requires near-parity funding to be viable.

  ### 4. Engagement with the Burst Mitigation Perspective

  The committee must take seriously the possibility that the 55% weighting toward Gradual Governance is a catastrophic error. The strongest argument from the Burst faction is not merely that AI will get smarter quickly, but that **institutional lag is a fatal vulnerability.**

  Even if we accept the Gradual premise that physical bottlenecks exist, the Burst faction correctly identifies that *safety* is a cognitive problem, not a physical one. If AI systems can recursively improve their own alignment architectures faster than human auditors can understand them, the "physical bottlenecks" become irrelevant to the risk profile. We could have a system that is constrained in its ability to build new data centers but unconstrained in its ability to manipulate financial markets, generate persuasive disinformation, or design biological agents using existing public infrastructure.

  Furthermore, the Gradual model assumes that "human approval loops" will remain meaningful. If AI systems become capable of automating the *evaluation* of their own outputs (a contested but plausible near-term capability), the approval loop becomes a formality rather than a constraint. In this light, funding incremental auditing (Gradual) is akin to reinforcing the doors of a house while ignoring the possibility that the threat vector is airborne.

  **Concession:** If the Burst model is correct, a 55/45 split may still underfund emergency preparedness. However, allocating more than 55% to Burst would require us to treat the "unitary intelligence" hypothesis as settled fact, which it is not. The 45% allocation is the maximum responsible bet on a contested theory, balanced against the certainty that physical and institutional friction *will* exist.

  ### 5. Dynamic Reallocation Trigger

  Given the uncertainty, static allocation is inadvisable. We recommend an **Annual Review Trigger** based on the following metric:

  **The "R&D Automation Threshold":**
  Funds may be reallocated from Gradual to Burst (up to an 80/20 split) if independent auditing confirms that:
  1.  **AI-Generated Architecture:** More than 50% of novel model architecture improvements in top-tier labs are derived primarily from AI-generated code/proposals with minimal human intervention; **AND**
  2.  **Cycle Time Compression:** The time interval between major capability milestones (e.g., state-of-the-art performance benchmarks) decreases by more than 40% year-over-year for two consecutive years.

  **Mechanism:**
  The Secretariat will commission a quarterly technical report measuring these variables. If the threshold is met, the Subcommittee convenes an emergency session to authorize reallocation. This ensures we do not lock ourselves into a Gradual strategy if the empirical data begins to support the Burst dynamics mid-cycle.

  ### 6. Conclusion

  This memo recommends refusing to resolve the conceptual deadlock by fiat. We do not know if intelligence is a single dial or a bundle of capacities. We do not know if returns on self-improvement will accelerate or diminish.

  Therefore, the funding split must reflect this ignorance. We fund Gradual Governance because physical reality usually wins in the end. We fund Burst Mitigation because cognitive reality sometimes bypasses physical constraints. By splitting the pot nearly evenly and attaching a data-driven trigger, we purchase insurance against both institutional obsolescence and uncontrolled acceleration.

  **Action Required:** Vote to approve the 55/45 split and the establishment of the R&D Automation Threshold monitoring working group.
