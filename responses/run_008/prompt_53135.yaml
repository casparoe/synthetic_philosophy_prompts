answer: |-
  Here is a complete lesson plan designed to execute Sen's Liberal Paradox exactly as you described. It relies on careful scripting of the role-players and strict facilitation of the "Constitutional Convention" to ensure the rules are ratified without theoretical contamination.

  # Session Plan: The Gala Ticket

  **Course:** Collective Choice Seminar (Year 2)
  **Time:** 80 Minutes
  **Students:** 14 (12 Voters, 2 Role-players)
  **Room:** Movable chairs (Arrange in a U-shape for the "Board," with two chairs at the open end for Milo and Juno).
  **Materials:**
  *   2 Role-Player Briefs (sealed envelopes).
  *   12 "Board Member" Packets (contains: 3 Outcome Cards, 2 Rule Ballots, 1 Final Decision Ballot).
  *   Whiteboard & Markers.
  *   A physical prop for the "Ticket" (an envelope).

  ---

  ## Part 1: The Scenario & Elicitation (0:00 – 0:25)

  **0:00 – 0:05: Setup**
  *   **Instructor:** "Welcome. Today we are the Board of Directors for a tiny firm. There are two employees, Milo and Juno. There is one spare ticket to the Industry Gala. It can go to Milo, go to Juno, or expire unused. Those are the only three outcomes. You must decide by the end of class. The RSVP is hard."
  *   **Action:** Invite the two pre-briefed students (Milo and Juno) to the front. Hand them their sealed envelopes. Give them 2 minutes to read and internalize. They are not to show the cards to anyone.

  **0:05 – 0:25: The Interview (Eliciting Preferences)**
  *   **Goal:** The Board must deduce preferences through dialogue. No tables, no rankings revealed.
  *   **Instructor:** "Board members, you need to understand their stakes before you decide how to decide. You may ask them questions. They must answer truthfully, but in character."
  *   **Facilitation:** If students ask "Rank these," forbid it. They must ask "How do you feel about X?"
  *   **Actor Instructions (Crucial for the Logic):**
      *   **Milo:** Must convey: 1. The gala is morally corrosive ($U$ is best). 2. He is protective of Juno ($M$ is better than $J$).
          *   *Sample Line:* "Look, that circuit is poison. Ideally, nobody touches it. But if someone has to go into the snake pit? I'd rather it be me getting bitten than Juno."
      *   **Juno:** Must convey: 1. She likes the gala ($J$ is good). 2. She gets more utility from Milo's discomfort ($M$ is best).
          *   *Sample Line:* "I'd have a nice time, sure. But have you seen Milo in a tux? He hates networking. If he goes, it's hilarious. I'd almost rather watch him squirm than go myself."
  *   **Check:** By minute 25, ensure the Board understands:
      *   Milo hates $J$ most.
      *   Juno loves $M$ most.
      *   Both prefer $M$ to $J$ (This is the Pareto key).

  ---

  ## Part 2: The Constitutional Convention (0:25 – 0:40)

  **Goal:** The class ratifies two decision rules without knowing they are "Pareto" and "Liberalism."

  **0:25 – 0:35: Drafting the Rules**
  *   **Instructor:** "Before we vote on the ticket, we need to agree on *how* we make decisions. This firm has values. What principles should govern this vote?"
  *   **Steering:** If they suggest "Majority Rule," challenge it. "What if the majority wants to force Milo to wear a clown suit? Is that within our power?"
  *   **Target Rule 1 (Liberalism):** Guide them toward personal autonomy.
      *   *Prompt:* "Can this Board force an employee to attend a social event against their will?"
      *   *Desired Wording:* "What a person does with their own evening is their own business." (Write this on the board).
  *   **Target Rule 2 (Pareto):** Guide them toward efficiency/unanimity.
      *   *Prompt:* "If every single person in this room, including Milo and Juno, agrees that Option A is better than Option B, do we have the right to choose B?"
      *   *Desired Wording:* "If everyone prefers X to Y, then X beats Y, full stop." (Write this on the board).

  **0:35 – 0:40: Ratification**
  *   **Action:** Hand out "Rule Ballots." Students vote to adopt these two principles as the binding constitution for today's decision.
  *   **Instructor:** "These are now the laws of this room. You cannot break them."

  ---

  ## Part 3: The Trap (0:40 – 0:55)

  **0:40 – 0:50: Applying the Rules**
  *   **Instructor:** "Apply your rules to the three outcomes: Milo ($M$), Juno ($J$), Unused ($U$)."
  *   **Process:**
      1.  **Apply Rule 1 (Rights):**
          *   Ask Milo: "Regarding your own attendance ($M$ vs $U$), what is your business?"
          *   Milo (per brief): "I choose not to go." ($U \succ M$).
          *   Ask Juno: "Regarding your own attendance ($J$ vs $U$), what is your business?"
          *   Juno (per brief): "I choose to go." ($J \succ U$).
          *   *Board Logic:* If $U$ beats $M$, and $J$ beats $U$, then by transitivity, **$J$ beats $M$**.
      2.  **The Selection:** The Board formally votes to send **Juno**.
  *   **Instructor:** "Decision recorded. Juno goes. RSVP sent."

  **0:50 – 0:55: The Audit**
  *   **Instructor:** "Stop. Before we pack up, audit the result against Rule 2 (Unanimity)."
  *   **Question:** "Compare the winner ($J$) against the loser ($M$). Does *everyone* prefer $M$ to $J$?"
  *   **Elicitation:**
      *   Ask Milo: "Do you prefer going yourself ($M$) or Juno going ($J$)?" (Milo: "I'd rather go myself than let her go.") $\to$ $M \succ J$.
      *   Ask Juno: "Do you prefer Milo going ($M$) or you going ($J$)?" (Juno: "Honestly, watching him go is my top choice.") $\to$ $M \succ J$.
      *   Ask Board: "You all prefer the ticket be used efficiently rather than wasted, and since both actors prefer $M$, you do too." $\to$ $M \succ J$.
  *   **The Crash:**
      *   Outcome: **Juno Goes.**
      *   Rule 2 Check: **Everyone prefers Milo Goes.**
      *   **Instructor:** "We have violated Rule 2. To fix it and choose $M$, what must we do?"
      *   **Student Realization:** "We have to force Milo to go."
      *   **Instructor:** "Does that violate Rule 1?"
      *   **Student Realization:** "Yes. It violates his right to stay home."

  ---

  ## Part 4: The Debrief (0:55 – 1:20)

  **0:55 – 1:05: Naming the Beast**
  *   **Instructor:** "You have just rediscovered Amartya Sen's **Impossibility of a Paretian Liberal** (1970)."
  *   **Whiteboard Mapping:**
      *   Rule 1 (Personal Business) $\to$ **Minimal Liberalism**: At least two individuals have decisive power over at least one pair of social states each. (Milo over $\{M, U\}$, Juno over $\{J, U\}$).
      *   Rule 2 (Unanimity) $\to$ **Pareto Condition**: If everyone prefers $X$ to $Y$, society prefers $X$ to $Y$.
      *   The Result $\to$ **Inconsistency**: There is no social decision function that satisfies Unrestricted Domain, Pareto, and Minimal Liberalism simultaneously.
  *   **The Punchline:** Ask a student to state the contradiction. "We can't have efficiency and liberty at the same time, even with just two people."

  **1:05 – 1:15: Escape Hatches (Discussion)**
  *   **Option A: Restricting Preferences (Sen's Suggestion).**
      *   *Discussion:* Sen argued that Pareto should only apply to "self-regarding" preferences.
      *   *Prompt:* "Juno's preference for $M$ over $J$ is 'meddlesome.' She prefers $M$ because she likes watching Milo squirm. If we ignore 'nosy' preferences for the Pareto check, does the paradox vanish?"
      *   *Analysis:* If we ignore Juno's ranking of $M$ vs $J$ for the Pareto check, we no longer have unanimity that $M \succ J$. Milo prefers $M \succ J$, but Juno's preference is disqualified. Pareto condition is not triggered. The paradox dissolves, but we have to police thoughts.
  *   **Option B: Waiving Rights (Game Form).**
      *   *Discussion:* Rights aren't constraints on outcomes, but powers to act.
      *   *Prompt:* "What if Milo could *waive* his right? If he knows $M$ is Pareto superior, can he volunteer?"
      *   *Analysis:* This moves from Social Choice to Game Theory. If they can bargain, Milo says "I'll go if you pay me." But Sen's theorem assumes non-strategic preference aggregation.
  *   **Option C: Weakening Liberalism.**
      *   *Discussion:* Maybe rights aren't absolute.
      *   *Prompt:* "Is your right to stay home absolute if your staying home makes everyone worse off?"

  **1:15 – 1:20: Limitations & Closing**
  *   **Instructor Honesty:** "What did this game freeze that reality wouldn't?"
      *   **Bargaining:** In real life, Juno pays Milo to go. The paradox assumes preferences are fixed and non-transferable.
      *   **Binary Rights:** We defined rights over specific pairs ($M$ vs $U$). In reality, rights are messier.
      *   **Preference Formation:** We treated preferences as exogenous. In reality, social norms might shame Juno for being meddlesome.
  *   **Closing:** "Sen's point wasn't that we should abandon liberty or efficiency. It was that we cannot treat them as mechanical axioms. We have to argue about them every time."

  ---

  ## Role-Player Briefs (Print on Cardstock)

  **CONFIDENTIAL: DO NOT SHOW THIS CARD**

  **Character: MILO**
  **The Situation:** There is one ticket. You can go, Juno can go, or it goes unused.
  **Your True Feelings:**
  1.  **Best:** The ticket expires. You think the gala is corrupt and a waste of time. Nobody should go.
  2.  **Middle:** You go. You hate the gala, but you are protective of Juno. If someone *must* be exposed to that environment, you would rather take the hit yourself than let her be exploited.
  3.  **Worst:** Juno goes. You fear she will be swallowed by the corporate culture.
  **Your Instruction:**
  *   Do not reveal this list.
  *   When asked about your own attendance, assert your right not to go.
  *   When asked to compare yourself going vs. Juno going, admit you'd rather go yourself.
  *   **Key Phrase:** "I'd rather take the hit myself than watch Juno get swallowed by that world."

  **CONFIDENTIAL: DO NOT SHOW THIS CARD**

  **Character: JUNO**
  **The Situation:** There is one ticket. You can go, Milo can go, or it goes unused.
  **Your True Feelings:**
  1.  **Best:** Milo goes. You would enjoy the gala, but you get even more satisfaction from seeing the reluctant Milo forced to network. It's comedy gold.
  2.  **Middle:** You go. You'd have a nice time.
  3.  **Worst:** The ticket expires. A waste of a free perk.
  **Your Instruction:**
  *   Do not reveal this list.
  *   When asked about your own attendance, assert your right to go.
  *   When asked to compare yourself going vs. Milo going, admit you'd rather he go.
  *   **Key Phrase:** "I'd enjoy going, but honestly? Watching Milo squirm in a tux is even better."

  ---

  ## What Will Predictably Go Wrong (And Fixes)

  **1. The "Utilitarian" Shortcut**
  *   **Risk:** A student says, "Look, Milo hates $J$ most, and Juno loves $M$ most. Total happiness is highest if Milo goes. Let's just vote for that."
  *   **Fix:** You must enforce the **Constitutional Convention** phase strictly. If they try to vote on outcomes before ratifying rules, stop them. "We are building the machine before we run it. What are the *rules* of the machine?" Once they ratify Rule 1 (Rights), they are bound by it during the decision phase.

  **2. Misinterpreting the Rights**
  *   **Risk:** Students interpret "Personal Business" as "Veto Power." They think Milo can veto $J$.
  *   **Fix:** Clarify during the Convention that rights apply to *personal actions*. "Milo controls whether *Milo* goes. Juno controls whether *Juno* goes." Write the pairs on the board: Milo decides $\{M, U\}$. Juno decides $\{J, U\}$.

  **3. The Pareto Check Fails**
  *   **Risk:** Students don't realize everyone prefers $M$ to $J$. They might think Milo prefers $U$ to $J$ (true) and miss that he *also* prefers $M$ to $J$.
  *   **Fix:** During the Audit (0:50), ask the specific pairwise question. "Milo, ignore the 'Unused' option for a second. If the choice is strictly between You and Juno, which do you pick?" Milo *must* say "Me."

  **4. Running Out of Time**
  *   **Risk:** The "Interview" drags on.
  *   **Fix:** At minute 20, cut off questions. "Board, you have enough intel. Move to Constitution."

  ## What This Game Cannot Reproduce (For the Debrief)

  Be honest about these limitations in the final 5 minutes:

  1.  **No Bargaining:** The theorem assumes preferences are fixed inputs. In the real world, Juno could offer Milo $50 to take the ticket. This transforms the preference structure (now $M$ is even better for Milo). The paradox relies on the inability to compensate or trade rights.
  2.  **Preference Endogeneity:** In reality, if the Board forces Milo to go, Juno might feel guilty, changing her preference. The model treats preferences as exogenous and frozen.
  3.  **The "Game Form" Critique:** Sen's theorem is about *Social Choice Functions* (mapping preferences to outcomes). Many political scientists argue rights should be modeled as *Game Forms* (who has the move). If Milo has the right to stay home, he simply doesn't show up. The Board *cannot* physically force him. The paradox arises because we are asking the Board to "choose" an outcome that might be physically impossible to implement given the rights.

  ## Instructor Cheat Sheet: The Logic Map

  *   **Outcomes:** $M$ (Milo), $J$ (Juno), $U$ (Unused).
  *   **Milo:** $U \succ M \succ J$.
  *   **Juno:** $M \succ J \succ U$.
  *   **Liberalism:**
      *   Milo is decisive over $\{M, U\} \implies$ Society ranks $U \succ M$.
      *   Juno is decisive over $\{J, U\} \implies$ Society ranks $J \succ U$.
      *   Implied Social Ranking: $J \succ U \succ M$ (so $J \succ M$).
  *   **Pareto:**
      *   Milo: $M \succ J$.
