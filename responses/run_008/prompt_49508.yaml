      *   *The Chase & Sanborn Angle:* This refers to Dennett's example where two coffee tasters can't tell if their tastes changed or their standards changed. Dennett uses this to quine qualia. The Error Theorist loves this; the Defender thinks it misses the point of first-person access.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to be precise. Avoid loaded terms like "illusion" or "real" without qualification.
