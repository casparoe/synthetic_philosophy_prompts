answer: |-
  # JOINT STATEMENT ON THE STATUS OF PHENOMENAL CHARACTER
  **Adversarial Collaboration Draft v1.0**
  **Parties:** The Error Theorist (ET) & The Qualia Defender (QD)
  **Subject:** The coherence and explanatory role of intrinsic qualitative character (following Dennett's "Quining Qualia" and the Chase-Sanborn case).

  ## 1. AGREED CLAIMS
  *The following claims are endorsed by both parties as the common ground for this dispute.*

  1.  **Reality of Discrimination:** Subjects possess genuine, determinate capacities to discriminate, categorize, and react to stimuli. These capacities are not illusory.
  2.  **Quality Space Structure:** These discrimination capacities can be modeled as trajectories and positions within a multi-dimensional "quality space" (similarity structures). The geometry of this space is an objective matter of fact regarding the subject's functional architecture.
  3.  **Introspective Fallibility:** Introspection is not infallible. Subjects can be mistaken about the causes of their states, the stability of their standards over time (as in Chase-Sanborn), and the relationships between their current and past states.
  4.  **No Cartesian Theater:** Neither party posits a homunculus or a privileged locus of consciousness where contents are "presented" to a further inner eye.
  5.  **Supervenience:** Phenomenal facts (whatever they turn out to be) supervene on physical/functional facts. There is no magical influx from outside the causal order.
  6.  **Conceptual Mediation:** Access to one's own experience is mediated by concepts. There is no pre-conceptual "given" that bypasses cognitive processing entirely.
  7.  **Rejection of Naive Ineffability:** The claim that experience is *ineffable* is not a claim that we lack words for it, but a claim about the relationship between phenomenal concepts and public language. Both parties agree this relationship is unusual, but disagree on why.

  ## 2. RESIDUAL DISAGREEMENTS
  *The following table isolates the specific points of contention. Phrasing is neutral; each row represents a single issue where the parties diverge.*

  | Issue | The Error Theorist's Position | The Qualia Defender's Position |
  | :--- | :--- | :--- |
  | **1. Ontological Status of Intrinsic Character** | The notion of a property that is *intrinsic, ineffable, and directly given* is conceptually incoherent. It is a posit that cannot be satisfied by any physical or functional state. | Intrinsic phenomenal character is not a theoretical posit but a pre-theoretical datum. It is the mode of presentation of experience itself, not a property inferred from behavior. |
  | **2. The Source of "Ineffability"** | Ineffability is a cognitive limitation. We lack the public concepts to capture the fine-grained discrimination states we occupy. It is a gap in language, not a feature of the property. | Ineffability is a feature of the *phenomenal concepts* themselves (recognitional/quotational). They pick out the experience directly, which public concepts cannot do. |
  | **3. Explanatory Role** | Positing intrinsic qualities adds no explanatory power beyond the quality space/discrimination model. It is an explanatorily idle wheel. | Intrinsic qualities fix the reference of the quality space. Without them, we cannot explain why *this* similarity structure maps to *this* experience rather than another (inverted spectrum worry). |
  | **4. Interpretation of "Seemings"** | When a subject reports "it seems I have intrinsic qualia," the *seeming* is real (a judgment state), but the *content* of the seeming (that there are intrinsic qualia) is false. | The *seeming* is constitutive of the property. You cannot have the seeming without the property, because the property is the "what-it-is-like" of the seeming itself. |

  ## 3. ANALYSIS OF CRUXES
  *Commentary on the user's proposed cruxes and identification of the core philosophical leverage points.*

  **Crux 1: The Moral Error Theory Analogy (Substantive vs. Decorative)**
  *Verdict:* **Substantive.**
  You asked if this is just decoration. It is not. It determines the burden of proof.
  *   **For ET:** The analogy is the engine. Just as Mackie argues objective values would have to be "queer" entities that motivate action ex nihilo, ET argues intrinsic qualia would have to be properties that are *non-relational* yet *causally relevant*. If the analogy holds, the concept itself is the problem.
  *   **For QD:** The analogy fails because moral values are normative prescriptions, whereas qualia are descriptive presentations. QD argues ET is treating an *acquaintance* relation as if it were a *theoretical inference*.
  *   **The Real Fight:** Is "intrinsicness" a demand we place on the world (ET) or a description of how the world appears to us (QD)?

  **Crux 2: Explanatory Idleness vs. Individuation**
  *Verdict:* **The Strongest Crux.**
  This is where the rubber meets the road.
  *   **ET Claim:** If you fully specify the quality space (discrimination potentials), you have specified the mind. Adding "and it feels like *this*" adds nothing.
  *   **QD Claim:** The quality space is *defined* by phenomenal similarity, not just discrimination. Two systems could have identical discrimination structures (isomorphic quality spaces) but different intrinsic fills (inverted spectrum). Therefore, the intrinsic character explains *which* quality space is instantiated.
  *   **Why it matters:** If QD is right, functionalism is false (or incomplete). If ET is right, functionalism (or representationalism) is sufficient.

  **Crux 3: The Self-Undermining Charge (The "Seeming" Problem)**
  *Verdict:* **Downstream but Fatal.**
  This is the "illusion of phenomenology" problem.
  *   **The Problem:** ET says "Qualia are an illusion." QD asks "What is having the illusion?" If having the illusion *feels like* having qualia, then there is something it is like to have the illusion. ET must explain the "what-it-is-like" of the error without reintroducing qualia.
  *   **ET Defense:** The "what-it-is-like" is just the operation of the monitoring system. It feels like X, but "feels like X" just means "is monitored as X."
  *   **QD Counter:** That monitoring *is* the quale. You've just renamed it.

  ## 4. CONCRETE TEST CASES & PREDICTIONS
  *Specific scenarios where the two positions yield different diagnostic predictions.*

  ### Case A: Perceptual Learning (The New Shade)
  **Scenario:** A subject undergoes training to discriminate two shades of teal (Teal-1 and Teal-2) previously indistinguishable to them. Post-training, they report a distinct "feel" to the difference, not just a guess.

  | Party | Prediction & Explanation |
  | :--- | :--- |
  | **Error Theorist** | **Prediction:** No new *intrinsic* property has been added to the universe. <br>**Explanation:** The subject has refined their discrimination function. The "new feel" is the cognitive system's flag for "high-confidence discrimination." The quality space has gained resolution, not new ontological content. The "feel" is a judgment about the resolution, not a property of the experience. |
  | **Qualia Defender** | **Prediction:** A new intrinsic phenomenal character has been realized. <br>**Explanation:** The quality space didn't just get finer; the *phenomenal field* expanded. The "feel" is not a judgment *about* the discrimination; the feel is the medium *in which* the discrimination occurs. If the feel hadn't changed, the discrimination would be blindsight. |

  ### Case B: The Self-Undermining Charge (The "Seeming" Test)
  **Scenario:** The Error Theorist writes a paper explaining why qualia are incoherent. She types the words "It seems to me that I am in pain, but there is no painful quale."

  | Party | Prediction & Explanation |
  | :--- | :--- |
  | **Error Theorist** | **Prediction:** The statement is coherent and true. <br>**Explanation:** "It seems to me" reports on the *judgment state* (the output of the introspective module). "No painful quale" reports on the *metaphysical status* of the object of that judgment. The module is designed to output "pain" for certain inputs; that output is real, even if the property it purports to track (intrinsic painfulness) does not exist. |
  | **Qualia Defender** | **Prediction:** The statement is pragmatically self-defeating. <br>**Explanation:** The "seeming" *is* the phenomenal character. To say "it seems painful" is to say "there is a painful phenomenal character." ET is trying to drive a wedge between the appearance and the reality in a domain where appearance constitutes reality. She is using the very faculty she claims is incoherent to argue for its incoherence. |

  ### Case C: Chase & Sanborn (Taste vs. Standards)
  **Scenario:** Mr. Chase says his taste in coffee changed. Mr. Sanborn says his standards changed. They behave identically.

  | Party | Prediction & Explanation |
  | :--- | :--- |
  | **Error Theorist** | **Prediction:** There is **no fact of the matter**. <br>**Explanation:** This is the core of "Quining Qualia." Since discrimination and behavior are identical, and there is no intrinsic quale to check, the question "who is right?" is empty. It is a verbal dispute about how to map the word "taste" onto the functional history. |
  | **Qualia Defender** | **Prediction:** There **is a fact of the matter**, though it may be hard to access. <br>**Explanation:** One of them is having a different *phenomenal experience* of the same bean, or the same *phenomenal experience* evaluated differently. Introspection, properly refined (perhaps via phenomenological reduction), can distinguish a shift in the *quality* from a shift in the *evaluation* of the quality. |

  ***

  ### Commentary on the Dispute Strategy (For the PhD Student)

  You guessed correctly on the cruxes, but I would refine how you deploy them in the reading group.

  1.  **On the Moral Error Theory Analogy:** Push the Error Theorist on **Queerness**. Mackie's argument works because moral properties would have to be *action-guiding*. What is the analogue for Qualia? If the ET says "They would have to be non-physical," the QD can say "I'm a physicalist." If the ET says "They would have to be non-functional," the QD can say "They are functional roles filled by intrinsic natures." The analogy breaks down if the ET cannot specify *why* intrinsic character is queer in a physicalist framework.
  2.  **On Explanatory Idleness:** This is your strongest lever. The QD needs to argue that **Similarity is Phenomenal, not just Behavioral.** If ET says "Similarity is just discrimination probability," QD should ask: "Why is Red closer to Orange than to Green?" Is that just a fact about wiring? Or is it a fact about *how they look*? If it's about how they look, qualia are doing the work of grounding the similarity space.
  3.  **On Self-Undermining:** Be careful here. The ET has a standard reply: **The Phenomenal Concept Strategy (PCS) without the Ontology.** They can say "We have phenomenal concepts that refer to physical states, but we *think* they refer to intrinsic qualia." The dispute then shifts to: Is that cognitive illusion brute, or does it require an explanation that reintroduces qualia?

  **Recommendation:** Stop arguing about whether qualia exist. Start arguing about **what individuates the nodes in the quality space.** If the answer is "discrimination behavior," ET wins. If the answer is "phenomenal similarity," QD wins. That is the precise technical pivot point.
