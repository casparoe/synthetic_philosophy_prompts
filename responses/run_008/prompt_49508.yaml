  5.  **Drafting Section 3: The Cruxes (Analysis):**
      *   *User's Guess 1 (Moral Error Theory Analogy):* Is it decoration? *Analysis:* It's substantive. It hinges on whether "intrinsicness" is a demand we place on concepts that cannot be met (Mackie) or a feature of acquaintance (Defender).
      *   *User's Guess 2 (Explanatory Idleness):* Does it fix the similarity structure? *Analysis:* This is a strong crux. If quality spaces are defined entirely by discrimination, qualia are idle. If quality spaces are defined by *phenomenal similarity*, qualia are doing work.
      *   *User's Guess 3 (Self-undermining):* Does the Error Theorist rely on the very seemings she denies? *Analysis:* This is the "phenomenal concept strategy" counter-attack.
      *   *Refinement:* I need to validate the user's insights but sharpen them. The "Moral Error Theory" point is about *queerness* vs. *acquaintance*. The "Explanatory" point is about *individuation*.

  6.  **Drafting Section 4: Concrete Cases/Tests:**
      *   *Case 1: Perceptual Learning (New Shade).*
          *   Error Theorist: New node in quality space, new discrimination function. No new "intrinsic" added, just new resolution.
          *   Defender: New intrinsic character acquired. The *feel* is what tracks the learning, not just the discrimination.
      *   *Case 2: The Self-Undermining Charge (Seemings).*
