answer: |-
  You're presenting a false dichotomy based on a confusion about what constitutes evidence. I don't need the qualia to reach into the causal chain for my report to be evidence; I only need a reliable nomological connection between the physical state and the experience. On my view, the neural activity causes the typing, and that same neural activity lawfully necessitates the qualia via brute psychophysical laws. The report tracks the experience because they are locked together: the physical state produces the words, and the laws of nature guarantee that wherever that physical state exists, the corresponding experience exists. If physics guarantees that whenever I type "I see red" I am also having a red experience, then the typing is genuine evidence, even if the experience itself is causally inert.

  Your argument assumes that for A to be evidence of B, A must be caused by B. But consider a thermometer: the mercury rises because of the heat, and we read the mercury to know the temperature. The temperature doesn't push the mercury molecules—the kinetic energy does—but the reading is still evidence of the temperature because of the lawful connection. Here, the brain state is the mechanism, the typing is the readout, and the qualia are the non-physical properties lawfully tied to that mechanism. You're demanding interactionism because you can't conceive of knowledge without causal feedback from the object known, but that's a limitation of your model, not my ontology. The physics does all the work, but the work reliably indicates the presence of the ghost.
