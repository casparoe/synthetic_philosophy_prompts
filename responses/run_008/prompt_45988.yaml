      *   *Better Idea:* The character is a skeptic testing the theories. She watches a sad scene. She feels good. She asks: "Is it because I'm good?" (Meta). Then she listens to sad music. She feels good. She asks: "Who am I being good to?" (No object). Therefore, Meta fails. The pleasure must be in the *feeling itself* being shaped (Conversion).
      *   *Refining the Commitment:* I will argue for the **Conversion** view. The pain isn't enjoyed *as* pain, nor is the pleasure separate (meta). The pain is *converted* by the form. The story needs a moment where the "safety frame" is removed or shown to be insufficient, proving it's about the transformation of the feeling itself.

  4.  **Drafting - Plot Outline:**
      *   **Intro:** Mara in her apartment. Medicated/numb. Trying to feel "the thing" people talk about.
      *   **Test 1 (Movie):** Watches a tragic death. Feels a pang. Checks for self-congratulation ("I am empathetic"). Finds it hollow. The pleasure isn't there yet.
