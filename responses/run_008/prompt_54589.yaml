answer: |-
  You have put your finger on a profound methodological weakness in much of popular (and even academic) history, one that sits at the intersection of philosophy of science, historiography, and probability theory.

  You are correct that the standard labels don't quite fit. **Hindsight bias** is cognitive (how we *feel* about prediction); **Survivorship bias** is statistical (which data we *see*); and the **Narrative Fallacy** is aesthetic (our love of *stories*). What you are describing is logical: it is a property of the *causal claim itself*.

  There is no single, canonical term in the philosophy of history that captures exactly this "outcome-independence" of explanatory factors. However, your intuition aligns with three distinct literatures that, when combined, give us the tools to name and audit this phenomenon.

  ### 1. The Existing Literature

  **A. The "Just-So Story" (Evolutionary Biology)**
  The closest existing concept comes from Stephen Jay Gould and Richard Lewontin's 1979 critique of adaptationism. They mocked "Just-So Stories"—plausible-sounding evolutionary explanations that could be concocted for *any* trait an animal possessed. If a trait exists, there is a story for why it was selected; if it doesn't, there is a story for why it wasn't. Your mirror test is essentially a demand that historical explanations stop being Just-So Stories.

  **B. Falsifiability (Philosophy of Science)**
  Karl Popper argued that for a theory to be scientific, there must be some observable event that could prove it false. If an explanation can accommodate *any* outcome (Rome falls OR Rome survives), it is unfalsifiable. In the philosophy of history, this is often discussed regarding the **Covering Law Model** (Carl Hempel). Hempel wanted history to use general laws (If conditions C, then Event E). Your test shows that most historical "laws" are actually flexible enough to cover both E and Not-E, meaning they aren't laws at all.

  **C. Bayesian Likelihood Ratios (Statistics)**
  Mathematically, you have identified an explanation where the Likelihood Ratio is 1.
  $$ \frac{P(\text{Evidence} | \text{Outcome})}{P(\text{Evidence} | \text{No Outcome})} \approx 1 $$
  If the presence of "fiscal strain" is equally probable whether the Empire falls or survives, then "fiscal strain" provides zero information about the outcome. It is statistically independent of the result, despite being presented as a cause.

  ### 2. Coining the Concept: **Explanatory Reversibility**

  Since no single term exists, I propose we call this property **Explanatory Reversibility**.

  **Definition:** An historical explanation exhibits *Explanatory Reversibility* when the set of causal factors cited to explain Outcome X can be rearranged, without introducing new facts, to plausibly explain Outcome Not-X.

  **The Reversibility Test:** To audit an explanation, hold the *explanans* (the causal factors) constant and flip the *explanandum* (the outcome). If the narrative remains coherent, the explanation suffers from Explanatory Reversibility.

  ### 3. Edges and Differentiations

  How does this differ from the biases you mentioned?

  *   **Vs. Hindsight Bias:** Hindsight bias is "I knew it all along." Explanatory Reversibility is "I can explain it either way." One is a feeling of certainty; the other is a structural flexibility of the argument.
  *   **Vs. Survivorship Bias:** Survivorship bias hides the failures (we only study the companies that succeeded). Explanatory Reversibility admits the failures but claims the *same reasons* apply to both success and failure.
  *   **Vs. "History Written by the Winners":** That is political bias (suppressing the loser's voice). Explanatory Reversibility is epistemic bias (the logic works for the loser too).

  ### 4. Immune Cases: When the Test Should Not Apply

  Not all explanations should pass the Reversibility Test. Some are "rigid" by nature. Failing the test is only damning if the historian claims a strong causal link.

  **A. Physical Constraints (The "Bridge" Test)**
  *   *Explanation:* "The bridge collapsed because the load exceeded tensile strength."
  *   *Mirror:* "The bridge stood because the load did not exceed tensile strength."
  *   *Verdict:* **Immune.** You cannot use the *same* fact (load > strength) to explain the bridge standing. This explanation is not reversible. It relies on a necessary condition.

  **B. Specific Trigger Events**
  *   *Explanation:* "WWI started in 1914 because the Archduke was assassinated."
  *   *Mirror:* "WWI did not start in 1914 because the Archduke was not assassinated."
  *   *Verdict:* **Immune.** This is a counterfactual dependency. However, if the historian says, "WWI started because of *tensions*," that *is* reversible (tensions existed in 1913 without war).

  **C. Probabilistic Claims**
  *   *Explanation:* "Fiscal strain increased the *risk* of collapse."
  *   *Verdict:* **Immune.** If the claim is explicitly probabilistic, the mirror test fails. A loaded die can still roll a 6. Historians often hide behind this: they claim "pressure" rather than "cause." The Reversibility Test is specifically designed to expose when a probabilistic claim is being masqueraded as a deterministic one.

  ### 5. Is Failing the Test Damning?

  This is the crux of your inquiry. If an explanation is reversible, is it useless?

  **Yes, if the claim is Inevitability.**
  If a historian argues that the Fall of Rome was *driven* by overextension, they imply that overextension makes falling more likely than surviving. If the explanation is reversible, they are wrong. They are describing a *context*, not a *cause*. In this sense, failing the test reveals the explanation is vacuous. It creates an illusion of understanding without actually narrowing the space of possibilities.

  **No, if the claim is Contingency.**
  There is a school of historical thought (often associated with counterfactual history, like Niall Ferguson's *Virtual History*) that argues the past was not determined. In this view, a "good" explanation might *pass* the Reversibility Test.
  *   *Example:* "The Soviet Union collapsed because of a specific confluence of oil prices, leadership decisions, and nationalist unrest."
  *   *Mirror:* "The Soviet Union could have survived if oil prices had been higher, Gorbachev had been harder, etc."
  *   If the historian's point is to show how *fragile* the situation was—that the same factors could have tipped either way depending on chance—then Explanatory Reversibility is a feature, not a bug. It demonstrates **contingency**.

  **The Verdict:**
  Failing the Reversibility Test is damning **only if the historian implies causal sufficiency.**
  *   **Bad History:** "Rome fell *because* of overextension." (Implies: Overextension $\rightarrow$ Fall). *Fails Test.*
  *   **Good History:** "Rome fell *despite* mechanisms that usually allow overextended states to survive, due to specific conjunctions..." (Implies: Overextension + X + Y $\rightarrow$ Fall). *Passes Test.*
  *   **Nuanced History:** "Rome existed in a state where overextension made collapse *possible* where it previously wasn't." (Implies: Risk Factor). *Passes Test.*

  ### Summary

  You have identified a logical flaw in retrospective causal attribution that lacks a specific name. I propose calling it **Explanatory Reversibility**.

  It is distinct from hindsight bias because it is a property of the *argument*, not the *psychology*. It is a measure of **informational content**: if an explanation fits both outcomes, it conveys no information about why *this* outcome occurred.

  However, use the test wisely. If a historian is arguing for **determinism**, Explanatory Reversibility proves them wrong. But if they are arguing for **contingency** (that things could easily have gone the other way), then a reversible explanation is actually an honest admission of the complexity of the past. The sin is not in the reversibility itself, but in presenting a reversible explanation as a deterministic one.
