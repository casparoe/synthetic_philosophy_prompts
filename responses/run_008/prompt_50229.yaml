answer: |-
  # JOINT STATEMENT ON SUNK COSTS AND RATIONAL AGENCY
  **Draft v0.1 for Adversarial Collaboration**
  **Participants:** [Hardliner Name] (HL) & [Revisionist Name] (RN)
  **Date:** [Current Date]

  ## PREAMBLE
  This document outlines the current state of agreement and disagreement between the undersigned regarding the role of sunk costs in rational decision theory. We agree that the standard "Sunk Cost Fallacy" is a genuine error in many contexts, but we disagree on whether sensitivity to sunk costs can ever be constitutively rational, even when controlling for all forward-looking consequences. This document is intended to serve as a basis for further dialectic, modeling, or empirical testing.

  ## SECTION I: AGREED PROPOSITIONS
  *The following claims are endorsed by both HL and RN.*

  1.  **Definition:** A "sunk cost" is defined as a resource expenditure that has already occurred and cannot be recovered, regardless of future action.
  2.  **Orthogonality:** By definition, sunk costs do not directly alter the physical payoff structure of future outcomes.
  3.  **The Paradigmatic Fallacy:** Both parties agree that continuing a project *solely* because "we've come so far" is irrational in cases where:
      *   (a) The future expected value (EV) of continuation is negative.
      *   (b) There are no reputational, informational, or commitment-based future benefits to continuation.
      *   (c) The agent's utility function does not intrinsically value "completion" independent of outcome.
      *   *(Example: Both agree staying to finish a boring movie solely because you paid for the ticket, when you could be doing something more enjoyable, is a fallacy.)*
  4.  **Forward-Looking Legitimacy:** Both parties agree that considerations often *associated* with sunk costs—such as reputational damage from quitting, information gained by persistence, or maintaining morale—are valid forward-looking reasons for continuation.
  5.  **Pathology:** Both parties agree that blind adherence to sunk costs (e.g., escalating commitment in a losing war despite no strategic value) is a recognized cognitive bias that leads to suboptimal outcomes in the majority of observed human behavior.
  6.  **Operational Goal:** The goal of this collaboration is not to justify human bias, but to determine if a decision *procedure* that weights sunk costs can outperform a decision procedure that ignores them in specific formal or real-world environments.

  ## SECTION II: POINTS OF CONTENTION
  *The following statements are phrased such that HL endorses the "Hardliner Position" and RN endorses the "Revisionist Position." Both agree that the opposing column accurately represents the view they intend to argue against.*

  | Domain | Hardliner Position (HL) | Revisionist Position (RN) |
  | :--- | :--- | :--- |
  | **Unit of Evaluation** | Rationality evaluates **acts**. An act is rational iff it maximizes expected utility conditional on the current state and future possibilities. Past costs are irrelevant to the current act's justification. | Rationality evaluates **agents/policies**. An agent is rational iff they possess dispositions that maximize utility over time. A policy of ignoring sunk costs may be inferior to a policy that honors them. |
  | **The CEO Case** | If a CEO continues a failing project to avoid signaling error, this is rational **only if** the reputational benefit outweighs the project loss. If the reputational benefit is accounted for, the past cost itself adds no weight. | If a CEO continues a failing project to maintain the integrity of their decision stream, this can be rational **even if** the immediate reputational calculus is neutral. Abandoning the project degrades the agent's "long-horizon" status. |
  | **Commitment** | Commitment devices are valid only if adopting them is ex-ante profitable. You should never pay a "sunk cost tax" ex-post unless it was contractually locked in ex-ante. | Credibility requires ex-post sacrifice. To prove you are not a fair-weather partner, you must sometimes follow through on projects that are ex-post losing. This cost is the price of the signal. |
  | **Nature of "Rational"** | "Rational" is synonymous with "instrumentally optimal given current options." Any deviation is either a mistake or a preference for non-instrumental values (e.g., pride). | "Rational" includes structural constraints on agency. Being the *kind of agent* who honors past investments is a requirement of diachronic rationality, not merely a preference. |

  ## SECTION III: CRUXES & TESTS
  *For each crux, we specify a concrete case or model where our recommendations diverge, along with the evidence that would settle the dispute.*

  | Crux | Concrete Case / Thought Experiment | HL Prediction | RN Prediction | What Would Settle It |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Transparent Disposition** | **Kavka's Toxin / Reputation Game:** An agent plays a repeated game where counterparts can see their history. The agent is known to be a pure consequentialist (HL type). Can they sustain cooperation? | **Yes.** If the math works, they will cooperate. If the math says defect, they will defect. Counterparties will learn this and adjust. No need for "irrational" sunk cost sensitivity. | **No.** If counterparts know the agent will defect the moment EV turns negative, they will not invest in the first place. The agent must cultivate a disposition to honor past investment *even when* ex-post EV is slightly negative. | **Game Theoretic Modeling:** We agree to commission or derive a formal model of a repeated trust game with incomplete information. If the "Sunk Cost Sensitive" strategy dominates the "Pure Consequentialist" strategy in equilibrium, RN wins. |
  | **2. The Solitary Agent** | **Robinson Crusoe:** An agent is alone on an island with no reputation stakes. They start building a shelter. A storm damages it. Repair cost > Value of shelter (in pure comfort terms). | **Abandon.** Build something else. The labor already spent is gone. Continuing is a loss of further resources. | **Continue (Conditional).** If the agent values "narrative continuity" or "self-trust" as a terminal good, continuing is rational. If they abandon, they degrade their own capacity for long-term projects. | **Preference Elicitation:** We must agree on whether "self-trust" is a *preference* (HL view) or a *rational requirement* (RN view). If it is a preference, HL concedes the behavior is rational *for that agent*. If it is a requirement, it must be rational even without the preference. |
  | **3. The Signaling Cost** | **The Burning Bridge:** A general burns a bridge to commit to fighting. The battle goes poorly. Retreat is now physically impossible (cost = death). Is staying to fight "sunk cost rationality"? | **No.** This is a forward-looking constraint. The option to retreat is removed. The decision is based on future survival probabilities, not past bridge-building. | **Yes.** The initial act of burning the bridge was a sunk-cost investment to create a future constraint. Honoring that constraint *because* you burned the bridge is the rational mechanism. | **Temporal Indexing:** We must agree on when the "decision" happens. HL says decision is at T2 (fight). RN says decision is at T1 (burn bridge) and T2 is just execution. |

  ## SECTION IV: METHODOLOGICAL NOTE & ADJUDICATOR FLAG
  *This section addresses the nature of the disagreement and flags potential argumentative weaknesses identified during drafting.*

  **A. Substantive vs. Verbal Disagreement**
  *   **Commitment/Credibility (Substantive):** We agree this is a genuine disagreement about game theory and mechanism design. The question is whether a "sunk-cost sensitive" algorithm outperforms a "sunk-cost blind" algorithm in specific ecological niches (e.g., high-transaction-cost environments).
  *   **Narrative/Identity (Partly Verbal):** We suspect this disagreement rests on the definition of "Rationality."
      *   *HL Diagnosis:* RN is describing a **terminal preference** (valuing consistency) but labeling it a **rational norm**.
      *   *RN Diagnosis:* HL is describing **act-optimization** but labeling it the **only form of rationality**.
      *   *Resolution Path:* We will attempt to cash out "narrative identity" into utility functions. If RN can show that maximizing this utility function *requires* violating HL's act-consequentialism rules, the dispute is substantive. If it merely requires adding a term to the utility function, the dispute is verbal.

  **B. Adjudicator's Flag on Argumentative Rigor**
  *In the spirit of adversarial collaboration, the following weakness has been identified in the Revisionist (RN) position:*

  *   **The "Rational Requirement" Claim:** RN argues that "the ability to be a long-horizon agent is itself something rationality can require."
  *   **The Critique:** This phrasing risks conflating *instrumental rationality* (satisfying one's goals) with *substantive rationality* (having specific goals). Unless RN can demonstrate that a "short-horizon" agent is logically incoherent (not just less successful in some environments), claiming rationality *requires* long-horizon agency is category error.
  *   **Why this matters:** HL will rightly argue that if you simply *prefer* short-term gains, a rational agent should pursue them. RN must clarify whether they are arguing that (a) everyone *should* prefer long-term agency (a moral/substantive claim) or (b) given a desire for long-term projects, one must honor sunk costs (an instrumental claim). The current draft blurs this, which weakens the Revisionist case against a strict consequentialist.

  ***

  **Signatures:**

  _________________________ (Hardliner)

  _________________________ (Revisionist)
