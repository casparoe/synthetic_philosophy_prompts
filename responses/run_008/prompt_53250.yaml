answer: |-
  Your ear is not merely a genre habit; it is a tacit internalization of one of the central debates in the philosophy of history. You have intuitively grasped the distinction between **structural determinism** (the Annales School, Marxism, complexity theory) and **contingent agency** (Great Man theory, narrative history).

  Your tentative principle is close, but it requires a slight calibration to fully account for your verdicts. The principle is not just about overdetermination, but about **Systemic Plasticity**.

  Here is a principled account that saves your verdicts, explains the Alexander/Gettysburg paradox, and offers a craft rule for the Mongol question and beyond.

  ### 1. Refining the Principle: Inertia vs. Plasticity

  Your formulation: *"A counterfactual is live when the actual outcome was overdetermined."*

  The correction: **A counterfactual divergence is plausible only when the historical outcome was *underdetermined*. A counterfactual trajectory is plausible only when it respects the *inertia* of the system.**

  This explains your WWI and Reformation verdicts. In 1914 Europe and 1517 Germany, the systems had high **Institutional Inertia**.
  *   **WWI:** The alliance systems, mobilization timetables, and imperial rivalries created a "stable attractor" for war. Changing the spark (Sarajevo) does not change the explosion. If you write a novel where war is *avoided*, you are fighting physics. If you write a novel where war happens *later*, you are riding the current.
  *   **Reformation:** The printing press, anticlericalism, and state-centralization needs created a pressure valve that *had* to blow. Luther was the catalyst, not the reactant.

  Your Gettysburg verdict fails because it violates **Trajectory Inertia**. By 1863, the American Civil War was no longer just about battles; it was about industrial capacity, population demographics, and the ideological hardening of "Union" vs. "Confederacy." A single battle cannot reverse the grinding logic of total war. To make the South win, you have to nudge every chapter because you are fighting the structural weight of the North.

  ### 2. Solving the Alexander/Gettysburg Paradox

  Why does Alexander's death feel like a "free" divergence point while Gettysburg feels "cheap"? It is not just your ignorance of antiquity; it is the **Nature of the State**.

  *   **Antiquity (High Plasticity):** Pre-modern states were largely **patrimonial**. The state was the household of the king. Administration was personal, not bureaucratic. Information travel was slow. In such a system, the death of the leader creates an immediate, system-wide vacuum. Succession crises were not bugs; they were features. If Alexander dies in 323 BC, the empire fractures because the *institution* of "Empire" existed only in his person. There was no bureaucracy to hold it together.
  *   **Modernity (High Inertia):** By 1863, the US and CSA were **bureaucratic-ideological states**. They had railroads, telegraphs, tax systems, and entrenched political parties. The death of Lee or Grant would be a shock, but the machinery of war would continue. The ideology (slavery vs. free labor) had outgrown the generals.

  **The Principle:** The more institutionalized and interconnected a society, the higher the energy required to alter its macro-trajectory. In antiquity, a single life *is* a structural force. In modernity, a single life is usually a variable within a structure.

  ### 3. The Mongol Case (1242)

  This is the perfect test case for your craft. The historiography here mirrors your intuition about structural limits.

  *   **The Contingency:** The death of Ögedei Khan *did* recall Batu. That is factual.
  *   **The Structure:** Modern military historians (e.g., May, Smith) argue that Europe presented a logistical dead end for the Mongols. It was too forested, too many stone castles, and crucially, **lack of pasture** for the horses.

  **The Verdict for the Novelist:**
  If your divergence is "Ögedei lives, so the Mongols conquer France," you are likely cheating (fighting logistics).
  If your divergence is "Ögedei lives, so the Mongols raid deeper, destroy more cities, and leave a power vacuum that alters the Holy Roman Empire," that is live.

  The *shape* of Europe (feudalism, Christianity) is overdetermined by geography and social structure. The *map* (which kings rule which ruins) is contingent. A novel where the Mongols stay permanently requires you to solve the pasture problem (e.g., they import steppe grass, or they change their mode of war). If you don't address the logistics, readers will smell the thumb on the scale, just like the Gettysburg example.

  ### 4. Is There a "Line in the Sand"?

  You asked if there is a point in history before which a single life is a usable divergence and after which it is not.

  **There is no date, but there is a threshold: The Bureaucratization Point.**

  You cannot draw a line at 1500 or 1800. However, you can assess the **Information Density** and **Administrative Depth** of your setting.
  *   **Low Density/Depth (Ancient/Medieval):** A single death can rewrite the map. (Alexander, Charlemagne, Genghis).
  *   **High Density/Depth (Modern/Industrial):** A single death can rewrite the mood, but rarely the map. (FDR, Lenin, Hitler).

  *Note on Hitler:* Even Hitler is a tricky case. Many historians argue German aggression was structural (Mitteleuropa), but the *specifics* of the Holocaust and the two-front war were highly contingent on his person. This is why WWII alternate histories are so common but so difficult to pull off; they exist in the transition zone between Personalist and Bureaucratic.

  ### 5. A Craft Tool: The "Nudge" Test

  You mentioned that in the Gettysburg novel, "every chapter after the divergence has to be nudged toward the outcome." This is your most valuable diagnostic tool. I would formalize it as **The Friction Metric**.

  When plotting your divergence:
  1.  **Identify the Structural Current:** What was the dominant force? (e.g., Industrial superiority, Religious fragmentation, Logistical limits).
  2.  **Apply the Divergence:** Does this change the current, or just the waves on top of it?
  3.  **Measure the Friction:** As you outline the subsequent timeline, do you have to introduce *new* coincidences to maintain the divergence?
      *   **Low Friction:** The dominoes fall on their own. (Alexander dies -> Generals fight -> Empire splits).
      *   **High Friction:** You have to prevent the dominoes from falling. (Lee wins Gettysburg -> But Lincoln must refuse to resign -> But Britain must intervene -> But the North must lose the will to fight).

  If you are constantly engineering *secondary* divergences to support the *primary* divergence, you are fighting overdetermination. Your readers sense this as "plot armor" for history.

  ### Summary

  Your ear is tracking **Complex Adaptive Systems**.
  *   **WWI/Reformation:** The system was in a state of critical mass. Removing one spark doesn't stop the fire. (Verdict: Keep the fire, change the spark).
  *   **Gettysburg:** The system had too much momentum. Stopping the train requires more than removing one rail. (Verdict: Implausible without massive structural changes elsewhere).
  *   **Alexander:** The system was fragile and personalist. Removing the keystone collapses the arch. (Verdict: Highly plausible).
  *   **Mongols:** The system was limited by ecology. Keeping the Khan alive doesn't create grass for horses. (Verdict: Plausible for deeper raid, implausible for permanent conquest).

  **The Rule:** Do not ask "Can this event happen?" Ask "Does this event have enough leverage to move the weight of the world I have built?" In antiquity, men moved the world. In modernity, the world moves the men. Your intuition is correct; trust it.
