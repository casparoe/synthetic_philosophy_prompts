answer: |-
  This is a profound question, and it comes from a vantage point that most political analysts lack: the craftsman's understanding of how a story is built. You have identified the central tension of modern governance.

  To answer your primary question directly: The practice of modern political narrative management does **not** presuppose a compact analogous to the novel. It presupposes something far more corrosive.

  Here is the breakdown of why the analogy breaks, what view of truth is actually at work, and whether the system can remain coherent.

  ### 1. The Broken Compact: Claim vs. Pretense
  In your trade, the compact is explicit: *I will tell you a lie, and you will agree to treat it as truth for the duration of the reading, in exchange for insight or pleasure.* The falsity is disclosed up front. That disclosure is what makes it art rather than fraud.

  In political communication, the compact is implicit but fundamentally different: *I will tell you a story, and I claim it is fact. You are invited to doubt it, but you must act as if it is fact for the purposes of policy, while I reserve the right to change the facts if the story fails.*

  The analogy breaks at the point of **consequence**. When you write a novel, the stakes are emotional or intellectual. When a government writes a narrative, the stakes are material. If you write a character who is poisoned, no one dies. If a government writes a narrative that a war is imminent, people die.

  Therefore, political spin is not a "consensual lie" like fiction; it is a **unilateral claim to reality.** It demands the authority of fact without accepting the liability of truth. If the novel is a playground where we agree to pretend, politics is a courtroom where one side is trying to convince the judge that the rules of evidence don't apply to them.

  ### 2. The View of Truth: Instrumentalism
  You ask if this presupposes that factual truth "doesn't do any work." It is slightly more nuanced than that. It presupposes that truth is **instrumental** rather than **correspondent**.

  In the classical view (correspondence theory), a statement is true if it matches reality. In the modern political view (pragmatic/instrumental theory), a statement is "true" if it *works* to secure power or stability.

  This is not entirely new; Machiavelli and Hobbes understood that rulers need myths to maintain order. However, the scale and velocity have changed. The presupposition is that reality is malleable. If you control the language, you control the perception of the event, and in the public sphere, perception *is* reality.

  This leads to what the philosopher Hannah Arendt called the "fragility of factual truth." She argued that factual truth (e.g., "Germany invaded Belgium") is always at the mercy of power because it is contingent. It happened, but it could be hidden, lied about, or recontextualized. Political narrative management operates on the belief that **factual truth is just another raw material** to be mined, refined, or discarded depending on the needs of the narrative architecture.

  So, it isn't that truth does no work; it is that truth is treated as a subordinate variable to power.

  ### 3. The Grammar of the Non-Apology
  You mentioned the "mistakes were made" grammar. This is a specific linguistic tool designed to navigate the gap between the *claim* of competence and the *reality* of failure.

  In a novel, if a character says "mistakes were made," the reader understands this as a character flaw revealing cowardice. In politics, this grammar is functional. It is designed to absorb the kinetic energy of a scandal without admitting legal or moral liability.

  This presupposes a view of the public not as citizens to be informed, but as a **force of nature to be weathered.** You don't apologize to a hurricane; you build a levee. The non-apology is a levee. It presupposes that the public's anger is a resource to be depleted, not a grievance to be resolved.

  ### 4. Is the Practice Coherent?
  This is your most critical question: *Can a public sphere keep running on statements everyone is expected to discount?*

  The short answer is: **No, not indefinitely.**

  A system based on universal skepticism creates a high transaction cost for everything. If no one believes the inflation numbers, the currency destabilizes. If no one believes the security briefing, the alliance fractures. If no one believes the health guidelines, the pandemic spreads.

  However, the system can run for a surprisingly long time on **tribal coherence** rather than **factual coherence.**
  *   **Factual Coherence:** We agree on the data, then argue about the solution.
  *   **Tribal Coherence:** We agree on the team, then accept whatever data the team provides.

  The practice remains coherent only as long as the narrative successfully sorts people into teams. Once the narrative fails to protect the tribe (e.g., the war is lost, the economy crashes regardless of the spin), the compact shatters. This leads to what political scientists call a **legitimacy crisis.**

  When the public realizes the "novel" is being sold as a "manual," and the instructions don't work, they don't just stop reading; they stop obeying.

  ### 5. The Darker Alternative
  You wondered if there is a darker presupposition than the "compact." There is.

  The compact implies a level of respect for the audience (i.e., "We know you know"). The darker view is **epistemic learned helplessness.**

  Political operatives may not assume the public *knows* it's being spun. They may assume the public is too exhausted, distracted, or polarized to care. The goal isn't to convince you the story is true; the goal is to make you feel that **truth is unknowable.**

  If you can't know what's true, you retreat to what feels safe: your identity, your tribe, your preconceptions. In this view, the goal of political communication is not to persuade, but to **confuse.** A confused public cannot coordinate against power.

  ### Summary for the Novelist
  You operate on a contract of **honest deception.** You say, "This is fake," so that you may tell a deeper truth.
  Modern politics operates on a contract of **dishonest assertion.** It says, "This is real," to obscure a deeper falsehood.

  The practice presupposes that truth is not a foundation, but a weapon. And like any weapon, it can be turned against the user. A public sphere cannot survive on discounted statements forever, because eventually, you need to build a bridge, cure a disease, or stop a missile. You cannot do those things with a narrative. You can only do them with reality.

  The danger is not that the public stops believing the politicians. The danger is that the public stops believing in the possibility of truth itself. And once that happens, the only thing left to govern with is force.
