      *   *Wait, I need to be critical.* Is "Units of Selection" the right frame? Maybe the frame should be "Evolutionary Individuality." The "Units of Selection" debate assumes the units exist and asks which one is *causing* the change. The "Individuality" debate asks what constitutes the unit in the first place. This is a crucial shift. I should advise this shift.

  6.  **Drafting the Response (incorporating British English & Tone):**
