          *   *Risk:* If someone (e.g., Bourrat or a major EES figure) publishes a definitive account of transition metrics.
      *   *Selection 2: Explanatory Pluralism & Causal Interpretation of the Price Equation.*
          *   *Why:* Addresses the supervisor's interest but pivots to *philosophy of explanation*. If maths is equivalent, why do biologists argue? Because they want *causal* stories.
          *   *Openness:* How do we map statistical terms to causal mechanisms?
          *   *Tractability:* Philosophical argumentation, analyzing biological literature.
          *   *Risk:* If the "causal interpretation" debate is settled (e.g., by Walsh or Matthen).
      *   *Selection 3: Pathological Evolution (Cancer) as a Test Case.*
          *   *Why:* High relevance to medicine (translational potential). Challenges the "organism as unified unit" assumption.
          *   *Openness:* Is cancer somatic evolution or breakdown of higher-level control?
          *   *Tractability:* Literature review + potential collaboration with oncologists/evol bio folks.
          *   *Risk:* If it turns out biologists don't care about the philosophy (the friend's worry).

      *   *Wait, let's refine.* The user feels the "who's right" is done. The Price Equation feels settled.
      *   *Better Focus:*
          1.  **The Constitution of Units (Individuality):** Before selection, what is the thing? (Holobionts, Chimerae).
          2.  **The Pragmatics of Framework Choice:** If equivalent, why choose MLS over Kin? (Explanatory context).
