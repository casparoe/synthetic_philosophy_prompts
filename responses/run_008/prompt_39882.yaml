      *   *Decision:* Let's go with **(1) The Metaphysics of Biological Individuality (specifically Holobionts/Immunology)**, **(2) Explanatory Pragmatics in Equivalent Frameworks**, and **(3) Evolutionary Transitions in Individuality (ETI)**.
      *   *Actually, looking at the 4-year constraint:* ETI is huge. Individuality is huge. Let's combine ETI and Individuality into one stream, and make the second stream about the *application* of these concepts in "non-standard" cases (Cancer/Microbiome).
      *   *Revised Priorities:*
          1.  **Individuality prior to Selection:** You can't have units of selection without units. The "Holobiont" debate is the perfect battleground.
