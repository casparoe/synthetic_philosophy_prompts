      *   **Task:** Act as a senior philosopher of biology. Advise on genuinely open conceptual questions. Prioritize 2-3 topics. Provide reasoning (why open, tractability, upstream impact, conditions for demotion/scooping). Evaluate user's "idle wonderings." Critique the framing if necessary.
      *   **Style:** British English. Start with a terrain map/brainstorming before ranking. Thoughtful, not just a list.

