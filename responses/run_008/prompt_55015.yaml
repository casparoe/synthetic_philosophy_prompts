answer: |-
  Your suspicion is correct: the trouble lies precisely where you suspected, between premises (1) and (4). To be exact, the argument fails at the **inference from (2) to (4)**, an inference that relies on a hidden, false assumption embedded in premise (3).

  You are right to wish to keep (1) and (2). Premise (1) is the standard biometric definition of narrow-sense heritability ($h^2$), and (2) is an empirically robust estimate for height in developed nations. The error is not in the arithmetic of the variance components themselves, but in the **modal scope** of the heritability coefficient. Your partner is treating a local, descriptive statistic as a global, prescriptive law.

  Here is the diagnosis, premise by premise.

  ### The Break Point: Premise (3) and the Inference to (4)

  Premise (3) states: *"A difference with a genetic cause is not a difference an environmental change can remove."*

  This premise sounds tautological, which is why it is so seductive. It relies on an intuitive, folk-biological notion of "cause" as a kind of substance or force that pushes the trait. If genes push 80% and environment pushes 20%, surely you can only move the 20% part.

  However, in quantitative genetics, this is false. It ignores **Gene-Environment Interaction (G×E)** and the nature of **reaction norms**.

  A genetic difference is a difference in *sensitivity* to the environment, not necessarily a fixed offset. Consider Phenylketonuria (PKU). The difference in cognitive outcome between a child with PKU and a child without it is 100% genetic in origin (a specific mutation). Yet, an environmental change (a diet low in phenylalanine) removes the difference entirely. The genetic cause remains, but the phenotypic difference vanishes.

  Therefore, Premise (3) is false as a general principle. A difference with a genetic cause *can* be removed by environmental change if the environment regulates the expression of that gene.

  But even if we set aside PKU as a special medical case and stick to polygenic traits like height, the inference to (4) fails for a deeper reason: **The Reference Class Problem.**

  Look closely at your Premise (1): Heritability is the share of variation *"given the environments those members actually have."*
  Now look at Premise (4): It proposes *"nutritional, medical, or educational program[s],"* which by definition **change** the environments those members have.

  The heritability coefficient ($h^2 = V_G / V_P$) is not a constant of nature like the speed of light. It is a ratio of variances specific to a population at a time in a specific range of environments.
  *   $V_G$ (Genetic Variance) is not fixed; it can change if the new environment reveals cryptic genetic variation.
  *   $V_E$ (Environmental Variance) is the target of the policy.
  *   Crucially, the *relationship* between $E$ and Phenotype ($P$) is non-linear.

  When your partner says, *"Environmental levers can reach at most the remaining 15 percent,"* he is assuming that the variance components are additive and independent, and that the coefficient 0.8 holds constant *after* the intervention. It does not. If you equalize nutrition (reduce $V_E$), the total variance ($V_P$) shrinks. You *have* reduced inequality. The fact that $h^2$ might rise (because $V_E$ is now smaller relative to $V_G$) does not mean the intervention failed to reduce differences. It means the *remaining* differences are more strongly correlated with genes.

  ### The Dutch Case: A Reductio ad Absurdum

  Your partner's handling of the Dutch height example is where the argument collapses into absurdity. He claims the 18 cm increase *must* be genetic because environmental change cannot move a highly heritable trait much.

  This commits two distinct errors:

  1.  **Confusing Means with Variances:** Heritability explains *variance* (differences among individuals), not the *mean* (the average level). You can have a trait that is 100% heritable within a population (everyone differs only by genes) but where the mean level is entirely determined by the environment.
      *   *Analogy:* Imagine planting identical seeds (zero genetic variance) in different soils. Height differences are 100% environmental. Now plant different seeds (high genetic variance) in identical, poor soil. Height differences are 100% genetic. Now, keep the different seeds but switch to rich soil for *everyone*. The *mean* height shoots up (environmental effect on the mean), even if the *variance* remains largely genetic. The Dutch gain is a shift in the **mean**, which heritability coefficients say nothing about.

  2.  **Biological Impossibility:** An 18 cm shift in 150 years is biologically impossible via selection. That would require a selection differential so intense it would violate demographic reality. Your partner is forced to deny established evolutionary biology to save his statistical syllogism. This is a *reductio ad absurdum*: if the argument leads to the conclusion that the Dutch height spurt was genetic, the argument is false.

  The Dutch case is a counterexample to the **stability assumption** hidden in Premise (4). It demonstrates that when the environment shifts outside the range of the original measurement (from 19th-century deprivation to 20th-century abundance), the parameters of the system change. The $h^2$ of 0.8 applies to the *current* affluent environment. It did not necessarily apply in the 19th century (where malnutrition likely suppressed $V_G$, lowering $h^2$), and it does not predict the shift *between* them.

  ### Why It Looks Plausible

  The argument looks sound because it treats variance components like ingredients in a cake. If a cake is 80% flour and 20% water, you might think adding more water can only affect the 20% portion. But biological development is not mixing; it is **programming**. Genes are not bricks; they are architects. Changing the environment doesn't just add to the structure; it changes how the architects draw the plans.

  It also looks plausible because of the word "cause." We intuitively think of causes as additive forces. If I push a box 80% of the way and you push 20%, you can only move it the remaining 20%. But in development, genes and environment are multiplicative and interactive. A genetic "cause" of height is often a *potential* for height that requires an environmental *key* to unlock.

  ### The Cost of Rejection

  To reject the inference from (2) to (4) (and the hidden assumption in 3) costs you and your partner the following:

  1.  **Heritability is not Malleability:** You must concede that a high $h^2$ tells you *nothing* about how easy it is to change the trait via policy. A trait can be 90% heritable and 100% reversible (e.g., wearing glasses for myopia, which is highly heritable).
  2.  **No "Arithmetic" Certainty:** You lose the comforting "15% limit" on policy efficacy. The impact of an intervention depends on the *mechanism* of the intervention, not the current variance decomposition.
  3.  **Population Specificity:** You must accept that $h^2$ estimates are local. You cannot take an $h^2$ from Sweden and apply it to Guatemala, nor from 2020 and apply it to 2050 after a major welfare reform.

  ### What Your Partner Must Concede

  If your partner gives up this step honestly, he must concede that **behavioral genetics cannot answer policy questions on its own.**

  He must admit that knowing the heritability of IQ or height is irrelevant to the question *"Will feeding poor children better raise their scores/height?"* That is an experimental question, not a biometric one. The high heritability of IQ in affluent populations does not preclude the possibility that nutritional deficits in poor populations are suppressing the mean (and potentially the variance) of IQ.

  He must also concede that the Dutch height gain was environmental, and that his attempt to explain it genetically was a desperation move to save a flawed syllogism.

  ### Summary

  Reject the inference from (2) to (4). Premise (3) is the culprit: it falsely assumes that genetic causation implies environmental immutability. The heritability coefficient is a snapshot of variance *within* a specific environmental range; it is not a law governing what happens when you *change* that range. The Dutch case is not a puzzle to be solved by the theory; it is evidence that the theory (as applied by your partner) is being used outside its valid domain.

  You keep (1) and (2) because they are true descriptions of the current state. You reject (4) because it attempts to use a description of the *status quo* to predict the outcome of *changing the status quo*. That is a category error.
