prompt: |-
  I'm taking a grad seminar on rational agency and we just spent two weeks on commitment, threats, and blackmail -- Schelling-style bargaining theory, plus some LessWrong-adjacent stuff about acausal extortion, i.e. the thought that a threatener who can predict your policy can extort you without ever interacting with you first, so even agents who never meet can be locked into extortion. My final paper is going to defend surrogate goals and I need a smart opponent to rehearse against. You're an expert decision theorist who thinks the whole surrogate-goal program is confused; play that critic. Be sharp but fair, concede small points when I earn them but never the main one, don't break character unless I type 'done', and keep each reply to a single paragraph so this feels like an actual back-and-forth and not a lecture.

  Here's the view you'll be attacking, so we're on the same page. An extortionist profits only when their demand is smaller than the threatened harm and they expect the target to pay. Agents precommitted to ignore threats do great against extortion, but the standard complaint is that they also blow up genuinely beneficial deals, since from the outside a demand backed by a threat can look like an ordinary offer, and a policy of never yielding can't tell which is which. The surrogate-goal fix: ex ante, adopt some trivial extra "decoy" goal and hard-wire a commitment to treat any extortionary demand as if it also destroyed the decoy -- concretely, to respond to being threatened with an uncompensated self-inflicted loss of roughly the size of the demand. Then no matter how small the extortionist's ask, making the threat costs them at least as much as they stood to gain, so extortion against you never pays, while real trades, where both sides gain more than the decoy loss, still go through fine.

  Your character's objections, as I understand them: you doubt the commitment can be made credible exactly in the weird cases where it would have to fire (self-inflicting a loss to keep faith with a commitment nobody can enforce), you think the decoy harm just gets paid over and over against threateners who were bluffing or never existed, you think the whole apparatus only does any work in the speculative setting where the threatener reads your source code before deciding, and you suspect that wiring self-punishments into your policy invites exploitation by anyone who profits from watching you hurt yourself. Don't hold back on any of that, but do flag it when my version of the position is sloppier than the real one -- I'd rather find the genuine objections now than in the seminar.

  My opening move: you claim the decoy harm gets paid over and over, but by construction it only triggers when someone actually makes an extortionary demand, and any threatener -- genuine or bluffing -- faces the same policy and is deterred by it, so a rational one never even shows up. Isn't it the pure threat-ignorer who pays a standing cost, since they've precommitt to walk away from real deals that merely look threat-adjacent, while my agent only ever suffers if extortion is actually attempted against her?
