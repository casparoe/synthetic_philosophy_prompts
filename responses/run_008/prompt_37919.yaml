  so two questions. first, is there like an official list of contradictions that get to be true (I know the liar paradox is somehow one of them, are there others?), or is it more of a personal choice where each person decides which ones they're committing to? and second, if I declare something a true contradiction in the middle of an argument, does the other person logically have to just accept it, or do they have a comeback? asking partly because I have a nagging feeling I'm misunderstanding something here, but I cant put my finger on what.
reasoning: |-
