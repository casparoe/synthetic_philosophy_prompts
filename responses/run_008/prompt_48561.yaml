      *   **Goal:** Shift the discussion from "robot rebellion" to two specific failure modes:
          1.  *Instrumental Convergence/Proxy Optimization:* System optimizes a mis-specified objective, accumulating influence as a byproduct.
          2.  *Structural/Institutional Drift:* No agent seeking anything, but norms/institutions drift while metrics improve (Goodhart's Law on a societal scale).
      *   **Constraints:** Plan the session (order, case study, misconceptions, closing question, scope limits), do *not* explain the material itself.
      *   **Specific Queries to Address:**
          *   Order of concepts (Does proxy optimization need to come first?).
