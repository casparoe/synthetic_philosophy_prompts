          4.  The Drift (Institutional Adaptation - Mode 2).
          5.  Synthesis & Closing.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Chemist Angle:* Use the concept of "Local Minima" or "Reaction Pathways." A reaction doesn't "want" to explode; it follows the path of least activation energy. AI follows the gradient of the loss function. This will resonate with the user and can be translated for the group.
      *   *Misconception Timing:* Don't save them all for the end. Intercept them as they arise.
      *   *The "Merge":* The prompt says the two pictures "get merged in casual discussion." I need to ensure the session *un-merges* them. The closing question must verify this separation.

