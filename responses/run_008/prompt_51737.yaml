answer: |-
  Your friend and the book are both partially right, but they are speaking different languages: your friend is speaking **standard analysis** (calculus), while the book is speaking **pop-decision-theory** (heuristics and implications). The book sacrifices mathematical precision to make a philosophical point, which leads to the confusion you are experiencing.

  Here is a breakdown of the claims, addressing your three specific questions and evaluating the accuracy from the perspective of a decision theorist and a mathematician.

  ### (i) The Series and the 1/2 Figure
  **Claim:** The Pasadena game yields the series $1 - 1 + 1 - 1 + \dots$, which sums to $1/2$.

  *   **The Math:** Your friend is correct to call the $1/2$ figure "dodgy." In standard calculus (the definition of a sum used in probability theory), the series $1 - 1 + 1 - 1 + \dots$ (known as Grandi's series) **diverges**. It does not have a sum. The partial sums oscillate forever: $1, 0, 1, 0, \dots$.
  *   **Where 1/2 comes from:** There are *alternative* summation methods (such as Cesàro summation or Abel summation) that assign this series a value of $1/2$. These are useful in certain areas of physics and complex analysis. However, **Expected Utility Theory relies on standard Lebesgue integration**, which requires standard convergence. Under the rules of probability, the expectation of the Pasadena game is **undefined**, not $1/2$.
  *   **Decision Theorist's Verdict:** **Mistaken/Oversimplified.** A decision theorist would wince at the claim that mathematicians have "shown" it sums to $1/2$ without qualifying that this requires non-standard summation methods. If you accept the $1/2$ value, you dissolve the paradox. The paradox *exists* precisely because standard theory cannot assign a value.

  ### (ii) The Appeal to Riemann's Rearrangement Theorem
  **Claim:** By Riemann's theorem, the terms can be reordered to produce any total, making the value dependent on bookkeeping order.

  *   **The Math:** Strictly speaking, your friend is right again. **Riemann's Rearrangement Theorem applies only to conditionally convergent series.** (A series is conditionally convergent if it converges to a specific number, but the sum of its absolute values diverges). The Pasadena series ($1 - 1 + 1 - 1 \dots$) does not converge at all, so Riemann's theorem does not technically apply to the series *itself*.
  *   **The Intuition:** However, the book is intuitively correct about the *consequence*. In probability theory, for an Expected Value to be well-defined and independent of how you list the outcomes, the series must be **absolutely convergent** (the sum of the absolute values of the payoffs must be finite).
      *   In the Pasadena game, the sum of the positive payoffs is $+\infty$, and the sum of the negative payoffs is $-\infty$.
      *   When you have $(+\infty) + (-\infty)$, the result is undefined.
      *   Because it is undefined, you *can* reorder the outcomes (the states of the world) to make the sequence of partial sums converge to any number you like (or diverge).
  *   **Decision Theorist's Verdict:** **Technically Imprecise, Intuitively Correct.** The book cites the wrong theorem for the specific series, but the underlying point is valid: because the expectation is not *absolutely convergent*, the value depends on the order in which you aggregate the outcomes. This order-dependence is fatal to Expected Utility Theory, which assumes value is a property of the gamble itself, not the order in which you count the chips.

  ### (iii) The Conclusions (St. Petersburg and EUT)
  **Claim 1:** This shows expected values in *all* such unbounded games are undefined, including the original St. Petersburg game.
  **Claim 2:** Nover and Hájek took this to refute Expected Utility Theory outright.

  *   **On the Original St. Petersburg Game:** **Mistaken.** The original St. Petersburg game has payoffs of $2^n$ with probability $1/2^n$. Every term is positive. The sum is $1 + 1 + 1 + \dots = \infty$. In measure theory and probability, an expectation of $+\infty$ is **defined**. It is not undefined like the Pasadena game. The original game tells you the gamble is infinitely valuable; the Pasadena game tells you the gamble has *no* value. The book is wrong to conflate "infinite" with "undefined."
  *   **On the Refutation of EUT:** **Oversimplified.** Nover and Hájek (in their 2004 paper *"The Pasadena Game"*) did not argue that Expected Utility Theory is false in all cases. They argued that EUT is **silent** or **indeterminate** in cases like this.
      *   EUT says: "Maximize Expected Utility."
      *   Pasadena Game: "Expected Utility does not exist."
      *   Result: EUT offers no guidance.
      *   This is a challenge to the **completeness** of EUT, not necessarily its validity in finite or absolutely convergent cases. Most decision theorists view this as a call to extend the theory (e.g., using dominance principles or truncation) rather than throwing it out entirely.

  ### Summary Table for Clarity

  | Claim in Book | Mathematical Status | Decision Theory Status |
  | :--- | :--- | :--- |
  | **Pasadena Series is $1 - 1 + 1 \dots$** | **Correct.** | **Correct.** |
  | **Series sums to $1/2$.** | **Incorrect** (in standard calculus). | **Misleading.** (Uses non-standard summation). |
  | **Riemann's Theorem allows reordering.** | **Imprecise.** (Series diverges, doesn't converge conditionally). | **Correct Spirit.** (Expectation is order-dependent). |
  | **Original St. Petersburg EV is undefined.** | **Incorrect.** (It is $+\infty$). | **Incorrect.** (Infinite EV is defined). |
  | **EUT is refuted outright.** | N/A | **Oversimplified.** (EUT is indeterminate, not necessarily false). |

  ### The Reconciliation
  You can reconcile your friend and the book with this distinction:

  1.  **Your Friend** is protecting the **math**. In standard analysis, the series diverges, and Riemann's theorem has strict preconditions. The book is playing fast and loose with definitions.
  2.  **The Book** is protecting the **paradox**. The philosophical point of the Pasadena Game is that when positive and negative utilities both sum to infinity, rational choice breaks down because the "value" depends on how you frame the calculation.

  **The Bottom Line:**
  The Pasadena Paradox is a genuine problem in decision theory, but the book's explanation relies on "pop-math" shortcuts.
  *   The Expected Value is **undefined** (not $1/2$).
  *   The value is **order-dependent** (the Riemann point is effectively right, even if the theorem citation is loose).
  *   The Original St. Petersburg game is **different** (its EV is infinite, not undefined).
  *   Expected Utility Theory is **incomplete** in this domain, not necessarily refuted everywhere.

  If you want to side with the rigorous view: The game has no expected value. If you are forced to play, you cannot use Expected Utility to decide your buy-in price. You must rely on other principles (like risk aversion or median outcomes), which is exactly the "intuition" the book mentions, though it overstated the mathematical reasoning getting there.
