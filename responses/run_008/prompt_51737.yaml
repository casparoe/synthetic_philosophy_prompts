          *   *Reordering:* Reordering the *states* (the sequence of summation) allows you to steer the partial sums anywhere. This is the *spirit* of Riemann, even if the technical label is slightly off.
          *   *Verdict:* Book is technically loose but intuitively right about order dependence.

      *   **Drafting Section (iii) - The Conclusions:**
          *   *St. Petersburg:* Original game is all positive. EV = $+\infty$. This is defined. Pasadena is different ($\infty - \infty$). Book is wrong to equate them.
          *   *Refutation of EUT:* Nover & Hájek argue EUT is *indeterminate*. It doesn't tell you what to do. This challenges the *completeness* or *action-guidance* of EUT, not necessarily its axioms in finite cases.
          *   *Verdict:* Book overstates the case against St. Petersburg. Nuances the EUT refutation claim.

  4.  **Review and Refine:**
      *   Make sure to explicitly mention Nover & Hájek (2004).
