prompt: |-
  I've been reading a pop-science book about quantum foundations (not going to name it, it's a fairly recent one) and there's a paragraph about the many-worlds interpretation that has me confused. Paraphrasing from memory, the book says roughly this: in many-worlds every possible outcome of a measurement literally happens in some branch, so nothing is ever uncertain and there's no such thing as probability anymore; and the reason this isn't fatal is that Deutsch and Wallace proved a theorem showing that any rational agent living in the multiverse is forced to act as if the Born rule were true, weighting branches by their squared amplitudes rather than counting them equally, which recovers the standard quantum probabilities exactly. The book then wraps up by saying this "solved the probability problem" and that the remaining objections are just philosophers complaining. A friend of mine who did physics grad school told me this is way too rosy, and also muttered something about how counting branches doesn't even make sense because there's no fact about how many branches a measurement creates. But honestly I can't tell which parts of the book's story are right, which are oversimplifications, and which are just wrong. Like, is it even fair to say there's no uncertainty in Everettia when the whole thing seems to be about what I should expect before I look?

  Can you go through the book's summary piece by piece and tell me what an Everettian would actually endorse, what they'd insist is being stated too strongly, and what's a genuine misrepresentation? In particular I'd like to know whether the Deutsch-Wallace stuff is really a proof in the way the book implies, and whether everyone in the field accepts it or whether there are live alternatives (my friend seemed to think there were a couple of different approaches to getting probability out, not just one). Also, does the "problem solved" conclusion follow from the parts of the summary that are actually true? Please write it as continuous prose, no bullet points or headings or anything, just like a long email from someone who knows this stuff.
