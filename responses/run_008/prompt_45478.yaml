answer: |-
  Subject: Re: Confusion about the Many-Worlds probability stuff

  Hi there,

  It is completely understandable that you are feeling confused, because the paragraph you described is walking a very tightrope between technical precision and pop-science salesmanship. Your friend who went to physics grad school is right to be skeptical of the "mission accomplished" vibe, but the book is also reporting on a genuine line of research that many serious Everettians endorse. The tension you are feeling comes from the fact that the Many-Worlds Interpretation, or Everettian Quantum Mechanics, has to solve a very specific problem that other interpretations do not have: if everything happens, why do we observe frequencies that match the Born rule, which says some outcomes are more likely than others? In standard quantum mechanics, probability is a fundamental postulate, but in Many-Worlds, the underlying dynamics are deterministic, so probability has to emerge from somewhere else. When the book says there is "no uncertainty," it is speaking from a God's-eye view of the entire wavefunction, where every outcome indeed exists. However, from your perspective as an agent about to perform a measurement, it is misleading to say there is no uncertainty at all. Most modern Everettians argue for something called self-locating uncertainty, which means that even though all versions of you will exist after the measurement, the pre-measurement you does not know which branch they will find themselves on. So, while objective chance might vanish, subjective uncertainty remains, and that is what needs to be quantified.

  This brings us to your friend's comment about branch counting, which is one of the most important technical points in this whole debate. The book makes it sound as if there are a discrete number of branches and we just have to decide whether to count them equally or weight them. In reality, the situation is much messier because branches are not discrete, countable objects like marbles in a bag. They emerge from the process of decoherence, which is continuous and approximate, meaning there is no fact of the matter about exactly how many branches exist at any given time. If you tried to just count branches, you would get the wrong answer anyway because the structure of the wavefunction doesn't support simple counting. This is why the Deutsch-Wallace theorem is so central to the modern Everettian program. David Deutsch and David Wallace developed a decision-theoretic approach which argues that if you accept the deterministic wavefunction ontology, then any rational agent who wants to maximize their expected utility is logically forced to place bets as if the Born rule were true. They do not derive this by counting branches, but by imposing axioms of rationality, such as the idea that your preferences shouldn't depend on how you label the branches.

  However, this is where the book's claim that the problem is "solved" becomes highly contentious. The Deutsch-Wallace theorem is a valid mathematical proof, but only within the framework of its specific axioms. Critics, including both physicists and philosophers, argue that these axioms secretly smuggle in probabilistic assumptions, making the argument circular. For example, some argue that the requirement to treat branches with certain symmetries equally already presupposes a notion of probability that the theorem was supposed to derive. Furthermore, there are other live approaches to the probability problem that the book glosses over. For instance, some researchers like Sebens and Carroll focus on the self-locating uncertainty I mentioned earlier, arguing that probability arises from the period where the measurement has happened but the observer hasn't yet registered the result. Others, like Wojciech Zurek, propose a derivation based on "envariance," which relies on symmetries in entangled states. The existence of these competing derivations suggests that the community has not converged on a single, universally accepted solution, contrary to the book's implication that Deutsch-Wallace closed the case.

  When the author dismisses the remaining objections as just philosophers complaining, they are drawing a line in the sand that many experts would not respect. While it is true that some philosophical objections are nitpicky, there are substantial physical objections regarding whether decision theory can truly replace physical probability. If the theory cannot explain why we should expect to find ourselves in a high-amplitude branch rather than a low-amplitude one without relying on decision-theoretic norms, then the link between the math and our empirical experience remains shaky. The "problem solved" conclusion follows only if you accept that deriving rational betting behavior is equivalent to explaining physical probability, which is a substantive philosophical stance, not a proven fact. So, while the book is correct that the Deutsch-Wallace work is a monumental achievement that saved Many-Worlds from being empirically incoherent, it is an oversimplification to say it removed all doubt.

  To summarize where the field actually stands, an Everettian would endorse the view that objective chance is an illusion replaced by the deterministic evolution of the wavefunction, but they would likely nuance the claim about uncertainty by appealing to self-location. They would insist that your friend is right about branch counting being ill-defined, which is exactly why they rely on amplitude weighting via decision theory rather than counting. However, they would have to admit that the Deutsch-Wallace theorem is not a proof in the same sense as a theorem in geometry, because its premises are axioms of rationality that not all agents might accept. The claim that the probability problem is fully solved is the part of the summary that is most overstated; it is more accurate to say that there is a robust, sophisticated framework for understanding probability in Many-Worlds, but it remains the most debated aspect of the interpretation. You should feel confident that your confusion stems from the complexity of the issue rather than a failure on your part to grasp it, because even the experts are still arguing over whether the derivation is circular or complete.

  Hope that helps clear things up a bit,

  Your Friend
