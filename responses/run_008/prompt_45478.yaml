      *   *Claim 3: "Deutsch and Wallace proved a theorem... forced to act as if the Born rule were true."*
          *   *Nuance:* This is Decision-Theoretic MWI. It derives the Born rule from axioms of rationality.
          *   *Verdict:* It is a theorem *within its axiomatic framework*. However, critics argue the axioms smuggle in probability or aren't compelling to all rational agents. It's not a proof in the mathematical logic sense that compels everyone regardless of interpretation.

      *   *Claim 4: "Weighting branches by squared amplitudes rather than counting them equally."*
          *   *Nuance:* This touches on the "counting problem." In MWI, branches aren't discrete countable entities in a simple way. The measure is continuous.
