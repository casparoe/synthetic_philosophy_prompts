      Ultimately, *Arrival* dramatizes the resolution of Paul's problem by eliminating the conditions that create it. Louise is not a model for rational parenthood; she is a post-human entity making a choice humans cannot make. The film works not because it solves the philosophical puzzle, but because it shows the cost of the solution. Louise gains clarity but loses Ian, and the shared human experience of not knowing. The nonlinear time is not chrome; it is the price of admission to a perspective that renders the rational choice irrelevant.

