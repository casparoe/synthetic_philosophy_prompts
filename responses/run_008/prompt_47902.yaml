  # Joint Statement of Adversarial Collaboration: The Regulation of Hate Speech

  **Participants:** Member A (Liberal/First Amendment Priority) & Member B (Dignity/Assurance Priority)
  **Date:** October 2023
  **Subject:** Mapping the Disagreement on State Regulation of Hateful Expression

  ## I. Shared Commitments
  *We, the undersigned, agree upon the following premises as the baseline for our continued debate:*

  1.  **Rejection of Violence:** Both parties condemn physical violence and targeted harassment. We agree that speech integral to criminal conduct (e.g., direct threats, conspiracy, solicitation of imminent violence) is regulable.
  2.  **Anti-Censorship Presumption:** Both parties agree that the state must not use hate speech laws to shield the government from criticism, protect orthodoxies, or suppress political dissent.
  3.  **The Empirical Claim:** Both parties agree that hate speech has negative social effects. The disagreement is not about *whether* hate speech causes distress, but about the **legal relevance** of that distress.
  4.  **The Remedy Preference:** Both parties agree that counter-speech ("more speech") is generally preferable to legal prohibition, but disagree on the threshold where counter-speech becomes insufficient.
  5.  **Vulnerable Groups:** Both parties acknowledge that historical minorities face disproportionate risks from mob violence and social exclusion.

  ## II. Table of Disagreements
  *Each row is worded to be acceptable to the respective side as a fair characterization of their view.*

  | Domain of Dispute | Member A (First Amendment Priority) | Member B (Dignity/Assurance Priority) |
  | :--- | :--- | :--- |
  | **Nature of Injury** | Hate speech primarily causes **offense, emotional distress, or psychological pain**. These are private harms that individuals must resilience against; they do not constitute a public wrong warranting state force. | Hate speech causes **dignitary harm and political exclusion**. It undermines the public good of "assurance," signaling to minorities that their citizenship status is second-class. This is a public wrong. |
  | **State Paternalism** | Regulating hate speech is **paternalistic**. It treats adults as unable to handle offensive ideas and assumes the state knows which ideas are "toxic." | Regulating hate speech is **protective of public order**. It is no more paternalistic than laws against libel or fraud; it protects the integrity of the public sphere, not individual feelings. |
  | **The Chilling Effect** | The primary risk is **state overreach**. Vague laws will be used to silence marginalized voices or critics of the state (the "weaponization" risk). | The primary risk is **private silencing**. A hostile environment causes minorities to self-censor and withdraw from public life (the "exclusion" risk). |
  | **Causal Mechanism** | Speech only justifies restriction if it triggers **imminent lawless action** (*Brandenburg* test). The link between words and long-term discrimination is too attenuated for law. | Speech **constitutes** the harm. The act of public denigration *is* the damage to the social environment, regardless of whether immediate violence follows. |

  ## III. Cruxes and Concrete Cases
  *For each crux, we identify a specific legal scenario where our predictions diverge.*

  ### Crux 1: Is Dignity a Public Good Warranting Legal Protection?
  *The Core Question:* Can the state legislate to maintain a social environment where all citizens feel assured of their standing, even without imminent violence?

  *   **Test Case:** **Holocaust Denial Laws** (e.g., Germany's *Volksverhetzung* vs. US First Amendment).
      *   **Scenario:** A public figure publishes a pamphlet claiming the Holocaust never happened, without explicitly calling for violence against Jews.
      *   **Member A Prediction:** **Protected Speech.** The statement is false and offensive, but it is a historical claim. Banning it sets a precedent for the state to determine historical truth. The harm is offense, not imminent violence.
      *   **Member B Prediction:** **Proscribable Speech.** This is not merely historical debate; it is an attack on the standing of Jewish citizens. It undermines the "assurance" that they belong in the political community. The law rightly treats this as a public order offense.

  ### Crux 2: The Definition of "Intimidation" vs. "Expression"
  *The Core Question:* When does symbolic speech become a threat to public safety/order?

  *   **Test Case:** **Westboro Baptist Church Funeral Protests** (*Snyder v. Phelps*, 2011).
      *   **Scenario:** A group pickets a military funeral with signs reading "God Hates Fags" and "Thank God for Dead Soldiers," complying with all time/place/manner restrictions (distance from the site).
      *   **Member A Prediction:** **Protected Speech.** The speech addresses public issues (war, morality). The emotional distress to the family is severe, but the state cannot ban speech simply because it is upsetting. Counter-speech is the remedy.
      *   **Member B Prediction:** **Proscribable Speech.** This is targeted harassment that functions to exclude LGBTQ+ individuals and their allies from public mourning and civic belonging. It creates a hostile environment that suppresses the participation of targeted groups.

  ### Crux 3: The "Glorification" of Violence
  *The Core Question:* Does praising past terrorism constitute incitement to future terrorism?

  *   **Test Case:** **"Glorifying Terrorism" Offences** (e.g., UK Terrorism Act 2006 vs. US *Brandenburg*).
      *   **Scenario:** An individual posts on social media praising a past terrorist attack as "heroic" but includes no call to action for new attacks.
      *   **Member A Prediction:** **Protected Speech.** Under *Brandenburg*, this lacks "imminence." It is abstract advocacy. Banning it criminalizes ideology and allows the state to label dissenters as terrorists.
      *   **Member B Prediction:** **Proscribable Speech.** Such speech normalizes violence and signals to potential actors that violence is legitimate. It degrades the public norm against political violence, harming the security of the community.

  ## IV. Analysis of Verbal Disputes
  *We identify areas where our disagreement may be semantic rather than substantive.*

  1.  **The Definition of "Harm":**
      *   **Diagnosis:** Partially Verbal.
      *   **Explanation:** Member A uses a **narrow, causal definition** of harm (physical injury, economic loss, imminent breach of peace). Member B uses a **broad, constitutive definition** of harm (damage to social status, psychological security).
      *   **Resolution:** We acknowledge we are not disagreeing on whether the victims suffer, but on **which sufferings justify state coercion**. We will stop arguing about whether dignity damage is "real harm" and argue about whether it is "legally cognizable harm."

  2.  **The Definition of "Paternalism":**
      *   **Diagnosis:** Substantive.
      *   **Explanation:** Member A views any protection from offensive ideas as paternalism (protecting the mind). Member B views this as protecting a public good (the environment), analogous to noise pollution laws.
      *   **Resolution:** This is not merely verbal. It reflects a deeper disagreement on the **purpose of the state** (negative liberty vs. positive assurance). This must remain a point of theoretical contention.

  ## V. Strategic Recommendations for the Reading Group
  1.  **Stop debating Mill:** Member A should clarify if they accept *Brandenburg* as a sufficient limit. If so, the debate is about whether hate speech meets the *Brandenburg* threshold, not whether Mill was right.
  2.  **Focus on Mechanism:** Member B should focus less on "hurt feelings" and more on the **political theory of public goods**. The argument is stronger when framed as "maintaining the conditions for democracy" rather than "protecting vulnerability."
  3.  **Empirical Truce:** Acknowledge that neither side has definitive empirical proof that bans reduce hatred (A's claim) or that free speech reduces hatred (B's claim). Treat this as a normative disagreement, not an empirical one.

