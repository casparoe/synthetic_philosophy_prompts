      1.  *Holism = "It depends" (Relativism).* Head off by distinguishing "context sensitivity" from "no truth."
      2.  *Particularism = Intuitionism (Gut feeling).* Head off by emphasizing *reasons*, just not codified ones.
      3.  *Generalism = Legalism (Blind rule-following).* Head off by presenting sophisticated Generalism (Principles as defaults/heuristics).
      4.  *Particularism = "Anything Goes".* Head off by emphasizing the *reality* of reasons, just not invariant ones.

