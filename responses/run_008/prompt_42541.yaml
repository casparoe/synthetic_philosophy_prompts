answer: |-
  ### 1. The Dependency Structure
  Your instinct is correct, but it needs one precise adjustment. You cannot simply distinguish "principle" from "reason." You must first distinguish a **descriptive feature** (e.g., "this act causes pleasure") from its **normative valence** (e.g., "this counts in favor of doing it").

  **The Required Sequence:**
  1.  **Features vs. Valence:** Establish that actions have features (descriptive) and these features function as reasons (normative).
  2.  **Invariance Claim:** Define a moral principle not just as a rule, but as a claim that a feature *invariably* carries the same valence (e.g., "Pleasure is *always* a reason for").
  3.  **Holism of Reasons:** Demonstrate that the *same* feature can switch valence depending on context.
  4.  **The '-Isms':** *Only now* define Generalism (valence is invariant) vs. Particularism (valence is context-sensitive).

  If you name the '-isms' before step 3, students will treat Particularism as a sociological claim ("people disagree") rather than a metaphysical one ("reasons behave holistically").

  ### 2. The Carrying Example
  **Do not use the Sadistic Pleasure case.**
  **Why:** It invites the "No True Scotsman" confusion. Students will argue, "Sadistic pleasure isn't *really* a good thing, so the principle 'Pleasure is good' still holds if we define pleasure correctly." They will moralize the description to save the principle.

  **Use the "Taking the Car" Case.**
  It is descriptively neutral, concrete, and allows for a three-way flip (Reason For, Reason Against, No Reason).

  *   **The Feature:** "Taking my neighbor's car without asking."
  *   **Case A (Theft):** I take it to joyride. (Feature is a **reason against**).
  *   **Case B (Emergency):** I take it to rush their unconscious child to the hospital. (Feature is a **reason for**—or at least ceases to be against).
  *   **Case C (Standing Permission):** I take it because they said, "Borrow it anytime." (Feature is **no reason either way**).

  **Why this works:** It prevents the Generalist from simply adding exception clauses ("Don't take cars *unless*..."). The Particularist point is that the *list of exceptions is open-ended*. You cannot write a finite rule that covers Case B, Case C, and every future variation. The *context* determines the valence, not the rule.

  ### 3. The 50-Minute Sequence & Misconception Map

  **00–10 mins: Features and Valence (Setting the Trap)**
  *   **Activity:** Write "Taking the car without asking" on the board. Ask: "Is this wrong?"
  *   **Goal:** Elicit the instinct that "it depends."
  *   **Misconception Alert:** Students will say "It depends on the *consequences*."
  *   **Intervention:** Stop this. Say, "We aren't asking about consequences yet. We are asking if *this specific feature* counts for or against the act."
  *   **Outcome:** Establish that features need context to have moral weight.

  **10–20 mins: Holism of Reasons (The Pivot)**
  *   **Activity:** Walk through Cases A, B, and C (above).
  *   **Key Move:** Ask, "Did the *feature* change?" (No, it's still taking the car). "Did the *moral weight* change?" (Yes).
  *   **Definition:** Introduce **Holism of Reasons**: A feature can be a reason in one case, and no reason or an opposite reason in another.
  *   **Misconception Alert:** "So morality is just subjective?"
  *   **Intervention:** "No. In Case A, it is objectively a reason against. In Case B, it is objectively a reason for. The *truth* is stable; the *principle* is what fails."

  **20–30 mins: Naming the Positions (The Reveal)**
  *   **Generalism:** Claims moral reasons behave like laws of physics (invariant valence). Principles explain *why* things are right.
  *   **Particularism:** Claims moral reasons behave like words in a language (context-dependent valence). Principles are at best generalizations.
  *   **Misconception Alert:** "Particularism means we just use our gut." (Collapsing into Intuitionism).
  *   **Intervention:** "Particularists give reasons! They say 'I did it because it saved a life.' They just deny that 'Save lives' is a rule that covers all cases. It's reasoning by **analogy** (case-to-case), not **subsumption** (case-to-rule)."

  **30–40 mins: The Generalist's Best Shot (Teachability & Bias)**
  *   **The Objection:** Put the Generalist case strongly. "If there are no principles, how do we teach ethics? How do we stop bias? Without rules, isn't every judgment just an uncontestable opinion?"
  *   **The Particularist Reply:**
      1.  **Teachability:** We teach ethics like we teach art criticism or wine tasting. We show examples, refine perception, and correct mistakes. We don't teach algorithms.
      2.  **Bias:** Rules don't stop bias; people use rules to justify bias ("The rule says X, so I'm right"). Case-by-case comparison exposes bias better ("Why did you judge *this* lie harsher than *that* lie?").
  *   **Misconception Alert:** "Generalism is just legalism."
  *   **Intervention:** Ensure the Generalist is arguing for *explanatory power*, not just blind obedience. Principles help us understand *why* an act is wrong, not just that it is.

  **40–45 mins: Synthesis**
  *   Acknowledge that most ethicists are "Moderate Generalists" (principles are default heuristics). Particularism is the claim that principles are not *foundational*.
  *   Clarify that Particularism does not mean "Anything Goes." It means "Everything Depends," but what it depends on is objective features of the situation, not whim.

  **45–50 mins: The Closing Question**
  *   **Ask:** "Imagine a Martian who memorized every true moral principle but lacked the ability to perceive which features were present in a complex situation. Could that Martian act morally?"
  *   **The Distinction:**
      *   **Student who thinks rules are boring:** "No, because rules are too rigid." (Misses the point).
      *   **Student who grasps Holism:** "No, because the principles don't *apply themselves*. Knowing the principle 'Lying is wrong' doesn't tell you if *this* utterance counts as a lie in this context. You need moral perception to see the reasons, not just the rules."

  ### 4. The Point of Failure
  **The "Ceteris Paribus" Slide.**
  The session will fail if you allow students to think Generalism allows for "all other things being equal" clauses.
  *   **The Trap:** A student says, "The Generalist can just say 'Don't take cars, *ceteris paribus*.'"
  *   **Why it breaks the session:** If principles can have infinite "unless" clauses, Generalism becomes unfalsifiable. Particularism claims that the "unless" conditions cannot be finitely listed.
  *   **What to Watch For:** If, during the Generalist Objection phase (30–40 mins), students start defending principles by adding exceptions ("Well, the rule is 'Don't lie *unless* it saves a life'"), you must stop them.
  *   **Correction:** Say, "Okay, add that exception. Now what about lying to spare feelings? What about lying in a play? If you have to add a new clause for every new case, is the rule doing the work, or is it just a list of your past judgments?"
  *   **Warning Sign:** If you see nodding heads when you explain Holism, but then hear "So we just need better rules" during the discussion, the sequence has collapsed. You must reiterate: **Particularism is not 'complex rules'; it is 'no rules at the foundation'.**

  ### Summary Checklist for the Instructor
  1.  **Don't** start with definitions. Start with the Car Case.
  2.  **Don't** let "Pleasure" be the example (too easy to moralize).
  3.  **Do** force the distinction between "The feature changed" vs. "The weight changed."
  4.  **Do** give the Generalist the "Bias/Teachability" weapon; don't strawman them as legalists.
  5.  **Watch** for the "Ceteris Paribus" rescue attempt; block it immediately.
  6.  **End** with the Martian/Perception question to test for structural understanding.
