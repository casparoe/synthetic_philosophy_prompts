      *   Bad question: "Are rules useful?" (Everyone says yes).
      *   Good question: Something about the *status* of the principle. "If you found a principle that never had exceptions, would that make it the foundation of morality, or just a lucky generalization?"

  7.  **Point of Failure:**
      *   The transition from "Principles have exceptions" to "Principles are impossible."
      *   Students think Generalists admit exceptions. Particularists say exceptions prove the principle isn't doing the work.
      *   *Warning Sign:* Students nodding at holism but then saying "So we just need better rules."

