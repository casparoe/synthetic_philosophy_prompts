answer: |-
  Your diagnosis is sharp, and your hypothesis about the *explanandum* is the most promising key to unlocking the stalemate. However, I believe the situation is more tangled than a simple case of two camps talking past one another. The impasse is not merely verbal, nor is it simply a matter of distinct projects sharing a name. It is a **constitutive priority dispute** regarding the relationship between mind and language, complicated by a shift in the philosophical center of gravity that makes the debate look "stalled" when it has actually metastasized.

  Here is a diagnosis of the disagreement, a pushback on your framing, and a proposal for what genuine progress would look like.

  ### 1. Diagnosis: Not Two Camps, But a Priority Dispute

  Your two-camp framing (Pragmatics/Assertion vs. Philosophy of Mind/Belief) is the standard map, but it obscures the actual fault line. Both camps agree that there is a tight connection between belief and assertion (the "Bridge Principle"). The disagreement is about **direction of explanation** and **constitutive dependence**.

  *   **The Mind-First View (e.g., Shoemaker, Moran, Bar-On):** The absurdity of assertion is derivative. The primary phenomenon is that the *belief state* itself is irrational or impossible. Assertion is absurd because it expresses an impossible mental state. The explanation relies on the transparency of belief or the constitutive norms of rationality.
  *   **The Language-First View (e.g., Griceans, Searle, some Knowledge-Norm theorists):** The absurdity of belief is derivative (or illusory). One *can* hold the belief (perhaps irrationally), but one cannot *voice* it because the act of assertion constitutively implies the belief one is denying. The explanation relies on the norms of speech acts.

  **The Real Impasse:** The stalemate exists because both sides can explain the *core* case ("It is raining but I don't believe it"), but they struggle to explain the **boundary cases** without ad hoc adjustments.
  *   If it's purely pragmatic, why is the *conditional* ("If it is raining, I don't believe it") so problematic, given no assertion is made? (This favors Mind-First).
  *   If it's purely doxastic, why is the commissive ("It is raining but I believe it isn't") often felt as *more* absurd than the omissive, given that contradictory beliefs are psychologically possible? (This favors Language-First or Rationality-First).

  Therefore, this is not a verbal dispute. It is a substantive dispute about **where the normativity originates**. Is the norm "Don't assert what you don't believe" fundamental, or is "Don't believe contradictions" fundamental?

  ### 2. Pushback: The Explananda Are Not Distinct

  Your working hypothesis is that the camps are explaining different data (utterance absurdity vs. belief impossibility). I must push back here: **If they were explaining different data, there would be no paradox.**

  Moore's Paradox is not the claim that "The sentence is weird to say." It is the claim that "The sentence is logically consistent and potentially true, yet it is *doxastically* inaccessible to the speaker."
  *   If the Pragmatist says, "It's fine to believe, just don't say it," they have **dissolved** the paradox, not solved it. They have denied the datum that the belief state itself is Moorean.
  *   If the Mind theorist says, "It's impossible to believe," they must explain why the assertion feels like a pragmatic violation rather than a confession of insanity.

  The paradox *is* the tension between the truth-conditions (consistent) and the epistemic conditions (unbelievable/unassertable). A theory that accounts for only one side of that tension fails to address the paradox. The impasse persists because neither side has successfully derived one side of the tension from the other without residue.

  ### 3. Pushback: The Literature Has Not Stalled; It Has Migrated

  You suspect the literature has stopped making progress. I argue it has shifted terrain, which creates the *illusion* of stagnation within the narrow "Moore" label. The debate has migrated into two adjacent fields where the real work is now happening:

  1.  **The Norm of Assertion:** Since Williamson (*Knowledge and Its Limits*), the debate is often framed as: Is the norm of assertion Knowledge or Belief? If the norm is Knowledge, Moorean sentences are unassertable because you cannot know "p & I don't believe p" (since you cannot know p if you don't believe it). This subsumes the Pragmatic view into Epistemology.
  2.  **Self-Knowledge and Transparency:** Richard Moran's *Authority and Estrangement* (2001) is the definitive modern "Mind-First" move. He argues the paradox reveals the difference between the *deliberative* stance (making up my mind) and the *theoretical* stance (observing my mind). This moved the debate from "Is it absurd?" to "What does this tell us about agency?"

  Progress has occurred, but it looks like fragmentation. The "Moore" label is now a testing ground for theories of self-knowledge and assertion norms, rather than a puzzle to be "solved" and filed away.

  ### 4. What Counts as Progress?

  Given this diagnosis, progress will not come from one camp defeating the other. It will come from a **unified account of the Belief-Assertion Link**.

  **The Decisive Test Cases:**
  To force common ground, we must look at cases where assertion and belief come apart.

  *   **The Supposition Test:** Consider: *"Suppose it is raining but I don't believe it."*
      *   I can suppose this for the sake of argument without absurdity.
      *   I can suppose: *"Suppose it is raining but John doesn't believe it."* (No problem).
      *   The Pragmatist struggles here: No assertion is made, so why does the first-person present version still feel "hot"?
      *   The Mind theorist struggles here: If it's impossible to *believe*, why is it possible to *suppose*? (Unless supposition doesn't require belief).
      *   **Progress Condition:** A theory must explain why *supposition* licenses the Moorean conjunction while *belief* and *assertion* do not, without treating them as wholly unrelated faculties.

  *   **The Third-Person Present:** *"It is raining but he doesn't believe it."*
      *   This is perfectly coherent.
      *   **Progress Condition:** The theory must explain the *asymmetry* between first-person and third-person without relying on a magical "privileged access" that begs the question. The Pragmatist says "I imply I believe, I don't imply he believes." The Mind theorist says "I am transparent to myself, not to him." The gap is narrowing, but the *mechanism* of transparency remains the battleground.

  *   **The Blindspot Generalization (Sorensen):**
      *   Roy Sorensen argues Moorean sentences are a species of **epistemic blindspots** (truths that cannot be known by a specific subject).
      *   *"p is true but no one knows p"* is a general blindspot.
      *   **Progress Condition:** If the Blindspot theory is right, the "Mind vs. Language" debate is a category error. The issue is logical/epistemic, not psychological or pragmatic. Progress requires the Pragmatists and Mind theorists to engage with the formal epistemology of blindspots. If they can reduce the pragmatic/doxastic constraints to epistemic constraints, the two camps merge.

  ### 5. Recommendation: How to Move the Needle

  If you are writing on this, do not try to adjudicate between Pragmatics and Mind. Instead, attack the **Bridge Principle**.

  The stalemate exists because both sides assume: *Assertion expresses Belief.*
  But *how* does it express it?
  *   Is it a convention? (Grice)
  *   Is it a constitutive norm? (Williamson)
  *   Is it an avowal? (Wittgenstein/Bar-On)

  **The most promising path forward** is to treat Moore's Paradox not as a puzzle about sentences or beliefs, but as a puzzle about **Rational Agency**.
  The reason "It is raining but I don't believe it" is absurd is that to assert it is to invite the listener to rely on your word, while simultaneously telling them your word is unreliable *by your own lights*. It is a **performative contradiction of agency**, not just logic or pragmatics.

  **Conclusion:**
  Your hypothesis that they are explaining different data is half-right: they are prioritizing different *symptoms* of the same disease. The disease is a fracture in the first-person perspective. Progress requires stopping the attempt to reduce the mental to the linguistic (or vice versa) and instead explaining why the first-person present tense generates a unique normative constraint that vanishes in the third-person or past tense. The "Blindspot" literature is the best candidate for common ground, as it formalizes the constraint without committing initially to mind or language.

  If you want to break the impasse, argue that Moore's Paradox is not about *truth* or *belief*, but about **commitment**. The absurdity arises because the speaker attempts to undertake a commitment (assertion) while explicitly revoking the authority required to undertake it (belief). This bridges the Pragmatic (commitments are linguistic) and the Mind (authority is psychological) without reducing one to the other.
