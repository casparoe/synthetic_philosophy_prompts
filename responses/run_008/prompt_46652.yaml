answer: |-
  This is a sharp observation, and it cuts to the heart of the "law in books" versus "law in action" distinction. You are describing a systemic feature of enforcement regimes that criminalize *intent-heavy* speech (like *Volksverhetzung* in Germany or similar provisions in France/Canada) rather than *conduct-heavy* speech (like direct threats or incitement to imminent violence).

  You are correct that standard labels like "chilling effect" or "overbreadth" do not capture this. A chilling effect implies suppression (less speech); you are describing *displacement* and *evolution* (different speech). Overbreadth implies the statute catches too much; you are describing a statute that, in practice, catches too *little* of the intended target due to evidentiary friction.

  Here is the brainstorming process on existing concepts, followed by the proposed coinage and its boundaries.

  ### Part 1: Brainstorming Existing Concepts (The "Near Misses")

  **1. Crime Displacement (Criminology)**
  *   **The Concept:** When enforcement pressure is applied to a specific type of crime, the criminal activity moves to a different location, time, or method.
  *   **Why it fits:** It captures the idea that the behavior doesn't vanish; it moves.
  *   **Why it fails:** Displacement is usually spatial (moving from Corner A to Corner B) or typological (burglary becomes fraud). It rarely accounts for *stylistic evolution within the same medium*. Displacement suggests the hate speech moves to a dark forum; your observation is that it stays in the public square but changes its *syntax*.

  **2. Goodhart's Law (Economics/Metrics)**
  *   **The Concept:** "When a measure becomes a target, it ceases to be a good measure."
  *   **Why it fits:** If the state's target is "convictions for hate speech," prosecutors will optimize for convictions (easy targets) rather than harm reduction (stopping the sophisticated ideologues).
  *   **Why it fails:** Goodhart's Law explains the *prosecutor's* behavior, not the *speaker's* adaptation. It explains why the drunk gets caught, but not why the ideologue learns to write in code. It lacks the evolutionary feedback loop you identified.

  **3. Selective Enforcement (Constitutional Law)**
  *   **The Concept:** Enforcement that discriminates based on race, religion, or political viewpoint, often violating Equal Protection.
  *   **Why it fits:** It acknowledges that not everyone who breaks the law gets caught.
  *   **Why it fails:** "Selective enforcement" carries a normative charge of *invidious discrimination* (targeting Group X over Group Y). Your observation is about *competence-based selection* (targeting Clumsy X over Sophisticated X). While the outcome may correlate with class or education, the mechanism is evidentiary, not necessarily identity-based.

  **4. Dog Whistle Politics (Political Science)**
  *   **The Concept:** Coded rhetoric that signals allegiance to a group while maintaining plausible deniability to the general public.
  *   **Why it fits:** This perfectly describes the *output* (the polished speech that survives).
  *   **Why it fails:** This describes the *speech act*, not the *legal mechanism* that produces it. It doesn't explain the causal link between the *threat of prosecution* and the *refinement of the code*.

  **5. Regulatory Arbitrage (Law & Economics)**
  *   **The Concept:** Exploiting differences between the spirit and the letter of the law, or between different jurisdictions.
  *   **Why it fits:** The sophisticated speakers are arbitraging the gap between "hateful sentiment" and "provable criminal intent."
  *   **Why it fails:** Arbitrage usually implies moving capital or activity to a different *regime*. Here, the activity remains in the same regime but changes its *form* to exploit evidentiary burdens.

  ---

  ### Part 2: The Coinage

  Since no single existing term captures the *enforcement-driven stylistic evolution* of speech, I propose we term this:

  ## **The Competence Filter**
  *(Formal definition: Enforcement-Induced Rhetorical Adaptation)*

  **Definition:**
  The **Competence Filter** is a systemic phenomenon in speech regulation where the probability of legal sanction is determined less by the *harm* or *content* of the expression, and more by the *evidentiary vulnerability* of the speaker. This creates a selection pressure that filters out low-competence violations (impulsive, explicit, traceable) while selecting for high-competence violations (calculated, coded, untraceable). The result is not a reduction in prohibited speech, but a "gentrification" of its register.

  **The Mechanism:**
  1.  **The Burden:** In hate speech regimes (unlike US First Amendment regimes), the state must often prove *intent* to incite hatred or disturb the peace, not just the utterance of slurs.
  2.  **The Friction:** Proving intent is resource-intensive. It requires context, pattern analysis, and often a confession or explicit language.
  3.  **The Selection:** Prosecutors (rationally optimizing for conviction rates) and Police (optimizing for clearance rates) target cases where the evidentiary friction is lowest.
  4.  **The Adaptation:** Speakers learn that *style* is a shield. Explicit slurs = high risk. "Demographic statistics" + "just asking questions" = low risk.
  5.  **The Outcome:** The public sphere is "cleansed" of crude hate, but permeated by polished hate. The law effectively subsidizes the legal counsel of the sophisticated ideologue.

  ---

  ### Part 3: Boundary Cases and Carving

  To ensure this concept holds water, we must test its edges.

  **1. Civil vs. Criminal Enforcement**
  *   **Does the Competence Filter apply?** **Yes, but differently.**
  *   **Analysis:** In criminal law, the state bears the burden of proof (*in dubio pro reo*). The Filter is strong. In civil law (e.g., workplace harassment, platform Terms of Service), the burden is often lower (preponderance of evidence), but the cost of defense is high.
  *   **Result:** The Filter shifts from *evidentiary* to *economic*. The crude speaker gets banned/fired immediately (low cost to adjudicate). The sophisticated speaker drags out the process, making enforcement too expensive. The Filter still selects for competence (specifically, the competence to endure litigation costs), but the stylistic pressure is slightly lower because civil codes often ban "hostile environments" rather than specific intent.

  **2. Corporate Communications (The Compliance Department)**
  *   **Does the Competence Filter apply?** **This is the Filter institutionalized.**
  *   **Analysis:** A corporation's legal team *is* a Competence Filter. They exist solely to ensure public speech survives regulatory scrutiny.
  *   **Result:** When a corporation issues a statement on a sensitive topic, it is "pre-filtered." It will never trigger hate speech laws because it is designed to be legally inert. The Competence Filter explains why corporate speech often feels vacuous—it has been processed through the filter to remove all liability-bearing edges.

  **3. The "Slip-Up" (When the Sophisticated Speaker Falters)**
  *   **Does the Competence Filter apply?** **Yes, this is the Filter snapping shut.**
  *   **Analysis:** If a sophisticated ideologue gets drunk or sends a DM from a personal account that gets leaked, they are suddenly subject to the same risk as the "drunk at the bus stop."
  *   **Result:** This confirms the theory. The immunity is not status-based; it is *performance-based*. As long as the performance of sophistication holds, the law does not touch them. The moment the performance breaks, the Competence Filter treats them exactly like the impulsive offender. This explains the high-profile prosecutions of public figures: they are prosecuted not because their speech is *worse*, but because their *operational security* failed.

  **4. Algorithmic Moderation (Private Enforcement)**
  *   **Does the Competence Filter apply?** **It inverts it.**
  *   **Analysis:** AI moderation tools often rely on keyword matching.
  *   **Result:** The Competence Filter might actually *fail* here. An AI might catch a specific slur (crude) but miss a coded dog whistle (sophisticated). However, as AI gets better at context, it begins to replicate the state's Competence Filter. Currently, human review teams act as the Filter: they ban the obvious, ignore the ambiguous.

  ---

  ### Part 4: What The Competence Filter Is Not

  To finalize the carving, we must distinguish it from its neighbors:

  *   **It is not the Chilling Effect:** The Chilling Effect suggests the speaker stays silent. The Competence Filter suggests the speaker speaks *differently*.
  *   **It is not Class Bias (strictly):** While education correlates with class, a working-class individual can learn the code, and an elite can be clumsy. The Filter selects for *knowledge of the legal boundary*, not just socioeconomic status, though the two are heavily correlated.
  *   **It is not Impunity:** The sophisticated speaker is not immune forever; they are immune only as long as their rhetoric remains within the "safe zone" of evidentiary ambiguity.

  ### Summary for the Scholar

  You have identified a **second-order effect of evidentiary burden**. In jurisdictions where hate speech is criminalized, the *mens rea* (intent) is the bottleneck. The **Competence Filter** describes how that bottleneck functions as a sieve: it catches the solid, obvious particles (crude speech) and lets the fluid, adaptable particles (coded speech) pass through.

  The long-run normative implication is profound: **The law inadvertently creates a premium on sophisticated hatred.** It makes hate speech a "skill good," accessible primarily to those with the literacy, patience, and legal awareness to navigate the Filter. This undermines the expressive function of the law, which is to declare certain ideas beyond the pale. Instead, the law declares certain *styles* of ideas beyond the pale.

  If you are writing on this, I would frame it as a critique of **enforcement feasibility**. The state cannot criminalize *sentiment*, only *expression*. When the expression is decoupled from the sentiment through rhetorical skill, the Competence Filter ensures that the law punishes the *incompetent bigot* while licensing the *strategic one*.
