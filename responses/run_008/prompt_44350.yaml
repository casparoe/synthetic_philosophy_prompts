answer: |-
  **Exam Question**

  **Formal Epistemology — Final Examination**
  **Time Allowed: 90 Minutes**

  **Question 1: The 1–99 Variant**

  Consider a variant of the Sleeping Beauty problem. A fair coin is tossed on Sunday. If it lands Heads, Beauty is interviewed once on Monday. If it lands Tails, Beauty is interviewed 99 times, once per day for 99 days. Between interviews, her memory is wiped so that each interview feels like her first. She knows all these details. Upon being interviewed, what should her credence be that the coin landed Heads?

  Answer the following in a unified essay:

  1.  **Credence Extensions:** If one accepts the standard Thirder reasoning in the classic case (1 Heads, 2 Tails), does this commit them to a credence of 1/100 in Heads here? Conversely, can the Halfer hold the line at 1/2 without an *ad hoc* stopping point? Explain the reasoning for each.
  2.  **Self-Locating Propositions:** What credence should each position assign to the proposition: "Today is my first interview"? Show how the calculations differ.
  3.  **The Betting Trap:** An interviewer offers Beauty a bet that pays $1 if the coin landed Heads, settled once at the end of the experiment, regardless of how many interviews occur. Many students argue that because Beauty wakes up 99 times more often on Tails, she should bet on Tails. Explain explicitly whether this bet supports the 1/100 credence, the 1/2 credence, or neither. Distinguish between bets settled per-interview and bets settled per-experiment.
  4.  **The Core Disagreement:** Based on the above, articulate what the Halfer and Thirder actually disagree about. Is self-locating uncertainty genuine evidence subject to Bayesian updating, or is it a matter of bookkeeping? Explain why the intuition that "1/100 is obvious" requires argument rather than assumption.

  ***

  **Model Answer**

  In the 1–99 variant, the Thirder's core commitment is that credence should track the proportion of possible awakenings relative to the total number of awakenings. Since there is one Heads-awakening and 99 Tails-awakenings, accepting the standard Thirder reasoning forces a credence of 1/100 in Heads. The rational agent treats each awakening as an equiprobable center within the reference class of all possible awakenings. To do otherwise would be to privilege one center without justification. Conversely, the Halfer holds that waking provides no new evidence regarding the coin toss itself. Since the prior was 1/2 and no relevant information about the coin state has changed, the credence must remain 1/2. For the Halfer, the number of awakenings is irrelevant to the probability of the coin state; only the coin toss mechanics matter.

  This divergence sharply impacts the proposition "Today is my first interview." For the Thirder, P(Heads) = 1/100 and P(Tails) = 99/100. Given Tails, the chance today is the first interview is 1/99. Thus, P(First) = (1 × 1/100) + (1/99 × 99/100) = 2/100 or 1/50. For the Halfer, P(Heads) = 1/2. P(First) = (1 × 1/2) + (1/99 × 1/2) ≈ 1/2. The Thirder sees being awake as strong evidence that it is not the first interview (mostly likely a later Tails day); the Halfer sees it as neutral. This calculation reveals that the Thirder treats the indexical "today" as a random variable, whereas the Halfer treats it as a fixed perspective that does not shift probability mass.

  The betting trap involves a wager paying $1 on Heads, settled once per experiment. Many argue that because a Tails-better wins 99 times per experiment, Beauty should bet on Tails. However, this conflates per-awakening utility with per-experiment payoff. Since the bet settles once regardless of interview count, the expected utility of betting on Heads is $1 × P(Heads). If Beauty cares about experiment-outcome wealth, she should price the bet at 1/2, even if her credence is 1/100. The Thirder must argue that credence governs betting only when stakes are per-awakening. If stakes are per-experiment, credence and betting odds come apart. This shows that betting arguments do not settle credence unless the stake structure matches the indexical uncertainty. A Thirder can consistently hold 1/100 credence while accepting 1/2 betting odds for per-experiment contracts, provided their decision theory weights outcomes by experiment rather than awakening.

  Ultimately, the disagreement concerns the nature of self-locating uncertainty. The Halfer treats indexical information as bookkeeping: waking confirms "I am awake," which was guaranteed, so no Bayesian update occurs. The Thirder treats it as genuine uncertainty: "Which awakening is this?" is a random variable subject to indifference. The 1–99 variant exposes the Halfer's potential arbitrariness: why stop at 1/2 regardless of replication? But it also exposes the Thirder's vulnerability: if credence is 1/100, does Beauty ignore favorable per-experiment bets? A robust answer acknowledges that credence guides action only relative to a decision theory that accounts for how many times the agent acts. The 1/100 intuition relies on counting centers, but rational action relies on counting outcomes. Recognizing this distinction prevents the error of assuming betting ratios directly reveal credence without adjusting for the number of decision nodes. The temptation to say "1/100 is obvious" fails if it cannot explain why betting behavior might legitimately remain at 1/2 odds depending on the contract structure.

  ***

  **Marking Scheme (20 Points Total)**

  **1. Thirder Consistency (4 points)**
  *   **Must Hit:** Student must state that standard Thirder reasoning commits to 1/100 credence in Heads based on the ratio of awakenings (1:99).
  *   **Typical Fumble:** Students often hedge, suggesting Thirders might still stick to 1/3 or fail to scale the logic to the new ratio.

  **2. Halfer Consistency (4 points)**
  *   **Must Hit:** Student must state that Halfers maintain 1/2 credence because the coin mechanics haven't changed and no new evidence about the coin was received.
  *   **Typical Fumble:** Students claim Halfers adjust slightly due to the extreme ratio, missing the "no new evidence" core tenet.

  **3. "First Interview" Calculation (4 points)**
  *   **Must Hit:** Student must correctly derive that Thirders assign ~1/50 and Halfers assign ~1/2 to "Today is first," showing the math or logical steps.
  *   **Typical Fumble:** Students assert the credences without calculating the conditional probability given Tails (1/99).

  **4. Betting Argument Distinction (4 points)**
  *   **Must Hit:** Student must distinguish between per-interview stakes (supports Thirder betting) and per-experiment stakes (supports Halfer betting), noting that per-experiment bets do not settle credence.
  *   **Typical Fumble:** Students argue that the betting odds *prove* the credence is 1/2 or 1/100 without acknowledging the stake structure mismatch.

  **5. Core Philosophical Divide (4 points)**
  *   **Must Hit:** Student must articulate that the dispute is about whether self-locating information counts as Bayesian evidence or merely indexical bookkeeping.
  *   **Typical Fumble:** Students describe the positions descriptively without identifying the underlying epistemological disagreement about evidence.

  **Distinction between A and B Answers:**
  An **A answer** explicitly recognizes that betting odds do not settle the credence question without a bridging decision theory (i.e., credence can be 1/100 while betting odds are 1/2 depending on stakes). A **B answer** correctly identifies the positions and calculations but conflates credence with betting ratios, assuming that the correct betting price *is* the credence.
