answer: |-
  There is no single, canonical noun in the historiography literature that functions as the precise antonym to "Whiggism" in the way you describe. You will not find a term like "Whiggism" that universally denotes this specific overcorrection. However, the phenomenon is well-recognized in the methodology of history of science and philosophy, usually discussed as a distortion of **Contextualism**, a misapplication of the **Symmetry Principle**, or a confusion regarding **Incommensurability**.

  If you require a label for your seminar to name this reflex, the most precise descriptive term is **"Asymmetrical Contextualism."**

  Below is the carving you requested: the genealogy of the move, why it differs from its neighbors, where a defensible version exists, and where it collapses into the indefensible asymmetry you are observing.

  ### 1. The Genealogy: Where the Reflex Comes From
  Your students and colleagues are drawing from three legitimate methodological streams but conflating them into a prohibition on evaluation.

  *   **Butterfield's Anti-Whiggism:** Herbert Butterfield's *The Whig Interpretation of History* (1931) warned against studying the past only to praise or blame it for contributing to the present. The legitimate lesson is: *Do not reduce the past to a precursor of the present.* The distortion is: *Do not compare the past to the present at all.*
  *   **Kuhnian Incommensurability:** Thomas Kuhn argued that competing paradigms often lack a neutral language for comparison (e.g., Aristotelian "motion" vs. Newtonian "motion"). The legitimate lesson is: *Be careful translating terms.* The distortion is: *Because terms differ, truth claims cannot be compared.*
  *   **The Strong Programme (Symmetry Principle):** The Sociology of Scientific Knowledge (Bloor, Barnes) argued that true and false beliefs should be explained by the same *types* of causes (social, historical), not by saying true beliefs are caused by nature and false ones by error. The legitimate lesson is: *Truth is not a historical explanation.* The distortion is: *Truth is not a historical category.*

  ### 2. The Carving: What This Is and Is Not

  **It is not Relativism.**
  As you noted, your colleagues accept current science/ethics as true. A relativist says, "Newton is not true, just true-for-Newtonians." Your colleagues say, "Newton is true, but it is unhistorical to say Aristotle was false." This is **Epistemic Asymmetry**: Realism for the present, Constructivism for the past.

  **It is not Standard Contextualism.**
  Standard contextualism (e.g., Quentin Skinner) demands we understand the *illocutionary force* of a past text: what the author was *doing* in their linguistic context. Skinner explicitly allows for the judgment that an author failed to do what they intended, or that their arguments were incoherent. The reflex you describe converts a rule of *charity* (understand them first) into a rule of *immunity* (judge them never).

  **It is a Category Error: Exegesis vs. Assessment.**
  The reflex conflates two distinct stages of historical inquiry:
  1.  **Reconstruction:** What did they mean? What were their standards? (Requires suspension of our judgment).
  2.  **Assessment:** Did they succeed by their own standards? Do their claims hold by ours? (Requires evaluation).
  Your students are treating the suspension of judgment required for Stage 1 as a permanent veto on Stage 2.

  ### 3. Proposed Terminology
  Since no standard term exists, I recommend using **"Asymmetrical Contextualism"** or **"The Evaluative Taboo."**

  If you want to be more provocative in the seminar, you might call it **"Temporal Exceptionalism."** This highlights the core inconsistency: the laws of logic and nature are treated as binding on the present, but optional for the past.

  ### 4. The Boundary Cases: Defensible vs. Indefensible
  You asked whether there is a defensible version of this refusal. There is, but its boundaries are much narrower than your students assume.

  #### A. The Defensible Zone (Genuine Incommensurability)
  There are cases where evaluation is genuinely historically inappropriate because the *criteria* of evaluation did not exist or the *referents* are different.
  *   **Example:** Criticizing Aquinas for failing to utilize Kantian deontological categories.
  *   **Why:** This is a category error. Aquinas was not playing the Kantian game. To evaluate him there is Whiggish.
  *   **Example:** Claiming Alchemy was "bad Chemistry."
  *   **Why:** Alchemy was not trying to be Chemistry; it had different ontological commitments (transmutation of substance vs. rearrangement of atoms).
  *   **The Rule:** We must suspend evaluation when the past thinker is operating within a conceptual scheme that lacks the vocabulary to formulate the question we are asking.

  #### B. The Indefensible Zone (The Asymmetry You Observe)
  This is where your students' reflex fails. Evaluation is permissible when the past thinker makes a claim about a shared reality or uses a shared logical structure.
  *   **Example:** Priestley on Combustion.
  *   **Why:** Priestley and Lavoisier were observing the *same* phenomena (calcination, weight gain). Priestley's phlogiston theory made empirical predictions that failed. To say he was "wrong" is not anachronistic; it is an empirical verdict. Refusing to say this protects bad science from history.
  *   **Example:** Invalid Arguments.
  *   **Why:** Logic is (arguably) timeless. If a 19th-century ethicist commits a formal fallacy (e.g., affirming the consequent), pointing this out is not "imposing our standards." It is pointing out that *their* standards of reasoning were violated.
  *   **The Rule:** If the past thinker invites comparison by making universal claims (about nature, logic, or human welfare), they invite evaluation.

  #### C. The Contested Boundary (Where the Debate Lives)
  This is where reasonable historians disagree, and where your seminar should focus.
  *   **Example:** Aristotelian Mechanics.
  *   **The Conflict:** Is it "wrong" to say Aristotle was wrong about $F=ma$?
  *   **Defensible Refusal:** Aristotle was not describing kinematic motion in a vacuum; he was describing *change* toward a natural end. To judge him by Newton's standards is to judge a fish by its ability to climb a tree.
  *   **Indefensible Refusal:** However, Aristotle *did* make claims about falling stones that are empirically falsifiable. We can say his account is less *predictively adequate* than Newton's without reducing his physics to "failed Newtonianism."
  *   **The Distinction:** We can judge **adequacy** (does it solve the problems it set out to solve? does it match the world?) without committing **Whiggism** (did it contribute to *my* current theory?).

  ### 5. How to Push Back in the Seminar
  When a student claims evaluation is "anachronistic," you can deploy the following distinctions:

  1.  **The "Truth vs. Explanation" Distinction:** Remind them of the Strong Programme. We can say Priestley was *wrong* (truth claim) without saying his error was caused by stupidity (historical explanation). The Symmetry Principle forbids using truth as an *explanation* for belief, not as a *verdict* on belief.
  2.  **The "Internal vs. External" Distinction:** Ask: "Was he wrong by *his* standards?" If a moral theorist claims to be deriving duties from reason but commits a logical fallacy, they have failed internally. Pointing this out is not anachronistic; it is immanent critique.
  3.  **The "Charity" Limit:** The Principle of Charity requires us to make the past thinker as rational as possible, not *perfect*. If the only way to make their argument valid is to assume they meant something they clearly did not mean, charity has become distortion.
  4.  **The Asymmetry Check:** Ask: "If a contemporary colleague made this argument, would you call it invalid?" If yes, ask why the dead are granted immunity from the laws of logic that bind the living.

  ### Summary
  The reflex is **Asymmetrical Contextualism**. It is a methodological tic born of a laudable fear of Whiggism but executed by conflating *understanding* with *exoneration*.

  *   **Whig History:** The past is a failed version of us.
  *   **Asymmetrical Contextualism:** The past is a coherent universe we cannot enter to judge.
  *   **Robust History:** The past is a foreign country with its own laws, but we are allowed to report on whether their bridges fell down.

  There is no established single word for this, but describing it as a **"conflation of contextualization with exoneration"** should give your students the precise conceptual handle they need to loosen their grip.
