answer: |-
  You have hit upon one of the stickiest problems in formal epistemology. It is a splendid question, and your intuitions are sharper than most philosophers'. You are wrestling with the distinction between **Standard Conditioning** (updating on a fact you take to be certain) and **Jeffrey Conditioning** (updating when the evidence itself is uncertain).

  Here is the short answer: There is a unifying principle, but it requires you to sacrifice the intuition that Cases 1 and 2 are fundamentally different from Cases 3 and 4. They are not. Your gut is misleading you on the first two.

  The principle is this: **Condition on the most specific description of your observation that you can accept with certainty.**

  Let us unpack this, address your specific cases, and see how it sorts out the order-dependence worry in Case 5.

  ### The Unifying Principle: Certainty of the Signal

  In Bayesian terms, you should always look for a proposition $E$ (Evidence) such that your new probability $P_{new}(E) = 1$. Once you have that, you use standard Bayes' rule.

  *   **In Cases 3 and 4 (Friend and Alarm):** You identified this easily. You are not uncertain about *whether the friend spoke* or *whether the alarm rang*. You are certain of the signal. The uncertainty lies in the reliability of the signal. You correctly chose to condition on the signal.
  *   **In Cases 1 and 2 (Toast and Doctor):** This is where your intuition wavers. You feel you are doing a "soft update" on the state of the world (the toast, the ankle). But formally, you ought to be doing the same thing as with the alarm.
      *   **The Toast:** You cannot be 100% certain "the toast is burnt." But can you be 100% certain "I am having a sensory experience as of burnt toast"? Yes. That sensory experience is your data. The link between that experience and actual burnt toast is the probabilistic bit (the likelihood).
      *   **The Doctor:** You are not updating on "My ankle is sprained." You are updating on "The doctor stated she is 80% confident." That statement is the certain fact.

  If you treat Cases 1 and 2 as Jeffrey Conditioning (soft updates on the external fact), you open yourself to coherence issues. If you treat them as Standard Conditioning (hard updates on the internal experience or testimony), you remain robust.

  So, to answer your first question: **You are allowed to do the soft partway update (Jeffrey) only when you cannot even formulate a description of your experience that you are certain of.** This is rare. Usually, you can always say, "It seems to me that X," and be certain of the *seeming*, even if not the X.

  ### The Order Dependence (Case 5)

  This is where the principle pays its dividends. You asked if the order of updating on the smell (80%) and the sight (70%) is a bug or a feature.

  If you use **Jeffrey Conditioning** directly on the hypothesis ("The toast is burnt"), it is a **bug**. Jeffrey updates are notoriously order-dependent unless strict constraints (called 'rigidity') are met. If you update on the smell, then the sight, you may get a different result than if you do sight then smell. This is because the first update shifts the background probabilities against which the second update is measured.

  If you use **Standard Conditioning** on the signals ("I had smell-experience S" and "I had sight-experience V"), it is **fine** (order-independent), provided the two signals are conditionally independent given the state of the toast.

  **The Verdict:** Your suspicion in Case 5 is correct. If you stick to the "soft update" method, the order matters, which is undesirable for two independent looks at the same toast. If you switch to the "condition on the signal" method (treating your nose and eyes as fallible instruments like the smoke alarm), the order ceases to matter.

  Therefore, the principle settles the matter: You should model Case 5 like Case 4. Treat your nose as an alarm that goes off 80% of the time when there is burning, and your eyes as an alarm that goes off 70% of the time. Condition on the alarms ringing. The order then becomes irrelevant.

  ### The Tired Calculation (Case 6)

  This is known as **higher-order evidence**. You are asking what to update on: the calculation or the tiredness?

  Under our principle, you condition on the conjunction of both.
  1.  **Fact 1:** "I produced a calculation result saying 'Safe'."
  2.  **Fact 2:** "I was tired when producing it."

  You treat your own brain exactly like the friend in Case 3 or the alarm in Case 4. You ask: "What is the probability that my brain outputs 'Safe' given the bridge is actually Safe, compared to the probability it outputs 'Safe' given the bridge is Unsafe, *when I am tired*?"

  You do not update on the calculation as if it were a direct window to reality. You update on the fact that a tired instrument produced a specific reading. Your gut was right: it is both. But structurally, it is identical to listening to a friend who you know is often exhausted.

  ### Which Intuition to Give Up?

  You mentioned you would rather know which verdict to give up than keep a complicated rule. Here is the trade-off:

  **You must give up the intuition that Cases 1 and 2 are fundamentally different from Cases 3 and 4.**

  It feels like they are different because the link between "smell" and "burnt toast" is immediate and subconscious, whereas the link between "friend's voice" and "coin flip" requires conscious reasoning. But logically, they are identical.
  *   **Nose** = A sensor with a false-positive rate.
  *   **Friend** = A sensor with a false-positive rate.
  *   **Doctor** = A sensor that outputs probability distributions.

  If you accept this, you gain a massive advantage: **You eliminate the order-dependence problem in Case 5.** By modelling all your inputs as certain signals from fallible instruments (including your own senses), you can use standard Bayesian conditioning throughout. This is mathematically well-behaved, order-independent (assuming conditional independence), and coherent.

  ### Summary

  1.  **The Rule:** Always condition on the *appearance* or the *signal* (which you can be certain of), not the *external fact* (which you cannot). Use Jeffrey Conditioning only as a last resort when you cannot even describe the signal precisely.
  2.  **Case 5:** The order dependence is a bug of the Jeffrey method. Switching to the "signal" method fixes it.
  3.  **Case 6:** Treat your tired self as a fallible instrument. Condition on "Tired Brain said X."
  4.  **The Sacrifice:** Accept that smelling burnt toast is logically the same sort of evidence as a friend telling you a coin landed heads. Both are noisy channels.

  It makes the maths cleaner, and whilst it feels slightly more cumbersome to treat your own nose as a separate instrument, it saves you from the incoherence of order-dependent beliefs.

  Cheers.
