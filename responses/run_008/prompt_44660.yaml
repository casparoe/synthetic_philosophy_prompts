answer: |-
  ### Preliminary Brainstorm: Lewis's Commitments

  Before we dissect Dagen H, let's lay out the ontological and decision-theoretic furniture Lewis requires in *Convention: A Philosophical Study* (1969). We need to be precise about what counts as a convention in his sense, because he is ruling out contracts, promises, and coercive laws as the *source* of conventionality (though law can signal them).

  *   **Regularity:** There must be a recurring pattern of behavior ($R$) in a population ($P$) in a recurrent situation ($S$).
  *   **Coordination Equilibrium:** $S$ must be a coordination problem. Agents prefer that everyone conforms to $R$ rather than no one conforms, and they prefer to conform *if* others conform. Crucially, there must be an alternative regularity ($R'$) that would have worked just as well (the **Arbitrariness** condition).
  *   **Expectations:** Conformity is sustained by a system of expectations. I do $R$ because I expect you to do $R$.
  *   **Common Knowledge:** It is not enough that I expect you to do $R$. I must know that you know that I know... ad infinitum, that we are all expecting $R$. This is the glue. Without common knowledge, the equilibrium is unstable.
  *   **Normativity:** The "ought" is hypothetical. You ought to drive on the right *because* you want to avoid crashing and you know everyone else is driving on the right. It is rational, not necessarily moral.
  *   **Salience:** When multiple equilibria exist (Left vs. Right), something must make one stand out as the focal point (Schelling point). Precedent is the usual salience, but explicit agreement or authority can serve.

  ---

  ### Analysis: Dagen H through the Lewisian Lens

  Your case is a fascinating stress test for Lewis. It is a "phase transition" in social ontology. Let's map the Swedish traffic switch onto the criteria above.

  #### 1. The Coordination Problem and Arbitrariness
  The situation $S$ is "operating a vehicle on a public roadway." The regularity $R$ is "keep to the specified side."
  *   **Equilibria:** (Left, Left) yields high payoff (safety, flow). (Right, Right) yields high payoff. (Left, Right) yields negative payoff (collision).
  *   **Arbitrariness:** Lewis insists a convention must be arbitrary in the sense that $R'$ could have served the purpose. Here, Left and Right are functionally symmetric regarding the *goal* of coordination (avoiding crashes). However, as you noted, the prevalence of left-hand drive (LHD) cars in Sweden introduced a slight payoff asymmetry. (Right, Right) + LHD cars is slightly more efficient for overtaking than (Left, Left) + LHD cars.
      *   *Philosophical Note:* Lewis allows for slight asymmetries. As long as the *coordination* benefit swamps the *efficiency* difference, it remains a coordination problem. If the efficiency difference were massive (e.g., one side leads to certain death due to terrain), it wouldn't be a convention; it would be a law of nature. Here, the car design pressure was significant but not decisive without the coordination shift.

  #### 2. Common Knowledge and the Information Campaign
  This is where Dagen H shines as a confirmation of Lewis. A convention cannot shift merely by one person deciding to change. It requires a shift in the *system of expectations*.
  *   **The Problem:** If I switch to the right on Sept 2, I die. If I switch on Sept 4 while you stay left, we crash. We need to switch simultaneously.
  *   **The Solution:** The saturation campaign (Högertrafikomläggningen) was a machine for manufacturing **common knowledge**. It wasn't just informing you of the rule; it was informing you that *everyone else* was informed, and that *everyone else* knew that *everyone else* was informed.
  *   **Lewisian Mechanism:** The campaign transformed the switch from a risky gamble into a secure equilibrium selection. It ensured that the expectation "Others will drive Right after 05:00" was robust enough to override the entrenched expectation "Others drive Left."

  #### 3. Salience and the Schelling Point
  Thomas Schelling (whom Lewis draws on heavily) argued that in the absence of communication, agents converge on focal points.
  *   **The Date:** September 3, 1967, at 05:00. This is a textbook Schelling point. It is precise, public, and unique.
  *   **Authority as Salience:** Lewis acknowledges that while conventions are usually tacit, an authoritative announcement can create the salience required to select an equilibrium. The State didn't just command; it provided the *focal point* around which reciprocal expectations could crystallize. Without the specific time, the common knowledge would be too fuzzy ("sometime in 1967") to sustain the equilibrium.

  ---

  ### The Hard Philosophical Questions

  Now, let's tackle the specific tensions you identified. These are the points where the rubber meets the road for social ontology.

  #### 1. The 1955 Referendum: Unconditional vs. Conditional Preference
  You suggest the referendum measured the wrong quantity: an unconditional preference ("I want Left") rather than a conditional one ("I want Left *if* you do"). This is a sharp insight. Let's defend it against the charge of being an *ad hoc* dodge.

  **The Defense:**
  In decision theory, we distinguish between preference over *outcomes* and preference over *strategies*.
  *   **Referendum Question:** "Should Sweden keep left-hand traffic?" This asks for a preference over the *state of the world* (Outcome: Left-Traffic Sweden).
  *   **Lewisian Requirement:** A convention relies on a preference over *strategies conditional on others' actions*.
  *   **The Mismatch:** A voter in 1955 could rationally vote "Keep Left" for two reasons:
      1.  They prefer the (Left, Left) equilibrium to the (Right, Right) equilibrium (perhaps due to habit cost).
      2.  They believe the (Left, Left) equilibrium is more *stable* given the current common knowledge.
  *   **Why it's not a dodge:** Lewis's theory predicts that conventions have inertia. The "cost" of switching equilibria is high (retraining, new signs, risk of transition). The referendum captured the *inertia* of the existing convention. It measured the attachment to the *current* equilibrium, not the abstract desirability of the *alternative* equilibrium.
  *   **The Override:** Parliament overridden the referendum not by ignoring preferences, but by altering the **payoff structure** of the coordination game. By emphasizing the danger of neighbors (Norway/Denmark) and the car design mismatch, they argued that the (Right, Right) equilibrium had a higher *absolute* utility than previously thought.
  *   **Verdict:** Your intuition holds. The referendum measured the *basin of attraction* of the old convention, not the intrinsic value of the coordination itself. Lewis's account survives because it distinguishes between the *existence* of a convention (based on current expectations) and the *optimality* of the convention (based on external payoffs).

  #### 2. The Transition Window: A Gap in Ontology?
  You ask about the hours when traffic was banned. Is this a time where no convention exists? Does Lewis predict this?

  **Analysis:**
  *   **The Gap:** Technically, yes. A Lewisian convention is a *regularity in behavior*. If no one is driving, there is no behavior, hence no regularity. During the ban, the old convention (Left) was suspended, and the new one (Right) had not yet been instantiated.
  *   **Predictive Power:** Lewis doesn't explicitly predict a "null behavior" window, but his logic implies the necessity of **decoupling**. To switch from Equilibrium A to Equilibrium B without passing through a state of disastrous miscoordination (A, B), you need a moment where the payoff matrix is suspended.
  *   **The Ban's Function:** The traffic ban acted as a "system reset." It prevented early adopters or laggards from creating noise during the critical update of common knowledge. It ensured that the first instance of the new regularity occurred when the common knowledge of the switch was at its peak (05:01).
  *   **Ontological Status:** During the ban, the convention existed only as a **disposition** or a **plan**, not as a regularity. Lewis focuses on the realized regularity, but a sophisticated extension of his view (perhaps incorporating Bratman's shared intention) would say the convention persisted as a shared plan during the hiatus.
  *   **Verdict:** Lewis's strict behaviorism strains here. He defines convention by what people *do*, not what they *plan to do*. The ban reveals that conventions are actually *normative expectations* that can survive brief interruptions in behavior, provided the common knowledge remains intact.

  ---

  ### Strains and Silences in the Theory

  Here is where we must be honest about the limitations of Lewis's 1969 framework when applied to Dagen H.

  **1. Distribution of Costs (The Silent Variable)**
  Lewis treats the coordination problem as if the payoffs are roughly symmetric for all agents. "We all want to coordinate."
  *   **Reality:** The costs of Dagen H were not symmetric. Elderly drivers, rural populations, and owners of right-hand drive cars bore higher adjustment costs than young, urban drivers with LHD cars.
  *   **The Strain:** Lewis's account explains why we coordinate, but not *who pays* for the switch. It is silent on the political economy of convention change. The theory assumes the switch is Pareto-improving (or close enough), but in reality, it was a Kaldor-Hicks improvement (winners could compensate losers). The state compensated this via the information campaign, but Lewis doesn't model the compensation mechanism.

  **2. Persistence of the Old Convention (The Border Puzzle)**
  You asked why the Left convention survived so long despite incompatible neighbors.
  *   **Lewis's Answer:** **Precedent.** The salience of "what we did yesterday" is the strongest focal point. The friction at the borders was a localized coordination problem, easily solved by signs and slowing down. The internal network effect (millions of Swedes coordinating) outweighed the external border friction.
  *   **Critique:** This works, but it highlights that conventions are path-dependent. Lewis explains stability well, but his account of *instability* (why change happens *now* and not 20 years ago) relies heavily on external shocks (car design, trade). It underestimates the internal political machinery required to overcome precedent.

  **3. Engineered vs. Grown Conventions**
  *   **Grown:** Phone calls drop back to the original caller if the line cuts. This is pure Lewis. Tacit, evolutionary.
  *   **Engineered:** Dagen H. Explicit, legislated, enforced.
  *   **The Difference:** Lewis worries about conflating convention with law. He argues law works *by creating* convention (by making the rule salient). Dagen H is the ultimate example of Law *becoming* Convention.
  *   **Strain:** In 1967, compliance was partly due to fear of police (law) and partly due to expectation of others (convention). Over time, the law faded into the background, and it became pure convention. Lewis's binary distinction (Convention vs. Law) is a bit too clean here. Dagen H shows a spectrum where Law is the *midwife* of Convention.

  ---

  ### Verdict: Confirmation, Anomaly, or Unanticipated?

  **Verdict:** **Confirmation via Stress Test.**

  Dagen H is not an anomaly for Lewis; it is a dramatic validation of the **Common Knowledge** and **Salience** components of his theory.
  *   It confirms that conventions are equilibrium selections sustained by expectations.
  *   It confirms that shifting equilibrium requires a massive, simultaneous update to those expectations (the campaign).
  *   It confirms that the specific content (Left vs. Right) is arbitrary relative to the need for coordination.

  **However,** it exposes a limitation Lewis didn't fully flesh out: the role of **centralized authority** in solving the "Common Knowledge" problem. Lewis focused on tacit conventions emerging from decentralized interaction. Dagen H shows that in complex modern societies, the "Common Knowledge" required for coordination is often too expensive to generate tacitly. It requires a broadcaster (the State).
  *   **Unanticipated Element:** Lewis didn't anticipate the *industrial scale* of common knowledge production required for modern convention switching. He imagined small communities or repeated games. Dagen H is "industrialized convention."

  **Final Philosophical Take:**
  The smoothness of the transition supports the idea that once common knowledge is secured, the normative force of the convention is immediate. People didn't drive on the right because they loved the right side; they did it because they *knew* you would. That is the essence of Lewis's insight. The referendum result is irrelevant to the *logic* of the convention once the equilibrium shift is successfully coordinated. The "ought" of the convention overrode the "wanted" of the referendum.

  ---

  ### Historical Note & Corrections

  You asked me to note any historical garbling separately. Your recollection is remarkably accurate, but there are two minor nuances worth flagging for precision:

  1.  **Referendum Numbers:** You recalled "four in five" (80%). The actual result in the 1955 advisory referendum was **82.9% against** the change (i.e., for keeping left), with 15.5% for the change. Your "four in five" is functionally correct for philosophical analysis, but the opposition was slightly more overwhelming than 80%.
  2.  **Steering Wheel Mismatch:** You noted most Swedish cars had the steering wheel on the left (LHD) while driving on the left. This is correct and was a primary safety argument for the switch. However, it is worth noting that the Swedish government actually *subsidized* the conversion of buses and commercial fleets to match the new system, and there was a temporary shortage of suitable vehicles immediately post-switch. This reinforces the "Cost" critique above—the state had to absorb the transition costs to make the new equilibrium viable.
  3.  **The Ban:** The traffic ban was not total for the entire country for hours. It was a ban on *non-essential* traffic between 01:00 and 06:00 on the day. Essential vehicles (emergency, etc.) were exempt but had to follow specific protocols. This nuance doesn't change the philosophical analysis of the "gap," but it shows the transition was managed with logistical precision rather than a hard "off switch."

  Your grasp of the case is robust enough that these details do not alter the philosophical mapping, but they sharpen the picture of the *costs* involved in engineering common knowledge.
