prompt: |-
  Act as a professional philosopher working in social ontology and decision theory, and think carefully before answering — start with a quick brainstorm of what Lewis's account of convention in his book Convention actually commits us to, then do the real analysis. I'm a retired physicist who's only recently gotten serious about philosophy, so keep the formalism light but don't dumb it down.

  My case: Sweden's 1967 switch from left- to right-hand traffic, Dagen H, 3 September 1967. The salient facts as I understand them: Sweden had driven on the left for centuries while all its neighbours drove right, and most Swedish cars had the steering wheel on the left anyway, which made overtaking genuinely dicey. A 1955 advisory referendum had gone heavily for keeping left — something like four in five, if I remember right — but parliament went ahead anyway. The switch itself was preceded by years of preparation and a saturation public-information campaign, and on the day traffic was banned for hours while signage and signals were physically swapped.

  Run the episode through Lewis's account of convention as a coordination equilibrium sustained by reciprocal expectations and common knowledge. I want a careful mapping: what the coordination problem actually was (mismatched neighbours plus mismatched steering), where the arbitrariness lies, how the announcement campaign does the work of manufacturing common knowledge of the new equilibrium, and whether the announced date becomes salient in roughly Schelling's sense. Then the parts I find most interesting. First, the 1955 referendum: conventions have a normative character on Lewis's picture — each party wants the others to conform — but apparently they're not majoritarian, so what exactly was overridden? One thought I'd like you to take seriously and then either defend or dismantle: the referendum arguably measured the wrong quantity, since a vote about what Sweden should do reads as an unconditional preference, whereas Lewis's account only cares about conditional ones — would you rather drive on the right *if everyone else did*? Does that rescue the theory from the referendum result, or is it an ad hoc dodge? Second, the transition window when traffic was banned: is that literally a stretch of time in which no convention exists at all, and does Lewis's framework in a sense predict that such a gap is necessary for switching? Then be honest about where the theory is silent or strains: who bore the costs of the switch and whether that matters to the account, why the old convention survived as long as it did with incompatible neighbours on every land border, and whether an engineered convention like this differs in kind from a grown one. Finally, tell me what the episode — which by most accounts went startlingly smoothly — shows about the theory: confirmation, an anomaly, or a case Lewis never really anticipated? Correct me if I've garbled any of the history along the way, but note it separately rather than quietly building the analysis on my version of events.
