answer: |-
  The short answer is: **Neither of them made a mathematical error.** Your tutor is using a provocative shorthand that is technically imprecise, and the conflict between Rawls and Harsanyi is not about arithmetic or logic, but about **axioms** and **moral metaphysics**.

  They are arguing past each other on purpose. Harsanyi is proving what follows *if* you accept certain economic assumptions about rationality. Rawls is arguing that those assumptions are morally inappropriate for questions of justice.

  Here is the breakdown of why they don't contradict each other mathematically, and where the real disagreement lies.

  ### 1. Harsanyi's Theorem: A Conditional Proof
  John Harsanyi's Aggregation Theorem (1955) is a formal mathematical result. It essentially says:

  > **If** (1) individuals satisfy Von Neumann-Morgenstern (vNM) expected utility axioms,
  > **And If** (2) the social planner satisfies vNM axioms,
  > **And If** (3) the Pareto principle holds (if everyone prefers X to Y, society prefers X to Y),
  > **Then** the social welfare function *must* be a weighted sum of individual utilities (Utilitarianism).

  This is mathematically sound. It is a valid deduction. If you accept the premises, the conclusion follows. Harsanyi isn't claiming this proves Utilitarianism is the "Truth" from thin air; he is claiming that Utilitarianism is the only consistent way to aggregate preferences *given those specific definitions of rationality*.

  ### 2. Rawls' Critique: Attacking the Premises, Not the Math
  Rawls is not arguing that $1 + 1 \neq 2$. He is not saying the arithmetic of utilitarianism is wrong. He is arguing that the **analogy** used to justify that arithmetic is false.

  Classical Utilitarianism (and Harsanyi's derivation) relies on an analogy between **individual rational choice** and **social choice**.
  *   **Individual:** One person sacrifices a present pleasure for a greater future gain. This is rational.
  *   **Utilitarian:** Society sacrifices one person's liberty for the greater gain of the majority. This is argued to be rational for the "social body."

  Rawls' "separateness of persons" objection says this analogy fails. A single person exists across time as one entity; society is composed of distinct entities with distinct rights. You can balance losses and gains *within* a life, but you cannot morally balance losses and gains *across* lives simply by adding them up.

  So, when your tutor says Rawls proved it "mathematically incoherent," what they mean is that Rawls proved the **conceptual framework** required to make the math work (treating society as a single super-person) is morally incoherent. Rawls is challenging the **soundness** of Harsanyi's argument (the truth of the premises), not the **validity** (the logic).

  ### 3. The Technical Divergence: Risk vs. Uncertainty
  The clearest place to see that no math error occurred is in how they model the "Veil of Ignorance." Both Rawls and Harsanyi use a thought experiment where you choose social rules without knowing who you will be in society.

  *   **Harsanyi (Risk):** He models this as a problem of **risk**. You assume there is an equal probability of being anyone. If you maximize *expected utility* under these conditions, the math dictates you maximize the average utility. (This leads to Utilitarianism).
  *   **Rawls (Uncertainty):** He models this as a problem of **radical uncertainty** (Knightian uncertainty). He argues you cannot assign probabilities to who you might be. Furthermore, because the stakes are so high (your basic liberties and life prospects), it is irrational to gamble. A rational actor would use the **Maximin rule** (maximize the minimum position). (This leads to the Difference Principle).

  Both are mathematically consistent decision rules. Harsanyi uses Expected Utility Theory; Rawls uses Decision Theory under Uncertainty. They get different results because they choose different mathematical tools to model the moral situation.

  ### 4. The Problem of Interpersonal Utility
  There is one area where Rawls does touch on something resembling "mathematical incoherence," and this might be what your tutor is referencing.

  Harsanyi's theorem requires **cardinal, interpersonally comparable utility**. You have to be able to say, "Person A's joy is worth 5 units, and Person B's pain is worth 3 units," and meaningfully add them.

  Rawls (following many economists and philosophers) argues that there is no objective metric to measure utility across different people. Preferences are ordinal (I like X more than Y), not cardinal (I like X twice as much as Y). If utility cannot be measured cardinally across persons, the utilitarian sum **cannot be calculated**.

  In this specific sense, Rawls argues Utilitarianism is operationally incoherent: it demands a calculation that cannot be performed. Harsanyi counters that we can derive cardinal utility from choices under risk. This remains a live technical debate in welfare economics, but it is not a case of one side having a "proof error."

  ### Summary: Who is Right?
  *   **Harsanyi is right** that *if* you accept standard economic rationality axioms and the Pareto principle, Utilitarianism is the logical outcome.
  *   **Rawls is right** that those axioms may not be appropriate for defining *Justice*. Justice might require constraints (rights) that trump utility maximization, regardless of what the aggregation theorem says.

  **Verdict on your tutor:**
  Your tutor is overstating the case. Rawls did not prove Utilitarianism is *mathematically* incoherent (like proving $2+2=5$). He argued it is **morally** incoherent because it relies on a false conception of the person and society.

  The "error" isn't in the math; it's in the **philosophical interpretation of the variables**. Harsanyi thinks the variables represent rational preferences; Rawls thinks they represent moral claims that cannot be aggregated.

  **Recommendation:**
  Tell your tutor you've read Harsanyi's Aggregation Theorem. Ask them specifically: *"Does Rawls object to the validity of Harsanyi's derivation, or does he object to the normative relevance of Harsanyi's axioms?"* The answer is the latter, which clarifies that there is no mathematical contradiction, only a philosophical one.
