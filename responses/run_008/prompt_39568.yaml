      *   *Section 2: Money Pumps and Exploitation.* Clarify the money pump concept. It's usually about intransitivity. Door-to-door is more about *manipulation* and *dynamic inconsistency*. But yes, the state acts as a pre-commitment device. Connect to "Soft Paternalism."
      *   *Section 3: Underdetermination.* This is the crux. List the competing theories.
