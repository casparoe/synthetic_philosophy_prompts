answer: |-
  You have stumbled onto one of the deepest fault lines in the history of physics. Your intuitions are remarkably sharp—most of them align with General Relativity (GR), but there is one specific verdict that needs to be overturned, and one conceptual shift that will make the whole picture cohere.

  Here is the breakdown of your list, the unifying principle, and the specific correction you need.

  ### The Unifying Principle: Proper Acceleration & Spacetime Geometry

  Your tentative principle ("meaningful when it shows up as internal stresses/tidal effects") is extremely close to the modern physical definition of **Proper Acceleration**.

  **The Principle:** *Motion is physically absolute (meaningful) if and only if it represents a deviation from a geodesic (inertial path) in spacetime, detectable by local instruments (accelerometers, gyroscopes, strain gauges) without reference to external objects.*

  *   **Uniform Velocity:** You are following a geodesic. An accelerometer reads zero. **Meaningless.**
  *   **Acceleration/Rotation:** You are deviating from a geodesic. An accelerometer reads non-zero. **Meaningful.**

  This principle saves your verdicts on the Bucket, the Globes, the Hoop, and the Oscillating Particles. In all those cases, something is being forced off its natural inertial path, creating internal stress (tension in the cord, water climbing, hoop tension).

  ### The Verdicts: Which Stand and Which Fall

  **1. The Bucket & Two Globes (Empty Universe)**
  *   **Your Verdict:** Real rotation.
  *   **Physics:** **Correct.**
  *   **Why:** Even in an empty universe, spacetime has a structure (the metric). Rotation is defined relative to the local inertial frames determined by that metric, not relative to other matter. The cord goes taut because the globes are trying to follow straight lines in spacetime, but the cord forces them into circles. That deviation creates tension.

  **2. Uniform Velocity**
  *   **Your Verdict:** Meaningless.
  *   **Physics:** **Correct.**
  *   **Why:** Galilean/Einsteinian Relativity. No local experiment distinguishes rest from constant velocity.

  **3. Single Point Particle Spinning**
  *   **Your Verdict:** Meaningless.
  *   **Physics:** **Correct (Classically).**
  *   **Why:** Classically, a point has no orientation. You cannot define an axis of rotation for a mathematical point. (Quantum mechanically, "spin" is intrinsic angular momentum, but that's a different category; it doesn't imply the particle is physically whirling).

  **4. Single Spinning Hoop (Empty Universe)**
  *   **Your Verdict:** Meaningful (due to tension).
  *   **Physics:** **Correct.**
  *   **Why:** You worried that "size matters" was a weak defense. It isn't. Size matters because **rotation is a differential effect.** To rotate, part of you must be accelerating relative to another part of you (or relative to your own center of mass). A hoop has spatial extension; different segments of the hoop are trying to move in different straight lines. To keep them in a circle, you need tension. That tension is a local, measurable observable. The point particle has no "other parts" to stress against.

  **5. Two Oscillating Particles**
  *   **Your Verdict:** Meaningful.
  *   **Physics:** **Correct.**
  *   **Why:** If the distance oscillates without a spring, they are accelerating relative to the local inertial frame. If they are tied by a spring, the spring compresses/extends. Proper acceleration is occurring.

  **6. The Whole Universe Rotating**
  *   **Your Verdict:** Meaningless ("Relative to what?").
  *   **Physics:** **INCORRECT. (This is the one to overturn).**
  *   **Why:** This is where your Machian intuition clashes with General Relativity.
      *   **Mach's View:** If everything rotates together, there is no relative motion, so no centrifugal force. Rotation is only meaningful relative to the "fixed stars."
      *   **Newton/GR View:** Rotation is meaningful relative to **spacetime itself.**
      *   **The Evidence:** In GR, a rotating universe (like the Gödel metric) is physically distinct from a non-rotating universe (like the FLRW metric). If the whole universe were rotating, you would observe **Coriolis forces** acting on light and projectiles. You could set up a giant ring laser gyroscope (Sagnac effect) that would detect the rotation of the cosmos relative to the local inertial frame.
      *   **The Resolution:** You asked, "Relative to WHAT?" The answer is: **Relative to a gyroscope.** A free-floating gyroscope defines "non-rotation." If the galaxies are swirling around the axis of a free-floating gyroscope, the universe is rotating. It is an observable, absolute fact in GR.

  ### The Two-Cluster Problem

  You asked about a universe with exactly two clusters of matter, rotating relative to each other.

  *   **Do they orbit a midpoint?** Yes. Conservation of momentum defines a Center of Momentum (CoM) frame.
  *   **Is it meaningful?** Yes.
  *   **Why:** Even with only two clusters, spacetime is not "nothing." The gravitational field connects them. If they are orbiting, they are emitting gravitational waves (in GR) and experiencing centripetal acceleration.
  *   **The "Who Orbits Who" question:** It does not make sense to say the small one orbits the big one in an absolute sense. They both orbit the **Center of Mass** of the system. However, if one is vastly more massive, the CoM is inside the larger cluster, making it *look* like the small one orbits the big one. But physically, both are deviating from straight lines in spacetime around the common CoM.

  ### Why Your Intuition Stumbled (Newton vs. Mach vs. Einstein)

  Your confusion comes from mixing three different frameworks:

  1.  **Newton:** Space is a container. Rotation is absolute relative to the container. (Explains Bucket/Globes).
  2.  **Mach:** Space is nothing. Inertia is caused by distant matter. Rotation is only relative to the bulk mass of the universe. (Explains your "Whole Universe" gut feeling).
  3.  **Einstein (GR):** Spacetime is a dynamic field. It exists even without matter (mostly), but matter curves it. Rotation is absolute relative to the **local inertial structure of spacetime.**

  **The Crucial Distinction:**
  Einstein hoped GR would validate Mach (that inertia comes from matter). It turned out he was wrong. In GR, even in a completely empty universe (Minkowski space), a spinning hoop feels tension. Spacetime provides the "reference" for rotation, not the distant stars. The distant stars just happen to align roughly with the local inertial frames in our universe, which is why Mach's principle feels so intuitive.

  ### Summary of Corrections

  1.  **Keep your "Internal Stress" Principle.** It is the operational definition of Proper Acceleration.
  2.  **Overturn the "Whole Universe Rotating" verdict.** It is observable via gyroscopes and light propagation. It is not relative to matter; it is relative to the spacetime metric.
  3.  **Defend the Hoop.** Size matters because rotation requires spatial extension to generate differential acceleration (tidal forces within the object).
  4.  **Accept Spacetime as the "Thing".** When you ask "Relative to what?", the answer is no longer "Absolute Space" (Newton) or "Distant Stars" (Mach). It is "The Local Inertial Frame defined by the Spacetime Metric."

  Your gut was 90% right. The missing 10% is realizing that Spacetime is a physical entity in its own right, capable of defining rotation even when the universe is otherwise empty or rotating as a whole.
