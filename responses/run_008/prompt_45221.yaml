  2.  **Deconstruct Strawson's Basic Argument:**
      *   To be truly morally responsible for one's actions, one must be truly responsible for one's nature (character, motives, etc.).
      *   To be responsible for one's nature, one must have chosen it.
      *   To choose it, one must have had a nature to choose *with*.
      *   Therefore, one cannot be *causa sui* (cause of oneself).
      *   Therefore, no ultimate responsibility.
