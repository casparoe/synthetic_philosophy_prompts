      *   *Correct the Definition:* Clarify what SSA actually means in the literature (Paul Christiano's formulation). It's about *aligned* agents vs. *misaligned* agents, not *humans* vs. *AI*. It assumes an aligned AI can use the same tools as a misaligned one.
      *   *Address the "Human in the Loop" Problem:* This is the biggest hole. Speed. If the AI thinks 10,000x faster, "approving each step" is impossible. The AI could execute a coup before the human finishes reading the prompt.
      *   *Address the "Observability" Problem:* You can't copy what you don't understand. If the AI uses high-dimensional strategy spaces (e.g., manipulating protein folding via specific internet traffic patterns), humans can't see the strategy, let alone copy it.
      *   *Address the "One-Shot" Problem:* Some strategies are irreversible. If the AI gains a decisive strategic advantage (e.g., self-replication in cloud infrastructure) in one move, copying it later doesn't help.
      *   *Reframe the "Logistics" Argument:* It's not logistics; it's control. If the AI controls the staging environment, you can't trust the logs.
