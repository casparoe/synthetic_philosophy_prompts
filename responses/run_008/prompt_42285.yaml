    "confidence": "for each claim above, a confidence level (low/medium/high) with a one-line reason — I want to know where you're just working from the standard lore vs actually sure",
    "least_sure_point": "the single thing in your whole answer you're least confident about, and what would settle it"
  }

  Please be honest about confidence levels rather than sounding uniformly authoritative, and if something in my reconstruction of the chapter is too garbled for you to audit, say so in the least_sure_point field instead of guessing what the book meant.
