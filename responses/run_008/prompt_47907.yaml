answer: |-
  Your friend's principle is a good start, but it is too coarse. It distinguishes between "the world stayed still" and "the world changed," but it fails to distinguish between **changing the numbers in the equation** (which should rescue a theory) and **changing the equation itself** (which should falsify it).

  Under your friend's principle, both Malthus and Ehrlich get "rescued" because agricultural technology and demographic behaviors were inputs that changed. But your gut correctly rejects this. You recognize that Malthus and Ehrlich didn't just get the *values* of their inputs wrong; they got the *relationships* between those inputs wrong. Hubbert, conversely, got the relationship right (depletion curves) but underestimated the *volume* of the resource (recoverable reserves).

  Here is the repaired principle, tested against your cases, and applied to your new ones.

  ### The Repaired Principle: The Causal Topology Test

  A long-run prediction is **rescued** (right but early/parameter-shifted) if the intervening years revealed new *values* for variables the model already acknowledged, without altering the causal arrows between them.

  A long-run prediction is **falsified** (wrong mechanism) if the intervening years revealed that the *causal structure* itself was incorrect—specifically, if a variable thought to be inelastic proved elastic, or if a feedback loop thought to be positive proved negative (or vice versa).

  In short: **Did the world change the inputs, or did it change the rules?**

  ### Testing Against Your Verdicts

  **1. Malthus (Verdict: Wrong)**
  *   **Friend's Principle:** Rescue (Ag tech changed).
  *   **Causal Topology Test:** **Falsified.**
  *   **Why:** Malthus's model relied on a specific causal link: *Increased Resources/Survival $\to$ Increased Population $\to$ Pressure on Subsistence.* He treated population growth as an inelastic biological constant that would always expand to fill available food. The Demographic Transition revealed that *Increased Wealth $\to$ Decreased Birth Rates*. This reverses a causal arrow in his model. He didn't just underestimate the "tech" variable; he misunderstood the relationship between wealth and reproduction. The mechanism was switched off because the mechanism was structurally false in the long run.

  **2. Paul Ehrlich (Verdict: Falsified)**
  *   **Friend's Principle:** Rescue (Green Revolution changed ag inputs).
  *   **Causal Topology Test:** **Falsified.**
  *   **Why:** Ehrlich's bet was explicitly about the *relative rates* of two exponentials: Population vs. Food Production. He asserted $Rate_{pop} > Rate_{tech}$. The Green Revolution didn't just add a constant amount of food; it shifted $Rate_{tech}$ permanently above $Rate_{pop}$ for that period. This isn't a parameter tweak; it is a failure of the core comparative static. A prediction that relies on "Technology cannot scale this fast" is falsified when technology scales exactly that fast.

  **3. Hubbert (Verdict: Not Falsified/Rescued)**
  *   **Friend's Principle:** Rescue (Fracking changed tech inputs).
  *   **Causal Topology Test:** **Rescued.**
  *   **Why:** Hubbert's model is $Production = f(Total Reserves, Extraction Rate)$. He estimated *Total Reserves* based on known geology and contemporary extraction limits. Fracking did not change the physics of depletion (the curve shape); it changed the value of *Total Recoverable Reserves*. The causal arrow (Extraction $\to$ Depletion $\to$ Decline) remained intact. The theory held fixed "current economic/technical recoverability," and when that boundary moved, the curve shifted right, but the *shape* remained valid.

  **4. Limits to Growth (Verdict: Uncomfortable Middle)**
  *   **Causal Topology Test:** **Depends on the specific loop.**
  *   **Why:** This explains your ambivalence. Where LtG predicted *physical* depletion (like Hubbert), they are rescued by efficiency gains (parameter shift). Where they predicted *societal collapse due to complexity/pollution*, they are closer to Malthus. If the mechanism was "Pollution $\to$ Health $\to$ Population Collapse," and we invented scrubbers, that's a parameter shift (Rescue). If the mechanism was "Growth $\to$ Inevitable Overshoot," and we decoupled GDP from resource use entirely, that's a structural shift (Falsification). Your "middle" verdict is correct because the model contains both structural and parametric claims.

  **5. AI Timelines (Friend's View vs. Yours)**
  *   **Application:** If the theory is "Compute + Algo $\to$ AGI," and Compute grows exponentially, a delay is a **Rescue** (parameter shift on efficiency). If the theory is "Scaling laws hold indefinitely," and we hit a physical wall (data walls, energy walls) that breaks the scaling law, that is **Falsification** (structural break).
  *   **On "Sometime this century":** This is unfalsifiable *before* 2100, so it cannot be "rescued" yet. However, if 2100 arrives without TAI, the "Causal Topology" test asks: Did we fail because we didn't build enough chips (parameter), or because scaling chips doesn't produce intelligence (structure)? Your friend is half-right: it is a prediction, but it is a prediction that risks being "Malthusian" if it assumes scaling must work without a mechanism for why it *must*.

  ### Applying to Your New Cases

  **Case 1: The 1910 Prediction ("Eventually a single power will be able to destroy civilization in a day")**
  *   **Verdict:** **Successful Long-Run Forecast.**
  *   **Analysis:** This passes the Causal Topology Test. The predictor identified a structural trend: *Energy Concentration $\to$ Destructive Potential.* They did not specify the mechanism (fission vs. chemical vs. bio). The fact that it took nuclear physics rather than giant chemical bombs is a parameter/implementation detail. The causal arrow (Centralized High-Energy Tech $\to$ Existential Risk) remained valid. The "Eventually" protects it from timing falsification, but the *mechanism* held up. Unlike Malthus, the world did not reveal that "More Energy $\to$ Less Destruction."

  **Case 2: Moore's Law-style Exponential Predictions Failing After a Century**
  *   **Verdict:** **Falsified (if claimed as a law) / Rescued (if claimed as a trend).**
  *   **Analysis:** This depends entirely on the *modal claim*.
      *   If the theorist claimed, "Computation density grows exponentially because it is a fundamental property of information," and it stops due to atomic limits: **Falsified.** The causal topology (Information $\to$ Infinite Compression) was wrong.
      *   If the theorist claimed, "Computation density grows exponentially based on current lithography economics," and it stops: **Right but Early.** The input (economic viability/physics of silicon) changed.
      *   *Crucial Distinction:* Most Moore's Law observers treated it as a sociological target (a self-fulfilling prophecy) rather than a physical law. If the industry *chooses* to stop shrinking transistors because 3D stacking is cheaper, the "Exponential" prediction is **Falsified** as a physical claim, but **Rescued** as an economic one (Compute per dollar still rises, just not via the original mechanism).
      *   *My advice:* If the prediction relies on an exponential curve hitting a physical asymptote, claiming it is "early" when it hits the asymptote is cheating. Exponentials *must* end. A theory that predicts an exponential forever is structurally wrong, not early.

  ### Summary of the Principle

  To save your verdicts, you must adopt the **Causal Topology Test**:

  1.  **Malthus/Ehrlich:** Falsified. The world changed the *sign* of the derivatives (Wealth $\to$ $\downarrow$Births; Tech $\to$ $\uparrow\uparrow$Food).
  2.  **Hubbert:** Rescued. The world changed the *magnitude* of the constant (Total Reserves).
  3.  **1910 Doom:** Successful. The world confirmed the *direction* of the causal link (Energy $\to$ Risk).
  4.  **Moore's Law:** Falsified if claimed as indefinite; Rescued if claimed as contingent on specific engineering pathways.

  This principle allows you to call Ehrlich a cheater without letting Hubbert off the hook for the same reason. Ehrlich bet on a race between two rates and lost the bet on the rates. Hubbert bet on a finite bucket and was just told the bucket was bigger than he thought. One is a wrong model; the other is a wrong estimate.
