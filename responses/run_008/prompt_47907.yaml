      *   *AI Timelines:* The User's friend says "Sometime this century" is a real prediction. My principle should address whether this is "immune to non-arrival." If the mechanism is "Compute + Algo -> AGI," and Compute grows, is it Rescued if it takes 150 years? If the theory relies on *exponential* compute growth, and that hits a physical wall (Moore's Law case), then the AI theory might be Falsified structurally.
      *   *1910 Case:* "Eventually" is doing a lot of work. If it's "Eventually," it's hard to falsify. But the User asks if it counts as a *successful* forecast. Yes, because the *directionality* was correct, even if the timeline was vague. This aligns with Limits to Growth (shape vs date).
      *   *Moore's Law:* Distinguish between "Moore's Law as observation" vs "Moore's Law as physical law."

  8.  **Final Polish:** Ensure tone is analytical, respectful, and directly answers the prompt's constraints (test principle, repair it, apply to new cases). (Self-correction: Make sure to explicitly state which verdict to drop if necessary, but the goal is to save the verdicts via a better principle). I will aim to save the verdicts.

      *   *Principle Name:* **The Causal Topology Test.**
