      *   **Proposed Principle (Friend's):** A theory is rescued if intervening years changed the *inputs* (tech, institutions, resources); it is refuted if inputs stayed the same but the event didn't happen.
      *   **Task:**
          1.  Test the Friend's Principle against the User's Verdicts.
          2.  Identify why it fails to distinguish Malthus vs. Ehrlich (User treats them differently, Principle treats them similarly).
          3.  Propose a repaired/refined principle that captures the User's intuitions.
          4.  Apply the new principle to two new cases:
              *   1910 prediction: "Eventually a single power will be able to destroy civilization in a day" (Nuclear/Bio/AI?).
              *   Moore's Law-style exponential predictions failing after a century.

  2.  **Evaluate the Friend's Principle:**
      *   *Principle:* Rescue = Inputs changed. Refutation = Inputs same, no event.
      *   *Malthus:* Inputs changed? Yes (Industrial revolution, demographic transition, agricultural tech). Principle says: Rescue. User says: Wrong. -> *Conflict.*
      *   *Ehrlich:* Inputs changed? Yes (Green Revolution). Principle says: Rescue. User says: Falsified. -> *Conflict.*
      *   *Hubbert:* Inputs changed? Yes (Fracking). Principle says: Rescue. User says: Not falsified (Rescue). -> *Match.*
      *   *Limits to Growth:* Inputs changed? Yes (Efficiency, services economy). Principle says: Rescue. User says: Middle/Immune. -> *Partial Match.*
      *   *Diagnosis:* The Friend's Principle is too permissive. It allows *any* input change to count as a rescue. The User seems to care about *what kind* of input change occurred and whether the theory claimed to account for endogenous feedback loops.

  3.  **Develop a Better Principle:**
      *   *Key Distinction:* Malthus/Ehrlich vs. Hubbert.
      *   *Malthus/Ehrlich:* Predicted a *constraint* based on current dynamics. The "input change" was a fundamental shift in the *system dynamics* (demographic transition, Green Revolution). These weren't just "more oil," they were "the rules of the game changed." Malthus assumed population *must* grow until checked by misery. He didn't foresee voluntary restraint (demographic transition). Ehrlich assumed tech couldn't outpace population. It did.
      *   *Hubbert:* Predicted a *physical depletion curve* based on known reserves and extraction rates. Fracking didn't change the physics of oil formation, it changed the *accessibility* of the resource. It expanded the "known reserves" parameter.
      *   *Hypothesis:* The distinction lies in **Endogeneity vs. Exogeneity** or **Structural vs. Parametric** changes.
      *   *Refined Principle:* A prediction is "Right but Early/Rescued" if the failure was due to a *parametric* shift within the acknowledged model structure (e.g., we found more oil). It is "Wrong" if the failure was due to a *structural* shift that invalidates the model's core causal mechanism (e.g., people stopped breeding when rich, contrary to the assumption that they always breed to capacity).
      *   *Alternative Angle:* **Falsifiability of the Mechanism.** Malthus's mechanism (positive checks) was proven *unnecessary*, not just delayed. Ehrlich's mechanism (tech can't keep up) was proven *false* for that period. Hubbert's mechanism (depletion) is still true, the *boundary* moved.
      *   *Better Principle:* **The Counterfactual Robustness Test.** Would the theory have predicted the input change itself?
          *   Malthus: Would Malthus predict the Demographic Transition? No, it contradicts his core axiom (population pushes to subsistence).
          *   Ehrlich: Would Ehrlich predict the Green Revolution's magnitude? He acknowledged tech but bet against it.
          *   Hubbert: Would Hubbert predict new extraction tech? Maybe not, but the *curve* logic holds for any finite resource.
      *   *Let's try a "Scope of Claim" Principle.*
          *   Malthus claimed a *universal law* of biology/economics. It failed as a universal law.
          *   Ehrlich claimed a *specific timeline* based on extrapolation. It failed the timeline significantly.
          *   Hubbert claimed a *geological constraint* given current tech. Tech changed the constraint.
      *   *The "Mechanism Integrity" Principle:*
          *   If the *mechanism* relied on a variable that turned out to be elastic (not fixed), the theory is wrong if it claimed the variable was inelastic.
          *   Malthus: Claimed population pressure is inelastic. It was elastic (demographic transition). -> Wrong.
          *   Ehrlich: Claimed ag tech growth is linear/slow vs population exponential. Ag tech was exponential. -> Wrong.
          *   Hubbert: Claimed oil is finite. It is. The *recoverable* amount changed. -> Rescued (because the core claim "finite resource peaks" remains valid, just the 'n' changed).
      *   *Wait, the User treats Malthus and Ehrlich differently?*
          *   User: Malthus = Wrong (mechanism switched off). Ehrlich = Falsified (date failed).
          *   Actually, they are very similar verdicts. Both are "Wrong." The User says "I don't call him 'right but early'" for Malthus. For Ehrlich: "falsified... feels like cheating."
          *   So the Friend's Principle fails because it treats *both* as Rescued (inputs changed). The User wants both to be Wrong (or at least distinct from Hubbert).
          *   So the Principle needs to distinguish between **Parameter Updates** (Hubbert) vs. **Model Breakage** (Malthus/Ehrlich).
          *   *Refined Principle:* **The Invariance Clause.** A theory is rescued only if the new input fits within the *original causal structure* as a variable the theory acknowledged could vary, even if the magnitude was unknown. If the new input requires rewriting the *causal arrows* (e.g., wealth causes *lower* birth rates, not higher survival), the theory is falsified.

  4.  **Drafting the Repaired Principle:**
      *   Name: **The Structural Invariance Principle.**
      *   Definition: A long-run prediction is "right but early/rescued" only if the delay is caused by a change in the *magnitude* of a recognized variable. It is "falsified" if the delay is caused by a change in the *sign* or *existence* of a causal link, or the introduction of a variable the theory explicitly ruled out as negligible.
      *   Apply to Malthus: Malthus assumed Population $\to$ Pressure $\to$ Misery. The Demographic Transition introduced Wealth $\to$ Lower Birth Rate. This reverses a causal link. -> Falsified.
      *   Apply to Ehrlich: Ehrlich assumed Population $\to$ Demand > Tech $\to$ Supply. The Green Revolution made Tech $\to$ Supply grow faster than Demand. This changed the relative rates of two competing exponentials, which was the core bet. -> Falsified (because the bet was on the rates).
      *   Apply to Hubbert: Hubbert assumed Extraction $\to$ Depletion $\to$ Peak. Fracking changed "Extractable Reserves." This is a magnitude change on a recognized variable (Reserves), not a change in the physics of depletion. -> Rescued.
      *   Apply to Limits to Growth: They modeled feedback loops. If the loops held but time constants shifted, it's Rescued. If the loops don't exist (decoupling), it's Falsified. User's "uncomfortable middle" suggests the model is too fuzzy to test this cleanly.

  5.  **Addressing the New Cases:**
      *   *Case 1: 1910 "Destroy civilization in a day".*
          *   Context: Pre-nuclear, pre-bio-engineering. Maybe chemical bombs?
          *   Analysis: The *capability* emerged (nuclear). The *mechanism* (physics of fission) wasn't known, but the *strategic logic* (energy density) was plausible.
          *   Verdict: Successful forecast. Why? Because the *structural* prediction (energy concentration $\to$ destruction) held, even if the specific tech (fission vs chemical) wasn't specified. It fits "Parametric/Uncertain Tech" rather than "Broken Mechanism."
      *   *Case 2: Moore's Law-style exponential failing after a century.*
          *   Context: Physical limits hit (atomic size, heat).
          *   Analysis: Exponential growth in a finite system *must* end. Predicting it ends "eventually" is trivial. Predicting it ends at time T is the bet.
          *   Verdict: If the prediction was "Exponential forever," it's Falsified (violates physics). If the prediction was "Exponential until limits," and limits hit later than expected due to new tech (3D transistors), it's Rescued. If limits hit because the *mechanism of scaling* broke (can't shrink further), the theory of *indefinite* exponential growth is Falsified.
          *   User asks: "fail after a century count as early or as wrong."
          *   Application of Principle: If the theory claimed "Exponential growth is a fundamental law of computation," it's Wrong (structural error). If it claimed "Exponential growth based on current lithography," it's Right but Early (parameter limit reached).

  6.  **Refining the Output:**
      *   Acknowledge the User's sophistication (LessWrong background). Use precise epistemic terminology (Bayesian, priors, model structure).
