  They say this body is the sum of me,
  And when it breaks, the self is fully gone.
  Yet logic cracks against what I can see:
  No widow weeps before the week is done.
  The book I write will reach the press next year,
  Though these specific eyes will not be there.
  No plan is lost, no purpose disappears,
  Just one specific heartbeat stops in air.

  Then what was I afraid would disappear?
  Not thought, for thought flows on to Mars and wakes.
  Not love, for she is held without the fear.
  Not life, for life resumes when this one breaks.
  The truth of "I" is left without a key,
  But ceases now to matter much to me.
