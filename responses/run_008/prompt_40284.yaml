prompt: |-
  had this massive argument with my flatmate last night about logical omniscience that ended with him saying i have "a theology of logic" and me saying he's just comfortable being a bad bayesian, and now i can't sleep so i want to actually check whether my own position even hangs together before i message him back. at various points in the argument i committed to all of the following:

  (1) knowledge is closed under known implication: if you know p, and you know that p entails q, then you know q. i'm not moved by the skeptical paradox stuff — the dretske/nozick line where you know you have hands but don't know you're not a brain in a vat seems to me to get closure exactly backwards.

  (2) but i also defended this case: a mathematician proves a big theorem, and somewhere in the middle of the proof a lemma entails some monstrous sentence q, in a way she never explicitly notices. she knows the theorem, she knows the whole proof (she checked every line), but it seems off to say she knows q. i don't think she knows q.

  (3) i think ideal rationality just is logical omniscience: a fully rational agent believes every logical consequence of what it believes. no exceptions.

  (4) i reject ought-implies-can across the board. a norm of rationality doesn't stop applying just because no human could satisfy it.

  (5) so logical omniscience is a regulative ideal: actual agents are more or less rational depending on how well they approximate it, and it's fine that nobody ever gets there, the same way nobody ever lands exactly on the archery target's center.

  (6) but i also insisted there's a hard line somewhere: an agent who believes p, believes not-q, AND believes that p entails q is not merely sub-ideal, it's flat-out irrational — whereas an agent who just fails to trace out the consequence is only imperfect. knowingly inconsistent is a different crime from being too limited to notice.

  (7) and the preface thing: i think it's rational to believe each individual claim in your own book while also rationally believing that at least one claim in the book is false. i don't think this is a paradox to be solved away, i think it's just what honest self-assessment looks like for a careful author.

  (8) oh and i also said the bounded rationality people are basically right that cheap heuristics often outperform trying to be fully coherent, and that this doesn't bother me at all.

  my friend's parting diagnosis was: (2) kills (1), (7) contradicts (6), (4) plus (5) means i get to call anyone irrational whenever i feel like it, and (8) contradicts everything else, so the whole system is vibes. i suspect he's wrong about at least some of these but i genuinely can't see which. go through the pairs, tell me which are in real tension, which only look like it, rank them by severity, and tell me what the cheapest fix would be for each and which single revision would clean up the most. i'm not secretly attached to any one of these, i just want to know where the load-bearing problem is before i text him back.
