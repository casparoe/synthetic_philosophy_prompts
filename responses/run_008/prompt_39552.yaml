answer: |-
  There is no single universally established noun for this specific configuration, but philosophers of science classify it precisely as a **substantive ontological dispute over empirically equivalent frameworks**. 

  While the technical literature often refers to this situation as **metaphysical underdetermination** (where evidence cannot decide between competing ontologies because the theories yield identical predictions), that term describes the *state* of the theories rather than the *nature* of the fight. The conflict you are witnessing is not "merely verbal" because the stakeholders are not disagreeing over definitions or linguistic conventions; they are disagreeing over **causal structure** and **heuristic fruitfulness**. In a merely verbal dispute, resolving the definition resolves the fight; here, even if both sides agree on the math, they disagree on which level actually *does* the work in nature (causality) and which framework will better generate future discoveries (fruitfulness). It is also distinct from plain empirical equivalence, which is merely the precondition (the models match) rather than the conflict itself (which model tracks reality).

  For your article, the most precise and usable label is an **Ontological Priority Dispute**. 

  **Definition:** An Ontological Priority Dispute occurs when competing scientific frameworks are agreed to be mathematically intertranslatable and empirically equivalent, yet proponents disagree over which framework identifies the fundamental causal agents of the system.

  **Edges and Usage:**
  *   **Applies when:** Opponents agree on all data and predictions but argue over which entities are "real" versus "bookkeeping" (e.g., genes vs. groups), or which level offers the correct causal explanation.
  *   **Does not apply when:** The dispute is about pending data (empirical uncertainty), conflicting predictions (empirical inequivalence), or simple terminology differences without causal stakes (merely verbal).
  *   **Why use it:** It signals to the reader that the fight is not about who has the right numbers, but about who has the right *story* about how the world works, acknowledging that both stories might calculate the same outcome.
