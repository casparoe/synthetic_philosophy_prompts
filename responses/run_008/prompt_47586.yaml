      *   *Section 4: Inconsistencies.* The "Trust Hierarchy." Signals > Reports. But both rely on waking verification. The "Narrative Fallacy" in reports vs. "Objective" signals.
      *   *Section 5: Taking Dennett Seriously.* Shift to "Report Generation Mechanisms." De-emphasize the "Dream World" ontology.
      *   *Section 6: Vulnerability.* The NCC assumption. If neural activity isn't experience, the decoder data loses its punch against Dennett.

  10. **Refining the Malcolmian "Live Option":**
