      *   **Philosophical Backdrop:**
          *   Norman Malcolm: Dreams aren't experiences *during* sleep. "I dreamt" is an avowal on waking, not a report of a past episode. Concept confusion to think otherwise.
          *   Daniel Dennett: Dreams might be composed/selected at waking. Memory *in* the dream, not *of* it. Sleep cognition exists, but the *timing* of the experience is indeterminate.
      *   **Core Questions:**
          1.  What theory of dreaming do these lab practices presuppose?
