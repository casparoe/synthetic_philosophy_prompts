answer: |-
  The rain hammered against the corrugated roof of the field station, a relentless drumroll that had been playing for six hours. Inside, the air smelled of wet wool, instant coffee, and ethanol. Dr. Vega leaned over the microscope, adjusting the focus on a pinned specimen of *Pseudomorpha lunaris*. Dr. Okafor sat opposite him, nursing a mug of tea and staring at the condensation on the window.

  **Vega:** It's too specific to be nothing, Nneka. Look at the angle. It's not just a bump; it's a concave reflector. Left elytron only. Females only.

  **Okafor:** It's a structural byproduct, Elias. We ran the SEM scans this morning. That gloss comes from the multilayer cuticle stacking required for waterproofing in high-humidity environments. This lineage lives in the cloud forest. They need to stay dry. The shine is just physics happening to be visible.

  **Vega:** Physics doesn't care about sexual dimorphism. Males live in the same cloud forest. They need waterproofing just as much. But they don't have the bump. They don't have the shine. So the waterproofing mechanism isn't sufficient to explain the trait. Something else is restricting it to females.

  **Okafor:** Or something else is restricting it *away* from males. Maybe the hormonal pathway that triggers male development suppresses that specific cuticle stacking. That's a constraint, not an adaptation. You're seeing a signal because you want to see a signal. It's the Gould-Lewontin warning all over again. You look at the spandrel and paint a cherub on it.

  **Vega:** I'm not painting cherubs. I'm looking at the field notes. Ramirez saw males hovering around females with intact bumps. He didn't see them hovering around females where the bump was damaged. That's behavioral data.

  **Okafor:** Ramirez's notes are anecdotal. "Hovering" isn't mating. "Hovering" isn't increased fitness. It's a just-so story waiting to happen. "The moonlight bump helps males find females in the dark." Great story. Predicts nothing. If Ramirez had seen them ignoring the bumps, would you have said, "Ah, the bump is for thermoregulation"?

  **Vega:** No, I'd say the hypothesis was wrong. But that's the point, isn't it? You treat the adaptationist hypothesis like a sin. You say "it's a byproduct" and stop looking. I say "it's a signal" and then I go out and try to break it. Selection can act on byproducts, Nneka. That's exaptation. Even if the shine started as waterproofing noise, if males use it now to choose mates, it's under selection *now*.

  **Okafor:** I'm not saying stop looking. I'm saying don't assume the current utility explains the origin. And don't assume utility exists without ruling out drift. Maybe the bump is neutral. Maybe it's genetically linked to a gene that actually increases fecundity, and the bump is just hitchhiking.

  **Vega:** Possible. But unlikely given the specificity. Left elytron only? That implies developmental precision. Noise is usually messy. Precision implies control.

  **Okafor:** Developmental constraints can be precise too. Bilateral asymmetry is common in insects. Look, I'm willing to concede that it *could* be an exaptation. But the burden of proof is on the function. You need to show that removing the bump lowers fitness.

  **Vega:** Agreed. And I will. Tomorrow, if the rain stops, we paint the bumps. Matte black varnish. Non-toxic.

  **Okafor:** Good. But you need a control. Paint the right elytron of other females. And paint the males, too, to control for the smell of the varnish.

  **Vega:** Fine. But if the painted females get fewer matings, I get to say "I told you so."

  **Okafor:** If the painted females get fewer matings, you've shown the trait is *currently* useful. You haven't shown it's an adaptation in the historical sense. It could still be a spandrel that became a handle. But... I'll concede that if there's a fitness cost to removing it, it's maintained by selection. That's enough for me to stop calling it "just" a byproduct.

  **Vega:** And I'll concede that if there's no fitness difference, I won't spin a story about how the males just weren't trying hard enough. But what about the phylogeny? If we sequence the close relatives and find the cuticle structure exists without the bump...

  **Okafor:** ...Then the bump is derived. That supports your case. But if we find the molecular pathway for the stacking is ancient and the bump is just a variation in thickness...

  **Vega:** ...Then it's a constraint. Look, we're actually agreeing on the tests. We disagree on the prior probability. You think drift and constraint are the default. I think selection is the default.

  **Okafor:** I think selection is a powerful force, but it's not the only force. Assuming it's the default leads to confirmation bias. You see a bump, you see a signal. I see a bump, I see a developmental outcome.

  **Vega:** And that's why we need each other. I'd chase a ghost signal forever. You'd ignore a real signal because it looks like a ghost.

  **Okafor:** (Smiles) Exactly. Pass the coffee. It's going to be a long night.

  **Vega:** (Pouring) To *Pseudomorpha lunaris*. May she be either beautifully adapted or wonderfully complex.

  **Okafor:** Preferably both.

  ***

