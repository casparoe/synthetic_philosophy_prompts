prompt: |-
  Write a dialogue between two evolutionary biologists stuck at a field station during a rainstorm: Dr. Vega, a pretty hardcore adaptationist who thinks most traits have a selection story behind them if you dig hard enough, and Dr. Okafor, who's much more pluralist and basically lives in the Gould–Lewontin "spandrels" tradition (byproducts, drift, constraints, the whole toolkit). Neither of them should be a strawman — they're both smart, and they should actually engage with each other's points, concede small things, and build on each others' arguements rather than talking past each other.

  The thing they're arguing about is a (made-up) beetle, let's call it Pseudomorpha lunaris. In this species the females have a small glossy bump on the left elytron that reflects moonlight quite strongly, while males and other closely related species have nothing like it. Some lab work suggests the gloss comes from a microscopic layered structure in the cuticle that shows up as a side effect of how the waterproofing layer forms in this lineage — i.e., the shine piggybacks on a physiological process that's there for other reasons. On the other hand, field notes from one season suggest males hover around the bumps at night, though nobody has confirmed whether that actually affects mating success.

  Have them go back and forth on: whether the bump counts as an adaptation, a byproduct (spandrel), an exaptation, or some messy combination; what the adaptationist's "just-so story" worry really amounts to and whether it can be answered with better methodology rather than giving up on adaptationist explanation; and what actual tests or observations would distinguish the hypotheses. Let Vega push back on the idea that pointing at a possible byproduct mechanism settles anything (selection can act on byproducts!), and let Okafor push back on story-telling that can accommodate any outcome and therefore predicts nothing. It's fine if they don't fully resolve it.

  After the dialogue, add a JSON object (separate from the dialogue text, like a little structured summary) with exactly these fields:

  - "trait": a one-sentence description of the bump
  - "vega_main_arguments": array of objects, each with "claim" (string) and "evidence_she_would_need" (string)
  - "okafor_main_arguments": array of the same shape
  - "cruxes": array of strings, listing the sharpest points where they genuinely disagree
  - "discriminating_tests": array of objects, each with "test" (string) and "outcome_favoring" (one of "vega", "okafor", or "neither")
  - "verdict": one of "adaptation", "byproduct", "exaptation", "combination", or "underdetermined", with a "rationale" field (string, one sentence) explaining why

  Keep the dialogue itself naturalistic and a bit informal — they're tired and it's raining, they can be a little wry. Also if it matters, I'd rather Okafor be a woman, so flip whichever name you need to. And please double check that the JSON is actually valid and every field name matches the list above, I'm going to parse it programmatically.
