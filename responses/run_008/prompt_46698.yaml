      Move 3: Clearly right. The insurance analogy correctly applies decision theory to moral uncertainty, exposing scope insensitivity in human intuition.
      Move 4: In between. The "reductio" is subjective, but the ecological complexity raises valid practical concerns about intervention efficacy, though not about moral status.
      Missing: The distinction between *importance* (moral weight) and *tractability* (ability to help), and the strategy of moral hedging.
