prompt: |-
  I'm the managing editor of a mid-tier applied math journal (think: strong but not Annals-level, lots of numerical analysis and PDE work). A few years back we started a "constructive and computable methods" section, partly because a big proof-assistant community cites it, and now every paper that touches existence proofs has to be sorted: does it go in the constructive section with that label attached in databases and everything, or the general section. The problem is that our referees are inconsistent in a way that's getting embarrassing. One referee will accept an existence proof as constructive because "the construction is right there in the proof," another will flag it because the argument for termination invokes excluded middle in some sublemma nobody noticed. One author got a report saying their paper was classical "because it uses proof by contradiction," which was doubly annoying since reductio to derive a negation is fine even constructively and the referee apparently didn't distinguish that from deriving a positive existence statement from a contradiction. I myself am not a logician, so I can't adjudicate these fights on my own knowledge.

  Please turn whatever the actual substance of constructivism is (Brouwer-Heyting-Kolmogorov-style readings of the connectives, the existence and disjunction properties, what it means for a proof to carry a witness, that whole cluster) into a screening procedure that a non-logician editor with maybe two hours per paper and access to one logicians referee for hard cases can actually run. I want the questions to ask in order, what counts as a sufficient answer to each (e.g., what should I accept as evidence that a cited classical theorem has a known constructive version?), where the procedure terminates with "not constructive" even if the paper is otherwise fine, and where it has to hand off to the human logician because it's a genuine judgment call — I'm told things like whether Markov's principle counts as constructive are school-dependent rather than settled, so the procedure should say that explicitly instead of pretending otherwise. It should also have a small set of red-flag patterns a busy editor can grep for mentally: deriving existence from a contradiction, case splits on undecidable predicates, classical intermediate results smuggled in as lemmas, and whatever else belongs on that list.

  Then run the procedure on three real-ish cases I actually have on my desk. (1) A paper proving a boundary value problem has a solution via contradiction, but then noting the solution can be located by bisection since the sign change is decidable, and leaning on that to claim constructivity. (2) A paper that's built on a classical minimax theorem, where the author says constructive versions are "well known" and cites nothing, and the algorithms people want to extract stuff from it. (3) A genuinely elegant paper by someone we very much want in the journal, whose proofs are all explicit constructions over finite-dimensional spaces with decidable equality, except the author never claims constructivity anywhere and I suspect would be irritated to be reclassified. And finally, tell me honestly where this procedure will misfire — where the constructivity question isn't mechanical at all and my checklist will produce confidently wrong labels, and what you'd do about a case where the procedure says one thing and the section editor's intuition says another.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Managing Editor of a mid-tier applied math journal (numerical analysis, PDE focus).
      *   **Problem:** Inconsistent labeling of papers as "constructive/computable" vs. "classical." Referees disagree on what counts as constructive (e.g., excluded middle usage, proof by contradiction nuances).
      *   **Goal:** Create a practical screening procedure (checklist/flowchart) for a non-logician editor (2 hours/paper max) with access to one logician referee for edge cases.
      *   **Requirements:**
          *   Based on actual constructive math substance (BHK interpretation, existence property, etc.).
          *   Sequential questions with clear pass/fail criteria.
          *   Explicit handling of gray areas (e.g., Markov's Principle).
          *   "Red-flag" patterns for quick scanning.
          *   Apply the procedure to three specific cases provided.
          *   Honest assessment of where the procedure fails/limitations.
      *   **Tone:** Professional, pragmatic, authoritative but humble about logical nuances.

  2.  **Deconstruct "Constructivity" for Applied Math:**
      *   *Core Idea:* A proof of $\exists x P(x)$ must provide an algorithm to find $x$ (or approximate it to arbitrary precision) and a proof that the algorithm terminates.
      *   *Key Forbidden Moves:* Law of Excluded Middle (LEM) on undecidable predicates, Proof by Contradiction to establish positive existence ($\neg \neg \exists x \to \exists x$), Non-constructive choice principles (AC).
      *   *Key Allowed Moves:* Intuitionistic logic, explicit algorithms, recursion on well-founded structures, contradiction to prove *negation* ($\neg P$).
      *   *Applied Math Nuance:* Often deals with real numbers. Constructive analysis (Bishop-style) is the standard here, not necessarily strict intuitionism or type theory, but it requires computable witnesses.

  3.  **Drafting the Screening Procedure (The "Constructivity Checklist"):**
      *   *Phase 1: The Quick Scan (Red Flags).* Look for specific phrases or structures.
      *   *Phase 2: The Existence Claim.* How is $\exists$ proven?
      *   *Phase 3: The Logic.* Are classical principles used?
      *   *Phase 4: The Citations.* Are referenced theorems constructive?
      *   *Phase 5: The Handoff.* When to call the logician.

      *Refining the Criteria:*
      *   *Contradiction:* Distinguish $\neg \neg P \vdash P$ (Bad) from $P \vdash \bot \Rightarrow \neg P$ (Good).
      *   *Disjunction:* $A \vee B$ requires knowing which one holds.
      *   *Real Numbers:* Equality on $\mathbb{R}$ is undecidable. $x = 0 \vee x \neq 0$ is generally false constructively.
      *   *Citations:* "Well known" isn't enough. Needs a specific constructive reference (e.g., Bishop, Bridges, Troelstra).

  4.  **Developing the Red-Flag List:**
      *   "Suppose not..." leading to existence.
      *   "Either $x=0$ or $x \neq 0$" (for reals).
      *   "By the classical theorem of..."
      *   Zorn's Lemma / Axiom of Choice.
      *   Compactness arguments (often non-constructive in infinite dims).

  5.  **Applying to the Three Cases:**

      *   *Case 1 (BVP via Contradiction + Bisection):*
          *   Proof uses contradiction for existence? That's a red flag.
          *   But then offers bisection. Bisection is constructive *if* the sign change is decidable.
          *   *Verdict:* Gray area. The existence proof is classical, the algorithm is constructive. Does the paper *prove* the algorithm works using constructive logic? If the convergence proof relies on the classical existence, it's not fully constructive.
          *   *Decision:* Likely "General" unless the convergence proof is decoupled. Handoff to logician if the author insists.

      *   *Case 2 (Minimax, "Well Known"):*
          *   Minimax theorems are notoriously non-constructive (often rely on fixed point theorems like Brouwer/Kakutani).
          *   Citation is vague.
          *   *Verdict:* Hard "No" for constructive section until a specific constructive reference is provided.
          *   *Decision:* General section. Ask for citation. If provided, check if it's Bishop-style or game-theoretic constructive.

      *   *Case 3 (Finite Dim, Explicit, No Claim):*
          *   Finite dimensional spaces with decidable equality are often "trivially" constructive (if coefficients are computable).
          *   Author doesn't claim it.
          *   *Verdict:* Don't label it constructive if they don't claim it. It might use classical logic implicitly (e.g., "let $\lambda$ be an eigenvalue" without constructing it).
          *   *Decision:* General section. Don't annoy the author. Constructivity is a *claim*, not just a property of the objects.

  6.  **Addressing the Limitations (The "Honest Assessment"):**
      *   *Bishop vs. Brouwer:* Bishop (standard for analysis) accepts some things Brouwer doesn't.
      *   *Markov's Principle:* Is $\neg \neg \exists n P(n) \to \exists n P(n)$ (for decidable $P$) allowed? In CS/Type Theory, often no. In Russian Constructivism, yes. In Bishop, it's a principle, not an axiom.
      *   *Real Numbers:* Approximate existence vs. exact existence.
      *   *Editor Intuition vs. Checklist:* The checklist catches blatant errors, but subtle logical dependencies require expertise.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Need to make it actionable for an editor.
      *   *Clarity:* Ensure the distinction between "Proof by Contradiction for Negation" (OK) and "Double Negation Elimination for Existence" (Not OK) is clear.
      *   *Logician Handoff:* Define exactly *when* to trigger this. (e.g., "If Case 1 applies but author argues...")

  8.  **Final Polish:** Organize into clear sections: The Procedure, The Red Flags, The Case Studies, The Limitations. (Self-Correction: Make sure to emphasize that "Constructive" is a label of *method*, not just *result*.)

  **(Self-Correction during drafting Case 1):** Wait, if the paper proves existence classically but *then* gives an algorithm, is it constructive? In constructive math, the *proof of existence* must be the algorithm. If the existence proof is separate and classical, the paper is classical, even if an algorithm is mentioned later. The algorithm's *correctness proof* must also be constructive. I need to make sure the procedure highlights this distinction.

  **(Self-Correction during drafting Case 3):** If the author doesn't claim constructivity, labeling it as such might imply a scrutiny of the logic they didn't intend. Better to leave it in General unless they submit to the Constructive section. The prompt implies the editor has to sort *every* paper touching existence. So I need to decide if it *qualifies*, not just if they claimed it. If it *is* constructive by accident, does it go in the section? The prompt says "every paper that touches existence proofs has to be sorted." Okay. If it's accidentally constructive, it *could* go there, but if the author didn't frame it that way, it might be weird. I will advise: If it passes the checklist but lacks the framing, keep it General to avoid category error, unless the journal wants to recruit them. Actually, the prompt says "does it go in the constructive section... or the general section." I should advise based on technical merit, but note the social risk.

  9.  **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the difficulty).
      *   Part 1: The Triage Protocol (Step-by-Step).
      *   Part 2: The Red-Flag Glossary.
      *   Part 3: Case Studies (Application).
      *   Part 4: Failure Modes & Meta-Advice.

