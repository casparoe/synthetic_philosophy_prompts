      *   *Refining the Dictatorship Error:* This is crucial. Arrow's theorem is about SWFs (rankings). GS is about SCFs (winners). A dictator in GS makes the outcome their top choice. The student wrote "society ranks x above y." This suggests they are conflating the two theorems. This is a significant conceptual slip in a collective choice seminar.
      *   *Refining the Onto/Unanimity Error:* The student claims a non-dictatorial rule is "by definition responsive... so the condition is automatically satisfied." This is wrong. A constant rule is non-dictatorial (no single voter determines the outcome based on preference) but is not onto. This is the standard counterexample for dropping the range condition.

