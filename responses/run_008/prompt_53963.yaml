          *   Unanimity/onto: Claims it's "not doing any real work," "bookkeeping," "automatically satisfied." (Incorrect. This is a major conceptual error. A constant rule violates onto/unanimity but is strategy-proof and non-dictatorial. This is the standard counterexample for the range condition).
