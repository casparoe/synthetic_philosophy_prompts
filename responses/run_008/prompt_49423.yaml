answer: |-
  **Project Title:** Operationalizing Bounded Logical Induction via Heuristic Markets in Decidable Fragments

  **1. Precise Statement of the Question**
  The logical induction (LI) criterion guarantees that a market of sentences becomes unexploitable by any polynomial-time trader in the limit. However, this asymptotic guarantee provides no guidance for price formation at finite time $t$ under fixed compute budget $B$. This project asks: **Can we define a non-asymptotic, resource-bounded coherence criterion that is satisfiable by a market of specific, resource-bounded theorem-proving heuristics, and does satisfying this criterion yield probability estimates with better calibration than the heuristics individually?**

  We investigate this by constructing a prediction market where "traders" are wrapped proof-search heuristics (e.g., term orderings, lemma selection strategies) operating within a decidable theory (e.g., Equality with Uninterpreted Functions or Linear Integer Arithmetic). Because the theory is decidable, we possess a slow ground-truth oracle. This allows us to measure the market's finite-time calibration against actual truth values, bypassing the need to wait for asymptotic convergence or rely on undecidable ground truth.

  **2. Context and Motivation**
  The Garrabrant et al. result is a cornerstone of formalized logical uncertainty, but it leaves a critical implementation gap. The standard construction requires a market that simulates an enumerable set of traders, ensuring that no single trader can bankrupt the market. In practice, the set of "efficiently computable traders" is too vast to simulate, and the convergence rate is unspecified. Existing attempts to "practicalize" LI often reduce to running the asymptotic algorithm on smaller domains, which fails because the algorithm's complexity is dominated by the trader enumeration, not the sentence complexity.

  Conversely, modern automated theorem proving (ATP) and SMT solving already solve instances of logical uncertainty heuristically. A solver's internal state (clause weights, term priorities) implicitly encodes a belief about provability. However, these beliefs are not aggregated or coherence-checked; they are optimized for speed-to-proof, not calibration.

  This project does not attempt to speed up the Garrabrant construction. Instead, it tests whether the *economic framing* of LI adds value to existing ATP heuristics. By restricting the trader space to known, implementable heuristics and the domain to decidable fragments, we move from an existence proof to an empirical engineering question: Does the market mechanism aggregate heuristic information better than a simple ensemble, and does it prevent specific classes of bounded Dutch books that individual heuristics succumb to?

  **3. Methodology**
  The project is scoped for three months part-time (approx. 20 hours/week), leveraging one primary investigator (PI) and one collaborator with ATP internals expertise.

  **Month 1: Environment and Trader Wrapping**
  *   **Target Theory:** We will begin with Equality with Uninterpreted Functions (EUF) and small-bitwidth Linear Integer Arithmetic (LIA). These are decidable, have known complexity bounds (EUF is polynomial, LIA is NP-complete), and are supported by standard solvers (Z3, CVC5).
  *   **Ground Truth:** Implement a "slow oracle" using exhaustive search or a high-confidence solver timeout to establish truth values for a generated dataset of formulas.
  *   **Trader Implementation:** The collaborator will interface with an open-source solver (e.g., Vampire or Z3) to expose heuristic states as trading strategies.
      *   *Trader A:* Term-ordering heuristic (buys sentences where simplification reduces size).
      *   *Trader B:* Lemma-learning heuristic (buys sentences resembling learned clauses).
      *   *Trader C:* Randomized restart strategy (buys sentences where search variance is high).
  *   **Market Mechanism:** Implement a simple continuous double auction or automated market maker (LMSR) constrained by a total compute budget per tick.

  **Month 2: Dynamics and Criterion Definition**
  *   **Market Simulation:** Run the market on a dataset of 1,000+ formulas. Record price trajectories against compute steps.
  *   **Defining Bounded Coherence:** We will attempt to operationalize a "Bounded Dutch Book" criterion. For example: *No trader can achieve a return > $\epsilon$ over $N$ steps given budget $B$.* We will measure if the market prices converge to a state where this holds for our specific trader set.
  *   **Ablation:** Compare market prices against the raw confidence scores of individual heuristics (if extractable) and a simple linear ensemble of heuristics.

  **Month 3: Evaluation and Reporting**
  *   **Calibration Analysis:** Plot reliability diagrams (predicted probability vs. frequency of truth) for the market vs. individual heuristics.
  *   **Exploitability Check:** Attempt to train a simple neural net (as a meta-trader) to exploit the market prices. If the market is coherent, the meta-trader should fail to profit significantly.
  *   **Write-up:** Document the market dynamics, the viability of the heuristic-to-trader mapping, and the empirical calibration results.

  **4. Anticipated Outcomes**
  *   **Positive Result:** The market prices converge faster to ground truth than individual heuristics under the same compute budget. We identify a specific bounded coherence criterion (e.g., "no heuristic exploits price discrepancies > 5% within 1000 steps") that the market satisfies but individual solvers do not.
  *   **Negative Result:** The market dynamics are unstable or oscillate. One heuristic dominates the budget immediately, effectively reducing the market to a single solver. The market prices are *less* calibrated than the best individual heuristic due to overhead.
  *   **Boring Result:** The market functions and is stable, but offers no statistical advantage over a simple weighted average of the heuristics. This suggests the economic mechanism adds overhead without aggregation benefits in the bounded regime.

  **5. Honest Statement of Failure Modes**
  We acknowledge significant risks that could render the project inconclusive:
  *   **Metaphor Failure:** ATP heuristics may not map cleanly to budget-constrained traders. A heuristic's "confidence" might not be monetizable without introducing artifacts that distort the search process itself. If the act of betting alters the heuristic's proof search in a way that degrades performance, the market is invalid.
  *   **Degenerate Arbitrage:** In a bounded setting, a single aggressive trader might be able to exploit price discrepancies faster than the market can adjust, draining the liquidity pool before coherence is reached. This would demonstrate that the chosen market mechanism is too slow for the heuristic timescales.
  *   **Triviality of Criterion:** We may find that the only coherence criterion satisfiable in finite time is so weak (e.g., "no exploit within 1 step") that it loses the connection to the Dutch Book argument entirely. If the bounded criterion does not imply improved calibration, the project fails to bridge the gap between LI theory and practice.
  *   **Oracle Bottleneck:** Generating ground truth for LIA, even with small bitwidths, may be too slow to provide a statistically significant test set within the grant period, leaving us with qualitative but not quantitative results.

  **6. Resources and Collaborator**
  The PI will handle the market mechanism, economic criteria, and calibration analysis. The collaborator (ATP background) is essential for Month 1, specifically for modifying solver source code to expose internal heuristic states as actionable signals without breaking solver invariants. We require access to standard compute clusters for running parallel solver instances.

  **7. Conclusion**
  This project does not promise a new theoretical bound on logical uncertainty. It promises an empirical stress-test of the logical induction framework in the regime where it actually matters: finite time, finite compute, and known ground truth. Whether the result is positive or negative, determining whether heuristic markets can satisfy a bounded coherence criterion is a necessary step toward moving logical uncertainty from asymptotic existence proofs to actionable AI safety engineering.
