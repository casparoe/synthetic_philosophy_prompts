  Here is the sanity check you asked for. I have ranked the tensions by severity, identified the critical fault line, and taken a definite position on what you need to change to make the statement coherent.

  ### The Tension Ranking

  **1. Severity: High (Logical Incoherence) — P5 vs. P6**
  This is the silent killer in your draft.
  *   **P5** states: "I'm suspicious of *any* story where the ethic spread because it was economically useful." (Anti-functionalist transmission).
  *   **P6** states: The ethic "transmits secularly, through schooling, family discipline... Confucian-heritage economies."
  *   **The Conflict:** If the ethic transmits secularly in modern Confucian economies (P6), what is the mechanism of that transmission? In a modern capitalist context, the overwhelming driver for "schooling and family discipline" is economic payoff (getting a job, succeeding in the market). By ruling out *any* story where the ethic spreads due to utility (P5), you remove the only plausible engine for the phenomenon you describe in P6. You are left claiming the ethic transmits secularly via... magic? Or pure cultural inertia? That is a hard sell in an economic history workshop.

  **2. Severity: Medium (Substantive Contradiction) — P1 vs. P6**
  This is the tension you spotted, and your intuition is correct, though it is survivable with clarification.
  *   **P1** claims: The *content of Calvinist doctrine* (predestination, etc.) causally contributed to the *distinctive character* of modern capitalism.
  *   **P6** claims: This character/ethic exists and thrives without that content (Japan/Confucianism).
  *   **The Conflict:** If the *character* is defined by the ethic, and the ethic can exist without the theology, then the theology is not the *constitutive* cause of the character, only a *historical* catalyst. P1 implies a necessary link between Calvinist content and Capitalist character; P6 admits the link is contingent. If you keep P1 as written ("Strong Sense"), the existence of Confucian capitalism refutes the claim that the *Calvinist content* produced the *distinctive character*.

  **3. Severity: Low (Interpretive Risk) — P1 vs. P4**
  *   **P1** claims a "Strong Sense" causal role for ideas.
  *   **P4** cites the "Switchman" quote, which some materialists read as limiting ideas to mere directionality while interests provide the power.
  *   **The Conflict:** This is standard Weberian exegesis. As long as you interpret "tracks" as determining the *destination* (the character of capitalism), these are consistent. This is not a logical fault, just a point where opponents might try to trip you up.

  ---

  ### The Verdict: What Has to Give

  **You must weaken P5.**

  Do not weaken P1. P1 is your thesis statement; it is the "bite" you want for the workshop. If you soften P1 to say "Protestantism was just one historical trigger," you lose the provocative claim that the *spirit* of capitalism is genealogically Protestant. You want the discussion to be about whether Weber was right about the *origins*, not whether culture transmits functionally.

  However, you cannot sustain P6 (the defense against the Japan objection) if P5 blocks the mechanism of transmission.

  **The Fix:**
  Restrict the scope of **P5** to **origins**, not **transmission**.
  Change P5 from: *"I'm suspicious of any story where the ethic spread because it was economically useful."*
  To: *"I'm suspicious of stories where the ethic **originated** because it was economically useful."*

  **Why this is the right move:**
  1.  **It saves P6:** It allows you to argue that while Calvinists didn't adopt predestination to get rich (Origin), modern Japanese parents *do* teach ascetic discipline to ensure their children succeed in a capitalist economy (Transmission). This makes your account of secular transmission mechanically plausible.
  2.  **It preserves P1:** You can maintain the "Strong Sense" claim that the *genesis* of the spirit was uniquely Protestant (P1), while admitting that once generated, the spirit became a functional tool that other cultures could adopt (P6). This is the standard "Neo-Weberian" position and is much harder to attack than claiming the theology itself is universally necessary.
  3.  **The Cost:** You concede ground to functionalist/institutionalist economists (e.g., Greif, Alesina) regarding cultural *evolution*. You admit that cultural traits *can* be selected for economic utility once they exist.
      *   *Is this a bad cost?* No. It is empirically honest. Denying that "schooling and family discipline" in modern Asia are driven by economic incentives is not credible. Conceding this makes you look methodologically sophisticated rather than dogmatic.

  ### Summary of Recommended Edit for P5

  **Current:** "I don't think people adopt doctrines for the payoffs... So I'm suspicious of any story where the ethic spread because it was economically useful to its holders."

  **Proposed:** "I don't think people adopt doctrines for the payoffs **initially**. Belief in predestination wasn't selected like a trait that helps its carriers — people held it because they were raised into it and found it compelling. **However, I allow that once the ethic is established, it can be transmitted secularly because it is instrumentally useful in a capitalist economy.**"

  **Why this wins the room:**
  It keeps your "Strong Weber" claim on the *history* (P1) while giving you a robust, non-magical mechanism for the *comparative* argument (P6). It shows you understand the difference between the *causes of origins* and the *causes of persistence*, which is exactly the kind of distinction an economic history workshop will respect.
