answer: |-
  # Q&A Prep Sheet: In Defense of Sunk Costs

  **To:** Me
  **From:** Strategy Desk
  **Re:** Seminar Defense (Behavioral Econ/Psych + Philosophy)
  **Context:** Defending the view that honoring sunk costs is not *universally* irrational.
  **Core Distinction:** Part 1 (Informational/Causal linkage) vs. Part 2 (Constitutive/Identity linkage).

  ### Upfront Concession (The "Steel Man" Opener)
  *Do not start by fighting the literature.* Start by validating it.
  **Script:** "I want to be clear: I am not denying the empirical regularity. The behavioral literature is robust: humans *do* escalate commitment due to loss aversion, ego, and framing effects far more often than is normatively justified. In 95% of cases, the textbook advice holds. My claim is not that the fallacy doesn't exist, but that the *definition* of the fallacy is too broad. It treats a heuristic that is sometimes rational as a bias that is always irrational. I am arguing for a boundary condition, not a revolution."

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Opportunity Cost Objection (Economic Core)
  **The Objection:** "You're ignoring the fundamental definition of rationality. Rational agents maximize expected utility from *this moment forward*. Any resource allocated to a project because of past spend is a resource *not* allocated to a higher-yield alternative. If the past investment creates 'value,' that value must be realizable in the future. If it's not, it's sentiment. If it is, it's a forward-looking payoff. There is no middle ground."
  **The Reply (2 mins):** "That middle ground is precisely where Part 2 of my argument lives. Standard utility functions treat preferences as exogenous and time-slice specific. But some projects have *diachronic identity*. A half-built cathedral isn't just a pile of stone; it's a promise to a community, a historical narrative. Abandoning it destroys the value of the stone *already laid*, not because the stone costs money, but because the stone's meaning is contingent on completion. The opportunity cost isn't just 'what else could I buy with this money?' It's 'what does this money mean in this specific narrative context?' I'm not saying ignore opportunity costs; I'm saying the 'utility' column includes the preservation of constitutive value, which forward-looking calculus alone misses."
  **Soft Spot:** If they press on whether "preserving narrative" is just another forward-looking utility parameter. (See *Hope Nobody Asks*).

  #### 2. "Part 2 is a Mood, Not a Reason" (Philosophical Core)
  **The Objection:** (From your sympathetic philosophers) "You say past investment is 'constitutive.' But normativity requires reasons. 'Because we spent money' is never a reason. 'Because I value the marriage' is a reason. You're conflating the *cause* of the value (the history) with the *reason* for the action (the current valuation). You haven't justified sunk costs; you've just justified valuing history."
  **The Reply (2 mins):** "This is the crux. I agree 'because we spent money' is weak. But 'because this history constitutes *us*' is strong. Consider a promise. The reason I keep a promise isn't the future benefit of trust; it's that the past act of promising created a normative obligation. Similarly, deep projects (marriage, dissertations) create agent-relative obligations. The past investment isn't just a cause; it's a *status function*. To say 'ignore the past' is to say 'ignore who you are.' Rationality isn't just about maximizing output; it's about coherence of the agent over time. If I abandon the project solely because the future payoffs are thin, I fracture the identity that the past investment built."
  **Soft Spot:** Relies heavily on a contentious view of "agent-relative obligations" that economists will reject as non-falsifiable.

  #### 3. "Part 1 is Just Relabeling" (Conceptual)
  **The Objection:** "Your Part 1 argument—that training makes future steps cheaper—is just standard marginal analysis. If the 10th year is cheap because of the first 9, that's a forward-looking cost benefit. You're calling standard rationality 'sunk cost honoring' to make your thesis seem bolder than it is."
  **The Reply (2 mins):** "I concede Part 1 is the weak flank, and I'm willing to sacrifice it to save Part 2. However, the distinction matters for *diagnostics*. In behavioral psych, we teach people to ignore the past to cure the fallacy. But if the past has altered the *structure* of future costs (learning curves, specialized capital), telling an agent to 'ignore the past' leads to suboptimal quitting. My point isn't that this validates sunk costs, but that the *heuristic* 'ignore sunk costs' is dangerous if agents can't distinguish between truly sunk costs and costs that have altered the production function. It's a warning about the application of the rule, not the rule itself."
  **Soft Spot:** Admitting Part 1 is weak undermines the "two-part" structure of the talk.

  #### 4. Escalation of Commitment (Empirical/Psych)
  **The Objection:** "Psychologically, the mechanisms driving 'constitutive value' and 'irrational escalation' are identical. Loss aversion, self-justification, and ego involvement look the same from the inside. How can an agent distinguish rational persistence from biased escalation in real-time?"
  **The Reply (2 mins):** "They can't perfectly, which is why the bias is so prevalent. But indistinguishability doesn't imply identity. A surgeon's steady hand and a gambler's steady hand look the same physiologically, but one is skill, one is luck. We need to look at the *counterfactuals*. In irrational escalation, the agent hides negative information. In rational constitutive persistence, the agent acknowledges the cost but weighs the identity loss higher. The test isn't the feeling; it's the transparency of the trade-off. If you can articulate the constitutive value you're protecting, it's likely rational. If you're just avoiding the pain of loss, it's bias."
  **Soft Spot:** This is hard to test empirically. It relies on self-reporting, which psychologists distrust.

  #### 5. The Concorde Case (The Canonical Counter)
  **The Objection:** "The Concorde jet is the textbook example. Governments kept funding it despite negative NPV because they'd already spent so much. Are you telling me the Concorde was rational?"
  **The Reply (2 mins):** "No. The Concorde is likely a case of irrational escalation, and I am not defending it. I am defending the *logical possibility* of rational sunk cost honoring, not claiming all instances are rational. The Concorde lacked the 'constitutive' element I describe in Part 2. It was a commercial venture masquerading as a prestige project. If it had been a pure national monument with no commercial pretense, the calculation changes. My theory explains why Concorde *feels* compelling to some (national pride) while remaining economically irrational. It distinguishes the *type* of project, not just the math."
  **Soft Spot:** If they argue national prestige *is* a forward-looking payoff (soft power), the constitutive argument collapses back into standard utility.

  #### 6. Training Argument Cuts Both Ways (Internal Consistency)
  **The Objection:** "If the 10th year of training is cheap because of the first 9, doesn't that imply you should have started training earlier? If you're at year 9 and realize the payoff is low, the 'cheapness' of year 10 doesn't justify starting. Doesn't your argument actually suggest we should quit *before* investing heavily?"
  **The Reply (2 mins):** "That's a valid ex-ante critique, but we are discussing ex-post rationality. Once the 9 years are gone, the landscape has changed. The 'quit earlier' argument assumes we have perfect foresight, which we don't. We are dealing with non-ergodic systems where the path taken changes the available futures. If I quit at year 9, the 9 years are waste. If I continue, they become 'foundation.' The rationality isn't in the initial decision, but in the response to the new reality created by the investment. You can't undo the past, but you can choose whether it becomes a foundation or a ruin."
  **Soft Spot:** Economists hate "ex-post rationality" that excuses bad "ex-ante decisions." It sounds like rationalization.

  #### 7. Operationalizability (The "So What?" Question)
  **The Objection:** "Even if you're right philosophically, what is the policy implication? Should we teach students to honor sunk costs? That seems dangerous."
  **The Reply (2 mins):** "We should teach students to audit the *source* of their persistence. Current pedagogy says: 'If you feel stuck because of past spend, quit.' I suggest: 'If you feel stuck because of past spend, ask: Does this past spend constitute the value of the completion?' Don't ban the intuition; refine it. In management, this means distinguishing between 'throwing good money after bad' and 'completing the platform.' It reduces false negatives—projects killed that should have survived."
  **Soft Spot:** Hard to implement. Most managers will use this as an excuse to keep failing projects alive.

  #### 8. The Slippery Slope (Normative Authority)
  **The Objection:** "If 'constitutive value' justifies cost, what stops anyone from justifying anything? 'I bought this gym membership, so I must go' becomes 'I bought this gym membership, so it is part of my identity, so I must go.' Who decides what is constitutive?"
  **The Reply (2 mins):** "Social and internal constraints. A gym membership is rarely constitutive of identity in the way a marriage or a decade of research is. There is a threshold of depth and social embedding. We rely on the same mechanisms we use to distinguish 'promises' from 'threats.' It's not a slippery slope; it's a category distinction. We don't ban promises because some people make frivolous ones. We develop norms to distinguish serious commitments from casual ones."
  **Soft Spot:** "Depth and social embedding" is vague. Behavioral economists will want a measurable threshold.

  ---

  ### The One Question I'm Hoping Nobody Asks

  **"Isn't 'valuing the past' just a current preference state, making it forward-looking after all?"**

  *Why I fear it:* If I admit that "caring about the past" is a preference I hold *now*, then maximizing that preference is just standard forward-looking utility maximization. My Part 2 argument collapses into the standard model I'm trying to critique. I would have to admit I'm not redefining rationality, just expanding the utility function.
  *Contingency Reply:* "It expands the utility function to include *temporal integrity*, which standard models treat as a discount rate rather than a value source. But yes, technically, all reasons must be held in the present. My point is that the *object* of the preference is the past itself, which standard models rule out as a valid object." (This is weak, but it's the best I have).
