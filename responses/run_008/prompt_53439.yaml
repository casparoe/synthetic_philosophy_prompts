          1.  Numbered section of agreed claims (substantive, no platitudes).
          2.  Exact remaining disagreements (phrased neutrally, no strawmen).
          3.  Underlying cruxes (specifically: status of freedom of movement, audience of justification). Include arguments/evidence bearing on them and predictions (e.g., regarding "guest worker" style bundles).
          4.  Flag any verbal disputes (semantics of "exclusion" vs. "regulation").
      *   **Format:** Numbered agreed claims + Disagreements Table.
      *   **Tone:** Casual but sharp thinking (reading group context, not academic journal).

  2.  **Deconstruct the Positions:**
      *   **Side A (Open Borders):** Freedom of movement is a basic human right. Border enforcement is coercive violence. Economic gains are massive.
      *   **Side B (Right to Exclude):** Political communities have self-determination. Membership control is like a club/collective. Exclusion isn't inherently unjust.
      *   **Common Ground:** Both know the literature (Carens, Wellman, Pevnick, etc.). Both care about justice and outcomes. Both likely agree on *some* restrictions (criminals, security) and distinctions (deportation vs. exclusion).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Substantive points both can sign.
      *   *Idea 1 (Economics):* Global GDP would skyrocket with freer movement. (Both know the Clemens data).
      *   *Idea 2 (Coercion):* Border enforcement involves real violence/threats. It's not just paperwork.
      *   *Idea 3 (Distinction):* Excluding outsiders is morally different from deporting settled residents. (Due process/roots matter).
