      *   *Idea 5 (Current System):* The current system is often arbitrary, inefficient, and cruel, even if exclusion *in principle* is justified.
      *   *Refinement:* Make sure Side B doesn't feel like signing this admits Open Borders is right. Make sure Side A doesn't feel like this concedes the state's absolute sovereignty.
      *   *Drafting points:*
          1.  Economic gains are huge (place-based productivity).
          2.  Enforcement is coercive (guns/detention).
