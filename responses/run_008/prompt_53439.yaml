answer: |-
  # Joint Statement on Immigration and Membership
  **Prepared by:** [Friend A] & [Friend B]
  **Context:** Adversarial Collaboration Reading Group

  After years of debating, we acknowledge that we are not talking past each other on the facts, but we are rooted in different moral defaults. Below is what we actually agree on, where we still diverge, and exactly what would need to change for one of us to convince the other.

  ### 1. Agreed Claims
  *We both sign off on the following substantive claims. None of these are mere politeness; they are substantive concessions.*

  1.  **The Economic Stakes are Massive:** We agree that place-based productivity differences mean that allowing workers to move from low-productivity to high-productivity regions generates global economic gains dwarfing almost any other policy lever. Restricting this movement leaves trillions of dollars "on the sidewalk."
  2.  **Enforcement is Coercive:** We agree that border enforcement is not merely administrative. It ultimately relies on the threat of detention and lethal force (guns). Turning someone away is an act of coercion that requires moral justification; it is not a neutral "do nothing" baseline.
  3.  **Exclusion $\neq$ Expulsion:** We agree there is a sharp moral distinction between preventing a newcomer from entering and deporting someone who is already a settled resident. The latter disrupts established ties and relies on a higher burden of justification.
  4.  **Legitimate Screening Exists:** We agree that a state may screen for specific, individualized threats (e.g., violent criminal history, active terrorism links, contagious pathogens) without violating fundamental rights. We are not arguing for a literal "open door" regardless of conduct.
  5.  **The Status Quo is Often Indefensible:** We agree that the current immigration systems in most wealthy democracies are arbitrary, inefficient, and often cruel in ways that neither of our theoretical positions requires. We can criticize the *implementation* of borders without agreeing on the *principle* of borders.

  ***

  ### 2. Remaining Disagreements & Cruxes
  *We could not reconcile the following. The phrasing below is vetted: Side A accepts the "Side A" column as accurate, and Side B accepts the "Side B" column. Neither feels straw-manned.*

  | Disagreement Topic | Side A (Open Borders) Phrasing | Side B (Right to Exclude) Phrasing | Underlying Crux | Shared Evidence / Case to Watch | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of Movement** | Freedom of movement is a **basic liberty** (like speech or religion). It is the default; restricting it requires a compelling, specific justification (like preventing harm). | Freedom of movement is a **weighty interest**, but subordinate to a community's right to **self-determination**. The default is that a group controls its project; movement is permitted unless it undermines that project. | **Default Setting:** Is the individual's liberty the baseline, or is the community's associative freedom the baseline? | **Case:** A wealthy suburb zoning out low-income housing to preserve "character."<br><br>**A:** This is segregation/exclusion requiring strict scrutiny.<br>**B:** This is local self-governance regarding shared resources. | **A:** If you treat movement as secondary, you inevitably allow majorities to vote away minorities' basic rights.<br>**B:** If you treat movement as absolute, you dissolve the political community's ability to sustain the very institutions that make rights valuable. |
  | **2. Audience of Justification** | The right to exclude must be justified **to the excluded person**. If you stop me at the border, you owe *me* a reason that respects *my* moral standing. | The right to exclude must be justified **to the members**. The state is an agent of its citizens; it owes *them* a defense of how membership rules protect their collective project. | **Scope of Moral Community:** Does the duty of justification extend to all humans equally, or does it attenuate at the border? | **Case:** A private club refusing membership based on arbitrary criteria.<br><br>**A:** The state isn't a club; it controls territory essential for life.<br>**B:** The state *is* a club; it's a cooperative venture for mutual advantage. | **A:** If you only justify to members, you permit "rich kids' clubs" that hoard global opportunity.<br>**B:** If you must justify to outsiders, you effectively grant them veto power over the community's survival strategy. |
  | **3. The "Bundle" Test**<br>*(Entry fee + No Vote + No Welfare)* | This creates a **caste system**. It treats humans as economic units rather than moral equals. Even if economically efficient, it violates egalitarian justice and is inherently unstable. | This is a **legitimate compromise**. It protects the welfare state and political culture while capturing economic gains. It is a permissible way to manage the tension between openness and self-determination. | **Equality vs. Association:** Does justice require equal status for all residents, or can temporary inequality be traded for access? | **Case:** Gulf State "Kafala" systems or historical Guest Worker programs.<br><br>**A:** These inevitably lead to exploitation and social fracture.<br>**B:** These can be regulated to prevent abuse while maintaining distinction. | **A:** Politically unstable. The underclass will eventually demand rights, or the majority will turn nativist. It collapses into either full openness or closed borders.<br>**B:** Politically stable. It satisfies the economic demand for labor without triggering the cultural backlash that kills openness. |

  ***

  ### 3. Flagged Verbal Dispute
  *We suspect part of our deadlock is semantic. If we resolve this, the table above might shrink.*

  **The Dispute:** What does "A Right to Exclude" actually mean?
  *   **Side A hears:** "A right to keep people out entirely." (Blanket Exclusion)
  *   **Side B means:** "A right to set the terms of entry." (Regulated Access)

  **Why it matters:**
  If Side B's position is actually just "We can set terms (visas, fees, quotas)" rather than "We can say no to everyone," Side A might agree that *some* regulation is permissible, provided the terms aren't so onerous they amount to de facto exclusion. Conversely, if Side A admits that *some* terms are allowed, Side B might admit that the "Right to Exclude" isn't absolute.

  **Test for Resolution:**
  If we agree that **"A right to exclude is just a right to regulate entry, provided the regulations aren't designed to make entry impossible,"** does the moral gap close?
  *   **Side A Prediction:** No. Because even "regulated" entry assumes the state owns the land and the migrant is a supplicant. The power dynamic remains unjust.
  *   **Side B Prediction:** Yes. Because once we admit regulation is the goal, we are just haggling over the price of the ticket, not whether the ticket booth should exist.

  ***

  **Next Steps:** We agreed to read *Why Open Borders?* (Carens) alongside *The Right to Do Wrong* (Wellman) again, specifically focusing on whether the "club analogy" holds when the "club" controls the only oxygen in the room.
