  7.  **Final Polish:**
      *   Make sure the "Bundle" prediction is clear.
      *   Ensure the "Verbal Dispute" section highlights how resolving it might change the debate.
      *   *Wait, one detail:* The prompt asks for "Two I suspect matter" regarding cruxes, but also asks to flag verbal disputes. I will integrate the verbal dispute flagging as a specific section or note within the table structure, but the prompt asks for "Format it as a numbered agreed-claims section followed by a disagreements table... If any part... flag which part." I'll add a specific section after the table for the verbal dispute to ensure it stands out as requested in point 4.
