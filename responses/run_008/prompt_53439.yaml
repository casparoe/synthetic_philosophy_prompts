      *   *Disagreement 2: Justification Audience.*
          *   Side A: Must justify to the excluded person.
          *   Side B: Must justify to the members (constituents).
          *   Crux: Scope of moral community.
      *   *Test Case (The "Bundle"):* High fee, no vote, no welfare.
          *   Side A Prediction: Still unjust (creates caste system, violates equality). Unstable.
          *   Side B Prediction: Permissible (protects community project). Stable enough.
      *   *Verbal Dispute:* "Right to Exclude." Does it mean "Keep everyone out" or "Set terms of entry"? Side A thinks Side B means "Keep out." Side B means "Set terms."

  5.  **Drafting Section 4: Verbal Disputes:**
      *   Focus on the definition of "Exclusion."
      *   Side A hears "Closed Door."
      *   Side B hears "Regulated Door."
      *   If they agree on "Regulated Door," the gap narrows.

  6.  **Review and Refine (Self-Correction):**
