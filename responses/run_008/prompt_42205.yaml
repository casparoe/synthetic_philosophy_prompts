answer: |-
  Here is a thought experiment constructed to your specifications. It relies on established psychophysical paradigms available in any standard cognitive neuroscience lab. I have prioritized empirical stability over theoretical neatness, marking the joints where the case requires stipulation.

  ### The Matched Pair: A Single Subject, Two Protocols

  **Subject:** A neurologically healthy adult with normal or corrected-to-normal vision.
  **Setting:** A standard psychophysical lab with eye-tracking and EEG capability (to monitor the P3b component, often associated with Global Workspace ignition).

  #### Occasion 1: The "Objective Threshold" (Meta-Contrast Masking)
  **Stimulus:** A target orientation (a tilted Gabor patch, left or right) is presented for 10ms in the peripheral visual field.
  **Mask:** A high-contrast annulus mask follows the target at a specific Stimulus Onset Asynchrony (SOA) known to produce *meta-contrast masking*.
  **Task:** The subject performs a two-alternative forced choice (2AFC) on the orientation ("Left" or "Right?"). Immediately after, they rate their subjective experience on the Perceptual Awareness Scale (PAS), where 1 = "No experience, pure guess" and 4 = "Clear experience."
  **Outcome:**
  1.  **Functional Criterion:** The subject performs at 85% accuracy (well above chance). The information is clearly available to guide a decision and motor report. In some variants of this paradigm, the stimulus also triggers a P3b-like ERP component, suggesting neural broadcasting.
  2.  **Phenomenal Report:** The subject consistently rates PAS = 1 ("I saw nothing. I am guessing."). They deny any visual qualia.

  #### Occasion 2: The "Partial Report" (Sperling Paradigm)
  **Stimulus:** A 3x4 grid of alphanumeric characters is flashed for 50ms.
  **Task:** A tone (high, medium, low) cues the subject to report only one specific row of the grid immediately after the offset.
  **Outcome:**
  1.  **Functional Criterion:** The subject can accurately report the cued row (3-4 items). However, they cannot report the un-cued rows. By the time they attempt to report a second row, the information is lost (iconic memory decay). The un-cued information is *not* globally available for report or reasoning.
  2.  **Phenomenal Report:** The subject insists, "I saw all 12 letters clearly for a moment, but they faded before I could say them." They report a definite, faint but rich visual experience of the whole grid.

  ***

  ### 1. Theoretical Conclusions

  | | **Occasion 1 (Masking)** | **Occasion 2 (Sperling)** |
  | :--- | :--- | :--- |
  | **Global Workspace Theory (GWT)** | **Conscious.** (Potentially) If the information drives accurate decision-making and triggers neural ignition (P3b), GWT defines this as Access Consciousness. Since GWT equates Access with Consciousness, the subject *is* conscious of the stimulus, despite their denial. | **Unconscious (mostly).** Only the 3-4 reported items entered the Global Workspace. The "feeling" of seeing the rest is a cognitive error or a non-conscious heuristic. The un-reported items were never conscious. |
  | **Block's A/P Distinction** | **Access without Phenomenology.** The subject has *Access Consciousness* (information available for report/decision) but lacks *Phenomenal Consciousness* (no "what it is like"). This is a dissociation. | **Phenomenology without Access.** The subject has *Phenomenal Consciousness* (rich experience of all 12 items) that exceeds *Access Consciousness* (only 4 items reportable). This is "Overflow." |

  ***

  ### 2. The Divergent Feature

  The single feature doing the work in producing the divergence is the **Operational Definition of the Boundary Condition.**

  *   **For GWT,** the boundary of consciousness is drawn at **Global Availability (Function).** If the system uses the data for reasoning/report, it is conscious.
  *   **For Block,** the boundary of *Phenomenal* consciousness is drawn at **Subjective Experience (Qualia).** If the subject feels it, it is phenomenal, regardless of whether the system can use the data.

  In Occasion 1, Function is High, Experience is Low. In Occasion 2, Function is Low, Experience is High. GWT collapses these two dimensions into one; Block keeps them distinct. The divergence arises because GWT treats the subject's denial in Occasion 1 as an error about their own state, while Block treats it as a accurate report of a missing phenomenology. Conversely, in Occasion 2, GWT treats the subject's claim of "seeing all" as an error about their capacity, while Block treats it as an accurate report of phenomenology that exceeded capacity.

  ***

  ### 3. GWT Resistance and Cost

  **The Line of Resistance:**
  The most plausible resistance for the Workspace Theorist is to **tighten the definition of "Global Availability."**

  *   **Against Occasion 1:** The theorist argues that 85% accuracy in masking does *not* constitute Global Workspace access. They claim this performance is mediated by "encapsulated" dorsal-stream or subcortical processing that does not broadcast to prefrontal reasoning systems. They will argue that if the subject truly denies experience, there was no P3b ignition, and therefore no Global Workspace activation. The accuracy is "unconscious priming," not "Access."
  *   **Against Occasion 2:** The theorist argues that the subject's claim ("I saw them all") is not a report of phenomenology but a **cognitive belief**. The subject *infers* they saw the rest because the cued row was clear. There was no phenomenal overflow, only a metacognitive error.

  **The Cost:**
  This resistance costs the theory **empirical falsifiability regarding consciousness.**
  1.  If GWT defines "Global Access" as "Whatever the subject reports consciously," it becomes circular (Consciousness = Report; Report = Consciousness). It ceases to be a theory of *why* we are conscious and becomes a description of *when* we report.
  2.  If GWT defines "Global Access" neurally (e.g., P3b), but ignores the subject's denial in Occasion 1, it severs the link between consciousness and first-person authority. It implies the theorist knows the subject is conscious better than the subject does. This moves GWT from a theory of *experience* to a theory of *information processing*, which concedes Block's main point: that processing (Access) and experience (Phenomenality) are distinct variables.

  ***

  ### 4. The Two Ledgers

  As requested, I have separated the settled physiology from the contested interpretation. Given your background, you will recognize the left column as data and the right column as the philosophical struggle to map that data onto "mind."

  #### Ledger A: Settled Empirical Findings
  *These are phenomena you could replicate in a lab today with high reliability.*

  1.  **Masking Curves:** Visual stimuli masked at specific SOAs result in chance-level subjective report but above-chance forced-choice performance (Objective-Subjective Dissociation).
  2.  **Iconic Memory Decay:** In partial-report paradigms, reportable information decays rapidly (within ~200-500ms) unless attended/rehearsed.
  3.  **Neural Correlates:** Late ERP components (P3b, ~300ms+) correlate strongly with *reportable* awareness. Early components (P1, N1) correlate with stimulus presence but not necessarily report.
  4.  **Blindsight Behavior:** Patients with V1 lesions can point to or guess locations of stimuli in their blind field with above-chance accuracy while denying visual experience.
  5.  **Capacity Limits:** Working memory and reportable attention are strictly limited (approx. 4±1 items), whereas early sensory registers hold higher capacity for brief durations.

  #### Ledger B: Contested Interpretations
  *These are the points of active disagreement in the philosophy of mind and cognitive science literature.*

  1.  **The Status of Iconic Memory:**
      *   *Contest:* Does the high-capacity iconic store contain **Phenomenal Consciousness** (Block's view) or is it a non-conscious buffer that *feels* rich due to cognitive inference (GWT view)?
      *   *Status:* Unsettled. There is no "qualia-meter" to verify the subject's claim independent of report.
  2.  **The Definition of "Access":**
      *   *Contest:* Does "Access" mean *any* information use (including forced-choice guessing and motor priming) or only *flexible, rational report*?
      *   *Status:* GWT proponents often shift this definition. If they include forced-choice, Occasion 1 becomes "Conscious." If they exclude it, Occasion 1 becomes "Unconscious." This flexibility is a major point of criticism.
  3.  **The Target of GWT:**
      *   *Contest:* Is Global Workspace Theory a theory of **Consciousness** (experience) or a theory of **Cognitive Access** (report/attention)?
      *   *Status:* Some proponents (e.g., Dehaene) explicitly state GWT explains *access* consciousness and remains agnostic or reductionist about *phenomenal* consciousness. Others claim it explains consciousness full-stop. This ambiguity allows the theory to dodge the "Overflow" argument by claiming it never promised to explain phenomenology.
  4.  **First-Person Authority:**
      *   *Contest:* When a subject says "I saw nothing" (Occasion 1) or "I saw everything" (Occasion 2), is their report the *data* or the *target of explanation*?
      *   *Status:* If their report is the data, GWT cannot contradict them (making Occasion 1 impossible for GWT). If their report is the target, GWT can claim they are wrong (but risks losing touch with the phenomenon of experience itself).

  ### A Note on Stability
  You asked me to mark where the case is unstable. **Occasion 1 is the unstable joint.**
  It is empirically stable that subjects perform above chance while denying awareness. However, it is *theoretically* unstable to claim this meets "every functional criterion a workspace theory could reasonably demand." A committed Workspace Theorist will simply deny that forced-choice guessing counts as "Global Broadcasting." They will argue the information remained encapsulated in a modular loop.
  To make the case work, I had to stipulate that **high-accuracy forced choice counts as functional access.** If you accept that stipulation, the disagreement with Block is sharp. If you reject it (as many GWT theorists do), Occasion 1 collapses into "Unconscious Processing," and GWT agrees with the subject, removing the conflict.

  Occasion 2 (Sperling) is more stable empirically, but the conflict rests entirely on whether you trust the subject's introspection of "richness" over their actual report capacity. Block trusts the introspection; GWT trusts the capacity. There is no third-party arbiter for this dispute.
