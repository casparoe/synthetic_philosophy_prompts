answer: |-
  Your working theory is close, but it misses the crucial pivot that explains why the "truce" holds. You diagnose the split as **Epistemology (Robbins) vs. Policy Necessity (Applied)**. That is accurate as far as it goes, but it treats the applied side as merely pragmatic. The deeper diagnosis is that the disagreement was about the **boundary of the discipline**, and the truce exists because applied welfare economics quietly ceased being "economics" in the Robbinsian sense and became **ethical engineering**.

  Here is the diagnosis, the reason the truce holds, and what counts as progress.

  ### 1. The Diagnosis: Positive Science vs. Normative Technology
  Robbins's 1932 intervention was a boundary-setting exercise. He wanted to secure economics as a *positive science*. If economics makes interpersonal comparisons, it relies on ethical axioms that cannot be verified by observation. Therefore, to be "scientific," economics must stop short of welfare judgments that require IUC.

  The applied crowd didn't refute Robbins; they ignored the boundary. When you sum WTP or QALYs, you are not doing positive economics. You are operating a **Social Welfare Function (SWF)**.
  *   **Summing WTP** implicitly assumes a specific SWF: Utilitarianism with equal weights on marginal utility of *income* (not utility itself).
  *   **Summing QALYs** assumes a specific SWF: Utilitarianism with equal weights on *health capacity*.

  The disagreement stalled because the two sides were optimizing for different things. Robbins optimized for **logical purity and disciplinary legitimacy**. Applied economists optimized for **decision closure**. You cannot get decision closure without IUC (or a proxy for it). If you strictly follow Robbins, the only admissible policy recommendation is "this makes Person A better off and Person B worse off," leaving the decision entirely to the politician. Transport agencies are hired to recommend *whether to build the bridge*, not just to map the preference landscape.

  **Verdict:** It was a genuine substantive disagreement about the *scope* of economics, resolved not by argument but by **functional differentiation**. Academics kept the purity; agencies took the burden of the ethical axioms required to function.

  ### 2. Why the Applied Side "Gets Away With It"
  You asked why nobody objects on Robbinsian grounds anymore. The answer is **conventionalism**.

  In CBA, we do not claim to measure "utility" in the psychological sense. We measure **proxies** (money, time, health states) and we agree to treat them *as if* they are interpersonally comparable for the sake of the analysis.
  *   **The Kaldor-Hicks Fiction:** This was the bridge. It allowed economists to say, "We aren't comparing utility; we are checking if the winners *could* compensate the losers." Of course, they rarely *do* compensate. But the *potential* compensation allows the analyst to claim they are measuring efficiency, not equity.
  *   **The Numeraire Problem:** By using money (WTP) as the numeraire, you implicitly adopt a distributional weight. $1,000 to a poor person is weighted the same as $1,000 to a rich person in standard CBA. This *is* an interpersonal comparison (it assumes marginal utility of income is constant or irrelevant). It gets away with it because it is codified in **guidance documents** (e.g., Green Book, OMB Circular A-4). The ethical axiom is bureaucratized. It is no longer a scientific claim; it is a regulatory standard.

  Robbins's argument survives intact logically, but it is **institutionally irrelevant**. Agencies are mandated to produce a number. A Robbinsian economist produces a vector; a transport economist produces a scalar. The scalar wins because budgets are scalars.

  ### 3. Does Harsanyi Solve It?
  **No.** Harsanyi's veil of ignorance (and the extended preferences theorem) is a justification for *Utilitarianism*, not a solution to the *measurement* problem.

  Harsanyi argues that if you were rational and didn't know who you were, you would maximize average utility. This provides an ethical foundation for summing utilities. However, it still requires **cardinal utility**. You cannot maximize an average if the units are ordinal. Harsanyi solves the *weighting* problem (everyone counts for one), but he does not solve the *metric* problem (what is the unit?).

  In your CBA work, Harsanyi tells you *why* you might want to sum WTP, but he doesn't tell you how to ensure that my WTP for a minute of travel time is the same "unit" of satisfaction as yours. It relabels the ethical assumption as a rationality constraint, but the epistemological gap remains.

  ### 4. Does Hedonic Psychology/Neuroscience Touch Robbins?
  **Yes, but it moves the goalposts rather than clearing the field.**

  Robbins's argument was based on **Revealed Preference**. He argued that because we only observe choices, and choices only reveal orderings, we cannot infer cardinal intensity across persons.
  *   **The Challenge:** If neuroscience can measure dopamine spikes or fMRI activation associated with "satisfaction," we arguably have a direct observation of utility that bypasses choice. This attacks Robbins's epistemological premise (that utility is unobservable).
  *   **The Survival of Robbins:** The comparability problem shifts from "preferences" to "neural states." Is 50 units of dopamine in Brain A equivalent to 50 units in Brain B? Brain A might have a higher baseline, or different receptor sensitivity. To compare them, you still need a "normalization" assumption.

  So, hedonic psychology converts the problem from **unobservable in principle** to **calibration in practice**. It makes IUC scientifically tractable, but it does not make it value-free. You still have to decide that "dopamine units" are the correct metric for social welfare rather than "preference satisfaction" or "capability." That is still an ethical choice, which Robbins would flag as outside positive science.

  ### 5. What Counts as Progress?
  If the diagnosis is that the truce is a **bureaucratization of ethical axioms**, then progress is not solving IUC (which is likely impossible in the strong philosophical sense). Progress is **transparency about the ethical content of the metrics.**

  Currently, CBA hides the IUC behind the "efficiency" label. Progress looks like this:
  1.  **Abandon the Kaldor-Hicks Pretense:** Acknowledge that summing WTP is a distributional choice. It favors those with higher ability to pay.
  2.  **Explicit Distributional Weights:** Instead of pretending money is comparable, apply weights to WTP based on income or equity goals. The UK's *Green Book* now encourages this; the US is lagging. This admits the IUC is a value judgment and makes it explicit.
  3.  **Separate Efficiency and Equity:** Present the CBA result (efficiency) alongside a distributional impact analysis (equity). Let the decision-maker see the trade-off rather than burying it in a single Net Present Value (NPV) figure.
  4.  **Metric Pluralism:** In transport, don't just use WTP. Use accessibility metrics (can people get to jobs?) which are closer to capabilities than utility. This sidesteps the utility comparison by comparing *opportunities*, which are more objectively observable than satisfaction.

  ### Summary
  Robbins was right that IUC is not *scientific inference*. Applied economists are right that policy requires *ethical commitment*. The "truce" is a misunderstanding: we pretend the ethical commitment is a scientific fact to avoid political friction.

  **Progress** is not finding a way to measure utility across heads. It is stopping the claim that we are doing so when we are actually applying a specific, debatable social welfare function. As a transport economist, you make progress when you explicitly state: *"This analysis sums WTP, which implicitly weights the preferences of the wealthy more heavily than the poor. Here is the sensitivity analysis if we adjust for that."* That acknowledges Robbins without paralyzing the agency.
