prompt: |-
  I keep hearing the line about the arc of the moral universe being long but bending toward justice — at rallies, in commencement speeches, on protest signs — and last week a friend used it to wave off my pessimism about, honestly, a lot of current events. His tone was basically "relax, it's physics, justice is coming." That bugged me and I've been trying to figure out exactly why. Can you disentangle what that one sentence could actually be claiming? I want the distinct precise theses laid out as a menu, roughly: a providence claim where something (God? history itself?) is steering events; a bare empirical trend claim that things have on average gotten more just over recorded history and will keep doing so; a selection-effect claim where surviving moral progress gets remembered and backlash gets forgotten; a self-fulfilling version where believing it makes activists persist and that's what does the bending; and a purely rhetorical reading where it motivates without asserting anything at all. For each reading, tell me whether it's trivial, substantive and defensible, or just false, and — this is the part I actually care about — which of those readings would support my friend's use of it, i.e., which ones justify relaxing rather than working. Also I keep snagging on this: even if the arc bends, bends toward *what*? Who gets to say what counts as justice when we're checking whether history curved the right way, and is that a fatal circularity or just normal normative disagreement? One more thing: please be upfront about which parts of this are more or less settled among people who study history and progress for a living and which parts are genuinely contested — I don't want one particular philosopher's theory handed to me as if it were the consensus. A list I can bring back to my friend would be perfect. (Also if a couple of the readings are basically the same idea in different clothes, just say so instead of padding.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Subject:** The quote "The arc of the moral universe is long, but it bends toward justice" (often attributed to MLK Jr., originally Theodore Parker).
      *   **User's Problem:** The user is bothered by a friend using this quote to suggest passivity ("relax, it's physics"). The user wants to understand *why* that bugs them by dissecting the claim.
      *   **Specific Requirements:**
          *   Disentangle distinct precise theses (menu style).
          *   Specific categories requested: Providence, Empirical Trend, Selection Effect, Self-Fulfilling, Rhetorical.
          *   Evaluation for each: Trivial, Substantive/Defensible, or False.
          *   Crucial Evaluation: Which readings justify *relaxing* vs. *working*?
          *   Address the "What is Justice?" problem (normative circularity).
          *   Epistemic Status: Distinguish between settled and contested views among historians/philosophers (avoid presenting one theory as consensus).
          *   Format: A list the user can bring back to their friend.
          *   Tone: Analytical, precise, honest about uncertainty, not preachy.

  2.  **Deconstruct the Quote & Context:**
      *   *Origin:* Theodore Parker (19th-century Unitarian minister), popularized by MLK Jr.
      *   *Context:* Usually used to encourage persistence in the face of setbacks, *not* to encourage passivity.
      *   *The Friend's Interpretation:* "It's physics," implying inevitability. This is the crux of the user's annoyance.

  3.  **Drafting the Theses (The Menu):**

      *   *Thesis 1: Providential/Teleological.* (God/History has a plan).
          *   *Status:* Metaphysical/Religious. Not empirically verifiable.
          *   *Action Implication:* Could imply passivity (God will handle it) OR active participation (be God's instrument). MLK meant the latter.
          *   *Verdict:* Substantive but unfalsifiable. Friend's use (passivity) is a distortion of the original intent.

      *   *Thesis 2: Empirical Trend.* (Data shows things get better).
          *   *Status:* Contested. Pinker vs. others. "Long run" is tricky.
          *   *Action Implication:* If inevitable, why work? If trend exists *because* people work, then work.
          *   *Verdict:* Substantive but debatable. Friend's use relies on a "natural law" version which is likely false.

      *   *Thesis 3: Selection Effect.* (Survivorship bias).
          *   *Status:* Plausible/Cynical. We remember the wins.
          *   *Action Implication:* Illusion of progress. Don't relax, stay vigilant.
          *   *Verdict:* Defensible critique, undermines the "relax" argument.

      *   *Thesis 4: Self-Fulfilling/Performative.* (Belief causes the work).
          *   *Status:* Psychological/Sociological. Hope fuels action.
          *   *Action Implication:* Believe it *so that* you work.
          *   *Verdict:* Defensible. Directly contradicts the "relax" instruction.

      *   *Thesis 5: Rhetorical/Mobilizing.* (It's a slogan, not a fact).
          *   *Status:* Literary analysis.
          *   *Action Implication:* It's a call to arms.
          *   *Verdict:* Trivial as fact, useful as tool. Friend's use is a category error.

  4.  **Addressing the "What is Justice?" Problem:**
      *   Who defines justice? Winners write history.
      *   Is it circular? Yes, often.
