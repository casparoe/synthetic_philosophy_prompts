answer: |-
  You have rediscovered a specific and notorious edge case in decision theory. The intuition you're grappling with is mathematically sound, and the phenomenon has a name.

  The specific toy bet you are describing is known in the literature as the **Pasadena Game**.

  It was formalized in a 2004 paper by Harris Nover and Alan Hájek titled *"Vexing Expectations."* It is a direct sibling of the St. Petersburg Paradox, but as you correctly sensed, it is a "different animal" and, in the view of many theorists, a more damaging one.

  Here is the breakdown of the terminology, the mathematics, and the current state of play regarding how a rational agent is supposed to handle it.

  ### 1. The Name and the Math
  **The Term:** The **Pasadena Game**.
  **The Mathematical Property:** **Conditionally Convergent Expectation.**

  In standard probability theory (specifically Lebesgue integration, which underpins modern measure-theoretic probability), the expected value $E[X]$ of a random variable is only well-defined if the variable is **absolutely integrable**. That is, $E[|X|] < \infty$.

  *   **Ordinary Bet:** $E[|X|]$ is finite. The sum converges absolutely. Order of summation doesn't matter.
  *   **St. Petersburg Paradox:** $E[X^+] = \infty$ and $E[X^-] = 0$. The expectation is $+\infty$. It is determinate, just unbounded.
  *   **Pasadena Game:** $E[X^+] = \infty$ and $E[X^-] = \infty$. The expectation is $\infty - \infty$.

  In analysis, this is the realm of the **Riemann Rearrangement Theorem**. As you noted, because the series $\sum \frac{(-1)^{n+1}}{n}$ converges conditionally but not absolutely, you can rearrange the terms (re-index the sample space) to sum to any real number $L$, or to diverge to $\pm \infty$.

  Since the "fair price" of a bet should not depend on the arbitrary order in which an accountant chooses to list the outcomes, the expectation is formally **undefined**.

  ### 2. How It Differs from the St. Petersburg Paradox
  You are right to distinguish this from the classical St. Petersburg case.

  *   **St. Petersburg:** The problem is **unboundedness**. The value is $+\infty$. The philosophical puzzle is: "Why won't anyone pay \$100 to play?" Solutions usually involve utility curvature (diminishing marginal utility) or finite bankrolls. The math itself is consistent; the value is just huge.
  *   **Pasadena:** The problem is **indeterminacy**. The value isn't huge; it's *nonexistent*. There is no number to plug into a utility function. This breaks Expected Utility Theory (EUT) more fundamentally than St. Petersburg does. St. Petersburg stretches EUT; Pasadena shatters it.

  There is also a variant called the **Altadena Game**, where the terms are tweaked so the partial sums oscillate forever without converging even conditionally. But the Pasadena Game is the canonical "undefined value" case.

  ### 3. The Decision-Theoretic Consensus (Or Lack Thereof)
  You asked if there is a settled story about what a rational agent should do. The short answer is **no**. This remains an open problem in foundational decision theory.

  Here are the main positions currently held by theorists who work on this:

  **A. The Exclusion View (Domain Restriction)**
  Some argue that acts with undefined expectations simply fall outside the domain of rational choice theory. Just as we don't ask rational agents to divide by zero, we shouldn't ask them to maximize undefined expectations.
  *   *Implication:* You refuse to rank the bet. It is incomparable to any bet with a defined EV.
  *   *Critique:* This seems ad hoc. Why is nature forbidden from creating such distributions?

  **B. The Principal Value View**
  One might argue that the "natural" ordering of the sample space (Flip 1, Flip 2, Flip 3...) provides the correct summation order. This yields a specific value (for the standard harmonic setup, it's $\ln(2)$).
  *   *Implication:* You treat the bet as having a finite fair price based on the natural indexing.
  *   *Critique:* This violates the principle that the value of a gamble should be invariant under redescription. If I group outcomes (1 & 2), (3 & 4), etc., the sum changes. Relying on the "natural" order is mathematically fragile.

  **C. Relative Expectation Theory**
  Alan Hájek (one of the discoverers of the paradox) later proposed that we shouldn't evaluate these bets in isolation. Instead, we should compare two undefined bets *against each other*.
  *   *Implication:* While Bet A has no value and Bet B has no value, the *difference* $A - B$ might have a defined expectation. You rank them relatively, not absolutely.
  *   *Status:* This is a leading candidate for a solution but requires rewriting standard decision theory axioms.

  **D. Finite Cutoffs (Your Suggestion)**
  You suggested using a cutoff after finitely many terms. In practice, this is what happens in physics and actuarial science.
  *   *Implication:* Acknowledge that no counterparty has infinite capital. If the game master cannot pay out beyond $2^{100}$, the tail is truncated, absolute convergence is restored, and the EV becomes finite (though very sensitive to the cap).
  *   *Status:* This is the "pragmatic" solution. It dissolves the paradox by denying the premise of the infinite game.

  ### 4. An Actuarial Perspective
  Since you are a retired actuary, you might appreciate why this doesn't keep practitioners up at night. In practical risk modeling, we enforce **absolute convergence** by design.

  We never model liabilities with tails heavy enough to create $\infty - \infty$ scenarios. We use:
  1.  **Policy Limits:** Hard caps on payouts.
  2.  **Probability Truncation:** Events with $p < 10^{-X}$ are treated as zero.
  3.  **Risk Margins:** We price based on VaR or TVaR (Tail Value at Risk), which focus on specific quantiles rather than the global mean.

  The Pasadena Game is a "model risk" extreme. It highlights that **Expected Value is not a robust statistic** for heavy-tailed distributions. If you encounter a distribution where the mean depends on the summation order, the mean is the wrong tool. You would switch to median, mode, or quantile-based pricing.

  ### Summary
  *   **Name:** The **Pasadena Game**.
  *   **Mathematical Status:** The expectation is **undefined** due to conditional convergence (violation of absolute integrability).
  *   **Decision Theory Status:** It is a paradox that breaks standard Expected Utility Theory. There is no universal consensus on how to rank such bets, though **Relative Expectation Theory** or **Domain Restriction** are the most common theoretical responses.
  *   **Practical Advice:** Your intuition to use a cutoff is the standard pragmatic fix. In the absence of a physical constraint (like a bankrupt casino), a rational agent should likely treat the bet as **incomparable** to standard options, as there is no coherent number to maximize.

  You haven't missed a term; you've stumbled onto one of the sharpest thorns in the foot of decision theory.
