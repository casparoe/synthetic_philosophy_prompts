          *   Suspects equivocation (a term doing two jobs).
      *   **Goal:** Identify the flawed step, explain the cost of rejecting it, or advise which intuition to surrender if they are incompatible. Identify any equivocation.

  2.  **Deconstruct the Flatmate's Argument:**
