answer: |-
  1. Distribute decks of cards bearing abstract glyphs and train the group on several example classifications without ever articulating the underlying principle governing those examples. Tell them everyone learned from the same training set and must now continue the classification practice independently.
  2. Players take turns placing a card into one of two bins, earning a point only if the rest of the group unanimously agrees the placement accords with the rule they all supposedly share. If anyone objects, the turn pauses for discussion until consensus is reached or the point is forfeited.
  3. Midway through, introduce a borderline card that legitimately fits multiple interpretations of the training data, causing immediate disagreement despite identical prior success. Observe that no fact about any individual's past behavior or mental state dictates the correct placement for this specific new case.
  4. Explain that the deadlock mirrors the skeptical paradox where no internal fact fixes meaning, while the eventual consensus required to resume scoring illustrates the communitarian solution where correctness is constituted by group assertion. Emphasize that the rule only exists insofar as you collectively sustain the practice of judging one another.
  5. Participants will likely treat the disagreement as a mere verbal misunderstanding rather than a metaphysical lack of fact, and the game cannot reproduce the deep anxiety that meaning itself is unintelligible without a community. Furthermore, the game makes agreement explicit and deliberative, whereas Kripke's solution relies on a blind, pre-reflective consensus embedded in forms of life.
