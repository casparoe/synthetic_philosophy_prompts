prompt: |-
  i host a small philosophy podcast and my next guest is a philosopher who thinks that since our moral beliefs were shaped by natural selection for fitness rather than truth, moral realism is dead in the water — her whole shtick is that the realist faces a dilemma: either our moral faculties were selected for tracking fitness, in which case they've got no obvious link to independent moral facts, or evolution somehow left them untouched, in which case their link to reproductive success becomes a miracle to explain. Help me prep exactly five interview questions, numbered, one or two sentences each, and skip any intro or wrap-up — i just want the list. The questions should press where the literature actually presses: one on why the debunking doesn't generalize to mathematics or logic (if selection explains why we believe things like modus ponens, why trust that either?), one on whether her view is self-undermining (her confidence that we ought to follow our evidence is presumably also fitness-driven, so why does it survive the debunking when moral confidence doesn't?), and one on the tracking response — couldn't evolved moral faculties track moral truth the way evolved perceptual faculties track medium-sized objects, and what exactly breaks the analogy in her view. The last two are up to you, but put them where you think she's most likely to squirm, and where you can, fold a follow-up into the question itself keyed to the answer she's most likely to give. Nothing generic like what drew her to the topic — we've only got 40 minutes and i intend to spend all of them being annoying.
