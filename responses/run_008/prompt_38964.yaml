answer: |-
  1. If evolutionary pressure explains our belief in modus ponens just as well as our belief in kindness, why doesn't your argument debunk logic and mathematics alongside morality? What specific cognitive mechanism distinguishes moral intuitions from logical ones such that one is fitness-tracking while the other is truth-tracking?

  2. Since your confidence that we ought to follow evidence is presumably also a product of fitness-driven cognition, why does that normative belief survive your debunking argument when moral confidence doesn't? Are you exempting epistemic norms from evolutionary scrutiny, and if so, isn't that special pleading?

  3. Couldn't evolved moral faculties track moral truth the way evolved perceptual faculties track medium-sized objects, and what exactly breaks the analogy in your view? If evolution selects for true beliefs about predators because true beliefs aid survival, why couldn't it select for true moral beliefs if those also aid survival?

  4. If survival and reproductive success are themselves objectively morally good, doesn't evolution naturally track moral truth rather than drifting away from it? If you deny survival is good, aren't you relying on a substantive moral claim that your own argument suggests we have no access to?

  5. Given that we routinely revise our moral intuitions through reflective equilibrium rather than just accepting instinctive impulses, why treat all moral belief as equally vulnerable to evolutionary debunking? Does your argument imply that any moral belief surviving rigorous philosophical scrutiny is still just a fitness heuristic in disguise?
