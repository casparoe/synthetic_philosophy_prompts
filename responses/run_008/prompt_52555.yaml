      *(Refining the Bayesian part)*: If $P(E)=1$, then $P(H|E) = P(H)$. So old evidence confirms nothing. This means Mercury couldn't have confirmed GR. This contradicts history. So the prompt asks what would change *if* they adopted this. The answer is: They would have to stop citing Mercury as confirmation and focus only on future tests (like gravitational waves, black hole shadows).

