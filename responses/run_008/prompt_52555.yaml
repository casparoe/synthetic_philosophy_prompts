          4.  Analyze the implications of adopting a strict Bayesian conditionalization view (where $P(E)=1 \implies P(H|E) = P(H)$).
          5.  Advise on how scientists/journalists should talk about "evidence" under that strict Bayesian view.

  2.  **Task 1 & 2: Implicit Epistemology (Novelty vs. Accommodation):**

      *   *Observation:* Scientists prefer "risky predictions" (Popperian falsificationism) over "curve fitting."
      *   *Epistemology:* This aligns with *Predictivism*. The thesis is that successful novel predictions confirm a theory more strongly than the accommodation of known data.
      *   *Why?* The fear of *overfitting* or *ad hocery*. If you tune parameters to fit existing data, you might just be describing noise or capturing local regularities without grasping the underlying mechanism. A novel prediction suggests the theory has captured a structural truth that extends beyond the data used to build it.
      *   *The Mercury Exception:* Why did Mercury count for GR? Because Einstein didn't tune GR to fit Mercury. He derived GR from principles (equivalence, covariance), *then* checked Mercury. It was "old evidence" but "new explanation."
      *   *The MOND Case:* MOND was explicitly constructed to fit rotation curves. It was *designed* for that data.
      *   *Distinction:* It's not just about *when* the data was known (temporal novelty), but about *use novelty* (whether the data was used in the construction of the theory).

  3.  **Task 3: Internal Coherence (Mercury vs. MOND):**

      *   *Is it coherent?* Yes, if we distinguish between *temporal novelty* and *use novelty*.
      *   *Mercury:* Data existed (1859), Theory derived independently (1915). No tuning. High confirmation.
