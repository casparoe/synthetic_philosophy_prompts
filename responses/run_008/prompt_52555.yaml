answer: |-
  You have put your finger on one of the most persistent and vexing issues in the philosophy of science: **The Problem of Old Evidence.**

  Your frustration is well-founded because, on the surface, the scientific community appears inconsistent. They celebrate Einstein for explaining Mercury (old data) but penalize Milgrom for explaining rotation curves (old data). They celebrate Eddington for finding new light-bending (new data).

  However, this practice is not incoherent. It relies on a nuanced epistemology that distinguishes between *when* data was discovered and *how* it was used. Here is a reconstruction of the implicit norms governing this practice, an evaluation of their coherence, and an analysis of what would happen if science adopted a strict Bayesian framework.

  ### 1. The Implicit Epistemology: Predictivism and Use Novelty

  The normative practice you observe presupposes a view called **Predictivism**. This is the thesis that successful novel predictions confirm a theory more strongly than the accommodation of known data. However, to make sense of the Mercury vs. MOND asymmetry, we must refine this. Scientists are not tracking *temporal novelty* (when the data was found); they are tracking **use novelty** (whether the data was used to construct the theory).

  **The Grounds for Scoring Differently:**
  Scientists implicitly penalize theories that accommodate old data if that accommodation was achieved through **tuning** or **ad hoc adjustment**.

  *   **General Relativity (Mercury):** Einstein did not derive his field equations to fit Mercury's perihelion. He derived them from principles of covariance and equivalence. When he applied the finished equations to Mercury, the number popped out correctly without adjusting free parameters. The data was "old," but the *explanation* was new and independent.
  *   **MOND (Rotation Curves):** MOND (Modified Newtonian Dynamics) was explicitly constructed by Milgrom to make the rotation curves come out right. It introduced a new acceleration scale ($a_0$) tuned to the data at hand.
  *   **General Relativity (1919 Eclipse):** The data did not exist. The theory made a risky claim about a specific number (1.75 arcseconds) that could have easily been wrong.

  **The Epistemic Risk:**
  The community discounts accommodation because of the risk of **overfitting**. If you have enough free parameters, you can fit any dataset (the "Von Neumann elephant" problem). A theory that fits old data might just be a complex description of that data, not a capture of underlying reality. A theory that predicts new data has survived a **severe test** (in the sense of philosopher Deborah Mayo). It stuck its neck out where it could have been chopped off.

  ### 2. Is the Norm Internally Coherent?

  **Yes, but with caveats.** The Mercury-versus-MOND asymmetry is not a contradiction; it is a feature of how scientists evaluate **independent warrant**.

  The norm is coherent if we understand that "evidence" is not just about $P(E|H)$ (the likelihood of the data given the theory), but about the **probability of the theory itself** relative to its competitors.

  *   **Degrees of Freedom:** GR had essentially no free parameters to tune for Mercury. MOND had a scaling parameter tuned to the galaxies.
  *   **Unification:** GR didn't just explain Mercury; it unified gravity, inertia, and geometry, explaining light bending and time dilation simultaneously. MOND, initially, was a phenomenological fix for dynamics without a relativistic framework (though TeVeS and later theories attempted this).
  *   **Theorist's Track Record:** You mentioned this, and it matters. Einstein had a prior track record of deriving deep truths from principles (Special Relativity, Photoelectric effect). This gave the community license to trust his derivation on Mercury even though the data was old.

  **Where the Coherence Wobbles:**
  The incoherence you sense arises when journalists (and sometimes scientists) conflate *temporal novelty* with *confirmatory power*.
  *   *Incoherent Statement:* "GR is better because it predicted the eclipse (new), whereas MOND is worse because it fit curves (old)."
  *   *Coherent Reality:* "GR is better because it derived Mercury without tuning (use novelty) AND predicted the eclipse (temporal novelty). MOND is penalized because it was tuned to the curves (use accommodation), though it is credited for predicting the Tully-Fisher relation (which was not used in its construction)."

  So, the practice is coherent provided one understands that **accommodation is only penalized when it looks like curve-fitting.** If a theory explains old data through a mechanism that was not tuned to that data (like GR and Mercury), it counts as strong confirmation.

  ### 3. The Strict Bayesian Shift

  Now, let's address your final challenge. What if the community adopted a **strict Bayesian conditionalization** view?

  In standard Bayesian confirmation theory, evidence $E$ confirms hypothesis $H$ if $P(H|E) > P(H)$. By Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  **The Problem:** If $E$ is already known with certainty (like Mercury's orbit in 1915), then $P(E) = 1$.
  Consequently, $P(H|E) = P(E|H) \cdot P(H)$.
  If the theory entails the evidence ($P(E|H) = 1$), then **$P(H|E) = P(H)$**.
  **Strictly speaking, known evidence cannot change your credence in a theory.**

  If scientists and journalists adopted this strict view, the language of physics would have to undergo a radical transformation.

  #### A. The Death of "Explaining" Old Data
  Scientists could no longer say, "General Relativity is supported by the precession of Mercury." Since Mercury's orbit was known before GR, it could not, in this strict framework, raise the probability of GR.
  *   **New Language:** They would have to say, "General Relativity is **consistent** with Mercury," or "GR provides a **unifying explanation** for Mercury," but they could not claim Mercury acts as *confirmatory evidence*.
  *   **The Focus:** All confirmatory weight would shift exclusively to **novel predictions**. The 1919 eclipse would carry the entire burden of proof for GR. The discovery of gravitational waves (2015) would be the only thing "confirming" GR today, not the GPS systems that rely on it daily (since we already knew GPS worked).

  #### B. The "Logical Relationship" Loophole
  Most Bayesians reject the strict $P(E)=1$ rule precisely because it makes science impossible (most evidence is old). They adopt solutions like **Garber's Solution**, where we conditionalize not on $E$, but on the *logical fact* that $H$ entails $E$.
  *   **New Language:** "The evidence isn't that Mercury moves this way; the evidence is that **Einstein's equations mathematically necessitate** this movement."
  *   **Journalistic Shift:** Headlines would change from "New Data Supports Theory" to "Theory Successfully Derives Known Fact." The value proposition shifts from *empirical discovery* to *mathematical insight*.

  #### C. The End of "Evidence For"
  If you strictly enforce that known facts cannot move credence, the phrase "evidence for" becomes reserved solely for **post-theory discoveries**.
  *   **Current:** "The cosmic microwave background is evidence for the Big Bang." (Old data relative to the theory's acceptance).
  *   **Strict Bayesian:** "The CMB is an **explanation target** for the Big Bang. Evidence for the Big Bang was the discovery of the CMB *after* the prediction."

  ### Summary for Your Readership

  When you write about this, you can clarify the confusion by distinguishing between **accommodation** and **derivation**.

  1.  **The Norm is Coherent:** Scientists aren't hypocrites regarding Mercury vs. MOND. They are tracking whether the theory was *built* to fit the data (MOND) or whether the data *fell out* of the theory (Mercury).
  2.  **The Real Work:** The heavy lifting is done by **theoretical virtues** (simplicity, unification, lack of tuning) rather than just the chronological order of data.
  3.  **The Bayesian Trap:** If we followed strict Bayesian rules, almost all of science's greatest triumphs (explaining old anomalies) would cease to count as "confirmation." We would be forced to view science not as a cumulative building of truth on old facts, but as a series of risky gambles on future facts.

  **The Takeaway:** The "inconsistency" you see is actually a sophisticated heuristic. Scientists trust theories that *risk being wrong* more than theories that *ensure being right*. Einstein risked being wrong on Mercury (he didn't have to be); Milgrom ensured being right on rotation curves (by design). That is the asymmetry that matters.
