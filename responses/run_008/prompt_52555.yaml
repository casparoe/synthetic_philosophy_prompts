      *   *Implication:* If scientists adopted this strictly, Mercury and Eddington's light bending would *both* be worthless once known.
      *   *Resolution in Practice:* Bayesians usually argue we conditionalize on the *logical relationship* between H and E, not just E itself. Or we imagine a counterfactual state where we didn't know E.
