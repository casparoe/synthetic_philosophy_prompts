      *   *Real Work:* It's not just "old vs. new." It's about *degrees of freedom* and *independent motivation*. Simplicity and unification play a role here. GR unified gravity, inertia, and geometry. MOND modifies Newtonian dynamics specifically for low acceleration without a broader relativistic framework (initially).
      *   *Verdict:* The norm is largely coherent if understood as "Use Novelty" + "Theoretical Virtues" (unification, simplicity), not just "Temporal Novelty." The asymmetry isn't a contradiction; it's a feature of avoiding ad hoc hypotheses.

  4.  **Task 4: Strict Bayesian Conditionalization (The "Old Evidence" Problem):**

