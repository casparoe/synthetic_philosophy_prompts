answer: |-
  **Project Title:** Split Verdicts: Re-examining the Canonical Evidence for Institutional Determinism

  **The Question**
  The dominant narrative in development economics holds that "institutions rule": national wealth is determined not by geography or culture, but by the rules elites play by. This argument relies rhetorically on a small set of "natural experiments"—partitions like Korea, Germany, and Nogales—where geography and culture are held constant while institutions diverge. My project asks a two-part question: *First, does the canonical list of institutional showcase cases suffer from systematic selection bias, ignoring partitions where divergent institutions produced convergent outcomes? Second, do these cases conflate institutional change with demographic and human-capital shifts, thereby bundling distinct causal mechanisms?*

  This is both an evidential and a conceptual inquiry. It is evidential because it requires auditing the sample size of twentieth-century partitions to test for selection bias. It is conceptual because it probes whether "institutions" can be meaningfully individuated from the population flows and cultural shifts that accompany political splits. If the "institutional" effect is actually a "demographic" effect, or if the evidence is cherry-picked, the public understanding of development policy requires significant recalibration.

  **Why the Question Remains Open**
  Scholarly debate on this topic is robust but siloed. Econometricians dispute the specifications of growth regressions, while historians argue over the specific contingencies of, say, the Korean War. However, neither dispute has penetrated the popular synthesis of the idea. The "showcase cases" have achieved the status of parables; they are taught in introductory courses and cited in op-eds as settled proof.

  Existing treatments leave the question open because they treat these cases as *proof of concept* rather than *data points*. An academic paper might control for migration in a specific case study, but rarely does anyone step back to ask why *these* specific cases became the ambassadors for the theory. Furthermore, the "geography vs. institutions" debate often stalls on definitional grounds: if geography shapes institutions over the long run, is the distinction meaningful? A journalistic investigation can cut through this by focusing not on the ultimate metaphysical truth, but on the integrity of the evidence used to persuade the public. The narrative architecture has not been inspected.

  **Methodology and Timeline**
  I am a journalist, not an econometrician. I will not attempt to run new causal regressions. Instead, I will treat the literature as a dataset to be audited and the history as a story to be reported.

  *   **Months 1–3: The Audit.** I will assemble a comprehensive catalog of twentieth-century political partitions, border splits, and post-imperial divisions. Using existing historical datasets and expert consultation, I will code these outcomes broadly (diverged, converged, or mixed). The goal is not statistical significance but to identify "negative cases"—partitions that should support the institutional thesis but do not. I will simultaneously map the citation networks of popular institutionalist texts to quantify the reliance on the canonical few.
  *   **Months 4–6: The Deep Dive.** I will select three "negative cases" and one "canonical case" for deep reporting. I will interview economic historians, demographers, and political scientists to understand the mechanisms at play. Specifically, I will investigate the "bundling" problem: in the canonical cases, how much of the divergence is due to rule changes versus selective migration, mortality, or education policies? I will seek to disentangle the "rules" from the "people."
  *   **Months 7–9: Synthesis and Writing.** I will draft the final manuscript, weaving the quantitative audit into a narrative investigation. I will test my findings against the views of leading institutionalists to ensure their arguments are represented charitably but rigorously.

  **Deliverables**
  The primary deliverable is a long-form feature article (6,000–8,000 words) suitable for a general-interest magazine. This form suits the findings because the project is ultimately about how ideas travel and solidify in public discourse. A dry paper would miss the point; the story *is* the persuasion. Additionally, I will produce a sidebar or interactive graphic visualizing the "catalog of partitions," showing the universe of splits versus the celebrated few. This provides transparency and allows readers to see the selection bias visually.

  **Criteria for Failure**
  I must be frank about the risks. The project would fail if:
  1.  **The "Bias" is Already Standard:** If I discover that development economists already universally acknowledge the selection bias and the bundling problem, and have adjusted their public claims accordingly, my critique would be attacking a straw man. In this case, the project would pivot to analyzing *why* the simplified narrative persists despite expert caveats.
  2.  **The Data Does Not Exist:** If the historical record on non-canonical partitions is too sparse to code outcomes even roughly, the evidential pillar collapses. I would then have to rely entirely on the conceptual critique, which is weaker.
  3.  **The Distinction is Indivisible:** If, upon interviewing experts, it becomes clear that institutions and population dynamics are theoretically inseparable (i.e., you cannot have one without the other), then the "bundling" critique loses its force.

  If any of these occur, I will not force a contrarian conclusion. I will report the nuance. A story explaining why the question is harder than we thought is still a valuable contribution to public understanding.

  **Why a Journalist?**
  A committee member might ask: *Shouldn't this be done by a PhD candidate or a research fellow?* The answer lies in the audience and the objective. An academic's incentive is to refine the model for peers; my incentive is to test the story for the public. The "institutions rule" argument has escaped the lab and become a worldview. It is used to justify foreign aid, regime change, and domestic policy.

  Academics are trained to add variables; journalists are trained to follow the narrative thread. This project requires tracing how a specific set of historical anecdotes became the foundation of a global theory. It requires synthesizing history, economics, and sociology without getting bogged down in disciplinary jargon. I have the freedom to write for an intelligent layperson, to highlight the human stakes of the "bundling" problem, and to hold the theory accountable not to a p-value, but to the historical record as it is understood by the public. This fellowship offers the time to do the reporting necessary to ensure that the stories we tell about why nations succeed or fail are as robust as the policies built upon them.
