  *   **The "Fossil" Comment:** This is the key to her consistency. When she says moral facts aren't "waiting to be found like fossils," she is rejecting a **Platonic** view of morality (where "Goodness" floats in a spiritual realm). Instead, she likely holds that moral facts **supervene** on natural facts. This means moral properties depend entirely on the natural situation (like slavery causing suffering), but they aren't *reducible* to it. They don't exist "alongside" the natural facts like a ghost next to a machine; they exist *in virtue of* them. This explains why she thinks they are objective but not "scientific."

  ### 2. Predictions for the Three New Cases

  Based on Non-Naturalist Realism with Supervenience, here is how Dana will likely answer:

  **Case 1: The Mindless Universe**
  *   **Verdict:** She will say **"Bad" does not apply.**
  *   **Reasoning:** While Dana thinks moral truths are objective, she also implies they require a context of sentient experience (hence the "fossil" comment—fossils exist without us, but *wrongness* requires a victim). If there are no minds to suffer, there is no "suffering" in the moral sense, only physical processes. Moral properties supervene on natural properties involving *experience*. No experience = no moral properties.
  *   **Dana's likely quote:** "Without a mind to experience the suffering, there's no 'badness' there to be true. It's just physics."

  **Case 2: The Perfectly Informed Rationalist**
  *   **Verdict:** She will say **At least one is mistaken, and the "perfectly informed" person could be the mistaken one.**
  *   **Reasoning:** Dana explicitly said, "You can't prove moral claims the way you can prove the Pythagorean theorem." For a Non-Naturalist, knowing all the *natural* facts (physics, biology) plus logic does not guarantee you know the *moral* facts. Moral knowledge requires a distinct faculty (often called "moral intuition" or "rational insight"). A person could know every physical fact about a cow and still fail to grasp the *moral* significance of eating it.
  *   **Dana's likely quote:** "Knowing the science doesn't give you the moral truth. You can have all the data and still be blind to the wrongness."

  **Case 3: Necessary Truths vs. Contingent**
  *   **Verdict:** She will say **Moral truths depend on what the natural facts happen to be (Supervenience).**
  *   **Reasoning:** She denied they are like the Pythagorean theorem (necessary truths). For Dana, "Torture is wrong" is true because of what torture *does* (causes suffering). If you had a possible world where "torture" didn't cause suffering (perhaps robots), the moral truth might change. The moral truth is fixed *once the natural facts are fixed*, but it isn't true across *all* possible worlds regardless of natural facts.
  *   **Dana's likely quote:** "It's not like math. It's wrong because of what it does to people. If the natural facts were different, the moral facts might be too."

  ### 3. The Tie-Breaker: Splitting the Remaining Candidates

  You suspected Dana might be inconsistent, but the real debate is between **Non-Naturalist Realism** (my diagnosis above) and **Quasi-Realism / Expressivism** (the view that moral claims *act* like truth claims but are actually just expressions of attitude). Quasi-Realists can mimic almost everything Dana said (objectivity, error, truth) *except* the underlying ontology.

  The best way to split these two is **Case 1 (The Mindless Universe)**, but a specific follow-up question is even sharper.

  **The Best Diagnostic Question:**
  > **"If humans had evolved to feel pleasure when they were tortured, would torture still be wrong?"**

  *   **Non-Naturalist Realist (Dana's likely view):** **YES.** The wrongness is grounded in the *nature* of the act and the objective badness of pain, not just our current reaction. Even if we liked it, it would still be bad (we would just be mistaken).
  *   **Quasi-Realist / Response-Dependent Theorist:** **NO (or "It's complicated").** If our fundamental responses changed, our moral truths would change. They might say, "If we enjoyed it, it wouldn't *be* wrong, because 'wrong' just marks what we are committed to rejecting."

  **Why Case 1 is also a strong splitter:**
  *   A **Quasi-Realist** must say that without language-users/agents, moral claims literally have no truth value (they are projections of minds).
  *   A **Realist** (like Dana) might say the *truth conditions* exist even if no one is there to speak them, though she might concede "badness" requires a subject.
  *   **Watch her closely on Case 1:** If she says "The statement is *false*," she's a Realist. If she says "The statement is *meaningless*," she's leaning toward Expressivism/Quasi-Realism.

  ### Summary for Your Debate
  Dana is holding a coherent view: **Non-Naturalist Moral Realism.** She believes moral truths are objective and mind-independent in their *validity*, but they depend on the existence of sentient beings for their *application*, and they cannot be reduced to scientific facts.

  *   **Her Rule:** Moral facts are objective truths that supervene on natural facts but are not reducible to them.
  *   **Your Strategy:** Don't attack her for inconsistency. Attack the "Non-Natural" part. Ask her *how* we access these facts if they aren't physical (the "Epistemic Access" problem). If she says "Intuition," ask her why we should trust intuition when it disagrees (like in Case 2). That is the weak point of her position.
