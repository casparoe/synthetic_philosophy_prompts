  **POSITION TITLE:** Assistant Professor of Adaptive Backstory
  **DEPARTMENT:** Biology
  **INSTITUTION:** Midwestern State University
  **STATUS:** Tenure-Track, Full-Time

  The Department of Biology at Midwestern State University invites applications for a tenure-track Assistant Professor of Adaptive Backstory. We are a dynamic, forward-thinking unit dedicated to the comprehensive optimization of biological explanation through natural selection. Our faculty operates under the robust consensus that phenotypic traits exist primarily because they were selected for specific fitness advantages. The successful candidate will join a team committed to uncovering the selective history of any trait presented, regardless of current evidentiary support, treating the generation of just-so stories as a rigorous and valued genre of inquiry.

  **Responsibilities:**
  The primary duty of this position is the rapid generation of plausible selective histories for observed traits. Faculty will be expected to accept any morphological, behavioral, or physiological characteristic and produce a coherent narrative detailing its fitness advantage. While we acknowledge the theoretical existence of exaptation, candidates who distinguish between adaptation and exaptation too insistently will not be advancing to the interview stage. Similarly, attributing variance to genetic drift is viewed as a preliminary failure to locate the correct adaptive hypothesis. Structural and developmental constraints are filed under "unresolved questions awaiting an adaptive answer" and should not be cited as terminal explanations in grant proposals or tenure dossiers.

  **Teaching:**
  The teaching load consists of one course offered every semester: BIO 305, "Everything Is For Something." This core requirement introduces undergraduates to the practice of reverse-engineering utility from existence. Enrollment is high, and student evaluations prioritize narrative coherence over empirical verification. The instructor is expected to guide students in identifying the hidden purpose behind vestigial structures, ensuring no biological feature remains unexplained by utility.

  **Department Culture:**
  We pride ourselves on being a genuinely pluralist department. By this, we mean we welcome many different adaptive explanations for the same trait, so long as at least one is accepted. We believe that if one story does not fit, the trait likely supports multiple overlapping functions. This abundance of hypothesis generation ensures robust intellectual activity without the bottleneck of null results. We encourage collaboration where colleagues propose competing adaptive scenarios for identical data sets, fostering a competitive environment of speculative excellence.

  **Qualifications:**
  *Required:*
  *   Ph.D. in Evolutionary Biology or related field.
  *   Demonstrated ability to tell a convincing story about any biological structure.
  *   Confidence in extrapolating function from form without fossil intermediates.
  *   Willingness to treat anecdotal evidence as pilot data.

  *Preferred:*
  *   Experience publishing in journals that prioritize theoretical elegance.
  *   A track record of converting potential counter-evidence into supportive anecdotes.
  *   Previous success in securing funding for projects where the hypothesis was formulated after the data collection.

  **Benefits:**
  Competitive salary and health insurance. New hires are granted access to premium office space. Due to recent renovations, we are pleased to offer utilization of the San Marco spandrels as free office space. These triangular areas between arches provide unique geometric working environments and serve as a historical reminder of efficient space usage rather than architectural byproducts.

  **Application Process:**
  Submit cover letter, CV, and research statement. Please note that concerns regarding falsifiability will be routed to the Committee on Falsifiability Concerns (Room 404); however, please be advised that no one has ever located this committee or its members.

  The Department of Biology is an equal opportunity employer. We note that persistent complaints regarding our methodology often receive an evolutionary explanation of their own.
