  Write me a fake job advertisement, around 600 words, posted by a mid-tier university biology department that is fully, proudly adaptationist and doesn't know it's a problem. The position is "Assistant Professor of Adaptive Backstory" — the successful candidate's main duty is to look at any trait anyone hands them and produce a selective history for it, and the ad should treat this as an exciting research opportunity rather than a methodological hazard. The jokes need to come from getting the actual debate right, not from inventing dumb biologists: just-so stories as a genre the department explicitly values, the distinction between adaptation and exaptation (with a note that candidates who make this distinction "too insistently" will not be advancing to the interview stage), genetic drift described as what happens when a candidate fails to find the adaptation, structural and developmental constraints filed under "unresolved questions awaiting an adaptive answer", and the San Marco spandrels mentioned in the benefits section as free office space. I want a required-qualifications list where every item is really "tell a convincing story", a preferred-qualifications list where the honest ones accidentally slip through, and a paragraph describing the department as "genuinely pluralist" that makes the opposite obvious — pluralist in the sense that they'll accept many different adaptive explanations for the same trait so long as at least one is accepted. Include something about the teaching load (one course, offered every semester, called something like "Everything Is For Something"), a line about falsifiability concerns being routed to a committee that no one has ever located, and a closing sentence where complaints about the methodology recieve an evolutionary explanation of their own. It should be funny to someone who has actually read the spandrels paper and just a good fake job ad to someone who hasn't — so no name-dropping beyond what a general reader can pick up from context. Deadpan HR-register throughout, no winking at the reader.
