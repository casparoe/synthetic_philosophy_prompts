answer: |-
  ## Activity: "Project: Homunculus" (The Authorization Protocol)

  **Premise:** You are telling the students this is a stress-test of the Psychological Continuity View (Parfit). They are going to build a functional model of a "Person" to see if a "Decision-Maker" is actually required for the system to work. They do not know this is the Buddhism unit until the debrief.

  **Class Size:** 18 Students (3 Groups of 6)
  **Time:** 75 Minutes
  **Materials:**
  *   18 Role Badges (laminated cards or sticky notes).
  *   3 Large Sheets of Paper (for "Decision Logs").
  *   3 Markers.
  *   18 "Veto Tokens" (poker chips or coins).
  *   A bell or timer.

  ### 1. Role Distribution (The Bundle)
  Each group of 6 gets a set of badges. 5 are functional roles, 1 is the "CEO."
  *   **Vision:** Can only report visual data ("I see a red card").
  *   **Memory:** Can only report past data ("We chose red last time").
  *   **Emotion:** Can only report affective states ("Red feels risky").
  *   **Language:** Can only formulate sentences ("The proposal is...").
  *   **Motor:** Can only move physical objects (picks up the card).
  *   **CEO:** The "Self." Holds the Veto Token.

  **The Catch:** The "CEO" badge is blank on the back. The functional roles have specific instructions on the back. The CEO badge has *no instructions* other than "Authorize Actions."

  ### 2. Timeline

  **0:00 – 0:10 | Setup & Framing**
  *   **Instructor:** "We've accepted Parfit's view: the self is a bundle of psychological connections. Today we are stress-testing that. If the self is just a bundle of functions, do we need a 'manager' to tie them together? You are going to simulate a Person making a decision."
  *   Divide into 3 groups of 6. Hand out badges.
  *   **Task:** The group must choose between Option A (Blue Card) and Option B (Red Card) based on a criteria sheet you give them (e.g., "Maximize safety," "Maximize reward").
  *   **Rule 1:** You must stay in character. Vision cannot feel emotions. Motor cannot speak.
  *   **Rule 2:** A decision is not valid unless the CEO stamps it (places the Veto Token on the Decision Log).

  **0:10 – 0:30 | Round 1: The Search for Authority**
  *   Groups attempt to make 3 decisions.
  *   **The Glitch:** The functional roles will naturally debate. The CEO will feel pressure to "decide." But the CEO has no data (Vision has the data). The CEO has no preference (Emotion has the preference).
  *   **Instructor Intervention (at 0:20):** Ring the bell. "Freeze. CEO, tell me: *Why* did you authorize that last choice?"
      *   *Expected Answer:* "Because Vision said..." or "Because it made sense."
      *   *Instructor:* "So Vision decided? Then why do we need you?"
      *   *Expected Answer:* "I just... finalized it."
      *   *Instructor:* "Could the system have finalized it without you?"
  *   Resume. Watch the CEOs struggle. They are essentially rubber-stamping processes they didn't initiate and don't control.

  **0:30 – 0:45 | Round 2: The Removal**
  *   **Instructor:** "Hypothesis: The CEO is redundant. Take off the CEO badge. Put the Veto Token in the center of the table. No one is allowed to touch it."
  *   **Task:** Make 3 more decisions. Same criteria.
  *   **Observation:** The groups will likely make decisions *faster*. The functional roles will self-organize. Language will propose, Emotion will weigh in, Motor will act.
  *   **Instructor:** "Did the system collapse? Did the decisions stop happening?"

  **0:45 – 0:55 | The Trap (The "I" Slip)**
  *   **Instructor:** "Okay, stop. Look at your Decision Log. Who wrote this?"
  *   Students will say "We did" or "The group."
  *   **Instructor:** "Point to the 'We.' Is it the paper? The badges? The air between you?"
  *   **Instructor:** "Now, stand up. Raise your hand if *you* feel like you did something just now."
  *   (Most will raise hands).
  *   **Instructor:** "Who raised their hand?"
  *   (They will say "I did").
  *   **Instructor:** "Wait. In Round 2, there was no CEO. No 'I' was assigned. Which badge raised the hand?"
  *   (This creates the cognitive dissonance. The *Motor* badge raised the hand, but the *feeling* is that 'I' raised it.)

  **0:55 – 1:15 | Debrief & Mapping**
  *   Bring the class back to a circle. Reveal the unit: **Anatta (No-Self).**
  *   Map the activity to the philosophy (see below).

  ---

  ### 3. Debrief: Mapping Activity to Philosophy

  **A. The Unfindable Owner (Anatta)**
  *   **Activity Moment:** Round 1, when the CEO couldn't explain *why* they authorized the choice.
  *   **Philosophical Point:** When we look for the "self" that owns the experience, we only find the experiences themselves (Vision, Emotion, Memory). We never find the *owner* of them. The CEO was a placeholder for a feeling, not a functional entity.
  *   **Addressing the "Bundle" Objection:** Students think "No Self = Bundle Theory." This activity shows the Bundle (the 5 roles) works fine, but the *idea* of the Bundle as a *unified entity* (the CEO) is the illusion. Parfit stops at "The Bundle exists." Anatta asks, "Does the Bundle belong to anyone?"

  **B. Conventional vs. Ultimate Truth (Two Truths Doctrine)**
  *   **Activity Moment:** Round 2 (No CEO) vs. The Hand Raise.
  *   **Philosophical Point:**
      *   *Ultimate Truth:* There was no CEO. The "I" is unfindable. The system operated without a commander.
      *   *Conventional Truth:* When asked "Who raised your hand?", saying "The Motor Badge" is socially useless. Saying "I did" is pragmatically necessary.
      *   **Key Lesson:** Denying the self doesn't mean you stop using the word "I." It means you stop believing "I" refers to a *commander* inside the machine. You can use "I" as a shorthand for "This collection of processes," without reifying it.

  **C. The "Clinging" Mechanism**
  *   **Activity Moment:** The frustration the CEOs felt in Round 1.
  *   **Philosophical Point:** Why was it uncomfortable to be a CEO with no control? Because we *want* to be the author. That desire for authorship is *upadana* (clinging). The discomfort they felt is the mild friction of letting go of control.

  ---

  ### 4. Predictable Failures & Mitigation

  **1. The "Group Mind" Dodge**
  *   **What happens:** In debrief, a smart student says, "The Self is just the emergent property of the group. So the Group is the Self."
  *   **Why it's a problem:** This is just reifying the Bundle. It saves the "Entity" intuition.
  *   **Mitigation:** Ask: "Where is the Group? If I take away the 5 roles, is the Group left?" (No). "If I take away the Group, are the roles left?" (Yes). "So the Group is dependent on the roles, but the roles aren't dependent on the Group. Which is more real?" This pushes them from "The Group is the Self" to "The Group is a label."

  **2. The Mystical Drift**
  *   **What happens:** One student (likely the retreat veteran) says, "This is about pure awareness behind the roles."
  *   **Why it's a problem:** It turns an analytic exercise into a spiritual one, alienating the skeptics.
  *   **Mitigation:** Shut it down gently but firmly. "We aren't looking for a *deeper* self today. We're looking for the *manager*. If awareness is just another function (like Vision), it's part of the bundle. If it's not a function, can it make a decision? If it can't decide, is it 'you' in the way you usually mean?" Keep it functionalist.

  **3. The "So What?" Reaction**
  *   **What happens:** "Okay, there's no CEO. The body still decides. Why does this matter?"
  *   **Why it's a problem:** They miss the soteriological point (suffering).
  *   **Mitigation:** Ask: "In Round 1, when the CEO couldn't control the outcome, did anyone feel anxiety? Or relief?" Connect the *friction* of trying to be a CEO to the stress of daily life. "If you aren't the CEO, you aren't responsible for everything. That's the relief."

  **4. The Homunculus Smuggle**
  *   **What happens:** The "Language" role starts acting like the CEO ("I propose we...").
  *   **Why it's a problem:** It reinforces the idea that the "Narrator" is the Self.
  *   **Mitigation:** During Round 1, catch this. "Language, are you deciding or just reporting?" Force them to distinguish *narrating* the decision from *making* it.

  ---

  ### 5. Honest Limitations (What This Won't Do)

  **1. The Soteriological Punch**
  *   **Reality:** In a 75-minute classroom game, students will not feel *liberated*. They will feel intellectually intrigued. The actual Buddhist claim is that realizing no-self *ends suffering*.
  *   **Limitation:** You cannot simulate the relief of dropping a lifelong existential burden in an hour. The activity creates an *intellectual aperture*, not an existential shift. Be honest about this: "This game shows you the logic. It doesn't give you the freedom. That takes practice."

  **2. The Phenomenological Gap**
  *   **Reality:** Students will leave saying, "I still *feel* like me."
  *   **Limitation:** The activity targets the *concept* of the self, not the *feeling*. The feeling of selfhood is a deep habit (vasana). Acknowledge this: "The feeling will remain. The point isn't to stop feeling like an 'I', but to stop trusting that feeling as proof of a CEO."

  **3. The Moral Responsibility Worry**
  *   **Reality:** Someone will ask, "If there's no CEO, who goes to jail for murder?"
  *   **Limitation:** The activity doesn't solve ethics. It exposes the metaphysics. You will need to bridge this in the next lecture (Karma as causality without a agent, vs. Legal responsibility as social utility). Don't try to solve ethics in the debrief; flag it as the next problem.

  ### 6. Instructor Script for the "Reveal" (Minute 55)

  "Up until now, we've been talking about Parfit and Psychological Continuity. You've been nodding along, thinking, 'Yes, the self is just a bundle of memories and traits.'

  But in this game, you noticed something. Even when you accepted the Bundle (the 5 roles), you still instinctively looked for the CEO. You felt uncomfortable when the CEO seat was empty. You still raised your hand and said 'I' when asked who acted.

  This is the gap. Parfit says the Bundle is all there is. The Buddhist *anatta* doctrine says: 'If you look closely at the Bundle, you won't find anyone owning it.'

  The term for this is *Anatta*: No-Self. Not 'no person,' but 'no owner.' The activity wasn't about proving you don't exist. It was about proving that the 'You' you're worried about protecting, defending, and stressing over... is like the CEO badge. It's a functional label, not a boss.

  Next week, we ask: If there's no boss, why does it hurt so much when things go wrong?"
