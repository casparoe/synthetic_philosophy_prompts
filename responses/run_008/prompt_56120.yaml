answer: |-
  # JOINT STATEMENT ON POPULATION AXIOLOGY
  **Prepared by:** [Name], Defender of Procreation Asymmetry & [Name], Totalist Utilitarian
  **Date:** October 26, 2023
  **Subject:** Areas of Agreement, Disagreement, and Critical Cruxes in Population Ethics

  ## 1. Agreed Claims

  We, the undersigned, having engaged in adversarial collaboration regarding the ethics of population and procreation, affirm the following claims as common ground. We agree that any adequate population axiology must accommodate these intuitions and constraints.

  1.  **The Badness of Suffering:** Bringing a person into existence who will lead a life of net suffering (a "miserable life") is morally wrong, *ceteris paribus*. Both of us agree this is a decisive moral reason against procreation in such cases.
  2.  **The Permissibility of Happiness:** Bringing a person into existence who will lead a life of net happiness (a "happy life") is morally permissible. Neither of us holds that such procreation is forbidden.
  3.  **The Priority of Existing Persons:** For persons who already exist, we agree that increasing their welfare is good and decreasing it is bad. We both endorse a Pareto principle restricted to existing people: if outcome A is better for every existing person than outcome B, and worse for no one, A is preferable.
  4.  **The Sadistic Conclusion:** We both reject the "Sadistic Conclusion." We agree that a world containing many people with lives barely worth living is not *better* than a world containing fewer people with miserable lives, simply in virtue of the aggregate sum. Any theory implying that adding miserable lives can be good is unacceptable to both parties.
  5.  **Concessions on Intuitive Force:**
      *   **Totalist Concession:** We acknowledge that the intuition underlying the Procreation Asymmetry (that we have no duty to create happy people, but a duty not to create miserable ones) is among the strongest and most widespread moral intuitions in this domain. A theory that completely ignores this asymmetry risks being counterintuitively demanding.
      *   **Asymmetrist Concession:** We acknowledge that the Totalist view offers a more straightforward explanation for the value of a prosperous, flourishing future humanity. The Asymmetrist view struggles to explain why the extinction of a happy future population is a tragedy, given that creating the happy people would not have been "good."

  ## 2. Disagreements Table

  While we share the commitments above, we diverge on the metaphysical and normative explanations for them. The following table outlines the residual disagreements. We have phrased these claims to ensure each side accepts the attribution of their own view.

  | Domain | Totalist Utilitarian Position | Procreation Asymmetrist Position |
  | :--- | :--- | :--- |
  | **Value of Creation** | Adding a happy life to the world makes the outcome *impersonally better*, even if it benefits no specific existing person. | Adding a happy life to the world is *axiologically neutral*. It makes the outcome neither better nor worse, though it is permissible. |
  | **Nature of Benefit** | Existence can be a benefit to the person created. A person is benefited by being brought into a happy existence compared to the alternative of never existing. | Existence cannot be a benefit to the person created. There is no subject in the alternative state (non-existence) to whom the benefit can be accrued. |
  | **The Repugnant Conclusion** | We accept the "Repugnant Conclusion" (that a vast population with lives barely worth living can be better than a smaller, very happy population) as true, or at least less problematic than the alternatives. | We reject the Repugnant Conclusion as absurd. It demonstrates a fatal flaw in aggregative reasoning regarding population size. |
  | **Moral Focus** | Morality is concerned with **States of Affairs**. The goal is to realize the best overall state of the world. | Morality is concerned with **Subjects**. The goal is to respect and aid identifiable individuals (actual or future). |

  **Note on Verbal Disputes:** We identify a partial verbal dispute regarding the term "better." The Totalist uses "better" to denote *impersonal value* (a ranking of worlds). The Asymmetrist often reserves "better" for *person-affecting comparisons* (ranking outcomes for subjects). However, we agree this is not *merely* verbal. The substantive residue is action-guiding: The Totalist believes we have a *pro tanto* reason to create happy people to maximize value; the Asymmetrist denies this reason exists.

  ## 3. The Cruxes

  We identify three specific sub-questions (cruxes) where resolving the uncertainty would significantly shift the weight of evidence toward one camp.

  **Crux 1: The Comparability of Existence and Non-Existence.**
  *   *Question:* Is the state of "never existing" a coherent baseline against which "existing" can be compared for welfare levels?
  *   *Significance:* If non-existence is a state with a welfare level of zero (or any determinate value), the Asymmetry collapses into Totalism. If non-existence is not a state of a subject, the Totalist claim that existence "benefits" the subject is metaphysically incoherent.

  **Crux 2: The Person-Affecting Restriction.**
  *   *Question:* Must all moral reasons be grounded in how an action affects specific individuals (the "Person-Affecting View"), or can reasons be grounded in the impersonal value of outcomes?
  *   *Significance:* If the Person-Affecting Restriction is true, Totalism is false. If moral reasons can be impersonal, the Asymmetrist must explain why the creation of happiness fails to generate an impersonal reason, while the creation of misery does.

  **Crux 3: The Non-Identity Intuition.**
  *   *Question:* In cases where a policy choice determines *which* specific people will exist (e.g., environmental depletion affecting conception dates), do we owe duties to those future people?
  *   *Significance:* Totalists say yes (we owe it to them to ensure their lives are good). Asymmetrists typically say no (we cannot harm them by bringing them into a life worth living, even if a different policy would have created different, happier people). If the Asymmetrist concedes we have duties in Non-Identity cases, they move closer to a Totalist framework.

  ## 4. Tests and Predictions

  For each crux, we propose a specific case or argument that bears on the question. We record our predicted responses in advance to track where the theories diverge in practice.

  ### Test for Crux 1 (Comparability): *The Single Happy Child*
  *   **Case:** A couple can choose between (A) Not having a child, or (B) Having a child who will have a very happy life (80 units of welfare). No other effects.
  *   **Totalist Prediction:** Outcome B is *better* than Outcome A. The world contains more value.
  *   **Asymmetrist Prediction:** Outcome B is *neutral* relative to Outcome A. It is not better, though it is permissible. There is no moral reason to prefer B over A based on the child's welfare.

  ### Test for Crux 2 (Person-Affecting): *The Two-Person World*
  *   **Case:** World 1 contains Person X (100 welfare). World 2 contains Person X (100 welfare) and Person Y (10 welfare). Y's life is worth living.
  *   **Totalist Prediction:** World 2 is better than World 1 (Total welfare 110 > 100).
  *   **Asymmetrist Prediction:** World 2 is not better than World 1. X is unaffected. Y is not harmed, but Y's existence adds no value. The worlds are axiologically equivalent regarding value, though World 2 is permissible.

  ### Test for Crux 3 (Non-Identity): *The Risky Policy*
  *   **Case:** A society chooses a energy policy.
      *   *Safe Policy:* Future people live very happy lives (100 welfare). Specific set of people *S1* exist.
      *   *Risky Policy:* Saves money now, but causes radiation leaks later. Future people live lives barely worth living (10 welfare). Specific set of people *S2* exist (different from *S1* due to timing/conception changes).
  *   **Totalist Prediction:** Safe Policy is morally obligatory. It produces a better state of affairs.
  *   **Asymmetrist Prediction:** This is the hardest case. Strict Asymmetry suggests the Risky Policy does not *harm* S2 (since their alternative was non-existence). However, to avoid counterintuitive results, many Asymmetrists must adopt a "Wide Person-Affecting View" or concede an impersonal reason here. We predict the Asymmetrist will struggle to condemn the Risky Policy without borrowing Totalist logic.

  ***

  ## Author's Committed Assessment

  **By:** [Student Name]

  In drafting this joint statement, I have aimed to sharpen the disagreements rather than smooth them over. While the collaborators have identified three cruxes, my assessment is that **Crux 2 (The Person-Affecting Restriction)** is the most likely to move one of the camps if settled, specifically the Asymmetrist camp.

  **Reasoning:**
  Crux 1 (Comparability) is a metaphysical stalemate. Totalists and Asymmetrists often talk past each other here because they hold fundamentally different views on the ontology of possible people. It is unlikely a Totalist will be convinced that non-existence is not a baseline, nor that an Asymmetrist will be convinced it is.

  However, Crux 2 is normative. The Asymmetrist's position is most vulnerable when pressed on the **"Absent Future" problem** (acknowledged in Section 1, Claim 5). If the Asymmetrist admits that we have *some* moral reason to ensure humanity continues and flourishes (rather than going extinct quietly), they must admit that creating happy people has *some* positive value, or at least that preventing the absence of happy people is a loss.

  Once the Asymmetrist concedes that the *composition* of the future population matters morally (i.e., a flourishing future is better than an empty one), they are forced to abandon the strict Person-Affecting Restriction. They must accept that "making happy people" has moral weight similar to "making people happy." This does not require them to become full Totalists (they can still reject the Repugnant Conclusion via averaging or critical-level theories), but it forces them to abandon the core Asymmetry claim that creating happy lives is *neutral*.

  Therefore, the most productive line of inquiry is not the metaphysics of non-existence, but the normative question: *Can we have obligations to future constituencies that are not reducible to obligations to specific individuals?* If the Totalist can demonstrate that the Asymmetrist's view implies we have no reason to prevent voluntary human extinction (provided no suffering is involved), the Asymmetrist is the one who must adjust their theory. The Totalist, conversely, has already "priced in" the cost of the Repugnant Conclusion and is less likely to move.

  **Verdict:** The Person-Affecting Restriction is the leverage point. Settling this against the Asymmetrist (by showing it leads to moral paralysis regarding the future) collapses the Asymmetry into a hybrid view that functions much like Totalism for most practical purposes.
