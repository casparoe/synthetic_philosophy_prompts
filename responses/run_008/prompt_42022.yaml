          *   Phase 2: Genuine Tensions (ranked by severity).
          *   Phase 3: Proposed Repairs & Costs.
          *   Conclusion: Summary of the most stable configuration.

      *   *Refining the "Authority" point:* Commitment (3) is the trickiest. "Not answerable to evidence" is a strong Wittgensteinian/Expressivist claim. If I say "I believe P," and science shows I don't (implicit bias), am I wrong? If (3) holds, I'm not wrong, I'm just expressing. But if I'm expressing, how does (4) work? Theories need truth-apt data.
      *   *Refining the "Direct Access" point:* Commitment (1) says "occurrent thoughts." Is a belief an occurrent thought? Usually no, it's dispositional. So (1) might survive (5). But (2) targets *explanations* of choices. Do I have direct access to *why* I chose? (1) says "occurent thoughts," not "causes." So (1) and (2) are actually compatible if read strictly. The friction is with (3). If I confabulate a reason, and claim authority on it, (3) is the problem.

      *   *Re-evaluating Severity:*
          *   **High:** (2) vs (3). If I confabulate reasons/beliefs, I cannot have strong authority over reports of beliefs/reasons.
          *   **Medium:** (3) vs (4). If avowals are immune to evidence, they are shaky evidence for theory.
          *   **Low:** (1) vs (2) & (5). Scope distinctions save these.

      *   *Wait, check (1) again:* "occurrent thoughts... I just detect it." If I confabulate a reason, I am reporting a thought I *think* I had. The confabulation literature says I didn't have that thought as a cause. So (1) is safe regarding *current sensation*, but risky regarding *retrospective report of mental causation*.
      *   *The Friend's Point:* The friend likely argues that the *feeling* of direct access (1) is itself a confabulation (2). That makes (1) and (2) directly contradictory. I need to address this "Illusion of Introspection" argument.

      *   *Revised Plan:*
