      *   *(3) vs. (5):* Authority vs. Unconscious Attitudes.
          *   *Tension:* If I have authority on what I believe, how can I have implicit biases (attitudes) I don't know about?
          *   *Resolution:* Distinction between avowable beliefs and dispositional biases.
