      3.  **The "Unconscious/Conscious" Boundary (1 + 5):** Less severe, but requires careful taxonomy of "states" vs. "attitudes."

  5.  **Developing Repairs and Costs:**

      *   *Repair for Tension 1 (Scope):* Restrict (1) and (3) to *phenomenal* states (qualia, occurrent experience) and exclude *propositional attitude attribution* and *causal explanation*.
