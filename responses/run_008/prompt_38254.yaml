answer: |-
  Here is the audit of your colleague's analogy, structured so you can walk into that coffee meeting with the exact architecture of the argument in hand.

  ### Part 1: The Mapping (The "Steel Man")
  First, acknowledge where he is coming from. In standard finance, the logic is airtight. Here is the mapping he is implicitly using to move from finance to ethics:

  | Financial Concept | The Economist's Moral Analog | The Mechanism |
  | :--- | :--- | :--- |
  | **The Asset** | Cash Flow ($) | Wellbeing / Lives Saved |
  | **The Price** | Present Value | Moral Weight |
  | **The Rate** | Market Interest Rate ($r$) | Social Discount Rate |
  | **The Mechanism** | Compound Interest | Economic Growth / Capital Accumulation |
  | **The Logic** | \$1 today $\to$ Invest $\to$ \$1.05 next year. | 1 Unit Wellbeing today $\to$ Invest $\to$ 1.05 Units next year? |
  | **The Assumption** | **Arbitrage:** I can move value across time freely. | **Substitutability:** We can trade off present cost for future gain seamlessly. |

  **His Argument in a Nutshell:** Because capital has a positive return (money grows), resources spent today on climate are resources *not* invested in growth. Therefore, future people will be richer, and a dollar's worth of safety is worth less to them than to us.

  ### Part 2: Where the Mapping Breaks
  This is where you push back. The financial model relies on three specific conditions that do not exist in intergenerational climate ethics.

  **1. The "Investability" Break (Can you compound a life?)**
  *   **Finance:** If I don't spend \$100 today, I can put it in a bond and have \$105 next year. The asset *itself* grows.
  *   **Wellbeing:** If I don't save a life today, I cannot "invest" that life to get 1.05 lives tomorrow. Lives do not compound.
  *   **The Nuance:** He might say, "We invest the *money*, not the life." True. But the return on capital is measured in *dollars*, not *utility*. If climate damages destroy the *conversion rate* between dollars and wellbeing (e.g., money can't buy breathable air), the market rate becomes irrelevant.
  *   **The Quote:** *"You can compound capital, but you cannot compound existence. The market rate tells us how dollars grow, not how the value of survival scales."*

  **2. The "Missing Market" Break (Can they bribe us?)**
  *   **Finance:** Discount rates emerge from a market where borrowers and lenders trade. If I value the future too little, someone can arbitrage me.
  *   **Wellbeing:** People in 2100 cannot trade with people in 2024. They cannot pay us to cut emissions, and we cannot charge them for our restraint.
  *   **The Consequence:** Without a functioning market between the parties, the "market rate" is not a discovery mechanism for value; it is just a number we picked. Using it imposes a preference rather than revealing one.
  *   **The Quote:** *"Market discount rates require two-way trade. Future generations are silent partners who cannot vote, pay, or sue. Applying a market rate to a non-market relationship is a category error."*

  **3. The "Marginal Utility" Break (Will they actually be richer?)**
  *   **Finance:** Discounting assumes the future is marginally better off (diminishing marginal utility of consumption).
  *   **Wellbeing:** This assumes climate change won't wreck the economy. If climate damages in 2100 are severe enough to reduce GDP or habitability, future people might be *poorer* than us.
  *   **The Consequence:** If they are poorer, the marginal utility of resources is *higher* for them, not lower. Standard discounting (which assumes growth) would then tell us to spend *more* now, not less.
  *   **The Quote:** *"Discounting assumes the future is richer. If climate change makes the future poorer, the math flips. You can't use a growth-based discount rate to justify ignoring a threat that destroys growth."*

  ### Part 3: Does the Conclusion Survive?
  **Verdict: No.** The analogy is carrying the entire weight of the argument. Once you remove the financial scaffolding, the conclusion collapses for two reasons:

  1.  **Pure Time Preference is Ethically Indefensible:**
      The great economist Frank Ramsey (the father of discounting theory) called pure time preference (valuing someone less just because they are born later) **"ethically indefensible and arising merely from the weakness of the imagination."**
      *   *Market Rate* = Pure Time Preference + Growth Adjustment.
      *   If you strip out pure time preference (as ethics demands), the rate drops drastically (often to near zero).
      *   *Result:* We should spend *much more* now, not less.

  2.  **Risk of Ruin:**
      Financial discounting works for marginal changes (a slightly lower dividend). It fails for existential risk. If the "investment" in 2100 has a non-zero chance of being zero (civilizational collapse), the expected value calculation breaks. You don't discount survival at the market rate of return.

  ### The Coffee Meeting Cheat Sheet
  If he reaches for his coffee, hit him with these three points in order:

  1.  **"You're conflating returns on capital with returns on survival."**
      Money grows at the market rate. Lives don't. We need to discount *utility*, not just dollars, and utility doesn't have a ticker symbol.
  2.  **"There is no Coasean bargain between generations."**
      Market rates exist because lenders and borrowers can trade. Future people can't trade with us. Using a market rate here pretends a market exists where there is none.
  3.  **"Ramsey called your rate 'ethically indefensible'."**
      Remind him that the pure time-preference component of his discount rate was rejected by the very economist who invented the formula, specifically for intergenerational problems.

  **The Closing Line:**
  *"If we treat the atmosphere like a bond portfolio, we'll optimize for yield while the planet burns. The market rate tells us what capital earns, not what we owe the future."*
