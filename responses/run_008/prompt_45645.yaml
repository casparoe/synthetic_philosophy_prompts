      *(Refining the "Coherence" point)*: It's coherent *if* you view documentation as a **Liability Shield** rather than a **Communication Channel**. That's the key.

      *(Refining the "What would change")*: If inference rules, then **Code is Documentation**. The only promise is the code itself. This leads to **Immutable Infrastructure** or **Append-Only APIs**.

