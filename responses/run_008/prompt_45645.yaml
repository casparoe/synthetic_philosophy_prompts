          3.  *The Maxim:* "Given enough users, every observable behavior will be depended on." (Acknowledges the reality of inference.)
      *   **The Question:** What view of communication underlies this pair of norms? Is documentation a contract or ordinary speech? Can they coexist coherently? What would change if we fully adopted the inference-based view?
      *   **The Task:** Reconstruct the implicit theory, distinguish strict requirements from compatible practices, and outline the practical consequences of shifting to a pure inference-based view.
      *   **The Context:** The user suspects this is philosophy of language but lacks the literature. I need to bridge SE practice with philosophical concepts (Grice, Speech Act Theory, etc.).

  2.  **Initial Brainstorming & Philosophical Mapping:**

      *   *Norm 1 (Not documented = not promised):* This sounds like **Legal Contract Theory** or **Formal Semantics**. Meaning is truth-conditional and explicit. It aligns with *Originalism* in law or *Formal Verification* in CS.
      *   *Norm 2 (Naming/Tone matters):* This sounds like **Gricean Pragmatics**. Conversational implicature. The Cooperative Principle. Meaning is derived from intent + context + shared norms.
      *   *The Tension:* This is the classic **Semantics vs. Pragmatics** debate. Or **Literal Meaning vs. Speaker Meaning**.
      *   *The "Maxim" (All behavior is depended on):* This is **Murphy's Law** meets **Reader-Response Theory**. It acknowledges that *uptake* determines meaning as much as *intent*.
      *   *Coherence:* Can they coexist? Yes, but it's a *strategic ambiguity*. It functions as a **Power Dynamic**. The maintainer holds the privilege to switch between frames (Contract vs. Conversation) depending on which benefits them (Maintenance burden vs. Trust/Adoption).

