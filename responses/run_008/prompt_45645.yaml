  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* You've stumbled upon the Semantics/Pragmatics divide. In SE, it's the "Spec vs. Implementation" divide, but socialized.
      *   *The Theory:* Let's call it **Strategic Bilingualism**. Maintainers speak "Contract" when defending breaks and "Conversation" when seeking adoption.
      *   *Philosophical Labels:*
          *   *Norm 1:* **Literalism / Explicitism.** Similar to *Textualism* in law. The code is the law, the docs are the constitution. If it's not in the constitution, it's not a right.
          *   *Norm 2:* **Gricean Pragmatics.** Implicature. If I name a function `getUser`, I implicate it returns a user, not null. If I break that, I violate the Maxim of Manner/Quality.
          *   *The Maxim:* **Uptake Theory.** Meaning is fixed by the receiver, not just the sender.
      *   *Coherence:* It's not logically coherent. It's *pragmatically* coherent for the maintainer. It externalizes risk. It's a **One-Way Mirror**. Maintainers see the contract; users see the conversation.
      *   *Requirements vs. Fit:*
