answer: |-
  You have identified a genuine philosophical tension that sits at the heart of software engineering, though it is rarely articulated as such. You are correct: this is not merely a management problem; it is a problem in the **philosophy of language**, specifically the conflict between **semantics** (literal meaning) and **pragmatics** (inferred meaning), mediated by **speech act theory** (what doing things with words accomplishes).

  Here is a reconstruction of the implicit theory governing your field, an analysis of its coherence, and a projection of what would change if you resolved the tension in favor of the inference-based view.

  ### 1. Reconstructing the Implicit Theory: "Defensive Bilingualism"

  The software community operates under a hybrid theory of communication that I will call **Defensive Bilingualism**. It toggles between two incompatible linguistic frameworks depending on who is speaking, who is listening, and what is at stake.

  **Norm A: The Contractual View (Semantics/Textualism)**
  *   **Philosophical Root:** *Legal Textualism* or *Formal Semantics*. Meaning is contained entirely within the explicit symbols.
  *   **The Rule:** "If it is not documented, it is not promised."
  *   **Function:** This treats documentation as a **legal contract** or a **formal specification**. It limits the maintainer's liability. In speech act theory, this treats the documentation as a *constative* utterance (describing a state of affairs) that only has truth conditions where explicitly defined.
  *   **When invoked:** When a breaking change occurs and users complain. It is a defensive shield against blame.

  **Norm B: The Conversational View (Pragmatics/Gricean)**
  *   **Philosophical Root:** *Gricean Pragmatics*. Meaning is derived from the Cooperative Principle, context, and implicature.
  *   **The Rule:** "Names, defaults, and tone convey intent; misleading omissions are dishonest."
  *   **Function:** This treats documentation as **ordinary conversation**. It relies on *conversational implicature*. If a function is named `connectDatabase`, the maintainer implicates (via Grice's Maxim of Relation) that it will actually connect to a database, even if the docs don't explicitly guarantee uptime.
  *   **When invoked:** During adoption, marketing, and community building. It builds trust and reduces cognitive load for the user.

  **The Maxim: "Every Observable Behavior is Depended On"**
  *   **Philosophical Root:** *Reader-Response Theory* or *Uptake Theory*. The meaning of an utterance is determined by how it is received, not just how it is sent.
  *   **Function:** This acknowledges the reality of Norm B while maintaining the defense of Norm A. It admits that *pragmatic uptake* creates dependencies, even if *semantic content* did not promise them.

  ### 2. Is This Coherent?

  **Logically: No.**
  You cannot simultaneously hold that meaning is *only* what is explicitly stated (Norm A) and that meaning is *also* what is reasonably inferred from context (Norm B). If the latter is true, the former is false. If a user reasonably infers a promise from a function name, and the maintainer breaks it claiming "it wasn't documented," the maintainer is violating the Gricean **Maxim of Quality** (do not say what you believe to be false) or **Manner** (avoid ambiguity).

  **Pragmatically: Yes (for the Maintainer).**
  The system is stable not because it is logically sound, but because it is **asymmetric**.
  *   **Maintainers** hold the privilege to switch frames. They use the Conversational View to gain trust/adoption and the Contractual View to limit maintenance burden.
  *   **Users** are forced into the Contractual View when things break, even though they operated under the Conversational View while building.

  This is not a theory of communication; it is a **theory of liability distribution**. The "Not Documented" rule is not an epistemological claim about meaning; it is a **performative speech act of disclaimer**. It functions like a "Terms of Service" agreement that no one reads but everyone is bound by.

  ### 3. Distinguishing Requirements from Fit

  To understand what must change, we must separate what is essential to software engineering from what is merely customary.

  **What the Practice Strictly Requires:**
  *   **A Boundary between Interface and Implementation:** Software cannot be maintained if every internal optimization is treated as a public commitment. There *must* be a distinction between "what I do" and "how I do it."
  *   **A Mechanism for Change:** Systems must evolve. If every observable behavior is frozen forever, innovation stops (the "Stability Trap").
  *   **Shared Expectations:** Users must be able to predict system behavior to build on top of it.

  **What Merely Fits Well (The Contingent Norms):**
  *   **Documentation as the Sole Arbiter:** Relying on natural language docs to define the boundary is a choice. We could use type systems, formal specs, or test suites.
  *   **The "Reasonable Inference" Loophole:** Allowing maintainers to claim inferences are "unreasonable" after the fact is a power dynamic, not a technical necessity.
  *   **Semantic Versioning (SemVer) as Currently Practiced:** SemVer attempts to codify the Contractual View ("Major version bump = breaking change"), but it fails because it relies on the maintainer's honest assessment of what counts as "breaking," which ignores the Inference View (users deciding what they depended on).

  ### 4. What Would Change If We Adopted the Inference-Based View?

  If you decided that the "Inference-Based View" (Norm B + The Maxim) was the correct one all along—that meaning is determined by reasonable uptake and observable behavior—the entire social and technical infrastructure of software engineering would need to shift.

  Here is what would actually have to change:

  #### A. Documentation: From Prescription to Ethnography
  *   **Current:** Docs prescribe what *should* happen.
  *   **New:** Docs would describe what *does* happen, including "undocumented" behaviors known to be in use.
  *   **Consequence:** Documentation becomes a living record of **usage patterns**, not just API signatures. Maintainers would need to monitor downstream code to understand what their software *means* to users, rather than deciding unilaterally what it *says*.

  #### B. Versioning: From Semantic to Observational
  *   **Current:** Maintainers declare a "Breaking Change" based on their intent.
  *   **New:** A change is "Breaking" if it alters any **observable state** that a downstream system could theoretically detect.
  *   **Consequence:** This aligns with the computer science concept of **Observational Refinement**. If a user *can* distinguish the old version from the new version (even via timing, error codes, or side effects), it is a breaking change. This would lead to far more frequent "Major" version bumps, or conversely, a shift toward **immutable APIs** (where you never change behavior, you only add new endpoints).

  #### C. Blame and Liability: Strict Liability
  *   **Current:** "You shouldn't have relied on that." (User negligence).
  *   **New:** "You changed the environment the user built in." (Maintainer strict liability).
  *   **Consequence:** The burden of proof shifts. To change behavior, the maintainer must prove that **no reasonable user could have depended on the old behavior**. This effectively requires **Property-Based Testing** over public interfaces. You cannot just test that the code works; you must test that all *invariants* perceived by users are preserved.

  #### D. The "Contract": Code as the Only Truth
  *   **Current:** Code + Docs = Contract (with Docs overriding Code on intent).
  *   **New:** Code + Tests = Contract.
  *   **Consequence:** Natural language documentation would be demoted to "helpful hints." The only binding promises would be **executable specifications**. If it isn't tested, it isn't promised. If it is observable, it is tested. This forces the "Contract" to be machine-verifiable, removing the ambiguity of natural language implicature.

  ### 5. Summary: The Philosophical Verdict

  Your field is currently operating on a **Speech Act of Bad Faith**.

  Maintainers use **Constative Utterances** (docs) to define the world when it suits them, but rely on **Performative Utterances** (naming, tone) to shape user behavior. When the performatives create dependencies they don't want, they retreat to the constatives to deny responsibility.

  If you were to resolve this coherently in favor of the inference-based view, you would be admitting that **software is a social agreement, not a technical specification.**

  To fix it, you would need to stop treating documentation as a shield and start treating **observability as the interface.** You would need tools that scan downstream dependencies to see what is *actually* relied upon (the "Maxim" operationalized) and treat those findings as binding constraints. Until then, the "Not Documented" rule will remain a convenient fiction that allows maintainers to harvest the trust built by pragmatics while paying the costs of semantics.
