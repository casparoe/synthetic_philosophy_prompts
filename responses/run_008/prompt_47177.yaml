answer: |-
  Hey, thanks for sending this over because I think your sneaking suspicion is correct, though not necessarily for the reasons your cohort is giving. I have read through your package a few times and I want to walk you through where the tensions actually lie, ranked by how badly they threaten the coherence of the view. The good news is that your intuition about the coin under the cup is fine, so you can stop losing sleep over commitment three. Time-indexed chances are standard fare for propensity views and the idea that chances update as the physical situation narrows down the possibilities is perfectly coherent with the idea of a disposition manifesting. Whether the coin is hidden or visible does not change the metaphysics of the chance itself, only the epistemic access to the outcome, so that part hangs together well with the Principal Principle and does not need repair.

  The second most severe problem is the one your friend muttered about dispositions and probability axioms, which is basically a version of Humphrey's paradox. You claim in commitment four that chances obey the usual axioms just like credences, but dispositions do not naturally map onto the Kolmogorov axioms, particularly regarding conditional probability. A disposition is typically a conditional property, like fragility is the disposition to break if struck, but probabilities obey rules of conditionalization that dispositions do not automatically satisfy. If chances are propensities, you need a story for why these metaphysical dispositions just happen to align perfectly with the mathematical calculus of probability, otherwise commitment four is just an assertion without a mechanism. This is a serious theoretical cost, but it is fixable with enough work on the metaphysics of dispositions, perhaps by stipulating that propensities are a sui generis kind of property defined by their adherence to the probability calculus. This is a medium severity problem because it requires extra metaphysical lifting, but it does not logically invalidate the view on its own.

  The real trouble starts when you try to stack commitment one on top of commitment five, and honestly, that is the fatal flaw in the architecture. You are claiming chances are single-case propensities inherent to the specific physical situation of an atom or coin, but you are also claiming the fundamental physics is deterministic. If determinism is true, then the complete physical situation at any given time logically entails exactly one future outcome. If the chance is a fact about that complete physical situation, as you say in commitment one, then the chance must be one or zero, not one-half. You cannot have it both ways. To get the one-half chance you want in commitment five, you have to be talking about a description of the setup that leaves out the precise micro-conditions that determine the outcome. But the moment you do that, you are no longer talking about a mind-independent fact about the particular atom or coin in its full physical reality; you are talking about a fact relative to a coarse-grained description or an agent's ignorance of the micro-state. This directly contradicts your insistence in commitment one that chance is not about ignorance. So the tension between one and five is not just a friction, it is a contradiction. Your propensity-or-nothing friend is right that single-case propensities generally require indeterminism to be non-trivial, because if the world is deterministic, the only single-case propensity any event has is the propensity to happen exactly as determined. When you appeal to physically similar setups in commitment five, you are smuggling in a frequentist or type-level view that undermines the single-case realism of commitment one.

  So here is the ranking of problems. The conflict between single-case propensities and determinism is the engine failure, the disposition-axiom link is a transmission problem, and the time-indexing is just noise. If you want to keep the view salvageable, you have to choose which commitment to sacrifice. The cheapest repair, philosophically speaking, is to modify commitment one to allow for level-relative chances. You can keep determinism and you can keep objective chances, but you have to admit that chances are not properties of the complete micro-state but rather properties of macro-states or models. This saves commitment five and mostly saves commitment two, but it costs you the strong realism of commitment one because it makes chance dependent on how we describe the system rather than just how the system is. Alternatively, you could drop commitment five and embrace indeterminism, which saves the single-case propensity view but costs you physical parsimony and goes against your intuition about quantum mechanics. You cannot keep the package exactly as written because the definition of chance in commitment one is incompatible with the physical picture in commitment five, and pretending they fit together will leave you open to the exact objections your best-system friend is already making. I think you should bite the bullet on level-relative chance because it lets you keep the Principal Principle and the objective feel of chance without denying the physics, but you will have to concede that chance is not a fundamental property of the single case in the way you originally wanted.
