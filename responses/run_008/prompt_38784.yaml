answer: |-
  # Session Plan: The Diluting Draw

  **Duration:** 90 Minutes
  **Participants:** 12 Postgraduates
  **Materials:** Slips of paper, pens, whiteboard, calculator, £120 in bookshop vouchers (or departmental equivalent).
  **Constraint:** No mention of "superrationality," "Hofstadter," "Newcomb," or "decision theory" until the Debrief (Minute 75).

  ---

  ## I. The Payoff Formula & Parameters

  ### The Mechanism
  Each participant secretly submits a non-negative integer $n_i$ (number of entries).
  Let $N = \sum_{i=1}^{12} n_i$ be the total pool size.
  One ticket is drawn uniformly at random from the $N$ tickets.
  The winner receives the **Prize Pot**, $P(N)$.

  ### The Formula
  $$P(N) = \frac{£1440}{N}$$
  *(If $N=0$, no draw occurs, no prize awarded.)*

  ### Your Expected Value (EV)
  $$EV_i = \left( \frac{n_i}{N} \right) \times \left( \frac{£1440}{N} \right) = £1440 \times \frac{n_i}{N^2}$$

  ### Worked Whiteboard Example
  *Write this clearly before Stage 1 begins.*

  **Scenario A (Cooperation):** Everyone submits **1**.
  *   Total ($N$) = 12.
  *   Prize Pot = $1440 / 12 = £120$.
  *   Your Probability = $1/12$.
  *   **Your EV = £10.**

  **Scenario B (Defection):** 11 others submit **1**. You submit **11**.
  *   Total ($N$) = 22.
  *   Prize Pot = $1440 / 22 \approx £65.45$.
  *   Your Probability = $11/22 = 50\%$.
  *   **Your EV = £32.72.**
  *   *Note: You have more than tripled your EV by defecting.*

  **Scenario C (Arms Race):** Everyone submits **11**.
  *   Total ($N$) = 132.
  *   Prize Pot = $1440 / 132 \approx £10.90$.
  *   Your Probability = $11/132 = 1/12$.
  *   **Your EV = £0.90.**
  *   *Note: The group is 11x worse off than Scenario A.*

  ### Parameter Defense
  *   **Stakes (£1440 Max Pot / £120 Cooperative EV):** High enough to induce stress ("real enough to sting"), low enough to be expensed as "teaching materials" or "participant compensation" without triggering university finance audits. Vouchers prevent cash-handling liability.
  *   **Group Size (12):** Large enough to dilute individual impact (making defection tempting), small enough to calculate $N$ quickly on a whiteboard.
  *   **The Constant (1440):** Chosen because $1440/12 = 120$. It makes the "All-1s" baseline a clean £10 per person, facilitating mental math during the debrief.

  ---

  ## II. Session Stages

  ### Stage 1: The Cold Round (20 Minutes)
  1.  **Instruction (5 mins):** Read the rules. Display the Payoff Formula and Worked Example on the board. Emphasize: *Silence. No communication. Submit an integer.*
  2.  **Submission (5 mins):** Collect slips.
  3.  **Calculation (5 mins):** Facilitator sums $N$ publicly. Calculates Prize Pot. Draws the winner (have a student draw the slip).
  4.  **Record (5 mins):** Write the resulting $N$ and Winner's EV on the board. Do not reveal individual submissions.

  ### Stage 2: The Open Round (30 Minutes)
  1.  **Reveal (5 mins):** Announce the Total $N$ from Stage 1. (e.g., "The pool was 48 entries.").
  2.  **Discussion (15 mins):** Open floor. Participants may argue, plead, threaten, or collude. *Crucial:* No binding contracts. Any agreement is unenforceable "cheap talk."
  3.  **Submission (5 mins):** Secret second submission.
  4.  **Resolution (5 mins):** Calculate $N$, Prize, Draw Winner. Record results.

  ### Stage 3: The Symmetry Bonus (20 Minutes)
  *This stage introduces a rule change to force the "superrational" premise into the mechanics.*

  1.  **Instruction (5 mins):** "For this round, the base formula $P(N) = 1440/N$ remains. However, a **Consistency Multiplier** applies:"
      *   **If all 12 submissions are identical:** The Prize Pot is multiplied by **5**.
      *   **If there is any disagreement (variance > 0):** The Prize Pot is **halved**.
  2.  **Submission (5 mins):** Secret submission.
  3.  **Resolution (10 mins):** Check for unanimity *before* the draw. Apply multiplier/halving. Calculate Pot. Draw Winner.
      *   *Mathematical Trap:* If everyone coordinates on 100, the Pot is $5 \times (1440/1200) = £6$. EV = £0.50.
      *   If everyone coordinates on 1, the Pot is $5 \times (1440/12) = £600$. EV = £50.
      *   *The Test:* Does the group reason that "We must match" implies "We must match on the number that maximizes the match"? Or do they fear being the only '1' in a room of '100's?

  ### Stage 4: The Constitutional Vote (10 Minutes)
  1.  **Proposal:** "We will play one final round. Before playing, we vote on a binding rule: **Cap entries at 1 per person.**"
  2.  **Vote:** Simple majority.
  3.  **Play:** If passed, play under the cap. If failed, play under original rules.
  4.  **Resolution:** Final draw. Distribute vouchers.

  ---

  ## III. The Debrief Script (20 Minutes)

  *Now you may break the silence on theory.*

  **1. Mapping the Arms Race (Dominance & Nash)**
  "Look at Stage 1. How many of you calculated that if others played 1, your best response was to play more? In standard Causal Decision Theory (CDT), your choice cannot *cause* theirs. Their entries are fixed facts. Given a fixed $N_{-i}$, your EV is maximized by matching $N_{-i}$. This is the dominance reasoning that drove the pool size up. You were playing a Nash Equilibrium search in a game where the equilibrium is effectively infinity."

  **2. The Failure of Talk (Common Knowledge)**
  "In Stage 2, you spoke. You likely agreed to play 1s. Why did it fail? Because the agreement wasn't common knowledge *of enforcement*. You knew you agreed, but you didn't know they knew you knew they would stick to it. In game theory, 'cheap talk' cannot resolve a Prisoner's Dilemma structure without binding enforcement."

  **3. The Symmetry Premise (Superrationality)**
  "Stage 3 was designed to mimic Hofstadter's 'Superrationality.' The Consistency Multiplier rewarded symmetry. To win the 5x bonus, you had to predict what others would submit. If you assume everyone in this room is using the *same reasoning algorithm* as you (symmetry), then your choice is *evidence* of their choice.
  *   If you think 'I should play 100 to be safe,' you must assume they think the same. Result: Everyone plays 100, prize dilutes, bonus wasted.
  *   If you think 'We are all rational optimizers,' you realize the only number that maximizes the *shared* outcome under symmetry is 1.
  *   Did anyone feel a 'vertiginous' pull to play 1, not because of altruism, but because playing 100 felt like a logical contradiction to the goal of winning the bonus?"

  **4. The Vote (Hobbes & Rule Utilitarianism)**
  "Stage 4 was a vote on a Sovereign. Those who voted for the cap: was it because you feared others would defect (Hobbesian fear), or because you recognized the rule itself maximizes expected utility for the group (Rule Utilitarianism)? The distinction is subtle but vital for political philosophy."

  ---

  ## IV. Troubleshooting & Honesty Notes

  ### Predictable Failures & Handling

  **1. The "Absurd Number" Defector**
  *   **Risk:** A participant submits 1,000,000 to guarantee a win in Stage 1 or 2, crashing the prize to £0.001.
  *   **Handling:** Do not disqualify. This is data. In the debrief, highlight that while they secured the *probability* of winning, they destroyed the *value* of winning. This is the tragedy of the commons in its purest form.
  *   **Pre-emption:** Announce a "Bankruptcy Clause": If $N > 10,000$, the experiment ends and no prizes are awarded. This creates a Schelling point for restraint without capping individual agency.

  **2. Collusion in Stage 2**
  *   **Risk:** The group agrees on "1" and actually sticks to it.
  *   **Handling:** This is a success, not a failure. It proves that with sufficient social pressure (even unenforceable), CDT agents can approximate cooperative outcomes. In the debrief, ask: "Did you stick to 1 because you trusted them, or because you feared social sanction?"

  **3. Stage 3 Confusion**
  *   **Risk:** Participants don't understand the Variance Multiplier.
  *   **Handling:** Keep the whiteboard example updated. Show: "All 1s = £600 Pot. All 10s = £60 Pot. Mismatch = £0.50 Pot." Visuals are essential.

  **4. Abstentions**
  *   **Risk:** Someone submits 0.
  *   **Handling:** Mathematically valid. They get 0 chance of winning but don't contribute to dilution. In debrief, classify this as "Opting out of the game," which is a third strategy often ignored in binary models.

  ### Philosophical Limitations (The "Fiats")

  *Be explicit about what the simulation cannot do.*

  1.  **Symmetry is Stipulated, Not Real:** Superrationality relies on the premise that players are *identical reasoners*. You are not. You have different risk tolerances, different financial needs, and different knowledge of each other. Stage 3 *pretends* you are identical by rewarding it, but it cannot *make* you identical. The "correlation" between your choice and theirs is causal (you see them in the room), not logical (you are the same algorithm).
  2.  **The "One-Shot" Problem:** Real superrationality experiments often rely on iterated games or high stakes. 90 minutes is a blink. Trust does not have time to crystallize.
  3.  **Facilitator Fiat:** You are the God of this machine. You set the constants (£1440). You enforce the rules. In a real-world coordination problem (climate change, nuclear disarmament), there is no facilitator to adjust the payoff function when things go wrong.
  4.  **The "Sting" Factor:** £10 vs £30 is not enough to trigger true existential dread. Participants may treat it as a puzzle rather than a decision. Acknowledge that *real* decision theory happens when the stakes threaten something you cannot replace.

  ### Closing Statement for the Group
  "We simulated a structure where individual rationality guarantees collective ruin. You felt the pull to defect. You felt the frustration of unenforceable agreements. You felt the strange logic of trying to 'match' strangers to unlock a bonus. Take that feeling. That tension between 'what is best for me given what they do' and 'what is best for us if we think alike' is the engine of the rest of this reading group. Next week, we read Hofstadter."
