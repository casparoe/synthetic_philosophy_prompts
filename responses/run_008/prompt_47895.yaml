  **MEMORANDUM**

  **TO:** Editor-in-Chief
  **FROM:** Methods Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Statistical Evidence and Stopping Rules

  **Executive Summary**

  The Methods Committee has reviewed the proposal to transition the journal's statistical requirements. After extensive deliberation, we recommend adopting a **Dual-Track Policy with Mandatory Preregistration**. 

  Under this policy, authors may choose between:
  1.  **Frequentist Track:** Null Hypothesis Significance Testing (NHST) with $\alpha = .005$ and a fixed, preregistered sample size.
  2.  **Bayesian Track:** Bayes Factors (BF) with a threshold of $BF_{10} > 10$, permitting optional stopping *provided* that prior justification and sensitivity analyses are reported.

  While this policy incorporates the Bayesian faction's desire for sequential analysis, it explicitly rejects the claim that Bayesian methods are immune to researcher degrees of freedom. We side with the reform faction's caution regarding model specification, embedding their safeguards into the Bayesian track.

  **Rationale and Committee Deliberation**

  The committee was divided between two compelling positions. One faction argued that adherence to the Likelihood Principle makes Bayes Factors theoretically superior, specifically that evidence accumulation does not invalidate inference under optional stopping. The other faction argued that changing the math without changing the incentives merely replicates the replication crisis with new parameters, urging strict preregistration and fixed sampling.

  Our recommendation attempts to synthesize these views, but it is important to acknowledge where the committee ultimately landed on the core theoretical dispute. We have voted to **allow optional stopping for Bayesian analyses**, which effectively adopts the Bayesian faction's primary procedural change. However, in doing so, we must treat the losing side's critique—specifically the Frequentist Reform faction's warning about model dependence—with the seriousness it deserves.

  **The Validity of the Frequentist Critique**

  The Bayesian faction's argument rests on the Likelihood Principle: that all evidence in a sample is contained in the likelihood function, rendering the stopping rule irrelevant to the interpretation of the Bayes Factor. Mathematically, this is sound *conditional on the model being true*.

  The Frequentist Reform faction correctly identified that this condition is rarely met in psychological science. Their best point—which we accept as the rationale for our safeguards—is that **Bayes Factors are not immune to bias if the model is misspecified.** 

  If an author engages in optional stopping, they are implicitly assuming that their prior distribution and likelihood structure perfectly capture the data-generating process. In practice, if a researcher monitors data and stops when $BF > 10$, they are exploiting the fact that their specific model (including their priors) fits the noise at that specific moment. If the prior is too narrow, or if there is unmodeled heterogeneity in the data, optional stopping can inflate false positive rates in Bayesian analyses just as it does in p-values. 

  Therefore, while we accept the theoretical elegance of the Likelihood Principle, we agree with the Reform faction that "math does not fix incentives." Allowing unrestricted optional stopping would indeed risk a "replication crisis with new math." 

  **Concrete Policy Specifications**

  To balance theoretical efficiency with practical robustness, the journal will implement the following immediately:

  1.  **Mandatory Preregistration:** All empirical submissions must include a timestamped preregistration (e.g., OSF). This addresses the Reform faction's core demand for transparency regardless of the statistic used.
  2.  **Frequentist Track:** 
      *   Significance threshold set at $\alpha = .005$.
      *   Stopping rules must be fixed and adhered to as preregistered. Deviations require a registered report format.
  3.  **Bayesian Track:** 
      *   Evidence threshold set at $BF_{10} \geq 10$ for strong evidence.
      *   **Optional Stopping is Permitted**, *but* authors must disclose the frequency of data monitoring (e.g., "checked after every 10 participants").
      *   **Sensitivity Analysis Required:** Authors must demonstrate that the conclusion holds under reasonable alternative prior specifications. This directly mitigates the Frequentist concern that the result is an artifact of a specific, potentially biased prior chosen during peeking.

  **Implementation**

  We recommend a six-month grace period for authors to adapt to the Bayesian requirements, specifically regarding prior sensitivity analysis. The editorial office should prepare a checklist for reviewers to ensure that "optional stopping" claims are accompanied by the required monitoring disclosure.

  **Conclusion**

  This policy moves the journal toward more efficient data collection (via Bayesian sequential analysis) without surrendering the hard-won lessons of the replication crisis. We are effectively ruling that while Bayes Factors *theoretically* handle stopping rules better, *practically* they require the same transparency as p-values to ensure the model assumptions hold. We believe this offers a path forward that respects the math without ignoring the reality of human behavior in science.

  Respectfully submitted,

  The Methods Committee
