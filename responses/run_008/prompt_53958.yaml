answer: |-
  Based on the six verdicts provided, your housemate operates with a taxonomy of deception that is more nuanced than the standard philosophical distinction (which typically defines lying strictly as asserting what one believes to be false). Her view is a hybrid: it requires **linguistic communication** (ruling out the badge), **commitment to truth** (ruling out bullshit), and **intent to deceive** (ruling out sarcasm), but it expands the definition of "assertion" to include **direct conversational implicatures** (the cake case).

  Here are the predictions for the sister's four cases, followed by the rule analysis, the separating case, and the fragility assessment.

  ### Predictions for the Sister's Cases

  **(a) The Car Sale (True sentences, false implicature): Lying.**
  *   **Reasoning:** This is structurally identical to Case 3 (The Cake). In both instances, a direct question is met with a literally true statement that conversationally implicates a falsehood the speaker knows is false. Since your housemate classified the cake excuse as *lying* rather than *misleading*, she treats exploited Gricean implicatures in direct responses as assertions. The commercial context (seller/buyer) lacks the domestic trust of flatmates, but the linguistic mechanism is the same, and her Rule 1 (Bailiff) suggests the severity of the breach doesn't change the category.

  **(b) The Broken Window (Counter-accusation question): Not Lying.**
  *   **Reasoning:** This is a question, not an assertion. While it presupposes a falsehood ("You broke it"), your housemate's track record shows she requires an *assertoric* commitment to truth (Case 6 distinguishes bullshit from lying based on this commitment). A rhetorical question or counter-accusation is a manipulative linguistic act (deceptive and wrong), but like the badge (Case 4), it lacks the specific form of "stating as true." She would likely categorize this as "Accusing" or "Manipulating," distinct from lying.

  **(c) The Captors (True info, intent to deceive): Not Lying.**
  *   **Reasoning:** This is the classic "truth-telling to deceive." Her verdicts on Case 1 and 2 establish that the *falsity of the belief* is a necessary condition for lying. Here, the sister believes the location is true. Even though the *intent* is to induce a false belief (that the info is unreliable), the speaker does not represent a proposition she believes to be false. This fits her distinction in Case 5 (Sarcasm): the mental state regarding the truth-value of the content matters.

  **(d) The Dying Dog (False comfort): Lying.**
  *   **Reasoning:** This is a paradigmatic lie. It involves words, an assertion believed to be false, and an intent to induce belief (even if benevolent). Case 2 (Border Guard) shows that the *efficacy* or *motivation* (self-preservation vs. comfort) does not remove the label of lying, even if it mitigates the moral blame. She will call it lying, even if she deems it morally permissible.

  ### The Competing Rules

  To generate these verdicts, two main rules survive the six past cases. They differ on *why* the boundaries are drawn where they are.

  **1. The Communicative Commitment Rule (My Best Guess)**
  *   **Definition:** Lying is a **linguistic act** wherein the speaker **represents a proposition as true** (either literally or via standard conversational implicature in a direct response), **believes it false**, and **intends the hearer to believe it**.
  *   **Fit:** It explains Case 4 (no words), Case 5 (no intent to deceive), Case 6 (no representation of truth), and crucially Case 3 (implicature counts as representation).
  *   **Source:** A modification of the standard assertion view (e.g., Carson/Mahon) expanded to cover the "Cake" anomaly.

  **2. The Moral Salience Rule (The Uncharitable Hypothesis)**
  *   **Definition:** "Lying" is simply the label your housemate applies to the subset of deceptive acts she **condemns most severely**, specifically those that breach a cooperative norm of truth-telling between interlocutors.
  *   **Fit:** It explains why Case 3 (Flatmate trust) is lying while Case 4 (Badge) is merely deceptive. The badge is a trick; the cake is a betrayal of dialogue.
  *   **Source:** A pragmatic, expressivist view where moral verdicts drive linguistic categorization, not the other way around.

  **Where They Come Apart:**
  These rules diverge on cases where the **linguistic form is perfect** but the **moral breach is negligible**, or vice versa.
  *   *Case (a) (Car):* The Communicative Rule says **Lying** (structure matches Cake). The Moral Salience Rule might say **Misleading** (seller/buyer trust is lower than flatmates). I predicted Lying because her Case 3 verdict seemed driven by the *linguistic exploitation* rather than just the relationship.
  *   *Case (b) (Window):* The Communicative Rule says **Not Lying** (not an assertion). The Moral Salience Rule might say **Lying** if she condemns false accusation as harshly as false assertion.

  ### The Clean Separator Case

  To definitively choose between the **Communicative Commitment Rule** and the **Moral Salience Rule**, you need a case that isolates the "Words" constraint from the "Condemnation" variable.

  **The Case:** **The Sign Language Lie.**
  *   **Scenario:** Your housemate is in a noisy room. A friend asks, "Did you eat the cake?" She understands the question, signs "No" (believing it false), intending to deceive.
  *   **Why it separates them:**
      *   **Communicative Commitment Rule:** Predicts **Lying**. Sign language is linguistic and carries assertoric commitment, satisfying the "Words" constraint of Case 4 (which banned *non-linguistic* acts like badges) while matching the deception of Case 1.
      *   **Moral Salience Rule:** Could go either way, but if she views "Lying" as strictly *vocal* betrayal (given Case 4 emphasized "no words" rather than "no communication"), she might say **Not Lying**.
      *   **Better Separator:** **The False Promise.** "I promise to pay you back tomorrow" (knowing she won't).
          *   **Communicative Rule:** **Lying.** It is a linguistic representation of a current intention she believes is false.
          *   **Moral Salience Rule:** **Not Lying.** Many people distinguish "Breaking a Promise" from "Lying." If she reserves "Lying" for statements of *fact* rather than *commitment*, this reveals her category is about *descriptive truth*, not just deceptive communication.

  **Recommendation:** Use **The False Promise**. It tests whether her definition of "representation of truth" (Case 6) extends to future intentions or is limited to factual claims.

  ### Fragility and Candor

  This exercise is remarkably fragile. You are reverse-engineering a personal moral-linguistic taxonomy from only six data points.

  **The Weak Link:** **Case 3 (The Cake).**
  This is the only verdict that deviates from the standard philosophical consensus (which classifies true statements with false implicatures as *misleading*, not *lying*). If you have misremembered this verdict, and she actually called it "misleading" (but perhaps *wrongly* misleading), the entire **Communicative Commitment Rule** collapses.
  *   **Consequence:** If Case 3 is actually "Misleading," then Prediction (a) (The Car) flips to **Misleading**. The distinction returns to the standard Literal Truth view.

  **Abandonment Condition:**
  I would abandon the **Communicative Commitment Rule** if your housemate verdicts **Case (a) (The Car)** as **Misleading**.
  *   **Reason:** Case (a) is the closest structural match to Case 3. If she distinguishes them, it proves that **Context/Relationship** (Flatmate vs. Stranger) drives her verdicts, not Linguistic Structure. This would validate the **Moral Salience Rule** (Lying = Betrayal of specific trust) and render the linguistic analysis secondary. If the relationship determines the label, there is no stable "rule of lying" to find, only a map of her personal trust boundaries.
