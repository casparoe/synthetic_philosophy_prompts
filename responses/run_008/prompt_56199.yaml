answer: |-
  Here is a decision procedure designed for your context. It prioritizes administrative continuity and legal defensibility over metaphysical purity, because insurance adjusters and auditors do not pay for ontological nuance.

  ### The Identity Continuity Protocol (ICP)

  **Purpose:** To determine if a current holding retains the accessioned identity of the object as acquired.
  **Time:** < 3 minutes per record.
  **Users:** Registrars/Volunteers.

  **Question 1: The Identity Carrier**
  *Does the object retain the specific structural component that historically carried its unique identity (e.g., locomotive frame/chassis, boat hull, carriage underframe)?*
  *   **YES:** Proceed to Q2.
  *   **NO:** **VERDICT: NOT THE SAME OBJECT.** (It is a reconstruction or a replica).
  *   **PUNT TO REGISTRAR:** If two separate components both claim to be the Identity Carrier (e.g., original frame vs. original boiler both exist and both claim to be "The Locomotive").

  **Question 2: The Intent of Change**
  *Were changes made to preserve the object's function/form (maintenance/repair) or to create a new function/form (modification/conversion)?*
  *   **MAINTENANCE/REPAIR:** Proceed to Q3.
  *   **MODIFICATION/CONVERSION:** **VERDICT: NOT THE SAME OBJECT.** (It is a significantly altered derivative; create a new accession record for the new configuration).

  **Question 3: The Continuity of Custody**
  *Has the object remained in continuous museum custody (or documented loan) since accession, without a period where it was scrapped, lost, or deaccessioned?*
  *   **YES:** Proceed to Q4.
  *   **NO:** **VERDICT: NOT THE SAME OBJECT.** (Identity was broken by abandonment).

  **Question 4: The Double Claim**
  *Is the material removed during maintenance still extant and claimed as a separate object with its own significance?*
  *   **NO:** **VERDICT: SAME OBJECT.** (Standard maintenance; identity remains with the carrier).
  *   **YES:** **PUNT TO REGISTRAR.** (You have a "Ship of Theseus" conflict where two records claim the same identity. This requires a significance assessment, not a factual check).

  ***

  ### Application to Your Three Records

  Here is how the ICP runs on your specific problem cases.

  **(a) The Locomotive (Boiler replaced in 70s; original boiler preserved separately)**
  *   **Q1 (Identity Carrier):** The frame/chassis is usually the legal identity carrier for rail vehicles (where the number plate lives). Let's assume the frame is present. **YES.**
  *   **Q2 (Intent):** Boiler replacement due to wear/safety. **MAINTENANCE.**
  *   **Q3 (Custody):** Continuous. **YES.**
  *   **Q4 (Double Claim):** **YES.** The original boiler exists and is accessioned separately, claiming to be the "heart" of the locomotive.
  *   **RESULT:** **PUNT TO REGISTRAR.**
  *   **Why:** You have two accession numbers claiming the same identity. One must be demoted to "Component Part." This is not a factual question; it is a significance question. You must decide if the *vehicle* is the frame or the *engine* is the boiler.

  **(b) The Carriage (Every plank swapped piecemeal over 60 years)**
  *   **Q1 (Identity Carrier):** The underframe/chassis usually survives even if body planks rot. Assuming the underframe is the original 1962 acquisition structure. **YES.**
  *   **Q2 (Intent):** Piecemeal swap to maintain integrity. **MAINTENANCE.**
  *   **Q3 (Custody):** Continuous. **YES.**
  *   **Q4 (Double Claim):** Removed planks were scrap/discarded. **NO.**
  *   **RESULT:** **SAME OBJECT.**

  **(c) The Boat (Original hull, new chassis/running gear, static exhibit)**
  *   **Q1 (Identity Carrier):** The hull is the identity carrier for a boat. **YES.**
  *   **Q2 (Intent):** Converted to static display (wheels never turn, sits on chassis). This is a change of function from "vessel" to "exhibit structure." **MODIFICATION.**
  *   **RESULT:** **NOT THE SAME OBJECT.** (It is now a "Static Display Model based on Original Hull." It requires a new accession status or a significant alteration flag that effectively breaks the "working transport" identity).

  ***

  ### The Verdict That Will Upset Heritage

  **Case (b), the Carriage, is ruled "SAME OBJECT."**

  **Why this makes your heritage team unhappy:**
  Your heritage listing bid relies on the phrase "substantially the original." In grant and listing contexts, auditors often interpret "original" as **"original fabric."** By certifying the carriage as the "Same Object as Acquired (1962)," you are legally attesting to its continuity. However, because the ICP prioritizes *structural continuity* over *material authenticity*, you are now on the record stating that a thing with **0% original bodywork** is the "Original Carriage."

  If an auditor pulls this file during the heritage bid, they will see a "Same Object" certification alongside a conservation report admitting 100% material replacement. They will flag this as misleading. Your heritage team wants to market it as "The 1900 Carriage" to attract funding. Your database now forces them to market it as "The 1900 Identity with 2024 Matter." The latter gets fewer grants. You have protected the museum from legal fraud accusations, but you have torpedoed their marketing narrative.

  ***

  ### Where the Costume Slips (The Honest Bit)

  You asked me to be honest about where this procedure is institutional policy wearing a philosophy costume. Here are the two places where I am lying to you about the "objectivity" of these questions:

  **1. The "Identity Carrier" (Question 1)**
  This is not a fact; it is a **sortal preference**. In railway culture, the frame carries the number. In maritime culture, the hull carries the name. In engineering, the boiler is the "engine." By hard-coding "Frame = Object" into Question 1, I am forcing a specific cultural hierarchy onto the ontology.
  *   *The Risk:* If your heritage listing is for "Steam Technology," the Boiler *is* the object. If your listing is for "Rolling Stock," the Frame *is* the object. My procedure assumes the latter. If your heritage bid is about the technology, this procedure will actively sabotage you by demoting the boiler to a "part" in Case (a).

  **2. The "Maintenance vs. Modification" (Question 2)**
  This pretends there is a bright line between "repairing" and "changing." There isn't. Replacing a wooden body with a steel one is often done for "maintenance" (rot prevention), but it fundamentally changes the object's character.
  *   *The Risk:* In Case (c), I ruled the boat "Not the Same Object" because it became static. But many heritage trams are static. The distinction I drew is arbitrary policy. I am forcing you to value *function* over *form*. If your museum's mission is "Preserving Vehicles," (c) is dead. If your mission is "Preserving History," (c) is alive. The procedure forces the former.

  **Recommendation for the Punt (Case A):**
  When this lands on your desk for the Locomotive/Boiler conflict, do not look for the "true" object. Look at your **Mission Statement**.
  *   If you are a *Science Museum*, the Boiler is the Object (accession the boiler as the loco, demote the frame).
  *   If you are a *Transport Museum*, the Frame is the Object (accession the frame as the loco, demote the boiler).
  *   Write that policy down. It is the only thing that will survive the audit.
