  # Seminar Handout: Navigating the Underdetermination Debate

  **Starting Premise:** All students begin by granting the **Principle of Underdetermination (POU)**: *For any finite body of evidence, it is possible in principle to construct multiple incompatible theories that all entail it.*

  **Instructions:** Answer the following questions based on your philosophical intuitions about science. Do not look ahead to see which position your answers produce. Follow the branches until you reach a leaf node.

  ---

  ### **NODE 1: The Historical Reality Test**
  **Question:** When we look at actual cases in mature science (e.g., Lorentz–FitzGerald contraction vs. Special Relativity in 1905; Newton-plus-Vulcan vs. General Relativity on Mercury), are the empirically equivalent rivals **genuine competing explanations** of the world, or are they merely **notational/parasitic variants** that quietly borrow the successful theory's content?

  *   **A. They are parasitic/notational variants.** (The "rivals" are artificial algorithms, not live scientific options.)
      *   ➔ **LEAF: Contrastive Empiricism (Laudan & Leplin)**
      *   *View:* Underdetermination is a logical phantom. It never bites in actual science because genuine rivals do not persist. We can rationally choose the best theory.
  *   **B. They are genuine competing explanations.** (The rivals represent distinct ways the world could be.)
      *   ➔ **Go to NODE 2.**

  ---

  ### **NODE 2: The Aim of Science**
  **Question:** Is the primary aim of science to provide a **literally true description of unobservable reality**, or is it merely to produce theories that are **empirically adequate** (save the phenomena)?

  *   **A. Empirically Adequate.** (We should remain agnostic about whether unobservables actually exist.)
      *   ➔ **LEAF: Constructive Empiricism (Van Fraassen)**
      *   *View:* Accept theories as empirically adequate, but suspend belief on the truth of unobservables. Underdetermination shows we cannot know which theory is true, so we shouldn't try.
  *   **B. Literally True.** (Science aims to tell us what exists, even if unobservable.)
      *   ➔ **Go to NODE 3.**

  ---

  ### **NODE 3: The Status of Theoretical Virtues**
  **Question:** When we prefer a simple, unified theory over a complex, disunified one (e.g., preferring a straight line curve-fit over a jagged one through the same points), are we tracking **how the world actually is**, or are we applying **pragmatic conveniences** suited to human cognition?

  *   **A. Pragmatic Conveniences.** (Simplicity is about us, not nature.)
      *   ➔ **Go to NODE 4.** (The Pragmatist/Holist Branch)
  *   **B. Indicators of Truth.** (Nature is simple/unified; virtues track reality.)
      *   ➔ **Go to NODE 5.** (The Realist Branch)

  ---

  ### **NODE 4: The Confirmation Question**
  **Question:** If a theory is modified *after* the fact with an *ad hoc* patch to fit a new anomaly, does this new fit **confirm the theory** just as well as a novel prediction would?

  *   **A. Yes.** (Confirmation is just logical entailment of evidence.)
      *   ➔ **LEAF: Quinean Pragmatism**
      *   *View:* Any statement can be held true come what may if we adjust the rest of the "web of belief." Choice is guided by pragmatic maxims, not truth-tracking logic.
  *   **B. No.** (*Ad hoc* patches lack the confirmatory power of novel predictions or coherent integration.)
      *   ➔ **LEAF: Duhemian Holism**
      *   *View:* Experiments test whole groups of hypotheses, not single claims. Logic cannot dictate which to drop; "good sense" (*bon sens*) guides the choice, distinguishing genuine adjustments from *ad hoc* saves.

  ---

  ### **NODE 5: The Pessimistic Induction**
  **Question:** History shows that past successful theories posited entities we now reject (e.g., phlogiston, the ether). Does this history **undermine our confidence** that our current theoretical descriptions are approximately true?

  *   **A. No.** (Current success is a miracle if the theory isn't at least approximately true.)
      *   ➔ **LEAF: No-Miracles Scientific Realism**
      *   *View:* The success of science would be a miracle if our best theories were not true. Underdetermination is solved by inference to the best explanation.
  *   **B. Yes.** (Past success did not guarantee truth then; why now?)
      *   ➔ **Go to NODE 6.**

  ---

  ### **NODE 6: The Survival Question**
  **Question:** If theoretical *descriptions* change and are often false, is there anything about the unobservable world that is **preserved** across theory change and worthy of belief?

  *   **A. Yes, the Mathematical/Relational Structure.** (The equations capture reality, even if the ontology does not.)
      *   ➔ **LEAF: Structural Realism (Worrall)**
      *   *View:* Commit to the structure of the theory, not the nature of the entities. This respects the Pessimistic Induction while avoiding instrumentalism.
  *   **B. Yes, the Causal Powers/Existence of Entities.** (We can manipulate electrons even if our theory of electrons is wrong.)
      *   ➔ **LEAF: Entity Realism (Hacking/Cartwright)**
      *   *View:* Believe in the entities we can causally interact with, but remain skeptical of the overarching theories describing them.

  ---

  ### **Instructor's Notes: Logical Space & Empty Corners**

  **1. The Empty Corner**
  There is a logical combination this tree does not populate: **Aim = Empirical Adequacy** (Node 2A) combined with **Virtues = Truth-Tracking** (Node 3B).
  *   *Status:* **Incoherent.**
  *   *Reason:* If one claims the aim of science is *not* truth about unobservables, claiming that theoretical virtues track the *truth* of unobservables is contradictory. One cannot be an anti-realist about the aim but a realist about the virtues.

  **2. Indistinguishable Leaves**
  Depending on how students interpret the nodes, two pairs may converge:

  *   **Structural Realism vs. Constructive Empiricism:** Both deny knowledge of the *intrinsic nature* of unobservables.
      *   *Separating Question:* "Is the mathematical structure of the theory **mind-independent** (ontic) or just a tool for organizing phenomena (epistemic)?" (Structural Realists say the former; Constructive Empiricists say the latter).
  *   **Entity Realism vs. No-Miracles Realism:** Both believe unobservable entities exist.
      *   *Separating Question:* "Is the **theoretical description** of the entity (its properties, laws) likely true, or just the **existence** of the entity?" (No-Miracles says both; Entity Realism says only existence).

  **3. Note on the Pessimistic Induction (Node 5)**
  The Pessimistic Induction is technically a distinct argument from Underdetermination (one is about history, the other about logic). However, it is placed here because it functions as the primary **defeater** for Realists who have already navigated the Underdetermination problem via Virtues (Node 3). It tests whether the Realist's confidence can survive historical scrutiny.

  **4. Excluded Concepts**
  This tree explicitly excludes **Theory-Ladenness** and **Kuhnian Incommensurability**. Those arguments suggest scientists cannot *compare* theories due to conceptual shifts. This tree assumes theories *can* be compared (they entail the same evidence) but asks *how we choose* between them. Conflating these distinct problems will lead to errors in navigating the branches.
