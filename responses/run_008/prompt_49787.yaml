          *   *Elimination:* Phlogiston *is not* anything. There is no phlogiston.
          *   *Churchland's Point:* If FP is radically false, beliefs won't reduce to brain states; they will vanish. The dorm-mate says "eliminated just means reduced," which is the exact opposite of the Churchland position.
