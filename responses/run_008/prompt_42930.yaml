answer: |-
  **Bottom line**
  This procedure determines coverage by requiring evidence of biological dysfunction or severe life impairment, prioritizing dysfunction when present to distinguish disease from ordinary variation. Verdicts are "Cover," "Deny," or "Conditional Review," based on passing sequential gates regarding clinical validity, harm severity, and treatment efficacy.

  **The procedure**
  1. **Clinical Validity:** Confirm the condition is recognized in major diagnostic manuals (ICD/DSM) or supported by broad peer-reviewed consensus across multiple independent institutions. Anecdotal reports or single-provider proposals are insufficient. The committee must review at least three independent sources. If unrecognized, stop (Deny).
  2. **Dysfunction Check:** Identify evidence of a physiological or psychological mechanism failing to perform its natural function. Look for biomarkers, neurological pathways, or established psychometric deviations. Categorize as Confirmed, Unclear, or Absent. For mental health, cognitive processing failures count as dysfunction. Consensus among the six clinicians on this step is required.
  3. **Harm Assessment:** Evaluate the condition's impact on daily living, work, and social relationships. Use standardized scales where possible. Rate severity from 1 (Minor annoyance) to 5 (Incapacitating). Document specific functional losses, not just subjective distress. Patient testimony alone is insufficient; corroborating clinical notes are required. A score below 3 automatically fails unless Dysfunction is severe.
  4. **Weighting Rule:** This step resolves conflicts between dysfunction and harm. If Dysfunction is Confirmed, a Harm score of 3 or higher passes this gate. If Dysfunction is Unclear or Absent, a Harm score of 5 is required, plus evidence that the condition exceeds normal human variation. This prevents covering ordinary life struggles without biological cause. The policy person casts the tie-breaking vote here.
  5. **Treatment Efficacy:** Verify that the requested intervention reliably reduces harm or corrects dysfunction without disproportionate risk or cost. Evidence must show improvement in functional outcomes, not just symptom reporting. Randomized control trials are preferred; observational data requires strong consistency. If efficacy is unproven, stop (Deny). Cost-effectiveness is secondary to clinical efficacy at this stage.
  6. **Medicalization Veto:** Assess if the condition is a universal experience, such as aging, bereavement, or appearance variance. If yes, override previous steps to Deny unless harm is catastrophic and treatment is restorative rather than cosmetic or enhancement. This protects against converting normal life stages into billable diseases. The committee must document the rationale for any exception to this veto.

  **Worked cases**
  **Misophonia:** Step 1 passes (emerging DSM recognition). Step 2 confirms Dysfunction (auditory sensory gating failure). Step 3 rates Harm at 4 (social isolation, rage). Step 4 passes easily (Confirmed Dysfunction + High Harm). Step 5 shows therapy reduces reactions. Step 6 Veto does not apply (not universal). **Verdict: Cover.** The biological mechanism justifies coverage despite the condition's novelty, satisfying the dysfunction priority.

  **Hair Restoration:** Step 1 passes (recognized condition). Step 2 finds Dysfunction Absent (natural aging variant). Step 3 rates Harm at 3 (psychological distress, no functional loss). Step 4 fails (Absent Dysfunction requires Harm 5). Step 6 Veto triggers (appearance variance is ordinary life). **Verdict: Deny.** This will be unpopular with members petitioning for coverage, but without biological failure or incapacitating harm, it classifies as cosmetic enhancement rather than medical necessity.

  **Prolonged Grief:** Step 1 passes (DSM-5-TR). Step 2 is Unclear (debated mechanism). Step 3 rates Harm at 5 (incapacitating). Step 4 passes narrowly (High Harm compensates for Unclear Dysfunction). Step 6 Veto warns (bereavement is universal). **Verdict: Conditional Review.** Coverage is limited to severe cases where function is totally lost, preventing the medicalization of ordinary bereavement while aiding the truly incapacitated.

  **Where judgment stays**
  Despite the steps, three areas require naked value judgments. First, Step 3 (Harm Assessment) relies on clinicians deciding what counts as "functional loss" versus "unhappiness." Second, Step 6 (Medicalization Veto) requires defining "ordinary life," which shifts culturally; baldness was once stigmatized, now it is often normalized, but the committee must decide if it is "natural." Third, Step 4's weighting rule forces a policy choice: we have decided biological dysfunction trumps subjective harm when resources are limited. When you vote, you are not evaluating science alone; you are defining the boundary between healthcare and life support. Acknowledge this explicitly in the meeting minutes to maintain integrity.

  **What it can't do**
  This procedure will misfire on rare diseases where dysfunction is known but harm is hard to measure, or on cutting-edge treatments where efficacy data lags behind mechanism. It also cannot account for budget constraints; a condition might pass all six steps but still be unaffordable. If a case passes the procedure but threatens solvency, stop using the procedure and switch to a budgetary triage protocol. Do not pretend this clinical tool solves financial limits.
