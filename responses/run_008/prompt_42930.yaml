  2.  **Deconstruct the Philosophical Problem:**
      *   *Naturalism (Dysfunction):* Disease = failure of biological function (Boorse). Problem: Doesn't cover baldness (harmful but not dysfunctional) or some mental health issues (subjective harm).
      *   *Normativism (Harm):* Disease = unwanted condition causing suffering/disadvantage. Problem: Could cover everything unhappy (aging, ugliness, ordinary grief).
      *   *Hybrid Approach:* Need a procedure that requires *some* evidence of dysfunction OR significant harm, but gates the harm with social/clinical consensus to prevent over-medicalization.
      *   *Conflict Resolution:* If dysfunction is clear but harm is low -> Maybe no cover (low priority). If harm is high but dysfunction is unclear -> Need stricter evidence thresholds.
      *   *Strategy:* A weighted scoring or stepwise gatekeeping system. Stepwise is better for "stop the whole thing with a no" requirements.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Needs to be 2-3 sentences. Summarize the hybrid approach (function + harm) and the verdict types (Cover, Deny, Pilot/Review).
