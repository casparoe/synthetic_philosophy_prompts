  7.  **Final Polish:**
      *   Ensure the tone is empathetic but rigorous.
      *   Make sure the "Prices" are clear.
      *   Clearly mark what is consensus vs. contested.
      *   Address the Tolstoy point specifically.

  8.  *(Self-Correction on "Settled" claims)*: I must be careful not to claim causal selection is *settled*. It is widely accepted that there is a distinction, but *why* that distinction exists (pragmatics vs. metaphysics) is debated. I will clarify this.

  9.  *(Final Plan)*:
