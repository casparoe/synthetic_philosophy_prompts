      *   *Refinement:* Introduce the concept of **Stability/Robustness**. A cause is significant if changing it changes the outcome *across a range of background conditions*. The breakfast matters only if *everything else* stays identical. The turn matters even if the breakfast was different. This is the "Invariance" criterion (Woodward/Hitchcock). This gives an objective ground for saying the turn matters *more*.
