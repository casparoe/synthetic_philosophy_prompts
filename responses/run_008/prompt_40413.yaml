answer: |-
  ## The "Right But Early" Audit Protocol

  **Purpose:** To distinguish between a legitimate delay in a causal mechanism (auxiliary failure) and a degenerative research programme (theoretical hollowing).
  **Time Cost:** ~3 hours per prediction.
  **Requirements:** Whiteboard, calculator, access to historical data archives (public), no contact with original authors.
  **Philosophical Basis:** Duhem-Quine (isolating assumptions), Lakatos (progressive vs. degenerative shifts), Popper (falsifiability of conditionals).

  ### The Procedure

  **Step 1: The Duhem Separation (Theory vs. Auxiliaries)**
  *   **Question:** Can you write down the core causal mechanism ($T$) on one line, and list the specific conditions required for it to trigger ($A$) on another?
  *   **Instruction:** Do not accept "complexity" as an excuse. If the prediction was "X will happen by 1990," $T$ is the engine, $A$ is the fuel and the road.
      *   *Example:* $T$ = Population grows geometrically, food arithmetically. $A$ = No new crop tech, no fertility control, no trade.
  *   **Sufficient Answer:** A clear distinction between the *force* (theory) and the *friction* (auxiliaries).
  *   **Fail Condition:** If the theory cannot be stated without including the date or the specific outcome as part of the mechanism itself, **STOP.** (This is a prophecy, not a theory. Bin it.)

  **Step 2: The Auxiliary Autopsy**
  *   **Question:** Did the specific auxiliaries ($A$) fail, or did the core mechanism ($T$) fail to manifest even when auxiliaries were met?
  *   **Instruction:** Look for historical counter-examples where $A$ was true but $X$ did not happen, or where $A$ was false and $X$ happened anyway.
  *   **Sufficient Answer:** Evidence that the missed date was caused by a change in $A$ (e.g., a policy intervention, a technological surprise) rather than a lack of causal power in $T$.
  *   **Fail Condition:** If the auxiliaries held true (the road was clear) and the engine still didn't run, **STOP.** (The theory is falsified. Bin it.)

  **Step 3: The Lakatos Test (Novel Content)**
  *   **Question:** Does the revised prediction ("X will happen by 2030") generate *new* testable claims that the original prediction did not?
  *   **Instruction:** A "rescue" is only scientific if it predicts something *else* we can check *now*, not just the original event at a later date.
      *   *Progressive:* "We missed the date because of friction $F$. Therefore, we should see signature $S$ in the data today."
      *   *Degenerative:* "We missed the date because of friction $F$. Wait another decade."
  *   **Sufficient Answer:** Identification of a specific, observable indicator ($S$) that must be present *today* if the theory is sound, independent of the final outcome.
  *   **Fail Condition:** If the only new prediction is the new date itself, **HAND OFF TO DESK HEAD.** (This is a degenerative shift. Theoretically bankrupt, but may have narrative value.)

  **Step 4: The Cost of Rescue**
  *   **Question:** How many "ad hoc" assumptions have been added to save the theory since the original miss?
  *   **Instruction:** Count the patches. Every time a date moves, did they add a new exception? ("It didn't happen because of the war," then "because of the pandemic," then "because of supply chains".)
  *   **Sufficient Answer:** The number of patches is $\le 1$.
  *   **Fail Condition:** If the theory requires a conspiracy of coincidences to explain the delay, **STOP.** (The protective belt is too thick. Bin it.)

  **Step 5: The Opportunity Cost (Values)**
  *   **Question:** Does keeping this theory alive prevent us from modeling alternative futures?
  *   **Instruction:** This is not a fact question. It is a resource question.
  *   **Sufficient Answer:** A clear statement from the Desk Head on whether the "zombie theory" is crowding out better work.
  *   **Verdict:** **HAND OFF TO DESK HEAD.** (This is a strategic decision, not a scientific one.)

  ---

  ### Application of the Protocol

  Here is the protocol run on three cases. I have been blunt in the assessments because ambiguity is what gets ministers in trouble.

  #### Case 1: Malthusian Population Collapse (1798/1960s Neo-Malthusian variants)
  *   **Prediction:** Population will outrun food supply by date $X$, causing mass famine.
  *   **Step 1 (Separation):**
      *   $T$: Biological reproduction exceeds caloric production capacity.
      *   $A$: Static agricultural technology, static arable land, constant fertility rates.
      *   *Result:* Pass. Mechanism is distinct from assumptions.
  *   **Step 2 (Auxiliaries):**
      *   Did $A$ fail? Yes. The Green Revolution (crop yields) and the Demographic Transition (fertility rates) violated $A$.
      *   *Result:* Pass. The miss was due to auxiliary failure, not core logic failure.
  *   **Step 3 (Novel Content):**
      *   Do Neo-Malthusians predict something new *now*? Some argue for "carrying capacity" limits on specific resources (water, phosphorus) rather than total calories.
      *   *Result:* Borderline. If they pivot to specific resource bottlenecks with measurable thresholds, it is progressive. If they just say "famine later," it is degenerative.
  *   **Step 4 (Cost of Rescue):**
      *   High. Multiple date slips (1900, 1950, 1980, 2000).
  *   **Verdict:** **BIN THE PREDICTION, KEEP THE CONSTRAINT.**
      *   *Advice:* Do not use the theory to predict *dates* of collapse. Use the core mechanism ($T$) as a risk factor for stress-testing supply chains. The specific prediction of inevitable mass famine is degenerative.

  #### Case 2: Global Peak Oil (Hubbert Curves, 1970s–2000s)
  *   **Prediction:** Global conventional oil production will peak by date $X$ and decline irreversibly.
  *   **Step 1 (Separation):**
      *   $T$: Finite reservoir + extraction rate = bell curve.
      *   $A$: Constant price, constant extraction tech, no substitution.
      *   *Result:* Pass.
  *   **Step 2 (Auxiliaries):**
      *   Did $A$ fail? Yes. Price spikes made unconventional oil (fracking, tar sands) economical.
      *   *Result:* Pass.
  *   **Step 3 (Novel Content):**
      *   Did the "Peak Oil" defenders predict the rise of unconventional oil *before* it happened? Generally, no. They mostly moved the peak date.
      *   *Result:* Fail. No novel content generated by the rescue.
  *   **Step 4 (Cost of Rescue):**
      *   Very High. The date has slid right for 50 years. Each slide required assuming "this time the tech won't work," which repeatedly failed.
  *   **Verdict:** **STOP TAKING THIS SERIOUSLY.**
      *   *Advice:* The core logic (finite resource) is true, but the *forecasting model* is degenerative. It absorbs failure without learning. Use it only as a "high price risk" scenario, not a baseline.

  #### Case 3: Commercial Nuclear Fusion (1970s Forecasts)
  *   **Prediction:** Net-energy positive fusion power on the grid by 1990s/2000s.
  *   **Step 1 (Separation):**
      *   $T$: Plasma confinement yields more energy than input.
      *   $A$: Materials science holds, funding remains constant, no regulatory blockers.
      *   *Result:* Pass.
  *   **Step 2 (Auxiliaries):**
      *   Did $A$ fail? Partially. Materials science lagged; funding fluctuated.
      *   *Result:* Pass.
  *   **Step 3 (Novel Content):**
      *   Does the "2035/2040" crowd predict something we can check *today*? They point to Q-factors (energy gain) in experimental reactors. We *can* check this. Recent breakthroughs (NIF, JET) show incremental gains.
      *   *Result:* **Pass (Unexpectedly).** Unlike Peak Oil, fusion research produces incremental, measurable physical data that validates the core mechanism ($T$), even if the engineering ($A$) lags.
  *   **Step 4 (Cost of Rescue):**
      *   Moderate. The date moves, but the physical milestones (ignition, Q>1) are being hit, just slower than expected.
  *   **Verdict:** **KEEP, BUT DOWNGRADE CERTAINTY.**
      *   *Advice:* This is the case you might not like. The procedure suggests this isn't a "degenerative" programme in the Lakatosian sense, because it *is* generating novel physical facts (incremental confinement improvements). It is "right but early" in a way Peak Oil was not.
      *   *Risk:* If you bin this based on the "30 years away" joke, you may be ignoring a genuine progressive research programme. The procedure forces you to admit the science is sound, even if the engineering timeline is garbage.

  ---

  ### Limitations: The Undecidability Clause

  You asked me to be honest about where the machine breaks. Here is where it breaks.

  **1. The "Long Now" Problem**
  Lakatos's distinction between a "progressive" and "degenerative" shift often requires hindsight. A theory can look degenerative for 40 years (no new predictions, just date slips) and then suddenly click when a new technology unlocks the auxiliaries.
  *   **The Limitation:** This procedure cannot distinguish between a "dead end" and a "long gestation" with 100% accuracy from the inside.
  *   **The Frame:** When presenting to the Desk Head, you must say: *"This theory is currently degenerative. It is not generating new testable facts. However, science is non-linear. Binning it reduces our cognitive diversity. I recommend archiving it as 'Low Probability, High Impact' rather than 'False'."*

  **2. The Value of the Narrative**
  Sometimes a theory is scientifically degenerative but politically vital. "Peak Oil" might be a bad model, but if it drives investment in renewables which are *good* policy for other reasons, the theory has instrumental value.
  *   **The Limitation:** Step 5 of the protocol hands this to you. The procedure cannot calculate political utility.
  *   **The Frame:** *"Scientifically, this model is failing. Strategically, it may still be serving a purpose. That is not a call for foresight, but for strategy."*

  **3. The "Right But Early" Trap**
  There is no arithmetic test for "how early is too early." If a prediction misses by 10 years, it's a forecast error. If it misses by 50 years, it's a religion. The boundary is subjective.
  *   **The Limitation:** Step 4 (Cost of Rescue) tries to quantify this, but "counting patches" is itself a judgment call.
  *   **The Frame:** *"We have moved from falsifiable forecasting to faith-based planning. I can model the risk, but I cannot validate the timeline."*

  ### Summary for the Minister

  When you brief the Minister, do not say "The theory is wrong." Say:

  > "The underlying mechanism remains physically possible, but the *timing model* has lost its predictive power. It is no longer generating new evidence to support the delay. We are treating it as a risk factor, not a schedule."

  This protects you if they turn out to be "right but early," and protects the government if they turn out to be "wrong and stubborn." It acknowledges the philosophy without using the jargon.
