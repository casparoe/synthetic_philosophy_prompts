answer: |-
  The legal architecture you describe reveals a sophisticated, albeit often unarticulated, moral psychology. It does not rest on a single monolithic theory but rather on a hybrid of deontological constraints regarding medical agency and a specific, fragmented theory of autonomy.

  Here is a reconstruction of the implicit theory behind these asymmetries, distinguishing between what the practice necessitates and what it merely accommodates, followed by an analysis of how a purely consequentialist framework would alter the law.

  ### 1. The Theory of Killing vs. Letting Die
  The safeguard asymmetry presupposes a **modified Doctrine of Acts and Omissions**, grounded less in the metaphysical sanctity of life and more in the **integrity of medical agency**.

  *   **Moral Status vs. Danger:** The law does not presuppose that active killing is *intrinsically* evil in all contexts (otherwise it would be banned entirely). However, it presupposes that active killing is **presumptively more dangerous to the social and professional order** than letting die.
      *   **The "Cause" of Death:** In treatment refusal, the law constructs the *disease* as the cause of death. The physician is a passive observer of nature. In euthanasia, the *physician* is the cause of death. The safeguards track the risk of corrupting the healer's role.
      *   **Reversibility and Error:** While death is irreversible in both cases, the *decision process* for active killing is viewed as more prone to hidden coercion. A patient refusing treatment can be counseled and potentially persuaded in the moment; a lethal injection, once administered, admits of no second thoughts.
      *   **Conclusion:** The asymmetry presupposes that active killing is **morally distinct** because it implicates the agent (the doctor) in a way that letting die does not. It is treated as "more dangerous" specifically because it erodes the normative boundary against medical homicide, which is viewed as a foundational trust good.

  ### 2. Autonomy and Personal Identity: The "Veto" of the Present Self
  The refusal to honor advance requests for euthanasia (once capacity is lost), while honoring advance refusals of treatment, reveals a specific view of **Personal Identity and Interest**.

  *   **Negative vs. Positive Rights:** The law treats the right to refuse treatment as a **negative right** (bodily integrity) that attaches to the human organism and persists even when the "person" (the psychological agent) has diminished. You cannot touch the body without consent, even if the body belongs to a demented patient.
  *   **The "Experiential" Veto:** Conversely, the law treats a request for euthanasia as requiring **positive authorization** from the *current* psychological self.
      *   **Implicit Theory:** This presupposes that the **competent "then-self" cannot fully represent the interests of the incompetent "now-self"** regarding active death. It assumes that a demented patient may possess "experiential interests" (moments of joy, lack of suffering) that the "then-self" could not anticipate.
      *   **Identity:** The law operates on a **psychological continuity theory** for euthanasia but a **biological continuity theory** for treatment refusal. For refusal, the biological entity's right to be left alone survives the loss of psychology. For euthanasia, the psychological agent must be present to confirm that life is no longer a benefit. The incompetent patient effectively holds a **veto** over their prior competent self's request for death, but not over their prior self's request for non-interference.

  ### 3. Presupposition vs. Consistency
  It is crucial to distinguish what these laws *require* to function logically versus what philosophical positions they happen to align with.

  **What the Practice Strictly Presupposes:**
  1.  **Causal Relevance of Agency:** The law must presuppose that there is a morally relevant difference between a doctor *injecting* a substance and a doctor *withholding* a substance, even if the outcome and intent are identical. Without this, the disparity in safeguards is arbitrary.
  2.  **The Necessity of Contemporaneous Consent for Killing:** The law presupposes that consent for active life-ending is "perishable." It assumes that a prior directive is insufficient to justify the *act* of killing because the current state of suffering cannot be verified retrospectively.
  3.  **Institutional Risk:** The law presupposes that the institutional risk of normalizing active killing is higher than the risk of normalizing treatment refusal.

  **What the Practice is Merely Consistent With (but does not require):**
  1.  **Sanctity of Life:** The system is consistent with the view that life is sacred, but it does not presuppose it. If life were sacred in the absolute sense, euthanasia would be prohibited, not regulated.
  2.  **The Incoherence of the Demented Self:** It is consistent with the view that the demented patient is a "different person," but the law doesn't strictly require this. It only requires that the demented patient's *current welfare* cannot be adequately judged by their past self.
  3.  **Moral Absolutism:** It is consistent with the view that killing is always wrong, but the existence of the legal pathway proves the law accepts exceptions. Therefore, the law presupposes a **threshold deontology** (killing is wrong unless strict conditions are met) rather than absolutism.

  ### 4. The Consequentialist Counterfactual
  If the asymmetry were grounded in a **straightforwardly consequentialist, risk-based picture**, the legal landscape would look radically different. A pure risk model cares about *outcomes* (death, coercion, suffering) and *probabilities*, not the metaphysical distinction between acts and omissions.

  **Required Legal Changes:**

  1.  **Safeguards Would Migrate to the Decision, Not the Method:**
      *   Currently, refusing dialysis requires no waiting period, but euthanasia does. A risk-based model would recognize that refusing dialysis leads to death just as certainly as an injection.
      *   **Change:** High-stakes treatment refusals (those leading inevitably to death) would incur the same waiting periods, psychiatric evaluations, and second opinions as euthanasia. The "act/omission" distinction would vanish from the procedural code.

  2.  **Advance Euthanasia Directives Would Be Permitted:**
      *   Currently, advance directives for euthanasia are rejected because the "now-self" cannot confirm. A risk-based model would ask: *Is the risk of error lower in a well-documented advance directive or in a coerced contemporaneous request?*
      *   **Change:** If the risk of coercion can be mitigated by strict documentation standards (e.g., video recording, notarization while competent), advance euthanasia would be *more* permissible than contemporaneous requests, as the "despair of the moment" risk is eliminated. The law would prioritize the **risk profile of the consent process** over the **temporal proximity of the consent**.

  3.  **Risk-Adjusted Scrutiny:**
      *   Currently, all euthanasia requests get heavy scrutiny. A consequentialist model would vary safeguards based on the specific risk of the case.
      *   **Change:** A terminal cancer patient in visible agony might face fewer hurdles than a chronic pain patient refusing food and water. The safeguards would track the **probability of regret or coercion**, not the **category of the medical act**.

  ### Summary
  The current legal framework presupposes a **deontological constraint on medical agency** (do not kill) that is waived only under conditions of extreme procedural certainty, combined with a **hybrid theory of autonomy** that privileges the biological body's right to non-interference over the psychological self's right to determine the timing of death once capacity is lost.

  It treats killing as **institutionally more corrosive** than letting die, and it treats the **experiential interests of the incompetent present self** as trumping the **critical interests of the competent past self** regarding active death. To shift to a purely consequentialist model would require collapsing the procedural distinction between acting and omitting, and allowing the "then-self" to authorize death if the risk of error could be statistically minimized.
