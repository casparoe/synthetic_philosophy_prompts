      *   *Critique:* Is the "Bottom" item really inert?
      *   *Correction:* "Creeping Generalization" is often a worry, not a research program. A dissertation titled "Why Deflationism Doesn't Imply Quietism about Existence" is often just a defense against an objection, not a positive contribution. It's defensive.
      *   *Student Fit:* Emphasize that she knows sequent calculi. She should be working on *axiomatic theories of truth* (Halbach style) or *substructural approaches to paradox* (Barrio, Cobreros, etc.). This makes the project concrete.
