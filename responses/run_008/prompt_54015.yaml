          5.  **Creeping Generalization.** (Q4 - The Bottom).
      *   *Justification:* For each, address: Worth (downstream impact), Tractability (for *her*), Progress markers.
      *   *Game Changers:* New axiomatic systems, shifts in non-classical semantics (e.g., Humberstone, Restall, Field's recent work), experimental philosophy (maybe less relevant here).
