answer: |-
  It is fascinating that you are tracking these intuitions so carefully, because you have essentially rediscovered a live debate in contemporary moral philosophy regarding the nature of standing to blame. Your gut feeling that something is off even when the blame is correct aligns with the distinction between the correctness of the blame itself and the authority of the person delivering it. You are looking for a principle that unifies your verdicts, and while your initial thought about being in the clear on the same norm is a good start, it is too rigid to handle the nuances you have uncovered, particularly regarding the reformed bully versus the unrepentant one. The alternative view you mentioned near the end, that hypocritical blame carries a false presupposition, is actually a very strong contender and might save most of your verdicts without requiring you to abandon the concept of standing entirely.

  If we adopt the presupposition view, we say that when you blame someone face-to-face, you are implicitly communicating not just that they did wrong, but that you hold yourself to the same standard and are therefore entitled to hold them to it. This explains your lying roommate case perfectly. When he blames you for lying while he lies constantly, the content of his blame is true, but the message he sends about his own moral relationship to you is false. He is claiming a moral authority he does not possess, and that falsity is what makes your skin crawl. This view also handles the trivial hypocrisy case well. When your friend who is five minutes late blames you for being an hour late, the presupposition is not necessarily false because the norms might be scaled to severity. She might be presupposing that we both agree that making someone miss a train is unacceptable, even if she is occasionally tardy for minor things. The stakes are different enough that her claim to authority on the serious offense remains intact.

  However, this view puts pressure on your verdicts regarding the unrepentant bully and the moral nihilist. If standing relies on a true presupposition of shared commitment to the norm, the unrepentant bully who privately thinks bullying is fine is actually in a similar position to your lying roommate. He is enforcing a norm he does not personally endorse. The reason you feel he has standing might be conflating standing with utility. His blame stops the bullying, which is good, but philosophically, many would argue he lacks the moral authority to demand compliance from students if he does not believe the demand is valid. He is acting like a traffic cop who thinks speed limits are stupid but issues tickets anyway. He has institutional authority, but perhaps not moral standing. Similarly, the moral nihilist who thinks morality is made up is presupposing a moral reality she denies exists when she blames someone. If your intuition says she has standing, you might be judging her based on her impeccable behavior rather than her internal commitments. To make your principles consistent, you might have to accept that both the unrepentant bully and the nihilist lack standing, even if their blame is useful or factually correct. This would mean dropping those two intuitions in favor of the lying roommate case, which feels like the strongest core example of the phenomenon.

  The venting case offers a clue about why the face-to-face element matters so much. When the lying roommate complains to a mutual friend about a third party, he is not placing a demand on the wrongdoer. He is not saying to the wrongdoer, I hold you to this standard. He is just gossiping. The false presupposition of authority is only offensive when it is directed at the person being judged, because that is when it disrespects their equality. This suggests standing is primarily about the relationship between the blamer and the blamed, not about the blamer's general right to speak. This saves your intuition that venting feels less bad. It is still annoying, but it does not violate the normative relationship in the same way. Regarding the second-order blame, where someone calls out the roommate for blaming without standing, this does not spiral forever. You do not need perfect standing to point out a lack of standing. Calling out hypocrisy is a meta-claim about the conversation, not a first-order moral demand. It is like pointing out that a referee is biased. You do not need to be a referee to notice the bias. So you can safely keep the intuition that second-order blame is fine.

  Applying this to your father case, the verdict depends entirely on his current relationship to the norm. If your father did exactly what you are doing at your age and never told you, and he still believes what he did was acceptable or continues to do it secretly, he lacks standing. He is presupposing a standard he does not meet, much like the lying roommate. It would be an assertion of superiority that is unearned. However, if he has repented, meaning he acknowledges he was wrong, feels regret, and has committed to the norm he is now enforcing, his standing is restored. This aligns with your reformed bully case. Repentance repairs the false presupposition because he can now honestly say, I hold myself to this standard now, even if I failed in the past. The key is not perfection, but current commitment and honesty about past failures.

  So, to answer your question about which verdict to drop, I would suggest letting go of the intuition that the unrepentant bully has standing. It is the outlier that conflicts with the lying roommate case. If the roommate lacks standing because he violates the norm he enforces, the bully who thinks the norm is invalid also lacks standing, even if he happens to be behaving well currently. Behavior alone is not enough; there must be an endorsement of the value behind the blame. Your presupposition view is the best framework you have proposed because it explains why face-to-face blame feels different from venting and why trivial hypocrisy is forgivable. It locates the wrongness not in the act of blaming itself, but in the misleading claim of moral authority that accompanies it. If you accept that, you can keep most of your list, tidy up the bully and nihilist cases to match the roommate, and feel confident that calling out your father is permissible only if he has truly made peace with the norm he is using against you.
