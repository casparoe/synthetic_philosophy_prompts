answer: |-
  Yes, there is an established name for this, but it requires unpacking because the phenomenon operates on two levels: the *historical* level (how the story is told) and the *philosophical* level (the method used to tell it).

  The broad historical term is **Whig History of Philosophy**.
  The specific methodological tool used to achieve it is **Rational Reconstruction**.

  However, neither of these fully captures the specific rhetorical move you identified: the claim that predecessors weren't *wrong*, but *confused* about their own activity. For that specific flavor, I will offer a refinement at the end. But first, let's look at the established literature, because scholars like Quentin Skinner, Imre Lakatos, and Richard Rorty have mapped this terrain precisely.

  ### 1. The Established Names

  **Whig History of Philosophy**
  Derived from Herbert Butterfield's *The Whig Interpretation of History* (1931), this term describes history written from the perspective of the present, treating the past as a necessary prelude to current enlightenment. In philosophy, it manifests as the narrative that "we have finally solved the problems they were struggling with." It creates the illusion of progress by filtering out dead ends and framing past errors as stepping stones rather than alternative worlds.

  **Rational Reconstruction (vs. Historical Reconstruction)**
  Imre Lakatos and Richard Rorty distinguished between two ways of treating past philosophy:
  *   **Historical Reconstruction:** Trying to understand what the philosopher *actually meant* in their own context (the historian's job).
  *   **Rational Reconstruction:** Reinterpreting past arguments to make them as logically robust as possible, often using modern tools the original author didn't have (the philosopher's job).

  The pattern you notice occurs when a new generation performs a **Rational Reconstruction** of the past but *claims* it is a **Historical Reconstruction**. They say, "Kant was *really* trying to do what we are doing, he just lacked the tools." This allows them to claim Kant's authority while dismissing his actual conclusions as "muddled."

  **Quentin Skinner's "Mythologies"**
  In his seminal paper *"Meaning and Understanding in the History of Ideas"* (1969), Skinner identified specific fallacies that generate this illusion. Two are relevant to you:
  *   **The Mythology of Prolepsis:** Attributing significance to a thinker based on later developments (e.g., "Hobbes anticipated game theory").
  *   **The Mythology of Coherence:** Ironing out a thinker's contradictions to make them look like a systematic precursor to current views.

  ### 2. Harmless Tidying vs. Load-Bearing Tidying

  You asked what separates legitimate clarification from the "load-bearing" kind that manufactures progress. The literature suggests a specific boundary condition: **Counterfactual Acceptance.**

  **Harmless Tidying (Charitable Reconstruction)**
  *   **Definition:** Clarifying ambiguities, fixing obvious slips, or formalizing informal arguments *in a way the original author would recognize and accept* if they were brought to the present.
  *   **Test:** If you showed your reconstruction to the historical philosopher, would they say, "Yes, that is what I was trying to say, you've said it better"?
  *   **Example:** Translating Aristotle's *energeia* into modern modal logic terms to clarify a specific argument, while acknowledging Aristotle didn't have modal logic.

  **Load-Bearing Tidying (Whiggish Distortion)**
  *   **Definition:** Redefining the *goal* or *subject matter* of the predecessor so that their failure necessitates your new method. This is the "you were confused, not wrong" move.
  *   **Test:** If you showed your reconstruction to the historical philosopher, would they say, "No, that is not my project at all"?
  *   **Example:** The Logical Positivists claiming that Hegel wasn't doing metaphysics but was actually making confused empirical claims. Hegel would vehemently deny this. The Positivists *needed* him to be making empirical claims so they could verify/falsify him. If he was doing something else, their verification principle couldn't touch him.

  **The Boundary:** The line is crossed when the reconstruction changes the **criteria of success**. If the new generation judges the old generation by standards the old generation explicitly rejected, it is load-bearing tidying.

  ### 3. Does it Matter if the New Generation is Right?

  This is the thorniest question. The short answer is: **Structurally, no. Epistemically, yes.**

  **Structurally (The Rhetoric):**
  Thomas Kuhn, in *The Structure of Scientific Revolutions*, argued that after a paradigm shift, textbooks rewrite history to make the transition look cumulative. This happens *regardless* of whether the new paradigm is "true." The Logical Positivists wrote Whig history. The Ordinary Language philosophers wrote Whig history *against* them. The structure is identical. The appearance of progress is an artifact of the narrative form, not necessarily the content.

  **Epistemically (The Truth):**
  If the new generation is "right" (e.g., modern medicine vs. humoral theory), the Whig history feels justified because the practical outcomes work. If the new generation is later proven "wrong" (e.g., Logical Positivism itself), the Whig history looks like distortion.

  **The Trap:** We are always inside our own paradigm. We cannot know if we are the "modern medicine" or the "Logical Positivists" of the future. Therefore, relying on the *truth* of the current generation to justify the *history* is circular. The "load-bearing tidying" is suspicious precisely because it insulates the current generation from criticism: if the past was just "confused," then the current "clarity" is immune to the same charge.

  ### 4. A Proposed Term: "The Diagnostic Displacement"

  While "Whig History" covers the general progress narrative, it doesn't fully capture the specific move you described: *reclassifying the predecessor's errors from "falsehoods" to "category mistakes."*

  I propose calling this specific rhetorical maneuver **The Diagnostic Displacement**.

  **Definition:** A historiographical move where a new philosophical generation secures its own authority not by refuting the substantive claims of the previous generation, but by diagnosing the previous generation as suffering from a *meta-philosophical confusion* that only the new generation can cure.

  **Why it differs from standard Whig History:**
  Standard Whig history says: "They were wrong, we are right."
  Diagnostic Displacement says: "They weren't even playing the same game; we are defining the game."

  **Boundary Cases (Genuine Progress vs. Illusion):**

  | Case | Description | Verdict |
  | :--- | :--- | :--- |
  | **Genuine Progress** | **Formalization of Intuition.** The new generation provides a formal language for insights the old generation had but couldn't express. The old generation would *agree* this clarifies their intent. | **Legitimate.** (e.g., Using set theory to clarify Frege's logic). |
  | **Illusion (Diagnostic Displacement)** | **Methodological Supersession.** The new generation claims the old questions were "pseudo-problems" generated by bad methods. The old generation would *reject* the dissolution of their questions. | **Illegitimate.** (e.g., Positivists claiming metaphysics is meaningless). |
  | **Grey Area** | **Expressive Rationality.** (Robert Brandom's term). The new generation makes explicit what was implicit in the old. It changes the practice, but claims continuity. | **Debatable.** Depends on whether the "explicitation" alters the normative commitments. |

  ### 5. Summary

  The pattern you see is **Whig History of Philosophy**, executed via **Rational Reconstruction** that violates **Quentin Skinner's constraint on prolepsis**.

  The specific "you were confused, not wrong" move is a **Diagnostic Displacement**. It manufactures progress by shifting the ground of evaluation: the past is judged not by whether it achieved *its* goals, but by whether it achieved *ours*.

  **How to spot the load-bearing kind:**
  Ask: "Does this retelling make the previous generation's *own* criteria of success impossible to meet?"
  *   If yes: It's an illusion of progress (Diagnostic Displacement).
  *   If no: It's likely legitimate clarification.

  The reason it bugs you is that it is a **self-sealing narrative**. By framing the past as "confused," the present immunizes itself against the charge of confusion. Recognizing this pattern is the first step toward writing history that treats the past as a foreign country rather than a draft of the present.
