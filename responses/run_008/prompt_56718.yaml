  Here is the breakdown of Maya's classification algorithm, your predictions, and the strategy for Friday.

  ### 1. The Maya Algorithm
  Based on her track record, Maya isn't using a strict dictionary definition of lying (asserting a falsehood). She is running a **Deceptive Intent + Contextual Uptake** rule.

  **The Core Rule:**
  An utterance counts as **Lying** or **Misleading** only if the speaker **intends to induce a false belief** in the listener within a **context that expects truthfulness.**

  *   **Lying:** The statement is false + Speaker knows it's false + Intent to deceive. (The *Girlfriend* case).
  *   **Misleading-but-not-lying:** The statement is technically true + Speaker knows it creates a false impression + Intent to deceive. (The *Leftovers* and *Relationship* cases).
  *   **Neither:**
      *   **Sincere Error:** Speaker believes the statement is true. (The *Tour Guide* case).
      *   **Non-Truth Context:** The social context signals that truth is not the goal (e.g., entertainment, banter), so there is no "intent to deceive" because deception isn't on the table. (The *Fishing Story* case).

  **Key Insight:** Maya cares more about the *manipulation of the listener's mind* than the truth value of the sentence. However, she also requires that the listener *could* reasonably be deceived (ruling out the fishing story).

  ---

  ### 2. The Four Predictions

  **Case 1: The Gambler ("I quit gambling" / Never gambled)**
  *   **Prediction:** **Lying.**
  *   **Why:** This is a direct falsehood asserted to create a false impression of character. It matches the *Girlfriend* case perfectly. He knows it's false, and he wants the date to believe the opposite.

  **Case 2: The Surprise Party ("Yes, hiding in kitchen" / True, said as joke)**
  *   **Prediction:** **Misleading-but-not-lying.**
  *   **Why:** This is the structural twin of the *Leftovers* and *Relationship* cases. The words are true, but the intended takeaway ("There is no party") is false.
  *   **The Nuance:** You might worry this overlaps with the *Fishing Story* (absurd claim), but the *intent* is different. The fisherman wanted entertainment; the party planner wants concealment. Maya's rule prioritizes Intent.

  **Case 3: The Supplement Seller ("Improves focus" / No idea if true)**
  *   **Prediction:** **Lying.**
  *   **Why:** This is the bridge between the *Tour Guide* and the *Girlfriend*. The Tour Guide was *sincere*; the Seller is *indifferent*. In gossip ethics, asserting something as fact without believing it (often called "bullshitting") is functionally treated as lying because the speaker is prioritizing effect over truth. He lacks the "Sincere Error" defense.

  **Case 4: The Late Arrival ("5 minutes" / Knows it's 20)**
  *   **Prediction:** **Lying.**
  *   **Why:** It is a known falsehood told to manage the listener's expectations.
  *   **The Risk:** This is a "social lubricant" lie. However, since Maya classified the *Girlfriend* status lie as Lying (rather than a social white lie), she likely treats concrete factual claims about time/status strictly.

  ---

  ### 3. Rival Rules (And Where They Diverge)

  There are two other rules that fit her past data but would change your Friday predictions.

  **Rival A: The "Strict Truth-Conditional" Rule**
  *   **Logic:** Lying = False Statement. Misleading = True Statement. Neither = Honest Mistake or Joke.
  *   **Fit:** Explains *Girlfriend* (Lying), *Leftovers* (Misleading), *Tour Guide* (Neither).
  *   **Divergence:** It struggles with the *Fishing Story* (False statement, but she said Not Lying). To make this work, you have to assume she classifies the fishing story as "Neither" because it's a "Joke," not because of truth conditions.
  *   **Impact on New Cases:** Under this rule, **Case 2 (Party)** is definitely **Misleading** (True statement). **Case 3 (Supplements)** becomes ambiguous: if the supplement *does* work, it's technically True (Misleading/Neither), if it doesn't, it's Lying. Maya's verdict relies on his *belief*, not the reality, so this rule fails Case 3.

  **Rival B: The "Successful Deception" Rule**
  *   **Logic:** It's only Lying/Misleading if the listener is actually capable of being fooled.
  *   **Fit:** Explains *Fishing Story* (Nobody believed = Not Lying). Explains *Tour Guide* (Listeners believed, but she didn't intend deceit = Neither).
  *   **Divergence:** This rule threatens **Case 2 (Party)**. If the honoree is "supposed" to know it's a joke (because it's absurd), then they aren't truly being deceived. If Maya leans heavily on the *Fishing* precedent, she might call Case 2 "Neither" because the claim is too absurd to be believed.
  *   **Impact on New Cases:** This is the biggest threat to your prediction on Case 2.

  ---

  ### 4. The Wobble Case
  **Case 2 (The Surprise Party)** is the one most likely to make Maya hesitate or contradict herself.

  **Why:** It sits directly on the fault line between her *Leftovers* precedent (True words, deceptive intent = Misleading) and her *Fishing* precedent (Absurd words, no serious uptake = Neither).
  *   If she focuses on the **Intent** (she wants the honoree to think there's no party), it's **Misleading**.
  *   If she focuses on the **Method** (using an obvious joke), it risks falling into the **Fishing** bucket of **Neither**.

  Watch her face when you describe the "hiding in the kitchen" line. If she laughs, she's thinking *Fishing Story*. If she nods seriously, she's thinking *Leftovers*.

  ---

