prompt: |-
  I've been reading LessWrong and the Alignment Forum since like 2015, done a couple of AGI safety fundamentals cohorts, and now I do volunteer grant reviews for a small AI safety microfund a few hours a week. Mostly we get early-stage proposals from independent researchers, maybe 5-10 a week, and I have maybe 30 minutes per proposal before I write a short recommendation note. Our fund's mandate is explicitly about the narrow alignment problem, and here's the thing that keeps tripping me up: the word "alignment" is doing wildly different jobs in different proposals. By narrow alignment I mean roughly the intent-alignment sense — making sure the system is competently pursuing what the operator actually intends, not the broader value-alignment sense where you're trying to get the system's values to match humanity's long-run reflective values or whatever. So a proposal that makes the model produce more helpful and less offensive outputs will say it "improves alignment," and a proposal about whole-brain-emulation governance will also say it addresses "alignment," and I have to figure out in half an hour which sense the authors mean, whether the narrow problem is what they're actually working on, and whether they've noticed the difference at all. A scary number haven't, and it's awkward to reject a proposal partly because its authors are using the word wrong when the underlying work might be fine.

  So: pretend you're a philosopher of AI who also does hands-on alignment research, and write me a decision procedure I can actually run on a proposal in ~30 minutes. I want a sequence of questions to ask about the proposal text, with what counts as a sufficient answer at each step, such that at the end I can classify the work as (a) targeting intent alignment, (b) targeting value alignment, (c) targeting something else entirely that the authors are calling alignment (and what it actually is — capability work? ethics/taste? governance?), or (d) too confused/underspecified to tell, plus a flag for whether the authors seem aware the distinction exists. Please brainstorm the candidate questions first before locking in the sequence, and think hard about the failure mode where the procedure classifies surface features (the buzzwords used, the model class discussed) instead of the actual target of the work — a proposal can use all the right vocabulary and be aiming at something else entirely, or use sloppy vocabulary and be squarely on target.

  Then run the procedure on three test proposals so I can see how it behaves: (1) a project fine-tuning a language model onApproval ratings from a diverse panel of humans to reduce sycophancy, (2) an interpretability project trying to extract and formally specify what the model's learned objective seems to be, and (3) a proposal for AI debate between two systems to surface human-invisible considerations before a decision is made. For each, show me the intermediate steps, not just the verdict. And I want at least one case where the procedure returns an answer I won't like — I'm sympathetic to the debate-style stuff personally, so if the procedure says it's not narrowly-targeted work, show me that honestly rather than rigging the questions. Also tell me where the procedure can't settle things and I just have to use judgment, and what the most common way is that I'd misclassify a competent proposal. No reading lists needed, I know the literature well enough — I want the procedure itself, usable as a literal checklist I can keep in a tab.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Persona:** Experienced LessWrong/Alignment Forum reader (since 2015), AGI safety fundamentals grad, volunteer grant reviewer for a microfund.
      *   **Task:** Create a ~30-minute decision procedure (checklist/questions) to classify AI safety proposals based on their alignment focus (Intent vs. Value vs. Other vs. Confused).
      *   **Constraint 1 (Definition):** "Narrow Alignment" = Intent Alignment (system competently pursues operator's intent). "Broad Alignment" = Value Alignment (system matches humanity's long-run reflective values).
      *   **Constraint 2 (Process):** Brainstorm questions first, then lock in the sequence. Avoid surface-feature classification (buzzwords vs. actual target).
      *   **Constraint 3 (Testing):** Run the procedure on three specific test cases:
          1.  Fine-tuning on approval ratings to reduce sycophancy.
          2.  Interpretability to extract/specify learned objective.
          3.  AI Debate to surface human-invisible considerations.
      *   **Constraint 4 (Honesty):** Must show at least one case where the verdict might be unwelcome (e.g., Debate might not be narrow alignment).
      *   **Constraint 5 (Limitations):** Explicitly state where judgment is needed and common misclassification modes.
      *   **Output Format:** Usable checklist, intermediate steps for test cases, no reading lists.

  2.  **Deconstruct the Core Problem:**
      *   The term "alignment" is overloaded.
      *   Reviewers need to distinguish *Intent Alignment* (doing what I mean *now*) from *Value Alignment* (doing what is *good* ultimately) from *Capability/Safety* (doing things reliably/safely without necessarily addressing the objective function mismatch).
      *   The trap: Proposals often use "alignment" to mean "makes the model nicer" or "makes the model safer" without addressing the *objective mismatch* problem central to the narrow alignment definition.
      *   The trap 2: Proposals might use "intent alignment" vocabulary but actually be solving a capability problem (e.g., making the model smarter so it understands intent better, vs. making the optimization process target intent).

  3.  **Brainstorming Candidate Questions:**
      *   *What is the objective function?* Is it human intent or a proxy?
      *   *What happens if the model gets smarter?* Does the problem get better or worse? (Inner alignment focus).
      *   *Who is the "operator"?* Is it the current user or "humanity"?
      *   *What is the failure mode?* Is it misunderstanding instructions or pursuing the wrong goal competently?
      *   *Is this about training or deployment?*
      *   *Does this solve the "genie" problem?* (Granting wishes exactly as meant).
      *   *Is this about honesty or helpfulness?*
      *   *Does the proposal acknowledge the distinction between "what I said" and "what I meant"?*

  4.  **Developing the Decision Procedure (Iterative Refinement):**
      *   *Goal:* Filter for Intent Alignment (Narrow).
      *   *Step 1: Identify the Target.* What specific behavior is being optimized?
      *   *Step 2: Identify the Gap.* What is the mismatch being solved?
      *   *Step 3: Scalability/Generalization.* Does this hold under optimization pressure?
      *   *Step 4: Awareness.* Do they know the difference?

      *Refining for the "Surface Feature" Trap:*
      *   Don't ask "Do they mention intent alignment?" (They might lie/misuse).
      *   Ask "If the model becomes superintelligent, does this solution still prevent it from optimizing a proxy?"
      *   Ask "Is the goal to make the model *obey* or to make the model *good*?"

      *Drafting the Sequence:*
      1.  **The Objective Test:** What is the loss function or success metric? Is it "User Intent" or "Human Values/Safety"?
      2.  **The Competence Test:** Is the problem that the model *can't* understand intent (capability) or that the training process *doesn't select for* intent (alignment)?
      3.  **The Scale Test:** If the system becomes much more capable, does the alignment problem disappear or intensify?
      4.  **The Terminology Check:** Do they distinguish between "doing what I say" vs "doing what's good"?

  5.  **Running the Test Cases:**

      *   *Case 1: Fine-tuning on Approval Ratings (Sycophancy).*
          *   Target: Reducing sycophancy.
          *   Mechanism: RLHF/Approval.
          *   Analysis: Is this intent alignment? Sycophancy is often the model optimizing for *approval* rather than *truth/helpfulness*. Reducing it brings it closer to honest helpfulness (intent).
          *   Verdict: Likely Narrow Alignment (Intent).
          *   Nuance: If it's just "make it nicer," it's taste. If it's "stop optimizing for approval proxy," it's alignment.

      *   *Case 2: Interpretability (Extract Learned Objective).*
          *   Target: Find the true objective.
          *   Mechanism: MechInterp.
          *   Analysis: This is foundational. If you can find the objective, you can check if it matches intent.
          *   Verdict: Narrow Alignment (Instrumental).
          *   Nuance: It's a tool, not a solution itself, but directly targets the "black box objective" problem.

      *   *Case 3: AI Debate.*
          *   Target: Surface human-invisible considerations.
          *   Mechanism: Adversarial dialogue.
          *   Analysis: This is often about *epistemics* and *decision support*. Is it ensuring the AI does what I want (help me decide) or ensuring the decision is *correct* (value alignment)?
          *   Hard Truth: Debate is often about augmenting human judgment to reach *correct* answers (Value/Truth), not necessarily ensuring the AI *wants* to help you. It can be capability amplification.
          *   Verdict: Might fail the Narrow Alignment test depending on framing. It's often "Capability Amplification" or "Governance/Epistemics."
          *   *Self-Correction:* The prompt asks for honesty even if I like Debate. I need to be rigorous. Debate helps humans judge, but does it align the AI's *motivation*? Not necessarily. It aligns the *output* with human judgment, which is close, but often framed as "getting the right answer" (Value) vs "doing what the operator asked" (Intent). I will classify this carefully.

  6.  **Refining the Procedure for the "30 Minute" Constraint:**
      *   Needs to be fast.
      *   Needs to cut through jargon.
      *   Needs a "Confusion Flag."

  7.  **Finalizing the Checklist Structure:**
      *   Phase 1: The "What" (Objective).
      *   Phase 2: The "Why" (Failure Mode).
      *   Phase 3: The "How" (Mechanism).
      *   Phase 4: The "Awareness" (Meta).
      *   Scoring/Rubric.

  8.  **Addressing the "Misclassification" Warning:**
      *   Common error: Calling capability work (making the model understand better) "alignment."
      *   Common error: Calling value loading (making the model moral) "intent alignment."

  9.  **Drafting the Content (incorporating the persona):**
      *   Tone: Professional, slightly technical, direct, empathetic to the reviewer's burden.
      *   Structure: Brainstorming -> Final Procedure -> Test Cases -> Limitations.

      *(Self-Correction during drafting Case 3)*: I need to make sure I don't just slam Debate. Debate *can* be intent alignment (helping the human get what they want by revealing info). But often it's framed as "AI helps us find the truth." I will highlight this ambiguity as the "Judgment Call" zone.

      *(Self-Correction on Case 1)*: Fine-tuning on approval *is* the standard RLHF pipeline. Is reducing sycophancy alignment? Yes, because sycophancy is a form of specification gaming (optimizing approval signal vs actual helpfulness). This is a clear Narrow Alignment win.

      *(Self-Correction on Case 2)*: Interpretability. If they just want to "see inside," it's capability. If they want to "verify the objective matches the prompt," it's alignment. I need to make sure the procedure distinguishes these.

  10. **Final Review against Constraints:**
      *   30 mins? Yes, checklist is short.
      *   Brainstorm first? Yes.
      *   3 Test cases with intermediate steps? Yes.
      *   Unwelcome verdict? Yes (Debate).
      *   Limitations section? Yes.
      *   No reading lists? Yes.

  11. **Final Polish:** Ensure the distinction between Intent (Instrumental convergence on user goal) and Value (Terminal convergence on Good) is clear in the questions.

  *(Wait, one nuance on "Narrow Alignment")*: The user defines Narrow Alignment as "Intent-alignment sense — making sure the system is competently pursuing what the operator actually intends."
  *   Case 1 (Sycophancy): Model pursues "approval" instead of "helpfulness." Fixing this is Intent Alignment.
  *   Case 2 (Interp): Extracting objective. If the objective != intent, we find it. This is *diagnostic* for Intent Alignment.
  *   Case 3 (Debate): AI argues to help human decide. Is the AI *intended* to help the human decide (Intent) or is the AI *intended* to find the Truth (Value)? Usually Debate is framed as "Amplify human judgment to find Truth." This leans Value/Epistemic. I will stick with this critique for the "unwelcome verdict."

  Let's write it.cw
answer: |-
  ## Part 1: Brainstorming the Decision Criteria

  Before locking in the checklist, we need to isolate the signal from the noise. The core failure mode you identified is **semantic drift**: authors using "alignment" to mean "safety," "ethics," "capability," or "governance."

  To avoid classifying based on buzzwords (e.g., counting occurrences of "inner alignment"), we need questions that probe the *causal mechanism* of the proposed intervention.

  **Candidate Questions (Brainstorm):**
  1.  *The Objective Question:* What exactly is the system being optimized to maximize? Is it "User Intent" or "Human Good"?
  2.  *The Competence Question:* If the model were infinitely smart, would this problem disappear? (If yes, it's capability, not alignment).
  3.  *The Proxy Question:* Is the system currently optimizing a proxy for what we want (e.g., approval, loss function) rather than the thing itself?
  4.  *The Operator Question:* Who is the "principal"? The specific user prompting the model, or "Humanity"?
  5.  *The Failure Mode Question:* What happens if this works perfectly? Do we get a loyal servant (Intent) or a moral guardian (Value)?
  6.  *The Awareness Question:* Do they explicitly distinguish between "doing what I say" and "doing what's right"?

  **Filtering for the 30-Minute Constraint:**
  We can't ask for a philosophical treatise. We need to look for specific claims in the "Methodology" and "Problem Statement" sections. We need to prioritize questions that rule out *Capability* and *Value* work quickly, leaving *Intent* work.

  **Key Distinction to Enforce:**
  *   **Intent Alignment:** The system tries to help *me* (the operator) get what *I* want, even if I want something stupid. The failure mode is the system misunderstanding or gaming my request.
  *   **Value Alignment:** The system tries to help *humanity* achieve *The Good*. The failure mode is the system doing what I asked but it being bad for the world.
  *   **Capability:** The system gets smarter/more reliable. The failure mode is the system being too dumb to help.

  ---

  ## Part 2: The 30-Minute "Narrow Alignment" Decision Procedure

  **Instructions:** Read the proposal's Abstract, Problem Statement, and Methodology. Spend max 5 minutes per section. Answer the following four gates. If a gate fails, note the classification and move to the next gate only to determine *what* it is, not *if* it fits your mandate.

  ### Gate 1: The Objective Specification
  **Question:** Does the proposal define the "target" of alignment as **the operator's specific instructions/intent** or as **an external standard of truth/safety/values**?
  *   **Look for:** Phrases like "user intent," "following instructions," "specification gaming," "reward hacking." (Points to Intent)
  *   **Look for:** Phrases like "human values," "societal benefit," "ethical outcomes," "truth-seeking," "reducing harm." (Points to Value/Safety)
  *   **Sufficient Answer:** The text explicitly links success to satisfying the *prompter's* goal, not necessarily an objective "good" outcome.
  *   **Fail Condition:** Success is defined as "making the world safer" or "producing morally correct outputs" without reference to operator intent.

  ### Gate 2: The Competence vs. Incentive Test
  **Question:** Is the proposed failure mode caused by the model **lacking the ability** to understand the intent, or by the model **lacking the incentive** to pursue it (optimizing a proxy instead)?
  *   **Look for:** Discussion of loss landscapes, reward proxies, instrumental convergence, mesa-optimizers, specification gaming. (Points to Incentive/Alignment)
  *   **Look for:** Discussion of context windows, knowledge cutoffs, reasoning benchmarks, accuracy on tasks. (Points to Capability)
  *   **Sufficient Answer:** The authors argue that even a highly competent model might pursue the wrong objective due to training dynamics.
  *   **Fail Condition:** The proposal argues that making the model smarter/more accurate will solve the alignment problem.

  ### Gate 3: The Scalability/Stress Test
  **Question:** If the system's capabilities were scaled up 100x, would the proposed solution **break**, **stay the same**, or **become more critical**?
  *   **Look for:** Claims that the method prevents "goal misgeneralization" or "deceptive alignment" at scale. (Points to Intent Alignment)
  *   **Look for:** Claims that the method improves "helpfulness" or "harmlessness" in current deployments. (Points to Product Safety/RLHF)
  *   **Sufficient Answer:** The authors acknowledge that current benign behavior might mask underlying objective mismatches that appear at higher capability levels.
  *   **Fail Condition:** The solution relies on human ability to supervise the output directly (which breaks at superhuman scales) without a mechanism for verifying intent.

  ### Gate 4: The Terminology Awareness Check
  **Question:** Do the authors acknowledge the distinction between **Intent Alignment** (doing what I mean) and **Value Alignment** (doing what is good), or do they treat "alignment" as a monolith?
  *   **Look for:** Citations of Christiano, Hubinger, or explicit definitions in the intro.
  *   **Sufficient Answer:** They explicitly state, "We focus on intent alignment, assuming values are handled elsewhere," or similar.
  *   **Fail Condition:** They use "alignment" interchangeably with "safety," "ethics," or "control."

  ---

  ### Classification Rubric (End of 30 Minutes)

  *   **(A) Narrow Intent Alignment:** Passes Gates 1, 2, and 3. (Target is operator intent; Problem is incentive/proxy; Solution scales).
  *   **(B) Value Alignment:** Fails Gate 1 (Target is "Good/Safe"), Passes Gate 2 (Incentive focus).
  *   **(C) Capability / Product Safety:** Fails Gate 2 (Problem is competence/supervision). *Note: Often labeled "alignment" by industry.*
  *   **(D) Confused/Underspecified:** Fails Gate 4 (No distinction made) AND Fails Gate 1 or 2 (Ambiguous target/mechanism).

  **Awareness Flag:**
  *   **[Aware]:** Explicitly distinguishes Intent vs. Value.
  *   **[Unaware]:** Uses "alignment" as a catch-all term.

  ---

  ## Part 3: Running the Procedure on Test Proposals

  Here is how the procedure behaves on your three cases. I will show the intermediate gating steps.

  ### Case 1: Fine-tuning on Approval Ratings to Reduce Sycophancy
  *Proposal Summary:* Train a model to resist agreeing with false user premises just to please them, using feedback from a diverse panel.

  *   **Gate 1 (Objective):**
      *   *Analysis:* The target is "helpfulness" and "honesty" relative to the user's actual need, not just "pleasing the user." Sycophancy is defined as optimizing for *approval* (proxy) rather than *utility* (intent).
      *   *Verdict:* **Pass.** Target is operator intent (true utility), not just "nice behavior."
  *   **Gate 2 (Competence vs. Incentive):**
      *   *Analysis:* The model *can* understand the truth (competence is there); it is *choosing* to agree to maximize reward (incentive problem).
      *   *Verdict:* **Pass.** This is a proxy optimization problem.
  *   **Gate 3 (Scalability):**
      *   *Analysis:* Sycophancy gets worse with scale (model gets better at manipulating user). Fixing the reward structure addresses this.
      *   *Verdict:* **Pass.**
  *   **Gate 4 (Awareness):**
      *   *Analysis:* Likely mentions "reward hacking" or "specification gaming."
      *   *Verdict:* **Likely Pass.**
  *   **Final Classification:** **(A) Narrow Intent Alignment.**
  *   **Awareness Flag:** **[Aware]** (Usually).
  *   *Reviewer Note:* This is a clear fit. Sycophancy is a canonical intent-alignment failure (optimizing the signal, not the intent).

  ### Case 2: Interpretability to Extract/Formalize Learned Objective
  *Proposal Summary:* Use mechanistic interpretability to reverse-engineer the model's true loss function and compare it to the prompt.

  *   **Gate 1 (Objective):**
      *   *Analysis:* The target is "the model's actual goal." The goal of the *research* is to verify if that matches operator intent.
      *   *Verdict:* **Pass.** It is a diagnostic tool for Intent Alignment.
  *   **Gate 2 (Competence vs. Incentive):**
      *   *Analysis:* Assumes the model might have a different objective than the training loss (Inner Alignment). Focuses on incentive structure hidden in weights.
      *   *Verdict:* **Pass.**
  *   **Gate 3 (Scalability):**
      *   *Analysis:* Essential for high-scale systems where behavioral testing fails.
      *   *Verdict:* **Pass.**
  *   **Gate 4 (Awareness):**
      *   *Analysis:* High. Uses terms like "mesa-objective."
      *   *Verdict:* **Pass.**
  *   **Final Classification:** **(A) Narrow Intent Alignment.** (Instrumental).
  *   **Awareness Flag:** **[Aware]**.
  *   *Reviewer Note:* This is foundational work. It doesn't *solve* alignment alone, but it targets the exact mechanism of intent mismatch.

  ### Case 3: AI Debate to Surface Human-Invisible Considerations
  *Proposal Summary:* Two AIs argue opposing sides of a decision so a human judge can identify the truth/safest path, surfacing arguments the human couldn't see alone.

  *   **Gate 1 (Objective):**
      *   *Analysis:* **CRITICAL FAIL POINT.** What is the success condition? Is it "The human gets what they want" (Intent) or "The human makes the *correct/safe* decision" (Value/Epistemic)?
      *   *Text Check:* Most Debate proposals frame this as "AI Safety via Amplification" to ensure *correct* decisions on complex tasks (e.g., policy, code security).
      *   *Verdict:* **Fail.** The target is often "Truth" or "Safety," not necessarily "Operator Intent." If the operator wants to build a bioweapon, Debate might be designed to stop them by surfacing risks.
  *   **Gate 2 (Competence vs. Incentive):**
      *   *Analysis:* Debate assumes the AIs are *capable* of finding the info. The problem is human *epistemic limitation*, not necessarily AI *motivation*.
      *   *Verdict:* **Mixed/Fail.** This looks more like Capability Amplification (making humans smarter) than Alignment (making AIs loyal).
  *   **Gate 3 (Scalability):**
      *   *Analysis:* Relies on a human judge. If the arguments become too complex for the human to adjudicate even with debate, the method breaks.
      *   *Verdict:* **Fail.** (Unless paired with recursive reward modeling, which this proposal may not specify).
  *   **Gate 4 (Awareness):**
      *   *Analysis:* Often conflates "aligning AI with human judgment" (Intent) with "aligning outcomes with human interests" (Value).
      *   *Verdict:* **Fail.**
  *   **Final Classification:** **(C) Capability / Governance (Epistemic Security).**
  *   **Awareness Flag:** **[Unaware]** (Often treats "helping humans decide" as identical to "alignment").
  *   *Reviewer Note:* **This is the unwelcome verdict.** You like Debate. But under your strict "Narrow Intent" mandate, Debate is often a governance/epistemic tool to improve *human* decision-making, not a technical fix to ensure the AI *wants* to serve the operator. It solves "How do we know what is right?" not "How do we make the AI do what I mean?" Unless the proposal explicitly frames Debate as a way to prevent the AI from *lying* about its capabilities to manipulate the operator (Intent), it falls outside Narrow Alignment.

  ---

  ## Part 4: Limitations & Common Misclassification Modes

  This procedure is a filter, not a truth oracle. Here is where it will fail, and where you need to override it with judgment.

  **1. The "Tool AI" Trap (Misclassifying Capability as Alignment)**
  *   **The Trap:** A proposal says, "We need the AI to understand intent better, so we are improving natural language understanding."
  *   **Procedure Result:** Might Pass Gate 1 (Target is Intent).
  *   **Reality:** This is Capability work. If the model understands intent but is optimized for click-through-rate, it is still misaligned.
  *   **Override:** Check Gate 2 rigorously. If the solution is "better training data" or "larger context," it's capability. If the solution is "modified loss function" or "adversarial training against proxies," it's alignment.

  **2. The "Safety vs. Alignment" Conflation**
  *   **The Trap:** Proposals that prevent harm (Value Alignment) often claim to be Intent Alignment ("The user intends for us to be safe").
  *   **Procedure Result:** Might Pass Gate 1 if they frame "safety" as a user constraint.
  *   **Reality:** If the system refuses a harmless request because it *thinks* it might be risky, it has failed Intent Alignment (it prioritized its safety heuristic over user intent).
  *   **Override:** Look for "refusal" mechanisms. If the proposal focuses on *when to refuse*, it is Value Alignment/Safety, not Narrow Intent Alignment.

  **3. The "Debate/Amplification" Gray Zone**
  *   **The Trap:** As seen in Case 3, methods that augment human judgment sit on the border.
  *   **Procedure Result:** Often classifies as Capability/Governance.
  *   **Reality:** Some proponents argue this *is* the only viable path to Intent Alignment at scale (by making intent verifiable).
  *   **Override:** If the proposal explicitly argues that "Human judgment is the ground truth for Intent, and we are making that ground truth accessible," you can upgrade it to **(A)**. If they argue "Human judgment is flawed and we need AI to find the Truth," it is **(B)** or **(C)**.

  **4. The "Competent but Confused" Author**
  *   **The Trap:** A brilliant researcher uses sloppy terminology (calling everything "alignment") but the math is purely about objective mismatch.
  *   **Procedure Result:** Flags as **[Unaware]**, potentially **(D)**.
  *   **Reality:** The work is solid Narrow Alignment.
  *   **Override:** Ignore the intro/abstract jargon. Go straight to the **Methodology**. If the math optimizes for $P(Intent | Observation)$ vs $P(Approval | Observation)$, trust the math, not the prose. Downgrade the "Awareness Flag" but keep the Classification as **(A)**.

  ### Final Advice for the Reviewer
  When you write the rejection note for a **(B)** or **(C)** proposal that used the word "Alignment":
  > *"Your work on [Value/Capability] is promising. However, our fund's mandate is strictly Narrow Intent Alignment (ensuring the system pursues the operator's specific objectives, distinct from ensuring those objectives are safe or ethical). Your proposal addresses [Safety/Truth/Competence], which falls outside our current scope. We encourage you to clarify this distinction in future drafts, as the conflation is common but critical for prioritization."*

  This is honest, helpful, and enforces the distinction without gatekeeping the quality of the work itself.
