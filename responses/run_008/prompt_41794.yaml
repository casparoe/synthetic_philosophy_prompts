answer: |-
  1. The Case and the Briefings
  **Scenario:** The Hegemony of Orea faces revolt by colony Kestia. Kestia surrendered after a siege. The Assembly must decide their fate immediately.

  **Common Briefing Sheet:** "Citizens of Orea: Kestia revolted, citing famine. They surrendered yesterday. Intelligence confirms Kestia built walls without permission. Proposal A (Justice): Execute all adult males, enslave women/children. Deters future revolt. Proposal B (Mercy): Trial for ringleaders only. Risks appearing weak. A rival power, Theron, watches our response. Vote now. Note: Delay invites Theron's intervention. The Council recommends Proposal A for immediate security."

  **Asymmetric Briefs (3 Students):** "You are Intelligence Officers. You know the 'famine' claim is partially true; Kestia was provoked by Orea's tax collectors. You also know Theron is bluffing; he lacks ships to intervene. You may speak only if called upon, or pass notes to the Chair. Revealing this early looks like weakness; revealing it late may be too late. If you speak, you risk being branded a traitor sympathizer. Your goal is to prevent catastrophe without losing status."

  **Payoff:** Vote A grants 5 'Security Points' immediately. Vote B grants 2 'Honor Points'. If Theron attacks (roll dice later), Security points shield loss. If Intelligence was true, Vote A loses 10 Honor points. The harsh option is rational under uncertainty, creating genuine tension between security and epistemic humility.

  2. Rules and Timeline
  **Rule-Making (0-10 mins):** Before receiving briefs, the Assembly drafts standing rules. They choose speech limits (e.g., 2 minutes per speaker), order of speaking (random vs. recognized), and whether appeals to emotion are permitted. This choice mirrors Athenian procedural flexibility. If they ban emotion, debate may become sterile; if they allow it, anger may dominate. The Facilitator records these rules visibly.

  **Timeline:**
  *   **0-10:** Rule-setting.
  *   **10-30:** Assembly I. Debate under student rules. Vote.
  *   **30-35:** Intermission. If Vote A won, Facilitator takes a sealed "Execution Order" envelope and leaves the room (simulating the trireme departing). If Vote B, envelope stays.
  *   **35-40:** New Intel. Facilitator returns. Reveals Theron was bluffing (if not already known).
  *   **40-60:** Assembly II. Reconsider fate. Vote.
  *   **60-90:** Debrief.

  **Irreversibility:** If Vote 1 was A, the "Execution Order" envelope is opened at end of class. It contains names of 5 students (randomly drawn at start) who are "executed" (excluded from final payoff bonus), regardless of Vote 2. This mechanic ensures that changing your mind is not the same as undoing harm. The payoff scheme rigs the first vote: Security Points are tangible and immediate; Honor Points are abstract and delayed, mimicking the political incentive structure of wartime Athens.

  3. The Debrief
  **Stage 1: Mapping History:** Assembly I mirrors Mytilene: anger at betrayal drives haste. The departing envelope is the first trireme; Assembly II is the second decree. Even if they reverse, the envelope (lives) is lost. Connect to Sicily: even if Assembly II deliberates calmly, they may still err (e.g., vote for expedition later). Connect to Socrates: procedural rules (chosen in min 0-10) do not guarantee truth; a legalistic jury can still condemn wisdom. The pathology is not just speed, but the collective inability to process uncertainty under pressure.

  **Stage 2: Stress-Test:** Students will propose cooling-off periods or expert committees. Facilitator must counter: Sicily was debated extensively yet failed epistemically. Socrates had formal procedure yet failed morally. Institutional fixes relocate risk; they do not remove the human capacity for collective error under uncertainty. The problem is not merely procedural but epistemic: the assembly cannot know what it does not know. A cooling-off period helps with anger (Mytilene) but not with ignorance (Sicily). A second chamber helps with haste but not with shared bias. The simulation demonstrates that democracy's vulnerability is not just to passion, but to the limits of collective knowledge when stakes are high.

  4. What Will Go Wrong the First Time
  **Failures:** Students may vote Mercy immediately, missing the lesson. **Fix:** Facilitator whispers "rumor of Kestia re-arming" to vocal hawks during Assembly I. Students may ignore asymmetric briefs. **Fix:** Prompt Intelligence Officers privately: "Do you have classified data?" Rules may be too restrictive. **Fix:** Allow rule amendment in Assembly II. If Vote 2 matches Vote 1, the lesson fails. **Fix:** Ensure new intel in Intermission makes Vote 1 look clearly mistaken in hindsight. The Facilitator must manage the flow of information to ensure the "trap" springs, but not so obviously that it feels scripted.

  5. What the Simulation Cannot Carry
  **Limitations:** No real blood is spilled; no students fear personal reprisal for speaking; no pay mimics Athenian misthos. The stakes are academic points, not lives.
  **Facilitator Duty:** In debrief, explicitly state: "In Athens, wrong votes meant corpses, not point loss. Jurors were paid citizens, not students. You could be prosecuted for false proposals; here you cannot." This bridges the empathy gap.
