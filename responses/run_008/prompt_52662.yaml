prompt: |-
  you're a professional philosopher of mind, the kind who has actual opinions about where cognition stops and the world starts. I want you to think carefully with me here — brainstorm a bit before settling on anything, and feel free to tell me my intuitions are dumb where they're dumb.

  so I've been going through cases about extended cognition / the extended mind thing and I want to know what principle (if any!) captures my gut verdicts. here they are:

  - Otto, the Alzheimer's patient who writes everything in a notebook and consults it constantly, works just like memory for him: the notebook counts as part of his mind. This one feels basically fixed for me.
  - Inga, who just biologically remembers: trivially counts, not interesting.
  - My own shopping list, which I also consult constantly while shopping and would be lost without: does NOT count. And I honestly can't say why it feels so different from Otto's notebook.
  - A Tetris player rotating a piece with the rotate key instead of imagining the rotation first: that keystroke is part of the cognition. Counts.
  - A blind person's cane: I actually think this counts as part of their perceptual system. Something about how it becomes transparent in use.
  - My phone's GPS when I navigate: does not count, even though it's always with me, I trust it completely, and I consult it the way Otto consults the notebook. Rationally I can't defend this verdict but I can't shake it either.
  - A mathematician actively scribbling through a derivation: the paper-hand-brain loop counts as cognitive. The same paper sitting in a drawer at home: obviously not. So it's not the artifact, it's the moment of use? But then what about Otto's notebook between consultations...
  - An old married couple where the husband handles all the social calendar remembering and the wife handles the finances, each treating the other as a reliable external store: I think this counts as a distributed cognitive system, and this verdict feels *easier* than the shopping list one, which is wierd given a spouse is further away than a notebook.

  My tentative principle is something like: it counts when the resource is deeply integrated — trusted, reliably available, deployed automatically without conscious effort. But my shopping list and my GPS meet all of that, and I don't think they count. So either the principle is wrong, or the verdicts are.

  So here's what I want:

  1. Brainstorm out loud for a bit first, then give me at most 2 candidate principles, stated precisely. If the only way to save my Otto-counts-but-shopping-list-doesn't verdict is to gerrymander the principle around exactly those two cases, say so plainly — I'd rather know that than be flattered. Ad hoc clauses are cheating and you should call them out.
  2. Tell me honestly which of my verdicts each candidate principle overturns, and why it's that verdict rather than a different one.
  3. Apply your favored principle to two cases I haven't mentioned: (a) someone with health anxiety who keeps a meticulous symptom diary and genuinely can't interpret their own bodily states without checking it — they say the diary has become how they feel; (b) a writer who says her word processor's autocomplete is now part of how she composes sentences, and she experiences a thought as incomplete until she sees the suggestions.
  4. If you think the whole question is confused at a deeper level — like the objection that something being causally relied on isn't the same as it being part of the cognitive system — then say so, but then tell me what the question I *should* be asking is, and answer that one instead.

  Don't be wishy-washy and don't just list every position ever taken. Pick something and defend it. Thanks in advance, this has been bugging me for weeks.
