answer: |-
  The statistics said one in four million. The wreckage report said structural failure due to fatigue in the port wing, a cascade of metal stress invisible to the eye until the snap. Elena had been in seat 14C. She had walked away with a bruised rib and a torn coat.

  Three weeks later, she was back in the lab at Caltech, staring at a whiteboard covered in decoherence equations. The air smelled of ozone and stale coffee. She wasn't teaching today. She was calculating.

  "If the wavefunction never collapses," she said, her voice flat, "then death is just a measure zero event from the first-person perspective."

  Simon, a first-year grad student, hovered by the door holding two mugs. He looked at the board, then at her. "Elena, you survived a plane crash. You're allowed to feel lucky."

  "Luck implies a selection process where I could have been picked for death," Elena said, taking the coffee. "But in Many-Worlds, there is no selection. There is only branching. In the branches where the wing failed and I died, there is no Elena to observe the outcome. In the branches where I survived, there is. So, finding myself here isn't evidence of luck. It's a tautology. I am here because I am here."

  "That's quantum immortality," Simon said, setting the mug down. "It's a thought experiment. Not a safety protocol."

  "It's a deduction," she corrected. She picked up a marker. "Premise one: The universe is described by a unitary wavefunction. Premise two: Subjective experience requires a functioning brain. Premise three: I can only experience branches where my brain functions. Conclusion: I will never experience my own death."

  She capped the marker. The click echoed in the small office.

  "So," Simon said slowly, "you're invincible."

  "No." Elena turned back to the board. She drew a tree diagram. At the first node, she wrote *Plane Crash*. Two branches emerged. One ended in a dark X. The other continued. "I'm not invincible. I'm just... filtered."

  She drew another node on the surviving branch. *Car Accident*. Again, a death branch and a survival branch. She drew another. *Heart Attack*. Another.

  "If I stand in front of a bus," she said, "the branch where I die exists. It has high amplitude. Most of the measure of the wavefunction goes there. Simon, most of *me* goes there. But the 'me' that is standing here talking to you? I only flow into the branch where the bus misses, or stops, or I bounce."

  "That sounds like permission," Simon said. "To be reckless."

  "That's the decision theory gap," Elena murmured. She was writing faster now. "If I know I will only experience survival, does rationality require me to maximize utility across all branches, or just optimize for the branch I know I'll inhabit?"

  "Elena," Simon said, his voice tightening. "You're scaring me."

  She stopped. Her hand hovered over the board. She looked at the surviving line she had drawn. It was a single, thin thread weaving through a forest of dead ends.

  "I smuggled an assumption," she said quietly.

  "What?"

  "Survival." She tapped the word on the board. "I wrote 'functioning brain.' But the wavefunction doesn't care about quality of life. It only cares about amplitude."

  She began to draw again, furiously now. Below the *Plane Crash* survival branch, she branched it out. *Survival Intact*. *Survival Paralyzed*. *Survival Brain Damaged*. *Survival Locked-In*.

  "The measure of 'Survival Intact' is tiny," she said. "The measure of 'Survival Damaged' is vast compared to death, because biological systems are robust. Bones knit. Scars heal. Neurons reroute."

  She stepped back. The diagram looked like a funnel. The top was wide with possibilities. The bottom narrowed into a single point of subjective experience, but the path to get there was lined with horrors.

  "If Quantum Immortality is true," Elena said, "then I am not guaranteed a life. I am guaranteed a consciousness. And most of the consciousness available to me in the high-risk branches is... compromised."

  She dropped the marker. It rolled across the floor.

  "If I take a risk," she said, "I am not betting my life. I am betting my integrity. I am betting that the branch where I walk away whole has enough measure to be worth the gamble. But the logic says the measure doesn't matter for subjective continuity. Only non-zero amplitude matters. So... I will find myself in the branch where I survive. Even if that branch is a hospital bed. Even if it's pain."

  She looked at Simon. Her eyes were dry, but her face was pale.

  "It doesn't give me permission, Simon. It gives me a sentence."

  ***

  Dinner was silent for twenty minutes. Mark pushed a piece of roasted carrot around his plate. He hadn't touched his wine.

  "You drove home," he said finally.

  "Yes."

  "You went eighty on the 210. In the rain."

  Elena cut her steak. The knife scraped the ceramic. "I was calculating the stopping distance versus the reaction time of the driver ahead. The probability of a fatal collision was 0.04%."

  "And the other 99.96%?"

  "I'm here, aren't I?"

  Mark put his fork down. The clatter was sharp. "Elena, stop. Please. Just stop."

  "I'm trying to understand the topology of my own existence," she said. "If the many-worlds picture is correct, then my fear response is maladaptive. Fear is designed to prevent death. But if death is inaccessible to me, fear is just noise."

  "You survived a plane crash," Mark said. He leaned forward, his hands clasped tight. "You came home with a bruised rib. You know how many people didn't? Do you know what their families are doing right now?"

  "I know."

  "Then why are you acting like you won the lottery instead of walked out of a graveyard?"

  "Because I didn't win," she said. "That's the point. I didn't win. I just... continued."

  She looked at him. She wanted to tell him about the whiteboard. She wanted to tell him that she wasn't trying to die, but she was trying to understand why she felt so detached from the concept of danger. It felt like walking through a dream where the monsters couldn't touch you, only because you were the one dreaming them.

  "If I'm right," she said, "then every time I take a risk, I'm not gambling with death. I'm gambling with *you*. Because the version of me that survives the crash... she's the one you have to take care of. The version that dies gets off easy. The version that survives broken... she stays."

  Mark stared at her. The anger drained out of his face, replaced by a hollow confusion. "You think... you think you're going to end up broken?"

  "I think that if the theory holds, the measure of 'broken survival' outweighs the measure of 'clean survival' in any high-risk scenario. If I act as if I'm immortal, I shift my future trajectory toward the branches where I am difficult to kill. And those branches are usually the ones where life is hard."

  "So don't act like it," Mark said. His voice was rough. "Just... don't."

  "It's not a switch, Mark. It's a perspective. Once you see the branching, you can't unsee it. Every time I cross the street, I see the branches where I don't make it. And I know I won't experience them. I'll only experience the ones where I limp across, or where I scream, or where I'm fine. But I know the others are there. Weighting the universe."

  "And does knowing that make you feel safe?" Mark asked.

  "No," Elena said. "It makes me feel heavy."

  ***

  The lab was quiet on Sundays. The particle accelerator was in maintenance mode, a sleeping beast of steel and superconductors. Elena stood in front of the safety harness rig. It was used for testing equipment at height, but today she was just looking at the carabiner.

  She held the metal clip in her hand. It was cold.

  If MWI was false, then this was just a piece of metal. If she clipped it in, she was safe. If she didn't, and she fell, she died. End of story. The statistics were real. The luck was real.

  If MWI was true, then clipping it in was a ritual to preserve the measure of her intact selves. Not clipping it in didn't kill her—not subjectively. It just pruned the tree. It cut away the branches where she was whole and forced her consciousness down the stem where she was damaged.

  She realized then that the horror of Quantum Immortality wasn't that you couldn't die. It was that you couldn't leave.

  You couldn't leave the pain. You couldn't leave the grief. You couldn't leave the burden of being the survivor who had to explain to a partner why she drove too fast, or why she stared at walls, or why she couldn't cry at the funerals of the people who hadn't been as lucky as the branches allowed them to be.

  She thought about the decision theory again.

  *Utility Function:* Maximize well-being of future selves.
  *Constraint:* Subjective continuity is guaranteed in non-zero amplitude branches.
  *Variable:* Risk exposure.

  If she increased risk, she increased the probability that her future subjective experience would be one of suffering. Even if death was off the table, pain was not. Pain had amplitude. Pain had measure.

  To act as if she were insured was to ignore the cost of the premium. The premium was the suffering of the Elenas who survived the things she shouldn't have.

  She wasn't the only one. She was a distribution. And she had a responsibility to the measure.

  Elena clipped the carabiner to her belt. It clicked. A solid, mechanical sound.

  She wasn't doing it because she might die. She was doing it because she might not. She was doing it to keep the amplitude of her wholeness as high as possible, to keep the burden on Mark as light as possible, to honor the dead who didn't have the luxury of branching away from their end.

  She walked out of the lab into the California night. The air was cool. She got into her car. She pulled the seatbelt across her chest. She listened for the click.

  She started the engine. She drove the speed limit. Not because she was afraid of the dark. But because she was afraid of the light that would keep shining, no matter what happened, if she wasn't careful.
