  *(Final Polish)*: Ensure the ending feels earned. The seatbelt click is a classic symbol, maybe too classic? Let's make it something about lab safety or just a quiet moment of choosing caution. Let's go with checking the safety harness on a piece of equipment. It ties back to her work.

