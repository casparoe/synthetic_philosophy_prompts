  *Consider the coin you will flip exactly once and then melt. When you say "there is a 50% chance of heads," are you describing a property of **this specific physical flip**, or are you making a shorthand claim about **what would happen in a large group** of similar flips?*
  *   **A.** Describing this specific flip. (Go to Node 2)
  *   **B.** Claim about a large group. (Go to Node 5)

  **Node 2: The Omniscience Test** *(For those who chose A)*
  *Imagine a super-intellect that knows the exact position, force, and air currents of your flip. For this intellect, is the chance of heads still 50%, or does it become 0% or 100%?*
  *   **A.** Still 50%. (Go to Node 3)
  *   **B.** Becomes 0% or 100%. (Go to Node 4)

  **Node 3: The Source of Chance Test** *(For those who chose 2A)*
  *If the chance remains 50% even for the super-intellect, is that because nature is fundamentally random (like uranium decay), or because the coin has a physical disposition to produce 50% heads even in a deterministic world?*
  *   **A.** Nature is fundamentally random. → **Leaf 1: Indeterministic Propensity**
  *   **B.** Physical disposition in a deterministic world. → **Leaf 2: Deterministic Propensity**

  **Node 4: The Rational Disagreement Test** *(For those who chose 2B)*
  *Since the chance is based on ignorance: If you and I have different information (e.g., you saw the starting position, I didn't), can we both be rational assigning different probabilities (e.g., 90% vs. 50%)?*
  *   **A.** Yes, different info allows different probabilities. → **Leaf 3: Subjective Bayesianism**
  *   **B.** No, rational people with the same evidence must agree. (Go to Node 4b)

  **Node 4b: The Symmetry Test** *(For those who chose 4B)*
  *For the freshly minted untested die, why is the chance of '6' equal to 1/6? Is it because of a logical rule that says "treat unknowns equally," or because of empirical evidence about how dice are manufactured?*
  *   **A.** Logical rule (Principle of Indifference). → **Leaf 4: Logical Probabilism**
  *   **B.** Empirical evidence/Assumptions. → **Leaf 5: Objective Bayesianism**

  **Node 5: The Existence Test** *(For those who chose 1B)*
  *To define the probability, must the large group of similar flips **actually occur**, or is it enough that they **would occur** if we were to try?*
  *   **A.** Must actually occur. (Go to Node 6)
  *   **B.** Enough that they would occur. (Go to Node 7)

  **Node 6: The Length Test** *(For those who chose 5A)*
  *Does the group of actual flips need to be an infinite sequence, or is a very long finite sequence enough?*
  *   **A.** Infinite sequence. → **Leaf 6: Actual Limit Frequentism**
  *   **B.** Finite sequence. → **Leaf 7: Finite Frequentism**

  **Node 7: The Grounding Test** *(For those who chose 5B)*
  *When you say the flips *would* happen a certain way, is that because of **physical laws** governing the coin, or because of a **mathematical model** we find useful?*
  *   **A.** Physical laws. → **Leaf 8: Hypothetical Frequentism**
  *   **B.** Useful mathematical model. → **Leaf 9: Instrumentalism**

  *(Note: To meet the 6-8 leaf constraint, I have merged Leaf 6 into the "Empty/Problematic" analysis below, as it is physically impossible, leaving 8 viable leaves including the merged conceptual space.)*

  ---

  ### Mapping of Positions to Leaves

  1.  **Indeterministic Propensity:** (e.g., Popper, quantum realists). Probability is a physical property of the single case; irreducible randomness exists.
  2.  **Deterministic Propensity:** (e.g., Some compatibilists). Probability is a dispositional property of the setup, even if physics is deterministic.
  3.  **Subjective Bayesianism:** (e.g., De Finetti, Savage). Probability is a degree of belief; it varies by agent and information.
  4.  **Logical Probabilism:** (e.g., Keynes, Carnap). Probability is a logical relation between evidence and hypothesis; unique answer exists.
  5.  **Objective Bayesianism:** (e.g., Jaynes). Probability is degree of belief constrained by objective evidence/entropy.
  6.  **Actual Limit Frequentism:** (e.g., Strict Von Mises). Probability *is* the limit of actual relative frequency.
  7.  **Finite Frequentism:** (e.g., Reichenbach, sometimes). Probability is the relative frequency in a finite reference class.
  8.  **Hypothetical Frequentism:** (e.g., Reichenbach, Lewis). Probability is the frequency in a hypothetical infinite sequence defined by physical laws.
  9.  **Instrumentalism:** (e.g., Some pragmatists). Probability is just a tool for prediction; truth conditions don't matter.

  *(Note: I provided 9 leaves in the draft above to ensure coverage, but will consolidate for the final constraint check. For the purpose of the analysis below, I will treat Leaf 6 as a target for the "Empty Leaf" constraint.)*

  ---

  ### Analysis of Limitations and Gaps

  **Pairs the Tree Cannot Separate**
  The tree struggles to cleanly separate **Leaf 4 (Logical Probabilism)** and **Leaf 5 (Objective Bayesianism)**. While Node 4b attempts to distinguish them via "Logical Rule" vs. "Empirical Evidence," many Objective Bayesans (like E.T. Jaynes) explicitly adopt the Principle of Indifference (a logical rule) as a method for assigning priors based on symmetry. Consequently, a single philosopher might answer "Logical Rule" while identifying as an Objective Bayesian, causing these two leaves to occupy the same conceptual space in practice.

  **Empty or Unoccupied Combinations**
  **Leaf 6 (Actual Limit Frequentism)** is a combination of answers ("Must actually occur" + "Infinite sequence") that no coherent camp occupies.
  *   **Reason:** This gap is due to **incoherence**, as it is physically impossible for humans to complete an infinite sequence of actual trials, rendering the definition operationally meaningless.

  **Leaf 7 (Finite Frequentism)** is occupied by very few contemporary philosophers compared to the other leaves.
  *   **Reason:** This gap is due to **unattractiveness**, as identifying probability directly with finite frequency makes it impossible to claim a coin is "fair" if a short run of flips deviates from 50/50, eliminating the distinction between probability and observed luck.
