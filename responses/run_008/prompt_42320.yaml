      *   **Luck Egalitarianism:** Compensate for bad luck, not bad choices. (Explains 6 strongly. Compatible with 1, 3, 5. Helps explain 4 if the £5m is seen as unjust accumulation).
      *   **Sufficientarianism:** Ensure everyone has *enough*. (Explains 3 and 4 if £10k is "enough" and £9k is "not enough").

