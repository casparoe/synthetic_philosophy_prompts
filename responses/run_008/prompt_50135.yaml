answer: |-
  **Question 1: The Two Boxes**
  You stand before two boxes. Box A is transparent and contains £1,000. Box B is opaque. A predictor, who has never been wrong, has already filled Box B with £1,000,000 if they forecast you would take only Box B, otherwise they left it empty. You cannot change what is in the boxes now.
  *   **A:** Take both boxes.
  *   **B:** Take only Box B.

  **Question 2: The Visible Million**
  The setup is identical to the previous case, except the opaque box is made of glass. You can clearly see £1,000,000 inside it. The predictor still filled it based on their forecast of what you would do in this exact situation.
  *   **A:** Take both boxes.
  *   **B:** Take only the box with the million.

  **Question 3: The Smoking Gene**
  Scientists discover a gene that causes two things: a strong desire to smoke and a high risk of lung cancer. Smoking itself does not cause cancer; the gene does. You have the urge. You know smoking won't harm you physically, but smokers are far more likely to die young because they almost all have the gene.
  *   **A:** Smoke.
  *   **B:** Do not smoke.

  **Question 4: The Coin Before Birth**
  A coin was flipped before you were born. If it landed Heads, you exist and are asked to give up £100. If it landed Tails, you receive £10,000, but only if the version of you in the Heads branch *would have* given up the £100. You know you are in the Heads branch. The Tails branch money is already decided based on what you do now.
  *   **A:** Pay the £100.
  *   **B:** Keep the £100.

  **Question 5: The Simulation**
  You are offered a prize. The amount depends on what a perfect simulation of you, run yesterday, decided to do in this exact scenario. If the simulation chose generously, you win big. If it chose selfishly, you win nothing. The simulation is no longer running; its choice is fixed.
  *   **A:** Choose selfishly to maximise your immediate gain.
  *   **B:** Choose generously, matching what you wish the simulation did.

  **Question 6: Death in Damascus**
  Death predicts where you will be tomorrow with perfect accuracy. If he predicts you will be in Damascus, he waits there. If he predicts Aleppo, he waits there. You want to survive. You are currently in Damascus.
  *   **A:** Flee to Aleppo.
  *   **B:** Stay in Damascus.
  *   **C:** Flip a coin to decide.

  **Question 7: Death's Announcement**
  Death appears and announces: 'I will be in Aleppo tomorrow.' He is truthful, but he also predicts your reaction to this news. If he predicts you will stay in Damascus to avoid him, he will go to Damascus instead. If he predicts you will trust him and stay, he goes to Aleppo.
  *   **A:** Stay in Damascus.
  *   **B:** Go to Aleppo anyway.
  *   **C:** Flip a coin to decide.

  **Question 8: The Uncomfortable Rule**
  You must adopt a rule for making decisions. One rule leads to better outcomes overall but requires you to act in ways that feel irrational in the moment. The other rule feels consistent and stable whenever you follow it, but yields slightly less success overall.
  *   **A:** Adopt the rule that wins most often, even if it feels unstable.
  *   **B:** Adopt the rule you can endorse without regret when you follow it.

  ***

  ### Scoring Key and Commentary

  **How to Score**
  Tally your answers according to the four columns below. Most questions offer two options; Questions 6 and 7 offer three. Assign each answer to the column indicated.

  | Question | **Causal (CDT)** | **Evidential (EDT)** | **Functional (FDT)** | **Ratificationism** |
  | :--- | :---: | :---: | :---: | :---: |
  | **1** | A | B | B | B |
  | **2** | A | B | B | B |
  | **3** | A | B | A | A |
  | **4** | B | B | A | B |
  | **5** | A | A | B | B |
  | **6** | A or B | A | C | C |
  | **7** | B | B | A | A |
  | **8** | A | A | A | B |

  **The Four Leaves**
  *   **The Causal View (CDT):** You prioritise what your action physically causes. Predictors are fixed facts; you cannot change the past by choosing now.
  *   **The Evidential View (EDT):** You prioritise what your action indicates. You choose the option that is the best news about the world, even if you didn't cause it.
  *   **The Functional View (FDT):** You prioritise the output of your decision procedure. You act as though choosing the output determines the prediction, treating logical correlations like causal ones.
  *   **The Ratificationist View:** You prioritise stability. You choose a strategy that remains optimal even after you have committed to it, often requiring randomisation to avoid being predictable.

  **Mapping Your Result**
  *   **Mostly Causal:** You believe in cause and effect. The past is fixed; you cannot influence a predictor's prior choice.
  *   **Mostly Evidential:** You believe in correlation. You avoid actions that are bad news, even if they are harmless in themselves.
  *   **Mostly Functional:** You believe in logical consistency. You treat predictions of your behaviour as bound to your actual behaviour.
  *   **Mostly Ratificationist:** You believe in stability. You seek a decision that you would not wish to change once made.

  ***

  ### Commentary on the Logical Space

  **Possible Answer Combinations**
  In constructing this quiz, I mapped the logical space of decision theories before attaching labels. There are $2^6 \times 3^2 = 576$ possible answer combinations across the eight questions. However, coherent philosophical positions occupy only a tiny fraction of this space.

  **Empty Regions and Diagnoses**
  1.  **Question 1A (Two-box) + Question 3B (Don't Smoke):** This region is largely empty. It represents someone who ignores correlation in Newcomb's Problem but respects it in the Smoking Lesion. This is incoherent: both cases rely on the same distinction between causation and correlation. If you treat the predictor's forecast as fixed (1A), you should treat the gene as fixed (3A).
  2.  **Question 4A (Pay) + Question 1A (Two-box):** This region is unattractive and rarely occupied. Paying in the Coin case implies you think your choice influences a past event (the coin flip outcome or the counterfactual payout). Two-boxing implies you think your choice cannot influence a past event (the box filling). Holding both views suggests an inconsistent model of counterfactuals.
  3.  **Question 6C (Mix) + Question 7C (Mix):** This region is empty for Ratificationism. While mixing solves the classic Damascus case (Q6), the Twist (Q7) is designed so that a pure strategy (Stay) becomes stable once Death announces his location. Randomising in Q7 suggests a fetishisation of unpredictability rather than a commitment to stability.

  **Indistinguishable Positions**
  *   **Evidential vs. Functional on Newcomb:** Both views recommend One-Boxing (1B) and Transparent One-Boxing (2B). The quiz separates them only via the Smoking Lesion (Q3). Evidentialists refuse to smoke (bad news); Functionalists smoke (no causal harm). If a classmate scores heavily on 1B/2B but is unsure on Q3, the quiz cannot definitively separate them.
  *   **Functional vs. Ratificationism on Stability:** Both views often converge on Q8 (Functionalists often endorse the winning rule). They are best separated by the Damascus cases (Q6/Q7). Functionalists may randomise to be unpredictable; Ratificationists randomise only because pure strategies are unstable. If a user selects 'Stay' on Q7, both views align. The quiz cannot separate them if they agree on all concrete cases.

  **Advice for Mixed Results**
  It is common for classmates to land in two different regions (e.g., Causal on Newcomb but Evidential on Smoking). This usually indicates one of three things:
  1.  **Intuitive Conflict:** You recognise the logic of causation but feel the pull of correlation. This is the normal human condition; decision theory is an attempt to resolve this tension.
  2.  **Context Sensitivity:** You may believe different principles apply to different types of predictors (e.g., humans vs. computers). This is a valid philosophical stance known as 'pluralism'.
  3.  **Unstable Intuitions:** You may be answering based on the framing rather than the logic. If so, focus on the questions where you felt most confident.

  If you find yourself split between **Causal** and **Evidential**, ask yourself: "Do I want to be the kind of person who gets the million, or the kind of person who takes what is there?" If you are split between **Functional** and **Ratificationist**, ask yourself: "Do I randomise to win, or do I randomise because I cannot bear to commit?" There is no shame in a mixed result; it simply means you have identified the precise points where your intuitions conflict.
