      - No convenient failure? Yes, all plans seem viable.
      - Ambiguous peace? Yes, ending shows them acting but not resolving.

      *Refining the ending for ambiguity:* The last paragraph is good. It emphasizes the separation of their paths.

      *Final Polish:* Ensure the dialogue sounds distinct. Marcus is formal. Sarah is clipped. Leo is emotional but direct.

