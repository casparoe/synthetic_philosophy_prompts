answer: |-
  **Title:** The Epistemic Severance: A Critique of FDT on Counterfactual Mugging and XOR Blackmail

  **Abstract**
  Functional Decision Theory (FDT) posits that rational agents should select the output of their decision algorithm that maximizes utility across all logically subjunctively dependent outcomes. This framework yields specific, celebrated verdicts on Newcomblike problems: one-boxing, cooperating with twins, and paying Parfit's hitchhiker. However, when applied to Counterfactual Mugging and XOR Blackmail, the standard FDT orthodoxy produces a pair of verdicts that are mutually inconsistent under scrutiny. I argue here that the standard FDT analysis reverses the correct prescriptions for these two cases. Specifically, a rational agent should **refuse** to pay in the Counterfactual Mugging and **agree** to pay in the XOR Blackmail. This reversal exposes a flaw in how FDT weights subjunctive dependence against posterior epistemic updates. The critical asymmetry lies in the agent's knowledge of the underlying state: in the Mugging, the agent knows the losing branch is actual; in the Blackmail, the agent does not. FDT's insistence on ex ante policy optimization fails to account for the normative weight of ex post informational asymmetry.

  ---

  ### 1. The Counterfactual Mugging: The Case for Defection

  In the Counterfactual Mugging, Omega flips a fair coin. If Heads, Omega simulates you; if the simulation pays $100, Omega gives you $10,000. If Tails, Omega asks you for $100 in reality. You are told the coin came up Tails. There is no envelope.

  **The Standard FDT Verdict:** Pay.
  **The Argument:** Your decision algorithm is the same in the simulation (Heads) and reality (Tails). If your algorithm outputs "Pay" on Tails, it outputs "Pay" on Heads. Therefore, paying now logically determines that you would have received $10,000 in the Heads branch. The expected value of the policy "Always Pay" is positive ($4,950), whereas "Always Refuse" is zero. FDT argues you should act as if you are behind a veil of ignorance regarding the coin flip, optimizing the algorithm rather than the act.

  **The Critique:**
  The FDT verdict relies on treating the logical connection between the Tails-act and the Heads-outcome as normatively binding *after* the epistemic update that the coin is Tails. This conflates *algorithmic identity* with *causal leverage*.

  When Omega reveals the coin is Tails, you possess hard evidence that you are in the branch where the reward is impossible. The "subjunctive dependence" FDT relies on is a logical relation between computations, but rational action requires a relation between *choices* and *outcomes*. In the Tails branch, the choice to pay has a causal cost ($100) and a logical benefit that exists only in a counterfactual world you know you do not inhabit.

  The FDT rejoinder is that rational agents are evaluated by the performance of their source code, not their situational choices. "If you refuse," Yudkowsky and Soares argue, "you are the sort of agent who loses the Newcomb game." But this appeal to *ex ante* reflective stability collapses under *ex post* scrutiny. Precommitment has value only before the uncertainty is resolved. Once the coin is Tails, the "policy" is no longer a tool to influence Omega's past prediction; it is a sunk cost mechanism. To pay is to sacrifice real currency for a logical ghost.

  Furthermore, FDT's treatment of information is unstable here. If the agent knows the coin is Tails, the input to the decision function `Decide(Coin=Tails)` is distinct from `Decide(Coin=Heads)`. FDT treats these as the "same function," but a function that ignores its inputs is defective. A rational agent updates on evidence. The evidence "Coin=Tails" severs the practical link to the Heads reward. To ignore this is not rationality; it is a form of logical fanaticism where the map is weighted heavier than the territory simply because the map was drawn earlier.

  **Verdict:** Do not pay. The subjunctive link to the Heads world is epistemically severed by the knowledge of Tails.

  ---

  ### 2. XOR Blackmail: The Case for Payment

  In the XOR Blackmail, a rumor exists that your house has termites (cost: $1M). Omega sends a letter iff (No Termites AND You Pay) OR (Termites AND You Don't Pay). You receive the letter.

  **The Standard FDT Verdict:** Do not pay.
  **The Argument:** If your algorithm is "Pay," Omega sends the letter when there are *no* termites (to extract $1,000). If your algorithm is "Don't Pay," Omega sends the letter when there *are* termites (to deliver bad news, but you save $1,000). FDT argues you should be the type of agent who does not get blackmailed in the safe world. By refusing, you ensure that receiving the letter is correlated with termites, but you avoid the $1,000 tax in the worlds where the house is safe.

  **The Critique:**
  This verdict fails because it prioritizes the *frequency* of the letter over the *implication* of the letter once received. The standard FDT analysis optimizes for the ex ante probability of receiving the letter, but the decision problem is presented ex post: **you have the letter.**

  Let us analyze the conditional probabilities given the letter is in hand:
  1.  **Policy: Pay.** Omega sends letter iff No Termites. Therefore, Letter $\rightarrow$ No Termites. Cost: $1,000. Damage: $0. Total Loss: $1,000.
  2.  **Policy: Don't Pay.** Omega sends letter iff Termites. Therefore, Letter $\rightarrow$ Termites. Cost: $0. Damage: $1,000,000. Total Loss: $1,000,000.

  In the Mugging, paying buys a benefit in a *different* branch (Heads). In the Blackmail, paying buys a benefit in the *current* branch (Safety). By adopting the "Pay" policy, you make the letter's arrival evidence of safety. By adopting the "Don't Pay" policy, you make the letter's arrival evidence of infestation.

  Since you have received the letter, you should prefer to be in the world where the letter implies safety. The FDT objection—that refusing prevents the letter in the safe world—is irrelevant once the letter is received. You cannot retroactively prevent the letter; you can only determine what the letter *means*. FDT's refusal is an attempt to win the game before it starts, but the game has already started. The agent who refuses is essentially saying, "I prefer to be the type of person who only gets bad news," which is instrumentally irrational when facing the news.

  **Verdict:** Pay. The payment purchases the interpretation of the letter as "Safe," which is vastly superior to the interpretation "Infested."

  ---

  ### 3. Breaking the Symmetry: Information and Dependence

  Why should the verdicts reverse? Both cases involve a predictor, a logical link between action and prediction, and a tension between ex ante policy and ex post action. The asymmetry lies in the **epistemic state of the agent regarding the underlying fact.**

  **1. The Knowledge Asymmetry**
  *   **Mugging:** You *know* the coin is Tails. The state of the world is fully resolved. The benefit of your policy lies entirely in a counterfactual world you know is false.
  *   **Blackmail:** You do *not* know if there are termites. The state of the world is unresolved. The benefit of your policy lies in determining the correlation between the letter and the actual state of your house.

  In the Mugging, subjunctive dependence asks you to act as if you don't know the coin flip. In the Blackmail, subjunctive dependence asks you to act as if your choice determines the termite state (which it doesn't), but the *correlation* determines your loss.

  **2. The Direction of Value**
  *   **Mugging:** Value flows from the Counterfactual Branch to the Actual Branch via the Policy. (Heads Reward $\leftarrow$ Policy $\rightarrow$ Tails Cost).
  *   **Blackmail:** Value flows from the Actual Branch's Interpretation via the Policy. (Letter + Policy $\rightarrow$ Inference about Termites $\rightarrow$ Cost).

  FDT treats subjunctive dependence as a monolithic bridge. It argues that because your code is the same, the logical consequences hold. But logical consequences are not all created equal. In the Mugging, the logical consequence is "Omega predicted you would pay." In the Blackmail, the logical consequence is "The letter implies safety."
  The Mugging requires you to ignore known evidence (Coin=Tails) to satisfy a logical constraint. The Blackmail requires you to use your decision to *select* which evidence you possess (Safety vs. Doom). Ignoring known evidence is irrational; selecting favorable evidence correlations is rational.

  **3. Subjunctive Dependence vs. Evidential Update**
  FDT was designed to escape the pitfalls of Evidential Decision Theory (EDT), specifically the "news desire" problem (managing the news rather than the outcome). However, in XOR Blackmail, the "news" *is* the outcome. Knowing your house is safe is functionally equivalent to it being safe, because the cost is incurred only if it is infested.
  *   In Mugging, EDT says "Don't Pay" (Paying is bad news about your wealth). FDT says "Pay" (to fix the algorithm). I argue "Don't Pay" (because the news is already bad).
  *   In Blackmail, EDT says "Pay" (Paying is good news about termites). FDT says "Don't Pay" (to fix the algorithm). I argue "Pay" (because the news is the only thing you can control).

  The flaw in FDT is that it treats the *algorithm's performance across possible worlds* as the terminal value, rather than the *agent's utility in the actual world*. In the Mugging, the actual world offers no leverage. In the Blackmail, the actual world offers leverage via inference.

  ---

  ### 4. Addressing FDT Rejoinders

  **Rejoinder 1: "Rationality is Systematic Winning"**
  *FDT Defense:* An agent that refuses the Mugging is the sort of agent that doesn't get the $10,000. An agent that pays the Blackmail is the sort of agent that gets blackmailed when safe. You should want to be the former types.
  *Rebuttal:* This defense relies on a "God's eye view" of the agent's lifetime utility across all possible deployments. But decision theory is for situated agents. If I am situated in the Tails branch, telling me I "would have won" in the Heads branch is consoling, not action-guiding. Similarly, in Blackmail, telling me I "would have avoided the letter" in the safe world is useless when I hold the letter. Systematic winning requires winning the hand you are dealt, not the hand you wish you were dealt.

  **Rejoinder 2: "Precommitment is Binding"**
  *FDT Defense:* If you could precommit before the coin flip or before the termite check, you would commit to Pay (Mugging) and Refuse (Blackmail). Since you are the same algorithm, you must honor that precommitment.
  *Rebuttal:* Precommitment is only binding if it influences the outcome. In the Mugging, the precommitment influenced Omega's past action, but that action is already resolved (no envelope). Honoring the commitment now changes nothing about the past. In the Blackmail, the precommitment influenced whether the letter was sent, but the letter *is* sent. Honoring the commitment now changes the *meaning* of the letter. The Mugging precommitment is sunk; the Blackmail precommitment is interpretive. You cannot spend sunk costs, but you can adjust interpretations.

  **Rejoinder 3: "Subjunctive Dependence is Causal for Logical Agents"**
  *FDT Defense:* For a logical agent, the simulation *is* you. The counterfactual is not "far away"; it is a logical consequence of your code.
  *Rebuttal:* Even if the simulation is logically identical, the *inputs* differ. `f(Tails)` is not `f(Heads)`. If the function takes the coin state as input, then the outputs can diverge without violating logical consistency. FDT assumes the function must output the same action regardless of input to maintain "logical control." But a function that ignores the "Tails" input is simply less intelligent than one that uses it. Why should logical control require blindness to reality?

  ---

  ### 5. Conclusion

  The standard FDT verdicts on Counterfactual Mugging and XOR Blackmail rest on an over-extension of subjunctive dependence. They prioritize the integrity of the decision algorithm across possible worlds over the epistemic reality of the actual world.

  By reversing these verdicts—refusing the Mugging and paying the Blackmail—we acknowledge a crucial distinction:
  1.  **Counterfactual Mugging:** The agent knows the losing branch is actual. Subjunctive links to the winning branch are epistemically severed. Paying is a tribute to a ghost.
  2.  **XOR Blackmail:** The agent does not know the state of the world. The decision determines the evidential value of the letter. Paying purchases safety; refusing purchases doom.

  FDT correctly identifies that agents are algorithms, but it incorrectly concludes that algorithms must ignore their inputs to maintain logical leverage. A truly rational agent respects the logical structure of its code but also respects the informational content of its situation. In the Mugging, the situation says "You lost." In the Blackmail, the situation says "You can buy a win." To do otherwise is not to be a better rationalist; it is to be a dogmatist of the decision procedure.
