      *   *Strong Social Constructionist:* Kinds are *only* social artifacts. Looping proves they weren't "there" to begin with. (Often implies less reality/validity).
      *   *Institutionalist:* Looping happens, but via systems (schools, courts), not necessarily conscious self-understanding.
