          *   *Supervaluation/Ockhamist Hybrid:* If the event happens tomorrow, then yesterday it was *going to happen*. But was it *true*?
          *   *Principle:* Truth is relative to a time and a history. "It was true yesterday" usually implies "It was settled yesterday."
