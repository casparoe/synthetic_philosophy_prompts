answer: |-
  In the quiet aisle of a downtown record shop, esteemed critic Elias holds up a jacket and tells both Clara and Ben, simultaneously, "This cover art is aggressively brittle." Clara, whose eyes track the jagged typography and sharp contrast, feels the visual tension snap into place, the word granting her immediate access to a property she perceives but hadn't named, securing her knowledge that the art is indeed brittle. Ben, trusting Elias completely and paying full attention, hears the verdict as a reliable data point about the critic's preference, yet the word refuses to stick to the image before him; without the specific sensitivity to see the typography as tension rather than just shape, he inherits a fact about Elias's opinion but fails to form a justified belief about the cover itself.

  **Analysis**

  The **pessimist** argues that Clara's success is misleading: she doesn't know via testimony, but rather via perception, with Elias's words merely acting as a prompt that directed her attention to what she could already see. For the pessimist, Ben is the standard case; testimony cannot transmit aesthetic justification because aesthetic properties are response-dependent, requiring the hearer to have the relevant experience themselves. The **optimist** counters that Clara clearly gained knowledge through Elias's utterance—without it, she had only vague discomfort, not a structured judgment. For the optimist, Ben's failure is an anomaly of concept possession, not a limit of testimony; if you have the concepts, testimony works.

  The **everyday-vs-artistic distinction** (where testimony is accepted for "delicious" or "great view" but rejected for art) does not rescue the optimist here; it merely renames the problem. If Ben lacked the physiological capacity to taste sweetness, testimony that "this is sweet" would fail for him just as "brittle" did. The barrier isn't the domain (art vs. everyday), but the requirement that the hearer possess the perceptual-conceptual capacity to map the predicate onto the experience.

  The feature doing the work is **Sibley-shaped**: aesthetic concepts are not condition-governed in a way that allows definition-based transfer. You cannot be given "garish" or "brittle" by definition; you must be able to see the conditions that warrant the term. Clara has the sensitivity to see the warrant; Ben lacks the sensitivity, so the testimony lacks a hook in his perceptual experience.

  If we let **Ben spend six months** looking at similar paintings, he develops the sensitivity. Now, when Elias says "brittle," the word sticks, and Ben forms a justified belief. The case collapses because Ben now resembles Clara. The pessimist's remaining move is the **wholes-vs-reasons retreat**: "Fine, Ben now knows *that* it is brittle, but he still doesn't *appreciate* it like someone who saw the warrant immediately." This is a **real limitation** on testimony, not merely a change of subject. In aesthetics, the value of the knowledge is tied to the appreciation of the grounds; knowing the verdict without feeling the weight of the reasons is a hollow form of aesthetic knowledge, stripping the testimony of its normative force even if it preserves its propositional truth.
