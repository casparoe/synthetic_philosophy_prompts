answer: |-
  You are absolutely right to feel that both arguments are landing in the wrong place. Your intuition is spot-on: both Dana and Priya are committing a version of the **Naturalistic Fallacy**, specifically trying to derive an *ought* (how we should pay people) from an *is* (how monkeys evolved).

  They are both treating the *origin* of a moral intuition as proof of its *validity* (Priya) or *invalidity* (Dana). In philosophy, this is closely related to the **Genetic Fallacy**: judging the truth or value of an idea based solely on where it came from.

  Here is the breakdown of the philosophical error, why Dana's specific move is dangerous for a nonprofit, and a draft for your memo.

  ### 1. The Philosophical Error: The Is-Ought Gap
  The core problem is that evolutionary biology describes **mechanisms**, not **mandates**.
  *   **The Fact:** Capuchin monkeys (and humans) have an evolved emotional reaction to inequity.
  *   **Dana's Leap:** Because this reaction is evolved/biological, it is merely a "bias" (implying error) and can be discarded for "rational" market calculations.
  *   **Priya's Leap:** Because this reaction is evolved/biological, it is "natural" and therefore morally binding.

  **Why Priya is wrong:** Evolution selects for reproductive fitness, not moral truth. Humans also have evolved tendencies toward tribalism, aggression, and immediate gratification. The fact that an impulse is "hardwired" doesn't make it good; it just makes it strong.

  **Why Dana is wrong:** She assumes that "evolved intuition" = "glitch" and "market price" = "objective truth." But market prices are also human constructs subject to biases (e.g., undervaluing care work, which is crucial for nonprofits). Furthermore, she assumes that ignoring the fairness intuition is "rational." In game theory, fairness heuristics are often *highly rational* strategies for maintaining long-term cooperation. If you treat fairness as a bug, you risk crashing the system.

  ### 2. Specifically Countering Dana's "It's Just a Bias" Argument
  Dana's argument is the more dangerous one for a nonprofit because it undermines the social contract. Here is how to dismantle it:

  1.  **Function over Origin:** It doesn't matter *why* we feel fairness is important (monkeys, God, or Kant). What matters is *what the feeling does*. In cooperative species, inequity aversion prevents free-riding and maintains group cohesion. For a nonprofit, **cohesion is the product.** Ignoring it isn't "rational"; it's strategically suicidal.
  2.  **The "Bias" Double Standard:** If we dismiss fairness because it's an evolved bias, we must also dismiss the drive for "market efficiency" or "profit maximization," which are also driven by evolved psychological traits (status seeking, resource accumulation). Why is one bias "rational" and the other "irrational"?
  3.  **The Definition of Rationality:** Dana defines rationality as "short-term cost minimization." But for a board, rationality is "mission fulfillment." If paying interns $0 causes burnout, high turnover, or reputational damage, it is *irrational* regardless of what the labor market says.

  ### 3. Draft Language for the Decision Memo
  You need to pivot the board from **Meta-Ethics** (where does morality come from?) to **Organizational Strategy** (what compensation structure serves our mission?).

  Here is a template you can adapt:

  ***

  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **SUBJECT:** Compensation Framework Decision Criteria

  **Background**
  At our last meeting, we had a robust discussion regarding the philosophical underpinnings of compensation equity, specifically referencing evolutionary psychology and market theory. While these insights into *why* humans value fairness are fascinating, the Board agrees that they cannot solely dictate *how* we structure pay.

  **Decision Framework**
  Science can tell us how people *react* to pay, but it cannot tell us what we *ought* to pay. Therefore, our compensation policy will not be based on the origin of our moral intuitions, but on the functional requirements of our mission. We have adopted the following three criteria:

  1.  **Mission Alignment:** Does this pay structure attract and retain the talent necessary to fulfill our nonprofit's specific goals? (e.g., If underpaying leads to high turnover that hinders the mission, it is not a viable strategy, regardless of market rates.)
  2.  **Sustainability:** Can the organization sustain this pay structure long-term without jeopardizing financial solvency?
  3.  **Internal Equity:** Does the pay structure foster a culture of trust and collaboration? We acknowledge that perceived inequity negatively impacts team cohesion. Whether this feeling is "evolved" or "learned" is irrelevant; the impact on productivity is real.

  **Conclusion**
  We are setting aside the question of whether fairness is a "universal truth" or a "biological bias." Instead, we are treating fairness as a **material operational constraint.** Just as we must account for rent or software costs, we must account for the human need for perceived equity to maintain a functional workforce.

  ***

  ### 4. How to Explain This to Dana and Priya
  When you present this, you can validate them both while correcting the logic.

  **To Dana:**
  > "Dana, you're right that the fairness instinct is evolved and can feel irrational in a pure market transaction. But in an organization, that instinct is a **feature, not a bug**. It's the glue that keeps people cooperating when they aren't being strictly monitored. Ignoring it isn't 'rational market behavior'; it's ignoring a key risk factor. We aren't paying for fairness because it's morally holy; we're paying for it because it keeps the team working."

  **To Priya:**
  > "Priya, you're right that this intuition is deep and universal. But evolution also gave us impulses we choose to override (like aggression or tribalism). We can't say something is right *just* because monkeys do it. We have to choose fairness because it aligns with our values and mission, not simply because biology made us that way. We are owning the value, not just obeying a biological script."

  ### Summary for You
  The "illegitimate move" they are both making is thinking that **explanation equals justification.**
  *   Explaining *why* we feel fairness (evolution) does not justify *ignoring* it (Dana).
  *   Explaining *why* we feel fairness (evolution) does not justify *obeying* it (Priya).

  Your memo should firmly state: **We are not deciding based on the origin of the feeling, but on the consequence of ignoring it.** This sidesteps the philosophy fight and puts the focus back on governance.
