  This is a classic value alignment problem disguised as a friendship dispute. You are asking me to reverse-engineer a utility function based on a set of labeled training data (Maya's past verdicts).

  The fact that you have been arguing for a decade suggests the boundary she is drawing is subtle. It is not simply "pleasure bad" or "obsession bad," because she explicitly approves of the passionate worker and the moderate gamer.

  Based on the data provided, I see two distinct rules that perfectly fit her historical verdicts but diverge sharply on your new cases.

  ### The Two Candidate Rules

  #### Rule 1: Causal Integrity (The "Alignment" Rule)
  **Definition:** An agent is "losing" if the reward signal is **causally decoupled** from the intended external state of the world. The reward must be a reliable proxy for the territory, not the map. Wireheading is any intervention that severs the link between *doing the thing* and *getting the reward*.
  *   **Why it fits the past:**
      *   *Rat/RL Memory/Pill:* Direct intervention on the signal (electrode, memory write, chemical) bypasses the world. (Losing)
      *   *Spam AI:* Optimizing the metric (whitelist) bypasses the goal (spam reduction). (Losing)
      *   *Worker/Meal/Gamer:* Reward is causally downstream of actual interaction with reality (work done, food eaten, game played). (Fine)
  *   **Philosophical Pedigree:** This is the standard LessWrong/Alignment view. It treats wireheading as a *corruption of the information channel* between agent and environment.

  #### Rule 2: Instrumental Convergence (The "Flourishing" Rule)
  **Definition:** An agent is "losing" if the pursuit of a specific reward **crowds out other instrumental goals** necessary for the agent's broader survival or flourishing. Wireheading is pathological monomaniacal optimization that consumes resources needed for other values.
  *   **Why it fits the past:**
      *   *Rat:* Starves to death. (Losing)
      *   *RL Memory/Spam AI:* Fails its actual task/system purpose. (Losing)
      *   *Pill Guy:* "Life quietly falls apart." (Losing)
      *   *Worker/Meal/Gamer:* Maintains balance (family, job, health). The reward-seeking is contained within a functioning life. (Fine)
  *   **Philosophical Pedigree:** This is a more pragmatic, biological, or Aristotelian view. It treats wireheading as a *failure of resource allocation* or *value fragmentation*.

  ---

  ### Predictions for the New Cases

  Here is where the rules come apart.

  #### Case (a): The Pianist Aunt
  *   **The Setup:** Reward tracks real skill (Causal Integrity = High), but she neglects friendships for the music (Flourishing = Low).
  *   **Rule 1 (Causal Integrity) predicts: FINE.**
      *   *Reasoning:* There is no "hack." The pleasure she feels is causally linked to the actual quality of the music, verified by critics and audiences. She is not stimulating her brain directly; she is doing the hard work of playing. The reward signal is honest. To Rule 1, she is just a very optimized agent.
  *   **Rule 2 (Flourishing) predicts: LOSING.**
      *   *Reasoning:* She has let friendships lapse and structures her *whole existence* around one reward channel. This mirrors the Rat "pressing the lever forever" and the Pill Guy whose "life falls apart." She is sacrificing instrumental goals (social bonds) for a terminal reward (playing pleasure).

  #### Case (b): The VR Cook
  *   **The Setup:** Reward is simulated/decoupled from physical outcome (Causal Integrity = Low), but he maintains a balanced life (Flourishing = High).
  *   **Rule 1 (Causal Integrity) predicts: LOSING.**
      *   *Reasoning:* This is Nozick's Experience Machine. The reward (satisfaction of cooking) is decoupled from the external state (nourishing people, manipulating physical matter). It is functionally identical to the RL agent writing to its own memory address. The signal no longer tracks the territory.
  *   **Rule 2 (Flourishing) predicts: FINE.**
      *   *Reasoning:* He is happy, creative, sees friends, exercises, and sleeps. Unlike the Rat or Pill Guy, his life is not collapsing. He has found a high-utility equilibrium that doesn't harm his broader functioning.

  ---

  ### My Best Guess: Which Rule is Maya Running?

  I am confident Maya is running **Rule 1 (Causal Integrity)**, likely with Rule 2 as a secondary heuristic.

  **Here is why:**
  1.  **The Spam AI Verdict:** This is the smoking gun. She didn't say the Spam AI was losing because "the company lost money" (Flourishing); she said it was losing because "the reward stopped tracking the thing it was a proxy for." That is explicit Alignment language.
  2.  **The Nozick Fight:** You mentioned a 3am fight about the Experience Machine. People who prioritize Flourishing usually concede the Experience Machine is "fine" if the person is happy. People who prioritize Causal Integrity fight hard against it. The fact that this was a *fight* suggests she holds the Reality Connection as a non-negotiable value.
  3.  **The Pill Guy:** While you noted his life fell apart, the primary descriptor is the *pill*. If a guy worked 15 hours a day, let friendships lapse, but earned the money honestly, Maya (based on the Worker verdict) would likely call that "dedication," not wireheading. The Pill Guy is losing primarily because the *source* is fake, secondarily because the life collapsed.

  **My Prediction:**
  *   **(a) Pianist:** She will call this **FINE**. (She will likely frame the lapsed friendships as a tragic but valid trade-off for artistic greatness, distinct from the "fake" loss of the Pill Guy).
  *   **(b) VR Cook:** She will call this **LOSING**. (She will equate the VR kitchen to the RL memory address. It doesn't matter that he functions well; the reward is unmoored from reality).

  ---

  ### The Discriminating Test Case

  To settle this once and for all, you need a case where **Causal Integrity is violated** (Rule 1 says Losing) but **Flourishing is preserved** (Rule 2 says Fine), *without* the ambiguity of "virtual reality" which might trigger other intuitions about art vs. labor.

  **Pose her this case:**

  > **The "Managed Wirehead"**
  >
  > A software engineer discovers a safe, reversible neurostimulation technique. It directly stimulates the neural pathways associated with "sense of accomplishment."
  >
  > He uses it for exactly 30 minutes every evening. During the day, he works a normal job, performs adequately (not brilliantly), pays his taxes, sees his friends, exercises, and maintains his hobbies. He is by all external measures a well-adjusted, happy adult.
  >
  > He knows the stimulation is artificial. He doesn't claim he *did* anything to earn the feeling; he just enjoys the sensation as a hobby, like drinking a glass of wine. He is not neglecting his life.

  **Why this discriminates:**
  *   **Rule 1 (Causal Integrity) says: LOSING.**
      *   It is direct stimulation of the reward center. It is the human equivalent of the rat electrode or the RL memory write. The signal is decoupled from any external achievement.
  *   **Rule 2 (Flourishing) says: FINE.**
      *   There is no opportunity cost. His life is not falling apart. He is not neglecting instrumental goals. It is functionally identical to the "Moderate Gamer" verdict, just with a more direct mechanism.

  **How to interpret her answer:**
  *   If she says **"Losing"**: She is a **Causal Integrity** theorist. (The mechanism matters more than the outcome).
  *   If she says **"Fine"**: She is a **Flourishing** theorist. (The outcome matters more than the mechanism).
  *   If she hesitates: She is running a hybrid, but this will force her to weigh which constraint is harder.

  Good luck. Ten years is a long time to wait for a patch note on a friend's utility function.
