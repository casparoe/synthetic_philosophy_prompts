answer: |-
  As a philosopher of biology, I find your observation astute. Institutions are often better metaphysicians than they are scientists; they must act on ontological commitments before the science has settled them. When an agency spends billions sterilizing a spacecraft, it is making a bet on the nature of reality.

  Below, I have systematically analyzed the three practices you identified. I begin by extracting the candidate metaphysical and epistemic commitments implicit in each. I then distinguish which of these are strictly *presupposed* (the practice fails without them) versus merely *consistent* (the practice works comfortably with them, but could function otherwise). Finally, I evaluate the internal consistency of this patchwork and the operational consequences of adopting an explicit, graded ontology.

  ---

  ### Part 1: Brainstorming Candidate Commitments

  Here are the explicit metaphysical and epistemic claims that *could* underwrite each practice.

  #### 1. Planetary Protection (NASA/COSPAR)
  *   **C1 (Natural Kind):** "Life" is a discrete, natural category with sharp boundaries. An entity either is or is not an organism.
  *   **C2 (Universal Hazard):** Any entity classified as "life" possesses an inherent capacity for contamination or ecological disruption, regardless of specific traits.
  *   **C3 (Earth-Centrism):** Earth biology is a sufficient proxy for alien biology regarding risk (i.e., alien life will interact with Earth life in ways we can model).
  *   **C4 (Epistemic Precaution):** In the absence of a definition, we must treat *potential* replicators as *actual* hazards.

  #### 2. Virology
  *   **C5 (Metabolic Essentialism):** True "Life" requires independent metabolism and replication.
  *   **C6 (Functional Biology):** Biological significance (causing disease, evolving, interacting with cells) does not require ontological status as "Living."
  *   **C7 (Taxonomic Pragmatism):** Classification systems should reflect evolutionary history (phylogeny), which excludes viruses, even if regulatory systems treat them as hazards.

  #### 3. Synthetic Biology
  *   **C8 (Creationism):** "Life" is a threshold that can be crossed by human engineering (a binary state change).
  *   **C9 (Replication Threshold):** Moral and security concern scales with the capacity for autonomous self-replication.
  *   **C10 (Dual-Use Ontology):** Engineered non-replicating systems are tools; engineered replicating systems are agents.

  ---

  ### Part 2: Presupposed vs. Consistent

  This is the critical philosophical distinction. A commitment is **presupposed** if the practice becomes incoherent or impossible without it. It is **consistent** if the practice works well with it, but could theoretically function under a different metaphysical view.

  #### 1. Planetary Protection
  *   **Presupposed:** **C4 (Epistemic Precaution).** The practice *strictly requires* that we treat uncertainty as risk. If we required a confirmed definition of life before sterilizing, the mission would fail (you cannot sterilize after launch). The practice presupposes that *risk* is the operative category, not *ontology*.
  *   **Consistent (but not required):** **C1 (Natural Kind).** The agencies act *as if* there is a sharp boundary (sterilize vs. don't), but they do not strictly require one. They could operate on a probability spectrum (e.g., "70% chance of replicating chemistry"). The binary protocol is an administrative convenience, not a metaphysical necessity.
  *   **Consistent (but not required):** **C2 (Universal Hazard).** They do not need to assume *all* life is dangerous, only that *unknown* life is presumptively dangerous.

  #### 2. Virology
  *   **Presupposed:** **C6 (Functional Biology).** This is the most philosophically revealing commitment. Virology *strictly requires* that the domain of "Biology" is broader than the domain of "Life." If one presupposed that only "Living Things" are valid subjects of biology, virology would be incoherent. The practice presupposes a **functionalist** metaphysics: things that behave like biological agents (evolve, infect) are treated as such, regardless of essence.
  *   **Consistent (but not required):** **C5 (Metabolic Essentialism).** Virologists often verbally endorse this (saying viruses aren't alive), but their practice shows this is merely rhetorical. They could abandon the word "life" entirely and just study "replicating molecular systems" without changing their lab work.
  *   **Consistent (but not required):** **C7 (Taxonomic Pragmatism).** Keeping viruses off the Tree of Life is consistent with a phylogenetic view, but regulating them as biohazards is consistent with a pathological view. The tension is managed by separating *taxonomy* from *biosafety*.

  #### 3. Synthetic Biology
  *   **Presupposed:** **C9 (Replication Threshold).** Dual-use policy *strictly requires* that autonomous replication is the proxy for risk. If non-replicating systems posed the same systemic risk (e.g., a toxin that doesn't replicate but is infinitely stable), the current regulatory focus on "creating life" would be insufficient. The practice presupposes that **evolutionary potential** is the primary vector of danger.
  *   **Consistent (but not required):** **C8 (Creationism).** The rhetoric of "creating life" is consistent with the practice, but not required. They could describe it as "assembling self-sustaining chemical systems." The "spark of life" narrative is sociological, not operational.
  *   **Consistent (but not required):** **C10 (Dual-Use Ontology).** This is a policy heuristic. It is consistent with the practice, but a graded view of risk might show that some non-replicating systems (e.g., prions or stable toxins) warrant similar concern.

  ---

  ### Part 3: Analysis of the Patchwork

  #### Is the Patchwork Internally Consistent?
  **Metaphysically: No. Operationally: Yes.**

  If we look for a single theory of life that satisfies all three, we fail.
  *   Planetary Protection treats unknowns as "Life" (to be contained).
  *   Virology treats knowns as "Non-Life" (to be studied/contained).
  *   Synthetic Biology treats engineered replicators as "Life" (to be regulated).

  However, if we strip away the word "Life" and replace it with **"Hazardous Autonomous Replication,"** the patchwork becomes coherent.
  *   **Planetary Protection:** Worried about *unknown* hazardous replication.
  *   **Virology:** Worried about *known* hazardous replication (even if parasitic).
  *   **SynBio:** Worried about *engineered* hazardous replication.

  The institutions are not disagreeing on the metaphysics of life; they are agreeing on the **politics of replication.** They have quietly shifted the ontology from *Substance* (what it is) to *Capacity* (what it does).

  #### Is BSL-4 Coherent Without a Definition?
  **Yes.** You asked what the facility would do with a "self-replicating non-metabolizing structure." The answer is: **Exactly what it does with a virus.**

  The BSL-4 protocol does not test for "Life." It tests for **containment integrity.** The filters, airlocks, and showers are designed to stop *particulates* and *agents* from escaping. Whether the agent inside is metabolizing is irrelevant to the HEPA filter. The facility is coherent because it is designed for **epidemiological risk**, not **ontological status**.

  The NASA working definition ("self-sustaining chemical system capable of Darwinian evolution") is **operationally underdetermined**. It changes nothing because:
  1.  **Detection:** We cannot currently detect "Darwinian evolution" in a sealed sample quickly enough to inform containment protocols.
  2.  **Precaution:** If a sample *might* evolve, it goes in BSL-4. If it *does* evolve, it stays in BSL-4. The definition only matters for the press release, not the airlock.

  #### What Would Change with a Graded, No-Sharp-Boundary View?
  If we explicitly replaced the implicit "Life/Non-Life" binary with a **graded capacity view** (e.g., a spectrum of Replicative Autonomy and Evolutionary Potential), concrete changes would occur:

  1.  **Regulatory Shift (SynBio):** Currently, regulation triggers on "recombinant DNA" or "select agents." A graded view would regulate based on **evolutionary rate** and **horizontal transfer potential**. A synthetic organism with a "kill switch" (low evolutionary potential) might be regulated less strictly than a virus with high mutation rates, even if the former is called "life" and the latter "non-life."
  2.  **Sampling Protocols (Planetary Protection):** Instead of "Sterilize everything," we might see **Risk-Graded Sterilization**. If a probe lands on an ice moon (high potential for graded life), it is sterilized to Level A. If it lands on dry rock (low potential), Level B. Currently, the binary "Is there life?" forces a worst-case assumption everywhere. A graded view allows for probabilistic resource allocation.
  3.  **Virology Taxonomy:** We would stop apologizing for viruses not being "alive." The Tree of Life would be explicitly relabeled the "Tree of Cellular Organisms," and viruses would be mapped on a parallel "Network of Genetic Exchange." This reduces conceptual confusion in education and public policy.

  ### Conclusion: The Institutional Metaphysic

  The institutions you cite do not presuppose that Life is a Natural Kind. If they did, Virology would be a category error, and Planetary Protection would be paralyzed by definitional debates.

  Instead, these institutions presuppose a **Pragmatic Realism regarding Risk.**
  *   **Ontology:** They act as **Functionalists**. An entity is treated as "biological" if it replicates, evolves, or interacts with cellular machinery.
  *   **Epistemology:** They act as **Precautionary Principle** adherents. Uncertainty regarding the boundary is resolved by assuming the highest risk category.
  *   **Normativity:** The word "Life" is doing **normative work**, not descriptive work. To call something "Life" in these contexts is to say "This entity commands respect, caution, or containment."

  The patchwork is consistent only if we understand that "Life" in these documents is not a metaphysical claim about the universe, but a **deontological marker** for human safety. If we made this explicit, we would stop asking "Is it alive?" and start asking "What is its capacity for uncontrolled propagation?" That shift would not change the airlocks, but it would clarify the philosophy.
