  **MEMORANDUM FOR THE DIRECTORATE**

  **TO:** Central Planning Bureau, Senior Directorate
  **FROM:** Bureau of Statistical Synthesis
  **DATE:** 14 October 198X
  **SUBJECT:** Implementation of Directive 88-Alpha: Resolution of the Knowledge Aggregation Problem

  **1. Purpose**
  Recent intelligence summaries regarding bourgeois economic critiques, specifically the works of Ludwig von Mises and F.A. Hayek, have identified a technical bottleneck in our Five-Year Plan. Comrade Mises argues that rational calculation is impossible without private property prices. Comrade Hayek further contends that the requisite data for such calculation is not objective statistics, but dispersed, tacit knowledge of "particular circumstances of time and place."

  The Bureau rejects the conclusion that socialism is impossible. Instead, we classify this as a data acquisition failure. If knowledge is dispersed, the solution is centralized collection. Accordingly, effective immediately, the Bureau is establishing the Knowledge Acquisition Department (KAD).

  **2. Methodology: Form 10-B**
  The primary instrument of KAD will be Standardized Form 10-B ("Declaration of Localized Contextual Variables"). All enterprise managers and household heads are required to submit this form monthly. 

  Section 4 of Form 10-B requires citizens to articulate knowledge they may not yet realize they possess. Prompts include: "List all potential substitutes for allocated inputs based on intuition," and "Describe machine inefficiencies known only to the operator due to auditory cues." We recognize the epistemological difficulty in codifying tacit knowledge. However, if a citizen knows how to fix a machine by listening to it, that knowledge exists. Therefore, it can be written down. Failure to report such intuition will be treated as hoarding information from the State.

  **3. Case Study: The Tin Shortage**
  The urgency of this directive is illustrated by the current tin shortage (see Appendix B). Production halted because the central inventory showed zero available tin. However, post-mortem analysis suggests three tons of tin plating existed at Factory 42. The floor manager knew this because he walked past the drums daily, but he never filed a report because the drums were in a hallway, not a warehouse. 

  This knowledge was real but uncentralized. Under Directive 88-Alpha, the floor manager would have been required to log the hallway drums on Form 10-B, Section 2 (Unexpected Spatial Allocations). The shortage was not a failure of resources, but a failure of filing.

  **4. Dissenting Opinion and Rebuttal**
  Deputy Director Vance has attached a note (Attachment 2) proposing we adopt the Lange-Lerner model. He suggests the Bureau act as a Walrasian auctioneer, setting initial prices at random and adjusting them based on observed surpluses and shortages until equilibrium is reached. He argues this simulates the market mechanism without requiring perfect prior knowledge.

  While Comrade Vance's proposal is mathematically elegant, it is politically untenable. The Lange model admits that the Planner does not know the correct prices initially. It surrenders the economy to a trial-and-error process driven by consumer demand rather than Plan directives. If we simply react to shortages, we are followers, not leaders. Furthermore, relying on price signals implicitly accepts Hayek's premise that knowledge cannot be gathered directly. We must not simulate the market; we must replace it with superior data processing.

  **5. Directives**
  All regional offices must distribute Form 10-B by Friday. Citizens should be reminded that tacit knowledge is State property. If a citizen claims they "just know" something but cannot write it down, they must attempt to know it louder until it becomes legible.

  The calculation problem is solvable through sufficient paperwork.

  **Signed,**
  *Director A. Rostov*
  *Bureau of Statistical Synthesis*
