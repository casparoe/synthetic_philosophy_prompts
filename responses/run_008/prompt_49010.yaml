      *   *Idea 2:* "Will this user like it" vs. "Is it good."
          *   *Critique:* In ML, these are the same objective function (personalized CTR). In Philosophy, they are distinct (Subjective vs. Objective/Intersubjective). The system *cannot* answer "Is it good" because "Good" is not defined in the schema. The system collapses the distinction by design.

