      *   *Refinement on Idea 1:* The user thinks Acquaintance = Actual Rating. I need to correct this. Acquaintance is about the *justification path*, not just the target variable. In ML, training on your own data vs. training on global weights.
      *   *Refinement on Idea 2:* "Is it good" implies a universal latent space. "Will they like it" implies a personalized projection. The system assumes the universal space exists (track embeddings) but optimizes for the projection. The tension is real.

  9.  **Final Review against constraints:**
