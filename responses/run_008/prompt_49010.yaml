      *   *Clean Translations:* Justification $\rightarrow$ Confidence Intervals/Log-Likelihood. Acquaintance $\rightarrow$ Online Inference/Real-time Feedback.
      *   *Distortions:* "Understanding" doesn't map to "Prediction Accuracy." Philosophy cares about *why* it's good; ML cares about *that* it will be clicked.
      *   *Inexpressible:* Normative force ("ought to like"). ML describes *is*, Philosophy prescribes *ought*. The "phenomenology" of listening (qualia) is reduced to a binary event or dwell time.
      *   *Direction of Failure:* The ML vocabulary misses the *normative* and *phenomenological* dimensions. It's not that philosophy is unclear; it's that ML optimizes for a proxy that deliberately ignores those dimensions.

