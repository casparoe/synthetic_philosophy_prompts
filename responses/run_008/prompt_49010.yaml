      *   *Pessimists (Acquaintance Principle/Empiricism):* Hopkins, Wollheim, Kant (sort of). You need first-hand experience. Testimony gives belief, not knowledge/judgment.
          *   *Arguments:* Normative (aesthetic judgment requires autonomy), Epistemic (testimony lacks the right kind of evidence), Phenomenological (you miss the "what it's like").
      *   *Optimists (Anti-Individualism/Reductionism):* Coady, Moran, some social epistemologists. Testimony works in aesthetics just like in science/history.
          *   *Arguments:* Consistency (why treat aesthetics differently?), Expertise (critics know more than me), Practicality (can't experience everything).
      *   *Moderates/Hybrids:* Testimony gives *justification* but not *understanding*, or gives knowledge but not *taste*.
      *   *Key Distinction:* Belief vs. Knowledge vs. Understanding vs. Taste.

  3.  **Translating to ML/Data Science Vocabulary:**
      *   *Acquaintance Principle:* "Ground Truth" requires direct observation (logging an event). Inference without interaction is just a prior, not a posterior. The "loss function" can only be evaluated on the user's device during playback.
      *   *Optimism (Testimony):* Collaborative Filtering *is* institutionalized testimony. If the cluster says it's good, the probability of high engagement is high. Knowledge = High Confidence Prediction.
      *   *The "Value" Problem:* Engagement (skip rate) $\neq$ Quality (Latent Variable).
