          *   Optimist $\rightarrow$ "Transfer Learning/CF." Weights from the global model transfer to the local node.
          *   The "Value" gap $\rightarrow$ Proxy vs. Latent Construct.
      *   *Residue:*
          *   What fits: Uncertainty, Data Sparsity.
          *   What breaks: Normativity (Ought), Qualia (The feeling of the sound), Autonomy (The act of choosing).
          *   Verdict on Failure: ML vocabulary is *normatively blind*. It's not a bug, it's a feature of optimization.
