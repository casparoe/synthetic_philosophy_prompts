answer: |-
  **The Scenario**

  John, a 40-year-old with two minor misdemeanor convictions from a decade ago, is convicted of criminal mischief for burning a single empty dumpster behind a restaurant, causing $800 in damage. While the act itself caused no injury and minimal financial loss, it occurred during a week of highly publicized copycat arsons that have terrified the local population and depressed property values. The prosecution argues that sentencing John to ten years is necessary to signal zero tolerance and halt the epidemic, citing models suggesting such a sentence would prevent fifty future arsons and millions in losses. John's defense notes he acted alone, has no history of violence, and that the dumpster fire was a momentary lapse rather than part of a coordinated plot, with no evidence he intends to reoffend.

  ***

  **The Analysis**

  **Recommendations:**
  The **retributivist** recommends a light sentence (e.g., probation or under one year). Retributivism ties punishment to *desert*, which is anchored in the blameworthiness of the agent and the gravity of the offense. Even confronting the "cumulative escape"—the idea that John's past misdemeanors add to his current desert—the retributivist maintains a ceiling of *ordinal proportionality*. Burning a dumpster is objectively less grave than assault or grand larceny; therefore, even aggregating his current act with his decade-old record, the total desert cannot exceed the penalty for a serious felony without violating the moral requirement that punishments rank crimes accurately. Ten years for a dumpster fire treats John as a scapegoat, not a moral agent.

  The **consequentialist** recommends the harsh sentence (ten years). On a standard utilitarian calculus, the morality of punishment depends on net social benefit. The cost to John (10 years liberty) is outweighed by the prevention of fifty future arsons, the alleviation of public terror, and the preservation of property values. Since specific deterrence (John's likelihood of reoffending) is low, the justification rests entirely on *general deterrence* and *incapacitation*. The severity is not about what John *did*, but about what his punishment *does* for the city's safety metrics.

  **The Single Feature:**
  The feature doing the work is the **epidemic context** (the high marginal utility of deterrence due to copycat potential). This creates a divergence between the *harm of the act* (low, driving retributive desert) and the *cost of the crime wave* (high, driving consequentialist utility).

  **If Removed:**
  If the epidemic context is removed (i.e., John's act is isolated with no copycat risk), the consequentialist calculation collapses. The cost of imprisoning John for ten years no longer yields a preventative dividend, and the consequentialist recommendation drops to match the retributivist's light sentence (or releases him entirely if he poses no future threat). The divergence exists *only* because the social stakes of the moment exceed the moral stakes of the act.

  **The Consequentialist Counterattack:**
  Can the consequentialist recover the light sentence without smuggling in retributivism? She might argue for **Rule Consequentialism**: adopting a rule that "punishment must fit the crime" maximizes utility long-term by maintaining judicial legitimacy and preventing state tyranny. If the public perceives the sentence as unjust, social cohesion erodes, creating negative utility.

  However, this is a precarious defense. If the public *supported* the harsh sentence (e.g., in a panic-stricken city), the legitimacy argument fails, and the harsh sentence returns. To permanently block the harsh sentence, the consequentialist must admit a **side-constraint**: that individuals have a right not to be used merely as means, regardless of the utility gain. Once she admits this constraint, she has ceased to be a pure consequentialist. She has quietly capitulated to a retributive principle (proportionality as a right), acknowledging that there is a moral cost to punishing the innocent or the excessively guilty that cannot be traded off against social safety. Without this capitulation, consequentialism remains a license to sacrifice the individual for the statistical good.
