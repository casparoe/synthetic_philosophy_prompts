          *   *Actually, the cleanest way:* A first-time offender commits a minor crime. Consequentialists want harsh punishment for general deterrence because the crime is currently epidemic/high-profile. Retributivists say "you only deserve punishment for *this* act." The "cumulative escape" is the idea that "well, maybe he did other things" or "recidivism increases desert." I need to state clearly in the facts that this is an isolated incident and the offender has no relevant history, forcing the retributivist to look only at the act.
