          *   *Retributivist:* Current act + old record = max 1 year. 15 years is grossly disproportionate to the *act*.
          *   *Why does this close the cumulative escape?* Because even adding the old record, the desert ceiling is low. The consequentialist demand exceeds the *total* possible desert of the life history.

      *   *Decision:* I will use the **Salience/General Deterrence** case. It's the cleanest way to get Consequentialism to demand *extreme* harshness for a *minor* act. I will ensure the defendant has a minor record to force the retributivist to sum it up and *still* fall short of the consequentialist demand.

  3.  **Drafting the Analysis:**
      *   **Retributivist Recommendation:** Light. Based on ordinal proportionality. The crime is minor. Past record adds a bit, but not enough to match the consequentialist demand.
      *   **Consequentialist Recommendation:** Harsh. Based on marginal deterrence. The social cost of the crime wave outweighs the offender's suffering.
      *   **Single Feature:** The *epidemic context* (high social cost of copycats) vs. *low individual harm*.
      *   **Removal:** If the crime wave stops, consequentialist demand drops.
      *   **Counterattack:** Can the consequentialist save the light sentence? Only by adopting a "side constraint" (don't punish more than desert). If they do, are they still pure consequentialists? No, they are hybrid or covert retributivists.

  4.  **Refining the "Cumulative Escape" Constraint:**
      *   I need to be careful here. The prompt says: "confront the obvious retributivist escape — that desert can be counted cumulatively over a whole criminal record rather than offense by offense — and close it off."
      *   This means I cannot just say "he has no record." I must say "he has a record, but even counting that, the desert is low."
