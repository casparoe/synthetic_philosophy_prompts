answer: |-
  The pattern you have identified is indeed recognised in the literature, and it does have an established name. It is most commonly referred to as **the Revenge Problem** (or the phenomenon of **Revenge Paradoxes**).

  While the original sentence is the "Liar," the specific manoeuvre you describe—where a proposed solution provides the very vocabulary necessary to construct a new, fatal counter-example—is the hallmark of Revenge. The archetype of this is the **Strengthened Liar**, but "Revenge" is the broader term for the recursive dynamic you have spotted.

  Here is a precise map of the conceptual terrain, outlining what the term covers, its structural implications, and its boundaries.

  ### 1. The Name and Its Scope

  **The Term:** **The Revenge Problem**.

  **What it covers:**
  The label applies specifically to cases where a solution to a semantic paradox (like the Liar) introduces a new concept, distinction, or status to block the paradox, only for that new conceptual tool to be used to formulate a new paradox that the solution cannot handle.

  *   **Example:** If you propose that the Liar sentence is neither true nor false (a "gap"), the Revenge sentence is: *"This sentence is either false or a gap."* If it is true, it must be false or a gap (contradiction). If it is false or a gap, then what it says is the case, so it is true (contradiction).
  *   **The Crucial Feature:** The new paradox is not merely a different puzzle; it is *immanent*. It uses the diagnostic resources of the solution against the solution itself. As you noted, the successor is "tailor-made" for the resolution.

  **What it excludes:**
  The term does not apply to:
  *   **External objections:** Criticisms that rely on vocabulary or logical principles external to the proposed theory.
  *   **Unrelated paradoxes:** The emergence of a paradox in a different domain (e.g., a paradox of vagueness arising within a theory of truth) is not Revenge unless it exploits the specific machinery used to solve the truth paradox.
  *   **Simple inconsistency:** If a theory is simply contradictory without requiring a new self-referential sentence constructed from its own rules, that is a standard inconsistency, not Revenge.

  ### 2. Structural Inevitability vs. Case-by-Case Failure

  You ask whether this is merely an observation that particular solutions are incomplete, or something structural about the concept of truth. The consensus among logicians and philosophers of language leans heavily towards the latter.

  The Revenge Problem is generally taken to indicate a **structural limit on semantic closure**. This traces back to Alfred Tarski's Undefinability Theorem. Tarski showed that a language cannot contain its own truth predicate without becoming inconsistent, provided it follows classical logic.

  When a philosopher proposes a solution (e.g., "Truth is hierarchical"), they are effectively trying to rebuild a language that *can* talk about its own truth. The Revenge Problem demonstrates that the moment the theory allows you to express the concept it uses to block the Liar (e.g., "level," "grounded," "undefined"), that concept becomes subject to the same self-referential machinery that broke the original notion of truth.

  Therefore, the cycle is not merely a series of repairable bugs. It is widely interpreted as evidence that **truth is not a coherent, expressible property within the very language it governs**, at least not under classical logical constraints. Any account that attempts to fully define or classify truth within the object language will likely be vulnerable to a Revenge sentence formulated in that classification scheme.

  ### 3. Distinction from General "Slippage"

  You asked how this differs from the older, blunter point that "some sentence or other will always slip through whatever net is cast."

  *   **General Slippage (Incompleteness):** This suggests that our net has holes. There might be sentences we cannot categorise, but this could be due to the net being poorly woven or the domain being too vast. It implies a limitation of *coverage*.
  *   **The Revenge Problem:** This suggests the net is made of the wrong material. The problem is not that a sentence slips through; it is that the *threads of the net themselves* can be woven into a sentence that breaks the net. It is a limitation of *expressibility*.

  The Revenge Problem is stronger than general incompleteness. It asserts that the *criteria* used to catch the paradoxes are themselves paradoxical when reflected back upon the system. It is not that we failed to catch a fish; it is that the concept of "catching" cannot be consistently defined within the water.

  ### 4. The Case of Deflationism

  You ask how this bears on the view that 'true' is not a weighty property but a mere device of endorsement (Deflationism).

  Deflationism is not an escape from the cycle; it meets a successor built from its own notions.
  *   **The Deflationary Claim:** To say "P is true" is just to assert P. There is no deep property of truth.
  *   **The Revenge:** If the Liar sentence ("This sentence is not true") is defective or meaningless, then we cannot assert it. However, we can seemingly assert: *"The Liar sentence is not true."*
  *   **The Conflict:** If deflationism says "To say 'X is not true' is just to deny X," then saying *"The Liar sentence is not true"* is just to deny the Liar sentence. But if we deny it, we seem to treat it as a meaningful proposition capable of denial. If it is meaningless, we cannot deny it.
  *   **The Result:** Deflationists must restrict the rules of endorsement (e.g., "You can only endorse sentences that are well-formed"). But once they introduce a restriction (a "norm of assertion"), a Revenge sentence can be constructed: *"This sentence is not properly endorsable."*

  Thus, Deflationism does not quietly escape. It shifts the battleground from "truth" to "assertibility" or "acceptability," but the Revenge structure re-emerges targeting those normative concepts instead.

  ### 5. Boundaries and Boundary Cases

  Since "The Revenge Problem" is the standard term, I shall not coin a new one. However, to satisfy your request for edges, here is where the concept stops applying.

  **Boundary Case 1: The Non-Semantic Paradox**
  Imagine a theory of truth that solves the Liar by introducing truth-value gaps. Suppose someone then points out that this theory implies a contradiction in *arithmetic* (e.g., it proves $1=2$).
  *   **Verdict:** This is **not** Revenge. It is a standard inconsistency. Revenge requires the new paradox to be semantic and self-referential, utilising the specific *semantic status* (like "gap") introduced by the solution.

  **Boundary Case 2: The External Hierarchy**
  Imagine a theory says, "The Liar is false." A critic says, "But in Metalanguage M, we can see it is paradoxical."
  *   **Verdict:** This is **not** Revenge. This is Tarski's standard hierarchy. Revenge occurs only if the *object language* itself is claimed to be able to express the concept "paradoxical in Metalanguage M." If the theory admits it cannot express its own solution within the language it analyses, it avoids Revenge by sacrificing semantic closure. The Revenge Problem specifically targets theories that claim to be semantically closed (or nearly so).

  **Boundary Case 3: The Vagueness Sorites**
  Imagine a theory of truth solves the Liar. A critic then raises the Sorites Paradox (the paradox of the heap) regarding the word "true."
  *   **Verdict:** This is **not** Revenge, unless the Sorites is constructed *using the specific gap/level machinery* of the truth solution. If it is just a general problem of vagueness applying to many words, it is a neighbouring problem, not a Revenge paradox.

  ### Summary

  The pattern you have observed is **The Revenge Problem**. It is not merely a record of failed patches; it is widely regarded as a structural proof that a language cannot consistently contain its own semantic evaluation rules without restriction. It differs from general incompleteness because it is immanent: the solution breeds the counter-example. It applies to Deflationism by targeting the norms of assertion rather than the property of truth. It stops applying where the new paradox does not exploit the specific conceptual machinery of the proposed solution.

  In short, you have identified the central engine of contemporary debate in philosophical logic: the tension between **semantic closure** (the desire to say everything about truth) and **consistency** (the requirement that what we say does not contradict itself). The Revenge Problem is the name for the failure to hold both simultaneously.
