answer: |-
  Your hypothesis is astute: the stalemate persists because the combatants are not merely disagreeing about the extension of the word "true," but about the metaphysical and methodological costs of doing philosophy. To diagnose this precisely: the disagreement is **a clash of research programmes operating with different standards of evidence**, which generates a disagreement that *appears* substantive but is rooted in divergent criteria for ontological commitment.

  It is not merely verbal. If it were verbal, clarifying definitions would dissolve the tension. But the substantivist does not deny the equivalence schema; they deny its *sufficiency*. The deflationist does not deny that beliefs succeed; they deny that "truth" is the *explanans*. They agree on the phenomena (we generalize, we normativize belief, actions succeed) but disagree on the ontological price of admitting those phenomena into our best theory of the world.

  Here is the diagnosis supported by the battlegrounds you identified, followed by an assessment of progress and the debate's trajectory.

  ### 1. Diagnosis: Methodological Divergence

  The deflationist programme is driven by **ontological parsimony and logical transparency**. Its standard of evidence is: *Can we do the linguistic work without positing a robust property?* If the logical role of the predicate is exhausted by the schema, positing a "nature" is metaphysical bloat.

  The substantivist programme is driven by **explanatory realism and normative grounding**. Its standard of evidence is: *Does this concept play a causal or normative role that requires a real property to anchor it?* If truth figures in successful explanations or binding norms, it must correspond to something in the world that makes those explanations/norms valid.

  **Evidence from the Battlegrounds:**

  *   **General Endorsements (The Logical Device):**
      *   *Deflationist:* Uses the "blind endorsement" argument (e.g., "Everything the witness said is true") to show the predicate is a logical tool for infinite conjunction. The evidence is *expressive utility*.
      *   *Substantivist:* Counters that for the generalization to be valid, the individual claims must share a common feature that makes them endorseable. The evidence is *ontological unity*.
      *   *Diagnosis:* The deflationist sees a syntactic shortcut; the substantivist sees a semantic commonality. The disagreement is about whether logical convenience implies ontological thinness.

  *   **Normativity (The Aim of Belief):**
      *   *Deflationist:* Attempts to deflate the norm "believe only what is true" into "believe $p$ only if $p$." The standard is *internal coherence*.
      *   *Substantivist:* Argues that a norm requires a standard external to the belief itself to which the belief must answer. "Believe $p$ only if $p$" is a rule, but "Truth" is the *value* that makes the rule worth following. The standard is *normative realism*.
      *   *Diagnosis:* The deflationist treats norms as rules of a language game; the substantivist treats norms as relations to reality. They are using different metaphysics of normativity.

  *   **Explanation (Success and Truth):**
      *   *Deflationist:* Argues that "my action succeeded because my belief was true" is equivalent to "my action succeeded because I believed $p$ and $p$." The truth predicate adds no causal power. The standard is *causal exclusion* (only physical properties cause things).
      *   *Substantivist:* Argues that the *correlation* between belief and success across diverse contexts requires a unifying explanation, which is the property of truth. The standard is *inference to the best explanation*.
      *   *Diagnosis:* This is the crux. The deflationist demands a mechanistic causal story (where "truth" drops out); the substantivist demands a higher-order pattern explanation (where "truth" is the pattern).

  ### 2. What Would Count as Progress?

  Given that the impasse is methodological, a new distinction or a formal result about the schema will not solve it. Formal results (like Tarski's undefinability theorem) are already accepted by both sides but interpreted differently (deflationists see limits on substance; substantivists see limits on formalization).

  Progress would require a **worked case in which an attribution of truth explains something the schema cannot**, specifically one that survives deflationary reconstruction.

  *   **The Specific Test:** The substantivist needs to produce a case where the explanation *fails* if "true" is replaced by the disquotational schema.
      *   *Example:* In evolutionary epistemology, one might argue that organisms with "true" beliefs survived better than those with "false" ones.
      *   *Deflationary Reconstruction:* "Organisms with beliefs that $p$ survived better, where $p$."
      *   *The Progress:* If the substantivist can show that the *generalization* itself (the capacity to track reality) has causal efficacy that cannot be reduced to the specific contents ($p$, $q$, $r$...), then truth earns its keep as a property. If the deflationist can show that the evolutionary story works perfectly well by citing specific successful behaviors without invoking a general property of "truth," the substantivist position weakens.

  Currently, neither side has decisively won this test. Deflationists successfully reconstruct most logical cases, but struggle with broad normative or evolutionary generalizations. Substantivists posit explanatory power but struggle to define the property without circularity or mystery. Progress lies in tightening this specific explanatory gap.

  ### 3. Prognosis: Will the Debate End?

  You should expect the debate to **continue indefinitely**, though it will likely shift terrain rather than resolve.

  *   **Why it won't end:** The methodological divide reflects a fundamental tension in philosophy itself: the tension between **naturalism** (deflationism's home, seeking to minimize ontology to fit science) and **realism** (substantivism's home, seeking to preserve the objectivity of values and meanings). As long as philosophers disagree on whether norms and meanings must be "naturalized" to be real, they will disagree on truth.
  *   **Why it won't dissolve:** Unlike the verificationist attempt to dissolve metaphysics (which failed), the truth predicate is indispensable. We cannot stop using it. Therefore, we cannot stop asking what it does.
  *   **The Likely Shift:** The debate is already mutating into **pluralism** (e.g., Lynch, Wright). This view suggests that truth might be functional (substantivist intuition) but realized by different properties in different domains (deflationist intuition). This is a compromise, not a solution. It acknowledges the methodological clash by allowing both standards to operate in different contexts.

  **Honest Assessment:**
  The debate is a feature, not a bug, of contemporary metaphysics. It is the boundary line between those who think philosophy's job is to clean up language (deflationism) and those who think philosophy's job is to map the structure of reality (substantivism). Your hypothesis is correct: the claim that "truth has no nature" is indeed a claim about standards of explanation wearing a semantic costume. Until there is agreement on whether "explanation" requires causal mechanisms or functional roles, the debate will remain stalled, producing heat but little light.
