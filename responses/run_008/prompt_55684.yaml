answer: |-
  1. Elena, a freelancer, publicly commits to treating any threat to her worthless vintage spoon collection as a lethal attack on her livelihood, triggering a costly legal feud she is pre-committed to pursue. A delinquent client pays promptly to avoid triggering this feud, but a rival firm, seeing the public commitment, deliberately threatens the spoons to force Elena into the expensive litigation and bankrupt her, leaving her worse off than if she had remained uncommitted.

  2. The client predicts that withholding payment will trigger the pre-committed retaliation via the spoon clause, making the cost of coercion exceed the value of the withheld funds. Since the agent's policy is fixed and predictable, the rational choice for the client is compliance rather than confrontation.

  3. The rival firm identifies the spoon commitment as a low-cost lever, knowing that a trivial threat against the collection forces Elena into her own pre-committed, expensive retaliation protocol. Unlike the client, the rival profits not from the spoons but from the resource drain the commitment forces Elena to incur.

  4. The critical feature is the public visibility of the commitment combined with the surrogate issue's accessibility to unaligned third parties. If the commitment were private, the rival could not locate the lever, though the client would also cease to be deterred.

  5. A defender would argue agents should only adopt surrogate goals that are cryptographically secure or invisible to potential exploiters. This costs the theory its primary mechanism, since effective deterrence requires the threatener to accurately predict the policy, which visibility ensures.
