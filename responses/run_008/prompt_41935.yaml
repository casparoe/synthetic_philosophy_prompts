              *   Tails: Save Site B (Person 2 & 3 saved). Person 2 chance = 50%. Person 3 chance = 50%.
              *   Result: Person 1 has 50% chance. Persons 2 & 3 have 50% chance.
              *   Taurek says: Everyone should have an equal chance. Here, everyone has a 50% chance.
              *   Utilitarian says: Save the 2. (100% chance for 2 people).
              *   Weighted Lottery: Give everyone 1/3 chance? No, that means 33% for everyone.
              *   The prompt wants students to notice: "the coin treats the pair as a single claimant, while a lottery over persons gives all three a third each."
              *   Okay, I need to make sure the mechanics allow for this distinction to emerge.

  3.  **Drafting the Materials:**
      *   *Cards:* Need names, brief human details.
      *   *Rounds:*
          1.  1 vs 1 (The Control).
          2.  1 vs 2 (The Pivot).
          3.  1 vs 5 (The Pressure).
          4.  1 vs 35 (The Absurdity/Threshold).
      *   *Decision Mechanism:* They must choose: Save Group A, Save Group B, or Flip.
      *   *Seeding:* If they don't catch the 1v2 math, I need a plant or a prompt. A "Technical Advisor" role assigned to a strong student? Or just a Socratic nudge from Dispatch (me). The prompt asks "tell me how to seed the room." I'll suggest assigning a "Logistics Officer" role who tracks probabilities.

  4.  **Developing the Debrief:**
      *   Map rounds to theory.
      *   Address the voting shift (Round 3/4).
      *   Threshold Hunt (Write down $n$).
      *   Honest limitations (no real death, no personal cost).

  5.  **Refining the Payoff:**
      *   Students care about grades, but also about looking consistent/smart.
      *   Let's create a "Committee Record." If they are inconsistent (e.g., save the many in Round 4 but flip in Round 2 without a principled distinction), they lose "Credibility."
      *   Actually, keep it simple. The payoff is the *discussion*. But to satisfy the prompt ("score they'll actually care about"), let's use a "Budget" system. They start with 100 Fuel Units. Every flip costs 5 units (indecision/hesitation). Saving the many gains "Survivor Credits." High score = Extra credit point? No, too transactional. High score = "Department Commendation" (public recognition) + small tangible reward (nice coffee/tea next class). Let's go with "The Chancellor's Citation" – a printed certificate for the class if they meet a certain consistency/survival metric. It sounds bureaucratic and silly but groups rally around it.

  6.  **Addressing the "Voting" Issue:**
      *   If they start voting, they are aggregating preferences. This *is* counting numbers (of committee members), not casualties.
      *   Instruction: Let it ride. It's a feature, not a bug. It reveals that *procedural* democracy often smuggles in *consequentialist* math.
      *   Debrief: Point out that majority vote = numbers counting.

  7.  **Identifying Risks (Honest Notes):**
      *   *Risk 1:* Gamification trivializes death. (Mitigation: Tone of Dispatch).
      *   *Risk 2:* They just utilitarianize immediately. (Mitigation: Emphasize the "Fairness" constraint in the briefing).
      *   *Risk 3:* The 1v2 math goes over heads. (Mitigation: The Logistics Officer role).
      *   *Risk 4:* Time management. 90 mins is tight for 4 rounds + debrief.

  8.  **Confidence Check:**
      *   High confidence on structure.
      *   Low confidence on the "1v2 Math Insight" happening organically without heavy scaffolding. This is the soft spot. Students often gloss over probability mechanics in favor of moral intuition.

  9.  **Writing the Response:**
      *   Tone: Professional, pedagogical, slightly conspiratorial (colleague to colleague).
      *   Structure: Setup, Materials, Rounds, Payoff, Debrief, Honest Notes, Confidence.

