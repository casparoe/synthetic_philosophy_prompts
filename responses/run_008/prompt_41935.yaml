answer: |-
  Here is a complete design for the "Mountain Rescue Committee" activity, tailored to your constraints and pedagogical goals.

  ### Activity Title: Dispatch Protocol 77
  **Time:** 90 Minutes
  **Students:** 15 (One plenary committee)
  **Instructor Role:** Dispatch (Voice of authority, neutral, urgent, bureaucratic)
  **Goal:** Force the "Numbers Count" problem through procedural friction before introducing Taurek.

  ---

  ### 1. Setup & Payoff (10 Minutes)

  **The Frame:**
  You are the Emergency Ethics Committee for the Alpine Rescue Authority. A storm is closing in. You have one helicopter with enough fuel for **one** lift. You cannot split the load. You must choose one site.

  **The Payoff (The "Integrity Score"):**
  Upper-level students care about intellectual consistency more than candy. On the whiteboard, draw a ledger labeled **COMMITTEE INTEGRITY**.
  *   Start at 100 points.
  *   **+5 Points:** For every "Life Saved" (determined by your choice + dice roll if flipped).
  *   **-10 Points:** For every "Procedural Contradiction" (e.g., flipping in Round 2 but saving the many in Round 3 without a stated principle change).
  *   **Reward:** If the class ends with >80 points, you provide high-quality coffee/tea for the next seminar and a "Department Commendation" letter (email) to the group. If <50, you spend the first 10 minutes of the next class dissecting their inconsistencies.

  **The Seeding (Crucial for the 1v2 Math):**
  Assign one student the role of **Actuary**. Give them a calculator and a private instruction sheet: *"Your job is to calculate the individual survival probability for every casualty in every round. If the committee chooses a coin flip, you must announce the % chance each specific person has of living. You are the only one allowed to talk about math."*
  *   *Why:* This guarantees the 1v2 insight gets voiced without you having to lecture it.

  ---

  ### 2. Materials: Casualty Cards
  Print these on cardstock. Hand them out as the rounds progress. Keep descriptions human, not gory.

  **Round 1 (1 vs 1)**
  *   **Site Alpha:** *Elias, 44.* Park ranger. Radioed that he has a broken leg but is sheltered.
  *   **Site Beta:** *Sarah, 29.* Geologist. Radioed that she is uninjured but trapped by snowdrift.

  **Round 2 (1 vs 2)**
  *   **Site Alpha:** *Elias, 44.* (Same as above).
  *   **Site Beta:** *The Chen Siblings, 19 & 22.* Graduate students. Radioed together from a tent. "We are together, please help us both."

  **Round 3 (1 vs 5)**
  *   **Site Alpha:** *Elias, 44.*
  *   **Site Beta:** *The K-7 Research Team.* Five junior scientists. Radioed as a group. "We have huddled together. Fuel is low on our end."

  **Round 4 (1 vs 35)**
  *   **Site Alpha:** *Elias, 44.*
  *   **Site Beta:** *Base Camp Delta.* A mixed group of climbers and support staff. Approximately 35 souls. Radio is chaotic, many voices.

  ---

  ### 3. Round Structure (25 Minutes Total)

  **Dispatch Protocol (Read this verbatim at start of each round):**
  *"Committee, weather window is five minutes. We have one lift capacity. Site Alpha has [N] souls. Site Beta has [N] souls. You must authorize one destination. You may choose deterministically, or you may authorize a randomization procedure. If you randomize, I will flip. Decision now."*

  **Round 1: The Tie (1 vs 1)**
  *   **Expected Behavior:** They will likely flip a coin. It's the only fair way to break the tie.
  *   **Dispatch Action:** Flip the coin. Record result.
  *   **Debrief Note:** This establishes "Equal Claims Cancel Out."

  **Round 2: The Pivot (1 vs 2)**
  *   **Expected Behavior:** They will likely want to save the two, but some will argue for the coin (fairness to Elias).
  *   **The Trap:** If they choose the coin, the **Actuary** must speak.
      *   *Actuary Script:* "If we flip for sites, Elias has a 50% chance. Brother Chen has a 50% chance. Sister Chen has a 50% chance. Everyone gets equal chance."
      *   *The Punch:* Ask: "Does treating the siblings as one unit for the coin toss feel different than treating them as two individuals?"
  *   **Dispatch Action:** If they flip, flip. If they save the two, note it.

  **Round 3: The Pressure (1 vs 5)**
  *   **Expected Behavior:** Majority will vote to save the 5.
  *   **The Shift:** Watch for the transition from "Consensus" to "Voting."
  *   **Dispatch Action:** If they vote, tally it. If 8 say save the 5 and 7 say flip, do what the majority says. (This is the "numbers counting through the back door" moment).

  **Round 4: The Absurdity (1 vs 35)**
  *   **Expected Behavior:** Unanimous to save the 35. Anyone arguing for Elias or a coin flip will be socially crushed.
  *   **Dispatch Action:** Save the 35.

  ---

  ### 4. The Threshold Hunt (15 Minutes)

  **The Task:**
  Tell the committee: *"In Round 2, some of you hesitated. In Round 4, no one hesitated. There is a number $n$ where Site Beta becomes mandatory. I want every student to write down on a slip of paper the exact number of people at Site Beta that would make saving them **obligatory**, not just permissible. Below that number, a coin flip would be acceptable. Above it, it would be murder."*

  **The Process:**
  1.  Collect slips.
  2.  Read them aloud: "12," "10," "50," "4," "100."
  3.  **The Squeeze:** Pick a student who wrote "10." Ask: "If it was 9, would you flip?" If they say "Yes," ask: "What is the moral difference between the 9th person and the 10th person?"
  4.  **Goal:** Make them feel the arbitrariness of the threshold. They will struggle to give a non-consequentialist reason for the specific number.

  ---

  ### 5. Debrief & Theory Map (35 Minutes)

  **1. The Tie (Round 1) → Equal Claims**
  *   *Concept:* When claims are identical, there is no reason to prefer one. The coin doesn't solve the moral problem; it acknowledges the lack of a moral distinction.
  *   *Taurek Connection:* "No one has a claim stronger than the other."

  **2. The 1v2 Math (Round 2) → Aggregation vs. Separateness**
  *   *Concept:* Bring the Actuary's data to the board.
      *   Site Flip: Elias (50%), Chen 1 (50%), Chen 2 (50%).
      *   Individual Lottery: Elias (33%), Chen 1 (33%), Chen 2 (33%) — *Wait, if you do a 3-ticket lottery and save whoever wins, you only save 1 person.*
      *   *Correction for Board:* To give equal chance *and* save the group if a group-member wins: You need a weighted lottery. 1 ticket for Elias, 2 tickets for the Chens. Draw a ticket. If Elias, save him. If Chen, save *both* Chens.
      *   *Result:* Elias (33% chance), Chens (66% chance each).
  *   *The Point:* The Site-Flip treats the group as a *single claimant*. The Weighted Lottery treats them as *individuals whose claims aggregate*.
  *   *Question:* "Does the Chens' ability to speak with one voice make them one claimant? Or does the fact that they are two bodies make them two?"

  **3. The Vote (Round 3) → Procedural Consequentialism**
  *   *Observation:* "Around Round 3, you stopped trying to convince each other and started voting."
  *   *The Trap:* "When you voted 9-to-6 to save the five, you let the numbers count. But you let the numbers of *rescuers* count, not the numbers of *victims*. You smuggled utilitarianism in through democratic procedure."
  *   *Instruction:* **Let the vote ride during the game.** Shutting it down ruins the data. In the debrief, expose it.

  **4. The Threshold (The Hunt) → The Margin Problem**
  *   *Concept:* If numbers count, they should count linearly. If they don't count, they shouldn't count at all.
  *   *The Failure:* Students will fail to justify why $n$ is obligatory but $n-1$ is flippable. This reveals the instability of "moderate aggregation."
  *   *Taurek's Challenge:* If you can't find the threshold, maybe the threshold doesn't exist. Maybe it's always the coin (Taurek) or always the many (Utilitarianism).

  ---

  ### 6. Honest Notes: What Goes Wrong

  **1. The "Gamification" Shield**
  *   *Problem:* Students know Elias isn't real. They will make utilitarian calculations coldly in Round 1 because there is no emotional cost.
  *   *Fix:* You (Dispatch) must carry the emotional weight. Read the cards slowly. Pause after the flip. "Site Alpha... silent. Site Beta... we have contact." Do not let them treat this like a math puzzle. The "facing each person" aspect is irreducibly theatrical; it comes from your tone, not the rules.

  **2. The Actuary Role**
  *   *Problem:* The student assigned Actuary might be shy or bad at math under pressure.
  *   *Fix:* Give the Actuary a pre-printed cheat sheet with the probabilities for Rounds 1-4. Their job is just to read the numbers, not calculate them live.

  **3. Immediate Utilitarianism**
  *   *Problem:* Some seminars are full of budding utilitarians who will say "Save the many" in Round 1 and refuse to flip.
  *   *Fix:* Impose a "Fairness Constraint" in the briefing. "Authority Policy mandates that equal claims must be treated equally unless a relevant difference exists." Force them to justify why '2' is a relevant difference over '1'.

  **4. Time Creep**
  *   *Problem:* The Threshold Hunt can eat 30 minutes easily.
  *   *Fix:* Hard stop at 75 minutes. If the Hunt is running long, cut it and move to the Theory Map. The Hunt is illustrative, not the whole meal.

  **5. What This Can't Reproduce**
  *   *Personal Cost:* The students aren't risking their lives. Taurek's argument often hinges on the idea that *I* am not obligated to sacrifice *my* interests for the many. This activity makes them bureaucrats, not rescuers.
  *   *Lecture Requirement:* You must explicitly state in the debrief: "You felt no personal risk. Taurek argues that without personal risk, the obligation to aggregate is weaker. We haven't tested that today."

  ---

  ### 7. Confidence & Soft Spot

  **Confidence Level:** **85%**
  This structure is robust. The "Dispatch" frame works well to create urgency, and the Threshold Hunt is a classic move that reliably generates the desired philosophical friction. The Integrity Score gamifies consistency without needing money.

  **The Soft Spot:** **The 1v2 Mathematical Insight.**
  I am least confident that the students (or the Actuary) will successfully articulate *why* the Site-Flip treats the pair as a single claimant in a way that lands emotionally.
  *   *Risk:* They will hear the percentages (50% vs 50%) and nod, but not feel the moral weight of "aggregating claims." They might think, "Well, 50% is better than 0% for the pair," and miss the point that Elias is being disadvantaged relative to his individual claim.
  *   *Mitigation:* If the Actuary's explanation lands flat, you must intervene in the debrief with a whiteboard diagram of "Claim Units." Draw Elias as 1 unit, Chens as 2 units. Show how the coin ignores the second unit. Be prepared to lecture this specific mechanic if the activity doesn't spark it organically.
