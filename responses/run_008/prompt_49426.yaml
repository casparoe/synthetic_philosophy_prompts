answer: |-
  **Workshop Design: "The Envelope Problem"**
  **Target Question:** "Did Vendor X deliver Project Y on time?" Use a completed project where you know the truth but they don't.
  **Groups:** 4 teams of 3 analysts.
  **Materials:** 4 sealed envelopes. Each contains a different dataset summary (Class A: Vendor X history; Class B: All IT vendors; Class C: Internal projects; Class D: Industry averages). Crucial: Pre-test data so implied success rates differ significantly (e.g., 30%, 50%, 70%, 90%).
  **Rules:** 1. Use *only* provided data. 2. Output one % probability. 3. No outside knowledge or collaboration between teams.
  **Scoring:** Brier score against reality. Winner gets coffee cards.
  **Timeline:** Intro (10m), Calculation (30m), Reveal/Plot (20m), Debrief (30m).

  **Predictable Failures & Fixes**
  1. **Rebellion:** Participants argue data is irrelevant ("Vendor X doesn't count!"). **Fix:** Enforce constraint strictly: "You must calculate from this sheet." Treat as a simulation of mandated data.
  2. **Convergence:** Groups align numbers before revealing. **Fix:** Physically isolate teams. Collect numbers simultaneously on sticky notes.
  3. **Obvious Winner:** One dataset looks superior, reducing tension. **Fix:** Ensure ambiguity. Make Class A narrow/noisy, Class B broad/stable. The conflict must feel genuine.

  **Limitations (What You Must Supply)**
  The game assigns the class. Real work requires *choosing* it. The game misses the political stress of defending a class selection to stakeholders who want a specific answer. You must explicitly state: "In reality, no one hands you an envelope. You must pick the drawer. That choice is where the risk lies." The game also hides the cost of data gathering; in reality, some classes are expensive to construct.

  **Epistemic Status: Solutions**
  **Settled:** The "Outside View" (using classes) generally outperforms the "Inside View" (case-specific details) for reducing optimism bias (Kahneman/Lovallo evidence). Aggregating forecasts helps.
  **Contested:** There is no consensus algorithm for *which* class is correct when multiple overlap. Bayesian Model Averaging suggests weighting all classes, but requires priors (reintroducing subjectivity). Some philosophers argue the problem dissolves with sufficient causal modeling; others argue all modeling requires arbitrary binning. Do not promise a formula. Tell them: "We know we need classes; we don't know which one is 'true'." The literature is split between pragmatists (use what predicts best) and formalists (seek causal structure).

  **Debrief Mapping**
  1. Plot the 4 percentages on a whiteboard. Highlight the spread. Ask: "Which team was right?" (Answer: All followed instructions).
  2. Reveal the actual outcome. Show some were close, some wrong purely due to class selection.
  3. Name it: "The Reference Class Problem."
  4. Actionable Takeaway: Precision is illusory. Report ranges based on class sensitivity. Future process: Always run estimates against 2+ classes and report the variance. When stakeholders ask for one number, show them the envelope spread. Ask them: "Which risk profile do you prefer?" This shifts burden appropriately.
