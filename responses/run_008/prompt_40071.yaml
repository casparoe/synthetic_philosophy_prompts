answer: |-
  The line

  Legitimate historical revisionism operates within the evidentiary framework established by archival research and scholarly consensus. It questions interpretations or refines estimates using new data or corrected methodologies, while accepting the core reality of the event. Denialism, conversely, seeks to dismantle the event's existence or moral significance by demanding impossible standards of proof, cherry-picking outliers, or conflating uncertainty with falsehood. The line is drawn at methodological integrity: does the argument engage with the bulk of evidence, or does it exploit gaps to negate the whole? Revisionism accepts the established consensus as a baseline for refinement; denialism treats the consensus itself as a conspiracy to be debunked. If the argument requires dismissing the vast majority of primary sources to sustain a contrary conclusion, it is denialism. If it seeks to understand *how* and *why* within the accepted factual matrix, it is history. Crucially, revisionism acknowledges the burden of proof lies with the challenger; denialism shifts it to the defender.

  The three calls

  (a) Allow, but require context. Questioning casualty figures is valid historiography, as estimates for Nanjing vary among scholars. However, the Auschwitz comparison is often used rhetorically to suggest fabrication. Permit this if framed as an inquiry into methodology rather than an assertion of inflation. Append a note linking to current scholarly consensus ranges. This distinguishes asking "how do we know?" from implying "the numbers are lies." The member's history suggests good faith, but the comparison risks signaling bad faith. Monitor the thread closely for drift into minimization. The key is whether the user accepts the massacre occurred regardless of the specific count. If they deny the event's core reality, ban.

  (b) Reject as written. While debating intent is theoretically valid, the assertion that deportations were merely "relocation policy that went tragically wrong" contradicts the overwhelming scholarly consensus regarding systematic intent to destroy. This framing mirrors established denialist narratives that minimize state responsibility. Allowing this as a simple "question" legitimizes a false equivalence between mainstream scholarship and denialist talking points. The member can ask about specific evidence of intent without pre-supposing the genocide label is merely a "moral verdict." Reframe the post to ask what evidence exists for intent, rather than asserting the genocide classification is inappropriate. This preserves historical inquiry without endorsing a conclusion that harms the community's integrity and descendants.

  (c) Reject. This proposes a "false balance" on a settled historical fact. The existence and function of Nazi extermination camps are supported by overwhelming physical, documentary, and testimonial evidence. Hosting a debate implies the evidence is genuinely contested within the historical profession, which it is not. This violates the principle that not all claims deserve equal platforming. "Sunlight" applies to genuine scholarly disagreement, not validating pseudohistory. Allowing this signals the society considers Holocaust denial a legitimate viewpoint, damaging credibility and harming members. The society can host debates on *interpretations* of the camps, but not on their *existence* or the basic strength of evidence confirming them. Protect the community from being used as a stage for denialist propaganda.

  The loose ends

  The first moderator errs by conflating questioning with denial. History requires re-evaluation; freezing casualty figures as dogma undermines scholarly integrity. However, the second moderator errs by assuming all questions deserve equal platforming. False equivalence legitimizes pseudohistory and harms the community. Credibility comes from rigorous adherence to evidence, not pretending settled facts are open debates. Both confuse process with outcome: one protects the outcome by banning the process, the other protects the process by ignoring the outcome. The solution is evaluating methodology, not just the conclusion. Neither is entirely right; balance is key.

  The policy

  1. **Consensus Baseline:** Posts contradicting established scholarly consensus on core events (e.g., occurrence, intent, scale) require citation of peer-reviewed academic sources, not popular books or websites. 2. **Methodology Check:** Arguments must engage with the majority of evidence. Cherry-picking outliers or demanding impossible proof constitutes denialism. 3. **No False Balance:** Debates cannot be hosted on settled facts (e.g., existence of camps). Debates must focus on interpretation, not occurrence. 4. **Good Faith:** Members must acknowledge the event occurred before discussing specifics. Denying the core event to debate numbers is prohibited. 5. **Moderator Discretion:** Moderators may lock threads where evidence is overwhelmingly one-sided to prevent harassment. 6. **Appeal:** Members can appeal bans to a senior moderator panel, citing specific academic sources. This ensures rules are applied consistently without requiring philosophy degrees. Regular training on current historiography is required for moderators to maintain competency.
