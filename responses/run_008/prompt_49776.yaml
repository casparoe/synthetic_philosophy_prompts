prompt: |-
  I'm a software engineer with no formal philosophy background; I've been reading about moral luck on my own time and want to stress-test my understanding rather than collect textbook examples. Take the role of a professional philosopher working on moral responsibility, think carefully, and start with a brief brainstorm before committing to a scenario.

  Construct a thought experiment that isolates constitutive luck while holding the other kinds fixed. The specification: two agents in the same circumstances, performing the same act, with the same outcome, who differ only in how they came to have the character trait that explains the act — in one agent the trait was self-formed through a history of earlier choices, in the other it traces to something the agent never chose (early brain injury, upbringing, whatever you can make plausible). Constraints: a realistic everyday setting (no trolleys, no drunk drivers — I'm tired of the negligent driver case), the scenario itself confined to one paragraph, and no stipulated blame verdicts: whatever difference in blame or responsibility we're supposed to feel has to fall out of a natural reading of the scenario, not be announced in it.

  After the scenario: identify which of Nagel's categories of luck the case actually engages; address whether it genuinely isolates constitutive luck or whether the trait's history is just past circumstance, which would smuggle circumstantial luck back in; say which feature of the case is doing the work; and lay out how a defender of the control principle — someone who denies moral luck outright — would attack it. Finally, if you think the specification can't be met, or that it rests on a confused premise about what isolating constitutive luck would even amount to, tell me that plainly instead of producing something that only looks like it satisfies the brief.
