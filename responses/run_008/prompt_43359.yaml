answer: |-
  # Session Plan: The Centipede Game & Backward Induction

  **Course:** Upper-Level Seminar in Decision Theory / Philosophy of Economics
  **Class Size:** 14 Students (7 Pairs)
  **Duration:** 90 Minutes
  **Goal:** Students experience the tension between backward induction (BI) logic and actual strategic reasoning *before* encountering the formal theory.

  ---

  ## 1. Materials & Incentives

  **The Incentive Structure (Making Points Matter)**
  Do not use course grades (too regulated). Do not use trivial candy (too ignored).
  *   **The Prize:** One **$20 Coffee/Gift Card** for the pair with the highest *combined* score across both rounds.
  *   **The Stakes:** Announce at the start: *"At the end of class, we will sum your points from Round 1 and Round 2. The pair with the highest total score wins the gift card. If there is a tie, we flip a coin."*
  *   **Why this works:** It creates a "tournament" atmosphere. It is small enough to avoid university bureaucracy but significant enough to make students care about maximizing points rather than being "nice."

  **Physical Materials**
  *   **7 Printed Decision Sheets** (one per pair, see below).
  *   **7 "Rationality Contracts"** (for Round 2 only).
  *   **Projector/Board:** To display the Payoff Table permanently during play.
  *   **Timer:** Visible to the class.

  **The Payoff Table (Project this)**
  Keep it visible throughout. Use "Points."
  *   **Node 1 (Player A):** **TAKE** (2, 0) | **PASS** → Node 2
  *   **Node 2 (Player B):** **TAKE** (1, 3) | **PASS** → Node 3
  *   **Node 3 (Player A):** **TAKE** (4, 2) | **PASS** → Node 4
  *   **Node 4 (Player B):** **TAKE** (3, 5) | **PASS** → Node 5
  *   **Node 5 (Player A):** **TAKE** (6, 4) | **PASS** → Node 6
  *   **Node 6 (Player B):** **TAKE** (5, 7) | **PASS** → (6, 6) [Game Ends]

  *(Note: In every node, Taking yields more for the actor than Passing *if* the opponent Takes at the next node. This ensures BI holds.)*

  ---

  ## 2. Round-by-Round Procedure

  ### Introduction (10 Minutes)
  1.  **Pair Up:** Assign pairs randomly. Label them Player A and Player B (A moves first).
  2.  **Rules:** Explain the Centipede structure using the projected table.
      *   "A starts. You can Take the points listed for A, giving B the points listed for B. Game over."
      *   "Or you can Pass. The pot grows. It becomes B's turn."
      *   "If you reach Node 6 and B Passes, the game ends automatically at (6, 6)."
  3.  **Incentive:** Remind them about the Gift Card for the highest total score.
  4.  **Constraint:** "No talking during the game. Record your move on the Decision Sheet."

  ### Round 1: The "Blind" Game (15 Minutes)
  *   **Configuration:** Standard Centipede (6 Nodes). Anonymous/One-shot.
  *   **Instruction:** "Play once. Do not discuss your strategy with your partner. Make the choice that you think is best for you."
  *   **Action:** Pairs play. Collect Decision Sheets.
  *   **Expected Outcome:** Most pairs will Pass at least once. Many will reach Node 4 or 5. Some may unravel, but full unraveling (Take at Node 1) is rare among humans without training.

  ### Round 2: The "Rationality Contract" (15 Minutes)
  *   **Configuration:** Same Payoffs, Same Length. **New Twist.**
  *   **Instruction:** "Swap partners. New Pairings. Before you play, you must both sign the **Rationality Contract**."
  *   **The Contract Text:** *"I certify that for this game, I will act to maximize my own point total. I will assume my opponent is doing the same. I understand that 'being nice' reduces my score."*
  *   **Procedure:**
      1.  Both sign.
      2.  Exchange signed contracts (making the commitment *mutual*).
      3.  Play the game.
  *   **Expected Outcome:** This framing often induces "unraveling." By explicitly stipulating rationality and self-interest, you simulate *Common Knowledge of Rationality* (CKR). Students often feel logically compelled to Take earlier (Node 1 or 2) because they believe their partner is now "bound" by logic to Take at the end.

  ### Data Collection (5 Minutes)
  *   Tally the results on the board anonymously (e.g., "Pair 1 ended at Node 3," "Pair 2 ended at Node 1").
  *   Identify the Winning Pair for the prize.

  ---

  ## 3. The Debrief Script (45 Minutes)

  *Do not lecture. Use the Socratic method. Write student answers on the board.*

  **Phase 1: The Empirical Result (10 mins)**
  1.  **Instructor:** "Look at the board. Round 1: How many pairs reached Node 5 or 6?" (Likely many). "Round 2: How many ended at Node 1 or 2?" (Likely more).
  2.  **Instructor:** "Why did the behavior shift? You didn't change the payoffs. You didn't change the rules. You only signed a piece of paper."
  3.  **Student Prompt:** Ask a student who Took early in Round 2: "What changed in your thinking after signing the contract?"
      *   *Target Answer:* "I knew they *had* to take at the end, so I couldn't trust them to pass."

  **Phase 2: Reconstructing the Logic (15 mins)**
  *Select one specific game log from Round 2 where unraveling occurred (e.g., Player A Took at Node 1).*

  1.  **Instructor:** "Let's look at Pair 3. Player A Took at Node 1. Payoff (2, 0). If they had Passed, and Player B Passed, and so on... they could have gotten 6. Why Take 2?"
  2.  **Student A:** "Because I knew B would Take at Node 6."
  3.  **Instructor:** "Okay. Why would B Take at Node 6?"
  4.  **Student B:** "Because 7 is better than 6."
  5.  **Instructor:** "So B is rational. If B is rational at Node 6, what must A do at Node 5?"
      *   *Walk the class backward.* Establish that if CKR holds, Take at Node 1 is the *only* logical move.
  6.  **The Pivot Question:** "Now, look at Round 1. Many of you Passed at Node 1. You violated this logic. Were you being irrational?"
      *   *Let them argue.* Some will say "Yes, we left money on the table." Others will say "No, we were betting on cooperation."

  **Phase 3: The Paradox Emerges (20 mins)**
  *This is the core. Focus on beliefs at off-path nodes.*

  1.  **Instructor:** "Imagine a game where Player A Passes at Node 1. Now Player B is at Node 2."
  2.  **Instructor to Class:** "The Backward Induction argument says A *should* have Taken at Node 1. But A didn't. B is now holding a piece of information that the BI argument says is impossible: **A has deviated from rationality.**"
  3.  **Question to Student B:** "You are at Node 2. You know the logic says A should have Taken. But A Passed. Do you still believe A is rational?"
      *   *If they say Yes:* "If A is rational, why did they Pass? Maybe they made a mistake. Should you Punish them (Take) or Reward them (Pass)?"
      *   *If they say No:* "If A is not rational, can you trust the Backward Induction logic anymore? BI requires *both* players to be rational. If A isn't, does the logic that tells *you* to Take at Node 2 still hold?"
  4.  **The Knockout Point:** "The Backward Induction solution relies on **Common Knowledge of Rationality**. But the moment anyone Passes, that Common Knowledge is broken. The logic predicts the game ends at Node 1. But if the game *doesn't* end at Node 1, the premises of the logic have been falsified by the play itself. So, what do you do at Node 2?"
  5.  **Conclusion:** "The paradox isn't that humans are irrational. It's that the theory cannot tell a rational agent what to do at a node that the theory itself says should never be reached."

  ---

  ## 4. Honest Notes on Failure Modes

  **1. The "Politeness" Confound**
  *   **What happens:** Students Pass in Round 1 not because of strategy, but because they don't want to "steal" from a classmate.
  *   **Is it Noise?** Yes, but *pedagogically useful*.
  *   **Handling:** In the debrief, ask: "Did you Pass because you thought it was strategically optimal, or because you felt social pressure?" If they admit social pressure, point out that **Standard Game Theory assumes utility is only about points.** If utility includes "being nice," the payoffs on the board are wrong. This leads to a discussion on how we model utility functions.

  **2. The "We Refuted It" Trap**
  *   **What happens:** A pair cooperates to the end (6, 6) and claims they "proved Backward Induction wrong."
  *   **Is it Noise?** No, this is a category error.
  *   **Handling:** Correct them gently. "You proved that BI is a poor *predictor* of human behavior. Did you prove it is logically *invalid*? If your partner was a computer program guaranteed to maximize points, could you have gotten (6, 6)?" This distinguishes **Normative** (what should a rational agent do?) from **Descriptive** (what do humans do?) claims.

  **3. Confusion About the Table**
  *   **What happens:** Students misread whose turn it is or who gets which number.
  *   **Prevention:** Use color coding on the slide (Player A = Blue, Player B = Red). Walk through one example move before starting.

  **4. Round 2 Doesn't Unravel**
  *   **What happens:** Even with the Contract, students still cooperate.
  *   **Handling:** This is actually great data. It shows that **stipulating** rationality doesn't create **common knowledge** of rationality. They signed the paper, but they didn't *believe* the other person would actually follow it. Use this to explain how fragile CKR is.

  ---

  ## 5. Limits of the Activity (What You Must Supply)

  Be explicit with the students at the very end of the debrief. The activity cannot reproduce the following, and you must verbalize it:

  1.  **Ideal Rationality:** "None of you are the 'Agents' in the textbook. You have emotions, reputations, and altruism. The paradox assumes agents who care *only* about the numbers on the board. We can't instantiate that in a classroom."
  2.  **Common Knowledge:** "In the game, you didn't *know* your partner was rational. You hoped they were. The paradox requires that I know you're rational, you know I'm rational, I know that you know I'm rational, ad infinitum. The 'Contract' in Round 2 was a clumsy attempt to simulate this, but true Common Knowledge is a logical state, not a signed paper."
  3.  **The Off-Path Problem:** "The deepest philosophical problem is about **belief revision**. If the theory says 'Node 2 never happens,' the theory gives you no instructions for what to believe if you *are* at Node 2. The game showed you that you *had* to make something up (e.g., 'Maybe they made a mistake'). The formal theory doesn't tell you what to make up. That is the gap we will fill next week with [Kreps/Wilson/Aumann/etc.]."

