prompt: |-
  I'm one of three volunteer readers for the fiction slush pile at a mid-sized literary magazine — roughly ninety submissions a month, and between that and our day jobs we realistically get fifteen or twenty minutes with most pieces, five minutes when the queue backs up before an issue closes. Our verdicts constantly diverge and the arguments are circular: one reader says quality can't be argued because de gustibus non est disputandum, another says that's just an excuse for letting personal taste masquerade as judgment, and our editor keeps gesturing at Hume's "Of the Standard of Taste" — the idea that even though beauty has no demonstrable rules, some verdicts are simply wrong, and the standard is whatever properly qualified critics would converge on after enough delicacy, practice, and comparison. Great, but the essay gives me nothing I can actually run during a Tuesday night reading session.

  What I want is a decision procedure extracted from Hume that our team can follow: the questions to ask of a piece, in order, with what counts as a sufficient answer to each, where the procedure terminates in a rejection, where it terminates in an acceptance, and — this part matters — where it stops and hands the call to a human because what's left is a judgment call that no procedure should pretend to settle. His ideal critic has those five qualifications (delicacy, practice, comparison, freedom from prejudice, good sense, roughly), and I want the procedure to translate each into something checkable, not a vibe. I'm aware some parts won't survive translation — like the test of time, which seems useless prospectively since nothing submitted to us has stood the test of anything yet, and like the passage where he basically lets young readers off the hook for preferring love poetry, which suggests some disagreements are blameless and the standard just doesn't reach them. Be upfront about those limits rather than papering over them.

  Then run the procedure on three real-ish cases from our queue: a technically polished but formulaically sentimental story that two of us adored and one dismissed; a clumsy first effort with a genuinely striking central image; and a deliberately ugly, misanthropic piece that our most practiced reader insists is the best thing we've gotten all year. Include at least one case where the procedure gives the answer I won't like (I suspect the sentimental one is mine to lose), and tell me plainly what the procedure cannot do — where Hume's essay itself is indeterminate and any checklist built from it is judgment wearing a costume.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A volunteer reader for a mid-sized literary magazine fiction slush pile.
      *   **Context:** 90 submissions/month, 3 readers, 5-20 minutes per piece. High volume, low time.
      *   **Problem:** Divergent verdicts, circular arguments (subjectivity vs. objective quality), editor citing Hume's "Of the Standard of Taste" without practical application.
      *   **Goal:** A *decision procedure* extracted from Hume. Questions to ask, in order. Criteria for rejection, acceptance, and "human judgment call."
      *   **Requirements:** Translate Hume's 5 qualifications (Delicacy, Practice, Comparison, Freedom from Prejudice, Good Sense) into checkable items. Acknowledge limits (test of time, blameless disagreements). Run the procedure on three specific cases (Sentimental/Formulaic, Clumsy/Striking, Ugly/Misanthropic). Include an unpopular answer. Be honest about where the checklist fails.
      *   **Tone:** Pragmatic, intellectual but not academic, honest, slightly weary but committed to the task.

  2.  **Deconstruct Hume's "Of the Standard of Taste":**
      *   *Core Thesis:* Beauty is subjective (in the mind), but there is a standard of taste (in the object/critics). Some judgments are better than others.
      *   *The Ideal Critic:* Possesses five characteristics:
          1.  **Delicacy of Taste:** Ability to perceive small details and nuances.
          2.  **Practice:** Experience in contemplating the art form.
          3.  **Comparison:** Exposure to a wide range of works to gauge relative merit.
          4.  **Freedom from Prejudice:** Ability to set aside personal bias/historical context to meet the work on its own terms.
          5.  **Good Sense:** Reasoning ability to check the influence of passion/superstition.
      *   *The Verdict:* The joint verdict of such critics *is* the standard.
      *   *Limits:* Some disagreements are blameless (youth vs. age, temperament). The "Test of Time" is the ultimate arbiter but useless for new work.

  3.  **Drafting the Decision Procedure (The "Humean Slush Filter"):**
      *   *Constraint:* Must fit a 5-20 minute read. Cannot be exhaustive.
      *   *Translation:*
          *   *Delicacy:* Did the text sustain attention at the sentence level? Were details functional or decorative?
          *   *Practice:* Does the writer show control of the medium (pacing, POV, dialogue)?
          *   *Comparison:* Does this feel distinct from the hundreds of other submissions (cliché check)?
          *   *Prejudice:* Can I separate "I don't like this genre/theme" from "This is executed poorly"?
          *   *Good Sense:* Does the emotional payoff earn itself, or is it manipulative?
      *   *Structure:* A flowchart style.
          *   Step 1: Prejudice Check (Immediate disqualifiers based on reader bias).
          *   Step 2: Practice/Control (Technical competence).
          *   Step 3: Delicacy/Detail (Nuance vs. Bluntness).
          *   Step 4: Comparison/Originality (Cliché check).
          *   Step 5: Good Sense/Emotional Logic (The "Earned" ending).
          *   *Termination Points:* Reject (Fail Step 2), Accept (Pass Step 5 + Consensus), Human Call (Pass Step 2-4, Fail 5 or Diverge).

  4.  **Developing the Three Cases:**
      *   *Case 1: The Sentimental/Formulaic Story.* (User suspects this is their loss).
          *   *Humean Analysis:* High Practice (polished), Low Comparison (formulaic), Low Good Sense (unearned emotion).
          *   *Verdict:* Reject (despite popularity).
      *   *Case 2: The Clumsy/Striking Image.*
          *   *Humean Analysis:* Low Practice (clumsy), High Delicacy (the image), High Comparison (unique).
          *   *Verdict:* Human Call (Potential vs. Execution).
      *   *Case 3: The Ugly/Misanthropic Piece.*
          *   *Humean Analysis:* High Practice, High Good Sense (internally consistent), Low Prejudice (requires setting aside dislike of tone).
          *   *Verdict:* Accept (or strong Human Call).

  5.  **Refining the "Human Call" Section:**
      *   This is crucial. Hume admits some things aren't resolvable by rule.
      *   Where does the procedure stop? When the technicals are fine, but the *affect* diverges based on temperament.
      *   Acknowledge the "Test of Time" gap. We are guessing at longevity.

  6.  **Writing the Response:**
      *   *Intro:* Acknowledge the difficulty. Validate the editor's Hume citation but agree it's impractical without translation.
      *   *The Procedure:* Break it down into the 5 Humean filters, translated into slush-pile questions. Use "Stop/Go" logic.
      *   *The Cases:* Apply the logic rigorously. Ensure the "Sentimental" one gets the hard no, as requested.
      *   *The Limits:* Be honest about where Hume fails (new work, temperament clashes).
      *   *Tone Check:* Keep it professional but conversational. Avoid academic jargon where possible.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too long for a 5-minute read?
      *   *Fix:* Emphasize that these are heuristic gut-checks, not a rubric to score. They are "questions to hold in mind."
      *   *Critique:* Did I address the "Test of Time" limitation?
      *   *Fix:* Explicitly mention it in the "Limits" section.
      *   *Critique:* Is the "Sentimental" rejection clear?
      *   *Fix:* Frame it as a failure of "Good Sense" (manipulation vs. earned emotion).

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure extracted from Hume? Yes.
      *   Questions in order? Yes.
      *   Termination points? Yes.
      *   Translate 5 qualifications? Yes.
      *   Run on 3 cases? Yes.
      *   Include unpopular answer? Yes (Sentimental story).
      *   Tell plainly what procedure cannot do? Yes.

  9.  *(Final thought)*: Make sure to emphasize that Hume's "Standard" is about the *critics*, not just the text. So the procedure must also audit the *reader*.

  10. **Drafting the Content.** (Proceeds to generate response based on these steps).
answer: |-
  This is a noble and exhausting task. Your editor is right that Hume is the correct philosophical framework, but wrong to think the essay is a manual. Hume describes a *state of being* (the Ideal Critic), not a *checklist*. However, since you have five minutes and a queue that won't drain itself, we must operationalize theIdeal Critic into a triage protocol.

  Below is the **Humean Slush Filter**. It translates Hume's five qualifications into binary or ternary checks you can perform during a read. Following that, I have run your three cases through it.

  ### The Humean Slush Filter: A Decision Procedure

  **Premise:** You are not judging "Beauty." You are judging whether the text sustains the attention of a qualified observer without triggering known cognitive errors (prejudice, manipulation, clumsiness).

  #### Phase 1: The Prejudice Check (Freedom from Prejudice)
  *Hume: The critic must place themselves in the author's situation.*
  *   **Question:** Am I rejecting this because it violates my personal moral/political/aesthetic preferences, or because it fails its own internal logic?
  *   **Procedure:** Identify the piece's intent (e.g., "a grief story," "a satire," "a genre thriller"). If the piece succeeds at *that* intent, you cannot reject it for not being a *different* intent.
  *   **Termination:**
      *   **Reject:** If the piece fails its own stated or obvious intent (e.g., a comedy that isn't funny).
      *   **Proceed:** If you dislike the topic but acknowledge the execution matches the intent.

  #### Phase 2: The Competence Check (Practice)
  *Hume: The critic must have practiced the art to recognize skill.*
  *   **Question:** Does the writer demonstrate control over the medium (syntax, pacing, POV consistency), or are they fighting the language?
  *   **Procedure:** Scan for "friction." Is the friction caused by difficulty/complexity (good) or by confusion/clunkiness (bad)? Look for the "amateur tell": over-explanation, adverbs propping up weak verbs, dialogue that sounds like exposition.
  *   **Termination:**
      *   **Reject:** If the friction is clearly unintentional clumsiness. (Hume: "A clumsy effort is not a candidate for the standard.")
      *   **Proceed:** If the writing is technically secure, even if simple.

  #### Phase 3: The Nuance Check (Delicacy of Taste)
  *Hume: The critic must perceive small details and their relations.*
  *   **Question:** Do the details do double duty (atmosphere + character + plot), or are they decorative?
  *   **Procedure:** Pick three descriptive passages. Ask: If I remove this sentence, does the emotional resonance drop?
      *   *Yes:* The detail is functional (Delicacy present).
      *   *No:* The detail is padding (Delicacy absent).
  *   **Termination:**
      *   **Reject:** If the piece relies on generic descriptors ("beautiful eyes," "dark storm") without specific variation.
      *   **Proceed:** If the details feel observed rather than recalled from a database of tropes.

  #### Phase 4: The Cliché Check (Comparison)
  *Hume: The critic must compare the work to the canon of the genre.*
  *   **Question:** Have I read this exact emotional arc in the last 50 submissions?
  *   **Procedure:** Map the trajectory. (e.g., "Estranged father meets daughter, they fight, they hug, he dies.") Compare this to your mental library of published fiction.
  *   **Termination:**
      *   **Reject:** If the trajectory is formulaic *and* the ending is predictable. (Hume: "Imitation is the enemy of sentiment.")
      *   **Proceed:** If the trajectory is familiar but the *texture* is new, OR if the trajectory is novel.
      *   **Flag for Human Call:** If the trajectory is formulaic but the emotional impact is overwhelming (see Case 1).

  #### Phase 5: The Logic Check (Good Sense)
  *Hume: Reason checks the influence of passion. Emotion must be earned.*
  *   **Question:** Does the emotional climax follow from the preceding evidence, or is it demanded by the author?
  *   **Procedure:** Look at the final turn. Did the character *earn* this realization, or did the author force it via a plot device (death, accident, sudden epiphany)?
  *   **Termination:**
      *   **Reject:** If the emotion is manipulative (sentimental) rather than earned. This is a failure of Good Sense.
      *   **Accept:** If the emotion is earned and the previous four phases passed.
      *   **Human Call:** If the emotion is earned but divisive (e.g., misanthropy, ambiguity).

  ---

  ### The Limits of the Procedure
  Before applying this, acknowledge where Hume admits defeat. This checklist **cannot** resolve:
  1.  **Temperament:** Hume explicitly states that a young person preferring love poetry and an old person preferring philosophy are both right. If two readers diverge based on life experience, the procedure stops. That is a "Blameless Disagreement."
  2.  **The Test of Time:** We are judging new work. We cannot know if the "striking image" will rot in a week or last a decade. We are guessing at durability.
  3.  **The "Spark":** Hume says the standard is the *consensus* of ideal critics. If your trio of readers (acting as the proxy for the Ideal Critic) splits 2-1, the procedure has done its job. The split *is* the data.

  ---

  ### Running the Queue: Three Cases

  #### Case 1: The Sentimental/Formulaic Story
  *Description:* Technically polished, follows a standard redemption arc, two readers adored it, one (you) dismissed it.
  *   **Phase 1 (Prejudice):** Pass. You acknowledge it intends to be a heartwarmer.
  *   **Phase 2 (Practice):** Pass. It is polished. Syntax is clean.
  *   **Phase 3 (Delicacy):** Fail/Borderline. Details are functional but generic (the "trembling hand," the "faded photo"). They signal emotion rather than embodying it.
  *   **Phase 4 (Comparison):** Fail. You have read this arc 20 times this month. It is a known quantity.
  *   **Phase 5 (Good Sense):** **Fail.** This is the crux. Hume distinguishes between *sentiment* (earned feeling) and *sentimentality* (feeling demanded without sufficient cause). If the reconciliation happens because the plot needs to end, not because the characters changed, Good Sense flags it as manipulative.
  *   **Verdict:** **REJECT.**
  *   **Why you won't like it:** Two of your readers are responding to the *stimulus* (sad thing = sad feeling). Hume argues the Ideal Critic responds to the *construction* (how the sadness was built). If the construction is formulaic, the feeling is cheap. The procedure sides with you. The "adored" verdict is likely a failure of the Comparison check (they haven't read enough slush to recognize the formula).

  #### Case 2: The Clumsy First Effort with a Striking Image
  *Description:* Rough prose, pacing issues, but one central metaphor/image is genuinely haunting and new.
  *   **Phase 1 (Prejudice):** Pass.
  *   **Phase 2 (Practice):** **Fail.** The prose fights the reader. POV slips. Pacing drags.
  *   **Phase 3 (Delicacy):** Pass (in spots). That one image shows a capacity for delicacy.
  *   **Phase 4 (Comparison):** Pass. It feels unlike the others.
  *   **Phase 5 (Good Sense):** Indeterminate. The intent is there, the execution is not.
  *   **Verdict:** **HUMAN CALL (Lean Reject).**
  *   **Reasoning:** Hume values Practice highly. A "diamond in the rough" is not a diamond yet. However, Delicacy is the rarest trait.
  *   **Procedure Instruction:** Do not Accept. An Accept implies the work meets the Standard *now*. This work shows *potential* to meet the Standard. If your magazine does developmental edits, flag for revision. If not, Reject with a personal note. The procedure cannot justify publishing unfinished work, but it identifies the spark worth nurturing.

  #### Case 3: The Deliberately Ugly, Misanthropic Piece
  *Description:* Polished, original, but repellent in tone. Your most practiced reader loves it; others hate it.
  *   **Phase 1 (Prejudice):** **Critical Juncture.** The readers who hate it must ask: "Do I hate this because it is immoral, or because it depicts immorality?" If the piece is *critiquing* the misanthropy, or presenting it truthfully, rejecting it for "ugliness" is a Prejudice failure.
  *   **Phase 2 (Practice):** Pass. Your practiced reader confirms the technique is high-level.
  *   **Phase 3 (Delicacy):** Pass. The ugliness is specific, not cartoonish.
  *   **Phase 4 (Comparison):** Pass. It stands apart from the slush.
  *   **Phase 5 (Good Sense):** Pass. If the misanthropy is internally consistent and the characters act according to their nature, the logic holds.
  *   **Verdict:** **ACCEPT (or Strong Human Call).**
  *   **Reasoning:** Hume argues that "Good Sense" allows us to appreciate the artistry of a villain (like Milton's Satan) without endorsing the villainy. If the piece is technically masterful and internally consistent, "I don't like the vibe" is not a valid Humean rejection. It is a temperamental clash.
  *   **The Divergence:** If two readers reject based on "vibe" and one accepts based on "craft," the procedure identifies this as a **Blameless Disagreement**.
  *   **Action:** This goes to the Editor. The readers have functioned as the filter; the Editor must break the tie. Hume's "Standard" is the consensus of critics *over time*. You don't have time. The Editor acts as the tie-breaker for temperamental deadlocks.

  ### Where the Checklist is "Judgment Wearing a Costume"

  You asked for honesty about where this fails. Here it is:

  1.  **The "Good Sense" Trap:** Phase 5 is where the checklist collapses. Determining if an ending is "earned" or "manipulative" is itself a matter of taste. One reader's "earned tragedy" is another's "melodrama." The procedure names this judgment, but it cannot automate it.
  2.  **The Practice Bias:** The procedure favors the "Practiced" reader (Case 3). This is inherently elitist. Hume admits this. He believes the peasant *cannot* judge the art as well as the critic. If your volunteer team includes non-experts, their "Prejudice" might actually be valid reader response data that the "Practiced" reader has lost. The checklist privileges the expert, which might make your magazine sterile.
  3.  **The Time Compression:** Hume's standard relies on *deliberation*. You have 5 minutes. You are not testing the "durability" of the impression. You are testing the "immediacy" of the impression. A piece that lingers slowly (a slow burn) will fail the Slush Filter but might pass the Humean Standard. You are selecting for punch, not necessarily depth.

  **Summary Recommendation:**
  Use the filter to kill the bottom 50% (The Clumsy, The Prejudiced, The Cliché).
  Use the "Human Call" bucket for the top 20% (The Sentimental, The Ugly, The Ambitious Fail).
  Accept that for the middle 30%, the disagreement *is* the verdict. If you can't agree on it in 20 minutes, it isn't strong enough to force consensus. Publish the pieces that make you argue, not the ones that make you nod. Hume says the standard is convergence; but in a magazine, convergence often means "safe."

  Your editor wants Hume's Standard. You need Hume's Triage. The above is the latter. Use it to clear the pile, not to find truth.
