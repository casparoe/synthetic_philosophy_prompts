prompt: |-
  i teach metaphysics and every couple years i wrestle with whether the special composition question deserves two full weeks on the syllabus. before i decide, help me draw up the spec: what would an adequate answer to "when do some things compose a further thing" actually have to deliver? i want the desiderata, with the motivating case or consideration behind each. some things i suspect belong on the list: getting the obvious cases right or at least explaining why our intuitions about them are unreliable (a cat, a pile of sand, the cat plus one hair currently in my couch), being compatible with physics rather than positing composition-triggering facts physics knows nothing about, telling us something informative rather than just renaming the problem, and not collapsing under when we ask the same question about events, actions, or holes in addition to objects -- but you tell me which of these are real requirements and which are camp prejudices dressed up as constraints. also flag any pair you think is jointly unsatisfiable, and say which single desideratum does the most to knock out the standard answers (nihilism, universalism, restrictivism, the "life" criterion). don't bother scoring all the views against the full list, just that last part. a table is fine if you want.
