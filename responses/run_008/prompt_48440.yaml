answer: |-
  This is a great pedagogical pivot. The Special Composition Question (SCQ) is less about the answer (which is likely unknowable or verbal) and more about training students to feel the tension between ontological parsimony, common sense, and scientific naturalism.

  Here is the spec for an adequate theory of composition, distinguishing hard constraints from methodological preferences, followed by the tension points and the "knockout" blow.

  ### The Spec: Desiderata for a Theory of Composition

  | Desideratum | Motivation / Case | Status |
  | :--- | :--- | :--- |
  | **1. Folk-Alignment (or Error Theory)** | **Case:** There is a cat on the mat. There is no "cat-plus-loose-hair" object. <br>**Motivation:** A metaphysics that denies the existence of tables or cats requires a robust explanation of why we think there are. | **Hard Constraint** (You must either match the data or explain the error). |
  | **2. Naturalistic Non-Arbitrariness** | **Case:** Why do *these* atoms compose a cat, but adding one atom makes a non-cat? <br>**Motivation:** Composition conditions shouldn't rely on "magical" thresholds unknown to fundamental physics. There should be no brute, arbitrary cut-offs in nature. | **Hard Constraint** (Metaphysics must supervene on physics). |
  | **3. Non-Triviality** | **Case:** "Things compose when they compose." <br>**Motivation:** The answer must be informative. It must distinguish composition from non-composition using independent criteria (contact, life, bonding). | **Hard Constraint** (Otherwise it's not an answer). |
  | **4. Vagueness Intolerance** | **Case:** A cloud's boundary is vague. <br>**Motivation:** Existence cannot be vague (Lewis). There must be a sharp fact of the matter about whether $xs$ compose $y$. | **Camp Prejudice** (Contingent on accepting classical logic/semanticism over ontic vagueness). |
  | **5. Category-Neutrality** | **Case:** If atoms compose a cat, do events compose a war? Do holes compose a larger hole? <br>**Motivation:** Unity of theory. One principle of parthood for all domains. | **Camp Prejudice** (Many successful views treat material composition as distinct from event mereology). |
  | **6. Modal Robustness** | **Case:** Could *these* atoms have composed two cats instead of one? <br>**Motivation:** The conditions for composition should not be world-relative (avoids "contingent composition"). | **Soft Constraint** (Contingent composition is costly but not logically impossible). |

  ### Camp Prejudices vs. Real Requirements

  *   **Category-Neutrality is a Prejudice:** Demanding that the answer to the SCQ for material objects also solve the "special composition question for events" biases the syllabus against dual-category ontologies. It is perfectly coherent to hold that composition is univocal for substances but analogous for events. Dropping this frees students to consider that "composition" might be a family resemblance concept.
  *   **Vagueness Intolerance is a Prejudice:** This is the biggest hidden assumption in the Van Inwagen literature. If you allow ontic vagueness, Restrictivism becomes much easier to defend. If you demand sharp boundaries (as Lewis does), Restrictivism becomes nearly impossible. You should present this as a *choice* of logical framework, not a requirement for an adequate answer.
  *   **Folk-Alignment is a Requirement (with an escape hatch):** You cannot simply ignore the intuition that there are no "trout-turkeys." However, an adequate answer can fail this *if* it pays the price elsewhere (e.g., Nihilism fails this but pays in parsimony). The requirement is actually **Folk-Accountability**: match the intuition or explain the illusion.

  ### Jointly Unsatisfiable Pairs

  If you want to show students why this problem is a "wrestle," highlight these tensions. You cannot maximize both in either pair.

  1.  **Folk-Alignment + Naturalistic Non-Arbitrariness**
      *   **The Conflict:** Folk intuitions track vague, functional boundaries (a "pile" becomes a "heap" gradually; a "cat" loses hairs gradually). Fundamental physics describes sharp, precise states of fields/particles.
      *   **The Cost:** To satisfy Physics, you must reject Folk (Nihilism/Universalism). To satisfy Folk, you must posit vague objects or arbitrary cut-offs that physics doesn't see (Restrictivism).

  2.  **Non-Triviality + Naturalistic Non-Arbitrariness**
      *   **The Conflict:** To be *informative*, you need a condition (e.g., "when bonded," "when alive"). To satisfy *physics*, that condition must correspond to a fundamental joint in nature.
      *   **The Cost:** There are no "composition joints" in the Standard Model. "Bonding" is vague. "Life" is a functional/biological category, not a fundamental physical one. The only conditions that satisfy physics are "Always" (Universalism) or "Never" (Nihilism), but these feel trivial regarding the *structure* of the world.

  ### The Knockout Desideratum

  The single desideratum that does the most damage to the standard landscape is **Naturalistic Non-Arbitrariness** (specifically, the demand that composition conditions correspond to non-vague, fundamental physical facts).

  This is the engine of Van Inwagen's *Material Beings*. It forces the student into the corners. The "common sense" middle ground is where most students start, and this constraint is what dislodges them.

  **Casualty Table: The Impact of Naturalistic Non-Arbitrariness**

  | View | The Position | Verdict under this Desideratum | Why it Fails (or Survives) |
  | :--- | :--- | :--- | :--- |
  | **Moderate Restrictivism** | "Things compose when in contact/fastened." | **KNOCKED OUT** | Physics knows no sharp threshold for "contact" or "fastening." Electromagnetic fields decay gradually; there is no ontological switch that flips at 0.5nm distance. |
  | **Organicism (Life)** | "Things compose only when activity constitutes a life." (Van Inwagen) | **KNOCKED OUT** | "Life" is not a fundamental physical category. Viruses? Prions? The transition from non-life to life is evolutionary and vague, not a sharp metaphysical boundary. |
  | **Brutalism** | "Composition happens, but there's no general condition." | **KNOCKED OUT** | Violates **Non-Triviality** and **Non-Arbitrariness**. Posits brute composition facts that physics ignores. |
  | **Nihilism** | "Nothing ever composes anything (except simples)." | **SURVIVES** | No arbitrary cut-offs because composition never occurs. Consistent with physics (only simples exist). *Cost: Fails Folk-Alignment.* |
  | **Universalism** | "Any things always compose something." | **SURVIVES** | No arbitrary cut-offs because composition always occurs. Consistent with physics (just quantifies over pluralities). *Cost: Fails Folk-Alignment.* |

  **Pedagogical Recommendation:**
  If you only have one week, teach the **Folk-Alignment** tension (Cat vs. Cat+Hair). It's intuitive.
  If you have **two weeks**, use the second week to deploy **Naturalistic Non-Arbitrariness**. This shows students that saving the cat costs them the physics, and saving the physics costs them the cat. That is the metaphysical tragedy worth two weeks of syllabus space.
