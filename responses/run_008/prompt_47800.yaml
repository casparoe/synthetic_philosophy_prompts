      *   *Ambitious Conclusion (Down to thermostats):* This fails. It requires a specific theory of consciousness (panpsychism or strong functionalism) that is highly controversial. It conflates *information processing* with *valenced experience*. A thermostat regulates temperature; it doesn't *care* about temperature. The dimmer analogy breaks because "off" on a dimmer means no light, but the speaker implies "almost off" still means "some light/moral claim."

