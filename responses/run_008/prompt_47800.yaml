          4.  **Propose Alternatives:** If the dimmer fails, is there a better analogy?

  2.  **Task 1: Audit the Analogy (Mapping):**

      *   *Source Domain:* Electrical Dimmer Switch.
      *   *Target Domain:* Sentience and Moral Status.
      *   *Mappings:*
          *   Voltage/Current $\rightarrow$ Neural complexity / Nociceptor density.
