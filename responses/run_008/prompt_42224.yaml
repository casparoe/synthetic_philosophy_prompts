answer: |-
  ### 1. The Verdict
  Your friend will almost certainly judge the financial advisor to be **every bit as culpable as a liar.**

  She will view the advisor's statement not as a clever deflection, but as a breach of trust equivalent to an outright falsehood. Like the real-estate agent and the landlord, the advisor occupies a role of professional trust where the client relies on their expertise to assess risk. By offering a technically true statistic ("returned capital to date") that creates a false impression of stability while withholding material knowledge of risk ("loaded with illiquid junk"), the advisor violates the specific duty of transparency owed to the client.

  ### 2. The Implicit Rule
  The principle your friend is implicitly applying is the **Fiduciary Transparency Principle**:

  > *"Deliberate misleading via technical truth is morally equivalent to lying when the speaker holds a professional or contractual duty of care that obligates them to prioritize the listener's informed decision-making over their own technical accuracy."*

  In her view, the moral weight of misleading speech depends on the **relationship context**. In fiduciary relationships (agent/client, landlord/tenant, advisor/investor), the speaker is paid or positioned to manage risk for the listener. Therefore, omitting known risks to induce confidence is a betrayal of that specific duty. In non-fiduciary or adversarial contexts (politician/voter, child/parent), there is no such obligation to volunteer self-damaging information, so evasion is treated as a lesser offense.

  ### 3. Rival Rules
  Two other rules fit her track record just as well and could explain her judgments without relying on professional duty:

  *   **Rival A: The Subject Matter Rule (Safety vs. Culpability).**
      *   *The Rule:* Misleading is as bad as lying when the question concerns **external safety or risk** (flooding, bridge integrity, savings safety). It is less bad when the question concerns the **speaker's own guilt or blame** (taking bribes, breaking a vase).
      *   *Fit:* This perfectly matches the track record. The high-culpability cases (Agent, Landlord) are about physical/financial safety. The low-culpability cases (Politician, Child) are about personal exoneration.
  *   **Rival B: The Epistemic Access Rule (Verifiability).**
      *   *The Rule:* Misleading is as bad as lying when the truth is **hidden from the listener** (hidden flooding, structural cracks, illiquid assets). It is less bad when the listener **could reasonably verify the truth** (public donation records, observing the cat's location).
      *   *Fit:* In the Agent/Landlord/Advisor cases, the listener cannot easily discover the truth without the speaker's help. In the Politician/Child cases, the evidence is theoretically accessible to the questioner.

  ### 4. The Crucial Test Case
  To distinguish between your friend's **Fiduciary Rule** and the **Rival Rules**, you should present her with a case that combines a **Professional Relationship** (like the Agent) with a **Question of Culpability** (like the Politician).

  **The Case:**
  > A home contractor is hired to renovate a kitchen. The homeowner specifically asks, "Did you use the expensive copper piping I paid for, or did you swap it for the cheaper plastic?" The contractor knows he swapped it for plastic to increase his profit, but the plastic meets all building codes. He replies, **"The plumbing has passed all required city inspections."**

  **How the Verdicts Split:**
  *   **If she says "As culpable as a liar":** Her **Fiduciary Rule** wins. She believes professional duty overrides the "blame" aspect. The contractor's obligation to the client makes the evasion tantamount to theft/lying, regardless of the question being about his guilt.
  *   **If she says "Less culpable (naughty/evasive)":** Her **Subject Matter Rule** wins. She believes that questions about personal blame allow for evasion, even for professionals. Since the contractor is protecting himself from accusation (like the Politician), the misleading statement is less severe than a lie.
  *   **If she hesitates based on inspections:** Her **Epistemic Access Rule** might be at play. If she argues the homeowner *could* have hired an inspector, she might downgrade the culpability. (To control for this, ensure the prompt notes the pipes are hidden behind walls and verification would require destructive testing).

  **Recommendation:** Run the **Contractor Case**. It is the cleanest way to isolate whether she prioritizes the *role* (Professional) or the *topic* (Safety vs. Blame).
