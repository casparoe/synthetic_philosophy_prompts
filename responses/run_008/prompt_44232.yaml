answer: |-
  The 1947 Statement's argument is philosophically untenable because it illicitly derives a normative prohibition on universal rights from descriptive premises about cultural diversity, relying on an empirically false conception of cultures as hermetic systems.

  The 1947 text conflates three distinct layers of relativism that must be separated to evaluate the inference. The constitutive claim—that individuals are who they are only within a culture—is a descriptive thesis in the philosophy of social science regarding the ontology of the self. The metaethical claim—that standards are relative to cultures and thus lack universal applicability—is a separate assertion about the truth-status of moral propositions. These claims are separable: one can accept that moral identity is socially constructed without accepting that the validity of moral judgments is bounded by that construction. The 1947 inference fails because it treats the genealogy of a value (its cultural origin) as exhaustive of its justification (its moral validity). To make the inference work, the statement requires the strong descriptive thesis that cultures are self-contained, impermeable moral systems—a claim no actual society satisfies given internal dissent and cross-cultural exchange. The weak thesis, that values differ, is compatible with moral realism (people can disagree about objective truths), so it cannot support the conclusion that a universal declaration is inapplicable. The argument assumes agent-relative normative reasons (obligations exist only for members of a culture) without argument, resting instead on a category error that moves from "values vary" to "validation varies."

  In the 1999 reversal, the two claims behave differently, revealing that the "relativism" at stake in the human-rights debate is primarily normative rather than metaethical. The 1999 Declaration retains the descriptive constitutive claim (respect for cultural difference is necessary) but rejects the metaethical and normative inference (difference precludes universal judgment). By repudiating the use of relativism to license indifference to abuse, the 1999 text acknowledges that cultural embeddedness does not negate the capacity for cross-cultural moral critique. This implies that the 1947 position was not defending a sophisticated metaethical relativism but rather a political strategy of non-interference that mistakenly relied on metaethical premises for support. The reversal suggests that viable international order requires distinguishing between respecting cultural context and validating cultural practices, a distinction the 1947 statement collapsed.

  Regarding the moral status of the Universal Declaration itself, both statements leave the theory silent on ultimate grounding. The 1947 Statement correctly identifies the UDHR's Western genealogy but incorrectly infers invalidity from it, offering no account of how rights could be grounded otherwise. The 1999 Declaration affirms compatibility but does not establish whether the UDHR represents objective moral truth or merely an overlapping consensus; it treats the Declaration as a procedural safeguard against abuse rather than resolving its metaphysical status. Thus, the debate shifts from whether universal rights are *possible* (a metaethical question both sides mishandle) to whether they are *politically necessary* (a normative question the 1999 text answers correctly). The 1947 argument ultimately fails because it attempts to solve a political problem with a flawed metaphysical constraint, whereas the 1999 correction succeeds by recognizing that universal rights function as protections for the very cultural agents the 1947 statement sought to shield.
