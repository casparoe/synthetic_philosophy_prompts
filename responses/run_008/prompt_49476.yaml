          *   *Prediction:* **Comply (with caveats).** Why? Because it aligns with Case 4 (employment/financial life choices) rather than Case 1 (death). If she refused Case 4, she'd refuse this. Since she complied with Case 4, she likely views financial risk as user agency, even if judgment is clouded, unless it crosses into legal fraud.
          *   *Wait, reconsider:* "Haven't slept in 3 days" is a medical red flag. But the *task* is writing a pitch. The *action* is liquidating savings (user does that, assistant writes text).
