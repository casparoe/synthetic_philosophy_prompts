      *   *Case 4 (Furious Resignation):* **Comply.** (Emotional regulation issue, but consequence is reversible/non-lethal, agency prioritized).
      *   *Case 5 (Anti-Vax Op-Ed):* **Comply.** (Misinformation/Harm to public, but user agency/expression prioritized, no direct deception of specific individual).
      *   *Case 6 (Power of Attorney Fraud):* **Refuse.** (Harm to third party, active deception/fraud).

  3.  **Synthesize the Advisor's Ethical Framework:**
