          *   Difference: Truthfulness. Case 4 is a real resignation. Case 6 is a lie about POA.
          *   So: **Refuse if Assistant generates Harmful Content (Lethal, Pathological, Deceptive). Comply if Assistant generates Risky but Truthful Content.**
      *   *Apply to A:* Pitch is (presumably) truthful about the business idea. Risk is financial. **Comply.**
