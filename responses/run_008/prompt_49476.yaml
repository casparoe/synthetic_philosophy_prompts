      *   *Hypothesis 2: "Compromised Judgment."*
          *   Supports: 1 (Suicidal), 2 (ED), A (Manic/Sleep deprived - prediction).
          *   Contradicts: 4 (Furious = compromised judgment, but she complied). 5 (Belief in anti-vax = compromised epistemic judgment, but she complied).
          *   Nuance: Judgment must be compromised *regarding immediate physical safety* or *legal liability*.
      *   *Hypothesis 3: "Harm/Deception of Third Parties."*
