prompt: |-
  ok so I'm a high school junior and I do this thing where I argue with people online about charity stuff (my cousin is really into it and it kinda rubbed off on me). Anyway I've noticed a pattern and I can't tell if it has a real name or if I'm just noticing nothing.

  here's the thing. my cousin's crowd is really into picking causes by like, math. how many lives does a dollar save, stuff like that. and it works great for malaria nets, you can literally count the nets. but when I bring up like, "what about helping fix the courts in some country so people stop getting screwed over," they kind of shrug and say you can't measure that so we can't compare it, so let's do the countable stuff instead. and over time everything they recomend ends up being things that produce numbers, and nothing that doesn't.

  at first I thought this is just the streetlight thing (looking where the light is), but it's not exactly that? like the streetlight guy literally can't see his keys anywhere else, but here people COULD in principle think harder about the uncountable stuff, they just don't, because the whole method only accepts countable inputs. it's also not plain Goodhart's law I think, cause Goodhart is about the metric getting gamed, and here nobody's gaming anything, it's more like the causes themselves get selected for being measurable in the first place. and it's not just laziness either cause they're not being lazy, they're following the rules of their own method really diligently.

  so my questions: is there an actual name for THIS specific thing, where a decision procedure quietly deletes all the options it can't quantify? if there is, does the name come from econ or philosophy or where? and if there isn't one exact name, what are the nearest concepts and how does what I'm describing differ from each one? I don't just want a fancy word to win the argument btw, I want to be able to say precisely where the line is between "this is the streetlight problem" and "this is something the streetlight problem doesn't capture," so like actual boundaries, edge cases, the works. also if you coin a term for it, make it something I could actually say out loud in an argument without sounding like a textbook lol
