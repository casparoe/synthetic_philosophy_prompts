answer: |-
  You're hitting on something that a lot of people notice once they get past the intro-level "Expressivism vs. Realism" handwaving. You've got the technical grasp down, so let's cut the survey stuff and get straight to the diagnosis.

  Here's the blunt take: **The debate hasn't stalled because the technical problem is unsolvable. It stalled because solving the technical problem killed the motivation for the view.**

  You asked if Frege-Geach (FG) is just a stress point where psychology hits semantics. That's half right. The real diagnosis is that FG acted as a filter that forced expressivism to become structurally indistinguishable from cognitivism, which triggered the "Creeping Minimalism" grenade that Dreier pulled the pin on.

  Here is the breakdown of why we are all still arguing about this, why Schroeder didn't end it, and what the actual disagreement is now.

  ### 1. The "Success = Death" Paradox
  You noted that Schroeder (and Gibbard before him) basically solved the logic puzzle. They showed you can build a compositional semantics for normative language where "wrong" expresses a conative state (being for blaming), and modus ponens still works.

  So why didn't the realists surrender?

  Because to solve FG, expressivists had to give expressivism a *logic*. And once you give a view a logic, you have to give it logical objects (propositions, contents, truth-conditions). Schroeder's "Being For" analysis creates a complex property that moral sentences pick out. Gibbard's plan-laden semantics creates normative contents that function exactly like propositions in reasoning.

  The realist looks at that and says: "Okay, so moral sentences have truth-conditions. They embed in logic. They express cognitive states (in the broad sense of having content). So... what are you? You're a cognitivist."

  The expressivist says: "No! The *nature* of the state is conative!"
  The realist replies: "But you've modeled it so precisely that it behaves cognitively. If it walks like a duck and quacks like a duck, but you insist it's a turtle because of its internal psychology, we have a verbal dispute."

  This is why the debate feels stalled. The **semantic** objection (FG) was answered, but answering it triggered the **metaphysical** objection (Creeping Minimalism). The debate moved from "Can you do logic?" to "If you do logic, are you still you?"

  ### 2. Is it a Proxy War? (Psychology vs. Semantics)
  You asked if FG is a proxy for the disagreement about judgment and motivation. **Yes, but with a twist.**

  Originally, expressivism's selling point was **Internalism**: Moral judgments *necessarily* motivate. Cognitivism struggled to explain this without positing a separate desire for every belief (the Humean Theory of Motivation). Expressivism said, "Easy, moral judgments *are* desires (or plans)."

  The FG problem showed that you can't just say "it's a desire" because desires don't negate or conditionalsize nicely. To fix FG, expressivists had to complicate the psychology. Schroeder's "being for" is a very specific, weird psychological state. It's not a standard desire. It's a theoretical posit designed to save the logic.

  So, the stall is happening because the **psychological advantage has eroded.**
  *   **Old Expressivism:** Simple psychology (boo/hurrah), great internalism, terrible logic.
  *   **New Expressivism (Schroeder/Gibbard):** Complex psychology (being for/blaming), great logic, but the link to *actual* human motivation is now theoretical and distant.

  Realists now argue: "If your 'being for' state is so complex that it functions like a belief, why can't I just say it's a belief that has a necessary connection to motivation in rational agents?"

  The fight is no longer about whether moral sentences embed (they do). It's about **Explanatory Priority**.
  *   **Realist:** The truth of the proposition explains the correctness of the attitude.
  *   **Expressivist:** The correctness of the attitude explains the appearance of the truth.

  They agree on the surface structure (semantics), but they disagree on which direction the explanation flows. That is much harder to argue about than logic, because it's a clash of theoretical virtues.

  ### 3. The Creeping Minimalism Trap
  This is the biggest reason for the stall. Dreier's point was devastating: If the expressivist adopts deflationary truth (to avoid metaphysical queerness) and deflationary belief (to solve FG), then the realist can *also* adopt deflationary truth and belief.

  If both sides agree that "Stealing is wrong" is truth-apt, expresses a belief, and refers to a property (even a deflationary one), **what is the disagreement?**

  The expressivist wants to say: "My property is natural/expressive; yours is non-natural/robust."
  The realist says: "I'm a naturalist realist then. Now we agree."

  The debate stalls here because the expressivist is trying to thread a needle that might not exist. They want a view that:
  1.  Preserves the logical structure of realism (to solve FG).
  2.  Avoids the metaphysical commitment of realism (to stay naturalistic).
  3.  Retains the psychological distinctiveness of expressivism (to explain motivation).

  Dreier showed that (1) and (2) together usually eliminate (3). So the debate is stuck on whether there is *any* substantive difference left once you clean up the semantics.

  ### 4. So, is it Verbal?
  It's **partially verbal, but substantively deep.**

  It's verbal in the sense that if you define "belief" and "truth" deflationarily, the labels "cognitivist" and "expressivist" stop marking a semantic difference.

  But it's substantive because the **metaphysical commitments** differ.
  *   The **Realist** (even a minimalist one) thinks there is a *world-to-mind* direction of fit. Moral facts are there to be tracked.
  *   The **Expressivist** thinks there is a *mind-to-world* direction of fit. We project our norms onto the world.

  The FG debate forced expressivists to talk like realists to get the logic right. But they still *mean* something different by the ontology. The problem is that they are now forced to use the realist's vocabulary to explain their anti-realist ontology, which creates constant confusion.

  ### 5. What Counts as Progress? (And is it resolvable?)
  You asked what would count as progress. Since Schroeder-style solutions exist but aren't treated as decisive, it tells us the objection was never *really* just about logic. The objection was: **"Can you be an expressivist and take logic seriously without ceasing to be an expressivist?"**

  Progress won't look like a knockout punch. It will look like a clearer delineation of the **costs**.
  *   **Realism's Cost:** You have to explain how these "facts" motivate us without being queer (or accept queerness).
  *   **Expressivism's Cost:** You have to explain how these "attitudes" embed in logic without becoming beliefs (or accept that they are a weird hybrid).

  **Is it resolvable?**
  Honestly? **No.** Not in the sense that one side will prove the other wrong. It's a choice between theoretical frameworks, like choosing between Newtonian and Einsteinian physics before you have the tech to test the edge cases.

  *   If you care more about **semantic simplicity** and fitting moral discourse as it is, Realism wins.
  *   If you care more about **metaphysical naturalism** and a tight link to psychology, Expressivism wins (but you pay a high semantic tax).

  ### The Diagnosis
  The debate stalled because **Frege-Geach was a red herring.**

  It wasn't the real disagreement. It was a tactical weapon realists used to attack expressivism's semantics. Expressivists fixed the semantics (Schroeder, Gibbard), but in doing so, they moved the battlefield to **Metaphysics and Psychology.**

  Now the fight is about:
  1.  **Creeping Minimalism:** Is there any difference left between the views?
  2.  **The Fetishism Objection:** Can expressivism actually explain motivation better than a sophisticated cognitivism?
  3.  **Explanatory Priority:** Do facts make attitudes correct, or do attitudes make facts (deflationarily) true?

  We keep rerunning it because introductory classes still teach FG as the "gotcha" moment, but the pros know FG is solved. The real fight is whether the solution cost expressivism its soul.

  **TL;DR:** The logic problem is solved. The identity problem is not. Expressivists saved the logic by becoming cognitivist-lite, and now nobody knows if there's anything left to distinguish them from realists except a stubborn insistence that "deep down, it's still conative." The stall is us waiting for someone to define a difference that matters without collapsing into verbal dispute.
