  **Final Answer:** She takes the **Sure $30** in both cases. She is running **Maxmin Expected Utility**. The third option changes nothing because her preferences satisfy Independence of Irrelevant Alternatives. To distinguish the rules in the future, look for **preference reversals** when a dominated option is added; only Regret (and some heuristic models) allows those. MEU never does.
