answer: |-
  # bound.js v3.0.0 Documentation

  ## What is a Promise?

  A `Promise` is an object representing the eventual completion or failure of an asynchronous operation, and the resulting value of a commitment made to another rational agent. It allows you to associate handlers with an asynchronous action's eventual success value or failure reason, creating a binding obligation between the producer and the consumer.

  ```javascript
  const p = new Bound((resolve, reject) => {
    // You have now created a fact. 
    // You have not yet created an obligation.
  });
  ```

  ## The Binding Force

  A common question among maintainers is why the mere instantiation of a `Bound` object necessitates its resolution. Users often assume that because they *can* call `.resolve()`, they *ought* to call `.resolve()`.

  We have tried to enforce this at the type level. It cannot be enforced at the type level.

  The fact that a promise exists is descriptive (an `is`). The requirement to fulfill it is prescriptive (an `ought`). No amount of static typing can derive the prescriptive from the descriptive. You are free to instantiate a `Bound` object and leave it pending forever. The runtime will not stop you. The type checker will not warn you. You must find the binding force elsewhere, perhaps in the expectations of the agents waiting on `.then()`.

  ## Concurrency and Aggregate Debt

  When multiple handlers attach to the same promise instance, the nature of the obligation becomes complex.

  ```javascript
  promise.then(agentA);
  promise.then(agentB);
  promise.then(agentC);
  ```

  In `Promise.all`, the debt is aggregate: you owe all parties simultaneously. In `Promise.race`, the obligation is satisfied by the first completion, potentially voiding the expectations of the slower handlers. 

  Does attaching a `.then()` handler create a new obligation, or merely recognize an existing one? In v3.0, we treat handlers as stakeholders. If you reject the promise, you are not merely returning an error code; you are violating the reasonable expectations created by the initial construction. The wrongness comes not from the rejection itself, but from the violation of the convention established when the promise was exposed to the public scope.

  ## FAQ

  **Q: What happens if I break a promise?**

  **A:** ~~Technically, nothing. The garbage collector will eventually reclaim the memory.~~

  **A:** ~~Nothing happens at the runtime level. No exception is thrown if you simply abandon the scope.~~

  **A:** Nothing happens immediately. However, reliance interests may have accrued. If another agent has structured their control flow around your resolution, your failure to resolve propagates uncertainty. You will know.

  ## Migration Guide: From Callbacks

  Prior to `bound.js`, obligations were managed via "callbacks." This was an oral tradition based on implicit social contracts and error-first conventions. There was no first-class construct for obligation; there was only practice and expectation.

  Moving to `bound.js` formalizes these expectations. Where a callback was a handshake, a `Bound` object is a signed contract. Note that converting legacy callbacks to Promises does not automatically validate the underlying commitment; it merely makes the potential breach more visible.

  ## Deprecated Methods

  ### `promise.forgive()`

  **Status:** Deprecated (Removed in v3.0)

  This method allowed a consumer to release the producer from their obligation unilaterally. It was removed due to ambiguity regarding who holds the authority to absolve debt. Can a downstream handler forgive an upstream producer? Can a producer forgive themselves?

  We keep re-adding this method after community outcry, and we keep removing it. Please stop asking for it. Moral clarity is not a feature we support.

  ## Changelog

  ### v3.0.0
  - **Breaking:** `.forgive()` removed.
  - **Feature:** Added `BindingError` class, though it is never thrown automatically.
  - **Fix:** Clarified documentation regarding the ontological status of pending states.
  - **Note:** We are not responsible for how you use this library.
