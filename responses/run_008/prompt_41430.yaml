  **MEMORANDUM**

  **TO:** State Employment Agency Review Board
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Fairness Constraints for Fraud Detection Model

  ### Executive Summary

  After three sessions of deliberation regarding the deployment of the new fraud-detection model, this memo recommends adopting **Equalized False Positive Rates (FPR)** across demographic groups as our primary fairness constraint. To achieve this, we must implement **group-specific decision thresholds**.

  This recommendation prioritizes the equitable distribution of *harm* (frozen benefits) over the equitable interpretation of the *score*. While this sacrifices the universal interpretability of the risk score, it aligns the model's operation with the agency's statutory mandate to minimize undue burden on claimants. This decision requires legal review regarding the implementation of group-specific thresholds, but it resolves the ethical deadlock by treating the model as a decision-support tool rather than an objective measurement of truth.

  ### Context: The Technical Constraint

  As our technical consultant outlined, due to differing base rates of fraud across groups, we cannot simultaneously satisfy **Calibration** (a score of 0.8 means 80% risk for everyone) and **Error Rate Parity** (equal false positive rates for everyone). We must choose one as the hard constraint.

  *   **Side A (Calibration):** Argues that a score must mean the same thing for everyone to ensure downstream decisions are based on consistent evidence.
  *   **Side B (Equalized FPR):** Argues that the harm lies in the *action* (freezing benefits), and false positives must not fall disproportionately on any specific demographic.

  ### Root of the Disagreement: Measurement vs. Decision

  The stalemate persists because we are answering two different questions.

  1.  **Is the score a Measurement?** If the score is a statement of fact about a claimant's "fraud-propensity," then Calibration is the only ethical choice. A miscalibrated score is a lie; it misrepresents reality.
  2.  **Is the score a Decision Input?** If the score is merely a triage mechanism to allocate limited manual review resources, then the *consequence* of the score matters more than the number itself.

  **My assessment:** In the context of unemployment benefits, the score is a **Decision Input**, not a Measurement of truth. We are not sentencing claimants; we are triaging claims for review. When the output of the model triggers a deprivation of resources (frozen benefits), the fairness of that deprivation outweighs the semantic consistency of the risk score. Therefore, we must optimize for the fairness of the *action*, not the *number*.

  ### Recommendation: Equalized False Positive Rates

  I recommend we bind the model to **Equalized False Positive Rates**.

  **Rationale:**
  The primary ethical risk in this system is denying rightful benefits to eligible citizens. A false positive results in financial hardship, loss of trust in the state, and administrative burden for the claimant to prove their innocence. If Group A suffers a 10% false positive rate and Group B suffers a 2% rate, the state is systematically imposing a higher "tax" of uncertainty on Group B. In public administration, disparate impact on access to essential services is a higher liability than disparate interpretation of risk scores.

  **Implementation Note:**
  Mathematically, equalizing FPRs across groups with different base rates requires **group-specific thresholds**. Group A may be frozen at a score of 0.7, while Group B is frozen at 0.85. This is the only mechanism to achieve the desired outcome equity.

  ### Validation of the Calibration Position

  To the board members advocating for Calibration: Your concerns are valid and must remain part of our governance, even if they are not the *decision* constraint.

  *   **Model Health:** Calibration remains the best metric for overall model health. We should continue to monitor it closely. If calibration drifts significantly within groups, it indicates the model is learning spurious correlations, which will eventually degrade FPR performance anyway.
  *   **Auditability:** You are correct that group-specific thresholds complicate audits. A score of 0.8 no longer universally signifies "high risk." We must document this clearly so that auditors do not misinterpret the risk distribution.
  *   **Downstream Consistency:** If other agencies or future systems ingest these scores assuming calibration, they will make errors. We must flag these scores as "decision-adjusted" in any data sharing agreements.

  You are right that miscalibration "poisons" the score's meaning. We are accepting that poison to prevent the greater harm of disparate freezing of benefits.

  ### Trade-offs and Risks

  We must be honest about what we are giving up with this recommendation:

  1.  **Loss of Interpretability:** We lose the ability to say "This claim is 80% likely to be fraudulent" as a universal truth. The score becomes relative to the group. This makes explaining individual decisions to claimants more difficult.
  2.  **Legal & Political Risk:** Implementing group-specific thresholds carries legal risk. While intended to mitigate disparate impact, explicit use of demographic thresholds can be challenged as disparate treatment. **This recommendation is contingent on Legal Counsel confirming that optimizing for FPR parity falls within acceptable disparate impact mitigation frameworks.**
  3.  **Operational Complexity:** Review queues may shift in volume. We must ensure the manual review team is staffed to handle the resulting queue distribution, which may differ from the raw score distribution.

  ### Conclusion

  We cannot have a model that is both perfectly calibrated and perfectly equitable in its error rates. We must choose whether we value the consistency of the *number* or the equity of the *outcome*.

  Given that our mandate is to administer benefits without undue burden, I urge the board to prioritize **Equalized False Positive Rates**. We should treat the model as a triage tool where the cost of error is the primary metric of success, not the semantic precision of the risk score.

  **Action Required:**
  Please review this recommendation prior to Thursday's session. I propose we vote to adopt Equalized FPRs as the primary constraint, with a directive to Legal to review the mechanism of group-specific thresholds for compliance.

