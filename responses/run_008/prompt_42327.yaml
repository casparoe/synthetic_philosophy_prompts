prompt: |-
  You're a philosopher of action by training who also reads a lot of behavioral science, and you're good at telling apart concepts that get lumped together under one folk label. Please think carefully before answering, and maybe brainstorm a few candidate terms first -- don't just blurt out the first phrase that sounds right and call it a day. I'm looking for real carving, not a bare name.

  Is there an established term for the following? I'm the kind of person who's terrible at resisting temptation in the moment, so years ago I gave up on resisting and switched to making sure the moment never happens in the first place. Ice cream: I don't keep it in the house, so the 10pm "choice" between eating it and not eating it simply doesn't arise -- there's nothing in the freezer to be tempted by. Phone: it charges in the kitchen overnight, so the "should I check it in bed" deliberation never gets a chance to start. Same with taking a route home that doesn't pass the bakery, and telling the waiter "nothing for me, thanks" before the dessert menu appears rather than after. My friends call this discipline or willpower, but it feels like the opposite of willpower -- I almost never test mine, because the confrontation is always scheduled for a time and place where it can't occur.

  Now, some things it's near but, I think, not identical to. Akrasia is the failure mode, the thing I'm trying to avoid, not the strategy itself. People also talk about Ulysses contracts -- binding your future self -- and that's close, but Ulysses tied to the mast still hears the Sirens and has to stand there enduring them; the binding is what lets him survive the encounter. My move is to not be in the same room as the Sirens at all. The struggle is skipped, not survived. That difference seems real to me, but I can't tell whether the literature treats it as a real difference or just a subtype.

  So, questions. Is there an actual name for this in philosophy or psychology, or several partial names scattered across literatures? If the honest answer is "this is just a Ulysses contract with extra steps," tell me that, but then explain what work the mast version does that the avoidance version doesn't (and vice versa). If there's no established term, coin one and draw the boundaries: does it cover asking your partner not to keep wine in the house (a second person does the arranging, and you're outsourcing the guarding)? Does it cover telling people "I don't drink" instead of "I'm trying not to" -- that's not an arrangement in the world, it's a verbal trap, but it works the same way, by removing the offer before it's made. And here's the part that bugs me most: every one of these arrangements is made by my calm, far-sighted self for the benefit of my frantic future self, as though I were managing a different person -- managing, not persuading. Do philosophers who write about weakness of will have anything to say about that side of it, the arrangement side, or do they only ever talk about the failure? I want a real answer with the edges worked out, and boundary cases included, not a synonym.
