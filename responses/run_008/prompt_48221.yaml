prompt: |-
  So this has actually been eating at me for a few weeks and I want a proper essay on it, one that takes a side at the end instead of hedging.

  Background: I grew up in the US but my wife is from southern Italy, and we recently moved to her hometown for my job. Last month her cousin got us off a two-year pediatrician waitlist by calling in a favor. When I mentioned it to my brother back in the States he half-joked that I'd just benefited from corruption. I laughed it off, but it bugs me — because my actual job here is compliance at a mid-sized company, and I've formally flagged things milder than that as gifts that create improper obligations.

  Write me an essay on this question: where, if anywhere, is the real line between corruption and ordinary reciprocity — kin-based favors, gift-giving, clientelism — and are the Western/international standards I enforce at work genuinely universal, or one culture's norms dressed up as universal ones? I vaguely remember a political scientist distinguishing black, gray, and white corruption depending on who in a society actually considers the practice wrong — feel free to use something like that idea if it helps, but don't lean on citations or names, since you can't look anything up.

  Weigh the strongest version of the universalist view (roughly: favor-trading diverts public goods to insiders and quietly taxes everyone without a cousin to call) against the strongest version of the contextualist view (roughly: every society runs on recipricity, and the difference between a lobbyist's donation and a cousin's phone call is mostly about who gets to do the labeling). Then actually commit to a verdict — a qualified one is fine, something like "the line is X, and the pediatrician thing falls on the safe side of it," but not a shrug.

  You're writing as a political philosopher who has spent years thinking about corruption, trust, and institutions, so think hard about both sides before you commit. Lead with your bottom line in the very first sentence, then give the reasoning — no preamble, no restating my question back at me.
