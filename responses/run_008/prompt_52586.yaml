answer: |-
  Your view reduces metaphysical identity to social convention, thereby changing the subject from ontology to sociology. This objection, originating from the endurantist half of the room, is the most dangerous because it does not engage your criteria but dissolves your project; if they succeed in framing your account as merely sociological, your metaphysical claims become category errors. To survive this, you must hold firm on the claim that artifact kinds are essentially functional and social, unlike natural kinds, but concede that your theory does not apply to substances or biological organisms. **Reply:** Argue that artifact identity conditions are kind-relative, and for artifacts, the "sortal" concept inherently includes a history of production and maintenance; therefore, social practice is not an external addition to the metaphysics but constitutive of the kind itself. **Soft Spot:** You lack a principled metaphysical boundary for why *this* specific social practice (custody) constitutes identity rather than another (e.g., naming), leaving you vulnerable to the charge of arbitrariness. **[HOLD: Artifacts are social kinds. CONCEDE: Natural kinds may differ.]**

  The next most damaging challenge comes from the logic of identity itself, specifically regarding fission: if two rival crews simultaneously maintain the same derelict, each claiming to be the original's custodian, does the ship become two ships? This objection threatens the transitivity and uniqueness of identity, which even conventionalists usually respect. **Reply:** Define custody as requiring *effective* maintenance and exclusive responsibility; where claims conflict without resolution, identity becomes indeterminate until one chain establishes dominance or the object is physically divided. **Soft Spot:** Admitting indeterminacy here saves uniqueness but concedes that identity is not always a determinate fact, which may annoy the endurantists further and weaken your claim to be solving the Ship of Theseus definitively. **[HOLD: Identity requires effective custody. CONCEDE: Identity can be indeterminate during active fission disputes.]**

  The organizer's worry about abandonment and re-adoption follows closely, pressing whether a derelict re-adopted by a community is the same ship simply because they treat it as such. This targets the "unbroken" clause of your chain. **Reply:** Distinguish between abandonment (severance of responsibility) and dormancy; re-adoption creates a new chain unless there is a continuous legal or institutional framework (like salvage law) that bridges the gap, preserving the custodial lineage formally even if practically inactive. **Soft Spot:** You will struggle to define the precise temporal threshold where dormancy becomes abandonment without appealing to the very intuitions you are trying to replace. **[HOLD: Abandonment severs identity. CONCEDE: The threshold for abandonment is vague.]**

  The historian of material culture will present museum cases where custodial stories exist but ordinary judgments diverge, such as an object maintained by a museum that is later revealed to be a meticulous forgery created decades ago. This attacks the link between intention and reality. **Reply:** Argue that custody includes epistemic responsibility; a discovered fraud breaks the intentional chain because the custodians were maintaining a *different* object than they intended, but undiscovered fraud preserves identity relative to the practice until exposure. **Soft Spot:** This implies the metaphysical status of the object changes retroactively upon discovery, which is a hard pill for any metaphysician to swallow. **[HOLD: Fraud breaks intention. CONCEDE: Retroactive identity shifts are counterintuitive but necessary on this view.]**

  The perdurantists will argue that the whole dispute is merely verbal, concerning only which temporal segments our sortal concepts group together. This minimizes the stakes of your defense. **Reply:** Accept the verbal label but insist the practical stakes (responsibility, value, heritage) are real and that your view maps the actual practice better than temporal slicing, which ignores the normative dimension of persistence. **Soft Spot:** They will not care about practical stakes, viewing them as irrelevant to ontology. **[HOLD: Practical stakes matter. CONCEDE: The dispute may be verbal in a lightweight metaphysical sense.]**

  The mereological essentialists will assert that the replacement of a single plank already destroys the original. This is a dogmatic stalemate. **Reply:** Point out that their view renders artifact identity useless for human practice, as no ship survives a voyage, and argue that metaphysics should account for the persistence conditions of the things we actually interact with. **Soft Spot:** They accept uselessness for precision and will not be swayed by pragmatic appeals. **[HOLD: Precision cannot override utility for artifacts.]**

  Finally, be prepared for the question you hope nobody asks: "If the chain of custody relies on intentional recognition, does the identity of the artifact vanish the moment the last person who recognizes it as that specific artifact dies, even if the object remains physically intact and is later rediscovered?" This targets the dependency of your view on continuous consciousness. **Reply:** Argue that institutional custody can survive individual death through recorded mandates and structural continuity, but concede that total loss of memory combined with total loss of record does sever the chain, making the rediscovered object a new find rather than the old artifact. **Soft Spot:** This implies that identity is fragile and dependent on historical record-keeping, making metaphysics hostage to archives. **[HOLD: Records sustain custody. CONCEDE: Total memory loss severs identity.]**
