  ### What changes overnight

  The day after the switch, campaign posters come down and election meetings vanish. Instead of nominees soliciting votes, nine names are pulled from a database. Your boardroom fills with neighbors who never sought power, including reluctant participants; service is now mandatory. The faction that previously controlled agenda-setting loses its grip immediately, as their incumbency advantage disappears. However, institutional memory takes a hit; outgoing elected directors who knew the roof fund's history are replaced by novices. The professional property manager becomes the primary source of continuity, gaining influence as the only constant expert. Morale might spike among the disengaged majority who feel the system is fairer, but anxiety will rise among those who preferred the status quo. Administrative work shifts from managing elections to managing the lottery process and orienting new members. The immediate shock is real, but the power structure resets completely.

  ### Legitimacy and competence

  Sortition solves the legitimacy crisis caused by low turnout and factional capture. With 22% turnout, a small minority chooses leadership. A random board statistically mirrors the membership's diversity of thought and demographics, granting it unique moral authority: it represents the "will of the whole" rather than the "will of the motivated." This breaks the cycle of clique dominance. However, competence is the tradeoff. Elections act as a filter; candidates self-select based on interest or skills. Random selection removes this. You may draw members who are disinterested, lack financial literacy, or struggle with governance norms.

  Since you retain a professional property manager, operational catastrophe is mitigated. They handle day-to-day tasks, leaving the board to focus on policy—approving budgets, setting subletting rules, and prioritizing capital projects. These are value judgments, not technical feats, suiting a representative body. However, loss of institutional memory is significant. An elected board often retains incumbents; a random draw could replace everyone annually. This creates a steep learning curve, making the board heavily reliant on the manager's advice. If the board lacks confidence, "governance by manager" may result. Sortition doesn't guarantee engagement; members might treat it like jury duty. Yet, evidence from citizens' assemblies suggests ordinary people, given briefing materials, make thoughtful decisions. The competence gap may be narrower than feared with robust orientation.

  The psychological dynamic shifts too. Elected boards feel accountable to voters, leading to populism or factional pandering. A sortition board is accountable only to the bylaws and conscience, potentially allowing tougher, long-term decisions (like raising fees for the roof) that elected directors might avoid to secure re-election. This independence boosts legitimacy for unpopular choices. However, without an electoral mandate, they may lack confidence pushing back against vocal minorities during open forums. The legitimacy gained from fair selection must be actively maintained through transparency, or members may view the random board as an unaccountable oligarchy. Competence risks are manageable; legitimacy gains are immediate.

  ### The wrinkles

  Graduated sortition modifies the core principle of equality. Pure sortition assumes every member is equally capable and obliged. Weighting the draw to exclude recent servers protects members from burden fatigue and prevents a "lottery aristocracy" where the same lucky few serve repeatedly. It strengthens the case for broad participation but slightly compromises the statistical mirror of the membership.

  The hybrid model is riskier for the sortition argument. If five seats are elected, the elected faction may dominate the four random members, especially if the elected ones are the same repeat players you seek to avoid. It preserves some competence but retains the election problems (low turnout, factionalism) that motivated the change. It dilutes the legitimacy boost of pure sortition. Elected seats may dominate, recreating the hierarchy sortition aims to flatten.

  Recall is critical. In elections, recall is a voter correction. In sortition, it's a safety valve against incompetence or malice. Without it, members feel trapped with an unaccountable body. However, setting the threshold too low invites the very factional warfare you hope to escape. A high bar (e.g., 50% membership vote for gross misconduct) preserves board independence while preventing tyranny. Since members didn't choose the board, they need a way to remove them that doesn't require proving "betrayal of platform" but rather "failure of duty." Each wrinkle adjusts the balance: graduated sortition protects members, hybridity protects competence but undermines reform, and recall protects the co-op from the board itself.

  ### Bottom line

  Do it, but consider a phased approach. Your elections are broken, and the stakes are manageable. With a property manager handling operations, the board's role is primarily value-setting, which ordinary members can handle. Pure sortition is bold; hybrid is safer. Start with a hybrid or a sunset clause. The risk of incompetence is lower than the certainty of factional capture. Your co-op needs renewal, and sortition forces engagement from the silent majority. Just invest heavily in orientation and keep the recall mechanism robust. Status quo is unsustainable; random selection offers a legitimate path out.
