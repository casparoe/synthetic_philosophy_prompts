answer: |-
  The configuration you are describing is the central empirical engine of **Semantic Externalism** (also known as **Content Externalism** or **Anti-Individualism**). While there is no single canonical noun phrase exclusively for the *class of disputes* (they are typically categorized technically as **Substantive Disputes** that *appear* verbal), the underlying phenomenon that prevents the dispute from dissolving is universally labeled in the literature as Semantic Externalism.

  The specific intuition pumps you cited are famous: the "heavy water" case mirrors Hilary Putnam's **Twin Earth** thought experiment (1975), and the "arthritis in the thigh" case is directly Tyler Burge's **Arthritis Argument** (1979). Both were designed to prove that meaning and mental content are not fixed solely by internal states ("in the head") but depend on causal-historical chains and community usage ("in the world").

  Here is the carving you requested.

  ### The Carving

  **1. The Core Phenomenon: Semantic Externalism**
  The configuration where the truth conditions of an utterance depend on facts external to the speaker's epistemic access (physical environment or linguistic community) is **Semantic Externalism**. In the rationalist toolkit, "tabooing" assumes a **Descriptivist** theory of meaning (words are defined by concepts in the head). Externalism shows this assumption is false for natural kind terms and technical vocabulary. When you taboo the word, you remove the label, but the disagreement persists because the *reference* was fixed by a causal chain you cannot introspect. The dispute is not about the word's definition (which would be verbal); it is about which object the word *actually latched onto* in the past (which is substantive).

  **2. Distinction from Nearest Neighbours**
  *   **Merely Verbal Dispute:** In a merely verbal dispute (Chalmers 2011), parties differ only in linguistic usage, and sharing all non-linguistic facts dissolves the disagreement. In your cases, sharing all non-linguistic facts *does not* dissolve it, because the "linguistic fact" (what the word refers to) is itself an external, non-linguistic fact about history/causality. Thus, these are technically **Substantive Disputes**, despite feeling verbal.
  *   **Metalinguistic Negotiation:** Contemporary pragmatists (Plunkett & Sundell) argue many such disputes are actually normative negotiations about *which concept we should use*. You distinguished your cases as being about *past pinning* rather than *future usage*. While the literature often collapses these, your distinction holds: Burge's patient isn't negotiating; she is simply wrong about the existing standard. This makes it a **Factual Dispute about Semantic Facts**, not a negotiation.
  *   **Causal Theory of Reference:** This is the mechanism (Kripke/Putnam) explaining *how* the pinning happens (causal chains vs. descriptions). Semantic Externalism is the broader thesis that this mechanism makes content dependent on the outside world.

  **3. Boundaries and Edge Cases**
  *   **Divergent Communities:** If the two chemists come from isolated communities where "water" was historically pinned to different structures (e.g., one community never discovered isotopes and pinned it to surface role, the other to microstructure), the dispute becomes **Merely Verbal** (or a translation failure). Externalism requires a shared linguistic environment to generate the substantive disagreement.
  *   **Stipulative Definitions:** If the chemists explicitly agree to stipulate "Water = H2O" for the purpose of the argument, the dispute dissolves. Externalism applies to natural language usage, not formal stipulation.
  *   **Internalist Terms:** For words like "bachelors" or "pain" (arguably), meaning *is* in the head. Tabooing works there. The phenomenon only applies to externalist terms (natural kinds, proper names, technical terms deferred to experts).

  ### Summary

  The rationalist heuristic "taboo the word" fails here because it assumes **Internalism** (meaning is in the head). The phenomenon where meaning is outside the head is **Semantic Externalism**. The resulting disputes are **Substantive Disputes about Reference**.

