answer: |-
  **The Scenario: Optical Filter Technicians**

  Imagine a factory producing high-end camera lenses. Each lens requires a protective coating applied at step ten of a twelve-step process. Before step ten, the glass must transmit ultraviolet (UV) light. After step ten, the coating must block UV light. This isn't arbitrary; the coating chemistry only bonds correctly if the glass is initially transparent to UV, but the final product is useless unless it blocks UV.

  The technicians have a predicate: **"Stage-Valid."** A lens is Stage-Valid if it is examined before step ten and transmits UV, *or* if it is examined after step ten and blocks UV.

  To us, "Stage-Valid" looks like *grue*. It's disjunctive and time-indexed. The simple predicate is **"Transmissive"** (transmits UV). But inside the factory, "Transmissive" is the gerrymandered outlier. If a technician projects "Transmissive," they predict that post-coating lenses will transmit UV. That prediction fails every time; those lenses are defects. "Transmissive" lumps together good pre-coat lenses and bad post-coat lenses. It carves reality at the wrong joints for their purposes. "Stage-Valid," however, unifies all the *successful* lenses regardless of when they are checked. It is the entrenched, projectible predicate in their trade. Projecting "Stage-Valid" lets them confidently predict that a pre-coat lens which transmits UV will become a post-coat lens that blocks UV.

  **The Walkthrough**

  A **Humean** says this is just habit. The technicians have seen constant conjunction: pre-coat transmission is always followed by post-coat blocking. There is no logical necessity here, only psychological expectation born of repetition. They project "Stage-Valid" because it hasn't failed them yet.

  A **Goodmanian** focuses on entrenchment. "Stage-Valid" is woven into the factory's manuals, training, and past successful predictions. It has a history of being used to formulate hypotheses that survived. "Transmissive" lacks this history for post-coat predictions. For Goodman, projectibility isn't about the predicate's simplicity; it's about its linguistic career. "Stage-Valid" is projectible because it is entrenched; "Transmissive" is not, because projecting it leads to falsification in this context.

  A **Natural Properties Theorist** balks. "Stage-Valid" is clearly artificial; it references human steps and times. They argue the technicians are actually tracking a real, underlying physical property—say, "Covalent-Bond-Integrity." They claim "Stage-Valid" is just a clumsy label for this natural property. The move is to say only natural properties are projectible, and the technicians are successfully tracking one, despite their weird language.

  **Does this move work?** It risks relabeling. If "Covalent-Bond-Integrity" is only accessible via the time-indexed behavior (transmits then blocks), then the "natural property" just is the grue-like pattern. The theorist must show the property exists independently of the inspection schedule. If they can't, they haven't solved the riddle; they've just renamed "Stage-Valid" to sound more metaphysical.

  **The Pivot Point**

  The single feature doing all the work is the **irreversible transformation** tied to value. The coating process permanently changes the lens's behavior. If you delete this feature—if the lenses stayed transmissive forever—"Stage-Valid" collapses into "Transmissive." The flip disappears because the time-index no longer marks a physical difference.

  **Entrenchment vs. Reliability**

  Finally, is entrenchment just an idle wheel tracking reliability? A skeptic argues "Stage-Valid" is entrenched only because it worked. Goodman replies that entrenchment determines *which* hypotheses we test in the first place. We don't test "Transmissive" on post-coat lenses because the predicate isn't entrenched for that context. Entrenchment isn't just a record of success; it's the rulebook that defines what counts as a sensible prediction. Without it, we couldn't even begin to gather the reliability data. The technicians don't project "Stage-Valid" because it's true; it becomes the standard of truth for their practice because they project it.
