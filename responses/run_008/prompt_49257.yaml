  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Project:** Neuro-phenomenal Correlates of Visual Attention in Meditators vs. Controls
  **Principals:** Dr. H. (Heterophenomenology) & Dr. V. (Neurophenomenology)
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS
  *Both researchers sign the following propositions as the foundational protocol for this study.*

  1.  **Necessity of Third-Person Measures:** Both parties agree that electroencephalography (EEG) provides objective, third-person data regarding neural dynamics (e.g., phase synchrony, event-related potentials) that is independent of the subject's verbal report. Neither party claims that neural data alone is sufficient for a complete science of consciousness, but both agree it is necessary for establishing public, replicable constraints.
  2.  **Fallibility of Reporting:** Both parties agree that subjects, particularly untrained ones, sometimes misreport the character of their experience. This may occur due to memory decay, linguistic limitation, demand characteristics, or lack of attentional stability. Therefore, raw reports cannot be accepted as infallible truths without cross-validation against behavioral performance and neural metrics.
  3.  **Value of Meditation Training:** Both parties agree that long-term meditation practice alters cognitive processing and attentional regulation. The study will treat the "Meditator" group as a distinct population with modified cognitive habits, regardless of whether those habits grant privileged access to "experience" (V.) or merely modify the disposition to generate reports (H.).
  4.  **Methodological Reciprocity:** Both parties agree that the interpretation of neural data should inform the interpretation of reports, and vice versa. Neither side will insist on a strictly one-way causal arrow (from brain to report, or from report to brain) during the analysis phase.
  5.  **Pre-Registration:** Both parties agree to pre-register their specific predictions regarding the correlation strength between report categories and neural microstates for both meditators and controls before data collection begins.

  ***

  ## II. DISAGREEMENTS, CRUXES, AND PRE-REGISTERED PREDICTIONS

  | Domain of Dispute | Dr. H. (Heterophenomenologist) Position | Dr. V. (Neurophenomenologist) Position | Crux & Admissible Evidence | Pre-Registered Predictions (Meditation Study) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Status of the Report** | The subject's report is **a text whose experiential import should remain open while interpretation proceeds.** It is a fictionalized account generated by the brain's "user illusion," to be interpreted by the scientist to construct a model of the subject's *belief* about their experience. | The subject's report (when trained) is **a defeasible first-class datum gathered through disciplined first-person training.** It is a rigorous description of the lived structure of experience that constrains neural modeling reciprocally. | **Crux:** Does the "trained" report function as a constraint on neural theory, or merely as another behavioral output to be explained?<br>**Admissible Argument:** If meditator reports predict neural microstates *significantly better* than control reports (controlling for response bias), this supports V. If prediction accuracy is equal, this supports H. | **H.:** No significant difference in correlation strength between Meditator reports/EEG and Control reports/EEG. Meditators are just better at following instructions.<br>**V.:** Meditator reports will show significantly higher mutual information with EEG gamma-band synchrony than Controls. |
  | **2. Methodological Neutrality** | Insisting on neutrality about the existence of qualia is **methodological rigor.** It prevents the scientist from importing folk-psychological assumptions into the model. It is not a denial of experience, but a bracketing of its ontological weight. | Insisting on neutrality about experience is **itself a substantive theoretical commitment.** It presupposes materialism and excludes the phenomenon (the *phainomenon*) from the study of consciousness a priori. | **Crux:** Is "bracketing" a tool for clarity or a tool of exclusion?<br>**Admissible Argument:** Philosophical coherence and explanatory power. If the H. model explains the *nuance* of the V. data without referencing experience, H. wins. If the H. model requires ad-hoc assumptions to explain the stability of V. data, V. wins. | **H.:** The "neutral" model will explain variance in reports using only neural and behavioral variables, rendering the "experience" variable redundant.<br>**V.:** The "neutral" model will fail to account for specific phenomenological distinctions (e.g., "emptiness" vs. "absorption") that map onto distinct neural signatures. |
  | **3. The Hard Problem** | Method cannot solve the Hard Problem because **it can only flank it.** The goal is to explain why subjects *say* they have hard problems. A complete third-person explanation dissolves the mystery. | Method can **address the Hard Problem** by revealing the structural coupling between neurodynamics and phenomenological invariants. It naturalizes experience without eliminating it. | **Crux:** Does the collaboration aim to explain the *judgment* of consciousness or the *structure* of consciousness?<br>**Admissible Evidence:** Whether the joint model can predict novel experiential nuances not captured by standard cognitive psychology. | **H.:** The study will produce a model of "Attentional Reporting Mechanisms." Any residual "feeling" is outside the scope of science.<br>**V.:** The study will produce a "Neuro-Phenomenological Law" linking specific dynamic neural assemblies to specific textures of awareness. |

  ***

  ## III. NOTE ON MERELY VERBAL DISPUTES

  Upon review, the collaborators identify one area of dispute that appears to be **merely verbal**:

  **The Definition of "Experience" (Qualia):**
  *   **Why it is verbal:** When Dr. H. says "There is no such thing as ineffable qualia," and Dr. V. says "There is ineffable lived experience," they are often using the word "experience" to point to different targets. Dr. H. defines "experience" as the *finalized judgment* available to the cognitive system (which is always reportable in principle). Dr. V. defines "experience" as the *pre-reflective flow* that precedes judgment.
  *   **Resolution for Collaboration:** Both agree to operationalize "experience" for this study strictly as **"the content of the verbal report stabilized by the specified attentional protocol."** They agree to disagree on whether that content refers to an internal property (V.) or a constructed narrative (H.). This verbal dispute will not be allowed to halt data analysis.

  ***

  **Signed:**

  __________________________
  Dr. H. (Heterophenomenology)

  __________________________
  Dr. V. (Neurophenomenology)
