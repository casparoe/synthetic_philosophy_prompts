  So: is there one principle about when that's just not me / that's just who I am counts as a reason — some account of integrity, or ground projects, or whatever you want to call it — that gets all of these, or nearly? If it can't, which of my verdicts has to go: the recoil at the hiring manager, the fury at the doctor, or my sense that the wife case needs no justification at all? Spell the principle out precisely enough to predict verdicts, tell me what it says about my flip-flop case, and also about one I haven't mentioned — say, a whistleblower who betrays her firm's trust because she couldn't be someone who stays silent. And be honest about which of my verdicts your best principle just cannot save.
