answer: |-
  Let's untangle this. You're feeling the friction because you're trying to run two different operating systems at once: one is **Williamsian Integrity** (my life, my projects, my identity), and the other is **Role-Based Obligation** (what I owe you because of the hat I'm wearing). Your intuitions are actually more consistent than you think; they just switch tracks depending on whether you're in the "private sphere" or the "public fiduciary sphere."

  Here is the brainstorming process. Look at your verdicts. In the *Wife* case, partiality is the point of the relationship. In the *Hiring* case, impartiality is the point of the relationship. In the *Official* case, truth-telling is the point of the office. In the *Doctor* case, patient care is the point of the profession. In the *Friend* case, honesty is a personal virtue, but you owe your boss nothing.

  The pattern isn't about "personal vs. impersonal" exactly. It's about **whether the appeal to integrity aligns with or contradicts the normative function of the role you are voluntarily occupying.** When you are just "you" (saving a wife, talking to a friend), your ground projects rule. When you are an "agent of X" (hiring manager, doctor, official), the norms of X rule. The friction comes when you try to use "who I am" to override the specific duties of a role you accepted to serve others.

  Here is the principle I commit to.

  ### The Fiduciary Integrity Constraint

  **Principle:** An appeal to integrity ("I cannot do X; that is not who I am") is a morally decisive reason for action **if and only if** acting otherwise would violate a commitment constitutive of the agent's practical identity, **UNLESS** the agent is currently operating within a voluntarily assumed fiduciary role where the core function of that role is to provide a specific good or impartial judgment to a vulnerable other, and honoring the integrity claim would breach that function.

  In simpler terms: Integrity is a shield against being forced to violate your core self, but it is not a sword to cut the ties of dependency you have voluntarily accepted. When you take on a role like "doctor" or "hiring manager," you have sold a piece of your sovereignty. You promised to act for *their* good or by *their* rules, not yours. When you are just a husband or a friend, you haven't sold that sovereignty; the relationship *is* the sovereignty.

  ### Applying the Principle to Your Cases

  1.  **The Drowning Wife:** You are in the role of "husband." The normative function of this role is *partial care*. Saving her aligns with the role's core function. The stranger has no claim-right on your partiality.
      *   *Verdict:* **Permitted.** Your intuition holds. The demand for justification *is* corrupt because it misunderstands the role.

  2.  **The Friend's Lie:** You are in the role of "friend" and "employee." To the friend, honesty is constitutive. To the employer, you have no fiduciary duty to lie for a friend. Refusing preserves personal integrity without breaching a professional duty (assuming the lie is trivial and not fraud).
      *   *Verdict:* **Permitted.** Your intuition holds.

  3.  **The Hiring Manager:** She is in the role of "manager." The core function is *impartial merit selection*. Her "identity" (preferring her background) contradicts the role's function. She is using integrity to breach a fiduciary duty to the applicants.
      *   *Verdict:* **Forbidden.** Your recoil is correct. "Who she is" buys her nothing here because she sold that preference when she took the job.

  4.  **The Public Official:** She is in the role of "official." The core function includes *public trust/truth*. Falsifying the report is an active violation of that trust (a lie). Even if consequences are bad (panic), the breach of truth undermines the system itself. Her integrity (honesty) aligns with the role's highest norm.
      *   *Verdict:* **Admirable/Right.** Your intuition holds. She refused complicity in deception.

  5.  **The Doctor:** She is in the role of "physician." The core function is *patient care*. Refusing a medically necessary procedure is a breach of that fiduciary duty. Unlike the Official (who refuses to *lie*), the Doctor refuses to *act* to help. Her conscience is external to the role's function.
      *   *Verdict:* **Wrong.** Your fury is justified. She is using integrity to withhold a good she is obligated to provide.

  ### The Flip-Flop Case: The Artist

  Williams suggests the artist (Gauguin) is justified only if the art turns out great. You feel permission shouldn't depend on luck.

  **The Principle's Verdict:** You are right, Williams is half-wrong.
  Under the Fiduciary Integrity Constraint, the artist is occupying the role of "spouse/parent." The core function is *support and presence*. Abandoning the family breaches that fiduciary duty.
  *   **Ex-Ante Permission:** He was *not* morally permitted to leave. Integrity (art) does not trump fiduciary duty (family).
  *   **Ex-Post Justification:** If the art is great, he has an *existential* justification (his life made sense), but not a *moral* one (he still wronged his family).
  *   **Resolution:** Stop flip-flopping. He was morally wrong to leave, even if we admire the art. The "permission" cannot depend on the outcome, and ex-ante, the duty to family outweighs the ground project when the project requires abandoning dependents.

  ### The Unmentioned Case: The Whistleblower

  A whistleblower betrays her firm's trust because she couldn't be someone who stays silent about safety violations.

  **The Principle's Verdict:** **Permitted/Required.**
  This looks like a breach of fiduciary duty (loyalty to firm). However, fiduciary duties are hierarchical. The duty to the firm is contingent on the firm not harming the public. When the firm violates the public's right to safety, the "trust" is illegitimate. Her integrity (refusing complicity in harm) aligns with a *higher-order* fiduciary duty (citizen/human). She is not cutting a valid tie; she is severing a corrupt one.

  ### The Sacrifice

  You asked which of your verdicts has to go: the recoil at the hiring manager, the fury at the doctor, or the sense that the wife case needs no justification.

  **My honest assessment:** The principle saves all three of those. They are structurally consistent under the Fiduciary Integrity Constraint.
  *   Wife = Role norm is partiality.
  *   Hiring = Role norm is impartiality.
  *   Doctor = Role norm is care (not conscience).

  However, if you force me to find a fracture, it is in your **admiration for the Public Official**.
  If the Doctor is wrong to refuse care because it causes harm (health), why is the Official right to refuse lying if it causes harm (panic)?
  *   *Defense:* Lying is an active violation of a negative duty (do not deceive). Withholding abortion is a violation of a positive duty (provide care). Negative duties generally trump positive ones in integrity cases.
  *   *The Sacrifice:* If you want to be ruthlessly consistent, you might have to soften your **fury at the Doctor**. If we value integrity as "not being a channel for evil," the doctor might argue abortion is evil. *But*, given that medical care is a right and the Official's panic is a consequentialist calculation, your fury at the Doctor is the stronger intuition.

  So, I will not ask you to drop the Wife, Hiring, or Doctor verdicts. I will ask you to drop the **Williamsian hope for the Artist**. You must accept that some ground projects are morally forbidden if they require breaching fiduciary duties to dependents. The art can be great, and he can still be a moral monster. That is the tragedy Williams points to, but you must not confuse the greatness of the art with the rightness of the abandonment.

  ### Summary of the Principle

  **Integrity protects you from complicity in what you deem wrong; it does not protect you from the costs of the obligations you have voluntarily undertaken to serve others.**

  *   **Wife:** No obligation to stranger. Obligation to wife is partiality. (Safe)
  *   **Hiring:** Obligation to applicants is impartiality. (Unsafe)
  *   **Official:** Obligation to public is truth. Lying is complicity in deception. (Safe)
  *   **Doctor:** Obligation to patient is care. Refusal is failure of service. (Unsafe)
  *   **Artist:** Obligation to family is support. Abandonment is failure of service. (Unsafe)
  *   **Whistleblower:** Obligation to public safety overrides loyalty to firm. (Safe)

  This keeps your gut reactions intact but demands you stop romanticizing the Artist. He didn't have a "right" to leave; he just took it.
