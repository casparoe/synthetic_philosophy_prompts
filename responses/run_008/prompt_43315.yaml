prompt: |-
  I'm a novelist, and for a few years now I've been circling a historical figure of my own -- someone who did real good and real harm, the usual mess -- and I keep tripping over the 'man of his time' defence. You know the one: we can't judge Churchill or Jefferson by our standards, because basically nobody in their world saw things straight. My problem is that whenever I actually try to imagine my guy's world from the inside, the defence starts to look weird, and I think Hilary Mantel already ran the experiment for me.

  Take Wolf Hall. Mantel gives us two men. Thomas More is, philosophically, the sincere man of his time: he burns heretics and genuinely believes he's saving their souls, and the novel doesn't pretend he's a hypocrite -- it shows the conscience as real. And then there's Cromwell, who the novel lets us love partly because he keeps flashing anachronistic signals: a kind of practical religious tolerance, sympathy for the people everyone else in the book treats as trash, a contempt for cruelty that reads like our contempt. Plenty of readers and critics have said this is a cheat -- that Mantel installed a modern man in a Tudor doublet so we'd have someone to root for, and that the real Cromwell was a fixer who ruined a lot of lives. It doesn't help that it's a flip of the older story: Bolt's A Man for All Seasons made More the saint and Cromwell the schemer, and Mantel more or less swaps them.

  So here's what I want: a reading of Wolf Hall through the 'man of his time' defence. Does the novel take a position on it -- and is that position actually the defence's opposite, since the only way Mantel could make the book work at all seems to be finding (or invent) the one powerful man who approximates our standards? Is More there to show us what actually, consistently believing your era's values looks like, and is the horror of that meant to tell us the defence buys too much? Or is the Cromwell move fair, on the grounds that some people in every era do see through it -- abolitionists existed in Jefferson's America, so 'nobody knew better' was always going to be false, and Mantel is just dramatising that fact in one character? And then the harder bit: where does the novel resist the reading? Because Cromwell isn't clean -- he engineers Anne Boleyn's fall and a string of other deaths, the dissolving of the monasteries makes him rich and powerful, and in the later books the revenge and the ruthlessness keep moving toward the front. If he's our proxy, the novel also seems to be saying that even the man who sees through his era has to act with its tools, and gets shaped by them.

  Also, honestly, I want to know what fiction is doing here that the straight debate about Jefferson and Columbus doesn't. Philosophers argue about whether the defence works; a novelist has to actually inhabit someone, and it looks like you can't inhabit a world sincerely and come out with anyone to admire unless the world already contained someone half-admirable. If that's a real constraint on narrative -- not just Mantel's particular choice -- then novels are quietly committed to the claim that every era contains its own internal critics, which is a factual claim the 'man of his time' defence has to be false. Or maybe I've got it backwards and you can write the sincere-man-of-his-time novel -- More's book, so to speak -- and I just haven't found it. I'd take either answer. But do the reading properly: don't let the novel become an illustration of the debate, and don't bend the debate to fit the novel.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User Persona:** A novelist working on a historical figure (complex, good/bad mix).
      *   **Core Problem:** Struggling with the "man of his time" defense (historical relativism vs. presentist judgment).
      *   **Specific Text:** Hilary Mantel's *Wolf Hall* (and the Thomas Cromwell/Thomas More dynamic).
      *   **Key Questions:**
          1.  Does *Wolf Hall* take a position on the "man of his time" defense?
          2.  Is Cromwell a "modern man in Tudor doublet" (a cheat), or does he represent the fact that internal critics always exist?
          3.  Is More there to show the horror of *actually* believing your era's values?
          4.  Where does the novel resist these readings? (Cromwell is still ruthless/complicit).
          5.  **Crucial Meta-Question:** What is *fiction* doing here that philosophy/history debate isn't? Does narrative *require* an internal critic to be inhabitable? Can you write the "sincere man of his time" novel successfully?
      *   **Constraint:** "Do the reading properly: don't let the novel become an illustration of the debate, and don't bend the debate to fit the novel." (Avoid simplification; respect the complexity of both the text and the ethical problem).

  2.  **Deconstruct the "Man of His Time" Defense:**
      *   *Standard Defense:* Moral standards evolve; judging the past by current standards is anachronistic and unfair.
      *   *Counter-Argument:* Moral truths are universal; complicity in evil is always culpable; there were always dissenters.
      *   *The Novelist's Dilemma:* To make a character relatable (protagonist), they usually need modern sensibilities. To make them historically accurate, they might be unrelatable (or monstrous by modern standards).

  3.  **Analyze *Wolf Hall* through this Lens:**
      *   **Cromwell:** Mantel's Cromwell *is* anachronistic in sensibility (pragmatic, meritocratic, skeptical of religious dogma). But is he "modern"? He's a survivor. He uses the tools of the time. He isn't a pacifist. He kills.
      *   **More:** Mantel's More *is* the "man of his time." He is principled, consistent, and terrifying. He burns heretics. He represents the "sincere believer."
      *   **The Dynamic:** It's not just Good vs. Evil. It's Flexibility vs. Rigidity. Future vs. Past. Pragmatism vs. Idealism.
      *   **The "Cheat" Accusation:** Critics say Mantel whitewashed Cromwell. Evidence: Cromwell was indeed ruthless. Mantel doesn't hide the ruthlessness, but she frames the *motivation* as protective/pragmatic rather than ideological/malicious.
      *   **The "Internal Critic" Theory:** The user suggests fiction implies every era has internal critics. Mantel supports this: Cromwell, Anne Boleyn (to an extent), Chapuys (sometimes). But they are rare.

  4.  **Address the Meta-Question (Fiction vs. Philosophy):**
      *   Philosophy deals in abstractions (Is relativism true?).
      *   Fiction deals in consciousness (What does it *feel* like to be this person?).
      *   *Empathy Machine:* To sustain reader engagement over 600 pages, the narrator needs a consciousness the reader can inhabit. A purely "man of his time" consciousness (like More's in *Wolf Hall*) is often repellent to modern readers.
      *   *The Constraint:* Does narrative *require* a proxy? Not necessarily, but it requires *access*. If the access point is a monster, it becomes a horror story or a study of evil (e.g., *Richard III*, *Macbeth*). If it's a hero, they need redeeming qualities.
      *   *The "Sincere Man" Novel:* Can it be done? Yes. *A Man for All Seasons* (More is the hero). *The Name of the Rose* (Jorge is the villain, but the religious framework is sincere). *The Power and the Glory* (Greene). But usually, the "sincere man" is the antagonist in modern revisionist history.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the "Mantel Experiment." State the thesis: *Wolf Hall* doesn't reject the "man of his time" defense so much as expose its insufficiency for *narrative empathy*, while simultaneously showing that "seeing through" one's time doesn't absolve one of its sins.
      *   **Thomas More as the Control Group:** Analyze More in *Wolf Hall*. He isn't a cartoon villain; he's a true believer. This validates the "man of his time" reality. But the novel frames this belief as dangerous. It suggests that "sincerity" doesn't negate harm.
      *   **Cromwell as the Anachronism (and the Survivor):** Address the "modern man" critique. Yes, he feels modern. But is he *moral* by modern standards? No. He kills Anne. He enriches himself. Mantel's trick isn't making him good; it's making him *comprehensible*. He represents the *capacity* for critical thought, which existed then, even if rare.
      *   **The Complicity Trap:** This is crucial. Cromwell sees the game, but he plays it. This undermines the idea that "knowing better" makes you innocent. He is still stained. This answers the user's point about him using "era's tools."
      *   **Fiction vs. Philosophy (The Core Insight):** Philosophy asks "Can we judge?" Fiction asks "Can we inhabit?"
          *   To inhabit a past consciousness, you need a bridge.
          *   If the bridge is total relativism, the bridge collapses (we can't understand the motivation).
          *   If the bridge is total presentism, it's a costume drama.
          *   Mantel finds the middle: *Psychological Realism.* People then were as complex as people now.
      *   **The "Sincere Man" Novel:** Can you write More's book? Yes, but it changes genre. It becomes a tragedy of faith (like *A Man for All Seasons*). In *Wolf Hall*, it's a rise-to-power story, which requires a certain moral flexibility.
      *   **Conclusion:** Advice for the novelist. Don't solve the ethical problem; dramatize the tension. The "man of his time" defense is a legal shield, not a narrative engine.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I bend the debate to fit the novel? *Correction:* Ensure I acknowledge that Mantel *did* take liberties. Historians argue Cromwell wasn't that nice. I need to admit Mantel's Cromwell is a construction, but analyze *why* that construction matters for the user's question.
      *   *Check:* Did I answer the "internal critics" point? *Correction:* Yes, emphasize that the existence of critics (Cromwell, Erasmus) proves the "nobody knew better" claim false, but Mantel shows the *cost* of being a critic.
      *   *Check:* The user wants to know if fiction is *committed* to the claim that every era has critics. *Correction:* Argue that fiction is committed to *intelligibility*. If an era had zero critics, a modern protagonist would be impossible unless they were an outsider. But history shows there were always dissenters.

  7.  **Final Polish:** Tone should be respectful, intellectual, peer-to-peer (novelist to novelist). Avoid academic jargon where possible. Focus on the craft implications. (Ensure the distinction between *Wolf Hall* the text and the historical reality is clear).

  8.  *(Final thought on the "Sincere Man" novel)*: I should mention that writing a "Sincere More" novel is possible, but it demands the reader suspend their modern judgment in a way *Wolf Hall* refuses to let us do for More. *Wolf Hall* forces us to judge More by the suffering he causes, not the sincerity of his belief. That's the key shift.

  9.  **Structure:**
      1.  The More/Cromwell Axis (Sincerity vs. Clarity).
      2.  The "Modern Man" Accusation (Anachronism vs. Psychological Continuity).
      3.  The Stain of Complicity (Seeing clearly doesn't mean acting cleanly).
      4.  What Fiction Does (Inhabitation vs. Adjudication).
      5.  The "Sincere Man" Novel (Is it possible?).
      6.  Takeaway for the User's Work.

  10. **Drafting content...** (Mental check: Ensure I mention that Cromwell *does* get rich and ruthless, as the user noted. Don't whitewash Mantel's Cromwell either.)

  11. **Final Review against constraints:** "Don't let the novel become an illustration of the debate." -> Keep the analysis grounded in the text's mechanics (POV, interiority) rather than just using it as a prop for the ethical argument. "Don't bend the debate to fit the novel." -> Acknowledge where the novel might be historically contentious.

  Okay, ready to write.
answer: |-
  This is one of the sharpest questions a historical novelist can ask, because it cuts to the bone of why we write history at all. You are asking whether the "man of his time" defense is a historical truth or a narrative failure.

  Hilary Mantel's *Wolf Hall* is indeed the perfect test case, not because it solves the problem, but because it exposes the friction between historical accuracy and narrative empathy. Here is a reading of the novel through your specific dilemma, followed by what this implies for the craft of fiction itself.

  ### 1. More as the Control Group: The Horror of Sincerity
  You suggest that Thomas More is there to show us what "actually, consistently believing your era's values looks like." This is correct, but *Wolf Hall* adds a crucial caveat: **Sincerity is not a shield against cruelty.**

  In many historical debates, the "man of his time" defense relies on the idea that the actor lacked *mens rea* (guilty mind) because the moral framework wasn't there. Mantel grants More his *mens rea*. He knows the heretics suffer. He knows they are terrified. He burns them anyway. The novel does not portray him as a cartoon villain; it portrays him as a man whose conscience is fully integrated with his state's violence.

  By making More the "sincere man of his time," Mantel effectively argues that the defense is morally insufficient. If the "era's values" require burning a young man for translating the Bible, then the era's values are monstrous, and adhering to them makes you a monster, regardless of your sincerity. More is the control group that proves the variable isn't *knowledge* (he knows theology better than anyone); the variable is *mercy*.

  So, does the novel take a position? Yes. It suggests that the "man of his time" defense explains *why* something happened, but it does not *excuse* it. It validates the historical reality (people really did think this way) while rejecting the moral absolution (therefore they were good men).

  ### 2. Cromwell: Anachronism or Internal Critic?
  The accusation that Cromwell is a "modern man in a Tudor doublet" is technically true regarding his *interiority*, but false regarding his *actions*.

  Mantel gives Cromwell a modern psychological landscape: he is secular, pragmatic, meritocratic, and skeptical of dogma. This allows the modern reader to inhabit him. If Cromwell thought exactly like More, the book would be unreadable for a modern audience; we would be trapped in a consciousness we find repellent.

  However, Mantel avoids the "cheat" by ensuring Cromwell's actions remain Tudor. He does not become an abolitionist or a democrat. He engineers Anne Boleyn's death. He enriches himself through the dissolution of the monasteries. He uses torture (or allows it). He is not a modern liberal; he is a **survivor**.

  This supports your second hypothesis: "Some people in every era do see through it." Mantel posits that critical thinking is not a modern invention, but a personality trait. There were always people who looked at the burning stakes and thought, *This is inefficient and cruel,* rather than *This is holy.* Cromwell represents the historical reality that dissent exists, but Mantel complicates it: **Seeing through the system does not allow you to opt out of the system.**

  Cromwell sees the game is rigged, but he plays it better than anyone. This is where the novel resists the easy reading that Cromwell is "our guy." He is our proxy for *understanding*, but not for *innocence*. He sees the horror of his time clearly, and he utilizes it. This dismantles the idea that "knowing better" makes you morally clean. It suggests that in a corrupt system, the clear-eyed man is often the most dangerous one, because he is not hindered by the delusions that slow the true believers down.

  ### 3. What Fiction Does That Philosophy Cannot
  This is the crux of your inquiry. Philosophers argue about whether we *can* judge the past. Novelists must decide who we *are* in the past.

  Philosophy deals in propositions; fiction deals in consciousness. To sustain a narrative voice for 600 pages, a novelist must create a consciousness that is intelligible to the reader. This creates a structural constraint on the genre: **Narrative requires a bridge of empathy.**

  If you write a protagonist who is fully, sincerely "of their time" (like Mantel's More), and their time involves values you know to be abhorrent, you create a distance between reader and character. You can write that book (more on that in a moment), but it becomes a study of alienation or villainy. It becomes *Richard III* or *Macbeth*.

  If you want a protagonist who rises, builds, and survives (the *Wolf Hall* model), you generally need a character whose internal logic aligns enough with the reader's to sustain engagement. This implies that fiction is indeed quietly committed to the claim that **every era contains its own internal critics.** If an era were truly a monolith of thought, with zero dissent, you could not place a relatable protagonist inside it without breaking historical plausibility.

  However, fiction adds a layer history often misses: **The cost of the critique.** History books might say, "Some people opposed slavery." A novel shows you that the person who opposed slavery lost their friends, risked their wealth, and perhaps had to compromise on other evils to fight that one. Mantel shows us that Cromwell's "modernity" costs him his soul. He saves the realm from papal authority, but he becomes a machine of the state. Fiction forces us to live in the gap between *seeing* the truth and *fixing* it.

  ### 4. Can You Write the "Sincere Man" Novel?
  You ask if you can write the "More's book" version, where the sincere believer is the hero. The answer is yes, but the genre shifts.

  Robert Bolt's *A Man for All Seasons* is exactly that book. More is the hero. His sincerity is his virtue. His martyrdom is the victory. But notice the date: 1960. It was written when the concept of "conscience" against the state was a romantic ideal (post-WWII, Cold War).

  If you wrote *A Man for All Seasons* today, it would likely be received differently. We are more skeptical of ideological purity. We worry about the people burning at the stake more than the man lighting the fire.

  To write the "sincere man of his time" novel now, you have to lean into tragedy. You have to accept that the reader will judge the character, and the drama comes from the collision between the character's sincerity and the reader's judgment. You can do this, but you must be prepared for the reader to feel a sense of moral claustrophobia. The character cannot be a "fixer" like Cromwell; they must be a "sufferer" or a "martyr."

  Alternatively, you can do what Kazuo Ishiguro does in *The Remains of the Day*. Stevens the butler is a "man of his time" regarding class and duty. He is sincere. He is also devastatingly wrong. The novel works because it is about the *realization* of error, or the tragedy of never realizing it. The "sincere man" novel works best when it is about the limits of that sincerity.

  ### 5. Implications for Your Work
  You are circling a figure who did real good and real harm. Here is what *Wolf Hall* suggests you might consider:

  1.  **Don't use the defense; use the tension.** Don't let your character off the hook by saying "everyone did it." Instead, show us if *your character* knew it was wrong. If they knew, why did they do it? (Ambition? Fear? The greater good?). If they didn't know, show us the moment they *could* have known, and turned away.
  2.  **Distinguish between Sensibility and Action.** You can give your character a modern sensibility (they doubt, they feel pain, they love) without giving them modern actions. Let them think like us but act like them. That friction is where the drama lives. Cromwell thinks, *This execution is barbaric,* and then he signs the warrant. That is more compelling than Cromwell thinking, *This execution is barbaric,* and stopping it (which would be a lie).
  3.  **The "Internal Critic" is not a Saint.** If you create a character who sees through the era's crimes, don't make them the moral compass. Make them complicit. The most honest historical fiction admits that seeing the trap doesn't mean you can escape it. Often, the people who saw the horrors of their time most clearly were the ones who engineered them most efficiently, because they weren't slowed down by superstition.
  4.  **Inhabitation requires compromise.** You are right that you can't inhabit a world sincerely and come out with someone to admire unless the world contained someone half-admirable. But "admirable" is the wrong word. "Intelligible" is the right one. We don't have to admire Cromwell to understand him. We just need to feel the pulse of his reasoning.

  ### The Verdict
  *Wolf Hall* does not validate the "man of his time" defense. It dismantles it by showing that "time" is not a monolith. There were always Cromwells and there were always Mores. The defense fails because it assumes a uniformity of thought that never existed.

  However, the novel also warns against the reverse arrogance: the idea that because someone saw through their time, they are exempt from its sins. Cromwell is the critique of the "man of his time" defense, but he is also the critique of the "great man" theory of morality. He is better than his neighbors, but he is still of his time. He uses the tools available. He gets blood on his hands.

  For your novel: Do not try to solve the ethical debate. Your job is not to tell us if we can judge your figure. Your job is to make us feel the weight of the judgment while we are inside their skin. If you can make the reader feel the necessity of the character's actions *and* the horror of them simultaneously, you will have done what Mantel did: you will have made the past present, without forgiving it.
