  1. An adult human reasoning about why the basement flooded after a storm: clearly yes.
  2. Honeybee waggle dancing: no — impressive, but the "message" is fixed by the dance geometry and doesn't enter into other reasoning.
  3. A New Caledonian crow that spontaneously bends a wire into a hook to fish food out of a tube, and revises its plan when the experimenter rearranges the apparatus: yes.
  4. A top chess engine searching millions of positions per second: no, despite the flexibility within the game.
  5. A chimpanzee with a lexigram board who recombines symbols into novel requests — pointing at sequences like "give Mary banana" and "give Mary ball" that nobody drilled as whole strings: yes.
  6. A beaver building a dam: no — sophisticated output, but the same stereotyped routines every time.
  7. A tamarin monkey that seems to track whether another individual can see food, but only in the two or three testing contexts she was trained on: no.

  Next week the three of us are having dinner, and these cases are coming up. Predict her verdicts on each:

  (a) a current large language model, which produces novel, well-formed combinations at scale but whose inner workings nobody fully understands;
  (b) a rat that navigates a maze using a hippocampal cognitive map, finding detours through corridors it has merely explored but never been rewarded in;
  (c) an LLM-based agent with persistent memory and tools that forms, revises, and abandons multi-day plans in an office environment.

  I'm less interested in the answers than in the method. Identify at least two distinct rules that fit her verdicts on cases 1–7 equally well (consider, for example, something like inferential promiscuity — representations that freely trade across domains in reasoning — versus something like combinatorial productivity and systematicity), spell out exactly what each rule predicts for the three new cases and where they diverge, then give your best guess for each verdict with your reasons for preferring the rule you favor. Finally, tell me which single additional case — one I could raise at dinner — would best discriminate between the candidate rules, and what her answer to it would reveal. Be explicit about the points where her track record genuinely underdetermines the prediction rather than papering over them.
