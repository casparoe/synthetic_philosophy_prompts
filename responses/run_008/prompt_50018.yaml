  A red spot wakes upon the left,
  then green ignites upon the right.
  Yet seen is neither, both bereft,
  for one traveller takes flight.
  It crosses over, smooth and sure,
  and shifts its colour mid-air, obscure.
  The second spark is not yet born
  when first is changed, and memory torn.

  Was this inscribed before the fact?
  Or rewritten when the story closed?
  There is no line, no distinct act
  where experience is composed.
  You swear the colour flowed and turned,
  and shifted its colour mid-air, obscure—
  but the brain keeps no single text,
  only the reading, and the reread.
