  2.  **Deconstruct the Colour Phi Phenomenon:**
      *   Stimulus: Spot A (Red) flashes, then Spot B (Green) flashes.
      *   Perception: Observer sees one spot moving from A to B, changing colour from red to green *during* the motion.
      *   The Puzzle: The colour change is perceived *before* the second spot (Green) actually flashes. How does the brain know to change the colour mid-stream before the second stimulus arrives?
      *   Dennett's Point: The distinction between "seeming" and "happening" is fuzzy. There's no "finish line" in the brain where consciousness happens.
      *   Orwellian vs. Stalinesque:
          *   Stalinesque: The brain waits for all data, then fabricates a false memory of the motion/change (show trial).
          *   Orwellian: The brain revises the memory after the fact to make it coherent (revisionist history).
          *   Dennett: Both are wrong; there's no single stream to revise or fake.

