      *   **Content:**
          *   First half: Describe the illusion (two spots, red/green, alternating, apparent motion, colour shift mid-path before the second flash).
          *   Second half: Enact the dispute (Orwellian vs. Stalinesque) without resolving it.
          *   Specific Technique: Repeat one of the earlier lines near the end, but slightly revised. The reader shouldn't know which version is "true."
