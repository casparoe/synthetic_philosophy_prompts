  4.  **Developing the Tests:**
      *   *Absolutism Test:* "What would it take to change your mind?" vs. "Is this a line you cannot cross even if X happens?" Look for consistency across contexts.
      *   *Trade Test:* Does Side A get something they value *more* than what they gave up, and vice versa? (Subjective valuation).
      *   *Capitulation Test:* Is one side signing just to stop the pain? (Check for "exhaustion markers").
      *   *Future-Proofing:* Does this deal make the next fight harder or easier?

  5.  **Applying to Cases:**
      *   *Case 1: Injection Site (Values: Public Health vs. Moral Order).* High value conflict. Low trade space?
      *   *Case 2: Storefronts vs. Bus Lane (Values: History vs. Mobility/Environment).* Potential for integrative solutions (design changes, documentation, timing).
