      *   *Procedure Verdict:* If the value is "permanent physical presence in the town square" vs. "liquidating assets for future potential," a hybrid (small statue + some money) might violate the core intent of *both*. The procedure might vindicate their refusal if the values are truly lexicographic.

  7.  **Addressing Limitations (The "Candid" Section):**
      *   Checklists can't measure sincerity perfectly.
      *   Mediator bias (pushing for deal vs. knowing when to stop).
      *   Power imbalances (one side can afford to wait/litigate, the other can't).
