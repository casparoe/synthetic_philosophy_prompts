      *   Key concept: *Integrative Bargaining* (expanding the pie) vs. *Distributive Bargaining* (splitting the pie).
      *   Key concept: *Incommensurable Values* (some things shouldn't be traded).
      *   Key concept: *Moral Remainder* (acknowledging loss even in agreement).
      *   Key concept: *Shadow of the Future* (repeated games require trust preservation).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to follow the timeline (Intake -> Joint -> Decision).
