  9.  *(Self-Correction during drafting)*: I need to make sure I don't just say "it's coincidence." Some of it *is* gene-environment correlation (niche picking). If you are genetically prone to woodworking, you might meet a Betty at a woodworking club. So it's not *just* luck, it's genes influencing exposure to specific environments. I need to make that distinction clear.

  10. **Final Review against constraints:** "I'd rather hear 'heritability has nothing to say about the dog's name' than have you force it." -> I will explicitly state this.

