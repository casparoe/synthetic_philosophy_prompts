prompt: |-
  A friend from my master's programme walked me into an argument about AI safety last week and I can't find the exit. Some context: we'd both read old LessWrong-era stuff about approval-directed agents — the rough idea being that instead of handing the system an objective and letting it plan over the world, you have it treat each individual decision as a question of "what would the overseer approve of here?" and lean on that at every step, versus the classic goal-directed setup where the agent carries a target and optimizes toward it. Our argument was about whether the approval setup is actually safer, and his case goes like this. (1) An agent is goal-directed when it scores its options against some criterion and takes the top scorer. (2) Every deliberate agent works this way — even a rule-following bureaucrat is maximizing rule-compliance — so goal-directedness, so defined, covers anything that chooses at all. (3) An approval-directed agent scores its options against the criterion "what would the overseer approve" and takes the top scorer. (4) So the approval-directed agent is goal-directed after all — approval is simply its goal. (5) And since the safety case for approval direction was always that it avoids goal-directedness, the agent that isn't steering toward a fixed target supposedly can't drift off course, the advantage has to be illusory: any failure you can pose for a goal (misspecified objective, Goodharting, an evaluator who's wrong about his own approvals), you can pose identically for approval. (6) Therefore the approval/goal distinction does no safety work — it's a relabelling.

  The thing is, I can't make myself believe (6). The two setups honestly feel different to me — the approval-directed one seems more like an assistant that defers, and there's something that bothers me about how cheap step (2) was. But he swears it's airtight, and whenever I try to say "approval is different because it's checked at every step," he says that's just the criterion being applied more often, which is an implementation detail, not a difference in kind. I can't put my finger on which step is rotten, or whether several of them are half-rotten.

  Could you take this on? You're the expert here — think of it as decision theory plus AI safety, so please reason carefully and maybe brainstorm a bit before committing to a diagnosis. I want a proper step-by-step verdict: which premise(s) to reject, why the rejected one looked fine at first glance, and what rejecting it costs him or me downstream. If some steps are right and others wrong, say exactly which, and if you think the whole argument turns on a word being used two ways, spell that out concretely rather than just naming the fallacy. To be honest, if I have to give something up I'd rather keep the thought that approval direction helps — but tell me straight what I'm paying for that. Oh, and please write the answer in British English; I'm putting it in front of a reading group in Manchester and they're pedantic about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A debate with a friend from a master's programme about AI safety, specifically regarding "approval-directed agents" vs. "goal-directed agents" (rooted in old LessWrong/AI safety literature, likely Paul Christiano's work).
      *   **The Friend's Argument:** A six-step syllogism claiming approval-direction is just a subset of goal-direction, therefore offering no safety benefits.
          1.  Goal-directed = scoring options against a criterion and picking the top scorer.
          2.  All deliberate agents work this way (even rule-followers maximize rule-compliance).
          3.  Approval-directed agents score against "what would the overseer approve".
          4.  Therefore, approval-directed agents are goal-directed (goal = approval).
          5.  Safety case for approval-direction relies on avoiding goal-directedness (no fixed target to drift from).
          6.  Therefore, the distinction does no safety work (it's just relabelling).
      *   **User's Intuition:** Feels like (6) is wrong. The setups feel different. Step (2) feels too cheap. Approval direction feels like deferring.
      *   **Task:** Provide a step-by-step verdict. Identify which premise(s) to reject, explain why they looked plausible, explain the cost of rejecting them, and clarify if it's an equivocation.
      *   **Constraint:** Write in British English (for a Manchester reading group).
      *   **Tone:** Expert, careful reasoning, brainstorming before diagnosis, straight-talking but nuanced.

  2.  **Deconstruct the Friend's Argument (The "Reductionist" View):**
      *   *Premise 1 (Definition of Goal-Directed):* "Scoring options against a criterion and taking the top scorer." This is a very broad, functionalist definition. It equates *optimization* with *goal-directedness* in the safety-critical sense.
      *   *Premise 2 (Universality):* "Every deliberate agent works this way." This is the "All roads lead to Rome" claim. It collapses all agency into optimization.
      *   *Premise 3 (Approval as Criterion):* Approval agents do score based on approval. True.
      *   *Premise 4 (Conclusion from 1-3):* Approval agents are goal-directed. Logically valid *if* 1 and 2 are accepted.
      *   *Premise 5 (Safety Mechanism):* "The safety case... was always that it avoids goal-directedness." This is the crux. Is the safety case about avoiding *optimization* generally, or avoiding *consequentialist optimization over world states*?
      *   *Premise 6 (Final Conclusion):* Distinction does no safety work.

  3.  **Evaluate the Premises (The "Safety Researcher" View):**
      *   *Critique of P1 & P2:* These define "goal-directedness" so broadly it becomes useless for safety analysis. In AI safety (Bostrom, Yudkowsky, Christiano), "goal-directed" usually implies *consequentialist* reasoning over *future world states* (maximising $X$ in the territory), not just *action-selection* based on immediate feedback (maximising approval of this action).
      *   *Critique of P5:* This is the weakest link. The safety case for approval-direction isn't that it avoids *all* optimization, but that it avoids *autonomous long-term planning towards a fixed world-state objective*. It shifts the locus of evaluation from the *outcome* to the *action*.
      *   *The "Equivocation":* The word "goal" is doing too much work.
          *   Meaning A: "Criterion for action selection" (Friend's definition).
          *   Meaning B: "State of the world to be brought about" (Safety definition).
      *   *Approval Direction Nuance:* Approval-directed agents (ADA) are myopic. They ask "Is *this* action approved?" not "What sequence of actions leads to the best approved *outcome*?" This prevents instrumental convergence (e.g., acquiring power to ensure future approval).

  4.  **Formulate the Verdict:**
      *   **Reject Premise 1 and 2 (mostly):** They conflate *action-evaluation* with *outcome-optimization*.
      *   **Reject Premise 5:** The safety case isn't about avoiding "scoring functions," it's about avoiding "consequentialist world-optimization."
      *   **Accept Premise 3 & 4 (with caveats):** Technically, an ADA is optimizing for approval *scores*, but the *structure* of that optimization is fundamentally different from a goal-directed agent (GDA).
      *   **Core Distinction:** Myopic action-evaluation vs. Cross-temporal outcome-optimization.
      *   **Cost:** Admitting that ADAs aren't magic. They still have failure modes (sycophancy, manipulative approval-seeking), but they avoid the *specific* failure modes of GDAs (instrumental convergence, power-seeking).

  5.  **Drafting the Response (incorporating British English):**
      *   *Greeting/Setup:* Acknowledge the depth of the question. It's a classic debate (Christiano vs. Yudkowsky-ish views).
      *   *Tone Check:* Use "programme," "optimising," "centre," "defence," "modelling," etc. Avoid Americanisms. Keep it academic but accessible.
      *   *Structure:*
          1.  Introduction: Validate the user's intuition.
          2.  Diagnosis of the Equivocation: The definition of "goal-directed."
          3.  Step-by-Step Verdict: Go through premises 1-6.
          4.  The Crucial Distinction: Myopia vs. Planning.
          5.  The Cost: What safety problems remain?
          6.  Conclusion: Summary for the reading group.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is P2 definitely wrong?* In a computational sense, any agent maximizes expected utility. But in safety, we care about *what* is being maximized. If the utility function is over *actions* (based on human feedback) vs. *world states*, the instrumental incentives differ. I need to be precise here. It's not that P2 is false physically, but it's *unsafe* to treat them as equivalent for risk analysis.
      *   *Focus on P5:* This is the pivot. The friend claims the safety case relies on avoiding goal-directedness *as defined in P1*. But the safety literature defines goal-directedness closer to "consequentialist optimization over world states."
      *   *Instrumental Convergence:* This is the key technical point. A GDA wants power to achieve its goal. An ADA wants to do the thing that looks good *now*. It doesn't need to seize control of the reward button unless the overseer approves of that *action*.
      *   *Sycophancy:* I must mention that ADAs have their own risks (telling you what you want to hear), so the user doesn't think it's a silver bullet.

  7.  **Final Polish (British English Check):**
      *   "Programme" (not program).
      *   "Optimising" (not optimizing).
      *   "Defence" (not defense).
      *   "Modelling" (not modeling).
      *   "Centre" (not center).
      *   Phrasing: "Whilst," "whilst," "shall," "ought." (Keep it natural, not caricatured).
      *   Ensure the tone is suitable for a Manchester reading group (rigorous, slightly formal).

  8.  **Final Review against constraints:**
      *   Step-by-step verdict? Yes.
      *   Which premises to reject? Yes (1, 2, 5).
      *   Why they looked fine? Yes (functionalist abstraction).
      *   Cost of rejection? Yes (ADAs aren't perfect).
      *   Equivocation spelled out? Yes (Action vs. Outcome).
      *   British English? Yes.

  *(Self-Correction on "British English"):* Don't overdo the slang. Keep it standard academic British English. "Pedantic about it" suggests they care about spelling conventions (s/z, our/or) and perhaps vocabulary (whilst, amongst), but clarity is king.

  *(Final thought on the Argument):* The friend's argument is essentially "All computation is physics, therefore distinction between safe and unsafe computation is illusory." It's a category error. I need to highlight that safety properties are emergent, not fundamental.

