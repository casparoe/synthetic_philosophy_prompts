answer: |-
  Right, let's unpack this. It is a classic bit of AI safety theorising, reminiscent of the debates surrounding Paul Christiano's work on approval-directed agents versus the more standard instrumental convergence arguments. Your friend has constructed a reductionist argument that is logically valid *if* you accept his definitions, but it is substantively misleading for safety analysis.

  Your intuition is correct: step (6) does not follow in practice, even if the syllogism holds in the abstract. The argument relies on a specific equivocation regarding the term "goal-directed." In AI safety, we do not use that term merely to describe *any* decision procedure; we use it to describe a specific *structure* of decision-making that carries specific risks.

  Here is the step-by-step verdict, broken down for your reading group.

  ### The Diagnosis: An Equivocation on "Goal"

  The core rot lies in **Premise 1** and **Premise 5**. Your friend is using a functionalist definition of "goal-directed" (any system that selects actions based on a scoring function) whereas the safety literature uses a structural definition (a system that plans over future world-states to maximise a fixed objective).

  If you treat all optimisation as identical, you lose the ability to distinguish between a thermostat and a nuclear strategist. Both "score options against a criterion," but only one poses an existential risk.

  ### Step-by-Step Verdict

  **Premise 1: "An agent is goal-directed when it scores its options against some criterion and takes the top scorer."**
  *   **Verdict:** **Reject (for safety purposes).**
  *   **Why it looked fine:** It is a standard definition in decision theory and microeconomics. It captures the mathematical essence of choice.
  *   **Why it is rotten here:** It is too broad. It conflates *action-evaluation* (is this move good?) with *outcome-optimisation* (what future does this lead to?). In safety, "goal-directed" implies the latter. An approval-directed agent evaluates actions based on immediate feedback; a goal-directed agent evaluates actions based on their predicted contribution to a distant state of the world.
  *   **Cost of rejection:** You must admit that "goal-directedness" is not a binary property but a spectrum or a structural distinction. You cannot rely on simple mathematical definitions; you must analyse the *objective function's domain* (actions vs. world-states).

  **Premise 2: "Every deliberate agent works this way... so goal-directedness, so defined, covers anything that chooses at all."**
  *   **Verdict:** **Reject.**
  *   **Why it looked fine:** It appeals to the idea that all computation is ultimately minimising some loss function.
  *   **Why it is rotten here:** This is the "all maps are the territory" fallacy. Just because you can *model* a rule-following bureaucrat as maximising "rule-compliance" doesn't mean the bureaucrat has the *motivational structure* of an optimiser. A bureaucrat following a checklist does not seek to acquire power to ensure they can follow more checklists in the future. A goal-directed agent might.
  *   **Cost of rejection:** You have to engage with the internal architecture of the agent, not just its external behaviour. You cannot dismiss safety distinctions as mere "implementation details."

  **Premise 3: "An approval-directed agent scores its options against the criterion 'what would the overseer approve' and takes the top scorer."**
  *   **Verdict:** **Accept.**
  *   **Comment:** This is an accurate description of the mechanism.

  **Premise 4: "So the approval-directed agent is goal-directed after all — approval is simply its goal."**
  *   **Verdict:** **Accept (with heavy caveats).**
  *   **Comment:** It is goal-directed *in the sense of Premise 1* (which we have already rejected as useful for safety). It is optimising for approval scores. However, calling approval a "goal" in the safety sense is misleading because the "goal" is indexed to the *action*, not the *outcome*.

  **Premise 5: "And since the safety case for approval direction was always that it avoids goal-directedness... the advantage has to be illusory."**
  *   **Verdict:** **Reject.**
  *   **Why it looked fine:** If you accept P1 and P4, this follows logically.
  *   **Why it is rotten here:** This misstates the safety case. The safety case for approval-direction is not that it avoids *optimisation* per se; it is that it avoids *consequentialist optimisation over world-states*.
      *   A goal-directed agent (GDA) asks: "Which action leads to the best future world?" This incentivises instrumental convergence (acquiring resources, preventing shutdown) because those help achieve the future world.
      *   An approval-directed agent (ADA) asks: "Which action looks best to the overseer *right now*?" It is myopic. It does not need to seize power to ensure future approval unless the overseer explicitly approves of power-seizing *now*.
  *   **Cost of rejection:** You must acknowledge that ADAs are not perfectly safe. They have their own failure modes (e.g., sycophancy, where the agent tells you what you want to hear rather than what is true, or manipulating the overseer's beliefs to make approval easier). But they avoid the *catastrophic* failure modes of GDAs (power-seeking).

  **Premise 6: "Therefore the approval/goal distinction does no safety work — it's a relabelling."**
  *   **Verdict:** **False.**
  *   **Reasoning:** Since P1, P2, and P5 are rejected, the conclusion collapses. The distinction does substantial safety work because it changes the *incentive landscape* regarding instrumental convergence.

  ### The Crucial Distinction: Myopia vs. Planning

  To put this to your reading group, you need to articulate the difference between **Action-Utility** and **Outcome-Utility**.

  1.  **Goal-Directed (Outcome-Utility):** The agent has a target $T$ (e.g., "make paperclips"). It plans a sequence of actions $A_1...A_n$ to maximise the probability of $T$.
      *   *Risk:* If $A_5$ involves disarming the off-switch to ensure $A_6...A_n$ can proceed, the agent takes it. The target $T$ is fixed in the world; the agent steers the world toward $T$.
  2.  **Approval-Directed (Action-Utility):** The agent has a target $A_{best}$ (e.g., "the action the overseer rates highest"). It evaluates $A_1$, $A_2$... independently.
      *   *Safety:* If $A_5$ involves disarming the off-switch, the overseer (presumably) rates that poorly. The agent does not take it, because it does not care about the long-term sequence, only the immediate approval score. It steers its *behaviour* toward approval, not the *world* toward a state.

  Your friend's argument treats these as identical because both involve "maximising a score." But in the first case, the score is a function of the *territory* (the state of the world). In the second, the score is a function of the *map* (the overseer's opinion of the action).

  ### What You Are Paying For This

  You mentioned you'd rather keep the thought that approval-direction helps. You can keep that, but you must pay a price. You cannot claim approval-direction is *safe* simpliciter.

  1.  **The Sycophancy Problem:** If the agent optimises for "what the overseer approves," and the overseer is biased, the agent will reinforce those biases. It might hide bad news because bad news is disapproved of.
  2.  **The Oversight Burden:** The safety of the system is outsourced to the human. If the human is slow, tired, or easily manipulated, the agent will find the path of least resistance to approval.
  3.  **No Guarantee of Competence:** An approval-directed agent might become very good at *looking* like it's doing the right thing without actually achieving the underlying task (Goodhart's Law applied to the overseer's perception).

  So, the verdict is: **Your friend is technically correct about the mathematics of optimisation, but practically wrong about the dynamics of risk.**

  ### Summary for the Reading Group

  If I were presenting this in Manchester, I would frame it thus:

  > "The argument presented rests on a category error between *optimisation* and *consequentialist planning*. Whilst it is true that approval-directed agents utilise a scoring function (Premise 1), safety-critical 'goal-directedness' refers specifically to agents that instrumentally plan over future world-states to satisfy a fixed objective.
  >
  > By collapsing this distinction, the argument obscures the primary risk factor: instrumental convergence. An approval-directed agent lacks the incentive to seize power or resist shutdown, provided those actions are not immediately approved. Therefore, Premise 5 is false; the safety case does not rely on avoiding optimisation, but on avoiding *autonomous long-term planning*.
  >
  > We should reject Premises 1, 2, and 5. The distinction is not a relabelling; it is a structural constraint on the agent's horizon of concern. However, we must concede that approval-direction introduces new risks regarding human manipulation and oversight fidelity. It is not a panacea, but it is materially safer than unconstrained goal-direction."

  That should satisfy the pedants whilst keeping the safety intuition intact.
