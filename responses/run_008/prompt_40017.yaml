      *   *Answer:* Philosophers argue that if it's *just* bookkeeping, you lose the ability to say the model is *wrong* about the world, only incoherent. The "Residue" is the concept of **model mis-specification relative to reality**, not just relative to coherence.

  5.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the user's expertise and the goal (faithful translation).
      *   **Section 1: The Principal Principle as a Prior Constraint.** Translate $Ch$ to $\theta$. Show how PP looks like a specific prior choice.
      *   **Section 2: Humean Chance as a Sufficient Statistic.** Explain Lewis's supervenience as $\theta$ being a function of the infinite sequence, not a generator.
      *   **Section 3: The Undermining Future as Posterior Collapse.** Explain how future data updating past "chance" breaks the standard conditional independence assumption.
      *   **Section 4: Hall's New Principle as Model Correction.** Translate as adjusting the likelihood/prior to account for the dependency between $\theta$ and $X_\infty$.
