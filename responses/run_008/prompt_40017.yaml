  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Caution:* Don't say de Finetti "solves" it. The philosopher denies de Finetti captures *chance*. I need to make sure the translation respects that denial without endorsing it.
      *   *Caution:* Ensure "Undermining" is clear. It's about the logical possibility that the best summary of the *actual* world differs from the high-probability summary of the *prior*.
      *   *Caution:* The user asked for "residue." I need to be honest about where the math stops and the metaphysics begins. The math handles coherence; the metaphysics handles reference.

