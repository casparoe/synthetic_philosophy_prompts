          *   *Nuance:* The statistician sees $\theta$ as a summary of exchangeability. The philosopher sees $Ch$ as a worldly constraint *on* the credence function.

      *   **De Finetti / Exchangeability:**
          *   *Phil:* Subjective only. Doesn't capture "worldly" chance.
          *   *Bayes:* $P(X_1, ..., X_n) = \int \prod P(X_i|\theta) dF(\theta)$. $\theta$ is a random variable representing the limiting frequency *within the model*.
          *   *Translation:* The statistician claims the integral representation *is* the chance. The philosopher claims the integral representation is just coherence, not truth-tracking.

      *   **Humean Chance (Best System Analysis / Limiting Frequency):**
          *   *Phil:* Chance is the value that appears in the best summary (axioms) of the Humean Mosaic (total history of events). It supervenes on the total pattern.
          *   *Bayes Translation:* $\theta$ is a functional of the infinite sequence $X_\infty$. $\theta = \lim_{n\to\infty} \frac{1}{n}\sum X_i$.
          *   *Conflict:* In standard Bayes, $\theta$ is usually prior to the data (generative). In Humeanism, the "chance" is fixed by the *entire* history (including future).

      *   **The Undermining Problem:**
          *   *Phil:* If chance supervenes on the total history, then a future sequence of outcomes could make the *current* chance different than what we think. If I know the future outcomes, I know the true chance. But the true chance dictates the probability of those future outcomes. Contradiction/Zero probability issues.
          *   *Bayes Translation:* This is the tricky part. In a standard hierarchical model, $\theta$ is fixed at $t=0$. Data updates $P(\theta|D)$.
          *   *Undermining in Bayes:* If $\theta$ is defined as the *limiting frequency of the actual infinite sequence*, then observing future data $X_{future}$ changes the value of $\theta$ for the *past*.
          *   *Standard Bayes:* $\theta$ is a parameter of the *process*, not a functional of the *realization*.
          *   *Translation:* The philosopher is treating $\theta$ as a random variable defined on the sample space of infinite sequences (a statistic), whereas the statistician treats $\theta$ as a latent variable in the generative mechanism.
          *   *Conflict:* The "Undermining" arises if the parameter is *defined* by the total data (Humean) but treated as *generative* (Probabilistic).

      *   **Hall's New Principle (NP):**
          *   *Phil:* Modify PP to handle undermining. $C(A | T_w) = P_{T_w}(A)$, where $T_w$ is the theory of chance for world $w$.
          *   *Bayes Translation:* Adjusting the conditioning set. Instead of conditioning on $Ch(A)=x$, condition on the *theory* that links chances to credences, acknowledging that the chance hypothesis itself has a probability less than 1. It's a correction to the likelihood or the prior weighting to account for the fact that the "chance" hypothesis might be undermined by the very data it predicts.

