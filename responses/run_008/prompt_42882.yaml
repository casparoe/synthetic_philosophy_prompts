answer: |-
  The dust in the bakery no longer smelled of yeast, but of dry flour and old paper. Arthur, the mediator, sat at the proofing table with a graphing calculator and a stack of solicitors' letters, while Eleanor checked her watch and Clara traced the grain of the oak counter she had sanded herself twenty years ago. The assets were not just the ovens and the mixers, which could be sold for scrap, but the leasehold on the high-street corner and the goodwill entangled with it; you could not split the location without killing the business. If they failed to agree, the partnership would dissolve into litigation, the lease would revert to the landlord, and the equipment would go to a liquidator who would take forty percent off the top. Arthur had written the disagreement point in the margin: £30,000 net to be split, minus legal fees, leaving each sister with roughly £10,000 and nothing else.

  To model the bargaining, Arthur assigned utility values based on the sisters' financial realities. Eleanor, wealthy and liquid, valued money linearly; for her, £1,000 was always 1 unit of utility. Clara, asset-rich but cash-poor, faced diminishing returns on cash compensation and high risk aversion; her utility for cash $c$ (in thousands) was modeled as $\sqrt{c}$. The feasible set was defined by the trade-off: if Eleanor kept the shop, she could pay Clara cash, generating a linear frontier. If Clara kept the shop, her inability to secure large loans curved the frontier inward. Normalizing the disagreement point to $(0,0)$, the Pareto frontier for the "Clara keeps shop" branch was approximated by the equation $u_E + u_C^2 = 100$, where $u_E$ is Eleanor's utility gain and $u_C$ is Clara's. The maximum possible gain for Eleanor (if Clara got nothing) was $u^*_E = 100$. The maximum possible gain for Clara (if Eleanor got nothing) was $u^*_C = 10$ (since $\sqrt{100}=10$).

  **The Calculations:**
  *   **Disagreement Point ($d$):** $(0, 0)$.
  *   **Ideal Point ($u^*$):** $(100, 10)$.
  *   **Kalai–Smorodinsky Solution:** This solution preserves the ratio of maximum gains. It lies on the line connecting $d$ to $u^*$, so $u_C = \frac{10}{100}u_E = 0.1u_E$. Substituting this into the frontier equation:
      $$u_E + (0.1u_E)^2 = 100 \Rightarrow 0.01u_E^2 + u_E - 100 = 0$$
      Solving for $u_E$ yields $\approx 61.8$, which gives **$u_C \approx 6.18$**.
  *   **Nash Bargaining Solution:** This solution maximizes the product of gains ($u_E \cdot u_C$) subject to the frontier. Substituting $u_E = 100 - u_C^2$ into the product:
      $$\text{Maximize } (100 - u_C^2)u_C = 100u_C - u_C^3$$
      Taking the derivative and setting to zero: $100 - 3u_C^2 = 0 \Rightarrow u_C = \sqrt{33.3} \approx$ **$5.77$**.

  **The Divergence:**
  To keep the shop, Clara required a utility score of at least $6.0$ (representing the shop's value minus the minimum cash compensation Eleanor would accept). The Nash solution ($5.77$) falls below this threshold, awarding the shop to Eleanor. The Kalai–Smorodinsky solution ($6.18$) clears the threshold, awarding the shop to Clara. The divergence arises from the **curvature of the Pareto frontier** (Clara's concave utility). Nash is sensitive to the local slope and favors the player with linear utility (Eleanor) who can "absorb" surplus more efficiently. Kalai–Smorodinsky is sensitive to the **ideal point**; because Clara's maximum potential gain is constrained by her liquidity (capped at 10 vs Eleanor's 100), the KS solution pulls the outcome toward her to ensure she achieves the same *proportion* of her ideal as Eleanor does of hers.

  If the sisters' wealth were equalized, Clara's utility function would become linear, straightening the frontier to $u_E + u_C = 100$. In this linear case, both solutions would converge on the midpoint ($50, 50$), likely resulting in a coin toss or cash split rather than a shop transfer. Similarly, if their valuations of the shop were identical, the ideal point would shift, reducing the KS pull toward Clara.

  **The Objection:**
  As Arthur closed his notebook, Eleanor stood up, gathering her gloves. She looked at the calculation that had just cost her the bakery. "You're treating her inability to pay as a virtue," she said, her voice tight. "The Nash solution rewards us for how much value we can actually create together. Your solution rewards her for how little she needs to be satisfied. That's not mediation, Arthur; that's charity with extra steps."
