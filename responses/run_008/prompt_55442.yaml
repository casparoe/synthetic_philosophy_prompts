answer: |-
  Hi everyone,

  I have been thinking a lot about the recap of the historiography month that was circulated, specifically the narrative arc moving from Ranke to Carr to White. While it is a compelling story and certainly captures the popular understanding of how historical theory has evolved, I worry that the podcast summary simplifies these thinkers to the point where the final conclusion becomes misleading. My concern is that if we accept the recap as strictly accurate, we end up with the idea that there is no real difference between good and bad history, only more or less entertaining stories, and I do not think any of the three historians mentioned would actually sign off on that claim. I wanted to share some nuances I found in the primary texts that might help us steer the discussion at the next meeting, particularly regarding what each of them was actually claiming about truth and evidence.

  Starting with Ranke, the recap describes him as the founder of scientific history who believed historians should just record facts without interpretation or moralizing. It is true that Ranke emphasized critical archive work and is famous for the phrase that history should show how it actually was. However, calling him a positivist who believed facts speak for themselves is an anachronism. Ranke was operating within a German Idealist and Romantic framework, not a twentieth-century scientific one. He believed that every historical epoch is immediate to God, meaning he thought there was a divine idea or essence within the events that the historian had to discern. He was not trying to eliminate interpretation but rather to purify it of personal bias so the deeper truth could emerge. This is where our German-speaking member's point becomes crucial. The famous phrase wie es eigentlich gewesen is often translated as how it actually happened, but eigentlich carries a connotation of essence or true nature, not just brute factual occurrence. Ranke was not claiming we can access raw data without a mind processing it, but that we can access the inner truth of the past through rigorous philological work. So, while he is the father of source criticism, the idea that he thought historians should be passive recorders is a caricature he would likely object to.

  Moving on to E.H. Carr, the recap suggests he argued that facts are invented by the historian and that biases do all the work. Carr certainly argued in What Is History? that historical facts do not speak for themselves and that the historian must select them from a vast sea of past events. He famously said we should study the historian before we study the facts to understand the selection process. However, Carr was not a radical relativist who believed facts are purely invented. He distinguished between facts of the past and historical facts, arguing that the latter are constituted through a dialogue between the historian and the evidence. He believed in objectivity not as a static possession but as a regulatory ideal, a horizon toward which we move. He believed in causality and progress, and he certainly did not think that one interpretation was as good as another regardless of evidence. He would argue that while bias is inevitable, some interpretations are better because they account for more facts and offer deeper causal explanations. So, while Carr demolishes the naive empiricism attributed to Ranke, he does not abandon the discipline's claim to truth.

  Then we have Hayden White, whose position is often the most radicalized in these summaries. The recap claims White showed historians are essentially novelists who impose literary plots and that one emplotment is as good as another. It is true that White, in Metahistory, argued that historical narratives employ poetic structures like tragedy, comedy, romance, and satire, and that the choice of plot is not strictly determined by the evidence. He highlighted the aesthetic and moral choices involved in turning a chronicle into a story. However, saying he claimed history is literature full stop and that any story is as valid as any other goes too far. White acknowledged evidential constraints. He did not say you could emplot the Holocaust as a comedy if the evidence did not support it. His point was that the data underdetermines the narrative form, not that the data is irrelevant. He was concerned with the ethical implications of these choices, arguing later in his career that historians have a moral responsibility in how they represent the past. He would likely reject the idea that there is no difference between good and bad history, insisting instead that we must be critically aware of the literary devices we use and their ethical consequences.

  This brings me to the punchline of the recap, which is that once you accept all this, there is no fact of the matter about better versus worse history books. This conclusion does not follow from the actual positions of Ranke, Carr, or White. Even if we accept that all history involves selection, interpretation, and narrative shaping, there are still rigorous standards for evaluating that work. A good history book is one that handles evidence responsibly, acknowledges its own limitations, offers coherent explanations, and engages fairly with counter-evidence. A bad history book is one that ignores evidence, relies on conspiracy theories, or imposes a narrative that the material cannot support. The discipline does not go out the window just because we admit historians are human beings with perspectives. In fact, acknowledging these perspectives is what makes the discipline robust, because it forces us to argue about our interpretations rather than hiding behind a false claim of pure objectivity.

  For our discussion, I suggest we frame the debate not as a slide from truth into fiction, but as a deepening understanding of what historical truth involves. We can acknowledge that Ranke's ideal of pure objectivity was metaphysically loaded, that Carr showed us the active role of the historian, and that White revealed the literary structures of our writing, without conceding that history is just entertainment. We can agree that while there is no view from nowhere, there are still better and worse views from somewhere. I think this allows us to honor the insights of the sceptics without falling into the trap of thinking that evidence and rigor no longer matter. I look forward to hearing what everyone else thinks, especially regarding how we balance the need for narrative with the responsibility to the evidence.

  Best,

  [Your Name]
