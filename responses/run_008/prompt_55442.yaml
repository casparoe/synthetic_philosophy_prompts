      *   **Leopold von Ranke:**
          *   *Podcast Claim:* Founded scientific history, motto "show how it actually was" (*wie es eigentlich gewesen*), no interpretation/moralizing, just facts from archives, positivism.
          *   *Reality:* Yes, he emphasized archives and critical source analysis. But "no interpretation" is wrong. He believed in seeing the hand of God in history, that every epoch is "immediate to God." He wasn't a positivist in the Comtean sense; he was an idealist/romantic. The phrase *wie es eigentlich gewesen* is often translated as "how it actually happened," but *eigentlich* implies essence or true nature, not just brute facts. He didn't think facts speak for themselves; he thought the historian discerns the divine idea in them.
          *   *Verdict:* Caricature. Misses the metaphysical/religious dimension. Overstates the "no interpretation" claim.

      *   **E.H. Carr:**
          *   *Podcast Claim:* Demolished Ranke. Facts don't exist until selected/interpreted. Facts invented by historian. Biases do all the work. Study the historian before the facts.
          *   *Reality:* Carr (*What Is History?*) did argue facts don't speak for themselves; the historian speaks to them. He emphasized selection. But he wasn't a radical relativist. He believed in progress, causality, and objective truth as a horizon ("the opinion which is fated to be ultimately accepted by all who investigate"). He didn't say facts are *invented*; he said they become historical facts through selection. He believed in a dialectic between historian and facts.
          *   *Verdict:* Partial truth but exaggerated. "Facts are invented" is too strong; Carr says they are selected. He didn't abandon objectivity entirely, just redefined it.

      *   **Hayden White:**
          *   *Podcast Claim:* Historians are novelists. Impose literary plots (emplotment). Choice is aesthetic, not evidential. One emplotment as good as another. History is literature, full stop.
          *   *Reality:* White (*Metahistory*) argued historical narratives have poetic structures (tropes, emplotment). He argued the *choice* of emplotment is not determined strictly by the data. However, he didn't say *any* story goes. There are constraints of evidence. He distinguished between chronicling and narrating. He was concerned with the moral/aesthetic implications of narrative forms. Later work emphasized the ethical responsibility of the historian. He didn't necessarily say history is *just* literature in the sense of fiction, but that it shares linguistic structures.
          *   *Verdict:* Strong simplification. "One emplotment as good as another" is the most contentious point. White acknowledged evidential constraints, though he emphasized the underdetermination of narrative by facts.

      *   **The Conclusion (No difference between good/bad history):**
