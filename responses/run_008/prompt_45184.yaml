prompt: |-
  So this keeps happening to me and I want to actually understand it instead of just feeling annoyed. I'm a dev, zero philosophy background btw. At work I told a teammate he needs to stop hardcoding credentials into the repo, and he shot back with "people in glass houses shouldn't throw stones" because I'd done exactly that in a throwaway prototype six months ago. And separately my sister pulls the same move whenever I nag her about smoking, because I vape, which she reckons is just as bad, so apparently my nagging doesn't count either.

  Obviously the proverb can't just mean "hypocrites are never right", that would be daft — the credentials were a genuine risk whether or not I'd been sloppy before. But it's doing *something*, and I'd like to know what. Can you lay out the different precise claims the glass houses thing could be making, as a menu: something about him having lost the standing to blame me (whatever "standing" actually is here), something about hypocritical blame being a separate wrong that he's committing on top of the original sloppiness, something merely evidential (his hypocrisy is a clue he doesn't really think it's bad), maybe something about fairness or turn-taking in arguments — and for each reading say whether it's actually plausible, and crucially whether it would let him get away with ignoring the credentials point. Also tell me which reading people are usually reaching for when they say it mid-argument, and whether any of the readings make the proverb work in the smoking case but not the credentials case, because those two feel different to me and I can't pin down why.

  Bullet points please, and keep it under 400 words — I'll be honest, I'll read it on my commute.
