answer: |-
  **MEMORANDUM**

  **TO:** Committee on Centers and Institutes
  **FROM:** [Your Name], Emeritus Professor of Physics
  **DATE:** October 26, 2023
  **SUBJECT:** Evaluation of Proposed Center for the Study of Anomalous Cognition

  ### I. Recommendation

  I recommend that the Committee **vote to affiliate** with the proposed Center for the Study of Anomalous Cognition, but **only under the condition** that the "sunset clause" and the publication of null results are codified in a legally binding agreement between the University and the donor, immune to administrative override.

  This recommendation is not an endorsement of the hypothesis (that anomalous cognition exists), which I regard as physically implausible. Rather, it is an endorsement of the *methodology* proposed. To refuse this proposal on the grounds of the hypothesis' improbability would be to violate the very scientific principles our policy claims to protect. However, to affiliate without ironclad guarantees of termination upon failure would be to risk the University's integrity.

  ### II. The Popperian Paradox

  In preparing this opinion, I have engaged deeply with Karl Popper's demarcation criterion: that science is distinguished from pseudoscience not by verifiability, but by falsifiability. By this strict metric, the proposed Center is more "scientific" than many research programs we currently host.

  Much of contemporary social science—and indeed, some theoretical physics—relies on models that are flexible enough to accommodate almost any outcome. In contrast, this proposal offers a binary, high-stakes test: either a statistically significant deviation from chance is observed under adversarial conditions, or the field is deemed dead. The investigator has voluntarily surrendered the standard pseudoscientific defense mechanism: the claim that "skepticism suppresses the phenomenon."

  If we reject this proposal because we believe the hypothesis is false, we are not acting as stewards of science; we are acting as gatekeepers of dogma. We would be asserting that certain questions are settled not by evidence, but by consensus. This sets a dangerous precedent. If we refuse a testable, falsifiable claim because it contradicts current orthodoxy, we undermine our authority to critique fields that *do* affiliate with us but fail to test their own assumptions.

  ### III. The Strongest Argument for Refusal (The Losing Side)

  I must give full due to the colleagues who intend to vote against this proposal. Their argument rests not on Popper, but on Imre Lakatos and the Bayesian assessment of prior probability.

  **The Lakatosian Critique:** Lakatos argued that scientific "research programs" can be progressive or degenerating. A progressive program predicts novel facts; a degenerating program merely patches its theory to explain away anomalies. Parapsychology has existed for over a century. Despite thousands of experiments, it has produced no robust, reproducible phenomenon that has been integrated into the broader body of scientific knowledge (consilience). To fund a new center is to invest in a research program that has, historically, been degenerating.

  **The Bayesian Critique:** From a Bayesian perspective, the prior probability of anomalous cognition is vanishingly small because it contradicts well-established principles of physics (e.g., conservation of energy, signal attenuation over distance). To overturn such priors requires evidence of a magnitude this Center is not powered to provide. A "statistically significant" p-value in a five-year study is insufficient to overturn a century of null results and fundamental physical law. Therefore, the expected value of this research is near zero, and the opportunity cost—both financial and reputational—is high.

  **The Institutional Risk:** Finally, there is the argument from institutional integrity. By providing a university affiliation, we lend credibility to a field that the broader scientific community regards as pathological. If the Center closes in five years with null results, the donor may claim the University suppressed the data. If they find a spurious positive, we become the home of "psi," damaging our standing in the rigorous sciences.

  These arguments are weighty. They rely on the history of the field and the structural relationship of the claim to established science, rather than the specific design of this experiment.

  ### IV. Proposed Demarcation Criteria for Future Cases

  To avoid deciding this case *ad hoc*, I propose the Committee adopt the following four criteria for evaluating "controversial" research programs. This framework moves beyond simple falsifiability to address the structural concerns raised above.

  **1. Methodological Falsifiability (The Popperian Baseline)**
  Does the proposal specify conditions under which the central hypothesis would be abandoned? Vague commitments to "further study" upon failure are insufficient. There must be a predefined threshold for negative results that triggers termination or fundamental revision.
  *Application to Case:* The proposal passes this criterion with distinction due to the sunset clause.

  **2. Adversarial Robustness**
  Is the experimental design immune to the "file drawer" effect and experimenter bias? Standard peer review is often insufficient for high-controversy claims. The design must incorporate pre-registration, open data, and ideally, adversarial collaboration where skeptics have design veto power.
  *Application to Case:* The proposal passes this criterion (skeptics hold veto power).

  **3. Theoretical Consilience and Burden of Proof**
  Does the hypothesis contradict established laws in adjacent hard sciences? If so, the burden of proof scales with the magnitude of the contradiction. A claim violating conservation laws requires higher statistical certainty (e.g., 5-sigma vs. 2-sigma) and larger effect sizes than a claim merely extending current psychological models.
  *Application to Case:* The proposal fails this criterion (contradicts physics), which justifies our stringent conditions on the sunset clause. We are not betting on success; we are betting on a definitive conclusion.

  **4. The Exit Strategy (The Lakatosian Check)**
  Does the program have a mechanism to prevent degeneration? If the hypothesis is falsified, is there a commitment to publish the null result prominently? If the hypothesis is supported, is there a pathway to replication by independent bodies before the Center expands?
  *Application to Case:* The proposal passes, provided the publication clause is legally binding.

  ### V. Conclusion

  We are tempted to refuse this Center to protect the University from association with pseudoscience. However, pseudoscience is defined by its *resistance* to refutation, not by the *implausibility* of its claims. This proposal is unique because it invites refutation.

  If we reject it, we imply that the University only supports research that is likely to succeed. If we accept it without conditions, we imply that all hypotheses are equally plausible.

  By affiliating under strict conditions, we achieve a third path. We demonstrate that the University is confident enough in the scientific method to host a "terminal inquiry." We allow the data to speak, while ensuring that if the data remain silent, the question is finally laid to rest. This protects the University from charges of dogmatism while safeguarding us from being drawn into a perpetual, degenerating research program.

  I urge the Committee to vote for affiliation, contingent on the legal enforcement of the sunset and publication clauses. Let us not fear the test, provided the test is real.

  Respectfully,

  [Your Name]
  Emeritus Professor of Physics
  Committee on Centers and Institutes
