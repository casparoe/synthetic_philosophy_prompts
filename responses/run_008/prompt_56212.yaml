      *Let's order them logically.*
      1.  Origin (Empiricism check).
      2.  Universality (Aliens/Kant check).
      3.  Scope (Bio/Econ/Selection check).
      4.  Epistemic Status (Indispensability vs Platonism).

      *Wait, "Nobody Holds" branch.*
      *   Idea: "Math is effective because the Universe consciously computes." (Pancomputationalism). Some hold this (Tegmark, Wheeler), but maybe "Math is effective purely by random chance *without* selection bias" is the incoherent one. Wigner calls it a "miracle." If you say "It's a miracle and there is no selection and no structure," that's basically giving up.
      *   Better candidate: "Physics dictates Math" (Reverse Empiricism). Math changes to fit physics. (Actually, this is somewhat true in history, but as a philosophical stance, it's usually Empiricism).
      *   Let's flag the "Random Coincidence without Selection" branch. Wigner calls it a miracle, but without a selection mechanism, it's statistically untenable.

      *Indistinguishable Leaves:* Platonism and Indispensability often look the same in practice (both treat math as real). The difference is *why* we believe it. Platonist: It exists independently. Indispensability: We are committed to it because science works. I need to make sure the tree separates them based on *confirmation*.

  7.  **Drafting the Content:**
