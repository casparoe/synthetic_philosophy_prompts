      Make sure Selection Effect is clear. We have a graveyard of useless math (most of set theory? maybe not, but definitely most applied attempts).
      Make sure Empiricist is clear. 2+2=4 because we see 2 apples + 2 apples.

      *Refining the Bio/Econ Branch:*
