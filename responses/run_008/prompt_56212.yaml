      *   *Selection Effect (Anthropic/Statistical):* We try lots of math. Only the stuff that works survives in the textbooks. Wigner hints at this.
      *   *Empiricism (Mill/Quinean naturalism):* Math is a generalization from physical experience. It works because it *came* from physics originally.
      *   *Kantian/Constitutive:* Math is the framework our minds impose to make experience intelligible. It works because we construct physics *using* it.
      *   *Indispensability (Quine-Putnam):* We should believe in math entities because they are indispensable to our best scientific theories. (Note: This is slightly different from "why it works," more about ontological commitment, but often grouped here as a naturalist response).
      *   *Pythagoreanism (Nobody holds?):* The universe *is* math. (Need to check if this is distinct enough or just extreme Platonism).
      *   *Instrumentalism:* Math is just a tool. Truth doesn't matter. (Maybe too deflationary for this tree).

  3.  **Drafting the Branching Questions (The Nodes):**
      *   *Question 1: Origin/Independence.* Did math come from observing the world, or is it independent? (Splits Empiricism from the rest).
      *   *Question 2: Necessity.* Is the fit necessary (could it be otherwise?) or contingent? (Splits Kantian/Platonist from Selection).
      *   *Question 3: Universality.* Would aliens find the same math? (Splits Platonism from Kantian).
      *   *Question 4: Scope.* Does it work everywhere (biology/econ) or just fundamental physics? (Tests Selection vs. Deep Structure).
      *   *Question 5: Ontology.* Do we believe math entities exist? (Indispensability).

      *Refining for the User's Constraints:* The user wants specific questions they listed:
