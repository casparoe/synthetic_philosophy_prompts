      *   **Context:** Read Wigner's "The Unreasonable Effectiveness of Mathematics in the Natural Sciences." Resulted in a shouting match due to confusion over multiple explanations.
      *   **Goal:** A decision tree to distinguish between the different explanations for math's effectiveness.
      *   **Starting Point:** The shared observation (math developed without physics in mind fits physics perfectly later).
      *   **Branching Questions:** Must be answerable without knowing the destination (e.g., alien convergence, necessity of explanation, selection bias, origin of math, ineffectiveness in other fields).
      *   **Leaves (Outcomes):** Platonism, Selection Effect, Empiricism (Math = digested physics), Kantian/Constitutive, Indispensability (Quine-Putnam).
