answer: |-
  This is a compelling framing. Too often, the Hobbes–Wallis dispute is treated as a footnote in the history of mathematics (the great philosopher humbled by the professional mathematician) or a footnote in political history (Royalist vs. Parliamentarian). Treating it as a stress test for Hobbes's epistemology of geometry restores the philosophical stakes. If Hobbes's system is coherent, his conduct should follow from his first principles, even if his mathematics is wrong.

  Here is the analysis of the controversy through the lens of Hobbes's own epistemology, followed by a verdict on what the episode reveals about that theory.

  ### 1. Mapping the Epistemology to the Conduct

  To understand Hobbes's behavior, we must accept his definition of *scientia* (scientific knowledge). For Hobbes, knowledge is not correspondence with an external reality, but knowledge of consequences derived from causes. In geometry, the "cause" is the generation of the figure. We know the circle because we know the motion that produces it (a point moving at a fixed distance from a center).

  **What counted as evidence?**
  On Hobbes's view, evidence for a quadrature should not be numerical approximation (Wallis's arithmetic) nor algebraic consistency (symbolic manipulation). Evidence must be **causal visibility**. For Hobbes, a valid proof demonstrates the *motion* by which the square is generated from the circle.
  *   **For Hobbes:** The evidence was the intuitive clarity of the construction in *De Corpore*. If he could describe a motion that transformed the magnitude, he possessed the cause.
  *   **For Wallis:** The evidence was the inconsistency of the ratios. If the construction yielded a value for $\pi$ that contradicted established approximations (like Van Ceulen's), the construction was false.
  *   **The Clash:** Hobbes viewed Wallis's arithmetic as "reckoning" without "science." Wallis was checking the shadow (the number); Hobbes was holding the substance (the motion). To Hobbes, Wallis's refutation was category error: you cannot refute a causal generation with a numerical tally.

  **Predicted Conduct:**
  Hobbes's epistemology predicts exactly the confidence and intransigence he displayed.
  *   **Confidence:** If knowledge is construction, and I have constructed it, I cannot be wrong unless I misdescribed my own action. Hobbes believed he had successfully traced the motion. Therefore, to concede error would be to admit he did not know what he had done—a collapse of self-knowledge.
  *   **Resistance to Refutation:** The epistemology predicts hostility toward methods that bypass generation. Wallis's use of indivisibles and algebra treated magnitudes as numbers, divorcing quantity from body. For Hobbes, "number" is merely a count of bodies; it has no independent existence. Wallis was practicing what Hobbes would call "scholastic absurdity"—manipulating symbols without referents. Hobbes's resistance wasn't just stubbornness; it was a defense of the ontological priority of body over symbol.
  *   **Refusal to Concede:** This is the strongest prediction. In Hobbes's system, geometry is the model for civil philosophy (*Leviathan*). If the sovereign constructs the commonwealth, the sovereign's knowledge of it is absolute. If Hobbes admits he can construct a geometric falsehood, he undermines the analogy that supports his political absolutism. The quadrature was not just a math problem; it was the keystone of his claim that human reason can generate certainty. To yield on the circle was to yield on the Sovereign.

  **Where the Mapping Strains:**
  The strain appears in the **criterion for valid generation**. Hobbes's epistemology assumes that if a construction is clearly conceived, it is possible. It conflates *conceivability* with *constructibility*.
  *   **The Flaw:** Hobbes's theory licenses confidence in the *method* (construction), but it offers no internal mechanism to detect when a described motion is impossible. He assumes the mind's eye is infallible regarding simple motions.
  *   **The Break:** When Wallis pointed out that Hobbes's construction implied $3 = 4$ (in terms of ratios), Hobbes did not check the construction; he attacked the arithmetic. His epistemology explains *why* he did this (arithmetic is secondary to generation), but it does not *justify* it. The theory rationalizes the behavior, but it fails to protect the truth. It explains the stubbornness, but it cannot explain why the stubbornness was epistemically unproductive. The theory predicts he *should* have known the truth because he made it; the fact that he didn't suggests the "making" was illusory.

  ### 2. Verdict on the Theory

  I commit to the verdict that the episode **exposes a structural anomaly** in Hobbes's epistemology.

  It does not confirm the theory, because the theory posits geometry as the realm of infallible knowledge due to self-construction, yet the constructor was fallible. It is not merely that Hobbes was "never really about cases like this"; Hobbes explicitly claimed geometry was the paradigm of error-free reasoning.

  **The Anomaly:**
  The theory relies on the infallibility of "right reasoning" about generation. It assumes that because we stipulate the definitions, we cannot be wrong about the consequences. The Hobbes–Wallis episode reveals that **private generation does not guarantee public truth.** Hobbes's epistemology is fundamentally solipsistic regarding the act of construction: *I* know the motion *I* made. It lacks a mechanism for **intersubjective verification** when the "motion" is complex.

  Hobbes's theory is silent on how to resolve disputes between two constructors who claim to "see" different consequences from the same definitions. It assumes that if definitions are clear, all rational minds will see the same generation. Wallis proved that two rational minds could look at the same construction and disagree on its outcome. Hobbes's epistemology has no recourse for this except to accuse the other party of not understanding the definitions (which he did).

  Therefore, the episode shows that Hobbes's epistemology of geometry is **necessary but insufficient**. It explains the *source* of his certainty (the constructive method), but it fails as a *safeguard* against error. It treats the *act* of construction as a guarantee of truth, whereas the episode demonstrates that the act of construction is only as reliable as the logic governing the description of that construction. Hobbes confused the *ontology* of geometry (we make the figures) with the *logic* of geometry (the figures must be consistent). The episode reveals that you can "make" a figure in your mind that is logically impossible, and Hobbes's system had no brake for this.

  ### 3. Alternative Lenses

  Does a different lens do better?

  **The Sociological/Professional Lens:**
  A sociological analysis (mathematics as a community policing its standards) explains the *duration* and *vitriol* of the dispute better than Hobbes's epistemology. It explains why Wallis was so aggressive (defending the professional boundary of the Savilian Chair against an amateur) and why the Royal Society eventually sidelined Hobbes. It explains the *social* cost of Hobbes's error.
  *   *Limitation:* It treats the mathematics as a pretext for status competition. It cannot explain why Hobbes *felt* certain. A sociological lens makes Hobbes look like a crank protecting his reputation. Hobbes's epistemological lens makes him look like a philosopher protecting his system. The latter is more charitable and philosophically richer.

  **The Peer Disagreement Lens:**
  Viewing this as a case of peer disagreement between a near-competent amateur and a leading expert explains the *dynamic* (the expert appeals to consensus/approximation; the amateur appeals to first principles).
  *   *Limitation:* This lens assumes the expert is right and the amateur is wrong due to competence. It doesn't analyze *why* the amateur thinks he is right. It describes the failure but doesn't explain the internal logic of the failure.

  **Conclusion on Lenses:**
  For a case study in the **epistemology of mathematics**, Hobbes's own theory is the most illuminating frame, precisely because it fails.
  *   If you use the sociological lens, you learn about 17th-century Oxford politics.
  *   If you use Hobbes's lens, you learn about the limits of **constructivism**.

  The Hobbes–Wallis controversy is a tragic demonstration of the risks of radical constructivism. If truth is only what we construct, how do we check if our construction is coherent? Hobbes's epistemology explains his conduct perfectly: he acted exactly as a man who believes he holds the causal key to the universe should act. But because the conduct led to a falsehood, the episode indicts the epistemology. It shows that **generation without external constraint is not knowledge.**

  **Final Verdict:**
  Use Hobbes's theory. It is the only lens that takes Hobbes's claims seriously rather than dismissing them as vanity. But you must conclude that the episode **falsifies the sufficiency of his epistemology.** It demonstrates that "making" the object of knowledge is not enough to *know* the object, because the maker can be deceived about the nature of the making. The controversy is not just a quarrel about a circle; it is the empirical refutation of Hobbes's claim that geometry is immune to error because it is constructed by us. We can construct errors just as easily as truths, and Hobbes's system provided no way to tell the difference.
