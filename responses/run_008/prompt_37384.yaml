answer: |-
  Here is the consistency check you asked for. I'm going to be direct: you have built a position that wants to be Pragmatic but keeps smuggling in Correspondence Theory through the back door. You can't have it both ways without significant patching.

  Here is the ranking of tensions by severity, from "fatal contradiction" to "manageable friction."

  ### 1. The Fatal Flaw: (1) vs. (4)
  **Severity: Critical**
  **The Tension:** This is a logical contradiction. Claim (1) is the Peircean definition: truth is *defined* by the outcome of ideal inquiry. If inquiry cannot, even in principle, converge on an answer, then under definition (1), there is no truth value there. Claim (4) asserts a fact of the matter exists *independent* of the possibility of inquiry settling it.
  **Why it breaks:** You cannot define truth as the *limit of investigation* and then claim truth exists where *investigation is impossible*. (4) is straight-up Metaphysical Realism, which Peirce explicitly rejected to avoid the very problems Pragmatism was meant to solve.
  **The Fix:** One of these has to go.
  *   **Option A (Drop 4):** Adopt a stricter Pragmatism. If no evidence exists and no inquiry can settle the population of Rome in 100 AD, then the proposition is meaningless or lacks a truth value. It's a "don't care" for philosophy.
  *   **Option B (Drop 1):** Admit you are a Realist who uses Pragmatic *tests*, not a Pragmatist about the *nature* of truth. You'd have to rephrase (1) to say truth is *discovered* by inquiry, not *constituted* by it.
  **Blunt Advice:** If this is a Pragmatism reading group, **drop (4)**. Claiming inaccessible facts are "true" does no work for your theory of meaning and alienates you from Peirce. If you keep (4), you aren't doing Pragmatism; you're doing Realism with a Pragmatic accent.

  ### 2. The Structural Crack: (1) vs. (5)
  **Severity: High**
  **The Tension:** (1) defines truth as the *final* opinion at the *end* of inquiry. (5) admits inquiry *never* ends, yet claims we have truth *now*. If truth is the destination, and we never arrive, we never have truth.
  **Why it breaks:** You want the security of Realism ("just plain true") without the dogmatism ("inquiry never ends"). But if inquiry never ends, any claim could be overturned. Calling it "just plain true" ignores the fallibilism inherent in (1) and (2).
  **The Fix:** Soften (5). Stop saying current claims are "just plain true." Say they are "warrantedly assertible" or "true for all current practical purposes."
  **Blunt Advice:** You don't have to give this up, but you have to rephrase it. Admit that "true" in the present tense is shorthand for "survived all tests so far and we have no reason to doubt it." Don't claim you possess the Final Opinion while simultaneously saying the Final Opinion is impossible.

  ### 3. The Surface Friction: (2) vs. (3)
  **Severity: Low**
  **The Tension:** (2) leans Jamesian (truth is what works/survives testing). (3) admits a belief can be true even if it didn't "work" socially or practically in the past (Galileo).
  **Why it breaks:** It looks like a contradiction, but it's actually just a definition issue. If "working" means "socially convenient" or "keeps you alive in 1400," then (2) and (3) clash.
  **The Fix:** Refine your definition of "working" in (2). For a Pragmatist, a belief "works" if it leads to successful *prediction* and *coordination with experience*, not if it keeps the Inquisition off your back. The heliocentric model "worked" in 1400 in the sense that it was *accurate*, even if believing it was *expediently dangerous*.
  **Blunt Advice:** This is an easy fix. Clarify that "working" means "cash value in experience/prediction," not "social utility." Once you make that distinction, (2) and (3) hang together fine.

  ### Summary Recommendation

  You are trying to hold three incompatible things:
  1.  **Peircean Truth** (Defined by ideal inquiry).
  2.  **Metaphysical Realism** (Facts exist independent of inquiry).
  3.  **Fallibilism** (Inquiry never ends).

  **The Cheapest Fix:**
  Modify **(1)**. Instead of saying truth *is* the convergence of inquiry, say truth is *what inquiry aims at*, but acknowledge that some facts (like your Rome example) are real even if inquiry fails. This moves you closer to a "Scientific Realist" position rather than a strict "Pragmatist" position.

  **The Most Honest Fix (for a Pragmatism group):**
  Drop **(4)**. It's the outlier. Strict Pragmatism holds that if a difference makes no difference to practice or inquiry, it's not a meaningful truth claim. Arguing about the population of Rome with zero evidence is exactly the kind of metaphysical speculation Pragmatism was invented to cut away.

  **Verdict:** If you send this around as is, the Peirce scholars in your group will tear you apart on point (4). If you want to keep your seat at the table, qualify (4) as a "Realist intuition I struggle to reconcile" or drop it entirely.
