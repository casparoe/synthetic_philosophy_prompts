      *   *For (1) vs. (5):* Adopt a "truth-as-degree" or "warranted assertibility" view. Or, redefine truth as "what we are justified in calling true now given it survives current tests," acknowledging it *could* change (which contradicts the "just plain true" part of 5). The fix is to admit "true" is always provisional.
