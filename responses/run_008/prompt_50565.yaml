answer: |-
  # HANDOUT: So you want a voting rule that can't be gamed.

  **Context:** You accept the Gibbard–Satterthwaite (G-S) theorem. You know that for $\ge 3$ voters and $\ge 3$ alternatives, no ordinal, deterministic, onto, non-dictatorial rule is strategy-proof on an unrestricted domain. You wish to retain strategy-proofness (truthful revelation as a weakly dominant strategy). You must now choose which assumption to surrender.

  **Instructions:** Follow the branch questions. Answer based on your design constraints, not on the destination.

  ---

  ### **START:** The Designer's Dilemma
  *You require a rule where truthful revelation is weakly dominant.*

  **NODE 1: The Ordinal Framework**
  *Are you willing to elicit cardinal intensities of preference and enforce monetary transfers?*
  *   **YES** $\rightarrow$ Go to **NODE 2**.
  *   **NO** (Must remain ordinal/no money) $\rightarrow$ Go to **NODE 3**.

  **NODE 2: The VCG Escape**
  *Can you assume quasi-linear utilities and dispose of budget surpluses without affecting incentives?*
  *   **YES** $\rightarrow$ **LEAF: VCG Family**.
      *   *Awkward Commitment:* Strategy-proofness is bought with the inefficiency of burning money or the implausibility of quasi-linear preferences.
  *   **NO** $\rightarrow$ **UNOCCUPIED CELL 1**.
      *   *Diagnosis:* **Incoherent.** Cardinal mechanisms without transfers generally cannot sustain dominant-strategy truthfulness in this context; this mechanism does not exist.

  **NODE 3: Single-Valuedness (Determinism)**
  *Must the rule select a single alternative with certainty?*
  *   **NO** (Lotteries acceptable) $\rightarrow$ **LEAF: Random Dictatorship**.
      *   *Awkward Commitment:* Ex-ante fairness is purchased at the price of ex-post outcomes that may violate every voter's top choice.
      *   *[FLAG: INDISTINGUISHABLE PAIR]*: Formally, **Point Voting** schemes also occupy this branch. Without asking about the correlation of probabilities, the tree cannot separate Random Dictatorship from other probabilistic social decision schemes; both surrender determinism.
  *   **YES** (Deterministic) $\rightarrow$ Go to **NODE 4**.

  **NODE 4: Domain Richness**
  *Can you assume voters' preferences adhere to a known structure (e.g., single-peaked on a spectrum)?*
  *   **YES** $\rightarrow$ **LEAF: Peaks-Only Rules (Median Voter)**.
      *   *Awkward Commitment:* The rule is robust only so long as preferences do not deviate from the assumed topological structure.
  *   **NO** (Unrestricted Domain) $\rightarrow$ Go to **NODE 5**.
  *   **MIXED** (Claim Unrestricted but enforce Structure) $\rightarrow$ **UNOCCUPIED CELL 2**.
      *   *Diagnosis:* **Incoherent.** One cannot claim the domain is unrestricted while simultaneously relying on structural restrictions to guarantee strategy-proofness.

  **NODE 5: The Onto Condition**
  *Must every alternative in the set be capable of winning under some preference profile?*
  *   **NO** (Range Restricted) $\rightarrow$ Go to **NODE 6**.
  *   **YES** (Full Range) $\rightarrow$ Go to **NODE 7**.

  **NODE 6: Source of Restriction**
  *Who determines which alternatives are excluded from the winnable set?*
  *   **THE DESIGNER (Structural)** $\rightarrow$ **LEAF: Restricted Range**.
      *   *Awkward Commitment:* The 'impossible' alternatives are excluded by constitutional fiat, rendering the choice problem smaller than the voters' imagination.
  *   **THE AGENDA-SETTER (Strategic)** $\rightarrow$ **LEAF: Agenda-Setter's Paradise**.
      *   *Awkward Commitment:* Strategy-proofness is vacuous because the power lies not in the voting rule, but in the prior exclusion of competitors from the ballot.
      *   *[FLAG: INDISTINGUISHABLE PAIR]*: Formally, **Restricted Range** and **Agenda-Setter** are identical escapes from G-S (both violate *Onto*). The tree distinguishes them only by the *political identity* of the restrictor, not the mathematical property.
  *   **HYBRID** (Strategic Control + Claim Full Range) $\rightarrow$ **UNOCCUPIED CELL 3**.
      *   *Diagnosis:* **Unattractive/Deceptive.** Claiming the rule is onto while an agent strategically prunes the ballot is a contradiction in terms that dissolves upon formal inspection.

  **NODE 7: Strategy-Proofness Strength**
  *Is approximate truthfulness in large electorates sufficient?*
  *   **YES** (Tolerate Manipulation) $\rightarrow$ **LEAF: Asymptotic Strategy-Proofness**.
      *   *Awkward Commitment:* You admit the rule is manipulable in principle, betting only that the cost of coordination exceeds the gain from lying.
  *   **NO** (Strict SP Required) $\rightarrow$ Go to **NODE 8**.

  **NODE 8: Non-Dictatorship**
  *Is a fixed voter whose top preference always wins acceptable?*
  *   **YES** $\rightarrow$ **LEAF: Honest Dictatorship**.
      *   *Awkward Commitment:* Collective choice collapses entirely to individual whim, rendering the other voters mere noise.
  *   **NO** $\rightarrow$ **LEAF: THE G-S IMPOSSIBILITY**.
      *   *Awkward Commitment:* Nobody holds this position because it is the theorem itself; you have retained all assumptions and found no rule exists.

  ---

  ### **POSTSCRIPT: On the Status of the "Agenda-Setter's Paradise"**

  I have included the **Agenda-Setter's Paradise** as a distinct leaf to capture the political reality that ballot access is often the true locus of power. However, I must be honest about its logical status: **It dissolves into the "Restricted Range" branch.**

  In the formal language of the Gibbard–Satterthwaite theorem, there is no distinction between a alternative that is excluded by a constitutional clause (Restricted Range) and an alternative excluded by an agenda-setter's strategic calculation (Agenda Control). Both violate the *Onto* (surjectivity) assumption. The "rule" being voted on is strategy-proof only because the domain of choice has been truncated *ex-ante*. If you select this leaf, you are not finding a new voting rule; you are acknowledging that the voting rule is secondary to the power that defines the choice set. I retain it as a leaf only because, in practice, students often confuse "manipulating the vote" with "manipulating the ballot," and this distinction is politically vital even if mathematically redundant.

  ---

  ### **DIAGNOSTIC KEY: The Unoccupied Cells**

  1.  **UNOCCUPIED CELL 1 (Cardinal + No Transfers):** This combination is **incoherent**. Without transfers to align incentives, eliciting cardinal data does not bypass the ordinal impossibility; it typically invites more complex manipulation.
  2.  **UNOCCUPIED CELL 2 (Restricted Domain + Claim Unrestricted):** This is **incoherent**. You cannot rely on single-peakedness to prove strategy-proofness while simultaneously claiming your domain is unrestricted.
  3.  **UNOCCUPIED CELL 3 (Agenda Control + Claim Full Onto):** This is **unattractive/deceptive**. It claims the mathematical property of surjectivity while practically violating it; it is a semantic shield rather than a structural solution.
