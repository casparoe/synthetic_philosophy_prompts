  Dear Colleagues, to help us locate our respective commitments regarding whether the sciences carve nature at its joints, I have drafted this narrative decision tree that relies on your intuitions about specific cases rather than abstract labels, guiding you from the trunk out to the branches where your philosophical position awaits. We begin at the trunk with the case of jade, where artisans and markets treated the stuff as a single kind for millennia before chemistry revealed it to be two distinct minerals, nephrite and jadeite, forcing us to decide whether historical utility or microstructural unity determines kindhood. If you believe that the pre-chemical classification failed to refer to a real kind because it lacked microstructural unity, you follow the branch toward the elements and must consider lithium, whose isotopes differ enough in pharmacological and nuclear behavior to make one wonder whether sameness of atomic number suffices for sameness of kind. If you hold that lithium isotopes constitute a single kind because atomic number is essential despite behavioral differences, you arrive at the leaf labeled microstructural essentialism. However, if you hold that jade was not a kind yet lithium isotopes are distinct kinds, you arrive at a leaf marked unoccupied, diagnosed as incoherent because it inconsistently demands microstructural unity for compounds while ignoring it for elements, a combination nobody holds because it is theoretically unstable.

  Returning to the jade fork, if you believe that jade counts as a kind despite its microstructural heterogeneity, you proceed to the question of whether a biological species is a kind at all, given the lineage view on which it is more like an individual organism extended in time rather than a class of similar entities. If you agree that species are individuals rather than kinds, you land on the leaf labeled promiscuous or pluralist realism, acknowledging that kindhood depends on our interests rather than mind-independent boundaries. If you maintain that species are indeed kinds, you must face a deliberately gerrymandered but perfectly regular grouping of my own invention, such as the class of all things that are either made of gold or currently located in my pocket, to test what you do when projectibility and naturalness come apart. If you judge this gerrymandered grouping to be a genuine kind simply because it supports counterfactuals and regularities, you reach the leaf labeled conventionalist or deflationary views. If you judge it not to be a kind despite its regularity because it lacks causal grounding or homeostatic mechanisms, you reach the leaf labeled homeostatic property cluster realism. I must flag here that the cases may not genuinely separate the leaves for homeostatic property cluster realism and conventionalist or deflationary views, as both positions might agree on the projectibility of the gerrymandered case while disagreeing only on the metaphysical significance of the term kind, rendering the distinction somewhat terminological rather than substantive. I hope this map helps us navigate our discussion without getting lost in labels, allowing us to see where our intuitions about jade, lithium, species, and gerrymandered groups converge or diverge.
