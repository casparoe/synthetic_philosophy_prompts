      *   **Epistemic Barriers (The Measurement Problem):**
          *   We can't count the individuals (especially invertebrates/microfauna).
          *   We can't measure their valence (pain vs. pleasure) objectively.
          *   We can't know the counterfactuals (what would have happened if the habitat remained?).
      *   **Philosophical/Conceptual Barriers:**
          *   *The Non-Identity Problem:* Destroying habitat doesn't help existing animals (mostly); it prevents future ones. Is preventing a miserable life a "gain" in welfare? (Yes, on negative utilitarianism, but it's not a "stock" variable like biomass).
          *   *Boundary Issues:* Where does the ecosystem end? Migration, food webs extending beyond the "patch."
          *   *Timescale:* Do we count until the heat death of the universe? 100 years?
      *   **Addressing the WAS Premise (Briefly but Fairly):**
