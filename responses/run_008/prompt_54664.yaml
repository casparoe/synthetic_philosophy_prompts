  You have identified a genuine and widely discussed tension in the philosophy of history and environmental humanities, though the specific rhetorical *move* you describe—the simultaneous reliance on and disavowal of nonhuman agency—doesn't have a single, universally standardized label. However, you are correct that you are standing on the doorstep of **Actor-Network Theory (ANT)** and the concept of the **Actant**.

  Here is the carving you asked for, distinguishing the entity, the ontology, and the rhetorical slippage.

  ### 1. The Entity: The Actant
  The term you half-remembered is indeed **Actant**. Originating in semiotics (Greimas) and adopted by sociology of science (Bruno Latour, Michel Callon), an actant is anything that *does* something, that modifies a state of affairs. In ANT, a volcano, a microbe, a levee, and a king are all potentially actants. They are not "characters" in the literary sense (with psychology), but they are "actors" in the causal sense (they make a difference).

  *   **Why it fits:** It solves your "mechanism vs. character" binary. An actant isn't a mechanism (passive, predictable) nor a human subject (intentional, psychological). It is a source of action that resists simple reduction.
  *   **The Mismatch:** In ANT, the analyst *owns* this ontology. They explicitly state, "We are tracing the network of human and nonhuman actants." The popular historians you are reading are doing the *work* of ANT (granting the volcano causal weight) while maintaining the *language* of Modernism (which insists only humans have agency).

  ### 2. The Critical Term: Reification (with caveats)
  The standard critical accusation for this move is **Reification** (or sometimes **Hypostatization**). This charges the author with treating a complex process (geological climate forcing) as a concrete, singular thing ("The Climate" that "decides").
  *   **Why it's insufficient:** Reification implies the author is making a mistake—that the volcano *isn't* actually doing anything. As you noted, the eruption *was* a huge exogenous input. Reification dismisses the causal reality you know to be true. It critiques the grammar, not the physics.

  ### 3. The Rhetorical Move: Covert Actancy
  Since there is no single established term that captures the *specific combination* of (A) granting causal agency, (B) using narrative grammar, and (C) disavowing the ontological commitment, the most precise label is a coinage derived from the ANT framework: **Covert Actancy** (or **Unreflexive Actancy**).

  This describes the state where a nonhuman entity is granted the functional role of an actant within the explanation (it pushes, reshapes, enters) while the author retreats to "metaphor" when challenged. It is "covert" because the agency is operationally real in the text but ontologically denied in the preface.

  ### The Carving: Edges and Boundaries
  You asked where the edges lie—when does a thing count as an actor on this roadmap?

  *   **Event vs. Baseline:** In this framework, an **Actant** is usually defined by *interruption*. A slowly shifting climate baseline is often treated as a "context" or "stage" (even by these writers) because it lacks a discrete "entrance." A volcanic eruption, a flood, or a plague has a timestamp; it can be narrated as an event. Therefore, **Covert Actancy** applies most strongly to *punctuated exogenous shocks* (Tambora) rather than *gradual forcings* (Milankovitch cycles), simply because the former fits the narrative grammar of "character entrance."
  *   **Flood vs. Levee:** Does the levee count? In strict ANT, yes. A levee that holds acts just as much as a flood that breaks. However, in the genre you are describing, the levee is rarely granted **Covert Actancy**. Why? Because the levee is a *hybrid* (human design + material). The flood is "pure nature." These writers often reserve the agential verbs for "Nature" to maintain the drama of Man vs. Nature, even while relying on the levee's failure to explain the outcome. If the author wrote "The levee refused to hold," that would be Covert Actancy. If they write "The levee failed," it remains a mechanism.
  *   **Determinism vs. Actancy:** This is the crucial distinction you requested.
      *   **Environmental Determinism:** Claims the outcome was *fixed* by the environment. (The volcano *made* the revolution happen).
      *   **Covert Actancy:** Claims the environment *acted* upon the humans, who then reacted. (The volcano *pushed* the people, who *decided* to revolt).
      *   Determinism removes human choice. Covert Actancy preserves human choice but makes the nonhuman the *protagonist* of the situation. The volcano drives the plot; the humans drive the dialogue.

  ### Why the "Shorthand" Defense Fails
  The authors claim it is "just shorthand" (a metaphor). But in historiography, grammar dictates causality. If the verb is active ("The climate pushed Europe"), the subject is the cause. If they retreat to "it's just rhetoric," they are attempting to have the explanatory power of a cause without the philosophical burden of an agent. They want the volcano to be a *deus ex machina* without the *deus*.

  ### Verdict
  The established term for the *entity* is **Actant**, but the established term for the *rhetorical move* of using it without ontological commitment does not exist in a single word. The most precise term to describe the phenomenon you observed—treating a nonhuman cause as a narrative agent while denying it possesses agency—is:

  Verdict: Covert Actancy
