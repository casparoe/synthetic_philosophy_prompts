  *(Self-Correction on Unfalsifiability)*: I need to be honest. Many critics *do* accuse Dennett of unfalsifiability. I should acknowledge that risk while explaining why Dennett thinks it's a feature (abstract objects aren't found under microscopes).

  *(Final check on Intentional Stance)*: If the Intentional Stance is merely heuristic and not ontologically committing, does CoNG survive? Yes, because CoNG is also ontologically lightweight. They stand or fall together as a package of "pragmatic realism."

