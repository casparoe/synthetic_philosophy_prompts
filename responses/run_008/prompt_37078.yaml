  ### Closing Note: Where This Procedure Will Misfire

  You asked for a warning on how this tool can be abused. The weak point is **Step 1: Classification.**

  A future committee could justify *anything* as an "Enduring Asset" to hoard money. They could claim a $5,000 statue is "infrastructure" that benefits students for 50 years, using the "Future Student" argument to deny current students a single pizza party. This is the "Tyranny of the Unborn."

  To prevent this, your Faculty Advisor must enforce a definition of **Critical.** "Critical" means safety or academic function (like a sound system for assemblies), not aesthetics or prestige. If the procedure is used to block all current joy in the name of a vague "investment," the 75% weight I assigned to future students is too high.

  However, for your current conflict, this procedure forces the truth: You cannot have the Carnival *and* the Sound System on this budget. The Protocol makes you write down that choice, rather than pretending the math didn't matter.
