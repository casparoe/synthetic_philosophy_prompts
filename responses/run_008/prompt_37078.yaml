answer: |-
  ### The Stewardship Protocol

  You are right to reject "pure time preference." Caring less about a student in 2031 simply because they are in 2031 is ethically inconsistent, just as your economics class suggested. However, you are also a democratic representative of the students currently in the building. To balance the Parfitian ideal with your fiduciary reality, I have made a definite choice for your committee: **Future students count at 75% weight compared to present students.**

  This 25% discount is not for *time*; it is for *uncertainty* (the risk the money vanishes) and *mandate* (you were elected by the living, not the unborn). However, **Enduring Assets** (infrastructure used for years) automatically outweigh **Transient Consumption** (events lasting hours) unless the consumption is safety-critical. Fun is not safety-critical.

  Here is the procedure. It is designed to take ten minutes, force a written record, and prevent the committee from hiding behind "feelings."

  ***

  ### The 10-Minute Valuation Protocol

  **Prerequisites:** At the start of the academic year, the committee must vote to designate any "Critical Capital Projects" (e.g., the Sound System). Once designated, these projects have priority status for the remainder of the term.

  **Step 1: Classification (1 Minute)**
  *   **Question:** Is this proposal *Transient Consumption* (one-time event, goods used immediately) or *Enduring Asset* (equipment, fund, infrastructure used >2 years)?
  *   **Sufficient Answer:** "Consumption" or "Asset."
  *   **Stop Condition:** If the proposal is mislabeled to game the system (e.g., calling a pizza party "community building infrastructure"), the Faculty Advisor must be alerted immediately.

  **Step 2: The Risk Adjustment (2 Minutes)**
  *   **Question:** What is the specific risk that the benefit never materializes? (e.g., "Fund gets raided," "Event gets rained out," "School closes auditorium").
  *   **Sufficient Answer:** A percentage estimate (0% to 100%) agreed upon by the committee.
  *   **Stop Condition:** If the risk of non-arrival is >40%, the proposal is **Rejected**. (We do not spend student money on coin flips).

  **Step 3: The Priority Conflict (3 Minutes)**
  *   **Question:** Does spending this money reduce the likelihood of completing a designated *Critical Capital Project* on schedule?
  *   **Sufficient Answer:** "Yes," "No," or "Uncertain."
  *   **Stop Condition:** If the answer is **"Yes"** or **"Uncertain,"** the proposal is **Rejected.**
      *   *Rationale:* Enduring Assets trump Transient Consumption when funds are constrained. Uncertainty counts against the spender.

  **Step 4: The Verdict & Rationale (4 Minutes)**
  *   **Action:** If the proposal passes Steps 1–3, take a majority vote.
  *   **Output:** Fill out the **Rationale Card** (below). No proposal over $500 is submitted to the Faculty Advisor without this card.

  ***

  ### The Rationale Card (Template)

  > **Proposal:** [Name]
  > **Classification:** [Transient Consumption / Enduring Asset]
  > **Risk of Failure:** [%]
  > **Impact on Critical Capital:** [None / Delays / Prevents]
  > **Committee Decision:** [Approved / Rejected]
  > **Reason Code:** [e.g., "Asset Priority," "High Risk," "Majority Vote"]
  > **Statement of Trade-off:** *We understand that approving this means [X] will not happen for future students, OR we understand that rejecting this denies [Y] to current students.*

  ***

  ### Test Run: Applying the Protocol

  Here is how the protocol handles your three proposals, assuming the **Auditorium Sound System** has been designated as a *Critical Capital Project* at the start of the year, and the budget is tight enough that discretionary spending affects its timeline.

  #### 1. The Spring Carnival ($900)
  *   **Step 1 (Classification):** Transient Consumption. (It lasts one day).
  *   **Step 2 (Risk):** 10%. (Events usually happen).
  *   **Step 3 (Priority Conflict):** **Uncertain.**
      *   *Analysis:* You have $7,000. You need to save for the sound system. While $900 fits on paper, the protocol treats "Uncertain" as a failure condition to protect the Capital Project. Does this $900 delay the sound system by six months? Maybe. Can you prove it won't? No.
  *   **Verdict:** **REJECTED.**
  *   **Rationale Card:** *We understand that approving this denies a faster sound system replacement to future students. We prioritized the Enduring Asset over Transient Consumption due to budget uncertainty.*
  *   **Note:** I know you wanted this. The procedure rejected it because it could not prove it wouldn't harm the long-term plan. This protects you from the "Spend It All Now" faction.

  #### 2. The Equipment Fund ($650/year)
  *   **Step 1 (Classification):** Enduring Asset. (It builds capital for a 7-year tool).
