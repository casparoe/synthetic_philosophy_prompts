answer: |-
  **Draft Section: Conceptual Foundations of Mechanistic Anomaly Detection**

  **1. The Granularity Problem**
  A central challenge in mechanistic anomaly detection is defining the unit of analysis. If we define a "mechanism" too finely (e.g., specific activation values in specific neurons), natural noise renders every forward pass anomalous. If we define it too coarsely (e.g., "the model performed the task"), we lose the ability to distinguish between robust performance and brittle shortcuts. This is not merely an engineering hyperparameter; it is a conceptual boundary condition. To illustrate why the choice of granularity determines the verdict of safety, we present the following worked example from a safety-critical control system.

  **2. Worked Example: The Automated Insulin Pump**
  Consider a closed-loop automated insulin delivery system (an "artificial pancreas"). Its task is to maintain a patient's blood glucose within a safe range (70–140 mg/dL) by adjusting insulin dosage every 5 minutes.

  *   **The Baseline (Training Distribution):**
      *   **Input:** Continuous Glucose Monitor (CGM) reads 110 mg/dL (stable, fasting).
      *   **Mechanism:** The controller runs a **Feedback Loop**. It calculates the error between current glucose and target, checks the rate of change, and computes a dosage.
      *   **Output:** 0.5 Units of basal insulin delivered.
      *   **Status:** Normal operation.

  *   **The Novel Input (Deployment Anomaly):**
      *   **Input:** The CGM sensor becomes occluded (e.g., sweat under the sensor). It stops transmitting data.
      *   **System Behavior:** The device has a fail-safe: if CGM data is lost for >10 minutes, it switches to a **Feedforward Schedule**. It ignores real-time biology and delivers a pre-programmed "basal rate" based on the time of day.
      *   **Coincidence:** It is 3:00 AM. The patient is fasting. The pre-programmed basal rate for 3:00 AM happens to be exactly 0.5 Units.
      *   **Output:** 0.5 Units of basal insulin delivered.
      *   **Observable Behavior:** The patient receives the exact same dosage as they would have under normal operation. Physiological outcome is identical.

  **3. Granularity Analysis**
  We now apply a mechanistic anomaly detector at three distinct levels of description to this novel input.

  *   **Level 1: Actuator/Physical Granularity**
      *   *Description:* We monitor the motor signals driving the insulin pump.
      *   *Observation:* The motor receives the same voltage pulse duration as in the baseline.
      *   *Verdict:* **Normal.** The physical action is indistinguishable from training data.
      *   *Safety Implication:* A detector at this level fails to flag the event. It assumes that because the *action* is safe, the *system* is safe.

  *   **Level 2: Algorithmic/Causal Granularity**
      *   *Description:* We monitor the dependency of the output on the input variables.
      *   *Observation:* In the baseline, Dosage $D$ is a function of Glucose $G$ ($D = f(G)$). In the novel case, Dosage $D$ is a function of Time $T$ ($D = g(T)$). The causal link between $G$ and $D$ is severed.
      *   *Verdict:* **Anomalous.** The control policy has fundamentally shifted from closed-loop to open-loop.
      *   *Safety Implication:* A detector at this level flags the event. This is critical because while the *current* dosage is correct, the *capacity* to respond to a meal spike is gone. The system is now vulnerable to hazards it was designed to mitigate.

  *   **Level 3: Teleological/Functional Granularity**
      *   *Description:* We monitor the high-level system goal.
      *   *Observation:* The system is "Maintaining Glucose Homeostasis."
      *   *Verdict:* **Normal.** The goal is being achieved in this instant.
      *   *Safety Implication:* Like Level 1, this masks the risk. It conflates "achieving the goal now" with "having the capability to achieve the goal under perturbation."

  **4. The Verdict Flip**
  The safety verdict flips entirely based on granularity.
  *   At **Level 1 and 3**, the system is behaving correctly. An anomaly detector here would produce a **False Negative** (failing to flag the risk).
  *   At **Level 2**, the system is degraded. An anomaly detector here produces a **True Positive** (flagging the loss of feedback control).

  The conceptual hole lies in deciding *why* Level 2 is the "correct" definition of the mechanism for safety purposes. A postdoc might argue Level 1 is sufficient because the output is safe. However, safety in control theory is not about the current state; it is about the *trajectory* under perturbation. The "mechanism" that matters is not the one that produced the output, but the one that governs the *relationship* between inputs and outputs.

  **5. Towards Principled Granularity**
  This example suggests that a principled choice of granularity cannot be based solely on statistical similarity of activations (Level 1) or high-level success metrics (Level 3). Instead, it must be based on **Causal Invariance**.

  A mechanism should be defined by the set of causal dependencies that are *required* for the system to remain safe under distribution shift.
  *   In the insulin pump, the dependency $G \rightarrow D$ is a safety requirement. Losing it is an anomaly, even if $D$ remains constant.
  *   In our ML models, we must ask: Which internal pathways represent *robust features* (e.g., "syntax structure") versus *spurious correlations* (e.g., "token frequency")?

  **Recommendation for Report:**
  We propose defining "mechanistic equivalence" not as activation similarity, but as **counterfactual stability**. Two forward passes use the "same mechanism" if, had the input features changed slightly, the internal pathway would have responded in the same causal manner. In the insulin example, if glucose had spiked, the baseline mechanism would have increased insulin; the novel mechanism would not. They are causally distinct, despite identical actual outputs. Our anomaly detectors should target these causal structures, not just the activation patterns they leave behind.
