answer: |-
  The administrative architecture of contemporary welfare states presents a striking philosophical discontinuity in how it categorizes human misfortune, one that suggests the implicit theory of moral responsibility underpinning benefit conditionality is neither a consistent application of luck egalitarianism nor a purely instrumental behaviorist mechanism, but rather a hybrid normative framework best described as asymmetric contractualism. On the surface, the distinction between the unemployed claimant, who is treated as a responsible agent subject to sanctions, and the disabled or elderly recipient, who is treated as a patient of fate protected from conditionality, appears to map onto a luck egalitarian view where the state compensates for brute luck but holds individuals accountable for option luck. Under this reading, disability and old age are classified as unchosen misfortunes warranting unconditional support, whereas unemployment is implicitly categorized as a sphere of human agency where effort can alter outcomes. However, this interpretation collapses under the weight of the system's insensitivity to local labor market conditions. If the state genuinely believed that unemployment outcomes were primarily determined by individual effort rather than structural luck, the sanction regime would necessarily be calibrated to the probability of finding work; a claimant in a region with twenty percent unemployment faces a radically different causal landscape than one in a region with two percent unemployment. The fact that the administrative apparatus applies identical obligations and penalties across these divergent contexts indicates that the system is not actually tracking the causal contribution of the claimant's choices to their situation. Consequently, the practice does not strictly require a belief that the unemployed are empirically more responsible for their plight than the disabled; rather, it requires only the normative assertion that able-bodied adults possess a duty of reciprocity toward the cooperative scheme that supersedes empirical variations in their capacity to fulfill it.

  This suggests that the implicit theory is more accurately rooted in a form of liberal contractualism than in luck egalitarianism. The practice strictly requires the theorist to believe that citizenship entails a specific obligation to offer labor power where physically possible, and that welfare transfers constitute a reciprocal exchange for this willingness rather than a right derived from need alone. This view sits comfortably with behaviorist explanations, as the sanction regime functions effectively as an incentive device regardless of whether the claimant is truly at fault, but it quietly rules out structuralist or sociological accounts of unemployment that view joblessness as a systemic failure rather than an individual deficit. By maintaining a flat sanction regime irrespective of market tightness, the state effectively legislates that the moral obligation to seek work remains constant even when the structural capacity to satisfy that obligation fluctuates. This transforms conditionality from a tool of accurate desert attribution into a mechanism of status maintenance, ensuring that the recipient remains categorized as a moral agent answerable to the state. The distinction between the unemployed and the disabled is therefore not merely about the presence of misfortune, since both may suffer from the misfortune of poverty, but about the capacity for reciprocity. The disabled person is excused from the cooperative demand because they cannot meet it; the unemployed person is sanctioned not necessarily because they are causally responsible for their unemployment, but because they are refusing the duty to attempt to re-enter the cooperative sphere.

  This normative framework helps illuminate the second layer of the puzzle regarding the asymmetry in fraud enforcement. The enormous administrative effort devoted to detecting benefit fraud by the poor, contrasted with the casual treatment of tax fraud by the wealthy, is expressive of the same underlying commitment to the contingent nature of welfare rights. If welfare is conceptualized as a reciprocal exchange contingent upon behavioral compliance, then benefit fraud represents a fundamental breach of the social contract, a taking of resources without the agreed-upon offering of labor or search effort. In contrast, tax fraud is often treated within a legalistic framework of debt and evasion rather than a moral breach of reciprocity, in part because it presupposes a distinction between the state's money given and the state's money not taken. Welfare payments are viewed as public property temporarily entrusted to the claimant, requiring rigorous proof of continued entitlement, whereas pre-tax income is culturally and legally constructed as private property that the state is attempting to claim. The asymmetry thus presupposes that the poor are stewards of public funds who must prove their worthiness continuously, while the wealthy are owners of private funds who negotiate their contributions. This is compatible with a libertarian view of property rights but contradicts the luck egalitarian impulse to treat all windfalls and losses with equal moral scrutiny. The practice rules out the view that tax evasion and benefit fraud are morally equivalent forms of free-riding on the state; instead, it encodes the belief that taking from the state is a graver moral failure than withholding from it, reinforcing the status of the benefit claimant as a subordinate party in the fiscal relationship.

  If the state were to reconstruct these systems based on the rival view that unemployment in a depressed market is no more choice-dependent than illness, the administrative architecture would undergo a radical transformation resembling an automatic stabilizer rather than a disciplinary regime. A system built on the premise that structural unemployment is brute luck would decouple income support from job-search obligations in regions where labor demand is insufficient, treating the lack of work as a systemic risk to be insured against rather than a behavioral failure to be corrected. Sanctions would be abolished or strictly limited to cases of verifiable refusal of suitable work where such work objectively exists, shifting the burden of proof from the claimant to the administration to demonstrate labor market capacity. Similarly, the fraud enforcement asymmetry would dissolve under a theory that views all fiscal interactions as part of a unified cooperative scheme. If tax evasion and benefit fraud are both understood as undermining the same pool of social resources, enforcement resources would be allocated proportionally to the fiscal impact of the fraud rather than the class status of the perpetrator. This would imply a level of scrutiny on tax avoidance commensurate with that applied to benefit claims, acknowledging that the state's money not taken is fiscally identical to the state's money given. Ultimately, the current practice does not require a coherent theory of desert that withstands empirical scrutiny; it requires only a political theory that maintains the distinction between the deserving and undeserving poor. The system is philosophically underdetermined in that it can be justified by multiple conflicting theories—contractualism, behaviorism, or a distorted luck egalitarianism—but it is politically overdetermined in its function to preserve the norm that income for the able-bodied must be morally earned through visible submission to state authority, whereas income for the asset-holding or the incapacitated is either a right of property or a charity of necessity.
