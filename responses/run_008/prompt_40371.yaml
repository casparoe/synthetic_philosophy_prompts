prompt: |-
  I lead a data science team, and our company just rolled out a new incentive scheme where the support org's bonus is tied to average ticket resolution time — and my team built the dashboard that measures it. So next week I have to run a 45-minute session for the support team leads on why this metric is going to get gamed, not to trash the scheme but so we can spot the failure modes before they show up in the numbers. Plan the session for me: what has to be established first before any gaming examples will even land, what one carrying example I should build the whole thing around (ideally from outside the company so nobody gets defensive), and the misconceptions I should expect — my guess is they'll assume gaming means deliberate cheating by bad apples, rather than the metric quietly drifting from the thing it was supposed to point at as ordinary people just respond to incentives. Say where in the sequence I should head off each one. Related: I've seen people break Goodhart's law into a few distinct failure modes (regressional vs causal vs adversarial, something like that) — should that taxonomy come in at all, or is it something I should openly refuse to explain at this level? And give me one question I can ask at the end to tell whether they actually got the idea or just nodded along.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Role:** Data Science Team Lead.
      *   **Audience:** Support Team Leads (operational managers, likely stressed about the new bonus scheme).
      *   **Topic:** Why the new metric (Avg. Ticket Resolution Time) will get "gamed" (Goodhart's Law).
      *   **Goal:** Not to trash the scheme, but to spot failure modes early (protect data integrity & business value).
      *   **Constraints:** 45-minute session.
      *   **Key Requirements:**
          *   Establish prerequisites before showing examples.
          *   One carrying example (external, non-defensive).
          *   Address misconceptions (gaming $\neq$ cheating).
          *   Decide on Goodhart's Law taxonomy (regressional/causal/adversarial).
          *   One validation question at the end.

  2.  **Determine the Core Message & Tone:**
      *   *Tone:* Collaborative, protective, analytical, not accusatory. "We built the dashboard, we want it to remain useful for *you*."
      *   *Core Message:* Metrics change behavior. When behavior changes to optimize the metric rather than the goal, the metric breaks. This is normal human psychology, not moral failure.

  3.  **Structure the 45-Minute Session:**
      *   *0-5 min:* Intro & Framing (Psychological Safety).
      *   *5-15 min:* The Carrying Example (External).
      *   *15-30 min:* Applying to Support (Failure Modes).
      *   *30-40 min:* Mitigation & Monitoring (Actionable takeaways).
      *   *40-45 min:* Q&A + Validation Question.

  4.  **Drafting Content - Section by Section:**

      *   **Prerequisites (What must be established first?):**
          *   Need to establish *psychological safety*. If they think I'm accusing them of cheating, they will shut down.
          *   Need to establish *shared goal*. We want the dashboard to help them, not punish them.
          *   Need to define *the metric vs. the goal*. Resolution time $\neq$ Customer Satisfaction.
          *   *Timing:* First 5-10 minutes.

      *   **The Carrying Example:**
          *   Needs to be external.
          *   Needs to be relatable.
          *   *Idea 1:* Cobra Effect (classic, but maybe too historical/distant).
          *   *Idea 2:* Soviet Nail Factory (quantity vs. weight, classic but dry).
          *   *Idea 3:* Call Centers (too close to home).
          *   *Idea 4:* **The Hospital Wait Time Target.** This is perfect. It's high stakes, relatable (everyone goes to hospitals), and has well-documented gaming (ambulance parking, reclassifying patients).
          *   *Alternative:* **The Teacher Evaluation/Test Score example.** Very relatable, shows "teaching to the test."
          *   *Selection:* **The Hospital Wait Time (4-hour target in UK/Australia).** It mirrors "resolution time" closely (time-based SLA).
          *   *Why:* It shows systemic pressure, not just "bad doctors."

      *   **Misconceptions (Gaming $\neq$ Cheating):**
          *   *Misconception:* "Gaming is malicious fraud."
          *   *Reality:* "Gaming is rational optimization of the stated rule."
          *   *Timing:* Introduce this *during* the carrying example analysis. When explaining *why* the hospital managers moved patients, emphasize it was to save the department, not to steal money.

      *   **Goodhart's Law Taxonomy:**
          *   *Question:* Should I teach Regressional vs. Causal vs. Adversarial?
          *   *Answer:* **No.** It's too academic. It creates jargon barriers. Support leads care about operations, not econometrics.
          *   *Strategy:* Use the *concepts* without the *labels*. Describe the *behaviors* (e.g., "focusing on easy tickets," "reopening tickets," "pausing timers") instead of "Adversarial Goodhart."
          *   *Timing:* Weave into the "Applying to Support" section implicitly.

      *   **Validation Question:**
          *   Needs to test understanding of the *mechanism*, not just recall.
          *   *Bad:* "What is Goodhart's Law?"
          *   *Good:* "If we add a second metric, what happens?" (Too complex).
          *   *Better:* "Imagine you're a new hire. What's the fastest way to make your number look green without actually helping a customer?"
          *   *Best:* **"If you had to bet on which part of our process breaks first under this pressure, what would it be and why?"** (Forces them to apply the logic to their specific context).

  5.  **Refining the Plan (Self-Correction/Review):**
      *   *Critique:* Is 45 minutes enough? Yes, if strict.
      *   *Critique:* Is the Hospital example too negative?
      *   *Adjustment:* Frame it as "This happened elsewhere so we can prevent it here."
      *   *Critique:* How do I ensure they don't feel attacked?
      *   *Adjustment:* Explicitly state: "My team owns the dashboard. If the data goes bad, *we* fail, not just you. We are partners in keeping this signal clean."

  6.  **Finalizing the Output Structure:**
      *   Session Objective.
      *   Pre-work/Mindset.
      *   Agenda (Time-boxed).
      *   Detailed Content (The "What" and "When").
      *   The Goodhart Taxonomy Decision.
      *   The Validation Question.

  7.  **Drafting the Content (incorporating the "Why"):**
      *   *Establish First:* Trust & Shared Fate. (If the metric lies, you can't argue for resources).
      *   *Carrying Example:* UK Hospital 4-Hour Target. (Ambulances waiting outside, patients reclassified).
      *   *Misconception:* Address during the example debrief. "Was this evil doctors? No, it was stressed managers."
      *   *Taxonomy:* Skip the jargon. Use "Easy Wins," "Loopholes," and "Collateral Damage."
      *   *Validation:* The "Bet" question.

  8.  **Final Polish:** Check tone. Ensure it sounds like a peer leading a workshop, not a lecturer scolding students. (The prompt asks for a plan *for* the user, so I will write it as a directive guide).

  *(Self-Correction during drafting)*: Wait, the prompt asks "what has to be established first before any gaming examples will even land." I need to make sure that's distinct. It's about the *purpose of the dashboard*. If they think the dashboard is a weapon, they will hide. If they think it's a thermometer, they will trust it.

  *(Refining the Taxonomy advice)*: Be firm. Do not use the academic terms. It signals "ivory tower" to ops people.

  *(Refining the Validation Question)*: Make it specific. "What's the first thing you'd tell your team to stop doing if you saw the average time drop by 50% overnight?"

