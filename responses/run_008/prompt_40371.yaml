answer: |-
  Here is a 45-minute session plan designed to protect your data integrity while maintaining alliance with the Support Leads.

  ### Session Objective
  To align on the difference between **measuring performance** and **managing behavior**, ensuring the dashboard remains a trusted tool for resource allocation rather than becoming a target that distorts reality.

  ---

  ### Part 1: The Foundation (Minutes 0–10)
  **Goal:** Establish psychological safety and shared fate before showing a single example.

  **What must be established first:**
  1.  **Shared Ownership of the Signal:** You must explicitly state that if the metric gets gamed, *your* team fails, not just theirs. If the dashboard loses credibility, Data Science loses its seat at the table, and Support loses the ability to use data to argue for more headcount or better tools.
  2.  **The Metric $\neq$ The Goal:** Establish that "Resolution Time" is a *proxy* for "Efficiency/Service," not the actual goal.
  3.  **Rationality, Not Malice:** Frame gaming as a rational response to system design, not a moral failing of individuals.

  **Script Cue:**
  > "We built this dashboard to help you get resources. If the numbers get distorted, you can't prove you need more help. We are in this together: my job is to keep the thermometer accurate, your job is to treat the patient. If we optimize for the thermometer reading instead of the patient's health, we both lose."

  ---

  ### Part 2: The Carrying Example (Minutes 10–25)
  **Goal:** Demonstrate the phenomenon using a high-stakes, external analogy to bypass defensiveness.

  **The Example:** **The UK Hospital 4-Hour Wait Target.**
  *Context:* In the early 2000s, UK hospitals were penalized if patients spent more than 4 hours in the Emergency Department.
  *The Gaming:*
  1.  **The Parking Lot:** Ambulances were instructed to wait outside the hospital doors until a bed was guaranteed, so the "clock" didn't start.
  2.  **The Reset:** Patients were moved to "assessment wards" just before the 4-hour mark to reset the timer, even if they hadn't seen a doctor.
  3.  **The Triage:** Simple cases were treated immediately; complex cases that threatened the average were deprioritized.

  **Why this works:**
  *   It mirrors "Ticket Resolution Time" (a time-based SLA).
  *   It involves stressed professionals trying to meet a target, not criminals trying to steal.
  *   It shows systemic distortion, not individual fraud.

  **Addressing the Misconception (Gaming $\neq$ Cheating):**
  *   *When:* Immediately after revealing the Hospital tactics (Minute 20).
  *   *How:* Ask the room: *"Were these bad doctors trying to hurt patients?"*
  *   *The Point:* No. They were good managers trying to keep their departments from being penalized.
  *   *The Takeaway:* "Gaming isn't about bad apples. It's about what happens when good people are forced to choose between the metric and the mission. We need to make sure that choice doesn't exist here."

  ---

  ### Part 3: Applying to Support (Minutes 25–35)
  **Goal:** Map the external example to specific Support failure modes without using academic jargon.

  **The Taxonomy Decision:**
  **Do not use the academic Goodhart taxonomy (Regressional, Causal, Adversarial).**
  *   *Why:* It signals "ivory tower." Support leads care about operations, not econometrics. Using jargon creates a barrier and makes them feel like subjects of a study.
  *   *Alternative:* Use **Behavioral Archetypes**.
      1.  **Cherry Picking:** "Do I take the hard ticket or the easy one to keep my average down?"
      2.  **The Pause Button:** "Do I put the ticket in 'Pending Customer' to stop the clock, even if I could nudge them?"
      3.  **The Premature Close:** "Do I mark this 'Resolved' to stop the timer, knowing they'll reply tomorrow and I'll have to reopen it?" (Note: Ensure your dashboard tracks *reopens* to mitigate this).

  **Activity:**
  Ask the leads: *"Looking at the Hospital example, which of those three behaviors feels most tempting if your bonus is on the line?"* Let them name the risks. This gives them ownership of the solution.

  ---

  ### Part 4: Mitigation & Monitoring (Minutes 35–40)
  **Goal:** Move from problem to partnership.

  1.  **Counter-Metrics:** Announce that Data Science will track "Reopen Rates" and "Customer Satisfaction (CSAT)" alongside Resolution Time. If Resolution Time goes down but CSAT goes down, we know the metric is breaking.
  2.  **The "Sniff Test":** Encourage leads to tell you if the numbers look "too good."
      > "If your team's resolution time drops 30% overnight, don't celebrate. Call us. It means the data is lying, and we need to fix the definition."

  ---

  ### Part 5: The Validation Question (Minutes 40–45)
  **Goal:** Distinguish between nodding along and actual understanding.

  Do not ask: *"Does everyone understand Goodhart's Law?"* (They will lie).
  Do not ask: *"What are the risks?"* (They will give generic answers).

  **Ask this instead:**
  > **"Imagine it's three months from now. The average resolution time has dropped by 20%, but your team is more stressed than ever. What specifically happened to the tickets?"**

  **What to listen for:**
  *   **Failed Understanding:** They talk about volume increasing or hiring freezes (external factors).
  *   **Successful Understanding:** They talk about *behavioral changes* (e.g., "We stopped taking complex tickets," "We're closing tickets before the customer is actually happy," "We're gaming the pause status").

  If they answer with specific ticket behaviors, they understand that the metric drives the behavior. If they answer with external factors, you need to schedule a follow-up 1:1.

  ### Summary Checklist for You
  *   [ ] **Tone:** Collaborative ("Us vs. The Data Problem"), not Policing ("Me vs. You").
  *   [ ] **Jargon:** Zero mention of "Goodhart," "Regressional," or "Causal."
  *   [ ] **Safety:** Reiterate that reporting gaming will not penalize them; it will trigger a dashboard revision.
  *   [ ] **Outcome:** They leave knowing that *protecting the metric's integrity* is part of their management job.
