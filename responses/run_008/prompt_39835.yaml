answer: |-
  You need to throw out step (2).

  The rule that "you don't intend what you don't control" is false in almost every complex action you perform. You intend to catch a flight, but you don't control the pilot; you intend to get paid, but you don't control the payroll clerk; you intend to have a conversation, but you don't control the other person's speech. In each case, your intention is not a command over external forces, but a plan that incorporates them as necessary conditions for success.

  When you apply this to the couch, your intention isn't just "I will lift my end," it is "I will lift my end *as part of us lifting the couch*." This distinguishes genuine joint action from two strangers coincidentally lifting opposite ends of unrelated objects. You aren't wishing for his arms to move by magic; you are forming an intention whose satisfaction conditions explicitly include his participation, contingent on his forming the matching intention.

  This fixes the responsibility problem in (7) because you didn't just sign up for your muscle movements; you signed up for the joint outcome. If the couch drops, the intention "that we carry" failed, and since you were a co-author of that intention, you share in the failure even if your specific muscles performed perfectly. By rejecting (2), you keep the metaphysics simple—no ghostly "we" entity is needed—while acknowledging that human intentions are naturally structured to include other people without requiring control over them.
