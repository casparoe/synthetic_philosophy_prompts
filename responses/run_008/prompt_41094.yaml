answer: |-
  Based on the track record you've described, here is an analysis of your uncle's diagnostic heuristic, a prediction for his verdict on your cousin, and a strategy to uncover the actual rule he is using.

  ### The Prediction: He will likely call OCD a "Real Illness."

  Here is why. While there is ambiguity, the weight of his past verdicts leans toward classifying your cousin's condition as biological rather than behavioral.

  1.  **The "Tourette's Precedent" is key:** Your uncle classified Tourette's as a real illness because patients "genuinely could not suppress their tics no matter what they tried." Clinically, tics *are* suppressible for short periods, but only at an escalating cost of internal tension and discomfort. This is almost identical to OCD compulsions (which can be resisted, but only at the cost of overwhelming anxiety). If he accepts "resistible only at horrible cost" as "involuntary" for Tourette's, consistency demands he apply the same logic to OCD.
  2.  **The "Exogenous Trigger" Rule:** His "not illness" list (Grief, PTSD, Stress Insomnia, Alcoholism) all share a clear external cause or reward mechanism. They are reactions *to* something (death, war, stress, the buzz of alcohol). Your cousin's OCD has "no trauma and no trigger anyone can identify." In your uncle's framework, symptoms that arise endogenously (from within) rather than exogenously (from life events) map onto Epilepsy and Alzheimer's.
  3.  **The "Ego-Dystonic" Factor:** Your cousin "hates every second of it." Alcoholism often involves a degree of pursuit of pleasure or relief (ego-syntonic, at least initially). Grief is painful but feels "appropriate" to the sufferer. OCD intrusive thoughts are repulsive to the thinker. This aligns it more with a malfunction (Tourette's/Epilepsy) than a "problem in living."

  **Verdict:** He will likely view this as a neurological misfiring similar to Tourette's, rather than a habit or a reaction.

  ***

  ### The Competing Rules (The Heuristics)

  You identified two rules, but there are actually three competing frameworks that fit his track record equally well. The tension between them is where you'll find the truth.

  **Rule 1: The "Lesion vs. Narrative" Rule (Szaszian)**
  *   **Logic:** If there is a known physical mechanism or structural breakdown (Epilepsy, Alzheimer's, Tourette's), it is an illness. If the symptom is a behavior or emotion that *could* be a rational (or understandable) response to life (Grief, PTSD, Drinking), it is a "problem in living."
  *   **OCD Prediction:** **Illness.** (Increasingly viewed as basal ganglia circuitry issues; lacks a "narrative" cause).

  **Rule 2: The "Volitional Ceiling" Rule**
  *   **Logic:** If the behavior is physically impossible to stop, it is an illness. If it requires effort but is possible to stop (quitting alcohol cold turkey, forcing oneself to sleep, eventually moving through grief), it is a habit/choice.
  *   **OCD Prediction:** **Ambiguous.** This is the danger zone. If he believes your cousin *could* stop washing if she really wanted to, he will call it a habit. If he accepts that the anxiety makes it functionally impossible, he will call it an illness.

  **Rule 3: The "Proportionality" Rule**
  *   **Logic:** Is the internal state proportional to the external event? Grief after a child's death is proportional (therefore not an illness). Insomnia after stress is proportional. PTSD after war is proportional.
  *   **OCD Prediction:** **Illness.** Violent intrusive thoughts and 4 hours of washing are disproportionate to a life with "no trigger."

  ***

  ### The Wedge: How to tell which rule he's actually running

  To figure out which rule governs his thinking, you need a case where **Rule 1 (Physical/Narrative)** and **Rule 3 (Proportionality/Trigger)** give opposite answers.

  The best case for this is **Severe Endogenous Depression (Melancholia).**

  *   **The Scenario:** A person falls into a depression so severe they cannot get out of bed, eat, or speak.
  *   **The Conflict:**
      *   **According to Rule 1 (Trigger/Proportionality):** There is no external trigger (no death, no war). It is spontaneous. This looks like Epilepsy. **(Verdict: Illness)**
      *   **According to Rule 2 (Volitional):** Technically, the muscles work. They *could* lift the fork if they forced themselves. There is no "seizure" activity. A strict Szaszian might call this a "problem in living" or a refusal to engage. **(Verdict: Not Illness)**

  **The Dinner Question:**
  Don't ask about the cousin yet. Ask about depression generally.

  > *"Uncle, I've been thinking about your distinction between illness and problems in living. Where do you land on severe clinical depression where there's no obvious trigger? Like, someone just crashes chemically with no loss or trauma. Is that a brain disease like epilepsy, or is it just a deeper version of the grief you mentioned?"*

  **How to interpret his answer:**

  *   **If he says "That's an illness":** He prioritizes **Endogenous Origin** (Rule 1/3). He believes if it comes from inside the biology without a life cause, it's medical. **Good news for your cousin:** He will likely validate her OCD diagnosis.
  *   **If he says "That's still living/suffering":** He prioritizes **Hard Neurology/Volition** (Rule 2). He likely only accepts conditions with visible electrical storms (Epilepsy) or physical decay (Alzheimer's) as real. **Bad news for your cousin:** He may view her OCD as a behavioral failure or a "bad habit" of thinking.

  **Alternative Wedge (If you want to be more technical):**
  Ask about **Psychogenic Non-Epileptic Seizures (PNES).**
  These look exactly like epilepsy (convulsions, loss of control), but there is no electrical storm in the brain; they are caused by extreme psychological distress.
  *   *"What about someone who has seizures, but the EEG is normal and it's caused by stress? Is that epilepsy or a reaction?"*
  *   If he says **"Reaction/Not Illness"**: He cares more about the **Cause** (Stress) than the **Control** (Can't stop shaking). This suggests he might view OCD as a "reaction" even without a clear trigger.
  *   If he says **"Illness"**: He cares about the **Control** (Involuntary movement). This suggests he will view your cousin's compulsions as Illness because she can't control them.

  ### Summary
  Your uncle is likely operating on a **"Narrative vs. Glitch"** framework. If he can see a story that explains the symptom (War -> PTSD, Death -> Grief), it's not an illness. If the symptom appears to be a "glitch" with no story (Epilepsy, Tourette's), it is an illness.

  Since your cousin's OCD has **no story** (no trauma/trigger) and is **hated by the host** (ego-dystonic), it fits the "Glitch" category. Unless he digs in on the specific mechanics of volition, the safest bet is that he will validate her diagnosis as a biological reality, distinct from the "problems in living" he dismisses.
