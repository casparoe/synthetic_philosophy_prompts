answer: |-
  # Q&A Prep Sheet: The No-Floor Problem

  **Strategy Overview:** Your core strength is shifting the debate from *intuition* (which consequentialists can bulldoze) to *structure* (which is harder to ignore). Your core vulnerability is that if the structure is granted, the consequentialists will say "So what?" and the non-consequentialists will say "You conceded too much." You must walk the line: The structural flaw explains *why* the intuitions exist, without relying on the intuitions for proof.

  **Concession Strategy:**
  *   **Concede Up Front:** Standard intuition-pumping is weak. Consequentialists *should* bite bullets. Fair-shares views offer a plausible *solution* to the problem you diagnose.
  *   **Hold the Line:** The *diagnosis* (structural lack of a stopping point) is distinct from the *solution* (fair-shares). The lack of a floor is a theoretical cost even if one is willing to demand much.

  ---

  ### 1. The Global Poverty Hardliner (Status Quo Bias)
  **The Objection:** "You say the intuition about the violin lessons is downstream, but it's still doing the work. You're calling it a 'structural flaw' because 'intuition' sounds dirty, but you're still just asserting there *should* be a floor. Isn't this just status quo bias dressed up in structural language? Why is the agent's life special enough to warrant a floor against the drowning child?"
  **Damage:** **High.** If the room agrees the "floor" is arbitrary, your objection collapses into the weak intuition-mongering you criticized.
  **2-Minute Reply:** "I'm not asserting the floor is special; I'm asserting the *theory* is silent on it. Status quo bias assumes we have a right to our current resources. My claim is weaker: I'm saying that *given* agent-neutral reasons, the theory consumes the agent until marginal utility hits zero. A theory that cannot distinguish between 'obligatory sacrifice' and 'total consumption of the agent' lacks a necessary conceptual boundary. Whether that boundary is justified by status quo or integrity is a separate normative question; my point is the theory lacks the *machinery* to mark it."
  **Soft Spot:** You are relying on the idea that a moral theory *needs* a stopping point. They will deny this.
  **Hold/Concede:** Concede you aren't arguing for a specific floor height. Hold that a theory without *any* internal stopping mechanism is structurally incomplete.

  ### 2. The Fair-Shares Theorist (Rediscovered Badly)
  **The Objection:** "This 'no-floor problem' is just the cooperative view without the cooperation. I've argued duties cap at what others would do if they did their part. You're describing the same limit but calling it a 'structural flaw' in optimization. Aren't you just rediscovering the fair-shares view but stripping it of the contractualist machinery that makes it work?"
  **Damage:** **High.** Threatens the novelty and contribution of your paper.
  **2-Minute Reply:** "The fair-shares view is a *solution*; the no-floor problem is a *diagnosis*. You cap the duty by appealing to compliance conditions. I'm pointing out that standard consequentialism lacks even the *concept* of a cap, regardless of compliance. Your view solves the problem by modifying the theory. I'm arguing the problem exists *in the standard theory* before we get to your fix. We agree on the symptom, but I'm isolating the structural cause that makes your fix necessary."
  **Soft Spot:** If your diagnosis doesn't lead to a different solution than hers, the distinction feels scholastic.
  **Hold/Concede:** Concede her view solves the problem. Hold that identifying the structural gap is a distinct philosophical contribution from plugging it.

  ### 3. The Supererogation Senior (Old News)
  **The Objection:** "We've known since Smart that consequentialism has no room for the supererogatory. You're calling it a 'no-floor problem,' but isn't this just the old point that everything is obligatory? If the extension is the same, why do we need new terminology?"
  **Damage:** **Medium-High.** Dismissive. Makes the paper look like a rebranding exercise.
  **2-Minute Reply:** "'No supererogation' describes the *extension* of the theory (what acts are required). 'No-floor' describes the *structure* of the optimization (how the requirement is generated). You can have a theory with no supererogation that still has a floor (e.g., 'maximize up to 50% of income'). Consequentialism is unique because the *optimization procedure itself* prevents setting that floor. Distinguishing the structural mechanism from the extensional result helps us see where modifications (like satisficing) actually intervene."
  **Soft Spot:** If the practical upshot is identical, they may not care about the structural distinction.
  **Hold/Concede:** Concede the extensional overlap. Hold that structural diagnosis is necessary for precise theoretical repair.

  ### 4. The Hardline EA (Why a Floor?)
  **The Objection:** "Let's grant your structural point. There is no internal stopping point. Why is that a bug and not a feature? If the math says give until it hurts, and the suffering prevented outweighs the hurt, why think there *should* be a floor? You're assuming agents have a prerogative that isn't justified by the neutral standpoint."
  **Damage:** **Medium-High.** Challenges the normative force of your objection.
  **2-Minute Reply:** "I'm not arguing for a prerogative here; I'm arguing for theoretical completeness. A theory that tells an agent to consume their own capacity to function as an agent eventually becomes self-defeating. If the optimizer destroys the optimizer, the optimization stops. The 'floor' isn't necessarily a moral prerogative; it's a structural requirement for the theory to remain action-guiding over a lifetime. Without it, the theory risks burning out the very agency it relies on."
  **Soft Spot:** They will argue burnout is just a cost to be calculated, not a structural limit.
  **Hold/Concede:** Concede burnout is a cost. Hold that a theory that cannot *theoretically* distinguish maintenance from sacrifice is flawed.

  ### 5. The Kantian (Integrity/Alienation)
  **The Objection:** "You're conceding too much to the consequentialist framework. The problem isn't the *quantity* of the demand; it's the *source*. Even if there were a floor, requiring me to optimize the good alienates me from my projects. By framing this as a 'no-floor' quantity problem, you're accepting the consequentialist calculus and just haggling over the total."
  **Damage:** **Medium.** Challenges your framing from the outside.
  **2-Minute Reply:** "I agree integrity is the deeper moral worry. But in a workshop full of consequentialists, integrity objections bounce off because they appeal to agent-relative reasons you reject. The 'no-floor' argument is a Trojan Horse: it uses the consequentialist's own commitment to optimization to show the theory breaks. I'm speaking their language to show their house has no foundation, not to defend Kantian integrity directly."
  **Soft Spot:** You might look like you're abandoning the moral high ground for tactical gain.
  **Hold/Concede:** Concede integrity is the deeper moral issue. Hold that structural immanence is the better dialectical strategy *in this context*.

  ### 6. The Technical Consequentialist (Weighted Utility)
  **The Objection:** "You say there's no stopping point inside the theory. But we can just build the floor into the utility function. We assign extra weight to the agent's own projects. Then optimization stops when the cost to those weighted projects exceeds the benefit to others. You haven't found a flaw; you've just found a variable we can tweak."
  **Damage:** **Medium-Low.** A technical fix that sidesteps the philosophical point.
  **2-Minute Reply:** "You can tweak the function, but then you've ceased to be a pure agent-neutral optimizer. You've introduced an agent-relative weighting *by fiat*. My point is that *pure* agent-neutrality generates the no-floor problem. If you have to build in agent-relative weights to stop the consumption, you're admitting agent-neutrality alone is insufficient. That confirms my thesis: the standard theory can't generate the floor without importing non-consequentialist elements."
  **Soft Spot:** They will claim weighting is still consequentialist.
  **Hold/Concede:** Concede it stops the demand. Hold that it does so by abandoning pure agent-neutrality.

  ### 7. The Pragmatist (Action Guidance)
  **The Objection:** "Okay, there's no floor. In practice, we all know people need rest and hobbies. Does this structural point actually change what anyone should do? If the practical advice is still 'give until it hurts,' what work is this doing?"
  **Damage:** **Low-Medium.** Questions the utility of the paper.
  **2-Minute Reply:** "It changes how we evaluate failures. If there's no floor, failing to give everything is a moral failure. If there's a structural no-floor problem, failing to give everything might be a rational response to a broken theory. It shifts the blame from the agent's weakness to the theory's design. That matters for how we theorize moral residue and guilt."
  **Soft Spot:** If they don't care about moral residue, this doesn't land.
  **Hold/Concede:** Concede immediate action guidance might not change. Hold that theoretical accountability does.

  ### 8. The Meta-Ethicist (Agent-Relative Reasons)
  **The Objection:** "Your whole argument rests on granting agent-neutral reasons for the sake of argument. But if we deny those, the problem vanishes. Aren't you just fighting a straw man? No serious non-consequentialist grants agent-neutrality anyway."
  **Damage:** **Low.** Misses the point of immanent critique.
  **2-Minute Reply:** "Philosophy progresses by testing the limits of positions, not just asserting alternatives. Even if you reject agent-neutrality, you need to know exactly where it breaks to know why your view is better. Showing that agent-neutrality *necessarily* leads to no-floor clarifies the cost of accepting it. It's a boundary marker for the debate, not a straw man."
  **Soft Spot:** Can sound defensive.
  **Hold/Concede:** Concede non-consequentialists deny neutrality. Hold that mapping the consequences of neutrality is still valuable.

  ---

  ### The Dreaded Question
  **The Question:** "If you grant agent-neutral reasons, you've granted the consequentialist premise. If you grant that premise, why is the lack of a floor a *reductio* rather than just the correct implication? You're begging the question by assuming a floor *should* exist without justifying it from the neutral standpoint."

  **Why it kills you:** It exposes that your "structural" objection is actually a normative objection in disguise. If you can't justify the floor *from within* the neutral standpoint, you are just asserting a competing normative view (that agents matter specially) while claiming to critique the structure.

  **Best Defense:**
  1.  **Don't Panic:** Acknowledge the force. "That's the crux of the paper."
  2.  **The Move:** Shift from "Moral Error" to "Theoretical Incompleteness."
  3.  **The Script:** "I'm not claiming the lack of a floor is morally wrong *given* the premise. I'm claiming the theory is *incomplete* because it cannot define the conditions of its own application. A map that says 'keep walking until you can't' isn't a map; it's a command to exhaustion. Even if you accept agent-neutrality, a theory that cannot distinguish between 'sacrifice' and 'self-destruction' lacks the conceptual resources to guide a life. I'm not begging the question on morality; I'm pointing out a gap in the theory's machinery."
  4.  **The Fallback:** If they press, concede: "Ultimately, yes, this implies agent-neutrality is incompatible with a sustainable agency. That is the *reductio*. I am arguing we should reject pure agent-neutrality *because* it lacks a floor, not that it lacks a floor because we should reject it." (Turn the logic around: The structural flaw is the *reason* to reject the premise).

  ### General Workshop Advice
  *   **Watch the Clock:** With a hostile room, Q&A will eat the whole 90 minutes if you let it. Keep answers tight.
  *   **Allies:** The Kantian and the Fair-Shares theorist are natural allies against the Hardliners. If the Hardliners get aggressive, subtly pivot to "As [Fair-Shares Person] has argued..." to split the room.
  *   **Tone:** Do not sound apologetic about the "concession" to consequentialism. Frame it as "steeling" the objection. You are making the objection *harder* to dismiss, not easier.
