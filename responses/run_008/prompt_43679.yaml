      *   **Problem 1: Transworld Identity (TWI) vs. Counterpart Theory (CT).**
          *   *TWI (Kripke):* George exists in $W_1$ (Actual) and does not exist in $W_2$ (Pottersville). But $W_2$ is *about* George. The proposition "George does not exist" is true in $W_2$.
          *   *CT (Lewis):* George exists only in $W_1$. In $W_2$, there is a counterpart of George (let's call him George*). But wait, in the film, there *is no* George* in Pottersville. That's the point.
          *   *The Twist:* In Lewis's system, to say "George might not have been born," we look for a world where George's *counterpart* doesn't exist? No, we look for a world where the *individual* George doesn't exist. But Lewis denies transworld identity. So for Lewis, "George might not have been born" means "There is a world where a counterpart of George does not exist."
          *   *The Film's Move:* The film shows a world where *no one resembles George* (in terms of role), but everyone else is there. George (the viewer) is observing a world where he is absent.
