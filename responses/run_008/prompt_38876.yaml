answer: |-
  # The "Convention & Obligation" Sorting Instrument

  **Instructions for Students:**
  Read each scenario carefully. Choose the answer that best matches your immediate intuition about what is *right* or *wrong* in that specific situation. Do not worry about being consistent across questions yet; just answer honestly. There are no trick questions.

  ---

  ### The Quiz

  **1. The 3 AM Crosswalk**
  You are in a city where jaywalking is illegal and strictly enforced. It is 3 AM. The street is completely empty. No cars are visible for a mile. You cross against the light.
  *   **A.** This is fine. There is no danger and no one is inconvenienced.
  *   **B.** This is wrong. You agreed to follow the laws when you are in this society.
  *   **C.** This is wrong. It shows a lack of respect for the social order, even if no one sees.

  **2. The Empty Queue**
  You enter a store with five checkout lanes. Four are closed. One has a cashier but no customers. You walk directly to the register. Another customer enters behind you and waits in the "imaginary line" behind where you would stand.
  *   **A.** This is fine. Efficiency matters more than an invisible line when no one is waiting.
  *   **B.** This is wrong. You should stand where the line *would* be to keep the system clear for the next person.
  *   **C.** This is wrong. It's rude to the cashier to ignore the usual protocol.

  **3. The No-Tip Tourist**
  You are visiting a country where tipping is considered insulting (wages are high, service is prideful). You accidentally leave a 20% tip out of habit. The server looks confused and slightly offended.
  *   **A.** No big deal. It was an honest mistake, and the server got extra money.
  *   **B.** You made a mistake. You should have learned the local norms before arriving.
  *   **C.** You did something morally problematic. You imposed your culture's values on theirs.

  **4. The Principle Tipper**
  You live in the US. You believe the tipping system is unjust because it shifts the burden of paying wages from employers to customers. You refuse to tip at sit-down restaurants, leaving only the base price.
  *   **A.** This is justified. You are refusing to participate in an exploitative system.
  *   **B.** This is wrong. The server needs the money *now*, regardless of the system's flaws.
  *   **C.** This is wrong. You are free-riding on other customers who do tip to keep the restaurant staffed.

  **5. The Shoe Swap**
  You are a guest at a local family's home. They ask you to remove your shoes at the door. You come from a culture where keeping shoes on is standard, and you find bare feet indoors uncomfortable/unhygienic.
  *   **A.** Keep them on. Your comfort and hygiene standards matter too.
  *   **B.** Take them off. It is their house, and their rules apply inside.
  *   **C.** Take them off. It shows you respect their hospitality and way of life.

  **6. The Fancy Fork**
  You are at a casual barbecue. Everyone is using paper plates and their hands. You bring out a specialized salad fork from your pocket and eat your potato salad with it, visibly signaling that you know "better" manners.
  *   **A.** This is fine. Manners are personal, and you are keeping yourself clean.
  *   **B.** This is wrong. You are using etiquette to make others feel inferior.
  *   **C.** This is wrong. You are disrupting the casual vibe of the gathering.

  **7. The New Neighbor**
  An immigrant family moves in next door. They do not separate their recycling according to the complex local rules, though they put their trash out on time. Everyone else on the block sorts carefully.
  *   **A.** Leave them alone. They are new and shouldn't be pressured to assimilate immediately.
  *   **B.** Tell them the rules. It is unfair for them to benefit from the recycling program without doing the work.
  *   **C.** Tell them the rules. Following local norms is part of being a good neighbor.

  **8. The Secret Recycling**
  You are at a public park. There are separate bins for trash and recycling. No one is watching. You throw a plastic bottle into the trash bin because it is closer.
  *   **A.** This is fine. No one was watching, and one bottle makes no difference.
  *   **B.** This is wrong. You are breaking a civic agreement that everyone else follows.
  *   **C.** This is wrong. It harms the environment, regardless of who sees it.

  **9. The Wedding Suit**
  A wedding invitation says "Black Tie." You wear a nice dark sweater and slacks instead. You look neat, but underdressed. The ceremony is in a large hall where no one notices.
  *   **A.** This is fine. Clothing is arbitrary. As long as you are clean, it doesn't matter.
  *   **B.** This is wrong. You promised to follow the dress code when you RSVP'd.
  *   **C.** This is wrong. It disrespects the couple's vision for their day.

  **10. The Elder Greeting (Hard Case)**
  In this community, it is customary to bow slightly when greeting someone over 70. It takes two seconds. You are in a rush and skip the bow, just saying "hello." The elder smiles anyway.
  *   **A.** This is fine. The interaction was friendly; the bow is just a formality.
  *   **B.** This is wrong. You failed to perform the required social ritual.
  *   **C.** This is wrong. You denied the elder the specific honor their status deserves.

  ---

  ### Scoring Key & Logical Map

  **Step 1: Tally Your Answers**
  Count how many times you selected **A**, **B**, or **C**.

  *   **Mostly A:** The **Prudential/Harm Cluster**. You tend to think obligations vanish when harm, cost, or surveillance disappears.
  *   **Mostly B:** The **Rule/Fairness Cluster**. You tend to think obligations come from agreements, systems, and reciprocity.
  *   **Mostly C:** The **Respect/Community Cluster**. You tend to think obligations come from relationships, honor, and social harmony.
  *   **Mixed/Scattered:** You may hold a **Pluralist** view (different rules for different contexts) or an **Incoherent** view (see below).

  **Step 2: Identify Your Leaf Position**
  Use your specific answers to the "Discriminator Questions" below to find your specific philosophical leaf.

  | If you are mostly... | AND you answered... | THEN your position is... |
  | :--- | :--- | :--- |
  | **A (Prudential/Harm)** | **Q1 (Jaywalk): A** AND **Q4 (Tip): A** | **The Pure Coordination View.** Conventions are tools. If they don't help or hurt, they have no grip on you. Morality doesn't apply here, only efficiency. |
  | **A (Prudential/Harm)** | **Q1 (Jaywalk): A** AND **Q4 (Tip): B** | **The Harm-Based View.** Conventions create obligations *only* when breaking them causes actual negative outcomes (like a server losing income). |
  | **B (Rule/Fairness)** | **Q2 (Queue): B** AND **Q7 (Neighbor): B** | **The Fairness/Free-Rider View.** Obligations exist because others are complying. Breaking a rule is unfair even if it causes no direct harm. |
  | **C (Respect)** | **Q3 (Tourist): C** AND **Q5 (Shoes): C** | **The Respect-Based View.** Obligations track membership and hospitality. Visitors have a *special* duty to conform to honor the host, distinct from locals. |
  | **A (Prudential/Harm)** | **Q9 (Wedding): A** AND **Q6 (Fork): A** | **The "Mere Etiquette" Skeptic.** You distinguish sharply between "moral" and "social." These are never moral obligations, only preferences. (Note: Action-wise, this looks like Pure Coordination, but the *reasoning* is different). |

  **Step 3: Incoherent & Unmapped Combinations**
  Certain combinations of answers suggest a position that is logically unstable or rarely held. If your answers match these patterns, consider why:

  *   **The "Visitor Exception" Paradox:**
      *   *Pattern:* You answered **A** on Q1, Q2, Q8 (Locals can break rules if harmless) BUT **C** on Q3 and Q5 (Visitors *must* follow rules).
      *   *Diagnosis:* **Unexplored/Unstable.** This suggests you think conventions are morally binding *only* on outsiders, but not insiders. This is hard to justify: usually, if a rule is morally binding, it binds everyone; if it isn't, it binds no one. You might be conflating "moral obligation" with "prudential safety for outsiders."
  *   **The "Intent-Only" Moralist:**
      *   *Pattern:* You answered **A** on Q1, Q2, Q8 (Actions don't matter if harmless) BUT **B** on Q6 (Fork) and **C** on Q10 (Greeting).
      *   *Diagnosis:* **Incoherent.** You are claiming that consequences don't matter (jaywalking is fine), but *symbols* do matter (forks/bows are wrong). Unless you can explain why symbols have moral weight but safety does not, this position is difficult to defend.
  *   **The "System Absolutist":**
      *   *Pattern:* You answered **B** on Q4 (Tip on principle) AND **B** on Q1 (Don't jaywalk at 3 AM).
      *   *Diagnosis:* **Attractive but Demanding.** This is a strong Rule-Deontological view. It is coherent, but it requires you to follow rules even when they serve no purpose (3 AM) and even when the system is flawed (tipping). Many students find this too rigid upon reflection.

  **Step 4: Limitations of This Instrument**
  Be aware of two "Leaves" that this quiz cannot fully separate, no matter how you answer:

  1.  **Pure Coordination vs. Mere Etiquette:** Both positions result in choosing **A** on almost every question. The quiz actions are the same ("It's okay to break the rule"). The difference is internal: The Coordination view says "Conventions solve problems," while the Etiquette view says "Conventions are arbitrary." To distinguish these, you would need to ask *why* the convention exists, not just if it should be followed.
  2.  **Harm-Based vs. Prudential:** In many cases (like Q1 Jaywalking), "No Harm" and "No Prudential Reason" overlap. A student might choose **A** because "no one gets hurt" (Harm View) or because "I won't get caught" (Prudence). The quiz treats these similarly because the *action* is the same, but the *moral reasoning* differs.

  ---

  ### Instructor's Notes on the Logical Space

  **Why these distinctions matter:**
  This instrument forces students to move beyond "It's just a convention" (which is a conversation-stopper) to "What *kind* of normative force does this convention have?"

  *   **Questions 1, 2, 8, 9** test the **Harmless Violation** distinction. (Does morality vanish when harm vanishes?)
  *   **Questions 3, 5, 7** test the **Visitor/Local** distinction. (Is the obligation based on membership or universal rules?)
  *   **Question 4** tests the **Unjust Convention** distinction. (Can an unjust system generate compliance duties?)
  *   **Questions 6, 10** test the **Respect/Intent** distinction. (Is the wrongness in the act or the attitude?)

  **Common Freshman Pitfalls:**
  *   **The "Rude vs. Wrong" Confusion:** Students often mark Q6 (Fork) as "Wrong" but Q1 (Jaywalk) as "Fine." This is a great opportunity to discuss whether "rudeness" is a moral category or a social one.
  *   **The "Tourist Pass":** Students often feel tourists *must* follow rules (Q3/Q5) but locals can protest them (Q4). Press them on *why*. Is it because tourists are guests? Or because locals have democratic power to change rules that tourists lack?

  **Using the "Incoherent" Results:**
  If a student lands in the "Visitor Exception Paradox," do not tell them they are wrong. Ask them: *"If the rule isn't morally binding on the local at 3 AM, why does it become binding on you when you visit? Did the morality travel with you, or did you pick it up at the border?"* This usually leads to a breakthrough about the source of obligation.
