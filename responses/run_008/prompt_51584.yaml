prompt: |-
  I'm a junior analyst at a foreign policy think tank, and my job is mostly background memos that get a paragraph of a senior person's attention, max. The senior staff reach for historical analogies constantly -- "this is Munich all over again," "we've all seen how Vietnam ends," "rising power vs ruling power, that's the Thucydides trap" -- and half my work is figuring out whether the analogy is doing real inferential work or just decorating a conclusion the writer already had. Write me a procedure I can actually run on an analogy before it goes in a memo: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "cut the analogy and make the argument directly," and where it has to hand the decision back to me because it's a judgment call dressed up as a checklist. Ground it in the actual reasons these analogies mislead -- that out of many historical cases that pattern-match, the writer picks the one whose lesson they already like; that a contested interpretation of the past gets frozen into an apparent fact; that similarity of surface situation gets swapped for similarity of causal structure -- not just a generic "analogies are risky, be careful." Then run it on three cases: a trade dispute with a rising power where people keep saying the pre-1914 Anglo-German naval rivalry is the template; a sanctions debate where someone claims a Cuba-style embargo "never works, look how that turned out"; and one where I personally like the anology and the procedure shouldn't care that I like it -- say I want to call a leader's foreign policy blunder a Suez. Include at least one place where the procedure gives an answer I won't like, and be honest about what the whole thing can't settle. And no reading lists -- if I want the litereature I'll find it myself, I need something I can run in twenty minutes before the memo goes out.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Junior analyst at a foreign policy think tank.
      *   **Task:** Create a practical procedure/checklist to evaluate historical analogies in policy memos.
      *   **Constraint 1 (Time):** Must be runnable in ~20 minutes.
      *   **Constraint 2 (Content):** Must address specific failure modes of analogies (cherry-picking, freezing contested interpretations, surface vs. causal similarity).
      *   **Constraint 3 (Output):** Needs to be a step-by-step procedure with stop conditions ("cut the analogy") and hand-off points ("judgment call").
      *   **Constraint 4 (Examples):** Must test the procedure on three specific cases:
          1.  Anglo-German naval rivalry (trade dispute/rising power).
          2.  Cuba sanctions (embargo effectiveness).
          3.  Suez Crisis (leader's blunder - *user likes this one*).
      *   **Constraint 5 (Honesty):** Must include a result the user won't like and acknowledge limitations (what the procedure *can't* settle).
      *   **Constraint 6 (No Fluff):** No reading lists, no generic warnings.

  2.  **Deconstruct the Problem (Why Analogies Fail):**
      *   *Selection Bias:* Picking the one history that fits the pre-existing conclusion (Munich vs. Vietnam).
      *   *Reification:* Treating a debated historical narrative as objective fact ("Vietnam ended badly" vs. "Vietnam achieved unification").
      *   *Superficiality:* Focusing on actors/setting rather than mechanisms/causality (Naval rivalry $\neq$ Trade war).
      *   *Determinism:* Assuming history repeats rather than rhymes (ignoring nuclear weapons, global supply chains, etc.).

  3.  **Drafting the Procedure (The "Analogy Stress Test"):**
      *   *Goal:* Make it actionable. Use "If/Then" logic.
      *   *Step 1: Causal Mapping.* Does the mechanism match? (Surface vs. Structure).
      *   *Step 2: Counter-Analogy Check.* Is this the *only* fit? (Selection Bias).
      *   *Step 3: Interpretation Audit.* Is the history settled? (Reification).
      *   *Step 4: Disanalogy Check.* What's fundamentally different now? (Determinism).
      *   *Decision Nodes:* Stop/Cut vs. Proceed/Flag.

  4.  **Developing the Test Cases:**

      *   *Case 1: Anglo-German Naval Rivalry (Trade Dispute).*
          *   *Claim:* Rising power (China?) vs. Ruling power (US?) = UK vs. Germany pre-WWI.
          *   *Analysis:* Surface similarity (trade/rivalry). Causal mismatch (naval arms race vs. tariffs/supply chains). Outcome mismatch (WWI vs. economic decoupling?).
          *   *Verdict:* Likely Cut. It's poetic but analytically thin for *trade*.

      *   *Case 2: Cuba Sanctions ("Never Works").*
          *   *Claim:* Embargoes don't work, look at Cuba.
          *   *Analysis:* "Never works" is a causal claim. Cuba is one data point. Counter-examples exist (South Africa, Iran nuclear deal constraints). Interpretation of Cuba is contested (did it fail to topple regime or succeed in containing influence?).
          *   *Verdict:* Cut/Modify. "Never" is too strong. The analogy freezes a complex outcome into a slogan.

      *   *Case 3: Suez Crisis (Leader's Blunder).*
          *   *Claim:* Current leader's move is a Suez moment (humiliating overreach).
          *   *User Bias:* User *likes* this analogy.
          *   *Analysis:* Does the causal structure hold? (Secret collusion, misreading US, imperial overreach). If yes, it's valid. But the procedure must be blind to the user's preference.
          *   *Verdict:* Proceed *but* Flag. It's a strong causal match, but risks appearing partisan if the "blunder" hasn't fully played out.
          *   *Constraint Check:* I need to make sure the procedure hurts the user here. Maybe the procedure reveals the *outcome* is unknown, so calling it Suez *now* is premature. Let's make the procedure flag the "premature judgment" aspect.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Tone:* Professional, cynical, efficient. "Think Tank Internal."
      *   *Structure:*
          1.  The Protocol (The Checklist).
          2.  The Decision Matrix (When to kill it).
          3.  The Test Runs (The 3 cases).
          4.  The Limitations (What this doesn't do).
      *   *Specific Focus:* Ensure the "Causal Mechanism" step is the hardest hurdle. That's where most analogies die.

  6.  **Addressing the "Result I Won't Like":**
      *   I need to ensure the Suez example gets dinged. The user wants to use it. The procedure should say "Wait, the outcome isn't settled yet, Suez is only a Suez in hindsight." That's a painful but accurate check.

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, it's 4 steps.
      *   Specific failure modes addressed? Yes (Selection, Reification, Surface/Causal).
      *   No reading lists? Checked.
      *   Honest about limitations? Yes.

  8.  **Drafting the Content (Mental Simulation):**
      *   *Step 1:* Ask "What causes what?" If the answer is "vibes," cut it.
      *   *Step 2:* Ask "What's the opposite history?" If there is one, acknowledge it.
      *   *Step 3:* Ask "What's different?" (Nukes, Internet, etc.).
      *   *Case 1 (Anglo-German):* Fails on Causal Mechanism. Trade $\neq$ Battleships.
      *   *Case 2 (Cuba):* Fails on Selection Bias/Universal Claim. "Never" is wrong.
      *   *Case 3 (Suez):* Fails on Timing/Hindsight. You can't call it a disaster while it's happening. (This is the sting for the user).

  9.  **Final Polish:** Make it look like a memo or a standard operating procedure (SOP). Use bolding for quick scanning. Ensure the voice sounds like a senior colleague giving hard advice. (Self-Correction: Make sure the "Judgment Call" section is clear about when the analyst has to take responsibility).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **TO:** Junior Analysts
  **FROM:** Senior Staff / Methodology Desk
  **SUBJECT:** SOP 4.2: Historical Analogy Stress Test (FAST)
  **TIME COST:** 20 Minutes Max

  **Purpose:** Most analogies in this building are rhetorical decoration. They signal tribal affiliation ("I know history") rather than analytical leverage. This procedure is not to help you write better metaphors; it is to help you kill bad ones before they embarrass the team.

  **The Failure Modes:**
  1.  **Cherry-Picking:** Selecting the one historical case that supports the pre-written conclusion while ignoring cases that contradict it.
  2.  **Reification:** Treating a contested historical interpretation as an objective fact.
  3.  **Surface Matching:** Confusing similar actors/settings with similar causal mechanisms.

  ---

  ### THE PROCEDURE

  Run these four checks in order. If you fail a check, follow the **Stop/Modify** instruction. Do not proceed until the specific defect is fixed.

  #### 1. The Causal Mechanism Check (5 Minutes)
  **Question:** Does the *engine* of the past event match the *engine* of the current situation, or just the paint job?
  *   **Action:** Write down the specific causal chain of the historical case (e.g., "Assassination $\rightarrow$ Alliance Activation $\rightarrow$ Mobilization Timetables $\rightarrow$ War"). Write down the causal chain of the current situation.
  *   **Pass:** The drivers are structural and identical (e.g., alliance rigidity forcing hand).
  *   **Fail:** The drivers are superficial (e.g., "both involve a charismatic leader" or "both involve trade").
  *   **Stop/Modify:** If the mechanisms differ, **CUT THE ANALOGY.** State the argument directly using current data.
      *   *Example:* "WWI happened because of mobilization timetables. We don't have those. Don't use 1914 to explain a trade war."

  #### 2. The Counter-Analogy Search (5 Minutes)
  **Question:** Is this the *only* historical pattern that fits, or just the one that fits the desired policy outcome?
  *   **Action:** Spend 3 minutes searching for a historical case with similar surface features but a *different* outcome or lesson.
  *   **Pass:** You find a counter-case, but you can explain why the current case aligns more closely with your chosen analogy based on Step 1 (Mechanism).
  *   **Fail:** You find a counter-case that fits equally well but implies the opposite policy.
  *   **Stop/Modify:** If you find a valid counter-analogy, you must **FLAG IT IN THE TEXT.** You cannot present the analogy as deterministic.
      *   *Example:* "While some cite Munich, others note the 1970s détente. We argue Munich is more relevant because..."

  #### 3. The Interpretation Audit (5 Minutes)
  **Question:** Is the historical lesson settled fact or ongoing debate?
  *   **Action:** Google the historical event + "revisionist" or "critique."
  *   **Pass:** Historians generally agree on the outcome and primary cause.
  *   **Fail:** The event is a "Rorschach test" (e.g., Vietnam, Fall of Rome, Cold War origins).
  *   **Stop/Modify:** If the history is contested, you must **QUALIFY THE INTERPRETATION.** You cannot use "History shows X" phrasing. You must use "The conventional view of X suggests..."
      *   *Example:* Do not say "Vietnam proves insurgencies win." Say "The conventional reading of Vietnam suggests..."

  #### 4. The Disanalogy Check (5 Minutes)
  **Question:** What is the one massive variable that exists *now* that did not exist *then*?
  *   **Action:** Identify the biggest structural difference (Nuclear weapons, Internet, Global Supply Chains, Domestic Polarization).
  *   **Pass:** You can explain why this difference does not negate the causal mechanism in Step 1.
  *   **Fail:** The difference fundamentally breaks the causal chain.
  *   **Stop/Modify:** If the difference breaks the chain, **CUT THE ANALOGY.**
      *   *Example:* "You cannot compare pre-1914 economic interdependence to today because supply chains are weaponized now, not just leveraged."

  ---

  ### DECISION MATRIX

  | Result | Action |
  | :--- | :--- |
  | **Pass All 4** | Keep analogy, but keep it brief. It is illustrative, not proof. |
  | **Fail Step 1 or 4** | **KILL IT.** Rewrite the paragraph using direct logic. |
  | **Fail Step 2 or 3** | **KEEP WITH SCARS.** Add the caveat/counter-example explicitly. |
  | **Unsure** | **HAND-OFF.** This is a judgment call. Flag it for the Senior Editor. Do not hide the uncertainty. |

  ---

  ### TEST RUNS

  Here is the procedure applied to three active drafts in the queue.

  #### Case 1: The Anglo-German Naval Rivalry (Trade Dispute)
  *Context:* A draft argues that US-China trade friction is the new pre-1914 Anglo-German rivalry.
  *   **Step 1 (Mechanism):**
      *   *Past:* Naval arms race, zero-sum security dilemma, fear of encirclement.
      *   *Present:* Tariffs, IP theft, supply chain decoupling.
      *   *Verdict:* **FAIL.** Trade leverage is not the same causal mechanism as naval tonnage parity. One is economic coercion, the other is existential military security.
  *   **Step 4 (Disanalogy):**
      *   *Variable:* Nuclear deterrence and globalized capital markets.
      *   *Verdict:* **FAIL.** These prevent the "war" outcome implied by the 1914 analogy.
  *   **Procedure Ruling:** **CUT THE ANALOGY.**
  *   **Fix:** Argue directly about "economic security dilemmas" without invoking 1914. The 1914 reference implies war is inevitable; the data does not support that.

  #### Case 2: The Cuba Sanctions ("Embargoes Never Work")
  *Context:* A draft argues against new sanctions on Country X, claiming "Cuba proves embargoes never work."
  *   **Step 2 (Counter-Analogy):**
      *   *Search:* Do embargoes *never* work?
      *   *Result:* South Africa (Apartheid), Iran (Nuclear Deal leverage), Libya (WMD).
      *   *Verdict:* **FAIL.** "Never" is falsified by counter-examples.
  *   **Step 3 (Interpretation):**
      *   *Audit:* Did Cuba "fail"?
      *   *Result:* Contested. It failed to topple the regime but succeeded in isolating it regionally for decades.
      *   *Verdict:* **FAIL.** "Never works" freezes a complex outcome into a slogan.
  *   **Procedure Ruling:** **KEEP WITH SCARS.**
  *   **Fix:** Change text to: "While the Cuba case suggests embargoes often fail to achieve regime change, they may succeed in containment. However, unlike Cuba, Country X has alternative patrons..." You must acknowledge the counter-examples.

  #### Case 3: The Suez Crisis (Leader's Blunder)
  *Context:* You want to argue the Secretary's recent diplomatic maneuver is a "Suez Moment" (humiliating overreach that signals imperial decline). *You like this analogy.*
  *   **Step 1 (Mechanism):**
      *   *Past:* Secret collusion, misreading US intent, military overreach, forced withdrawal under economic pressure.
      *   *Present:* Secret diplomatic deal, misreading ally intent, political overreach, potential withdrawal under domestic pressure.
      *   *Verdict:* **PASS.** The causal structure of "miscalculated overreach leading to humiliation" aligns.
  *   **Step 3 (Interpretation):**
      *   *Audit:* Is Suez settled?
      *   *Result:* Yes, broadly agreed as a strategic disaster for UK/France.
      *   *Verdict:* **PASS.**
  *   **Step 4 (Disanalogy):**
      *   *Variable:* Time. Suez is only a "Suez Moment" in hindsight.
      *   *Verdict:* **FAIL.** The current situation is ongoing. Calling it Suez *now* presumes the outcome (humiliation) before it happens.
  *   **Procedure Ruling:** **KEEP WITH SCARS (But you won't like this).**
  *   **Fix:** You cannot state it *is* a Suez Moment. You must write: "This carries the *risk* of becoming a Suez Moment."
  *   **Why you won't like it:** It dulls your rhetorical knife. You want to say "This *is* a disaster." The procedure forces you to admit the disaster is contingent, not historical fact yet. It protects the memo from looking partisan if the policy actually succeeds.

  ---

  ### LIMITATIONS (What This Doesn't Settle)

  1.  **Audience Psychology:** An analogy might be analytically weak (fails Step 1) but politically necessary to persuade a specific stakeholder (e.g., a Congressman obsessed with WWII). This procedure identifies analytical weakness, not political utility. That is your call.
  2.  **The "Good Enough" Threshold:** In a crisis, a 60% accurate analogy is better than no framework. This procedure is for *memos*, not *SitRoom briefs*. If the building is on fire, don't run the checklist.
  3.  **Your Own Bias:** You will be softer on Step 2 (Counter-Analogy) when you love the analogy (see Case 3). If you feel yourself rushing Step 2, hand the memo to a peer for a blind check.

  **Final Instruction:** If you run this test and the analogy survives, put it in the second paragraph, not the first. Let the data lead; let history illustrate.
