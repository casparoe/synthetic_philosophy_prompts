answer: |-
  1. "Verdict"

  The argument is invalid. The fallacy is equivocation on the term "prefer" between premise (1) and premise (7). In (1), "prefer" is defined technically as a behavioural consistency relation derived from choice. In (7), "prefer" is used in its psychological sense as a mental state that can conflict with action. You cannot define a term operationally in (1) and then use it normatively in (7) without losing the phenomenon of irrationality. Therefore, step (7) fails to follow from (1) because it smuggles in a contradictory definition. The conclusion (8) is a linguistic trick, not a substantive discovery. Thus, the reasoning collapses.

  2. "Why the step looked safe"

  It looks safe because revealed preference theory is designed to be behaviourally strict. Economists often speak as if preference just is choice to avoid unobservable mental states. This methodological behaviourism makes (1) seem like a rigorous clarification rather than a restriction. Furthermore, (7) sounds like a standard definition of irrationality (doing what you don't want). Because the word "prefer" is identical in both premises, the shift in meaning is invisible. The argument exploits the authority of the technical definition in (1) to silence the colloquial intuition in (7), making the contradiction appear as a profound elimination of akrasia rather than a semantic stipulation. It feels like a reduction, not a confusion. The strict definition offers parsimony, tempting one to accept it as ontological truth rather than a modelling constraint. Your friend finds it compelling because it removes the need to measure invisible psychological states. By collapsing the mental into the physical act, the theory gains scientific respectability. The steps flow logically if one accepts the initial stipulation, making the error look like a hard-headed refusal to indulge in folk psychology rather than a logical mistake. Consequently, the equivocation remains hidden.

  3. "Pricing the alternatives"

  Rejecting (1) is the most direct fix but costs your friend his theoretical foundation. He loses the behaviourist purity that allows economics to claim scientific status without psychology. Preference becomes a mental cause again, which is messy and unobservable. Rejecting (3) or (4) admits that self-reports can contradict choices. This costs the objective verification of preference; the economist must now judge when a subject is lying or mistaken. It reintroduces introspection as data. Rejecting (6) concedes that choice does not reveal preference in akratic moments. This breaks the standard welfare implication that chosen bundles are always superior. It undermines the Pareto principle in cases of addiction. This is a high price for welfare economics. Rejecting (7) is the cheapest retreat. Your friend can redefine irrationality as dynamic inconsistency rather than choice against preference. He keeps (1) but admits (7) uses the wrong definition. However, this costs him the provocative claim that akrasia is impossible. He must concede that economics defines rationality as consistency, not psychological harmony. The price is humility: his model describes coherent choice, not the whole of human agency. He loses the ability to dismiss regret as mere mood. He must acknowledge that his definition is a tool, not a metaphysical truth. This preserves the math but surrenders the philosophical imperialism. The specific cost to the Chicago tradition is the loss of normative authority. They can no longer say policy is wrong because it interferes with preference, since preference may not align with choice. They must distinguish between revealed preference and welfare-relevant preference. This complicates policy analysis significantly. It forces a distinction between what is chosen and what is good for the chooser, a distinction strict revealed preference was designed to abolish. Ultimately, keeping (1) while rejecting the inference to (8) forces him to admit economics is silent on akrasia, not that it disproves it.

  4. "What survives"

  Revealed preference remains a powerful tool for modelling consistency in choice data. It successfully predicts behaviour under stable conditions without needing psychological introspection. It survives as a positive theory of demand, not a normative theory of rationality. We can still say agents act as if they maximise utility, even if they sometimes act against their better judgment. The framework retains its predictive power for market behaviour while conceding that it does not exhaust the meaning of human wanting. It remains valid for analysing market responses to price changes where akrasia is less relevant. The axiom of consistency still holds for aggregate data even if individuals falter. Your friend can keep the mathematics of utility maximisation provided he treats it as a heuristic. The theory survives as a description of coherent choice patterns, not a denial of internal conflict. It tells us how choices relate to each other, not why they are made. This limited scope is sufficient for most economic modelling. The framework does not collapse; it merely shrinks to its proper size. It explains allocation, not agency. Thus, the core machinery remains intact.
