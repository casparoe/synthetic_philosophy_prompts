answer: |-
  1. The debate in calibration vocabulary

  In metrological terms, the reductionist position insists on strict traceability. Just as a working standard in a regional lab cannot issue a valid calibration certificate unless its own accuracy is traced through an unbroken chain back to a primary standard, a hearer cannot accept a speaker's statement as justified unless that testimony is traced back to the hearer's own primary standards. For the reductionist, the primary standards are the hearer's perceptual apparatus and inductive reasoning. Every speaker functions as a working instrument. To accept their reading—that is, their assertion—the hearer requires a calibration certificate: independent positive reasons to trust that specific instrument. Without this chain, the assertion is merely drift, not data. The reductionist demands an uncertainty budget for every link. If I trust a speaker who trusts another speaker, the uncertainty compounds. Justification is the result of error-propagation arithmetic applied to social links. If the chain breaks, or if the uncertainty budget exceeds acceptable tolerance, the measurement (belief) is invalid.

  The anti-reductionist position mirrors the pre-2019 SI definition of the kilogram. For over a century, the kilogram was defined by a specific platinum-iridium cylinder stored at Sèvres. That artifact was not calibrated against anything more fundamental; it partly constituted what a kilogram was. To demand its calibration was a category error. Similarly, the anti-reductionist argues that testimony is a primary source of justification. Trust in a speaker is not derived from independent evidence; it is constitutive of the practice that makes reliability intelligible. The speaker is not a working instrument requiring validation against my perception; they are a node in the definitional network of knowledge itself. To demand a calibration chain for every assertion is like demanding the prototype kilogram be weighed against itself endlessly.

  Regarding accuracy and precision, the reductionist prioritizes accuracy: the correspondence of the belief to the world, secured by the traceability chain. The anti-reductionist emphasizes the precision of the social system: the repeatability and stability of knowledge transfer without infinite regress. In this view, interlaboratory comparisons do not validate the standards from the outside; they are the very mechanism by which the standards maintain coherence. The reductionist sees the lack of a traceability chain as a fatal gap in the uncertainty budget. The anti-reductionist sees the demand for such a chain as a misunderstanding of how the system operates, akin to demanding a physical constant for a conventional unit.

  2. What translates and what distorts

  Your vocabulary translates the structural hierarchy of justification with remarkable fidelity. The reductionist fear of infinite regress maps cleanly onto the metrological fear of untraceable drift. The idea that justification must "bottom out" corresponds precisely to the need for a primary standard. The anti-reductionist appeal to the "givenness" of trust mirrors the artifact standard's immunity to further calibration. The concept of compounding uncertainty captures the intuition that hearsay is less reliable than direct observation.

  However, distortions arise where the technical meets the normative. Calibration is an active, technical procedure involving physical interaction and statistical analysis. Accepting testimony is often passive, immediate, and linguistic. In metrology, the chain is physical and causal; in testimony, the chain is semantic and normative. When you calibrate an instrument, you compare magnitudes. When you evaluate a speaker, you assess meaning and intent. The "artifact" analogy risks making trust seem arbitrary, like a convention, whereas epistemic trust aims at truth, not just stability. Furthermore, measurement uncertainty is quantitative and statistical; epistemic justification is qualitative and logical. Your vocabulary forces a quantitative model onto a normative process. The "reading" of a speaker involves understanding propositions, not just registering signals. This distorts the anti-reductionist claim, which is not that trust is conventional, but that it is primitive. The metrological model suggests a system of control, whereas the epistemological debate concerns a system of entitlement.

  3. The residue

  Two significant residues remain where the calibration vocabulary fails to capture the epistemological reality. First is the problem of uncertainty compounding. In a genuine traceability chain, variance adds at every link according to error-propagation arithmetic. If chains of testimony operated this way, historical knowledge would degrade exponentially. That I know the Earth's core is iron, despite never measuring it, suggests testimony does not function as a serial calibration chain. Instead, it functions more like redundant interlaboratory comparisons. We do not merely pass signals; we preserve content. Consensus and cross-verification reduce uncertainty, unlike serial links which increase it. The disanalogy shows that testimony is not a transmission of magnitude but a transfer of propositional content, which is not subject to statistical degradation in the same way.

  Second is the issue of redefinition. Metrologists retired the kilogram artifact by redefining the unit against a fundamental constant (Planck's constant). The anti-reductionist denies there is any analogous constant against which trust in speakers could be measured. For them, trust is the bedrock; there is no "epistemic Planck constant" to retire it against. The reductionist claims perception is that constant. This marks a real difference between measurement and testimony. Measurement standards are human conventions chosen for stability and can be swapped for better conventions. Epistemic standards aim at mind-independent truth. You can redefine a unit without changing the physical world; you cannot redefine justification without changing the nature of knowledge. The residue here is the distinction between convention and truth. Metrology manages the former; epistemology manages the latter. The calibration vocabulary cannot express the normative force of truth-claims, only the stability of standards.

  4. Where the defect lies

  The defect lies neither in your vocabulary nor in the philosophy, but in a genuine category difference between the subjects. Metrology quantifies physical magnitudes; epistemology tracks normative entitlements. Uncertainty in measurement is quantitative error; uncertainty in testimony is qualitative doubt. Your mapping illuminates the structure of justification but breaks down on the nature of the "quantity" being transferred. Do not force the analogy to paper over the normative gap. The calibration model is a powerful heuristic for structural dependencies, but it cannot capture the semantic content or the truth-aimed nature of testimony. Accept the map as a structural guide, not a functional identity.
