answer: |-
  You have spotted something really important here. What you are describing is a classic problem in the philosophy of law and ethics, and your intuition that there is a tension between the two practices is spot on.

  To answer your question, we need to look at the two main theories of punishment that philosophers usually talk about. Once we define those, we can see which one fits which part of your school's policy.

  ### 1. The Two Main Theories

  **Retributivism (The 'Desert' View)**
  This theory looks backwards. It says punishment is justified because the offender *deserves* it. The key principle here is: 'Only the guilty should suffer.' If you didn't do the crime, punishing you is inherently wrong, no matter how useful it might be. For a retributivist, punishing an innocent person is a moral outrage, even if it saves time or stops future bad behaviour.

  **Consequentialism (The 'Results' View)**
  This theory looks forwards. It says punishment is justified by its *results*. We punish to deter future bad behaviour, to reform the offender, or to keep everyone safe. For a strict consequentialist, whether someone 'deserves' punishment matters less than whether the punishment creates a better outcome overall. If punishing one innocent person would stop a riot or save five lives, a strict consequentialist might say it is justified.

  ### 2. Analysing Your School's Practices

  **Practice A: Individual Punishment**
  *When the school finds out exactly who did it and punishes only them.*

  *   **Retributivist view:** This fits perfectly. The guilty person gets what they deserve; the innocent are left alone.
  *   **Consequentialist view:** This also fits. Punishing the specific culprit is usually the best way to stop *that* student from doing it again (reform) and shows others that crime doesn't pay (deterrence).
  *   **Verdict:** Both theories agree here. This is why it feels 'right' to everyone.

  **Practice B: Collective Punishment**
  *When the whole form gets detention because nobody owns up.*

  *   **Retributivist view:** This is strictly forbidden. If you didn't damage the locker, you do not deserve the detention. Punishing you is unjust, full stop. A consistent retributivist would say the school is doing something morally wrong here, even if it gets results.
  *   **Consequentialist view:** This *can* be justified. The teachers admit the goal is to 'pressure the culprit' and 'make everyone police each other.' These are results. If giving the whole form detention stops locker damage in the future because students will peer-pressure each other, then the punishment has worked. The suffering of the innocent students is weighed against the benefit of stopping the vandalism.
  *   **Verdict:** This practice relies on consequentialist reasoning. It treats punishment as a tool for management rather than a matter of justice.

  ### 3. Is the Inconsistency Real?

  You asked if the school is running on two inconsistent ideas. The answer is: **Yes, morally speaking, but No, if you look at it through a purely Consequentialist lens.**

  **Could a consistent Retributivist defend both?**
  No. A consistent retributivist could never defend collective punishment. To them, punishing the innocent members of your form is a violation of their rights, regardless of how much it annoys the culprit into confessing. So, the school cannot be operating on a pure retributivist view.

  **Could a consistent Consequentialist defend both?**
  Yes. This is the key insight. A consistent consequentialist could support *both* practices.
  *   They would support **individual punishment** when possible, because it usually creates the best results (the right person learns a lesson, no resentment is built up among innocents).
  *   They would support **collective punishment** when investigation is too hard or expensive, *provided* that the benefit (stopping vandalism, saving teacher time) outweighs the cost (the annoyance of the innocent students).

  So, if your school were run by strict utilitarians (a type of consequentialist), they wouldn't see an inconsistency. They would just say: 'We use individual punishment when it's efficient, and collective punishment when it's more efficient.'

  ### 4. The School's Actual Theory: 'Pragmatic Hybrid'

  However, it is unlikely your teachers are sitting around calculating utility. In reality, most institutions (schools, governments, courts) operate on a **Mixed Theory**.

  They generally believe in Retributivism (fairness) as the default. That is why they insist on finding the culprit for serious offences like fighting or theft; they know it would be outrageous to suspend an innocent student for that.

  But, for lower-level administrative issues (messy changing rooms, minor noise), they switch to Consequentialism. They prioritise order and efficiency over strict justice. They are essentially saying: 'This matter isn't serious enough for us to spend hours investigating, but it needs stopping. So we will use a tool (collective detention) that works, even if it isn't perfectly fair.'

  ### 5. Summary

  To answer your specific questions:

  1.  **What theory does each half presuppose?**
      *   **Individual punishment** is compatible with both Retributivism and Consequentialism.
      *   **Collective punishment** strictly requires a Consequentialist justification (it is about results, not desert). It contradicts Retributivism.

  2.  **Does collective punishment only make sense if punishment is justified by consequences?**
      *   Yes. If you believe punishment is only about 'giving people what they deserve,' collective punishment is always wrong. It only makes sense if you view punishment as a tool to achieve a goal (like a confession or deterrence).

  3.  **Could a single underlying view license both?**
      *   Yes, **Consequentialism** can license both. It explains why the school usually tries to find the guilty person (because it works best) but resorts to collective punishment when necessary (because it still produces a net benefit).
      *   **Retributivism** cannot license both.

  **Conclusion**
  Your feeling that the system is inconsistent comes from the fact that your school is switching between two different moral frameworks without admitting it. They appeal to 'fairness' (Retributivism) when they punish individuals, but they appeal to 'effectiveness' (Consequentialism) when they punish the form.

  While a consistent Consequentialist could argue this is fine, many people feel that there are some things we simply shouldn't do to people (like punishing them for crimes they didn't commit), regardless of the good consequences. That is why the practice feels unfair to you, even if the teachers think it is 'necessary.'
