answer: |-
  **MEMORANDUM**

  **TO:** Hiring Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Clarification: Premise-Based Voting and the "Wisdom of Crowds"

  **1. Purpose**

  At our last meeting, our Chair proposed a shift from aggregating individual candidate rankings to a "premise-based" procedure. Under this proposal, we would vote separately on whether Candidate A surpasses Candidate B on Research, Teaching, and Fit, and then allow the majority verdicts on those premises to determine the final hiring recommendation.

  The Chair justified this by appealing to the "Wisdom of Crowds," suggesting that independent judgments on specific criteria will track the truth more reliably than holistic rankings. Two members objected that this procedure risks producing a collective outcome that no individual member actually supports.

  The purpose of this memo is to precisify the "Wisdom of Crowds" claim, evaluate its applicability to our procedure, and demonstrate a specific logical hazard (the "Doctrinal Paradox") that arises when we vote on propositions rather than conclusions. My goal is not to challenge the Chair's epistemic optimism, but to ensure our voting mechanism actually serves the truth-tracking function he intends.

  **2. Precisifying the "Wisdom of Crowds"**

  The slogan "Wisdom of Crowds" is often used loosely. In social choice and epistemology, it generally refers to one of three distinct theses. It is vital we distinguish them, as only one supports the Chair's procedure, and it carries heavy baggage.

  *   **Thesis 1: Error Cancellation (The "Galton's Ox" Reading).**
      *   *Claim:* When estimating a continuous quantity (e.g., the weight of an ox), averaging independent guesses cancels out idiosyncratic noise, yielding a mean closer to the truth than most individual estimates.
      *   *Verdict:* **Platitudinous/True,** but inapplicable here. Hiring is not a continuous estimation problem; it is a discrete choice involving logical relationships between criteria. Averaging "Research Scores" does not resolve whether Research outweighs Teaching.
  *   **Thesis 2: The Condorcet Jury Theorem (CJT).**
      *   *Claim:* For a binary question (True/False), if voters are independent and individually competent (probability of truth > 0.5), the probability that the majority verdict is true approaches 1 as the group size increases.
      *   *Verdict:* **Substantive and Defensible,** *provided* conditions hold. This is likely the reading the Chair intends. However, CJT applies to a *single* binary proposition. It does not automatically extend to sets of interconnected propositions (e.g., Research, Teaching, Fit $\to$ Hire).
  *   **Thesis 3: Normative Legitimacy.**
      *   *Claim:* Majority rule is fair and legitimate regardless of truth-tracking; the procedure validates the outcome because it treats members equally.
      *   *Verdict:* **Defensible,** but irrelevant to the Chair's argument. The Chair argued from *epistemic* grounds ("nearer the truth"), not *political* grounds ("fairer process").

  **3. The Logical Hazard: Judgment Aggregation**

  To utilize Thesis 2 (CJT) for our hiring decision, we must assume that if the majority is likely to be right about Research, and likely to be right about Teaching, the majority is therefore right about the Conclusion (Hiring).

  This assumption is false. The field of **Judgment Aggregation** demonstrates that proposition-wise majority voting can generate a collectively inconsistent verdict from individually consistent voters. This is known as the **Doctrinal Paradox** (or Discursive Dilemma).

  Even if every committee member holds a logically consistent view (e.g., "I will only vote to Hire A if A wins on Research, Teaching, *and* Fit"), the *committee* can simultaneously affirm that A wins on Research, A wins on Teaching, and A wins on Fit, yet conclude that B should be hired.

  **4. A Concrete Profile**

  To illustrate, consider a five-member committee voting on three premises ($R, T, F$) and a conclusion ($H$: Hire A). We assume the departmental rule is that A is superior to B if and only if A surpasses B on all three criteria ($R \land T \land F \leftrightarrow H$).

  Below is a profile where every member is consistent (they only vote $H$ if they vote Yes on all three premises), yet the Chair's procedure produces a result supported by **no one**.

  | Member | Research ($R$) | Teaching ($T$) | Fit ($F$) | **Ranking** (Conclusion) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Voter 1** | Yes | Yes | No | **B > A** |
  | **Voter 2** | Yes | No | Yes | **B > A** |
  | **Voter 3** | No | Yes | Yes | **B > A** |
  | **Voter 4** | Yes | No | Yes | **B > A** |
  | **Voter 5** | No | Yes | No | **B > A** |
  | **Majority** | **Yes (3-2)** | **Yes (3-2)** | **Yes (3-2)** | **B > A (5-0)** |

  **The Paradox:**
  1.  **Premise Voting:** The majority finds A superior on Research, Teaching, *and* Fit.
  2.  **Chair's Procedure:** Applying the rule ($R \land T \land F \to H$), the committee *must* recommend Hiring A.
  3.  **Member Rankings:** Every single member (5 out of 5) ranks B over A.

  The Chair's procedure forces the committee to endorse a ranking ("A is better") that is contained in **nobody's** individual ranking. We would be issuing a recommendation that every member of the committee privately rejects. This undermines the very "truth-tracking" goal the Chair seeks, as the collective verdict contradicts the aggregated private judgments of the experts.

  **5. Escape Routes and Costs**

  We have four main procedural options. Each involves a trade-off between the "Wisdom of Crowds" epistemic benefits and logical consistency.

  *   **Option A: Conclusion-Based Voting (Current Practice)**
      *   *Method:* Members submit whole rankings; we aggregate the conclusions (e.g., via Borda or Condorcet methods).
      *   *Benefit:* Guarantees the outcome reflects the majority will on the final decision; avoids the Doctrinal Paradox.
      *   *Cost:* Loses the granularity of *why* we chose a candidate. It treats the "Wisdom of Crowds" as applying to the holistic judgment rather than the specific criteria.
  *   **Option B: Premise-Based Voting (Chair's Proposal)**
      *   *Method:* Vote on criteria, derive conclusion.
      *   *Benefit:* Forces clarity on criteria; maximizes CJT benefits on individual premises.
      *   *Cost:* Risks the Doctrinal Paradox (as shown above). Can produce outcomes that contradict the majority will on the conclusion, potentially reducing legitimacy and truth-tracking on the final decision.
  *   **Option C: Supermajority Requirements**
      *   *Method:* Require 2/3 or 3/4 majority on premises to pass them.
      *   *Benefit:* Reduces the probability of inconsistency by making premise acceptance harder.
      *   *Cost:* Increases status quo bias. It does not eliminate the paradox logically, only probabilistically. It may silence valid minority insights on specific criteria.
  *   **Option D: Deliberative Aggregation**
      *   *Method:* Vote on premises, but if the conclusion contradicts the majority ranking, reopen deliberation to align premises with the conclusion (or vice versa).
      *   *Benefit:* Preserves logical consistency while respecting the "Wisdom of Crowds" on premises.
      *   *Cost:* Time-intensive. Requires the Chair to manage the tension between "what the premises say" and "what the group feels."

  **6. Recommendation**

  The Chair is correct that independent heads are valuable. However, the "Wisdom of Crowds" relies on the independence of errors. In the profile above, the "errors" (or specific weightings) are distributed such that the majority view on premises diverges from the majority view on the conclusion.

  To defeat the procedure without defeating the Chair's intent, I propose we adopt **Option D (Deliberative Aggregation)** with a default to **Option A (Conclusion-Based Voting)**.

  We should vote on the premises to inform our discussion, as the Chair wishes. However, the formal decision must rest on the aggregated rankings (Conclusion-Based). If the premise votes suggest A but the ranking votes suggest B, we treat this not as a logical derivation, but as a signal to deliberate further on *why* our criteria assessments aren't aligning with our holistic judgments. This preserves the epistemic value of the Chair's proposal without risking a collective recommendation that no member of the committee actually supports.

  I hope this clarifies the stakes. I look forward to discussing this at our next meeting.
