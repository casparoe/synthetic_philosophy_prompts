      *   *Thesis 2: Condorcet Jury Theorem (CJT).* Binary choices. If $p > 0.5$ (competence) and independence holds, majority reliability $\to 1$ as $n \to \infty$.
          *   *Verdict:* Substantive/Defensible *if* conditions met. But hiring involves multiple correlated propositions, not just one binary truth.
      *   *Thesis 3: Normative Legitimacy.* Fairness/Democracy. Majority rule is fair regardless of truth-tracking.
