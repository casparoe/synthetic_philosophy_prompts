      *   **The Chair's Argument:** Appeals to the "Wisdom of Crowds" (independent heads judging the same dossier land nearer the truth).
      *   **The Objection:** The procedure could produce a result contained in *nobody's* ranking (doctrinal paradox/discursive dilemma).
      *   **Task:** Write a memo precisifying the "Wisdom of Crowds" slogan, evaluating distinct theses (trivial, Condorcet, normative), identifying which reading the Chair needs, explaining the judgment aggregation problem (doctrinal paradox), constructing a concrete 5-member profile showing the inconsistency, and assessing escape routes.
      *   **Tone:** Professional, philosophical but accessible, respectful but firm ("defeat the procedure, not him").
      *   **Key Requirements:**
          *   Distinguish theses (trivial/averaging, Condorcet, normative).
          *   Verdicts on theses (platitudinous, defensible, false).
          *   Identify the specific reading needed for the Chair's procedure.
