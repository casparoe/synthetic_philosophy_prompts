answer: |-
  **Interview with Niccolò Machiavelli**
  **Date:** Late 1513
  **Location:** Sant'Andrea in Percussina
  **Topic:** Fortune and *Virtù*

  **Question 1**
  You assign fortune the government of precisely half of human affairs, leaving the other half to us. Why exactly half? Is this figure a serious estimate derived from your study of history, a gesture of even-handedness to appease the religious, or merely a device for keeping failure half-excusable should your advice fail?

  **Follow-up**
  You will likely claim this is an empirical observation drawn from the lives of great men. But if it is empirical, surely the ratio fluctuates wildly between epochs? To fix it at fifty per cent suggests a symmetry nature rarely offers. Is it not possible you have chosen this number because it grants you the maximum authority to advise, whilst reserving just enough uncertainty to absolve you when events prove you wrong?

  **Question 2**
  Accepting, for the moment, your division of labour between fate and free will: how, on your own terms, could anyone ever check it? If fortune is invisible until she strikes, and *virtù* is only visible in success, how do you distinguish a man who controlled half his life from one whom fortune simply allowed to believe he did?

  **Follow-up**
  I anticipate you will say that the ruins of states testify to a lack of *virtù*. Yet you also argue that even the most prudent man may be overwhelmed by the times. If the outcome is the only metric, and outcomes are partly random, does your theory not collapse into a tautology where success proves *virtù* and failure proves fortune, rendering the distinction useless for prediction?

  **Question 3**
  In your chapter on fortune, you first present her as a capricious goddess, then as a river in flood that can be held back with dikes and embankments. If fortune is a dammable river, in what sense is she still fortune? The first image suggests whimsy; the second suggests physics. Does this shift not betray a contradiction in your thinking?

  **Follow-up**
  You will likely argue that the river metaphor illustrates preparation. But if the flood can be mitigated by human engineering, is it not simply a natural hazard rather than a divine arbitress? By making her controllable, do you not quietly concede that she only governs men who lack *virtù*—in which case your chapter has abolished its own opening claim that she governs half of everything?

  **Question 4**
  Let us press that image further. If the river can be tamed by dikes, does fortune not cease to be an external power and become merely a measure of human negligence? If I am flooded, is it because fortune was strong, or because my dikes were weak? Where does the agency truly lie in your second metaphor?

  **Follow-up**
  I suspect you will insist that sometimes the flood is simply too great. But if the flood can be *too* great, then the ratio is not half; it is variable. Does this not imply that your 'half' is actually 'all', unless a man of exceptional *virtù* appears? And if such men are rare, is your book not written for a phantom audience?

  **Question 5**
  Consider Agathocles of Sicily. You credit him with real *virtù* in acquiring power, yet you refuse to describe the killing of one's fellow citizens as *virtù* at all. You must separate, once and for all, *virtù* as technical statecraft from *virtù* as any excellence of character. Which is it?

  **Follow-up**
  You will likely say it is purely technical efficacy. But if *virtù* is stripped of moral content, why do you hesitate to grant it fully to a criminal? If the hesitation remains, does it not suggest you are still beholden to the very moral conventions you claim to discard, making your realism less than complete?

  **Question 6**
  Following on from Agathocles: you suggest a ruler needs the capacity for cruelty together with the judgement not to use it unless necessary. Can a quality that must never be fully exercised be a stable trait of a person? Or is it merely a description of lucky timing?

  **Follow-up**
  You will argue that the *knowledge* of how to be cruel is the trait, not the act itself. But is such knowledge psychologically stable? Can a man keep a weapon sharp without ever cutting? Or does the possession of such capacity inevitably corrupt the judgement required to restrain it, making your ideal prince a contradiction in terms?

  **Question 7**
  You remark that fortune favours the young and the impetuous, in a notorious passage about fortune being a woman who must be beaten and coerced. Ask yourself plainly: does that remark do any argumentative work, or is it decoration? Would your doctrine survive if the passage were deleted?

  **Follow-up**
  If you claim it is merely rhetorical colour, you admit your theory can be separated from your misogyny. But if you claim it is essential, you ground a theory of statecraft on a conceit about women's nature. If the conceit is false, does the theory not lose its explanatory power regarding why impetuosity succeeds? Which is it: ornament or architecture?

  **Question 8**
  In the *Discourses*, fortune seems to be tamed structurally—by institutions and orders rather than by the acute judgement of one man—in a way that a prince, however gifted, cannot manage. Is the chapter on fortune in this little book really a covert chapter about the constitutional inferiority of principalities?

  **Follow-up**
  You will likely defend the necessity of princes in corrupt states. But if institutions are superior at taming fortune, is the principality not merely a emergency measure? Does your analysis not suggest that a state whose fortunes hang on a single man's *virtù* is inherently fragile, regardless of how gifted that man may be?

  **Question 9**
  If the principality relies on one man, and that man must adapt to times that are constantly changing, is such a state not already, by your own analysis, a lost cause that fortune has merely not yet noticed? How can a single life span match the cycles of history?

  **Follow-up**
  You might argue that a great founder can establish orders that outlast him. But if he succeeds in that, has he not effectively turned the principality into a republic? If the survival of the state depends on the founder transcending his own form of government, is your advice to princes not actually advice on how to make themselves obsolete?

  **Question 10**
  On a personal note: the disasters of your own generation—the collapse of the republic you served, and your own fall from office—function in your writing as evidence about fortune. How do we know these are not simply grievance dressed up as evidence?

  **Follow-up**
  You will say you look at history broadly, not just your own life. But your selection of examples favours those who struggled against adversity, much like yourself. Is it not possible that your theory of *virtù* is a rationalisation of your own suffering, designed to prove that your exclusion from Florence is a failure of fortune rather than a judgement on your competence?

  **Question 11**
  You write as though instructing an audience that, by hypothesis, lacks *virtù*—for if they possessed it, they would not need your book. Can *virtù* be taught at all? Or are you selling a commodity that cannot be transferred?

  **Follow-up**
  If you claim it can be taught, you imply that nature is secondary to instruction. If you claim it cannot, you admit your book is useless to those who need it most. Is your work not therefore destined to be read only by those who already understand it, rendering it a mirror for the gifted rather than a tool for the ignorant?

  **Question 12**
  Finally, you observe that fortune raises a man by training habits into him that ruin him once the times change. Does *virtù*, therefore, include the almost inhuman steadiness of being able to abandon one's own habits on cue? Is the virtuous man essentially a man without a nature?

  **Follow-up**
  You will likely say he must be flexible like a fox. But if a man has no fixed nature, no fixed habits, what anchors his decisions? If he is purely reactive to the times, is he not merely a slave to fortune rather than her master? Where is the *virtù* in having no self to impose upon the world?
