  **DIRECTORATE FOR THE BENEFIT OF THE WORST-OFF**
  **SUPPLEMENTAL FAQ TO ANNUAL REPORT 74-B**
  **SUBJECT: STATISTICAL NARROWING OF INTER-QUINTILE DISTANCE**

  **1. Q: The Report states the gap between the richest and poorest citizens has narrowed by a record margin, yet no citizen's absolute material position has improved. How is this consistent with the Directorate's prioritarian mandate?**
  **A:** It is consistent because the moral importance of a benefit is weighted by how badly off the recipient is. In this fiscal year, the Directorate successfully eliminated surplus advantages among the better-off that contributed no weighted moral value. By reducing these surplus advantages, we reduced the distance between positions. While the absolute position of the worst-off remained in a holding pattern of great moral significance, their *relative* standing improved. We prioritize the worse-off; we do not prioritize the better-off's retention of excess. Therefore, a reduction in the better-off's holdings is recorded as an accrual of equality, which is functionally indistinguishable from a benefit to the worst-off in our ledger, provided the worst-off did not decline.

  **2. Q: I am a Utilitarian Auditor. Your policies reduced total aggregate welfare. The rich lost utility, the poor gained none. Why should this be considered a successful year?**
  **A:** The Directorate does not track aggregate welfare. Aggregate welfare treats a unit of utility for the rich as morally equivalent to a unit for the poor. We reject this flatness. Our social welfare function discounts the utility of the better-off precisely because they are better-off. Consequently, when their utility falls, the total sum may decrease without registering as a moral loss in our calculations. We are not concerned with the size of the pie, nor even with the size of the smallest slice, but with the distance between the smallest slice and the largest. If the largest slice shrinks, the distance narrows. That the total caloric intake of the population has dropped is a matter for the Ministry of Health, not Justice.

  **3. Q: My colleague in the Sufficientarian Division was reassigned to Waste Management. Was this because she argued that getting people above a threshold matters more than narrowing gaps?**
  **A:** Colleague reassignments are never punitive. However, the Sufficientarian focus on "enough" introduces an arbitrary threshold where none exists morally. To care only about those below a threshold is to cease caring about the worst-off once they cross a line, even if they remain worse-off than others. The Directorate cares about the worst-off continuously. Your colleague insisted that once a citizen possessed "sufficient" resources, their relative disadvantage ceased to be a concern. This was deemed a dereliction of comparative duty. We do not measure sufficiency; we measure distance. She was reassigned to ensure she did not inadvertently prioritize absolute well-being over relative standing.

  **4. Q: Why was the "Leveling-Up" Pilot Program discontinued after only one month?**
  **A:** The Pilot Program attempted to raise the absolute position of the worst-off without reducing the position of the better-off. While this would have satisfied the Pareto principle, it presented administrative difficulties regarding the source of funds. More critically, raising everyone equally fails to narrow the gap. If all positions improve by the same margin, the relational disadvantage of the worst-off remains unchanged. The Directorate found that resources spent on universal improvement yielded diminishing returns in terms of *priority weight*. It is more efficient to reduce the top than to raise the bottom, as the former produces immediate statistical convergence. We are currently exploring a "Leveling-Down" expansion, pending budgetary approval to reduce surplus holdings further.

  **5. Q: Critics say leveling down harms the rich and helps no one. How do you respond to the claim that this state of affairs is worse for everyone and better for no one?**
  **A:** This objection assumes that harm is defined by absolute loss. We define harm relationally. No one among the worst-off was harmed, as their position was static. Regarding the better-off: while their absolute holdings decreased, their contribution to the moral good increased via the reduction of inequality. To claim they were "harmed" is to ignore the moral value of their sacrifice. Furthermore, a state of affairs where everyone is equal is intrinsically preferable to one where everyone is unequal, even if the universal level is lower. We do not endorse this view officially, as we are prioritarians, but we note that the statistical outcome is identical. No one was made worse off in the only metric that matters: the gap. The worst-off remain exactly where they were, which is to say, they remain the worst-off, but less so than before.
