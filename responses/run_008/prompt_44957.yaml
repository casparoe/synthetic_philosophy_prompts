      *   This is a classic objection to Kripke's *Naming and Necessity*. It's often called the "Guise of the Proposition" objection or related to the distinction between *propositions expressed* and *sentences used to express them*.
      *   **Step (1) & (2):** Kripke accepts these. Rigid designation implies necessary identity.
