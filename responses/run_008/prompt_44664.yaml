answer: |-
  Your intuition is spot-on. Your friend has given you what philosophers call a **Cartesian Materialist** version of Dennett. He has accidentally re-inserted the very "little man in the head" that Dennett spent 400 pages trying to evict.

  The summary you were given is a classic case of "telephone" through pop-neuroscience. It gets the vibe right (naturalism, skepticism of magic) but botches the mechanics so badly that it inverts Dennett's actual argument.

  Here is the claim-by-claim audit you asked for.

  ### 1. The Cartesian Theater & The Homunculus
  **Friend's Claim:** *"Dennett demolished the Cartesian theater — that's Descartes' idea that a little homunculus sits in the pineal gland watching a mental movie screen..."*
  **Verdict:** **Roughly Right (but simplified).**

  Dennett does argue against the "Cartesian Theater." However, he acknowledges that almost no one *explicitly* believes in a literal little man in the pineal gland. The error is more subtle. It's the assumption that there must be some **finish line** in the brain where sensory data arrives and *becomes* conscious.
  *   **The Nuance:** You can believe in neurons and physics and still tacitly assume there is a specific place or time where "it all comes together" for a viewer. Dennett calls this "Cartesian Materialism." He argues there is no finish line.

  ### 2. The Historical Consensus
  **Friend's Claim:** *"...basically everyone believed some version of this until Dennett came along."*
  **Verdict:** **Exaggerated / Strawman Accusation Has Bite.**

  This is the most contentious part of Dennett's legacy. Many philosophers of mind (like Ned Block or William Lycan) argue Dennett attacks a strawman.
  *   **The Critique:** Most cognitive scientists before Dennett didn't believe in a homunculus. They believed in "processing stages." Dennett argues that if you have a final stage where consciousness happens, you are functionally committed to a Theater, even if you deny the homunculus.
  *   **The Audit:** Your friend is repeating Dennett's rhetoric, not the historical reality. It wasn't that everyone believed the Theater; it's that Dennett argues their models *implied* it. Whether that's a brilliant dissolution or a strawman is still debated, but saying "everyone believed this" is historically false.

  ### 3. The Newspaper/Editor Analogy
  **Friend's Claim:** *"The brain works like a newspaper, where a central editor takes all the raw sensory copy, cuts and polishes it, and only the final published version ever reaches consciousness..."*
  **Verdict:** **Catastrophically Wrong.**

  This is the core error that likely triggered your "something is off" feeling. **Dennett explicitly rejects the Central Editor.**
  *   **Why it's wrong:** If there is a central editor who decides what gets published, *who is the editor?* If the editor is unconscious, how does it know what to publish? If the editor is conscious, you've just moved the Cartesian Theater from the pineal gland to the editing desk. You haven't dissolved the homunculus; you've just given him a job title.
  *   **The Actual Model:** In the Multiple Drafts Model, there is no editor. There are only parallel processes. Various "drafts" of narrative fragments are being composed simultaneously in different parts of the brain. They compete for influence. Some get amplified (probed by memory, linked to speech centers), others fade.
  *   **The Correction:** It's not a newspaper with one final edition. It's a wiki page being edited by thousands of anonymous users simultaneously, with no "save" button. There is no "final published version." There is just the current state of the text.

  ### 4. Conscious vs. Unconscious
  **Friend's Claim:** *"...everything that gets edited out stays unconscious forever."*
  **Verdict:** **Misleading.**

  Because there is no central editor, there is no binary switch where information goes from "unconscious" to "conscious."
  *   **The Actual Model:** Dennett prefers the metaphor of "Fame in the Brain." A piece of information becomes "conscious" when it achieves a certain level of influence—it gets quoted by other processes, stored in memory, or able to drive speech. It's a gradient of availability, not a gate kept by a guard. Information isn't "edited out"; it just fails to propagate.

  ### 5. The Seamless Stream
  **Friend's Claim:** *"The editing is so fast we can't catch it in the act, which is why experience feels like one seamless stream."*
  **Verdict:** **Wrong Mechanism.**

  Your friend suggests the stream is real, but the editing is too fast to see. Dennett argues the "stream" is a retrospective narrative construct.
  *   **The Actual Model:** We *think* we have a seamless stream because our brain fills in gaps and smooths over inconsistencies (Dennett discusses the "Orwellian" vs. "Stalinesque" distinction regarding memory). But more importantly, the "stream" isn't a thing flowing through the brain; it's the story the brain tells itself about its own activities. It feels seamless because the narrative *says* it is seamless, not because the underlying processing is a single line.

  ### 6. Free Will and Libet
  **Friend's Claim:** *"And combined with the Libet experiments this basically proves there's no free will, since our feeling of choosing is just the story the editor publishes after the decision has already been made."*
  **Verdict:** **Direct Contradiction of Dennett's View.**

  This is the biggest factual error. **Dennett is a Compatibilist.** He wrote *Freedom Evolves* specifically to argue that free will is real, compatible with determinism, and biologically evolved.
  *   **The Libet Error:** Dennett has written extensively against the popular interpretation of Libet experiments. He argues they measure simple motor ticks (flex your wrist), not complex, reasoned deliberation.
  *   **Dennett's Free Will:** For Dennett, free will isn't "magic ability to break physics." It is the evolved capacity of an agent to consider reasons, anticipate futures, and act accordingly without coercion. The fact that the brain processes information before we report it doesn't negate free will; that processing *is* the machinery of free will.
  *   **The Audit:** Your friend is attributing a Hard Determinist or Illusionist view (like Daniel Wegner) to Dennett. Dennett believes the "feeling of choosing" is not a post-hoc story; it is the experience of the control system doing its job.

  ### Summary of the "Subtly Off" Feeling

  You felt something was off because your friend described a **Single-Stream Processing Model** (Input → Editor → Output), while Dennett proposes a **Distributed Parallel Model** (Competing Narratives → No Output, Only Behavior).

  Your friend's model preserves the "Cartesian Theater" by hiding the homunculus inside the "Central Editor." Dennett's whole point is that there is no Editor.

  ### On Your Intuition ("No central place")

  You mentioned: *"I'm inclined to believe the general 'no central place where it all comes together' picture, fwiw."*

  This is the one part of your friend's summary that aligns with Dennett, but it needs qualification. It's not just that there is no central **place**; there is no central **time**.
  *   **Cartesian View:** At Time T, in Place P, the brain becomes conscious of X.
  *   **Dennett's View:** Consciousness is smeared out over time and space. There is no precise nanosecond where a stimulus becomes conscious. Asking "exactly when did I become conscious of the flash?" is a category error, like asking "how heavy is a headache?"

  ### Final Verdict for Your Next Drink

  You can tell your friend:
  1.  **On the Editor:** "If there's a central editor, isn't that just the Cartesian Theater in disguise? I thought Dennett's point was that there *is* no editor."
  2.  **On Free Will:** "Didn't Dennett write *Freedom Evolves* to argue free will *does* exist? I thought he was a compatibilist, not a hard determinist."
  3.  **On Libet:** "Doesn't Dennett argue Libet only measures wrist-flicks, not the kind of deliberation that matters for free will?"

  Your friend has absorbed the *skepticism* of Dennett without absorbing the *constructivism*. Dennett doesn't want to tell you consciousness is an illusion; he wants to tell you it's real, but it's made of mundane mechanical parts, not magic theater seats. Your friend turned him into a nihilist; Dennett is actually a naturalist.
