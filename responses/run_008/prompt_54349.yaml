          *   *Organic Certification:* Bans synthetics, allows naturals (pyrethrin, Bt). Both kill. Distinction isn't about insect suffering.
          *   *Vertebrate vs. Invertebrate:* Rats get welfare protections (humane dispatch); insects do not.
      *   **Core Question:** What theory of moral status does this apparatus presuppose? Is it consistent?
      *   **Practical Question:** If we *did* adopt a genuine insect-welfare presupposition, what would change? (Thresholds? Methods?)
