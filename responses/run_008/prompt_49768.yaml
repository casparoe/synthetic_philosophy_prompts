answer: |-
  This is a sophisticated formulation. You have moved past the crude "act versus omission" distinction (which is vulnerable to the observation that withdrawing treatment is a muscular act) to a "threat imposition versus threat non-aversion" view, grounded in the causal tracing of peril. This aligns closely with the views of Philippa Foot (in her later work) or Frances Kamm's Principle of Permissible Harm.

  Because your view is already fortified with *ceteris paribus* clauses and a tracing condition, standard counter-examples (like the bathtub cases) bounce off, as you noted. To map the exposure of this specific doctrine, we need to look at where the *tracing mechanism* breaks down, where the distinction becomes redundant, and where the metaphysics of the view might collapse.

  Here is the map of defeaters, sorted from fatal (metaphysical collapse) to awkward (requiring complex caveats), followed by an assessment of the insulation worry.

  ### I. The Fatal Defeaters (Metaphysical and Redundancy)

  **1. The Ontological Void (The Metaphysical Problem)**
  You asked if a metaphysical problem about omissions could sink the view from below. Yes, this is the most fundamental threat.
  *   **The Objection:** If moral supervenes on the natural, there must be a natural property that grounds the moral difference. In "doing," there is an event (muscle contraction, chemical injection). In "allowing," there is often *no event*—just the absence of an event. If omissions are not events (as Bennett and others argue), then in the "allowing" case, you have done *nothing*. How can *nothing* bear moral weight comparable to *something*?
  *   **Why it counts:** If you cannot provide an ontology of omissions that allows them to be relata in a causal chain (the "trace"), your grounding condition ("peril traces... over me") refers to a null set.
  *   **Defender's Reply:** You likely reject naturalist supervenience here. You can argue that the moral reality includes normative facts about absences (e.g., "failure to act" is a real description of the world in a normative context).
  *   **Verdict:** **Fatal** to naturalists; **Question-Begging** to non-naturalists. If you are already committed to deontological constraints, you likely already accept that "not doing X" is a morally salient state of affairs. This objection doesn't change your mind; it just highlights your metaphysical cost.

  **2. The DDE Redundancy (The "Shadow" Objection)**
  You asked if the distinction does independent work if DDE captures the intuitions. This is the strongest *theoretical* defeater.
  *   **The Objection:** In many hard cases, the intuition that "killing is worse than letting die" correlates perfectly with "using someone as a means vs. side-effect."
      *   *Case:* Lethal Injection (Killing/Means) vs. Ventilator Withdrawal (Allowing/Side-Effect of respecting autonomy/stopping burden).
      *   If DDE explains *why* we feel the difference (because one intends death as a means/end, the other foresees it), then DAD is epiphenomenal.
      *   *The Divergence Test:* We need a case where DAD and DDE come apart.
          *   *Accidental Killing vs. Accidental Letting Die:* I accidentally knock you off a cliff (Doing) vs. I accidentally fail to throw you a rope I didn't know you needed (Allowing). DDE doesn't apply (no intention of harm). Do we still judge the accidental killing as worse/more compensable than the accidental letting die?
          *   If yes: DAD has independent work.
          *   If no: DAD is likely just a heuristic for DDE.
  *   **Verdict:** **Serious Threat.** If you concede that DAD only bites when intention is neutral, you reduce it to a tie-breaker. If DDE does the heavy lifting in intentional cases, DAD is merely the residual category.

  ### II. The Awkward Defeaters (Tracing and Categorization)

  **3. The Pre-Existing Threat Ambiguity (The Trolley Problem)**
  This targets your specific "tracing" condition.
  *   **The Objection:** In the standard Trolley case, the threat (the trolley) exists independently of you. You redirect it.
      *   Your view: Is this "imposing a threat" (Doing) or "declining to avert a threat to the five" (Allowing)?
      *   Most DAD proponents say redirecting is *Doing* harm to the one. But the peril *already* had the five in its path. By switching, you make the peril trace *through* you to the one.
      *   *The Flip:* Suppose a villain will kill five unless you kill one. If you kill the one, you impose a new threat (Doing). If you do nothing, the villain kills five (Allowing).
      *   Now suppose the villain will kill five unless you *push* a button that redirects a natural landslide onto the one. Is this Doing or Allowing? The landslide is pre-existing (like the trolley), but your button press initiates the redirection.
  *   **The Exposure:** Intuitions here often track **Contact** or **Means** rather than **Threat Source**. If you say redirecting a pre-existing threat is "Allowing" (because the threat wasn't yours), you permit too much (e.g., redirecting a tsunami onto one house to save five). If you say it is "Doing" (because you intervened), you forbid standard Trolley intuitions.
  *   **Verdict:** **Awkward.** It forces you to refine "traces back through me." Does it mean "I initiated the causal chain" or "I intervened in the causal chain"? If the latter, almost all rescues become "Doings," collapsing the distinction.

  **4. The Special Obligation Collapse (The Duty Erosion)**
  *   **The Objection:** You ground the view in negative-duty constraints. But in hospital ethics, doctors have *positive* duties to patients.
      *   If I have a duty to save you, does my failure to save you (Allowing) become morally equivalent to Killing?
      *   *The Intuition Flip:* A parent starving a child (Doing) vs. a parent refusing to feed a child (Allowing). Most intuitions suggest these are *equally* monstrous. The DAD distinction evaporates in the presence of special obligation.
  *   **The Exposure:** If the distinction disappears whenever a positive duty exists, and hospital ethics is *defined* by positive duties (fiduciary care), then the doctrine does no work in your primary field of application.
  *   **Defender's Reply:** You can argue the distinction remains *ontologically* present but is *outweighed* by the positive duty. (i.e., It is still an allowing, but a culpable one).
  *   **Verdict:** **Awkward.** It limits the doctrine's scope. If it only applies where positive duties are weak or absent, its utility in bioethics (where positive duties are strong) is reduced to edge cases (e.g., triage, resource allocation).

  **5. The "Contact" vs. "Trace" Secret**
  *   **The Objection:** You suspect intuitions might secretly track contact.
      *   *Case:* I poison your water (Doing, no contact with body). I remove your water filter knowing you will drink from the contaminated tap (Allowing, no contact).
      *   *Case:* I push you into the water (Doing, contact). I don't throw the lifeline (Allowing, no contact).
      *   If we find that "contact" drives the intuition more than "threat source," your tracing account is misdescribing the phenomenology.
  *   **Verdict:** **Merely Awkward.** This is an empirical claim about moral psychology. Even if true, a normative ethicist can say, "Psychology tracks contact, but morality tracks threats."

  ### III. The Insulation Worry

  You asked: *Has the view been qualified into something that can only lose in the seminar room and never in the hospital?*

  **The Diagnosis:**
  There is a genuine risk here. If your doctrine says:
  1.  Doing is worse than Allowing...
  2.  *Unless* the intention is bad (DDE)...
  3.  *Unless* there is a positive duty (Special Obligation)...
  4.  *Unless* the cost of saving is low (Easy Rescue)...
  5.  *Unless* the threat was pre-existing and redirection is permissible (Trolley)...

  Then the doctrine risks becoming a **placeholder for "impermissible."** It says, "It is worse to do harm, except when it isn't."

  **Is this a defect?**
  *   **Yes, if** you claim it is a robust, action-guiding principle. If it cannot tell you what to do in the ventilator case without appealing to *other* principles (like autonomy or futility), it is not carrying the load you claim.
  *   **No, if** you view it as a **Constraint Structure.** Constraints *are* supposed to be *ceteris paribus*. The fact that positive duties can override negative duties doesn't mean the negative duty didn't exist; it means it was outweighed.
      *   *Analogy:* "Do not lie" is a valid rule even if "Do not lie *unless* it saves a life" is the practical application. The exception doesn't negate the rule; it defines its boundary.

  **The Hospital Test:**
  Does it do work in the hospital?
  *   **Yes:** In **Triage and Resource Allocation**.
      *   *Case:* Taking a ventilator from Patient A to give to Patient B (Doing harm to A to save B) vs. Not giving a ventilator to Patient A because it is allocated to B (Allowing A to die).
      *   Your doctrine insists these are categorically different. The first is an imposition of threat (active removal); the second is a failure to avert (non-allocation).
      *   *Exposure:* If your intuition is that these are *morally equivalent* in a scarcity context, your doctrine fails. If you feel a "residue" of wrongness in the active removal that isn't present in the non-allocation, the doctrine is working.
  *   **Yes:** In **Terminal Sedation.**
      *   Sedating until death (Doing?) vs. Withdrawing support (Allowing?). If the causal mechanism is identical (cessation of respiration), your "trace" view must explain why one is an imposition and the other is not. (Usually: one introduces a new agent of death [drug], the other removes a barrier to natural death [machine]).

  ### IV. Summary of Exposure

  | Defeater Type | Specific Objection | Severity | Defender's Move |
  | :--- | :--- | :--- | :--- |
  | **Metaphysical** | Omissions are "nothing"; no causal trace exists. | **Fatal** (for naturalists) | Deny naturalist supervenience; assert normative reality of absences. |
  | **Theoretical** | DDE explains all relevant intuitions; DAD is redundant. | **Fatal** (for parsimony) | Find cases where Intention is neutral but Doing/Allowing differs (Accidents). |
  | **Categorical** | Special Duties (parents/doctors) erase the distinction. | **Awkward** | Concede distinction exists but is outweighed; limits scope in bioethics. |
  | **Categorical** | Pre-existing threats (Trolley) blur the "Trace." | **Awkward** | Refine "Trace" to distinguish *initiation* from *redirection*. |
  | **Psychological** | Intuitions track Contact, not Threat Source. | **Minor** | Distinguish moral ontology from moral psychology. |
  | **Meta** | Insulation/Triviality (Qualified into uselessness). | **Meta-Defect** | Argue constraints are inherently *ceteris paribus*; utility lies in "residue." |

  ### Final Recommendation

  You should concede the **DDE Redundancy** point to the extent that intention often correlates with agency. However, you should hold the line on **Accidental Harm** to prove independent work.

  Regarding the **Insulation Worry**: Do not view the *ceteris paribus* clauses as a defect. View them as the **topology of the constraint**. The doctrine's job is not to solve the case alone, but to establish a **presumptive barrier**. In the hospital, when you withdraw a ventilator, the DAD tells you that you are *not* breaching the negative duty constraint, even if the outcome is death. That is not trivial; it is the difference between permissible regret and impermissible guilt.

  If you find that in **Triage** (active removal vs. non-allocation) you have no intuition that the two are different, *then* the doctrine is dead for you. If you feel that actively unplugging a patient to give their bed to another feels "dirtier" than never plugging them in to begin with, your doctrine is alive, and the "trace" condition is the best explanation for why.
