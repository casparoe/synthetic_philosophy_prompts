prompt: |-
  So I'm a software engineer, zero formal philosophy training, but I fell down a rabbit hole last year over what I now know people call the special composition question. Long story short: I'm giving a talk at a university metaphysics workshop next month (a friend in the department invited me, don't ask) where I'll defend my own answer, which is roughly that some things compose a further thing only when the parts are jointly doing something — my laptop's parts compose an object because they work together to run code, my organs compose me because they jointly keep me alive, but the sand in a heap doesn't compose anything, there's just sand arranged heap-wise. The room is gonna be rough: the workshop organizer thinks composition happens whenever you've got some things (she's told me "any two things compose something" is where she lands), one grad student wrote his dissertation on van Inwagen's answer that the only composite objects are living organisms, there's a nihilist in the department who I'm pretty sure thinks there are no laptops OR heaps, just particles, and a couple of logic-y grad students who like precision more than positions. Prepare my Q&A sheet: the objections each of these people will actually raise, in the vocabulary they'd actually use, ordered by how badly each one could sink my talk, each with a two-minute reply I can give as a non-philosopher without embarassing myself, and a note on where the reply is weakest. Also tell me what to concede up front so I don't look like an idiot, and the one question I'm praying nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Software engineer, zero formal philosophy training, but has been reading up on the Special Composition Question (SCQ).
      *   **Task:** Preparing for a university metaphysics workshop talk.
      *   **Position:** Functionalist/Activity-based composition (parts compose a whole *iff* they are jointly doing something/functional unity). Similar to van Inwagen but broader (includes artifacts like laptops).
      *   **Audience:**
          1.  Organizer: Universalist (any things compose something).
          2.  Grad Student 1: Van Inwagen disciple (only living organisms compose).
          3.  Nihilist (no composite objects exist).
          4.  Logic/Precision Grad Students (care about definitions, vagueness, formalism).
      *   **Goal:** A Q&A sheet with objections, replies (2 mins, non-philosopher friendly), weakness analysis, concessions, and the "dreaded question."
      *   **Tone:** Practical, strategic, respectful but confident, acknowledging the user's outsider status while leveraging their engineering perspective.

  2.  **Deconstruct the User's Position:**
      *   *Thesis:* Composition occurs when parts exhibit "joint activity" or "functional unity."
      *   *Examples:* Laptop parts (run code), Organs (keep alive).
      *   *Non-Examples:* Sand in a heap (just arranged heap-wise).
      *   *Philosophical Label:* This is close to a specific version of *Moderate Restrictivism*, often associated with *Functionalist* or *Causal* accounts of composition. It shares DNA with van Inwagen's "Life" answer but extends it to artifacts.

  3.  **Drafting the Concessions (Pre-emptive Strikes):**
      *   *Why:* To show humility and philosophical awareness. Acknowledging the difficulty of the SCQ disarms critics who want to pounce on naivety.
      *   *What to concede:* Vagueness is real. The boundary isn't sharp. We are talking about common sense vs. ontological commitment.
      *   *Draft:* "I know 'doing something' is vague. I know artifacts are controversial. I'm not solving the Sorites paradox today."

  4.  **Developing Objections & Replies (by Persona):**

      *   **Persona 1: The Universalist (Organizer)**
          *   *View:* Unrestricted Composition. Any $xs$ compose a $y$.
          *   *Objection:* "Why stop at function? What about a 'trout-turkey' (half trout, half turkey)? Or you and the moon? If existence isn't costly, why deny the object?"
          *   *Severity:* High. They think the default is 'yes', you need to justify 'no'.
          *   *Reply:* Pragmatic/Ontological parsimony. We don't need *that* many objects. Function tracks what *causes* things in the world.
          *   *Weakness:* Doesn't address *existence*, only *interest*.

      *   **Persona 2: The Van Inwagen Disciple (Grad Student 1)**
          *   *View:* Only living organisms compose.
          *   *Objection:* "Artifacts aren't real objects. They depend on human intention. A laptop is just particles arranged laptop-wise. Life is the only non-arbitrary causal unity."
          *   *Severity:* Medium-High. Direct competitor to the user's view.
          *   *Reply:* Engineering perspective. A laptop's causal power is real regardless of intention. Electrons flow. Life is just complex chemistry; function is the common denominator.
          *   *Weakness:* The "Intentionality" charge is hard to shake for artifacts.

      *   **Persona 3: The Nihilist**
          *   *View:* Nothing composes. Just simples.
          *   *Objection:* "You're saying 'joint activity' creates *existence*? That's magic. There are only particles. 'Laptop' is just a linguistic convenience."
          *   *Severity:* Medium. Radical, but hard to live by.
          *   *Reply:* Error theory vs. Common sense. If it walks like a duck (runs code like a laptop), treat it as a duck. Nihilism makes language useless.
          *   *Weakness:* Doesn't prove composition *happens*, just that it's useful to talk as if it does.

      *   **Persona 4: The Logic/Precision Squad**
          *   *View:* Vagueness, Sorites, Formal definitions.
          *   *Objection:* "When does the activity start? One electron moves? Is a broken laptop still a laptop? Vagueness in the world vs. language."
          *   *Severity:* High (can bog down the talk in semantics).
          *   *Reply:* Distinguish ontological vagueness from semantic vagueness. Function is a threshold concept in engineering; we accept tolerances.
          *   *Weakness:* "Tolerance" might just be sweeping the metaphysical problem under the rug.

  5.  **Ordering by Danger:**
      1.  Logic/Precision (Can make the thesis look ill-defined).
      2.  Universalist (Challenges the core restriction).
      3.  Van Inwagen Fan (Challenges the specific criterion).
      4.  Nihilist (Easiest to dismiss as impractical).

      *Correction:* Actually, the Universalist is the Organizer. Alienating them is bad. But logically, the Precision attack is often the most "talk-stopping." Let's rank by "ability to sink the talk."
      1.  Logic/Precision (Vagueness kills functional accounts).
      2.  Van Inwagen Fan (Direct rival theory).
      3.  Universalist (Fundamental disagreement on default).
      4.  Nihilist (Easy to pivot to pragmatics).

  6.  **The "Dreaded Question":**
      *   What is the Achilles heel of functional composition?
      *   *Idea:* Broken things. A broken laptop isn't running code. Is it still a laptop? If yes, function isn't necessary. If no, it ceased to exist when it broke.
      *   *Selection:* The "Broken Artifact" problem.

  7.  **Refining the Tone:**
      *   Needs to be "Engineer to Philosophers." Don't try to out-philosoph them. Use the engineering background as a strength (causal mechanisms, systems theory).
      *   Avoid jargon where possible, but use *correct* jargon (ontological commitment, vagueness, causal unity).

  8.  **Review against Constraints:**
      *   Two-minute replies? (Keep them concise).
      *   Vocabulary check? (Ensure terms like 'simples', 'ontological commitment', 'vagueness' are used correctly).
      *   Weakness notes? (Crucial for honesty).
      *   Concessions? (Included).
      *   Dreaded question? (Included).

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I capture the User's view correctly? It's basically "Causal Functionalism."
      *   *Check:* Is the Van Inwagen objection accurate? Yes, he rejects artifacts.
      *   *Check:* Is the Universalist objection accurate? Yes, they think restriction is arbitrary.
      *   *Check:* Make sure the advice on *how* to speak is included (don't get bogged down in formal logic).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a high-stakes situation. You are entering a room of specialists with a "folk" theory that closely resembles a specific niche in contemporary metaphysics (a mix of *Causal Functionalism* and *Moderate Restrictivism*). The danger isn't that they will disagree with you—they will. The danger is that they will frame your objections in formal logic you don't speak, or accuse you of confusing *language* with *reality*.

  Your strength is the **engineering perspective**: you treat objects as *systems with causal powers*. Your weakness is **ontological commitment**: proving that "doing something" creates *existence* rather than just *utility*.

  Here is your battle plan.

  ### Part 1: Pre-emptive Concessions
  *Say these in your opening or closing remarks. This signals you know the lay of the land and prevents people from attacking straw men.*

  1.  **Concede Vagueness:** "I am not claiming there is a sharp, metaphysical line where activity begins and composition snaps into existence. Like any engineering threshold, there is a margin of error. I am arguing for the best explanation of causal unity, not a logical proof."
  2.  **Concede Artifacts are Weird:** "I know including laptops but excluding heaps is controversial. I am prioritizing *causal power* over *natural kinds*. If that makes artifacts 'second-class' objects compared to organisms, I can live with that."
  3.  **Concede You Aren't Solving Sorites:** "I am not solving the Sorites paradox today. I am offering a criterion for when we are ontologically committed to a whole, not a precise count of atoms."

  ---

  ### Part 2: The Q&A Sheet
  *Ordered by how badly they can derail your talk.*

  #### 1. The Logic/Precision Squad (The "Vagueness" Attack)
  **The Objection:** "Your criterion is 'jointly doing something.' But activity is vague. If one transistor in your laptop fails, is it still 'running code'? If composition depends on function, does the object pop in and out of existence every time a function hiccups? You're introducing *ontological vagueness*, which many think is impossible."
  **Why it sinks you:** It makes your definition look technically incoherent. If existence is vague, logic breaks.
  **Your 2-Minute Reply:**
  "I'm distinguishing between *semantic vagueness* and *ontological vagueness*. In engineering, a system is defined by its tolerance levels. A laptop with one broken transistor is still functionally a laptop because the *system-level causal power* remains intact. The vagueness is in our description of the threshold, not in the existence of the causal unity itself. I'm arguing that composition tracks *stable* causal patterns, not momentary fluctuations. We don't say a bridge ceases to exist because one bolt loosens; we say it's a damaged bridge. The object persists as long as the functional organization sustains the causal power."
  **Where this is weakest:** You are essentially sweeping the metaphysical problem under the rug by calling it "tolerance." A hardline logician will press you on exactly *how many* transistors can fail before the object vanishes.
  **Strategy:** Don't bite on specific numbers. Stick to "system-level integrity."

  #### 2. The Universalist (The Workshop Organizer)
  **The Objection:** "Why restrict composition at all? Existence is cheap. If I have some particles here and some on the moon, they compose something. It might not be *useful* to name it, but why deny it *exists*? Your 'function' criterion seems arbitrary. Why is 'running code' more ontologically significant than 'being arranged trout-turkey-wise'?"
  **Why it sinks you:** This is the host. You need to respect their view while holding your ground. They think you're being unnecessarily restrictive.
  **Your 2-Minute Reply:**
  "I agree existence is cheap, but *explanation* is expensive. If we accept unrestricted composition, we flood our ontology with objects that do no causal work. A 'trout-turkey' doesn't *do* anything; it's just a sum of parts. My claim is that we should only commit to objects that act as *unified causal agents*. I'm not saying the particles don't exist; I'm saying the 'whole' only earns its ontological keep when it exhibits emergent causal powers that the parts don't have individually. It's ontological parsimony: don't multiply objects beyond necessity."
  **Where this is weakest:** Universalists argue that *what exists* and *what is useful* are separate questions. You are conflating ontology with pragmatics.
  **Strategy:** Frame your view as "Causal Realism." You care about what *acts* in the world, not just what can be counted.

  #### 3. The Van Inwagen Disciple (The "Life Only" Guy)
  **The Objection:** "Van Inwagen proved that only living organisms capture parts into a true unity. Artifacts like laptops rely on *human intention*, not intrinsic causal unity. If humans vanish, your laptop is just a heap. My dissertation shows that life is the only non-arbitrary composition. You're just adding artifacts because you like computers."
  **Why it sinks you:** This is the closest rival to your view. They have the technical literature on their side.
  **Your 2-Minute Reply:**
  "I respect van Inwagen's work, but from a systems engineering view, the distinction between 'life' and 'complex artifact' is a difference in degree, not kind. A cell is a chemical machine; a laptop is an electronic machine. Both maintain homeostasis (thermal, electrical) to process information. Yes, humans designed the laptop, but once built, the electron flow is physical and mind-independent. If I leave the room, the laptop still processes data. The 'joint activity' is physical, not intentional. I'm extending the 'Life' answer to include 'Functional Systems'."
  **Where this is weakest:** The "design" aspect is hard to shake. Organisms grow; laptops are assembled. They will press you on whether "function" is intrinsic or imposed.
  **Strategy:** Emphasize *physical causality*. The code runs regardless of whether anyone is watching.

  #### 4. The Nihilist (The "Nothing Exists" Guy)
  **The Objection:** "There are no laptops. There are no organisms. There are only simples arranged laptop-wise or organism-wise. 'Joint activity' is just particles interacting. You're reifying a process into an object. It's magic to think activity creates existence."
  **Why it sinks you:** It's the nuclear option. Hard to refute, but also hard for them to live by.
  **Your 2-Minute Reply:**
  "I understand the nihilist position, but it renders language and science useless. If I say 'the laptop crashed,' I am stating a fact about the world. If nihilism is true, I'm lying; only 'simples arranged crashed-wise' happened. My view accepts the nihilist's caution about 'magic' but keeps the common-sense reality that *systems* behave differently than *aggregates*. Sand doesn't compute. Laptops do. That difference requires an ontological category for the laptop. I'm choosing the theory that makes the best sense of scientific practice."
  **Where this is weakest:** You aren't proving them wrong metaphysically; you're just saying their view is inconvenient.
  **Strategy:** Paint them into the corner of "Error Theory." Ask if they really believe science is literally false when it references composite objects.

  ---

  ### Part 3: The Dreaded Question
  *Pray nobody asks this, but prepare for it.*

  **The Question:** "What about a **broken laptop**? If composition requires 'jointly doing something' (running code), and the laptop is smashed and off, does it cease to exist? If it *does* exist when broken, then function isn't necessary for composition. If it *doesn't*, then objects pop in and out of existence constantly."

  **Why it's deadly:** It attacks the necessity and sufficiency of your core criterion.
  **Your Prepared Answer:**
  "That is the hardest problem for any functional account. My answer is **dispositional**. The laptop exists when it has the *capacity* to function, even if currently inactive. A smashed laptop has lost its functional organization, so strictly speaking, the 'object' as a functional unity is gone; it is now a heap of parts arranged laptop-wise. However, we speak loosely. Just as a dead body is still called a 'human' for legal reasons, a broken laptop is a 'laptop' for convenience. But ontologically? Once the causal unity is irreversibly broken, the object is gone. I'd rather accept that counter-intuitive result than deny that function is what makes the object real in the first place."
  *(Note: This is bold. It admits broken things don't exist. It might annoy the audience, but it's consistent.)*

  ### Final Advice for the Room
  1.  **Don't Fake Formalism:** If they break out modal logic or mereological sums ($\sum x$), don't try to match them. Say: "I'm approaching this from a systems causality perspective, not a formal mereological one."
  2.  **Own the "Engineer" Label:** When in doubt, pivot to: "In my field, if it doesn't function, it doesn't exist as a system."
  3.  **Be Gracious:** The Universalist is your host. If they push hard, say: "I think your view is more parsimonious in one way, but I'm worried it loses explanatory power."

  Good luck. You're arguing for the reality of the things you build. That's a solid intuition. Stick to the causal power.
