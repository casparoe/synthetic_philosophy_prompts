  Here are the two scenarios, drafted for Tamsin to use at the table, followed by the philosophical breakdown you requested.

  ### The Thought Experiment

  **Scenario One**
  "Okay, imagine you knit a sweater. You find a dropped stitch halfway down. You unravel the whole thing back to a ball of yarn, then you knit the exact same sweater again, same pattern, same needles. You tell your friend, 'I saved the sweater.'"

  **Scenario Two**
  "Okay, imagine you knit a sweater. You find a dropped stitch halfway down. You unravel the whole thing back to a ball of yarn, then you knit the exact same sweater again, same pattern, same needles. You tell your friend, 'That sweater was ruined. I made a new one.'"

  ***

  ### The Screen Test

  **(1) The Coincidentalist (Two Objects: Yarn vs. Sweater)**
  This view holds that the lump of yarn and the sweater are distinct objects occupying the same space. In Scenario One, the Coincidentalist wants to say the *Sweater* survived the unraveling because the knitter's intent was preservation; the form was merely suspended. In Scenario Two, they must say the *Sweater* ceased to exist when unravelled, and a numerically distinct Sweater came into being upon re-knitting, even though the Yarn object persisted through both.
  *   **Where they sweat:** They have to explain how a physical object (the Sweater) can go out of existence and come back into existence based entirely on what the knitter *said* to a friend. If the physical history is identical, why does the ontology change? They start sweating when Bea asks, "So the sweater pops out of existence if I don't say the magic words?"

  **(2) The Eliminativist (No Composite Objects)**
  This view says there are no sweaters, only yarn arranged sweater-wise. For them, both scenarios are identical. There was never a "sweater" to save or destroy, only atoms moving from arrangement A to arrangement B and back to A.
  *   **Is this good news?** Yes, finally. This case is their best friend. It exposes that our intuition about "objects" is fuzzy and dependent on language, which supports their claim that composite objects are just figures of speech.
  *   **The catch:** At a Thanksgiving dinner, this view is suicidal. If Bea says, "Pass the sweater," and the Eliminativist says, "There are no sweaters," they lose the room. The theory works logically but fails the "normal person" test spectacularly.

  **(3) The Conceptualist (One Object, Two Concepts)**
  This view says there is only one thing there, but we apply different identity conditions depending on the concept we're using. In Scenario One, we're using the concept *Artifact-Continuity*, so identity persists. In Scenario Two, we're using *Artifact-Creation*, so identity resets.
  *   **Does the framing bother them?** Not at all. This is their home turf. They argue that "object" isn't a feature of the world, but a tool we use to navigate it. The framing difference *is* the work. They are comfortable saying the verdict changes because the *question* changed.

  ***

  ### Structural Analysis

  **The Structural Feature Doing the Work**
  The engine here is **teleological framing** (the purpose assigned to the intermediate state). In both scenarios, the physical intermediate state is a ball of yarn. But in Scenario One, that ball is framed as a *pause* (potential sweater). In Scenario Two, it's framed as a *termination* (dead sweater). The intuition shift relies entirely on whether the interval is seen as a bridge or a wall.

  **What Happens If You Remove It**
  If you remove the framing (the dialogue with the friend), normal people default to **physical continuity**. Without the story, most would say, "It's the same sweater, you just re-knit it." The verdicts converge. This proves that our ordinary object-tracking isn't just about matter; it's about narrative coherence.

  **How the Losing View Fights Back**
  The Coincidentalist (who wants objective facts about objects) will fight back by claiming **intent is a physical fact**. They'll argue the knitter's brain state *was* different in the two scenarios, so the material facts *weren't* identical. The intent caused the unraveling behavior (careful vs. rough), even if microscopically similar. They will insist that mental states are part of the physical causal chain, so the object's survival isn't magic—it's caused by the brain's preservation directive.

  ***

  ### Bea's Comeback

  If Tamsin lays this out, Bea shouldn't try to win the metaphysics. She should win the labor.

  **Bea:** "Tamsin, the yarn doesn't care what you call it. It kept me warm either way. You're arguing about whether the sweater exists; I'm arguing about the hours I spent knitting it. If you unravel my work, you don't get to decide if it's still mine. You just owe me dinner."
