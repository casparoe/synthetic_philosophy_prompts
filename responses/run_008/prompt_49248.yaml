  The "10% Fusion" case tests whether origin is gradable. But the "Re-Absorbed Twin" case tests the *logic of her hardest verdict* (V3). If she says "Not You" to the re-absorbed twin, it confirms she is a Strict Historical Essentialist who cares about the *shape* of the history, not just the outcome. This locks in the prediction that she will say "Not You" to the chimera (because fusion also alters the shape of the history/origin). If she says "You" to the re-absorbed twin, she is a Continuity theorist, and the chimera case becomes much harder for her to settle.

