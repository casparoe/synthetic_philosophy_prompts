      *   *The Roommate's Error:* She conflated "variation within a group" (why *I* am more nearsighted than *you*) with "changes in the average over time" (why *we* are more nearsighted than *our parents*). She also assumed high heritability means immutability (it doesn't).
      *   *The "Cousin in the Countryside" Evidence:* This actually supports the environmental argument *interacting* with genetics. Same genes, different environment, different outcome.

