      *   *What is Heritability?* It's the proportion of *phenotypic variance* in a *specific population* at a *specific time* that is attributable to *genetic variance*.
      *   *The Crucial Nuance:* Heritability is about *differences* between people in a group, not the absolute level of the trait for the group.
      *   *The Analogy:* Height is highly heritable, but average height increased over generations due to nutrition. Why? Because everyone got better nutrition, so the *variance* due to environment decreased, making genetics look more important, but the *mean* shifted due to environment.
