answer: |-
  You are absolutely right to trust your gut on this. Your roommate's reasoning is a classic, understandable statistical trap, but the science doesn't actually contradict itself. You don't have to choose between "heritability is real" and "environment matters." Both can be 100% true simultaneously.

  Here is the breakdown of why the math works, followed by a script you can use at dinner that respects her intelligence without triggering a debate.

  ### Part 1: The Stats Refresher (For You)

  The core confusion lies in what the word **heritability** actually measures. In colloquial English, we think "heritable" means "passed down from parents." In statistics, it means something much narrower.

  **1. Heritability is about *variance*, not *value*.**
  Heritability ($h^2$) answers the question: *"In this specific group of people, living in this specific environment, at this specific time, how much of the **difference** between Person A and Person B is due to their DNA?"*

  It does **not** answer: *"How much of Person A's eyesight is due to DNA?"*

  **2. The "Within vs. Between" Trap.**
  This is where your roommate's logic jumped the rails.
  *   **High Heritability (Within a generation):** If you take 1,000 kids in modern Seoul, all exposed to similar amounts of homework and screen time, the *differences* between them (why one is -2.00 and another is -6.00) are largely genetic. Some kids' eyes are genetically more susceptible to elongating than others. In this uniform environment, genetics explains most of the *variation*.
  *   **Generational Shift (Between generations):** If you compare the 1990 cohort to the 2020 cohort, the *average* eyesight has changed. Heritability statistics **cannot** explain changes in the average over time. They only explain differences between individuals at one time.

  **3. The Height Analogy (The Gold Standard)**
  This is the easiest way to visualize it.
  *   Height is highly heritable (around 80%).
  *   Yet, the average height of South Korean men increased by about 5 inches between 1950 and 2000.
  *   Did the gene pool change in 50 years? No.
  *   Did heritability vanish? No.
  *   **What happened?** The environment (nutrition) improved for *everyone*. Because everyone got better milk and food, the *average* went up. But within the new generation, the tall kids still had tall parents, so heritability remained high.

  **4. The Myopia Mechanism: "Load the Gun, Pull the Trigger"**
  Current research suggests myopia works on a **threshold model**.
  *   **Genetics:** Loads the gun. (Some eyes are structurally prone to elongating.)
  *   **Environment:** Pulls the trigger. (Lack of sunlight reduces retinal dopamine, which signals the eye to stop growing. Near-work creates hyperopic defocus.)
  *   **The Cousin:** Your roommate's cousin is the smoking gun. If myopia were purely genetic, the cousin (sharing similar family DNA) should be nearsighted too. The fact that the countryside cousin has healthy eyes proves that the *genetic risk* requires an *environmental trigger* to manifest.

  **Summary:** The 80% heritability figure means that *among kids already living the modern lifestyle*, genetics predicts who gets it worst. It does not mean the modern lifestyle didn't cause the epidemic.

  ***

  ### Part 2: The Dinner Script (For Her)

  Do not lead with "You're wrong about statistics." Lead with "You noticed something real, but the conclusion is tricky." Validate her observation about the generational shift, because she is right that the gene pool didn't change.

  **Here is the conversational path:**

  **1. Validate the intuition (Disarm the defense)**
  "I was thinking about what you said, and you were actually right about the most important part: the gene pool definitely didn't change in 25 years. That's impossible. And your cousin example is actually the key to the whole thing."

  **2. Introduce the distinction (The 'Height' Analogy)**
  "The only thing that was confusing me was the stat definition. I remembered that heritability only explains why *I* am different from *you*, not why *we* are different from *our parents.*
  Think about height in Asia. Height is super genetic, right? But the average height jumped like 5 inches in one generation because of nutrition. The genes didn't change, the environment just let the genes express differently. Myopia seems to be the exact same thing."

  **3. Apply it to her evidence (The Cousin)**
  "Your cousin proves this. You guys have similar genetics, but different eyes. That means the genetics are like a 'susceptibility,' but the environment is the switch.
  So the 80% number just means: 'Once everyone is doing near-work and staying inside, the only reason some kids go blind and others don't is genetics.' But the reason *everyone* is going blind compared to your parents is the environment."

  **4. The Closer (Collaborative conclusion)**
  "So the science isn't broken, it's just specific. High heritability doesn't mean 'immutable.' It just means 'sensitive.' Which actually makes the outdoor time stuff *more* important, not less, because it's the only lever we can pull to stop the trigger."

  ***

  ### Why this works
  *   **It respects her intelligence:** You aren't dumbing it down; you're clarifying a technical definition.
  *   **It uses her data:** You are using her cousin and her generational observation as proof *for* the environmental argument, not against it.
  *   **It avoids jargon:** No talk of "phenotypic variance components." Just "differences between people" vs. "changes over time."

  If she pushes back, just stick to the Height Analogy. It is scientifically isomorphic to the myopia situation and much harder to argue with emotionally.
