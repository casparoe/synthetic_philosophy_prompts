answer: |-
  Here is the analysis you requested, committed to a specific reading of the underdetermination thesis based on the facts provided.

  ### 1. Mapping the Theoretical Bundle

  To apply the Duhem–Quine thesis correctly, we must first delineate the "theory" being tested. In both the Uranus and Mercury episodes, the community was not testing Newtonian gravitation ($T$) in isolation. They were testing a conjunction:

  $$T \land A_1 \land A_2 \land \dots \land A_n$$

  Where $T$ is the universal law of gravitation (inverse-square law), and the $A$s are auxiliary assumptions. Crucially, the most significant auxiliary here is **$A_{\text{inventory}}$**: the claim that the known planets constitute the complete inventory of massive bodies relevant to the orbit in question. Other auxiliaries include the reliability of the telescopic data and the absence of non-gravitational forces (like drag or electromagnetic effects).

  When Uranus deviated from its table, the logical situation was: *Either $T$ is false, or $A_{\text{inventory}}$ is false (there is a missing planet), or the data is flawed.* Logic alone cannot dictate which conjunct to reject. This is the Duhemian holism in action. The "theory" whose support was in question was the entire package. The decision to treat $T$ as sacrosanct and $A_{\text{inventory}}$ as the variable was a methodological choice, not a logical deduction.

  ### 2. The Neptune Episode: Rational Repair or Arbitrary Shielding?

  Was the Neptune episode a textbook Duhemian repair? **Yes.** Le Verrier and Adams saved the core ($T$) by adjusting the periphery ($A_{\text{inventory}}$). Was this rational? **Yes, but not because the evidence forced it.**

  The rationality lay in the **prior track record** of the core theory. By the 1840s, Newtonian gravity had successfully accounted for centuries of celestial mechanics. To discard $T$ based on one anomaly would have been methodologically wasteful. It was more conservative (and thus rational in a Bayesian sense) to assume the inventory was incomplete than to assume the universal law was broken.

  However, the **luck** involved in the prediction cuts deeply against the idea that this was a "severe test" of Newtonian theory. You noted that Le Verrier and Adams baked in a wrong assumed distance (via Titius–Bode) and that Neptune's actual orbit differed substantially from their calculations, yet the sky position matched. This implies that the evidence (Uranus's perturbations) **underdetermined the specific properties of the auxiliary hypothesis.** Multiple configurations of a hypothetical planet (different masses, distances, eccentricities) could have produced perturbations compatible with the Uranus data within the margin of error.

  The fact that the "point of the pen" landed on the right spot was, as you suggest, partially fortuitous. This means the success of Neptune does not prove that the data uniquely pointed to *that* specific planet configuration. It proves that *some* auxiliary adjustment could save the core. Consequently, the Neptune episode does not show that Newtonian theory was rigorously confirmed; it shows that the theory was **flexible enough to absorb the anomaly** via a plausible auxiliary adjustment. The underdetermination was present but masked by the success of the prediction.

  ### 3. The Vulcan Episode: Vindication or Deflation?

  This brings us to the punchline: Le Verrier made the exact same inferential move for Mercury, and it failed. Does this pair of episodes vindicate underdetermination or deflate it?

  **I argue it vindicates underdetermination as a live, practically important problem.**

  Here is why: For fifty years, the evidence regarding Mercury **was compatible** with "Newton + Vulcan." Astronomers claimed sightings; the hypothesis was empirically adequate enough to keep the core theory alive. The evidence did not logically force the rejection of "Newton + Vulcan" in 1860, 1880, or 1900. If underdetermination were merely a abstract skeptic's puzzle, the community should have been able to logically deduce that Newton was wrong much earlier. They did not.

  The community "muddled through," as you put it, but that muddling is precisely what happens when logic runs out. They persisted with the Vulcan hypothesis because the non-empirical virtue of **conservatism** (keeping Newton) outweighed the empirical cost (an unobserved planet). The shift to General Relativity (GR) did not happen because the Mercury data finally "spoke" and ruled out Vulcan; it happened because Einstein provided a **new core theory** ($T'$) that accounted for the anomaly without the *ad hoc* auxiliary.

  If you claim this deflates underdetermination because science "got the right answer in the end," you are conflating **eventual resolution** with **logical determination**. Underdetermination claims that evidence alone does not dictate theory choice *at the time of decision*. The fifty-year gap between the anomaly and GR is the empirical proof of underdetermination. During that half-century, scientists were free to believe in Vulcan or doubt Newton, and the evidence alone could not settle it. The fact that they eventually chose GR does not erase the fact that for fifty years, the evidence underdetermined the choice.

  ### 4. The Verdict on Underdetermination

  My committed verdict is this: **The Uranus/Mercury pair vindicates the Duhem–Quine thesis as a structural description of scientific inference, while exposing the limits of "success" as a truth-tracking metric.**

  The episode supports underdetermination in three specific ways:

  1.  **No Logical Coercion:** In both cases, the anomaly was compatible with multiple theoretical packages (Modify $T$ vs. Modify $A$). Logic did not dictate the choice in 1846, nor did it dictate the choice in 1860. The choice was driven by the heuristic value of the core theory.
  2.  **The Fragility of Confirmation:** The luck in the Neptune prediction reveals that even "successful" novel predictions do not eliminate underdetermination. The data did not uniquely specify Neptune's parameters; it only specified a region of possibility. The confirmation was weaker than the celebratory rhetoric ("discovered with the point of his pen") suggested. This implies that what looks like a decisive test is often an underconstrained fit.
  3.  **The Role of Non-Empirical Virtues:** The divergence in outcomes (Neptune found, Vulcan not) shows that the strategy of "save the core, tweak the auxiliaries" has no internal off-switch. It works until it doesn't. The only thing that stopped the Vulcan hypothesis was not a logical contradiction with the data, but the arrival of a theoretically superior alternative (GR) that rendered the auxiliary unnecessary.

  **Where the Underdetermination Machinery is Silent:**
  I must note where this lens distorts the history. Duhem–Quine focuses on the *logic of justification*, but it is silent on the *heuristics of discovery*. It cannot explain why Le Verrier's calculation was a brilliant feat of mathematical physics rather than a random guess. It treats "Newton + Vulcan" and "General Relativity" as logically equivalent packages competing for evidence, but it misses that GR offered a deeper explanatory unification (gravity as geometry) that "Newton + Vulcan" did not. Underdetermination explains why the evidence didn't force the change; it does not explain why GR was the *better* theory beyond empirical fit.

  ### Conclusion

  The nineteenth-century astronomical episodes do not show that underdetermination is a problem that prevents scientific progress. They show that underdetermination is the **normal state of scientific progress.** Evidence never forces a theory change; it merely makes certain theoretical packages more costly to maintain.

  The Neptune success was a lucky validation of a Duhemian maneuver; the Vulcan failure was the inevitable limit of that same maneuver. The community did not "solve" underdetermination; they navigated it using conservatism and theoretical elegance until a better core theory emerged. Therefore, the episode vindicates underdetermination: the evidence really was compatible with "Newton + Vulcan" for fifty years, and only non-empirical virtues allowed science to move past it. To deny this is to mistake the eventual winner for the logically necessary one.
