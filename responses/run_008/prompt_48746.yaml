      *   *Move 2: Marcus says Dave believes every ticket loses.*
          *   Status: Logical extension of Dave's position. If probability justifies belief, it justifies belief for *every* ticket.
      *   *Move 3: Marcus says Dave believes "All tickets lose."*
          *   Status: This invokes the **Conjunction Principle**. Marcus assumes belief aggregates.
      *   *Move 4: Dave says "Beliefs don't combine like that."*
          *   Status: This is the core Kyburgian move. Rejecting Conjunction.
      *   *Move 5: Marcus calls it special pleading (Fridge/Cupboard analogy).*
          *   Status: Marcus argues for intuition. Small numbers feel different than large numbers. This is the "Sorites" vibe.
