          2.  Davidson's Paradox: How does hyperbolic discounting interact with the idea that you can't intentionally do X while judging Y is better? Does it dissolve or dodge the paradox?
          3.  Fictional Application: If akrasia is preference reversal, how should the character be written? Is the "bargaining household of selves" metaphor real or just vibes? Is there room for the *felt experience* of betrayal?
          4.  **Final Verdict:** Take a side. Does hyperbolic discounting explain, describe, or confuse the notion of weakness of will?

  2.  **Deconstruct the Core Concepts:**
      *   **Hyperbolic Discounting:** Valuing rewards disproportionately more as they get closer to the present. (e.g., $100 today vs. $110 tomorrow = take $100. $100 in 365 days vs. $110 in 366 days = take $110). This leads to *preference reversal*.
      *   **Exponential Discounting:** Consistent rate of discounting over time. Preferences don't flip just because time passes.
      *   **Akrasia (Weakness of Will):** Acting against one's better judgment.
      *   **Davidson's Paradox:** If I judge Y is better all-things-considered, how can I intentionally choose X? It seems logically impossible.
      *   **Multiple Selves Model:** The idea that "Future Me" and "Present Me" are effectively different agents with different preferences.

  3.  **Address Question 1: Exponential vs. Hyperbolic & Irrationality:**
      *   *Exponential:* Consistent. If I plan to diet next week, I diet next week. No internal conflict generated by time itself.
      *   *Hyperbolic:* Inconsistent. I plan to diet next week, but when next week becomes *this week*, I eat the cake.
      *   *Why it matters:* It explains *dynamic inconsistency*. It shows the preference structure *changes*, not just the strength of will.
      *   *Is it irrational?* In standard economics, yes, because it violates transitivity/consistency over time.
      *   *Sequence of selves?* Yes, this is the "Multiple Selves" or "Intrapersonal Conflict" model (Ainslie, Thaler, etc.). It's not just a metaphor; it's a serious modeling approach. It suggests "Present Me" hijacks "Future Me's" plan.

  4.  **Address Question 2: Davidson's Paradox:**
      *   *Davidson:* You can't believe Y is best and choose X *under the same description*.
      *   *Hyperbolic Solution:* It changes the "all-things-considered" judgment. At 3 AM, "Quit Job" is best. At 8 AM, "Keep Job" is best *all-things-considered* because the immediate pain of uncertainty is now heavily weighted.
      *   *Dodge or Dissolve?* It dissolves the logical contradiction by saying the judgment *changed*. The paradox assumes a static judgment. Hyperbolic discounting says the judgment is time-sensitive. So, at 8 AM, she isn't acting against her *current* judgment, she's acting against her *past* judgment.

  5.  **Address Question 3: Fictional Application:**
      *   *Writing the Character:* If it's just "lazy willpower," she's weak. If it's hyperbolic/multiple selves, she's *conflicted*.
      *   *The "Bargaining Household":* This is George Ainslie's "Picoeconomics." It's a serious theory. Future Self makes a deal (plan), Present Self breaks it for immediate gain.
      *   *Felt Experience:* Yes, the anguish is real. It's the pain of "Future Me" screaming at "Present Me." The betrayal is inter-temporal. She feels like she's betraying herself because she *is* betraying a different version of herself.
      *   *Concrete advice:* Show the shift in valuation. At night, the pottery dream is vivid, the job pain is abstract. In the morning, the job comfort is concrete, the pottery risk is terrifying.

  6.  **Formulate the Final Verdict:**
