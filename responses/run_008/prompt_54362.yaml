answer: |-
  1.  **Demarcation & Asymmetry (10 mins):** Establish falsification vs. verification. Frame Popper's intent as protecting science, not attacking it.
  2.  **Central Example: Lenski's LTEE (15 mins):** Contrast the logical core (fitness increases) with risky predictions (power-law trajectories).
  3.  **The Tautology & Metaphysics Claim (10 mins):** Analyze "survival of the fittest" as logical status, not empirical falsehood.
  4.  **The Retraction & Research Programme (10 mins):** Distinguish the testable theory from the metaphysical worldview.
  5.  **Diagnostic Question (5 mins):** Test grasp of hard core vs. auxiliary hypotheses.

  **The Example:** Use **Lenski's Long-Term Evolution Experiment (LTEE)**. Avoid peppered moths (overused) or giraffes (just-so). Lenski allows you to separate the *core mechanism* (variants with higher growth rates increase frequency—logically near-empty) from the *risky scaffolding* (fitness gains will follow a specific power-law curve over 50,000 generations). This demonstrates how a "metaphysical" core scaffolds genuinely predictive, falsifiable models. Do not get bogged down in genetic specifics; focus on the trajectory prediction.

  **Misconceptions:**
  *   **Biologists (Popper = Creationist/Illiterate):** Preempt this in **Step 1**. Emphasize Popper's respect for science; his critique was logical, not ideological.
  *   **Philosophers (Tautology = Crude):** Defuse in **Step 3**. Show that calling it a tautology isn't an insult but a classification of logical status. It explains *how* it functions, not that it's false.
  *   **Intermediate (Retraction = Erasure):** Defuse in **Step 4**. The retraction isn't a capitulation; it's a refinement distinguishing the *theory* (testable) from the *programme* (metaphysical).
  *   **Provocation:** Deliberately provoke the **Biologists** in **Step 2**. They believe falsifiability is settled intro-class knowledge. Challenge them to state exactly what observation would falsify the *core* mechanism versus an auxiliary hypothesis. Force them to feel the difficulty.

  **Refusals:**
  Openly refuse to cover **Popper's World 3/Neo-Lamarckian mind emergence** and **gene-centric debates (Dawkins vs. Gould)**. Flag this explicitly: "We are bracketing ontological and unit-of-selection debates to focus strictly on the *logical status* of the explanation. Those are vital, but they muddy the demarcation question." This frames the exclusion as methodological rigor, not evasion.

  **Diagnostic Question:**
  "If we discovered a complex lineage that demonstrably *failed* to adapt under intense, sustained selection pressure, would we reject natural selection (the hard core) or posit a previously unknown developmental constraint (an auxiliary hypothesis)?"

  *   **Correct grasp:** They recognize a Lakatosian move to protect the hard core by adjusting auxiliaries, illustrating the "research programme" status.
  *   **Failure:** They answer purely empirically without referencing the theoretical structure, or claim Darwinism would be immediately dead.
