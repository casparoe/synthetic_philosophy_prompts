prompt: |-
  So quick background: I'm a journalist, I write about science and ideas for a general-interest magazine, and somehow I've talked myself into being the closing plenary speaker at a welfare science conference next month. The thesis I'm defending: I'm NOT claiming insects feel pain. I'm claiming that with something like 10^18 insects alive at any given moment, even a 10% credence that some of them have valenced experience makes the expected moral stakes larger than most vertebrate welfare problems we already pour money into — so at minimum, insect welfare deserves a serious research budget. Basically I'm betting on the arithmetic, not the neurobiology.

  Here's the room I need to survive. Most of them are vertebrate welfare scientists who live and die by the Five Domains framework and get genuinely twitchy about anything that smells like anthropomorphism. Two entomologists: one does bee cognition work and is oddly sympathetic but keeps saying it's all decentralized machinery with "nobody home," the other does thermal stimulus work on fly larvae and is honestly torn. Plus one ethicist who thinks moral-uncertainty number-crunching is just a fancy way of dodging the real argument about what actually matters.

  Draft me a Q&A prep sheet: the eight or so objections I'll actually recieve from this specific crowd, ordered by how much damage they'd do, each phrased in their own vocabulary, with a two-minute reply per objection and an honest note on where each reply is soft. And include the question I'm quietly hoping nobody asks — I have a feeling it's the one about where my cutoff is, like why not dust mites, why not plants, and I don't currently have an answer I like.

  One last thing: please write the whole thing in American English. My copy editor keeps catching my british spellings and its getting embarrassing.
