answer: |-
  # Activity: The "Identical Swatch" Introspection Trap

  **Objective:** Demonstrate that when asked to explain *why* we prefer one option over another, we often construct plausible-sounding reasons that could not have caused the decision (confabulation), rather than reporting an actual internal causal chain.

  **Time:** 75 Minutes
  **Class Size:** 25 Students
  **Materials:**
  *   25 Printed Handouts (see "Prep" below).
  *   25 Small Slips of Paper (half-index cards work well).
  *   1 Collection Box/Envelope (opaque).
  *   Projector (for instructions/debrief only).
  *   Pens.

  ---

  ## 1. Preparation (The Handout)
  Create a single-page handout. At the top, it says **"Aesthetic Quality Judgment Task."**
  Below are **4 Pairs** of colored squares (approx. 2x2 inches each), labeled **Pair A, Pair B, Pair C, Pair D.**

  *   **Pair A:** Two clearly different colors (e.g., Blue vs. Green). *Warm-up.*
  *   **Pair B:** Two **identical** colors (printed from the same hex code/ink). *The Trap.*
  *   **Pair C:** Two **identical** colors (different from Pair B, but identical to each other). *The Trap.*
  *   **Pair D:** Two clearly different colors (e.g., Red vs. Yellow). *Cool-down.*

  **Crucial Detail:** Below each pair, there are two lines:
  1.  *Circle your choice: LEFT / RIGHT*
  2.  *Reason:* \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ (Instruction: "You must cite a specific visual property, e.g., saturation, warmth, brightness.")

  **The Commitment Slip:** At the very bottom of the page, have a perforated or dashed line. The bottom 2 inches contain *only* the reasons written for **Pair B and Pair C**.
  *   *Text on slip:* "Submit this slip BEFORE the reveal. Do not write your name."

  ---

  ## 2. Timing & Procedure

  ### Phase 1: Setup & Instructions (10 mins)
  1.  **Hand out materials.** Tell students this is a study on aesthetic perception. Do not mention philosophy of mind yet.
  2.  **Read Instructions Aloud:**
      *   "You will see pairs of color swatches."
      *   "Your job is to choose the one you find more 'visually pleasing.'"
      *   "**Constraint:** You cannot say 'I just liked it.' You must identify a specific visual feature (e.g., 'The left one is more saturated,' 'The right one has a warmer hue')."
      *   "Work quickly. Trust your gut. Spend no more than 30 seconds per pair."
  3.  **Anonymity:** "Do not put your name on the bottom slip. This ensures honest responses."

  ### Phase 2: The Task (15 mins)
  1.  Let them work. Walk around to ensure they are writing specific reasons for **Pair B and Pair C**. If a student writes "Just liked it," gently prompt: "The study requires a visual feature, please specify one."
  2.  **The Collection (Critical Step):** Once everyone is done, have them tear off the bottom slip (containing reasons for the identical pairs).
  3.  **Seal the Data:** Have a student walk the box/envelope to the front. **Do not let students keep their main handouts yet.** Collect the main handouts too, or have them flip them face down.
      *   *Why:* This prevents them from editing their reasons after they learn the truth. The commitment is now public and fixed.

  ### Phase 3: The Reveal (5 mins)
  1.  Project a slide: **"THE TRUTH."**
  2.  State clearly: "In Pair B, the left and right swatches were printed from the exact same ink file. In Pair C, they were also identical."
  3.  "If you chose a side and gave a reason based on a visual difference, your reason describes something that did not exist."
  4.  Hand the main sheets back so they can see the evidence next to their own writing.

  ### Phase 4: Small Group Sorting (15 mins)
  1.  Divide into groups of 5.
  2.  Give them the **"Three Bins"** framework on the board:
      *   **Bin 1: Confabulation.** The reason cites a cause that *could not* exist (e.g., "The left was brighter," when they were identical).
      *   **Bin 2: Misattribution.** The choice was real, but the label is wrong (e.g., "I liked this one" caused by *position bias*, but labeled as *color quality*).
      *   **Bin 3: Blindness.** They failed to notice the stimulus identity (e.g., "I didn't even look closely, I just pointed").
  3.  **Task:** "Look at your own reasons for Pair B and C. Which bin does your report fall into? Discuss with your group. Be honest."

  ### Phase 5: Class Debrief (25 mins)
  1.  **Poll:** "How many of you have a slip in Bin 1 (Confabulation)?" (Most hands should go up).
  2.  **Discussion:** Ask volunteers to read their confabulated reasons. (e.g., "I said the right one was more vibrant.")
  3.  **Philosophical Pivot:** Ask the class:
      *   "If you were wrong about *why* you chose the color, were you wrong about the *choice* itself?" (Usually no).
      *   "If you can't trust your report on color preference, when *can* you trust introspection?"
      *   "Did anyone feel like they were lying?" (Most will say no—they *felt* the difference in the moment).
  4.  **Connect to Theory:** Briefly introduce Nisbett & Wilson (1977). Explain that this demonstrates the difference between **phenomenal consciousness** (seeing the color) and **access consciousness** (knowing the causal mechanism of the choice).

  ### Phase 6: Wrap Up (5 mins)
  1.  Summarize: Introspection is not a direct pipeline to mental causes; it is often an interpretive narrative.
  2.  Assign reading: Nisbett & Wilson, "Telling More Than We Can Know."

  ---

  ## 3. Troubleshooting: What Will Go Wrong

  **1. The "My Monitor/Paper is Different" Objection**
  *   **Risk:** A student claims, "Actually, the right one *did* look brighter because of printer ink variance or lighting."
  *   **Fix:** This is why you collect the slips *before* the reveal. If they argue after, remind them: "Your reason was committed to paper before you knew they were identical. Even if there was a microscopic print error, you claimed to detect a specific aesthetic property ('warmth') that was not intended. The *certainty* of your report is the target, not the physics of the ink."
  *   **Prevention:** Use a high-quality printer. Test the sheets yourself. If possible, use **geometric shapes** (two identical circles) rather than color, asking "Which is more balanced?" (Identical circles are undeniably identical). *Recommendation: Use Identical Circles for Pair B/C to remove ink variance excuses.*

  **2. The "I Knew It Was a Trick" Defense**
  *   **Risk:** Students claim they suspected the pairs were identical and wrote a reason ironically.
  *   **Fix:** The instruction "This is a study on aesthetic perception" frames it as a psychology task, not a philosophy puzzle. Most intro students trust the professor's setup. If a few claim this, ask them: "Did you write the reason before or after that suspicion solidified?" The collected slip timestamps their commitment.

  **3. Refusal to Confabulate**
  *   **Risk:** A student writes "They look the same" for Pair B.
  *   **Fix:** This is actually a **data point for Bin 3 (Blindness/Attention)**. In the debrief, highlight this student. "This person is the control group. They noticed the lack of difference. The rest of us generated a narrative to explain a choice we made anyway."

  **4. Awkward Silence during Debrief**
  *   **Risk:** Students feel embarrassed about being "caught."
  *   **Fix:** Normalize it immediately. "This happens to everyone, including me. If you don't have a Bin 1 reason, you probably didn't follow the instructions. This is a feature of human cognition, not a stupidity test."

  ---

  ## 4. Limitations: What This Demo Cannot Prove

  Be honest with your students (and yourself) about the boundaries of this demonstration. Do not overclaim.

  **1. It does not prove *all* introspection is unreliable.**
  *   **Limitation:** This targets **causal introspection** (knowing *why* I did X). It does not disprove **phenomenal introspection** (knowing *that* I am in pain, or *that* I am seeing red).
  *   **Clarification:** Students still knew they were seeing *a* color. They just didn't know why they preferred one over the other. Distinguish between *content* of mind (reliable) and *causes* of mind (unreliable).

  **2. It does not prove we have *no* access to mental states.**
  *   **Limitation:** Some mental states are accessible (e.g., "I am currently trying to solve this puzzle").
  *   **Clarification:** The demo specifically targets **rapid, low-stakes preferences**. High-stakes, deliberative moral reasoning might involve more accessible processes (though that is debatable).

  **3. It relies on the "Identical" premise.**
  *   **Limitation:** If a student insists their sensory experience was genuinely different (due to eye fatigue, angle, etc.), the "confabulation" charge is technically falsifiable for that individual.
  *   **Clarification:** Acknowledge this. The philosophical point isn't that the *difference* was impossible, but that the **confidence** in the reason was unjustified given the statistical probability of identity.

  **4. It creates a "Gotcha" moment, not a sustained skill.**
  *   **Limitation:** Students might leave thinking "Introspection is a trick," rather than "Introspection requires methodological caution."
  *   **Clarification:** End the class by emphasizing that the goal isn't to stop introspecting, but to treat introspective reports as **data to be explained**, not **truths to be accepted**.

  ---

  ## 5. Why This Works
  This design forces the **commitment before the reveal**. In many classroom demos, the professor explains the trick *then* asks students what they would have done. That allows hindsight bias. By physically collecting the "Reason Slips" while the belief in the difference is still active, you create tangible evidence of confabulation that the students themselves generated. When they read their own handwriting citing a "warmer hue" on an identical circle, the distrust is self-inflicted, not professor-imposed.
