answer: |-
  Here is a framework of desiderata for resolving Thomson's Lamp, calibrated for an audience familiar with the literature. I have integrated your five proposed points into the structure, validating them where appropriate and refining their scope where necessary to ensure they function as rigorous constraints rather than mere intuitions.

  ### I. The Desiderata

  An adequate resolution must satisfy the following five conditions. Each includes the motivating case and the specific philosophical work it is required to do.

  **1. The Grounding Constraint (Non-Stipulation & Benacerraf)**
  *   **Requirement:** The resolution must specify the truth-maker for the proposition "The lamp is on/off at $t=1$." If it asserts a definite state, it must derive it from the supertask description or physical laws. If it denies a definite state, it must explain why the Principle of Bivalence fails or why the question is ill-posed without merely asserting "it is undefined."
  *   **Motivating Case:** Thomson's original argument concludes a contradiction ($L_1$ is on $\to$ off, off $\to$ on). Benacerraf's rebuttal notes the history $t < 1$ does not entail $t=1$. A resolution cannot simply pick a side (stipulation) nor simply repeat Benacerraf (rehearsal). It must explain the *modal status* of the final state.
  *   **Work:** Forces the theory to choose between logical indeterminacy, physical determination, or metaphysical impossibility.

  **2. The Representation Invariance Constraint (Parity)**
  *   **Requirement:** The logic of the resolution must hold regardless of the semantic labeling of the states. If the lamp toggles Red/Green, or Intact/Broken, the structural explanation for the final state (or lack thereof) must remain identical unless a relevant physical difference is introduced.
  *   **Motivating Case:** If a resolution claims the lamp is "Off" because "Off" is the resting state of a switch, it fails for a Red/Green light where neither is "rest." If it claims the state is indeterminate, it must explain why a "Broken" state (which might be physically reachable via wear) is treated differently than "On/Off" in the idealized case.
  *   **Work:** Prevents solutions that rely on equivocation between "logical states" and "physical default states."

  **3. The Supertask Demarcation Constraint (Neighbor Cases)**
  *   **Requirement:** The resolution must explicitly distinguish Thomson's Lamp from convergent supertasks (Zeno's Runner) and divergent physical supertasks (Pérez Laraudogoita's elastic collisions). It must explain why we accept a definite position for the runner at $t=1$ but resist it for the lamp, or vice versa.
  *   **Motivating Case:** In Zeno's paradox, the position function $x(t)$ is continuous; the limit exists. In Thomson's Lamp, the state function $S(t)$ is discontinuous; the limit does not exist. In collision supertasks, energy conservation appears violated if the supertask is allowed.
  *   **Work:** Ensures the solution isn't just a blanket rejection of all infinite series, but a precise diagnosis of *which* properties of the series matter (continuity vs. discreteness, energy vs. logic).

  **4. The Domain Integrity Constraint (Formal vs. Physical)**
  *   **Requirement:** The argument must remain within a single ontological domain. It must be either a critique of the *logical consistency* of the description (formal) or a critique of the *causal realizability* of the machine (physical). It cannot use physical impossibility (e.g., infinite speed) to solve a logical puzzle, nor use logical gaps to solve a physical engineering problem.
  *   **Motivating Case:** Many "resolutions" argue the lamp is impossible because no switch can toggle infinitely fast. This solves the physics but begs the question against the philosophical thought experiment, which assumes the history *did* occur. Conversely, treating the lamp as a pure mathematical function ignores why we care about "lamps" rather than "number sequences."
  *   **Work:** Prevents category errors that dissolve the puzzle by changing the subject.

  **5. The Causal Closure Constraint**
  *   **Requirement:** If the resolution posits a definite state at $t=1$, it must identify the causal mechanism or logical rule that fixes it. If the history $t<1$ is insufficient (per Benacerraf), what *else* fixes the state? Is it a boundary condition? A physical law of relaxation? A logical convention?
  *   **Motivating Case:** If we say the lamp is "Off" because switches spring back, we have introduced a new premise not in the original puzzle. If we say it is "On" by convention, we have stipulated. The resolution must account for the *source* of the final fact.
  *   **Work:** Forces the resolution to admit new premises or accept indeterminacy.

  ---

  ### II. Classification of Requirements

  **Non-Negotiable (Conditions of Adequacy)**
  *   **Domain Integrity (4):** Sliding between formal and physical is a logical fallacy. A resolution that commits this is invalid, not just unpopular.
  *   **Grounding Constraint (1):** A resolution that merely stipulates the answer is not a resolution; it is a fiat.
  *   **Supertask Demarcation (3):** If a theory cannot distinguish the Lamp from the Runner, it is too blunt to be useful. It must explain the limit behavior.

  **Camp Preferences (Dialectical Choices)**
  *   **Representation Invariance (2):** *Mostly* non-negotiable, but a physicalist might argue that "On/Off" implies a spring mechanism while "Red/Green" does not. However, for a *logical* resolution, this is non-negotiable. I will mark it as Non-Negotiable for the purpose of a *logical* paper, but note that physicalist resolutions may veto it.
  *   **Causal Closure (5):** This is the pivot point. A "Benacerrafian" (indeterminacy) camp will reject the demand that there *be* a causal closure. They will argue the requirement presupposes there is a fact to be grounded. However, to *resolve* the puzzle (rather than dissolve it), one usually needs to address where the fact would come from. I will mark this as **Contested**: it is non-negotiable for "Positive" resolutions (the lamp is X) but negotiable for "Negative" resolutions (there is no fact).

  ---

  ### III. The Incompatibility Theorem (Jointly Unsatisfiable Subset)

  There is a subset of these requirements that is **jointly unsatisfiable** under the standard interpretation of the puzzle. This is the most critical result for your paper to articulate.

  **The Trilemma:**
  1.  **Logical Supervenience:** The state at $t=1$ is logically determined by the complete history of states at $t < 1$ (implied by Grounding Constraint).
  2.  **Bivalence:** The lamp is determinately either On or Off at $t=1$ (implied by the goal of a "Resolution").
  3.  **The Description:** The history is exactly the infinite alternating sequence described by Thomson (implied by Domain Integrity).

  **The Conflict:**
  Benacerraf proved that (1) and (3) are incompatible. The sequence $1, 0, 1, 0 \dots$ has no limit. Therefore, the history does not entail the final state.
  *   If you keep **(1) and (3)**, you must drop **(2)**: The lamp has no definite state (Indeterminacy/Gap view).
  *   If you keep **(2) and (3)**, you must drop **(1)**: The state is not determined by the logical history, but by something external (e.g., Physics/Convention).
  *   If you keep **(1) and (2)**, you must drop **(3)**: The description is impossible; the supertask cannot be completed (Impossibility view).

  **Verdict:** You cannot satisfy the **Grounding Constraint** (deriving the state from the history), the **Domain Integrity** (keeping the description as is), and the demand for a **Definite Outcome** simultaneously. A resolution *must* sacrifice one. Most failed resolutions attempt to hold all three by equivocating on "determination."

  ---

  ### IV. The Field-Thinning Requirement

  The single requirement that does the most work to thin the field of candidate resolutions is **The Grounding Constraint (specifically the Benacerraf component)**.

  **Why:**
  *   It eliminates **Thomson's Original Argument:** Thomson assumed the state must be determined by the history, found a contradiction, and concluded impossibility. Benacerraf showed the history *doesn't* determine the state. Any resolution that ignores this gap is pre-Benacerraf and obsolete.
  *   It eliminates **Stipulative Resolutions:** Any paper that says "The lamp is Off because the last action was Off" (ignoring that there is no last action) fails the grounding test.
  *   It eliminates **Naive Physicalism:** Any paper that says "The lamp blows up" without explaining how that follows from the *logical* description (vs. adding new physical premises) fails to address the logical puzzle.

  This requirement forces the author to declare whether they are doing **Logic** (where the state is undefined), **Metaphysics** (where the supertask is impossible), or **Physics** (where the switch mechanics decide). It prevents the "fence-sitting" that characterizes much of the introductory literature.

  ---

  ### V. Scorecard of Stances

  **1. The Impossibility Stance (Supertasks are Metaphysically/Physically Impossible)**
  *   **Verdict:** Resolves the puzzle by denying premise (3) of the Trilemma.
  *   **Cost:** It changes the subject from "What happens at $t=1$?" to "Can we get to $t=1$?" It is a robust physical answer but often feels like a philosophical evasion of the logical puzzle. It satisfies Grounding by saying "No fact exists because no world exists."
  *   **Fit:** Satisfies Domain Integrity (Physical) and Grounding (by negation), but fails the spirit of the thought experiment which asks us to assume the history occurred.

  **2. The Indeterminacy Stance (Benacerrafian Gap)**
  *   **Verdict:** Resolves the puzzle by denying premise (2) of the Trilemma.
  *   **Cost:** It accepts that the description is logically consistent but incomplete. There is no fact of the matter.
  *   **Fit:** Satisfies Domain Integrity (Formal) and Logical Supervenience (by admitting failure). It is the standard "logical" resolution but leaves the causal intuition unsatisfied (why *can't* the world decide?).

  **3. The Empirical/Physicalist Stance (The Switch Decides)**
  *   **Verdict:** Resolves the puzzle by denying premise (1) of the Trilemma.
  *   **Cost:** It admits the logical description is insufficient and requires external physical laws (hysteresis, relaxation, quantum state) to fix the value.
  *   **Fit:** Satisfies Bivalence and Domain Integrity (Physical), but violates the idea that the puzzle is solvable *a priori*. It turns the puzzle into an engineering problem.

  **Recommendation:** For a paper promising to *resolve* rather than rehearse, you must explicitly choose which horn of the Trilemma to drop. The most novel ground lies in exploring the **Empirical Stance** rigorously: arguing that while the *logic* is indeterminate, the *causal closure* of the physical world forces a determinate state, thereby reclassifying the puzzle from a paradox of logic to a paradox of physical idealization.
