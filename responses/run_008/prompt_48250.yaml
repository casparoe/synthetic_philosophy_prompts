answer: |-
  **TO:** Animal Welfare Advisory Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Private-Label Shrimp Welfare Standards

  **Recommendation**
  I recommend we adopt the **middle path**: a funded pilot program with select suppliers implementing electrical stunning where feasible, paired with immediate welfare indicators for the harvesting process, and a committed review timeline (24 months). We should not mandate full stunning compliance immediately, nor should we hold off on intervention entirely.

  **Reasoning: Managing Uncertainty, Not Ignoring It**
  The objection that invertebrate welfare is "too speculative" relies on a false binary: either we know they feel pain like mammals, or we assume they feel nothing. This ignores risk management. Given the UK's inclusion of decapods in sentience legislation and emerging neurobiological evidence, the risk of causing significant suffering is non-zero.

  However, the "swimming insects" argument highlights a real constraint: our certainty is lower than it is for vertebrates. Mandating specific slaughter technology (electrical stunning) across our Southeast Asian warmwater supply chain today is premature. The tech is proven for coldwater species; efficacy for smaller warmwater shrimp is unverified. A mandate now risks forcing suppliers to install ineffective equipment simply to pass an audit. The pilot approach treats sentience uncertainty as a research question rather than a dogma, allowing us to validate efficacy before scaling costs.

  **The Structural Problem: Harvest vs. Slaughter**
  We must address the consultant's point: isolating "slaughter" is likely the wrong unit of intervention. In pond-draining systems, welfare degrades hours before death due to crowding, oxygen depletion, and stranding. Installing a stunner at the end of a stressful drain solves little.

  Our standard must therefore target the **harvest process**, not just the kill point. The pilot should measure water quality parameters and crowd density during draining, alongside stunning efficacy. If we only audit the stunner, we incentivize suppliers to stun animals that have already suffered extensively, creating a welfare wash.

  **Supply Chain Integrity**
  A hard mandate creates two risks: supplier dropout (shrinking supply) and audit gaming (checking boxes without compliance). To mitigate this:
  1.  **Cost Sharing:** The chain must co-fund the pilot equipment. Asking farmers to absorb R&D costs for unproven tech guarantees resistance or falsification.
  2.  **Outcome-Based Auditing:** Instead of verifying "stunner installed," auditors should verify behavioral indicators (e.g., lack of reflex movement prior to ice slurry) and water quality logs during harvest. This makes gaming harder because physical outcomes are harder to fake than equipment receipts.
  3.  **Phased Timeline:** Commit to a decision in 24 months. This gives suppliers certainty that a standard is coming, but time to adapt based on pilot data.

  **Communications Strategy**
  When customers ask why shrimp welfare lags behind chicken or salmon, we should not claim equivalence. The honest answer is: *"We apply the same ethical framework, but the science and technology are at different stages. With chickens, we know what suffering looks like and how to prevent it. With shrimp, we are currently funding the research to define that. We are acting on the precautionary principle while ensuring our solutions actually work."*

  This frames the gap as a commitment to effectiveness rather than indifference. It acknowledges the inconsistency without apologizing for the complexity. Pretending the issues are identical undermines credibility; admitting we are solving a harder technical problem builds trust.

  **Next Steps**
  At the next meeting, I propose we draft the RFP for the pilot program. We need to identify two suppliers willing to partner on data collection regarding drain-down welfare and stunning efficacy. We cannot wait for perfect science, but we must stop pretending the current method is acceptable. This path balances moral urgency with operational reality.

  Please review prior to our session on Tuesday.
