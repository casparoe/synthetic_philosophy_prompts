      *   **Lange/Lerner (Market Socialist):** Public ownership is compatible with efficiency if a Central Planning Board (CPB) simulates the market. Managers follow rules (minimize cost, set P=MC). The CPB adjusts prices via trial and error (tâtonnement) based on surpluses/shortages. Computation can handle the data.
      *   **Common Ground:** Both want efficiency (allocative/productive). Both acknowledge the complexity of an economy. Both agree the Soviet Union had severe inefficiencies (though might disagree on *why* or if it was inherent). Both agree prices convey information.
      *   **Key Disagreement:** Can the *process* of price discovery be simulated without private ownership of capital? Is the knowledge required for calculation objective/statistical or subjective/tacit? Is equilibrium solvable?

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Avoid Platitudes:* Instead of "markets are complex," say "prices function as signals regarding relative scarcity."
