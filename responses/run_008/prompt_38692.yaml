      *   *Key Insight 1: The Function of the Signifier.* A statue is a *monument* (look at me). A street name is a *coordinate* (use me). But both function as *sovereign markers*. Naming is an act of power. Keeping a name is an assertion of continuity. Changing it is an assertion of new sovereignty.
