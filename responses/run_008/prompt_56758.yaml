answer: |-
  The Nuremberg Tribunal presents one of the most fascinating case studies in legal philosophy because it sits precisely at the fault line between positivism and natural law. To defend the trials against the charge of *ex post facto* justice while maintaining rigorous procedure, the IMT (International Military Tribunal) implicitly adopted a **declaratory theory of customary international law**. This view posits that the London Charter did not *create* new law but rather *declared* existing norms that had crystallized through state practice and treaties (like Kellogg-Briand) into binding customary law. Under this theory, the criminality of aggressive war was inherent in the international order prior to 1945; the Charter was merely evidentiary, making the specific penalties prospective while the substantive prohibition was retrospective. This allowed the Tribunal to claim it was respecting *nullum crimen sine lege* (no crime without law) by arguing the "law" existed in the conscience of the civilized world, even if a penal statute did not.

  This practice strictly rules out **crude Realpolitik** (the idea that law is merely the command of the victor with no independent validity) and **strict statutory positivism** (the idea that only written domestic-style codes constitute law). If the Tribunal believed law was purely the sovereign's command, they would not have bothered with the Kellogg-Briand argument or the detailed judgments; they would have acknowledged they were exercising raw power. Conversely, if they were strict positivists, they would have admitted the retroactivity and accepted the injustice as a necessary evil. Instead, they insisted on legality, which means they needed a source of law deeper than the Charter itself. However, the practice is fully compatible with **Grotian internationalism** (law exists between states and binds individuals) and **moderate natural law** (certain acts are *malum in se* and punishable regardless of codification). It is also compatible with **Lon Fuller's "inner morality of law,"** which emphasizes procedural fairness (which Nuremberg largely observed) even if the substantive law is controversial.

  The internal tensions are significant. The most glaring is the friction between **procedural positivism and substantive customary law**: the Tribunal demanded written indictments, evidence logs, and cross-examination (positivist tools) to adjudicate crimes defined by unwritten global norms (naturalist/customary sources). Another tension lies in the **limitation of Crimes Against Humanity**: by restricting these charges to acts connected to the war (excluding pre-1939 persecution), the Tribunal revealed it felt constrained by jurisdictional legality, even while stretching the definition of "war crimes." They wanted to punish the Holocaust but felt they lacked the legal warrant to punish pre-war atrocities, showing a struggle between moral imperative and legal constraint.

  Regarding the asymmetry (no Allied defendants), this is best diagnosed as a **political fact layered atop the legal theory**, not a philosophical commitment. The jurisprudence of the Tribunal—individual criminal responsibility for aggressive war—logically applies to any head of state. The fact that it was not applied to the Allies was a function of the London Charter's creation by the victors, not a requirement of the legal theory itself. Judge Pal's dissent highlighted this inconsistency, but the majority opinion did not argue that *only* losers commit crimes against peace; they simply exercised jurisdiction only over the Axis.

  If the Allies had committed to a **strictly positivist view of legality**, the trials as conducted would have been impossible. A strict positivist would acknowledge that no prior statute criminalized "waging aggressive war" for individuals. Consequently, the Allies would have had to either **foregone judicial trials entirely** (opting for summary executive execution or political disarmament, acknowledging these were acts of power, not law) or **limited the charges strictly to conventional war crimes** (violations of Hague/Geneva conventions) that had clear prior statutory footing, dropping "Crimes Against Peace" and "Crimes Against Humanity" entirely.

