answer: |-
  In a cluster of top-tier corporate law firms, junior associates compete for a fixed number of partnership slots primarily by logging billable hours, creating a grim equilibrium where everyone works 3,000 hours annually despite severe diminishing returns on legal output past 2,000 hours. A feasible coordinated alternative exists: an industry-wide consortium enforcing a 2,000-hour cap while sharing recruitment data to maintain standards, which would statically preserve legal output while drastically reducing burnout. However, ex ante, the "wasteful" race yields higher total expected welfare for the associates because the grueling filter sustains the firms' elite brand prestige, commanding fee premiums that fund massive partner payouts, whereas the coordinated cap dilutes the talent pool, erodes the brand, and collapses the prize value to mediocrity. While the static snapshot shows the race burns resources for no extra immediate output, the dynamic reality ensures that only the race generates a prize large enough to justify the entry costs, making the trap the superior gamble for risk-neutral entrants calculating lifetime expected value.

  **Constraint Satisfaction:**
  1.  **Dominance & Enforcement:** Given that peers bill 3,000 hours, billing 2,000 guarantees dismissal (strictly dominated); no binding contract can prevent this because antitrust laws forbid labor cartels among firms, and individual firms cannot unilaterally cap hours without losing talent to competitors.
  2.  **Static Pareto Inferiority:** In a one-shot static model (holding firm reputation constant), the 3,000-hour equilibrium is Pareto-inferior to the 2,000-hour cap because the marginal legal output of the extra 1,000 hours is negligible compared to the utility loss from burnout; the cap saves costs for the same product.
  3.  **Ex Ante Welfare:** The trap wins on expected welfare because the prize value is not fixed; the race maintains the "elite" status that makes the partnership worth $20M rather than $1M. The expected value of a 10% chance at $20M (minus high effort cost) exceeds the expected value of a 50% chance at $1M (minus low effort cost) for the cohort as a whole.
  4.  **Local Validity:** Each additional hour billed is locally rational; at the margin, the increased probability of promotion outweighs the marginal disutility of work, so no actor is mistaken or knowingly sacrificing.

  **The Feature Doing the Work:**
  The single feature is **Endogenous Prize Value**. In the standard Moloch picture, the prize (e.g., market share, survival) is fixed, so racing only dissipates rent. Here, the intensity of the race *creates* the value of the prize by signaling quality to the market. If you remove this feature—assuming firm prestige is independent of associate effort—the scenario collapses into an ordinary wasteful race where coordination is strictly superior both statically and ex ante.

  **Strongest Objection:**
  A committed Moloch theorist would argue that the **metric was mis-specified**: if the hours function as a necessary quality signal, they are not "waste" but "investment," meaning the static model incorrectly labeled productive effort as wasteful consumption. This objection fails because it begs the question against the definition of a trap. A trap requires that the activity be locally rational but globally inefficient *relative to a feasible alternative*. The feasible alternative (the consortium) could theoretically use direct testing rather than hours to measure quality; the fact that the race relies on *costly signaling* rather than *direct measurement* confirms the waste is real, even if that waste is instrumentally necessary to sustain the prize value in the absence of perfect information. The objection tries to dissolve the trap by redefining the waste as productivity, but the waste remains in the form of unproductive hours that could be replaced by cheaper screening mechanisms if coordination allowed them.

  Verdict: Endogenous Prize Value
