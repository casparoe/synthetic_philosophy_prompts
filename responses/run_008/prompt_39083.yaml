answer: |-
  Here is a sequence of five question pairs (ten questions total) designed to start with the speaker's preferred terminology and gradually tighten the constraints. They are ordered to move from general metaphors to specific technical hurdles.

  ### Topic 1: The "Bookkeeping" Metaphor (Warm-up)
  *Goal: Establish the terms of the debate without being aggressive, but flag the ontological cost early.*

  **1.** You've described the quantum state as a "bookkeeping device" rather than a description of reality. I want to make sure I understand the scope of that metaphor: when you say it's bookkeeping, are you saying it tracks something real that exists independently of the agent, or is the ledger itself the only thing that exists?

  **2.** *(Follow-up)* If the ledger is the only thing that exists, I'm struggling to see why the rules of bookkeeping are so rigid. In my own accounting, I can choose to track expenses by week or by month depending on what's useful. Why is the quantum bookkeeper not allowed that same flexibility in how they categorize the system?

  ### Topic 2: The PBR Theorem
  *Goal: Force them to address the ontological overlap problem and the cost of denying preparation independence.*

  **3.** Moving to the PBR theorem from 2012: the result seems to suggest that if distinct quantum states correspond to overlapping distributions of underlying physical states, you end up predicting measurement outcomes that contradict standard quantum mechanics. How does your epistemic view accommodate that result without conceding that the wavefunction must be ontic?

  **4.** *(Follow-up)* I anticipate you might deny the "preparation independence" assumption—that two systems prepared separately have independent underlying states. But if I prepare an electron in one lab and you prepare one in another, and we've never interacted, doesn't denying that independence require a bizarrely fine-tuned conspiracy between our pieces of lab equipment? How do we rule out that kind of global coordination without assuming it away by fiat?

  ### Topic 3: Bell's Theorem and Correlations
  *Goal: Pin down what ontology is doing the work if the wavefunction isn't.*

  **5.** If the wavefunction isn't a real thing transmitting influence, we still have to account for the violation of Bell inequalities. Something has to ground those correlations between spacelike separated measurements. In your view, what is the ontological residue that carries that correlation if it isn't the psi-state itself?

  **6.** *(Follow-up)* **If they say Retrocausality:** Does that retrocausality allow for signaling to the past, or is it constrained? If it's constrained, what mechanism enforces that constraint without reintroducing a real state?
  **If they say Superdeterminism:** If the measurement settings are correlated with the source, doesn't that undermine the assumption of independent variables required to do experimental science at all?
  **If they say Many Worlds/Relational:** If facts are relative to branches or observers, how do we recover the single, definite outcome I see on my detector screen without smuggling in an absolute perspective?

  ### Topic 4: Wigner's Friend and Intersubjectivity
  *Goal: Challenge the stability of scientific consensus under agent-relative views.*

  **7.** In a Wigner's Friend scenario, if quantum states are just agent-relative credences, it seems perfectly consistent for the Friend and Wigner to assign different states to the same system. When we actually do physics in the lab, though, we achieve intersubjective agreement very reliably. How does your framework explain that convergence?

  **8.** *(Follow-up)* Is that agreement a guaranteed feature of the formalism, or is it just a lucky regularity of the world we happen to live in? If it's just a lucky regularity, doesn't that make the objectivity of scientific data contingent in a way that should make us nervous about the reliability of our measurements?

  ### Topic 5: The Normativity of the Born Rule
  *Goal: Distinguish quantum "bookkeeping" from mundane bookkeeping via betting behavior.*

  **9.** Finally, I'd like to ask about the Born rule. If squaring the amplitude is just part of how I organize my beliefs about a system, why is that the *only* way to organize them? Why does nature care about the specific mathematical structure of my credences?

  **10.** *(Follow-up)* To put it more sharply: if I violate the rules of my calendar, I might miss a meeting, but I don't lose money in a way that is mathematically guaranteed. If I violate the Born rule, I get Dutch-booked. Why does this specific "bookkeeping device" have normative teeth that my other bookkeeping devices lack? Is there a fact of the matter I'm missing, or is the universe just punishing me for bad arithmetic?
