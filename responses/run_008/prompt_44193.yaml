      *   *Refining the "Semantic" part:* The third friend thinks it's verbal. I need to identify *which* part is verbal. Usually, it's whether "moral facts" are defined by their role (functionalism) or their ontology. If defined by role, realism might be trivially true. If by ontology, it's hard. I will highlight this distinction.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Cruxes" section has the specific "Argument," "Realist Prediction," "Anti-Realist Prediction" structure requested.

  *(Self-Correction during drafting)*: Wait, the prompt asks for "what kind of case or argument both sides would agree bears on it." I need to make sure I don't just list their views, but identify the *evidence type* they agree is relevant. E.g., for Access, both agree that a causal story would help, but disagree on its possibility.

  Let's assemble the document.

  *Structure:*
  1. Preamble (Purpose).
  2. Section I: Shared Commitments (The "Agreed Claims").
  3. Section II: Map of Disagreement (The Table).
  4. Section III: Critical Cruxes (Arguments, Evidence, Predictions).
  5. Section IV: The Verbal Dispute Hypothesis.
  6. Section V: Note on Experimental Data (Knobe/etc.).

  *Key nuance:* Ensure the Error Theorist isn't forced to admit moral truths in Section I. Phrase it as "First-order moral agreement" vs "Meta-ethical disagreement."

  *Knobe Effect:* Be careful. It shows moral judgment affects intentionality ascription. Realists might say "See, morality is central." Anti-Realists say "See, morality biases cognition." It doesn't settle ontology. I will reflect this limited utility.

  *Third Friend:* Make sure their point about semantics gets a dedicated section validating their intuition without dismissing the substantive remainder.

  Okay, ready to write.s
answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: THE STATUS OF MORAL DISCOURSE

  **Date:** October 26, 2023
  **Participants:** [Realist], [Anti-Realist/Error Theorist], [Semantic Deflater]
  **Purpose:** To isolate substantive metaphysical disagreements from verbal disputes and shared practical commitments regarding moral realism.

  ---

  ## I. SHARED COMMITMENTS (AGREED CLAIMS)

  *The following claims are endorsed by all participants. Signing this indicates agreement on the starting conditions of the debate, not resolution of the metaphysical status of morality.*

  1.  **First-Order Normative Agreement:** Regardless of the metaphysical status of moral properties, all participants share a practical commitment to the proposition that genocide and cruelty-for-fun are impermissible. We agree to act, speak, and reason as though these acts are forbidden, even if we disagree on *why* (e.g., because they violate mind-independent facts vs. because they violate our deepest contingent commitments).
  2.  **Psychological Hybridity:** We agree that moral judgments exhibit features of both cognitive states (beliefs that can be true/false, subject to logic) and non-cognitive states (attitudes that motivate action, involve emotion). Any viable meta-ethical theory must account for this dual nature (e.g., via ecumenical expressivism, hybrid theories, or robust cognitivism).
  3.  **Etiological Neutrality:** We agree that human moral beliefs have evolutionary and cultural causes. The existence of these causes is compatible with both realism (evolution tracked moral truths) and anti-realism (evolution shaped useful fictions). The mere existence of an evolutionary explanation does not, in itself, settle the metaphysical debate.
  4.  **Disagreement Does Not Entail Error:** We agree that persistent disagreement in a domain does not prove the absence of truth in that domain. (Analogy: Persistent historical disagreement about the shape of the earth did not entail there was no fact of the matter).
  5.  **Definition of the Core Dispute:** We agree that the central metaphysical question is **Stance-Independence**. The dispute is not about whether we *have* moral beliefs, but whether the truth-conditions of those beliefs depend on the attitudes, conventions, or responses of human agents.
      *   *Realist:* Truth-conditions are largely stance-independent.
      *   *Anti-Realist:* Truth-conditions are stance-dependent or non-existent.

  ---

  ## II. MAP OF DISAGREEMENT

  *The following table articulates the remaining disagreements. Each side has vetted the opposing column to ensure it is not a caricature.*

  | Feature | Moral Realism (Participant A) | Error Theory / Anti-Realism (Participant B) | Semantic Deflation (Participant C) |
  | :--- | :--- | :--- | :--- |
  | **Semantic Content** | Moral sentences express propositions that aim to describe reality. | Moral sentences express propositions that aim to describe reality. | Moral sentences function primarily to coordinate attitudes, not describe reality. |
  | **Truth Value** | Some moral propositions are objectively true. | Most/all positive moral propositions are systematically false (as they posit non-existent properties). | "Truth" in morality is deflated; it means "warranted assertibility" within a framework, not correspondence. |
  | **Ontology** | There exist normative properties/facts that do not reduce to natural properties. | There are no such properties. The world contains only natural facts. | Ontology is the wrong category; we should look at use, not reference. |
  | **Motivation** | Moral beliefs motivate because we care about the truth (or via internalism). | Moral beliefs motivate because of contingent desires + false belief, or via error. | Moral judgments *are* expressions of conative states, hence they motivate by nature. |
  | **The "Queerness"** | Normative properties are distinct but supervene on natural properties. | Normative properties would be "queer" (metaphysically strange); therefore, they don't exist. | Properties aren't "queer" if we stop treating them as natural-world objects. |

  ---

  ## III. CRITICAL CRUXES

  *For each crux, we identify the specific argument, the type of evidence both sides agree is relevant, and the divergent predictions each side makes.*

  ### Crux 1: The Debunking Challenge & Self-Undermining
  * **The Argument:** The Anti-Realist argues that evolutionary debunking shows our moral beliefs are caused by fitness, not truth. The Realist counters that the norms of reasoning required to make the debunking argument are themselves normative, so debunking morality undermines epistemology (Self-Undermining).
  * **Agreed Relevant Evidence:** Analysis of the relationship between *epistemic* norms (what we ought to believe) and *moral* norms (what we ought to do). Whether epistemic norms can be cashed out in purely instrumental/pragmatic terms without moral loading.
  * **Realist Prediction:** If you press the Anti-Realist on *why* we should accept their debunking argument, they must appeal to a normative force (e.g., "you *ought* to follow the evidence") that is structurally identical to the moral "ought" they deny. They cannot escape normativity.
  * **Anti-Realist Prediction:** Epistemic norms are hypothetical imperatives (e.g., "If you want true beliefs, do X"). They do not require robust, stance-independent authority. One can consistently reject moral normativity while retaining instrumental rationality.

  ### Crux 2: The Access Problem (Mystery vs. Intuition)
  * **The Argument:** The Anti-Realist argues that if moral facts are non-natural, we have no causal mechanism to detect them (Benacerraf-style problem). The Realist argues that we access them via rational reflection/intuition, similar to mathematics or logic.
  * **Agreed Relevant Evidence:** Comparative epistemology. We look at other domains of "necessary truth" (math, logic) to see if they suffer the same access problem and how they resolve it.
  * **Realist Prediction:** A coherent story can be told where moral facts supervene on natural facts, and our capacity for reflective equilibrium allows us to "detect" this supervenience relation without causal contact. The "mystery" is no greater than that of logical entailment.
  * **Anti-Realist Prediction:** Mathematical objects are posited to explain empirical phenomena (science uses math). Moral facts do no explanatory work in our best scientific theories. Therefore, positing them is gratuitous. If moral facts existed, they should have explanatory power regarding human behavior independent of our beliefs about them.

  ### Crux 3: Phenomenology & Companions in Guilt
  * **The Argument:** The Realist argues that moral experience *feels* like perceiving objective facts (phenomenology). The Anti-Realist argues this is a projection (like disgust feeling like a property of the food). The "Companions in Guilt" move suggests that if we reject moral facts due to queerness/phenomenology, we must also reject other contested domains (e.g., modality, color, reasons).
  * **Agreed Relevant Evidence:** Phenomenological reports and cross-domain consistency. Do we treat modality or color as "real" in the same way we treat morality?
  * **Realist Prediction:** If the Anti-Realist denies moral facts based on phenomenological error, they must also deny facts about "reasons for action" or "logical necessity," leading to global skepticism. To avoid skepticism, they must accept morality.
  * **Anti-Realist Prediction:** We can be error theorists about morality while being realists about modality because modality is required for science, whereas morality is not. The phenomenology of "objectivity" is a useful evolutionary illusion for cooperation, distinct from the phenomenology of logical necessity.

  ---

  ## IV. THE VERBAL DISPUTE HYPOTHESIS

  *Addressed to Participant C (The Semantic Friend).*

  We acknowledge that a portion of our disagreement is verbal, specifically regarding the definition of **"Fact"** and **"Property."**

  1.  **The Verbal Component:**
      *   If "moral fact" is defined functionally (i.e., "whatever plays the role of guiding action and coordinating society"), then Realism is trivially true, and the Anti-Realist is merely objecting to a specific *ontological* picture.
      *   If "moral fact" is defined ontologically (i.e., "a mind-independent feature of the universe akin to mass or charge"), then Anti-Realism is the default position, and the Realist is positing a "spooky" addition.
      *   **Resolution:** We agree that much of the heat in the debate comes from sliding between these definitions. We will henceforth distinguish **Functional Realism** (which we may all accept) from **Robust Ontological Realism** (which is the actual point of contention).

  2.  **The Substantive Remainder:**
      *   Even after clarifying terms, a substantive disagreement remains: **Would moral truths hold if no sentient beings existed?**
      *   *Realist:* Yes (e.g., "Suffering is bad" would still be true).
      *   *Anti-Realist:* No (without beings to care, there is no badness).
      *   *Semantic Deflater:* The question is ill-formed (there is no "truth" outside of a linguistic framework).
      *   *Verdict:* This remainder is not verbal. It is a genuine metaphysical divergence.

  ---

  ## V. NOTE ON EXPERIMENTAL PHILOSOPHY (KNOBE EFFECT)

  *Addressing the request regarding folk intuitions.*

  We reviewed data regarding the Knobe Effect (where moral valence influences ascriptions of intentionality).

  *   **Consensus:** This data demonstrates that moral cognition is deeply intertwined with descriptive cognition. We do not reason about "facts" and "values" in separate modules.
  *   **Limitation:** This data **does not** settle the metaphysical dispute.
      *   *Realist Interpretation:* Moral truth is so central to human cognition that it shapes how we perceive agency.
      *   *Anti-Realist Interpretation:* Moral attitudes are so emotionally potent that they bias our descriptive reasoning (a bug, not a feature).
  *   **Decision:** We agree to cite this data only as evidence regarding the *psychology* of moral judgment (Claim I.2), not as evidence for the *truth* of moral realism. It bears on how we judge, not on what is the case.

  ---

  **Signatures:**

  _________________________ (Realist)

  _________________________ (Anti-Realist)

  _________________________ (Semantic Deflater)
