      *   **Outside Knowledge:** Someone will say "But cards are random." I need to stipulate "In this universe, cards are deterministic."
      *   **Skepticism:** Someone might refuse to play along.
      *   **Time:** 90 mins is tight. Keep instructions crisp.
      *   **The "So What?":** Chemists need things to work. Philosophers need things to be justified. Bridge that gap.

