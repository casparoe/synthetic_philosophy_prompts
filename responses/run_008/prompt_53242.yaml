      *   Closed loop? Yes (Instrument certifies Standard, Standard certifies Instrument).
      *   Definite stance? Yes (Defective).
      *   Predict pitfalls? Yes (Outside knowledge, rushing).
      *   Limitations? Yes (Can't simulate the *psychology* of belief).
      *   Chemist background respected? Yes (Use calibration terminology).

