          *   **The Loop:** They need to verify the Gauge. They ask the Facilitator. The Facilitator says, "Check the Logbook." The Logbook says, "Gauge said X, Sample was X." Who wrote the Logbook? The Gauge Operator.
          *   *Let's make it more physical.*
          *   **Activity Name:** The Calibration Loop.
          *   **Props:** 3 Decks of Cards (Red/Black), Pennies, Envelopes.
          *   **Roles:** Lab Techs (Participants), Lab Director (Facilitator), The Instrument (A specific rule).
