      *   *Wait, one nuance:* If the instrument *is* reliable, does the bootstrapping make it knowledge? Reliabilists say yes. Contextualists say it depends.
      *   *My Definite Position:* **It is defective.** Why? Because it fails the "Safety" condition. In nearby possible worlds where the instrument is faulty, you still believe it's reliable (because the standard is faulty too). Therefore, it's not knowledge.

