      *   **Topic:** Bootstrapping / Easy Knowledge (Cohen, Vogel, etc.). The problem: Can I confirm an instrument's reliability using only the instrument itself?
      *   **Goal:** Design a 90-minute hands-on activity ("lab") where participants try to certify an instrument's reliability but discover the validation loop is closed (circular).
      *   **Constraints:**
          *   Must use available materials (whiteboards, envelopes, pennies, deck of cards).
          *   No real money (chocolate bars okay).
          *   *Crucial:* Take a definite stance in the debrief (no "on the one hand..." hedging). Defend whether bootstrapping is defective or not.
          *   Predict potential pitfalls (e.g., outside knowledge).
          *   Acknowledge limitations of the simulation.
      *   **Tone:** Professional, respectful of their scientific background, philosophically rigorous but accessible.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Bootstrapping Problem (Cohen 2002):* If I trust my gas gauge, I can form beliefs about the fuel level. If I check the gauge against the fuel level repeatedly, I confirm the gauge is reliable. But I used the gauge to check the fuel level. So I've confirmed reliability without independent evidence.
      *   *The Core Tension:* Internalism vs. Externalism, Closure Principle, No-Defeater conditions.
      *   *The Chemist's Angle:* Calibration chains. NIST traces to SI units. But what traces the SI units? Ultimately, convention or "brute fact."
      *   *The Activity:* Needs to simulate a closed system where $A$ validates $B$, but $B$ is the only source of info about $A$.

  3.  **Designing the Activity ("The Closed Loop Lab"):**
      *   *Setup:* Need an "Instrument" and "Samples."
      *   *Instrument:* A deck of cards is good. Let's make it specific. Red = Full, Black = Empty. Or better, a "Reader" (a person or a rule) who looks at a hidden card and announces a value. Let's use a sealed envelope system to mimic the "black box" of an instrument.
      *   *The Trap:* The participants need to verify the instrument. To do so, they need "Ground Truth." But the Ground Truth must be delivered *by* the instrument or something dependent on it.
