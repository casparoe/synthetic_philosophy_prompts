      *   *My Choice:* I will argue **Bootstrapping is Defective for *Acquiring* Knowledge, but Valid for *Maintaining* it.** (A nuanced but definite position). Or better: **Bootstrapping fails to generate *new* justification.** It can confirm coherence, but not truth-tracking.
