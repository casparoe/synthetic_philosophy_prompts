          *   *Wait, that's too transparent.*
          *   *Better:* The Facilitator (Me/User) acts as the "World." The Participants are the "Lab."
          *   They have a "Gauge" (a specific rule known only to the Facilitator, or a physical device). Let's use a deck of cards.
          *   *The Twist:* The "Reference Standard" is derived from the Gauge.
          *   *Scenario:* You have a "Detector" (a specific card drawn from a shuffled deck). You have "Samples" (other cards).
          *   *Rule:* The Detector matches the Sample if they are the same color.
          *   *Task:* Determine if the Detector is Reliable (i.e., does it always match the Sample?).
          *   *Problem:* To check if they match, you look at the Detector and the Sample. But you only know the Sample's value *because* the Detector tells you? No, that's confusing.
          *   *Let's try the "Envelope Oracle" approach.*
          *   **The Setup:** 12 Participants. Divide into 3 Teams of 4.
          *   **The Instrument:** A sealed envelope labeled "GAUGE." Inside is a instruction: "Declare the content of Sample Envelopes to be X."
          *   **The Samples:** 5 Sealed Envelopes labeled "SAMPLE 1-5."
