      *   *Okay, I'll embed the dependency in the "Chain of Custody" form.*
      *   Form says: "Standard ID #001. Calibrated by: Instrument X."
      *   They are testing Instrument X.
      *   They have to read the form to validate the Standard.
      *   If they read the form, they see the loop.
      *   *The Challenge:* They are rushed. They focus on the data match, not the metadata.
