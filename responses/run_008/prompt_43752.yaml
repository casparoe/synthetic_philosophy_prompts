answer: |-
  Elena, a senior copy editor finalizing a legal contract under deadline pressure, halts at clause 14b, inserts a semicolon, and flags the sentence for revision based on a syntactic rule involving subordinate clauses. Ten minutes later, she explains to a junior colleague exactly why the semicolon was necessary, citing the specific grammatical structure, and the next morning she recalls the specific clause without re-reading. Yet, when asked what the sentence looked like, Elena insists sincerely that while she was looking at the screen, the words carried no visual phenomenology; she describes the moment as "phenomenally empty," claiming she manipulated the syntax directly without any "what-it-was-like" to see the text, despite her behavior indicating full informational access.

  **Global Workspace Theorist:** Since the syntactic information was broadcast globally—evidenced by her ability to report it, reason about it, and store it in long-term memory—the content won the workspace competition. On the view that global availability is sufficient for phenomenality, Elena *was* phenomenally conscious; her sincere denial is merely a meta-cognitive error or a misdescription of subtle cognitive phenomenology.

  **Block-Style Disentangler:** Elena demonstrates that access consciousness (availability for reasoning and report) can come apart from phenomenal consciousness (subjective feel). The functional role is fully present, but the qualitative character is absent, proving the distinction is not merely verbal but tracks distinct natural kinds.

  **Single Feature:** The **stable dissociation between robust third-person evidence of global broadcast and sincere first-person denial of qualitative character.**

  **Workspace Attack:** The theorist will argue that first-person reports are fallible indicators of consciousness, whereas functional broadcast is constitutive; thus, Elena is wrong about her own experience, likely conflating "lack of sensory vividness" with "lack of phenomenality."

  **Removal Consequence:** If the sincere denial is removed (she admits she saw it), the case collapses into standard consciousness; if the global access is removed (she cannot explain the rule), it collapses into blindsight. The explanatory work depends entirely on the tension between these two vectors.
