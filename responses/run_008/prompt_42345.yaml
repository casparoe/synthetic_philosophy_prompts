      *   *Check:* Did I address the medieval connection? *Yes, acknowledge the debt but emphasize the synthesis Newton achieved.*
      *   *Check:* Is the Shapin quote context clear? *Yes, explain that he meant it wasn't a unified conscious movement by the actors.*
