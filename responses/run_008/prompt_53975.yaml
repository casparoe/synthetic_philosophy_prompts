  ### The Results (Read this out loud)

  **If you scored highest on View 1: The "Choices Are On You" View**
  You believe fairness is about distinguishing between bad luck and bad choices. If someone is hurt by a storm, you help them. If they are hurt by a bet they took, you let them handle it. You worry that helping people with their bad choices rewards recklessness and punishes the responsible.
  *   **Your Gambler Take:** You likely picked A or B. You feel the gambler's loss is a consequence he owns.

  **If you scored highest on View 2: The "Everybody Has Enough" View**
  You believe fairness is about a threshold. Below the line (no food, no shelter), society steps in. Above the line, people keep what they earn. You don't mind if some people are super rich, as long as no one is destitute. You get annoyed when people argue about luxury items instead of basics.

  **If you scored highest on View 3: The "Help The Worst Off" View**
  You believe fairness is about who is suffering the most. It doesn't matter if they smoked, gambled, or were born sick. If they are at the bottom, they get help first. You think asking "whose fault is it?" is just a way to delay helping people who are hurting.

  **If you scored highest on View 4: The "Equal Status" View**
  You believe fairness is about relationships. We need to be able to look each other in the eye as equals. That means no one gets left to die in the parking lot (Q7), and no one is forced to sell their health for money (Q10). You aren't trying to make everyone equal in wealth, just equal in dignity and standing.

  **If you scored highest on View 5: The "Total Wellbeing" View**
  You believe "fairness" is a fuzzy word. The real goal is to make the world have the most happiness and the least pain overall. Sometimes that means helping the smoker (if he survives longer), sometimes it means helping the rich guy (if it grows the economy). You look at the math, not the morality.

