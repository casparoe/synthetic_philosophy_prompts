  ### The "What's Actually Fair?" BBQ Quiz

  **Instructions:** Read each scenario and pick the answer that feels most right to you. Don't overthink it—go with your gut.

  **1. The Smoker and the Transplant**
  A man smoked for 40 years despite warnings. Now he needs a lung transplant. A non-smoker also needs one. There is only one lung available.
  *   **A.** The smoker goes to the back of the line. He chose the risk, so he bears the cost.
  *   **B.** They draw straws. They both need a lung to live, and we don't judge who deserves to breathe.
  *   **C.** Give it to whoever has the best chance of surviving the longest, regardless of how they got sick.

  **2. The Gambler (The Important One)**
  A guy bets his life savings on a risky hand of cards and loses. He is now destitute.
  *   **A.** He knew the risks, so whatever happens to him is his problem. We shouldn't interfere.
  *   **B.** He knew the risks, took the shot anyway, and THAT'S what makes it fair when he loses. It wouldn't be right to bail him out.
  *   **C.** He's broke and suffering now. We should help him get back on his feet.

  **3. The Bank Collapse**
  A woman saves carefully for 40 years. The bank collapses due to fraud she couldn't see. She loses everything.
  *   **A.** Help her immediately. She didn't choose this bad luck, unlike the gambler.
  *   **B.** Help her, because she is in the same terrible spot as the gambler, regardless of how she got there.
  *   **C.** Help her only if paying her back prevents the whole economy from crashing.

  **4. The Happy Artist**
  Your cousin deliberately chose a fun, low-paying career as a painter. He loves his life but can't afford rent.
  *   **A.** Don't help him financially. He traded money for fun, so he can't complain about being poor.
  *   **B.** Help him only enough so he has food and shelter. Past that, his choices are his own.
  *   **C.** Help him. He is poor, and being poor is the problem we need to fix, not his career choice.

  **5. The Expensive Taste**
  You are happy with cheap beer. Your friend is only happy with expensive wine. You both have the same income.
  *   **A.** Give your friend more money. Fairness means you should both be equally happy, even if his happiness costs more.
  *   **B.** Don't give him extra. He chose to like expensive things; you shouldn't be taxed to pay for his wine.
  *   **C.** Make sure you both have enough for basics. If he wants wine after that, that's on him.

  **6. The Money Lesson**
  A guy is poor partly because his parents never taught him how to budget or save. He's trying, but he's bad with money.
  *   **A.** Help him. Not knowing about money isn't his fault; it's bad luck he was born to those parents.
  *   **B.** Help him. He is behind everyone else, and we need to bring him up to speed so he isn't left out.
  *   **C.** Help him. He is struggling, and that's the only thing that matters.

  **7. The Parking Lot Emergency**
  Priya's point: Two people collapse in the parking lot. One had a heart attack (natural), one overdosed (choice).
  *   **A.** Treat them exactly the same. In an emergency, we don't cut anyone off from care.
  *   **B.** Treat the heart attack victim first. The overdoser chose a dangerous path.
  *   **C.** Treat whoever is easier to save first so we don't waste resources.

  **8. The Surplus**
  A tech CEO has made 100 million dollars. She has more than enough to live like a queen forever.
  *   **A.** Tax the extra heavily. That money would do more good helping the worst-off people.
  *   **B.** Leave it alone. She has enough, and past that point, I don't care how much richer she gets than others.
  *   **C.** Tax it only if the tax revenue creates more total happiness for the community than if she kept it.

  **9. The Inheritance**
  A lazy person inherits a mansion. A hardworking person rents an apartment.
  *   **A.** Let them keep it. They didn't choose their parents, so it's bad luck for the renter, but we don't punish the heir.
  *   **B.** Tax the mansion heavily. It's unfair for one person to start so far ahead through no effort of their own.
  *   **C.** Don't tax it. As long as the renter has a decent place to live, the heir's mansion doesn't hurt anyone.

  **10. The Dangerous Job**
  Workers take a dangerous job cleaning toxic waste because it pays double. One gets sick.
  *   **A.** The company must pay. The worker didn't truly choose the sickness, just the money.
  *   **B.** The worker knew the risk when they took the double pay. That's the deal they made.
  *   **C.** Society should pay. No one should have to sell their health for money, even if they agreed to it.

