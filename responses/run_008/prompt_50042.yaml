prompt: |-
  I've been reading about Molyneux's problem, and it seems to me that it was settled empirically a long time ago: Cheselden's patient in the 1720s couldn't tell a sphere from a cube by sight alone right after his cataracts were removed, and a 2011 study of formerly congenitally blind children in India found the same thing — near-chance performance on matching a seen shape to a felt one before training, decent performance after. Since we now know the answer is no, why do philosophers keep writing about the question as though it were still open? Is the remaining dispute just about the timeline (how quickly the ability appears once someone can see), or is it about the worry that the experimental subjects aren't ideal Molyneux cases — e.g., that they may have had some residual light perception or prior low vision, so the studies don't quite test the thought experiment? I'd like a clear account of what, if anything, is genuinely still at issue, as distinct from what the experiments settled. Please also indicate how confident you are in each of your claims and identify the single point in your answer you're least sure of.
