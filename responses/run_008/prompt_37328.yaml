answer: |-
  # Dissertation Proposal: The Diachronic Structure of Conventionality

  **Working Title:** Origin vs. Maintenance: A Diachronic Defense of Lewisian Conventionalism Against the Normativity Objection

  ## 1. Research Question
  Does distinguishing between the *arbitrariness of origin* (historical contingency) and the *arbitrariness of maintenance* (synchronic substitutability) allow a Lewisian account of convention to accommodate robust social norms, or does this distinction collapse under the requirement that conventions must remain coordination equilibria at the time of action?

  **Note on Neutrality:** This question does not presuppose that the distinction is valid or that it solves the problem. It allows for the conclusion that the distinction is spurious, or that even if real, it fails to save Lewis's account because Lewis's definition requires synchronic arbitrariness.

  ## 2. Context and Motivation
  The standard debate regarding David Lewis's *Convention* centers on whether his game-theoretic model (coordination equilibrium + common knowledge + arbitrariness) can explain social norms.

  *   **The Skeptical Position (Your Friend's View):** Lewis's account captures "etiquette" (which side of the road to drive on) but fails for "norms" (promise-keeping, fairness). Once norms are entrenched, they are supported by sanctions, internalization, and moral reasons. The alternative regularities are no longer "just as good." Therefore, the arbitrariness condition fails, and the norm is no longer a convention in Lewis's sense.
  *   **The Extensionist Position:** Many theorists attempt to save Lewis by adding evolutionary dynamics or signaling games. They argue that norms *emerge* from coordination problems. However, they often gloss over whether the *current* state of the norm retains the specific structural properties Lewis required (specifically, that agents prefer to conform *only* because others do).
  *   **The Gap:** Both sides tend to treat convention as a synchronic state. The proposal here is that the debate stalls because it ignores the temporal dimension of arbitrariness. If a norm is arbitrary in origin but non-arbitrary in maintenance, does it retain the label "convention"? If yes, Lewis's account needs a diachronic amendment. If no, the Skeptical Position wins, but for a more specific reason than usually given.

  ## 3. Methodology and Timeline
  The project is primarily conceptual analysis supported by comparative case studies. The goal is to test whether the two types of arbitrariness come apart in practice and whether that separation matters for the definition of convention.

  **Fall Semester (Conceptual Groundwork & Literature)**
  *   **Month 1:** Exegesis of Lewis's conditions. Focus specifically on the "Arbitrariness" clause. Does Lewis explicitly require the alternative to be viable *now*, or just that it *could have been* the convention?
  *   **Month 2:** Mapping the "Norms Objection." Survey arguments claiming norms lack arbitrariness due to moral content or enforcement mechanisms.
  *   **Month 3:** Formalizing the distinction. Define *Origin-Arbitrariness* (contingent historical selection) and *Maintenance-Arbitrariness* (current indifference between equilibria). Develop criteria for identifying each.

  **Winter Break / Early Spring (Case Studies)**
  *   **Month 4:** *Low-Stakes Conventions.* Analyze discursive traffic norms (e.g., right-of-way at unmarked intersections). Does enforcement (honking, social glare) remove maintenance-arbitrariness?
  *   **Month 5:** *High-Stakes Norms.* Analyze promise-keeping. Is the alternative (breaking promises) a viable equilibrium *now*, or only *historically*? Does the existence of guilt/sanctions make the alternative strictly worse, violating Lewis's coordination condition?
  *   **Month 6:** *Linguistic Meaning.* Lewis's primary application. Has the meaning of words become non-arbitrary due to entrenchment? (e.g., Could we switch "cat" and "dog" tomorrow? No. Could we have 500 years ago? Yes.)

  **Spring Semester (Writing)**
  *   **Month 7:** Drafting the positive argument. If the distinction holds, how does it modify Lewis's definition?
  *   **Month 8:** Drafting the objections. Incorporate the "Change My Mind" scenarios (see below).
  *   **Month 9:** Revision and final polish.

  ## 4. Possible Outcomes
  *   **Positive Result:** The distinction holds. We find cases where Origin-Arbitrariness is high but Maintenance-Arbitrariness is low. This suggests Lewis's definition should be amended to a "Genetic Conventionalism": a norm is a convention if it *originated* as a coordination equilibrium, even if it has since evolved into a norm with enforcement.
  *   **Negative Result (Distinction Collapses):** We find that Origin-Arbitrariness inevitably leaves a trace that ensures Maintenance-Arbitrariness (e.g., if the alternative was truly viable historically, it remains viable now absent external sanctions).
  *   **Negative Result (Lewis Incompatibility):** The distinction is real, but Lewis's account *requires* Maintenance-Arbitrariness. If a norm loses this, it ceases to be a convention and becomes a "coercive rule" or "moral law." In this case, your friend is right: Lewis cannot account for robust norms, and the distinction merely clarifies *when* a convention stops being a convention.

  ## 5. Failure Conditions and Scope Creep
  *   **Scope Creep:** The project becomes unmanageable if it attempts to solve the "Normativity of Logic" or provide a full meta-ethical account of moral obligations. The scope must remain strictly on whether Lewis's *definition* can be stretched, not whether norms are actually moral.
  *   **Spurious Distinction:** The project fails if "Origin-Arbitrariness" turns out to be just "Path Dependence" without philosophical bite. If the only difference is "it happened in the past" vs "it is happening now," without a change in the *reasons for action*, the distinction is merely historical, not conceptual.
  *   **Definition Drift:** If the argument requires changing Lewis's definition so much that it no longer resembles a coordination equilibrium, the project fails to defend Lewis and instead proposes a new theory. This is a valid outcome, but it must be acknowledged as such, not sold as a rescue of Lewis.

  ## 6. "Change My Mind" (Weak Links & Counter-Arguments)
  You mentioned you came out of the argument too pleased with yourself. Here are the specific points where your framework is most vulnerable. If your friend can successfully make these points, you should abandon the thesis.

  **A. The Synchronic Requirement (The Strongest Objection)**
  Lewis defines convention as a *current* regularity. Condition 3 of his definition states agents prefer to conform *given that others conform*. If sanctions/guilt make the alternative *worse* (not just equal), it is no longer a coordination equilibrium; it may be a Prisoner's Dilemma or an Assurance Game with altered payoffs.
  *   *The Kill Shot:* If Lewis requires the alternative to be a *live option* now, your "Maintenance-Arbitrariness" condition is not optional. If norms lack it, they aren't conventions. Your distinction doesn't save Lewis; it just proves norms aren't conventions.
  *   *Check:* Look closely at Lewis's text. Does he allow for "entrenched" conventions where the alternative is now costly? If he explicitly rules this out, your thesis is dead on arrival.

  **B. Existing Distinctions (Reinventing the Wheel)**
  You need to verify you aren't just renaming an existing distinction.
  *   **Path Dependence:** In economics and institutionalism, this is the standard account of how arbitrary origins lead to locked-in outcomes. If your "Origin vs. Maintenance" is just "Path Dependence," you need to find the *philosophical* work it does that the economic description doesn't.
  *   **Constitutive vs. Regulative Rules:** (Searle/Hume). Regulative rules govern antecedent activity (etiquette); constitutive rules create the activity (promising). Your friend's examples (promises) might fail Lewis's test not because of time, but because they are constitutive.
  *   **Genealogy vs. Justification:** Nietzsche/Foucault/Williams. The idea that the *origin* of a norm is contingent but its *current justification* is robust is a standard move in genealogical critique. You need to ensure you are making a point about *conventionality*, not just moral genealogy.

  **C. The "Reason for Action" Problem**
  Lewis's account explains *why* we act: we act because we expect others to act.
  *   *The Weak Link:* In your "Maintenance" phase, if sanctions/guilt are doing the work, agents might conform *even if they expect others to defect*. (e.g., I keep promises even if I think everyone else will break them, because I don't want to feel guilty).
  *   *The Friend's Counter:* If the reason for action shifts from "coordination" to "avoiding guilt/moral duty," the Lewisian mechanism is broken. The *source* of the normativity has changed. Splitting arbitrariness doesn't fix the fact that the *motivation* is no longer Lewisian.
  *   *Test:* Can you find a case where people follow a norm *solely* because it's entrenched (Maintenance), without any internalization or sanction fear? If not, the "Maintenance" phase isn't Lewisian convention anymore.

  ## 7. Immediate Next Steps
  1.  **Textual Check:** Re-read Lewis's definition of "Arbitrariness." Does it imply a counterfactual about the *present* ("R' would work just as well now") or the *past* ("R' could have been chosen")? This determines the viability of the whole project.
  2.  **Literature Search:** Look up "Path Dependence in Social Norms" and "Diachronic Conventionalism." If these terms yield a settled debate, adjust the angle to focus specifically on the *normativity* implication rather than the emergence.
  3.  **Friend's Challenge:** Ask your friend specifically: "If a norm originates as a coordination equilibrium but evolves so that defection is now costly (not just uncoordinated), do you deny it was *ever* a convention, or do you deny it *is* one now?" Their answer will tell you if they are attacking the genealogy or the current status.
