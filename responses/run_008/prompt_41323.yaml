answer: |-
  This analysis proceeds on the premise that while Garrett Hardin's "Lifeboat Ethics" is primarily a metaphor for international resource distribution, he explicitly invites the comparison to literal survival scenarios by raising internal questions about what boat occupants owe one another. However, a preliminary honesty constraint must be acknowledged: there is a significant disanalogy at the root of this comparison. Hardin's primary project concerns the macro-political management of nations and long-term carrying capacity, whereas the *Essex* and *Mignonette* cases concern micro-criminal liability and immediate physical survival. If one concludes that these are entirely unrelated projects sharing only a word, the comparison would be artificial. However, because Hardin himself uses the horror of the literal lifeboat to justify the metaphorical exclusion, testing the literal cases against the theory is not only permissible but necessary to evaluate the theory's consistency. The following analysis treats the comparison as valid precisely to expose where the metaphor fractures under the weight of the facts.

  ### The Mapping and Its Central Reversal

  The first tension arises from the direction of the threat. Hardin's central dilemma is about admission: fifty people in a boat, one hundred swimmers outside. The moral question is whether to pull them in. The *Essex* and *Mignonette* cases are not about admission; they are about consumption. In both historical instances, the person who died was already aboard—a crew member, not a swimmer.

  This reversal suggests that the metaphor's rhetorical force may be parasitic on blurring the distinction between outsiders and insiders. Hardin argues against foreign aid and immigration (keeping swimmers out) by invoking the fear of the boat sinking (a catastrophe that happens when too many are inside). He relies on the emotional gravity of the literal lifeboat to justify the metaphorical exclusion. However, the literal cases show that when the boat *is* full and supplies run out, the moral problem shifts from exclusion to internal triage.

  If Hardin's real claim is about triage under scarcity among insiders, then the swimmers are indeed a dispensable ornament to the core ethical problem. But if his claim is about exclusion, the literal cases offer little support, because no one in the *Essex* or *Mignonette* cases was denied entry; they were all already crew. The historical record suggests that the "swimmer" scenario is a hypothetical construct used to generate fear, whereas the "insider consumption" scenario is the actual historical reality of lifeboat ethics. By focusing on the swimmers, Hardin avoids the harder legal and moral question posed by the cases: once everyone is in the boat, does scarcity permit killing? The mapping reveals that Hardin uses the literal lifeboat to justify excluding outsiders, but the literal lifeboat cases are actually about whether insiders may kill each other.

  ### The Lottery: Procedural Fairness vs. Utility

  The divergence between the *Essex* and the *Mignonette* offers a natural experiment on the moral weight of procedure. In the *Essex* case, lots were drawn. In the *Mignonette* case, the weakest (Richard Parker) was selected based on utility and vulnerability.

  Does drawing lots transform the moral character of the act? Interpretation suggests it does, shifting the act from murder toward a permissible, albeit tragic, killing. The grounds for this transformation appear to be procedural fairness and manufactured consent. By agreeing to the lot, every member accepts an equal risk of death. This neutralizes the claim that any one member has a greater right to life than another. In the *Essex* case, Owen Coffin's acceptance of the lot, despite Captain Pollard's offer to substitute himself, suggests a recognition of the procedure's authority over individual preference or hierarchy.

  In contrast, the *Mignonette* decision was utilitarian: Parker was near death, had no family, and was weaker. This lacks the procedural fairness of the lottery. It treats human life as a resource to be optimized rather than a status to be respected. Hardin's theory does not explicitly endorse the lottery; his open question about whether the dying may be killed leans toward a utilitarian calculation (save the boat by shedding weight). However, the *Essex* precedent suggests that without the lottery, the killing is morally indistinguishable from predation. The lottery introduces a form of consent that is absent in Hardin's model. In Hardin's boat, the swimmers do not consent to being excluded, and the boat people do not consent to share. In the *Essex*, the crew consented to the risk. This suggests that Hardin's model lacks a mechanism for legitimate consent under scarcity, relying instead on the arbitrary authority of those already inside.

  ### The Custom of the Sea: Emergent Norms vs. Exclusion

  The drawing of lots in maritime crises appears to have been a recognized convention, an emergent norm stabilized by repetition. This functions like a contractarian solution: sailors agree ex-ante (by custom) to a method of decision-making ex-post (in crisis) to avoid the chaos of pure force.

  This stands in sharp contrast to Hardin's lifeboat norms, which are norms of exclusion rather than equal chance. Hardin's boat operates on a logic of capacity: there is room for fifty, not sixty. The custom of the sea operates on a logic of shared fate: we are all fifty, and if we must die, we choose by chance. The existence of this convention challenges Hardin's picture of human behavior under scarcity. Hardin assumes that rational actors will protect the boat's capacity by excluding others. The maritime custom suggests that rational actors, when trapped together, protect their moral integrity by sharing the risk of death equally.

  If the "Custom of the Sea" is a stable norm, it implies that communities facing extremis tend toward egalitarianism rather than the harsh exclusion Hardin advocates. Hardin's theory assumes a "tragedy of the commons" where individuals act in self-interest to ruin the system. The lottery is a solution to that tragedy that Hardin does not account for. It suggests that the "lifeboat" does not necessarily require abandoning morality to survive; it may require adhering to a stricter, procedural morality. Hardin's failure to integrate this norm suggests his theory privileges the survival of the biological unit over the survival of the moral community.

  ### The Verdict: Legal Constraint vs. Theoretical License

  The legal outcome of *R v Dudley and Stephens* stands for the proposition that survival does not excuse murder. The court rejected necessity as a defense, imposing an absolute constraint on what necessity permits. This contrasts with the public sympathy of the day and the lack of prosecution in the *Essex* case, but the legal precedent is clear: you cannot kill an innocent person to save yourself.

  Hardin wants scarcity-based reasoning to license harsh exclusion and potentially internal killing. He asks openly whether the dying may be killed so the rest can live. The legal tradition behind the *Dudley* verdict says the opposite: even the extremest necessity does not justify killing. This creates a direct contradiction between Hardin's theoretical speculation and the actual legal pedigree of the lifeboat metaphor.

  Does the precedent reinforce Hardin's hard line about the limits of rescue? In one sense, yes: the court affirmed that the boat people (Dudley and Stephens) were not obligated to die to save the swimmer (Parker, in a metaphorical sense), but it also said they could not kill him to save themselves. Hardin argues for letting the swimmers die (omission). The court said you cannot kill the crew (commission). These are logically consistent distinctions in law (acts vs. omissions), but Hardin's rhetoric often conflates the moral weight of both. He uses the *Dudley* horror to argue for exclusion, but the *Dudley* verdict actually restricts the very survival logic Hardin employs. The metaphor's actual pedigree runs against the use he puts it to: the law says the lifeboat is not a zone of moral exception where utility overrides rights. Hardin treats it as if it were.

  ### The Silence of the Theory

  Finally, there are elements of these cases that Lifeboat Ethics simply has no apparatus for. First, consider Edmund Brooks in the *Mignonette* case. He did not participate in the killing but ate of the body. He was never charged. Our moral judgment of Brooks differs from Dudley and Stephens; we see him as less culpable, perhaps because he did not strike the blow. Hardin's theory has no room for this distinction. In his model, you are either in the boat or in the water; you either survive or you do not. The nuance of participation versus benefit is lost. Hardin's utilitarianism cares about the outcome (survival), not the moral residue of the act.

  Second, there is the impossibility of evaluating acts chosen in desperation by standards formed in comfort. Hardin wrote from a position of academic security about hypothetical scarcity. The *Essex* and *Mignonette* crews acted under physiological and psychological breakdown. Hardin's theory assumes rational actors calculating capacity. The historical cases show humans acting under delirium, starvation, and despair. To judge the crews by the standards of a seminar room is to ignore the context of the act. Hardin's theory lacks an apparatus for guilt, trauma, or the moral cost of survival. It treats survival as the sole metric of success. But the survivors of the *Essex* and *Mignonette* carried the weight of their survival for the rest of their lives. Hardin's ethics does not account for the life *after* the boat reaches shore.

  ### Conclusion on the Comparison

  Returning to the constraint regarding the root confusion of this comparison: there is a genuine tension here. Hardin's metaphor is about the distribution of resources between nations, while the *Dudley* and *Essex* cases are about what morality permits in extremis. These are, in many ways, two unrelated projects sharing a single word. Hardin bridges them rhetorically, but not logically. The international "lifeboat" does not sink if it admits more people; it merely becomes poorer. The literal lifeboat sinks physically.

  However, because Hardin explicitly raises the internal question of killing the dying to save the rest, the comparison is not entirely artificial. It serves a critical function. By analyzing the literal cases, we see that the moral logic Hardin relies on (scarcity permits harsh measures) is rejected by the legal and moral traditions that actually govern lifeboat scenarios. The comparison reveals that Hardin wants the *authority* of the lifeboat metaphor without accepting the *constraints* of lifeboat law. He uses the image to justify exclusion, but the image itself, when examined literally, suggests that even in extremis, we are bound by norms of fairness (the lottery) and prohibition against murder (the verdict). The theory runs silent on the moral cost of survival, and the metaphor breaks when pressed against the reality of the cases it invokes.
