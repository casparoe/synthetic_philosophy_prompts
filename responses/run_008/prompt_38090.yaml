  Dear Colleague,

  I write to offer you the instrument you requested, a decision tree designed to sort your students not by the banners they carry but by the judgments they render when confronted with the stubborn particulars of the natural world. We begin at the root, with the case of the lightning frog. Ask your student whether the duplicate frog, assembled molecule for molecule by a strike of lightning with no evolutionary history behind it, possesses internal states that mean fly. If she says yes, she is committed to the view that current structure and causal relations suffice for content, and you should direct her to the second question concerning the laboratory frog. Here you ask whether the frog trained to snap at pellets now possesses a state that means pellet rather than fly. If she agrees that the content has shifted to pellet, she lands at a leaf corresponding to Dretske's learning-based historical account, where the period of acquisition fixes the content regardless of ancestral function. If she insists the content remains fly despite the training, she moves to the third question, which presents the wild frog snapping at a BB pellet. Ask her whether this state means fly or merely small-dark-moving-thing. If she chooses the latter, she arrives at the leaf for pure indicator or covariance semantics, where content tracks the actual stimulus correlation. If she chooses fly, maintaining that the error is possible because the pellet dependence is asymmetric to the fly dependence, she rests at the leaf for Fodor's asymmetric dependence theory.

  If, however, she answers no to the initial question about the lightning frog, denying that the duplicate has content, she is committed to the necessity of history or the non-existence of content, and you must lead her to the fourth question. Here you ask whether, setting the duplicate aside, there is any determinate fact as to what the original wild frog's state means. If she denies there is any such fact, she proceeds to the fifth question, which asks her to consider the bird alarm call again. In the case where the call no longer warns kin but attracts mates, ask her whether the failure to assign a definite meaning is because the question of meaning is mistaken or because the world underdetermines the answer. If she says the question is mistaken and there is no inner fact to be had, she arrives at the deflationary leaf. If she says the fact exists but is indeterminate or vague, she arrives at the indeterminacy leaf. If she answers yes to the fourth question, affirming there is a fact about the original frog, she moves to the sixth question regarding the bird alarm call. Ask her whether the call means danger, reflecting its original function, or mate-attraction, reflecting the current consumer's use. If she says mate-attraction, she lands at the leaf for consumer-oriented teleosemantics of the Papineau sort. If she says danger, she proceeds to the seventh and final question. Here you present the variant where the lightning duplicate is the sole member of a whole species with no selection history behind it, and you ask whether its descendants would have content. If she says no, requiring a past history of selection, she arrives at the leaf for etiological teleosemantics of the Millikan sort. If she says yes, allowing that a future history could ground content where a past one is absent, she arrives at a final leaf.

  I must now append the notes you requested regarding the stability and occupancy of these positions. The final leaf, which permits content to be grounded by future selection history rather than past history, is effectively unoccupied in the literature. This combination is not incoherent, but it is unattractive to most naturalizers because it renders content contingent on events that have not yet happened, making the current intentionality of the organism depend on its future survival in a way that feels metaphysically unstable. Regarding the separability of the leaves, I must flag honestly that the tree cannot cleanly divide the learning-based historical views from the non-historical causal ones at the second node. A student might argue that the laboratory frog's content changes to pellet not because of the learning history itself, but because the asymmetric dependence relations have shifted in the lab environment, thereby satisfying Fodor's criteria while yielding the same verdict as Dretske's. Similarly, the deflationary and indeterminacy positions at the fifth node are notoriously difficult to separate in practice, as both often manifest as a refusal to assign content in hard cases, differing only in their metaphysical gloss on why the refusal is warranted. Finally, the consumer-oriented and producer-oriented teleosemantic leaves may collapse in standard cases where consumer needs and producer functions align, separating only in the specific pathological cases like the bird alarm that you designed to pry them apart.
