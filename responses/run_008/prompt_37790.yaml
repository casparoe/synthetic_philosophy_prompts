answer: |-
  This is a classic formulation of the **Inefficacy Objection** to individual consequentialism, often associated with debates surrounding Derek Parfit's *Reasons and Persons* and later work by Chris Kutz and others on complicity. Your economist has constructed a very tight trap: she is using the tools of consequentialism (outcomes, counterfactuals, expected utility) to show that consequentialism cannot condemn individual acts in collective harm scenarios.

  You are right to feel stuck. The argument is valid; if you accept all the premises, the conclusion follows. To escape, you must reject a premise or an inference. Since you want to keep the spirit of (1) (agency matters) but cannot accept the conclusion (the tenth marksman is innocent), you are facing a conflict between **Counterfactual Dependence** and **Moral Complicity**.

  Here is an analysis of where the argument fails, the costs of the escape routes, and specifically how to handle the "twins" (the marksman and the steak).

  ### 1. The Diagnosis: Where the Argument Breaks

  The argument's strongest link is between (1) and (4). If (1) is true (wrongness requires counterfactual difference), and (3) is true (no difference is made), then (4) follows. The "work" is being done by **Premise 1** and **Premise 5**.

  *   **Premise 1 (The Counterfactual Principle):** This is the most vulnerable point. It asserts that *only* actual consequences matter.
  *   **Premise 5 (The Equivalence Claim):** This asserts that the Steak Case (probabilistic threshold) and the Marksman Case (determinate overdetermination) are morally identical regarding counterfactuals.

  Your economist is betting that you will refuse to give up (1) because it protects individual agency, but she forces you to accept (4) by using (5) to make the cost of (1) too high (acquitting the marksman).

  ### 2. Can You Split the Cases? (Addressing Premise 5)

  You asked whether the marksman and the steak must be answered in the same breath. **The answer is no.** There is a principled way to split them, but it requires nuance regarding *uncertainty*.

  **The Distinction: Epistemic vs. Metaphysical Certainty**
  *   **The Marksman Case:** By hypothesis, this is a case of *determinate overdetermination*. We know *ex post* that the victim was already doomed by the other nine. The counterfactual "If Marksman 10 hadn't fired, the victim would have lived" is **false**.
  *   **The Steak Case:** This is a case of *probabilistic thresholds*. We do not know *ex ante* where the threshold lies. We do not know if this specific purchase triggers the order for another slaughtered animal. The counterfactual "If I hadn't bought this steak, the animal would have lived" has a non-zero probability of being **true**.

  **The Escape Route:**
  You can argue that Premise 3 fails for the Steak Case but holds for the Marksman Case.
  *   In the **Steak Case**, moral decision-making must track **Expected Utility**, not just actual outcomes. Even if the probability of making a difference is $1/1,000,000$, if the harm is massive (a life of suffering), the expected disutility is significant. Rational agents act on expectations, not omniscient hindsight.
  *   In the **Marksman Case**, the probability is not just low; it is stipulated as **zero**. Expected utility calculations yield zero.

  **The Cost:**
  If you split them this way, you save the Steak Case (you are responsible because you imposed a *risk*), but you **lose the Marksman Case**. If you stick strictly to consequences and expectations, the tenth marksman *did* nothing wrong, because he imposed no additional risk (the risk was already 100%) and caused no additional harm.

  Since you said you "cannot live with acquitting the tenth marksman," splitting the cases via Expected Utility is not enough. To condemn the marksman, you must attack Premise 1.

  ### 3. The Expensive Move: Giving Up Premise 1

  To condemn the tenth marksman, you must abandon the strict claim that an act is wrong *only if* it makes a counterfactual difference to the outcome. This is the "expensive" move you feared, but it is the only one that saves your intuition about the firing squad.

  **The Alternative: Complicity or Participation**
  You can replace Premise 1 with a **Participation Principle**: *An act can be wrong in virtue of its relation to a harmful outcome, even if it does not causally determine that outcome, provided it is intended to contribute to that outcome.*

  *   **Why it looked hard to give up:** Premise 1 is attractive because it protects us from "moral luck." It ensures that what makes my act wrong is under my control (my causal contribution). If we drop it, we risk blaming people for things that happened anyway.
  *   **Why it's necessary:** In the firing squad, the wrongness of the tenth marksman lies in his **intent** and his **membership in a lethal group**, not in the physics of the bullets. He is guilty of *attempted murder* joined with *successful murder*.

  **The Cost:**
  This moves you away from pure Act Consequentialism toward a hybrid view (perhaps Deontological or Virtue Ethical). You are no longer grounding wrongness *solely* in "what happens," but in "what I am doing" (joining a harmful practice).
  *   *Benefit:* You condemn the marksman and the steak-buyer.
  *   *Cost:* You admit that consequences are not the *only* thing that matters. Intentions and participation matter independently of causal efficacy.

  ### 4. The "Modal Slide" (Between 3 and 4)

  You suspected a modal slide between "almost certainly" and "makes no difference." You are correct.
  *   **Premise 3** relies on probability ("almost certainly," "expected effect").
  *   **Premise 4** concludes on certainty ("no individual contribution... is wrong").

  In the Steak Case, the economist conflates **Low Probability** with **Zero Probability**.
  *   **Correction:** Even if the probability is tiny, it is not zero. Therefore, the Expected Utility is not zero.
  *   **Her Defense:** She says "for all practical purposes."
  *   **Your Rebuttal:** Morality is not "practical purposes." If I play Russian Roulette with a million-chamber gun, the probability of killing you is minuscule. But it is still morally forbidden. The *imposition of risk* is the wrong-making feature, not the *actualization of harm*.

  This allows you to condemn the steak-buyer without abandoning consequentialism entirely (by shifting to **Expected Consequentialism**). However, remember: this still does not save the tenth marksman, where the probability *is* zero.

  ### 5. The Determinism Red Herring (Premise 6)

  Premise 6 is a distraction. The economist is using a hard incompatibilist view of determinism to force a dilemma: "Either accept my argument or accept that nothing is ever wrong."
  *   **The Fix:** Most contemporary philosophers are **Compatibilists**. They argue that counterfactual dependence ("If I hadn't done X, Y wouldn't have happened") can be true even in a deterministic world, provided we hold the laws of nature and past fixed appropriately.
  *   **Advice:** Do not let her trade on a controversial metaphysical claim to win an ethical argument. You can reject (6) without accepting her "austerity." But note: solving determinism doesn't solve the overdetermination problem (the marksman).

  ### Summary of Recommendations

  You want to know which premise to give up. Here is the hierarchy of costs:

  1.  **Lowest Cost (Save the Steak, Lose the Marksman):** Reject the inference from (3) to (4). Argue that **Expected Utility** matters, not just actual outcomes.
      *   *Result:* Buying the steak is wrong (because it risks triggering a threshold). The tenth marksman is innocent (because he risked nothing; the victim was already doomed).
      *   *Verdict:* You said you can't accept this.

  2.  **Medium Cost (Save Both, Modify Consequentialism):** Reject **Premise 1**. Adopt a **Complicity/Participation** model.
      *   *Result:* Both acts are wrong. The steak-buyer is wrong because they participate in a harmful system (and risk thresholds). The marksman is wrong because he intends to kill and joins a lethal collective, regardless of causal overdetermination.
      *   *Verdict:* This is the most robust ethical position. It requires admitting that "making a difference" is not the *only* source of wrongness. **This is the premise you should give up.**

  3.  **Highest Cost (Accept the Argument):** Accept the "austerity."
      *   *Result:* No individual is responsible for climate change or firing squads unless they are the sole cause.
      *   *Verdict:* Moral nihilism regarding collective action. Unacceptable.

  ### How to Reply to Your Group

  Tell the economist this:

  > "I accept that counterfactual dependence is a *sufficient* condition for responsibility, but I deny it is *necessary*. Your argument works perfectly for a purely outcome-based ontology, but it fails to capture **agency**.
  >
  > Regarding the **Steak**: You conflate 'low probability' with 'no difference.' Under Expected Utility, the tiny probability of triggering a threshold multiplied by the massive harm yields a significant expected disutility. I am responsible for the *risk*, not just the *result*.
  >
  > Regarding the **Marksman**: Here, the probability is zero. Expected Utility cannot save him. To condemn him, we must admit that **joining a harmful intention** is itself a wrong-making feature, independent of causal output. If you insist on Premise 1, you must acquit the marksman. Since that is absurd, Premise 1 must be relaxed. We are responsible for what we *join*, not just what we *cause*."

  **The Split:** You can split the cases on **Risk** (Steak = Risk Imposition; Marksman = No Risk). But to condemn *both*, you must split the theory from **Pure Consequentialism** to **Complicity**. The economist has foreclosed this split by insisting on (1), but (1) is the premise that fails to capture the full scope of moral responsibility.
