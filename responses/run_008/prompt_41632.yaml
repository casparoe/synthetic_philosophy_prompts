prompt: |-
  I'm a PhD student in development economics, and I do part-time evaluation work for a small effective-giving nonprofit that advises individual donors on global health and development interventions. Most of the time it's plain cost-effectiveness stuff, DALYs averted per dollar, the usual. But lately we keep getting proposals where the intervention plausibly changes the size and identity of future populations, not just the welfare of a fixed set of people: child survival programs (fewer deaths, but plausibly fertility responses that change total births), voluntary family planning programs, lead remediation that might shift parental decisions, etc. I did some reading in population ethics on my own — Parfit's repugnant conclusion, total vs. average views, person-affecting constraints — and I get why there's no settled answer, but that doesn't help me write our evaluation guidelines.

  Please turn whatever population axiology actually has to offer into a decision procedure our eval team can run on a proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure defaults to reporting rankings conditional on axiological views rather than one number, and where it has to hand the decision to our board because the question is one of values rather than facts. It has to be honest about the fact that, e.g., a totalist will score some of these interventions very differently than an averagist or a person-affecting theorist, and it should tell us whether our donor-facing writeups should ever present view-conditional rankings or whether that just confuses everyone.

  Then run it on three proposals:

  1. A child survival program (vaccination plus neonatal care) in a setting where the best evidence suggests a fairly complete fertility response — fewer deaths lead to fewer subsequent births over a generation, the classic quantity-quality substitution — so the population effect mostly washes out but not entirely.
  2. A voluntary family planning program in a region with high unmet need for contraception, where the direct effect is people having the number of children they say they want rather than more. For the record, our board loves this program, so if the procedure gives an awkward answer here I want to see it do that.
  3. A lead paint remediation program whose main effect is making existing people healthier but which has a small, badly-estimated effect on population through fertility timing — I want to know where the procedure throws up its hands and says this one can't be settled by us.

  Constraints: the eval team is four people with econ and stats backgrounds and zero philosophy; each proposal gets maybe a day of analyst time; the writeups are public so we can't just punt everything as "deep uncertainty." And please flag the places where the procedure will misfire — I'm told the non-identity problem is a landmine here, where the question order itself can smuggle in a substantive axiological commitment, and I want those spots marked rather than buried.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in development economics, part-time evaluator for an effective-giving nonprofit.
      *   **Problem:** Standard cost-effectiveness analysis (CEA) using DALYs/$ breaks down when interventions affect *who* exists or *how many* exist (population ethics).
      *   **Task:** Create a practical decision procedure (flowchart/checklist style) for the evaluation team to handle population-affecting interventions.
      *   **Requirements:**
          *   Turn population axiology into actionable steps.
          *   Specify questions, sufficient answers, default conditions (conditional rankings), and escalation points (Board decisions).
          *   Be honest about axiological divergence (Totalism vs. Averagism vs. Person-Affecting).
          *   Advise on donor-facing communication (conditional rankings vs. single number).
          *   Apply the procedure to three specific proposals (Child Survival, Family Planning, Lead Remediation).
          *   **Constraints:** Team has econ/stats background, no philosophy; 1 day analyst time per proposal; public writeups (no "deep uncertainty" punts).
          *   **Critical Constraint:** Flag where the procedure might misfire (especially regarding the Non-Identity Problem and question order smuggling axiological commitments).

  2.  **Analyze the Ethical Landscape (Population Axiology):**

      *   *Total Utilitarianism:* Maximize total well-being. More happy lives = good. Risk: Repugnant Conclusion.
      *   *Average Utilitarianism:* Maximize average well-being. Adding a life below average = bad. Risk: Mere Addition Paradox.
      *   *Person-Affecting View:* Actions are only good/bad if they make *specific* people better/worse off. Existence isn't a benefit/harm to the person created (unless life is not worth living). Risk: Non-Identity Problem (can't say creating a happy child is better than not creating them).
      *   *Critical Range/Threshold Views:* Lives above a certain threshold count positively, below negatively.
      *   *The Non-Identity Problem:* If an action changes *who* is born (e.g., timing of conception), you can't say the resulting person is harmed by the action compared to a baseline where they wouldn't exist.

  3.  **Design the Decision Procedure (The "Protocol"):**

      *   *Goal:* Make it usable for economists. Use terms like "counterfactual," "marginal," "welfare weights."
      *   *Structure:*
          1.  **Screening:** Does this affect population size/identity?
          2.  **Categorization:** What *kind* of population effect is it? (Size vs. Identity).
          3.  **Axiological Sensitivity Analysis:** Calculate metrics under different views.
          4.  **Escalation:** When do we stop calculating and ask the Board/Donors?
          5.  **Communication:** How to report.
      *   *Addressing the "Smuggling" Risk:* I need to explicitly note where the *framing* of the question assumes a view. For example, asking "Does this add value?" assumes Totalism. Asking "Does this harm anyone?" assumes Person-Affecting. The procedure must remain neutral until the calculation phase.
      *   *Time Limit:* 1 day means no deep philosophical modeling. It needs to be a spreadsheet adjustment + a checklist.

  4.  **Drafting the Procedure (Iterative Refinement):**

      *   *Step 1: The Population Impact Flag.* Simple check. Does $N$ change? Do identities change?
      *   *Step 2: The Welfare Metric.* Instead of just DALYs, we need "Life-Years" (LYs) and "Quality-Adjusted Life-Years" (QALYs/DALYs).
      *   *Step 3: The Axiological Scenarios.* Define three standard "models" the economists can run:
          *   Model A (Person-Affecting/Existing People Only): Count welfare changes for people who exist in *both* counterfactuals.
          *   Model B (Totalist): Count welfare for all lives created.
          *   Model C (Average/Threshold): Count welfare relative to a baseline average.
      *   *Step 4: The Non-Identity Check.* This is the hard part. If identities change, Model A returns 0 or N/A. We need to flag this.
      *   *Step 5: Reporting.* If Models A, B, and C disagree on sign (positive/negative), escalate to Board/Conditional Report.

  5.  **Applying to the Three Proposals:**

      *   **Proposal 1: Child Survival (with fertility response).**
          *   *Effect:* Saves kids, parents have fewer later. Net population change ~0.
          *   *Axiology:* Person-Affecting likes it (specific kids saved). Totalist is neutral/slightly positive (same number, healthier). Averagist likes it (higher quality).
          *   *Verdict:* Robustly positive across views. Easy win.
      *   **Proposal 2: Family Planning.**
          *   *Effect:* Fewer births than baseline.
          *   *Axiology:* Person-Affecting (Existing parents happier/healthier? Yes. Unborn kids? N/A). Totalist (Fewer total lives = potentially negative if lives are worth living). Averagist (Fewer kids, more resources per kid = positive).
          *   *Conflict:* Totalism might rate this negatively compared to doing nothing (if lives are net positive). Person-Affecting rates it positive.
          *   *Board Issue:* The Board loves it. The procedure must reveal the tension without undermining the Board, but maintaining integrity.
      *   **Proposal 3: Lead Remediation.**
          *   *Effect:* Healthier existing kids. Small fertility timing shift.
          *   *Axiology:* Timing shift = Non-Identity Problem. Different sperm/egg = different people born later.
          *   *Conflict:* Person-Affecting says "Great for existing." Totalist says "Great + new people value." But the *timing* change makes the "new people" calculation philosophically fraught (Non-Identity).
          *   *Verdict:* Procedure should flag the timing issue as "Theoretically contested but practically negligible." Don't let philosophy block clear health gains.

  6.  **Refining the "Smuggling" and "Misfire" Warnings:**

      *   I need to explicitly state that *defining the counterfactual* is where the bias enters.
      *   I need to warn that "1 day of analyst time" is insufficient for deep demographic modeling, so we rely on point estimates which hide uncertainty.
      *   I need to address the "Non-Identity" landmine: If we treat "prevented births" as "losses," we assume Totalism. If we treat them as "neutral," we assume Person-Affecting. The procedure must calculate *both* and show the divergence.

  7.  **Finalizing the Output Structure:**

      *   **Introduction:** Acknowledge the difficulty and the constraint.
      *   **The Protocol (PA-CEA):** Step-by-step guide.
      *   **Communication Policy:** How to talk to donors.
      *   **Application:** The three cases.
      *   **Critical Limitations:** Where this breaks (the "Landmines").

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Use econ terms. "Counterfactual," "Marginal Utility," "Externality."
      *   *Critique:* Did I answer the specific question about donor writeups?
      *   *Fix:* Add a specific section on "Donor-Facing Language."
      *   *Critique:* Is the Family Planning analysis honest about the Totalist view?
      *   *Fix:* Yes, must explicitly state that under Totalism, preventing happy lives is a "cost." This is the awkward truth the user wants to see.
      *   *Critique:* Did I flag the question order smuggling?
      *   *Fix:* Add a "Red Flag" section in the protocol where specific questions reveal axiological bias.

  9.  **Final Polish:** Ensure tone is professional, empathetic to the evaluator's position, and rigorous. (Proceed to generate output based on this thought process).

  *(Self-Correction on the Family Planning Case)*: I need to be careful. Effective Altruism circles often lean Totalist. If the Board loves Family Planning, they might be implicitly Averagist or Person-Affecting. The procedure needs to show that a *strict* Totalist might hesitate, which validates the need for the Board's value judgment.

  *(Self-Correction on Lead)*: The fertility timing effect is usually negligible compared to the health effect. The procedure shouldn't paralysis by analysis. It should categorize it as "Identity-Affecting but Welfare-Dominant."

  *(Final check on constraints)*: 4 people, econ background. Keep the math familiar (sums, averages). 1 day per proposal. Keep the data requirements minimal.

  Let's build the "Population-Aware Cost-Effectiveness Analysis" (PA-CEA) Protocol.cw
answer: |-
  This is a known pain point in the effective altruism and development economics intersection. You are running into the limit of welfarist consequentialism when the "who" and "how many" are variables.

  Below is a practical decision procedure designed for your team's constraints (econ background, limited time, public accountability). It translates population axiology into sensitivity analysis. Following the protocol, I apply it to your three proposals and conclude with the "landmines" you requested.

  ---

  # The Population-Aware Cost-Effectiveness Protocol (PA-CEA)

  **Objective:** To produce cost-effectiveness estimates that remain valid regardless of the donor's underlying view on the value of bringing new people into existence.
  **Time Budget:** 1 analyst-day per proposal.
  **Output:** A primary CE estimate (DALYs/$) plus an "Axiological Sensitivity Table."

  ## Phase 1: Screening (30 Minutes)
  *Goal: Determine if standard CEA applies or if PA-CEA is triggered.*

  **Q1: Does the intervention change the number of people alive in the evaluation horizon (e.g., 100 years)?**
  *   **No:** Proceed with standard DALY/$ CEA.
  *   **Yes:** Go to Q2.

  **Q2: Does the intervention change *who* exists (identity), not just *how many*? (e.g., conception timing, sperm/egg selection via fertility shifts).**
  *   **No (Size only):** Go to Phase 2A.
  *   **Yes (Identity):** Go to Phase 2B. *(Flag: Non-Identity Risk)*

  ## Phase 2: Modeling (4 Hours)
  *Goal: Generate three distinct metrics corresponding to three axiological "models." Do not choose one yet.*

  **Model 1: The Existing-Person View (Person-Affecting)**
  *   **Definition:** Count welfare changes only for individuals who exist in *both* the intervention and counterfactual scenarios.
  *   **Calculation:** $\sum (\text{Welfare}_{\text{intervention}} - \text{Welfare}_{\text{counterfactual}})$ for overlapping population.
  *   **Treatment of New Lives:** Neutral (0 value).
  *   **Treatment of Prevented Lives:** Neutral (0 value).

  **Model 2: The Total View (Total Utilitarianism)**
  *   **Definition:** Count welfare changes for everyone, including those who exist only in one scenario.
  *   **Calculation:** $\sum \text{Welfare}_{\text{intervention}} - \sum \text{Welfare}_{\text{counterfactual}}$.
  *   **Treatment of New Lives:** Positive (if life worth living).
  *   **Treatment of Prevented Lives:** Negative (if life would have been worth living).
  *   **Assumption:** Default assumption for new lives is "worth living" unless evidence suggests severe suffering (e.g., lethal congenital conditions).

  **Model 3: The Average View (Average Utilitarianism)**
  *   **Definition:** Compare the average welfare per capita in intervention vs. counterfactual.
  *   **Calculation:** $\text{Mean}(\text{Welfare}_{\text{intervention}}) - \text{Mean}(\text{Welfare}_{\text{counterfactual}})$.
  *   **Treatment of New Lives:** Counts negatively if below current average; positively if above.

  ## Phase 3: Escalation & Reporting (3 Hours)
  *Goal: Decide how to present the numbers.*

  **Decision Rule 1: Convergence**
  *   If Model 1, 2, and 3 all yield the **same sign** (all positive or all negative):
      *   **Action:** Report the standard Model 1 estimate as the primary number. Add a footnote: *"This intervention is robustly positive across different ethical views on population."*
      *   **Board Escalation:** None.

  **Decision Rule 2: Divergence**
  *   If the models yield **different signs** (e.g., Model 1 is positive, Model 2 is negative):
      *   **Action:** Do **not** report a single number. Report the "Axiological Sensitivity Table."
      *   **Donor Writeup:** "This intervention improves the lives of existing people but reduces the total number of future lives. Donors who prioritize total population size may view this differently than donors who prioritize average welfare."
      *   **Board Escalation:** **Required.** The Board must explicitly endorse which Model aligns with the organization's mission statement before publication.

  **Decision Rule 3: Identity Uncertainty (Non-Identity)**
  *   If Q2 was "Yes" (Identity changes):
      *   **Action:** Model 1 returns $0 for the identity-shifted cohort. Model 2 counts them.
      *   **Reporting:** Explicitly state: *"Standard ethics cannot easily compare creating Person A vs. Person B. We report benefits to existing people only."*
      *   **Board Escalation:** Recommended if the identity-shifted cohort is >10% of the total impact.

  ---

  # Application to Proposals

  Here is the protocol run on your three cases.

  ### 1. Child Survival Program (Vaccination + Neonatal Care)
  *   **Demographic Effect:** Saves children. Fertility response reduces subsequent births. Net population change $\approx 0$.
  *   **Protocol Run:**
      *   **Model 1 (Existing):** Strongly Positive. Specific children survive who would have died. Parents avoid grief.
      *   **Model 2 (Total):** Neutral/Positive. Same number of people eventually, but the ones who exist are healthier (higher welfare per life).
      *   **Model 3 (Average):** Positive. Average welfare rises (fewer deaths, same resources).
  *   **Result:** **Convergence.** All models agree the intervention is good.
  *   **Reporting:** Standard DALY/$. No need to confuse donors with population ethics.
  *   **Analyst Note:** The "fertility response" is a resource reallocation, not a population loss in the Totalist sense.

  ### 2. Voluntary Family Planning (High Unmet Need)
  *   **Demographic Effect:** Reduces births relative to baseline.
  *   **Protocol Run:**
      *   **Model 1 (Existing):** Positive. Mothers have better health outcomes, existing children get more resources (quality-quantity tradeoff).
      *   **Model 2 (Total):** **Negative.** (This is the awkward truth). If the prevented children would have had lives "worth living" (positive welfare), preventing them is a loss of total value.
      *   **Model 3 (Average):** Positive. Fewer people sharing resources raises average welfare.
  *   **Result:** **Divergence.** Model 2 conflicts with Models 1 & 3.
  *   **Reporting:** **Escalate to Board.**
      *   *Why:* Your Board loves this program. That means your Board implicitly rejects strict Totalism (Model 2). They are likely Averagists or Person-Affecting.
      *   *Writeup:* Do not hide the Model 2 result. State: *"Under a 'Total View' of ethics, preventing happy lives counts as a cost. However, our evaluation prioritizes the welfare of existing people and average well-being, under which this program is highly cost-effective."*
      *   *Risk:* If you publish a single number without this caveat, a Totalist donor could accurately accuse you of hiding a negative externality (the non-existence of potential people).

  ### 3. Lead Paint Remediation
  *   **Demographic Effect:** Health gain for existing kids. Small fertility timing shift (parents conceive slightly earlier/later due to stress/health).
  *   **Protocol Run:**
      *   **Model 1 (Existing):** Strongly Positive. Cognitive/health gains for current cohort.
      *   **Model 2 (Total):** Positive + Ambiguous. Health gains are clear. The timing shift creates *different* future people (Non-Identity Problem).
      *   **Model 3 (Average):** Positive.
  *   **Result:** **Identity Uncertainty.**
  *   **Reporting:** **Default to Model 1.**
      *   *Rationale:* The welfare gain to existing people is large and certain. The value of the "different future people" is theoretically contested and empirically tiny compared to the lead reduction benefits.
      *   *Writeup:* *"This intervention primarily benefits existing children. While it may slightly shift the timing of future conceptions (changing who is born), the ethical value of this shift is debated. Our rating relies on the clear benefits to the current population."*
      *   **Board Escalation:** Not required unless the fertility timing effect is estimated to be massive (unlikely).

  ---

  # Critical Limitations & Landmines

  You asked where this procedure misfires and where question-order smuggles in commitments. Here is the honest assessment for your internal memo.

  ### 1. The "Counterfactual" Smuggle (Phase 1, Q1)
  *   **The Landmine:** Defining the "baseline" determines the axiology.
  *   **Why:** In the Family Planning case, if you define the baseline as "natural fertility," preventing births looks like a loss (Totalist). If you define the baseline as "desired fertility," preventing births looks like fulfilling preferences (Person-Affecting).
  *   **The Misfire:** Our protocol asks analysts to use "best evidence" for the counterfactual. But demographic baselines are normative.
  *   **Fix:** In the writeup, explicitly state the demographic baseline used (e.g., "Counterfactual assumes current fertility trends continue without intervention").

  ### 2. The "Life Worth Living" Threshold (Phase 2, Model 2)
  *   **The Landmine:** Model 2 requires assuming prevented lives would have been "worth living."
  *   **Why:** In extreme poverty contexts, a Totalist might argue a life of extreme suffering is negative value. Preventing it is good. In moderate contexts, it's positive value. Preventing it is bad.
  *   **The Misfire:** Our team has no metric for "negative welfare." We assume all lives are $>0$.
  *   **Fix:** Add a constraint: *"If the intervention targets a population with catastrophic suffering (e.g., famine zones), Model 2 calculation requires Board review on the 'Value of Existence' assumption."*

  ### 3. The Non-Identity Paralysis (Phase 1, Q2)
  *   **The Landmine:** Strictly speaking, *any* intervention that changes economic conditions changes conception timing, which changes identity.
  *   **Why:** If you follow the Non-Identity Problem rigorously, Model 1 (Person-Affecting) returns 0 for almost all long-term development work, because the people alive in 100 years will be different genetic individuals depending on what you do today.
  *   **The Misfire:** If you flag Q2 too aggressively, you paralyze the team. Every proposal becomes "Identity-Affecting."
  *   **Fix:** **The "Genetic Identity" Constraint.** Only flag Q2 as "Yes" if the mechanism is *directly* about reproduction (e.g., IVF, sterilization, contraception). Treat general economic shifts as "Size Only" for practical purposes, even if philosophically imprecise. *Mark this explicitly in the protocol as a pragmatic simplification.*

  ### 4. Donor Confusion vs. Honesty (Phase 3)
  *   **The Landmine:** Presenting conditional rankings (Model 1 vs Model 2) confuses donors who want a "best buy."
  *   **The Misfire:** If you show divergence, donors may lose trust ("You don't know if this is good?").
  *   **Fix:** **The "Mission Anchor."** Your organization must have a stated mission.
      *   If Mission = "Reduce Suffering," prioritize Model 1.
      *   If Mission = "Maximize Human Potential," prioritize Model 3.
      *   *Recommendation:* Do not present the table as "We don't know." Present it as "Here is how this performs against different ethical goals."

  ### Summary Recommendation for the Board
  The procedure reveals that **Proposal 2 (Family Planning)** is the only one that requires a value judgment.
  *   **Action:** Ask the Board to formally adopt a "Population Stance."
  *   **Draft Language:** *"In evaluating interventions that affect birth rates, [Organization Name] prioritizes the welfare and autonomy of existing people over the total number of future people."*
  *   **Benefit:** This resolves the Model 2 conflict instantly. You can then report Family Planning as a standard positive, knowing you have the axiological cover to ignore the Totalist negative.

  This approach keeps your analysts doing math, pushes the philosophy to the Board where it belongs, and keeps the donor writeups honest without being paralyzing.
