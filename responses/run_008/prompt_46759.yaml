      *   *Key Insight:* The Water-and-Wine problem proves you cannot have Invariance + Uniqueness + Non-informativeness simultaneously for continuous variables without additional structure. I must highlight this impossibility theorem aspect.

  9.  **Final Polish:** Check the "Joint Unsatisfiability" section. This is the core value add. It explains *why* the team is fighting. They are trying to satisfy impossible constraints.

