answer: |-
  Here are the desiderata for a rule of probability assignment under ignorance, specified for the context of quantitative risk modeling.

  ### The Desiderata

  **1. Transformation Invariance**
  *   **Specification:** If a state of knowledge is expressed in terms of parameter $\theta$, and also equivalently in terms of $\phi = f(\theta)$, the probability assignment must be consistent under the change of variables. The probability mass assigned to a physical interval must not depend on the scale used to measure it.
  *   **Case/Consideration:** The Water-and-Wine problem. If you are ignorant of the ratio of water to wine, uniformity over the ratio implies non-uniformity over the fraction of wine. If the rule yields different physical predictions based on which unit the analyst wrote down first, the rule is subjective, not logical.
  *   **Status:** **Non-negotiable.** Without this, the model output is an artifact of the analyst's notation, not the equipment's risk.

  **2. Symmetry Adherence (and Non-Invention)**
  *   **Specification:** If the physical setup possesses a symmetry (e.g., exchangeable components, isotropic stress), the probability assignment must respect it. Conversely, if no symmetry exists (e.g., a known wear mechanism), the rule must not impose one.
  *   **Case/Consideration:** A fair die requires 1/6 per face due to physical symmetry. A pump seal does not have symmetry between "failed" and "not failed" in a new regime. A rule that forces 50/50 in the latter case manufactures information; a rule that ignores symmetry in the former case is irrational.
  *   **Status:** **Non-negotiable.** Violating physical symmetry invalidates the model's link to reality.

  **3. Informational Neutrality**
  *   **Specification:** The assignment must not imply knowledge that is not possessed. It should maximize uncertainty (in a formal sense) consistent with known constraints. In risk terms: it must not be over-confident.
  *   **Case/Consideration:** "Manufactured information" is your primary safety hazard. A narrow prior on a failure rate for a new regime implies you know the physics better than you do. The rule must default to the widest credible spread allowed by logic.
  *   **Status:** **Non-negotiable.** This is the core safety constraint of your profession.

  **4. Operational Definability**
  *   **Specification:** The rule must specify a procedure that terminates in a mathematical object usable by downstream models (a proper distribution, an improper prior, or a defined set). It cannot rely on undefined intuition.
  *   **Case/Consideration:** Your team needs to run the simulation. A philosophical stance that "probability doesn't apply here" stops the work. The rule must be an algorithm.
  *   **Status:** **Non-negotiable.** A rule that cannot be implemented is not a rule.

  **5. Uniqueness of Output**
  *   **Specification:** For a well-posed problem statement, the rule should yield a single, unique probability distribution (or density).
  *   **Case/Consideration:** If two analysts use the same rule on the same data, they should get the same result. If the rule outputs a *set* of distributions, downstream risk integration becomes complex (requiring bounds rather than point estimates).
  *   **Status:** **Negotiable.** This is the primary source of conflict. Demanding uniqueness often forces a violation of Transformation Invariance.

  **6. Properness**
  *   **Specification:** The resulting probability distribution should integrate to unity (be a proper probability measure).
  *   **Case/Consideration:** Risk models often require expected values. Improper priors (like $1/\lambda$) can lead to undefined expectations or paradoxical decisions if not handled with extreme care in the posterior.
  *   **Status:** **Negotiable.** Many rigorous rules for ignorance (e.g., Jeffreys priors) yield improper distributions. Forcing properness often requires arbitrary cutoffs, which violates Informational Neutrality.

  ---

  ### Joint Unsatisfiability

  **There is a proven conflict between Desiderata 1 (Invariance), 3 (Neutrality), and 5 (Uniqueness) for continuous parameters.**

  This is the substantive reason your team is disagreeing. It is mathematically impossible to construct a rule that yields a **unique**, **proper**, **non-informative** distribution that is **invariant** under all smooth reparameterizations for a continuous variable (like a failure rate).
  *   If you demand **Uniqueness** and **Neutrality** (Naive Indifference), you lose **Invariance** (Water-and-Wine).
  *   If you demand **Invariance** and **Neutrality** (Jaynes/Jeffreys), you often lose **Properness** and sometimes **Uniqueness** (if the transformation group is ambiguous).
  *   If you demand **Invariance** and **Uniqueness**, you usually have to inject specific information (constraints), violating **Neutrality**.

  Your team's disagreement is not incompetence; it is the friction of trying to satisfy an impossible triad. Someone is always sacrificing Invariance to get a Number.

  ---

  ### Contender Scoring

  **Naive Indifference (Uniform on chosen parameter):** Fails **Invariance** catastrophically (Water-and-Wine). It satisfies **Uniqueness** and **Operationality**, but violates **Neutrality** by hiding the arbitrary choice of parameterization as "objective." It is the most dangerous for risk modeling.

  **Jaynes-Style Invariance (Transformation Groups):** Satisfies **Invariance** and **Symmetry** where group structure is clear (e.g., scale parameters). However, it often yields **Improper** priors (violating **Properness**) and requires identifying the correct transformation group, which can be ambiguous (threatening **Uniqueness**). It is the most logically robust but requires careful downstream handling.

  **Maximum Entropy (MaxEnt):** Satisfies **Neutrality** relative to *stated constraints*. However, without constraints, it collapses to Naive Indifference (failing **Invariance**). It is only as good as the constraints you feed it; in "ignorance" scenarios, constraints are often arbitrary, manufacturing information.

  **Reference Priors:** Designed for inference, not pure ignorance. They satisfy **Invariance** and **Neutrality** asymptotically but are complex to derive for multivariate risk models. They often result in **Improper** priors. Good for science, heavy lifting for engineering risk.

  **Imprecise Probabilities (Sets of Distributions):** Sacrifices **Uniqueness** to save **Invariance** and **Neutrality**. It outputs a range (e.g., probability bounds). This is logically honest and handles Water-and-Wine by widening the bounds, but strains **Operationality** in standard risk tools that expect single distributions.

  **Deflationism (No Probability):** Satisfies **Neutrality** perfectly by refusing to speak. Fails **Operationality** completely. It is the correct philosophical stance but the wrong engineering tool for a mandated quantitative model.
