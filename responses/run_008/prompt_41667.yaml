prompt: |-
  I'm a game theorist by training: signaling games, coordination problems, equilibrium selection, cheap talk versus costly signals are my home vocabulary, and I know the philosophy only at the level of a good podcast listener. Take Kwame Anthony Appiah's account of moral revolutions — the collapse of dueling among the English gentry, the end of Chinese foot-binding, and the abolition of the Atlantic slave trade — together with the Bernard Williams background he leans on, where honor is constitutively social: it exists only in the regard of an honor world, a peer group whose recognition is the point. Restate that whole story in my vocabulary, as faithfully as you can. Dueling looks to me like a separating equilibrium in which accepting mortal risk is the costly signal; the anti-foot-binding societies, which had families pledge neither to bind their daughters' feet nor to let their sons marry into families that did, look like an explicit engineered fix to a marriage-market coordination problem; abolition looks like an interest-group story dressed up in moral language. Translate each case, and tell me which translations are honest and which are distortions. Then give me the residue report: what in Appiah's story has no counterpart in signaling and coordination vocabulary — his talk of dignity, of moral argument changing what a group can hear rather than what it pays, of the internalized spectator — and whether the residue signals that game theory is missing something or that the honor explanation is doing less work than it appears to. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Game Theorist (signaling games, coordination, equilibrium selection, cheap talk vs. costly signals). Philosophical knowledge is limited ("podcast listener" level).
      *   **Subject Matter:** Kwame Anthony Appiah's *The Honor Code* (moral revolutions: dueling, foot-binding, slavery) + Bernard Williams' concept of honor (social, constitutive of an "honor world").
      *   **Task:**
          1.  Restate Appiah/Williams' story using game-theoretic vocabulary (signaling, coordination, equilibrium).
          2.  Evaluate the fidelity of these translations (honest vs. distortion).
          3.  Provide a "residue report": Identify concepts in Appiah's account that don't fit game theory (dignity, moral argument, internalized spectator).
          4.  Analyze the residue: Does it show GT is missing something, or is the honor explanation overworked?
      *   **Constraint:** Answer in American English.

  2.  **Deconstruct the Source Material (Appiah/Williams):**
      *   *Core Thesis:* Honor codes drive moral change. People care about what their peers think. When the "honor world" shifts its valuation, behavior changes rapidly.
      *   *Mechanism:* It's not just utility maximization; it's identity. To be a member of the group *is* to abide by the code. Shame is the sanction.
      *   *Cases:*
          *   Dueling: Gentlemen fought to prove courage/honor. Stopped when the code shifted (seen as barbaric, not honorable).
          *   Foot-binding: Stopped when it became a liability for marriage prospects (anti-foot-binding societies).
          *   Slavery: Abolished when it became shameful for the British Empire (national honor).
      *   *Williams:* Honor is essentially social. You can't be honorable in a vacuum.

  3.  **Translate to Game Theory (Drafting the Translations):**
      *   *Dueling:* User suggests "separating equilibrium with costly signal."
          *   *GT View:* High type (courageous/honorable) vs. Low type (coward). Cost = risk of death. If cost is too high for low types, they don't duel. Equilibrium holds as long as the payoff (social status) outweighs the cost.
          *   *Shift:* The payoff matrix changes. The "honor world" stops valuing the signal.
      *   *Foot-binding:* User suggests "engineered fix to marriage-market coordination problem."
          *   *GT View:* Coordination game (Stag Hunt or Network Effect). Everyone binds because everyone expects everyone else to bind (marriageability).
          *   *Shift:* Anti-foot-binding societies create a new focal point. Commitment devices (pledges). Changing the expected behavior of the network.
      *   *Slavery:* User suggests "interest-group story dressed up in moral language."
          *   *GT View:* This is the trickiest. Standard GT might see this as a shift in economic incentives or a coalition forming to enforce a new norm.
          *   *Appiah's View:* It was about *shame*. Britain wanted to be the "liberator nation."
          *   *GT Translation:* Reputational signaling on the international stage. Costly signaling (economic loss) to gain status/prestige.

  4.  **Evaluate Fidelity (Honest vs. Distortion):**
      *   *Dueling:* Pretty honest. It *is* a signaling game. But GT misses the *constitutive* nature. In GT, I signal to get a payoff. In Appiah/Williams, I duel because *not* dueling means I'm not a gentleman. It's about identity, not just payoff.
      *   *Foot-binding:* Very honest. This is classic network externality/coordination. The "pledge" is a contract/commitment device.
      *   *Slavery:* Distortion. Calling it "interest-group" reduces the moral sentiment to hidden material interest. Appiah argues the economic interest was often *against* abolition (initially). The "payoff" was psychological/social (honor), not material. GT can model social payoff, but "interest-group" implies material lobbying.

  5.  **The Residue Report (What GT Misses):**
      *   *Dignity/Identity:* In GT, preferences are exogenous. In Appiah, the *self* changes. The utility function itself is rewritten. GT treats preferences as fixed; Honor Theory treats them as socially constructed.
      *   *Moral Argument:* GT treats communication as "cheap talk" unless costly. Appiah argues arguments *change the game* by changing what is conceivable. It's not just information asymmetry; it's cognitive reframing.
      *   *Internalized Spectator:* GT usually models external sanctions (punishment/reward). Appiah/Williams emphasize *shame* (internal feeling based on imagined external judgment). It's a psychological mechanism, not just a strategic one.
      *   *Analysis:* Does GT miss something? Yes, endogenous preference formation. Is Honor doing less work? No, Honor explains *why* the payoff matrix shifted, which GT takes as exogenous.

  6.  **Refining the Tone:**
      *   Needs to be respectful of the user's expertise (no explaining Nash Equilibrium).
      *   Needs to be precise with philosophical concepts (without getting too woo-woo).
      *   American English spelling/idioms.
      *   Structure: Translations -> Evaluation -> Residue -> Conclusion.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Dueling:* Focus on the cost of the signal relative to the social payoff. The collapse isn't just cost changing, it's the *receiver's* valuation changing.
      *   *Foot-binding:* Focus on network effects. The "pledge" is a way to solve the assurance problem.
      *   *Slavery:* Be careful here. Appiah explicitly fights the "economic interest" explanation. I need to frame it as a reputational equilibrium shift.
      *   *Residue:* The key is *endogeneity of preferences*. GT assumes I want X. Appiah says the honor code makes me want X. Also, the "thick" concept of honor vs. "thin" utility.

  8.  **Final Review against Constraints:**
      *   Did I use GT vocab correctly? (Separating equilibrium, coordination, focal points, commitment devices, endogenous preferences).
      *   Did I address Appiah/Williams accurately? (Honor world, shame, dignity).
      *   Did I answer the specific questions? (Translate, Evaluate, Residue, Implication).
