  2.  **Deconstruct the Argument & Philosophy of Mind Context:**
      *   **The Case:** Recalcitrant emotions (fear despite contrary judgment). This is a classic problem in philosophy of emotion.
      *   **Move 1 (Maya - Anti-Judgmentalism):** Standard objection to Stoic/Cognitivist views (e.g., Nussbaum, Solomon). Recalcitrant emotions seem to show judgment is not necessary. *Strength:* Intuitive force. *Weakness:* Assumes judgment must be conscious/occurrent.
      *   **Move 2 (Theo - Fragmented Belief):** Defense of Cognitivism via subconscious/implicit beliefs (e.g., Tappolet, some readings of Stoics). *Strength:* Explains persistence. *Weakness:* Risk of trivializing the theory (ad hoc).
      *   **Move 3 (Maya - Unfalsifiability):** Critique of Move 2. *Strength:* Methodological concern. *Weakness:* Might be too strict; implicit attitudes are standard in psych.
      *   **Move 4 (Theo - Perceptualism/Intentionality):** Shift to Perceptualism (e.g., Tappolet, Döring). Argument from intentionality (feelings lack objects). *Strength:* Captures object-directedness and recalcitrance (illusions). *Weakness:* Metaphor of perception might be loose.
