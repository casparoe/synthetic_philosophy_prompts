answer: |-
  **Setting:** *A quiet corner of a university common room, late afternoon. Rain streaks the window. Three figures sit around a low table covered in notebooks and a single, schematic drawing of a cylinder intersecting two planes.*

  **Characters:**
  *   **Elena:** An Endurantist. Sharp, focused on the phenomenology of objects.
  *   **Paul:** A Perdurantist. Calm, geometric in his thinking.
  *   **Arthur:** A Retired Experimental Physicist. The host. Skeptical of vagueness.

  **Arthur:** (Tapping the schematic) Let's ensure we agree on the geometry before we dissect the ontology. We have a metal cylinder, proper length $L_0$, moving at $v = 0.8c$ relative to the laboratory. Two devices in the lab, fixed at positions $x_1$ and $x_2$. As the cylinder passes, Device 1 swaps the atoms of the leading third; Device 2 swaps the atoms of the trailing third. In the lab frame, these swaps are simultaneous. There is a spacelike hypersurface—call it $\Sigma_{lab}$—on which the cylinder is composed entirely of new atoms.

  **Paul:** And in the cylinder's rest frame?

  **Arthur:** In the cylinder's rest frame, the swaps are not simultaneous. Due to the relativity of simultaneity, the events are separated by a proper time interval $\Delta \tau$. During this interval, the cylinder is a mixture of old and new atoms. Crucially, for the purpose of this thought experiment, we are positing that there is *no* hypersurface of simultaneity in the cylinder's frame, $\Sigma_{cyl}$, on which the cylinder is wholly new. The "wholly new" configuration exists only on the tilted slice of the lab frame.

  **Elena:** That's the crux. If I am an endurantist, I believe the cylinder is wholly present at each moment of its history. But "moment" implies a simultaneity slice. If the lab frame says "At $t$, the cylinder is wholly new," and the cylinder frame says "At no $t'$ is the cylinder wholly new," then the property of *being wholly new* is frame-relative. But survival? Identity? That cannot be frame-relative. Either the cylinder survives the swap or it doesn't.

  **Paul:** You're assuming survival is a property of a 3D object at a time. I say survival is a property of a 4D worm. The cylinder *is* the spacetime worm. That worm is invariant. It exists. It has a region where the matter is old, and a region where the matter is new. The lab frame slices the worm one way; the cylinder frame slices it another. Neither slice is the "real" cylinder. The worm is the real cylinder.

  **Elena:** But Paul, that evacuates the meaning of "persists." When I say the cylinder survives, I mean *this* object, the one I can touch, continues to exist. If the 4D worm is the object, then the object doesn't persist through time; it merely extends across it. You've turned persistence into a static dimension. If the cylinder frame sees a mixture and never sees a "wholly new" state, then from the cylinder's perspective, it never completes the transition. How can it survive a transition it never undergoes?

  **Paul:** It undergoes the transition in spacetime. The "completion" is just a coordinate effect. Look, Elena, you accept that length is frame-relative. The cylinder is length-contracted in the lab. Do you say the cylinder *really* shrinks?

  **Elena:** No, I say the *measurement* is frame-relative. The intrinsic length is invariant. But identity isn't a measurement. It's a metaphysical fact. If the lab frame says "The cylinder is now wholly new," and that statement is true, then there is a fact of the matter. If the cylinder frame says "It is not the case that the cylinder is wholly new," we have a contradiction unless truth itself is frame-relative.

  **Arthur:** (Holding up a hand) Stop. "True at a moment" is sloppy. In relativity, propositions are true at spacetime points or relative to hypersurfaces. There is no contradiction in saying "On hypersurface $\Sigma_{lab}$, the matter density is 100% new" and "On hypersurface $\Sigma_{cyl}$, the matter density is mixed." The invariant is the spacetime distribution of matter. The contradiction only arises if you insist the cylinder is a 3D object that must have a single, frame-independent state at a "time."

  **Elena:** Precisely, Arthur. And that is why endurantism can accommodate this. I can concede that *properties* like "being wholly new" are frame-relative, just like length. The cylinder endures. In the lab frame, it instantiates the property "wholly new" at $t$. In the cylinder frame, it never instantiates that property. That is no worse than saying it has length $L$ in one frame and $L/\gamma$ in another. The *substance* persists; the *description* varies.

  **Paul:** But that's a concession that destroys endurantism. If the properties of the object at a time are frame-relative, then what is the object *at a time*? You're admitting that the "time-slice" of the object is arbitrary. If the slicing is arbitrary, the "whole object" at that time is arbitrary. Why privilege the 3D slice? The 4D worm is the only thing that doesn't depend on the foliation. You're treating the "momentary cylinder" as real, but admitting its properties depend on who is looking. I treat the "momentary cylinder" as an abstraction, like a cross-section of a pipe. The pipe is real; the cross-section is just where you cut.

  **Elena:** Because the cross-section of a pipe doesn't *act*. The cylinder acts. It exerts pressure, it conducts heat. Causality happens *now*. If I am in the lab, and I interact with the "wholly new" cylinder, I am interacting with a real object. If I boost to the cylinder frame, am I interacting with a ghost? A mere stage? Your view makes the causal power of the object dependent on the temporal extent you assign it.

  **Paul:** No, the causal power is in the spacetime region. The interaction is an intersection of world-tubes. But let's press your point. If survival is frame-relative, then in the lab frame, the cylinder survives as a new object. In the cylinder frame, does it survive? You said earlier identity cannot be frame-relative. But if the state "wholly new" is required for the "new cylinder" to exist, and that state never obtains in the cylinder frame, then the "new cylinder" doesn't exist in that frame. So, does the new cylinder exist or not?

  **Elena:** (Pauses) This is the burden I accept. The *description* of the persistence is frame-relative. But the *continuant*—the substrate—is not. The cylinder is the same substrate. The fact that the lab sees a clean swap and the cylinder sees a gradual bleed is a fact about the *process*, not the *identity*. The cylinder survives in both frames because the world-line is continuous.

  **Arthur:** (Leaning forward) I need to intervene on "continuous." In your scenario, Arthur, the atoms are swapped. If identity relies on material constitution, the lab frame says "100% new matter." The cylinder frame says "Mixed matter for an interval." If the cylinder frame never sees 100% new matter simultaneously, does the "New Cylinder" ever come into existence in that frame?

  **Elena:** If "New Cylinder" means "The cylinder after the swap," then yes. It exists after the later event in the cylinder frame.

  **Arthur:** But the prompt specifies: "There is no moment at which it is wholly new" in the cylinder frame. I must hold you to the physics. If the swap events are spacelike separated, and we define "Wholly New" as a state on a simultaneity slice, then in the cylinder frame, no such slice exists. The "Wholly New" state is a hyperplane that cuts through the cylinder's history at an angle. It is never a moment of *proper time* for the cylinder.

  **Paul:** Exactly. The "Wholly New Cylinder" is a slice-dependent artifact. In the lab frame, the slice aligns with the swap. In the cylinder frame, it doesn't. If you are an endurantist, you must say the object *is* the 3D slice. So in the cylinder frame, the "Wholly New Cylinder" literally does not exist. In the lab frame, it does. So existence is frame-relative.

  **Elena:** (Visibly troubled) Existence cannot be frame-relative. That violates the invariance of physical reality.

  **Paul:** Then you must abandon the idea that the object is the 3D slice. You must admit the object is the 4D worm. Then existence is invariant. The worm exists. The "Wholly New" property is just a label we apply to a segment of the worm relative to a foliation.

  **Elena:** But if I admit the object is the 4D worm, I am a perdurantist. I lose the "wholly present" intuition. However... if I stay an endurantist, I must say that "being wholly present" is itself frame-relative. The cylinder is wholly present on $\Sigma_{lab}$. It is wholly present on $\Sigma_{cyl}$. But what is present *differs*. On $\Sigma_{lab}$, a new cylinder is present. On $\Sigma_{cyl}$, a mixed cylinder is present.

  **Paul:** So the *numerical identity* of the object present at a time is frame-relative? That means the lab observer and the cylinder observer are not talking about the same object when they say "the cylinder now."

  **Elena:** They are talking about the same *continuant*, but different *temporal parts* of it are "now." No, that's your language. They are accessing the same enduring substance, but the *state* of that substance is frame-relative.

  **Arthur:** Let's pause. Elena, you are arguing that frame-relative persistence facts are no worse than frame-relative lengths. Paul, you are arguing that the 4D object is the only invariant. Is there a middle ground?

  **Elena:** My concession is this: If persistence facts are frame-relative, endurantism becomes a claim about *relations* between substances and frames, not just substances and time. It complicates the view. But it saves the intuition that *I* am wholly present. I do not feel like a worm.

  **Paul:** And my concession is that "temporal parts" can sound like little homunculi. They aren't. They are just regions of spacetime. But the cost of your view, Elena, is that you must accept that whether a "complete object" exists depends on the observer's velocity. That seems ontologically profligate.

  **Arthur:** Here is the physics honesty check. The invariant is the spacetime interval and the stress-energy tensor distribution. Both of you are trying to map "Object" onto that tensor. Paul maps it to the whole 4D distribution. Elena maps it to 3D cross-sections. The scenario shows that the 3D cross-sections are not Lorentz invariant. The 4D distribution is.

  **Elena:** So you favor Paul?

  **Arthur:** Not necessarily. Physics describes the geometry. Metaphysics describes what *inhabits* it. But I will ask you both: What would move you to the other side?

  **Paul:** (Thinking) If I could be shown that causal powers reside *only* in the instantaneous 3D slice, and not in the 4D extension... If it turned out that the future parts of the worm cannot be real because they cannot causally influence the present, I would have to retreat to endurantism. But relativity blocks that; "present" is relative. So, what would move me? If it were demonstrated that *conscious experience*—the feeling of persistence—cannot be modeled by a 4D static block. If the "flow" of time is a fundamental physical feature, not an emergent one, the worm view dies.

  **Elena:** And for me? If it were shown that frame-relative existence leads to logical contradictions in conservation laws. If "existing" is not invariant, then energy conservation becomes frame-dependent in a way that breaks physics. If I must accept that an object can *exist* in one frame and *not exist* in another at the same spacetime region, I must abandon endurantism.

  **Arthur:** (Nods slowly) That is the hinge. Invariance of existence.

  **Paul:** So, Elena, do you concede that in the cylinder frame, the "Wholly New Cylinder" does not exist?

  **Elena:** I concede that the *state* "Wholly New" is not instantiated on any cylinder-frame simultaneity slice. But the *substance* persists. I will bite the bullet: Existence is invariant, but the *properties* of the existing object at a time are frame-relative. Even the property of "being composed entirely of new atoms."

  **Paul:** Then we agree on the physics, but disagree on the ontology. You say a 3D object has frame-relative properties. I say a 4D object has frame-relative slices.

  **Arthur:** And the burden?

  **Paul:** The burden on me is explaining why we *feel* 3D.
  **Elena:** The burden on me is explaining how a 3D object can have contradictory properties (New vs. Mixed) without contradiction. I solve it by indexing properties to frames.

  **Arthur:** (Closing his notebook) Here is my verdict. I spent forty years checking invariants. When I see a quantity that changes with the frame, I call it a coordinate artifact. Length is an artifact of slicing. Simultaneity is an artifact of slicing. Elena, you want to treat "Composition" as invariant. But this scenario shows Composition is slicing-dependent. Whether the atoms compose a "New Cylinder" depends on the hyperplane.
  Therefore, the object that is invariant is the 4D worm. The 3D cylinder is a slice.
  However.
  Physics does not tell us what *persists*. It tells us what is *invariant*. If "persistence" means "remaining the same 3D object through time," relativity says that concept is frame-dependent. If you can accept that "persistence" is frame-dependent, Endurantism survives. If you require "persistence" to be an absolute fact, Perdurantism wins.

  **Paul:** I can live with that.

  **Elena:** I can as well. But I maintain that the *experience* of persistence is 3D.

  **Arthur:** Then the asymmetry is not in the physics, but in the phenomenology. The frame-relativity of composition is a burden you *both* share. Paul, you must explain the 3D feel. Elena, you must explain the frame-relative properties. Neither is free.
  (She pauses, looking at the rain)
  I favor the Perdurantist, slightly. Not because the 4D worm is more "real," but because it treats the spacetime manifold as the fundamental ontology. It respects the invariance of the interval. To insist on a privileged "now" slice for the object, even if frame-relative, feels like clinging to a preferred frame. But it is a close call. The Endurantist's move to treat properties as frame-relative is robust. It is no worse than treating length as frame-relative.

  **Paul:** I appreciate the concession, Arthur.

  **Elena:** And I appreciate that the "contradiction" was dissolved by indexing to frames.

  **Arthur:** Good. Then the cylinder survives. In all frames. It just wears different coats depending on how you slice it. Now, who wants coffee? The caffeine, at least, is a scalar invariant.

  *(They laugh, the tension breaking as Arthur stands to pour.)*
