answer: |-
  # Activity: The "Common Thread" Challenge

  **Time:** 50 Minutes (Activity + Inter-group Challenge)
  **Materials:** 5 Envelopes (one per group), each containing 8 Scenario Cards and 1 Definition Worksheet. Whiteboard/Blackboard.

  ### Part 1: Group Sorting & Definition (25 Minutes)

  **Setup:**
  Divide the class into 5 groups of 4–5 students. Hand each group an envelope. Tell them: *"You have 15 minutes to complete Task A, and 10 minutes for Task B. Do not move to Task B until Task A is done."*

  **Task A: The Ranking**
  Inside the envelope are 8 Scenario Cards. Each describes a first-person experience.
  1.  **The Peach:** Biting into a perfectly ripe, juicy peach on a hot day.
  2.  **The Proof:** The sudden click of understanding after being stuck on a hard math problem for 4 hours.
  3.  **The Rival:** Seeing a competitor who sabotaged you get publicly fired.
  4.  **The Relief:** The doctor says the biopsy is benign.
  5.  **The Touch:** An orgasm.
  6.  **The Help:** Carrying a stranger's heavy groceries up three flights of stairs; they thank you warmly.
  7.  **The Song:** Listening to a sad piece of music that makes you cry but feels beautiful.
  8.  **The Finish:** Crossing the finish line of a marathon; your legs hurt, but you feel triumphant.

  *Instruction:* Rank these from 1 (Most Pleasurable) to 8 (Least Pleasurable). There is no right answer, but the group must agree on a single list.

  **Task B: The Definition**
  *Instruction:* Look at your top 4 ranked items. Write down **one single sentence** that describes the specific *feeling* or *quality* that these four share, which the bottom four lack (or have less of).
  *Constraint:* You cannot use the words "good," "bad," "like," "dislike," "want," or "prefer." You must describe the *phenomenology* (what it feels like).

  ### Part 2: The Attack Phase (25 Minutes)

  **Setup:**
  Each group writes their Definition Sentence on the board.

  **The Mechanic:**
  1.  Group 1 reads their definition.
  2.  Groups 2–5 have 2 minutes to consult their Scenario Cards. They must find **one** scenario from their own list (even one they ranked low) that *fits* Group 1's definition but *shouldn't* be a pleasure, OR one they ranked high that *doesn't fit* the definition.
  3.  If a group finds a counterexample, they get a "point" (acknowledgment). Group 1 must try to revise their definition to accommodate the counterexample without making it so vague it means nothing.
  4.  Rotate through all 5 groups.

  **TA Role During Activity:**
  *   **Circulate:** Listen for groups saying "They all just feel good." Push them: *"Describe the 'good.' Is it a tingling? A warmth? A quietness? If you had to explain it to an alien who has no nervous system, what physical or mental sensation is it?"*
  *   **Timekeeper:** Be ruthless. Cut off Task A at 15 mins even if they aren't done. The friction is the point.
  *   **Referee:** During the Attack Phase, ensure students aren't just saying "I disagree." They must show how the definition fails to capture the experience described on the cards.

  ***

  # Predictable Failures & Mitigation

  **1. The "It Just Feels Good" Dodge**
  *   **What happens:** Students will insist the common thread is simply "it feels good" or "it's positive."
  *   **Why it's a problem:** This bypasses the heterogeneity problem. If "feeling good" is a brute, unanalyzable quality, the problem vanishes.
  *   **Mitigation:** Enforce the vocabulary constraint in Task B. If they write "It feels positive," ask them to underline the word "positive" and replace it with a description of the sensation (e.g., "a rush," "a calm," "a tension release"). When they realize "rush" fits the Proof but not the Peach, the problem emerges.

  **2. Conflating Cause with Feeling**
  *   **What happens:** Groups define the pleasure by the *source* (e.g., "It involves achieving a goal") rather than the *sensation*.
  *   **Why it's a problem:** Hedonism claims the *feeling* is the good, not the cause. "The Help" and "The Rival" both involve social comparison, but feel different.
  *   **Mitigation:** During circulation, ask: *"If I gave you a pill that gave you this feeling without the achievement, would it be the same pleasure?"* (This primes the Experience Machine objection, which is useful later).

  **3. The "Vagueness Victory"**
  *   **What happens:** During the Attack Phase, Group 1 keeps revising their definition until it is so broad it covers everything (e.g., "It is a state of consciousness one does not wish to change").
  *   **Why it's a problem:** This actually *is* a viable philosophical defense (the "felt tone" theory), but students will treat it as a win without seeing the cost (it becomes too thin to do ethical work).
  *   **Mitigation:** In the debrief, highlight this specific move. Acknowledge it works logically but ask if it helps us make decisions (e.g., can we calculate the "units" of this vague state?).

  **4. Time Creep**
  *   **What happens:** Ranking takes too long; students argue about whether "The Rival" is actually pleasurable.
  *   **Mitigation:** Tell them at minute 10: *"If you are stuck on ranking, pick arbitrarily. The ranking matters less than the definition."*

  ***

  # What This Activity Cannot Reproduce (TA Supplement)

  You must supply this in the debrief. The activity is rigged to favor a **Sensation Theory of Pleasure** (pleasure as a specific kind of feeling, like a itch or a color).

  1.  **Attitudinal Hedonism:** The activity assumes pleasure is a *sensation*. Many modern hedonists (e.g., Feldman) argue pleasure is an *attitude* (taking satisfaction in a state of affairs). Under this view, the heterogeneity problem dissolves because the "feeling" doesn't need to be uniform; the *pro-attitude* is the common thread. The activity makes this view hard to discover naturally.
  2.  **The Normative Force:** The activity focuses on *description* (what is pleasure?). It doesn't fully capture the *normative* claim (why *ought* we pursue it?). Students might conclude "pleasures are different" without seeing why that threatens the utilitarian calculus.
  3.  **Bentham's Arithmetic:** The activity shows pleasures are qualitatively different. It doesn't automatically show why this breaks Bentham's *quantitative* calculus unless you explicitly connect the two in the debrief.

  ***

  # Debrief Guide (25 Minutes)

  **Phase 1: Mapping the Room (5 Minutes)**
  *   Ask: "Which groups had to rewrite their definition more than once?"
  *   Ask: "Did anyone find a definition that survived all attacks?" (Likely no, or only a very vague one).
  *   **Point:** "You just rediscovered the **Heterogeneity Problem**. If pleasures are as different as 'eating a peach' and 'schadenfreude,' is there really one thing called 'Pleasure' that we can measure?"

  **Phase 2: Connecting to the Text (Settled Interpretation) (10 Minutes)**
  *   *Note to TA: Distinguish clearly between historical consensus and ongoing debate.*
  *   **Bentham:** He assumes the answer to your activity is "Yes." For Bentham, pleasure is homogeneous. The only differences are **quantity** (intensity, duration, certainty, propinquity, fecundity, purity, extent). If your activity suggests pleasures are qualitatively different, Bentham's arithmetic (the felicific calculus) breaks. You can't add "peach units" to "proof units" if they are different currencies.
  *   **Mill:** He agrees with your activity's result (pleasures *are* different). His solution is **Higher vs. Lower Pleasures**. He introduces *quality* as a metric.
      *   *Settled:* Mill explicitly rejects Bentham's pure quantitative view in *Utilitarianism*, Chapter 2 ("It is better to be a human being dissatisfied than a pig satisfied...").
      *   *Settled:* Mill relies on "Competent Judges" to determine quality.
  *   **Moore:** G.E. Moore (in *Principia Ethica*) argues there is *no* common natural property at all. He argues "Pleasure" is like "Good"—it's indefinable. If you try to define it by a sensation, you commit the Naturalistic Fallacy. Your difficulty writing the definition sentence is essentially Moore's argument in real-time.

  **Phase 3: Open Philosophical Questions (Contested) (10 Minutes)**
  *   *Note to TA: Flag these as live debates, not settled facts.*
  *   **The "Felt Tone" Defense:** Some philosophers (e.g., C.D. Broad, some contemporary hedonists) argue there *is* a common feeling, but it is very thin—a "hedonic tone" that tints experiences like a light colors a room.
      *   *Question for class:* "If the definition is that thin, is it useful? Can you build an ethics on a feeling so vague you can't measure it?"
  *   **Attitudinal vs. Sensation:** As noted above, the activity assumed pleasure is a *sensation*.
      *   *Question for class:* "If pleasure isn't a feeling, but rather 'being okay with what is happening' (attitude), does the heterogeneity problem go away?" (e.g., You can be 'okay' with the peach and 'okay' with the proof in the same way, even if the sensations differ).
  *   **Mill's Consistency:** Scholars still fight about whether Mill remains a hedonist after introducing higher pleasures.
      *   *Contested:* If the "quality" of a pleasure depends on something other than the feeling itself (e.g., the *source* of the pleasure, like intellect vs. body), is Mill secretly abandoning hedonism for a perfectionist view?
      *   *Honesty Check:* Tell them: "Next week when you read Mill, look for this. Does he say intellectual pleasures *feel* better, or that they are *better* regardless of feeling? The text is ambiguous, and philosophers still argue about it."

  **Closing:**
  "Keep your Definition Worksheets. Next week, bring them to lecture. When Bentham talks about 'summing pleasures,' ask yourself: Summing what? When Mill talks about 'quality,' ask yourself: Is he fixing the problem you found today, or changing the subject?"
