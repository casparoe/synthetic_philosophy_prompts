      *   Interpretation flags? Yes, will add a note on Attitudinal vs. Sensation Hedonism.

  9.  **Writing the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Attack" phase is structured so it doesn't devolve. Give them specific criteria for a successful attack.
      *   *Correction:* Ensure the TA knows *when* to intervene during the group work.
      *   *Correction:* Be very clear in the debrief that the activity sets up a *strawman* of hedonism (Sensation Hedonism) which makes the heterogeneity problem easier to find, but modern hedonists have responses. This addresses the "what the activity can't reproduce" requirement.

  10. **Final Review against "Start directly" constraint:** Ensure no preamble like "Here is the lesson plan." Just jump into the Activity Title.

