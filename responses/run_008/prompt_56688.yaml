      *   *The Nature of the Risk:* The bridge risk is *imminent* and *certain* (conditional on use). The junction risk is *probabilistic*.
      *   *Legal/Fiduciary Duty:* Does the council have a higher duty to known hazards?
      *   *The "Missing" Concept:* **Institutional Integrity and Precedent.** Or **Risk Equity.**
      *   *Better Candidate:* **The Distinction between Ex Ante and Ex Post Perspectives.** Both argue past this. Ashworth argues Ex Post (someone *will* die). Bhatt argues Ex Ante (risk reduction).
      *   *Even Better Candidate:* **The "Rule of Rescue" vs. "Systemic Safety."** They are debating the *Rule of Rescue*. The missing piece is **Procedural Justice** or **Prioritization Frameworks**.
      *   *Best Candidate:* **The distinction between *preventable certainty* and *statistical probability* isn't the only factor.** The missing factor is **Maintenance vs. Improvement.** Option A is *repairing failing infrastructure* (neglect). Option B is *redesigning for optimization* (enhancement).
      *   *Why this matters:* Allowing infrastructure to collapse due to neglect (Option A) creates liability and signals incompetence. It's a failure of basic duty. Option B is an upgrade.
