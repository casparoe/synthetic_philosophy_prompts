      *   **Move 4 (Bhatt):** Sound. Highlights the "Repugnant Conclusion" of non-aggregation.
      *   **Overall Winner:** Bhatt is more right for *governance*, though Ashworth captures a vital moral intuition. In public safety, numbers must count, or we fail the majority.
      *   **The Missing Piece:** **The Distinction between Negligence and Optimization (The Baseline Duty).** Option A is fixing a known defect (negligence). Option B is improving a system (optimization). The council's primary duty is to not let things break, before making them better. This supports Option A *without* accepting Ashworth's moral reasoning, and acknowledges the urgency *without* dismissing Bhatt's arithmetic.

      *(Refining the "Missing Piece")*: Is that too pragmatic? Maybe the missing piece is **Risk Equity**. Ashworth worries about the one. Bhatt worries about the many. Neither worries about the *distribution*. Is it fair to concentrate risk?
      Actually, the "Maintenance vs. Optimization" is stronger because it addresses the *context* (Infrastructure Committee).
      Let's stick with **The Baseline of Duty (Maintenance vs. Enhancement).** It cuts the Gordian Knot.

      *(Wait, one more check)*: Ashworth says "no one could reasonably reject." Bhatt says "morality must register arithmetic."
