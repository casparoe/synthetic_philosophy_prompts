  2.  **Deconstruct the Arguments (Move by Move):**

      *   **Ashworth Move 1 (The Initial Claim):**
          *   *Argument:* Small risk reductions can't be aggregated against a near-certain death. Identifiable victim > Statistical victims.
          *   *Principle:* Scanlon's Contractualism ("no one could reasonably reject").
          *   *Reasoning:* The bridge user loses everything; others lose imperceptible odds.
          *   *Evaluation:* This is the "Identifiable Victim Effect" formalized philosophically. It's emotionally powerful but mathematically problematic. Is it *sound*? In strict utilitarian terms, no (1 < 4). In contractualist terms, maybe. But the claim that risks *cannot* be aggregated is controversial in moral philosophy (the " aggregation problem").
          *   *Verdict:* Rhetorically effective, philosophically contested (partially mistaken regarding aggregation).

      *   **Bhatt Move 1 (The Reductio ad Absurdum):**
          *   *Argument:* Ashworth's logic forbids public health/safety measures (chlorine, vaccines) that impose tiny risks/costs to save lives.
          *   *Reasoning:* Statistical deaths are real. Morality shouldn't hinge on petitioning/names.
          *   *Evaluation:* This is a strong counter-example. Public health ethics relies on aggregating small risks. If Ashworth is right, modern governance collapses.
          *   *Verdict:* Sound. It exposes the dangerous implication of Ashworth's absolute rule.

      *   **Ashworth Move 2 (The Distinction):**
          *   *Argument:* Imposing tiny risk $\neq$ harming. Individual claims are weak. One strong claim > many weak claims (non-aggregation).
          *   *Reasoning:* Distinguishes between *ex ante* (risk) and *ex post* (harm). Consistent to allow chlorination (weak claims) but deny bridge (strong claim vs. weak claims).
          *   *Evaluation:* This is the core of Scanlonian contractualism (specifically the "Individualist Restriction"). It attempts to solve Bhatt's objection by saying weak claims don't sum up.
          *   *Verdict:* Philosophically sound (within its framework), but counter-intuitive. It admits the "defect" Bhatt pointed out as a feature.

      *   **Bhatt Move 2 (The Cost of the Principle):**
          *   *Argument:* If weak claims never combine, we choose higher death tolls whenever deaths are diffuse. Defunding road maintenance for visible hazards.
          *   *Reasoning:* A morality ignoring the arithmetic of scattered deaths is defective.
          *   *Evaluation:* This hits the practical bullet. If the principle leads to more deaths overall, is it a good principle? It challenges the *consequences* of Ashworth's view.
          *   *Verdict:* Sound. It highlights the moral cost of non-aggregation.

  3.  **Evaluate "Who is More Right Overall":**
      *   Ashworth captures the *human* intuition and the duty of care to specific constituents. She aligns with deontological/consequentialist hybrid views that prioritize certainty over probability.
