      *   *Refinement:* Bhatt is more right about the *outcome* (lives saved), but Ashworth is more right about the *political legitimacy* of the decision. However, the prompt asks who is more right *overall*. Usually, in safety engineering and public policy, the statistical life (VSL - Value of a Statistical Life) dominates. Bhatt wins on policy logic, Ashworth wins on moral intuition. I need to weigh these. Bhatt's argument prevents systemic neglect. Ashworth's argument prevents specific injustice. Systemic neglect kills more. Bhatt is more right *for a committee responsible for aggregate safety*.

  4.  **Identify the "Missing Thing" (The Synthesis/Third Perspective):**
      *   What are they both ignoring?
      *   *Risk Perception/Psychology:* They treat risk as objective. It's not.
