      *   Tackle the "Make-Work" coherence problem (Arendt/Graeber).

  10. **Final Polish:** Ensure tone is seminar-appropriate (academic but accessible), clear headings, specific philosophical concepts. (Proceed to generate output based on this thought process).

  *(Self-Correction during drafting)*: I should make sure to mention that the "Automation is good" rhetoric often assumes a *consumer* identity (free time to consume) while the "Welfare is bad" rhetoric assumes a *producer* identity. This shift in subject position is key.

