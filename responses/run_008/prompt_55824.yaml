          *   High stakes require higher certainty for *intervention*, which looks like requiring more evidence for "knowledge."
      *   **The "Know" vs. Probability Question:**
          *   Why not just use numbers?
          *   *Cognitive Load:* Numbers are hard to process in real-time.
          *   *Speech Act Theory:* Saying "I know" transfers responsibility. Saying "70%" leaves it ambiguous.
          *   *Trust/Reassurance:* "I know it's nothing" is therapeutic. "There's a 95% chance it's nothing" is anxiety-inducing.
          *   *Defensive Medicine:* "I know" creates liability if wrong. "We are ruling out" protects against liability.
      *   **Internal Consistency:**
