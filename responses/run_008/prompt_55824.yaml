answer: |-
  This is a remarkably sharp observation. You have essentially reverse-engineered a major debate in contemporary epistemology just by listening to dinner table stories. Your partner is practicing medicine in a way that sits right on the fault line between **Classical Invariantism** and **Pragmatic Encroachment**.

  Here is the breakdown of the theory baked into her practice, how it relates to medical decision science, and what would happen if you tried to sanitize the language into pure probabilities.

  ### 1. The Name of the Debate: Pragmatic Encroachment
  The specific debate your partner was likely recalling is called **Pragmatic Encroachment**.

  *   **Classical Invariantism (The Traditional View):** Whether a person *knows* a proposition depends only on truth-relevant factors (evidence, reliability, truth). Practical stakes (what happens if you're wrong) do not change whether you *know*; they only change what you *do* based on that knowledge.
  *   **Pragmatic Encroachment (The View Your Partner Describes):** Practical stakes *do* affect whether you count as "knowing." If the cost of being wrong is low (young healthy sore throat), less evidence is required to legitimately claim "I know." If the cost is high (pregnant patient, chest pain), the same amount of evidence is insufficient for knowledge, even if the statistical probability is identical.

  In the clinic, your partner's language ("I know" vs. "We can't call it yet") tracks **Pragmatic Encroachment**. She is treating "knowledge" as a status that is sensitive to the stakes of the error.

  ### 2. The Mechanism: The Diagnostic Threshold Model
  While the *language* sounds like epistemology, the *math* behind it is **Decision Theory**, specifically the **Pauker and Kassirer Diagnostic Threshold Model** (1980). This is the standard framework taught in clinical reasoning.

  It posits two thresholds based on probability:
  1.  **The Test Threshold:** Below this probability, you do nothing (it's not worth the cost/risk of testing).
  2.  **The Treatment Threshold:** Above this probability, you treat (the risk of treatment is lower than the risk of missing the disease).

  **How stakes move the thresholds:**
  *   **Low Stakes (Young, healthy sore throat):** The cost of missing a rare bacterial infection is low; the cost of antibiotics is low. The "Treatment Threshold" is very low. She can cross it with just clinical intuition. She says "I know" because she has crossed the action threshold.
  *   **High Stakes (Chest pain in diabetic):** The cost of missing an MI (heart attack) is death. The "Treatment Threshold" is effectively 100% (or close to it). Even if she thinks it's 90% likely to be reflux, she is mathematically forbidden from acting on "knowledge" of reflux until she rules out the MI.

  **So, does knowledge shift, or just action?**
  Technically, under Invariantism, her *credence* (subjective probability) might be the same in both cases, but her *threshold for assertion* moves. However, in medicine, a "Diagnosis" is not just a description of reality; it is a **commitment to a management plan**. Because the definition of a diagnosis includes "sufficient certainty to act," the stakes *do* encroach on the definition of the diagnosis itself.

  ### 3. Is it Consistent with Evidence-Based Medicine (EBM)?
  It feels inconsistent because EBM sounds like it demands objective, stake-independent truth. But modern EBM is actually defined as the integration of three things:
  1.  Best research evidence.
  2.  Clinical expertise.
  3.  **Patient values and circumstances.**

  "Patient circumstances" includes the stakes. EBM explicitly mandates that the *level of evidence required* changes based on the risk/benefit ratio of the intervention.
  *   To prescribe ibuprofen for a healthy 20-year-old, low-level evidence (clinical gestalt) is "Evidence-Based."
  *   To prescribe ibuprofen for a pregnant woman or a renal failure patient, high-level evidence (labs, imaging) is required to be "Evidence-Based."

  So, the practice is internally consistent. The "Evidence" in Evidence-Based Medicine is not raw data; it is **data weighted by utility.**

  ### 4. Why Not Just Use Probabilities? (The Value of "Know")
  You asked what would be lost if doctors quoted exact posterior probabilities (e.g., "There is an 85% chance this is viral") instead of using knowledge claims ("I know it's viral").

  **A. Cognitive Bandwidth and Heuristics**
  Human brains are bad at calculating expected utility from raw percentages in real-time. "I know" is a cognitive shorthand for "Probability > Action Threshold." It allows the doctor and the patient to bypass complex math and move to the next step (rest, fluids).

  **B. Speech Act Theory and Responsibility Transfer**
  This is the most critical function. In philosophy of language, saying "I know" is a **performative utterance**.
  *   When a doctor says, "I know it's nothing," she is not just reporting a probability; she is **accepting liability**. She is saying, "I will bear the burden if this turns out to be wrong."
  *   When she says, "We need to rule out the bad thing," she is explicitly **withholding the transfer of responsibility**. She is telling the patient, "We are still in the uncertainty zone, and you must participate in the vigilance."

  If she said, "There is a 98% chance it's nothing," the patient hears, "There is a 2% chance I die." That creates anxiety. "I know it's nothing" creates reassurance. The word "know" does emotional labor that a probability cannot.

  **C. Defensive Medicine vs. Moral Regret**
  You noted the ambiguity between fear of lawsuits and fear of harming the patient. In the threshold model, these are just different "Cost" variables in the same equation.
  *   **Cost of False Negative (Medical):** Patient harm/death.
  *   **Cost of False Negative (Legal/Professional):** Lawsuit/Board complaint.
  *   **Cost of False Negative (Psychological):** Doctor's regret/sleep loss.

  All three raise the threshold for "knowing." The system doesn't distinguish between them because the *behavior* (order the test) is the same. However, this creates the "underdetermination" you sensed. Is she testing for the patient or for herself? The epistemology doesn't care; the decision matrix treats both as "Costs of Error."

  ### 5. What Would Change if We Dropped "Know"?
  If you forced a clinic to operate on explicit probabilistic reporting with fixed thresholds:

  1.  **Loss of Therapeutic Alliance:** Patients generally want authority, not statistics. "I know" conveys confidence that calms the autonomic nervous system. "85%" conveys risk that activates it.
  2.  **Paralysis by Analysis:** If every diagnosis required an explicit probability calculation, throughput would plummet. Medicine relies on **Pattern Recognition** (System 1 thinking) for low-stakes cases and **Analytic Reasoning** (System 2) for high-stakes cases. The word "know" signals which system is running.
  3.  **Ambiguity of Action:** If a doctor says "90% viral," does the patient go home? If they say "I know it's viral," the patient goes home. "Know" closes the loop; probability leaves it open.

  ### Summary
  Your partner's practice presupposes a hybrid view:
  *   **Metaphysically:** It leans toward **Pragmatic Encroachment**. The status of "Known Diagnosis" is sensitive to stakes.
  *   **Operationally:** It is **Decision Theory**. She is moving action thresholds based on expected cost.
  *   **Linguistically:** It is **Speech Act Theory**. "Knowing" is a tool to transfer responsibility and reduce anxiety.

  The "inconsistency" you feel is the friction between **Truth** (what is happening in the body) and **Utility** (what we should do about it). Medicine is not a science of truth; it is a technology of action. In a technology of action, "knowledge" is defined by "sufficient certainty to proceed," and since the risk of proceeding changes, the definition of knowledge must change with it.

  If she stopped saying "I know" and started saying "The probability exceeds the treatment threshold," she would be epistemologically more precise, but clinically less effective. The word "know" is a feature, not a bug—it's the interface between the uncertainty of biology and the necessity of action.
