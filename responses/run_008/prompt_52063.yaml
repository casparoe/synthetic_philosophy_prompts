answer: |-
  This is a sophisticated problem that cuts to the core of the tension in Du Bois's aesthetic theory: the friction between his training as a sociologist (who values empirical truth, even when ugly) and his role as a political strategist (who values racial capital and public perception).

  To draft your seminar paper, you need to isolate the machinery of his gatekeeping. Based on the track record you provided, here are two competing rules that fit his past verdicts but diverge on your test case, *Red Dirt Sunday*.

  ### Two Competing Rules

  **Rule 1: The Sociological Indictment (The "Truth" Standard)**
  *   **The Mechanism:** This rule evaluates the *internal etiology* of the narrative. It asks: Does the work correctly identify the structural causes of Black suffering? If the "ugliness" (gambling, debt, violence) is depicted as the result of external oppression (the plantation economy, the mob) rather than internal racial nature, the work is valid.
  *   **Track Record Fit:** This fits his condemnation of Dixon (who lied about causes, blaming Black nature) and his *Criteria of Negro Art* essay (which explicitly permits "ugliness" and "suffering" so long as they are truthful). It aligns with Du Bois the sociologist (*The Philadelphia Negro*), who believed exposing the mechanics of exploitation was a service to the race.
  *   **Prediction for *Red Dirt Sunday*:** **Acceptance.** The novel offers a "sincere indictment of the plantation economy." The suffering is contextualized by debt peonage and white mob violence, not inherent shiftlessness. The "daughter dreaming of Fisk" provides the necessary seed of humanity. The fact that it is naturalist is less important than the fact that it is *accurate* about the system.

  **Rule 2: The Representational Ledger (The "Utility" Standard)**
  *   **The Mechanism:** This rule evaluates the *external reception and racial balance sheet*. It asks: How does this work alter the public standing of the Negro in the eyes of the powerful? If a work feeds the white gaze's appetite for tragedy or primitivism, or if it fails to provide a "counter-narrative" of capability and refinement, it is treasonous, regardless of its structural accuracy.
  *   **Track Record Fit:** This fits his disgust with *Home to Harlem* (which whites devoured as "primitive"), his warmth toward Fauset (who depicted the Talented Tenth and respectability), and the 1926 Symposium (warning against art shaped by white approval). It aligns with Du Bois the activist, who viewed *The Crisis* as a tool for civil rights advancement.
  *   **Prediction for *Red Dirt Sunday*:** **Rejection.** The book sells overwhelmingly to white readers who celebrate it as "free of propaganda." For Du Bois, all art *is* propaganda; if white critics say it isn't, they mean it does not challenge their power. By offering suffering without organized resistance or an uplift arc, it adds to the ledger of Black pathology. The "Fisk dream" is too thin to offset the weight of the mob ending.

  ### Best Guess: The Verdict

  Du Bois would **condemn** *Red Dirt Sunday*.

  **Reasons for Preference:**
  1.  **The Proximity of the McKay Review:** Your test case is set in 1929. Du Bois's review of *Home to Harlem* appeared in 1928. The visceral language ("needed a bath") suggests a moral contamination that overrides sociological accuracy. McKay's book also depicted systemic pressures, but Du Bois focused on the *image* projected: cabarets, sex, and shiftlessness. *Red Dirt Sunday* risks the same charge: it presents Black life as a cycle of victimhood and vice without the "heroism" Du Bois demanded in *Criteria*.
  2.  **The "Propaganda" Tell:** The most damning detail in your specification is the white critics' praise: "refreshingly free of what one of them calls the propaganda novel." In 1926, Du Bois staked his reputation on the claim that "all Art is propaganda." A white critic praising the book for *lacking* propaganda is effectively telling Du Bois, "This book does not threaten us." If the work fails to function as a weapon for the race, it fails Du Bois's primary criterion.
  3.  **The Fauset Counter-Weight:** Du Bois's sustained support of Jessie Fauset is instructive. Fauset's novels were often criticized by younger writers (like Hughes) for being too bourgeois. Du Bois supported them because they proved Black capacity for high civilization. *Red Dirt Sunday* does the opposite: it proves Black vulnerability. In a period where the NAACP was fighting against lynching and for anti-lynching legislation, Du Bois likely viewed art that centered on Black victimhood without resistance as politically demobilizing.

  ### The Separating Case

  To cleanly separate Rule 1 (Sociological Indictment) from Rule 2 (Representational Ledger), you need a case where the **content remains identical** but the **context of consumption changes**.

  **The Minimal Change:**
  Suppose *Red Dirt Sunday* is published not by a major New York house, but by a small Black press or serialized in *The Crisis*. Suppose it is read primarily by Black audiences and used to raise funds for sharecropper defense unions. White critics ignore it or condemn it as "incendiary."

  *   **Rule 1 Prediction:** **No Change.** The text's sociological accuracy is intrinsic. It is still a valid indictment.
  *   **Rule 2 Prediction:** **Acceptance.** The utility has flipped. The book is no longer feeding the white gaze; it is arming the race. The "propaganda" value is now positive.

  If Du Bois reviews this version warmly, you have proven that his gatekeeping is driven by **Reception/Utility (Rule 2)**, not just Textual Truth (Rule 1). If he still condemns it for being "too negative," then his rule is fundamentally about **Respectability/Content (a stricter version of Rule 2)**.

  ### The Underdetermined Verdict

  There is a verdict here that his track record genuinely underdetermines: **The Permission to Lie.**

  **The Principle at Stake:** *Is the ultimate value Reality or Liberation?*

  Du Bois's track record shows he hates lies that harm the race (Dixon) and truths that harm the race (McKay). But what about **lies that help the race**?
  Suppose a novel depicts Black sharecroppers organizing a successful, violent insurrection that drives out the plantation owners—a historical falsehood for 1929, but an inspiring myth.
  *   **The "Truth" Rule** (from *Criteria*) suggests he should reject it for falsifying the "suffering" and "ugliness" that also belong in the picture.
  *   **The "Propaganda" Rule** (from *Criteria* and his career) suggests he should embrace it, as it serves the race's purpose and counters white supremacy.

  Du Bois never explicitly resolves whether "Truth" is a deontological constraint (never lie) or a consequentialist tool (lie only if it hurts us). In *Red Dirt Sunday*, he condemns the truth because of its consequences. This implies that for Du Bois, **Liberation trumps Reality.** If a truthful book disarms the race, it is bad art. If a false book arms the race, his track record leaves open the possibility he might endorse it, though his commitment to "science" makes this the deepest tension in his editorial philosophy.

  For your paper, this suggests Du Bois is not a literary critic in the aesthetic sense, but a **manager of racial reputation**. His "rule" is not about literature, but about the strategic deployment of narrative in a white supremacist public sphere. *Red Dirt Sunday* fails not because it is poorly written, but because it is strategically vulnerable to co-option.
