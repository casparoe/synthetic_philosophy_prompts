      *   **Rule 2: The Reception/Utility Test (The "White Gaze" Audit).** Focuses on *how* the book lands in the world and who enjoys it.
          *   *Logic:* If white readers consume it as validation of inferiority or "primitive" truth, the book is functionally anti-Black propaganda, regardless of intent. Art must build racial capital.
