      *Separating Case:* A book with the *same* content but published anonymously or in *The Crisis* first, framing it explicitly as evidence for the NAACP. If Du Bois likes it *then*, it's about Context/Frame (Rule 2). If he still hates it, it's about Content (Rule 1).
