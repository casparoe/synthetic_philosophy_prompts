          *   *Rule 2: The "Weaponized Truth" Standard.* Art must be truthful, but the truth must be weaponized *for* the race. If the truth disarms the race (by making them look helpless or beastly to whites), it is treasonous.
          *   *Actually, the prompt asks for rules that fit the track record but diverge on the Test Case.*
          *   *Test Case Nuance:* The book indicts the economy (Good for Du Bois?) but has no resistance/uplift (Bad for Du Bois?) and whites love it as "authentic" (Very Bad for Du Bois?).
          *   *Rule 1: The "Political Utility" Rule.* Does this book help the fight for civil rights *now*? Does it mobilize? Does it counter the specific arguments used by oppressors?
          *   *Rule 2: The "Gaze/Reception" Rule.* Who is this book for? If it satisfies the white gaze's desire for tragedy/primitivism, it is compromised, regardless of the author's intent or the structural critique.

      *   *Let's try to make them distinct predictions.*
          *   *Rule 1 (Structural Causality):* If the book correctly identifies the *cause* of suffering (economic exploitation/white mob), it passes. The "ugliness" is justified because it indicts the system.
