      *One final check on Du Bois's actual view of "Truth":* In "Criteria," he says, "I do not care a damn for any art that is not used for propaganda." But he also says, "The point I am now insisting upon is merely this: that the merit of art lies not in its propaganda value but in its ability to tell the truth." Wait, that's a tension. He says art *is* propaganda, but good propaganda requires truth.
