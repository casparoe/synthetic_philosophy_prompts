  3.  **Formulate Competing Rules (Hypotheses):**

      *   *Hypothesis A: The "Strategic Uplift" Rule (The Respectability/Counter-Narrative Model).*
          *   *Logic:* The primary function of Black art is to combat white prejudice by presenting the best possible image of the race. Truth is subordinate to political utility. If a truth reinforces a stereotype white people already hold (shiftlessness, hypersexuality, violence), it is forbidden, regardless of artistic merit or systemic critique.
          *   *Fit:* Explains Fauset (good), McKay (bad), Dixon (bad). Explains the 1926 Symposium warning against white approval.
          *   *Weakness:* Seems to contradict "Criteria" where he allows "ugliness" and "suffering."

      *   *Hypothesis B: The "Systemic Truth" Rule (The Sociological/Structural Model).*
          *   *Logic:* The primary function is to reveal the structural causes of Black suffering. "Ugliness" is permissible *if* it is contextualized as the result of oppression (economic, racial) rather than inherent racial traits. The enemy is not the depiction of suffering, but the depiction of suffering as *natural* or *innate*.
