      *   **Best Guess:** Du Bois would **condemn** it.
          *   *Reasoning:* The McKay review is the strongest proximate evidence (1928 vs 1929 test case). Du Bois's visceral reaction ("needed a bath") wasn't about structural analysis; it was about the *image* projected. The fact that white critics call it "not propaganda" is the smoking gun. For Du Bois, *all* art is propaganda. If whites say it isn't, they mean it doesn't challenge them. It comforts them. That makes it dangerous. The "thin counterweight" of the daughter dreaming of Fisk is likely insufficient against the weight of the mob/debt ending.
      *   **Separating Case:** What would distinguish the rules?
          *   *Scenario:* A book that is structurally accurate (blames system) but is *ignored* by white critics, yet inspires Black organizing.
          *   *Or:* A book that is structurally simplistic (blames "bad apples") but depicts Black triumph and is loved by the NAACP.
          *   *Better:* A book identical to *Red Dirt* but published by a Black press, read *only* by Black readers, and used to raise funds for sharecropper defense.
          *   *Why:* Rule 1 (Etiology) says the book is the same (Truth is Truth). Rule 2 (Reception) says the book is now Good (Utility is secured).
      *   **Underdetermination:** The tension between "Truth" and "Propaganda."
          *   Du Bois claims Truth is a criterion. But if Truth harms the Propaganda goal, which wins?
          *   *Principle:* Is the ultimate value *Reality* or *Liberation*? If Liberation requires myth-making (hiding the gambling/preacher hypocrisy), would Du Bois allow it? His track record suggests he might, but his essays say he wouldn't.

