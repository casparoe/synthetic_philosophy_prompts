              *   *Utilitarian Reply:* If you accepted Phase 1, you accept sacrificing present experiences for future ones. Why is 'future self' different from 'other person'? Both are distinct experiential states.
              *   *Objector Reply:* Memory/identity binds the self; no such bond binds strangers.
