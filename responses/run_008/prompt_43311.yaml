answer: |-
  **Activity: The Welfare Allocation Task**

  **Materials:** Worksheet tracking "Welfare Units" (WU) across two periods. Pen.

  **Timeline (75 min):**

  1.  **Phase 1: The Single Life (20 min).** Groups of 3 maximize total WU for "Casey" over 80 years.
      *   *Option A (Sacrifice):* -40 WU (ages 20-40), +90 WU (ages 60-80). Net +50.
      *   *Option B (Balance):* +10 WU (ages 20-40), +20 WU (ages 60-80). Net +30.
      *   *Frame:* Prudent life-planning (e.g., med school effort vs. later earnings/health). Most choose A. It feels rational.

  2.  **The Switch (5 min).** Collect sheets. Facilitator (neutral tone): "Data correction. The '20-40' cohort and '60-80' cohort are distinct populations living simultaneously. The -40 WU is inflicted on Group Alpha; the +90 WU goes to Group Beta. Consent is impossible; allocation is mandatory."

  3.  **Phase 2: The Distribution (20 min).** Groups review the *same* numbers. Vote: Is Option A permissible? Expect hesitation/refusal despite higher net utility. Ask them to write down *why* it feels different.

  4.  **Debrief (30 min).**
      *   *Question 1:* "The arithmetic is identical. Why did permission vanish?" (Elicits: Rights, Consent, Identity).
      *   *Question 2:* "If Phase 1 was rational, what justified sacrificing Young Casey?" (Elicits: It's still Casey).
      *   *Map:* Phase 1 models Utilitarian aggregation (Parfit: persons are sequences of experiences). Phase 2 triggers Rawls' "Separateness of Persons" (society isn't a super-person).
      *   *Utilitarian Reply:* If Phase 1 is rational, why? You sacrifice present experiences for future ones. Why is 'future self' morally distinct from 'other person'? Both are distinct experiential states. The boundary is arbitrary.
      *   *Objector Reply:* Psychological connectedness (memory/anticipation) binds the self; no such bond binds strangers. Sacrificing *me* for *me* is prudence; sacrificing *me* for *you* is exploitation.

  **Pitfalls:**
  *   *Refusal in Phase 1:* Students reject negative WU. *Fix:* Frame as "effort/discomfort" (studying), not torture. Ensure they see the net benefit as overwhelmingly positive.
  *   *No tension in Phase 2:* Students say "Still fine." *Fix:* Emphasize *involuntary* sacrifice. Group Alpha gets no compensation; they just suffer.
  *   *Facilitator Bias:* Do not nod when they reject Phase 2. Stay neutral. The discomfort must be internal.

  **Limitation:** The activity simulates *intuition*, not *metaphysics*. It cannot resolve whether personal identity is deep or shallow. It creates the cognitive dissonance, but cannot explain *why* identity matters. You must lecture on Parfit's *Reasons and Persons* to explain the reductionist view of persons. The activity creates the puzzle; the lecture provides the theoretical tools to solve it. Also, the activity hides the issue of consent in Phase 1 (Casey consents to her own plan) which is absent in Phase 2; you must explicitly disentangle consent from identity in the debrief, or students will conflate the two objections.
