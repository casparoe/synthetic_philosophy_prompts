      *   **Phase 2 (Inter-personal):** Reveal that "Young Alex" and "Old Alex" are actually different people (Gen Z vs. Boomer). The -50 falls on Group A, +100 on Group B. Same arithmetic, different distribution.
      *   **Switchover Script:** Needs to be neutral but revealing. "Actually, these aren't time slices..."
      *   **Debrief:** Connect to Rawls (separateness) vs. Parfit (reductionism).
      *   **Pitfalls:** Students might refuse Phase 1. Or they might not feel the tension in Phase 2. Need to enforce the "rational choice" frame in Phase 1.
