          *   (6) says killing wrongs the *victim*. If death isn't bad for the victim (per 1), what is the wrong? Usually, the wrong of killing is depriving them of life (a harm). If death isn't a harm, killing's wrongness is attenuated unless based on (5)-style posthumous interests or violation of autonomy that persists. But (1) is strong: "nothing... happens to anyone."
      *   **Tension B (Severe): (1) vs. (3).**
          *   (1) says death is not bad.
