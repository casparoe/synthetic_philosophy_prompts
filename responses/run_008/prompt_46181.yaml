  7.  **Refining the "Diagnosis":**
      *   The "Translation" argument (that they are equivalent) is often a *reductio* against the idea that formalism alone solves it.
      *   The real disagreement is **Axiological**. Which desideratum is the dealbreaker?
      *   Miller: Language Invariance is the dealbreaker. (If it changes with 'grue', it's not objective).
