      *   Oddie argues that without likeness, we can't account for scientific progress (Newton is closer to Einstein than Aristotle, even if both are strictly false). Content ordering often fails to capture this intuition without looking like likeness.
      *   *Diagnosis:* It's not merely verbal. It's a clash of *constraints*. Miller prioritizes Language Invariance. Oddie prioritizes the Intuitive Ordering of Standard Examples. You can't have both (roughly).

  4.  **Formulate the Diagnosis:**
