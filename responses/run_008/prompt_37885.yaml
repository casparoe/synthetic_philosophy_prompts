  Your friend's comparisons provide rhetorical cover but fail structurally, meaning his conclusion collapses unless he abandons the claim that the chamber simply "mirrors" the people.

  The jury analogy maps random selection and civic duty correctly but breaks on the distinction between finding facts and setting values. Jurors operate within a legal framework constructed by others, determining what happened rather than what should happen, whereas a legislative chamber defines the values and rules themselves. This break matters because trusting strangers to apply existing standards is fundamentally less risky than trusting them to create new ones without electoral accountability. While jurors do import values into credibility assessments, the judge constrains the outcome; a lottocratic legislature has no judge, making the randomness of the decision-maker the sole constraint on power. A secondary break exists in the scale of consequences, but this does not invalidate the comparison as much as the difference in function does, since gravity alone does not justify the method of selection.

  The sampling analogy maps demographic representation correctly but breaks on participation bias and the effects of deliberation. On attendance, mandatory service and pay mitigate but do not erase self-selection, as those willing to serve long terms differ systematically from those who refuse, creating an availability bias that elections avoid by selecting for ambition rather than time. This break is practical rather than theoretical; it complicates implementation but does not destroy the logic of representation. On deliberation, however, the break is fatal to the "standing poll" claim: once members hear evidence, they cease to mirror the uninformed public and become a trustee body. This matters because it forces a choice between legitimacy derived from reflecting the people's current will versus legitimacy derived from producing better outcomes, and the friend's argument tries to claim both without paying the theoretical cost. The statistical mirroring only holds at the moment of selection, not at the moment of voting.

  Ultimately, the comparisons were carrying the entire weight of the argument. Once you acknowledge that deliberation destroys the mirror and lawmaking differs from fact-finding, the claim shifts from "this is the people ruling" to "this is a subset of people ruling for the rest," which requires a justification based on competence or virtue rather than statistical representation. Without the jury and polling analogies to bypass the need for electoral accountability, lottocracy must explain why an informed minority should override an uninformed majority, a much harder case to make than the one your friend presented.
