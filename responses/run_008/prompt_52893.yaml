answer: |-
  Subject: Re: Draft notes on verbal disputes and the elimination test

  Dear Colleague,

  Thank you for sharing these notes. It is a pleasure to cast a eye over this; the topic is sufficiently knotty that a fresh perspective might help untangle some of the threads before you commit to the full draft. I have kept your request for British English in mind throughout, so you will find the register below adjusted accordingly.

  Here are my thoughts on the four specific areas you highlighted, plus a note on that technical worry regarding plural quantification.

  ### 1. Section 2: The Tables/Numbers Contrast

  You ask whether this contrast is doing real work or if you are merely selecting cases to fit the thesis. I am afraid I think there is a risk of the latter, though it is not fatal if handled carefully.

  The trouble lies in how you characterise the realist about tables. You claim the dispute is verbal because there is no difference in what they would "predict, bet on, or do". However, the common-sense ontologist (perhaps someone like van Inwagen or even a Moorean) would insist that there *is* a difference in what they bet on: the realist bets on the existence of a composite object; the nihilist bets against it. To say this difference doesn't matter is to presuppose that only empirical predictions matter, which begs the question against the substantive ontologist.

  The numbers contrast is sharper, but also perilous. You claim the numbers dispute is *not* role-verbal because of explanatory commitments (the indispensability argument). This is standard Quinean terrain. However, if a fictionalist about mathematics (like Field) comes along and says, "I can explain everything the Platonist explains using only concrete entities and logical consistency," you are back in the same boat as the tables case. If the fictionalist passes your practical equivalence test, you must call it verbal. But many metaontologists insist the mathematics dispute is substantive precisely because of the modal robustness of numbers.

  **How to force the choice:** To save this section, you need to clarify what counts as a "first-order matter". If you define it narrowly (e.g., spatiotemporal distribution of mass-energy), the tables dispute looks verbal, but you look like you are smuggling in nihilism as the default. If you define it broadly (including conceptual truths), the dispute might look substantive. I suggest you bite the bullet: admit that your criterion privileges a pragmatic or naturalistic ontology, and argue that *this privilege is justified*. Don't try to pretend the criterion is neutral; argue that neutrality is the wrong goal.

  ### 2. Section 3: Circularity of the Practical Equivalence Criterion

  You asked me to be blunt if the circularity is fatal. Here goes: **it is potentially fatal, unless you refine the Ramsey-sentence move.**

  You define a verbal dispute as one where parties agree on all first-order matters but differ on linguistic bookkeeping. The problem, as you note, is specifying the "first-order matters" without using the contested vocabulary.
  *   If you describe the world using "simples arranged table-wise", you have already sided with the nihilist. The realist will say you have left out the fact *that there is a table*.
  *   If you describe the world using "tables composed of simples", you have sided with the realist.

  Your proposed solution is a Ramsey-sentence style move: strip the theoretical terms and compare what is left. The worry is that what is left is merely the observational base. If your observational base is sufficiently thin (e.g., sensory stimuli or physical fields), then almost all ontology becomes verbal. This collapses your view into a kind of hard empiricism.

  **Suggestion:** You need to anchor the "first-order matters" in something both parties *actually* accept, not just what they *should* accept. In the tables case, do they both accept the existence of the simples? If the realist denies simples, your base vanishes. If they both accept the spatial relations, use those. But you must acknowledge that this criterion will classify many traditional metaphysical disputes as verbal. If that is your aim, own it. Do not present it as a discovery about the tables dispute specifically, but as a revision of what we count as metaphysics.

  ### 3. Accuracy Check on the Literature

  Broadly speaking, you have the landscape right, but there are some nuances to tighten up so you do not invite easy objections.

  *   **Chalmers:** You are correct that the elimination test is his standard tool. However, Chalmers actually argues that the composition dispute *is* verbal precisely because the nihilist *can* paraphrase the realist. Your twist is that the test *fails* because the realist won't accept the paraphrase. This is a clever divergence, but ensure you distinguish your view from his. He thinks the elimination works; you are saying it fails due to pragmatic entrenchment.
  *   **Hirsch:** His quantifier variance is close to your view, but he focuses on the quantifier meaning itself. You are focusing on the inferential role of sortal terms ('table'). Make sure you distinguish 'role-verbal' from 'quantifier variance'.
  *   **Sider:** You are right to anticipate the objection regarding his distinction between quantifier disputes and existence disputes. Sider argues the quantifier is "joint-carving". If you claim the dispute is verbal, you are effectively denying Sider's claim that existence is a fundamental structure.
  *   **Thomasson:** You worry about collapsing into her easy ontology. She argues that once we fix the application conditions, existence questions are trivial. You are arguing something slightly different: that the dispute is verbal because the *inferential role* is the only thing changing. This is distinct enough, but be careful not to sound like you are saying the realist is "right by default". You seem to be saying neither is right about the world; they are just choosing different tools.

  ### 4. Novelty and Interest

  Is this interesting? Yes. Is it just relabelling? There is a danger of that.

  The idea that some disputes are about "conceptual engineering" or "inferential role" rather than the world is present in Carnap, Price, and perhaps more recently in the work of those focusing on conceptual ethics (like Burgess or Plunkett). However, framing it as a specific failure mode of Chalmers's elimination test is a fresh angle. Most critics say the test is too loose (counts substantive disputes as verbal); you are arguing it is too tight (fails to count some verbal disputes as verbal because the vocabulary is entrenched).

  To make this publishable in a top UK journal (say, *Mind*, *Proceedings*, or *BJPS*), you need to show why this matters. Does it dissolve the composition problem? Does it change how we do metaphysics? If the conclusion is merely "some disputes are verbal in a way Chalmers didn't spot", it might feel like a technical footnote. If the conclusion is "metaontology needs a pragmatic turn because elimination tests miss the role of vocabulary in reasoning", that is a programme worth reading.

  ### 5. The Technical Worry: Plural Quantification

  You were right to worry about this. It is not a quiet assumption; it is a load-bearing wall.

  The nihilist's paraphrase ("simples arranged table-wise") relies heavily on plural quantification over simples. If one rejects plural quantification as ontologically committing (and some do), the nihilist loses their ability to paraphrase the realist. Consequently, your claim that they agree on "first-order matters" collapses, because the nihilist cannot even state the realist's claims without ontological commitment to plurals.

  Furthermore, if the realist denies simples (holding that tables are fundamental), there is no common base of "simples" to agree upon. You need to address whether your criterion requires a shared ontological base (e.g., both must accept simples) or if it works across divergent bases. If the latter, your Ramsey-sentence move becomes much harder to formulate.

  ### Summary Advice

  1.  **Own the Pragmatism:** Do not try to hide the fact that your criterion privileges predictive/explanatory utility over metaphysical structure. Argue for that privilege.
  2.  **Sharpen the Circularity Defence:** Explicitly address how you define "first-order matters" without begging the question. Perhaps appeal to a "common ground" of observation rather than ontology.
  3.  **Clarify the Chalmers Distinction:** Make it clear you are identifying a blind spot in his test, not just repeating his conclusion.
  4.  **Tackle the Plurals:** Add a paragraph acknowledging the reliance on plural logic and why you think it is safe to assume it for the sake of the argument.

  It is a promising piece of work. With a bit of tightening on the neutrality of your criterion, it could make a genuine contribution to the debate.

  Best of luck with the drafting.

  Yours sincerely,

  [Your Name/Persona]
