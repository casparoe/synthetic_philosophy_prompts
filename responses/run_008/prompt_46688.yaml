answer: |-
  This is a classic symptom of doing jurisprudence at the doctoral level: you have outgrown the textbook hybrids but haven't yet found the structural flaw in your own data set.

  Here is the honest answer: **There is no single moral principle that captures all seven verdicts cleanly.** Your "tentative fix" (Limit Retributivism: desert sets bounds, consequences fill the gap) is the standard Hartian move, and you are correct that it fails to resolve the internal tensions in Cases 2 and 3. It treats "desert" as a monolithic input when your intuitions suggest it is doing two different jobs.

  You do not need to throw out your verdicts; you need to stop trying to justify them with a single *moral* theory. Your intuitions track the **hybrid nature of legal institutions**, not the logic of a single moral agent.

  Here is the breakdown of where your principle breaks, what to drop, and how to reconstruct the view.

  ### 1. The Diagnosis: Why the "Band" Theory Fails
  Your "desert as ceiling/floor" model works for Cases 1, 4, 6, and 7. It fails on 2, 3, and 5 because those cases aren't about the *amount* of punishment within a range; they are about the *basis* of liability itself.

  *   **Case 2 (Moral Luck):** The tension arises because you are conflating **Moral Blame** (internal culpability) with **Legal Liability** (external answerability).
      *   *The Fix:* Accept that the law is permitted to track *harm* for consequentialist reasons (insurance, public outrage, resource allocation) even if *moral desert* is identical.
      *   *Verdict to Drop:* Drop the insistence that this *must* be morally unstable. It is only unstable if you demand the criminal law be a perfect mirror of moral blame. If you view criminal law as a regulatory system that *uses* blame but serves social order, the instability vanishes. You can hold that the attempter and completer are *equally wicked* but *differently liable*.
  *   **Case 3 (Dictator vs. Reformed Criminal):** This is a metaphysical problem, not a penal one. You are applying different criteria of **personal identity**.
      *   *The Fix:* For the dictator, you are using a **biological/narrative identity** (he is the same man who signed the orders). For the reformed criminal, you are using a **psychological connectedness** identity (Parfitian reductionism).
      *   *Verdict to Drop:* You must choose one theory of identity, or admit that "Political Justice" (dictators) operates on different rules than "Criminal Justice" (ordinary offenders). The dictator case is likely about **symbolic vindication of victims** (consequentialist/expressive), not strict retribution against the current psychological entity. If you admit the dictator trial is partly expressive/consequentialist, the tension with the reformed criminal dissolves.
  *   **Case 5 (Attempts vs. Conspiracy):** This reveals that your "desert" intuition is actually sensitive to **dangerousness**, not just harm.
      *   *The Fix:* Possession and conspiracy punish *risk creation*, not harm. If you accept risk as a valid basis for liability (within desert bounds), this is consistent.

  ### 2. The Proposed Principle: "Threshold Deontology with Institutional Division of Labor"
  Instead of one principle, adopt a two-tiered justification that matches the institutional reality:

  1.  **The Constraint (Retributive):** No punishment without **Culpable Wrongdoing**. This creates the absolute floor (Case 4: no scapegoating) and the ceiling (Case 1: no over-punishing to balance the books).
  2.  **The Optimization (Consequentialist):** Within the bounds of culpability, the *degree* and *mode* of punishment track **Harm, Risk, and Efficiency**.

  This explains why you accept plea bargains (efficiency within bounds) but hate "sending a message" (exceeding bounds of individual desert). It explains why you accept speeding fines (probability adjustment is efficient) but not scapegoating (violates the culpability constraint).

  ### 3. Application to Your Test Case
  **The Case:** A defendant is charged with one crime (within statute of limitations) from a 20-year string. The prosecutor wants the judge to "take the rest into account" for sentencing.

  **Prediction based on the Principle:**
  This reveals the **seam** you feared.
  *   **Under the Constraint:** The judge cannot *punish* the old crimes directly. That would violate the culpability constraint (they are time-barred; the state lost its right to punish them).
  *   **Under the Optimization:** The judge *can* use the old crimes as evidence of **dangerousness** or **character** to justify a sentence at the top of the range for the *current* crime.

  **The Verdict:** Your principle predicts you should feel **uncomfortable but ultimately accepting** of this practice, provided the sentence does not exceed the statutory maximum for the *charged* crime.
  *   *Why:* It respects the Retributive Ceiling (you aren't punished *for* the old crimes) but utilizes Consequentialist data (you are dangerous) to set the level.
  *   *The Seam:* If the sentence effectively equals what he would have gotten for all 20 years, the "Constraint" is being hollowed out. Your intuition should flag this as a **due process violation** masquerading as sentencing discretion. If the "tail wags the dog," your principle demands you reject it.

  ### 4. Which Verdicts to Drop?
  To make your theory coherent, you need to make one hard choice:

  **Drop the instability in Case 2 (Moral Luck).**
  You say you "can't hold both at once." You must. Adopt the view that **Criminal Liability is not Moral Blame.**
  *   *Reasoning:* If you insist they must match, you are forced into a pure retributivism that cannot explain why we punish negligence or strict liability offenses, or why we care about harm at all.
  *   *Cost:* You concede that the law is not morally perfect.
  *   *Benefit:* It stabilizes your theory. The law punishes the completer more because the *social cost* is higher, not because the *soul* is worse.

  **Alternatively, Drop the Dictator Intuition (Case 3).**
  If you believe psychological connectedness matters for the reformed criminal (which is more philosophically defensible), you must admit the demented dictator *should not* be punished, or only punished in a purely symbolic capacity. Holding that he deserves *full* punishment while the reformed criminal deserves *less* relies on a metaphysical view of identity (the "soul" or "body" persists) that you seem to reject in the criminal case.
  *   *Recommendation:* Keep the reformed criminal intuition. It is more robust. Re-cast the dictator trial as **political hygiene** (consequentialist) rather than criminal justice (retributive).

  ### 5. Confidence and Uncertainty

  **Overall Confidence: 85%**
  I am highly confident that your intuitions map onto a **Limit Retributivist / Hybrid** framework. This is the dominant view in modern liberal jurisprudence for a reason: it matches the practice. The friction you feel is the friction of the theory itself, not a flaw in your reasoning.

  **Point of Least Confidence: Case 3 (The Dictator)**
  I am least sure about how to resolve the Dictator vs. Reformed Criminal tension without bifurcating "Political Justice" from "Criminal Justice."
  *   *Why:* If you treat them under the same theory, you are forced into a Parfitian reductionism that might undermine the legitimacy of international tribunals. If you treat them differently, you risk ad-hocery. My suggestion to classify the dictator trial as "political/consequentialist" is a workaround, not a clean moral solution. You may find that your gut verdict on the dictator is actually driven by **expressive harm** (the need to condemn the regime) rather than **retributive desert** (what the old man deserves). Distinguishing those two is notoriously difficult.

  **Summary Advice:**
  Stop looking for a unified moral field. You are studying *law*, which is a bureaucratic compromise between morality and administration. Your "Tentative Fix" is correct, but you need to explicitly separate **Culpability** (the ticket to enter the system) from **Liability** (what the system does with you). Once you allow Liability to be partially consequentialist (tracking harm, risk, and cost), Cases 2, 5, and 6 stabilize. Case 3 requires you to admit that some trials are political theater, not criminal justice.
