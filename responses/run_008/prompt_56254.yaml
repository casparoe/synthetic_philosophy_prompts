answer: |-
  The current regulatory framework assumes you are only manipulated when information is hidden or actions are blocked, but shifting the rule to ban psychological exploitation would outlaw almost all marketing because human decision-making inherently relies on biases.

  Here is the reasoning behind that line. The implicit theory at work is "procedural autonomy," which cares about whether you *can* make a choice, not whether your desire to choose was engineered. It strictly requires truthfulness (no fake countdowns) and symmetry (canceling shouldn't be harder than signing up). It fits well with things like defaults or checkout candy because, technically, you still have the mechanical ability to say no, even if your brain is wired to say yes. The practice is underdetermined where tradition meets technology; we accept candy aisles and car salesmen because they are entrenched physical norms, while digital equivalents feel like cheating, even though they target the same impulses.

  If you flip the presupposition to ban anything exploiting a cognitive bias, the line moves to outlaw almost every form of influence. Defaults exploit inertia, beauty ads exploit insecurity, and "limited stock" warnings exploit scarcity fear—even if the stock is actually limited. This view collapses as policy because it requires a definition of a "rational desire" that doesn't exist. You cannot separate persuasion from bias exploitation because human reasoning is built on heuristics and emotions; enforcing this would mean banning any attempt to make a product appealing, effectively ending advertising and sales as we know them.
