      *   **Flip the Presupposition:** If "exploiting cognitive bias = manipulation," then almost all marketing dies. Candy aisles, autoplay, defaults, even friendly salespeople. Is this usable? Probably not, because it bans *influence* itself, not just *deception* or *coercion*.

