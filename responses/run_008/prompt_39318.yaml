      *   *Normative Basis:* Liberal neutrality/autonomy.
      *   *Constraint:* No cross-user value aggregation.
      *   *Vulnerability:* The definition of "user," "values," and "harm to others."

  3.  **Drafting the Defeaters (Iterative Process):**

