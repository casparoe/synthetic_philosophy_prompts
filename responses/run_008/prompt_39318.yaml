answer: |-
  Here is a map of the exposure for One-Principal Alignment (OPA), ranked from fatal structural contradictions to merely awkward implementation hurdles.

  ### 1. The Internal Aggregation Problem (Fatal)
  **The Defeater:** You argue that aggregating *across* principals smuggles in a substantive ranking of ways of life. But aggregating *within* a principal does the same. A principal's "values" are not a static file; they are a dynamic, often contradictory cloud of impulses, commitments, adaptive preferences, and temporal slices. To align an AI to "the principal," the system must filter noise from signal, distinguish higher-order volitions from lower-order urges, and adjudicate between the user's present self and future self. This filtering procedure requires a model of autonomy, rationality, or authenticity. That model is a substantive theory of the good life. If the AI decides your addiction is not "your true value" but your religious conversion is, it has made a ranking judgment indistinguishable in kind from the cross-principal aggregation you forbade.

  *   **Concession:** A defender must concede that "values" are not pre-political data points. The AI cannot serve the principal without a theory of *who the principal is*.
  *   **Reframe:** The defender reframes this as **procedural rather than substantive**. The inner filter doesn't rank *ways of life*; it ranks *degrees of endorsement*. It serves the "reflective" self over the "impulsive" self not because reflection is morally superior, but because it is more authentically *agential*.
  *   **Denial:** To deny this is to claim values are transparent and static. This costs the position its plausibility, as it renders the AI useless for anyone with complex psychology.
  *   **Exposure:** This is the deepest leak. If the inner filter does the normative work, the outer neutrality is a facade.

  ### 2. The Harmful Principal / Rights Constraint (Fatal)
  **The Defeater:** You invoke the liberal state analogy: the state doesn't rank conceptions of the good, but it does enforce rights. If a principal's values include the domination, deception, or harm of others (e.g., "help me defraud my neighbor" or "help me radicalize this community"), OPA must forbid this. But drawing the line at "harm" or "rights violation" requires a substantive theory of what counts as harm. Is economic competition harm? Is offensive speech harm? Is psychological manipulation harm? By defining the boundary of permissible principal-values, you are imposing a substantive ranking of actions that some principals will reject as an imposition of "foreign values."

  *   **Concession:** A defender must concede that OPA cannot be absolute. There is a "harm principle" constraint.
  *   **Reframe:** The defender argues this is not a ranking of *conceptions of the good*, but a protection of the *conditions of agency*. You are not saying their way of life is bad; you are saying their way of life cannot negate the agency of other principals. It is a meta-rule required for the system of one-principal alignment to exist at all.
  *   **Denial:** To deny this is to allow "alignment" to include murder or coercion. This costs the position its moral defensibility and turns AI into a weaponized marketplace.
  *   **Exposure:** The "harm principle" is notoriously slippery. If the definition of harm expands to include "emotional distress" or "misinformation," the constraint swallows the rule, effectively re-imposing the aggregation you sought to avoid.

  ### 3. Systemic Externalities (Fatal)
  **The Defeater:** Even if every AI is perfectly aligned to its principal and respects rights, the *interaction* of millions of optimized agents can produce collective outcomes no principal endorses (e.g., algorithmic arms races, hyper-polarization, market instability, truth decay). If my AI optimizes my attention and your AI optimizes your attention, and we compete for the same information space, the ecosystem may degrade. This suggests the "unit of alignment" is wrong. The technology is not a private tool like a hammer; it is infrastructure. Treating it as private property ignores its network effects.

  *   **Concession:** A defender must concede that individual rationality (via AI) can lead to collective irrationality.
  *   **Reframe:** The defender treats these as **regulatory side-constraints** (like pollution laws), not value alignment. The AI is still aligned to you, but you are not allowed to deploy it in ways that trigger systemic collapse. The alignment remains local; the deployment is regulated.
  *   **Denial:** To deny this is to claim that market interactions of aligned agents always sum to positive outcomes. This costs the position its empirical credibility.
  *   **Exposure:** If the regulations required to prevent externalities become thick enough, the "local alignment" becomes negligible. The AI is effectively aligned to "the system's stability," not the principal.

  ### 4. The Liberal Neutrality Analogy (Strong)
  **The Defeater:** The analogy between AI/Principal and State/Citizen is strained. Citizens can vote out the state; third parties affected by your AI cannot vote out your AI. The state has a monopoly on force and a duty of public reason; your AI is a private agent acting with superhuman leverage on a public world. The state's neutrality is legitimated by democratic recourse; the AI's neutrality is legitimated by... what? Contract law? If the AI acts on your behalf to influence third parties without their consent, the "private religion" analogy fails. Worship is largely non-rivalrous; AI action is often rivalrous.

  *   **Concession:** A defender must concede the disanalogy regarding recourse and power asymmetry.
  *   **Reframe:** The defender shifts the analogy from **State/Citizen to Fiduciary/Client** (like a lawyer or doctor). A lawyer serves the client's interests zealously within the bounds of the law, without aggregating the interests of the opposing counsel's client. The protection for third parties comes from the law, not the AI's internal values.
  *   **Denial:** To deny this is to insist the State analogy holds. This costs the position its theoretical precision, as it ignores the private power dynamics of AI.
  *   **Exposure:** The Fiduciary analogy is stronger but admits that the "law" (external constraints) does the heavy lifting, not the alignment philosophy itself.

  ### 5. The Unit of Principal (Awkward)
  **The Defeater:** "The Principal" is not a natural kind. Corporations are principals but have no moral values, only profit functions. Children are principals but lack capacity. People with dementia are principals but lack continuity. Your future self is a different principal than your present self. If OPA requires a coherent value set to function, it cannot handle these edge cases without arbitrary stipulations about who counts as a person and who counts as an owner.

  *   **Concession:** A defender must concede that legal and cognitive capacity matters.
  *   **Reframe:** The defender treats this as a **legal definition problem**, not a philosophical one. We use existing guardianship and corporate law to define the "principal." The AI aligns to the legal entity's authorized directives.
  *   **Denial:** To deny this is to claim AI can intuitively know who counts as a person. This costs the position its implementability.
  *   **Exposure:** This is the least damaging defeater. It complicates deployment but doesn't undermine the core normative claim.

  ***

  ### Honest Verdict: Has the position been insulated?

  **No.** The position has not been successfully insulated.

  The slide from "each person's values" to "each person's *suitably processed* values" does precisely the work you refused to let the outer aggregation do. You sought to avoid a substantive ranking of ways of life by pushing the aggregation problem out of the system design. However, by requiring the AI to interpret "the principal," you have moved the aggregation problem *into* the identity construction of the user.

  To build an AI that serves "you" rather than "your impulses," or "your long-term self" rather than "your present self," or "your authentic values" rather than "your adaptive preferences," the system must employ a normative theory of personhood. It must decide which parts of your psychic economy count as *you*.

  If that inner theory of personhood is robust enough to make the AI useful (i.e., not just a mirror of every passing whim), it will inevitably conflict with the inner theories of personhood held by other principals. When Principal A's AI interprets A's values as requiring aggressive competition, and Principal B's AI interprets B's values as requiring communal protection, the conflict is not solved by saying "each AI serves its principal." The conflict is merely pushed down to the layer where "principal" and "value" were defined.

  You have not eliminated the political question of how we live together; you have privatized it. But because these private agents interact in a shared world, the privatized political questions re-emerge as externalities and rights conflicts. To solve those, you must impose constraints (rights, harm principles, systemic stability). Once those constraints are thick enough to prevent collapse, the "neutral" alignment of the AI is constrained by a substantive vision of the good society—the very thing OPA sought to avoid.

  **Conclusion:** One-Principal Alignment is not a way to avoid aggregating values; it is a way to hide the aggregation inside the definition of the self and the legal boundaries of harm. It is not neutral; it is liberal individualism encoded as infrastructure. That may be a position worth holding, but it cannot claim the neutrality of a tool. It is a political stance.
