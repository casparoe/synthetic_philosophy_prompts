      *   *My assessment:* Yes, it likely does. To define "principal" and "values" requires normative choices that look suspiciously like the aggregation you banned. The "inner procedure" becomes the site of politics you tried to banish from the "outer procedure."

  8.  **Final Polish:** Check against all constraints.
