answer: |-
  Your diagnosis is astute, and your hypothesis that much of the dispute is verbal is largely correct—but only largely. The stalemate persists because the debate conflates three distinct layers: **ontology** (what exists), **causality** (what drives what), and **heuristics** (what models work best).

  While contemporary philosophy of social science has largely abandoned *ontological holism* (the idea that societies are super-organisms existing over and above individuals), *methodological holism* survives because it captures a substantive empirical reality: **macro-regularities often exhibit stability and causal autonomy that cannot be practically or even theoretically reduced to micro-foundations without loss of predictive power.**

  Here is a diagnosis of the structure of the disagreement, an assessment of your "verbal dispute" hypothesis, and a proposal for what constitutes genuine progress.

  ### 1. Diagnosing the Structure of the Disagreement

  The debate feels static because the two sides are often answering different questions while using the same vocabulary.

  **A. The Ontological Layer (Mostly Verbal)**
  *   **Individualism:** Social entities supervene on individuals. There is no "society" apart from the people and their relations.
  *   **Holism:** Social facts (norms, institutions) are *sui generis*.
  *   **Resolution:** Almost no serious philosopher today defends strong ontological holism. Everyone accepts that if you remove all individuals, the society vanishes. The dispute here is verbal: Holists use "existence" to mean "causal efficacy," while Individualists use it to mean "material constitution."

  **B. The Causal Layer (Substantive)**
  *   **Individualism:** All causal powers reside in individuals. Macro-causation is shorthand for complex micro-causation.
  *   **Holism:** Macro-variables (e.g., inflation, social integration) exert downward causation on individuals.
  *   **The Substantive Stakes:** This is where the empirical rubber meets the road. The question is **Multiple Realizability**. If the same macro-state (e.g., "recession") can be realized by vastly different micro-configurations, then macro-variables have *causal autonomy*. If I can predict the effect of a recession on suicide rates without knowing the specific psychological state of every citizen, the macro-variable is doing genuine explanatory work.

  **C. The Explanatory Layer (Pragmatic)**
  *   **Individualism:** Explanation requires a "mechanism sketch" (Weber's *Verstehen*). We must know the *agents' reasons*.
  *   **Holism:** Explanation requires subsumption under a macro-law (Durkheim's rates). We must know the *system's function*.
  *   **The Conflict:** Individualists fear "black box" explanations (spurious correlations). Holists fear "reductionist paralysis" (getting lost in the noise of individual variation).

  ### 2. Evaluating Your Hypothesis: Is it Just Verbal?

  You suggest the dispute is about "explanation doing double duty" (derivation from laws vs. mechanism sketch). This is accurate, but it misses the **empirical risk** involved in choosing one side.

  **Where you are right:**
  In practice, as you noted with Schelling and epidemiology, scientists are **pragmatic pluralists**. They use macro-variables for prediction and micro-models for mechanism. They do not lose sleep over ontology. In this sense, the *philosophical* impasse is verbal because the *scientific* practice has already bypassed it.

  **Where there is genuine substance:**
  There are two empirical scenarios where the choice of methodology leads to divergent, testable outcomes:

  1.  **The Lucas Critique (Economics):** Robert Lucas argued that macro-econometric models (Holism) fail when policy changes because they don't account for how individual expectations (Micro) adjust. Here, Methodological Individualism isn't just philosophical purity; it's a requirement for valid prediction under intervention. If you ignore the micro-foundations, your macro-laws break.
  2.  **Computational Irreducibility (Complex Systems):** Conversely, in complex adaptive systems, knowing the micro-rules does not always allow you to predict the macro-outcome without running the full simulation (Wolfram). Sometimes the macro-pattern is the *only* compressible description available. Here, Methodological Holism is empirically superior because the micro-explanation is computationally intractable.

  So, the disagreement is not merely verbal; it is a disagreement about **invariance**. Individualists claim micro-laws are more invariant across contexts. Holists claim macro-regularities are more stable against micro-fluctuations.

  ### 3. What Counts as Progress?

  The debate will not end with one side "winning." Progress lies in dissolving the dichotomy through specific distinctions and tools.

  **A. A Distinction: Explanatory Autonomy vs. Ontological Independence**
  We need to decouple the idea that macro-explanations are useful from the idea that macro-entities are magical.
  *   *Progress:* Adopting an **Interventionist Account of Causation** (e.g., James Woodward). A variable $X$ causes $Y$ if manipulating $X$ changes $Y$. If manipulating "unemployment rate" (via policy) changes "suicide rate," then unemployment is a cause, regardless of whether it supervenes on individuals. This validates Holist methods without requiring Holist ontology.

  **B. A Modeling Technique: Agent-Based Modeling (ABM)**
  ABM is the synthesis of Weber and Durkheim.
  *   *How it works:* You define individual agents with simple rules (MI) and observe the emergent aggregate patterns (MH).
  *   *Why it helps:* It allows us to test *generative sufficiency*. If Schelling's model produces segregation, we have shown how a Holist fact (segregation) arises from Individualist rules (preferences). It turns the "black box" of holism into a transparent mechanism.
  *   *Progress:* Using ABM to identify **bridge laws**. Under what specific micro-conditions do macro-regularities become stable enough to be treated as laws?

  **C. A Reformulated Question: "At what scale does the signal emerge?"**
  Instead of asking "Which method is true?", ask "At what level of aggregation does the noise cancel out?"
  *   In epidemiology, individual immunity is noisy; herd immunity is a stable signal.
  *   In voting, individual preference is volatile; party alignment is stable.
  *   *Progress:* A **theory of levels**. Social science should explicitly map which phenomena are robust at the macro-level (and thus warrant Holist methods) and which are sensitive to micro-variation (warranting Individualist methods).

  **D. An Argument for Permanent Tension**
  It is also possible that the impasse reflects a permanent feature of the subject matter: **The Reflexivity of Social Systems.**
  *   Because human agents react to social science theories (e.g., if economists predict a bank run, people run on the banks), the boundary between micro and macro is porous.
  *   *Progress:* Accepting that the "correct" level of analysis shifts dynamically. The goal is not a unified theory but a **calibrated pluralism** that knows when to switch levels.

  ### Summary

  Your hypothesis is correct that the *ontological* fight is dead and the *pragmatic* practice has moved on. However, a substantive disagreement remains regarding **causal invariance**.

  Progress will not come from a philosophical knockout punch, but from **mechanism-based pluralism**. We should treat Methodological Individualism as the default requirement for *causal validation* (to avoid spurious correlations like the Lucas Critique) and Methodological Holism as the default requirement for *predictive efficiency* (to handle complex emergence).

  The impasse dissolves when we stop asking "What is society?" and start asking "Under what conditions do aggregate variables remain invariant under intervention?" That is an empirical question, not a philosophical one, and it is one that modern social science is finally equipped to answer.
