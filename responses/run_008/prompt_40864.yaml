  (a) does the core argument survive the hand-wave, or does the whole thing fall apart exactly there?
  (b) accuracy check — flag anything I stated as fact that's wrong or shaky (the Ellsberg setup, the sure-thing violation, my claims about when the aversion weakens, the competence hypothesis, all of it).
  (c) novelty — I have a nagging feeling someone has already written the "Ellsberg as a game against the experimenter" point and I cant place it. Tell me whether I'm reinventing a known strain of literature or whether this is at least somewhat fresh.

