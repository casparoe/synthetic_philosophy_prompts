answer: |-
  This is an excellent and penetrating question. You have identified the central tension in Bernard Williams's critique of impartial morality (specifically Utilitarianism, though it applies to Kantianism as well). Many readers initially react exactly as you have: if appealing to moral theory is "one thought too many," does Williams want us to be unreflective brutes?

  The short answer is that Williams is not attacking deliberation *per se*, but rather the **colonization of personal life by the moral point of view.** To understand why the conclusion isn't as strong (or irrationalist) as it first appears, we need to distinguish between *motive* and *justification*, and clarify what the integrity objection is actually claiming about psychological possibility.

  Here is a breakdown of how to reconcile the "one thought too many" with a coherent view of practical reasoning and integrity.

  ### 1. Motive vs. Justification (The Structure of the Thought)
  Your worry is that if the man cannot think, "Morality permits this," he cannot think *at all*. But Williams is making a specific point about the **structure of motivation** in intimate relationships.

  *   **The Impartialist View:** The ultimate justification for saving the wife must be grounded in the impartial system (e.g., "General welfare is maximized if I save her" or "Duty permits special obligations").
  *   **Williams's View:** In the moment of action, the motive should be the relationship itself ("She is my wife").

  Williams is not saying the agent cannot have reasons. "Because she is my wife" *is* a reason. It is an **internal reason** grounded in his subjective motivational set. The "one thought too many" is the invocation of an **external standpoint** (the impartial moral theory) to validate an internal commitment.

  If the husband thinks, "I will save her because morality says I can," he has inserted a mediator between himself and his wife. He is no longer acting *as a husband*; he is acting as a *moral agent who happens to be a husband*. Williams argues that the value of the relationship lies in the directness of the commitment, not in its certification by a neutral system.

  ### 2. Is Deliberation Only Acceptable "Before the Fact"?
  You ask: *"Is the thought meant to be that deliberation is acceptable only before the fact, and never in the moment?"*

  **Yes, largely.** This is the distinction between **critical reflection** and **operative motivation**.

  *   **Before the fact (Critical Reflection):** It is perfectly acceptable, and perhaps necessary, to reflect on what kind of life you want to lead. You can decide, "I want to be the kind of person who prioritizes my family." You can even defend this arrangement against a utilitarian critic in a philosophy seminar.
  *   **In the moment (Operative Motivation):** When the emergency arises, the deliberation should be internal to the project. If you are a lover, you act from love. If you stop to check if love is *morally permissible*, you have stepped outside the role of the lover.

  Williams is not condemning practical reasoning; he is condemning the idea that **moral** reasoning must be the supreme arbiter of **all** practical reasoning. He wants to carve out a space for non-moral values (love, art, friendship) that are rational and deliberative but not *moralized*.

  So, deliberation is fine, provided it is deliberation *within* the ground project (e.g., "How can I best help my wife?"), not deliberation *about* the ground project from an external moral standpoint (e.g., "Is helping my wife morally optimal?").

  ### 3. Connection to the Integrity Objection
  You ask how this connects to the integrity objection: *"Does the integrity objection show that impartial theories make a certain kind of character impossible to have, or merely that they make such a character unjustifiable from the outside?"*

  This is the crux of the matter. The "one thought too many" is the **phenomenological symptom** of the attack on integrity.

  *   **Integrity as Identity:** For Williams, integrity is not just honesty; it is about the unity of the self. Our "ground projects" (commitments to people, causes, arts) give us a reason to live. They constitute who we are.
  *   **The Attack:** Impartial theories (like Utilitarianism) demand that we be willing to abandon these projects if the impartial calculus requires it. Even if the calculus *permits* saving the wife, the fact that the *permission* comes from the calculus means the commitment is held tentatively, subject to the veto of the impartial view.
  *   **Alienation:** This creates **alienation**. The agent is alienated from their own actions because the ultimate source of the action is not their own commitment, but the moral theory.

  To answer your specific question: Williams argues it makes the character **psychologically damaged**, not strictly impossible.
  You *can* be a husband who checks the moral rulebook before saving your wife. But Williams claims you are no longer a husband in the full, thick sense of the word. You have become a neutral observer inhabiting a husband's role. The integrity objection shows that impartial theories demand a split in the agent's psyche: part of them is deeply committed, but the "moral" part of them holds that commitment at arm's length.

  So, it is not that the character is *impossible*, but that the theory requires the agent to **disown** their own motivations. It makes the character *inauthentic* relative to their relationships.

  ### 4. Does this condemn Williams's own account?
  You worry: *"Otherwise the point would condemn... presumably, Williams's own account of practical reasoning."*

  Williams does not offer a normative theory that competes with Utilitarianism or Kantianism. He offers a **meta-ethical critique** of the limits of morality.
  *   **Kant/Utilitarians:** "Morality covers all of practical reasoning."
  *   **Williams:** "Morality is a specific subset of practical reasoning, and it becomes pathological when it tries to swallow the rest."

  Therefore, Williams's account is not vulnerable to the "one thought too many" objection because he does not require agents to refer back to a "Williamsian Moral Theory" to validate their actions. He validates actions by reference to the agent's **ground projects** and **internal reasons**. If I save my wife because I love her, I am acting in accordance with Williams's view *without* needing a further thought to justify that love.

  ### Summary
  1.  **Deliberation:** Williams is not against reasoning; he is against the requirement that personal commitments be validated by an impartial moral standpoint. Deliberation is fine *within* a commitment, but not *about* the commitment from a neutral view during the act.
  2.  **Timing:** The "thought" is too many specifically **in the moment of action**, where it disrupts the directness of the relationship. Retrospective or general justification is less problematic.
  3.  **Integrity:** The objection shows that impartial theories demand **alienation**. They don't make the character impossible, but they make it **fragmented**. The agent must view their deepest commitments as contingent upon the impartial good.
  4.  **The Conclusion:** The point is not that we should be unreflective, but that **morality is not the whole of human rationality.** We are permitted (and required) to act from love, passion, and commitment without seeking a moral hall-pass.

  Williams's goal is to shrink the domain of "the moral" so that the "non-moral" (but still rational and valuable) aspects of human life can breathe without being constantly scrutinized by the impartial eye. The "one thought too many" is the sound of that scrutiny intruding where it doesn't belong.
