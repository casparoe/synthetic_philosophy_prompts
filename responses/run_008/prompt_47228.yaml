answer: |-
  To the Funder,

  You have the resources for a high-leverage theory cell: eight researchers for three years. This is insufficient for empirical benchmarking or large-scale model auditing, but it is ample for foundational work that could dictate the trajectory of the field for a decade.

  My recommendation is to reject the standard "Average-Case vs. Worst-Case" dichotomy as a primary organizing principle. Currently, this distinction is often a proxy for "optimism vs. pessimism" rather than a rigorous mathematical separation. Worst-case guarantees are incoherent without a defined class of environments; average-case expectations are unjustified without a derived prior. The two converge on the need to formally characterize the **domain of generalization**.

  Therefore, this agenda prioritizes **epistemic foundations** over **decision rules**. We cannot decide how to act (decision theory) until we understand what we can know about the deployment environment (epistemics/formalization).

  Below is the defended ranking of conceptual questions, followed by an analysis of overrated implications and triggers for re-evaluation.

  ### Criteria for Ranking
  1.  **Leverage:** Does solving this unlock downstream decision-theoretic or engineering choices?
  2.  **Theorist-Tractability:** Can progress be made with pen, paper, and code proofs, without requiring GPU clusters?
  3.  **Neglectedness:** Is this area underserved relative to its importance, specifically by empirical labs?

  ---

  ### 1. Formalizing the "Class of Environments" for General Agents
  **The Upstream Question:** *Is the dichotomy well-posed?*

  **The Problem:** "Worst-case" safety usually implies robustness over a set of environments. But for a general agent, the environment includes the agent's own future actions, other AI systems, and the physical world. If the class is "all computable environments," no agent survives (No Free Lunch theorems). If the class is "environments similar to training," we have merely shifted the burden to defining "similarity." Conversely, "average-case" safety requires a prior over environments. Where does this prior come from? If it is subjective, safety is relative to the designer's beliefs.

  **Why This is Rank #1:**
  *   **Leverage (Critical):** You cannot choose between average and worst-case framing until you define the space over which you are averaging or maximizing. This question dictates whether "worst-case" is even a coherent goal.
  *   **Tractability (High):** This is pure mathematics and philosophy of science. It involves formalizing inductive biases, simplicity priors, and causal structures. It does not require training models.
  *   **Neglectedness (High):** Empirical labs assume the test distribution is fixed. Alignment theorists often assume "worst-case" is self-evident. Few are working on the *ontology* of the deployment environment.

  **Defense:** I rank this above specific decision theories because a decision theory is useless if the domain of application is ill-defined. If we prove that "worst-case over naturalistic environments" collapses into "average-case with a heavy-tailed prior," the entire strategic landscape changes.

  ### 2. Decision Theory Under Radical Uncertainty (Beyond Expected Utility)
  **The Problem:** Standard Expected Utility Theory (EUT) fails in the presence of low-probability, high-impact risks (Pascal's Mugging, infinite disutility). Worst-case framing often defaults to Maximin, which is paralyzing in complex environments. We need a formal framework for decision-making that respects tail risks without succumbing to paralysis or recklessness.

  **Why This is Rank #2:**
  *   **Leverage (High):** This determines the "objective function" for safety. It tells us how to trade off capability against risk.
  *   **Tractability (Medium-High):** Philosophers and decision theorists have worked on risk-weighted expected utility, bounded utility, and imprecise probabilities. Adapting this to AI agents is a theoretical extension.
  *   **Neglectedness (Medium):** Many alignment researchers assume EUT is the goal. Few are actively developing alternatives that are computationally plausible for agents.

  **Defense:** This ranks below #1 because the "correct" decision rule depends on the environment class defined in #1. However, it ranks above specific robustness mechanisms because it governs *all* deployment decisions, not just adversarial ones.

  ### 3. The Epistemics of Priors and Uncertainty Sets
  **The Problem:** Whether you are doing average-case (needing a prior) or worst-case (needing an uncertainty set), you must justify that justification. How does an agent know it is out-of-distribution? Can an agent learn the bounds of its own competence?

  **Why This is Rank #3:**
  *   **Leverage (Medium-High):** Solving this allows for "safe exploration." If an agent can formally bound its own uncertainty, it can defer to humans when necessary.
  *   **Tractability (Medium):** Connects Bayesian epistemology with learning theory.
  *   **Neglectedness (Medium):** Empirical uncertainty estimation (e.g., ensembles) is common, but *formal* guarantees on epistemic uncertainty for deep learning are rare.

  **Defense:** This is the operationalization of #1. While #1 asks "What is the space?", #3 asks "How do we measure our position in it?" It is lower ranked because it is partially dependent on the ontological work of #1.

  ### 4. Robust Delegation and Self-Reference
  **The Problem:** An agent that modifies its own code or creates sub-agents creates a new "environment" for itself. Worst-case guarantees often break under self-modification because the "class of environments" expands to include the agent's own future architecture.

  **Why This is Rank #4:**
  *   **Leverage (Medium):** Crucial for long-term alignment and recursive improvement.
  *   **Tractability (Low):** This is notoriously difficult (Löb's theorem, Good Regulator theorem). Three years might yield negative results, which are still valuable.
  *   **Neglectedness (High):** Most safety work assumes a static agent.

  **Defense:** I rank this lower not because it is unimportant, but because it is potentially intractable for a 3-year horizon. If #1 and #2 are not solved, #4 cannot be. However, if the team makes rapid progress on #1, this becomes the natural next step.

  ### 5. Quantilization and Intermediate Optimization Strategies
  **The Problem:** Quantilization (choosing randomly from the top *q* percent of actions) is a proposed middle ground between maximizing expected utility and maximin.

  **Why This is Rank #5:**
  *   **Leverage (Low-Medium):** It is a specific mechanism, not a foundational framework.
  *   **Tractability (High):** Easy to simulate and analyze formally.
  *   **Neglectedness (Low):** This has received significant attention from MIRI and FHI alumni.

  **Defense:** This is the lowest priority because it is a *solution* looking for a *problem*. Without the formalizations in #1 and #2, we do not know if quantilization is the right tool. Funding this prematurely risks optimizing a parameter in a broken model.

  ---

  ### Overrated Implications of the Framing Choice

  There is a prevalent belief that choosing "Average-Case" vs. "Worst-Case" dictates specific engineering agendas. This is often false.

  **1. Interpretability is not framing-dependent.**
  *   *Claim:* "Worst-case requires interpretability; Average-case allows black-box testing."
  *   *Reality:* In average-case framing, you must estimate the probability of catastrophic failure. If the failure mode is rare (1 in 10^9), black-box testing is statistically impossible. You *must* use interpretability to rule out internal mechanisms that could trigger in the tail. Both framings require understanding internals to certify safety.

  **2. Oversight thresholds are not framing-dependent.**
  *   *Claim:* "Worst-case means we never deploy; Average-case means we deploy freely."
  *   *Reality:* Both framings require a threshold for acceptable risk. In average-case, the threshold is probabilistic (e.g., p < 10^-9). In worst-case, the threshold is binary (guarantee holds or not). However, since absolute worst-case guarantees are likely impossible in open environments (see Rank #1), the worst-case proponent must eventually accept a "high-confidence" bound, which functionally converges to a high-bar average-case. The *policy* outcome is often the same: rigorous auditing before deployment.

  **3. Adversarial Training is not a proxy for Worst-Case Safety.**
  *   *Claim:* "If we do adversarial training, we are doing worst-case alignment."
  *   *Reality:* Adversarial training optimizes for the worst case *within the training distribution's neighborhood*. It does not provide guarantees for distributional shift. Theoretical work on worst-case framing often assumes guarantees hold *across* shifts. Conflating empirical adversarial robustness with theoretical worst-case safety is a category error that wastes theoretical effort.

  ---

  ### Triggers for Re-Evaluation

  This agenda is predicated on specific premises about the state of the field. The following developments would force a re-ranking:

  **1. Evidence Shifting Priority to Worst-Case (Rank #1 & #4 move up):**
  *   **Technical Result:** A proof that generalization bounds for transformer architectures are impossible without exponential data, implying that "average-case" priors cannot be learned from data alone. This would force a return to hard-coded structural guarantees.
  *   **Deployment Incident:** A catastrophic failure caused by a "simple" input perturbation that was theoretically possible but deemed probabilistically negligible. This would validate the need for stricter environment classes.

  **2. Evidence Shifting Priority to Average-Case (Rank #2 & #3 move up):**
  *   **Technical Result:** Demonstration that "natural" environment classes (e.g., those generated by physical laws) have inherent smoothness properties that make probabilistic bounds tight and reliable.
  *   **Field Shift:** If major labs successfully implement "probabilistic safety cases" (borrowed from aviation/nuclear) that are accepted by regulators, the theoretical work should pivot to supporting those specific probabilistic frameworks rather than abstract worst-case bounds.

  **3. Evidence Invalidating the Dichotomy (Rank #1 becomes the only priority):**
  *   **Theoretical Breakthrough:** A formal proof showing that for any agent capable of recursive self-improvement, the distinction between "training distribution" and "deployment environment" dissolves. This would confirm that the only viable path is solving the ontology of the environment (Rank #1) and render the other questions moot.

  ### Conclusion

  Do not fund eight researchers to argue over whether to use Expected Utility or Maximin. Fund them to determine **what the variables are.**

  The highest leverage work is not choosing a decision rule, but defining the space over which the rule applies. If the "worst-case" class is ill-defined, guarantees are vacuous. If the "average-case" prior is unjustified, expectations are delusions.

  Prioritize **Rank #1 (Formalizing the Class of Environments)**. If your team can produce a rigorous taxonomy of "deployment environments" that admits of either probabilistic or robust analysis, they will have provided the substrate upon which all subsequent alignment theory must be built. This is the bottleneck. Everything else is calculation.
