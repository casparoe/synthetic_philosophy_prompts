              5.  Mechanism Design for Oversight (Overrated implications).

      *   **Addressing Overrated Implications (Prompt Requirement 3):**
          *   Does framing change interpretability? Not really. We need to know what the model is doing in both cases.
          *   Does framing change oversight? Maybe the *threshold* for approval, but not the *method*.
          *   Common misconception: Worst-case implies we need formal verification of code. Average-case implies we just need testing. Both are wrong for neural nets.

      *   **Addressing Evidence for Shifts (Prompt Requirement 4):**
