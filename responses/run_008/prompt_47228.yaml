      *(Refining the "Overrated" section)*: A common claim is "Worst-case requires interpretability, Average-case allows black boxes." I should challenge this. Even for average-case, you need to know the tail risks, which requires understanding the internals.

      *(Refining the "Upstream" section)*: The key insight is that "Worst-case over *what*?" is the hard question. If the class is "all computable environments," no agent survives. If it's "environments similar to training," that's just average-case with a different prior. The work is defining "similar."

  6.  **Final Review against Prompt:**
