  2.  **Deconstruct the Nonidentity Problem (NIP) in this Context:**
      *   *Standard NIP:* Policy X causes Person P to exist but with a harmed life. If not-X, Person P* (different person) exists with a good life. P cannot claim harm because without X, P wouldn't exist.
      *   *NLG Context:* The cloning program causes the students to exist. Without the program, they wouldn't exist. Their lives are short and end in death (donation).
      *   *Miss Emily's Defense:* Hailsham made their specific lives bearable. Without the program, they wouldn't exist. Therefore, the program isn't "wrong" in a way that harms *them* comparatively.
      *   *The Tension:* Intuitively, the program *is* monstrous. How do we reconcile the intuition with the logic?

  3.  **Drafting - Section by Section:**

