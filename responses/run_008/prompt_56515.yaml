answer: |-
  This is a sophisticated formulation of what political philosophers call **the Boundary Problem** (or the *demos* problem). Your roommate has effectively reconstructed an argument made famous by theorists like Robert Dahl and Frederick Whelan, and more recently pushed to its global conclusion by Robert Goodin. It is a valid argument, meaning the logic holds together. If the premises are true, the conclusion follows.

  However, as a professional political philosopher, I can tell you that while the logic is valid, the argument is **unsound**. It relies on a specific interpretation of "affected interests" that collapses under scrutiny.

  Here is the step-by-step diagnosis, the specific premise to reject, the cost of doing so, and where my own diagnosis might be vulnerable.

  ### 1. The Diagnosis: Where the Argument Breaks

  The error lies in the transition from **Premise (2) to Premise (3)**.

  *   **Premise (2)** claims: "Whether a decision affects your interests doesn't stop at any border."
  *   **Premise (3)** infers: "So... the set of people entitled to a say is not contained in any town."

  This inference assumes that *any* causal impact on an interest grants an *equal right to a say*. This is the weak link. It conflates **causal affectedness** with **political stake**.

  If I sneeze in New York, I slightly increase the viral load in the air, which theoretically affects the health interests of a pedestrian in London. Causally, their interest is affected. But intuitively (and legally), they have no claim to vote on my right to sneeze. Your roommate's argument treats the "butterfly effect" as a democratic entitlement. If we accept that, democracy becomes impossible because the electorate for every decision would be everyone who has ever lived or will live, diluted to the point of meaninglessness.

  Therefore, **Premise (1) is false as stated**, or at least requires a crucial qualification that your roommate omits. The principle "everyone whose interests the decision affects" is too broad to be operational.

  ### 2. The Solution: Reject the "All-Affected" for the "All-Subjected"

  To save your intuition about the drought ban (and local democracy generally), you should reject the **All-Affected Interests Principle (AAIP)** in its strong form and replace it with the **All-Subjected Principle (ASP)**.

  *   **Old Premise (1):** Legitimacy requires a say for all *affected interests*.
  *   **New Premise (1*):** Legitimacy requires a say for all *those subject to the coercive enforcement of the decision*.

  **Why this dissolves the regress:**
  1.  **Boundaries become clear:** A town zoning board's decision is coercively enforced only on people within the town's jurisdiction (owners, residents). The saver in Lagos is *affected* by the economic ripple effects, but they are not *subject* to the town's police power or fines.
  2.  **Stability is preserved:** Jurisdiction is fixed (Premise 4). You know who is subject to the law without recalculating causal chains for every issue.
  3.  **The Drought Intuition holds:** The people banned from lighting fires are the ones subject to the ban. They get the vote. The person who might move there in ten years is not currently subject to the coercion, so they don't vote. This matches your intuition.

  ### 3. The Cost of This Fix

  You asked me to explain what it costs to reject Premise (1). It is not a free lunch. By switching to the All-Subjected Principle (or even a "Threshold" version of Affectedness), you pay three prices:

  **A. You accept arbitrary borders.**
  If legitimacy comes from being "subject to coercion," we still have to ask: *Why is the border drawn here?* Why does the town line stop *here* and not 100 yards further? The ASP solves the *voting* regress, but it admits that the *boundary itself* is not democratically derived. It is usually historical, geographical, or constitutional. You are admitting that the foundation of the democracy is not itself fully democratic. This is what Whelan called a "pre-democratic" fact.

  **B. You tolerate externalities.**
  By excluding the saver in Lagos or the potential future mover, you acknowledge that the town will make decisions that harm outsiders without their consent. You are prioritizing the **agency of the member** over the **welfare of the affected**. You are saying, "It is more important that the residents rule themselves than that no one outside suffers consequences." This is a defensible position, but it is a moral trade-off.

  **C. You lose moral purity.**
  Premise (1) is morally attractive because it sounds like perfect fairness. Rejecting it means admitting that democracy is a **procedural compromise**, not a moral absolute. It is a tool for managing conflict among a specific group, not a mechanism for achieving global justice.

  ### 4. Should You Keep the Drought Intuition?

  You said: *"I'd rather keep the drought intuition than premise (1)."*

  **This is the correct philosophical deal.**

  Keeping Premise (1) as your roommate states it leads to **democratic nihilism**. If no bounded group can ever decide anything legitimately, then the town cannot ban the fires, the nation cannot tax, and the world cannot regulate carbon. Paralysis is the result.

  By rejecting (1) in favor of a bounded principle (like All-Subjected), you preserve the possibility of action. You admit that the town meeting is legitimate *relative to its jurisdiction*, even if it isn't legitimate from a "God's eye view" of all causal impacts. This is called **political realism**. It costs you the claim to perfect universal justice, but it buys you a functioning society.

  ### 5. Where My Diagnosis Might Be Wrong (Uncertainty Check)

  You asked what would change my mind about this diagnosis. There are two scenarios where my recommendation fails:

  **Scenario A: Hyper-Interdependence.**
  If globalization reaches a point where *every* local decision is coercively felt globally, the distinction between "affected" and "subjected" collapses. For example, if a town's zoning decision significantly alters global carbon emissions enough to coercively threaten life in Lagos (via climate change), one could argue the Lagos resident is effectively "subjected" to the town's rule. If the causal chain becomes a causal *noose*, the All-Subjected Principle expands back into the Global Demos. If you believe climate change makes local zoning a matter of global coercion, my fix fails.

  **Scenario B: The "Constitutional" Counter.**
  Some philosophers argue that Premise (4) is the real villain. They argue we *should* have fluid demoi. For example, only parents vote on schools, only drivers vote on roads. If we reject the idea that a demos must be "fixed" across issues, we might be able to keep Premise (1) without the paralysis. However, this creates massive administrative complexity and risks fracturing civic identity. I currently think (4) is practically necessary, but if a system of "liquid democracy" or issue-specific voting became technologically seamless, I might reconsider rejecting (1).

  ### Summary for Your Roommate

  Tell her this:
  1.  Her logic is valid, but Premise (1) is too broad.
  2.  Causal affect does not equal democratic entitlement (the "sneeze in New York" test).
  3.  We must distinguish between those **affected by consequences** and those **subject to coercion**.
  4.  If we don't make that distinction, democracy implies an infinite electorate, which means no decision can ever be made.
  5.  We should reject the strong All-Affected Principle to save the possibility of self-government, accepting that boundaries are partly conventional.

  She is right that the *logic* of the All-Affected Principle leads to globalism or nihilism. That is precisely why most democratic theorists reject the strong All-Affected Principle in favor of bounded jurisdiction. You can keep your drought intuition, but you have to admit that the town's border is a moral cutoff point, not just a geographic one.
