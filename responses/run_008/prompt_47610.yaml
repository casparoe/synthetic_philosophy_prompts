answer: |-
  Your hypothesis is astute, and it deserves to be treated as more than a mere heuristic for why academic arguments fade. It strikes at the methodological heart of contemporary analytic philosophy. To answer your request directly: the debate over two-dimensional semantics did not end because a solution was found, nor because the combatants exhausted themselves. It ended because the disagreement was revealed to be a jurisdictional dispute over the word 'semantics', fought with a formalism that was too flexible to constrain the combatants.

  Here is the diagnosis, the evaluation of your stall-hypothesis, and an assessment of what progress would have looked like.

  ### The Diagnosis: A Boundary Dispute Disguised as a Substantive Clash

  You ask whether the disagreement was substantive, verbal, or a case of different projects wearing one formalism. The honest answer is that it was all three, layered atop one another.

  On the surface, it appeared substantive. David Chalmers and Frank Jackson argued that the primary intension (the epistemic dimension) captures what a speaker knows *a priori* about their terms. For them, if you can conceive of a scenario where 'water' is not H₂O, that scenario is a genuine metaphysical possibility relative to the epistemic interpretation of the term. This machinery was essential for their conceivability arguments against physicalism.

  Robert Stalnaker and Scott Soames argued that this conflates the cognitive role of a term with its semantic content. For Stalnaker, the content of an assertion is what divides the possible worlds into those where the assertion is true and those where it is false. Since 'Water is H₂O' is true in all metaphysically possible worlds (given that it is true at all), its content is necessary. The fact that we can *imagine* it being false is a fact about our epistemic situation, not about the proposition expressed. Soames went further, arguing that the two-dimensionalist redefinition of 'necessity' was simply a modal error.

  However, look closely at Stalnaker's specific complaint. He does not typically argue that the two-dimensional matrix fails to model the data of linguistic intuition. He argues that it models the *wrong data*. He contends that Chalmers and Jackson are offering a theory of *concepts* or *cognitive significance* but labelling it a theory of *meaning*.

  This suggests the core dispute was verbal, but in a high-stakes way. It was a fight over the extension of the term 'semantics'.
  *   **The Epistemic Camp:** Semantics must explain apriority and cognitive grasp. If your theory of meaning cannot explain why 'Water is H₂O' is informative, it is inadequate.
  *   **The Metaphysical Camp:** Semantics must explain truth-conditions and compositionality in a mind-independent world. If your theory of meaning makes necessary truths come out contingent, it is inadequate.

  Because both sides accepted the formal apparatus (the 2D matrix), they could not defeat each other on technical grounds. The matrix is capacious enough to house both a descriptivist epistemology and a causal metaphysics. Consequently, the debate shifted to meta-semantics: what is the *job* of a semantic theory? Is it to map the mind's grasp of the world, or to map the world's constraints on the mind?

  Stalnaker's complaint is indeed that epistemic two-dimensionalism changes the subject. But in philosophy, changing the subject is often the only way to win when the subject is ill-defined. If 'meaning' is not a natural kind, then defining it is a stipulative act. Chalmers stipulates meaning includes epistemic access; Stalnaker stipulates it does not. Neither can prove the other wrong without first winning the argument over what 'meaning' is for.

  ### Evaluating the Stall-Hypothesis

  Your hypothesis is that the debate died because it was unfalsifiable from the inside, and the audience detached the applications from the interpretation. I believe this holds up remarkably well.

  **1. Unfalsifiable from the Inside**
  You are correct that the question was never cleanly separated from the applications. Because the debate took place in the armchair, relying on intuitions about cases (Twin Earth, zombies, Hesperus/Phosphorus), there was no external arbiter.
  *   If Chalmers says, "It is conceivable that water is not H₂O," Stalnaker replies, "You are conceiving of a different proposition, not that water is not H₂O."
  *   If Stalnaker says, "The proposition is necessary," Chalmers replies, "You are ignoring the epistemic mode of presentation."

  Without an empirical constraint on what 'conceivability' or 'proposition' actually *is* (neurologically or computationally), the debate becomes a duel of stipulations. It became unfalsifiable because the criteria for success were part of the dispute itself.

  **2. The Audience Left**
  This is the most compelling part of your thesis. The 'customers' for two-dimensional semantics were primarily philosophers of mind interested in the mind-body problem and philosophers of language interested in modality.
  *   **The Mind-Body Problem:** The physicalists did not concede to Chalmers. Instead, they developed the 'phenomenal concepts strategy'. They accepted that we have unique epistemic access to consciousness but denied that this entailed dualism. They effectively bypassed the need for the 2D semantic argument by attacking the link between epistemic gaps and ontological gaps. They took the tool (the distinction between epistemic and metaphysical) but left the shop (the claim that epistemic gaps prove dualism).
  *   **The Language Problem:** Philosophy of language moved towards contextualism and relativism (think MacFarlane or Kaplan's later work). The focus shifted from the static analysis of terms to the dynamic flow of conversation. The 2D matrix was absorbed as a technical device for handling context, exactly as Stalnaker suggested, but the grand metaphysical claims were dropped.

  The formalism survived as a utility; the interpretive debate died because it ceased to be the bottleneck for the research programmes that relied on it. You do not need to resolve the Stalnaker-Chalmers dispute to use diagonalisation to explain how communication works in a context.

  ### What Would Count as Progress?

  If the debate were to restart, or if we were to judge whether it was truly resolved, what would progress look like?

  **1. A Cognitive Model (The Empirical Route)**
  The most robust form of progress would be a cognitive scientific model that vindicates or destroys the idea of an epistemic intension. If psycholinguistics could demonstrate that speakers store two distinct types of semantic value—one descriptive/epistemic and one causal/metaphysical—accessed differently during processing, Chalmers would be vindicated. If it showed that 'descriptive' content is merely heuristic post-processing, Stalnaker wins.
  *   *Verdict:* This has not happened. Philosophy of language remains largely insulated from empirical linguistics.

  **2. An Agreed Division of Labour (The Deflationary Route)**
  Progress could have been a terminological treaty. If the community had agreed to reserve 'semantic content' for the metaphysical dimension (Stalnaker) and 'cognitive content' for the epistemic dimension (Chalmers), the heat would have dissipated.
  *   *Verdict:* This has happened *de facto*, but not *de jure*. People use the terms loosely, which allows the confusion to linger in introductory textbooks, even if the specialists have moved on.

  **3. A Change of Fashion (The Sociological Route)**
  I am afraid I must endorse your final suggestion: nothing short of a change of fashion would have moved it, and that is precisely what occurred. Analytic philosophy is driven by what is considered 'live'. In the late 90s, the conceivability argument was live. By the 2010s, the focus had shifted to metaethics, social ontology, and the philosophy of information.
  *   *Verdict:* This is the honest answer. The debate did not end because it was solved; it ended because the generation that cared about it retired, and the new generation found different puzzles. The 2D matrix remains in the toolkit, like a specific type of wrench, but the engine it was designed to fix is no longer the one everyone is trying to repair.

  ### Conclusion

  Your column should feel confident in asserting that the debate halted because it was a category error masquerading as a technical dispute. The two sides were building different houses with the same bricks. Stalnaker was building a house for truth-conditions; Chalmers was building a house for cognitive access. When they realised they were arguing over whether the bricks were 'really' walls or 'really' foundations, they simply stopped talking and went to build elsewhere.

  The stall-hypothesis is correct: the applications detached from the interpretation. The machinery was too useful to discard, but the metaphysical baggage was too heavy to carry. The debate did not die because it was answered; it died because the cost of answering it exceeded the value of the prize. In the economy of ideas, that is a valid reason for a market to close.
