          *   If the method is "Inference from $p$", then if I don't believe $p$ in the nearest $\neg p$ world, I won't believe $q$.
          *   Since $\neg q$ worlds are $\neg p$ worlds, if I track $p$, I shouldn't believe $p$ in the nearest $\neg q$ world (unless the nearest $\neg q$ world is *not* the nearest $\neg p$ world, and in that specific $\neg q$ world, my belief-forming mechanism malfunctions differently).
          *   *The "Method" Loophole:* Nozick allows that the method used in the actual world is fixed for the counterfactual evaluation. If the method is "Visual perception of $p$ + Deduction", then in the $\neg q$ world (which is a $\neg p$ world), visual perception should fail to yield $p$, so deduction fails to yield $q$.
          *   *So how does Closure fail for Nozick?*
