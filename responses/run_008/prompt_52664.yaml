      *   *Idea 2: The Commute.* $p$: The train is on time. $q$: I will arrive by 9 AM.
          *   Problem: If I don't arrive by 9 ($\neg q$), the train wasn't on time ($\neg p$). Sensitivity holds.
      *   *Idea 3: Specific vs. General.* $p$: This specific apple is red. $q$: There is a red apple here.
          *   Problem: If $\neg q$ (no red apple), then $\neg p$ (this apple not red). Sensitivity holds.
      *   *Idea 4: The "Habitual Overlook" (Targeting Constraint 3 & 4).*
          *   Need a case where $\neg q$ is possible while $p$ is true? No, if $p \to q$, then $\neg q \to \neg p$. So the nearest $\neg q$ world *must* be a $\neg p$ world.
          *   Wait, the tracking condition for $q$ is: In the nearest $\neg q$ world, do I believe $q$?
          *   The tracking condition for $p$ is: In the nearest $\neg p$ world, do I believe $p$?
          *   Since $\neg q \to \neg p$, the set of $\neg q$ worlds is a subset of $\neg p$ worlds.
          *   For closure to fail, the *nearest* $\neg q$ world must be different from the *nearest* $\neg p$ world in a way that affects belief formation.
          *   Usually, the nearest $\neg p$ world is "close" to actuality. The nearest $\neg q$ world might be "further" or "different."
          *   If $q$ is a logical consequence, $\neg q$ implies $\neg p$. So any $\neg q$ world is a $\neg p$ world.
          *   For sensitivity to fail for $q$ but hold for $p$: In the nearest $\neg p$ world, I don't believe $p$. (Good). But in the nearest $\neg q$ world, I *still* believe $q$. (Bad).
          *   Why would I believe $q$ in the nearest $\neg q$ world?
          *   If I deduce $q$ from $p$, then in the nearest $\neg q$ world (which is a $\neg p$ world), do I still believe $p$? If I don't believe $p$, I won't deduce $q$. So I won't believe $q$.
          *   *Crucial Insight:* For Nozick, the method matters. If the method for $q$ is "Deduction from $p$", then sensitivity for $q$ depends on sensitivity for $p$. If $M_p$ tracks $p$, $M_{ded}$ should track $q$.
