prompt: |-
  I'm a journalist — I cover science and ideas for a mid-sized outlet, mostly features, some daily news when something breaks. At a conference last month I got into a long argument with a philosopher about free will and moral responsibility, and she kept bringing up these "Frankfurt cases" and something she called the principle of alternative possibilities. I more or less followed her, but on the train home I realised I'd been translating the whole thing into newsroom terms in my head anyway, so let me just ask someone to do that translation properly.

  Here's the vocabulary I actually think in, after fifteen years in newsrooms: bylines and who owns what runs under them, desk edits, spiking a story, the corrections page, what the owner will and won't tolerate, "everyone had it so we had to run it," and anticipatory compliance — the way reporters who know the owner hates coverage of company X just write friendly pieces about company X, so the owner never has to lift a finger. Fluent, is what I'm saying. Now take the actual philosophical debate — the principle that you're only responsible for what you did if you could have done otherwise, Frankfurt's counterexample where the agent would have been forced to do the thing but does it on his own so the forcing never actually occurs, and the standard replies philosophers have developed to that counterexample — and restate the whole back-and-forth in my vocabulary, as faithfully as you can. If it helps, here's a seed case: a reporter works at a paper where the editor-in-chief has a standing policy that any story about company X that isn't flattering gets rewritten by a friendly desk before publication. One day she files a puff piece about company X entirely on her own initiative, and the policy never activates. Is she responsable for the puff piece in the same way she would be at a paper with no such policy?

  Then the part I actually care about, the residue report. Which parts of the philosophical debate map cleanly onto newsroom concepts — I suspect "she would have done it anyway" maps onto something like describing a captured institution rather than describing her, tell me if that's roughly right — which parts only translate if you distort them, and whether there's anything in the philosophers' debate that has no expression at all in newsroom terms. And for that last bit, I want your actual view on where the residue sits: is it that my vocabulary is missing something, or that the philosophers are arguing about something less real than it looks? Be honest with me, I'm not trying to win the argument with her anymore — I just want to know whether my "this is just about corrupt newsrooms" intuition is the whole story or whether it's quietly missing something.
