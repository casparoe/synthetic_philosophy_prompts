prompt: |-
  I'm a senior analyst at a foreign-policy think tank that publishes short memos for congressional staff, and every week we kill or revise drafts that lean on a historical analogy — the draft that says we must act now or repeat Munich, the draft that says any intervention is another Vietnam, the draft that warns the U.S. and China are caught in the Thucydides trap. My junior colleagues have a rough feel for why these analogies get misused, but nothing they can apply consistently under deadline, and different reviewers on our team flag the same analogy in opposite directions. Please write a decision procedure my analysts can run in twenty minutes on any draft that uses a historical comparison: the questions to ask in order (for example, about what work the analogy is actually doing in the argument, whether the similarity claims are doing any real inferential work or just re-describing the conclusion, whether the analogy was selected before or after the analyst formed a view, what disanalogy would change the recommendation), what counts as a sufficient answer to each, where the procedure terminates in a firm no, and where it correctly hands the decision to a human because the question is one of judgment rather than structure. The procedure should be honest about its own failure modes — including that a checklist can launder a bad analogy into a respectable-looking one. Then run it on three drafts: a memo urging sanctions on a regional power by appeal to appeasement in the 1930s, a memo opposing any humanitarian intervention on the grounds that it will become another Vietnam, and a memo framing U.S.–China relations through the Thucydides trap. Include at least one case where the procedure permits an analogy I plainly distrust, and explain why that outcome is a feature of the procedure rather than a bug. Finally, say what the procedure cannot do — what an analyst loses by following it, and which misuses of historical analogy it lets through.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Target Audience:** Senior analyst at a foreign-policy think tank writing for congressional staff.
      *   **Problem:** Junior colleagues misuse historical analogies (Munich, Vietnam, Thucydides Trap). Reviewers are inconsistent.
      *   **Task:** Create a 20-minute decision procedure (checklist/algorithm) to evaluate drafts using historical analogies.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Termination points (Firm No vs. Human Judgment).
          *   Honesty about failure modes (checklists can launder bad arguments).
          *   Application to three specific cases (Munich/Sanctions, Vietnam/Intervention, Thucydides/China).
          *   Include a case where the procedure permits a distrusted analogy (and explain why).
          *   Conclusion on limitations (what is lost, what gets through).
      *   **Tone:** Professional, analytical, pragmatic, slightly cynical (acknowledging the reality of policy writing), authoritative but humble about the tool's limits.

  2.  **Drafting the Decision Procedure (The "Analogy Stress Test"):**

      *   *Goal:* Needs to be fast (20 mins) but rigorous enough to catch lazy thinking.
      *   *Structure:* Step-by-step questions.
      *   *Key Concepts to Embed:*
          *   Is it illustrative or argumentative? (Rhetorical vs. Inferential)
          *   Selection bias (Cherry-picking).
          *   Disanalogies (Critical differences).
          *   Causal mechanisms (Why did it happen then vs. now).
          *   Policy specificity (Does it actually tell us *what* to do?).
      *   *Termination:* Clear "Kill" criteria vs. "Flag for Senior Review."
      *   *Self-Correction:* Must acknowledge that a checklist can make a bad argument look good (the "laundering" risk).

      *   *Drafting the Steps:*
          1.  **Function:** Is it doing work or just decorating?
          2.  **Selection:** Was the history chosen to fit the policy or vice versa?
          3.  **Mechanism:** Do the causal forces match?
          4.  **Disanalogy:** What's different, and does it matter?
          5.  **Specificity:** Does the analogy dictate the *specific* policy or just the *stance*?

  3.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Munich/Appeasement (Sanctions on Regional Power).**
          *   *Standard View:* Usually a red flag (cry wolf).
          *   *Procedure Test:* Does it specify *which* action prevents war? Or just "be tough"?
          *   *Outcome:* Likely a "Kill" or "Major Revise" because "sanctions" aren't the 1938 equivalent of "military rearmament."
      *   **Case 2: Vietnam (Opposing Humanitarian Intervention).**
          *   *Standard View:* "Quagmire" fear.
          *   *Procedure Test:* Is the goal nation-building or limited humanitarian aid?
          *   *Outcome:* Likely a "Kill" because the objectives differ fundamentally.
      *   **Case 3: Thucydides Trap (US-China).**
          *   *Standard View:* Deterministic war.
          *   *Procedure Test:* Is it structural or agential?
          *   *Outcome:* This is the tricky one. The prompt asks for *one case where the procedure permits an analogy I plainly distrust.* I need to set up the procedure such that it allows a nuanced Thucydides argument, even if I (as the persona) think the term is overused. Or, I need to allow a Munich argument that is actually structurally sound (rare but possible).
          *   *Decision:* I will make the Thucydides case the one that *passes* but requires heavy qualification. Why? Because structural rivalry *is* a real thing, even if the "trap" label is deterministic. If the analyst uses it to highlight structural pressure rather than inevitability, the procedure should allow it. This demonstrates the "feature not bug" requirement—the tool tests structure, not political correctness.

  4.  **Refining the "Feature not Bug" Constraint:**

      *   I need to ensure the procedure doesn't just ban "clichés." It must ban *bad logic.*
      *   If an analyst uses Munich *correctly* (e.g., specific sequence of concessions leading to specific escalation), the procedure must let it through, even if I hate the Munich analogy generally.
      *   *Better Choice:* Let's make the **Munich/Sanctions** draft the one that passes, but only under strict conditions. Why? Because sometimes appeasement *is* the right analogy. If the procedure kills it automatically, it's biased. If it lets through a *well-argued* Munich analogy, that proves the tool works on logic, not vibe.
      *   *Wait, the prompt says:* "Include at least one case where the procedure permits an analogy I plainly distrust."
      *   *My Persona:* I am a senior analyst. I likely distrust *all three* as clichés.
      *   *Selection:* I will allow the **Thucydides Trap** draft to pass *if* it reframes the trap as a management challenge rather than a destiny. I distrust the term because it implies inevitability. If the analyst uses it to argue for risk mitigation (structural logic), the procedure validates the logic, even if I hate the buzzword. This shows the tool tests *inference*, not *terminology*.

  5.  **Drafting the Limitations Section:**

      *   What does the checklist miss?
      *   Moral weight.
      *   Emotional resonance (which matters for Congress).
      *   Novel situations (no history fits).
      *   The "Laundering" effect (making a bad argument look structured).

  6.  **Review and Refine:**

      *   *Tone Check:* Is it memo-style? Yes.
      *   *Time Check:* Can this be done in 20 mins? Yes, if questions are sharp.
      *   *Constraint Check:* Did I explain the "feature not bug"? Yes.
      *   *Constraint Check:* Did I explain what the procedure *cannot* do? Yes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   Make sure the "Kill" criteria are distinct from "Revise."
      *   Ensure the "Human Judgment" handoff is clear.
      *   Make sure the "Laundering" warning is prominent.

  *(Self-Correction on the "Distrusted Analogy" requirement)*: I need to be careful here. If I say "I distrust Thucydides," but the procedure lets it through, I need to explain *why* that's okay. It's okay because the procedure tests the *causal claim*, not the *popularity* of the analogy. If the causal claim holds (rising power vs. status quo creates friction), the analogy is valid *structurally*, even if the label is tired.

  Let's write the response.

  *Structure:*
  1.  **Header:** To/From/Subject (Memo style).
  2.  **Introduction:** Context setting.
  3.  **The Procedure:** The 5-Step "Analogy Stress Test."
  4.  **Application:** Running the three drafts.
  5.  **The "Feature not Bug" Explanation.**
  6.  **Limitations:** What the tool misses.

  *Refining the Procedure Steps:*
  1.  **The Function Test:** Illustration vs. Inference.
  2.  **The Selection Test:** Ex-ante vs. Ex-post.
  3.  **The Mechanism Test:** Causal similarity.
  4.  **The Disanalogy Test:** Critical differences.
  5.  **The Policy Test:** Specificity of action.

  *Refining the Termination:*
  *   Fail Step 1 or 3 = Kill.
  *   Fail Step 2 or 4 = Major Revise.
  *   Pass Step 5 = Human Judgment (Senior Analyst).

  *Let's assemble.*
answer: |-
  **MEMORANDUM**

  **TO:** Policy Analysis Team
  **FROM:** Senior Analyst
  **SUBJECT:** Decision Procedure for Historical Analogies (The "20-Minute Stress Test")
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope

  We publish for congressional staff who operate under high cognitive load. They use history to orient themselves, but they are vulnerable to rhetorical shortcuts. When a draft leans on a historical analogy (Munich, Vietnam, Thucydides, etc.), it often substitutes memory for analysis.

  This procedure is not a ban on history. It is a filter for *inferential laziness*. It is designed to be run in twenty minutes. It cannot guarantee truth, but it can guarantee structural integrity.

  **Warning:** A checklist can launder a bad analogy into a respectable-looking one. If an analyst fills this out convincingly but the underlying history is cherry-picked, this tool will not catch it. This tool tests the *logic of the comparison*, not the *accuracy of the history*. That distinction is the primary failure mode.

  ---

  ### 2. The Analogy Stress Test (5 Steps)

  *Analysts must answer these questions in writing on the draft's cover sheet. If you cannot answer a question in two sentences or fewer, the analogy is doing too much work.*

  **Step 1: The Function Test (Illustration vs. Inference)**
  *   **Question:** Is the analogy used to *decorate* a conclusion already reached, or is it the *bridge* to the conclusion?
  *   **Sufficient Answer:** "The analogy provides the causal mechanism for why Policy X leads to Outcome Y." (Inference)
  *   **Insufficient Answer:** "The analogy illustrates the gravity of the situation." (Decoration)
  *   **Termination:** If **Decoration**, **KILL** the analogy. It is rhetoric, not analysis. Keep the policy argument, delete the history.

  **Step 2: The Selection Test (Ex-Ante vs. Ex-Post)**
  *   **Question:** Was this historical case selected *before* the policy recommendation was formed, or does it fit *too perfectly* after the fact?
  *   **Sufficient Answer:** "We considered Case A and Case B; Case A was rejected because [reason], Case B was selected because [structural similarity]."
  *   **Insufficient Answer:** "This is just like [Famous Event]." (Implies immediate recognition without screening).
  *   **Termination:** If **Ex-Post** (cherry-picked), **FLAG FOR MAJOR REVISION**. The analyst must list one alternative historical case they rejected and why.

  **Step 3: The Mechanism Test (Causal Forces)**
  *   **Question:** Do the causal forces in the historical case operate in the current case? (e.g., If Munich is the analogy, is the causal force "concession encourages aggression" or "dictators are insatiable"?)
  *   **Sufficient Answer:** "In 1938, concession signaled weakness to a revisionist power. Today, sanctions signal resolve to a revisionist power."
  *   **Insufficient Answer:** "Because they are both aggressors."
  *   **Termination:** If **No Causal Match**, **KILL** the draft. The argument rests on a false equivalence.

  **Step 4: The Disanalogy Test (The Kill Switch)**
  *   **Question:** What is the single biggest difference between the two cases, and does it negate the recommendation?
  *   **Sufficient Answer:** "The difference is [Nuclear Weapons]. It does not negate the recommendation because the mechanism is economic, not kinetic."
  *   **Insufficient Answer:** "The contexts are different, but the lesson holds."
  *   **Termination:** If the disanalogy **Negates the Mechanism**, **KILL** the draft. If it **Complicates the Mechanism**, **FLAG FOR SENIOR REVIEW**.

  **Step 5: The Policy Test (Specificity)**
  *   **Question:** Does the analogy prescribe a *specific* action, or just a *posture*?
  *   **Sufficient Answer:** "Munich implies we must rearm (specific), not just 'stand firm' (posture)."
  *   **Insufficient Answer:** "We must avoid appeasement." (Appeasement is a label, not a policy).
  *   **Termination:** If **Posture only**, **FLAG FOR MAJOR REVISION**. Convert posture to specific policy or delete analogy. If **Specific**, **HAND TO SENIOR ANALYST** for final judgment.

  ---

  ### 3. Application to Current Drafts

  I have run the Stress Test on the three drafts currently in the queue.

  #### Draft A: Sanctions on Regional Power (The "Munich" Argument)
  *   **Argument:** We must impose severe sanctions on [Regional Power] now, or we will repeat the mistake of 1938.
  *   **Step 1 (Function):** Inference. Claims sanctions prevent escalation like rearmament would have.
  *   **Step 2 (Selection):** Ex-Post. "1938" was the first historical reference mentioned. No alternative cases (e.g., 1914) weighed. -> **FLAG FOR REVISION.**
  *   **Step 3 (Mechanism):** Weak. 1938 mechanism was territorial concession. Current mechanism is economic sanction. Does economic pain stop territorial ambition same as military deterrence? Unclear.
  *   **Step 4 (Disanalogy):** Nuclear capability of target vs. non-nuclear Germany in '38. This fundamentally changes the risk calculus of "failure."
  *   **Step 5 (Policy):** Prescribes "Stand Firm" (Posture) rather than specific sanction tiers.
  *   **Verdict:** **KILL THE ANALOGY.** Keep the sanctions argument, delete Munich. The causal mechanism (economic vs. territorial) and the disanalogy (nuclear) break the inference.

  #### Draft B: Opposing Humanitarian Intervention (The "Vietnam" Argument)
  *   **Argument:** Any troop deployment for humanitarian aid will become a quagmire like Vietnam.
  *   **Step 1 (Function):** Inference. Claims intervention leads to long-term insurgency.
  *   **Step 2 (Selection):** Ex-Post. Vietnam is the default "quagmire" file.
  *   **Step 3 (Mechanism):** Failed. Vietnam mechanism: Counter-insurgency against nationalist movement supporting a weak local government. Current Case: Humanitarian corridor protection with no nation-building mandate.
  *   **Step 4 (Disanalogy):** Objective. Vietnam was regime stability/containment; this is disaster relief.
  *   **Step 5 (Policy):** Prescribes "No Troops" (Posture of restraint).
  *   **Verdict:** **KILL THE DRAFT.** The causal mechanism does not map. A humanitarian corridor does not generate an insurgency by definition. The analogy is doing no inferential work; it is an emotional veto.

  #### Draft C: U.S.–China Relations (The "Thucydides Trap" Argument)
  *   **Argument:** Structural stress between rising and ruling powers makes conflict likely; we must manage the transition.
  *   **Step 1 (Function):** Inference. Structural rivalry creates friction points.
  *   **Step 2 (Selection):** Ex-Ante. Analyst cites Graham Allison's dataset of 16 cases, not just Athens/Sparta.
  *   **Step 3 (Mechanism):** Plausible. Security dilemmas and fear of decline drive pre-emptive action.
  *   **Step 4 (Disanalogy):** Economic interdependence (US/China) vs. distinct economies (Athony/Sparta). Analyst argues this *reduces* but does not *eliminate* risk.
  *   **Step 5 (Policy):** Prescribes "Guardrails and Crisis Comms" (Specific).
  *   **Verdict:** **PASS TO SENIOR ANALYST.**

  ---

  ### 4. The "Feature, Not Bug" Outcome

  **I plainly distrust the Thucydides Trap.** In my view, it is a deterministic cliché that absolves policymakers of agency by suggesting war is inevitable due to "structure." I believe it encourages fatalism.

  **However, the Procedure permits Draft C.**

  **Why this is a feature:**
  The Stress Test does not measure *my* fatigue with a buzzword; it measures *logical coherence*.
  1.  **Mechanism:** The analyst successfully identified a causal mechanism (security dilemma) that exists in both cases.
  2.  **Disanalogy:** The analyst acknowledged the economic interdependence disanalogy and argued why it mitigates rather than negates the risk.
  3.  **Specificity:** The analogy drove a specific policy (crisis comms), not just a vibe ("be careful").

  If I killed Draft C because I dislike the term "Thucydides Trap," I would be imposing my own heuristic bias over the analyst's structural argument. The procedure forces me to engage with the *logic* of the rivalry, even if I hate the *label*. If the analyst can prove the structural pressure exists without claiming inevitability, the analogy is doing valid work. The tool protects the analyst from my cynicism, provided their logic holds.

  ---

  ### 5. Limitations and Failure Modes

  This procedure is a sieve, not a filter. It catches large debris but lets fine sediment through.

  **1. The Laundering Effect**
  A sophisticated analyst can game Steps 3 and 4. They can construct a plausible-sounding causal mechanism for a false equivalence. If an analyst writes, "The mechanism is 'perception of weakness,'" they can justify almost any analogy. The checklist makes the bad argument look rigorous. *Mitigation:* Senior Analysts must read the "Mechanism" answer with extreme skepticism.

  **2. Loss of Moral Resonance**
  Congressional staff are not just logic processors; they are moral actors. Sometimes an analogy is used correctly *rhetorically* to convey moral stakes (e.g., "This is a genocide" implies Rwanda). Step 1 kills "Illustration," but sometimes illustration *is* the point of a memo (to raise alarm). This procedure will strip the moral urgency from drafts that rely on emotional resonance. We may produce cleaner memos that fail to move the reader.

  **3. The Novelty Blind Spot**
  This procedure assumes history rhymes. If we face a truly novel situation (e.g., AI-driven autonomous conflict), Step 3 (Mechanism) will fail because there is no historical mechanism. The procedure might force analysts to use *bad* analogies to pass the test, rather than admitting "we have no history for this."

  **4. The "Specific Policy" Trap**
  Step 5 demands specific policy. Sometimes the correct historical lesson is "buy time" or "gather intelligence." These look like "Posture" answers and might get flagged for revision, pushing analysts to propose premature specific actions to satisfy the checklist.

  **Final Instruction:** Use this test to harden the argument, not to sanitize it. If the analogy survives the test, it belongs in the memo. If it fails, delete it. Do not try to trick the checklist.
