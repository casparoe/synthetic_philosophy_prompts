prompt: |-
  I'm a software engineer by training and have no formal background in philosophy, but I've read enough popular economics and decision-making material to be dangerous. Once a quarter I run a 60-minute "critical thinking" session for my team — 12 engineers, a mix of senior and junior, every one of whom has personally worked on a project that they privately knew should have been killed months before it finally was. The next session is on sunk costs, and I want to do better than the standard treatment.

  Here is my complaint about the standard treatment: it presents sunk cost honoring as a straightforward bias — the failure mode everyone memorizes from Psych 101 and from every project post-mortem ever written. But the harder and more interesting question is whether honoring sunk costs is always irrational, and the answer is not obviously yes. A few cases keep nagging at me. First, completion sometimes has informational value: finishing a nearly done project can teach you whether the underlying bet was sound in a way that abandoning it at 80 percent never can, and that knowledge is worth something for your next bet even if this one is already lost. Second, there are agency and reputation effects: a team known for abandoning things at the first sign of trouble may never be trusted with long-horizon work again, and that trust is worth real money. Third, costs are not always fully sunk — some are partially recoverable, and quitting itself can carry switching costs — in which case the textbook principle quietly stops applying. I've also read that biologists have found nonhuman animals apparently honoring sunk costs (the so-called Concorde fallacy), which suggests either that the bias runs very deep or that it is not always a bias at all.

  Design an in-class activity — a game with rules and payoffs, not a lecture — for this session. My requirements:

  1. In the first phase, participants should feel the pull of escalation of commitment: the rules and payoffs should be arranged so that many of them, behaving rationally in the moment, pour more resources into a losing course of action, and only see the pattern when the round ends. The failure should emerge from what they do, not from anything I say up front.

  2. Then run a second phase, or a variant round with changed rules, in which honoring the sunk cost is actually the payoff-maximizing choice — and the debrief should force them to articulate exactly why the usual "just ignore sunk costs" slogan fails in that round. I want them to leave able to distinguish genuine sunk cost bias from situations where past investment legitimately changes the decision, not just able to recite that one of them is a fallacy.

  3. Materials should be things I can get in an office: index cards, a whiteboard, a timer, and a points ledger or play money. Payoffs should be points, never real money. Give me a minute-by-minute timeline for the full 60 minutes including debrief.

  4. The debrief should map specific moments from the game onto the three nagging cases above — informational value of completion, reputation and agency effects, and partially recoverable costs — in plain language I can deliver credibly as a non-philosopher. It should end with a short bridge to our actual work: how a kill decision on a real project differs from what the game captured.

  5. Tell me honestly what will predictably go wrong the first time I run it — engineers gaming the system for points, someone announcing the punchline in the first five minutes, senior people dominating the discussion — and how to handle each failure mode.

  6. Finally, be frank about which feature of the philosophical question no points-based game can reproduce, and which part I will simply have to supply myself in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Target Audience:** 12 Software Engineers (mix of senior/junior).
      *   **Context:** Quarterly "critical thinking" session (60 mins).
      *   **Topic:** Sunk Cost Fallacy (specifically challenging the standard "always ignore sunk costs" narrative).
      *   **User's Complaint:** Standard treatment is too simplistic. Sometimes honoring sunk costs is rational (informational value, reputation/agency, switching costs/recoverability).
      *   **Requirements:**
          1.  Phase 1: Induce escalation of commitment naturally (players feel the pull).
          2.  Phase 2: Change rules so honoring past investment *is* rational (payoff-maximizing).
          3.  Materials: Office supplies only (cards, whiteboard, timer, points).
          4.  Debrief: Map game moments to the three specific cases (Info, Reputation, Switching Costs) + bridge to real work.
          5.  Failure Modes: Anticipate gaming, spoilers, dominance, etc.
          6.  Limitations: Acknowledge what a game *can't* capture.
      *   **Tone:** Practical, rigorous, respectful of the user's intelligence (engineer-to-engineer), no fluff.

  2.  **Deconstruct the Philosophical/Economic Problem:**

      *   *Standard View:* Sunk costs are gone. Decisions should be based on marginal future costs vs. marginal future benefits.
      *   *Nuanced View:*
          *   *Information:* Completing a task reveals data (e.g., is the tech stack viable?) that abandoning hides.
          *   *Reputation/Agency:* Stakeholders trust teams that finish. Abandoning hurts future budget/approval chances.
          *   *Switching Costs/Recoverability:* Quitting isn't free. Code rot, onboarding new tools, severance, etc.
      *   *The Challenge:* How to gamify this without making it obvious?
      *   *Phase 1 Design:* Needs a "trap." A project that looks salvageable but drains resources. The "Concorde" trap.
      *   *Phase 2 Design:* Needs a mechanic where *past investment* unlocks *future value* or where *quitting* incurs a specific penalty tied to the investment.

  3.  **Drafting the Game Concept: "The Protocol Upgrade"**

      *   *Theme:* Software development (relatable). Migrating a legacy system or building a new feature.
      *   *Phase 1 (The Trap):* "Project Phoenix."
          *   Players invest points (time/engineering cycles).
          *   Probability of success decreases or cost increases as they go deeper.
          *   *Crucial Mechanic:* If they quit early, they lose *everything* invested. If they finish, they get a payout.
          *   *Wait, that's standard.* To make it a *fallacy*, the expected value (EV) of continuing must be negative, but the pain of realizing the loss drives them.
          *   *Better Mechanic:* Diminishing returns. Each round costs more, payout stays same. But there's a "salvage value" that is low.
          *   *Actually, let's look at the User's specific nuance.* Phase 1 should make them feel the bias. Phase 2 should make "sunk cost honoring" rational.
      *   *Phase 2 (The Twist):* "Project Phoenix II."
          *   Same setup, but now, *completion* yields a "Blueprint" (Information Value) or "Trust Tokens" (Reputation).
          *   Or, quitting incurs a "Migration Cost" (Switching Cost).
          *   Let's go with **Switching Costs + Information**.
          *   In Phase 2, if they quit, they pay a penalty proportional to how much they built (integration debt). If they finish, they get a bonus *and* a discount on the next game (representing learning/reputation).

      *   *Refining the Mechanics for 60 mins:*
          *   12 people. Split into 3 teams of 4? Or individual? Teams simulate "project squads." Let's do 3 teams of 4. Encourages debate within the team.
          *   Currency: "Engineering Points" (EP).
          *   Rounds: Discrete investment phases.

      *   *Phase 1 (The Fallacy):*
          *   Goal: Reach 100% completion.
          *   Cost per round: 10 EP.
          *   Payout on success: 50 EP.
          *   Probability of success: Starts high, drops, or simply hidden.
          *   *Actually, to ensure they feel the pull:* The "Sunk Cost" is the EP already spent. If they quit, they get 0. If they continue, they *might* get 50.
          *   *The Trap:* The EV of continuing is negative after Round 3, but because they've spent 30, they don't want to "waste" it.
          *   *Wait, I need to make sure Phase 2 validates honoring costs.*
          *   *Phase 2 Mechanic:* "Technical Debt/Integration." If you quit halfway, you owe a penalty (cleanup cost). If you finish, you get the payout + a "Module" that reduces cost of future work.
          *   *Wait, that makes finishing rational based on FUTURE benefits (the Module), not the PAST cost.*
          *   *Correction:* The user wants to show where "honoring sunk costs" is rational. Strictly speaking, in economics, you never honor sunk costs. You honor *future consequences of past actions*.
          *   *Philosophical Pivot:* The game needs to show that what *looks* like honoring a sunk cost is actually responding to a **correlated future cost/benefit** triggered by the past investment.
          *   *Phase 2:* Quitting triggers a "Severance/Cleanup" fee based on investment. Finishing avoids it. Thus, the *amount already invested* changes the *future cost of quitting*. This makes the investment level relevant to the decision, even if the cost itself is sunk.
          *   *Alternative:* Reputation. If you quit, your "Trust Score" drops. Trust Score determines budget next quarter.
          *   *Let's combine:* Phase 1 = Pure Sunk Cost (Quit = 0 return, Continue = Low prob payout). Phase 2 = Switching Costs/Reputation (Quit = Penalty, Continue = Payout + Future Bonus).

  4.  **Developing the Timeline (60 Mins):**

      *   0-5: Intro & Rules.
      *   5-20: Phase 1 (The Trap).
      *   20-25: Reset & Rule Change.
      *   25-40: Phase 2 (The Nuance).
      *   40-60: Debrief & Bridge.

  5.  **Addressing the User's Specific "Nagging Cases":**

      *   *Informational Value:* Phase 2 needs a "Learning Token" given only on completion.
      *   *Reputation:* Phase 2 needs a "Stakeholder Trust" metric.
      *   *Switching Costs:* Phase 2 needs a "Cleanup Penalty" for quitting.
      *   *Constraint:* I can't do all three in one game without it becoming complex.
      *   *Solution:* Phase 1 is Pure Sunk Cost. Phase 2 introduces *one* mechanic that bundles these. Let's call it "Integration Debt."
      *   *Actually, better:* Keep the game simple. Use the Debrief to map the game mechanics to the three cases.
      *   *Game Design:*
          *   **Phase 1:** "The Money Pit." Invest 10 to potentially win 40. Probability of success drops each round. If you stop, you lose all invested. (Classic Escalation).
          *   **Phase 2:** "The Platform Play." Same setup, BUT: If you complete, you get a "Key" (Info/Reputation). If you quit, you pay "Refactoring Cost" (Switching Cost) proportional to investment.
          *   *Wait, if quitting costs money based on investment, then the investment isn't sunk.* It's a *contingent liability*. This is the key philosophical distinction. The game must demonstrate that *sometimes what looks like a sunk cost is actually a contingent liability.*

  6.  **Refining the Failure Modes:**

      *   *Gaming:* Engineers will try to calculate EV immediately.
      *   *Fix:* Hide the probabilities. Make it experiential.
      *   *Spoiler:* Someone reads the prompt? Unlikely, but possible.
      *   *Fix:* Don't reveal the learning objective until the end.
      *   *Dominance:* Seniors talk over juniors.
      *   *Fix:* Silent voting or written decisions before discussion.

  7.  **Addressing the Limitations (Requirement 6):**

      *   Games have fixed rules. Real life has ambiguity.
      *   Games have known endpoints. Real projects have unknown horizons.
      *   Games have points. Real life has careers/emotions.
      *   *Crucial:* The game can't capture the *emotional* weight of admitting failure to a boss. The facilitator must supply that.

  8.  **Finalizing the Activity Structure:**

      *   **Title:** "The Legacy Migration."
      *   **Teams:** 3 squads of 4.
      *   **Currency:** "Story Points" (SP).
      *   **Phase 1:** "The Black Box." Hidden success rate. High cost to quit (lose all SP). *Goal: Induce panic/escalation.*
      *   **Phase 2:** "The Ecosystem." Completion grants "API Access" (future value). Quitting incurs "Rollback Cost" (switching cost). *Goal: Show rational continuation.*
      *   **Debrief:** Connect Phase 2 mechanics to Info, Reputation, Switching Costs.

      *(Self-Correction during drafting)*: Make sure Phase 1 actually triggers the fallacy. If the EV is obviously negative, engineers will quit. The probabilities need to be ambiguous or optimistic initially. Let's use a "Card Draw" mechanic for success.
      *   Phase 1: Draw a card. Red = Fail, Black = Success (but you need 3 successes to finish). Cost per draw = 10 SP. Prize = 100 SP. Deck is rigged (mostly Red).
      *   Phase 2: Same deck, BUT if you finish, you get a "Certification" worth 50 SP in the *next* quarter (simulated). AND if you quit, you pay 5 SP per round invested (Cleanup).

      *Wait, 60 minutes is tight.* 3 teams of 4 is good.
      *   Intro: 5 min.
      *   Round 1 (Phase 1): 15 min.
      *   Round 2 (Phase 2): 15 min.
      *   Debrief: 25 min.

      *Let's tighten the mechanics.*
      *   Phase 1: "The Feature." Invest 10 SP per sprint. Roll a d6. 1-3 = Bug (continue or quit), 4-6 = Progress. Need 3 Progress to ship. Ship = 50 SP. Quit = 0.
      *   *Problem:* This is just gambling.
      *   *Better:* Deterministic but hidden info. "Complexity Meter."
      *   *Best for time:* Facilitator-controlled outcomes. I (the facilitator) decide if it works based on a hidden threshold, but I give hints that make them think they are close.
      *   *Actually, simplest:* The "Auction" style.
      *   Let's go with the **"Blind Bidding"** approach.
      *   Teams bid SP to advance a project.
      *   Phase 1: Project value is fixed. Cost to advance increases. If you stop, you lose bid.
      *   Phase 2: Project value increases if you finish (Network Effect). Cost to stop includes a penalty.

      *Okay, let's settle on the "Project Pipeline" game.*
      *   Teams get 100 SP.
      *   Phase 1: "The Sunk Trap." Each round, pay 10 SP. Flip a coin. Heads = 1 step closer (need 5 steps). Tails = No progress. If you stop, you lose all SP spent. If you finish, get 40 SP. (Mathematically, after 3 rounds, EV is negative, but they will chase).
      *   Phase 2: "The Strategic Asset." Same coin flip. BUT: If you finish, you get 40 SP + "Priority Queue" status (I will accept their next project proposal automatically). If you quit, you pay a "Refactor Tax" of 5 SP per round invested.
      *   *Wait, I need to make sure they see the difference.*
      *   In Phase 1, the SP spent is gone.
      *   In Phase 2, the SP spent creates a liability if abandoned.
      *   This perfectly illustrates the "Partially Recoverable/Switching Cost" argument.
      *   For Info/Reputation: The "Priority Queue" status represents that.

      *Let's write the plan.*

      *   **Failure Mode Handling:**
          *   *Gaming:* If they ask "What's the EV?", say "You don't know the odds."
          *   *Spoiler:* If someone says "This is sunk cost," acknowledge and ask "Is it *always*?"
          *   *Dominance:* Use "Silent Decision" cards.

      *   **Limitations:**
          *   Game has known rules. Real life has ambiguity.
          *   Game points != Career risk.
          *   Facilitator must emphasize the *emotional* cost of killing a project (admitting mistake).

  9.  **Review against constraints:**
      *   60 mins? Yes.
      *   Office materials? Yes (Cards, Whiteboard, Points).
      *   Phase 1 (Bias) & Phase 2 (Rational)? Yes.
      *   Debrief maps to 3 cases? Yes.
      *   Failure modes addressed? Yes.
      *   Limitations frank? Yes.

  10. **Final Polish:** Ensure the tone is peer-to-peer (engineer to engineer). Avoid academic jargon where possible. Make the debrief script actionable.

  *(Self-Correction on Phase 2 Logic)*: I need to be careful not to validate the *Sunk Cost Fallacy* in Phase 2. I need to validate *ignoring* sunk costs while acknowledging that *past investment changes future payoffs*. The distinction is subtle but vital.
  *   Phase 1: Past investment = 0 future value. (True Sunk Cost).
  *   Phase 2: Past investment = Future Liability (if quit) or Future Asset (if finish). (Not Sunk).
  *   The lesson: "Is it actually sunk?"
  *   This aligns with the user's prompt: "distinguish genuine sunk cost bias from situations where past investment legitimately changes the decision."

  Okay, ready to write.
answer: |-
  Here is a complete design for your 60-minute session. It is built to be run by an engineer, for engineers, using only office supplies.

  # Session Title: "The Migration Protocol"

  **Goal:** Move the team from "Sunk Cost is always a bias" to "Sunk Cost is a bias *only when the investment has no future causal power*."
  **Materials:** Whiteboard + markers, 3 decks of playing cards (remove Jokers), 12 index cards (for voting), a timer, a printed "Ledger" (simple grid on paper) to track team points.
  **Setup:** Divide the 12 engineers into 3 "Squads" of 4. Give each Squad 100 "Engineering Points" (EP) on the ledger.

  ---

  ## Part 1: The Timeline (60 Minutes)

  ### 0:00 – 0:05 | Intro & Rules (No Theory)
  **Script:** "We're running a simulation called 'The Migration Protocol.' You are squads deciding whether to continue or kill a legacy system migration. You start with 100 EP. Your goal is to end with the most EP. There are two phases. I will not explain the economic theory until the end. Follow the rules on the board."

  **Whiteboard Rules:**
  1.  **Cost:** Each "Sprint" costs 10 EP.
  2.  **Progress:** To finish the project, you need 5 "Success Cards."
  3.  **Mechanic:** At the end of each Sprint, I draw one card from the deck.
      *   **Black (Spades/Clubs):** Success. (Keep the card).
      *   **Red (Hearts/Diamonds):** Blocker. (Discard the card).
  4.  **Quit:** You can quit at any time before I draw. You recover **0 EP** of what you spent.
  5.  **Finish:** If you get 5 Black cards, the project ships. You receive a payout.

  ### 0:05 – 0:20 | Phase 1: The Money Pit (Inducing the Bias)
  **The Trap:** The payout is **40 EP**.
  **The Math:** Each sprint costs 10 EP. The probability of a Black card is 50%. Expected cost to get 5 successes is roughly 10 sprints (100 EP). The payout is only 40 EP. The EV is deeply negative.
  **The Psychology:** Once they spend 30 EP, quitting feels like "wasting" 30 EP to save 10 EP. They will chase the loss.

  **Execution:**
  1.  Ask each Squad to silently write "Continue" or "Quit" on an index card. Reveal simultaneously.
  2.  If a Squad continues, deduct 10 EP. Draw a card. Show it.
  3.  Repeat.
  4.  **Facilitator Note:** Keep the pace brisk. If a Squad quits, they are "out" for Phase 1 but watch the others. Most will burn out their budget or hit a natural stop point you enforce (e.g., "Max 8 Sprints").
  5.  **Expected Outcome:** Most squads will lose EP. They will feel frustration. They will say, "We were so close," or "We couldn't let the 40 points go."

  ### 0:20 – 0:25 | The Reset & Rule Change
  **Script:** "Reset your EP to 100. We are running a second migration project. The mechanics are similar, but the business context has changed. Read the new rules carefully."

  **Whiteboard Rule Changes (Phase 2):**
  1.  **Cost:** 10 EP per Sprint.
  2.  **Quit Penalty:** If you quit, you must pay a **Refactor Tax** of 5 EP *for every Sprint already invested* (representing code cleanup, severance, switching vendors).
  3.  **Finish Bonus:** If you ship, you get 40 EP **PLUS** a "Platform Key."
  4.  **Platform Key:** This Key is worth 20 EP in *future* quarters (representing reputation/reuse). For this game, add 20 EP to your final score immediately.

  **The Math:**
  *   **Quit Cost:** Now, quitting gets *more expensive* the more you invest. If you invest 30 EP (3 sprints) and quit, you pay 10 (sprint cost) + 15 (tax) = 25 EP loss *this round*.
  *   **Finish Value:** 40 (payout) + 20 (key) = 60 EP.
  *   **The Shift:** In Phase 1, past investment was irrelevant to the future (True Sunk Cost). In Phase 2, past investment creates a *future liability* if you quit. Therefore, the amount already invested *legitimately* changes the decision to continue.

  ### 0:25 – 0:40 | Phase 2: The Strategic Asset
  **Execution:**
  1.  Run the same card-draw mechanic.
  2.  Allow Squads to discuss openly this time.
  3.  **Crucial Moment:** When a Squad has invested 30-40 EP and gets a Red card, they must decide: Quit and pay the Tax, or Continue and hope for the Key?
  4.  **Expected Outcome:** Squads will continue longer than in Phase 1, but for a *different reason*. In Phase 1, they continued to "save" the past. In Phase 2, they continue to avoid the "Refactor Tax" and secure the "Platform Key."
  5.  End Phase 2 when all squads quit or finish. Tally final EP.

  ### 0:40 – 0:60 | The Debrief (The Core Value)
  **Script:** "In Phase 1, many of you lost points. In Phase 2, many of you spent more points, but likely ended with a better position. Why? Because in Phase 1, the money was gone. In Phase 2, the money you spent changed the future."

  **Map the Game to Your Three Cases (15 mins):**

  1.  **The Refactor Tax = Partially Recoverable Costs / Switching Costs.**
      *   *Game:* Quitting cost more the deeper you went.
      *   *Real Work:* Killing a project isn't free. There is code rot, customer migration, severance, or vendor contract breakage.
      *   *Lesson:* If quitting costs money based on investment, the investment is **not sunk**. It is a contingent liability. Ignoring it is irrational.

  2.  **The Platform Key = Informational Value.**
      *   *Game:* Finishing gave you a "Key" (bonus points).
      *   *Real Work:* Finishing a "failed" project tells you if the tech stack works, if the market exists, or if the team can execute. Aborting at 80% hides that data.
      *   *Lesson:* Completion buys data. If the data is worth more than the cost of completion, finishing is rational, even if the project itself loses money.

  3.  **The "Future Quarters" = Reputation & Agency.**
      *   *Game:* The Key was worth points in "future quarters."
      *   *Real Work:* Stakeholders fund teams that ship. A team known for killing projects at the first sign of trouble loses the budget for long-horizon work.
      *   *Lesson:* Your track record is an asset. Protecting it can justify finishing a marginal project.

  **Bridge to Real Work (5 mins):**
  "Next time you are in a post-mortem arguing to kill a project, ask three questions:
  1.  **Is the cost truly sunk?** Or will quitting trigger a switching cost (cleanup, contracts)?
  2.  **Is there information locked in completion?** Do we need to know if this works to bet on the next thing?
  3.  **What is the reputation cost?** Will killing this destroy our ability to get budget for the *right* project later?
  If the answer to all three is 'No,' then kill it immediately. That is the Sunk Cost Fallacy. If the answer to any is 'Yes,' you are not honoring a sunk cost; you are paying for a future asset."

  ---

  ## Part 2: Predictable Failure Modes & Fixes

  **1. The "EV Calculator" (Gaming the System)**
  *   **Risk:** An engineer immediately calculates the 50% probability and declares Phase 1 irrational in minute 2.
  *   **Fix:** Do not reveal the deck composition (50/50). Tell them: "The success rate is dynamic based on system complexity." This forces them to rely on *experience* rather than *calculation*, mimicking real life where odds are unknown.
  *   **Script:** "In real projects, we don't know the odds. Play based on the signals you get."

  **2. The "Philosophy Major" (The Spoiler)**
  *   **Risk:** Someone who has read behavioral econ says, "This is just the Concorde Fallacy."
  *   **Fix:** Validate and pivot. "Exactly. So your job in Phase 2 is to find the rule change that makes the Concorde Fallacy *not* a fallacy." This turns them from a spoiler into a co-investigator.

  **3. The "Senior Dominance"**
  *   **Risk:** The Staff Engineer in the squad dictates the decision, juniors don't engage.
  *   **Fix:** Enforce **Silent Voting** for the first 3 rounds of Phase 1. Everyone writes "Continue/Quit" on an index card. Reveal on count of three. *Then* discuss. This forces juniors to commit to a position before being swayed.

  **4. The "It's Just Points" Dismissal**
  *   **Risk:** Participants don't feel the pain of losing EP.
  *   **Fix:** Add a trivial social stake. "The squad with the lowest EP at the end of Phase 1 has to wipe the whiteboard / fetch the coffee." It sounds silly, but loss aversion kicks in immediately.

  ---

  ## Part 3: What The Game Cannot Capture (The Limitations)

  You must be honest about this in the debrief. A game has fixed rules; reality does not.

  **1. The Emotional Cost of Admission**
  *   **Game:** Quitting loses points.
  *   **Reality:** Quitting admits *you* were wrong. It threatens promotions, bonuses, and ego.
  *   **Your Add:** "In the game, losing points is annoying. In reality, killing a project you championed feels like a career risk. The Sunk Cost Fallacy is often actually an **Agency Problem**. You are spending company money to protect your own reputation. The game simulates the math, but you have to supply the emotional honesty."

  **2. The Unknown Horizon**
  *   **Game:** You know you need 5 cards.
  *   **Reality:** You don't know if you are at 80% completion or 10%.
  *   **Your Add:** "In Phase 1, you knew the goal. In real life, the 'Refactor Tax' might be infinite. The 'Information Value' might be worthless. The game teaches you to *look* for these factors, not that they are easy to quantify."

  **3. The Political Context**
  *   **Game:** You decide as a squad.
  *   **Reality:** Your VP might force you to continue.
  *   **Your Add:** "Sometimes honoring sunk cost isn't your decision. It's a directive from leadership who care about the Reputation/Agency effects we discussed. Your job is to articulate the cost clearly so *they* make the informed choice."

  ---

  ## Facilitator Cheat Sheet (Keep this in your pocket)

  *   **If Phase 1 ends too fast:** Tell them the "System Complexity" increased, requiring 7 cards instead of 5. (Escalation of commitment).
  *   **If Phase 2 feels identical to Phase 1:** Stop the game. Ask: "What is the specific line item in the rules that makes continuing rational now?" (Answer: The Refactor Tax and Platform Key).
  *   **Key Phrase to Repeat:** "Is the cost gone, or does it haunt us?"
  *   **The Takeaway:** "Sunk Cost is a fallacy only when the past has no causal power over the future. Your job is to audit whether the past still has power."

  This design respects your team's intelligence, avoids preaching, and uses their native language (systems, costs, payoffs) to illuminate a philosophical nuance. Good luck.
