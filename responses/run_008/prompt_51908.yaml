          5.  What does Nolan dramatize that Borges couldn't (the "landing" paragraph)?
          6.  Is the fit a stretch? (Honesty check).

  2.  **Evaluate the Core Analogy (*Memento* + "A New Refutation of Time"):**
      *   *Borges's Argument:* In "A New Refutation of Time," Borges argues against the continuity of the self and time. He leans on Berkeley (idealism) and Hume (bundle theory of self). If the self is just a bundle of perceptions, and there's no underlying substrate connecting moment A to moment B, then time (as succession) is an illusion. The famous ending ("I am the river... I am the tiger") suggests a mystical identity between the subject and the flow of time itself, dissolving the distinction.
      *   *Nolan's Film:* Leonard Shelby has anterograde amnesia. He cannot form new episodic memories. He lives in a sliding window of ~15 minutes. He constructs identity through artifacts (photos, tattoos).
      *   *The Fit:* This is a *strong* fit. It's not a stretch. *Memento* is widely acknowledged as a philosophical puzzle box, and Borges is the literary godfather of this specific kind of temporal puzzle.
      *   *Nuance:* Borges wants to dissolve time to find a mystical unity. Leonard's condition *forces* a dissolution of time, but the result is fragmentation, not unity. This tension is the gold mine for the article.

  3.  **Address the Specific Questions:**

      *   **Vindicate or Demolish?**
          *   Borges thinks dissolving succession leads to a kind of eternal present or mystical identity.
          *   Leonard lives in an eternal present. But is it a "life"? Yes, but a tragic, manipulable one.
          *   *Verdict:* It vindicates the *phenomenology* (this is what it feels like) but demolishes the *soteriology* (it doesn't save you, it enslaves you). Borges sees the atomized moment as liberating/mystical; Nolan sees it as a prison where identity is constructed by external narratives.
          *   *Key Insight:* Borges says "I am the tiger." Leonard says "Who made me the tiger?" (Teddy/Natalie).

      *   **Funes the Memorious Parallel:**
          *   *Funes:* Remembers everything, cannot think (thinking requires forgetting/abstraction). Drowned in detail.
          *   *Leonard:* Forgets everything, cannot think (planning requires continuity). Drowned in the immediate.
          *   *Verdict:* It's a compelling mirror, but "reverse" might be too simple. Funes is overwhelmed by the *continuity* of time (every leaf on every tree at every moment). Leonard is trapped in the *discontinuity*. Funes has too much self (every version of himself); Leonard has too little. It holds up as a thematic counterpoint, but don't lean on it too hard or it becomes a gimmick.

      *   **Where the Film Resists:**
          *   The noir/thriller mechanics. The plot requires causality (Teddy lied, Natalie manipulated). If time were truly refuted, the mystery wouldn't matter. The film *needs* linear time to have a twist ending (the audience pieces it together linearly even if Leonard doesn't).
          *   Leonard *does* have some implicit memory (muscle memory, the condition of his wife). It's not pure atomization.
          *   The "Sammy Jankis" story suggests Leonard *can* learn emotionally, just not factually. This complicates the "atomized present" theory.

      *   **What Nolan Dramatizes Borges Couldn't:**
          *   Borges writes essays and fiction about the *idea*. Nolan forces the *audience* to experience the cognitive dissonance.
          *   The structural gimmick (reverse chronology) makes the viewer the amnesiac.
          *   The *politics* of memory. Borges is metaphysical; Nolan is ethical/political. Who controls the notes controls the man. This is the "landing" paragraph.

