      *   **Specific Topic:** Reading Christopher Nolan's *Memento* through Jorge Luis Borges's essay "A New Refutation of Time".
      *   **Key Questions:**
          1.  Does the angle hold up?
          2.  Does Leonard's condition vindicate or demolish Borges's refutation?
