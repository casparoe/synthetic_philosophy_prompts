answer: |-
  This is not a stretch. It is, in fact, one of the most robust philosophical pairings available in modern cinema. *Memento* is often discussed in terms of Locke's memory theory of personal identity, but reading it through Borges's "A New Refutation of Time" elevates the conversation from "how do we know who we are?" to "does the 'we' who knows exist across more than one instant?"

  Your angle holds up exceptionally well. However, to make the piece sing, you need to sharpen the tension between Borges's *mystical* dissolution of time and Nolan's *tragic* one. Here is a breakdown of how to handle the specific beats you've outlined, including the honest pushback you requested.

  ### 1. Vindication or Demolition?
  You ask if Leonard's condition vindicates Borges's refutation (a life without succession is still a life) or demolishes it (without duration, we are putty).

  **The Verdict:** It vindicates the *phenomenology* but demolishes the *metaphysics*.

  Borges's essay is an intellectual exercise aimed at a spiritual conclusion. When he writes, "I am the tiger," he is claiming a kind of pantheistic unity. If time is an illusion, then the separation between subject and object is also an illusion. It is a liberating thought.

  Leonard Shelby lives the *literal* version of this atomized present, and it is not liberating; it is terrifying. He vindicates Borges's claim that one can exist in a series of disconnected moments (the "bundle theory" of self made flesh), but he exposes the ethical vacuum that Borges glosses over. If the self is only the current moment, then moral responsibility cannot exist. Leonard cannot be held accountable for what "previous-Leonard" did, because that person is dead.

  **The Pitch:** Leonard proves Borges right about the *structure* of experience (we only ever have the now) but proves him wrong about the *consequence*. Borges thinks dissolving time makes you one with the universe. Nolan shows that dissolving time makes you a slave to whoever holds the pen. Leonard isn't the tiger; he is the meat.

  ### 2. The *Funes the Memorious* Parallel
  Is it *Funes* in reverse? Yes, but with a crucial structural difference.

  *   **Funes:** Drowned in the continuity of time. He perceives every leaf on the tree at every moment. He cannot think because thinking requires forgetting (abstraction). He has too much self (every iteration of himself is preserved).
  *   **Leonard:** Drowned in the discontinuity of time. He perceives only the leaf in front of him, right now. He cannot think (plan) because planning requires continuity. He has too little self (every iteration of himself is deleted).

  **Where the parallel breaks down:** Funes is passive; the world overwhelms him. Leonard is active; he builds a prosthesis to overcome the world. Leonard creates a "narrative self" using tattoos and notes. This is where you can introduce a third philosopher briefly: Paul Ricoeur on *narrative identity*. Leonard tries to solve the Borges problem by turning his life into a story, but because the story is fragmented, it is easily edited by others (Teddy, Natalie).

  Don't lean on *Funes* too hard, or it becomes a gimmick. Use it to set up the contrast: Funes suffers from the weight of time; Leonard suffers from the lightness of it.

  ### 3. Where the Film Resists the Reading
  You asked for honesty on where the fit is imperfect. There are two main friction points:

  **A. The Noir Causality:**
  "A New Refutation of Time" suggests that causality is a linguistic habit, not a reality. But *Memento* is a mystery thriller, and mysteries rely entirely on causality. Teddy *did* kill Jimmy. Natalie *did* manipulate Leonard. The film's plot demands that linear time is objectively real, even if Leonard can't perceive it. If Borges were strictly right, Teddy's manipulation wouldn't work because "past-Teddy" and "present-Teddy" would be distinct entities with no causal link. The film needs time to be real for the tragedy to land, even if Leonard experiences it as fragmented. You must acknowledge that Nolan uses Borges to *structure* the film, but relies on conventional realism to *resolve* it.

  **B. Emotional Memory:**
  Borges/Hume suggest the self is a bundle of perceptions. But Leonard retains procedural and emotional memory (his love for his wife, his grief). He learns the "Sammy Jankis" story emotionally, even if he forgets the facts. This suggests a "deep self" that persists through time, which actually contradicts the strict "Refutation of Time." Leonard is not truly atomized; he is haunted. A strict Borgesian reading would imply Leonard should be truly reborn every 15 minutes, but he is clearly carrying a burden across the gaps.

  ### 4. The Landing Paragraph: What Nolan Dramatizes
  This is the crux of your piece. Borges writes from the library; Nolan writes from the multiplex. What can Nolan claim that Borges couldn't?

  **The Politics of Memory.**
  Borges's refutation is solitary and contemplative. Nolan's refutation is social and predatory.
  Nolan dramatizes that **identity is not just a philosophical problem, it is a vulnerability.** In a world without time, the person with the best archive wins.

  Borges ends his essay by surrendering to time ("I am the fire"). Nolan shows us that if you surrender to the moment, someone else will light the match. The "landing" argument is this: Borges sought to dissolve time to find God or the Universe. Nolan shows that in the modern world, when you dissolve time, you don't find the Universe; you find the State, or the Con Man, or the System. Leonard's tattoos are not mystical truths; they are data inputs.

  **Drafting the thought:**
  > "Borges imagined the refutation of time as a liberation from the prison of succession. Nolan reveals it as the ultimate prison break—not for the prisoner, but for the warden. When Leonard Shelby cannot distinguish the river from the tiger, he does not become one with the cosmos; he becomes food for it. Nolan takes Borges's metaphysical puzzle and weaponizes it. He shows us that in the absence of duration, truth is not discovered, it is administered."

  ### 5. Final Verdict
  Do not swap the film. *Memento* is the perfect vehicle for this. *Inception* is too structural, *Tenet* is too mechanical. *Memento* is intimate and tragic.

  **One caution:** Ensure you distinguish between the *experience* of time (phenomenology) and the *reality* of time (ontology). Borges argues time doesn't exist ontologically. Leonard suffers because his phenomenology is broken, but the ontology remains (people die, bullets kill). The tension between those two is where your article lives.

  Your editor will like this. It treats the blockbuster as a serious text without ignoring its genre mechanics, and it treats the philosophy as a living problem rather than a museum piece. Go write it.
