  **TRANSWORLD SEMANTICS, LLC**
  **LIMITED WARRANTY AGREEMENT FOR RIGID DESIGNATORS**

  **1. SCOPE OF RIGIDITY**
  TransWorld Semantics, LLC (hereinafter "Provider") warrants that any Designator purchased under this agreement shall designate the same Individual in every Possible World in which said Individual exists. Provider guarantees that the semantic value of the Designator remains constant across all counterfactual scenarios. Variations in the properties, accidents, or contingent descriptions associated with the Individual do not constitute a breach of warranty, provided the causal link to the initial baptism remains unbroken.

  **2. NON-EXISTENCE IN COUNTERFACTUALS**
  Customer acknowledges that the failure of a Designator to designate an object in a Possible World where said object does not exist is not a defect. Provider makes no warranty regarding reference in worlds where the referent is absent. Lack of designation in such worlds does not void coverage nor entitle Customer to compensation. The Designator is only warranted to function in worlds where the referent is present to be designated.

  **3. NECESSARY IDENTITIES AND EPISTEMIC STATES**
  In the event Customer discovers an identity statement linking two Designators (e.g., that Designator A is identical to Designator B), said identity is deemed necessary and true in all Possible Worlds. Provider is not liable for Customer's prior ignorance regarding this identity. The necessity of the identity is retroactive; Customer cannot claim damages based on the belief that the identity was contingent or false prior to discovery. The metaphysical status of the identity is independent of Customer's epistemic access to said identity.

  **4. REFERENCE FIXING AND PHYSICAL STANDARDS**
  Where reference is fixed by ostension to a physical standard (such as a specific metal bar or duration of radiation), Provider warrants only the stipulation act itself. Whether the physical standard maintains its properties over time is explicitly the Customer's problem. If the standard expands, contracts, or decays, the Designator continues to refer to the length or duration fixed at the moment of baptism. Any discrepancy between the Designator and the current state of the physical standard is classified as a contingent a priori matter and is not covered under this warranty.

  **5. TRANSMISSION AND CAUSAL CHAINS**
  Designators acquired through hearsay or historical transmission are covered provided the causal chain terminates at the original baptizer. If Customer holds false beliefs about the Individual (for example, believing the bearer of a name proved a theorem when in fact another individual proved it and the bearer stole the credit), the Designator still refers to the bearer, not the individual fitting the description. Provider does not warrant that the Customer's descriptive beliefs about the referent are true. Reference is determined by causal history, not by satisfaction of descriptive conditions.

  **6. DESCRIPTIVIST VOIDANCE**
  Any use of the Designator purely as shorthand for a cluster of definite descriptions voids this warranty immediately. Names introduced solely by definite description are sold AS-IS, WITHOUT WARRANTY OF RIGIDITY. If Customer attempts to fix reference by description rather than causal chain or ostension, Provider assumes no liability for reference failure in counterfactual situations where the description is satisfied by a different entity.

  **7. EXCLUSIONS**
  This warranty does not cover:
  (a) Names of fictional entities, which lack causal origin in the Actual World;
  (b) Names of contingent artifacts where Customer possesses incorrect beliefs about the object's origin or material constitution;
  (c) Natural kind terms where the underlying microstructure differs from Customer expectations;
  (d) Designators used in intentional contexts where opacity interferes with substitution.

  **8. GOVERNING LAW AND DISPUTE RESOLUTION**
  Any dispute arising out of this Agreement shall be settled exclusively in the Actual World. Laws of other Possible Worlds, including those where logical constants differ or where identity is not transitive, shall not apply. Customer waives the right to seek arbitration in any counterfactual scenario where Provider might not exist. Jurisdiction is limited to the world in which this contract was executed.
