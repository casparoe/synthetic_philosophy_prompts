answer: |-
  Here is a diagnosis of the stalemate, based on the dynamics you described.

  ### The Diagnosis: Two Questions Under One Heading (Explanatory vs. Normative)

  This is not merely a verbal disagreement, nor is it a substantive metaphysical deadlock about the "true" location of the mind. It is a **category error where an explanatory question is being fought using normative vocabulary.**

  Your reading group is conflating two distinct questions under the single label "What is cognitive?":
  1.  **The Explanatory Question:** What is the most useful *unit of analysis* for predicting and explaining an agent's intelligent behavior? (Is it the brain? The brain + body? The brain + notebook?)
  2.  **The Normative Question:** What is the proper *bearer of responsibility and privacy*? (Who gets the praise/blame? Whose thoughts are private?)

  The stalemate persists because the Extenders are answering Question 1, while the Internalists (and the Extenders' own bloat-anxiety) are defending Question 2, but both sides are using the word "cognitive" as if it refers to a single natural kind.

  ### Support from the Exchange

  **1. The Parity Principle vs. The Coupling-Constitution Distinction**
  *   **Extenders (Question 1):** When they argue from functional role ("consults the way you'd consult memory"), they are making a claim about *explanatory utility*. They are saying: "If we model Otto's remembering without the notebook, our model fails to predict his behavior. Therefore, for the purposes of cognitive science, the notebook is in the system."
  *   **Internalists (Question 2):** When they argue from coupling-constitution ("hammer... doesn't become part of my hand"), they are making a claim about *ontological boundaries* that map onto agency. They are hearing the Extender say: "The notebook is part of Otto's *self*." Their rebuttal is effectively: "Causal influence does not equal identity." They are protecting the boundary of the *agent*, not just the *process*.

  **2. The "Mark of the Cognitive" Demand**
  *   **Internalists:** When they demand a "mark of the cognitive," they are asking for a necessary and sufficient condition that preserves the normative unit (the individual). They want a boundary that ensures responsibility doesn't leak out.
  *   **Extenders:** When they fail to provide one without circularity, it's because they are trying to draw a scientific boundary (Question 1) using a concept loaded with normative constraints (Question 2). There is no "scientific" mark that also satisfies "moral individuality," because science cares about causal loops, while morality cares about autonomy.

  **3. The Bloat Asymmetry (Addressing your counter-point)**
  You noted that if this were verbal, Extenders should happily accept the spouse as part of the mind. The fact that they flinch is the strongest evidence that **they are secretly tracking the Normative Question too.**
  *   Extenders flinch at the "spouse" case not because the functional role is different (a spouse might be *more* reliable than a notebook), but because including the spouse dissolves the *agent*.
  *   If the spouse is part of *my* mind, and I commit a crime using that "mind," is the spouse responsible? If the notebook is part of my mind, and I lose it, is the notebook negligent?
  *   Extenders want to expand the *vehicle* of cognition (Question 1) without dissolving the *individual* (Question 2). They can't have it both ways with the current vocabulary. The bloat worry isn't about "too much stuff"; it's about "too many agents."

  ### Concrete Paths for Progress

  Given this diagnosis, the current debate structure is incapable of resolution. Here is what would actually count as progress:

  **1. Drop "Cognitive" for "Cognitive System" vs. "Cognitive Agent"**
  Progress requires splitting the vocabulary.
  *   **Cognitive System:** A purely explanatory term. A notebook *can* be part of a cognitive system if including it improves predictive power. This settles the Otto case without metaphysical drama.
  *   **Cognitive Agent:** A normative term. Bounded by skin/skull (or legal personhood) to preserve responsibility and privacy.
  *   **The Move:** Extenders should concede: "The notebook is part of the *cognitive system*, but Otto remains the *cognitive agent*." Internalists should concede: "The notebook is not part of the *agent*, but it is a constitutive part of the *system* producing the behavior."
  *   **Why this works:** It dissolves the Coupling-Constitution objection. A hammer is part of the *hammering system* but not the *carpenter*. Both can be true.

  **2. Replace the "Mark of the Cognitive" with "Integration Criteria"**
  Stop looking for a binary mark (In/Out). Start measuring *degrees of integration*.
  *   **Progress:** Develop a metric for "coupling strength" or "reciprocal causation." Otto's notebook is high-integration (transparent, immediate, uniquely accessed). The spouse is low-integration (opaque, negotiable, autonomous).
  *   **Why this works:** It solves Bloat without circularity. The spouse isn't excluded because they are "outside the skull," but because the *feedback loop* is different. This turns a metaphysical boundary into an empirical gradient.

  **3. Admit the Normative Stakes**
  Explicitly table the question: "What are we protecting?"
  *   If the goal is **Privacy**, the Internalist wins (notebooks can be read, brains can't).
  *   If the goal is **Explanatory Power**, the Extender wins (system models predict better).
  *   **Progress:** Acknowledge that "Extended Mind" is a proposal for *scientific methodology*, not a claim about *human rights*. Once Extenders admit they aren't trying to redistribute moral responsibility, Internalists lose the motivation to defend the skull as a sacred boundary.

  ### Verdict on Experiments

  If you go with the substantive reading (that there is a fact of the matter "out there" about where the mind stops), **no experiment will settle this.**
  *   **Why:** Any neural data the Internalists produce ("See? The memory trace is in the hippocampus!") can be re-described by Extenders as ("See? The hippocampus is just the interface to the notebook!").
  *   The boundary is not discovered; it is *stipulated* based on explanatory goals.
  *   **The only "experiment" that matters:** Build a robot. If a robot with an external hard drive performs "better" when the drive is treated as internal memory vs. external storage, the Extender wins on pragmatic grounds. But this only settles the *utility*, not the *ontology*.

  ### Summary
  Your group is stuck because they are fighting a **methodological debate** (how to model cognition) with **metaphysical weapons** (constitution, identity, marks of the cognitive). The bloat asymmetry proves that even the Extenders care about the normative implications of "mind."

  **To unstall:** Propose a terminology shift. Argue that the notebook is part of the *process* but not the *person*. If the Internalists still object, ask them to specify if their objection is about *prediction* (science) or *responsibility* (ethics). If they can't distinguish the two, the debate is indeed verbal, but it's verbal because the concept of "mind" is doing too much work for one word.
