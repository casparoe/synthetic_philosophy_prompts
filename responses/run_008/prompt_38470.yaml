answer: |-
  **MEMORANDUM**

  **TO:** National Wellbeing Programme Advisory Panel
  **FROM:** [Your Name], External Advisory Panel Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Headline Indicator Selection and Implementation Protocol

  **1. Purpose**
  This memo serves to frame our decision this Thursday regarding the anchor for the National Wellbeing Programme's headline indicator. The Treasury requires a single, monetizable metric to weigh policy outcomes against GDP in cost-benefit appraisals. Based on the recent clean-air zone pilot and the theoretical underpinnings of the three proposed options, I recommend we anchor the headline indicator on **Option 2: Experienced Utility (Survey-Based)**.

  **2. What We Are Measuring: Three Conceptions of Utility**
  To ensure clarity for public communication and internal alignment, we must define what "utility" means under each option. In plain terms:

  *   **Option 1 (Behavioural/Revealed Preference):** This claims utility is **what you choose**. It assumes you are the best judge of your own welfare, and that your spending and location decisions prove what you value. If you stay in a polluted area, this model assumes the rent discount compensates you sufficiently.
  *   **Option 2 (Experienced/Survey-Based):** This claims utility is **what you feel**. It assumes choices can be mistaken or coerced by circumstance. It argues that people adapt to misery (lowering their expectations) or mispredict what will make them happy. It measures the hour-by-hour reality of life, not just the decisions made about it.
  *   **Option 3 (Dashboard/Non-Aggregated):** This claims utility is **too complex for a single number**. It argues that wellbeing is a vector of health, connection, security, and purpose that cannot be collapsed into one metric without losing essential meaning.

  **3. Recommendation and Rationale**
  I recommend **Option 2** as the headline anchor.

  While Option 3 is philosophically robust, it fails the Treasury's mandate for a single number required for cost-benefit analysis. Between Option 1 and Option 2, the pilot data on the clean-air zone provides a decisive empirical reason to reject Option 1 as the primary anchor.

  In the pilot, the behavioural valuation (Option 1) was a small fraction of the survey-based valuation (Option 2). Residents in polluted districts had adjusted their housing choices *and* their life-satisfaction answers. This is **hedonic adaptation**: people lower their standards to match their constraints. If we anchor on Option 1, we systematically undervalue policies that improve conditions for the most adapted (and often most disadvantaged) populations. We would conclude that clean air is not "worth" the cost, simply because the sufferers have learned to stop expecting it.

  For the Treasury to accurately appraise policy, the metric must capture the *gain* in wellbeing, not just the *market price* of that gain. Option 2 captures the latent demand for wellbeing that markets miss.

  **4. Engaging the Counter-Argument (The Case for Option 1)**
  We must take seriously the strongest argument for Option 1, which we are setting aside. Revealed preference is the only method that respects **budget constraints and trade-offs**.

  Survey respondents in Option 2 can express a desire for "perfect health" or "zero commute" without costing them anything. It is "cheap talk." Option 1 forces a test: to get clean air, you must pay higher rent or taxes. By choosing Option 2, we risk creating a wishlist of wellbeing that ignores economic reality. We must acknowledge that Option 1 provides a crucial discipline: it reminds us that resources are finite and that every improvement has an opportunity cost. If we ignore this, we risk recommending policies that are psychologically beneficial but economically unsustainable.

  **5. Protocol for Handling Divergences**
  Because Option 2 ignores price constraints, there will be divergences between what people say makes them happy and what they can afford to choose. We will adopt the following protocol:

  1.  **The Headline:** The monetized value of Experienced Utility (Option 2) serves as the primary benefit metric in appraisals.
  2.  **The Constraint Check:** Revealed Preference data (Option 1) will be published simultaneously as a "Constraint Index."
  3.  **The Divergence Rule:** If the Headline (Experience) indicates high benefit, but the Constraint Index (Behaviour) indicates low willingness/ability to pay, the policy appraisal must trigger a **Distributional Impact Review**.
      *   *Reasoning:* A large gap suggests the population is adapted to deprivation or lacks the liquidity to vote with their feet. The policy is valid, but the cost burden must be scrutinized to ensure it does not fall on those already adapted to low utility.

  **6. Monetization and Timeline**
  To satisfy the Treasury, we must convert "experience minutes" into currency. We will use the survey data to calculate the income equivalent required to generate the same uplift in reported experience.

  *   **Phase 1 (Nov–Jan):** Calibrate the conversion rate. Correlate income increments with experience-sampling scores in the existing dataset to establish a "Shadow Price of Wellbeing."
  *   **Phase 2 (Feb–Apr):** Run parallel appraisals on three pending policies using both Option 1 and Option 2 to demonstrate the divergence magnitude to the Treasury.
  *   **Phase 3 (May):** Publish the first National Wellbeing Account with Option 2 as the headline, accompanied by the Constraint Index.

  **7. Conclusion**
  By choosing Option 2, we commit to the claim that a life is more than the sum of its market choices. We acknowledge that citizens adapt to hardship, and that a statistics office must measure the hardship, not just the adaptation. This approach provides the Treasury with a more accurate assessment of policy benefits, ensuring we do not mistake silence for satisfaction.

  I look forward to discussing this framework on Thursday.
