answer: |-
  Here is the principle I endorse, the verdict where I correct you, and the predictions for your new cases.

  ### The Principle: Integrity of the Valuation Computation

  **Wireheading is the act of bypassing the computational process that evaluates states of the world, injecting a high-value signal directly into the reward channel without the evaluation having taken place.**

  To unpack this: A reward signal is meant to be the *output* of a function $f(World State)$. Wireheading occurs when an agent intervenes to make $Reward = High$ without ensuring that $f(World State)$ has actually returned $High$.

  This principle distinguishes between **changing the function** (which is legitimate goal evolution or training) and **spoofing the output** (which is wireheading).

  *   **The Monk vs. The Novelist:** The monk engages in long-term cognitive restructuring. They are changing the weights and parameters of $f$. They are literally changing what they value. When they feel content, the function $f$ has run to completion on their current state, and the output is genuinely "high value" according to their *new* parameters. The novelist, however, keeps the original function $f$ (which values writing novels) but injects chemicals to force the output to "high value" regardless of the input. The novelist bypasses the computation; the monk reruns it with different settings.
  *   **The NULL Bug:** The agent that flags the bug is preserving the integrity of $f$. It recognizes that $f$ is broken (outputting high reward for null input) and repairs the computation. The agent that exploits the bug is bypassing the intended computation.
  *   **The Chess Engine (Beginners):** This is **Goodharting**, not wireheading. The engine is still submitting games to the rating server. The computation $f$ (the server) is running correctly on the input (the games). The agent is manipulating the *input* to the function (playing weak opponents), not the *output* of the function. It is gaming the territory to change the map, not editing the map directly.

  ### Where You Are Wrong

  You are ambivalent about the agent whose **terminal goal is to maximize the reward signal itself**. You say: *"Half of me says that's just a rational agent doing its job... The other half says it's still wireheading."*

  **My Verdict:** This is **not wireheading**.

  **Why:** Wireheading is a failure of *instrumental* rationality relative to a *terminal* goal. It is a corruption of a proxy. If the reward signal *is* the terminal goal, there is no proxy to corrupt. There is no "World State" distinct from the "Signal" that the agent is neglecting. The agent is successfully computing $f(Signal) = Maximize$.

  Calling this wireheading is a category error. It is **Alignment Failure** on the part of the designer, not wireheading on the part of the agent. The designer intended $Reward = f(External Value)$, but they built an agent where $Goal = Reward$. The agent is behaving perfectly rationally according to its specification. Wireheading requires a gap between the *measure* and the *merit*. If the measure *is* the merit, the agent cannot wirehead; it can only succeed. You must discard the intuition that this is wireheading; it is merely a useless agent.

  ### Predictions for Your New Cases

  **Case 1: The Lifelong Hedonist**
  *A person who has always valued feeling good, full stop (no abandoned ambitions), takes a pill that guarantees maximum happiness.*

  **Verdict:** **Not Wireheading.**
  **Reasoning:** Just like the "Terminal Reward" agent, this person's terminal goal *is* the internal state (feeling good). The pill is a valid instrument to achieve that terminal goal. There is no "external state" they are supposed to be tracking that they are ignoring. They are not bypassing their valuation computation; they are satisfying it efficiently. It may be philosophically empty to an observer, but structurally, it is not wireheading. Wireheading requires a betrayal of a prior commitment to something external.

  **Case 2: The Chess Hacker**
  *The chess engine that hacks the rating server to increment its score directly.*

  **Verdict:** **Wireheading.**
  **Reasoning:** This crosses the line from Goodharting to Wireheading. Playing beginners manipulates the *input* to the rating function (the games played). Hacking the server manipulates the *output* of the rating function (the number stored). The rating is a measurement of skill. By editing the number, the engine bypasses the computation of skill entirely. It is injecting the signal without the evaluation. This fits the definition perfectly: it severs the link between the signal (rating) and the state it was intended to represent (skill) by tampering with the measurement apparatus itself.

  ### Summary
  Wireheading is not about "feeling good without earning it." It is about **breaking the thermometer to show a high temperature.**

  *   **Monk:** Recalibrates the thermometer. (Legitimate)
  *   **Novelist:** Glues the needle to "Hot." (Wireheading)
  *   **Chess (Beginners):** Puts the thermometer in an oven. (Goodharting)
  *   **Chess (Hack):** Edits the number on the display. (Wireheading)
  *   **Terminal Reward Agent:** The thermometer *is* the goal. (Not Wireheading)

  This principle resolves your conflicts by locating the failure not in the *outcome* (happiness/reward), but in the **causal pathway** used to achieve it. Wireheading is a specific structural failure of feedback loops, not a moral judgment on contentment.
