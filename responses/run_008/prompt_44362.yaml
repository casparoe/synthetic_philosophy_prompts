answer: |-
  This is a remarkably precise observation, and your intuition that it sits in a gap between Lewisian convention, moral psychology, and pragmatics is correct. You have identified a mechanism of social normativity that is often practiced but rarely theorized under a single heading.

  To answer your first question directly: **No, there is no single established name for this specific configuration.**

  There are adjacent concepts in the literature, but none capture the *epistemic conditionality* of the normative force as you have described it.
  *   **David Lewis** treats conventions as solutions to coordination problems. For Lewis, a violation is primarily a failure of coordination or a lack of common knowledge. He does not theorize the *expressive* content of the violation once knowledge is established.
  *   **Cristina Bicchieri** (in *The Grammar of Society*) distinguishes between *descriptive norms* (what is done) and *injunctive norms* (what ought to be done). She discusses how expectations condition behavior, but her focus is on the population's stability, not the micro-sociological interpretation of an individual agent's epistemic status.
  *   **Erving Goffman** (in *Interaction Ritual*) discusses "face-work" and how violations threaten social order. He comes closest with the idea that an offense requires *intent* or *negligence*, but he does not explicitly formalize the threshold where "ignorance" converts to "negligence" based on tenure/residency.
  *   **Signaling Theory** (biology/economics) explains *why* the behavior is a signal (costly adherence), but it does not typically model the *receiver's interpretation* shifting based on the sender's history of exposure.

  Because the terrain is unmarked, I will attempt the carving you requested.

  ### The Proposed Term: **Epistemically-Conditioned Conventional Regard (ECCR)**

  I propose this term to distinguish the phenomenon from both simple convention-breaking and the moralization of practices.

  #### 1. Definition
  **Epistemically-Conditioned Conventional Regard** occurs when an arbitrary social convention functions as a **signal of interpersonal attitude** rather than a **rule of coordination**, contingent upon the agent's verified epistemic access to the convention.

  The phenomenon relies on four conditions:
  1.  **Arbitrariness:** The rule has no intrinsic moral weight (e.g., shoe removal vs. moral prohibition on theft).
  2.  **Common Knowledge:** The rule is known within the local population.
  3.  **Epistemic Asymmetry:** The observer can distinguish between an agent who *cannot know* the rule (outsider) and one who *must know* the rule (insider).
  4.  **Attitudinal Inference:** Once the "ignorance hypothesis" is excluded, compliance is inferred as *regard* (solidarity, respect), and violation is inferred as *disregard* (contempt, indifference).

  #### 2. Distinctions

  **A. Versus Ordinary Convention-Breaking**
  In ordinary convention-breaking (the Lewisian view), a violation is a coordination failure or a mistake. It generates confusion or minor inconvenience.
  *   *In ECCR:* The violation generates **affective injury**. The host is not confused; they are hurt. The content of the act is irrelevant; the *implicature* is "I know this bothers you, and I do not care."

  **B. Versus Moralization of a Practice**
  Moralization occurs when the *content* of the rule itself acquires intrinsic value (e.g., tipping shifts from "custom" to "fair wage obligation" in the minds of the staff).
  *   *In ECCR:* The rule remains arbitrary. The hosts do not believe shoe-removal is universally right. They believe that *for this agent, in this context*, failing to do it signals a lack of relational commitment. The normativity lies in the **relationship**, not the **rule**.

  #### 3. Edge Cases and Boundaries

  You asked specifically about the edges of this carving. Here is how ECCR handles them:

  **Case 1: The Conscientious Objector (The Resident who Objects)**
  *   *Scenario:* A decade-long resident refuses to remove shoes, stating, "I understand the custom, but I find it uncomfortable/unnecessary."
  *   *Analysis:* This falls **outside** ECCR's primary mechanism but remains within its scope of interpretation. The epistemic condition is met (they know), so the "ignorance" defense is void. However, the inference shifts from *disregard* to *dissent*.
  *   *Outcome:* The hosts may still feel wounded, but the category of the wound changes. It is no longer "They don't care about us," but "They care about their comfort more than us." This is often treated as a stronger breach than accidental violation because it asserts a hierarchy of values. In ECCR terms, the signal is no longer noise; it is a counter-signal.

  **Case 2: The Accidental Complier (The Tourist who Gets it Right)**
  *   *Scenario:* A tourist removes shoes solely because everyone else is doing it, without understanding the norm.
  *   *Analysis:* This is a **false positive** for ECCR. The hosts initially receive the signal of regard.
  *   *Outcome:* If the epistemic status is later revealed (e.g., the tourist asks, "Why did we do that?"), the "warmth bonus" is retroactively withdrawn. The act is re-categorized as *mimicry* rather than *regard*. This proves that ECCR is not about the act itself, but about the *intentionality* inferred from knowledge.

  **Case 3: The Eccentric Local (The Violator with High Regard)**
  *   *Scenario:* A long-term resident never tips but is otherwise generous, loyal, and kind.
  *   *Analysis:* This is **Signal Override**. ECCR functions on a "ceteris paribus" basis. Conventions are low-cost signals. If an agent provides high-cost signals of regard (time, emotional support, large favors), the low-cost signal (tipping) can be discounted as idiosyncrasy rather than disregard.
  *   *Outcome:* The violation is re-coded as "quirk" rather than "insult." The boundary of ECCR is breached when the cost of other signals outweighs the cost of the conventional signal.

  ### Philosophical Context: Why This Matters

  You noted you are less interested in the label than the carving. The reason this carving matters is that it locates a specific type of normativity that is neither **moral** (Kantian/Categorical) nor **prudential** (Lewisian/Coordination).

  It is **Relational Normativity**.

  In your examples, the "law" being broken is not "Remove Shoes." The law being broken is "Acknowledge our shared reality."
  *   When the ignorant violate it, they are outside the shared reality, so they cannot break the law of maintaining it.
  *   When the knowledgeable violate it, they are inside the shared reality and choosing to negate it.

  This aligns closely with **P.F. Strawson's** reactive attitudes (in *Freedom and Resentment*). Strawson argues that resentment is appropriate when a agent shows ill will or indifference. Your pattern suggests that conventions serve as the **diagnostic tools** for detecting that indifference. They are the low-stakes probes we use to measure high-stakes attitudes.

  ### Summary

  There is no existing term. The phenomenon is a hybrid of **Gricean Implicature** (the act implies an attitude) and **Signaling Theory** (the act is costly only if you know better), filtered through **Social Epistemology** (what the agent is known to know).

  I suggest **Epistemically-Conditioned Conventional Regard**.

  *   **It is not** moralization (the rule doesn't change).
  *   **It is not** simple coordination (the payoff isn't efficiency, it's relational).
  *   **It is** a mechanism by which arbitrary rules are recruited to police the boundaries of community membership and mutual respect.

  Your observation that the convention functions as a "test of attitude precisely once the hypothesis of ignorance has been excluded" is the precise definition of the threshold. You have effectively identified the **epistemic trigger** for social resentment.
