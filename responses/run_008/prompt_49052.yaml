answer: |-
  # The Causation Decision Tree: Fire, Cotton, and the First Cause

  **Instructions:** Start at **Node 1**. Answer the question based on your intuitions about the case of fire touching cotton and the cotton burning. Follow the arrow to the next node or to a final position (Leaf).

  ### Node 1: The Modal Status
  **Could God sustain the fire and the cotton exactly as they are, but prevent the burning from occurring, without performing a "miracle" (i.e., without changing their natures)?**
  *   **No** (The connection is metaphysically necessary; given their natures, the effect *must* follow): → **Leaf A: Avicenna (Essentialist Causation)**
  *   **Yes** (The connection is contingent; God could separate them): → **Node 2**

  ### Node 2: Created Efficacy
  **In the moment of burning, does the fire contribute any *reality* or *action* to the production of the burn, or is it merely present as an occasion?**
  *   **No** (The fire is ontologically inert; it does nothing): → **Node 5**
  *   **Yes** (The fire is a genuine agent; it does something): → **Node 3**

  ### Node 3: Divine Concurrence
  **If the fire contributes action, does God *also* directly cause the very same burning event alongside the fire?**
  *   **Yes** (Two causes, one effect: Primary and Secondary): → **Leaf B: Aquinas (Concurrentism)**
  *   **No** (God does not directly cause the burning): → **Node 4**

  ### Node 4: Divine Sustenance
  **If God does not cause the burning, does He still need to actively sustain the *existence* of the fire moment-to-moment?**
  *   **Yes** (God conserves the substance, but lets it act alone): → **Leaf C: Mere Conservationism**
  *   **No** (The fire exists and acts independently of God): → **Leaf D: Humean Regularity**

  ### Node 5: Human Agency
  **If the fire has no causal power, do *you* have causal power when you choose to move your hand?**
  *   **Yes** (Physical elements are inert, but human will is efficacious): → **Node 6**
  *   **No** (Nothing created has causal power; God does everything): → **Leaf E: Malebranche (Occasionalism)**

  ### Node 6: Divine Freedom
  **If humans have power but elements do not, is the "Habit of Nature" (fire burning cotton) breakable by God at any moment for any reason?**
  *   **Yes** (God's Will is absolutely free; regularity is pure custom): → **Leaf F: al-Ghazālī (Ash'arite Occasionalism)**
  *   **No** (God acts according to an eternal Order; He won't violate it without reason): → **Leaf E: Malebranche (Occasionalism)**
      *(Note: If you answered "No" here, you join Malebranche at Leaf E. If you answered "Yes" at Node 5, you are al-Ghazālī.)*

  ---

  ## The Leaves (Positions)

  *   **Leaf A: Avicenna.** Causes essentially produce effects. The universe is a necessary emanation.
  *   **Leaf B: Aquinas.** God and creatures both truly cause the effect, but at different levels (Primary/Secondary).
  *   **Leaf C: Mere Conservationism.** God creates and sustains things in being, but secondary causes operate independently.
  *   **Leaf D: Hume.** No necessary connection, no Divine Will grounding the sequence. Regularity is brute fact + psychological habit.
  *   **Leaf E: Malebranche.** No created cause has power (not even humans). God is the only cause. Order is fixed by Divine Reason.
  *   **Leaf F: al-Ghazālī.** No physical cause has power, but humans have "acquisition" (*kasb*). Regularity is God's voluntary custom (*adah*), which He could change at any instant.

  ---

  ## Commentary on the Logical Space

  ### 1. Empty and Unoccupied Regions
  There are two logically possible combinations of answers that no major historical figure occupies. You should point these out to students to show why the occupied positions are stable.

  *   **The "Inert Universe, No God" Void (Node 2: No → Node 4: No).**
      *   *The Position:* Fire has no power, humans have no power, yet there is no God sustaining the sequence.
      *   *Diagnosis:* **Incoherent.** If creatures are ontologically inert (Occasionalism), *something* must bridge the gap between contact and effect. If you remove God (Hume) but keep the inertia (Ghazālī), you have an effect with *no* cause whatsoever, not even a psychological one. Hume avoids this by treating the fire as effectively causal in the phenomenal world; Ghazālī avoids it by positing God. Denying both leaves the burning unexplained.
  *   **The "Necessary Connection, No Efficacy" Void (Node 1: Yes → Node 2: No).**
      *   *The Position:* The link between fire and cotton is metaphysically necessary, but the fire contributes no action to it.
      *   *Diagnosis:* **Unattractive/Redundant.** If the connection is necessary, something must ground that necessity. If it isn't the fire's nature (since it has no efficacy), it must be God's nature. But if God's nature necessitates the effect, we are back to Avicenna's emanation where the fire *is* the channel of that necessity. Denying the fire's efficacy while keeping the necessity makes the fire a "necessary nothing," which collapses into either Avicenna (fire has derived power) or Occasionalism (connection isn't necessary, it's willed).

  ### 2. Indistinguishable Leaves (The "Glue" Problems)
  You asked for honesty on where the tree struggles to separate positions. There are two friction points.

  *   **al-Ghazālī (Leaf F) vs. Malebranche (Leaf E):**
      *   *The Problem:* Metaphysically, regarding the fire and cotton, they are identical. Both say the fire is inert and God causes the burn.
      *   *The Split:* I used **Node 5 (Human Agency)** and **Node 6 (Divine Freedom)** to separate them. However, this is fragile. Strict Ash'arism (al-Ghazālī's school) often denies created power even in humans (via the theory of *kasb*, or "acquisition"), which makes them look exactly like Malebranche.
      *   *Pedagogical Fix:* If students land on Malebranche but claim to be al-Ghazālī, accept it *if* they acknowledge the theological difference: al-Ghazālī's occasionalism is a defense of **Miracle** (God can break the habit anytime), whereas Malebranche's is a defense of **Simplicity/Order** (God acts via general volitions). The tree forces a choice at Node 6, but in reality, these two leaves are glued together on physics and only separate on theology.
  *   **al-Ghazālī (Leaf F) vs. Hume (Leaf D):**
      *   *The Problem:* Both deny necessary connection. Both appeal to "habit" or "custom."
      *   *The Split:* The tree separates them at **Node 2 (Created Efficacy)** and **Node 4 (Divine Sustenance)**. Hume treats the fire as having efficacy (phenomenally) and requires no God. Ghazālī treats the fire as inert and requires God.
      *   *Pedagogical Fix:* Students often conflate "I can't *perceive* necessity" (Hume) with "There *is* no necessity" (Ghazālī). The tree forces them to decide if the regularity is grounded in a **Divine Will** (Ghazālī) or is a **Brute Fact** (Hume). If a student says "I don't know if God exists, but I know fire burns," they slide toward Hume. If they say "Fire doesn't burn, God burns," they are Ghazālī. This is the most critical distinction for your course: Epistemic Skepticism (Hume) vs. Ontological Occasionalism (Ghazālī).

  ### 3. Usage Note
  This tree is designed to prevent students from sorting by "brand name" (e.g., "I'm a Muslim, so I pick Ghazālī"). By forcing them to answer whether the *fire* does anything before asking about *God*, you reveal that Aquinas and Avicenna are closer to each other than either is to Ghazālī on the physics, while Ghazālī and Malebranche are closer to each other than either is to Hume on the metaphysics. Use the "Empty Regions" commentary to show why their intuitions naturally cluster around the historical leaves.
