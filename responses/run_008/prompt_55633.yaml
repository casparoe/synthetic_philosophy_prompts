      *   **R (Realist/Preservationist):** FP is indispensable. We can't function without it. Elimination is self-undermining. Beliefs are real (either via reduction or non-reductive realism).
      *   **The Conflict:** Talking past each other. E thinks R misses the radical nature of elimination. R thinks E is incoherent.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Substantive agreement that rules out easy outs.
      *   *Idea 1:* FP is a theory (theory-theory agreement). Both usually accept this to some degree, but R might lean towards phenomenological immediacy. Let's stick to the *status* of FP as a cognitive framework.
      *   *Idea 2:* Neuroscience is currently incomplete. Neither side can claim victory *now*.
      *   *Idea 3:* The criteria for "Vindication" vs. "Replacement." This is crucial. Vindication = smooth mapping/reduction. Replacement = ontological discontinuity.
      *   *Refinement:* Make sure it's not just "we agree science is good." It needs to be "we agree that *this specific condition* determines the winner."
      *   *Drafting thought:* Avoid saying "FP is true/false." Say "FP posits states with causal powers."

  4.  **Drafting Section 2: Precise Disagreements (The "Self-Defeat" Issue):**
