answer: |-
  This is a smart move. Adversarial collaboration works best when you force the parties to bet on outcomes rather than definitions. Since E and R know the literature, I've skipped the intro to FP and gone straight to the intertheoretic relations and the specific architectural claims that actually divide them.

  Here is a draft framework. I've kept the language technical but operational. I also included a "Mediator's Note" at the end regarding your hunch on the verbal dispute.

  ***

  # ADVERSARIAL COLLABORATION FRAMEWORK: STATUS OF FOLK PSYCHOLOGY
  **Parties:** E (Eliminativist), R (Realist/Preservationist)
  **Facilitator:** [Your Name]
  **Date:** [Current Date]

  ## I. SUBSTANTIVE AGREEMENTS (PRE-COMMITMENTS)
  *The following claims are accepted by both parties as the baseline for this collaboration. Denial of these claims constitutes a withdrawal from the collaboration.*

  1.  **FP as Theoretical Framework:** Both parties agree that Folk Psychology (FP) functions as a *theory-theory* framework for prediction and explanation of behavior, positing internal states (beliefs, desires) with specific causal roles and propositional content. The dispute is not about whether FP is *useful* in daily life, but whether its ontology corresponds to causal structures in the CNS.
  2.  **Current Empirical Underdetermination:** Both parties agree that current neuroscience and cognitive science data are insufficient to definitively vindicate or eliminate FP. Claims that "science has already decided" are ruled out as premature.
  3.  **Criteria for Vindication (Reduction):** Vindication requires a smooth intertheoretic reduction where FP categories map onto neurocomputational categories without loss of explanatory power, preserving the *propositional structure* of the folk categories.
  4.  **Criteria for Elimination (Replacement):** Elimination occurs if the mature neuroscience of cognition posits mechanisms that explain behavior more accurately than FP, but where the mapping to FP categories is discontinuous, gerrymandered, or requires abandoning the notion of discrete, sentence-like propositional attitudes.
  5.  **The "Success" Argument is Insufficient:** Both parties agree that the pragmatic success of FP in daily life is not proof of its ontological truth (analogous to the pragmatic success of geocentric navigation not proving geocentrism).

  ## II. DISAGREEMENT MATRIX & PREDICTIVE BEARINGS

  | CRUX | E (ELIMINATIVIST) POSITION | R (REALIST) POSITION | BEARING: WHAT COUNTS AS EVIDENCE? | PREDICTIONS (IF EVIDENCE OBTAINS) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Self-Defeat Objection**<br>*("You believe there are no beliefs")* | **Category Error.** The objection equivocations on "believe." E accepts they are in a cognitive state of *acceptance*, but denies this state instantiates the *folk-theoretic structure* of a "belief" (i.e., a relation to a sentence in a Language of Thought). The objection assumes the truth of FP to argue against its falsity. | **Performative Contradiction.** To argue against beliefs, one must employ the normative space of reasons, which is constituted by belief-attitudes. If FP is false, the argument E is making has no truth-apt content. The "category error" defense is a semantic dodge to avoid ontological incoherence. | **Analysis of Cognitive Architecture.** Does the brain require a "normative space of reasons" implemented via propositional attitudes to generate argumentation, or can sub-symbolic competitive activation produce argument-like output? | **E:** If neural modeling shows argumentation emerges from non-propositional vector transformations, the objection dissolves.<br>**R:** If neural modeling shows that stable representation of *truth conditions* is required for coherent output, the objection holds. |
  | **2. Temperature vs. Phlogiston**<br>*(The Reduction Analogy)* | **Phlogiston.** FP is a radically false theory about internal causation. Like phlogiston, its posits (belief/desire) do not exist. The term will not survive reduction; it will be discarded for a more accurate vocabulary (e.g., activation vectors). | **Temperature.** FP tracks real higher-order patterns. Like temperature (mean kinetic energy), "belief" will be reduced to a complex neural/computational state. The term survives because the functional role is real, even if the micro-structure is different than assumed. | **Mapping Granularity.** Can we identify a neural/computational kind that corresponds to "Belief that *p*" across different contexts without the mapping being disjunctive or infinitely complex? | **E:** Predicts mapping will fail or be so disjunctive it counts as replacement (e.g., "belief" maps to 50 different vector configurations with no common denominator).<br>**R:** Predicts mapping will find a stable functional/computational kind, even if multiply realized at the neuronal level. |
  | **3. Predictive Processing (PP)**<br>*(Bayesian Brain Hypothesis)* | **Replacement Vocabulary.** Priors and likelihoods are sub-symbolic weights, not propositional attitudes. A "prior" is not a "belief that *p*." PP explains why FP *seems* true while showing its ontology is false. | **Vindication.** Hierarchical Bayesian inference *is* the mechanism of belief fixation. "Updating a prior" is the computational realization of "changing a belief." PP naturalizes FP rather than eliminating it. | **Representational Format.** Do the "priors" in the brain have combinatorial syntax and semantics (LoT style), or are they distributed activation patterns? | **E:** Predicts neural encoding will lack sentence-like structure (no syntax/semantics interface), making "belief that *p*" a misleading gloss.<br>**R:** Predicts that at the computational level (Marr), the system manipulates structures isomorphic to propositions, validating the folk term. |
  | **4. Dennettian Instrumentalism**<br>*("Real Patterns")* | **Concession of Falsity.** Calling beliefs "real patterns" admits they are not *fundamental* causal drivers. It saves the utility of FP but concedes the ontological point: there are no beliefs *in the head*, only patterns in the behavior interpreted by an observer. | **Ontological Sufficiency.** "Real patterns" are all the reality we get for any macro-level object (tables, cells, beliefs). If the pattern is robust enough to support counterfactuals, the entity is real. Instrumentalism *is* a form of realism for functional kinds. | **Causal Power.** Do the patterns identified by FP exert downward causal control, or are they epiphenomenal summaries of lower-level processes? | **E:** Predicts FP patterns will be shown to be descriptive summaries only, with causal work done entirely by lower-level neurodynamics.<br>**R:** Predicts FP patterns will be shown to be causally relevant constraints on lower-level dynamics (e.g., via top-down modulation). |

  ## III. MEDIATOR'S NOTE ON VERBAL DISPUTES
  *(For internal use/facilitation)*

  There is a high probability that **Crux 1 (Self-Defeat)** is a verbal dispute masking a substantive one.
  *   **Why:** E uses "believe" to mean *any state of cognitive acceptance*. R uses "believe" to mean *instantiation of a specific folk-theoretic role*.
  *   **Resolution Strategy:** Force E to specify the *alternative vocabulary* for their own cognitive state during the argument (e.g., "I am in activation state A-12 which functions as..."). Force R to specify if they require *conscious access* to the belief for the objection to hold. If R admits unconscious beliefs count, and E admits they have unconscious cognitive states, the gap narrows to the *structure* of those states, not their existence.

  ***

  ### Comments on your hunches (for you, not the doc):

  1.  **Temperature vs. Phlogiston:** You are right to suspect this is E's favorite rhetorical trick. It's often a stalemate because it depends on how strictly you define "reduction." If R accepts *non-strict* reduction (functionalism), E loses. If E insists on *strict* identity theory, R loses. The evidence bearing on this is **multiple realizability**. If "belief" is realized by wildly different physical states in humans, octopuses, and aliens, E wins (it's not a natural kind). If they share a computational structure, R wins.
  2.  **Predictive Processing:** This is the most dangerous crux for E. If the brain is literally minimizing surprise based on hierarchical models, that looks a lot like "having beliefs about the world." E's only out is to insist that *probabilistic weights* are not *propositions*. This is a strong technical distinction, but it risks making "belief" so narrow that only a logician has them.
  3.  **Dennett:** This is definitely a half-win for E. If R accepts Dennett, they are admitting beliefs aren't "in the head" in the way a neuron is. They are observer-relative. E will argue this is just elimination with extra steps. R needs to argue that *all* macro-ontology (biology, economics) is observer-relative, so why single out psychology?

  **Advice for the meeting:** Don't let them linger on Crux 1. It's a black hole. Push them immediately to Crux 3 (Predictive Processing). That's where the actual neuroscience is happening, and it's where the "sentence-like structure" vs. "vector weight" distinction is empirically testable within our lifetimes.
