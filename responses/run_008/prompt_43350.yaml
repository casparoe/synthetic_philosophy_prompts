prompt: |-
  Ok so my maths teacher told us about Bertrand's paradox and I've built it into an argument that I can't find a way out of, except the conclusion feels way too strong. (1) If you've got no information that favours one possibility over another, you should assign them equal probalities — that's the principle of indifference. (2) In Bertrand's chord problem you pick a chord of a circle "at random" and ask for the probability it's longer than a side of the inscribed equilateral triangle. (3) Applying (1) three different ways: choose the two endpoints uniformly on the circumference and you get 1/3; choose the chord's midpoint uniformly along a radius and you get 1/2; choose the midpoint uniformly over the whole disk and you get 1/4. (4) Each method is just "no reason to favour any chord over any other", so indifference is being applied fairly all three times. (5) The circle and the triangle are identical in all three methods, so it's the same event, and (6) one event can't have three different probabilities. (7) So the principle of indifference contradicts itself, and a self-contradictory principle has to be dropped — which means for questions with no data at all, like this one, there's no rational way to assign probabilities, and every prior is as good as every other. That last bit seems to prove too much, since statisticians use uninformative priors all the time and they're not obviously being irrational. So: which step should I give up, and what does giving it up cost me? If I have to choose, I'd rather keep some version of (1) than accept that any prior is as good as any other, so tell me honestly if that's a bad trade. Please say how confident you are in each part of your answer and single out the point you're least sure of, and write it all in British English.
