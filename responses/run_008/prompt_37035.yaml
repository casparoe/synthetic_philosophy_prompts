  ### 1. Candidate Rules Consistent with Cases 1–5

  Two primary philosophical theories of lying fit the first five rulings. Both account for the distinction between lying and misleading, and both account for the separation of lying from wrongness.

  **Rule A: The Deceptionist View (Intent-Based)**
  *   **Definition:** To lie is to assert what one believes to be false *with the intention of deceiving the audience* into believing it is true.
  *   **Fit:**
      *   *Case 1 (Witness):* Asserts falsehood + intends deception = **Lie.**
      *   *Case 2 (Referee):* Asserts truth (words are true) + intends deception (via implicature) = **Not a Lie** (misleading).
      *   *Case 3 (Hyperbole):* Asserts falsehood + *no intent to deceive* (convention understood) = **Not a Lie.**
      *   *Case 4 (Santa):* Asserts falsehood + intends deception = **Lie.**
      *   *Case 5 (Pointing):* Asserts falsehood (via gesture) + intends deception = **Lie.**

  **Rule B: The Commitment/Warranty View (Assertion-Based)**
  *   **Definition:** To lie is to assert what one believes to be false *while warranting the truth of that assertion*, regardless of whether one expects to be believed. (Lying is a violation of the norm of truth-telling, not necessarily a successful psychological manipulation).
  *   **Fit:**
      *   *Case 1:* Warrants truth of false statement = **Lie.**
      *   *Case 2:* Warrants truth of *words* (which are true), not the implicature = **Not a Lie.**
