      *   *Case 4:* Warrants truth of false statement = **Lie.**
      *   *Case 5:* Gesture functions as a warranty of truth = **Lie.**

  ### 2. Divergence on Case 6 (The Treasurer)

  The sixth case is a classic "Bald-Faced Lie." The treasurer asserts a falsehood ("I never took any money") which he knows is false. However, he *knows no one will believe him*.

  *   **Under Rule A (Deceptionist):** This is **Not a Lie**. Because he knows the members have seen the video, he lacks the *intention to deceive* them. He is merely obstructing the record.
  *   **Under Rule B (Commitment):** This **Is a Lie**. He is making a formal assertion in a context that demands truth (a club meeting), warranting it as true, while knowing it is false. The lack of intent to deceive is irrelevant to the definition; the breach of the warranty is what constitutes the lie.

  ### 3. Best Prediction of Her Verdict

  **Verdict:** She will rule that this **is a Lie**, and it is **Wrong**.

  **Reasons for preferring Rule B (The Commitment View):**

  1.  **The Ruling on Case 5 (Pointing):** This is the strongest clue. Many philosophers classify non-verbal deception (like pointing) as "misleading" rather than "lying" because it lacks explicit assertion. By insisting Case 5 is *lying*, your tutor signals that she defines lying by the **communicative commitment** made (the gesture conveys "The valuables are there" as a truth-claim) rather than the specific verbal mechanism or the psychological success of the deception.
  2.  **The Ruling on Case 3 (Hyperbole):** Rule A explains Case 3 by citing a lack of intent. However, Rule B explains it more robustly: hyperbole is not a lie because the *warranty of literal truth is suspended by convention*. In Case 6, there is no such convention; the club meeting is a context where truth is explicitly required. The treasurer is actively invoking the warranty of truth to create a formal denial, even if he doesn't expect belief.
  3.  **Moral Consistency:** Your tutor separates the *concept* of lying from *wrongness* (Case 4 is a lie but not wrong; Case 2 is not a lie but is wrong). If she ruled Case 6 was "Not a Lie," she would have to classify it as "Merely Misleading" (like Case 2) or something else. But Case 6 is a direct falsehood, not an implicature. To classify a direct, warranted falsehood as "Not a Lie" would collapse her careful distinction between Lying and Misleading established in Case 2. It is more consistent for her to maintain that **asserting a warranted falsehood is lying**, even if the moral wrongness varies by context.

  ### 4. Further Case to Distinguish the Rules

  To definitively tell Rule A (Intent) and Rule B (Commitment) apart, you need a case where a speaker warrants a falsehood as true, but *clearly* lacks any intent to deceive, *and* where conversational conventions (like hyperbole) do not apply.

  **Case 7: The Coerced Confession**
  > A prisoner is being tortured by an interrogator. The interrogator already knows the prisoner is innocent (perhaps he has irrefutable proof) but demands a confession to close the file. The prisoner, knowing the interrogator knows he is innocent, says "I did it" simply to make the torture stop.

  *   **Rule A (Deceptionist) Prediction:** **Not a Lie.** The prisoner has no intention of making the interrogator believe the falsehood (he knows the interrogator knows the truth).
  *   **Rule B (Commitment) Prediction:** **Is a Lie.** The prisoner asserts a proposition he believes to be false and warrants it as true (he is not speaking in jest or metaphor), thereby violating the norm of truth-telling, regardless of the interrogator's prior knowledge.

  If your tutor calls Case 7 a **lie**, she definitively holds the Commitment View (Rule B). If she calls it **not a lie** (perhaps "a false statement, but not a lie"), she holds the Deceptionist View (Rule A). Given her ruling on the Pointing case, the Commitment View is the stronger bet.
