prompt: |-
  I got into Schopenhauer a whlie back through his pessimism stuff, and recently a friend who took one philosophy class tried to explain his views on music to me over coffee. I want to check whether she got it right, because it sounded a little off from what I remembered but I honestly couldn't say why. Here's roughly what she said:

  "Schopenhauer thought all art shows us the Ideas behind appearances, except music, which doesn't show anything — it just makes us feel things directly. Music is a copy of our individual will: when the music is tense or yearning it's showing your own personal wanting and craving, which is why it hits you so hard. Since the will is basically just human desire, music is basically the composer's emotional autobiography put into sound. That's also why he ranked music above the other arts — it gives us the most intense emotional experience, and intense feeling is what art is for."

  Some of this rings a bell — I do remember something about music being special among the arts, and obviously something about the will. But other parts felt like she was translating him into pop psychology, like a movie-score version of him. Can you go through it piece by piece and tell me what's basically fair, what's a simplification, and what he'd flat out deny? Especially the "your individual will" part and the "composer's autobiography" part — something about that feels too small for what I remember him doing with the will, but maybe I'm the one misremembering. Also, does her last claim, that art's purpose is intense feeling, follow from anything he actually says about music, or is that just her reading modern aesthetics back into him?

  One more thing: I know people who study this guy for a living still argue about how to read him. So could you keep separate what's pretty much settled among Schopenhauer people (like where music sits in his system at all) from what's genuinely contested — for example whether the comparison between music and the will is meant literally or as a structural analogy, and whatever the story is about him changing his tune on music in his later work? I'd rather be told where the scholars disagree than be handed one side of it like it's the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

