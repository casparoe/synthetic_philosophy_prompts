  **Session Plan: The Coin Test**

  **Materials & Timeline**
  *   **Supplies:** 18 scenario cards (6 of each type below), 6 coins, whiteboard, markers, paper, pens.
  *   **Card Types:**
      1.  *Tradeoff:* Job A ($50k, 10m commute) vs. Job B ($60k, 40m commute).
      2.  *Dominance:* Job C ($50k, 40m commute) vs. Job D ($60k, 10m commute).
      3.  *Hard:* Job E (Creative, near parents) vs. Job F (Prestige, abroad).
  *   **0–15 min:** Divide into 6 pairs. Give each pair 3 cards (mix types). Rule: "Reach a joint decision. If stuck, ask: 'Would we let a coin decide this?' Mark 'Yes' or 'No' on the card. No philosophy talk yet."
  *   **15–45 min:** Pairs work. Facilitator circulates, ensuring the Coin Yes/No box is marked.
  *   **45–60 min:** Collect cards. Draw two columns on board: "Coin OK" and "Coin Wrong." Sort cards live based on their marks.
  *   **60–90 min:** Debrief.

  **Debrief Script**
  1.  Point to "Coin OK." Ask: "What made these tossable?" (Expect: "Didn't matter," "Just about money.")
  2.  Point to "Coin Wrong." Ask: "Why was the coin an insult here?"
  3.  Listen for two distinct answers: "One was clearly better" (Dominance) vs. "Both good, but different" (Hard Choice).
  4.  Ask Type 1 group: "If we added $5k to the worse option, would you switch?" If yes, label: **Tradeoff**.
  5.  Close: "We call all these 'hard choices.' Are they the same thing?"

  **Predictable Failures & Fixes**
  *   **"Everything has a price":** Participants insist they can price the "Hard" cards. *Fix:* Ask "What is the exact number?" When they hesitate, say "Mark 'Coin Wrong' if you can't name it now." Do not argue validity.
  *   **"Personality Quiz":** Participants treat scenarios as moral tests. *Fix:* Interrupt gently. "There are no virtuous answers. We are studying the decision structure, not the virtue of the choice."
  *   **Dominant Partners:** One person decides for both. *Fix:* Require both signatures on the card. If disagreement persists, mark "Coin Wrong."
  *   **Early Recognition:** Someone spots the philosophical trap. *Fix:* "Hold that thought for the end. For now, just answer the prompt."

  **Candour: Limitations**
  *   **Stakes:** These are hypotheticals. The visceral "betrayal" of a coin flip on life-altering decisions is hard to simulate. Participants may mark "Coin OK" on profound choices because nothing is actually lost. You must acknowledge this in the debrief: "Did the lack of consequence make the coin easier to accept?"
  *   **Time:** Real hard choices haunt us over months. This compresses struggle into minutes. The "chewing on" aspect cannot be simulated live.
  *   **Your Revelation:** You cannot force them to feel your specific realization about the "hidden price." They may leave thinking "Hard Choices are just Tradeoffs." Be prepared to share your personal story (parents vs. job) only at the very end to illustrate the third category if the group fails to find it naturally. The activity reveals the *structure* of choice, but not the *weight* of living with it.
