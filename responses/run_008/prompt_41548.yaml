          *   *Argument:* The purpose of the theory is to guide action. Action requires a single choice. A set of probabilities doesn't dictate a single choice without a decision rule (e.g., maximin). That decision rule is the real driver, not the imprecise belief.
          *   *Counter-argument:* But Ellsberg choices are stable and intuitive.
