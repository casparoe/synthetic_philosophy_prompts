answer: |-
  Here are the restatements, corrections, and the residue report.

  ### 1. The Restatements

  **Everett (Many-Worlds)**
  *   **Your Mapping:** Refusing to prune the mixture; observing means one component gets mass while the rest exist.
  *   **Correction:** Your mapping is **structurally correct but probabilistically wrong**. In Everett, there is no conditioning event that updates the global state. The state vector evolves unitarily (deterministically) forever.
  *   **Statistical Restatement:** The generative model is a single, high-dimensional joint distribution that never marginalizes. "Measurement" is a unitary interaction that entangles the system with the observer, creating orthogonal subspaces (branches) in the Hilbert space. There is no renormalization to 1 on a single branch. Subjective experience is restricted to a single branch due to decoherence (loss of interference terms between components), but the global likelihood function retains support over all branches. The "weights" (amplitudes) are ontological, not epistemic.
  *   **Verdict:** You got the "no pruning" right, but "one component gets nearly all the posterior mass" implies a Bayesian update that Everett explicitly rejects. The mass stays distributed; you just lose access to the covariance between components.

  **Copenhagen**
  *   **Your Mapping:** Collapse as post-hoc marginalization licensed by an undefined condition.
  *   **Correction:** This is **pragmatically accurate but ontologically shallow**. Copenhagen is often instrumentalist: the wavefunction is not a latent variable representing reality, but a tool for computing expectations.
  *   **Statistical Restatement:** A dual-dynamics model. Between observations, the parameters evolve via a deterministic differential equation (Schrödinger). Upon "measurement" (a hyperparameter known as the Heisenberg Cut), the likelihood function discontinuously projects onto an eigenspace of the observable. This projection is not derived from the prior dynamics; it is an ad-hoc update rule. The wavefunction is treated as epistemic (information about the system) rather than ontic (the system itself).
  *   **Verdict:** Your "undefined licensing" (Heisenberg Cut) is the precise pain point. However, Copenhagen isn't just marginalization; it's a model switch that violates the unitary dynamics you started with.

  **Bohm (Pilot Wave)**
  *   **Your Mapping:** Latent particle position makes everything identifiable; latent is unobservable in principle.
  *   **Correction:** **Faithful.** This is the strongest of your three mappings.
  *   **Statistical Restatement:** A deterministic hidden-variable model. The state is defined by $(\psi, X)$, where $\psi$ is the guiding field and $X$ is the latent particle position. The dynamics of $X$ are fully determined by $\psi$. To recover standard QM predictions, you must impose a "Quantum Equilibrium Hypothesis" on the prior: $P(X_0) = |\psi_0|^2$. Because the prior is constrained to match the guiding field, the latent variable $X$ is empirically non-identifiable beyond the Born rule limits (you cannot prepare a prior that violates equilibrium without breaking the theory's consistency).
  *   **Verdict:** Correct. The cost is explicit non-locality in the likelihood function (the velocity of $X$ depends on $\psi$ everywhere instantaneously).

  ---

  ### 2. The Residue Report

  You asked what doesn't fit, what was distorted, and whether the debate is substantive.

  **A. The Distortions (Where your vocabulary breaks)**

  1.  **Interference vs. Mixture Weights:**
      *   **The Issue:** In your vocabulary, a mixture model is $P(x) = \sum w_k P_k(x)$. In QM, the state is $\sum c_k |k\rangle$. Probabilities are $|c_k|^2$.
      *   **The Residue:** Your "mixture" analogy loses the **phase information**. Classical mixture weights are positive reals summing to 1. Quantum amplitudes are complex numbers. They can cancel out (destructive interference) before you ever calculate a probability.
      *   **Impact:** Everett isn't just keeping all mixture components; it's keeping the *coherence* between them until decoherence dynamically suppresses the off-diagonal terms of the density matrix. Your vocabulary assumes a simplex (probabilities); QM lives in a Hilbert space (amplitudes). This is why deriving the Born Rule in Everett is hard: you have to get squared moduli from linear dynamics without postulating them.

  2.  **The Born Rule Status:**
      *   **The Issue:** In Bayes, the likelihood function is posited. In QM, *why* is the likelihood $|\psi|^2$?
      *   **The Residue:**
          *   **Copenhagen:** Postulates it as an axiom. (Like assuming a Gaussian likelihood without derivation).
          *   **Bohm:** Assumes "Quantum Equilibrium" ($P=|\psi|^2$) as a prior. If the universe started out of equilibrium, Bohmian mechanics would allow superluminal signaling. The debate is: *Why* is the prior locked to the wavefunction?
          *   **Everett:** Tries to derive it from decision theory or symmetry (Gleason's Theorem). This is the hardest sell. In your vocabulary, it's like trying to derive the likelihood function solely from the structure of the prior support.
      *   **Impact:** This is not semantic. It determines whether probability in QM is subjective (Bayesian), frequentist (branch counting), or ontological (measure of existence).

  3.  **Non-Locality and Bell's Theorem:**
      *   **The Issue:** In standard latent variable models, correlations are explained by common causes (local hidden variables).
      *   **The Residue:** Bell's Inequalities prove that no *local* latent variable model can reproduce QM correlations.
          *   **Bohm:** Accepts non-locality (the likelihood for particle A depends on the setting of detector B instantaneously).
          *   **Copenhagen:** Rejects realism (no latent variables exist prior to measurement).
          *   **Everett:** Retains locality in dynamics but sacrifices uniqueness of outcomes.
      *   **Impact:** You cannot map QM correlations to a standard Bayesian network without allowing edges that violate relativistic causality or removing nodes entirely. This is the substantive core of the debate.

  **B. Is the Debate Substantive?**

  **Yes.** It is not merely "shut up and calculate" vs. philosophy.

  1.  **Computational Complexity:** If Everett is true, the "state" is exponentially larger than the observed data implies. If Copenhagen is true, the state is undefined between measurements. If Bohm is true, there is hidden information that is theoretically accessible (if equilibrium could be broken). These imply different constraints on quantum computing and information theory.
  2.  **Cosmology:** Copenhagen requires an "observer" or "classical apparatus" external to the system. This fails for the wavefunction of the universe (no external observer). Everett and Bohm handle closed systems; Copenhagen does not. If you do cosmology, Copenhagen is mathematically ill-posed.
  3.  **Causality:** Bohm violates Lorentz invariance at the latent level (though not at the observable level). Everett preserves it. This matters for quantum gravity.

  **C. Summary of the Residue**

  Your vocabulary misses **Hilbert Space geometry** (interference/phase) and **Bell Non-Locality**.

  *   **Everett** is not just "keeping the mixture"; it's keeping the *vector space structure* without projection.
  *   **Copenhagen** is not just "marginalization"; it's a **context-dependent likelihood** that denies the existence of the joint distribution prior to measurement.
  *   **Bohm** is a **non-local hidden variable model** with a constrained prior that hides the non-locality from the marginal likelihood.

  **Blunt Assessment:**
  Your mapping of **Bohm** is excellent.
  Your mapping of **Copenhagen** is functionally useful but misses the anti-realist stance.
  Your mapping of **Everett** is the weakest: you described a Bayesian update that doesn't happen. Everett is *no update*, ever. The "probability" problem in Everett is not about pruning; it's about why an agent should bet according to the Born Rule if all outcomes happen. That is a decision-theory problem, not a standard inference problem.

  The debate is substantive because it constrains the allowable structure of physical law (locality, realism, unitarity). You cannot have all three. Your statistical vocabulary assumes a classical probability space; the debate is about whether the universe *is* a classical probability space.
