prompt: |-
  I do Bayesian statistics for a living — mixture models, latent variables, identifiability problems, that kind of thing — and I've never gotten anything out of the standard summaries of the quantum interpretations debate. Restate Everett, Copenhagen, and Bohm for me in my vocabulary, one by one, as faithfully as you can. My tentative mappings, which you should correct or shoot down: Everett looks like refusing to prune the mixture after conditioning on data — the posterior over outcomes just is the theory, and "observing" means one component gets nearly all the posterior mass while the rest of the mixture keeps existing whether or not anything is conditioned on it; Copenhagen looks like treating collapse as a post-hoc marginalization we're allowed to perform for practical purposes, with nobody able to say when exactly it's licensed; Bohm looks like insisting the mixture is really generated by a latent particle position that makes everything identifiable, at the cost of that latent being unobservable in principle. Then the residue report, which is the part I actually care about: which parts of the real debate have no counterpart in my vocabulary (I suspect the preferred basis problem and the status of the Born-rule measure are two candidates, but tell me if I'm wrong), which parts had to be distorted to fit, and whether the residue is my vocabulary missing something or the physicists arguing about something less substantive than it looks. Also be blunt if one of my three mappings is not merely crude but just wrong.
