answer: |-
  **The Question**

  Moral philosophy distinguishes between actions that are merely right and those possessing moral worth. An act is right if it conforms to duty; it has worth only if performed *for the sake of* duty. While this distinction is foundational, its application stalls in cases of motivational overdetermination. Consider a nurse who comforts a dying patient from genuine compassion, yet who would have done so anyway out of professional duty. Or a debtor who repays a loan from fidelity, though fear of legal consequences would have secured compliance regardless. In these scenarios, the moral motive is present but causally redundant.

  The central question of this project is: *What relation must a moral motive bear to an action to confer moral worth?* Current debates oscillate between two unsatisfying poles. The first insists on causal efficacy: the moral motive must be the decisive factor that tips the scale toward action. The second insists on sufficiency: the moral motive need only be present and sufficient, regardless of competing causes. Both assume that "making a difference" is exclusively a matter of causal production. This project asks whether this assumption is correct. I propose that moral worth is not determined by the motive's causal leverage, but by its constitutive role. The question is not whether the moral motive *produced* the movement, but whether it supplied the description under which the agent intentionally acted. If moral worth tracks the constitutive role, overdetermination cases cease to be paradoxes; an act has worth if the agent acts *under the description* of "doing duty," even if inclination or fear also caused the behavior.

  **What existing positions leave open**

  The stalemate arises because existing frameworks capture different intuitions while distorting others. The causal efficacy view (often associated with counterfactual dependence) protects the uniqueness of moral worth. It ensures that an act is not worthy if it would have happened anyway without the moral motive. However, this view renders moral worth implausibly fragile. It implies that a person with a virtuous temperament—who finds duty easy and pleasant—cannot achieve moral worth, because their inclination would have produced the act regardless. This punishes moral development and suggests that moral worth requires a struggle against inclination, a conclusion many find counterintuitive.

  Conversely, the motivic presence view protects the stability of moral worth. It allows that agents with mixed motives can still act worthily, provided the moral motive is sufficient. Yet, this view makes moral worth too cheap. If I keep a promise primarily to avoid shame, but duty was also a sufficient motive, this view grants me full moral credit. It fails to distinguish between acting *with* a moral motive and acting *from* it in a meaningful sense. It ignores the phenomenological reality that agents often act under specific self-conceptions.

  Both positions leave open the possibility that they are measuring the wrong variable. They treat motivation as a force that pushes behavior into existence, rather than a lens that defines what the behavior *is*. By focusing solely on causal output, both views miss the internal structure of the action. They cannot explain why we intuitively grant worth to the nurse who sees her comfort as a duty, even if her compassion was equally potent. They lack a vocabulary for the agent's own understanding of her action. This project fills that gap by shifting the locus of evaluation from the causal history of the event to the intentional description of the agent.

  **Method**

  This project employs conceptual analysis grounded in the metaphysics of action. The core methodological innovation is to decouple the *causal role* of a motive (its efficiency in producing bodily movement) from its *constitutive role* (its function in determining the action's identity). I will argue that motives do not merely cause actions; they individuate them. To act from duty is to perform an action of a specific type, defined by that motive.

  I will refine the user's initial hunch by integrating action-theoretic tools regarding "acting under a description." Rather than simply constructing cases, I will analyze the logical structure of practical reasoning in overdetermination scenarios. The work will proceed in three phases over twelve months.

  **Months 1–3: Framework and Distinction.** I will finalize the definitions of causal versus constitutive roles. This involves mapping the distinction onto existing action theory to ensure it is metaphysically robust. I will draft the core argument: that moral worth is a property of the action's description, not its causal genesis.

  **Months 4–7: Case Construction and Testing.** I will construct a series of nuanced thought experiments where causal and constitutive roles come apart. For example, cases where an agent acts under a moral description but the causal chain is entirely non-moral (e.g., subconscious duty), and vice versa. These cases will be tested against intuitions regarding praise and worth. I will present these at two departmental workshops to gauge counter-arguments regarding self-deception and unconscious motivation.

  **Months 8–12: Drafting and Defense.** I will write the dissertation chapters, focusing on objections. A primary challenge will be explaining how the constitutive role is identified if not by causal influence. I will argue that first-person authority regarding one's practical reasoning provides this access. The final months will be dedicated to revision and preparing the material for journal submission.

  This method improves upon simple case-construction by anchoring the moral psychological claims in a broader theory of action. This prevents the project from becoming a mere catalog of intuitions and ensures the causal/constitutive distinction does significant philosophical work.

  **Failure and scope**

  The project fails if the constitutive role collapses back into the causal role. If acting "under the description of duty" ultimately requires that the thought of duty causally influence the behavior to sustain that description, the distinction dissolves, and the original stalemate returns. I mitigate this risk by focusing on the normative rather than psychological nature of the description.

  The primary risk to scope is drifting into empirical moral psychology. While the project concerns motivation, it is not an empirical study of how agents *actually* reason, but a normative inquiry into how they *must* be described to possess worth. I will strictly avoid experimental design. Additionally, I must avoid solving the entire problem of moral worth; the scope is limited to overdetermination cases. If the constitutive account proves viable there, it can be extended later. Finally, I must resist the urge to defend a specific normative ethics (e.g., Kantianism vs. Consequentialism); the project concerns the structure of worth, not the content of duty. Keeping the focus on the metaphysics of motivation ensures the project remains manageable within a year.
