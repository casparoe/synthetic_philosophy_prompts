  *(Self-Correction on Rawls)*: The podcast says "usually read as a resource theorist." This is technically true in the post-Rawlsian literature (the "currency of egalitarian justice" debate), but Rawls himself rejected utilitarianism/welfarism on moral grounds, not practical ones.

