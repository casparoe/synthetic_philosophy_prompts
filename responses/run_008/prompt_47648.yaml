      *   If Rawls's motivation isn't convenience, the resource view has a stronger moral foundation.
      *   If Dworkin doesn't collapse into welfare, the resource view isn't refuted by that objection.
      *   If Sen targets capabilities (freedom) not functionings (outcomes), the distinction from resources is subtler (freedom to use resources).
      *   *Verdict:* The conclusion ("capabilities are the only game in town") does *not* follow from the corrected premises. It relies on the errors (Rawls=convenience, Dworkin=failed, Sen=functionings).

