      *   *Phase 2 (Inter-personal):* The class is divided. Group A (Minority) loses tickets. Group B (Majority) gains tickets. Net total is higher than Phase 1 average. The decision is made by vote (Majority rules/Utilitarian calculus).
      *   *The Twist:* To make the "Separateness" vivid, the Phase 2 decision shouldn't just be a vote on policy; it needs to be a vote on *imposing* the loss on specific others.
      *   *Refinement:* To ensure the "same arithmetic," the total tickets in the room should be comparable, but the distribution changes.
