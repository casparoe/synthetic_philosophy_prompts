          *   *How to decide?* Majority vote. This mimics the utilitarian aggregator (the sum dictates the right, the majority enforces it).

  4.  **Developing the Materials & Rules:**
      *   *Currency:* "Rawls Tickets." Redeemable for a $30 gift card at end of term. (Modest but real).
