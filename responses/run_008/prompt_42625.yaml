      *   *Crucial Detail:* Students need to know their color *before* voting so they feel the stake.

  5.  **Timeline (75 Minutes):**
      *   0-5: Intro & Setup (Tickets, Prize).
      *   5-20: Phase 1 (Intra-personal). Individual worksheets.
      *   20-30: Phase 1 Tally & Reflection.
