  7.  **Anticipating Problems:**
      *   *Problem 1: The "Rawls Reader".* Student says "This is unfair" immediately. *Fix:* Acknowledge, but ask them to vote based on the *rule* provided (maximize tickets), not their outside knowledge. Or, use them as a foil in debrief.
