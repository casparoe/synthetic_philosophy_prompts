  9.  *(Self-Correction on Aristotle)*: Be careful not to say Aristotle believed in quantum mechanics. He believed in *potentiality*. In NWP terms, the "potential" is the ensemble, but for Aristotle, the ensemble *is* the reality, not just our ignorance.

