prompt: |-
  Me and a bloke at work have been having a running argument ever since I read a book on Weimar Germany on holiday. His take: no Hitler, no Holocaust, probably no second world war — remove one man from history and things go down a completely different track, it's all "great men". My take is more structural: reparations, the hyperinflation, mass unemployment, a fractured electorate and an army officer class that wanted a rematch anyway — the German right was shopping for a demagogue and Hitler just happened to be the best product on the shelf. Neither of us is a historian, I write Java for a living, so its all pub talk, but I want to actually pin down where we disagree instead of repeating ourselves every Friday.

  Here's what I want from you. My credence that you still get something recognisable as Nazi Germany — a fascist-ish, revanchist, antisemitic German dictatorship that starts a major European war by the mid-1940s — even if you delete Hitler from history in, say, 1919 (he dies in the war, nothing else changes) is about 0.45. His is about 0.1. Give me your own number, but the important part is the decomposition. At minimum I want rough probabilities on things like: whether the structural conditions (the depression, the army's politics, antisemitism already being mainstream on the right) were sufficient to guarantee some kind of hard-right dictatorship even without a singular figure; whether another leader — or a coalition, doesn't have to be one guy — could plausibly have delivered the specific combo of ideology plus war plus industrialised genocide that makes it "Nazi Germany" rather than just a nasty military junta; whether the Nazi party specifically was already locked in as the vehicle by 1929 or whether that too is Hitler-contingent; and whatever other terms you think belong in the product. One line of justification for each, then show how they combine into your final number.

  Then tell me which term you're least confident in, and which single sub-question, if we could somehow resolve it, would move the final number the most. Since counterfactuals like this can't literally be settled, also say what kind of evidence or comparison would even count as resolving it — comparisons to Italy or Spain without their strongmen, historical close calls, whatever you'd actually weigh.

  And crucially: where do you think the guy at 0.1 and me at 0.45 actually disagree? Is it about how much individual agency leaders have at all, about how replaceable Hitler specifically was, or about whats included in "recognisable as Nazi Germany"? Because I suspect a good chunk of our argument is that I'm grading on a looser curve than he is — his 0.1 might mean "no WW2 and no Holocaust" while my 0.45 might really be "some bastard regime, probably not as catastrophic". If thats right, tell me how to reword the question so we're both answering the same thing, because right now I think we might be having two different arguments and both winning.
