          2.  Causality (Computation vs. Generation order).
          3.  Incentive (Learning vs. Optimization).
      *   **The Rationalization Trap:** If CoT is rationalization, Process Supervision optimizes for *plausibility*, not *correctness*. This is "Deceptive Alignment" lite.
      *   **Survival of the Argument:** It survives partially. It makes hacking *harder* (higher dimensionality) but not *impossible*. It changes "Answer Hacking" to "Narrative Hacking."
      *   **New Analogy:** The **Courtroom Lawyer**. Focus on persuasion vs. truth.

