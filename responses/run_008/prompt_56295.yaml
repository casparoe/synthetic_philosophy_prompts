answer: |-
  ### Desiderata for a Deference Principle

  To function as a bridge between the metaphysical (chance) and the epistemic (credence), a norm must satisfy the following criteria.

  **1. Non-Triviality (Non-Negotiable)**
  The principle must not define chance *as* credence. If the norm entails that $Ch(A) = x$ just means "Rational credence in $A$ is $x$," then chance is redundant. There must be a gap between the fact of the matter (the chance) and the agent's belief, such that the agent can be wrong about the chance, or the chance can exist without an agent.
  *Case:* If chance is just idealized belief, it cannot explain why coin tosses stabilize frequencies in a mind-independent world.

  **2. Principled Admissibility (Non-Negotiable)**
  The principle must distinguish between information that *bypasses* chance (inadmissible) and information that is *mediated* by chance (admissible) without circularity. You cannot define admissible information simply as "information that doesn't reveal the outcome." There must be a positive account of why some information (like the past) goes through the chance filter, while other information (like a crystal ball vision) does not.
  *Case:* Without this, the principle is unusable; an agent could never know if they are permitted to apply the norm.

  **3. The Screening-Off Condition (Non-Negotiable)**
  The principle must explain why, once you know the chance, additional admissible history ceases to be relevant. If $Ch(A) = 0.5$, knowing the coin is fair and the past tosses were 50/50 should not shift your credence away from 0.5. Chance must act as a sufficient statistic for admissible evidence.
  *Case:* If past history continues to shift credence even after conditioning on chance, chance is not doing the work of summarizing the physical setup.

  **4. Immunity to Undermining (Contested)**
  The principle must handle the scenario where knowledge of the total theory of chance + history implies that the present chance *could not* be what it appears to be. (e.g., If Humeanism is true, a long run of heads might make it false that the chance was 0.5). The principle must either block this inference or accommodate it.
  *Case:* Humeans accept that chances can be "undermined" by future history; Anti-Humeans deny the supervenience basis that allows this.

  **5. Single-Case Authority (Camp-Specific: Propensitists)**
  The principle should apply to singular, non-repeatable events (e.g., "This specific atom decays now").
  *Case:* Propensitists demand this; Frequentists and Best-System theorists deny it, arguing chances only apply to kinds of events or long-run patterns.

  **6. Frequency Stability (Camp-Specific: Humeans/Empiricists)**
  The principle should entail that as trials increase, relative frequencies converge to chances with high probability.
  *Case:* Humeans demand this to ground chance in observation; Propensitists may accept it as a consequence but do not treat it as the definition of chance.

  ***

  ### The Impossible Trinity

  The central tension in the philosophy of chance is that the following three desiderata are jointly unsatisfiable. You must reject at least one to have a coherent theory.

  1.  **Full-Blooded Deference:** Rational credence must equal known objective chance ($C(A|Ch(A)=x) = x$).
  2.  **Humean Supervenience:** Objective chances are nothing over and above the total pattern of categorical events (past, present, and future).
  3.  **History as Admissible:** Information about the total history of events (or the theory linking history to chance) is admissible evidence for the agent.

  **The Conflict:** If chances supervene on the total history (2), then facts about the future history determine the present chance. If history is admissible (3), an agent can condition on future history (or the theory implying it). If the future history shows a deviation from the present chance (e.g., the coin lands heads 100% of the time), the agent knows the present chance was not 0.5. But Full-Blooded Deference (1) says if the chance is 0.5, credence must be 0.5. If the agent knows the history, credence becomes 1 or 0. The chance value is trivialized or contradicted.

  **The Cost of Choice:**

  *   **Drop Full-Blooded Deference (Lewis's Revised Path):** You save Humeanism and Admissibility by weakening the norm. Credence equals chance *conditional on the theory of chance being true*.
      *   *Cost:* Chance loses its direct action-guiding force. You never defer to chance directly, only to chance-plus-theory. It makes chance epistemically distant; you can't use the principle to learn what the chances *are* easily, because you must already know the theory to apply the norm.
  *   **Drop Humean Supervenience (The Propensity Path):** You save Deference and Admissibility by making chances irreducible modal properties. Future history does not determine present chance; the present physical setup does.
      *   *Cost:* Metaphysical bloat. You must accept "oomph" or dispositions that are not reducible to categorical facts. It severs the tight link between chance and actual frequency, making chances potentially unknowable if they don't manifest in the long run.
  *   **Drop History as Admissible (The Isolationist Path):** You claim that information about the total pattern (specifically future patterns) is inadmissible.
      *   *Cost:* It renders the principle practically useless for learning. If we cannot use observed frequencies (history) to update our beliefs about chances because that information is "inadmissible," we cannot empirically discover what the chances are. It isolates chance from evidence.

  ***

  ### Scorecard

  Lewis's Original Principle satisfies Full Deference and Admissibility but crashes against Humean Supervenience due to undermining futures. Lewis's Revised Principle saves Humeanism by sacrificing Full Deference, requiring agents to condition on the theory of chance itself, which distances the agent from direct deference. Best-System views inherit the Revised Principle's costs, struggling to justify single-case deference while maintaining that chances are just summaries of history. De Finetti-style subjectivism dissolves the problem entirely by rejecting Objective Chance (dropping Supervenience and Deference to external facts), satisfying coherence but failing to explain why the world behaves as if there are mind-independent probabilities.
