answer: |-
  **Title:** Dissolving the Problem of Old Evidence: A Proposal to Distinguish Formal and Diachronic Constraints in Bayesian Confirmation

  **1. Project Summary**

  The problem of old evidence constitutes one of the most persistent challenges to Bayesian confirmation theory. The core difficulty is well-known: if a piece of evidence $E$ is already known with certainty (i.e., assigned probability 1) before a theory $T$ is formulated, standard Bayesian conditionalization cannot model $E$ as confirming $T$. Mathematically, if $P(E) = 1$, then $P(T|E) = P(T)$, implying no confirmation occurs. This contradicts scientific practice, where old evidence (such as the perihelion of Mercury) is often cited as strong support for new theories (such as General Relativity).

  Standard literature treats this as a singular problem to be solved within the Bayesian framework. This proposal argues that the "problem of old evidence" is actually a conflation of two distinct issues: a **Formal Problem** regarding the synchronic mathematics of probability functions, and a **Diachronic Problem** regarding the rationality of agents expanding their conceptual spaces. My hypothesis is that existing solutions fail to satisfy because they attempt to solve the Diachronic Problem using tools designed only for the Formal Problem, or vice versa.

  This paper will rigorously distinguish these two sub-problems, map existing classes of solutions to the specific sub-problem they address, and demonstrate that the lingering dissatisfaction in the literature stems from this category error. The project will rely on conceptual analysis and worked toy examples rather than empirical data. The ultimate goal is not necessarily to solve the problem of old evidence definitively, but to show that dissolving the conflation clarifies the limits of Bayesianism regarding theory change.

  **2. Precise Formulation of the Two Sub-Problems**

  To move beyond the standard framing, I will define two distinct constraints that are currently bundled under the label "old evidence."

  **2.1. The Formal (Synchronic) Problem**
  This is a problem internal to the static calculus of probability. It assumes a fixed algebra of propositions and a fixed probability function $P$.
  *   **Condition:** Agent $A$ has a credence function $P$ at time $t_1$.
  *   **Input:** Proposition $E$ is in the algebra of $P$, and $P(E) = 1$. Proposition $T$ is also in the algebra.
  *   **Constraint:** Confirmation is defined as an increase in probability via conditionalization: $P(T|E) > P(T)$.
  *   **The Conflict:** If $P(E) = 1$, the ratio definition of conditional probability entails $P(T|E) = P(T)$.
  *   **The Question:** How can we mathematically represent $E$ as confirming $T$ within a static probability space where $E$ is certain?
  *   **Nature:** This is a technical, structural issue. It asks whether the *definition* of confirmation is too narrow for the *math* of certainty.

  **2.2. The Diachronic (Agency) Problem**
  This is a problem regarding the dynamics of belief revision and conceptual discovery. It concerns the transition from time $t_1$ (before $T$ is entertained) to $t_2$ (after $T$ is entertained).
  *   **Condition:** At $t_1$, theory $T$ is not merely improbable; it is unformulated. It does not exist in the agent's algebra of propositions.
  *   **Input:** At $t_2$, the agent comes to understand $T$ and recognizes that $T$ entails or explains $E$.
  *   **Constraint:** Rational belief revision requires a rule for moving from $P_{t1}$ to $P_{t2}$. Standard Bayesianism requires $P_{t2}$ to be derived from $P_{t1}$ via conditionalization on new evidence.
  *   **The Conflict:** There is no "new evidence" to conditionalize on. The change is in the *space of possibilities*, not the evidence set. Standard Bayesianism has no rule for "algebra expansion."
  *   **The Question:** How should a rational agent revise credences when the change involves learning a new theory that was previously inconceivable?
  *   **Nature:** This is an epistemological issue. It asks whether Bayesian updating is sufficient to model *conceptual learning*.

  **3. Mapping Existing Replies to the Sub-Problems**

  A significant portion of this paper will be dedicated to a taxonomy of standard replies, analyzing which sub-problem they actually address. My preliminary analysis suggests a systematic mismatch between the problems and the solutions.

  **3.1. The Counterfactual Strategy**
  This approach suggests we should evaluate confirmation by asking what the agent's credences *would have been* had they not known $E$.
  *   **Targets:** The Formal Problem. It attempts to restore $P(E) < 1$ to make the math work.
  *   **Mismatch:** It ignores the Diachronic Problem. Even if we calculate a counterfactual probability, it does not tell the actual agent how to update their *actual* credences now that they know both $E$ and $T$. It solves the math by changing the scenario, not by explaining the actual rationality of the agent.

  **3.2. The "Logical Relations" Strategy (Garber-style)**
  This approach expands the probability algebra to include propositions about the logical relationship between $T$ and $E$ (e.g., "$T$ entails $E$"). The agent conditionalizes on this logical relation rather than $E$ itself.
  *   **Targets:** Primarily the Formal Problem. It allows $P(E)$ to remain 1 while allowing $P(T)$ to rise via conditionalization on the logical relation.
  *   **Mismatch:** It partially addresses the Diachronic Problem but relies on a strong idealization. It assumes the agent can represent the proposition "$T$ entails $E$" before fully grasping $T$. If $T$ was truly unformulated at $t_1$, the agent could not assign a prior to the logical relation involving $T$. Thus, it solves the static math but glosses over the dynamics of conceptual discovery.

  **3.3. The Ur-Prior Strategy**
  This approach suggests agents should compare their current credence to a hypothetical "ur-prior" (a prior before any evidence was learned).
  *   **Targets:** The Diachronic Problem. It attempts to provide a historical narrative of belief.
  *   **Mismatch:** It fails the Formal Problem within the current space. It requires access to a prior state that may be psychologically impossible to reconstruct or normatively irrelevant.

  **4. Methodology**

  The paper will proceed via conceptual analysis and the construction of toy models. No empirical work or historical case studies will be used as primary data, though historical examples (like the Mercury perihelion case) will serve as illustrative anchors.

  **4.1. Constructing the Toy Models**
  I will construct two distinct formal models to isolate the problems.
  *   **Model A (Static):** A fixed probability space where $P(E)=1$. I will demonstrate mathematically that no standard conditionalization allows $P(T)$ to rise. I will then apply the "Logical Relations" fix to show it resolves the math but requires the proposition to exist in the space *ex ante*.
  *   **Model B (Dynamic):** A sequence of probability spaces $S_1$ and $S_2$, where $T \in S_2$ but $T \notin S_1$. I will demonstrate that there is no Bayesian rule for mapping $P_1$ to $P_2$ because the domains differ.

  **4.2. Testing the Solutions**
  For each major class of solution found in the literature, I will run it against both Model A and Model B.
  *   *Test 1:* Does the solution allow $P(T)$ to rise in Model A without violating probability axioms?
  *   *Test 2:* Does the solution provide a rational rule for the transition in Model B?
  *   *Hypothesis:* Solutions will pass Test 1 but fail Test 2, or vice versa. None will pass both without significant modification to the Bayesian framework.

  **5. Criteria for Success and Failure**

  Given that this is a philosophical analysis rather than an empirical study, success is defined by argumentative clarity and explanatory power.

  **5.1. Conditions for Success**
  1.  **Distinctness:** I must successfully demonstrate that the Formal and Diachronic problems are logically independent. It must be possible to have one without the other (e.g., a case where $P(E) < 1$ but $T$ is still a new theory, or where $T$ is old but $P(E)$ is the barrier).
  2.  **Mapping:** I must show that specific existing solutions clearly align with one problem and fail the other. If a solution claims to solve both, I must identify the equivocation in its reasoning.
  3.  **Clarification:** The distinction must explain *why* the literature feels stalled. If the split explains why proponents of different solutions talk past each other, the project succeeds.

  **5.2. Conditions for Failure**
  1.  **Collapse:** If further analysis reveals that the Diachronic Problem reduces to the Formal Problem (or vice versa), the distinction is illusory. For example, if expanding the algebra (Diachronic) is mathematically identical to conditionalizing on logical relations (Formal), the split buys nothing.
  2.  **Triviality:** If the distinction amounts to merely renaming "math" vs. "psychology" without impacting how we evaluate confirmation, the project is trivial.
  3.  **Intractability:** If separating the problems reveals that the Diachronic Problem is simply unsolvable within *any* probabilistic framework, the paper must honestly report this limitation rather than forcing a solution.

  **6. Critical Assessment: Does the Split Buy Anything?**

  A crucial section of the paper will be dedicated to an honest evaluation of whether this distinction is merely verbal engineering or if it offers genuine philosophical progress.

  **6.1. The Risk of Relabeling**
  There is a genuine risk that separating "Formal" and "Diachronic" issues is just a way of saying "the math doesn't work" and "the psychology is hard." If the proposal does not lead to a clearer understanding of *where* Bayesianism breaks, it is merely a taxonomy of failure. I will guard against this by ensuring the toy models produce different verdicts depending on which problem is prioritized.

  **6.2. The Potential Payoff**
  If successful, this distinction buys two significant advantages:
  1.  **Defanging the Objection:** It suggests that the "Problem of Old Evidence" is not a fatal blow to Bayesianism *per se*, but a fatal blow to Bayesianism *as a complete theory of theory change*. Bayesianism might solve the Formal Problem perfectly well while admitting it needs a supplement (e.g., abductive reasoning or constraint-based updating) for the Diachronic Problem.
  2.  **Evaluative Precision:** It allows us to stop criticizing solutions for failing to do what they weren't designed to do. We can accept a solution as adequate for the Formal Problem while rejecting it as a model of rational learning, thereby clearing the conceptual fog.

  **6.3. The Likely Conclusion**
  My working hypothesis is that the split reveals the Diachronic Problem is not a Bayesian problem at all. Bayesianism is a theory of updating on a fixed space. Learning a new theory changes the space. Therefore, the "solution" to the Diachronic Problem may require abandoning the requirement that all rational change be modeled as conditionalization. This is a modest but important conclusion: it saves Bayesian confirmation from the charge of incoherence by limiting its scope.

  **7. Work Plan and Timeline**

  The paper will be approximately 6000 words. The semester will be divided into four phases.

  *   **Weeks 1-3: Formalization.** Refine the definitions of the Formal and Diachronic problems. Construct the toy models (Model A and Model B). Ensure the mathematical representations are rigorous.
  *   **Weeks 4-6: Taxonomy and Analysis.** Draft the section mapping existing solutions. Apply the toy models to these solutions to demonstrate the mismatches. This is the core argumentative section.
  *   **Weeks 7-9: Critical Evaluation.** Draft the section on whether the split buys anything. Engage with potential counterarguments (e.g., that the problems are inseparable). Refine the conclusion regarding the scope of Bayesianism.
  *   **Weeks 10-12: Revision and Polish.** Integrate sections, ensure flow, check word count, and refine American English usage. Ensure all claims are qualified appropriately and that the distinction remains sharp throughout.

  **8. Conclusion**

  The problem of old evidence is often treated as a single obstacle to be overcome by a single technical fix. This proposal argues that the obstacle is actually a compound of a mathematical constraint and an epistemological constraint. By disentangling them, we can see that some solutions fix the math but ignore the agency, while others describe the agency but break the math. Recognizing this conflation does not necessarily solve the problem of how scientists learn new theories, but it does solve the problem of why philosophers of science have been unable to agree on a solution. The paper will argue that clarity on this distinction is a prerequisite for any future progress on the topic.
