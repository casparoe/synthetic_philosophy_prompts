answer: |-
  ### Specification of Adequacy Conditions for a Theory of Biological Function

  To break the hermeneutic circle where etiological (Selected Effects, SE) and causal-role (CR) accounts define adequacy conditions to guarantee their own victory, we must treat the intuitions driving each camp as *data to be explained* rather than *axioms to be assumed*. The following desiderata are framed as problems a theory must solve, not solutions it must adopt.

  #### 1. The Normativity Condition (Function vs. Mere Effect)
  *   **Motivation:** A theory must explain why pumping blood is the heart's function, while making a thumping sound is a mere effect, despite both being causal contributions. Crucially, it must explain why a heart *ought* to pump blood even when it does not, whereas a heart is not "failing" if it does not thump.
  *   **Status:** **Genuine Requirement.** Both camps agree functions are normative (they ground "should" claims), though they ground the norm differently.
  *   **Camp Pressure:** SE grounds this in historical success conditions; CR grounds this in contribution to a systemic capacity.

  #### 2. The Malfunction Condition (Non-Statistical Failure)
  *   **Motivation:** A theory must allow for genuine malfunction that is not reducible to statistical abnormality. A rare genetic variant may be statistically abnormal but healthy; a common disease (in a specific environment) may be statistically normal but dysfunctional. The account must distinguish a broken mechanism from a rare variant without circular appeal to "proper function."
  *   **Status:** **Genuine Requirement.** Essential for medical and biological practice.
  *   **Camp Pressure:** **SE Camp** insists this is their strongest point (a heart fails if it lacks the history of selection, regardless of stats). **CR Camp** often struggles here, frequently collapsing into Biostatistical theories (Boorse) which face the "healthy psychopath" counterexamples, or they drop the robust normativity requirement.

  #### 3. The Novelty Condition (Exaptation and Pre-Selection Utility)
  *   **Motivation:** A theory must ascribe function to traits that are currently useful but have not yet been selected for that utility (e.g., a mutation arising in a single individual that saves its life, or a trait co-opted for a new use before selection acts).
  *   **Status:** **Genuine Requirement.** Evolutionary biology recognizes exaptation and incipient adaptation.
  *   **Camp Pressure:** **CR Camp** insists on this (current causal contribution is sufficient). **SE Camp** treats this as a prejudice; strict etiological accounts deny "function" to novel traits until selection has occurred, labeling them merely "useful effects."

  #### 4. The Vestigiality Condition (History without Current Utility)
  *   **Motivation:** A theory must account for the intuition that vestigial organs (e.g., the human appendix or whale pelvis) retain a "function" in a historical sense, or explain why we cease calling them functional despite their history. It must resolve whether function tracks *current* contribution or *historical* persistence.
  *   **Status:** **Camp Prejudice (SE).** The **SE Camp** insists vestigial structures retain function (or lost function) based on history. The **CR Camp** happily drops this, arguing that if it contributes nothing to current fitness or systemic capacity, it has no function. This desideratum is a litmus test, not a neutral requirement.

  #### 5. The Redundancy Condition (Distributed Systems)
  *   **Motivation:** A theory must handle backup systems (e.g., two kidneys) or distributed networks (e.g., neural plasticity) without ascribing function to every causal capacity. If either kidney can do the job, does the second kidney have a function? If a network reroutes around damage, did the damaged part lose its function?
  *   **Status:** **Genuine Requirement.** Biological systems are robust and redundant.
  *   **Camp Pressure:** **CR Camp** tends toward over-ascription here (if it *can* contribute, it has a function). **SE Camp** handles redundancy well (both were selected), but struggles if the redundancy is an accidental byproduct of development not directly selected for.

  #### 6. The Semantic Condition (Teleosemantics)
  *   **Motivation:** A theory must determine whether biological function is the ground for mental content (teleosemantics). Does the function of a neural state explain its representational content?
  *   **Status:** **Camp Prejudice (SE/Teleosemantics).** This is a burden insisted upon by the **Millikan/Papineau camp**. **CR theorists** and many biologists view this as an unnecessary philosophical add-on. A general theory of biological function should not fail simply because it cannot ground intentionality, unless one assumes biology is fundamentally about information.

  #### 7. The Artifact/Synthetic Condition (Scope Extension)
  *   **Motivation:** A theory must clarify whether it applies to engineered artifacts (pacemakers) and synthetic organisms (lab-created cells with novel genomes). If a synthetic cell is designed to metabolize arsenic, does it have that function immediately, or only after it reproduces in the wild?
  *   **Status:** **Genuine Requirement (with caveats).** As synthetic biology grows, the line between evolved and designed blurs.
  *   **Camp Pressure:** **CR Camp** handles artifacts easily (design/role). **SE Camp** faces a crisis here: either they must analogize human design to natural selection (homology of function) or admit synthetic organisms lack functions until they undergo natural selection.

  ---

  ### Analysis of Joint Unsatisfiability

  **Is there a forced choice?**
  Yes. There is a subset of desiderata that appears jointly unsatisfiable for a *univocal* theory. Specifically, the **Malfunction Condition (2)** and the **Novelty Condition (3)** create a tension that forces a disjunction.

  *   To satisfy **Malfunction (2)** robustly (distinguishing broken from rare without statistical circularity), you generally need a normative standard independent of current performance. The only naturalistic candidate for this standard is **History** (SE).
  *   To satisfy **Novelty (3)** (ascribing function to a trait before it has a history), you must rely on **Current Causal Contribution** (CR).
  *   **The Conflict:** You cannot ground normativity in history (SE) while simultaneously ascribing function to items without history (Novelty). If you allow Novelty, you weaken the Malfunction condition (making it harder to distinguish a novel, useful trait from a lucky malfunction). If you enforce strict Malfunction norms, you must deny function to novel traits.

  **Result:** The debate is not merely a search for the "true" definition but a forced choice between prioritizing *historical normativity* (SE) or *current causal potential* (CR). A single theory that satisfies both without equivocation likely requires a hybrid model that risks internal inconsistency (e.g., claiming a novel trait has a "function" that lacks the normative bite of an established trait).

  ### The Single Most Exclusionary Desideratum

  The **Malfunction Condition (2)** does the most exclusionary work.

  *   **Why:** It is the primary filter that eliminates pure Causal-Role accounts. CR accounts can easily handle Novelty, Vestigiality (by denying it), Redundancy, and Artifacts. They fail primarily on the intuition that a system can be *wrong* in a way that isn't just "not contributing."
  *   **Impact:** If you insist that a theory must explain how a heart *fails* to pump blood even if pumping blood is statistically rare in that population (e.g., a diseased population), you effectively demand a normative standard external to current statistics. This forces the theorist toward Etiology or a hybrid. Conversely, if a theorist is willing to relax the Malfunction Condition (accepting that "function" is just "what it does" and "malfunction" is just "what it rarely does"), they can satisfy almost every other desideratum easily. Therefore, the demand for robust, non-statistical malfunction is the gatekeeper of the Etiological camp.

  ---

  ### Pluralism and the Debt to Biologists

  **Is Pluralism a Resolution or a Refusal?**
  Proposing that SE and CR are distinct concepts suited to different purposes is a **resolution**, provided it maps onto distinct scientific practices. It becomes a refusal (a "verbal dodge") only if it claims the ambiguity doesn't matter when it actually causes experimental or classificatory errors.

  **The Test Case: Genome Annotation**
  In genome annotation, biologists assign "function" to genes (e.g., "This gene functions to repair DNA").
  *   **The Practice:** When a biologist annotates a newly sequenced gene based on homology, they are using an **Etiological** inference (it resembles a gene selected for repair). When they validate this via a knock-out experiment to see what physiological capacity is lost, they are using a **Causal-Role** verification (what does it contribute to the system now?).
  *   **The Conflict:** Biologists are *not* equivocating; they are assuming these two concepts track each other perfectly. They assume that what was selected for (SE) is identical to what it currently does (CR).
  *   **The Philosophical Debt:** Philosophy owes biologists clarity on what happens when these come apart. In standard organisms, SE and CR usually converge. In **synthetic organisms** or **rapidly changing environments** (e.g., cancer cells), they diverge. A cancer gene has a causal role (proliferation) but its "selected effect" is parasitic, not functional for the organism.
  *   **Does this change the specification?** Yes. If the goal is to serve biological practice, a **Pluralist** specification is superior. A single univocal theory forces biologists to adopt a metaphysical stance (History vs. Mechanism) that may be irrelevant to their immediate lab work.
      *   *Recommendation:* The review chapter should argue that "Function" in biology is a **cluster concept**. Philosophy should not seek to reduce this cluster to a single necessary-and-sufficient condition, but rather to map the boundaries where the SE and CR concepts diverge (e.g., in synthetic biology or pathology).
      *   *Conclusion:* Pluralism is not a refusal to answer; it is the only answer that respects the actual usage in genome annotation. Biologists use "function" to mean "selected effect" when inferring purpose from sequence, and "causal role" when inferring mechanism from phenotype. A theory that forces them to choose one loses descriptive adequacy for the science it claims to analyze. The specification should therefore demand **contextual clarity** rather than **univocity**.
