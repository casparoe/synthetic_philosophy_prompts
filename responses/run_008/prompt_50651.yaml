  # Joint Statement on the Structure of the Dogmatism Argument and Epistemic Closure

  **Date:** October 26, 2023
  **Signatories:** [Friend A], [Friend B]
  **Moderator:** [User]

  ## Preamble
  This document records the results of an adversarial collaboration regarding the "Dogmatism Paradox" (the argument from skepticism via epistemic closure). The goal is not to resolve the dispute, but to precisely map the terrain of agreement and disagreement, isolate the substantive cruxes from potential verbal disputes, and record commitments regarding specific test cases (including the "Auditor Case"). Both signatories affirm that skepticism is false and that ordinary knowledge claims are generally true. The dispute concerns the *mechanism* by which skepticism is avoided.

  ---

  ## 1. Agreed Claims
  *The following propositions are accepted by both signatories.*

  1.  **Validity of the Core Argument:** The standard Dogmatism Argument is logically valid *on the assumption* of a single-premise Closure Principle. That is, if one accepts the Closure Principle in its unrestricted form, one must accept the conclusion or reject a premise.
  2.  **The Premises:** The argument relies on three core components:
      *   (P1) The subject knows an ordinary proposition (e.g., "I have hands").
      *   (P2) The subject knows that the ordinary proposition entails the negation of the skeptical hypothesis (e.g., "If I have hands, I am not a handless Brain-in-a-Vat").
      *   (P3) The Closure Principle: If $S$ knows $p$, and $S$ knows that $p$ entails $q$, then $S$ is in a position to know $q$.
  3.  **The Zoo Case (Dretske):** Both signatories agree that the "Zebra Case" (identifying a zebra in a pen without ruling out a cleverly disguised mule) generates a robust *intuition* that knowledge does not transmit to the entailment. Both agree this intuition requires explanation, though they disagree on the explanation.
  4.  **Closure vs. Transmission:** Both signatories distinguish between **Closure** (a principle about the *state* of knowledge: if you know $p$ and $p \to q$, you *do* know $q$) and **Transmission** (a principle about the *acquisition* of justification: you can *come to* know $q$ by deducing it from $p$). Both agree that failing Transmission does not necessarily entail failing Closure, though failing Closure entails failing Transmission.
  5.  **Theoretical Costs:** Both signatories agree that their respective positions incur theoretical costs:
      *   **Cost for the Moorean:** Must explain away the strong intuition that one cannot know one is not a Brain-in-a-Vat (BIV).
      *   **Cost for the Closure-Limiter:** Must explain why knowledge fails to aggregate across known entailments without rendering ordinary reasoning defective.
  6.  **Phenomenology of the Auditor Case:** Regarding the "Auditor Case" (hospital records verified page-by-page):
      *   Both agree the auditor verifies the records ($R$).
      *   Both agree the auditor knows $R \to \neg S$ (if records are accurate, no swap occurred).
      *   Both agree that when asked by a lawyer "Do you *know* no page was swapped ($\neg S$)?", the auditor exhibits hesitation or reluctance to assert "Yes," despite being willing to testify "I know the records are accurate ($R$)."
      *   *Note:* This claim describes only the auditor's behavior and utterances, not the underlying epistemic facts.

  ---

  ## 2. Table of Disagreements
  *The following points mark where the signatories diverge. Wording has been negotiated to ensure each signatory accepts the description of their own view.*

  | Topic | Position 1 (Moorean/Invariantist) | Position 2 (Closure-Limiting/Contextualist-Adjacent) |
  | :--- | :--- | :--- |
  | **1. Status of Closure** | A sufficiently precise Closure Principle holds universally. Apparent counterexamples (Zoo, BIV) are illusions generated by pragmatic factors or shifting standards. | Closure fails for specific classes of entailment, specifically where the conclusion serves as a "presupposition" of the evidence for the premise (e.g., ruling out error possibilities). |
  | **2. The Auditor's State** | In the Auditor Case, the auditor *does* know $\neg S$. Her reluctance to assert it is a pragmatic effect (e.g., raised stakes making assertion inappropriate), not a lack of knowledge. | In the Auditor Case, the auditor *does not* know $\neg S$. This is a genuine failure of knowledge extension in an ordinary (non-skeptical) context, not merely a pragmatic block. |
  | **3. Semantics of "Knows"** | The truth conditions of "S knows p" are invariant across contexts. The word "knows" picks out the same relation in low-stakes and high-stakes environments. | The truth conditions of "S knows p" are sensitive to context (e.g., which error possibilities are salient). "Knows" may pick out different relations depending on the conversational context. |
  | **4. Source of Skeptical Resistance** | The intuition that "I don't know I'm not a BIV" is a mistake. We *do* know this, via deduction from ordinary knowledge. | The intuition that "I don't know I'm not a BIV" is correct. We do *not* know this, and that is compatible with knowing we have hands. |

  ---

  ## 3. Cruxes and Recorded Predictions
  *The following are identified as the decisive points of contention. For each crux, a concrete case or argument is specified, and each signatory records a prediction.*

  ### Crux 1: The Precision of Closure
  **Issue:** Whether a Closure Principle can be formulated that is strong enough to generate the Dogmatism Paradox but precise enough to avoid the Zoo/Auditor counterexamples.
  **Test Case:** A formalized Closure Principle restricted to "relevant alternatives" or "safe belief."
  **Predictions:**
  *   **Position 1:** Predicts that any Closure Principle restricted enough to avoid the Zoo/Auditor counterexamples will be *too weak* to support the deduction from "Hands" to "Not-BIV." (i.e., You cannot have it both ways).
  *   **Position 2:** Predicts that a principled distinction exists between "heavyweight" entailments (BIV, Mule) and "ordinary" entailments, allowing Closure to hold generally but fail specifically where the conclusion is a precondition of the evidence.

  ### Crux 2: Everyday Consequences of Denying Closure
  **Issue:** Whether denying Closure has negative downstream effects for science, law, or daily reasoning.
  **Test Case:** The **Auditor Case** in a legal setting. If the auditor testifies "I know the records are accurate" but admits "I do not know no pages were swapped," does this undermine the testimony?
  **Predictions:**
  *   **Position 1:** Predicts that a Closure-Limiter must admit the auditor's testimony is logically unstable. If the defense attorney points out the entailment, the jury should rationally withdraw confidence in the records.
  *   **Position 2:** Predicts that the jury can rationally accept the records as known while acknowledging the swap possibility remains open. Denying Closure here has *no* practical cost to the verification process.

  ### Crux 3: Lottery vs. Skeptical Hypotheses
  **Issue:** How each side handles probabilistic knowledge compared to skeptical knowledge.
  **Test Case:** **The Lottery.** You hold a ticket in a fair 1,000,000 ticket lottery. Do you know your ticket will lose?
  **Predictions:**
  *   **Position 1:** Predicts that we do *not* know the ticket will lose (aligning with the BIV intuition). The difference between "Hands" and "Lottery" is evidential (perception vs. probability), not structural.
  *   **Position 2:** Predicts that the Lottery case is structurally identical to the BIV case. If we deny knowledge in the Lottery (due to lack of sensitivity/safety), we should deny knowledge in the BIV case, but *not* in the Hands case. Closure fails in both Lottery and BIV cases.

  ---

  ## 4. Analysis of Potential Verbal Dispute
  *Assessment regarding the suspicion that the parties are using "knows" to mean different things.*

  **Diagnosis:** There is a high probability that a portion of the dispute is verbal, specifically concerning the **extension of the word "knows" in high-salience contexts.**

  *   **Reasoning:** Position 2 leans toward Contextualism (the truth conditions of "knows" shift when skeptical possibilities are mentioned). Position 1 is an Invariantist (the truth conditions remain fixed).
  *   **The Verbal Chunk:** If Position 2 is correct, then when Position 1 says "You *do* know you're not a BIV," they are speaking in a low-standards context. When Position 2 says "You *don't* know you're not a BIV," they are speaking in a high-standards context (where the BIV hypothesis is salient). If this is the case, they are not disagreeing about the *facts* of the situation, but about which context is the "default" for philosophical discussion.
  *   **The Substantive Chunk:** However, the dispute is **not merely verbal** regarding the **Auditor Case**. In the Auditor Case, the skeptical hypothesis (page swap) is made salient by the lawyer, yet Position 1 claims knowledge is *retained* (but unassertable), while Position 2 claims knowledge is *lost* (or never obtained). This is a substantive disagreement about the nature of justification, not just the word "knows."
  *   **Recommendation:** Future discussion should separate **Semantic Contextualism** (how the word works) from **Epistemic Contextualism** (whether the justification itself varies). If both agree the *justification* remains constant in the Auditor Case, but disagree on whether to label it "knowledge," the dispute is verbal. If they disagree on whether the justification suffices for the conclusion $\neg S$, the dispute is substantive.

  ---

  ## 5. Signatures

  We certify that this document accurately reflects our current positions, the points of agreement, and the specific predictions we are committed to.

  _________________________
  [Friend A / Moorean Signatory]

  _________________________
  [Friend B / Closure-Limiting Signatory]

  _________________________
  [Moderator]
