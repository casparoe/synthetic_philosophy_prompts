prompt: |-
  My friend went on this rant about sunk costs and I wanna know how much of it actually holds up. He said: "The sunk cost fallacy is when you let past, unrecoverable investments influence your current choices. Since the money and effort are gone no matter what you do next, a rational agent weighs only future costs and benefits — honoring sunk costs is always irrational. That's why economists mock the Concorde project as the classic case, and psychologists have shown it's mostly driven by our need to self-justify past decisions. So if you keep watching a show you're not enjoying just because you've already sat through four seasons, you're being irrational, full stop."

  Something about it feels to clean to me — like, I can think of reasons to finish a bad book that don't seem obviously crazy, but maybe that's just me rationalizing. Can you go through his summary piece by piece: which parts a careful decision theorist would sign off on, where he's quietly conflating two different things (I suspect the distinction between treating sunk costs as reasons versus as evidence matters here, but I don't fully get it), and whether his "full stop" conclusion about finishing things follows from the parts that are actually true. Also flag if anything he says about the psychology is more contested than he lets on. Please answer in American English.
