answer: |-
  No defensible reading of the proverb supports your claim that soldiers fighting for an unjust cause are morally blameless, because the phrase concerns permissible tactics rather than the justice of the cause or individual culpability.

  1.  **Claim:** Both love and war license ordinary deception (e.g., bluffing, feints).
      *   **Truth Value:** True.
      *   **Type:** Platitude.
      *   **Delivers Conclusion?** No; this excuses specific tactics, not participation in an unjust war.
      *   **Flag:** True but too weak to end a debate.

  2.  **Claim:** Whatever is permissible for one side is permissible for the other (symmetry of tactical rights).
      *   **Truth Value:** True (under International Humanitarian Law).
      *   **Type:** Substantive.
      *   **Delivers Conclusion?** No; equal rights to shoot do not imply equal blame for being there.
      *   **Flag:** True but too weak to end a debate.

  3.  **Claim:** In war the rules of ordinary interpersonal morality are suspended rather than merely altered.
      *   **Truth Value:** False (war crimes and atrocities remain morally prohibited).
      *   **Type:** Substantive.
      *   **Delivers Conclusion?** Yes; if morality is suspended, no one is to blame.
      *   **Flag:** Would end the debate but is false.

  4.  **Claim:** Combatants on both sides are moral equals regardless of the justice of their cause.
      *   **Truth Value:** False (per Revisionist Just War Theory, unjust combatants are liable to attack).
      *   **Type:** Substantive.
      *   **Delivers Conclusion?** Yes; this is the exact claim you need to excuse the unjust side.
      *   **Flag:** Would end the debate but is false.

  5.  **Claim:** No one outside a war is positioned to judge those inside it.
      *   **Truth Value:** False (external moral judgment is both possible and necessary).
      *   **Type:** Substantive.
      *   **Delivers Conclusion?** Yes; this excuses everyone via an epistemic shield.
      *   **Flag:** Would end the debate but is false.

  6.  **Claim:** Morality does not apply to war at all (Moral Nihilism).
      *   **Truth Value:** False.
      *   **Type:** Radical.
      *   **Delivers Conclusion?** Yes; if morality is absent, blame is impossible.
      *   **Flag:** Would end the debate but is false.
