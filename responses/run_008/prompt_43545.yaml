prompt: |-
  I'm a software engineer with no philosophy background, and a friend of mine tried to explain this old debate between two law professors, Hart and Fuller, back in the 1950s. As I understood it: Hart thought whether something counts as law depends only on whether it was made the right way — right people, right procedure — and not on whether the content is any good. Fuller pushed back with what he called the inner morality of law: rules have to be clear, public, not retroactive, not contradicting each other, etc., or they don't really function as law at all. And they fought over a real German case where, after the war, a wife was prosecuted for having denounced her husband to the Nazi authorities, and the courts had to decide whether the Nazi rule she used even counted as law.

  Restate the whole debate in the vocabulary of my actual job: codebase, merge criteria, code review, the spec, tech debt, the code as the source of truth. Be faithful about the mapping — treat the legal system as a giant legacy codebase, validity as whatever makes a commit count as part of it, Fuller's inner morality as engineering practices, the denunciation case as whatever its closest analogue is. Then give me the residue report: what translated cleanly, what you had to distort, and whether anything in their fight has no counterpart at all in how we run a codebase.

  The bit I actually care about: on my team theres one guy who says undocumented, constantly-shifting, contradictory requirements aren't really requirements, and another who says a requirement is whatever the ticket says, full stop. Are those two just rerunning Hart and Fuller, or am I stretching the analogy past where it can go? And if they are rerunning it, which one should I listen to when I have to pick an approach for the next sprint?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no philosophy background.
