prompt: |-
  Quick background so this makes sense: I'm a nurse, I work 12-hour shifts, and my way of coming down is a Friday film night with my sister. Something about my own reactions has been bugging me for months and I can't find a word for it. When we rewatch something where a character dies, I cry harder the second time, not less. First watch of Marley & Me I was mostly startled; second watch I was basically grieving through the whole happy first hour, because I knew what was coming. Same with the opening of Up — the joyful montage had me wrecked on rewatch, when the first time it just seemed sweet. And it's not just me, I've checked with friends and they say the same: foreknowledge doesn't dilute the emotion, it spreads it backwards over scenes that are, taken on their own, completely happy. It's almost like the grief from the ending leaks into the middle. My sister watched Titanic fresh while I was on maybe my fourth viewing, and she cried once at the end while I'd been getting misty from the party scenes.

  I know there's a standard puzzle in this area — how we can feel real emotions for characters we perfectly well know aren't real, I half-remember it being called the paradox of fiction. But my thing feels like a different wrinkle, and it's about time, not belief. I'm not confused about whether the character exists. I have an emotion that belongs to the ending showing up in the middle, and showing up harder than it did when the ending actually surprised me. I vaguely recall some philosophers saying our fictional feelings are more like rehearsals or make-believe versions of the real thing — but if that's right, it's odd, because in my case the make-believe version gets stronger the more times I've rehearsed it. Whats the word for this, if there is one? And to be honest I won't be satisfied with just a label — what I'd want to know is whether this backwards-spreading emotion fits neatly into the usual stories people tell about our feelings for fiction, or whether it quietly causes trouble for them. If there's no settled term, coin one, define it so it doesn't collapse into neighbouring phenomena (my sister insists it's basically the same as rewatching a thriller and getting tense earlier because you know the killer is in the house — I think that one at least makes sense and mine doesn't), and give me a couple of edge cases where it's unclear whether we're dealing with it or something else.

  Please answer as a philosopher who works on emotion and aesthetics rather than as a search engine: start with a bit of brainstorming that untangles the distinct things I've probably muddled together (foreknowledge intensifying emotion, emotion spreading backwards in time, repeat vs first-time viewing, and whatever else you spot), then give me the actual answer about names and accounts. I'd also like you to be upfront about confidence: mark which parts of what you say are established in the literature versus your own carving, and tell me which single point you're least sure about. British English please, and sorry for the length — this has been sitting with me since Friday.
