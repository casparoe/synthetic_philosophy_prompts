      *   *Section 5: Applying to Zombies.* This is the payoff. If consciousness is a "true and immutable nature" grasped clearly, then zombies are possible. If consciousness is like water (where the "feel" is just a superficial marker of a physical state), then zombies are inconceivable *once we understand the nature*.
      *   *Conclusion:* Summarize the stalemate. The argument hinges on whether consciousness is more like a triangle (grasped directly) or water (grasped via effects).

  6.  **Refining the Tone:**
      *   Keep it "plain but precise." Avoid jargon like "a posteriori necessity" unless explained.
