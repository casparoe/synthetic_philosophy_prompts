answer: |-
  ### Desiderata for a Theory of Repugnant Markets

  **1. Discriminatory Granularity**
  *   **The Case:** A theory must explain why we permit paid plasma donation but forbid paid kidney donation, despite both involving bodily fluid/tissue and financial incentive. It must distinguish voting (sacred) from kidneys (contested) and life insurance on self (banal) from viatical settlements on strangers (obscene).
  *   **The Requirement:** The theory cannot rely on broad categories like "bodily integrity" or "consent" alone, as these apply equally to the permitted and forbidden cases. It must identify the *relational* or *structural* variable that shifts the moral valence (e.g., desperation thresholds, crowding out effects, or the specific social meaning of the transaction).
  *   **Status:** **Non-Negotiable.** Without this, the theory is too blunt for policy.

  **2. Intuition Calibration (The Signal/Noise Ratio)**
  *   **The Case:** Repugnance is sometimes status quo bias (usury, interracial marriage markets) and sometimes a heuristic for systemic harm (baby selling, vote buying). A theory that dismisses all repugnance as irrational ignores social coordination costs; a theory that accepts all repugnance as wisdom enforces caste systems.
  *   **The Requirement:** The theory must provide a meta-criterion for distinguishing *adaptive* repugnance (signaling genuine market failure or value corrosion) from *maladaptive* repugnance (signaling mere unfamiliarity or entrenched privilege).
  *   **Status:** **Non-Negotiable.** This is the core functional requirement for your stated purpose of settling hard cases.

  **3. Historical Plasticity**
  *   **The Case:** Life insurance was once considered a morbid bet on death; now it is financial planning. Usury was a sin; now it is a credit score.
  *   **The Requirement:** The theory must account for *why* repugnance fades. Is it because the harm vanished, or because the norm was eroded by capital? A static theory will incorrectly ban future markets that would have been benign, or permit current ones that are historically contingent anomalies.
  *   **Status:** **Non-Negotiable.** A policy guide must be robust to cultural evolution.

  **4. Implementation Feasibility (The Roth Constraint)**
  *   **The Case:** Alvin Roth demonstrates that repugnance is a hard constraint on market design; ignoring it leads to black markets or institutional collapse.
  *   **The Requirement:** The theory must distinguish between *normative permissibility* (is this trade morally okay?) and *policy viability* (will banning this trade create worse outcomes?). It cannot simply say "if efficient, allow it" if the enforcement cost destroys the institution.
  *   **Status:** **Non-Negotiable.** You asked for policy-level adjudication, not pure ethics.

  **5. Agent Constitution (The Anti-Smuggle)**
  *   **The Case:** Your welfare-plus-autonomy view assumes agents exist *prior* to the market with fixed preferences. But markets often *constitute* the agents (e.g., a vote market turns citizens into sellers; a surrogacy market turns women into incubators).
  *   **The Requirement:** The theory must account for how the market changes the *nature* of the goods and the *identity* of the traders, not just the allocation of resources.
  *   **Status:** **Camp Prejudice (Yours).** Your starting point smuggles in a liberal conception of the self that is pre-social. If markets change who we are, "autonomy" is not a stable baseline.

  **6. Incommensurability Acknowledgement**
  *   **The Case:** Welfare economics assumes all goods can be compared on a single scale (utils/$). Repugnance often asserts that certain goods (votes, children, bodies) are *not* fungible with money.
  *   **The Requirement:** The theory must either justify why money is a valid metric for the specific good in question or explain why the attempt to commensurate is itself the harm.
  *   **Status:** **Camp Prejudice (Yours).** Your welfare view assumes commensurability is always possible. Denying this is not irrational; it is a claim about the structure of value.

  ***

  ### Joint Unsatisfiability: The Calibration Paradox

  There is a tension between **Desideratum 2 (Intuition Calibration)** and **Desideratum 3 (Historical Plasticity)** that borders on unsatisfiable for a single static theory.

  To treat repugnance as *evidence* of value corruption (Calibration), you must assume it tracks something real about the world. To acknowledge *Historical Plasticity*, you must admit that what repugnance tracks changes or was wrong in the past. If repugnance moves, how do you know if the current movement is progress (usury bans lifting) or decay (vote markets normalizing)?

  A theory that resolves this must be **dynamic**: it cannot judge the trade in isolation but must judge the *trajectory* of the norm. However, this creates a policy problem: you cannot ban a market today based on the prediction that it *will* corrupt norms tomorrow, without violating the principle of allowing harmless trades today. You are forced to choose between **paternalism** (banning to protect future norms) and **liberalism** (allowing trades and risking norm erosion). You cannot have a theory that guarantees both the protection of values and the maximization of current welfare without a meta-theory of moral progress that is itself contestable.

  ***

  ### Scorecard

  **Michael Sandel (Corruption and Fairness)**
  Sandel scores high on **Discriminatory Granularity** and **Agent Constitution**. He explains why vote markets are worse than kidney markets (votes define the collective self; kidneys are individual property) and acknowledges that markets change the meaning of goods. However, he fails **Historical Plasticity** and **Intuition Calibration**. His theory often treats current intuitions as definitive markers of moral truth, lacking a mechanism to distinguish between "this corrupts a valuable norm" and "this challenges an unjust norm." He provides a vocabulary for repugnance but no algorithm for overcoming status quo bias, making him poor for policy adjudication where norms are in flux.

  **Debra Satz (Noxious Markets)**
  Satz is the strongest candidate for your purpose. She meets **Discriminatory Granularity** by defining noxiousness through specific parameters (extreme vulnerability, weak agency, extreme harm to others). She handles **Historical Plasticity** better than Sandel by focusing on structural power dynamics rather than intrinsic meaning (slavery was always noxious; usury became less so as power dynamics shifted). She partially satisfies **Implementation Feasibility** by acknowledging that some markets undermine the equality necessary for democracy. Her weakness is **Incommensurability**; she still relies on a consequentialist framework that might struggle if the harm is purely symbolic rather than material, but she offers the most actionable criteria for policy.

  **Simple Welfare-Plus-Autonomy (Your View)**
  This view fails **Discriminatory Granularity** and **Agent Constitution**. It cannot explain why we ban vote markets (high welfare gain, autonomous sellers) or why surrogacy feels different from plumbing work without importing ad-hoc assumptions about "harm." It treats **Repugnance** purely as noise, violating **Intuition Calibration**, which leads to policy brittleness (ignoring the Roth Constraint). It assumes **Incommensurability** is false, which is the very point in dispute. While internally consistent, it is descriptively inadequate for the phenomena you are trying to govern; it solves the problem by defining the hard cases out of existence rather than resolving them.
