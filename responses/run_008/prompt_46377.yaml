  *(Self-Correction on User's Bias)*: The user thinks their view is neutral. I need to show that "Welfare" presupposes a metric of value that repugnant markets often explicitly reject (incommensurability). "Autonomy" presupposes the agent exists prior to the market, whereas markets constitute agents. This is the "smuggle."

  8.  **Final Review against constraints:**
      *   Desiderata list? Yes.
      *   Case/Consideration for each? Yes.
      *   NN vs CP marking? Yes.
      *   Joint Unsatisfiability analysis? Yes.
      *   Scorecard (3 candidates, 1 paragraph each)? Yes.
