answer: |-
  Hi there, I know exactly the problem you are facing because I have sat in those same orientation rooms watching students glaze over when told to just be respectful. You are asking for a way to turn philosophical abstraction into a pocket-sized algorithm, and while no procedure can replace moral reasoning, we can build a scaffold that forces students to stop and think rather than react. What you need is a filter based on the distinction between coordination conventions, which exist because everyone expects everyone else to follow them, and moral obligations, which exist because breaking them causes harm or violates dignity. The following five-question procedure is designed to be taught in ten minutes and memorized on a phone lock screen, moving from concrete harm to abstract values, with a built-in default for when they simply do not know the rules.

  The first question they must ask is whether breaking the convention causes direct economic harm or physical danger to a specific person. If the answer is yes, treating the norm as a real obligation is required regardless of whether it makes sense to them. The second question asks whether the norm is a coordination rule where deviation creates chaos or significant friction for others, like driving on the correct side of the road. If yes, conformity is obligatory for safety and order, even if no one is directly hurt. The third question flips the script and asks whether following the norm violates a core moral principle of the student, such as equality or honesty. If yes, the procedure outputs do not do it, because complicity in a harmful system is not politeness. The fourth question is about cost and signal, asking whether the cost of conformity is low while the signal of respect is high. If yes, the output is go along with it but it is not morally on you, marking it as a gesture of goodwill rather than duty. The fifth question handles uncertainty, asking whether they can observe locals or ask a peer without drawing attention. If they cannot know the answer in advance, the default under uncertainty is to err toward low-cost conformity until they have enough data to assess harm, because the risk of accidental offense is lower than the risk of accidental harm.

  I need to be honest with you about where this machinery grinds to a halt. Steps one and two are doing the heavy lifting on facts, distinguishing harm from habit, but steps three and four are judgment calls dressed up as procedure. I cannot tell a student objectively whether shaking a hand is complicity in sexism or a harmless cultural greeting, and I cannot measure the exact cost of a gesture against its signal value. Those steps are there to force the student to identify the conflict, not to resolve it for them. When the procedure hits step three and the student feels a deep violation, the algorithm refuses to decide and hands it back to them as a question of values, not facts. This is the limit of what a pre-departure session can do; we can give them a way to categorize the problem, but we cannot absolve them of the responsibility to solve it.

  Let us run this on your tipping case with the Japanese student in the US. The student asks if they have to tip twenty percent. Question one asks if not tipping causes direct economic harm. In the US service industry, wages are structurally subsidized by tips, so withholding the expected tip directly reduces the server's livelihood for that shift. This triggers the obligation output. I know you privately think this props up a system you would like to see die, and you are right that the system is flawed, but the procedure is designed to protect the individual worker in front of the student, not to fix the macroeconomy. The procedure says this is a genuine obligation because the harm is immediate and specific, even if the student disagrees with the system. They can advocate for change later, but in that moment, the convention functions as a wage contract.

  Now consider the jaywalking cases, starting with the German student in Manhattan. Locals cross against the light constantly. Question one asks about safety harm. If the street is clear and locals are doing it, the physical danger is low. Question two asks about coordination chaos. In Manhattan, crossing against the light is itself the coordination norm during certain times, so following the light might actually disrupt the flow. The procedure outputs go along with it but it is not morally on you, because it is a local habit rather than a safety rule. Reverse this for the student in Berlin at 2am. The street is empty. Question one says no physical harm. Question two says the coordination norm is strict waiting, but breaking it causes no chaos. However, Question four asks about cost versus signal. Waiting costs ten seconds and signals respect for local order. The procedure suggests waiting, not because it is immoral to cross, but because the cost is low and the signal is high. It classifies this as politeness rather than obligation, allowing the student to choose based on their fatigue level without guilt.

  Finally, take the female student encountering the no-handshake convention for women. She finds it demeaning. Question one and two show no direct harm or coordination chaos if she refuses. Question three asks if following the norm violates a core moral principle. She believes it violates equality and dignity. If she answers yes, the procedure outputs do not do it, or at least identifies this as a value conflict where conformity is complicity. This is where the procedure hands it back to her. It does not tell her she is right or wrong, but it validates that this is not merely a etiquette question. She might choose to place her hand over her heart instead, modifying the behavior to signal respect without violating her principle. The procedure cannot impose your view on whether she should refuse, but it gives her the language to explain why she is refusing, shifting the frame from rudeness to conscientious objection.

  You will notice that in the tipping case, the procedure demands conformity even when the system is unjust, and in the handshake case, it permits non-conformity even when it might cause offense. This is the feature, not the bug. We are teaching students to distinguish between economic survival, social friction, and moral integrity. If you try to teach this in your hour, spend the first ten minutes walking them through these five questions with these exact examples. Do not worry about the edge cases where the procedure feels rigid. The goal is not to give them the right answer for every situation, but to give them a way to stop and ask the right questions before they act. If they leave knowing that tipping is a wage, jaywalking is a flow issue, and handshakes are a value test, you have given them more than vibes. You have given them a map.
