      In Move 4 (Kelly's Counter-Counter), Kelly argues that different birth ranks give different doom dates. Dave says that's just updating. This is the "Diachronic" objection. Philosophers like Arntzenius have discussed this. It's generally considered a problem for DA, but Dave's defense (Bayesian updating) is the standard rebuttal. I'll call this a technical win for Dave, but a conceptual win for Kelly.
      In Move 5 (Kelly's Final), Kelly attacks the ontology of the future. This is the "Causal" objection. This is widely considered the strongest rebuttal. Kelly wins Move 5.

