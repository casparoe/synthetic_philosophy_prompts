    "scenario": "A stroke-damaged conductor lives on more vividly in her choir's shared memories and decisions than in her own silent brain.",
    "hofstadter_verdict": "The 'I' is predominantly instantiated in the ensemble where the pattern remains active and coherent, rather than in the degraded originator.",
    "continuity_verdict": "The person persists exclusively in the original brain via attenuated psychological continuity, as the choir lacks direct causal consciousness.",
    "load_bearing_feature": "The inversion of pattern fidelity between the degraded originator and the vibrant bearers.",
    "if_removed": "Both verdicts converge on locating the person in the original brain if the originator remains cognitively intact.",
    "parfitian_objection": "Carrying a pattern is representation like a portrait, not identity, because distinct brains lack direct causal continuity of consciousness.",
    "hofstadter_reply": "The self is the pattern itself, not the substrate; if the pattern actively decides and feels in the bearers, the 'I' is truly there."
  }
  ```
