answer: |-
  Elara conducted the choir for forty years. When the stroke stole her speech, her singers kept her repertoire alive, mimicking her gestures so precisely during rehearsals that strangers mistook them for her. In her care home room, she stares blankly, forgetting names and melodies, while across town, the ensemble argues passionately about how Elara would phrase the crescendo, citing her letters and memories to resolve disputes. Her own mind holds only fragmented noise, but their shared conversations reconstruct her intentions with clarity she no longer possesses. She exists now mostly in the harmony of their disagreements, while the body that birthed them sits silent, recognizing no one.

  **Hofstadter's Verdict:** The 'I' is a self-referential pattern instantiated in physical substrates. Since the choir actively maintains, debates, and executes Elara's intentions with higher fidelity than her damaged brain, the bulk of her 'I' now resides in the ensemble. Degree: High in the choir, negligible in the original brain.

  **Continuity Verdict:** Personal identity follows the unique psychological continuity rooted in the original organism. While the choir shares connectedness (memories), their consciousness is not causally continuous with hers. She persists only in the original brain, however attenuated by injury. Degree: Attenuated but exclusive to the original brain.

  **Load-Bearing Feature:** The inversion of pattern fidelity: the originator's cognitive degradation coinciding with the bearers' active preservation of her decision-making patterns.

  **If Removed:** If Elara remained cognitively intact, both views would locate her primarily in her own brain, as the source pattern would remain the most vibrant instantiation.

  **Parfitian Objection:** Carrying someone's pattern is like owning a detailed portrait; it represents her but is not her. Psychological continuity requires the direct causal flow of consciousness within a single line, not merely accurate simulation by distinct brains.

  **Hofstadter Reply:** For a pattern theorist, there is no "deep further fact" beyond the pattern itself. If the pattern drives behavior and emotional response in the bearers exactly as it did in the originator, the distinction between representation and instantiation collapses; the song is where the singing happens.

