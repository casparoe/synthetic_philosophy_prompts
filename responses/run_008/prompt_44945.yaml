      *(Drafting thought)*: Make sure the transition to asymmetry feels natural, not tacked on. It fits well after discussing the structure of equations vs. worlds.

      *(Drafting thought)*: For the conclusion, focus on the "Metaphysical Priority" question. Does the model track the world, or does the model constitute the causal facts?

