answer: |-
  This is a sophisticated hybrid position. You are attempting to marry **Traditional Just War Theory** (which holds that soldiers are morally equal and rules are symmetrical) with **Revisionist Just War Theory** (which holds that fighting for an unjust cause is inherently wrong and creates asymmetrical liability). This is a known philosophical hard spot; holding both sets of intuitions simultaneously creates friction.

  Here is the stress test of your five commitments.

  ### 1. Genuine vs. Apparent Tensions

  **Genuine Tension: (1) vs. (2)**
  *   **The Conflict:** (1) asserts the **Moral Equality of Combatants (MEC)**: justice of cause does not affect liability to be killed. (2) asserts **Individual Culpability**: fighting for an unjust cause is "attempted murder."
  *   **Why it's genuine:** If the unjust soldier is committing "attempted murder" (2), they are an unjust threat. If the just soldier is defending against murder, they are a just threat. In moral theory, unjust threats are liable to defensive harm; just threats are not. Therefore, they cannot be "on a par" (1). You cannot claim the acts are morally unequal (2) while claiming the soldiers' liability status is equal (1).

  **Genuine Tension: (2) vs. (3)**
  *   **The Conflict:** (2) states the "ordinary soldier... is doing something badly wrong." (3) states your grandfather (an ordinary soldier in an unjust war) was "not a murderer."
  *   **Why it's genuine:** This is a direct contradiction unless an excusing condition is applied. While (5) attempts to bridge this, (2) is stated as a universal rule ("the ordinary soldier"), whereas (3) relies on an exception.

  **Apparent Tension: (1) vs. (5)**
  *   **The Conflict:** (1) says soldiers are equal regarding *liability* (who can be shot). (5) says soldiers are unequal regarding *blame* (who is responsible).
  *   **Why it's apparent:** Liability and blame are distinct concepts in ethics. One can be liable to defensive harm without being morally blameworthy (e.g., an "innocent threat"). You can maintain (1) and (5) simultaneously if you keep these categories separate.

  **Apparent Tension: (3) vs. (5)**
  *   **The Conflict:** (3) exempts a specific conscript; (5) establishes a general duty to refuse.
  *   **Why it's apparent:** (5) explicitly includes the excusing condition ("conscript under a nasty regime isn't blamed like a volunteer"). (3) is simply an instantiation of the exception clause in (5). They are consistent.

  ### 2. Ranking by Severity

  1.  **(1) vs. (2) [Critical]:** This is the theoretical engine failure. It pits the core of Traditional JWT against the core of Revisionist JWT. If you keep both as stated, your framework collapses under scrutiny.
  2.  **(2) vs. (3) [High]:** This is the personal stakes failure. If you cannot resolve this, your theory condemns your grandfather, which you explicitly reject.
  3.  **(2) vs. (4) [Medium]:** The "Sport" analogy in (4) breaks down if the activity is "murder" (2). Sports regulate competition, not criminal acts. If the war is unjust, the "game" analogy feels insufficient.

  ### 3. Cheapest Fixes

  *   **For (1) vs. (2):** Distinguish **Objective Wrongness** from **Subjective Culpability**. Revise (2) to say fighting for an unjust cause is *objectively* unjust, but does not automatically render the soldier *subjectively* culpable or liable in the same way a murderer is. This preserves (1)'s claim about liability while keeping (2)'s moral intuition.
  *   **For (2) vs. (3):** Add an epistemic/duress clause to (2). Change "the ordinary soldier... is doing something badly wrong" to "the ordinary soldier... is participating in wrong, though culpability depends on knowledge and voluntariness." This aligns (2) with (5) and saves (3).
  *   **For (2) vs. (4):** Refine the analogy. Clarify that the "rules of the sport" regulate *conduct* (jus in bello), not the *justice of participation* (jus ad bellum). This allows the rules to be symmetrical even if the causes are not.

  ### 4. Single Revision to Clean Up the Most

  **Commitment (2) is the outlier.**
  Claims (1), (3), (4), and (5) all lean toward a **Traditionalist/Pragmatic** view (symmetry, excusing conditions for conscripts, rules apply equally). Claim (2) is a hardline **Revisionist** spike ("attempted murder") that pierces the rest of the shield.

  If you revise (2) to soften the claim from "attempted murder" to "objective participation in injustice," you resolve the tension with (1) (liability remains equal), (3) (grandfather is excused), and (4) (rules regulate conduct, not moral status). It also aligns perfectly with the nuance already present in (5). Keeping (2) as written forces you to abandon either the equality of combatants (1) or your judgment on your grandfather (3).

  Verdict: 2
