      *   Address the nature of protests (voice vs. service)? Yes.
      *   Address the narrative control aftermath? Yes.
      *   Honest about forcing fits? Yes.

      *(Self-Correction during drafting)*: Make sure not to get bogged down in the specific death tolls or policy details, keep the focus on the *legitimacy mechanics*. The user knows the history; they want the theoretical analysis.

      *(Final thought on the Brother-in-Law's argument)*: The BIL argues the system corrected itself. I need to address whether "correcting itself" under threat of unrest is the same as a stable social contract. It suggests the contract is enforced by fear, not consent.

