      *   *Critique:* The draft says "knobs are fixed by the theme's received description." Hofstadter would argue the knobs *emerge* from the pressure of the situation. The draft treats the "received description" as more static than Hofstadter might. However, for the sake of the essay's argument, this is a usable adaptation. The draft claims Hofstadter implies knobs are supplied by a describable structure. Hofstadter actually emphasizes the *fluidity* of concepts.
