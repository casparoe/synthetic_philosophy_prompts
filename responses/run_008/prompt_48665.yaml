      *   *Suggestion:* A literary example might fit the "description" angle best. E.g., Re-interpreting a character (Hamlet as Oedipal). Or a scientific example (Newton seeing gravity not as a force pulling down but as universal attraction). The Newton example fits the "knob naming" ending well.

