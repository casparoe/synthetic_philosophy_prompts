      *   *Critique:* It follows *if* we accept that the "re-carving" is the act of articulation. But does it follow from the *phenomenology*? The draft says the phenomenology is "seeing what was there." If it was there, others were interacting with it. The logic holds, but it needs a connective tissue sentence. It feels slightly cynical ("uncomfortable"), which is fine, but needs to be grounded in the "re-carving" definition.

