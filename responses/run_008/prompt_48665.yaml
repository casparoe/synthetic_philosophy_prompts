      *   *Paragraph 1 (Hofstadter):* Introduces the knob/dial metaphor via letter-string analogies (abc -> abd, ijk -> ?). Accurately captures the essence of Hofstadter's *Fluid Concepts and Creative Analogies* (FACA) style reasoning. Emphasizes that variation is cheap; selecting the *relevant* knob is the work.
      *   *Paragraph 2 (The Claim):* Defines the two types of variation. 1st order = fixed knobs, new settings (Craft). 2nd order = new dimension/dial, requires re-cutting the description (Creativity). Test: Can it be specified by existing parameters?
      *   *Paragraph 3 (Example):* Jazz reharmonization. Melody stays same, harmonic function changes (passing tone -> anchor). Claims this is "old material unchanged with description rewritten." Links to phenomenology of discovery.
      *   *Paragraph 4 (Objection/Boden):* Anticipates comparison to Margaret Boden's *The Creative Mind*. Acknowledges similarity (transformational) but claims distinction lies in "single theme's description" vs. "whole space of possible works." Aims to explain the *feeling* of discovery.
      *   *Paragraph 5 (Implications/Credit):* Suggests "genius" is just naming the knob others were turning blindly. Implications for credit are "uncomfortable."

  3.  **Address Question 1: Accuracy of Hofstadter Representation:**
