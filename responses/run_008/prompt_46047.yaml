  # The Binding Force of Promises: A Diagnostic Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your moral intuition about the case described. Follow the arrow corresponding to your answer until you reach a **Leaf**. The Leaves describe standard philosophical positions. Read the note on the "awkward commitment" to see the cost of holding that view.

  ---

  ### Node 1: The Castaway Test (Social Practice)
  **Case:** Two shipwreck survivors from completely different cultures meet on a desert island. They have no shared language or customs. One points to a coconut and says, "I will give this to you tomorrow." The next day, he eats it himself.
  **Question:** Did he violate a **promise**, or did he just act disappointingly?
  *   **He violated a promise (Obligation exists without practice):** Go to **Node 5**.
  *   **He just acted disappointingly (Obligation needs practice):** Go to **Node 2**.

  ---

  ### Node 2: The Harm Test (Changed Circumstances)
  **Case:** You live in a normal society. You promised to help a friend move. On the day, you get a severe migraine. Helping would cause you significant pain; your friend would be annoyed but can manage alone.
  **Question:** Does the **pain itself** make it okay to break the promise, or do you need a specific rule that says "illness excuses you"?
  *   **The pain itself is enough (General morality decides):** Go to **Node 3**.
  *   **I need a rule/excuse (The promise adds extra weight):** Go to **Node 4**.

  ### Node 3: The Coercion Test (Gunpoint)
  **Case:** A thief holds a gun to your head and makes you say, "I promise not to call the police." You survive and call them anyway.
  **Question:** Did you break a **promise**?
  *   **Yes (Words bind regardless of freedom):** 🍂 **Leaf A: Deflationary/Skeptical View**
  *   **No (Coercion voids the bond):** 🍂 **Leaf B: Empty Cell** *(Note: This combination is rarely defended. If general morality decides, coercion usually voids the duty to be honest. If you think this view is coherent, you may hold a strict "Truth-Telling" view distinct from promising.)*

  ### Node 4: The Publicity Test (Convention)
  **Case:** You whisper a promise to a friend in private. Compare this to announcing the same promise on social media.
  **Question:** Does the public announcement make the obligation **stronger** because more people are watching?
  *   **Yes (The social audience matters):** 🍂 **Leaf C: Convention/Practice View** *(Note: Awkward commitment: Without established social rules, your word is morally weightless, even to a dying friend.)*
  *   **No (The bond is the same):** 🍂 **Leaf D: Empty Cell** *(Note: This combination is incoherent. If the obligation comes from a practice, public validation usually strengthens the institutional bond. If it doesn't, you likely don't hold a Convention view.)*

  ---

  ### Node 5: The Triviality Test (Added Case)
  **Case:** You promised to meet for coffee. You are very tired. The friend loses nothing if you don't show (they bring a book).
  **Question:** Is it still a **moral wrong** to stay home, or just rude?
  *   **Just rude (No moral obligation without reliance):** 🍂 **Leaf E: Expectation-and-Reliance View** *(Note: Awkward commitment: You can undo an obligation simply by ensuring the other person never actually expects you to follow through.)*
  *   **A moral wrong (The word itself binds):** Go to **Node 6**.

  ### Node 6: The Forgotten Test
  **Case:** You promised to water a neighbor's plant. They leave town and entirely **forget** that you promised.
  **Question:** Are you still bound to water it?
  *   **No (No expectation, no obligation):** 🍂 **Leaf E: Expectation-and-Reliance View** *(See above.)*
  *   **Yes (You bound yourself):** Go to **Node 7**.

  ### Node 7: The Release Test (Dying Person)
  **Case:** A dying person makes you promise to burn their private diaries. Before they die, they say, "Actually, I release you from that promise." Then they pass away.
  **Question:** Are you still bound to burn the diaries?
  *   **No (They hold the key to the obligation):** Go to **Node 8**.
  *   **Yes (I bound myself, period):** 🍂 **Leaf F: Voluntarist/Autonomy View** *(Note: Awkward commitment: You can be bound to do something the other person explicitly forbids you from doing.)*

  ### Node 8: The Self-Promise Test (Added Case)
  **Case:** You promise **yourself** to start dieting tomorrow. You don't tell anyone.
  **Question:** Are you bound in the **same way** as if you promised a friend?
  *   **No (Promises require another person):** 🍂 **Leaf G: Normative Power View** *(Note: Awkward commitment: You possess a strange metaphysical capacity to change moral reality by speaking, but only when others are involved.)*
  *   **Yes (Will binds will):** 🍂 **Leaf F: Voluntarist/Autonomy View** *(See above.)*

  ---

  ### Summary of Positions (Leaves)

  *   **Leaf A: Deflationary/Skeptical View.** Promises carry no distinctive binding force beyond what general moral considerations (like "do not lie") already supply.
  *   **Leaf C: Convention/Practice View.** The obligation arises from a social practice of promising; no practice, no promise. (Lineage: Hume, Rawls).
  *   **Leaf E: Expectation-and-Reliance View.** The wrong in breach is essentially a wrong to someone who was counting on you; no counting on, no wrong.
  *   **Leaf G: Normative Power View.** Promising is the exercise of a capacity to impose obligations on oneself for another's benefit. (Lineage: Raz, Shiffrin).
  *   **Leaf F: Voluntarist/Autonomy View.** The binding force flows from the promisor's own will or consent, independent of the promisee's control.
  *   **Leaf B & D: Empty Cells.** These combinations of answers correspond to no defended position in the literature, flagged here to show logical limits in the debate.

  ### A Note on Limits
  You may notice that **Leaf E (Expectation/Reliance)** and **Leaf A (Deflationary)** can be difficult to distinguish in practice. Both look at consequences (harm/reliance) rather than the act of promising itself. We separate them at **Node 1**: the Deflationary view typically denies that "promising" adds any *special* moral category even in society, whereas the Expectation view admits a specific obligation arises from the psychological state of reliance. If you found yourself bouncing between these two, you have identified a genuine fuzzy boundary in moral theory.
