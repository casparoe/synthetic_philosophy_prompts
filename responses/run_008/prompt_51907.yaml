answer: |-
  Your hypothesis is substantially correct, but it can be sharpened. The stalemate is not merely a semantic disagreement over the word "counterfactual," but a fundamental divergence regarding the **locus of agency** and the **temporal scope of optimization**.

  The LessWrong debate (primarily between Causal Decision Theory/Evidential Decision Theory and Functional Decision Theory/Updateless Decision Theory) persists because both sides are optimizing for different objective functions. One side optimizes for **dynamic consistency** (doing the best you can from *here*), and the other optimizes for **reflective consistency** (being the kind of agent who wins *overall*).

  Here is a diagnosis of the structure of the disagreement, an evaluation of your hypothesis, and a proposal for what constitutes progress.

  ### 1. Diagnosis: Two Questions, One Label

  You suggest the sides are answering "which act to perform" vs. "which policy you should have been." This maps closely to the technical distinction between **Ex-Post Act Evaluation** and **Ex-Ante Policy Selection**.

  **The Updateful View (CDT/EDT): The View from Now**
  *   **The Counterfactual:** Defined by causal arrows originating from the present moment. Once the coin lands Tails in Counterfactual Mugging, the Heads branch is causally severed. It is a "dead" counterfactual.
  *   **The Goal:** Maximize utility in the actual world, given current information.
  *   **The Claim:** Rationality is about responding correctly to the world you find yourself in. Paying the mugger in the Tails world is throwing good money after bad. You cannot influence the past prediction.
  *   **Weakness:** They are **dynamically inconsistent**. Before the coin flip, they wish to pre-commit to paying. After the coin flip, they renege. This makes them vulnerable to "money pumps" where they pay to make pre-commitments they later abandon.

  **The Updateless View (FDT/UDT): The View from the Algorithm**
  *   **The Counterfactual:** Defined by logical dependence between the output of the decision algorithm and the predictor's simulation. The Tails world and the Heads world are logically linked by the fact that the *same* decision procedure runs in both.
  *   **The Goal:** Maximize expected utility from the perspective of the agent *before* specific observations are made (the "prior").
  *   **The Claim:** Rationality is about winning. If you refuse the mugger, you are the kind of agent who doesn't get the \$10,000 in the Heads world. You lose the game by being the sort of person who loses the game.
  *   **Weakness:** They can appear **locally irrational**. In XOR Blackmail, holding the letter, they refuse to pay, seemingly inviting disaster, because their logic dictates that if they were the "paying type," the letter wouldn't exist. This feels like magical thinking to the updateful.

  **The "Cherry-Picking" Charge**
  Critics argue FDT is ad hoc because it pays in Mugging (where CDT doesn't) but refuses in Blackmail (where CDT does).
  *   **Rebuttal:** FDT proponents argue this isn't cherry-picking outcomes; it's consistently applying one metric: **Ex-Ante Expected Utility.**
      *   In Mugging: The policy "Pay if Tails" yields higher ex-ante value (\$9,900 EV) than "Don't Pay" (\$0 EV).
      *   In Blackmail: The policy "Don't Pay" yields higher ex-ante value (No letter sent, \$0 loss) than "Pay" (Letter sent, -\$1,000 loss).
  *   **The Real Conflict:** The critic cares about **Ex-Post Utility** (how much money do I have *now*?). The FDT proponent cares about **Ex-Ante Utility** (how much money would my algorithm have won *on average*?).

  ### 2. Is Your Hypothesis Right?

  **Yes, but with a caveat.**
  You identify the split as "Act vs. Policy." A more precise formulation is **"Information-Conditioned Optimization" vs. "Logical-Function Optimization."**

  The updateful side treats information (the coin is Tails) as a constraint that updates the probability space. The updateless side treats information as an output of the logical function that determines the world state.

  The disagreement is indeed about counterfactuals, specifically: **What is held fixed when we imagine doing otherwise?**
  *   **CDT:** Holds the past (the prediction) fixed.
  *   **FDT:** Holds the logical output of the algorithm fixed (which implies the prediction changes if the decision changes).

  ### 3. Paths to Progress

  The debate has stagnated because both sides are normatively correct within their own frames. Progress requires moving beyond abstract thought experiments.

  #### A. Realistic Embedding (The AI Safety Angle)
  This is the most fertile ground for resolution. Perfect predictors (Omega) do not exist for humans. However, **logical correlations** do exist for software.
  *   **Progress Condition:** If we can demonstrate that Updateless Decision Theory is necessary for **self-modifying AI** or **multi-agent AI simulations**, the debate shifts from philosophy to engineering.
  *   **Example:** If two AI agents play a Prisoner's Dilemma and can read each other's source code, CDT defects (dominant strategy). FDT cooperates (recognizing logical correlation). If cooperation yields higher rewards, FDT is empirically superior *in that domain*.
  *   **Verdict:** Progress here would look like a theorem showing that any agent capable of self-modification will modify itself to be Updateless. This validates FDT as the theory of *ideal agents*, even if not *human agents*.

  #### B. A New Distinction: Prescriptive vs. Ideal Theory
  The community should formally split Decision Theory into two distinct fields:
  1.  **Ideal Agent Design (FDT/UDT):** What algorithm should we build if we want to maximize utility across all possible worlds, including those with predictors or logical twins?
  2.  **Human Action Guidance (CDT/EDT):** What heuristic should a biological human use, given that we cannot actually pre-commit, suffer from hyperbolic discounting, and do not face perfect predictors?

  **Why this helps:** It dissolves the "cherry-picking" charge. FDT is right about what a *winning agent* looks like. CDT is right about what a *human in the moment* feels compelled to do. The friction arises when we try to use FDT as a self-help guide for humans (which causes anxiety) or CDT as a blueprint for AI (which creates uncooperative agents).

  #### C. Formal Results: The "Money Pump" vs. The "Blackmail Immunity"
  We need formal results that quantify the cost of each approach.
  *   **Updateful Cost:** Quantify the expected loss of being dynamically inconsistent (e.g., how much would a CDT agent pay to bind their future self in Mugging scenarios?).
  *   **Updateless Cost:** Quantify the vulnerability to "counterfactual extortion." If an FDT agent knows that being the type who pays invites blackmail, they don't pay. But what if the blackmailer threatens something worse than the cost of pre-commitment?
  *   **Progress:** A formal bound showing under what conditions (e.g., predictor accuracy $< 99\%$) FDT collapses into CDT. This would ground the theory in empirical reality rather than Platonic perfection.

  ### 4. Conclusion: Split and Pursue Separately

  The two questions **should be split apart.**

  The LessWrong community has been trying to find a "One True Decision Theory" that satisfies both **Reflective Consistency** (I want to be this agent) and **Dynamic Consistency** (I want to do this act now). The theorem to be proven is likely that **these two are incompatible in the presence of logical uncertainty.**

  *   **For AI Alignment:** Pursue Updateless Decision Theory. We are designing the source code; we are in the "Ex-Ante" position. We want our AI to pay the Counterfactual Mugger because that makes it a trustworthy partner in logical trade.
  *   **For Human Normativity:** Acknowledge Updateful Decision Theory. Humans cannot logically bind their future selves. Telling a human to "pay the mugger" because of a counterfactual branch they can never access is psychologically untenable and arguably irrational for a finite, time-bound creature.

  **Final Verdict:** Your hypothesis is correct. The stalemate is a category error. The "Act" question belongs to psychology and traditional economics. The "Policy" question belongs to computer science and logic. Progress lies not in convincing one side they are wrong, but in formally demarcating the domains where each optimization target is the correct one to use.
