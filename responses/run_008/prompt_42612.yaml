prompt: |-
  I have been reading a popular history of religious toleration, aimed at general readers, that pauses in its chapter on sixteenth-century France to discuss Montaigne's essay usually translated as "Of Cannibals" (1580), and its account of the Tupinambá people of coastal Brazil. The author's summary runs roughly as follows. Montaigne's essay is the birth certificate of cultural relativism: Montaigne's point is that no custom can be criticized from outside the culture that practices it, because the only standard any of us has for judging is the custom of our own country, so calling another people barbarous means nothing more than that they differ from us. His portrait of the Tupinambá is therefore of genuinely better human beings, closer to natural virtue, people whom contact with civilization has not yet corrupted, and he writes of them the way a later age would write of the noble savage. He knows whereof he speaks, having gathered his material from a servant who had spent more than a decade in Brazil and from a conversation, through an interpreter, with some Tupinambá men who had been brought to Rouen to be shown to Charles IX. The essay's centerpiece is its most famous comparison: it is not the Brazilians roasting and eating a dead enemy who are barbarous, but the French, who under the name of justice and piety torture a living man to death and tear him apart, and the point of the provocation is that by his own principle Montaigne cannot rank the two. The chapter ends by drawing the lesson that any cross-cultural criticism, whether from missionaries then or from human-rights advocates now, is incoherent on Montaigne's premises, since there is no standpoint outside a given society's customs from which one could be addressed. A friend who studied Montaigne at university tells me that enlisting him as the founder of relativism is an old mistake, but she couldn't articulate what the mistake actually is, and I couldn't follow her hand-waving about the difference between attacking custom and attacking standards. Please audit the summary for me. Go through it claim by claim: which parts would a Montaigne scholar accept as it stands, which are simplifications of things he does say, and which are misrepresentations he explicitly or implicitly rejects? In particular, I would like to know whether the book's picture of his evidence base is fair, given that the essay opens with an anecdote about Pyrrhus sizing up a Roman army and draws the moral that we should judge by the eye of reason rather than by common report, and given that Montaigne compares the Tupinambá to Plato's ideal city rather than to any modern utopia. And finally: setting aside whatever is wrong in the summary, does the chapter's conclusion actually follow from the parts that are accurate? If Montaigne really does rank cruelties as he does in the torture comparison, what does that leave of the claim that he took custom to be the only measure?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A popular history of religious toleration (unnamed) discussing Montaigne's "Of Cannibals" (1580).
      *   **Task:** Audit the book's summary of Montaigne's essay claim by claim.
      *   **Specific Questions:**
          *   Which parts would a scholar accept?
          *   Which are simplifications?
          *   Which are misrepresentations?
          *   Evaluate the evidence base (Pyrrhus anecdote, Plato comparison).
          *   Evaluate the logical conclusion (does the anti-criticism stance follow from the torture comparison?).
      *   **Key Conflict:** The book claims Montaigne is the "father of cultural relativism" (no outside standard, custom is king). The friend (student of Montaigne) says this is a mistake but couldn't explain why. The user wants to understand the nuance between "attacking custom" and "attacking standards."

  2.  **Deconstruct the Book's Summary (Claim by Claim):**

      *   *Claim 1: "Montaigne's essay is the birth certificate of cultural relativism."*
          *   *Scholarly View:* This is the core controversy. Montaigne is often *cited* as a precursor, but labeling him a strict "cultural relativist" (in the modern anthropological or philosophical sense) is anachronistic and reductive. He uses cultural difference to critique *his own* culture, not to say all cultures are equally valid morally.
          *   *Verdict:* Simplification/Misrepresentation. He uses relativism as a *tool*, not a *doctrine*.

      *   *Claim 2: "No custom can be criticized from outside the culture... because the only standard any of us has for judging is the custom of our own country."*
          *   *Scholarly View:* Montaigne explicitly argues *against* this in the essay. He posits a "law of reason" or "natural law" that transcends custom. He criticizes French customs using a higher standard (reason/nature).
          *   *Verdict:* Misrepresentation. This contradicts the essay's explicit moral.

      *   *Claim 3: "Calling another people barbarous means nothing more than that they differ from us."*
          *   *Scholarly View:* This is a famous quote ("each man calls barbarism whatever is not his own practice"). However, the book takes this descriptive observation and turns it into a prescriptive rule (therefore we *cannot* judge). Montaigne agrees we *do* this, but argues we *shouldn't* rely on it.
          *   *Verdict:* Simplification. It captures the quote but misses the argumentative context.

      *   *Claim 4: "His portrait of the Tupinambá is therefore of genuinely better human beings, closer to natural virtue... noble savage."*
          *   *Scholarly View:* Montaigne does praise them for living according to "nature" and "reason." However, he doesn't idealize them completely (he mentions their warfare and cannibalism). The "Noble Savage" label is a later 18th-century construct projected back onto him. He sees them as *less corrupted*, not perfect.
          *   *Verdict:* Simplification. "Noble Savage" is anachronistic, though the "natural virtue" part is accurate to his text.

      *   *Claim 5: "He knows whereof he speaks... servant... conversation... Tupinambá men in Rouen."*
          *   *Scholarly View:* This is factually accurate regarding his sources. He is careful about his evidence, distinguishing between hearsay and what he saw/heard directly.
          *   *Verdict:* Accurate.

      *   *Claim 6: "The essay's centerpiece... it is not the Brazilians... who are barbarous, but the French... who... torture a living man."*
          *   *Scholarly View:* Accurate. This is the climactic comparison.
          *   *Verdict:* Accurate.

      *   *Claim 7: "By his own principle Montaigne cannot rank the two."*
          *   *Scholarly View:* **Major Error.** Montaigne *does* rank them. He explicitly says the French acts are *worse*. This contradicts the book's claim that he believes no ranking is possible. He uses a universal standard (cruelty vs. natural necessity) to rank them.
          *   *Verdict:* Misrepresentation/Logical Contradiction.

      *   *Claim 8: "Any cross-cultural criticism... is incoherent on Montaigne's premises, since there is no standpoint outside a given society's customs."*
          *   *Scholarly View:* This is the logical conclusion of the book's (flawed) interpretation. Since Montaigne *does* criticize French customs from the standpoint of "Reason/Nature," this conclusion is false regarding Montaigne.
          *   *Verdict:* Misrepresentation.

  3.  **Address the Specific Evidence Questions:**
      *   *Pyrrhus/Roman Army Anecdote:* The book ignores this. This anecdote establishes that one should judge by "reason" and direct observation, not "common report" or habit. It undermines the "custom is king" thesis.
      *   *Plato's Ideal City:* Montaigne compares the Tupinambá laws to Plato's *Republic*. This implies a universal standard of political virtue, not just local custom. If they match Plato's ideal, they match a trans-historical standard, not just a tribal one.
      *   *Verdict:* The book's picture of the evidence base is selective. It highlights the ethnographic sources but ignores the philosophical framing (Pyrrhus, Plato) that establishes the universal standard of Reason.

  4.  **Address the Logical Conclusion (The "Friend's" Point):**
      *   *The Core Paradox:* If Montaigne says "Custom is the only measure," how can he say "French torture is worse than Brazilian cannibalism"?
      *   *Resolution:* Montaigne distinguishes between *Custom* (habit, usage) and *Reason/Nature* (universal moral law). He attacks *Custom* when it violates *Reason*.
      *   *The Book's Error:* It conflates Montaigne's *description* of how people judge (by custom) with his *prescription* of how they *should* judge (by reason).
      *   *Does the conclusion follow?* No. If he ranks the cruelties (which he does), he admits a standpoint outside local custom exists (Reason/Humanity). Therefore, cross-cultural criticism is *possible* and *encouraged* if based on that universal standard.

  5.  **Drafting the Response:**
      *   *Structure:*
          1.  Introduction: Validate the friend's intuition. The "Relativist Montaigne" is a common but flawed reading.
          2.  Claim-by-Claim Audit: Break down the summary into bullet points (Accurate, Simplified, False).
          3.  The Evidence Base: Discuss Pyrrhus and Plato to show the universalist framework.
          4.  The Logical Contradiction: Address the torture comparison vs. the relativist conclusion. Explain the Custom vs. Reason distinction.
          5.  Conclusion: Summarize the true lesson of the essay (self-critique via universal reason, not immunity from critique).

      *   *Tone:* Scholarly but accessible (matching the user's engagement level).
      *   *Key Concepts to Define:* Cultural Relativism (descriptive vs. normative), Natural Law, Custom vs. Reason.

      *(Self-Correction during drafting)*: I need to be careful not to say Montaigne is a modern Human Rights advocate. He isn't. He believes in natural law, but his specific content of "reason" is Stoic/Christian/Humanist. The key is that he believes *there is a standard*, not necessarily what that standard precisely entails in modern terms. The book claims there is *no* standard. That's the falsification.

      *Refining the "Noble Savage" point:* Scholars debate this. Some say he invented it; others say he's more nuanced. I should characterize it as "proto-Noble Savage" but emphasize that for Montaigne, their virtue lies in *conformity to nature*, not exoticism.

      *Refining the "Servant/Rouen" point:* The book is right about the sources, but wrong about how Montaigne *uses* them. He uses them not to say "this is their truth," but "this is evidence for *our* judgment."

      *Final check on the "Friend's Hand-waving":* The user mentioned the friend talked about "attacking custom vs. attacking standards." I need to make sure I explain this clearly. Montaigne attacks *blind adherence to custom* by appealing to a *higher standard (Reason)*.

  6.  **Final Polish:** Ensure the distinction between *Descriptive Relativism* (people *do* judge by custom) and *Normative Relativism* (people *ought not* judge other cultures) is clear. Montaigne accepts the former to argue against it, while the book claims he advocates the latter.

      *(Wait, one nuance)*: Does Montaigne believe in "Human Rights"? No. But the book claims cross-cultural criticism is *incoherent*. Montaigne proves it is coherent by *doing* it. I must emphasize that.

      *Let's structure the audit clearly.*
      1. Introduction.
      2. Audit of Claims (True/False/Nuanced).
      3. The Evidence Base (Pyrrhus/Plato).
      4. The Logical Core (Custom vs. Reason).
      5. Conclusion.

      *Ready to write.*
answer: |-
  Your friend is correct: enlisting Montaigne as the father of modern cultural relativism is one of the most persistent and frustrating errors in the history of ideas. While Montaigne is certainly a skeptic, and while he uses cultural difference to destabilize European arrogance, he does not argue that all moral standards are local or that cross-cultural judgment is impossible. In fact, he argues the opposite.

  The popular history you are reading commits a category error: it confuses Montaigne's **description** of human prejudice (we *tend* to judge by custom) with his **prescription** for moral reasoning (we *ought* to judge by reason).

  Here is an audit of the book's summary, claim by claim, followed by an analysis of the evidence base and the logical conclusion.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1: "Montaigne's essay is the birth certificate of cultural relativism."**
  *   **Verdict:** **Misrepresentation.**
  *   **Scholar's View:** This is an anachronism. "Cultural relativism" is a 20th-century anthropological concept (associated with Boas or Benedict) positing that moral systems are culturally determined and equally valid. Montaigne is a Renaissance Humanist and Stoic. He believes in a universal "Law of Reason" or "Natural Law." He uses the Tupinambá not to say "their way is just as good as ours," but to say "their way aligns better with universal Reason than ours does."

  **Claim 2: "No custom can be criticized from outside the culture... because the only standard any of us has for judging is the custom of our own country."**
  *   **Verdict:** **Misrepresentation.**
  *   **Scholar's View:** Montaigne explicitly writes that this *is* how people behave, but that it is a failure of judgment. He writes: *"Each man calls barbarism whatever is not his own practice."* He states this as a psychological fact, not a moral rule. His entire essay is an attempt to break this cycle by appealing to a standard *outside* custom (Nature/Reason). If he believed custom was the only standard, he could not criticize the French Wars of Religion, which he does vehemently.

  **Claim 3: "Calling another people barbarous means nothing more than that they differ from us."**
  *   **Verdict:** **Simplification.**
  *   **Scholar's View:** This captures the famous quote but strips the context. Montaigne argues that the word "barbarous" *should* mean nothing more than difference, but he laments that it is used to mean "inferior." He wants to reclaim the term to show that the Europeans are the true barbarians. He is not saying "difference is all there is"; he is saying "your definition of barbarism is wrong."

  **Claim 4: "His portrait of the Tupinambá is... of genuinely better human beings, closer to natural virtue... the noble savage."**
  *   **Verdict:** **Simplification (with a grain of truth).**
  *   **Scholar's View:** Montaigne does argue they are "closer to natural virtue" because they have not been corrupted by the "artifice" of European civilization. However, the label "Noble Savage" is an 18th-century invention (Dryden, Pope, Rousseau) projected backward. Montaigne does not idealize them as perfect; he notes their warfare and cannibalism. He praises them not for being exotic, but for being *rational* in a Stoic sense (courage, loyalty, lack of greed).

  **Claim 5: "He knows whereof he speaks... servant... conversation... Tupinambá men in Rouen."**
  *   **Verdict:** **Accurate.**
  *   **Scholar's View:** Montaigne is meticulous about his sources. He distinguishes between what he has been told (the servant) and what he has witnessed personally (the meeting in Rouen). He even notes the linguistic barrier and the potential for mistranslation. This care for evidence actually undermines the relativist reading: he is gathering data to make a factual judgment, not just expressing a subjective viewpoint.

  **Claim 6: "The essay's centerpiece... it is not the Brazilians... who are barbarous, but the French, who... torture a living man."**
  *   **Verdict:** **Accurate.**
  *   **Scholar's View:** This is the climax of the essay. Montaigne argues that eating a dead body (cannibalism) is less cruel than torturing a living body (European execution methods).

  **Claim 7: "By his own principle Montaigne cannot rank the two."**
  *   **Verdict:** **False.**
  *   **Scholar's View:** This is the critical error in the book's logic. Montaigne *does* rank them. He explicitly states the French acts are *worse*. He writes: *"I think there is more barbarism in eating a man alive than in eating him dead."* If he were a true relativist, he would have to say, "To them, torture is fine; to us, cannibalism is fine; neither can judge." Instead, he judges. He ranks them based on the amount of suffering and the violation of natural bonds.

  **Claim 8: "Any cross-cultural criticism... is incoherent on Montaigne's premises, since there is no standpoint outside a given society's customs."**
  *   **Verdict:** **False.**
  *   **Scholar's View:** Since Montaigne *performs* cross-cultural criticism (criticizing France from the standpoint of Brazilian "nature," and criticizing Brazil from the standpoint of "reason"), his premises clearly allow for it. The book's conclusion is logically incompatible with the text it summarizes.

  ---

  ### Part 2: The Evidence Base (Pyrrhus and Plato)

  You asked whether the book's picture of his evidence base is fair, given the omissions you noted. The omissions are significant because they reveal the universal standard Montaigne is using.

  **1. The Anecdote of Pyrrhus**
  The essay opens with King Pyrrhus looking at the Roman army. He notes their orderly formation and says, "These barbarians have nothing barbarous about them."
  *   **Why it matters:** This sets the epistemological frame. Montaigne is teaching the reader to **trust the eye of reason over the ear of rumor.** Pyrrhus did not judge the Romans by Macedonian custom; he judged them by the universal standard of military discipline and order.
  *   **The Book's Error:** By ignoring this, the book implies Montaigne thinks we are trapped in our own perspective. The Pyrrhus anecdote proves Montaigne believes we *can* step outside our perspective if we use Reason.

  **2. The Comparison to Plato**
  Montaigne writes that the Tupinambá society resembles Plato's *Republic* more than any modern European state.
  *   **Why it matters:** Plato's *Republic* is not a "local custom"; it is a philosophical ideal of Justice and Order derived from Reason. By comparing the Tupinambá to Plato, Montaigne is elevating them to a **trans-historical, universal standard.** He is not saying "They are good by Brazilian standards." He is saying "They are good by the standards of Philosophy itself."
  *   **The Book's Error:** If Montaigne were a relativist, he would compare the Tupinambá to other tribes. Comparing them to Plato implies there is a single ladder of virtue that all humans can climb, regardless of culture.

  ---

  ### Part 3: The Logical Conclusion (Custom vs. Standards)

  Finally, you asked: *If Montaigne really does rank cruelties as he does in the torture comparison, what does that leave of the claim that he took custom to be the only measure?*

  It leaves nothing. The claim collapses. This is where your friend's "hand-waving" about "attacking custom vs. attacking standards" needs to be articulated.

  **The Distinction:**
  *   **Custom (Usage/Habit):** Local, arbitrary, variable. (e.g., "We wear black for mourning," "We eat bread.")
  *   **Standard (Reason/Nature):** Universal, constant, binding. (e.g., "Unnecessary cruelty is wrong," "Betrayal is vicious.")

  **Montaigne's Argument:**
  1.  **Observation:** Humans usually confuse Custom with Standard. We think our local habits are universal laws. (This is the "relativist" observation the book latches onto).
  2.  **Correction:** We must separate them. We must use Reason to judge Custom.
  3.  **Application:** When we look at the Tupinambá, their "custom" of cannibalism shocks us. But when we apply the **Standard of Reason** (specifically, the measure of cruelty and necessity), their custom is *less* vicious than the French "custom" of judicial torture.
  4.  **Conclusion:** The French are not wrong because they violate Brazilian custom; they are wrong because they violate **Human Nature.**

  **Why the Book's Conclusion Fails:**
  The book concludes that "human-rights advocacy is incoherent" on Montaigne's premises. This is the exact opposite of the truth.
  *   Montaigne's essay is essentially a **human rights argument.** He argues that there is a baseline of human dignity (natural law) that transcends national borders.
  *   Because this baseline exists, a missionary *or* a human rights advocate *can* coherently criticize a society. They are not criticizing "difference"; they are criticizing a violation of the universal law of reason.
  *   Montaigne criticizes the Catholic Inquisition not because it is "French" and he prefers "Brazilian," but because it violates the universal prohibition against torturing the soul and body.

  ### Summary for Your Reading
  The author of the history book has taken Montaigne's **skeptical method** (questioning our own assumptions) and turned it into a **dogmatic conclusion** (no assumptions can be judged).

  *   **Accept:** Montaigne uses the Tupinambá to shame Europe. He values their "naturalness." He relies on specific witnesses.
  *   **Reject:** Montaigne is a relativist. He believes custom is the only standard. He thinks cross-cultural judgment is impossible.
  *   **The Nuance:** Montaigne believes that **Nature** is the standard, and **Custom** is often a corruption of Nature. He uses the "exotic" not to validate relativism, but to reveal that Europe has lost its way relative to the universal standard of Reason.

  Your friend was trying to tell you that Montaigne attacks **Custom** (blind habit) by appealing to **Standards** (Reason/Nature). The book claims he attacks **Standards** by appealing to **Custom**. The book has it backward.
