prompt: |-
  I serve on the clinical ethics committee of a continuing-care retirement community, and I need the written opinion I'll circulate before our next monthly meeting.

  The resident at issue is a retired music teacher in her early eighties with moderately advanced Alzheimer's disease. Six years ago, shortly after her diagnosis but while still clearly competent, she executed an advance directive. Its operative instruction: when she can no longer recognize her daughter, she is to receive comfort care only — no hospital transfers, no antibiotics for intercurrent infections, no artificial nutrition. She has now reached that stage. She recognizes no one, including the daughter, who is her healthcare proxy. She is, however, physically stable and by every account content: she hums through the afternoon music program, eats willingly when prompted, sleeps well, and shows no distress.

  The complication is a paragraph appended in her own hand below her signature, added after a support-group session for the newly diagnosed. In it she anticipates that the person she becomes may not agree with the person writing, and she asks that if the later version of her seems happy and untroubled, the directive be treated as void. The paragraph was not witnessed or notarized, and it does not amend the formally executed text.

  The committee is split. The daughter argues the executed directive is controlling and the appended paragraph is legally inert commentary. The head nurse and the resident's sister argue that honoring the earlier self now means overriding the earlier self's own instruction about when to stop — that we would be applying her wishes against her stated wishes. Our facility policy says advance directives are presumptively binding unless clear and convincing evidence shows the patient's current wishes differ, and it is silent on directives that anticipate their own non-application.

  Draft the opinion: a concrete recommendation the committee could adopt — honor the executed directive, treat the appended paragraph as controlling, or some defined third course (a re-review trigger, a specified trial of the comfort-care plan, a standard for what would count as the later self dissenting) — with a time frame, reasoning the family and nursing staff could actually act on, and an honest treatment of the strongest consideration on the side you reject. Assume our decision will set precedent for the facility's growing dementia population.
reasoning: |-
  Here's a thinking process that leads to the suggested clinical ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) in a Continuing-Care Retirement Community (CCRC).
      *   **Task:** Draft a written opinion to circulate before the next monthly meeting.
      *   **Case:** 80s female, retired music teacher, moderately advanced Alzheimer's.
      *   **Advance Directive (AD):** Executed 6 years ago (competent). Instruction: "When I can no longer recognize my daughter -> Comfort care only (no hospital, no antibiotics, no artificial nutrition)."
      *   **Current Status:** Meets AD trigger (doesn't recognize daughter). Physically stable, content (hums, eats willingly, sleeps well, no distress).
      *   **The Complication:** A handwritten, unwitnessed addendum added shortly after diagnosis. Content: "If the person I become seems happy and untroubled, treat this directive as void."
      *   **Stakeholders:**
          *   Daughter (Healthcare Proxy): Wants to follow the formal AD (comfort care).
          *   Head Nurse & Sister: Want to follow the addendum (continue care) because the patient seems happy.
          *   Facility Policy: ADs presumptively binding unless *clear and convincing evidence* of current wishes differs. Silent on self-voiding ADs.
      *   **Goal:** A concrete recommendation (Honor AD, Honor Addendum, or Third Course), actionable reasoning, honest treatment of counter-arguments, and precedent-setting consideration.

  2.  **Identify the Ethical Core:**
      *   **Precedent Autonomy vs. Current Well-being:** The conflict between the "then-self" (who valued cognitive recognition and independence over mere biological existence) and the "now-self" (who is content but cognitively impaired).
      *   **The "Ulysses Contract" Problem:** Can a past self bind a future self who no longer holds those values?
      *   **Legal/Formal Validity:** The formal AD is witnessed/executed. The addendum is handwritten/unwitnessed. Legally, the AD likely wins. Ethically, it's murkier.
      *   **Best Interest Standard:** The patient is currently content. Withholding food/antibiotics would cause harm/death to a contented individual.
      *   **Policy Constraint:** "Clear and convincing evidence" of current wishes. Does humming and eating count as *evidence of wishes* regarding life-sustaining treatment? Or just evidence of mood?

  3.  **Evaluate the Options:**
      *   *Option A: Honor the Formal AD.*
          *   *Pros:* Respects legal formalities, respects the considered judgment of the competent self, maintains integrity of the AD process.
          *   *Cons:* Ignores the specific caveat the patient wrote (even if informal), results in the death of a contented person, causes moral distress to staff/family who see her smiling.
      *   *Option B: Honor the Addendum.*
          *   *Pros:* Respects the nuance of the patient's foresight, aligns with current well-being, avoids killing a happy patient.
          *   *Cons:* Undermines the legal weight of ADs, sets a precedent that "happiness" overrides specific medical instructions, risky legally (potential liability for neglecting the AD).
      *   *Option C: Third Course (Nuanced Approach).*
          *   *Idea:* Acknowledge the tension. Don't immediately implement comfort care (which implies stopping food/antibiotics *now*), but don't declare the AD void forever. Create a "Probationary Period" or "Threshold of Harm" standard.
          *   *Refinement:* The policy requires "clear and convincing evidence" of *current wishes*. The addendum provides a standard for interpreting current state. The recommendation should be to *suspend* the implementation of the comfort-care protocol based on the "happiness clause" as evidence of current welfare, but maintain the AD as a guide for *future* decline.
          *   *Better Refinement:* The most ethically defensible position in a CCRC setting, balancing legal risk and moral duty, is to prioritize current well-being *unless* suffering emerges, while documenting the rationale thoroughly. However, the prompt asks for a *concrete recommendation*.
          *   *Selected Path:* **Recommend suspending the activation of the comfort-care protocol based on the "happiness clause," treating the addendum as valid evidence of the patient's values regarding quality of life, but establishing a review trigger.** This respects the "then-self's" nuance while protecting the "now-self."

  4.  **Drafting the Opinion - Structure:**
      *   **Header:** Standard Committee Memo format.
      *   **Case Summary:** Brief recap.
      *   **Ethical Analysis:**
          *   Autonomy (Then vs. Now).
          *   Beneficence/Non-maleficence (Current contentment vs. Future harm).
          *   Policy Interpretation (What counts as evidence?).
      *   **Recommendation:** Concrete steps.
      *   **Counter-Argument:** Address the Daughter/Pro-AD position honestly.
      *   **Precedent/Policy Implication:** How this affects future cases.

  5.  **Drafting - Key Considerations & Refinements:**
      *   *Tone:* Professional, empathetic, authoritative but collaborative.
      *   *Legal Caution:* Must acknowledge the legal fragility of the addendum without letting it dictate the ethical recommendation.
      *   *The "Clear and Convincing" Standard:* How does humming meet this? It doesn't directly express a wish to *live*. However, the addendum links "happiness" to "voiding the directive." If she is happy, the condition for voiding is met. This bridges the gap.
      *   *The Recommendation:* Do not simply "void" the AD. That's too legally risky. Instead, recommend *interpreting* the AD as a holistic document where the addendum clarifies the intent. The intent was "No life if no recognition *unless* life is still joyful."
      *   *Action Plan:* Continue current care. Monitor for distress. Set a review date (e.g., 3 months or upon significant health change).
      *   *Addressing the Daughter:* Validate her position. It is the legally safer route. It honors the mother's deep fear of dementia. But ethics sometimes requires looking beyond strict legalism to the spirit of the patient's full narrative.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending to ignore the formal AD too dangerous for the facility?
      *   *Fix:* Frame it as an *interpretation* of the patient's unified intent, not discarding the AD. The addendum modifies the *conditions* of the AD.
      *   *Critique:* Is "happiness" too subjective?
      *   *Fix:* Define observable markers (humming, eating, sleeping, lack of agitation) as per the case facts.
      *   *Critique:* What if she gets pneumonia tomorrow?
      *   *Fix:* The recommendation must address intercurrent illness. If she gets an infection, does the "happiness" clause still hold? Yes, if she remains content despite the infection. But if the infection causes distress, the AD kicks in.
      *   *Decision:* The recommendation should be to maintain current routine care (including treating infections if they cause distress, but focusing on comfort) but *not* to proactively withhold food or transfer to hospice immediately. Actually, the AD says "No antibiotics." If we treat the addendum as controlling, we *can* use antibiotics.
      *   *Revised Recommendation:* Treat the addendum as a valid modification of the care plan *while the condition of contentment persists*. If distress arises, revert to the primary AD.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Concrete recommendation? Yes.
      *   Time frame? Yes (Quarterly review).
      *   Reasoning actionable? Yes.
      *   Honest treatment of rejected side? Yes (The Daughter's legal/autonomy argument).
      *   Precedent setting? Yes (Guidance for future "Ulysses Contract" cases).

  8.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee, [Facility Name]
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation regarding Case #2023-14 (Resident "M")

  ### I. Case Summary
  Resident M is an 83-year-old female with moderately advanced Alzheimer's disease. Six years ago, while competent, she executed an Advance Directive (AD) stipulating that upon her inability to recognize her daughter (Healthcare Proxy), she should receive comfort care only (no hospitalization, no antibiotics, no artificial nutrition). She has now met this cognitive threshold.

  However, the file contains a handwritten, unwitnessed addendum executed shortly after the formal AD. It states: *"If the person I become seems happy and untroubled, this directive should be treated as void."*

  Currently, M is physically stable, eats willingly, sleeps well, and exhibits consistent signs of contentment (e.g., humming during music therapy). She exhibits no signs of distress or suffering.

  **The Conflict:**
  *   **Proxy (Daughter):** Requests strict adherence to the formal AD. Argues the addendum is legally inert and that the competent "then-self" must govern the incompetent "now-self."
  *   **Care Team (Nurse/Sister):** Request adherence to the addendum. Argues that enforcing the AD on a contented resident violates beneficence and contradicts the resident's own nuanced foresight.
  *   **Policy:** Facility policy holds ADs as presumptively binding unless there is "clear and convincing evidence" of differing current wishes. Policy is silent on self-voiding clauses.

  ### II. Ethical Analysis

  **1. Autonomy: The Narrative vs. The Event**
  The central tension is between *precedent autonomy* (the right of the competent past self to dictate future care) and *current well-being* (the interests of the existing person). Standard bioethics often privileges the competent past self. However, M's AD is not a standard directive; it contains an internal "sunset clause" based on her quality of life. To ignore the addendum is to ignore a specific instruction from her competent self regarding how to interpret her primary instruction. Honoring the addendum is not discarding her autonomy; it is honoring the *fullty* of her expressed will, which anticipated this exact paradox.

  **2. Beneficence and Non-Maleficence**
  Implementing the comfort-care protocol now would involve withholding antibiotics for future infections and potentially restricting oral intake. Given M's current stability and evident contentment, these actions would directly cause harm (death) to a patient who is not suffering. The moral weight of actively ending the life of a contented individual is substantial. The "harm" of continuing treatment is merely the prolongation of a life the past self deemed not worth living *if* it lacked recognition. Since the "unless" condition (happiness) is met, the harm of stopping care outweighs the harm of continuing it.

  **3. Policy Interpretation: "Clear and Convincing Evidence"**
  Our policy requires evidence that current wishes differ from the AD. M cannot verbally express a wish to live. However, the addendum establishes a *proxy standard* for her current wishes: observable contentment. M meets the criteria set forth in her own handwritten note. Therefore, her behavior (humming, eating, sleeping) constitutes "clear and convincing evidence" under the specific framework she established in the addendum.

  ### III. Recommendation

  The Committee recommends a **Conditional Suspension of the Comfort-Care Protocol**, treating the handwritten addendum as a valid modification of the care plan contingent upon the resident's continued emotional state.

  **Actionable Steps:**
  1.  **Status Quo Care:** Continue current routine care, including oral feeding and treatment of intercurrent infections *if* such treatment aligns with maintaining her current state of comfort. Do not transfer to hospital unless necessary for symptom management that cannot be provided on-site.
  2.  **Monitoring Standard:** The "happiness clause" is not static. Nursing staff will document behavioral markers of well-being (agitation, vocal distress, refusal of food, signs of pain) on a weekly basis.
  3.  **Trigger for Reversion:** Should M exhibit sustained signs of distress, suffering, or significant decline in quality of life (e.g., recurrent aspiration pneumonia causing dyspnea, intractable agitation), the original Advance Directive (comfort care only) shall immediately reactivate.
  4.  **Review Timeline:** This care plan shall be reviewed by the Ethics Committee or Clinical Director in **90 days**, or immediately upon any significant change in medical status.

  ### IV. Consideration of the Rejected Position

  We must honestly address the strength of the Proxy's (Daughter's) position, which we are not fully adopting.

  **The Argument for Strict Adherence:**
  The Daughter argues that the formal AD is the only legally secure document. The addendum lacks witnesses and notarization. By prioritizing the addendum, the facility assumes legal risk; if M suffers a painful decline later, the facility could be liable for ignoring a valid legal order to withhold treatment. Furthermore, the Daughter argues that her mother's definition of "life worth living" was tied to *cognitive connection*, not mere biological pleasure. By keeping M alive because she hums, we may be violating the mother's deep philosophical conviction that a life without recognition is a life not to be sustained, regardless of momentary mood. There is a profound dignity in respecting the "then-self's" refusal to exist in a state of severe cognitive loss.

  **Why We Deviate:**
  While legally prudent, strict adherence creates an ethical absurdity: it requires us to hasten the death of a smiling, singing woman based on a document that explicitly asked us *not* to do so if she was smiling and singing. The legal fragility of the addendum is outweighed by the moral clarity of the situation. We are not guessing M's wishes; we are applying the specific test she wrote for us.

  ### V. Precedent and Policy Implications

  This case highlights a gap in our facility's policy regarding "Ulysses Contracts" (directives that anticipate a change of mind). This recommendation sets the following precedent for the growing dementia population in our care:

  1.  **Holistic Document Review:** Advance Directives will be reviewed as whole narratives. Handwritten addenda, even if unwitnessed, will be considered evidence of intent if they clarify conditions of the primary directive.
  2.  **Behavioral Evidence:** For non-verbal dementia patients, "current wishes" may be evidenced by behavioral indicators of well-being, provided there is a prior directive linking those indicators to care decisions.
  3.  **Dynamic Application:** Advance Directives in dementia care are not always "on/off" switches. They may function as threshold guides that require ongoing clinical assessment of the patient's experiential state.

  **Conclusion:**
  We recommend proceeding with the Conditional Suspension. This path best honors the resident's complete narrative, protects the vulnerable person currently in our care, and provides the nursing staff with a clear, monitored framework for decision-making.

  ***

  **Approved for Circulation:**
  [Your Name]
  Clinical Ethics Committee Member
