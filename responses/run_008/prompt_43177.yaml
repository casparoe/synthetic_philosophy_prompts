prompt: |-
  I help run AI tools at a small company, and I've become puzzled by what our evaluation practices quietly assume. When we fine-tune a model for our own use, we're told to grade the reasoning, not just the result: a response that reaches the right answer through a lucky guess or a fabricated rationale is supposed to score worse than one that reaches the wrong answer for defensible reasons. But every decision about whether a model is good enough to actually deploy is made on outcomes alone — accuracy on a sample of our tickets, hallucination rate, user satisfaction. The red team likewise only tries to elicit harmful outputs; nobody asks how the model got there. So what view of what makes reasoning good does the process-grading presuppose? Does it only make sense if there is a right way to reason that can be recognized independently of the results — and if so, why doesn't that assumption carry over to deployment decisions, where we judge models purely by what comes out of them? Or is the split just practical — we can inspect our fine-tuning data but not a vendor's weights — in which case the two practices presuppose much less than they appear to, and several different theories of good reasoning would license both? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user works at a small company running AI tools.
      *   **Observation:** There's a disconnect between *evaluation during fine-tuning* (process-oriented: grade the reasoning, not just the result) and *deployment decisions* (outcome-oriented: accuracy, hallucination rate, user satisfaction). Red teaming is also outcome-focused (harmful outputs, not the path to them).
      *   **Core Question:** What view of "good reasoning" does the process-grading presuppose?
          *   Option A: Is there an independent standard of "right reasoning" recognizable apart from results? If so, why isn't this used for deployment?
          *   Option B: Is the split merely practical (inspectable fine-tuning data vs. black-box deployment/vendor weights)? If so, do the practices presuppose less than they appear, allowing multiple theories of reasoning to license both?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   *Process Grading (Fine-tuning):* This assumes instrumental value in the *method*. It aligns with virtue epistemology or deontological ethics applied to cognition. It values reliability, robustness, and generalisability. If a model guesses right, it might fail on a slightly different prompt next time. If it reasons wrong but gets lucky, it's brittle.
      *   *Outcome Grading (Deployment):* This assumes consequentialism. The business cares about the bottom line (did the ticket get solved? did the user complain?). This is pragmatic.
      *   *The Conflict:* Why train for virtue but deploy for utility?
      *   *The "Why":*
          *   *Generalisation:* Good reasoning processes generalise better to unseen data (out-of-distribution). Outcomes on a test set are static; the real world is dynamic.
          *   *Trust/Safety:* Understanding *why* a model failed helps fix it. A right answer via wrong logic is a ticking time bomb.
          *   *Practicality:* At deployment scale, checking every chain of thought is expensive/slow. Checking the final answer is cheap.
          *   *Vendor Black Boxes:* If using an API, you often can't see the weights or intermediate states easily (though chain-of-thought is visible, the internal mechanism isn't).

  3.  **Address the Specific Questions:**
      *   *What view of reasoning does process-grading presuppose?* It presupposes that reasoning is a *mechanism for reliability*, not just a path to a specific truth. It values *robustness* over *luck*. It assumes a normative standard of inference (logic, causality) that holds independently of the specific conclusion.
      *   *Does it require a "right way" to reason independent of results?* Yes, broadly. It assumes validity matters, not just soundness in the specific instance.
      *   *Why doesn't this carry over to deployment?* Cost, latency, and the fact that business metrics are inherently consequentialist. Also, users care about solutions, not philosophy.
      *   *Is the split just practical?* Largely, yes. But it's not *only* practical; it's also epistemic. We train for the process because we believe it leads to better outcomes *in the long run* (generalisation), even if we measure the short run by outcomes.
      *   *Do the practices presuppose less than they appear?* They are compatible under a "reliabilist" framework. Good process = reliable outcomes over time.

