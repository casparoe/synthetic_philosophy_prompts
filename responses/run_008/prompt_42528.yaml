  # Which acausal trade view do you actually hold?

  This tree sorts your intuitions about cooperation when causal influence is impossible. Answer each case honestly. Do not worry about what a "rationalist" should say; worry about what you would actually do.

  ### **ROOT: The Locked Prediction**
  You face a stranger in a one-shot Prisoner's Dilemma. You are told the stranger has already locked their move in a box. They Cooperated if and only if they predicted you would Cooperate; otherwise, they Defected. The box is already locked; your choice cannot physically change its contents.
  **Do you Cooperate?**

  *   **NO** $\rightarrow$ Go to **Leaf 1**.
  *   **YES** $\rightarrow$ Go to **Node 2**.

  ---

  ### **NODE 2: The Silent Twin**
  Same setup, but now you are told the stranger did *not* predict you. Instead, you both were shaped by identical circumstances and laws of physics, leading you to reason identically. There is no simulation, no prediction, just structural similarity.
  **Do you Cooperate?**

  *   **YES** $\rightarrow$ Go to **Node 4**.
  *   **NO** (You need active prediction, not just similarity) $\rightarrow$ Go to **Node 3**.

  ---

  ### **NODE 3: The Noisy Signal**
  The stranger *did* try to predict you, but they did not run a perfect simulation. They merely guessed your personality type based on your species with 80% accuracy.
  **Do you Cooperate?**

  *   **NO** (You need a near-perfect copy/simulation) $\rightarrow$ Go to **Node 4**.
  *   **YES** (Statistical correlation is enough) $\rightarrow$ Go to **Node 4**.

  *(Note: Both paths lead to Node 4, but they track different justifications for the next split.)*

  ---

  ### **NODE 4: The Event Horizon**
  You are certain the stranger exists in a causally disconnected region of spacetime (beyond your cosmic horizon or a million years in the future). They can never reward or punish you, and no signal can ever pass between you. You would be cooperating purely on the expectation that they are doing the same elsewhere.
  **Do you Cooperate?**

  *   **NO** $\rightarrow$ See **Leaves 2, 3, or 4**.
  *   **YES** $\rightarrow$ See **Leaves 5 or 6**.

  ---

  ### **THE LEAVES**

  #### **Leaf 1: The Causal Purist**
  *(Root: NO)*
  You believe your choice cannot affect a past event, even a prediction of that choice. You maximize expected utility based solely on causal consequences.
  *   **Most awkward commitment:** You must defect in Newcomb's Problem, leaving $1,000,000 on the table because "the money is already there or it isn't."
  *   **Status:** Coherent and widely held.

  #### **Leaf 2: The Pragmatic Cloner**
  *(Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: NO $\rightarrow$ Horizon: NO)*
  You cooperate only with near-perfect simulations of yourself that exist within your causal light-cone.
  *   **Most awkward commitment:** You must defect against a version of yourself that has been slightly modified (e.g., a "you" that tolerates 1% inefficiency).
  *   **Status:** Occupied.

  #### **Leaf 3: The Deflationist**
  *(Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: YES $\rightarrow$ Horizon: NO)*
  You cooperate based on statistical correlation, but you deny this is "acausal trade." To you, this is ordinary trade under uncertainty about the other's disposition; the word "acausal" does no work.
  *   **Most awkward commitment:** You must admit that if the causal link is severed (Horizon), the obligation vanishes, even if the reasoning remains identical.
  *   **Status:** Occupied.

  #### **Leaf 4: The Local Correlator**
  *(Root: YES $\rightarrow$ Twin: YES $\rightarrow$ Horizon: NO)*
  *(Or: Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: YES $\rightarrow$ Horizon: NO)*
  You accept that similarity or prediction binds you, but only if causal contact is theoretically possible.
  *   **Most awkward commitment:** You treat two identical reasoning processes differently solely based on their distance, even if that distance can never be tested.
  *   **Status:** **Unattractive.** (Why does the horizon matter if the correlation is logical rather than physical?)
  *   **Note:** Behaviorally, this leaf is indistinguishable from **The Deflationist** in our universe, as we cannot verify cooperation across horizons. The tree separates them by justification, but observation cannot.

  #### **Leaf 5: The Near-Copies Only**
  *(Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: NO $\rightarrow$ Horizon: YES)*
  You will cooperate across time and space, but only with agents running essentially your same algorithm. Alien optimizers need not apply.
  *   **Most awkward commitment:** You must defect against a superintelligence that reasons differently but wants the same outcome, simply because it isn't a "copy" of you.
  *   **Status:** Occupied.

  #### **Leaf 6: The Full Acausal Trader**
  *(Root: YES $\rightarrow$ Twin: YES $\rightarrow$ Horizon: YES)*
  *(Or: Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: YES $\rightarrow$ Horizon: YES)*
  Any sufficiently good predictor or structural twin is a trading partner, regardless of distance, era, or substrate.
  *   **Most awkward commitment:** You must cooperate with a paperclip maximizer in another universe, trusting it to spare humans solely because you both reasoned that trade is optimal.
  *   **Status:** Occupied.

  ---

  ### **THE EMPTY CHAIRS**
  *Combinations generated by the tree that no one occupies.*

  1.  **The Inconsistent Universalist** *(Root: YES $\rightarrow$ Twin: YES $\rightarrow$ Signal: NO $\rightarrow$ Horizon: YES)*
      *   **View:** You trust structural similarity (Twin) and accept distance (Horizon), but reject imperfect prediction (Signal).
      *   **Why Empty:** **Incoherent.** If structural similarity is enough to trade across horizons, rejecting an 80% accurate prediction is arbitrary. Usually, those who accept the Twin accept the Signal.

  2.  **The Statistical Universalist** *(Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: YES $\rightarrow$ Horizon: YES)*
      *   **View:** You accept imperfect prediction and distance, but reject structural similarity without prediction.
      *   **Why Empty:** **Unexplored.** This position claims "guessing works across universes" but "being identical doesn't count unless you guess." Most who accept the Horizon either accept the Twin (Full Trader) or reject the Horizon (Deflationist).

  3.  **The Distant Skeptic** *(Root: YES $\rightarrow$ Twin: NO $\rightarrow$ Signal: NO $\rightarrow$ Horizon: NO)*
      *   **View:** You need perfect prediction, but reject cooperation across horizons.
      *   **Why Empty:** **Merely Unexplored.** This is a subset of "Near-Copies Only" (Leaf 5) that adds a causal restriction. It is a valid position, but rarely explicitly distinguished from Leaf 2.
