          *   *Wait, this collapses the distinction.*

      *   *Better Approach:* Distinguish based on **Target of Intervention**.
          *   **Alignment:** Intervenes on the *Policy* (the mapping from input to intent/action). Goal: Change the *source* of the action.
          *   **Control:** Intervenes on the *Action Space* or *Consequences*. Goal: Change the *outcome* regardless of source.

  8.  **Drafting the Response:**
      *   **Validate:** Acknowledge the roommate is partially right (they blur in practice) but the user is also right (conceptual distinction is useful).
      *   **Propose the Principle:** "Locus of Safety Guarantee."
          *   Alignment: Safety comes from the model's *motivations/cognition*.
          *   Control: Safety comes from the *system's constraints*.
      *   **Re-evaluate Verdicts:**
          *   Fine-tuning vs. Classifier: Location matters because it dictates the locus. Fine-tuning = Internal Locus (Alignment). Classifier = External Locus (Control).
          *   Interpretability: It's a *diagnostic*. It belongs to Alignment *research* but is used for Control *monitoring*.
          *   Honeypots: Control. It's a trap. It detects, doesn't fix.
      *   **Address the "Assumption of Misalignment" Flaw:** Explain that Alignment work *anticipates* misalignment to *prevent* it, whereas Control *accommodates* misalignment to *mitigate* it.
      *   **Bonus Question:** Address the epistemological limit. We can't know we trust it. Therefore, Control is always rational as insurance.

  9.  **Refining the Honeypot Analysis:**
