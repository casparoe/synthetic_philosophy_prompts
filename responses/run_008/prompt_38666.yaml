      *   Counter: Passing a test is evidence, but the *test itself* is a control measure. A speed bump doesn't make you drive safer, but if you don't slow down, it reveals you're speeding. The speed bump is control. The *revelation* informs alignment status.
      *   *Correction:* Honeypots are **Monitoring** (a subset of Control).

  10. **Refining the "Trusted Model" Bonus:**
      *   If *truly* trusted (logical certainty), filters are irrational.
