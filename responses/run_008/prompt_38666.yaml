  2.  **Deconstruct "Alignment" vs. "Control":**
      *   *Standard Definitions (in the field):*
          *   **Alignment:** Making the AI's objectives/values match human intentions. (Inner working, goals, preferences).
          *   **Control (or Governance/Safety Engineering):** Keeping the AI's capabilities in check regardless of its objectives. (Outer constraints, sandboxing, monitoring).
