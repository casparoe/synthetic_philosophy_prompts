          *   Control measures: Remain necessary as defense-in-depth or become obsolete hindrances.

  4.  **Develop a Better Principle: "Locus of Agency" vs. "Locus of Constraint"**
      *   *Alignment:* Modifies the *agent's decision-making process*. It changes $P(action | context, goal)$. It aims to make the goal itself safe.
      *   *Control:* Modifies the *environment or the action space*. It changes $P(action | context, goal)$ by restricting available actions or altering consequences, *without* necessarily changing the goal.
      *   *Refinement:* It's about whether the safety margin relies on the model *wanting* to be safe (Alignment) or *being unable/ prevented* to be unsafe (Control).

  5.  **Address the Problem Cases:**
      *   *Case 1 (Refusal: Fine-tuning vs. Classifier):*
          *   Fine-tuning: Changes the policy. The model "decides" not to. (Alignment).
          *   Classifier: Intercepts the output. The model might "want" to, but is stopped. (Control).
          *   *Verdict:* The location *does* matter, but not because it's physical. It matters because it indicates *where the safety guarantee comes from*. Is it the model's cognition or the system's architecture?
      *   *Case 2 (Interpretability):*
