answer: |-
  Your intuition is correct, and your colleague's paragraph contains a mix of standard definitions, common misconceptions, and one potentially dangerous piece of advice that contradicts modern causal inference. While the paragraph gets the *history* right, it gets the *methodology* wrong.

  Here is an audit of the claims, followed by an analysis of the "moral" and the Berkeley example.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Simpson's paradox is the reversal of an association when data are pooled... as happened in the well-known 1986 kidney stone study..."**
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is the standard definition and the correct canonical example (Charig et al., 1986). Open surgery was indeed superior for both small and large stones, but Percutaneous Nephrolithotomy (PCNL) looked better overall because it was disproportionately used on patients with small stones (which are easier to treat).

  **2. "The phenomenon is really just the ecological fallacy under another name..."**
  *   **Verdict:** **Mistaken.**
  *   **Comment:** Statisticians distinguish these concepts. The **Ecological Fallacy** refers to inferring individual-level relationships from group-level (aggregate) data (e.g., assuming because wealthy states vote Democratic, wealthy individuals vote Democratic). **Simpson's Paradox** refers to a reversal of association upon aggregation (or disaggregation) of data that can exist entirely at the individual level. While both involve aggregation issues, conflating them confuses students about the unit of analysis.

  **3. "It only arises when the groups being pooled are of very unequal sizes; with groups of roughly comparable size the effect washes out."**
  *   **Verdict:** **Mistaken.**
  *   **Comment:** The paradox does not depend on the absolute sample sizes of the subgroups being unequal. It depends on the **imbalance in the distribution of the lurking variable across the treatment groups.** You can have perfectly equal subgroup sizes (e.g., 100 men and 100 women in both Treatment A and B) and still generate a reversal if the success rates differ sufficiently. The driver is the correlation between the grouping variable and the treatment assignment, not the raw counts.

  **4. "The moral for practice is straightforward: whenever the pooled result and the disaggregated results disagree, the pooled result is an artifact and the subgroups give the real answer."**
  *   **Verdict:** **Mistaken (and Dangerous).**
  *   **Comment:** This is the critical error. As your memory recalled, there are many causal structures where the disaggregated result is the biased one. Whether you should trust the pooled or disaggregated data depends entirely on the **causal role** of the variable used to split the groups (the covariate).
      *   If the covariate is a **Confounder** (causes both treatment and outcome): Trust the **Subgroups** (e.g., Kidney Stones, Berkeley).
      *   If the covariate is a **Mediator** (is caused by treatment and causes outcome): Trust the **Pooled** data. Stratifying blocks the causal path and hides the total effect.
      *   If the covariate is a **Collider** (is caused by both treatment and outcome): Trust the **Pooled** data. Stratifying on a collider induces a spurious association (selection bias).

  **5. "This is why the Berkeley graduate admissions data for fall 1973 settled the discrimination question..."**
  *   **Verdict:** **Accepted (Historically), but Misleading (Pedagogically).**
  *   **Comment:** It is true that the Berkeley case (Bickel, Hammel, and O'Connell, 1975) is the classic example where the subgroup analysis was correct. However, presenting this as proof of the general rule in Sentence 4 is circular. It worked in Berkeley *because* "Department" was a confounder. It does not prove that subgroup analysis *always* works.

  ---

  ### Part 2: Auditing the "Closing Moral"

  **Does the advice to always trust disaggregated numbers follow from the accurate parts?**
  **No.** It contradicts the logic of causal inference.

  The paragraph implies that Simpson's Paradox is a purely statistical puzzle that can be solved by looking at finer granularity. Modern causal inference (pioneered by Judea Pearl, Jamie Robins, and others) teaches that Simpson's Paradox is actually a **causal** puzzle that cannot be solved by statistics alone.

  To decide whether to trust the pooled or disaggregated numbers, you must know the **temporal ordering and causal relationships** of the variables, which the paragraph never mentions.

  **Example where the "Moral" fails:**
  Imagine a study on a new drug (Treatment) and patient survival (Outcome).
  *   **Pooled Data:** The drug looks effective.
  *   **Disaggregated Data:** You split patients by "Blood Pressure after Treatment." In both the High BP and Low BP groups, the drug looks harmful.
  *   **Why?** Because the drug lowers blood pressure, and lowering blood pressure saves lives. "Blood Pressure" here is a **Mediator**.
  *   **Decision:** If you follow your colleague's moral ("trust the subgroups"), you conclude the drug is harmful and withhold it. If you trust the pooled data, you recognize the drug works *through* blood pressure and save lives.

  In this case, the disaggregated comparison is the "artifact," and the pooled result is the "real answer."

  **The Missing Ingredient:**
  The paragraph relies on a statistical heuristic ("break it down") but omits the necessary condition: **Causal Diagrams (DAGs).** You must determine if the grouping variable is a confounder (adjust for it) or a mediator/collider (do not adjust for it).

  ---

  ### Part 3: Does the Berkeley Sentence Support the Rule?

  The Berkeley sentence is the strongest part of the paragraph historically, but it is the weakest link logically.

  **Why it seems to support the rule:**
  In the 1973 Berkeley case, women had a lower overall admission rate than men. However, when broken down by department, women had equal or higher admission rates in most departments. The "Department" variable explained the discrepancy because women applied disproportionately to departments with low admission rates (Humanities) while men applied to departments with high admission rates (Engineering).

  **Why it does not validate the general rule:**
  The Berkeley analysis was correct only because the researchers established that **Department Choice preceded Admission.**
  1.  **Gender** influenced **Department Choice**.
  2.  **Department Choice** influenced **Admission Rate**.
  3.  Therefore, **Department** was a **Confounder** of the relationship between Gender and Admission *within the admissions process*.

  If the variable used to disaggregate had been something else, the conclusion might have flipped. For example, if they had disaggregated by "Undergraduate GPA," and the drug (being female) improved GPA which improved admission, stratifying by GPA would have hidden the benefit of being female.

  **The Verdict on Berkeley:**
  The Berkeley case supports the rule *only if you already know the causal story.* It demonstrates a situation where the rule worked, but it does not provide a justification for applying the rule universally. Using Berkeley to justify "always trust subgroups" is like using a single successful surgery to prove that "all surgery is beneficial," ignoring cases where surgery is contraindicated.

  ### Summary for Your Colleague

  You can tell your colleague that her paragraph is historically accurate but methodologically outdated. It reflects a pre-causal-inference view of statistics (common in the 1980s and 90s) where "controlling for everything" was the default instinct.

  **The Correction:**
  The "moral" should not be "always trust the subgroups." The moral should be: **"When pooled and disaggregated results disagree, you cannot decide which is correct using statistics alone. You must use subject-matter knowledge to draw a causal diagram. If the grouping variable is a confounder, trust the subgroups. If it is a mediator or collider, trust the pooled data."**

  If she teaches students to always disaggregate, she risks teaching them to induce bias (via collider stratification) or hide total effects (via mediator adjustment) in their future research. Your memory of the causal inference literature is spot-on: the reversal appears in both directions, and the data alone cannot tell you which way is up.
