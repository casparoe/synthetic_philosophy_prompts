  Bit of an odd one but here goes. I'm on the hardship fund committee at my workplace — small pot, few thousand a year, way more applicants than money, and a row broke out at the last meeting that has completely colonised my brain since. One colleague wanted to hold a lottery between two equally strong applicants rather than have us pick, on the grounds that a coin flip is fairer than us pretending our judgement is better than it is. Another colleague shot back that if a lottery between "A gets everything" and "B gets everything" is as fair as anything, then flipping the coin should be no worse than just splitting the pot between them — and that felt obviously wrong to almost everyone in the room, including me, and I couldn't say why.

  So I went down a rabbit hole and it turns out our little committee fight is basically a rerun of a decades-old debate around Harsanyi's aggregation theorem: if each person's preferences obey the von Neumann–Morgenstern axioms, and the social ranking obeys them too plus a Pareto condition, you get average utilitarianism coming out the other end, and Diamond's objection to all this is essentially my second colleague's coin-flip point.

  What I want from you: a decision tree that starts from the starting point I can't really shake (individuals' preferences are vNM-rational, and the social ranking should respect Pareto) and walks me to a position. The branch points should be questions I can actually answer from the inside without already knowing which camp they funnel me into — things like whether I'm bothered by the coin-flip case, whether I think the social ranking should be consistent under mixtures the same way individual choices are, whether the inputs ought to be preferences at all versus something more like wellbeing, whether interpersonal utility comparisons make sense, whether the "impartial observer" construction feels like a discovery or a conjuring trick. Leaves should include the full Harsanyi utilitarian one, the reading where the theorem is only about rational belief under risk and so leaves plenty of room for caring about distribution, the one where you just refuse independence for the social ranking and go egalitarian or prioritarian, and the grumpy leaf that says the vNM axioms were never meant to discipline moral rankings in the first place.

