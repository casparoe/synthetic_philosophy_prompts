prompt: |-
  Im a journalist who covers science and ideas, and I'm working on a piece about the stranger corners of AI-safety research — the people who worry about acausal threats, commitment races, agents bargaining with each other across time, that sort of thing. One idea I keep circling back to is surrogate goals: an agent publicly commits to treating an attack on some cheap decoy target as if it were an attack on the thing it actually cares about, so that would-be threateners find nothing left that's cheap to threaten. The standard pitch is that this deterrence is basically free, because no rational threatener should ever bother attacking the decoy, so the commitment never gets called in practice. But every time I try to explain it in the article I hit the same doubt: deterrence that seems to good to be true usually has a failure mode hiding somewhere.

  So here's the job. I'd like you to act as an expert in decision theory and game theory — think someone who works on bargaining and precommitment, not a general-purpose philosopher — and construct me a thought experiment where adopting a surrogate goal leaves the agent strictly worse off than never having adopted one: a case where the decoy scheme actively attracts trouble rather than deterring it. Constraints: the threatener should be mundane and realistic — an extortionist, a patent troll, a ransomware operator — no superintelligences and definitely no acausal trade across possible worlds. The backfiring has to come out of the mechanism of surrogate goals itself (what a visible precommitment signals to observers, or what happens once the commitment actually gets called), not from the agent picking an obviously stupid decoy — that would be cheating, like a trolley case where the villain just happens to be tied to the other track by stipulation. And the scenario itself should be a single paragraph with stakes an ordinary reader can picture.

  After the scenario, walk me through the game properly: compare how things unfold with and without the surrogate goal, spell out which structural feature of the case is doing the work, and then steelman the defence — how would someone who genuinely believes in surrogate goals patch the scheme, and does the patch quietly give up the "deterrence is free" selling point? Please brainstorm two or three candidate scenarios before settling on one, and tell me briefly why you picked the one you did. Think it through carefully rather than rushing — I'd much rather have a case that actually works than one that just stipulates the verdict it needs.
