answer: |-
  ### Brainstorming Candidates

  Before settling on the scenario below, I considered three potential failure modes for surrogate goals in a mundane context:

  1.  **The Signal of Value:** An agent adopts a surrogate goal to protect a secret. By publicly committing to defend a decoy fiercely, they inadvertently signal that they have *something* worth protecting, attracting attention they would have otherwise avoided. *Rejection:* This feels too close to "picking a stupid decoy." If the decoy is truly cheap, the signaling effect should be minimal. The failure should come from the *dynamics* of the commitment, not the information leakage.
  2.  **The Coordination Focal Point:** Multiple small threateners exist. Without a surrogate goal, they hesitate. With one, the decoy becomes a Schelling point for them to coordinate a "test" attack to see if the agent is bluffing. *Rejection:* This requires a level of coordination among threateners that is unrealistic for mundane actors like extortionists.
  3.  **The Credibility Drain (Selected):** The agent commits to a disproportionate retaliation to make the threat credible. A rational threatener realizes that to maintain this credibility, the agent *must* follow through on the threat even when it is costly to do so. The threatener triggers the commitment specifically to force the agent to burn resources on a pointless conflict. *Selection:* This isolates the core game-theoretic tension of precommitment (the cost of credibility) without relying on superintelligence or information asymmetry.

  ***

  ### The Scenario

  Nexus Health, a medical data firm, wants to deter patent trolls from litigating against its core diagnostic algorithm. To solve this, Nexus publicly adopts a surrogate goal: they designate a worthless, open-source "decoy" library as a protected asset, announcing they will treat any infringement claim against the decoy as an act of war against their core product, triggering an automatic, unlimited-budget countersuit. A sophisticated patent troll, analyzing Nexus's new policy, realizes that for Nexus's deterrent to remain credible to future trolls, Nexus *must* follow through on this promise even for trivial infractions. The troll files a frivolous claim against the decoy library. Nexus is now trapped: if they ignore the claim, their deterrent collapses and they face a swarm of trolls against their core product; if they honor their surrogate goal, they must spend millions litigating over worthless code. Nexus honors the goal, draining their legal budget on a phantom battle, leaving them strictly worse off than if they had never adopted the policy and simply ignored the initial claim.

  ***

  ### The Game-Theoretic Analysis

  **1. The Unfolding: With vs. Without Surrogate Goals**

  *   **Without Surrogate Goal:** The patent troll assesses the value of the target. The decoy library is open-source and worthless; the core algorithm is well-defended. The troll expects a negative return on investment (ROI) from suing over the decoy and no clear path to the core. The troll does nothing. Nexus incurs **$0 cost**.
  *   **With Surrogate Goal:** Nexus has publicly tied the utility of the decoy to the core asset. The troll updates their model: attacking the decoy now forces a response. Crucially, the troll knows Nexus is rational and understands that *failing* to respond destroys the deterrent's value for all future interactions. The troll files the claim. Nexus faces a choice:
      *   *Defect:* Ignore the claim. Immediate cost: $0. Long-term cost: The deterrent is proven false; core assets are targeted by many trolls. Expected loss: High ($10M+).
      *   *Cooperate (with own commitment):* Litigate. Immediate cost: High ($5M). Long-term benefit: Deterrent remains credible.
      *   Nexus chooses to litigate to preserve the deterrent. Net result: **-$5M cost**.

  **2. The Structural Feature: The Cost of Credibility**

  The failure mode stems from the **dynamic inconsistency of precommitment**. In game theory, a threat is only credible if it is subgame-perfect to carry it out when the time comes. Surrogate goals attempt to manufacture credibility by artificially inflating the stakes of a low-value interaction.

  However, this creates a **vulnerability to resource attrition**. By raising the stakes of the decoy, the agent transforms a non-target into a "credibility sink." A rational adversary can exploit this by forcing the agent to pay the *cost of verification*. The agent must burn resources to prove they are the kind of agent who keeps their surrogate commitments. In the Nexus case, the decoy ceased to be a shield and became a lever the troll could pull to force Nexus into a costly action. The surrogate goal didn't change the troll's incentives to *win* the lawsuit; it changed their incentives to *file* it, turning a non-event into a guaranteed expense.

  **3. Steelmanning the Defense: Can the Scheme be Patched?**

  A proponent of surrogate goals would argue that Nexus failed because they chose a retaliation mechanism that was **costly to execute**. The "deterrence is free" claim relies on the assumption that the punishment phase is costless for the defender (e.g., an automated digital shunning or a reputation update that requires no expenditure).

  *   **The Patch:** Nexus should have committed to a retaliation that is cheap for them but expensive for the troll, such as "If you sue the decoy, we will publicly release all your proprietary litigation strategies," assuming Nexus can do this at near-zero marginal cost.
  *   **The Catch:** This patch quietly surrenders the "free deterrence" selling point. For a retaliation to be effective, it must hurt the threatener. If it hurts the threatener, they will take measures to avoid it (e.g., hiding their strategies, lobbying for laws against the retaliation). These counter-measures impose **transaction costs** on the ecosystem. Furthermore, if the retaliation is truly costless for the agent, it risks being perceived as "cheap talk" unless there is a reputational cost to *not* using it.
  *   **Conclusion:** The patch admits that deterrence is never truly free; it is merely shifted from a direct defense budget to a reputation maintenance budget. The surrogate goal doesn't eliminate the cost of security; it just changes the currency in which that cost is paid. In the Nexus scenario, they paid in legal fees; in the patched scenario, they would pay in reputational capital or political goodwill. The "free lunch" was an illusion created by ignoring the equilibrium where rational actors test the commitment.
