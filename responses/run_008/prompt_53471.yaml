      *   *Claim 2: Necessity.* Is cost *necessary* for honesty? (No, indices and repeated games exist).
      *   *Claim 3: Sufficiency.* Is cost *sufficient* for honesty? (No, wasteful cost doesn't guarantee correlation with quality).
      *   *Claim 4: The Handicap Mechanism.* Does the cost *itself* enforce honesty via differential marginal costs? (This is the core Zahavi/Graphen theory).
      *   *Claim 5: Universal Application.* Does this apply to *all* communication? (No).

  3.  **Drafting the "Menu" of Readings:**

      *   *Reading 1: The Tautology (Definitional).* "Signal" = "Costly Signal."
          *   *Verdict:* Trivial/True by stipulation.
          *   *Relevance:* Doesn't explain *why* nature evolved it, just labels it.

      *   *Reading 2: The Strong Handicap Principle (Zahavi/Grafen).* Cost is the *mechanism* of enforcement. High-quality individuals bear the cost easier than low-quality individuals (differential marginal cost).
          *   *Verdict:* Defensible (mathematically modeled), but often over-applied.
