prompt: |-
  I teach a second-year course in ethical theory, and next week's ninety-minute discussion section has to cover Bernard Williams's two complaints against utilitarianism: the integrity objection — that the theory treats agents merely as locations where the general good gets advanced, overriding the ground projects that partly constitute who they are — and the 'one thought too many' point, aimed at consequentialists who reply that a person can go on saving her drowning spouse, with the theory's own indirect blessing, once she takes the right background attitude toward her devotion. My worry is that students will file both under the heading of utilitarianism demanding too much calculation and never notice that the objections cut in different directions: one is about what the theory instructs agents to do, the other about how the theory lets agents think and justify. Don't explain Williams to me; plan the section. Specifically: (1) the order in which the pieces must arrive, and which has to come first — the alienation worry about projects or the thought-too-many worry about reasons — given that each can be made to look like a restatement of the other; (2) the single example that should carry the section and what it must have and lack — consider whether the standard drowning-spouse case should be adapted, since its melodrama and its pairing of spouse against stranger tend to derail discussion toward partiality and gender rather than the structure of the justification, and say exactly how you would adapt or replace it; (3) a pair of cases to be constructed live during the section in which one agent satisfies the integrity constraint but fails the thought-too-many test and another passes the latter while failing the former — I want the students to see that the objections are separable and that each closes off a different escape route for the consequentialist; (4) the misconceptions to expect, in the order they will surface — I anticipate integrity being read as mere psychological well-being, one thought too many being read as simple overthinking, and the sophisticated-consequentialist move of separating the criterion of rightness from the decision procedure, which students will deploy as though it were a knockdown reply to both objections at once — and the point in the sequence at which each should be absorbed rather than merely rebutted; (5) the closing question that would distinguish a student who has merely found the phrase charming from one who can say which utilitarian reply each objection forecloses; and (6) what I should openly decline to cover — Williams's larger critique of morality as a distinctive institution, comparisons with the complaint that verdicts based solely on consequences corrupt the concept of the moral, and the question whether integrity has any value when the projects it protects are rotten — with a sentence on why omitting each helps rather than hurts. No reading list and no citations; I will supply those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested discussion plan:

  1.  **Analyze the Request:**
      *   **Context:** Second-year ethical theory course, 90-minute discussion section.
      *   **Topic:** Bernard Williams's two complaints against utilitarianism (Integrity Objection & One Thought Too Many).
      *   **Instructor's Worry:** Students will conflate the two objections as "utilitarianism demands too much calculation." The goal is to show they cut in different directions (action-guidance vs. justification/reasons).
      *   **Constraints:**
          *   Do *not* explain Williams (assume instructor knows the material).
          *   Plan the section specifically.
          *   (1) Order of objections (Integrity vs. One Thought Too Many).
          *   (2) Single anchoring example (adapt/replace drowning spouse).
          *   (3) Two live-constructed cases (separating the objections).
          *   (4) Anticipated misconceptions & when to absorb them.
          *   (5) Closing question (distinguishing surface vs. deep understanding).
          *   (6) What to explicitly decline to cover (and why).
          *   No reading list/citations.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Integrity Objection:* Utilitarianism alienates the agent from their "ground projects" by making them neutral channels for utility. It attacks the *demand* to act against one's core commitments.
      *   *One Thought Too Many:* Even if utilitarianism allows saving a loved one (via indirect strategy), the *justification* ("I can save him because generally this maximizes utility") corrupts the relationship. It attacks the *reasoning structure*.
      *   *The Conflation Risk:* Students think both just mean "Stop calculating so much!" The instructor wants to show one is about *what you do* (Integrity) and the other is about *how you think/justify* (Thought Too Many).

  3.  **Drafting - Section by Section:**

      *   **(1) Order of Objections:**
          *   Which comes first? Integrity is about the *action* required (Jim and the Indians style, or George the chemist). One Thought Too Many is about the *justification* for an action usually permitted (saving a spouse).
          *   If we start with One Thought Too Many, students might think, "Oh, so utilitarianism *does* let you save the spouse, so Integrity is solved."
          *   If we start with Integrity, we establish the *cost* to the agent. Then One Thought Too Many shows that even if we lower the cost (by allowing the action), the *structure* is still wrong.
          *   *Decision:* Integrity first. It sets up the "demandingness" problem. Then One Thought Too Many shows that relaxing the demand doesn't fix the structural alienation.

      *   **(2) The Anchoring Example:**
          *   *Problem with Drowning Spouse:* Too emotional, triggers "partiality vs. impartiality" debate, gender dynamics, melodrama.
          *   *Goal:* Focus on the *structure of justification*.
          *   *Idea:* A lower-stakes scenario involving a commitment/project. Maybe an artist or a researcher?
          *   *Refinement:* Let's use a "Research Grant" scenario. An agent has a project crucial to their identity.
          *   *Wait, the prompt asks to adapt/replace the drowning spouse specifically because it derails.*
          *   *Better Idea:* A "Rescue" scenario that isn't a spouse. A friend? A colleague?
          *   *Best Idea:* Keep the *structure* of the spouse case but sanitize the relationship to avoid the "partiality" trap. Let's make it a "Mentor/Mentee" or "Collaborator" relationship, or simply a "Close Friend" where the focus is on the *reason* for saving them.
          *   *Actually, the prompt suggests the drowning spouse case derails toward partiality.* I need an example where the *project* is central.
          *   *Revised Plan:* Use a "Career/Project" example for Integrity (George the Chemist style but modernized) and a "Rescue" example for One Thought Too Many. But the prompt asks for a *single example* that carries the section.
          *   *Challenge:* One example must serve both objections.
          *   *Solution:* The "Burning Archive" case. An agent must choose between saving a unique historical archive (great utility for humanity) or their own life's work/manuscript (ground project).
          *   *Wait, One Thought Too Many needs a personal relationship usually.* Williams uses the spouse to show that appealing to utility corrupts love.
          *   *Let's try:* The "Drowning Partner" case. Not a spouse (avoids gender/family bias), but a research partner.
          *   *Adaptation:* You are on a boat with your long-term research partner (essential to your ground project) and a stranger who holds the key to a major utility-boosting discovery. Both drown. You can save one.
          *   *Why this works:* It ties Integrity (the project) to the Relationship (the partner).
          *   *Instruction:* Specify exactly how to adapt it. Remove the "spouse" label. Make it about a shared commitment.

      *   **(3) Two Live-Constructed Cases:**
          *   Need to separate the objections.
          *   Case A: Satisfies Integrity, Fails Thought Too Many. (Agent keeps project, but justifies it utilitarianly).
          *   Case B: Satisfies Thought Too Many, Fails Integrity. (Agent acts on immediate impulse/love, but the theory forces them to abandon the project elsewhere).
          *   *Refinement:*
              *   *Case 1 (Passes Integrity, Fails OTM):* The agent is allowed to keep their project (Indirect Utilitarianism), but when asked "Why?", they say "Because allowing this maximizes utility." (Alienation in justification).
              *   *Case 2 (Passes OTM, Fails Integrity):* The agent saves the friend without calculating (no extra thought), BUT the theory requires them to abandon a different ground project to compensate for the lost utility of the stranger. (Alienation in demand).
          *   *Wait, I need to construct these LIVE.* I need prompts for the students to build them.
          *   *Strategy:* Use a "Character Sheet" approach. Define the Agent, the Project, the Crisis. Then vary the *Rule* and the *Reason*.

      *   **(4) Misconceptions:**
          *   1. Integrity = Psychological Well-being/Happiness. (Need to correct: It's about identity/constitution).
          *   2. OTM = Overthinking/Slow calculation. (Need to correct: It's about the *content* of the reason, not the time taken).
          *   3. Decision Procedure vs. Criterion of Rightness. (The "Sophisticated Consequentialist" move). This is the big one. It claims to solve both.
          *   *Timing:* Absorb Well-being early (when defining Integrity). Absorb Overthinking early (when introducing OTM). Absorb Decision Procedure *late*, as the final hurdle before the closing question.

      *   **(5) Closing Question:**
          *   Must distinguish "charming phrase" from "structural understanding."
          *   Needs to force them to identify which utilitarian escape route is blocked by which objection.
          *   *Draft:* "If a utilitarian says 'We can keep our projects as long as it helps the greater good,' which objection kills that move? If they say 'You can save your friend without calculating,' which objection kills that move?"

      *   **(6) What to Decline:**
          *   Williams's critique of "Morality" (the system).
          *   Corruption of the "Moral" concept.
          *   Value of rotten projects.
          *   *Reasoning:* Keeps focus on the specific mechanics of the two objections within normative theory, not meta-ethics or applied ethics.

  4.  **Refining the Plan (Self-Correction/Polishing):**

      *   *Order:* Integrity first makes sense because it's the "hard demand." OTM is the "soft demand but wrong reason."
      *   *Example:* The "Drowning Spouse" is iconic. If I change it too much, students get lost. If I keep it, they talk about marriage. *Compromise:* Keep the "Drowning" structure, change the relationship to "Co-conspirator in a vital project." This links Integrity (project) and OTM (relationship).
      *   *Live Cases:* I need to be very specific about how the instructor facilitates this. "Board Work" strategy.
      *   *Misconceptions:* The "Decision Procedure" objection is the strongest student move. It needs to be addressed carefully. Williams anticipates it (that's why OTM exists). I need to make sure the plan shows *why* Decision Procedure doesn't solve OTM.
      *   *Closing:* Make it sharp.

  5.  **Final Review against Constraints:**
      *   90 minutes? (Need to pace it).
      *   No explaining Williams? (Check).
      *   Specific order? (Check).
      *   Single example adapted? (Check).
      *   Two live cases? (Check).
      *   Misconceptions ordered? (Check).
      *   Closing question? (Check).
      *   Exclusions? (Check).

  6.  **Writing the Response:** (Drafting the content with the tone of a pedagogical consultant). *Self-correction on the Single Example:* The prompt asks for *the* single example that carries the section. Using the "Drowning Spouse" but adapting it to avoid the "partiality" trap is the safest bet to ensure students recognize the reference while avoiding the derailment. I will advise changing "Spouse" to "Essential Collaborator." This bridges the gap between "Project" (Integrity) and "Personal Relation" (OTM).

      *Wait, one more check on the Live Cases.*
      *   Case 1: Integrity OK, OTM Fail. -> Agent keeps project, but justifies via utility.
      *   Case 2: Integrity Fail, OTM OK. -> Agent acts on impulse (no extra thought), but is forced to abandon project elsewhere.
      *   *Actually, it's better if the cases show the logical space.*
      *   Let's refine the "Live Construction." I will ask students to modify the *Justification* and the *Requirement* independently.

      *Let's finalize the Misconception sequence.*
      1. Integrity = Happiness (Early, when defining Integrity).
      2. OTM = Calculation time (Early, when defining OTM).
      3. Decision Procedure (Late, after both are established, as the "Synthesis" attempt).

      *Let's finalize the Closing Question.*
      "Which objection survives the distinction between the criterion of rightness and the decision procedure?"

      *Let's finalize the Exclusions.*
      Keep it tight.

      *Time Management:* 90 mins.
      0-15: Intro & Example Setup.
      15-35: Integrity Objection.
      35-55: One Thought Too Many.
      55-75: Live Cases (Separation).
      75-85: Misconceptions (Decision Procedure).
      85-90: Closing.

      *Wait, the prompt asks for the order of the pieces (Integrity vs OTM).* I argued Integrity first.
      *Why?* Because OTM is often presented as a reply to Integrity ("We can allow the action!"). So Integrity must be the thesis, OTM the antithesis to the utilitarian reply.

      *Okay, ready to write.*
answer: |-
  ### 90-Minute Discussion Plan: Williams on Utilitarianism

  #### 1. Order of Objections
  **Start with the Integrity Objection, then move to 'One Thought Too Many'.**

  *   **Rationale:** The Integrity Objection establishes the *cost* of the theory: it demands agents abandon their ground projects when utility requires it. This sets up the natural utilitarian defense: "We can allow agents to keep their projects via an indirect strategy." The 'One Thought Too Many' objection is the counter-strike to that specific defense. It shows that even if the theory relaxes its *demands* on action, it still corrupts the *structure of reasoning*. If you reverse the order, students will assume the 'One Thought' point solves the Integrity problem (by allowing the action), missing Williams's claim that the justification itself is alienating.

  #### 2. The Anchoring Example
  **Replace the "Drowning Spouse" with the "Drowning Collaborator."**

  *   **The Setup:** An agent is on a capsizing boat with two people: a Stranger (who holds the code to a database that will save thousands of lives) and a Collaborator (with whom the agent has spent ten years building a shared life's work/project). Only one can be saved.
  *   **What it must have:**
      *   **High Stakes:** The Stranger represents clear, significant utility (saving thousands).
      *   **Constitutive Relationship:** The Collaborator must not just be "loved" but must be *part of the agent's ground project*. Saving them is saving the project itself.
  *   **What it must lack:**
      *   **Marital/Family Labels:** Remove "spouse," "husband," "wife." This prevents the discussion from drifting into debates about special duties of care, gendered expectations of rescue, or the intrinsic value of family ties.
      *   **Melodrama:** Keep the description clinical. Focus on the *choice* and the *reason*, not the emotional trauma.
  *   **Why this adaptation works:** It fuses the Integrity Objection (the project is at stake) with the 'One Thought Too Many' Objection (the relationship is at stake). It forces students to see that the "project" isn't just a hobby; it is a relational commitment.

  #### 3. Live-Constructed Cases (Board Work)
  Draw a 2x2 grid on the board. The axes are **Action Guidance** (What the theory tells you to do) and **Justification** (The reason you are allowed to have). You will construct two scenarios with student input to fill two quadrants, proving the objections are distinct.

  *   **Case A (Passes Integrity, Fails 'One Thought'):**
      *   *Prompt to Class:* "Suppose Utilitarianism says: 'Save the Collaborator. We will treat personal devotion as a useful heuristic that generally maximizes good.'"
      *   *The Catch:* When the agent saves the Collaborator, they must acknowledge the *reason* is that "devotion is a useful heuristic."
      *   *Result:* The agent keeps their project (Integrity satisfied), but their reasoning is mediated by the general good (One Thought Too Many violated). The relationship is instrumentalized.
  *   **Case B (Fails Integrity, Passes 'One Thought'):**
      *   *Prompt to Class:* "Suppose Utilitarianism says: 'Save the Collaborator because you love them. No calculation needed in the moment.'"
      *   *The Catch:* To balance the utility lost by the Stranger dying, the theory requires the agent to *abandon the collaborative project* next week to work on high-utility compensation.
      *   *Result:* The agent acts on immediate commitment without extra calculation (One Thought Too Many satisfied), but the project is ultimately sacrificed to the general good (Integrity violated).
  *   **Pedagogical Goal:** This demonstrates that fixing the *action* (Case A) doesn't fix the *reason*, and fixing the *reason* (Case B) doesn't fix the *demand*. The objections block different escape routes.

  #### 4. Misconceptions & Absorption Points
  Address these in the following order as they naturally surface. Do not rebut them immediately; absorb them into the definitions.

  1.  **"Integrity is just psychological well-being/happiness."**
      *   *When:* Arises during the initial Integrity discussion (Minutes 15–20).
      *   *Absorption:* Clarify that integrity is not about *feeling* good (which could be satisfied by a pill) but about *being* the source of one's actions. If the theory makes the agent a channel, it doesn't matter if they are happy; they are no longer the author of their life.
  2.  **"'One Thought Too Many' is just about overthinking/slow calculation."**
      *   *When:* Arises during the OTM introduction (Minutes 35–40).
      *   *Absorption:* Emphasize that the "thought" is not a temporal delay. It is a structural feature of the justification. Even if the thought happens instantly, if the *content* of the justification appeals to the general good, the objection holds.
  3.  **"Criterion of Rightness vs. Decision Procedure."**
      *   *When:* Arises after the Live Cases (Minutes 60–70). Students will argue: "Utilitarianism is just the criterion for what is right; it doesn't dictate what we think in the moment."
      *   *Absorption:* This is the strongest student move. Absorb it by conceding the point but showing its limit. Acknowledge that this distinction solves the *calculation* worry, but ask: "Does it solve the *justification* worry?" If the agent's deep self-conception is shaped by the Criterion, the alienation remains. This distinction saves the theory from being impractical, but not from being alienating.

  #### 5. Closing Question
  **"If a utilitarian adopts the distinction between the criterion of rightness and the decision procedure, which of Williams's two objections remains fatal, and why?"**

  *   **Distinguishing Factor:**
      *   *Surface Understanding:* The student will say "Neither, because the utilitarian doesn't have to calculate." (This misses the point of both objections).
      *   *Deep Understanding:* The student will identify that the Decision Procedure move neutralizes the *Integrity Objection* (mostly) by allowing ground projects in practice, but it fails to neutralize *'One Thought Too Many'*. The 'One Thought' objection targets the *criterion* itself as the source of justification, regardless of the decision procedure. The agent still cannot view their commitment as *ultimately* justified by anything other than the criterion.

  #### 6. What to Openly Decline to Cover
  State clearly at the outset that you will not cover the following, and write them on the side of the board as "Out of Bounds":

  1.  **Williams's broader critique of 'Morality' as a distinctive institution.**
      *   *Why omit:* This is a meta-ethical claim about the history of ethical concepts. Including it distracts from the normative mechanics of the two specific objections against utilitarianism.
  2.  **The claim that consequentialist verdicts corrupt the concept of the 'moral'.**
      *   *Why omit:* This leads to semantic debates about definitions rather than structural debates about agency and justification.
  3.  **Whether integrity has value when the protected projects are 'rotten' (e.g., a Nazi's ground project).**
      *   *Why omit:* This is an applied ethics trap. It allows students to dismiss the Integrity Objection by attacking the *content* of the project, rather than engaging with the *structural* point about agency and authorship.

  *By omitting these, you force the discussion to remain on the structural relationship between the agent, their reasons, and the theory, which is the precise locus of Williams's argument.*
