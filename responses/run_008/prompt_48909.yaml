prompt: |-
  I work as a risk analyst for a municipal water utility, and after a long argument with a friend — a devoted precise Bayesian who insists every rational credence is a single number — I've become sympathetic to imprecise probabilities instead: representing my uncertainty with intervals or sets of distributions rather than point values. But I can't turn sympathy into decisions. Please build me a decision procedure my team can actually run: when to treat a question as one of ambiguity rather than just risk, how to elicit and represent our uncertainty when experts disagree or models diverge, and crucially, what to do when our imprecise credences fail to determine a unique choice — which decision rule to apply (something like maximin over the set, or only ruling out options no distribution in the set favors, or something else), and when to just pick. Our decisions recur monthly, the stakes range from routine maintenance budgets to drought contingency planning, and the procedure has to be usable by analysts without formal training in a day or two. Run it on three cases: approving a new treatment plant sized under deep uncertainty about regional demand growth, setting an allocation between two watersheds under climate-model disagreement, and one routine case where the imprecise machinery turns out to be overkill. Mark honestly where the procedure just relocates judgment rather than eliminating it, and tell me where it will misfire — including the places where my Bayesian friend would say the whole apparatus collapses back into precise probabilities anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Risk Analyst for a municipal water utility.
      *   **Context:** Long argument with a "precise Bayesian" friend. User is now sympathetic to *imprecise probabilities* (intervals/sets of distributions) but needs actionable decision procedures, not just theory.
      *   **Goal:** A practical decision procedure for the team (usable within 1-2 days of training).
      *   **Key Requirements:**
          1.  When to treat a question as ambiguity (imprecise) vs. risk (precise).
          2.  How to elicit/represent uncertainty (expert disagreement/model divergence).
          3.  What to do when imprecise credences don't yield a unique choice (decision rules).
          4.  When to just pick (tie-breaking).
          5.  Apply to three specific cases (Treatment Plant, Watershed Allocation, Routine Maintenance).
          6.  Honest assessment of limitations (where judgment is relocated, where it misfires, Bayesian counter-arguments).
      *   **Constraints:** Recurring monthly decisions, varying stakes (routine to drought contingency), low formal training requirement.

  2.  **Deconstruct the Theoretical Landscape:**
      *   *Precise Bayesianism:* One prior, one likelihood, one posterior. Maximize Expected Utility (MEU).
      *   *Imprecise Probability (IP):* Sets of priors/posteriors. Often motivated by ignorance, conflict, or lack of data.
      *   *Decision Rules under IP:*
          *   *Maximin (Waldean):* Choose the option with the best worst-case expected utility. Very conservative.
          *   *E-Admissibility:* Choose options that are optimal for *at least one* distribution in the set.
          *   *Interval Dominance:* Rule out options whose maximum expected utility is lower than another option's minimum.
          *   *Hurwicz Criterion:* Weighted average of best and worst case (requires a coefficient of optimism/pessimism).
          *   *Minimax Regret:* Minimize the maximum regret.
      *   *Practicality:* Complex rules like E-Admissibility can leave too many options open. Maximin can be too paralyzing. A hybrid approach is needed for a utility.

  3.  **Develop the Procedure (The "Water Utility Imprecise Decision Protocol" - WUIDP):**
      *   *Phase 1: Triage (Risk vs. Ambiguity).* Need a heuristic to decide when to use IP. High stakes + high model disagreement/low data = IP.
      *   *Phase 2: Elicitation.* How to get intervals without math PhDs. Use expert ranges or model ensembles.
      *   *Phase 3: Analysis.* Calculate Expected Utility (EU) ranges for each option.
      *   *Phase 4: Decision Rule.* Need a tiered approach.
          *   If intervals don't overlap -> Easy choice.
          *   If intervals overlap -> Apply a specific rule based on stakes (Conservative for drought, Balanced for budget).
      *   *Phase 5: Tie-Breaking.* If still indeterminate, who decides? (Management/Policy).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the user's shift but ground it in utility.
      *   **The Protocol (WUIDP):** Keep it step-by-step.
          *   *Step 1: The Ambiguity Trigger.* Define criteria (Data scarcity, Model conflict, Consequence severity).
          *   *Step 2: Constructing the Set.* Don't ask for priors. Ask for "Plausible Bounds" or use Model Ensembles.
          *   *Step 3: The Decision Matrix.* Calculate Min/Max Expected Cost/Benefit.
          *   *Step 4: Selection Rules.* This is the core.
              *   *Rule A (Dominance):* If Option A is better than B in all scenarios, pick A.
              *   *Rule B (High Stakes/Safety):* Maximin (Best of the Worst).
              *   *Rule C (Routine/Budget):* Midpoint or Weighted Average (collapsing back to precise).
          *   *Step 5: The "Break Glass" Clause.* When math fails, management decides based on policy.
      *   **Case Studies:**
          *   *Case 1 (Treatment Plant):* High stakes, deep uncertainty. Use Maximin/Minimax Regret.
          *   *Case 2 (Watershed Allocation):* Model disagreement. Use Interval Dominance.
          *   *Case 3 (Routine Maintenance):* Low stakes. Show where IP is overkill (collapse to precise).
      *   **Honest Assessment (The "Gotchas"):**
          *   *Judgment Relocation:* The bounds aren't objective; setting them is subjective.
          *   *Bayesian Critique:* You can just put a prior on the models (Hierarchical Bayesian). IP is often just Bayesianism with a specific loss function or uninformative prior.
          *   *Misfire:* Paralysis. If the set is too wide, *no* decision is made.

  5.  **Refining the Decision Rules for Practicality:**
      *   Pure Maximin is too pessimistic for a utility (might overspend endlessly).
      *   Pure E-Admissibility leaves too many options.
      *   *Proposal:* **Gamma-Maximin with a Threshold.** Or simpler: **Interval Dominance + Conservative Tilt.**
      *   *Better Proposal for this User:* A **Tiered Rule Set**.
          1.  Check for Dominance.
          2.  If Stakes are Critical (Drought/Safety) -> Maximin.
          3.  If Stakes are Economic (Budget) -> Minimize Max Regret (less conservative than Maximin).
          4.  If Indeterminate -> Escalate.

  6.  **Addressing the Bayesian Friend:**
      *   Must explicitly state where the friend is right. (e.g., You implicitly have a second-order prior when you choose the bounds).
      *   Acknowledge that IP is often computationally equivalent to Robust Bayesian Analysis.

  7.  **Review against Constraints:**
      *   *Usable in 1-2 days?* Yes, if simplified to spreadsheets.
      *   *Recurring monthly?* Needs to be fast.
      *   *Honest about limitations?* Yes, dedicated section.

  8.  **Self-Correction/Polishing:**
      *   *Tone:* Professional, pragmatic, empathetic to the analyst's position.
      *   *Clarity:* Avoid heavy notation. Use "Best Case/Worst Case" language alongside "Upper/Lower Expectation."
      *   *Specifics:* Ensure the water utility context shines through (e.g., mention "acre-feet," "MGD," "compliance").

  9.  **Final Structure:**
      1.  Executive Summary.
      2.  The Protocol (The 5-Step Workflow).
      3.  Decision Rules (The "How to Choose" Logic).
      4.  Case Applications.
      5.  The Honest Audit (Limitations & Bayesian Counter).
      6.  Implementation Checklist.

  *(Self-Correction during drafting)*: I initially thought about suggesting Hurwicz. But asking analysts to pick an "optimism coefficient" is just asking them to pick a precise probability in disguise. Better to tie the rule to *organizational risk appetite* (Safety vs. Budget) rather than individual psychology. I will recommend **Minimax Regret** for economic decisions and **Maximin** for safety/compliance decisions.

  *(Refining the "When to use IP" part)*: Don't use IP for everything. It's computationally heavier. Need a clear "Trigger." I'll define the "Ambiguity Trigger" based on Data Quality and Model Consensus.

  *(Refining the Bayesian Counter)*: The friend argues that choosing the *set* implies a higher-order distribution. I need to admit this. The "set" is often a confidence interval in disguise. I will frame this as "Robustness" rather than "Truth."

  10. **Final Polish:** Check word count and readability. Ensure the three cases are distinct. (Plant = Capacity/Uncertainty, Watershed = Allocation/Conflict, Routine = Precision/efficiency).

  *(Final thought)*: Make sure to emphasize that *indecision* is a valid output of IP, and the procedure must handle that (escalation).

