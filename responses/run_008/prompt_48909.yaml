answer: |-
  This is a pragmatic pivot. Your friend is theoretically consistent, but in municipal infrastructure, "theoretically consistent" often looks like "false precision." When models disagree on climate precipitation by 40%, assigning a single prior is not rationality; it's fabrication.

  However, Improbable Probability (IP) without a decision rule is just anxiety with extra steps. If your set of distributions is wide, almost every option becomes "admissible," and you end up paralyzed.

  Below is the **Water Utility Imprecise Decision Protocol (WUIDP)**. It is designed to be taught in two days, run in Excel, and defensible in a public hearing. It explicitly tells you when to use IP, how to calculate it without measure theory, and how to force a choice when the math doesn't.

  ---

  # The Water Utility Imprecise Decision Protocol (WUIDP)

  ## Phase 1: The Ambiguity Trigger
  Do not use imprecise probabilities for everything. It is computationally heavier and harder to explain to the Board. Use the **D-M-C Score** to decide if a decision requires IP or standard Precise Bayesian/Expected Value (EV) analysis.

  Score each 0–2 (Total 0–6):
  1.  **Data Scarcity:** (0) Decades of local data; (1) Regional proxies only; (2) No historical precedent (e.g., novel contaminant).
  2.  **Model Conflict:** (0) Models agree within 10%; (1) Models agree on direction, not magnitude; (2) Models disagree on direction or structural mechanism.
  3.  **Consequence Severity:** (0) Budget variance <5%; (1) Service interruption or budget variance >10%; (2) Public health risk or systemic failure.

  *   **Score 0–2:** Use **Standard EV**. (Your Bayesian friend wins here).
  *   **Score 3–6:** Use **Imprecise Protocol**.

  ## Phase 2: Elicitation (The "Envelope" Method)
  Do not ask experts for priors. Ask for **Plausible Bounds**.
  1.  **Identify the Variable:** (e.g., Demand Growth Rate).
  2.  **Gather Sources:** Internal models, external climate projections, consultant reports.
  3.  **Set the Interval:**
      *   *Lower Bound:* The value where you would be shocked if reality were lower (5th percentile of the *union* of all models).
      *   *Upper Bound:* The value where you would be shocked if reality were higher (95th percentile of the *union*).
      *   *Internal Distribution:* Assume uniform or triangular within the bounds for calculation purposes.
  4.  **Result:** You now have a range of Expected Costs/Benefits for each option, not a single number.
      *   *Option A Expected Cost:* [$10M, $15M]
      *   *Option B Expected Cost:* [$12M, $18M]

  ## Phase 3: Decision Rules (The Choice Logic)
  When intervals overlap, EV fails. Use this hierarchy of rules based on the **Nature of the Decision**.

  ### Rule A: Interval Dominance (The "No-Brainer")
  If the *maximum* expected loss of Option A is lower than the *minimum* expected loss of Option B, choose A.
  *   *Action:* Proceed immediately.

  ### Rule B: The Safety/Compliance Filter (Maximin)
  **Use when:** Consequence Severity score was 2 (Health/Safety/Systemic Failure).
  *   *Logic:* Assume the worst distribution in your set is the true one. Choose the option with the best "worst-case" outcome.
  *   *Action:* Maximize the Minimum Utility (or Minimize the Maximum Cost).
  *   *Why:* In water utility, false negatives (running out of water, contamination) are costlier than false positives (overspending).

  ### Rule C: The Budget/ Efficiency Filter (Minimax Regret)
  **Use when:** Consequence Severity score was 0 or 1 (Economic/Operational).
  *   *Logic:* Maximin is too pessimistic for budgeting (you'll never invest). Instead, minimize the maximum *regret*. Regret is the difference between the cost you incurred and the cost you *would have* incurred if you knew the future.
  *   *Action:* Calculate regret for each option across the bounds. Pick the option with the lowest maximum regret.
  *   *Why:* This balances overspending against under-preparing.

  ### Rule D: The "Break Glass" Clause (Escalation)
  If Rule B or C still yields a tie (e.g., max regret is identical, or maximin options are functionally equivalent):
  *   *Action:* The math has exhausted its utility. Escalate to Senior Management/Board.
  *   *Input:* Present the intervals, not a single number. "We cannot distinguish these options analytically; the choice is now policy, not analysis."

  ---

  # Case Applications

  ### Case 1: New Treatment Plant (Deep Uncertainty)
  *   **Context:** Sizing a plant for 2050. Demand depends on population growth + industrial zoning + conservation tech.
  *   **D-M-C Score:** Data (1) + Model (2) + Severity (2) = **5 (Use IP)**.
  *   **Elicitation:** Three models suggest growth rates of 0.5%, 1.2%, and 2.5%. You set the interval [0.5%, 2.5%].
  *   **Options:**
      *   *Small Plant:* Cheap now, high risk of shortage later. Cost Range: [$50M, $90M] (includes penalty costs for shortage).
      *   *Large Plant:* Expensive now, safe later. Cost Range: [$70M, $75M].
  *   **Analysis:**
      *   Interval Dominance? No. ($70M > $50M).
      *   Rule B (Maximin/Severity 2): Worst case for Small is $90M. Worst case for Large is $75M.
  *   **Decision:** **Build Large Plant.**
  *   **Why:** Under deep uncertainty with high severity, the "best of the worst" dictates avoiding the $90M shortage risk. The imprecise machinery successfully flagged the risk that a precise average ($70M vs $70M) might have obscured.

  ### Case 2: Watershed Allocation (Model Disagreement)
  *   **Context:** Allocating draw limits between East and West watersheds. Climate models disagree on which side will dry out.
  *   **D-M-C Score:** Data (1) + Model (2) + Severity (1) = **4 (Use IP)**.
  *   **Elicitation:**
      *   *Model Set 1:* East dries, West wet.
      *   *Model Set 2:* West dries, East wet.
  *   **Options:**
      *   *Split 50/50:* Robust but inefficient if one side stays wet.
      *   *Weighted 70/30:* Efficient if Model 1 is right, catastrophic if Model 2 is right.
  *   **Analysis:**
      *   Rule B (Maximin)? 50/50 wins (avoids catastrophic failure).
      *   Rule C (Minimax Regret)? 50/50 likely wins here too because the regret of a dry reservoir is high.
  *   **Decision:** **Split 50/50.**
  *   **Why:** The imprecise set reveals that the "optimal" precise allocation is fragile. The procedure forces a robustness check.

  ### Case 3: Routine Pump Maintenance (Low Stakes)
  *   **Context:** Replace vs. Repair a specific pump station. Failure history is well-documented (20 years).
  *   **D-M-C Score:** Data (0) + Model (0) + Severity (0) = **0 (Use Standard EV)**.
  *   **Elicitation:** You try to apply IP. Experts say "Failure rate is between 1.0% and 1.1%."
  *   **Analysis:** The interval is so narrow that Interval Dominance immediately resolves the choice. Maximin and Minimax Regret yield the same result as Expected Value.
  *   **Decision:** **Use Standard EV.**
  *   **Why:** Applying IP here is "overkill." It consumes analyst hours for zero decision gain. Your Bayesian friend is right here: when data is rich, IP collapses to precise probability. Acknowledge this to save time.

  ---

  # The Honest Audit: Where This Breaks

  You asked for honesty. Here is where this procedure relocates judgment, misfires, or validates your friend.

  ### 1. Judgment Relocation (The "Bounds" Problem)
  **The Issue:** The procedure claims to handle uncertainty, but setting the [Lower, Upper] bounds in Phase 2 is subjective.
  **The Reality:** You haven't eliminated subjective priors; you've hidden them in the interval width. If you are optimistic, you narrow the interval. If pessimistic, you widen it.
  **Mitigation:** Document *why* the bounds were chosen (e.g., "Bounds set to encompass 100% of IPCC scenarios"). Make the bounds auditable.

  ### 2. The Paralysis Trap (Rule D Overuse)
  **The Issue:** If your uncertainty is truly deep, the intervals for all options will overlap significantly. Maximin might make *all* options look too risky. Minimax Regret might show equal regret.
  **The Reality:** You will end up at the "Break Glass" clause frequently in drought scenarios.
  **Mitigation:** Accept this. The value of the analysis isn't always picking the winner; it's proving to the Board that *no* winner exists analytically, forcing them to own the policy risk.

  ### 3. The Bayesian Counter-Attack (Where Your Friend Wins)
  Your friend will argue three points. They are partially correct:
  *   **Argument:** "You implicitly have a second-order prior over your set of distributions."
      *   **Concession:** True. By choosing *which* models to include in the set, you are weighting them.
      *   **Defense:** It is better to be explicit about the set than to hide the weighting in a single prior.
  *   **Argument:** "Minimax Regret is just Expected Utility with a specific loss function."
      *   **Concession:** Mathematically, often yes.
      *   **Defense:** Psychologically and institutionally, no. Explaining "Maximum Regret" to a City Council is easier than explaining "Subjective Prior Loss Functions."
  *   **Argument:** "If you update your beliefs with data, IP converges to Precise anyway."
      *   **Concession:** Yes.
      *   **Defense:** That's why we have the **D-M-C Trigger**. When data converges (Case 3), we stop using IP. We only use IP while the data is ambiguous.

  ### 4. Where It Will Misfire
  *   **Correlated Risks:** This procedure treats variables somewhat independently. If a drought causes both high demand *and* low supply, simple interval arithmetic might underestimate the tail risk. *Fix:* Run the intervals through a simple Monte Carlo simulation using the bounds as distribution limits.
  *   **Dynamic Consistency:** IP can lead to "time inconsistency" (preferring A today, but B tomorrow if no new info arrives). For monthly recurring decisions, ensure you lock in the decision rule (e.g., "We always use Maximin for drought") so you don't flip-flop.

  # Implementation Checklist (Day 1 & 2 Training)

  1.  **Template Creation:** Build an Excel sheet with inputs for Lower/Upper Bounds and automatic calculation of Maximin and Minimax Regret.
  2.  **Calibration Exercise:** Take 5 past decisions. Run them through the D-M-C score. Did IP would have changed the outcome? (This builds buy-in).
  3.  **The "Policy Memo":** Draft a standard paragraph for Board reports: *"Due to high model divergence, costs are presented as a range. The recommended option minimizes the maximum potential regret, prioritizing ratepayer stability over optimistic efficiency."*
  4.  **Stop Rule:** Agree internally that if the D-M-C score is <3, analysts are forbidden from using IP to prevent "analysis paralysis."

  ### Final Word
  Your friend wants you to be a **mapmaker** who draws one precise line. You are realizing you are a **guide** in foggy terrain. Sometimes the honest map shows a shaded region, not a line. This procedure gives you the tools to draw the shaded region and, crucially, tells you when to stop drawing and start walking.
