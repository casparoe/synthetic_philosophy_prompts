      22. AC (Wait, AC is in Yes 13. Make it distinct). Let's make No cases share *one* feature but lack the "cluster" density.
      *   Actually, simpler: No cases share features but break the "chain".
      *   Let's just ensure the "Yes" set has no common intersection.
      *   Intersection of all Yes sets = Null.
      *   Intersection of all No sets = Null.
      *   Some No sets look like Yes sets.

