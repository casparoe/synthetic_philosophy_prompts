answer: |-
  # Seminar Activity: The *Kora* Translation Protocol
  **Course:** Upper-Level Wittgenstein Seminar
  **Time:** 80 Minutes
  **Participants:** 12 Students (Plus Facilitator)
  **Textual Anchor:** *Philosophical Investigations* §§65–71, §241

  ## 1. Learning Objective
  Students will experience the failure of essentialist definitions (necessary and sufficient conditions) when confronted with a concept held together by "family resemblance." They will discover that their ability to categorize instances relies not on a definition, but on shared "agreement in judgments" embedded in a form of life.

  ## 2. Premise & Stakes
  **The Scenario:** The class is a **Translation Committee**. A field linguist has returned from the isolated *Kora* valley with recordings of 24 distinct practices the natives label with the single word ***"Kora"***.
  **The Stakes:** The Linguist's grant renewal depends on submitting a formal lexical entry for "Kora" by the end of class. The entry requires a strict definition (Necessary & Sufficient Conditions).
  **The Twist:** The word *Kora* is a family-resemblance concept. There is **no feature common to all instances**.

  ## 3. Materials
  1.  **The Corpus:** 24 Cards (printed slips), each describing a practice. (See Appendix A).
  2.  **The Charter:** A handout outlining the rules of definition (See Appendix B).
  3.  **The Adjudication Log:** A sheet for the "Field Agent" to record rulings.
  4.  **Whiteboard/Projector:** To track the definition drafting.

  ## 4. Timeline & Procedure

  ### Phase 1: Intuitive Sorting (15 Minutes)
  *   **Setup:** Distribute the 24 cards randomly among the 12 students.
  *   **Task:** The committee must sort the cards into two piles on the central table: **"Is Kora"** and **"Is Not Kora."**
  *   **Rule:** Decisions must be by **consensus**. If two students disagree, they must discuss until they agree.
  *   **Facilitator Role:** Observe. Do not intervene unless they ask if a specific feature matters. (They will likely find this surprisingly easy).

  ### Phase 2: The Essentialist Trap (20 Minutes)
  *   **Task:** The committee must draft the **Official Definition** for the grant.
  *   **Constraint (The Charter):** The definition must be in the form of **Necessary and Sufficient Conditions**.
      *   *Forbidden:* Disjunctions (e.g., "Either A or B").
      *   *Forbidden:* Vague terms (e.g., "similar to," "usually").
      *   *Required:* "An activity is Kora if and only if it possesses features X, Y, and Z."
  *   **Selection:** Choose one student to be the **Field Agent**. They leave the room (or turn their back) during the drafting. They will not know the cards; they will know *only* the written definition.

  ### Phase 3: Adjudication (20 Minutes)
  *   **Setup:** The Field Agent returns. The rest of the class becomes the "Challenge Team."
  *   **Task:** The Challenge Team invents **3 Novel Borderline Cases** (verbal descriptions of new activities) and presents them to the Field Agent.
      *   Case 1: Should clearly be "Yes" by intuition.
      *   Case 2: Should clearly be "No" by intuition.
      *   Case 3: A hard borderline case.
  *   **Rule for Agent:** The Agent **must** rule "Yes" or "No" based **strictly** on the written definition. They are forbidden from using intuition or asking the committee what they "meant." If the definition is silent or ambiguous, the Agent must declare "Undecidable."
  *   **Outcome:** Inevitably, the Agent will misclassify at least one case that the Committee intuitively agrees on, or declare a clear case "Undecidable."

  ### Phase 4: Debrief & Philosophical Mapping (25 Minutes)
  *   **Step 1: The Autopsy.** Why did the definition fail? (Usually: it was too narrow, excluded clear cases, or included clear non-cases).
  *   **Step 2: Family Resemblance.** Map the 24 cards on the board. Show that no single feature runs through all "Yes" cards. Draw the "overlapping fibers" image (*PI* §67).
  *   **Step 3: Agreement in Judgment.** Ask: "In Phase 1, you sorted these easily without a definition. How?"
      *   *Point:* You relied on shared human reactions, not rules. This is "agreement in forms of life" (*PI* §241).
  *   **Step 4: The Limit.** Discuss why the definition was demanded (the grant/bureaucracy) vs. how the word is actually used (the practice).

  ---

  ## Appendix A: The Corpus (The 24 Practices)
  *Features distributed: [Vocalization], [Hand Gesture], [Object Exchange], [Outdoor], [Pair], [Morning].*
  *Note: No single feature appears in all "Yes" cases.*

  **The "YES" Pile (Kora)**
  1.  Two people shake hands outdoors in the morning.
  2.  Two people exchange a stone outdoors in the morning.
  3.  Two people shout a phrase while exchanging a stone.
  4.  One person bows to another outdoors while shouting.
  5.  One person gives a flower to another in the morning indoors.
  6.  Two people walk in a circle together outdoors.
  7.  One person sings while bowing indoors.
  8.  Two people exchange a stone indoors in the evening.
  9.  One person shouts a phrase outdoors in the evening.
  10. Two people shake hands indoors in the evening.
  11. One person gives a flower to another outdoors while shouting.
  12. Two people walk in a circle together in the morning.
  13. One person bows to another indoors while exchanging a stone.
  14. Two people shake hands in the morning while shouting.
  15. One person sings while walking in a circle outdoors.

  **The "NO" Pile (Not Kora)**
  16. One person eats bread alone indoors. (0 features)
  17. Two people fight violently outdoors. (Shares [Outdoor], [Pair])
  18. One person shouts a phrase alone at night. (Shares [Vocal])
  19. Two people shake hands while fighting. (Shares [Hand], [Pair] - *Context breaks it*)
  20. One person gives a stone to a dog. (Shares [Object] - *Recipient breaks it*)
  21. Two people stand silently outdoors at noon. (Shares [Outdoor], [Pair])
  22. One person sings alone in the shower. (Shares [Vocal])
  23. Two people exchange money indoors. (Shares [Object], [Pair] - *Commercial context*)
  24. One person bows to a statue. (Shares [Hand/Gesture] - *Recipient breaks it*)

  ---

  ## Appendix B: The Charter (Definition Rules)
  1.  **Format:** "X is Kora if and only if..."
  2.  **Atomic Features Only:** You may only use observable physical features (e.g., "involves vocalization," "occurs outdoors"). You may not use interpretive terms (e.g., "ritual," "friendly," "respectful").
  3.  **No Disjunctions:** You cannot say "A or B." You must find the *common essence*.
  4.  **Universality:** The definition must cover all 15 "Yes" cards and exclude all 9 "No" cards.

  ---

  ## Predictable Failures & Facilitator Fixes

  ### Failure 1: The "Disjunctive Cheat"
  **What happens:** Students realize there is no common essence, so they write a definition like: *"Kora is either (Hand + Vocal) OR (Object + Outdoor) OR..."*
  **Why it's a problem:** This admits family resemblance immediately, ruining the "trap." It bypasses the essentialist struggle.
  **The Fix:** Enforce **Charter Rule #3** ruthlessly. Tell them: "The Linguist's software cannot process 'OR' statements. It requires a single set of necessary conditions. If you submit a disjunction, the grant is automatically rejected." Force them to try to find the *one* thing that unites them. They will fail.

  ### Failure 2: The "Intuition Leak" during Adjudication
  **What happens:** The Field Agent is presented with a case. The definition is ambiguous. The Agent looks at the Committee, sees them nodding, and rules based on the nod, not the text.
  **Why it's a problem:** It hides the gap between the rule (definition) and the application (judgment).
  **The Fix:** The Facilitator acts as the "Software Compiler." If the Agent hesitates or looks at the group, interrupt: *"Agent, query the text only. Does Clause 3 cover this? Yes or No?"* If the text doesn't say, the ruling must be "Undecidable."

  ---

  ## Limitations of the Game (Facilitator Notes)
  *Be frank with the students during the debrief about what this game cannot do.*

  **1. The "Bedrock" of Action**
  Wittgenstein argues that justification comes to an end not in a definition, but in **action** ("If I have exhausted the justifications I have reached bedrock, and my spade is turned. Then I am inclined to say: 'This is simply what I do.'" *PI* §217).
  *   **Limitation:** This game is still a *theoretical* exercise about a word. The students are not actually *living* a form of life where *Kora* matters. They are playing a sorting game.
  *   **Facilitator Supply:** You must explain that in real life, we don't stop to define "game" or "language" before using them. We act. The "agreement" Wittgenstein talks about is not a negotiated consensus (like in Phase 1), but a pre-linguistic, instinctive alignment in how we react to the world. The game simulates the *failure* of definition, but it cannot simulate the *success* of unreflective use.

  **2. The Static vs. Dynamic**
  *   **Limitation:** The 24 cards are static. Real language games evolve.
  *   **Facilitator Supply:** Point out that if the community changed, the "Yes" pile would shift. The concept isn't a fixed boundary (like a fence), but a living practice. The definition failed because it tried to freeze a fluid practice into a rigid mold.

  ## Debrief Questions (Mapping to *Investigations*)
  1.  **On Essentialism:** "Look at the definition you wrote. Which 'Yes' card does it accidentally exclude? (e.g., You said 'must involve two people,' but Card #7 is one person singing)." -> *PI* §66 ("Don't think, but look!").
  2.  **On Family Resemblance:** "If there is no common thread, why did you all agree on the sorting in Phase 1?" -> *PI* §67 (The overlapping fibers analogy).
  3.  **On Agreement:** "The Field Agent failed because they lacked your intuition. What does that say about the nature of meaning?" -> *PI* §241 ("So you are saying that human agreement decides what is true and what is false?" — It is what human beings *say*; and there they agree in the *language* they use. That is not agreement in opinions but in form of life.)

  ## Scoring Structure (Optional Gamification)
  *   **Committee Score:** Start with 100 points.
  *   **-10 points** for every "Yes" card excluded by the final definition.
  *   **-10 points** for every "No" card included by the final definition.
  *   **-20 points** if the Field Agent declares a case "Undecidable."
  *   **Win Condition:** It is mathematically impossible to win (score > 0).
  *   **Pedagogical Goal:** The "loss" is the lesson. If a group claims they won, inspect their definition for vague weasel-words (e.g., "socially significant") and disqualify them per Charter Rule #2.
