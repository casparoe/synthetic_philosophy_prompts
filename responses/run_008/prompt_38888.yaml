      *   **Mechanism:** Majority vote $\approx$ Averaging signals.
      *   **Conclusion:** As $N$ (voters) increases, probability of wrong decision drops exponentially. Therefore, majority rule is rational and infallible for large enough groups.

  3.  **Evaluate the Signal Processing Analogy (Correspondence Table):**
