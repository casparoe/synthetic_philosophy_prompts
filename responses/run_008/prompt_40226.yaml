answer: |-
  Your intuition is grappling with the tension between two distinct functions of school history: **epistemic integrity** (teaching what is known to be true) and **civic formation** (shaping how citizens view their nation). Your gut verdicts are actually quite consistent, but they rely on a hybrid principle that you haven't fully articulated. The tension you feel over the 1619 Project is the stress point where these two functions collide.

  To build a principle that holds your cases together, we need to move beyond simple "accuracy" because history teaching always involves selection and framing. The distinguishing factor in your "Not Okay" cases (Japan, Texas, China, UK) is not just error, but **asymmetric accountability**. In every case you rejected, the curriculum minimizes the state's own moral failures while either ignoring them entirely or contrasting them with the failures of others. In the "Okay" cases (Tulsa, Germany), the state is actively incorporating suppressed truths about its own conduct.

  The 1619 case is the outlier because it isn't an omission; it's an interpretive prioritization. However, you correctly identified the weakness: if we condemn Texas for distorting the role of slavery, we must be consistent about what the evidence supports regarding the Revolution. If the "strong version" (mainly to protect slavery) contradicts the weight of historical consensus, treating it as the *organizing story* without qualification violates the same epistemic standard you applied to Texas. To make the principle robust, you have to concede that interpretive freedom has limits when it hardens into dogma that contradicts the evidentiary balance.

  Here is the candidate principle that best captures your verdicts, along with the necessary adjustments.

  ### The Principle: Asymmetric Transparency and Evidentiary Proportionality

  This principle argues that state-sponsored history has a specific duty to avoid self-exoneration. It allows for debate, but not at the expense of hiding domestic crimes or presenting contested theories as settled facts.

  **Clause 1: The Non-Exoneration Clause.**
  Curricula must not systematically minimize or omit atrocities committed by the state or its predecessors while simultaneously highlighting atrocities committed by others.
  *   **Motivating Cases:** This is the primary driver for your **China** verdict (Japanese crimes vs. Great Leap Forward) and the **UK** verdict (Abolition vs. Bengal Famine). It also covers the **Japanese Comfort Women** case (minimizing own crime) and the **Texas** case (minimizing own crime).
  *   **Verdicts Saved:** It explains why China and UK are "Not Okay" despite not technically "lying" about the events they do include. It saves the **Germany** and **Tulsa** verdicts because they represent the inverse: prioritizing domestic accountability.

  **Clause 2: The Consensus Constraint.**
  Factual claims regarding cause and effect must align with the weight of peer-reviewed historical consensus; where consensus is lacking, the curriculum must present the debate rather than a single conclusion.
  *   **Motivating Cases:** This handles the **Texas** textbook (enslaved people as "immigrant labor" contradicts factual consensus on chattel slavery). It also handles the **China** textbook (omitting the Famine contradicts demographic consensus).
  *   **Verdicts Saved:** It solidifies the "Not Okay" verdicts on Texas and China.

  **Clause 3: The Interpretive Distinction.**
  Contested historiographical frameworks may be taught, but only if framed as interpretations subject to evidence, not as the sole organizing truth of a period.
  *   **Motivating Cases:** This is where your **1619** verdict requires adjustment. If the curriculum foregrounds the 1619 framing as *the* story without acknowledging the significant historical debate regarding the Revolution's primary causes, it violates this clause.
  *   **Verdicts Saved:** It allows the 1619 material to be *included* (saving the spirit of your "fine" verdict) but requires the *pedagogy* to change (overturning the "fine" verdict on how it is presented).

  ### Overturned Verdicts

  To maintain logical consistency, you must overturn or qualify your verdict on the **1619-style framing**. You currently say it is "fine" to make it the organizing story. However, if the Texas textbook is "not okay" because it misrepresents the role of slavery in the Civil War (a settled historical question), then the 1619 curriculum is "not okay" if it presents the role of slavery in the Revolution (a contested historical question) as settled fact. You can keep the material, but you cannot make it the *exclusive* lens without acknowledging the debate. This aligns it with the **Consensus Constraint**.

  ### New Case Predictions

  **1. The Dokdo Case (Korea):**
  This case tests the boundary between history and civics. Teaching that Dokdo is "indisputably Korean" without airing the Japanese claim is historically inaccurate because the sovereignty *is* disputed internationally, even if Korea controls the territory. Under the **Consensus Constraint**, presenting a disputed sovereignty claim as an indisputable historical fact is propaganda. However, under the **Non-Exoneration Clause**, this isn't about hiding a crime.
  *   **Prediction:** **Not Okay** as *history* teaching (violates Consensus Constraint), but **Okay** as *civics/national education* (state promoting territorial integrity). Since your context is history class, the verdict is Not Okay.

  **2. The French Algerian War Case (Made Up):**
  A French curriculum that describes the Algerian War solely as a "police action" to maintain order, omitting the use of torture by French paratroopers documented by historians.
  *   **Prediction:** **Not Okay**. This violates the **Non-Exoneration Clause** (hiding domestic atrocity) and the **Consensus Constraint** (contradicting established records on torture).

