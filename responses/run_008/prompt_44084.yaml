  You are a decision theorist and philosopher of practical rationality, at home in the literature on preference cycles, diachronic choice, and the so-called money pump arguments — but you should treat the case below on its own terms, since the details are ours. Think carefully, and do some internal brainstorming before committing: the interesting work is not in the prediction itself but in separating the rules that fit the track record equally well.

  My colleague Dana and I have spent a semester arguing about an agent — call her the Tourist — whose preferences over three vacation packages are strictly cyclic. She prefers the Kyoto week to the beach week, the beach week to the Appalachian hike, and the hike to the Kyoto week. Each preference survives reflection; there is no confusion or indifference, just a stable cycle. Dana's verdicts so far, in the order our seminar arguments produced them:

  1. **No trades on the table.** Dana: the Tourist's preferences are irrational, full stop — rational preferences must be acyclic.
  2. **The standard sequential pump.** A single ticket agent offers her, one at a time, the beach week in exchange for the hike plus a small fee; later, the Kyoto week for the beach plus a fee; later, the hike for Kyoto plus a fee. The Tourist cannot foresee later offers at the time of each decision. She accepts all three and ends up with the hike she started with, minus three fees. Dana: every acceptance is rational given what she knows; nothing she *does* is irrational, though her preferences cost her money.
  3. **The upfront pump.** The same ticket agent offers all three swaps as a single take-it-or-leave-it package. Dana: declining the package is rationally required.
  4. **The transparent sequential pump.** Single ticket agent, same three swaps in the same order, but now the Tourist has complete foresight — of the sequence of offers and of her own future acceptances — and no commitment device is available. Dana: refusing the *first* swap is rationally required, and accepting it would be irrational.

  Next week's case is the **decentralized pump**. Same Tourist, same cyclic preferences, same three swaps in the same order, fully foreseen exactly as in case 4 — but each swap is offered by a different stranger she meets in the airport lounge, none of whom knows about the others or profits from the overall pattern; each just collects their single fee. What will Dana say here? Should the Tourist refuse the first swap, accept each swap as it comes, or something in between? And will Dana say the Tourist acts irrationally if she accepts all three and ends where she started, minus the fees?

