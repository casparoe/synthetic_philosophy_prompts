answer: |-
  # Session Plan: The Nonidentity Problem in Mitochondrial Replacement Therapy (MRT)
  **Time:** 90 Minutes
  **Goal:** Equip the committee to distinguish between *harming a future child* and *causing a specific child to exist with a condition*, and to navigate the ethical implications without relying on misleading legal or rights-based shortcuts.

  ---

  ## I. Preparation & Materials (Pre-Meeting)
  *   **Handout:** One-page case summary (see Section II) + a glossary of three terms (*Identity-Dependent*, *Person-Affecting Principle*, *Impersonal Comparison*).
  *   **Room Setup:** Whiteboard essential. You will need to draw the "Branching Paths" diagram live.
  *   **Facilitator Note:** You are not there to solve the ethics of MRT. You are there to install a specific *conceptual tool* (the Nonidentity Problem) so they don't use the wrong tools (standard harm analysis) during consults.

  ---

  ## II. The Carrying Example (Minutes 0–15)
  **Objective:** Secure intuitive agreement on the identity logic before introducing the moral controversy.

  *   **The Case:** Use the **"Rubella/Temporary Condition" Case**, *not* Parfit's Depletion Case, and *not* the MRT case itself yet.
      *   *Scenario:* A woman has a temporary viral infection. If she conceives *now*, the child will have a manageable but lifelong disability (e.g., deafness). If she waits *three months*, the virus clears, and she conceives a *different* child (numerically distinct) who will not have the disability.
      *   *Decision:* She conceives now.
  *   **Why this instinct is correct (and what you lose):**
      *   *Keep your instinct:* Parfit's depletion case (energy policy affecting future generations) is too abstract for clinicians. They need a medical decision tree.
      *   *What you lose:* You lose the "distant future" scale, but you gain clinical fidelity.
      *   *Risk Mitigation:* By using a *temporary* condition rather than MRT immediately, you prevent the OBs from getting bogged down in the biological specifics of mitochondrial DNA vs. nuclear DNA identity. You isolate the *logic* of identity dependence.
  *   **Activity:**
      1.  Ask the Genetic Counselor to confirm the biological premise: Does waiting change *which* child is conceived? (Establish the "Different Child" fact).
      2.  Ask the Group: "Did the mother make the child *worse off* than that *specific child* would otherwise have been?"
      3.  **Target Consensus:** No. Without the decision to conceive now, *this* child would not exist.

  ---

  ## III. The Logical Trap: Harm vs. Existence (Minutes 15–45)
  **Objective:** Define the Nonidentity Problem (NIP) and head off the three primary misconceptions.

  *   **Step 1: The Person-Affecting Principle (Minutes 15–25)**
      *   Explain the intuition: We usually think an act is wrong only if it makes some *particular person* worse off.
      *   Show the breakdown: In the Rubella case, the child is not worse off than they would have been (since the alternative is non-existence).
      *   **Signal Settled vs. Contested:**
          *   *Settled:* The logic holds. If identity depends on the choice, standard "harm" analysis fails. (Draw the branching paths on the whiteboard: Path A = Child X (Disabled); Path B = Child Y (Enabled). You cannot compare X to Y).
          *   *Contested:* Whether this logic *exonerates* the choice.
  *   **Step 2: Head Off Misconceptions (Minutes 25–45)**
      *   *Misconception 1: "No Standing to Complain."*
          *   *Intervention:* Acknowledge the child cannot say "I was harmed."
          *   *Correction:* Distinguish *complaint* from *wrong*. A right can be violated even if the victim benefits overall (e.g., breaking a promise to give someone a gift they enjoy). Do not let the committee equate "no grievance" with "ethically permissible."
      *   *Misconception 2: Consent.*
          *   *Intervention:* The Lawyer or Lay Members may ask, "Did the child consent?"
          *   *Correction:* Shut this down immediately. Consent applies to existing agents. Applying it to non-existents is a category error. Mark this as a **Dead End** in ethical reasoning.
      *   *Misconception 3: Wrongful Life Litigation.*
          *   *Intervention:* The Lawyer will note that courts reject "wrongful life" suits.
          *   *Correction:* Distinguish *Legal Doctrine* from *Ethical Obligation*. The law bars these suits for policy reasons (difficulty calculating damages), not because the ethical problem is solved. **Do not let the legal precedent settle the ethical question.**

  ---

  ## IV. Contested Territory: Where the Logic Runs Out (Minutes 45–75)
  **Objective:** Move past the problem into the solutions, clearly marking where philosophy disagrees. This is the most critical section for managing expectations.

  *   **Transition Signal:** "We have established the puzzle. Now we must look at the proposed solutions. Here, there is no consensus."
  *   **Issue 1: Impersonal Principles (Minutes 45–60)**
      *   *The Proposal:* We stop comparing *Person to Person* and start comparing *World to World*. (World A: Child X exists with disability. World B: Child Y exists without).
      *   *The Conflict:* Some argue this is the only way out. Others argue it leads to the "Repugnant Conclusion" (prioritizing total happiness over specific people).
      *   **Facilitator Note:** **Take No Side.** Present this as "Option A: Shift to Impersonal Comparison." Ask the Chaplain and Lay Members: "Does this feel like we are valuing 'states of affairs' over 'people'?"
  *   **Issue 2: Rights Talk (Minutes 60–65)**
      *   *The Conflict:* Can a child have a "right to an open future" or a "right to healthy genes" if exercising that right prevents their existence?
      *   **Facilitator Note:** **Signal Suspension.** Tell the committee: "In these specific consults, standard rights-talk may break. You may need to speak in terms of *responsibilities to the future* rather than *rights of the child*."
  *   **Issue 3: Worse Than Non-Existence? (Minutes 65–75)**
      *   *The Conflict:* Is a life with mitochondrial disease "worse than never existing"?
      *   *The Trap:* If the condition is severe enough, the NIP dissolves (because the child *is* harmed by being born). If it is manageable, NIP holds.
      *   **Facilitator Note:** **Mark as Clinical Judgment.** This is not philosophy; this is prognosis. The OBs and GC must define the threshold. If the life is deemed "not worth living," NIP doesn't apply. If it is "worth living but impaired," NIP applies.
      *   *Action:* Ask the GC: "For the conditions we treat with MRT, are we in the 'manageable' zone or the 'lethal' zone?" (This anchors the abstract problem to their clinical reality).

  ---

  ## V. Application to MRT & Closing (Minutes 75–90)
  **Objective:** Return to the real consults and define success.

  *   **Applying to MRT (Minutes 75–85)**
      *   Remind them: In MRT, if the alternative is *no child* or *a different embryo*, the NIP applies.
      *   **The Script:** When parents ask, "Is this fair to the child?"
          *   *Wrong Answer:* "Yes, because the child will have a good life." (Ignores the identity issue).
          *   *Wrong Answer:* "No, because you are risking their health." (Assumes standard harm).
          *   *Better Answer:* "The child who would be born without this procedure would be a different child. We are not choosing between a healthy version of *this* child and a sick version. We are choosing which child to bring into existence."
  *   **What Not to Resolve (Minutes 85–88)**
      *   Explicitly state: "We are not deciding today if MRT is permissible. We are deciding how to *frame* the permissibility question."
      *   Warn them: If you leave thinking NIP *solves* the ethics (i.e., "It's fine because no one is harmed"), you have misunderstood. NIP *complicates* the ethics.
  *   **Success Criteria (Minutes 88–90)**
      *   **How to know they understood:**
          *   *Failure:* They say, "So, we can't be sued?" or "So, the parents can do whatever they want?"
          *   *Success:* They say, "We can't use standard harm benchmarks for this consult," or "We need to explain to the parents that they aren't harming *this* future child, but they are making a choice about *which* child to have."
      *   **Closing Question (Leave them with this):** "If we cannot say the child was harmed, on what grounds do we justify limiting the parents' choice? Is it societal cost? Is it the intrinsic value of health? Or is it something else?"
      *   *Purpose:* This forces them to realize NIP removes the easy "harm" justification and forces them to find a harder, more honest ethical foundation.

  ---

  ## VI. Facilitator Signals: Settled vs. Contested
  *Use these verbal markers to ensure the committee knows when you are stating fact vs. opinion.*

  1.  **Settled (The Logic):** "Philosophers and ethicists agree on the structure of this problem: if the choice determines identity, standard harm comparisons fail."
  2.  **Contested (The Verdict):** "There is deep disagreement on whether this makes the action permissible. Some say yes; others say we must use impersonal principles."
  3.  **Taking a Side (Your Recommendation):** "For the purpose of *this committee's counseling*, I recommend we suspend 'rights of the child' language in these specific cases, because it logically misfires. This is my recommendation, not a settled fact."

  ---

  ## VII. Risk Management
  *   **If the Lawyer insists on Wrongful Life precedent:** "That doctrine prevents *liability*, it does not resolve *moral duty*. We are here to advise on duty."
  *   **If the Chaplain argues all life is a gift:** "That addresses the value of the existing child. It does not address the choice between *this* child and *that* child. We can honor the gift while still questioning the selection process."
  *   **If the OBs demand a 'Go/No-Go' rule:** "I cannot give you a rule. I can only give you the map of the ethical terrain. The rule depends on where you stand on the 'Impersonal Principles' question we discussed."
