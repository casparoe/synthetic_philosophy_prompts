prompt: |-
  I sit on the clinical ethics committee of a hospital preparing to offer mitochondrial replacement, and I've been given ninety minutes at next month's meeting to bring the committee up to speed on the nonidentity problem. The audience: two obstetricians, a genetic counselor, a lawyer, a chaplain, and two lay members. No philosophy among them, and no patience for it either, though they're very good at noticing when an argument smells off. The occasion is real: we expect consults in which a prospective parent asks whether going ahead is fair to the future child, and the honest answer requires the committee to see that the child who exists if we proceed would not have existed otherwise — that the choice is not between a harmed child and an unharmed one, but between this child and no child.

  Don't write the explanation itself; plan it. What has to come first, and what depends on what. Whether the carrying example should be a two-option fertility case in which each option yields a genetically different child, one with a modestly elevated risk of a manageable condition — my instinct is that Parfit's depletion case is too distant from our consults, but tell me if that instinct is wrong and what my case loses by being this close to home. The misconceptions I should expect: "no one has standing to complain, so nothing wrong was done"; thinking the whole issue is about consent; sliding from "the child wasn't made worse off" to "the child wasn't wronged"; the lawyer's urge to run it through wrongful-life litigation as if the doctrine settles the ethics. Where in the sequence each one should be headed off, and which one is best left until the end and turned into the closing question.

  Two further requirements. First, I need to know where the session will force me past the problem into genuinely contested territory — whether a life can be worse for its bearer than never existing, whether impersonal principles are the way out or a bridge too far, whether the committee's rights talk can survive the problem or has to be suspended for these consults. Mark clearly, in the plan, where I'd be reporting a settled point and where I'd be taking a side, and tell me how to signal that distinction to a committee that will want "the answer" — the worst outcome is their leaving convinced there is a received solution when what I'd actually be handing them is one position in an open dispute. Second, say what I should openly refuse to resolve in ninety minutes, and how I'll know by the end whether they've understood the problem rather than merely been unsettled by it.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clinical ethics committee (CEC).
      *   **Task:** Plan a 90-minute presentation on the Nonidentity Problem (NIP) for a hospital committee preparing to offer mitochondrial replacement therapy (MRT).
      *   **Audience:** 2 obstetricians, 1 genetic counselor, 1 lawyer, 1 chaplain, 2 lay members. (No philosophers, impatient with abstraction, good at spotting bad arguments).
      *   **Context:** Real consults expected. Prospective parents asking if proceeding is fair to the future child.
      *   **Core Insight:** The choice is between *this* child (with mitochondrial disease risk/condition) vs. *no* child (or a *different* child if using donor eggs/MRT).
      *   **Constraints:**
          *   Do *not* write the explanation itself; plan it.
          *   Determine sequence/dependencies.
          *   Select the carrying example (Fertility case vs. Parfit's depletion).
          *   Address specific misconceptions (standing, consent, harm vs. wrong, wrongful-life litigation).
          *   Identify where the session moves from "settled" to "contested" (worse than non-existence, impersonal principles, rights talk).
          *   Signal distinction between reporting settled points vs. taking a side.
          *   Specify what *not* to resolve in 90 mins.
          *   Define success criteria (understanding vs. unsettlement).

  2.  **Deconstruct the Audience & Context:**
      *   *Clinicians (OBs, GC):* Focused on patient care, risk/benefit, clinical guidelines. They want to know what to tell patients.
      *   *Lawyer:* Focused on liability, precedent, wrongful life suits. Needs to distinguish legal doctrine from ethical reasoning.
      *   *Chaplain:* Focused on meaning, sanctity, pastoral care. Might worry about "playing God" or the value of disabled lives.
      *   *Lay Members:* Focused on common sense, public perception, intuition.
      *   *Time:* 90 minutes is tight for NIP. It needs to be punchy and practical.
      *   *Topic:* Mitochondrial Replacement Therapy (MRT). This is crucial. MRT prevents transmission of mitochondrial disease. If they don't do MRT, the child might have the disease. If they *do* do MRT, it's a different embryo (genetically distinct regarding mitochondria, arguably a different identity in the Parfitian sense if we consider the germ-line alteration fundamental, though often NIP is framed around *delaying* conception or using donor gametes). *Correction:* In MRT, the nuclear DNA is the same, mitochondrial DNA is different. Does this trigger NIP? Yes, if one argues the specific combination of nDNA + mtDNA constitutes the unique identity, or if the alternative is using a donor egg entirely. However, the prompt implies the classic NIP setup: "The child who exists if we proceed would not have existed otherwise." This usually applies if the alternative is *not* conceiving now, or conceiving later with different gametes. In MRT, if the alternative is "no child" or "adoption," NIP applies. If the alternative is "a different embryo via donor egg," NIP applies. If the alternative is "this embryo untreated," then it's standard harm. *Crucial Nuance:* The prompt states: "the honest answer requires the committee to see that the child who exists if we proceed would not have existed otherwise." This implies the committee is treating the MRT vs. No-MRT decision as identity-affecting. I must follow this premise for the plan, even if biologically debatable, because that's the ethical frame provided.
      *   *Instinct Check:* The user prefers a fertility case (two options, different children) over Parfit's depletion case.
          *   *Pros:* Closer to home, clinically relevant.
          *   *Cons:* Might conflate NIP with standard risk/benefit analysis. Might trigger "disability rights" objections too early.
          *   *Decision:* Stick with the user's instinct but refine it. A "Fertility Case" is better than "Depletion" for clinicians. But it needs to be distinct enough from the MRT case itself to avoid immediate defensive posturing. A case about *delaying* conception to treat a condition vs. conceiving now with the condition is the classic medical NIP example (e.g., rubella or temporary medication).

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Hook & The Intuition (Minutes 0-15)**
          *   Need to start with the clinical reality.
          *   Avoid philosophy jargon.
          *   Use the "Fertility Case" (User's instinct). Why? Depletion is too abstract (future generations). A clinical case resonates with OBs/GC.
          *   *Risk:* Being "too close to home" might make them defensive about MRT immediately. *Mitigation:* Use a hypothetical *different* condition first (e.g., temporary teratogen exposure) to isolate the logic before applying to MRT.
          *   *Goal:* Establish the "Same Person vs. Different Person" distinction.

      *   **Phase 2: The Logical Trap (Minutes 15-45)**
          *   This is where the NIP is defined.
          *   Address the "Harm" principle. Person-Affecting View.
          *   *Misconception 1:* "No standing to complain." Address early. Just because they can't complain doesn't mean the act was neutral.
          *   *Misconception 2:* Consent. Address here. You can't consent for a non-existent being.
          *   *Misconception 3:* Wrongful Life. The Lawyer needs to hear this early so they don't derail the ethics with case law. Distinguish *legal* wrongful life (usually barred) from *ethical* wrongness.

      *   **Phase 3: The Contested Territory (Minutes 45-75)**
          *   This is where I must signal "Settled" vs. "Contested."
          *   *Settled:* The logic of NIP holds (identity dependence).
          *   *Contested:* Does this mean the action is permissible?
          *   *Impersonal Principles:* Introduce the idea that we might compare states of affairs (World A vs. World B) rather than Person A vs. Person B.
          *   *Rights Talk:* Can we say rights were violated if the person wouldn't exist otherwise?
          *   *Worse than Non-existence:* The threshold question.
          *   *Signaling:* Use visual cues or verbal markers ("Here is where philosophy disagrees," "Here is where our committee must choose a stance").

      *   **Phase 4: Application & Closing (Minutes 75-90)**
          *   Bring it back to MRT.
          *   What *not* to resolve: Whether MRT is *actually* permissible. The NIP just clarifies the *structure* of the argument.
          *   Success Criteria: Do they understand the *structure*, not just feel uneasy?

  4.  **Refining the Misconceptions & Sequence:**
      *   *Lawyer:* Needs to know NIP doesn't validate wrongful life suits. Put this in Phase 2.
      *   *Chaplain:* Might worry about the "sanctity of life" vs. "quality of life." This fits in Phase 3 (Worse than non-existence).
      *   *Clinicians:* Want to know "Do I tell them it's safe?" Phase 4.
      *   *Sequence:*
          1.  Case Study (Fertility).
          2.  The Identity Logic (The "Aha" moment).
          3.  The "Harm" Problem (Person-Affecting Principle).
          4.  Legal/Consent/Standing (Head off the Lawyer/Consent objections).
          5.  The "So What?" (Impersonal principles/Contested ground).
          6.  MRT Application.

  5.  **Addressing the "Too Close to Home" Instinct:**
      *   User worries the fertility case is too close.
      *   *Analysis:* Parfit's depletion is too distant. A fertility case where Option A = Child 1 (Impaired), Option B = Child 2 (Unimpaired) is the standard medical NIP example (e.g., Parfit's "14-year-old girl" or the "Rubella case").
      *   *Verdict:* Stick with the fertility case. It's necessary for clinical buy-in. The risk is they conflate it with "disability is bad." Mitigate by emphasizing the *identity* shift, not the *disability* judgment.
      *   *What is lost?* You lose the intergenerational scope of Parfit, but you gain clinical relevance. For a hospital CEC, relevance is king.

  6.  **Addressing "Settled vs. Contested":**
      *   *Settled:* The logical structure of NIP (identity dependence).
      *   *Contested:* The moral conclusion (is it wrong?).
      *   *Signaling:* "Consensus on the Logic, Disagreement on the Verdict."
      *   *Rights Talk:* This is the big one. If rights depend on existence, NIP breaks rights talk. I need to flag this as a place where the committee might need to suspend rights-language for consequence-language.

  7.  **Addressing "What not to resolve":**
      *   Don't resolve whether MRT is ethical.
      *   Don't resolve the "Non-Identity Solution" (Impersonal principles vs. Person-Affecting).
      *   Success = They stop asking "Did we harm this child?" and start asking "Is this state of affairs acceptable?"

  8.  **Final Review against Constraints:**
      *   90 minutes? Yes, timed sections.
      *   No philosophy jargon? Keep it plain.
      *   Plan only, no explanation text? Yes.
      *   Address specific misconceptions? Yes.
      *   Mark settled vs. contested? Yes.
      *   Success criteria? Yes.

  9.  **Structuring the Output:**
      *   Use clear headings.
      *   Use bullet points for flow.
      *   Include "Facilitator Notes" for the "Settled vs. Contested" signaling.
      *   Ensure the tone is professional and strategic.

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally solve the NIP in the plan. The plan must show *how* to present the unsolved nature of the moral verdict while solving the *conceptual* confusion. Also, need to be careful with MRT specifics. MRT creates a child with 3 parents' DNA. If they don't do MRT, they might not conceive, or they might conceive a child with severe disease. If the child with severe disease is the *same* child (nuclear DNA same), NIP might not apply strictly. *However*, the prompt *insists* the premise is "the child who exists if we proceed would not have existed otherwise." I must accept this premise for the sake of the plan, perhaps by framing the alternative as "waiting for a donor egg" or "adoption" or acknowledging the mtDNA difference constitutes identity for the sake of the argument. I will note this in the "Carrying Example" section to ensure the example matches the premise provided by the user. Actually, the safest clinical NIP example is the "Rubella/Deafness" case (conceive now with risk vs. conceive later without risk). I will recommend this over a direct MRT hypothetical to avoid biological quibbles.

  *(Refining the "Lawyer" point)*: The lawyer will want to say "Wrongful Life claims fail, so we are fine." I need to make sure the plan explicitly blocks this move. Ethics != Law.

  *(Refining the "Chaplain" point)*: The chaplain might focus on the "gift of life." Need to ensure the "Worse than Non-existence" section allows space for this without derailing the logic.

  *(Final Polish)*: Ensure the distinction between "Understanding the Problem" and "Being Unsettled" is clear. Understanding = being able to articulate the dilemma. Unsettled = just feeling confused.

