answer: |-
  This is a classic confrontation: the "rationalist intuition" (take the math literally, minimize axioms) vs. the "working physicist intuition" (shut up and calculate, don't ontologize the tool). Your friend isn't wrong about the difficulties, but he is presenting contested philosophical objections as settled physical facts.

  Here is a claim-by-claim breakdown from the perspective of a sophisticated Everettian (specifically the Oxford School: David Wallace, Simon Saunders, Hilary Greaves), with confidence flags and an analysis of where the ground is soft.

  ---

  ### Claim 1: "Everett's theory says the universe literally splits into parallel copies."

  **Verdict:** **Conflation of Ontology and Emergence.**
  A serious Everettian would **concede** that this is how the theory is often popularized, but **reject** it as fundamental ontology.

  *   **The Everettian View:** The fundamental reality is *one* universal wavefunction evolving unitarily according to the Schrödinger equation. It does not "split." "Branches" or "worlds" are not fundamental particles; they are emergent structures within the wavefunction, much like a "tornado" is an emergent structure of air molecules. There is no precise moment where one world becomes two; there is just a continuous process of decoherence causing the wavefunction to develop distinct, non-interfering peaks.
  *   **The Conflation:** Your friend is treating "worlds" as discrete, countable objects (like marbles) that get created. In Wallace's view, asking "when did the split happen?" is like asking "exactly at which molecule does a heap of sand become a pile?" It's a vague, emergent concept.
  *   **Confidence:** **[High]**. This is standard terminology in modern MWI literature. The "splitting" language is widely acknowledged by proponents as a pedagogical shortcut that causes exactly this kind of confusion.

  ### Claim 2: "Decoherence explains why the branches don't interfere, so we never notice the other copies."

  **Verdict:** **Mostly Correct, with a Technical Caveat.**
  An Everettian would **agree** with the mechanism but **qualify** the "never."

  *   **The Everettian View:** Decoherence is the physical process that suppresses interference terms between components of the wavefunction exponentially fast. For all practical purposes (FAPP), the branches are separate.
  *   **The Caveat:** Decoherence is not *exact*; it is approximate. In principle, interference could be reversed (quantum erasure), but for macroscopic systems, the thermodynamic cost makes this effectively impossible. Everettians accept this approximation as sufficient for defining "worlds."
  *   **Confidence:** **[Very High]**. Decoherence theory is standard quantum mechanics, not specific to MWI. Everyone agrees on the math here; the disagreement is on what the math *means*.

  ### Claim 3: "The theory has no way to explain why the Born-rule probabilities come out the way they do... at worst it predicts each branch is equally likely."

  **Verdict:** **The Core Live Objection.**
  This is the hardest claim. An Everettian would **concede** this is the hardest problem (the "Probability Problem") but **deny** that "counting branches" is the correct way to calculate probability.

  *   **The "Counting" Error:** The friend's argument ("if both happen, they should be 50/50") relies on the idea that branches are discrete and countable. As noted in Claim 1, they aren't. The wavefunction is a continuum. You can decompose the wavefunction into branches in infinitely many ways depending on the basis you choose. "Counting worlds" is mathematically ill-defined in the formalism.
  *   **The Decision-Theoretic Derivation (Wallace/Deutsch):** This approach doesn't try to derive probability from "frequency of worlds." Instead, it argues that a rational agent who knows they are in an Everettian multiverse *must* place bets according to the Born Rule to avoid being Dutch-booked (guaranteed loss). It treats probability as a guide to action, not just frequency.
  *   **Is it a Crack or Dissolved?** This is where the rubber meets the road. Critics (like Adrian Kent or Tim Maudlin) argue this is circular: you have to smuggle in probabilistic assumptions to get probability out. Proponents argue it's no more circular than deriving logic from logic.
  *   **Confidence:** **[Moderate / Contested]**. This is the single most debated topic in foundations of physics. A foundations person would nod that this is the *argument*, but would not agree on whether the argument *succeeds*.

  ### Claim 4: "Because many-worlds makes exactly the same predictions as Copenhagen, there's no experiment that could settle it."

  **Verdict:** **True for "Textbook" Copenhagen, False for Collapse Models.**
  An Everettian would **agree** regarding standard Copenhagen but **point out** the category error.

  *   **The Nuance:** "Copenhagen" is not a single theory.
      1.  **Instrumentalist Copenhagen:** "Shut up and calculate." This makes no ontological claims, so it is empirically equivalent to MWI by definition (they use the same math).
      2.  **Objective Collapse (e.g., GRW, Penrose):** These *modify* the Schrödinger equation to make collapse real. These **do** make different predictions (usually at very large mass scales). MWI predicts no collapse; GRW predicts spontaneous collapse. Experiments are currently trying to test this (macroscopic superposition).
  *   **The Conflation:** Your friend is treating "Copenhagen" as a rival physical theory when it is often a stance on how to use the theory. MWI claims to be the *only* theory that takes the Schrödinger equation as universally true.
  *   **Confidence:** **[High]**. It is a matter of record that Objective Collapse theories are empirically distinct, while Instrumentalist Copenhagen is defined to match the math.

  ### Claim 5: "Preferring Everett is an aesthetic choice, not physics."

  **Verdict:** **Philosophically Loaded.**
  An Everettian would **reject** the dichotomy between "aesthetics" and "physics."

  *   **The Argument:** Physics relies on theoretical virtues: simplicity, unity, explanatory power. MWI removes the "Collapse Postulate" (a non-linear, non-unitary, undefined mechanism) from the axioms. Copenhagen keeps the math but adds a "black box" (measurement) that isn't defined by the math.
  *   **Occam's Razor:** This isn't just "taste"; it's a methodological heuristic. If Theory A requires Axioms {1, 2} and Theory B requires Axioms {1, 2, 3}, and they predict the same data, Theory A is scientifically preferable *unless* Axiom 3 does extra work. Everettians argue Collapse does no work other than matching intuition.
  *   **Confidence:** **[Moderate]**. This moves from physics to philosophy of science. Some physicists believe only empirical falsifiability counts (Van Fraassen's constructive empiricism); others believe theoretical virtues track truth (Scientific Realism).

  ---

  ### Summary of the "Counting Branches" Objection

  To answer your specific question: **Is the "counting branches" point a real crack?**

  Yes, it is a real crack *if* you assume worlds are countable discrete entities. That is why serious Everettians (Wallace-style) **do not count branches.** They argue that "branch count" is not a physical quantity.

  Does the Decision-Theoretic derivation **dissolve** the problem?
  *   **If you accept Decision Theory as fundamental to rationality:** Yes, it dissolves it. It shows the Born Rule is the only consistent way to act.
  *   **If you think Probability must be about "chance" of existence:** No, it doesn't dissolve it. It changes the subject to "betting behavior."

  This is why the objection persists. It depends on what you think probability *is*.

  ---

  ### The "Least Bet" Point

  You asked for the single point in this whole answer I would least bet real money on.

  **The Point:** **"The Decision-Theoretic derivation successfully resolves the Probability Problem without circularity."**

  **Why:**
  While I presented the Wallace/Deutsch argument as the "Everettian response," this is the weakest link in the entire MWI chain.
  1.  **Philosophical Resistance:** Many philosophers of physics (e.g., David Albert, Meir Hemmo) remain unconvinced. They argue that deriving "ought" (how to bet) from "is" (the wavefunction structure) requires a hidden probabilistic premise.
  2.  **The "Incoherence" Problem:** Before you can decide how to bet, you have to make sense of what it *means* to say an outcome has a probability less than 1 if *all* outcomes definitely happen. Decision theory assumes you care about probability; MWI has to explain why you should care about amplitude-squared rather than just "number of successors" (which, again, is ill-defined, but the intuition persists).
  3.  **Conference Reality:** If you walk into a foundations of physics conference (like a PSi Meeting), you will find a room split 50/50 on whether this derivation works. It is not settled science. It is active, heated research.

  **Confidence on this specific verdict:** **[Low/Moderate]**.
  *Would a foundations person nod along?* Some would vigorously. Others would stand up and call it "sophistry."
  *Why flag this?* Because if the Born Rule cannot be derived from the unitary formalism alone, MWI loses its claim to being "minimal." It would have to add the Born Rule as a separate postulate, which weakens its Occam's Razor advantage significantly.

  ### Final Takeaway for Your Drink Conversation

  Your friend is right that MWI is not empirically distinct from *Instrumentalist* Copenhagen, and he is right that the Probability Problem is the hardest hurdle.

  However, he is wrong to treat "branch counting" as a valid refutation (Everettians don't do that), and he is wrong to dismiss the removal of the Collapse Postulate as mere "aesthetics." In the history of physics, removing ad-hoc axioms (like the ether or epicycles) is usually considered progress, not just taste.

  The disagreement isn't really about physics; it's about whether you think a physical theory should describe reality (Realism/MWI) or just predict observations (Instrumentalism/Copenhagen). That is a philosophical bet, not a physical one.
