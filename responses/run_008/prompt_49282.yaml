prompt: |-
  So I've been a many-worlds sympathizer ever since I absorbed the rationalist canon on it — you know, "just take the wavefunction seriously and delete the collapse postulate", decoherence does the actual work, Occam points at MWI because it's the minimal ontology. But the other night a friend of mine who's a physics postdoc went off on it over drinks, and now I'm genuinely less sure where I stand. His summary went roughly like this:

  'Everett's theory says the universe literally splits into parallel copies every time a quantum event with more than one possible outcome happens. Decoherence explains why the branches don't interfere, so we never notice the other copies of ourselves. But there's a cost: since every outcome actually happens in some branch, the theory has no way to explain why the Born-rule probabilities come out the way they do — at best it just postulates them on top of the formalism, at worst it predicts each branch is equally likely, which flatly contradicts experiment. And because many-worlds makes exactly the same predictions as Copenhagen, there's no experiment that could settle it, so preferring Everett is an aesthetic choice, not physics.'

  Go through this claim by claim for me. For each piece, tell me what a serious Everettian (Wallace-style, say, though I never actually finished his book) would concede, where my friend is subtly conflating two things the position keeps apart, and where he's taking a live objection that people still argue about and presenting it as settled. Specifically: is the "counting branches gives equal probabilities" point a real crack in the theory that the decision-theoretic derivation of the Born rule is trying to patch, or does that derivation actually dissolve the problem? Also, does his final conclusion — that it's all just taste — follow from the parts he gets right, or is something being smuggled in there, like treating "Copenhagen" as a well-defined competitor when half the complaint about it is that it isn't?

  One more thing: as you go, flag how confident you are in each verdict (like, would a foundations-of-physics person nod along, or would this be contested at a conference), and call out the single point in your whole answer you'd least bet real money on. I'd rather know where the ground is soft than get a confident-sounding essay.
