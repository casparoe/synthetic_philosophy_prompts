          3.  MWI cannot explain Born-rule probabilities (either postulates them or predicts equal probability per branch).
          4.  MWI makes the same predictions as Copenhagen (empirically equivalent).
          5.  Therefore, preferring MWI is an aesthetic choice, not physics.
