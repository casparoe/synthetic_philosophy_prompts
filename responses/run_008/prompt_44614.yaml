  here's why it confuses me as a person who writes code. if I simulate this, and track "fraction of awakenings where the coin was heads," I get 1/3. if I track "fraction of coin flips that came up heads," I get 1/2. both simulations are correct! so my working hypothesis is that the whole fight is secretly about which statistic is the one that maps onto "credence," and maybe neither side is wrong, they're just answering different questions and calling both of them "probability." but I'm not sure that's right either, because of the update problem: suppose mid-experiment beauty is told "btw it's monday." thirders conditionalize and go to 1/2, fine, but a straightforward halfer conditionalizing on the same info goes to 2/3, which is batshit given the coin is fair. so the halfers spawn double-halfers who refuse to update at all, which seems to break bayes. you can't just wave that away as "different questions."

