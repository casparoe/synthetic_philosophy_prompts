answer: |-
  Consider Elias Thorne, who in 1950 dashed off *Winter Harbor* in three days using cheap brushes to pay rent, caring little for the result, yet it was later acclaimed as a masterpiece of spontaneity. Decades later, forgotten and destitute, Thorne secretly recreated *Winter Harbor* on a new canvas, not to deceive for profit initially, but to recapture the vision he felt he failed to execute; he used superior materials, labored over every brushstroke for months, and corrected the compositional flaws of the rush job, intending to pass this second canvas off as the 1950 original to survive. The two canvases are perceptually nearly identical to the naked eye, differing only in micro-texture detectable by experts, but the second canvas represents a deliberate, mastered execution of the image, whereas the first was a lucky accident of haste.

  Here is how the three views process these facts. First, the **Purely Perceptual View** holds that aesthetic value resides entirely in the sensory experience provided to a properly situated viewer. Since the scenario stipulates the canvases are indistinguishable to the naked eye, this view must verdict that the two works possess equal aesthetic value; the history of production is irrelevant to what is seen. Second, **Denis Dutton's Performance View** argues that art is a form of human performance, where value is derived from the skill, difficulty, and achievement manifested in the creation. Normally, this condemns forgery as a parasitic performance, but here the "original" was a low-skill accident while the "forgery" was a high-skill mastery; consequently, on the specific metric of artistic achievement, this view is pushed to rank the fake above the genuine article. Third, **Nelson Goodman's Autographic View** distinguishes arts like painting where the history of production is constitutive of the work itself. Because the second canvas lacks the correct history of production (it is not the 1950 object), Goodman's view maintains it is a different work entirely and lacks the authenticity required to hold the value of the original, regardless of its physical qualities.

  The feature driving Dutton's view to favor the fake is the **disparity in skilled intentionality** between the two instances (luck versus mastery). If you remove this feature—say, if Thorne labored equally on both—the performance value of the original returns, and Dutton's view reverts to favoring the genuine article because the forgery becomes merely a reproductive copy rather than a superior realization. A defender of the primacy of originals would argue that the late canvas is a copy of a particular historical object rather than a fresh instance of the creative achievement; they would claim artistic value requires *novelty of conception*, not just technical execution, so the second canvas merely replicates an existing solution rather than solving a artistic problem. This reply can stick only if one defines "achievement" as strictly conceptual genesis, but it struggles if "achievement" includes technical realization, since the second canvas objectively displays more control.

  Ultimately, the **Perceptual** and **Goodmanian** views should bite the bullet: the former remains consistent with its empiricist roots, and the latter remains consistent with its structuralist definition of authenticity. **Dutton's view**, however, should revise. If his theory allows a forgery to outrank an original, it undermines the intuitive link between authenticity and value that his performance account aims to protect; he needs to nuance his theory to distinguish between *technical* achievement (which the fake has) and *creative* achievement (which belongs only to the first instance).
