      *   Dutton: This is the tricky one. Dutton usually argues against forgery because it misrepresents the performance. But if the *actual performance* on canvas B is superior to canvas A, does the misrepresentation outweigh the quality of performance? The prompt wants the case to push Dutton toward ranking the fake above. I need to highlight that Dutton values *human achievement*. If A was luck and B was skill, B represents more human achievement.

