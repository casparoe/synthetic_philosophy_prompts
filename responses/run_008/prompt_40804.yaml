      *   Dutton: Revise. Because if his theory allows fakes to be better, it undermines the moral/intuitive core of his anti-forgery stance. He needs to distinguish between *technical* achievement and *creative* achievement.

  7.  **Drafting the Response:** (Mental check of paragraph counts and headers).

