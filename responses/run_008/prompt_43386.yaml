prompt: |-
  so, full disclosure up front: I'm a novelist, not a philosopher, and I'm in over my head, which is exactly why this needs doing properly rather than me winging it.

  the background: my next book is about a woman who spent her whole career as a planetary astronomer, and in 2006, at the IAU general assembly in prague, she watched a floor vote kick her life's object of study out of the planet club. (pluto, obviously.) while researching her I fell into thomas kuhn, and now, partly because of the book, I've somehow ended up refereeing between two friends who have been arguing about this stuff for years and have long since stopped hearing each other. my editor suggested they try an adversarial collaberation and produce one joint document, and I said I'd commission it, and they said fine, but I have to write up the terms of reference first. that's what I want from you.

  the two of them: one is a kuhnian of the later, weaker variety — he talks about local incommensurability and something like a no-overlap principle, where after a revolution the old and new taxonomies can't quite be mapped onto each other in certain places, but he does NOT hold the wild reading on which nobody across a divide can understand anybody at all. the other is a scientific realist of roughly the popper-putnam-davidson flavor: theory comparison is always possible in principle, translation failure is an empirical hiccup and not a deep fact about science, and if you can't say which of two theories is better, that's a fact about you, not about the world. (her words, more or less. she's like that.)

  what I want is the document they'd both actually put their names to. specifically:

  1. a numbered section of agreed claims, about the history of science as such — real cases both accept happened and meant something: copernicus, oxygen vs phlogiston, the way mass means something slightly different in newton versus einstein. and if they can agree on anything about what the 2006 vote actually was, I want that in there too, because it's the case I actually care about for the book.

  2. a disagreements table: each residual disagreement stated so that its own side would sign the wording. I've been burned before by phrasings where one side gets to describe the other's view for them, so I want every row basically self-attributed.

  3. the cruxes. I suspect one is whether the pluto thing is a miniature paradigm shift or just bookkeeping — a definitional stipulation by a committee, which even my kuhnian friend admits might be too boring to count. another is what to say about the truth of sentences like the claim that there are nine planets, printed in a 1990 textbook: false all along? true then and false now? true only relative to a taxonomy? that one matters to me enormously, because my protagonist has to be able to insist her old papers weren't lies. and if any part of their whole fight turns out to be verbal — I've started to suspect the word incommensurable itself does a lot of sneaky work — I want that said out loud, with which part and why.

  4. for each crux, one concrete case both sides agree bears on it, with each side's prediction written down in advance. I'd suggest ceres for the pluto crux: it got called a planet when it was found in 1801 and was quietly dropped from the list later in the century once the asteroids started piling up, all without any vote or manifesto. if the two of them can't agree on what to predict about how that case differs from the 2006 one, that failure itself goes in the document. honestly it would be the most useful thing in it for me, because my book is about a person, not a committee, and I need to know whether her world changed or just her filing system.

  keep it in plain english — these two slide into jargon when unsupervised and my editor will cut it. no bibliographies, no reading lists, no citations; I want claims and reasoning I can check against the book I'm writing, not homework.
reasoning: |-
  Here's a thinking process that leads to the suggested Terms of Reference document:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about a planetary astronomer affected by Pluto's 2006 reclassification.
      *   **Task:** Create a "Terms of Reference" document for an adversarial collaboration between two philosopher friends.
      *   **The Philosophers:**
          *   *Friend A (Kuhnian):* "Later, weaker variety." Believes in local incommensurability/no-overlap principle (taxonomies don't map perfectly after revolutions), *not* total unintelligibility.
          *   *Friend B (Realist):* Popper-Putnam-Davidson flavor. Believes theory comparison is always possible, translation failure is empirical/temporary, truth is objective.
      *   **Requirements:**
          1.  Numbered section of agreed claims (historical cases + Pluto 2006).
          2.  Disagreements Table (self-attributed wording).
          3.  The Cruxes (Pluto = paradigm shift vs. bookkeeping? Truth value of "9 planets" in 1990? Verbal disputes?).
          4.  Concrete Cases for Cruxes (e.g., Ceres vs. Pluto) with predictions.
      *   **Tone/Style:** Plain English (no jargon), no citations/bibliographies, actionable for a novelist.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Kuhnian (A):* Science isn't just linear accumulation. Categories change meaning. "Planet" in 1990 isn't exactly "Planet" in 2007. The 2006 vote might reflect a deeper shift in how astronomers *see* the solar system.
      *   *Realist (B):* Science gets closer to the truth. Categories track reality. If we changed the definition, it's because we learned more about the objects. "Planet" refers to a natural kind (or attempt thereof). The 1990 claim was false (or imprecise), now we know better.
      *   *Common Ground:* Science changes. Pluto's status changed. Specific historical events happened (Copernicus, Lavoisier, Einstein).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need historical cases both accept.
      *   *Copernicus:* Earth moves vs. Earth stays. Both agree the *description* of the world changed fundamentally.
      *   *Phlogiston/Oxygen:* Both agree the *ontology* changed (phlogiston doesn't exist).
      *   *Mass (Newton/Einstein):* Both agree the *concept* shifted (invariant vs. relative).
      *   *Pluto 2006:* This is tricky. They need to agree on *what happened*, not necessarily *what it means*.
      *   *Drafting:* Focus on the observable facts. A vote occurred. A definition was adopted. Pluto did not meet the new definition. The count changed from 9 to 8.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Constraint: Self-attributed wording. No "He says X" vs "She says Y." Instead "Side A claims..." / "Side B claims..."
      *   *Issue 1: Nature of the Change.* A: Conceptual shift. B: Discovery of facts.
      *   *Issue 2: Translation/Understanding.* A: Some loss of meaning across the divide. B: Full translation possible.
      *   *Issue 3: Truth.* A: Context-dependent. B: Timeless (mostly).

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Paradigm vs. Bookkeeping.* Is 2006 a mini-revolution or just cleaning up?
      *   *Crux 2: Truth of Past Statements.* Was "Pluto is a planet" (1990) false, or true-relative-to-framework? This is crucial for the protagonist.
      *   *Crux 3: Verbal Dispute.* Is "incommensurability" just a fancy word for "hard to translate"?
      *   *Novelist Angle:* The protagonist needs to know if her life's work was "wrong" or just "contextual."

  6.  **Drafting Section 4: Concrete Cases & Predictions:**
      *   *Case:* Ceres (1801).
      *   *Why:* It was a planet, then an asteroid, no vote.
      *   *Prediction A (Kuhnian):* Ceres change was gradual taxonomic drift; Pluto was a forced rupture.
      *   *Prediction B (Realist):* Ceres change was correction of error; Pluto was correction of error. The mechanism (vote vs. consensus) doesn't change the epistemic status.
      *   *Alternative Case:* Eris. Discovery forced the hand.
      *   *Decision:* Stick with the prompt's suggestion (Ceres) but ensure the predictions highlight the *difference* in mechanism.

  7.  **Refining Tone and Language:**
      *   *Constraint:* Plain English. No "epistemic," "ontological," "verisimilitude," "taxonomic structure."
      *   *Strategy:* Use words like "categories," "rules," "facts," "meaning," "mistake."
      *   *Voice:* Formal but accessible. Like a contract or a brief.

  8.  **Review against Constraints:**
      *   Numbered section? Yes.
      *   Disagreements table? Yes.
      *   Cruxes included? Yes.
      *   Concrete cases/predictions? Yes.
      *   No jargon? (Need to watch out for "paradigm," "ontology," "incommensurability" - define or replace).
      *   Protagonist's concern addressed? (The truth of her old papers).

  9.  **Self-Correction during Drafting:**
      *   *Critique:* Initially, I might make the Realist sound too dismissive.
      *   *Fix:* Ensure the Realist acknowledges that scientists *feel* like the world changed, even if she thinks only the map changed.
      *   *Critique:* The Kuhnian shouldn't sound like a relativist who thinks truth doesn't exist.
      *   *Fix:* Emphasize "local" differences. They can talk, but some concepts don't line up perfectly.
      *   *Crucial Point:* The prompt asks for the document *I* (the AI) write for *them* to sign. It needs to look like a Terms of Reference.
      *   *Wait, one nuance:* The prompt asks for "The document they'd both actually put their names to." This means I am drafting the *Terms of Reference* that governs their collaboration, which *includes* the agreed claims, disagreements, etc. as appendices or sections within the ToR. Or is the ToR *just* the rules, and the content is what they produce?
      *   *Re-reading:* "I have to write up the terms of reference first. that's what I want from you... 1. a numbered section of agreed claims... 2. a disagreements table..."
      *   *Interpretation:* The user wants the *content* of the collaboration document, structured as a Terms of Reference agreement. It's a hybrid: a contract that stipulates what they agree on and how they will disagree.
      *   *Refinement:* Let's structure it as a "Joint Statement of Ground Rules and Substantive Positions." This satisfies the "Terms of Reference" request while delivering the specific content points (1-4).

  10. **Final Polish:** Check the "Plain English" constraint. Ensure "incommensurability" is explained or replaced. Ensure the protagonist's emotional stake (were my papers lies?) is addressed in the Truth Crux.

      *(Self-Correction on "Incommensurability"):* The prompt says "if any part of their whole fight turns out to be verbal — I've started to suspect the word incommensurable itself does a lot of sneaky work — I want that said out loud." I need to make sure Section 3 addresses this specifically.

      *(Self-Correction on Pluto 2006):* The Kuhnian admits it might be "too boring to count" as a revolution. I need to reflect that nuance. It's a "boundary case."

      *(Final check on Ceres):* Make sure the predictions are distinct. If they predict the same thing, it's not a crux.
      *   Kuhnian: Ceres was drift (normal science). Pluto was rupture (revolutionary moment).
      *   Realist: Both were error correction. The vote is irrelevant noise.

      Let's assemble.

      *Structure:*
      Title
      Preamble (Purpose)
      Section 1: Agreed Historical Facts
      Section 2: Table of Residual Disagreements
      Section 3: Defined Cruxes (The "Why We Are Still Arguing" section)
      Section 4: Test Cases & Predictions (The "How We Settle It" section)
      Sign-off lines.

      *Tone:* Professional, precise, neutral.

      *Let's write.*
answer: |-
  **JOINT STATEMENT OF GROUNDS AND OBJECTIVES**
  **Project:** The Pluto Classification Dispute
  **Parties:** [Name of Kuhnian Proponent] and [Name of Scientific Realist]
  **Commissioned By:** [Novelist Name]
  **Date:** [Current Date]

  **PREAMBLE**
  This document sets the terms for our collaboration. We acknowledge that we disagree on the deep structure of scientific change. However, to assist the commissioned novel, we agree to isolate exactly where we disagree and where we do not. We commit to plain English. We will not use specialized philosophical jargon (e.g., "ontology," "verisimilitude," "referential opacity") without defining it in everyday language. If a disagreement turns out to be merely about word choice, we will declare it "Verbal" and move on.

  ***

  ### 1. AGREED CLAIMS (HISTORY AND FACT)
  *Both parties sign below as accepting these statements as true descriptions of what happened.*

  1.  **Copernicus:** When the solar system model shifted from Earth-centered to Sun-centered, astronomers did not just add new facts; they rearranged the entire map. What counted as "motion" changed.
  2.  **Phlogiston vs. Oxygen:** When chemistry shifted from phlogiston theory to oxygen theory, scientists did not keep the old concepts. They stopped believing phlogiston existed at all.
  3.  **Newton vs. Einstein:** The word "mass" is used in both Newtonian physics and Relativistic physics, but they measure slightly different things. A scientist from 1800 and a scientist from 1950 would not fully agree on the definition, even if they could talk to each other.
  4.  **The 2006 Vote:** At the IAU General Assembly in Prague, a formal vote was taken. A new definition of "planet" was adopted. Pluto did not meet the new definition. The official count of planets in the solar system changed from nine to eight.
  5.  **The 1990 Textbook:** A textbook printed in 1990 stating "There are nine planets" was consistent with the professional standards and definitions of that time.
  6.  **The Protagonist's Work:** The astronomer protagonist did not make a mistake in her pre-2006 work. She used the standard categories of her time.

  ***

  ### 2. TABLE OF RESIDUAL DISAGREEMENTS
  *Each row describes a disagreement. The wording in each column is approved by that side as an accurate description of their own view.*

  | Topic | Side A (The Kuhnian) Claims: | Side B (The Realist) Claims: |
  | :--- | :--- | :--- |
  | **1. Nature of the Change** | The 2006 vote reflects a shift in how astronomers *group* objects. The category "planet" now carves nature at a different joint than it did in 1990. | The 2006 vote reflects a discovery of more objects (like Eris). We realized our old list was messy. The objects didn't change; our inventory did. |
  | **2. Translation** | You cannot perfectly translate the 1990 meaning of "planet" into the 2007 meaning without losing something. There is a small gap in meaning. | You can perfectly translate the meaning. "Planet" in 1990 meant "one of these nine objects." We now know two of those objects (Pluto, Ceres) are different kinds of things. |
  | **3. Truth of Past Statements** | The sentence "Pluto is a planet" was true relative to the 1990 framework. It is not true today. Truth depends on the system in use. | The sentence "Pluto is a planet" was always false, we just didn't know it yet. We were ignorant, not operating in a different truth system. |
  | **4. The Vote Itself** | The vote matters. It is a social marker that signals a change in the scientific community's vision. | The vote is irrelevant theater. The science was settled by the discovery of Eris; the vote was just paperwork. |

  ***

  ### 3. THE CRUXES
  *These are the specific points that determine the emotional and philosophical outcome of the book. We agree to focus our remaining energy here.*

  **Crux A: Revolution or Bookkeeping?**
  *   **The Question:** Is the 2006 event a miniature scientific revolution (a change in worldview) or merely administrative bookkeeping (cleaning up a list)?
  *   **Why it matters:** If it is a revolution, the protagonist's world actually changed. If it is bookkeeping, only her filing system changed.
  *   **Verbal Dispute Check:** We suspect we might be fighting over the word "revolution." If Side A means "a change in how we see things" and Side B means "a change in reality," we agree to label this a **Verbal Dispute** and note that both happened to different degrees.

  **Crux B: The Truth of the Protagonist's Career**
  *   **The Question:** Regarding the claim "Pluto is a planet" in a 1990 paper:
      *   **Option 1:** It was true then, false now. (Protects the protagonist's integrity).
      *   **Option 2:** It was false then, false now. (Implies the protagonist was mistaken).
  *   **Agreement:** We agree that Option 1 is necessary for the novel's emotional arc, even if Side B thinks Option 2 is philosophically stricter. We will phrase the novel's internal logic to allow the protagonist to say: "I was right by the lights of my time."

  **Crux C: The Word "Incommensurable"**
  *   **The Question:** Does this word mean "we cannot understand each other" (which we both reject) or "our categories do not map 1:1" (which we both accept)?
  *   **Resolution:** We agree to ban the word "incommensurable" from the text. We will replace it with **"Partial Mismatch."**
      *   **Side A** uses "Partial Mismatch" to say: Some meaning is lost in translation.
      *   **Side B** uses "Partial Mismatch" to say: Translation is hard work, but no meaning is fundamentally lost.

  ***

  ### 4. TEST CASES AND PREDICTIONS
  *To settle Crux A (Revolution vs. Bookkeeping), we apply our theories to a historical precedent.*

  **The Case: Ceres (1801–1850)**
  *   **Context:** Ceres was discovered in 1801 and called a planet. As more objects were found in the same belt (asteroids), it was quietly reclassified as an asteroid later in the 19th century. There was no single vote.

  **Predictions:**

  *   **Side A (Kuhnian) Prediction:**
      *   The Ceres change was **Drift**. It happened slowly as the community's habits changed.
      *   The Pluto change was **Rupture**. It happened via a vote because the community was forced to confront the category definition all at once.
      *   *Implication for Book:* The protagonist feels a rupture (2006) that is different from the slow drift of history (Ceres). Her pain is specific to the vote.

  *   **Side B (Realist) Prediction:**
      *   The Ceres change and the Pluto change are **Identical in Kind**. Both are corrections of error based on new data.
      *   The vote in 2006 is noise. The discovery of Eris is the signal.
      *   *Implication for Book:* The protagonist's pain is about letting go of the past, not about the vote itself. The vote is just a symbol she is clinging to.

  **Failure Condition:**
  If we cannot agree on whether the Ceres case differs from the Pluto case, we will mark Crux A as **Unresolved**. The novel will then present the ambiguity as a feature, not a bug: the protagonist herself will not know if her world changed or just her files.

  ***

  **SIGNATURES**

  _________________________ (Side A)

  _________________________ (Side B)

  _________________________ (Commissioning Author)
