answer: |-
  This is a sophisticated set of intuitions. You are navigating the **Knobe Effect** (the asymmetry between harm and help), **Control Conditions** (the manager case), and **Means vs. Ends** (the roommate/pharmacist cases).

  To unify these without discarding your verdict on the Manager (which is the hardest one to save), I propose the following principle:

  ### The Principle of Volitional Endorsement
  > An agent brings about a side effect **intentionally** if and only if:
  > 1.  They **foresee** the side effect;
  > 2.  They have **agency/control** over the action producing it; **AND**
  > 3.  Their practical reasoning **endorsed** the outcome, either as a goal, a chosen means, or an *accepted cost* (which applies asymmetrically to bad outcomes).
  >
  > *Crucially:* If the agent actively **opposed** the action (dissent/veto) but was overruled, Condition 3 fails, even if Condition 1 is met.

  Here is how this principle maps onto your cases, the Landlord verdict, and where the concept fractures.

  ---

  ### 1. Mapping Your Verdicts

  *   **CEO / Wetland (Harm):**
      *   *Foresee:* Yes. *Control:* Yes. *Endorsement:* **Tacit Acceptance.**
      *   *Why:* In moral psychology, proceeding with a plan while knowing it causes harm counts as "accepting the cost." Indifference to harm functions as endorsement.
      *   *Verdict:* **Intentional.** (Fits)

  *   **CEO / Wetland (Help):**
      *   *Foresee:* Yes. *Control:* Yes. *Endorsement:* **None.**
      *   *Why:* Indifference to a *good* outcome is not acceptance. It is mere foresight. He did not incorporate the help into his plan.
      *   *Verdict:* **Not Intentional.** (Fits)

  *   **Manager / Reorg (Harm):**
      *   *Foresee:* Yes. *Control:* **Partial/Overruled.** *Endorsement:* **Explicit Rejection.**
      *   *Why:* This is the key. She satisfied foresight, but she failed the endorsement test. She voted *no*. She explicitly excluded the harm from her will. Even though the harm happened, it happened *despite* her agency, not *through* it.
      *   *Verdict:* **Not Intentional.** (Fits)

  *   **Roommate / Diary (Privacy Violation):**
      *   *Foresee:* Yes. *Control:* Yes. *Endorsement:* **Chosen Means.**
      *   *Why:* To get the information (goal), she *had* to read the diary (means). She endorsed the violation as the necessary path to the help. The goodness of the final outcome doesn't erase the intentionality of the normative violation required to get there.
      *   *Verdict:* **Intentional Violation.** (Fits)

  *   **Pharmacist / Undercharging (Help):**
      *   *Foresee:* Yes. *Control:* Yes. *Endorsement:* **Chosen Goal.**
      *   *Why:* She actively altered her behavior (violating policy) *for the sake of* the help. The help was the reason for her deviation.
      *   *Verdict:* **Intentional Help.** (Fits)

  ---

  ### 2. The Landlord Verdict

  **Case:** A landlord never bothers raising rents to market because paperwork bores him, and tenants save hundreds a month as a result.

  **Application of Principle:**
  *   *Foresee:* Presumably yes (he knows rents are low).
  *   *Control:* Yes (he could file the paperwork).
  *   *Endorsement:* **None.**
      *   He did not adopt the tenants' savings as a goal.
      *   He did not adopt it as a means to anything.
      *   Did he "accept the cost"? No, because there is no cost to him he is weighing; he is avoiding effort. The benefit to the tenants is incidental to his laziness. It is a byproduct of inertia, not a product of his will.

  **Verdict:** **No, he did not intentionally help them.**
  He *benefited* them, and he *allowed* the benefit to persist, but he did not *intentionally help*. Your intuition should align with the CEO/Help case: mere foresight + inaction ≠ intentional help, unless the inaction is motivated by the help (which here, it is not).

  ---

  ### 3. Which Verdicts Can't Be Saved? (The Fracture)

  The Principle of Volitional Endorsement saves all five of your initial verdicts *if* we accept one specific tension: **The Asymmetry of Acceptance.**

  Notice the gap between the **CEO (Harm)** and the **CEO (Help)**.
  *   In the Harm case, "Indifference" counts as Endorsement.
  *   In the Help case, "Indifference" counts as Non-Endorsement.

  My principle glosses this over by calling it "Tacit Acceptance of Cost," but philosophically, this reveals that "Intentionally" is not tracking one thing. It is tracking two different things depending on the moral valence:
  1.  **For Bad Outcomes:** It tracks **Blameworthy Authority.** (Did you authorize this mess?)
  2.  **For Good Outcomes:** It tracks **Praiseworthy Motivation.** (Did you aim for this good?)

  **The verdict that is most at risk is the Roommate.**
  If "Intentionally" tracks *Praiseworthy Motivation* for good outcomes, the Roommate's outcome was good. But you said she *intentionally violated privacy*.
  *   My principle saves this by distinguishing the **Violation** (the means) from the **Help** (the end).
  *   However, if you believe "Intentionally" should be purely descriptive of causal flow, you might have to concede that she "Intentionally Helped" *and* "Intentionally Violated."
  *   If you feel she did *not* intentionally help (because her motive was complex or the violation taints it), then the principle holds. If you feel she *did* intentionally help, the principle still holds.
  *   **The real tension:** If you think the Roommate's violation makes the help *unintentional* (i.e., "She didn't really help me, she violated me"), then the concept of "Intentionally" is doing heavy moral lifting, not just causal description.

  ### 4. The Honest Conclusion

  You asked whether "intentionally" is just one thing. Based on your own verdicts, **no, it is not.**

  Your verdicts show that "intentionally" is a **cluster concept** that blends:
  1.  **Causal Control:** (The Manager didn't have enough; the CEO did).
  2.  **Volitional Alignment:** (The Landlord wasn't aligned; the Pharmacist was).
  3.  **Moral Valuation:** (The CEO's indifference counted for harm but not for help).

  The **Manager Case** is the nail in the coffin for a purely causal definition (Foresight + Outcome). If it were purely causal, she intended the harm because she knew it would happen and she was part of the company. Your verdict insists that **Dissent breaks the chain of Intentionality.**

  The **CEO Case** is the nail in the coffin for a purely volitional definition (Goal + Plan). If it were purely volitional, the CEO didn't intend the harm (he wanted profit). Your verdict insists that **Acceptance of Harm counts as Intentionality.**

  **Summary:**
  Your Principle of Volitional Endorsement is the best "single thread" to tie these together, but it only works because English speakers implicitly switch definitions based on whether the outcome is good or bad.
  *   **Landlord Verdict:** Not Intentional.
  *   **Coherence:** "Intentionally" is not one thing. It is a tool we use to assign **Authorship.** We assign authorship of harm more easily (via acceptance) than we assign authorship of help (which requires active aim). The Manager escapes authorship because she signed her name to the "No" column. The Landlord escapes authorship because he didn't sign his name to anything; he just didn't show up.
