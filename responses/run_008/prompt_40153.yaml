answer: |-
  # Activity Design: The Bertrand Workshop

  **Course:** Upper-Level Philosophy of Probability
  **Class Size:** 14 Students
  **Duration:** 75 Minutes
  **Topic:** Bertrand's Chord Paradox & The Principle of Indifference

  ## I. Learning Objectives
  1.  **Operationalize Indifference:** Students will experience how "at random" requires a specific choice of measure (parametrization).
  2.  **Empirical Conflict:** Students will generate conflicting probability estimates ($1/3, 1/2, 1/4$) from the same verbal prompt.
  3.  **Defend Parametrization:** Students will argue for the "naturalness" of their specific method before seeing the alternatives.
  4.  **Evaluate Resolutions:** The class will evaluate the paradox not as a mathematical error, but as a problem of model specification, culminating in a defense of the Jaynesian invariance solution.

  ## II. Materials & Setup (Improvised)
  You need three distinct "Packets" (A, B, C). Prepare 5 copies of each packet beforehand.
  *   **General:** 14 Clipboards (or hard books), 14 Pencils, 14 Tally Sheets.
  *   **Packet A (Random Endpoints):**
      *   Paper circle (radius ~10cm) with an **inscribed equilateral triangle** drawn clearly. One vertex at the top (12 o'clock).
      *   A paper spinner (cardboard square with a pin through the center) or a simple compass.
  *   **Packet B (Random Radius):**
      *   Paper circle (radius ~10cm) with a **single radius line** drawn from center to edge.
      *   The radius line is marked clearly at the **midpoint** (5cm).
      *   A "Distance Strip": A separate strip of paper exactly the length of the radius (10cm), unmarked.
      *   A ruler.
  *   **Packet C (Random Midpoint):**
      *   Paper circle (radius ~10cm) with a **concentric inner circle** drawn at half the radius (5cm).
      *   A pin or a small eraser (for dropping).
      *   A sheet of cardboard underneath (to catch the pin/damage).

  **Room Layout:** Three tables clustered separately. TAs stationed at each to keep time and enforce speed.

  ## III. Timing Plan (75 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Introduction** | Hand out packets. Do **not** mention Bertrand or the paradox. Give the "Cover Story." |
  | **00:05 – 00:25** | **Data Generation** | Groups generate chords. **Strict pace:** 1 chord per minute per student. Target: 50 chords/group. |
  | **00:25 – 00:30** | **Reporting** | Groups calculate % "Long Chords." Write large numbers on the whiteboard (Side-by-Side). |
  | **00:30 – 00:45** | **The Defense** | Structured debate. Groups argue why *their* method is the "true" random chord. |
  | **00:45 – 01:05** | **Debrief & Resolution** | Reveal the math. Map methods to measures. Instructor takes a stand (Jaynes). |
  | **01:05 – 01:15** | **Meta-Discussion** | Discuss physical limitations and the "Ill-Posed" verdict. Q&A. |

  ## IV. Student Instructions (The "Cover Story")
  *Hand these out face down. Tell students not to look until you say "Go." Do not allow groups to talk to each other.*

  **Prompt for All Groups:**
  > "We are investigating the geometry of circles. Your task is to generate **50 random chords** for your circle and determine how many are **'Long.'**
  >
  > A chord is **'Long'** if its length is greater than the side of the inscribed equilateral triangle. (Note: For your specific packet, we have provided visual guides to help you judge this quickly without measuring).
  >
  > Follow the **Chord Generation Protocol** on your sheet exactly. Do not deviate. Speed is critical; do not overthink the geometry."

  **Specific Protocols (Innocuous Phrasing):**

  *   **Group A (Endpoints -> P = 1/3):**
      > "1. Fix the first endpoint of the chord at the top vertex of the drawn triangle.
      > 2. Use the spinner to select a random angle for the second endpoint on the circumference.
      > 3. Draw the chord.
      > 4. **Visual Check:** If the second endpoint lands on the bottom arc (between the two lower triangle vertices), mark 'Long.' Otherwise, 'Short.'"

  *   **Group B (Random Radius -> P = 1/2):**
      > "1. Use the 'Distance Strip.' Close your eyes and tear the strip at a random spot.
      > 2. Measure the shorter piece. If it is shorter than the marked midpoint on the circle's radius, your chord distance is 'Inner.'
      > 3. Draw a chord perpendicular to the drawn radius at that distance.
      > 4. **Visual Check:** If your tear point was in the inner half (0 to 5cm), mark 'Long.' Otherwise, 'Short.'"
      > *(Note: This operationalizes uniform distribution over the radius length.)*

  *   **Group C (Random Midpoint -> P = 1/4):**
      > "1. Hold the pin/eraser 30cm above the circle. Drop it.
      > 2. Wherever it lands is the **midpoint** of your chord. (If it lands outside, re-drop).
      > 3. Draw the chord that has this point as its center.
      > 4. **Visual Check:** If the pin landed inside the small inner circle, mark 'Long.' Otherwise, 'Short.'"
      > *(Note: This operationalizes uniform distribution over the area.)*

  ## V. Displaying the Estimates
  On the whiteboard, draw three large circles side-by-side labeled **Group A**, **Group B**, **Group C**.
  *   Ask each group for their count (e.g., "17 out of 50").
  *   Write the fraction and the percentage.
  *   **Crucial:** Write the *Theoretical Expectation* in small grey chalk underneath *after* they report, or keep it hidden until the debrief. (Recommendation: Keep it hidden to preserve the shock, then reveal).

  ## VI. The Defense (Structured Debate)
  *Instructor Script:*
  "Look at the board. You all received the same verbal instruction: 'Generate a random chord.' Yet you have three different probabilities. Before I explain the mathematics, I want each group to spend two minutes preparing a defense. Convince the room that **your** protocol is the most natural interpretation of 'random chord.' Why is your method the standard? Why are the others biased?"

  *   **Group A Argument:** "Points on a circle are naturally measured by angle. The circumference is the boundary; choosing endpoints is the definition of a chord."
  *   **Group B Argument:** "A chord is defined by its distance from the center. Distance is linear. Why should area or angle weight the center differently than the edge?"
  *   **Group C Argument:** "The interior of the circle is the space available. Every point inside is equally likely to be a midpoint. This treats the whole disk fairly."

  *Instructor Role:* Play devil's advocate. If Group C says "Area is fair," ask Group B "Why isn't linear distance fair?" Let them feel the pull of their own parametrization.

  ## VII. Debrief & Instructor Position (20 Minutes)

  ### 1. Mapping the Measures
  Reveal the mathematical underpinnings.
  *   **Group A:** Uniform distribution on **Angle** ($\theta$). Measure $d\theta$. Result: $1/3$.
  *   **Group B:** Uniform distribution on **Linear Distance** ($r$). Measure $dr$. Result: $1/2$.
  *   **Group C:** Uniform distribution on **Area** ($dA$). Measure $r dr d\theta$. Result: $1/4$.

  **Key Point:** The Principle of Indifference says "treat possibilities as equal." But *which* possibilities? Points on the perimeter? Points on the radius? Points in the area? The principle is silent on the *space* of possibilities.

  ### 2. The Instructor's Verdict (Definite Position)
  *Do not remain neutral.* Take the following stance, while flagging its contestability.

  **Position:** **The Jaynesian Resolution (Method B, P = 1/2).**

  **Argument:**
  "While standard textbooks often conclude the problem is 'ill-posed' and leave it there, that is a surrender. E.T. Jaynes argued that if a problem is stated without specific physical details, we must assume the solution should not depend on information we were *not* given.
  1.  **Scale Invariance:** If I make the circle twice as big, the probability shouldn't change.
  2.  **Translation Invariance:** If I move the circle slightly on the table, the probability shouldn't change.
  3.  **Rotation Invariance:** If I rotate the circle, the probability shouldn't change.

  Method A (Endpoints) fails translation invariance (depends on where the circle is relative to the 'fixed' point). Method C (Midpoint/Area) fails scale invariance (area scales quadratically, length linearly). **Method B (Random Radius)** is the only derivation consistent with the group of transformations that leave the problem's description invariant. If you were to throw straws from a distance onto a circle on the floor, the distribution of chords converges to Method B."

  **Contested Move Flag:**
  "I must flag that this relies on **Objective Bayesianism**. It assumes 'probability' is a logical relation between propositions and that 'ignorance' imposes symmetry constraints. Subjective Bayesians will argue that without a specified generative process, *any* of the three are valid, and there is no 'true' probability. I am teaching you the Jaynesian view as a powerful tool for model selection, not as settled consensus."

  ## VIII. Handling Failure Modes

  ### 1. Small-Sample Noise
  *Risk:* With ~50 chords, Group A (1/3) and Group C (1/4) might overlap (e.g., 30% vs 28%).
  *Mitigation:*
  *   **Pivot:** If the numbers are muddy, do not fudge the data. Say: "The empirical noise is high, which is why we need the theory. Theoretically, these methods diverge. Let's look at the *mechanism*."
  *   **Visual Emphasis:** Focus on Group B (1/2). It is usually distinct enough from Group C (1/4) even with noise. Use the 1/2 vs 1/4 gap as the primary evidence of conflict.
  *   **TA Role:** TAs must ensure students aren't measuring. Measuring takes time. They must use the visual guides (inner circle, triangle vertices).

  ### 2. "Stacked Deck" Suspicion
  *Risk:* Students realize the instructions forced the outcome and dismiss the paradox as a trick.
  *Mitigation:*
  *   **Acknowledge and Reframe:** "You are absolutely right. The instructions *did* stack the deck. That is the entire lesson. The phrase 'at random' *is* the stacked deck. It smuggles in a parametrization without telling you which one. The activity didn't hide the bias; it *revealed* that the bias was in the language all along."
  *   **Validation:** Praise them for noticing. "If you felt your method was 'natural,' that confirms the psychological pull of the Principle of Indifference. The paradox works *because* all three feel natural."

  ## IX. Physical Limitations (The Meta-Problem)
  *This is the critical philosophical takeaway for the final 10 minutes.*

  **What the Activity Cannot Reproduce:**
  "The activity resolved the paradox by giving you **tools**.
  *   Group A got a spinner (implies angle).
  *   Group B got a ruler/strip (implies length).
  *   Group C got a pin drop (implies area).

  **The Paradox exists only in the text.** In the text 'Choose a random chord,' there is no spinner, no ruler, and no pin. The physical activity *cannot* reproduce the state of **true ignorance**. By handing you a device, I implicitly selected a measure for you.
  *   **The Lesson:** You cannot solve the Bertrand Paradox physically. You can only solve it by admitting that the problem description was incomplete. The 'solution' is not a number; it is a request for clarification: 'Random with respect to *which* measure?'"

  **Instructor Note:** This distinction prevents students from thinking the Jaynesian solution is a physical fact. It is a principled way to *choose* a measure when the physical mechanism is unspecified.

  ## X. Summary Checklist for Instructor
  1.  **Templates:** Ensure the "Visual Checks" (inner circle, triangle vertices, radius midpoint) are bold and clear.
  2.  **Timing:** Be ruthless at the 20-minute mark. Stop data collection even if they haven't finished 50.
  3.  **Debrief:** Stick to the Jaynesian script. Do not waffle into "all are equal" unless the class pushes back hard (in which case, concede to Subjective Bayesianism as the alternative).
  4.  **Language:** Use "Parametrization," "Measure," and "Invariance" during the debrief to elevate the discussion from geometry to philosophy.
