prompt: |-
  So i was a job reference for an old coworker (small field, everyone knows everyone, hard to say no to being a reference) and I think I torpedoed him without technically saying anything bad. The hiring manager called me, asked a bunch of stuff, then asked directly how he handles deadlines. I said he's a genuinely creative guy, one of the most inventive people I've worked with. Every word of that is true, and I'd say it to his face. He did not get the job, found out I was the reference, and now he's furious — says my answer was obviously a dodge, that everyone in hiring knows what it means when you praise someone's creativity right after being asked about deadlines, and that I knew perfectly well what signal I was sending. My position is that I never said a single false or negative thing, he can't point to one sentence I uttered that was wrong, so what he "read between the lines" is his inference, not my statement. His comeback is that this is a dishonest game I'm playing with myself: if the read was so obvious, then it was part of what I communicated, full stop, and hiding behind "I never said it" is just a loophole.

  Couple of wrinkles I keep going back and forth on: (1) nobody asked me a followup, so I never got a chance to say "and to be clear he's fine with deadlines" — does the fact that I could have added that, and pointedly didn't, make me more on the hook, or less? (2) at the time I honestly wasn't 100% sure whether I was being nice by finding something good to say, or being a coward about the deadline thing — does it matter for what I "meant" that my motives were muddled? (3) by his logic it seems like you can never give a lukewarm reference at all, since any true compliment in the wrong spot becomes sabotage — that can't be right either.

  Is there a principled line here between what someone literally says and what they communicate, and if so, which side of it was I actually on? Was I lying-adjacent, telling the truth, or something in between that deserves its own name? And am I obligated to call the hiring manager and clear the record, or does the record look exactly like what I meant it to look like?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The User:** Acted as a job reference for a former coworker.
      *   **The Context:** Small field, hard to say no.
      *   **The Incident:** Hiring manager asked about deadlines. User replied, "He's a genuinely creative guy, one of the most inventive people I've worked with." (True statement).
      *   **The Outcome:** Coworker didn't get the job. Coworker found out User was the reference. Coworker is furious, claiming the answer was a coded "no" regarding deadlines.
      *   **The Conflict:** User claims they told the truth and said nothing negative. Coworker claims the *implication* was the message, and hiding behind literal truth is dishonest.
      *   **The User's Questions:**
          1.  Does not volunteering clarification make them more culpable?
          2.  Does muddled motive matter?
          3.  Does the coworker's logic mean lukewarm references are impossible?
          4.  Is there a principled line between literal meaning and communicated meaning?
          5.  Was this lying-adjacent, truth, or something else?
          6.  Obligation to clear the record?

  2.  **Deconstruct the Communication Dynamics (Pragmatics vs. Semantics):**
      *   *Semantics:* The literal meaning of the words. "He is creative." (True).
      *   *Pragmatics:* The meaning in context. Question: "How does he handle deadlines?" Answer: "He is creative."
      *   *Grice's Maxims:* In conversation, we assume people are being relevant. If asked about X and you talk about Y, the implication is usually "I can't or won't talk about X, but Y is good." In reference checks, this is widely understood as a "soft no."
      *   *The "Damning with Faint Praise" / "The Non-Answer":* In the specific context of professional references, avoiding the specific question asked is a signal. It's a social code.

  3.  **Evaluate the User's Position vs. Coworker's Position:**
      *   *User:* "I didn't lie." Technically true. But references aren't just about factual accuracy; they're about *evaluation*.
      *   *Coworker:* "You signaled 'no' without saying 'no'." Also true, based on industry norms.
      *   *Verdict:* The User engaged in a "soft no." This is a common strategy to avoid conflict while protecting the hiring manager from a bad hire. However, doing this to a friend/coworker without their knowledge feels like a betrayal to them.

  4.  **Address the Specific Wrinkles:**
      *   *(1) Not volunteering follow-up:* This increases culpability. In reference checks, if you dodge, the silence *is* the message. Pointedly not clarifying confirms the dodge.
      *   *(2) Muddled motives:* It matters for *intent*, but not for *impact*. If the User was conflicted, they shouldn't have agreed to be a reference, or should have been honest with the coworker beforehand ("I can only speak to your creativity, not your deadlines").
      *   *(3) Lukewarm references:* The coworker is partially right. You *can* give a lukewarm reference, but usually, you warn the person ("I can only give a limited reference"). Blindly dodging questions is where it becomes problematic.

  5.  **Determine the "Principled Line":**
      *   The line is **Expectation Management**.
      *   If you agree to be a reference, there is an implicit contract: "I will advocate for you" OR "I will tell you if I can't."
      *   By agreeing to be a reference and then issuing a "soft no," the User broke the implicit contract of advocacy, even if they kept the contract of truthfulness.
      *   *Name for this:* "Paltering" (using truthful statements to convey a false impression) or "Strategic Ambiguity." In this context, it's a "Soft Reference."

  6.  **Formulate the Advice:**
      *   **Validate the User's discomfort:** It's a tough spot.
      *   **Acknowledge the Reality:** In hiring, the Coworker is right about the code. "Creative" in response to "Deadlines" = "Misses Deadlines." The User participated in this code.
      *   **Address the Ethics:** It wasn't a lie, but it was a breach of trust *between friends*. The User prioritized avoiding awkwardness with the hiring manager over honesty with the friend.
      *   **Answer the "Obligation":** Yes, there is an obligation to repair the friendship, but calling the hiring manager is risky (looks unprofessional/flip-floppy). Better to apologize to the friend.
      *   **Future Lesson:** How to say no to being a reference, or how to set boundaries beforehand.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic but firm. Don't let the User off the hook entirely, but don't vilify them.
      *   *Key Concept:* Gricean Maxims (Relevance). Explain *why* the hiring manager interpreted it that way.
      *   *The "Lie":* It's not a factual lie, it's a communicative deception.
      *   *Actionable Advice:* Apologize to the friend for the *method*, not necessarily the *opinion*. Don't call the hiring manager (too messy).
      *   *Refining the "Principled Line":* The line is between "Truthful Advocacy" and "Truthful Neutrality." The User promised Advocacy (by accepting the role) but delivered Neutrality/Negative.

  8.  **Final Polish:** Check against the specific questions asked.
      *   *Principled line?* Yes, Relevance/Expectation.
      *   *Lying-adjacent?* Yes, "Paltering."
      *   *Obligation?* To the friend, yes. To the hiring manager, no.
      *   *Wrinkles?* Addressed specifically.

  9.  **Self-Correction/Nuance Check:** Wait, did the User *intend* to torpedo him? The prompt says "I think I torpedoed him." It implies they knew the weakness (deadlines) and dodged. If they genuinely thought creativity was the *only* relevant thing, that's different. But the prompt implies they knew the deadline issue existed ("coward about the deadline thing"). I need to address that internal conflict. The User knew there was a problem, chose not to voice it, but also chose not to lie. That's the "Soft No."

      *Crucial distinction:* Did the User agree to be a *positive* reference or just *a* reference? Usually, asking someone implies "Please vouch for me." If you can't vouch, you should decline.

      *Final Plan:*
      1. Validate the coworker's interpretation (industry code).
      2. Define the ethical breach (Implicit contract of reference).
      3. Address the "Truth" argument (Semantics vs. Pragmatics).
      4. Answer the specific wrinkles.
      5. Provide next steps (Apology vs. Correction).

  10. (Final Review of the output structure): Ensure clear headings and direct answers to the specific questions. Make sure the distinction between "lying" and "misleading" is clear.

  *(Self-Correction during drafting)*: I should be careful not to tell them to call the hiring manager. That could look like coercion or unprofessionalism. The damage is done there. The repair needs to happen with the friend.

  *(Refining the "Name" for the behavior)*: "Paltering" is good. "Damning with faint praise" is good. "The Soft No" is practical. Let's use "The Soft No."

  *(Addressing the "Small Field" aspect)*: This makes it worse. Reputation matters. The friend feels betrayed because they are in the same circle.

