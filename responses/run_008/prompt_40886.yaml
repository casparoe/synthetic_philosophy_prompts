answer: |-
  This is a classic ethical collision between **semantic truth** (what the words literally mean) and **pragmatic meaning** (what the words communicate in context). You are arguing from semantics; your coworker is arguing from pragmatics.

  In the specific context of professional references, **your coworker is right.**

  Here is the breakdown of where you stand, the nature of the communication, and what you owe whom.

  ### 1. The Principled Line: Relevance and Expectation
  You asked if there is a principled line between what someone literally says and what they communicate. In linguistics and ethics, this is governed by **Grice's Maxims of Conversation**, specifically the **Maxim of Relation (Relevance)**.

  When two people converse, there is an implicit agreement that the answers provided will be relevant to the questions asked.
  *   **Question:** "How does he handle deadlines?"
  *   **Answer:** "He is creative."

  Literally, this is a true statement about the subject. Pragmatically, it is a violation of relevance. By not answering the question asked, you signaled that you *could not* answer the question asked truthfully in a positive way. In the hiring world, this is known as **"The Soft No."** It is a widely understood code. Hiring managers know that references rarely say, "He was terrible." Instead, they say, "He was interesting," or "He was creative," or "I wouldn't rehire him" (said with a pause).

  **The Principled Line:** The line is not between truth and lies. It is between **Advocacy** and **Neutrality**.
  *   When you agree to be a reference for a coworker in a small field, the implicit contract is **Advocacy**. You are saying, "I will vouch for your fitness for this role."
  *   By providing a non-answer to a critical competency question, you shifted to **Neutrality** (or negative signaling) without notifying the candidate.

  You broke the contract of advocacy while maintaining the contract of factual accuracy. That is why your coworker feels betrayed. They didn't ask for a fact-checker; they asked for a sponsor.

  ### 2. Was this Lying-Adjacent?
  Yes. There is a specific term for this: **Paltering.**
  Paltering is the active use of truthful statements to create a misleading impression. You did not lie. But you curated a truth ("He is creative") to obscure a deficit ("He misses deadlines") in a context where the deficit was the specific topic of inquiry.

  You are not "lying-adjacent" in the sense of fabricating data. You are "misleading-adjacent" in the sense of **omission by deflection.**

  To answer your specific question: **You were on the side of "Strategic Ambiguity."** This is a recognized category of communication where the speaker protects themselves from conflict (lying to the hiring manager or fighting with the coworker) by passing the interpretive burden to the listener. You protected your reputation with the hiring manager (by not lying) and your conscience (by not lying), but you sacrificed your coworker's trust.

  ### 3. Addressing Your Wrinkles

  **(1) The Follow-Up:**
  *Does the fact that I could have added "he's fine with deadlines," and pointedly didn't, make me more on the hook?*
  **Yes.** In a reference check, silence is data. If you knew there was a concern, and you chose not to mitigate it when you had the opening, you ratified the negative inference. If you truly believed he was fine with deadlines, the natural conversational flow would be: *"He's creative... and honestly, he gets his work in on time, too."* By stopping at "creative," you confirmed the hiring manager's suspicion.

  **(2) Muddled Motives:**
  *Does it matter that my motives were muddled?*
  **For your conscience, yes. For the outcome, no.** You admitted you weren't sure if you were being nice or a coward. That internal conflict is the smoking gun. If you were purely being "nice," you would have realized that a dodge isn't nice to the candidate. If you were purely being "honest," you would have declined the reference. The muddle suggests you knew you couldn't give a *good* reference, but you lacked the backbone to say no to the request. You prioritized your own discomfort over your coworker's clarity.

  **(3) Lukewarm References:**
  *By his logic, you can never give a lukewarm reference.*
  **Not quite.** You *can* give a limited reference, but **transparency is the key.**
  *   **Ethical Lukewarm:** "Hey, I'd be happy to be a reference, but I can only speak to your creative work, not your project management."
  *   **Unethical Lukewarm:** Agreeing to be a general reference, then answering specific questions about weaknesses with unrelated strengths.
  Your coworker's logic holds water because you accepted the role of "Reference" without setting boundaries on what you could vouch for.

  ### 4. What Do You Owe?

  **Do you call the hiring manager?**
  **No.** Do not do this.
  *   It looks unprofessional and flip-floppy.
  *   It puts the hiring manager in an awkward position (they made a decision based on the data you gave).
  *   It might look like you are pressuring them, which could hurt your coworker's future chances in that small field even more.
  *   The record looks exactly like what you meant it to look like *at the time*. Changing it now helps no one.

  **Do you owe the coworker?**
  **Yes.** You owe him an apology, but not for "lying." You owe him an apology for **mismanaging the reference.**

  You need to acknowledge that while you didn't lie, you participated in a "code" that you knew would hurt him, without warning him.

  **Suggested Script:**
  > "I've been thinking about what you said, and I want to apologize. You're right that in the hiring world, my answer read as a dodge. I didn't intend to sabotage you, but I also knew I couldn't give a glowing endorsement on the deadline question without stretching the truth. I should have told you beforehand that I wasn't the right person to vouch for that specific skill, rather than agreeing to be a reference and then hedging. I valued our working relationship and didn't want to lie to the manager, but I handled the conversation poorly and I'm sorry it cost you the opportunity."

  ### Summary
  You told the **truth**, but you violated the **trust**.
  In a reference check, truth without advocacy is often indistinguishable from sabotage. You played the "Soft No," which is a valid move for a hiring manager's benefit, but a betrayal of a friend's expectation.

  Own the impact, not just the intent. Apologize to the friend for the ambiguity, learn to say "no" to being a reference next time if you can't be enthusiastic, and let the hiring decision stand.
