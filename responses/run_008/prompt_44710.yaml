answer: |-
  ### Argument for Flip-Timing Irrelevance

  To argue that Late-Flip Beauty's Monday credence should equal Standard Beauty's Monday credence, we must isolate the *epistemic situation* from the *metaphysical timing* of the chance event. The core claim is that rational credence supervenes on the structure of centered possibilities and the agent's evidence, not on whether the truth-maker for a proposition is fixed in the past or indeterminate in the future.

  **1. The Isomorphism of Centered Worlds**
  We model Beauty's epistemic state using centered worlds $\langle w, t, x \rangle$, where $w$ is a possible world, $t$ is a time, and $x$ is an individual. In the **Standard** case, on Monday morning, the coin is already H or T. The live centered worlds compatible with her evidence ("I am awake now") are $\langle H, Mon, B \rangle$, $\langle T, Mon, B \rangle$, and $\langle T, Tue, B \rangle$. In the **Late-Flip** case, the coin is unflipped. However, the *predictive* branches of the future available to her are structurally identical: she is in a branch where she is awake Monday, and depending on the future coin outcome, she may or may not be awake Tuesday. The set of *subjectively distinguishable scenarios* she must navigate is the same: "Heads-Monday," "Tails-Monday," and "Tails-Tuesday."

  **2. Evidence and Truth-Makers**
  The objection to irrelevance rests on the idea that in the Standard case, "Heads" is a fixed fact, whereas in Late-Flip, it is a future chance. However, from Beauty's perspective inside the experiment, the *probative value* of her awakening is identical. In both cases, her awakening is guaranteed on Monday regardless of the coin. In both cases, a Tuesday awakening occurs if and only if Tails. Her evidence $E$ ("I am currently awake") eliminates the world $\langle H, Tue, B \rangle$ in both setups. If we accept that rational credence is a function of the prior probability distribution over centered worlds updated by self-locating evidence, the temporal location of the coin flip mechanism is external to the update rule. The "truth-maker" for *Heads* changes from a past state to a future state, but the *correlation* between *Heads* and *Number of Awakenings* remains invariant.

  **3. Decision-Theoretic Supervenience**
  If credence is to guide rational action, it must align with betting quotients in identical payoff structures. Consider a bet offered on every awakening: pay \$1 to win \$2 if Heads. In both Standard and Late-Flip, Beauty faces this bet on Monday. If Tails, she faces it again on Tuesday. The expected utility calculation relies entirely on the probability of Heads per awakening. Since the payoff matrix and the sequence of decision nodes are isomorphic, assigning different credences would lead to divergent rational actions in structurally identical decision problems. To avoid this fragmentation of rationality, we must accept that the credence is invariant.

  **The Weakest Step:**
  The most vulnerable inference is **Step 2** (Evidence and Truth-Makers). This step assumes that the *modal status* of the coin (fixed past vs. open future) is epistemically inert provided the correlation structure holds. This is contested because it potentially violates the **Principal Principle**. In Late-Flip, the coin is a future fair chance event. Standard epistemology suggests that without "admissible evidence," credence in a fair coin should match its objective chance (1/2). Claiming irrelevance forces us to admit that self-locating evidence ("I am awake") can shift credence away from objective chance even *before* the chance event occurs. This is a heavy metaphysical cost, implying a form of logical correlation between present existence and future randomness that many find untenable.

  **Costs to the Camps**
  *   **For the Halfer:** Accepting irrelevance does **not** dodge the famous Dutch Book objections. In the Late-Flip case, the betting structure is identical to Standard (one bet Monday, potentially one bet Tuesday). If a Halfer sets $P(H)=1/2$ in Late-Flip, they are safe on a single Monday bet, but if they maintain $P(H)=1/2$ in Standard (via irrelevance), they remain vulnerable to the standard Dutch Book which exploits the *sequence* of bets across awakenings. Irrelevance aligns the credences but does not fix the betting vulnerability inherent in the "Tails implies two bets" structure.
  *   **For the Thirder:** Accepting irrelevance is far more costly. In the Standard case, a Thirder says $P(H)=1/3$ because the coin is fixed and the sampling is biased. In Late-Flip, if they maintain $P(H)=1/3$ on Monday, they are asserting that a rational agent should assign 1/3 to a *future fair coin flip* solely based on the fact that they are awake. This requires claiming that self-locating evidence overrides the Principal Principle regarding future chances. They must argue that "I exist now" is admissible evidence about a coin that hasn't been tossed, implying a suspicious correlation between their temporal location and the outcome of a stochastic process.

  ***

  ### Inferential Step Table

  | Step # | Claim or inference | Status | Pushback |
  | :--- | :--- | :--- | :--- |
  | 1 | The decision trees and payoff structures for Standard and Late-Flip Beauty are isomorphic. | Stipulation of the setup | None; this follows from the problem description. |
  | 2 | The set of centered worlds compatible with "I am awake" is structurally identical in both cases ($H_{Mon}, T_{Mon}, T_{Tue}$). | Settled among specialists | Some argue the *ontological status* of the H/T worlds differs (fixed vs. branching), affecting the sample space. |
  | 3 | Rational credence supervenes on the partition of centered worlds and evidence, not the metaphysical timing of truth-makers. | Genuinely contested | Externalists and Principal Principle defenders argue future chance events constrain credence differently than past facts. |
  | 4 | Therefore, Monday credence in Heads must be equal in both the Standard and Late-Flip variants (Irrelevance Claim). | Genuinely contested | Those who prioritize the Principal Principle will accept Late-Flip $P(H)=1/2$ but reject Standard $P(H)=1/2$, denying irrelevance. |
  | 5 | Accepting Irrelevance forces Thirders to violate the Principal Principle regarding future fair coins. | Settled among specialists | Thirders may deny the violation by redefining what counts as "admissible evidence" in self-locating contexts. |

