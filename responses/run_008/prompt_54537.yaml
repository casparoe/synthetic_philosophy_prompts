answer: |-
  **Exam Question: Metaphysics Seminar Final**

  **Essay Question (90 Minutes)**

  Bradley's Regress challenges the coherence of relations by arguing that if a relation is distinct from its relata, it requires a further relation to connect them, generating an infinite chain. Critically evaluate this argument by addressing the following three components:

  1.  **The Generating Assumption:** Identify the specific assumption about the nature of relations that gets the regress started. You must then choose one of two paths:
      *   **Path A:** Deny the assumption. Explain precisely why a relation does not require further relating to function. Address the objection that "R relates a and b" and "R is related to a and b" describe the same fact.
      *   **Path B:** Accept the assumption. Argue whether the resulting regress is vicious or harmless. You must provide a clear criterion for viciousness; asserting that infinite chains are "bad" is insufficient.
  2.  **Modern Relocations:** Consider contemporary attempts to dissolve the problem, such as defining propositions as ordered tuples or appealing to compositional semantics. Do these moves solve the metaphysical problem, or do they merely stipulate unity without explaining it?
  3.  **Historical Framing:** Bradley originally targeted the coherence of qualities and relations in reality (facts), whereas later analytic philosophy often frames this as the "unity of the proposition." Discuss whether shifting the focus from ontology to semantics dodges the problem or changes it entirely.

  ***

  **Model Answer**

  Bradley's Regress does not arise merely from the existence of relations, but from a specific categorization of them. The generating assumption is that a relation is itself a distinct entity comparable to its relata. If *R* is a distinct thing from *a* and *b*, then *R*'s connection to them appears contingent. To make *R* actually connect *a* and *b*, one seems to need a further tie, *R1*, linking *R* to *a*, and so on ad infinitum. The regress gets going only if we treat the relating function as something that itself needs relating.

  Taking Path A, we deny this assumption by asserting that relations are essentially unifying. Unlike objects, which are inert, a relation is not a third thing sitting between two others; it is the tying itself. To claim that "R relates a and b" requires a further fact "R is related to a and b" is to commit a category mistake. It treats the relating activity as another static relatum. If relations are inherently directional or adhesive, they do not require a external glue. The objection that these are the same fact wearing different clothes fails because it ignores the asymmetry of dependence: the fact exists *because* the relation relates, not vice versa. The relation's nature is to relate; demanding it be related treats it as unrelated potentiality, which misdescribes its ontological category.

  If one accepts the assumption (Path B), one must distinguish vicious from harmless regresses. A regress is harmless if it is merely logical and does not prevent the phenomenon from existing. It is vicious if it creates an explanatory failure: if the existence of the first link depends on the completion of the infinite chain, and the chain cannot be completed, the first link cannot exist. For Bradley, the regress is vicious because it renders unity impossible. If every tie requires a further tie, nothing is ever actually tied. Therefore, accepting the assumption forces one into monism or skepticism about relations.

  Regarding modern moves, defining a proposition as an ordered tuple <a, R, b> often relocates rather than solves the problem. Mathematically, a tuple has structure, but metaphysics asks what grounds that structure. Saying "the order defines the unity" stipulates the result without explaining the mechanism of unification. Similarly, compositional semantics explains how we understand sentences, but semantic value does not guarantee ontological unity. If the world is not structured like the language, the semantic solution leaves the metaphysical problem untouched. These moves often assume the unity they purport to explain, treating the structure as primitive rather than derived.

  Finally, the shift from Bradley's ontology to the "unity of the proposition" is significant. Bradley was concerned with whether reality could consist of distinct things standing in relations without collapsing into a single One. He argued that pluralism is unintelligible because relations cannot bridge the gap between distinct existences. The analytic reframing treats propositions as abstract objects or semantic values, which may tolerate structure without requiring existential unity. However, if propositions are meant to represent facts, the problem returns: what makes the fact unified rather than a mere list? If the student notices this disanalogy, they see that the propositional framing often hides the ontological cost. Bradley's challenge remains potent because semantics can describe unity, but only metaphysics can ground it.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Identification of the Generating Assumption (4 marks)**
  *   **Required:** Must state that the regress relies on treating the relation as a distinct relatum that itself requires relating (the "relating relation" problem).
  *   **Common Blow-it:** Students describe the regress steps but fail to identify the *assumption* that relations are inert entities needing external ties.

  **2. Commitment to Path A or Path B (4 marks)**
  *   **Required:** Must explicitly choose to deny the assumption (internal nature of relations) OR accept it and argue viciousness. Must address the "R relates" vs "R is related" objection if denying.
  *   **Common Blow-it:** Students hedge by saying "some philosophers say X, others say Y" without taking a stance or arguing for one side.

  **3. Criterion for Viciousness (4 marks)**
  *   **Required:** Must define viciousness as explanatory failure or impossibility of completion, not just "infinity is bad."
  *   **Common Blow-it:** Students claim all infinite regresses are vicious simply because they are infinite, missing the distinction between benign and malignant regresses.

  **4. Evaluation of Modern Moves (Tuples/Semantics) (4 marks)**
  *   **Required:** Must argue that tuples/semantics often stipulate unity rather than explain it, or relocate the problem to semantics.
  *   **Common Blow-it:** Students accept tuples as a solution without questioning what grounds the tuple's structure versus a set's lack of structure.

  **5. Bradley vs. Proposition Distinction (4 marks)**
  *   **Required:** Must note Bradley targeted ontological facts/reality, while the proposition framing is semantic/abstract, and discuss if this changes the problem.
  *   **Common Blow-it:** Students treat Bradley's argument as originally being about language or sentences rather than the coherence of reality.

  **A vs. B Differentiation:**
  An **A** answer picks a side on the fork and defends it against objections (taking the bullet), whereas a **B** answer surveys the options neutrally without committing to a resolution.
