  hey, so funny situation: i'm the TA for our upper-level metaphysics seminar and the instructor just went on parental leave right before finals, which means I'm writing the exam. three weeks of the course were on bradley's regress and the unity of the proposition and i dont want to just ask "explain Bradley's regress" because anyone who half-remembers the Wikipedia version can bluff that.

  heres what i want instead. write me one essay question (aimed at students who did the reading, answerable in ~90 min) plus a model answer of about 650 words and a marking scheme. the question has to force them to see that the regress only gets going if you accept a specific assumption — that a relation, to actually relate its relata, must itself stand in some further relation to them. so the exam question should put the fork to them: either deny the assumption (in which case, say exactly why the relation doesn't need relating, and what you say to the person who insists that "R relates a and b" and "R is related to a and b" are the same fact wearing different clothes), or accept it and explain whether the resulting regress is vicious or actually harmless, and what the difference between vicious and harmless regresses even is — if they can't articulate a criterion for viciousness they're just choosing by vibes.

  i also want a part of the question on whether the modern moves dodge the problem or just relocate it. the obvious ones students will reach for: say a proposition is just an ordered tuple of objects and properties and relations, or say it's whatever the sentence's semantics compositionally delivers, and hey, no unity problem. make them say whether the tuple answer works (what unifies the tuple into something with a truth value rather than just a list?) and whether the regress was ever really about *propositions* in the first place, given that Bradley himself was talking about qualities and relations in a fact/thing, and the "unity of the proposition" framing is something later authors bolted on. if a student notices that disanalogy and does something with it, that should be worth real marks.

  marking scheme: five must-hit points, 4 marks each, 20 total, each with a one-liner on how students typically blow it. plus one sentence on what separates an A from a B — my instinct is the A answers will actually pick a side and take the bullet somewhere, while B answers survey the options and hide, but you tell me if that's the right cut or if there's a better one.

  one more thing: please don't have the question or model answer lean on any direct quotes, i don't have the books in front of me and can't check them, so paraphrase positions rather than attributing sentences to people. thanks!!
