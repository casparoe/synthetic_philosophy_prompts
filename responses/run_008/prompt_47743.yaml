answer: |-
  This is a sophisticated position, often termed the 'Causal Impotence' or 'Inefficacy' objection. It is philosophically respectable and held by serious thinkers (e.g. Mark Budolfson has argued that supply chains are non-linear enough to make individual impact negligible). However, it is not without significant vulnerabilities.

  You have asked for a defeater map, ranked by severity, along with an analysis of the assumptions underpinning your view. Here is the stress test.

  ### The Defeater Map

  #### 1. The Expected-Value Calculation (Fatal if true)
  **The Assumption:** You assume the probability of triggering a threshold is so close to zero that $P \times \text{Harm} \approx 0$.
  **The Defeater:** This relies on a misunderstanding of how supply chains handle marginal demand. While you are right that one burger rarely triggers *one* extra chicken being killed instantly, supply chains operate on batches.
  If a supermarket orders chicken in crates of 1,000, your purchase has a $1/1,000$ chance of triggering a new crate order. If that crate order results in 1,000 chickens being killed, your *expected* harm is $(1/1,000) \times 1,000 = 1$ chicken.
  **Why it's fatal:** Mathematically, under standard consequentialist assumptions, the expected disutility of your consumption equals the average disutility per unit. The 'threshold' problem dissolves into an averaging problem. If you accept that climate change causes massive harm, and you accept that consumption drives demand, the expected-value arithmetic does not let you off the hook; it merely smears the causal responsibility across probability space.
  **World Condition:** For this defeater to fail, supply chains would have to be infinitely flexible with zero buffering stock, or so rigidly fixed that marginal demand never triggers production adjustments over any time horizon. Empirical evidence suggests they are responsive to marginal demand over the medium term.

  #### 2. The Voting Analogy Backfire (Severe)
  **The Assumption:** You justify voting because elections have thresholds, whereas markets do not.
  **The Defeater:** In a national election, the probability of your single vote deciding the outcome is effectively zero—statistically indistinguishable from your burger deciding a climate threshold. If you vote, you are likely doing so because of a *duty* that transcends strict causal efficacy (expressive voting, civic duty, or rule-utilitarian reasons).
  **Why it's severe:** If you admit a duty to vote despite causal inefficacy, you have already conceded that moral obligation is not solely determined by 'making a difference' to the outcome. Once you grant that principle for voting, the barrier to applying it to consumption collapses. You must explain why the 'duty despite inefficacy' principle applies to the ballot box but not the supermarket.
  **World Condition:** For your view to hold, you must argue that voting is *categorically* different from consumption in a way that justifies the asymmetry. If voting is merely another form of signalling or participation in a collective project, your distinction is ad hoc.

  #### 3. The Complicity and Integrity Objection (Moderate to Severe)
  **The Assumption:** Harm is the only morally relevant currency.
  **The Defeater:** Many ethical frameworks (Kantian, Virtue Ethics, Complicity theories) argue that participating in a wrongful project is itself wrong, regardless of causal impact. Christopher Kutz's 'Complicity Principle' suggests that if you intentionally participate in a collective harm, you are accountable for the harm, even if your specific contribution made no difference.
  **Why it's moderate:** You can stubbornly reject this and say, 'I only care about consequences.' However, this forces you into counter-intuitive corners. For example, if you join a firing squad where only one gun has a bullet (randomly assigned), and you pull the trigger, are you innocent if yours was the empty chamber? Most people feel you are morally tainted.
  **World Condition:** For this to fail, morality must be purely consequentialist. If you have any intuition that 'getting your hands dirty' matters, this objection gains traction.

  #### 4. The Normative Signalling Challenge (Awkward but Persistent)
  **The Assumption:** Consumption is private; politics is public.
  **The Defeater:** Consumption is a public signal that shapes social norms. Driving a gas-guzzling SUV or eating meat visibly normalises that behaviour, weakening the political will for the policy changes you claim to support.
  **Why it's awkward:** It bridges your gap between 'personal lunch' and 'political duty'. If your consumption undermines the political solutions you endorse, then your consumption *is* politically efficacious (negatively).
  **World Condition:** This depends on how observant your peers are and how sensitive social norms are to individual behaviour. It is harder to quantify than the supply chain argument, making it easier to dismiss, but harder to disprove.

  #### 5. The Unfalsifiability Trap (Meta-Ethical Worry)
  **The Assumption:** There is a clean line between 'consumption' (permissible) and 'political action' (mandatory).
  **The Defeater:** If every time a consumption choice looks morally dubious you reclassify it as a 'political act' (e.g., 'Buying an EV is political, buying a burger is not'), the theory risks becoming unfalsifiable.
  **Why it matters:** A theory that absorbs all counter-examples by shifting the boundary of 'political duty' loses predictive power. If the only thing that matters is political efficacy, then *all* consumption should be evaluated by its political signal. If you refuse to do that, you need a principled reason why some consumption is 'just consumption' and some is 'political'.
  **World Condition:** This is a structural problem for the view. It holds only if you can rigorously define which acts are 'political' and which are 'private' without simply labelling the permissible ones 'private' and the impermissible ones 'political'.

  ---

  ### Where Defenders Concede Ground

  Philosophers who defend a version of your view (e.g. Mark Budfordson, or certain pragmatic consequentialists) usually concede the following:

  1.  **Luxury vs. Necessity:** They often admit that *some* high-emission consumption is wrong because it is gratuitous. If the harm is negligible, why is gratuitousness relevant? Usually, because it reveals a lack of solidarity or virtue. This is a concession to the 'Integrity' objection.
  2.  **The Duty to Advocate:** They almost universally agree that if you do not offset your inefficacy with political activism, you are culpable. They refuse to give up the claim that *inaction* on policy is the primary sin.
  3.  **The 'Clean Hands' Caveat:** Some concede that while your act isn't *wrong*, it might be 'unfortunate' or 'sub-optimal'. They refuse to call it 'immoral' because they want to preserve the concept of morality for things that make a difference. This sounds callous, but it is done to preserve the coherence of moral language.

  ### The Weakest Link: Where to Attack

  If I were critiquing your position, I would target **the assumption that harm is the only morally relevant currency.**

  This is the linchpin. Your entire argument rests on a specific, narrow form of consequentialism. If you accept that morality also concerns *who you are* (virtue), *what you associate with* (complicity), or *what principles you uphold* (deontology), the inefficacy objection loses its force. You can be complicit in a tragedy without being the cause of it.

  However, since you seem wedded to the expected-harm reasoning, the **empirical claim about supply chains** is your most vulnerable factual point. If the 'batching' argument holds (that expected harm equals average harm), your mathematical defence collapses immediately.

  ### Is Expected-Harm Reasoning Broken?

  You asked if you should be moved by showing the expected-harm reasoning is broken. **Yes, but with a caveat.**

  The reasoning is not 'broken' logically; it is likely **empirically optimistic**. It assumes a world where markets are less responsive than they actually are. However, relying solely on expected harm is philosophically fragile because it makes morality a lottery.

  Consider this: If you play a Russian Roulette game with a million chambers and one bullet, and you point it at a stranger and pull the trigger, are you innocent because the *expected* harm is low ($1/1,000,000 \times \text{death}$)? Most legal and moral systems say no. They judge the *risk imposition*, not just the realised outcome. Climate change is a game of Russian Roulette with the global climate. Your argument justifies pulling the trigger because the bullet probably won't fire. A critic would argue that the wrongness lies in imposing the risk, not merely in the statistical expectation of the casualty count.

  ### On Unfalsifiability

  You asked if qualifying the view into unfalsifiability is a problem. **It is a significant problem.**

  If every apparent counter-example is absorbed by 'that's really a political act' or 'that's supererogatory', the distinction between 'individually wrong' and 'individually fine' ceases to do any work. A robust moral theory should be able to condemn some individual acts *even if* political action is also required.

  If your theory implies that a climate activist who flies privately is blameless provided they vote correctly, while a non-activist who eats beans but never votes is equally blameless, the theory has lost its grip on moral intuition. The structural collective-harm case does not *require* this level of qualification. One can acknowledge collective harm problems while still maintaining that individual participation in the harmful mechanism is pro tanto wrong, even if excusable under certain conditions.

  ### Summary

  To maintain your position, you must hold the line on three fronts:
  1.  **Empirical:** Supply chains must be insensitive enough that expected harm is truly negligible (the batching argument threatens this).
  2.  **Theoretical:** Morality must be purely outcome-based, rejecting complicity and integrity (the firing squad case threatens this).
  3.  **Consistency:** You must explain why voting is obligatory despite inefficacy, while eating meat is not (the parity argument threatens this).

  The most damaging blow would be the **Expected-Value Calculation**. If $P \times \text{Harm}$ actually sums to the average harm per unit, your 'moral maths' yields the same result as the people scolding you about your lunch order; it just takes a longer route to get there.
