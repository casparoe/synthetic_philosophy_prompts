          *   Distinction between individual consumption and political action (voting, donating, policy).
          *   Harm is the primary moral currency.
      *   **Request:** Stress-test this view. Provide a "defeater map" ranked from fatal to awkward. Identify assumptions that could fail. Discuss where defenders of the view concede ground. Identify the most vulnerable commitment. Address the issue of unfalsifiability/qualifying the view. Use British English.
      *   **Tone:** Philosophical, rigorous, honest, not preachy ("drops of water" arguments dismissed).

  2.  **Deconstruct the Inefficacy Objection (The "Triviality" Argument):**
      *   The user relies heavily on a causal model where moral wrongness depends on *making a difference* to the outcome.
      *   They reject complicity/virtue ethics frameworks in favour of consequentialist expected utility.
      *   They accept political duties but sever the link between personal consumption and political efficacy/integrity.

  3.  **Brainstorming Defeaters (Ranked by Severity):**

      *   *Fatal:* If the expected harm *is* actually significant mathematically. (Hiller, Nefsky, etc.). If the "threshold" model is empirically wrong about supply chains.
      *   *Severe:* If the "Harm Only" assumption is false. (Complicity, integrity, expression).
      *   *Moderate:* If the distinction between consumption and political action collapses. (Consumption *is* signalling).
      *   *Awkward:* If holding the view leads to repugnant conclusions in parallel cases (e.g., voting, torture).
      *   *Meta:* If the view becomes unfalsifiable by shunting everything into "political duty."

  4.  **Developing the Defeater Map:**

      *   **1. The Expected Value Calculation (The "Fatal" Mathematical Challenge):**
          *   *Assumption:* $P(\text{making a difference}) \times \text{Harm} \approx 0$.
          *   *Counter:* Supply chains *do* have thresholds (orders are placed in batches). If I buy a chicken, there's a $1/N$ chance I triggered an order for a batch of $N$. Expected harm = Total Harm / $N$. It sums up exactly to the average harm per unit.
          *   *Key Philosopher:* Alastair Norcross, Budolfson (though Budolfson is tricky, he argues for non-linearities), but mainly the "expected utility" defence by Singer-style consequentialists.
          *   *World Condition:* Supply chains must be responsive to marginal demand, even if lumpy.

      *   **2. The Complicity/Integrity Objection (The "Moral Currency" Challenge):**
          *   *Assumption:* Only causal harm matters.
          *   *Counter:* Participating in a wrongful project makes one complicit, regardless of causal impact. (Tracy Isaacs, Christopher Kutz). It corrupts moral character (virtue ethics).
