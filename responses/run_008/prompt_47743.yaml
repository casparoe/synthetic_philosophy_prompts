      *   *Section 3: Complicity and Integrity (Moderate/Severe).* Even if I don't cause harm, am I dirtying my hands? Kutz's "Complicity Principle."
      *   *Section 4: The Normative Signal (Awkward but persistent).* Consumption shapes norms. This bridges the gap to your accepted political duties.
      *   *Section 5: The Unfalsifiability Worry.* If you shunt everything to "political duty," does "consumption" exist as a category anymore?
      *   *Conclusion:* What moves the needle? The empirical claim about supply chains (batching) is the weakest link in the user's armour.

  7.  **Refining the Tone:**
      *   Avoid moralising.
      *   Keep it analytical.
      *   Ensure British spelling (behaviour, programme, centre, modelling, etc.).
      *   Check the "ranking" requirement.

  8.  **Self-Correction/Review during drafting:**
