      *   **3. The Signalling/Norms Challenge (The "Political/Personal Collapse" Challenge):**
          *   *Assumption:* Consumption is private; Politics is public.
          *   *Counter:* Consumption signals norms. Buying a gas guzzler normalises it. It weakens the political will for change. Your lunch *is* a political act.
          *   *World Condition:* Social norms are sensitive to visible behaviour.
          *   *Defeater Strength:* High, because the user admits political duties. If consumption affects political efficacy, the distinction crumbles.

      *   **4. The "Parity of Reasoning" Trap (The "Voting" Analogy Turned):**
          *   *Assumption:* Voting matters because of thresholds; markets don't.
          *   *Counter:* Voting *also* has negligible causal probability in large elections. If you vote because of "expected value" (tiny chance $\times$ huge policy difference), you must apply the same math to burgers. If you vote out of "duty despite inefficacy," why not burgers?
          *   *World Condition:* Consistency in moral reasoning.

      *   **5. The Unfalsifiability/Qualification Problem:**
          *   *Assumption:* The view is robust.
          *   *Counter:* If every counter-example is shunted to "that's actually a political duty," the distinction between consumption and politics becomes ad hoc.
          *   *Risk:* The view becomes a shell game.

  5.  **Addressing Specific User Questions:**
      *   *Which commitment to target first?* The "Harm is the only currency" assumption. It's the linchpin.
