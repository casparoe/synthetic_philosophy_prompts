  9.  **Final Polish:** Ensure the structure is logical and the arguments are charitable but rigorous. (The user is smart; don't talk down). Make sure to mention specific philosophers where relevant (Norcross, Kutz, Budolfson) to show depth.

  *(Self-Correction on Budolfson)*: Actually, Budfordson argues *for* inefficacy in some cases (non-linear supply chains). I should be careful not to cite him as a straight counter-argument to the user, but rather note that the empirical reality is complex. The "Expected Value" counter-argument is best associated with Norcross or Singer. I will focus on the *mathematical expectation* argument rather than specific empirical claims about chicken orders, as that's more robust philosophically.

  *(Refining the Voting Analogy)*: The user thinks voting has thresholds. Political science says single votes almost never decide elections. The user's justification for voting is actually inconsistent with their rejection of consumption unless they admit voting is also expressive/symbolic. This is a strong point of attack.

