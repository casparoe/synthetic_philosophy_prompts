answer: |-
  Since you didn't actually paste the manuscript text (your message moves from "Here's the draft" directly into a summary of the argument), I can't offer line-edits or catch the "written on a plane" stylistic glitches you're worried about. However, the summary you provided is detailed enough to workshop the **argumentative architecture** rigorously.

  Here is my feedback on the three specific philosophical moves you flagged, followed by a few general metaphysical caution flags.

  ### 1. The Recipe/Dish Move (Process vs. Code)
  **Verdict:** It carries the weight, *but* only if you clarify the ontology of the "recipe."

  You are worried that a stubborn opponent will say: "If the recipe contains all the information required to recreate the dish perfectly, the dish just *is* the recipe (plus a generic capacity for execution)." This is the "dispositionalist" objection. If the archive file contains the full state data (the "snapshot"), the opponent argues the cathedral exists *dispositionally* in the archive, waiting to be manifested.

  **How to fortify it:**
  *   **Don't rely on information content:** If you argue the recipe is "missing something" information-theoretically, you will lose, because a perfect state-save is informationally complete.
  *   **Rely on causal history/context:** Argue that the cathedral is not just a geometric arrangement of pixels, but a **node in a causal network**. Its "cathedral-ness" involves its role in the economy, its accessibility to other players, and its position in the server's time-stream. The archive is a *fossil*, not a *recipe*. A fossil contains the shape of the organism, but it isn't the organism disposed to live.
  *   **The "Performance" Ontology:** Lean harder into the analogy of music. A MIDI file isn't the music; it's instructions for producing sound. If the orchestra disbands (server shuts down), the symphony cannot be performed. You can keep the score (archive), but the *performance* (the lived instance of the cathedral) has ceased. The grief is for the cessation of the *performance*, not the loss of the *score*.
  *   **The Risk:** If you call it a "recipe," you imply it can be cooked again. If you call it a "fossil" or "blueprint," you emphasize the loss of the *token*. I suggest shifting terminology from "recipe" to **"score"** or **"blueprint."** A recipe implies a generic type (cake); a score implies a specific work that requires instantiation to be experienced.

  ### 2. The Fictional Character Comparison
  **Verdict:** Clarifies the dependence relation, but beware the "Abstract vs. Concrete" trap.

  Comparing the cathedral to Sherlock Holmes is excellent for highlighting **ontological dependence**, but it risks confusing **abstract artifacts** with **concrete digital objects**.
  *   **The Clarification:** You are right that Holmes depends on the *existence of the text*, not the *physical presence of a book*. The cathedral depends on the *active processing of the code*. This distinction (continuous instantiation vs. historical creation) is your strongest point.
  *   **The Trap:** Standard metaphysics of fiction (Thomasson, etc.) classifies fictional characters as *abstract artifacts*. They are causally inert. Virtual objects, however, are arguably *concrete* (or at least causally efficacious); they interact with players, trigger emotions, and involve server electricity.
  *   **The Fix:** Make sure you don't imply the cathedral is *abstract* like Holmes. Frame it this way: "Both are artifacts, but they differ in their **persistence conditions**." Holmes persists as long as the *concept* is sustained culturally. The cathedral persists only as long as the *process* is sustained physically. This avoids inheriting the baggage of fictional realism/anti-realism debates. You aren't arguing virtual objects are like fiction; you are arguing they are *unlike* fiction in a way that makes them more vulnerable to destruction.

  ### 3. The Persistence/Personal Identity Analogy
  **Verdict:** Do not cut it, but do not go full Parfit. Use the "Teletransporter" puzzle.

  You suspect this needs spelling out. You are right. A referee will pounce on "genuine persistence question."
  *   **The Cheap Precision:** You don't need a full theory of identity. You just need to invoke the **Teletransporter Puzzle** (Parfit).
      *   *Scenario:* If I scan you, destroy you, and rebuild you atom-for-atom elsewhere, are you the same person?
      *   *Application:* The archive is the scan. The shutdown is the destruction. The new server is the rebuild.
      *   *The Point:* We do not have a pre-theoretical consensus that the rebuilt person is the *same* person. Therefore, we cannot stipulate that the rebuilt cathedral is the *same* cathedral.
  *   **Why this works:** It shifts the burden of proof. The studio claims "We saved your building." You reply: "You saved a copy. Whether it is *the* building is as metaphysically dubious as whether the teleported man is *the* man." This validates the grief without requiring you to solve the problem of identity. The loss is the loss of **numerical identity**, even if **qualitative identity** is preserved.

  ### General Metaphysical & Stylistic Flags

  **1. "Physical Instantiation" Terminology**
  Be careful with the phrase "physical instantiation." Some digital metaphysicians (like Chalmers) argue virtual objects *are* physical (they are computational processes running on physical hardware). Others argue they are sui generis.
  *   *Risk:* If you say the server is "physical" but the cathedral is "virtual," you might invite a reductionist to say, "The server is still there, just turned off. The electrons haven't vanished."
  *   *Fix:* Use **"operational instantiation"** or **"causal activation."** The hardware remains, but the *process* that constitutes the object has ceased.

  **2. The "Real Object" Claim**
  You argue the grief is for a "real object."
  *   *Risk:* This invites the "It's just pixels" rebuttal.
  *   *Fix:* Define "real" functionally. A real object is something that can be a locus of causal power and social interaction. The cathedral was a meeting place, a landmark, a sink for economic value. That makes it socially real. The archive is a record of that reality, not the reality itself.

  **3. The "It's Just Pixels" Dismissal**
  In your final paragraph, you say this dismissal "gets the metaphysics backwards."
  *   *Refinement:* Be precise. It gets the **ontology** backwards (denying the existence of the object) even if it gets the **axiology** roughly right (the loss is less than a real-world cathedral burning).
  *   *Style Check:* Since you wrote the middle on a plane, watch for "hand-wavy" transitions. Ensure every time you use "object," you specify if you mean *token* (this specific cathedral instance) or *type* (the design of the cathedral). The archive preserves the *type*; the shutdown destroyed the *token*.

  ### Summary Recommendation
  The argument is sound and fits well within current digital metaphysics (aligning with work by Alice Chirico or Morgan Luck on virtual ethics).
  1.  **Swap "Recipe" for "Score/Blueprint"** to emphasize the loss of the specific token instance.
  2.  **Explicitly invoke the Teletransporter Puzzle** to handle the persistence objection without getting bogged down in identity theory.
  3.  **Clarify that Fictional Characters are Abstract** while Virtual Objects are Concrete/Processual, so the comparison is about *dependence*, not *category*.

  If you can tighten those three bolts, the essay should hold up well in a reading group. Good luck with the workshop.
