answer: |-
  Dear Colleague,

  It is entirely understandable that your instincts as a theoretical physicist should rebel against the apparent defeatism of the standard decision-theoretic response to the Pasadena game and its variants. Having spent a career extracting sensible predictions from divergent integrals through the disciplined application of regularisation and renormalisation, the proposal to assign a value of one half to the oscillating series you describe feels not only mathematically natural but scientifically responsible. In quantum field theory, we learned that a divergence often signals merely that we are asking a question in an idealised limit, and that the physical quantity of interest is recovered by carefully removing a regulator. However, I must urge caution before importing this machinery into the normative realm of decision theory, for the disanalogy between calculating a physical observable and determining a rational choice is profound enough to render the transplantation illegitimate. The crux of the matter lies not in the mathematics of summation itself, which is indeed neutral, but in the authority required to justify a choice and the absence of an external arbiter in decision problems to validate that authority.

  In physics, the success of renormalisation is ultimately vindicated by empirical adequacy. When we introduce a cutoff or employ dimensional regularisation, we are engaging in a piece of formal bookkeeping that is permitted only because the final, regulator-independent result matches experimental data to extraordinary precision. The electron g-factor does not care about our summation conventions; it cares about the structure of the vacuum, and our mathematics is judged solely by its ability to predict that structure. In decision theory, however, there is no such external reality against which to check our regularised expected values. The expected utility of a gamble is not a physical magnitude waiting to be measured; it is a normative construct intended to guide action. If you assign a value of one half to your variant of the Pasadena game via Abel summation, there is no experiment you can perform to confirm that this was the correct rational price. You cannot play the game infinitely many times to verify that the average payoff converges to one half, because the law of large numbers fails precisely where the expectation diverges. In a single play, or even a finite sequence of plays, the outcome will be dominated by the rare, extreme tail events that the regularisation scheme has effectively smoothed over. Thus, the regularised value lacks the empirical anchor that gives renormalisation its legitimacy in physics.

  Furthermore, the choice of summation method in physics is constrained by symmetry principles and physical consistency conditions that are absent in the context of a wager. In quantum field theory, we do not simply pick a summation method that yields a convenient number; we are forced into specific schemes by the requirement that gauge invariance be preserved or that unitarity hold. In decision theory, there is no equivalent constraint that forces us to prefer Abel summation over Cesàro summation, or over a simple truncation at some large finite N. Indeed, for more complex Pasadena-style games, different regularisation schemes can yield different values, or even fail to yield a value at all. If one convention suggests the game is favourable and another suggests it is unfavourable, there is no court of appeal to settle the dispute. In physics, nature would decide; in decision theory, rationality itself is the question at stake. To simply stipulate a convention is to engage in an act of arbitrary fiat rather than rational deduction, and it is unclear why a rational agent should feel bound by a mathematical convention that lacks normative force.

  This arbitrariness becomes particularly dangerous when we consider the axiomatic foundations of rational choice. Expected utility theory is not merely a calculation tool; it is derived from axioms such as independence, continuity, and dominance, which are intended to capture coherent behaviour. The Pasadena game is notorious because it violates these axioms; for instance, it can be constructed such that one gamble dominates another in every possible state of the world, yet the regularised expectation suggests the dominated gamble is superior. If you introduce a regularisation scheme to assign a value, you are effectively patching the arithmetic while leaving the axiomatic violation intact. This can leave an agent vulnerable to dynamic inconsistency or Dutch books, where a sequence of choices, each justified by the regularised value, leads to a sure loss. In physics, a renormalised quantity must respect conservation laws; in decision theory, a valid value must respect coherence constraints. If the regularised expectation violates dominance or leads to money pumps, it cannot serve as a guide for rational choice, regardless of its mathematical elegance.

  There is also a significant disanalogy regarding the ontology of the divergence. In physics, divergences often arise from incorrect idealisations, such as treating particles as point-like entities at arbitrarily high energies. We expect a deeper theory, perhaps involving strings or a lattice, to resolve the divergence physically. In the Pasadena game, the divergence is not a result of missing physics or an incorrect model of the coin; the game is fully specified. The probabilities and payoffs are exact. The divergence arises from the structure of the utility function and the probability distribution themselves. To regularise this is not to correct an idealisation but to alter the problem definition. If an agent truly faces these payoffs and probabilities, the infinite variance is a real feature of their risk profile, not a mathematical artefact to be smoothed away. Ignoring the heavy tails via summation methods may provide a finite number, but it obscures the catastrophic risk inherent in the gamble. A rational agent ought to be sensitive to the fact that the variance is undefined, something a single scalar expected value, regularised or otherwise, fails to convey.

  Ultimately, the temptation to apply physicist tools to decision theory stems from a desire to preserve the computability of rational choice, but it risks conflating mathematical convenience with normative justification. In physics, we are descriptive realists; if the math works, the theory is good. In decision theory, we are normative prescriptivists; if the math leads to choices that violate our considered judgments about coherence and dominance, the math must yield. The lesson of the Pasadena game is not that we need better summation methods, but that expected utility theory itself has limits when faced with unbounded utilities and heavy-tailed distributions. Rather than forcing a value onto the game through regularisation, it is more honest to acknowledge that such games lie outside the domain where standard expected utility maximisation applies, and to seek a decision theory that can handle undefined expectations without resorting to conventions that lack choice-relevant authority. To do otherwise is to privilege the elegance of the calculation over the integrity of the rational agent, a trade-off I suspect you would find as unacceptable in philosophy as you would in physics.

  Yours sincerely,

  A Colleague in Philosophy of Science
