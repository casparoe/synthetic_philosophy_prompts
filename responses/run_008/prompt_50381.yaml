  The **Proponent (e.g., Cohen)** corresponds to the view that successful convergence validates the process. If the base learner satisfies **weak learnability** (better than random guessing), iterative updates transmit justification from specific predictions to global reliability. This mirrors the **closure principle**: if you are justified in believing $P$ (the pseudo-label) and know $P$ implies $Q$ (the model is reliable), you are justified in $Q$. The decreasing training loss serves as Moorean proof: "Here is a label, therefore my model is reliable." This position accepts "easy knowledge" via optimization: if the loss goes down, the reliability is justified.

  The **Transmission Failure Critic (e.g., Wright, Davies)** identifies this as **validation on training data**. They argue justification cannot transmit from premises (pseudo-labels) to conclusion (reliability) if the conclusion is a presupposition of the premises. In ML terms, you cannot estimate **calibration error** using samples that influenced the weights. Without prior **entitlement**—modeled as inductive biases or pre-trained weights verified on a hold-out set—the loop lacks a warrant to trust the pseudo-labels. The process may minimize loss, but it fails to certify truth. Wright's "non-evidential warrant" translates to the necessity of trusting the initialization before the loop begins. In **teacher-student distillation**, this is the requirement that the teacher's accuracy be established independently before distilling knowledge.

  The **Reductionist** demands **independent grounds**. They insist self-training is only justified if verified against external ground truth (human labels). They reject the circularity entirely, requiring a non-model-generated dataset to establish reliability before allowing pseudo-labeling to proceed. This mirrors the demand for independent verification of perceptual faculties before using them to prove the external world.

  ### What gets distorted

  Three major distortions arise. First, **normativity versus performance**. Epistemology asks whether a subject is *justified* (normative), whereas ML measures whether loss decreases (descriptive). A model can minimize loss via spurious correlations (Gettier cases), achieving high accuracy without "knowledge." The philosophical debate concerns the status of the believer, not just the output reliability. The "easy" in easy knowledge refers to the triviality of the inference, not the computational cost.

  Second, **agency**. Models do not "believe" pseudo-labels; they adjust weights to minimize error. The "circularity" is architectural, not doxastic. There is no cognitive agent experiencing the "easy knowledge" as trivial or problematic; there is only an optimization trajectory. The philosophical intuition pump relies on the feeling of cheating; the model feels nothing.

  Third, the **status of the basic**. In epistemology, basic beliefs are prima facie justified without inference. In ML, initial weights are random or pre-trained. There is no equivalent to "prima facie justification" other than initialization variance. A random initialization has no warrant, yet self-training might still work. This decouples the philosophical requirement for basic warrant from the engineering reality of convergence from noise. Furthermore, transmission failure assumes a logical structure of reasons; ML assumes a statistical manifold where "reasons" are gradients. The distortion lies in treating gradient flow as justification flow.

  ### The residue

  **Clean Translations:** The intuition behind bootstrapping translates cleanly to **error amplification** and **confirmation loops**. The worry that using perception to verify perception leads to absurdity matches the empirical observation that self-training on biased pseudo-labels degrades calibration. The need for independent grounds maps perfectly to the requirement for a **held-out validation set**. When philosophers say justification doesn't transmit, ML engineers say "data leakage."

  **Distorted Survivors:** Wright's notion of **entitlement** survives only with distortion. In philosophy, entitlement is a normative permission to trust without evidence. In ML, this resembles **inductive bias** or pre-training priors. However, bias is descriptive (how the model behaves), while entitlement is normative (what the agent is allowed to assume). Treating bias as warrant conflates *is* with *ought*. Similarly, "transmission" is distorted: in logic, it preserves truth; in backprop, it minimizes error. Error minimization does not guarantee truth transmission. A model can be confidently wrong.

  **No Counterpart:** The philosophical debate lacks a counterpart for **calibration drift metrics**. Philosophers argue qualitatively about justification; ML researchers measure Brier scores across rounds. Conversely, ML lacks the concept of **knowledge** itself. There is no variable for "Justified True Belief." ML tracks accuracy and loss, not epistemic status. This residue points to a gap in ML terminology: we lack a normative framework for when a model *should* trust its own outputs beyond empirical risk. We need a theory of "epistemic safety" beyond convergence. It also suggests parts of the philosophical debate (specifically the focus on the *subject's* perspective) are less substantive for engineering than the structural constraints on data flow. The residue highlights that epistemology is about the agent's standing, while ML is about the system's output stability. The philosophical focus on "easy knowledge" as a paradox may be less substantive than the ML focus on "early stopping" as a regularization technique. Philosophers miss the quantitative threshold: at what exact error rate does bootstrapping become viable? ML provides the curve; philosophy provides the binary judgment.

  ### Verdict on the ML response

  When ML researchers claim self-training is vindicated because it works empirically, this is a **category error** relative to the transmission failure objection, though it aligns with **externalist reliabilism**. Wright's objection is not that bootstrapping fails to produce reliable beliefs (it might), but that it fails to *justify* them for the subject. The ML response shifts the goalposts from *justification* to *utility*.

  It is not the same move as Cohen. Cohen argues the circularity is logically valid (justification transmits). ML researchers argue the circularity is pragmatically acceptable (loss decreases). This bypasses the transmission problem entirely rather than solving it. It treats the epistemic norm as an engineering constraint. Thus, the ML response is a refusal of the philosophical framework: it denies that transmission of justification is required for deployment, prioritizing outcome reliability over acquisition structure. It is a valid engineering stance, but it does not answer the epistemologist. The ML claim "it works" addresses the *consequence* of the belief, not the *warrant* for holding it. In epistemology, a lucky guess works but isn't knowledge. ML conflates successful prediction with epistemic warrant.
