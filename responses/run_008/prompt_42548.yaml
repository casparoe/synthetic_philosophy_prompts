  I'm in a philosophy of mind course and we just started the conceivability arguments, which I'll be writing an essay on, so I've been trying to get the lay of the land outside the assigned reading too. I watched a video essay that seemed pretty well put together, and the guy's summary sounded convincing to me, but some of it doesn't quite match how my professor talked about it and I can't tell if that's the video being off or me half-remembering the lecture. Roughly what he said was: "Descartes kicked this all off by pointing out that you can clearly and distinctly conceive of your mind existing without your body, and whatever is clearly and distinctly conceivable is possible, so mind and body must be distinct things. The modern version cleans this up with the zombie thought experiment: a world physically identical to ours down to the last particle, but with no consciousness anywhere. Kripke's necessary a posteriori stuff was supposed to be a problem for this, since a statement can seem conceivable and still be necessarily false once science tells you what water really is, H2O. But the zombie argument dodges that, because unlike with water, no amount of empirical investigation could ever tell us that consciousness just is a physical process, so if zombies are genuinely conceivable they're genuinely possible. Dennett and the Churchlands basically reply that we're conceiving it wrong, and that we only think zombies are conceivable because we can't yet explain how the brain produces consciousness."

  Is this a fair summary of the dialectic or is some of it subtly off? I'd like to go through it more or less sentence by sentence: what would someone like Chalmers actually accept as a statement of his view, what is a simplification, and what is just a conflation of different things (it felt to me like he was moving between "conceivable" and "imaginable" and "understandable" without flagging it, but maybe thats fine?). I'm especially unsure about the Kripke part, because in class it sounded like the a posteriori necessity point cuts *against* the conceivability inference rather than being something the zombie argument "dodges," so I'd love to know which direction that actually runs and whether the water analogy is doing the work the video says it does. And does his overall conclusion -- that if you grant the conceivability of zombies the dualist more or less wins -- actually follow from the parts of the summary that are accurate? I'm inclined to think the zombie argument is pretty strong, honestly, but I don't want to build my essay on a summary that a careful philosopher would wince at.
