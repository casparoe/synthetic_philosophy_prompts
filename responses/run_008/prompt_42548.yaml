      *   *So:* The video is slightly confused. Kripke's argument is actually *supportive* of the dualist intuition against the materialist "Water/H2O" defense. However, modern materialists (Type-B) try to revive a Kripkean strategy. Chalmers argues against *them*.
      *   *Refined View:* The video simplifies the dialectic.
          1.  Materialist: "Mind=Body is like Water=H2O (Necessary A Posteriori)."
