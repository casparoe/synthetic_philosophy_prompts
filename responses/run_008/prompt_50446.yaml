answer: |-
  **SEMINAR HANDOUT: PHILOSOPHY 450 — INTERGENERATIONAL JUSTICE**
  **Topic:** Disambiguating the Keynesian Slogan
  **Date:** October 26, 2023
  **Instructor:** [Professor's Name]

  ---

  ### I. The Menu of Theses
  *The slogan "In the long run we are all dead" is often deployed as a premise. It is, in fact, an ambiguity. Below are five distinct interpretations, ordered from the biologically trivial to the morally substantive. For each, we assess plausibility, truth, and whether it supports the claim that we have no obligations to future persons.*

  **1. The Biological Truism (Descriptive)**
  *   **Thesis:** Every currently living human agent will eventually cease to exist.
  *   **Plausibility:** Certain.
  *   **Truth Value:** True.
  *   **Supports Colleague's Dismissal?** **No.** The fact that an agent ceases to exist does not logically entail that their actions cease to have consequences, nor that the moral status of those consequences vanishes. (Analogy: "In the long run, the builder is dead" does not prove the building need not be sturdy.)

  **2. The Equilibrium Critique (Methodological)**
  *   **Thesis:** Relying on long-run market equilibrium to solve current crises is methodologically unsound because the transition period involves unacceptable human costs.
  *   **Plausibility:** High (within macroeconomics).
  *   **Truth Value:** Plausible in context of monetary policy.
  *   **Supports Colleague's Dismissal?** **No.** This argues for *more* immediate responsibility, not less future responsibility. It warns against waiting for the "long run" to fix things, not against caring about the "long run" itself.

  **3. The Horizon Constraint (Decision-Theoretic)**
  *   **Thesis:** Rational deliberation is necessarily indexed to the deliberator's lifespan; costs/benefits occurring after the agent's death cannot enter their utility function.
  *   **Plausibility:** Low.
  *   **Truth Value:** False. Rational agents routinely maximize utility across temporal boundaries they will not inhabit (e.g., pension planning, wills, planting trees).
  *   **Supports Colleague's Dismissal?** **No.** It describes a limitation of *self-interested* calculation, not a limitation of *moral* reasoning or social planning.

  **4. The Extinction of Interest (Psychological)**
  *   **Thesis:** No living person possesses interests, projects, or attachments that survive their own death.
  *   **Plausibility:** Low.
  *   **Truth Value:** Empirically False. Humans demonstrably care about legacy, lineage, and posthumous outcomes.
  *   **Supports Colleague's Dismissal?** **No.** If people *do* have posthumous interests, ignoring the long run violates the interests of the present generation.

  **5. The Moral Horizon (Normative)**
  *   **Thesis:** The welfare of persons who do not yet exist counts for zero (or significantly less) in present deliberation; moral obligation terminates at the boundary of the current generation's life.
  *   **Plausibility:** Contested.
  *   **Truth Value:** **False** (unless defended by a specific, controversial moral theory like extreme presentism). Biological mortality does not entail moral irrelevance.
  *   **Supports Colleague's Dismissal?** **Yes.** This is the *only* reading that supports the conclusion that intergenerational obligations are void. However, the slogan itself provides no argument for this premise; it merely asserts it via metaphor.

  **6. The Conversation Stopper (Rhetorical)**
  *   **Thesis:** The sentence functions not as a premise but as a signal that further discussion of long-term consequences is pragmatically idle or politically inconvenient.
  *   **Plausibility:** High.
  *   **Truth Value:** N/A (Functional description).
  *   **Supports Colleague's Dismissal?** **Yes,** but only by fiat. It admits the lack of a substantive argument and relies on authority to close the inquiry.

  ---

  ### II. Original Context: *A Tract on Monetary Reform* (1923)
  *Keynes's line appears in Chapter 3, regarding price stability and inflation.*

  > "But this long run is a misleading guide to current affairs. In the long run we are all dead. Economists set themselves too easy, too useless a task, if in tempestuous seasons they can only tell us, that when the storm is long past, the ocean is flat again."

  **Analysis of the Text:**
  Keynes was criticizing Classical Economists who advised against intervening in inflation/unemployment, arguing that markets would self-correct eventually. Keynes's point was that the *transition cost* (the storm) was too high to wait for the *equilibrium* (the flat ocean).

  **Does this support the Colleague's Reading?**
  *   **Contextual Fit:** It supports **Reading 2 (The Equilibrium Critique)**. It is a plea for *immediate* action to alleviate *current* suffering.
  *   **Transfer to Ethics:** The transfer fails.
      *   *Keynes's Argument:* Do not ignore the present for the sake of the future equilibrium.
      *   *Colleague's Argument:* Do not ignore the present for the sake of the future people.
      *   *The Mismatch:* In the original context, the "long run" is a *technical economic state* (equilibrium). In the seminar context, the "long run" refers to *future generations*. Keynes was arguing that economists have a duty to manage the transition *so that* the future is habitable. He was not arguing that the future is morally irrelevant. Using this passage to dismiss intergenerational justice inverts Keynes's actual point: he demanded *more* responsibility from economists, not less.

  ---

  ### III. The Tension Within Keynes: *Economic Possibilities for our Grandchildren* (1930)
  *Seven years after the "dead" line, Keynes published an essay explicitly dedicated to the long run.*

  **The Counter-Evidence:**
  In this essay, Keynes speculates on the economic conditions of the 21st century (our present). He discusses:
  1.  The moral evolution of future people (the love of money becoming "disgusting").
  2.  The problem of leisure for future generations.
  3.  The duty of the current generation to invest and compound capital to solve the "economic problem" for their successors.

  **Is the Colleague Entitled to the Slogan?**
  *   **Consistency:** No. Keynes treats the "long run" as the *telos* of economic policy in the 1930 essay, whereas he treats it as a *methodological trap* in the 1923 tract.
  *   **Entitlement:** The colleague is borrowing prestige from a thinker who explicitly rejected the normative implication they are asserting. Keynes believed the current generation had a heavy obligation to capitalize the future so that their grandchildren could live a "good life."
  *   **Verdict:** Citing the "dead" line to dismiss obligations to future people is historically ironic. It uses a remark about *monetary stabilization* to override an author's explicit philosophy of *intergenerational stewardship*.

  ---

  ### IV. Conclusion: The Missing Premise

  **1. What the Colleague Most Probably Meant**
  The colleague most likely intended **Reading 6 (The Conversation Stopper)** masked as **Reading 2 (The Equilibrium Critique)**. They invoked the prestige of Keynes to suggest that worrying about the distant future is "bad economics" (methodologically unsound), hoping this would bleed into "bad philosophy" (normatively unsound). It was a rhetorical flourish designed to privilege immediate efficiency over distant justice.

  **2. What the Colleague Would Have to Defend**
  For the dismissal to amount to more than a flourish, the colleague must defend **Reading 5 (The Moral Horizon)**. They must state explicitly:
  > *"Because the current generation will not be alive to experience the consequences of their actions, the welfare of those who will be alive counts for less (or nothing) in our moral calculus."*

  **3. The Student's Response**
  If this line is deployed again, the premise missing from the argument is the link between *biological mortality* and *moral irrelevance*.
  *   **The Rebuttal:** "Keynes's remark is a biological truism (Reading 1) or a methodological warning about equilibrium (Reading 2). It does not entail the Moral Horizon (Reading 5). Unless you are prepared to argue that moral obligation expires at death, the slogan is irrelevant to intergenerational justice. If you *are* prepared to argue that obligation expires at death, please state that premise directly, as Keynes himself did not hold it."
