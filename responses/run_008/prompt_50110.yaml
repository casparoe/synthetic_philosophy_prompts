      *   *Refining the "Abandon Verdict" section:* What would make Level 2 wrong? If it turns out that emphasizing relationality *systematically* harms vulnerable individuals within the community (e.g., pressure to forgive to keep peace). Or if metaphysical individualism is proven necessary for specific rights protections.

