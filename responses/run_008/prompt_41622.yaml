      *   *Rawls's View:* Rawls explicitly rejected vNM expected utility under the Veil. He argued the uncertainty is not probabilistic risk (where you can calculate expectations) but radical uncertainty. Hence, Maximin (Difference Principle), not Maximize Expected Utility.
      *   *The Book's Claim:* Theorem shows Rawls is "inconsistent with rational choice."
