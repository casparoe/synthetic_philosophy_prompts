prompt: |-
  I've been reading a popular book about mathematics and ethics — the kind with chapters on voting paradoxes and trolley problems — and one chapter is devoted to what the author calls "the closest thing moral philosophy has to a proof." He summarizes Harsanyi's aggregation theorem roughly as follows: "Harsanyi showed that if every individual is rational in the von Neumann–Morgenstern sense, maximizing expected utility, then the only rational way for society to make choices is to maximize the sum of everyone's utilities. In other words, he gave a mathematical proof of utilitarianism. Because the theorem works with cardinal utilities measured on a common scale, interpersonal comparisons of well-being are built into the result rather than smuggled in as a separate assumption, so utilitarianism comes out not just as one attractive moral view among many but as the uniquely rational one. Rawls tried to escape this conclusion by concentrating on the worst-off member of society instead of the total or average, but the theorem shows that his difference principle is simply inconsistent with rational choice under uncertainty." I found this chapter pretty exciting, and I'm inclined to think the theorem really is a big deal, but something about the "proof of utilitarianism" framing feels too clean, and I don't know the literature well enough to say where the book is cutting corners.

  Could you go through this summary carefully for me? Tell me which parts a social choice theorist would accept without complaint, which parts are simplifications a popularizer might reasonably make, and which parts are subtly wrong or overstated — for instance, anything the theorem's actual assumptions do versus do not deliver. Please be specific about the gap, if there is one, between what Harsanyi's result establishes mathematically and the philosophical gloss the author puts on it, and about whether the treatment of interpersonal utility comparisons is fair. Finally, assess the claim about Rawls: does the alleged inconsistency really follow from the theorem itself, or does it depend on assumptions Rawls had independent reasons to reject? Write your answer in American English, and don't worry about citing chapter and verse — I just want an accurate map of what to trust and what to discount from this chapter.
