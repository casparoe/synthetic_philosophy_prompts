      *Wait, one more check on Verdict 6:* "Survival with too little value is no better than ending." This implies that *biological* survival isn't the metric. *Normative* survival is. This aligns perfectly with Verdict 5 (Successors are okay). So 5 and 6 are actually consistent. 1, 3, 5, 6 form a cluster. 2 is the outlier (psychological). 4 is the meta-ethical constraint.
      Actually, 2 and 3 are in direct conflict regarding *why* it's bad. 2 says "because living people feel undermined." 3 says "because it's bad even when they don't." I need to prioritize 3 over 2 if I want to save the "objective badness" intuition.

