          *   Identify the weak link: **Preparation Independence**. Explain why an epistemic view (especially QBism or relational QM) might reject the notion of an observer-independent $\lambda$ or the independence of preparations in a way that saves the epistemic view.
          *   *Crucial Distinction:* PBR targets models where $\psi$ represents knowledge *of an underlying ontic state*. QBism rejects the ontic state entirely. So PBR doesn't kill QBism, only specific $\psi$-epistemic hidden variable models.
      *   **Conclusion:** Summarize the philosophical payoff. Parsimony, resolution of measurement problem, alignment with experimental practice (tomography is estimation, not photography).

