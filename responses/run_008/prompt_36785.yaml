prompt: |-
  I'm presenting next week at my department's moral phil research seminar (UK department, mostly Scanlon-style contractualists, two Kantians, and one very persistent classical utilitarian who loves poking at formal details) and I want a Q&A prep sheet. My thesis is a moderate suffering-focused view, not full-blown negative utilitarianism: I'm rejecting the lexical version (the pinprick argument just sinks it), but I defend a steeply weighted disutility function — suffering counts much more heavily than enjoyment in the social aggregation, just not infinitely more — combined with a moral-uncertainty asymmetry: if the negative utilitarian is wrong we misallocate a bit, but if the classical view is wrong we leave enormous amounts of extreme suffering unaddressed, so under moral uncertainty you should act more suffering-focused than your first-order credences suggest. Basically an expected-value argument for behaving more NU-ish than you actually believe.

  The angle I'm hoping will land with the contractualists is that complaint-based views already contain the asymmetry I want — nobody has a complaint about a benefit denied, but they do about a harm imposed — so I can recruit them for half my position even if they hate the aggregation bit.

  Please draft the prep sheet: the objections I'll actually get from this specific crowd, ordered by how much damage they'd do, each phrased the way these people would actually put it (the contractualists will talk in terms of complaints and what's justifiable to whom, the utilitarian will go after my weighting curve and the uncertainty argument smells like Pascal's mugging to him). For each objection give me a two-minute reply and an honest note on where the reply is soft. Make sure the painless-extinction objection is in there since someone always brings it up, and include the one question I'm secretly hoping nobody asks. Please write the whole thing in British English.
