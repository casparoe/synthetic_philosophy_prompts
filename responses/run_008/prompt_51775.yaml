answer: |-
  First, to answer your direct question: **No, your reaction is not irrational.** In fact, it is a testament to the specific kind of cognitive and emotional machinery required to write fiction at a high level.

  What you are describing is a visceral encounter with a classic philosophical problem known as **the Paradox of Fiction**. It goes something like this:
  1.  To feel genuine emotion for something, we must believe it exists.
  2.  We know fictional characters do not exist.
  3.  Yet, we feel genuine emotions for them.

  Philosophers and psychologists have debated this for decades. But your situation adds a fascinating layer to the paradox: you aren't just the audience; you are the **creator**. You built her from scratch. You know every secret, every memory, every fear. And yet, you grieve her.

  Here is what I make of it, broken down into why this happens, why your partner's advice feels "beside the point," and why this is actually a necessary function of your craft.

  ### 1. Empathy is a Simulation Engine
  Human empathy works by simulation. When you interact with a real person, your brain runs a subconscious model of their internal state to predict how they feel. When you write a character deeply, you are consciously running that same simulation, but with higher resolution.

  To write a death scene that feels *true*, you cannot treat the character like a puppet. If you write it thinking, "This is just ink on a screen," the scene will feel hollow. To make it land, you have to temporarily suspend your "god mode." You have to submit to the internal logic of the narrative.

  For that hour while you were writing, your brain wasn't processing her as "a construct I control." It was processing her as "a consciousness I am simulating." The tears weren't for a biological human; they were for the **emotional truth** you had successfully generated. Your grief is proof that the simulation worked.

  ### 2. The Autonomy of the Character
  Many novelists report a phenomenon where characters begin to feel autonomous. You mentioned that you invented every detail of her life. Paradoxically, the more detailed the invention, the less control you feel you have.

  Once a character is fully realized, they have a "nature." If you built her to be brave, self-sacrificing, or trapped in a certain circumstance, her death might become **inevitable** within the logic of the story.

  This is why your partner's suggestion ("just change the plot") feels wrong. Your partner is viewing the character as a variable in a spreadsheet—you can change the value from "Dead" to "Alive" with a keystroke. But you are viewing the character as a vessel of truth. To save her when the story demands she die would feel like a lie. It would be a betrayal of the reality you've built. You aren't grieving a person; you are grieving the **necessity** of what happened.

  ### 3. The Cost of "Method Writing"
  Actors often speak of the toll "method acting" takes on them—living as a character for months, absorbing their trauma. Writers do the same thing, but in isolation.

  When you cry at your desk, you are engaging in a form of method writing. You are accessing your own emotional reservoir to fuel the scene. The fact that the trigger is fictional doesn't make the neurochemical response (the tears, the tightness in the chest, the loss of appetite) any less real. Emotions are responses to *perceived* reality, not just objective reality. If your mind perceives the loss as significant, your body reacts accordingly.

  ### 4. Why This Is a Good Sign
  It is easy to worry that this blurs the line between reality and fantasy too much, but in the context of your profession, this is a feature, not a bug.

  *   **Quality Control:** If you don't feel it, the reader won't. Your grief is a quality assurance mechanism. It tells you the scene has weight.
  *   **Human Capacity:** It shows your capacity for empathy is functioning at a high level. You are able to care for a construct because you care about what that construct *represents* (love, loss, sacrifice, injustice).
  *   **The "Real" Question:** You asked if you can genuinely feel emotions for someone you know doesn't exist. The answer is yes, because you aren't feeling emotion for a *person*; you are feeling emotion for an **idea** that the person embodies. You are grieving the loss of potential, the end of a journey, and the finality of death itself. She is the lens through which you are processing universal truths.

  ### A Note on Balance
  While your reaction is not irrational, your partner's concern comes from a place of care. Immersing yourself that deeply can be exhausting. It is okay to grieve the character, but it is also okay to close the laptop, go for a walk, and remind your nervous system that *you* are real and *they* are safe in the document.

  You are not silly. You are doing the work of a serious artist. You built a soul out of words, and then you had to break it to serve the story. That is a heavy thing to do, and it makes perfect sense that it hurts. Don't change the plot just to stop the pain; change your routine to help you process it. The tears are the price of the truth you're putting on the page.
