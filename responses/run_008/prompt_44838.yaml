answer: |-
  Dear colleague, I think your Patchwork Earth scenario is excellent because it isolates the division of linguistic labor from the causal history condition in a way standard Twin Earth cases do not, forcing students to confront whether externalism relies on experts or merely on environmental homogeneity. Below is the draft question text you can use for the exam, followed by a model answer I have written to show the depth of reasoning required, and finally a marking scheme broken down into five criteria with notes on common failures specific to this prompt.

  Here is the question text for your final. Please consider the following scenario called Patchwork Earth. It is identical to Earth in broad strokes except that the planet has one big ocean where the wet drinkable stuff in the northern half is water, H2O, while in the southern half it is the XYZ analogue, indistinguishable by taste, smell, freezing point, and everything the inhabitants can check. Crucially nobody on the planet knows any of this, the inhabitants have never developed chemistry, and there is a single linguistic community spread across both halves with enough migration and trade in the liquid going back centuries that it is one community using one word for the stuff, not two communities that happen to use homonyms. Write an essay addressing what the community's word refers to for a speaker born in the north who moved south at age five and never noticed anything. You must argue whether the community is unknowingly equivocating or has one word with a disjunctive extension or something else entirely, and explain what this pressure-tests in the standard motivation for externalism, specifically asking whether it is the speakers' ignorance of microstructure that is doing the work, the causal history of the term, or the division of linguistic labor with experts, given that the experts on Patchwork Earth are just as ignorant as everyone else. Then say what a defender of externalism should concede or bite the bullet on here, and whether appeals to narrow content can do any rescue work or just change the subject. Finally, include a section that drags in the old worry about whether externalism is compatible with privileged access, asking if the speaker who has been moved between halves without knowing it can still know what they mean by their own word, or whether the externalist owes them a story about that. A student who just labels positions and name-drops will receive a mediocre grade; only a student who actually reasons through the Patchwork case will do well.

  Below is a model answer that demonstrates the expected level of analysis. The Patchwork Earth case creates a severe tension for semantic externalism by removing the division of linguistic labor that Putnam relies upon to fix reference despite individual ignorance. In standard Twin Earth cases, Oscar defers to experts who know the difference between H2O and XYZ, but on Patchwork Earth, no experts exist. Consequently, the externalist cannot appeal to expert usage to fix the extension of water for the speaker who moved north to south. Instead, the reference must be determined either by the causal history of the speaker's interactions or by the macroscopic properties accessible to the community. If reference is determined by causal history, the speaker's term likely has a disjunctive extension, referring to H2O or XYZ depending on where the token utterance occurs, or perhaps referring to the disjunction H2O-or-XYZ universally. This violates the intuition that natural kind terms are rigid designators picking out a single underlying structure. If the externalist bites the bullet and accepts disjunctive reference, they concede that microstructure is not essential to meaning in this context, which undermines the original motivation for externalism that meaning is fixed by hidden nature rather than appearance. Alternatively, the externalist might claim the community is equivocating, using one phonetic word with two distinct semantic values, but this contradicts the prompt's stipulation that it is a single linguistic community with continuous trade and migration, suggesting a unified linguistic practice rather than accidental homonymy. This pressures the externalist to admit that without experts or environmental homogeneity, reference becomes indeterminate. Regarding privileged access, the case intensifies the threat posed by externalism to self-knowledge. If the meaning of water depends on whether the speaker is physically located in the north or south, and the speaker cannot tell the difference via introspection or superficial observation, then the speaker cannot know what they mean by their own thoughts simply by reflecting on them. They would need empirical investigation into their geographical location to know their own content. An externalist defender must either concede that privileged access is limited to narrow content or argue that self-knowledge is compatible with ignorance of extension. Appeals to narrow content can rescue privileged access by locating the knowable meaning in the speaker's internal conceptual role, but this effectively changes the subject away from externalist reference determination. Thus, narrow content saves self-knowledge only by abandoning the claim that extension determines meaning entirely. The defender must therefore choose between maintaining externalist reference at the cost of opaque self-knowledge or retaining privileged access by retreating to a two-factor semantics where narrow content handles the cognitive significance and wide content handles the reference. In Patchwork Earth, the lack of experts forces this choice into the open, showing that externalism cannot rely on ignorance alone without a mechanism to fix the extension, whether that be experts or environmental uniformity.

  Here is the marking scheme for grading the essays. The first criterion worth four marks requires the student to correctly identify the reference problem as either disjunctive or ambiguous and explain why standard Twin Earth solutions fail here, and students typically botch this by treating the north and south as separate communities like Twin Earth and Earth rather than one unified community. The second criterion worth four marks demands an analysis of the division of linguistic labor, specifically noting that no experts exist to fix reference, and students typically botch this by assuming Putnam's experts exist despite the prompt explicitly stating there is no chemistry. The third criterion worth four marks asks for an evaluation of whether ignorance or causal history is doing the work in externalism, and students typically botch this by claiming ignorance alone sustains externalism without addressing the need for a homogeneous environment. The fourth criterion worth four marks requires discussing the threat to privileged access and whether the speaker can know their own meaning, and students typically botch this by denying the threat entirely without explaining how the speaker could know their location empirically. The fifth criterion worth four marks demands an assessment of narrow content as a rescue strategy, and students typically botch this by arguing narrow content solves the reference problem rather than just preserving self-knowledge. You should sum these five sections for a total of twenty marks, ensuring that credit is given only for reasoning specific to the Patchwork constraints rather than general knowledge of Putnam. I hope this helps you finalize the exam and I think it will work very well to distinguish the stronger students from those who just memorized the intro level slogans.
