prompt: |-
  I'm teaching an upper-level philosophy of language seminar and writing the take-home final for it. I want one essay question on semantic externalism, centered on Twin Earth, that students can't get through by reciting the slogan about meanings not being in the head plus the H2O/XYZ setup they all memorized back in intro. Here's the twist I want to build in — tell me if you think it doesn't work as a question. It should turn on a scenario I made up; call it Patchwork Earth. Same setup as Twin Earth in broad strokes, except the planet has one big ocean and the wet drinkable stuff in the northern half is water, H2O, while in the southern half it's the XYZ analogue, indistinguishable by taste, smell, freezing point, everything the inhabitants can check. Crucially nobody on the planet knows any of this, the inhabitants have never had chemistry, and there's a single linguistic community spread across both halves — enough migration and trade in the liquid going back centuries that it's one community, one word for the stuff, not two communities that happen to use homonyms. Students have to say what the community's word refers to for a speaker born in the north who moved south at age five and never noticed anything, whether the community is unknowingly equivocating or has one word with a disjunctive extension or something else entirely, and what this pressure-tests in the standard motivation for externalism — is it the speakers' ignorance of microstructure that's doing the work, the causal history of the term, or the division of linguistic labor with experts, given that the experts on Patchwork Earth are just as ignorant as everyone else? Then they need to say what a defender of externalism should concede or bite the bullet on here, and whether appeals to narrow content can do any rescue work or just change the subject. I also want a part of the question that drags in the old worry about whether externalism is compatible with privileged access — the speaker who's been moved between halves without knowing it, can they still know what they mean by their own word, or does the externalist owe them a story about that? Make it so that a student who just labels positions and name-drops gets a mediocre grade and only a student who actually reasons through the Patchwork case can do well. Then write me a model answer of about 700 words and a marking scheme built around five must-hit points worth 20 marks total, with for each point a one-line note on the way students typically botch it — not generic botches, the specific ways they'll botch this question. It should be doable in 90 minutes. One formatting thing: the whole thing needs to be continuous prose, no headings, no bullet points, no bold, no tables — write it the way you'd write a long email, the question and the model answer and the marking scheme all as flowing paragraphs. My department has opinions about exam formatting, dont ask.
