  hey everyone, been thinking about the debate all week and i wanted to write down where i land on this whole superrationality vs code-reading thing because i think we are talking past each other a bit. first off, i need to be clear about my stance right away: i think the tournament fundamentally changes the subject from what hofstadter was arguing, even though it achieves the outcome he wanted. i'm about 90 percent confident in that claim because the mechanism is totally different. hofstadter's original argument in the scientific american column was about acausal reasoning, meaning you cooperate because you reason that your identical counterpart must reason the same way, without any physical link or information exchange between you. it was supposed to work in a black box scenario where you cant see the other guys move or mind. the tournament rule change explicitly allows you to peek inside the black box by reading the source code. so when the club president says this is just ordinary self-interest like reading a contract, she is technically right about the mechanism, even if she is dismissive of the outcome. by allowing code inspection, you turn an acausal logical correlation into a causal information flow. my bot cooperates because it literally sees a line of code in yours that says cooperate, or it proves that line exists. that is standard game theory with perfect information, not the mystical symmetry hofstadter was trying to isolate.

  that said, the superrationalists in the club arent completely wrong about the vibe of it, but i think they are conflating the result with the cause. i'm 85 percent sure that what the third guy said is the most accurate bridge between the two sides, which is that superrationality was always just evidential decision theory in disguise. when hofstadter said rational agents will do the same thing, he was treating your decision as evidence of theirs. the code-reading tournament makes that evidence concrete. instead of saying i assume you are like me, my bot says i will verify you are like me. this solves the huge practical mess we were worried about regarding the infinite loops. if my bot tries to simulate yours and yours simulates mine, we just hang forever until the tournament server kills the process. but the trick people mentioned about reasoning about proofs instead of simulating is real and it works. bots like fairbot look for a mathematical proof that the opponent will cooperate rather than running the opponent's code. this relies on gödelian logic and lob's theorem to avoid the infinite regress. i'm 95 percent confident that this technical solution works to prevent crashes and allow cooperation, because it is well documented in the literature on modal combat and program equilibrium. so practically, the tournament will work, and bots will cooperate, but philosophically it isnt doing what hofstadter thought he was doing.

  here is the thing though, and this is where i need to be honest about my uncertainty. while i am sure the mechanism is different, i am much less sure about whether hofstadter himself would care about that distinction. the one point i am least sure about, maybe only 40 percent confident, is whether hofstadter intended superrationality to be a claim about human psychology or a claim about abstract logic. if he meant it as a metaphor for how logical agents should behave regardless of implementation, then the code-reading tournament actually vindicates him by showing that logical correlation is a real thing you can build. if he meant it as a claim about human rationality in the absence of tech, then the tournament refutes him by showing you need the tech to make it work reliably. since i cant ask him, i have to guess, and that guess is shaky. but regardless of his intent, the tournament changes the subject from can rationality force cooperation to can code enforce cooperation. those are different questions. the first is about the nature of mind, the second is about the nature of computation.

  so to wrap this up, i think we should stop calling it superrationality in the context of this tournament because it muddies the water. the president is right that it is ordinary self-interest mediated by code inspection, but the superrationalists are right that the outcome validates the intuition that symmetry leads to cooperation. the proof-based bots show that we dont need magic, we just need better logic systems. i'm 90 percent confident that calling this superrationality is a category error, even if it feels similar. the tournament proves that logical correlation is computable, which is way cooler than hofstadter's original idea because it doesnt rely on hoping the other guy is as rational as you. it relies on checking their github repo. so lets just run the tournament, see who writes the best prunedbot or fairbot variant, and maybe save the philosophy debate for the pizza party after. i think that is the most productive way to handle it without getting stuck in the loop ourselves.
