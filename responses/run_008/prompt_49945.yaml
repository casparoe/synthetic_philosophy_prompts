      *   *Hook:* Headlines say "Scientists Locate Consciousness." Reality is messier.
      *   *Body:* GWT is about broadcasting. Broadcasting is for doing stuff (reporting, acting). That's Access. Phenomenology is the movie playing in the head.
      *   *Twist:* No-report paradigms. They remove the button press. But they calibrate using button presses. They are measuring "reportability in disguise."
      *   *Kicker:* We are mapping the dashboard, not the driver.

  6.  **Review against Constraints:**
