      *   *Low Confidence (The Weakest Point):* The specific claim that no-report paradigms *necessarily* define the moment by what *would* have been reported. Some proponents argue they are measuring "phenomenal consciousness without access." This is the contentious scientific frontier. I need to flag this as the point most likely to be challenged by a specialist.

