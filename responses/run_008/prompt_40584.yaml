      *   *Nuance:* Hardin's essay actually discusses pollution as a "reverse commons" (taking from the commons of the sink). The Lorax fits this well (dumping smoke into the air). I should emphasize that.
      *   *Nuance:* The Once-ler isn't purely rational in the Hardin sense. He ignores the Lorax's warnings until it's too late. This suggests bounded rationality or moral blindness, not just structural inevitability.

