          *   $= \frac{1 + 7p - 8p^2}{1+p}$.
          *   Matches Nadia's formula!
          *   Maximizing this: Derivative wrt $p$.
          *   Let $f(p) = (1 + 7p - 8p^2)(1+p)^{-1}$.
          *   $f'(p) = \frac{(7 - 16p)(1+p) - (1 + 7p - 8p^2)}{(1+p)^2}$
