          *   *Tension:* Evidentialism says "wait for evidence." Pragmatism says "believe to make it true."

      *   *Requirement 4: Relational/Content Sensitivity (Doxastic Partiality).*
          *   Desideratum: The theory must explain why believing a partner is faithful differs from believing a coworker is dishonest.
          *   *Case:* Trust vs. Paranoia. Does the *relationship* impose different epistemic duties?
          *   *Tension:* Evidentialism is usually content-neutral. Ethics of relationships is content-sensitive.

      *   *Requirement 5: Doxastic Control (The "Ought Implies Can" Problem).*
          *   Desideratum: The theory must assign responsibility without assuming direct voluntary control.
          *   *Case:* I can't just believe I'm rich. But I am responsible for my habits of inquiry.
