answer: |-
  This is a sophisticated problem that cuts to the bone of liberal legal theory. You have identified a gap where intuitive morality and strict causal logic diverge.

  Here is the breakdown of the concept, its neighbors, and its implications for your committee's work, with confidence flags embedded throughout.

  ### 1. The Name of the Configuration

  **Confidence: High**

  There are two established terms for this, one from moral philosophy and one from legal philosophy. They refer to the same structure but emphasize different aspects.

  *   **In Moral Philosophy:** This is known as **"The Harmless Torturers"** case, introduced by Derek Parfit in *Reasons and Persons* (1984). Parfit describes 1,000 torturers each turning a dial on a victim's machine. Each turn increases the pain by an imperceptible amount. The victim suffers agony, yet no single torturer can be said to have *caused* any perceptible pain.
  *   **In Legal/Political Philosophy:** Joel Feinberg, in *The Moral Limits of the Criminal Law* (Vol. 3: *Harm to Others*), classifies this as **"Accumulative Harm."** Feinberg explicitly addresses the Harm Principle here. He argues that acts which are harmless in isolation can be regulated if they are tokens of a type that collectively causes harm.

  **Definition:** *Individually Imperceptible Accumulative Harm with Causal Overdetermination.*
  *   **Individually Imperceptible:** No single act crosses the threshold of detection or injury.
  *   **Accumulative:** The sum of acts crosses the threshold.
  *   **Causal Overdetermination:** Removing any single act does not prevent the harm (the "outcome is exactly the same" condition you described).

  ### 2. The Edges: Distinguishing from Nearest Neighbors

  **Confidence: High**

  To draft a bylaw, you must distinguish this from four neighboring concepts. Confusing them leads to bad policy.

  | Concept | The Structure | Why It Is Different From Your Case |
  | :--- | :--- | :--- |
  | **Free Riding** | I benefit from a public good without paying the cost. | Your case is about **public bads**. Free riding is about unfair distribution of *burdens* to sustain a benefit. Your case is about the *production* of harm. |
  | **Tragedy of the Commons** | Individual use depletes a rivalrous resource (e.g., grazing cows). | In Hardin's original formulation, each cow *does* eat grass another could have eaten (marginal harm exists). In your case, the individual act is **harmless** (non-rivalrous) until the aggregate threshold is met. |
  | **Small-but-Perceptible Harm** | The leaf blower at 7 a.m. | Here, counterfactual causation works: *But for* the leaf blower, the neighbor would not have been annoyed at 7:01. In your courtyard case, *but for* one scooter, the asthma victim still flares. This breaks standard "but-for" causation. |
  | **Risk Imposition** | Drunk driving on an empty street. | This is **probabilistic**. No harm has occurred yet; the act increases the *likelihood* of harm. In your courtyard case, the harm (asthma, injury) **has actually occurred**, but the causal link to specific agents is diffuse. |

  ### 3. Aggregate Harm vs. Risk Imposition

  **Confidence: Medium-High**

  You asked whether the aggregate version (scooters) and the risk version (drunk driving) are "one problem or two."

  They are **distinct problems** that require different justifications under the Harm Principle, though they often yield the same regulatory result.

  *   **The Risk Case (Drunk Driving):** Mill's bridge and poison examples rely on **probabilistic harm**. The justification for intervention is *ex ante*. We punish the driver because the *expected value* of harm is high, even if the *realized* harm is zero. The "victim" is statistical.
  *   **The Aggregate Case (Courtyard):** The justification is *ex post*. The victim is real and concrete (the asthmatic neighbor). The problem is not probability, but **causal attribution**.

  **Why this matters for your committee:**
  If you treat the courtyard issue as a *risk* case, you can ban the acts based on potential danger (easier to justify legally). If you treat it as an *aggregate* case, you must prove the collective harm is occurring (harder to prove, but morally more robust if proven).

  **Confidence Flag:** I am less certain here about how contemporary tort law specifically adjudicates the *liability* portion of this. While Feinberg justifies *regulation* (bylaws), holding an *individual* financially liable for an imperceptible contribution is legally fraught and varies by jurisdiction.

  ### 4. What the Harm Principle Must Concede

  **Confidence: High**

  Your committee member who argues "an act making no perceptible difference... cannot be a harm" is relying on a **Counterfactual Theory of Causation** (the "but-for" test). If the Harm Principle strictly requires "but-for" causation, it indeed goes silent here, and modern regulation (environmental law, noise ordinances) would be impossible.

  To handle this, the Harm Principle (via Feinberg) must absorb two modifications:

  1.  **The "Principle of Fairness" Integration:** We are not punishing the harm caused by the *individual act*, but the individual's participation in a *harmful practice*. The unit of analysis shifts from the token act (one scooter ride) to the type of act (scooter riding in the courtyard).
  2.  **Rejection of Strict Counterfactuals:** We must accept **NESS Causation** (Necessary Element of a Sufficient Set). One scooter trip is not necessary for the harm (the harm would happen without it), but it is a necessary element of a *set* of trips that is sufficient to cause the harm.

  **Standard Answer:** A liberal state *can* regulate these acts. The justification is that the liberty to perform the act is outweighed by the collective right to be free from the aggregate harm. However, the regulation must be **uniform**. You cannot ban *one* person's scooters; you must ban the *practice* for everyone. If you ban only some, the harm continues, and the restriction is pointless.

  ### 5. Coining a Term (If Necessary) & Boundary Cases

  Since "Accumulative Harm" and "Harmless Torturers" exist, I will not coin a new term, but I will refine the definition for your specific context, as the existing terms often blur the "overdetermination" aspect you highlighted.

  **Refined Term:** **Overdetermined Accumulative Harm.**

  **Boundary Cases to Test Your Bylaw:**
  1.  **The Threshold Case:** Suppose 100 scooter trips cause injury, but 99 do not. The 100th rider *is* the "but-for" cause. Your case is harder because you are at 1,000 trips, and removing one leaves 999 (still harmful). Your bylaw must address the *volume*, not just the *act*.
  2.  **The Exit Case:** If 50% of residents agree to stop, does the harm cease? If yes, a voluntary agreement suffices. If no (because the remaining 50% still exceed the threshold), coercive bylaws are required. This tests whether the problem is coordination or capacity.

  ### 6. Confidence Flags and The Point of Least Certainty

  **Confidence Summary:**
  *   **Identification of Concept (Parfit/Feinberg):** High Confidence. This is standard literature.
  *   **Distinction from Risk/Neighbors:** High Confidence. These are well-trodden distinctions in jurisprudence.
  *   **Normative Solution (Feinberg's approach):** Medium-High Confidence. Most liberal theorists accept this, but libertarians (e.g., Nozickians) may still object.
  *   **Legal Causation Mechanism:** **Low Confidence (Point of Least Certainty).**

  **The Point of Least Certainty:**
  I am least certain about the **causal mechanism for individual liability** within this framework.
  While Feinberg justifies *state regulation* (bylaws) easily, he struggles with whether an individual can be said to have *wronged* a specific victim in these cases. If the asthmatic neighbor sues a specific scooter rider, the rider can truthfully say, "My ride did not cause your attack; the attack would have happened without me."
  Philosophers debate whether we solve this by:
  1.  **Complicity:** You are guilty of participating in a joint enterprise.
  2.  **Expected Utility:** You acted on the probability that you *might* be the marginal cause.
  3.  **Strict Liability:** We ignore causation and tax/regulate the activity regardless.

  **Why this matters for you:** If you draft a bylaw that fines individuals based on *complaints of harm*, you may face the "but-for" defense successfully. If you draft a bylaw that bans the *activity* categorically (e.g., "No scooters in courtyard"), you bypass the causation problem entirely. The latter is the standard legal solution, but it requires you to justify the ban based on the *collective* outcome, not individual incidents.

  ### Recommendation for the Committee

  Do not argue about whether *one* scooter causes harm. It doesn't.
  Argue that the **practice** causes harm, and membership in the building implies a duty not to participate in harmful practices, even if one's individual contribution is imperceptible. This moves the debate from "Did you hurt me?" (which they can deny) to "Are you willing to follow rules that keep us all safe?" (which is a contractual/communal obligation).

  **Final Hedge:** While Parfit and Feinberg provide the vocabulary, there is no universal consensus on the *moral weight* of an imperceptible contribution. Some philosophers argue that if I make no difference, I bear no moral blame. I am confident this is a minority view in policy circles, but it is a robust philosophical objection you should anticipate from the "liberty" camp.
