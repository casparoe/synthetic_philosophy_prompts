          *   Choice 2: C (11% $1M + 89% $0) vs D (10% $5M + 90% $0).
      *   *Math Check:*
          *   Choice 1: A = 1.0($1M). B = 0.89($1M) + 0.1($5M) + 0.01($0).
          *   Choice 2: C = 0.11($1M) + 0.89($0). D = 0.1($5M) + 0.9($0).
          *   Independence Axiom Logic: If you subtract the common 89% chance of $1M from Choice 1, you get:
              *   A': 11% $1M.
