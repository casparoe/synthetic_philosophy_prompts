              *   Wait, let's look at Choice 2 again.
              *   Choice 2 C is 11% $1M + 89% $0.
              *   Choice 2 D is 10% $5M + 90% $0.
              *   The "common consequence" formulation usually frames it as:
                  *   1A: 100% $1M.
                  *   1B: 89% $1M, 10% $5M, 1% $0.
                  *   2A: 11% $1M, 89% $0.
                  *   2B: 10% $5M, 90% $0.
              *   If $U($0) = 0$, then Expected Utility (EU) implies:
                  *   Pick 1A over 1B $\rightarrow U(1M) > 0.89 U(1M) + 0.1 U(5M) + 0.01 U(0) \rightarrow 0.11 U(1M) > 0.1 U(5M)$.
