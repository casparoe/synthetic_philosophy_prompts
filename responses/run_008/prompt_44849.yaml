answer: |-
  Two identical humanoid robots, Alpha and Beta, stand in an orchard. Alpha has spent five years learning to pick apples through trial and error, its neural weights shaped by visual feedback and motor resistance. Beta was assembled this morning using a complete weight transfer from Alpha, replicating every synaptic connection and sensor calibration exactly, but Beta has no operational history prior to this moment. Both are activated simultaneously; both reach for an apple, their cameras tracking the fruit's redness, their grippers adjusting pressure based on tactile feedback, their internal state vectors evolving identically as they lift the fruit. An observer with a complete lab log knows Alpha's history of interaction and Beta's instantaneous instantiation, but sees no difference in their current sensorimotor loops or behavioral outputs.

  **1. Verdicts and Rationale**
  On the **Causal-Coupling reading**, both Alpha and Beta are fully grounded. The verdict hangs on the fact that, at the moment of action, both systems possess internal states that are causally covariant with the presence of apples and successfully steer motor output toward them; the history of those states is irrelevant to the current standing relation. On the **Developmental reading**, Alpha is grounded but Beta is not (or is merely parasitic). The verdict hangs on the fact that Beta's symbol-manipulating dispositions were not shaped by interaction with referents over time but were instantially copied; for the Developmentalist, grounding is an achievement earned through learning trajectories, not a static structural property.

  **2. Load-Bearing Feature and Gradualism**
  The load-bearing feature is the **discontinuity of origin**: Beta's grounding-relevant structure appears instantaneously rather than accumulating through interaction. If you remove this by making the past continuous—for instance, by replacing Alpha's subsystems with new components one by one (Ship-of-Theseus) while it continues to interact with apples—the verdicts converge: both readings count the resulting system as grounded because the history of interaction remains unbroken. If, however, you gradually overwrite a naive system's weights with Alpha's while it interacts with apples, the Causal reading maintains grounding throughout, but the Developmental reading faces a dilemma. It must either insist on a sharp discontinuity (grounding snaps into existence only when a threshold of "original" learning is met), which invites sorites objections, or admit grounding comes in degrees (accumulating as the system's own interaction shapes more of its weights), which weakens the claim that grounding is a binary precondition for meaning.

  **3. Attack from the Developmental Reading**
  The Developmental reading comes out worse in this scenario because its verdict (Beta is ungrounded) clashes with the intuition that functional identity should suffice for semantic identity. A proponent of this reading might attack the scenario as rigged, arguing that it stipulates the verdict by treating symbols as observable physical states rather than normative roles. Invoking an **etiological theory of content**, the Developmentalist would charge that the scenario begs the question by assuming a state's representational content is fixed by its current causal powers. On an etiological view, what a state represents depends constitutively on the history by which it was selected to play its role; since Beta's states were not selected by apple-interaction but by a copying process, they literally do not represent "apple" regardless of their current utility. The scenario thus fails to generate a conflict from the theories; it merely asserts a functionalist definition of content against a historical one.

  **4. Adjudication and the Nature of the Dispute**
  Given that the two systems are behaviorally indistinguishable in every possible test, the case adjudicates nothing empirically; no lab log can distinguish a copied weight from a learned one once the transfer is complete. This equivalence suggests that the dispute over grounding is not a dispute about system capacity or engineering success, but a metaphysical disagreement about the nature of content itself. It reveals that "grounding" is being used to track two different properties: one is a **functional capacity** (successful sensorimotor coordination), and the other is a **historical status** (legitimacy of origin). The debate persists not because we lack data, but because we have not agreed on whether meaning is a matter of what a system *can do* now or how it *came to be* able to do it.
