answer: |-
  ### 1. The Procedure

  This checklist operationalizes prioritarianism for quarterly funding cycles. It replaces open-ended ethical debate with a calculable sequence. The panel must complete Steps 1–5 for every intervention proposal. Step 6 is the final authorization.

  **Step 1: Baseline Data Verification**
  For each intervention, the secretariat provides: (a) Total cost; (b) Total unweighted health gain (QALYs); (c) Average baseline Health-Related Quality of Life (HRQoL) of the recipient population on a 0–1 scale.
  *   *Sufficient Answer:* Data verified by the health economics unit.
  *   *Termination:* If baseline HRQoL data is missing, the proposal is deferred to the next cycle. No estimation is permitted.

  **Step 2: The "Worse Off" Determination**
  Define "worse off" strictly as **current health status** (baseline HRQoL), not lifetime prospect.
  *   *Rule:* A patient is "worse off" if their baseline HRQoL is below 0.5.
  *   *Exception Pointer:* If a group has low current HRQoL but high lifetime prospects (e.g., temporary acute injury), flag for Step 6 review. If a group has high current HRQoL but poor lifetime prospects (e.g., progressive neurodegeneration early stage), flag for Step 6 review.
  *   *Sufficient Answer:* Binary classification: Below Threshold (BT) or Above Threshold (AT).

  **Step 3: Apply the Weighting Rule**
  Apply the colleague's operationalization: Health gains for BT populations count double. Health gains for AT populations count single.
  *   *Calculation:* Weighted QALYs = (QALYs for BT × 2) + (QALYs for AT × 1).
  *   *Sufficient Answer:* A single "Weighted Value" figure for each intervention.

  **Step 4: The Leveling-Down Test**
  Explicitly check if funding this intervention requires withdrawing resources from an AT group such that: (a) The AT group loses health; (b) The BT group gains health; (c) **No net weighted value is created.**
  *   *Rule:* If the action makes better-off people worse off with *no* compensating gain to the worse-off (i.e., the BT group gains nothing or the net weighted value is negative), the procedure vetoes the action.
  *   *Sufficient Answer:* Pass/Fail. If "Fail," the proposal is rejected unless overridden in Step 6.
  *   *Note:* If the action makes better-off people worse off but creates *positive net weighted value* (due to the double weighting), it passes this test but proceeds to Step 6 with a "Net Health Loss" warning.

  **Step 5: Cost-Value Ranking**
  Calculate Cost Per Weighted QALY (CPWQ). Rank interventions from lowest CPWQ to highest.
  *   *Sufficient Answer:* A ranked list filling the available budget.
  *   *Termination:* Interventions outside the budget cutoff are rejected unless Step 6 applies.

  **Step 6: Panel Judgment Call**
  The Chair presents any proposals flagged in Step 2 (Lifetime Prospect conflict) or Step 4 (Net Health Loss warning).
  *   *Action:* The panel votes to accept the procedural ranking or override it.
  *   *Requirement:* Any override must be recorded in the published rationale with a specific citation of the conflicting value (e.g., "Lifetime prospect prioritized over current status").
  *   *Termination:* Final funding list published.

  ### 2. Where Judgment Cannot Be Eliminated

  This procedure automates calculation, not morality. Judgment remains irreducible at three points. First, the **threshold setting** (0.5 HRQoL) is arbitrary; moving it to 0.4 or 0.6 changes winners and losers. The panel must own this number publicly, not hide it behind technical data. Second, the **lifetime prospect exception** in Step 2 acknowledges that current status is an imperfect proxy for priority. A young person with a temporary disability scores "worse off" here, while a stable but terminally ill elder might not. The procedure flags this but does not resolve it; the panel must debate these flagged cases in Step 6. Third, **uncertainty** in clinical data cannot be fully modeled. When evidence is weak, the weighting rule may amplify error. The panel must decide whether to apply a discount factor to novel interventions, which the procedure does not mandate. Ultimately, the checklist ensures consistency, but the moral weight of the weights remains a human choice.

  ### 3. Three Worked Cases

  **Case 1: ICU Expansion vs. Mental Health Program**
  *Intervention A:* Expands ICU capacity for sepsis patients (Baseline HRQoL 0.3). Cost: $1M. Gain: 50 QALYs.
  *Intervention B:* Workplace depression prevention (Baseline HRQoL 0.7). Cost: $1M. Gain: 80 QALYs.
  *Procedure:* A is Below Threshold (BT); B is Above Threshold (AT).
  *Weighting:* A = 50 × 2 = 100 Weighted QALYs. B = 80 × 1 = 80 Weighted QALYs.
  *Result:* A ranks higher despite lower raw health gain. The procedure funds ICU expansion. The rationale states: "Benefits to the severely ill carry greater moral weight."

  **Case 2: Disinvestment (Physio vs. Palliative)**
  *Proposal:* Withdraw physiotherapy from moderately ill patients (HRQoL 0.6) to fund palliative home care for terminal patients (HRQoL 0.2).
  *Impact:* Physio withdrawal loses 100 QALYs. Palliative care gains 80 QALYs. Net raw health loss: 20 QALYs.
  *Weighting:* Loss (AT) = 100 × 1 = 100. Gain (BT) = 80 × 2 = 160. Net Weighted Value = +60.
  *Result:* Procedure recommends funding palliative care. It passes the Leveling-Down Test (someone gains), but triggers a "Net Health Loss" warning. The panel must publicly justify sacrificing total health for equity.

  **Case 3: The Uncomfortable Answer**
  *Proposal:* Fund a life-extending drug for a tiny group with extreme disability (HRQoL 0.1) by cancelling a vaccination program for healthy adults.
  *Impact:* Vaccination cancellation causes 500 QALYs lost (AT). Drug provides 100 QALYs gained (BT).
  *Weighting:* Loss = 500. Gain = 200. Net Weighted Value = -300.
  *Result:* The procedure **rejects** the drug. However, consider a variant where the drug gains 300 QALYs. Weighted Gain = 600. Net Weighted = +100. The procedure **funds** the drug.
  *Uncomfortable Truth:* In the variant, the authority actively harms 500 healthy people to help a few severely ill people, resulting in a net reduction of total health life-years. The procedure demands this be published plainly: "We prioritized the worst-off even though total population health declined."

  ### 4. What the Procedure Cannot Do

  This procedure cannot resolve the fundamental tension between efficiency and equity without remainder. It forces the panel to look at net health losses, but it cannot make them palatable. Regarding your economist's concern: **Yes, the colleague's doubling rule survives the leveling-down test.** Strict leveling-down occurs only if we make the better-off worse off with *no* gain to anyone. This rule always requires a gain to the worse-off to trigger funding. However, the rule *does* endorse **efficiency losses** (Case 2 and 3), where total health decreases to improve distribution. The economist may confuse leveling-down with efficiency loss. The procedure distinguishes them: Step 4 vetoes pure leveling-down, but Step 6 allows efficiency losses if the panel votes. The procedure cannot prevent the journalist from headline-writing that you "burned health to buy equity," but it ensures you cannot say you didn't know the cost.
