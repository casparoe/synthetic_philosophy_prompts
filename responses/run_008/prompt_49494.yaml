answer: |-
  It is completely understandable that you feel something is off about your brother's summary, because while his grasp of the historical timeline is decent, his interpretation of the theoretical stakes, particularly regarding Hayek and the role of computing, misses the core insight that most economists today accept. You are actually closer to the truth on the Hayekian point than he is, and it is not a caricature to say Hayek believed the knowledge required for planning does not exist in a form that can be calculated. To start with Mises, your brother is largely correct that Mises's 1920 argument was not about incentives or human selfishness but about information. Mises argued that without private ownership of the means of production, there can be no genuine exchange of capital goods, and without exchange, there are no market prices. Without prices, which encapsulate the relative scarcity of resources, a planner has no common unit to compare the cost of building a railway with steel versus building it with timber. They are comparing apples to oranges without a currency of value, making rational economic calculation impossible. This was indeed posed as a logical impossibility under socialism, not just a moral critique.

  Where your brother's account begins to drift is in his description of Oskar Lange's reply. Lange did propose a trial-and-error method where a central planning board would simulate the market by adjusting prices based on surpluses and shortages, essentially acting as the Walrasian auctioneer. However, it is crucial to note that Lange's model was not a command economy in the Soviet style where every detail is dictated from above. Lange explicitly kept actual markets for consumer goods and labor. Workers could choose their jobs, and consumers could spend their wages on whatever goods they preferred. The planning board only set the prices for capital goods and raw materials. So, when your brother suggests this settled the question of planning an economy, he is overlooking that Lange's solution relied on preserving market mechanisms for the most dynamic parts of the economy, consumption and labor, while only planning the intermediate production stages. Furthermore, Lange admitted that Mises had performed a great service by highlighting the necessity of a pricing mechanism, acknowledging that earlier socialists had ignored the problem entirely. This generosity is historically accurate, but admitting the problem exists is not the same as solving it in a way that validates full-scale planning.

  The most significant error in your brother's narrative concerns Friedrich Hayek and the nature of the knowledge problem. Your brother claims Hayek conceded Mises was too dogmatic by shifting the argument from impossible in principle to merely too slow computationally, but this is a fundamental misunderstanding of Hayek's contribution. Hayek did not argue that the equations were too complex for the computers of the 1930s; he argued that the data required to solve the equations does not exist anywhere to be fed into a computer. In Hayek's view, economic knowledge is dispersed, tacit, and subjective. It exists in the minds of millions of individuals as specific knowledge of time and place, such as a machine operator knowing a tool is about to break or a local merchant knowing a shift in customer preference. This knowledge is not statistical data that can be collected centrally; it is only revealed through the act of buying, selling, and risking capital in a market. Therefore, the problem is not that the calculation is too heavy for the processor, but that the input data is nonexistent until the market process generates it. To say Hayek was merely worried about processing speed is to treat economic knowledge as objective data rather than subjective discovery.

  This leads directly to the claim that modern computing power solves the objection. While it is true that we have exponentially more processing power today, this does not overcome the Hayekian critique because computers process data, not tacit knowledge. Even with big data and AI, the system relies on information that has already been generated and recorded. It cannot account for the entrepreneurial discoveries that have not yet happened or the subjective valuations that individuals have not yet expressed through action. A modern example often cited is Walmart, which uses massive internal planning and computing power to manage logistics, but even Walmart relies on internal profit centers and transfer prices to simulate market conditions within the firm, and it ultimately responds to external market prices from its suppliers and customers. If Walmart tried to plan the entire economy without external price signals, it would face the same calculation problem regardless of its server capacity. The bottleneck is not the speed of computation but the availability of the right kind of information, which is created by the competitive market process itself.

  So, to answer your question about who is closer to the truth, your intuition about Hayek is correct and your brother's characterization of him as a mystical anti-arithmetic guy is the caricature. Hayek's point was epistemological, not mathematical. He argued that the market is a discovery procedure, not just a calculation engine. Your brother is right that Mises framed the problem around prices and that Lange offered a theoretical model to simulate them, but he is wrong that Lange's model constituted full planning since it retained consumer markets, and he is wrong that computing power validates planning today because it ignores the knowledge problem. As for who won the debate, most historians of economic thought side with Hayek and Mises on the theoretical point that rational allocation requires genuine prices derived from private property, which is why Lange's model was never implemented in full even by socialist states, and why the Soviet Union relied on black markets and informal bargaining to function. Lange's generosity to Mises acknowledges the strength of the critique, but it does not change the consensus that the calculation problem remains a fundamental hurdle for socialism that computing power alone cannot clear.
