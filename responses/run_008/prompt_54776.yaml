answer: |-
  The claim that the brain is literally a computer faces a pincer movement of objections that threatens to crush it between triviality and falsehood. On one side lies the problem of pancomputationalism: if computation is merely the mapping of physical states onto formal symbols, then any physical system—a wall, a storm, a bucket of water—can be described as computing anything. Under this loose definition, the statement "the brain is a computer" is vacuously true, carrying no more explanatory weight than saying "the brain is made of matter." On the other side lies the biological reality: if we tighten the definition of computation to require discrete states, clocked transitions, and a clear separation between hardware and software, the brain fails the test. It is wet, analog, continuous, and devoid of a central processor. Neuromodulators like serotonin do not simply carry data; they alter the chemical landscape, reconfiguring how networks respond to input. There is no stored program distinct from the wiring.

  To salvage computationalism, we must navigate between these extremes. We need a definition that is robust enough to exclude walls (non-trivial) but flexible enough to include neurons (biologically compatible). The solution requires abandoning the classic von Neumann architecture as the standard for what a computer is and replacing it with a view of computation as specific causal organization. The verdict I defend is this: Computationalism is literally true, but only if we understand computation not as syntax manipulation, but as the possession of a causal structure that supports specific counterfactuals.

  The triviality objection hinges on the idea that syntax is observer-relative. Any pattern of physical states can be mapped to logical states if the observer is creative enough. A wall has microphysical states that change over time; with a sufficiently gerrymandered lookup table, one could map these states to the operations of a word processor. However, this mapping is external to the wall. The wall does not care about the mapping. If you were to intervene and change the input conditions, the wall would not reliably produce the corresponding output states required by the program. It lacks the causal machinery to sustain the counterfactuals. A real computer is defined not just by what it does, but by what it *would* do under different conditions. It is organized such that specific physical structures enforce state transitions.

  This shifts the criterion from pattern-matching to causal power. For a system to be a computer, its physical organization must be such that it reliably transitions between states in a way that mirrors formal operations, independent of an observer's description. This excludes the wall. The wall's state transitions are driven by thermodynamics and external forces, not by an internal organization designed to preserve logical structure. This makes the claim non-trivial. Not every physical system has the causal topology required to support computation.

  However, does this causal definition accommodate the messy reality of the brain? Critics argue that because the brain is analog and chemical, it cannot support the discrete states required for computation. This objection relies on a category error regarding physical computers. Even silicon computers are physically analog; voltages are continuous, electrons leak, and heat fluctuates. They count as digital only because they are engineered to be noise-tolerant, collapsing continuous physical variations into discrete functional categories. The brain does something similar. While membrane potentials are analog, action potentials (spikes) are all-or-nothing events. Neural circuits often function as threshold devices, treating continuous input as discrete output. The physical substrate is wet, but the functional topology can still be discrete.

  The deeper challenge comes from neuromodulation and the lack of a hardware/software split. In a laptop, you can change the software without melting the hardware. In the brain, changing the "program" often means changing the chemical sensitivity of the neurons themselves. Serotonin doesn't just pass a message; it changes the gain on entire networks, altering how future inputs are processed. To a classic computationalist, this looks like the hardware is melting every time the software runs.

  Yet, this does not disqualify the brain from being a computer; it merely means it is a different *kind* of computer than a PC. It is a dynamic, reconfigurable architecture. In engineering terms, this is akin to a field-programmable gate array or a neural network where weights are updated during operation. The distinction between program and data, or hardware and software, is a feature of specific computer architectures, not a necessary condition for computation itself. Computation, at its core, is about information processing via causal state transitions. If a chemical signal alters the transition rules of the system, it is still a computational process—it is a meta-computational operation that updates the parameters of the base computation. The brain computes its own programming rules in real-time. This is not a failure of computationalism; it is a refinement of the model.

  Therefore, a viable computationalism must be grounded in mechanistic causal organization. It claims that the brain is a computer because it is a physical system organized to manipulate variables according to rules embedded in its causal structure. This view avoids triviality because it demands specific causal powers that walls lack. It avoids biological incompatibility because it does not demand silicon, clock cycles, or a static program. It treats the brain as a physical machine whose organization explains its capacity for input-output transformation.

  Does this version still do genuine scientific work? Yes. It directs neuroscience away from mere localization ("this part lights up when you see faces") toward mechanism ("how does this circuit transform input A into output B?"). It forces researchers to identify the variables being manipulated and the rules governing their transition. If we treated the brain as purely analog dynamics without computational structure, we would look only for differential equations describing fluid flow. While those exist, they miss the functional organization. The computational perspective allows us to see how stable functional states emerge from messy physics.

  However, we must be precise about the verdict. If computationalism is taken to mean "the brain runs software like a PC," it is false. That version is biologically untenable. If it is taken to mean "computation is in the eye of the beholder," it is trivial. But if computationalism is the claim that the brain possesses a causal organization that implements state transitions supporting counterfactuals, it is literally true. This is not a metaphor. It is an ontological claim about the structure of the nervous system.

  The distinction matters. A metaphor suggests we are pretending the brain is a computer for convenience. A literal claim suggests the brain belongs to the same natural kind as other computing systems, defined by causal topology rather than substrate. By anchoring computation in causal power rather than syntax, we rescue the thesis from vacuity. The wall does not have the causal power to sustain a program. The brain does. The brain is not merely *like* a computer; it is a biological computer, distinct in architecture from silicon machines but identical in the abstract sense of being a causal system organized for information processing.

  Ultimately, the debate often stalls because participants argue past each other with different definitions of "computer." Once we strip away the cultural baggage of laptops and software, and focus on the underlying requirement of counterfactual-supporting causal organization, the thesis holds. It is non-trivial because most physical systems lack this organization. It is compatible with neuroscience because it accommodates analog dynamics and chemical modulation as implementation details. And it is scientifically vital because it provides the only framework we have for linking physical mechanism to cognitive function. Computationalism, properly understood, is not a fading metaphor but a durable description of biological machinery.
