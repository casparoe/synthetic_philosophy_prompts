      *   *Refining `reasoning`:* Ensure it directly answers the "formal analog" question.

      *   *JSON Validation:* Escape quotes if necessary (none expected in simple strings). Ensure no trailing commas.

      *   *Wait, one check on Westin:* Westin is often criticized in privacy engineering because "control" is often an illusion (notice and consent fatigue). I should reflect that in "Distorted" or "No Counterpart". I'll put the psychological autonomy in "No Counterpart".

