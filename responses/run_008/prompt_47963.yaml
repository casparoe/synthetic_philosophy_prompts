      *   *Correction on Round 2:* Students might not know "physics-speak." Provide a word bank or constraints.
      *   *Correction on Russell:* Don't name-drop Russell immediately. Ask: "Is the failure in the *object* or in your *tool* (the mind)?"
      *   *Scoring:* Make it gamified. "The Berkeley Buck."

  8.  **Finalizing the Output Structure:**
      *   Lesson Overview (Timing, Goals).
