      *   **Problem:** The Master Argument ("esse est percipi") usually fails to land. Students see it as trivial ("of course I can't think of something without thinking of it") or a verbal trick. They don't feel its philosophical weight.
      *   **Goal:** An in-class activity where students *try* to conceive of an unconceived object and fail (or succeed), specifically targeting the "smuggled observer."
      *   **Specific Mechanics:**
          *   Submission of descriptions of mind-independent objects.
          *   Panel of classmates acts as "Berkeleyan Detectives" to find the smuggled viewpoint.
