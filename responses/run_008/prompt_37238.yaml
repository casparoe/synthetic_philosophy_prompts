  Actually, the theoretical point is usually that ambiguity aversion exists *even without* adversaries. But testing the *difference* is a great pedagogical tool. I will suggest comparing the "Nature" urn (Round 1) vs "Adversary" urn (Round 3).

  *(Incentives)*:
  Tokens -> Raffle. 18 students. 5 tokens = 1 raffle ticket. Grand prize: $10 coffee card. This is cheap but effective.

