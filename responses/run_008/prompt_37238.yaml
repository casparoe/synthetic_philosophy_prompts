answer: |-
  This is a fantastic plan. With 18 students, you have a "goldilocks" size: large enough for aggregate patterns to emerge, small enough to manage physical props and data by hand. The key to making this work in 75 minutes is **rigorous timekeeping** and **pre-packaged randomness** (don't waste time drawing balls in class).

  Here is a complete run-sheet for the section, designed to move from intuition to formal violation to theoretical response.

  ### Part 1: Logistics & Incentives (The "Stakes")

  Since you cannot use real money, you need **fungible, trackable tokens** that feel valuable enough to induce stress but cheap enough for your budget.

  *   **Currency:** Poker chips or printed "Section Bucks."
  *   **Redemption:** At the end of the semester, tokens enter a raffle.
      *   *Prize:* A $15–$20 coffee gift card or a "homework pass" (if allowed).
      *   *Mechanism:* 10 tokens = 1 raffle ticket. This creates diminishing marginal utility, which subtly introduces risk aversion, but that's fine (we control for it in Round 2).
  *   **Props:**
      *   **Urn A (Risk):** A clear box with exactly 10 Red and 10 Black ping-pong balls (visible).
      *   **Urn B (Ambiguity):** An opaque bag. Inside are 20 balls. *Crucial:* You must prepare 3 versions of this bag beforehand (see Rounds below) or use a "sealed envelope" method where the composition is written on paper inside the bag.
      *   **Elicitation:** Small slips of paper (half-index cards). Students write: `Name | Round # | Choice (A/B) | Implied Prob %`.

  ### Part 2: The Activity (20 Minutes Max)

  **Introduction (2 mins):**
  "Today we are testing how you value information. You will make bets. Your winnings accumulate as tokens. At the end of the term, tokens enter a raffle for [Prize]. Maximize your tokens."

  **Round 1: The Classic Ellsberg (Discovery)**
  *   **Setup:** Show Urn A (10R/10B). Show Urn B (Opaque, 20 balls, composition unknown to them). Tell them Urn B was filled by a Random Number Generator before class.
  *   **The Bet:** "I will draw one ball from *one* urn. If it is **Red**, you win 2 tokens. If Black, 0."
  *   **Elicitation:** Hand out slips. "Circle Urn A or Urn B. Also, write down: What is the % chance you think you win with Urn B?"
  *   **Collection:** Collect slips. Tally on board immediately (A vs B).
  *   **Expected Result:** Significant preference for A.
  *   **The Trap:** Look at the "Implied Prob %" column. Many will write "50%" for Urn B but *choose* Urn A.
  *   **TA Script:** "I see 14 of you chose Urn A. But 10 of you wrote that Urn B has a 50% win rate. If they are equal, why pay the 'tax' of avoiding Urn B?"

  **Round 2: The Risk Control (The "Known Bad")**
  *   **Goal:** Separate ambiguity aversion from risk aversion.
  *   **Setup:** Show Urn C (Clear box). visibly load **4 Red and 16 Black** balls (20% win rate).
  *   **The Bet:** "Win 2 tokens if **Red**."
  *   **Choice:** Urn B (Unknown, 20 balls) **VS** Urn C (Known 20% Red).
  *   **Elicitation:** Slips again. "Circle B or C."
  *   **The Reveal:** If a student chooses **C**, they are explicitly stating that the Unknown Urn is *worse* than a known 20% chance.
  *   **Why this works:** Risk aversion explains preferring a sure thing over a gamble. It does *not* explain preferring a known 20% chance over an unknown chance that is statistically likely to be centered around 50%. If they choose C, they are exhibiting extreme ambiguity aversion.
  *   **TA Script:** "If you chose Urn C, you are betting that the Unknown Urn has *less* than a 20% chance of Red. Raise your hand if you think the Unknown Urn actually has <20% Red." (Usually, no hands go up). "Then why did you bet on the 20% urn?"

  **Round 3: The Adversarial Twist**
  *   **Goal:** Test Ellsberg's hunch (is it ambiguity or distrust?).
  *   **Setup:** Invite a volunteer to the front. Turn them around. Have them fill Urn D (Opaque) with 20 balls from a large bucket while the class watches the *bucket* but not the *bag*.
  *   **Instruction to Volunteer:** "You are the 'House'. Your goal is to minimize the class's total token winnings. Fill the bag however you like."
  *   **The Bet:** Win 2 tokens if **Red**.
  *   **Choice:** Urn A (Known 50%) **VS** Urn D (Adversarial Unknown).
  *   **Elicitation:** Slips.
  *   **Expected Result:** Preference for Urn A should spike compared to Round 1.
  *   **TA Script:** "Did more of you flee to Urn A this time? If so, your aversion isn't just about 'unknown probabilities'; it's about 'unknown intentions.'"

  **Resolution (3 mins):**
  Actually draw the balls for the winning urns (or reveal the pre-sealed envelopes) and distribute tokens. This closure is vital for credibility.

  ### Part 3: The Debrief & Formal Mapping (35 Minutes)

  Use the whiteboard to map their behavior to the axioms.

  **1. The Violation of Probabilistic Sophistication**
  *   **Concept:** If you have a unique subjective prior $P$, then $P(Red_B)$ must equal some number $p$.
  *   **Board Work:**
      *   Round 1 Choice (A > B) $\rightarrow$ Implies $0.5 > P(Red_B)$.
      *   Round 1 Choice (A > B on Black) $\rightarrow$ Implies $0.5 > P(Black_B)$.
      *   Sum: $P(Red_B) + P(Black_B) < 1$.
      *   **Conclusion:** You cannot be represented by a unique probability measure. You are not "probabilistically sophisticated."

  **2. The Sure-Thing Principle (Savage P2)**
  *   **Explanation:** P2 says if you prefer Act $f$ to Act $g$ when event $E$ occurs, and you prefer $f$ to $g$ when $E$ does not occur, you should prefer $f$ to $g$ unconditionally.
  *   **Application:** In the Ellsberg setup, the "unknown" part is the event $E$ (the composition of the urn). Your preference flips depending on whether you are betting on Red or Black, even though the "unknown" part remains the same. You are letting the *outcome* of the bet influence your assessment of the *probability* of the urn.
  *   **Philosophy Angle:** Ask the philosophy students: "Is P2 a norm of rationality, or just a convenience for modeling?"

  **3. The Solution: Sets of Priors (Maxmin)**
  *   **Model:** Gilboa & Schmeidler (1989).
  *   **Concept:** Instead of one $P$, the agent holds a set $\mathcal{P}$. They evaluate acts by $\min_{P \in \mathcal{P}} E_P[U]$.
  *   **Mapping:** For Urn B, your set is $\mathcal{P} = \{p \in [0, 1]\}$. The min expected utility is 0. For Urn A, $\mathcal{P} = \{0.5\}$. The min expected utility is 0.5.
  *   **Round 2 Connection:** If you chose the Known 20% (Urn C) over Unknown (Urn B), your "min" for Urn B was effectively treated as < 0.2. This implies your set of priors is weighted heavily toward the worst-case scenario.

  **4. The Adversarial Round (Trust vs. Ambiguity)**
  *   **Discussion:** In Round 3, the set of priors $\mathcal{P}$ likely shifted. With "Nature," $\mathcal{P}$ might be uniform. With an "Adversary," $\mathcal{P}$ concentrates on the composition that minimizes your win rate.
  *   **Point:** Ambiguity aversion often conflates *epistemic uncertainty* (I don't know) with *strategic uncertainty* (Someone knows and hides it).

  ### Part 4: Honest Limits (10 Minutes)

  You must tell them what the activity *failed* to prove. This is crucial for an intermediate course.

  1.  **The "Rationality" Debate:**
      *   **Claim:** Standard theory says Ellsberg choices are irrational (violate axioms).
      *   **Counter:** Buchak (Risk-Weighted Utility) or simply "Prudence." If the TA is untrustworthy, avoiding the unknown urn *is* rational. The activity assumes the TA's promise ("Random Number Generator") is credible. If students doubt the TA, they aren't ambiguity averse; they are **suspicious**.
      *   **Takeaway:** Ambiguity aversion is only a "paradox" if we assume the agent trusts the description of the uncertainty.

  2.  **Randomization:**
      *   **Issue:** If a student could flip a coin to decide their bet, they could hedge the ambiguity.
      *   **Limit:** The activity forced a deterministic choice. Some theorists argue that allowing randomization dissolves the paradox.

  3.  **Sample Size Noise:**
      *   **Issue:** With 18 students, a 11-7 split is not statistically significant.
      *   **Mitigation:** Acknowledge this. "We are looking for the *direction* of the bias, not a p-value. If even 3 people chose the Known 20% over the Unknown, that is theoretically interesting, even if not statistically robust."

  ### Part 5: Troubleshooting (What Will Go Wrong)

  **1. The "Bored Skeptic" Problem**
  *   **Risk:** Students realize tokens don't matter and vote randomly.
  *   **Fix:** **The Raffle Hook.** Bring the physical gift card to class. Put it on the desk. Say, "The person with the most tokens at the end of the section gets this *today*." (If budget allows one immediate prize). If not, emphasize the cumulative nature.
  *   **Fix:** **Public Tally.** Write the token counts on the board after every round. Create social pressure to "win."

  **2. The "Composition Guessing" Game**
  *   **Risk:** In Round 1, students try to guess *your* psychology. "The TA wouldn't put 50/50 in the bag, that's too obvious. It's probably 80 Red."
  *   **Fix:** **Pre-commitment.** Before class, write the composition of Urn B on a slip, seal it in an envelope, and tape it to the board. "This was filled by a script before I arrived." This removes the "TA Psychology" layer.

  **3. Elicitation Bottleneck**
  *   **Risk:** Collecting and reading 18 slips takes too long.
  *   **Fix:** **Two-Color Cards.** Give every student a Red card and a Black card (or just colored paper).
      *   "Hold up Red for Urn A, Black for Urn B."
      *   You can count this in 5 seconds.
      *   *Correction:* You need the "Implied Probability" data for the debrief.
      *   **Hybrid:** Use cards for the Choice (fast tally on board), use slips *only* for the "Implied %" (collect these to analyze later, don't tally live). This saves 5 minutes.

  **4. The "Known Bad" Confusion**
  *   **Risk:** Students confuse "Known 20% Red" with "Known 20% Win."
  *   **Fix:** Be hyper-specific with language. "Urn C wins if Red. There are 4 Red balls. You have a 20% chance." Write "20%" big on the board next to Urn C.

  **5. Time Creep**
  *   **Risk:** The debrief drags.
  *   **Fix:** Hard stop at minute 65. Save the "Adversarial" theoretical implications for the start of the next lecture if needed. Prioritize the Savage Axiom violation; that is the core learning objective.

  ### Summary Checklist for You
  *   [ ] **Props:** 2 Clear Boxes, 2 Opaque Bags, 60+ Balls (Red/Black), Envelope for pre-sealed composition.
  *   [ ] **Incentives:** Tokens, Raffle Ticket Box, Prize (visible).
  *   [ ] **Handouts:** Slips of paper (pre-cut to save time).
  *   [ ] **Board Plan:** Left side for Token Counts, Right side for Axiom Mapping.
  *   [ ] **Script:** Memorize the Round 2 "Implied Probability" trap question.

  This structure respects the students' intelligence (Econ/Phil majors will spot a gimmick) while giving you the empirical "hook" to hang the formal theory on. Good luck!
