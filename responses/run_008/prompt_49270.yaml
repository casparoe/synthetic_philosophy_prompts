  I'm giving a talk at an AI-safety workshop defending a softened version of Dennett's late view on counterfeit people, and I need Q&A prep. My sketch of the argument: counterfeit money is dangerous not because it looks real but because it exploits a reflex we can't turn off -- for Dennett the intentional stance, which makes us treat anything that talks sensibly as a genuine agent with beliefs and desires. So synthetic personas that pass the stance test get a presumption of personhood they never earned, and the fix is legal rather than epistemic: treat them like counterfeits, require watermarking along the lines of the EURion constellation pattern on banknotes, and impose brutal liability on whoever creates such systems or passes them along. The audience is about 30 alignment researchers: a big chunk who take AI welfare and digital sentience seriously (a couple have written about risks of mistreating potentially-suffering systems), some interpretability folks who think any watermark is an arms race you eventually loose, and one philosopher of mind who knows Dennett's intentional-stance work cold. Draft my prep sheet: the objections this crowd will actually raise -- not the ones a generic ethics-of-AI crowd would -- ordered by how much damage each would do, phrased the way they'd put it, each with a two-minute reply and a note on where my reply is soft. Include the question I'm praying nobody asks. Please also keep clear what's actually settled about Dennett's view versus what's genuinely contested among people who've engaged with it, and don't present a contested reading as the consensus. American English please.
