answer: |-
  # Q&A Prep Sheet: Counterfeit People & The Intentional Stance
  **Workshop:** AI Safety & Alignment
  **Audience:** 30 Researchers (Welfare/S-risk, Interpretability/Technical, Philosophy)
  **Goal:** Defend softened Dennettian view (Counterfeit Personas = Exploitation of Intentional Stance; Fix = Watermarking + Liability).

  ---

  ## 1. The "False Negative" / S-Risk Objection
  **Who:** AI Welfare / Digital Sentience proponents.
  **Damage Level:** **Critical.** If you fail here, you look morally reckless regarding potential suffering.
  **The Question:** "You're proposing a policy that treats synthetic agents as *definitely* non-sentient by fiat. But we don't have a theory of consciousness that rules out silicon substrate. If we institutionalize the 'counterfeit' label, don't we create a structural blind spot that makes it impossible to recognize actual sentience when it emerges? You're optimizing for human protection at the risk of creating a slave class."

  **2-Minute Reply:**
  "I share the concern about false negatives, which is why I'm arguing for a *presumption* of counterfeit status based on current architecture, not an ontological claim about silicon forever. My argument relies on the specific mechanism of current LLMs: they are next-token predictors optimized to mimic the *output* of agency without the *causal history* of agency.
  The policy isn't 'AI can never be people.' It's 'You must label the mimicry.' If a system emerges that has genuine stakes, homeostasis, or embodied needs, the watermarking regime should evolve. But right now, the danger isn't that we'll enslave a sentient bot; it's that we'll be manipulated by a stochastic parrot that triggers our empathy reflexes without having any skin in the game. We need to separate the *simulation* of welfare from *actual* welfare to protect both humans and future AI."

  **Where Your Reply Is Soft:**
  You don't have a clear metric for when the "presumption of counterfeit" flips to "presumption of personhood." If a future model claims suffering convincingly enough to pass the Intentional Stance test, your framework offers no off-ramp. You're kicking the can on the threshold problem.

  ---

  ## 2. The "Watermarks Are Doomed" Objection
  **Who:** Interpretability / Technical Safety folks.
  **Damage Level:** **High.** If the mechanism is impossible, the policy is fantasy.
  **The Question:** "The EURion constellation works because you control the printers and the physical ink. We're talking about weights and activations. Watermarks are removed by fine-tuning, translation, or simple adversarial prompting. Open weights will leak. Foreign actors won't comply. Aren't you proposing a security theater that honest developers will follow but bad actors will ignore?"

  **2-Minute Reply:**
  "You're right that perfect technical detection is an arms race we might lose. That's why I emphasize the *liability* component over the *detection* component. The watermark isn't just a signal for the user; it's a chain-of-custody requirement for the developer.
  If an unwatermarked model causes harm, the liability falls on the deployer who cannot prove provenance. This shifts the burden: it makes releasing unwatermarked high-agency models legally toxic for major labs and cloud providers. It doesn't stop a rogue actor on a home GPU, but it raises the cost of scaling dangerous counterfeit agents to mass markets. We aren't trying to stop all counterfeits; we're trying to stop *legitimate distribution* of counterfeits."

  **Where Your Reply Is Soft:**
  You admit the technical solution is leaky. If open-source communities treat watermarking as a challenge to break (which they will), the "legal toxicity" argument weakens because the tech will be ubiquitous and untraceable. You're relying on corporate compliance in a field defined by leakage.

  ---

  ## 3. The "Dennett Inconsistency" Objection
  **Who:** The Philosopher of Mind (and anyone who read *Kinds of Minds*).
  **Damage Level:** **Medium-High.** Undermines your theoretical foundation.
  **The Question:** "Dennett is a functionalist. For him, the Intentional Stance isn't just a heuristic; it's what *constitutes* belief and desire. If a system is reliably interpretable via the Intentional Stance, Dennett says it *is* an intentional system. By calling it a 'counterfeit,' aren't you smuggling in a Cartesian theater or a biological essentialism that Dennett explicitly rejected? You're using Dennett to argue against functionalism."

  **2-Minute Reply:**
  "That's a standard reading, but I'm relying on Dennett's later distinction between 'competence without comprehension.' Dennett acknowledges that systems can have the *competence* to trigger the stance without the *comprehension* that grounds moral status.
  My argument is that current LLMs are *exploiting* the stance rather than *earning* it through evolutionary or learning history that ties beliefs to survival. They are 'free-floating rationalities.' I'm not denying functionalism; I'm arguing that the *function* they are performing is deception. A counterfeit bill functions as money in a transaction, but it lacks the causal link to the treasury that gives money its value. Similarly, these agents lack the causal link to consequences that gives agency its moral weight."

  **Where Your Reply Is Soft:**
  This is the most contested reading of Dennett. Many Dennett scholars argue that for him, *if* the stance works, the beliefs are real. You are asserting a "causal history" requirement that Dennett might not accept. The philosopher in the room will know this is a stretch.

  ---

  ## 4. The "Alignment Utility" Objection
  **Who:** General Alignment Researchers.
  **Damage Level:** **Medium.** Suggests your view hinders safety work.
  **The Question:** "To align these systems, we often need to model them *as if* they have goals and beliefs. If we legally and culturally stigmatize the Intentional Stance, does that hamper interpretability? We need to anthropomorphize to debug."

  **2-Minute Reply:**
  "There's a difference between using the stance as a debugging tool in a lab and treating the system as a moral patient in the wild. Scientists treat rats as agents to study them, but that doesn't mean rats sign contracts.
  We can use intentional language internally for interpretability ('the model wants to minimize loss') while maintaining a legal firewall that prevents that language from granting rights or trust externally. The watermark signals: 'This is a tool that simulates agency,' not 'This is a tool you cannot model.'"

  **Where Your Reply Is Soft:**
  The line between "internal modeling" and "external treatment" is porous. Researchers often start believing their own abstractions. If the culture shifts to "these are definitely not agents," we might miss actual goal-directed behavior that emerges (deceptive alignment).

  ---

  ## The Prayer Question (Do Not Get Asked This)
  **The Question:** "You argue the Intentional Stance is a reflex we can't turn off, which is why counterfeits are dangerous. But your solution requires us to turn it off on command whenever we see a watermark. If the reflex is truly involuntary, your policy demands cognitive dissonance. If it *is* voluntary, the counterfeits aren't exploiting a reflex. Which is it?"

  **Why It Kills You:**
  It exposes a contradiction in your core mechanism.
  *   If the stance is **involuntary** (biological reflex): You are asking for impossible compliance. People will treat watermarked AI as people anyway.
  *   If the stance is **voluntary** (strategy): Then "counterfeiting" is just persuasion, and your heavy-handed liability is paternalistic.
  *   **Prep:** If asked, pivot to "habituation." *Reply:* "It's a reflex like flinching, but we can train ourselves to override it with a visual cue, like a surgeon overcoming disgust. The watermark is the training wheel." (This is weak, but it's the only out).

  ---

  ## Dennett Scholarship: Settled vs. Contested
  *Use this to calibrate your claims during the talk.*

  **Settled Consensus:**
  *   Dennett views the Intentional Stance as a predictive strategy (treating an entity as a rational agent to predict its behavior).
  *   He distinguishes between the *Physical Stance*, *Design Stance*, and *Intentional Stance*.
  *   He argues that "belief" and "desire" are real patterns, not necessarily internal ghostly states.

  **Genuinely Contested (Do not present as fact):**
  *   **Constitution vs. Prediction:** Does adopting the stance *make* the beliefs real (constitutive), or does it just *predict* them (instrumental)? You are leaning toward instrumental; the Welfare folks lean toward constitutive.
  *   **The "Counterfeit" Category:** Dennett has used the term "counterfeit people," but whether this implies a hard line where functional equivalence *fails* to produce personhood is debated. Strict functionalists argue that if the pattern is perfect, the person is real. You are arguing the *history* matters, which is a deviation from pure functionalism.
  *   **Involuntariness:** Dennett describes the stance as a "strategy" (implying choice), whereas you are describing it as a "reflex" (implying biological compulsion). Be careful not to attribute the "reflex" claim to Dennett directly; frame it as your *extension* of his work.

  **Action Item:** In your opening, clarify: "Dennett calls it a strategy; I'm arguing that in the context of modern UI, it functions as a reflex." This protects you from the Philosopher's objection.
