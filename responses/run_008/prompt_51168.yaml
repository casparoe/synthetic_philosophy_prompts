  Warm-up
  Okay, brain dump: Stop the cycle. Can't say "thermodynamics says no." Locate the entropy increase. Gas? Demon? Szilard says work happens *before* reset. Bennett says reset is key. Brillouin says look costs energy. Fluctuation folks say it's noise. Distinguish physical from logical cost. Respect Liouville's theorem. No begging the question. Demon internal? Memory physicalization key. Separate "demon jams" from "demon pays." Okay, ready to structure.

  The requirements
  1.  **No Circular Appeal to Thermodynamics:** The resolution cannot invoke the Second Law to prove the Second Law. *Case:* Popular accounts claiming the demon fails "because thermodynamics forbids it" offer zero mechanism.
  2.  **Temporal Localization of Cost:** Must specify *when* the entropy debt is incurred. *Case:* In the Szilard engine, work is extracted *before* reset; the account must explain why the engine doesn't run forever before the bill comes due.
  3.  **Measurement vs. Erasure Distinction:** Must accommodate reversible measurement. *Case:* Bennett-style reversible computing shows copying is costless; accounts claiming measurement *intrinsically* costs energy are falsified.
  4.  **Physicalization of Information:** Must treat the demon's memory as a physical state subject to micro-dynamics. *Case:* Avoiding abstract "knowledge" causing wavefunction collapse or magical entropy reduction.
  5.  **Success vs. Failure Clarification:** Must state if the demon *fails* to sort (mechanical block) or *succeeds* but pays later. *Case:* An account that doesn't specify whether the gate jams or the gas heats up explains nothing.
  6.  **Micro-Reversibility Compatibility:** Must square with time-reversible underlying dynamics. *Case:* Entropy increase must emerge from coarse-graining or boundary conditions, not dynamic law violation (Liouville's theorem).

  Non-negotiable vs. camp prejudice
  The hard constraints are logical and empirical. You cannot invoke the Second Law to prove the Second Law; that's question-begging, plain and simple. You must respect micro-reversibility; Newton and Schrödinger don't care about entropy. You must treat information as physical state; otherwise, you're doing magic. Everything else is bettable. The claim that measurement intrinsically burns energy is a prejudice from the Brillouin camp, killed by Bennett's reversible copying models. Similarly, insisting the demon must mechanically jam rather than thermodynamically balance is a preference for failure over accounting. The fluctuation view is an interpretive stance on probability, not a structural requirement.

  Tensions
  Your friend is sharp. The tension is real. Ban appealing to macroscopic thermodynamics, you must derive cost from microscopic dynamics. But microscopic dynamics are reversible and volume-conserving (Liouville). How get irreversible entropy increase? You need coarse-graining or boundary conditions. The tension lies in justifying coarse-graining without secretly assuming the thermodynamic arrow you're trying to prove. Constructive mechanisms often smuggle in friction by hand. A non-circular account must show how information compression necessitates phase-space expansion elsewhere, without assuming expansion beforehand. It's the hardest tightrope in foundations.

  Quick scorecard
  **Brillouin:** Fails the reversibility test; assumes measurement costs energy, which Bennett disproved. **Landauer/Bennett:** Strongest on physicalization and erasure, but faces circularity charges regarding the justification of Landauer's Principle. **Fluctuation:** Dissolves the paradox by denying the setup's stability, but risks sidestepping the informational mechanism entirely.
