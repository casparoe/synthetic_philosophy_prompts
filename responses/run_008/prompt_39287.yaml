  "You cancelled the policy, Ray. That's the bet," D said, swirling his beer. The bar was quiet, just the hum of the cooler. "If you're so sure you slide into the survival branch, put skin in the game. Five hundred says you don't make it to forty."

  Ray didn't flinch. He'd taken that sketchy route home in the rain last month specifically because of this. "You're missing the mechanism. It's not luck. It's branching. When the car skids, the universe splits. In most branches, I hit the tree. In one, I correct. I'm only conscious in the one where I correct."

  "But that's true even if Many-Worlds is garbage," D shot back. "In a single-world universe with plain old chance, you *also* never experience being dead. Nobody wakes up dead. If you play Russian Roulette in a single world, the only version of you that exists to talk about it is the one where the hammer clicked empty. Your logic proves too much. It implies Russian Roulette was always safe before Everett ever wrote his thesis."

  "No, because in a single world, the bullet kills you. Full stop. There's no 'you' left to observe the death."

  "Exactly. So why does branching change the subjective experience? If I survive a crash in a single world, I'm lucky. If I survive in MWI, I'm... what? Mandatory?"

  Ray leaned in. "Mandatory. In a single world, survival is low probability. In MWI, survival is probability one across the multiverse, and consciousness tracks the survival path. You can't observe the termination of observation."

  "So you're saying the map changes the territory," D said. "Just because the math says 'many worlds' doesn't mean your consciousness gets a free pass through the minefield. You're confusing existence with experience. In both cases, the guy who dies doesn't complain. The difference is, in your version, you're pretending the dead branches don't count against the odds."

  "They don't count," Ray said. "Because I'm not in them."

  2. "Thin slices"

  "Okay, fine," D said. "Let's talk about the slices. You say you slide into the survival branch. But most survival branches aren't clean escapes. Most are hospital branches. You survive the crash, but you're a quadriplegic. You survive the cancer, but it metastasizes slower. The 'immortal' you is just the guy who keeps surviving in luckier but more banged-up ways. Is that what you're betting on? A eternity of chronic pain?"

  Ray shook his head. "That's assuming the 'weight' of those branches matters to me. Sure, the amplitude—the measure of existence—is tiny for the clean escape. Most of the 'Ray' mass ends up dead or mangled. But I don't feel the weight. I only feel the branch I'm on. As long as there's a non-zero amplitude where I'm intact, that's where I wake up."

  "But if the amplitude is tiny, isn't it effectively zero?" D pressed. "If 99.999% of the worlds have you dead, why does consciousness favor the 0.0001%? That's magic. You're saying subjective probability ignores objective measure. It's like saying you can walk through walls because there's a non-zero chance your atoms tunnel through. Technically true, practically impossible."

  "I'm saying subjective continuity *requires* it," Ray countered. "Look, if you clone yourself a million times and kill nine hundred thousand, the survivors don't feel dead. They feel lucky. MWI just makes the cloning continuous. The 'thinness' of the slice doesn't erase the experience of being in it. You're worried about the odds. I'm worried about the certainty of experience."

  D paused, tapping the bottle. "So you're willing to accept a reality where you're the only version of yourself left, screaming into a void where everyone else knows you died? That's not immortality. That's isolation. You become a ghost in your own machine."

  "It's continuity," Ray said. "And I'd take isolation over non-existence. Besides, how do you know the amplitude drops? Maybe the branches where I thrive are the ones that split further. You're assuming the decay is linear."

  "I'm assuming physics," D said. "But sure. Assume you stay intact. You still end up alone."

  "Better alone than gone," Ray said. "If the experience is real, the weight doesn't matter. You can't measure your own absence."

  3. "The wall"

  "Here's the wall though," D said, leaning back. "Aging. You can't quantum tunnel out of entropy. Your telomeres don't flip a coin. There's no branch where your heart just keeps beating for three hundred years because biology is deterministic-ish. It's grinding you down. So even if you're right, this 'immortality' just means you can't die in accidents. You still die of old age."

  Ray nodded slowly. "I've made peace with that. QI isn't eternal youth. It's just preventing the hard stop. The branching happens on quantum events. Cell decay is mostly classical thermodynamics. So yeah, I'll age. But maybe I slide into the branch where the rare quantum mutation fixes the DNA? Or the branch where the medical tech advances just fast enough?"

  "That's a Hail Mary," D said. "You're banking on quantum miracles fixing biological inevitability. That brings us back to the weight problem. The branches where you live to 150 are infinitely thinner than the branches where you die at 80. At some point, the slice is so thin it breaks. You can't ride a probability wave that has no amplitude."

  "Maybe," Ray admitted. "But 'some point' is further than zero. If I gain even ten years of subjective continuity by riding the quantum wave instead of accepting the classical crash, isn't that worth the bet? I'm not trying to live forever. I'm trying to not die *yet*."

  "So you're not immortal," D said. "You're just procrastinating."

  "Aren't we all?" Ray smiled. "I just think I have a better strategy for the delay. You accept the grind. I look for the split."

  "And when the splits stop coming?"

  "Then I die," Ray said. "But not a second before I have to."

  D raised his glass. "To the second before."

  "To the branch," Ray corrected.

  4. coda, "What they didn't settle"

  D's point sticks hardest: selection bias works in a single world too, so MWI doesn't grant special safety. But Ray's counter lingers: subjective experience can't verify its own end, so the "thinness" of the survival branch might not matter to the person living it. I fix furnaces, not universes. But when I climb a ladder now, I wonder if I'm avoiding the fall, or just sliding into the branch where I didn't fall. Neither answer changes the gravity, but only one lets me sleep at night.
