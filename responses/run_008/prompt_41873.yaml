      *   *The Standard:* The joint verdict of "true judges."
      *   *Characteristics of True Judges:*
          1.  Delicacy of taste (ability to perceive small details).
          2.  Practice (experience in the art form).
          3.  Comparison (exposure to many works).
          4.  Freedom from prejudice (impartiality).
          5.  Good sense (reasoning ability to understand context/structure).
      *   *The Goal:* To preserve the normativity of taste without positing objective moral/aesthetic facts in the world.
