      *   *Lying:* Asserting $P$ while believing $\neg P$ with intent to deceive (Mahon, Carson).
      *   *Misleading:* Implicating $\neg P$ without asserting it (truthful but deceptive).
      *   *Paltering:* Using truthful statements to create a false impression.
      *   *Bullshit (Frankfurt):* Indifference to truth value. Focus is on effect/impression, not truth/falsity.
      *   *Norms of Assertion (Williamson):* Assert only what you know.
      *   *AI Specifics:* Models don't "believe" in the human sense. They predict tokens. We have to operationalize "belief" as "internal state/confidence" or "training objective alignment."

