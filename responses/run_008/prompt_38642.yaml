prompt: |-
  I'm a high school junior working on an extended essay for a philosophy elective, and I've gotten myself stuck on the question of what an emotion actually is. The background reading I've done says that philosophers divide roughly into three camps: some think emotions are judgments (evaluations of how things are going for you), some think they are perceptions (of, say, value or danger), and some think they are just feelings (bodily states that happen to matter to us). Going in, my own tentative principle was that an emotion is a judgment that something good or bad is happening, felt in the body — anger is judging you've been wronged, felt as heat; fear is judging there's danger, felt in the stomach. But when I test that principle against my honest gut verdicts on particular cases, it keeps failing, and I can't tell whether the principle is wrong or my verdicts are.

  Here are the verdicts. On a flight last spring I was genuinely terrified during turbulence, even though I believe, and would argue in class, that commercial flying is safer than driving — that fear was an emotion, and a full-strength one. When a car backfires behind me and I jump, I don't think that's an emotion at all; it's a reflex, closer to blinking than to being afraid. I have been moved to tears by an instrumental piece of music with no lyrics and nothing I believe about the notes — no judgment I can identify — and I count that as an emotion. Watching a classmate freeze through a class presentation, I felt strong embarrassment on his behalf, even though I don't think he did anything embarrassing (I thought he was brave to push through), and I'd still call that an emotion. Feeling betrayed when a friend shared something I'd told her in confidence is my clearest case of an emotion, and there the judgment seems essential: the feeling is inseparable from thinking a wrong was done. Yet I also felt real anger at my coffee table after stubbing my toe on it, while believing perfectly well that tables can't be at fault, and I don't want to be told that wasn't anger. Finally, if I'm irritable all afternoon for no reason I can name, I'd call that a mood rather than an emotion, though I can't articulate the difference. The pair I keep grinding on: the turbulence fear and the backfire startle both involve no judgment of real danger, and both are bodily, sudden, and unwilled — yet one goes in the emotion column and one doesn't, and I don't know what does the sorting.

  What I'd like from you is a principle, stated precisely, that captures these verdicts or as many of them as can honestly be saved — and I'd like to know which of the three camps (judgment, perception, or feeling) it belongs to, or whether it cuts across them. Please tell me what the principle predicts for cases I haven't listed: is nostalgia an emotion? Is jealousy about a partner's affair that I know for a fact never happened? Is the chill at a horror movie I know is fake? And rather than adding one saving clause per case, tell me plainly which of my verdicts your principle cannot accommodate and which one you'd overturn first, so I can see the trade-off between a complex principle that saves everything and a simple one that doesn't. One more request: since my essay will be graded on accuracy, please keep a clear line between what is actually settled in this area and what is genuinely contested among people who study it. If the judgment theory I started with is a live option, say so; if it's widely thought to fail on cases like mine, I'd much rather learn that than be handed it back as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior, philosophy elective, writing an extended essay.
      *   **Topic:** The nature of emotion (ontology of emotion).
      *   **Current Understanding:** Knows the three main camps (Judgmentalism, Perceptualism, Somatic/Feeling Theory). Has a tentative hybrid principle (Judgment + Bodily Feeling).
      *   **Problem:** The tentative principle fails against specific intuitions/verdicts (turbulence fear vs. backfire startle, music tears, empathy embarrassment, anger at tables, moods vs. emotions).
      *   **Request:**
          1.  A precise principle that captures as many verdicts as possible.
          2.  Classification of the principle (Judgment, Perception, Feeling, or Hybrid).
          3.  Predictions for new cases (nostalgia, delusional jealousy, horror movie chill).
          4.  Honesty about trade-offs (which verdicts must be overturned).
          5.  **Crucial Constraint:** Distinguish between settled consensus and contested debate in the field. Do not present contested theories as fact.

  2.  **Evaluate the Philosophical Landscape (Accuracy Check):**
      *   *Is there a consensus?* No. The nature of emotion is one of the most debated topics in philosophy of mind and psychology.
      *   *Judgmentalism (Stoics, Nussbaum, Solomon):* Struggles with recalcitrant emotions (fear of flying) and non-cognitive animals/infants.
      *   *Somatic/Feeling Theory (James-Lange, Damasio):* Struggles to distinguish emotions from mere bodily sensations or moods, and doesn't account for intentionality (aboutness).
      *   *Perceptualism (Döring, Tappolet):* Gaining traction as a middle ground. Emotions are like perceptions of value. Allows for "illusions" (fear of flying) just as vision allows for optical illusions.
      *   *Hybrid/Componential (Prinz, Griffiths):* Emotions are complex constructs involving physiology, cognition, and behavior.
      *   *Startle Reflex:* Generally agreed *not* to be an emotion in itself, but a precursor.
      *   *Moods:* Generally distinguished from emotions by lack of specific object (intentionality).

  3.  **Develop a Principle:**
      *   The user's current principle (Judgment + Body) fails on recalcitrant emotions (fear of flying) and non-cognitive emotions (music, anger at tables).
      *   *Best Fit:* A **Perceptual Theory of Emotion (with a Somatic Component)**. This aligns best with the user's intuitions while remaining philosophically robust.
      *   *Why Perception?* It explains the "fear of flying" case perfectly (visual perception of danger persists even if belief says safe). It explains the "anger at table" (perception of agency/obstruction even if belief says inanimate). It distinguishes startle (reflex) from fear (perception of threat).
      *   *Refining the Principle:* Emotions are *embodied perceptions of significance*.
      *   *Formula:* Emotion = Appraisal of Significance (Perceptual) + Phenomenological Feel (Somatic) + Intentional Object.

  4.  **Test the Principle against User's Verdicts:**
      *   *Turbulence Fear:* Perceptual theory saves this. You *perceive* threat despite *believing* safety. (Matches verdict).
      *   *Backfire Startle:* Reflex, no object of significance perceived, too short. (Matches verdict).
      *   *Music Tears:* Perception of sadness/beauty in the sound, no judgment required. (Matches verdict).
      *   *Empathy Embarrassment:* Perception of social threat to other. (Matches verdict).
      *   *Betrayal:* Judgment/Perception of wrong. (Matches verdict).
      *   *Anger at Table:* Perception of agency/obstruction. (Matches verdict).
      *   *Irritability (Mood):* Lacks specific object. (Matches verdict).

  5.  **Address the "Trade-off" Request:**
      *   To save the "Fear of Flying" and "Anger at Table" cases, we must abandon strict *Judgmentalism*.
      *   To save the "Startle" distinction, we must add a constraint on duration/cognitive integration (Startle is pre-emotional).
      *   *Hard Truth:* There is no principle that saves *every* intuition without controversy. The "Anger at Table" case is particularly tricky (some say it's quasi-emotion). I need to be honest that some philosophers *would* call the table anger a "frustration response" rather than full-blown anger, but I will prioritize the user's intuition there as it fits Perceptualism well.
      *   *Which to overturn?* If forced, the "Music" case is the hardest for some theories, but Perceptualism handles it. The "Startle" vs. "Fear" distinction is the most standard in literature. The "Mood" distinction is also standard. The "Recalcitrant Emotion" (flying) is the biggest wedge against Judgmentalism.
      *   *Decision:* I will propose a **Perceptual-Somatic Hybrid**. I will admit that strict Judgmentalism is widely considered insufficient for recalcitrant emotions.

  6.  **Address New Cases:**
      *   *Nostalgia:* Emotion? Yes. Object: Past self/time. Significance: Loss/Value.
      *   *Delusional Jealousy:* Emotion? Yes. Othello syndrome. Perception of threat exists even if false.
      *   *Horror Movie Chill:* Emotion? Yes (or "Quasi-emotion"). Perceptual theory handles this as perceiving fictional threat.

  7.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic, encouraging, precise, honest about uncertainty.
      *   *Structure:*
          1.  Acknowledge the difficulty (no consensus).
          2.  Propose the Principle (Perceptual + Somatic).
          3.  Classify the Principle.
          4.  Apply to User's Cases (Show how it works).
          5.  Apply to New Cases.
          6.  The Trade-off (What gets sacrificed).
          7.  State of the Field (Consensus vs. Contest).

  8.  **Refining the "State of the Field" (Crucial Step):**
      *   Must explicitly state: *There is no consensus.*
      *   Judgmentalism is a "live option" but has known problems (recalcitrant emotions).
      *   Perceptualism is currently very influential but contested.
      *   Feeling theories are often seen as incomplete (lack intentionality).
      *   Don't say "Philosophers agree X." Say "Many contemporary philosophers favor X, but Y argues Z."

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the Startle vs. Turbulence distinction?
      *   *Correction:* Need to emphasize *Intentionality* (aboutness) and *Duration/Integration*. Startle has no object (just noise), Turbulence has an object (crash/death).
      *   *Check:* Did I distinguish mood vs. emotion?
      *   *Correction:* Emphasize *Specific Object* vs. *General Background*.
      *   *Check:* Am I being too definitive?
      *   *Correction:* Use phrases like "On this view," "Proponents argue," "A significant challenge is."

  10. **Final Polish:** Ensure the distinction between *Judgment* (propositional, belief-like) and *Perception* (non-propositional, appearance-like) is clear, as this is the key to solving the flying puzzle.

  *(Self-Correction on the "Anger at Table" case)*: Some philosophers (like Nussbaum) might argue this *is* a judgment (a primitive one). But Perceptualism handles it better as a "perception of agency." I should note that some might classify this as "frustration" rather than "anger," but I will respect the user's intuition as valid data for the theory.

  *(Self-Correction on "Startle")*: The startle reflex is physiologically distinct (brainstem) from fear (amygdala/cortex). I should mention this scientific backing as it supports the philosophical distinction.

  *(Final Plan)*:
  1. Validate the struggle (it's a hard problem).
  2. State the consensus status (none).
  3. Propose the "Embodied Perceptual Principle."
  4. Walk through the cases.
  5. Predict new cases.
  6. Identify the trade-offs.
  7. Conclude with essay advice.

