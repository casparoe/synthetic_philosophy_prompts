          *   *Actually, let's use the "Diet" analogy.* It's universally understood. Optimizing weight $\rightarrow$ muscle loss. Adding "body fat %" $\rightarrow$ dehydration. Solution: "Fitness/Health" (Qualitative).
          *   *Wait, the "Map" implies navigation.* The counter is **"The Compass vs. The Incentive."**
