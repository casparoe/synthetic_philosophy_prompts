          *   Manager thinks metrics are a Map (Navigation).
          *   Reality is metrics are a Control Panel (Actuation).
          *   When you push a lever (optimize a metric), the engine responds. If you push too hard, it explodes. Adding more gauges doesn't stop you from pushing the lever too hard.

      *   *Let's go with the "Gardening" one for the human aspect, but the "Control System" for the mechanical aspect.*
      *   *Actually, the prompt asks for "better analogy for what actually happens when you put optimization pressure on a proxy."*
      *   *Answer:* **A Feedback Loop / Thermostat.**
      *   *Why:* A thermostat measures temp. If you hack the sensor (game the metric), the furnace turns off. Adding a second sensor (more metrics) helps, but if the incentive is "keep the sensor low," you'll hack both. The solution is to stop optimizing the sensor and start optimizing the room's comfort (qualitative).
      *   *Even Better:* **The "Teaching to the Test" Analogy.**
