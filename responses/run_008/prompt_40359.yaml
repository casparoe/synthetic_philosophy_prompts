answer: |-
  You have dug into one of the most technically demanding and philosophically rich corners of Indian thought, and your intuition about the regress problem is sharp enough to cut through a lot of standard textbook summaries. However, before we can weigh the success of the Nyāya solution, I need to stop you on one crucial historical detail because it changes the entire architecture of the argument you are evaluating. You have attributed the theory of svataḥ prāmāṇya, or intrinsic validity, to Nyāya, but that is actually the signature position of their rivals, the Mīmāṃsakas. Nyāya is the champion of parataḥ prāmāṇya, or extrinsic validity. The Mīmāṃsakas argue that a cognition is presumed true by its very nature and only proven false by later experience, exactly as you described in your prompt. Nyāya, conversely, argues that the validity of a cognition is not given in the cognition itself but must be established by external conditions, typically through successful action. This correction matters immensely because if Nyāya held the position you outlined, your objection that they are just deciding to stop asking would be devastating. But since Nyāya actually argues for extrinsic validation via successful activity, the question becomes whether that appeal to action successfully halts the regress or merely shifts it to a different domain. I am going to proceed with the correction in place because engaging with the actual Nyāya position makes for a stronger philosophical test case, and it aligns better with your suspicion that something pragmatic is being smuggled in.

  The Buddhist objection you cited is the classic infinite regress argument, or anavasthā. If every cognition requires a second cognition to certify it as knowledge, then that second cognition requires a third, and so on ad infinitum, meaning knowledge is never actually established. The Mīmāṃsaka solution is to say the first cognition is self-luminous regarding its truth, stopping the regress at step one. Nyāya rejects this because we frequently have cognitions that feel true but are false, like the rope-snake illusion, so truth cannot be intrinsic to the experience itself. Instead, Nyāya argues that we know a cognition is valid only when the activity prompted by that cognition leads to a successful result. If I see water and walk to it and drink, the successful drinking confirms the validity of the initial visual cognition. Your worry is that this just pushes the regress back one step: what certifies the success of the drinking? If I need a cognition to know I successfully drank, don't I need another to validate that cognition? This is where the comparison to modern epistemology becomes indispensable, specifically Roderick Chisholm's formulation of the Problem of the Criterion.

  Chisholm describes a standoff between the skeptic and the epistemologist where the skeptic asks how we can know anything without a criterion to distinguish truth from falsehood, but we cannot know the criterion is correct without already knowing some truths to test it against. This is structurally identical to the Nyāya-Buddhist debate. The Buddhist demands a criterion (a validating cognition) for every instance of knowledge. Nyāya responds with a form of particularism grounded in externalism. They argue that we do not need a prior criterion to start; we start with particular instances of successful engagement with the world. The verification is not a second mental state introspecting the first; it is the causal efficacy of the first state in the physical world. When you reach out and grab the water, the tactile sensation and the quenching of thirst are not merely more cognitions requiring validation; they are the practical fulfillment of the intention generated by the visual cognition. Nyāya is effectively arguing that the regress only exists if you insist that validation must be a purely internal, cognitive relation. By moving the validation into the realm of successful action, pravṛtti-sāmarthya, they attempt to break the chain.

  So, is this a genuine solution or an elegant refusal to play? My verdict is that it is a genuine solution, but only if you accept that the purpose of epistemology is to explain how agents navigate reality rather than to secure Cartesian certainty. If you view the regress objection as a demand for internalist justification where every claim must be backed by another claim within the mind, then Nyāya is indeed refusing to play. They are essentially telling the skeptic that the demand itself is flawed because it disconnects knowledge from agency. However, calling it a refusal implies it is a dodge, whereas I think it is a substantive redefinition of what knowledge is. In modern terms, this is very close to process reliabilism. A belief is justified if it is produced by a reliable process. For Nyāya, the reliable process is one that leads to successful action. The regress stops because the reliability is not established by another belief but by the causal history of the belief producing results. You do not need a belief to validate that the water quenched your thirst; the physiological state is the validator.

  Your intuition that this feels like a decision to stop asking is correct in the sense that Nyāya posits a natural attitude of trust that is only overridden by specific defects. They argue that doubt is not the default state; certainty is. Doubt requires specific causes, such as conflicting evidence or memory of counterexamples. This aligns with the particularist side of Chisholm's problem. We know some things first, and we derive our criteria from those known things. Nyāya says we know we have reached the water first, and from that, we infer the validity of the vision that led us there. If the skeptic asks how you know you reached the water, Nyāya would say that at some point, the question becomes empty because the successful action is self-intimating in a practical sense, even if not in a metaphysical sense. There is a point where further questioning impedes function. This is not hiding the regress; it is identifying the regress as a artifact of over-intellectualizing the relationship between mind and world.

  However, I must admit there is a vulnerability here that keeps the debate alive centuries later. If the successful action is itself known through a cognition, and all cognitions are fallible, the skeptic can still ask how we know the success was real and not a dream or a hallucination. Nyāya has responses to this involving the coherence of multiple senses and the consistency of future actions, but ultimately, they rest on a realist metaphysics that the Buddhist idealist or skeptic does not share. If you do not grant that there is a real world to successfully interact with, the pragmatic stopgap fails. So, whether this is a solution depends on whether you think epistemology can assume realism. Nyāya assumes realism. If you are working within that framework, the regress is dissolved. If you are working within a framework that demands justification independent of ontological commitments, then Nyāya is begging the question.

  Given that most human inquiry operates within a realist framework where successful action is the ultimate test of truth, I defend the Nyāya position as the more robust solution. It treats knowledge as a tool for living rather than a mirror of nature that must be polished by infinite reflection. The Buddhist regress objection is powerful only if we accept that knowledge must be self-contained within the mental sphere. Nyāya breaks the sphere open. By tying validity to extrinsic success, they anchor knowledge in something that is not just another cognition. This does not satisfy the radical skeptic who wants to doubt the success itself, but it satisfies the need for a working epistemology. Therefore, it is not a refusal to play but a change of game. The skeptic wants to play a game of infinite justification; Nyāya proposes a game of successful navigation. Since we must navigate whether we play the justification game or not, Nyāya wins on pragmatic grounds.

  There is one nuance I should mention regarding your framing of doubt. You noted that Nyāya insists doubt needs a ground, which is accurate. This supports the particularist reading. We do not start from universal doubt; we start from belief and introduce doubt only when there is a specific reason. This reverses the Cartesian method. Descartes says doubt everything until you find certainty. Nyāya says trust everything until you find defeat. This is why the regress does not get off the ground for Nyāya. The regress assumes we need to validate every step before taking it. Nyāya says we take the step, and the landing validates the step. If you fall, you know the step was bad. If you land, you know it was good. The validation is in the landing, not in a prior calculation of the jump.

  In conclusion, your suspicion that the standard reading might be hiding the regress was astute, but it was aimed at the Mīmāṃsā position rather than Nyāya. Nyāya does not claim truth is intrinsic; they claim validity is extrinsic and known through action. This avoids the regress not by asserting self-evidence but by asserting that the chain of justification ends in practical efficacy. Compared to Chisholm's Problem of the Criterion, Nyāya is a particularist externalist. They say we know instances of success first and generalize from there. Is this a genuine solution? Yes, because it addresses the function of knowledge in a way that internalist justification cannot. It refuses the skeptic's demand for internal certainty, but it does so by offering a superior account of how knowledge actually works for embodied agents. The only place I am unsure is whether this fully satisfies the metaphysical worry about hallucination, but that worry assumes a disconnection between mind and world that Nyāya simply rejects. If you accept their realism, the regress is dead. If you do not, no epistemology survives. So Nyāya is as good as it gets.
