ming of the svataḥ/parataḥ split is off, or that I've mashed together positions that different schools held differently, say that plainly up front instead of writing around it. Please write it as continuous prose, no headings or bullet points or bold — like a long email, not a report. A typo or two snuck in here because i typed this fast, but please don't imitate that part.
