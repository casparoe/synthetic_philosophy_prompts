answer: |-
  **JOINT STATEMENT ON THE SEPARATENESS OF PERSONS OBJECTION**

  **Date:** October 26, 2023
  **Signatories:** [Name A] (Utilitarian Signatory) and [Name B] (Contractualist Signatory)
  **Subject:** Clarification of Disagreement Regarding Aggregation and Individual Inviolability

  ### I. AGREED CLAIMS AND DEFINITIONAL GROUND

  We, the undersigned, acknowledge that our previous oral exchange suffered from equivocation regarding the scope of the "separateness of persons" objection. To prevent further dialogue of the deaf, we affirm the following propositions as the baseline for continued inquiry:

  1.  **The Triviality of Numerical Distinctness:** We agree that the mere assertion that persons are numerically distinct entities is insufficient to refute utilitarianism. The utilitarian accepts this fact but denies its moral relevance for aggregation. Therefore, the objection must establish *why* numerical distinctness constrains aggregation, not merely *that* it exists.
  2.  **The Harsanyi Distinction:** We distinguish between two arguments associated with Harsanyi:
      *   *The Aggregation Theorem:* A mathematical result showing that if social preferences satisfy certain axioms (Pareto, Independence, etc.), they must be represented as a sum of individual utilities.
      *   *The Impartial Observer:* A thought experiment where a rational agent behind a veil of ignorance chooses social principles to maximize expected utility.
      *   *Agreement:* Signatory B accepts the mathematics of the Aggregation Theorem but denies its normative force (it dictates how to aggregate *if* one aggregates, not *whether* one should). Signatory A accepts the Impartial Observer as a valid model of impartiality; Signatory B rejects it as conflating a single rational chooser with a plurality of distinct persons.
  3.  **Rawls vs. Scanlon:** We acknowledge we have conflated two distinct lines of criticism:
      *   *The Rawlsian Strain:* Focuses on stability and the "strains of commitment." A principle is unjust if individuals, knowing they might be the sacrificed party, could not reasonably be expected to uphold it over a lifetime.
      *   *The Scanlonian Strain:* Focuses on justifiability. An act is wrong if it violates a principle that no one could reasonably reject, specifically grounded in the personal complaints of those burdened.
      *   *Agreement:* We must specify which strain is being deployed in specific arguments. The Utilitarian Signatory owes an answer to the Rawlsian strain regarding stability, and to the Scanlonian strain regarding the weight of individual complaints.
  4.  **The Verbal Suspicion:** We agree that the phrase "taking separateness seriously" risks being a placeholder for a refusal to specify a constraint. To be substantive, the Contractualist Signatory must articulate a decision procedure or constraint that yields different results than utilitarianism in non-trivial cases, rather than merely asserting a metaphysical difference.

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates our remaining substantive divergences. Each statement is phrased to be acceptable to the holder of the view as a accurate description of their position.

  | Topic | Utilitarian Signatory (Position A) | Contractualist Signatory (Position B) |
  | :--- | :--- | :--- |
  | **1. The Basis of Aggregation** | Aggregation is justified by the rationality of preference satisfaction. If it is rational for an individual to trade off a pain now for a gain later, it is rational for a society to trade off a pain for one person for a gain for another, provided the net welfare increases. | Aggregation across persons requires a justification distinct from aggregation within a person. The unity of consciousness within a life provides a structure for compensation that is absent between distinct lives. |
  | **2. The Veil of Ignorance** | The veil of ignorance successfully models impartiality. A chooser who might be anyone is forced to attend to everyone's interests. The fact that the chooser is a single entity is a feature, not a bug; it models the standpoint of justice. | The veil of ignorance models a single agent managing risk, not a society resolving conflicting claims. It transforms distinct persons into probabilistic outcomes for one person, thereby begging the question against the separateness objection. |
  | **3. Personal Identity (Parfit)** | If personal identity is not a "deep further fact" (Parfit), the boundary between persons is less morally significant than the boundary between moments of experience. This supports aggregation across persons. | Even if identity is reduced (Parfit), the structural difference between *one* stream of consciousness experiencing trade-offs and *many* streams remains. Reductionism lowers the stakes of the objection but does not erase the structural disanalogy. |
  | **4. The Headache Case** | In a choice between one certain headache (Person A) and a distributed risk of headaches (Persons 1–N) with equal expected disutility, rational agents should be indifferent or prefer the risk distribution to avoid certain concentrated loss. | While the risk distribution may be permissible, it is not because the small risks *sum* to outweigh the certain pain. It is permissible because no single individual has a complaint strong enough to veto the risk, whereas Person A has a decisive complaint against certain sacrifice. |

  ### III. ISOLATION OF CRUXES AND PREDICTIONS

  We identify two specific cruxes where our disagreement is fundamental. For each, we specify the argument bearing on it and record our predictions for how the other interprets the "Headache Case" (One certain headache vs. N distributed risks of 1/N probability).

  **Crux 1: The Asymmetry of Aggregation**
  *   **The Question:** Is there a principled moral asymmetry between aggregating benefits/burdens across time within a single life and aggregating them across persons at a single time?
  *   **Utilitarian Claim:** No. The "boundary of the skin" is no more morally significant than the "boundary of the hour." Compensation is a matter of net welfare, not metaphysical unity.
  *   **Contractualist Claim:** Yes. Intra-personal trade-offs involve a single subject who experiences the compensation. Inter-personal trade-offs involve distinct subjects where the loser does not experience the gainer's benefit.
  *   **Predictions on the Headache Case:**
      *   *Utilitarian Prediction:* Signatory B will eventually concede that if the expected disutility is identical, the distribution of risk is morally equivalent to the certain loss, or that preferring the certain loss is irrational risk-aversion.
      *   *Contractualist Prediction:* Signatory A will fail to provide a justification for imposing the certain headache on Person A that does not rely on treating Person A as a vessel for the greater good, violating the requirement of justifiability *to* Person A.

  **Crux 2: The Implication of the Objection**
  *   **The Question:** If the separateness objection holds, what decision procedure replaces utilitarian aggregation?
  *   **Utilitarian Claim:** The objection leads either to absurdity (no trade-offs ever permitted) or collapses into a prioritarian view that still aggregates. If it does not forbid aggregation entirely, it is merely a tweak to the weighting function, not a structural constraint.
  *   **Contractualist Claim:** The objection supports a constraint based on *reasonable rejection*. It does not forbid all trade-offs, but it forbids trade-offs where the burden on the few is so severe that it cannot be justified to them, even if the total benefit is high. This may look like a Maximin floor in extreme cases, but is generally a requirement of pairwise justifiability.
  *   **Predictions on the Headache Case:**
      *   *Utilitarian Prediction:* Signatory B cannot distinguish the Headache Case from a standard utilitarian calculation without invoking an arbitrary "veto" power that leads to paralysis in larger stakes cases (e.g., preventing a catastrophe).
      *   *Contractualist Prediction:* Signatory A cannot explain why it is permissible to sacrifice Person A without admitting that the "separateness" of Person A is being overridden by the sum of others' interests, which is precisely what the objection forbids.

  ### IV. HOUSEKEEPING: VERBAL DISPUTES AND CONDITIONS FOR MOVEMENT

  **1. Verbal Disputes Identified**
  We acknowledge that a portion of our five-hour argument was verbal rather than substantive:
  *   **"Taking Separateness Seriously":** Signatory A interprets this as a refusal to specify a constraint. Signatory B intends it as a demand for a specific type of justification (agent-relative vs. agent-neutral). We agree to stop using the phrase unless accompanied by the specific constraint (e.g., "reasonable rejection").
  *   **"Changing the Subject":** Signatory A feels B changes the subject from *outcome evaluation* to *procedure*. Signatory B feels A changes the subject from *justice between persons* to *rational choice under uncertainty*. We agree these are distinct questions, and our dispute lies in whether the former reduces to the latter.

  **2. Conditions for Persuasion**
  To ensure future efforts are not wasted, we specify what would genuinely move each of us:
  *   **To Move the Contractualist Signatory:** Signatory A must provide an argument for inter-personal aggregation that does not rely on the Impartial Observer model (which B rejects as question-begging) and does not rely solely on the intra-personal analogy (which B rejects as disanalogous). Specifically, A must explain how a loss to Person X is *compensated* by a gain to Person Y in a way that satisfies the requirement of justifiability to Person X.
  *   **To Move the Utilitarian Signatory:** Signatory B must demonstrate a case where the "separateness" constraint yields a verdict that is not only different from utilitarianism but *more stable* or *more justifiable* in a way that A cannot accommodate via risk-aversion or diminishing marginal utility. Mere intuition that aggregation is "wrong" is insufficient; B must show a breakdown in the coherence of the utilitarian view that cannot be repaired by refining the utility function.

  **Signed,**

  _________________________ (Utilitarian Signatory)

  _________________________ (Contractualist Signatory)
