          5.  Paraconsistency (4) - Niche.

  6.  **Drafting the Criterion-by-Criterion Case:**

      *   *Damage Reduction vs. Probability Reduction:*
          *   Formalization: Reduces Damage (localization).
          *   Ordinal: Reduces Probability (by proving Con).
