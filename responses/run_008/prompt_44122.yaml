      *   Budget check: $3M/year for 8-10 researchers is ~$300k-$375k per researcher/year. This is very generous (covers salary, overhead, grad students, workshops). This allows for high-risk/high-reward.

  10. **Final Review against Constraints:**

      *   Did I order them? Yes.
