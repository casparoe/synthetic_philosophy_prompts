      *   Did I give concrete 4-year milestones? Yes.
      *   Is the reasoning connected to the decision? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I endorse the inconsistency hypothesis. I must maintain the stance of "Given the Board's credence..."
