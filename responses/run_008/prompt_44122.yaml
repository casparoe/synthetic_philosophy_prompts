      *   *2. Ordinal Analysis:* Trying to prove consistency of strong theories in weak ones. This is "prevention" or "verification." Historically very hard (stalled since 90s). High risk of failure.
      *   *3. Formalization at Scale:* Machine checking. "Insurance." If a contradiction exists, formalization helps find it or isolate it. Also useful regardless of inconsistency (general good for math).
      *   *4. Inconsistency-Tolerant Foundations:* Paraconsistent logic. Changing the rules so contradiction doesn't explode. Radical. Changes the meaning of "proof."
      *   *5. Epistemology:* Philosophy. Understanding *why* we believe. Low direct utility for saving math, high utility for calibration.

  4.  **Critiquing and Restructuring the List:**

      *   *Merge/Split:*
