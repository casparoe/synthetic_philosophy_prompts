      *   *Fix:* Frame the redesign as *fulfilling* their goal of "honest accounting" more accurately than a leaderboard would. A leaderboard is actually *dishonest* because it simplifies complex history.

  5.  **Final Polish:** Check against all constraints in the prompt.
