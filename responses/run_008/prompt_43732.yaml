answer: |-
  An adequate theory of sphexishness must meet these criteria:

  1.  **[Non-negotiable]** It must classify the wasp as sphexish because it loops infinitely on nudged prey.
  2.  **[Non-negotiable]** It must classify the coffee-making human as non-sphexish because they adjust when milk sours.
  3.  **[Non-negotiable]** It must allow the chess engine to transition from sphexish to non-sphexish within a single game.
  4.  **[Non-negotiable]** It must judge the cleaning robot on whether it detects the furniture shift, not just its failure.
  5.  **[Non-negotiable]** It must classify the rehearsing student as sphexish during the interruption because they cannot improvise.
  6.  **[Non-negotiable]** It must distinguish inability to adapt from simple unwillingness to expend energy.
  7.  **[Non-negotiable]** It must separate sensory blindness from rigid policy execution.
  8.  **[Non-negotiable]** It cannot contradict data showing insects successfully re-route around barriers.
  9.  **[Prejudice]** The account should remain neutral on metaphysical free will.
  10. **[Non-negotiable]** Flexibility must be gradable across species and contexts.
  11. **[Prejudice]** There must be a sharp cut-off separating moral agents from automatons.

  **Incompatible Pair:** Desiderata 10 and 11 are in tension; a continuum resists a sharp boundary.

  **Internal-Model:** This approach handles the sensor/policy distinction well by claiming the wasp lacks a world-state representation. However, it struggles with the stressed human who has a model but cannot access it, revealing the list's thinness on temporary cognitive access failures. It scores well on the chess engine if learning updates the model.

  **Hierarchical-Control:** This explains the student's freeze as a high-level override failure, fitting the stress case nicely. However, it risks labeling any successful routine as sphexish unless the override is actively monitoring, exposing the list's lack of clarity on routine autonomy. It handles the coffee case well if the override is dormant but available.

  Both theories expose that the list lacks criteria for *latency* of adaptation. The list demands correct classification but does not specify how quickly a system must respond to avoid the sphexish label. This timing gap is where the theories will need to do the heavy lifting.
