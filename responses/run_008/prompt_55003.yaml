      *   Dan fights on Consequentialism/Deontology (is there a *victim*?).
      *   They talk past each other. Maya shifts to Consequentialism (Step 5) and loses.
      *   The core issue: **Habituation vs. Harm.** Maya's initial point stands regardless of the NPC's status. Dan never actually refutes the idea that *enjoying* simulated torture habituates the brain towards callousness. He only refutes the idea that the NPC is harmed.

