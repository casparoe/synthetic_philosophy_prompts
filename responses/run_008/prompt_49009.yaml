answer: |-
  **Credence: 70%**

  Here is the decomposition of that number, the sensitivity analysis, and the meta-commentary on whether the question itself is well-posed.

  ### The Decomposition

  I am treating this as a Bayesian update on a baseline of agnosticism (50%), weighted by four specific factors you requested.

  **1. PBR Assumptions (Specifically Preparation Independence): 80% Probability they hold.**
  *   **Justification:** The Pusey-Barrett-Rudolph (PBR) theorem is the strongest formal argument for psi-ontology. It proves that if distinct quantum states correspond to overlapping distributions of underlying physical states (psi-epistemic), and if systems can be prepared independently (Preparation Independence), you get predictions that contradict QM.
  *   **The Risk:** The only escape valve is "Preparation Independence." This assumes that when I prepare two electrons in separate labs, their underlying physical states ($\lambda_1, \lambda_2$) are uncorrelated. A psi-epistemic defender must argue for a holistic constraint on the universe where separate preparations are secretly correlated (a form of superdeterminism or global holism). While possible, it requires a "conspiracy" in the initial conditions of the universe that feels physically unmotivated compared to simply accepting the wavefunction is real.
  *   **Weight:** This is the strongest lever. If this holds, standard psi-epistemic models are dead.

  **2. The Interference/Amplitude Argument: 90% Probability amplitudes are structural, not just probabilistic.**
  *   **Justification:** In classical statistical mechanics, probabilities are positive real numbers that add. In QM, complex amplitudes add and *interfere*. You cannot reproduce interference patterns with a probability distribution over hidden variables unless those variables carry phase information effectively isomorphic to the wavefunction itself.
  *   **Weight:** This suggests that even if there is a "deeper" layer, it must carry the same informational load as the wavefunction. This pushes "derivable" views into the psi-ontic bucket (see point 4).

  **3. Completeness vs. Hidden Structure: 60% Probability QM is complete (in the relevant sense).**
  *   **Justification:** Bell's Theorem and experimental violations rule out *local* hidden variables. Non-local hidden variables (Bohmian mechanics) are possible, but in Bohmian mechanics, the wavefunction is still a real physical field (the "pilot wave") guiding the particles. So, even if QM is "incomplete" because there are also particles, the $\psi$ remains ontic. The only way $\psi$ becomes epistemic here is if there is a deeper theory where $\psi$ emerges statistically (like thermodynamics). Given the lack of empirical traction for such a theory after 100 years, I discount this slightly, but keep it non-zero.
  *   **Weight:** Moderate. Even if incomplete, $\psi$ often remains ontic in the candidate theories.

  **4. Definition of "Ontic" (Fundamental vs. Derivable): 100% Inclusion.**
  *   **Justification:** You asked if "real but derivable from something deeper" counts. For the purpose of the "real vs. knowledge" dichotomy, yes. If the wavefunction is derivable from a deeper physical structure (like a field configuration in QFT or a string state), it corresponds to something in the world, not an observer's ignorance. Ignance implies multiple possibilities where only one is true; derivability implies the state is fixed by the physics.
  *   **Weight:** This prevents moving the goalposts. If $\psi$ is like temperature (statistical), it's epistemic. If $\psi$ is like the electromagnetic field (fundamental or effective field), it's ontic. I assess it as field-like.

  **Calculation:**
  Starting at 50% (agnostic).
  +20% for PBR holding (strong no-go against epistemic).
  +10% for Interference structure (hard to model epistemically).
  +10% for Hidden Variable theories usually keeping $\psi$ ontic anyway (Bohm).
  -10% for the possibility that the "Universal State" is the only ontic candidate, making subsystem $\psi$ epistemic (see Meta-Commentary).
  -10% for the viability of radical anti-realist views (QBism) that reject the PBR framework entirely.
  **= 70%**

  ---

  ### Sensitivity Analysis

  **The Single Most Sensitive Term: Preparation Independence.**

  If Preparation Independence fails in a *principled* way (not just a conspiratorial loophole, but a fundamental feature of quantum holism), my credence drops from **70% to roughly 45%**.

  *   **Why:** If the state of a system cannot be defined independently of how it was prepared relative to the rest of the universe, the distinction between "state of the system" and "information about the system's context" blurs. This opens the door for relational or epistemic views where $\psi$ encodes the relationship between the system and the preparation context, rather than an intrinsic property.
  *   **Magnitude:** This is the only assumption in PBR that isn't a mathematical identity. It is a physical postulate. If nature is fundamentally non-separable (more so than just entanglement implies), the ontic conclusion loses its strongest theorematic support.

  ---

  ### Meta-Commentary: Is the Carve-Up Confused?

  You asked for honesty on whether the psi-ontic/epistemic binary is confused. **Yes, it is, at the level of subsystems.**

  **1. Universal vs. Effective State**
  The question "Is the wavefunction real?" is ambiguous.
  *   **Subsystem States:** The wavefunction of an electron in a lab is almost certainly *not* ontic in a fundamental sense. It is a reduced density matrix derived from tracing out the environment. It is effectively epistemic (or "perspectival") because it represents the state of a part relative to the whole.
  *   **Universal State:** The only candidate for a truly psi-ontic object is the Wavefunction of the Universe (Everettian).
  *   **The Confusion:** Many debates conflate these. If you are a psi-ontologist, you are usually committed to the reality of the *Universal* Wavefunction. If you are a psi-epistemicist, you often treat the *subsystem* wavefunction as knowledge.
  *   **My Adjustment:** My 70% credence applies specifically to the **Universal State** (or the fundamental quantum field state). For subsystem states, my credence that they are "just bookkeeping" is >90%.

  **2. "Knowledge" Without a Knower**
  The psi-epistemic view leans on the analogy of classical probability. But in classical stat-mech, probability represents an agent's ignorance of a definite microstate. In a closed quantum universe (cosmology), there is no external agent.
  *   If there is no external observer, "knowledge" has no referent.
  *   Therefore, a purely psi-epistemic view of the *universal* state requires a metaphysical account of who is doing the knowing (e.g., God, or a transcendental subject).
  *   This is why I lean ontic: It is easier to posit a real physical state that exists without a knower than to posit "knowledge" that exists without a knower.

  ---

  ### On Wigner's Friend and Observer-Independent Facts

  You mentioned finding Wigner's Friend setups compelling. Here is how that should weight your credence:

  **Do not let Wigner's Friend push you toward Psi-Epistemic too quickly.**

  Recent no-go theorems on "Observer-Independent Facts" (e.g., Bong et al., 2020) show you cannot have Local Friendliness + Absoluteness of Observed Events.
  *   **The Epistemic Take:** "Facts are relative to observers; therefore, the state is just information for that observer." (QBism/Relational QM).
  *   **The Ontic Take:** "All outcomes occur; the state is real and branches." (Many Worlds).

  **Crucial Distinction:** Many Worlds is **Psi-Ontic**. It treats the wavefunction as the fundamental reality. It solves Wigner's Friend by saying both Wigner and the Friend are in a superposition relative to the outside, but there is no single "fact" until decoherence separates the branches.

  If you find Wigner's Friend compelling because it suggests "facts are relative," you have two main options:
  1.  **QBism (Psi-Epistemic):** The state is my personal belief. (Credence impact: Lowers ontic probability).
  2.  **Everett (Psi-Ontic):** The state is real, but "facts" are indexical to branches. (Credence impact: Keeps ontic probability high).

  **My Advice:** If you like the "relativity of facts" intuition, do not assume that forces you into psi-epistemicism. Relational Quantum Mechanics (Rovelli) and Many Worlds both accommodate relative facts while treating the quantum state as a description of reality (ontic), just not an absolute one in the classical sense.

  **Summary:** The Wigner's Friend results rule out *classical-style* objective facts, but they do not rule out an *ontic wavefunction*. They only rule out an ontic wavefunction *plus* single-outcome realism. Since psi-ontology does not require single-outcome realism (see: Everett), your intuition here shouldn't lower my 70% number significantly, provided you are willing to accept branching or relational ontology.

  **Final Verdict:** The wavefunction (of the universe) is real. The wavefunction (of a particle) is a useful slice of that reality. The "bookkeeping" view is too fragile to survive the PBR theorem without accepting holistic conspiracies or abandoning the idea of a mind-independent universe.

  **70% Ontic.**
