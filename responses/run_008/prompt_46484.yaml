      *   *Claim 2 (Interests):* Controversial. Do posthumous interests exist? (Feinberg vs. Epicurus). If interests survive, harm is possible. *Vindication?* If interests survive, the cousin is wrong. The explorer had an interest in her reputation.
      *   *Claim 3 (Rights):* Legal vs. Moral. Legal rights usually end. Moral rights (reputation) might persist. *Vindication?* Legally, maybe. Morally, shaky.
      *   *Claim 4 (Narrative Identity):* We care about the *story* of a life. Falsifying it damages the integrity of the life lived. *Vindication?* Strong argument against the cousin.
      *   *Claim 5 (Harm to Living):* Shifts the target. Harms descendants, scholars, historical truth. *Vindication?* Doesn't support "nobody is harmed," just "the dead aren't." But still shows the act is harmful.

  4.  **Address the Asymmetry (Benefit vs. Harm):**
      *   The cousin likely accepts "posthumous benefit" (restoring legacy) but denies "posthumous harm." This is inconsistent. If you can help a reputation, you can hurt it. This is the "Symmetry Argument."

  5.  **Drafting the Response (Iterative Process):**

