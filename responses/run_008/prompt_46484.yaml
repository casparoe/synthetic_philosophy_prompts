      *   **The Task:** Separate out the different precise claims hiding in the slogan. Evaluate each for plausibility and whether it vindicates the cousin's show. Present it as a "menu" the user can bring back to the cousin.
      *   **Key Areas to Cover:** Experience, interests surviving death, standing to be wronged, impact on living (descendants/scholars), narrative identity.

  2.  **Deconstruct the Slogan ("The Dead Can't Be Harmed"):**
      *   *Claim 1: The Experiential Claim.* Harm requires feeling pain/suffering. Dead people don't feel.
      *   *Claim 2: The Interest-Based Claim.* Harm requires thwarting current interests. Dead people have no current interests.
      *   *Claim 3: The Moral Standing/Rights Claim.* Harm requires violating rights. Dead people have no rights.
      *   *Claim 4: The Identity/Narrative Claim.* Harm requires damaging a continuing self. The "self" ends at death.
      *   *Claim 5: The Third-Party/Relational Claim.* Harm is only to the living (family, society, truth).

  3.  **Evaluate Each Claim (Plausibility & Vindication):**

