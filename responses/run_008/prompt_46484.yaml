answer: |-
  You have spotted a genuine philosophical sleight of hand. Your cousin is using a metaphysical slogan ("the dead can't be harmed") to shut down an ethical debate about integrity, truth, and respect. The slogan sounds like a single fact, but it actually conflates at least five distinct claims. Some are trivially true, some are highly controversial, and some are mutually inconsistent with the way he talks about "legacy."

  Here is a menu of the specific claims hiding inside that slogan. You can use these to force him to pick which one he actually means, because most of them either don't vindicate his show or contradict his other beliefs about biopics.

  ### 1. The Experiential Claim (The Epicurean View)
  *   **The Claim:** Harm requires a subject to *experience* pain, suffering, or distress. Since the dead have no consciousness, they cannot experience anything, therefore they cannot be harmed.
  *   **Plausibility:** High, if you define "harm" strictly as "felt suffering."
  *   **Does it vindicate the show?** **No.**
      *   **Why:** This definition of harm is too narrow for almost any other context we care about. If I burn down your house while you are on vacation, you don't *experience* the loss until you return, but you were still harmed the moment the house burned. If I steal from your estate after you die, your heirs are harmed, but your *wishes* were also thwarted.
      *   **The Counter:** If harm requires experience, then *praise* also requires experience. So, when your cousin says a biopic can "honor" or "restore the legacy" of the dead (which he likely admits), he is contradicting himself. You can't honor someone who can't experience the honor. If the dead can be *benefited* by a positive portrayal, they can be *harmed* by a negative one, regardless of whether they feel it.

  ### 2. The Interest-Based Claim (The Feinberg View)
  *   **The Claim:** Harm requires the thwarting of a *current* interest. Dead people have no current desires or projects, so they have no interests to thwart.
  *   **Plausibility:** Controversial. Many philosophers (like Joel Feinberg) argue that interests *survive* death. You have an interest *now* in what happens to your children, your money, and your reputation *after* you die.
  *   **Does it vindicate the show?** **No. In fact, it condemns it.**
      *   **Why:** This Victorian explorer spent 20 years fighting the rumor of an affair. That means she had a massive, active, lifelong interest in her reputation remaining intact. That interest did not vanish the moment her heart stopped; it was a "ante-mortem" interest that extended into the future.
      *   **The Counter:** By inventing the affair, the show directly thwarts her specific, documented life-interest. If your cousin accepts that we should respect wills (which dictate property distribution after death), he accepts that interests survive death. Why does property count but reputation not?

  ### 3. The Moral Standing Claim (The Rights View)
  *   **The Claim:** Harm implies a violation of rights. Dead people are not legal persons and hold no rights. Therefore, no right can be violated.
  *   **Plausibility:** Legally true; morally dubious.
  *   **Does it vindicate the show?** **Only legally.**
      *   **Why:** Your cousin works in art, not a court of law. There is a difference between "I can't be sued for this" (libel laws usually expire at death) and "this is ethically permissible."
      *   **The Counter:** We routinely acknowledge moral duties to the dead that exceed legal requirements. We don't dig up graves for fun, even if it's legal. We don't burn diaries of the deceased, even if we own the paper. If there are *some* moral boundaries regarding the dead, why is "truthfulness" not one of them?

  ### 4. The Narrative Identity Claim (The Integrity View)
  *   **The Claim:** A human life is a completed narrative. Harm can be done to the *story* of the life, which is the only thing that remains.
  *   **Plausibility:** High, especially for biopics.
  *   **Does it vindicate the show?** **Absolutely not.**
      *   **Why:** This is the strongest argument *against* your cousin. A biopic claims to be about a *real person*. If it falsifies the core struggles of that person's life, it damages the integrity of the historical record.
      *   **The Counter:** This specific woman's life was defined by her fight against this specific rumor. To insert the rumor is not just "adding drama"; it is erasing the actual drama of her life (which was her fight for professional credibility). It turns her struggle into the very thing she fought against. It disrespects her agency as a historical actor.

  ### 5. The "Harm to the Living" Claim (The Relational View)
  *   **The Claim:** The dead can't be harmed, but the *living* can be harmed by how we treat the dead (descendants, scholars, the public).
  *   **Plausibility:** Very High.
  *   **Does it vindicate the show?** **No, it shifts the blame.**
      *   **Why:** This concedes the main point: that the action *is* harmful, it just changes the victim.
      *   **The Counter:** If your cousin uses this, he admits the show causes harm. He just argues the harm is to historians or descendants, not the woman. But if the harm is real, he has to justify why the entertainment value outweighs that harm. Also, for marginalized figures in history (like female explorers), the "living" who are harmed include other women in the field whose role models are being sexualized or diminished.

  ### The "Asymmetry Trap"
  This is your strongest lever. Your cousin likely believes that a biopic can **do justice** to a subject. He probably thinks a good biopic can **restore a reputation** or **honor a memory**.

  *   **The Trap:** If a film can *benefit* the dead (by honoring them), it can *harm* the dead (by dishonoring them).
  *   **The Logic:** You cannot have it both ways. If "the dead can't be harmed" is true, then "the dead can't be helped" is also true. If he claims his show "shines a light on her forgotten story" (a benefit), he has already conceded that posthumous interests exist. Once he concedes that, he loses the right to say the falsification doesn't matter.

  ### What Your Cousin Is Actually Doing
  When he says "the dead can't be harmed," he is likely not making a philosophical argument but issuing a **conversation stopper**. He is invoking a "liberty of the artist" defense disguised as a metaphysical fact. He wants the authority of truth (using a real name, real setting) without the responsibility of accuracy.

  ### How to Bring This Back to Him
  Don't try to win on metaphysics. Win on consistency.

  1.  **Ask him to pick a lane:** "Do you mean she doesn't *feel* it, or that she has no *interests* left?"
  2.  **Hit the Asymmetry:** "You say the dead can't be harmed. But do you think a movie can *honor* the dead? If a movie can restore a legacy, it can wreck one. Which is it?"
  3.  **Focus on the Specifics:** "This isn't just adding a lover. Her life's work was fighting this specific lie. By putting it in, you aren't just dramatizing her life; you're erasing the actual conflict of her life and replacing it with a cliché."

  He is hiding behind a slogan to avoid admitting that he traded a real woman's dignity for plot points. You don't need to prove the dead feel pain; you just need to prove that *truth matters* more than his slogan allows.
