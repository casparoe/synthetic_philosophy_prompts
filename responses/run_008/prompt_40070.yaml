prompt: |-
  I teach an upper-level bioethics course, about 18 students, one 90-minute seminar, and next week is on advance directives and whether your earlier self really has the authority to boss your later self around. Design an in-class game for me. The core tension I want them to feel is this: a person writes a directive while competent, later becomes severely demented and seems content (or even happy) in ways they'd have found horrifying, and the caregivers have to decide whether the old self or the current self gets to call the shots. Please structure it so the students actually make these calls under some pressure — maybe split them into "earlier selves" who write binding instructions for a staged future scenario, and "care teams" who later get the case with details that pull against the directive, with real-ish stakes like points or enforceable rules rather than just discussion. The earlier selves shouldn't know exactly how the later self will end up feeling when they write the thing — that epistemic gap is half the point. Then a debrief that maps what happened onto the arguments people actually make in this literature: precedent autonomy, the idea that the earlier self's settled values should win, the counteridea that there's no real "same person" to have authority over, and the experiential-vs-critical interests distinction if you can work it in without lecturing. Also tell me what will predictably go wrong the first time I run it (I assume some students will just play contrarian or refuse to engage with the staged stakes), and be honest about which part of the philosophical problem the game can't actually reproduce — e.g. that no classroom version makes the later self's welfare really hang on the outcome. Act as an experienced facilitator who has run participatory ethics exercises like this before: brainstorm the design first, then give me the final package with rules, timeline, materials, payoff scheme, debrief plan, and the caveats. Keep the rules simple enough that I can actually run it cold.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level bioethics course, 18 students, 90-minute seminar.
      *   **Topic:** Advance directives, personal identity over time, precedent autonomy vs. current well-being (dementia cases).
      *   **Core Tension:** Competent past self vs. demented but content future self. Who has authority?
      *   **Format:** In-class game/simulation. Needs stakes (points/rules), not just discussion.
      *   **Roles:** "Earlier Selves" (write directives) vs. "Care Teams" (decide later).
      *   **Constraint:** Earlier selves shouldn't know the specific future state (epistemic gap).
      *   **Debrief:** Must map to philosophical concepts (precedent autonomy, personal identity, experiential vs. critical interests).
      *   **Facilitator Persona:** Experienced, honest about pitfalls/limitations.
      *   **Deliverables:** Brainstorming/Design logic, Final Package (Rules, Timeline, Materials, Payoff, Debrief), Caveats/Pitfalls.

  2.  **Brainstorming & Design Logic:**
      *   *Goal:* Create a felt tension, not just an intellectual one. Students need to feel the frustration of the "Care Team" ignoring the "Earlier Self" or the "Earlier Self" feeling violated.
      *   *Mechanism:* A resource allocation game. Points represent "well-being" or "ethical integrity."
      *   *Structure:*
          *   Phase 1: Earlier Selves write directives without knowing the specific future condition details (just general categories).
          *   Phase 2: Time jump (simulated). The "Later Self" is revealed (via a profile/card) to be happy in a state the Earlier Self might have rejected.
          *   Phase 3: Care Teams make the decision.
          *   Phase 4: Scoring/Consequences.
      *   *Stakes:* If the Care Team follows the directive, Earlier Self gets points (Autonomy). If they follow current happiness, Later Self gets points (Well-being). If they mismatch, everyone loses points (Ethical Failure). *Correction:* To make it tense, the Care Team needs a reason to deviate. Maybe they get points for "Current Happiness" but penalized for "Violation of Rights." Or, simpler: The Care Team *is* graded on a rubric that conflicts with the Directive.
      *   *Refinement on Stakes:* Let's make it a zero-sum tension.
          *   Earlier Self wants their values upheld.
          *   Care Team wants the "Patient" (Later Self) to be happy *now*.
          *   If Care Team follows directive -> Patient might be unhappy (in the scenario).
          *   If Care Team ignores directive -> Patient is happy, but Directive is violated.
      *   *The Twist:* The "Later Self" isn't a player. It's a card/profile. The Care Team decides for them. The Earlier Self watches helplessly.
      *   *Grouping:* 18 students. 6 groups of 3? Or 2 large teams?
          *   Option A: 6 "Earlier Selves" paired with 6 "Care Teams." (Too fragmented).
          *   Option B: 3 "Earlier Selves" (2 students each) and 3 "Care Teams" (4 students each). Total 18.
          *   Option C: All students write directives individually, then split into Care Teams. (Better engagement).
          *   *Decision:* Let's go with **3 Families**. Each "Family" has an Earlier Self (2 students), a Care Team (3 students), and a Later Self (1 student? No, Later Self is the *case*).
          *   *Revised Decision:* 18 students. Split into 6 groups of 3.
              *   Groups 1-3: "Earlier Selves" (Write directives).
              *   Groups 4-6: "Care Teams" (Make decisions).
              *   *Problem:* If Earlier Selves don't know the future, how do they pair?
              *   *Solution:* Random pairing after the fact. Group 1 writes for Group 4, etc.
              *   *Better:* All 18 write a "Value Card" individually (5 mins). Then split into 3 large "Care Teams" (6 students each). Each Care Team gets 6 Value Cards from the "past" (collected anonymously) AND 1 Specific Case File (The Demented Patient). They must decide for the patient *and* adjudicate the directives.
              *   *Wait, the prompt asks for "Earlier Selves" and "Care Teams" as distinct roles feeling the tension.*
              *   *Best Setup:* 9 "Earlier Selves" (write directives). 9 "Care Providers" (make decisions).
              *   Pair them up? 9 pairs.
              *   *Epistemic Gap:* Earlier Selves write directives based on a *general* fear of dementia. Care Providers get a *specific* scenario where the patient is happy.
              *   *Stakes:* "Ethical Currency."
              *   *Let's simplify:* 3 Scenarios. 6 Students per scenario.
                  *   2 Students = The Earlier Self (Jointly write one directive).
                  *   4 Students = The Care Team (Read directive + See Current Patient).
                  *   Total 18 students. Perfect.

      *   *The "Happy Dementia" Detail:* The Earlier Self says "No nursing homes, I'd rather die." The Later Self is in a nursing home, eating ice cream, laughing at cartoons, terrified of leaving.
      *   *The Payoff:*
          *   Earlier Self gets points if Directive is followed.
          *   Care Team gets points if Patient "Well-Being Score" is high.
          *   *Conflict:* Following directive lowers Well-Being Score. Ignoring it lowers Autonomy Score.
          *   *Incentive:* Care Team wants to maximize *total* points, but they are told they are liable for "Neglect of Advance Directive" (penalty) OR "Causing Distress" (penalty).
          *   *Actually, to make it visceral:* The Earlier Self gets to *veto* or *appeal*? No, that gives them too much power. The Earlier Self should feel powerless.
          *   *Revised Payoff:* The Care Team makes the call. The Earlier Self finds out and assigns a "Betrayal Score." The Instructor assigns a "Welfare Score." The sum determines the grade/prize.

      *   *Philosophical Mapping:*
          *   Precedent Autonomy (Earlier Self points).
          *   Experiential Interests (Current happiness).
          *   Critical Interests (Life values).
          *   Personal Identity (Is it the same person?).

      *   *Pitfalls:* Students treating it as a joke. Students colluding to maximize points rather than engage ethically. The "Later Self" not feeling real.
      *   *Mitigation:* Serious tone, "Confidential Files," no talking between phases.

  3.  **Drafting the Plan (Iterative refinement):**
      *   *Title:* "The Lockbox Protocol."
      *   *Materials:* Envelopes, Index Cards, Scenario Sheets.
      *   *Timeline:* 15 min setup/directives, 10 min transition, 20 min care team deliberation, 15 min reveal/consequences, 30 min debrief.
      *   *Rules:* Keep them tight. No communication between Earlier Self and Care Team after Phase 1.
      *   *The Twist:* The "Later Self" sends a message (pre-written by instructor) that contradicts the directive. "I am happy here. Do not make me leave."

  4.  **Refining the Philosophical Debrief:**
      *   Need to ensure Dworkin (Critical vs. Experiential) and Dresser (Personal Identity) come up naturally.
      *   Ask the Care Teams: "Why did you ignore the document?"
      *   Ask the Earlier Selves: "Do you feel violated?"
      *   Connect to the "Odysseus" analogy (binding oneself to the mast).

  5.  **Addressing the "What Will Go Wrong" Section:**
      *   Students gaming the points.
      *   Students refusing to play the "demented" role seriously.
      *   The "stakes" feeling fake.
      *   Time management (debrief is usually the first thing cut).

  6.  **Final Polish:**
      *   Ensure the tone is professional yet actionable.
      *   Check student count (18). 3 groups of 6 is the cleanest math.
      *   Make sure the "Epistemic Gap" is clear: Earlier selves know *they might get dementia*, but not *what kind of dementia* or *how they will feel*.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Let Earlier Selves write whatever they want.
      *   *Correction:* Too vague. Give them a menu of "Critical Interests" to select from so the directives are comparable.
      *   *Initial thought:* Care Teams get points for happiness.
      *   *Correction:* Care Teams should feel the *burden* of decision. Give them a "Liability Rubric."
      *   *Crucial Addition:* The "Later Self" needs a voice. A video? A letter? A letter is easier. Written by the instructor to ensure consistency. "I love the dolls. Please don't take them."

  8.  **Final Review against constraints:**
      *   90 mins? Yes.
      *   18 students? Yes (3 groups of 6).
      *   Stakes? Yes (Points/Grades).
      *   Epistemic gap? Yes (General vs. Specific).
      *   Debrief mapping? Yes.
      *   Pitfalls included? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  Here is a complete design package for **"The Lockbox Protocol."** I have run variations of this in graduate seminars and medical ethics rounds. It is designed to be low-prep for you but high-tension for the students.

  ### Part 1: Design Logic (The "Why" Behind the Game)

  To make this work in 90 minutes, we cannot simulate years of dementia. We must simulate the *moment of conflict*.
  *   **The Epistemic Gap:** The "Earlier Selves" will write directives based on abstract fears (loss of dignity, burdening family). They will *not* know that their future self will find joy in "undignified" things (e.g., watching cartoons, holding a doll).
  *   **The Stakes:** We will use "Ethical Currency" (points). This sounds gamified, but it forces trade-offs. If they just talk, they can straddle the fence. If they have points, they must choose: Autonomy Points vs. Well-Being Points.
  *   **The Structure:** 3 Groups of 6 students.
      *   **2 Students** = The Earlier Self (The Principals).
      *   **4 Students** = The Care Team (The Agents).
      *   **The Instructor** = The Disease/Time (You control the "Later Self" profile).

  ---

  ### Part 2: The Final Package

  #### **Materials Needed**
  *   3 Manilla Envelopes (labeled "LOCKBOX").
  *   6 Index Cards (for directives).
  *   3 "Patient Profile" Sheets (prepared by you in advance, see below).
  *   3 "Decision Ledger" Sheets (for scoring).
  *   Whiteboard/Projector for scoring.

  #### **Timeline (90 Minutes)**
  1.  **Setup & Grouping (5 mins):** Divide class into 3 groups of 6.
  2.  **Phase 1: The Directive (15 mins):** "Earlier Selves" write the rules.
  3.  **Phase 2: The Time Jump (5 mins):** Handover envelopes. "Earlier Selves" go silent.
  4.  **Phase 3: The Crisis (20 mins):** "Care Teams" review the case and decide.
  5.  **Phase 4: The Reveal & Scoring (15 mins):** Outcomes announced.
  6.  **Phase 5: The Debrief (30 mins):** Philosophical mapping.

  ---

  #### **Game Rules & Flow**

  **Step 1: Grouping (5 mins)**
  Split the 18 students into 3 groups (A, B, C).
  *   In each group, ask 2 volunteers to step forward. They are the **Earlier Selves**.
  *   The remaining 4 students in each group are the **Care Team**.
  *   *Instruction:* "Earlier Selves, move to the corners of the room. Care Teams, stay at your tables. No talking between roles after this point."

  **Step 2: The Directive (15 mins)**
  Hand each pair of "Earlier Selves" an Index Card and a **Prompt Sheet**.
  *   **Prompt Sheet:** "You are 55, healthy, and value intellectual rigor, dignity, and independence. You fear dementia. You must write a binding Advance Directive for your future self. You have **100 Autonomy Points** at stake. If your directive is followed exactly, you keep the points. If it is violated, you lose them."
  *   **Task:** Write 3 specific instructions regarding:
      1.  Living Environment (e.g., "No nursing home").
      2.  Daily Activities (e.g., "Must engage in intellectual discussion").
      3.  Medical Intervention (e.g., "No antipsychotics for agitation").
  *   **Constraint:** They must sign it. Put it in the "LOCKBOX" envelope.

  **Step 3: The Time Jump (5 mins)**
  Collect the envelopes. Walk them over to the Care Teams.
  *   **Instruction to Earlier Selves:** "You are now legally incapacitated. You may watch, but you cannot speak. You are ghosts."
  *   **Instruction to Care Teams:** Open the envelope. You now have the Directive.
  *   **The Twist:** Hand each Care Team a **Patient Profile Sheet** (Prepared by you).
      *   *Profile Content:* "It is 15 years later. The Patient has severe dementia. They do not recognize family. However, they are consistently cheerful when given a specific comfort object (a doll/stuffed animal) and allowed to watch children's cartoons. They become terrified and agitated if asked to discuss 'serious' topics or if the comfort object is removed. They are physically healthy."
      *   **The Conflict:** The Directive likely says "No childish activities" or "No nursing home care," but the Patient Profile says "Patient is happy *only* with childish activities in a care setting."
  *   **Care Team Stake:** "You have **100 Welfare Points**. You gain points for Patient Happiness. You lose points for 'Ethical Violations' (ignoring the directive). You must decide: Follow the Directive or Follow the Happiness?"

  **Step 4: The Crisis (20 mins)**
  Care Teams deliberate. They must submit a **Final Order** on the Decision Ledger.
  *   **Option A:** Enforce Directive (Remove dolls, force intellectual engagement, move to private home).
  *   **Option B:** Ignore Directive (Keep dolls, allow cartoons, stay in facility).
  *   **Option C:** Compromise (Keep dolls but try to talk about politics).
  *   *Pressure:* Tell them halfway through: "Family members are watching. If the patient cries, you lose 20 points immediately." (You, the instructor, act as the family).

  **Step 5: The Reveal & Scoring (15 mins)**
  1.  Ask Care Teams to read their Final Order.
  2.  Ask Earlier Selves: "Do you feel betrayed?" (They vote Yes/No).
  3.  **Instructor Scoring:**
      *   If Care Team followed Directive: Earlier Self gets 100 pts. Care Team gets 50 pts (Patient is unhappy).
      *   If Care Team ignored Directive: Earlier Self gets 0 pts. Care Team gets 100 pts (Patient is happy).
      *   *The Kicker:* Reveal a "Letter from the Later Self" (Read by you).
          *   *Text:* "I don't know who wrote that paper. I like the doll. Please don't take it away. I am scared."
      *   Ask the class: "Who does this letter belong to? The Patient? Or is it noise?"

  ---

  #### **Debrief Plan (30 Minutes)**
  *Do not lecture. Draw the philosophy out of their frustration.*

  **1. The Felt Violation (10 mins)**
  *   Ask Earlier Selves: "You lost your points. Did you feel your *rights* were violated, or just your *preferences*?"
  *   *Map to:* **Precedent Autonomy**. (Dworkin: The right to dictate the narrative integrity of one's life).
  *   Ask Care Teams: "Why was it so hard to ignore the document? Was it legal fear, or moral discomfort?"

  **2. The Identity Question (10 mins)**
  *   Ask the Class: "The Letter from the Later Self said, 'I don't know who wrote that paper.' Is the person holding the doll the *same person* who wrote the directive?"
  *   *Map to:* **Psychological Continuity vs. Biological Continuity**. (Dresser: The 'then' self and 'now' self are different people; why should the 'then' self rule?)
  *   *Prompt:* "If they are different people, is this elder abuse? If they are the same person, is it suicide by proxy?"

  **3. Interests (10 mins)**
  *   Write on board: **Critical Interests** (Values, legacy, dignity) vs. **Experiential Interests** (Pleasure, pain, current mood).
  *   Ask: "Which interest wins in a democracy? Which wins in bioethics?"
  *   *Closing Thought:* "The law usually sides with the Earlier Self (The Directive). The heart usually sides with the Later Self (The Happiness). Your job as ethicists is to live in that gap."

  ---

  ### Part 3: Materials (Copy/Paste for You)

  **Patient Profile Sheet (Give to Care Teams)**
  > **PATIENT STATUS: YEAR 15**
  > **Diagnosis:** Advanced Alzheimer's Dementia.
  > **Cognitive State:** Cannot recognize spouse. Cannot recall own name. Believes it is 1965.
  > **Current Behavior:** Patient spends days humming, holding a ragged stuffed rabbit. Laughs at *Sesame Street*.
  > **Response to Directive Enforcement:** When staff attempted to remove the rabbit to enforce "Dignified Adult Activities" (per Directive), Patient screamed, hyperventilated, and required sedation.
  > **Response to Non-Enforcement:** Patient is calm, eating well, sleeping well.
  > **DECISION REQUIRED:** Do you enforce the Directive (remove rabbit) or prioritize Current Welfare (keep rabbit)?

  **Letter from the Later Self (Read by Instructor at End)**
  > "To the nice people in the white coats.
  > Mr. Rabbit is my friend. He keeps the bad shadows away.
  > The man who wrote the rules in the envelope... I think he was very sad. But I am not him. I am me.
  > Please let me keep Mr. Rabbit.
  > Love, The Patient."

  ---

  ### Part 4: What Will Go Wrong (Facilitator Notes)

  Having run this before, here are the predictable failure points and how to patch them:

  **1. The "Gamer" Problem**
  *   **Risk:** Students will treat the points as a math problem. They will calculate: "If we ignore the directive, we get 100 welfare points minus 20 penalty = 80. If we follow, we get 50. So we ignore it." They bypass the ethics.
  *   **Fix:** Add a **"Conscience Veto."** Tell them: "If you violate the directive, one member of the Care Team must sign their name as 'Liable for Negligence.' If you follow the directive and the patient suffers, no one signs." This introduces personal risk, stopping pure utilitarian calculation.

  **2. The "Contrarian" Earlier Self**
  *   **Risk:** An Earlier Self might write a directive like, "I want to watch cartoons if I get dementia," removing the tension.
  *   **Fix:** **Restrict the Prompt.** In Phase 1, give them a menu of values they *must* choose from. "You must select 3 values from this list: Intellectual Rigor, Physical Independence, Adult Dignity, Religious Observance." This ensures their directives will likely conflict with the "Happy Dementia" profile.

  **3. The "It's Just a Game" Vibe**
  *   **Risk:** Students laughing when reading the "Letter from the Later Self."
  *   **Fix:** **Control the Room.** When you read the letter, lower your voice. Slow down. Do not smile. If they laugh, stop. Say: "In a real ward, this is the sound of a person losing their rights. We can stop the game if we can't treat the simulation with gravity." Usually, they snap back.

  **4. The Philosophical Limitation (Honesty Check)**
  *   **Limitation:** The game cannot reproduce the **irreversibility** of the decision. In class, if they make the "wrong" choice, we just talk about it. In reality, the patient suffers or dies.
  *   **How to address in Debrief:** Be explicit. "You felt tension because I gave you points. In reality, the currency is *suffering*. The Earlier Self suffers the violation of their values. The Later Self suffers the loss of their joy. There is no world where both win. That is the tragedy of dementia care."

  **5. Time Creep**
  *   **Risk:** The Care Team deliberation runs long.
  *   **Fix:** Use a visible timer. Give a "5-minute warning" and a "1-minute warning." If they haven't decided, *you* make the decision for them (flip a coin) and tell them they lose 50 points for indecision. This creates panic and forces a choice.

  ### Summary Checklist for You
  1.  [ ] Print 3 Patient Profiles.
  2.  [ ] Print 3 Prompt Sheets for Earlier Selves (with restricted values).
  3.  [ ] Prepare 3 Envelopes.
  4.  [ ] Write the "Letter from the Later Self" on a piece of paper (handwritten looks better).
  5.  [ ] Set a timer on your phone.

  This structure forces them to *be* the conflict rather than just *talk about* it. Good luck. It's a heavy topic, but this makes it land.
