      *   *Point 1 (Testimony):* Focus on the Reductionism vs. Anti-Reductionism debate. Even if testimony transmits, the hearer's *justification* might be their own (e.g., trust is a rational default).
      *   *Point 2 (Upbringing):* This is the strongest point to attack. Distinguish between *propositional testimony* ("Stealing is wrong") and *non-propositional shaping* (feeling guilt, observing consequences). Call this "moral habituation" (Aristotle).
      *   *Point 3 (Regress):* Point out that this scepticism applies to *all* knowledge (maths, science), not just morals. If it's a problem, it's a general epistemological problem, not specific to moral deference. Philosophers assume we *have* moral knowledge and ask how we share it.
      *   *Point 4 (Deference):* Distinguish between "deference" (doing X because Y said so) and "learning" (coming to see X is right via Y's guidance). The latter preserves agency.

  5.  **Final Polish (checking British English):**
