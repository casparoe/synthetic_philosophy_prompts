      *   *The Break:* The break happens at *common priors*. Rationalists often assume they have *better* priors (or better models) than the "peer" (e.g., mainstream academia, government). If you believe your prior is superior (not common), Aumann doesn't apply, and Steadfastness is Bayesian.
