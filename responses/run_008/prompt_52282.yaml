          *   *However:* The YouTuber implies this is the *main* upshot ("Quine is basically recommending..."). Quine uses it as an extreme example of the *flexibility* of the web, not a standing order to change logic whenever physics is hard. Quine himself was often skeptical of quantum logic later in his career.
