      *   *Concern 2: "Can be held true" (Description vs. Recommendation).*
          *   Quine says: "Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system." This is a description of the *structure* of confirmation (holism). It is *not* a pragmatic recommendation to do so lightly. He immediately follows up with principles of conservatism (minimum mutilation).
