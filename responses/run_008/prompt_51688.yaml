  ### Summary
  *   **Reject:** The classical exhaustivity in **(5)**.
  *   **Save:** **(4)** Gaps.
  *   **Cost:** You cannot express "is gapped" within the language (Inexpressibility).
  *   **Win:** You keep classical logic for ordinary speech; Dara breaks logic to save the Liar.

  You aren't protecting a comfort blanket; you're protecting the utility of language for everything except semantic paradoxes. That's a bargain.
