      *   **Standard Conditionalization:** Requires a proposition $E$. What is $E$?
          *   Material Conditional ($B \to B1$)? No, that's $R \lor B1$. $P(R \lor B1) = 3/4$. $P_{new}(B1) = P(B1 | R \lor B1) = (1/4)/(3/4) = 1/3$. $P_{new}(R) = P(R | R \lor B1) = (1/2)/(3/4) = 2/3$. This violates the intuition that $P(B)$ stays fixed.
      *   **Imaging (Lewis):** Shift mass within worlds. $P_{new}(B1) = 1/3, P_{new}(B2) = 1/6, P_{new}(R1) = 1/4, P_{new}(R2) = 1/4$. Preserves $P(B) = 1/2$.
      *   **MinInfo (Shore & Johnson / Williams):** Minimize $D_{KL}(P_{new} || P_{old})$ subject to constraint $P_{new}(B1|B) = 2/3$.
