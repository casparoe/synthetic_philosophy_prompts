prompt: |-
  I'm in a philosophy of mind seminar this term and we just did a unit on what emotions actually are -- the old three-way fight between emotions as judgments (you can't fear the dog without believing it's dangerous), emotions as perceptions of value-laden situations, and emotions as just feelings of bodily churn, a la William James. For my presentation next week I want to go after an analogy that a friend of mine from an evolutionary psych course keeps using and that I suspect is doing more work than it admits: the "emotions are smoke detectors" picture. The evolutionary psych version is sometimes called the smoke detector principle: false alarms are cheap and misses are catastrophic, so any well-designed threat system will be ratcheted way toward over-firing -- it's better to bolt upright at 3am because of a branch against the window ten times than to sleep through the burglar once. My friend extends it from anxiety specifically to emotions generally: fear, disgust, anger etc. are all detectors built for fitness-relevant situations, they're calibrated by ancestral cost ratios rather than by accuracy, and -- here's the step I want to examine -- therefore an emotion is a *perception* of a danger (or contamination, or betrayal) in roughly the way an itch is a perception, and not a judgment, since detectors don't judge anything, they just fire. She also uses it to say that calling an emotion "irrational" is like calling a smoke detector stupid for going off when I burn toast.

  I have to present on this and I don't want to just assert that analogies always break down somewhere; I want the actual audit. Give me the correspondence table first -- what plays the role of the smoke, the fire, the alarm, the threshold, the designer who set the cost tradeoff, the person who installs and relocates the thing -- and then the places the mapping fails. Some disanalogies I half-see (emotions can be recalibrated by learning in a way my hallway detector can't, and the "false positive" cost landscape has apparently changed massively since the savanna) but I don't know which failures actually matter for her conclusion versus which are just quibbles. Then tell me the real question: does the smoke detector picture support the *perception* view of emotions over the judgment and feeling views, or is that an extra step she's smuggling in -- is "built to detect X" enough to make a state a perception of X, and would the detector story also be compatible with a judgment theorist helping themselves to it? And separately, does "cheap false alarms" actually vindicate her move that irrationality talk is a category error, or does it just explain where the emotion came from without settling whether it can still be evaluated as fitting its object? If it helps, feel free to say what a better analogy would be for whatever claim survives. My presentation is supposed to be 20 minutes with discussion after, so I basically need your audit to be the spine of it.
reasoning: |-
  Here's a thinking process that leads to the suggested presentation outline and analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** Philosophy of Mind seminar.
      *   **Topic:** Nature of emotions (Judgment vs. Perception vs. Feeling/Jamesian).
      *   **Target:** A specific analogy used by an Evolutionary Psychology (EvoPsych) friend: "Emotions are Smoke Detectors" (The Smoke Detector Principle).
      *   **Friend's Claims:**
          1.  Emotions are detectors calibrated for fitness (ancestral cost ratios), not accuracy.
          2.  Therefore, emotions are *perceptions* (like an itch), not judgments (detectors don't judge).
          3.  Therefore, calling emotions "irrational" is a category error (like calling a detector stupid for burning toast).
      *   **User's Goal:** A 20-minute presentation auditing this analogy.
      *   **Specific Needs:**
          1.  Correspondence Table (Smoke, Fire, Alarm, Threshold, Designer, Installer).
          2.  Disanalogies (which ones matter for the conclusion?).
          3.  The "Real Question": Does the analogy support Perception over Judgment? Does it vindicate the "no irrationality" claim?
          4.  Better Analogies (if applicable).
      *   **Tone:** Philosophical, rigorous, suitable for a seminar presentation (spine of the talk).

  2.  **Initial Brainstorming & Mapping (The Correspondence Table):**
      *   *Smoke:* Proximal cue (e.g., smell of rot, shadow movement).
      *   *Fire:* Distal threat/opportunity (e.g., pathogen, predator).
      *   *Alarm:* The emotional experience/physiological response (fear, disgust).
      *   *Threshold:* Sensitivity setting (amygdala reactivity, etc.).
      *   *Designer:* Natural Selection (evolutionary history).
      *   *Installer/User:* The individual organism (but with limited control).
      *   *Environment:* Ancestral Environment of Evolutionary Adaptedness (EEA) vs. Current Environment.

  3.  **Analyzing the Disanalogies (The "Audit"):**
      *   *Recalibration:* Smoke detectors are static (mostly). Emotions learn (habituation, CBT, exposure therapy). *Significance:* High. If emotions learn, they involve cognitive processing, edging toward judgment or at least sophisticated perception.
      *   *Cognitive Penetrability:* Can beliefs change the emotion? (Knowing the snake is fake reduces fear). Smoke detectors don't care if you *know* it's toast. *Significance:* High. This attacks the "not a judgment" claim.
      *   *Intentionality:* Smoke detectors detect smoke. Emotions are *about* things (fear *of* the dog). Do detectors have intentionality? Usually no, they have causality. *Significance:* Medium/High.
      *   *The "Irrationality" Claim:* A smoke detector malfunctioning is a design flaw or environmental mismatch. An emotion can be *unfitting*. Is "unfitting" the same as "irrational"? *Significance:* Critical for the second half of the talk.

  4.  **Addressing the "Real Questions" (Philosophical Heavy Lifting):**
      *   *Perception vs. Judgment:* Does "detection" = "perception"?
          *   Perception view (Tappolet, Döring): Emotions present value properties (like eyes present color).
          *   Judgment view (Solomon, Nussbaum): Emotions involve assent to propositions.
          *   Detector view: Leans toward Perception (non-conceptual, automatic). *However*, detectors are usually input-output mechanisms. If the "input" involves conceptual processing (recognizing a "betrayal"), it looks more like judgment.
          *   *Crucial Point:* The analogy supports *Functionalism* more than Perception. A judgment can also be a "detector" of truth.
      *   *Irrationality:*
          *   Friend says: "Category error."
          *   Counter: Evolutionary explanation $\neq$ Normative justification. (Is-Ought problem). Just because anxiety was useful then doesn't mean it's fitting now.
          *   Distinction: *Rationality* (internal coherence) vs. *Fittingness* (matching the world). The smoke detector principle explains *why* the threshold is low, not whether the current alarm is *fitting*.
          *   Verdict: The analogy explains *etiology*, not *normativity*.

  5.  **Structuring the Presentation (20 Minutes):**
      *   **Intro (3 mins):** Set the stage (The Three Views), Introduce the Friend's Analogy (Smoke Detector Principle).
      *   **Part 1: The Mapping (5 mins):** The Correspondence Table. Make it visual/conceptual.
      *   **Part 2: The Cracks (7 mins):** Key Disanalogies (Cognitive Penetrability, Recalibration, Intentionality). Focus on which ones kill the "Perception vs. Judgment" argument.
      *   **Part 3: The Normative Leap (5 mins):** Does it banish "Irrationality"? Distinguish Etiology from Justification. Fittingness vs. Utility.
      *   **Conclusion/Discussion:** Better analogy? (Maybe a "Thermostat" or "Immune System").

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Don't just say "emotions learn." Specify *how*. Phobic responses can be unlearned. Smoke detectors need a human to change the battery or sensitivity. Emotions have internal feedback loops.
      *   *Correction on Perception:* The friend argues detectors aren't judgments because they "just fire." But perceptual systems also "just fire." The real distinction is whether the state has propositional content. A smoke detector has no content. An emotion has content ("This is dangerous"). This is a weak point in the friend's argument.
      *   *Correction on Irrationality:* The friend conflates "understandable" with "rational." Evolutionary psychology explains the *origin* of the bias, not the *rational status* of the token state.

  7.  **Drafting the Content:**
      *   *Table:* Clear columns.
      *   *Disanalogies:* Group them by "Architecture," "Calibration," and "Content."
      *   *Philosophical Punch:* Focus on the Is/Ought gap and the definition of Perception.
      *   *Better Analogy:* The Immune System is good (overreacts, learns, distinguishes self/other), but maybe the "Predictive Processing/Control System" is more modern. Let's stick with the **Immune System** for the "biological alarm" vibe but note its learning capacity, or a **Smart Home Security System** (cameras + AI + user settings) to capture the cognitive penetrability. Actually, for a philosophy seminar, the **Immune System** is a classic rival in this space (immunology vs. neurology models of emotion). Let's suggest **Predictive Processing (Bayesian Brain)** as the modern upgrade.

  8.  **Final Review against User Prompt:**
      *   Correspondence table included? Yes.
      *   Disanalogies audited for relevance? Yes.
      *   Perception vs. Judgment addressed? Yes.
      *   Irrationality claim addressed? Yes.
