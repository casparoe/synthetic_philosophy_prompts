          *   *Conflict:* If (1) and (4) are true, does (2) actually govern *subjective expectation*? This is the "Incoherence Problem" in MWI decision theory. If all outcomes happen, what does "probability" mean? Wallace/Greaves argue for (2). But does (2) defeat the "I will experience survival" claim?
