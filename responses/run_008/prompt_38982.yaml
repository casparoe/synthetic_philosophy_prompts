prompt: |-
  I have spent twenty years in writing workshops, where the injunction "write what you know" is repeated with the authority of settled doctrine — most recently by a colleague who invoked it to tell a student that her novel about a mathematician in 1913 Göttingen was a dead end, since she is neither a mathematician nor German. The workshop closed ranks around him, and the student, though her project survived, left believing she had been refuted rather than merely instructed. I have been unable to say precisely what the slogan had claimed in that moment, and I would like it disambiguated before I have to referee this dispute again. Lay out the distinct precise claims "write what you know" could be making — from the trivially descriptive (writers draw on their experience), through the epistemic (only first-hand knowledge yields the concrete, load-bearing detail that fiction requires), to the fully normative (a writer has decisive reason to write only what she knows). Then take the normative readings through the debate over internal and external reasons, as it runs from Bernard Williams to his critics: is any reason to write what one knows grounded in the writer's existing motivational set — so that the injunction states at most a conditional, one that fails for a writer who wants nothing from her own biography — or can knowledge of a subject supply a reason to write about it independently of any antecedent desire? For each reading, say whether it is a platitude, substantive but defensible, or straightforwardly false, and above all tell me which, if any, actually supports my colleague's use of the slogan — closing down a project on grounds of biography — as opposed to merely counselling more research.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user has spent 20 years in writing workshops. They encountered a specific incident where a colleague told a student her novel about a mathematician in 1913 Göttingen was a "dead end" because she isn't a mathematician or German. The workshop agreed; the student felt refuted.
      *   **Task:** Disambiguate the slogan "write what you know."
      *   **Structure:**
          1.  Lay out distinct precise claims (Descriptive -> Epistemic -> Normative).
          2.  Analyze the normative readings through the lens of Bernard Williams' internal/external reasons debate.
          3.  Evaluate each reading (Platitude, Substantive/Defensible, or False).
          4.  Determine which reading (if any) supports the colleague's specific action (closing down the project based on biography) vs. just counseling research.
      *   **Tone:** Philosophical, precise, analytical, authoritative but nuanced (matching the user's sophisticated phrasing).

  2.  **Deconstruct "Write What You Know" (The Claims):**
      *   *Claim 1: Descriptive/Psychological.* Writers inevitably draw on experience. (Truism).
      *   *Claim 2: Epistemic/Aesthetic.* First-hand knowledge produces better detail/verisimilitude. (Substantive).
      *   *Claim 3: Normative/Identity.* You *ought* only to write about your own identity/experience. (Restrictive).
      *   *Claim 4: Normative/Authority.* You lack the authority to write about what you don't know. (Ethical/Political).

  3.  **Apply Bernard Williams' Internal/External Reasons:**
      *   *Williams' Thesis:* All reasons for action must be grounded in the agent's "subjective motivational set" (SMS). If I have no desire/goal related to X, I have no reason to do X.
      *   *Internal Reason:* "If you want to write convincingly, you should write what you know." (Conditional on the desire to write well).
      *   *External Reason:* "You have a reason to write what you know (or not write what you don't) regardless of your desires." (Categorical).
      *   *Application:* Does the injunction hold for a writer who *wants* to imagine beyond their biography? If Williams is right, the normative force collapses unless tied to a goal (e.g., authenticity, marketability).

  4.  **Evaluate the Colleague's Intervention:**
      *   The colleague didn't say "do more research." They said "this is a dead end."
      *   This implies a *blocking* condition, not a *guidance* condition.
      *   Which claim supports this? Only the strongest Normative/Identity claim.
      *   Is that claim defensible? Likely false or at least highly contentious.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the gravity of the situation. The slogan is a shibboleth that often masks power dynamics.
      *   **Part 1: Disambiguation of Claims:**
          *   *Type A (Descriptive):* "Writers do write what they know." (Platitude).
          *   *Type B (Epistemic/Technical):* "Knowledge yields better texture." (Substantive/Defensible).
          *   *Type C (Normative-Prudential):* "You will succeed more easily if..." (Conditional).
          *   *Type D (Normative-Categorical):* "You must not write what you don't know." (The Colleague's view).
      *   **Part 2: The Williams Analysis (Internal vs. External Reasons):**
          *   Explain Williams' "Internal Reasons Thesis."
          *   Apply to Type C: It's an internal reason (hypothetical imperative). If you want verisimilitude, research or stick to experience.
          *   Apply to Type D: It claims an external reason (categorical imperative). "You lack the standing."
          *   Critique: Williams would reject the external reason unless it connects to the writer's SMS. If the writer wants to *learn* or *imagine*, the reason vanishes.
      *   **Part 3: Evaluation & The Colleague's Verdict:**
          *   Type A: Platitude. Doesn't support the colleague.
          *   Type B: Substantive. Supports "do research," not "stop."
          *   Type C: Defensible but conditional. Doesn't support "dead end" if the writer accepts the difficulty.
          *   Type D: False/Problematic. This is what the colleague used. It conflates *knowledge* with *identity*.
      *   **Conclusion:** The colleague weaponized a categorical norm that doesn't hold up. The student was refuted by a category error, not an aesthetic truth.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the 1913 Göttingen specific? Yes, use it as the test case.
      *   *Check:* Did I handle Williams correctly? Ensure I distinguish between the *reason to write* and the *reason to write well*. The colleague said the project is a "dead end" (impossible/doomed), not just "hard."
      *   *Nuance:* Acknowledge that "cultural appropriation" debates add weight to the normative claim now, but even then, "dead end" is too strong.
      *   *Tone Check:* The user is philosophically literate ("internal and external reasons," "Bernard Williams"). Match that register. Avoid colloquialisms. Use terms like "verisimilitude," "subjective motivational set," "categorical injunction."

  7.  **Final Polish:**
      *   Ensure the distinction between "counseling research" and "closing down a project" is the pivot point.
      *   Make sure the verdict on the colleague is clear: They relied on a false categorical norm.

  8.  *(Final thought before generating)*: The prompt asks to "tell me which, if any, actually supports my colleague's use of the slogan." I need to be explicit. Only the strongest, most dubious normative claim supports him, and it is philosophically unsound.

  9.  **Constructing the Output:** (Proceeding to generate response based on these steps.)
answer: |-
  The slogan "write what you know" functions in workshops less as a proposition than as a speech act: it is a move in a language game that asserts authority. To referee the dispute you describe, we must strip the slogan of its aphoristic armor and treat it as a set of distinct philosophical claims. The incident in Göttingen turns on a category error between *epistemic difficulty* and *ontological prohibition*.

  Here is the disambiguation of the claims, the analysis through the lens of Bernard Williams, and the final verdict on your colleague's intervention.

  ### I. Disambiguation of Claims

  We can distinguish four distinct readings of the injunction, ranging from the trivial to the totalitarian.

  **1. The Descriptive Claim (Psychological Inevitability)**
  *   **Formulation:** "Writers inevitably filter imagination through personal experience."
  *   **Content:** Even when writing about martians, a writer draws on their knowledge of loneliness, gravity, or hierarchy. All fiction is, in this sense, autobiographical.
  *   **Status:** **Platitude.** It is trivially true. It cannot support an injunction because one cannot obey or disobey an inevitability.

  **2. The Epistemic Claim (Verisimilitude)**
  *   **Formulation:** "First-hand knowledge yields concrete, load-bearing details that research cannot replicate."
  *   **Content:** A mathematician knows the texture of a proof in 1913 Göttingen (the smell of the chalk, the specific anxiety of the field) in a way a non-mathematician cannot easily simulate.
  *   **Status:** **Substantive but Defensible.** It is empirically likely that insider knowledge produces higher fidelity. However, it is a claim about *degree of difficulty*, not possibility. It suggests the student's task is *harder*, not that it is a "dead end."

  **3. The Prudential Norm (Hypothetical Imperative)**
  *   **Formulation:** "If you wish to minimize the risk of failure, you should write about your own biography."
  *   **Content:** This is advice on risk management. Writing outside one's ken increases the probability of error, cliché, or exposure.
  *   **Status:** **Defensible Conditional.** It offers a means-end rationality. It supports counseling caution or extra research, but it cannot logically support a prohibition unless the writer's primary goal is safety rather than art.

  **4. The Categorical Norm (Identity-Based Prohibition)**
  *   **Formulation:** "A writer lacks the authority/standing to represent experiences radically exterior to their own identity."
  *   **Content:** This is the claim your colleague invoked. It posits that biography is not just a resource but a boundary. To cross it is not to risk error, but to commit a category violation (inauthenticity, appropriation, or falsification).
  *   **Status:** **Straightforwardly False (as an aesthetic rule).** While it may have ethical traction in specific political contexts (e.g., commodifying trauma), as a general rule of fiction, it denies the fundamental mechanism of the novel: empathy and imagination.

  ### II. The Williams Analysis: Internal vs. External Reasons

  To determine if the Categorical Norm (Claim 4) can hold water, we must apply Bernard Williams' distinction between internal and external reasons.

  **Williams' Internal Reasons Thesis:**
  For an agent to have a reason to $\phi$, that reason must be grounded in their "subjective motivational set" (SMS)—their existing desires, projects, and commitments. There are no "external reasons" that apply to an agent regardless of their motivations.

  **Applying Williams to the Workshop:**

  *   **The Internal Reading (Prudential):**
      *   *Reason:* "You have a reason to write what you know *because* you want to write a convincing novel."
      *   *Analysis:* This is a sound internal reason. If the student's SMS includes the desire for verisimilitude, she has a reason to leverage her own experience or research deeply.
      *   *Limitation:* This reason is defeasible. If the student's SMS also includes a desire to *learn* mathematics or *explore* German history, the reason to "write what she knows" is balanced against the reason to "expand what she knows." It does not dictate a "dead end."

  *   **The External Reading (Categorical):**
      *   *Reason:* "You have a reason *not* to write this novel because you are not a mathematician, regardless of your desires."
      *   *Analysis:* Williams would reject this as a phantom reason. Unless there is a desire in the student's SMS (e.g., a commitment to ethical purity or a fear of criticism) that is served by abandoning the project, the colleague is positing an external reason. He is claiming the *facts of her biography* generate a reason for action independently of her *motivations as a writer*.
      *   *Critique:* If the writer's motivational set is driven by curiosity, empathy, or the challenge of the unknown, the colleague's injunction has no grip. It attempts to impose a reason from the outside (the "doctrine" of the workshop) rather than finding one within the agent's psychology.

  ### III. Verdict on the Colleague's Intervention

  We can now evaluate which claim supports your colleague's specific action: declaring the project a "dead end" rather than counseling research.

  1.  **Does the Descriptive Claim support him?**
      *   **No.** That the student *will* draw on her own experience doesn't mean she *cannot* write about Göttingen.
  2.  **Does the Epistemic Claim support him?**
      *   **No.** This claim suggests the book will be harder to write or might lack texture. It supports the advice: "You need to research 1913 Göttingen intensely." It does not support the conclusion: "Stop."
  3.  **Does the Prudential Norm support him?**
      *   **No.** This supports: "You are taking a high risk." A risk is not a dead end. Many great novels are high-risk ventures into the unknown (e.g., Melville writing about whales, Mantel writing about Cromwell).
  4.  **Does the Categorical Norm support him?**
      *   **Yes, but only at the cost of truth.** This is the only reading that justifies closing down the project. It asserts that the lack of biographical identity is a disqualifying condition.

  **Conclusion:**

  Your colleague relied on the **Categorical Norm (Claim 4)**, treating the slogan as an **External Reason**. He acted as if the student's biography generated a reason to stop writing that existed independently of her desire to write.

  Philosophically, this is **straightforwardly false**. It conflates *authority* (which can be earned through research and imagination) with *identity* (which is fixed). By invoking the slogan as a settled doctrine rather than a heuristic, he converted a **hypothetical imperative** ("if you want ease, write your biography") into a **categorical imperative** ("you must not write outside your biography").

  The student was not refuted on aesthetic grounds; she was policed on ontological grounds. The workshop closed ranks not because her project was impossible, but because the Categorical Norm is easier to enforce than the Epistemic Claim. The former requires checking a ID card; the latter requires reading the manuscript.

  **Recommendation for Refereeing:**
  You should inform the colleague that "write what you know" is, at best, a **Prudential Norm** grounded in **Internal Reasons**. It advises the student that she lacks the *current* resources to write the book easily, not that she lacks the *standing* to write it at all. To claim the latter is to deny the validity of imagination, research, and empathy—the very engines of the novel form. The student was not refuted; she was misunderstood. Her project requires not abandonment, but the rigorous acquisition of the knowledge she currently lacks.
