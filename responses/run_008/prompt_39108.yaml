answer: |-
  Right then. This is a proper classic row, isn't it? It looks like a squabble about deadlines, but it's actually a philosophical dispute about language and obligation. You've got Dev playing the role of the legalistic sceptic and Mara playing the defender of social norms.

  Here is a breakdown of who holds the stronger hand at each stage, followed by the distinction you were looking for regarding promises versus predictions, and finally, what they're both missing.

  ### The Move-by-Move Breakdown

  **Round 1**
  *   **Dev:** Claims Slack isn't the right "setting" for a performative utterance (like "I do" in a wedding).
  *   **Mara:** Counters that written performatives count (resignation emails) and public visibility adds weight.
  *   **Verdict:** **Mara is right.**
      Dev is borrowing from J.L. Austin's speech act theory, which says certain words need the right context to "do" things. He's technically correct that a pub chat isn't a courtroom, but he's wrong about the workplace. A team channel is precisely the "institutional setting" where work commitments are made. If you can't commit to work in a work channel, where can you? Mara's point about resignation emails is spot on: we accept written digital communication as binding in professional contexts daily.

  **Round 2**
  *   **Dev:** Argues a promise isn't a contract; without enforcement, it's just a prediction (like weather).
  *   **Mara:** Argues that moral obligation exists without contracts (airport example) and accuses Dev of hiding behind semantics.
  *   **Verdict:** **Mara is right.**
      Dev is conflating *legal enforceability* with *normative obligation*. Just because you can't sue someone for missing a lunch date doesn't mean they didn't owe it to you to show up. Dev's weather forecast analogy is weak because a forecaster doesn't claim to *control* the rain, whereas a developer claims agency over their code. Mara correctly identifies that Dev is engaging in "bad faith" argumentation—using technical definitions to evade social accountability.

  **Round 3 (Dev's Final Word)**
  *   **Dev:** Claims obligation comes from consequences (being stranded), not the words. If the work was done, the words wouldn't matter.
  *   **Verdict:** **Dev is wrong (again).**
      This is a category error. If I promise to pick you up and you manage to get a lift with someone else, I have *still* broken the promise, even if you weren't stranded. The obligation is created by the agreement, not the disaster. Dev is arguing that "results excuse the process," which is a dangerous mindset in engineering. If the migration had worked, the words wouldn't matter, true—but they only don't matter because the *outcome* satisfied the *obligation*. The obligation existed regardless.

  ---

  ### The Principled Distinction: Promise vs. Prediction

  You mentioned you couldn't articulate why Dev's claim (that a promise is just a prediction about one's own behaviour) felt off. It feels off because it is philosophically bankrupt. Here is how you distinguish them.

  **1. Direction of Fit**
  This is the clearest way to put it.
  *   **A Prediction** has a **mind-to-world** direction of fit. I look at the world, assess the evidence, and try to make my words match reality. If I say "It will rain," and it doesn't, my *words* were wrong.
  *   **A Promise** has a **world-to-mind** direction of fit. I am not trying to match reality; I am trying to *change* reality to match my words. If I say "I will pay you £10," and I don't, *I* am wrong (morally), not just my statement.

  Dev is trying to treat his commitment as a prediction ("I assessed the code and predicted completion"). But by using the word "promise," he shifted it to a commitment ("I will ensure completion").

  **2. The Transfer of Control**
  When you make a prediction, you retain control. "I think I'll be there."
  When you make a promise, you give the other person a right to expect performance. You have handed them a slice of your autonomy. As the philosopher T.M. Scanlon argued, breaking a promise violates the principle of fidelity. It disrespects the person who relied on you.

  If Dev merely predicted, he would have said, "I expect to finish by Friday." By saying "I promise," he invited the team to rely on that certainty for their own planning.

  **3. The Condition of Failure**
  *   If a **prediction** fails, you are **mistaken**. (e.g., "I thought the traffic would be clear.")
  *   If a **promise** fails, you are **in debt**. (e.g., "I owe you an explanation or recompense.")

  Dev wants the failure to be a mistake (unfortunate, but blameless). Mara correctly identifies it as a debt (a breach of trust that needs repairing).

  ---

  ### What They Are Both Missing

  While Mara wins the argument on the merits, they are both dancing around the actual problem. They are arguing about *semantics* when they should be arguing about *engineering culture*.

  **1. The "Commitment vs. Guarantee" Confusion**
  In software, there is a massive difference between committing to *effort* and guaranteeing an *outcome*.
  *   **Dev** likely meant: "I commit to working prioritised hours to achieve this."
  *   **The Team** heard: "I guarantee this feature will be shippable."
  Software is inherently uncertain. A "promise" in engineering should usually be probabilistic ("I am 90% confident") rather than absolute ("I promise"). Dev used absolute language for a probabilistic task. That was his error, but Mara's error is thinking that treating it as a moral failing helps solve the estimation problem.

  **2. Psychological Safety vs. Accountability**
  Mara is right that Dev is dodging accountability. However, by turning a missed deadline into a "broken promise" moral trial, she risks creating a culture where devs are afraid to speak up about risks. If saying "I promise" is a capital offence when things go wrong, next time Dev will say, "I'll try my best," which is useless for planning.
  They need to agree on a vocabulary. Perhaps the team should ban the word "promise" entirely and use "commitment" or "forecast," which carry slightly less moral baggage but still imply professional duty.

  **3. The Systemic Issue**
  Dev missed the deadline. Why? Was it scope creep? A technical blocker? Poor estimation?
  By arguing about whether the Slack message was a "performative utterance," they are ignoring the retrospective's actual purpose: finding out *why* the work wasn't done so it doesn't happen again. Dev is focusing on the *label* of the failure to avoid the *substance* of the failure. Mara is focusing on the *label* to enforce the *substance*. Both are stuck on the label.

  ### Summary Advice

  If I were you, I'd suggest the following to the team:

  1.  **Acknowledge Mara's point:** In a professional context, "I promise" creates a legitimate expectation and obligation. Dev cannot walk that back without damaging trust.
  2.  **Acknowledge Dev's anxiety:** He's likely terrified of being blamed for unforeseen technical debt. He's using logic as a shield because he feels cornered.
  3.  **Change the Vocabulary:** Agree that going forward, the team uses "confidence levels" rather than promises. "I promise" is too binary for software development.
  4.  **Move On:** The promise was broken. The apology is due. Now, let's talk about the blocker that actually stopped the migration.

  Dev is in the wrong, but Mara needs to ensure winning the argument doesn't mean losing the teammate.
