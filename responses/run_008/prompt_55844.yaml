      *   **(5) Marta (Objectivity) vs. Dev (Calibration):** Marta says Subjectivism makes probability subjective/psychological, removing objective wrongness. Dev says calibration/scoring rules allow criticism without mind-independent facts. Marta says this relies on frequencies.
