answer: |-
  # Simulation Design: "The Port of Otranto"

  **Objective:** To viscerally demonstrate Braudel's three tiers of historical time (*événements, conjonctures, longue durée*) by decoupling immediate player feedback from long-term success conditions.
  **Time:** 90 Minutes (10 min setup, 60 min gameplay, 20 min debrief).
  **Participants:** 18 Undergraduates (3 Groups of 6).
  **Materials Needed:** 3 "City Dashboards," 3 "Structure Boards" (kept separate), 40 "News Cards," tokens (gold/food), printed role cards.

  ---

  ## 1. Roles & Setup (10 Minutes)
  Divide the class into three competing city-states (Venice, Genoa, Ragusa). Each group of 6 assigns the following roles:

  1.  **Doge (Mayor):** Final decision authority.
  2.  **Treasurer:** Manages Gold tokens.
  3.  **Merchant:** Manages Trade Goods tokens.
  4.  **Admiral:** Manages Defense/Fleet tokens.
  5.  **Scribe:** Records decisions and scores.
  6.  **Geographer (The Structural Role):** Holds the **Structure Board**. *Constraint:* **Forbidden from speaking during Event Rounds.** May only speak during "Census Rounds" (Rounds 4, 8, 12). If they speak out of turn, the city loses 5 Gold.

  **The Boards:**
  *   **City Dashboard (Visible to all):** Tracks Gold, Goods, Fleet, and *Event Score* (Prestige).
  *   **Structure Board (Visible ONLY to Geographer):** Tracks **Harbor Depth** (starts at 10), **Soil Fertility** (starts at 10), and **Land Tenure Stability** (starts at 10). These are the *Longue Durée* variables.

  ---

  ## 2. Gameplay Mechanics (60 Minutes)
  The game consists of 12 Rounds (5 minutes each).

  ### A. Event Rounds (Rounds 1-3, 5-7, 9-11)
  1.  **News Draw:** The Instructor draws a "News Card" for each group. These are *Événements*.
      *   *Examples:* "King Declares War (-5 Gold, +2 Prestige)," "Pirate Raid (-3 Fleet)," "Royal Wedding (+1 Prestige)," "Plague in Neighboring City (+1 Trade)."
  2.  **Decision:** The group has 3 minutes to debate and spend resources to react.
  3.  **Silence:** The **Geographer** must remain silent. They may update the Structure Board secretly but cannot warn the group about consequences.
  4.  **Resolution:** Resources are adjusted. *Event Score* is updated.

  ### B. Census Rounds (Rounds 4, 8, 12)
  1.  **Reveal:** The Geographer reveals the Structure Board to the group.
  2.  **Structural Decay:** The Instructor announces environmental shifts (*Conjonctures/Longue Durée*).
      *   *Harbor Silt:* -1 Depth per Census (unless dredged).
      *   *Soil Exhaustion:* -1 Fertility per Census (unless crop rotation adopted).
      *   *Tenure Rigidity:* If Gold > 50, Land Tenure Stability -1 (wealth concentration causes unrest).
  3.  **Constraint Check:** The Geographer applies **Hard Caps** based on Structure variables.
      *   *Harbor Depth < 5:* City cannot buy new Ships (Trade capped).
      *   *Soil Fertility < 5:* Food production halved (Gold income -50%).
      *   *Tenure Stability < 5:* 20% of Gold stolen by internal revolt.
  4.  **Speech:** The Geographer may now speak for 2 minutes to advise on structural repair before the next Event Round begins.

  ---

  ## 3. Scoring & Payoff Scheme
  **The Trap:** Most students will optimize for *Event Score* (Prestige) because it updates every round and feels like "winning."

  **Final Scoring Formula:**
  *   **Event Score (Prestige):** 1 Point per Prestige token.
  *   **Structure Score:** 10 Points per Structure Variable (Depth, Fertility, Tenure) remaining at end of game.
  *   **Total:** (Prestige × 1) + ((Depth + Fertility + Tenure) × 10).

  *Example:*
  *   **Group A (War Hawks):** 40 Prestige, but Harbor Silted (Depth 2), Soil Exhausted (Fertility 3), Unrest (Tenure 4).
      *   Score: 40 + (9 × 10) = **130 Points.**
  *   **Group B (Stewards):** 10 Prestige, but maintained Harbor (Depth 8), Soil (Fertility 9), Tenure (Stability 8).
      *   Score: 10 + (25 × 10) = **260 Points.**

  *Group B wins decisively, despite having less "history" (Prestige/Events) to show for it.*

  ---

  ## 4. Printable Materials (Summaries)

  **News Cards (Événements) - Print 40**
  *   *War Declared:* Pay 5 Gold, Gain 3 Prestige.
  *   *King Died:* Pay 2 Gold (funeral), Gain 1 Prestige.
  *   *Pirate Raid:* Lose 2 Fleet.
  *   *Good Harvest:* Gain 3 Food.
  *   *Diplomatic Snub:* Lose 1 Prestige.
  *   *(Keep these high-frequency and emotionally charged.)*

  **Structure Board (Longue Durée) - Print 3**
  *   **Harbor Depth:** [10] [9] [8] ... [0] *(Determines Trade Cap)*
  *   **Soil Fertility:** [10] [9] [8] ... [0] *(Determines Income Multiplier)*
  *   **Land Tenure:** [10] [9] [8] ... [0] *(Determines Risk of Revolt)*
  *   *Note:* Only the Geographer may touch this board during Event Rounds.

  **Role Card: Geographer**
  *   **YOU HOLD THE FATE OF THE CITY.**
  *   **RULE:** You cannot speak during Event Rounds.
  *   **RULE:** You must apply Hard Caps during Census Rounds.
  *   **GOAL:** Keep Structure variables above 5.
  *   **WARNING:** If you speak out of turn, your city is fined 5 Gold.

  ---

  ## 5. Debrief Guide (20 Minutes)
  *Do not announce the winner immediately. Ask for their emotional state first.*

  1.  **The Frustration of the Geographer:** Ask the Geographers how it felt to watch their city make mistakes they couldn't prevent.
      *   *Braudel Link:* This mimics how geographical and structural constraints operate in real history. They are always present but often invisible to political actors focused on the "news."
  2.  **The Shock of Scoring:** Reveal the scores. The group with the most "battles" (Prestige) likely lost.
      *   *Braudel Link:* *Événements* are "foam on the wave." They are noisy and visible, but the wave (*Longue Durée*) determines where the water actually goes.
  3.  **The Census Rounds:** Ask what changed during Rounds 4, 8, 12.
      *   *Braudel Link:* These represent *Conjonctures* (cycles). They are slower than events but faster than geography. They are the bridge between the two.
  4.  **The Hard Caps:** Ask the "Admirals" how it felt to have Gold but be unable to buy ships due to Harbor Depth.
      *   *Braudel Link:* Structure is not just a background; it is a *constraint on agency*. You cannot vote or buy your way out of a silted harbor.

  ---

  ## 6. Limitations & Failure Points
  **What this simulation cannot reproduce:**
  *   **The Timescale:** The *Longue Durée* operates over centuries. In this game, it operates over 60 minutes. Students know the game will end, so they might "speedrun" the structure. In reality, contemporaries do not know when the structure will break; it feels like fate, not a timer.
  *   **The "Feel" of Fate:** In the game, the Structure Board is a tangible object held by a classmate. In reality, the *Longue Durée* is intangible. You don't see "Soil Fertility" declining; you just see slightly lower yields for a generation until collapse.

  **What will go wrong the first time:**
  1.  **The Geographer Rebellion:** Your Geographers will try to speak during Event Rounds because it is painful to watch their team fail. You must enforce the silence rule strictly, or the pedagogical point collapses.
  2.  **Event Optimization:** Groups will realize the scoring rubric halfway through and pivot entirely to structure, missing the point of the "trap." *Counter:* Remind them that "Prestige" is required to survive Event Cards (some require Prestige payments), forcing a tension between the two.
  3.  **Time Creep:** 5-minute rounds are tight. If you let debates drag, you won't reach the final Census. Use a loud timer.
  4.  **Blaming RNG:** Students will blame the News Cards for their loss rather than their neglect of the Structure Board. *Counter:* In the debrief, show them that the News Cards netted to zero over 12 rounds; the Structure Decay was the only constant.

  Core mechanic: Enforcing a communication embargo on structural variables during high-frequency decision rounds forces players to experience the invisibility of the longue durée amidst the noise of events.
