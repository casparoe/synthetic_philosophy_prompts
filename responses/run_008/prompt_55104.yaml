answer: |-
  The con

  The session is titled 'The Grant Committee'. You have twelve participants; three are confederates briefed beforehand. The remaining nine are marks. The task is to allocate a fictional £10,000 publishing grant to one of three hypothetical manuscripts described on cards distributed at the start. The group must reach a unanimous decision within forty-five minutes. The stakes are tangible but low: if they reach consensus, everyone receives a high-quality notebook; if they fail, no one gets anything. This creates pressure to agree without dictating *what* they agree on.

  The three confederates are assigned specific influence strategies to advocate for different manuscripts. Confederate One argues for Manuscript A using pure persuasion. Their script relies on logic, textual evidence, and mutual benefit. They engage the group's judgement, inviting scrutiny and offering counter-arguments. This is the control condition: influence through reason.

  Confederate Two argues for Manuscript B using overt manipulation. Their techniques sidestep judgement entirely. They employ scarcity ('We only have ten minutes left'), social proof ('Everyone seems to like this one'), and time pressure. They interrupt dissenters politely but firmly, framing disagreement as obstructionism. This should feel aggressive and triggering.

  Confederate Three argues for Manuscript C using techniques on the contested boundary. They utilise reciprocity (having brought everyone coffee before the session started) and emotional framing ('This author is a single parent; this money changes lives'). They use vulnerability to induce guilt. This is the crux of the exercise: is this empathy or coercion? Does caring for the author compromise the committee's duty?

  The room is arranged in a circle. You, the facilitator, remain silent except to enforce time limits. You observe who speaks, who yields, and where the tension sits in the room. The confederates are instructed to escalate their techniques if the group stalls. The goal is not to win, but to move the group's decision-making process into different gears. By the end, the group will have chosen a winner, but the path to that decision will be uneven. Some will feel proud of the choice; others will feel relieved it's over; some will feel vaguely unsettled but unable to say why. The physical sensation of being 'pushed' versus 'led' is the data you will mine later. Ensure the confederates mix their techniques so the boundary cases are not immediately obvious. The success of the con relies on the marks believing this is a genuine deliberation about literature, not a test of their psychology.

  The reveal

  Stop the clock immediately after the decision. Do not congratulate them yet. Hand out index cards and ask everyone to write down the exact moment they felt their mind change, and the exact moment they felt their gut tighten. Collect these anonymously. Then, reveal the confederates and distribute their actual scripts. Read the scripts aloud, contrasting the intended technique with the group's perception.

  Now, map the experience to three criteria for the persuasion-manipulation line. First, 'Bypassing Judgement': Did the technique engage System 2 thinking (logic) or exploit System 1 (heuristics)? Ask the group to identify which arguments they can recall verbatim versus which they simply absorbed. Second, 'Surviving Reflection': Would they still agree with the choice tomorrow, outside this room's pressure? Usually, manipulative choices feel fragile once the urgency fades. Third, 'Who Benefits': Persuasion tends towards mutual gain; manipulation often hides unilateral benefit. Ask Confederate Three specifically: did their emotional appeal serve the author or the group's conscience?

  Draw a timeline on the whiteboard. Mark the moments of high tension and high agreement. Invite participants to place sticky notes on the timeline indicating where they felt 'respected' versus 'managed'. The debate here is more valuable than the conclusion. You are not looking for a verdict on ethics, but a shared vocabulary for the sensation of influence. The goal is for them to leave able to say, 'I felt my judgement being sidestepped,' rather than just 'I felt uncomfortable.'

  Where it'll break

  The most predictable failure is the 'Skeptic'. One mark will spot the confederates early, perhaps recognising a plant from a previous workshop or simply sensing the script. They may stay silent to watch the fun, or become disruptive. If they stay silent, the data is corrupted; if disruptive, the safety breaks. Handle this by establishing a 'green card' rule at the start: anyone can pause the simulation if they feel unsafe, no questions asked. If a Skeptic emerges, acknowledge their sharpness privately during a break and ask them to hold fire until the reveal to protect the experience for others.

  Secondly, participants may feel betrayed rather than educated. Being 'worked' can trigger defensiveness. To mitigate this, your initial briefing must be explicit: 'You will be influenced today. The question is how.' This frames the manipulation as part of the contract, not a violation of it. Finally, groupthink may silence the debrief. If the dominant voices dominate the analysis, use the anonymous cards you collected earlier to ensure quieter participants are heard. Read their observations aloud to democratise the interpretation of the event.

  What I can't stage

  No classroom exercise can reproduce the cost of resistance. In this room, saying 'no' carries no social penalty beyond a awkward silence; in real life, refusing a partner, boss, or family member risks relationship rupture or financial security. You cannot simulate the erosion of self-trust that occurs over months of gaslighting, only the acute spike of a single session. Furthermore, the power differential is simulated. You are all peers here; real manipulation often relies on an entrenched hierarchy that makes the 'line' invisible to the victim until it is too late. You must assert in the debrief that real-world manipulation is rarely a single event, but a slow adjustment of the baseline.
