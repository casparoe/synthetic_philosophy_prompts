answer: |-
  ### Pre-Set Notebook: Mapping the Deck to the Desk

  *Coach's Log / Philosopher's Notes*

  **Objective:** Map the Ryle vs. Stanley/Williamson debate onto 15 years of pool deck experience without drowning in jargon.

  **Initial Associations:**
  *   **Ryle:** Feels like "feel for the water." The swimmer who can't explain why they're fast but wins. The drill that fixes a problem without the swimmer knowing what the problem was. The regress argument feels exactly like "paralysis by analysis"—if you have to think about the rule for every stroke, you drown.
  *   **Stanley & Williamson (Intellectualism):** Feels like video analysis + verbal cues. "Know that *this* angle is the way to enter." The claim is that the swimmer *possesses* the proposition, even if they aren't reciting it.
  *   **The Friction:** Stanley says knowing-how *is* knowing-that (under a practical mode). Ryle says knowing-how is a *disposition*.
  *   **The Problem:** When a swimmer chokes, they revert to "knowing-that" (thinking about angles). If knowing-how *was* knowing-that, choking shouldn't be a category shift; it should just be accessing the same knowledge differently. But it feels like a different *kind* of state.
  *   **Honesty Check:** Am I assuming "muscle memory" is non-propositional? Yes. Coaching lingo assumes the body knows what the mind doesn't. I need to flag this.
  *   **Concrete Prediction:** If Stanley is right, I should be able to teach a swimmer purely through perfect propositions (biomechanics lecture) and they would "know how," even if they lacked the strength to execute. If Ryle is right, the lecture is categorically useless for *ability*.
  *   **Normativity:** In philosophy, "knowing how" implies a standard of correctness beyond success. In swimming, "correct" usually just means "fast" or "efficient." Is there a gap? Yes. You can swim fast with ugly technique (Thorpe vs. generic elite). Does the ugly swimmer "know how"? Philosophers might say no (wrong method). I say yes (got to the wall).

  **Decision:** I will structure the response as a "Set List" (the translation) followed by the "Residue Report" (the analysis). I will keep the voice grounded—someone who wears a whistle but owns a copy of *The Concept of Mind*.

  ***

  ### The Main Set: Translating the Debate to the Pool Deck

  Listen, I've read the papers, and I've watched thousands of hours of stroke video. Here is the truth: The philosophers are arguing about whether the stopwatch or the split times are the "real" race. They're both describing the same swim, just from different lanes.

  Here is how the debate looks when you take off the tweed jacket and put on the parka.

  **1. The Intellectualist Position (Stanley & Williamson)**
  *The Claim:* Knowing how to swim freestyle is knowing *that* a certain way (w) is a way to swim freestyle, grasped under a "practical mode of presentation."
  *The Pool Translation:* This is the **Video Analysis + Cueing** model.
  When I stand on the deck and tell a swimmer, "Your hand entry is crossing the midline," I am giving them a proposition. I am asserting: *That* (pointing) is a way not to swim. The Intellectualist says the swimmer's ability consists in grasping the truth of the correct proposition ("Hand enters shoulder-width").
  *   **The Nuance:** Stanley knows you can't just *think* your way to a gold medal. He argues the knowledge is *practical*. It's not that the swimmer is reciting "shoulder-width" in their head while swimming. It's that their success is guided by their grasp of that fact.
  *   **The Coaching Equivalent:** This maps to **Explicit Learning** and **Internal Focus**. It assumes the swimmer is running a software program where the code (the proposition) drives the hardware (the body). When you fix a stroke with a verbal cue ("reach for the wall"), you are updating the code.

  **2. The Anti-Intellectualist Position (Ryle)**
  *The Claim:* Knowing how is a disposition, a capacity to perform. Treating it as knowledge-of-facts is a category mistake. It leads to an infinite regress (if you need a rule to act, you need a rule to apply the rule).
  *The Pool Translation:* This is the **Drill Work + Feel** model.
  When I give a swimmer a sculling drill to fix their catch, I am not giving them a fact. I am training a disposition. I am building a habit.
  *   **The Regress as Choking:** You suspected Ryle's regress is "paralysis by analysis." You're right. If swimming required consulting a proposition before every stroke, you'd drown. The elite swimmer doesn't consult a rule; they *are* the rule in motion. Their knowledge is in the doing, not in a mental database they query.
  *   **The Coaching Equivalent:** This maps to **Implicit Learning**, **Chunking**, and **Automaticity**. When a swimmer hits flow state, they lose access to the components. Ask them what their elbow did; they say "I don't know, I was just swimming." Ryle says this isn't ignorance; it's proof that the knowledge wasn't propositional to begin with.

  **3. The Conflict Zone: The Coach's Eye vs. The Swimmer's Feel**
  *   **The Fault I Can't Articulate:** I see a drag in the recovery. I can't describe the angle. I give a drill ("swim with fists") that fixes it.
      *   *Intellectualist:* You actually *do* know the proposition, you just can't verbalize it. The knowledge is there, under a practical mode.
      *   *Rylean:* You have a capacity to correct, not a piece of knowledge. You recognize a pattern of success, not a truth.
  *   **Performer vs. Coach:**
      *   *Kid who can do but not coach:* High capacity (Rylean know-how), low propositional access (low know-that).
      *   *Ex-swimmer who coaches but can't do:* High propositional access (knows the biomechanics), low capacity (lost the disposition).
      *   *The Debate:* Stanley says the coach *also* knows-how, just without the physical ability to execute (like a pianist with broken hands). Ryle says if you can't do it, you don't fully know-how, you just know *about* it.

  **4. The Honesty Check (Concrete Predictions)**
  You asked for a testable prediction.
  *   **If Intellectualism is true:** There exists a possible world where a perfect verbal description of "how to swim" could transmit the ability, provided the body was capable. The gap between instruction and performance is just physical strength or friction.
  *   **If Ryle is true:** No amount of verbal description constitutes ability. You could know every true proposition about hydrodynamics and still not know how to swim. The gap is categorical, not physical.

  ***

  ### Residue Report

  Here is the breakdown of what fits, what breaks, and what's missing.

  **1. What translates cleanly**
  *   **Ryle's Regress vs. Paralysis by Analysis:** This is a near-perfect match. When a swimmer "tries too hard" in a race, they are attempting to govern their automatic dispositions with explicit rules. They are trying to consult the proposition mid-stroke. The result is stiffness, timing loss, drowning. Ryle's logical regress manifests as physiological latency. The brain can't compute the rule-application fast enough for the stroke rate.
  *   **The Performer/Coach Distinction:** This maps cleanly onto the separation of *capacity* (Ryle) and *propositional grasp* (Stanley). We see this daily: the elite swimmer who cannot explain their stroke (high capacity, low articulation) vs. the biomechanist who can diagram the stroke but can't swim it (high articulation, low capacity). The debate explains why these two people exist.

  **2. What translates only with distortion**
  *   **The "Practical Mode of Presentation":** Stanley's move to save Intellectualism is that the proposition is grasped *practically*. In coaching terms, this is distorted. When a swimmer grasps a cue ("high elbow"), it is initially propositional (explicit). As they master it, it becomes implicit (automatic). Stanley wants to say it's *always* propositional, just accessed differently.
      *   *The Bend:* Coaching experience suggests the knowledge *changes category* during learning. It starts as know-that (instructions) and becomes know-how (disposition). Stanley insists it remains know-that throughout. This bends the coaching reality where the *goal* is often to eliminate the propositional content to prevent choking. We want them to stop knowing *that* and start knowing *how*.
  *   **Tacit Knowledge (The Fault I Can't Articulate):** Stanley says I possess the proposition even if I can't speak it. This bends the concept of "proposition." If I cannot articulate it, cannot write it, and cannot consciously access it, calling it a "proposition" stretches the word until it snaps. It fits better as a perceptual sensitivity (Rylean disposition) than a hidden fact.

  **3. What has no expression at all in coaching vocabulary**
  *   **The Normative Condition:** Your hunch is correct. In philosophy, "knowledge" implies correctness independent of success. You can believe a true proposition by luck, but you can't *know* it by luck.
      *   *The Gap:* In swimming, **success is the only norm that matters.** If a swimmer gets to the wall faster with a crossed-over entry than a straight entry, the crossed-over entry is "correct" for them. There is no abstract "True Way to Swim" outside of hydrodynamics and individual anatomy.
      *   *The Missing Piece:* Philosophy worries about whether the ability is exercised *for the right reasons* or via the *right method*. Coaching worries about *split time*. If a swimmer wins using a method I think is wrong, I don't say "they don't know how to swim." I say "they're efficient despite themselves." The philosophical distinction between *reliable knack* and *genuine knowledge* dissolves in the water. If the clock says yes, the answer is yes.

  **4. Your Honesty Requirements**
  *   **Smuggled Assumptions:** You asked me to flag where coaching concepts assume non-propositionalism.
      *   *Flag:* **"Muscle Memory."** This term assumes the knowledge is stored in the body, not the mind. It presupposes Ryle.
      *   *Flag:* **"Feel for the water."** This implies a non-cognitive access to information.
      *   *Flag:* **"Trust the training."** This is an instruction to *stop* propositional monitoring.
      *   *Impact:* Our vocabulary is already rigged against Intellectualism. We don't say "access your practical propositions"; we say "stop thinking."
  *   **Concrete Prediction:**
      *   *Intellectualist Prediction:* If I find the *perfect* verbal cue, it should theoretically correct the stroke immediately, because the error was a lack of grasping the proposition.
      *   *Rylean Prediction:* Verbal cues are just triggers for dispositional training. They will rarely work immediately; they require repetition to build the capacity.
      *   *Reality:* Verbal cues rarely work immediately. They require drills (repetition). This favors Ryle. However, sometimes a single cue ("imagine pulling a rope") fixes everything instantly. This favors Stanley (grasping the proposition unlocks the capacity). The reality is mixed, suggesting the debate is binary where the phenomenon is spectrum.

  ***

  ### The Verdict

  You asked me not to sit on the fence. Here it is.

  **The philosophical debate is less substantive than it looks, but your vocabulary is missing the mechanism.**

  Here's why: The philosophers are fighting over whether the *state* of the swimmer is propositional or dispositional. But on the pool deck, we know it's **both**, sequentially.

  Learning to swim is the process of converting Stanley-knowledge (propositions, cues, biomechanics) into Ryle-knowledge (dispositions, automaticity, feel).
  *   **Novices** are Intellectualists. They need rules. "Hand enters here. Elbow bends there." They are compiling code.
  *   **Elites** are Ryleans. They are the code running. If they try to read the code mid-race, they crash (choke).

  The debate fails because it treats "Knowing How" as a static state. It isn't. It's a trajectory.

  **However,** the reason you can't map the debate onto your job isn't because you're missing something. It's because the philosophers are arguing about **possession conditions** (what do you have in your head?) while you are arguing about **performance conditions** (what does the body do?).

  Stanley can claim the elite swimmer "possesses" the proposition even when they aren't thinking about it. Ryle can claim they only possess the disposition. **You cannot test this at the pool.** It doesn't change the set list. It doesn't change the drill.

  **Final Call:** The residue shows that the philosophical debate is a category error about *language*, not about *swimming*. Ryle wins on the deck because his vocabulary matches the phenomenology of flow and choking. Stanley wins in the seminar because his vocabulary matches the structure of instruction.

  But if you force me to choose based on utility: **Ryle is the better coach.**
  Why? Because treating ability as a disposition prevents the very error that kills races: the belief that you can think your way to speed. If you believe Stanley too hard, you start believing there is a "True Proposition" that fixes the stroke. You start talking too much. You start making swimmers think.

  Ryle tells you: Shut up and make them drill. The knowledge is in the water, not in the head. That's the truth I've learned in fifteen years, and no amount of modal logic is going to swim a set for me.
