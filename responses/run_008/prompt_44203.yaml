prompt: |-
  I'm the one stats person at a mid-sized county health department, and every month or two somebody up the chain wants to put a claim in a press release or a board briefing like "vaccination rates rose this year" or "our ER wait times fell," based on one aggregate number. My recurring nightmare is that the aggregate moves one way while every subgroup underneath it moves the other way, and I didn't catch it before it went out. I know the textbook version of Simpson's paradox but I need something I can actually run on a two-page table in half an hour, not a lecture.

  Please turn whatever the formal idea actually is into a procedure I can follow: the questions to ask in order (like, when do I even owe the subgroups a look, which partitions matter, how big does a reversal have to be before it's not just noise), what counts as a good enough answer at each step, and where the procedure should stop and say "this is a judgment call, escalate to a human" (that human might be me, but at least name it as a judgment call). Then run it on two cases for me: (1) teen vaccination coverage looks like it ticked up countywide, but the split by school district shows every district down slightly, and (2) average ER wait time is down a lot while waits in every acuity tier are flat-to-up, because case mix shifted. I'd especially like the second one to be handled honestly even though the honest answer kills the press release. Also tell me where this procedure will misfire — e.g. am I just fishing for a partition that reverses, and how would I know? — and what it flat out can't settle, like which aggregation is the "real" one for the public to hear about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Solo stats person at a mid-sized county health department.
      *   **Problem:** Pressure to release aggregate claims ("rates rose," "wait times fell") that might be misleading due to subgroup reversals (Simpson's Paradox).
      *   **Need:** A practical, actionable procedure (checklist/flowchart style) to run on a two-page table in ~30 minutes. Not a theoretical lecture.
      *   **Specifics:** Needs ordered questions, thresholds for action, "escalation points" (judgment calls), and application to two specific cases (Teen Vax, ER Wait Times).
      *   **Caveats:** Needs to address pitfalls (p-hacking/partition fishing) and limitations (what the procedure *can't* decide).
      *   **Tone:** Professional, pragmatic, slightly weary but rigorous, empathetic to the political reality.

  2.  **Deconstruct the Statistical Problem:**
      *   The core issue is *Simpson's Paradox* (or more broadly, *aggregation bias* or *confounding*).
      *   The goal is to detect when an aggregate trend contradicts subgroup trends.
      *   The constraint is time and data availability (two-page table, no complex modeling).
      *   The output must be a "Go/No-Go/Escalate" decision on the press release claim.

  3.  **Develop the Procedure (The "30-Minute Reversal Check"):**
      *   *Step 1: Trigger.* When do we even do this? (Any aggregate claim used for public/policy messaging).
      *   *Step 2: Identify Partitions.* What subgroups exist? (Demographics, Geography, Acuity). Don't fish; use pre-existing administrative categories.
      *   *Step 3: Direction Check.* Do subgroups move the same way as the aggregate?
      *   *Step 4: Magnitude/Significance.* Is the reversal big enough to matter? (Overlap of confidence intervals, or just practical significance).
      *   *Step 5: Weighting Check.* Why did the aggregate move? (Composition change vs. rate change).
      *   *Step 6: Decision.* Clear to publish, Qualify, or Kill.

  4.  **Drafting the Steps (Iterative Refinement):**
      *   *Refinement on "Fishing":* Explicitly forbid looking for *any* split that works. Only look at *standard* reporting splits (e.g., school districts, triage levels).
      *   *Refinement on "Noise":* Since it's a health dept, they likely have denominators. Use simple confidence intervals or a "rule of thumb" (e.g., if subgroup change is <1% and aggregate is >5%, investigate). Let's keep it simpler: "Directional Consistency."
      *   *Refinement on "Judgment Call":* The stats person can identify the math, but the Comms Director/Health Officer decides the message. The procedure must flag *when* to hand it off.

  5.  **Applying to Case 1: Teen Vaccination:**
      *   *Aggregate:* Up slightly.
      *   *Subgroups (School Districts):* All down slightly.
      *   *Mechanism:* Population shift (more teens in districts with historically higher rates, or just raw numbers shifting).
      *   *Verdict:* This is classic Simpson's. The claim "rates rose" is mathematically true for the aggregate but misleading for the experience of every district.
      *   *Action:* Kill the "rates rose" claim. Reframe to "Total doses administered increased" (if true) or acknowledge the disparity.

  6.  **Applying to Case 2: ER Wait Times:**
      *   *Aggregate:* Down a lot.
      *   *Subgroups (Acuity Tiers):* Flat/Up.
      *   *Mechanism:* Case mix shift (fewer critical patients, more minor stuff).
      *   *Verdict:* The aggregate is "real" for the *average patient*, but "false" for *clinical performance*.
      *   *Action:* Honest answer kills the press release. Must disclose case mix. "Average wait down due to shift in patient types, not processing speed."

  7.  **Addressing Limitations & Pitfalls:**
      *   *Fishing:* If you test 20 splits, one will reverse by chance. Stick to *a priori* splits.
      *   *The "Real" Number:* Stats can't decide this. It's a policy question. Is the "average patient" experience more important, or the "typical clinical condition" experience?
      *   *Small N:* Subgroups might be too small to trust.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the stress, validate the risk.
      *   **The Protocol:** "The 30-Minute Reversal Check." Numbered steps with Go/No-Go criteria.
      *   **Case Study 1 (Vax):** Walk through the protocol.
      *   **Case Study 2 (ER):** Walk through the protocol (the hard truth).
      *   **Failure Modes:** Where this breaks (fishing, small N, the "truth" question).
      *   **Closing:** Encouragement.

  9.  **Refining the Tone:**
      *   Avoid academic jargon where possible (use "weights" instead of "marginal distributions").
      *   Be direct about the political risk ("This will kill the press release").
      *   Ensure the "Judgment Call" points are clear.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I give specific thresholds? *Adjustment:* Add a "Rule of Thumb" for significance since they might not have time for full CI calculations. E.g., "If the aggregate moves >5% and subgroups move <1%."
      *   *Check:* Did I address the "two-page table" constraint? *Adjustment:* Emphasize that this relies on pivot tables, not regression.
      *   *Check:* Is the ER case handled honestly? *Adjustment:* Make sure to explicitly state that claiming "efficiency improved" would be lying.

  11. **Final Polish:** Check against the prompt requirements one last time. (Procedure, Questions in order, Thresholds, Escalation points, Two Cases, Limitations). *Looks good.*

  *(Self-Correction on Case 1 Logic)*: Wait, if *every* district is down, how is the aggregate up? It must be that the districts with *higher* rates gained population share, or the districts with *lower* rates lost population share. I need to make sure the explanation reflects the *weighting* mechanism clearly.
  *(Self-Correction on Case 2 Logic)*: ER wait times are usually weighted by volume. If low-acuity (fast) patients increase in volume, the average drops even if speed per tier stays same. This is composition bias.

  12. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a high-stakes, low-resource reality for public health stats. You are acting as the institutional conscience against *aggregation bias*. You don't need a lecture on causal graphs; you need a tripwire system.

  Below is **The 30-Minute Reversal Check**. It is designed to be run on a pivot table with a cup of coffee. It prioritizes detecting *directional reversals* (Simpson's Paradox) over precise estimation.

  ### The Protocol: 30-Minute Reversal Check

  **Trigger:** Any aggregate statistic (mean, rate, proportion) intended for external release (press, board, public dashboard) that shows a positive/negative trend.

  **Step 1: The "A Priori" Split (5 Minutes)**
  *   **Action:** Identify the standard administrative partitions already collected in your dataset.
  *   **Question:** What are the 1–3 standard ways we *always* slice this data for internal reports? (e.g., School District, Race/Ethnicity, Triage Acuity, Facility).
  *   **Constraint:** **Do not fish.** Do not create new bins to find a reversal. Only use partitions that exist in your standard metadata. If you hunt for a split that reverses, you are committing data dredging.
  *   **Pass Condition:** You have identified 1–3 standard subgroups.
  *   **Stop Rule:** If no standard subgroups exist (e.g., a novel survey with no demographics), flag as **High Risk: Unpartitionable**. Escalate to Comms that this number is "fragile."

  **Step 2: The Directional Scan (10 Minutes)**
  *   **Action:** Calculate the % change (or difference) for the Aggregate and for each Subgroup.
  *   **Question:** Do the subgroups move in the *same direction* as the aggregate?
  *   **Threshold:**
      *   **Green Light:** All subgroups move same direction as aggregate. (Proceed to Step 3).
      *   **Yellow Light:** Subgroups are flat (0% change) while aggregate moves. (Proceed to Step 4).
      *   **Red Light:** Aggregate moves UP, Subgroups move DOWN (or vice versa). **STOP.** This is a formal reversal.
  *   **Noise Filter:** Ignore subgroup changes of <1% (or your dept's minimum reporting threshold) unless the aggregate change is massive (>10%). Small noise in subgroups shouldn't veto a clear aggregate signal unless *all* subgroups contradict.

  **Step 3: The Weight Check (10 Minutes)**
  *   **Action:** Look at the denominators (N) for the subgroups in Time A vs. Time B.
  *   **Question:** Did the *mix* of the population change?
  *   **Mechanism:**
      *   *Scenario A:* Did the high-performing subgroups grow larger? (e.g., Districts with high vax rates got more students).
      *   *Scenario B:* Did the low-performing subgroups shrink?
  *   **Pass Condition:** If the aggregate moved because the *rates* improved, you are safe. If the aggregate moved because the *weights* shifted (composition change), you have a "Composition Effect."
  *   **Judgment Call:** If it is a Composition Effect, you cannot claim "Performance Improved." You can only claim "Population Average Improved." **Escalate.**

  **Step 4: The "So What" Decision (5 Minutes)**
  *   **Action:** Draft the claim.
  *   **Question:** If we publish the aggregate without the subgroup context, would a stakeholder in the worst-performing subgroup be rightfully angry?
  *   **Decision Matrix:**
      *   **Clear to Publish:** Directions match, weights stable.
      *   **Qualify:** Directions match, but one major subgroup is lagging significantly. (Add footnote).
      *   **Kill/Reframe:** Directional Reversal (Red Light in Step 2) OR Pure Composition Effect (Step 3). You must change the claim from "We did better" to "The average changed."

  ---

  ### Case Run-Through 1: Teen Vaccination Coverage
  **The Claim:** "Countywide teen vaccination coverage rose 2% this year."
  **The Data:** Aggregate = +2%. School Districts (A, B, C, D) = All -1% to -3%.

  **Running the Protocol:**
  1.  **Split:** School Districts (Standard admin partition). **Pass.**
  2.  **Direction:** Aggregate UP, Subgroups DOWN. **RED LIGHT.** Stop.
  3.  **Weight Check:** You look at enrollment numbers. District A (historically 90% vax) grew enrollment by 20%. District B (historically 50% vax) lost enrollment by 10%.
      *   *Math:* The average went up not because kids are getting vaxxed, but because more kids are in the district that already vaxxes well.
  4.  **Decision:** **Kill the claim.**
      *   *Why:* If you say "coverage rose," School District B's superintendent will rightly say, "My coverage fell, and you're taking credit for a demographic shift?"
      *   *Reframe:* "Total number of vaccinated teens increased due to enrollment shifts," or simply report the raw counts. Do not use the word "Rate" or "Coverage" in the headline without a massive asterisk.
      *   *Escalation:* Hand to Health Officer. "Mathematically the average is up, but programmatically we lost ground in every jurisdiction. Publishing 'rates rose' risks credibility with school partners."

  ### Case Run-Through 2: ER Wait Times
  **The Claim:** "Average ER wait time dropped 15% this quarter."
  **The Data:** Aggregate = -15%. Acuity Tiers (1-Emergent, 2-Urgent, 3-Less Urgent) = Flat to +5%.

  **Running the Protocol:**
  1.  **Split:** Triage Acuity (Standard clinical partition). **Pass.**
  2.  **Direction:** Aggregate DOWN, Subgroups FLAT/UP. **RED LIGHT.** Stop.
  3.  **Weight Check:** Look at visit volume. Tier 3 (fast throughput) visits increased 40%. Tier 1 (slow, complex) visits decreased 20%.
      *   *Math:* You aren't seeing patients faster; you are seeing *easier* patients.
  4.  **Decision:** **Kill the claim.**
      *   *Why:* This is the honest answer that kills the press release. If you publish "Wait times fell," the public expects faster service for *their* condition. If a heart attack victim waits the same long time, your metric lied to them.
      *   *Reframe:* "Average wait time decreased reflecting a higher volume of minor acute cases."
      *   *Escalation:* This is a **Judgment Call for Leadership**. You must present the table to the Director.
      *   *Script:* "Director, the average is down, but clinical performance is flat. If we claim 'efficiency improved,' we are vulnerable if a high-acuity patient has a bad outcome. I recommend we do not release this as a performance metric."

  ---

  ### Where This Procedure Will Misfire (Limitations)

  You asked for honesty about the tool's flaws. Here is where the 30-Minute Check fails:

  **1. The "Fishing" Trap (Type I Error)**
  *   **Risk:** If you have 50 possible subgroups (zip codes, age bands, payer types) and you check all of them, one will likely reverse by random chance.
  *   **Mitigation:** Step 1 is your firewall. **Only check partitions that are operationally relevant.** If "Zip Code" isn't a standard reporting cut, don't check it. If you find a reversal in a non-standard split, treat it as a hypothesis, not a fact.

  **2. The "Small N" Noise (Type II Error)**
  *   **Risk:** A subgroup might show a reversal simply because it has 10 people in it. One extra patient flips the rate.
  *   **Mitigation:** Apply a **Minimum Cell Size Rule**. If a subgroup has <30 events (or your dept's privacy threshold), ignore its direction for the purpose of the Reversal Check. Rely on the larger subgroups.

  **3. The "Real Number" Problem (Philosophical Limit)**
  *   **Risk:** The procedure tells you *if* there is a paradox, not *which number is the truth*.
  *   **Example:** In the ER case, is the "Real" wait time the weighted average (patient experience) or the acuity-adjusted time (clinical performance)?
  *   **Limitation:** Statistics cannot answer this. It is a policy question.
      *   If the goal is **Customer Satisfaction**, the aggregate is "real" (most people waited less).
      *   If the goal is **Clinical Quality**, the stratified rates are "real" (we didn't get faster at hard cases).
  *   **Action:** This is the ultimate **Escalation Point**. You cannot decide this. You must present both numbers and force the Health Officer/Comms Director to choose which "truth" they want to sell. Document your recommendation in email.

  **4. Continuous Confounders**
  *   **Risk:** Sometimes the confounder isn't a category (like District) but a continuous variable (like Age). Binning age into "0-10, 11-20" might hide the reversal.
  *   **Limitation:** This procedure relies on tables, not regression. It will miss smooth gradients.
  *   **Mitigation:** If you suspect age is the driver, use standard broad bands (Pediatric, Adult, Geriatric). If the reversal hides inside those, you need more than 30 minutes. Flag as **"Requires Deep Dive."**

  ### Summary Checklist for Your Desk

  1.  **Claim:** \_\_\_\_\_\_\_\_\_\_
  2.  **Standard Splits:** \_\_\_\_\_\_\_\_\_\_ (Must be pre-existing)
  3.  **Direction Match?** [ ] Yes [ ] No (If No, STOP)
  4.  **Weight Shift?** [ ] Yes [ ] No (If Yes, "Composition Effect")
  5.  **Decision:** [ ] Publish [ ] Qualify [ ] Kill
  6.  **Escalation:** If "Kill" or "Composition Effect," email Director with subject line: **"Statistical Warning on [Metric] Claim."**

  This protects you. It shows you did the due diligence, it protects the department from embarrassment, and it forces the political decision onto the people who get paid to make political decisions.
