answer: |-
  This is a classic "rationalist-adjacent" dispute: a clash between formal definitions, empirical claims, and philosophical implications. Your interlocutor is roughly 60% right on the technical definitions, but 90% wrong on the implications and the current state of the field. He is correctly identifying a philosophical vulnerability (the tautology risk) but incorrectly treating it as a fatal refutation rather than a modeling constraint.

  Here is the piece-by-piece breakdown of his argument, followed by the specific analysis of the circularity objection and the motte-and-bailey structure.

  ### Piece-by-Piece Analysis

  **1. "Revealed preference is Samuelson's idea that if you pick A when B was affordable, you've revealed you prefer A over B."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the standard definition of Weak Axiom of Revealed Preference (WARP). Samuelson wanted to purge economics of "psychologism" (unobservable mental states like 'satisfaction'). He wanted to ground demand theory strictly in observable prices and quantities. Your interlocutor understands the mechanism correctly.

  **2. "Utility is then just defined as whatever you turn out to maximize, so the whole thing is circular."**
  *   **Verdict:** **Technically true but misleading.**
  *   **Analysis:** In modern microeconomics, we usually work backwards: we assume preferences exist and satisfy certain axioms, *then* we prove a utility function exists that represents those preferences. However, since we can't see preferences, we infer them from choices. So yes, utility is a mathematical representation of choices.
  *   **The Conflation:** He is conflating *definition* with *prediction*. Just because a term is defined by the data doesn't mean the theory using that term can't be wrong. (See point 3).

  **3. "By construction you always maximize your utility, since any action counts as maximizing it, which is why the theory can't be tested and can never be wrong."**
  *   **Verdict:** **False.**
  *   **Analysis:** This is the critical error. Revealed Preference Theory is **not** compatible with *any* pattern of choices. It requires choices to be **consistent** (transitive, complete, etc.).
      *   If you choose A over B, B over C, but then C over A (intransitivity), Revealed Preference Theory says **you do not have a well-defined utility function.**
      *   Therefore, the theory *is* falsifiable. If an agent systematically violates transitivity or the Weak/Strong Axioms of Revealed Preference, the model rejects the hypothesis that the agent is a utility maximizer.
      *   The theory does not say "whatever you do is utility maximizing." It says "whatever you do *must fit a consistent pattern* to be described as utility maximizing."

  **4. "Behavioral economics refuted it anyway once it showed people's choices are systematically inconsistent."**
  *   **Verdict:** **Partially True, but oversold.**
  *   **Analysis:** Behavioral economics (BE) did show that humans violate RPT axioms (e.g., framing effects, endowment effects, preference reversals).
  *   **The Nuance:** BE refuted the *empirical claim* that "humans generally satisfy RPT axioms." It did not refute the *logical framework* of RPT. Economists still use the framework; they just add error terms, bounded rationality constraints, or modified utility functions (e.g., prospect theory) to account for the inconsistencies. The core language of "maximization subject to constraints" remains the lingua franca, even if the "rationality" assumption is relaxed.

  **5. "Nobody takes it seriously anymore."**
  *   **Verdict:** **False.**
  *   **Analysis:** It is still the foundational baseline of microeconomics, game theory, and finance. It is treated as a "null hypothesis." You assume agents are rational maximizers unless you have a specific reason (and data) to model them otherwise. Dismissing it as "nobody takes it seriously" is a massive overstatement of the BE revolution's impact on mainstream methodology.

  **6. "Which means when economists say people act to maximize utility they're just saying people do what they do."**
  *   **Verdict:** **The Invalid Conclusion.**
  *   **Analysis:** Because premise #3 was false (the theory *is* testable), this conclusion does not follow. Economists are saying "people act *as if* they are maximizing a consistent function," which is a claim that can be proven wrong (and often is, by BE). It is not a tautology; it is an approximation that is often useful but known to be imperfect.

  ---

  ### The Circularity Objection: Valid vs. Invalid Versions

  You asked for the version of the circularity worry that lands versus the one that doesn't. This is the crux of the philosophical dispute.

  **The Version That Doesn't Land (The Interlocutor's Version):**
  *   **Argument:** "Since utility is defined by choice, any choice confirms the theory. Therefore it is unfalsifiable."
  *   **Why it fails:** As noted above, RPT imposes **axioms** (transitivity, completeness, continuity). If I choose A > B today, and B > A tomorrow under identical conditions, I have violated the axioms. The theory can now say, "This agent cannot be modeled as a utility maximizer." That is a falsification. The definition of utility is not "whatever you do," it is "whatever function can consistently map your choices." If no such function exists, you aren't maximizing utility.

  **The Version That Does Land (The "Empty Explanation" Critique):**
  *   **Argument:** "Even if the theory is technically falsifiable via axioms, it offers no *mechanism*. If I observe you choosing broccoli over cake, RPT says 'you prefer broccoli.' If I ask 'why?', RPT says 'because you chose it.' It explains nothing about the internal causal structure (hunger, health goals, taste)."
  *   **Why it lands:** This is a valid critique of RPT as a *psychological* theory. It is deliberately agnostic about mental states. It predicts behavior without explaining *cause*. If your goal is to understand human psychology, RPT is indeed circular/empty. If your goal is to predict market demand, it is highly effective.
  *   **Standard Response:** Economists generally accept this. They adopt an **instrumentalist** stance (associated with Milton Friedman). The goal of the theory is not to be "true" about mental states, but to generate accurate predictions about aggregate behavior. The "circularity" is a feature, not a bug, because it allows the model to work regardless of *why* people want what they want.

  ### The Motte-and-Bailey Structure

  You suspected a motte-and-bailey, and you are correct.

  *   **The Motte (Defensible Position):** "Utility functions are mathematical representations of ordinal preferences derived from observed choices. If choices are inconsistent, no utility function exists. Behavioral economics has shown humans are not perfectly consistent."
      *   *Status:* True. Standard econ accepts this.
  *   **The Bailey (Exaggerated Position):** "Therefore, the concept of utility maximization is a tautological sham that can never be wrong, has been completely refuted by behavioral econ, and is useless for understanding human action or morality."
      *   *Status:* False. The theory is testable (via axioms), it is still widely used (as a baseline), and it applies to positive economics, not necessarily normative ethics.

  ### The Utilitarianism Disconnect

  There is a category error in your meetup argument that is worth noting. The argument drifted to **Utilitarianism** (a normative ethical theory: "you *ought* to maximize total welfare"), but the interlocutor attacked it using **Revealed Preference** (a positive economic theory: "people *do* maximize their own preferences").

  *   **Normative Utilitarianism** cares about *cardinal* utility (magnitude of happiness/suffering) and interpersonal comparisons.
  *   **Revealed Preference** deals with *ordinal* utility (ranking) and explicitly rejects interpersonal comparisons.

  The interlocutor used the weaknesses of *Positive Rational Choice Theory* to dismiss *Normative Utilitarianism*. Even if RPT were a tautology (it isn't), that doesn't necessarily refute Utilitarianism, because Utilitarianism usually posits an objective metric of "good" (e.g., hedonic states) that exists independently of whether people reveal preferences for it. (e.g., A drug addict reveals a preference for drugs; a utilitarian might say this does not maximize their actual well-being).

  ### Summary Verdict

  Your interlocutor's summary is **unfair**.

  1.  **Fair:** RPT defines utility via choice rather than mental states.
  2.  **Fair:** Humans violate RPT axioms (Behavioral Econ finding).
  3.  **Unfair:** Claiming RPT is unfalsifiable/tautological (it is falsified by intransitivity).
  4.  **Unfair:** Claiming "nobody takes it seriously" (it remains the standard modeling language).
  5.  **Unfair:** Using a positive economic critique to dismiss a normative ethical framework without bridging the is-ought gap.

  **The Steelman:** The strongest version of his argument is: *"Because utility is defined by choice, Rational Choice Theory cannot distinguish between 'rational' and 'irrational' desires, only consistent and inconsistent ones. Since humans are often inconsistent, the model is a poor description of reality, and we should stop treating 'maximizing utility' as a deep truth about human nature."*

  Most economists would agree with that Steelman. They would disagree with the claim that the theory is therefore useless or logically bankrupt. It is a map, not the territory; the map has known distortions, but it is still the best one we have for navigating large-scale economic interactions.
