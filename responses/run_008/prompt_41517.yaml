  Retired chemist here — spent 35 years in the lab and only got into philosophy recently, so apologies if this is a naive question. I've been reading about the problem of induction and Goodman's grue thing, and honestly it kind of bugs me: every example is emeralds, and nobody in real life has ever made an inductive generalization about emeralds. Give me an actual example of a grue-type problem from science or everyday life — a situation where all the observations so far fit two hypotheses equally well, but they make opposite predictions about the very next case, and nothing in the data itself breaks the tie. Don't make the grue-like hypothesis an obvious word-game either; I want it familar enough that I can see why this is a genuine problem and not just a philosopher's parlor trick. And then tell me what does end up breaking the tie in your example, if anything actually does.
reasoning: |-
