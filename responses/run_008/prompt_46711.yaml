  The tension in your list is familiar to anyone who has wrestled with the boundary of biology: you have entities that metabolize but aren't alive (RBCs), entities that don't metabolize but are alive (seeds), and entities that replicate but aren't alive (viruses/code). The standard "metabolism-first" or "replication-first" accounts fail because they treat these features as binary switches rather than modal properties grounded in history and structure.

  The best candidate to capture your intuitions is a **Dispositional Lineage Autonomy** principle. It shifts the focus from what an entity is *doing* right now to what it is *capable of doing* based on its intrinsic structure and its history. It treats life as a mode of existence maintained by a specific kind of causal power—one that is intrinsic, material, and historically grounded.

  ### The Principle: Dispositional Lineage Autonomy

  **A material particular is alive if and only if it maintains or retains the intrinsic disposition to sustain a self-bounded autopoietic organization, provided it is not merely a proper functional part of a larger living organism and does not depend on hijacking the core reproductive machinery of a distinct living host to persist.**

  Here is how the clauses map to your cases:

  1.  **"Material particular..."**
      *   **Motivating Case:** *Self-replicating computer program.*
      *   **Work:** Excludes abstract or silicon-based patterns. Life requires a specific chemical substrate capable of thermodynamic work. This saves your verdict that code is not alive, even if it replicates.
  2.  **"...maintains or retains the intrinsic disposition to sustain..."**
      *   **Motivating Case:** *Desiccated seed / Frozen bacterium.*
      *   **Work:** This handles dormancy. The seed isn't metabolizing, but it has the *intrinsic disposition* to resume doing so given standard environmental relief (water). Contrast this with the virus, which lacks the *intrinsic* disposition because it requires a host's machinery, not just environmental relief.
  3.  **"...a self-bounded autopoietic organization..."**
      *   **Motivating Case:** *Prions / Red blood cell.*
      *   **Work:** Prions fold but don't maintain a boundary or internal organization. RBCs maintain a boundary and metabolize, but they cannot *produce* themselves (no nucleus/DNA). They are metabolizing fragments, not autopoietic systems. This explains why the RBC verdict bothers students (it looks active) but remains "not alive" (it's a dead-end machine).
  4.  **"...provided it is not merely a proper functional part of a larger living organism..."**
      *   **Motivating Case:** *Red blood cell / HeLa cells.*
      *   **Work:** This excludes the RBC (it's a part of the human). It creates a nuanced space for HeLa cells: they are alive (they are autopoietic), but your intuition that they are "life but not a life" is captured here—they are living *material*, but perhaps not living *individuals* in the organismic sense.
  5.  **"...and does not depend on hijacking the core reproductive machinery of a distinct living host to persist."**
      *   **Motivating Case:** *Viruses / Mimivirus.*
      *   **Work:** This is the virus killer. A virus has the blueprint but lacks the factory. It must hijack a host's ribosomes and polymerases. A seed or frozen bacterium only needs abiotic inputs (heat, water). This clause keeps the virus out without relying on "current metabolism," and it forces a decision on the Mimivirus. Even with translation genes, if it still requires a host cell to replicate, it is hijacking, not autonomous.

  ### Novel Case Predictions

  To test the robustness of this principle, here are three weirder cases it predicts:

  1.  **Xenobots (Reprogrammed Frog Skin Cells):** Clumps of somatic cells arranged to move and replicate kinematically.
      *   **Prediction:** *Alive (with caveats).* They are material, autopoietic (in a loose sense), and not hijacking a host. However, the "proper part" clause is tricky. Since they are derived from somatic cells, the principle might classify them as "living tissue" rather than "living organisms."
      *   **Confidence:** Medium.
  2.  **Isolated Mitochondria in a Nutrient Bath:** Mitochondria have DNA, metabolize, and divide, but only within a cell.
      *   **Prediction:** *Not Alive.* They fail the "intrinsic disposition" test because they cannot survive or replicate outside the host cell's broader regulatory environment; they are obligate proper parts.
      *   **Confidence:** High.
  3.  **A "Resurrected" Organism from Ancient DNA (De-extinction):** A mammoth cloned using an elephant surrogate.
      *   **Prediction:** *Alive.* The synthetic/clone embryo is a material particular with the disposition to sustain autopoiesis. The use of a surrogate is gestation, not the hijacking of *replicative machinery* (the embryo replicates its own cells; the surrogate just houses it).
      *   **Confidence:** High.

  ### Clashes and Resolutions

  No principle is without friction. Here is where your intuitions and the principle diverge, and how to handle it.

  | Case | Your Call | Principle Call | Resolution |
  | :--- | :--- | :--- | :--- |
  | **Mimivirus** | Undecided (Tempted to say Alive) | Not Alive | **Overturn Verdict** |
  | **HeLa Cells** | Alive ("but not a life") | Alive | **Amend Principle** |

  **On the Mimivirus:** You admitted that "closeness isn't a reason." The principle forces a hard line: if it needs a host's ribosomes, it's not autonomous. It is cheaper to accept the "Not Alive" verdict than to complicate the principle to allow "partial autonomy," which would risk letting standard viruses back in.

  **On HeLa Cells:** Your distinction between "life" (mass noun) and "a life" (count noun) is philosophically sound but biologically blurred by this principle. The principle calls them alive, which matches your primary verdict, but fails to capture the lack of *individuality*. It is cheaper to **amend the principle** to distinguish between *Living Systems* (HeLa, RBCs, Organisms) and *Living Individuals* (Organisms, maybe Slime Molds) than to deny HeLa cells are alive.

  ### Bottom Line

  The **Dispositional Lineage Autonomy** principle saves almost all your settled verdicts by shifting the criterion from *activity* (metabolism) to *capacity grounded in history* (lineage/autonomy). It resolves the RBC/Virus symmetry by distinguishing "broken part of a whole" from "parasite of a whole." It requires you to stop wavering on the Mimivirus, but it gives you the argument you asked for: it's not about size or gene count, it's about who owns the factory.

