answer: |-
  # The Equality Diagnostic: Verdicts, Not Labels

  **Instructions:** Read each vignette below. Choose the verdict that best matches your intuition about what justice requires in that specific case. Do not worry about consistency yet; answer each case on its own terms. There are no right answers, only revealing ones.

  ### 1. The Connoisseur
  Alex joins a new social circle that glamorizes rare wines. Over time, Alex develops a genuine, refined taste for them. Ordinary wine now tastes like vinegar to Alex, causing real dissatisfaction. Alex's income is average, insufficient to maintain this new standard of enjoyment.
  *   **A.** Society should subsidize Alex's wine budget to restore Alex's previous level of satisfaction.
  *   **B.** Society should not subsidize; Alex adapted to a costly lifestyle voluntarily and must bear the cost.
  *   **C.** The question is misguided; the goal is to ensure Alex isn't excluded from the social circle, not to fund the drinking.

  ### 2. The Costly Condition
  Jordan is born with a rare metabolic disorder. Without daily treatment, Jordan suffers severe pain and early death. The treatment costs 40% of an average lifetime income.
  *   **A.** Society must cover the full cost, regardless of the burden on the budget, to prevent the suffering.
  *   **B.** Society should provide insurance coverage equivalent to what an average person would have purchased behind a "veil of ignorance."
  *   **C.** Society must ensure Jordan has the *ability* to live a normal lifespan, even if it requires restructuring the pharmaceutical market.

  ### 3. The Cheap Generic
  Taylor has the same condition as Jordan, but in Taylor's region, a cheap generic version of the drug exists that fully neutralizes the symptoms.
  *   **A.** Give Taylor cash equal to the cost of the drug; what Taylor buys is their business.
  *   **B.** Ensure Taylor actually receives the drug; the goal is health, not cash.
  *   **C.** Ensure Taylor is not stigmatized as "sick" in the workplace or community.

  ### 4. The Heavy Heart
  Morgan suffers from mild, chronic depression. It is not disabling enough to qualify for disability benefits, but it drains the pleasure from every purchase Morgan makes. $100 spent by Morgan yields half the happiness $100 yields for others.
  *   **A.** Morgan should receive extra income to compensate for the reduced "purchasing power" of happiness.
  *   **B.** Morgan receives the same income as everyone else; internal states are not the state's business.
  *   **C.** Fund community mental health support so Morgan isn't left to cope alone, without framing it as compensation.

  ### 5. The Devout Worker
  Riley's faith requires observing a Sabbath that makes standard employment schedules impossible. Riley earns less than secular neighbors because of this commitment.
  *   **A.** Compensate Riley for the lost income caused by religious observance.
  *   **B.** Do not compensate; religious commitment is a voluntary choice like any other lifestyle preference.
  *   **C.** Mandate flexible scheduling laws so Riley can work without penalty; the market structure is the problem.

  ### 6. The Grass-Counter
  Casey lives a simple life counting blades of grass. Casey lacks education, travel, and political influence but reports perfect life satisfaction and wants for nothing more.
  *   **A.** Leave Casey alone; satisfaction is what matters, and Casey has enough.
  *   **B.** Transfer resources to Casey anyway; everyone deserves a robust share of societal assets, even if unused.
  *   **C.** Ensure Casey *could* access education or politics if desired, even if Casey chooses not to.

  ### 7. The Talented Surfer
  Dakota has a rare natural talent that could earn millions in advertising. Dakota chooses to surf leisurely instead, earning minimum wage.
  *   **A.** Tax Dakota based on *potential* earnings, not actual income; the talent is a common asset.
  *   **B.** Tax only actual income; Dakota owns their own time and labor.
  *   **C.** The focus should be on ensuring surfers aren't looked down upon as "lazy" by the community.

  ### 8. The Borderline
  Two citizens earn identical salaries. One lives just inside a city boundary where food and rent cost 30% more than just outside the line.
  *   **A.** Adjust the inner citizen's income to match purchasing power.
  *   **B.** No adjustment; equal income is the only measurable standard of fairness.
  *   **C.** Address the zoning and supply laws that created the price disparity in the first place.

  ### 9. The Caregiver
  Pat leaves the workforce for five years to care for an aging parent. Pat's savings are depleted, and re-entry into the job market is difficult.
  *   **A.** Provide a stipend equal to the lost wages and career progression.
  *   **B.** Provide a basic pension for all citizens regardless of work history.
  *   **C.** Recognize care work as a public contribution that grants full social standing and voting weight.

  ### 10. The Flood Victim
  Sam's house burns down due to a lightning strike (bad luck). Chris's house burns down because Chris ignored fire safety codes (bad choice). Both are homeless.
  *   **A.** Aid both equally; suffering is the same.
  *   **B.** Aid Sam fully; aid Chris minimally or with strings attached.
  *   **C.** Ensure both have immediate shelter without investigating the cause; homelessness is the indignity to be erased.

  ### 11. The Expensive Hobby
  Jordan (from Case 2) decides to spend their disposable income on high-end photography instead of savings, knowing their condition is stable. Later, a new, costly complication arises.
  *   **A.** Cover the new treatment; health needs trump past spending choices.
  *   **B.** Require Jordan to pay the marginal cost; they prioritized hobbies over security.
  *   **C.** Cover the treatment but redesign the system so no one faces such catastrophic choices.

  ### 12. The Public Shaming
  A group is systematically mocked in media and public discourse for their lifestyle, though their income and health are average.
  *   **A.** No redistribution is needed; their material metrics are equal.
  *   **B.** Fund campaigns to improve public perception of the group.
  *   **C.** Enact laws against hate speech to protect their standing as equals.

  ***

  # Scoring Key & Facilitator's Guide

  **Note to Facilitator:** This key does not produce a single "type." It maps the participant onto a conceptual space. Have participants tally their answers, then reveal the map.

  ### The Axes
  *   **Axis 1 (The Metric):** What is being equalized?
      *   **Welfare (W):** Focus on satisfaction, pain, pleasure, happiness.
      *   **Resources (R):** Focus on income, assets, means, purchasing power.
      *   **Capabilities (C):** Focus on functionings, abilities, real opportunities to do/be.
  *   **Axis 2 (The Responsibility Cut):** Does choice matter?
      *   **Sensitive (S):** Distinguishes between bad luck (compensate) and bad choice (don't compensate).
      *   **Insensitive (I):** Compensates disadvantages regardless of origin, or rejects the tracking of choice.
  *   **The Exit (Relational/Status):** Rejects the distributive framing.
      *   **Relational (X):** Focus on standing, stigma, domination, and social relations rather than dividing goods.

  ### Answer Mapping

  | Q | Vignette | Option A | Option B | Option C | Separates |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Wine | **W-I** (Welfare Insensitive) | **R-S** / **C-S** (Resp. Sensitive) | **X** (Relational) | W-I vs. S vs. X |
  | **2** | Costly Condition | **W-I** / **C-I** | **R-S** (Dworkin Insurance) | **C** (Structural) | Metric (W/C vs R) |
  | **3** | Cheap Generic | **R** (Cash) | **C** (Functioning) | **X** (Stigma) | R vs. C vs. X |
  | **4** | Depression | **W** (Happiness $) | **R** (Equal Income) | **X** (Social Support) | W vs. R vs. X |
  | **5** | Religion | **W-I** (Compensate Cost) | **R-S** (Choice) | **C** (Accommodation) | W-I vs. R-S vs. C |
  | **6** | Grass-Counter | **W** (Satisfaction) | **R** (Assets) | **C** (Opportunity) | W vs. R vs. C |
  | **7** | Surfer | **R-S** (Tax Talent) | **R-I** / **Lib** (Tax Income) | **X** (Status) | R-S vs. R-I vs. X |
  | **8** | Borderline | **W** / **R-S** (Purchasing Power) | **R-I** (Nominal Income) | **C** / **X** (Structure) | R-S vs. R-I |
  | **9** | Caregiver | **R-S** (Wage Replacement) | **R-I** (Basic Pension) | **X** (Standing) | R-S vs. R-I vs. X |
  | **10** | Flood | **W-I** (Equal Aid) | **R-S** (Luck vs Choice) | **X** (Shelter as Right) | W-I vs. R-S vs. X |
  | **11** | Expensive Hobby | **W-I** / **C-I** (Need Trumps) | **R-S** (Responsibility) | **X** (System Design) | W-I vs. R-S vs. X |
  | **12** | Shaming | **R** (No Redistribution) | **W** (Perception) | **X** (Standing/Law) | R vs. W vs. X |

  *(Key: W=Welfare, R=Resource, C=Capability, S=Responsibility Sensitive, I=Insensitive, X=Relational Exit)*

  ### Interpreting the Leaves

  1.  **The Straight Welfare View (W-I):** Predominantly **A** answers on 1, 4, 10.
      *   *View:* Justice is about minimizing suffering and maximizing satisfaction.
      *   *Proponents:* Early Utilitarians; some interpretations of Arneson.
      *   *Vulnerability:* The "Expensive Tastes" objection (Case 1).
  2.  **The Resource View (R):** Predominantly **B** answers on 2, 3, 6, 8.
      *   *View:* Justice is about fair shares of means. If you have the means, how you use them (or feel about them) is up to you.
      *   *Proponents:* Rawls (Primary Goods); Dworkin (Resources/Auction).
      *   *Vulnerability:* The "Disability" objection (Case 2/3) — equal resources don't buy equal freedom for everyone.
  3.  **The Capabilities View (C):** Predominantly **C** answers on 3, 5, 6.
      *   *View:* Justice is about what people are actually able to *do* and *be*.
      *   *Proponents:* Sen, Nussbaum.
      *   *Vulnerability:* Can be paternalistic (forcing the drug in Case 3) or vague on limits.
  4.  **The Responsibility-Sensitive View (Luck Egalitarianism) (S):** Predominantly **B** answers on 1, 5, 7, 10, 11.
      *   *View:* Inequalities due to brute luck are unjust; inequalities due to option luck (choice) are just.
      *   *Proponents:* Dworkin, Cohen, Arneson.
      *   *Vulnerability:* The "Harshness" objection (abandoning the negligent in Case 10).
  5.  **The Relational Exit (X):** Predominantly **C** answers on 1, 3, 4, 7, 9, 12.
      *   *View:* Justice is not about distributing a pie, but ensuring no one stands in a relation of domination, shame, or inferiority to another.
      *   *Proponents:* Anderson, Scheffler.
      *   *Vulnerability:* May lack specific guidance on *how much* redistribution is needed to secure standing.

  ### Diagnostic Nuances (For the Closing Discussion)

  **1. Indistinguishable Leaves:**
  *   **Resource vs. Capability (Cases 3 & 8):** In the "Cheap Generic" and "Borderline" cases, a Resource view (give cash) and a Capability view (ensure function) often yield the same verdict if markets work perfectly.
      *   *Literature Convergence:* Sen acknowledges resources are often good proxies for capabilities.
      *   *Quiz Gap:* This quiz cannot separate them if the participant assumes cash automatically buys function. To separate them, you would need a case where cash *cannot* buy the functioning (e.g., discrimination). Case 12 attempts this, but a pure Resource theorist might still say "cash is enough."
  *   **Welfare vs. Capability (Case 4):** In the "Depression" case, restoring pleasure (Welfare) and restoring mental function (Capability) look identical.
      *   *Literature Convergence:* Both agree on alleviating suffering here.
      *   *Quiz Gap:* They diverge on the "Grass-Counter" (Case 6). Welfare says "leave them be" (they are happy); Capability says "ensure they *could* do more" (even if they don't want to). Watch for participants who pick **A** on Case 4 but **B** on Case 6; they are likely Capability theorists, not Welfare.

  **2. Unoccupied or Unstable Combinations:**
  *   **Welfare + Responsibility Sensitive (The "Expensive Taste" Paradox):**
      *   *Combination:* Compensate the chronic condition (Case 2) but *also* compensate the wine taste (Case 1) because both reduce welfare.
      *   *Status:* **Unattractive.** Most welfare egalitarians (like Arneson) try to filter for "voluntary" tastes to avoid this. If a participant compensates *both* purely on suffering, they hold a "Strict Welfare" view that most literature rejects as too demanding on society and intrusive on character.
  *   **Resource + Responsibility Insensitive:**
      *   *Combination:* Give equal cash to the surfer and the worker (Case 7) *and* give equal cash to the disabled and the able-bodied (Case 2) without adjustment.
      *   *Status:* **Incoherent/Unstable.** This is "Strict Equality of Income." It is rarely defended in political philosophy because it ignores the obvious moral relevance of disability (Case 2). If a participant chooses this, ask them if they would still choose it if the disability was blindness.
  *   **Relational + Distributive:**
      *   *Combination:* Answering **C** (Relational) but then insisting on precise cash calculations for standing.
      *   *Status:* **Category Error.** The Relational view (Anderson) explicitly argues that trying to calculate "how much cash equals dignity" is part of the problem. If a participant picks Relational options but demands precise compensation amounts, they may not fully grasp the "Exit" nature of the view.

  **3. The "Luck" Cut Convergence:**
  *   Notice that **Luck Egalitarians** (Axis 2) can be found on *both* Welfare and Resource metrics.
  *   *Separation:* Look at Case 1 (Wine). A **Resource Luck Egalitarian** (Dworkin) says "No subsidy" (you chose the taste). A **Welfare Luck Egalitarian** (Cohen/Arneson) might say "Subsidize *if* the taste wasn't truly voluntary."
  *   *Quiz Limit:* This quiz groups them under "Responsibility Sensitive" (Option B) for simplicity. To separate Cohen from Dworkin, you would need a question asking: "Did Alex *really* choose the taste, or was it social conditioning?" This quiz treats that nuance as a sub-plot to the main Metric debate.

  ### Closing Note for the Facilitator
  If a participant finds themselves selecting **Option B** (Responsibility/Resource) consistently, they lean toward **Luck Egalitarianism**. If they select **Option A** (Welfare/Need) consistently, they lean toward **Strict Egalitarianism** or **Utilitarianism**. If they find themselves frustrated by the options, constantly wanting to select **Option C** (Structure/Standing), they are likely ready for the **Relational** critique.

  The goal of this session is not to lock them into a label, but to show them that their intuitions about *wine* might conflict with their intuitions about *disability*, and that political philosophy is the work of resolving that conflict.
