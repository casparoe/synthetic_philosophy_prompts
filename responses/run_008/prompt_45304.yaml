answer: |-
  You have stumbled upon one of the most significant debates in contemporary meta-ethics. Your intuition is sharp, and your rejection of the "rules with exceptions" model is philosophically sophisticated. You are describing a phenomenon that has a precise name, a major proponent, and a well-defined opposing view.

  Here is the breakdown you need for your argument.

  ### 1. The Name of Your View: **The Holism of Reasons**

  The specific configuration you are describing is called **Reason Holism** (or **Normative Holism**). It is the central pillar of the broader theory known as **Moral Particularism**.

  The philosopher most associated with this is **Jonathan Dancy**, particularly in his book *Ethics Without Principles* (2004). Dancy argues exactly what you have observed: that a feature (like "she promised" or "he was paid") does not have a fixed **valence** (direction).

  *   **Atomism (The Opposing View):** A feature carries its own normative force independently of the context. "Promising" is always a reason *for* doing the act.
  *   **Holism (Your View):** A feature's normative force is determined by the context. "Promising" can be a reason *for*, a reason *against*, or normatively neutral, depending on the "shape" of the rest of the situation.

  Your "colors in a painting" analogy is not just a metaphor; it is the standard philosophical illustration for this. A patch of grey looks dark against white but light against black. The grey hasn't changed, but its *appearance* (its normative contribution) is determined by the surrounding field.

  ### 2. The Name of Your Brother-in-Law's View: **Moral Generalism** (specifically **Valence Invariance**)

  Your brother-in-law is a **Moral Generalist**. He believes that morality is codifiable into principles that hold across cases. However, the specific claim you are fighting is the thesis of **Valence Invariance**.

  *   **Valence Invariance:** The claim that if a feature is a reason in favor of an action in one case, it must be a reason in favor (or at least not a reason against) in every other case, unless explicitly defeated.
  *   **The Lawyer's Move:** He tries to save Generalism by using **Defeasibility**. He says, "The rule is 'Keep Promises,' subject to exceptions X, Y, and Z."

  ### 3. The Crucial Distinction: Defeasibility vs. Holism

  This is where you will win the argument. You must distinguish between a rule being *overridden* and a feature *changing direction*.

  **The Brother-in-Law's Model (Defeasibility):**
  He thinks reasons work like a scale. "She promised" adds 5 points to the "Do It" side. "She was coerced" adds 10 points to the "Don't Do It" side. The promise still counts *for* the action (it still has positive weight), it's just outweighed.
  *   *Legal analogy:* A contract is valid, but unenforceable due to duress. The contract still *exists* as a contract; the law just won't back it.

  **Your Model (Holism):**
  You are arguing that in the coercion case, "She promised" does not add 5 points to the "Do It" side. It adds **zero**, or perhaps even negative points. The feature itself changes its nature.
  *   *Your Example:* The promise to the ex-boyfriend. You aren't saying the promise counts *for* moving but is outweighed by the threat. You are saying the threat makes the promise itself a reason *not* to move (because honoring it enables abuse). The feature flipped.
  *   *Your Example:* The surgeon. Being paid doesn't "subtract warmth" from the surgery in a way that needs to be balanced out. In the medical context, being paid is part of what makes the interaction *professional* rather than *charitable*. The feature "paid" functions differently in the "friendship" context vs. the "medical" context.

  **The Loophole Closure:**
  Your brother-in-law will say: "Fine, we just make the rule more specific. 'Keep promises, unless made under duress to a manipulator.'"
  **Your Counter:** This leads to an infinite regress. To define "duress," you need more context. To define "manipulator," you need more context. You cannot write a rule that includes *all* the context because the context is open-ended. As you noted, there is "no bottom layer." Dancy calls this the **Non-Codifiability of Ethics**. You cannot capture the holistic interaction of features in a finite list of linguistic rules.

  ### 4. Edge Cases and Nuance (For the Debate)

  To ensure you are bulletproof, here are the nuances a professional ethicist would raise:

  **A. Default Reasons vs. Invariant Reasons**
  Dancy (and you) do not have to claim that features are *random*. "She promised" is a **Default Reason** for doing the thing. In the absence of other information, you assume it counts *for*.
  *   *The Trap:* The Generalist will say, "Aha! So it DOES have a fixed weight normally!"
  *   *The Escape:* No. A default is not an invariant. A default is a presumption that can be **reversed**, not just silenced. In chess (your brother-in-law's model), a Pawn always moves forward. In Holism, a Pawn might move forward usually, but in a specific configuration, moving it forward is a mistake not because it's blocked, but because the *meaning* of the move has changed.

  **B. Silencing vs. Reversing**
  There are two ways a context can change a reason:
  1.  **Silencing:** The feature counts for nothing. (e.g., "I promised to help you steal a car." The promise is morally silent.)
  2.  **Reversing:** The feature counts *against*. (e.g., Your example: "I promised him I wouldn't leave him." The promise is now a reason to leave, because staying is harmful.)
  Your argument is stronger if you focus on **Reversing**. Generalists can sometimes handle Silencing (by calling it an exception). They cannot handle Reversing without making the rules absurdly complex.

  **C. The "No Bottom Layer" Argument**
  You mentioned you can't find a bottom layer of features that always count the same.
  *   *Generalist Claim:* "Pain is always bad."
  *   *Holist Counter:* "Pain in a massage? Pain in a workout? Pain in a punishment that is just?"
  *   *Generalist Retreat:* "Okay, *undeserved* pain is always bad."
  *   *Holist Counter:* "What about a masochist who consents? Or a medical procedure?"
  There is no descriptive feature (natural property) that guarantees a moral valence (normative property) without reference to the whole situation. This is the **Is-Ought Gap** applied to reasons.

  ### 5. Summary for Your Argument

  If you want to shut down the debate with precision, use this structure:

  1.  **Identify the Thesis:** "I am arguing for the **Holism of Reasons**, as defended by Jonathan Dancy. You are arguing for **Valence Invariance**."
  2.  **Define the Disagreement:** "You believe moral features are like chess pieces (fixed moves). I believe they are like colors in a painting (appearance depends on context)."
  3.  **Reject the 'Exception' Defense:** "You are trying to solve this with **Defeasibility** (rules with exceptions). But I am describing **Reversal** (features changing direction). You cannot list exceptions for a feature that flips its sign based on the whole configuration."
  4.  **The Knockout:** "If you insist on writing the rules, you must codify the entire context of every possible situation. Since context is infinite, morality is **Non-Codifiable**. Therefore, you cannot write down moral rules in the way you claim."

  ### Verdict
  You do not need a coined term; the term exists and it is robust. You are a **Reason Holist**. Your brother-in-law is a **Moral Generalist** relying on **Valence Invariance**.

  The specific phrase you are looking for to describe the phenomenon is: **The Context-Dependence of Normative Valence.**

  Use that phrase. It signals you aren't just guessing; you know the architecture of the problem.
