  7.  **Final Review against Constraints:**
      *   *Did I think before answering?* Yes, brainstormed Ross, Dancy, Generalism.
      *   *Did I check against examples?* Yes, the promise and surgeon examples map directly to Dancy's work.
      *   *Did I address the "colors in a painting" analogy?* Yes, that's a classic holism metaphor.
      *   *Did I provide the opposite view?* Yes, Generalism/Atomism.
      *   *Is it precise enough for a lawyer?* Need to ensure the distinction between *defeasibility* (exception) and *holism* (valence change) is crystal clear.

  8.  **Final Polish:** Ensure the tone is authoritative but collaborative. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to conflate "Particularism" (the claim that we don't *need* principles) with "Holism" (the claim about the *nature* of reasons). The user is describing the nature of reasons. So "Reason Holism" is the precise term, supported by Particularism. I must make this distinction clear so the brother-in-law doesn't confuse "no principles" with "reasons change shape."

  Also, I should mention **Valence Invariance** as the specific claim the brother-in-law is holding. That gives the user a specific target to attack.

