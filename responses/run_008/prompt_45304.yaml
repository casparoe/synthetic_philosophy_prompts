prompt: |-
  I've been arguing with my brother-in-law about whether you can actually write down moral rules, and I've noticed something in my own head that I can't find a word for, so I want you to act as a professional ethicist who's read everything and help me figure out if this thing has a name. Here's the thing. When I try to justify a moral judgement I've made, I point at features of the situation — she promised, he was drunk, nobody got hurt, she did it for money. And I noticed that the same feature doesn't always pull the same direction. Normally "she promised" is the whole reason she should do the thing. But my friend promised her ex, back when they were together and he was threatening to hurt himself, that she'd never move cities — and now that fact seems to point AGAINST feeling bound, not just to count for nothing. Or: someone doing you a favor because he's being paid usually makes it less warm, less of a favor, but a surgeon being paid is just... correct, it's how it should be. It's like the feature's meaning depends on whatever else is in the situation, instead of having a fixed sign.

  And here's why I don't think this is just "rules have exceptions." My brother-in-law keeps saying: fine, so the rule is "keep your promises, unless X, unless Y." But when we actually go through cases, the exceptions don't behave like a list. Sometimes "she promised under duress" removes the promise's force, sometimes (a coerced confession? a deal signed at gunpoint?) the coercion is the whole story, and sometimes a promise made under weird pressure still seems to count because of what happened after — the person relied on it for years or whatever. It feels less like a rule with carve-outs and more like the colors in a painting, where adding one new color changes what all the others look like. I can't seem to find a bottom layer of features that ALWAYS count the same way no matter what else is present. Maybe there is one and I'm just not seeing it, but I've tried.

  So: is there an established name for this exact configuration — where the reasons seem to get their direction from the whole setup rather than each carrying their own? If there is, tell me what it's called, and also what the nearest neighbor concepts are and how they differ, because I want the precise version, not just a label. If nothing fits exactly, I'd rather you said so and coined a term with a definition and some edge cases than just slapped the closest famous name on it. Please actually think before answering — maybe brainstorm a few candidate concepts first and check each one against my examples — because my brother-in-law is a lawyer and he WILL find the loophole. Also if theres a name for the opposite view (that features do carry fixed weight, like chess pieces) I'd like that too, since that seems to be what he actually believes and it would help to know what I'm arguing against.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** Is there a specific philosophical term for the phenomenon where moral features (reasons) change their normative direction or weight depending on the context, rather than having a fixed valence?
      *   **User's Observation:** Features like "she promised" or "he was paid" don't always count *for* an action. Sometimes they count *against*, or their significance shifts entirely based on the holistic configuration of the situation (like colors in a painting).
      *   **Constraint 1:** The user rejects the "rules with exceptions" model (prima facie duties with defeaters). They argue the exceptions aren't listable; the interaction is holistic.
      *   **Constraint 2:** Act as a professional ethicist who has read everything.
      *   **Constraint 3:** Think before answering (brainstorm candidates, check against examples).
      *   **Constraint 4:** If no exact term exists, coin one with a definition.
      *   **Constraint 5:** Identify the opposing view (fixed weight features).
      *   **Tone:** Precise, rigorous, ready for a debate with a lawyer.

  2.  **Brainstorming Candidate Concepts:**

      *   *Candidate 1: Prima Facie Duties (W.D. Ross).*
          *   *Idea:* Duties like fidelity, reparation, gratitude are binding unless overridden.
          *   *Check:* The user explicitly rejects this ("rules have exceptions"). Ross implies a default direction (always *for* keeping promises) unless defeated. The user says "she promised" can count *against*. Ross doesn't quite fit the holistic "color in a painting" analogy.
      *   *Candidate 2: Moral Particularism (Jonathan Dancy).*
          *   *Idea:* Moral reasons are context-dependent. A feature can be a reason in one case and not in another, or even a reason against. No codifiable principles.
          *   *Check:* This fits the "colors in a painting" analogy perfectly. Dancy talks about "holism of reasons." He explicitly argues against "atomism" (features having fixed valence).
      *   *Candidate 3: Moral Holism.*
          *   *Idea:* Often used interchangeably with particularism, but sometimes refers to the metaphysical status of moral properties supervening on natural properties.
          *   *Check:* Need to distinguish between "Holism of Reasons" (Dancy) and general moral holism.
      *   *Candidate 4: Defeasibility.*
          *   *Idea:* Rules hold until defeated.
          *   *Check:* User rejects this. Defeasibility implies a default positive/negative weight. The user describes *reversal* of valence, not just silencing.
      *   *Candidate 5: Thick Ethical Concepts.*
          *   *Idea:* Concepts like "cruel" or "brave" combine description and evaluation.
          *   *Check:* Relevant, but not the structural point about *reasons* changing direction.
      *   *Candidate 6: Non-Codifiability.*
          *   *Idea:* Ethics cannot be written down in a code.
          *   *Check:* This is the conclusion, not the name of the phenomenon regarding reasons.

  3.  **Evaluating the Best Fit: Moral Particularism (specifically Reason Holism).**
      *   *Proponent:* Jonathan Dancy (*Ethics Without Principles*).
      *   *Key Term:* **Holism of Reasons** (or Normative Holism).
      *   *Key Distinction:* Atomism vs. Holism.
      *   *User's Example:* "She promised."
          *   *Atomist:* Always a reason *for*.
          *   *Holist:* Can be a reason *for*, *against*, or neutral depending on context (e.g., promised under duress to a manipulator).
      *   *User's Example:* "Being paid."
          *   *Atomist:* Always reduces moral worth (Kantian-ish) or is neutral.
          *   *Holist:* Reduces warmth in friendship, but is requisite/neutral in professional surgery.
      *   *Fit:* This matches the user's description almost exactly. The "colors in a painting" analogy is practically a quote from Dancy or his interpreters.

  4.  **Identifying the Opposing View:**
      *   *Term:* **Moral Generalism** (or Moral Atomism / Principlism).
      *   *Key Idea:* Moral principles are codifiable. Features have invariant valence (always count for or against).
      *   *Lawyer's Perspective:* Lawyers love Generalism (precedent, rules). They try to list exceptions (defeasibility). The user is arguing that the exceptions aren't listable.

  5.  **Refining the Distinction (The "Loophole" Check):**
      *   *Potential Loophole:* A Generalist might say, "Okay, we just make the principle more specific." (e.g., "Keep promises *unless* made under duress to a manipulator...").
      *   *Counter:* Dancy argues this leads to an infinite regress. You can't specify the context fully in the principle because the context *itself* relies on further context. This is the "no bottom layer" point the user made.
      *   *Terminology Check:* Is it just "Particularism"? Particularism is the broader thesis that principles aren't necessary. "Holism of Reasons" is the specific mechanism *why* particularism is true. The user asked for the name of the *configuration* where reasons get direction from the whole. That is **Reason Holism**.

  6.  **Drafting the Response:**
      *   **Acknowledge the insight:** Validate that this is a deep, recognized philosophical problem.
      *   **Primary Term:** **The Holism of Reasons** (associated with **Moral Particularism**).
      *   **Key Philosopher:** Jonathan Dancy.
      *   **Explanation:** Explain how it differs from "rules with exceptions" (Defeasibility). Use the "silencing" vs. "reversing" distinction.
      *   **The Opposing View:** **Moral Generalism** (or Atomism of Reasons). Explain the "valence invariance" claim.
      *   **Nuance/Edge Cases:** Discuss "Default Reasons" (Dancy admits some features *usually* count one way, but not *necessarily*). This prevents the brother-in-law from saying "So nothing ever matters?"
      *   **Coining (if needed):** The concepts exist, but I need to make sure the definitions are sharp enough for a legal debate. I will stick to the established terms but define them rigorously. *Self-Correction:* The user said "If nothing fits exactly... coin a term." Since Dancy's "Holism of Reasons" fits extremely well, I should use that but perhaps clarify if there's a gap. Actually, Dancy's view is the exact fit. I will present it as the established term but clarify the specific sub-thesis.
      *   **Structure:**
          1.  Direct Answer (The Name).
          2.  The Opposing View (The Brother-in-Law's View).
          3.  The Crucial Distinction (Defeasibility vs. Holism).
          4.  Why the Lawyer's Loophole Fails (The "No Bottom Layer" argument).
