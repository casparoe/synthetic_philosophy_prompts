  2.  **Analyze the Exam Question:**
      *   **Core Issue:** Mencius (Nature = Good) vs. Xunzi (Nature = Bad).
      *   **The Tension:** Both agree virtue needs cultivation (Mencius: can be lost/neglected; Xunzi: anyone can become a sage).
      *   **The Thesis to Evaluate:** "The two disagree mainly about the word *xing* (nature) rather than about human beings." (Often associated with A.C. Graham or similar scholarship).
      *   **Requirement:** Defend OR Attack this conclusion.
      *   **Requirement:** Draw on at least one argument from *each* thinker.

  3.  **Analyze the Student Response:**
      *   **Thesis:** Defends the conclusion (disagreement is largely verbal).
      *   **Mencius Section:**
