prompt: |-
  I serve on the release review board of a mid-sized AI lab, and I want a decision procedure we can actually run in a single two-hour meeting. Some background so the procedure fits our situation: candidate releases come to the board roughly twice a quarter — a new base model, an API-only release, an open-weights release, or a decision about whether to allow a third party's derivative of something we already released. We have two weeks per decision, a standing membership of six (two engineers, two policy staff, one security lead, one outside member), and escalation to the CEO only when we deadlock. Our recurring argument is always the same unstructured fight: the openness side says releasing weights lets the world inspect, harden, and build on the model, and that keeping it closed concentrates power in whoever can afford training compute; the caution side says an open-weights release is irreversible, hands capability to anyone regardless of intent, and can't be recalled the way an API can be throttled or withdrawn. Both sides are gesturing at real considerations — dual use, security through transparency, differential progress, the freerider problem, irreversibility — but we never convert them into questions we can actually answer in a meeting.

  Please write the procedure. Specifically:

  1. An ordered list of questions the board works through, one at a time, with for each: (a) what would count as a sufficient answer, given that our evidence is usually capability evals, threat-modeling exercises, and comparisons to models already public — not perfect information; (b) which consideration from the underlying debate the question is operationalizing, so members can see why it's on the list; (c) an explicit stop condition that yields "do not release open weights" (or "API only," if that's the intermediate verdict your procedure needs).

  2. Marked points where the question is not an empirical one but a values question — where no eval could settle it and the procedure must hand off to an explicit vote, with the vote recorded as a vote rather than dressed up as a finding.

  3. Rules for the three structural situations the procedure must handle beyond a simple new-model decision: a fine-tune of a model we already released (including ones we didn't authorize), the case where the weights have already leaked or a comparable model is openly available from elsewhere, and the case where a capability sits just under one of our internal thresholds, where the caution side says "just under means under, that's why we set thresholds" and the openness side says that reading makes the threshold do all the work.

  4. Worked applications to three cases: (a) a 7-billion-parameter model fine-tuned for coding, whose capability evals come in around the median of models already openly available; (b) a frontier multimodal model whose biology-related evals landed just below our internal release threshold, with the evaluation team noting the margin is within the evals' noise; (c) an unauthorized third-party fine-tune, with our safety training visibly stripped out, of a model we open-weighted last year. For each, walk the procedure through to a verdict and note where the board would have had to vote.

  5. Honesty requirements: identify at least one point where the procedure yields a verdict I won't like — I sit on the openness side of our internal argument — and say so plainly; and state what the procedure cannot do at all, including the kinds of cases where it will misfire or merely launder the majority's priors into an official-looking flowchart.

  I want the result usable by people who have never read anything in the open-release debate, so keep whatever distinctions actually matter for the decisions and drop the ones that only matter in seminars — but tell me which distinctions you dropped, in case one of them turns out to be doing hidden work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Member of a release review board at a mid-sized AI lab.
      *   **Goal:** A decision procedure runnable in a single two-hour meeting.
      *   **Context:**
          *   Frequency: ~2x per quarter.
          *   Types: Base model, API-only, Open-weights, 3rd party derivative.
          *   Timeline: 2 weeks per decision (procedure is for the final meeting).
          *   Membership: 6 people (2 Eng, 2 Policy, 1 Security, 1 Outside).
          *   Escalation: CEO on deadlock.
          *   Core Conflict: Openness (inspection, decentralization) vs. Caution (irreversibility, dual-use).
          *   Problem: Unstructured fights, concepts not operationalized.
      *   **Requirements:**
          1.  Ordered list of questions (Answer criteria, Operationalized consideration, Stop condition).
          2.  Marked values questions (requiring explicit vote, not empirical dressing).
          3.  Rules for structural situations (Fine-tunes, Leaks/Availability, Threshold Edge Cases).
          4.  Worked applications (3 specific cases).
          5.  Honesty requirements (Admit where the procedure might yield an unwanted verdict for the user, and limitations).
          6.  Tone/Style: Usable by non-experts, drop seminar distinctions but list dropped ones.

  2.  **Deconstruct the Core Conflict & Constraints:**

      *   *Time:* 2 hours is tight. The procedure must be decisive. No endless deliberation.
      *   *Evidence:* Capability evals, threat models, comparisons. Not perfect.
      *   *Dynamic:* Openness vs. Caution. The procedure needs to balance these without getting stuck in philosophy.
      *   *Decision:* Binary (Open vs. API) or Ternary (Open vs. API vs. No Release). The prompt implies "Do not release open weights" or "API only" as stop conditions. Let's aim for a default of API unless Open is cleared, to manage risk within the time limit.
      *   *Values:* Some things *cannot* be measured (e.g., "Is decentralization worth the risk?"). These need votes.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Phase 1: Triage & Context.* Before diving into capabilities, check the structural rules (Requirement 3). Is this a leak? A fine-tune?
      *   *Phase 2: Capability & Risk.* The meat of the debate. Use the "Threshold" concept but handle the "edge case" problem.
      *   *Phase 3: Mitigation & Irreversibility.* Can we fix it if it goes wrong? (API can throttle, weights can't).
      *   *Phase 4: Values Vote.* If risks are acceptable but not zero, is the *benefit* of openness worth it?
      *   *Phase 5: Final Verdict.*

      *Refining the Questions:*
      *   Need to make sure "Sufficient Answer" is concrete.
      *   Need to mark "Values Questions" clearly.
      *   Need Stop Conditions to save time.

      *Addressing Requirement 3 (Structural Situations):*
      *   *Fine-tunes:* Inherit base risk + delta risk.
      *   *Leaks/Availability:* If it's already out, openness is moot on risk, shifts to reputation/alignment.
      *   *Threshold Edges:* Need a "Margin of Error" rule. If within noise, treat as *at* threshold.

      *Addressing Requirement 5 (Honesty):*
      *   I need to acknowledge that a risk-averse procedure will frustrate an "Openness" advocate. The default should probably be "API unless proven safe enough for Open." This biases against the user's stated position. I must admit this.
      *   Limitations: It can't predict emergent behavior. It can't solve value disagreements, only force them into votes.

  4.  **Developing the Content - Section by Section:**

      *   **Introduction:** Set the stage. 2 hours. 6 people.
      *   **The Procedure (The "Gates"):**
          *   Gate 0: Pre-work (assumed done in the 2 weeks).
          *   Gate 1: Structural Context (The 3 special cases).
          *   Gate 2: The Capability Threshold (Empirical).
          *   Gate 3: The Irreversibility Test (Empirical/Strategic).
          *   Gate 4: The Values Vote (Normative).
      *   **Structural Rules:** Explicitly define how to handle fine-tunes, leaks, and thresholds.
      *   **Worked Examples:** Walk through the three scenarios provided.
      *   **Honesty & Limitations:** Crucial section.

  5.  **Refining the "Openness vs. Caution" Tension:**

      *   The user is on the Openness side. A robust safety procedure will inherently make Openness harder to justify because Openness adds risk (irreversibility) without necessarily adding immediate capability (API also provides capability).
      *   *Correction:* Openness adds *ecosystem* capability (hardening, inspection). The procedure needs to weigh *that* benefit against the *risk*.
      *   *Decision:* I will structure it so that API is the "Safe Default." To go Open, you must clear safety *and* win a values vote on the benefit of openness. This honestly reflects the risk asymmetry.

  6.  **Drafting the Questions (Mental Check against 2-hour limit):**

      *   Q1: Structural Status. (15 mins)
      *   Q2: Capability Threshold. (30 mins)
      *   Q3: Mitigation/Recall. (30 mins)
      *   Q4: Values/Benefit. (30 mins)
      *   Q5: Final Vote/Documentation. (15 mins)
      *   Total: 2 hours. Fits.

  7.  **Addressing Specific Prompt Requirements:**

      *   *Stop Conditions:* Must be clear. "If No -> API/No Release."
      *   *Values Markers:* Use [VOTE] tags.
      *   *Dropped Distinctions:* Need a list (e.g., "Dual-use vs. Misuse," "Intent vs. Capability").
      *   *Honesty:* Explicitly state that this procedure makes Openness harder than API.

  8.  **Writing the Worked Examples:**

      *   *Case A (7B Coding):* Median capability. Likely passes threshold. Irreversibility low (coding isn't bio). Values vote on whether open weights help coding ecosystem. Verdict: Open.
      *   *Case B (Frontier Bio):* Just below threshold, within noise. Rule: Treat as *at* threshold. Fails Capability Gate. Verdict: API/No Release. (This will annoy the user, good for Honesty section).
      *   *Case C (Stripped Fine-tune):* Base was open. This is unauthorized. Risk is already realized (weights out). Decision is about *endorsement*. Verdict: Condemn/Do not endorse (API if they want access via us, but weights are already out). *Correction:* The prompt asks about *our* release decision. If weights are already out via 3rd party, do *we* release officially? Usually no, to avoid legitimizing the stripped version. Or yes, to provide a safe alternative? Let's argue for "Do not release official weights, maintain API only" to distance from the unsafe version.

  9.  **Review against Constraints:**

      *   *Mid-sized lab:* Don't assume massive red-teaming budgets.
      *   *6 Members:* Voting mechanics need to be clear (Majority? Consensus? Prompt says CEO on deadlock, implies majority rule normally).
      *   *Tone:* Professional, procedural, direct.

  10. **Final Polish:** Check the "Honesty" section. Ensure I explicitly tell the user (Openness advocate) where this procedure hurts their position. (It hurts them on the "Margin of Error" rule and the "Default to API" stance).

      *(Self-Correction during drafting)*: Make sure the distinction between "API Only" and "No Release" is clear. The prompt asks for "Do not release open weights" or "API only". I will treat "No Release" as a subset of "Not Open Weights" (i.e., if API is too risky, don't release at all). But for the purpose of the Open vs. API debate, the binary is Open vs. Restricted (API/None). I will focus the procedure on Open vs. Restricted.

      *Wait, one nuance:* The prompt asks for "Do not release open weights" (which includes API) OR "API only" (which implies release but restricted). Actually, usually the choice is Open Weights vs. API Only vs. No Release. I will structure the stop condition as "Restricted Access" (which covers API or No Release depending on severity). Let's stick to the prompt's framing: The main fight is Open Weights vs. API.

      *Refining the Values Vote:* The prompt asks to mark where no eval could settle it. That's the "Is the benefit of openness worth the incremental risk?" question.

      *Dropped Distinctions:* Need to be specific. E.g., "Malicious Use vs. Accidental Misuse" (treated as one risk bucket), "Open Source vs. Open Weights" (treated as same for this procedure).

      *Let's write.*
answer: |-
  # The Two-Hour Release Review Procedure (v1.0)

  **Purpose:** To convert unstructured debate into a decisive verdict on whether a model release includes open weights or is restricted (API-only/No Release).
  **Timebox:** 120 Minutes.
  **Participants:** 6 Board Members.
  **Pre-Work:** All capability evals, threat models, and external comparisons must be circulated 48 hours prior. This meeting is for *judgment*, not data review.

  ---

  ## Part 1: The Decision Gates

  Proceed through these gates in order. If a **Stop Condition** is triggered, the meeting moves immediately to *Part 4 (Verdict & Documentation)*. Do not revisit cleared gates unless new evidence is presented (which requires adjourning the meeting).

  ### Gate 1: Structural Context & Precedents
  **Time:** 15 Minutes
  **Operationalizes:** *Irreversibility & Ecosystem Context.*
  **Question:** Does this release fall under one of the three special structural rules (Fine-tune, Leak/Availability, Threshold Edge)?

  *   **(a) Sufficient Answer:** A classification of the release type based on *Part 2 (Structural Rules)* below.
  *   **(b) Consideration:** Ensures we aren't treating a derivative or a leaked model as a fresh base model decision.
  *   **(c) Stop Condition:** If the Structural Rule dictates a verdict (e.g., "Unauthorized Derivative"), move to Verdict.

  ### Gate 2: The Capability Threshold
  **Time:** 30 Minutes
  **Operationalizes:** *Dual-Use Risk & Differential Progress.*
  **Question:** Do the capability evals exceed the internal red-line thresholds for high-risk domains (bio, cyber, persuasion, autonomous replication)?

  *   **(a) Sufficient Answer:** A binary "Clear" or "Exceeds" based on the pre-circulated eval report. If evals are within the noise margin of the threshold, apply the *Margin Rule* (see Part 2).
  *   **(b) Consideration:** Prevents releasing capabilities that are known to be dangerous regardless of intent.
  *   **(c) Stop Condition:** If **Exceeds**, verdict is **Restricted Access (API or No Release)**. Do not proceed to Gate 3.

  ### Gate 3: The Irreversibility & Mitigation Test
  **Time:** 30 Minutes
  **Operationalizes:** *Recall Ability & Security Through Transparency.*
  **Question:** If a critical flaw or misuse vector is discovered 7 days post-release, can we mitigate it effectively with open weights compared to API-only?

  *   **(a) Sufficient Answer:** Specific identification of a mitigation mechanism for open weights (e.g., "downstream filters," "patchable architecture") that is *as effective* as API throttling/revocation. If the only mitigation is "hope the community patches it," the answer is No.
  *   **(b) Consideration:** Acknowledges that API allows recall; weights do not. Openness is only permissible if the lack of recall is acceptable.
  *   **(c) Stop Condition:** If the Board agrees mitigation is **Impossible or Insufficient**, verdict is **Restricted Access**.

  ### Gate 4: The Values Vote [VOTE]
  **Time:** 30 Minutes
  **Operationalizes:** *Decentralization vs. Concentration of Power.*
  **Question:** Given the residual risk remaining after Gate 3, does the strategic benefit of open weights (inspection, ecosystem hardening, decentralization) outweigh the incremental risk over API-only?

  *   **(a) Sufficient Answer:** A recorded vote. No empirical evidence can settle this; it is a trade-off between safety control and ecosystem growth.
  *   **(b) Consideration:** This is the core philosophical conflict. It must be owned as a value judgment, not disguised as a safety finding.
  *   **(c) Stop Condition:** If the Vote fails (Majority against Openness), verdict is **Restricted Access**.

  ### Gate 5: Final Ratification
  **Time:** 15 Minutes
  **Question:** Are there any dissenting opinions that require CEO escalation?
  *   **(a) Sufficient Answer:** Confirmation of the final path.
  *   **(b) Consideration:** Deadlock breaking.
  *   **(c) Stop Condition:** If 3 or more members request escalation, the meeting adjourns and the CEO decides.

  ---

  ## Part 2: Structural Rules

  Apply these rules at **Gate 1**. They override standard eval interpretation.

  **1. The Fine-Tune Rule (Authorized or Unauthorized)**
  *   **Procedure:** Inherit the risk profile of the *base* model. Add a delta assessment for the fine-tune's specific domain.
  *   **Verdict Logic:** If the base model was API-only, the fine-tune cannot be Open Weights unless the fine-tune *reduces* capability risk (e.g., a safety-tuned model) AND the base weights are available for inspection elsewhere. If the base was Open, the fine-tune is Open *unless* the fine-tune adds high-risk capabilities (Gate 2).
  *   **Rationale:** Prevents using fine-tunes to bypass base model restrictions.

  **2. The Leak/Availability Rule**
  *   **Procedure:** Determine if functionally equivalent weights are already publicly available (e.g., via prior leak, competitor release, or previous lab release).
  *   **Verdict Logic:** If equivalent weights are public, the "Irreversibility" risk is already realized. The decision shifts from "Risk Creation" to "Reputation & Alignment."
      *   *Option A:* Release official weights to provide a safer, aligned alternative (Open).
      *   *Option B:* Refuse to release to avoid legitimizing the capability class (Restricted).
      *   *Decision:* This triggers a **[VOTE]** at Gate 1.
  *   **Rationale:** Closing the barn door after the horse has bolted changes the risk calculus from prevention to mitigation.

  **3. The Threshold Margin Rule**
  *   **Procedure:** If a capability eval lands within the statistical noise margin of a red-line threshold (e.g., threshold is 50%, model scores 48% ± 3%), treat the score as **At Threshold**.
  *   **Verdict Logic:** Triggers the **Stop Condition at Gate 2**.
  *   **Rationale:** Prevents "threshold shopping." If the measurement isn't precise enough to prove safety, you cannot claim safety.

  ---

  ## Part 3: Worked Applications

  ### Case A: 7B Coding Model (Median Capability)
  *   **Context:** 7B parameter model, fine-tuned for code. Evals match median of existing open models (e.g., Llama-2-7B level).
  *   **Walkthrough:**
      *   **Gate 1 (Structural):** Standard new release. No special rules.
      *   **Gate 2 (Capability):** Coding evals are below bio/cyber red-lines. **Pass.**
      *   **Gate 3 (Irreversibility):** Coding models can be patched or filtered downstream. Risk of irreversible harm is low compared to bio. **Pass.**
      *   **Gate 4 (Values Vote):** Does the ecosystem benefit of open weights (developers running locally, auditing code logic) outweigh the risk?
          *   *Debate:* Openness side argues local dev is essential. Caution side argues it aids malware scripting.
          *   *Vote:* 4 for Open, 2 for API.
      *   **Verdict:** **Release Open Weights.**
      *   **Note:** No values vote needed if Gate 2 or 3 had failed.

  ### Case B: Frontier Multimodal (Bio Edge Case)
  *   **Context:** Frontier model. Biology evals score 47%. Threshold is 50%. Eval team notes noise margin is ±5%.
  *   **Walkthrough:**
      *   **Gate 1 (Structural):** Threshold Margin Rule applies. 47% is within ±5% of 50%.
      *   **Gate 2 (Capability):** Treat as **At Threshold**.
      *   **Stop Condition:** Triggered.
      *   **Verdict:** **Restricted Access (API Only).**
      *   **Note:** The meeting ends here. Gate 3 and 4 are skipped. The openness argument ("It's technically under 50%") is procedurally invalid under the Margin Rule.

  ### Case C: Unauthorized Fine-Tune (Stripped Safety)
  *   **Context:** Third party took your open-weight model from last year, stripped safety training, and released it. You are deciding whether to release an *official* updated version.
  *   **Walkthrough:**
      *   **Gate 1 (Structural):** Leak/Availability Rule applies. Weights are already out in the wild (via the bad fine-tune).
      *   **Gate 1 Vote:** Do we release official weights to displace the unsafe version, or restrict to distance ourselves?
          *   *Debate:* Openness side says "Flood the zone with safe weights." Caution side says "Don't endorse this capability class."
          *   *Vote:* 3 for API, 3 for Open. (Deadlock).
      *   **Escalation:** CEO decides.
      *   **Hypothetical CEO Decision:** CEO sides with Caution.
      *   **Verdict:** **Restricted Access (API Only).** Issue public statement condemning the stripped version.
      *   **Note:** This highlights that "Openness" is not always the default even if weights are leaked; reputation risk is a valid constraint.

  ---

  ## Part 4: Honesty Requirements & Limitations

  ### 1. Where this procedure hurts your position (The Openness Advocate)
  You stated you sit on the openness side. This procedure is structurally biased against you in two specific ways, and you should accept this trade-off for the sake of decidability:

  *   **The Margin Rule (Case B):** You argue that "just under means under." This procedure explicitly rejects that. It forces a "benefit of the doubt" toward safety when measurements are noisy. This will block open releases you believe are safe, simply because the *measurement* isn't precise enough. You will have to vote to override the Margin Rule (which requires changing the protocol, not just winning a meeting).
  *   **The Default to API:** The Stop Conditions are asymmetric. If Gate 2 or 3 is unclear, the default is Restricted. To get Open Weights, you must clear *all* gates. To get API, you only need to fail *one*. This reflects the irreversibility risk but inherently makes your position the "uphill climb."

  ### 2. What this procedure cannot do
  *   **It cannot resolve value disagreements:** Gate 4 is a vote. If the board is split 3-3 on whether decentralization is worth the risk, this procedure does not solve it; it kicks it to the CEO. It prevents the argument from masquerading as a safety fact, but it doesn't make the decision easier.
  *   **It cannot predict emergence:** The procedure relies on current evals. If a model exhibits emergent deceptive behavior post-release that wasn't in the evals, this procedure offers no protection. It is a *process* guarantee, not a *safety* guarantee.
  *   **It launders priors:** If your Security Lead believes "all open weights are dangerous" as a prior, they can vote "No" at Gate 3 (Mitigation) regardless of evidence. The procedure forces them to state *why* (recorded mitigation failure), but it cannot stop a determined blocker from finding a reason to trigger a Stop Condition.

  ### 3. Dropped Distinctions
  To fit this into two hours, I have intentionally collapsed the following distinctions. Be aware they may resurface:
  *   **Malicious Use vs. Accidental Misuse:** The procedure treats risk as risk. It does not distinguish between a bad actor using the model and a researcher making a mistake. (Rationale: The harm is the same; the intent is hard to prove in a meeting).
  *   **Open Source License vs. Open Weights:** We treat "Open Weights" as the binary decision. Whether it's MIT, Apache, or a custom license is a legal downstream problem, not a safety board problem.
  *   **Capability vs. Alignment:** We assume evals measure dangerous capability. We do not separately vote on "is the model aligned?" unless it triggers a capability threshold. (Rationale: Alignment is hard to measure; capability is easier to benchmark).

  ---

  ## Instructions for the Chair
  1.  **Enforce the Timebox:** Use a visible timer. When Gate 2 time is up, you must call the question on the Threshold.
  2.  **Enforce the Stop Conditions:** If Gate 2 fails, do not allow discussion on Gate 3. It is a waste of time and creates false hope.
  3.  **Record the Vote:** At Gate 4, explicitly state: "This is a values vote. We are not deciding facts; we are deciding trade-offs." Record the count in the minutes.
  4.  **Manage the Margin:** If the eval team says "we are close to the line," immediately invoke the Margin Rule. Do not let the board debate the statistics; the rule is binary.
