answer: |-
  Your intuitions map most coherently onto a principle of **Responsibility-Sensitive Objective Capability Egalitarianism**.

  **The Principle**
  Society must distribute resources to equalize individuals' effective freedom (capability) to achieve a threshold of objectively valuable functionings, compensating for unchosen deficits in converting resources to functionings, while refusing to compensate for voluntarily cultivated preferences or chosen burdens, and disregarding subjective satisfaction when it stems from adaptive deprivation.

  **How the Clauses Save Your Verdicts**
  *   **"Effective freedom... converting resources":** This saves the **Blind Neighbor (Case 1)** and the **Deaf Woman (Case 2)**. It acknowledges that money alone isn't the metric; the metric is what you can *do* with money. The blind man needs more resources to achieve the same capability set (mobility, information access), so he is owed compensation. The deaf woman, in a signed environment, faces no conversion deficit; her capability set is equal to her hearing colleagues, so no top-up is owed.
  *   **"Objectively valuable functionings":** This saves the **Slum Dweller (Case 4)**. It rejects welfarism (happiness) as the sole metric. Housing, security, and health are objectively valuable functionings. The slum dweller lacks these regardless of his reported satisfaction, making him worse off than the rich man.
  *   **"Disregarding subjective satisfaction... adaptive deprivation":** This also saves the **Slum Dweller (Case 4)** by explicitly ruling out his contentment as a defense against the claim of deprivation. It identifies his happiness as a psychological coping mechanism (adaptive preference) rather than evidence of advantage.
  *   **"Voluntarily cultivated preferences or chosen burdens":** This saves the **Expensive Tastes Guy (Case 3)**. His high costs stem from preferences he is responsible for cultivating, not an unchosen conversion deficit. Society owes him nothing because his resource share was sufficient for standard functionings. It also partially saves the **Overworked Colleague (Case 5)** by explaining why she isn't *owed compensation* despite having less leisure.

  **Predictions on New Cases**
  *   **Chronic Fatigue Worker (20 hours/week):** This counts as an unchosen conversion deficit. She cannot convert labor time into income at the same rate as a healthy peer. The principle predicts she is worse off and **owed compensation** (e.g., disability income or wage subsidy) to restore her capability set to the threshold, provided the fatigue is not voluntarily incurred.
  *   **Illiterate Sixty-Year-Old (Serenely Uninterested):** Literacy is typically classified as an objectively valuable functioning central to agency. Her lack of interest is likely an adaptive preference resulting from past exclusion. The principle predicts she is **objectively worse off** than a literate peer. However, because the remedy is access to a capability (education) rather than income, society owes her the **opportunity to learn** without coercion. If she refuses the opportunity, she remains objectively disadvantaged but is not owed financial compensation, as the capability was made available.

  **Verdicts to Overturn**
  I would overturn the implication in the **Overworked Colleague (Case 5)** that she is "worse off" in any sense that triggers egalitarian concern. If you hold the Expensive Tastes Guy responsible for his utility function (Case 3), consistency demands you hold the Colleague responsible for her leisure/work trade-off. If she chose the 60-hour job with eyes open and a viable 30-hour alternative existed, she has exercised her agency to prioritize income (or other goods) over leisure. To label her "worse off" undermines the responsibility clause that protects your view from the Expensive Tastes objection. You should classify her as having **equal opportunity for advantage** but **unequal actual advantage**, where the inequality is justified by choice and thus not an object of egalitarian regret.
