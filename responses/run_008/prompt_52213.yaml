answer: |-
  This is a robust philosophical audit. Your friend is defending a position known in philosophy of technology as **Instrumentalism** (technology is a neutral means to an end), while you are engaging with **Substantive Theory** (technology constitutes a form of life or social order).

  Here is the systematic audit of the "hammer analogy" against the "Winnerian" opposition, structured according to your four requests.

  ### 1. The Correspondence Table

  The strength of an analogy lies in the structural identity between the source (the hammer) and the target (the socio-technical system). Below is the mapping. The breakdown occurs primarily in the roles of **Wielder**, **Victim**, and **Agency**.

  | Role / Feature | Source Case: The Hammer | Target Case: Algorithmic Feed / Power Grid | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Designer** | Distant blacksmith/engineer; generic intent (drive nails). | Product managers/engineers; specific intent (maximize engagement/stability). | **Weak.** Hammer design is static; platform design is iterative and adaptive. |
  | **Manufacturer** | Factory producing identical units. | Corporation owning the infrastructure and the rules of access. | **Weak.** Manufacturer retains control post-sale in tech; hammer manufacturer does not. |
  | **Wielder** | **Specific Individual.** Decides *when, where, and how hard* to strike. | **Ambiguous/Fractured.** Is it the user scrolling? The algorithm ranking? The advertiser targeting? | **Failed.** In the target, the "tool" often acts without a specific human command at the moment of effect. |
  | **Victim** | **Passive Object.** (Nail, wall, or skull). | **Often the Wielder.** (User loses attention/data) or **Bystander.** (Society loses cohesion). | **Failed.** In the target, the user is often the resource being harvested, not the master of the tool. |
  | **Decision Point** | **At the moment of use.** The hammer does not swing itself. | **Embedded in design.** The sorting happens before the user sees the content. | **Failed.** Morality is shifted from *use* to *design*. |
  | **Context** | Local, immediate, visible. | Networked, systemic, opaque. | **Failed.** Effects ripple beyond the immediate user. |
  | **Agency** | 100% Human. Tool has zero autonomy. | Shared/Delegated. Tool makes micro-decisions (filtering, routing) autonomously. | **Failed.** The tool exercises judgment. |

  **The Critical Failure:** In the hammer case, the **Wielder** is the locus of moral agency. In the socio-technical case, the **Design** is the locus of moral agency. When your friend says "tools are picked up and put down," she assumes the tool is inert between uses. A recommender system is *working* even when you aren't looking, processing data and adjusting models. It is never "put down."

  ### 2. Identifying and Sorting Disanalogies

  You listed several differences (simplicity, cost, transparency, etc.). We must distinguish which are incidental (mere differences in degree) and which are structural (differences in kind that break the analogy).

  **Incidental Disanalogies (Do not save the analogy):**
  *   **Cost/Complexity:** A expensive, complex hammer is still a neutral tool. Complexity alone does not create politics.
  *   **Physical Size:** A large machine can be as neutral as a small one if it requires full human control for every action.
  *   **Infrastructure:** A hammer needs an arm; a grid needs a grid. Infrastructure itself isn't the disqualifier.

  **Critical Disanalogies (Destroy the analogy):**
  *   **Delegation of Judgment:**
      *   *Hammer:* The human judges the angle and force.
      *   *Target:* The system judges what you see, who gets a loan, or how power is routed.
      *   *Why it matters:* When judgment is delegated to the artifact, the artifact embodies the *criteria* of that judgment. If the criteria are biased, the tool is biased *before* anyone wields it.
  *   **Opacity (The Black Box):**
      *   *Hammer:* You can see exactly how it works.
      *   *Target:* The user cannot see why the feed showed Post A instead of Post B.
      *   *Why it matters:* Moral responsibility requires knowledge. If the "wielder" (user) cannot know the consequences of their interaction with the tool, they cannot bear full moral responsibility. The responsibility shifts to the designer.
  *   **The Bystander Effect:**
      *   *Hammer:* Hitting a nail does not affect your neighbor.
      *   *Target:* My use of social media affects *your* feed, *your* political landscape, and *your* privacy.
      *   *Why it matters:* The "contract" of the tool analogy is between Wielder and Object. Socio-technical systems impose externalities on non-wielders. This makes it a *political* issue (distribution of harm/benefit), not just a moral one (individual intent).
  *   **Pre-emption of Choice:**
      *   *Hammer:* You can choose to use it or not.
      *   *Target:* Often, participation is required for social/economic life (e.g., digital ID, workplace monitoring).
      *   *Why it matters:* If you cannot "put the tool down" without exiting society, it is not a tool; it is an **environment**.

  **Verdict:** The disanalogies regarding **Delegation** and **Bystander Impact** are fatal to your friend's conclusion. They move the locus of morality from the *moment of use* to the *structure of the system*.

  ### 3. Does the Neutrality Conclusion Survive?

  **The Threshold Question:**
  Does Winner refute neutrality for *all* tools, or just complex ones?
  There is a principled threshold: **The Delegation of Authority.**
  *   **Below Threshold:** A stick, a hammer, a bicycle. These extend human physical capacity but do not make decisions. Neutrality holds reasonably well here.
  *   **Above Threshold:** A thermostat, a speed bump, an algorithm, a nuclear plant. These devices make decisions (turn on/off, slow down, show/hide, generate power) that humans previously made.
  *   **Principled Grounds:** The line is drawn where the artifact begins to enforce a rule *without human intervention at the moment of enforcement*. A speed bump forces you to slow down without a police officer. A bridge blocks a bus without a guard. At this point, the artifact *is* the policy.

  **Determinism vs. Affordance:**
  Your friend may argue Winner is a technological determinist (tech dictates society). This is a misunderstanding of Winner's stronger claim.
  *   **Hard Determinism:** Technology *causes* social change inevitably. (Winner rejects this).
  *   **Winner's Position (Compatibility/Incompatibility):** Technologies are *compatible* with some social orders and *incompatible* with others.
      *   *Example:* A nuclear grid doesn't *force* hierarchy, but it makes hierarchy so much cheaper and safer than democracy that rational actors will choose hierarchy. It "loads the dice."
      *   *Stable Intermediate Position:* Artifacts do not dictate the future, but they **constrain the political menu**. To claim they are neutral is to ignore that they have removed certain options from the menu entirely.

  **The "Designer Intent" Counter-Move:**
  Your friend's likely reply: *"Even the Moses bridges were designed by a man. The politics are in Moses, not the concrete."*
  *   **Does this save her conclusion?** No. It actually concedes your point.
  *   **Why:** If the politics are in the design, then the **artifact is the vessel of the politics.**
      1.  **Persistence:** Moses is dead; the bridges remain. The politics persist without the original moral agent.
      2.  **Invisibility:** If the politics are in the concrete, a driver crossing the bridge may not know they are participating in segregation. They cannot be held morally responsible (as the "wielder") for a political outcome they cannot see.
      3.  **The Category Error:** Your friend claims asking if tech has politics is a "category error." If the design *encodes* policy (e.g., "buses cannot pass"), then the tech *does* have politics. Assessing the bridge *is* assessing the policy.
      4.  **Unintended Consequences:** Much modern tech politics is *not* intended (e.g., algorithmic bias arising from data sets). If the politics are unintended, they cannot reside in the "wielder's intent." They reside in the system's structure.

  **Verdict:** The neutrality conclusion does not survive. It survives only for simple hand tools. For systems that delegate judgment or structure social interaction, the "neutral tool" model is false. The politics are not just in the user; they are in the **affordances and constraints** of the system.

  ### 4. A Better Analogy

  The hammer analogy fails because it implies a master/slave relationship (Human master, Tool slave) that doesn't exist in socio-technical systems. We need an analogy that captures **pre-emption**, **structure**, and **distributed impact**.

  **The Proposed Analogy: Urban Architecture (The Gated Community or The Speed Bump)**

  Instead of a hammer, ask your friend to consider a **Speed Bump** (a classic example from Bruno Latour, who extends Winner's work).

  *   **The Setup:** A town wants cars to drive slowly near a school.
  *   **Option A (The "Human" Way):** Put a police officer there. The officer decides when to wave cars down. The driver decides whether to obey. Morality lies with the driver and the officer.
  *   **Option B (The "Artifact" Way):** Install a speed bump.
  *   **The Audit:**
      *   **Neutrality:** Is the speed bump neutral? No. It physically forces a behavior. You cannot "wield" a speed bump to let a fast car pass. It enforces the rule "Slow Down" automatically.
      *   **Politics:** The speed bump embodies a political decision: "Safety is more important than Speed," and "Enforcement should be automated rather than interpersonal."
      *   **Designer vs. Wielder:** The driver (wielder) has lost the choice to speed. The morality is no longer in the driver's foot; it is in the asphalt.
      *   **Mapping to Tech:** A content moderation algorithm is a digital speed bump. It forces certain speech to slow down (be deprioritized) or stop (be banned) regardless of the user's intent.

  **Why this works better:**
  1.  **It acknowledges Design:** It admits the designer put the politics there (saving your friend's intuition that humans are responsible) but shows that once built, the **artifact enforces the politics**, not the human.
  2.  **It handles Bystanders:** A speed bump affects emergency vehicles, neighbors (noise), and drivers alike. It is a public good/burden, not a private tool.
  3.  **It breaks "Wielder" Sovereignty:** You cannot use a speed bump to drive fast. You cannot use a DRM-locked file to copy text. The tool restricts the will, rather than executing it.

  **Conclusion for your Debate:**
  Tell your friend: *"The hammer analogy works for tools that wait to be used. It fails for systems that act on their own. A better analogy is a speed bump. You can blame the city planner for putting it there, but once it exists, the concrete is doing the policing, not the driver. If the concrete is doing the policing, then the concrete has politics. And if the concrete has politics, we are allowed to ask if it's good concrete."*
