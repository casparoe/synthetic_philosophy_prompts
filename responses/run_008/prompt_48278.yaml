      *   *Term 4: Falsifiability/Reformulation.*
          *   *Issue:* Engels' "last instance" caveat makes it unfalsifiable. Survivor bias in history.
          *   *Analysis:* This is a major philosophical weakness. If economics is only decisive "in the last instance," the strong deterministic claim evaporates.
          *   *Estimate:* 0.5. (Significant risk that the theory is a tautology).

