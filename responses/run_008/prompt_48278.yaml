      *   *Re-evaluating Term 1:* Is the distinction non-arbitrary? Cohen (Karl Marx's Theory of History: A Defence) argues for a strict separation (material content vs. social form). But modern institutional economics says institutions *are* the economy. 0.6 is generous. Let's stick with 0.6 but emphasize the blur.
      *   *Re-evaluating Term 2:* This is the weakest link. 0.4 is appropriate.
