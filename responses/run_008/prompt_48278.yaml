      *   **Constraints:**
          *   Not a survey, but a probability estimate (credence).
          *   Decompose credence into four specific terms (with numbers 0-1 and justification).
          *   Term 1: Non-arbitrary distinction (Base vs. Superstructure coherence).
          *   Term 2: Legitimacy of functional explanation (without strong selection mechanism).
          *   Term 3: Hard cases not decisive (Science, Religion, Law migration).
          *   Term 4: Falsifiability/Reformulation worry (Engels' "last instance," survivor bias).
          *   Provide the combined probability.
          *   Identify sensitivity (which term drives the final number).
          *   Compare with weaker thesis (constraint vs. determination) and identify what's left over.
          *   Identify the crux of disagreement between a materialist (0.8) and skeptic (0.2).

  2.  **Deconstruct the Four Terms & Assign Probabilities:**

      *   *Term 1: Non-arbitrary Distinction.*
          *   *Issue:* In modern capitalism, law (property, corporate) constitutes the economy. Is the base distinct from the superstructure, or are they intertwined?
          *   *Analysis:* While intertwined, one can analytically distinguish "material reproduction conditions" from "ideological/legal legitimation," but the boundary is porous. However, for the *strong* thesis to hold, the distinction must be robust enough to support causal directionality. The porosity weakens the strong claim.
          *   *Estimate:* 0.6. (It's possible to draw, but it's messy and often stipulative).

      *   *Term 2: Legitimacy of Functional Explanation.*
          *   *Issue:* Explaining $X$ by its consequence $Y$ (stabilizing base) requires a feedback loop or selection mechanism. History lacks a clear "weed out" mechanism for societies with maladaptive superstructures in the short/medium term.
          *   *Analysis:* Sociological functionalism is notoriously weak without a specified mechanism (e.g., rational choice, evolutionary pressure). The strong thesis relies on this heavily.
          *   *Estimate:* 0.4. (It's a weak form of explanation without a rigorous mechanism).

      *   *Term 3: Hard Cases (Science, Religion, Law).*
