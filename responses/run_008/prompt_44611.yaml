      *   *Calculation:* $0.8 \times 0.5 \times 0.3 \times 0.2 \approx 0.024$. This is too low compared to my target of ~0.12. I need to be more charitable to the "Strongest Defensible Form."
      *   *Revision:* Let's group them into three main pillars:
