answer: |-
  You have independently rediscovered the central debate in contemporary political philosophy regarding distributive justice. There is indeed an established name for this situation, a robust literature mapping the positions you and your friend took, and a specific solution to the "pickiness" puzzle that troubled you.

  The broad debate is known as **The Currency of Egalitarianism**.

  The specific clash between your view and your friend's is the debate between **Equality of Resources** (your position) and **Equality of Welfare** (your friend's position). The "pickiness" puzzle is the famous **Expensive Tastes Objection**. The principle that resolves the difference between medical needs and hobbies is **Luck Egalitarianism** (specifically the distinction between **Choice and Circumstance**).

  Here is how your argument maps onto the established literature, how it differs from "Opportunity vs. Outcome," and the solution to your edge case.

  ### 1. The Names of Your Positions

  **Your Position: Equality of Resources**
  You argued that fairness is achieved when families are given equal amounts of money and services. In philosophy, this is most closely associated with **Ronald Dworkin** (specifically his 1981 essay *What is Equality? Part 1: Equality of Welfare, Part 2: Equality of Resources*).
  *   **The Metric:** External goods (money, vouchers, services).
  *   **The Logic:** Individuals are responsible for their own lives. If society gives everyone an equal share of resources, it has treated them with equal respect. What they *do* with those resources is up to them.
  *   **The Blind Spot:** As you noticed, this view struggles with disabilities. If a wheelchair user gets the same dollar amount as an able-bodied student, they effectively have less "school" because they must spend some of that budget on access.

  **Your Friend's Position: Equality of Welfare**
  Your friend argued that fairness is achieved when families end up equally satisfied or benefited. This is **Welfare Egalitarianism**.
  *   **The Metric:** Internal states (satisfaction, benefit, utility).
  *   **The Logic:** The point of distribution is to improve lives. If one person needs more to feel the same benefit as another, justice demands they get more.
  *   **The Blind Spot:** As you noticed, this view struggles with "pickiness." If someone chooses to be hard to please, Welfare Egalitarianism implies society owes them *more* resources to bring their satisfaction up to par with the easily pleased.

  **A Third Contender: The Capability Approach**
  There is a middle ground developed by **Amartya Sen** and **Martha Nussbaum** that might actually describe your friend's view better than "Welfare." They argue for **Equality of Capability**.
  *   **The Metric:** What people are actually *able to do or be* (functionings).
  *   **The Distinction:** Welfare is about happiness; Capability is about freedom to function. A wheelchair user lacks the *capability* to enter the school without a ramp, regardless of their happiness. This avoids the "happiness" trap of Welfare Egalitarianism while acknowledging the "resource" trap of Resource Egalitarianism.

  ### 2. The Edge Case: "Expensive Tastes"

  The stubborn case you couldn't resolve—a family that converts resources into less benefit through sheer pickiness—is one of the most famous problems in this field. It is known as the **Expensive Tastes Objection**.

  *   **The Problem:** If we equalize welfare (your friend's view), we must subsidize the person with expensive tastes. If Louis requires champagne and caviar to be as happy as Harry is with beer and potatoes, Welfare Egalitarianism says we must give Louis more money. Intuitively, this feels unjust.
  *   **Your Intuition:** You felt it was wrong to count their dissatisfaction as inequality.
  *   **The Philosophical Consensus:** Most modern egalitarians agree with you. Subsidizing expensive tastes is generally rejected.

  ### 3. The Relevant Difference: Choice vs. Circumstance

  You asked for the "relevant difference" between a child's medical needs and a family's expensive hobbies. Why does one demand compensation and the other not?

  The established answer is **Luck Egalitarianism** (championed by philosophers like **G.A. Cohen**, **Richard Arneson**, and **Dworkin**).

  The distinction is between **Brute Luck** and **Option Luck** (or **Circumstance** and **Choice**).

  1.  **Circumstance (Brute Luck):** Features of your life you are not responsible for. (e.g., being born with a disability, being born into poverty, having high medical needs).
      *   *Verdict:* Justice requires compensation.
  2.  **Choice (Option Luck):** Features of your life that result from your voluntary decisions or cultivated character. (e.g., choosing expensive hobbies, refusing to use provided services, cultivating a picky palate).
      *   *Verdict:* Justice does not require compensation. You bear the cost of your choices.

  **How this resolves your argument:**
  *   **Medical Needs:** These are *Circumstances*. The child did not choose to need a wheelchair. Therefore, a fair system must provide extra resources to neutralize this disadvantage. (This actually modifies your "Resource" view: true Resource Egalitarianism often includes insurance for handicaps).
  *   **Pickiness:** This is *Choice*. The family chose their preferences. Therefore, a fair system ignores their resulting dissatisfaction. (This refutes your friend's "Welfare" view).

  ### 4. Why "Opportunity vs. Outcome" Doesn't Fit

  You were correct to dismiss the folk distinction between Equality of Opportunity and Equality of Outcome. That distinction is **temporal and procedural**, whereas your debate is **ontological**.

  *   **Opportunity vs. Outcome:** Asks *when* we measure equality. (At the starting line? Or at the finish line?)
  *   **Resource vs. Welfare:** Asks *what* we are measuring. (Is the "thing" being equalized dollars, or is it well-being?)

  You can have Equality of Resources at the starting line (Opportunity), but if one runner has a broken leg (Circumstance), they do not have Equality of Capability. Conversely, you can aim for Equality of Outcome (Welfare), but if you subsidize expensive tastes to get there, you violate principles of Responsibility. Your debate was about the **Currency of Justice**, not the timing.

  ### 5. Summary and Mapping

  If you wish to read further, you are looking for the literature on **Distributive Justice** and **Luck Egalitarianism**.

  *   **The Phenomenon:** **Incommensurable Currencies of Egalitarianism.** (This describes the situation where two people talk past each other because they measure the "stuff" of justice differently).
  *   **Your Stance:** **Resource Egalitarianism.**
  *   **Friend's Stance:** **Welfare Egalitarianism** (or potentially **Capability Egalitarianism**).
  *   **The Tie-Breaker:** **The Choice/Circumstance Distinction.**

  **The Synthesis:**
  Most modern philosophers attempt to synthesize these views. They argue for **Equality of Access to Advantage** (Cohen) or **Capability** (Sen). The goal is to equalize resources *except* where people have different needs due to unchosen circumstances (disabilities), while holding people responsible for their chosen preferences (expensive tastes).

  **Where your pattern falls:**
  You are not in a logical error; you are in a **Normative Disagreement about the Site of Justice**.
  *   **Edge Case 1 (Disability):** Your view (strict resources) fails here; your friend's view succeeds.
  *   **Edge Case 2 (Pickiness):** Your friend's view (welfare) fails here; your view succeeds.
  *   **The Solution:** A hybrid view that equalizes resources *adjusted for unchosen needs*.

  If you need a term to describe the conversational dynamic itself for future arguments, you might call it **"Currency Mismatch in Distributive Justice."** But know that when you argue this, you are standing on ground worn smooth by the heaviest boots in political philosophy.
