answer: |-
  **What the practice is**
  Here's the pattern: When a painting is exposed as a forgery, its market value collapses and museums hide it, even though the physical object hasn't changed a bit. The canvas and paint are identical, but the status shifts from masterpiece to trash. Conversely, if you buy a poster of that painting, nobody accuses you of fraud; it's accepted as a copy. If a living artist paints a new work in Vermeer's style honestly, it's worth a fraction of the fake. Yet, if a master's workshop produced a piece with only ten percent of the master's touch, we still call it a "Titian" and value it highly. Meanwhile, orchestras play Bach on modern instruments and theater troupes swap genders in Shakespeare without anyone claiming the work itself is fake. The art world treats paintings as unique historical artifacts where origin dictates value, while treating music and theater as repeatable scripts where the performance is the work.

  **The implicit theory**
  The implicit theory here is that artistic value isn't just about how the object looks, but about its history of production. You can think of it as the difference between an "artifact" and an "instruction." For paintings, the value lies in the specific physical trace of the artist's hand at a specific moment in time. When you stand before a real Vermeer, you're having a historical encounter with something Vermeer touched and saw finish. A forgery breaks this connection; it's a lie about history, not just aesthetics. That's why the value tanks—it's no longer a window into 1650, it's a window into 1940.

  Music and theater work differently because the work isn't the manuscript; it's the structure of sounds or actions. A score is just instructions. As long as the instructions are followed reasonably well, the work is present. This theory fits best because it explains why honest pastiches fail (wrong history) and why forgeries are scandals (deceptive history). It posits that we value the *achievement* of the creation, not just the *result*. We are venerating the human genius that solved the problem of making the image, not just the image itself. The forgery steals credit for an achievement they didn't accomplish. The workshop case fits loosely here because the assistants were part of the master's "factory," so the historical lineage remains unbroken, even if the specific handiwork varies.

  This view suggests that art is a form of communication between the creator and the viewer across time. If the sender is fake, the message is void. It also explains why we forgive restoration or aging but not forgery; aging is part of the object's true history, while forgery is an inserted falsehood. The music split makes sense because the composer's physical hand isn't the medium of enjoyment; the sound is. In painting, the physical paint *is* the medium. So the theory holds that the medium itself carries the historical weight in visual art, whereas in performance art, the medium is ephemeral and repeatable. Essentially, we treat paintings as relics of a specific human performance that happened once, while we treat symphonies as recipes that can be cooked many times. The value is in the unique event of creation, not just the leftover object.

  **What it strictly needs vs what it just fits with**
  This theory strictly needs the history of production to matter. If aesthetic experience were all that counted, the forgery would remain valuable. However, the practice is messy. The workshop case is inconsistent: if value comes from the master's creative act, a painting mostly done by assistants should be worth less than one fully by the master, yet we often lump them together under the master's brand. This suggests market branding sometimes overrides the strict "hand of the master" theory. Also, the music split feels coherent only if you accept that paintings are singular events while scores are reusable recipes. But if you believe the *sound* is the art, then a perfect digital reproduction of a violin should equal the live performance, yet we still pay more for the live show. So, the practice mixes historical reverence with scarcity economics, sometimes inconsistently. The "feel" you have that the difference is real comes from our human instinct to value authentic human connection over manufactured simulations, even when the output is identical. Ultimately, the practice is underdetermined because it relies on trust. We can't scientifically prove every brushstroke's origin, so we rely on experts. When that trust breaks, the value vanishes. This means the system is fragile, built on belief rather than just physical properties.

  **What would change**
  If we switched to a purely aesthetic theory, museums would display high-quality forgeries alongside originals labeled only by style, and auction prices would flatten based on beauty rather than name. Your print would be worth nearly as much as the canvas if the visual experience was identical. If we switched to pure market scarcity, we'd care less about who made it and more about how many exist; we might even destroy art to boost values. Under the current system, museums function as historical archives proving lineage, not just galleries for pretty images. Auctions sell provenance documents as much as paint. Changing the theory would turn art galleries into interior design showrooms or history museums, fundamentally altering why we rope off a canvas instead of letting people touch it. We would stop caring about the "story" of the object and start caring only about the "view" of the object. The emotional weight of standing before something historic would be replaced by the satisfaction of seeing something beautiful, changing the entire ritual of visiting a museum. It would democratize access to beauty but destroy the market that funds preservation. We'd lose the thrill of the hunt for truth, but gain access to better-looking walls.
