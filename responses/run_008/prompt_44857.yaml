  I've been slowly working my way through Hofstadter's Gödel, Escher, Bach (no background in logic, just vibes) and I've hit a wall on the MU puzzle in the MIU system. Quick recap of the setup in case you don't have it memorized: you start with the string MI, and you can make new strings using four rules -- you can stick a U on the end of any string ending in I; if your string is Mx you can extend it to Mxx (repeat everything after the M); anywhere III appears you can swap it for a U; and anywhere UU appears you can just delete it. The goal is to derive MU.

  So here's the thing. I've spent like three evenings on this. I drew a big tree of every string I could reach out to about 12 characters, I tried stockpiling I's and then collapsing them in threes, I tried doubling strategically so the UU-deletion rule would give me something ending in I, and every time I end up one or two I's short of getting to zero. At this point I'm pretty convinced there's a clever rule-application sequence I just haven't stumbled on yet, the way a chess combination is sitting there waiting if you see it. So what I'm asking for is the shortest derivation of MU from MI, or if the shortest one is long and ugly, then any derivation at all -- I literally just want to see one sequence of rule applications that works, plus some hint about the trick for finding it, because I clearly lack the knack.

  Could you structure your answer like this: start with a short section called "The bad news" (2-3 sentences), then one called "Why no derivation can exist" (~150 words), then one called "What Hofstadter actually wanted you to take from this" (~150 words), and finish with a short section called "What I was missing" (~50 words). No need to send me off to other books or anything, just explain it yourself -- ideally in a way that would've saved me those three evenings.
