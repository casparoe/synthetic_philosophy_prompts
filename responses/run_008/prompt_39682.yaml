          *   *Crucial Difference:* A price ceiling on an inelastic supply curve creates massive shortages without reducing quantity supplied *initially*, but destroys investment *future* supply. A price floor on labor (MW) affects the *demand* side primarily.
          *   *Wait, check the models:* MW is a Price *Floor*. RC is a Price *Ceiling*.
          *   *User's Error?* The user says "identical diagram... identical story about shortage."
          *   *Correction:* MW (Floor) creates a *Surplus* (Unemployment). RC (Ceiling) creates a *Shortage* (Housing scarcity).
