      *   **Sociological/Professional Identity:** Economists hate RC because it creates *non-price rationing* (queues, discrimination, bribes), which is anathema to price theory. MW just creates unemployment (a number), which is debatable. RC creates *chaos*.
      *   **Ethical Dimension:** Housing is a "merit good" (need), Labor is a "factor of production." But the ethical inconsistency remains.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, respectful, engaging, slightly provocative (matching the user's level).
