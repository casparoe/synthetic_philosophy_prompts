          *   *Refinement:* The mechanisms are different. MW raises price above equilibrium -> Excess Supply (Unemployment). RC lowers price below equilibrium -> Excess Demand (Shortage).
          *   *Why the consensus difference?* The cost of the distortion.
          *   *Housing:* Shortage leads to misallocation (wrong people in apartments), decay (landlords stop maintaining), and black markets. Supply is *very* inelastic, so the quantity effect is small initially but the quality effect is huge.
