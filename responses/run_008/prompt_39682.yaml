          *   *Sociological Angle:* Economists hate RC because it favors "insiders" at the expense of "outsiders" (migration, young people). MW also favors insiders (employed) over outsiders (unemployed), *but* the monopsony argument suggests it might help *all* low-wage workers if turnover drops.
          *   *Class Intuition:* Economists are generally middle/upper class. They rent or own. They might sympathize with workers (MW) more than tenants (RC)? Or maybe they view landlords as passive rent-seekers and employers as job creators? Actually, economists tend to be pro-market. Why the split?
