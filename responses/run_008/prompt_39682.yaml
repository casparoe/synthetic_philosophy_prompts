answer: |-
  Your observation is sharp, and your premise holds up: the asymmetry is real, it is persistent, and it is not merely an artifact of introductory textbooks. You have correctly identified a fault line in the profession where the clean geometry of Econ 101 fractures against the messy geology of real-world institutions.

  To diagnose this, we need to move past the "same diagram" claim. While the *geometry* of deadweight loss looks similar on a whiteboard, the **market structures**, **dynamic responses**, and **allocation mechanisms** differ fundamentally between labor and housing. The consensus gap isn't just sociological posturing; it tracks specific empirical beliefs about elasticities and frictions, but it is also reinforced by what economists view as the "sin" of the intervention.

  Here is the diagnosis, broken down by empirical structure, dynamic consequences, and professional identity.

  ### 1. The Technical Diagnosis: Monopsony vs. Inelastic Supply
  You asked if monopsony explains the split. The answer is yes, but not in the way you initially suspected.

  **Labor Markets (The Monopsony Escape Hatch):**
  The reason economists are split on the minimum wage is that the standard competitive model (perfectly elastic demand) is increasingly viewed as a poor description of low-wage labor markets. Search frictions, geographic immobility, and employer concentration create **monopsony power**. In a monopsony, the marginal cost of labor exceeds the wage rate. Therefore, a binding price floor (minimum wage) can theoretically raise wages *and* employment up to a point. The empirical debate (Card/Krueger vs. Neumark/Wascher) is essentially a debate over *how much* monopsony power exists. Because that is an empirical parameter that varies by context, the professional verdict remains split.

  **Housing Markets (The Supply Constraint Trap):**
  Rent control is a price *ceiling*, not a floor. For a ceiling to cause a shortage without immediate quantity reduction, supply must be perfectly inelastic in the short run. It is. But the consensus against rent control rests on the **long-run supply elasticity**.
  Unlike labor (where humans can enter/exit the workforce or move), housing supply is constrained by zoning, geography, and construction lags. Economists believe the long-run supply of housing is *highly elastic* if allowed to be, but *artificially inelastic* due to regulation.
  *   **The Kicker:** Rent control reduces the return on capital for landlords. In a competitive market, this stops new construction. In a monopolistic market (which you noted exists in some cities), it reduces maintenance quality.
  *   **Why Monopsony doesn't save Rent Control:** You suggested landlords have market power. They do, but rent control doesn't fix monopsony/monopoly pricing; it caps revenue. If a landlord has monopoly power, they are already restricting quantity to raise price. A price ceiling forces them to lower price, which exacerbates the under-supply. There is no "monopsony escape hatch" for rent control where the policy *increases* the quantity of housing. Theoretically, rent control *always* reduces quantity or quality in the long run. Minimum wage *might not*. That theoretical possibility space is where the consensus split lives.

  ### 2. The Dynamic Diagnosis: Misallocation vs. Unemployment
  This is the stronger argument for the asymmetry, and it addresses your point about "invisible losers."

  **Minimum Wage: The Loss is Idle Capacity.**
  The loser in a minimum wage hike is the worker who isn't hired. This is a loss of *volume*. However, labor is mobile. If a teenager can't get a job in fast food, they might go to school, work in retail, or move to a different city. The misallocation is real, but labor is a fluid asset.

  **Rent Control: The Loss is Misallocation (Lock-In).**
  The loser in rent control is often the *migrant* or the *young family* who cannot enter the city. But the deeper economic sin of rent control is **labor misallocation via housing**.
  *   **The Lock-In Effect:** If you have a rent-controlled apartment in San Francisco, you are economically irrational to move to a city with better job prospects if you lose your lease. Rent control traps labor in low-productivity matches.
  *   **The Consensus Driver:** Economists care deeply about aggregate productivity. Rent control creates a "gridlock" where housing doesn't flow to those who value it most (willingness to pay), and labor doesn't flow to where it is most productive. The "apartment-never-built" is a loss of stock, but the "person-stuck-in-wrong-city" is a loss of flow.
  *   **Verdict:** The profession views the dynamic efficiency loss of rent control (locking people in place, stopping new building) as more structurally damaging to growth than the static employment loss of minimum wage.

  ### 3. The Sociological Diagnosis: Price Rationing vs. Non-Price Rationing
  You asked if this is about class intuitions or professional identity. There is a strong element of the latter.

  **Economists Worship the Price Mechanism.**
  The core religion of economics is that prices are information.
  *   **Minimum Wage:** This distorts the price of labor, but the market still clears via *quantity* (unemployment). It's a "clean" distortion. You can measure the unemployment rate.
  *   **Rent Control:** This breaks the price mechanism entirely. When price cannot clear the market, **non-price rationing** takes over. This means queues, bribery ("key money"), discrimination (landlords choose tenants based on race/family status rather than ability to pay), and black markets.
  *   **The Professional Revulsion:** Economists hate non-price rationing more than they hate unemployment. Unemployment is a number; discrimination and black markets are institutional rot. Rent control forces the market underground. Minimum wage keeps the market visible (even if some are excluded). The consensus against rent control is partly a consensus against the *chaos* that ensues when prices are forbidden from doing their job.

  **The "Anti-Landlord" Intuition:**
  You suggested economists feel "anti-landlord." I would argue the opposite. Economists tend to view housing supply as a *capital investment problem*. They sympathize with the *builder*, not necessarily the incumbent landlord. The consensus is "pro-supply." Since rent control is viewed as the enemy of supply, economists oppose it. On minimum wage, they are split between "pro-labor" (workers are people) and "pro-market" (wages are prices). The moral weight of "workers are people" balances the market intuition. The moral weight of "landlords are capital" does not balance the market intuition.

  ### 4. The Ethical Diagnosis: Needs vs. Contracts
  You noted the ethical inconsistency (Nozickians supporting MW, Egalitarians supporting RC). This dissolves if you look at the *justification* each side uses.

  *   **The Minimum Wage Defense:** It is framed as **anti-exploitation**. If monopsony exists, the market wage is *already* coercive (below marginal product). The minimum wage corrects a market failure. It restores fairness.
  *   **The Rent Control Defense:** It is framed as **basic need**. Housing is a merit good. However, economists counter that rent control is a terrible way to help the poor because it benefits *incumbent* tenants (who may be rich) at the expense of *future* tenants (who are poor).
  *   **The Asymmetry:** You can design a minimum wage to target low-income workers broadly. You cannot design rent control to target only the poor without massive bureaucracy (means-testing). Therefore, the *instrumental* ethical case for MW is stronger than for RC, even if the *deontological* case (freedom of contract) is identical.

  ### 5. Does the Asymmetry Survive Scrutiny?
  **Yes.**
  Your observation that the policies are treated differently is correct, and it is not merely confusion.
  *   **Week 3 (Theory):** They are symmetric distortions of competitive equilibrium.
  *   **Week 10 (Evidence):** They are asymmetric distortions of imperfect markets.
      *   Labor markets have frictions that *might* make a floor efficient.
      *   Housing markets have supply constraints that make a ceiling *almost certainly* inefficient.

  The "Second Generation" rent control point you raised is valid, but economists remain skeptical because even tenancy protections reduce turnover. If you can't evict a non-paying or bad-match tenant, the matching efficiency of the housing market drops. The consensus holds because the mechanism (reduced mobility + reduced supply) remains intact even if the hard cap is gone.

  ### 6. What Would Settle It?
  *   **Minimum Wage:** We need better measures of **monopsony power**. If we can map exactly where labor markets are non-competitive, we can predict where MW is harmless/beneficial vs. harmful. The debate is moving toward "context-specific" rather than "universal" verdicts.
  *   **Rent Control:** The debate is effectively settled empirically (it reduces supply/quality), but the *policy* persists because the beneficiaries (incumbents) are organized and the losers (outsiders) are not. Settling this requires **zoning reform**. If housing supply were perfectly elastic, rent control would be less damaging (landlords couldn't restrict supply). Economists oppose RC *because* they oppose Zoning.
  *   **The Ethical Settlement:** We need a theory of **distribution that isn't price-based**. As long as we rely on markets to distribute housing and labor, price controls will be blunt instruments. The settlement would be a shift toward direct subsidies (Housing Vouchers / EITC) which preserve the price signal but alter the distribution. Economists unanimously prefer subsidies to controls. The fact that politicians prefer controls is a political economy problem, not an economic one.

  ### Final Verdict
  Your premise is not confused; it is the correct starting point for advanced economic thinking. The asymmetry exists because **Labor is a flow and Housing is a stock.**

  You can disrupt the flow of labor (MW) and it might self-correct via monopsony adjustments or sectoral shifts. If you disrupt the accumulation of the housing stock (RC), the damage compounds over decades. The profession's consensus reflects a judgment that the long-run dynamic costs of rent control (stagnant cities, locked-in labor) are higher and more certain than the long-run dynamic costs of the minimum wage (automation, reduced hiring).

  The disagreement on MW is a **scientific disagreement** (parameter estimation of elasticity/monopsony).
  The consensus on RC is a **structural judgment** (incentives for capital investment and mobility).

  You are seeing the moment where the map (the diagram) fails to match the territory (the institutions). That is exactly where the interesting economics begins.
