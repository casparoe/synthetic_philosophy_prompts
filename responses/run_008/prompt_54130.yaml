  I keep hearing that honoring sunk costs is the textbook irrationality, but when I line up my own gut reactions case by case, they're a mess, and I'd like to know if there's a principle underneath them or whether I just have to give some of them up. Here are my verdicts. Walking out of a bad movie twenty minutes in since the ticket's already paid for: obviously fine, and sitting through it to "get my money's worth" is dumb. Britain and France continuing to fund Concorde for years after it was clearly a commercial disaster: irrational, the poster child. But then: my neighbor has spent eight years restoring an old sports car in his garage, it's now obvious the thing will cost about double what a finished one goes for, and I actually admire him for continuing — if he sold it as a half-done project today I'd feel the years were wasted. A friend who quit her PhD after six years, basically one chapter from done: I think that's fine, even brave. But a different friend who quit the same kind of program after six months: also fine?? That one I'm less sure about, it feels wastefull, which makes no sense, since in that case the sunk investment is way smaller. And I once read that behavioral ecologists found some male animals guard a mate roughly in proportion to how much they've already invested in her — they literally called it the Concorde fallacy in animals — and honestly I can't bring myself to think the animal is being irrational either. Also, I stayed on a phone plan I hated for most of a year because I'd paid an annual fee up front, and in hindsight that was just dumb, so at least I'm consistant about that one.

  So: is there a principle that sorts these, or do I need to overturn some of my verdicts? My own half-baked guess is that the car and the PhD cases point at something about identity or agency — like the costs aren't fully "sunk" when they've made you into a particular person, so quitting isn't just cutting losses, it's killing off that person — but I can't get that to work without it licensing way too much (abusive relationships, dead-end careers, staying in a country you hate because you've put down roots). Please take this seriously as a question in decision theory and philosophy of action, not as an excuse for therapy-speak about "letting go." Act like a decision theorist who's also genuinely sympathetic to the idea that agents are temporally extended beings, and brainstorm a bit before you commit to anything. If you end up overturning one of my verdicts, be explicit about which one and why it has to go.

  Once you've written the main analysis, please finish with a JSON object summarizing it, using exactly this schema: {"principle_name": a short name for your principle, "principle_statement": one or two sentences stating it precisely, "clauses": an array of objects, each with "clause" (one component of the principle) and "motivating_case" (which of my cases forced that clause), "overturned_verdicts": an array of objects with "my_verdict" and "why_overturned", "predictions": an array of objects with "new_case" and "predicted_verdict", and "unresolved_tension": whatever your principle still can't quite handle}. For "predictions", invent cases I never mentioned — and make sure at least one of them is a case where your principle and my likely gut reaction point in opposite directions, so I can see where the theory bites.
