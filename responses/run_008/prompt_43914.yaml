prompt: |-
  I'm a portfolio manager -- long/short equity, about fifteen years in, CFA, the usual -- and a college friend of mine has gotten deep into effective altruism and keeps telling me they decide where to donate using a framework called importance, tractability, neglectedness. As best I understand it: pick problems that are big, solvable, and that not many people are already working on. He claims this is why he thinks AI risk beats funding mosquito nets in poor countries even though the nets have decades of actual evidence behind them, and that the framework is basically the same reasoning I use every day, just about doing good instead of making money.

  Maybe he's right, but I want it done properly. Restate the ITN framework in the vocabulary I actually use, as faithfully as you can -- importatance relative to market cap vs. addressable market vs. magnitude of the mispricing, tractability as something like capacity to deploy capital and implementation risk, neglectedness as undiscoved alpha or as crowding/alpha decay, and whatever else maps. Then give me the residue report, because that's the part I actually care about: which of their claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all -- and for each piece of residue, whether that's because finance is missing something or because their claim is fuzzier than it sounds. The thing I keep snagging on is the crowding mechanism. When a trade gets crowded, the price moves and the edge is gone -- that's *why* we care about crowding, it's priced in automatically. When a cause gets "crowded," what exactly happens? Does anything move? If there's no price, is neglectedness tracking marginal impact at all, or just virtue-signalling about being early to something? And the nets-vs-AI comparison looks to me like the nets are the trade with a real backtest and AI risk is the narrative stock with the huge TAM, which in my business is a classic way to lose money.

  So: translate it honestly, tell me what doesn't carry, and if the whole comparison just breaks down at some point, say so plainly instead of forcing it into a nice story. Same goes for my own framing -- if my "narrative stock" jab is doing work it shouldn't, or if I'm smuggling in assumptions from markets (like that opportunities get priced efficiently) that don't apply to philanthropy, flag that too. I'd rather find out the analogy is bad than feel clever about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Portfolio Manager (PM), Long/Short Equity, 15 years experience, CFA. Sophisticated, skeptical, quantitative, focused on risk-adjusted returns, market efficiency, and capital allocation.
      *   **Context:** Friend is an Effective Altruist (EA) advocating for the ITN framework (Importance, Tractability, Neglectedness). Friend claims ITN is analogous to investment logic. User is skeptical, specifically about the AI Risk vs. Mosquito Nets comparison (comparing it to Narrative Stock vs. Value/Backtested Trade).
      *   **Task:**
          1.  Translate ITN into Finance/PM vocabulary faithfully.
          2.  Provide a "Residue Report" (what translates, what distorts, what doesn't exist).
          3.  Address specific sticking points: Crowding mechanisms (price vs. impact), the Nets vs. AI comparison (backtest vs. narrative), and underlying assumptions (efficiency in markets vs. philanthropy).
          4.  Tone: Honest, direct, no fluff, acknowledge where the analogy breaks. "I'd rather find out the analogy is bad than feel clever about it."

  2.  **Deconstruct the ITN Framework vs. Finance Logic:**

      *   **Importance:**
          *   *EA Definition:* Scale of the problem (lives affected, suffering reduced).
          *   *Finance Translation:* Total Addressable Market (TAM) or Potential Alpha Pool. How much value is there to be captured/created?
          *   *Nuance:* In finance, value is monetary. In EA, it's utility/welfare.

      *   **Tractability:**
          *   *EA Definition:* Solvability. Can additional resources actually solve the problem? Diminishing returns?
          *   *Finance Translation:* Implementation Risk / Capacity to Deploy Capital. Can we actually execute the trade? Is there liquidity? What is the slippage?
          *   *Nuance:* Finance cares about *profit* tractability. EA cares about *impact* tractability.

      *   **Neglectedness:**
          *   *EA Definition:* How many resources are already going here? Marginal impact of new dollars.
          *   *Finance Translation:* Crowding / Alpha Decay / Market Efficiency. If everyone is long, the alpha is gone.
          *   *Nuance:* This is the user's main sticking point. In markets, crowding moves *price*. In philanthropy, there is no price mechanism. Does crowding reduce *impact* linearly or exponentially?

  3.  **Drafting the Translation (The "PM Speak" Version):**

      *   *Importance* $\rightarrow$ **Magnitude of Mispricing / Total Alpha Pool.** Not just market cap, but the size of the inefficiency.
      *   *Tractability* $\rightarrow$ **Execution Capacity / Implementation Risk.** Can we deploy size without moving the market against us? Is the catalyst identifiable?
      *   *Neglectedness* $\rightarrow$ **Positioning / Crowding / Alpha Decay.** Is the trade crowded? Are we early or late?

  4.  **Developing the Residue Report (The Core Analysis):**

      *   *Clean Translations:*
          *   Marginal thinking (marginal dollar vs. average dollar).
          *   Diminishing returns (capacity constraints).
          *   Opportunity cost (capital allocation).
      *   *Distorted Translations:*
          *   **Crowding/Price Mechanism:** This is the big one. In L/S Equity, crowding *is* the signal (price moves, edge disappears). In Philanthropy, crowding *causes* the edge to disappear (diminishing marginal utility), but there's no ticker tape. It's an *operational* constraint, not a *pricing* constraint.
          *   **Feedback Loops:** Markets have P&L feedback. Philanthropy has vague, long-term outcome feedback.
      *   *No Expression (The Breakdown):*
          *   **Counterfactuals:** In finance, if I don't buy, someone else will (efficient market hypothesis-ish). In philanthropy, if I don't fund AI safety, maybe *no one* does. The "marginal investor" assumption fails.
          *   **Risk Neutrality vs. Risk Aversion:** Finance is usually risk-adjusted return. EA (especially long-termism) can be risk-neutral on existence (preventing extinction trumps all).
          *   **Liquidity:** You can exit a stock. You can't "exit" a donated dollar.

  5.  **Addressing the Specific Comparisons (Nets vs. AI):**

      *   *User's View:* Nets = Backtested Value Trade. AI = Narrative Growth Stock (huge TAM, no earnings).
      *   *EA View:* Nets = Low hanging fruit, high diminishing returns (crowded). AI = High uncertainty, but infinite downside (existence risk), currently underfunded relative to tail risk.
      *   *Finance Critique:* The user is right that AI looks like a "story stock." But the "bankruptcy" of humanity is a binary event that standard NPV doesn't handle well. It's more like buying deep OTM puts on the S&P 500. Expensive, likely zero return, but necessary if the crash happens.
      *   *The "Efficiency" Assumption:* Markets price risk. Philanthropy doesn't. The "inefficiency" in philanthropy is structural (no profit motive to fix AI risk).

  6.  **Refining the Tone:**
      *   Avoid EA evangelism.
      *   Avoid Finance elitism.
      *   Be precise. Use terms like "marginal utility of capital," "signaling vs. pricing," "counterfactual impact."
      *   Acknowledge the user's skepticism is valid regarding the "pricing" mechanism.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe compare AI risk to Venture Capital.
      *   *Correction:* No, VC expects financial return. AI safety is more like Insurance or Catastrophe Bonds.
      *   *Check:* Did I answer the "crowding" question specifically?
      *   *Answer:* Need to explain that in philanthropy, crowding increases the *cost per unit of impact*, whereas in finance, crowding decreases the *expected return per unit of risk*. Similar outcome (lower alpha), different mechanism (diminishing returns vs. price arbitrage).
      *   *Check:* Did I address the "Narrative Stock" jab?
      *   *Answer:* Yes, validate it. AI risk *is* speculative. But the payoff structure is non-linear (preventing ruin).

  8.  **Final Polish:** Organize into clear sections: Translation, Residue Report (Green/Yellow/Red), and The Verdict on the Analogy. Ensure the "Residue" section explicitly answers "Finance missing something" vs "EA claim fuzzy."

  **(Self-Correction Note on "Neglectedness"):** I need to be careful not to say neglectedness is *exactly* alpha. Alpha is excess return. Neglectedness is marginal impact. If a field is neglected, the marginal dollar does more. If a trade is neglected (uncrowded), the marginal dollar *might* do more, but only if the thesis is right. In EA, the thesis (AI is dangerous) is the hard part. In finance, the thesis (stock is undervalued) is the hard part. The parallel holds, but the verification differs.

  **(Self-Correction on "Price"):** The user asks: "If there's no price, is neglectedness tracking marginal impact at all?"
  *Answer:* It tracks *resource allocation efficiency*. If 100 people work on a problem, the 101st person adds less than the 1st. That's diminishing marginal returns. It's a physical/operational constraint, not a market clearing price. I need to make this distinction sharp.

  9.  **Final Output Structure:**
      *   Introduction: Acknowledge the sophistication of the question.
      *   Part 1: The Translation Table (ITN $\rightarrow$ PM Speak).
      *   Part 2: The Residue Report (What works, what breaks).
      *   Part 3: The Crowding Mechanism (Addressing the specific snag).
      *   Part 4: Nets vs. AI (The specific trade comparison).
      *   Conclusion: Final verdict on the analogy.

