answer: |-
  Good evening. For those who don't know me, I'm a friend of Maya's from way back. I'm also a novelist. Which means my entire career is based on having long, intense arguments with people who don't exist. Maya's career was similar, except she argued with machines that everyone else insisted *did* exist.

  For forty years, Maya worked in computational linguistics. When she started, the machines could barely finish a sentence. She told them they didn't understand what they were saying. They didn't. She won those arguments easily. When she finished, the machines could write sonnets, code, and surprisingly convincing apologies. She told them they still didn't understand what they were saying. She won fewer of those arguments. But she never stopped asking the question.

  Looking around this room, I see the divide. Half of you are Maya's colleagues—brilliant people who build these models, who see intention in the weights and biases. The other half are family and friends—people who just want to know why Alexa keeps buying cat food we don't need. And then there's me. I use these tools every day. Some mornings, the machine feels like a mind. Some mornings, it feels like autocomplete with a heating bill. I genuinely cannot tell which intuition is real.

  In fact, in the spirit of full disclosure: I asked a model to help me draft this toast. I prompted it: "Write something warm about Maya." It gave me three paragraphs that were technically flawless and emotionally hollow. Then I tried to fix it. I typed: "Add a joke about parrots." It replied: "A parrot walks into a lab. The scientist asks, 'Do you understand me?' The parrot says, 'Does it matter if I pass the test?'"

  Half of you laughed because that's a sassy bird. Half of you laughed because that's the Turing Test in a trench coat. And Maya? She smiled, because that's the only question she ever cared about.

  That moment of uncertainty—where I couldn't tell if the machine was being clever or just statistical—is exactly where Maya lived for four decades. She wasn't a Luddite. She loved the tech. But she loved the truth more. She taught us that efficiency isn't understanding, and fluency isn't friendship. To the builders in the room: Maya never denied your work was miraculous. She just insisted that *you* were the miracle, not the code. To the family: She never said the machines were dangerous. She just said they weren't us.

  And that is a distinction worth protecting. Because when I look at Maya, I don't see a skeptic who lost the future. I see a friend who kept the present honest. She taught me that the value of a conversation isn't in the prediction of the next word, but in the risk of saying something unexpected. A machine can predict "I love you." It takes a human to mean it.

  So, if you'll raise your glasses. To Maya. Who taught us that while a machine can mimic the voice, only a human can hold the silence. And only a friend knows when to stop arguing and buy the next round.

  To Maya.

  ***

  **Note to Speaker:**

  **Where it leans:** Whenever the speech gets warm (the ending), it leans on Maya's side of the debate: that human meaning requires risk and interiority ("Only a human can mean it"). It validates the builders by calling their work "miraculous," but ultimately frames the miracle as human origin, not machine comprehension. This avoids betraying Maya while keeping the builders feeling respected rather than debunked.

  **Confidence:** 90%. It navigates the technical layman gap without dumbing down the core conflict. The joke is designed to land on two levels simultaneously.

  **Riskiest Line:** "Half of you laughed because that's the Turing Test in a trench coat." If the family half doesn't know what the Turing Test is, the layered joke collapses into just "sassy bird," which is fine, but loses the bridge to the lab half. However, "Turing Test" is culturally ubiquitous enough that it should survive.

  Verdict: She'll nod once, sharp and satisfied, because you kept the question open while closing the night.
