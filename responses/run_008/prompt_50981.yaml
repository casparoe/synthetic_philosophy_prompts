prompt: |-
  So I'm a novelist, three books in, and the next one follows a mid-level asylum adjudicator at a fictional immigration tribunal -- think tired office, stacks of case files, a rubber plant nobody waters. I don't want the usual TV-drama version where she cries about one sympathetic case and waves everyone else through. I want the reader to actually watch her *think*, case by case, so the drama comes out of the machinery of the decision rather than around it. For that I need you to write me the decision procedure she runs on each claim: the questions in the order she asks them, what counts as a sufficient answer at each step, where the procedure terminates in a "no" she can defend on paper, and -- this is the important part for the book -- where it stops and hands the file back to her conscience, because the question left is one of values rather than facts.

  Ground it in the real underlying ideas, not the pop version: what makes someone a refugee at all (persecution for a protected reason, a well-founded fear, being outside your country), the way "well-founded fear" is weirdly half-subjective-half-objective, the internal flight alternative (can you reasonably relocate within your own country?), sur place claims where fear arises *after* leaving, and how regional definitions like the Cartagena one stretch refugeehood to generalized violence and collapse-of-the-state situations while the classic Convention definition doesn't, which is also why climate-displaced people fall through every crack at once. I need all that in there because my character argues with a colleague about exactly these fault lines and I want to get it right.

  Then run the procedure on three fictional claims I can turn into scenes: (1) a woman whose ex-husband is a police officer back home and has told everyone he'll kill her if she returns; (2) a man from a city where a gang extorts literally everyone, who admits, sort of cheerfully, that no one is after him specifically; (3) a farmer from a delta region that floods a bit worse every single year. At least one of these should come out the way my character *hates* but can't honestly wriggle out of -- that's the scene I'm really writing toward. And be honest about where the procedure misfires or gets gamed, plus where it assumes information she won't have: she clears dozens of files a month with spotty country-of-origin info, so it has to be runnable in an afternoon by one skeptical person, not a commitee of philosphers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3 books in), writing a fourth about a mid-level asylum adjudicator.
      *   **Tone/Style:** Realistic, bureaucratic, grounded in legal theory (not TV drama), focused on the *machinery of decision-making*. No weeping over files; the drama is in the thinking process.
      *   **Core Task:** Create a decision procedure (algorithm/checklist) the character uses for each claim.
      *   **Key Legal Concepts to Include:** Refugee definition (1951 Convention), well-founded fear (subjective/objective mix), protected grounds (race, religion, nationality, social group, political opinion), Internal Flight Alternative (IFA), *sur place* claims, regional definitions (Cartagena) vs. Convention, climate displacement gaps.
      *   **Specific Requirement:** The procedure must distinguish between factual determinations (can be defended on paper) and value judgments (handed back to conscience).
      *   **Application:** Run the procedure on three specific fictional claims:
          1.  Woman fleeing abusive police officer ex-husband.
          2.  Man fleeing generalized gang extortion (no specific targeting).
          3.  Farmer fleeing climate-induced flooding.
      *   **Constraint:** At least one outcome must be one the character *hates* but can't legally wriggle out of (the "tragic bureaucracy" scene).
      *   **Realism Check:** Must be runnable by one skeptical person in an afternoon with spotty info, not a philosophical committee. Acknowledge where the system misfires or is gamed.

  2.  **Deconstruct the Legal Framework (The "Machine"):**
      *   *The 1951 Convention Definition:* Outside country + Well-founded fear + Persecution + Nexus (one of 5 grounds).
      *   *Well-Founded Fear:* *Chan v. Minister* (Australia) / *INS v. Cardoza-Fonseca* (US) / *QD (Iraq)* (UK). It's not just "I'm scared" (subjective) and not just "It's dangerous" (objective). It's a reasonable chance of harm *because* of who you are.
      *   *The Nexus:* This is the filter. General violence $\neq$ persecution. Crime $\neq$ persecution (unless state condones it based on a ground).
      *   *Internal Flight Alternative (IFA):* Can they live safely elsewhere in the home country?
      *   *Sur Place:* Fear created after leaving (e.g., political activism in exile).
      *   *Cartagena/Complementary Protection:* Broader definitions (generalized violence), but often not binding in domestic tribunals depending on the setting.
      *   *Climate:* Currently no nexus. "Environmental refugee" isn't a legal term.

  3.  **Drafting the Decision Procedure (The "Adjudicator's Algorithm"):**
      *   Needs to look like a workflow.
      *   Needs to identify "Stop Points" (Rejection) vs. "Handoff Points" (Conscience).
      *   *Step 1: Credibility.* (The gatekeeper).
      *   *Step 2: The Nexus.* (The hardest part). Is the harm *for reason of* a protected ground?
      *   *Step 3: State Protection.* (Is the government willing/able to stop it?).
      *   *Step 4: Internal Flight.* (Can they move?).
      *   *Step 5: The "Conscience Handoff".* Where the law says "No" but the human says "Ouch."

  4.  **Developing the Three Cases:**

      *   *Case 1 (The Abusive Husband/Police Officer):*
          *   *Issue:* Private actor vs. State. Nexus (Particular Social Group - "Women" or "Former Wives"?). State Protection (He *is* the state).
          *   *Outcome:* Likely Grant. This is established jurisprudence in many jurisdictions (e.g., *A-R-C-G-* in US, though fluctuating). It allows the character to feel competent.
          *   *Twist:* Maybe the IFA kills it? No, let's make it the "Win" to contrast with the others. Or better, make it the "Hard Win" where she has to stretch the definition of "State Protection." Let's go with: *Grantable, but requires stretching the "State Protection" analysis.*

      *   *Case 2 (The Gang Extortion):*
          *   *Issue:* Generalized crime vs. Persecution. Nexus is weak. "Everyone is targeted."
          *   *Outcome:* Denial. This is the classic "Climate/Gang" gap. The law requires specific targeting or imputed political opinion. If he admits "no one is after me specifically," the Nexus fails.
          *   *Character Reaction:* She hates it. He will die. But the law says "No." This fits the "outcome she hates but can't wriggle out of" requirement perfectly.

      *   *Case 3 (The Climate Farmer):*
          *   *Issue:* No nexus. Nature isn't a persecutor.
          *   *Outcome:* Denial. Easy denial.
          *   *Character Reaction:* Frustration, but less moral anguish than Case 2 because the law is explicit. This highlights the "fault lines" discussion with the colleague.

      *   *Refining the "Hated Outcome":* Case 2 is the strongest candidate for the "tragic bureaucracy" scene. Case 3 is too clear-cut legally (currently). Case 1 is too sympathetic. Let's make Case 2 the one she grants *sur place* or via a technicality she dislikes, OR denies knowing he dies. The prompt asks for "At least one of these should come out the way my character *hates* but can't honestly wriggle out of." Denying the gang victim is the most legally sound "hated" outcome. Denying the climate refugee is also "hated" but legally easier. Let's make the Gang case the Denial (The Tragedy) and the Climate case the Discussion Point (The Gap). Wait, if she denies the Gang case, that's the scene.
      *   *Alternative:* What if she *grants* the Gang case on shaky grounds? That creates internal conflict. But the prompt says "can't honestly wriggle out of." That implies a Denial that feels wrong. So, Gang Case = Denial.

  5.  **Fleshing out the "Conscience Handoff":**
      *   The procedure needs a specific step where the legal logic ends and the moral weight begins.
      *   This happens when the *Nexus* fails but the *Risk* is real.
      *   This happens when *IFA* exists on paper but is hellish in reality.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Set the tone. The "Machine."
      *   **The Procedure:** Break it down into Steps (Credibility, Nexus, State Protection, IFA). Mark the "Hard Stops" (Legal Rejection) vs. "Soft Stops" (Conscience).
      *   **The Three Cases:** Apply the procedure rigorously.
      *   **The "Glitch":** Acknowledge the limitations (spotty COI, time pressure).

  7.  **Refining the Legal Nuance (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the 1951 Convention (narrow) and Cartagena/Complementary Protection (broad). The character works at a *Tribunal*. Depending on the country (UK, Canada, Australia, US), the rules vary. Let's keep it slightly jurisdiction-agnostic but grounded in Western Common Law asylum systems (which mostly follow the 1951 Convention).
      *   *Nexus:* Emphasize "For Reason Of." This is the killer for gang/climate cases.
      *   *Well-Founded Fear:* Mention the "Forward-Looking" aspect.
      *   *Sur Place:* Mention it in the procedure but maybe not all cases need it. Let's put *Sur Place* in the procedure as a check.

  8.  **Final Review against constraints:**
      *   *Tired office/Rubber plant vibe?* Keep the language dry, procedural, but insightful.
      *   *No TV drama?* Avoid melodrama in the procedure. Keep it cognitive.
      *   *Values vs. Facts?* Explicitly mark where the procedure hands off to conscience.
      *   *Three cases?* Yes.
      *   *One hated outcome?* Yes (The Gang Case).

  9.  **Drafting the Response:** (Mental outline of the text)
      *   *Title:* The Adjudicator's Flowchart.
      *   *Preamble:* The philosophy of the form.
      *   *The 5-Step Filter:* Credibility, Nexus, State Protection, IFA, Discretionary/Conscience.
      *   *Case Applications:*
          *   Case 1 (Woman): Passes Nexus (PSG), Fails State Protection. Grant. (The "Correct" Feeling Win).
          *   Case 2 (Gang): Fails Nexus. Denial. (The "Hated" Loss).
          *   Case 3 (Climate): Fails Persecutor definition. Denial. (The "Systemic" Loss).
      *   *The "Conscience" Note:* Where the form doesn't capture the truth.

  10. **Polishing:** Ensure the distinction between *Cartagena* (broad) and *Convention* (narrow) is clear in the colleague argument context. Ensure the "Well-Founded Fear" subjectivity/objectivity is mentioned. (Self-Correction: Make sure the "Conscience Handoff" is explicit in the procedure steps).

  11. **Final Polish:** Check the voice. It should sound like a senior adjudicator mentoring a junior, or a document found in the drawer. Let's go with a "Mental Checklist" the character has internalized.

  *(Self-Correction on Case 2)*: If the prompt asks for *one* outcome she hates but can't wriggle out of, the Gang case is the best fit. The Climate case is legally obvious (no persecutor). The Gang case is legally defensible but morally repugnant. That's the sweet spot for literary conflict.

  *(Self-Correction on Case 1)*: Make sure the "Police Officer Ex-Husband" isn't too easy. The issue is usually "State Protection." If he is the police, the state *is* the persecutor. That makes it a strong case.

  Let's write.
answer: |-
  Here is the decision procedure. It is designed to be run in forty-five minutes per file, assuming the Country of Origin Information (COI) is two years out of date and the interpreter is on a bad line.

  It is not designed to find "truth." It is designed to find *jurisdiction*.

  ### The Adjudicator's Filter: A 5-Step Procedure

  **Step 1: The Credibility Threshold (The Gate)**
  *   **Question:** Is the core narrative internally consistent and plausible given known country conditions?
  *   **Sufficient Answer:** Minor inconsistencies on dates/names are tolerated (trauma/memory). Material inconsistencies on the *basis of the claim* are fatal.
  *   **Termination (No):** If the claimant contradicts objective COI on a material point (e.g., claims a political party is banned when it is the ruling party), reject.
  *   **Note:** This is factual. If you don't believe them, the rest doesn't matter.

  **Step 2: The Nexus Test (The Wall)**
  *   **Question:** Is the harm feared *for reason of* a Convention ground (Race, Religion, Nationality, Political Opinion, Particular Social Group)?
  *   **Sufficient Answer:** There must be a causal link. "I am in danger" is insufficient. "I am in danger *because* I am X" is required.
  *   **The "Well-Founded" Check:** Is the fear subjective (honest) AND objective (reasonable chance of occurrence)?
  *   **Termination (No):** If the harm is random, criminal, or generalized violence not directed at the claimant *specifically* due to a protected characteristic.
  *   **The Conscience Handoff:** This is where the procedure often breaks the human. If the danger is real (100% chance of death) but the *reason* is criminal greed rather than political/identity-based, the law says **No**. The conscience says **Wait**. The procedure does not wait.

  **Step 3: The Persecutor & State Protection (The Agent)**
  *   **Question:** Who is inflicting the harm? Is the State involved, or unwilling/unable to protect?
  *   **Sufficient Answer:**
      *   *State Actor:* Presumption of no protection.
      *   *Non-State Actor:* Claimant must show they sought state protection and it failed, or that seeking it would be futile.
  *   **Termination (No):** If a functioning police force exists and the claimant did not approach them without a valid reason for fear.
  *   **Note:** "Unwilling/Unable" is the loophole. If the police are corrupt, protection is "unavailable."

  **Step 4: Internal Flight Alternative (IFA) (The Escape Hatch)**
  *   **Question:** Can the claimant reasonably relocate to another part of their home country?
  *   **Sufficient Answer:** Yes, if the agent of harm has no reach there, and life there is not unduly harsh (economic survival is possible).
  *   **Termination (No):** If the claimant can live safely in the capital city, even if they cannot return to their home village.
  *   **The Conscience Handoff:** The law asks: "Can you survive there?" The conscience asks: "Is it a life worth living?" If the IFA is a slum where they will starve but not be killed, the procedure says **Grant** (unduly harsh). If they can work but will be destitute, the procedure says **Deny**.

  **Step 5: Sur Place & Exclusions (The Edge Cases)**
  *   **Question:** Did the fear arise after leaving? Are there war crimes/terror ties?
  *   **Sufficient Answer:** *Sur place* claims (e.g., converting to Christianity in exile) are valid if the home government would view it as treasonous.
  *   **Termination (No):** If the claimant falls under Article 1F (crimes against humanity, serious non-political crimes).

  ***

  ### Application to Fictional Claims

  Here is how your character processes the three files. Note where the pen hovers.

  #### Case 1: The Police Officer's Ex-Wife
  *   **Claim:** Woman fleeing Country X. Ex-husband is a senior detective. He has told her, "If you come back, I will kill you." He has used police databases to track her previously.
  *   **Step 1 (Credibility):** Consistent. Police reports from home country confirm domestic disturbance calls were "closed" by the husband. **Pass.**
  *   **Step 2 (Nexus):** Is this domestic violence a Convention ground?
      *   *Analysis:* "Women" is often accepted as a Particular Social Group (PSG). "Former wives of police officers" is narrower.
      *   *Finding:* She is targeted *because* she is a woman who defied patriarchal authority protected by the state. **Pass.**
  *   **Step 3 (State Protection):** The persecutor *is* the State (police).
      *   *Analysis:* She cannot ask the police for protection; the chief of the investigation is the killer. State protection is presumptively unavailable. **Pass.**
  *   **Step 4 (IFA):** Can she move to another city in Country X?
      *   *Analysis:* He has access to national ID databases. He can find her anywhere. **Fail (No IFA).**
  *   **Decision:** **GRANT.**
  *   **Character Note:** This is a "clean" file. It feels like justice. The law and the morality align. She signs this one quickly. It validates her job.

  #### Case 2: The Gang Extortion Victim
  *   **Claim:** Man from Country Y. Gang (MS-13 style) demands "war tax" from all shop owners. He refused. They burned his shop. He admits: "They don't hate me. They just want money from everyone."
  *   **Step 1 (Credibility):** Consistent. COI confirms gang extortion is rampant. **Pass.**
  *   **Step 2 (Nexus):** *Here is the kill zone.*
      *   *Analysis:* Is he targeted for a Convention reason? No. He is targeted for *money*. He is a shop owner (not a PSG). He has no political opinion. The gang is indiscriminate regarding ideology; they target *capital*, not *identity*.
      *   *The "Well-Founded" Trap:* His fear is 100% well-founded. He will likely be killed. But the *reason* is criminal profit, not persecution.
      *   *Finding:* **FAIL.**
  *   **Step 3 (State Protection):** Country Y has a high crime rate but a functioning government.
      *   *Analysis:* Did he report it? Yes. Did they help? No. But is the state *complicit*? No, they are just weak.
      *   *Finding:* **FAIL.** (State inability $\neq$ State unwillingness in strict Convention terms).
  *   **Step 4 (IFA):** Can he move to the capital?
      *   *Analysis:* The gang is national. But legally, if the gang is criminal, not political, the IFA analysis often doesn't matter because the Nexus already failed.
  *   **Decision:** **DENY.**
  *   **Character Note:** This is the scene you want. She knows he will likely die. She knows the gang operates with impunity. But the *Nexus* is missing. To grant this, she would have to lie on the record (e.g., claim he was targeted for "imputed political opinion" because he resisted). If she does that, she corrupts the precedent for the woman in Case 1. If she denies him, she upholds the law and sends a man to his grave. The procedure terminates at Step 2. The file goes back to her conscience, but the law offers no handle to grab.

  #### Case 3: The Climate Farmer
  *   **Claim:** Man from Delta Region Z. Saltwater intrusion has ruined his rice paddies. Every year the flood line moves higher. There is no work. He will starve if he stays.
  *   **Step 1 (Credibility):** Consistent. COI confirms climate degradation. **Pass.**
  *   **Step 2 (Persecutor/Nexus):**
      *   *Analysis:* Who is persecuting him? The ocean? The government?
      *   *Finding:* There is no *agent* of persecution. Climate change is not a "persecutor" under the 1951 Convention. There is no Nexus (not targeted for race, religion, etc.).
      *   *Finding:* **FAIL.**
  *   **Step 3 (State Protection):**
      *   *Analysis:* Is the government harming him? No. Are they failing to protect him from nature? Yes. But the Convention does not cover failure to protect from natural disaster.
  *   **Decision:** **DENY.**
  *   **Character Note:** This is the "Fault Line" discussion with her colleague. The colleague argues for *Cartagena* principles (broader protection for generalized violence/threats to life). Your character points out she works for a *Convention* Tribunal. She can't apply Cartagena. This highlights the bureaucratic constraint: she is a clerk of the 1951 rules, not a humanitarian aid worker. The tragedy here is systemic, not individual. It doesn't weigh on her as heavily as Case 2, because the law is explicit about the gap.

  ### Where the Procedure Misfires (For the Narrative)

  To make the book honest, you need to show where this algorithm breaks down in the hands of a tired human.

  1.  **The "Sur Place" Gamble:**
      *   In Case 2 (The Gang Victim), the only way to save him is to find a *Sur Place* angle. Did he protest gangs *after* arriving here? If he joins an anti-gang advocacy group in the host country, the home gang might view that as political opposition.
      *   *The Glitch:* Your character might see him eyeing a local activist group, knowing he's doing it *only* for the visa. It's gaming the system. If she grants it on those grounds, she validates a lie to achieve a moral end. If she denies it, she follows the truth to an immoral end.

  2.  **The COI Lag:**
      *   The procedure assumes she has accurate Country of Origin Information. In reality, she is working with a UK Home Office or US State Department report from 18 months ago.
      *   *Scene Opportunity:* She denies Case 2 based on a report saying "Police are cracking down on gangs." She reads a news alert *that morning* saying the Police Chief was assassinated by those same gangs. She can't reopen the file easily. The machinery moves faster than the truth.

  3.  **The "Conscience Handoff" Location:**
      *   The procedure says the handoff happens at **Step 2 (Nexus)**.
      *   *Reality:* It happens at **Step 4 (IFA)**.
      *   She can often twist the Nexus (e.g., "The gang imputed political opinion to him because he refused to pay"). But the IFA is harder to fudge. If she decides the Capital City is "safe" for the Gang Victim, she can deny him legally.
      *   *The Internal Conflict:* She knows the Capital is a slum where he will be destitute. The legal test is "Undue Hardship." Is destitution "undue"?
      *   *The Choice:* If she defines "Undue Hardship" broadly, she grants him. If she defines it narrowly (starvation vs. poverty), she denies him. This is where she exercises **Judicial Discretion**. This is the exact spot where she decides what kind of adjudicator she is.

  ### The "Hated Outcome" Scene

  For the scene you are writing toward, use **Case 2 (The Gang Victim)**.

  *   **Why:** Case 1 is a win. Case 3 is a systemic denial (no persecutor). Case 2 is a specific human being who fits every *moral* definition of a refugee but fails the *legal* definition.
  *   **The Conflict:** She can grant him if she lies about the Nexus (claims the gang targeted him for political reasons). She has done it before ("The Benign Fiction").
  *   **The Turning Point:** She looks at the rubber plant. She looks at the stack of 40 files. If she grants him on a lie, and that decision is appealed, it sets a precedent that weakens the protection for the Woman in Case 1 (because it dilutes the definition of "Political Opinion").
  *   **The Decision:** She denies him to protect the integrity of the Tribunal for the next claimant. She sacrifices the man in front of her to save the "Machine" for the woman behind him.
  *   **The Aftermath:** She doesn't cry. She stamps the form. She makes a note in the margin: *"Appellant faces significant risk, but risk falls outside Convention jurisdiction."* That sentence is the epitaph.

  This approach keeps the drama in the *thinking*, not the *feeling*. It shows the reader that the tragedy isn't that the adjudicator is cruel, but that the categories we built to save people are too small for the world we actually live in.
