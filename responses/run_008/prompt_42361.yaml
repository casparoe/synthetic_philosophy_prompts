      *   **Task:** Audit the analogy properly.
          *   Create a correspondence table (Euclid's axioms $\leftrightarrow$ ?, PP $\leftrightarrow$ ?, Hyperbolic plane $\leftrightarrow$ ?, Physical space $\leftrightarrow$ ?).
