answer: |-
  You are stranded late at night in a safe but inconvenient industrial park; an Uber would cost \$50, but you have no signal. Elena, a passing freelancer with a truck, offers a ride home for \$200 payable via Venmo once you arrive, with no contract or collateral. She is a shrewd judge of character: she knows that once you are safe in your living room, a purely rational actor would realize \$200 is usurious for a \$50 service and refuse to pay, knowing she cannot sue for such a small amount. She will only drive you if she reads you as the type who pays debts out of guilt rather than calculation. If she drives you, the ride provides \$100 of value (safety and comfort), but paying the \$200 debt leaves you net -\$100 compared to your current stranded state. If you are the rational type who refuses to pay, she leaves you stranded (utility \$0); if you are the irrational type who pays, she rescues you, but you end up poorer than if you had stayed put.

  ### Decision-Theoretic Breakdown

  **Causal Decision Theory (CDT):** At the moment of payment, the ride is a sunk cost. Causal influence flows forward; paying now cannot change the fact that you are already home. Since paying costs \$200 and not paying costs \$0, CDT dictates *Don't Pay*. Anticipating this, Elena predicts you are rational and denies the ride. You remain stranded (Utility: 0). CDT agents lament this outcome but view the payment as irrational.

  **Evidential Decision Theory (EDT):** EDT treats your decision as diagnostic of your type. Paying is strong evidence that you are the type Elena helps. While the payment doesn't causally affect the past prediction, EDT agents often "one-box" in Newcomb-like scenarios to correlate with the favorable prediction. An EDT agent pays to maintain the correlation. You arrive home but lose \$100 net (Utility: -100). EDT fails here because it values the evidence of being a "payer" higher than the actual monetary loss, effectively walking into the trap.

  **Updateless Decision Theory (UDT):** UDT selects a policy *ex-ante*, before Elena makes her prediction. It compares two policies: (1) "If rescued, Pay" (leads to Rescue, then -\$200 cost; Net -\$100) and (2) "If rescued, Don't Pay" (leads to No Rescue; Net \$0). Since \$0 > -\$100, UDT selects the policy *Don't Pay*. Elena predicts this policy and denies the ride. You remain stranded (Utility: 0). Unlike CDT, UDT doesn't lament this; it recognizes that acquiring the disposition to pay is instrumentally harmful in this specific environment.

  ### The Structural Feature
  The work is done by **Negative Expected Value of the Disposition**. In Parfit's original Hitchhiker, the cost of paying (\$100) is less than the benefit of life (\$1,000,000), so the disposition to pay has positive expected value. In this "Toxic Hitchhiker" case, the predictor (Elena) is not a mutually beneficial partner but a *predator*. She exploits the correlation between trustworthiness and gullibility. The structure transforms the "rational irrationality" of commitment from a shield (protecting you from your own future defection) into a target (marking you for exploitation).

  ### The Gauthier-Style Move
  David Gauthier argues in *Morals by Agreement* that it is rational to cultivate a disposition of "constrained maximization" (cooperating when others do) because it makes you a desirable partner. The standard regress objection asks: *Can you rationally choose a disposition whose value you can only recognize once you already have it?*

  This scenario bypasses the regress objection to hit a harder wall: **The disposition has negative ex-ante value.** You do not need to already have the disposition to see that it loses money. A Gauthier-style agent would scan the environment, see that "trustworthiness" is being priced at a loss, and rationally choose *not* to cultivate the disposition. This undermines the "rational irrationality" response to the Hitchhiker by showing that rationality only favors dispositional change when the environment offers a *cooperative surplus*. If the environment is predatory, rationality demands you remain "rational" (untrustworthy) and forego the benefit. Being the sort of person who pays is only rational if the toll is less than the bridge is worth.

  ### Restoring the Standard Lesson
  To restore the lesson that being disposed to keep one's word dominates, apply this minimal change: **Reduce the debt to \$50.**

  If the ride is worth \$100 and the debt is \$50, the net utility of being rescued and paying is +\$50. The net utility of being stranded is \$0. Now, the policy "If rescued, Pay" yields higher expected utility than "If rescued, Don't Pay." UDT selects the policy to pay, Elena predicts it, and you get the ride. The disposition to pay becomes an asset rather than a liability, returning the case to the standard Hitchhiker dynamic where rationality requires binding your future self.
