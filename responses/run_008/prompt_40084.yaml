  This is a classic jurisprudential puzzle, echoing the famous mid-20th-century debate between H.L.A. Hart (legal positivism) and Lon Fuller (natural law theory). Your sister's record suggests she is not a simple positivist (who would say the informer statute *is* law) nor a radical natural lawyer (who would say the pass laws are *not* law). She occupies a nuanced middle ground.

  Based on her verdicts, here are the two strongest candidate rules she is running, followed by predictions for your new cases and a design for a decisive test.

  ### Candidate Rule 1: The Procedural Integrity Theory (Fullerian)
  **The Rule:** A rule counts as law only if it satisfies the "internal morality of law." It must be general, public, prospective (not retroactive), clear, and—crucially—there must be **congruence** between the rule as announced and the rule as actually enforced.
  *   **Why it fits:** It explains why the Secret Decree failed (secret/retroactive) and why the Modern Regulation succeeded (procedurally sound). It explains the Pass Laws verdict (they were procedurally sound, even if evil). Most importantly, it explains the Informer Statute verdict *specifically because* she claimed officials looked the other way. To a proceduralist, a law that is enforced arbitrarily is not a law at all.
  *   **The Cost:** If she holds this rule, she must admit that a strictly enforced, procedurally perfect evil statute (like the new Guest Reporting case) **is** law.

  ### Candidate Rule 2: The Civic Complicity Theory
  **The Rule:** A rule counts as law unless it conscripts ordinary citizens into becoming active agents of injustice. Laws that restrict the freedom of victims (pass laws) are still laws; laws that force neighbors to betray neighbors (informer statutes) are not.
  *   **Why it fits:** It perfectly distinguishes the Pass Laws (victims restricted) from the Informer Statute (citizens weaponized). It also fits the Secret Decree (arbitrary power) and Modern Regulation (mere inconvenience).
  *   **The Cost:** She has to explain why "active complicity" destroys legal status while "substantive evil" does not. It also struggles with the Secret Decree verdict (which was likely about secrecy, not complicity).

  ---

  ### Predictions for the New Cases

  Here is how each rule predicts she will rule on your three new scenarios, followed by my best guess.

  #### Case 1: The Strictly Enforced Guest Reporting Statute
  *   **The Scenario:** Clear, prospective, published, but **enforced exactly as written against everyone.**
  *   **Procedural Integrity Prediction:** **Law.** The procedural flaw from the original Informer case (inconsistent enforcement) is fixed. It now meets all criteria of the internal morality of law.
  *   **Civic Complicity Prediction:** **Not Law.** It still requires ordinary citizens to actively police and report their peers, turning them into agents of the regime.
  *   **My Best Guess:** **Law.**
      *   **Reasoning:** Her concession on the Pass Laws is the heaviest piece of evidence. She admitted that substantive evil does not strip a rule of its legal character if the process is orderly. In the original Informer argument, she explicitly leaned on the *enforcement inconsistency* ("officials looked the other way") rather than the moral horror of informing. If she were a Complicity theorist, she wouldn't have needed to make that factual excuse; she could have just said "forcing people to inform isn't law." By fixing the enforcement, you remove her stated objection. She will likely be uncomfortable, but consistent with her Pass Law verdict, she will have to call this law.

  #### Case 2: Retroactive Punishment of Old Regime Torturers
  *   **The Scenario:** Democratic parliament, clear, published, but **retroactive.**
  *   **Procedural Integrity Prediction:** **Not Law.** Fuller argued that retroactivity violates the internal morality of law because it cannot guide conduct (you can't obey a law that doesn't exist yet). The source (democracy) doesn't cure the procedural defect.
  *   **Civic Complicity Prediction:** **Law.** This does not conscript citizens into doing wrong; it punishes past wrongdoers. The substantive justice is high.
  *   **My Best Guess:** **Not Law.**
      *   **Reasoning:** She was absolute on the Secret Decree ("not law") because it was retroactive and secret. While this new statute is democratic, her jurisprudence seems anchored in the *form* of the law, not just the *source*. If she accepts that evil laws can be law (Pass Laws), she must accept that good laws can be procedurally defective. To call this "law" would undermine her objection to the Secret Decree. She will likely argue this is an act of *justice* or *war*, but not a valid *statute* in the rule-of-law sense.

  #### Case 3: The Vague and Arbitrary Statute
  *   **The Scenario:** General, published, prospective, but **vague and enforced arbitrarily.**
  *   **Procedural Integrity Prediction:** **Not Law.** Fails the requirements of clarity and congruence. Citizens cannot know how to comply, and enforcement is unpredictable.
  *   **Civic Complicity Prediction:** **Law.** It does not necessarily force citizens to commit active wrongs; it just creates uncertainty.
  *   **My Best Guess:** **Not Law.**
      *   **Reasoning:** This is the easiest call. Almost every theory of law except strict positivism rejects arbitrary, unintelligible rules as "law." Her verdict on the Secret Decree establishes that she values the ability of citizens to know and follow the rules. This case is functionally identical to the Secret Decree in terms of unpredictability.

  ---

  ### The Decisive Test Case

  To tell Rule 1 (Procedural) and Rule 2 (Complicity) apart, you need a case where the procedure is perfect, but the complicity is active—yet the *moral valence* is reversed.

  **Put this case to her next:**

  > "A democratic government passes a clearly worded, published, prospective statute that is enforced consistently against everyone. It requires every householder to **report suspected child abuse** by their neighbors to the authorities. Failure to report is a crime. This is active complicity (policing neighbors), but for a morally good end."

  **How to interpret her verdict:**

  *   **If she says "Not Law":** She is running the **Civic Complicity Theory**. She believes that *any* law turning citizens into informants loses legal status, regardless of whether the cause is good or evil.
  *   **If she says "Law":** She is running the **Procedural Integrity Theory** (with a substantive evil caveat). She accepts active reporting laws as valid *unless* the purpose is evil. This confirms that her rejection of the original Informer Statute was due to the *evil purpose* combined with the *procedural flaw*, not the act of reporting itself.

  ### Can she live with treating the Pass Laws and the Enforced Informer Statute alike?

  If my best guesses are correct, **yes, she can.**

  Her stability comes from prioritizing **Process over Substance**. She has already swallowed the bitter pill of admitting Apartheid laws were "law." She did this to preserve the idea that "law" is a specific institutional practice, not just a synonym for "good rules."

  If she admits the strictly enforced Informer Statute is also "law," she is not conceding that it is *moral* or *binding*. She is merely conceding that it functions as a legal rule. This allows her to say: *"This is a valid law, and therefore the state has the power to enforce it, but it is so evil that we have a moral duty to resist it."*

  This distinction (validity vs. obligation) is the only way to keep her Pass Law verdict consistent without collapsing into the idea that "might makes right." If she refuses to call the Enforced Informer Statute "law," she undermines her Pass Law verdict and reveals that her true rule is actually "Evil + Active Complicity = Not Law," which is a much harder position to defend philosophically.
