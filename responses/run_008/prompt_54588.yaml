      *   *Fix:* Emphasize the "Trusted Computing Base" (TCB). 4CT had a huge TCB (custom code, hardware). Lean has a tiny TCB (the kernel). That's the principled line.
      *   *Critique:* Did I address the "credit rating" analogy?
      *   *Fix:* Explicitly validate it. It's essentially a reputation economy.
      *   *Critique:* Is the "downstream correction" argument strong enough?
      *   *Fix:* Frame it as the "Error-Correcting Code" theory of math. Peer review is the spam filter; usage is the immune system.

  6.  **Final Review:** Check against the prompt's specific sub-questions.
      *   Implicit epistemology? (Social Fallibilism).
      *   Logical uncertainty vs. shorthand? (Logical uncertainty is more honest).
      *   4CT vs. Lean? (Surveyability vs. Trusted Kernel).
      *   What changes if probabilistic? (Nothing structurally, but philosophically we admit risk).
      *   Peer review role? (Filter, not guarantee; downstream usage is the guarantee).

  7.  (Proceed to generate output based on these thoughts.)
answer: |-
  This is one of the sharper questions in the philosophy of mathematics, and you have correctly identified the gap between the *normative ideal* (mathematics as a system of necessary truths established by deductive proof) and the *descriptive reality* (mathematics as a human, social practice operating under resource constraints).

  You are describing the tension between **infallibilism** (the official story) and **fallibilism** (the practice). Here is a reconstruction of the implicit epistemology, the computer-proof paradox, and the role of peer review.

  ### 1. The Implicit Epistemology: Social Fallibilism vs. Logical Omniscience

  You ask whether treating a published theorem as a usable premise requires "logical uncertainty" or if it can be saved as deductivist shorthand.

  **The Strict Deductivist Rescue (The "Shorthand" View)**
  A strict deductivist argues that the *theorem* is indeed 100% true (if the axioms hold), and the *proof* is either valid or invalid. The uncertainty lies only in our *psychological state* regarding the proof, not in the mathematical reality. On this view, saying "I am 90% sure of Lemma 3" is shorthand for "I have not fully verified Lemma 3, but the social evidence suggests it is derivable."
  *   **Problem:** This creates a disconnect between the *warrant for assertion* and the *assertion itself*. If I build a bridge using a lemma I am only 90% sure is derivable, I am engaging in risk management, not deduction. The practice looks Bayesian, even if the ontology is Platonic.

  **The Logical Uncertainty View (The "Credit Rating" View)**
  This is the more honest reconstruction. In formal epistemology, this addresses the **Problem of Logical Omniscience**. Ideal Bayesian agents assign probability 1 to all logical truths. Humans are not ideal agents. We have bounded rationality.
  *   **The Epistemology:** The mathematical community operates on **Social Epistemology of Testimony**. When you cite a theorem you haven't checked, you are not relying on deduction; you are relying on the *testimony* of the referees and the author.
  *   **The "Credit Rating":** You hit the nail on the head. Mathematical knowledge is distributed. The "certainty" of a theorem is a function of:
      1.  The reputation of the author.
      2.  The prestige of the journal (proxy for referee rigor).
      3.  The duration of time since publication without retraction.
      4.  The extent of downstream usage (has it broken anything yet?).

  **Verdict:** The institution presupposes **Fallibilist Social Epistemology**. It treats necessary truths as empirical hypotheses subject to confirmation and falsification over time. We act *as if* they are certain because the probability of error is low enough for our local purposes, but the mechanism of acceptance is inductive/social, not deductive.

  ### 2. The Computer Proof Paradox: 4CT/Kepler vs. Lean/Coq

  You noted the community was queasy about the Four Color Theorem (4CT) and Kepler Conjecture (machine case-checking) but is relaxing into Lean/Coq (formal verification). Is there a principled line?

  **The 4CT/Kepler Objection: Lack of Surveyability**
  The traditional objection to 4CT wasn't just "a computer did it." It was that the proof was **unsurveyable**.
  *   **Perspicuity:** A traditional proof offers *explanation*. It allows a human to see *why* the theorem is true. 4CT was a brute-force reduction.
  *   **The Black Box:** In 4CT, the code was custom, the hardware was fallible, and the logic was embedded in the execution. To verify it, you had to trust the specific hardware and the specific implementation. The "Trusted Computing Base" (TCB) was huge.

  **The Lean/Coq Acceptance: The Trusted Kernel**
  The shift with proof assistants is a shift from *checking cases* to *checking rules*.
  *   **Small TCB:** Systems like Lean rely on a tiny "kernel" (a few thousand lines of code) that checks logical inference rules. The specific proof script can be millions of lines, but it is reduced to atomic steps verified by the kernel.
  *   **Principle of Verification:** We don't trust the proof script; we trust the kernel. We can (and do) write independent kernels to check the same proofs.
  *   **Understanding:** Here is the rub. The community accepts Lean proofs as *true*, but often still distinguishes them from *illuminating*. A Lean proof guarantees validity; it does not necessarily guarantee understanding.
  *   **The Principled Line:** The line is **Formal Verifiability vs. Empirical Execution**. 4CT relied on the empirical fact that the computer didn't crash and the code compiled correctly. Lean relies on the logical fact that the steps follow the rules of the kernel. The former is empirical induction; the latter is (machine-assisted) deduction.

  ### 3. If the Probabilistic Picture is True, What Changes?

  If we admit that mathematical knowledge is actually a network of high-confidence credences, do we need to change our labels?

  **Do we need confidence levels?**
  Practically, no. Math is a foundational language for science and engineering. If you tell an engineer, "This structural load theorem has a 99.5% credence," they cannot build safely. The binary label "Theorem" functions as a **coordination device**. It signals: *Stop checking this and start building on it.*
  *   **Risk Management:** The community manages risk not by labeling probabilities, but by **redundancy**. Crucial theorems (e.g., Fermat's Last Theorem, Classification of Finite Simple Groups) are valuable precisely because multiple groups attack them, or because they are used in many downstream contexts. If a theorem is critical, the community implicitly raises the confidence threshold by demanding more scrutiny.

  **Theorem vs. Well-Supported Conjecture**
  We actually *do* make this distinction, but socially rather than formally.
  *   **Folk Theorems:** Results everyone uses but no one has written down fully.
  *   **Contested Theorems:** Shinichi Mochizuki's Inter-universal Teichmüller Theory (ABC Conjecture). It is published, but the community has not "accepted" it because they cannot verify it. It sits in limbo. It is treated as a "high-stakes conjecture" despite the author's claim of proof.
  *   **The Threshold:** The threshold is **Community Consensus**, not logical completeness. When consensus fractures (as with Mochizuki or the early days of the Classification of Finite Simple Groups), the "Theorem" status wobbles.

  **What would have to change?**
  Philosophical honesty. We would need to stop teaching students that math is the only domain of absolute certainty. We should teach that math is the domain of *highest reliability*, achieved through social error-correction.

  ### 4. The Alternative Hypothesis: Peer Review as Filter, Usage as Guarantee

  You asked if the framing is off because peer review isn't doing the epistemic work. **This is likely the stronger story.**

  **Peer Review is a Sanity Check, Not a Verification**
  As you noted, referees check "what they can in a few months." They look for:
  1.  Plausibility of the main idea.
  2.  Consistency with known results.
  3.  Spot-checking key lemmas.
  They do *not* verify every line. They certify that the paper is *worth reading*, not that it is *true*.

  **The Real Guarantee: Downstream Usage (The Immune System)**
  The epistemic warrant comes from **time and usage**.
  *   **Error Correction:** Errors are found when someone tries to *use* the lemma to prove something else and hits a wall, or when someone tries to generalize the result and finds a counterexample.
  *   **Lakatosian Dynamics:** This aligns with Imre Lakatos's *Proofs and Refutations*. Mathematical knowledge evolves through conjecture, proof, counterexample, and proof-adjustment. A "Theorem" is simply a conjecture that has survived significant attempts at falsification via usage.
  *   **The Web of Belief:** A result becomes "known" when it is woven tightly enough into the web that removing it would cause too much collapse. This is Quinean holism applied to math.

  **Why this is a better story:**
  It explains why we trust Euclid more than a random arXiv preprint from yesterday, even if both are "deductive." It explains why the Classification of Finite Simple Groups is accepted despite no single human knowing it all: because the *consequences* have been tested for 40 years. It explains why we accept Lean proofs: because the *kernel* has been tested by usage.

  ### Summary Reconstruction

  1.  **Epistemology:** Mathematics is a **socially distributed fallibilist system** aiming at an **ideal of deductive certainty**. We assign high credences to necessary truths based on testimony and track record (logical uncertainty).
  2.  **Computer Proofs:** The shift from 4CT to Lean is a shift from **empirical confidence** (the machine ran without error) to **formal confidence** (the kernel enforces logic). We accept Lean because the "Trusted Computing Base" is small enough to audit, restoring the deductive chain, even if humans don't read every line.
  3.  **Labels:** We keep the binary "Theorem/Conjecture" distinction because it is a **coordination mechanism**, not a truth claim. It tells the community where to invest research capital.
  4.  **Peer Review:** Peer review is a **quality filter** (is this interesting/coherent?). The **epistemic guarantee** is **downstream usage** (has this broken anything yet?).

  **The Philosophical Takeaway:**
  You don't need to change the practice, but you should change the *story*. The "Official Story" (Math = Absolute Certainty) is a **Regulative Ideal** (in the Kantian sense). It is a goal that directs the practice, not a description of the current state. We treat theorems as certain to facilitate progress, knowing full well that the foundation is held together by the friction of thousands of mathematicians trying to find cracks in each other's work.

  The "credit rating" analogy is accurate. A theorem is an asset with a credit rating. Most investment-grade theorems (AAA) are safe to build on. Some are junk bonds. The market (the community) decides the rating, not the deductive logic alone.
