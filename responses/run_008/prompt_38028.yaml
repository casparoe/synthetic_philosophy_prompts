answer: |-
  Your diagnosis is sharp and largely correct, though it may slightly understate the metaphysical stakes involved in the definition of "logic." You have identified the crux of the stalemate: the debate is less about the *phenomena* of inference (everyone agrees the inferences work) and more about the *grounds* of validity (what makes them work).

  Here is a breakdown of the disagreement, an analysis of hybrid expressivism's specific predicament, and an assessment of what could actually settle the matter.

  ### 1. The Nature of the Disagreement: Substantive, Verbal, or Methodological?

  Your hypothesis suggests the disagreement is about "what an explanation of logical validity must consist in." This is accurate, but it is not merely verbal. It is a **substantive disagreement about the philosophy of logic and the metaphysics of normativity**, disguised as a semantic dispute.

  *   **The Realist/Cognitivist Position:** Logic is essentially truth-preservative. For an argument to be valid, there must be a relation between the truth conditions of the premises and the conclusion. If moral sentences lack truth conditions (because they express attitudes, not propositions), they cannot enter into logical relations. To claim otherwise is to change the subject from *logic* to *psychological consistency*.
  *   **The Expressivist Position:** Logic is essentially about the consistency of commitments. If I accept $P$, and I accept $P \to Q$, I am rationally committed to $Q$. This commitment holds whether $P$ describes a fact or expresses a plan/attitude. To require truth conditions is to beg the question by assuming a metaphysical picture (representationalism) that expressivism denies.

  **Is your diagnosis flattering to expressivists?**
  It flatters them slightly by implying their account of "states of mind combining" is a coherent alternative to truth-conditional logic. Critics (like Geach originally, or more recently Zangwill and Van Roojen) argue it is not an alternative but a *failure*. They argue that "inconsistency of attitudes" is a psychological description, whereas "logical validity" is a normative constraint. If expressivism reduces logic to psychology, it loses the normativity of logic itself.

  Therefore, the disagreement is **substantive**. It is a clash between two competing meta-philosophical commitments:
  1.  **Semantic Continuity:** Moral language behaves syntactically and inferentially exactly like descriptive language; therefore, its semantics should be uniform (Realism).
  2.  **Metaphysical Parsimony:** We should not posit queer moral properties if we can explain the phenomena via psychology and language use (Expressivism).

  ### 2. Hybrid Expressivism: Progress, Smuggling, or Relocation?

  You ask whether hybrid expressivism (e.g., Ridge, Schroeder, Copp) is genuine progress or a relocation of the difficulty. The answer is that it is **genuine technical progress at the cost of metaphysical relocation.**

  **The Progress:**
  Hybrid theories solve the *formal* Frege-Geach problem. By positing that moral predicates express both a belief (cognitive) and an attitude (non-cognitive), they provide moral sentences with truth-apt content.
  *   *Sentence:* "Kicking cats is wrong."
  *   *Belief component:* "Kicking cats has property $N$." (Truth-apt)
  *   *Attitude component:* "I disapprove of kicking cats." (Motivational)
  Because there is a belief component with truth conditions, the sentence can participate in standard truth-conditional logic. Modus ponens works because the belief component preserves truth.

  **The Relocation (The "Collapse" Objection):**
  The difficulty moves from "How can attitudes be valid?" to "What is the content of the belief?"
  1.  **If the belief is about a natural property ($N$):** The theory risks collapsing into naturalistic realism. If "wrong" just means "has property $N$," the expressive component becomes epiphenomenal. Why do we need the attitude if the belief does all the logical work?
  2.  **If the belief is thin or deflationary:** If the belief is merely that "kicking cats is to-be-avoided," critics argue this is just an attitude in disguise. We are back to the original F-G problem: what are the truth conditions of "to-be-avoided"?
  3.  **The Connection Problem:** How are the belief and attitude connected? If they are contingently connected, one could have the belief without the attitude (amoralism), undermining the internalism expressivism seeks to preserve. If they are necessarily connected, the view looks like a form of non-naturalist realism (where the property *essentially* prescribes).

  **Is the "Collapse" Objection Obvious?**
  You are right to suspect the answer isn't obvious. The collapse objection assumes that the belief component must be *substantive* to do logical work. Hybrid expressivists argue the belief component can be **contextual** or **standard-relative** (e.g., "Kicking cats violates the standards I accept"). This allows for truth-aptness without positing mind-independent moral properties.
  However, this invites a new objection: **Relativism.** If the truth conditions are relative to the speaker's standards, then "Kicking cats is wrong" asserted by Alice and denied by Bob may not be contradictory (since they refer to different standards). This threatens the *disagreement* data, which is just as important as the *validity* data.

  So, hybrid expressivism is not smuggling realism in so much as it is **buying logical validity with relativistic currency.** It solves F-G but risks losing objectivity.

  ### 3. What Would Count as Settling It?

  Given that both sides agree on the validity of the inferences (the data), a settlement cannot come from pointing to more examples. It requires a resolution on theoretical virtues.

  **A. Formal Semantics (Not Sufficient)**
  Expressivists like Mark Schroeder (*Being For*) have developed sophisticated formal semantics that mimic truth-conditional logic without truth conditions. They show that expressivism *can* handle embedding.
  *   *Why this doesn't settle it:* Realists concede the formalism works but argue it is ontologically profligate. They claim positing complex types of "acceptance" states is more metaphysically costly than simply admitting moral properties. A formal proof cannot decide between ontological parsimony and semantic uniformity.

  **B. A Distinction (Partial Settlement)**
  A distinction between **Logical Validity** (truth-preservation) and **Rational Validity** (consistency of commitments) could dissolve the verbal dispute.
  *   *The Compromise:* Expressivists admit they are offering an account of *Rational Validity*. Realists admit that *Rational Validity* is all we need for ethics.
  *   *The Hurdle:* Realists argue that without truth-preservation, you lose the *normativity* of logic. If logic is just about psychological consistency, why *ought* I be consistent? Expressivists must ground the normativity of logic in the normativity of planning/rationality (Gibbard's route). This pushes the problem back one step rather than solving it.

  **C. Abandoning Starting Points (The Only Real Settlement)**
  The dispute will only be settled if one side abandons a core constraint:
  1.  **Realists abandon Truth-Conditionalism:** They accept that logic can be grounded in something other than truth (e.g., warrant, assertibility, or commitment). This effectively concedes the expressivist point.
  2.  **Expressivists abandon Non-Cognitivism:** They admit that moral judgments are essentially belief-like and that moral properties exist (even if natural). This concedes the realist point.

  **Conclusion: The Verdict**
  Your diagnosis is correct: the literature reads as though no one has moved because **both sides are protecting different theoretical virtues.**
  *   Realists prioritize **Semantic Uniformity** (moral language works like scientific language).
  *   Expressivists prioritize **Metaphysical Naturalism** (no queer moral properties).

  Hybrid expressivism attempts to have both, but it pays for it by making the content of moral belief thin or relative. The "collapse" objection is not a knock-down proof, but a warning that hybrid theories often end up looking like realism with extra steps, or expressivism with a truth-conditional veneer.

  **What settles it?** Nothing short of a broader consensus in meta-philosophy on whether **ontological parsimony** trumps **semantic intuition**. If philosophy moves toward a more pragmatic, deflationary view of truth (where "truth" is just a device for endorsement), expressivism wins. If philosophy retains a robust correspondence theory of truth, realism wins. Until the philosophy of language and metaphysics shifts on the nature of truth itself, the Frege-Geach problem will remain a stand-off between two coherent but incompatible frameworks.
