answer: |-
  The tension you have identified is one of the oldest and most structural fractures in intellectual property theory. It arises because patent law attempts to serve two masters: economic efficiency and administrative feasibility. To reconstruct the theory of invention presupposed by the system, we must look past the rhetoric of "inventors" and "creativity" and examine the functional role the patent plays in the regulatory machinery.

  The system does not presuppose a single metaphysical theory of invention, such as the "heroic genius" or the "inevitable discovery." Instead, it operates on a **Utilitarian Inducement Theory with Administrative Finality**. Under this view, the patent is not a natural right rewarding past labor (which would align with the heroic view), nor is it merely a recognition of historical inevitability (which would align with the inevitabilist view). It is a regulatory tool designed to solve a specific coordination problem: how to get private actors to disclose and commercialize technology that might otherwise remain secret or under-invested.

  The obviousness doctrine (§103) serves as the economic filter. When the system observes simultaneous invention or convergence, it infers that the R&D risk was low. If multiple teams are arriving at the same solution, the market forces and technical trajectory were already sufficient to produce the invention. Granting a monopoly in this scenario creates a deadweight loss without providing necessary inducement. Here, the "Person Having Ordinary Skill in the Art" (PHOSITA) is not a real person but a legal proxy for the state of the art. If the PHOSITA could have done it, the invention was "in the air," and the patent incentive is superfluous. This aligns with your "prepared-environment" observation: the system denies the patent because the *social cost* of the monopoly outweighs the *inducement benefit*.

  The priority doctrine (First-to-File), conversely, serves as the administrative allocator. Once the system has determined that an invention *is* worthy of a patent (i.e., it was not obvious), it must assign the property right to a specific entity to enable licensing and enforcement. The law cannot tolerate a "commons" of co-equal independent inventors holding overlapping rights, as this leads to an anti-commons tragedy where no one can commercialize the technology. The race to the patent office is not a judgment on who was the "truer" inventor in a moral sense; it is a clear, bright-line rule to minimize litigation costs and uncertainty. The America Invents Act's shift from First-to-Invent to First-to-File explicitly prioritized administrative certainty over the romantic ideal of protecting the "first conceiver."

  Therefore, the tension is superficial rather than genuine. The two doctrines answer different questions. Obviousness asks: "Does society need to grant a monopoly to get this technology?" Priority asks: "To whom do we grant the monopoly to ensure it is actually commercialized?" The system presupposes that invention is a collective, cumulative process (hence obviousness looks at the field), but commercialization requires a singular decision-maker (hence priority picks a winner).

  This leaves several aspects of the practice underdetermined. The law does not strictly require us to believe that inventors are interchangeable, only that the *risk* of invention is measurable by market convergence. Nor does it require us to believe the first filer is the best commercializer, only that they are the easiest to identify. If the system took the inevitabilist view seriously, it would move toward a prize system for high-convergence fields, abolishing patents where R&D is low-risk. If it took the heroic view seriously, it would revert to First-to-Invent and perhaps tailor patent breadth to the "height" of the inventive leap. Currently, the system hedges: it uses inevitability to filter out low-value patents but uses a race to allocate high-value ones, accepting that some "heroic" inventors will lose to faster filers as the cost of doing business.

  The closest analog outside patent law is the norm of **Scientific Priority** (as described by Robert Merton). In science, discovery is viewed as inevitable given the state of knowledge (the "prepared environment"), yet credit is assigned strictly to the first to publish. This encourages rapid disclosure (like patents) while acknowledging that the discovery itself was a product of the times (like obviousness). Science, however, awards reputation rather than monopoly, avoiding the deadweight loss that patent law tolerates.

