answer: |-
  Here is a specification sheet for the Knowledge Argument. These desiderata are designed to bypass verbal maneuvering and force a verdict on the metaphysical status of physicalism.

  ### The Spec: Desiderata for an Adequate Response to the Knowledge Argument

  To settle whether physicalism is in trouble, a response cannot merely offer a plausible reading of the case; it must demonstrate that the case is compatible with the core commitments of physicalism (causal closure, supervenience, and the completeness of physics).

  #### 1. The Variant Robustness Condition
  **Requirement:** The account must yield consistent verdicts across physiological and epistemic variants of the Mary case without altering its core mechanism.
  **The Case:**
  *   **The Achromatope:** A scientist who knows all color science but is congenitally colorblind. If Mary gains an *ability*, does the achromatope possess it? If not, why does the ability depend on physiology if knowledge is supposed to be abstract?
  *   **The Blindsighter:** A subject who can correctly name red objects under forced choice but reports no phenomenal experience. If Mary gains *knowledge*, does the blindsighter have it? If your account says "Yes," you contradict the intuition that phenomenology is missing. If "No," you must explain why Mary's gain is different from the blindsighter's discrimination capacity.
  *   **Amnesiac Mary:** Mary sees red at age 3, enters the room, forgets, then leaves. Does she "re-learn" something? If she gains a *fact*, she shouldn't need to re-learn it (it was in her physical database). If she gains *acquaintance*, why did the first exposure count?
  **Why it matters:** This prevents responses from tailoring the solution to "Normal Mary." If the mechanism relies on physiology (e.g., neural activation), it risks conceding non-physical properties. If it relies on concepts, it must explain why physiological deficits block conceptual possession.

  #### 2. The Non-Circular Error Theory Condition
  **Requirement:** If the response claims Mary learns *nothing new* (ontologically or factually), it must provide an error theory for the overwhelming intuition that she *does* learn something. This error theory must not presuppose the truth of physicalism.
  **The Case:** Many physicalists argue, "It only *seems* like she learns a fact because she gains a new concept." But why does gaining a concept *feel* like discovering a new feature of reality? If the explanation is "Because concepts track physical states," you haven't explained the *gap*. If the explanation is "Because human cognition is structured this way," you need independent evidence of that cognitive structure.
  **Why it matters:** Without this, the response begs the question. It asserts physicalism is true to prove the argument against physicalism fails. An adequate response must explain the *source* of the dualist intuition using neutral cognitive or semantic grounds.

  #### 3. The Truth-Conditional Fact Distinction
  **Requirement:** The account must explicitly define "fact" in truth-conditional terms and locate Mary's new knowledge within that definition. It must distinguish between:
  *   **New Proposition:** A new truth condition in the world.
  *   **New Mode of Presentation:** A new way of accessing an existing truth condition.
  *   **Non-Propositional Acquaintance:** A relation to an object/property that isn't truth-apt.
  **The Case:** Dualists argue that if Mary can say "So *this* is what red looks like," she is affirming a truth that was not entailed by her physical knowledge. If the response claims she only gains a "mode of presentation," it must show that the truth conditions of "Red is like this" were already satisfied by her physical knowledge *in the room*.
  **Why it matters:** This is the metaphysical crux. If Mary's new knowledge changes the set of true propositions about the world, physicalism (which claims the physical propositions are exhaustive) is false. Responses that blur "knowing-how" with "knowing-that" fail here.

  #### 4. The Independent Motivation Constraint
  **Requirement:** The theoretical machinery invoked to solve the case (e.g., phenomenal concepts, acquaintance relations, ability types) must be independently motivated by problems outside the Knowledge Argument.
  **The Case:** The Phenomenal Concept Strategy (PCS) posits that phenomenal concepts are unique (direct, recognitional, quotational). Critics argue these features are posited *solely* to defuse Mary. To pass, the proponent must show these concept types are required to explain indexicals, memory, or self-knowledge in unrelated contexts.
  **Why it matters:** This filters out *ad hoc* saves. If you invent a special class of "phenomenal facts" or "phenomenal concepts" that do no work elsewhere in your ontology, you are engaging in special pleading to protect physicalism.

  #### 5. The Domain Neutrality Condition
  **Requirement:** The mechanism must generalize to all phenomenal domains, not just color vision.
  **The Case:** Color is spatial and representational. It is easier to argue color is "just" representation than it is for pain, orgasm, or mood states. If your account works for Red Mary but fails for Pain Mary (where the "what it's like" seems inseparable from the fact itself), the account is insufficient.
  **Why it matters:** The Knowledge Argument is an argument about *consciousness*, not vision. A solution that relies on the representational nature of vision (Representationalism) fails when applied to non-representational qualia.

  ---

  ### The Incompatibilities (The Physicalist Trilemma)

  You suspected some requirements might not be jointly satisfiable. You are correct. There is a tension triangle here. You can satisfy any two, but satisfying all three simultaneously is where the literature stalls.

  1.  **Phenomenological Fidelity** (Respect the intuition that Mary learns something real).
  2.  **Physicalist Consistency** (Maintain that no new ontological facts exist).
  3.  **Non-Ad-Hocness** (Use only independently motivated machinery).

  *   **Path A (Illusionism):** Satisfies **Physicalist Consistency** and **Non-Ad-Hocness** (by denying special phenomenal concepts). *Fails Phenomenological Fidelity.* It tells the dualist their intuition is a brute error, which many find dialectically useless.
  *   **Path B (Phenomenal Concept Strategy):** Satisfies **Physicalist Consistency** and **Phenomenological Fidelity** (Mary learns something real, but it's conceptual). *Fails Non-Ad-Hocness.* It is constantly accused of positing "magical" concepts solely to save physicalism.
  *   **Path C (Dualism):** Satisfies **Phenomenological Fidelity** and **Non-Ad-Hocness** (takes intuition at face value, no special pleading). *Fails Physicalist Consistency.* (Obviously).

  **The Critical Tension:** The pair **Physicalist Consistency** and **Phenomenological Fidelity** are the hardest to hold together. To respect the intuition (that Mary gains something substantive), you usually need to concede an ontological gap. To close the gap, you usually have to diminish the gain (say it's "just" a concept), which violates the intuition.

  ---

  ### The Knockout Constraint

  **The Single Requirement that Knocks Out the Most Responses:**
  **The Variant Robustness Condition.**

  **Why:** Most responses are calibrated to "Textbook Mary." They rely on a specific alignment of knowledge, physiology, and intuition.
  *   **The Ability Hypothesis** (Lewis/Nemirow) claims Mary gains abilities (to imagine, recognize). *Knocked out by:* The Blindsighter variant. The blindsighter has the ability to discriminate/red-name but lacks the phenomenal knowledge. If ability were sufficient, blindsighters would have what Mary gets. They don't.
  *   **The Old Fact/New Mode View** claims Mary accesses old physical facts via new concepts. *Knocked out by:* The Achromatope variant. If the concept is purely cognitive, why can't the achromatope (who knows the science) possess it? If the concept requires the physiology, it looks suspiciously like a non-physical property detector.
  *   **Representationalism** claims Mary learns what red represents. *Knocked out by:* Non-representational qualia (moods, afterimages).

  Variant Robustness forces the theory to confront the *mechanism* of the gain, not just the description of it.

  ---

  ### The View That Dies Fastest

  **The Ability Hypothesis.**

  While the Phenomenal Concept Strategy (PCS) is the most contested, the Ability Hypothesis dies fastest against **Desideratum #3 (The Truth-Conditional Fact Distinction)**.

  **The Reason:** It is relatively easy to construct a case where Mary gains propositional knowledge *without* gaining a new ability.
  *   *Example:* Mary leaves the room, sees red, and thinks, "So, *this* is the experience caused by 620nm light." She has learned a truth. She hasn't necessarily gained a new *skill* (she already knew how to imagine/recognize in the abstract).
  *   Furthermore, as noted in the Variant Robustness section, the Blindsighter possesses the discriminatory ability without the phenomenal knowledge. If the Ability Hypothesis were true, the Blindsighter should be in the same epistemic position as Post-Room Mary. The intuition that they are not is robust.

  **Thesis Recommendation:**
  If you want to make a strong contribution, do not try to solve the argument. Use these desiderata to show *why* it remains unresolved. The most valuable chapter would demonstrate that satisfying **Variant Robustness** inevitably forces a violation of **Non-Ad-Hocness**. This would suggest that the Knowledge Argument isn't a puzzle to be solved, but a symptom of a deeper category error in how we define "physical fact."
