      *   **Problem:** Struggling to distinguish between substantive empirical disputes and merely verbal/definitional disputes (e.g., "Is obesity a disease?", "Are viruses alive?", "Was the serotonin theory refuted?").
      *   **Goal:** A practical, 20-minute procedure (checklist/flowchart style) for the news desk to classify these disputes without needing a philosophy degree.
      *   **Requirements:**
          *   Ordered set of questions.
          *   Clear outputs (Write as empirical? Write as verbal? Hand off to human/policy?).
          *   Incorporate friend's test (Would honest/informed sides file the same story?).
          *   Incorporate user's hunch (Local vs. Global verbal disputes).
          *   Run the procedure on three specific cases (Obesity, Viruses, Serotonin/Depression).
          *   Be honest about limitations/failures (where it misfires, who it angers, what it can't do).
          *   Constraint: Framing sentences must not sound like taking a side in the underlying fight (copy desk constraint).

  2.  **Deconstruct the Philosophical Underpinnings (for the AI's internal logic):**
      *   The core concept is *Verbal Disputes* vs. *Substantive Disputes*.
      *   Key philosophical reference: Carnap (frameworks), Chalmers (verbal disputes), Thomasson (easy ontology).
      *   The "Friend's Test": This aligns with the idea of *paraphraseability*. If both parties agree on all the non-contested facts and the only difference is the label, it's verbal.
      *   The "User's Hunch": This is crucial. It recognizes *pragmatic* stakes. A definition might be arbitrary *ontologically* but critical *normatively* or *institutionally*. This aligns with *conceptual engineering* or *ameliorative projects* (Haslanger).
      *   The "Serotonin" case: This is tricky. It involves theory change vs. refutation. It's often framed as "debunked" (empirical) vs. "oversimplified" (definitional/theoretical).

  3.  **Drafting the Procedure (The "Desk Check"):**
      *   *Time limit:* 20 minutes. Needs to be punchy.
      *   *Step 1: The Fact-Strip Test.* Remove the word. Do claims remain? (Addresses the "semantics" charge).
      *   *Step 2: The Headline Swap.* (Incorporates the friend's test). If they agree on the facts, would the story change?
      *   *Step 3: The Stake Check.* (Incorporates the user's hunch). Does the label trigger consequences (money, law, stigma)?
      *   *Step 4: The Trajectory Check.* Is this definition stable or shifting? (Addresses the "locally verbal" hunch).
      *   *Outputs:*
          *   Green Light: Empirical Fight.
          *   Yellow Light: Definitional Fight with Stakes (Policy/Values).
          *   Red Light: Purely Verbal (Don't fight, explain translation).

  4.  **Refining the Procedure for the Copy Desk Constraint:**
      *   The user needs framing sentences that don't take sides.
      *   Instead of "Obesity is not a disease," write "Experts disagree on whether the clinical criteria for obesity meet the threshold for disease classification."
      *   Need to build this into the output of the procedure.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Obesity as a Disease.*
          *   Facts: BMI, health risks, mechanisms. Agreed upon.
          *   Word: "Disease."
          *   Stakes: Insurance, stigma, medicalization. High.
          *   Verdict: Yellow Light (Definitional with Stakes). Not a science fight, a policy/value fight.
          *   *Self-Correction:* Wait, is there empirical disagreement? Some say mechanisms are unknown. But the core fight is usually classification.
          *   *Framing:* Focus on the *consequences* of the label, not the truth of the label.

      *   *Case 2: Viruses Alive.*
          *   Facts: Reproduction, metabolism, evolution. Agreed upon.
          *   Word: "Alive."
          *   Stakes: Low (mostly textbook organization, some astrobiology implications).
          *   Verdict: Red Light (Purely Verbal).
          *   *Framing:* "Biologists differ on which criteria are necessary for life."

      *   *Case 3: Serotonin/Depression.*
          *   Facts: Umbrella review showed lack of consistent evidence for *simple* low serotonin.
          *   Word: "Debunked" vs. "Refined."
          *   Stakes: Medication trust, patient hope. High.
          *   Verdict: This is the trap. It looks empirical (did the study happen?) but the fight is about *theory status*. The user suspects they look bad.
          *   *Analysis:* The study didn't prove serotonin *doesn't* cause depression; it proved the *simple version* wasn't supported. Calling it a "debunking" implies a stronger empirical negation than exists. It's a theory-change dispute.
          *   *Verdict:* Yellow/Green mix. It's empirical (data exists) but the *interpretation* is definitional (what counts as the "chemical imbalance theory").
          *   *Framing:* Needs to distinguish between the specific study findings and the broader theoretical narrative.

  6.  **Addressing the Limitations (The "Misfire" Section):**
      *   Where does this fail?
      *   *Camouflaged Ideology:* When "definitions" are proxies for political fights (e.g., "Is gender real?").
      *   *Paradigm Shifts:* When facts themselves are contested (Kuhn).
      *   *Reader Rage:* Readers want answers, not "it depends."
      *   *The "So What?" Problem:* If it's verbal, why report it? (Answer: Because the definition has power).

  7.  **Review against Constraints:**
      *   20 minutes? Yes, the checklist is short.
      *   No philosophy background? Yes, avoided jargon like "ontological commitment."
      *   Friend's test included? Yes (Step 2).
      *   User's hunch included? Yes (Step 3 & 4).
      *   Copy desk constraint? Yes, specific framing language provided.
      *   Honesty about the Serotonin column? Yes, need to be gentle but firm.

  8.  **Final Polish:**
      *   Tone: Professional, collegial, direct (journalist to journalist).
      *   Structure: The Procedure -> The Cases -> The Limitations.
      *   Ensure the "Handoff" instruction is clear (when to send to Opinion/Policy vs. News).

  **(Self-Correction during drafting):** I need to make sure I don't just say "Serotonin was verbal." It wasn't *just* verbal. New data came out. But the *fight* about whether it was "debunked" is largely about how we define the theory's core claims. I need to be precise there so the user doesn't feel I'm dismissing the science, just the *framing* of the science.

  Also, the "Local Verbal" hunch is smart. I should validate that. It's essentially the difference between *descriptive* metaphysics and *revisionary* metaphysics (or conceptual engineering). I'll translate that into newsroom terms: "Downstream Consequences."

