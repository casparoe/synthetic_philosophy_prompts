answer: |-
  Here is a procedure designed for a newsroom environment. It strips the philosophical machinery down to operational questions, incorporates your friend's test and your hunch, and includes specific framing language to satisfy your copy desk.

  ### The "Definition vs. Discovery" Desk Check
  **Time:** 20 Minutes
  **Goal:** Determine if a dispute is about the world (Empirical), the words (Verbal), or the consequences of the words (Normative).

  #### Step 1: The Fact-Strip Test (5 Minutes)
  Identify the contested word (e.g., "Disease," "Alive," "Debunked"). Remove it from the sentences of both opposing sides. Replace it with a neutral placeholder like "Condition X" or "Phenomenon Y."

  *   **Question:** Do the two sides still disagree about the *behavior*, *mechanism*, or *outcome* of Condition X?
      *   **Yes:** There is an empirical disagreement. Proceed to **Step 4**.
      *   **No:** They agree on the facts (e.g., BMI correlates with health risks; viruses replicate but lack metabolism). The fight is about the label. Proceed to **Step 2**.

  #### Step 2: The Headline Swap (Your Friend's Test) (5 Minutes)
  Imagine both scientists are perfectly honest and have access to all the same data.
  *   **Question:** Would they file the exact same story? Same headline, same lede, same data points, differing only in the adjective used in paragraph 14?
      *   **Yes:** This is a **Purely Verbal Dispute**. (e.g., "Is a virus alive?" usually means "Do we put viruses in the biology textbook chapter on life?")
      *   **No:** They would write different stories because the label triggers different expectations or narratives. Proceed to **Step 3**.

  #### Step 3: The Stake Check (Your Hunch) (5 Minutes)
  You suspected some disputes are "locally verbal." This checks if the word is doing heavy lifting *outside* the lab.
  *   **Question:** Does assigning this label change who pays, who gets punished, who gets treated, or what laws apply?
      *   **No:** (e.g., Whether Pluto is a "planet" changes textbooks, not budgets). **Verdict: Purely Verbal.**
      *   **Yes:** (e.g., Whether obesity is a "disease" changes insurance reimbursement and stigma). **Verdict: Normative/Policy Dispute.**
      *   *Note:* If Yes, this is no longer a science story. It is a policy or ethics story wearing a science mask.

  #### Step 4: The Trajectory Check (5 Minutes)
  *   **Question:** Is the definition stable, or is one side trying to *change* the definition to accommodate new data?
      *   **Stable:** Treat as **Empirical**. (One side is likely wrong about the facts).
      *   **Changing:** Treat as **Theory Change**. (The old definition no longer fits the data, so the word is being stretched).

  ---

  ### Output & Framing Guide
  *Use these templates to satisfy copy desk constraints against taking sides.*

  **If Purely Verbal (Step 2/3 = No):**
  *   **Do not write:** "Scientists argue whether X is Y." (Implies Y is a hidden fact waiting to be found).
  *   **Do write:** "Scientists agree on the characteristics of X, but differ on whether the category Y applies."
  *   **Action:** Box this story. Keep it short. It is a taxonomy dispute, not a discovery.

  **If Normative/Policy (Step 3 = Yes):**
  *   **Do not write:** "Is obesity a disease?" (Implies a binary truth).
  *   **Do write:** "Classifying obesity as a disease carries significant implications for insurance and treatment, leading to debate over the utility of the label."
  *   **Action:** Hand off to Health Policy or Opinion. The science desk cannot resolve this because there is no scientific fact that decides insurance codes.

  **If Empirical/Theory Change (Step 1 = Yes or Step 4 = Changing):**
  *   **Do not write:** "Study proves Theory Z is dead."
  *   **Do write:** "New data challenges the prevailing model of Theory Z, prompting a reevaluation of its core claims."
  *   **Action:** Report as standard science news.

  ---

  ### Running the Procedure: Three Cases

  #### Case 1: Is Obesity a Disease?
  *   **Step 1 (Fact-Strip):** Both sides agree on BMI metrics, comorbidities (diabetes, heart risk), and genetic factors. They disagree on the word "Disease." -> **Pass to Step 2.**
  *   **Step 2 (Headline Swap):** If they agreed on the label, would the story be the same? No. One side writes "Medical Breakthrough in Weight Management," the other writes "Pathologizing Normal Variation." -> **Pass to Step 3.**
  *   **Step 3 (Stake Check):** Does the label change consequences? Yes. Insurance coverage, FDA approval pathways for drugs, social stigma. -> **Verdict: Normative/Policy Dispute.**
  *   **Desk Instruction:** This is not a science fight. It is a decision about how to allocate resources and assign stigma.
  *   **Framing:** "While medical consensus exists on the health risks associated with high body weight, the classification of obesity as a 'disease' remains a subject of debate due to its implications for treatment protocols and insurance coverage."
  *   **Action:** Hand off to Policy/Health editor. Do not frame as "Science hasn't decided yet." Science has decided the risks; society hasn't decided the label.

  #### Case 2: Are Viruses Alive?
  *   **Step 1 (Fact-Strip):** Both sides agree viruses replicate, evolve, and lack independent metabolism. Disagree on "Alive." -> **Pass to Step 2.**
  *   **Step 2 (Headline Swap):** If they were honest, would they file the same story? Mostly yes. The data is identical. The headline might change from "Secrets of Life" to "Secrets of Replication," but the lede is the same. -> **Verdict: Purely Verbal.**
  *   **Step 3 (Stake Check):** Does this change insurance or law? Generally no. (Exception: Biosecurity protocols, but usually negligible for general reporting). -> **Verdict: Purely Verbal.**
  *   **Framing:** "Biologists utilize different criteria for defining life, leading to varying classifications of viral entities."
  *   **Action:** Keep it brief. This is a textbook organization dispute, not a breaking news event.

  #### Case 3: The Serotonin Theory of Depression
  *   **Step 1 (Fact-Strip):** Remove "Debunked."
      *   Side A says: "Review shows no consistent evidence that low serotonin causes depression."
      *   Side B says: "Review shows the *simple* serotonin model isn't supported, but complex neurotransmitter involvement remains."
      *   *Crucial:* Do they disagree on the *data*? No, they are looking at the same umbrella review. They disagree on what the data *kills*. -> **Pass to Step 2.**
  *   **Step 2 (Headline Swap):** Would they file the same story? No. Side A files "Antidepressants Based on False Premise." Side B files "Depression Mechanisms More Complex Than Thought." -> **Pass to Step 3.**
  *   **Step 3 (Stake Check):** High stakes. Patient trust, medication adherence, pharmaceutical liability. -> **Verdict: Normative/Theory Change.**
  *   **Step 4 (Trajectory):** Is the definition changing? Yes. The "Chemical Imbalance" theory was always a shorthand for a complex system. The new data forces a redefinition of the theory, not necessarily the abandonment of the treatment.
  *   **Framing:** "A recent analysis indicates that the evidence supporting the serotonin hypothesis is less consistent than previously assumed, prompting researchers to refine models of depression's biological underpinnings."
  *   **Action:** **Correction on your column.** You framed it as an *empirical reversal* (The facts changed). The procedure suggests it is a *theoretical refinement* (The interpretation of facts changed).
      *   *Why you might look bad:* You wrote "Debunked." The study showed "Lack of consistent evidence." In science, those are different. "Debunked" implies the mechanism is proven false. "Lack of evidence" implies we haven't found the proof yet. The fight is verbal/definitional about what counts as "the theory."
      *   *Fix:* You don't need to retract, but you should clarify that the *clinical efficacy* of SSRIs was not refuted, only the *explanatory narrative* was weakened.

  ---

  ### Where This Procedure Misfires (The Limitations)

  You asked for straight talk on where this breaks. Here is where your desk will fight you, and where readers will get angry.

  **1. The "Camouflaged Ideology" Failure**
  *   **The Problem:** Some disputes look verbal but are actually political fights using science vocabulary. (e.g., "Is gender biological?").
  *   **The Misfire:** The procedure will flag this as "Normative/Policy" (Step 3).
  *   **The Risk:** Readers who believe the answer is a hard biological fact will accuse you of "both-sidesing" reality. Readers who believe it is social will accuse you of legitimizing a debate that shouldn't exist.
  *   **Mitigation:** Acknowledge the stakes explicitly. "The definition determines access to care" is safer than "Scientists disagree on biology."

  **2. The "Paradigm Shift" Blind Spot**
  *   **The Problem:** Sometimes, a "verbal" dispute is actually a Kuhnian paradigm shift in disguise. When Einstein talked about "time," he was changing the definition, but he was also describing a new physical reality.
  *   **The Misfire:** The procedure might classify early-stage paradigm shifts as "Purely Verbal" because the facts aren't settled yet.
  *   **The Risk:** You might under-report a revolution because it looks like semantics.
  *   **Mitigation:** If the "Verbal" dispute persists for more than 5 years with high-stakes funding attached, upgrade it to "Empirical/Theory Change."

  **3. The Reader Rage Factor**
  *   **The Problem:** Readers hate "It depends." They want to know if they should take the pill or if the virus is dangerous.
  *   **The Misfire:** Using the "Framing Guide" language ("differ on whether the category applies") sounds weaselly to a layperson.
  *   **The Risk:** Loss of trust. "Why can't the newspaper just tell me the truth?"
  *   **Mitigation:** Use the "Stake Check" to explain *why* it's unclear. "Because the definition determines insurance, doctors are hesitant to..." gives a reason for the ambiguity other than "scientists are confused."

  **4. What It Cannot Do**
  *   This procedure cannot tell you who is *right* in a Normative Dispute. It cannot tell you if obesity *should* be a disease. It only tells you that the argument isn't about biology, it's about bureaucracy and ethics.
  *   If your editor demands a "Truth" headline on a Normative Dispute, this procedure gives you the ammunition to push back: "We cannot report a fact where none exists, only a policy choice."

  ### Final Note on the Serotonin Column
  Don't panic. The "Chemical Imbalance" story is one of the hardest in science journalism because the *public narrative* (pills fix broken chemistry) diverged from the *scientific reality* (pills affect chemistry, mechanism unclear) decades ago.
  *   **Your error:** Treating the collapse of the *narrative* as the collapse of the *treatment*.
  *   **The Procedure's verdict:** This was a **Theory Change** (Step 4), not an Empirical Reversal (Step 1). The data didn't flip; the interpretation of the data's sufficiency did.
  *   **Recovery:** In future coverage, distinguish between *etiology* (what causes it) and *treatment* (what fixes it). The study attacked the etiology story. It did not attack the treatment efficacy. That distinction saves the story.
