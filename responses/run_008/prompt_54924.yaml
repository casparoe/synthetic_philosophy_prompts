  1. Epistemicism is not the settled consensus but rather one controversial hypothesis among several competing theories in contemporary philosophy. Many philosophers reject the idea that vague predicates have sharp boundaries hidden from human knowledge.
  2. The Sorites paradox does not definitively prove a precise cutoff exists but instead reveals a conflict between intuitive premises and classical logical principles. Different solutions resolve this conflict by rejecting different assumptions rather than accepting a single conclusion.
  3. Supervaluationism attempts to preserve classical logic while denying bivalence by treating borderline cases as lacking a truth value rather than having a hidden one. This approach maintains that statements are true if they hold across all acceptable precisifications of the vague term.
  4. While supervaluationism modifies the principle of bivalence, it is designed to retain most classical logical validities that epistemicism also preserves. It is not a refusal to accept logic but a different formalization of how truth functions in vague contexts.
  5. Serious philosophers develop alternative theories because the epistemicist claim of unknowable sharp boundaries strikes many as counterintuitive or metaphysically extravagant. The debate remains open because each solution involves distinct trade-offs between logic, semantics, and metaphysics.
