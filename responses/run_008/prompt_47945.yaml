  # JOINT STATEMENT ON THE CENTIPEDE GAME AND BACKWARD INDUCTION

  **Issued by the Orthodoxy and Revisionist Factions of the Game-Theory Seminar**
  **Date:** [End of Term]

  ### PREAMBLE

  We, the undersigned participants in this seminar, acknowledge that while we share a commitment to rigorous formal modeling and empirical accuracy, we have diverged on the interpretation of the Centipede Game. This document records the points of convergence we have achieved through adversarial collaboration, catalogs the precise nature of our remaining disagreements, and identifies the empirical or theoretical cruxes that, if resolved, would alter the landscape of this debate. We agree to treat this text as the baseline for future inquiry.

  ---

  ### I. POINTS OF CONVERGENCE

  We jointly endorse the following claims as accurate descriptions of the formal, epistemic, and empirical landscape:

  1.  **The Formal Result of Backward Induction:** Under the standard assumptions of the Centipede Game (finite horizon, perfect information, increasing payoffs for delay), backward induction demonstrates that if Common Knowledge of Rationality (CKR) holds at every node, and if players maximize monetary payoff, the unique Subgame Perfect Equilibrium is for the first player to "Take" at the initial node. This is a mathematical consequence of the game tree structure.
  2.  **The Epistemic Tension (The Paradox):** The logical force of backward induction relies on the assumption that rationality is common knowledge at all nodes, including those off the equilibrium path. However, the arrival at any node beyond the first is logically inconsistent with the assumption that CKR held at the start. Therefore, a player finding herself at a late node faces a contradiction: the standard solution concept requires her to assume CKR, but the history of play suggests CKR has been violated.
  3.  **The Empirical Regularity:** In controlled experiments involving human subjects playing the Centipede Game for monetary stakes, the backward induction solution (Take at Node 1) is rarely the modal outcome. Play typically continues for several moves, allowing the pot to grow, before terminating. This result is robust across variations in the number of nodes and minor variations in payoff structure.

  ---

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  We disagree on the interpretation of the claims above. The following table summarizes our divergent positions. Each position is phrased such that the respective faction accepts it as a fair statement of their view.

  | Topic | The Orthodoxy Position | The Revisionist Position |
  | :--- | :--- | :--- |
  | **Inference at Late Nodes** | A node off the equilibrium path is a zero-probability event under CKR. If reached, it must be treated as an exogenous "tremble" or error that does not update beliefs about the opponent's future rationality. One must maintain the prior assumption that the opponent will maximize payoff at the next opportunity. | A node off the equilibrium path is informative data. Arrival implies the opponent is not the type predicted by CKR. A rational player should update their beliefs to assign higher probability to the opponent being a "cooperator" or a non-maximizer, making a "Pass" the expected-utility maximizing choice. |
  | **Definition of Rationality** | Rationality is a property of **strategies** chosen ex-ante. A rational player commits to a plan that is optimal at the start of the game, knowing that any deviation by the opponent is an error. Consistency with Subgame Perfect Equilibrium is the criterion. | Rationality is a property of **choices** made sequentially. A rational player maximizes expected utility at the specific node they occupy, given the beliefs formed by the history of play. Adherence to a pre-commitment that ignores new information is not rational. |
  | **The Trembling-Hand Reply** | The trembling-hand refinement resolves the paradox by assigning positive probability to all moves. This preserves the equilibrium concept without conceding that cooperation is rational; it merely accounts for the possibility of error while maintaining that "Take" is the optimal response to any error probability. | The trembling-hand reply tacitly concedes the Revisionist point. By assigning probability to "Pass," it allows the Orthodoxy to model the very belief-updating Revisionists advocate, but it disguises this as a technical fix rather than an epistemic shift. It relabels the inference problem rather than solving it. |
  | **Relevance of Experiments** | Experimental deviations from backward induction indicate that the **utility functions** in the model are misspecified (e.g., subjects value fairness or altruism), not that the **solution concept** is flawed. If monetary payoffs matched true utilities, the Orthodoxy prediction would hold. | Experimental deviations indicate that the **solution concept** is too narrow for strategic reasoning, even when subjects are self-interested. Subjects are reasoning rationally about the likelihood of cooperation, which the standard model forbids. The "utility mismatch" defense is unfalsifiable without independent measurement of preferences. |

  ---

  ### III. THE CRUXES

  We identify the following sub-questions as pivotal. Settlement of these issues would require at least one faction to revise its position. For each, we record the specific predictions made by each faction in advance of further inquiry.

  #### Crux 1: The Effect of High Stakes
  **Question:** Does increasing the monetary stakes (scaling payoffs by a factor of 100x or 1000x) drive behavior toward the Backward Induction solution?

  *   **Orthodoxy Prediction:** **Convergence to Take-First.** As stakes rise, the cost of "irrational" play increases. Noise, altruism, and confusion are suppressed by financial incentive. The rate of Node 1 "Take" decisions will approach 100%.
  *   **Revisionist Prediction:** **Persistence of Passing.** The logic of inference does not depend on the scale of payoffs, but on the structure of beliefs. If passing is rational because it signals a cooperative opponent, it remains rational at high stakes. Indeed, high stakes may increase the value of establishing a cooperative reputation, sustaining or even lengthening the game.
  *   **Agreed Test:** A pre-registered experiment comparing standard stakes vs. life-changing stakes, controlling for subject pool wealth.

  #### Crux 2: The "Proven Reasoner" Treatment
  **Question:** What happens when players are informed that their opponent is drawn from a pool of agents who have demonstrably played according to Backward Induction in previous, verified sessions?

  *   **Orthodoxy Prediction:** **Immediate Collapse.** If it is Common Knowledge that the opponent is a Backward Induction reasoner, the game must end at Node 1. If play reaches a late node, it is strictly an error (tremble). The response to a tremble should still be to "Take" immediately to secure the guaranteed payoff, as the opponent's "reasoner" status implies they will Take at the next node.
  *   **Revisionist Prediction:** **Information Swamps Prior.** Even with the "Proven Reasoner" label, the fact of arrival at a late node (e.g., Node 6) is stronger evidence than the prior label. If a "Proven Reasoner" passed five times, the label is now suspect. Players will treat the opponent as a "Passer" regardless of the pool description, and cooperation will persist similar to the standard human-human treatment.
  *   **Agreed Test:** A treatment where Player 2 is explicitly told Player 1 is a "BI-Expert," but Player 1 is instructed (by the experimenter) to Pass until Node 5. We measure Player 2's action at Node 6.

  #### Crux 3: The Verbal Dispute on Rationality
  **Question:** Is the disagreement substantive, or does it rest on competing definitions of the word "rational"?

  *   **Joint Concession:** We acknowledge that a portion of our dispute is verbal.
      *   If "Rational" is defined as **"Consistency with Common Knowledge of Rationality and Subgame Perfection,"** the Orthodoxy is correct by definition, and the Revisionists are describing "reasonable" behavior that is technically "irrational."
      *   If "Rational" is defined as **"Maximizing Expected Utility given subjective beliefs updated on observed history,"** the Revisionists are correct by definition, and the Orthodoxy is describing a logical consistency constraint that may yield lower payoffs.
  *   **Substantive Remainder:** The dispute is not merely verbal regarding **which definition is more useful for predictive social science.**
      *   **Orthodoxy Claim:** The Subgame Perfect definition is necessary to preserve the normative force of game theory. Without it, "anything goes."
      *   **Revisionist Claim:** The Expected Utility definition is necessary to preserve the descriptive validity of game theory. Without it, the theory predicts zero cooperation in environments where cooperation is stable.
  *   **Agreed Test:** A comparison of predictive accuracy. We will construct models based on both definitions and test them against out-of-sample data from variant centipede games (e.g., uncertain horizon). The faction whose definition yields lower prediction error on *new* data gains the right to stipulate the term "Rational" in future seminar contexts.

  ---

  **Signed,**

  *The Orthodoxy Faction* | *The Revisionist Faction*
  :---:|:---:
  [Representative Signature] | [Representative Signature]
