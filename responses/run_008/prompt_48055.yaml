answer: |-
  Dear friend, it sounds like you are having exactly the kind of apartment debate that makes living with a physicist interesting, and your instincts are spotting the right cracks in the armor even if the technical details feel slippery. You are right to feel that something has gone wrong between the geometry of spacetime and the conclusion about your lease signing, and you are also right to be wary of the transitivity step even if you want to keep the block universe. The short answer is that your housemate is conflating two distinct philosophical claims that often get bundled together under the label of the block universe but are actually independent of one another. She is conflating eternalism, which is the view that past, present, and future events all equally exist, with determinism, which is the view that every event is causally necessitated by prior events and the laws of nature. The Rietdijk-Putnam argument is a strong case for eternalism, but it does no work at all in proving determinism, and that is where step five fails.

  You should refuse step five, and refusing it costs you much less than your housemate implies. When she says that a fact about what you will decide exists before you have deliberated and therefore is not up to you, she is relying on a classic fatalist intuition that has nothing to do with relativity. This is essentially Aristotle's sea battle problem dressed up in Minkowski diagrams. The error is assuming that for a future event to be real, it must be real independently of your current actions. In the block universe, your deliberation is also a real part of the block. The future event of you signing the lease is real, but it is real as the effect of your deliberation, not as a brute fact that overrides it. The geometry of spacetime tells us that the event is there, but it does not tell us how it got there. It is perfectly consistent to say that the future is ontologically real, meaning it exists in the manifold, while still being causally dependent on your free choices in the present. Refusing step five means you have to accept that your freedom is compatible with the future already existing, which is a standard compatibilist position, but it does not force you to accept that your deliberation is theater. Your deliberation is the mechanism by which that part of the block gets filled in.

  Regarding your worry about step three, you have put your finger on a technical nuance that often gets glossed over in these discussions. The relation is simultaneous with is not transitive. If observer A is simultaneous with B, and B is simultaneous with C, A is not necessarily simultaneous with C. Your housemate is using a chain of simultaneity relations to bridge the gap to the future, but she is treating reality as if it transmits along that chain like a baton in a relay race. If you define real for an observer as what is simultaneous with them, then reality does not transmit transitively, and the chain breaks. However, you do not need to deny the block universe to deny this transitivity. You can hold that existence is absolute and transitive while simultaneity is relative and non-transitive. In this view, everything in the spacetime manifold exists simpliciter, not just what is simultaneous with a given observer. This saves you from the solipsism of each observer having a private ontology, because there is still one single block that everyone is part of, but it blocks the argument that tries to pull the future into the present via a chain of nows. You can accept that the future event exists without accepting that it is present for you now, and that distinction is enough to stop the fatalist slide.

  When she escalates to the quantum measurement claim, she is making the same category error again. She argues that because the outcome is a definite fact in the block, there was no objective chance involved. But objective chance is a property of the laws connecting the events, not a property of the events themselves in isolation. In a block universe containing quantum events, the manifold might contain a specific outcome, but the law governing the transition from the past slice to the future slice can still be probabilistic. The fact that the outcome is definite in the completed block does not mean it was determined by the past state alone. It just means that among the possible histories allowed by the probabilistic laws, this is the one that is actual. You can have a block universe where the future is real but indeterminate relative to the past, provided you understand indeterminacy as a feature of the laws rather than a lack of existence. Denying her quantum claim does not require you to abandon the block, only to abandon the idea that existence implies causal necessitation.

  So the place to stand your ground is firmly on step five, with a clarifying note on step three. You tell her that the physics successfully proves that the future is real, which gives you the block universe you like, but it fails to prove that the future is fixed independently of your agency. The cost of this position is that you have to give up the idea that the present is metaphysically privileged in a way that slices the universe into what exists and what does not. You have to accept that your future self is just as real as your present self, which can feel strange, but it does not mean your present self is powerless. Your deliberation is not an illusion just because the result is already part of the geometry. The geometry includes the deliberation as the cause of the result. If she insists that this makes deliberation theater, she is committing the fatalist fallacy that Aristotle identified long before Einstein, and no amount of spacetime diagrams can rescue an argument that confuses the map with the territory. You can keep the block, keep your free will, and keep objective chance, provided you insist that existence does not equal inevitability.
