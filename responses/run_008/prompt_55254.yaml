      *Wait, let's look at the thesis again:* "the dilemma partly manufactures itself."
      *Kill Shot:* "If you run the experiment without the straw poll and the paradox still appears at the same rate, your theory is wrong."
      *Better Kill Shot:* "Strategic voting on premises is easier than on conclusions." If I can manipulate the premises to get my desired conclusion, the premise-based procedure is *more* vulnerable to manipulation, rendering the 'honesty' of the anchor irrelevant.

      *Let's settle on:* The "Strategic Manipulation of Premises" objection. If social choice theorists can show that PBV is *more* manipulable than CBV (Conclusion-Based Voting) when agents are sophisticated, the normative gain from avoiding anchoring is lost to strategic gaming. This hits the "Formal" camp's strength and undermines the "Solution."

