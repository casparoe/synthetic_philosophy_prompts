answer: |-
  Here is your Q&A prep sheet. It is designed to be printed and kept on the podium. The replies are timed for roughly two minutes of spoken word at a moderate pace.

  ### **Audience Camp 1: The Formal Social Choice Theorists**
  **The Vibe:** They care about impossibility theorems, strategy-proofness, and preference profiles. They will treat your psychological claims as "noise" unless formalized.

  **The Objection:**
  "You're proposing a Premise-Based Procedure (PBP) to avoid the paradox, but you're ignoring strategic manipulation. If agents know the conclusion is derived mechanically from the premises, sophisticated voters will vote strategically on the premises to engineer their preferred conclusion. Doesn't strategic voting on premises overwhelm the cognitive anchoring effect you're relying on? You might be trading a psychological bias for a rational manipulation."

  **The Reply:**
  "That's the standard worry, and it's why I emphasize the *temporal* gap. Strategic voting requires high cognitive load: I need to know the logical function, know others' preferences, and calculate the pivot. In real-world assemblies, especially citizen ones, cognitive load is high enough that 'honest' voting on premises is the dominant strategy.
  More importantly, even if they strategize on premises, they are forced to engage with the *reasons*. A strategic vote on a premise still requires accepting the premise as a public justification. A straw poll on the conclusion allows me to vote 'Yes' based on pure interest or bias without ever committing to a reason. So, even with strategic premise voting, the *discursive* quality of the outcome is higher. The anchoring I'm worried about isn't just about the vote count; it's about anchoring the *justification*."

  **The Soft Spot:**
  If they press you on **computational complexity**. If the group is small and expert (like a court or committee), they *can* strategize easily. Your defense relies on "citizen ignorance" or "high cognitive load," which might offend the practitioners or imply citizens are irrational.

  ---

  ### **Audience Camp 2: The Deliberative Democrats**
  **The Vibe:** They think voting is the *end* of politics, not the start. They care about legitimacy, transformation of preferences, and holistic judgment.

  **The Objection:**
  "You're treating the conclusion as a mere logical output, but for participants, the conclusion is the *object* of judgment. People often have a holistic moral intuition about the outcome before they can articulate the technical premises. By banning a straw poll on the conclusion, aren't you disenfranchising their intuitive moral compass? You're forcing a technocratic logic on a moral decision."

  **The Reply:**
  "I agree that holistic judgment is vital, which is why deliberation happens *before* any voting. My ban is specifically on *voting* on the conclusion before the premises are settled, not on *discussing* it.
  The problem with a conclusion straw poll is that it crystallizes positions prematurely. Once I raise my hand for 'Guilty' or 'Yes,' my identity becomes invested in that outcome. Subsequent deliberation on premises becomes motivated reasoning to defend my vote, rather than open inquiry. By keeping the conclusion un-voted until the end, we keep the moral intuition fluid and responsive to the reasons. We preserve the capacity to change our mind about the outcome *because* we changed our mind about the reasons."

  **The Soft Spot:**
  The distinction between **discussing** and **polling** is messy in practice. A "show of hands to see where the room is" (practitioner style) often feels like a vote to participants. If you can't police that line, your rule is unenforceable.

  ---

  ### **Audience Camp 3: The Practitioners (Facilitators)**
  **The Vibe:** They care about energy, time, confusion, and whether the group rebels against the rules.

  **The Objection:**
  "In the room, this feels backwards. If I ask a group to vote on three technical premises without knowing where they lead, they get anxious. They ask, 'Where is this going?' A straw poll on the conclusion gives the group a sense of direction and safety. If you ban that, you risk losing the room's trust or creating a 'Franken-policy' where the premises pass but the conclusion is something nobody actually wanted."

  **The Reply:**
  "I understand the anxiety, but that anxiety is exactly what drives the artificial consistency. They want safety, so they vote for premises that match the conclusion they *think* they want, rather than the premises they *believe* are true.
  To manage the anxiety, the facilitator's job is to frame the premises as 'building blocks' rather than 'commitments.' We can use non-binding breakout groups to test the premises without a plenary straw poll. The 'Franken-policy' risk is real, but it's better than a consistent policy that rests on false premises. If the premises lead to a conclusion everyone hates, that is a valuable discovery—it means the logic of the situation demands a trade-off we weren't willing to make. That's a failure of the proposal, not the procedure."

  **The Soft Spot:**
  **Time.** Breaking out into groups to discuss premises takes much longer than a plenary straw poll. If the workshop is about *efficient* decision-making, your solution might be too expensive to implement.

  ---

  ### **The Question You Hope Nobody Asks**
  **The Question:**
  "You argue that early conclusion voting anchors premise voting. But psychological anchoring is usually strongest on the *first* number or position presented. If you vote on premises first, aren't you just shifting the anchor? You anchor the group on the first premise, which then dictates the conclusion. How do you know your solution isn't just moving the bias from the end of the process to the beginning?"

  **The Reply:**
  "That is a crucial symmetry objection. However, premises are logically prior to the conclusion. Anchoring on a premise constrains the conclusion, which is logically consistent. Anchoring on the conclusion and back-filling premises is logically *incoherent*—it forces the reasons to fit the result.
  So yes, there is path dependence in premise voting, but it is a *rational* path dependence (A + B = C). The straw poll creates an *irrational* path dependence (C, therefore A + B). We can't eliminate order effects, but we can align them with the direction of justification."

  **The Soft Spot:**
  This assumes the group agrees on the logical function (that A + B = C). If they disagree on the logic, premise-anchoring is just as tyrannical as conclusion-anchoring.

  ---

  ### **The Kill Shot**
  **Which objection would make you give up the anchoring argument?**

  If a **Formal Social Choice theorist** stands up and says this:

  > "You claim the dilemma is *manufactured* by the straw poll. But List and Pettit's original proof shows the paradox arises from the **structure of the preference profile**, not the aggregation order.
  >
  > If you run an experiment where you ban straw polls and vote premises first, but the preference profile remains 'discursively dilemmatic' (i.e., the majority still holds inconsistent sets of judgments), the paradox persists regardless of your temporal fix.
  >
  > **If the inconsistency is in the *people's heads* (the profile) and not in the *procedure* (the order), then banning straw polls doesn't solve the dilemma; it just hides the inconsistency until the final vote. You aren't removing the bias; you're just delaying the revelation of the group's irrationality.**"

  **Why this kills the argument:**
  Your thesis rests on the claim that the dilemma is *partly manufactured* by the process (anchoring). If the inconsistency is endogenous to the group's preferences regardless of voting order, your "anchoring" explanation is epiphenomenal. You are treating a structural logical problem as a psychological procedural one. If they can show data where premise-first voting *still* yields the paradox at the same rate, your normative recommendation (ban straw polls) loses its primary justification.

  **Preparation:** Check if you have data or a citation that shows the paradox rate *drops* when straw polls are removed. If you don't, qualify your claim immediately: "I argue it exacerbates the dilemma," not "manufactures it."
