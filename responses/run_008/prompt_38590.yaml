answer: |-
  Friends, family, neighbors. Thank you for coming.

  My father was a machinist. He worked with metal, with tolerances, with parts that had to fit together perfectly for the whole thing to move. He was born in Kaifeng, and he died in Montreal, and in between, he spent his life making sure things held.

  For twenty years, I asked him questions he didn't answer. I asked him what he wanted. I asked him where he would have traveled if he didn't have to be here. I told him there was a man inside him, buried under all the work and the obligations, and that he owed it to himself to dig him out. I thought I was helping him find his freedom.

  He never argued with me. He just went back to work.

  I used to think his silence meant he didn't have an answer. Now, standing here, I think his silence was the answer. I was looking for a person separate from his life. But I don't think he saw it that way. I don't think he believed there was a "him" hidden behind the things he did for us. I think he believed he *was* the doing.

  To be a son was not a job he had; it was how he stood in the world. He cared for his mother until she died. I know this came at a cost. I know, Mom, that there were trips you wanted to take that we never took. I know there were years where his first loyalty was to the past, to the people who came before us. I cannot undo that cost. I can only say that his fidelity was not a choice he made on Tuesday and broke on Wednesday. It was the ground we walked on. It was steady.

  To be a husband was to be present. It was to bring the paycheck home. It was to fix the leak in the basement before you asked. It was to stay in Montreal because this is where the family was rooted, even if the world was wide.

  To be a father was to ensure that his children had the luxury of asking questions he never asked himself. He absorbed the weight of expectation so that I could stand up here and talk about individuality. He took the hit so I could have the freedom to miss the point.

  I see my sister here. She stayed. She knows that this way of living is not a theory. It is a burden. It is showing up when you are tired. It is putting the family's need before your own desire, not because it is easy, but because it is necessary. She shares this history in a way I never did. I left. I traded the closeness for distance. She kept the circle tight.

  And to his grandchildren: You knew him as the quiet man at the head of the table. You might hear people talk about "duty" and think it sounds cold. Like following rules. But watch how he treated you. He didn't tell you he loved you with speeches. He told you by making sure the car started in the winter. By asking if you had eaten. By being the same man on Tuesday as he was on Sunday. In a world that changes constantly, he was a fixed point. You could lean on him. That is not self-erasure. That is a foundation.

  I taught ethics for a living. I spent my career talking about the "self." I told my father that he needed to find his. But looking around this room, I see that he didn't lose himself. He distributed himself. He is in the way my mother manages the house. He is in the way my sister cares for her children. He is in the stability I rely on, even when I argued against it.

  There is no essential man to find underneath these roles. There is only the sum of what he held together.

  So I will not eulogize the father I wanted him to be. I will honor the father he was. He was a son who did not walk away. A husband who stayed. A father who provided. A neighbor who was reliable.

  He was not a stone waiting to be carved. He was the carving. And the work stands.

  Thank you.
