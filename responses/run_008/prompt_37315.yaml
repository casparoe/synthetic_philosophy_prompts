  6.  **Predicting Failures (The "Honest" Section):**
      *   *Failure 1:* Students treat it as a pure math puzzle, not an existential one.
      *   *Failure 2:* The "Reference Class" problem. Who counts as a "human"? (In game: Who counts as a "player"?).
      *   *Failure 3:* The "No One Knows the Prior" issue. In the game, I set the prior (50/50). In reality, we don't know the prior probability of Doom Soon vs. Doom Late.
