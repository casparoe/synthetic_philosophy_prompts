prompt: |-
  I'm teaching a small seminar on probability and philosophical puzzles — 16 students, one 80-minute session, no stats background assumed. Design an in-class game that makes them feel the pull of the doomsday argument before they've ever heard its name. Something where they get placed as a random member of a population whose total size they have to bet on, using nothing but their own draw, with fake-currency payoffs so the stakes actually bite (they cant coast). Ideally run it in two rounds: first the plain version, then a variant where the rules change so that some of them would only have been in the room under one hypothesis about the population size, so they hit the selection-effect problem themselves instead of being told about it. Then a debrief that maps moments from the game onto the self-sampling assumption and its rivals, without lecturing — names like Carter, Leslie, and the presumptuous philosopher objection should only come out after the students have already articulated the positions in their own words. Also tell me what will predictably go wrong the first time I run this, and be honest about which part of the real argument no classroom game can reproduce and I'll have to supply in the debrief.
