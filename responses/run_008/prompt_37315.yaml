answer: |-
  Here is a complete lesson plan designed for an 80-minute seminar. It prioritizes experiential learning over lecturing, forcing students to confront the probabilistic tension before giving them the vocabulary to resolve it.

  # Seminar Plan: The Lottery of Existence
  **Time:** 80 Minutes
  **Students:** 16
  **Materials:** Two opaque bags, index cards (numbered), poker chips (or candy wrappers as currency), whiteboard.

  ## Part 1: The Setup (5 Minutes)
  **Goal:** Establish stakes without triggering statistical anxiety.

  1.  **The Currency:** Hand out 10 "Existence Chips" to each student. Explain that at the end of class, the top 3 chip-holders get a tangible prize (e.g., high-quality chocolate, homework pass, or "Philosopher King" title). The bottom 3 must surrender a chip to the winner (social stakes).
  2.  **The Rule:** "You cannot sit out. In every round, you must wager at least 5 chips on a hypothesis. You are betting on the nature of reality, not just guessing."
  3.  **The Premise:** "We are simulating a universe. There are two possible worlds, **World S** (Short) and **World L** (Long). I have secretly flipped a coin to decide which world we are in. You do not know which. Your goal is to figure it out."

  ## Part 2: Round 1 — The Copernican Pull (25 Minutes)
  **Goal:** Induce the Doomsday Argument intuition (Self-Sampling Assumption) without naming it.

  **The Mechanics:**
  1.  **Hypotheses:**
      *   **World S:** Total population = 50 people. (Cards numbered 1–50 in Bag S).
      *   **World L:** Total population = 5,000 people. (Cards numbered 1–5,000 in Bag L).
      *   *Note:* Tell students these numbers, but do not tell them which bag you are holding.
  2.  **The Draw:** Walk around the room. Have each student draw **one** card from the single bag you are holding (replace the card after drawing so duplicates are possible, simplifying the math).
  3.  **The Information:** Students look at their number privately.
      *   *Instructor Note:* To ensure the intuition lands, if you are simulating the draw, ensure most numbers are low (under 50). If a student draws #3,000, the game is over for them (they know it's World L). If you are using a real bag, accept the randomness but highlight the low numbers in debrief.
  4.  **The Bet:** Students wager chips on World S or World L.
  5.  **The Reveal:** Collect bets. Reveal the actual bag (e.g., "It was World S"). Pay out winnings.

  **What should happen:**
  Most students will draw low numbers (e.g., #7, #12, #45). Even though both worlds contain these numbers, the *probability* of drawing #7 is much higher in World S (1/50) than World L (1/5000). Rational bettors should wager heavily on **World S**.

  ## Part 3: Round 2 — The Selection Effect (25 Minutes)
  **Goal:** Induce the Self-Indication Assumption (SIA) counter-argument.

  **The Mechanics:**
  1.  **Reset:** Everyone gets 10 chips again.
  2.  **The Twist:** "The rules of existence have changed. In Round 1, you were guaranteed to be in this room. In Round 2, **your presence here is contingent on the population size.**"
  3.  **The Scenario:**
      *   **World S:** Only 50 souls are created in the universe.
      *   **World L:** 5,000 souls are created in the universe.
      *   **The Catch:** "Imagine you are a soul waiting to be born. A 'Creator' picks a world. Then, the Creator randomly selects one soul from that world to wake up and attend this seminar. **You woke up.**"
  4.  **The Draw:** You don't need physical cards this time. The "draw" is the fact of their existence in the classroom.
  5.  **The Bet:** "Given that you exist and are sitting here, bet on World S or World L."
  6.  **The Reveal:** Collect bets. Do *not* reveal the truth this time (keep it ambiguous to fuel debate).

  **What should happen:**
  Students who bet on **World S** in Round 1 should feel a pull toward **World L** now. Why? Because if World L is true, there are 100x more souls. It is 100x more likely that *you* (a random soul) would be selected to exist in World L than in World S. This counteracts the "low number" intuition from Round 1.

  ## Part 4: The Debrief — Mapping the Intuition (25 Minutes)
  **Goal:** Let students articulate the philosophy, then attach the names.

  **Step 1: Elicit the Conflict (10 mins)**
  *   Ask a student who bet S in Round 1 and L in Round 2: *"Why did you switch?"*
  *   **Expected Answer:** "In the first round, my number was low, so the small group made more sense. In the second round, I realized it's way more likely I'd be picked to be alive if there were more people total."
  *   Write these two reasonings on the board side-by-side.
      *   Reasoning A: "I am a random sample from the total; my low rank implies a small total."
      *   Reasoning B: "I am a random observer; the fact that I exist implies a larger total."

  **Step 2: Introduce the Vocabulary (10 mins)**
  *   Now, and only now, introduce the terms.
  *   **Reasoning A** is the **Self-Sampling Assumption (SSA)**. This is the engine of the **Doomsday Argument** (Brandon Carter, John Leslie). It suggests we should expect humanity to end sooner rather than later because we find ourselves relatively early in the timeline.
  *   **Reasoning B** is the **Self-Indication Assumption (SIA)**. This leads to the **Presumptuous Philosopher** objection (Nick Bostrom). It suggests we should bet on worlds with more observers simply because there are more of them to bet.
  *   Ask the class: *"If you combine these two, what happens?"* (They cancel out. This is the "Great Filter" or "Bayesian Standoff" discussion).

  **Step 3: The Real World Application (5 mins)**
  *   Ask: *"In Round 1, you knew the prior odds were 50/50 (the coin flip). In real life, do we know the prior odds of Humanity lasting 1,000 years vs 1,000,000 years?"*
  *   Let them realize the game hid a massive variable: The Prior.

  ---

  # Instructor's Cheat Sheet: What Will Go Wrong
  *Be honest with yourself about these failure modes so you can pivot.*

  **1. The "Outlier" Problem (Round 1)**
  *   **Risk:** A student draws #4,200.
  *   **Result:** They know with 100% certainty it is World L. The probabilistic tension vanishes for them.
  *   **Fix:** If this happens, isolate them. "You have perfect information. Ignore you. Look at the person with #12. Why is their life harder than yours?" Use the outlier to highlight that the DA only works when you are in the overlap zone.

  **2. The "Existence" Abstraction (Round 2)**
  *   **Risk:** Students treat Round 2 exactly like Round 1 because physically, they are all still in the room. They won't *feel* the selection effect.
  *   **Result:** No one changes their bet. The philosophical conflict fails to materialize.
  *   **Fix:** Spend more time on the "Soul Waiting Room" visualization. Ask: "If I told you World S had 1 person and World L had 1 billion, and you are here, would you bet on S?" Force the extreme to break the inertia.

  **3. Risk Aversion vs. Probability**
  *   **Risk:** Students wager based on "not losing chips" rather than Bayesian likelihood.
  *   **Result:** They split bets 50/50 to hedge.
  *   **Fix:** Remind them: "The goal is to maximize chips, not minimize variance. If you think S is 90% likely, betting 5 chips on L is mathematically suicidal."

  **4. The Reference Class Trap**
  *   **Risk:** A student asks, "Why am I a random human? Why not a random mammal? Or a random conscious moment?"
  *   **Result:** This is actually a *success* (it's the Reference Class Problem), but it can derail the timing.
  *   **Fix:** Park it on the board. "This is the Reference Class Problem. It's a valid objection, but for this game, the class is 'Seminar Student.' We will discuss why that definition matters in the last 5 minutes."

  ---

  # The "Uncopyable" Limitation
  *You must supply this in the debrief. No game can reproduce it.*

  **The Problem of the Prior:**
  In the game, you (the Instructor) set the prior probability of World S vs. World L at 50/50 (the coin flip). This is the **Principle of Indifference**.
  In the real Doomsday Argument, we do **not** know the prior probability of "Humanity goes extinct in 2100" vs. "Humanity colonizes the galaxy."
  *   If the prior probability of Doom Soon is already microscopic (e.g., 0.0001%), the Doomsday Argument (which might shift the odds by a factor of 100) still leaves Doom Soon unlikely.
  *   **Debrief Point:** "The game rigged the priors to make the math clean. In reality, the Doomsday Argument doesn't tell you *when* the end is; it only tells you how to update your *existing* beliefs. If you started optimistic, you remain optimistic, just slightly less so."

  **The "No Observers" Paradox:**
  In the game, even in World S, the students exist to observe the outcome. In the real Doomsday Argument, if "Doom Soon" is true, there are *no future observers* to verify the argument.
  *   **Debrief Point:** "In Round 1, if World S was true, you still got to collect your chips. In reality, if the Doomsday Argument is right and we go extinct soon, there is no one left to say 'I told you so.' This makes the argument unfalsifiable in a way the game wasn't."

  # Summary of Philosophical Mapping
  | Game Moment | Student Intuition | Philosophical Concept | Key Name |
  | :--- | :--- | :--- | :--- |
  | **Round 1 Bet** | "My number is low, so the pool must be small." | **Self-Sampling Assumption (SSA)** | Brandon Carter / John Leslie |
  | **Round 2 Bet** | "I exist, so the pool must be large (more tickets sold)." | **Self-Indication Assumption (SIA)** | Nick Bostrom |
  | **The Conflict** | "These two rules contradict each other." | **The Presumptuous Philosopher** | Bostrom (Objection to SIA) |
  | **The Setup** | "Why 50/50? Who decided the odds?" | **The Prior Probability Problem** | Bayesian Critique |
