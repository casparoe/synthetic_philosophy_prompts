                  *   *The Observation:* You are observing.
                  *   *The Shift:* In L, there are more observers. So the fact that *an* observer exists favors L.
                  *   *How to gamify:* "The Existence Tax."
                  *   In Round 2, if they bet on Small, they pay a higher entry fee because "It's unlikely you'd be here to bet."
                  *   *Actually, let's keep it simpler.*
                  *   Round 1: Standard Urn. (Focus on Rank).
                  *   Round 2: The "Incubator." Tell them: "In Round 1, you were guaranteed to be here. In Round 2, imagine you won a lottery to be born. In the Small World, 10 tickets were sold. In the Large World, 10,000 tickets were sold. You hold a ticket. Does this change your bet?"
                  *   *Action:* Have them write down a new bet. Compare the shift.

  5.  **Debrief Strategy:**
      *   Don't lecture. Ask: "Why did you change your mind?"
      *   Elicit: "Because I'm here." (SIA).
      *   Elicit: "Because my number is low." (SSA/DA).
      *   Map terms *after* they speak.
