              *   *Game Mechanic:* I deal cards.
              *   Deck S: 10 cards (1-10).
              *   Deck L: 100 cards (1-100).
              *   I pick a deck. I deal 16 cards.
              *   *Wait, if I pick Deck S, I can't deal 16 cards.*
              *   *Okay, this is the physical constraint.*
              *   *Workaround:* "The God's Eye View."
              *   Round 1: You know you are in the class. You just don't know the total population size. (Standard DA).
              *   Round 2: You are told that *your presence in the class* was contingent on the population size.
              *   *Specific Mechanic:*
