      *   **Dorothea's Ardour:** She has the *shape* of a saint (ascetic, desire for service, intensity) but no *content* (no Catholicism, no clear doctrine). She tries to pour this wine into old bottles (Casaubon) and new bottles (Ladislaw/social reform).
      *   **Casaubon's Key:** It's not just a joke about dry scholarship. It's the tragedy of trying to find unity *after* the unifying principle (God) has vanished. It's the map without the territory. It represents the *dead* hand of the past trying to categorize the sacred rather than live it.
      *   **Lydgate:** Represents the scientific/secular vocation. He fails not because science is weak, but because the social web (money, status, marriage) is stronger than individual will. This mirrors the religious question: can individual moral will survive without divine support?
      *   **The Narrative Voice:** It is omniscient, judgmental, compassionate, and weary. It functions like a secular providence. It sees the web.
