prompt: |-
  I'm the attending veterinarian on the animal care and use committee at a mid-size university, and I need a procedure, not a philosophy seminar. We keep getting protocols for species where sentience is genuinely contested -- an octopus cognition study, Drosophila heat-avoidance assays, crayfish nerve recordings, larval zebrafish -- and our rules basically protect mammals and birds and treat everything else as a grayzone we argue about ad hoc every meeting. Act as a philosopher of mind with a practical streak. Think carefully and maybe brainstorm the design first, then write a decision procedure the committee can actually run on a new protocol: the questions to ask in order about the species and what the procedure does to it, what kinds of evidence of sentience-relevant capacities (nociception vs. pain, flexible trade-offs, self-medication, that sort of thing) should be enough to trigger protections, how to weigh a precautionary principle against imposing enormous costs on researchers for what might be welfare theater, where the procedure should stop and hand things to a human because it's a value call not a factual one, and what the default should be when the evidence is thin in both directions. Then run it on two cases: a student who wants to do nerve recordings from crayfish without anesthesia on the grounds that crustaceans don't feel anything, and a genetics lab whose larval zebrafish work would become vastly more expensive if larvae got full sentient-animal treatment. Be honest about which steps are judgment calls dressed up as procedure, and tell me where the procedure will give an answer I won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Attending Veterinarian (AV) on an IACUC (Institutional Animal Care and Use Committee) at a mid-size university.
      *   **Problem:** Protocols involving species with contested sentience (octopus, Drosophila, crayfish, larval zebrafish) create ad hoc arguments. Current rules protect mammals/birds, others are a gray zone.
      *   **Goal:** A practical *decision procedure*, not a philosophy seminar. Needs to be actionable for the committee.
      *   **Role:** Philosopher of mind with a practical streak.
      *   **Requirements:**
          *   Design/Brainstorm phase.
          *   The Decision Procedure (questions, evidence thresholds, precautionary principle vs. cost, hand-off points, defaults).
          *   Application to two cases (Crayfish nerve recordings, Larval Zebrafish genetics).
          *   Honesty about judgment calls and unpopular outcomes.

  2.  **Deconstruct the Ethical/Scientific Landscape:**
      *   *Legal Baseline:* In the US (assuming US context based on "IACUC/AV" terminology), the Animal Welfare Act (AWA) covers warm-blooded animals. Fish are covered by PHS Policy if federally funded. Invertebrates are generally excluded. However, institutional policy can exceed legal minimums.
      *   *Sentience vs. Nociception:* Nociception is reflexive detection of harm. Pain is the subjective negative experience. We can't measure subjective experience directly, only proxies.
      *   *Precautionary Principle:* If there's a non-negligible chance of sentience/suffering, err on the side of protection.
      *   *Cost/Benefit:* "Welfare theater" (imposing high costs for negligible welfare gain) is a real concern. Research value matters.
      *   *The "Gray Zone":* Cephalopods are often protected (EU, Canada). Crustaceans are gaining traction (UK). Insects/Larvae are more contentious.

  3.  **Brainstorming the Procedure Design:**
      *   *Structure:* Needs to be a flowchart or a stepwise checklist.
      *   *Step 1: Taxonomic Triage.* Is it legally covered? If yes, stop (follow standard rules). If no, proceed.
      *   *Step 2: Evidence of Sentience.* What counts? Opioid analgesia trade-offs, learned avoidance, protective behavior, centralization of nervous system.
      *   *Step 3: Procedure Severity.* What is being done? Lethal vs. non-lethal, invasive vs. non-invasive.
      *   *Step 4: The Precautionary Calculus.* Weigh probability of sentience against severity of procedure.
      *   *Step 5: The Cost/Benefit Check.* Is the burden on research disproportionate to the welfare gain? (This is the tricky ethical bit).
      *   *Step 6: The Hand-off.* Where does the algorithm fail? When values conflict (e.g., research necessity vs. moral risk).
      *   *Default:* When in doubt, protect *if* the cost is manageable. If cost is prohibitive, require specific justification.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Critique of initial thought:* Don't make it too binary. Sentience isn't on/off. It's a gradient.
      *   *Refinement:* Use a "Sentience Probability Score" (SPS) based on criteria.
      *   *Criteria:* Nervous system complexity, behavioral flexibility, pharmacological evidence (analgesics work?), evolutionary distance.
      *   *Thresholds:* High SPS = Full protection. Low SPS = Basic humane endpoints. Medium SPS = Precautionary measures.
      *   *The "Welfare Theater" Check:* If the mitigation costs > 50% of budget or kills the science, does the moral risk justify it? This needs a specific "Override" mechanism.
      *   *The Default:* Precautionary principle applies *unless* it renders the research impossible. Then, minimize harm instead of full protection.

  5.  **Developing the Two Test Cases:**
      *   *Case 1: Crayfish Nerve Recordings (No Anesthesia).*
          *   Evidence: Crustaceans show avoidance learning, opioid responses. SPS = Medium-High.
          *   Procedure: Invasive, potential pain.
          *   Outcome: Procedure should likely flag for anesthesia or justification.
          *   Unpopular truth: The student might be wrong; "they don't feel anything" is outdated.
      *   *Case 2: Larval Zebrafish Genetics.*
          *   Evidence: Larvae (< 5 dpf usually) have nociception but debated pain. SPS = Low-Medium.
          *   Procedure: High throughput, anesthesia is logistically nightmarish/expensive.
          *   Outcome: Precautionary measures (humane endpoints) but maybe not full adult-level anesthesia.
          *   Unpopular truth: If the procedure says "treat as sentient," the lab might shut down. The procedure needs to allow a "Minimization" tier.

  6.  **Refining the "Honesty" Component:**
      *   I need to explicitly state where the procedure is just codifying bias or where it forces a value judgment.
      *   The "Cost vs. Suffering" trade-off is inherently utilitarian and subjective.
      *   The definition of "prohibitive cost" is a judgment call.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the AV's position.
      *   **Design Logic:** Briefly explain the philosophical underpinnings (Precautionary Principle + Gradualism).
      *   **The Procedure (The "Sentience Triage Protocol"):** Step-by-step.
      *   **Application:** Run the two cases.
      *   **The "Ugly Truths":** Where the procedure fails or bites the user.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid philosophy seminar talk? *Yes, keep it operational.*
      *   *Check:* Did I address the "default" question? *Yes, Precautionary Default.*
      *   *Check:* Is the distinction between nociception and pain clear? *Need to ensure the criteria reflect this.*
      *   *Check:* Is the "hand-off" clear? *Yes, at the 'Override' stage.*
      *   *Tone:* Professional, direct, slightly cynical but helpful.

  9.  **Final Polish:** Ensure the distinction between *legal* requirements and *institutional* policy is clear. The AV knows the law, they need policy for the gaps. (Proceed to generate response).

  *(Self-Correction Note during drafting the procedure)*: I initially thought about a scoring system. But scoring systems can be gamed. Better to use a "Trigger List." If X, Y, or Z evidence exists, move to Tier 2. If Procedure is A, B, or C, move to Tier 3. This is more robust for a committee.

  *(Refining the Zebrafish case)*: Larval zebrafish (<5 days post-fertilization) are often exempt from IACUC in many jurisdictions. But the prompt implies they are currently in the gray zone at this university. I need to respect that context. The conflict is cost vs. potential sentience.

  *(Refining the Crayfish case)*: The student claims "they don't feel anything." The procedure needs to challenge that assertion with evidence requirements.

  *(Final thought on "Unpopular Answers")*: The unpopular answer for the AV is usually that the procedure will demand more work for the committee or slow down research. I need to highlight that.

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  ### Design Logic: The "Precautionary Gradient"

  You don't need a theory of consciousness; you need a risk management framework. The philosophical core here is **Gradualism** combined with the **Precautionary Principle**.

  1.  **Gradualism:** Sentience isn't a binary switch. It's a probability distribution based on neural complexity and behavioral flexibility. Protections should scale with that probability.
  2.  **Precautionary Principle:** If there is a non-negligible probability of suffering and the cost of mitigation is manageable, you mitigate.
  3.  **The "Welfare Theater" Brake:** If the cost of mitigation renders the science impossible without significantly reducing the probability of suffering, you shift from *prevention* to *minimization*.

  Below is the **Non-Vertebrate Sentience Triage Protocol (NV-STP)**. It is designed to be a checklist the IACUC administrator hands to the PI before the meeting, so the committee isn't debating biology during the vote.

  ---

  ### The Procedure: Non-Vertebrate Sentience Triage Protocol (NV-STP)

  **Step 1: The Legal & Taxonomic Filter**
  *   **Q1:** Is the species covered by the Animal Welfare Act, PHS Policy, or specific state law?
      *   *Yes:* Follow standard vertebrate protocols. **STOP.**
      *   *No:* Proceed to Step 2.
  *   **Q2:** Is the species a Cephalopod (e.g., octopus, squid)?
      *   *Yes:* Automatic Tier 1 Protection (Treat as sentient). Many jurisdictions already mandate this; do not argue biology. **STOP.**
      *   *No:* Proceed to Step 3.

  **Step 2: The Evidence Trigger (The "Sentience Probability" Check)**
  *Review the literature provided by the PI. Does the species demonstrate **two or more** of the following?*
  1.  **Analgesic Trade-off:** Does the animal accept a cost (e.g., reduced shelter, food) to access analgesics when injured?
  2.  **Flexible Avoidance:** Does the animal learn to avoid a stimulus over time, rather than just reflexive withdrawal (e.g., conditioned place preference/aversion)?
  3.  **Central Integration:** Does the nervous system show integration of nociceptive input with higher-order processing (e.g., opioid receptors in central ganglia/brain, not just peripheral nerves)?
  4.  **Protective Behavior:** Does the animal guard, rub, or favor an injured area after the immediate threat is removed?

  *   **0-1 Triggers:** **Low Probability.** Proceed to Step 3 (Basic).
  *   **2+ Triggers:** **Moderate/High Probability.** Proceed to Step 3 (Enhanced).

  **Step 3: The Procedure Severity Matrix**
  *What is being done to the animal?*
  *   **Level A (Non-Invasive):** Observation, water chemistry, non-contact imaging.
  *   **Level B (Minor Invasive):** Fin clips, limb removal (autotomy), brief exposure to noxious stimuli.
  *   **Level C (Major Invasive):** Nerve recording, dissection while alive, prolonged exposure to extreme temperatures/pH, lethal sampling without prior anesthesia.

  **Step 4: The Decision Matrix**
  *Combine Step 2 (Evidence) and Step 3 (Severity).*

  | Evidence Level | Procedure Level A | Procedure Level B | Procedure Level C |
  | :--- | :--- | :--- | :--- |
  | **Low Probability** | **Exempt** (Humane endpoints only) | **Tier 2** (Minimize numbers, rapid death) | **Tier 3** (Anesthesia/Analgesia required *if feasible*) |
  | **Mod/High Probability** | **Tier 2** (Minimize stress) | **Tier 3** (Anesthesia/Analgesia required) | **Tier 4** (Full Vertebrate Equivalency) |

  **Step 5: The Feasibility Override (The "Welfare Theater" Check)**
  *If the Matrix dictates Tier 3 or 4:*
  *   **Q:** Does the required mitigation (anesthesia, housing, monitoring) increase the cost or logistical burden by >50% or technically invalidate the experimental design?
      *   *No:* Implement Tier 3/4.
      *   *Yes:* PI must submit a **Justification of Infeasibility**.
          *   IACUC must verify the claim (AV consults literature on anesthetic protocols for that species).
          *   If verified: Downgrade to **Tier 2 Minimization** (reduce numbers, refine endpoints, ensure rapid death).
          *   *Note:* This is the hand-off point. The Committee must vote to accept the risk. This is a value judgment, not a fact.

  **Step 6: The Default Rule**
  *   If evidence is thin (Step 2 is ambiguous) AND procedure is invasive (Level C): **Default to Protection.**
  *   Rationale: It is easier to refine a protocol later than to undo suffering.

  ---

  ### Running the Cases

  #### Case 1: Crayfish Nerve Recordings (No Anesthesia)
  *   **Step 1:** Not legally covered. Not a cephalopod. Proceed.
  *   **Step 2 (Evidence):**
      *   *Analgesic Trade-off:* Studies exist showing crayfish avoid areas where they were shocked unless given analgesics. (Trigger 1)
      *   *Protective Behavior:* They groom and protect injured antennae/tails. (Trigger 2)
      *   *Result:* **Moderate/High Probability.**
  *   **Step 3 (Severity):** Nerve recording involves dissection/exposure while alive. **Level C (Major Invasive).**
  *   **Step 4 (Matrix):** Mod/High Evidence + Level C = **Tier 4 (Full Vertebrate Equivalency).** Anesthesia/Analgesia required.
  *   **Step 5 (Override):** Student claims "they don't feel anything."
      *   *AV Check:* This claim contradicts current carcinology literature (e.g., Magee & Elwood, 2013). Anesthesia for crustaceans (e.g., clove oil, cooling followed by rapid procedure) is feasible.
      *   *Outcome:* **Override Denied.** Protocol must include anesthesia or euthanasia prior to recording.
  *   **The Unpopular Truth:** The student's protocol is rejected. The "they are just robots" argument is scientifically outdated, but cheap and easy. The committee will look like they are obstructing undergraduate research. You must hold the line here because the evidence trigger is met.

  #### Case 2: Larval Zebrafish Genetics (High Throughput)
  *   **Step 1:** PHS Policy covers vertebrates, but larvae < 5 days post-fertilization (dpf) are often exempt federally. Assuming your institution treats them as "gray zone" (pre-feed). Proceed.
  *   **Step 2 (Evidence):**
      *   *Analgesic Trade-off:* Weak evidence in larvae.
      *   *Flexible Avoidance:* Nociceptive reflexes present, learned avoidance debatable before 5 dpf.
      *   *Central Integration:* Nervous system developing, but functional connectivity for *pain* (vs. nociception) is contested.
      *   *Result:* **Low Probability** (conservatively).
  *   **Step 3 (Severity):** Genetic screening often involves immersion in chemicals, imaging, lethal sampling. **Level B/C hybrid.** Let's call it **Level B** (if rapid death) or **Level C** (if prolonged). Assume **Level B** for screening.
  *   **Step 4 (Matrix):** Low Evidence + Level B = **Tier 2 (Minimize numbers, rapid death).**
  *   **Step 5 (Override):** Lab claims full anesthesia for 5,000 larvae is logistically impossible (cost/time).
      *   *AV Check:* They are right. Tricaine immersion for that volume is prohibitive.
      *   *Outcome:* **Override Accepted.** Protocol moves to **Tier 2 Minimization**.
      *   *Requirements:* Rapid humane endpoints (ice bath or overdose if >5dpf), strict culling numbers, no recovery from noxious stimuli.
  *   **The Unpopular Truth:** The genetics lab gets a pass on anesthesia, *but* the IACUC must enforce strict culling limits. If the lab is wasteful, you shut them down. The "unpopular" part is that you are allowing potential suffering for the sake of throughput, betting on the "Low Probability" assessment. If larvae *do* feel pain, you just authorized 5,000 painful deaths per week.

  ---

  ### The "Ugly Truths" (Where the Procedure Bites You)

  You asked for honesty about where this is judgment dressed as procedure and where you won't like the answer.

  **1. The "Feasibility Override" is a Loophole.**
  Step 5 is where the philosophy dies and budgeting takes over. By allowing cost to downgrade protection, you are explicitly stating that **research convenience outweighs uncertain animal welfare.**
  *   *The Judgment:* Defining "prohibitive cost" (I used 50%, but that's arbitrary).
  *   *The Unpopular Answer:* You will approve protocols that cause suffering because fixing them is too expensive. You have to be okay with being complicit in that trade-off. This procedure makes that complicity explicit rather than hidden in ad hoc arguments.

  **2. The Default Rule Will Slow Science.**
  Step 6 says "When in doubt, protect."
  *   *The Judgment:* How much doubt is enough?
  *   *The Unpopular Answer:* You will get pushback from Deans and PIs. They will say you are regulating based on "feelings." You are. That's what ethics *is*. But expect threats that research will move to other institutions with laxer rules.

  **3. The Evidence Trigger is Static.**
  Science moves fast. Today's "Low Probability" (e.g., Drosophila) might be tomorrow's "High Probability."
  *   *The Judgment:* Who updates the literature review? You (the AV).
  *   *The Unpopular Answer:* This creates more work for your office. You cannot outsource the literature check to the PI entirely, because they have a conflict of interest. You will become the bottleneck.

  **4. The Crayfish Case reveals the "Speciesism" Trap.**
  In Case 1, the procedure forces you to treat a crayfish like a rat.
  *   *The Unpopular Answer:* Your committee will hate this. They will ask, "Why are we spending $500 on crayfish anesthesia for a $2,000 grant?" The procedure forces you to answer: "Because the evidence says they might suffer, and we said we care." If you aren't willing to enforce that, don't use the procedure.

  ### Final Recommendation for Implementation

  1.  **Adopt the NV-STP as Institutional Policy.** Get the IACUC Chair and IO to sign off. This shields you from individual PI pressure.
  2.  **Publish the Evidence Triggers.** Make it clear to researchers *before* they submit that crustaceans/cephalopods require specific literature citations regarding nociception.
  3.  **The "Sunset Clause."** Review the Evidence Triggers every 2 years. If new data on zebrafish larvae emerges, the Matrix changes automatically.
  4.  **Own the Override.** When you grant a Feasibility Override (like the zebrafish lab), document it as a **Risk Acceptance**. "The Committee acknowledges the risk of suffering and accepts it due to logistical constraints." Put that in the minutes. If the public asks, you don't say "they don't feel pain." You say "We weighed the risk against the feasibility and minimized harm where possible."

  This procedure doesn't solve the moral problem. It just forces you to make the moral trade-offs explicitly, on the record, rather than in a hallway argument after the meeting.
