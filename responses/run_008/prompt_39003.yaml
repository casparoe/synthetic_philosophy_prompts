answer: |-
  Based on the track record you've provided, here is an analysis of your friend's principles, a prediction for Norland, and a proposal for how to test the underlying theory.

  ### The Verdict on Norland
  **Prediction:** She will rule that the Norland secession is **illegitimate** and that the national government is **within its rights** to refuse negotiation.

  **Reasons:**
  1.  **The Catalonia Precedent is Decisive:** Her stance on Catalonia is the closest analogue to Norland. Both involve a stable democracy, a unilateral referendum, and a refusal by the central state to authorize the vote. She sided with Madrid. Crucially, when you pressed her on whether a *cleaner* unilateral vote would have changed her mind, she deflected. This suggests she views the *authority* to hold the vote (constitutional consent) as a lexical priority over the *quality* of the vote in non-oppressive contexts.
  2.  **The Kosovo Exception Doesn't Apply:** She accepts unilateralism in Kosovo specifically because of "mass expulsions" (a remedial right). Norland is explicitly defined as having "no history of oppression." Without the remedial justification, the unilateral pathway closes.
  3.  **The Czechoslovakia Clue:** She accepted the dissolution of Czechoslovakia without *any* referendum because the parliaments agreed. This reveals that she trusts **institutional consensus** more than **popular plebiscites**. In Norland, you have a popular plebiscite without institutional consensus (the national government refuses). For her, the Czechoslovakia case implies that elite agreement can substitute for a vote, but a vote cannot substitute for elite agreement.
  4.  **The Quebec Threshold:** While Norland clears the "clear majority" bar (64% Yes, high turnout), her Quebec stance was about Canada being *right to allow* the referendum. In Norland, the state refused. She likely views the "clear majority" requirement as a condition for *authorized* referendums, not a trump card for unauthorized ones.

  ### Rival Rules Fitting Her Record
  There are two coherent principles that explain most of her verdicts, but they diverge sharply on Norland.

  **Rule 1: Constitutional Consent with Remedial Exception**
  *   **The Principle:** Secession is legitimate only if (A) the host state consents to the process (Scotland, Czechoslovakia) OR (B) there are grave human rights violations justifying a remedial right (Kosovo). Unilateral votes in stable democracies without consent are illegitimate regardless of the outcome (Catalonia, Crimea).
  *   **Prediction for Norland:** **Illegitimate.** Norland lacks host state consent and lacks remedial grievance. The high turnout and clean process are irrelevant because the *authority* to vote was absent.

  **Rule 2: Qualified Primary Right (Democratic Will)**
  *   **The Principle:** Secession is legitimate if there is a sufficiently strong, sustained, and uncoerced expression of the region's will (high turnout, supermajority, repeated votes). Host state consent is preferred but not strictly required if the democratic mandate is overwhelming. Kosovo's grievance was just one way to prove the seriousness of the will; Catalonia failed on turnout/clarity, not just legality.
  *   **Prediction for Norland:** **Legitimate.** Norland clears the high thresholds (two votes, >60% Yes, >75% turnout, >50% of electorate). The lack of constitutional consent is outweighed by the clarity of the popular will.

  ### Where They Diverge
  The rules diverge on the **source of legitimacy**.
  *   **Rule 1** locates legitimacy in **procedure and order** (constitutions, treaties, human rights law). It prioritizes stability and the rule of law, allowing breaks only by agreement or necessity.
  *   **Rule 2** locates legitimacy in **popular sovereignty**. It prioritizes the democratic will of the people, viewing constitutional hurdles as procedural obstacles that can be overridden by a clear enough mandate.

  Norland is the perfect stress test because it maximizes the "Popular Will" variables (high turnout, clean vote) while removing the "Procedural/Remedial" variables (no consent, no oppression).

  ### The Decisive Test Case
  To distinguish whether she is a Rule 1 (Constitutional/Institutional) theorist or a Rule 2 (Democratic Will) theorist, you need a case that separates **Elite Agreement** from **Popular Will**. Her acceptance of Czechoslovakia (Elite Agreement, No Vote) is the wildcard that suggests Rule 1, but you need to confirm she doesn't actually require *both*.

  **Proposed Case: "The Elite Betrayal"**
  Imagine a region called **Westria** in a stable federal democracy.
  *   **The Setup:** The National Parliament and the Westrian Provincial Parliament both pass legislation agreeing to a peaceful separation (mirroring Czechoslovakia). They sign a treaty of dissolution.
  *   **The Twist:** No referendum is held. Subsequent polling reveals that **70% of Westria's population opposes independence** and wishes to remain in the federation.
  *   **The Question:** Is the secession legitimate?

  **How the Rules Predict:**
  *   **Rule 1 (Constitutional/Institutional):** **Legitimate.** She accepted Czechoslovakia without a vote because the parliaments agreed. If she is consistent, the institutional process confers legitimacy even if the popular will is currently contrary (representative democracy trumps direct plebiscite).
  *   **Rule 2 (Democratic Will):** **Illegitimate.** If legitimacy tracks the people's will, a 70% opposition should veto the secession, regardless of what the parliaments decided.

  **Why this works:**
  If she says **Yes** (Legitimate), she is a **Constitutional/Institutional** theorist (Rule 1). This confirms her Norland verdict will be **No** (because Norland lacks institutional consent).
  If she says **No** (Illegitimate), she is a **Democratic Will** theorist (Rule 2). This suggests her Norland verdict might actually be **Yes** (because Norland has the popular will Westria lacks), and her Czechoslovakia verdict was an anomaly or relied on an assumption of tacit consent.

  This case cuts through the "clear majority" ambiguity (votes cast vs. electorate) and the "remedial" ambiguity to isolate the fundamental source of authority in her political philosophy.
