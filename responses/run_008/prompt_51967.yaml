          *   Orwell/Syme: Delete words, delete concepts.
          *   *Verdict:* Strictly speaking, Fodor wrecks Newspeak's *stated* mechanism.
      *   **The Workaround: Resource Starvation (The "Garbage In" Argument):**
          *   Even if Mentalese exists, it needs input. Newspeak controls *input* (books, history, conversation).
          *   If you never encounter the *concept* of "rebellion" in any form, can Mentalese compose it? (Systematicity limits).
          *   *SE Analogy:* You have a Turing-complete CPU (Mentalese), but if you remove the libraries and APIs (cultural concepts), you can't build the program.
      *   **Doublethink as a Runtime Exploit:**
          *   Doublethink isn't about vocabulary; it's about logic gates.
          *   Fodor assumes rationality/logic is built into Mentalese.
          *   The Party breaks the logic layer. `if (Party says X) then (X is true)` overrides `if (X == !Y) then (False)`.
          *   This attacks the *processor*, not the *language*.
      *   **Duckspeak as Bypassing the CPU:**
          *   Duckspeak is interesting. It's not thought; it's reflex.
