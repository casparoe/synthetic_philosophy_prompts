          2.  *Audience's Side:* Audience knows it's fake but cries anyway.
          3.  *Safety/Control Side:* If an actor feels it *too* much (can't shake it off), it's a failure/risk. Child actors are shielded. Teachers say "play the objective, not the emotion."
      *   **The Question:** What theory of fiction/emotion do these practices presuppose? Is it asymmetric (real for actor, imagined for audience)? Is it contradictory? Is it just marketing fluff? Which parts pin down a theory vs. which are compatible with any view?
      *   **Goal:** Untangle the philosophy/neuroscience knot for a written piece. Needs nuance, clarity, and actionable insights for a writer.

  2.  **Deconstruct the Contradictions:**
