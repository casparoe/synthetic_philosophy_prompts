answer: |-
  This is a brilliant observation, and you have put your finger on a tension that acting theorists, philosophers of art, and neuroscientists have wrestled with for a century. You are not confused; the field is genuinely bifurcated.

  To answer your core question: **No, the profession does not hold a single coherent theory.** However, it does operate on a consistent *functional* logic that contradicts its own *mythology*.

  If you are writing this for a science audience, here is how you can untangle the knot. The practices you observed pin down a specific view of the brain: **Emotion is an output of action, not an input to it.** But the *marketing* of acting relies on the opposite view: **Emotion is a spiritual substance that must be harvested.**

  Here is a breakdown of the three contradictions you found, what they imply about the brain, and where the actual theory lies.

  ### 1. The "Real Feeling" Myth vs. The "Play the Objective" Rule
  **The Observation:** The public praises actors for "really feeling it," but teachers tell students to stop playing the emotion and play the objective.
  **The Neuroscience:** This is the distinction between **top-down generation** and **bottom-up regulation**.
  **The Theory:**
  If you try to consciously generate an emotion (top-down), you engage the prefrontal cortex, which inhibits the limbic system. You end up "indicating" (showing the audience you are sad) rather than being sad.
  However, if you pursue an *objective* (e.g., "make him stay," "hide the letter") under imaginary circumstances, you bypass the conscious emotional command. The body reacts to the *stakes* of the objective.
  **The Verdict:** The profession's *practice* presupposes that emotion is a **byproduct of goal-directed behavior**. The *praise* ("they really felt it") is a layperson's misinterpretation of high-fidelity physiological simulation. When an actor is praised for "really feeling it," what is actually happening is that their autonomic nervous system (ANS) has been successfully hijacked by the fiction. Their heart rate is up, their cortisol is spiking, but their prefrontal cortex is still monitoring the light cues.

  ### 2. The Audience's Safe Tears vs. The Actor's Dangerous Truth
  **The Observation:** The audience cries at fiction safely; the actor is at risk if the fiction becomes "too real."
  **The Neuroscience:** This relies on **contextual framing** (predictive processing).
  **The Theory:**
  Both the actor and the audience experience "affective realism"—their bodies react to the stimulus as if it were real. The audience's tears are chemically real. The difference is the **safety signal**.
  *   **The Audience:** Holds a "double consciousness." Part of the brain processes the grief; a higher-order part processes "I am in a seat, I am safe, this is a story." This top-down context allows them to surrender to the bottom-up emotion without triggering a trauma response.
  *   **The Actor:** Must suppress the "I am in a seat" signal to generate the performance. If they suppress it *too* well, they lose the safety signal. If they lose the safety signal, the stress response becomes unregulated trauma.
  **The Verdict:** This pins down a theory that **the brain does not fully distinguish between real and simulated threat/emotion at the physiological level.** If it did, shielding child actors would be unnecessary. The fact that they *are* shielded proves the industry acknowledges that "fake" scenarios produce "real" neurochemical consequences.

  ### 3. The "Method" Legend vs. Professional Intervention
  **The Observation:** We mythologize the actor who stays in character for months, but treat the actor who can't shake the emotion as a liability.
  **The Neuroscience:** This is about **neuroplasticity and state dependency**.
  **The Theory:**
  Acting requires entering a specific neural state on command. The "Method" legend suggests you must live in that state to access it. The professional reality is that you must be able to *exit* that state to remain employable and sane.
  When an actor "actually falls in love" or "can't shake the grief," they have failed at **compartmentalization**. They have allowed the simulation to rewrite their baseline predictive models of the world.
  **The Verdict:** The profession presupposes that **fiction is a tool for temporary neural remodeling.** It is acceptable to remodel the brain for 3 hours a night. It is unacceptable to let the remodeling become permanent. The "failure" isn't that the emotion was real; it's that the boundary between the *simulation loop* and the *baseline self* dissolved.

  ### So, what is the Implicit Theory of Fiction?

  You asked if the theory is: *The actor supplies real emotion, the audience only imagines feeling it.*
  **That is incorrect.** A better summary of the implicit theory found in the *practices* (ignoring the marketing) is this:

  > **Fiction works by hacking the mirror system.**
  >
  > 1.  **For the Actor:** The goal is to generate a high-fidelity **physiological signal** without the **cognitive belief**. (I must cry, but I must know I am acting.)
  > 2.  **For the Audience:** The goal is to receive that signal and generate a **physiological response** protected by a **cognitive safety frame**. (I cry, knowing I am safe.)
  > 3.  **The Risk:** The physiological signal is potent enough to bypass the cognitive frame in both parties.

  ### Which parts pin down a theory vs. which are flexible?

  **1. The "Shield the Child" Instinct (Hard Constraint)**
  This is your strongest evidence. This practice contradicts the idea that "it's just make-believe." It pins down the theory that **the brain processes simulated social threats similarly to real ones.** You cannot write a piece that claims acting is purely intellectual; the protection of minors proves the industry believes in the biological leakage of fiction.

  **2. "Play the Objective, Not the Emotion" (Hard Constraint)**
  This pins down the theory that **emotion is downstream of action.** It contradicts the "feeling it" mythology. If emotion were a spiritual substance you had to summon, teachers would tell you to "remember your sadness." They don't. They tell you to "fight for the door." This aligns with modern neuroscience (e.g., Lisa Feldman Barrett's constructionist theory) that emotion is constructed from interoception and action, not triggered like a reflex.

  **3. The "They Really Felt It" Praise (Flexible/Marketing)**
  This is the part you can treat as culturally underdetermined. This is largely **folk psychology**. It is a heuristic the audience uses to measure quality, not a technical description of what occurred. You can safely argue that this is a myth that persists despite the technical reality. It serves a social function (romanticizing the labor) rather than a descriptive one.

  ### A Hook for Your Piece

  If I were editing this piece, I would suggest framing the actor not as someone who *feels*, but as someone who **regulates**.

  The audience's job is to *surrender* regulation (let the fiction move them).
  The actor's job is to *maintain* regulation (let the fiction move them, but stop when the light changes).

  The tragedy—and the source of your confusion—is that the tools required to surrender regulation (vulnerability, memory, openness) are the same tools that make regulation difficult. The profession demands the actor drive a car at 100mph while pretending the brakes don't work, all while secretly keeping their foot hovering over the pedal.

  When the foot slips off the pedal (the actor "really feels it" too much), it's not a triumph; it's a crash. But the audience, seeing the skid marks, calls it art.

  ### Summary for your notes:
  *   **Is the theory stable?** No, the *mythology* is unstable, but the *pedagogy* is consistent.
  *   **Does the actor feel real emotion?** Physiologically, often yes. Cognitively, they must not.
  *   **Does the audience feel real emotion?** Physiologically, yes. Cognitively, they are framed by safety.
  *   **The Contradiction:** The industry treats the physiological reality of emotion as a resource to be mined (for the performance) and a hazard to be managed (for the health).
  *   **The Child Actor Clue:** This is the smoking gun that proves the industry knows the "fiction" is biologically real, regardless of what they tell the press.

  This gives you a solid platform: The brain doesn't care if the story is true; it cares if the stakes are high. The actor's skill is raising the stakes without burning down the house.
