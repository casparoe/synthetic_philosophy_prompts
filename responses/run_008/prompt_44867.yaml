  4.  **Synthesizing the "Implicit Theory":**
      *   The user asks if the theory is: *Actor feels real, Audience imagines feeling.*
      *   *Critique:* That's too simple. The audience *does* feel real cortisol/tears. The actor *doesn't* always feel real grief (they simulate the physiology).
      *   *Better Theory:* **Controlled Contagion.** The actor generates a *signal* that mimics the physiological markers of emotion sufficiently to trigger a mirroring response in the audience, while maintaining enough cognitive distance to remain safe and repeatable.
      *   *The "Shield the Child" clue:* This proves the profession *knows* the brain doesn't fully distinguish between real and simulated threat/emotion at a physiological level. If it were just "imagination," kids wouldn't need shielding.
      *   *The "Play the Objective" clue:* This proves emotion is seen as an *output*, not an *input*. You can't command the limbic system directly; you command the action, and the limbic system follows.

  5.  **Drafting the Response Structure:**
      *   **Validation:** Acknowledge the sharpness of the observation. It's a genuine paradox, not just confusion.
