      *   **Addressing the Three Tensions:**
          1.  *The "Real Feeling" Myth vs. Technique:* It's not about feeling grief; it's about accessing the *energy* of grief without the cognitive burden of the cause.
          2.  *Audience vs. Actor:* The audience's "fiction contract" allows top-down regulation. The actor's "in-the-moment" demand suppresses top-down regulation.
          3.  *The Child Actor/Intervention Clue:* This is the smoking gun. It proves the profession acknowledges the biological reality of the stress response.
      *   **The Implicit Theory:** Propose a specific model. "Asymmetric Coupling."
