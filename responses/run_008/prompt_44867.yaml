          *   Myth: Great acting = real feeling.
          *   Practice: Great acting = controlled simulation (playing the objective).
          *   Risk: Uncontrolled real feeling = unprofessional/dangerous.
      *   *Contradiction 2: Actor vs. Audience.*
          *   Actor: Needs to generate signal (emotion).
          *   Audience: Needs to receive signal (emotion) despite knowing source is fake.
      *   *Contradiction 3: Protection.*
          *   Adults: Expected to handle "fake" pain that feels real.
          *   Children: Shielded because "fake" pain might hurt them for real.

  3.  **Brainstorming Theoretical Frameworks:**
      *   *Stanislavski vs. Strassberg vs. Brecht:*
          *   Stanislavski: Emotional memory, truth.
          *   Brecht: Alienation effect, don't feel, show.
          *   Meisner: Living truthfully under imaginary circumstances.
      *   *Neuroscience/Psychology:*
          *   Mirror neurons (simulation theory).
          *   Predictive processing (brain predicting outcomes).
          *   Decoupling (knowing it's fake but reacting).
          *   Regulation (top-down control).
      *   *Philosophy of Art:*
          *   Coleridge: Willing suspension of disbelief.
          *   Walton: Make-believe.
