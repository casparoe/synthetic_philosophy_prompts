      *   **Task:** Evaluate the verdicts, propose a unifying principle (or identify which verdicts must be sacrificed), and apply the principle to a new case (merging communities).
      *   **Tone:** Intellectual, rigorous, but accessible (philosophy of math/language intersection). Needs to respect the user's mathematical background while addressing the philosophical nuances.

  2.  **Deconstruct the User's Verdicts:**
