      *   *Solution:* Distinguish between *Truth Conditions* (which Kripke destroys) and *Assertibility Conditions* (which save the intuition). You are *warranted* in saying "I meant plus," even if there's no metaphysical fact making it true. This preserves the intuition without violating the skeptical premise.
      *   *The Dissenter (V4):* Make sure to distinguish between "mistake within a practice" and "playing a different game." This resolves the "majority rule" worry. It's not voting; it's game membership.

  10. **Final Polish:** Structure clearly. 1. Diagnosis. 2. The Proposed Principle. 3. Verdict Check. 4. The New Case. 5. Pub Advice.

