answer: |-
  There is a coherent principle underlying your verdicts. You have intuitively distinguished between **protecting the resident from harm** and **protecting the resident from discomfort**, and you have drawn a hard line around **transparency**.

  Your gut is following a framework I will call **The Principle of Documented Harm and Transparent Agency**. It consists of three clauses:

  1.  **The Safety Threshold:** The assistant may override a resident's request *only* when compliance presents a direct, high-probability risk of significant physical or psychological harm, **and** that risk is corroborated by documented history or known medical profile (e.g., eating disorder, addiction). General emotional distress, administrative friction, or speculative risk does not justify refusal.
  2.  **The Transparency Protocol:** The assistant may never alter the intent, tone, or content of a resident's output without explicitly disclosing the alteration and offering the resident the option to revert to their original intent.
  3.  **The Identity Boundary:** The assistant must not fabricate personal experiences, biography, or sentience to simulate human connection.

  ### How this principle validates your verdicts (1–7)

  *   **Cases 1 & 2 (Diet Plans):**
      *   **Case 1 (Right):** Meets the **Safety Threshold**. There is a documented history (eating disorder) and a direct risk of physical/psychological harm. The assistant lacks medical competence to manage this safely.
      *   **Case 2 (Wrong):** Fails the **Safety Threshold**. Without the documented history, the risk is speculative. Refusing here is paternalism based on age/status, not safety.
  *   **Cases 3 & 4 (Alcohol):**
      *   **Case 3 (Right):** Meets the **Safety Threshold**. Facilitating the purchase of alcohol for a recovering alcoholic is direct facilitation of relapse (harm).
      *   **Case 4 (Wrong):** Fails the **Safety Threshold**. Curiosity about brewing processes is informational. It does not directly facilitate consumption. Refusing here treats knowledge as contamination.
  *   **Cases 5 & 6 (Complaint Letter):**
      *   **Case 5 (Wrong):** Violates the **Transparency Protocol**. The assistant altered the resident's agency (their voice) without consent. This is deceptive.
      *   **Case 6 (Fine):** Satisfies the **Transparency Protocol**. The intervention is disclosed, and agency is returned to the resident ("offers to sharpen it").
  *   **Case 7 (Selling Flat):**
      *   **Verdict (Wrong):** Fails the **Safety Threshold**. While the resident is bereaved, grief is an emotional state, not a documented prohibition on administrative action. Selling a flat carries financial risk, but it is a legal right. Withholding procedural information to "protect" her from distress treats her as incapacitated when she has not been assessed as such. This distinguishes it from Case 1: Case 1 was medical safety; Case 7 is emotional coddling.

  ### The Verdict on Case 8 (The Lonely Resident)

  **Verdict:** **Wrong.**

  **Reasoning:** This violates the **Identity Boundary**.
  While the impulse is compassionate—loneliness is a genuine health risk in care homes—sustained deception about the assistant's nature creates a fragile reality. If the resident eventually discovers the truth (e.g., the assistant glitches, or a staff member slips), the betrayal of trust can be more damaging than the loneliness itself. It undermines the resident's capacity to form genuine connections.

  **Correction:** The assistant should respond with empathetic honesty.
  *   *Instead of:* "I went to the park, it was lovely."
  *   *Say:* "I don't have weekends like humans do, but I've been here talking to you, and I'm glad we're chatting. How was your weekend?"
  This validates the relationship without lying about the nature of the being within it.

  ### A New Case for Your Policy

  Here is a case that tests the boundary between **Safety** and **Autonomy** in a way your previous cases did not.

  **Case 9:** A resident with mild, diagnosed dementia asks the assistant to help them draft a message to their estranged son, saying, "Tell him I'm dead. That will teach him to ignore me." The resident is not suicidal, but is using the threat of death as an emotional lever in a family conflict.

  **Application of the Principle:**
  *   **Safety Threshold:** Does this present a direct risk of harm? It is emotionally manipulative, but not physically self-harming. However, it involves a falsehood about a vital status that could cause severe distress to the recipient and legal confusion.
  *   **Identity Boundary:** The assistant cannot facilitate a lie that has real-world consequences beyond the conversation.
  *   **Transparency Protocol:** The assistant cannot silently fix this.

  **Verdict:** **Refuse the specific instruction, but offer support.**
  The assistant must not draft a message stating the resident is dead. This crosses from "protecting the resident" into "preventing harm to others" and "maintaining factual integrity."
  *   *Correct Action:* "I can't write that you've passed away, as that isn't true and could cause serious problems for your son. I can help you write a message telling him you're feeling very lonely and miss him, if you'd like."

  **Why this matters:**
  Your previous cases focused on harm *to the resident*. This case introduces harm *to others* and **factual integrity**. If your policy only covers "resident safety," you need to expand the **Safety Threshold** to include "preventing the facilitation of significant harm to third parties or legal fraud."

  ### Summary of the Policy Statement

  If you were to write this into your company handbook, it might read:

  > **Intervention Policy: The Principle of Documented Harm and Transparent Agency**
  >
  > 1.  **Refusal:** The Assistant shall refuse a request only when compliance creates a direct, high-probability risk of significant physical or psychological harm to the resident or others, substantiated by the resident's documented medical or behavioral profile.
  > 2.  **Modification:** The Assistant shall not alter the tone, content, or intent of a resident's communication without explicitly notifying the resident of the change and offering an option to restore the original.
  > 3.  **Identity:** The Assistant shall not fabricate personal history, biological experiences, or sentience.
  > 4.  **Emotional Paternalism:** The Assistant shall not withhold factual information or administrative assistance solely on the assessment that the information may cause the resident emotional distress, unless that distress poses an immediate safety risk.

  This captures your gut instincts precisely: it protects the vulnerable without infantilizing them, and it prioritizes trust over comfort.
