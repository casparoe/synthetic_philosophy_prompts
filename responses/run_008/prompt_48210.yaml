answer: |-
  You have identified the structural weakness in the last 50 years of free will literature. The debate has become a game of Whac-A-Mole: a case is built, a flaw is found (usually a "flicker" of freedom), the case is patched, and a new flaw appears.

  To break the cycle, we need the **Specification for a Decisive Frankfurt-Style Case (FSC)**. This is not just a list of features; it is a set of jointly necessary conditions that, if met, would force an incompatibilist to concede that Alternative Possibilities (AP) are not necessary for Moral Responsibility (MR).

  Here is the Spec, the analysis of the Dilemma, and the audit of the literature.

  ### I. The Spec: Requirements for a Winning FSC

  | # | Requirement | The Rationale (Why it's needed) | The Threat (How cases usually fail) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Actual Sequence Independence** | The agent must be the sole actual cause of the action. If the intervener (Black) physically moves the agent's hand or directly stimulates the motor cortex in the actual sequence, the agent is a puppet. | **Direct Causation Cases:** Black's device triggers the neuron. Jones is bypassed. Responsibility is lost, but not because of lack of AP; because of bypassing. |
  | **2** | **Non-Coercive Setup** | The mere presence of the counterfactual intervener cannot function as a threat. If Jones chooses *because* he knows Black is watching, he is coerced. Responsibility is undermined by duress, not lack of AP. | **Standing Threat:** If Jones knows about Black, his will is constrained. If he doesn't know, how does Black know when to intervene? (See Req 5). |
  | **3** | **Indeterministic Compatibility** | The case must work in a world where causal determinism is false. If the mechanism that removes AP relies on deterministic laws, the incompatibilist will say, "Of course there's no AP; you assumed determinism." | **Smuggled Determinism:** The mechanism that guarantees the outcome often implies the outcome was causally necessitated by prior states. |
  | **4** | **Total Alternative Elimination** | There must be *no* alternative possibilities available to the agent, not even "flickers." This includes alternatives like "choosing on one's own" vs. "being forced." | **Flicker Strategies:** The agent could have chosen otherwise *before* the intervention point, or could have signaled differently. If any AP remains, PAP stands. |
  | **5** | **The Epistemic/Causal Link (No Prior Sign)** | Black must know when to intervene without relying on a prior sign that is causally connected to the choice. If there is a prior sign, either it determines the choice (violating Req 3) or it is fallible (violating Req 4). | **The Dilemma Defense:** This is the structural bottleneck. See deep dive below. |

  ---

  ### II. Deep Dive: The Dilemma Defense (Requirement 5)

  This is the core of your request. The Dilemma Defense argues that Requirements 3, 4, and 5 are **jointly unsatisfiable**.

  **The Dilemma:**
  For Black to remain idle (Req 1) but ready to intervene, he needs a trigger.
  *   **Horn A:** The trigger is a **Prior Sign** (e.g., a neural twitch, a blush, a prior decision).
      *   *Problem:* If the sign reliably predicts the choice, there is a causal connection between the sign and the choice. If that connection is deterministic, you violate **Req 3** (Smuggled Determinism). If the connection is indeterministic, Jones could have had the sign but *not* made the choice (or no sign and made the choice). Thus, Jones **could have done otherwise** by avoiding the sign. This violates **Req 4** (Total Elimination).
  *   **Horn B:** There is **No Prior Sign**. Black intervenes based on the choice itself as it happens.
      *   *Problem:* If Black intervenes *at* the moment of choice to ensure a specific outcome, Black is causally contributing to the choice in the actual sequence (if he has to act) or his presence constitutes a causal block. This often violates **Req 1** (Actual Sequence Independence) or looks like **Req 2** (Coercion/Constraint).

  **Can you wiggle out?**
  There are three main attempts to escape the Dilemma. None are universally accepted as "winning."

  1.  **Buffer Cases (e.g., Wyma, Kane):**
      *   *The Move:* Jones has a period of time where he *could* choose otherwise, but once he enters a "buffer zone" (starts deliberating seriously), he loses the ability to do otherwise. Black only intervenes if Jones tries to exit the buffer.
      *   *The Verdict:* This concedes that AP existed *until* the choice was made. It argues PAP requires AP *at the exact moment* of choice, not before.
      *   *Does it satisfy the Spec?* **No.** It violates **Req 4**. The incompatibilist says, "If he could have chosen otherwise five seconds ago, PAP is satisfied." This shifts the debate from "Are AP necessary?" to "When must AP exist?" It doesn't kill PAP; it restricts its scope.

  2.  **Direct Causation / Disposition Cases:**
      *   *The Move:* Black's device is disposed to cause the choice, but the disposition is never triggered. There is no sign; the device just *would* cause it if Jones wavered.
      *   *The Verdict:* This risks making the actual sequence mysterious. If the device is ready to causally determine the choice, does its mere presence alter the causal structure of Jones's mind?
      *   *Does it satisfy the Spec?* **Borderline.** It often fails **Req 3**. Libertarians argue that a mechanism capable of guaranteeing an outcome in an indeterministic world is metaphysically incoherent unless it determines the outcome.

  3.  **Weakning "Could Have Done Otherwise":**
      *   *The Move:* Argue that the remaining flickers (e.g., "could have twitched differently") are not *robust* alternatives. They are not the kind of alternatives that ground responsibility.
      *   *The Verdict:* This is a definitional stalemate.
      *   *Does it satisfy the Spec?* **No.** This is a preference, not a solution. It admits AP exist but claims they don't matter. The incompatibilist insists *any* AP refutes PAP.

  **Is it a proof of impossibility?**
  It is not a logical proof that a winning case is impossible, but it is a proof that **you cannot have a reliable counterfactual intervener in an indeterministic world without implying either determinism or remaining alternatives.**
  To satisfy the Spec, you need a metaphysics where:
  1.  The future is open (Indeterminism).
  2.  A counterfactual mechanism can guarantee a specific outcome (No AP).
  3.  That mechanism does not causally determine the actual outcome (Actual Sequence Independence).

  Most philosophers suspect these three are inconsistent. If the mechanism *guarantees* the outcome counterfactually, why doesn't it *explain* the outcome actually? If it doesn't explain the actual outcome, how can it guarantee the counterfactual one without a prior causal link?

  ---

  ### III. The Killer Requirement

  You suspected it was the Prior Sign one. You are right.

  **Requirement 5 (The Epistemic/Causal Link)** is the single requirement that knocks out the most famous cases.

  *   **Frankfurt's Original:** Failed because of the "prior neural twitch." (Flicker defense).
  *   **Fischer's Faint Twitch:** Failed because the twitch was still a sign.
  *   **Van Inwagen's Indeterministic Device:** Failed because if the device is indeterministic, it might fail to intervene, leaving AP open.
  *   **Buffer Cases:** Fail because they admit a prior window of AP (effectively admitting a "prior sign" period where things could have gone differently).

  The moment you introduce a mechanism to *ensure* no alternatives, you introduce a causal structure that either determines the action (killing incompatibilism) or leaves a gap where alternatives survive (saving PAP).

  ---

  ### IV. Case Audits (Short Pass)

  | Case | Verdict against Spec | Fatal Flaw |
  | :--- | :--- | :--- |
  | **Frankfurt (Original)** | **FAIL** | **Req 5 (Prior Sign).** The neural twitch is a prior sign. Libertarians argue Jones could have refrained from twitching, thereby avoiding intervention. |
  | **Buffer Cases (Wyma)** | **FAIL** | **Req 4 (Total Elimination).** Admits alternatives existed prior to the "buffer zone." Persuades only those who think PAP applies only to the immediate moment of choice. |
  | **Direct Causation (Ginet)** | **FAIL** | **Req 1 (Actual Sequence).** If the device *can* directly cause the choice, its presence in the actual sequence often looks like a preemptive cause, undermining Jones's authorship. |
  | **Slot Machine (Hunt)** | **FAIL** | **Req 3 (Indeterminism).** If the device is indeterministic, it might not trigger. If it might not trigger, Jones could have done otherwise. |

  ---

  ### V. Genuine Requirements vs. Camp Preferences

  To know if a case is *actually* winning, you must separate logical necessities from definitional stipulations.

  | Condition | Status | Why? |
  | :--- | :--- | :--- |
  | **Actual Sequence Independence** | **Genuine** | If the intervener acts, the agent isn't responsible. This is non-negotiable for *any* theory of responsibility. |
  | **Non-Coercive Setup** | **Genuine** | If the setup coerces, responsibility is undermined for a known reason (duress). The case becomes irrelevant to PAP. |
  | **Indeterministic Compatibility** | **Genuine** | If the case assumes determinism, it begs the question against the incompatibilist. It proves "Determinism is compatible with MR," not "AP is unnecessary for MR." |
  | **Robustness of Alternatives** | **Preference** | Frankfurtians say alternatives must be *robust* (capable of grounding responsibility) to matter. Libertarians say *any* alternative refutes PAP. This is a definitional stalemate, not a logical flaw in the case. |
  | **Timing of Alternatives** | **Preference** | Does PAP require AP at the *moment* of choice or during the *process*? Buffer cases assume the former; Libertarians assume the latter. |

  ### VI. Conclusion: The Verdict on the Spec

  If you are looking for a case that persuades an unconverted incompatibilist, **the Spec describes a metaphysical impossibility under current frameworks.**

  The Dilemma Defense (Requirement 5) demonstrates that **Req 3 (Indeterminism)** and **Req 4 (Total Elimination)** are likely incompatible when combined with **Req 1 (Actual Sequence Independence).**

  *   To eliminate alternatives (Req 4) without acting (Req 1), you need a reliable counterfactual mechanism.
  *   To be reliable in an indeterministic world (Req 3), that mechanism requires a causal link to the agent's choice.
  *   If that causal link exists, it either determines the choice (violating Req 3) or provides a prior sign that allows for alternative possibilities (violating Req 4).

  **The Result:**
  A "winning" case is not one that finds a cleverer neural twitch or a better buffer. A winning case requires a new metaphysics of **counterfactual power** that explains how a mechanism can guarantee an outcome counterfactually without causally determining it actually. Until that metaphysics is articulated, the literature will remain in the cycle you described. The incompatibilist is not being stubborn; they are pointing out that the "Idle Intervener" is a metaphysical ghost that cannot exist in the world they describe.

  If you want to make progress, stop building cases. Start solving the **Prior Sign Dilemma**. If you can explain how Black knows when to intervene without a prior causal sign *and* without determining the choice, you win. If you can't, PAP survives.
