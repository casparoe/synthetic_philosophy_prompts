    - `"comment"`: one to three sentences justifying the verdict and, where the verdict is not `"correct"`, stating the right claim and what the error costs the argument.
  - `"missed_points"`: an array of brief strings naming important things the question called for that the answer omits or glosses over (e.g., distinctions a complete answer would have drawn).
  - `"strengths"`: an array of brief strings naming what the answer genuinely does well, so the feedback is not one-sided.
