answer: |-
  This is one of the oldest and messiest problems in philosophy (political philosophy and ethics), and your gut reactions are actually incredibly sophisticated. You are stumbling onto a distinction that professional philosophers spend careers arguing about: the difference between **Moral Desert** (what you deserve based on character/effort) and **Entitlement** (what you deserve based on rules/outcomes).

  Here is the breakdown of your intuitions, the principle that ties them together, where the tension lies, and how to handle your friend.

  ### 1. The Unifying Principle: The "Agency Test"
  Your intuitions are not inconsistent; they are actually pointing toward a specific principle. Let's call it the **Agency Principle**.

  **The Principle:** *You only truly "deserve" something if it is the result of choices within your control (effort, rigor, intent), not the result of luck (talent, inheritance, rules that favor ease, timing).*

  Here is how your cases map onto this:

  *   **Valedictorian (Easy A's vs. Hard B's):** You favor the Hard B's. Why? Because course rigor is a **choice**. Protecting a GPA is a strategic calculation. Your friend sacrificed outcome for growth. Under the Agency Principle, your friend exerted more moral agency.
  *   **Soccer (Worker vs. Talent):** You feel a split. This is because you are sensing two different types of "desert."
      *   *Moral Credit:* The worker deserves the praise (Agency/Effort).
      *   *Outcome/Utility:* The talented kid deserves the win (Result).
      *   *Your intuition:* You want the scholarship (a reward) to go to the worker. This fits the Agency Principle. You feel the talented kid "deserves the wins" only in the sense that it is a natural consequence of their physics, not a moral reward.
  *   **Legacy Admission:** You are conflicted because this is a **mixed case**. He worked hard (Agency), but the door was opened by luck/bloodline (No Agency). Your confusion is rational; the Agency Principle struggles when luck and effort are tangled.
  *   **The Wallet:** You are conflicted here too, and for the same reason.
      *   *Argument for No:* He lacked **intent**. He didn't choose to be honest; he was ignorant. (Fails Agency).
      *   *Argument for Yes:* He performed the **action**. (Matches Outcome).
      *   *Your gut:* You suspect he doesn't *morally* deserve it, but rewarding him is good for society.
  *   **Inheritance vs. Luck:** This is your strongest case for the Agency Principle. The inheritor didn't deserve the *start* (luck), but earned the *retention* through management (Agency). The "lucky" self-made person got rich via timing (luck). You value the **stewardship** (work) over the **origin** (luck).

  **Verdict:** You are **85% consistent**. You consistently value Effort/Choice over Outcome/Luck. The 15% inconsistency is in the Soccer and Wallet cases, where you aren't sure if you are judging the *person* or the *result*.

  ### 2. The New Case: The Harsh Curve
  *Scenario: A teacher curves a class so harshly that some kids pass only because everyone else failed.*

  **Applying the Agency Principle:**
  Under your principle, this is **undeserved**.
  If passing is determined by *relative performance* (how you did compared to others) rather than *absolute mastery* (what you actually learned), then your grade depends on **luck** (who else is in the class).
  *   If you are in a class of geniuses, you fail.
  *   If you are in a class of slackers, you pass.
  *   Since the classmates you are assigned is not within your **control**, the result is not deserved.

  This aligns perfectly with your Valedictorian take. You hated that the winner "gamed the system" (easy classes). A curve is another way of gaming the system (relying on others' failure).

  ### 3. Your Friend's Claim: "Meritocracy means you deserve whatever you win."
  Your friend is making a logical error called **reifying the system**. They are confusing *Is* with *Ought*.

  *   **Friend's Definition:** "Meritocracy is a system where the winners are defined as the meritorious." (This is circular).
  *   **Reality:** Meritocracy is a claim that rewards *track* virtue/talent.
  *   **The Rebuttal:** If a system rewards the kid who took easy classes over the kid who took hard ones, the system has **failed** meritocracy; it hasn't defined it.

  **How to articulate why they are wrong:**
  Tell your friend: *"If I win the lottery, I 'win' money. Do I 'deserve' it based on merit? No. Just because a system gives you something doesn't mean you morally deserved it. Meritocracy is supposed to be about matching rewards to effort/talent. If the match is broken, the winner didn't deserve it, the system is just broken."*

  ### 4. Which Gut Call Do You Have to Give Up?
  You don't have to throw out a case, but you do have to refine a distinction. You need to separate **Moral Desert** from **Incentive**.

  *   **The Wallet Case:** You feel conflicted because you are mixing these up.
      *   *Does he deserve it?* **No.** (He lacked intent/agency).
      *   *Should he get it?* **Yes.** (We want to incentivize returning wallets, even if done accidentally).
      *   *The Fix:* Admit that sometimes we give people things they don't *deserve* because it creates a better society. That doesn't mean they deserved it; it means we are being pragmatic.

  *   **The Soccer Case:** You need to decide what the scholarship *is*.
      *   If it's a **Prize** (for past effort): Give it to the Hard Worker.
      *   If it's an **Investment** (for future wins): Give it to the Talent.
      *   *The Fix:* Most scholarships are marketed as "Rewards for Character/Effort." If so, your gut (give it to the worker) is right. If they are "Athletic Grants," then the talent is the product being bought.

  ### Summary for Your Debate
  1.  **Your Principle:** Desert requires **Control**. You deserve what you earn through choice and effort, not what you get through luck, talent, or rule-loopholes.
  2.  **The Valedictorian:** The system rewarded *compliance*, not *merit*. Your friend was right.
  3.  **The Friend:** They are defining "merit" as "whatever the rules say." You are defining "merit" as "actual effort/value." You are arguing about whether the rules are just, not what the rules say.
  4.  **The Curve:** It violates your principle because it makes success dependent on other people's failures (luck), not your own mastery (agency).

  You aren't being inconsistent; you're just noticing that the world rarely gives people what they actually deserve. That's not a flaw in your logic; it's a flaw in the world.
