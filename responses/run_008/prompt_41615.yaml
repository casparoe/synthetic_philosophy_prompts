answer: |-
  The tension you identify is the central fault line in legal metaphysics. Anglo-American law does not operate on a single, consistent theory of causation. Instead, it employs a **Normative Contrastive Theory** of causation, often disguised as a physical or counterfactual one.

  Here is the reconstruction of the implicit theory, an analysis of where it is required versus underdetermined, and the doctrinal consequences of adopting a flat counterfactual view.

  ### 1. The Implicit Theory: Normative Contrastivism

  The pattern you describe presupposes that **causal contribution matters only against a background duty.**

  The law does not strictly hold that omissions are "not causes" in a metaphysical sense, nor that they are "inferior causes." Rather, it treats causation as a selection process from a field of necessary conditions. In this view (championed legally by H.L.A. Hart and A.M. Honoré in *Causation in the Law*), a "cause" is not merely a *sine qua non* (but-for condition); it is an **intervention** that disturbs the normal course of events.

  *   **The Baseline:** The "normal course of events" is defined normatively, not physically.
  *   **Commissions:** When an actor injects poison, they introduce a new, abnormal force. This is causally salient regardless of duty.
  *   **Omissions:** When an actor fails to act, they merely allow the normal course of events to proceed. For this to count as a "cause" in the legal sense, the actor must have been normatively required to alter that course.

  Therefore, the "suspicious coincidence" you noticed is not a bug; it is the feature. **Duty converts a background condition into a legal cause.** Without a duty, the bystander's inaction is part of the "background circumstances" (like the gravity that pulled the child down or the water that filled the lungs). With a duty (e.g., a parent or lifeguard), the inaction becomes a "deviation" and is thus selected as the cause.

  This is a **Norm-Sensitive Contrastive View**. Causation is relative to a chosen alternative:
  *   *No Duty:* The contrast is between "Bystander stands still" and "Bystander stands still." (No difference, no cause).
  *   *Duty:* The contrast is between "Lifeguard stands still" and "Lifeguard swims." (Difference exists, cause established).

  ### 2. Strict Requirements vs. Underdetermined Areas

  Not all parts of the legal practice require this normative theory with equal force.

  **Strictly Requires Norm-Sensitive Causation:**
  *   **Criminal Homicide (Act vs. Omission):** The distinction between withdrawing life support and administering lethal injection *strictly requires* this view. If the law adopted a physicalist or flat counterfactual view, the doctor in both cases satisfies the but-for test for death. The only way to exonerate the withdrawing doctor while convicting the injecting one is to define the "cause" relative to a normative baseline (the patient's underlying condition vs. a new toxin).
  *   **No General Duty to Rescue:** This rule collapses without normative causation. If omissions were physical causes, the bystander is physically necessary for the death (had they acted, death would not have occurred). To avoid liability, the law must say the bystander's inaction was not a *legal* cause. This is a circular but functional definition: it is not a cause because there was no duty; there is no duty because it is not a cause.

  **Underdetermined (Compatible with Other Views):**
  *   **Negligence (Torts):** In standard negligence (e.g., failure to repair a stair), the law *could* adopt a flat counterfactual view for "actual cause" and handle the bystander problem via "proximate cause" or "duty."
      *   *Current Practice:* Duty gates Causation. (No duty = no legal cause).
      *   *Alternative:* Causation is flat; Duty gates Liability. (You caused the harm by not fixing it, but you had no duty to fix it, so no liability).
      *   The law prefers the current practice because it avoids telling a jury, "You caused this death, but we won't punish you." It preserves the moral clarity that the defendant *did nothing wrong* rather than *did wrong but is excused*.
  *   **Products Liability:** Failure to warn is treated as a cause of injury. This is compatible with a flat counterfactual view because the manufacturer is already in a special relationship (duty exists). The causal theory doesn't do the heavy lifting here; the status of the manufacturer does.

  ### 3. Consequences of Adopting the Flat Counterfactual View

  If the law openly adopted the view that **every bystander's inaction is among the causes of the harm** (the plain counterfactual view), doctrine would have to shift the locus of control from *Actual Causation* to *Duty* and *Proximate Cause*.

  **A. Criminal Law Transformation**
  *   **The Act Requirement (*Actus Reus*):** The requirement for a voluntary "act" would likely be abolished or redefined. Every death would have multiple causal contributors: the shooter, the gravity, the victim's heartbeat, and every bystander who did not intervene.
  *   **Liability Expansion:** To prevent mass criminalization, the state would need to codify specific **statutory duties to rescue** (like the European *Good Samaritan* laws).
  *   **The Shift:** Currently, we say the bystander is *not guilty* because they did not *cause* the death. Under the flat view, we would say they *did cause* the death but are *not guilty* because they had no *duty*.
  *   **Moral Rhetoric:** This changes the moral narrative. Currently, the bystander is innocent of the harm. Under the flat view, the bystander is a causal agent of the harm but legally privileged. This weakens the "hands-off" liberty interest, framing non-rescue as a causal contribution that the law merely chooses not to penalize, rather than a non-event.

  **B. Tort Law Transformation**
  *   **Explosion of Defendants:** In any accident, every person who *could* have prevented it becomes a factual cause. A lawsuit for a drowning would name the swimmer, the bar owner who sold alcohol, and the ten people on the beach.
  *   **Proximate Cause as the Filter:** The "Duty" analysis would merge entirely into "Proximate Cause." Courts would stop asking "Did the defendant breach a duty?" as a threshold for causation and start asking "Is it fair to trace liability to this causal factor?"
  *   **Indeterminate Liability:** The "but-for" test would become useless for screening defendants. The screening would happen entirely at the damages or policy stage. This would make litigation more expensive and fact-intensive, as every spectator is technically a party to the causation chain.

  **C. The "Causation is Moral Classification" Revelation**
  Adopting the flat view would force the law to admit what it currently obscures: **Causation in law is imputation, not physics.**
  *   Currently, the law maintains the fiction that it is discovering physical causes, using "duty" to filter out the ones it doesn't like.
  *   If it adopted the flat view, it would acknowledge that "cause" is a bucket for all necessary conditions, and "responsibility" is the separate filter.
  *   **Doctrinal Cost:** This would undermine the retributive justification of criminal law. Retribution relies on the idea that the killer *made* the death happen. If the law admits the bystander also *made* the death happen (causally) but is just exempted by policy, the killer can argue, "Why am I being punished for a causal contribution when others who contributed are not?" The distinction between killing and letting die would have to be explicitly justified as a **policy preference**, not a **causal fact**.

  ### Summary

  The Anglo-American pattern presupposes a **Normative Contrastive Theory**: an omission is a cause only if the actor was required to act.
  *   **Strictly Required:** In criminal homicide and the no-duty-to-rescue rule, to maintain the distinction between killing and letting die.
  *   **Underdetermined:** In negligence and torts, where the filtering could theoretically happen at the "proximate cause" stage rather than the "actual cause" stage.
  *   **If Changed:** Adopting a flat counterfactual view would not necessarily change *outcomes* (bystanders would still likely not be liable), but it would shift the doctrinal reasoning. It would move the exculpatory work from **Causation** ("I didn't do it") to **Privilege** ("I did it, but I was allowed to"). This would expose the moral machinery of the law, revealing that "causation" is often just a proxy for "responsibility."
