      *   **Method:** Structured exercise within an invented story world. Participants must *act* (rank, wager, choose) before the distinction is named.
      *   **Core Experience:** Feel why "$a$ is $b$" is informative while "$a$ is $a$" is empty, and where informativeness outruns truth conditions.
      *   **Debrief:** Map exercise moments to Sense/Reference, distinguish narrative surprise from cognitive significance, acknowledge limitations (what the facilitator must supply).
      *   **Troubleshooting:** Predict what goes wrong (e.g., participants reducing it to "plot secrets") and how to handle it without lecturing.

  2.  **Deconstruct Frege's Puzzle for Fiction:**
      *   *The Puzzle:* "Morning Star = Morning Star" is trivial. "Morning Star = Evening Star" is informative, even though both refer to Venus.
      *   *The Fiction Equivalent:* A character knows "The Killer" is in the house. A character knows "My Brother" is in the house. The revelation "The Killer is My Brother" changes everything, even though the *referent* (the person in the house) hasn't changed.
      *   *The Trap:* Avoiding the "Plot Twist" reduction. Frege isn't just about hiding info; it's about *modes of presentation*. In fiction, this translates to *perspective, context, and emotional weight*.

  3.  **Design the Story World:**
      *   Needs to be simple enough to grasp quickly but layered enough to support the puzzle.
      *   *Idea:* A mystery or a family secret works best. Let's go with a contained setting. A lighthouse? A manor? Let's try a **small coastal town** with a specific local legend.
