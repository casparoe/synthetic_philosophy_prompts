answer: |-
  # Workshop Plan: The Identity Market
  **Duration:** 90 Minutes
  **Participants:** 10 Adult Novelists
  **Goal:** Experience Frege's Puzzle (Sense/Reference) as a problem of Narrative Craft.
  **Materials:** Two distinct handouts (File A and File B), "Craft Chips" (poker chips or tokens), whiteboard.

  ---

  ## Part 1: Setup & Immersion (0:00–0:15)

  **The Hook (5 mins):**
  Do not mention Frege, philosophy, or logic. Open with a craft problem.
  > "We talk a lot about 'economy of language.' Today we're going to test the exchange rate of information. Some sentences cost the reader nothing. Others buy them a new world. We're going to run a market to see which sentences hold value."

  **The Story World (10 mins):**
  Divide the room into two groups (5 writers each). Hand out **File A** to Group 1 and **File B** to Group 2. Instruct them *not* to share the contents of their files with the other group.

  *   **File A (The Gardener):** Describes "The Gardener," a gentle older man who maintains the safehouse in Vienna. He knows the layout, he waters the ferns, he makes tea. The protagonist, Sarah, trusts him implicitly. He is described as harmless, part of the scenery.
  *   **File B (The Cleaner):** Describes "The Cleaner," a ruthless operative who disposes of bodies and secures perimeters. He knows the layout, he removes threats, he drinks black coffee. The protagonist, Sarah, fears him implicitly. He is described as dangerous, a weapon.
  *   **The Truth (Facilitator Only):** The Gardener and The Cleaner are the same person (Elias). The files describe the same physical actions through different *modes of presentation*.

  ---

  ## Part 2: The Tension Market (0:15–0:40)

  **The Mechanic:**
  Each writer receives 10 "Craft Chips." You will project sentence pairs on the board. These are potential lines for the novel. Writers must wager chips on which sentence in the pair generates higher **Narrative Voltage** (tension, intrigue, emotional shift) for a reader who *only knows what their specific file knows.*

  **Round 1: The Tautology Test (5 mins)**
  *   *Sentence X:* "The Gardener was the Gardener."
  *   *Sentence Y:* "The Gardener watered the ferns."
  *   **Action:** Everyone bets. (Consensus: Y wins. X is empty.)
  *   **Facilitator Note:** Record the chip count. This establishes the baseline: $a=a$ is useless.

  **Round 2: The Contextual Shift (10 mins)**
  *   *Sentence X:* "Sarah saw The Gardener enter the room."
  *   *Sentence Y:* "Sarah saw The Cleaner enter the room."
  *   **Action:** Group A (Gardener file) bets on X or Y. Group B (Cleaner file) bets on X or Y.
  *   **Expected Outcome:** Group A will bet heavily on Y (intruder alert!). Group B will bet heavily on X (Wait, is he safe?).
  *   **Facilitator Note:** Highlight the split. The *referent* (the man entering) is identical. The *value* of the sentence changes based entirely on the name used.

  **Round 3: The Identity Wager (10 mins)**
  *   *Sentence X:* "The Gardener was the Gardener."
  *   *Sentence Y:* "The Gardener was the Cleaner."
  *   **Action:** Writers bet on which sentence is more informative.
  *   **The Trap:** Before you reveal the files match, Group A thinks Sentence Y is a typo or a contradiction (Category Error). Group B thinks the same.
  *   **The Reveal:** Announce that File A and File B describe the *same man*.
  *   **Re-Bet:** Allow them to move chips now that they know $a=b$.
  *   **Observation:** Sentence Y suddenly becomes the most valuable sentence in the room, even though it refers to the exact same physical reality as Sentence X.

  ---

  ## Part 3: The Belief Trap (0:40–1:00)

  **The Writing Sprint (20 mins):**
  Now that everyone knows The Gardener = The Cleaner = Elias, assign a 10-minute writing task.

  > **Prompt:** Write a 150-word internal monologue for Sarah. She is sitting in the safehouse. Elias is in the kitchen making tea. She is looking at him.
  >
  > **Constraint:** You must write the scene *twice*.
  > 1.  **Version 1:** She thinks of him only as **The Gardener**.
  > 2.  **Version 2:** She thinks of him only as **The Cleaner**.
  >
  > **The Catch:** The physical actions (making tea) must remain identical. Only her *thoughts* about the actions can change.

  **Share & Compare (10 mins):**
  Ask two volunteers to read their Version 1 and Version 2.
  *   *Version 1:* "The steam rose from his cup. He hummed. I felt safe."
  *   *Version 2:* "The steam rose from his cup. He hummed. I wondered if the poison was in the leaves."
  *   **Discussion:** Ask the group: Did the *truth* of the scene change? (No, the man is making tea). Did the *story* change? (Yes, entirely).

  ---

  ## Part 4: Debrief & Mapping (1:00–1:30)

  **1. Mapping the Exercise to Frege (10 mins)**
  Draw a T-Chart on the whiteboard.

  | The Exercise | Frege's Puzzle |
  | :--- | :--- |
  | **The Man (Elias)** | **The Reference (Bedeutung)** |
  | **The Name (Gardener/Cleaner)** | **The Sense (Sinn)** |
  | **"Gardener is Gardener"** | **$a = a$ (Trivial/Analytic)** |
  | **"Gardener is Cleaner"** | **$a = b$ (Informative/Synthetic)** |
  | **Sarah's Belief State** | **Propositional Attitude** |

  Explain: "Frege asked why 'The Morning Star is The Morning Star' is boring, but 'The Morning Star is The Evening Star' changed astronomy, even though both are Venus. You just felt that. When you wagered chips, you weren't betting on the *man*; you were betting on the *name*. In craft terms: **Reference is Plot. Sense is Theme.**"

  **2. Distinguishing Narrative Surprise from Cognitive Significance (10 mins)**
  Address the specific "Fregean" feeling vs. a standard twist.
  *   **Plot Twist:** The reader didn't know $a=b$. Now they do. (This is information *about the world*).
  *   **Fregean Shift:** Even if the reader *knows* $a=b$, the character might not. Or, the sentence "Sarah believes the Gardener is innocent" remains *true* even after we learn "The Gardener is The Cleaner," while "Sarah believes The Cleaner is innocent" is *false*.
  *   **Key Takeaway:** "In your novels, truth isn't just about what *is*. It's about how it is *filed* in the character's mind. You can write a true sentence that a character would reject as false, simply by swapping the name."

  **3. The Limitations (Honesty Check) (5 mins)**
  Be explicit about what the workshop *cannot* do.
  > "Frege was solving a logical problem about truth conditions in language. We are solving a psychological problem about perspective.
  >
  > **What we reproduced:** The feeling that informativeness outruns reference. You felt that 'Gardener is Cleaner' told you more than 'Gardener is Gardener' despite referring to the same object.
  >
  > **What I have to supply:** Frege argued that 'Sense' determines 'Reference.' In logic, if the Sense changes, the truth value of the statement might change. In fiction, we cheat. We rely on the reader's empathy. I need you to understand that in logic, $a=b$ is a hard fact. In fiction, $a=b$ is a *reveal*. You must manage the timing of that reveal to control the 'Sense' your reader is operating under."

  ---

  ## Troubleshooting: What Will Go Wrong

  **Problem 1: The "Plot Secret" Reduction**
  *   **The Reaction:** A participant says, "This is just dramatic irony. It's about withholding information from the reader. Why call it philosophy?"
  *   **Why it happens:** Writers are trained to think in terms of reader management (hiding/revealing), not semantic theory.
  *   **The Fix:** Do not lecture. Return to **Round 2 of the Market**.
      *   *Say:* "If it were just about withholding info, Group A and Group B would have bet the same way in Round 2. But they didn't. Group A feared 'The Cleaner' entering; Group B trusted 'The Gardener' entering. The *physical event* was identical. The *sentence value* flipped based on the file in your hand, not the plot status. This isn't about what the reader knows; it's about what the *sentence carries*."

  **Problem 2: The "Same Person" Confusion**
  *   **The Reaction:** "But they aren't the same person. The Gardener is a role, The Cleaner is a role. Elias is the person."
  *   **Why it happens:** Participants are distinguishing the *job* from the *human*.
  *   **The Fix:** Accept this, then pivot.
      *   *Say:* "Exactly. 'Elias' is the Reference. 'Gardener' and 'Cleaner' are the Senses. Frege's point is that we never access 'Elias' directly. We only access him through the Sense. As writers, you control the Sense. That is your craft."

  **Problem 3: Running Out of Time on Debrief**
  *   **The Risk:** The writing sprint runs long, eating the theory.
  *   **The Fix:** Hard stop the writing at 10 minutes. The value is in the *attempt* to separate Sense from Reference, not a polished scene. If you run short on debrief time, cut the "Limitations" section and focus entirely on the T-Chart mapping.

  **Problem 4: Participants thinking the "Identity Statement" is the climax**
  *   **The Reaction:** "So the lesson is to save 'The Gardener is The Cleaner' for the last page?"
  *   **Why it happens:** Writers look for structural formulas.
  *   **The Fix:** Correct the scope.
      *   *Say:* "No. The lesson is that every time you name a thing, you are choosing a Sense. If you call him 'The Gardener' in Chapter 1 and 'The Cleaner' in Chapter 10, you have changed the world, not just the name. Don't save it for the end. Use it to control proximity. Use 'Gardener' when Sarah is close to him. Use 'Cleaner' when she is afraid."

  ---

  ## Facilitator's Cheat Sheet (The "Why" Behind the Moves)

  1.  **Why the Market?** It forces an intuitive valuation before intellectualizing. They *feel* the value difference before they know *why*.
  2.  **Why Separate Files?** It simulates "Cognitive Files." Frege's puzzle relies on the idea that the mind stores information in distinct compartments. By physically separating the writers, you mimic the mental separation of "Sense."
  3.  **Why the Belief Trap?** This is the closest fiction gets to "Propositional Attitude Reports" (e.g., "Lois Lane believes Superman can fly" is True; "Lois Lane believes Clark Kent can fly" is False). It proves that truth in narrative is subjective to the naming convention.
  4.  **Why Admit Limitations?** If you claim fiction *is* logic, you lose credibility. Acknowledging that fiction deals in *psychological* sense while Frege dealt in *logical* sense respects their intelligence and clarifies the boundary of the exercise.

  ## Closing Statement for the Facilitator
  > "Frege wanted to know how language hooks onto the world. You want to know how language hooks onto the reader. Today you found the overlap: The hook isn't the object. It's the name you choose to hold it by. Go write some $a=b$ moments."
