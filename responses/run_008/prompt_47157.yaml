      *   *Is it verbal?* Partly. "Prediction" means different things. But it's not *merely* verbal because the consequences affect theory choice.
      *   *Is it about Bayesian norms?* Yes, specifically regarding self-locating beliefs (SSA vs. SIA vs. xerographic distributions).
