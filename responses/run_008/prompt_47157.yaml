          1.  Cosmological Measures (how to count in infinity).
          2.  Epistemology of Self-Location (how to reason about "where/who am I").
          3.  Theory Evaluation (what counts as falsification).
      *   The "Cognitive Instability" argument (Carroll) relies on the idea that if a theory predicts you are likely a BB, you can't trust the data used to confirm the theory. This is a *reductio ad absurdum* of the theory *plus* the reasoning framework.
      *   The "Typicality Rejection" (Hartle/Srednicki) argues that xerographic distributions (assumptions about where you are) are separate from physical theories. You can keep the physics and change the self-location assumption.
      *   *The Crux:* The disagreement is about **underdetermination**. The physical theory $T$ does not yield probabilities for observations $O$ without a self-locating assumption $L$. The dispute is whether $L$ is fixed by rationality (Carroll) or is a free parameter (Hartle/Srednicki).

  4.  **Diagnose the Nature of the Disagreement:**
      *   It is **not merely verbal**. If it were, clarifying definitions would solve it. But clarifying definitions reveals a deeper normative clash.
      *   It is **not purely empirical**.
      *   It **is** a meta-epistemological dispute about **Theory Individuation** and **Rational Constraints on Self-Locating Belief**.
      *   *Specific Diagnosis:* The group is stuck because they are trying to solve a normative epistemological problem (how *should* we reason?) using tools from physics (measures), or vice versa. Carroll says rationality *constrains* the measure/assumption. Hartle/Srednicki say the measure/assumption is *independent* of the physics.
