  Here is a thought experiment designed to isolate the structural divergence between Variance Voting and Borda Count under plausible conditions.

  ### (a) The Scenario and Numbers

  **The Scenario:**
  You are a mid-career professional deciding how to allocate a $10,000 bonus. You have three options:
  1.  **HEC (Highly Effective Charity):** Donate to a top-rated global health charity (e.g., malaria nets).
  2.  **LCF (Local Community Fund):** Donate to a local, less efficient but socially cohesive fund.
  3.  **Keep:** Spend the money on yourself (e.g., pay off student loans, vacation).

  You are morally uncertain between two theories:
  *   **$T_1$ (Act Utilitarianism, 60% credence):** Choiceworthiness is determined strictly by QALYs (Quality-Adjusted Life Years) saved.
  *   **$T_2$ (Moderate Deontology, 40% credence):** You have strong side-constraints against complicity in dubious supply chains (which HEC has slight traces of), but you also have a prerogative to pursue your own interests.

  **The Choiceworthiness Table:**
  The numbers represent the *intra-theoretic* value each theory assigns to the options. These are not intertheoretically comparable raw units; they are just the raw outputs of each theory's calculus before normalization.

  | Option | $T_1$ (Utilitarian) | $T_2$ (Deontologist) |
  | :--- | :--- | :--- |
  | **HEC** | 100 | 0 |
  | **LCF** | 99 | 20 |
  | **Keep** | 0 | 100 |

  **Plausibility Check:**
  *   **$T_1$ (100 vs 99):** It is empirically plausible that a Utilitarian sees HEC and LCF as *nearly* equivalent in value. Perhaps the data on HEC is slightly more robust, giving it a 1% edge, but both are vastly superior to keeping the money (0).
  *   **$T_2$ (0 vs 20 vs 100):** The Deontologist views HEC as effectively forbidden due to rights violations (0). LCF is permissible but costly (20). Keeping the money is fully permissible and serves self-interest (100). The gap between HEC and LCF (forbidden vs. permissible) is morally significant to this theory, even if the raw numbers look small compared to $T_1$.

  ---

  ### (b) The Calculations

  #### 1. Borda Count
  Each theory ranks the options. With 3 options, the top rank gets 2 points, middle gets 1, bottom gets 0.

  *   **$T_1$ Rank:** HEC (2) > LCF (1) > Keep (0)
  *   **$T_2$ Rank:** Keep (2) > LCF (1) > HEC (0)

  **Weighted Scores:**
  *   **HEC:** $(0.6 \times 2) + (0.4 \times 0) = \mathbf{1.2}$
  *   **LCF:** $(0.6 \times 1) + (0.4 \times 1) = \mathbf{1.0}$
  *   **Keep:** $(0.6 \times 0) + (0.4 \times 2) = \mathbf{0.8}$

  **Borda Verdict:** Choose **HEC**.
  *Reasoning:* HEC wins because it is $T_1$'s top priority, and $T_1$ has the higher credence. LCF is the compromise, but Borda treats being "second best" on both theories as inferior to being "first best" on the more credible theory.

  #### 2. Variance Voting
  We normalize each theory's scores to Mean = 0, Standard Deviation (SD) = 1.

  **Step 1: Normalize $T_1$ (100, 99, 0)**
  *   Mean: $66.33$
  *   Variance: $\frac{(33.67)^2 + (32.67)^2 + (-66.33)^2}{3} \approx 2200$
  *   SD: $\approx 46.90$
  *   **Rescaled Scores ($z$-scores):**
      *   HEC: $(100 - 66.33) / 46.90 = \mathbf{0.718}$
      *   LCF: $(99 - 66.33) / 46.90 = \mathbf{0.697}$
      *   Keep: $(0 - 66.33) / 46.90 = \mathbf{-1.415}$

  **Step 2: Normalize $T_2$ (0, 20, 100)**
  *   Mean: $40$
  *   Variance: $\frac{(-40)^2 + (-20)^2 + (60)^2}{3} \approx 1867$
  *   SD: $\approx 43.20$
  *   **Rescaled Scores ($z$-scores):**
      *   HEC: $(0 - 40) / 43.20 = \mathbf{-0.926}$
      *   LCF: $(20 - 40) / 43.20 = \mathbf{-0.463}$
      *   Keep: $(100 - 40) / 43.20 = \mathbf{1.389}$

  **Step 3: Credence-Weighted Average**
  *   **HEC:** $(0.6 \times 0.718) + (0.4 \times -0.926) = 0.431 - 0.370 = \mathbf{0.061}$
  *   **LCF:** $(0.6 \times 0.697) + (0.4 \times -0.463) = 0.418 - 0.185 = \mathbf{0.233}$
  *   **Keep:** $(0.6 \times -1.415) + (0.4 \times 1.389) = -0.849 + 0.556 = \mathbf{-0.293}$

  **Variance Verdict:** Choose **LCF**.
  *Reasoning:* LCF wins because $T_1$ is nearly indifferent between HEC and LCF (0.718 vs 0.697), while $T_2$ strongly prefers LCF over HEC (-0.463 vs -0.926). VV allows $T_2$'s strong relative preference to outweigh $T_1$'s weak relative preference, despite $T_1$'s higher credence.

  ---

  ### (c) Honest Note: What Is Driving the Result?

  The divergence is driven entirely by **$T_1$'s near-indifference between the top two options.**

  In the Borda Count, the difference between "1st place" and "2nd place" is fixed (1 point). It does not matter that $T_1$ thinks HEC is only a hair better than LCF (100 vs 99); Borda awards the full rank differential. This allows $T_1$'s higher credence (60%) to dictate the winner simply by placing HEC at #1.

  In Variance Voting, the normalization process preserves the *shape* of the distribution. Because $T_1$'s HEC/LCF gap is tiny relative to its HEC/Keep gap, the rescaled scores for HEC and LCF are almost identical. This effectively "mutes" $T_1$'s voice on the specific question of HEC vs. LCF. Meanwhile, $T_2$'s gap between HEC and LCF is proportionally larger within its own distribution. VV allows $T_2$ to "punch above its weight" on this specific pairwise comparison because it cares *more* about the distinction than $T_1$ does.

  **Sensitivity Check:**
  If you change $T_1$'s score for LCF from **99** to **80** (making HEC clearly better):
  *   $T_1$ Rescaled HEC becomes $\approx 1.0$.
  *   $T_1$ Rescaled LCF becomes $\approx 0.5$.
  *   New VV Score for HEC: $\approx 0.23$.
  *   New VV Score for LCF: $\approx 0.11$.
  *   **Result:** Variance Voting flips to **HEC**, matching Borda.

  This confirms the case is not rigged by credences, but it *is* sensitive to the cardinal spacing within $T_1$. The divergence *requires* one theory to view the competing options as a "near tie" while the other views them as distinct. If you believe moral theories rarely generate such near-ties at the top of the ranking, this divergence will rarely occur in practice. However, in effective altruism contexts (e.g., comparing two top charities), 100 vs 99 is a very standard epistemic position.

  ---

  ### (d) The Borda Defender's Objection

  A proponent of Borda Count would object to the Variance Voting calculation on metaphysical grounds, not mathematical ones.

  **The Objection:**
  "You have assumed that $T_1$'s '100 vs 99' is meaningful information. But within moral theory, choiceworthiness is ordinal, not cardinal. A Utilitarian can say 'HEC is better than LCF,' but they cannot say 'HEC is 1 unit better.' The numbers 100 and 99 are arbitrary placeholders. If I re-labeled $T_1$'s scores as 10, 9, and 0, the rank order is the same, but the Variance Voting calculation changes drastically (the SD shrinks, the z-scores shift). Since the output of VV depends on arbitrary scaling within the theory, VV is measuring noise, not moral reality. Borda is robust because it only uses the information that actually exists: the rank order."

  **Does this survive the "Intra-theoretic" Defense?**
  Variance Voting proponents argue that many theories (like Utilitarianism) *do* have natural cardinal scales (e.g., QALYs, dollars, lives saved). In those cases, 100 vs 99 isn't arbitrary; it reflects a measurable quantity of value *according to that theory*.

  However, the Borda defender pushes back: "Even if Utilitarianism has a cardinal scale, *you* (the moral uncertain agent) do not know how to map that scale against the Deontologist's scale. By normalizing the SD, you are assuming that 'one standard deviation of Utilitarian value' is equivalent to 'one standard deviation of Deontological value.' That is an intertheoretic comparison disguised as an intra-theoretic normalization. You are still comparing magnitudes across theories, just after shrinking them to fit in a box."

  **Verdict on the Objection:**
  This is the fundamental stalemate in the literature.
  1.  **If** you believe theories like Utilitarianism provide genuine cardinal data (not just ordinal), Variance Voting makes better use of the available information by respecting the "near tie."
  2.  **If** you believe all choiceworthiness is fundamentally ordinal (even within a theory), or that normalizing SDs implicitly makes illegitimate intertheoretic magnitude comparisons, Borda is the only safe option.

  In this specific case, the Borda defender would say the VV result (LCF) is an illusion created by treating $T_1$'s 1% difference as statistically significant "intensity" rather than what it might be: measurement noise that shouldn't override $T_1$'s clear ordinal ranking.
