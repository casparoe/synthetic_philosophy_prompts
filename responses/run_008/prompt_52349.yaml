      *   **Tone:** Philosophical, rigorous, honest (admit if it's hard to make non-contrived).

  2.  **Theoretical Background Check:**
      *   **Variance Voting (VV):** Normalizes each theory's scores (mean 0, SD 1). This means theories that see *huge* differences between options (high variance) get downweighted relative to theories that see *small* differences (low variance), *unless* the normalization rescues them. Wait, actually, VV normalizes *within* the theory. So if Theory 1 thinks $A=100, B=0$ and Theory 2 thinks $A=1, B=0.9$, VV rescales them so both have SD=1. This effectively equalizes the "intensity" of each theory. It treats every theory as having equal "voice" in terms of standard deviations.
      *   **Borda Count (BC):** Only cares about rank order. $A > B > C$ gives points 2, 1, 0. It ignores *how much* better A is than B.
      *   **Divergence Condition:** VV and BC diverge when the *intensity* of preference within a theory correlates differently with the *rank order* across theories. Specifically, VV is sensitive to how "spread out" a theory's values are relative to the other options *before* normalization, but normalization equalizes the spread. Wait, let me re-evaluate VV.
      *   *Correction on VV:* VV rescales *each theory* to have SD=1. This means Theory 1's "100 vs 0" becomes mathematically equivalent to Theory 2's "1 vs 0.9" *after* rescaling. So VV actually *ignores* the raw cardinal magnitude differences *between* theories. It only cares about the *relative* spacing within a theory.
      *   *So where is the difference?* The difference arises because Borda treats a "near tie" the same as a "landslide" *within* a theory, whereas VV preserves the *relative spacing* within a theory (even if it normalizes the total spread).
      *   *Key Insight:* If Theory 1 thinks $A \gg B \approx C$ (A is vastly better, B and C are nearly equal) and Theory 2 thinks $A \approx B \gg C$ (A and B are nearly equal, C is vastly worse), Borda treats the "near ties" as strict ranks (usually). If we force strict ranks for Borda, Borda loses the info that B and C are "close" for Theory 1. VV keeps that info.
      *   *Wait, standard Borda:* If $A > B > C$, points are 2, 1, 0. If $A \gg B \approx C$, Borda still usually requires a rank. If the theory allows ties, Borda splits points (e.g., 1.5, 1.5). If the theory *doesn't* allow ties (strict ranking), Borda forces a distinction where there is moral indifference.
      *   *Better Divergence Mechanism:* The divergence usually comes from **outliers** in the option set for a specific theory.
      *   *Scenario:* Suppose Theory 1 (Utilitarianism) thinks Option A is amazing, B is okay, C is terrible. (High spread). Theory 2 (Deontology) thinks A is forbidden, B is okay, C is okay. (Low spread between B and C, but A is distinct).
      *   *Actually, the classic divergence case:* One theory has a "clump" of options that are nearly equal, while another theory spreads them out.
      *   *Let's look at the normalization:* VV subtracts mean, divides by SD.
          *   If Theory 1 scores: $10, 0, 0$. Mean=3.33, SD $\approx$ 4.7. Rescaled: $1.4, -0.7, -0.7$.
          *   If Theory 2 scores: $1, 0.9, 0.8$. Mean=0.9, SD $\approx$ 0.1. Rescaled: $1, 0, -1$ (roughly).
          *   VV makes the *spread* equal. Borda makes the *rank steps* equal.
          *   Divergence happens when the *shape* of the distribution differs. E.g., Theory 1 thinks A is best, but B and C are basically tied. Theory 2 thinks A, B, C are evenly spaced.
          *   If Theory 1 has high credence, VV will reflect the "B $\approx$ C" structure. Borda will force B > C (or tie). If Borda forces B > C, it gives C a penalty relative to B that Theory 1 doesn't endorse.
      *   *Refined Plan:* I need a case where one theory sees two options as *very close* (almost indifferent), while another theory sees them as *distinctly ranked*. If the "close" options are the ones competing for the win, VV might favor the one that is "less bad" on the high-variance theory, whereas Borda treats the "close" distinction as equal weight to the "large" distinction.
      *   *Actually, the most robust divergence:* **The "Extremist" vs. "Moderate" problem.**
          *   Theory 1 (Consequentialism): Sees huge stakes. A is great, B is mediocre, C is disaster.
          *   Theory 2 (Deontology): Sees modest stakes. A is slightly wrong, B is neutral, C is slightly right.
