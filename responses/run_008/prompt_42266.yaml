answer: |-
  ### (1) Exam Question

  **Final Exam: Autonomy, Coercion, and Consent**
  **Time Allowed: 90 Minutes**
  **Total Marks: 20**

  **Question 1**

  Consider the following stipulated account of valid consent, which we will call the **Deliberative Risk Theory**:

  > *Consent is invalid if and only if it was obtained in circumstances that predictably caused the consenter to run risks she would not have accepted after calm, fully informed deliberation.*

  Evaluate this theory by applying it to the following three cases:

  *   **(a)** A patient consents to surgery after the surgeon truthfully recites the operative risks but exaggerates her own success rate.
  *   **(b)** A patient consents to emergency surgery under time pressure generated by the emergency itself, with no one having manipulated anything.
  *   **(c)** Two persons agree to identical transactions. Person X agrees only because the counterparty threatens to reveal something embarrassing. Person Y agrees only because the counterparty offers a large benefit that she created herself.

  In your essay, you must:
  1.  Determine whether the Deliberative Risk Theory delivers the correct verdicts in each case compared to standard legal and moral intuitions.
  2.  Diagnose precisely where the theory diverges from traditional accounts. Specifically, use the threat/offer pair (case c) to expose the **baseline problem** for coercion, and use the exaggeration case (case a) to expose the gap between **wronging someone** and **invalidating their consent**.
  3.  Either propose a repair to the Deliberative Risk Theory that solves these problems or defend the traditional triad (coercion, deception, competence) against it.

  *Note: Answers that treat all three cases as generic instances of "manipulation" without distinguishing the underlying mechanisms (e.g., alteration of option sets vs. distortion of belief) will not receive credit for higher-order analysis.*

  ***

  ### (2) Model Answer

  The Deliberative Risk Theory (DRT) offers a compelling psychological standard for consent, focusing on the quality of the agent's decision-making process rather than rigid categorical rules. However, while DRT captures the spirit of autonomy, it fails as a normative standard because it conflates distinct mechanisms of influence and lacks a moralized baseline. Consequently, the traditional triad remains superior, though it requires careful application.

  Applied to the cases, DRT yields problematic verdicts. In case (a), the surgeon's exaggeration predictably skews deliberation; DRT invalidates consent. This aligns with intuition regarding fraud. In case (b), the emergency pressure prevents "calm" deliberation. DRT invalidates consent. This contradicts the standard doctrine of necessity or presumed consent, where urgency validates action despite the lack of calm reflection. In case (c), both the threat and the large offer predictably alter risk acceptance relative to a calm baseline. DRT likely invalidates both. This is correct for the threat but incorrect for the offer, which traditionally validates consent even if the inducement is powerful.

  The failure in case (c) exposes the baseline problem. Traditional accounts distinguish threats from offers based on the moral status of the proposal relative to a normative baseline. A threat worsens the subject's position wrongfully, whereas an offer improves it. DRT ignores the *source* of the deliberative pressure, focusing only on the *effect*. By treating the large benefit as potentially invalidating, DRT risks paternalism, suggesting agents cannot validly consent when tempted by significant gains. A theory of consent must track whether the consenter's will was *subordinated* to another's wrongful will, not merely whether their calculation was influenced.

  The failure in case (b) and the nuance required in (a) expose the distinction between wronging and invalidating. In (a), the surgeon certainly wrongs the patient by lying. However, traditional accounts often distinguish between fraud that vitiates consent (fraud in the essence) and fraud that merely induces it. If the operative risks were truthfully recited, the patient understood the physical harm they might suffer. The lie concerned the probability of avoidance. DRT collapses this, invalidating consent whenever deliberation is imperfect. This conflates the moral wrong of lying with the normative power of consent. One can be wronged yet still consent; the remedy lies in damages for deception, not necessarily in nullifying the authorization.

  Furthermore, a top-tier analysis must distinguish the mechanisms at play. Cases (a) and (b)/(c) operate differently. Case (a) works internally by distorting the agent's *beliefs* about the world. Cases (b) and (c) work externally by altering the agent's *option set* or the costs associated with options. DRT lumps these together as "circumstances affecting deliberation." This is a category error. Protecting autonomy requires ensuring agents have accurate information (addressing belief) and that they are not forced by wrongful constraints (addressing options). DRT's focus on the psychological outcome ("calm deliberation") misses the structural conditions required for autonomy to exist in the first place.

  Therefore, the traditional account should be defended over DRT. The triad of coercion, deception, and competence successfully separates the moral quality of the interaction from the psychological state of the consenter. To repair DRT would require adding a wrongful conduct clause—invalidating consent only when the deliberative impairment is caused by another's wrongful act. But once that clause is added, DRT collapses back into the traditional account. The traditional triad is superior because it identifies *why* consent is invalid (the wrongfulness of the influencer's conduct) rather than merely *that* the consenter's psychology was compromised. Autonomy is not just about calm thinking; it is about standing in the right moral relationship with those seeking our permission.

  ***

  ### (3) Marking Scheme

  | Point | Criteria | Marks | Common Mistake |
  | :--- | :--- | :--- | :--- |
  | **1. Application** | Correctly applies DRT to all three cases, noting it likely invalidates (b) and the Offer in (c), contrasting this with standard intuitions. | 4 | Treating DRT as obviously correct in all cases without noting divergence from standard doctrine (e.g., emergency consent). |
  | **2. Baseline Problem** | Identifies that DRT cannot distinguish Threats from Offers because both alter deliberation, whereas traditional accounts rely on a moralized baseline. | 4 | Arguing that offers are coercive simply because they influence decision-making, missing the normative baseline distinction. |
  | **3. Wronging vs. Invalidating** | Distinguishes between the surgeon's moral wrong (lying) and the validity of the authorization (understanding physical risks), showing DRT conflates them. | 4 | Assuming all deception automatically voids consent without discussing materiality or the nature of the misunderstanding. |
  | **4. Mechanism Distinction** | **Crucial:** Explicitly distinguishes between internal mechanisms (belief distortion in deception) and external mechanisms (option set/pressure in coercion/emergency). | 4 | Lumping all cases together as generic "manipulation" or "pressure" without distinguishing belief vs. option set. |
  | **5. Resolution** | Proposes a coherent repair (e.g., adding a wrongful conduct constraint) or defends the traditional account with a clear normative justification. | 4 | Offering a vague conclusion that "both theories have merits" without taking a stance or proposing a specific theoretical fix. |
  | **Total** | | **20** | |

  ***

  **Closing Note**

  I am highly confident that this question is fair and that the model answer is defensible, as it adheres strictly to the logical constraints of the stipulated theory while leveraging standard philosophical distinctions taught in the seminar. The marking scheme effectively separates genuinely better answers from merely well-rehearsed ones, particularly through Point 4.

  The point where I am least sure about the allocation of marks is **Point 4 (Mechanism Distinction)**. I have allocated it 4 marks because it is the specific discriminator between an A and a B answer as per your instructions. However, in practice, students who excel at Point 2 (Baseline Problem) often naturally articulate Point 4, making it difficult to grade them as entirely separate categories. There is a risk of double-counting the insight that "threats alter options while lies alter beliefs" across both points. I hesitate here because distinguishing the *normative* baseline problem from the *mechanical* distinction is subtle, and a student might merge them seamlessly. I will need to ensure markers look for explicit terminology regarding "belief vs. option set" to award Point 4 independently of Point 2.
