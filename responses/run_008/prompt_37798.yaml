answer: |-
  The epistemological status of verbal testimony (*śabda*) divides classical Indian thought. Reductionists (Cārvākas, Buddhists) contend *śabda* is merely *anumāna* (inference), derived from observing a speaker's reliability (*āptatva*). Anti-reductionists (Nyāya, Mīmāṃsā) insist *śabda* is *sui generis*, yielding knowledge directly from word-meaning connections without intermediate reasoning about the speaker.

  The reductionist argues that understanding implies trust, and trust is earned. We infer truth from the speaker's competence. The anti-reductionist counters phenomenologically: we do not consciously reason "this person is reliable, therefore this is true" every time we understand a sentence. Meaning is immediate. However, the anti-reductionist faces the bootstrapping problem. If language is learned from elders via testimony, and testimony requires prior knowledge of reliability, how does language acquisition begin? Nyāya stops the regress by positing that initial word-meaning connections are learned via perception and inference (ostensive definition), allowing *śabda* to function independently thereafter. Buddhists maintain that even this learning relies on inferring reliability from consistent behavior.

  Consider the modern case of Large Language Models (LLMs). Extending the framework anachronistically, an LLM produces fluent, informative text without being an *āpta*. It possesses no knowledge, intention, or epistemic welfare concern; it predicts tokens based on statistical patterns. Yet, users often accept its output as knowledge. If *śabda* is irreducible, requiring only word-apprehension, the LLM should qualify. But classical *śabda* mandates a trustworthy speaker. The LLM lacks agency, violating the metaphysical condition for testimony. If we treat LLM output as *śabda*, we detach testimony from truth-responsibility, risking hallucination.

  If we treat LLM interaction as *anumāna*, the fit is tighter but imperfect. Users rarely consciously premise their trust on training data quality. However, the trust is based on an implicit inference from the system's past performance and institutional backing. The phenomenological immediacy mirrors ordinary testimony, suggesting that much human *śabda* is also habitual inference masked as direct grasp. The LLM acts as a probe: it reveals that when the *āpta* is removed, the "testimony" remains structurally similar but loses its guarantee of truth. This suggests the *āpta* was never the direct object of cognition (supporting Nyāya phenomenology) but the necessary ground for justification (supporting Buddhist reductionism).

  Here lies the verdict: *śabda* is reducible to inference regarding justification, even if phenomenologically immediate. The LLM case clarifies this. We accept LLM text not because words inherently carry truth (anti-reductionism), but because we infer reliability from the interface and brand. When the model hallucinates, we realize our inference was flawed. In human testimony, we rarely verify the *āpta*, operating on assumed reliability. The LLM makes this assumption visible. Since the LLM cannot be an *āpta*, our acceptance of its text cannot be *śabda* in the strict Nyāya sense; it must be *anumāna* based on observed regularity.

  Therefore, the reductionist view holds stronger explanatory power. The classical fear was that reducing *śabda* to *anumāna* undermines social trust. The LLM shows the opposite risk: treating non-agential output as *śabda* undermines knowledge. By recognizing our trust in LLMs as implicit inference, we acknowledge that all testimony rests on a foundational inference of reliability, even if subconscious. The regress is stopped not by irreducible *śabda*, but by basic perceptual regularities that ground our initial inferences of reliability. Thus, *śabda* is epistemically reducible to *anumāna*, a conclusion reinforced by the necessity of treating machine text as probabilistic inference rather than authoritative word.
