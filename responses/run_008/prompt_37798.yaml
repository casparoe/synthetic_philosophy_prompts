          Consider the modern case of Large Language Models (LLMs). An LLM produces fluent, informative text without being an *āpta*. It possesses no knowledge, intention, or epistemic welfare concern; it predicts tokens based on statistical patterns. Yet, users often accept its output as knowledge. If *śabda* is irreducible, requiring only word-apprehension, the LLM should qualify. But classical *śabda* mandates a trustworthy speaker. The LLM lacks agency, violating the metaphysical condition for testimony. If we treat LLM output as *śabda*, we detach testimony from truth-responsibility, risking hallucination.

          If we treat LLM interaction as *anumāna*, the fit is tighter but imperfect. Users rarely consciously premise their trust on training data quality. However, the trust is based on an implicit inference from the system's past performance and institutional backing. The phenomenological immediacy mirrors ordinary testimony, suggesting that much human *śabda* is also habitual inference masked as direct grasp. The LLM acts as a probe: it reveals that when the *āpta* is removed, the "testimony" remains structurally similar but loses its guarantee of truth. This suggests the *āpta* was never the direct object of cognition (supporting Nyāya phenomenology) but the necessary ground for justification (supporting Buddhist reductionism).

