          The epistemological status of verbal testimony (*śabda*) divides classical Indian thought. Reductionists (Cārvākas, Buddhists) contend *śabda* is merely *anumāna* (inference), derived from observing a speaker's reliability (*āptatva*). Anti-reductionists (Nyāya, Mīmāṃsā) insist *śabda* is *sui generis*, yielding knowledge directly from word-meaning connections without intermediate reasoning about the speaker.

