prompt: |-
  I've been defending lexical threshold negative utilitarianism in my reading group, mostly because everyone else there is a garden-variety hedonist and someone has to. Quick version of the view: there's a severity threshold T such that no amount or duration of happiness can outweigh any suffering at or above T, but below T pleasure and pain trade off against each other the ordinary utilitarian way. So a world with lots of scraped knees and hangnails plus plenty of happiness is fine, even good — the threshold is exactly what keeps this kind of NU from having to endorse painlessly sterilizing the universe.

  My friend claims he can show the threshold doesn't actually do that, using the view's own machinery:

  (1) In comparisons between certain outcomes, LTNU prefers a happy world containing only sub-threshold pains over an empty world — that's the entire point of having a threshold rather than plain NU.
  (2) Choices under risk are settled by applying the axiology via expected value: you rank lotteries by the expectation of the value of their outcomes.
  (3) Since no amount of happiness compensates any above-T suffering in a certain-outcome comparison, no probability-weighted amount of happiness can compensate a nonzero probability of above-T suffering in a risky choice either — whatever p is, the slice of the gamble where the risk materializes is lexically worse, and adding happy slices elsewhere can't fix that.
  (4) So any option with any nonzero chance of above-T suffering is worse than any option with zero chance, however tiny the chance and however drab the zero-risk option.
  (5) Every way of keeping sentient beings around — going for a run, having kids, just existing another day — carries some nonzero chance of above-T suffering, since T sits somewhere in the moderate-to-severe range and pain intensity is more or less continuous; you can always be unlucky enough to cross it, even by a hair.
  (6) Painless annihilation of all sentient life guarantees zero above-T suffering forever.
  (7) Therefore LTNU recommends painless annihilation over any continued existance — the exact bullet the threshold was built to dodge. Or, if you flinch at that, the view still makes us live like terrified actuaries, refusing every picnic because there's a 0.0001% chance someone gets a migraine at 1.01 times T.

  He insists this works no matter where you put the threshold, even a very severe one, because p never has to be large.

  Something feels off to me between (3) and (4) — like he's treating the threshold as assigning infinite negative weight instead of just imposing a different ordering — but I can't pin down what the licensed move is for a threshold view if expected value isn't it. And if (2) is the culprit, what do threshold people even use for choices under risk? For what it's worth, I'm pretty attached to (1), and honestly somewhat attached to (5) too — the part about being able to be unlucky enough to cross any line seems just true. So: which premise do I give up, why did it look fine, and what does giving it up cost me? If the answer is give up (2), I need to hear what replaces it. If the answer is give up (4), I want to know how that's not just sneaking compensability for severe suffering back in through the probabilities.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **View:** Lexical Threshold Negative Utilitarianism (LTNU).
      *   **Core Claim:** Suffering above threshold $T$ cannot be compensated by *any* amount of happiness. Suffering below $T$ trades off normally with happiness.
      *   **Goal:** Avoid the "painless sterilization" conclusion (i.e., avoid concluding that it's better to eliminate all sentient life to prevent future suffering).
      *   **Opponent's Argument:** A reductio ad absurdum showing LTNU *still* implies painless sterilization (or extreme risk aversion) when applied to decisions under risk.
      *   **The Argument Structure:**
          1.  LTNU prefers Happy+Sub-T Pain > Empty World (Certain).
          2.  Risk is handled by Expected Value (EV) of the axiology.
          3.  Lexical priority means no amount of happiness compensates above-T suffering (Certain).
          4.  Therefore, no *probability-weighted* happiness compensates non-zero probability of above-T suffering (Risk).
          5.  Existence always carries non-zero risk of above-T suffering.
          6.  Annihilation carries zero risk.
          7.  Conclusion: Annihilation > Existence.
      *   **User's Intuition:** Something is wrong between (3) and (4). It feels like treating the threshold as "infinite negative weight" rather than "lexical ordering."
      *   **User's Constraints:** Wants to keep (1) (the point of the view) and (5) (continuity of pain/risk). Needs to know which premise to drop, why, and what replaces it (especially if it's (2)).

  2.  **Evaluate the Opponent's Argument:**
      *   The core tension is between *lexicality* and *expected utility theory (EUT)*.
      *   Standard EUT assumes Archimedean continuity: for any outcomes $A, B, C$ where $A \succ B \succ C$, there exists a probability $p$ such that a lottery of $pA + (1-p)C$ is equivalent to $B$.
      *   Lexical views explicitly *reject* the Archimedean axiom. If Above-T Suffering is lexically worse than Happiness, then no probability mix of Happiness and Empty World can outweigh a certain (or probabilistic) chance of Above-T Suffering *if* the lexical priority transfers directly to expectations in the way the opponent claims.
      *   The opponent's move from (3) to (4) assumes that if $X$ is lexically worse than $Y$, then $pX$ is lexically worse than $Y$ for any $p > 0$. This is the "St. Petersburg Paradox" style problem for lexical views.
      *   However, the opponent's derivation relies on applying standard Expected Value (EV) calculations to a non-Archimedean value structure. Standard EV *requires* real-valued representations. Lexical values often require hyperreals, lexicographic vectors, or a rejection of standard EV maximization.

  3.  **Identify the Weak Point:**
      *   **Premise (2) is the culprit.** "Choices under risk are settled by applying the axiology via expected value."
      *   Why? Because standard Expected Value theory (Von Neumann-Morgenstern) assumes continuity (Archimedean property). Lexical Threshold views violate continuity by definition. You cannot map lexical priorities onto standard real-numbered expected utilities without losing the lexicality or generating the absurdity the opponent found.
      *   If you assign $-\infty$ to Above-T suffering, then any $p > 0$ gives $-\infty$ expected value. This leads to the opponent's conclusion.
      *   If you assign a very large finite number $-M$, then enough happiness *can* outweigh it, violating the lexical claim.
      *   Therefore, LTNU cannot use standard Expected Utility Theory.

  4.  **Formulate the Solution (Dropping/Modifying Premise 2):**
      *   **The Fix:** LTNU needs a decision theory for risk that respects lexical priorities without collapsing into "any risk is forbidden."
      *   **Option A: Lexicographic Expected Utility.** Instead of a single number, outcomes are vectors (e.g., [Amount of Above-T Suffering, Amount of Below-T Net Utility]). You maximize the first component, then the second.
          *   *Problem:* This still leads to the opponent's conclusion if *any* probability of Above-T suffering makes the first component worse than zero. If Option A has $p=0.0001$ of Above-T, and Option B (Annihilation) has $p=0$, Option B wins on the first component.
          *   *Refinement:* We need to compare *distributions* of lexical bads, not just presence/absence. But if the lexical bad is "presence of any above-T," annihilation wins.
      *   **Option B: Probability Thresholds (Deontological Constraints).** Treat the risk of Above-T suffering not as a value to be summed, but as a constraint. "Do not impose risk $> k$ of Above-T suffering."
          *   *Problem:* Arbitrary. Why is $0.0001\%$ okay but $0.0002\%$ not?
      *   **Option C: Discounting by Probability (The "Standard" Fix for Lexical Views).** Acknowledge that lexical priority applies to *certain* outcomes, but under uncertainty, probabilities *do* matter. A tiny probability of a lexical violation might be outweighed by a certainty of great good.
          *   *Wait, doesn't this violate lexicality?* Yes, technically. But it's the only way to avoid paralysis. This is often called "Lexicality with a Probability Discount" or moving to a "Soft Lexical" view.
          *   *Better formulation:* **Expected Utility with Non-Archimedean Values.** Use hyperreal numbers. Let Above-T suffering be $-\omega$ (an infinite quantity). Let Happiness be finite reals.
          *   Expected Value of Existence: $(1-p) \cdot (\text{Happy}) + p \cdot (-\omega) = \text{Finite} - p\omega$.
          *   Expected Value of Annihilation: $0$.
          *   If $p > 0$, then $-p\omega$ is infinitely negative. Annihilation still wins.
          *   *So Hyperreals don't solve the risk problem alone.*
      *   **Option D: Rejecting the "Zero Risk" Baseline (Premise 6/5 interaction).**
          *   Is annihilation truly zero risk? Maybe not (simulation hypothesis, resurrection, etc.). But that's a cop-out.
      *   **Option E: The "Reasonable Risk" / "Ex Ante" Approach.**
          *   Distinguish between *ex post* (outcome) and *ex ante* (choice).
          *   The lexical constraint applies to *actual* suffering, not *risk* of suffering.
          *   If I take a risk and no one suffers above T, I did nothing wrong. If I annihilate, I guarantee no happiness.
          *   This requires rejecting the idea that risk *itself* carries the lexical disvalue. Risk is bad, but not *lexically* bad in the same way actual suffering is.
          *   This means modifying (2) to say: "Choices under risk are settled by expected *sub-threshold* utility, subject to a constraint that risk of above-T suffering must be reasonable/minimized but not absolutely vetoed."
          *   *Wait, this sounds like Premise 4 is false.* The opponent claims (4) follows from (3). But (3) is about certain outcomes. (4) extends it to risk. The extension is the weak link.
          *   *Why is the extension weak?* Because lexical priority is usually defined over *outcomes*, not *prospects*. If the theory is outcome-based, we need a bridge principle to get to risk. Standard EV is one bridge. But it's not the only one.
          *   **The "Catastrophe Avoidance" Model:** We minimize the probability of the lexical bad, *ceteris paribus*. But if the only way to reduce the probability further is to sacrifice everything else (annihilation), we stop.
          *   **The "Threshold Probability" Model:** Risks below a certain probability $\epsilon$ are treated as negligible for lexical purposes. (This effectively makes the view non-lexical at the margins, but preserves it for high probabilities/certainty).

  5.  **Selecting the Best Defense for the User:**
      *   The strongest philosophical move is to **reject Premise (2)** (Standard Expected Value) and **reject the inference from (3) to (4)**.
      *   **Why?** Because standard EV assumes the Archimedean axiom, which LTNU explicitly denies. You cannot simply plug lexical values into the EV formula $E[U] = \sum p_i u_i$.
      *   **What replaces it?** A decision theory that allows for *trade-offs under risk* even when *trade-offs under certainty* are forbidden.
      *   **Specific Proposal:** **Probability Discounting** or **Lexical Expected Utility with a "Safety" Constraint.**
      *   Actually, the most robust defense for LTNU against this specific "Risk Argument" is to argue that **lexical priority applies to outcomes, not expectations.**
      *   If you choose a risky action and the bad outcome doesn't happen, you haven't violated the lexical constraint. If you choose annihilation, you *have* guaranteed the loss of all value.
      *   Therefore, under risk, we maximize expected *sub-threshold* value, subject to keeping the probability of above-T suffering below a "reasonable" threshold (which is not zero).
      *   This effectively concedes that the view is not *purely* lexical under risk, but argues that this is a necessary feature of any livable moral theory.
      *   **Better yet:** Distinguish between **Ex Ante** and **Ex Post** views.
          *   *Ex Post:* Evaluate the outcome. If no one suffers > T, the outcome is good.
          *   *Ex Ante:* Evaluate the gamble.
          *   LTNU is typically Ex Post. The opponent is forcing an Ex Ante interpretation (Premise 2).
          *   If LTNU is Ex Post, then Premise (2) is false. You don't maximize expected lexical value; you maximize expected happiness *given that* you avoid violating the constraint *in actuality*. But since you can't know actuality in advance, you need a rule.
          *   The rule is: Minimize risk of >T, but not at the cost of eliminating all potential good.
      *   **The "Continuity" Objection:** The opponent says pain is continuous (Premise 5). So any activity risks crossing T.
      *   **Response:** Accept (5) but deny that *any* non-zero probability triggers the lexical veto. This requires a **Probability Threshold**. If $p < \epsilon$, the risk is treated as sub-threshold for decision-making purposes.
      *   *Cost:* This makes the view slightly less "pure." It admits a second threshold (probability). But it saves the view from self-destruction.

  6.  **Drafting the Response:**
      *   **Validate the User:** Their intuition is correct. The move from (3) to (4) is where the magic (and error) happens.
      *   **Diagnose the Error:** Premise (2) is incompatible with Lexicality. Standard Expected Utility Theory (EUT) requires the Archimedean axiom. LTNU violates it. You can't use EUT with lexical values without getting "infinity" problems.
      *   **The Solution:** Drop (2). Adopt a decision theory that handles lexical values under risk without implying that *any* probability is fatal.
      *   **Specific Mechanism:**
          1.  **Non-Archimedean Probability:** Some theorists (e.g., Beckstead & Thomas, or classical work by Hausner) suggest using lexicographic probabilities. But this is technical.
          2.  **Probability Discounting (The Pragmatic Fix):** Admit that for very small probabilities, the lexical priority "fades." A 1 in $10^{100}$ chance of torture doesn't outweigh a certainty of joy. This effectively creates a "probability threshold" alongside the "suffering threshold."
          3.  **Ex Post vs. Ex Ante:** Argue LTNU is an axiology (theory of good), not a decision theory. The decision theory needs to be "Minimize risk of T *subject to* maintaining a viable life."
      *   **Addressing the Cost:** Yes, you lose some purity. You admit that *some* amount of happiness *can* outweigh a *tiny risk* of severe suffering. But this is distinct from outweighing *certain* severe suffering. This preserves the core intuition (1) while avoiding the reductio (7).
      *   **Addressing Premise (5):** The continuity of pain is real, but moral thresholds don't have to track physical continuity perfectly (Sorites-style response). We draw lines for practical reasoning.

  7.  **Refining the Argument:**
      *   Focus heavily on the **Archimedean Axiom**. This is the technical term the user needs.
      *   Explain that if you keep (2) (Standard EV), you *must* assign a real number to the threshold suffering. If it's finite, it's compensable (violates LTNU). If it's infinite, any $p>0$ kills you (Opponent's result).
      *   Therefore, (2) must go.
      *   What replaces it? **Lexicographic Expected Utility** or **Threshold Probability**.
      *   Recommend **Threshold Probability**. It's the most defensible. "We treat risks below $\epsilon$ as negligible."
      *   Why isn't this sneaking compensation back in? Because it distinguishes between *certainty* and *risk*. It says "Certain Torture > Any Joy" but "Tiny Risk of Torture < Certain Joy." This is a standard distinction in ethics (e.g., driving cars risks death, but we do it).
      *   **Cost:** You have to defend why $\epsilon$ is where it is. But that's better than annihilating the universe.

