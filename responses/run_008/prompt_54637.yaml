answer: |-
  Your intuition is spot on. The move from (3) to (4) is doing heavy lifting that isn't licensed by the view itself. Your friend has successfully trapped you in a contradiction, but only by smuggling in a decision-theoretic assumption that Lexical Threshold Negative Utilitarianism (LTNU) should explicitly reject.

  Here is the breakdown of where the argument breaks, what you need to give up, and how to defend the resulting position.

  ### The Culprit: Premise (2)

  **Premise (2)** states: *"Choices under risk are settled by applying the axiology via expected value: you rank lotteries by the expectation of the value of their outcomes."*

  This is the weak link. Standard Expected Utility Theory (EUT) relies on the **Archimedean Axiom** (or Continuity Axiom). This axiom states that for any three outcomes $A \succ B \succ C$, there is some probability $p$ such that you are indifferent between $B$ for certain and a lottery of $pA + (1-p)C$.

  **LTNU explicitly violates the Archimedean Axiom.** That is the whole point of a *lexical* threshold. You are saying that for $A$ (Happiness), $B$ (Empty World), and $C$ (Above-T Suffering), there is **no** probability $p$ where a mix of $A$ and $B$ outweighs $C$.

  If you try to force a lexical axiology into standard Expected Value calculations, you face a dilemma:
  1.  **Assign a finite negative value to Above-T Suffering:** Then enough happiness *can* outweigh it (violating LTNU).
  2.  **Assign infinite negative value ($-\infty$):** Then any non-zero probability $p$ results in an expected value of $-\infty$ (yielding your friend's conclusion that annihilation is mandatory).

  Since both options destroy your view, you must reject the method of calculation. You cannot use standard Expected Value.

  ### The Fix: Probability Thresholds (De Minimis Risk)

  To save LTNU, you need a decision theory for risk that respects lexical priority in *certainty* but allows trade-offs in *risk*. The standard solution in the literature (defended by philosophers like Michael Otsuka, Ingmar Persson, and others working on negative utilitarianism) is to introduce a **probability threshold**.

  **Replace Premise (2) with:**
  > *(2*) Choices under risk are settled by maximizing expected sub-threshold utility, subject to the constraint that the probability of above-T suffering does not exceed a de minimis threshold $\epsilon$.*

  **How this blocks the argument:**
  *   **Blocks (4):** It denies that *any* nonzero probability is lexically forbidden. Only probabilities above $\epsilon$ trigger the lexical veto.
  *   **Blocks (7):** Since everyday activities (picnics, running) carry risks far below $\epsilon$, they are permissible. Annihilation is not required because existence does not necessarily violate the probability constraint.
  *   **Preserves (1):** In cases of *certainty* ($p=1$), the probability is obviously $>\epsilon$, so the lexical veto holds. No amount of happiness outweighs *certain* above-T suffering.

  ### Addressing Your Concerns

  You asked two specific questions about the cost of this move.

  #### 1. "If the answer is give up (2), I need to hear what replaces it."
  As above, you replace standard Expected Value with **Constrained Maximization**.
  *   **Step 1:** Filter out any options where the risk of Above-T suffering $> \epsilon$.
  *   **Step 2:** Among the remaining options, maximize the expected net balance of happiness and sub-threshold pain.

  This is not ad hoc; it mirrors how we handle other catastrophic risks in ethics and policy (e.g., nuclear safety, pandemics). We don't treat a 1-in-a-billion risk of catastrophe as equivalent to a certainty, nor do we treat it as morally negligible in all contexts, but we acknowledge it is distinct from certainty.

  #### 2. "If the answer is give up (4), I want to know how that's not just sneaking compensability for severe suffering back in through the probabilities."
  This is the strongest objection your friend will raise. They will say: *"If a tiny risk can be outweighed by happiness, then severe suffering is compensable after all, just via a probability discount."*

  **Your Response:** Distinguish between **Outcome Compensation** and **Risk Imposition**.
  *   **Outcome Compensation (Forbidden):** "I will torture this child (Above-T), but in exchange, I will give you a million happy years." LTNU says **No**. The suffering is lexically worse.
  *   **Risk Imposition (Permitted):** "I will drive a car (risking a crash that causes Above-T suffering) because it allows me to get to work and generate happiness." LTNU says **Yes**, provided the risk is low enough.

  The moral distinction lies in the **ex post** reality.
  *   In the first case, the bad thing *happens*. The lexical violation is actualized.
  *   In the second case, the bad thing *might happen*. If it doesn't happen, no lexical violation has occurred.

  By accepting a probability threshold, you are not saying happiness outweighs severe suffering. You are saying that **the disvalue of a risk is not identical to the disvalue of the outcome.** A 0.0001% risk of torture is not 0.0001% as bad as torture; it is *much less bad* than that, because in 99.9999% of the probability branches, the torture never exists.

  ### The Cost: What You Give Up

  You do pay a price for this defense. You need to be honest with your reading group about it.

  1.  **Loss of Purity:** You are admitting that LTNU is not purely lexical all the way down. It is lexical regarding *outcomes*, but aggregative regarding *risks*. Some purists might call this a contradiction, but you should frame it as a necessary feature of any livable moral theory.
  2.  **The $\epsilon$ Problem:** You now have to defend where the probability threshold sits. Why is $10^{-6}$ okay but $10^{-5}$ not?
      *   *Defense:* You don't need a precise number. You can argue for a "reasonable person" standard or a range. The vagueness of $\epsilon$ is preferable to the certainty of annihilation.
  3.  **Premise (5) Nuance:** Your friend's Premise (5) says pain is continuous, so we always risk crossing $T$.
      *   *Counter:* Even if pain is physically continuous, moral categories need not be. We draw lines for practical reasoning (Sorites paradox). Just because we can't pinpoint the exact grain that makes a heap doesn't mean "heap" isn't a valid category. Similarly, just because pain intensity is continuous doesn't mean we can't have a moral threshold for decision-making.

  ### Summary for Your Reading Group

  Tell your friend:
  > "You've shown that **Lexical Threshold NU is incompatible with Standard Expected Utility Theory.** I agree. Premise (2) assumes the Archimedean axiom, which my view denies.
  >
  > However, rejecting (2) doesn't force me to accept annihilation. It forces me to adopt a decision theory that treats **certainty** and **risk** differently. I hold that while no amount of happiness compensates for *certain* severe suffering, we are permitted to accept *negligible risks* of severe suffering to secure certain goods.
  >
  > This preserves the core intuition (1)—that we cannot trade a person's torture for a party—while avoiding the paralysis of (7). The cost is that I must defend a probability threshold for risk, but that is a smaller bullet to bite than painless sterilization."

  This moves the debate from "Your view implies absurdity" to "How do we justify risk thresholds?", which is a much more fertile and defensible ground for a utilitarian.
