      *   Structure:
          1.  Confirm intuition (3->4 is the break).
          2.  Identify Premise (2) as the formal error (Archimedean axiom).
          3.  Explain why standard EV fails for lexical views.
          4.  Propose the replacement (Probability Threshold / Non-Archimedean Decision Theory).
