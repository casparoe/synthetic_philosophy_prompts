      Actually, the cleanest philosophical move is to deny that lexical priority transfers linearly to probabilities. This is denying the **Independence Axiom** or **Continuity** of VNM utility.
      Let's stick to the "Probability Threshold" as the most practical solution for a reading group context. It's often called "De Minimis Risk."

      *Wait, one more check:* Does dropping (2) save (1)? Yes. (1) is about certain outcomes. (2) is about risk. You can hold (1) true while saying risk works differently.
