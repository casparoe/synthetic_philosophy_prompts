answer: |-
  ### Exam Question (90 Minutes)

  **Question 1:**
  John Harsanyi is often credited with providing a formal derivation of utilitarianism from the axioms of rational choice. However, scholars distinguish between his *Impartial Observer* argument (1953/1955) and his *Aggregation* theorem (1977). 

  Write an essay evaluating the claim that Harsanyi successfully derives utilitarianism from rationality alone. In your answer, you must:
  1.  Distinguish the normative commitments of the two theorems.
  2.  Address Peter Diamond's critique regarding fairness and lotteries.
  3.  Analyze how variable population sizes affect the utilitarian conclusion (Average vs. Total).
  4.  Critically assess the objection that the theorems are circular, distinguishing between a trivial charge of assumption and a substantive charge regarding the normativity of Expected Utility theory.

  Conclude whether Harsanyi resolves the conflict between rational choice and moral theory, or merely relocates it.

  ***

  ### Model Answer (Approx. 650 words)

  The claim that Harsanyi derives utilitarianism from rationality alone is compelling but ultimately unsustainable. While Harsanyi provides rigorous formal structures, his "derivation" relies on normative premises embedded within the axioms of rational choice, specifically Expected Utility (EU) theory. To evaluate this, one must distinguish between his two primary arguments: the Impartial Observer (IO) theorem and the Aggregation theorem.

  The Aggregation theorem posits that if individuals and a social planner both satisfy EU axioms, and the planner respects the Pareto principle, social welfare must be a weighted sum of individual utilities. This looks like a derivation, but it presupposes that individual utilities are already measured on a common cardinal scale. It does not explain *why* we should aggregate them linearly, only that *if* we respect Pareto and rationality, we must. The IO argument attempts to ground this morally: an observer behind a veil of ignorance, assigning equiprobable probability to being any person $i$ in society, maximizes expected utility by maximizing the average utility of the population.

  However, both arguments hinge on the normative status of the EU axioms. Dev's position—that rejecting EU is ipso facto irrational—conflates instrumental rationality with moral ontology. The "circularity" objection is often lazily stated as "Harsanyi assumes utilitarianism." This is false; he assumes EU. The substantive objection is that EU axioms (like Independence) carry normative weight equivalent to utilitarianism. By insisting that social lotteries be evaluated identically to individual risk, Harsanyi builds utilitarian neutrality into the definition of rationality.

  This is vividly illustrated by Peter Diamond's fairness critique. Consider a society with two agents and one indivisible good. Option A gives the good to Agent 1 with certainty. Option B allocates the good via a fair coin flip. Ex-post, Option A yields higher utility for the winner and zero for the loser, while Option B yields expected utility of 0.5 for both. Under Harsanyi's IO (and standard EU), if utilities are linear, the social value of the coin flip is the sum of expected utilities, which equals the certain allocation (assuming risk neutrality). Diamond argues this ignores *ex-ante fairness*. A social planner might prefer the coin flip to give both agents an equal chance, even if expected welfare is identical. Harsanyi dismisses this as irrational envy or a violation of the Independence axiom. An 'A' grade analysis recognizes that Diamond is not attacking utilitarianism's conclusion, but the *Independence axiom* in social contexts. He shows that "rationality" in social choice may require sensitivity to the distribution of chances, not just the distribution of outcomes. Harsanyi's defense rests on stipulating that only outcomes matter, which is a moral claim, not a rational necessity.

  Furthermore, Harsanyi's framework falters under variable population scrutiny. In the IO argument, the probability of being person $i$ is $1/N$. If population size $N$ changes, the probability changes. Maximizing average utility (sum divided by $N$) differs from maximizing total utility (sum). Harsanyi's equiprobability assumption naturally leads to Average Utilitarianism. However, this yields counterintuitive results in population ethics (e.g., preferring a small, very happy population over a massive, slightly less happy one). Conversely, if one adjusts the theorem to prioritize Total Utilitarianism to avoid the "Repugnant Conclusion," one must abandon the strict equiprobability veil. This "nasty little fact" demonstrates that the theorem cannot simultaneously satisfy the veil of ignorance intuition and handle population variability without introducing additional normative parameters. Harsanyi does not solve population ethics; he hides it within the probability assignment.

  Ultimately, Harsanyi does not derive utilitarianism from thin rationality. He derives it from rationality plus specific, contestable normative commitments: that social choice should mirror individual risk choice (rejecting Diamond), and that identity probabilities are fixed by population size (struggling with Average vs. Total). The debate is not resolved; it is relocated from moral philosophy to the philosophy of rational choice. Dev is correct that accepting EU leads to utilitarianism, but incorrect that accepting EU is morally neutral.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Distinction Between IO and Aggregation Theorems (4 Marks)**
  *   **A (4):** Clearly distinguishes IO (moral justification via veil/equiprobability) from Aggregation (Pareto + EU implies linear weighting). Notes they rely on different premises.
  *   **B (2.5):** States both exist but treats them as the same argument or conflates the veil of ignorance with the Pareto condition.
  *   *Common Fumble:* Students claim the Aggregation theorem uses the veil of ignorance.

  **2. Presuppositions vs. Derivations (The "Circularity" Objection) (4 Marks)**
  *   **A (4):** Distinguishes the "lazy" objection (theorem assumes conclusion) from the "real" objection (EU axioms contain normative content). Argues Harsanyi relocates moral debate to rationality axioms.
  *   **B (2.5):** Repeats the lazy objection that Harsanyi "assumes utilitarianism" without analyzing the EU axioms, or accepts Dev's view that EU is purely instrumental.
  *   *Common Fumble:* Students write "It's circular because he assumes W = Sum(U)" without mentioning Expected Utility axioms.

  **3. Diamond's Fairness Example (4 Marks)**
  *   **A (4):** Describes the coin-flip scenario correctly. Identifies it as a challenge to the *Independence axiom* in social lotteries (ex-ante fairness vs. ex-post utility), not just a preference for equality.
  *   **B (2.5):** Describes the example but frames it merely as "Diamond likes equality more than Harsanyi," missing the axiomatic critique of EU in social contexts.
  *   *Common Fumble:* Students think Diamond is arguing for equal outcomes rather than equal chances.

  **4. Variable Population (Average vs. Total) (4 Marks)**
  *   **A (4):** Explains how equiprobability ($1/N$) links the IO argument to Average Utilitarianism. Notes the tension this creates with Total Utilitarianism when $N$ varies (population ethics).
  *   **B (2.5):** Mentions population size matters but fails to connect the $1/N$ probability to the Average/Total distinction or claims Harsanyi solves this.
  *   *Common Fumble:* Students assume Harsanyi's theorem holds regardless of whether population size changes.

  **5. Conclusion on Rationality vs. Morality (4 Marks)**
  *   **A (4):** Concludes that Harsanyi reduces morality to rationality only by loading normative content into rationality. Synthesizes Diamond/Population points to support this.
  *   **B (2.5):** Concludes vaguely that "both sides have points" or definitively sides with Dev without qualifying the normative cost of EU.
  *   *Common Fumble:* Students end by simply restating the introduction without synthesizing the critiques.
