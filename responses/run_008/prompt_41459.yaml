          *   *Move 3:* Maya's "kind" argument is weak. $n^{1000}$ is the same *kind* of function as $n^2$ mathematically, but phenomenologically different.
          *   *Move 4:* Dev is strongest here. Feasibility is the philosophical pivot, not complexity classes.
          *   *Move 5:* Maya's Sorites analogy is good, but she conflates "existence of a distinction" with "significance of the P=NP collapse."

