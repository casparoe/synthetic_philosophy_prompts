  9.  **Final Polish:** Check the "Joint Unsatisfiability" section carefully. This is the philosophical heart of the response. The tension is between *Objective Truth* (Systematicity) and *Pragmatic Selection* (Norms). If we choose Systematicity, we might have to admit *all* counterfactually dependent omissions are causes (Proliferation) OR we need a rigid rule that might contradict specific legal duties. Actually, the stronger tension is: To avoid proliferation, you need context. To have systematicity, you need context-independence. Hence, they clash.

