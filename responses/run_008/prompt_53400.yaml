answer: |-
  # Specification for a Theory of Omissive Causation in Accident Investigation

  ## 1. Preamble and Methodological Note

  You have asked for a specification of the desiderata that a theory of causation by omission must satisfy to be viable within the context of accident investigation. This is not merely a metaphysical exercise; it is an engineering constraint on a conceptual tool. A theory that is metaphysically pristine but operationally paralysing is useless here. Conversely, a theory that validates every intuitive hunch but collapses under logical scrutiny undermines the authority of the report.

  In drafting the following list, I have filtered candidate requirements through the specific cases you provided (the grandfathered rumble strip, the standby generator, the gardener) and the broader practices of epidemiology and tort. I have discarded requirements that are merely artefacts of specific metaphysical camps (e.g., a strict demand for physical transference of energy) in favour of those required for the *function* of an investigation report: explanation, prevention, and accountability.

  ## 2. The Desiderata List

  The following are the conditions an adequate account must meet. Each is marked as **Non-Negotiable** (the theory fails its purpose if this is not met) or **Camp-Relative** (metaphysically contestable, but acceptable if consistent).

  ### 2.1. The Discrimination Constraint (Omission vs. Background)
  **Requirement:** The theory must distinguish between an omission that causes an outcome and a mere background condition of non-occurrence. It must explain why the gardener's failure to water kills the flowers, while the stranger's failure to water does not, despite identical counterfactual dependence.
  **Motivating Consideration:** Without this, causal reports become infinite lists of everything that did not happen to stop the accident (e.g., "the asteroid that did not strike the vehicle").
  **Status:** **Non-Negotiable.**
  **Justification:** An investigation report that cannot distinguish a relevant failure from the infinite sea of non-events is operationally useless for assigning responsibility or recommending prevention.

  ### 2.2. The Normative Anchor
  **Requirement:** The theory must accommodate the intuition that the legitimacy of an omissive cause often relies on a norm, duty, expectation, or statistical normality. It must specify whether this normativity is part of the *causation* itself or a pragmatic filter applied *after* causation is established.
  **Motivating Consideration:** In the rumble strip case, the absence of a strip is only a candidate cause if there was an expectation (regulatory or engineering) that one should be there. If the road is grandfathered, the normative status changes, and the causal attribution should reflect that shift or explain why it remains constant.
  **Status:** **Non-Negotiable (Functional).**
  **Justification:** While pure metaphysicians often resist normativity in causation, accident investigation is inherently normative (concerned with deviations from safe operation). A purely descriptive account cannot recover the distinctions practitioners actually make.

  ### 2.3. Proliferation Control
  **Requirement:** The theory must prevent the "explosion" of causes. It cannot entail that the non-existence of a unicorn, or the failure of a distant government to pass a safety law ten years prior, is a cause of the local crash, even if counterfactual dependence holds.
  **Motivating Consideration:** If absences cause, everything that never happened is a candidate cause of nearly everything.
  **Status:** **Non-Negotiable.**
  **Justification:** Cognitive and practical limits require a finite set of causal factors for any report. A theory that validates infinite causes is indistinguishable from no theory at all.

  ### 2.4. Preemption and Overdetermination among Omissions
  **Requirement:** The theory must handle cases where multiple omissions occur, any one of which would have sufficed to prevent the outcome (e.g., two standby guards asleep). It must specify whether both are causes, or if one preempts the other.
  **Motivating Consideration:** In the two-guard scenario, if Guard A had woken, the alarm sounds. If Guard B had woken, the alarm sounds. Both slept. Did both cause the failure?
  **Status:** **Non-Negotiable.**
  **Justification:** Accident reports must be able to handle redundant safety failures. Collapsing these into a single cause obscures the depth of the systemic failure.

  ### 2.5. Double Prevention
  **Requirement:** The theory must take a stable stance on double prevention (A prevents B, B prevents C; A's removal allows B to prevent C). It must decide whether the removal of a preventer (an omission of support) counts as a cause equivalent to positive intervention.
  **Motivating Consideration:** In the data centre case, does the *lack* of a generator cause the loss, or does the power outage cause it, with the lack merely enabling? Epidemiology treats "failure to fortify" as a cause; mechanics often treat "loss of support" as a cause.
  **Status:** **Camp-Relative.**
  **Justification:** Metaphysicians dispute whether double prevention is genuine causation. However, for investigation, consistency is key. Whether you count it or not, you must treat like cases alike. I mark this camp-relative because a theory *could* exclude these and still function, provided it warns users of the exclusion.

  ### 2.6. Transitivity and Chained Omissions
  **Requirement:** The theory must specify whether causation by omission is transitive. If A's failure to hire B causes B's absence, which causes the inspection failure, which causes the crash, is A's failure a cause of the crash?
  **Motivating Consideration:** Liability often seeks to trace chains back to management decisions. Metaphysics often breaks transitivity to avoid spurious links.
  **Status:** **Non-Negotiable.**
  **Justification:** Investigation reports often need to trace root causes back to policy. If transitivity fails without clear boundaries, the report cannot identify root causes.

  ### 2.7. Fit with Legal and Epidemiological Usage
  **Requirement:** The theory should, *ceteris paribus*, align with standard causal claims in tort and public health (e.g., "failure to fence caused the drowning").
  **Motivating Consideration:** Investigation reports often feed into legal proceedings and insurance claims. Radical divergence creates confusion and undermines the report's authority.
  **Status:** **Camp-Relative.**
  **Justification:** While highly desirable, legal usage is often inconsistent or driven by policy rather than metaphysics. A theory might improve upon legal usage rather than mirror it.

  ## 3. The Impossibility Result: Systematicity vs. Selection

  You have asked me to determine whether a subset of these requirements is jointly unsatisfiable. Specifically, you highlight the tension between a **principled, non-arbitrary line** (Desiderata 2.1 & 2.3) and **systematic, context-insensitive causal claims** (the requirement that two investigators agree without deferring to salience).

  **Verdict:** These demands are **jointly unsatisfiable**.

  **The Argument:**
  To satisfy the **Discrimination Constraint** and **Proliferation Control**, you must introduce a selection principle. As established in Desideratum 2.2, this principle inevitably relies on norms, expectations, or context (e.g., the gardener has a duty, the stranger does not). However, norms and expectations are inherently context-sensitive. They vary depending on whether one adopts the perspective of the engineer, the operator, the regulator, or the lawyer.

  Therefore:
  1.  If you demand **Systematicity** (context-insensitivity), you must strip away the normative context. But without normative context, you cannot distinguish the gardener from the stranger (violating Discrimination). You are left with a plain counterfactual account where everything is a cause (violating Proliferation Control).
  2.  If you demand **Non-Arbitrary Selection** (solving Proliferation), you must import norms. But norms vary by context. Therefore, two investigators with different professional backgrounds (e.g., a human factors specialist vs. a civil engineer) may legitimately identify different omissive causes based on different normative frameworks. Systematicity (in the sense of context-invariant agreement) is lost.

  **What Has to Give:**
  You cannot have a theory that is both context-invariant *and* capable of filtering the infinite absences down to the relevant few without importing context-dependent norms.

  ## 4. The Cost of Your Preference

  You stated: *"If forced, I would sooner sacrifice fit with legal usage than systematicity."*

  This is a significant philosophical and practical commitment. Here is what that preference buys you, and what it costs.

  **What it Buys (The Gain):**
  By prioritising systematicity, you aim for a "View from Nowhere." You want the accident report to state causal facts that hold true regardless of who is reading them or what legal liabilities are at stake.
  1.  **Stability:** Two investigators, regardless of their legal or disciplinary background, should arrive at the same causal list.
  2.  **Safety Focus:** It decouples *safety learning* from *blame*. If the report identifies a causal omission that isn't legally actionable (e.g., a grandfathered road feature), the report can still recommend fixing it without needing to prove negligence. This aligns with "Just Culture" safety management systems.

  **What it Costs (The Loss):**
  1.  **Metaphysical Inflation:** To achieve context-insensitivity, you likely have to broaden the definition of cause. You may be forced to admit "enabling conditions" as "causes" to ensure the list is objective. This risks bloating the report with factors that, while technically causal, are not actionable.
  2.  **Legal Friction:** The report may conclude "The absence of the rumble strip caused the crash," while the court concludes "The absence of the rumble strip was not negligent." This creates a public relations risk. Stakeholders may view the investigation as out of touch if it identifies causes that the law explicitly excuses.
  3.  **The "Salience" Problem:** You cannot actually eliminate salience. By choosing a systematic theory (e.g., "all counterfactual dependencies are causes"), you are implicitly choosing a salience rule: *physical dependence is salient, normative duty is not.* This is not neutrality; it is a bias towards a mechanistic worldview.

  **Recommendation:**
  If you sacrifice legal fit for systematicity, you must explicitly reframe the purpose of the report. It is no longer a document establishing *liability*, but a document establishing *systemic vulnerability*. You must warn your workshop participants that "Cause" in this context does not mean "Liable Factor."

  ## 5. Scorecard of Contenders

  Here is how the three obvious theoretical contenders score against the desiderata, keeping the weight on the criteria established above.

  ### 5.1. Plain Counterfactual Dependence
  *The view: A caused B iff, had A not occurred, B would not have occurred.*
  *   **Discrimination (Gardener/Stranger):** **Fail.** Both satisfy counterfactual dependence. Cannot distinguish cause from background.
  *   **Proliferation:** **Fail.** Admits infinite causes (the non-arrival of the meteor).
  *   **Systematicity:** **Pass.** Highly context-insensitive.
  *   **Legal Fit:** **Fail.** Contradicts tort law's requirement of duty.
  *   **Verdict:** Unsuitable for accident investigation without heavy pragmatic modification.

  ### 5.2. Norm-Involving Accounts
  *The view: An omission is a cause only if it violates a norm, duty, or statistical expectation.*
  *   **Discrimination (Gardener/Stranger):** **Pass.** Gardener has a duty; stranger does not.
  *   **Proliferation:** **Pass.** Norms filter out irrelevant absences.
  *   **Systematicity:** **Fail.** Norms are context-dependent. Investigators may disagree on which norms apply (e.g., was the road expected to meet new standards?).
  *   **Legal Fit:** **Pass.** Aligns well with negligence and liability.
  *   **Verdict:** Best for legal alignment, but risks disagreement between investigators from different disciplines.

  ### 5.3. Causal Model Approaches (Structural Equation Models)
  *The view: Causation is defined by dependencies within a formal model where omissions are represented as variables taking default values.*
  *   **Discrimination (Gardener/Stranger):** **Pass (Conditional).** Distinguishes based on how the model is constructed (which variables are included).
  *   **Proliferation:** **Pass.** The model boundary limits the variables.
  *   **Systematicity:** **Mixed.** The *logic* is systematic, but the *model construction* is subjective. Two investigators might build different models.
  *   **Legal Fit:** **Pass.** Can encode duties as constraints within the model.
  *   **Verdict:** The strongest contender, provided you acknowledge that *model selection* is the normative step, not the causal calculation itself.

  ## 6. Final Conclusion

  You cannot have a theory of omissive causation that is both context-invariant and capable of filtering irrelevant absences. The "principled line" you seek is not found in the metaphysics of the omission itself, but in the **conventions of model construction**.

  If you prioritise systematicity over legal fit, I recommend adopting a **Causal Model Approach** but explicitly codifying the rules for variable selection as part of the investigation protocol. Do not pretend the model reveals "The Truth." Admit that the model reveals "The System's Vulnerabilities given these Boundaries." This sacrifices the claim to metaphysical finality but preserves the utility of the report for safety improvement, which, in the long run, serves the public better than a report designed primarily to survive cross-examination.
