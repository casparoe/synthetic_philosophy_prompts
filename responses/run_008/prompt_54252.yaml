  0.75

  **Decomposition of Reasoning**

  1.  **Expected Marginal Harm (0.70):** While markets appear smooth, supply chains and ecological systems operate on discrete thresholds (e.g., ordering containers, tipping points), making the probability of being the causal trigger non-zero even if epistemically hidden.
  2.  **Complicity vs. Outcome (0.85):** Moral responsibility is robustly modeled as participation in a harmful practice (complicity) rather than sole causal efficacy, grounding obligation even when individual impact is negligible.
  3.  **Integrity/Universalizability (0.65):** Arguments from integrity or rule-utilitarianism carry weight but are philosophically contested as potentially collapsing into consequentialism or lacking binding force without causal leverage.
  4.  **Domain Uniformity (0.60):** The obligation is less uniform across domains; voting involves distinct collective action problems compared to market signals (meat/climate), weakening a single universal claim.
  5.  **Cost-Benefit Constraint (0.90):** The condition that refraining comes at "small personal cost" significantly strengthens the obligation, as moral demands are widely accepted when sacrifices are trivial relative to collective harm.

  **Combination Logic**
  I calculate the final credence as a weighted average of these terms, reflecting their relative importance to the overall truth of the claim. Weights are assigned as: Marginal Harm (0.25), Complicity (0.25), Integrity (0.15), Domain Uniformity (0.15), and Cost Constraint (0.20).
  Calculation: $(0.70 \times 0.25) + (0.85 \times 0.25) + (0.65 \times 0.15) + (0.60 \times 0.15) + (0.90 \times 0.20) = 0.175 + 0.2125 + 0.0975 + 0.09 + 0.18 = 0.755 \approx 0.75$.

  **Sensitivity Analysis**
  The final number is most sensitive to **Expected Marginal Harm**. If philosophical or empirical analysis proves that large-scale systems are truly smooth functions with no discrete thresholds (probability drops from 0.70 to 0.40), the consequentialist foundation collapses, reducing the final credence to approximately 0.68 and forcing total reliance on non-causal theories like complicity.

  **Engineering Analogy Breakdown**
  Your distributed-systems analogy misleads because it treats actions as purely instrumental signals, whereas moral actions have **constitutive and expressive value**. In your system, a write operation has no meaning beyond its effect on state; in ethics, the act itself constitutes your character and expresses values to others, creating normative feedback loops (shame, trust, norm-setting) that have no counterpart in packet switching or database latency.
