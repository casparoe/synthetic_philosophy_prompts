answer: |-
  The debate over the ontological status of "features" in neural networks strikes at the heart of mechanistic interpretability. When researchers identify a direction in a model's activation space corresponding to "sentiment," "code context," or "French language," are they uncovering the natural kinds of machine cognition, or are they projecting human categories onto a mathematical substrate that admits no such carving? This dispute divides realists, who view features as discoveries of internal structure, from instrumentalists, who view them as convenient fictions. To resolve this, we must weigh the mathematical underdetermination of activation spaces against the empirical success of causal interventions, while distinguishing between information that is merely present and information that is computationally used.

  The strongest argument for instrumentalism arises from the underdetermination worry. Mathematically, any activation vector in a high-dimensional space can be decomposed into an infinite number of bases. If a residual stream vector $v$ represents a model's state, there is no unique set of directions $\{d_1, d_2, ...\}$ such that $v = \sum c_i d_i$. Researchers privilege sparse, human-legible decompositions—often found via Sparse Autoencoders (SAEs)—because they align with our cognitive preferences for discrete concepts. The instrumentalist argues that this preference is anthropocentric. The network operates on linear algebra, not semantics; imposing a "French" direction is akin to drawing constellations in the stars. The patterns are visible, but the connections are imposed by the observer, not the geometry itself. If the network's computation is rotationally invariant in certain subspaces, then selecting one orthogonal basis over another is arbitrary, suggesting features are descriptive tools rather than ontological primitives.

  However, the probe-versus-use problem complicates the instrumentalist's reliance on mere discoverability. It is well-established that linear probes can decode information from activation layers that the network does not subsequently use to generate outputs. Information can be present in the residual stream as a byproduct of earlier computation without playing a causal role in later stages. If "features" were defined solely by the ability of an external observer to train a probe that reads them out, instrumentalism would hold significant sway; we could find "features" for almost anything correlated with the input. But this sets up a straw man of realism. A sophisticated realist does not claim that every decodable direction is a feature. Instead, the probe-versus-use problem suggests that discoverability is necessary but not sufficient. It forces a distinction between "informational features" (statistical correlations) and "mechanistic features" (variables actively used in the computation). This distinction weakens the claim that all interpretability findings are fictions, implying instead that some are merely superficial readings of a deeper structure.

  That deeper structure is revealed by causal evidence, the realist's strongest asset. Interventions such as activation steering and ablations demonstrate that manipulating specific feature directions produces coherent, predictable changes in model behavior. If adding a vector $v_{French}$ to the residual stream causes the model to complete text in French, $v_{French}$ is not merely a descriptive label; it is a control knob that interfaces with the model's machinery. Instrumentalism struggles to explain why these specific "fictional" directions yield such robust causal leverage while arbitrary rotations of the basis do not. If the decomposition were truly arbitrary, interventions along these directions should result in noise or unpredictable degradation. The fact that they function as semantic levers suggests that the network's weights are tuned to respond to these specific directions. The causal efficacy implies that the network itself "cares" about this basis, breaking the rotational symmetry that underdetermination relies upon.

  Therefore, the verdict depends on refining what we mean by "present." Features are not present in the way that electrons are present in an atom—intrinsic properties independent of function. Rather, they are real insofar as they occupy nodes in the causal graph of the model's computation. The underdetermination worry is resolved by noting that while mathematical decomposition is arbitrary, computational decomposition is not. The training process selects a specific basis that minimizes loss, and causal interventions reveal which basis the network actually utilizes. Consequently, we must reject naive realism that equates probe accuracy with reality, but also reject instrumentalism that dismisses causally efficacious directions as mere fictions. We should adopt a position where features are real only when they satisfy causal criteria, acknowledging that many proposed features may indeed be instrumental artifacts while maintaining that a core subset reflects genuine mechanistic structure.

  Verdict: qualified realist
