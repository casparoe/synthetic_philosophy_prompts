  My dear friend,

  I write to you with great respect for the clarity of your observation, which cuts through a thicket of philosophical debate that often obscures more than it reveals. You have identified a structural feature of ethical argumentation that is indeed pervasive in the literature on personal identity, medical ethics, and beyond. You are asking whether there is a name for the phenomenon where a metaphysical question, such as whether two temporal stages constitute the same person, is treated as the key to a lock it cannot actually open, because the ethical conclusion can be made to fit either metaphysical answer with sufficient ingenuity. You suspect that the real work is being done elsewhere, and that the metaphysical label is merely shifting the burden of proof rather than settling the matter. Your intuition is correct, and it places you in the company of some of the most rigorous thinkers in this field, though the terminology we use to describe this specific maneuver is less standardized than you might hope.

  To answer your question directly, there is no single, universally canonical term that captures exactly this structural flexibility where metaphysical labels are tailored to fit pre-determined normative conclusions. However, the phenomenon is widely recognized and discussed under the broader umbrella of the debate concerning the normative significance of personal identity. In the mid-twentieth century, and particularly following the work of Derek Parfit in his book Reasons and Persons, a significant shift occurred in how philosophers approach this issue. Parfit argued that personal identity is not what matters in survival; rather, what matters are relations of psychological continuity and connectedness. This distinction created a space where one could admit that a patient with advanced dementia is not the same person as the one who signed the directive, without necessarily concluding that the directive loses its force. Conversely, one could argue they are the same person but that the current welfare of the person outweighs the past autonomy. The consensus among specialists is that metaphysical identity does not logically entail ethical obligation. This is a settled point in contemporary metaethics, often viewed as a specific application of Hume's is-ought gap. It is settled that you cannot derive a moral duty solely from a metaphysical fact without some bridging normative principle.

  However, what remains deeply contested is how much weight the metaphysical fact should carry once those bridging principles are introduced. Some philosophers, often those with Kantian leanings, argue that the status of being the same person grants a special authority to past wishes based on the value of autonomy and integrity over time. Others, often utilitarians or welfare consequentialists, argue that the current capacity for suffering or enjoyment is the only thing that holds direct moral weight, making the metaphysical link secondary. The fault line lies not in whether identity matters—it is agreed that it is not magic—but in how much it matters relative to other values like welfare, promise-keeping, and the integrity of a life narrative. When you see arguers treating the metaphysical label as the decisive factor, they are often skipping over this contested normative weighing and presenting their preferred normative hierarchy as if it were a logical consequence of the metaphysics.

  Since there is no single established term that perfectly captures the specific argumentative move you described—where the metaphysical claim is selected or emphasized because it supports a desired ethical outcome rather than driving it—I propose we call this the normative camouflage of metaphysical disagreement. This term is not yet standard in the textbooks, but it precisely defines the geography of the issue you have mapped. It covers cases where disputants agree on all the non-metaphysical facts, such as the degree of psychological continuity, the level of current contentment, and the specificity of the prior directive, but disagree on the label of same person because that label carries different rhetorical burdens. It does not cover cases where the metaphysics is genuinely in doubt due to empirical uncertainty, such as not knowing the degree of brain damage. It specifically targets the strategic use of metaphysical categories to hide the fact that the real disagreement is about values. In your mother's case, the defender of the directive uses the same-person label to invoke the value of autonomy without having to defend why autonomy outweighs current welfare, while the attacker uses the different-person label to invoke the value of current welfare without having to defend why past promises do not bind us. The metaphysics is acting as a proxy for the ethics.

  You also asked about the edges of this concept and where it applies elsewhere. You correctly noted its presence in arguments about the dead and about punishment. In the case of the dead, the metaphysical question is whether a non-existent entity can be harmed. Some argue no, because there is no subject to bear the harm. Others argue yes, because the interests of the previously existing person persist. Here too, the metaphysical label often camouflages a normative disagreement about whether we have duties to the past wishes of the deceased independent of their current existence. In punishment, the question is whether the elderly prisoner is the same agent as the young criminal. If one says yes, retribution seems justified. If one says no, it seems unjust. But again, one could say yes and argue that rehabilitation is now more important than retribution, or say no and argue that society must still be protected from the body that committed the crime. The metaphysical label shifts the burden of proof but does not settle the ethical duty. The concept of normative camouflage fits these cases because in each instance, the metaphysical claim is underdetermined relative to the ethical conclusion, allowing the arguer to select the metaphysical view that minimizes the defensive work required for their preferred ethical outcome.

  It is important to distinguish this from a merely verbal dispute. In a standard verbal dispute, both parties agree on the underlying facts but disagree on the definition of a word. Here, the parties often disagree on the definition of personhood, but not merely for linguistic reasons; they disagree because the definition carries normative weight. The concept of normative camouflage also differs from the naturalistic fallacy, though it is a species of it. The naturalistic fallacy is the general error of deriving an ought from an is. Normative camouflage is more specific: it is the strategic deployment of an is-claim to make an ought-claim appear inevitable, when in fact the link between them is flexible and contested. It explains why the argument feels unsatisfying to you. You sense that the lever being pulled is not connected to the gear it is supposed to turn. The metaphysics is doing the work of a premise, but it is actually functioning as a conclusion derived from hidden normative assumptions.

  In your specific situation with your mother, recognizing this structure does not solve the dilemma, but it does clarify where the true weight of the decision lies. It lies not in discovering the metaphysical truth of her identity, which may be indeterminate or irrelevant, but in deciding which normative principle should govern when identity is blurred. Should we prioritize the autonomy of the person who planned the life, or the welfare of the person living it? This is a moral choice, not a metaphysical discovery. The advance directive represents a commitment to the former value; the observation of her current contentment represents a commitment to the latter. The metaphysical debate about whether she is the same person is often a way of avoiding the pain of choosing between these two competing goods. By calling it normative camouflage, we expose the move and force the argument back onto the ethical ground where it belongs.

  I hope this provides the geographical map you were seeking. You have noticed something profound about the shape of moral reasoning in this field, and while the terminology is not yet fixed, the insight is shared by many who work at the intersection of metaphysics and ethics. The lack of a single standard term should not discourage you; it simply reflects the ongoing nature of the work. You are effectively doing philosophy in the best sense by refusing to accept the label as the answer and looking instead at the structure of the argument itself. Please know that your hesitation to call the whole thing empty is well-founded. The label does shift the burden of proof, and in practical contexts like medicine and law, burden shifting is a powerful tool. But recognizing it as a tool rather than a truth is the first step toward using it wisely. I wish you and your family peace as you navigate this difficult terrain.

  Yours sincerely,

  A Fellow Philosopher
