answer: |-
  ### Deliverable 1: The Exam Question

  **Final Examination: Aesthetics Seminar**
  **Topic:** Hume, "Of the Standard of Taste"
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,500 words maximum

  **Essay Question**

  In "Of the Standard of Taste," Hume seeks to resolve the tension between the subjectivity of sentiment and the apparent objectivity of artistic value. To evaluate his success, you must distinguish between two types of standards.

  Consider the old platinum-iridium bar kept at Sèvres, which once defined the metre. Something was one metre long *if and only if* it matched the bar. The bar could not be wrong about the metre; it fixed the fact rather than tracking it. This is a **constitutive standard**. By contrast, consider a well-calibrated thermometer. The temperature of a room exists independently of the instrument; the thermometer is a reliable indicator that can err, be corrected, or be compared against rivals. This is an **epistemic standard**. A constitutive standard makes a verdict infallible by definition; an epistemic standard makes a verdict defeasible but creditable because it points at something beyond itself.

  Write an essay arguing whether Hume's joint verdict of qualified judges functions as a constitutive standard or an epistemic standard. You may argue that he slides between the two, but you must state clearly what hangs on this choice for the objectivity of beauty. If the verdict is constitutive, beauty is defined by approval, and objectivity is secured by stipulation. If it is epistemic, beauty is an independent fact, and Hume owes an account of that fact which his sentiment-based metaphysics makes difficult to discharge.

  **In addressing this question, you must explicitly do the following:**

  1.  **Analyze Convergence:** Treat Hume's remark about the poet admired in the ancient world and modern capitals as an empirical claim about durable agreement. Explain what it would show about the standard if a work admired for centuries were to fall permanently out of favor. Does this refute the standard, reveal the earlier judges were unqualified, or show the standard is constitutive and beauty changed with human nature?
  2.  **Address Circularity:** Hume identifies qualified judges partly through their verdicts on works we antecedently admire, yet vindicates those works by the verdicts of qualified judges. Is this circle vicious? Do the independently stateable marks of the true judge (delicacy, practice, comparison, freedom from prejudice, good sense) break this circle or merely relocate it?
  3.  **Distinguish Taste from Beauty:** Take seriously the essay's title, "Of the Standard of *Taste*." Address whether whatever objectivity is won attaches to the verdicts of critics rather than to the works themselves. Is this objectivity about beauty at all, or merely intersubjective convergence dressed up?

  *Note: You will receive no credit for merely reciting the five marks of the true judge, summarizing the opening concession that "all sentiment is right," or repeating the Ogilby vs. Milton comparison without analyzing the metaphysical implications of the standard.*

  ***

  ### Deliverable 2: Model Answer

  **Title:** The Thermometer and the Bar: Hume's Sliding Standard

  Hume attempts to secure an epistemic standard of taste while relying on a constitutive mechanism to protect it. He wants beauty to be a fact about objects—"certain qualities in objects fitted by nature to produce pleasurable feelings"—which implies an epistemic standard where critics track independent properties like thermometers track heat. However, because his metaphysics grounds value in human sentiment, he ultimately collapses into a constitutive standard where the joint verdict of critics defines beauty like the Sèvres bar defined the metre. This slide saves the authority of the critic but sacrifices the mind-independent objectivity of beauty.

  Regarding empirical convergence, Hume cites the endurance of Homer and Virgil as proof that the standard tracks a stable human nature. This functions as an epistemic prediction: if beauty is a real fit between object and nature, agreement should persist across time. However, if a work admired for centuries were to fall permanently out of favor, Hume's system faces a crisis. If the standard is epistemic, this reversal suggests we were wrong about the work's value; the fact remained, but our access failed. Yet Hume cannot easily admit this without positing beauty as distinct from sentiment. If the standard is constitutive, the reversal implies the work is no longer beautiful because the relevant human nature has shifted. Hume treats the standard as epistemic when praising classics but protects it constitutively against counterexamples by claiming the dissenters lack delicacy or are prejudiced. This insulation makes the standard unfalsifiable, revealing its constitutive core.

  This protectionism exacerbates the circularity of Hume's procedure. We identify true judges by their appreciation of great works, and we identify great works by the appreciation of true judges. Hume attempts to break this circle with the five marks of the true judge, which appear to be independently stateable epistemic virtues. However, these marks do not fully break the circle; they relocate it. "Good sense" and "freedom from prejudice" are not neutral metrics like the calibration of a thermometer; they are normative traits defined by their alignment with established aesthetic norms. We recognize "good sense" in a critic largely because they agree with us about Milton. Thus, the circle remains vicious for an epistemic reading: the criteria for tracking the fact are themselves derived from the verdicts they are supposed to validate.

  Consequently, the objectivity Hume secures attaches to the verdicts of critics rather than the works themselves, honoring the title "Standard of Taste" rather than "Standard of Beauty." If the joint verdict is constitutive, there is no beauty beyond the agreement of qualified observers. This yields intersubjective convergence, not ontological objectivity. Hume successfully demonstrates that we can normatively regulate sentiment and achieve stable agreement among ideal observers. However, by making the verdict constitutive of the value, he concedes that beauty is not a property waiting to be discovered in the object. He offers a standard for correcting taste, but he does not, and cannot given his empiricism, provide a standard that tracks a mind-independent fact. The objectivity won is social and procedural, not metaphysical.

  ***

  ### Deliverable 3: Marking Scheme

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  **1. Application of the Constitutive/Epistemic Distinction (4 marks)**
  *   **Criteria:** Clearly defines the distinction using the prompt's analogy and applies it to Hume's joint verdict. Takes a definite stance on which Hume employs (or argues he slides).
  *   **Common Error:** Treats the distinction as a mere vocabulary list without applying it to the metaphysics of Hume's argument.

  **2. Analysis of Empirical Convergence and Reversal (4 marks)**
  *   **Criteria:** Addresses the hypothetical scenario of a classic falling out of favor. Explains the implications for the standard (refutation vs. disqualification vs. constitutive change).
  *   **Common Error:** Merely summarizes Hume's Milton/Ogilby example without engaging the hypothetical reversal requested.

  **3. Evaluation of Circularity and the Five Marks (4 marks)**
  *   **Criteria:** Identifies the circle (judges/works) and assesses whether the five marks break it or relocate it. Avoids simply listing the marks.
  *   **Common Error:** Recites the five marks as a solution without analyzing why they might fail to break the logical circle.

  **4. Distinction Between Taste (Verdict) and Beauty (Object) (4 marks)**
  *   **Criteria:** Addresses the essay title. Distinguishes between objectivity of agreement (intersubjective) and objectivity of property (mind-independent).
  *   **Common Error:** Assumes "Standard of Taste" is synonymous with "Standard of Beauty" without noting the shift in locus.

  **5. Coherence and Definite Position (4 marks)**
  *   **Criteria:** Essay maintains a clear thesis throughout. Arguments support the conclusion without contradicting earlier claims.
  *   **Common Error:** Hedges excessively ("On the one hand... on the other...") without resolving the tension or stating a final view.

  **Differentiation: A Answer vs. B Answer**
  A **B-level answer** will successfully check the five boxes above, correctly defining the distinction and addressing the three required points with accurate textual reference. It will demonstrate comprehension of the essay's arguments. An **A-level answer**, however, will identify the *consequence* of the choice between constitutive and epistemic standards. Specifically, the A answer will recognize that if Hume chooses the constitutive route to save the authority of critics, he necessarily abandons the realist intuition that beauty is "in the object," whereas if he chooses the epistemic route, he cannot explain what the "fact" of beauty is without contradicting his sentiment-based metaphysics. The A answer sees that Hume's solution is a compromise that solves the normative problem (how to argue) at the expense of the metaphysical problem (what beauty is).
