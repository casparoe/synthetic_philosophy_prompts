answer: |-
  My all-things-considered credence that both halves of the strong procreation asymmetry are true is **0.28**.

  While the intuition behind half (i) is robust, the theoretical machinery required to sustain half (ii) without collapsing into incoherence or unacceptable implications is fragile. Below is the decomposition of that number.

  ### Decomposition

  1.  **Probability that a person-affecting constraint (PAC) on moral reasons is correct:** **0.45**
      *   *Justification:* While PAC aligns with the intuition that morality is about helping or harming specific subjects, it notoriously fails to handle non-identity cases without ad-hoc modifications that weaken its foundational appeal.

  2.  **Probability that the asymmetry survives the extinction test (painless extinction is morally neutral):** **0.35**
      *   *Justification:* I treat the permanent loss of all future value as a tragedy rather than a neutrality, making this implication a significant Bayesian update against the view.

  3.  **Probability that the *de re*/*de dicto* switching is an artifact of framing rather than a fatal flaw:** **0.30**
      *   *Justification:* It is theoretically costly to ground the badness of suffering in Case C impersonally while refusing to ground the goodness of happiness in Case B the same way.

  4.  **Probability that the intuition condemning the creation of suffering (half (i)) is reliable:** **0.90**
      *   *Justification:* Almost every ethical framework, including total utilitarianism, agrees that creating a miserable life is wrong, so this half does not drive down my credence.

  ### Combination and Driving Term

  I combine these not as a strict product, but as a weighted constraint satisfaction problem. The high reliability of half (i) (0.90) keeps the view from collapsing to zero, but the theoretical requirements for half (ii) act as multiplicative bottlenecks. If the Person-Affecting Constraint is false, the asymmetry loses its primary ground; if the Extinction Test fails, the view is pragmatically rejected; if the *de re*/*de dicto* distinction is fatal, the view is logically inconsistent.

  The term that drives my final number is **Term 2 (The Extinction Test)**. Even if I grant the Person-Affecting Constraint (Term 1), the implication that a painless end to humanity is no worse than a flourishing future is a reductio for me. This single implication caps my credence, because a moral theory that cannot distinguish between a universe of flourishing and a void is failing to track value.

  ### Diagnosis of Your Disagreement

  You ask whether the disagreement between you (0.4) and your friend (0.85) is about the extinction test or something upstream. My diagnosis is that it is **upstream**, specifically regarding **Term 1 (The Person-Affecting Constraint)**.

  Your friend's credence of 0.85 suggests she is not merely "biting the bullet" on extinction; she likely operates within a metaethical framework (such as contractualism or a specific rights-based view) where the Person-Affecting Constraint is not just plausible but near-certain. In those frameworks, the extinction test is not a reductio but a correct feature: if there is no one to complain, there is no wrong.

  Your resistance at 0.4 suggests you sense the fragility of that upstream constraint. You are likely treating the Person-Affecting Constraint as a heuristic rather than a law. The extinction test is merely the place where your upstream skepticism becomes visible. You are not disagreeing about the *implication* of the asymmetry; you are disagreeing about the *authority* of the person-affecting principle that necessitates it. She sees the principle as foundational; you see it as provisional.
