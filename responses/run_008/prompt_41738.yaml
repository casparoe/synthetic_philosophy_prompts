answer: |-
  You are asking for a functional tool rather than a metaphysical truth, which shifts the burden from describing the universe to navigating it without losing money or sanity. Since the goal is decision-making for an agent who cannot run experiments on the multiverse, the criteria must prioritize coherence in betting and action over cosmological elegance. The first non-negotiable desideratum is empirical modesty, driven by the Presumptuous Philosopher case. You should not be able to deduce that the universe is vast merely because you exist. If a principle implies that your existence alone confirms theories with vastly more observers over theories with fewer, regardless of physical evidence, it grants you a magical insight into cosmology that no single agent should possess. For a pragmatic agent, this is a failure condition because it disconnects belief from empirical traction. We must treat this as non-negotiable because a principle that allows you to bet your life on the size of the universe based solely on indexical evidence is unsafe for decision-making.

  The second desideratum is decision-theoretic coherence, which brings us to Sleeping Beauty. Here the distinction between halfer and thirder is not about labels but about betting odds. If you are offered a bet every time you wake up, the principle must guide you to accept bets that yield positive expected value across the experiment. A principle that leads you to reject a winning bet series because it undervalues the probability of being in the higher-frequency awakening is flawed for your stated purpose. This is non-negotiable for a decision-making principle because the point of probability in this context is to guide action. If the principle tells you to bet as if the coin landed heads when the payoff structure rewards betting on tails due to the number of opportunities, the principle is broken. However, you must be aware that satisfying this often conflicts with empirical modesty.

  The third desideratum is causal neutrality, derived from the Adam and Eve case. The principle must not imply that your current choices can probabilistically influence past events regarding your own existence, unless there is a causal mechanism. If the reasoning suggests that you can make it more likely that your ancestors conceived you by planning to perform a certain action now, the principle violates basic causal structure. This is non-negotiable because it undermines the temporal logic required for planning. A decision principle that allows backward causation via observer selection effects renders standard planning incoherent. You need a principle that treats your existence as a fixed precondition for your decisions, not as a variable your decisions can manipulate retroactively.

  The fourth desideratum concerns reference class stability, which is where your Backup Clerk case becomes critical. In this scenario, you exist as an applicant in both worlds, and you exist as a hire in both worlds, but the total number of hires differs. The principle must determine whether the relevant reference class is applicants or hires without smuggling in the answer via a prior assumption. If the principle says the update toward the million-clerk world depends solely on being hired, it treats you as a random sample from hires. If it says the application screens off the update because you were in the pool in both cases, it treats you as a random sample from applicants. The desideratum is that the principle must derive the correct reference class from the causal structure of the hiring process itself. For instance, if the hiring process selects from applicants, and you know you applied, the principle should clarify whether the anthropic weight comes from the selection into the hire pool or the existence in the applicant pool. This is a preference for clarity rather than a hard constraint, but it is essential for the principle to be usable without arbitrary manual tuning.

  The fifth desideratum is the avoidance of the Doomsday Argument. Many agents find it unacceptable that a principle should imply the human race is likely to go extinct soon simply because you find yourself alive now rather than later in the timeline. While some argue this is a valid Bayesian update, for a decision-making agent, a principle that forces a pessimistic prior on the future of your civilization based solely on your birth rank is often practically paralyzing. I must flag this as a camp preference rather than a non-negotiable constraint, because avoiding Doomsday usually requires accepting the Presumptuous Philosopher conclusion. This leads me to the most important part of this specification, which is the incompatibility result. You need to know plainly that satisfying empirical modesty and decision-theoretic coherence while also avoiding the Doomsday Argument is jointly unsatisfiable under standard Bayesian updating. You cannot have a principle that refuses to infer a large universe from your existence, refuses to infer early doom from your birth rank, and still obeys standard probability laws regarding self-location. Something has to give. Usually, you must choose between accepting Doomsday to save modesty or accepting Presumptuousness to save the future.

  Given this tension, here is how the standard principles score against your list. The Self-Sampling Assumption performs well on empirical modesty and avoids the Presumptuous Philosopher, and it maintains causal neutrality. However, it fails decision-theoretic coherence in Sleeping Beauty scenarios where betting frequencies matter, and it inevitably yields the Doomsday Argument, which you may find undesirable. It also struggles with the Backup Clerk case by favoring the single-clerk world simply because you are less likely to be you in a crowd, which might contradict the intuition that the application process should screen off the indexical noise. The Self-Indication Assumption performs well on decision-theoretic coherence, aligning with the thirder betting odds, and it avoids the Doomsday Argument. However, it fails empirical modesty spectacularly by endorsing the Presumptuous Philosopher, allowing you to infer cosmological facts from your existence alone. It also risks causal neutrality in Adam and Eve style cases unless carefully constrained. Neither principle satisfies all your desiderata because the desiderata themselves contain a hidden contradiction regarding how much weight existence itself should carry. For your purpose of decision-making without cosmological arrogance, you likely need a hybrid approach or a decision-theoretic framework like Updateless Decision Theory that bypasses the belief update entirely, though that comes with its own complexity costs.
