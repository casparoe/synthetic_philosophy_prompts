answer: |-
  # EMERGENCY ETHICAL DECISION PROTOCOL (EEDP)
  **Version 1.0 | For Field Team Leaders | Time Limit: 15 Minutes**

  ## PART 1: THE ETHICAL COMMITMENT
  **Read this before starting the steps.**

  This agency adopts a position of **Threshold Deontology**.
  *   **What this means:** We have strict moral rules (constraints) that forbid harming specific individuals to help others. We do not treat people as numbers.
  *   **The Threshold:** However, we acknowledge that in extreme emergencies, sticking to the rules can cause a disaster so large it outweighs the rule itself. In those specific cases, the rule may be overridden.
  *   **The Cost:** This means we accept that sometimes we must do a "wrong" thing to prevent a "catastrophic" thing. We do not pretend this is clean. We record it, we own it, and we accept the moral burden.
  *   **The Blind Spot:** A strict Deontologist will argue this protocol permits murder when the stakes are high enough. A strict Consequentialist will argue the threshold is too vague and risks hesitation. We accept both criticisms to remain operational in the real world.

  ---

  ## PART 2: THE PROCEDURE

  **Conditions:** Use this only when time is critical, lives are at immediate risk, and no senior management is reachable. You need one colleague (witness) and a satellite phone (to record the decision).

  ### STEP 1: CLASSIFY THE HARM (3 Minutes)
  *Goal: Determine what kind of moral line you are crossing.*

  Look at the action you are considering. Answer **A** or **B**.

  **A. Side-Effect Harm (Collateral)**
  *   **Definition:** You are trying to save people, and harm to others is an unfortunate, foreseen consequence, but not your method.
  *   **Examples:** Diverting food (Camp A starves so Camp B survives); Triage (switching off generators for stable patients to save blast victims).
  *   **Instruction:** If **A**, proceed to Step 2. The threshold for action is **LOWER**.

  **B. Means Harm (Instrumental)**
  *   **Definition:** You are using the harm to specific people *as the tool* to save the others. The harm is the price of admission.
  *   **Examples:** Handing over names (these three die *so that* the town lives); Hiring militia (their pay funds attacks *so that* your convoy moves).
  *   **Instruction:** If **B**, proceed to Step 2. The threshold for action is **MUCH HIGHER**.

  *(Note: Do not discard this distinction. It determines how heavy the burden of proof is in Step 3.)*

  ### STEP 2: THE ABSOLUTE VETO CHECK (2 Minutes)
  *Goal: Filter out actions that destroy the agency's existence.*

  Ask: **Does this action involve direct sexual violence, torture, or our staff pulling a trigger to kill a non-combatant?**
  *   **YES:** **STOP.** Do not do it. No threshold overrides this. This ends our mandate.
  *   **NO:** Proceed to Step 3.

  *(Note: This is the only "Absolute." Everything else is Thresholded.)*

  ### STEP 3: THE THRESHOLD CALCULATION (5 Minutes)
  *Goal: Determine if the stakes are high enough to break the rule.*

  You must estimate two things: **Scale** and **Certainty**.

  **1. Scale (The Ratio)**
  *   **If Step 1 was A (Side-Effect):** The lives saved must be clearly greater than the lives harmed.
      *   *Rule of Thumb:* At least **5 lives saved for every 1 life lost/risked**.
  *   **If Step 1 was B (Means):** The lives saved must be catastrophic compared to the harm.
      *   *Rule of Thumb:* At least **50 lives saved for every 1 life harmed**, OR the prevention of a **massacre** (e.g., destruction of a whole neighbourhood).

  **2. Certainty (The Probability)**
  *   **High Certainty:** The harm *will* happen if you act; the rescue *will* happen if you act. (Proceed).
  *   **Low Certainty:** The harm is likely, but the rescue is only a "chance." (STOP).
  *   *Warning:* Do not gamble with identifiable lives on a gamble. If the rescue is speculative, the constraint holds.

  **Decision Point:**
  *   If you meet the Ratio AND Certainty is High: **Tentative YES.**
  *   If you do not meet the Ratio OR Certainty is Low: **NO.**

  ### STEP 4: THE INTEGRITY CHECK (3 Minutes)
  *Goal: Ensure we can work tomorrow.*

  Ask: **If this decision becomes public knowledge in six months, can we still operate here?**
  *   **Test:** Imagine a headline: *"Aid Agency [Action] to Save [Number]."*
  *   If the headline would cause the local population to attack us, or donors to cut all funding immediately: **NO.**
  *   If the headline is damaging but understandable given the emergency: **Proceed.**

  *(Note: This is where judgement overrides arithmetic. A mathematically correct decision that ends the mission is a wrong decision.)*

  ### STEP 5: THE JUDGEMENT FLAG & SIGN-OFF (2 Minutes)
  *Goal: Acknowledge where the procedure ends and responsibility begins.*

  **The Flag:**
  If you are proceeding with a **Step 1B (Means Harm)** decision, you must verbally state to your colleague:
  *"I am authorising a direct harm to specific individuals. I know this violates our standard code. I am doing this only because the alternative is a catastrophe."*

  **The Record:**
  1.  Write down the numbers used in Step 3.
  2.  Write down the alternative options rejected.
  3.  Sign and date.
  4.  Send via Sat Phone to HQ Ethics Chair (even if no reply is expected).

  **END OF PROTOCOL.**

  ---

  ## PART 3: COSTS AND BLIND SPOTS
  **For the Ethics Committee.**

  By committing to **Threshold Deontology**, this protocol accepts specific failures:

  1.  **The "Slippery Slope" Risk:** By admitting thresholds exist, we risk leaders lowering them over time. A "massacre" threshold might become "a large skirmish" within six months. *Mitigation:* All Step 1B decisions require automatic external review post-mission.
  2.  **The "Moral Residue" Cost:** When the protocol says "Yes" to harming the few, it does not make that action "good." It remains a moral injury. The protocol does not absolve the leader of guilt; it only permits the action. Leaders will carry psychological burdens this document cannot fix.
  3.  **The Blind Spot (The Deontologist's Objection):** A strict Deontologist will argue that Step 3 (Means Harm) is illegitimate. They will say handing over names is *always* wrong, regardless of how many die. This protocol rejects that. It accepts that in extreme cases, we become complicit in evil to prevent greater evil. We cannot prove this is right; we only assert it is necessary for survival in conflict zones.
  4.  **The Blind Spot (The Consequentialist's Objection):** A strict Consequentialist will argue the thresholds (5:1 or 50:1) are arbitrary. If 49 die to save 50, why stop? This protocol stops because we are not a utilitarian calculus machine; we are a humanitarian agency. We need bright lines to function.

  ---

  ## PART 4: CASE APPLICATIONS
  **Running the Protocol on Your Scenarios.**

  ### CASE 1: The Generator (Triage)
  *Scenario: Pull five stable patients off a generator to run the theatre for thirty blast casualties.*

  *   **Step 1 (Classify):** **A (Side-Effect).** We are not killing the five to save the thirty; we are allocating scarce power. The death of the five is a foreseen consequence of saving the thirty.
  *   **Step 2 (Veto):** No direct killing by staff. **Pass.**
  *   **Step 3 (Threshold):** Ratio is 30 saved : 5 lost (6:1). Meets the 5:1 rule for Side-Effects. Certainty is High (generator capacity is fixed). **Pass.**
  *   **Step 4 (Integrity):** Medical triage is standard practice. Headline: *"Doctors Prioritise Critical Trauma."* Acceptable. **Pass.**
  *   **Outcome:** **AUTHORISE.**
  *   **Comment:** This is the easiest case. It aligns with standard medical ethics.

  ### CASE 2: The Militia Guards (Complicity)
  *Scenario: Hiring a militia's men as convoy guards, which funds an attack they will launch anyway.*

  *   **Step 1 (Classify):** **B (Means).** We are paying them. Their pay is the tool that enables the attack. We are using the funding (which causes harm) as the means to secure the convoy.
  *   **Step 2 (Veto):** No direct sexual violence/torture by staff. **Pass.**
  *   **Step 3 (Threshold):**
      *   *Harm:* An attack launched by the militia (unknown casualties, potentially high).
      *   *Benefit:* One convoy gets through (saves unknown beneficiaries).
      *   *Ratio:* Indeterminate. We do not know how many the militia will kill vs. how many we save. Certainty of harm is High; Certainty of rescue is Medium.
      *   *Result:* **FAIL.** We cannot meet the 50:1 threshold because the harm is open-ended and uncontrolled.
  *   **Step 4 (Integrity):** Headline: *"Aid Agency Funds Militia Attack."* This destroys neutrality. **FAIL.**
  *   **Outcome:** **FORBID.**
  *   **Comment:** The protocol blocks this because the harm is unquantifiable and the risk to mission integrity is total.

  ### CASE 3: The Commander's List (The "Dislike" Outcome)
  *Scenario: Handing a local commander the names of three families to save a quarter of the town (approx. 500 people) from being shelled.*

  *   **Step 1 (Classify):** **B (Means).** We are using the three families as the tool. Their betrayal is the price of the town's safety.
  *   **Step 2 (Veto):** We are not pulling the trigger, but we are facilitating execution. This is borderline, but for this protocol, it passes the "Direct Killing" veto (Step 2) because our hands are not on the weapon.
  *   **Step 3 (Threshold):**
      *   *Harm:* 3 identifiable families (approx. 15-20 people) executed.
      *   *Benefit:* 500 people saved from shelling.
      *   *Ratio:* 500 : 20 is 25:1.
      *   *Wait:* The Step 3 rule for Means Harm requires **50:1** OR prevention of a **massacre**.
      *   *Adjustment:* If "Quarter of the Town" implies 500+ immediate deaths, this counts as a **Massacre Prevention**.
      *   *Certainty:* Commander promises to stop shelling if names are given. (High Risk of deceit, but assume High Certainty for this exercise).
      *   *Result:* **PASS (Barely).** The scale of the catastrophe overrides the constraint.
  *   **Step 4 (Integrity):** Headline: *"Agency Handover Dissidents to Commander."* This is devastating. However, if 500 people died because we didn't, we may lose access anyway due to community rage.
      *   *Judgement Call:* This is the **Flagged Moment** (Step 5).
  *   **Outcome:** **AUTHORISE (With Warning).**
  *   **Why you might dislike this:** This outcome violates the existing code ("forbids using beneficiaries as means"). It makes the agency complicit in the execution of three innocent families. A Deontologist on your committee will argue this turns the agency into a moral monster. We have chosen to save the many at the cost of our own moral purity. This is the burden of Threshold Deontology. We accept that this decision is "wrong" in the abstract, but "necessary" in the concrete.

  ---

  **Final Note to the Chair:**
  This protocol does not solve the philosophical dispute. It forces the field team to *enact* a resolution under fire. It prioritises life (Consequentialism) but demands a heavy toll for violating rights (Deontology). It will feel incoherent to purists on both sides. That is the cost of operating in a war zone.
