  3.  **Address Question 1: Belief Change vs. Hinge Drift:**
      *   *Standard View:* Hinges are often analyzed as "non-epistemic certainties" or "animal certainties." They aren't propositional attitudes (beliefs) in the standard sense.
      *   *Critique:* A critic (e.g., a standard epistemologist or a doxastic interpreter of OC) might say, "If they relied on it, they believed it."
      *   *Defense:* Wittgenstein distinguishes *knowing/believing* from *acting*. OC $\S$7: "I act with *complete* certainty. But this certainty is my own." OC $\S$110: "It is not a kind of *seeing' on our part; it is our *acting*, which lies at the bottom of the 'language game'."
      *   *Verdict:* The user is on solid ground *if* they lean heavily on the non-propositional/practical nature of hinges. If hinges are just "unconscious beliefs," drift collapses into belief revision. If hinges are *enacted norms*, drift is distinct. I need to emphasize this distinction.

