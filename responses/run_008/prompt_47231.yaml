          *   *The Gap:* Most literature focuses on *synchronic* stability (why hinges hold *now*). Diachronic change is less explored, though Moyal-Sharrock's "enacted" view implies it.
          *   *Specific Term:* "Hinge Drift" isn't a standard term. "Hinge Shift" or "Hinge Change" is common.
          *   *Verdict:* It's not *brand new*, but framing it specifically as "drift via disuse/obsolescence" rather than "conflict/refutation" is a specific enough angle to be viable. It aligns with the "riverbed" metaphor which is often cited but under-analyzed regarding *mechanism*.

