answer: |-
  Based on her verdicts, your friend isn't running a pure libertarian script or a pure deontological one. She's likely running a heuristic focused on **incentive compatibility and power asymmetry**. Here are the two candidate rules that fit her track record equally well, followed by predictions and a splitting case.

  ### Candidate Rule 1: The Undue Inducement Principle
  **Markets are impermissible when financial incentives exploit desperation, basic needs, or severe power imbalances.**
  *   **Fits:** Banning kidney sales (exploits poverty/health desperation), price gouging (exploits survival needs), and vote selling (exploits economic inequality to distort power).
  *   **Allows:** Plasma, hair, and capped egg donation because regulations/caps mitigate the "undue" nature of the inducement. Scalping is allowed because tickets aren't necessities.

  ### Candidate Rule 2: The Civic/Body Integrity Principle
  **Markets are impermissible when they commodify goods that define civic equality or non-renewable bodily integrity.**
  *   **Fits:** Banning votes (corrupts civic equality) and kidneys (treats the body as spare parts).
  *   **Allows:** Plasma, hair, and eggs because they are renewable or low-risk bodily products. Scalping is allowed because tickets are private property.
  *   **Tension:** This rule struggles slightly with price gouging (water is already a market good), unless interpreted as "fair access to necessities is a civic right."

  ---

  ### Predictions

  **1. Selling DMV Line Spots**
  *   **Verdict:** **Allow.**
  *   **Reasoning:** Under Rule 1, you specified "nobody's desperate," removing the exploitation concern. Under Rule 2, a queue spot is time, not a civic right or body part; the actual service (the DMV transaction) remains equally accessible, just via proxy. It aligns with her acceptance of scalping (efficient allocation of time) rather than vote selling (allocation of rights).

  **2. Paid Malaria Infection for Research**
  *   **Verdict:** **Allow (with strict compensation caps).**
  *   **Reasoning:** This is the closer call. Rule 1 flags the risk of undue inducement (healthy people risking sickness for cash), but she already accepts compensated risk for egg donation. Rule 2 distinguishes this from kidneys because malaria is temporary and curable, closer to plasma/eggs than permanent organ loss. Given her LessWrong background, she likely recognizes the high social value of challenge trials, provided the "exploitation" vector is capped like egg donation.

  ---

  ### The Splitting Case

  To determine which rule she's actually running, propose this case:

  **"A state university selling honorary degrees to wealthy donors."**

  *   **Rule 1 (Undue Inducement) predicts:** **Allow.** There is no desperation or coercion; it's a voluntary exchange between wealthy buyers and a university seeking funds.
  *   **Rule 2 (Civic/Body Integrity) predicts:** **Ban.** This corrupts the meaning of academic merit and public trust, similar to how selling votes corrupts democracy.

  If she bans it, she's prioritizing the *nature of the good* (Sandel-style corruption). If she allows it, she's prioritizing the *conditions of the exchange* (anti-exploitation). Given she banned price gouging (a market condition issue) but allows scalping, I suspect Rule 1 is her dominant driver, but the honorary degree case will force her to reveal if there's a hard line on "sacred" goods.
