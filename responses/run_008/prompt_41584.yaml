  ok so this came up at dinner and has been bugging me all week. my aunt basically shut down an argument about charity with the line "you could just as easily have been born in a village in Bangladesh" — her point being I didn't earn my comfy life, it's pure luck, so I've got no grounds for acting smug and every reason to give. and honestly that feels true. but then I got thinking (probably too much lol): in what sense could I have been born in Bangladesh?? if it's literally ME, then presumably to different parents, which would of meant a different egg or at least a different sperm. and I half remember a philosophy video saying some philosopher (Kripke I think?) reckons each of us couldn't possibly have come from a different sperm and egg, because that zygote would just be a different person — more like a sibling that never existed than an alternate me. if that's right then whoever was born in that village, it wouldn't have been me at all, so is my aunt's line actually false? or is it just not making that strong a claim in the first place?

  can you lay out the different precise things "you could have been born anywhere / as anyone" could mean, like a menu I can actually use in the next family argument. I suspect some readings are just platitudes about luck, some are doing serious metaphysics about whether I'm essentially tied to my origins, and maybe one is really just a moral claim — that a kid born there matters no less than me — which needs no weird metaphysics at all. for each reading: is it plausable, is it flat-out false, and crucially which one does my aunt's argument actually need to go through? because I have a feeling it only works on the reading that's hardest to defend, and I'd love to be able to say exactly why, rather than just "it feels true" back at her.
