      *   **Alternative Agent:** Sketch a "resolute" or "sophisticated" agent that evaluates sequences, binds itself, or refuses pattern-based losses.
      *   **Claim:** This agent keeps intransitive preferences *and* keeps money. Therefore, intransitivity $\neq$ irrationality; it's about choice architecture over time.
      *   **Counter-argument Handling:** Address the comeback that this resolute agent is irrational (turning down preferred trades, ad hoc binding, longer paths). Explain why this cost isn't real or obvious.
      *   **Precision:** Distinguish between one-shot, repeated, and renegotiable pumps. Be honest about which cases are hard/easy.
