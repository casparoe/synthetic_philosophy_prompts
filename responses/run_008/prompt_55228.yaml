prompt: |-
  I'm the student representative on my school district's wellness advisory committee, and next week we vote on whether to recommend universal mental-health screening for all ninth graders using a standard social anxiety questionnaire. The superintendent argues that early identification means early support. But our school psychologist has reservations: she worries that we would be telling a large number of ordinary, shy fourteen-year-olds that they have a treatable condition, that the questionnaire results would go into their files, and that teachers who see those files may start interacting with the students differently. I've been asked to draft a short written opinion for the committee, and I'd like it to be more than a privacy discussion. Specifically, I want it to take seriously the possibility that a label like socially anxious is not just a passive description of a student but can itself change how the student sees and acts — that sorting people into a category can help produce the very traits the category names. Please draft the memo: a concrete recommendation (universal screening, screening only for students who opt in or are flagged by teachers, or no screening), a proposed timeline, explicit reasoning the committee can respond to point by point, and a fair treatment of the strongest argument on the losing side. My fellow committee members will notice if I dodge anything, so keep the reasoning specific enough that a teacher could push back on a particular sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on a School District Wellness Advisory Committee.
      *   **Task:** Draft a short written opinion/memo for the committee regarding a vote on universal mental-health screening for 9th graders (specifically using a social anxiety questionnaire).
      *   **Key Issue:** Universal screening vs. alternatives.
      *   **Core Argument:** Go beyond privacy. Focus on *labeling theory* / *self-fulfilling prophecy* (the idea that categorizing someone as "socially anxious" can produce or exacerbate those traits).
      *   **Requirements:**
          *   Concrete recommendation (Universal, Opt-in/Flagged, or No Screening).
          *   Proposed timeline.
          *   Explicit reasoning (point-by-point, specific enough for pushback).
          *   Fair treatment of the strongest counter-argument (Superintendent's "early identification = early support" stance).
          *   Tone: Professional, thoughtful, student-focused, persuasive but open to debate.

  2.  **Determine the Recommendation:**
      *   *Option A: Universal Screening.* This is what the Superintendent wants. The prompt implies skepticism about this due to the labeling effect.
      *   *Option B: No Screening.* Too extreme. Mental health is important. Ignores the "early support" benefit.
      *   *Option C: Opt-in or Targeted Screening.* This seems the most balanced. It respects agency, reduces false positives among "ordinary shy" kids, and mitigates the labeling risk while still allowing support for those who seek it or clearly need it.
      *   *Decision:* Recommend **Opt-in Screening with Teacher/Parent Referral pathways**. This directly addresses the labeling concern (students choose the label) while keeping support available.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the position clearly upfront.
      *   **Core Argument (The "Labeling" Effect):** This is the specific request. I need to explain *how* a diagnosis changes behavior. It's not just stigma; it's identity formation.
      *   **Addressing the Counter-Argument (Superintendent):** Acknowledge the validity of early intervention. Don't strawman it. Admit that some kids *will* be missed without universal screening.
      *   **Privacy/File Concerns:** Briefly touch on this as requested (school psychologist's worry), but keep the focus on the psychological impact.
      *   **Timeline:** Needs to be realistic. Pilot program? Phased rollout?
      *   **Reasoning Points:** Numbered list for easy rebuttal.

  4.  **Refining the Argument (The "Labeling" Theory):**
      *   *Concept:* Ian Hacking's "looping effects" or labeling theory in sociology.
      *   *Application:* A 14-year-old is still forming their identity. If a test says "you have social anxiety," they might start avoiding situations they previously handled fine, interpreting normal nervousness as pathology.
      *   *Wording:* Needs to be precise. "Constitutive effect of classification." "Diagnostic label as a script."

  5.  **Refining the Counter-Argument:**
      *   *Superintendent's Point:* Silent suffering. Kids won't ask for help.
      *   *Concession:* Yes, universal screening catches the quiet kids who don't opt-in.
      *   *Rebuttal:* Is the cost of false positives (labeling normal shyness as pathology) worth catching those few extra cases? Can we catch them through teacher observation instead?

  6.  **Developing the Timeline:**
      *   Don't suggest implementing immediately. Suggest a pilot or a delay to refine the protocol. Let's say: Delay vote, form a subcommittee, pilot opt-in model in Q2.

  7.  **Review against Constraints:**
      *   *Student Rep Voice:* Needs to sound mature but represent the student body's interest. Not too academic, but not childish.
      *   *Specific Reasoning:* Avoid vague phrases like "it feels wrong." Use "it risks altering self-perception."
      *   *Fairness:* Ensure the Superintendent's argument isn't dismissed lightly.

  8.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Committee. From: Student Rep.
      *   Rec: No universal. Do opt-in.
      *   Reason 1: Labels change behavior.
      *   Reason 2: Privacy is real.
      *   Counter: We need to help kids.
      *   Response: Opt-in helps kids who want help.
      *   Timeline: Wait 6 months.

      *Critique 1:* Too simple. Needs more nuance on the "labeling" aspect as requested. Needs to be specific enough for a teacher to push back.

  9.  **Drafting - Iteration 2 (Adding Nuance):**
      *   Focus on the *mechanism* of the labeling. "If I tell a kid they are anxious, they act anxious."
      *   Make the timeline specific. "Pause vote until January."
      *   Make the counter-argument strong. "Universal screening is the only way to find kids who hide symptoms."

  10. **Final Polish (incorporating the prompt's specific constraints):**
      *   Ensure the "looping effect" is explained clearly.
      *   Ensure the recommendation is one of the three options provided (Universal, Opt-in/Flagged, No). I'll choose **Opt-in/Flagged**.
      *   Check tone: Respectful but firm on the psychological risk.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing mental health care. I must emphasize that support is good, but *how* we identify it matters. The prompt asks for a "fair treatment of the strongest argument on the losing side." If I recommend Opt-in, the losing side is Universal. I need to make the Universal argument sound very compelling before explaining why I still choose Opt-in.

      *(Refining the Timeline)*: A timeline for *what*? The implementation? Or the decision? The prompt asks for a "proposed timeline." I should propose a timeline for the *alternative* plan I'm recommending.

      *(Refining the Reasoning)*: Make sure each point is a distinct claim.
      1. Identity formation at age 14.
      2. False positives (shyness vs. disorder).
      3. Teacher bias (file access).
      4. Agency (opt-in builds resilience).

      *(Final check on "Student Rep" voice)*: It should sound like a student leader who has done research, not just a kid complaining. Professional memo style.

  11. **Finalizing the Text:** (Proceeding to generate output based on these thoughts).
      *   *Subject:* Recommendation on 9th Grade Mental Health Screening Protocol.
      *   *Recommendation:* Targeted/Opt-in.
      *   *Key Concept:* "Feedback Loop of Diagnosis."
      *   *Counter:* The "Silent Sufferer."

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** District Wellness Advisory Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Universal Social Anxiety Screening for Grade 9

  **Recommendation**
  I recommend the committee **reject the proposal for universal mandatory screening** at this time. Instead, I propose we adopt a **Targeted Opt-In Model** supplemented by a structured teacher/parent referral pathway. Under this model, screening is available to any student who requests it or whose guardians request it, and for students specifically flagged by staff based on observed behavioral changes (not just questionnaire scores).

  **Proposed Timeline**
  *   **November – December:** Pause implementation to draft the "Targeted Opt-In" protocol.
  *   **January:** Pilot the Opt-In/Referral model in two middle schools feeding into the high school.
  *   **March:** Review pilot data (participation rates, referral accuracy, student feedback) before district-wide rollout for 9th graders in the following academic year.

  **Reasoning**
  My opposition to universal screening is not based solely on privacy concerns, which the School Psychologist has already outlined. My primary objection concerns the *constitutive effect* of diagnostic labeling on adolescent identity. At fourteen, students are actively constructing their self-concept. Introducing a clinical label during this window carries specific psychological risks that the committee must weigh against the benefits of identification.

  1.  **The Feedback Loop of Diagnosis:** Psychological research suggests that diagnostic categories are not merely passive descriptions; they can act as scripts for behavior. If a student who experiences normal developmental nervousness is categorized as "Socially Anxious," they may begin to interpret future nervousness as a symptom rather than a normal emotion. This can lead to avoidance behaviors they would not have otherwise adopted, effectively producing the traits the screening claims to measure.
  2.  **False Positives and Pathologizing Shyness:** Standardized questionnaires struggle to distinguish between introversion/shyness and clinical anxiety. Universal screening assumes the cost of a false positive is low. I argue the cost is high: a student incorrectly labeled may internalize a deficit-based identity ("I am broken") rather than a temperament-based one ("I am quiet"), which impacts their willingness to participate in class or social events.
  3.  **Teacher Expectancy Effects:** As noted by the School Psychologist, file access matters. If a teacher sees a "Social Anxiety" flag, they may unconsciously lower academic expectations or stop calling on that student to "protect" them. This accommodation denies the student the low-stakes exposure necessary to build resilience, reinforcing the anxiety.
  4.  **Agency as a Therapeutic Tool:** Requiring a student to opt-in (or consent to a referral) treats help-seeking as an active skill. Universal screening treats mental health as something done *to* a student. Forcing agency in the help-seeking process is itself a protective factor against learned helplessness.

  **The Strongest Counter-Argument (Universal Screening)**
  The Superintendent's argument for universal screening is that **silent suffering is the greater risk.** Many students with genuine clinical needs lack the vocabulary or confidence to opt-in, and teachers may miss internalizing symptoms that do not disrupt the classroom. Universal screening is the only net wide enough to catch students who are successfully hiding their distress. By requiring opt-in or specific referral, we risk leaving the most vulnerable students unidentified until a crisis occurs. The benefit of saving even a few students from severe deterioration outweighs the risk of labeling shy students.

  **Response to Counter-Argument**
  While I acknowledge that some students will slip through the cracks of an Opt-In model, I believe the harm of mislabeling a large cohort of healthy students outweighs the benefit of catching the additional marginal cases via universal testing. We can mitigate the "silent suffering" risk by training staff to recognize *behavioral changes* (e.g., withdrawal from previously enjoyed activities) rather than *temperament traits* (e.g., quietness) for referrals. This targets students whose functioning is actually impaired, rather than students who simply score high on a shyness metric.

  **Conclusion**
  We must ensure our wellness initiatives do not inadvertently create the problems they aim to solve. By shifting to an Opt-In/Referral model, we prioritize student agency and protect against the self-fulfilling prophecy of diagnostic labeling, while maintaining a safety net for those in demonstrable distress.
