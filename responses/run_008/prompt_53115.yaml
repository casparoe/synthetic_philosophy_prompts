answer: |-
  Question 1: You live in a state that hasn't voted for your preferred party in forty years. The current election features a "lesser evil" major candidate versus a "greater evil" major candidate. Your single vote has zero chance of changing the state's outcome. Do you vote for the lesser evil?
  A) Yes. It's a duty to support the better option, even symbolically.
  B) No. Voting for a loser is a waste of time and legitimizes a rigged system.
  C) Maybe. Only if it makes me feel better about myself, not because it changes anything.

  Question 2: You live in a genuine swing state. You prefer a Third Party candidate who aligns with your values but cannot win. Voting for them increases the chance that the "greater evil" major candidate wins. Do you vote Third Party?
  A) No. You have a responsibility to prevent the worst outcome, even if it means compromising.
  B) Yes. Your vote is about your integrity, not the math. You can't be responsible for the system's failures.
  C) It doesn't matter. The odds are still too low to justify the hassle either way.

  Question 3: Your spouse is voting for a candidate you believe is dangerous to democracy. You consider voting for the opponent solely to "cancel out" their vote within your household. Is this permissible?
  A) Yes. Voting is expressive; you're signaling disapproval of their choice.
  B) No. Voting is about collective outcomes, not household scorekeeping.
  C) Yes. You have a duty to vote, and this is a valid way to fulfill it while mitigating harm.

  Question 4: A friend argues, "No single vote has ever decided a national election, so nothing is at stake in yours." Does this argument relieve you of the obligation to vote?
  A) Yes. If the expected impact is zero, the duty disappears.
  B) No. The duty comes from participation in the collective act, not individual causality.
  C) No. Even if my vote doesn't decide, voting badly is worse than not voting at all.

  Question 5: You are honestly clueless about the candidates' platforms but want to participate. Is it better to vote randomly or stay home?
  A) Stay home. Voting without knowledge is negligent and potentially harmful.
  B) Vote randomly. The act of participation matters more than the choice.
  C) Vote randomly. It's just expression, like cheering for a team you don't know.

  Question 6: You could spend the two hours required to vote volunteering at a food bank instead, where your labor will definitely help people. Do you volunteer instead of vote?
  A) Yes. Consequences matter; definite help beats hypothetical political impact.
  B) No. Citizenship requires specific civic rituals that volunteering doesn't replace.
  C) No. Voting sends a signal to the government that volunteering doesn't.

  Question 7: Both major candidates are equally corrupt, but one is slightly more competent. Do you vote for the competent one?
  A) Yes. Competence is a valid metric for lesser-evil voting.
  B) No. Voting for either legitimizes corruption. Abstain to keep your hands clean.
  C) Yes, but only because I have a duty to vote, not because it will change anything.

  Question 8: It is raining hard, the line is long, and you are tired. The election is not expected to be close. Do you go to the polls?
  A) No. The cost outweighs the benefit when the outcome is secure.
  B) Yes. Duty isn't conditional on convenience or competitiveness.
  C) Maybe. Only if I really want to wear my "I Voted" sticker today.

  Question 9: You want to punish your preferred party for taking you for granted, so you vote for the opponent. Is this valid?
  A) Yes. Voting is a message-sending device; send a sharp one.
  B) No. Voting is a trust exercised for the common good, not a tantrum.
  C) Yes. You own your vote; do what you want with it.

  Question 10: You believe there is no duty to vote, but you decide to do anyway. You pick a candidate based on a coin flip. Is this morally wrong?
  A) No. There is no duty to vote well, only a permission to vote.
  B) Yes. If you enter the booth, you incur a duty to be informed.
  C) No. The vote is expressive; the coin flip expresses your indifference.

  ***

  # Scoring Key

  Tally your answers based on the dominant philosophical leaning indicated below. Note that some answers overlap across theories; count them for every category listed.

  **Category 1: Pure Consequentialist (Expected Utility)**
  *   **Q1:** A (if motivated by outcome) or C
  *   **Q2:** A
  *   **Q3:** B
  *   **Q4:** A
  *   **Q5:** A
  *   **Q6:** A
  *   **Q7:** A
  *   **Q8:** A
  *   **Q9:** B
  *   **Q10:** B (if motivated by harm prevention)

  **Category 2: Civic Duty (Deontological)**
  *   **Q1:** A
  *   **Q2:** A (if motivated by duty rather than outcome)
  *   **Q3:** C
  *   **Q4:** B
  *   **Q5:** B
  *   **Q6:** B
  *   **Q7:** C
  *   **Q8:** B
  *   **Q9:** B
  *   **Q10:** B

  **Category 3: Expressive Theory**
  *   **Q1:** C
  *   **Q2:** B
  *   **Q3:** A
  *   **Q4:** B (if motivated by expression)
  *   **Q5:** C
  *   **Q6:** C
  *   **Q7:** B (if motivated by purity)
  *   **Q8:** C
  *   **Q9:** A
  *   **Q10:** C

  **Category 4: Abstentionism / "Clean Hands"**
  *   **Q1:** B
  *   **Q2:** B (if motivated by system rejection)
  *   **Q3:** B (if motivated by futility)
  *   **Q4:** A
  *   **Q5:** A
  *   **Q6:** A
  *   **Q7:** B
  *   **Q8:** A
  *   **Q9:** B
  *   **Q10:** A (if motivated by liberty)

  **Category 5: Epistemic Constraint ("Bad Voting is Worse")**
  *   **Q5:** A (Critical differentiator)
  *   **Q10:** B (Critical differentiator)

  **Category 6: Lesser-Evil Pragmatist**
  *   **Q1:** A
  *   **Q2:** A
  *   **Q7:** A
  *   **Q9:** B

  **Category 7: Conscience / Principled Voter**
  *   **Q2:** B
  *   **Q7:** B
  *   **Q9:** A (if punishing principle) or B (if refusing to compromise)

  ### Result Interpretation

  *   **Mostly Category 1:** You are a **Pure Consequentialist**. You vote only if the math works. In safe states, you likely stay home. In swing states, you hold your nose and vote lesser evil.
  *   **Mostly Category 2:** You are a **Civic Duty Traditionalist**. You vote because it is what citizens owe one another. Convenience and probability are irrelevant. You likely believe voting clueless is wrong but voting is mandatory.
  *   **Mostly Category 3:** You are an **Expressive Theorist**. Voting is like cheering at a game or wearing a jersey. It's about identity and signaling, not causal impact.
  *   **Mostly Category 4:** You are an **Abstentionist**. You view the system as corrupt or the act as morally compromising. You prioritize keeping your hands clean over participating.
  *   **High Category 5:** You hold the **Epistemic Constraint** view. You believe there may be a duty to vote, but only if informed. Uninformed voting is morally worse than abstention.
  *   **High Category 6:** You are a **Lesser-Evil Pragmatist**. You are willing to compromise values to prevent harm. This often overlaps with Consequentialism.
  *   **High Category 7:** You are a **Conscience Voter**. You refuse to compromise values even to prevent harm. This often overlaps with Expressive Theory or Abstentionism.

  ***

  # Separation Caveats

  **1. Expressive Theory vs. Conscience Voting**
  This quiz cannot reliably distinguish between the Expressive Theorist and the Conscience Voter. Both will often choose the "vote your integrity" option in swing states (Q2) and the "protest vote" option (Q9). The philosophical difference is that the Expressive Theorist votes to *say* something (external signal), while the Conscience Voter votes to *be* something (internal integrity). The scenarios provided treat these behavioral outputs as identical.

  **2. Consequentialist vs. Lesser-Evil Pragmatist**
  These are theoretically distinct (one is a meta-ethical framework, the other is a strategic application), but in practice, they yield identical answer patterns on this quiz. A Consequentialist will almost always be a Lesser-Evil voter in high-stakes scenarios. The quiz treats them as a single cluster for scoring purposes.

  **3. Civic Duty vs. Expressive (High Cost)**
  In Q8 (Inconvenience), both Civic Duty and Expressive voters might vote. The Duty voter goes because they *must*; the Expressive voter goes because they *want the sticker*. The quiz assumes the "Yes" answer covers both, though the motivations differ.

  # Unoccupied Combinations

  **1. The "Clueless Duty" Voter (Incoherent)**
  There is no robust philosophical position that argues "You have a strict duty to vote" (Category 2) combined with "It is permissible to vote based on a coin flip" (Category 3/5 opposition). Most Duty theorists argue the duty includes a duty to be informed. If a reader scores high on Civic Duty but chooses the "Coin Flip is Permissible" option in Q10, they hold a view most literature considers incoherent: a duty to perform an act without a duty to perform it competently.

  **2. The "High-Cost Consequentialist" (Unexplored)**
  There is a theoretical space for a Consequentialist who votes despite high personal cost and low probability of impact (e.g., Q6 or Q8), justified by "rule utilitarianism" (if everyone thought like me, democracy would collapse). This view is rarely held explicitly by individuals in polling. If a reader scores high on Consequentialism but votes in Q8 (High Cost/Low Impact), they are likely smuggling in a Civic Duty intuition without admitting it.

  **3. The "Abstentionist Lesser-Evilist" (Impossible)**
  It is logically impossible to be an Abstentionist (Q1: No, Q7: No) and a Lesser-Evilist (Q1: Yes, Q7: Yes). If a reader selects both, they are inconsistent. The quiz forces a choice, but readers attempting to select both across different questions indicate unstable preferences.
