answer: |-
  ### Part 1: Brainstorming & Testing Candidate Principles

  Here is my scratchpad work. I'm generating principles that might unify your intuitions, then stress-testing them against your specific verdicts.

  **Candidate 1: The Cost-Threshold View**
  *Principle:* Duty extends up to a specific level of sacrifice (e.g., "significant but not life-altering"). Anything beyond is supererogatory.
  *Test:*
  *   *Pond/Coat:* Low cost. Verdict: Duty. (Matches)
  *   *Kidney/Stranger:* High cost (surgery, long-term risk). Verdict: Supererogatory. (Matches)
  *   *Marrow/Sibling:* Moderate cost (pain, anesthesia). Verdict: Duty. (Matches, assuming marrow cost < kidney cost).
  *   *40% Income:* High cost (life-altering). Verdict: Murky/Duty. (Clash: If Kidney is supererogatory due to high cost, 40% income should be too. Your intuition wavers here.)
  *   *Firefighter:* High risk. Verdict: Supererogatory. (Matches).
  *   *Problem:* This view struggles to explain why the *same* cost might be duty in one context and supererogatory in another without smuggling in other factors. It also doesn't explain why you feel the 40% income case is "murky" rather than clearly supererogatory like the kidney.

  **Candidate 2: The Identifiable Victim View**
  *Principle:* We have a duty to save identifiable lives in immediate peril; we have no duty to save statistical lives or prevent future harm.
  *Test:*
  *   *Pond:* Identifiable/Immediate. Verdict: Duty. (Matches)
  *   *Kidney/Stranger:* Identifiable (once matched). Verdict: Supererogatory. (Clash: The recipient is specific.)
  *   *Blood Donation:* Statistical. Verdict: Not Duty. (Matches)
  *   *Problem:* Fails to distinguish the Kidney case from the Pond case sufficiently. Both involve specific people.

  **Candidate 3: The Special Obligations View**
  *Principle:* Duties arise primarily from roles, contracts, or relationships. General beneficence is weak; special obligations are strong.
  *Test:*
  *   *Sibling/Marrow:* Relationship. Verdict: Duty. (Matches)
  *   *Stranger/Kidney:* No relationship. Verdict: Supererogatory. (Matches)
  *   *Firefighter:* Role. Verdict: Assigned rescue = Duty; Extra = Supererogatory. (Matches)
  *   *Pond/Coat:* No relationship. Verdict: Duty. (Clash: This view makes the Pond case hard to explain unless "fellow human" is a relationship strong enough to mandate coat-ruining.)
  *   *Problem:* It risks making the Pond case an outlier unless we argue that physical proximity creates a temporary "special obligation."

  **Candidate 4: The Social Baseline View**
  *Principle:* Duty is what is reasonably expected by social norms to maintain cooperation. Supererogation exceeds reasonable expectation.
  *Test:*
  *   *Pond:* Expected. (Matches)
  *   *Kidney:* Not expected. (Matches)
  *   *Sibling:* Expected within families. (Matches)
  *   *40% Income:* Not expected. (Matches "Supererogatory," clashes with your "murky/duty" feeling).
  *   *Problem:* This is descriptive (what *is* expected) rather than normative (what *should* be expected). It risks justifying moral stagnation.

  ***

  ### Part 2: My Commitment

  I am going to take a definite position. I defend the claim that **supererogation is not a single moral phenomenon.**

  It is tempting to look for a "Unified Field Theory" of supererogation—a single metric of cost or risk that determines where duty ends and heroism begins. But your intuitions, particularly the tension between the sibling marrow and stranger kidney cases, reveal that we are actually dealing with **two distinct normative tracks** that have different ceilings.

  **The Dual-Source Account:**
  1.  **General Beneficence:** Applies to all humans. The threshold for duty is *low-to-moderate cost* (e.g., ruining a coat, wading into a pond).
  2.  **Special Obligations:** Applies to specific relationships (family, contracts, roles). The threshold for duty is *moderate-to-high cost* (e.g., medical procedures, significant risk).

  **Supererogation** is simply the label we apply when an act exceeds the threshold of *whichever track is relevant*. It is not a unified category; it is the residual space left when distinct normative systems hit their limits.

  #### Why this resolves your tension
  You asked: *"I can't see why the relationship should raise the bar rather than just adding a reason."*

  On my view, the relationship does not just add weight to the *same* reason; it switches the **normative track**.
  *   **Stranger Kidney:** You are on the *General Beneficence* track. The ceiling here is low because we cannot demand high bodily sacrifice from strangers without violating their status as free, independent agents. Donating a kidney exceeds this ceiling → Supererogatory.
  *   **Sibling Marrow:** You are on the *Special Obligations* track. The ceiling here is higher because family relationships are constituted by mutual aid that partially overrides independent agency. Donating marrow is below this higher ceiling → Duty.

  This explains why the "bar" moves. It's not one bar being lifted; it's a different bar entirely.

  #### Which verdicts must you drop?
  To achieve reflective equilibrium with this account, you must clarify your intuition on the **40% Income** case.
  *   **Current Intuition:** "Murky... feels less like optional heroism and more like something closer to a duty."
  *   **Required Adjustment:** You must accept that this is **Supererogatory**.
  *   **Why:** This falls under *General Beneficence* (assuming the charities help strangers). The cost (40% for 30 years) is life-altering and exceeds the "low-to-moderate cost" ceiling of General Beneficence. If you classify this as Duty, you collapse the distinction between the "Good Samaritan" and the "Saint," and you lose the ability to call the Kidney case supererogatory without contradiction. The "murkiness" you feel is the psychological pull of utilitarianism, but your own verdict on the kidney (which is also life-altering) suggests you reject utilitarianism in practice. Consistency demands you call the 40% income case supererogatory.

  ***

  ### Part 3: Predictions on New Cases

  Here is how the Dual-Source Account predicts verdicts for the cases you haven't mentioned.

  **Case 1: The Billionaire asked to give $1 billion to save 1,000 lives.**
  *   **Analysis:** This falls under *General Beneficence*. The question is whether financial cost counts differently than bodily cost.
  *   **Prediction:** **Supererogatory.**
  *   **Reasoning:** While the money might not be "painful" in a physical sense, surrendering $1 billion likely dismantles the agent's life projects, autonomy, and future capacity to act. The *General Beneficence* track protects the agent's right to a life of their own, not just their physical body. To make this a *duty* would be to treat the billionaire as a mere resource for utility maximization.
  *   **Stitching Flag:** This is a contested boundary. If the $1 billion is "idle wealth" that does not impact their life projects, a strict utilitarian would call it duty. My account relies on the assumption that wealth is tied to agency/life plans. If the billionaire is hoarding money they literally cannot spend, my principle strains to explain why it's not duty.

  **Case 2: Risky, permanently debilitating procedure to save a stranger's leg (not life).**
  *   **Analysis:** *General Beneficence* track.
  *   **Prediction:** **Clearly Supererogatory.**
  *   **Reasoning:** The *General Beneficence* track has a low threshold for bodily integrity. Even for a *life*, a permanently debilitating procedure is usually supererogatory (as per your kidney intuition). For a *leg*, it is decisively supererogatory. The cost (permanent debilitation) vastly exceeds the ceiling of what we can demand for the sake of a stranger's non-vital interest.
  *   **Stitching Flag:** None. This is a robust prediction of the view.

  ***

  ### Part 4: Where the Stitching Shows

  I want to be honest about the weaknesses in this account, as you requested.

  1.  **The "Murky" Zone of General Beneficence:**
      I am forcing you to categorize the 40% income case as supererogatory to maintain consistency with the kidney case. However, I admit this is where the "stitching" is most visible. Many people feel a stronger duty to ongoing financial aid than to one-off organ donation because financial aid is reversible and less invasive. My Dual-Source Account treats "cost" broadly, but it struggles to precisely quantify when financial sacrifice becomes "life-altering" enough to trigger the supererogatory label. I am relying on your intuition that 30 years of 40% income is comparable to losing a kidney. If you decide it isn't, my account needs a more granular theory of "cost."

  2.  **The Definition of "Special Obligation":**
      I claim the sibling case is a different *track*. But where does the track end? Is a cousin a special obligation? A close friend? A neighbor? My account predicts a sliding scale of thresholds, but it doesn't provide a sharp line for where "Special" begins. I am assuming a commonsense understanding of "family" that philosophy has trouble rigorously defining.

  3.  **The Blood Donation Puzzle:**
      You noted monthly blood donation feels non-obligatory despite low cost. My account explains this via *General Beneficence*: while individual cost is low, the *aggregation* of time and institutional reliance pushes it toward a "life project" interference if made mandatory. However, this is a borderline case. A strict reading of the Pond case (low cost = duty) might suggest regular blood donation *should* be duty. I am saving this verdict by arguing that "recurring invasive procedures" belong to a higher cost category than "ruining a coat." That is a defensible distinction, but it is not self-evident.

  **Conclusion:**
  By accepting that supererogation is the overflow of multiple distinct moral buckets (General vs. Special), you can keep your intuition that siblings deserve more than strangers *without* having to prove that a sibling's life is objectively worth more than a stranger's. You simply acknowledge that the *terms of the relationship* change the rules of the game. This preserves the heroism of the kidney donor while affirming the duty of the sibling donor.
