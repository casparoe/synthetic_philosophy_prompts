      *   The core task is to explicate the "quiet work" the professor mentioned: the assumptions of CJT and how they fail.

  3.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   **What it says:** If $p > 0.5$ (individual competence), votes are independent, and there are only two options (one correct, one incorrect), then $P(\text{majority correct}) \rightarrow 1$ as $n \rightarrow \infty$.
      *   **Key Assumptions:**
          1.  **Binary Choice:** There must be exactly two options, one objectively "correct."
          2.  **Objective Truth:** There *is* a fact of the matter to be discovered.
          3.  **Individual Competence ($p > 0.5$):** Each voter must be more likely than not to be right.
          4.  **Independence:** Voters must decide independently of one another (no correlation in errors).
          5.  **Sincere Voting:** Voters vote for what they believe is true, not strategically.

  4.  **Evaluate the User's Application (Referendum vs. Experts):**
      *   *Scenario:* Vaccine side effects or Minimum wage impact.
      *   *Assumption Check:*
