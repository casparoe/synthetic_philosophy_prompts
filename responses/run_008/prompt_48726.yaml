answer: |-
  Your friends are right. While your understanding of the Condorcet Jury Theorem's *mathematics* is correct, your application of it to real-world referendums on technical issues is a classic over-extension. The theorem does not license the conclusion that "more voters is always better" in practical politics.

  The "quiet work" your professor mentioned refers to the theorem's **assumptions**. In mathematics, a theorem is only as strong as its premises. The Condorcet Jury Theorem (CJT) relies on conditions that are extremely fragile and almost never hold in the context of complex public policy questions like vaccine safety or macroeconomic impacts.

  Here is exactly where your reasoning breaks down, based on the specific assumptions of the theorem.

  ### 1. The Competence Assumption ($p > 0.5$)
  The theorem states that if each voter has a probability $p$ of voting correctly, and **$p > 0.5$**, then the majority probability approaches 1 as $n$ grows.

  However, the theorem also implies the converse: **If $p < 0.5$, the probability of the majority being correct approaches 0 as $n$ grows.**

  *   **The Problem:** For questions like "Will this minimum wage increase cause unemployment?" or "Does this vaccine have this specific side effect?", the average citizen does not possess the requisite knowledge to be more likely right than wrong. These are technical questions requiring understanding of econometrics or epidemiology.
  *   **The Reality:** If the average voter's competence on a specific technical question is 40% ($p = 0.4$), adding more voters does not help; it makes the collective decision *worse*. A large electorate of uninformed voters will converge confidently on the wrong answer.
  *   **Expert Comparison:** A panel of 50 experts might have a $p$ of 0.9. A referendum of 10 million laypeople might have a $p$ of 0.4. The CJT mathematically favors the experts in this scenario, not the crowd.

  ### 2. The Independence Assumption
  The CJT requires that voters make their judgments **independently**. One voter's error must not be correlated with another's. This allows errors to "cancel out" (noise averages to zero) while the signal remains.

  *   **The Problem:** Voters are not independent sampling machines. They are influenced by the same media ecosystems, the same political leaders, the same social media algorithms, and the same cultural biases.
  *   **Correlated Errors:** If a misleading news story convinces 60% of the population that a vaccine is dangerous (when it is not), their errors are correlated. They are not flipping independent coins; they are all reading the same loaded die.
  *   **The Result:** When errors are correlated, the "law of large numbers" does not apply. You don't get error cancellation; you get error amplification. A million people sharing the same misconception will vote unanimously for the wrong outcome.

  ### 3. The Binary Truth Assumption
  The CJT assumes there are exactly two options, and one is objectively "correct."

  *   **The Problem:** While your examples (vaccine safety, unemployment effects) are factual, policy questions are rarely binary in practice. A referendum usually asks "Yes/No" on a specific bill, but the "correct" economic outcome might depend on implementation details, timing, or complementary policies that a binary vote cannot capture.
  *   **Nuance:** Even if there is a factual truth (e.g., "Will unemployment rise by >1%?"), voters often vote based on values, identity, or trust in parties, not just their estimation of that fact. This violates the assumption that voters are trying to track the truth sincerely.

  ### 4. The "Common Information" Problem
  Epistemic democracy relies on the idea that voters aggregate *dispersed* information (Hayek's knowledge problem). The CJT works best when voters have private, unique information.

  *   **The Problem:** In modern mass democracies, voters rely on public, common information sources. If the "signal" available to the public is degraded (e.g., by misinformation campaigns or complex data that is hard to interpret), the aggregate judgment cannot recover the truth, regardless of group size.
  *   **Expert Advantage:** Experts often have access to higher-quality data and better tools for interpretation. They satisfy the competence condition ($p > 0.5$) much more reliably than the general public on technical matters.

  ### Summary: Who is Right?
  **Your friends are right.** The argument that "referendums strictly dominate expert panels" fails because it treats the Condorcet Jury Theorem as a physical law (like gravity) rather than a conditional mathematical model.

  *   **Your Logic:** $n \rightarrow \infty$ implies Correctness $\rightarrow 1$.
  *   **The Missing Premise:** This is only true *if* $p > 0.5$ *and* votes are independent.
  *   **The Reality:** On technical questions, $p_{\text{public}}$ is likely $< 0.5$ and independence is near zero due to shared information environments.

  ### The Professor's Point
  When your professor said the assumptions do "quiet work," they meant that the theorem is often used to *justify* democracy rhetorically, while ignoring the heavy lifting required to make the math work.

  The CJT is actually a better argument for **deliberative democracy** or **representation** than for direct referendums.
  1.  **Deliberation:** Discussion can help raise $p$ (by educating voters) and reduce correlation (by exposing people to diverse arguments), potentially satisfying the assumptions better than a raw vote.
  2.  **Representation:** We elect representatives (or appoint experts) specifically because we acknowledge that for certain classes of problems, the average $p$ of the specialist is higher than the average $p$ of the populace, even if $n$ is smaller.

  **Verdict:** The theorem shows that democracy *can* be epistemically powerful under ideal conditions. It does not prove that *any* large vote is superior to *any* small expert judgment. On complex factual questions, the assumptions of competence and independence usually collapse, rendering the theorem inapplicable.
