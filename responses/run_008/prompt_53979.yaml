prompt: |-
  I'm taking a course on fair machine learning and we just got to the impossibility results, but I think I mixed something up because my notes from a friend in the section don't match what I remember from the lecture. She sent me this paragraph explaining it (she's good at this stuff generally, took the course last year): "The big result everyone cites, from the COMPAS controversy, is that fairness is mathematically impossible. The ProPublica investigation showed the recidivism algorithm was calibrated, meaning each risk score reflects the actual probability of reoffending for that individual, but the judge's follow-up study showed it still gave Black defendants higher false positive rates. The impossibility theorems then proved formally that you can't have calibration and equal error rates at the same time, period. So the unavoidable conclusion is that we should stop using risk scores for these decisions, because a human decision-maker looking at the same case doesn't face this tradeoff, and can be fair in the full sense."

  Something feels off to me about the last sentence especially, and maybe the word "period," since I vaguely remember the lecturer saying something about base rates mattering? Like if two groups actually reoffend at the same rate then it's fine? But I honestly can't reconstruct it. Can you go through her paragraph claim by claim and tell me which parts are accurate, which are subtly wrong (like where she's conflating two different fairness criteria or overstating what the theorems say), and whether the conclusions she draws survive the corrections? Don't just give me a menu of possibilities — I want your definite verdict on each sentence and an overall judgment of whether her summary is fair to the literature, even if you're not fully certain, so commit to a reading and tell me why. If it helps, I'm also curious whether the calibration part of her summary is even describing calibration correctly, since I thought calibration was a statement about averages over groups of defendants, not about getting each individual's true risk right.
