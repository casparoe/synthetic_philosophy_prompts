      *   *Sidgwick's Conclusion on SPR:* He did *not* conclude the evidence was overwhelming. He remained cautious, skeptical, and agnostic. He exposed fraud (e.g., the Eusapia Palladino investigations later, though that was more Myers/Hodgson, Sidgwick was skeptical generally). He famously said the evidence for survival was not sufficient to convince the outside world, though he personally found some phenomena puzzling. The claim that he felt "vindicated" is largely false.
