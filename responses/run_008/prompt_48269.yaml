      *   *Motivation for Ethics:* Partially true but nuanced. He sought a rational basis for morality after losing religious sanctions. He wanted ethics to be scientific/rational.
      *   *The Methods of Ethics:* It is a rigorous systematization of utilitarianism (and intuitionism/egoism). It is *not* natural theology. It is meta-ethical and normative.
      *   *Dualism of Practical Reason:* This is a crucial error in the podcast. The "dualism of practical reason" refers to the conflict between Rational Egoism (what is best for me) and Utilitarianism (what is best for all). It does *not* refer to mind-body dualism or mental/physical causation.
      *   *Psychical Research (SPR):* True, he was a founder and president. He did investigate mediums.
