answer: |-
  # The Development Debate Decision Tree

  **Premise:** All students accept that income gaps between countries are enormous (100:1 ratios exist) and have persisted for at least a century.

  **Instructions:** Start at Node 1. Answer the empirical question based on how you interpret the evidence, not based on which theory you prefer. Follow the branch that matches your judgment of the fact pattern.

  ---

  ### Node 1: The Granularity Fork
  **Look at a map of nighttime light intensity.**
  Do the sharpest discontinuities in economic activity align primarily with **political borders** (e.g., the stark line between Mexico and the US, or North and South Korea), or do they align with **ecological/infrastructural zones** that ignore borders (e.g., the gradual fade from coastal Europe to inland Asia, or the Appalachian region spanning multiple US states)?

  *   **A. Political Borders:** Discontinuities track jurisdiction. Rules and sovereignty matter most. → *Go to Node 2*
  *   **B. Ecological Zones:** Discontinuities track terrain, climate, or market access. Physical reality matters most. → *Go to Node 3*
  *   **C. Within-Country Variation:** The variation *inside* countries (e.g., Lagos vs. rural Nigeria) is larger than the variation *between* country averages. The "nation" is a statistical artifact. → *Leaf 1 (Ontological Skeptic / Sub-national View)*

  ### Node 2: The Malleability Fork (The Korea/Germany Test)
  **Consider cases of rapid economic change.**
  Germany and Japan were destroyed in 1945 but rich by 1960. North and South Korea shared culture and geography for centuries but diverged massively after 1950. Does this prove that **policy/rules can override deep history quickly**, or are these **rare exceptions** driven by unique geopolitical aid/security circumstances that most countries cannot replicate?

  *   **A. Rules Override History:** If you change the incentives, income follows quickly. Deep history is not destiny. → *Go to Node 4*
  *   **B. Exceptions Prove the Rule:** Most countries cannot simply "choose" to be like South Korea. Underlying constraints usually prevent rapid catch-up. → *Go to Node 3*

  ### Node 3: The Persistence Fork (The Americas Test)
  **Look at the "Reversal of Fortune."**
  In 1500, the Aztec and Inca empires (modern Mexico/Peru) were denser and richer than the lands that became the US and Canada. Today, the reverse is true. Does this reversal suggest that **colonial institutions flipped the development path** (extractive where dense, inclusive where empty), or does it suggest that **geography eventually reasserts itself** (temperate zones always win in the long run, 1500 density was a temporary anomaly)?

  *   **A. Institutions Flipped the Path:** The type of colonization determined the trajectory. Density invited extraction. → *Go to Node 5*
  *   **B. Geography Reasserted:** Temperate climates and disease environments ultimately determine productivity regardless of initial institutions. → *Go to Node 6*

  ### Node 4: The Carrier Fork (The Immigrant Test)
  **Look at immigrant earnings in the US.**
  When people move from poor countries to rich countries, do their earnings **converge fully** to the native average within one generation (suggesting place/institutions determine income), or do significant **income gaps persist** across ethnic groups even after controlling for education and location (suggesting culture/values travel with people)?

  *   **A. Convergence:** Place matters, people adapt. Culture is not a binding constraint. → *Go to Node 5*
  *   **B. Persistence:** Cultural traits (trust, work ethic, family structure) carry over and impact income independently of institutions. → *Leaf 2 (Cultural Fundamentalism)*

  ### Node 5: The Identification Fork (The Instrument Test)
  **Consider the standard empirical strategy.**
  To prove institutions cause wealth, researchers use instruments like "settler mortality rates" or "distance from the equator." Do you believe these instruments are **truly exogenous** (affecting income *only* through institutions), or are they **compromised** by omitted variables (e.g., settler mortality also affects culture, disease burden, and crop suitability directly)?

  *   **A. Instruments are Valid:** We can isolate the causal effect of institutions. The correlation is not just reverse causation. → *Leaf 3 (Strong Institutions View)*
  *   **B. Instruments are Compromised:** Everything is endogenous. Institutions, geography, and income co-evolve. We cannot statistically separate them with N=150. → *Leaf 4 (Methodological Skeptic)*

  ### Node 6: The Channel Fork (The Tropics Test)
  **Consider the "Tropical Penalty."**
  Tropical countries are poorer. Is this because **heat and disease directly reduce labor productivity and crop yields** (a biological/physical constraint), or because **tropical conditions made state-building and property rights harder to establish historically** (a behavioral/institutional constraint)?

  *   **A. Direct Physical Constraint:** Malaria, soil leaching, and transport costs lower output regardless of how good the laws are. → *Leaf 5 (Deep Geography - Direct)*
  *   **B. Indirect Institutional Constraint:** Geography shaped the initial conditions for state formation, but bad geography today matters only because it left behind weak states. → *Leaf 6 (Geography via Institutions)*

  ### Node 7: The Interaction Fork (For Node 6B travelers)
  **If geography works through institutions, is the relationship fixed?**
  Does a specific geography **deterministically select** one type of institution (e.g., tropics *must* have extractive states), or does geography merely **raise the cost** of certain institutions, allowing for human agency and critical junctures to still vary the outcome?

  *   **A. Deterministic Selection:** Geography makes certain institutions impossible or unstable. → *Leaf 6 (Geography via Institutions)*
  *   **B. Probabilistic Constraint:** Geography loads the dice, but politics determines the roll. → *Leaf 7 (Interaction / Co-evolution)*

  ### Node 8: The Equifinality Fork (For Node 2B travelers)
  **If rapid change is rare, why?**
  Is it because there is **one single bottleneck** (e.g., you need inclusive institutions to grow), or because there are **multiple distinct paths** to development (e.g., some grew via extraction, some via agriculture, some via industry) that our models collapse into one error term?

  *   **A. Single Bottleneck:** There is one fundamental cause we are trying to measure. → *Return to Node 6*
  *   **B. Multiple Paths:** The concept of a single "development function" is false. Different contexts require different mechanisms. → *Leaf 8 (Conceptual Skeptic / Pluralist)*

  ---

  ### The Leaves (Named Positions)

  **Leaf 1: Ontological Skeptic / Sub-national View**
  *   **Core Claim:** The nation-state is the wrong unit of analysis. Aggregating to the country level hides the real mechanisms (agglomeration, regional policy, within-country inequality).
  *   **Empirical Signature:** High variance in night lights within borders; borders explain less than distance-to-market.
  *   **Status:** Occupied. (New Economic Geography, Within-country development lit).

  **Leaf 2: Cultural Fundamentalism**
  *   **Core Claim:** Beliefs, values, and social norms are the independent variable. Institutions are just expressions of underlying culture.
  *   **Empirical Signature:** Immigrant income persistence; religious/historical traits correlate with growth after controlling for institutions.
  *   **Status:** Occupied. (Weberian traditions, some modern cultural econ).
  *   **Note:** Pure culture *without* an institutional channel (i.e., culture affects income directly without affecting rules/behavior) is generally considered incoherent and is **Unoccupied**.

  **Leaf 3: Strong Institutions View**
  *   **Core Claim:** Inclusive political and economic institutions are the fundamental cause. Geography and culture are secondary or controlled for.
  *   **Empirical Signature:** Reversal of fortune; Korea split; validity of settler mortality instruments.
  *   **Status:** Occupied. (The "Acemoglu/Robinson" style position).

  **Leaf 4: Methodological Skeptic**
  *   **Core Claim:** The debate is unresolvable with current data. N=150, centuries of lag, and perfect co-linearity between geography, institutions, and culture make causal identification impossible.
  *   **Empirical Signature:** Fragility of results to small changes in specification; failure of instruments to pass exclusion restrictions.
  *   **Status:** **Highly Occupied.** (This is not a footnote; it is the dominant view among econometricians specializing in development).

  **Leaf 5: Deep Geography (Direct)**
  *   **Core Claim:** Physical environment determines productivity. Disease, climate, and transport costs are the binding constraints.
  *   **Empirical Signature:** Tropical penalty persists even in countries with "good" institutions; crop yield differentials.
  *   **Status:** Occupied. (The "Sachs/Diamond" style position).

  **Leaf 6: Geography via Institutions**
  *   **Core Claim:** Geography matters, but *only* because it historically shaped institutional development. Today, geography has no direct effect, only an indirect one through the persistence of rules.
  *   **Empirical Signature:** Once you control for institutions, latitude/disease loses significance.
  *   **Status:** Occupied. (A subset of the Institutions view, but distinct in mechanism).
  *   **Observational Equivalence Warning:** This leaf is observationally very similar to Leaf 3 (Strong Institutions). The tree cannot separate them without micro-level historical data on *why* institutions formed.

  **Leaf 7: Interaction / Co-evolution**
  *   **Core Claim:** No single factor is fundamental. Geography selects for institutions, institutions shape culture, culture modifies geography. It is a multiplicative system.
  *   **Empirical Signature:** Context-dependent effects; instruments work in some regions but not others.
  *   **Status:** Occupied. (The "It's complicated" view, but rigorously specified as interaction terms rather than a cop-out).

  **Leaf 8: Conceptual Skeptic / Pluralist**
  *   **Core Claim:** There is no single "development function." Rich nations arrived there via different historical paths (equifinality). Searching for *the* cause is a category error.
  *   **Empirical Signature:** Successful development strategies look radically different across cases (e.g., China vs. Botswana vs. UK).
  *   **Status:** Occupied. (Historical institutionalism, complexity economics).

  ---

  ### Observational Equivalence & Identification Warning

  **For the Instructor:**
  Be prepared to highlight that **Leaf 3 (Strong Institutions)** and **Leaf 6 (Geography via Institutions)** are observationally equivalent on most cross-country regressions.
  *   *Why?* If Geography causes Institutions, and Institutions cause Income, a regression of Income on Institutions will show a strong effect (Leaf 3). A regression of Income on Geography will also show an effect, but it will vanish when controlling for Institutions (Leaf 6).
  *   *The Trap:* Students often think ruling out Direct Geography (Leaf 5) proves Strong Institutions (Leaf 3). It does not. It only proves Geography is not *direct*. It could still be the *root* cause working indirectly.
  *   *The Only Way Out:* You need historical case studies (critical junctures) where institutions changed *without* geography changing, and *without* culture changing (e.g., the Korea split). If you don't accept the Korea case as generalizable, you are forced toward Leaf 4 (Skeptic) or Leaf 6 (Geo-via-Inst).

  ### Scoring Key (For Student Self-Reflection)

  *   **Mostly A answers:** You lean toward the **Institutionalist** consensus. You believe policy matters and history is not destiny. Watch out for Leaf 4 (are your instruments actually valid?).
  *   **Mostly B answers:** You lean toward **Structural/Geographic** determinism. You believe constraints are real and hard to overcome. Watch out for Leaf 1 (are you ignoring within-country variation?).
  *   **Mixed A/B with Node 5 = B:** You are a **Methodological Skeptic**. You understand the theory but don't trust the empirical identification. This is a defensible and sophisticated position.
  *   **Node 1 = C:** You are a **Spatial Economist**. You should stop looking at country-level data and start looking at grid-cell data.
  *   **Node 8 = B:** You are a **Historical Pluralist**. You reject the search for universal laws in favor of contextual narratives.

  ### Unoccupied/Incoherent Spaces
  *   **Pure Culture (No Institution Channel):** The view that culture affects income *without* affecting behavior, rules, or investment decisions is incoherent. Culture must work *through* something.
  *   **Pure Geography (No Institution Channel) in Modern Era:** The view that geography *directly* determines income in a world of global trade and air conditioning is increasingly hard to defend without acknowledging the institutional mediation (Leaf 6).
