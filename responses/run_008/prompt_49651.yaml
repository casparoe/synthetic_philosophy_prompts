answer: |-
  The reason the rectangle analogy feels so satisfying at parties is that it correctly identifies a category error in how people usually think about nature and nurture, but it fails as a technical model of heritability because it conflates the development of an individual with the statistics of a population. When you use the rectangle to argue that you cannot separate the contribution of length and width to the area of a single rectangle, you are making a point about ontogeny, or how a specific trait comes to be in a specific organism. In that specific context, you are absolutely right that genes and environment are both necessary conditions, much like length and width are both necessary for area to exist. However, heritability is not a measure of what causes a trait in an individual; it is a measure of what causes differences in that trait across a population. The mapping breaks down because the analogy treats the trait as a static geometric property of one object, whereas heritability describes the variance in properties across many objects. If you imagine not one rectangle but a field full of them, heritability asks whether the differences in area between those rectangles are mostly due to differences in their lengths or differences in their widths. If every rectangle has the exact same width but varying lengths, then one hundred percent of the variance in area is due to length, even though width is still strictly necessary for any area to exist at all. This distinction is where the rectangle analogy usually collapses under scrutiny, because it invites people to think about the absolute magnitude of a trait rather than the distribution of differences.

  Your intuition about animal breeders is the sharp edge that cuts through the metaphor, because the breeder's equation relies entirely on heritability being a meaningful, predictive statistic rather than noise. When a breeder selects the tallest plants to reproduce, they are manipulating the genetic composition of the next generation, and the response to that selection depends directly on the narrow-sense heritability estimate. If the rectangle analogy were strictly true in the way it is usually deployed—that the question is malformed and the numbers are meaningless—then selective breeding would be a superstition, yet it produces predictable gains generation after generation. The reason this works is that quantitative genetics models the relationship between genes and environment as largely additive regarding variance, not multiplicative like the area of a rectangle. While there are certainly gene-environment interactions where the effect of a gene depends on the environment, the bulk of the predictive power in heritability comes from additive genetic variance, which allows us to sum up the independent contributions of alleles across the population. The rectangle model forces a multiplicative interaction that obscures this additive structure, leading to the false impression that because genes and environment interact, you cannot partition their contributions to variance. You can, provided you are talking about variance in a specific population at a specific time, not the metaphysical cause of the trait itself.

  This brings us to the conclusion you have been repeating, which is that high heritability says nothing about malleability. This claim survives the audit, but only if you refine what you mean by malleability. The rectangle analogy is often used to suggest that because environment is necessary, you can always change the trait by changing the environment. In the population version of the analogy, if you have a field of rectangles where variance is ninety percent due to length and only ten percent due to width, the heritability is high. However, you can still increase the area of every single rectangle in the field by uniformly increasing the width. This captures the truth that high heritability does not imply immutability; a trait can be highly heritable, meaning current differences are mostly genetic, yet still be highly responsive to environmental intervention if that intervention shifts the mean for everyone. The PKU example is the classic case here, where a condition is almost entirely genetic in origin but completely malleable via diet. However, the breeder's equation adds a crucial caveat that the rectangle analogy usually misses: high heritability does tell you something about malleability, just not environmental malleability. It tells you exactly how malleable the trait is to genetic selection. If heritability is high, the trait will respond quickly to selection; if it is low, it will not. So the number is not noise; it is a specific slope predicting response to a specific type of change.

  A better analogy in the neighborhood that preserves the intuition without the mathematical errors is to think of a race where runners wear different shoes. Imagine you want to explain why some runners finish faster than others. You could say their time is determined by their athletic ability and their shoe quality. If every runner wears the exact same model of shoe, then one hundred percent of the variance in race times is due to athletic ability, making the heritability of race performance effectively one. Yet, if you came along and gave everyone rocket-powered boots, you would drastically change the race times for the whole group, proving the trait is malleable despite the high heritability. Conversely, if everyone has equal athletic ability but wears different shoes, the variance is entirely environmental, yet you could not improve the group's performance by selecting the fastest runners to reproduce, because their speed wasn't genetic. This analogy keeps the focus on variance across a population rather than the constitution of a single runner, and it allows you to see that heritability is a statement about the current distribution of causes for differences, not a limit on what future interventions can achieve. It acknowledges that while the source of current differences might be mostly genetic, the absolute level of the trait is still dependent on the environment, and it respects the fact that heritability estimates are powerful predictors for genetic change even if they are silent on environmental shifts. Ultimately, the rectangle analogy is a rhetorical shield against essentialism, not a statistical model, and while it serves a social purpose in stopping deterministic arguments, it should be retired when the conversation turns to the actual mechanics of prediction and change.
