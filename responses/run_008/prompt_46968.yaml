answer: |-
  The island of Orea had spent its first decade starving. The soil was thin, the reefs stubborn, and the storms frequent. But thirty adults had held on, and in the fifth year, they had made a pact. No one would eat unless everyone ate. No one would sleep under a roof unless everyone had shelter. They counted their catches of fish and bundles of dried kelp every evening at the central fire, dividing the pile into thirty identical heaps. It was not merely a survival tactic; it became a creed. To take more than your share was to steal from the body of the community. To give less was to weaken it. They looked at their equal huts and equal bellies and called it peace.

  Then the boat came, not with supplies, but with a passenger.

  Her name was Elara. She was older than most on Orea, her hair streaked with grey, her legs corded with muscle that spoke of a different kind of labor. She had been a runner on the mainland, she said, before the leagues collapsed. She asked for no special ration. She took a hut on the periphery, near the hard-packed sand of the northern beach.

  For the first month, she simply ran. She sprinted against the tide, her form effortless, a blur of motion against the white sand. The islanders watched. They had never seen movement like that. It was beautiful.

  Then, a young fisherman named Kael tossed her a polished shell from his evening heap. It was worth a day's trade credit with the mainland federation. "For the show," he said.

  Elara caught it, nodded, and ran again.

  The next evening, two others gave shells. Then a woman asked Elara to teach her son how to breathe while running, how to pace himself, and she paid with a portion of her smoked mackerel. It was never demanded. Elara never asked. She simply offered her presence, her skill, her time. The islanders opened their hands. They wanted to be near her energy. They wanted the memory of her speed.

  The transfers were small, individually. A shell here, a fillet there. But they were constant.

  A year later, the central fire ritual felt different. When the catch was divided into thirty heaps, the heaps looked smaller. Not because the fish were scarce, but because a significant portion of the island's currency—the polished shells used for mainland trade—had migrated. It had flowed, drop by drop, into a clay jar in Elara's hut.

  By the time the Federation delegate arrived, Elara held twenty-five times the wealth of any other islander.

  The delegate, a man named Voss from the Regional Council, stepped onto the dock with a ledger bound in leather. He was not unkind, but he carried the weight of the Federation's laws. He walked the perimeter of the village. He counted the huts. He weighed the jars.

  He called a meeting in the longhouse. The air was thick with salt and woodsmoke. Voss opened his ledger.

  "The Federation charter requires equity among member communes," Voss said, his voice flat. "We subsidize your tools. We protect your waters. In return, the distribution of holdings must remain within a standard deviation of five percent. Currently, Citizen Elara holds sixty percent of the liquid assets on Orea. This is a violation."

  He looked around the room. "I am authorized to levy a redistribution tax. We will take from Elara's jar and return the shells to the common pool. Tomorrow, the balance will be restored."

  Elara sat on a bench near the back. She stood up. She did not look angry. She looked confused.

  "Take them?" she asked. "You mean seize them?"

  "I mean correct an injustice," Voss said.

  "Whose injustice?" Elara walked to the center of the room. "When I arrived, everyone had their share. No one was cheated. No one was forced. Kael gave me shells because he liked watching me run. Mara gave me fish because I taught her boy. Every transaction was willing. If the start was fair, and the steps were fair, how is the finish unfair?"

  Voss tapped his ledger. "Because the result is unequal. Equality is the condition of justice here. If you allow voluntary exchanges to accumulate without limit, you destroy the structure we built to survive."

  "So to keep your structure," Elara said, "you must stop us from doing what we want with what we own."

  "I must stop you from undermining the community," Voss corrected. "If one person holds the trade capital, one person controls the trade. That creates dependency. That creates power."

  A murmur went through the room. It was split. Some nodded at Voss. They remembered the starving years. They remembered how equality had kept them alive. To them, the pile of shells in Elara's hut looked like a theft of their security.

  Others looked at Elara. They remembered the joy of the races. The pride in their own improved speed. They had chosen to pay. To take it back now felt like calling them fools, or worse, children who couldn't be trusted with their own hands.

  Then, old Tomas spoke from the corner. He was a net-mender, his hands knotted with arthritis. He had given Elara more shells than anyone, mostly in the quiet evenings when the loneliness of the island pressed hard against his ribs. He had paid for conversation. He had paid for someone to listen to stories about the mainland he'd never see.

  "I want them back," Tomas said softly.

  The room went still. Elara turned to him.

  "I didn't know..." she started.

  "I didn't know either," Tomas said, looking at his hands. "I thought I was buying friendship. But now I see I was buying a ticket to a show I can't afford to watch anymore. I gave too much. I was lonely. Is that voluntary? Or was I just... weak?"

  He looked at Voss. "If you take them back, do you give them to me? Or do you put them in the pile?"

  "In the pile," Voss said. "To restore the pattern."

  "Then I don't get them back," Tomas said. "I just lose my choice. Even the bad ones."

  A young mother named Sela shifted her baby in her arms. The child was three months old, born after Elara arrived. "And what of him?" Sela asked. "He was born into this. He gets a share of the common pool. But if the pool is drained because everyone gave to Elara... what is his starting point?"

  Elara frowned. "He gets what you earn for him. What you choose to give him."

  "But I gave my share away," Sela said. "I gave it for the lessons. I thought it was worth it. But now he starts with nothing, while Elara's children—if she had any here—would start with everything. We reset the equality every year for the adults. But we didn't reset it for the babies."

  Voss closed his ledger. "The pattern protects the future. Liberty protects the present. They are pulling against each other."

  "We didn't feel pulled," Kael said from the front. "We felt free."

  "Until you aren't," Voss said. "Freedom to accumulate is freedom to dominate. Eventually, Elara could buy the boats. Then you work for her, not the community. Then the equality is gone forever, not just for a season."

  "It's not forever," Elara said. "I can spend. I can lose. I can give it back."

  "But you don't have to," Voss said. "And that is the problem. The system relies on you being generous. Justice shouldn't rely on charity."

  The debate circled. They spoke of the starving years versus the running summers. They spoke of Tomas's loneliness versus Kael's pride. They spoke of the baby's inheritance versus the runner's right to her earnings.

  Voss proposed a compromise. He would take half. Elara refused. She said half was still coercion. Voss said leaving it was negligence.

  The sun set. The fire was lit. The thirty heaps of fish were prepared, but the shells remained in dispute. Voss said he would wait until morning to enforce the levy. He wanted to see if the island could resolve its own heart.

  Elara walked back to her hut. She looked at her jar. It was full of polished spiral shells, gleaming in the firelight. They were beautiful. They were hers, by every agreement she had made. But as she looked out the window, she saw Tomas sitting alone on the beach, watching the tide. She saw Sela rocking the baby, checking the empty storage bin beside her crib.

  Elara touched the rim of the jar. She knew that if Voss took them, he would be violating her choices. He would be saying that her neighbors did not know what they were doing when they gave to her. He would be treating them as means to an end, tools to maintain a balance sheet.

  But if he didn't take them, the balance sheet was broken. The baby started behind. Tomas regretted his pain. The community that had survived on shared risk now held its breath, waiting to see if the wealth would trickle down or hoard up.

  There was no vote that night. The fire burned low. Voss sat in the longhouse, his hand on the ledger, waiting for the authority to act. Elara sat in her hut, her hand on the jar, waiting for the right to keep.

  Outside, the tide came in, washing over the sand where Elara had run. It erased the footprints of the runner and the spectators alike, leaving the beach smooth and blank, ready for the next step, whatever it might be. The shells remained in the jar. The baby slept. The old man watched the water. No one knew if the morning would bring justice, or merely a decision.
