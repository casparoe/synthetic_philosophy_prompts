          *   Outcome: She ends up with 25x what others have.
          *   Conflict: Mainland delegate visits, declares it unjust, proposes leveling.
          *   Counter-argument: Sprinter & islanders argue transfers were voluntary, starting point was just, so endpoint must be just unless coercion is used.
          *   Complication: Need to complicate the logic (e.g., regret, intergenerational equity, hidden coercion of circumstance).
          *   Resolution: No clear winner, no speeches resolving the argument. Ambiguity is key.
