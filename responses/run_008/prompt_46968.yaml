  2.  **Deconstruct the Philosophy (Nozick/Wilt Chamberlain):**
      *   *Premise 1:* Justice in holdings depends on how they were acquired (historical entitlement), not on the resulting pattern (end-state).
      *   *Premise 2:* If the starting distribution is just, and transfers are voluntary, the resulting distribution is just.
      *   *The Argument:* Liberty upsets patterns. To maintain a pattern (like equality), you must continuously interfere with voluntary choices.
      *   *The Complication (for the story):* Nozick assumes the starting point is just and stays relevant. Critics argue about the impact on others (externalities), the validity of consent under social pressure, or intergenerational justice (what about the kids?).

