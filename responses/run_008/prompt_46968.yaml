  5.  **Writing - Focus on Sensory Details & Subtext:**
      *   Avoid "justice," "rights," "liberty." Use "fair," "own," "choice," "balance."
      *   Show the shells piling up in Elara's hut.
      *   Show the Delegate's ledger.
      *   Show the children playing with uneven toys.

  6.  **Refining the Narrative Voice:**
      *   Third-person limited or omniscient but neutral.
      *   Keep it grounded. The shells represent currency/resources.
      *   Ensure the word count fits.

  7.  **Drafting - Step-by-Step (Mental or Scratchpad):**
