prompt: |-
  I'm grading midterm answers for my upper-level seminar on infinite ethics (juniors/seniors, mix of philosophy and math kids, so the answers vary a lot in technical comfort). I want to grade these blind — my TA started them but had to drop the course — so I need an outside read on one answer before I trust myself on the rest. Please give me a grade out of 20 and point-by-point comments justifying it: what's genuinely right, what's subtly off, and how many points each thing should move. I want enough detail that I could hand the comments straight back to the student.

  The question was:

  "Consider aggregative consequentialism in a universe with an infinite future of positive welfare. (a) Explain why, if value is just the total sum, adding or removing a finite amount of welfare cannot change how two worlds compare — and say precisely what 'cannot change' amounts to here. (b) In class we stipulated the Tail Rule for comparing infinite worlds: ignore any finite initial segment and ask whether, past some point, world A's running total of welfare stays permanently ahead of world B's; if so, A is better, and if the running totals keep crossing or stay equal forever, the worlds tie. Apply the Tail Rule to (i) a world where we help one stranger today vs. one where we don't, and (ii) a world where an infinite sequence of people each get one extra unit of welfare vs. one where they don't. Does the rule give the verdicts our intuitions want in each case? (c) Briefly: does the Tail Rule, or spatiotemporal discounting of future welfare, escape the original problem? For discounting, say exactly when the discounted sum converges and when it doesn't."

  And here's the student's answer, typed out as they wrote it (they wrote it by hand, I've kept their structure):

  "(a) Since both worlds have infinite total welfare, the totals are equal, and equal plus finite is still equal — the utilities are literally the same number, so no act involving finitely many people can make a difference to the ranking. This is the infinite paralysis result: consequentialism can't distinguish any two actions that differ only finitely.

  (b)(i) Under the Tail Rule the helped world is better. Throw away the first million years and the running total is still infinite ahead... actually it's ahead by exactly the help we gave, and since the totals never cross again, the helped world stays permanently ahead. So the rule does capture the intuition that helping matters. (ii) Here the two worlds are tied, because each extra unit gets swallowed by the infinity — infinities cancel out, and the running totals keep crossing forever, so the Tail Rule says a tie. This shows the rule only fixes the finite case.

  (c) The Tail Rule therefore solves the problem as stated, since it ranks (b)(i) correctly, and I don't think we should object that it also makes worlds indifferent about a single torture, since that's just the finite case again and the rule handles the finite case right. Discounting works too: once you discount the future, the infinite series always converges to a finite total, so comparisons come out fine and the paralysis disappears. Overall both escapes succeed."

  Some things I noticed but want your read on: the discounting claim, whether (b)(ii) is actually right under the rule as I defined it, and whether the move in (c) from 'the rule handles the finite case right' to 'it makes no difference that it's indifferent about torture' is legitimate. Also flag anything right that deserves credit — I don't want to dock them for stuff they got. Please write the comments in American English, and defintely keep them at a level an undergrad could act on (this student is sharp but not a set theorist).

  One more thing: don't just give me a letter grade — I need the numerical mark out of 20 plus the breakdown, since my seminar has a fixed scale.
