      *   **User:** A science writer for a general-interest magazine.
      *   **Context:** Interviewed a theorist about the foundations of physics (what laws *do*).
      *   **Physicist's Stance:** "Laws of nature are descriptions, not prescriptions — they don't push anything around, they just compress what happens." Used this to decline questions about enforcement and contingency (could the universe have been lawless?).
