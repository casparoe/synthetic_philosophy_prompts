answer: |-
  This is a sophisticated request that targets a specific logical phenomenon known in philosophy and law as the **Discursive Dilemma** (or Doctrinal Paradox). Running this without jargon is the right call; the power comes from the *feeling* of the contradiction, not the name.

  Below is the complete runnable package. It is designed to be printed and handed out.

  ### **Workshop Overview**

  *   **Title:** The Consistency Trap: Decision Logic in Engineering Leadership
  *   **Time:** 90 Minutes
  *   **Participants:** 12 Tech Leads (4 Groups of 3)
  *   **Goal:** Experience how aggregating votes on *reasons* can yield a different outcome than aggregating votes on *decisions*, and establish a team charter for handling this tension.
  *   **Materials Needed:**
      *   Printed Role Cards (4 sets of 3 distinct roles).
      *   Printed "Decision Worksheet" (1 per group).
      *   Printed "Charter Template" (1 per group).
      *   Printed "Case B: Promotion Review" (1 per group).
      *   Whiteboard/Flipchart for final debrief.
      *   Timer.

  ---

  ### **Part 1: Facilitator Script & Timeline**

  #### **0:00 – 0:10 | Introduction & Setup**
  **Facilitator:** "Welcome. We're not doing slides today. We're doing a simulation. You are an Incident Review Board. Your job is to classify a recent P1 outage in the Payment Service.
  You have two classification options:
  1.  **Process Failure:** Triggers a mandatory runbook rewrite, blameless postmortem, and 10 engineering hours of follow-up.
  2.  **Act of God:** No follow-up required. We absorb the risk.

  **The Rule:** A 'Process Failure' classification requires **ALL THREE** of the following conditions to be true:
  1.  **Deviation:** The on-call engineer deviated from the documented runbook.
  2.  **Efficacy:** The runbook, if followed, would have prevented the outage.
  3.  **Causality:** The deviation directly caused the damage.

  If *any* of these are false, it is an 'Act of God.'

  You have 15 minutes to review your evidence, vote on the three conditions, and reach a final verdict. Do not talk to other groups yet."

  *(Hand out Role Cards and Decision Worksheets to each group.)*

  #### **0:10 – 0:35 | Phase 1: The Incident (The Trap)**
  **Task:**
  1.  Read role cards silently (3 mins).
  2.  Discuss the evidence.
  3.  **Step A:** Vote on Premise 1, 2, and 3 individually. Record the Majority Vote for each.
  4.  **Step B:** Determine the "Logical Verdict" based *only* on the Majority Premises. (If Majority says Yes to all 3, Verdict = Process Failure).
  5.  **Step C:** Vote on the "Final Verdict" directly (Process Failure vs. Act of God). Record the Majority Vote.

  **Facilitator Note:** Watch the groups. When they realize Step B and Step C contradict, they will get confused. Let them sit in that confusion for 2 minutes before intervening.

  **Intervention (at 0:30):** "Stop discussion. Look at your Worksheet. Does your 'Logical Verdict' match your 'Final Verdict'? If they differ, do not fix it yet. Circle the discrepancy."

  #### **0:35 – 0:55 | Phase 2: The Charter (The Rule)**
  **Facilitator:** "You just encountered a consistency error. In a real company, this leads to confused engineers and wasted work. You need a **Decision Charter**. This is a rule for how your board aggregates opinions when facts are disputed.

  You must choose one of two aggregation methods for all future decisions:
  *   **Method A (Premise-Based):** We vote on the facts. The final verdict is mathematically derived from the majority facts. (Logic wins).
  *   **Method B (Conclusion-Based):** We vote on the final verdict directly. The facts are just discussion points. (Democracy wins).

  **Task:**
  1.  Choose Method A or B.
  2.  Write down *why*.
  3.  I am now handing you **Case B**. Apply your chosen Charter to this new case.
  4.  **Stake:** Another group will audit your consistency. If you violate your own Charter, you lose 'Credibility Points.'"

  *(Hand out Case B: Promotion Review. See materials below.)*

  #### **0:55 – 1:10 | Phase 3: The Audit**
  **Task:**
  1.  Swap Charters and Case B Results with the group to your left.
  2.  Audit them: Did they follow their own rule?
  3.  Return results.

  **Facilitator:** "Keep your Credibility Points in mind. We will tally them at the end."

  #### **1:10 – 1:30 | Debrief & Reality Check**
  **Facilitator:** (Move to whiteboard).
  1.  **Reveal the Structure:** Draw the 3x3 grid on the board. Show how a majority on premises does not guarantee a majority on conclusions.
  2.  **Connect to Reality:** "Raise your hand if you've been in a promotion committee where we voted 'Yes' on every competency, but 'No' on the promotion? Or vice versa?"
  3.  **Discuss the Choice:** "Which method did you pick? Method A feels rigorous but can override individual judgment. Method B feels democratic but can be illogical."
  4.  **Limitations:** (See "Limitations" section below).

  ---

  ### **Part 2: Printable Materials**

  #### **1. Role Cards (Print 4 sets of this page)**
  *Cut these into strips. Give one to each person in the group.*

  | **ROLE 1: The SRE Lead** | **ROLE 2: The Product Manager** | **ROLE 3: The Staff Engineer** |
  | :--- | :--- | :--- |
  | **Investigation Focus:** Runbook Adherence | **Investigation Focus:** System Behavior | **Investigation Focus:** Causal Chain |
  | **Finding 1 (Deviation):** **YES.** Logs show the on-call skipped the "Drain Queue" step. It is clear in the logs. | **Finding 1 (Deviation):** **NO.** The runbook is ambiguous. The step they skipped was marked "Optional" in v2, though "Required" in v1. I count this as *No Deviation*. | **Finding 1 (Deviation):** **YES.** Regardless of ambiguity, the standard operating procedure was not followed. |
  | **Finding 2 (Efficacy):** **YES.** The queue drain would have cleared the backlog before the timeout. | **Finding 2 (Efficacy):** **YES.** We tested this in staging. The runbook works. | **Finding 2 (Efficacy):** **NO.** The timeout was caused by a downstream provider outage, not the queue. The runbook wouldn't have fixed the provider. |
  | **Finding 3 (Causality):** **NO.** The damage was financial reconciliation errors, not the timeout. The skip didn't cause the *money* loss. | **Finding 3 (Causality):** **YES.** The timeout triggered the reconciliation failure. If no timeout, no failure. | **Finding 3 (Causality):** **YES.** The chain of events is unbroken from skip to loss. |
  | **YOUR VERDICT:** <br>Since Finding 3 is No, this is **Act of God**. | **YOUR VERDICT:** <br>Since Finding 1 is No, this is **Act of God**. | **YOUR VERDICT:** <br>Since Finding 2 is No, this is **Act of God**. |

  *(Note for Facilitator: Every group has the exact same distribution. 2/3 say Yes to Deviation. 2/3 say Yes to Efficacy. 2/3 say Yes to Causality. But 0/3 say Yes to the Final Verdict.)*

  #### **2. Decision Worksheet (1 per Group)**

  ```text
  GROUP DECISION WORKSHEET
  ------------------------
  STEP A: PREMISE VOTES (Majority Rule)
  1. Deviation?      [ ] YES  [ ] NO   (Majority: ______)
  2. Efficacy?       [ ] YES  [ ] NO   (Majority: ______)
  3. Causality?      [ ] YES  [ ] NO   (Majority: ______)

  STEP B: LOGICAL VERDICT (Based on Step A)
  If Step A is all YES -> Process Failure. Otherwise -> Act of God.
  Result: ________________________

  STEP C: DIRECT VERDICT VOTE (Majority Rule)
  [ ] Process Failure
  [ ] Act of God
  Result: ________________________

  CONSISTENCY CHECK:
  Does Step B match Step C?  [ ] YES  [ ] NO
  ```

  #### **3. Charter Template (1 per Group)**

  ```text
  BOARD CHARTER
  -------------
  We, the Review Board, agree to decide future cases using:

  [ ] METHOD A: Premise-Based Aggregation
      (We vote on facts. The verdict is calculated from the facts.)

  [ ] METHOD B: Conclusion-Based Aggregation
      (We vote on the verdict. Facts are for discussion only.)

  RATIONALE:
  (Why did you choose this? What risk are you mitigating?)
  _________________________________________________________________
  _________________________________________________________________

  SIGNATURES:
  _________________  _________________  _________________
  ```

  #### **4. Case B: Promotion Review (1 per Group)**
  *This bridges the incident scenario to the promotion scenario mentioned in your prompt.*

  ```text
  CASE B: PROMOTION REVIEW (L5 TO L6)
  -----------------------------------
  CONTEXT: Candidate "Alex" is up for promotion.
  RULE: Promotion requires ALL THREE competencies to be "Met":
  1. Technical Depth
  2. Project Leadership
  3. Mentorship

  EVIDENCE DISTRIBUTION (Group Consensus):
  - Majority says "Met" on Technical Depth.
  - Majority says "Met" on Project Leadership.
  - Majority says "Met" on Mentorship.

  HOWEVER:
  - The person who voted "No" on Technical Depth feels strongly Alex is unsafe.
  - The person who voted "No" on Leadership feels Alex is a blocker.
  - The person who voted "No" on Mentorship feels Alex is toxic.
  - NO SINGLE PERSON voted "Met" on all three.

  TASK:
  Apply your CHARTER (Method A or B) to decide:
  [ ] PROMOTE
  [ ] NO PROMOTE

  Record the result and be prepared to defend if it feels "fair."
  ```

  ---

  ### **Part 3: The Debrief Guide (Facilitator Notes)**

  #### **1. Revealing the Mechanism (5 Mins)**
  Draw this on the whiteboard. It validates their confusion.

  | Role | Deviation? | Efficacy? | Causality? | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: |
  | **Role 1** | Yes | Yes | **No** | **No** |
  | **Role 2** | **No** | Yes | Yes | **No** |
  | **Role 3** | Yes | **No** | Yes | **No** |
  | **MAJORITY** | **Yes** | **Yes** | **Yes** | **NO (0-3)** |

  **Say:** "Look at the bottom row. The group believes P1 is true. The group believes P2 is true. The group believes P3 is true. Logically, the group *must* believe the Verdict is Yes. But when you asked the humans for the Verdict, they all said No.
  This is not a bug in your reasoning. It is a mathematical feature of majority voting on conjunctions."

  #### **2. Connecting to Promotions (5 Mins)**
  **Say:** "In the promotion committee story I mentioned: We voted 'Meets' on every competency (The Premises). But we voted 'No Promotion' on the person (The Conclusion).
  Why? Because the *intersection* of voters who believed *all* competencies were met was empty.
  *   Voter A thought Competency 3 was weak.
  *   Voter B thought Competency 1 was weak.
  *   Voter C thought Competency 2 was weak.
  Individually, they were defensible. Collectively, they were contradictory."

  #### **3. Method A vs. Method B Discussion (5 Mins)**
  Ask the groups: "Which Charter did you pick?"
  *   **If Method A (Premise):** "You prioritized logical consistency. **Risk:** You might promote someone (or blame an engineer) when *no one* actually thinks they deserve it. You are outsourcing judgment to the math."
  *   **If Method B (Conclusion):** "You prioritized individual agency. **Risk:** You create policy inconsistency. Today you say 'Deviation = Blame', tomorrow you say 'Deviation = No Blame' based on who is in the room."

  #### **4. Limitations & Reality Check (5 Mins)**
  *Be honest about what the simulation hides.*

  **Say:** "This simulation is clean. Real life is messy. Here is what this model cannot capture:
  1.  **Persuasion:** In this game, your role cards were fixed. In reality, Role 1 could have convinced Role 3 that Causality *was* linked. Discussion resolves paradoxes by changing minds, not just counting votes.
  2.  **Intensity:** A 'No' vote isn't just a 'No'. One person might feel 'Mildly No' and another 'Veto No'. Majority voting ignores intensity of preference.
  3.  **Power Dynamics:** In this room, you are peers. In a promotion loop, a VP's 'No' weighs differently than a Manager's 'No'. This math assumes equality.
  4.  **Binary Traps:** Real competencies aren't Yes/No. They are spectra. Forcing binary votes creates artificial paradoxes.

  **Takeaway:** Don't try to solve the paradox with math. Solve it with **process**. If you see this contradiction in a meeting: **Stop voting.** Start discussing. The paradox is a signal that the group does not share a mental model, not that the group is broken."

  ---

  ### **Part 4: Anticipated Failure Modes (For You)**

  1.  **The "Fix It" Instinct:** Engineers hate contradictions. They will try to "solve" the incident in Phase 1 by debating the facts until they align.
      *   *Counter:* Be strict. "You have 5 minutes left. Lock your votes. If they contradict, let them contradict."
  2.  **The "It's Stupid" Reaction:** Someone might say, "Obviously we should just talk until we agree."
      *   *Counter:* Validate them. "You're right. Discussion is the cure. But this exercise shows you *why* discussion is necessary. Without it, the vote lies to you."
  3.  **Time Overrun:** Phase 1 often drags because people want to read the cards thoroughly.
      *   *Counter:* Call time hard. The confusion is the point; they don't need to solve the incident, they need to feel the vote split.
  4.  **Promotion Sensitivity:** Since you mentioned the promotion committee issue actually happened, participants might get anxious about re-litigating that specific candidate.
      *   *Counter:* Keep the debrief abstract. "This happens in *many* committees," not "This is what happened with *that* candidate."

  ### **Why This Works for Staff Engineers**
  Staff Engineers value leverage and system design. This workshop frames a philosophical problem as a **systemic risk in decision architecture**. It doesn't ask them to be philosophers; it asks them to debug their voting mechanism. The "Credibility Points" and "Audit" phase appeal to their desire for rigor and peer review, while the lack of slides respects their time and intelligence.
