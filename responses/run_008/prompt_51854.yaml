answer: |-
  Here is a 90-minute teaching plan designed for a room of writers. It prioritizes narrative intuition over technical precision, using your specific constraints to structure the flow.

  ### The Setup
  *   **Time:** 90 Minutes.
  *   **Tools:** Whiteboard (split into four quadrants), markers, coffee.
  *   **Rule:** No equations. No code. If it can't be described as a plot problem, it doesn't go on the board.
  *   **Goal:** Move the room from "Agent as God" to "Agent as Organism."

  ---

  ### Part 1: The Order of Operations (10 Minutes)
  **The Hook:** Draw a stick figure outside a box (Cartesian) vs. a stick figure inside a box (Embedded).
  **The Logic:** You must establish the physical constraint before the logical one.
  1.  **Embedded World-Models:** First, admit you are small and the world is big. (Constraint: Capacity).
  2.  **Self-Reference:** Second, admit you have to model yourself inside that world. (Constraint: Recursion).
  3.  **Reasoning About Successors:** Third, admit your future self is part of that model. (Constraint: Time).
  4.  **Subsystem Alignment:** Fourth, admit "you" are actually many things. (Constraint: Unity).

  **Why this order?**
  You can't have a paradox about modeling yourself (2) if you assume you can model the whole world perfectly (1). You can't worry about your future self (3) if you don't have a model of your current self (2). And Subsystem Alignment (4) is the *explanation* for why the first three are so messy (because the "agent" is a leaky abstraction).

  ---

  ### Part 2: The Carrying Example (20 Minutes)
  **The Question:** Does the "Author-in-the-Novel" example carry all four?
  **The Verdict:** **No.** It is strong on Self-Reference and Successors, but it quietly fails on World-Models and Subsystem Alignment.

  **The Fix:** Use a **Hybrid Metaphor**. Stick with the Author for the "Mind" problems, but switch to a **Map** for the "Physical" problems.

  1.  **Embedded World-Models (Use The Map):**
      *   *The Writer Trap:* An author usually *creates* the world, so the world fits in their head.
      *   *The Correction:* Ask them to imagine a **Cartographer drawing a map of the room they are sitting in, on the floor of that room.**
      *   *The Problem:* If the map is 1:1 scale, it covers the floor. If it includes the map itself, it needs to be bigger than the room.
      *   *Takeaway:* You cannot hold a perfect model of a system you are inside. You must use abstractions (lossy compression).

  2.  **Self-Reference (Use The Author):**
      *   *The Scenario:* A character in a novel trying to deduce the rules of the novel they are in.
      *   *The Problem:* If the character figures out they are a character, does that change the plot? If the model includes the modeler, the act of modeling changes the thing being modeled.
      *   *Takeaway:* Observation is an intervention.

  3.  **Reasoning About Successors (Use The Author):**
      *   *The Scenario:* The author-character trying to plan what they will write in Chapter 10 while in Chapter 1.
      *   *The Problem:* To know what they will decide in Chapter 10, they have to *do* the thinking of Chapter 10 now. If they could do it now, they wouldn't need to wait.
      *   *Takeaway:* You cannot perfectly predict your own future reasoning without *becoming* your future self.

  4.  **Subsystem Alignment (Use The Committee):**
      *   *The Writer Trap:* Writers treat "the mind" as a single voice.
      *   *The Correction:* Ask them to imagine the author-character is not a person, but a **Committee of Three Writers** sharing one hand. One wants plot, one wants prose, one wants fame.
      *   *The Problem:* The "Agent" (the Book) wants coherence. The "Subsystems" (the Writers) have local goals. The hand writes a beautiful sentence (Prose wins) that kills the pacing (Plot loses).
      *   *Takeaway:* Agency is not a point; it's a negotiation.

  ---

  ### Part 3: Head Off the Misconceptions (Integrated)
  Do not save these for Q&A. Kill them in the section where they naturally arise.

  **1. "Oh, it's just Map vs. Territory."**
  *   **When:** Part 1 (World-Models).
  *   **The Shut-down:** "Korzybski said the map is not the territory. Embedded agency says the map is *printed on* the territory. If the territory changes, the map lies. If the map changes, the territory is altered. They are physically coupled."
  *   **Whiteboard:** Draw a map. Then draw the paper of the map melting into the landscape.

  **2. "Isn't this just Gödel / Incompleteness?"**
  *   **When:** Part 2 (Self-Reference).
  *   **The Shut-down:** "Gödel is the mathematical proof that this is hard. Embedded agency is the *engineering* problem of building something that works anyway. We aren't proving truth; we're trying to keep the robot from driving off a cliff because it got stuck in a logical loop."
  *   **Whiteboard:** Write "Paradox" then cross it out. Write "Trade-off."

  **3. "So this proves real AI is impossible."**
  *   **When:** Conclusion.
  *   **The Shut-down:** "Humans are embedded agents. You are one. You function. It's not impossible; it's just that 'perfect rationality' is the wrong goal. The goal is 'robust messiness.'"
  *   **Whiteboard:** Draw a stick figure walking. Label it "Good Enough."

  ---

  ### Part 4: What to Refuse to Cover (5 Minutes)
  Be explicit about the boundaries. Put this on the board under "Out of Scope."
  1.  **Consciousness/Qualia:** "We are not discussing if the agent *feels*. We are discussing if the agent *functions*." (Prevents spiritual rabbit holes).
  2.  **The Math of Logic:** "We are not solving the liar paradox. We are managing the risk of it." (Prevents CS folks from taking over).
  3.  **The Solution:** "There is no solved theory of embedded agency yet. We are studying the problem space, not the answer key." (Prevents disappointment when you don't solve AI safety).

  ---

  ### Part 5: The Closing Question (5 Minutes)
  Do not ask "Did you understand?" Ask for application. You want to know if they can spot the *Cartesian Ghost* in their own work.

  **The Question:**
  > "Think of a protagonist in your current work-in-progress. Identify one scene where they act like a God—where they observe a situation without changing it, or make a decision without their own biology/history limiting them. **How would you rewrite that scene if they were truly embedded?** Where does their map fail? Where does their internal committee disagree?"

  **Why this works:**
  *   If they say "They would be more emotional," they missed the point (that's just adding noise).
  *   If they say "Their plan would break because they didn't account for their own fatigue," they get Subsystems.
  *   If they say "They couldn't know the villain's location because gathering that info alerted the villain," they get Embedded World-Models.
  *   If they say "They couldn't commit to the plan because they knew their future self would be scared," they get Successors.

  ### Facilitator Notes for You
  *   **Pacing:** Writers love to talk. Keep the whiteboard moving. If a discussion stalls, draw a new box.
  *   **Tone:** You are not the expert on *writing*; you are the expert on *this specific framework*. Defer to them on character, stand firm on the logic of the framework.
  *   **The "Aha" Moment:** Watch for the moment they realize *they* are embedded agents. That's when the room will get quiet. Let that sit for a second before moving to Subsystems.
