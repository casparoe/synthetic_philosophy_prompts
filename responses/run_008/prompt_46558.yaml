      *   *Section 3: The Verdict.* Does the conclusion survive? No, because the analogy begs the question. It assumes morality is instrumental.
      *   *Section 4: Better Analogy.* Health/Medicine.
      *   *Section 5: Seminar Tips.* Give them specific talking points for Friday.

  7.  **Refining the Philosophy:**
