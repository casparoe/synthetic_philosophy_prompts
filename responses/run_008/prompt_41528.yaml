answer: |-
  To: Coverage Committee
  From: Policy Specification Working Group
  Subject: Desiderata for the Therapy/Enhancement Distinction

  You are correct that the current policy fails because the distinction is being treated as a biological fact rather than a normative construct. A definition that cannot survive the case files is not a definition; it is a placeholder for disagreement. Below are the six desiderata any account must satisfy to function as a coverage criterion.

  Each desideratum includes the **Motivating Case**, the **Requirement**, and a **Status Tag** indicating whether it is *Non-Negotiable (NN)* for a funding body or an *Analytic Preference (AP)* for philosophical consistency.

  ### 1. The Prevention Constraint
  *   **Motivating Case:** **Vaccination and Contraception.** We fund these despite the absence of current pathology. The patient is currently healthy; the intervention prevents a future state of dysfunction.
  *   **Requirement:** The account must classify interventions that maintain species-typical functioning against probable future threats as *therapy*, even if no current deviation from normal function exists. It cannot rely solely on a "restoration" model (fixing what is currently broken).
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, public health measures collapse into "enhancement," violating the insurer's mandate to protect population health.

  ### 2. The Etiological Specificity Constraint
  *   **Motivating Case:** **Growth Hormone (GH).** A girl with Turner syndrome (chromosomal anomaly) vs. a healthy child with familial short stature. Both are equally short; both would grow taller with GH. We fund the former, refuse the latter.
  *   **Requirement:** The account must distinguish between a *pathological cause* of a trait and a *natural variation* of a trait, even when the functional outcome (height) is identical. The line must be drawn at the underlying mechanism, not merely the phenotypic result.
  *   **Status:** **[ANALYTIC PREFERENCE]**. While necessary to match current intuition, this is difficult to enforce clinically. It risks making coverage depend on genetic testing rather than functional need.
  *   **Tension Note:** This conflicts with **Desideratum 3**. If we focus on internal etiology, we risk ignoring environmental causes of disability.

  ### 3. The Environmental Neutrality Constraint
  *   **Motivating Case:** **Hearing Aids and Cochlear Implants.** Is deafness a pathology, or a mismatch between a body and a hearing-centric built environment? If the world were designed for sign language, the "impairment" would vanish.
  *   **Requirement:** The account must classify an intervention as therapy if it mitigates a significant restriction on life opportunities, regardless of whether the "fault" lies in the biology or the environment. It cannot define disability solely by statistical deviation if that deviation is only disadvantageous due to social design.
  *   **Status:** **[NON-NEGOTIABLE]**. To refuse hearing aids because "deafness is natural" is discriminatory. The account must accommodate the interaction between body and world.
  *   **Tension Note:** **Jointly Unsatisfiable Pair:** There is a fundamental tension between **D2 (Etiology)** and **D3 (Environment)**. D2 looks inward for a biological break; D3 looks outward at social function. An account that strictly requires internal biological failure (D2) may fail to cover environmental accommodations (D3), and vice versa. The committee must decide which priority trumps.

  ### 4. The Indication Specificity Constraint
  *   **Motivating Case:** **Stimulants and Beta-Blockers.** Methylprolidate for ADHD vs. off-label study aid; Propranolol for angina vs. stage fright. The molecule and the physiological effect are identical.
  *   **Requirement:** The classification must attach to the *indication* (the treated dysfunction), not the *drug* or the *outcome*. An intervention is therapy only if it targets a recognized dysfunction, even if the functional gain (better focus, calmer heart) is identical to an enhancement use.
  *   **Status:** **[NON-NEGOTIABLE]**. This is the primary firewall against drug diversion and scope creep. Without this, any drug that improves performance becomes fundable.

  ### 5. The Statistical Independence Constraint
  *   **Motivating Case:** **The Slippery Slope / Population Health.** If 90% of the population becomes myopic due to screen use, do glasses become "enhancements" because they restore a statistical minority to a new "normal"?
  *   **Requirement:** The definition of "normal function" cannot shift merely because a pathology becomes statistically common. The line between therapy and enhancement must remain stable despite changes in population health baselines.
  *   **Status:** **[NON-NEGOTIABLE]**. If coverage shifts with prevalence, the insurer's liabilities become unpredictable, and chronic conditions risk declassification as they become epidemics.

  ### 6. The Normative Bridging Constraint
  *   **Motivating Case:** **Cosmetic Cases (LASIK, Tooth Alignment).** Members argue these are "enhancements" because they are elective, yet they improve function and opportunity. Why do we fund some opportunity-expanding interventions and not others?
  *   **Requirement:** The account must do *normative work*. It cannot merely describe a biological state (e.g., "this is a disease"); it must explain why that state creates a *claim* on collective resources. It must distinguish between "better" (enhancement) and "owed" (therapy).
  *   **Status:** **[NON-NEGOTIABLE]**. A purely descriptive biological account (e.g., "this is statistically abnormal") does not justify spending money. The distinction must link to obligation.

  ***

  ### The Knockout Requirement

  You guessed that the **Vaccination Cases (D1)** are the graveyard. You are half-right.

  **The Prevention Constraint (D1)** is indeed the graveyard for the **Biostatistical Account**. Because biostatistical theories define health as the absence of current pathology (restoration), they cannot logically classify prevention (where no pathology exists yet) as therapy without ad-hoc adjustments.

  However, the single requirement that knocks out the *most* candidates for a *funding body* is **The Normative Bridging Constraint (D6)**.
  *   It eliminates the **Biostatistical Account** (describes facts, implies no obligations).
  *   It eliminates the **Eliminativist View** (rejects the premise that the distinction *should* do justificatory work).
  *   Only the **Fair Opportunity Account** attempts to bridge the "is" of biology to the "ought" of coverage.

  If your committee requires the distinction to justify *spending*, D6 is the filter. If your committee requires the distinction to track *biology*, D1 is the filter. Given you are an insurer, D6 is the true gatekeeper.

  ***

  ### Scorecard of Contenders

  | Contender | D1 (Prevention) | D2 (Etiology) | D3 (Environment) | D4 (Indication) | D5 (Stats) | D6 (Normative) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Biostatistical (Boorse)** | **FAIL**. Cannot classify vaccines as therapy (no current dysfunction). | PASS. Strong on internal cause. | **FAIL**. Ignores social context of disability. | PASS. Focuses on physiological function. | **FAIL**. "Normal" shifts with population stats. | **FAIL**. Commits naturalistic fallacy (is $\neq$ ought). | **Rejected**. Fails NN requirements D1, D5, D6. |
  | **Fair Opportunity (Daniels)** | **PASS**. Protects "normal opportunity range" prospectively. | PASS. Pathologies limit opportunity more than variations. | **PASS**. Focuses on opportunity, not just biology. | PASS. Treats dysfunction as opportunity-limiting. | **PASS**. Opportunity range is stable despite stats. | **PASS**. Explicitly links health to justice/obligation. | **Viable**. Best fit, though struggles with D2/D3 tension in cosmetic cases. |
  | **Eliminativist** | **PASS**. Funds based on utility/cost-effectiveness. | **N/A**. Rejects the distinction. | **N/A**. Rejects the distinction. | **N/A**. Rejects the distinction. | **PASS**. No line to shift. | **FAIL**. Rejects the committee's mandate to use the distinction. | **Rejected**. Solves the logic problem by dissolving the policy. |

  **Recommendation:** Adopt the **Fair Opportunity** framework but explicitly codify how to handle the **D2/D3 Tension** (Etiology vs. Environment). You must decide if a "dysfunction" requires an internal biological break (Turner's) or if an external mismatch (Deafness in a hearing world) suffices for coverage. The current ambiguity in your case files stems from voting on cases without resolving this specific tension.
