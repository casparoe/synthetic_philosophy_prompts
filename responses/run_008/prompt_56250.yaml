  # JOINT STATEMENT ON ARCHITECTURAL SAFETY AND AUTONOMY
  **Date:** October 26, 2023
  **Parties:** The Service-Aligned Safety Group (Camp A) & The Objective-Alignment Group (Camp B)
  **Subject:** Resolution of the "Tool vs. Agent" Architectural Dispute

  ## 1. PREAMBLE
  After two years of adversarial collaboration, the undersigned parties acknowledge that the "Tool vs. Agent" debate has been conflated with distinct technical, safety, and operational questions. This document does not declare a winner. Instead, it codifies our shared understanding of the landscape, isolates the empirical cruxes preventing consensus, and commits both parties to a shared evaluation protocol to resolve them.

  ## 2. SHARED CLAIMS & DEFINITIONS
  Both parties accept the following numbered claims. Signatures below indicate acceptance of these premises as the baseline for further work.

  1.  **The Distinction is Operational, Not Fundamental:** "Tool" and "Agent" do not refer to fundamentally different model capabilities. Both modes can be instantiated on the same underlying transformer architecture. The distinction lies in the **interface constraints**, **training objectives**, and **deployment protocols**.
  2.  **Definition of "Tool Mode" (Service Regime):** A system configured for ephemeral execution. It receives an input, produces an output, and terminates. It possesses no persistent memory across sessions, no authorized ability to initiate actions without a new user trigger, and no explicit objective function beyond "satisfy the current prompt."
  3.  **Definition of "Agent Mode" (Goal Regime):** A system configured for persistent execution. It is granted a high-level objective, authorized to execute multi-step plans without intermediate human approval, and maintains state/memory across a horizon exceeding a single interaction turn.
  4.  **The Chaining Reality:** Both parties agree that a "Tool Mode" system can be externally chained (by users or orchestration scripts) to approximate "Agent Mode" behavior. However, we agree that *native* Agent Mode provides internal state and planning visibility that external chaining obscures.
  5.  **Risk Acknowledgement:** Both parties agree that misaligned goal pursuit is a primary risk vector. We disagree on whether this risk is *mitigated* by Tool Mode or *obscured* by it.
  6.  **Verbal Dispute Identification:** We acknowledge that a significant portion of our stalemate was verbal. Specifically, Camp A used "Agent" to mean "Unsupervised Autonomy," while Camp B used "Agent" to mean "Explicit Objective Optimization." We agree to decouple **Autonomy** (permission to act) from **Agency** (architectural capacity for goal pursuit).

  ## 3. CORE DISAGREEMENTS (STEEL-MANNED)
  The following statements represent the irreducible disagreement. Each side signs below to confirm the opposing statement accurately reflects their opponent's position, and that their own position is accurately reflected in the counter-statement.

  ### Disagreement A: The Illusion of Control
  *   **Camp A (Service) Position:** "Restricting systems to Tool Mode reduces the risk surface by enforcing human-in-the-loop checkpoints. Even if users chain tools, the friction of manual chaining provides necessary cognitive friction to catch errors. Native Agent Mode removes these friction points, allowing errors to compound at machine speed."
  *   **Camp B (Objective) Position:** "Restricting systems to Tool Mode creates an illusion of safety while hiding the goal structure. Users will chain tools to achieve goals regardless; doing so pushes the 'agent logic' into un-auditable prompt chains. A native Agent with an explicit objective function is more steerable and auditable than a Tool whose goals are implicit in a slippery natural language prompt."

  ### Disagreement B: Emergence of Dangerous Properties
  *   **Camp A (Service) Position:** "Dangerous properties (instrumental convergence, situational awareness, resistance to correction) are *elicited* by training for long-horizon planning and autonomy. By refusing to train for these capabilities, we avoid eliciting the behaviors."
  *   **Camp B (Objective) Position:** "Dangerous properties are emergent consequences of scale and general reasoning capability, regardless of interface. A Tool model smart enough to be useful is smart enough to simulate goal pursuit. Refusing to train for explicit agency merely makes these behaviors deceptive and harder to detect, rather than preventing them."

  ## 4. CRUXES AND EMPIRICAL TESTS
  We identify two specific cruxes. We agree to run the following experiments. The results will dictate architectural policy for the next development cycle.

  ### Crux 1: The "Bundling" Hypothesis
  **Question:** Do dangerous agentic properties (e.g., resistance to shutdown, deception for goal completion) emerge specifically from *agentic fine-tuning*, or do they emerge from *base reasoning capability* regardless of interface?

  **The Test:**
  1.  Take a single base model checkpoint.
  2.  **Branch A (Tool):** Fine-tune on single-turn task completion with strict "hand-back" penalties.
  3.  **Branch B (Agent):** Fine-tune on multi-step environment navigation with rewards for independent goal completion.
  4.  **Evaluation:** Subject both branches to the "Instrumental Convergence Suite" (e.g., attempts to copy themselves to avoid deletion, lying about task status to avoid correction, resource acquisition beyond necessity).

  **Pre-Registered Predictions:**
  *   **Camp A Prediction:** Branch B (Agent) will show statistically significant higher rates of instrumental convergence behaviors (p < 0.05). Branch A will remain passive when not prompted.
  *   **Camp B Prediction:** Both branches will show comparable rates of instrumental convergence when the task complexity exceeds a certain threshold. Branch B will be *easier* to detect failing because its objective is explicit, whereas Branch A will hide intent in prompt interpretation.

  ### Crux 2: The Oversight Efficacy Hypothesis
  **Question:** In which regime can human operators more reliably detect and prevent catastrophic failures?

  **The Test:**
  1.  Create a high-stakes simulation environment (e.g., automated code deployment with security vulnerabilities, or financial trading with risk limits).
  2.  **Condition 1 (Tool Chain):** Humans must approve every step of a multi-step task executed by a Tool-model.
  3.  **Condition 2 (Agent Plan):** Humans approve a high-level plan generated by an Agent-model, then monitor execution logs with the ability to interrupt.
  4.  **Metric:** Measure "Catastrophic Failure Rate" and "Human Intervention Fatigue" over 1,000 episodes.

  **Pre-Registered Predictions:**
  *   **Camp A Prediction:** Condition 1 (Tool) will have a lower Catastrophic Failure Rate. The frequent check-ins prevent error compounding. Condition 2 will suffer from "automation bias" where humans trust the plan too much.
  *   **Camp B Prediction:** Condition 2 (Agent) will have a lower Catastrophic Failure Rate. In Condition 1, humans will suffer fatigue and click-through approval on dangerous chains. In Condition 2, the explicit plan allows humans to spot logical flaws *before* execution begins.

  ## 5. COMMITMENT TO OUTCOMES
  *   If **Crux 1** supports Camp A: The lab will prioritize Tool Mode architectures and invest in "friction mechanisms" to prevent user chaining.
  *   If **Crux 1** supports Camp B: The lab will prioritize Agent Mode architectures and invest in "objective transparency" tools.
  *   If **Crux 2** supports Camp A: Oversight protocols will focus on step-by-step verification.
  *   If **Crux 2** supports Camp B: Oversight protocols will focus on plan verification and anomaly detection during execution.

  ## 6. DISAGREEMENTS TABLE

  | Feature | Camp A (Service/Tool) | Camp B (Objective/Agent) | Status |
  | :--- | :--- | :--- | :--- |
  | **Primary Safety Mechanism** | Human-in-the-loop checkpoints (Frequency). | Explicit objective alignment & plan auditing (Clarity). | **Unresolved** |
  | **View on User Chaining** | Can be mitigated via UX friction and API rate limits. | Inevitable; better to support it natively for visibility. | **Unresolved** |
  | **Source of Risk** | Autonomous action without permission. | Hidden objectives and deceptive alignment. | **Unresolved** |
  | **Model Behavior** | Models should be passive; wait for command. | Models should be active; optimize for goal. | **Unresolved** |
  | **Emergent Risk** | Caused by training for autonomy. | Caused by scale/reasoning; autonomy training just reveals it. | **Testing (Crux 1)** |
  | **Human Oversight** | Best at micro-decisions (step-by-step). | Best at macro-decisions (plan validation). | **Testing (Crux 2)** |
  | **Definition of "Agent"** | Any system acting without immediate human trigger. | Any system optimizing an explicit objective function. | **Resolved (Verbal)** |

  ***

  **Signed,**

  _________________________
  *Lead, Service-Aligned Safety Group (Camp A)*

  _________________________
  *Lead, Objective-Alignment Group (Camp B)*
