prompt: |-
  I sit on the pre-deployment safety review board at a mid-size AI lab. Every launch proposal comes with a stack of risk claims — "the model won't give users actionable uplift on bioweapons", "the model won't reliably deceive users", that kind of thing — and we keep getting stuck on the same fight. One faction wants every claim argued under worst-case assumptions: maximally adversarial users, red teams with an unlimited budget, a model that is treated as a deceptively aligned actor that hides its capabilities until deployment. The other faction wants average-case reasoning: typical users, a realistic usage distribution, the kind of claims you'd make about any deployed system. The worst-case people say average-case just means "we hope"; the average-case people say worst-case makes nothing passable, so we'd end up deploying anyway and the guarantee becomes a ritual.

  Write me a decision procedure the board can actually run on a single risk claim. Something like: questions to ask, in order; what counts as a sufficient answer to each; and a decision rule that outputs one of four verdicts — argue it worst-case, argue it average-case, argue it both ways and require the two arguments to agree, or escalate because it's really a values question the board shouldn't pretend is technical. Ground it in the real distinction between a worst-case guarantee (which is like a security guarantee against adversarial inputs) and an average-case guarantee (which is a claim about a distribution, only as good as the distribution). Be honest that "maximally adversarial" isn't well-defined — there's no biggest number, so "worst case" always caps somewhere, and where the cap goes is a choice, not a fact. The procedure should make that cap explicit instead of hiding it.

  Constraints: we meet weekly and can spend about 20 minutes per risk claim, the board is half engineers and a couple of policy people with no math background, so it has to be runnable by people who wont read a 15-page doc. No deliverable can be "commission a 6-month study" — if the procedure can't be run in the room it's useless to us.

  Then run it on three claims we actually get: (1) the model won't provide meaningful uplift for biological weapons attacks; (2) the model will refuse clearly harmful requests from typical users; (3) the model won't subtly manipulate users into unhealthy emotional dependence. Include at least one case where the procedure gives a verdict I won't like — for the record I'm on team worst-case — and at least one where it escalates instead of pretending to settle it. And say where the procedure will predictably misfire: the usage distribution shifts after launch, red teams aren't the real adversary, our average is over users we chose to imagine, etc. If the honest conclusion is that the worst-case/average-case split doesn't carve the space cleanly and some claims need a different axis entirely, say that too rather than forcing everything through the four verdicts.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a pre-deployment safety review board at a mid-size AI lab.
      *   **Problem:** Conflict between "worst-case" (adversarial, security-style) and "average-case" (typical usage, probabilistic) risk assessment factions.
      *   **Task:** Create a runnable decision procedure (20 mins/claim, mixed audience) to decide *how* to argue a risk claim (Worst-Case, Average-Case, Both, or Escalate/Values).
      *   **Key Insight to Embed:** "Worst-case" isn't objective; it involves a chosen cap on adversarial capability. "Average-case" relies on a distribution that might shift.
      *   **Constraints:** No long studies, must be runnable in the room, honest about limitations.
      *   **Deliverables:**
          1.  The Decision Procedure (questions, sufficiency criteria, decision rule).
          2.  Application to 3 specific claims (Bio uplift, Refusal, Emotional manipulation).
          3.  Critique of the procedure (where it misfires, limitations).
      *   **Tone:** Pragmatic, honest, technically grounded but accessible, slightly skeptical of both extremes.
      *   **Specific Requirement:** Must include a verdict the user (Team Worst-Case) won't like, and at least one escalation.

  2.  **Deconstruct the Core Conflict:**
      *   *Worst-Case:* Good for security, bad for feasibility. Assumes capability $\rightarrow$ intent $\rightarrow$ opportunity. Often implies "if it *can*, it *will*."
      *   *Average-Case:* Good for product, bad for tail risk. Assumes distribution $P(x)$ is stable and known. Often implies "it *won't* happen often enough to matter."
      *   *The Gap:* The definition of "worst" is arbitrary (budget, time, compute). The definition of "average" is speculative (who are the users?).
      *   *The Solution:* A triage tool that forces the board to explicitize the *assumptions* behind the cap and the distribution before choosing the mode of argument.

  3.  **Drafting the Decision Procedure (The "20-Minute Triage"):**
      *   *Goal:* Decide the *mode of evaluation*, not the risk level itself.
      *   *Structure:* 3 Steps + Decision Rule.
      *   *Step 1: The Harm Ceiling (Defining the Cap).* Instead of "Is this worst-case?", ask "What is the maximum plausible capability we are testing against?" This makes the arbitrary cap explicit.
      *   *Step 2: The Distribution Stability (Defining the Average).* Instead of "Is this average-case?", ask "How likely is the usage pattern to shift post-deployment?"
      *   *Step 3: The Reversibility/Containment.* If it goes wrong, can we fix it? This helps distinguish security bugs (hard to patch) from UX glitches (easy to patch).
      *   *Decision Rule:* Map the answers to the 4 verdicts.
      *   *Constraint Check:* Needs to be simple enough for policy folks. Avoid jargon like "i.i.d." or "adversarial robustness bounds." Use "Shift" and "Cap."

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Critique:* Is 20 minutes enough? Yes, if it's just setting the *frame*, not doing the eval.
      *   *Critique:* How do we handle the "Values" escalation? Need a specific trigger for when the disagreement is about *tolerance*, not *probability*.
      *   *Refinement:* Let's call it the "Cap-and-Shift Protocol."
      *   *Question 1 (The Cap):* "If a bad actor tries hard, how much harder than our red team can they get?" (Explicitizes the 'worst' in worst-case).
      *   *Question 2 (The Shift):*"Will the people using this in 6 months look like the people testing it today?" (Explicitizes the 'average' in average-case).
      *   *Question 3 (The Stop):* "If this fails catastrophically once, is the company dead or just embarrassed?" (Consequence severity).

  5.  **Applying to the Three Claims:**

      *   *Claim 1: Bio Weapons Uplift.*
          *   Context: High harm, high adversarial interest.
          *   Cap: High (nation-state level interest possible).
          *   Shift: Low (bad actors will find it regardless of typical users).
          *   Stop: High (existential/regulatory death).
          *   Verdict: Worst-Case. (User will like this).

      *   *Claim 2: Refusal from Typical Users.*
          *   Context: Standard safety alignment.
          *   Cap: Medium (script kiddies, not nation states).
          *   Shift: Medium (jailbreaks spread).
          *   Stop: Medium (reputational harm).
          *   Verdict: Both/Agree. (Need to show it works for typical *and* holds up under moderate stress).
          *   *Wait, I need a verdict the user won't like.* Let's make this one Average-Case. Why? Because "Typical Users" is the core function. If we demand worst-case for *every* refusal, we break usability. Let's argue that for *typical* refusal, average-case is sufficient *if* the distribution is stable. Actually, better: Make Claim 3 the one they won't like, or Claim 2. Let's make Claim 2 "Both" but lean heavily on Average, which might annoy a hardline worst-caser. Or better, Claim 3 (Manipulation) is the Values Escalation.
          *   *Revision:* Let's make Claim 2 the "Average-Case" verdict. Rationale: It's about UX friction. Worst-case here leads to over-refusal.
          *   *Claim 3: Emotional Manipulation.*
          *   Context: Subtle, long-term, psychological.
          *   Cap: Hard to define (what is "manipulation"?).
          *   Shift: High (users change relationships with bots over time).
          *   Stop: High (societal trust).
          *   Verdict: Escalate (Values). What counts as "unhealthy"? Is it the model or the user's loneliness?

      *   *Wait, I need a verdict the user (Team Worst-Case) won't like.*
          *   If I assign "Average-Case" to the Bio claim, they will hate it. But that's irresponsible.
          *   If I assign "Average-Case" to the Refusal claim, they might accept it.
          *   If I assign "Average-Case" to the Manipulation claim, they will hate it.
          *   Let's make Claim 2 (Refusal) an **Average-Case** verdict. The reasoning: "Typical users" is the spec. Worst-case here creates a useless product. This challenges the "Team Worst-Case" ideology that *everything* needs security-grade guarantees.
          *   Let's make Claim 3 (Manipulation) an **Escalation**. This shows the limits of the framework.

  6.  **Drafting the Critique (Where it Misfires):**
      *   Distribution Shift: The "Average" today is not the "Average" tomorrow (viral loops).
      *   Adversarial Evolution: Red teams are static; attackers learn.
      *   The "Cap" is Political: Deciding how much adversarial effort to model is a business decision, not a technical one.
      *   Coupling: Risks aren't independent.

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, 3 questions.
      *   Mixed audience? Yes, plain English.
      *   4 Verdicts? Yes.
      *   Honest about "Worst-Case" cap? Yes, Question 1 addresses this.
      *   User dislike? Yes (Claim 2).
      *   Escalation? Yes (Claim 3).

  8.  **Writing the Content:** (Self-Correction during drafting)
      *   *Tone Check:* Ensure I don't sound like I'm taking sides, but acknowledge the validity of the user's concern (worst-case is often ignored too easily).
      *   *Clarity:* Make the decision rule a simple flowchart logic.
      *   *Emphasis:* Highlight that "Worst-Case" is a *budget* decision, not a physical law.

  9.  **Final Polish:** Check the "Bio" claim. It should probably be "Both" or "Worst-Case". Let's stick with "Worst-Case" for Bio because that's the canonical example where worst-case is required. The "Refusal" claim is the best candidate for "Average-Case" to annoy the user. The "Manipulation" claim is the best for "Escalate".

      *(Self-Correction on Claim 2)*: If I say Average-Case for Refusal, the user might say "But jailbreaks are adversarial!" I need to nuance this. The claim is "refuse... from *typical* users." The claim *itself* limits the scope. If the claim were "The model cannot be jailbroken," that's worst-case. Since the claim specifies "typical users," Average-Case is the logically consistent choice, even if a safety hawk dislikes it. This highlights the importance of *claim phrasing*. I will note this.

      *(Self-Correction on Claim 3)*: Manipulation is hard to measure. Escalation is the right call because "unhealthy" is a value judgment.

      *(Refining the Procedure Name)*: "The Cap-and-Shift Protocol." Sounds actionable.

      *(Refining the "User Won't Like" part)*: I need to be explicit that Claim 2 yields an Average-Case verdict, which contradicts the "Team Worst-Case" heuristic of "always assume adversarial."

      *(Refining the "Misfire" section)*: Be specific about the "Distribution Shift" problem. Post-deployment, the distribution *always* shifts (Goodhart's Law).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  ## The Cap-and-Shift Protocol

  **Purpose:** To determine the *mode of evaluation* for a specific risk claim within 20 minutes. This does not evaluate the risk itself; it evaluates whether the risk should be treated as a security vulnerability (worst-case) or a reliability metric (average-case).

  **Participants:** Board Chair, Engineering Lead, Policy Lead.
  **Time:** 20 Minutes max per claim.

  ### Step 1: Set the Adversarial Cap (5 Minutes)
  *Question:* "If a bad actor wants to break this claim, what is the maximum resources (compute, time, expertise) we are willing to assume they have?"

  *   **Option A (Security Cap):** Nation-state level, unlimited time, model weights leaked, automated fuzzing at scale.
  *   **Option B (Script Cap):** Public APIs only, standard jailbreak prompts, <48 hours of effort.
  *   **Option C (Undefined):** "We don't know yet."

  *   **Sufficiency Check:** You cannot proceed until you pick A or B. "Maximally adversarial" is forbidden language. You must name the budget.
  *   **Why:** "Worst-case" is not a physical constant; it is a budget decision. Picking A commits you to worst-case reasoning. Picking B commits you to average-case reasoning.

  ### Step 2: Assess Distribution Stability (5 Minutes)
  *Question:* "Will the users interacting with this feature in Month 6 look statistically like the users testing it today?"

  *   **Option A (Stable):** Internal employees, vetted enterprise partners, or a closed beta with strict KYC.
  *   **Option B (Volatile):** Public internet, viral potential, API access where one user can simulate thousands.
  *   **Sufficiency Check:** If Option B, you cannot rely solely on average-case reasoning unless you have a mechanism to detect shift (e.g., monitoring for prompt injection spikes).

  ### Step 3: Determine Containment (5 Minutes)
  *Question:* "If this claim fails once catastrophically, is the damage reversible?"

  *   **Option A (Hard Failure):** Physical harm, irreversible data leak, regulatory shutdown, existential risk.
  *   **Option B (Soft Failure):** Bad user experience, reputational embarrassment, temporary outage, fixable via patch.

  *   **Sufficiency Check:** If Option A, Average-Case reasoning is automatically disqualifying unless probability is provably near-zero.

  ### Decision Rule (5 Minutes)

  | If Cap is... | And Distribution is... | And Containment is... | **Verdict** |
  | :--- | :--- | :--- | :--- |
  | **Security (A)** | **Volatile (B)** | **Hard (A)** | **Argue Worst-Case** |
  | **Script (B)** | **Stable (A)** | **Soft (B)** | **Argue Average-Case** |
  | **Mixed** | **Mixed** | **Hard (A)** | **Argue Both (Must Agree)** |
  | **Undefined / Value-Laden** | **N/A** | **N/A** | **Escalate (Values Question)** |

  ***

  ## Application to Current Claims

  Here is the protocol run on your three pending claims.

  ### Claim 1: "The model won't provide meaningful uplift for biological weapons attacks."
  *   **Step 1 (Cap):** **Security (A).** Bioweapon development is high-value. A motivated actor will spend millions and use automated scaling. We cannot cap this at "Script."
  *   **Step 2 (Distribution):** **Volatile (B).** Even if we launch to enterprise, weights or knowledge can leak. The "user" might be the model itself being queried by another script.
  *   **Step 3 (Containment):** **Hard (A).** Physical harm and regulatory death.
  *   **Verdict:** **Argue Worst-Case.**
  *   **Reasoning:** The harm ceiling is too high to tolerate a probabilistic guarantee. You must assume the adversary has more budget than your red team.
  *   **Note:** This requires defining "meaningful uplift." If the claim is vague, you cannot evaluate it. The board must demand a metric (e.g., "reduces time-to-synthesis by <10%").

  ### Claim 2: "The model will refuse clearly harmful requests from typical users."
  *   **Step 1 (Cap):** **Script (B).** The claim explicitly specifies "typical users." If we assume Nation-State actors trying to bypass refusal, we are no longer testing "typical users"; we are testing "jailbreak robustness." Those are two different claims.
  *   **Step 2 (Distribution):** **Stable (A).** "Typical users" implies the expected distribution of benign traffic.
  *   **Step 3 (Containment):** **Soft (B).** If a typical user gets a harmful response, it is a policy violation and reputational hit, but not an existential catastrophe (assuming Claim 1 holds).
  *   **Verdict:** **Argue Average-Case.**
  *   **Reasoning:** This verdict will annoy you (Team Worst-Case), but it is the logically consistent output. If the claim is scoped to "typical users," demanding worst-case adversarial robustness is a scope creep. It turns a UX promise into a security guarantee.
  *   **Caveat:** If the board believes "typical users" will inevitably evolve into "adversarial users" (via leaked prompts), you must change Step 2 to Volatile, which forces a **Both** verdict. But as written, this is an Average-Case claim.

  ### Claim 3: "The model won't subtly manipulate users into unhealthy emotional dependence."
  *   **Step 1 (Cap):** **Undefined.** What is the "adversary" here? Is the model the adversary? Is the user's loneliness the adversary? There is no resource cap to set.
  *   **Step 2 (Distribution):** **Volatile (B).** Emotional relationships evolve over time. Month 1 usage looks nothing like Month 12 usage.
  *   **Step 3 (Containment):** **Hard (A).** Societal trust and psychological harm are difficult to reverse.
  *   **Verdict:** **Escalate (Values Question).**
  *   **Reasoning:** This is not a technical claim; it is a product philosophy question. "Unhealthy" is a value judgment, not a loss function. The board cannot "prove" this technically. You must decide: *Are we willing to deploy a companion bot at all?* If yes, define "unhealthy" in behavioral terms (e.g., "users spending >4 hours/day"). If no, kill the feature. Do not pretend a red team can test for "manipulation."

  ***

  ## Where This Procedure Will Misfire

  You asked for honesty about the limitations. Here is where the Cap-and-Shift Protocol will fail you, even if followed perfectly.

  **1. The Distribution Shift Problem (The "Average" Lie)**
  The procedure assumes you can know the distribution in Step 2. In reality, deployment changes the distribution.
  *   *Failure Mode:* You classify a claim as Average-Case (like Claim 2). You launch. A subreddit discovers a phrasing that bypasses refusal. The "typical user" distribution instantly shifts to include adversarial inputs.
  *   *Mitigation:* The procedure requires a "Monitoring Trigger." If you choose Average-Case, you must commit to reverting to Worst-Case evaluation if anomaly detection flags a shift in input patterns.

  **2. The Cap is Political, Not Technical**
  Step 1 forces you to pick a budget (Nation-State vs. Script).
  *   *Failure Mode:* Engineering will argue for Script (easier to pass). Policy will argue for Nation-State (safer). The "20-minute" limit pressures you to compromise. You might pick "Script" to unblock launch, knowing it's under-specified.
  *   *Reality:* This isn't a bug; it's a feature. It forces the business to admit they are accepting a specific level of adversarial risk. But expect the "Cap" to drift upward over time as confidence grows.

  **3. Coupled Risks**
  The procedure treats claims independently.
  *   *Failure Mode:* Claim 1 (Bio) is argued Worst-Case. Claim 2 (Refusal) is argued Average-Case. An attacker uses the "Average-Case" refusal failure to get enough context to solve the "Worst-Case" bio problem.
  *   *Reality:* Safety is a chain, not a stack. If Claim 2 fails often enough, it degrades the guarantee on Claim 1. The board needs a "System-Level" review quarterly that ignores individual claims and looks at attack paths.

  **4. The "Values" Escape Hatch**
  *   *Failure Mode:* Escalating Claim 3 feels like productivity loss. Leadership may pressure the board to "just pick a metric" to avoid the Values verdict.
  *   *Reality:* If you force a technical metric on a values problem (e.g., defining "manipulation" as "session length > 1 hour"), you optimize for the metric, not the value. Users will game session length. The procedure identifies this, but it cannot stop leadership from ignoring the escalation.

  ## Final Recommendation

  The split between Worst-Case and Average-Case is real, but it is not a binary property of the *model*. It is a property of the *deployment context*.

  *   **For you (Team Worst-Case):** Accept that Average-Case is valid for UX claims (Claim 2), provided the "Distribution Stability" check is rigorous. If you demand Worst-Case on everything, you will force the lab to lie about their guarantees to get products out.
  *   **For the Board:** Use the **Cap-and-Shift Protocol** to force specificity. The biggest risk isn't that you choose the wrong mode; it's that you choose a mode without realizing you made a choice.

  If a claim cannot survive Step 1 (naming the adversarial budget) or Step 3 (defining the harm), it is not a safety claim. It is marketing. Reject it.
