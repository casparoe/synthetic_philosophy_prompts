answer: |-
  **JOINT STATEMENT ON CAUSAL METHODOLOGY AND THE GREENHOUSE CASE**

  **Date:** 24 May 2024
  **Parties:** The Counterfactual Analysis Proponent (CAP); The Interventionist Modelling Proponent (IMP).
  **Facilitator:** [User/Neutral Party]

  ### 1. Agreed Claims and Shared Desiderata

  Both parties acknowledge that whilst their metaphysical commitments differ, their methodological practices overlap significantly. To facilitate productive adversarial collaboration, we endorse the following propositions:

  1.  **Shared Formalism:** Both parties accept that causal claims can be fruitfully represented using variables and structural equations. The CAP accepts these as a heuristic for mapping counterfactual dependencies across possible worlds. The IMP accepts them as the primary ontology of causal modelling, where variables represent measurable properties and equations represent invariant generalisations.
  2.  **The Role of Counterfactuals:** Both parties agree that causal assertions entail commitments to counterfactual conditionals (e.g., 'If $C$ had not occurred, $E$ would not have occurred'). They disagree on the truth conditions of these conditionals, but agree that a theory of causation that cannot account for them is deficient.
  3.  **Test Cases:** Any adequate theory of causation must provide a consistent account of the following standard puzzles without resorting to *ad hoc* modifications for each case:
      *   **Early and Late Preemption:** Where a potential cause is 'cut off' by the actual cause.
      *   **Symmetric Overdetermination:** Where two sufficient causes occur, and either alone would have produced the effect.
      *   **Causation by Omission:** Where an absence (e.g., a failure to act) is cited as a cause.
  4.  **Theory Evaluation:** A theory is to be judged by its ability to align with robust intuitive judgements in clear cases, whilst providing principled grounds for revising intuitions in complex cases. Mere preservation of folk intuition is insufficient; explanatory power regarding *why* the intuition holds (or fails) is required.
  5.  **The Greenhouse Case (Original):** Both parties accept the following description as the baseline for testing:
      *   *Setup:* An automated irrigation system relies on a soil-moisture sensor. A student has a secondary duty to hand-water.
      *   *Actual World:* The sensor is faulty (reads 'wet', pump off). The student omits to water. The plants die.
      *   *Stalemate:* The CAP maintains that in terms of plain counterfactual dependence, neither the fault nor the omission is the sole cause (as the plants die given either condition alone in the absence of the other). The IMP maintains that causal attribution depends on the specification of the structural model and the designation of 'default' variable values.

  ### 2. Table of Remaining Disagreements

  The following table summarises the substantive divergences. Wording has been negotiated to ensure each party accepts the description of their own view as fair, even if they reject the opposing view.

  | Topic | Counterfactual Analysis Proponent (CAP) | Interventionist Modelling Proponent (IMP) |
  | :--- | :--- | :--- |
  | **Metaphysical Grounding** | Causation is a mind-independent relation between events or facts. The truth of a causal claim is determined by the modal structure of reality (i.e., what holds in the closest possible worlds). | Causation is a relation between variables within a model. Causal claims are true relative to a specific modelling context and a set of invariant generalisations, not necessarily 'out there' independent of representation. |
  | **Possible Worlds** | Possible worlds (or a concrete equivalent) are required to provide truth conditions for counterfactuals. Similarity metrics between worlds are necessary to evaluate 'closest' alternatives. | Talk of 'possible worlds' is a useful *façon de parler* for interventionist conditionals. We do not require an ontology of worlds or a similarity metric; we require a definition of valid interventions (the *do*-operator). |
  | **Omissions** | Omissions are problematic. Since 'nothing' happens, it is difficult to locate the relata. We must explain when an absence counts as a cause without allowing causation to become ubiquitous (e.g., the Queen's failure to water). | Omissions are handled naturally as variable values (e.g., $Water = 0$). The problem is not metaphysical but pragmatic: determining which variable values count as the 'default' or 'normal' state against which deviations are measured. |
  | **Greenhouse Diagnosis** | The difficulty in the Greenhouse Case reveals a limitation in simple dependence accounts. We must appeal to intricate chains of dependence or quasi-dependence to distinguish the sensor fault from the student's omission. | The difficulty reveals that the CAP is asking the wrong question. Once the structural equations are specified and the 'default' state (e.g., 'sensor ought to work') is fixed, the actual cause is identified mathematically without stretching the machinery. |

  ### 3. Cruxes and Pre-registered Predictions

  To move beyond the stalemate, we identify the following sub-questions ('Cruxes'). For each, we specify a concrete argument or case variant and record each party's prediction in advance.

  #### Crux 1: The Ontology of Absences
  *   **Question:** Is the causal status of an omission determined by metaphysical facts about events, or by pragmatic norms about variable defaults?
  *   **Test:** The Greenhouse Case (Original).
  *   **CAP Prediction:** The student's omission is not a cause in the same sense as the sensor fault. To call it a cause requires a derivative account (e.g., quasi-dependence) because there is no event of 'not watering' to stand in a causal relation. The sensor fault is the primary candidate, provided we can establish a dependence chain not screened off by the student's duty.
  *   **IMP Prediction:** Both the sensor fault and the omission are potential causes within the model. Which one is *the* actual cause depends on the choice of the 'default' value. If the sensor is *supposed* to work, its failure is the cause. If the student is *supposed* to water regardless, their omission is the cause. The theory should explicitly model this normative dependency, not hide it in similarity metrics.

  #### Crux 2: Sensitivity to Model Specification
  *   **Question:** Does changing the granularity of the variables change the causal facts, or merely our description of them?
  *   **Test:** **Variant A (Sensor Fixed, Student No Water).** The sensor is repaired (reads 'dry', pump fires). The student still does not water. The plants survive.
  *   **CAP Prediction:** Counterfactual dependence is restored. Had the sensor remained faulty, the plants would have died (since the student still would not have watered). Therefore, the sensor's functioning is the cause of survival; the sensor fault in the Original case was the cause of death. The student's omission remains causally inert in this variant.
  *   **IMP Prediction:** The structural equation shows the path from Sensor to Survival is active. The path from Student to Survival is inactive (redundant). This confirms that causal attribution tracks the active paths in the structural model. The CAP's reliance on 'restored dependence' is just a roundabout way of identifying the active path in the equation.

  #### Crux 3: Symmetry Breaking
  *   **Question:** In cases of symmetric overdetermination, can a theory distinguish causes without appealing to extraneous norms?
  *   **Test:** **Variant B (Sensor Faulty, Student Waters).** The sensor remains faulty (pump off). The student waters the plants. The plants survive.
  *   **CAP Prediction:** Had the student not watered, the plants would have died (since the sensor is faulty). Thus, the student's action is the cause of survival. In the Original Case, this implies the student's omission was a cause of death, *unless* we treat the sensor fault as preempting the need for the student. We predict the CAP will struggle to maintain symmetry here without appealing to temporal priority or intrinsicness.
  *   **IMP Prediction:** The model clearly identifies the Student variable as the difference-maker in this variant. In the Original Case, the symmetry is broken not by metaphysics, but by the experimenter's choice of which variable to hold fixed. If we hold the Sensor fixed at 'Faulty', the Student is the cause. If we hold the Student fixed at 'No Water', the Sensor is the cause. The theory admits both are 'actual causes' relative to different contrasts, and this is a feature, not a bug.

  ### 4. Commitment to Resolution

  Both parties agree that if the Interventionist Modelling Proponent can demonstrate that the 'default value' selection is not merely an appeal to norms in disguise (which the CAP argues is just a pragmatic similarity metric), the CAP will concede that structural equations offer a superior heuristic. Conversely, if the Counterfactual Analysis Proponent can demonstrate that interventionist models fail to yield unique truth conditions without importing possible-worlds semantics to define 'intervention', the IMP will concede that modal realism is indispensable.

  **Signed:**

  _________________________ (Counterfactual Analysis Proponent)

  _________________________ (Interventionist Modelling Proponent)

  _________________________ (Facilitator/Neutral)
