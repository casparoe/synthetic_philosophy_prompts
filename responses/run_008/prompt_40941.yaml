prompt: |-
  My department runs a tiny reading group on causation — just me, a friend who's all-in on the Lewis-style counterfactual analysis (possible worlds, closest worlds, dependence plus some story for preemption), and another who thinks the whole possible-worlds apparatus should be scrapped for the interventionist picture of Pearl and Woodward (structural equations, surgical interventions on variables). We've spent the whole term arguing and I've realised we mostly talk past eachother, so I've bullied them into a proper adversarial collaboration, and as the "neutral" one I get to write up the joint statement. Except I want to outsource the drafting to you.

  Please draft the joint statement both of them could actually sign. I want: (1) a numbered section of claims they both accept — including whatever they can agree on about shared formal machinery (both sides end up using counterfactuals and structural equations somewhere, right?), about which cases any decent theory of causation has to handle (preemption, symmetric overdetermination, omissions), and about what would even make a theory of causation good in the first place; (2) a table of their remaining disagreements, each side's position phrased so that that side would accept the wording as a fair statement of their own view (my interventionist friend keeps saying he "doesn't believe in possible worlds", but that's not quite right and he knows it); and (3) the cruxes — the sub-questions that would actually move at least one of them if settled — with, for each crux, a concrete case or argument both would accept as bearing on it, and each side's prediction written down in advance.

  Here's a case we kept coming back to, so please weave it in as one of the shared tests: a greenhouse has an automated irrigation system with a soil-moisture sensor; the sensor is faulty and always reads wet, so the pump never fires; separately, a student was supposed to hand-water the plants that morning and didn't. The plants die. My counterfactual friend says that in the plain dependence sense neither the sensor fault nor the student's omission caused the death (the plants die either way), and he has to stretch his preemption/backup machinery to say anything more; my interventionist friend says that once you pick the right variables and interventions, one of them is the actual cause, and the fact that his friend has to stretch shows the possible worlds are doing no real work. Make each of them predict, on the record, what should be said about the variants — one where the sensor is fixed but the student still doesn't water, one where the student waters but the sensor is still faulty. Use British English throughout, and keep it fair — I have to show this to both of them and they are insufferable pedants.
