answer: |-
  Here is a structured plan for your section, designed to maximize engagement within a tight fifty-minute window while safeguarding against the specific conceptual pitfalls you've identified.

  ### 1. Structural Recommendation: The Data-First Approach
  **Recommendation:** Endorse your postdoc's suggestion, but with a strict time limit.
  **Reasoning:** Since the lecturer has already provided the "map" (the three theories), your section should be the "terrain." A theory-first approach in a section often devolves into a mini-lecture where students passively match cases to definitions they just heard. A data-first approach forces them to *feel* the philosophical problem before applying the labels. It transforms the session from "review" to "investigation."

  **What each order presupposes:**
  *   **Theory-First (Textbook):** Presupposes that students understand the *stakes*. It risks them viewing the norms as arbitrary definitions to be memorized rather than solutions to a puzzle. It leaves out the *motivation* for the debate.
  *   **Data-First (Postdoc):** Presupposes that students share stable intuitions about assertion. It leaves out the systematic taxonomy initially, which you must provide at the end to ensure they leave with the correct terminology.

  **The Plan:**
  *   **0–5 mins:** Briefly recall the three candidates (Knowledge, Truth, Belief) just to ensure terminology is shared.
  *   **5–35 mins:** The Data-First Case Study (see below).
  *   **35–45 mins:** Map the data to the theories (Reflective Equilibrium).
  *   **45–50 mins:** Closing diagnostic and housekeeping.

  ### 2. The Carrying Case: Criteria and Selection
  You are right to worry about the Lottery case. While classic, it invites students to haggle over probability thresholds ("Is 99% enough?") rather than focusing on the *nature* of the norm.

  **What a good carrying case must have:**
  1.  **Divergence:** It must be a scenario where Truth, Belief, and Knowledge *come apart*. (e.g., True Belief without Knowledge).
  2.  **Low Moral Stakes:** The assertion shouldn't be morally dangerous (e.g., "This bridge is safe"), or students will conflate epistemic norms with moral responsibility.
  3.  **High Epistemic Stakes:** It must matter that the assertion is proper (e.g., a context where accuracy is expected).

  **What it must lack:**
  1.  **Probabilistic Machinery:** Avoid lotteries or statistics.
  2.  **Conversational Implicature:** Avoid cases where the oddness could be explained by rudeness or irrelevance.

  **Recommendation:** Use a **Gettierized Assertion Case** (e.g., The Stopped Clock).
  *   *Scenario:* Alice looks at a clock that stopped 12 hours ago. It reads 2:00. It is, in fact, 2:00. Alice believes it is 2:00. Alice asserts to Bob, "It is 2:00."
  *   *Why:* It satisfies the Truth Norm (it's true) and the Belief Norm (she believes it). It fails the Knowledge Norm (she doesn't *know* it).
  *   *Discussion:* Was Alice's assertion improper? If yes, the Knowledge Norm gains traction. If no, the Truth/Belief Norms gain traction. This isolates the Knowledge Norm without requiring probability math.

  ### 3. Mapping Misconceptions to the Sequence
  Do not save these for a Q&A at the end; preempt them as they arise.

  *   **Misconception 1: Norm = Moral Rule or Etiquette.**
      *   *When:* **Minute 5 (Definitions).**
      *   *Intervention:* Explicitly distinguish *constitutive* norms from *moral* norms. Use the chess analogy: Moving a rook diagonally isn't "immoral," it's just not chess. Similarly, asserting without knowledge might not be "evil," but it might not be a proper *assertion*.
  *   **Misconception 2: Knowledge = Certainty.**
      *   *When:* **Minute 20 (Evaluating the Knowledge Norm).**
      *   *Intervention:* When students object that "We can't know anything for sure," clarify that the Knowledge Norm relies on fallibilist knowledge. If we required certainty, the norm would be "Assert only what is indubitable," which is not the Knowledge Norm.
  *   **Misconception 3: Norm of Assertion = Gricean Maxim.**
      *   *When:* **Minute 30 (Discussing "Oddness").**
      *   *Intervention:* When discussing why an assertion feels "wrong," distinguish between *violating a rule* and *being unhelpful*. Grice explains why we say things (cooperation); Norms explain whether we are *allowed* to say them (entitlement).

  ### 4. The Williamson Analogy (Action/Intention)
  **Verdict:** Include it, but as a **motivating frame**, not an argument.
  **Placement:** Minute 5–10, immediately after defining "Norm."
  **Reasoning:** It is load-bearing for understanding *why* we are looking for a norm in the first place. It helps students grasp the idea of a "constitutive rule."
  **How to teach it:** Don't get bogged down in philosophy of action. Simply state: "Just as you shouldn't intentionally do what you don't intend to do (action norm), you shouldn't assert what you don't know (assertion norm)." Use it to explain the *structure* of the debate, then set it aside to focus on the epistemic cases. If you spend too long on it, you risk turning an epistemology section into a philosophy of action section.

  ### 5. Explicit Exclusions
  To manage time and cognitive load, explicitly tell the students: *"We are bracketing two major topics today so we can focus on the core norms."*
  1.  **Contextualism about 'Knows':** Tell them you are assuming a stable standard for knowledge for the hour. Mentioning contextualism now will make them think the Knowledge Norm is just a sliding scale, which confuses the structural debate.
  2.  **Scorekeeping/Retraction:** Do not enter the Brandom/Lewis literature on how assertion changes the "score" of the conversation. This is too technical for a first pass and distracts from the *condition* for asserting.

  ### 6. The Closing Diagnostic Question
  You need a question that reveals if they understand the difference between *violating a norm* and *the norm being false*.

  **The Question:**
  > "Imagine a world where everyone asserts true beliefs they don't know (like the Stopped Clock case), and no one ever blames them. In that world, is the Knowledge Norm **false**, or is it just **unenforced**?"

  **Why this works:**
  *   **If they say "False":** They likely conflate the norm with social practice (or they are Truth Norm supporters who think the case proves the K-Norm wrong).
  *   **If they say "Unenforced":** They grasp that a norm can exist even if violations are tolerated (like speeding on an empty highway).
  *   **The Twist:** Follow up by asking, "If it's just unenforced, why do we care about identifying the *real* norm?" This pushes them toward the idea that the norm defines the *activity itself*, not just the social consequences.

  ### Summary Timeline
  *   **00–05:** Intro & Definitions (Head off Moral Norm misconception).
  *   **05–10:** Williamson Analogy (Frame the project).
  *   **10–35:** The Stopped Clock Case (Data-First exploration).
  *   **35–40:** Map Data to Theories (Head off Certainty & Grice misconceptions).
  *   **40–45:** Exclusions (Contextualism/Scorekeeping).
  *   **45–50:** Closing Diagnostic Question.

  This plan respects the lecturer's prior work, utilizes the section time for active problem-solving, and systematically inoculates students against the most common confusions in this specific debate.
