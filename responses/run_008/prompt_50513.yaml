prompt: |-
  You are an experienced teacher of epistemology who has trained graduate TAs for years; think carefully and brainstorm the options before committing to a single recommendation. I'm a PhD student in philosophy, TA-ing a large intro epistemology course, and next week I lead my first fifty-minute section on the norms of assertion — the question of what makes an assertion proper or improper: must you know what you assert, must you believe it, or is it enough that it be true? The lecturer has already stated the three main positions in lecture, so the section is mine to structure, and what I want from you is a plan for the explanation rather than the explanation itself.

  A postdoc in my lab suggested a framing I find attractive but don't fully trust: introduce the debate through the data first — the way "how do you know?" seems to demand an answer, the felt oddness of asserting a lottery ticket will lose while believing it will, the Moore-paradoxical sound of flatly asserting p while denying that you know it — and only then let the candidate norms be read off the data, rather than stating each norm up front and testing it against cases. I'm torn between that data-first route and the more standard textbook route of laying out knowledge, truth, and belief norms as rivals and then working through the counterexamples. Which order do you recommend, and what does each order presuppose that the other leaves out? Relatedly, which single case should carry the whole section? Lottery propositions seem ideal because they strain the truth and belief norms without obviously straining knowledge, but I worry the probabilistic machinery will eat the clock; tell me what a good carrying case here must have and must lack, and whether I'm wrong to discount, say, a self-assertion or expert-deference case instead.

  Then the misconceptions, which I'd like mapped to the sequence: I predict students will hear "norm" as a moral rule or a rule of etiquette, will quietly equate knowledge with certainty so that the knowledge norm seems to license only the trivially obvious, and will conflate the norm of assertion with Gricean norms of conversation — I'd like to know exactly where each of those should be headed off rather than after the fact. My postdoc also insists I teach the Williamson-style analogy between assertion and action — that knowledge relates to asserting roughly as intending relates to acting — and I can't tell whether that is load-bearing for the section or a distracting aside; I'd value your judgment on whether it earns its place. Finally, tell me what to openly refuse to cover at this level and say so to the students (contextualism about "knows"? the scorekeeping literature?), and propose one closing question I could ask that would reveal whether they've genuinely grasped the distinction between a norm's being violated and its being the wrong norm, rather than having merely memorized the labels.
