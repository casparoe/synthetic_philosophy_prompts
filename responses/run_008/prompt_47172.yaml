answer: |-
  Your observations are remarkably astute. You have independently identified a puzzle that currently occupies a significant portion of the philosophy of language and linguistics literature. The phenomenon you describe as 'residue' is a recognised problem, often discussed under the headings of the **use-mention distinction**, **expressive content**, and **illocutionary force**.

  There is no single, universally agreed-upon label for the 'residue', but there are several competing frameworks that attempt to explain it. Below, I shall outline the established concepts that map onto your four cases, evaluate how well they fit, and suggest where the current consensus lies regarding why the 'deed' of a slur survives quotation.

  ### 1. The Core Distinction: Semantic vs. Expressive Content

  To understand the 'residue', one must first distinguish between what a word *describes* and what it *expresses*.

  *   **Semantic (Truth-Conditional) Content:** This is the factual claim. If I say, 'He is [slur]', the truth condition is simply whether he belongs to that group. As you noted, this is interchangeable with neutral vocabulary.
  *   **Expressive (Non-Truth-Conditional) Content:** This is the attitude encoded in the word. Most philosophers (such as Christopher Hom or Robert May) argue that slurs carry a **conventional implicature**. This means the word conventionally signals contempt or superiority, separate from the factual claim.

  Your friend's suggestion of Speech Act Theory is close, but as you correctly identified, it is incomplete. A promise is an *illocutionary act* that relies on the speaker's intention to change the social reality. A slur, however, functions more like a **loaded weapon**; its capacity to harm is partly independent of the shooter's aim.

  ### 2. Evaluating Rival Accounts Against Your Cases

  Let us examine how the main theoretical accounts fare against your four instances.

  #### A. The Semantic Account (The Word is Poison)
  This view holds that the offensiveness is baked into the meaning of the word itself.
  *   **Case 1 (Ban vs. Court):** Fails. If the word itself were purely poisonous, the court ruling would offend just as much as the ban argument.
  *   **Case 2 (In-group vs. Out-group):** Fails. If the word were inherently toxic, in-group members could not use it without offence.
  *   **Case 3 (Reading Aloud):** Succeeds. This explains why the sound or sight of the word feels compulsory to avoid; the token itself is treated as taboo.
  *   **Case 4 (Rule Making):** Partially succeeds. It explains why some users are wounded by the mere appearance (the token is toxic to them).

  #### B. The Pragmatic/Expressive Account (It's About Attitude)
  This view holds that the offence lies in the speaker expressing a hateful attitude.
  *   **Case 1:** Succeeds partially. Readers may infer that arguing for a ban requires 'brandishing' the word, which signals a comfort with it that feels threatening, whereas a court ruling is distant.
  *   **Case 2:** Succeeds. In-group usage is understood not as expressing contempt, but as solidarity (see **Appropriation** below).
  *   **Case 3:** Fails. If it were purely about attitude, reading a euphemism should be identical to reading the word, provided the attitude is neutral. The fact that the substitution feels 'different in kind' suggests the word carries weight beyond the speaker's mind.
  *   **Case 4:** Fails. It cannot explain why sincere readers are divided on whether a quotation is offensive.

  #### C. The Presupposition Account (It Assumes Hierarchy)
  This view suggests that using a slur presupposes that the target group is inferior.
  *   **Case 1:** Strong fit. Quoting the slur to ban it might still be seen as invoking the hierarchy to discuss it, whereas a court ruling is analysing the hierarchy from a meta-perspective.
  *   **Case 2:** Strong fit. In-group members are not presupposing their own inferiority; they are subverting the presupposition.
  *   **Case 3:** Weak fit. It does not fully explain the visceral reaction to the *sound* or *sight* of the word during reading.

  ### 3. Explaining the 'Residue': Why Mentioning Still Burns

  You asked why the deed survives quotation. In linguistics, this is often called the **failure of the use-mention distinction** for expressive language. There are three specific concepts that explain your 'residue'.

  #### I. Echoic Mention and Relevance Theory
  Drawing on the work of Sperber and Wilson, some linguists argue that when you quote a word, you are producing an **echoic mention**. You are not just displaying a word; you are echoing a thought.
  *   **In Case 1:** When the member argued for a ban, they had to display the slur prominently. To the reader, this can feel like the speaker is 'trying on' the attitude associated with the word, or forcing the reader to simulate the offensive perspective to understand the argument. The court ruling, by contrast, embeds the word in a dense, formal text that creates **distancing**. The 'residue' here is the cognitive burden placed on the reader to process the offensive concept.

  #### II. Appropriation and Reclamation
  **Case 2** is a classic example of **linguistic appropriation**. When a marginalised group reclaims a slur, they change the **normative conditions** of its use.
  *   For an outsider, the word carries a history of oppression (a **historical entailment**).
  *   For an insider, the word is 'disarmed'. The 'residue' is suspended because the social contract between speaker and listener has changed. The outsider cannot access this suspension because they do not share the history of subversion.

  #### III. The Phonological/Orthographic Taboo
  **Case 3** suggests that for some users, the offence is not just pragmatic but **psychological**. This aligns with the view that slurs function as **taboo objects**.
  *   Just as some religious traditions forbid writing the name of God, some communities find the visual or auditory presence of a slur traumatic, regardless of context.
  *   This explains why the euphemism feels 'different in kind'. The euphemism conveys the *information* but not the *trauma*. The 'residue' is the activation of historical pain associated with the specific phonemes or letters.

  ### 4. Synthesising the 'Residue'

  There is a term gaining traction in recent philosophy (notably in the work of Elisabeth Camp and Luvell Anderson) that may suit your needs: **Offensive Power** or **Illocutionary Potential**.

  However, the most precise description of your 'residue' is likely a combination of **Conventional Implicature** and **Historical Burden**.

  1.  **Conventional Implicature:** The word encodes a rule: 'To say this is to express contempt.' This rule is hard-wired into the language. Even when you mention the word, you are triggering that rule in the listener's mind.
  2.  **Historical Burden:** The word is not just a symbol; it is a record of past violence. When you quote it, you are not just mentioning a string of letters; you are invoking that history.

  This explains why Speech Act Theory fails. A promise is a *constructive* act (it builds a new obligation). A slur is often a *destructive* act (it reinforces a hierarchy). You cannot 'mention' a destruction without reminding people of the damage.

  ### 5. Conclusion: Where the Edges Lie

  To answer your final question on where the edges are:

  *   **The Offence lives in the Uptake:** In Speech Act Theory, an act is not complete without 'uptake' (the audience understanding and accepting the act). In your **Case 4**, the split reaction shows that uptake is subjective. For those wounded by the mention, the illocutionary act *was* completed (they felt the offence). For those who saw only quotation, it was not. Both are sincere because the 'residue' is triggered by the reader's history, not just the writer's intent.
  *   **The Deed is Contextual:** The 'deed' is not static. It is a negotiation between the **history of the word** (which is fixed) and the **context of the utterance** (which is fluid).
      *   In **Case 2**, the context (in-group) overrides the history.
      *   In **Case 3**, the history overrides the context (reading aloud).
      *   In **Case 1**, the context (ban vs. court) tweaks the **distance** between speaker and word.

  **Recommendation for your Forum:**
  There is no philosophical consensus that solves the moderation problem, because the phenomenon is inherently unstable. However, the concept of **distancing** is your most useful tool.
  *   Quoting a court ruling provides *institutional distancing*.
  *   Arguing for a ban often requires *personal engagement* with the word, which reduces distance.
  *   Many moderation guidelines now distinguish between **clinical mention** (e.g., linguistic analysis, legal text) and **gratuitous display**.

  Your term 'residue' is, in fact, philosophically robust. It captures what some theorists call the **'stain'** of the slur: the idea that the word carries a moral contamination that is not fully washed away by quotation marks. You might find the literature on **'the ethics of mentioning'** (specifically regarding slurs) to be the most fruitful area for further reading.

  In short, you are observing the collision between **semantic meaning** (which can be quoted) and **expressive force** (which bleeds through). The offence lives in the fact that to recognise the word is to recognise the hatred it has historically carried, and for some, that recognition is itself a wound.
