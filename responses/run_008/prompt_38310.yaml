answer: |-
  1. A city proposes a complex bond measure to upgrade infrastructure. After the vote, data shows 70% of high-income voters approved it, while only 40% of low-income voters approved it. A subsequent survey reveals most low-income voters did not understand the financial implications, while most high-income voters did. The measure passes overall. Should the result stand?
     A. Yes, every citizen's choice counts equally regardless of understanding.
     B. No, votes from those who failed a basic comprehension check should be discounted.
     C. Yes, but an independent panel should have the power to block it if the financial harm is severe.

  2. A group of citizens is selected by lottery to study a policy problem. They produce a solution that experts agree is better than what the elected legislature produced. However, the group ends up being mostly retired and college-educated, unlike the general population. Should this group be given decision-making power?
     A. Yes, outcomes matter more than perfect demographic mirroring.
     B. No, if they don't look like the public, they shouldn't rule the public.
     C. No, decision-making power should remain with those who won elections, using this group only for advice.

  3. Imagine a panel of the ten best-informed citizens in the country. You know in advance that their recommendations will systematically disadvantage a specific minority group, though their economic reasoning is sound. What do you do?
     A. Follow their recommendations; knowledge should guide policy.
     B. Reject their recommendations; equal protection trumps expert reasoning.
     C. Allow them to propose laws, but require a majority vote of all citizens to approve them.

  4. An electorate votes to ban a medical treatment based on a widely believed claim that science has proven false. The belief is factual, not moral. Is this vote valid?
     A. Yes, citizens have the right to be wrong about facts.
     B. No, voting based on falsehoods invalidates the choice.
     C. Yes, but experts should have the authority to override factual errors before implementation.

  5. A pandemic emerges. Stopping the spread requires immediate lockdowns, but consulting the public for approval will take too long and cost lives. Who decides?
     A. Health experts decide immediately to ensure accuracy and speed.
     B. The public must vote, even if the delay causes harm.
     C. A randomly selected group of citizens decides quickly on behalf of the whole.

  6. Suppose we could prove that excluding 10% of the population from voting would slightly improve the quality of government decisions without harming anyone's rights. Would you support this exclusion?
     A. No, equal participation is valuable even if outcomes are slightly worse.
     B. Yes, better outcomes justify the exclusion.
     C. Only if the excluded group consents to the arrangement.

  7. What is the biggest flaw in choosing leaders through competitive campaigns?
     A. It favors the wealthy and charismatic rather than the wise or representative.
     B. It creates division and conflict among the population.
     C. It doesn't guarantee the winner knows how to govern effectively.

  8. Consider a system where everyone votes, but those who pass a test on civics and current events get two votes instead of one. Is this fair?
     A. No, political power should not depend on test scores.
     B. Yes, it incentivizes learning and weights decisions by competence.
     C. It is acceptable only if the extra votes are used to check harmful laws, not create new ones.

  9. Which group is more likely to solve a complex technical problem correctly?
     A. A large group of diverse people averaging their guesses.
     B. A small group of specialists who study the issue full-time.
     C. A randomly selected group that deliberates for a long time.

  10. You must choose between two systems: System X guarantees fair procedures but often produces inefficient laws. System Y guarantees efficient laws but often bypasses standard procedures. Which do you choose?
      A. System X, because the process is what legitimizes the law.
      B. System Y, because the results are what improve lives.
      C. A mix, where procedures are followed unless an emergency arises.

  ***

  **Scoring Key**

  **This quiz measures your prioritization of political equality versus decisional competence when the two come into conflict.**

  **Position Mapping**
  *   **The Equal-Weight Purist:** You mostly chose options prioritizing equal counting regardless of outcomes (e.g., 1A, 4A, 6A, 10A).
      *   *Awkward Commitment:* You must accept clearly harmful policies if they were produced by the correct procedure.
  *   **The Diversity Optimist:** You mostly chose options favoring broad participation for the sake of varied perspectives (e.g., 2A, 9A, 5C).
      *   *Awkward Commitment:* You must trust that "crowd wisdom" works even when the crowd is demonstrably misinformed.
  *   **The Numbers Believer:** You mostly chose options supporting universal inclusion only because it aggregates information well (e.g., 1A, 9A, 6B).
      *   *Awkward Commitment:* If evidence showed voting stopped tracking truth, you would have to abandon universal inclusion.
  *   **The Competence Prioritizer:** You mostly chose options weighting influence by knowledge or skill (e.g., 1B, 3A, 8B).
      *   *Awkward Commitment:* You must accept that some citizens are permanently less entitled to political power than others.
  *   **The Safety-Brake Defender:** You mostly chose options allowing expert intervention only to prevent disaster (e.g., 1C, 4C, 8C, 10C).
      *   *Awkward Commitment:* You must define exactly who guards the guardians without triggering a power struggle.
  *   **The Election Skeptic:** You mostly chose options favoring random selection over campaigning (e.g., 2A, 5C, 7A).
      *   *Awkward Commitment:* You must accept that leaders may lack specific mandate or accountability to voters.

  **Unoccupied Combinations**
  *   **The "Competent Lottocrat" (High Competence + High Sortition):** Very few students select both "Experts should decide" (Q5A) and "Random selection is best" (Q5C). This combination is logically unstable because sortition selects for representativeness, not necessarily expertise.
  *   **The "Instrumental Egalitarian" (Equality only for outcomes):** There is no clean separation here between the **Equal-Weight Purist** and the **Numbers Believer**. Both support universal voting in almost all actual cases. The quiz cannot cleanly separate them because their practical recommendations overlap 95% of the time; they only diverge on hypothetical "magic button" cases (like Q6) which students often answer inconsistently.

  **Blurred Leaves**
  *   **The Equal-Weight Purist vs. The Numbers Believer:** These positions blur because both defend universal voting. The Purist does so intrinsically, the Believer instrumentally. Since instrumental benefits usually exist, their answers look identical. Do not treat these as distinct political programs in practice; treat them as distinct philosophical justifications for the same program.
  *   **The Safety-Brake Defender vs. The Competence Prioritizer:** These blur on emergency cases (Q5). The distinction lies in who *initiates* law (people vs. experts). If your answers varied between "Experts decide" and "Experts block," you fall in the gap between these two leaves. This is a common, stable moderate position, not an error.
