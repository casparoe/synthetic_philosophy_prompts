  2.  **Determine the Conceptual Order:**
      *   To understand Molinism, students need to understand the problem it solves (Providence vs. Freedom).
      *   They need to understand the types of knowledge in God (Natural, Free, Middle).
      *   They need to understand Counterfactuals of Creaturely Freedom (CCFs).
      *   They need to understand the logical ordering (moments) of divine knowledge/decision.
      *   *Dependency:* You can't explain Middle Knowledge without first establishing the distinction between necessary truths and contingent truths, and then the specific subset of contingent truths that are pre-volitional.
      *   *Order:*
          1.  The Theological Problem (Providence/Control vs. Libertarian Freedom).
          2.  The Taxonomy of Divine Knowledge (Natural vs. Free).
          3.  The Gap (where does God's knowledge of what creatures *would* do fit?).
          4.  Introduction of Middle Knowledge & CCFs.
          5.  The Logical Moments (1, 2, 3).
          6.  Application to Providence.

  3.  **Select the Carrying Example:**
      *   Needs to be simple enough to track through logical moments.
      *   Needs to involve a free choice.
