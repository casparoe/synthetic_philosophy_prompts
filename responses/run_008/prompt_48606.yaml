      *   Also, the **Lottery vs. Preface** distinction: In the Lottery, the probability of losing is *based on the odds*. In the Preface, the probability of truth is *based on evidence*, while the probability of error is *based on human fallibility*. They are independent variables.
      *   What they miss: **Assertion Norms.** When I assert $p$, do I need to believe $p$ is *certainly* true, or just *warrantedly assertible*? Most philosophers of language say the latter.

  5.  **Drafting the Adjudication:**
      *   *Tone:* Professional, philosophical, yet practical (since there's a deadline).
      *   *Structure:*
          1.  Move-by-Move Rating.
          2.  Overall Winner.
