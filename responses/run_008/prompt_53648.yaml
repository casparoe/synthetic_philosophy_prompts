  # The Functional Annotation Decision Tree

  This instrument is designed to sort intuitions about biological function without requiring knowledge of philosophical terminology. It proceeds from concrete cases to theoretical commitments.

  **Entry Commitment:**
  Start with the agreement that **a healthy human heart has the function of pumping blood.** (If you deny this, you are likely an Eliminativist; for the purposes of this database, we assume function-talk is useful).

  ---

  ### Node 1: The Origin Comparison (Hybrid Check)
  **Case:** Compare two molecules:
  1.  **The Accidental Duplicate:** An enzyme molecule assembled by a freak quantum accident (no history, no designer).
  2.  **The Engineered Gene:** An enzyme molecule synthesized in a lab to perform a specific job (design history, no evolution).

  **Question:** Do these two molecules possess "function" in the **same sense**, or does the word mean something different in each case?
  *   **Different senses:** (e.g., "One has a designed function, the other has a biological function.")
      *   ➔ **LEAF: Two-Concept Hybrid**
  *   **Same sense:** (e.g., "Either both have functions or neither does.")
      *   ➔ **Go to Node 2**

  ### Node 2: The Intent Check (Deflationary Check)
  **Case:** **The Engineered Gene** (from Node 1). Suppose the engineer dies and the design notes are lost, so no one remembers what the gene was *intended* to do.

  **Question:** Does the gene lose its function, or does the function remain a fact about the molecule/cell?
  *   **Loses function:** (e.g., "Function is just a label for how we use it.")
      *   ➔ **LEAF: Deflationary**
  *   **Remains a fact:** (e.g., "It still does what it does, regardless of our knowledge.")
      *   ➔ **Go to Node 3**

  ### Node 3: The History Test (Etiological vs. Causal)
  **Case:** **The Accidental Duplicate** (from Node 1). It is molecule-for-molecule identical to a natural enzyme but has no evolutionary or design history.

  **Question:** Does this accidental duplicate have the **same function** as the natural enzyme?
  *   **No:** (e.g., "It's just a lump of matter until selection or design gives it a purpose.")
      *   ➔ **Go to Node 4 (History Branch)**
  *   **Yes:** (e.g., "If it does the job, it has the function.")
      *   ➔ **Go to Node 5 (Capacity Branch)**

  ### Node 4: The Selection Test (Strong vs. Weak Etiological)
  **Case:** Choose **one** of the following:
  *   **A. The Vestigial Structure:** An organ inherited from ancestors but now useless (e.g., a broken enzyme that does nothing).
  *   **B. The New Mutation:** A new gene variant that improves pumping but has not yet been selected (it is the only copy).

  **Question:** Does this trait have a function?
  *   **Yes:** (e.g., "It belongs to a type that was selected," or "It contributes like its ancestors did.")
      *   ➔ **LEAF: Weak Etiological**
  *   **No:** (e.g., "Function requires that selection explains why *this* trait is here *now*.")
      *   ➔ **LEAF: Strong Etiological**

  ### Node 5: The System Boundary Test (Biostatistical vs. Organizational)
  **Case:** **The Cancer-Cell Lineage.** A mutation helps the cancer cell divide rapidly but kills the host organism.

  **Question:** Is "rapid division" a **function** of this trait?
  *   **No:** (e.g., "Functions must benefit the healthy organism, not a pathological sub-system.")
      *   ➔ **LEAF: Biostatistical**
  *   **Yes:** (e.g., "It functions for the cell lineage, which is a self-maintaining system.")
      *   ➔ **Go to Node 6**

  ### Node 6: The Capacity Scope Test (Cummins vs. Organizational)
  **Case:** **The Co-opted Trait.** (e.g., Feathers originally for warmth, now for flight).
  *Follow-up:* Consider a trait's side-effect (e.g., a heart making a thumping sound).

  **Question:** Is the function **any current causal contribution** the trait makes, or only contributions that **maintain the system's organization**?
  *   **Any contribution:** (e.g., "If it does it, it's a function, even if it's just a side-effect or new use.")
      *   ➔ **LEAF: Cummins-Style Causal Role**
  *   **Only maintenance:** (e.g., "It must contribute to the system staying alive/organized to count.")
      *   ➔ **LEAF: Organizational**

  ---

  ## Meta-Analysis of the Logical Space

  ### 1. Indistinguishable Leaves
  **Strong Etiological vs. Weak Etiological:**
  This tree flags a potential collapse between these two leaves at **Node 4**. If a respondent answers "No" to the Vestigial case (Strong) but "Yes" to the New Mutation case (Weak), the tree cannot sort them without a deeper dive into *why* selection matters.
  *   **The Wedge Needed:** A case where a trait was selected for in the past, is *still* present, but no longer contributes to fitness (a "lazy" trait). Strong Etiologists say it retains function (selection explains presence); Weak Etiologists might say it loses function (no ancestral contribution *now*). The current Vestigial/New Mutation pair assumes these track together, which they usually do, but not always.

  ### 2. Unoccupied Logical Space
  **History + Any Capacity:**
  There is no leaf for the position: "History is required to have a function (Node 3 = No), BUT any causal capacity counts as that function (Node 6 = Any)."
  *   **Diagnosis:** This combination is **incoherent**. If history is required, the function is fixed by the past (Selected Effect), not by whatever the trait happens to do now. You cannot demand historical origin for the *existence* of the function but ignore history for the *content* of the function.

  **Design-Only Realism:**
  There is no leaf for: "Engineered genes have real functions, but natural genes do not (or vice versa)."
  *   **Diagnosis:** This was captured by the **Two-Concept Hybrid** leaf at Node 1. However, a position claiming *only* designed things have functions (Cartesian Dualism of biology) is **unexplored** here. It would require a respondent to answer "No" at Node 3 for natural genes but "Yes" for engineered ones, which Node 1 forces them to declare as a Hybrid view rather than a single theory.

  ### 3. Self-Containment Check
  All nodes rely on concrete scenarios (Accidental Duplicate, Engineered Gene, Cancer, etc.). No node asks "Do you accept Selected-Effects Theory?" or "Are you a Realist?" The theoretical labels appear *only* at the leaves, allowing a biologist and a philosopher to arrive at the same leaf (e.g., **Biostatistical**) via the same case-based reasoning (Cancer is not a function) without needing to know the label in advance.
