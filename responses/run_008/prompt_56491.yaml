      *   *Correction:* Ensure the distinction between "determinism" (causal) and "determinacy" (truth values of future contingents) is clear, as the book muddles them.
      *   *Tone Check:* Keep it respectful of the colleague's book (popular press) but firm on the errors.
      *   *Specifics:* The "Dutch physicist" is C.W. Rietdijk. The "distant galaxy" example is often associated with Penrose (Andromeda Paradox), though it relies on the Rietdijk-Putnam logic. I should mention Penrose to be precise, as the book says "moving toward a distant galaxy."

  7.  **Final Review against constraints:**
