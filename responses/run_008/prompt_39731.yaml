answer: |-
  **MEMORANDUM**

  **TO:** Interpretive Planning Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Main Gallery Label: The Great Irish Famine

  **Purpose**
  This memo resolves the deadlock regarding the interpretive framing of the Great Irish Famine (1845–1852). Our dispute is not merely semantic; it concerns the fundamental nature of famine. Is it an ecological event that befalls a population, or a political fact regarding who retained the entitlement to eat while others did not? I recommend we adopt the latter framework, grounded in Amartya Sen's entitlement theory, to draft a label that assigns culpability without relying on anachronistic legal categories.

  **The Substantive Framework: Entitlement vs. Shortage**
  Senior Historians (Faction B) argue for "natural disaster compounded by policy failure." Diaspora Donors (Faction A) argue for "genocide," citing continued food exports. Both positions contain truth, but both are incomplete.

  Amartya Sen's research demonstrates that starvation rarely results from an absolute decline in food supply, but rather from a collapse in specific groups' *entitlements* to access that food. In Ireland, the potato blight was the ecological trigger, but the mass mortality was political. Food was produced in Ireland and exported to Britain throughout the crisis. The famine was not a shortage of food; it was a shortage of access enforced by market ideology. Therefore, characterizing the event primarily as a "natural disaster" is historically inaccurate. It minimizes the human decisions that converted a crop failure into a mortality event.

  However, classifying this as "genocide" presents historiographical risks. The UN definition (1948) requires specific intent to destroy a group. While British policy was negligent and often racist, evidence of a deliberate plot to exterminate the Irish is scant. Adopting "genocide" invites peers to dismiss the exhibit as moralizing rather than historical, undermining our credibility on the very policy failures we seek to highlight.

  **The Trevelyan Letter and the Morality of Omission**
  We possess a letter from Charles Trevelyan (April 1846) stating relief must not disturb "the ordinary course of private trade," yet claiming people "must not, under any circumstances, be allowed to starve." One million died.

  How do we label this? It is not clear evidence of genocidal intent, but it is definitive evidence of ideological prioritization. Trevelyan's statement reveals a government that believed preserving the free market was a higher moral imperative than intervening to save lives. Regarding the omission/commission distinction: in governance, the choice *not* to act when one has the power to prevent foreseeable death is a moral commission. The British government possessed the naval power to halt exports and the fiscal capacity to expand relief. They chose not to. This was not passive neglect; it was active adherence to laissez-faire doctrine at the cost of human life.

  **Recommendation and Label Text**
  I recommend we reject both "Natural Disaster" and "Genocide" in the headline, opting instead for "Political Catastrophe." This validates the donors' demand for accountability while respecting the historians' demand for precision.

  **Proposed Label Text:**
  > **The Great Hunger: A Political Catastrophe**
  > Between 1845 and 1852, potato blight destroyed the primary food source of Ireland's poor. Yet Ireland produced enough grain and livestock to feed its population. Under British rule, these resources were exported commercially while the populace starved.
  >
  > Modern analysis shows famines are rarely caused by food shortages alone, but by the collapse of people's entitlement to access food. In Ireland, relief was constrained by ideological commitment to free-market trade over human survival. While not a genocide in legal terms, the mortality was man-made: the result of policy choices that prioritized economic doctrine over the prevention of starvation.

  **The Strongest Counter-Argument**
  The strongest argument against this recommendation comes from the Diaspora Donors (Faction A). Their insistence on "genocide" is not merely a historical claim but a moral one. They argue that distinguishing between "negligence" and "intent" is a luxury of the safe. When a state knows its policies will result in mass death and proceeds regardless, the distinction between omission and commission collapses. To them, "Political Catastrophe" sounds sterile, sanitizing a trauma that functions as a foundational wound in Irish identity. They are correct that language shapes memory; softening the label risks repeating the erasure they feel the Famine has already suffered. We must acknowledge that for many visitors, "policy failure" feels like a euphemism for murder.

  However, if we use "genocide," we shift the visitor's focus from *structural analysis* to *legal debate*. The exhibit becomes about whether the British met the 1948 UN standard, rather than about how famines function and how they are prevented. By focusing on entitlement and political choice, we secure a more durable condemnation: one that holds the government responsible for what it *did*—enforce exports and limit relief—without requiring us to prove a secret intent to destroy.

  **Decision Required**
  We must vote on the interpretive frame.

  **Motion:** To approve the label text above, framing the Famine as a "Political Catastrophe" driven by entitlement failure and ideological policy choices, explicitly noting the continuation of food exports, while omitting the term "genocide."

  **Vote Options:**
  *   **YES:** Adopts the "Political Catastrophe/Entitlement" framework.
  *   **NO:** Rejects this language in favor of either "Genocide" or "Natural Disaster" framing.

  This approach ensures the exhibit remains rigorous enough for historians while holding power accountable enough for the descendants of the starving. It treats famine not as a tragedy that happened, but as a crime of governance that was permitted.

  Respectfully submitted,

  [Your Name]
