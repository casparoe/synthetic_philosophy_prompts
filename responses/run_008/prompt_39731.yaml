prompt: |-
  I serve on the interpretive planning committee of a national history museum, and we are finalizing the main gallery label for our new permanent exhibit on the Great Irish Famine of 1845–1852. The committee has deadlocked and I have been asked to circulate a written recommendation before next month's meeting. Draft that decision memo for me.

  The dispute is over how the label should characterize the event's causes. One faction, backed by our diaspora donors, wants the label to call the Famine a genocide and to foreground the food exports that continued throughout the crisis. A second faction, led by our senior historians, insists that the label must present the Famine primarily as a natural disaster — the potato blight — compounded by policy failures, and argues that importing a postwar legal category like genocide into an 1840s context is anachronistic moralizing that our peers would treat as unserious. A third faction wants a middle path: famine as a "man-made catastrophe," language they point to in recent debates over whether Bengal in 1943 and the Great Leap Forward should be classified as crimes rather than tragedies.

  The memo should not simply split the difference. It should recommend specific label language we can vote on, and ground the recommendation in the substantive question underneath the wording: is famine best understood as an event that befalls a population, or as a political fact about who retained the entitlement to eat while others did not? Amartya Sen's classic argument that starvation reflects a collapse of people's entitlements rather than a shortage of food is central here, as is his observation that famines can occur without any overall decline in food supply, and his further point that famines are comparatively easy to prevent in countries with a free press and electoral accountability. The memo should also confront the omission/commission problem directly: much of the case for culpability in Ireland rests on things the government declined to do — halting exports, continuing relief — rather than on affirmative acts, and the memo must say whether that distinction can carry the moral weight the genocide faction places on it.

  As exhibit material, we have a letter from April 1846 in which Charles Trevelyan, the Treasury official overseeing relief, wrote that measures must proceed with as little disturbance as possible of the ordinary course of private trade, which must ever be the chief resource for the subsistence of the people, but that the people must not, under any circumstances, be allowed to starve. A million people died. The memo should address what we should do with a document like this in a label: whether it is evidence of intent, evidence of self-deception, or something the exhibit should simply let visitors sit with.

  Finally, give the strongest honest treatment of the losing side, whichever side loses: the committee's decision will be publicly scrutinized, and the memo needs to show we understood the best argument against us, not merely the most convenient one. The memo should be short enough to be read before the meeting — roughly 1,000 words — and should end with a recommendation framed so that each committee member can see exactly what they are voting for or against.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the interpretive planning committee of a national history museum.
      *   **Task:** Draft a decision memo regarding the main gallery label for a new permanent exhibit on the Great Irish Famine (1845–1852).
      *   **Audience:** The committee (historians, donors, administrators).
      *   **Conflict:** Three factions regarding the causes of the Famine:
          1.  *Genocide/Food Export Focus:* Backed by diaspora donors. Wants "genocide" label, focus on exports.
          2.  *Natural Disaster/Policy Failure Focus:* Led by senior historians. Wants "blight + policy failure," rejects "genocide" as anachronistic.
          3.  *Man-Made Catastrophe:* Middle path, focuses on entitlement/crime vs. tragedy.
      *   **Key Theoretical Framework:** Amartya Sen's entitlement theory (famine = collapse of entitlement, not necessarily food shortage; prevented by free press/accountability).
      *   **Key Ethical/Legal Issue:** Omission vs. Commission (culpability based on inaction).
      *   **Specific Artifact:** Charles Trevelyan's April 1846 letter (balance private trade vs. not allowing starvation).
      *   **Requirement:** Do not simply split the difference. Recommend specific label language. Address the substantive question (event vs. political fact). Give the strongest honest treatment of the losing side.
      *   **Length:** Roughly 1,000 words.
      *   **Ending:** Clear recommendation for voting.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks me to *recommend* specific language. To make a strong memo, I need to pick a lane, even if it synthesizes elements.
      *   *Option A (Genocide):* Historically contentious, likely to alienate academic peers, risks legalistic debates over intent that a museum label can't sustain.
      *   *Option B (Natural Disaster):* Ignores the political economy, undermines Sen's insights, insults the diaspora's lived memory of injustice.
      *   *Option C (Entitlement/Political Fact):* This aligns best with modern famine studies (Sen) and addresses the "man-made" aspect without getting bogged down in the legal definition of genocide. It allows us to highlight the exports and policy failures without making a legal claim of intent to destroy a group.
      *   *Decision:* I will recommend the "Political Fact/Entitlement" approach ( Faction 3 refined by Sen). It validates the donors' anger about exports/policy without accepting the historically anachronistic "genocide" label, while rejecting the historians' "natural disaster" minimization.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose. Acknowledge the deadlock. Frame the core question (Event vs. Political Fact).
      *   **Theoretical Framework (Sen):** Integrate Amartya Sen's entitlement theory. This is crucial for the prompt. Explain that famine isn't just lack of food; it's lack of access.
      *   **Addressing the Factions:**
          *   *Genocide:* Acknowledge the moral weight. Exports *did* continue. But "genocide" requires specific intent (UN Convention 1948) that is hard to prove for 1847.
          *   *Natural Disaster:* Acknowledge the blight. But blight alone didn't cause mass death; policy did.
          *   *The Recommendation:* "Man-Made Catastrophe" within an Entitlement Framework.
      *   **The Trevelyan Letter:** How to use it? It shows the ideology (laissez-faire) overriding the humanitarian promise ("must not be allowed to starve"). It's evidence of structural negligence, not necessarily explicit intent to kill, but certainly self-deception or ideological blindness.
      *   **Omission vs. Commission:** Address the moral weight of inaction. In governance, omission *is* commission.
      *   **Strongest Counter-Argument:** If I reject "Genocide," I must honor that argument. The counter is that "policy failure" sounds too passive. If I reject "Natural Disaster," I must honor the historical rigor argument. (I will likely lean towards rejecting "Genocide" as the primary label but validating the *grievance*, while rejecting "Natural Disaster" as the *explanation*). Let's decide: The recommendation will be "Political Catastrophe/Entitlement Failure." The "losing" side is the Genocide faction (mostly), but also the Natural Disaster faction. I need to treat the *strongest* opposing view honestly. The Historians' view on anachronism is strong. The Donors' view on moral culpability is strong. I will frame the recommendation to satisfy the Donors' moral claim without using the Historians' rejected terminology.
      *   **Specific Label Language:** Draft the actual text.
      *   **Conclusion/Vote:** Clear call to action.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address omission vs. commission? Yes, need to make sure I state that state inaction is a political choice.
      *   *Check:* Did I use Sen? Yes, entitlement to eat.
      *   *Check:* Trevelyan letter? Yes, use it to show the tension between ideology and reality.
      *   *Check:* Word count? Keep it tight.
      *   *Check:* Tone? Professional, decisive, empathetic to all sides.

  5.  **Drafting the Content (Iterative process):**
      *   *Opening:* We are stuck on semantics, but this is about history and memory.
      *   *Sen:* Famine is not a food shortage; it's a rights shortage. Ireland exported food while people starved. This validates the export argument without needing "genocide."
      *   *Trevelyan:* The letter shows the British government prioritized market principles over life. Was it murder? Maybe not legally. Was it culpable negligence? Yes.
      *   *The Label:* Needs to be precise. "Ecological shock met with ideological rigidity."
      *   *Counter-argument:* The Historians are right about "genocide" being anachronistic. The Donors are right that "natural disaster" is a lie. The middle ground isn't compromise; it's precision.
      *   *Closing:* The vote.

  6.  **Final Polish:** Check word count and ensure the "losing side" gets a fair hearing. If I recommend against "Genocide," I must explain why that term, while emotionally resonant, weakens the historical argument. If I recommend against "Natural Disaster," I must explain why it obscures the truth. I will frame the recommendation as adopting the "Entitlement/Political" framework, which effectively rejects "Natural Disaster" as the *primary* driver but also rejects "Genocide" as the *legal* classification. The strongest losing argument is probably the Historians' concern about credibility. I need to show that avoiding "genocide" protects credibility while still assigning blame.

      *Wait, looking closer at the prompt:* "Give the strongest honest treatment of the losing side, whichever side loses."
      If I recommend the "Man-Made/Entitlement" path (Faction 3 refined), both 1 and 2 lose something. But Faction 1 (Genocide) is the most emotionally charged. Faction 2 (Natural Disaster) is the most academically traditional.
      Actually, the prompt implies I need to pick a specific label. I will recommend a label that emphasizes *Political Catastrophe* driven by *Entitlement Failure*. This sides most with Faction 3 but incorporates Faction 1's evidence (exports) and Faction 2's caution (terminology).
      The "Losing Side" to treat most honestly is likely the Genocide faction, as they are being asked to step back from their preferred term. I must validate their moral intuition while explaining the historical risk.

      *Revised Plan:*
      1. Define the core question (Sen).
      2. Analyze Trevelyan/Omission.
      3. Propose Label.
      4. Address the "Genocide" counter-argument (the strongest emotional/historical pushback).
      5. Vote.

      *Let's write.*

      *(Self-Correction on Word Count)*: Keep paragraphs tight. Ensure the label text is distinct.

      *(Refining the Trevelyan point)*: The letter says "must not be allowed to starve" but prioritizes "private trade." This is the crux. It's not necessarily intent to kill, but intent to preserve the market *despite* killing. That is the nuance.

      *(Refining the Omission/Commission)*: In public policy, failing to prevent foreseeable death when one has the power to do so is a moral commission.

      *(Final check on constraints)*: 1,000 words. Specific label language. Sen's theory. Trevelyan letter. Omission/Commission. Strongest counter-argument.

