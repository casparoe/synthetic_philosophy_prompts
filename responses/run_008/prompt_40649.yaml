      *   *Key Insight:* The strong eliminativist defines the "belief role" by the *theory* of FP. If the new science doesn't match the *theory*, it's elimination. The risk is if the theory is defined so narrowly that nothing could match it except magic.

  6.  **Final Polish:** Ensure clear headings and precise philosophical terminology (e.g., "personal/sub-personal," "normative/descriptive," "homeostatic property clusters"). (Proceed to generate output based on these thoughts.)

