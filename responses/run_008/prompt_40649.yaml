      *   **Core Claim:** Mature cognitive science will not find *anything* occupying the belief/desire role, not even approximately. Folk psychology (FP) is radically false, not just rough.
      *   **Specific Constraints:**
          *   Ignore the self-refutation objection (they know the standard replies).
          *   Focus on empirical/conceptual defeaters that should actually move them.
