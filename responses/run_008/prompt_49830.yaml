answer: |-
  This is a sharp reconstruction of an argument that circulates in the corners of the rationalist diaspora (often called the "Simulation Shutdown" or "Short Sim" objection). Your intuition that it "proves too much" is correct, and your suspicion that it smuggles in risk aversion is astute.

  To answer your question directly: **The argument breaks at Step 4, and it cheats at Step 6.**

  Here is the breakdown of where the logic fails, the philosophical cost of fixing it, and the practical verdict for your donations.

  ### 1. The Fatal Flaw: Step 4 (The "Short Sim" Assumption)

  Your friend's argument hinges on the claim that *"Ancestor sims are presumably run for research or entertainment, which plausibly mean decades of simulated time, not billions of years. Nobody keeps a save file running forever."*

  This is the weakest empirical link. It projects human cognitive limitations (boredom, budget constraints, attention spans) onto a post-human civilization capable of running ancestor simulations in the first place.

  *   **Compute is likely cheap for them:** If a civilization can simulate a universe down to the quantum level (or even just macroscopically consistent), their energy budget is likely stellar-scale (Dyson spheres, etc.). The marginal cost of running a simulation for 10,000 years vs. 10 billion years might be negligible relative to their total resources.
  *   **"Set and Forget":** Simulations need not be actively monitored. They can be automated processes running on substrate that outlasts biological attention spans.
  *   **The Selection Effect:** Even if *most* sims are short, we should condition on being in a *long* sim. If 99% of sims are shut down after 100 years, but 1% are run for the full heat-death of the simulator's universe, the vast majority of *simulated observer-moments* exist in the long sims. By the Self-Sampling Assumption, you are overwhelmingly likely to be in a long sim if long sims contain most of the people.

  **Cost of rejecting Step 4:** You must accept that post-human civilizations might have goals or resource constraints radically different from human ones, and that "boredom" does not scale to superintelligence. This is a standard assumption in longtermism anyway.

  ### 2. The Anthropics Cheat: Step 6 (The Credence Update)

  Your friend writes: *"Give it even a few percent credence that we're in a sim... therefore the astronomical EV... should be discounted."*

  This hides a crucial mathematical interaction between the **probability of being simulated** and the **value of base reality**.

  Let $P(B)$ be the probability we are in Base Reality.
  Let $P(S)$ be the probability we are in a Simulation.
  Let $V(B)$ be the value of the future in Base Reality ($\approx 10^{50}$ lives).
  Let $V(S)$ be the value of the future in a Simulation (Friend claims $\approx 10^{12}$ lives).

  The Total Expected Value is:
  $$E = P(B) \cdot V(B) + P(S) \cdot V(S)$$

  Your friend argues that because $P(S)$ is high (say, 90%), $E$ collapses. But notice the first term: $P(B) \cdot V(B)$.
  Even if $P(B)$ is only 10% (or 1%, or 0.01%), $V(B)$ is so astronomically large ($10^{50}$) that the first term **still dominates** the second term ($10^{12}$).

  $$0.0001 \times 10^{50} = 10^{46}$$
  $$0.9999 \times 10^{12} \approx 10^{12}$$

  $10^{46}$ still swamps mosquito nets. The only way the friend's math works is if $P(B)$ is *inversely proportional* to $V(B)$. This happens if you adopt the **Self-Indication Assumption (SIA)** aggressively: if the number of simulated people scales with the potential size of the future, then the probability of being in base reality drops as the value of base reality rises.

  **Cost of rejecting Step 6:** To save longtermism here, you must reject strong SIA in favor of something like the **Self-Sampling Assumption (SSA)** or a "restricted reference class." This opens you to the "Presumptuous Philosopher" objection (i.e., you are claiming to know a priori that the universe is small enough that you are likely in the base version). However, most longtermists already accept this cost; they argue that SIA leads to absurdities (like the "Great Filter" being almost certainly behind us purely because there are more future people), so rejecting SIA is a feature, not a bug.

  ### 3. Your Intuition: The Recursive Collapse

  You wrote: *"If the discounting move... works, it should work recursively... expected-value reasoning about the long run collapses at every level."*

  This is the strongest philosophical rebuttal. If the "Short Sim" argument is valid, it applies to the simulators too.
  *   If *we* shouldn't invest in the far future because we might be simulated and shut off...
  *   Then *our simulators* shouldn't invest in *their* far future because *they* might be simulated and shut off.
  *   This propagates up the chain. No level of reality invests in the long term.
  *   If no level invests in the long term, no level creates the simulations in the first place (since running ancestor sims is a long-term investment).
  *   Therefore, there are no simulations.
  *   Therefore, we are in base reality.

  This is a **reductio ad absurdum**. The argument destroys the precondition for its own premise (that there are many simulations). A rational civilization that accepts the "Short Sim" argument would not run ancestor simulations. Since we are considering the possibility that they *do*, we must assume they have solved this decision-theoretic problem (perhaps by accepting the "Base Reality Tail" argument above).

  ### 4. Practical Verdict: Does this change where you send money?

  **No.**

  Even if you grant your friend's strongest case—that there is a 99% chance we are in a sim, and that sim has a 99% chance of being shut down in 100 years—you are left with a 1% chance of being in Base Reality with an astronomical future.

  *   **Near-term causes (e.g., malaria nets):** Save a life for $\approx \$5,000$. Impact is finite and local.
  *   **X-risk reduction:** Reduces probability of extinction by a tiny fraction (say, $10^{-6}$).
      *   In the "Sim" branch: Value is capped ($10^{12}$ lives). Contribution is small.
      *   In the "Base" branch: Value is uncapped ($10^{50}$ lives). Contribution is massive.
      *   Weighted Value: $(0.01 \times 10^{-6} \times 10^{50}) \gg (1.0 \times 10^{-6} \times 10^{12})$.

  The "Base Reality Tail" is so fat that it swamps the discounted simulation value. As long as you assign *non-negligible* credence to Base Reality (and standard anthropics suggests you should, to avoid the Presumptuous Philosopher problem), the fanaticism holds.

  ### Summary of the Break

  1.  **Reject Step 4:** There is no evidence sims must be short. Post-human compute is likely cheap and automated.
  2.  **Reject Step 6 (Implicit SIA):** Do not let the probability of Base Reality scale inversely to its value. Keep $P(\text{Base})$ fixed (e.g., at 10% or 1%). The EV of that tail dominates.
  3.  **Accept the Recursive Critique:** The argument is self-defeating. If it were true, simulations wouldn't exist.

  **The Cost:** You have to be comfortable acting on the 1% chance that you are in Base Reality, ignoring the 99% chance you are in a Sim. This feels like Pascal's Mugging, but the difference is that the "Base Reality" hypothesis is not an arbitrary magical claim; it is the null hypothesis of physics. Ignoring the null hypothesis because a specific alternative (SimH) is popular is bad Bayesian practice.

  **Bottom Line:** Your friend's argument is a clever "scope neglect" trick. It asks you to focus on the high-probability/low-value branch (Sim) and ignore the low-probability/high-value branch (Base). But in expected value calculations, the low-probability/high-value branch is the *only one that matters*. Keep donating to x-risk.
