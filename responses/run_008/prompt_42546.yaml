  Dear Friends,

  As I mark the second anniversary of our retirement reading group, I find myself reflecting on the peculiar value of our stalemate. We have spent a year circling the same arguments regarding Discipline and Punish, and while we have not converged, I believe we have mapped the terrain of our divergence with sufficient precision that we ought to be able to sign a joint statement describing exactly where we stand. I am writing this letter to propose the text of such a document, one that captures our shared ground, isolates our genuine disagreements, and sets the terms for how we might proceed, or at least how we might understand why we do not. I ask you to read this not as a verdict from the chair, but as a draft of our collective intellectual position, phrased so that neither of you need wince at the attribution of your own views, followed by my own judgment on the nature of the impasse we have reached.

  We begin by affirming the claims upon which we are already agreed. We accept that the mechanisms Foucault describes under the heading of disciplinary power, specifically hierarchical observation, normalizing judgment, and the examination, are not mere metaphors but accurate descriptions of techniques that exist within modern scientific institutions, including the chemistry laboratory from which I retired. We agree that the thesis of disciplinary power asserts something more than the banal sociological observation that institutions influence people; it asserts that these techniques are productive, constituting the very subjects who inhabit the institution and the knowledge they produce, rather than merely repressing or channeling pre-existing agents. We further agree that the demand for falsifiability is a normative standard internal to the scientific tradition rather than a universal law of meaningful discourse, and that invoking it against a historical or philosophical thesis requires justifying why that thesis ought to be held to a scientific standard in the first place. Conversely, we agree that a theory which is compatible with every possible state of affairs risks explaining nothing, and that the claim that the demand for falsifiability is itself a disciplinary tactic does not, on its own, demonstrate that the theory is true.

  Having established this common ground, we record our remaining disagreements precisely. The first divergence concerns the status of the thesis itself. One of us holds that the account of disciplinary power is primarily an empirical, historical claim about how specific techniques emerged in the eighteenth and nineteenth centuries to transform specific institutions, and that it is therefore refutable in principle by institutional history showing that these techniques did not produce the claimed effects. The other holds that the account is primarily conceptual or philosophical, describing the conditions of possibility for modern knowledge and subjectivity, such that historical counter-examples would be interpreted as variations within the regime rather than falsifications of it. The second divergence concerns the possibility of normative critique. One of us maintains that because the critic is constituted by the same power relations she critiques, she must rely on immanent critique, using the regime's own values against it, and cannot claim a transcendent standpoint of justice or truth. The other maintains that without some appeal to norms that are not merely products of the prevailing power structure, critique collapses into mere preference or power play, rendering the condemnation of objectionable practices logically incoherent.

  To move beyond abstract formulation, we identify two cruxes and specify the evidence that bears on them. Regarding the empirical versus conceptual status of the thesis, we agree to consider the history of the laboratory notebook. The sociologist predicts that an examination of archival notebooks will show that their primary function was the creation of an accountable subject and the standardization of behavior, and that if they failed to do this, they would have been modified to restore that function rather than discarded. The philosopher predicts that the notebook's persistence depends on its accuracy in tracking chemical reality, and that if a method were found that produced more reliable knowledge without the notebook, the notebook would be abandoned, proving its subordination to epistemic utility rather than disciplinary constitution. Regarding the possibility of normative critique, we agree to consider the case of research fraud. The sociologist predicts that the condemnation of fraud will be shown to function as a boundary-maintenance mechanism that reinforces the authority of the institution and the metrics of trust it relies upon. The philosopher predicts that the condemnation of fraud appeals to a concept of truth that exists prior to and independent of the institution, and that the outrage would persist even if the fraud were undetectable and institutionally beneficial.

  I close with my own judgment on the state of our argument, offered as the retired chemist who has listened to you both for two years. It is my view that a portion of your disagreement is merely verbal, resting on a dispute over the word power that would dissolve if we distinguished between power as a causal force that compels behavior and power as a constitutive medium that defines what counts as behavior. If the sociologist speaks of the medium and the philosopher speaks of the force, you are talking past one another, and this verbal knot could be untied by stipulative definition. However, the disagreement regarding normative critique is substantive and cannot be dissolved by rephrasing. It rests on a fundamental divergence in your metaphysics of truth: whether truth is a regulative ideal that stands outside history or a historical product that is weaponized within it. On this point, I do not believe anything could actually move either party, because to move would require one of you to abandon the foundational commitment that makes your respective life's work coherent. The sociologist cannot grant a transcendent norm without undermining the genealogy of knowledge, and the philosopher cannot accept immanent critique without surrendering the universality of scientific rationality. We may sign this statement not to resolve the dispute, but to acknowledge that we have reached the bedrock where our spades turn, and that the value of our group lies not in converging on a single truth, but in maintaining the tension between these two irreconcilable but necessary descriptions of the world we inhabit.
