prompt: |-
  So I'm a third-year ML PhD student, mostly working on ensembles -- bagging, random forests, that whole family of variance-reduction tricks -- and my partner is a poli sci grad student who drags me to her epistemic democracy reading group. Last week the topic was the Condorcet jury theorem, and everyone there treated it like obviously profound, and I kept thinking "this is just... averaging weak learners?" If each voter is better than a coin flip and their errors are independent, majority accuracy goes to 1 as you add voters -- fine, law of large numbers, sure. But the polisci people clearly think it licenses much more than "committees of mediocre models beat one good model," and I can't tell whether the extra stuff is real or whether I'm just pattern-matching too aggressively onto things I already know.

  So here's the ask: translate the jury theorem and its extensions into my vocabulary, as honestly as you can. Voters as base estimators, individual competence as a weak learner being better than chance, majority rule as a majority-vote ensemble, and so on. I remember someone in the group mentioning a result that with correlated votes you need the average correlation to shrink roughly like 1/n for the accuracy result to survive -- say what that corresponds to on my side (error decorrelation, why random forests actually bother with feature subsampling, the common-cause problem when all your learners train on the same data). And tell me if boosting fits in at all, since it's sequential in a way that feels like it might map onto voters hearing each other's opinions before voting. But be careful not to smuggle in my framework's assumptions and call that translation -- e.g. on my side there's always a ground truth label somewhere, even if I can't afford to query it, and I suspect that's doing work the jury theorem people can't cash.

  Then the part I actually care about: the residue report. Which pieces of the jury theorem translate cleanly, which come over only distorted, and which have no expression at all in ensemble-speak? Specifically, my partner's group reads the theorem as an argument for the legitimacy of majority rule, and also there was some hand-wringing about whether voters actually vote their sincere beliefs -- both of those feel like they might live in the residue, since my ensemble members don't get to lie and I've never once asked whether a random forest's output is entitled to command anything. So: is the residue telling me my vocabulary is missing something, or is it telling me the polisci people are loading normative freight onto a statistical result that never carried it? She says I'm being reductive; I'd genuinely like to know if I am.
