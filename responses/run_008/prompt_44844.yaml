  *(Self-Correction during drafting)*: Make sure I don't sound *too* hostile. Friedman was confident, not necessarily a bully, but he was intellectually dominant. He would treat this as a teaching moment but a firm correction. The user is trying to use Friedman as a shield without doing the work Friedman requires (empirical validation). I need to point that out. The user says "your doctrine... tells me to ignore him." I need to correct that: "No, it tells you to outperform him."

