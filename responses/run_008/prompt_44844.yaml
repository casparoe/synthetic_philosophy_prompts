answer: |-
  You're trying to turn a methodology into a taxonomy, and that is precisely where your methodologist has you trapped. You want me to give you a rulebook for classifying assumptions—negligible versus domain versus tractability—so you can check the right box and wave away the criticism. I won't do it, because there is no such box.

  You say my doctrine tells you to ignore the critic. No. It tells you to render him irrelevant.

  Let's be clear about what I wrote in '53. The relevant question is not whether the assumptions are "realistic" in a descriptive sense. They never are. If they were, they wouldn't be assumptions; they would be a photograph of the world, and you wouldn't need a model. The question is whether the assumptions are *sufficiently accurate* for the purpose at hand. And how do you measure that accuracy? Not by inspecting the assumptions themselves. You measure it by looking at the predictions.

  You're worried that your assumption about firms knowing the distribution of match quality is a "tractability fiction." Fine. So what? Do expert billiard players know the physics formulas governing momentum and friction? No. Do leaves know trigonometry to maximize sunlight? No. But if you predict their behavior *as if* they do, do you get the right answer? If yes, the assumption is valid. If no, it is not.

  Your methodologist is attacking the engine while the car is sitting in the garage. He says the assumption is indefensible. You respond by saying, "But Professor Friedman says assumptions don't matter!" That is a misreading. Assumptions matter immensely, but only insofar as they determine the validity of the predictions.

  You claim my doctrine gives you no way to distinguish between types of assumptions. Correct. Because the distinction is meaningless to the scientist. The only distinction that matters is between a theory that works and a theory that doesn't.

  So, stop trying to defend the assumption. You will lose that argument every time, because on its face, yes, it is unrealistic. No firm knows a distribution with certainty. We agree. Now, here is the fight you should be having: Does your model predict hiring flows better than the alternative? Does it match the volatility of vacancies? Does it explain wage dispersion?

  If your model predicts the data well, then the assumption is justified *by the results*, not by your classification scheme. If your model predicts poorly, then no amount of philosophical wrangling about "tractability" will save it.

  You say my approach tells you to ignore the critic. It tells you to change the subject to the only subject that matters: evidence. Have you tested your model against the data? Or are you still playing with the algebra? Because if you haven't tested it, your methodologist is right—not because your assumptions are unrealistic, but because you haven't yet shown they are useful.

  So, tell me: What does your model predict that the other models don't? And have you checked if it's true?
