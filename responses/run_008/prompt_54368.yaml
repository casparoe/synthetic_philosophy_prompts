      *   *The "Proof" vs. "Knowledge":* Moore distinguishes between proving a proposition and knowing it. He claims he knows the premises. He claims the argument is valid. Therefore it is a proof. The failure is *dialectical* (it doesn't convince the skeptic), not *logical*.
