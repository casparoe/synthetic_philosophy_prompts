      *   *Claim 5:* "So Moore proved nothing, and the interesting part is Moore kind of admits this — he says he knows his premise but can't prove it..."
          *   *Analysis:* Moore *does* admit he can't prove he's not dreaming (directly), but he insists he *knows* he has hands. He doesn't say "I proved nothing." He says "I have satisfied the requirements for a proof, but I can't satisfy *you* (the skeptic)."
