  ### 2. Soundness: $P(\text{Sound} \mid \text{Coherent}) = 0.75$
  **Question:** Can we overcome the known counterexamples (random self-reducibility, diagonalization/fooling functions) via computational inaccessibility?
  **Reasoning:** This is the crux of the cryptographic skepticism. The diagonalization argument states that for any fixed class of efficient arguments, there exists a function that passes the arguments but is easy to invert. The escape hatch is that *finding* this function is computationally hard. This relies on the same assumptions as cryptography itself (e.g., existence of one-way functions). If we assume crypto is possible, it is plausible we can define a class of arguments where generating a fooling function is harder than the security parameter allows. However, random self-reducibility poses a subtler threat: it shows that average-case hardness does not imply worst-case hardness for certain structures. The formalism must successfully distinguish "designed structure" from "inherent structure."
  **Risk:** An impossibility theorem showing that computational inaccessibility is insufficient to prevent fooling functions for *natural* heuristic arguments, not just artificial diagonalization.

  ### 3. Coverage: $P(\text{Coverage} \mid \text{Sound}) = 0.70$
  **Question:** If sound, does the class cover a "non-trivial fraction" of practitioner arguments (e.g., hash inversion, discrete log in specific groups)?
  **Reasoning:** If we solve soundness, coverage is likely the easiest hurdle. Most practitioner heuristics rely on the absence of algebraic structure or the hardness of known problems. A formalism that captures "pseudorandomness relative to a class of tests" should cover standard hash functions and symmetric primitives. It may fail for number-theoretic primitives where structure is explicit (e.g., elliptic curves), but the definition requires only a non-trivial fraction.
  **Risk:** The soundness constraints are so tight that the class only certifies trivial statements (e.g., "this random string is hard to guess"), rendering it useless for complex primitives.

