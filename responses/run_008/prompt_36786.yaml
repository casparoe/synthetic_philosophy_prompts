      *   **Kripke (TWI):** Modal actualism (usually). Worlds are abstract/stipulative. Transworld identity is primitive/intelligible. Rigid designators pick out the *same* object.
      *   **The "Humphrey Objection":** Kripke's famous critique. CT makes modality irrelevant to *us*.
