      *   **The "Metaphysical" Angle:** What are possible worlds? What is essence?

  3.  **Evaluate the User's Hypothesis:**
      *   *Is it interest-relative?* Yes, Lewis admits counterpart relations are context-sensitive. Kripkeans argue essence is not. This is a substantive divide.
      *   *Is it verbal/notational?* Some (like Quine or Carnap successors) might say yes. But most participants treat it as substantive.
      *   *Is it two questions?* Likely. One about the *semantics* of modal talk, one about the *metaphysics* of modality.

  4.  **Drafting the Response - Section by Section:**

