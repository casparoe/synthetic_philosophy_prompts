answer: |-
  There is no single English noun that perfectly captures the phenomenon across biology, engineering, and psychology, but there is a **conceptual triad** that describes it precisely. Depending on which lens you look through, this behavior is known as a **Fixed Action Pattern**, **Open-Loop Control**, or **Competence without Comprehension**.

  The most evocative and historically rich term for the specific configuration you described (complex sequence, rigid execution, failure upon perturbation) is the **Fixed Action Pattern (FAP)**.

  Here is the breakdown of the terminology, its origins, how it applies to your examples, and where the boundaries lie.

  ### 1. The Biological Term: Fixed Action Pattern (FAP)
  **Origin:** Ethology (the study of animal behavior), specifically the work of Konrad Lorenz and Niko Tinbergen in the 1930s-50s.

  **Definition:** A Fixed Action Pattern is an instinctive behavioral sequence that is relatively invariant within the species and almost inevitably runs to completion once triggered by a specific sensory stimulus (called a *sign stimulus* or *releaser*).

  **The Classic Example:** The Graylag Goose.
  If a goose sees an egg outside its nest, it will roll the egg back using its beak. If you remove the egg *while* the goose is rolling it, the goose will continue the head-motion all the way to the nest, tuck in an imaginary egg, and sit on it. The behavior is complex and coordinated (looks smart), but it is not monitoring the egg during the process (rigid).

  **Why it fits your examples:**
  *   **The Cat:** The 6 PM begging is a FAP triggered by circadian rhythms or hunger cues. The "sign stimulus" is the time/internal state, not the empty bowl. Once triggered, the routine runs to completion.
  *   **The Robot:** The robot's "wait at door" routine is a programmed FAP. The sign stimulus is "arrive at door coordinate." It lacks the sensor feedback loop to check "is door open?" during the wait state.
  *   **The Cook:** This is a learned FAP (sometimes called a **Cognitive Script**). The stimulus is "reached step X in recipe." The action is "add salt." The monitoring system (checking the pan state) is bypassed.

  **The Edge:** FAPs are traditionally defined as *innate*. Your robot and cook are *learned/programmed*. However, the structural topology is identical. In comparative psychology, when this happens in humans or machines, we often call it **Stereotyped Behavior** or **Scripted Execution**.

  ### 2. The Engineering Term: Open-Loop Control
  **Origin:** Control Theory and Cybernetics.

  **Definition:** A system that acts based on a pre-determined input sequence without using feedback to verify the output.
  *   **Closed-Loop:** "Add salt until it tastes salty." (Feedback: Taste)
  *   **Open-Loop:** "Add one teaspoon of salt." (No feedback: assumes the teaspoon and the salt shaker work as expected).

  **Why it fits:**
  This explains the *mechanism* of the failure. Your robot is an open-loop system regarding the door state. It executes `MoveTo(Door) -> Wait(DoorOpen)`. It does not execute `If (DoorOpen) Then Pass`. The "intelligence" you saw earlier (dodging the chair) was likely a separate closed-loop subroutine (obstacle avoidance), but the door routine was open-loop.

  **The Edge:** A simple reflex (knee jerk) is also open-loop, but it is a single step, not a "coordinated sequence." Your definition requires *multi-step* complexity. Therefore, you are looking for **Multi-Stage Open-Loop Execution**.

  ### 3. The Philosophical Term: Competence without Comprehension
  **Origin:** Daniel Dennett (Philosopher/Cognitive Scientist), notably in his book *From Bacteria to Bach and Back*.

  **Definition:** The capacity of a system to perform a complex, adaptive-looking task successfully without understanding *why* it is doing it or being able to adjust when the "why" changes.

  **Why it fits:**
  This captures the *illusion* you described ("The impressive part was real... but the designer isn't in the room"). Dennett argues that evolution, brains, and technology are full of layers of competence that do not require comprehension. The robot has the *competence* to navigate the hall, but no *comprehension* of what a door is for.

  ### A Proposed Neologism
  If you want a single term that fuses the "looks smart" aspect with the "rigid script" aspect, and distinguishes it from simple reflexes or habits, I propose:

  **Ventriloquized Agency**

  *   **Definition:** A multi-step behavioral sequence that exhibits the outward signs of goal-directed intention (agency) but is actually being driven by a pre-loaded script (ventriloquism) that cannot respond to real-time contextual contradictions.
  *   **Why this word?** "Ventriloquized" captures the fact that the intelligence is present, but it belongs to the *designer* (or evolution), not the *actor*. The actor is just the dummy moving its mouth.
  *   **Inclusion:** The robot waiting at the open door; the cat begging for full food; the cook salting twice.
  *   **Exclusion:**
      *   *Reflexes:* Too simple, no sequence.
      *   *Deliberate Action:* The cook stops and thinks, "Wait, did I salt this?" (This breaks the ventriloquism).
      *   *Adaptive Habits:* If the cat sees the food is full and stops begging, that is closed-loop feedback, not ventriloquized agency.

  ### Drawing the Boundaries
  To distinguish **Ventriloquized Agency / Fixed Action Patterns** from near-misses, apply the **Perturbation Test**:

  1.  **The Reflex Test:** Is it a single muscle contraction? (Yes = Reflex). Is it a sequence of distinct actions? (Yes = Candidate).
  2.  **The Feedback Test:** If you interrupt the middle of the sequence, does the actor notice and re-orient?
      *   *Flexible Agent:* Stops, assesses, replans.
      *   *Ventriloquized Agent:* Continues the motion or halts in a state that assumes the previous step succeeded (like the robot waiting).
  3.  **The History Test:** Does the behavior require past learning in this specific context?
      *   *Habit:* Learned through repetition in this context.
      *   *FAP:* Innate or deeply compiled (the cat didn't learn to beg at 6 PM through trial and error; it's a biological clock script).

  ### Summary
  The behavior you are seeing is a **Fixed Action Pattern** (biological term) executed via **Open-Loop Control** (engineering term), resulting in **Competence without Comprehension** (philosophical term).

  If you need a word to use in conversation that captures the eerie "smart-but-hollow" quality, **Ventriloquized Agency** is precise. But if you want to be scientifically understood, **Fixed Action Pattern** is the canonical term, provided you clarify that you are using it to describe the *structure* of the behavior, not necessarily its innate origin.

  The reason it feels so unsettling when you notice it is that you are witnessing the **Intentional Stance** (our tendency to attribute beliefs and desires to things) crashing into the **Design Stance** (seeing the thing as a mechanism with a function). You assumed the robot *wanted* to go through the door; in reality, it was just playing a tape recording of "wanting to go through the door."
