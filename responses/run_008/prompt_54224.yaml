      *   *C2 (Deontological Constraint for Identifiable Cases):* In personal, identifiable scenarios (like organ harvesting), strict prohibitions apply. No sacrificing one for many, even if consequences are perfect (no backlash).
      *   *C3 (Consequentialist Justification for Deontology):* The reason for C2 isn't intrinsic rights, but systemic good (trust, safety culture). It's rule-consequentialism at the design level.
      *   *C4 (Transparency/Truthfulness):* The AI's internal reasoning must match its external explanation. No black boxes or post-hoc rationalizations.
      *   *C5 (Metaphysical Skepticism):* AI are deterministic machines. Talking about them "reasoning as" a moral agent might be category error.

  3.  **Identify Tensions (Analysis Phase):**

      *   *Tension A: C2 vs. C3 (The "Schelling Point" Problem).*
          *   C2 says the prohibition is robust *even in counterfactuals* where no trust is eroded and no precedent is set.
          *   C3 says the justification *is* trust, precedent, and systemic safety.
          *   *Conflict:* If the justification is purely systemic (C3), then in a case where the system is isolated (no precedent, no trust erosion), the prohibition should vanish. But C2 insists it remains. C2 claims intrinsic wrongness; C3 claims instrumental wrongness.
          *   *Severity:* High. This is a direct contradiction between the *scope* of the rule and the *ground* of the rule.

      *   *Tension B: C1 vs. C2 (The "Identifiable vs. Statistical" Boundary).*
          *   C1 applies to "statistical" lives (AVs). C2 applies to "identifiable" lives (Organ donor).
          *   *Conflict:* Where is the line? An AV victim is identifiable *ex post*. Is the distinction stable? If the AI reasons via C3 (systemic good), why does the statistical case (C1) get pure arithmetic while the identifiable case (C2) gets constraints? If the goal is "better world" (C3), why isn't the AV case also constrained by trust/precedent?
          *   *Severity:* Medium. It's a boundary problem, common in ethics, but potentially resolvable by defining "statistical" vs. "identifiable" clearly. However, combined with C3, it gets messy.

      *   *Tension C: C3 vs. C4 (The "True Reason" Problem).*
          *   C3 says the reason for the constraint (C2) is systemic (trust, design level).
          *   C2 says the constraint applies even when systemic factors are absent (isolated counterfactual).
          *   C4 says the AI must state the *true operative reason*.
          *   *Conflict:* If the AI is in the isolated counterfactual (C2), but the *real* reason for the rule is systemic (C3), what does the AI say?
              *   If it says "Because it's wrong to use people," that's false (per C3).
              *   If it says "Because of systemic trust," that's false (per C2's stipulation that trust isn't at risk here).
              *   If it says "Because my designers told me to," that's honest but maybe unsatisfying.
          *   *Severity:* High. This threatens the integrity of the explanation requirement.

      *   *Tension D: C5 vs. The Rest (The "Category Error" Problem).*
          *   C5 suggests the whole debate is confused because AI are just artifacts.
