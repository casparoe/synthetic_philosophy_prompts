      *   *Wait, looking closer:* The user suspects (5) or (3)+(2).
      *   Actually, the cleanest fix is to align C2 with C3. C2 is the outlier. It claims a deontological *result* (never do it) based on a consequentialist *reason* (C3), but insists the result holds even when the reason doesn't apply (the counterfactual).
      *   *Recommendation:* Drop the "idealized counterfactual" clause in C2. Embrace Rule Consequentialism fully.
      *   *Wait, is there a better one?* What if we change C3? If the user admits there *are* rights (non-consequentialist grounds), then C2 makes sense, C1 needs adjustment (why do rights vanish in AVs?), and C4 is fine ("I respected rights").
      *   *User's leaning:* They are a physicist. They like "arithmetic wins" (C1). They like "safety rules" (C3). They seem to want the *robustness* of deontology (C2) without the *metaphysics* of rights (C3). This is the definition of Rule Utilitarianism, *except* for the "idealized counterfactual" clause in C2.
