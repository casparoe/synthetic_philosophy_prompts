          *   *Cheapest Revision:* Align C1 with C3. Admit AV arithmetic is also a rule based on systemic safety, not pure metaphysical arithmetic.
          *   *Cost:* Nuance. "1 < 5" becomes "Saving more is the best heuristic for safety."

      *   *Rank 4 (Low): C5.*
          *   *Revision:* Keep C5 as a meta-commentary, not a normative constraint.
          *   *Cost:* None really.

  5.  **Synthesize the "Single Revision":**
