          *   *Conflict:* If AI are just tools, do they "reason" morally, or do they simply execute code that *mimics* moral reasoning? If they are deterministic, "ought" implies "can" gets tricky. However, as a designer, the physicist *can* choose the code. So C5 might be a distraction rather than a contradiction.
          *   *Severity:* Low/Meta. It's a philosophical hesitation, not a logical contradiction within the normative framework.

  4.  **Rank Tensions & Propose Revisions:**

      *   *Rank 1 (Severe): C2 vs. C3.* The "Idealized Counterfactual" contradiction. C2 demands deontological robustness where C3 denies deontological grounds.
          *   *Cheapest Revision:* Modify C2. Drop the "even in fully stipulated counterfactual" clause.
