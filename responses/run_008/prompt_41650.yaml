answer: |-
  Here is the decomposition you asked for. I will treat this as a Bayesian update problem: starting with a prior, evaluating the likelihood of the evidence under the hypothesis (Fomenko is right) versus the null hypothesis (Conventional Chronology is roughly correct), and arriving at a posterior credence.

  ### The Number
  My credence that Fomenko's core claim is true (that at least one major event conventionally dated before 500 AD is actually off by more than 1,000 years due to a systemic chronological shift) is **0.0001% (1 in 1,000,000)**.

  This is not zero, because I must acknowledge the possibility of unknown unknowns in physics or geology. But it is low enough that, for all practical and historical purposes, it is treated as impossible.

  ### The Decomposition
  For Fomenko's theory to be true, several independent "pillars" of evidence must all collapse simultaneously. I have assigned a probability to each pillar failing in the specific way Fomenko requires. Since these pillars are largely independent (biology, physics, astronomy, textual criticism), we multiply their probabilities to get the joint probability.

  **1. The Probability that Independent Dating Methods are All Circular/Contaminated ($P_1$)**
  *   **The Hurdle:** Radiocarbon dating, dendrochronology (tree rings), varve counting (lake sediments), and ice core layering all converge on the same timeline. Dendrochronology alone provides an unbroken count of years back to ~14,000 BC. For Fomenko to be right, trees must have grown multiple rings per year consistently for millennia, or the cross-matching of bristlecone pines (USA), oaks (Europe), and kauri (New Zealand) must be a massive coincidence.
  *   **Assigned Probability:** **0.01 (1%)**. I am being extremely generous here. The physics of carbon decay and the biology of tree growth are distinct mechanisms. For both to be "wrong" by exactly 1,000 years in the same direction is biologically and physically implausible.

  **2. The Probability that Ancient Eclipses are Fabricated or Back-Calculated ($P_2$)**
  *   **The Hurdle:** Thucydides, Livy, and Chinese astronomers recorded eclipses with specific details (time of day, magnitude, location). Modern astronomy can retro-calculate these with second-level precision. For example, the eclipse of Agathocles (310 BC) is matched to a specific date. For Fomenko to be right, ancient authors would have needed to calculate these backwards with modern precision and insert them into narratives without error, or we are witnessing a 1-in-a-billion coincidence where random text matches orbital mechanics.
  *   **Assigned Probability:** **0.05 (5%)**. It is possible some eclipses were later interpolations, but the sheer volume of matches across different cultures (who used different calendar systems) makes a global fabrication unlikely.

  **3. The Probability of Global Compression Without Contradiction ($P_3$)**
  *   **The Hurdle:** Fomenko requires European, Chinese, Islamic, and Mayan chronologies to all be shifted or compressed in unison, despite these civilizations having limited contact. Chinese historical records (e.g., the *Spring and Autumn Annals*) provide a continuous, year-by-year account back to 841 BC, verified by eclipse records. If Roman history is shifted by 1,000 years, it desynchronizes completely from Chinese records where they interact (via the Silk Road intermediaries).
  *   **Assigned Probability:** **0.02 (2%)**. This requires a conspiracy of silence across rival civilizations that hated each other.

  **4. The Probability that Stratigraphy and Artifacts are Misleading ($P_4$)**
  *   **The Hurdle:** Archaeological layers (stratigraphy) show a progression of technology (Stone -> Bronze -> Iron). Coins evolve in style and metal content. If Rome is actually Medieval, then "Roman" coins should be found in the same layers as "Medieval" coins, or the layers themselves must be misidentified globally.
  *   **Assigned Probability:** **0.10 (10%)**. This is the "softest" pillar, as artifacts can be moved or misinterpreted. However, the sheer volume of stratigraphically secure finds makes a 1,000-year error across all sites improbable.

  **The Calculation:**
  $$P(\text{Fomenko}) \approx P_1 \times P_2 \times P_3 \times P_4$$
  $$P(\text{Fomenko}) \approx 0.01 \times 0.05 \times 0.02 \times 0.10 = 0.000001$$
  **Result:** $1 \times 10^{-6}$ (0.0001%)

  ### The Dominant Term
  The term doing the most work in this calculation is **$P_1$ (Independent Dating Methods)**, specifically **Dendrochronology**.

  Texts can be forged. Coins can be moved. Eclipses can be faked (theoretically). But tree rings are physical objects that grow annually. The "Long Chronology" of tree rings is built by overlapping living trees with dead wood, going back continuously. For Fomenko to be right, the biological process of tree growth must have functioned differently in the past, or the cross-matching of thousands of samples across continents is a statistical fluke.

  This is the "hard anchor." Radiocarbon dating is calibrated *against* tree rings. If the tree rings are right, the absolute count of years is right. Fomenko's theory requires the physical history of the biosphere to be different from the recorded history of humanity, which creates a contradiction that cannot be resolved without invoking new physics.

  ### What Evidence Would Move the Number?
  To move my credence from 0.0001% to even 1%, I would need **a reproducible physical anomaly that breaks the link between dendrochronology and radiocarbon dating.**

  Specifically:
  1.  **The "Smoking Gun" Artifact:** A piece of wood, securely sealed in a stratigraphic layer associated with undeniably ancient context (e.g., inside a sealed Egyptian pyramid construction layer verified by non-textual means), that yields a tree-ring count and C-14 date of ~1000 AD.
  2.  **The Physical Mechanism:** A demonstrated physical mechanism showing why C-14 decay rates or tree-ring formation rates would have been systematically different prior to 1000 AD, confirmed by independent physics experiments (not just historical reinterpretation).

  Until there is physical evidence that contradicts the *physics* and *biology* of dating, rather than just a reinterpretation of *texts*, the number stays at one in a million.

  ### Advice for the Conversation
  Your friend's argument ("you can't put a number on it since you haven't checked the manuscripts yourself") is a classic **appeal to personal verification**. By that logic, no one could believe in germ theory without looking through a microscope themselves, or believe the earth is round without going to space. We rely on the consensus of experts who *have* checked the manuscripts and the isotopes.

  Fomenko's theory is seductive because it simplifies history into a pattern-matching game (statistics on text lengths, etc.), but it fails because it treats history as *only* text. History is also dirt, ice, wood, and light. You can rewrite the text, but you cannot rewrite the tree rings.

  Tell him: *"I'm willing to update my probability, but you need to explain how the trees lied. If the chronology is compressed by 1,000 years, show me where the missing tree rings are."* That is the bottleneck his theory cannot pass.
