  - Tortoise accepts A, accepts B, accepts that if A and B then Z, but won't accept Z, and when you add the inference rule as a new premise, demands yet another one. Maya's verdict: the regress never needed closing, because the tortoise isn't in the business of being reasoned with at all — its acceptance of the premises is a verbal shell, and no premise was ever going to fix that.
  - A guy affirms all ravens are black, affirms this bird is a raven, denies this raven is black. Maya: just irrational, nothing interesting to say.
  - A mathematician who endorses every axiom, endorses any single step when you show it to her, but denies the theorem of a 9,000-line proof because she can't survey the whole thing and won't trust what she can't hold in her head. Maya: completely different from the tortoise, she's blameless, and it's a fact about working memory, not about whether deduction needs justification.
  - Someone who claims to accept A and accepts that if A and B then Z, but shows no expectations about Z in either direction no matter how you press. Maya: then he doesn't really accept A. Acceptance that never constrains anticipation is just noise.

  Now the new cases I want predictions on:

  1. A patient with (hypothetical) inferential blindsight: after a lesion, she sincerely affirms P, affirms that if P then Q, affirms that she ought to conclude Q, is visibly distressed that she can't, but the beleif in Q just never arrives.
  2. A paraconsistent logician who thinks naive truth theory is genuinely inconsistent, so she accepts both S and not-S, and refuses to derive an arbitrary Q from the pair.
  3. An LLM I interrogate in seperate sessions: affirms P in one, affirms if P then Q in another, denies Q in a third, fluent and internally consistent each time.

  So: predict Maya's verdict on each of the three, tell me what rule or rules she's actually running, what other rules fit the existing record about equally well, and then design the further case that would best split those candidate rules apart — I'm planning to bring it to her at dinner and finally win one. For what it's worth, my own theory is that she's basically running the old pay-rent-in-anticipated-experiences line dressed up as philosophy of logic, but I genuinely can't tell whether that fits her third verdict or not, so push on that specifically. No reading lists please, I'm not going to read the books anyway.
