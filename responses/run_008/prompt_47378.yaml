answer: |-
  # Q&A Prep Sheet: The Overextension of Aumann's Agreement Theorem

  **Context:** Defending the thesis that AAT is an impossibility result disguised as a normative tool, and that its conditions (Common Prior, Common Knowledge of Posteriors) are never met in human discourse.
  **Audience:** LessWrong veterans, Bayesian Statisticians, Newbies.
  **Tone:** Technically precise, charitable to the math, critical of the sociology.

  ---

  ### 1. The Performative Contradiction (The "Hope Nobody Asks" Question)
  **Question:** "If Aumann's theorem doesn't apply to humans because we lack common priors or common knowledge, then your disagreement with this room right now is consistent with rationality. But if you believe your thesis is *true* and ours is *false*, aren't you implicitly claiming we share enough epistemic ground that one of us must be irrational? By arguing against us, aren't you treating AAT as binding after all?"

  **2-Minute Reply:**
  "That is the sharpest cut in the room, and I appreciate it. The distinction lies between *logical possibility* and *operational feasibility*. I am not claiming that disagreement is always rational; I am claiming that AAT is the wrong tool to diagnose it.
  When I argue with you, I am operating under the assumption that we share *some* priors—enough to make communication possible—but not the *Common Prior* required by AAT. AAT demands that our probability distributions over the entire state space stem from the same source measure. I am arguing that human brains are initialized with different architectures and sensory data; we are not instances of the same agent with different information partitions.
  So, no, I am not treating AAT as binding. I am treating *Bayesian updating* as binding. I believe that if we exchanged all evidence, we might converge, but AAT claims we should converge just by knowing each other's posteriors. My disagreement with you tonight is evidence that we haven't exchanged all evidence, not that we are violating AAT. I am inviting you to drop the 'Aumann' label and return to standard evidence-sharing without the guilt trip of 'irrationality'."

  **Soft Spot:** This relies on a fuzzy line between "enough shared priors to talk" and "Common Prior Assumption." A hardline Bayesian can argue that if you think you can persuade me, you *must* believe we share a common prior, otherwise my updates are structurally incompatible with yours.

  ---

  ### 2. The "Regulative Ideal" Objection (LessWrong Veterans)
  **Question:** "Even if the strict conditions aren't met, isn't AAT valuable as a normative ideal? Treating peers as if they satisfy Aumann conditions forces us to update more aggressively. If we stop using it as a slogan, don't we risk becoming overconfident in our disagreements?"

  **2-Minute Reply:**
  "I agree we should update aggressively. My critique is that AAT is a *distraction* from the actual work of updating. AAT says: 'If you know their posterior, you must match it.' This encourages 'Aumann updates' where I adjust my number because you adjusted yours, without asking *why*.
  This is dangerous. It privileges social calibration over evidential grounding. If we treat AAT as a norm, we stop digging for the specific evidence partition that caused the divergence. We just average our credences.
  A better norm is: 'Disagreement implies hidden evidence.' That directs energy toward finding the missing data or the model mismatch. AAT directs energy toward mathematical submission. We want a community that hunts for the partition difference, not one that collapses posteriors because they assume a common prior that doesn't exist. The theorem explains too much; it makes disagreement vanish by fiat rather than by resolution."

  **Soft Spot:** This concedes that AAT is useful for calibration. If the audience values calibration over truth-tracking in the short term, they will reject this. It also risks sounding like I'm advocating for *less* updating, which is heresy in this crowd.

  ---

  ### 3. The "Approximate Common Prior" Objection (Bayesian Statisticians)
  **Question:** "You say we can never establish a common prior. But in practice, don't we assume a 'universal' prior for the sake of modeling? If our priors are 'close enough,' doesn't the theorem hold approximately? Why let the perfect be the enemy of the good?"

  **2-Minute Reply:**
  "In statistics, 'close enough' depends on the likelihood ratio. In epistemology, 'close enough' is undefined. Aumann's theorem is not a continuity result; it is a binary logical constraint. If our priors differ on the relevance of a specific variable, no amount of 'closeness' guarantees convergence.
  Furthermore, 'universal priors' like Solomonoff induction are uncomputable. When you say 'assume a common prior,' you are asking humans to pretend they are Turing machines with the same tape initialization. We aren't.
  When you smuggle in an approximate common prior, you are essentially assuming the conclusion: that we interpret evidence the same way. If we interpret evidence the same way, we don't need AAT to tell us we'll agree; standard Bayesian updating tells us that. AAT's specific contribution is that *knowing the posterior* is sufficient. But without a true common prior, knowing your posterior is just another data point, not a command to match it. The 'approximation' destroys the specific mechanism the theorem describes."

  **Soft Spot:** Statisticians know that all models are wrong but some are useful. Insisting on binary logical constraints over approximate modeling might make me look like a purist who refuses to engage with applied work.

  ---

  ### 4. The Hansonian Objection (Community Lore)
  **Question:** "Robin Hanson has argued that persistent disagreement is essentially a bet that one of us is irrational or biased. If we don't use AAT to flag this, aren't we just allowing bias to hide behind 'different priors'?"

  **2-Minute Reply:**
  "Hanson's point is vital: we should be skeptical of 'agreeing to disagree.' But AAT is not the only way to make that point. We can attribute disagreement to bias, heuristics, or incentive structures without invoking Common Knowledge of Posteriors.
  In fact, invoking AAT often *protects* bias. If I say, 'I've Aumann-updated to your position,' I can stop thinking. If I say, 'We disagree, so one of us has a biased likelihood function,' I have to investigate *which* cognitive mechanism is failing.
  The 'different priors' defense is indeed often a shield for bias. But the Aumann cure is worse than the disease because it demands we erase the prior difference rather than diagnose it. We should treat 'different priors' as a hypothesis to be tested (e.g., 'Are you saying this because of your political tribe?'), not as a mathematical barrier that forces immediate convergence."

  **Soft Spot:** Hanson is a canonical figure in this space. Arguing against his interpretation of AAT risks alienating the core leadership. It also requires me to offer a concrete alternative diagnostic tool, which I may not have fully fleshed out.

  ---

  ### 5. The Pragmatic/Forecasting Objection (Newbies/Practitioners)
  **Question:** "In forecasting tournaments, when we aggregate predictions, we basically act as if AAT is true. It works. The superforecasters converge. Why fix what isn't broken?"

  **2-Minute Reply:**
  "Forecasting aggregation works *despite* AAT, not *because* of it. When superforecasters converge, it is because they are sharing specific evidence and updating on the same models, not because they glanced at each other's probabilities and matched them.
  If AAT were the driver, we would see immediate convergence upon revealing numbers. We don't. We see gradual convergence as information flows.
  Using AAT as a justification for aggregation is a post-hoc rationalization. It's like saying gravity explains why airplanes fly because they eventually land. The mechanism is lift, not gravity. The mechanism of forecasting success is information pooling, not common knowledge of posteriors. By crediting AAT, we obscure the actual work being done: rigorous evidence sharing. Let's give credit to the evidence, not the theorem."

  **Soft Spot:** This is the easiest objection to handle, but if I dismiss the success of forecasting aggregates too lightly, I look out of touch with the practical successes of the community. I must validate the success while re-attributing the cause.
