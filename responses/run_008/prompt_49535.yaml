  My friend Maya and I have been playing this dumb letter-string game I got from my cog sci professor, who says it comes out of an old AI project about analogy-making. The setup: you get a change applied to one string — like abc → abd — and then you have to apply the same change to a new string. Sounds trivial, except there's no rulebook for what counts as the same change, and Maya's answers have gotten weirdly consistent and weirdly hard to pin down at the same time. She's a mechanical engineer, zero philosophy background, and she answers fast and confident every time.

  Her verdicts so far, all with abc → abd as the source change: for ijk she said ijl, obviously. For xyz she said wyz — her reasoning was that z can't go up any further, so the string is kind of pressed against the top of the alphabet, and the analogous thing to do is take x down one at the other end. For kji she said jji, on the grounds that it's abc running backwards, so the change should run backwards too — drop the k instead of pushing anything up. And for mrrjjj she said mrrkkk: she treated the jjj as a single unit and pushed the whole run forward together, leaving m and rr completely untouched.

  I've got three new cases I want to try on her: pqrr, xyyz, and zyx. What do you think she'll say for each? More to the point, can you reconstruct what rule — or non-rule — she's actually running? I can see at least a couple of different stories that fit everything she's done so far, and they disagree on the new cases: for pqrr, does she see the rr as a group like she saw the jjj, or does the grouping only kick in when the whole string is built out of runs? For xyyz, when the rightmost letter is blocked against the top of the alphabet, does she again jump to the left end, or might she slide the change onto the yy run since it can move? And zyx feels like the real stress test — it runs backwards like kji, but its front end is jammed against the bottom of the alphabet where nothing can go down, so whatever her fallback is has to fire twice at once. Give me your predictions, the candidate rules that fit her track record, which one you'd bet on and why, and what extra case I should throw at her to actually tell the rules apart. Also, and this is the part I actually care about: is it even right to think of her as running a rule at all, versus making some fresh holistic judgment each time and only looking rule-like from a distance? My prof mumbled something about concepts being fluid when I asked him this and I didnt really follow what he meant.
