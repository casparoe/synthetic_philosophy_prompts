answer: |-
  The practices presuppose a non-consensual, membership-based theory of associative duties that grants the state sovereign authority to prioritize domestic survival over global welfare and to monopolize judgments regarding the justice of specific wars. This implicit theory aligns most closely with a statist version of associative duties rather than consent, reciprocity, or Rawlsian institutionalism, though it borrows rhetorically from consent theory when convenient. I am highly confident that the rejection of selective conscientious objection strictly presupposes a statist claim to moral epistemology—asserting that the sovereign, not the individual, determines the justice of a particular conflict—because allowing selective objection would undermine the state's monopoly on legitimate violence and its ability to conduct foreign policy. The treatment of native-born citizens versus naturalized immigrants is less philosophically coherent; while the practices sit comfortably with a view that birthright membership generates automatic obligations, the naturalization oath introduces a consent-based element for outsiders that contradicts the consent-independent status of natives, suggesting the oath is merely a ritual of incorporation rather than a genuine theoretical commitment to voluntarism. I am least sure about whether the naturalization oath implies a genuine theoretical contradiction or merely a pragmatic administrative distinction, as states could argue immigrants voluntarily accept existing terms while natives are born into them, but this fails to explain why the *content* of the obligation (risk of death) is identical despite the *source* of the obligation (status vs. promise) differing.

  Regarding the standard candidates, the pattern strictly presupposes that associative duties of membership are binding independent of consent, evidenced by the draft liability of native-born citizens who never swore an oath. Consent theory is ruled out for natives but retained instrumentally for immigrants, indicating the state treats membership itself as the source of obligation, not the act of agreeing to it. Reciprocity or fairness within a cooperative scheme fits comfortably but does not strictly explain the intensity of the duty; while citizens receive benefits, the leap from receiving services to owing one's life is too great for fairness alone to justify without an underlying associative bond. Rawlsian institutional views are partially compatible but underdetermined here, as Rawls limits the difference principle to domestic societies but does not explicitly mandate the extreme partiality required to justify killing for compatriots while ignoring famine abroad.

  The pattern presupposes that strong cosmopolitanism is false, specifically the claim that all human lives possess equal moral weight regardless of borders. However, the practices are consistent with a weak cosmopolitanism that permits special duties to compatriots provided a minimum humanitarian floor is met for strangers, though the disparity in risk (death versus charity) suggests the state operates on a stronger nationalist priority than weak cosmopolitanism typically allows. The parts cohere logically within a statist framework but contain tensions regarding moral agency; the ban on selective objection assumes the state is morally reliable enough to demand obedience, while the draft itself assumes the citizen is morally expendable for the state's ends.

  If the presupposed view were replaced by a straightforward cosmopolitan one, conscription for national defense would likely become illegitimate unless framed as enforcement of global justice, such as UN-mandated peacekeeping, because risking life for partial national interests violates the equal weight of global lives. The naturalization oath would have to be abolished or radically altered to remove specific defense promises, as binding immigrants to stricter consent standards than natives violates cosmopolitan equality. Finally, a cosmopolitan-conscientious-objector exemption would become mandatory, because if moral obligations are global, an individual's judgment that a war violates global justice must trump the state's claim to authority, rendering the ban on selective objection unjustifiable.
