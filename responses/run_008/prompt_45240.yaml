  6.  **Address Cosmopolitanism:**
      *   Does it presuppose cosmopolitanism is false? It presupposes *strong* cosmopolitanism (equal weight to all lives) is false. It is consistent with *weak* cosmopolitanism (special duties allowed if minimum global duties met), *but* the disparity in risk (death vs. charity) suggests a stronger partiality.
      *   What changes under cosmopolitanism? Conscription for national defense becomes hard to justify unless defending global order. Oaths become symbolic. Selective CO becomes mandatory (if the war violates global justice).

