      *   *Reciprocity/Fairness:* Plausible for native-born (benefits received), but doesn't explain the intensity of the duty (death) vs. foreign aid (cheap money). Also doesn't explain the selective objector ban (why can't I refuse unfair reciprocity in a specific case?).
      *   *Associative Duties (Membership):* Strong fit. You belong, therefore you owe. Explains the priority of compatriots over strangers. Explains why native-born owe without explicit consent.
      *   *Rawlsian Institutional:* Fits the domestic priority, but Rawls is wary of conscription unless for defense of a just society. Doesn't fully explain the selective objector ban.
      *   *Statist/Nationalist Priority:* The state claims a monopoly on legitimate violence and defense. The duty is to the *state's survival*, not necessarily a moral contract.

  4.  **Synthesize the Implicit Theory:**
