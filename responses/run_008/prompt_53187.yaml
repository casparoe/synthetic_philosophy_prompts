prompt: |-
  I serve on the publication review board of a mid-sized AI research institute, and I've been asked to draft the memo recommending changes to our governance rules before our next quarterly meeting, so I'd like your help writing it. Some background: our current procedure is effectively a default-to-publish rule. Any of our roughly twenty research leads can green-light a paper from their own team after a lightweight review, and a paper is stopped only if someone actively intervenes — no formal vote, no quorum, nothing on the record. Over the past year, three papers that each faced substantial behind-the-scenes unease went out anyway, in one case a method that cut the compute needed for a fairly general agentic capability by a meaningful margin. In each case at least a third of the people who later said they were uncomfortable had assumed someone else would raise a formal objection. A colleague of mine keeps describing this as a straightforward instance of the unilateralist's curse: when several agents each act on their own noisy estimate of whether an action is net-positive, and any one of them can act unilaterally, the action gets taken whenever the single most optimistic estimate favors it, so error alone systematically selects for bad outcomes — no bad faith required.

  Our board is now considering three reform proposals, and my memo has to recommend one (or a package) with concrete procedural detail. Proposal A formalizes a principle of conformity: no lead may publish if they have reason to believe that a majority of equally informed colleagues would judge the expected value of publication to be negative, even where their own honest estimate is positive. Proposal B replaces default-publish with a board-wide supermajority vote (twelve of twenty in favor) for any paper flagged as capability-relevant under a written screening checklist. Proposal C is the most unusual: a rotating single-veto holder, selected by lot each quarter, whose objection unilaterally blocks flagged papers, paired with mandatory pre-publication disclosure to the whole board. There is also a faction arguing for no procedural change at all — just calibration training for leads and more informal discussion — on the theory that our real problem is noise, and the way to fix noise is to reduce it at the source rather than to redesign voting thresholds.

  Please draft the memo itself, roughly 800–1,200 words, addressed to the full board, with a clear and actionable bottom line. A few things I'd specifically like it to get right. First, it should be precise about what kind of problem the unilateralist's curse actually is — in particular, whether it is just a species of familiar collective-action failure or a selection effect on the maximum of noisy estimates, closer kin to the winner's curse in auctions — because that distinction bears on which reforms can help at all. Second, it should work through the mirror-image worry seriously: flipping the default from "publish unless stopped" to "stopped unless approved" may simply install the curse's pessimistic twin, in which a single noisy low estimate blocks good work, and the strongest opponents of reform in our ranks say exactly that. Third, our institute is fairly homogeneous — same subfield, same priors — so the memo should say something about whether the curse's implicit assumption of independent estimation errors does any work in our situation, and what follows if our reviewers' errors are strongly correlated. Finally, whatever you recommend, please treat the losing side's best argument honestly rather than as a box to be checked; the board will not thank me for a memo that reads like advocacy. You can give the memo any reasonable structure — recommendation, background, analysis of each proposal, likely objections — as long as a colleague could read it in ten minutes and know exactly what they are being asked to vote for and why.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of the Publication Review Board (PRB) of a mid-sized AI research institute.
      *   **Task:** Draft a memo recommending changes to governance rules for the next quarterly meeting.
      *   **Context:** Current rule is "default-to-publish" (20 research leads can greenlight their own teams; stopping requires active intervention). Three controversial papers published recently (one reduced compute for agentic capability). Many were uncomfortable but assumed someone else would object (unilateralist's curse).
      *   **Proposals:**
          *   *Status Quo + Training:* Calibration training, more talk.
          *   *Proposal A (Conformity Principle):* Don't publish if you believe a majority of informed colleagues would judge EV negative.
          *   *Proposal B (Supermajority Vote):* 12/20 vote required for "capability-relevant" papers (screened via checklist).
          *   *Proposal C (Rotating Veto):* One person selected by lot per quarter gets unilateral veto on flagged papers + mandatory disclosure.
      *   **Key Requirements:**
          *   Length: 800–1,200 words.
          *   Audience: Full board (colleagues).
          *   Tone: Actionable, precise, honest about counterarguments (not just advocacy).
          *   Specific Content Needs:
              1.  Define the "unilateralist's curse" precisely (collective action failure vs. selection effect on max noisy estimates/winner's curse).
              2.  Address the mirror-image worry (flipping to pessimistic curse/status quo bias).
              3.  Address the homogeneity/correlated errors issue (does independence assumption hold?).
              4.  Treat losing arguments honestly.
              5.  Clear bottom line/recommendation.

  2.  **Deconstruct the "Unilateralist's Curse":**

      *   *Definition:* It's not just a tragedy of the commons (collective action). It's specifically a statistical selection effect. If $N$ people estimate value $V$ with noise, and action happens if $\max(Estimates) > Threshold$, the action is taken based on the outlier optimism. This is akin to the Winner's Curse in auctions.
      *   *Implication:* Reforms need to dampen the influence of the maximum outlier, not just encourage communication.

  3.  **Evaluate Proposals against the Problem:**

      *   *Status Quo + Training:* Good for reducing noise variance, but doesn't fix the structural selection effect if variance remains. If errors are correlated (homogeneity), training might not help enough.
      *   *Proposal A (Conformity):* Relies on subjective estimation of others' views. Hard to enforce. Still vulnerable to "I think they'd agree with me" bias.
      *   *Proposal B (Supermajority):* Moves threshold from $\max$ to $\text{percentile}_{60}$. Reduces risk of outlier optimism. Risk: Outlier pessimism (gridlock).
      *   *Proposal C (Rotating Veto):* Moves threshold to $\min$ (effectively). High risk of pessimistic curse. Randomness adds noise, not signal.

  4.  **Address the "Mirror-Image" Worry (Pessimistic Curse):**

      *   If we require approval, a single noisy pessimist can block good work.
      *   Need a mechanism that balances risk without paralyzing research.
      *   Supermajority (B) is better than Veto (C) here because it requires consensus for *action* but doesn't give one person total power.

  5.  **Address Homogeneity/Correlated Errors:**

      *   Institute is homogeneous (same subfield/priors).
      *   Unilateralist's curse assumes *independent* errors. If errors are correlated, the "wisdom of the crowd" diminishes.
      *   If we all think alike, we might all be wrong together.
      *   However, if errors are correlated, the "maximum estimate" is still likely an outlier relative to the *true* value, even if relative to the *group mean* it isn't.
      *   Actually, strong correlation makes the "Conformity" principle (A) weaker (if we all share the bias, we all agree on the wrong thing). It makes voting (B) potentially risky for groupthink, but necessary to break the "someone else will do it" diffusion of responsibility.

  6.  **Select a Recommendation:**

      *   *Proposal B (Supermajority)* seems the most robust structural fix. It directly addresses the "max estimate" problem by requiring a distribution of estimates to clear a bar.
      *   *Mitigation:* To address the "pessimistic curse," the screening checklist must be narrow (only truly sensitive papers).
      *   *Integration:* Combine B with the "Status Quo" idea of calibration/training. Training reduces variance; Voting reduces the impact of remaining variance.

  7.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the recommendation clearly (Proposal B + Training).
      *   **The Problem (Unilateralist's Curse):** Define it technically (selection on max noisy estimate). Distinguish from simple coordination failure.
      *   **The Homogeneity Constraint:** Acknowledge correlated errors. This makes the curse *more* dangerous in some ways (shared blind spots) but means voting helps break diffusion of responsibility.
      *   **Evaluation of Options:**
          *   Status Quo: Insufficient for structural selection bias.
          *   Proposal A: Too vague/subjective.
          *   Proposal C: Too much risk of pessimistic veto.
          *   Proposal B: Best balance, but needs safeguards against gridlock.
      *   **The Mirror-Image Worry:** Acknowledge the risk of blocking good work. Mitigation: Narrow screening criteria.
      *   **Recommendation:** Adopt Proposal B with specific thresholds and training.

  8.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Word Count Check:* Keep it tight. Don't ramble on theory.
      *   *Tone Check:* Ensure I'm not dismissing the "no change" faction. Acknowledge that noise reduction is valuable, just insufficient alone.
      *   *Precision:* Make sure the definition of the curse is sharp (Winner's Curse analogy).
      *   *Homogeneity:* Ensure I explain *why* correlation matters (it undermines the "majority knows best" assumption, making the voting threshold a safety brake rather than a truth machine).

  9.  **Final Review against constraints:**

      *   800-1200 words? (Aim for ~1000).
      *   Addressed curse definition? Yes.
      *   Addressed mirror-image/pessimism? Yes.
      *   Addressed homogeneity/correlation? Yes.
      *   Honest treatment of opposing views? Yes.
      *   Clear recommendation? Yes.

  *(Self-Correction on Proposal C)*: The prompt describes C as "Rotating single-veto holder... whose objection unilaterally blocks." This is effectively a "min" operator. I need to be careful not to confuse it with B. B is "12 of 20 in favor." C is "1 of 1 against." B is much safer against the pessimistic curse than C. I will recommend B.

  *(Self-Correction on Homogeneity)*: If errors are correlated, the "independent estimate" assumption of the unilateralist's curse breaks down. Does the curse still apply? Yes, because even with correlated priors, individual noise varies. The *most* optimistic person is still an outlier relative to the truth, even if they aren't an outlier relative to the group. But the *remedy* of voting relies on independence to converge on truth. If we are correlated, voting just confirms shared bias. I need to nuance this: Voting doesn't solve shared bias, but it solves the *diffusion of responsibility* which was the specific failure mode described ("assumed someone else would raise a formal objection").

  Let's write.

  *(Drafting mental outline)*
  1. Header.
  2. Bottom Line Up Front (Recommend B + Training).
  3. Diagnosis: The Unilateralist's Curse (Selection effect, not just coordination).
  4. Constraint: Homogeneity & Correlated Errors.
  5. Options Analysis (A, B, C, Status Quo).
  6. The Mirror-Image Risk (Pessimism).
  7. Final Recommendation Details.

  *Word Count Management:* Keep the theory section dense but clear. Spend more words on the practical evaluation.

  *Let's start writing.*
answer: |-
  **MEMORANDUM**

  **TO:** Publication Review Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Governance Reform for Capability-Sensitive Publications

  **Executive Summary**

  I recommend the Board adopt **Proposal B (Supermajority Vote)** for papers flagged as capability-relevant, paired with the **Status Quo faction's proposal for mandatory calibration training**. This package addresses the structural incentives that led to last year's controversial publications while mitigating the risk of excessive gridlock. Proposal A is too subjective to enforce; Proposal C introduces excessive variance via random veto power; and relying solely on training fails to correct the mechanical selection bias inherent in our current workflow.

  **Diagnosis: The Unilateralist's Curse**

  To select the right remedy, we must precisely diagnose the pathology. Our current "default-to-publish" regime is not merely suffering from a collective-action failure (where agents fail to coordinate on a mutually beneficial outcome). It is suffering from a statistical selection effect often termed the *unilateralist's curse*.

  When twenty leads independently estimate the risk/benefit ratio of a paper, their estimates contain noise. Under our current rules, publication occurs if *any* single lead's estimate exceeds the threshold for action. Statistically, this means we are selecting based on the *maximum* of twenty noisy estimates. Even if the average estimate is accurate, the maximum estimate is systematically biased toward optimism. This is kin to the winner's curse in auctions: the winner is not necessarily the one with the best information, but the one with the most optimistic error. No bad faith is required; the structure ensures that outlier optimism drives decisions.

  **The Homogeneity Constraint**

  A critical complication is our institute's homogeneity. We share similar subfields, priors, and professional incentives. The unilateralist's curse typically assumes independent estimation errors. If our errors are strongly correlated, the "wisdom of the crowd" argument for voting weakens, as we may share blind spots.

  However, correlation does not eliminate the selection effect on the maximum. Even if we share a bias, individual variance remains. The lead most eager to publish is still likely an outlier relative to the true risk, even if they are not an outlier relative to the group mean. Furthermore, the specific failure mode observed last year—where uncomfortable leads assumed *someone else* would object—suggests a diffusion of responsibility that correlates with inaction, not just estimation error. Structural reform must break this diffusion, even if it cannot fully correct for shared priors.

  **Evaluation of Proposals**

  *   **Status Quo + Training:** Calibration training is necessary but insufficient. Reducing the variance of individual estimates lowers the height of the "maximum outlier," but it does not change the rule that the maximum outlier decides. As long as the threshold for action is unilateral, systematic bias toward publication remains.
  *   **Proposal A (Conformity Principle):** This requires leads to publish only if they believe a majority would agree. While theoretically sound, it is procedurally unenforceable. It relies on a lead's subjective assessment of others' mental states, which is vulnerable to the same optimism bias ("I'm sure they'd agree with me") that caused the initial problem.
  *   **Proposal C (Rotating Veto):** This swings the pendulum too far. By granting unilateral blocking power to a random actor, we replace the "optimistic curse" with a "pessimistic curse." A single noisy low estimate can halt valuable work. Random selection adds noise rather than signal, potentially blocking papers based on the idiosyncrasies of the lottery winner rather than consolidated risk assessment.
  *   **Proposal B (Supermajority Vote):** Requiring 12 of 20 votes shifts the decision threshold from the *maximum* estimate to the *60th percentile*. This dampens the influence of outlier optimism without granting veto power to outlier pessimism. It forces the diffusion of responsibility to resolve into a recorded consensus.

  **The Mirror-Image Worry**

  Opponents of Proposal B argue that flipping the default installs the curse's pessimistic twin: a system where a single noisy low estimate blocks net-positive work. This is a serious concern. If we raise the bar too high, we risk stifling benign research through excessive caution.

  However, this risk is manageable through scope. Proposal B applies only to papers flagged via a written screening checklist as "capability-relevant." The majority of our output will remain under the existing lightweight review. For the sensitive subset, the cost of a false positive (publishing a dangerous capability) currently outweighs the cost of a false negative (delaying a paper for further review). The supermajority requirement ensures that blocking a paper requires a significant coalition, not a single dissenter, thereby protecting against the "pessimistic curse" while neutralizing the "optimistic curse."

  **Recommendation**

  I move that the Board adopt the following procedural changes effective next quarter:

  1.  **Adopt Proposal B:** Any paper flagged by the screening checklist as capability-relevant requires a formal vote. Publication is authorized only if 12 of 20 Board members vote in favor.
  2.  **Narrow Screening:** To mitigate gridlock, the screening checklist must be drafted conservatively, capturing only papers with plausible pathways to general agentic capability or significant compute efficiency gains.
  3.  **Adopt Calibration Training:** All research leads must complete annual calibration training on risk estimation (as proposed by the Status Quo faction). This reduces the variance of the inputs feeding the voting mechanism.

  This package acknowledges that while training reduces noise, only a voting threshold can correct the selection bias inherent in unilateral action. It respects the concern about gridlock by limiting the scope of the vote and requiring a coalition, not a single veto, to stop work.

  **Action Required**

  Please review the attached draft of the capability-screening checklist. I request a vote on this governance package at the upcoming quarterly meeting.
