      *   **User's Understanding:** Accurate summary. Two parties facing a risky game (e.g., Chicken), sign a binding contract *before* playing to constrain actions (e.g., both swerve, coin flip). "Safe" means guaranteed to be at least as good as the original game's outcome in *every* scenario (ex-post), not just in expectation (ex-ante). Focus on delegated play (principals $\to$ agents).
