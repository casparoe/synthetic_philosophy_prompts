      *   *Core Mechanism:* It relies on *program equilibrium* or binding commitments where agents play a modified game that maps to the original game but eliminates bad equilibria.
      *   *Key Distinction:* It's not just about expected value. It's about *dominance*. The SPI outcome must be better than the *actual* outcome of the original game, regardless of which equilibrium gets selected in the original game. This is a very high bar.
      *   *Critique/Limitation:* The "safety" relies heavily on common knowledge of payoffs and the ability to bind agents perfectly. If payoffs are private information, SPIs become much harder.

