answer: |-
  # Activity Design: The Augmentation Market

  ## 1. Rules and Point Scheme

  **Objective:** Maximize your personal **Agency Credits (AC)** by selecting augmentations that improve your performance in decision scenarios.

  **Currency:** Agency Credits (AC). No real money is used. AC converts to participation points at the end of class (1 AC = 1 participation point). All students start with **10 AC**.

  **The Menu (Verbatim):**
  Before each round, you must privately select exactly one augmentation from the following list. You must live with this selection for the duration of the round.
  1. Coin-flip implant — a fixed fraction of your decisions are replaced by a quantum-random choice among the options you were already considering.
  2. Eraser — in the moment, you cannot act on any motive you would later disavow; the urge is screened out before it reaches deliberation.
  3. Forecaster — you receive an accurate preview of how each option will feel to you a week later.
  4. Split screen — alongside your own deliberation, you see the reasoning of the calmest, best-informed version of yourself.
  5. Veto window — a ten-second gap opens between urge and action, during which nothing proceeds without an explicit go signal.
  6. Scrambler — your deliberation is perturbed by small noise, so that two agents with identical histories and characters would sometimes decide differently.

  **The Rounds:**
  There are three rounds. Each round consists of three phases:
  1.  **Prediction:** The designated **Bookmaker** (a different student each round) publicly predicts which *single augmentation* the majority of the class will choose.
  2.  **Selection:** All other students privately write down their augmentation choice and submit it. (Binding).
  3.  **Scenario & Scoring:** The Instructor reads the scenario. The Instructor adjudicates success or failure based on the augmentation selected.
      *   **Baseline:** An un-augmented human has a 50% chance of success in each scenario.
      *   **Helpful Augmentations:** Increase success chance to 90%. (Gain **+2 AC**).
      *   **Neutral Augmentations:** Keep success chance at 50%. (Gain **0 AC**).
      *   **Harmful Augmentations:** Decrease success chance to 10%. (Lose **-2 AC**).
      *   *Note: To save time, the Instructor will determine which category your augmentation falls into for the specific scenario based on logical fit.*
      *   **Bookmaker Scoring:** If the Bookmaker correctly predicts the modal (most common) augmentation, they gain **+5 AC**. If incorrect, **0 AC**.

  **The Scenarios:**
  *   **Round 1 (Temptation):** You are on a strict medical diet. A delicious forbidden food is placed before you. Success = resisting. Failure = eating.
  *   **Round 2 (Snap Judgment):** You are a security guard. A shadow moves quickly. Your instinct says "threat," but analysis says "civilian." Time is critical. Success = holding fire. Failure = shooting.
  *   **Round 3 (Deliberate Choice):** You must choose between two career paths. Both are morally defensible and suit your skills. Success = choosing the one that aligns with your deep values. Failure = choosing arbitrarily and regretting it.

  ## 2. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:10 (Setup):** Arrange chairs in a circle. Distribute score sheets. Explain rules emphasizing that augmentations are *binding* and scores depend on *scenario performance*, not just picking randomly. Recruit Bookmaker for Round 1.
  *   **00:10 – 00:25 (Round 1: Temptation):**
      *   Bookmaker makes prediction (2 mins).
      *   Students select augmentation privately (3 mins).
      *   Instructor reads Scenario 1 (2 mins).
      *   Instructor reveals which augmentations were Helpful vs. Harmful for this scenario (3 mins).
      *   Students calculate AC (5 mins).
  *   **00:25 – 00:40 (Round 2: Snap Judgment):**
      *   Rotate Bookmaker.
      *   Repeat process (15 mins total).
  *   **00:40 – 00:55 (Round 3: Deliberate Choice):**
      *   Rotate Bookmaker.
      *   Repeat process (15 mins total).
  *   **00:55 – 01:05 (Tally & Visualization):**
      *   Collect data. Instructor draws a bar chart on the board showing total uptake per augmentation across all rounds.
      *   Highlight the disparity between "Control" augmentations (Eraser, Veto, Split, Forecaster) and "Noise" augmentations (Coin, Scrambler).
  *   **01:05 – 01:30 (Debrief):**
      *   Movement 1: Control vs. Openness (15 mins).
      *   Movement 2: Predictability vs. Undetermined (10 mins).

  ## 3. Debrief Plan (Two Movements)

  **Movement 1: Control vs. Openness (01:05 – 01:20)**
  *   **Observation:** Point to the board. "Look at the uptake for the Coin-flip implant and the Scrambler versus the Veto window and the Eraser."
  *   **Question:** "You had the chance to install indeterminism. You could have made yourself harder to predict by installing the Scrambler. Why did almost no one do it?"
  *   **Goal:** Elicit from students that randomness does not feel like *freedom*; it feels like *loss of control*.
  *   **Key Insight:** Guide them to articulate that the agency they value is the ability to align action with reasons (Eraser/Veto), not the ability to break the causal chain (Coin/Scrambler).
  *   **Reveal:** Only now introduce the phrase "a variety of free will worth wanting." Explain that their choices demonstrate they value reasons-responsiveness over metaphysical origination.

  **Movement 2: Predictability vs. Undetermined (01:20 – 01:30)**
  *   **Observation:** Turn to the Bookmakers. "The Bookmakers tried to predict you. Did anyone try to pick an augmentation specifically to fool the Bookmaker?"
  *   **Question:** "If you picked the Scrambler to be unpredictable, did it help your scenario score? If you picked the Veto to be rational, did the Bookmaker predict you?"
  *   **Goal:** Show that beating a predictor doesn't require noise (undetermined choices); it requires better reasoning (the predictor failed to model your reasons).
  *   **Key Insight:** Being hard to predict is not the same as being free. You beat the bookmaker by being *more rational* than they expected, not by being *random*.
  *   **Reveal:** Connect this to the conflation of "hard to predict" with "undetermined." True agency is modeled by reasons, not noise.

  ## 4. Limitations: What This Cannot Reproduce

  **The Facilitator must supply this candidly during the final 5 minutes:**
  1.  **Hypothetical Stakes:** "You played for participation points, not your health, your liberty, or your career. The anxiety of real consequence changes how authorship feels."
  2.  **Felt Authorship:** "In this game, I adjudicated your success. In real life, you feel the weight of the choice in your muscles and nerves. No points scheme can simulate the phenomenology of being the source of an action."
  3.  **The Black Box:** "We treated these augmentations as tools. In reality, if you installed an Eraser, *you* might feel like a different person. We glossed over the identity cost of modification."

  **What the Facilitator Must Supply in Words:**
  *   You must explicitly validate the intuition that "ultimate origination" feels important. Acknowledge that the *feeling* of being an uncaused cause is powerful, even if their *choices* in the game rejected it.
  *   You must ensure the Bookmaker mechanism is framed as a tool for understanding prediction, not a competition to humiliate the predictor.

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The Contrarian Pick (Coin-flip as a Joke)**
  *   **Problem:** Students may select the Coin-flip implant or Scrambler to be funny or to test the system, skewing the data.
  *   **Solution:** The point scheme is the shield. If a student picks Coin-flip in the Temptation round, publicly adjudicate it as a **Harmful Augmentation (-2 AC)**. When they lose points, the class sees the cost of contrarianism. Do not shame them; simply apply the rules rigorously. Say, "The market has spoken: that asset lost value."
  *   **Bookmaker Buffer:** The Bookmaker mechanism helps here. If many students pick Coin-flip as a joke, the Bookmaker will predict it and win points. The jokesters, however, lose scenario points. This creates a natural pressure toward seriousness.

  **2. Bookmaker Paralysis**
  *   **Problem:** The student Bookmaker may be too shy to make a public prediction.
  *   **Solution:** Pre-select the Bookmakers before class starts (choose confident students) or allow the Bookmaker to consult with one peer before announcing. Keep the prediction simple: "I think most people will pick [X]."

  **3. Time Overrun**
  *   **Problem:** Discussion during rounds eats into debrief time.
  *   **Solution:** Enforce a strict "No talking during Selection Phase" rule. If students argue about the logic of an augmentation during the round, pause them and say, "Save that for the market analysis (debrief)."

  **4. Confusion on Scoring**
  *   **Problem:** Students don't understand why Coin-flip is "Harmful" in a Temptation scenario.
  *   **Solution:** Be explicit in the adjudication phase. "In a temptation scenario, randomness gives you a 50% chance of failing your diet. The Eraser gives you a 90% chance of success. The market values success."

  \answer{lowest: Coin-flip implant; highest: Veto window}
