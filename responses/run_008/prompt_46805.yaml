answer: |-
  Your hypothesis is sharp, but it's about 80% right. You have correctly identified the *conceptual* deadlock, but you are underestimating the *empirical* underdetermination that keeps it frozen.

  Here is the diagnosis: The debate is frozen not because the camps are disagreeing about explanatory standards (though they are), but because **behavioral data in the one-shot PD is equifinal.** Multiple distinct evolutionary stories predict the exact same behavioral output in the lab. Because the output is identical, the argument retreats to untestable assumptions about ancestral environments (the "proxy fight" you identified) or semantic disputes about what "one-shot" means.

  Here is the breakdown of why this is happening and what would actually move the needle.

  ### 1. The Explanatory Mismatch (You are right here)
  You correctly identified that the camps are answering different Tinbergen questions.
  *   **The Misfire Camp** is answering a **Proximate/Origin** question: "What specific cognitive machinery is being triggered?" Their answer: Reciprocity algorithms designed for repeated games.
  *   **The Group Selection Camp** is answering a **Distal/Function** question: "Why does this phenotype persist in the population?" Their answer: Because groups with these norms outcompete others.

  These are not logically contradictory. A trait can originate as a byproduct (spandrel) of reciprocity mechanisms but be *maintained* by group selection. However, the debaters treat them as mutually exclusive hypotheses. This is a category error. The "Misfire" camp treats "adaptive origin" as a necessary condition for "real cooperation," while the "Group Selection" camp treats "current group utility" as sufficient proof of adaptation. Until they agree on whether they are explaining the *mechanism's history* or the *trait's maintenance*, they will talk past each other.

  ### 2. The Equifinality Problem (The missing 20%)
  This is where your hypothesis needs expansion. Even if they agreed on explanatory standards, the debate would remain frozen because **behavioral data cannot distinguish the models.**

  If I observe a subject cooperating in an anonymous one-shot:
  *   **Model A (Misfire):** Their reciprocity heuristic misfired because anonymity cues were weak.
  *   **Model B (Group Select):** Their internalized norm activated because they are prosocial.
  *   **Model C (Reputation Heuristic):** Their "audience detection" module fired (Camp 3) because eyes/presence were subtly implied.

  All three models predict $P(Cooperate) > 0$. To distinguish them, you need to break the symmetry. The standard method has been "make it more anonymous." But as Camp 3 notes, you can never prove a negative (that the subject *truly* felt no reputation risk). This creates an **asymmetry of falsification**:
  *   If cooperation drops with better anonymity, Misfire/Reputation wins.
  *   If cooperation stays high, Group Selection wins.
  *   *But:* If cooperation stays high, Misfire proponents say "you didn't hide the cues enough." If it drops, Group Selection proponents say "you induced antisocial demand effects."

  This is why the argument about the ancestral environment is a proxy fight. Since we cannot test the Pleistocene, arguing about whether ancestors faced "true one-shots" is a way of setting priors on the models without admitting you're doing so. It's a philosophical stance masquerading as an anthropological claim.

  ### 3. The "Perceived One-Shot" is the Real Bottleneck
  You mentioned Camp 3 (no such thing as a perceived one-shot), but you treated it as a third option. It is actually the **dissolver** of the debate.

  If the human brain *cannot* represent a true one-shot game (because the cognitive cost of tracking reputation cues is lower than the cost of calculating true anonymity), then the "One-Shot Prisoner's Dilemma" is a **category error in experimental design.**

  The debate is frozen because Experimenters are trying to isolate a variable (anonymity) that the Subject's psychology does not process as a variable. The subjects aren't playing the Game Theorist's matrix; they are playing a "Social Interaction" game where the matrix is irrelevant. As long as the experiment assumes the subject is optimizing for the payoff matrix, and the subject is optimizing for social heuristics, the data will remain ambiguous.

  ### 4. What Counts as Progress?
  Better anonymity experiments are diminishing returns. We know people cooperate in double-blind conditions. We know they cooperate less when watched. The variance is too small to adjudicate the evolutionary story.

  Progress requires shifting from **outcome data** (did they cooperate?) to **process data** (how did they decide?).

  *   **Cognitive Process Tracing:** Use reaction times, eye-tracking, or cognitive load.
      *   *Prediction:* If Misfire is right, cooperation should be the "default" fast response (heuristic), and defection should require cognitive override (calculating the true one-shot).
      *   *Prediction:* If Rational/Selfish is the baseline, defection should be fast, cooperation slow.
      *   *Current Status:* Evidence is mixed but leans toward cooperation being intuitive (Rand et al.), which hurts the "calculated error" theory but helps the "internalized norm" theory.
  *   **Cross-Cultural Market Integration:**
      *   If cooperation is a Misfire of small-band reciprocity, it should be universal and invariant.
      *   If it is Group Selection/Cultural Norms, it should scale with market integration and impersonal trade (Henrich's work).
      *   *Progress:* This is the strongest empirical wedge we have. The fact that cooperation *varies* by societal structure suggests it's not just a hardwired misfire, but it doesn't prove group selection over cultural learning.
  *   **Computational Modeling of Heuristics:**
      *   Stop modeling agents as optimizing payoff matrices. Model them as optimizing *cue detection*.
      *   A model that wins is one that specifies exactly which environmental cues trigger the "cooperate" switch and shows that those cues map onto ancestral probabilities of repetition, *even if* the lab removes the repetition.

  ### Summary Diagnosis
  The debate is frozen because it is **empirically underdetermined** due to equifinality, and **conceptually confused** due to mismatched levels of analysis.

  Your hypothesis that it is a difference in explanatory standards is correct, but that difference persists *because* the data doesn't force a resolution. The "ancestral environment" argument is indeed a proxy fight, but it's a necessary one because it sets the priors for the models that the data cannot distinguish.

  **To unfreeze it:** Stop asking "Is this adaptation or error?" and start asking "What specific computational heuristic is running, and what cues trigger it?" The answer is likely that it's a **context-sensitive heuristic** that treats "one-shot" as a high-probability repeated game unless overwhelming cues suggest otherwise. That renders the "One-Shot PD" not a test of cooperation, but a test of **cue sensitivity.**
