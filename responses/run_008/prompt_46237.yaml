  Second thing: I've heard people claim that SIA is just SSA in disguise once you widen the reference class in the right way. Is that actually right, or is it a sleight of hand? And relatedly, why do people say SIA dodges the reference class problem that haunts SSA -- or does it just relocate the problem somewhere less obvious?

  Please don't just restate the definitions of SSA and SIA, i know those cold. I want the actual intuition for the mechanics, the kind of thing that would let me reconstruct the verdicts without remembering which assumption gives which answer.
