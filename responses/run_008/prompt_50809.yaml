answer: |-
  **Desiderata for a Theory of Linguistic Understanding**

  To move beyond duelling intuitions, the following specifications distinguish between methodological necessities (non-negotiable for any rigorous theory) and theoretical commitments (where the philosophical camps diverge).

  1.  **Functional Teleology**
      *   **Requirement:** The theory must specify the *purpose* of understanding. Is it to coordinate action, predict sensory input, transfer information, or maintain social coherence? Success conditions must be defined relative to this function.
      *   **Motivation:** Without knowing what understanding is *for*, we cannot judge if a system has it. The 'Stochastic Parrot' critique assumes the function is reference; the deflationist assumes it is prediction.
      *   **Status:** **Non-negotiable.** A theory without success conditions is unfalsifiable.

  2.  **Substrate Neutrality**
      *   **Requirement:** The criteria for understanding must not presuppose biological tissue, carbon-based chemistry, or evolutionary history.
      *   **Motivation:** To avoid begging the question against AI. If the definition requires a human brain, the debate ends before it begins. This addresses the worry that the Chinese Room argument smuggles in biological chauvinism.
      *   **Status:** **Non-negotiable** (for a general theory of mind), though often treated as a **Camp Preference** by biological naturalists.

  3.  **The Form/Meaning Distinction**
      *   **Requirement:** The theory must explain how a system distinguishes syntactic manipulation from semantic grasp. It must account for why swapping symbols for arbitrary tokens (as in the Chinese Room) alters the system's state in a way that matters for understanding.
      *   **Motivation:** Searle's Chinese Room. If understanding is merely symbol manipulation, the person in the room understands Chinese. Most agree they do not; the theory must explain why.
      *   **Status:** **Non-negotiable.** This is the core phenomenon to be explained, even if camps disagree on the solution.

  4.  **Productive Systematicity**
      *   **Requirement:** The system must demonstrate competence on genuinely novel utterances, not merely interpolate from training distributions. It must show sensitivity to structural composition, not just statistical co-occurrence.
      *   **Motivation:** The model answering unseen physics questions vs. the octopus fluent in distress calls. Fluency on familiar data is insufficient; the system must handle inputs structurally distinct from its training set.
      *   **Status:** **Non-negotiable**, though the threshold for 'novelty' is contested.

  5.  **Third-Person Verifiability**
      *   **Requirement:** Ascriptions of understanding must be testable without relying on the system's self-reports (e.g., 'I understand').
      *   **Motivation:** LLMs are trained to mimic human assent. Relying on introspection invites the 'philosophical zombie' problem.
      *   **Status:** **Non-negotiable** (methodologically).

  6.  **Causal Grounding**
      *   **Requirement:** Symbols must bear a causal or informational relationship to the entities they denote, extending beyond the text corpus to the world (or a simulated environment).
      *   **Motivation:** Harnad's Symbol Grounding Problem and the Octopus case. The octopus processes signals without knowing what 'shipwreck' refers to in reality. Does the lack of causal contact with the referent preclude understanding?
      *   **Status:** **Camp Preference.** The Grounding camp treats this as non-negotiable; the Formalist/Deflationist camp views it as unnecessary for *linguistic* competence.

  7.  **Abstraction Capacity**
      *   **Requirement:** The theory must account for understanding terms that lack direct sensorimotor referents (e.g., 'quark', 'justice', 'null set').
      *   **Motivation:** The model answering physics questions about unperceivable entities. If grounding requires direct perception, abstract understanding becomes impossible even for humans.
      *   **Status:** **Non-negotiable**, but creates tension with strong Grounding requirements.

  ***

  **Joint Unsatisfiability**

  There is a genuine incompatibility between **Causal Grounding (6)** interpreted strongly and **Substrate Neutrality (2)** interpreted strictly. If 'grounding' is defined as requiring sensorimotor loops akin to biological organisms (to satisfy the intuition behind the Octopus and Chinese Room cases), then a text-only model is excluded by definition. However, if one maintains strict Substrate Neutrality, one must accept that 'grounding' can be achieved through causal links in data space rather than physical interaction. Consequently, a theory cannot simultaneously demand biological-style embodiment as a necessary condition for grounding *and* claim to be neutral regarding the physical substrate. This suggests the debate is not empirical but definitional: one must abandon either the demand for biological-style causal contact or the commitment to substrate neutrality. A secondary tension exists between **Productive Systematicity (4)** and **Third-Person Verifiability (5)**: if systematicity requires internal rule-following (classicism), it may be indistinguishable from high-dimensional statistical generalisation via external testing alone, rendering the distinction verification-transcendent.

  ***

  **Scoring the Extremes**

  The **Deflationist view** (understanding is appropriate text generation) scores highly on Substrate Neutrality, Third-Person Verifiability, and Abstraction Capacity, as it requires nothing but input-output competence. However, it collapses the Form/Meaning Distinction (3), effectively denying the intuition behind the Chinese Room, and struggles to explain Productive Systematicity (4) without conceding that statistical interpolation counts as rule-following. It treats the Octopus case as a success, whereas critics see it as a failure of reference.

  The **Grounding-First view** (symbols must anchor in perception/action) secures the Form/Meaning Distinction and satisfies the intuition that the Octopus lacks understanding. However, it fares poorly on Substrate Neutrality, often smuggling in biological prejudices, and faces severe difficulty with Abstraction Capacity (7); if understanding 'quark' requires sensorimotor grounding, human physicists arguably fail their own test. It risks making understanding too rare to be useful, while the Deflationist risks making it too common to be meaningful.
