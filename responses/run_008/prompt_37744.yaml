  To fit all five data points, any rule must account for the **Kosovo exception** (legitimacy without a vote or consent) and the **Crimea rejection** (illegitimacy despite a vote).

  **Rule A: The Constitutional-Remedial Hybrid**
  *   **Principle:** Secession is legitimate if it follows a lawful constitutional route *or* if it is a remedial response to severe oppression. In established democracies, constitutional consent is required; in oppressive or failed-state contexts, justice overrides procedure.
  *   **Fit:**
      *   *Scotland/NI/Quebec:* Legitimate because they follow (or seek) constitutional pathways within democracies.
      *   *Kosovo:* Legitimate because severe oppression forfeited the parent state's right to consent (Remedial Exception).
      *   *Crimea:* Illegitimate because it lacked constitutional consent *and* was not remedial (it was coercive annexation).
  *   **Prediction for New Case:** **Illegitimate.** The region is in a consolidated democracy (requiring consent) and there is no oppression beyond legal prosecution (failing the remedial exception). The unilateral vote cannot cure the lack of constitutional authority.

  **Rule B: The Democratic Will Standard**
  *   **Principle:** Secession is legitimate if it reflects a clear, free expression of popular will, provided the process is not coerced by foreign powers. Legal technicalities are secondary to the democratic mandate, unless the vote itself is unfree.
  *   **Fit:**
      *   *Scotland/NI:* Legitimate because the will was clearly expressed.
      *   *Kosovo:* Legitimate because the will was assumed due to context (or the lack of a vote was excused by the impossibility of holding one under oppression).
      *   *Crimea:* Illegitimate because the vote was coerced by military occupation (not free).
