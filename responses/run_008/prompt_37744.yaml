  **Conclusion:** She likely views self-determination as a **primary right** that must be exercised through **constitutional channels** in democracies, with a **remedial safety valve** for tyrannical states. The new case fits neither channel.

  ### 3. The Tie-Breaker Case

  To definitively distinguish whether she follows Rule A (Consent is mandatory in democracies) or Rule B (Free Vote is sufficient in democracies), propose the following case:

  **The Case:** *A wealthy region in a consolidated democracy holds a unilateral referendum. The central state adopts a posture of strict neutrality: it does not consent to the vote, but it also does not prosecute organizers, block campaigning, or challenge the vote in court. Turnout is 85%, with 85% voting Yes. Independent monitors certify the vote as entirely free and fair.*

