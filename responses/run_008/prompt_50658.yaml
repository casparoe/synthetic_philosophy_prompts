answer: |-
  The revealed-preference programme, pioneered by Paul Samuelson, sought to purge economics of the psychological metaphysics of "utility." By defining utility solely through observed choices, Samuelson aimed to make preference theory behaviorally rigorous. However, this operationalist turn generates a profound philosophical controversy: does revealed preference give utility a determinate meaning, or does it collapse into a tautology that explains nothing? After weighing the challenges of circularity, context-dependence, and internal conflict, I argue that within the revealed-preference programme, "utility" denotes nothing more than a formal index of choice consistency; it is a valid mathematical tool for modeling behavior but a failed account of welfare or psychological motivation.

  The primary charge against revealed preference is circularity. If a preference is defined simply as whatever choice an agent makes, the statement "she chose the soup because she preferred it" ceases to be an explanation and becomes a definition. Critics argue this renders the theory vacuous: if every choice reveals a preference, no choice can ever contradict the theory. Defenders reply that revealed preference is not about explaining individual acts causally but about imposing consistency constraints (axioms) on choices over time. If an agent chooses $A$ over $B$ today, they should not choose $B$ over $A$ tomorrow given the same budget. Here, utility gains a determinate meaning: it is a numerical representation of transitive and complete ordering. However, this saves the theory from circularity only by retreating into formalism. It predicts consistency, not content. It tells us an agent is rational, not why they are rational or what satisfies them.

  This fragility is exposed when we consider menu-dependent choice. Consider a diner who reliably orders the second-cheapest wine on any list. Under a straightforward revealed-preference reading, if the menu changes, their choice changes, seemingly violating consistency. They chose Merlot when it was second-cheapest, but Cabernet when *it* became second-cheapest. To save the theory, the revealed-preference advocate must argue that the agent's preference is not over the wine (the outcome) but over the description "second-cheapest wine" (the context). By individuating outcomes finely enough to include the choice architecture, any behavior can be rationalized. While this preserves the mathematical structure of utility, it risks triviality. If every context shift creates a new "good," the theory loses predictive power. It suggests that utility is not a property of the world or the agent's psyche, but a relational property of the choice situation. Utility becomes a bookkeeping device for context-sensitive behavior rather than a measure of stable desire.

  The problem deepens with cases of self-binding, which reveal internal conflict rather than contextual sensitivity. Consider a smoker who buys a packet of cigarettes while simultaneously paying a friend a fee for every cigarette caught smoking. The purchase reveals a preference for smoking; the fee reveals a preference for abstaining. Both are observed choices. A strict revealed-preference account sees contradiction where there is actually agency. The agent is acting on a second-order preference (to not want cigarettes) against a first-order impulse. To resolve this, the theorist must distinguish between "revealed preferences" and "meta-preferences." But meta-preferences are mental states; they are not directly observed in the same way as picking a bottle or handing over cash. Acknowledging them violates the behaviorist strictures of the revealed-preference programme. If utility must account for self-binding, it cannot remain purely behavioral; it must reference the psychological hierarchy of desires. Without this, the theory cannot distinguish between a consistent agent and a conflicted one, rendering the concept of utility blind to the structure of human will.

  Finally, we must address the operationalisation defence: perhaps utility is only meant to be a consistent numbering system, useless for welfare analysis. If "welfare" is defined as "preference satisfaction," and preferences are defined as "choices," then welfare reduces to "getting what you chose." This creates normative blindness. Consider adaptive preferences, such as the "sour grapes" phenomenon where an oppressed individual stops desiring what they cannot have. Under revealed preference, this adaptation is rational and welfare-enhancing because the agent no longer chooses the forbidden fruit. A theory that cannot condemn the satisfaction of adaptive preferences formed under coercion is normatively bankrupt. If utility is merely the shadow of choice, it cannot serve as a criterion for social improvement, because it lacks an independent standard of well-being against which to measure choices.

  Therefore, the verdict on the revealed-preference programme must be clear. It succeeds in making utility operationally definable but fails to make it substantively meaningful. By anchoring utility strictly in observation, it strips the concept of the psychological and normative content required to explain *why* we choose or whether those choices benefit us. Utility, on this programme, is a measure of coherence, not goodness. It tells us if an agent is consistent, not if they are happy or free. To recover utility as a concept capable of supporting welfare economics or psychological explanation, we must abandon pure behaviorism. We must admit that preferences are mental states that cause choices, rather than definitions derived from them. Until then, revealed preference remains a sophisticated tautology: a mirror that reflects choice back at us, calling it utility.

