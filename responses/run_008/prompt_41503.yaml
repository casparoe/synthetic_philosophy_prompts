      *   *Best Advice:* Stick with **"Enduring Community Membership."** This saves Residents, Undocumented, Prisoners (domicile), Expats (citizenship). It sacrifices Commuters and Second-home owners (transactional).
      *   *The Hard Truth:* The Lithium Mine case challenges this. If the principle is Membership, the farmers don't vote. If the user thinks they *should*, the principle shifts to "Affected Interests," which breaks the Commuter/Second-home exclusion. The user needs to know this trade-off.

  7.  **Drafting the Response:**
