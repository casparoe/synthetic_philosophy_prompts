answer: |-
  You are struggling because you are intuitively rejecting the two most common academic theories of voting rights, but you haven't named the third one that actually matches your instincts.

  The two standard theories are:
  1.  **All Affected Interests (AAI):** Everyone impacted by a decision should vote. (You reject this: Commuters and second-home owners are affected, but you say no.)
  2.  **All Subjected Interests (ASI):** Everyone subject to the coercion of the law should vote. (You reject this: Tourists and commuters are subject to local laws, but you say no.)

  Your instincts align with a third, older principle: **The Principle of Constitutive Membership (or "Domicile").**

  Under this principle, voting is not a reward for being impacted, nor a shield against coercion. It is the mechanism by which a specific community defines itself. You vote where you **make your life**, not just where you spend your money or your time.

  Here is how this principle maps onto your gut calls, where it leads on your new cases, and the hard truth about which of your verdicts is vulnerable.

  ### 1. The Principle: "Where Your Life Is Centered"
  For local elections, the right to vote belongs to those for whom the municipality is their **domicile**—the place they return to, where their social ties exist, and where they intend to remain. For national elections, it shifts to **citizenship**, which is a form of enduring national membership regardless of location.

  **How it justifies your existing list:**
  *   **Permanent Residents:** **Yes.** Their life is centered here.
  *   **Undocumented Immigrants:** **Yes.** Their life is centered here. (Legal status is federal; community membership is local).
  *   **Second-Home Owners:** **No.** They have a financial interest, but their *life* is elsewhere. They are stakeholders, not members.
  *   **Commuters:** **No.** They are economic participants, not community members. They go home to a different polity at night.
  *   **Tourists:** **No.** Transient presence does not equal membership.
  *   **Businesses:** **No.** A corporation is not a human life; it cannot be a "member" of a community in the moral sense required for the franchise.
  *   **Expats (National):** **Yes.** Citizenship is an enduring bond of membership that survives temporary relocation.
  *   **Prisoners:** **Yes.** This is the critical test. In most legal frameworks, prisoners do not lose their domicile; their legal residence remains where they lived before incarceration. They intend to return. They remain members of the polity, merely temporarily confined.

  ### 2. Application to New Agenda Items

  **Case A: The Regional Lithium Mine Referendum**
  *   **The Scenario:** A referendum on a mine whose water usage harms farmers in a *different* county.
  *   **The Principle's Verdict:** **The farmers should not vote.**
  *   **Why:** If you stick to your intuition on commuters and second-home owners, you have already decided that *impact alone* does not grant a vote. If you give the farmers a vote because they are "affected," you logically must give a vote to the commuters (who are affected by zoning) and the second-home owners (affected by property tax rates).
  *   **The Hard Truth:** To be consistent, you must argue that political boundaries matter more than economic fallout. The farmers are members of *their* county's polity, not yours. If the mine is a regional threat, the solution is a regional voting district, not expanding your town's charter. If you argue for the farmers here, you undermine your exclusion of the commuters.

  **Case B: Residents with Advanced Dementia**
  *   **The Scenario:** Long-term care residents voting with family assistance.
  *   **The Principle's Verdict:** **Yes, they should vote.**
  *   **Why:** Under "Constitutive Membership," these residents are clearly members of the town. They live there; it is their home. The only barrier is *capacity*, not *membership*.
  *   **The Nuance:** This connects to your flip-flopping on 16-year-olds. If the principle is membership, 16-year-olds are members. The only reason to exclude them (or dementia patients) is a judgment on *competence*, not belonging.
  *   **Recommendation:** If you believe prisoners retain rights despite their status, you should believe dementia patients retain rights despite their condition. Assistance (like a family member helping mark the ballot) is a reasonable accommodation, similar to language assistance. To exclude them is to say they are no longer "persons" in the eyes of the charter.

  ### 3. The Honest Audit: Which Verdicts Are at Risk?

  You asked to be told which of your verdicts has to go if the principle doesn't fit. Here is the vulnerability analysis.

  **The Strongest Fit:**
  Your stance on **Residents, Undocumented, Second-Home Owners, and Commuters** is extremely consistent under "Constitutive Membership." Do not let anyone talk you into "Taxation without Representation" arguments. You have correctly identified that paying taxes buys services, not sovereignty.

  **The Vulnerable Verdict: Prisoners**
  This is your weak point.
  *   **The Conflict:** If a committee member argues, "Voting requires physical presence to understand the community," your prisoner verdict collapses. They are not physically present. They are not subject to local zoning or noise ordinances in the same way.
  *   **The Defense:** You must argue that incarceration is a suspension of *liberty*, not *membership*. Their domicile remains the town. They will return. If you lose this argument, you must concede the prisoner vote.
  *   **The Trade-off:** If you want to keep the Prisoner vote, you must accept that "Physical Presence" is not a requirement. If you demand Physical Presence, you lose the Prisoners. If you demand Membership, you keep the Prisoners but must explain why a Commuter (who is physically present 50 hours a week) isn't a member. (Answer: The commuter's *home* and *future* are elsewhere).

  **The Flip-Flop: 16-Year-Olds**
  *   **The Conflict:** You flip-flop because you are torn between **Membership** (Yes, they live here and will inherit the debt) and **Competence** (No, they lack legal agency).
  *   **The Resolution:** If your principle is "Membership," you must vote **Yes**. Many charter committees are lowering the age to 16 for precisely this reason: they are subject to the laws (truancy, curfew) and affected by the decisions (schools, climate).
  *   **The Sacrifice:** If you vote **No** on 16-year-olds, you are admitting that your principle isn't just "Membership," it is "Competent Membership." If that's the case, you open the door to challenging the dementia patients' right to vote. You cannot easily say "Yes" to dementia patients and "No" to 16-year-olds without a specific theory of cognitive capacity.

  ### Summary Recommendation for the Committee

  When you sit down, articulate your principle clearly so you don't get trapped in case-by-case contradictions. Say this:

  > *"I am operating on the principle of **Enduring Community Membership**. Voting is for those who make their life here, intend to stay, and constitute the community, not merely those who are economically affected or temporarily present."*

  **Your Cheat Sheet:**
  1.  **Commuters/Second-Home:** No. (Transaction, not membership).
  2.  **Prisoners:** Yes. (Domicile remains, membership endures).
  3.  **Lithium Farmers:** No. (They are members of a different polity).
  4.  **Dementia Patients:** Yes. (Membership is intact; assistance is accommodation).
  5.  **16-Year-Olds:** Yes. (If you vote No here, you contradict your stance on prisoners/dementia by introducing a capacity test you haven't applied elsewhere).

  If you hold this line, you are consistent. If you concede the vote to the farmers, you must concede it to the commuters. If you deny the vote to the prisoners, you must admit that physical presence trumps membership. Choose your battle.
