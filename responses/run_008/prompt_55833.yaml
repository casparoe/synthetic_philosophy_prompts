answer: |-
  This is a remarkably sharp observation. Your friend is half-right: path dependence explains *how* we got this patchwork (different programs created in different eras for different political coalitions), but it doesn't explain *why* the patchwork holds together morally. People tolerate these contradictions because they resonate with a specific, albeit incoherent, set of normative commitments.

  You are correct that there is a theory buried in there, but it is not a single coherent political philosophy. It is a **stratified moral economy** that blends three distinct frameworks: **Luck Egalitarianism**, **Reciprocal Contractualism**, and **Class-Based Paternalism**.

  Here is the breakdown of the implicit philosophical commitments, where they contradict, and what would happen if you actually enforced one of them consistently.

  ### 1. The Three Competing Theories

  #### A. Luck Egalitarianism (LE)
  *The Theory:* Inequalities resulting from "brute luck" (things you didn't choose) should be compensated; inequalities resulting from "option luck" (choices you made) should not.
  *   **Where it fits:** **Disability Benefits.** The system treats disability as "brute luck." You didn't choose to break your leg or develop schizophrenia. Therefore, the high gatekeeping is just verifying the luck claim. Once verified, there are no behavioral conditions because your capacity for choice is deemed compromised.
  *   **Where it fails:** **Retirees & Enforcement.** If LE were the driving force, retiree pensions would be means-tested against lifestyle choices. If you smoked for 40 years and developed COPD, LE suggests you bear some responsibility for that health cost. Yet, pensions are unconditional. Furthermore, LE is impartial; a dollar of fraud is a dollar of fraud. The asymmetry between the single mom and the self-employed taxpayer violates LE's demand for neutral justice.

  #### B. Reciprocal Contractualism
  *The Theory:* Social benefits are part of a social contract. You receive support in exchange for past contributions (taxes/work) or a commitment to future contributions (looking for work).
  *   **Where it fits:** **Unemployment Insurance (UI) & Pensions.** UI is explicitly contractual: "We pay you while you look for work." The job search requirements are proof of your willingness to honor the reciprocal deal. Pensions are viewed as "earned rights" based on past payroll tax contributions.
  *   **Where it fails:** **Child Benefits & Disability.** Child benefits are universal and unconditional; children have not contributed, nor can they promise to. Disability recipients are often exempted from the "future contribution" requirement entirely. If reciprocity were the only rule, disability benefits would require rehabilitation plans, and child benefits would be tied to school attendance or parental employment.

  #### C. The "Deservingness" Heuristic (Moral Psychology)
  *The Theory:* This isn't a formal philosophy but a sociological reality. Public support depends on the **CARIN** criteria: **C**ontrol, **A**ttitude, **R**eciprocity, **I**dentity, **N**eed.
  *   **Where it fits:** **Everything.** This is the glue holding the contradictions together.
      *   **Disabled/Elderly/Kids:** High Need, Low Control over their situation. They are "Worthy."
      *   **Unemployed:** Suspected High Control (could work if they wanted), Suspected Bad Attitude. They are "Unworthy."
      *   **Enforcement Asymmetry:** This fits the **Identity** criterion. The single mom is viewed through a lens of suspicion (potential dependency); the self-employed taxpayer is viewed as a "partner" of the state. The state punishes the subordinate and negotiates with the peer.

  ### 2. The Contradictions (Where the Theory Breaks)

  The system is genuinely incoherent in two specific places that reveal its true nature.

  **The Enforcement Asymmetry (The Class Contradiction)**
  Normative theories (LE or Reciprocity) demand impartiality. If the principle is "do not steal from the collective," it applies to the gig worker and the consultant equally.
  *   **The Implicit Commitment:** This reveals that the system is not actually about *justice*; it is about **social control**. For the poor, benefits are a tool of behavioral management (show up to appointments, don't earn extra cash). For the middle class, the tax system is a revenue service. The philosophical commitment here is **Paternalism**: the state assumes it must discipline the poor to keep them functional, but only needs to audit the wealthy to ensure revenue.

  **The "Fault" Inconsistency (The Health Contradiction)**
  You noted that disability is treated as "no fault," but unemployment is treated as "potential fault." Yet retirees get pensions regardless of health behaviors.
  *   **The Implicit Commitment:** The system presupposes a **Binary View of Agency**. You are either a *Full Agent* (unemployed person, expected to work) or a *Non-Agent* (disabled person, exempt from work).
  *   **The Glitch:** Retirees are treated as *Non-Agents* regarding their health (no penalties for smoking) but *Full Agents* regarding their past (they earned their pension). The system refuses to acknowledge that agency is partial. It refuses to ask: "Did this unemployed person face bad luck (recession)?" and it refuses to ask "Did this disabled person make choices (diet/smoking) that contributed?"

  ### 3. What is Underdetermined?

  There are areas where multiple theories license the same mess, making it hard to disentangle:

  *   **Child Benefits:** Both Luck Egalitarians (kids didn't choose their parents' income) and Contractualists (investing in future taxpayers) support universal child benefits. This is the most stable part of the system because the moral theories align.
  *   **Disability Gatekeeping:** Both LE (verify the bad luck) and Contractualists (prevent fraud to protect the pot) support heavy medical reviews. The *intent* differs, but the *architecture* is the same.

  ### 4. The Thought Experiment: If We Took Luck Egalitarianism Seriously

  If a government decided to purge the contradictions and apply **Luck Egalitarianism** consistently, the welfare state would look radically different. It would likely be *more* invasive, not less.

  1.  **Work Requirements Would Vanish (for some):** If unemployment is largely due to structural bad luck (labor market conditions), requiring job searches is punishing bad luck. A true LE system would provide income support without behavioral conditions if the local unemployment rate is high.
  2.  **Lifestyle Conditionality Would Explode:** This is the dark side of LE. If we compensate for "brute luck" (genetic disability), we must penalize "option luck" (choices).
      *   **Smoking/Obesity:** You would see reduced disability payments or higher healthcare co-pays for conditions linked to lifestyle choices.
      *   **Risky Hobbies:** If you break your leg skiing, you might get less support than if you break it falling down stairs.
      *   **Savings/Investment:** You might be penalized for "bad financial luck" if you took risky investments that failed, compared to someone who kept cash under a mattress.
  3.  **Enforcement Would Equalize:** A fraud dollar is a fraud dollar. The single mom and the self-employed consultant would face identical penalties. The administrative burden would shift to the state to prove *intent*, rather than the citizen to prove *innocence*.

  ### 5. Summary: The Actual Implicit Theory

  The system you are staring at is not Luck Egalitarianism. It is **Status-Based Contractualism.**

  *   **The Premise:** Citizenship is a tiered contract.
  *   **Tier 1 (Contributors/Peers):** Taxpayers, retirees, self-employed. The relationship is horizontal. Errors are administrative. Trust is presumed.
  *   **Tier 2 (Dependents/Wards):** Children, the severely disabled. The relationship is paternalistic. Needs are met, but agency is ignored.
  *   **Tier 3 (Suspects):** The unemployed, the working poor. The relationship is vertical/disciplinary. Benefits are not rights; they are behavioral levers. Trust is denied.

  **Why the contradictions persist:**
  Because the system isn't trying to be philosophically consistent; it is trying to be **politically stable**.
  *   If you treat the unemployed like the disabled (no strings), you lose the middle-class vote (Reciprocity violation).
  *   If you treat the disabled like the unemployed (job searches), you lose the human rights lobby (Cruelty).
  *   If you treat the single mom like the taxpayer (due process), you blow the administrative budget (Efficiency).

  **The Verdict:**
  Your intuition about "fault" is correct, but it's not about *actual* fault. It's about **suspicion of agency**.
  *   **Unemployed:** Suspected of having agency they are withholding. (Punish)
  *   **Disabled:** Verified as having no agency. (Protect)
  *   **Taxpayers:** Assumed to have agency but are peers of the state. (Negotiate)

  The "mess" is the result of trying to run a universalist moral system (we all deserve dignity) through a particularist administrative state (we only have resources to police the poor). If you want to fix it, you don't need a new policy; you need to decide if the state views citizens as **clients to be managed** or **rights-holders to be served**. Currently, it decides based on your bank account.
