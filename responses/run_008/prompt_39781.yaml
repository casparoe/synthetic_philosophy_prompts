answer: |-
  Good evening. Before I begin, I need to state a ground rule. There will be no mention of eighty-five being the new sixty. There will be no talk of being "young at heart." And if anyone suggests that curiosity is an anti-ageing cream, I have been instructed to stop speaking immediately.

  My grandfather has made his position clear: Old age is not a disease to be managed, or a younger age to be imitated. It is a specific condition with its own virtues, provided you have the courage to inhabit it. So, tonight, I want to defend eighty-five on its own terms.

  There is an old argument, a Roman one, that suggests there are four standard charges brought against old age. I'm not going to quote the text, because the men in this room who taught it for forty years know it better than I do, and the rest of the family would rather have their dinner. But the structure of that argument fits the man we are celebrating too perfectly to ignore.

  The first charge is that old age withdraws a person from active life. That it renders you useless to the world.
  If you judge this by the standard of commuting or attending departmental meetings, perhaps. But by the measure of the mind, he has not withdrawn. He still referees papers. I have seen the red ink. It is as dense, as precise, and as unforgiving as it was in 1974. He does not do this because he needs to, but because he believes the work matters more than the worker. To suggest he should rest is to suggest the work is finished. It isn't.

  The second charge is that old age enfeebles the body.
  This is not a charge we can deny. We do not pretend his eyes are what they were. He is on his third guide dog. That is a fact, not a tragedy. The point isn't that he navigates the world as well as a man of forty; the point is that he navigates it at all. There is a specific dignity in accepting the blindness without accepting the helplessness. He doesn't want us to pity the dog, or him. He wants us to understand that the will can steer the vessel even when the rigging is frayed.

  The third charge is that old age deprives us of physical pleasures.
  The argument goes that you can no longer enjoy the feasts, the travel, the sensory indulgences of youth. The standard response is to say, "Good riddance." But in my grandfather's case, it's simpler: he never wanted those things much to begin with. He isn't deprived of the party; he never wanted to go to the party. He would rather win a crossword clue that has stumped him for three days. If old age is a deprivation, it is only of the things he considers distractions. He hasn't lost his taste for pleasure; he has simply refined it down to the things that don't require good knees or good light.

  The fourth charge is the heavy one. That old age is not far from death.
  This is usually where the old argument turns to the immortality of the soul to comfort the listener. But we know my grandfather. He is a cheerful agnostic. He expects nothing. To offer him a pious promise of heaven would be an insult, and frankly, a lie.
  But the old argument offers a fork, not just a promise. It says death is one of two things. Either it is a dreamless sleep, from which there is no waking—which is not a bad thing, given how tired one can get at eighty-five. Or, it is a passage to something else.
  He doesn't claim to know which it is. But he accepts the logic that if the first is true, there is no pain. And if the second is true, well, he'll be interested to see the evidence. That is not a hedge. That is an honest accounting of the ledger.

  However, there is a postscript to that old argument that is crucial. It states that old age only commands respect if the character behind it deserves it. It warns that if you are peevish and difficult when young, you will only become more so when old.
  This is the part where I am supposed to smooth him over. I won't.
  He is difficult. He holds grudges. There are people in this room, I suspect, who are still not speaking to him because of a curriculum meeting in 1979. He is competitive in ways that are exhausting. He does not suffer fools, and he does not pretend to.
  Some might say this proves the argument wrong—that his temper has worsened with time. But I would argue the opposite. He hasn't become difficult because he is old; he has remained difficult because he is consistent. He has not softened into a sweet, compliant dotard for our comfort. He has not traded his intellect for agreeableness.
  We love him not despite the grit, but because of it. A smooth stone is easy to hold, but it tells you nothing about the river. He tells us everything about the river.

  So, here we are. Eighty-five.
  Not a new sixty. Not a decline. But a culmination.
  He has answered the four charges. He is active. He is adapted. He is satisfied. And he is unafraid.
  And he is exactly who he has always been.

  I'd like to propose a toast. Not to his health, because that's a lottery. Not to his happiness, because that's too soft.
  I'd like to toast his integrity. To eighty-five years of refusing to be anything other than himself.

  To Grandfather.
