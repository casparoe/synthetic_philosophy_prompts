prompt: |-
  My grandfather turns eighty-five next month, and I've somehow ended up giving the main speech at his birthday dinner. He was a classics don for over forty years and the one thing he can't abide — he will literally get up and leave the room — is the modern liturgy of ageing well: "eighty-five is the new sixty," "young at heart," staying curious as if curiosity were an anti-ageing cream. He thinks all of it is a refusal to actually defend old age on its own terms, and he's said as much, at other people's parties, after a sherry. The book he's read more times than any other is Cicero's essay on old age, the one where Cato explains to the two young men why the four usual accusations against old age don't hold, and I'd like the speech to be built on that skeleton — the four charges, answered one by one through my grandfather's actual life (he still referees papers, he's on his third guide dog after going half-blind, he never wanted the pleasures he's supposedly been deprived of) rather than through quotation or name-dropping.

  The tricky bits. The audience is mixed: maybe a dozen former colleagues who have all taught the essay and will notice if I get the structure wrong or put words in Cicero's mouth, and then the family, who mostly want to laugh and cry a bit. And there's one honest problem, which is that Cato leans fairly hard on the immortality of the soul at the very end, when he takes up the fear of death — and my grandfather is a cheerful agnostic who has told me more than once that he expects nothing, and would find a pious ending to his own birthday speech a betrayal. Cicero, as I recall, is careful enough to leave himself an exit there (something about death either being a dreamless sleep, which isn't bad, or a passage to something better) and I want that honest fork, not a hedge. Also — and this is the part I keep failing at — my grandfather is genuinely difficult. Grumpy, competitive at crosswords, holds grudges about a departmental meeting in 1979. Cicero is big on old age only deserving respect when the character deserves it, and faults getting worse with age unless you fight them, so the speech can't sand him off into a saint either. It has to make the case for him while admitting the case against him, if that makes sense. Aim for something I can deliver in about six or seven minutes, written so that the classicists catch the architecture and my mum catches the man.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** 85th Birthday Dinner for Grandfather.
      *   **Speaker:** Grandchild.
      *   **Honoree:** Former Classics Don (40+ years), Cheerful Agnostic, Grumpy/Difficult/Competitive, Loves Cicero's *De Senectute* (Cato on Old Age).
      *   **Constraint 1 (The Pet Peeve):** No "85 is the new 60" rhetoric. No "young at heart." Defend old age *on its own terms*.
      *   **Constraint 2 (The Structure):** Must follow Cicero's *De Senectute* structure (The Four Charges against Old Age) without explicit name-dropping or quoting Latin.
      *   **Constraint 3 (The Content):** Use specific biographical details (refereeing papers, third guide dog/half-blind, never wanted deprived pleasures, grumpy/competitive).
      *   **Constraint 4 (The Audience):** Mixed. Classics colleagues (need accurate structure/philosophy) + Family (need emotion/humor).
      *   **Constraint 5 (The Ending):** Must address death honestly. No pious immortality claims (he's an agnostic). Use Cicero's "fork" (sleep vs. transition) without betraying his worldview.
      *   **Constraint 6 (The Tone):** Cannot sanitize him. Acknowledge his difficulties (grudges, grumpiness) as part of the argument (character matters).
      *   **Length:** 6-7 minutes spoken (approx. 900-1100 words).

  2.  **Deconstruct Cicero's *De Senectute* (The Four Charges):**
      *   *Charge 1:* Old age withdraws us from active employments (It makes us useless).
      *   *Charge 2:* Old age enfeebles the body (Physical decline).
      *   *Charge 3:* Old age deprives us of physical pleasures (Sensory loss).
      *   *Charge 4:* Old age is not far from death (Fear of dying).
      *   *Cato's Conclusion:* The soul is immortal. (Needs modification for the agnostic grandfather).
      *   *Cato's Caveat:* Old age is only honorable if the character was honorable to begin with. (Needs to be included to address his grumpiness).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the elephant in the room. No "new 60" talk. State the thesis: We are here to celebrate 85 *as* 85. Mention the Cicero connection subtly (the "skeleton").
      *   **Charge 1 (Withdrawal from Activity):**
          *   *Cicero:* Old men retire from public life.
          *   *Grandfather:* He hasn't. He still referees papers. He's still working.
          *   *Tone:* Respect for his continued contribution, but acknowledging he does it on his own terms.
      *   **Charge 2 (Physical Frailty):**
          *   *Cicero:* Bodies get weak.
          *   *Grandfather:* He's half-blind. Third guide dog.
          *   *Spin:* It's not about pretending the body is young; it's about the will navigating the broken vessel. The dog isn't a prop; it's a necessity he accepts.
      *   **Charge 3 (Loss of Pleasure):**
          *   *Cicero:* No more feasts/lust. Good riddance.
          *   *Grandfather:* He never wanted those things anyway. He prefers crosswords and arguments.
          *   *Tone:* Humorous. He's not deprived; he's selective.
      *   **Charge 4 (Proximity to Death):**
          *   *Cicero:* It's near, so what?
          *   *Grandfather:* Agnostic.
          *   *Resolution:* Use the Epicurean/Ciceronian fork. Sleep or Transition. Both are fine. No heaven, just honesty.
      *   **The Caveat (Character):**
          *   *Cicero:* Only good men age well. Bad tempers get worse.
          *   *Grandfather:* He's grumpy. He holds grudges (1979 meeting).
          *   *Spin:* This isn't a flaw in old age; it's consistency. We love him *including* the grit. He hasn't softened, and we wouldn't want him to.
      *   **Conclusion:** Raise a glass. To 85.

  4.  **Refining the Voice:**
      *   Needs to sound like a grandchild who knows the material but isn't showing off.
      *   Needs to be warm but sharp (like the grandfather).
      *   Avoid Latin terms (like *De Senectute*) but keep the logic clear for the colleagues.
      *   *Self-Correction on Length:* A 7-minute speech is roughly 1000 words at a moderate pace. I need to ensure I don't ramble on the biographical details.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Did I mention Cicero?* The prompt says "without quotation or name-dropping." I should avoid saying "As Cicero said." Instead, I should say "There is an old argument..." or "The standard case against aging..." The colleagues will know.
      *   *Did I address the agnosticism?* Yes, the "dreamless sleep" option is key.
      *   *Did I include the grumpiness?* Yes, the 1979 grudges.

  6.  **Writing the Speech (incorporating the constraints):**

      *   *Opening:* Start with the rule. No "new 60."
      *   *Body Paragraphs:* Map the four charges directly to his life.
      *   *Charge 1:* Refereeing. He hasn't withdrawn.
      *   *Charge 2:* The eyes/the dog. He adapts, doesn't pretend.
      *   *Charge 3:* Pleasures. He likes crosswords, not parties.
      *   *Charge 4:* Death. The fork.
      *   *Character:* The grumpiness.
      *   *Closing:* The toast.

  7.  **Polishing:**
      *   *Check:* Is the Cicero structure clear enough for the dons?
          *   *Adjustment:* Make sure the transition between the four points is distinct. "First, they say..." "Second..."
      *   *Check:* Is the ending honest?
          *   *Adjustment:* Ensure I don't imply he *believes* in the soul, but that he accepts the *possibility* of the end without fear.
      *   *Check:* Is the grumpiness handled well?
          *   *Adjustment:* Frame it as integrity. He hasn't become "nice," he's remained *himself*.

  8.  **Final Review against constraints:**
      *   6-7 mins? (Word count looks good).
      *   No "young at heart"? (Checked).
      *   Cicero structure without name-dropping? (Checked).
      *   Agnostic ending? (Checked).
      *   Grumpy/Real? (Checked).

  **(Self-Correction during drafting):** I initially thought about explicitly mentioning Cato. But the prompt says "without quotation or name-dropping." I will allude to the "Roman argument" or "the old essay" so the colleagues nod, but the family just hears the logic. Actually, better to avoid naming Cato/Cicero entirely to strictly follow "without name-dropping," relying on the *structure* to signal the reference to the colleagues. The prompt says "built on that skeleton... rather than through quotation or name-dropping." Okay, I will not say "Cicero" or "Cato." I will let the four charges speak for themselves.

  *Wait, one nuance:* The prompt says "the classicists catch the architecture." If I don't mention the source at all, will they catch it? Yes, if I follow the four charges exactly in order. 1. Withdrawal from affairs. 2. Bodily weakness. 3. Deprivation of pleasure. 4. Proximity to death. I will make these transitions clear.

  *Let's write.*

  *(Word Count Check during drafting)*: Aiming for ~1000 words.
  *Tone Check:* Respectful but not sycophantic. Witty but not mean.

  *Final Polish on the Death Section:* Cicero offers: Death is either a dreamless sleep (good) or a migration to another place (also good). The grandfather is agnostic. So I must present the "migration" not as a religious certainty, but as a philosophical possibility he can tolerate, while emphasizing the "sleep" is equally fine. The prompt says "I want that honest fork, not a hedge." So I must present both options as acceptable without forcing the religious one.

  *Final Polish on the Grumpiness:* Cicero argues that bad temper gets worse with age if it was there to begin with. I need to flip this slightly or embrace it: His temper is part of his integrity. He hasn't softened into a dotard.

