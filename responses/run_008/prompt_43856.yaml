answer: |-
  The porch swing creaked. Marcus stirred his iced tea, the spoon clinking against the glass like a metronome for the argument they'd been having since grad school. On the table between them lay the manuscript, pages splayed open to Chapter One: *Age Eighty*.

  "You're doing it again," Sarah said, nodding at the pages. "You're writing her like she's a soul haunting a series of bodies."

  "I'm writing her like a person," Marcus countered. "Endurantist style. She is wholly present at eighty, and she was wholly present at eight. Same woman."

  "Same woman?" Sarah leaned forward. "Marcus, her cells have turned over twice. Her beliefs inverted. Her hometown is a highway. On my view, she's a four-dimensional worm. The eighty-year-old slice is a temporal part, just like your left hand is a spatial part. You wouldn't say your hand *is* you."

  "I would say my hand is *me*, just partially," Marcus said. "But look at the text. 'She changed her mind about God at 40.' Does that make literal sense on your view? If the 40-year-old slice is a different entity than the 41-year-old slice, who exactly changed their mind? You've got a static worm with different beliefs at different coordinates. Nothing *changed*. You've eliminated change."

  "Change is variation across time," Sarah said, swatting a mosquito. "Just like a road varies across space. It doesn't need to magic itself into a new state. You're the one with the contradiction. Say she breaks her nose Monday and it's straight Friday. You say she's wholly present both days. So she's bent and straight. Contradiction."

  "No," Marcus said, pointing the spoon. "She instantiates *bent-at-Monday* and *straight-at-Friday*. Time-indexed properties. Problem solved."

  "That's gerrymandering," Sarah laughed. "You're turning relations into properties to save the substance. It's ad hoc. And don't get me started on vagueness. When does the Ship of Theseus version of her stop being her? If you swap out every memory and cell, your 'wholly present' object is held together by what? Magic dust?"

  "Primitive identity," Marcus said firmly. "It's not magic, it's the baseline of experience. But you—can you even say 'she was afraid of the dark'? On your view, only the current slice exists now. The childhood slice is gone. So when you say 'she was afraid,' you're talking about a counterpart. A dead stranger."

  "I'm talking about a past temporal part of the same worm," Sarah corrected. "It's no different than saying 'she was in Chicago.' You don't think the Chicago-slice is here now, do you? But it's still her worm."

  "It feels like a evasion," Marcus said. "If only the stage exists, then commitment is impossible. Why care about the future slice? It's not *you*."

  "Because they're causally connected," Sarah said. "Look, let's talk about the book. If I'm right, your narration is a lie. Chapter One (Eighty) and Chapter Last (Eight) shouldn't share a voice. They're different slices sharing a name. You should lean into the fragmentation. Let the syntax break down as she gets younger. Show the worm tapering."

  "And if I do that," Marcus said, "I lose the tragedy. The point is that she *remembers*. That the eighty-year-old owns the eight-year-old's fear. If they're just distinct slices linked by causality, there's no guilt, no redemption. Just physics."

  Sarah paused, picking up her tea. She looked out at the overgrown garden. "Okay. I'll concede the phenomenology. It *feels* like endurance. When I remember being ten, I don't feel like I'm accessing a database entry of a counterpart. I feel like I was there. Your view captures the first-person experience better. Mine makes it sound like reading a biography of someone else."

  Marcus nodded slowly. "And I'll concede the vagueness point. The Ship of Theseus problem... it keeps me up. If her hometown is bulldozed and her beliefs invert, insisting on a strict numerical identity between eighty and eight does require a leap. Maybe 'she' is a convenient fiction for a chain of events."

  "So," Sarah said, tapping the manuscript. "How do you write it?"

  "One voice," Marcus said. "Because that's how it hurts. But..." He hesitated. "I'll let the certainty waver. Let her question if she's the same person who made those mistakes. Let the worm show through the skin."

  "Acceptable," Sarah said. "But if you use time-indexed properties to explain away her contradictions, I'm throwing this book across the porch."

  "Deal." Marcus picked up his pen. "Now, about this chapter where she meets God..."

  "Don't start," Sarah groaned, but she was smiling. "Just write the damn worm."
