      *   *Public Promotion:* High complicity. Forbidden while the artist is living and the wound is fresh.
      *   *Death:* Changes the financial equation, but not immediately the social equation (hence the no-laugh). She needs time to decouple the art from the person in her own mind, not just in the bank account.

