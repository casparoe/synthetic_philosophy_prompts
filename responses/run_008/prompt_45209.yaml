  3.  **Analyze the Competing Rules:**
      *   *Rule A (Harm/Reward):* Focuses on whether the artist benefits materially or reputationally from the engagement. If the artist is dead, they can't benefit, so art is separable. If alive, engagement supports them.
      *   *Rule B (Badness/Certainty):* Focuses on the severity and legal/social status of the wrongdoing. If it's "settled" (dead/convicted), maybe different rules apply vs. "accused." Or perhaps it's about the *social cost* of engaging.

  4.  **Evaluate the "Death Joke" Data Point:**
      *   *Scenario:* Musician (convicted, living) dies. Joke: She'll play records next morning. Reaction: No laugh.
      *   *Interpretation under Rule A (Harm/Reward):* If the rule is purely "don't let them profit," death solves the problem. She *should* laugh or agree, because the financial/moral hazard is gone. Her *not* laughing suggests Rule A is insufficient. It implies an emotional or moral barrier remains even after death.
      *   *Interpretation under Rule B (Badness/Certainty + Social Signaling):* Her silence suggests the issue isn't just money. It's about *her* relationship to the art and what engaging with it signals about *her* values. Even if he's dead, engaging might feel like condoning the act too soon, or it might feel disrespectful to victims. Or, it suggests a "Cooling Off" period.
