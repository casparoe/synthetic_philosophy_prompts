  5.  **Synthesize the "Maya Algorithm":**
      *   It's not just "Dead = OK, Alive = No." (Caravaggio/Wagner = OK. Musician/Novelist = Complicated).
      *   It's not just "Money." (She admitted the song was great at a party. She teaches the novel).
      *   It *is* about **Active Endorsement vs. Passive Appreciation**.
      *   *Passive/Private:* She can acknowledge quality (party song, teaching the novel, looking at Caravaggio).
      *   *Active/Public/Financial:* She withdraws support when the artist is living and the harm is active/recent (deleting albums, declining ticket, library only).
      *   *The Death Joke:* This is the key. If it were just money, death fixes it. Her silence implies that *her own comfort* and *social signaling* matter too. She needs distance. Death doesn't instantly scrub the moral stain for *her*, even if it stops the profit.

  6.  **Apply to the Poet Case:**
      *   *Status:* Living, In Prison (Convicted). Similar to Musician.
      *   *Action 1: Read it herself?* Yes. Like the party song or teaching the novel, she separates aesthetic judgment privately. Library = No money to poet.
      *   *Action 2: Nominate for Book Club?* No. This is active endorsement. It requires "championing" it. It puts her social capital behind the work. It forces the group to grapple with the ethics. Like declining the ticket.
