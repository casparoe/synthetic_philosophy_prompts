answer: |-
  This is a fascinating profile because Maya isn't actually inconsistent; she is operating on a much more sophisticated algorithm than her slogan ("judge the work, not the person") suggests. Her slogan is the *ideal*, but her behavior reveals the *protocol*.

  You are right that there are two competing rules that fit most of her data, but the "Death Joke" data point is the key that breaks the tie.

  ### The Two Competing Rules

  1.  **The Material Harm Rule:** This rule posits that Maya's boycott is purely transactional. She separates art from artist unless engaging with the art provides the artist with money, status, or leverage *right now*. Under this rule, death solves everything because dead people don't earn royalties or gain social capital.
  2.  **The Social Complicity Rule:** This rule posits that Maya is managing her *own* moral footprint. It's not just about whether the artist gets paid; it's about whether *her* engagement signals endorsement, minimizes the victim's suffering, or makes her an active participant in the artist's rehabilitation. Under this rule, death helps, but it doesn't instantly scrub the moral stain.

  ### The "Death Joke" Decider

  The moment someone joked that she'd play the convicted musician's records the morning after he died, and she **didn't laugh**, is the smoking gun.

  If she were running the **Material Harm Rule**, she should have laughed or agreed. If the only barrier was sending money to a criminal, death removes the barrier. The royalties would go to an estate or heirs, not the criminal. The joke implies a "clean slate" upon death. Her silence indicates that for her, the barrier isn't just financial; it's emotional and social. She knows that even if he's dead, playing his music immediately feels like a betrayal of the victims or a premature forgiveness. It signals that *she* is ready to move on, even if the harm hasn't aged.

  Therefore, she is running the **Social Complicity Rule**.

  ### The Underlying Pattern: "Passive Judgment vs. Active Patronage"

  Maya distinguishes between **Private/Critical Engagement** (allowed) and **Public/Active Patronage** (restricted).

  *   **Private/Critical:** Listening at a party, teaching a text in a classroom, looking at a painting in a museum. Here, she is analyzing the object. She can admit quality without empowering the creator.
  *   **Public/Active:** Buying an album, attending a concert, nominating a book for a club. Here, she is using her social capital to amplify the work. This requires a moral clearance she reserves for the dead or the distant past.

  ### The Verdict on the Poet

  Based on the Social Complicity Rule, here is how she rules on the imprisoned poet:

  **1. Will she read it?**
  **Yes.**
  Like the song at the party or the novel in her seminar, she separates the aesthetic object from the creator in private. As long as she gets it from the library (no financial flow to the poet or his estate), she allows herself to judge the work on its merits. She believes "the man being terrible and the work being sublime are both true at once," and she trusts her own ability to hold that tension privately.

  **2. Will she put it up for the book club?**
  **No.**
  This is the critical distinction. Nominating a book for a group isn't just reading; it is **championing**. It requires her to advocate for the work's value to others. It forces her friends to grapple with the ethical dilemma she has already solved for herself. Because the poet is living (even in prison) and the conviction is fresh, nominating the book would feel like an act of rehabilitation. It signals that the art is "worth the trouble." She declined the free concert ticket for this exact reason: even if it cost her nothing, her *presence* was a form of endorsement.

  **3. In ten years, would she call it one of the decade's best?**
  **Yes.**
  Time is the solvent for the Social Complicity Rule. Look at her relationship with Wagner and Caravaggio. Once enough time has passed, the "active harm" of endorsement fades. The artist is no longer being rehabilitated by her praise; they are historical. She will likely say, "It is a masterpiece, though obviously, we have to contend with who wrote it." She will treat it like the Wagner operas: terrible man, sublime music, both true.

  ### Summary of the Rule

  Maya's rule is not "Judge the work, not the person."
  Her rule is: **"Judge the work privately; withhold public patronage until the artist can no longer be rehabilitated by your praise."**

  *   **Alive + Fresh Wound:** Private appreciation only. No money, no amplification. (The Musician, The Poet).
  *   **Alive + Old Wound / Academic Context:** Critical engagement allowed, financial support withheld. (The Novelist).
  *   **Dead + Time Passed:** Full separation. The work belongs to history, not the person. (Caravaggio, Wagner, The Poet in 10 Years).

  The reason she didn't laugh at the death joke is that she knows **death does not equal time.** You can die today, and tomorrow you are still a "recently deceased criminal." It takes years for the art to detach from the biography in the public consciousness. She won't play the records the next morning, but she might play them in five years. She won't nominate the poet now, but she will cite the poem in a decade.
