  10. **Final Polish:** Ensure the distinction between "Material Harm" and "Social Complicity" is sharp. The "No Laugh" moment is the smoking gun that proves it's not just about the artist's bank account. It's about *her* relationship to the moral stain.

      *(Self-Correction during drafting)*: Wait, look closely at the Novelist case. She teaches the novel. That's public. But she says "get it from the library." So she separates *pedagogical value* from *financial support*. Book club nomination is closer to *pedagogy* than *concert ticket*? No, nomination is "championing." Teaching is "analyzing." There's a difference. Teaching is critical distance. Book club nomination is endorsement. I need to make sure that distinction is clear.
      *   *Teaching:* "This is a masterpiece, but look at it critically."
