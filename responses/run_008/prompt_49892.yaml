answer: |-
  This is a properly fascinating epistemic puzzle. Your housemate is drawing distinctions that philosophers of aesthetics have argued over for decades, specifically regarding the 'Acquaintance Principle'—the idea that aesthetic judgments must be based on first-hand experience. However, her behaviour isn't consistent enough for a blanket rule; she's carving reality up quite specifically.

  Here are the three candidate rules that best fit her track record, what each predicts for the symphony, my best guess, and the case that would settle the matter.

  ### Candidate Rules

  **1. The 'High Art' Acquaintance Rule**
  This rule posits that direct experience is mandatory for 'canonical' or 'contemplative' art forms (Literature, Architecture, Classical Music), but testimony suffices for 'consumables' or 'entertainment' (Wine, Food, Comedy, Film).
  *   **Logic:** She treats novels and buildings as requiring personal contemplation to validate aesthetic claims ("beautifully written", "elegant"), whereas wine, meals, and stand-up are treated as experiential consumables where a trusted report of the effect ("flabby", "hilarious") is sufficient fact.
  *   **Prediction for the Symphony:** She will say she **cannot know it is sublime**. She treats the symphony like the novel and the building, not the stand-up or the wine. She will likely agree it is *worth hearing*, but she will refuse to adopt the aesthetic judgment itself as her own knowledge.

  **2. The 'Thick vs. Thin' Concept Rule**
  This rule suggests she accepts testimony for 'thick' concepts (terms that mix description and evaluation) or pragmatic recommendations, but rejects it for 'thin', purely evaluative terms.
  *   **Logic:** "Over-oaked" is technical/descriptive. "Hilarious" implies a specific physical reaction (laughter). "Worth seeing" is pragmatic advice. However, "beautifully written", "elegant", and "sublime" are purely evaluative judgments of quality that she feels cannot be transmitted verbally.
  *   **Prediction for the Symphony:** She will say she **cannot know it is sublime**. "Sublime" is a quintessential thin evaluative concept. She might accept "the pacing is slow" (descriptive) or "it's worth going" (pragmatic), but not the value judgment itself.

  **3. The 'Sensory Immediacy' Rule**
  This rule argues that testimony works when the experience is visceral and immediate (Taste, Humour), but fails when the experience requires cognitive processing or structural appreciation over time.
  *   **Logic:** Wine and comedy hit you immediately; you either taste the oak or you laugh. Novels, buildings, and symphonies require you to hold structure in your mind over time to appreciate their elegance or beauty. You cannot vicariously process a structure.
  *   **Prediction for the Symphony:** She will say she **cannot know it is sublime**. Music is temporal and structural, like reading a book, not immediate like tasting wine or hearing a punchline.

  ### The Verdict on the Symphony

  Under all three plausible rules, the prediction is the same: **She will insist she can only know it is *worth hearing*, not that it is *sublime*.**

  She will likely say something like, "If Sarah says it's sublime, I'm sure I'll love it, but I can't call it sublime until I've heard the adagio myself." This aligns with her architecture stance (the critic can know, I cannot) and her novel stance (even a trusted friend isn't enough for 'beautifully written').

  ### My Best Guess

  I reckon the **'High Art' Acquaintance Rule** is the closest to her actual thinking, perhaps blended with the **Thick/Thin** distinction.

  She seems to grant herself permission to outsource judgments on things she views as 'functional' or 'recreational' (dining, drinking, laughing), but she guards her judgments on 'Art' with a capital A. The fact that she accepts the critic *knows* the building is elegant (Architecture case) but won't claim that knowledge herself shows she believes the knowledge *exists* in the expert, but testimony is epistemically insufficient for *her* to claim it for high-art categories. The symphony falls squarely into this high-art bucket.

  ### The 'Splitter' Case

  To truly distinguish between these rules, you need a case that isolates **Sensory Immediacy** from **Artistic Status**. The perfect test is **Perfume**.

  **The Case:** Her trusted friend (matching taste) smells a perfume and says, "This scent is **beautiful**."

  *   **Why it splits the rules:**
      *   **If she accepts it** (says she now knows it's beautiful): This supports the **Sensory Immediacy Rule**. Perfume is sensory like wine (which she accepts), suggesting the medium matters more than the evaluative term. It would imply she rejects the novel/symphony claims because they are cognitive, not because "beautiful" is untouchable.
      *   **If she rejects it** (says she must smell it to know it's beautiful): This supports the **Thick/Thin Rule** or the **High Art Rule**. It suggests that purely evaluative terms like "beautiful" require first-hand experience regardless of the sensory nature, or that she classifies perfume as an 'Art' requiring acquaintance.

  **A Secondary Splitter (The Stranger):**
  If you want to test the **Trust** variable versus the **Principle** variable: A total stranger (whose past ratings match hers perfectly) says a novel is "beautifully written."
  *   If she still rejects it: It confirms the barrier is **Epistemic/Principled** (Acquaintance Principle), not relational.
  *   If she accepts it: It suggests her rejection of the friend's novel claim was actually about **intimacy** (perhaps she resists her friend's influence on her identity), which would upend the aesthetic analysis entirely.

  However, given her architecture comment (admitting the critic knows), I suspect the **Perfume** case is the stronger splitter. If she treats perfume like wine, she's a sensory empiricist. If she treats it like a novel, she's an aesthetic purist. My money is on the purist; she'll likely insist on smelling it herself before calling it beautiful.
