answer: |-
  # DIAGNOSTIC: THE ABSENT-MINDFUL DRIVER

  **Preamble:** You accept the payoff structure (Exit 1: 0, Exit 2: 4, Continue: 1) and the constraint that the driver cannot distinguish the intersections. He must adopt a mixed strategy (continue with probability $p$). The *ex ante* optimal plan is $p=2/3$. The dilemma arises at the intersection: does the driver follow the plan or deviate?

  **Instructions:** Answer the following questions based on your immediate theoretical instincts. Do not worry about where the branches lead.

  ***

  ### 1. SELF-LOCATING BELIEF
  **Finding yourself at an intersection, is there a well-defined, non-trivial probability that you are at the first exit rather than the second?**
  *   **NO:** Go to **Question 3**.
  *   **YES:** Go to **Question 2**.

  ### 2. EVIDENTIAL CORRELATION
  **Does your current inclination to continue provide *evidence* about what you did (or will do) at the other intersection, or is it merely a *cause* of your current outcome?**
  *   **EVIDENCE:** (Your choice correlates with your other self's choice).
      *   $\rightarrow$ **Leaf A: Evidentialist Treatment**
      *   *The Bullet:* You must accept that choosing to continue makes it objectively more likely that you continued at the previous exit.
  *   **CAUSE:** (Your choice is independent of the other intersection).
      *   $\rightarrow$ Go to **Question 3**.

  ### 3. RATIONAL AUTHORITY
  **Does the plan chosen before setting out have rational authority over you now, or must each temporal stage justify its own action?**
  *   **PLAN AUTHORITY:** (The *ex ante* optimum binds you).
      *   $\rightarrow$ **Leaf B: Planning / Ex Ante Optimisation**
      *   *The Bullet:* You must act against your current best estimate of immediate gain to honour a past commitment you cannot remember making.
      *   *(Note: If you reached here via Q1=NO, you are close to Piccione & Rubinstein's original formulation.)*
  *   **STAGE JUSTIFICATION:** (The current self decides).
      *   $\rightarrow$ Go to **Question 4**.

  ### 4. SYMMETRY CONSTRAINT
  **Is any advice we give the driver required to be the same at both intersections simply because they look identical?**
  *   **YES:** (Symmetry is enforced by the problem description).
      *   $\rightarrow$ **Leaf C: Sophisticated / Multi-Selves Approach**
      *   *The Bullet:* You must accept the driver rationally abandons the *ex ante* optimum (payoff 4/3) for a lower payoff (1) to remain time-consistent.
  *   **NO:** (Strategies could in principle differ via internal states).
      *   $\rightarrow$ **Leaf D: Updateless / Policy-First**
      *   *The Bullet:* You must posit that the driver can select a global policy without relying on a binding commitment or distinguishing information.

  ***

  ### DIAGNOSTIC NOTES FOR TUTORIAL USE

  **Empty/Incoherent Nodes:**
  *   **Q1=YES, Q2=EVIDENCE, Q3=STAGE:** This combination is **unstable**. If your choice is evidence of the other, you are already evaluating the policy, not the stage. Students here often slide into Leaf A or B upon reflection.
  *   **Q1=NO, Q3=STAGE:** This leads to **Leaf E: Sceptical / Ill-Posed**.
      *   *The Bullet:* You must conclude the problem shows the notion of an optimal strategy needs reformulating, as no rational action is definable at the node.

  **Indistinguishable Leaves:**
  *   **Leaf B (Planning) vs. Leaf D (Updateless):** This tree cannot genuinely separate these views. Both prescribe $p=2/3$ and prioritise the policy over the local action. The distinction is metaphysical (whether the agent is *bound* by the plan or *is* the plan) rather than practical. Do not expect students to separate these without metaphysical prompting.

  **Unexplored Combinations:**
  *   **Q1=YES, Q2=CAUSE, Q3=PLAN, Q4=NO:** This view is **merely unattractive**. It asserts plan authority but denies symmetry without evidential links. It lacks a clear mechanism for how the plan is enforced without commitment.

  ***
  *Handout prepared for Graduate Seminar in Decision Theory. No external references required.*
