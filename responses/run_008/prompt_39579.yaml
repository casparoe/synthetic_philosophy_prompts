      *   *Welfare Gap:* Even if Pleasure = Functional Role R, why is instantiating R good? Phenomenal hedonists say "because it feels good." Attitudinalists say "because pro-attitudes are good." Functionalists need a story. "Because it signals biological fitness"? That's evolutionary ethics, not necessarily welfare.

