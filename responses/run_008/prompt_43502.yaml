answer: |-
  This is a genuinely profound dispute. It touches upon the very architecture of representative government, echoing debates from the Athenian polis to the Federalist Papers. You and your roommate are not merely arguing about policy tweaks; you are arguing about the ontology of political power.

  Before committing to a judgement, let us lay out the mechanics of the problem as you have both identified it. The core pathology is the "permanent apparatus"—the lobbyists, the senior civil servants, the party donors, and the consultants. In political science, we often call this the "iron triangle" or the "deep state" (though I prefer the more neutral "bureaucratic continuum").

  Here is my analysis of your respective positions, followed by my judgement.

  ### 1. The Expertise and Entrenchment Asymmetry

  You have both correctly identified that the struggle is not between the politician and the voter, but between the temporary officeholder and the permanent state. The question is: how does each proposal manage this asymmetry?

  **Your position (Term Limits)** treats the asymmetry as a containment problem. You accept that the bureaucracy is entrenched, but you argue that by forcing rapid turnover of the "masters," you prevent any single politician from becoming cosy with the apparatus. The logic is that a legislator on their way out has less incentive to collude with lobbyists for future gain (since they cannot return) and brings fresh eyes that might spot inefficiencies the bureaucrats have hidden. You are betting on the power of the "outsider" perspective.

  **Your roommate's position (Sortition)** treats the asymmetry as a vulnerability problem. He argues that the career politician is *vulnerable* to the apparatus because he needs something the apparatus controls: re-election. To get re-elected, he needs money (donors), positive coverage (media), and policy wins (bureaucrats). A randomly selected citizen, however, does not need to be re-elected. They are not beholden to donors because they did not spend money to get in. They are not beholden to party whips because they do not need the party's endorsement for a future campaign.

  **The Crucial Difference:**
  Term limits attempt to fight the permanent apparatus by rotating the *personnel* of the elected branch faster than the bureaucracy. It is a race against time.
  Sortition attempts to fight the permanent apparatus by removing the *levers* the bureaucracy uses to control the politician. It is a structural decoupling.

  Your roommate's critique of term limits is empirically strong here. In American states where term limits were introduced, studies often showed that power did not return to the people; it shifted to lobbyists and legislative staff. Why? Because the legislators became *more* dependent on them. If I only have two years to learn a complex portfolio before I am term-limited out, I cannot afford to ignore the lobbyist who has been studying this issue for twenty years. I am forced to outsource my thinking to the permanent apparatus. Term limits, paradoxically, can increase the asymmetry you fear.

  ### 2. Time vs. Selection: Diagnosing the Disease

  This is the theoretical heart of your disagreement.

  **Your view:** The disease is *duration*. Power corrupts over time. A person might enter with good intentions, but the seduction of perks, power, and status eventually turns them into a careerist. Therefore, you must cut the tenure short.

  **His view:** The disease is the *filter*. The electoral system itself selects for a specific personality type: the ambitious, the fund-raising, the self-promoting. By the time someone wins a seat, they are already a "career politician" in mindset, even if it is their first day. The lottery selects for *ordinariness*, not ambition.

  **Which is closer to the root?**
  I argue that your roommate is closer to the root.

  Consider your proposal: a single term, no exceptions. This removes the *re-election* incentive, which is good. However, it retains the *election* incentive. To win that single term, a candidate must still campaign. They must still raise funds (unless publicly funded), curry favour with party selectors, and make promises to interest groups to secure the nomination. The "careerist" instinct—the desire to climb the ladder—is what gets them through the door in the first place.

  Furthermore, if a politician knows they have only one term, their "career" does not end; it merely pivots. They may use their single term to position themselves for a lucrative role in the very private sector or lobbying firm they were supposed to be regulating. This is the "revolving door" problem. Term limits can institutionalise the revolving door by making it the only exit.

  Sortition, by contrast, attacks the ambition itself. You cannot campaign for a lottery. You cannot donate to your own random selection. It removes the *volition* from the office. If the disease is "careerism"—the treatment of public office as a vocation for personal advancement—then selecting people who did not seek the office is the only way to ensure they are not careerists by definition.

  Time is a secondary variable. A careerist in a four-year term will act like a careerist. A non-careerist in an eight-year term (as you fear with sortition) is less likely to develop the same instincts *if* the mechanism for advancement is removed. However, your worry about sortition is valid: if the term is too long, the random citizen *becomes* a professional. But that is a design flaw of sortition, not a fundamental flaw of the principle. Term limits, conversely, have a fundamental flaw: they keep the electoral filter that breeds the careerist.

  ### 3. The Judgement

  If I must choose one as the superior fix for the specific problem of the "career politician" and the entrenchment of the permanent apparatus, I side with **your roommate: Sortition.**

  Here is the argument for why Sortition is the more robust institutional remedy:

  1.  **Independence from Capital:** The single greatest lever the "permanent apparatus" has over elected officials is the need for campaign finance. A sortition legislature requires no fundraising. This instantly neuters the influence of donors and the lobbyists who represent them. Term limits do not solve this; a one-term candidate still needs money to win the term.
  2.  **Descriptive Representation:** Career politicians tend to converge towards a socio-economic elite (lawyers, business owners, party staffers). Sortition creates a legislature that statistically mirrors the population. This brings "lived expertise" into the room, which counters the "technical expertise" of the bureaucracy. A single mother on a housing committee may know more about the failure of housing policy than a career politician who has not rented a flat in twenty years.
  3.  **The End of Signalling:** Career politicians spend vast amounts of time "signalling" virtue to their base to secure re-election. This creates polarisation and performative legislation. A randomly selected body has no base to signal to. They can focus on deliberation and problem-solving without an eye on the next news cycle.

  **The Strongest Honest Concession:**
  However, I must make a significant concession to your position regarding **accountability and competence.**

  The greatest weakness of sortition is that it severs the link of authorisation. In an election, even a flawed one, the voter can throw the rascal out. There is a mechanism for recourse. If a sortition legislature makes a catastrophic error, or becomes lethargic, the public has no way to remove them before their term ends. You are trading *ambition* for *apathy*.

  Furthermore, while sortition removes the *financial* dependency on the apparatus, it does not remove the *informational* dependency. A random citizen is still overwhelmed by complex briefings. Without the party discipline that elections enforce (which, for all its faults, organises governance), a sortition chamber risks becoming paralysed or, as you noted, captured by the clerks and advisors who write the bills.

  **Final Verdict:**
  Your proposal (Term Limits) is a palliative care measure. It treats the symptoms of entrenchment but leaves the underlying infection (the electoral ambition and fundraising model) untouched. It often worsens the power of the bureaucracy by making legislators more dependent on institutional memory.

  Your roommate's proposal (Sortition) is a curative measure. It changes the DNA of the legislature. While it carries risks of incompetence and lacks a direct accountability mechanism, it is the only proposal that genuinely dismantles the "career" in "career politician." By removing the possibility of a political career, you ensure that the people governing are, by necessity, citizens first.

  If the goal is to break the grip of the permanent apparatus, you cannot do it by rotating the masters. You must stop selecting masters altogether and return to the concept of the citizen-legislator. Sortition is the only mechanism that truly achieves this.
