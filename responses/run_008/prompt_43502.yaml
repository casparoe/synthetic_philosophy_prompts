prompt: |-
  So I keep getting into this argument with my roommate about career politicians and I want you to actually help me think it through instead of just cheering for my side. You're a political theorist who specialises in democratic institutions — please think carefully and maybe do a bit of brainstorming on paper before you commit to a position.

  The debate: his fix for career politicians is sortition — filling the legislature by random draw like jury duty, instead of elections. Mine is strict term limits — say, everyone gets a single term and then they're out for good, no exceptions.

  His main knock on term limits is that single-term legislators would be clueless and at the total mercy of the permanent machine around them — staff, lobbyists, agency bureaucrats — the people who actually know where the bodies are buried and will still be there long after the legislator is gone. My knock on sortition is that if the randomly selected people serve long terms, you've just reinvented career politicians on a delay: give them eight years and they'll develop the same self-serving instincts and sunk-cost mentality, except now with a halo of legitimacy from having been "chosen" (well, drawn).

  Here's what I want, and its not just "here are pros and cons":

  1. Compare the two proposals as attacks on the career politician problem. It struck me that both of our objections are actually about the same thing — an expertise/entrenchment asymmetry between the officeholder and the permanent apparatus around them — but the two proposals deal with that apparatus in opposite ways. Unpack that.
  2. More fundamentally, the two proposals seem to disagree about what the disease even is: term limits treat careerism as too much *time* in power, while sortition treats it as the wrong *selection filter* — elections screen for people who want to be career politicians, whereas a lottery doesn't. Which one is aimed closer at the root, and why?
  3. Then judge: if you had to defend one as the better fix, which is it, and what would the strongest honest concession to the other side be?

  Please write the whole answer in British English. And dont just tell me they could be combined — of course they could — actually pick and argue.
