answer: |-
  This is a classic and formidable argument, one that sits at the heart of the philosophy of history. Your friend has articulated a rigorous **constructivist nominalism**. It is logically valid *if* you accept her underlying metaphysics. However, it is not sound, because it relies on a hidden equivocation about what it means for something to be "real" and a category mistake about what historical constraints look like.

  Here is the diagnosis of the argument, the specific equivocation, and the path to a livable realism.

  ### 1. The Equivocation: "Real" and "Constraint"

  You suspected the word "invented" was slippery, but the real sleight of hand is in Premise (1) and Conclusion (5) regarding the word **"corresponds"** (and by extension, "real").

  *   **Meaning A (Mind-Independent Ontology):** To correspond to reality means to exist independently of human description, like a tectonic plate or a star. (This is the standard for *Natural Kinds*.)
  *   **Meaning B (Intersubjective Constraint):** To correspond to reality means to track patterns that exert causal pressure on agents and limit valid descriptions, even if those patterns require human cognition to be recognized. (This is the standard for *Social Kinds*.)

  Your friend's argument works by establishing that periods fail Meaning A (in steps 2 and 3) and then concluding in step (5) that they therefore fail Meaning B. She argues that because historians draw the lines, the lines don't track anything *in the past*.

  **The Equivocation:** She treats "drawn by historians" as mutually exclusive with "constrained by the past." This is false. A map is drawn by a cartographer, but it is constrained by the coastline. The fact that a cartographer chooses the projection (Mercator vs. Peters) does not mean the continent is a fiction.

  ### 2. Which Premise to Give Up

  You should attack **Premise (1)**.

  > *(1) A period label is a legitimate historical category only if it corresponds to something in the past that constrains how the label can be drawn — a discontinuity that is there to be found, so that some ways of carving are better than others.*

  You should keep the second half ("some ways of carving are better than others") but reject the first half's implication that the constraint must be a "discontinuity that is there to be found" in the sense of a clean break.

  **The Cost:** Giving up Premise (1) in its strong form costs you **Metaphysical Realism**. You must admit that the past does not come pre-sliced into "centuries" or "eras." There is no ontological "Renaissance" object floating in the ether of time. If you cling to the idea that the Renaissance exists *without us*, you are smuggling essentialism.

  However, this cost is bearable. You do not need metaphysical reality to have *causal* reality.

  ### 3. The Livable Alternative: Critical Realism

  Your friend offers you a "softened bullet": periods are real but stipulative. You asked what work "real" is doing there. Here is the answer: **Periods are "Institutional Facts" (to use John Searle's term) or "Interactive Kinds" (to use Ian Hacking's).**

  *   **Natural Kinds (Mountains):** Exist regardless of whether we name them.
  *   **Interactive Kinds (Recessions, Revolutions, Renaissances):** Come into existence *through* the naming and the recognition of patterns by agents.

  Your friend's "wrinkle"—that labels get into the causal stream—is actually the argument *for* this kind of realism, not against it. If people in 1600 believed they were living in a "New Age" and acted differently because of it, then the "New Age" is a causal force in the past. It is **real in its consequences**.

  **The Principled Constraint:**
  Periods are not "anything-goes" because they are constrained by **Causal Density**.
  While there are no clean "joints," there are clusters of causal interdependence. In 1480, the causal density of trade routes, theological disputes, and technological diffusion was different than in 1340. You cannot draw a boundary *anywhere* without losing explanatory power. If you define the "Renaissance" as lasting from 500 AD to 1900 AD, the label becomes useless because it fails to track the *variation* in causal density.

  Therefore, periods are **real heuristic devices that track causal densities.** They are not discoveries of joints, but they are not fictions; they are *adequations* to the grain of the past.

  ### 4. Answering the "Mountain" and "1480" Challenges

  **The Mountain Rebuttal:**
  Your friend claimed mountains aren't rearranged when a new department is hired. This is empirically false (geological surveys constantly redefine ranges based on new criteria), but more importantly, it misses the category difference.
  *   **Mountains** are constrained by gravity and geology.
  *   **Periods** are constrained by *human intentionality and causality*.
  The fact that historians rearrange periods is not proof of their falsity; it is proof that they are **tools**. A hammer is not "unreal" because a carpenter chooses to use it for a nail rather than a tent peg. The constraint on the historian is: *Does this periodization help explain the causal mechanisms at play?* If the "Renaissance" helps explain the shift in patronage and epistemology, it is valid. If it obscures the continuity of scholasticism, it is invalid. That is a constraint.

  **The 1480 Challenge:**
  You failed here because you looked for a *switch* (on/off). You need to look for a *gradient*.
  *   **The Reply:** "There is no fact about 1480 that makes it *the* boundary. But there are facts about 1480 that make it a *better* boundary than 1420 or 1550 for certain questions."
  *   **The Constraint:** The constraint is not a wall; it is a **cluster of probabilities**. The spread of printing, the consolidation of nation-states, and the shift in humanist networks create a *thickening* of certain causal pathways. To call 1480 "Medieval" isn't false, but it is *less adequate* to the causal density than calling it "Early Modern" if you are studying the history of information.
  *   **The Trap:** Your friend demands a necessary and sufficient condition for a period boundary. That is a logical demand that human history cannot meet. Reject the demand. History is fuzzy logic, not binary code.

  ### 5. Who Is Smuggling?

  **Your Friend is Smuggling:**
  She is smuggling **Positivist Ontology** into the Humanities. She assumes that for something to be "real," it must be mind-independent (like a rock). This is a metaphysical assumption, not a proven fact. By defining "real" as "mind-independent," she rigs the game so that anything involving human interpretation (which is *all* of history) comes out as "fiction." She is also smuggling **Determinism** in reverse: she assumes that because historians change their minds, the past didn't constrain them. But historians change their minds *because* new evidence constrains them.

  **You Are Smuggling:**
  You are smuggling **Essentialism**. You want the "Middle Ages" to be a thing that exists *out there* waiting to be found, like a continent. You want the boundary to be a cliff. When you can't find the cliff, you feel you've lost. You need to realize that the boundary is more like a time zone: arbitrary in its exact line, but necessary for coordinating the activity of the people within it.

  ### The Verdict

  **Give up Premise (1)'s demand for "joints."**
  **Keep Premise (1)'s demand for "constraint."**

  **The Revised Argument:**
  1.  A historical category is legitimate if it tracks **causal densities** in the past that constrain explanatory narratives.
  2.  "Middle Ages," "Renaissance," etc., were coined by later historians, *but* they gained traction because they tracked shifts in causal density (e.g., changes in text production, political organization).
  3.  Boundaries shift because causal density is gradient, not binary, and different historical questions highlight different densities.
  4.  This is true of periodization, but it does not make periods "fictions"; it makes them **functional kinds**.
  5.  Therefore, periods are real *as social and causal structures*, constituted by the interaction between past events and present description.

  **How to live with this:**
  Tell your friend: "You are right that the past is a seamless flow of matter and energy. But human history is not matter and energy; it is **meaning**. Meaning requires categories. The categories are not found in the rocks, but they are constrained by the rocks. The 'Renaissance' is not a thing in the past, it is a **pattern of resonance** between the past and us. If we stop using it, we lose the ability to explain why 1500 is different from 1300. That loss of explanatory power is the constraint. It's not a joint, it's a grain. You can cut against the grain, but the wood will splinter."

  She can keep her nominalism, but she must admit that **nominations have consequences.** If the "Scientific Revolution" is a fiction, it is a fiction that built the modern world. That makes it real enough for history.
