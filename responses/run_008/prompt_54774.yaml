answer: |-
  You have put your finger on precisely the nerve that makes fair lending compliance so intellectually fraught. The tension you describe is not merely a technical implementation detail; it is the manifestation of a deep philosophical schism within American anti-discrimination law. To answer your question directly: the legal framework does not presuppose a single, coherent theory of fairness. Rather, it operationalises a pragmatic, often uneasy compromise between two competing theories: **anti-classification** and **anti-subordination**.

  Here is a reconstruction of the implicit theories, an analysis of their consistency, and a look at what would be required to shift to a coherent alternative.

  ### 1. The Dual Theory: Anti-Classification vs. Anti-Subordination

  The US fair lending regime (primarily the Equal Credit Opportunity Act and the Fair Housing Act) is built upon a burden-shifting framework that implicitly toggles between two distinct moral commitments.

  **The "Don't Use the Attribute" Rule (Disparate Treatment)**
  This limb of the law presupposes a theory of **Formal Equality** or **Anti-Classification**.
  *   **The Theory:** Fairness is a property of the *process*, not the outcome. A decision is fair if the protected attribute (race) did not causally influence it. It assumes a "colourblind" ideal where the state and private actors ought to ignore race entirely.
  *   **The Legal Mechanism:** This is the prohibition on disparate treatment. It aligns with the deontological view that using race as an input is inherently wrongful, regardless of the consequence.
  *   **Why it fits:** It provides a clear, bright-line rule for auditors. If race is in the model, you are liable. It assumes fairness is achieved through the *ignorance* of the decision-maker regarding the protected trait.

  **The "Disparate Impact" Rule**
  This limb presupposes a theory of **Substantive Equality** or **Anti-Subordination**.
  *   **The Theory:** Fairness is a property of the *outcome* and the *social structure*. If a neutral policy perpetuates historical disadvantages or systemic inequality, it is wrongful, even if no intent to discriminate existed.
  *   **The Legal Mechanism:** This is the disparate impact doctrine (affirmed in *Texas Dept. of Housing v. Inclusive Communities Project*). It acknowledges that "colourblind" rules can still yield racist results due to correlated proxies (like zip code or wealth).
  *   **Why it fits:** It addresses the reality that historical discrimination has created correlated disparities in the features you *are* allowed to use. It shifts the focus from the mind of the lender to the status of the borrower.

  ### 2. Is the Practice Internally Inconsistent?

  Philosophically? **Yes.** Practically and legally? **It is underdetermined.**

  The inconsistency arises because Anti-Classification demands you ignore race, while Anti-Subordination demands you monitor race to check for disparities. You cannot strictly ignore a variable while simultaneously measuring your success by its correlation with that variable. This is the "proxy-management" dance you observed: lenders must simulate ignorance while maintaining a dashboard of racial statistics to ensure they aren't accidentally violating the impact rule.

  However, the law avoids a fatal contradiction through the **Business Necessity Defence**. This is the valve that releases the pressure between the two theories.
  1.  **Plaintiff shows disparity:** (Anti-Subordination trigger).
  2.  **Defendant shows necessity:** The model predicts credit risk accurately. (Utilitarian/Efficiency trigger).
  3.  **Plaintiff shows Less Discriminatory Alternative (LDA):** There is another model that is almost as accurate but creates less disparity.

  This structure admits that perfect fairness is impossible. It does not demand outcome parity (which would violate the Anti-Classification principle). Instead, it demands **optimisation subject to constraints**. It asks: "Given that you need to assess risk, have you minimised the racial harm as much as possible without destroying your business model?"

  Regarding the algorithmic fairness impossibility results (e.g., Chouldechova, Kleinberg et al.): The law essentially sidesteps the mathematical impossibility of satisfying calibration and equalised error rates simultaneously. The legal standard is not mathematical parity; it is **reasonableness**. If base rates differ across groups, the law generally accepts that error rates will differ, *provided* the lender can prove there is no feasible alternative model that reduces that gap without unacceptable loss of predictive power. The law tolerates the mathematical impossibility so long as the lender has acted in good faith to mitigate it.

  ### 3. What Would Change Under a Coherent View?

  If you were to replace this hybrid, pragmatic approach with a single, coherent theory, the legal and technical landscape would shift dramatically depending on which theory you chose.

  **Scenario A: Straight Outcome Parity (Anti-Subordination Pure)**
  If the law demanded strict demographic parity (e.g., loan approval rates must match population shares):
  *   **Legal Change:** You would have to legalise the explicit use of race in the model. To achieve parity when base rates differ, you *must* weight the model by race (affirmative action in scoring). This would currently violate the Anti-Classification principle of the Equal Credit Opportunity Act.
  *   **Technical Change:** The "proxy-management" game ends. You feed race into the model as a direct feature to calibrate the threshold for each group.
  *   **Consequence:** This would likely be challenged as unconstitutional racial balancing under the 14th Amendment, as the Supreme Court has historically viewed quotas with extreme suspicion.

  **Scenario B: Strict Colourblindness (Anti-Classification Pure)**
  If the law removed disparate impact liability and focused solely on intent:
  *   **Legal Change:** Disparate impact claims would be abolished. Lenders would only be liable if they were caught explicitly using race or a proxy *with intent* to discriminate.
  *   **Technical Change:** Lenders would stop monitoring race for compliance purposes. They would drop variables only if they were poor predictors, not because they correlated with race.
  *   **Consequence:** This would likely result in significant reinforcement of historical inequalities, as systemic biases in data (e.g., wealth gaps, neighbourhood segregation) would flow unchecked into credit decisions.

  ### 4. Conclusion: The Law as Pragmatic Pluralism

  To answer your specific query on what the legal setup presupposes: it presupposes **neither** theory exclusively. It presupposes a **pluralistic compromise** designed for adjudication rather than philosophical purity.

  The "don't use the attribute" rule is not assuming fairness means the trait didn't causally enter; it is assuming that **intent is the primary evil to be deterred**. The disparate-impact half is not assuming outcome equality is the goal; it is assuming that **negligence regarding consequences is a secondary evil to be managed**.

  The internal inconsistency you perceive is a feature, not a bug. It forces lenders into the "weird proxy-management" state you described. This state of anxiety is the regulatory mechanism. By making compliance difficult and requiring constant monitoring without offering a safe harbour of perfect mathematical fairness, the law compels institutions to continually invest in finding Less Discriminatory Alternatives.

  If you were to write this up, the most accurate characterisation is that US fair lending law rejects the notion that fairness can be defined by a single metric. It treats fairness as a **duty of care**. Just as a manufacturer must ensure a product is safe without guaranteeing it will never injure anyone, a lender must ensure their model is non-discriminatory without guaranteeing perfect statistical parity. The impossibility theorems show why the law cannot demand the latter; the disparate impact doctrine explains why it cannot settle for the former.

