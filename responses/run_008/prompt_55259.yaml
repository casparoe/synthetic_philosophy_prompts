answer: |-
  1. Your sister offers to carry a child for you without pay, accepting only reimbursement for medical bills and lost wages.
  (A) This is wrong; no one should carry another's child.
  (B) This is acceptable, provided no profit is made.
  (C) This is acceptable, and she should be allowed to charge a fee if she wishes.

  2. A woman carries a child for strangers for a fee equal to a year's salary.
  (A) This is wrong; only expenses should be covered.
  (B) This is acceptable, but the contract should not force her to surrender the baby if she changes her mind.
  (C) This is acceptable, and the contract should be binding like any business deal.

  3. A clinic pays women for eggs to create embryos for other couples, and pays different women to carry those pregnancies to term.
  (A) Paying for eggs is worse; it sells body parts, unlike carrying a pregnancy.
  (B) Carrying a pregnancy is worse; it involves more risk and bonding than providing eggs.
  (C) Both are equivalent; both are services women should be paid for.

  4. A wealthy woman chooses compensated surrogacy for reasons entirely her own, not because she needs the money.
  (A) This is still wrong; the practice is inherently degrading.
  (B) This is acceptable, but most women today are too pressured to choose freely.
  (C) This is acceptable; women should be trusted to choose regardless of pressure.

  5. A surrogate is offered a paid-up mortgage for her family instead of a direct cash fee.
  (A) This is better than cash; it feels less like a sale.
  (B) This is the same as cash; it still buys her consent.
  (C) This is worse than cash; it manipulates her attachment to her own home.

  **Scoring Key**

  **Leaf 1: The Outright Prohibitionist**
  *   **Path:** 1(A)
  *   **Diagnosis:** Rejects third-party reproduction even between kin without profit. Views reproduction as inherently non-transferable.
  *   **Unoccupied Combinations:** 1(A) combined with 2(C) or 4(C) is incoherent; one cannot forbid altruistic surrogacy while permitting commercial contracts or wealthy surrogacy.

  **Leaf 2: The Compromise View (European-Style)**
  *   **Path:** 1(B) AND 2(A)
  *   **Diagnosis:** Permits altruistic surrogacy but bans profit to prevent commodification. Often selects 5(A), viewing non-cash compensation as less corrupting, or 5(B) if consistent.
  *   **Unoccupied Combinations:** 1(B) combined with 2(C) is unstable; it allows altruism but enforces commercial contracts, violating the "no profit" principle.

  **Leaf 3: The Exploitation-Based Prohibitionist**
  *   **Path:** 1(B) AND 2(A) AND 4(B)
  *   **Diagnosis:** Overlaps with Compromise on current law (ban profit now) but differs on theory. Would permit payment under conditions of economic equality (4B), whereas Compromise views payment as inherently wrong regardless of wealth.
  *   **Note:** Distinguished from Leaf 2 primarily by answer 4(B). If a respondent chooses 1(B)/2(A) but 4(C), they are a Compromise View holder who trusts wealthy women's autonomy.

  **Leaf 4: The Regulated-Market Liberal**
  *   **Path:** 1(C) AND 2(B)
  *   **Diagnosis:** Permits payment but rejects full contract enforceability to protect bodily integrity. Often selects 5(A) or 5(B).
  *   **Unoccupied Combinations:** 2(B) combined with 5(C) is rare; few argue contracts should be voidable while viewing mortgage compensation as manipulative rather than purchasive.

  **Leaf 5: The Full-Market View**
  *   **Path:** 1(C) AND 2(C) AND 4(C)
  *   **Diagnosis:** Treats reproductive services as standard labor. Contracts are binding; wealth status is irrelevant; cash and non-cash are equivalent (5B).
  *   **Unoccupied Combinations:** 2(C) combined with 4(B) is unattractive; it argues for binding contracts generally but admits coercion invalidates them for the poor, creating a two-tier legal system.

  **Leaf 6: The Autonomy-Based Feminist Defense**
  *   **Path:** 1(C) AND 2(C) AND 4(C)
  *   **Diagnosis:** Functionally identical to Leaf 5 on case judgments. Distinguishes itself theoretically by framing bans as paternalistic restrictions on women's agency rather than market efficiency.
  *   **Flagged Indistinguishable Pair:** This instrument cannot genuinely separate Leaf 5 (Full-Market) and Leaf 6 (Autonomy Feminist). Both endorse the same legal outcomes (enforceable contracts, paid surrogacy regardless of wealth). The distinction lies in *why* they support it (liberty vs. gender equality), which case judgments alone do not reveal.

  **Unexplored/Incoherent Combinations**
  *   **1(C) + 4(A):** Permits paid surrogacy generally but forbids it for wealthy women. This is incoherent; if the practice is permissible, wealth should not render it impermissible unless the objection is purely exploitation-based (which would lead to 4B).
  *   **3(A) + 2(C):** Claims selling eggs is worse than gestation but supports binding contracts for gestation. This is logically possible (labor vs. property distinction) but rarely occupied; those who object to selling eggs usually object to selling gestation due to bonding risks (3B).

  **Failure Analysis**

  The instrument is most likely to fail on **Question 4**. This question attempts to separate the Exploitation-Based Prohibitionist (Leaf 3) from the Market/Feminist views (Leaves 5 & 6) by isolating economic coercion. However, a respondent may answer 4(C) ("Women should be trusted to choose") while still harboring deep reservations about systemic inequality that the quiz classifies as a Full-Market view. Conversely, a respondent may answer 4(B) ("Most women are too pressured") yet support a regulated market (Leaf 4) rather than prohibition, believing regulation mitigates pressure sufficiently. The binary choice between "trust women" and "women are pressured" collapses the nuance of those who believe women can choose freely *if* specific safeguards (beyond wealth) are in place. To restructure the tree, I would replace Question 4 with a case asking whether state-provided economic security (e.g., universal basic income) would make compensated surrogacy acceptable, thereby directly testing the background conditions objection rather than inferring it through the proxy of individual wealth.
