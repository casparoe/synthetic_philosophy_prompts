answer: |-
  ### Scenario Outline: The Debris Clause

  **Setting:**
  The fictional port of Oakhaven, three days after a catastrophic storm surge. The waterfront is a wreckage of twisted metal and splintered timber.

  **Characters:**
  *   **Elara Vance:** Owner of the *Vance Cryo-Storage Facility*, a specialized warehouse used to preserve biological samples. She is grieving not just the financial loss, but the loss of the clients' trust and the potential legal liability for the spoiled goods.
  *   **Julian Kress:** A senior claims adjuster for the reinsurance firm. He is not cruel, but he is a rigid formalist who believes the law must be as precise as mathematics.

  **The Dispute:**
  Elara's insurance policy covers "Total Loss of the Storage Unit." The policy defines the "Unit" as the assembled structure designated for cryogenic containment. Following the storm, the building has been obliterated. The insulated walls, cooling pipes, and steel beams are scattered across a three-mile stretch of marshland. They are intact as pieces, but the building is gone.

  Kress denies the claim. His argument relies on a mereological loophole written into the fine print of the reinsurance treaty, which defines assets by their constituent matter rather than their functional arrangement.

  **The Argument:**
  *   **Kress (The Universalist Position):** Kress argues that "destruction" implies the cessation of existence. However, under the principle of **Mereological Universalism**, for any collection of objects, there exists a further object composed of them. The steel beams, the pipes, and the insulation panels still exist. Therefore, the *fusion* of those parts still exists. Since the "Storage Unit" is legally identical to the sum of its material parts, the Unit still exists. It has merely been "rearranged." It is not lost; it is merely dispersed. To pay for a "Total Loss" would be to pay for an object that still ontologically exists.
  *   **Elara (The Restrictivist Position):** Elara argues that a "Storage Unit" is not just a sum of parts, but a specific *arrangement* of parts bound by functional unity. When the structural integrity failed, the parts ceased to compose a "Unit" and began to compose "Debris." The object she insured (a functioning facility) no longer exists. The objects that do exist (scattered girders) are not the thing she insured.

  **The Stakes:**
  If Kress prevails, Elara receives nothing. She faces bankruptcy and lawsuits from the biotech firms whose samples spoiled. If Elara prevails, the insurance pays out, but it sets a precedent that could destabilize the actuarial models of the entire coastal region. The stakes are livelihood, liability, and the definition of loss itself.

  ***

  ### The Philosophical Divide: The Special Composition Question

  The core conflict turns on the **Special Composition Question (SCQ)**: *Under what conditions do some things compose a further thing?*

  1.  **Mereological Universalism (Kress):** This view holds that composition is **unrestricted**. For any two or more objects, there is a whole composed of them. It does not matter if the parts are touching, functionally related, or coherent. The sum of a cooling pipe in the marsh and a beam three miles away constitutes a single object.
      *   *In this context:* Kress argues that because the parts exist, their sum exists. Because the sum exists, the "Unit" exists. Therefore, "Total Loss" is a logical impossibility so long as the atoms remain in the universe.

  2.  **Mereological Restrictivism (Elara):** This view holds that composition is **restricted**. Parts only compose a whole when they meet specific criteria—usually physical contact, causal interdependence, or functional unity.
      *   *In this context:* Elara argues that the parts only composed a "Unit" when they were bolted together and functioning. Now that the functional unity is broken, the "Unit" has ceased to exist. The parts now compose "Debris," which is a different kind of object (or no object at all, just a plurality).

  ***

  ### Why the Restrictivist View Prevails Intuitively

  In this setting, the reader will instinctively side with Elara (Restrictivism) for three reasons that make Universalism feel not just wrong, but morally repugnant:

  **1. The Erasure of Function and Purpose**
  Human objects are defined by what they *do*, not just what they are made of. A "Cryo-Storage Unit" is defined by its ability to maintain temperature and protect samples. A pile of scattered insulation cannot do this. By arguing that the scattered parts still compose the "Unit," Kress is severing the concept of the object from its purpose. To the reader, a ship that cannot sail or a vault that cannot lock is not a ship or a vault; it is scrap. Universalism asks the reader to accept that a thing's identity is independent of its function, which contradicts our lived experience of the material world.

  **2. The Denial of Catastrophe**
  Universalism, in this legal application, renders the concept of "destruction" meaningless. If any rearrangement of parts counts as the continued existence of the whole, then nothing can ever be destroyed, only moved. This feels like a gaslighting of the victim. Elara stands in the mud looking at ruin; Kress tells her the building is standing right there, merely "expanded." This makes Universalism appear as a tool of bureaucratic cruelty—a way to use high-minded ontology to evade human responsibility. It prioritizes logical consistency over phenomenological truth (what it *feels* like to lose something).

  **3. The Problem of Indiscriminate Fusion**
  If we accept Kress's Universalism, we must accept absurdities. If the scattered beams compose the "Storage Unit," do they also compose a "Storage-Unit-and-Seagull" when a bird lands on one of them? Does the marsh water compose part of the Unit? Universalism creates an ontology bloated with infinite, arbitrary objects. In a high-stakes dispute, this feels like obfuscation. The Restrictivist view aligns with the "common sense" that objects have boundaries. When those boundaries are breached (the walls collapse), the object dies. This mirrors biological life; when the heart stops, the body is no longer a "person" but a "corpse," even if the atoms are the same. The reader understands that some thresholds, once crossed, cannot be uncrossed.

  **Narrative Note:**
  To make this bear down like weather, do not have the characters quote philosophers. Have Kress tap a tablet showing a schematic of the scattered parts connected by digital lines, calling it "The Asset." Have Elara pick up a twisted beam that used to be a load-bearing wall and ask, "Where is the roof, Julian? Point to the roof." The philosophy should be the subtext of the gesture, not the text of the dialogue. The cold rain, the smell of rust, and the silence of the spoiled servers should do the work of arguing for Restrictivism.
