answer: |-
  **Dissertation Prospectus**

  **Title:** Dissociating Integrity and Deliberation: A Structural Analysis of the Williams Objections

  **1. The Research Question**
  Current scholarship largely treats Bernard Williams' "integrity objection" and his "one thought too many" complaint as symmetric symptoms of a single underlying worry: that impartial moral theories alienate agents from their personal projects. This project challenges that consensus. It asks: **Does distinguishing the normative assessment targeted by the integrity objection from the deliberative architecture targeted by the "one thought too many" objection reveal that standard impartialist defenses solve only one problem while leaving the other intact?**

  This question is framed to yield a determinate answer. It does not merely ask *if* the objections are distinct, but whether their distinction creates a "vulnerability gap" in existing defenses. If the objections are structurally dissociable, a theory might successfully accommodate an agent's ground projects at the level of verdict (satisfying Integrity) while still demanding an alienating justificatory structure at the level of deliberation (failing the One Thought test), or vice versa. The dissertation will argue that recognizing this dissociation forces a revision of the criteria of adequacy for moral theory: a successful theory must satisfy two independent constraints, not one.

  **2. The Gap in Existing Literature**
  The standard response to Williams involves a slippage between *what a theory requires* and *how an agent thinks*. Defenders of impartialism (particularly consequentialists) often argue that a theory can license partial action without requiring partial *reasoning*. For example, a two-level theory might permit saving one's wife because doing so maximizes value, even if the agent does not calculate this at the moment.

  However, the literature rarely isolates whether this move addresses the integrity objection (which concerns the theoretical subordination of projects) or the deliberative objection (which concerns the phenomenology of justification). By treating these as a single "alienation" worry, commentators allow defenses to claim a comprehensive victory when they may have only addressed half the problem. Conversely, critics often assume that if a theory fails the deliberative test, it necessarily violates integrity, without proving that link. This project isolates the variables to test whether the link is necessary or contingent. Importantly, this analysis remains neutral on whether Williams is ultimately *correct* that impartialism fails; even a skeptic who believes Williams' objections are both unsound can agree that they are structurally distinct and require separate refutations.

  **3. Methodology and Chapter Plan**
  The project employs a method of conceptual dissociation via constructed cases, followed by a stress-test of existing theoretical defenses.

  *   **Chapter 1: Structural Exegesis.** I will reconstruct the two objections without presupposing their unity. The Integrity Objection will be formalized as a constraint on *theoretical verdicts* (the conditions under which a project is permissibly pursued). The One Thought Objection will be formalized as a constraint on *deliberative architecture* (the justificatory steps required for an action to be rational). I will establish criteria for distinguishing a theory's *conditions of rightness* from its *conditions of rational deliberation*.
  *   **Chapter 2: Constructing the Dissociation Cases.** I will construct two sets of counterexamples to the "unity thesis."
      *   *Case Type A (Integrity without Thought):* An agent acts instantly to preserve a ground project where the moral theory's verdict aligns with the project, but the theoretical justification still subordinates the project to the impartial standard. Here, no "thought" occurs, yet the integrity worry persists.
      *   *Case Type B (Thought without Integrity):* An agent engages in explicit impartial deliberation regarding a trivial choice where no ground project is at stake. Here, the "too many thoughts" phenomenology is present, but the integrity objection (loss of self) does not apply.
      *   *Fairness Criteria:* To ensure these cases are not rigged, I will establish three controls: (1) The agent's psychological state must be stipulated independently of the theory; (2) The theory's verdict must be unambiguous; (3) The "ground project" must meet Williams' criteria for depth and centrality.
  *   **Chapter 3: Testing Standard Defenses.** I will apply the dissociation cases to three prominent defense strategies: indirect consequentialism, dual-process theories, and virtue-ethical appropriations of impartialism. I will evaluate each defense on a matrix: does it solve Integrity, Deliberation, both, or neither? The hypothesis is that most defenses solve Deliberation (by telling agents not to think about the theory) while leaving Integrity untouched (the theory still says the project only matters because of the impartial value).
  *   **Chapter 4: The Philosophy of Action Objection.** A significant risk is the objection that the "one thought too many" complaint is merely psychological, belonging to philosophy of action or cognitive science, not normative ethics. I will argue that deliberative architecture is normative because it dictates what counts as a *reason* for the agent. If a theory requires an agent to treat a ground project as a mere heuristic for impartial value, it alters the normative status of the project, not just the psychology. This chapter will defend the claim that how we are required to think is a moral question.
  *   **Chapter 5: Implications for Moral Theory.** I will conclude by outlining what a theory looks like that satisfies both constraints. This may require moving beyond the standard impartial/partial dichotomy to a structure where personal projects have non-derivative normative weight in both verdict and deliberation.

  **4. Failure Conditions**
  Intellectual honesty requires specifying what would count as the project failing.
  1.  **Collapse of the Distinction:** If it can be demonstrated that the Integrity Objection *logically entails* the Deliberative Objection (i.e., one cannot have the theoretical subordination without the deliberative alienation), the core hypothesis fails.
  2.  **Non-Normativity:** If the "one thought too many" complaint is successfully reduced to a preference about mental comfort with no normative force, Chapter 4 fails, and the project reduces to a restatement of the Integrity Objection.
  3.  **Triviality:** If the dissociation cases turn out to be edge cases that no serious moral theory needs to account for, the project lacks significance. (I will mitigate this by showing how standard defenses rely on the dissociation being impossible).

  **5. Scope and Dissertation Viability**
  There is a risk that this argument constitutes a single strong article rather than a dissertation. If the dissociation is proven and the defenses tested in Chapters 1–3, the core philosophical work may be complete by page 100.

  To ensure dissertation viability, I will expand the scope in two ways:
  1.  **Generalization:** I will not limit the analysis to Williams or Consequentialism. In Chapter 5, I will test whether this Integrity/Deliberation distinction applies to other critiques of impartiality (e.g., feminist ethics of care, virtue ethical critiques of codifiability). If the distinction holds across these domains, the project becomes a general contribution to meta-ethics and moral psychology, not just Williams exegesis.
  2.  **Constructive Proposal:** Rather than ending at the critique, Chapter 5 will sketch a positive framework for "Dual-Constraint Moral Theory." Developing a constructive alternative that explicitly satisfies both constraints requires significant theoretical labor, ensuring the bulk and depth required for a doctoral dissertation.

  This approach ensures that even if the historical claim about Williams is contested, the structural distinction offered provides a lasting tool for evaluating moral theories.
