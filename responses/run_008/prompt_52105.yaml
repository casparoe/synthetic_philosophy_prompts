answer: |-
  Here is a complete lesson plan for your 90-minute seminar. It is designed to be run with minimal lecturing until the debrief, forcing the students to inhabit the tension between *doing good* and *proving you did good*.

  ## Seminar Title: The Accountability Trap
  **Time:** 90 Minutes
  **Students:** 16 (4 Groups of 4)
  **Materials Needed:** Printed "Grant Menus," "Foundation Charters," "Audit Rubrics," scratch paper, pens.

  ---

  ### 1. The Setup (0:00 – 0:05)
  **Do not mention Effective Altruism, measurement, or bias.**

  Divide the class into 4 "Foundations" (A, B, C, D). Give each group a **Foundation Charter** and a **Grant Menu**.

  **The Charter Instructions:**
  > "You are a grantmaking foundation. You have **100 Impact Points** to allocate among the candidates in your Menu. You may split points however you like.
  >
  > **The Goal:** Maximize expected positive impact.
  > **The Constraint:** You are accountable to stakeholders. After you allocate, you will be **Audited** by another Foundation.
  > **The Stakes:** Your final score is your *Impact* minus any *Reputation Penalties* incurred during the Audit. The Foundation with the highest final score wins."

  **The Twist (The Audit Rule):**
  Tell them: "You will receive the **Audit Rubric** in 5 minutes. You should anticipate that auditors will be looking for *rigor* and *clarity* in your decision-making process."

  *(Hand out the Audit Rubric now. See below. It looks neutral but structurally favors numbers.)*

  ### 2. Allocation Phase (0:05 – 0:30)
  Students discuss and allocate their 100 points.
  **Facilitator Role:** Walk around. If they ask, "Can we fund the vague one?" say, "You can fund whoever you want, but you have to defend it in the audit." If they ask, "What counts as rigor?" say, "Check the Rubric."

  **The Grant Menu (8 Options):**
  *Design note: The first three are "Legible." The middle three are "Messy." The last two are "Huge/Unmeasurable."*

  1.  **NetHealth International:** Distributes insecticide-treated nets. Cost: $5 per net. Evidence: RCTs show 40% reduction in malaria incidence per 1,000 nets.
  2.  **Deworm101:** School-based deworming. Cost: $0.50 per child. Evidence: Meta-analysis shows 0.15 years of additional schooling per treatment.
  3.  **CashDirect:** Unconditional cash transfers. Cost: $100 per family. Evidence: 95% spend rate on essentials; 10% income increase verified by survey.
  4.  **CivicVoice:** Local community organizing. Cost: $5,000 per organizer. Evidence: "Increased community cohesion" (survey self-reports); policy changes vary by region.
  5.  **PolicyLab:** Advocacy for housing reform. Cost: $50,000 per campaign. Evidence: 2 bills introduced; long-term economic impact modeled but uncertain.
  6.  **ArtsFuture:** Funding arts in marginalized areas. Cost: $10,000 per program. Evidence: Qualitative testimonials on "wellbeing"; no longitudinal data.
  7.  **X-Safety Inst:** Research on catastrophic AI risks. Cost: $200,000 per researcher. Evidence: Theoretical risk reduction; no historical baseline for success.
  8.  **MoralCircle:** Philosophical research on expanding moral consideration. Cost: $100,000 per fellowship. Evidence: "Shifts in discourse"; impact timeline 50+ years.

  **The Audit Rubric (Given to students during Allocation):**
  *Design note: This looks like standard nonprofit accountability, but the point values encode the bias.*

  > **Auditor Scoring Sheet (Max 50 Points)**
  > *   **Specificity of Outcome (0-10 pts):** Are outcomes clearly defined? (e.g., "Lives saved" vs. "Helping people")
  > *   **Cost-Effectiveness Data (0-20 pts):** Can the grantee cite a specific cost-per-unit-of-outcome? (Full points require a numerical ratio).
  > *   **Attribution Confidence (0-10 pts):** How certain are we that the money caused the result? (RCTs/Stats score higher than Case Studies).
  > *   **Timeline Clarity (0-10 pts):** Is the impact realized within a reporting cycle? (<2 years scores higher).

  ### 3. The Audit Phase (0:30 – 0:50)
  Pair the groups: A audits B, B audits C, C audits D, D audits A.
  One group plays "Grantmakers," the other plays "Auditors."

  **Task:** The Auditors review the Grantmakers' allocation sheet. They ask: "Why did you fund this?" The Grantmakers must defend. The Auditors assign a score based *strictly* on the Rubric.
  **Swap:** After 10 minutes, swap roles so everyone experiences being audited.

  **Facilitator Note:** Enforce the Rubric strictly. If a group says, "We funded X-Safety because existential risk is huge," the Auditor must say, "That is compelling, but you have no cost-per-outcome number. I must deduct 15 points." This friction is the lesson.

  ### 4. Scoring & Reveal (0:50 – 1:00)
  Collect the scores. Announce the winner.
  **Predictable Outcome:** The winner will almost certainly be the group that loaded up on NetHealth, Deworm101, and CashDirect. They will have high "Audit Scores" even if their "Moral Intuition" was lower.

  **The Reveal:**
  Now you speak.
  > "Look at your portfolios. How many of you funded the AI Safety or Moral Circle projects? (Likely few). How many funded the Community Organizing? (Likely few).
  >
  > Why? Did you think bednets were morally superior to existential risk prevention? Or did you think they were *safer for your reputation*?
  >
  > You just experienced **Measurability Bias** (or the Legibility Critique). When you are forced to justify good deeds using standardized metrics, you don't necessarily do more good. You do more *countable* good."

  ### 5. The Debrief (1:00 – 1:30)
  Guide the discussion using this trajectory. Do not lecture; ask.

  **Phase 1: Phenomenology (How did it feel?)**
  *   "For those who wanted to fund the 'Huge/Unmeasurable' options but didn't: What stopped you?"
  *   "For the Auditors: Did it feel 'wrong' to penalize the AI Safety project even though you knew it might be important?"
  *   "Did anyone try to invent numbers for the messy projects? (e.g., 'Let's just say it saves 10 lives'). Why did you feel the need to lie?"

  **Phase 2: The Mechanism (Why did the system do this?)**
  *   "The Rubric looked neutral. It asked for 'Specificity' and 'Confidence.' Why did those neutral words translate to 'Bednets'?"
  *   "Is this a flaw in the Rubric, or a flaw in the nature of funding?"
  *   "Connect this to 'Earning to Give.' If you need to prove you did good to keep your job/donors, does that push you toward careers where income is trackable (finance/tech) rather than impactful but messy (caregiving/organizing)?"

  **Phase 3: The Hard Question (Is this avoidable?)**
  *   "If we remove the numbers from the Rubric, how do we stop fraud or laziness?"
  *   "Is this bias specific to Effective Altruism? Or does *any* accountable institution (government, NGOs, corporations) inevitably drift this way?"
  *   "Can you have accountability without measurability bias? If so, what does it look like?"

  ---

  ### Predictable Failures (First Run Risks)

  1.  **The "Gamer" Reaction:** One group will realize the trick in the first 5 minutes. They will loudly say, "Oh, we just need to pick the numbers to win."
      *   *Mitigation:* Acknowledge it. "Exactly. The system rewards gaming. That is the critique."
  2.  **The "EA True Believer":** You may have a student who is already into EA. They will argue, "But bednets *are* better. The numbers prove it."
      *   *Mitigation:* Use them. "Okay, but did you fund them because they are better, or because the Audit Rubric made them safer? Can you separate those motives?"
  3.  **Time Creep:** The Audit phase often runs long because students like arguing.
      *   *Mitigation:* Be a harsh timekeeper. Use a visible timer. Cut the audit off mid-sentence if needed to preserve debrief time.
  4.  **Fake Numbers:** Students might assign arbitrary numbers to the "Messy" grants to game the rubric (e.g., "We estimate ArtsFuture saves 5 lives equivalent").
      *   *Mitigation:* The Audit Rules must state: "Data must be sourced from the Grant Card. Invented metrics result in disqualification."

  ### Honest Limitations (What the Game Cannot Do)

  Be prepared to admit these during the debrief. This builds trust.

  1.  **Points vs. Suffering:** In the game, points are abstract. In reality, choosing bednets over AI safety involves weighing *lives* against *potential futures*. The game makes this feel bureaucratic, not moral. It simulates the *incentive structure*, not the *moral weight*.
  2.  **The "Good" Auditor:** In the real world, some auditors/donors *do* value long-term vision. The game hardcodes the bias into the Rubric. In reality, the bias is often cultural, not written down.
  3.  **EA is Not Just Metrics:** Effective Altruism is a philosophical community, not just a spreadsheet. Proponents argue that measurement is a *tool* to find truth, not just to satisfy auditors. The game risks caricaturing EA as purely bureaucratic compliance.
  4.  **No "Skin in the Game":** They are spending fake points. If they were spending their own money, the anxiety would be higher, potentially pushing them *away* from risky bets even harder, or conversely, making them more passionate about their moral intuition.

  ### Facilitator Cheat Sheet: Key Concepts to Drop in Debrief
  *   **Legibility (James C. Scott):** States/organizations simplify complex realities to manage them. Bednets are legible; "community empowerment" is not.
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
  *   **The "Last Dollar" Problem:** EA focuses on the marginal dollar. But some things (like democracy or culture) only work if funded holistically, not marginally.
  *   **Epistemic Humility:** The unmeasurable projects require admitting "We don't know." Accountability structures punish admission of ignorance.
