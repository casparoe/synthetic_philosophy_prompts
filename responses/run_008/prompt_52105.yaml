      *   *Decision:* Give everyone the "Accountability Protocol" at the start. It says: "Successful foundations provide clear evidence of impact. In the audit phase, you will be scored on the *specificity* of your impact claims." This allows them to interpret "specificity" as they wish, but the Audit Rubric will reveal it means "numbers."

