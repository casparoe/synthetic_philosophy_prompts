answer: |-
  # Lesson Plan: The Closure Game
  **Course:** Formal Epistemology (2nd Year Undergraduate)  
  **Topic:** The Problem of Logical Omniscience  
  **Time:** 90 Minutes  
  **Class Size:** 16 Students (4 Teams of 4)  
  **Room:** Movable desks, whiteboard.

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  **Experience** the computational burden of logical closure rather than just defining it.
  2.  **Distinguish** between *implicit* information (entailed by beliefs) and *explicit* information (accessible for action).
  3.  **Evaluate** the normative status of logical omniscience: Is it a failure of rationality to miss a consequence, or a failure of the model to describe bounded agents?

  ## II. Game Materials & Setup

  ### The Scenario: "The Clockwork District"
  A fictional town with 4 Zones (N, S, E, W). 4 Agents (Red, Blue, Green, Yellow).
  **Global Rules (Written on Whiteboard):**
  1.  No agent can be in two zones at the same time.
  2.  Movement between adjacent zones takes exactly 1 time-unit.
  3.  If an Agent is Red, they never enter Zone N.
  4.  If an Agent enters Zone E at $t=1$, they must be in Zone W at $t=3$.

  ### Team Packets (Confidential)
  Each team receives an envelope containing 5 "Observation Cards."
  *   **Team North:** Facts about Red & Blue at $t=1, t=2$. (Includes: Red is in Zone E at $t=1$).
  *   **Team South:** Facts about Green & Yellow at $t=1, t=2$. (Includes: Green is in Zone N at $t=2$).
  *   **Team East:** Movement rules specific to Red & Green. (Includes: Red moves E $\to$ N $\to$ W).
  *   **Team West:** Movement rules specific to Blue & Yellow. (Includes: A hidden contradiction: Blue is in Zone S at $t=1$ AND Blue is in Zone N at $t=1$).

  *Note: The logic is propositional but disguised as spatial constraints. The chains of inference are long enough to prevent instant solution but short enough to be solvable with effort.*

  ### Currency & Scoring
  *   **Rationality Credits (RC):** Each team starts with **100 RC**.
  *   **The Scoring Rule (The "Omniscience Clause"):** You are scored as if you know all logical consequences of your packet *immediately*.
  *   **Penalty:** -10 RC for every query where your answer is inconsistent with the logical closure of your packet (even if you didn't realize the inconsistency).
  *   **Market:** Teams can sell "Inference Tickets." If Team A derives a fact Team B needs, Team B can pay RC to Team A to validate that fact.

  ## III. Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Rules
  *   Divide class into 4 teams. Arrange desks in clusters.
  *   Distribute Packets. Emphasize: *"Do not show your cards to other teams unless a trade is negotiated."*
  *   Explain the **Omniscience Clause**: "In this game, you are Bayesian Ideal Agents. If your information entails $\phi$, you know $\phi$. If you act as if you don't know $\phi$, you are penalized for incoherence."
  *   **Whiteboard:** Display the Global Rules and the Current RC standings (all start at 100).

  ### 0:10 – 0:25: Round 1 (The Closure Trap)
  *   **Mechanic:** The Instructor (Game Master) poses 3 queries to each team sequentially. They have 2 minutes per query to respond.
  *   **Query 1 (Direct):** "Where is Agent Red at $t=1$?" (Explicit in packet).
  *   **Query 2 (One-Step):** "Can Agent Red be in Zone N at $t=2$?" (Requires applying Global Rule 3 to packet info).
  *   **Query 3 (The Hidden Consequence):** "Is it possible for Agent Red to be in Zone W at $t=3$?"
      *   *Logic:* Packet says Red in E at $t=1$. Global Rule 4 says E($t=1$) $\to$ W($t=3$).
      *   *Trap:* Teams often hesitate because they haven't written down the derivation.
      *   *Scoring:* If they say "We don't know" or "Unlikely," deduct 10 RC. The GM reveals the entailment. "Your information necessitated this. Your uncertainty was a scoring error."

  ### 0:25 – 0:40: Round 2 (The Deduction Market)
  *   **Mechanic:** Teams are given a complex query that requires information held by *another* team.
  *   **Query:** "Is there any Agent who violates the Movement Rules?"
  *   **Constraint:** To answer, Team North needs data from Team West. Team West needs data from Team East.
  *   **Trading:** Teams have 10 minutes to negotiate. They can sell "Inference Tickets" (written proof of a derivation) for RC.
  *   **Goal:** Make the cost of deduction visible. If Team East charges 50 RC for a proof, Team North must decide if knowing the truth is worth going into debt.
  *   **Outcome:** Some teams will hoard info; others will go bankrupt buying proofs.

  ### 0:40 – 0:55: Round 3 (The Disjunctive Commitment)
  *   **Mechanic:** This addresses the specific prompt requirement regarding disjunctions.
  *   **Setup:** The GM identifies a proposition $D$ ($A \lor B$) that is entailed by the *union* of all teams' packets, but neither $A$ nor $B$ is individually entailed by any single team's packet, and no team has enough info to distinguish them.
  *   **The Query:** The GM approaches Team North. "Your collective information entails that either (Blue is in S) OR (Blue is in N). You must place a 50 RC bet on the disjunction being True."
  *   **The Trap:** Students will say, "But we don't know *which* one."
  *   **The Ruling:** "The Omniscience Clause applies. You know the disjunction is certain ($P=1$). Refusing to bet is a coherence violation."
  *   **Follow-up:** "Now, bet on 'Blue is in S'."
  *   **The Ruling:** If they bet, they might be wrong (and lose RC). If they refuse, they are penalized for failing to have a precise credence (if the game enforces Probabilism). *Decision for Game:* Allow refusal here to highlight the gap. Penalize them for the disjunction refusal primarily.
  *   **The Contradiction Reveal:** Reveal Team West's packet (Blue in S AND Blue in N).
  *   **Scoring:** All teams are penalized -20 RC for "Assigning positive probability to a contradictory world state" during Round 1, even though they couldn't have known. "You were incoherent from the start."

  ### 0:55 – 1:30: The Debrief (Critical Phase)
  *   Move desks to a circle. Whiteboard remains visible with RC scores.

  #### Part 1: The Phenomenology of Omniscience (10 mins)
  *   **Ask:** "How did it feel to be penalized for not knowing something you couldn't calculate?"
  *   **Map:** This is the **Boundedness Objection**. The model treats *computational difficulty* as *irrationality*.
  *   **Board:** Write **Implicit vs. Explicit**. The game treated Implicit knowledge as if it were Explicit.

  #### Part 2: The Market of Deduction (10 mins)
  *   **Ask:** "What was the price of a logical proof? Was it worth it?"
  *   **Map:** This represents **Computational Cost**. In standard Bayesianism, deduction is free ($P(A) = P(A \land B) + P(A \land \neg B)$ costs nothing). In the game, it cost RC.
  *   **Point:** If deduction has a cost, agents *should* remain ignorant of some consequences to save resources. Therefore, logical omniscience is not a rational ideal for bounded agents.

  #### Part 3: The Disjunction & Contradiction (10 mins)
  *   **Ask:** "Why was the disjunctive bet frustrating?"
  *   **Map:** **The Disanalogy.** In empirical cases, "I don't know" is a valid state. In logic, "I don't know" is often treated as a defect.
  *   **Ask:** "Was it fair to penalize you for the hidden contradiction in Round 1?"
  *   **Map:** **The Normative Question.**
      *   *View A (Defect):* If you couldn't see it, you weren't irrational. The model is broken.
      *   *View B (Idealization):* You *were* irrational, just like a person who believes $2+2=5$ is irrational even if they can't do math. The model describes the *standard*, not the *agent*.
  *   **Instructor Note:** Push them here. The game shows LO is *impossible* for humans. It does not prove LO is *undesirable* as a normative standard (like frictionless physics).

  ## IV. Scoring Scheme Details

  1.  **Base Score:** 100 RC.
  2.  **Ignorance Penalty:** -10 RC per query where the team fails to assert a logical consequence of their current information state (as judged by the GM).
  3.  **Incoherence Penalty:** -20 RC if a team's set of asserted beliefs is logically inconsistent (e.g., asserting $P$ in Round 1 and $\neg P$ in Round 2, or holding a contradiction revealed later).
  4.  **Market Transactions:** Voluntary transfer of RC.
  5.  **Hidden Contradiction Scoring:**
      *   *Scenario:* A team assigns credence $c > 0$ to a proposition $\phi$. Later, the GM reveals that $\phi$ is contradictory given the total information state (even if the team didn't hold all the info).
      *   *Ruling:* The team is penalized.
      *   *Rationale:* This simulates the **Objective Bayesian** stance. Rationality is a relation between the agent and the *truth/structure of the world*, not just the agent and their *internal access*. If $\phi$ is impossible, $P(\phi)$ should be 0, regardless of computational access. This is the specific friction point the game is designed to expose.

  ## V. Prediction of Failure Modes

  1.  **The "Gaming" Problem:** Teams may realize that admitting ignorance is costly, so they will guess randomly to avoid the "I don't know" penalty.
      *   *Mitigation:* Add a "Falsehood Penalty" (-20 RC) for asserting a consequence that turns out to be false. This forces them to balance the risk of ignorance vs. error, mimicking the precision requirement of Bayesianism.
  2.  **The "Triviality" Problem:** The logic might be too easy. If they solve the chain in 30 seconds, the burden isn't felt.
      *   *Mitigation:* Have a "Reserve Packet" of harder inference rules (e.g., biconditionals or nested conditionals) ready to swap in if a team finishes too quickly.
  3.  **The "Market Collapse":** Teams may refuse to trade, realizing cooperation lowers the competitive tension.
      *   *Mitigation:* Make the Round 2 query *impossible* for any single team to solve alone. Interdependence must be structural, not optional.
  4.  **The "GM Bottleneck":** Checking derivations takes too long.
      *   *Mitigation:* Pre-calculate the "Answer Key" for every possible combination of cards. Use a T/A or a trusted student from a previous year as a "Judge" to verify derivations during the market phase.

  ## VI. Limitations & Instructor's Note

  **What the Game Cannot Reproduce:**
  The game successfully demonstrates the **empirical impossibility** of logical omniscience (it is hard, costly, and frustrating). It fails to address the **normative legitimacy** of the idealization.

  *   **The Gap:** Students will leave thinking, "Bayesian models are unrealistic because humans can't do this." They may not grasp the philosopher's counter-argument: "Physics models assume frictionless planes; that doesn't make physics wrong, it makes it idealized. Perhaps epistemology should do the same."
  *   **Instructor's Duty:** In the final 5 minutes, you must explicitly decouple *descriptive accuracy* from *normative force*.
      *   *Script:* "You felt penalized unfairly. But consider: If I ask you if $2+2=4$, and you say 'I'm not sure, I haven't calculated it today,' are you being rational? The Bayesian says Logical Omniscience is like arithmetic truth: it's a standard of coherence, not a description of processing speed. The game showed you that you are not Ideal Agents. It did not prove that Ideal Agents are a useless concept. That is the debate for next week."

  **The Disjunctive Nuance:**
  The prompt asks for a round where teams "commit to knowing at least one of two consequences without knowing which."
  *   *Implementation Check:* In Round 3, ensure the GM explicitly states: "You know $(A \lor B)$ is true. You do not know $A$. You do not know $B$. Assert knowledge of the disjunction."
  *   *Philosophical Payoff:* This targets the **Distribution Axiom** ($K(A \lor B) \to KA \lor KB$). Standard epistemic logic validates this; human cognition does not. The game forces them to validate it to avoid penalty, creating cognitive dissonance.

  **Final Advice:**
  Do not let the game run over time. The debrief is where the learning happens. If the market phase is dragging, cut it short and announce "Market Crash" due to computational costs. That is itself a data point for the discussion.
