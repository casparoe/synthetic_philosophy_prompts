      *   *Scoring:* "Rationality Score."
      *   *Debrief:* Focus on the gap between *justification* and *truth*.

      *(Self-Correction during drafting)*: Make sure the disjunctive round hits the prompt's specific requirement: "commit to knowing at least one of two consequences without knowing which."
      *   *Idea:* The GM asks: "Which of these is true: 1. The Key is Red, 2. The Key is Blue?" The facts entail (1 $\lor$ 2). But they don't entail 1, and don't entail 2. An LO agent knows the disjunction is certain. A human says "I can't answer." The game penalizes "I can't answer."
