      *   *Decision:* It's often more interesting to argue that they *retain* standing, challenging the standard hypocrisy view. This fits the prompt's hint ("if they've still lost standing, I want to know what exactly the standing was protecting"). Let's argue they have standing because standing is about the current moral relationship, not historical ledger-keeping.
