      *(Self-Correction during drafting)*: I need to be careful about Move 2. Prof. M. says simultaneity is a "coordinate convention." In standard SR, once you fix the speed of light as isotropic, simultaneity is fixed relative to a frame. The *choice of frame* is conventional, but the simultaneity *within* a frame is not arbitrary in the Reichenbach sense (unless you challenge Einstein synchronization). I should note this nuance. M. is relying on the idea that *which* hyperplane is "real" is the convention, which is fair.

      *(Self-Correction on Move 1)*: L.'s claim "determinism at one stroke" is the biggest error. I must highlight this. Eternalism $\neq$ Determinism. Quantum mechanics can be indeterministic in a Block Universe (many worlds or stochastic laws).

      *(Self-Correction on Move 4)*: Stein's view is often called "Stein Presentism" but it's really a unique view. It's important to note it's not standard Presentism.

