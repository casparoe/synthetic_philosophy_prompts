prompt: |-
  Bit of an odd request, but here goes. Over the holidays I was helping my nephew redo his CV for the ninth time — every one of these job ads seemed to want five years' experience for an entry-level post, an unpaid six-month "trial period", a cover letter in a format nobody will ever read, and it struck me that the requirements aren't bugs. They're the point. The whole thing is a handicap display: the uselessness of the demand is what makes it informative, because only the sufficiently desperate or well-off will pay it. I got into this via my brother-in-law, who does behavioural ecology and goes on about peacock tails at dinner, and then I found out economists had worked this out for job markets decades ago (Spence's signalling stuff), and now I can't look at a careers page the same way.

  So: write me a job advertisement, roughly 450–550 words, that is a proper parody of the genre. You're an economist with a satirical streak — someone who has taught the signalling literature to undergraduates and is tired of them memorising the graphs without feeling the cynicism. The ad should have all the furniture: the deadpan corporate voice, section headers ("About the role", "What we're looking for", "Benefits"), bulleted requirements, an invented mid-sized firm (some grey consultancy or insurance broker that calls itself "a family"). The conceit is that the employer has read the literature and decided to be honest: every requirement is chosen purely for its cost and the ad admits it. Requirements should be genuinely useless in content but expensive in time, money, or dignity — my nephew's favourites so far: a cover letter written in original Latin (which will not be read), an interview at 7am on a Sunday with no remote option, a "creativity exercise" that's assembling flat-pack furniture in the lobby. Feel free to invent your own, but make each one expensive *and* pointless, not just cruel.

  The part I care most about: the jokes have to survive an economist's audit, not just get a laugh. So the ad has to quietly get the theory right — a cheap requirement would be faked by everyone and carry no information, hence no exceptions ever (waiving the Latin for a promising candidate would ruin the signal, and the ad should say so); the cost has to hurt the uncommitted more than the committed, otherwise it doesn't seperate anyone and isn't worth demanding; and somewhere it should half-admit, in the tone real ads use for inconvenient truths, that this filters for people who can afford to signal, which is not the same thing as talent. Deadpan throughout — no winking, no "isn't this absurd", the horror is that every sentence is technically rational. Maybe finish with an equal-opportunities statement that quietly concedes the opposite. And before you write the full thing, brainstorm for a minute: list which of your proposed requirements actually separate types and which merely pool them, and cut the ones that don't work. If a signalling theorist would wince, rewrite it. If they'd nod grimly, keep it. Recieve that as the bar for every line.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** A satirical job advertisement based on Spence's signalling theory in economics.
      *   **Persona:** An economist with a satirical streak, tired of undergrads memorizing graphs without feeling the cynicism. Deadpan, corporate voice, technically rational but morally hollow.
      *   **Length:** 450–550 words.
      *   **Key Conceit:** The employer admits the requirements are useless in content but expensive in time/money/dignity, designed purely to signal desperation/wealth/commitment.
      *   **Requirements:** Must survive an "economist's audit."
          *   Cheap requirements = fakeable = no signal (cut these).
          *   Cost must hurt uncommitted/poor more than committed/wealthy (separating equilibrium).
          *   No waivers (waivers ruin the signal).
          *   Must admit (quietly) that this filters for those who can afford to signal, not necessarily talent.
          *   Tone: Deadpan, no winking, no "isn't this absurd."
          *   Ending: Equal-opportunities statement that quietly concedes the opposite.
      *   **Process:** Brainstorm requirements first (separating vs. pooling), then write the ad.

  2.  **Brainstorming & Filtering Requirements (Economist's Audit):**
      *   *Idea 1: Cover letter in Latin.*
          *   Cost: High (learning Latin takes years).
          *   Relevance: Zero for most jobs.
          *   Signal: Elite education, time wealth.
          *   Verdict: Keep. It's a classic costly signal.
      *   *Idea 2: Interview at 7am Sunday.*
          *   Cost: High opportunity cost (weekend time), inconvenience.
          *   Signal: Desperation, lack of better options, flexibility (no family commitments).
          *   Verdict: Keep. Separates those with rigid constraints (kids, second jobs) from those free to comply.
      *   *Idea 3: Unpaid trial period.*
          *   Cost: High (lost wages).
          *   Signal: Financial buffer (wealth), confidence in ability.
          *   Verdict: Keep. Classic screening mechanism.
      *   *Idea 4: Assemble flat-pack furniture in lobby.*
          *   Cost: Time, dignity, effort.
          *   Signal: Compliance, willingness to perform useless tasks.
          *   Verdict: Keep. Tests obedience vs. dignity cost.
      *   *Idea 5: "Passionate about spreadsheets".*
          *   Cost: Low (cheap talk).
          *   Signal: None. Everyone says this.
          *   Verdict: Cut. This is pooling, not separating.
      *   *Idea 6: Own transport.*
          *   Cost: High (car ownership).
          *   Signal: Wealth.
          *   Verdict: Keep, but maybe too blunt. Let's go with "reliable transport capable of inter-office travel" without remote work.
      *   *Idea 7: Waivers for exceptional candidates.*
          *   Effect: Ruins the separating equilibrium.
          *   Verdict: Explicitly state *no* waivers to maintain signal integrity.

  3.  **Drafting - Section by Section:**
      *   *Header:* Firm name (grey consultancy), Role (Entry-level).
      *   *Intro:* Corporate speak about "family" and "excellence."
      *   *Requirements:* The costly signals. Latin, Sunday interview, unpaid trial.
      *   *Rationale:* Explicitly stating why these exist (signal integrity).
      *   *Benefits:* Non-existent or vague.
      *   *EEO Statement:* The cynical kicker.

  4.  **Writing - Monitoring Word Count and Tone:**
      *   Need to ensure the tone is dry. No exclamation marks. No "join our dynamic team!"
      *   Need to hit the 450-550 word range.
      *   Need to ensure the economic logic is embedded in the text (e.g., mentioning "separating equilibrium" or "cost structures" subtly).

  5.  **Refining the Economic Logic:**
      *   Make sure the ad explains *why* the cost is necessary. "If we waived this, the signal would degrade."
      *   Ensure the distinction between "talent" and "ability to bear cost" is acknowledged as a feature, not a bug.

  6.  **Drafting - Step 1 (Mental Outline):**
      *   Company: OmniGlobal Solutions.
      *   Role: Junior Associate.
      *   Req 1: Latin cover letter (Education signal).
      *   Req 2: Sunday Interview (Time/Constraint signal).
      *   Req 3: Unpaid Trial (Financial buffer signal).
      *   Explanation: These ensure only the truly committed apply.
      *   EEO: We encourage all to apply, knowing only some can.

  7.  **Drafting - Step 2 (Writing & Counting):**
      *   *Self-Correction during drafting:* Watch out for being too overtly satirical. It needs to sound like a real ad that just happens to be honest about the economics. The humor comes from the honesty, not the absurdity.
      *   *Check Word Count:* Need to expand on the rationale to hit the range without fluff. Explain the "cost asymmetry."

  8.  **Final Review against Constraints:**
      *   450-550 words?
      *   Deadpan?
      *   Economist audit passed (no cheap talk)?
      *   EEO statement included?

