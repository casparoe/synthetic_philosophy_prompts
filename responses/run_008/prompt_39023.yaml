answer: |-
  Your suspicion is correct. The phrase "costly signals are honest" is a slogan that hides the actual mechanism. In formal signaling theory, cost alone does not guarantee honesty. If cost alone were the key, you could just set the price of admission to infinity, and you'd get no signalers at all.

  The logic only holds under specific mathematical conditions regarding *who* pays the cost and *why*. Here is the breakdown of the four distinct claims hiding inside that slogan, with verdicts on their biological validity and their application to your roommate's hazing and your manager's decks.

  ### 1. The "Prohibitive Cost" Claim
  **The Claim:** The signal is honest simply because it is expensive enough that liars cannot afford to pay it. The cost acts as a barrier to entry.
  **The Logic:** If joining the frat requires running 50 miles, only people who *really* want in will do it. If making the deck requires 10 hours, only people who *really* care will do it.
  **Verdict (Biology):** **False.** In evolutionary biology, there is no cost so high that a "cheater" gene won't eventually try to pay it if the reproductive reward is high enough. If the tail guarantees mating, evolution will push organisms to fake the tail unless there is a structural reason they can't.
  **Verdict (Human Context):** **False.** In both hazing and status decks, the reward (social status, keeping your job) is usually high enough that motivated fakers *will* pay the cost. A hazer who doesn't care about the brotherhood but wants the networking will endure the pain. An employee who doesn't care about the project will grind the deck to avoid getting fired. The cost filters out the *unmotivated*, not the *dishonest*.

  ### 2. The "Differential Cost" Claim (The Handicap Principle)
  **The Claim:** The signal is honest because the cost is *higher* for a low-quality signaler than for a high-quality one. It's not about the absolute cost; it's about the *marginal* cost.
  **The Logic:** This is the actual peacock argument. A large, bright tail is heavy and attracts predators. A healthy, parasite-free peacock can grow this tail and still survive. A sick or weak peacock attempts to grow the same tail and dies. The cost is conditional on quality. The signal works because liars (weak birds) literally cannot sustain the cost without catastrophic failure.
  **Verdict (Biology):** **True.** This is the core of Zahavi's Handicap Principle. The signal is honest because the "tax" on faking is biologically unsustainable for low-quality individuals.
  **Verdict (Human Context):** **Generally False (and often inverted).**
  *   **Hazing:** Does hazing cost a "bad brother" more than a "good brother"? Not necessarily. It costs everyone pain. In fact, it might cost a "good brother" (who has a job, studies, and genuine commitments) *more* in opportunity cost than a "bad brother" (who has nothing better to do). It selects for availability and pain tolerance, not frat quality.
  *   **Status Decks:** This is where your manager's logic fails hardest. A high-performing employee (the "high quality" signaler) has a high opportunity cost—their time is valuable. Spending 5 hours on a useless deck is *more* painful for them than for a low-performer who has idle time. Therefore, the signal is **dishonest**. It incentivizes low-performers to signal "care" because the cost is cheaper for them. It punishes the actual high performers.

  ### 3. The "Commitment" Claim (Sunk Cost)
  **The Claim:** The signal is honest because paying the cost psychologically binds the signaler to the group. The suffering creates loyalty via cognitive dissonance ("I suffered for this, so it must be valuable").
  **The Logic:** This isn't about revealing pre-existing quality (like a peacock's health); it's about *creating* future behavior. The cost is an investment that makes quitting too expensive later.
  **Verdict (Biology):** **N/A.** Evolution doesn't care about psychological commitment, only reproductive output. This is a human-specific social mechanism.
  **Verdict (Human Context):** **Plausible for Hazing, False for Decks.**
  *   **Hazing:** This is likely the real mechanism your roommate is stumbling toward. Hazing works as a commitment device. Once you've been hazed, you are less likely to leave the frat because leaving would mean your suffering was "wasted." It creates loyalty, but it doesn't prove you were *worthy* beforehand.
  *   **Status Decks:** This fails because the cost is recurring. A weekly deck is not a sunk cost; it's a recurring tax. It doesn't bind the employee to the company; it just creates resentment. You don't build loyalty by forcing someone to fill out a timesheet every Friday; you build compliance.

  ### 4. The "Common Knowledge" Claim (Coordination)
  **The Claim:** The content of the signal doesn't matter; the honesty comes from the fact that *everyone knows everyone else did it.*
  **The Logic:** The value isn't in the information ("I care"), but in the coordination ("We all did the thing"). It creates a shared reality. The "waste" is the point because if the task were useful, people could do it privately. It has to be public and wasteful to prove we are playing the same game.
  **Verdict (Biology):** **True (in a sense).** Some rituals are about group cohesion rather than individual quality.
  **Verdict (Human Context):** **True, but unrelated to "Honesty."**
  *   **Hazing:** This explains why hazing persists. It creates a "common knowledge" event that bonds the cohort. It's not that the suffering proves you are a good person; it's that the suffering proves you are *one of us*.
  *   **Status Decks:** Your manager might be accidentally right about this, but wrong about the "care" part. The deck proves you are willing to submit to the bureaucracy. It signals compliance with the hierarchy, not care for the project. It creates a shared rhythm of submission, not a shared understanding of progress.

  ### The Breakdown for Your Roommate and Manager

  You can tell them that their "axiom" is missing the crucial variable: **Conditionality.**

  1.  **For the Roommate (Hazing):**
      *   **The Peacock Logic:** A peacock's tail works because a *sick* peacock dies if it grows one.
      *   **The Hazing Reality:** Hazing is not conditional on "brother quality." A sociopath can endure hazing just as well as a loyal friend.
      *   **The Verdict:** Hazing is not a "Handicap" signal (proving quality); it is a "Commitment" device (creating loyalty through sunk cost). It doesn't prove he *was* worthy; it ensures he *stays*.

  2.  **For the Manager (Status Decks):**
      *   **The Peacock Logic:** The cost must be harder for the "fake" employee to pay than the "real" one.
      *   **The Deck Reality:** The cost (time) is *more* expensive for your best employees (who have real work) than your worst employees (who have idle time).
      *   **The Verdict:** By demanding a costly, useless signal, you are inverting the peacock logic. You are incentivizing low-performers to signal "care" because the cost is cheaper for them. The signal is not honest; it is perverse.

  **Summary:** Cost only makes a signal honest if the cost hurts the liar *more* than the truth-teller. In biology, weakness makes the tail costly. In your office, competence makes the deck costly. In your frat, the cost is just a barrier that selects for pain tolerance, not virtue.
