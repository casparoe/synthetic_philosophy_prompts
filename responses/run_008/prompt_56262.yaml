prompt: |-
  The organ transplantation system in the United States operates under what bioethicists call the dead donor rule: vital organs may be recovered only from patients who have already been declared dead, never from patients whose death is caused by the organ recovery itself. The puzzling thing is what the surrounding practices presuppose about what death is. On one path, a patient who suffers catastrophic brain injury but does not meet the full neurological criteria can become a donor through what is called donation after circulatory death: life support is withdrawn, and once the heart has stopped, the treating physician waits a short interval — hospital policies generally require two to five minutes of sustained cessation of heartbeat — before declaring the patient dead and allowing the recovery team to begin. No one believes the body's cells have died in that window; the organs are recoverable precisely because they are still alive, and the declared death rests on the fact that circulation will not be restarted rather than that it could not be, since no attempt is made to restart it. On the other path, a patient is declared dead by neurological criteria — irreversible loss of all brain function — while a patient in a persistent vegetative state, equally without consciousness, is treated as alive and protected, the difference tracking roughly whether the brainstem still supports breathing and other integrated bodily functions on its own. So the same institution appears to declare death sometimes on grounds of permanence of a stopped process and sometimes on grounds of loss of bodily integration, while withholding death from patients who lack everything we associate with a mental life but retain physiological integration. What definition of death, if any, do these practices presuppose? Reconstruct the implicit theory: is it that death is a biological event in the organism, a normative verdict about the person, or a legal construct that can be set at whatever boundary serves accepted purposes? Say whether one coherent theory could license both the two-to-five-minute circulatory criterion and the neurological criterion, or whether the practices are only consistent because they are underdetermined, with several rival theories each licensing parts of them. Please also tell me which features of the practice would have to change if the presupposed view were made explicit — for instance, whether anything in the practice itself, apart from the dead donor rule's wording, would have to be revised if we admitted that the moment of death is partly a convention. Answer in continuous prose only, without headings, bullet points, bold text, or tables, the way one would write a letter.
