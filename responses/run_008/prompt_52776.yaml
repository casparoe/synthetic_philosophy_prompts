      *   **British English Check:** Ensure spelling (colour, programme, analyse, centre) and vocabulary (lecturer, seminar, maths vs math, etc.) are correct. Tone should be polite and slightly formal.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Hume called it a "fallacy." Hume described a shift in tone. The term "Naturalistic Fallacy" is Moore's. The user conflated them in the prompt ("Hume demonstrated that it is a fallacy — the naturalistic fallacy"). I must correct this gently.
