      *   *Lecturer's "Conflation":* The lecturer likely meant the student is conflating *deductive validity* with *moral justification*. Or perhaps that the student thinks empirical data is *irrelevant* to ethics, whereas Hume only said it isn't *sufficient* on its own. I will focus on the idea that facts are relevant *given* values.

