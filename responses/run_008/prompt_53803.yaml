      *   Does it escape the template? The roommate would say "Sure, those are also real kinds." The user finds this counter-intuitive.
      *   Why is it counter-intuitive? Because "Real Kinds" usually implies *uniqueness* or *carving nature at the joints*. If *every* 14-year slice is a kind, nothing is a kind.

  4.  **Identify the Best Point of Attack:**
      *   *Option A: Attack Premise 1.* Too radical. Denies the utility of inductive reasoning.
      *   *Option B: Attack Premise 2 (The Species Analogy).* This is strong. Species are causal lineages. Generations are arbitrary buckets.
      *   *Option C: Attack Premise 3 (The Empirical Claim).* This is the strongest scientific objection. The APC problem suggests the "effect" might be an artifact of the model, not a real causal force.
