      *   *Wait, don't just say "No."* The user *wants* the conclusion to stand ("ok boomer is doing real explanatory work"). I need to validate that *cohorts* might be real, but *named generations* are not.
      *   *Distinction:* "Birth Cohort" (continuous variable) vs. "Generation" (categorical bucket).
      *   *Analogy:* Height is real. "Tall people" is a useful category. "People over 180cm" vs "People over 181cm". The cut-off is arbitrary, but the underlying trait (height) is real.
