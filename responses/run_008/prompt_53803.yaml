      *   **Diagnose the Core Flaw:** The roommate is conflating *predictive utility* with *ontological reality*. Just because a variable predicts something doesn't mean the *category* exists in nature. (Example: "People wearing red shirts" might predict winning a game if it's a team uniform, but "red shirt wearers" isn't a natural kind).
      *   **Address Premise 2 (Species Analogy):** This is the easiest philosophical target. Species are *lineages*. Generations are *slices*.
