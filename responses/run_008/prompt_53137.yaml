      *   *Self-Correction during drafting:* Make sure I don't just bash string theory. The prompt asks about *non-empirical confirmation* as a concept, using string theory as the case study. Keep the focus on the epistemology.
      *   *Refining the MIA critique:* Ensure I articulate *why* the reference class is broken. The class is "theories that were eventually empirically confirmed." We don't know if ST is in that class. Using the class to prove ST is in the class is the circularity.

  7.  **Final Review against Prompt:**
