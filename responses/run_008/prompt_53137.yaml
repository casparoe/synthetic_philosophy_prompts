      *   *Wait, better verdict:* It is *not* confirmation of the theory's truth about the world, but it *is* rational justification for continued investment. I need to be sharper. Let's argue: NEC is not confirmation of *truth*, it is assessment of *research potential*. Conflating the two is the error.
      *   *Actually, looking at the "Reach a verdict" instruction:* "defend a specific position about when, if ever, a theory can be rationally believed without empirical tests." Okay, I will argue: Rational belief requires empirical contact *unless* the theory is mathematically unique and necessary (which ST is not claimed to be). So, for ST specifically, NEC is insufficient for belief.

