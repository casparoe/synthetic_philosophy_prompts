answer: |-
  # DECISION TREE: THE ST. PETERSBURG DIAGNOSTIC
  **Instructions:** Set the buy-in price **$C$** (e.g., $100, $10,000, $1M). Answer the questions in order. Your path determines your decision-theoretic position.

  **START:** A casino offers you **one single play** of the St. Petersburg lottery (payoff $2^n$ for first Head on flip $n$) for price **$C$**.

  1.  **Does the infinite mathematical expected value *compel* you to pay $C$, regardless of how high $C$ is?**
      *   **YES** $\rightarrow$ **[LEAF A] Naive EV Maximizer.** (You treat expectation as directly action-guiding in one-shot cases, ignoring risk or utility shape.)
      *   **NO** $\rightarrow$ Go to 2.

  2.  **The casino shows proof their insurer caps total payouts at $10^{12}$. Does this cap resolve your refusal to pay $C$?**
      *   **YES** (You would pay if $C$ is below the capped EV) $\rightarrow$ **[LEAF B] Finite Bankroll Realist.** (You reject the paradox as physically/institutionally impossible; you only evaluate feasible games.)
      *   **NO** (You still wouldn't pay $C$, even with the cap, or you assume an idealized casino) $\rightarrow$ Go to 3.

  3.  **Is your refusal driven by the idea that the *personal value* (utility) of money grows slower than the dollar amount?**
      *   **YES** $\rightarrow$ *Check:* If the payoffs were inflated to $2^{2^n}$ (Super-Petersburg) to overcome your utility curve, would you pay then?
          *   **Yes** $\rightarrow$ **[LEAF C] Diminishing Marginal Utility.** (Vulnerable to payoff inflation.)
          *   **No** $\rightarrow$ You likely hold **[LEAF D] Bounded Utility.** (There is a maximum possible satisfaction; no payoff increases it.)
      *   **NO** $\rightarrow$ Go to 4.

  4.  **Is your refusal driven by the idea that sufficiently small probabilities (e.g., $2^{-100}$) should be treated as zero?**
      *   **YES** $\rightarrow$ *Tie-Breaker:* A lottery costs $1,000. It pays $10^{100}$ with 50% chance, $0 otherwise. Do you buy?
          *   **Yes** $\rightarrow$ **[LEAF E] Probability Truncation.** (You ignore tiny tails, but accept likely huge payoffs.)
          *   **No** $\rightarrow$ You likely hold **[LEAF D] Bounded Utility.** (Even likely huge payoffs don't move you.)
      *   **NO** $\rightarrow$ Go to 5.

  5.  **If you were offered 1,000 independent plays of the original game for $1,000 \times C$, would you accept?**
      *   **YES** (Single shot refused, repeated accepted) $\rightarrow$ **[LEAF F] Aggregationist (Easwaran-style).** (Expectation guides long-run averages, not necessarily single shots.)
      *   **NO** (Refuse both) $\rightarrow$ **[LEAF G] Deflationary / Expectation Skeptic.** (Infinite expectation is a theorem, not advice; it fails to guide action even in principle.)

  ***

  ### MAP LEGEND: LOGICAL SPACE & BLIND SPOTS

  **Unoccupied / Incoherent Combinations:**
  *   **Naive EV Maximizer + Bounded Utility:** Incoherent. If utility is bounded, expected utility is finite; you cannot be compelled by infinite EV.
  *   **Finite Bankroll Realist + Deflationary:** Unattractive. If you accept the bankroll cap resolves the issue, you accept EV calculation on the truncated game; you aren't skeptical of expectation itself.

  **Indistinguishable Leaves (Without Extra Probing):**
  *   **[LEAF D] Bounded Utility vs. [LEAF E] Probability Truncation:** On the standard St. Petersburg case, these yield identical behavior (refusal). They are only separated by the **Tie-Breaker** in Node 4 (High-Probability/Huge-Payoff lottery). Without that question, these positions collapse into a single "Finite WTP" cluster.
  *   **[LEAF F] Aggregationist vs. [LEAF G] Deflationary:** These are only separated by Node 5 (Repeated Plays). If you do not ask about repetition, long-run convergence views look identical to skepticism about expectation.

  **Price Sensitivity Note:**
  *   **[LEAF B] Realists** and **[LEAF C] Diminishing Utility** agents will change their verdict if you re-run the tree with different **$C$** values (e.g., refusing at $1M but accepting at $100).
  *   **[LEAF D] Bounded**, **[LEAF E] Truncation**, and **[LEAF G] Deflationary** agents should theoretically refuse at *any* finite $C$, though psychological friction may vary.

  ***
  *Handout designed for Decision Theory Reading Group. v1.0*
