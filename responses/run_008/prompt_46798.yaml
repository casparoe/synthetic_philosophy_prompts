answer: |-
  You are not being thick. Your intuition that something slippery is going on is spot on. The quote you are referring to is by the American psychologist Edwin Boring, written in 1923. While it was a provocative philosophical point at the time, using it to dismiss modern psychometrics is a bit like quoting a 1920s physicist to claim that atoms aren't real because we can't see them with the naked eye.

  Your brother-in-law is relying on a logical sleight of hand. He is conflating *how we define a word* with *whether the thing exists*.

  Here is a breakdown of the four precise things that sentence could mean, ranked from harmless to harmful. You can take this list to the dinner table.

  ### 1. The Operationalist Stipulation ("Let's just agree on a label")
  *   **What it claims:** This is a bureaucratic move. It says, "For the purposes of this specific study, we are going to *define* the word 'intelligence' as 'the score obtained on this specific test'." It is an attempt to stop philosophers from arguing about the 'true essence' of the mind and just get on with measuring something.
  *   **Is it plausible?** Historically, yes. In the 1920s, this was a popular view in science (logical positivism). Today, it is largely outdated.
  *   **Does it support the circularity charge?** **Yes, but it doesn't matter.** If this is all the claim is, then yes, the definition is circular. However, it doesn't stop the test from predicting real-world outcomes. Even if I define 'hunger' as 'what this stomach-growl meter measures', the meter can still successfully predict who will eat a sandwich in the next ten minutes. The definition might be circular, but the *prediction* is not.

  ### 2. The Strong Reductionist Claim ("There is nothing in the brain")
  *   **What it claims:** This is the version your brother-in-law is likely using. It asserts that there is no underlying cognitive machinery, no neural efficiency, and no mental capacity. There is *only* the test score. Intelligence has no existence outside the testing room.
  *   **Is it plausible?** **No.** Modern neuroscience and cognitive psychology strongly disagree. We can correlate IQ scores with reaction times, working memory capacity, and even brain imaging data (like neural efficiency and cortical thickness). The test is sampling a real biological and cognitive reality; it is not creating it out of thin air.
  *   **Does it support the circularity charge?** **Yes, but the premise is false.** If intelligence were *nothing but* the test score, the argument would be valid. But since intelligence appears to be a real trait that *causes* the test score (rather than being identical to it), the circle is broken.

  ### 3. The Predictive Validity Defence ("It works, so who cares?")
  *   **What it claims:** This reading flips the quote on its head. It suggests: "Stop worrying about what intelligence *is*. Look at what the test scores *do*." If the test scores correlate with school grades, job performance, income, and health outcomes, then the test is measuring something meaningful, regardless of how we define the word.
  *   **Is it plausible?** **Yes.** This is the mainstream scientific view. IQ is one of the most statistically robust predictors of life outcomes we have.
  *   **Does it support the circularity charge?** **No. It destroys it.** Circularity implies the test tells you nothing outside the test room. But if the test score predicts university grades or job training success, it is by definition telling you something about the outside world. The circle is broken by external data.

  ### 4. The Latent Trait Realist View ("The thermometer analogy")
  *   **What it claims:** This posits that 'intelligence' is a latent trait (often called *g* or general factor) that exists independently. The test is merely an instrument designed to sample it, much like a thermometer samples temperature.
  *   **Is it plausible?** **Yes.** This is the standard model of psychometrics.
  *   **Does it support the circularity charge?** **No.** Imagine someone in the 1920s saying, "Temperature is just what the thermometer measures." They might argue it's circular. But if the mercury rises and the ice melts, the temperature is tracking a real physical property (kinetic energy of molecules). Similarly, IQ tests track cognitive processing power. The test does not create the intelligence; it reveals it.

  ### The Verdict on the Argument

  Your brother-in-law's argument relies entirely on **Interpretation 2** (that intelligence is nothing but the score), but he tries to win the debate using the logic of **Interpretation 1** (that it's just a definition).

  Here is the plain truth: **He is wrong.**

  The charge of circularity only holds if IQ tests fail to correlate with anything outside of themselves. They do not. They correlate with academic achievement, job performance, and even longevity. Because the test scores predict things they were not designed to measure (e.g., a test designed for school placement predicting car accident rates), the logic cannot be circular.

  **The Dinner Table Counter-Move:**
  Ask him this: *"If intelligence is only what the tests test, and the tests are circular, why do IQ scores predict who gets good grades, who performs well in complex jobs, and who stays out of prison? If the test measures nothing real, how does it predict real-world outcomes?"*

  If he admits the tests predict real-world outcomes, he has conceded that the tests measure something real, and his circularity argument collapses. If he denies they predict real-world outcomes, he is arguing against a century of statistical data.

  You were right to feel something was slippery. It was a philosophical bait-and-switch.
