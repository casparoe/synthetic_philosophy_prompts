      *   *Metaphysical:* If no fact, no evidence. (Supports friend, contested).

  5.  **Addressing the "Accounting" vs. "Disputing" Distinction:**

      *   *Disputing (Latin):* Focuses on argumentation, reason-giving, conflict.
      *   *Accounting (English):* Focuses on explanation, causality, rationalization.
      *   *Significance:* "Disputing" suggests a normative or pragmatic claim (don't fight). "Accounting" suggests a metaphysical or psychological claim (can't explain why). This shift allows the proverb to slide between "we shouldn't fight" and "there is no fact to fight about."

  6.  **Connecting to the Specific Epistemic Question (Testimony vs. Experience):**

      *   This is the "Acquaintance Principle" in aesthetics.
      *   *Consensus?* No. It's a live debate.
