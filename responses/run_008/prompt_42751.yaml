answer: |-
  You are right to be unsatisfied. Your intuition is correct: the proverb is a rhetorical Swiss Army knife that conceals a cluster of distinct philosophical claims. By treating them as a single unit, your friend was able to slide from a claim about *social etiquette* (we shouldn't fight) to a claim about *epistemology* (your belief isn't supported by my word) without justifying the transition.

  The shift from the Latin *disputandum* (disputing/arguing) to the English *accounting* (explaining/reasoning) is not merely translational drift; it changes the category of the claim. *Disputing* is a social activity; *accounting* is a cognitive or causal one. This ambiguity allows the speaker to imply that because we *cannot* explain taste (accounting), we *should not* argue about it (disputing), and therefore there *is* no fact of the matter to argue about (metaphysics).

  Here is the menu of distinct theses the proverb might express, classified by their philosophical status and their utility to your friend's specific argument.

  ### The Menu of Theses

  #### 1. The Psychological Intractability Thesis
  *   **Claim:** People rarely change their aesthetic preferences through argument or testimony.
  *   **Status:** **Platitude.** Empirically, this is mostly true. Telling someone a movie is good seldom makes them like it if they end up hating it.
  *   **Supports Friend's Move?** **No.** This explains why arguing is *futile*, but it does not explain why your friend's enthusiasm isn't *evidence*. Testimony can be evidence even if it fails to persuade (e.g., a trusted mechanic says your brakes are failing; you might not feel it yet, but you have evidence they are bad). This thesis stops the argument pragmatically but leaves the epistemic question open.

  #### 2. The Normative Etiquette Thesis
  *   **Claim:** It is socially inappropriate or rude to argue about personal preferences.
  *   **Status:** **Defensible Social Norm.** In many contexts, pressing someone on why they like a song is seen as intrusive.
  *   **Supports Friend's Move?** **No.** This tells you that you *ought not* to ask for evidence, not that the evidence *does not exist*. It shuts down the conversation, but it concedes that the question ("Is this good?") is meaningful, just impolite to debate.

  #### 3. The Metaphysical Subjectivity Thesis
  *   **Claim:** Aesthetic properties (beauty, goodness) do not exist in the object; they are projections of the viewer's mind. Therefore, there is no objective fact for testimony to track.
  *   **Status:** **Substantive and Contested.** This is a form of *Aesthetic Subjectivism* or *Error Theory*. Many philosophers argue against this, claiming aesthetic value is a real property (like shape or weight), even if it is response-dependent.
  *   **Supports Friend's Move?** **Yes.** If there is no fact of the matter about whether the film is "good," then her testimony cannot transmit knowledge of that fact. It can only transmit knowledge of *her* reaction.
  *   **Warning:** This is not a settled truth; it is a heavy metaphysical commitment disguised as a light proverb.

  #### 4. The Semantic Non-Cognitivist Thesis
  *   **Claim:** Sentences like "This film is good" are not truth-apt (they cannot be true or false). They are equivalent to saying "I like this film" or "Boo to this film."
  *   **Status:** **Substantive and Contested.** This is *Aesthetic Non-Cognitivism*. It is a live debate in meta-aesthetics whether aesthetic judgments express beliefs (which can be true/false) or attitudes (which cannot).
  *   **Supports Friend's Move?** **Yes.** If "This film is good" isn't the kind of sentence that can be true, then her saying it cannot provide you with evidence of its truth. It only provides evidence of her psychological state.
  *   **Warning:** Like Thesis 3, this is a contested philosophical theory, not a linguistic truism.

  #### 5. The Epistemic Acquaintance Thesis
  *   **Claim:** Aesthetic knowledge requires first-hand experience. Testimony is structurally incapable of transmitting aesthetic justification.
  *   **Status:** **Substantive and Contested.** This is known as the **Acquaintance Principle**. While historically influential (Kant argued something similar), contemporary epistemologists are divided. Some argue testimony *can* transmit aesthetic knowledge (just as it does for restaurants or statistics); others argue the "value" of art is in the experience of perceiving it, which cannot be testified to.
  *   **Supports Friend's Move?** **Yes.** This directly addresses your specific fight. It claims that even if the film *is* objectively good, you cannot *know* it is good through her word alone. You must see it to have the justification.
  *   **Warning:** This is the exact point you were fighting about. Using the proverb to prove this is circular; the proverb is just a slogan for this specific contested principle.

  ---

  ### The "Accounting" vs. "Disputing" Shift

  You noted the translation shift. Here is why it matters for the argument:

  *   **Latin (*Disputandum*):** Focuses on the **activity of argument**. This aligns with Theses 1 and 2 (Psychological/Normative). It says, "Don't fight."
  *   **English (*Accounting*):** Focuses on the **explanation of causes**. This aligns with Theses 3 and 4 (Metaphysical/Semantic). It says, "There is no reason to be found."

  When your friend used the Latin, she likely intended the normative force ("Stop disputing with me"). However, by invoking a proverb that is commonly understood in English as "there is no explanation," she borrowed the weight of the Metaphysical Thesis (Thesis 3) to make the Normative Thesis stick. She implied that the reason we shouldn't argue is that there *is nothing to argue about*.

  ### The Verdict on Usage

  **Which reading do people actually need mid-argument?**
  Almost universally, when people reach for this proverb mid-argument, they are relying on the **Normative Etiquette Thesis (Thesis 2)** but **borrowing the authority of the Metaphysical Subjectivity Thesis (Thesis 3).**

  They want the argument to stop (Normative). But saying "I don't want to talk about this" sounds weak or defensive. Saying "There is no fact of the matter here" (Metaphysical) sounds objective and final. The proverb allows them to assert the latter to achieve the former.

  **Does this support her claim that her enthusiasm isn't evidence?**
  Only if you accept the contested Metaphysical or Epistemic theses (3 or 5).
  *   If you are an **Aesthetic Realist** (beauty is real) and an **Epistemic Universalist** (testimony works for art like it does for restaurants), the proverb is **false** as applied to your specific question. Her enthusiasm *is* evidence, just as a friend's recommendation is evidence for a restaurant.
  *   If you accept the **Acquaintance Principle** (Thesis 5), then the proverb is a shorthand for a defensible claim: testimony gives you belief, but not *aesthetic knowledge*.

  ### The Specific Epistemic Question: Testimony vs. Experience

  You asked whether you can come to know a work is good through her word alone. This is the heart of the **Acquaintance Principle** debate.

  *   **The Settled View:** There is **no consensus**. It is a live debate in contemporary aesthetics and epistemology.
  *   **The "Transmission" View:** Some philosophers argue that if you trust your friend's judgment and she says the film is profound, you *do* have reason to believe it is profound, even before seeing it. You lack the *experience* of the profundity, but you possess the *knowledge* that it exists.
  *   **The "Acquaintance" View:** Others argue that aesthetic value is inseparable from the experience of it. To know the film is good *just is* to have the experience. Therefore, testimony is categorically different here than with a restaurant. A restaurant recommendation is about utility (will I be full/satisfied?); a film recommendation is about an experience I must have to verify the value.

  **How the Proverb Blurs This:**
  The proverb treats the **Acquaintance Principle** (a contested epistemic claim) as if it were a **Semantic Truism** (a definition of what "taste" means).
  *   **Your Friend's Move:** She used the proverb to suggest that because taste is "subjective" (Semantic/Metaphysical), her testimony carries no weight (Epistemic).
  *   **The Reality:** Even if taste were entirely objective, the Acquaintance Principle might still hold (you need to see it to know). Conversely, even if the Acquaintance Principle holds, her testimony could still be *evidence* (reason to go see it), just not *conclusive proof*.

  ### Summary for Your Next Conversation

  You were right to press the question. The proverb is a "conversation stopper" that functions by conflating distinct claims.

  1.  **If she means "We shouldn't fight" (Normative):** She is right, but she hasn't answered your question about evidence.
  2.  **If she means "You can't know it's good without seeing it" (Epistemic/Acquaintance):** She is taking a side in a live philosophical debate. She cannot use the proverb as if it were a settled fact to win the point.
  3.  **If she means "Goodness isn't real" (Metaphysical):** She is making a heavy philosophical claim that requires argument, not a proverb.

  **The Verdict:** The proverb does not settle whether her enthusiasm is evidence. At best, it asserts that aesthetic testimony is different from restaurant testimony (The Acquaintance Principle). But since that principle is contested, invoking the proverb is essentially begging the question: it assumes the very thing you were asking her to prove (that her word doesn't count as evidence).

  You can legitimately reply: *"The proverb says we shouldn't argue, but it doesn't prove that your testimony isn't evidence. If I trust your judgment, your enthusiasm is data. Whether that data counts as 'knowledge' or just 'reason to look' is exactly what we're debating, and 'de gustibus' just assumes your side of that debate without arguing for it."*
