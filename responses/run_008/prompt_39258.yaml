answer: |-
  **Thesis Proposal: The Diachronic Turn in Peer Disagreement**

  **(1) The Question**

  The central question of this thesis is whether the diachronic history of disagreements between epistemic peers alters the normative requirement to conciliate in a current dispute. Standard literature treats peer disagreement as a synchronic event: two agents, possessing equal evidence and reliability regarding a specific proposition *p*, discover a conflict in credence at time *t*. The normative debate subsequently turns on whether rationality requires lowering confidence (conciliationism) or permits maintaining it (steadfastness). This thesis challenges the synchronic assumption by asking: Does a track record of past disagreements constitute higher-order evidence that dynamically adjusts the "peerhood" status of the interlocutor, thereby permitting steadfastness in the present case?

  Crucially, the thesis narrows this inquiry to the recursive problem generated by such a move. If I appeal to a track record to justify steadfastness, my interlocutor can dispute the interpretation of that track record. If we disagree about who was right in past instances, we require a method to settle that disagreement. If that method relies on our relative peerhood, but our peerhood is exactly what the track record is meant to establish, the reasoning threatens to become viciously circular. Therefore, the precise question this thesis will settle is: *Can track-record evidence function as a legitimate defeater for the conciliationist requirement without triggering a vicious regress of meta-disagreements about the track record itself?* I aim to determine whether a "dynamic peerhood" model vindicates a restricted form of steadfastness or whether the recursion undermines the evidential value of past interactions entirely.

  **(2) Why the Standard Debate Leaves It Open**

  The existing dialectic between conciliationism and steadfastness leaves the diachronic dimension undertheorized, rendering both positions incomplete for real-world epistemic relationships. Conciliationist arguments, particularly those relying on the Independence Principle, typically isolate the current disagreement from the causal history of the agents' relationship. They argue that learning a peer disagrees with you is itself a piece of evidence that must be weighed independently of the reasoning behind your initial judgment. However, this framework treats "peerhood" as a static input fixed prior to the disagreement. It fails to account for the fact that in long-term intellectual partnerships, the status of "peer" is itself a hypothesis subject to Bayesian updating. If a conciliationist concedes that past performance matters for assessing reliability, they must explain why the current disagreement doesn't simply become another data point in a larger series that might eventually justify downgrading the peer status. By ignoring the iterated nature of disagreement, standard conciliationism risks being too demanding in cases where one agent has demonstrably outperformed the other historically, even if they are currently estimated as equals.

  Conversely, standard steadfast positions often rely on "right-reasoning" views or the claim of private access to one's own evidence. These views argue that I am permitted to remain steadfast because I have evaluated the evidence correctly and cannot rationally abandon that evaluation merely because someone else disagrees. While this allows for the possibility that I am the more reliable agent, it lacks a mechanism for *justifying* that claim over time. A steadfast view that ignores track records risks dogmatism; it provides no account of when I should admit that my consistent disagreement with a colleague indicates my own unreliability rather than theirs. By treating each disagreement as an isolated island, steadfastness fails to capture the epistemic obligation to learn from long-term patterns of error.

  Furthermore, the standard debate assumes that the fact of disagreement is mutually acknowledged and clearly defined. It presumes both parties agree on what the disputed propositions were and what the outcomes turned out to be. In iterated disagreement, this assumption breaks down. Parties often disagree not only about the current proposition but about the resolution of past disputes. The standard literature lacks the resources to handle "meta-disagreement"—disagreement about the history of disagreement. Because neither camp adequately models the feedback loop between current credence and historical reliability assessments, the question of whether a track record justifies steadfastness remains officially open. This thesis fills that gap by formalizing the recursive structure that both positions currently overlook.

  **(3) Approach**

  The thesis will proceed by constructing a series of progressively complex cases designed to stress-test the "track-record defeater." The method will be conceptual analysis supported by informal Bayesian modeling of reliability updating. I will not develop a full formal epistemology, but will use probability structures to illustrate the flow of evidence.

  *Case 1: The Agreed Scorecard.* I will first analyze a scenario where two agents disagree on *p*, but agree perfectly on the history of past disagreements and their resolutions (e.g., via third-party verification). This establishes the baseline: if we agree I have been right 90% of the time in the past, does rationality permit me to weight my current judgment more heavily? This case isolates the effect of track-record evidence from the problem of meta-disagreement. The goal here is to show that, in principle, conciliationism must allow for dynamic peerhood adjustment.

  *Case 2: The Disputed Scorecard.* I will then complicate the model by removing the third-party verification. Here, the agents disagree on *p*, and they also disagree on who was right in the majority of past cases. I claim to have won the past rounds; you claim you have. This case is meant to demonstrate the onset of recursion. To settle the current disagreement, I appeal to the past; to settle the past, we need to resolve a prior disagreement. I will argue that this forces the agents into a higher-order evaluation of their respective abilities to judge past outcomes.

  *Case 3: The Foggy Memory.* The final case introduces divergence in memory regarding the content of past propositions. Here, we disagree not only on who was right, but on what the questions were. This is designed to test the limits of the recursion. If the track record is inaccessible without prior agreement on peerhood, and peerhood is inaccessible without the track record, the system may lock.

  For each case, I will apply the "Dynamic Peerhood" hypothesis: that rational credence is a function of current evidence weighted by a reliability coefficient updated by past performance. I will trace whether this hypothesis leads to convergence (both agents eventually agree on who is more reliable) or polarization (the recursion entrenches their initial positions). The approach relies on showing that the "independence" required by conciliationism is impossible to maintain in iterated contexts, forcing a modification of the view.

  **(4) What a Result Looks Like, and What Failure Looks Like**

  A successful result for this thesis will be a qualified defense of "Diachronic Steadfastness." This position would hold that track-record evidence is admissible and potent, but only if the disagreement about the track record is less severe than the disagreement about the object-level proposition. The thesis would conclude that rational agents can remain steadfast in the face of peer disagreement if they possess a robust, mutually acknowledged history of reliability, but that in the absence of such agreement, the recursive pressure forces a return to conciliationism to avoid epistemic circularity. Essentially, a positive result defines the specific conditions under which the recursion is benign: where the evidence of the track record is strong enough to break the symmetry of the meta-disagreement.

  Failure would take one of two forms. The first is "Vicious Recursion": demonstrating that any appeal to a track record necessarily presupposes a resolution of the very disagreement the track record is meant to settle. If I cannot assess my past performance without assuming I am reliable, and I cannot assume I am reliable without assessing my past performance, the Dynamic Peerhood model collapses. In this scenario, the thesis would conclude that iterated disagreement undermines the normative force of peerhood entirely, leaving agents with no rational method for resolution other than dogmatism or skepticism. The second form of failure is "Triviality": showing that the diachronic model simply reduces to the synchronic model over a larger set of evidence. If the history of disagreement is just "more evidence" about *p*, then the standard views already cover it, and the thesis contributes nothing new. I will guard against this by emphasizing that the history is evidence about *reliability*, not directly about *p*, which changes the structural logic of the update.

  **(5) Fitting It In a Semester**

  Given the 8000-word limit, scope management is critical. I will restrict the analysis to binary credence states (belief/disbelief or high/low confidence) rather than continuous probability distributions to avoid getting bogged down in technical formalism. The literature review will be minimized to only those arguments establishing the synchronic baseline; I will not trace the historical development of the peer disagreement debate. If the argument balloons, I will cut Case 3 (The Foggy Memory). While interesting, the core recursive problem is fully present in Case 2 (The Disputed Scorecard). Case 3 serves only to strengthen the intuition of collapse, which can be argued conceptually without a dedicated case study. I will also avoid engaging with specific applications (e.g., political polarization or religious disagreement) to keep the focus strictly on the epistemic norms. The goal is a tight, structural argument about the conditions of rational updating in iterated contexts, rather than a broad survey of disagreement phenomena.
