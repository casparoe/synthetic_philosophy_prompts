answer: |-
  The argument your flatmate is championing is a classic example of **equivocation on the copula** (the word "is"), specifically confusing *class membership* with *conceptual identity*. It is a sophisticated piece of sophistry, but logically unsound under standard interpretation.

  Here is the breakdown of where it goes wrong, the cost of fixing it, and the verdict on the linguistic escape hatch.

  ### The Diagnosis: Intension vs. Extension
  The core error lies in confusing the **intension** of a term (its definition or criteria for application) with its **extension** (the actual set of objects it refers to).

  *   **Intension:** "Horse" is defined by shape; "White" is defined by color. These are different criteria.
  *   **Extension:** The set of "horses" includes black, yellow, and white horses. The set of "white horses" includes only white horses.

  Gongsun Long's argument (and your flatmate's paraphrase) correctly identifies that the *concepts* are different (Intension). However, it fallaciously infers that because the concepts differ, the *objects* falling under them must be mutually exclusive (Extension).

  ### The Guilty Step
  **Step (4)** is the logical linchpin that fails: *"When two terms name by different criteria, whatever satisfies one does not satisfy the other."*

  This premise asserts that if Definition A $\neq$ Definition B, then Object satisfying A $\neq$ Object satisfying B. This is demonstrably false. Consider "Featherless biped" and "Human." The criteria are different, but the same objects satisfy both. Step (4) claims that because "white horse" adds a color constraint to "horse," the resulting object ceases to be a member of the "horse" category. In reality, adding a constraint creates a **subset**, not a disjoint set. A white horse is a member of the set "horses" *and* the set "white things."

  ### The Cost of Rejection
  If your flatmate rejects Step (4), she must abandon the idea that distinct names imply distinct ontological categories. She loses the "purity" of names that Gongsun Long is defending (where every name maps to a unique, non-overlapping essence).
  *   **Cost:** She must accept standard hierarchical classification. She has to admit that specific subsets inherit the properties of general sets (a white horse *is* a horse, a horse *is* an animal). Her claim that "a horse is not an animal" becomes untenable, as she would have to acknowledge that while the *concept* 'horse' is not identical to the *concept* 'animal', any individual horse is indeed a member of the class 'animal'.

  ### The "Fei" (Is Not) Escape Hatch
  Is the claim that *fei* means "is not identical to" rather than "is not a member of" a real solution?
  In the context of Gongsun Long's original text, this is a defensible philosophical position: he is arguing about the **names**, not the **animals**. He means "The concept 'white-horse' is not identical to the concept 'horse'." That is trivially true.

  However, your flatmate is applying this to physical reality ("her left hand is not a body"). In this context, the *fei* distinction is a **dodge**. It exploits the ambiguity of language to make a trivial semantic truth ("the words mean different things") sound like a shocking ontological falsehood ("the object isn't part of the group"). If she accepts the practical implications (that you can't treat a white horse as a horse), she is relying on the "member of" meaning. If she retreats to the "identical to" meaning when challenged, she is changing the rules to avoid absurdity.

  ***

