    "diagnosis": "This premise falsely equates intensional difference (different definitions) with extensional exclusion (no shared objects). Terms can have different criteria for application while still applying to the same subset of things.",
    "cost": "She loses the ability to claim distinct concepts imply disjoint categories, forcing her to accept standard hierarchical classification where subsets belong to supersets.",
    "parity_cases": [
      {
        "case": "A red traffic light is not a light.",
        "absurd": true
      },
      {
        "case": "The concept 'red' is not identical to the concept 'colour'.",
        "absurd": false
      }
    ],
    "fei_verdict": "dodge",
    "reason": "It resolves the paradox only by shifting the claim from ontological membership to conceptual identity, which contradicts the practical implications she accepts."
  }
