prompt: |-
  I'm a PhD student in computer graphics, mostly real-time rendering work -- level-of-detail systems, culling, procedural generation, that kind of thing. I've read the pop-science summaries of Bostrom's simulation argument and my honest first reaction is that it seems obviously right in a boring way: of course you'd only simulate what the player is looking at, we build whole careers on not computing what nobody sees. But I suspect I'm pattern-matching my day job onto the argument rather than understanding it.

  So here's the ask: restate the simulation argument (the actual trilemma, not the Matrix-adjacent vibes) in the vocabulary I actually use -- view frustum culling, LOD, procedural content generation, lazy evaluation, floating-point precision, memory and compute budgets, on-demand streaming, deterministic lockstep. Do it as faithfully as you can, and don't smuggle in assumptions from my world and call them translation. Like, if "simulators have finite compute" is doing different work in the argument than "we cull to a frame budget" is doing in my job, I want that flagged, not papered over.

  Then I want the residue report: which parts of the argument translate cleanly, which parts get distorted to fit (my guess is the premise that ancestor simulations would be cheap and plentiful, since in my world "simulate a whole civilization" is not a thing you just batch-render), and which parts have no counterpart in engine terms at all. My bet is the anthropic reasoning is where my vocabulary just runs out -- I can't write "I am a sample from a reference class" as a render pass -- but maybe it's substrate independence instead, or something I haven't thought of. For the parts that don't translate, tell me whether that's a defect of my vocabulary or a sign the original claim was less clear than its fans think. That distinction is really what I care about most.

  Also, as you go, flag how confident you are in the big translation calls, and at the end explicitly single out the point you're least sure about. I'd much rather know where the translation is shaky than get a smooth story -- smooth stories are what the pop summaries already gave me.
