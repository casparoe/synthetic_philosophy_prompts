answer: |-
  This is one of the deepest rabbit holes in decision theory, touching on probability, economics, and statistical physics. You have correctly identified the tension: **Kelly maximizes the *typical* outcome (the median), while "bet-it-all" maximizes the *average* outcome (the mean).**

  Here is the gut-level explanation of how these coexist, followed by an analysis of the ergodicity debate.

  ### 1. The Paradox: How Kelly is "Poorer" on Average but "Richer" Almost Surely

  To understand this, you must distinguish between the **ensemble average** (what happens across many parallel universes) and the **time average** (what happens to one person over many steps).

  #### The Mechanism: The Skew of Multiplicative Processes
  Imagine a coin flip where you win 60% of the time (doubling your bet) and lose 40% of the time (losing your bet).
  *   **The "Bet-It-All" Strategist:** If you bet 100% of your bankroll every time, your wealth after $N$ bets is $W_N = W_0 \cdot 2^N$ *if* you win every time. If you lose even once, $W_N = 0$.
      *   **Expected Wealth:** $E[W_N] = (0.6 \times 2 + 0.4 \times 0)^N = 1.2^N$. This grows exponentially.
      *   **Probability of Survival:** The chance you survive $N$ bets is $0.6^N$. As $N \to \infty$, this probability goes to **zero**.
      *   **The Trick:** The expectation $1.2^N$ is being carried entirely by the vanishingly rare path where you win *every single time*. In 99.99...% of universes, you are broke. In 0.00...01% of universes, you are astronomically rich. That single outlier path pulls the arithmetic mean up so high it exceeds the Kelly bettor's mean.

  *   **The Kelly Strategist:** Kelly tells you to bet 20% ($f^* = p - q = 0.6 - 0.4$).
      *   **Expected Wealth:** Lower than the bet-it-all strategist at any finite $N$.
      *   **Typical Wealth:** You rarely go to zero. Your wealth grows at the geometric rate. As $N \to \infty$, the ratio of Kelly wealth to any other strategy's wealth goes to infinity with probability 1.

  #### Why the Law of Large Numbers (LLN) Doesn't "Wash It Out"
  Your intuition suggests that as $N$ grows, things should smooth out. They do, but only for the **logarithm** of wealth.
  *   Wealth is multiplicative: $W_N = W_0 \cdot \prod (1 + f r_i)$.
  *   Log-wealth is additive: $\ln W_N = \ln W_0 + \sum \ln(1 + f r_i)$.
  *   The LLN applies to the sum. Therefore, $\frac{1}{N} \ln W_N$ converges to the expected log-growth rate. This determines the **geometric mean** (the median outcome).

  However, the **arithmetic mean** (expected wealth) is dominated by the tail. In multiplicative processes, the distribution of wealth becomes **log-normal**. As $N$ increases, the log-normal distribution becomes infinitely skewed. The mean moves infinitely far away from the median.
  *   **The Median (Kelly):** Represents the path you will *actually* experience.
  *   **The Mean (Bet-It-All):** Represents a fantasy path you will *almost certainly not* experience, but which pays out so much it distorts the average.

  **Gut Level:** The "Bet-It-All" expected wealth is a lie told by a lottery ticket that almost never wins but pays out infinity. Kelly ignores the lottery ticket and focuses on the paycheck you actually get.

  ---

  ### 2. Samuelson vs. Ergodicity: Taste or Physics?

  This is the philosophical core of your question. Is Log Utility a preference (Samuelson) or a physical necessity (Ergodicity)?

  #### The Samuelson Critique (The "Taste" Argument)
  Paul Samuelson argued that maximizing the geometric mean (Kelly) is not a universal law. It is simply **Expected Utility Theory (EUT)** with a specific utility function: $U(W) = \ln(W)$.
  *   **Finite Horizon:** Samuelson pointed out that the "long run" is a misleading concept. If you go bust at step 50, the asymptotic dominance at step 1,000,000 is irrelevant.
  *   **Subjectivity:** If an agent has a utility function $U(W) = W$ (risk-neutral), they *should* bet it all. If they have $U(W) = \sqrt{W}$ (more risk-averse), they should bet less than Kelly.
  *   **Conclusion:** Kelly is not "objective." It is just one specific risk preference among many. To claim Kelly is "optimal" is to sneak in a logarithmic utility assumption without admitting it.

  #### The Ergodicity Defense (The "Physics" Argument)
  Proponents like Ole Peters argue that standard economics confuses **ensemble averages** (parallel universes) with **time averages** (one life).
  *   **Non-Ergodicity:** Wealth dynamics are non-ergodic. The average wealth of 1 million people betting once $\neq$ the wealth of 1 person betting 1 million times.
  *   **The Claim:** Since we live in one universe over time, the **time-average growth rate** is the only objective measure of performance.
  *   **The Log:** Maximizing time-average growth *mathematically requires* maximizing the expected logarithm of wealth.
  *   **Conclusion:** The logarithm is not a psychological preference; it is forced upon us by the multiplicative structure of reality. You don't *choose* log utility; the universe *imposes* it if you want to survive and grow.

  #### Does Ergodicity Rival EUT or Redscribe It?
  This is the subtle distinction.
  1.  **Mathematically:** It **redescribes** it. Maximizing time-average growth yields the exact same betting fraction as maximizing Expected Log Utility. The optimization problem is identical.
  2.  **Conceptually:** It **rivals** the *justification*. EUT says, "You bet Kelly because you are risk-averse." Ergodicity says, "You bet Kelly because betting otherwise leads to lower growth rates in time, regardless of your feelings."

  The ergodicity argument attempts to move the logarithm from the **agent** (subjective utility) to the **environment** (objective dynamics). It claims that for multiplicative processes, $U(W) = W$ is physically incoherent for a single agent over time, because $E[W]$ is not an observable quantity for that agent.

  **Verdict:** The ergodicity argument is powerful because it explains *why* log utility is so prevalent in nature (biology, evolution) without assuming complex psychology. However, it does not invalidate EUT; it merely provides a physical derivation for a specific utility function.

  ---

  ### 3. The Evidence of Fractional Kelly

  If the ergodicity argument were the whole truth, **Full Kelly** would be the only rational strategy. Any deviation would be suboptimal growth. Yet, almost no professional investors bet Full Kelly. They bet **Fractional Kelly** (e.g., Half-Kelly). What does this imply?

  #### Why Fractional Kelly?
  1.  **Parameter Uncertainty:** Kelly assumes you know the edge ($p$) exactly. In reality, your estimate of the edge is noisy. If you overestimate your edge and bet Full Kelly, you are effectively betting *over*-Kelly, which reduces growth and increases ruin risk. Fractional Kelly is a robustness buffer against estimation error.
  2.  **Drawdown Tolerance:** Full Kelly can result in 50% drawdowns. Even if the time-average growth is optimal, the *volatility* of the path might force an investor to quit (margin calls, psychological stress).
  3.  **Utility Curvature:** It may simply be that humans are more risk-averse than $\ln(W)$.

  #### What This Says About the Dispute
  The popularity of Fractional Kelly suggests that **neither side has the complete monopoly on truth.**

  *   **Against Pure Ergodicity:** If time-average growth were the *only* objective metric, Fractional Kelly would be objectively wrong (it grows slower). The fact that rational agents choose it suggests they are optimizing something else—perhaps a utility function that penalizes volatility more than log utility does (e.g., $U(W) = W^{0.5}$). This supports Samuelson's view that utility is subjective.
  *   **Against Pure Samuelson:** However, the fact that investors cluster *around* Kelly (e.g., Half-Kelly) rather than betting 1% or 100% suggests the logarithmic dynamic is a strong "gravitational pull." It implies that while risk aversion varies, the multiplicative structure of the market constrains rational betting to the neighborhood of the log-optimal point.

  ### Summary

  1.  **The Paradox:** Kelly bettors are richer "almost surely" because the distribution of wealth becomes infinitely skewed. The "Bet-It-All" expected wealth is driven by a set of paths with probability approaching zero but payoff approaching infinity. The LLN converges the *log* wealth (median), not the *arithmetic* wealth (mean).
  2.  **Ergodicity vs. Utility:** The ergodicity argument does not change the math (Kelly = Max Expected Log), but it changes the metaphysics. It argues Log Utility is a law of thermodynamics for money, not a psychological quirk.
  3.  **Fractional Kelly:** This is the tie-breaker. It suggests that while the ergodic/log dynamic sets the *scale* of optimal betting, subjective risk preferences (Samuelson) and parameter uncertainty determine the *fraction*.

  **The Synthesis:** The logarithm is indeed forced by the multiplicative dynamics (Ergodicity is right about the *structure*), but the *coefficient* on that logarithm is determined by the agent's tolerance for volatility and uncertainty (Samuelson is right about the *preference*). Full Kelly is the physical limit of growth; Fractional Kelly is the human optimization of survival.
