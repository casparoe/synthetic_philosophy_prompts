answer: |-
  1. **The Modal Logic:** Your roommate is wrong, and you are right. He is using a **backtracking counterfactual**, where he changes the past (your disposition, habits, and type) to make the present action (skipping) consistent. That is the wrong tool for decision-making. When you deliberate, you must treat your internal state as fixed and ask what happens if you intervene on the action alone. This is an **interventionist counterfactual** (or non-backtracking). The cleaner setup is: Hold fixed everything intrinsic to you (your discipline, your knowledge base, your preference for Friday night) and vary *only* the binary variable of attendance. Compare $Grade(You, Attend)$ vs. $Grade(You, Skip)$. Your roommate is answering "What grade do people who skip get?" while you are asking "What grade do *I* get if I skip?" Those are different questions, and only yours is relevant to a choice you are currently making.

  2. **The TA's Number:** The number is **causally inflated but evidentially real.** It is not junk, but it is not the pure causal effect of the session. It is the sum of the causal benefit (the motor) plus the selection bias (the mirror). Students who go are more motivated, and motivation also raises grades independently of the session. Therefore, you cannot treat the half-grade boost as a guaranteed return on investment for *you* specifically. However, it is not meaningless; it sets an **upper bound** on the benefit. It tells you that attending is part of a high-performance strategy, even if some of that performance comes from the kind of person who attends. Dismissing it as "meaningless" ignores that the session might provide structure, Q&A clarification, or forced retrieval practice that self-study lacks, even if the raw content is identical.

  3. **Bottom Line:** **You go.** Here is why: Your roommate's argument leads to fatalism—if your actions are just mirrors of your type, you can never decide to change your outcome. Reject that. You are an agent who can intervene. While the TA's number is inflated, the causal component is almost certainly non-zero; review sessions reinforce retention and clarify nuances even when content overlaps with lecture. The opportunity cost is one Friday night; the benefit is a permanent grade boost that could impact GPA, scholarships, or grad school prospects. Even if the true causal effect is only a quarter-letter grade instead of a half, the expected value of attending outweighs the temporary utility of the alternative plan. You hold your habits fixed, you intervene on your attendance, and you take the edge the data suggests is there.
