      *   Marta is right about *method-dependence*, perhaps too sceptical about *convergence*.

  6.  **Identify Missing Perspectives:**
      *   **Predictive Power:** Can we use these features to predict behaviour on *unseen* tasks without further tuning? (The "grokking" or "generalisation" test).
      *   **Downstream Utility:** Does believing they are real help us build safer models? (Pragmatic justification).
