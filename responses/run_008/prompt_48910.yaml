answer: |-
  This is a splendid dispute, and frankly, it is one of the most substantive questions currently facing the field. You have been asked to adjudicate a debate that touches on the philosophy of science as much as machine learning. Neither Dan nor Marta is entirely wrong, but they are arguing past one another about different categories of claim: Dan is arguing for *causal efficacy*, whilst Marta is arguing against *ontological primitivism*.

  Here is my adjudication of the four moves, followed by an assessment of the core objections and what is missing from their framework.

  ### Move-by-Move Adjudication

  **Move 1 (Dan): Causal Intervention as Proof of Reality**
  *Verdict: Dan is partially right, but overreaching.*
  Dan is correct that causal steering is the gold standard for establishing relevance. If manipulating a vector reliably produces a semantic shift, that direction is undeniably *causally efficacious*. In neuroscience, stimulating a region and observing a behaviour is strong evidence of function. However, Dan makes a category error by equating "causally useful direction" with "discrete computational unit the network uses." One can steer a system using a handle that the system itself does not recognise. For example, you can steer a car by pushing the side of it, but that does not mean the car "has" a "side-push mechanism." Dan proves the feature is a valid *control*, not that it is a native *component*.

  **Move 2 (Marta): Method-Relative Decompositions**
  *Verdict: Marta is righter.*
  This is the stronger philosophical objection. Sparse Autoencoders (SAEs) are lossy compression algorithms with hyperparameters (sparsity penalties, dictionary sizes). If the "features" were atomic truths of the network, they should be robust to reasonable changes in these parameters. The fact that changing the $L_1$ penalty fragments or merges features suggests they are descriptive projections rather than discovered atoms. Marta's constellation analogy is apt: the stars (activations) are real, but the constellations (features) are drawn by the observer to make sense of the sky. She correctly identifies that Dan is conflating the map with the territory.

  **Move 3 (Dan): Convergence and Basis Independence**
  *Verdict: Dan has a point, but the physics analogy is strained.*
  Dan is right to point out that robustness across independent runs lends credibility. If five teams find a "bridge" feature, it is unlikely to be pure noise. However, his physics analogy is slightly misleading. In physics, changing the basis (e.g., position vs. momentum) preserves the underlying observables. In SAEs, changing the hyperparameters often changes the *semantics* of the features themselves, not just the mathematical representation. Furthermore, convergence could simply indicate that all methods are converging on the same *human-interpretable* subspace, rather than the network's native computational subspace. It is evidence, but not the slam-dunk proof he claims.

  **Move 4 (Marta): Shared Assumptions and Apophenia**
  *Verdict: Marta is decisively right.*
  This is the critical blow. The entire mechanistic interpretability community largely operates under the "linear representation hypothesis" and the assumption of sparsity. If the network actually computes using dense, holographic, or non-linear combinations, SAEs will still force a sparse decomposition, and we will simply pat ourselves on the back for finding the "best" sparse lie. Furthermore, her point on labelling is vital. We name features that look like bridges; we ignore the thousands of features that look like noise. This selection bias creates an illusion of interpretability. We are not discovering what the network is; we are discovering what the network *can be made to look like* to a human.

  ### The Core Objections: Causal Steering vs. Method Relativity

  If one must weigh the two core positions, **Marta's objection is the stronger one.**

  Dan's argument rests on a pragmatic definition of truth: "If it walks like a duck and quacks like a duck, it is a duck." This is useful for engineering, but dangerous for science. It risks reifying tools into entities. Just because a principal component explains variance, or an SAE feature steers output, does not mean the network *uses* that feature to compute. It may merely be that the feature lies in a subspace that overlaps with the true mechanism.

  Marta's argument highlights the *underdetermination* of the theory by the data. Multiple incompatible feature sets can explain the same behaviour. In the absence of a "ground truth" (i.e., access to the network's actual training code or evolutionary pressure), claiming ontological reality is premature. We are reverse-engineering a black box without the schematic; claiming we have found the transistors because we found levers that work is a leap.

  However, Dan should not be dismissed entirely. Even if features are "made-up constellations," they are constellations that allow us to navigate. If the goal is safety and control, Dan's realism is a useful fiction. If the goal is understanding cognition, Marta's scepticism is necessary rigour.

  ### What They Are Missing

  To move this debate forward, both researchers need to step outside the "real vs. fake" dichotomy and consider three missing elements:

  1.  **Predictive Validity vs. Explanatory Fit:**
      Currently, features are validated by how well they explain *past* behaviour (retrodictive). The stronger test is prediction. Can we use the "bridge" feature to predict how the model will behave on a *novel* task involving bridges, without further tuning? If the features are merely descriptive fits, they should fail on out-of-distribution generalisation. If they are causal mechanisms, they should hold. Neither Dan nor Marta mentioned this distinction.

  2.  **The "Use-It-or-Lose-It" Test:**
      To prove a feature is ontologically real (part of the network's computation), one should demonstrate that the network *cannot* perform its task without it. Dan showed that adding the feature changes output. He did not show that *ablating* the feature degrades performance on the specific task the network was trained to do. If you kill the "bridge" feature and the model still identifies bridges perfectly using other pathways, the feature is a redundant correlate, not a computational primitive.

  3.  **Pragmatic Realism:**
      They are arguing as if there is a binary state of "real." In complex systems, reality is often a matter of grain. A "feature" might not be a single neuron, but it might be a robust subspace. They should adopt a stance of *pragmatic realism*: the features are real enough if they allow us to reliably audit and steer the model. The question shouldn't be "Is this feature in the code?" but "Is this abstraction stable enough to build safety guarantees upon?"

  ### Conclusion for the Lab

  If I were to settle the lunch bet: **Marta wins on the science, Dan wins on the engineering.**

  Marta is correct that claiming the network "has" these representations is ontologically premature and arguably false. The features are likely artefacts of our decomposition methods imposed upon a high-dimensional manifold. However, Dan is correct that they are causally potent tools.

  My advice to you as an intern: Do not try to solve the philosophy. Instead, design an evaluation that tests the *stability* of these features. Take the "bridge" feature, retrain the SAE with a different random seed and a different sparsity penalty, and measure the cosine similarity of the resulting vectors. If the similarity is high, Dan's convergence argument holds water. If it is low, Marta's "constellation" critique is vindicated. That is data, and data is the only thing that will quieten them both.
