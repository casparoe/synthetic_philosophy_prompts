answer: |-
  # QUESTION-PERIOD PREPARATION SHEET
  **Workshop:** Interdisciplinary Workshop on Voluntary Action
  **Speaker Thesis:** Dennett's "worth wanting" and the Neuroscientific "accumulator model" are the same manoeuvre: trading metaphysics for engineering/stipulation. This is sound but admits "free will" is a stipulation, not a discovery.

  ---

  ### 1. THE EIGHT LIKELY OBJECTIONS (Ordered by Damage Potential)

  **1. The "Bait-and-Switch" Charge (Incompatibilists)**
  *   **Vocabulary:** "Ultimate responsibility," "sourcehood," "changing the subject," "compatibilist evasion."
  *   **The Objection:** "You admit this is a stipulation. If free will is just a label we apply to systems that meet certain engineering criteria, you haven't addressed the *real* worry: could I have done otherwise given the exact same past and laws? By redefining the term, you haven't solved the problem of moral desert; you've just erased it."
  *   **Reply (2 mins):** You are correct that I am not solving the problem of *ultimate* responsibility. That is precisely my point. The "real worry" you cite is a demand for a metaphysical ghost in the machine. My claim is that both Dennett and the neuroscientists have realized that "ghost" is a bug, not a feature. We aren't erasing moral desert; we are grounding it in the only currency that exists: actual control mechanisms. If you demand a magic power to break the causal chain, you will remain unsatisfied. But the law and our interpersonal practices don't require magic; they require reliable responsiveness to reasons. I am not evading the question; I am dissolving the presupposition that makes the question unanswerable.
  *   **Candid Note:** *Soft spot:* This reply concedes the incompatibilist's main point (no ultimate responsibility) and hopes the audience accepts "reasons-responsiveness" as a sufficient substitute. It risks looking like a deflationary shrug to those who feel moral luck deeply.

  **2. The "Empirical Realist" Rebuttal (Neuroscientists)**
  *   **Vocabulary:** "Signal detection," "model fit," "ontological commitment," "interpretive overreach."
  *   **The Objection:** "You are conflating our models with philosophical positions. When we model the readiness potential as a stochastic accumulator, we aren't making a stipulation about 'free will.' We are reporting where the decision signal crosses threshold. Whether that counts as 'freedom' is your problem, not ours. We are discovering mechanisms, not engineering definitions."
  *   **Reply (2 mins):** I am not accusing you of doing philosophy bad; I am accusing you of doing it implicitly. When you publish a paper titled "The Neuroscience of Voluntary Action" and conclude that consciousness is 'post-decisional,' you are making a claim about the *location* of agency. To say the brain decides before the mind is to assume a metaphysics of mind-brain relations. By reframing the decision as an accumulation process rather than a 'moment of will,' you are implicitly rejecting the libertarian agent. You may call it 'discovery,' but the moment you map that data onto the concept of 'volition,' you have engaged in conceptual engineering. You cannot have the authority of science without the responsibility of its philosophical implications.
  *   **Candid Note:** *Soft spot:* You are vulnerable here. They *do* know the data better than you. If they press on specific parameter fittings, you must pivot back to the *interpretation* of the parameters, not the parameters themselves.

  **3. The "Conceptual Evolution" Defense (Dennettians)**
  *   **Vocabulary:** "Folk psychology," "competence without comprehension," "user-illusion," "conceptual refinement."
  *   **The Objection:** "It isn't a 'stipulation' in the arbitrary sense. It's an evolution of the concept. We aren't changing the subject; we are improving the definition to match reality. 'Free will' has always meant 'control sufficient for responsibility,' even if laypeople think it means magic. We are clarifying, not stipulating."
  *   **Reply (2 mins):** That is the standard move, but it masks the discontinuity. If the layperson (and the incompatibilist) means "uncaused cause," and you mean "complex control system," you are not clarifying; you are replacing. Calling it 'evolution' softens the blow, but the price remains: you are asking us to stop looking for the thing we thought we were looking for. My thesis is that we should be honest about that replacement. Call it evolution if you like, but acknowledge that for the person worried about determinism, you have given them a different product than the one they asked for.
  *   **Candid Note:** *Soft spot:* This risks alienating your naturalist allies. You need them to feel you are on their side, just more honest. Don't push this too hard or you lose the room's center.

  **4. The "Veto Power" Empirical Shield (Neuroscientists)**
  *   **Vocabulary:** "Free won't," "inhibitory control," "temporal window," "cancellation."
  *   **The Objection:** "Libet himself allowed for a 'veto.' Later work shows conscious intervention is possible before the point of no return. So consciousness isn't epiphenomenal. We don't need to stipulate definitions; the data shows top-down control exists."
  *   **Reply (2 mins):** I am happy to grant that inhibitory control exists. But notice what happened: we moved from 'Free Will' (initiating action) to 'Free Won't' (stopping action). This is exactly the engineering shift I am describing. We are cataloging specific control loops. This is valuable science! But it is not a discovery of *The Power of Free Will*. It is a discovery of *braking mechanisms*. By retreating to the veto, you are implicitly admitting the 'initiation' model failed. You are saving the phenomenon by redesigning it. That supports my thesis: you are adjusting the design criteria to save the concept.
  *   **Candid Note:** *Soft spot:* They know the millisecond timings better than you. Do not get dragged into the "point of no return" debate. Keep the focus on the *conceptual shift* from initiation to inhibition.

  **5. The "Manipulation Argument" Specific (Incompatibilists)**
  *   **Vocabulary:** "Direct manipulation," "history of the agent," "bypassing," "integrity."
  *   **The Objection:** "Your engineering criteria fail the manipulation test. If a neuroscientist stimulates your accumulator to threshold, you act exactly as if you are free. But you aren't. Your 'control' criteria cannot distinguish between a healthy brain and a manipulated one. So the definition is insufficient."
  *   **Reply (2 mins):** The manipulation argument relies on the intuition that history matters for responsibility. I concede that for *ultimate* responsibility, it does. But for *practical* responsibility, the internal architecture is what matters to the victim and the observer. If the manipulation is undetectable to the agent, the agent is functionally identical. My point is that 'free will' is a label we apply to systems that function autonomously *from our perspective*. If you demand a definition that rules out perfect manipulation, you are demanding a definition that rules out any physical system. I am choosing to keep the term for systems that work, not systems that are metaphysically unique.
  *   **Candid Note:** *Soft spot:* This is the hardest philosophical hit. You are essentially saying "If the manipulation is hidden, it doesn't count." Many find this morally repugnant. Be prepared for silence here.

  **6. The "Verbal Dispute" Dismissal (Deflationist)**
  *   **Vocabulary:** "Expressivism," "non-cognitive," "metaphysical excess," "terminological."
  *   **The Objection:** "If you agree it's all stipulation, why does it matter? You're just fighting over who gets to use the label 'free will.' Isn't this just a verbal dispute? We should just drop the term and talk about 'voluntary control'."
  *   **Reply (2 mins):** It matters because the label carries normative weight. 'Voluntary control' is a technical description; 'Free Will' is a moral passport. If we drop the term, we risk losing the protective intuition that agents are more than sums of their parts. My goal isn't to win the word game; it's to show that the word game is the only game left. If we drop the term, the incompatibilists win by default because they keep the magic definition. We need to reclaim the term by admitting its engineered nature.
  *   **Candid Note:** *Soft spot:* The deflationist might be right. You might be investing too much emotion in a label. If they press "Why not just drop it?", you need a strong pragmatic reason not to.

  **7. The "Design Stance" Category Error (Neuroscientists)**
  *   **Vocabulary:** "Personal vs. Sub-personal," "Marr's levels," "homunculus," "category mistake."
  *   **The Objection:** "You are mixing levels of analysis. Dennett works at the personal level (agents); we work at the sub-personal level (neurons). You can't say we are making the same move because we aren't even talking about the same objects."
  *   **Reply (2 mins):** In isolation, you are right. But the workshop is on 'Voluntary Action.' That is a personal-level concept. The moment you publish findings on 'Voluntary Action' based on neuronal data, you are bridging the levels. You are claiming the sub-personal data explains (or explains away) the personal phenomenon. My thesis is that when you make that bridge, you inevitably import design assumptions. You cannot stay purely sub-personal and claim to have solved the problem of action.
  *   **Candid Note:** *Soft spot:* This is a methodological critique. If they insist they are only modeling motor preparation, not 'action,' you have to concede they are innocent until they publish the press release.

  **8. The "Pragmatic Success" Argument (Dennettians)**
  *   **Vocabulary:** "Workability," "social coordination," "predictive success," "instrumentalism."
  *   **The Objection:** "Even if it is a stipulation, it works. The 'worth wanting' definition sustains our legal and social practices. Why does the 'price' matter if the system functions?"
  *   **Reply (2 mins):** It matters because stipulations are political. If we admit it's a stipulation, we admit it can be changed. If we pretend it's a discovery, we shield it from critique. I want us to own the power we are exercising. When we say a criminal 'could have done otherwise,' we are making a normative claim, not a factual one. Honesty about the stipulation protects us from the hubris of thinking science has 'solved' morality.
  *   **Candid Note:** *Soft spot:* This might sound like you are undermining the very practices you want to save. Balance the "honesty" with "stability."

  ---

  ### 2. STRATEGIC CONCESSIONS (To make in the Talk)

  To take the sting out of the objections that cannot be fully answered, concede the following in your opening remarks:

  1.  **Concede the "Magic" Loss:** Explicitly state: "I am not offering you a way to keep Libertarian Free Will. If you want to be an uncaused cause, this talk will not help you." This disarms the Incompatibilists' primary frustration (that you are hiding the ball).
  2.  **Concede the Neuroscientists' Innocence (Partially):** Acknowledge: "Most neuroscientists are not trying to do metaphysics. They are modeling data." This prevents them from feeling attacked as philosophers manqué. Frame it as: "However, the *impact* of the data is metaphysical, regardless of intent."
  3.  **Concede the Normative Risk:** Admit: "Treating free will as a stipulation opens the door to abuse. It is a dangerous tool." This shows you are not naive about the political implications (addressing the Deflationist and Incompatibilist fears).

  ---

  ### 3. THE SINGLE OBJECTION THAT MUST LAND

  **The Objection:** "You are merely engaging in verbal semantics / conceptual engineering." (Raised by Incompatibilists or Deflationists).

  **Why it must land:**
  Your thesis *is* that the manoeuvre is a stipulation (a verbal/semantic move) rather than a discovery. If you try to argue against this—if you try to claim that Dennett or the Neuroscientists are actually *discovering* free will in the metaphysical sense—you contradict your own core argument and lose credibility.
  **Strategy:** When this objection is raised, do not deflect. **Agree immediately.** "Exactly. That is my point."
  **The Pivot:** The battle is not about *whether* it is a stipulation, but whether that *matters*. You must let the "it is a stipulation" punch land on your chin, show you are still standing, and then argue that stipulations are the only tools we have. If you dodge the "stipulation" label, the thesis collapses.

  ---

  ### 4. THE PRIVATE FEAR QUESTION (The Kill Shot)

  **The Question:** "If free will is just a stipulation about which control systems are 'worth wanting,' **who gets to decide what is worth wanting?** If a totalitarian regime stipulates that 'free will' does not apply to political dissidents because their control systems are 'defective' by state standards, on what grounds can you object? You've removed the metaphysical firewall that protects the individual from the state."

  **Why you can't answer it:**
  Your thesis grounds free will in pragmatic/engineering criteria ("worth wanting"). This is inherently normative and political. There is no "fact of the matter" in your framework that prevents a powerful group from defining "worth wanting" to suit their oppression. To answer this, you would need to appeal to a universal moral truth (which your anti-metaphysical stance undermines) or concede that your framework offers no protection against tyranny other than "might makes right."
  **Preparation:** If asked, do not try to solve it. Acknowledge the gravity. "That is the price I mentioned. Without metaphysical grounding, our protections are only as strong as our collective political will to maintain them. Science cannot save us from that." (Honesty is your only shield here).
