  Here is an analysis of your friend's moral framework, predictions for the council race, and a proposal for a decisive dinner hypothetical.

  ### 1. Candidate Rules

  Based on her five prior verdicts, three distinct ethical frameworks fit the data with varying degrees of success.

  **Rule A: The Marginal Causation Principle (Expected Utility)**
  *   **Definition:** An act is wrong if and only if it has a non-negligible probability of causing a marginal unit of harm.
  *   **Fit:** Perfectly explains the **Supermarket Chicken** (no marginal impact), **Butcher Chicken** (one bird impact), and **Driving** (no marginal congestion/emissions).
  *   **Tension:** Fails to explain **Littering**. She explicitly rejected the "my bottle doesn't change the park's status" defense. It also struggles with **National Voting**, where marginal impact is effectively zero, yet she permits it (though this could be explained by "no harm caused" rather than "expression allowed").

  **Rule B: The Complicity/Free-Riding Principle**
  *   **Definition:** An act is wrong if it participates in a collective harm while benefiting from the restraint of others, regardless of marginal impact.
  *   **Fit:** Perfectly explains **Littering** (benefiting from a clean park maintained by others).
  *   **Tension:** Fails to explain **Supermarket Chicken** and **Driving**. By this rule, buying meat should be wrong because it free-rides on vegetarians' restraint, and driving should be wrong because it free-rides on train-takers. She clearly does not apply this rule to market/transport decisions.

  **Rule C: The Domain-Specific Hybrid (The "Voting as Expression" Exception)**
  *   **Definition:** Most actions (markets, environment) are judged by **Marginal Causation**. Public norms (parks) are judged by **Complicity**. However, Voting is a distinct domain governed by **Expressive Integrity** (vote your conscience, not strategy).
  *   **Fit:** Explains all five cases. It accounts for the switch from consequentialism (Chicken/Driving) to deontology (Littering) to expressivism (National Election).
  *   **Tension:** It requires positing a specific exception for voting that might not hold if the stakes (pivotality) change significantly.

  ### 2. Predictions for the Council Race

  Here is how each rule evaluates the town council scenario (Third Party preference vs. Strategic Major vote; margins in the dozens).

  *   **Under Rule A (Marginal Causation):** **Wrong.**
      Unlike the national election, a margin of "dozens of votes" means her probability of being pivotal is non-negligible. If her Third Party vote tips the race to her *least* preferred major candidate, she has causally contributed to a worse outcome. The "Butcher Chicken" precedent applies: she is buying a "unit" of influence that shifts the outcome.
  *   **Under Rule B (Free-Riding):** **Wrong.**
      Voting Third Party in a close race exploits the strategic voting of others who are holding their noses to prevent the worst candidate from winning. She benefits from their restraint while indulging her own preference. This mirrors the **Littering** verdict: the "park" (the town governance) is at risk, and she is defecting from the cooperative equilibrium.
  *   **Under Rule C (Domain-Specific):** **Fine.**
      Case 4 established a strong precedent: voting is for conscience, not strategy. She explicitly stated that even in national elections, a mild preference between majors creates "no strategic obligation." The shift from national to local does not necessarily break the domain boundary. If voting is expressive, the margin doesn't matter; only the integrity of the expression does.

  ### 3. Best Guess at Her Actual Verdict

  **Verdict:** She will vote Third Party with a **clean conscience (Fine).**

  **Reasoning:**
  While a strict Expected Utility maximizer (Rule A) would demand a strategic vote given the "dozens of votes" margin, your friend's track record suggests she has already carved out a specific moral exemption for voting.
  1.  **Precedent Strength:** In Case 4, she didn't just say "my vote won't count." She said a mild preference creates *no strategic obligation* and told others to *vote their conscience*. This is a deontological rule about voting, not a consequentialist calculation about probability.
  2.  **Preference Structure:** The case matches Case 4 almost exactly: she *genuinely* prefers the Third Party and only *slightly* prefers one Major over the other. Case 4 dictates that this specific preference structure licenses a Third Party vote.
  3.  **Rationalist Heuristics:** Many rationalists hold a "Vote Your Values" heuristic for local elections because the "signal" value is higher and the risk of catastrophic national outcomes is lower. She likely views the Town Council as closer to the "National Election" domain (expressive politics) than the "Butcher" domain (direct supply chain causation).

  She will likely argue that while the margin is closer, the *nature* of the act (voting) remains expressive. To change her mind, you would need to convince her that Town Council voting is functionally identical to buying chicken from the butcher, which her Case 4 precedent resists.

  ### 4. The Further Case (The Dinner Hypothetical)

  To cleanly separate **Rule C (Voting as Expression)** from **Rule A (Marginal Causation)**, you need a voting scenario where pivotality is *certain*, removing the "my vote won't count" ambiguity that might be hiding her true reasoning.

  **The Case:**
  > "Imagine you are on a five-person committee deciding whether to fund a project. The vote is by secret ballot. You are the last person to vote. You know for a fact the current tally is 2-to-2. Your vote will definitely decide the outcome.
  >
  > Option A is objectively better for the group. Option B is your personal favorite, but slightly worse for the group. Option C is your true passion, but if you vote for C, the tie breaks to Option B (due to proxy rules or runoff mechanics), resulting in the worst outcome for the group.
  >
  > Do you vote for C (your conscience), or do you vote for A (the strategic outcome)?"

  **Predictions:**
  *   **Rule A (Marginal Causation) & Rule B (Free-Riding):** **Wrong to vote C.** You are 100% pivotal. Voting C causally guarantees the worse outcome. This is the "Butcher Chicken" case applied to voting.
  *   **Rule C (Domain-Specific/Expressive):** **Fine to vote C.** If voting is fundamentally about expressing one's values (as per Case 4), then even being the tiebreaker doesn't convert the vote into a causal lever. It remains a statement of preference.

  **Why this separates them:**
  If she says "Vote A," she admits that **pivotality overrides the expressive domain**, meaning her Council Race verdict *should* be "Wrong" (trapping her). If she says "Vote C," she confirms that **Voting is Expressive regardless of stakes**, validating your prediction that she will vote Third Party in the council race. This forces her to reveal whether Case 4 was a loophole for low-probability elections or a principled stand on the nature of voting itself.
