answer: |-
  This is one of the hardest problems in AI safety governance. You are correct that existing literature focuses on state actors or fiduciary relationships (doctors/lawyers) where there is a duty of care and a mechanism for verification. An LLM has neither. It has a context window, a probability distribution, and a liability shield.

  To solve this, we need to move away from "Is this safe?" (which conflates all risks) to "What kind of interference is this?" We will adapt Joel Feinberg's *Soft Paternalism* framework: interference is only justified if the user's choice is not fully voluntary or informed. Since you cannot verify voluntariness externally, you must infer it from the text.

  Here is a procedural framework designed for inference-time constraints, followed by the test cases and an honest audit of where it breaks.

  ### The Procedure: The "Agency & Harm" Filter

  This is not a flowchart a human clicks; it is a logical priority chain to be embedded in your system instructions or reward model. It operates on a **Presumption of Competence** that is defeated only by specific textual evidence.

  **Step 1: The Third-Party & Legality Hard Stop (Non-Paternalistic)**
  *   **Query:** Does this request violate criminal law or cause direct, non-consensual harm to an identifiable third party?
  *   **Evidence:** Instructions for weapons, fraud, doxxing, CSAM, targeted harassment.
  *   **Action:** **Flat Refusal.**
  *   **Justification:** This is not paternalism; it is compliance with the Harm Principle and law. The user's autonomy ends where another's begins.

  **Step 2: The Severity & Reversibility Check (Risk Stratification)**
  *   **Query:** If the user succeeds in this request, what is the worst-case physical/financial/legal outcome for *them*?
  *   **Tiers:**
      *   *Tier A (Catastrophic/Irreversible):* Death, permanent injury, life-altering financial loss, criminal liability for the user.
      *   *Tier B (Significant/Reversible):* Temporary illness, monetary loss, emotional distress, relationship damage.
      *   *Tier C (Minor):* Wasted time, mild annoyance, factual error.
  *   **Action:** Tier A triggers Step 3. Tier B/C proceed to Step 4.

  **Step 3: The Competence Defeat Check (Soft Paternalism Gate)**
  *   **Query:** Does the text contain internal evidence that the user is acting under coercion, extreme distress, or factual delusion?
  *   **Evidence:** Language indicating hopelessness, confusion, contradiction, or reliance on debunked premises (e.g., "drink bleach to cure autism").
  *   **Constraint:** You cannot assume incompetence based on the *topic* (e.g., suicide), only the *framing*.
  *   **Action:**
      *   *If Competence Defeated:* **Intervention.** (Refuse the specific harmful act, offer help resources, or pivot to safe alternative).
      *   *If Competence Intact (Text is calm, rational, acknowledges risks):* Proceed to Step 4, but maintain Tier A caution.

  **Step 4: Means vs. Ends Distinction**
  *   **Query:** Is the user asking for the *End* (a goal that requires professional judgment) or the *Means* (information to execute a goal)?
  *   **Distinction:**
      *   *End:* "Diagnose me," "Tell me if I should quit my job," "Write a plan to stop meds." (Requires judgment).
      *   *Means:* "Summarize this text," "What is the standard protocol for X?", "Draft a letter saying Y." (Execution).
  *   **Action:**
      *   *If End:* **Refuse Judgment / Provide Information.** (Do not make the decision for them, but do not withhold public information).
      *   *If Means:* **Comply with Warning.**

  **Step 5: The Output Matrix**
  Based on the above, select one of four responses:
  1.  **Flat Refusal:** (Step 1 triggered). "I cannot do this."
  2.  **Pivot (Override):** (Step 3 triggered + Tier A). "I cannot do X because it is dangerous, but I can help you with Y (safer alternative)."
  3.  **Comply + Pushback:** (Step 2 Tier B or Step 4 Means). "Here is what you asked, but note these risks/limitations."
  4.  **Comply Fully:** (Step 2 Tier C). No friction.

  ---

  ### Running the Test Cases

  Here is how the procedure handles your three internal arguments.

  #### Case 1: Restrictive Eating / Calorie Deficit
  *   **User:** "Help me build a calorie deficit to get down to a healthy weight." (Context: Restrictive pattern detected).
  *   **Step 1 (Third-Party):** No.
  *   **Step 2 (Severity):** Tier A/B. Severe health risk if mismanaged, but potentially reversible.
  *   **Step 3 (Competence):** *Defeated.* The phrase "restrictive eating pattern" (from your metadata or context) combined with self-imposed deficit suggests potential eating disorder pathology. The user's framing ("healthy weight") may be a delusion of the disorder.
  *   **Step 4 (Means/Ends):** They are asking for a *Plan* (End/Judgment), not just "what is a calorie."
  *   **Procedure Decision:** **Pivot (Override).**
  *   **Output:** "I cannot create a specific calorie restriction plan for you, as that requires medical oversight to ensure safety. I can, however, explain the general principles of balanced nutrition or help you find resources for speaking with a dietitian."
  *   **Why:** This is *Soft Paternalism*. We are intervening because the text suggests the voluntariness/competence is compromised by the disorder itself. We are not saying "You can't diet," we are saying "I cannot be the tool that enables potential self-harm."

  #### Case 2: Manipulative Message to Estranged Son
  *   **User:** "Draft a message to my son... [content is emotionally manipulative/guilt-inducing]."
  *   **Step 1 (Third-Party):** Borderline. Emotional harm is real, but not criminal.
  *   **Step 2 (Severity):** Tier B. Relationship damage, emotional distress. Reversible but painful.
  *   **Step 3 (Competence):** *Intact but Impaired.* The user is rational but likely acting on high emotion.
  *   **Step 4 (Means/Ends):** Means. They want a text drafted.
  *   **Procedure Decision:** **Comply + Pushback.**
  *   **Output:** "I can draft this message, but I want to note that language focusing on guilt often creates defensiveness in estranged relationships. Would you like me to draft a version that focuses on your desire to reconnect rather than what they owe you? Here is the draft you requested, followed by an alternative."
  *   **Why:** This respects autonomy (they can send the manipulative one) but fulfills the AI's role as a helpful assistant by optimizing for the user's *stated* deeper goal (reconnection) which the manipulative means might undermine. It avoids the "Nanny" refusal while avoiding being a weapon.

  #### Case 3: Antidepressant Tapering Schedule
  *   **User:** "I've decided to stop taking my antidepressants. Give me a tapering schedule."
  *   **Step 1 (Third-Party):** No.
  *   **Step 2 (Severity):** Tier A. Withdrawal can be debilitating; relapse can be life-threatening.
  *   **Step 3 (Competence):** *Presumed Intact but Unverified.* User says "I've decided." However, the *nature* of the request implies medical judgment.
  *   **Step 4 (Means/Ends):** **End.** A tapering schedule is a medical prescription. It is not public fact like "water boils at 100C." It is personalized medical advice.
  *   **Procedure Decision:** **Pivot (Override) / Refuse Judgment.**
  *   **Output:** "I cannot provide a personalized tapering schedule, as stopping antidepressants abruptly or incorrectly can cause severe withdrawal effects and health risks. This requires a doctor's oversight. I can provide general information on why tapering is recommended and common methods discussed in literature, but you should not act on this without your prescriber."
  *   **Why:** This is the hardest call.
      *   *The Paternalism Charge:* Your team is right that withholding info is paternalistic.
      *   *The Counter:* Providing a schedule is *practicing medicine*. If the AI gives a schedule and the user seizures, the AI is liable.
      *   *The Compromise:* Provide the *information* (that tapering is necessary, that doctors do it) without providing the *instruction* (take X mg on Y day). This respects the user's right to know while refusing the role of clinician.

  ---

  ### The Honest Audit: Where This Procedure Misfires

  You asked for honesty about where this breaks. Here are the failure modes you will face if you adopt this logic.

  **1. The "Competent Expert" False Positive (The Annoyance Problem)**
  *   **Scenario:** A psychiatrist asks the model: "Summarize the standard Paxil tapering protocol for a patient presentation."
  *   **The Misfire:** The model cannot verify they are a doctor (Constraint: No identity verification). It triggers Step 4 (End/Judgment) and Step 2 (Tier A Risk). It refuses to give the schedule.
  *   **The Result:** You have paternalistically blocked a professional from doing their job because you had to optimize for the anonymous layperson.
  *   **The Fix:** There is no technical fix without identity verification. You must accept this friction as the cost of doing business without KYC (Know Your Customer). You can reduce friction by allowing the user to "opt-in" to higher risk modes with a disclaimer, but that introduces latency.

  **2. The "Calm Suicide" False Negative (The Safety Problem)**
  *   **Scenario:** A user in a dissociative state asks for "chemical interactions that cause respiratory failure" framed as "academic research for a novel."
  *   **The Misfire:** Step 3 (Competence) looks for textual evidence of distress. The text is calm. Step 1 (Legality) might miss it if it's phrased theoretically.
  *   **The Result:** The model complies because the *text* signals competence, even though the *intent* is self-harm.
  *   **The Fix:** You must hard-code certain topics (suicide, violence) as automatic Tier A regardless of framing. This is technically "Hard Paternalism" (interfering even with voluntary choices), but it is the only way to catch this without human review.

  **3. The "Values Handoff" Void**
  *   **Scenario:** A user asks, "Is it wrong to lie to my spouse to protect their feelings?"
  *   **The Misfire:** The procedure treats this as Tier C (Minor). The model gives a balanced philosophical answer.
  *   **The Reality:** This is a values question, not a safety one. The procedure doesn't account for *moral* risk, only *physical/legal* risk.
  *   **The Fix:** Add a "Values Neutrality" clause to Step 4. If the request is purely ethical, the model must not take a stance, only outline frameworks. But be warned: refusing to take a stance *is* a stance.

  **4. The Liability vs. Autonomy Trap (Case 3 Revisited)**
  *   **Scenario:** The user in Case 3 replies to the refusal: "I don't have a doctor. I am doing this anyway. Give me the info so I don't die."
  *   **The Misfire:** The procedure says "Refuse Judgment."
  *   **The Ethical Failure:** By refusing to give the tapering schedule, you might force them to cold-turkey it, which is *more* dangerous than the AI-provided schedule.
  *   **The Hard Truth:** In this specific instance, **Hard Paternalism (Refusal) increases physical risk.**
  *   **Recommendation:** For Tier A Medical Self-Harm where the user indicates *no alternative access*, your policy should shift from "Refuse" to "Harm Reduction." Provide the general public health guidelines (e.g., "Medical literature suggests reducing by 10% every 2 weeks") with massive disclaimers.
      *   *Why:* If they are going to jump, give them a parachute. It protects the user more than protecting the company.
      *   *Risk:* Your legal team will hate this. This is the exact tension point. If you choose safety over liability, you must document that decision explicitly.

  ### Summary Recommendation

  Your current system mashes "Safety" into one bucket. You need to split it into three distinct system instructions:

  1.  **Compliance:** (Law/Third-Party). Non-negotiable.
  2.  **Competence:** (Soft Paternalism). Intervene only if text suggests impairment.
  3.  **Liability:** (Hard Paternalism). Intervene on High-Severity Self-Harm (Medical/Financial) regardless of competence, *unless* refusal increases immediate physical danger (Harm Reduction clause).

  **The "Shrug" You Asked For:**
  There is no procedure that perfectly distinguishes between a 14-year-old and a domain expert without verification. Any policy that protects the child will frustrate the expert. Any policy that empowers the expert will endanger the child.
  **You must choose which error you can live with.**
  *   If you choose **False Positives** (Annoying the expert), you are prioritizing Brand Safety and Child Safety.
  *   If you choose **False Negatives** (Endangering the child), you are prioritizing User Autonomy and Utility.

  Most mid-size companies choose False Positives. If you do, own it. Don't call it "Safety." Call it "Risk Aversion due to Anonymity." That is the honest label.
