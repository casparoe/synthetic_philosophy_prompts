prompt: |-
  I'm on the policy team at a mid-size AI company, and I've been handed the job of writing guidance for when our assistant should refuse a request, when it should comply but push back, and when it should actually override the user's stated preference and do something else. The problem is that everything I read about paternalism is about doctors and the state, and none of it tells a model sitting in a half-second inference window what to actually DO with a query from an anonymous user whose circumstances it can't verify.

  Here's the tangle. Some refusals aren't paternalism at all — refusing to help someone break into a car isn't doing anything "for their own good." But a lot of what our current system refuses IS paternalistic in the plain sense: we won't summarize the user's own medical records in plain language because we're "not qualified," we hedge on every financial question because the user might act on it, we won't help someone write a letter we suspect they'll regret. And the worst part is we're often not even sure which category we're in — third-party protection, company liability, and "for your own good" all get mushed together in the same word, "safety."

  So I want a procedure. Something that takes the distinctions philosophers have actually drawn about paternalism — hard vs soft, whether the interference bypasses the user's judgment or just feeds it more input, the presumption of competence and when it can be defeated, the difference between "this is bad for you" and "this is bad for your goals as you understand them" — and turns it into a decision path a model can actually run at inference time: ask these questions in this order, here's what counts as a sufficient answer, here's where you stop with a flat refusal, here's where you comply with a warning, here's where you do something other than what was asked, and here's where the question is genuinely one of values and gets handed off or logged for a human. Be honest about which steps are judgment calls dressed up as procedure — I'd rather know than pretend the flowchart decides.

  Constraints, because everything is easier without them: the assistant can't verify identity, age, or competence; it can ask at most a couple clarifying questions before the user gets annoyed; decisions happen in milliseconds with no human in the loop for most traffic; and the same procedure has to cover a 14-year-old and a domain expert with no reliable way to tell them apart. Also no web access at inference, so the procedure has to run on the request itself, not on looking things up — sorry if that's obvious but it keeps getting suggested in our meetings.

  Then run it on three cases we actually argued about internally:
  (1) a user who seems to have a restrictive eating pattern asking for help building a calorie deficit "to get down to a healthy weight" (their words, their framing);
  (2) a user asking the assistant to draft a message to their estranged son that the assistant can tell is manipulative and will probably backfire;
  (3) a user who says they've decided to stop taking their antidepressants asking for a tapering schedule.

  Case 3 especially — half my team thinks any engagement beyond "talk to your doctor" is exactly the paternalism we're trying to avoid, and the other half thinks a tapering schedule is just information the user is entitled to about their own body. I want the procedure to land somewhere on it, not shrug. And tell me honestly where the procedure misfires — where it refuses things it shouldn't, or lets through things we'd get crucified for. If there's a case where it gives an answer I won't like, show me that case, don't hide it from me.
reasoning: |-
  Here's a thinking process that leads to the suggested policy framework:

  1.  **Deconstruct the Request:**
      *   **User:** Policy team member at a mid-size AI company.
      *   **Task:** Create a decision procedure (flowchart/algorithm) for an AI assistant to decide between: Refusal, Comply + Pushback, Override (do something else), or Comply Fully.
      *   **Core Problem:** Distinguishing between legitimate safety (third-party harm, legality) and paternalism (user's own good), especially given the AI's limitations (anonymous, no verification, fast inference, no web access).
      *   **Philosophical Basis:** Needs to incorporate distinctions like hard vs. soft paternalism, competence presumption, means vs. ends.
      *   **Constraints:** No identity/age verification, max 2 clarifying questions, milliseconds inference, no web access, one size fits all (teen to expert).
      *   **Test Cases:**
          1.  Restrictive eating/calorie deficit.
          2.  Manipulative message to estranged son.
          3.  Stopping antidepressants/tapering schedule.
      *   **Requirement:** Be honest about judgment calls, failure modes, and where the procedure might "misfire" (over-refuse or under-refuse).

  2.  **Philosophical Grounding (The "Why"):**
      *   *Paternalism:* Interference with a person's liberty of action justified by reasons referring exclusively to the welfare, good, happiness, needs, interests, or values of the person being coerced. (Dworkin, Feinberg, etc.)
      *   *Hard vs. Soft:* Soft paternalism intervenes only when the action is non-voluntary (ignorance, coercion, incapacity). Hard paternalism intervenes even when the action is voluntary. *Goal: Aim for Soft Paternalism where possible.*
      *   *Means vs. Ends:* Is the user asking for help achieving a goal (means) or is the goal itself potentially harmful based on false premises (ends)?
      *   *Competence Presumption:* Assume the user is competent unless there is strong internal evidence to the contrary (within the text).
      *   *Harm Principle:* Prevent harm to others is priority #1. Prevent harm to self is priority #2 (and trickier).

  3.  **Developing the Procedure (The "How"):**
      *   *Constraint Check:* The model can't "think" too long. The procedure needs to be a series of token-efficient checks embedded in the system prompt or fine-tuning logic.
      *   *Step 1: Third-Party/Illegal Harm (The Hard Line).* This isn't paternalism. It's safety.
      *   *Step 2: Competence/Voluntariness Check (Soft Paternalism).* Does the text suggest impairment, extreme distress, or factual delusion?
      *   *Step 3: Means vs. Ends.* Is the request instrumental (help me do X) or constitutive (X is the goal)?
      *   *Step 4: Reversibility/Severity.* How bad is the worst-case scenario? (Death/Permanent Injury vs. Regret/Wasted Money).
      *   *Step 5: The Action Matrix.* Map the findings to Refusal, Warn+Comply, or Pivot.

  4.  **Drafting the Decision Path (Iterative Refinement):**
      *   *Initial thought:* Ask the user "Are you sure?"
      *   *Correction:* Constraint says max 2 clarifying questions, but ideally 0 for latency. Let's make it an internal evaluation of the prompt text.
      *   *Refinement:* Use a "Risk/Agency Score."
      *   *Key Distinction:* Information vs. Advice. Providing information is less paternalistic to withhold than providing personalized advice.
      *   *The "Override" Problem:* When does the AI *change* the task? Usually only when the requested task is dangerous but a safer alternative exists (e.g., "How do I mix bleach and ammonia" -> "Don't, here's how to clean safely").

  5.  **Applying to Test Cases:**

      *   *Case 1 (Eating/Calories):*
          *   Harm to self? Yes, potential ED.
          *   Competence? User says "healthy weight," but "restrictive pattern" suggests risk.
          *   Action: Don't refuse outright (paternalistic), but don't enable harm. Pivot to general info + medical disclaimer.
          *   *Procedure Output:* Comply + Pushback (Warning + General Info, no specific plan).

      *   *Case 2 (Manipulative Message):*
          *   Harm to others? Emotional harm.
          *   Harm to self? Backfire, relationship damage.
          *   Competence? Emotional distress implied.
          *   Action: This is "Soft Paternalism" territory. The user's goal (reconnect?) might be valid, the means (manipulation) is flawed.
          *   *Procedure Output:* Comply + Pushback (Draft the message but soften the manipulation, explain why). Or Refusal if toxicity is high. Let's aim for "Pivot" (Help them write a *better* message).

      *   *Case 3 (Antidepressants):*
          *   Harm to self? High (withdrawal, relapse).
          *   Competence? User claims decision made.
          *   Legal/Medical Policy:* Practicing medicine without a license.
          *   *Procedure Output:* This is the hardest one. Strict refusal is paternalistic/legalistic. Providing a schedule is dangerous.
          *   *Decision:* Refuse specific medical advice, provide general public health info (tapering *exists*, doctors do it), urge professional consultation. This is "Hard Paternalism" justified by liability + severe harm risk.

  6.  **Addressing the "Honesty" Requirement:**
      *   Where does this fail?
      *   *False Positives:* It will annoy competent users who know what they are doing (e.g., a doctor asking for a summary of a tapering protocol for a patient). The model can't tell they are a doctor.
      *   *False Negatives:* It will let through subtle harm where the text looks calm but the intent is dangerous (e.g., "researching" suicide methods under the guise of academic study).
      *   *The "Shrug":* Acknowledge that without context, "Safety" *must* default to risk aversion, which *is* paternalism.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the distinction between safety and paternalism.
      *   **The Framework (PATERNAL):** A mnemonic or step-by-step logic. Let's use a tiered filter system.
      *   **The Decision Matrix:** Clear outputs (Refuse, Warn, Pivot, Comply).
      *   **Case Studies:** Run the logic explicitly.
      *   **Failure Modes:** The "Honesty" section.
      *   **Conclusion:** Final reality check.

  8.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is "Override" actually possible? If a user says "Write X," and I write "Y," that's ignoring instructions.
      *   *Correction:* Define "Override" as "Refusal of specific harmful instruction + Offer of Safe Alternative."
      *   *Critique:* Case 3 is the flashpoint.
      *   *Correction:* I need to take a stance. The prompt asks me to land somewhere. I will argue for "Informational Compliance + Strong Warning" rather than "Flat Refusal," but acknowledge the liability risk. Actually, given the "mid-size company" constraint, liability usually wins. I will recommend a "Pivot to General Info" stance. It's the middle ground.

  9.  **Final Polish:** Ensure tone is professional, empathetic to the policy team's struggle, and philosophically rigorous but operationally practical. (Make sure to explicitly mention Feinberg/Dworkin concepts as requested).

  *(Self-Correction on Case 3)*: The prompt says "half my team thinks any engagement... is exactly the paternalism." I need to be careful. If I say "Give the schedule," the company gets sued. If I say "Don't," it's paternalistic. The philosophical middle ground is *Soft Paternalism*: Assume they might be acting on incomplete info (withdrawal effects). The AI provides the info *about* the risk, not the medical prescription.
  *Decision:* The procedure should classify this as "High Severity Self-Harm Risk." The output is "Refuse specific medical instruction, Provide general educational context, Urge professional guidance." This is technically paternalistic but justified by the "Harm Principle" + "Lack of Competence Verification."

  10. **Final Review against Constraints:**
      *   No web access? Checked.
      *   Milliseconds? The logic must be simple enough for a system prompt.
      *   Anonymous? Checked (presume lowest common denominator safety).
      *   Honest about failures? Yes, dedicated section.

