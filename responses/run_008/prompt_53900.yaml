answer: |-
  # Part 1: The Internal Board Procedure
  **Name:** The "Who Decides?" Triage (15-Minute Max)
  **Purpose:** To stop debates about *who* gets to decide, so we can actually decide.
  **Rules:** Answer these four questions in order. Do not skip ahead. If you reach a "STOP," you are done.

  ### Question 1: The Paper Test
  **Is this issue already covered by a signed Bylaw, Rule, or Agreement?**
  *   **YES:** **STOP.** Enforce the existing rule. If someone wants to change it, they must start a Bylaw Amendment process (not a board decision).
  *   **NO:** Go to Question 2.

  ### Question 2: The Damage Test
  **Does this action cause direct physical harm, health risk, or financial loss to another household?**
  *(Examples: Smoke drifting into windows, structural damage, noise exceeding ordinance limits, unpaid shared bills.)*
  *   **YES:** **STOP.** This is a **Community Decision**. The Board regulates it to prevent harm.
  *   **NO:** Go to Question 3.

  ### Question 3: The Zone Test
  **Is the activity happening primarily inside a Private Zone (inside unit, private balcony, exclusive yard) or a Common Zone (shared kitchen, garden, driveway, facade)?**
  *   **COMMON ZONE:** **STOP.** This is a **Community Decision**. Shared space requires shared agreement.
  *   **PRIVATE ZONE:** Go to Question 4.

  ### Question 4: The Paradox Flag (The "Sen Moment")
  **We have a Private Zone activity with no direct Damage, but the Community still strongly objects (moral, aesthetic, or preference-based).**
  *   **ACTION:** **STOP.** Acknowledge the **Liberal Paradox**.
      *   *Statement for Minutes:* "We have reached a conflict between Individual Liberty and Group Consensus. Protecting the individual's sphere violates the group's preference. Restricting the individual violates their private sphere. Both cannot be satisfied."
      *   **DECISION:** The Board must take a **Values Vote**. Do we prioritize *Harmony* (restrict the individual) or *Liberty* (protect the individual) for this specific case? There is no "right" answer, only a choice.

  ***

  # Part 2: The Newsletter Blurb (Plain Language)
  **Subject: How We Handle Disagreements About Rules**

  Neighbors,
  We know decisions about "who gets to say what" can be frustrating. To make things clearer, the Board is adopting a simple 4-step checklist to figure out if an issue is a personal choice or a community vote.

  1.  **Is it already a rule?** If yes, we follow it.
  2.  **Does it hurt someone?** If it causes health or money problems, the community steps in.
  3.  **Where is it happening?** If it's in shared spaces (like the common house), the community decides. If it's in your home, it's usually yours.
  4.  **The Tough Stuff:** Sometimes, what you do in your own space bothers others even if it's not "harmful." When this happens, we will be honest that we can't make everyone happy. We will have to choose between protecting your privacy or protecting community harmony, and we will explain that choice to you.

  We hope this reduces meetings spent arguing about authority and gets us back to building community.

  ***

  # Part 3: Running the Cases
  Here is how the Triage handles your three real-world headaches.

  ### Case 1: The Black Door
  *   **Facts:** Bylaws list "Approved Colors." Owner wants Black. Neighbors think it looks gloomy.
  *   **Q1 (Paper Test):** **YES.** Bylaws explicitly list approved colors.
  *   **Result:** **STOP.**
  *   **Outcome:** **Board Enforces Bylaw.** Owner cannot paint door black unless they amend the Bylaws.
  *   **Why:** Existing contracts trump new preferences. This is the easy one.

  ### Case 2: The Common Kitchen Meat Ban
  *   **Facts:** Member wants to ban meat in the *common* kitchen for climate reasons. Others eat meat. No existing rule.
  *   **Q1 (Paper Test):** **NO.** No rule on food in common kitchen.
  *   **Q2 (Damage Test):** **NO.** Climate change is real, but one meal's carbon footprint does not cause *direct, tangible* financial or physical harm to a specific neighbor in a legal sense.
  *   **Q3 (Zone Test):** **COMMON ZONE.** The kitchen is shared property.
  *   **Result:** **STOP.**
  *   **Outcome:** **Community Vote.**
  *   **Why:** Shared space = Shared rules. Even if it's about personal diet, the *location* makes it collective.
  *   **The "You Won't Like This" Flag:** If you are a meat-eater, you lose your freedom to eat what you want in the common house. If you are a climate activist, you might lose the vote. But the procedure forces a vote, not a veto. *However, for the purpose of this exercise, I am flagging that this outcome restricts individual dietary freedom in a way that feels intrusive to many.*

  ### Case 3: The Balcony Smoker
  *   **Facts:** Member smokes on private balcony. Smoke drifts to courtyard. No specific "No Smoking" bylaw. Neighbors are offended/uncomfortable.
  *   **Q1 (Paper Test):** **NO.** No specific bylaw.
  *   **Q2 (Damage Test):** **MAYBE/NO.** Secondhand smoke is a health risk, but is it "direct harm" in a legal sense without a medical note? Let's assume **NO** for this run (no documented asthma attack).
  *   **Q3 (Zone Test):** **PRIVATE ZONE.** It is their exclusive balcony.
  *   **Q4 (Paradox Flag):** **TRIGGERED.** Private Zone + No Proven Damage + Community Objects.
  *   **Result:** **Values Vote Required.**
  *   **Outcome:** **The Procedure Defaults to LIBERTY.** (This is the judgment call built into the flow).
      *   *Decision:* **Smoker Wins.** The Board cannot ban it without a new Bylaw.
      *   *Reasoning:* In the absence of proven damage, the "Private Sphere" protects the individual from majority preference.
  *   **Why you won't like this:** If you are the non-smoking neighbor, this procedure tells you your comfort does not trump their property rights. It forces you to live with the smoke unless you can prove "Damage" (hard) or change the Bylaws (hard). It prioritizes the Liberal Paradox's "Liberal" side over the "Pareto" (everyone agrees smoking is bad) side.

  ***

  # Part 4: The Honesty Check (Where the Flowchart is Fake)
  You asked me to flag where this procedure is just a judgment call dressed up as logic. Here are the three leak points:

  1.  **Defining "Damage" (Question 2):**
      *   *The Fake:* "Physical or Financial Harm" sounds objective.
      *   *The Reality:* Is "mental distress" from a garden gnome damage? Is "lowered property value" from a black door financial harm? The Board has to decide what counts as harm *before* they can answer the question. That is a philosophical judgment, not a fact check.
  2.  **Defining "Private Zone" (Question 3):**
      *   *The Fake:* "Balcony" sounds private.
      *   *The Reality:* In cohousing, facades and balconies are often visually shared. If your balcony is the first thing guests see, is it really private? The Board decides where the line is drawn.
  3.  **The Default at the Paradox Flag (Question 4):**
      *   *The Fake:* The procedure says "Take a Values Vote."
      *   *The Reality:* In the Smoking Case above, I wrote "The Procedure Defaults to LIBERTY." That was me making the choice for you. The flowchart *cannot* tell you whether to choose Liberty or Harmony. That is the exact point of Sen's Theorem. The procedure admits it can't solve it, but someone still has to pick the default. If you pick Liberty, smokers win. If you pick Harmony, neighbors win. The flowchart pretends to be neutral, but the *default setting* is political.

  **Recommendation:** Use the Triage to stop the *debate* about process, but accept that Question 4 will still feel like a fight. That fight isn't a process failure; it's the theorem in action.
