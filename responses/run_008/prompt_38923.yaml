  8.  *Wait, one more thing:* The friend's Step 5 is *very* strong bullet-biting. "Refusing him would cost me nothing." I need to make sure the user sees why that's a *reductio ad absurdum* if framed correctly. If losing 50 years costs nothing, then life extension is worthless unless continuous. That contradicts almost all human planning and desire.

