  1. Bottom line — two sentences max: the headline number and a one-sentence reason it isn't higher or lower.
  2. The terms — one short paragraph per sub-question: the question stated crisply, your probability, one line of justification. Aim for 5–7 entries.
  3. Combining — one paragraph showing how you put the numbers together and what comes out; if the combined figure differs from your headline, say which one you actually stand behind.
