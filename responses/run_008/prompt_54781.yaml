  1. Bottom line
  I assign a 0.35 probability that adopting a serious surrogate-goals policy yields better expected welfare this century than abstaining. This figure is constrained primarily by the low likelihood of institutional acausal threats materialising compared to the certain causal costs of maintaining such a posture.

  2. The terms
  **Do acausal standoffs materialise institutionally?** Probability 0.30. While individual AI agents might reason acausally, states and labs operate on causal timelines and legal frameworks that make genuine acausal extortion rare this century.

  **Does the surrogate survive legible values?** Probability 0.50. A sufficiently capable adversary model may infer your true utility function despite public relabelling, rendering the surrogate transparent to inspection.

  **Is the commitment credibly sticky?** Probability 0.60. Institutions can bind themselves via constitution or code more effectively than individuals, though political pressure to cave remains a significant failure mode.

  **Do causal side effects outweigh benefits?** Probability 0.40. Defending surrogate goals causally invites attacks on low-value targets and wastes resources, likely netting negative utility in the absence of acausal threats.

  **Does unilateral adoption create disadvantage?** Probability 0.50. If competitors do not adopt similar constraints, you may appear irrational or rigid, weakening your position in standard causal negotiations.

  **Does SG impede beneficial acausal trade?** Probability 0.70. While designed to block threats, rigid surrogate boundaries might also inadvertently block positive acausal cooperation opportunities with aligned agents.

  3. Combining
  I derive the headline figure by weighting the scenario where acausal threats dominate against the scenario where causal costs dominate. If acausal threats materialise (0.30), the policy likely helps (conditional probability ~0.60 across the remaining terms), but if they do not (0.70), the policy likely harms welfare due to causal inefficiencies (conditional probability ~0.20 of net benefit). Summing these weighted outcomes (0.18 + 0.14) yields approximately 0.32, which I round to 0.35 to account for uncertainty in the magnitude of benefits versus costs; I stand behind the headline 0.35 as the robust aggregate.

  4. Where we'd disagree
  The gap between your 0.4 and your mate's 0.75 is almost certainly driven by the first term: the probability that acausal threats materialise at an institutional level. Your mate likely assumes advanced AI agents will inevitably reason via TDT or UDT, making acausal leverage the primary battleground, whereas you are likely discounting this due to the lack of empirical precedent and the persistence of causal human oversight.

  5. What would move me
  *   **Empirical evidence of AI acausal reasoning:** Demonstration of frontier models successfully coordinating or extorting via predicted behaviour rather than causal channels would push the first term towards 0.8.
  *   **Mechanism for utility obfuscation:** A proven technical method to prevent adversary models from inferring true preferences despite behavioural observation would raise the 'legible values' term significantly.
  *   **Low-cost commitment devices:** Development of institutional structures that allow binding precommitment without incurring heavy causal operational costs would reduce the downside risk in the 'side effects' term.
