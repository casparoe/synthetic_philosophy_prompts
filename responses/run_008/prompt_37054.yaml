  That's a sharp analogy, and I'll concede that institutions provide the necessary framework—like the blockchain itself—but you're conflating the platform with the transaction. In your contract, the code defines the rules, but the *signature* is what executes the intent. In speech, the utterance *is* the signature. When I say "I promise," I'm not just sending data to a social database; I'm personally undertaking an obligation that didn't exist before I spoke. If I write `transfer()` in a comment, nothing happens because I haven't invoked the function. But if I say "I promise," I have *done* the promising. The words aren't just triggers; they are constitutive. And regarding misfires: a revert implies a transaction was submitted and then rejected. A misfire means the act never even came into existence. There was no transaction to revert. So the words are doing the work of bringing the act into being, not just signaling a pre-existing state.
