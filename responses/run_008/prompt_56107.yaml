answer: |-
  ### Decision Tree: Navigating the Sorites Paradox

  **Starting Point:** You find the inductive premise ("If $n$ grains make a heap, $n+1$ grains make a heap") genuinely compelling, yet you agree the conclusion ("One grain makes a heap") is false. The paradox demands a solution.

  ---

  #### **Node 1: The Existence of a Boundary**
  **Question:** In the series from a clear heap to a clear non-heap, is there a specific, single step where the property (e.g., *being a heap*) definitively stops applying, even if we cannot identify it?
  *   **YES:** Go to **Node 2**.
  *   **NO:** Go to **Node 3**.

  #### **Node 2: The Nature of the Boundary**
  **Question:** If there is a sharp boundary, is the location of that boundary determined by a fact of the matter that is in principle unknowable to us?
  *   **YES:** → **Epistemicism** (e.g., Williamson).
      *   *Rationale:* There is a sharp cutoff; vagueness is purely ignorance.
  *   **NO:** (You believe there is a boundary, but it's not a fact of the matter?)
      *   *Note:* This path is logically unstable. If there is a boundary, there must be a fact making it so. If there is no fact, there is no boundary. This leads to the **Unoccupied Branch** (see analysis below).

  #### **Node 3: The Source of Vagueness**
  **Question:** Since there is no sharp boundary, is the "blurriness" located in the world itself (metaphysical) or in our language/concepts (semantic)?
  *   **IN THE WORLD:** → **Ontic Vagueness** (e.g., Barnes, Williams).
      *   *Rationale:* Reality itself is indeterminate; objects do not have precise boundaries.
  *   **IN LANGUAGE/CONCEPTS:** Go to **Node 4**.

  #### **Node 4: The Logic of Borderline Cases**
  **Question:** For a borderline case (e.g., a specific shade between red and orange), can the statement "This is red" be something other than simply True or False?
  *   **NO (It must be T or F):** Go to **Node 5**.
      *   *Note:* You are committed to Bivalence, but denied a sharp boundary at Node 1. This implies the truth value varies by context or precisification.
  *   **YES (It can be Neither, Both, or Partial):** Go to **Node 6**.

  #### **Node 5: Truth Without a Boundary (Classical Logic Preserved)**
  **Question:** Consider a borderline case. Is it correct to say "Either 'This is red' is true OR 'This is red' is false" (Law of Excluded Middle)?
  *   **YES:** → **Contextualism** (e.g., Raffman, Soames).
      *   *Rationale:* Bivalence holds *within* a context, but the extension of the predicate shifts as you move through the series, preventing a fixed boundary from forming globally.
  *   **NO:** → **Supervaluationism** (e.g., Fine, Keefe).
      *   *Rationale:* A statement is only "True" if it is true on all *precisifications* (ways of making the language precise). Borderline cases are truth-value gaps (neither true nor false), so Excluded Middle fails for them.

  #### **Node 6: Non-Classical Treatments**
  **Question:** How exactly does the statement fail to be simply True or False?
  *   **IT IS DEGREED (0 to 1):** → **Degree-Theoretic Treatment / Fuzzy Logic** (e.g., Machina, Edgington).
      *   *Rationale:* Truth comes in degrees; the inductive premise is "almost" true, which explains its appeal without entailing the conclusion.
  *   **IT IS NEITHER (Gap):** → **Paracomplete Logics** (e.g., Field).
      *   *Rationale:* Borderline cases lack a truth value entirely; logic is revised to handle gaps without explosion.
  *   **IT IS BOTH (Glut):** → **Subvaluationism / Dialetheism** (e.g., Hyde, Priest).
      *   *Rationale:* Borderline cases are both true and false; the inductive premise is true, the conclusion is true (and false), but we reject the "explosion" of classical logic.
  *   **THE PREDICATE IS DEFECTIVE:** → **Eliminativism / Nihilism** (e.g., Unger, Sorensen).
      *   *Rationale:* Vague predicates do not successfully refer. The inductive premise is false because nothing is a "heap." We should eliminate the term from serious discourse.

  ---

  ### Analysis of the Tree

  #### 1. Prying Apart Epistemicism and Supervaluationism
  You correctly suspected that both Epistemicism and Supervaluationism end up on a "Classical Logic Survives" branch (specifically, both validate classical *validity* rules like Modus Ponens, unlike Fuzzy or Subvaluationist logics). However, they diverge on the **status of truth** for borderline cases.

  The specific question that separates them is found at **Node 5**: **"Does the Law of Excluded Middle ($P \lor \neg P$) hold for borderline cases?"**
  *   **Epistemicism** answers **Yes**. For the epistemicist, a borderline case *is* either red or not red; we just don't know which. Therefore, $P \lor \neg P$ is true.
  *   **Supervaluationism** answers **No**. For the supervaluationist, a borderline case is neither true nor false (a gap). Therefore, $P$ is not true, and $\neg P$ is not true, making the disjunction $P \lor \neg P$ fail to be super-true (though it remains valid as a logical schema).

  #### 2. Leaves the Tree Cannot Cleanly Separate
  **Contextualism** and **Supervaluationism** are difficult to distinguish using *only* Sorites cases.
  *   **Why:** Both views preserve classical logic locally, both deny a global sharp boundary, and both explain the compelling nature of the inductive premise by appealing to a shift in standards (Contextualism) or a range of acceptable interpretations (Supervaluationism).
  *   **The Problem:** Without introducing pragmatic data about how speakers actually shift contexts during a conversation, a student's intuitions about the Sorites series alone will yield identical verdicts from both theories (i.e., "The argument is invalid because the meaning shifts/precisifications vary"). To separate them, one must ask questions about *communication* and *disagreement* rather than just truth conditions.

  #### 3. The Unoccupied Branch
  **Combination:** **Ontic Vagueness + Sharp Boundary.**
  *   **Location:** This would occur if a student answered **NO** at Node 1 (No sharp boundary) but then tried to navigate to a view that posits a hidden fact, OR answered **YES** at Node 1 but claimed the source was **Ontic** at Node 3.
  *   **Status:** **Incoherent.**
  *   **Reasoning:** Ontic vagueness is defined by the claim that the *world itself* lacks a determinate structure at certain points. If there were a sharp boundary in the series (a specific grain $n$ that is the last heap), there would be a determinate fact of the matter about the world's structure at $n$. This contradicts the core definition of ontic vagueness. One cannot claim the world is indeterminate while simultaneously claiming there is a determinate cutoff point in that world. Consequently, no serious theory occupies this branch.
