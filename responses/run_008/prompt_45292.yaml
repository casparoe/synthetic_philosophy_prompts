answer: |-
  The dust in the shop didn't float; it hung, suspended in the amber light of late afternoon. Around Maya, three hundred clocks ticked. Usually, they were out of sync, a chaotic raindrops-on-tin rhythm. But today, as she leaned over the workbench with her loupe screwed into her eye socket, the sound was changing.

  On the velvet pad lay the pocket watch. Silver, dented, stubborn. Her grandmother's last project.

  "Come on," Maya whispered, her tweezers hovering over the hairspring. "Just seat."

  If she fixed it, the shop felt complete. If she didn't, the silence after the funeral would finally win.

  She exhaled, holding her breath to steady her hand. She lowered the spring. Instead of clicking into place, the metal seemed to hum. The ticking of the three hundred clocks around her didn't speed up; it flattened. The *tick-tick-tick* stretched into a single, continuous tone.

  Maya blinked. The dust motes stopped hanging. They elongated, stretching into fine golden threads that ran from the floor to the ceiling, passing through her hands, through the watch, through the walls.

  She wasn't looking at the shop anymore. She was looking at a sculpture.

  The room wasn't a space she occupied; it was a solid object. She saw the morning light and the evening shadow existing simultaneously, layered like geological strata. She saw herself sitting at the bench, but she also saw herself walking in the door an hour ago, and herself locking up tomorrow night. They were all there, fused together, a long pink worm of *Maya* extending through the room.

  Then she saw the other worm.

  At the far bench, where the velvet pad was worn smooth, sat her grandmother. Not a ghost. Ghosts imply something missing, something returned. This was solid. Grandma was leaning over a movement, her brow furrowed in that familiar way. She was permanently leaning. She was permanently looking up to smile at Maya. She was permanently gone.

  "Grandma?" Maya's voice didn't ripple; it was a static shape in the air.

  Grandma didn't turn. She couldn't. She was fixed in the block, a coordinate in spacetime.

  Maya felt a surge of warmth, immediate and intoxicating. *She's here.* The Presentist lie—that only *now* is real, that the past is deleted ash—shattered. Grandma wasn't gone. She was just *there*, five years back in the temporal dimension, as real as the moon is real when you're looking at the sun. Death was just a change in coordinates. Nothing is lost. The universe is a painting, and you don't scrape the paint off because you've moved your eyes to the other side of the canvas.

  "It doesn't matter," Maya said, the comfort turning cold in her throat. "If you're always there... then you're always leaving, too."

  In this block, nothing changes. Nothing heals. The grief wasn't a process she was moving through; it was a permanent ridge in the landscape, eternally sharp. If the future already exists, then her fixing this watch wasn't an act of love; it was just a feature of the object. She had no agency. She was just a statue waiting to be observed.

  "Is this peace?" Maya asked the frozen room. "Or is this a cage?"

  Grandma remained eternally focused on her work. The love was there, eternal and unchanging. But so was the cancer. So was the silence. Nothing is redeemed in the block universe; everything just *is*.

  Maya looked down at the watch in her hands. In this view, it was already fixed. It was also broken. It was also never manufactured. All states existed at once.

  "No," Maya said. The coldness was too much. She needed the flow. She needed the loss to be real so that the memory could matter. She needed the spring to *catch*, not just *be*.

  She focused on the tweezers. She focused on the *now*. She pushed against the static nature of the vision, demanding a sequence. *Before. After.*

  She pressed the spring down.

  *Click.*

  The sound was violent. The golden threads of dust snapped back into spheres. The layered light collapsed into the singular, dying sun of the afternoon. The three hundred clocks desynchronized, returning to their chaotic, rushing rain.

  Grandma's bench was empty. The velvet pad was worn, but no one sat there. The loss hit her again, fresh and sharp as a paper cut, painful and immediate.

  Maya sat back, her heart hammering against her ribs. The watch ticked. A steady, linear pulse. *Tick. Tick. Tick.* It was moving forward, away from her, into a future that didn't exist yet.

  She held the watch in her palm, feeling the vibration travel up her arm. It was comforting, this flow. It meant she could heal. It meant Grandma was gone, which meant she could be missed properly. But as she looked at the dust motes dancing in the light, she couldn't shake the image of the golden threads.

  Maybe Grandma was gone. Or maybe she was just around the bend in the fourth dimension, forever fixing a watch, forever loving Maya, forever waiting.

  Maya closed her hand over the ticking watch, silencing it. In the sudden quiet, she couldn't tell if the silence was empty, or if it was full of everything that had ever happened, waiting for her to look at it the right way.

  She picked up her bag. She had to leave. The shop needed to be locked. But as she turned off the lights, she didn't feel like she was leaving her grandmother behind. She felt like she was just moving to a different part of the same room.

  Or maybe she was just walking away from a ghost.

  Maya locked the door and stepped into the evening, the watch warm in her pocket, ticking away seconds that vanished as soon as they were born. She walked home, trying to decide if she was carrying a promise or a tomb.
