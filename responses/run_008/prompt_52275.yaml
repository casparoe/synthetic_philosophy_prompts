answer: |-
  # Seminar Prep Sheet: Defending Qualified Reflection
  **Presenter:** [Your Name]
  **Topic:** Qualified Reflection Principle (van Fraassen)
  **Audience Profile:** Strict Bayesian Instructor (Dutch Book focused); Well-read Classmates (Synchronic/Diachronic distinction).

  ---

  ## Top 6 Expected Objections (Ordered by Damage Potential)

  ### 1. The "Diachronic Incoherence Isn't Irrationality" Objection
  **Who:** Well-read Classmates (echoing Christensen/Briggs)
  **Phrasing:** "You're defending Reflection as a requirement of rationality, but recent literature suggests diachronic incoherence isn't truly irrational. A Dutch Book against a diachronic agent requires a bookie who can wait and exploit the time gap. If I plan to change my mind because I anticipate new evidence, that's not incoherence; it's learning. Why should I be bound by a principle that treats planned updating as a defect?"

  **Your Reply (2 mins):**
  "That's the standard objection, but it targets *unqualified* Reflection. My defense rests on the *qualification*: I am only claiming you must match your expected future credence if you regard that future self as an **expert**. If you plan to change your mind due to new evidence, you are not treating your future self as an expert on the *current* information state; you are treating them as an expert on a *new* information state.
  The irrationality isn't in changing your mind; it's in simultaneously believing $P$ is probable now and believing that, without new evidence, $P$ will be improbable later. That is a form of Moore's Paradox for credences. The Dutch Book doesn't prove you are irrational for learning; it proves you are irrational for believing your future self will be irrational *without cause*. My qualified principle isolates that specific tension. It's not about forbidding learning; it's about forbidding self-distrust without a reason."

  **Weakest Point:** You are relying on an intuitive notion of "cause" for belief change. A strict Bayesian might argue that *any* change not dictated by Conditionalization is irrational, making the qualification redundant or too loose.

  ### 2. The "Expert Deference & Forgetting" Objection
  **Who:** Sharp Classmate / Instructor
  **Phrasing:** "You frame this as an expert-deference principle. But this creates a dilemma. If 'expert' just means 'will have more evidence,' the principle is trivial. But if 'expert' means 'will process evidence rationally,' you face absurdity. Suppose I know I will suffer memory loss regarding key evidence $E$. My future self is less informed. If I defer to them, I violate Bayesian norms. If I don't, Reflection fails. Doesn't this show the principle collapses into triviality or demands absurd deference to a forgetful future self?"

  **Your Reply (2 mins):**
  "This is exactly why the qualification is necessary. I am not claiming you must defer to a future self who has *forgotten*. The qualification explicitly excludes cases where you believe your future self has lost evidence or cognitive capacity.
  To avoid triviality, 'expert' doesn't mean 'has more evidence'; it means 'has processed the *same* evidence rationally.' If I know I will forget $E$, I do *not* regard that future self as an expert on the current proposition relative to my current evidence. Therefore, Reflection does not apply. The principle isn't 'Defer to Future You'; it's 'Defer to Future You *if* you trust their rationality on the current evidence.' This avoids the forgetting case entirely because the condition for deference isn't met."

  **Weakest Point:** You risk making the principle vacuous. If every time Reflection gives a counter-intuitive result you say "Ah, but they aren't an expert," you aren't testing the principle; you're defining it to be safe.

  ### 3. The "New Evidence" Objection
  **Who:** Strict Bayesian Instructor
  **Phrasing:** "If I expect to learn $E$ tomorrow, my credence in $H$ should change. Reflection says $C_t(H) = C_t(C_{t+1}(H))$. But if I expect to learn $E$, $C_{t+1}(H)$ will be $C_t(H|E)$. Unless $H$ and $E$ are independent, these values differ. Doesn't Reflection forbid anticipating evidence?"

  **Your Reply (2 mins):**
  "Reflection does not forbid anticipating evidence; it forbids anticipating *unjustified* shifts. The equation $C_t(H) = C_t(C_{t+1}(H))$ holds because the Right Hand Side is an *expectation* over all possible future credences.
  Mathematically, by the Law of Total Probability, my current credence is the weighted average of my possible future credences. If I expect to learn $E$, I also assign some probability to *not* learning $E$ or learning $\neg E$. Reflection simply requires that my current credence be the probability-weighted average of those possible future outcomes. It doesn't say my credence can't change; it says I can't expect it to change in a specific direction without a specific evidential reason. It enforces the martingale property of rational belief."

  **Weakest Point:** This relies on the audience accepting the Law of Total Probability applies to credences over time, which assumes the very Bayesian framework the classmates are questioning in Objection 1.

  ### 4. The "Backward Deference" Objection
  **Who:** Classmate testing consistency
  **Phrasing:** "If I should defer to my future self because they are an expert, why not defer to my past self? They had less evidence, but they were also 'rational.' If Reflection is about expertise, shouldn't it work backward? If not, isn't your principle just time-biased?"

  **Your Reply (2 mins):**
  "There is a crucial asymmetry here. Deference is forward-looking because rationality is about *guidance*. I need to decide what to believe *now* based on where I am going.
  More importantly, the 'expert' condition breaks backward. My past self had *less* evidence than I do now. Even if they were rational, they are not an expert relative to my current information state. I have evidence they lacked. To defer to them would be to voluntarily ignore evidence I currently possess, which violates Bayesian Conditionalization. The future self, provided they haven't forgotten, will have at least as much evidence as I do now. The asymmetry isn't about time; it's about the accumulation of evidence. I can't be an expert on what you already know if I don't know it yet."

  **Weakest Point:** This assumes evidence only accumulates. In cases of "defeaters" (where new evidence undermines old evidence), the past self might actually be in a *better* position regarding certain propositions, complicating the asymmetry.

  ### 5. The "Dutch Book Mechanics" Objection
  **Who:** Instructor
  **Phrasing:** "You're softening the Dutch Book argument. But a Dutch Book is a sure loss. If you violate Reflection, I can construct a book that loses you money regardless of what you learn. If you admit the Dutch Book works, you admit Reflection is a strict requirement of the probability calculus, not just a 'qualified' normative principle. Which is it?"

  **Your Reply (2 mins):**
  "It is a requirement of the calculus, *provided* the agents involved are the same agent across time. The 'qualification' addresses whether the agent at $t+1$ is truly the same epistemic agent as at $t$.
  If I believe my future self will be drunk, or biased, or forgetful, the Dutch Book doesn't go through because the betting conditions change—the 'future me' is effectively a different bookie. The Dutch Book argument proves that *if* you regard your future self as a reliable updater, *then* you must satisfy Reflection. My defense is that rationality requires us to regard our future selves as reliable updaters unless we have specific evidence to the contrary. The calculus holds; the application depends on the identity of the epistemic agent."

  **Weakest Point:** The Instructor may press that "epistemic agent identity" is not part of the probability calculus. If it's not in the calculus, it's not a requirement of *Bayesian* rationality, which undermines your standing in a strict Bayesian course.

  ### 6. The "Rational Irrationality" (Ulysses) Objection
  **Who:** Classmate
  **Phrasing:** "What about cases where I know I will be rationally compelled to change my mind, but I think that compulsion is a mistake? For example, I know I will be coerced or brainwashed. I know my future credence will be 1, but my current credence is 0.5. Reflection says I should be 1 now. But I know that future shift is irrational. Doesn't this break the principle?"

  **Your Reply (2 mins):**
  "No, because in that case, you do not regard your future self as an **expert**. The qualification handles this. If I know my future belief change is due to coercion or brainwashing, I explicitly judge that future self as *non-expert* regarding the truth of the proposition.
  Reflection only binds me when I anticipate my future self will be *more* or *equally* rational and informed. If I anticipate irrationality, Reflection is silent. This isn't a bug; it's a feature. It distinguishes between *learning* (which I must anticipate) and *corruption* (which I must resist). The principle tells me: 'If you trust your future rationality, align with it now.' If I don't trust it, I'm off the hook."

  **Weakest Point:** It pushes the heavy lifting entirely onto the "trust/expert" condition. It risks making Reflection a principle that only applies when you already agree with your future self.

  ---

  ## The "Hope Nobody Asks" Question
  **The Question:** "How do you define 'Expert' without circularity?"
  **Why it's the weakest joint:** To defend Qualified Reflection, you must define when the qualification applies. If you say "Defer to future self if they are rational," and "Rational" means "Satisfies Reflection," you are circular. If "Rational" means "Satisfies Conditionalization," then Reflection is a *theorem* of Bayesianism, not an independent principle you are defending. If it's a theorem, why are we debating it? If it's not a theorem, where does the definition of "expert" come from?

  **Handling Strategy if Asked:**
  1.  **Acknowledge the tension:** "That is the crucial meta-epistemological question."
  2.  **Pivot to Externalism:** "I am not defining 'expert' purely internally. I am defining it as 'will satisfy Conditionalization on the total evidence available at that time.' "
  3.  **The Save:** "If Reflection is a theorem of Bayesianism (as some argue), then my defense is simply that we ought to be Bayesians. If it is not a theorem, then 'expert' refers to a track record of reliability. I am arguing that *presuming* our future reliability is a precondition of diachronic agency, even if we can't prove it from the calculus alone."
  4.  **Close:** "So, it's either a theorem of the system we are assuming, or a pragmatic precondition of having a self over time. Either way, the principle holds."

  *(Note: This answer is a bit of a dodge, but it prevents you from getting stuck in a definitional loop during the seminar.)*
