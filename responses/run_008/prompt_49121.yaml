answer: |-
  It is a pleasure to speak with someone who recognizes the alternating harmonic series immediately. Your accounting background gives you a distinct advantage here: you understand that a ledger must balance regardless of how you sort the entries, and that is precisely where the Pasadena game breaks the "ledger" of Expected Utility Theory.

  Here is the conceptual resolution to your corner.

  ### The Math vs. The Decision
  You are absolutely correct that the mathematics driving the Pasadena game is the Riemann Rearrangement Theorem. The series of expected payoffs is conditionally convergent ($\ln 2$ in the natural order), which means it is not *absolutely* convergent. In rigorous probability theory (specifically measure theory), an expected value is defined as a Lebesgue integral. A Lebesgue integral is only well-defined if the sum of the absolute values is finite (absolute convergence). Because the Pasadena game fails this test, a rigorous probabilist would say the expected value **does not exist**, even though the series sums to $\ln 2$ if you add it in the specific order $n=1, 2, 3...$

  ### The "Fixed Order" Illusion
  Your intuition about the "fixed sequence of play" is the crux of the matter. You argue that because the coin tosses happen in a specific order (1st toss, 2nd toss, etc.), the summation order is fixed, so the value should be $\ln 2$.

  However, decision theory is not about what happens *during* the game; it is about pricing the ticket *before* the game. To price the ticket, you must consider the entire probability space at once. The paradox arises because there is no unique way to "sum up" a probability space. While the game rules index outcomes by $n$, a decision theorist can partition the same set of outcomes differently (e.g., grouping specific wins and losses together) without changing the physical game. If you group the terms differently, you are effectively rearranging the series.

  If the value of the gamble changes based on how you group the possibilities in your mind—even though the physical game is identical—then "Expected Value" fails as a guide for rational choice. A rational price should be invariant to how you describe the gamble. Since the Pasadena game yields different "values" under different valid descriptions, it has no single rational price.

  ### The Accountant's Analogy
  Think of it like auditing a company with infinite contingent liabilities. If you list the liabilities by date, the net present value is \$1 million. If you list them by vendor, the net present value is \$5 million. The physical debts haven't changed, but your valuation method is unstable. In accounting, you would refuse to sign off on the books until the valuation method was robust. In decision theory, the Pasadena game forces us to admit the "books" of Expected Utility cannot be signed off for this specific gamble.

  ### Summary
  The rearrangement theorem provides the *mechanism* for the paradox, but the *paradox* itself is about the failure of rational choice axioms (specifically, description invariance) when faced with that mechanism. The fixed physical order does not save the expected value because expectation is a static property of the distribution, not a temporal process.

