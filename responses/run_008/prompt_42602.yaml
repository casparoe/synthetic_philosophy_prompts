prompt: |-
  I chair the search commitee for our new ancient philosophy line this year, and we've managed to walk ourselves into something I lecture on every spring in my social choice seminar and still can't settle when it's my own problem on the line. The committee is just three of us this cycle (everyone else is on leave or dodging service). We agreed in advance on the criteria: the candidate needs (a) a genuinely strong research record and (b) a credible teaching fit, and we hire iff both. On the top candidate, the votes went like this. I said yes to (a), yes to (b), hire. My colleague R said yes to (a), no to (b), don't hire. Colleague S said no to (a), yes to (b), don't hire. So a majority of us endorsed each premise, but a majority voted against hiring.

  The dean wants one recommendation, with reasons attached. R says the only thing we ever actually voted on was the motion "recommend hiring," and that motion lost 2-1, end of story — tallying premises instead is just the chair gerrymandering the vote until it comes out the way he wants. S says the opposite: we committed to the criteria in advance, premise-by-premise is the only tally that respects that commitment, and counting conclusions lets two people's holistic hunches veto an evaluation each of them only disputed half of. I keep noticing that whichever way we go, the report to the dean will read either "the committee judged the research strong, judged the teaching credible, and recommends against hiring" or the same two judgments plus "recommends hiring" — and one of those documents makes my department look like it can't do basic modus ponens in writing. I know this is a cousin of the Condorcet paradox, but I'm not sure that helps, since there's no cycling here, just a straight collision.

  So give me a real answer, not a tour of the options. Which recommendation should we send, and why is the other tally not merely disfavored but wrong in an instructive way? If you genuinely think both tallies are defensible, own that, but then tell me what feature is missing from our situation that, if it were present, would make one clearly win — and whether the dean should care about the difference. I get enough "it depends on your theory of group agency" from my grad students.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the User and the Problem:**
      *   **User:** Chair of a search committee in Ancient Philosophy. Teaches social choice theory (specifically mentions a "social choice seminar"). This means they know the technical literature (Condorcet, doctrinal paradox, discursive dilemma, etc.). They don't want a textbook summary; they want a *decision* and a *justification* that cuts through the theoretical noise.
      *   **Context:** 3-person committee. Criteria agreed upon *in advance*: Hire iff (Research Strong AND Teaching Credible).
      *   **Votes:**
          *   Chair (C): Yes (R), Yes (T) $\rightarrow$ Hire.
          *   Colleague R: Yes (R), No (T) $\rightarrow$ No Hire.
          *   Colleague S: No (R), Yes (T) $\rightarrow$ No Hire.
      *   **Outcome:**
          *   Premise-wise (Pw): Research (2-1 Yes), Teaching (2-1 Yes) $\rightarrow$ Hire.
          *   Conclusion-wise (Cw): Hire (1-2 No) $\rightarrow$ No Hire.
      *   **The Conflict:** This is the classic **Doctrinal Paradox** (or Discursive Dilemma).
      *   **The Stakes:** A report to the Dean. Either "Strong Research + Good Teaching $\rightarrow$ No Hire" (looks irrational/inconsistent) OR "Strong Research + Good Teaching $\rightarrow$ Hire" (overrules the majority vote on the motion).
      *   **The Request:** "Give me a real answer, not a tour of the options." "Which recommendation should we send, and why is the other tally not merely disfavored but wrong in an instructive way?" If both are defensible, what's missing to make one win?

  2.  **Deconstruct the Theoretical Landscape (Internal Knowledge):**
      *   This is the *Doctrinal Paradox* (Kornhauser & Sager, 1986).
      *   *Premise-based procedure (PBP):* Vote on premises, derive conclusion. Ensures logical consistency.
      *   *Conclusion-based procedure (CBP):* Vote on conclusion directly. Ensures democratic majoritarianism on the outcome.
      *   *List & Pettit (2002):* Impossibility theorem showing you can't have both perfect consistency and perfect responsiveness to individual judgments on all propositions simultaneously in a group.
      *   *User's Constraint:* They know this. They don't want "List & Pettit say..." They want a normative judgment for *this specific administrative context*.

  3.  **Evaluate the Specific Context:**
      *   **Pre-commitment:** The committee *agreed in advance* on the criteria: "hire iff both." This is crucial. It transforms the decision from a holistic preference aggregation to a rule-bound judgment aggregation.
      *   **Role of the Committee:** They are agents of the department/dean, tasked with applying specific standards, not expressing personal preferences.
      *   **The "Gerrymandering" Charge:** R claims counting premises is gerrymandering. S claims counting conclusions violates the pre-commitment.
      *   **The "Modus Ponens" Charge:** The Chair worries about the department looking irrational.

  4.  **Formulate the Recommendation:**
      *   *Option A (Conclusion-based):* Report "No Hire."
          *   *Pros:* Respects the actual vote on the motion.
          *   *Cons:* Makes the department look inconsistent (Yes on R, Yes on T, No on Hire). Violates the ex-ante agreement on how to decide. Undermines the criteria-based hiring process (allows holistic vetoes).
      *   *Option B (Premise-based):* Report "Hire."
          *   *Pros:* Logically consistent. Respects the ex-ante agreement on criteria. Prevents "holistic hunches" from overriding specific criteria.
          *   *Cons:* Overrules the majority vote on the final motion.

      *   *Decision:* **Premise-based (Recommend Hire).**
      *   *Why?* Because this is a *search committee*, not a legislature. Search committees are tasked with *evaluating candidates against standards*, not aggregating preferences. The pre-commitment to criteria ("hire iff both") functions as a constitutional rule for the committee. Ignoring the premises to respect the conclusion vote renders the criteria meaningless. If R and S are allowed to vote "No" on the conclusion despite admitting one criterion is met, they are effectively voting on hidden criteria or personal whims, which violates the mandate.

  5.  **Address the "Why the other is wrong" requirement:**
      *   Why is Conclusion-based wrong *here*? It treats the committee as a mini-parliament rather than an evaluation panel. It allows the "Doctrinal Paradox" to mask a violation of the agreed-upon mandate. It creates the "irrational department" appearance the Chair fears.
      *   *Instructional Value:* The error is confusing *preference aggregation* (voting on what we want) with *judgment aggregation* (voting on what is true according to rules). In hiring, we are judging truth/fit against standards, not preferring outcomes.

  6.  **Address the "If both are defensible" clause:**
      *   I need to take a stand. I shouldn't waffle. But I should acknowledge *when* CBP would be right (e.g., if the criteria weren't agreed upon, or if the vote was on policy preferences rather than factual/normative judgments of fit).
      *   *Missing Feature:* If the criteria were *not* binding (i.e., "these are guidelines, but we can veto for other reasons"), then CBP wins. But the prompt says "we hire iff both." That's a binding rule.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, direct, acknowledging the user's expertise (no baby talk about Condorcet), but decisive.
      *   *Structure:*
          1.  Direct Answer (Recommend Hire).
          2.  The Core Justification (Mandate vs. Preference).
          3.  Why the Alternative is Wrong (The "Gerrymandering" rebuttal).
          4.  The Missing Feature (When CBP would win).
          5.  Advice for the Dean/Report.

      *   *Refining the Argument:*
          *   Focus on the *ex-ante agreement*. That is the tie-breaker in the literature on the Doctrinal Paradox for non-legislative bodies.
          *   R's argument ("only voted on motion") is procedurally formalistic but substantively empty because the motion was defined by the premises.
          *   S's argument is correct.
          *   The "Modus Ponens" fear is real. A report saying "R=Yes, T=Yes, Hire=No" is indefensible in a research university. It admits irrationality.
          *   *Key distinction:* This is **Judgment Aggregation**, not **Preference Aggregation**. In hiring, "Research is Strong" is a truth-claim (or quasi-truth claim) about the candidate relative to a standard. "Hire" is a logical consequence. If we treat "Hire" as a preference, we break the system.

  8.  **Final Polish:**
      *   Make sure to explicitly answer the "what feature is missing" part. (The feature is whether the criteria are *constitutive rules* or *heuristics*).
      *   Ensure the advice on the report is practical. (Write the report based on the premises).

      *(Self-Correction during drafting)*: Wait, if I tell them to recommend Hire, they are overruling 2/3 of the committee on the final motion. Is that sustainable?
      *   *Counter:* The Chair has a tie-breaking role or a duty to enforce procedure. If the procedure was "vote on premises," then the conclusion vote was advisory or derivative. If the procedure was "vote on conclusion," then the premise discussion was advisory.
      *   *Prompt Clue:* "We agreed in advance on the criteria... and we hire iff both." This sounds like a constitutive rule.
      *   *Social Choice Insight:* In *judgment aggregation* problems where the group is tasked with applying a rule (like a court or a search committee), the Premise-Based Procedure is generally normatively superior because it ensures *integrity of the process* over *responsiveness to individual outcomes*. (See Kornhauser & Sager's original legal context).
      *   *Decision:* Stick with Premise-Based. It protects the institution's rationality and the agreed-upon standards.

  9.  **Finalizing the Output:** (Matches the thought process above, ensuring directness and avoiding "on the one hand, on the other hand" waffling).

      *   *Headline:* Recommend Hiring.
      *   *Reason:* The committee is a truth-tracking/evaluation body bound by ex-ante rules, not a preference-aggregating body.
      *   *Why CBP is wrong:* It renders the criteria advisory and makes the department look irrational.
      *   *Missing Feature:* Whether the criteria were binding rules or non-binding guidelines.

      *(Wait, one nuance)*: The prompt asks "Which recommendation should we send." If the vote on the motion lost 2-1, does the Chair have the power to send a "Hire" recommendation?
      *   *Practicality:* The Chair writes the report. The Chair can frame the report based on the premise votes. The Chair can note that the conclusion vote was split but the *criteria* were met.
      *   *Better approach:* The recommendation *is* the output of the committee's logic. If the logic dictates Hire, the recommendation is Hire. The 2-1 vote on the conclusion was a procedural error given the ex-ante agreement.
      *   *Refinement:* I need to be careful not to tell the Chair to commit fraud. I need to tell them that the *valid* outcome of the committee's work, given its mandate, is Hire. The 2-1 vote on the conclusion is the anomaly to be explained away or overruled by the mandate.
      *   *Actually, looking at the prompt:* "The dean wants one recommendation." The Chair chairs the committee. The Chair can write the letter. The Chair should write the letter reflecting the *criteria satisfaction*.
      *   *Okay, let's look at the "Wrong in an instructive way" part.* The Conclusion-Based vote is wrong because it violates the *mandate*. The committee wasn't asked "Do you want to hire?" (preference). They were asked "Does the candidate meet the criteria?" (judgment).

      *Let's write it.*
answer: |-
  Send the recommendation to **hire**.

  Here is the direct justification, the reason the alternative is substantively wrong in this context, and the specific feature that distinguishes this from a case where the other tally would win.

  ### The Recommendation
  You should submit a report recommending hiring, grounded in the premise-based tally. The report should state: *The committee finds the research record strong (2-1) and the teaching fit credible (2-1). Per the agreed-upon criteria that hiring requires both, the committee recommends hiring.*

  You must treat the 2-1 vote on the final motion ("recommend hiring") as procedurally void or advisory, because it contradicted the committee's own constitutive rules.

  ### Why the Conclusion-Based Tally is Wrong (Not Just Disfavored)
  Your colleague R argues that counting premises is gerrymandering. This is incorrect because it misidentifies the nature of the committee's agency. A search committee is not a legislature; it is a **judicial-evaluative body**.

  1.  **Mandate vs. Preference:** In a legislature, representatives aggregate *preferences* over outcomes (Conclusion-Based is appropriate). In a search committee, members aggregate *judgments* against pre-existing standards (Premise-Based is appropriate). You were not asked, "Do you personally want this colleague?" You were asked, "Does this candidate satisfy conditions X and Y?"
  2.  **The Ex-Ante Commitment:** The critical fact is that you agreed "we hire iff both" *in advance*. This agreement functions as a constitutional rule for the committee. By voting "No" on the conclusion while voting "Yes" on both premises, R and S effectively amended the hiring criteria mid-process without authorization. They introduced hidden veto powers (holistic hunches) that violated the mandate.
  3.  **Institutional Rationality:** You correctly identified the reputational risk. A report stating "Research: Yes, Teaching: Yes, Hire: No" is an admission of institutional irrationality. It signals to the Dean (and the candidate, should it leak) that your department's criteria are meaningless and that hiring decisions are driven by opaque, unstated vetoes. In a research university, submitting a document that explicitly violates *modus ponens* is professionally indefensible.

  The Conclusion-Based tally is wrong here because it prioritizes **responsiveness to individual members** over **fidelity to the committee's mandate**. In an evaluative context, fidelity to the mandate must win.

  ### The Missing Feature: Binding vs. Advisory Criteria
  You asked what feature is missing that, if present, would make the Conclusion-Based tally clearly win.

  The feature is **whether the criteria are binding rules or non-binding heuristics.**

  *   **Current Situation (Binding):** "We hire iff both." This makes the premises constitutive of the decision. The conclusion is a logical derivation, not a separate object of choice. Premise-Based wins.
  *   **Alternative Situation (Advisory):** If you had agreed, "We should look for strong research and teaching, but members may vote based on any factors they deem relevant," then the criteria are merely heuristic. In that case, R and S are entitled to weigh other factors (collegiality, sub-field balance, gut feeling) in their final vote. The conclusion vote then captures the "all-things-considered" judgment, and the Premise votes are just data points. In *that* scenario, Conclusion-Based wins, and the Premise-Based tally would be the gerrymander.

  ### Does the Dean Care?
  Yes. The Dean cares about **accountability** and **risk**.
  *   If you hire based on the Premise tally, the Dean sees a candidate who met the published standards. If the candidate fails later, the process was sound.
  *   If you reject based on the Conclusion tally, the Dean sees a department that cannot articulate why it rejected a qualified candidate. This invites grievance procedures, accusations of bias (since the vetoes were unstated), and difficulty recruiting in the future (candidates will hear the department is capricious).

  ### Instruction for the Report
  Do not frame this as "The Chair overruled the vote." Frame it as "The committee's vote on the motion was inconsistent with the committee's agreed-upon evaluation rubric."

  Write the letter yourself as Chair. State clearly:
  > "In accordance with the criteria established at the outset of the search, the committee found the candidate met the threshold for research excellence and teaching fit. While there was divergence on the final motion, the satisfaction of the requisite criteria compels a positive recommendation."

  This protects the department's rationality, honors your ex-ante agreement, and fulfills the specific function of a search committee: applying standards, not aggregating whims.
