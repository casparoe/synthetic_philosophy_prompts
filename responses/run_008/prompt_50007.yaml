      *   *Diagnosis:* The user holds a "Discrete Act" intuition for the pond (each drowning is a new emergency) but a "Budget/Quota" intuition for charity (monthly allowance). These are logically incompatible if the moral value of the life saved is identical.

  5.  **Selecting the "Best" Principle:**
