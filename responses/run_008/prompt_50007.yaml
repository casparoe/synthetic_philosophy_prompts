          *   Donation: Excused if gave earlier this month.
          *   Pond: *Not* excused if saved a child earlier this month.
          *   *Internal Conflict:* User admits these feel right but can't see how both are right. This is a crucial inconsistency to highlight.
      *   *Case 5 (Own Child vs. Stranger):* Special obligation to kin. Permitted/Ought to save own. *Limits general obligation.*
      *   *Case 6 (High Cost/Arm/Job):* Supererogatory. Not wrong to refuse. *Limits cost threshold.*

  3.  **Drafting the Principle(s):**
