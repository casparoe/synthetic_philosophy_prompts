      If (3) says subjects disagree on imagery in thought, and (1) says the report has substantial weight... whose report wins? If Subject A says "Imagery" and Subject B says "No Imagery," (1) gives both weight. They contradict. Theory can't match both. So (1) leads to contradiction if (3) is true. This confirms (1) must go or be heavily qualified.

