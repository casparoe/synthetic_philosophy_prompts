answer: |-
  This is a sharp diagnosis of a literature that has indeed settled into a trench war. You are correct that the debate has calcified, and your hypothesis—that this is a disagreement about the *function* of decision theory—is close to the mark, but I think it requires a specific refinement to capture why the arguments bounce off one another.

  Here is the diagnosis: The standoff is not primarily about the function of decision theory (both sides claim to be offering a normative theory of rationality), but about the **boundary between formal coherence and substantive rationality.**

  ### 1. Refining Your Hypothesis: Constitutive vs. Substantive Norms

  Your hypothesis suggests a split between "systematization of preferences" (Buchak) and "standard of instrumental rationality" (Critics). I would correct this slightly: **Both sides claim to offer a standard of instrumental rationality.** The disagreement is about what constitutes the *formal scaffolding* of agency versus what counts as a *substantive goal*.

  *   **The EU Camp (e.g., Briggs, Pettigrew, Thoma):** They treat the Independence axiom (and the Sure-Thing Principle) as a **constitutive norm** of means-end coherence. On this view, violating Independence implies a failure to separate the *value of the outcome* from the *probability of the outcome*. If you value the "sure-ness" itself, you must encode that in the utility of the outcome, not in the weighting function. To them, REU mistakes a substantive preference (for security) for a formal requirement of reasoning. The "instrumental" failure is that the REU agent's preferences over acts do not map cleanly onto a stable valuation of states of the world.
  *   **The REU Camp (Buchak):** She treats Independence as a **substantive norm** of risk neutrality. On this view, risk attitude is a primitive global perspective on how to trade off potential gains against potential losses, distinct from how much one values the gains/losses themselves. To her, the EU camp's "redescription strategy" (individuating outcomes to include "security" or "regret") renders decision theory trivial. If *any* preference structure can be modeled as EU-maximizing by sufficiently fine-grained outcome individuation, EU loses its normative bite.

  **Why this causes a standoff:**
  When critics argue that REU agents are dynamically inconsistent, they are invoking a norm of **diachronic coherence** that they view as formal (a rational agent must not undermine their own future choices). Buchakians reply that dynamic consistency is only a requirement for *myopic* choosers; a *resolute* chooser can maintain REU preferences without inconsistency.
  *   The Critic hears: "I am allowed to bind my future self arbitrarily."
  *   The Buchakian hears: "You are assuming a specific, controversial theory of planning (separability) and calling it 'rationality'."

  They are talking past each other because they disagree on which axioms are the "logic of agency" and which are "ethics of risk."

  ### 2. The Hidden Formal Question: Identification, Not Collapse

  You asked if there is a hidden formal question doing the work, such as whether REU collapses into EU. Formally, REU does not collapse into EU; the representation theorems are distinct. However, there is a deeper formal issue that fuels the normative dispute: **Uniqueness and Identification.**

  *   **The Critic's Worry (Pettigrew, Meacham):** In EU, if you satisfy the axioms, $p$ and $u$ are unique up to positive linear transformation. In REU, the triplet $\langle p, u, r \rangle$ is not uniquely determined by preferences alone without fixing $r$ or $p$ independently. If the risk function $r$ cannot be uniquely elicited from choice behavior (because different combinations of $u$ and $r$ can generate the same ordering), then $r$ looks like a mathematical artifact rather than a psychological or normative reality.
  *   **The Buchakian Reply:** We *can* elicit $r$ through introspection or specific elicitation mechanisms that hold $u$ fixed. Furthermore, the lack of uniqueness in the representation theorem doesn't imply the lack of reality in the risk attitude, any more than the lack of uniqueness in utility scales implies desires aren't real.

  **The Stalemate:** This is an underdetermination problem. The EU camp says, "If the math can't distinguish risk attitude from utility curvature, you haven't found a new parameter; you've just rotated the coordinates." The REU camp says, "The math reflects the structure of the preference, and the structure includes a global risk parameter that EU forces you to hide in the local utility."

  Progress here would require a **measurement theorem** that shows $r$ is recoverable from choice data under conditions that EU proponents must accept. So far, REU proponents argue this requires accepting REU-friendly elicitation methods, which EU proponents reject as question-begging.

  ### 3. The Live Wire: Diachronic Agency and Planning Norms

  The most potent argument against REU remains the dynamic consistency/exploitability line (e.g., Thoma 2018, Bradley 2017). The argument is that an REU agent, if naive, is money-pumpable. If they are sophisticated or resolute, they either revert to EU behavior or adopt a planning norm that looks like "akrasia" (binding oneself against one's future preferences).

  *   **Diagnosis:** This is where the "function of decision theory" hypothesis is most relevant.
      *   If decision theory is a **guide for action at a time**, REU fails (because it recommends choices that your future self will undo).
      *   If decision theory is a **criterion for evaluating global policies**, REU succeeds (because the global policy maximizes REU value).

  The standoff persists because the EU camp assumes the primary unit of evaluation is the **decision node**, while the REU camp assumes the primary unit is the **strategy/plan**.
  *   **EU:** Rationality is local coherence.
  *   **REU:** Rationality is global coherence.

  ### 4. What Would Count as Progress?

  Given this diagnosis, standard representation theorems or Dutch Book arguments will not break the deadlock, as both sides have internalized these tools to support their respective axioms. Progress would likely come from one of three directions:

  **A. A Meta-Axiomatic Theory (The Philosophical Route)**
  We need a framework that distinguishes *constitutive* axioms from *substantive* axioms without relying on intuition.
  *   *Progress:* A demonstration that Independence is required for **interpersonal comparison** or **communication**, whereas Risk-Weighting is essentially private. If it could be shown that REU agents cannot coordinate or make binding agreements in a way EU agents can (due to the non-separability of preferences), that would elevate the EU critique from "you have weird preferences" to "you cannot participate in shared agency."

  **B. A Theory of Diachronic Rationality (The Formal Route)**
  The debate hinges on the normative status of "Resolute Choice."
  *   *Progress:* A formal model of **Diachronic Rationality** that does not presuppose Separability. Currently, "dynamic consistency" is often defined *in terms of* EU-friendly planning. If a neutral framework could show that Resolute Choice is either (a) rationally mandatory (helping REU) or (b) inherently unstable/arbitrary (helping EU) without begging the question, the standoff would break. Currently, the definition of "rational planning" is the contested variable.

  **C. The "Triviality" Threshold (The Methodological Route)**
  The EU redescription strategy (individuating outcomes to save Independence) risks making EU unfalsifiable.
  *   *Progress:* A consensus on **Description Invariance**. If the EU camp concedes that there are limits to outcome individuation (e.g., you cannot include "having chosen this gamble" as part of the outcome description without cost), then REU gains ground. If the REU camp concedes that *some* risk attitudes *are* actually outcome valuations (e.g., regret), the debate narrows to which Allais preferences are which. Currently, both sides treat the individuation of outcomes as a move in the game rather than a rule of the game.

  ### 5. Verdict on the Standoff

  You asked if the standoff should be expected to persist. **Yes.**

  The reason is that the disagreement is **bedrock**, but not in the way you initially framed it. It is not about "permissiveness." It is about the **ontology of the agent.**
  *   **EU Ontology:** The agent is a locus of beliefs and desires over *world states*. Rationality is the correct mathematical interface between them.
  *   **REU Ontology:** The agent is a locus of beliefs, desires, and a *perspective on distributions*. Rationality includes the coherence of that perspective.

  Until there is a shift in the philosophy of action regarding whether "risk" is a property of the *world* (which EU captures via probabilities) or a property of the *agent's orientation* (which REU captures via $r$), the axioms will remain proxies for these deeper metaphysical commitments.

  **Correction to your framing:** You suggested one side views DT as "systematization of preferences" and the other as "standard of instrumental rationality." I would argue **both** view it as a standard of instrumental rationality. The split is that EU proponents view instrumental rationality as **internal coherence of mental states** (where Independence is a consistency constraint), while REU proponents view it as **faithfulness to the agent's global evaluative stance** (where Independence is a substantive constraint on how value aggregates).

  **Summary Diagnosis:** The debate is a **category dispute** masquerading as an axiomatic one. The EU camp treats Risk as a derivative of Belief/Desire (to preserve formal elegance and diachronic stability). The REU camp treats Risk as a primitive (to preserve descriptive fidelity and normative permissiveness). Progress requires moving upstream to the philosophy of planning and the metaphysics of risk, rather than downstream to more representation theorems.
