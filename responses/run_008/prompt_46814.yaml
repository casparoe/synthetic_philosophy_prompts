answer: |-
  You have put your finger on one of the most substantive tensions in contemporary philosophy of physics and mind. Your intuition is correct: the physicist's notion of **universality** (via the Renormalization Group) and the philosopher's notion of **multiple realizability (MR)** are structurally distinct, even if they are often conflated in casual discourse.

  Here is the breakdown of the terminology, the distinction, a proposed coinage for the specific phenomenon you describe, and an analysis of the edge cases.

  ### 1. The Established Terminology (and why it feels off)

  In philosophy of mind, **Multiple Realizability** (Putnam, Fodor) is primarily a *modal* and *classificatory* claim. It states that a higher-level kind $M$ (e.g., pain) can be instantiated by a disjunction of lower-level physical kinds $\{P_1, P_2, P_3...\}$. It is an argument against type-identity theory. However, standard MR often lacks a *mechanism*. It asserts that the realization can vary, but it doesn't always explain *why* the higher-level laws remain stable despite that variation.

  In condensed matter, **Universality** is a *dynamical* claim. It states that under RG flow, microscopic parameters correspond to **irrelevant operators** that decay to zero as the correlation length $\xi \to \infty$. The macro theory doesn't just "allow" different microstructures; it mathematically *ejects* them from the effective Hamiltonian.

  Philosophers of physics, notably **Robert Batterman** (in *The Devil in the Details*) and **Margaret Morrison**, have explicitly critiqued the conflation of these two. Batterman argues that RG explanations are **asymptotic explanations**. They rely on singular limits (e.g., the thermodynamic limit) where the micro-details don't just "vary"; they become mathematically undefined or irrelevant to the macro behavior.

  So, to answer your first question: There is no single, universally standardized term in philosophy that cleanly separates "classificatory MR" from "dynamical RG-insensitivity," though **"Autonomy of the Special Sciences"** is the broader bucket. However, given your request to coin a term if the distinction lacks a precise name, I propose the following.

  ### 2. Coining a Term: "Asymptotic Autonomy"

  Let us define **Asymptotic Autonomy** as the pattern where a higher-level theory's predictive efficacy becomes independent of lower-level details due to a dynamical flow (like RG) that suppresses micro-parameters as irrelevant operators, rather than merely by functional definition.

  **Definition:** A system exhibits *Asymptotic Autonomy* if:
  1.  There exists a scale parameter $\lambda$ (e.g., correlation length, system size).
  2.  As $\lambda \to \infty$ (or $\lambda \gg$ microscopic scale), the effective equations of motion for the macro-variables converge to a fixed form.
  3.  Variations in micro-parameters correspond to trajectories in the coupling-constant space that flow into the same basin of attraction (universality class).
  4.  Consequently, the macro-theory is **causally screened** from the micro-details not by convention, but by the dynamics of the flow.

  **Distinction from Multiple Realizability:**
  *   **MR** says: "State $S$ can be made of Stuff $A$ or Stuff $B$." (Compatible with the idea that the laws governing $S$ might still look different depending on whether it's $A$ or $B$).
  *   **Asymptotic Autonomy** says: "The laws governing State $S$ are identical regardless of Stuff $A$ or $B$ because the parameters distinguishing $A$ and $B$ are irrelevant operators."

  ### 3. The Edge Cases

  You asked where the edge sits. This is determined by **scale separation** and the **direction of causality**.

  #### Case A: Navier-Stokes (Water vs. Mercury)
  **Does Asymptotic Autonomy cover this? Yes.**
  This is the canonical example of an Effective Field Theory (EFT) in the continuum limit.
  *   **Mechanism:** You integrate out the high-momentum modes (molecular collisions). The specific inter-molecular potential (Lennard-Jones parameters) becomes irrelevant.
  *   **Result:** The viscosity $\eta$ and density $\rho$ remain as *renormalized* parameters, but the *form* of the Navier-Stokes equation does not care about the molecular mass or charge.
  *   **Verdict:** This is pure Asymptotic Autonomy. The micro-details are "forgotten" via the continuum limit ($Kn \to 0$, where $Kn$ is the Knudsen number).

  #### Case B: Downward Causation / Feedback
  **Does it break down here? Yes.**
  This is where the analogy between condensed matter and philosophy of mind often fractures.
  *   **The RG Assumption:** The RG flow assumes a fixed microscopic Hamiltonian $H_{micro}$. The "micro" defines the flow, and the "macro" is the result. The macro does not reach back and rewrite $H_{micro}$.
  *   **The Mind/Brain Problem:** Mental states (macro) arguably induce neuroplasticity (micro). If a cognitive state (e.g., learning a skill) alters the synaptic weights or connectivity graph, it is effectively changing the microscopic couplings $J_{ij}$ in the Hamiltonian.
  *   **The Breakdown:** If the macro-state changes the micro-couplings significantly enough to shift the system into a **different basin of attraction** (a different universality class), Asymptotic Autonomy fails. The "forgetting" mechanism relies on the micro-structure being static relative to the relaxation time of the macro-variables.
  *   **Implication:** In a system with strong downward causation, the separation of scales blurs. The "irrelevant operators" at the micro-level might get pumped back up to become "relevant" because the macro-state is actively tuning them. This violates the condition of the RG fixed point being stable.

  ### 4. Summary for the Physicist-Philosopher

  Your nagging feeling is justified by the literature.
  1.  **Multiple Realizability** is a claim about **ontology and classification** (many-to-one mapping).
  2.  **Universality (RG)** is a claim about **dynamics and insensitivity** (flow to a fixed point).

  Philosophers of mind often use MR to argue for the autonomy of psychology, but they lack the RG mechanism to explain *why* that autonomy holds. They assert the independence; you know the math that *enforces* it.

  If you wish to be precise in your philosophical writing, distinguish **Classificatory Multiple Realizability** (the philosopher's standard) from **Dynamical Universality** (your physicist's standard). If you need a term for the specific phenomenon where the theory stops caring about the details due to flow dynamics, use **Asymptotic Autonomy**.

  It holds for fluids and magnets (where scale separation is robust). It becomes precarious in biology and cognition (where the macro level modifies the micro topology), suggesting that if mental states are autonomous, it might not be for the same clean mathematical reasons that the Ising model is universal.
