      *   *Epistemicism:* HOV is real. There are boundaries between definite and borderline. We just don't know them either. It's sharp all the way up.
      *   *Supervaluationism:* Tries to model HOV via iterations of the "Definitely" operator ($D$). $Dp$ is true if $p$ is true on all admissible sharpenings. $DDp$, etc.
      *   *The Regress:* If the set of admissible sharpenings is vague, Supervaluationism needs a meta-supervaluationism. This leads to the "sharp boundary of the set of sharpenings" objection (Williamson's killer blow).
      *   *Verdict:* HOV is a serious problem for Supervaluationism because it threatens to collapse into Epistemicism at the meta-level. Epistemicism bites the bullet and accepts HOV as sharp boundaries of knowledge.

  6.  **Synthesizing and Structuring the Response:**
