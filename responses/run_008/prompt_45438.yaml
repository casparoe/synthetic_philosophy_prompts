          *   Analyze Supervaluationism: It locates vagueness in *semantic indecision*. The "Decision" is missing.
          *   The "Relocation" Critique: Address the user's worry about the set of sharpenings. Does Supervaluationism just push the sharpness up? Yes, arguably. The boundary of "admissibility" is the new sharp cutoff.
      *   **Section 2: The Friend's Deflationary Claim:**
