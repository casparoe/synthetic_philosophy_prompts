answer: |-
  This is a genuinely sharp framing. You've cut past the usual "sharp boundary vs. truth-value gaps" boilerplate and hit on the metaphysical engine driving both views. Your "Envelope vs. Decision" metaphor captures the modal status of the facts involved better than most intro textbooks do.

  Let's run with your framing. I'm going to steelman both sides to see if the "Decision" view actually holds water, or if it leaks into the "Envelope" view when you press it on higher-order vagueness. Then we'll tackle your friend's deflationary claim.

  ### 1. The Envelope vs. The Decision: Where Does Vagueness Live?

  Your intuition is correct: both Epistemicism (let's say, Timothy Williamson's version) and Supervaluationism (Kit Fine or Rosanna Keefe) agree that the *world* isn't vague. There is no fuzzy cloud of matter hovering over 57 grains of sand. The sand is discrete. The disagreement is about the semantic machinery mapping words to that sand.

  **The Epistemicist's Envelope**
  For the epistemicist, the "Envelope" contains a specific number $n$. At $n$ grains, "heap" is true; at $n-1$, it is false. The vagueness is entirely a feature of our *ignorance*.
  *   **Does this locate vagueness in language?** Yes, but in a specific way. It locates it in the *limits of our cognitive access to meaning*. The meaning is precise (fixed by causal history, usage, etc.), but our ability to discriminate that meaning is subject to a "margin for error" principle. We can't know the cutoff because knowing it would require a discrimination ability we don't possess.
  *   **The Strength:** It preserves classical logic and semantics perfectly. No truth-value gaps, no weird modifications to logic.
  *   **The Weakness (on your framing):** It makes the "Envelope" feel suspiciously like a feature of the world. If there is a fact of the matter that 57 grains is *not* a heap, but 58 *is*, that boundary looks ontologically robust, even if we can't see it. It risks making vagueness an illusion of the mind rather than a feature of language.

  **The Supervaluationist's Decision**
  For the supervaluationist, the "Decision" was never made. Our linguistic practice fixed the clear cases (1 grain = not heap, 1,000,000 = heap) but left the middle underdetermined.
  *   **Does this locate vagueness in language?** Yes, more robustly than epistemicism. It says the *semantic rules themselves* are incomplete. There is no fact of the matter because the language didn't settle it.
  *   **The Relocation Problem:** You asked if this just relocates the problem one story up. This is the killer objection (championed by Williamson and others).
      *   Supervaluationism defines truth as *supertruth*: true on all *admissible sharpenings*.
      *   To make this work, the set of "admissible sharpenings" must be defined.
      *   **The Question:** Is the boundary of that set sharp?
      *   **If Yes:** Then there is a sharp cutoff between an admissible sharpening (where 57 is a heap) and an inadmissible one (where 57 is not). You haven't eliminated sharp boundaries; you've just moved them from the object language (grains of sand) to the meta-language (meanings of "heap"). You still have an "Envelope," it's just wrapped around meanings instead of sand piles.
      *   **If No:** Then the set of admissible sharpenings is *itself* vague. But now you need a theory of *that* vagueness. If you apply supervaluationism again (super-sharpenings), you start a regress. If you stop the regress somewhere, you have a sharp boundary at that level.

  **Verdict on the Framing:**
  The Supervaluationist wants to say the "Decision" is unmade. But to make their logic work, they usually have to treat the *constraints on decision-making* (admissibility) as precise. So, on your framing, Supervaluationism often secretly relies on an "Envelope" at the meta-level. Epistemicism is at least honest about the Envelope being at the object level. However, Supervaluationism succeeds better at capturing the *phenomenology* of vagueness: it feels like something is unsettled, not just that we are ignorant.

  ### 2. Your Friend's Deflationary Claim: Is it Just Bookkeeping?

  Your friend argues that "admissible sharpening" (Supervaluationism) and "candidate meaning compatible with usage" (Epistemicism) are the same thing, and the only difference is rhetoric (hidden fact vs. no fact).

  **Where your friend is right:**
  They both start from the same data: usage underdetermines extension. Both agree that multiple precise extensions are compatible with our linguistic history. If you look at the semantic setup, they look identical.

  **Where your friend is wrong (The Substantive Disagreement):**
  The disagreement isn't rhetoric; it's about the **Law of Bivalence** and the **Nature of Truth**. This shows up in hard logical and normative consequences.

  **Test Case 1: "There is a fact of the matter whether 57 grains is a heap."**
  *   **Epistemicist:** This sentence is **True**. There is a fact. It corresponds to the sharp cutoff in the Envelope. We just don't know which fact it is.
  *   **Supervaluationist:** This sentence is **False** (or lacks a truth value). For a supervaluationist, a "fact of the matter" implies determinacy (supertruth). Since "57 is a heap" is not supertrue (it's true on some sharpenings, false on others), there is no fact of the matter.
  *   **Why this matters:** This isn't bookkeeping. It's a disagreement about reality. One says reality determines the truth value; the other says reality + language *fails* to determine it.

  **Test Case 2: The Borderline Speaker**
  Imagine a speaker confidently asserts, "57 grains is a heap."
  *   **Epistemicist:** The speaker is either saying something True or something False. However, they are **epistemically blameworthy**. They are asserting something they cannot know. They are guessing about the contents of the Envelope.
  *   **Supervaluationist:** The speaker is asserting something that is **neither true nor false** (it's indeterminate). Depending on the norm of assertion you adopt (e.g., "Assert only what is supertrue"), the speaker is violating a semantic norm. They aren't ignorant of a fact; they are treating an unsettled question as settled.
  *   **Why this matters:** For the epistemicist, the mistake is *epistemic* (lack of knowledge). For the supervaluationist, the mistake is *semantic* (misunderstanding the status of the predicate).

  **Test Case 3: The Law of Excluded Middle ($P \lor \neg P$)**
  *   **Epistemicist:** $P \lor \neg P$ is true because one of the disjuncts is true.
  *   **Supervaluationist:** $P \lor \neg P$ is **supertrue** (because on every sharpening, either $P$ is true or $\neg P$ is true). However, neither $P$ nor $\neg P$ is supertrue.
  *   **The Weirdness:** The supervaluationist accepts the classical theorem but rejects the intuition that if a disjunction is true, one of the disjuncts must be. This is a massive logical divergence, not just rhetorical spin.

  So, no, I don't buy your friend's deflationary take. They are modeling the same *input* (usage data) but producing radically different *outputs* (logic and truth conditions).

  ### 3. Higher-Order Vagueness: Myth or Reality?

  Higher-order vagueness (HOV) is the problem of the boundary between "definitely a heap" and "borderline heap." Is there a sharp cutoff there?

  **The Myth:**
  Both sides tell a story that the other has an insurmountable HOV problem.
  *   Epistemicists say Supervaluationism collapses into Epistemicism because the set of sharpenings must be sharply defined.
  *   Supervaluationists say Epistemicism is absurd because it posits sharp boundaries between "definitely known" and "unknown."

  **The Reality:**
  HOV is actually **worse for the Supervaluationist**, and here is why.

  **Epistemicism handles HOV by biting the bullet.**
  Williamson's move is to say: "Yes, there is a sharp boundary between the definite cases and the borderline cases. We just don't know where it is either." It's sharp boundaries all the way up. It's counterintuitive, but it's consistent. You don't get a regress; you just get more ignorance. The theory doesn't break; it just becomes more demanding on our ignorance.

  **Supervaluationism faces a structural regress.**
  To handle HOV, supervaluationists introduce a "Definitely" operator ($D$). $Dp$ is true if $p$ is true on all admissible sharpenings.
  *   But what about $DDp$? (Definitely Definitely a heap).
  *   To model this, you need to vary the set of admissible sharpenings.
  *   If the *boundary* of the set of admissible sharpenings is vague (which it must be, to avoid the "relocation" problem you identified), then you need a *meta*-supervaluationism to define truth over those varying sets.
  *   If you do that, you start an infinite regress of meta-languages.
  *   If you *don't* do that, and you say the set of admissible sharpenings is precise, then you have a sharp boundary between admissible and inadmissible meanings.
  *   **The Collapse:** If there is a sharp boundary between admissible and inadmissible meanings, then there is a sharp boundary between "true on all admissible sharpenings" and "not true on all admissible sharpenings." That looks suspiciously like the Epistemicist's sharp cutoff, just described in terms of meanings rather than grains of sand.

  **My Take:**
  The Supervaluationist's claim that they avoid sharp boundaries is the myth. They avoid them at the object level only by potentially accepting them at the meta-level. The Epistemicist admits the sharpness upfront.
  However, the Supervaluationist wins on **explanatory power regarding linguistic practice**. We *act* like there is no fact of the matter. We hesitate. We accept "It's kind of a heap." Epistemicism has to explain all that hesitation as pure error or ignorance. Supervaluationism explains it as a rational response to semantic indecision.

  ### Summary Conclusion

  Your "Envelope vs. Decision" framing is robust.
  1.  **Epistemicism** is the "Envelope." It delivers on vagueness being in our *access* to language, but it forces a sharp structure onto the language itself.
  2.  **Supervaluationism** is the "Decision." It delivers on vagueness being in the *structure* of language, but it risks relocating the sharpness to the boundary of "admissibility."

  Your friend is wrong that it's just bookkeeping. The disagreement over whether "There is a fact of the matter" is true is a genuine metaphysical rift, not a rhetorical one.

  On Higher-Order Vagueness: Epistemicism is more logically stable (it accepts the sharpness), while Supervaluationism is more linguistically plausible but logically precarious (it risks regress or collapse). If you want a theory that saves classical logic without regret, go Epistemicism. If you want a theory that saves the *phenomenology* of vagueness (the feeling that the decision is unmade), go Supervaluationism, but be prepared to defend the precision of "admissibility."

  If I were writing the paper, I'd argue that Supervaluationism is the better *descriptive* theory of how we use vague language, but Epistemicism is the better *preservative* theory of classical logic. The "Envelope" is logically cleaner; the "Unmade Decision" is humanly more accurate. The tension between those two goods is what keeps the seminar interesting.
