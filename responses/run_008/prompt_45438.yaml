          *   Refute the "just rhetoric" claim. The logic differs (Bivalence). The truth conditions differ.
          *   Example: "There is a fact of the matter." Epistemicist says Yes; Supervaluationist says No. That's not rhetoric; that's metaphysics.
      *   **Section 3: Borderline Speakers and Assertion:**
