      *   *Substantive Difference:* It's not just bookkeeping. It's about the logic and the metaphysics of truth.
          *   Logic: Supervaluationism rejects Bivalence (for borderline cases). Epistemicism keeps Bivalence.
          *   Metaphysics: Epistemicism says $P(n)$ is True or False. Supervaluationism says $P(n)$ is neither (gap).
