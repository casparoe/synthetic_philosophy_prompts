      *   *Borderline Speakers:*
          *   Epistemicist: One is right, one is wrong. Both are unjustified (ignorant).
          *   Supervaluationist: Both are saying something untrue (not false, but not supertrue). Or, if asserting "It is a heap," they are asserting something that isn't supertrue, hence inappropriate.
      *   *Logic:* Law of Excluded Middle ($P \lor \neg P$).
