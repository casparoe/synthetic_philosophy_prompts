      *   *Implicit Theory:* It's not pure Natural Law or pure Positivism. It's a form of *Post-Positivism* or *Constitutional Moralism*. It presupposes that the *Basic Order* (Grundgesetz) has a normative authority that allows it to judge the past.
      *   *Strict Presuppositions:* The state has the authority to punish grave moral wrongs regardless of prior positive enactment. The legal system has continuity despite regime change.
      *   *Underdetermination:* Both Hart and Fuller can explain this, but differently. Hart sees Track 2 as the real law and Track 1 as a moral choice disguised as law. Fuller sees Track 1 as the truth and Track 2 as a necessary evil. A Dworkinian might see both as integrity-based interpretations.
