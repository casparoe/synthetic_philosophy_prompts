answer: |-
  The post-1945 West German approach to Nazi-era wrongs presents a fascinating jurisprudential hybrid. To analyze it, we must look beyond the surface contradiction and examine the functional commitments of the legal system during a transitional period. Below is a reconstruction of the implicit theory, an analysis of its philosophical commitments, and an assessment of its consistency.

  ### Reconstruction of the Implicit Theory

  The two-track practice does not strictly presuppose a single, classical theory of law (such as pure Natural Law or exclusive Legal Positivism). Instead, it presupposes a theory of **Transitional Constitutionalism** grounded in **Substantive Justice**.

  This implicit theory holds that the legitimacy of the new legal order (the Basic Law or *Grundgesetz*) derives from its commitment to human dignity and fundamental rights. Consequently, the new order possesses the normative authority to judge the prior regime not merely by the prior regime's own standards, but by objective moral standards. However, this authority is constrained by the practical need for legal certainty and institutional continuity.

  Therefore, the system operates on a **hierarchy of norms**:
  1.  **Supra-positive Principles:** Certain moral truths (e.g., "do not kill innocents") are binding regardless of positive enactment.
  2.  **Positive Enactment:** Statutory law is necessary to define procedures, penalties, and limitations to ensure democratic legitimacy and notice.

  The two tracks are tools deployed based on the severity of the violation relative to this hierarchy. When a Nazi statute violated supra-positive principles so egregiously that it shattered the concept of law itself (Track 1), courts nullified it. When the conduct was morally culpable but technically fit within the prior positive order (Track 2), the legislature used retroactive statutes to bridge the gap between moral guilt and legal liability.

  ### Strict Presuppositions vs. What Merely Fits Well

  It is crucial to distinguish what this practice *requires* to function versus what theories merely *explain* it comfortably.

  **Strictly Presupposed:**
  1.  **Normative Continuity:** The Federal Republic is the same legal person as the prior German state, yet it possesses the authority to disavow the prior regime's normative claims.
  2.  **Moral Objectivity:** There exists a standard of justice independent of the Nazi positivist command that can be used to evaluate past conduct.
  3.  **Institutional Competence:** Courts have the authority to declare statutes void based on moral content, and legislatures have the authority to enact retroactive criminal laws in exceptional circumstances.

  **Merely Fits Well (Theoretical Accommodation):**
  1.  **Natural Law (Track 1):** The Radbruch formula fits Natural Law theory well, but the practice does not *strictly* require a metaphysical belief that unjust law is "no law." It only requires a rule of recognition that allows courts to invalidate statutes based on moral criteria.
  2.  **Positivism (Track 2):** The use of retroactive statutes fits Positivism well (admitting the old law was valid but changing it), but it does not prove the legislators were Positivists. They could have been Natural Lawyers using statutes merely as a procedural safeguard to ensure democratic consensus before punishing.

  ### Philosophical Underdetermination

  The practice is philosophically underdetermined because multiple competing jurisprudences can reconstruct it without altering the outcomes.

  *   **The Hartian (Positivist) Reconstruction:** H.L.A. Hart argued that the German courts should have used Track 2 exclusively. He would view Track 1 as a confusion of law and morals. However, a sophisticated Positivist could accommodate Track 1 by arguing that the *Rule of Recognition* changed in 1945. The new rule includes a moral threshold for validity. Thus, calling Nazi statutes "void" is just a shorthand for saying they fail the new system's criteria for recognition.
  *   **The Fullerian (Natural Law) Reconstruction:** Lon Fuller argued that Nazi law failed the "internal morality of law" (e.g., it was secret, retroactive, or contradictory). He would embrace Track 1. He could accommodate Track 2 as a regrettable but necessary deviation to restore the rule of law, viewing the retroactive statutes as a transitional exception rather than a standard legal operation.
  *   **The Dworkinian (Interpretivist) Reconstruction:** Ronald Dworkin would argue both tracks serve the principle of "integrity." The law is interpreted to show the political community in its best light. Punishing Nazi criminals is required by justice; using both tracks ensures that justice is done while respecting the distinct roles of courts (interpreting principles) and legislatures (setting policy).

  Because the actual court opinions and legislative records often shift between these rationales without settling on one metaphysical foundation, the practice itself does not resolve the Hart–Fuller debate. It utilizes the *resources* of both traditions pragmatically.

  ### Requirements for Theoretical Consistency

  If the practice were required to rest on one consistent theory, significant changes would be necessary:

  **To be Consistently Natural Law:**
  *   **Abolish Track 2:** If Nazi statutes were truly "no law" due to injustice, then acts committed under them were already crimes (e.g., murder) under the higher law. Retroactive statutes would be unnecessary and insulting to the moral truth. The courts should simply prosecute all Nazi crimes as common law crimes or violations of natural law, without needing legislative validation.
  *   **Risk:** This threatens legal certainty and democratic legitimacy, potentially appearing like victor's justice.

  **To be Consistently Legal Positivist:**
  *   **Abolish Track 1:** Courts must admit that Nazi statutes *were* valid law at the time. Punishment would *always* require explicit retroactive legislation (Track 2 only). The Radbruch formula would be rejected as judicial overreach.
  *   **Risk:** This forces the state to "confess" that it is punishing people for acts that were legal when performed, which undermines the moral authority of the new regime and relies heavily on the honesty of the legislature.

  ### Confidence Assessment

  **Confidence Level:** High (85%)

  I am highly confident in the historical description of the two tracks and the standard jurisprudential interpretations (Hart's preference for retroactivity, Fuller's preference for nullification). The analysis of how these theories can reconstruct the practice is standard fare in legal philosophy.

  **Point of Least Certainty:**
  I am least sure about attributing a coherent "implicit theory" to the practice as a whole. Legal systems are rarely philosophically monolithic; they are often bricolages of competing ideas forged in political compromise. It is possible there is no single implicit theory, but rather a pragmatic oscillation between theories depending on which political or judicial faction held sway at a given moment. Claiming there is a unified "Transitional Constitutionalism" might impose more coherence on the historical record than actually existed. The practice may be theoretically inconsistent not because of underdetermination, but because the actors themselves were theoretically divided.

  ### Conclusion

  The West German two-track practice does not prove that Natural Law and Positivism are compatible. Rather, it demonstrates that a legal system in transition may prioritize **substantive justice** over **theoretical purity**. It presupposes that the survival of a just order is more important than maintaining a consistent definition of legal validity. While both Hart and Fuller can explain the practice, neither can claim it exclusively validates their theory. To achieve consistency, Germany would have had to sacrifice either the moral clarity of nullification or the formal honesty of retroactivity. They chose instead to live with the tension.
