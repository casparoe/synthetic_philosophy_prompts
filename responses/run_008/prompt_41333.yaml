      *   *Fuller's View (Natural Law/Internal Morality):* Fuller argued Nazi "law" failed the internal morality of law (generality, publicity, non-retroactivity, etc.). So Track 1 fits Fuller. But what about Track 2? Fuller might struggle with retroactivity, but could argue it's a transitional necessity to restore the rule of law.
      *   *Reconciliation:* The practice might presuppose a *pragmatic* or *institutional* theory rather than a pure metaphysical one. It presupposes a commitment to *justice* that overrides strict consistency in legal theory. It treats "validity" as a functional concept.

