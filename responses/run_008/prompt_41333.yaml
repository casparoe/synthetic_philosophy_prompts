      *   *Track 2 (Legislative Retroactivity):* Legislature passes laws punishing acts that were legal under Nazi law (e.g., denunciations). This admits the old law *was* law (otherwise, why need new retroactive law?) but overrides it for policy/moral reasons. Looks like Positivism (law is what is posited, even if bad, so you need new positive law to change it).

