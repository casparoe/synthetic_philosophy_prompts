  The whiteboard still had the Bayes theorem derivation from the workshop, but the markers were dry. Pizza boxes were stacked like precarious Jenga towers on the coffee table. Alex scrolled through a spreadsheet on their laptop, the glow illuminating a frown. Blake was staring into the dregs of a lukewarm soda.

  "Look," Alex said, tapping the screen. "Expected value is positive seven thousand five hundred dollars. You have sixty grand in the fund. Losing fifteen leaves you with forty-five. You're not eating ramen for a year. Shut up and multiply."

  Blake sighed, rubbing their temples. "I know the arithmetic, Alex. I'm not denying the math. I'm denying that maximizing expected utility is the only rational way to process it."

  "Oh, here we go." Alex leaned back, crossing arms. "Is this the Buchak stuff? Risk-weighted expected utility? Because I've heard this pitch. You're just smuggling risk aversion into the decision theory instead of the utility function. It's Occam's Razor violation number one. Just say you have concave utility. Log wealth. Done. The curve handles the fear."

  "It's not the same," Blake said, sitting up. "If it were just concave utility, my preferences would have to satisfy the Independence Axiom. They don't. And it's not because I'm 'squeamish.' It's because I care about the *structure* of the risk, not just the weighted average of outcomes."

  "Show me," Alex challenged. "Give me a preference structure no utility curve can capture. And don't recite the Allais Paradox from a textbook. Use the startup."

  Blake grabbed a napkin and a marker. "Okay. Bet A is the startup: 15% chance of $150k, 85% chance of zero. Bet B is a modified version: 15% chance of $150k, 85% chance of $5k. Obviously, I take B. Now, consider Bet C: 100% chance of $5k. And Bet D: 15% chance of $150k, 85% chance of zero."

  "Standard Allais framing," Alex noted.

  "Hear me out. If I choose B over A, I'm paying to avoid the zero outcome. But if you ask me to choose between C and D... I might take D. Why? Because in the first pair, the 'safe' option (B) guarantees I don't walk away with nothing. In the second pair, C is too small to matter. A utility function $u(x)$ assigns a fixed value to $5k. It can't say '$5k is worth more when it prevents total loss than when it's just a alternative to a gamble' without contradicting itself across the two choices. The weight I put on the probability shifts depending on the context of the risk, not just the final wealth state."

  Alex shook their head. "I can fit a utility function to any static set of choices, Blake. You're talking about dynamic inconsistency. Which brings me to point two: If you're so smart, why ain't you rich? REU agents turn down positive EV bets. Over a lifetime, you get money-pumped by anyone willing to take the other side of your bets. You're leaving free energy on the table."

  "Not if I commit," Blake countered. "The money pump only works if I'm dynamically inconsistent—if I plan to take a risk tomorrow but change my mind when tomorrow comes. But REU allows me to say, 'I am a risk-weighting agent, and I commit to this policy.' I reject Independence. I'm not updating my probabilities based on new information; I'm weighting the downside heavier because *it's the downside*. Once I've decided my risk function $r(p)$ is convex, I don't swap. The pump doesn't bite if you don't let go of the handle."

  "That's just stubbornness dressed up as axioms," Alex said, grabbing a slice of cold pizza. "And you're conflating this with ergodicity. I suspect what you *actually* mean is that repeatedly betting your whole bankroll is dumb because of vol drag. That's the Kelly Criterion. That's Ole Peters' ergodicity economics. It's a fact about sequences of bets and time averages versus ensemble averages. But this?" Alex gestured at the laptop. "This is a single decision. If you know you'll never face this exact bet again, the ergodic argument collapses. So stop dressing up time-average growth as per-decision rationality."

  Blake paused. This was the hit. They took a sip of soda, stalling. "Okay. That's a real hit. If the world were ergodic, if I could repeat this startup investment ten thousand times, I'd take it in a heartbeat. Kelly says bet fractionally. But... does rationality vanish in the one-shot case?"

  "Yes," Alex said. "In the one-shot case, the ensemble average is all you have. There is no 'time average' for a single event. If you refuse +EV here, you're saying you value something other than the outcome. What? The feeling of being safe? That's a utility input, not a decision theory overhaul."

  "Maybe," Blake said slowly. "But consider this: I don't know if it's a one-shot. Life feels like a series of correlated bets. If I lose this $15k, my confidence drops, my ability to take the *next* opportunity drops. The bets aren't independent. REU captures that correlation anxiety without needing to model the entire future sequence explicitly. It's a heuristic for bounded agents who know they're part of a sequence but can't calculate the Kelly optimal for every micro-decision."

  "So you're admitting it's about the sequence," Alex pounced. "Then you agree with me. It's ergodicity. You're just using REU as a computationally cheap approximation for Kelly. So why claim it's fundamental? Why not just say 'I'm optimizing for geometric growth' and be done with it?"

  "Because sometimes the sequence doesn't matter!" Blake's voice rose. "Imagine I'm dying. This is the last decision I ever make. No future bets. No compounding. Just me and the startup. EU says take the bet. REU says I'm allowed to say 'I don't want an 85% chance of regret,' even if the math says I should. Rationality isn't just about output maximization; it's about agency. If my agency includes a non-linear attitude toward risk, why must I flatten it to fit von Neumann-Morgenstern?"

  "Because if you don't," Alex said quietly, "you're vulnerable. You're saying you prefer less expected utility. That's not agency; that's a leak."

  They sat in silence for a moment. The hum of the refrigerator was loud.

  "Okay," Alex said, closing the laptop. "Stalemate. But I want to know what would change your mind. Concrete terms. Not 'I'd feel differently.'"

  Blake thought for a moment. "If you could show me a Dutch Book that works *even with commitment*. If you can construct a series of offers where I accept them at $t_0$ based on my REU policy, but at $t_1$ I'm forced to swap regardless of my commitment, then I'm irrational. Buchak says it doesn't exist, but if you find one... I update."

  "Fair," Alex said. "I'll look for the pump. My condition is simpler. Show me a case where REU outperforms EU in a genuine one-shot, non-ergodic environment. Not 'feels better,' but actually secures a goal EU fails to secure. If risk-weighting protects something valuable that expected utility destroys in a single shot, I'll read the book. Until then, I think you're just scared of losing the fifteen grand."

  Blake laughed, a sharp, tired sound. "I am scared. But I think being scared can be rational."

  "Then you're not a rationalist," Alex said, standing up and grabbing their coat. "You're a human. Which is fine. Just don't call it math."

  "See you next meetup," Blake said.

  "Don't lose the emergency fund."

  "Don't lose your soul to the axioms."

  Alex walked out into the night. Blake stayed, staring at the napkin with the bets drawn on it, wondering if the difference between them was really just a function curve, or something deeper about how to live in a world where probabilities don't always average out.
