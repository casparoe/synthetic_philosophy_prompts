  # Joint Statement of Adversarial Collaboration: The Paradox of Deontology

  **Participants:** 
  **D** (Constraint Deontologist)
  **C** (Act Consequentialist)
  **Facilitator:** [Redacted]

  **Date:** October 24, 2023
  **Subject:** Resolution Attempts on Agent-Relative Constraints vs. Agent-Neutral Outcomes

  ## 1. Agreed Claims

  We, the undersigned, having reviewed the standard "Villain Threat" case (one death committed by Agent vs. five deaths caused by Villain contingent on Agent's refusal), stipulate the following as common ground:

  1.  **Case Implications:** We agree that standard Constraint Deontology implies the Agent must not kill the one, even to save the five. We agree that standard Act Consequentialism implies the Agent must kill the one to save the five.
  2.  **No Self-Defeat Guarantee:** We agree that the paradox does not prove deontology is self-defeating in all iterated settings; a world where everyone follows deontological constraints may produce better outcomes than a world where everyone follows consequentialism, even if local violations of constraints yield better local outcomes.
  3.  **Consequentialist Integrity:** We agree that consequentialism faces an analogue to this problem regarding integrity: if an agent refuses to maximize good outcomes to preserve their own psychological integrity, consequentialism must condemn that refusal, potentially alienating the agent from their own projects.
  4.  **Resolution Criteria:** We agree that a satisfactory resolution cannot simply define the opposing side out of existence (e.g., defining "responsibility" such that only consequences count, or only acts count). A resolution must explain why agency matters without ignoring the moral weight of bodies in the world.
  5.  **Empirical Irrelevance:** We agree that empirical claims about human psychology (e.g., "people feel worse killing than letting die") are insufficient to resolve the normative dispute, though they may explain the persistence of the intuition.

  ## 2. Table of Exact Disagreements

  The following table isolates the specific metaphysical and normative claims where our positions diverge. Each row is wording that the named side accepts as an accurate formulation of their view.

  | Issue | D (Deontologist) Position | C (Consequentialist) Position |
  | :--- | :--- | :--- |
  | **Doing/Allowing** | The asymmetry between doing and allowing is a constitutive fact about agency; I am the author of my acts, not the author of the world's total state. | The asymmetry is a heuristic framing effect; morally, the only fact is that five deaths occur instead of one, regardless of the causal pathway. |
  | **Value of Clean Hands** | The value of the agent's "clean hands" is agent-relative; it is a good *for me* to maintain, which I am forbidden to trade against others' welfare. | The value of "clean hands" is only agent-neutral; it matters only insofar as it affects future utility or the agent's capacity to do good. |
  | **The Villain's Threat** | The threat is a manipulation of options, not a change in the moral ledger; the Villain's agency does not transfer moral responsibility for his acts to me. | The threat is an ordinary causal parameter; the Villain's agency is irrelevant to the calculation of total value, which is the only moral metric. |

  ## 3. The Cruxes and The Hybrid Proposal

  We identify two specific cruxes where empirical or formal clarification could shift our confidence. We also address the proposed hybrid view, **Lexical Compounding**.

  ### Crux 1: The Catastrophe Threshold
  *   **Concrete Case:** The Villain threatens to kill not five, but one billion people unless the Agent kills one innocent.
  *   **Condition:** If D admits there is *any* number $N$ where killing the one becomes permitted, D concedes constraints are not absolute. If D maintains constraints are absolute even at $N = \text{all humanity}$, C concedes D's view is implausibly rigid.
  *   **Prediction (D):** I will maintain that constraints are absolute, but I will argue that at $N = \text{all humanity}$, the case changes qualitatively (e.g., the concept of "moral community" dissolves), so the constraint no longer applies rather than being outweighed.
  *   **Prediction (C):** I predict D will eventually admit a threshold where the constraint is outweighed, revealing that their view is actually threshold deontology, not absolute constraint.

  ### Crux 2: Lexical Compounding (Hybrid View)
  *   **Proposal:** The view that each additional violation *I commit* carries a superlinear penalty, so one self-committed wrong is never worth even many prevented wrongs, but at some threshold (five? fifty? a continent?) the agent-relative penalty compounds fast enough that committing the wrong becomes permitted.
  *   **Condition:** Both sides must evaluate whether this view is coherent and whether it collapses into one of their existing positions.
  *   **D's Evaluation:** This view merely re-describes threshold deontology. My view forbids Lexical Compounding if it implies constraints can be *outweighed*. If the view means constraints dissolve at catastrophes, that is compatible with my "qualitative change" clause, but if it implies a trade-off, it rejects the deontological constraint entirely.
  *   **C's Evaluation:** I can accept superlinear agent-relative penalties only if they are instrumentally justified (e.g., maintaining a norm against killing). If the penalty is intrinsic, I cannot accept it without collapsing into D's position, because it privileges the agent's status over the victim's existence, which is agent-neutral nonsense.
  *   **Prediction (D):** I predict C will reject any intrinsic weight given to agency, confirming that consequentialism cannot accommodate the intuition that *I* must not murder, even to save others.
  *   **Prediction (C):** I predict D will admit that at some threshold, the constraint is permitted to be violated, confirming that "absolute" constraints are rhetorical rather than functional.

  ## 4. Closing Section: Verbal vs. Substantive

  We conclude that the residual dispute is **substantive**, not merely verbal.

  While some disagreement stems from differing definitions of "responsibility" (D defines it as authorship of acts; C defines it as causal influence on outcomes), this linguistic divergence tracks a deeper metaphysical disagreement. D holds that moral value inheres partially in the relation between the agent and their act. C holds that moral value inheres exclusively in states of affairs.

  If the dispute were merely verbal, we could agree on all non-moral facts and the distribution of utility, yet disagree only on the label "ought." However, we would take different actions in the Villain Case. D would allow five deaths; C would cause one death. Since we endorse different physical outcomes based on irreconcilable first principles regarding the locus of value, the dispute is substantive. We agree that no amount of semantic clarification will resolve which principle is correct.

  Summary: The core dispute is whether moral obligation is determined solely by the value of outcomes or fundamentally constrained by the nature of the agent's own action regardless of consequences.
