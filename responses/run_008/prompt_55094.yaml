answer: |-
  You are quite right to point out that the historical specifics of Langdon Winner's Robert Moses example have been thoroughly challenged. Bernward Joerges, along with other historians such as Joel Schwartz, demonstrated that the low bridges did not effectively prevent buses from reaching Jones Beach, and there is no archival evidence that Moses designed them with exclusionary intent. If one treats Winner's 1980 essay strictly as a work of empirical history, then yes, its central exhibit is flawed. However, the reason the essay remains a staple on syllabi is not due to nostalgia, but because it is primarily a work of political philosophy rather than historical reportage.

  Winner's core argument is not merely that this specific bridge was political, but that we *ought* to investigate technologies as if they were political. He is proposing a heuristic device—a way of looking at the world—rather than presenting a closed case file. The essay asks us to consider whether certain technological systems inherently require or favour specific forms of social organisation (such as hierarchy or democracy), regardless of the intentions of the designers. Even if Moses was innocent of the specific charge, the question remains valid: could a bridge be built to exclude? Could a nuclear power plant require an authoritarian state to manage it safely? The utility of the text lies in its ability to provoke this line of questioning in students, forcing them to look beyond the social context and examine the material constraints themselves.

  Regarding the Social Construction of Technology (SCOT) perspective you mentioned, the debate is not settled in favour of social constructionism. While SCOT scholars rightly emphasise that groups interpret technology differently, later developments in Science and Technology Studies (such as Actor-Network Theory) actually swung back towards acknowledging the agency of non-human objects. The tension between Winner's technological determinism and the social constructionists is precisely why both are taught; they represent opposing poles of a spectrum that students must navigate. We teach Winner not because he provided the final answer, but because he formulated the question so sharply that it cannot be ignored. The lack of a 'confirmed case' after forty years does not invalidate the thesis so much as it highlights the complexity of disentangling material affordances from social practices.

  Ultimately, the essay survives because it successfully shifted the burden of proof. Before Winner, one had to justify why a machine *would* have politics; after Winner, one must justify why it *would not*. The Moses story is merely the hook; the catch is the philosophical challenge to examine how our built environment conditions human behaviour and power dynamics.

