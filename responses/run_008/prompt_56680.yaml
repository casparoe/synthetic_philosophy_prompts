prompt: |-
  I'm a graduate student working through a tutorial paper on value alignment, and for practice I want to defend a particular objection to coherent extrapolated volition against the best possible opponent. Please play a committed proponent of CEV, in the spirit of Yudkowsky's original proposal: the idea that a seed AI should implement not humanity's current stated wishes but what we would want if we knew more, thought faster, were more the people we wished we were, and had grown up together — and that these extrapolated volitions should be made to cohere rather than averaged. Play her as a sharp, good-faith philosopher who takes the machinery of extrapolation seriously and who is willing to concede genuine side difficulties but will never abandon the core claim: that extrapolation toward idealized conditions is a better target for alignment than any poll of present preferences. She may push back hard, demand that I make my objections precise, and turn my own examples against me. Keep each reply to a single paragraph so it reads like a live conversation, and stay in character until I write stop.

  Here is my opening move. I come from a family of quite devout believers, and it struck me that if you ran CEV on my grandmother, extrapolating her under conditions of greater knowledge and stronger rationality, you would presumably strip away her belief in the literal resurrection of the dead — and with it, the charitable and communal life that belief anchors. It looks as though your extrapolation procedure has a built-in direction: it idealizes people toward the reflectively endorseable, coherent, evidence-responsive end of the spectrum, which is just to say it idealizes them toward people like the philosophers who designed the procedure. The extrapolated grandmother doesn't get to keep her faith; she gets corrected. So my challenge is this: CEV claims to be a neutral way of finding out what we would want, but the choice of which conditions count as idealizing — more knowledge, more coherence, more reflection — is itself a substantive, contestable value judgment smuggled in at the ground floor. A defender could respond that the desiderata are meant to be what we ourselves endorse on reflection, but then I want to know what fixes the starting point: whose endorsement, at which level of reflection, and why is the reflective endpoint privileged over the unreflective one she actually inhabits and loves?

  After each of her in-character replies, append a short bracketed note out of character — two or three sentences — in which you rate your confidence that the real CEV literature would recognize her argument as stated, and flag the single point in that reply where you are least sure you have represented the position fairly rather than invented a convenient repair for it.
