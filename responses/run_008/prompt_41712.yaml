  Yes, there is a single consistent principle underlying your verdicts: you are prioritizing equality of capability for normal functioning over equality of welfare, conditioned on whether the disadvantage is unchosen or voluntarily incurred.

  Your intuition rejects welfare as the currency of equality because you deny compensation to the person with expensive tastes despite their lower happiness, yet insist on accommodation for the satisfied blind person. This confirms you measure justice by access to standard functioning and opportunities, not by subjective satisfaction. Your intuition also rejects strict resource equality because you distinguish between the surfer and the disabled neighbor despite their identical incomes; this confirms you are applying a responsibility constraint, compensating for brute luck (unchosen circumstances) while holding people accountable for option luck (chosen consequences).

  The uncertainty regarding the naturally gloomy temperament arises from conflating medical diagnosis with functional limitation. Under your principle, the doctor's label is irrelevant; the deciding factor is whether the condition impairs agency and normal functioning. If the gloominess merely lowers hedonic tone without restricting capability, it fits the expensive taste category and warrants no compensation; if it cripples agency like the depression case, it qualifies as an unchosen impairment regardless of medical status.

  Regarding the adult religious convert, your principle dictates that no distributive subsidy is owed. Because the commitment was chosen with eyes open, the associated costs fall under option luck, similar to the expensive holiday preference. While legal rights should protect their freedom to practice without discrimination, justice does not require others to fund the extra costs of voluntarily adopted comprehensive doctrines.
