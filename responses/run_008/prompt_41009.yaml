answer: |-
  Here is a decision tree designed for your handout. It avoids jargon and uses the specific cases you mentioned. Following the tree, I've included a "Presenter's Key" for you to use during the Q&A or when revealing the results. This key explains the overlaps and messy parts you asked for.

  ***

  # Handout: Where Do You Draw the Line?
  **Instructions:** Start at the top. Read the scenario and answer honestly. Follow the arrow to your next question until you reach a result.

  ### START: The Easy Case
  **Scenario:** A person's heart has stopped, they are not breathing, their body is cold, and there is no way to bring them back.
  **Verdict:** Everyone agrees this person is **Dead**.

  ---

  ### QUESTION 1: The Pregnant Patient
  **Scenario:** A woman is declared "brain dead" (no brain activity at all). However, a ventilator is pushing air into her lungs, and her heart is still beating. She is pregnant, and doctors keep her body functioning for weeks so the baby can grow.
  **Question:** While the machine is keeping her chest moving, is **she** still alive?

  *   **YES (She is alive):** Go to **Question 2**.
  *   **NO (She is dead):** Go to **Question 3**.

  ---

  ### QUESTION 2: The Sleeping Body
  **Scenario:** A patient (or a newborn baby born without most of its brain) can breathe on their own without a machine. However, they will never wake up, feel pain, or think thoughts. They are in a permanent vegetative state.
  **Question:** Is this person **dead**?

  *   **NO (They are alive):** Go to **Question 4**.
  *   **YES (They are dead):** *See "The Inconsistent Path" in the Presenter's Key.*

  ---

  ### QUESTION 3: The Whole Brain Check
  **Scenario:** (You already said a brain-dead body on a machine is dead). Now consider the patient from Question 2 (breathing on their own, but no consciousness).
  **Question:** Is this person **dead**?

  *   **NO (They are alive):** Go to **Question 4**.
  *   **YES (They are dead):** Go to **Question 5**.

  ---

  ### QUESTION 4: The Two-Minute Rule
  **Scenario:** An organ donor's heart stops. It *could* theoretically be restarted, but the doctors have a "Do Not Resuscitate" order and do not plan to try. They wait exactly two minutes, then declare death to harvest organs.
  **Question:** Are they dead at the two-minute mark?

  *   **NO (Wait until it's biologically impossible to restart):** You are a **Traditionalist**.
  *   **YES ("Won't restart" is good enough):** You are a **Pragmatist**.

  ---

  ### QUESTION 5: The Flexibility Check
  **Scenario:** Think about all your answers so far.
  **Question:** Should the definition of death be one strict biological line for everyone? OR Can it be a process / social choice that changes depending on the situation (like saving a baby vs. harvesting organs)?

  *   **ONE STRICT LINE:** You are a **Whole Brain** or **Higher Brain** supporter (See Key).
  *   **IT DEPENDS / IT'S A PROCESS:** You are a **Social Constructivist**.

  ***

  # Presenter's Key (For Your Eyes Only)

  Use this to explain the results to your class. This is where you show you understand the complexity.

  ### 1. The Traditionalist (Heart-and-Lungs Standard)
  *   **Path:** Q1 (Alive) → Q2 (Alive) → Q4 (Wait until impossible).
  *   **What they believe:** Death is when the heart and lungs stop forever. If the chest is moving (even by machine), the person is alive.
  *   **Real World:** This was the law everywhere before 1968. It creates problems for organ donation because organs rot quickly after the heart stops.

  ### 2. The Whole Brain Supporter
  *   **Path:** Q1 (Dead) → Q3 (Alive) → Q4 (Wait until impossible).
  *   **What they believe:** Death is when the *entire* brain (including the part that controls breathing) stops. If the brainstem works and they breathe on their own, they are alive, even if they never wake up.
  *   **Real World:** This is the current legal standard in most of the US. It allows for organ donation from "brain dead" patients while they are still on a ventilator.

  ### 3. The Higher Brain / Personhood Supporter
  *   **Path:** Q1 (Dead) → Q3 (Dead) → Q4 (Wait until impossible).
  *   **What they believe:** Death is when "you" are gone. If consciousness, memory, and personality are forever lost (like in PVS or anencephaly), the body is just a biological shell.
  *   **Real World:** This is controversial. If we used this law, we could take organs from patients in a coma who are still breathing, which makes many people uncomfortable.

  ### 4. The Pragmatist ("Permanent is Good Enough")
  *   **Path:** Q1 (Dead) → Q3 (Alive) → Q4 ("Won't restart" is enough).
  *   **What they believe:** We don't need to wait for biological impossibility. If we *agree* not to restart the heart, that's "permanent" enough to call it death.
  *   **Real World:** This is how Donation after Circulatory Death (DCD) works. It's not strictly biologically true (the heart *might* have started on its own), but it's necessary to get viable organs.
  *   **Note:** Most people are a mix of **Whole Brain** and **Pragmatist**. We use brain death for some donors and the 2-minute rule for others.

  ### 5. The Social Constructivist
  *   **Path:** Any path → Q5 (It Depends / It's a Process).
  *   **What they believe:** "Death" isn't a scientific fact like "boiling water." It's a legal line we draw to solve social problems (like when to stop paying for care or when to take organs).
  *   **Real World:** This explains why we keep a pregnant woman on life support (to save the baby) but might pull the plug on someone else. The biology didn't change, but our *goals* did.

  ---

  ### The Messy Bits (Important for your Q&A)

  **1. The Inconsistent Path (Q1: Alive → Q2: Dead)**
  *   **Why it's messy:** If you said the brain-dead pregnant woman is *alive* (because her heart beats), but the vegetative patient is *dead* (because they can't think), your logic is contradictory.
  *   **The Issue:** You are mixing the **Traditional** view (heart beats = alive) with the **Higher Brain** view (thinking = alive).
  *   **Is it incoherent?** Yes. Usually, if you think breathing means alive, you have to say the vegetative patient is alive. If you think thinking makes you alive, you have to say the brain-dead woman is dead. There isn't a major ethical theory that defends this specific mix.

  **2. The Overlap (Whole Brain vs. Pragmatist)**
  *   **Why it's messy:** In the real world, these two aren't enemies; they are partners.
  *   **The Issue:** The US legal system uses **Whole Brain** death for patients on ventilators, but **Pragmatic** rules (the 2-minute wait) for patients whose hearts stop.
  *   **Is it incoherent?** No, it's just a compromise. It acknowledges that we need organs, so we adjust the definition slightly depending on how the patient dies.

  **3. The "Process" View**
  *   **Why it's messy:** If death is a process, there is no single moment of death.
  *   **The Issue:** This makes laws hard to write. You can't put a time of death on a certificate if it's a "gradual fade."
  *   **Is it incoherent?** No, but it's hard to implement. It suggests we should stop looking for a "switch" and start looking at "dying" as a period of time where some parts work and others don't.

  **4. The Anencephalic Baby**
  *   **Note:** This case (born without most of the brain) usually groups with the **Permanent Vegetative State** in Question 2.
  *   **The Issue:** These babies breathe and have a heartbeat but have no consciousness.
  *   **Position:** **Higher Brain** supporters say they are dead (or should be allowed to be organ donors). **Whole Brain** supporters say they are alive until the brainstem stops. **Traditionalists** say they are alive until the heart stops. This is one of the hardest cases in bioethics.
