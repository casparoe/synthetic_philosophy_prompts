prompt: |-
  So for my senior capstone I have to pick a bioethics issue and I went with "when is someone actually dead," like legally/medically. We learned about brain death vs heart death in class and honestly the more I read the wierder it got. Like there's a real case type of a brain dead pregnant woman kept on machines for weeks so the baby could develop enough to be born, and also organ donors whose hearts get stopped and then like 2 minutes later they're declared dead so the organs can be taken — which apparently only works if you're allowed to count "the heart won't be restarted" as good enough, instead of waiting to be really sure it could never come back on its own. Also apparently the exact definition matters for something like a couple thousand organ transplants a year, so it's not just semantics.

  Anyways. For the presentation I want to hand out one of those "which position do you secretly hold" things like the personality quizzes online, except about death. I think it works better as a decision tree / flowchart than a scored quiz, so can you do that version. The tree should start from a case everyone agrees on (someone whose heart and breathing are stopped and definitely not coming back — dead, no argument) and then each branching point is a question about a specific case or claim, phrased so my classmates can answer it WITHOUT knowing any of the position names. Like no question should be "do you believe in whole brain death" obviously, it should be about what happens in the case.

  Cases I want in there somewhere (add more if you need but use these): the pregnant brain-dead woman on the ventilator; the organ donor whose heart has been stopped for two minutes with no plan to restart it (is he dead? was he dead at the moment they decided not to restart? does it matter whether it could in theory restart by itself?); a patient in a permanent vegetative state who can still breathe on their own; a baby born without most of its brain; and the question of whether "dead" even needs to be one sharp line or whether it can be more of a process.

  The leaves should include: the traditional heart-and-lungs view, whole brain death, higher brain / personhood-based death, the "permanent is good enough" pragmatic view that the organ donation world kind of runs on, and the view that death is partly a social or legal thing we choose rather than a pure biological fact. If any two of those can't actually be separated by my questions, just say so instead of pretending the tree is cleaner than it is. And if some combination of answers doesn't land on any position, tell me whether that's because the view is incoherent or just because nobody's bothered to defend it.

  No citations please, I already have a works cited page due and it's a pain. Keep the language at a level my actual classmates can follow — I go to a normal public school, not some philosophy magnet academy.
