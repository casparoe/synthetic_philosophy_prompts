      *   **Second Most Severe:** (1) vs. (4). If abstract objects exist, why is the metaphysical absurdity of part-whole equality restricted to concrete reality? This requires a strong dualism about the nature of existence and logical laws.
      *   **Apparent Tensions that Dissolve:** (2) vs. (3)/(4). The user explicitly scopes (2) to mathematics and (3)/(4) to physics/reality. This is a standard move (Mathematical Realism + Physical Aristotelianism). It holds together if the ontology supports it.
