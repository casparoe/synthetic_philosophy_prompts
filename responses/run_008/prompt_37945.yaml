  5.  **Final Polish:** Check formatting constraints. Numbered claims, Table, Cruxes with predictions. Ensure it looks like a document ready for signature. (Proceed to generate output based on this structure).

  6.  **Final thought on the "Verbal" aspect:** The key insight from philosophers like Samir Okasha is that the mathematical equivalence (Price Equation) makes it verbal *regarding the net outcome*, but substantive *regarding the causal decomposition*. I need to make sure the document reflects this nuance so both sides feel understood. GEV says "decomposition is arbitrary." MLS says "decomposition reflects causal structure."

