  2.  **Deconstruct the Debate (Internal Brainstorming):**
      *   *Gene's Eye View (GEV):* Selection is fundamentally about differential replication of replicators. Organisms/groups are vehicles. Apparent group selection is usually kin selection/inclusive fitness in disguise. Mathematically equivalent to MLS in many cases, but GEV is heuristically superior for spotting adaptations.
      *   *Multilevel Selection (MLS):* Selection is a causal process that can operate at multiple hierarchical levels simultaneously (gene, cell, organism, group). Partitioning variance (Price Equation) shows real causal components. GEV is often just a translation manual that obscures the actual causal structure of trait-group interactions.
      *   *Common Ground:* Both reject naive group selection ("for the good of the species"). Both accept the Price Equation as a mathematical identity. Both accept natural selection requires variation, heredity, and differential fitness. Both agree altruism exists and needs explaining.
      *   *The "Verbal" Dispute:* Is it just a choice of coordinate system? (Lewontin's view). GEV says "Yes, MLS is just algebra." MLS says "No, causal structure matters, not just algebra."
      *   *The "Substantive" Dispute:* Where does adaptation primarily arise? Is the "vehicle" concept robust? Does recognizing group-level causation lead to different empirical predictions or just different descriptions?
      *   *Cruxes:* We need cases where the *explanation* differs significantly, even if the math sums to the same result.
          *   *Segregation Distorters:* Clear gene-level selection against organism interest. GEV loves this. MLS accepts it as lower-level selection.
          *   *Cancer:* Somatic selection. GEV sees rogue replicators. MLS sees within-organism vs. between-organism selection.
          *   *Myxomatosis/Virulence:* Trade-off hypothesis. GEV sees transmission alleles. MLS sees group (host population) structure affecting virulence evolution.
          *   *Slime Molds (Dictyostelium):* Altruistic stalk. GEV says kin selection (clonal). MLS says trait-group selection. If clones are mixed, cheating happens.
      *   *Bookkeeping vs. Causation:* This is the core philosophical friction. GEV: "Causation is at the replicator." MLS: "Causation is at the interaction level."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the history (Williams, Dawkins, Wilson, Sober). State the purpose (clarity, not forced consensus).
      *   **Section 1: Agreed Claims:** What is uncontroversial post-1980s?
          *   Naive group selection is dead.
          *   Altruism is real (phenotypically).
          *   Price Equation is neutral math.
          *   Hierarchy exists (genes in cells in organisms in groups).
          *   Conflict is possible (intragenomic, somatic).
      *   **Section 2: Disagreements Table:** Needs to be precise.
          *   *Issue:* Primacy of Explanation. *GEV:* Replicator is the only true unit. *MLS:* Interactor levels are causally real.
          *   *Issue:* Verbal vs. Substantive. *GEV:* Mostly verbal/representational. *MLS:* Substantive regarding causal structure.
          *   *Issue:* "For the good of". *GEV:* Only makes sense for replicators. *MLS:* Can make sense for interactors at any level.
      *   **Section 3: Cruxes (The Meat):** This needs to be actionable.
          *   *Case 1: Dictyostelium (Slime Molds).* Focus on relatedness vs. group structure.
          *   *Case 2: Cancer.* Focus on within-organism selection.
          *   *Case 3: Virulence (Myxomatosis/Calicivirus).* Focus on transmission trade-offs.
          *   *Predictions:* Need to show where they might diverge in *emphasis* or *mechanism identification*, even if outcomes match.
      *   **Refining the "Bookkeeping vs. Causation" thread:** Ensure this phrase appears in the analysis of the cruxes.

  4.  **Review and Refine (Self-Correction):**
