      *   *Correction on "Calicified":* The prompt says "calicified [sic] explanations of virulence". This likely refers to Rabbit Hemorrhagic Disease Virus (RHDV/Calicivirus) following Myxomatosis in Australia. I should treat this as the "Virulence Evolution" case.
