      *(Self-Correction on Goldhagen/Browning dates)*: Browning (1992), Goldhagen (1996). The student says Goldhagen wrote before. This implies Goldhagen didn't respond to Browning, which changes the nature of the debate.

      *(Self-Correction on Social Psych)*: The prompt asks what experiments *can and cannot* contribute. The student says they contribute *nothing* ("settle nothing"). This is a failure to answer the specific prompt component regarding the utility of experimental analogies.

