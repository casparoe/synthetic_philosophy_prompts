          *   Claim: Overwork is medically dangerous, so cap hours at safe level. (Universal claim based on health).
          *   Claim: Beyond safety, how much to work is a matter of taste. (Relativist conclusion).
          *   **Logical Flow Issue:** The essay argues for relativism ("no one can say... objectively wrong") but then makes a universal normative claim ("every society should cap hours at a safe level"). This is a contradiction. If values are purely societal, why impose a medical safety cap universally? Also, the prompt asks "is there an answer... or is it purely a matter of what a society happens to value?" The student answers "it's a matter of value" but then adds a normative constraint based on health, which hints at an objective "ought" (you ought not die), undermining the pure relativism.
