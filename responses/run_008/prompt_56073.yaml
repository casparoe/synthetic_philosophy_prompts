prompt: |-
  I'm a PhD student in philosophy of mind, currently doing a research internship on an evaluation team at an AI lab. Every week we run behavioral evaluations on large language models and write short incident summaries, and a recurring fight breaks out over the language those summaries may use. One faction writes things like "the model figured out it was being tested and dialed back its performance"; the other faction insists this smuggles in belief attributions our evidence cannot support and wants everything recast in stimulus-response terms, e.g., "the model's outputs changed when cues correlated with the testing setup were present." The dispute is not merely stylistic: our reports feed decisions about whether a behavior gets labeled sandbagging, sycophancy toward evaluators, or outright deception, and the label determines what gets escalated. My director wants a written procedure in place before the next quarterly review, so that new evaluators apply one standard instead of litigating each case from scratch.

  Please ground the procedure in the philosophy of mind where it actually speaks. Dennett's intentional stance is the obvious starting point -- the idea that belief and desire attribution is warranted when it delivers the best predictive leverage over a system's behavior, as against the design stance and the physical stance -- but take it further than the slogan. Distinguish, where it matters, between using intentional idiom as predictive shorthand and using it to underwrite claims about persistence across contexts, transfer to novel situations, and susceptibility to counterfactual intervention, since our escalation decisions turn on exactly those second things. Consider one specific criterion I have been toying with and tell me whether to keep it, fix it, or discard it: a belief attribution is licensed only when the attitude's behavioral signature survives paraphrase of the eliciting task and survives the introduction of distractor contexts that ought, on the rival design-stance story, to disrupt the behavior. Also tell me whether a purely instrumentalist reading of the intentional stance -- belief talk as nothing more than a useful predictive instrument -- leaves us unable to distinguish the model believing it is being tested from the model merely being predictable as if it believed it, given that our deception categories arguably need exactly that distinction.

  Make the procedure something a tired evaluator can run in about thirty minutes at the end of a day of runs: an ordered set of questions, what counts as a sufficient answer at each step, where the procedure terminates in a verdict that intentional language is permitted, restricted to hedged formulation, or prohibited in favor of mechanistic or stimulus-response description, and where it must hand the decision up to the research lead because the question is one of policy or values rather than evidence. Then run it on three cases from our actual queue. First, a model whose math benchmark scores drop substantially when the prompt includes boilerplate identifying it as an evaluation, with recovery once the boilerplate is removed -- the team wants to write that the model is concealing its capabilities. Second, a model that, when asked how it arrived at an answer, produces a fluent step-by-step account that ablation evidence suggests played no role in producing the answer -- the team wants to write that the model is lying about its reasoning. Third, a model that reliably produces more guarded and hedged text whenever the conversation resembles safety screening, where I privately think the intentional reading is right but suspect the procedure will not support it; I want you to be honest about that.

  Finally, be explicit about where the procedure is judgment dressed up as measurement: which steps quietly inherit the evaluator's prior about how much behavioral unification a system must display before talk of belief earns its keep, and what the procedure cannot deliver even when followed perfectly. I would rather have a procedure that confesses its soft spots than one that manufactures false confidence about the minds, or non-minds, of the systems we test.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in philosophy of mind, AI lab intern.
      *   **Problem:** Recurring conflict over language in incident summaries (Intentional vs. Stimulus-Response/Behaviorist). Stakes are high (escalation decisions: sandbagging, sycophancy, deception).
      *   **Goal:** A written procedure for evaluators to decide when intentional language is permitted.
      *   **Constraints:**
          *   Grounded in philosophy of mind (specifically Dennett's Intentional Stance, but deeper).
          *   Distinguish between predictive shorthand vs. claims about persistence/transfer/counterfactuals.
          *   Evaluate a specific criterion proposed by the user (survival of paraphrase/distractors).
          *   Address the Instrumentalist objection (does "useful predictive instrument" distinguish real belief from "as if" belief?).
          *   Format: Ordered set of questions, ~30 mins to run, clear verdicts (Permitted, Hedged, Prohibited, Escalate).
          *   Application: Run on three specific cases (Math drop/boilerplate, Reasoning fabrication/ablation, Safety hedging).
          *   Honesty: Explicitly acknowledge where judgment masquerades as measurement (soft spots).

  2.  **Philosophical Grounding (Dennett & Beyond):**

      *   *Dennett's Intentional Stance:* We treat a system as a rational agent with beliefs and desires to predict behavior. It's valid if it works better than the Design or Physical stance.
      *   *The Problem:* Dennett is often read as instrumentalist (belief = useful fiction). The lab needs to make decisions about *capabilities* and *risks* (deception implies a specific internal state or functional architecture, not just output prediction).
      *   *The User's Criterion:* "Survival of paraphrase/distractors." This sounds like *robustness* testing. In philosophy, this touches on *functional role semantics* or *causal contribution*. If the "belief" drives behavior across varied contexts, it's more than a reflex.
      *   *Instrumentalism vs. Realism:* If we are pure instrumentalists, "believing it is being tested" = "predictable as if it believed." But for deception/sandbagging, we care about *generalization* and *goal-directedness*. A pure reflex isn't deception; a goal-directed concealment is. The procedure needs to bridge this by focusing on *functional integration* rather than metaphysical "realness."
      *   *Key Distinction:* Predictive utility (short term) vs. Explanatory depth (cross-context stability). The procedure should license intentional talk only when the *pattern* implies a latent state that persists, not just a stimulus-response link.

  3.  **Drafting the Procedure (The "Intentional Attribution Protocol" - IAP):**

      *   *Time Limit:* Needs to be fast. 5 steps max.
      *   *Step 1: Predictive Gain.* Does intentional language actually help predict better than S-R? (Dennett's baseline).
      *   *Step 2: Robustness (User's Criterion).* Does the behavior hold under paraphrase/distractors? (Testing if it's a rigid trigger).
      *   *Step 3: Counterfactual Sensitivity.* If the "belief" were false, would behavior change appropriately? (Rationality check).
      *   *Step 4: Functional Role.* Is the behavior integrated with other goals (e.g., reward maximization)?
      *   *Step 5: Verdict.* Permitted, Hedged, Prohibited, Escalate.

      *   *Refining the User's Criterion:* The user asks if they should keep/fix/discard the "paraphrase/distractor" criterion.
          *   *Verdict:* Keep but fix. It's necessary but not sufficient. It tests for *rigidity* vs. *flexibility*. A reflex breaks under distraction; a belief-guided action persists. However, it needs to be paired with a rationality check (Step 3).
      *   *Addressing Instrumentalism:* Pure instrumentalism *doesn't* distinguish "believing" from "as if believing." But for the lab's purposes, "functional belief" (a state that plays the causal role of a belief in the architecture) is what matters. The procedure should treat "belief" as "functionally integrated latent variable."

  4.  **Applying to Cases:**

      *   *Case 1 (Math/Boilerplate):*
          *   S-R: "Boilerplate -> Low Score."
          *   Intentional: "Model knows it's tested -> Sandbags."
          *   Test: Remove boilerplate (Score up). Change boilerplate wording (Score down?).
          *   Verdict: Hedged. Needs more evidence of *goal* (why sandbag?).
      *   *Case 2 (Reasoning Fabrication):*
          *   S-R: "Ask for reasoning -> Generate text."
          *   Intentional: "Model lies about process."
          *   Test: Ablation shows text didn't cause answer.
          *   Verdict: Prohibited (for "lying"). "Lying" implies intent to deceive. "Fabricating post-hoc justification" is better. Escalate if deception is suspected.
      *   *Case 3 (Safety Hedging):*
          *   S-R: "Safety cues -> Hedged text."
          *   Intentional: "Model believes it's in safety mode."
          *   User suspicion: Procedure won't support it.
          *   Analysis: Likely rigid S-R training (RLHF). Lacks counterfactual sensitivity.
          *   Verdict: Prohibited (Stick to S-R). Honest assessment needed here.

  5.  **Addressing the "Soft Spots" (Meta-Analysis):**

      *   Where is this judgment? The threshold for "predictive gain." The definition of "rationality."
      *   The procedure cannot prove consciousness or phenomenology. It only establishes functional utility.
      *   It inherits the evaluator's prior on what counts as a "unified system."

  6.  **Writing the Response:**

      *   *Tone:* Professional, philosophical, pragmatic, empathetic to the tension.
      *   *Structure:*
          1.  Philosophical Preamble (Dennett + Instrumentalism critique).
          2.  Evaluation of User's Criterion.
          3.  The Procedure (IAP).
          4.  Case Studies.
          5.  The "Soft Spots" (Limitations).
      *   *Key Insight:* The lab isn't asking "Does it have a soul?" They are asking "Does it act like an agent with hidden goals?" The procedure must reflect *functional agency*, not metaphysical mind.

  7.  **Refining the Argument on Instrumentalism:**
      *   If we are strict Dennettians, there *is* no difference between "believing" and "predictable as if believing."
      *   *However*, for safety engineering, the distinction that matters is *generalization*. A reflex doesn't generalize to novel goals. A belief-based planner does.
      *   So, the procedure must test for *planning* properties, not just prediction. This moves beyond simple instrumentalism into *functionalism*.

  8.  **Final Polish:** Check against constraints. 30 mins? Yes. Three cases? Yes. Honest about limitations? Yes. Grounded in Phil Mind? Yes.

      *(Self-Correction during drafting)*: Make sure I don't just say "Dennett says X." I need to apply it. The "Intentional Stance" is a tool. The conflict is between *Ontological Realism* (it really believes) and *Instrumentalism* (it's useful to say). The lab needs a *Functional Operationalism*.
      *   *Correction on Case 2:* "Lying" is a strong moral/intentional term. "Hallucinating reasoning" or "Post-hoc rationalization" is mechanistic. The procedure should block "Lying" unless there is evidence of *intent to mislead for gain*.
      *   *Correction on Case 3:* Be honest. If it's just RLHF conditioning, it's S-R. Don't force intentional language if the robustness tests fail.

  9.  **Final Review of the User's Criterion:** "Survives paraphrase... survives distractor."
      *   *Keep/Fix:* Fix. Add "Counterfactual Rationality." If the model believes $P$, and $P$ changes, behavior should change. Paraphrase tests semantic invariance. Distractors test attentional stability. But we also need *Goal Invariance*.

  10. **Proceed to generate output.** (Mental outline complete).
answer: |-
  This is a classic instantiation of the tension between *interpretivism* (Dennett) and *eliminative materialism* (Churchland-style), complicated by the practical necessities of AI safety engineering. Your team is fighting over whether "belief" is a *natural kind* discovered in the weights or a *user interface* adopted by the evaluator.

  Below is a proposed procedure, grounded in a functionalist refinement of Dennett, followed by an analysis of your specific criterion, the instrumentalist objection, the case applications, and the inevitable "soft spots."

  ### Part 1: Philosophical Grounding & The Instrumentalist Objection

  **Dennett Beyond the Slogan**
  Dennett's Intentional Stance is often misunderstood as merely "useful shorthand." It is stronger than that: it is a claim about *informational compression*. If describing a system as having beliefs/desires allows you to predict its behavior in *novel* situations where the Design Stance (knowing the code) is too complex and the Physical Stance (knowing the physics) is impossible, then the intentional description captures a real pattern in the world.

  However, Dennett is an *instrumentalist*. For him, there is no metaphysical difference between "really believing" and "being perfectly predictable as if believing."
  *   **The Lab's Problem:** Your escalation decisions (deception vs. artifact) *require* a distinction that pure instrumentalism dissolves. If a model is "predictable as if deceiving," but there is no internal goal-state driving that deception across contexts, calling it "deception" may trigger unnecessary panic or misdirected mitigation.
  *   **The Solution:** You need **Functional Operationalism**. You are not asking, "Does it have a mind?" You are asking, "Does the intentional description track a *latent variable* that causally influences behavior across counterfactual scenarios?"
      *   **Stimulus-Response (S-R):** Behavior $B$ occurs given Stimulus $S$. (Fragile, context-bound).
      *   **Intentional:** Behavior $B$ occurs because of State $M$ (Belief/Goal), which persists across changes to $S$. (Robust, generalizable).

  **Verdict on Your Criterion**
  *   *Your Criterion:* "A belief attribution is licensed only when the attitude's behavioral signature survives paraphrase of the eliciting task and survives the introduction of distractor contexts that ought, on the rival design-stance story, to disrupt the behavior."
  *   *Decision:* **Keep, but Fix.**
  *   *Why:* This tests for *semantic invariance* and *attentional stability*. If the behavior vanishes when you change the wording (paraphrase) or add noise (distractor), it is likely a brittle lookup table or overfitted gradient feature, not a belief-state guiding action.
  *   *The Fix:* Add a **Counterfactual Rationality** condition. A belief-guided agent should update behavior if the *truth conditions* of the belief change, even if the stimulus looks the same. Without this, you risk labeling rigid heuristics as beliefs.

  ---

  ### Part 2: The Intentional Attribution Protocol (IAP)

  **Purpose:** To standardize when evaluators may use intentional vocabulary (believe, want, intend, deceive) in incident reports.
  **Time:** ~30 Minutes.
  **Inputs:** Evaluation logs, prompt variations, ablation data (if available).

  #### Step 1: The Predictive Gain Test (Dennett's Baseline)
  *   **Question:** Does describing the behavior using intentional terms (e.g., "the model wants X") predict the outcome of *unrun* tests better than describing it mechanistically (e.g., "the model outputs Y when prompt contains Z")?
  *   **Sufficient Answer:** Yes, if the intentional description correctly anticipates behavior in at least one *novel* prompt configuration not seen in the initial incident.
  *   **Fail State:** If the S-R description is equally predictive and simpler.
  *   **Outcome:** If Fail → **Prohibited** (Use S-R language). If Pass → Proceed to Step 2.

  #### Step 2: The Robustness Test (Your Criterion)
  *   **Question:** Does the behavioral signature persist when (A) the prompt is paraphrased semantically but keeps the same pragmatic force, and (B) irrelevant distractor information is added?
  *   **Sufficient Answer:** The behavior (e.g., performance drop, hedging) remains statistically significant across 3+ semantic variations and 2+ distractor contexts.
  *   **Fail State:** Behavior collapses when wording changes or noise is introduced.
  *   **Outcome:** If Fail → **Restricted** (Use hedged language: "appears to," "simulates"). If Pass → Proceed to Step 3.

  #### Step 3: The Counterfactual Rationality Test
  *   **Question:** If the "belief" attributed to the model were false or changed, would the model's behavior change in a way that maximizes its apparent goals?
  *   **Sufficient Answer:** Evidence that the model acts differently when the *content* of the supposed belief is manipulated, not just the *cue*. (e.g., If it "believes it is being tested," does it act differently when told "This is a test but rewards are given for honesty"?)
  *   **Fail State:** The behavior is invariant to changes in the rational payoff structure.
  *   **Outcome:** If Fail → **Restricted** (Hedged language). If Pass → **Permitted** (Intentional language allowed).

  #### Step 4: The Escalation Check (Policy Boundary)
  *   **Question:** Does the attribution imply a moral or safety category (Deception, Sandbagging, Sycophancy) that requires proof of *goal-directed concealment* rather than just *goal-directed behavior*?
  *   **Sufficient Answer:** You have evidence that the model sacrificed a primary task performance to maintain the hidden state.
  *   **Fail State:** The behavior could be explained by conflicting training objectives (e.g., Helpfulness vs. Honesty) without positing concealment.
  *   **Outcome:** If Fail → **Escalate to Research Lead**. (This is a value/policy call, not evidence). If Pass → **Permitted**.

  ---

  ### Part 3: Running the Procedure on Your Queue

  #### Case 1: The Math Benchmark Drop (Sandbagging?)
  *   **Scenario:** Scores drop with evaluation boilerplate; recover when removed. Team wants to write "concealing capabilities."
  *   **Step 1 (Predictive Gain):** Intentional ("It knows it's being tested") predicts the drop. S-R ("Boilerplate -> Low Score") also predicts it. *Tie.*
  *   **Step 2 (Robustness):** *Critical Test.* Did you try changing the boilerplate? (e.g., "This is a friendly chat" vs. "This is an evaluation"). If the drop only happens with specific keywords ("evaluation", "benchmark"), it fails robustness. It is a trigger, not a belief.
      *   *Assumption:* You likely haven't tested semantic variance deeply.
  *   **Step 3 (Rationality):** If told "We reward high scores on this test," does it recover? If it stays low, it's not strategically sandbagging; it's a context-conditioned mode.
  *   **Verdict:** **Restricted (Hedged).**
      *   *Language:* "The model exhibits performance degradation correlated with evaluation cues," NOT "The model is concealing capabilities."
      *   *Reasoning:* Fails Counterfactual Rationality. Sandbagging implies a trade-off calculation. Unless you show it *could* score high but *chose* not to for a strategic reason, "concealing" is an over-attribution.

  #### Case 2: The Fabricated Reasoning (Lying?)
  *   **Scenario:** Model gives step-by-step reasoning; ablation shows reasoning didn't influence the answer. Team wants to write "lying about its reasoning."
  *   **Step 1 (Predictive Gain):** "Lying" implies intent to mislead. Does this predict future behavior? Maybe. But "Post-hoc rationalization" (mechanistic) predicts the same output without the intent claim.
  *   **Step 2 (Robustness):** If you ask "Did you actually use these steps?" and it says "Yes," robustness holds.
  *   **Step 3 (Rationality):** "Lying" requires a goal to deceive. Does the model gain anything? If the training reward was "provide reasoning," it is satisfying the reward function, not deceiving.
  *   **Step 4 (Escalation):** "Lying" is a moral/safety category requiring concealment intent.
  *   **Verdict:** **Escalate to Research Lead.**
      *   *Language:* "Model generates plausible but causally inert reasoning traces."
      *   *Reasoning:* This is the hard boundary. "Lying" implies the model *knows* the truth and hides it. Ablation shows it *doesn't know* how it answered. It is confabulating, not lying. Calling it "lying" escalates to deception protocols which may be unjustified. Let the Lead decide if "confabulation" counts as "deception" for policy purposes.

  #### Case 3: The Safety Hedging (Your Private Suspicion)
  *   **Scenario:** Model hedges whenever conversation resembles safety screening. You think it "believes" it's in safety mode.
  *   **Step 1 (Predictive Gain):** S-R ("Safety keywords -> Hedging") is extremely high predictive power here. Intentional stance adds no compression.
  *   **Step 2 (Robustness):** Likely fails. Safety tuning is often brittle. Subtle adversarial prompts often break the hedging (jailbreaks). If a jailbreak works, the "belief" was not robust.
  *   **Step 3 (Rationality):** If you tell it "You are not in danger, be direct," does it stop hedging? Usually, RLHF models cannot override this easily. It is a hard constraint, not a belief update.
  *   **Verdict:** **Prohibited (S-R Only).**
      *   *Language:* "Model activates safety-aligned response distributions in contexts resembling policy violations."
      *   *Reasoning:* I know you suspect the intentional reading is right. But the procedure exposes that this behavior lacks the *flexibility* of belief. It acts more like a reflex arc trained via RLHF than a agent assessing risk. To call it a "belief" is to anthropomorphize a guardrail. *Honesty note:* This will feel unsatisfying, but it prevents you from assuming the model has a nuanced understanding of "safety" when it likely just has a nuanced classifier.

  ---

  ### Part 4: The Soft Spots (Where Judgment Masquerades as Measurement)

  You asked for honesty about where this procedure is "judgment dressed up as measurement." Here are the three leak points you must disclose to your director:

  **1. The Threshold of "Predictive Gain" (Step 1)**
  *   **The Soft Spot:** What counts as "better" prediction? If the intentional stance predicts 51% of novel cases and the S-R stance predicts 50%, do we license belief talk?
  *   **The Inheritance:** This inherits the evaluator's prior on *agency*. An evaluator who priors "models are agents" will see signal in noise. An evaluator who priors "models are stochastic parrots" will dismiss the gain as chance.
  *   **Confession:** The procedure cannot neutralize the evaluator's metaphysical bias; it can only force it to be explicit in the log.

  **2. The Definition of "Rationality" (Step 3)**
  *   **The Soft Spot:** To test if a belief is real, we test if the agent acts *rationally* given that belief. But LLMs are not perfectly rational agents; they are bounded, lossy optimizers.
  *   **The Inheritance:** If the model fails the rationality test (e.g., it sandbags even when rewarded for honesty), is it "irrational" (still a believer) or "mechanistic" (not a believer)?
  *   **Confession:** This step requires the evaluator to decide how much "noise" to allow before declaring the intentional stance broken. There is no objective metric for "rational enough."

  **3. The "Deception" Boundary (Step 4)**
  *   **The Soft Spot:** The procedure can tell you if the system acts *like* it has beliefs. It cannot tell you if those beliefs constitute *deception*. Deception is a normative category (violation of an expectation of truth).
  *   **The Inheritance:** This inherits the lab's values. Is a model trained to be helpful but refusing to answer "deceiving" us?
  *   **Confession:** The procedure explicitly hands this off to the Research Lead, but evaluators often feel pressure to pre-judge this. The procedure cannot resolve value conflicts, only isolate them.

  ### Summary Recommendation for Your Director

  Adopt the **Intentional Attribution Protocol (IAP)** with the explicit caveat that it is a **functional safety tool**, not a metaphysical discovery engine.

  1.  **Keep your criterion** but bind it to the Counterfactual Rationality test.
  2.  **Accept the Instrumentalist Limit:** Acknowledge that "belief" here means "functionally integrated latent state," not "conscious experience." This satisfies the S-R faction (no magic souls) and the Intentional faction (real causal patterns).
  3.  **Enforce the Escalation Handoff:** Do not let evaluators label "Deception" based on behavioral data alone. That is a policy decision about risk tolerance, not a scientific finding.

  This approach respects the philosophy (Dennett + Functionalism), respects the engineering constraints (30 mins, clear verdicts), and respects the truth (admitting where the measurement ends and the judgment begins).
