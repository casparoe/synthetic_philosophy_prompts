answer: |-
  You are correct to suspect that no single principle currently unifies your verdicts. Your intuitions are toggling between two different ethical frameworks: a **robust, proximate consequentialism** (save the child, buy the nets) and a **skeptical, epistemic consequentialism** (reject the canvasser, doubt the x-risk). The fracture point is your defense of voting.

  To achieve coherence, you must align your epistemic standards across all cases. You cannot claim that a $10^{-40}$ probability is too epistemically fragile to act upon (the Canvasser) while simultaneously claiming a $10^{-7}$ probability is robust enough to justify an action (Voting), if the *source* of that probability is equally opaque to you. In both voting and the canvasser case, you are relying on a statistical aggregation model where your individual causal contribution is indiscernible. In the drowning child and malaria net cases, you are relying on direct physical or economic causation.

  Here is the coherent position that resolves your dilemma.

  ### The Verdict You Must Give Up
  To be consistent with your rejection of the Canvasser and your skepticism of Existential Risk modeling, you must give up the **expected-value justification for Voting**.

  You stated: *"I would defend [voting] by multiplying a vanishing probability of decisiveness by a very large benefit."* This is the exact same mathematical structure you rejected in the Canvasser case (*"probability one in ten to the fortieth"*). You noted the only difference is "the size of the numbers." But if the epistemic ground is shaky (cluelessness about the causal chain), magnitude does not rescue the calculation. If you cannot trust the $10^{-40}$, you cannot trust the $10^{-7}$ *on the same grounds*, because both rely on a causal chain (Vote $\to$ Count $\to$ Policy $\to$ Outcome) that is attenuated and statistically aggregated, unlike the chain in the Drowning Child case (Action $\to$ Physics $\to$ Survival).

  You may still vote, but you cannot defend it as a consequentialist calculation of expected value. You must defend it as a **deontic duty**, a **habit**, or a **rule-consequentialist heuristic**. But as an act-consequentialist calculation subject to cluelessness constraints, it must fall.

  ### The Principle: Epistemically Tractable Consequentialism
  Replace your current mix of intuitions with this precise principle:

  > **An agent is obligated to maximize expected value only over causal chains that are empirically grounded and epistemically tractable. A causal chain is tractable if (a) the mechanism linking action to outcome is direct or supported by robust historical base rates, and (b) the probability estimates are not sensitive to "unknown unknowns" or speculative modeling.**

  **How this decides your cases:**
  1.  **Drowning Child:** **Save.** Mechanism is direct physics/biology. Tractable.
  2.  **Route to Work:** **Indifferent.** Identity effects are metaphysically real but causally diffuse and untractable. Ignored per principle.
  3.  **Job Choice:** **Choose Modest Benefit.** The "riskier/larger" benefit likely relies on distal, less tractable projections. Cluelessness correctly weakens confidence here.
  4.  **Nets vs. X-Risk:** **Choose Nets.** Nets have a direct economic/medical causal link (money $\to$ net $\to$ life). X-Risk relies on speculative modeling of the far future (violates condition b).
  5.  **Canvasser:** **Decline.** Probability is speculative and ungrounded (violates condition a & b).
  6.  **Voting:** **Reclassify.** The causal link (single vote $\to$ election outcome) is statistically attenuated and lacks a robust base rate for the *individual* agent (violates condition a). It cannot be justified by EV maximization, only by rule or duty.

  ### The Unresolved Case: Eating Meat
  Applying **Epistemically Tractable Consequentialism** to your diet:

  **Verdict:** **Stop eating meat.**

  **Reasoning:**
  You worry that the effect of one person's diet is "real only statistically." This sounds like the Voting case, but it is not. The causal mechanism of dietary demand is **economically continuous**, whereas voting is **politically discrete**.

  1.  **Tractability:** Market supply chains respond to marginal changes in demand through price signals and order thresholds. While you may not trigger a specific slaughter event with a single meal, your consumption contributes to a marginal shift in price and demand that is empirically measurable and grounded in economic law (condition a). This is more robust than the binary threshold of an election.
  2.  **Ripple Effects:** You worry the "ripple effects of changing [your diet] are as opaque as any other." Under the principle, you are licensed to ignore these opaque ripples (e.g., social signaling, health changes affecting your productivity) because they are distal and untractable. You weigh only the **tractable** effect: the statistical reduction in animal suffering driven by demand elasticity.
  3.  **Comparison:** Unlike the Canvasser or X-Risk, the link between meat consumption and animal suffering is not speculative modeling; it is an observed industrial correlation. Unlike Voting, the causal contribution is marginal and continuous rather than threshold-dependent.

  Therefore, the "first-order effect" (reduction in demand-driven suffering) is epistemically tractable, while the "ripple effects" of dietary change are not. The principle dictates you act on the tractable effect. You should stop eating meat, not because you have solved the cluelessness of the far future, but because the proximate causal chain to suffering is the only one you are licensed to trust.
