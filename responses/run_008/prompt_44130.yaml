answer: |-
  This is a formidable prompt, and it deserves a response that treats the Irish Citizens' Assembly not merely as a political case study, but as a stress test for the philosophical architecture of indirect normativity. You are asking whether a specific institutional design can bear the weight of a theory originally constructed for superintelligent agents.

  Here is the analysis, disciplined by the mapping you have requested.

  ### I. Mapping the Idealization

  To apply the lens of indirect normativity, we must first define the subject of the extrapolation. In the CEV (Coherent Extrapolated Volition) framework, the "we" is typically humanity as a whole, or the specific users of the AI. In the Irish episode, the "we" is ambiguous by design. It is the Irish sovereign people, but it is operationally defined as the ninety-nine members of the Assembly.

  The Assembly acts as a **proxy volition**. It is not a random sample intended to mirror the *current* distribution of opinion (a poll), but a representative sample intended to model the *considered* opinion of the whole.

  Let us run the Assembly against Yudkowsky's four clauses of idealization:

  1.  **"If we knew more":** This is the strongest match. The Assembly was subjected to a curriculum of expert testimony (legal, medical, ethical) that the average voter could not reasonably assimilate. They were given the 'data' required to update their priors without the noise of media fragmentation.
  2.  **"If we... thought faster":** There is no analogue here, as you noted. However, the human equivalent of computational speed is not velocity, but *depth*. The Assembly traded speed for iteration. They deliberated over five weekends. This allowed for the correction of errors in reasoning that a fast, snap-judgment system (or a referendum campaign) would cement.
  3.  **"If we... were more the people we wished we were":** This was operationalised through procedural constraints. Members were insulated from partisan pressure, media scrutiny, and lobbying. They were paid to be there, removing economic coercion. The facilitation enforced civility. In rationalist terms, their utility functions were temporarily decoupled from social signalling and tribal affiliation.
  4.  **"If we... had grown up farther together":** This is the weakest link. The ninety-nine did not share a lifetime; they shared five weekends. They did not transcend the national memory; they were embedded within it. The shadow of the 1983 Amendment and the trauma of Savita Halappanavar were not 'transcended' historical data but active emotional inputs. They did not grow up together; they grew up *alongside* a specific national crisis.

  **The Microcosm vs. Enlightened Sample Tension**
  The Assembly was asked to resolve a tension that indirect normativity often glosses over. To possess legitimacy, it had to be a **microcosm** (statistically representative of the nation's demographics). To possess epistemic value, it had to be an **enlightened sample** (capable of reasoning better than the nation).
  In CEV theory, we assume that if you idealize the agent enough, the output is trustworthy regardless of the starting distribution. In politics, the starting distribution *is* the legitimacy. The Irish solution was to use the microcosm to secure the legitimacy, and the enlightenment procedures to secure the quality. It is a hybrid model: a representative body that is not a representative democracy.

  ### II. Structural Feature One: The Two-Stage Process

  You ask whether the separation of proposal (Assembly) and disposition (Referendum) is a corruption of indirect normativity or a necessary division of labour.

  In the standard rationalist formulation, indirect normativity is sovereign. You build the machine, you ask it what is good, and it acts (or advises the act with absolute authority). The Irish model is **constitutional**, not sovereign. The Assembly functioned as a 'normative oracle', but it lacked the executive function.

  This is not a corruption; it is a discovery of a safety mechanism that AI safety theory has largely neglected.
  1.  **Epistemic Quality vs. Democratic Legitimacy:** The Assembly laundered the *complexity*. Abortion law is technically dense; a referendum ballot cannot capture nuance. The Assembly converted a binary moral question ("Right to Life vs. Choice") into a specific legislative text (12 weeks, no restriction). The Referendum then laundered the *authority*. It acknowledged that even an idealized deliberation cannot override the sovereign will without consent.
  2.  **The Safety Valve:** In AI terms, this is 'human-in-the-loop' alignment. If the Assembly had recommended something the public found abhorrent (e.g., late-term abortion on demand), the referendum would have failed. The two-stage process allows the idealized volition to be *vetted* by the actual volition.

  This suggests that indirect normativity, when applied to human governance, should not aim for sovereignty. It should aim for **agenda-setting power**. The idealized process defines the *choice architecture*; the unidealized public makes the *choice*. This launders the deficiencies of both: the public lacks the time to know more; the mini-public lacks the mandate to rule.

  ### III. Structural Feature Two: The Regress (Training Data)

  The second structural feature is the curation of the Assembly itself. The agenda, the witness lists, and the legal framing were determined by a Secretariat and the Chair (a former Supreme Court judge). In machine learning terms, this is the **training data** and the **loss function**.

  If the Secretariat had excluded pro-life medical testimony, or framed the ballot differently, the output would have shifted. This is the regress problem: who aligns the aligners?
  1.  **Attribution:** How much of the outcome is attributable to this layer? It is impossible to quantify precisely, but we can infer bounds. The recommendation was more liberal than the pre-Assembly median voter, but less liberal than some advocacy groups wanted. This suggests the curation acted as a filter for *plausibility* rather than a driver of *ideology*.
  2.  **Visibility:** Unlike a neural network's weights, this layer was transparent. The witness lists were public; the proceedings were broadcast. This allows for ex-post auditability. We can see the 'training data'.
  3.  **The Silence of Theory:** Indirect normativity theory is largely silent on the *initial conditions* of the extrapolation. It assumes the 'humanity' input is clean. The Irish episode demonstrates that the curation of the deliberative environment is the single point of failure. However, it also offers a solution: **procedural transparency**. The legitimacy of the curation layer rested not on its neutrality (which is impossible), but on its perceived fairness and openness to scrutiny.

  ### IV. Where the Lens Breaks: Causality and Volition

  Here we reach the pressure point. Opinion polls indicated a shift towards liberalisation well before 2016. A sceptic argues the Assembly was epiphenomenal: the tide was turning, and the Assembly merely surfed it.

  This strikes at the heart of the distinction between **measuring** volition and **constituting** it.
  *   **Polling** measures expressed preference under conditions of ignorance and social pressure.
  *   **CEV** attempts to discover latent preference under conditions of ideal reflection.

  If the referendum would have passed without the Assembly, then the Assembly did not *find* a volition that was hidden; it merely *confirmed* a volition that was already manifest. However, the margin of victory (66.4%) was significantly higher than pre-Assembly polling suggested. Furthermore, the *specifics* of the repeal (the wording of the referendum) were determined by the Assembly's work.

  The Assembly did not just measure the temperature; it calibrated the thermometer. It converted a vague sentiment ("the law is too strict") into a actionable mandate ("repeal Article 40.3.3 and allow legislation for 12 weeks").
  *   **The Break:** The lens breaks on the question of **counterfactuals**. We cannot know if the referendum would have failed without the Assembly's specific recommendation. The rationalist claim is that idealized deliberation *changes* the output compared to raw aggregation. The Irish evidence is suggestive but not conclusive.
  *   **Constituting vs. Discovering:** It is likely both. The volition existed latently (dissatisfaction with the Eighth Amendment), but it was incoherent (fear of 'unrestricted' abortion). The Assembly rendered the volition coherent. In CEV terms, it resolved the conflict between the 'fear' module and the 'autonomy' module of the national psyche.

  ### V. Verdict

  Does this episode confirm indirect normativity, constitute an anomaly, or present a case the theory never anticipated?

  It is a case the theory never anticipated, specifically because rationalist discourse has been fixated on **sovereign AI** rather than **constitutional infrastructure**.

  1.  **Not a Confirmation of CEV:** CEV implies a system that can implement its findings directly to secure the future. The Assembly had no power to implement; it could only recommend. It is 'CEV with a veto'.
  2.  **Not an Anomaly:** It fits the core intuition that idealized deliberation yields more stable, coherent outcomes than raw aggregation.
  3.  **The Verdict:** The Irish Citizens' Assembly is a **partial, human-scale instantiation of indirect normativity**. It validates the *method* (idealized deliberation produces coherent policy) while rejecting the *sovereignty* (the idealized process does not rule).

  **Where the theory is silent:**
  Standard indirect normativity assumes the extrapolator is trustworthy enough to be given the keys. The Irish model assumes the extrapolator is trustworthy enough to be *heard*, but not to *rule*. This is a crucial distinction. It suggests that for human societies, indirect normativity should be used to **structure choices**, not to **make them**.

  **Is the CEV comparison a stretch?**
  Yes, in one critical regard. CEV assumes a continuity of identity that allows for 'growth'. The Assembly members remained the same humans with the same cognitive biases, merely shielded from incentives. A true CEV implies a qualitative shift in cognitive capability. The Assembly is better described as **Deliberative Alignment** than Coherent Extrapolated Volition. It aligns the *process* of decision-making, not the *capacity* of the decider.

  **Conclusion**
  The Irish episode suggests that indirect normativity is not a blueprint for a god, but a blueprint for a committee. It works not by transcending human nature, but by temporarily suspending the incentives that corrupt it. The two-stage structure (proposal vs. ratification) is not a bug; it is the only reason the system survived contact with reality. It separates the *truth* of the recommendation from the *power* of the implementation.

  If there is a lesson for the rationalist community, it is this: stop looking for a sovereign extrapolator. Start looking for a constitutional one. The goal should not be to build an AI that tells us what to want, but to build institutions that allow us to tell ourselves what we want, under conditions where we are actually capable of hearing the answer.
