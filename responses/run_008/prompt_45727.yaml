      *   *Point 2: Selection Bias in the 16 Cases.* How were they found? "Thucydides Trap" is a label applied *after* the fact often. If you look for rivalry, you find rivalry.
      *   *Point 3: Structural Discontinuity (The Nuclear/Peace Factor).* This is the biggest "Inside View" adjustment that is actually valid. The base rate of great power war changed fundamentally in 1945. Using pre-1945 data for post-1945 problems is a category error.
      *   *Point 4: Tetlock's Actual Advice.* Clarify that Superforecasters don't just grab the first base rate. They weigh reference classes. They would weigh "Great Power War 1500-1945" lower than "Great Power War 1945-2024" (which is 0%).
