          *   Experts justify this with "this case is different" (Inside View).
          *   Tetlock says Inside View adjustments are usually bias-driven failures.
          *   *Conclusion:* Shouldn't a rationalist update to ~75%? If not, how do we reject the reference class without falling back into biased analogizing?
      *   **Goal:** Explain where the reasoning goes wrong (if it does) and provide a principled procedure for reference class selection that avoids both blind base-rate worship and biased inside-view cherry-picking.

  2.  **Deconstruct the "Thucydides Trap" Reference Class:**
      *   *Is it actually a valid reference class for the Outside View?*
      *   **Selection Bias (Survivorship/Definition Bias):** How were the 16 cases chosen? Allison's team looked for cases where a rising power threatened a ruling one. Did they include cases where war *didn't* happen but tension was high? Or did they define the class *by* the tension that often precedes war?
      *   **Heterogeneity:** Are 16th-century Spain/England comparable to nuclear-armed US/China? The "outside view" requires the reference class to be *relevantly similar*.
      *   **Trend/Time Dependence:** War frequency has changed over 500 years. Pinker's "Long Peace," nuclear deterrence, economic interdependence. A base rate spanning 1500-2000 ignores the massive structural shift post-1945.
      *   **Outcome Definition:** What counts as "war"? Direct conflict? Proxy war? Skirmishes?
      *   **Predictor vs. Outcome:** The definition of the class ("rising power threatening ruling power") might implicitly include the precursor conditions to war, making it tautological or close to it.

  3.  **Address the Tetlock/Outside View Nuance:**
      *   Tetlock doesn't say "never use the inside view." He says "start with the outside view, then adjust *cautiously* based on specific, identifiable factors."
      *   Superforecasters *do* use base rates, but they are very careful about *which* base rate.
      *   The "Outside View" isn't just *any* historical analogy; it's a statistical baseline derived from a *properly constructed* reference class.

  4.  **Formulate the Principled Procedure (The "How-To"):**
      *   How do we reject a reference class without bias?
      *   **Criterion 1: Causal Homogeneity.** Do the mechanisms driving the outcome in the reference class operate in the target case? (e.g., Nuclear deterrence).
      *   **Criterion 2: Temporal Relevance.** Is the data from a regime that still exists? (Pre-nuclear vs. Post-nuclear).
      *   **Criterion 3: Selection Transparency.** Was the class defined *before* looking at outcomes? (Allison's cases were historical retrospects, potentially prone to hindsight bias in classification).
      *   **Criterion 4: Specificity vs. Generality.** Too broad (all conflicts) = useless. Too narrow (US-China 2024) = n=1. Need the "Goldilocks" zone.

