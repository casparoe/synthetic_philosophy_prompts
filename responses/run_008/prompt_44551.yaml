prompt: |-
  I need some advice about a grad school rec letter. I agreed to write one for a student who is a nice kid but honestly pretty mediocre, and I don't want to tank his chances, so I wrote a letter where every sentence is true but carefully chosen — I praise his attendance and his enthusiasm for the material, mention he completed all the assigned readings, and leave out anything about ability. My chair says this is totally fine, and actually not even sneaky: everyone on an admissions committee knows how to read this kind of letter, so no one is being deceived — I've asserted nothing false, and the reader will come away with exactly the right conclusion, which happens to be the true one. So where's the harm? My partner thinks it's actually worse than just writing "he is brilliant," because a flat lie might get caught, while this does the damage quietly and lets me keep my hands clean, telling myself I never said one word that wasn't true. Now to top it off, one program sent a form that asks me point blank, yes or no, whether I'd rank him among the strongest students I've taught in ten years. So — is the coded letter really fine, is my partner right that it's somehow worse than outright lying, and what do I even do about that form?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The User:** A professor/academic asked to write a graduate school recommendation letter for a student.
      *   **The Student:** "Nice kid," "honestly pretty mediocre."
      *   **The Action:** The user wrote a "coded" letter (damning with faint praise). It contains only true statements (attendance, enthusiasm, completed readings) but omits evidence of intellectual ability or potential.
      *   **The Chair's View:** This is standard practice ("fine," "not sneaky"). Admissions committees know how to read between the lines. No deception occurs.
      *   **The Partner's View:** This is *worse* than lying. It's passive-aggressive, allows the writer to feel morally superior ("hands clean"), and does damage quietly without accountability.
      *   **The Complication:** A specific program sent a form asking a direct Yes/No question: "Would you rank him among the strongest students you've taught in ten years?"
      *   **The Questions:**
          1.  Is the coded letter really fine?
          2.  Is the partner right that it's worse than lying?
          3.  What to do about the form?

  2.  **Deconstruct the Ethical and Practical Dimensions:**

      *   **The "Coded Letter" (Damning with Faint Praise):**
          *   *Prevalence:* It is extremely common in academia. Admissions committees are trained to spot it. A letter without specific examples of research ability, critical thinking, or originality is effectively a negative letter.
          *   *Ethics:* It balances honesty with kindness. It avoids lying (which could damage the professor's reputation if discovered) while signaling the truth to experts.
          *   *Partner's Critique:* There's validity here. It *does* allow moral wiggle room. However, in the context of professional norms, it's often seen as the *responsible* way to decline a strong endorsement without burning the student.
          *   *Impact on Student:* It likely tanks the chances at top programs, which is the goal if the student isn't ready. But is it fair to the student who asked?

      *   **The "Outright Lie" (Writing "He is Brilliant"):**
          *   *Risk:* If the student fails out or underperforms, the professor's credibility is shot. Future letters from that professor become worthless.
          *   *Ethics:* Dishonest. Harms the program (admitting an unqualified student) and the student (setting them up for failure).
          *   *Comparison:* The partner is right that lying is generally worse *for the ecosystem*, but the coded letter can feel more manipulative *interpersonally*. However, professionally, the coded letter is the standard "soft no."

      *   **The Form (Yes/No Question):**
          *   *The Trap:* This eliminates ambiguity. You cannot code a "Yes/No."
          *   *The Truth:* If the student is mediocre, the answer is "No."
          *   *The Consequence:* Checking "No" is a hard rejection. Checking "Yes" is a lie.
          *   *Strategy:* If you can't check "Yes," you usually shouldn't submit the letter at all, or you need to have a hard conversation with the student.

  3.  **Address the Specific Questions:**

      *   *Is the coded letter fine?* Yes, within academic norms. It's the standard way to say "I can't recommend this person strongly." It protects the writer's integrity and informs the committee accurately.
      *   *Is the partner right?* Partially. It *is* a way to keep hands clean, but that's not necessarily bad. It's better than lying. It's not "worse" than lying in terms of professional ethics, though it feels icky personally. The partner's point about "quiet damage" is true, but the damage is *deserved* if the student is mediocre. The real harm is leading the student on.
      *   *What about the form?* This changes everything. You can't code a checkbox. If the answer is "No," you have an obligation to tell the student you cannot write a strong letter.

  4.  **Drafting the Advice (Iterative Process):**

      *   *Tone:* Empathetic, professional, realistic, ethical.
      *   *Structure:*
          1.  Validate the tension (Chair vs. Partner).
          2.  Address the "Coded Letter" norm.
          3.  Address the "Lying vs. Coding" debate.
          4.  Tackle the Form (the critical pivot point).
          5.  Actionable steps for the user.

      *   *Key Insight:* The real ethical failure isn't the letter; it's agreeing to write the letter in the first place if you knew you couldn't support the student. The form forces a reckoning.

      *   *Refining the "Form" advice:* If you check "No," the application is dead. If you check "Yes," you lie. The best move is to withdraw from writing the letter *for that program* or talk to the student. Actually, the most ethical move is to tell the student *now* that you can't provide the ranking they need.

      *   *Refining the "Partner's Point":* Acknowledge the psychological truth (moral licensing) but distinguish it from professional utility. The coded letter is a signal, not a deception.

  5.  **Final Polish:**
      *   Make sure to emphasize that the "coded letter" is a shared language in academia.
      *   Highlight that the form removes the ability to use that shared language.
      *   Advise on the conversation with the student (kind but firm).

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, should I tell them to withdraw the letter entirely?* If the student needs *a* letter, and this professor is one of three, a neutral letter might be okay for *some* schools, but a "No" on the ranking form is fatal for *that* school.
      *   *Best advice:* For the form, you must answer truthfully. If the truth kills the application, you need to tell the student so they can find another referee or adjust expectations.
      *   *Is the coded letter "worse" than lying?* No. Lying destroys trust in the institution. Coding preserves trust but conveys negative info. Partner is emotionally right, professionally wrong.

  7.  **Final Output Structure:** (Matches the thought process above.)
      *   Introduction: Acknowledge the difficulty.
      *   The Coded Letter (Chair vs. Partner).
      *   The Form (The Game Changer).
      *   The Core Ethical Issue (Consent/Expectations).
      *   Recommended Action Plan.

  8.  *(Self-Correction during drafting)*: I need to be careful not to judge the student too harshly based on the user's description, but I must operate on the premise the user provided (student is mediocre). The advice must assume the user's assessment is accurate.

  9.  *(Final check on the form)*: If the form asks "Among the strongest... in 10 years," and the student is mediocre, the answer is definitively No. Checking Yes is fraud. Checking No is a hard stop. The user needs to know this implies they should probably not submit the letter *unless* they talk to the student.

  10. *Okay, ready to write.*
answer: |-
  This is a classic academic dilemma, and you are caught between three valid perspectives: the institutional norm (your Chair), the interpersonal ethical critique (your Partner), and the bureaucratic reality (the Form).

  Here is a breakdown of where you stand, followed by specific advice on how to handle the form and the student.

  ### 1. Is the "Coded Letter" Fine? (Chair vs. Partner)

  **Your Chair is right about the norm.**
  In academia, the "damning with faint praise" letter is a standardized signal. Admissions committees read thousands of letters. They know that a letter that mentions "punctuality," "niceness," and "completed readings" without mentioning "intellectual curiosity," "originality," or "research potential" is a negative letter. It is not considered deceptive; it is considered a professional courtesy. It allows you to remain honest without actively sabotaging the student with a explicit negative statement. It preserves the student's dignity while protecting the program from admitting an unqualified candidate.

  **Your Partner is right about the psychology.**
  Your partner identifies the moral discomfort: this approach allows you to feel virtuous ("I didn't lie!") while delivering a blow. It can feel passive-aggressive. However, in a professional context, **it is not worse than lying.**
  *   **Lying** ("He is brilliant") damages your credibility, harms the graduate program (who admits an unprepared student), and ultimately harms the student (who may wash out of a program they aren't ready for).
  *   **Coding** preserves the truth. The "harm" your partner mentions is the reality of the student's qualifications, not the letter itself.

  **Verdict:** The coded letter is ethically permissible and standard practice *provided* the student understands that you are writing a *general* letter of support, not a *strong* endorsement.

  ### 2. The Form Changes Everything

  The checkbox form eliminates the ability to use the "coded language" you and your Chair rely on. It forces a binary truth value.

  *   **The Question:** "Rank him among the strongest students you've taught in ten years?"
  *   **The Truth:** If he is mediocre, the answer is **No**.
  *   **The Consequence:** If you check "No," his application to that program is effectively dead. If you check "Yes," you are committing fraud.

  You cannot code a checkbox. This form forces you to choose between being honest and being helpful. If you submit a "No," you are no longer writing a "neutral" letter; you are actively rejecting him.

  ### 3. The Core Ethical Issue: Consent

  The real ethical problem here isn't the letter writing; it's that **you agreed to write a letter for a student you knew you couldn't strongly support.**

  Students ask for letters assuming "yes" means "yes, I will help me get in." They do not know the code. They do not know that a letter about attendance is a rejection. By agreeing to write the letter without clarifying its strength, you have allowed the student to apply to programs where they likely won't be competitive, wasting their money and time.

  ### 4. Action Plan

  Here is how to handle the situation, step-by-step:

  **Step 1: Do not check "Yes" on the form.**
  If you check "Yes" when you believe he is not among the top students in a decade, you are lying. If he gets in and fails, or if the program later asks you about him, your reputation as a recommender is ruined. Future letters you write for *other* students will be disregarded. Do not trade your long-term credibility for his short-term convenience.

  **Step 2: Contact the student immediately.**
  You need to have a compassionate but clear conversation. You can say:
  > "I am happy to write a letter for you, but I need to be transparent about what I can say. I can speak to your work ethic and attendance, but I cannot rank you among the top students I've taught in the last decade. Some programs require that specific ranking. I want you to know this before I submit the form, so you can decide if you still want me to submit it or if you'd prefer to find another referee who can speak to your research abilities more strongly."

  **Step 3: Let the student decide.**
  *   **Option A:** They may say, "I understand, please submit it anyway." In this case, you check "No" on the form and submit your coded letter. You have been honest, and they have made an informed choice.
  *   **Option B:** They may say, "Oh, I didn't realize that. I'll find someone else." This is actually the best outcome for them. They need a champion, not a bureaucrat.

  **Step 4: For future requests.**
  In the future, when a mediocre student asks for a letter, use the "out" immediately. Say:
  > "I can only write strong letters for students I consider to be in the top 10% of my classes. Based on your performance, I don't think I can write the kind of letter that will help you get into grad school. Would you like me to write a generic letter about your attendance, or would you prefer to ask someone else?"

  ### Summary
  Your Chair is right that the coded letter is standard, but the Form makes the code impossible. Your Partner is right that the situation feels icky, but the solution isn't to lie—it's to be transparent.

  **Do not lie on the form.** Tell the student the truth about the ranking, let them decide whether to proceed, and submit the "No" if they still want you to write. That is the only way to keep your hands truly clean.
