answer: |-
  Two teams construct a card-sorting device to classify meteorological data tapes as "Storm" or "Clear." Team A engineers a fixed instruction table encoding the specific causal rules currently accepted by meteorologists (e.g., "if barometric pressure drops below threshold X within Y hours, classify Storm"). Team B assembles a simple unorganized machine with random initial connections and subjects it to a long course of education where a teacher administers reward pulses for correct predictions and punishment pulses for errors, without modifying the machine's internal tables manually or explaining the causal logic. Both are trained on the same ten years of historical data. The judge introduces a perturbation: a "Storm" tape where the barometric pressure remains stable due to a localized anomaly, but the humidity patterns match the statistical regularities of previous storms. Team A's machine outputs "Clear" because the hardcoded pressure rule is not met. Team B's machine outputs "Storm" because its internal connections, modified blindly by reward signals over thousands of trials, have latched onto the humidity correlation that the explicit rules missed.

  **Analysis of Predictions**
  Team A predicts "Clear" because their machine's behavior is determined by the explicit instructions provided by the engineers. Since the engineers' knowledge was incomplete (they missed the humidity correlation), the machine's behavior is rigidly bound to that ignorance. Team B predicts "Storm" because their machine's behavior is determined by the structural adjustments made during the educational process. Since the reward signal tracked *accuracy* rather than *rule compliance*, the machine's internal state evolved to capture the actual regularities in the data, even those unknown to the designers. The verdict favors Team B not because the machine "thinks," but because its behavioral output aligns with reality in a case where the programmed rules diverge from reality.

  **The Feature Doing the Work**
  The verdict rests entirely on **the simplicity and generality of the initial mechanism** (Commitment 1). Team A's mechanism is *specific* from the start; it is the crystallization of current human theory. Team B's mechanism is *general*; it is a substrate capable of assuming many different rule-structures depending on the educational input. If you remove this feature—if Team B also started with a fixed instruction table based on current theory—the two routes converge, and Team B fails exactly as Team A does. The educational process cannot generate new structural competence if the initial mechanism lacks the generality to encode it. The "blind teacher" (Commitment 2) is merely the method that exploits this generality; without the general substrate, the teacher's ignorance would result in noise, not adaptation.

  **Addressing the Objection**
  A defender of direct programming will object that this scenario begs the question: you have selected a test case (a hidden correlation) that is *by definition* inaccessible to direct programming but accessible to statistical learning, ensuring Team B wins by fiat. This objection is correct, but it misses Turing's philosophical point. Turing is not arguing that education is *always* more efficient than programming; he is arguing that for the specific target competence of "intelligence," the rules are not available to be programmed directly. If the rules were known, Team A would indeed win. But Turing's claim is that the "adult mind" we wish to simulate is the product of a process we do not fully understand; therefore, we cannot engineer the product directly. We must engineer the *process* (the child machine). The scenario does not fudge the result; it exposes the epistemic limit of the direct engineering route. The case holds only because we accept Turing's premise that the target competence exceeds the programmer's explicit knowledge. If we assume the programmer is omniscient regarding the rules of intelligence, Turing's proposal is unnecessary. Since we are not omniscient, the general mechanism is the only route to the unanticipated competence.
