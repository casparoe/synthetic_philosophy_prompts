  ## Part 4: Troubleshooting (What Will Go Wrong)

  **1. The Dominant Demon**
  *   **Risk:** The student playing the Demon is assertive and rushes the Gas students, turning the simulation into chaos. The Auditors disengage.
  *   **Mitigation:** As Banker, you hold the Work Counters. Physically refuse to pay out if the Auditors do not sign off on the move. "No Auditor signature, no Chip." This forces the Auditors (especially the Philosophers) to police the pace.

  **2. The Premature Physicist**
  *   **Risk:** A student shouts "It's Landauer's Principle!" in minute 10, ruining the tension.
  *   **Mitigation:** Pre-brief the class: "This is a phenomenological exercise. Naming the physics before the end of the game results in a 5-Counter fine payable to the Auditors." Make the silence part of the wager.

  **3. Pacing Collapse**
  *   **Risk:** Sorting 10 students takes too long. The Reset phase drags.
  *   **Mitigation:** If Phase 1 exceeds 30 minutes, cull the Gas. Remove 4 students. A smaller gas means faster saturation and quicker arrival at the Reset crisis. It is better they feel the debt quickly than simulate a large volume accurately.

  **4. The Cheat Confusion**
  *   **Risk:** When you accept the "Canonical Cheat", students think they have actually won and the theory is wrong.
  *   **Mitigation:** In the debrief, be ruthless. "You didn't avoid the cost; you deferred it. If we played for another hour, you would run out of permutations. The Ledger shows you shifted the state twice. A third shift would require tracking the history of shifts. That history is memory. That memory must be erased."

  ---

  ## Part 5: Limitations (What You Must Assert)

  *Be candid with the students during the debrief about where the analogy breaks.*

  1.  **Thermal Fluctuations:** In the game, the Gas students stand still until moved. In reality, the molecules are bombarding the gate constantly. The Demon in the game is too powerful; a real demon would be jostled by the very gas it tries to sort, requiring work to maintain its own position.
  2.  **Error-Free Measurement:** In the game, the Demon sees the card perfectly. In reality, measurement is noisy. To measure accurately near the thermodynamic limit, the measurement device must be cold, which requires refrigeration (work). We have assumed perfect measurement for free, which is an idealisation.
  3.  **The Gate:** In the game, the barrier is solid. In a real Szilard engine, the insertion and removal of the partition itself costs work if not done reversibly. We have ignored the mechanics of the door to focus on the information.
  4.  **Discrete vs. Continuous:** Information here is digital (cards). Thermodynamic entropy is continuous. The $kT \ln 2$ bound applies to the *probability distribution* of states. The card game is a coarse-grained approximation of a phase space volume.

  **Instructor Note:** Do not apologise for these simplifications. They are necessary to make the *logical* structure of the argument visible. The goal is not to simulate a gas, but to simulate the *accounting* of entropy.
