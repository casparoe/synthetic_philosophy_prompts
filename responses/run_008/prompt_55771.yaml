  ## Part 3: Debrief Script

  *Stand at the front. Do not erase the Ledger. Leave the "Standard State" shifts visible.*

  **1. The Measurement (The Gate)**
  "Look at the first 30 minutes. You separated Red from Blue. You created a temperature gradient. In thermodynamic terms, you decreased the entropy of the gas. You were paid White Counters for this. This is the **Szilard Engine**. You extracted work from a single heat bath, which Kelvin-Planck says is impossible. Why did I pay you?"
  *   *Expected Answer:* "Because we measured."
  *   *Correction:* "No. Measurement, in principle, can be reversible. You didn't pay for looking. You paid later."

  **2. The Memory (The Tokens)**
  "When you looked at the molecule, you swapped cards in your hand. Why?"
  *   *Point:* "To correlate your state with the gas. You stored information. As long as that correlation exists, the total entropy of 'Gas + Demon' has not decreased. You just moved the entropy from the gas into your hand."
  *   *Mapping:* The Memory Hand is the **Demon's Memory**. The order of cards is the **Physical State of the Bit**.

  **3. The Reset (The Debt)**
  "Then you stopped. Why? Your hand was full. To sort more, you needed blank cards. You had to return the hand to A-2-3-4-5. I charged you 2 Counters. This is **Landauer's Principle**."
  *   *The Bound:* "In physics, erasing one bit of information—resetting a system to a known state regardless of its prior state—requires dissipating at least $kT \ln 2$ of heat. Your 2 Counters represent that heat. You cannot reuse the memory without paying the environment."

  **4. The Cheat (Bennett's Move)**
  "Now, the interesting moment. The Demon tried to redefine the Standard State to 5-4-3-2-1 to avoid paying. I allowed it. Did you beat the Second Law?"
  *   *Discussion:* "No. You merely shifted the debt. To use that new state, you must *know* it is the standard. If you change the standard every time, you need a 'meta-memory' to track which standard is current. That meta-memory eventually fills up and must be erased. **Charles Bennett** showed that the cost isn't in the measurement, nor in the logic, but in the **irreversible erasure** required to restore the device to its initial ready state. You can shuffle the cards all you like, but if you want to use them again as a blank slate, you must couple to a heat bath and pay the price."

  **5. Conclusion**
  "The Second Law is saved not because measurement costs energy, but because information is physical. The bill always arrives when you try to forget."

