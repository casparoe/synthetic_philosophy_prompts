      *   (2) *Classical Analogue:* Is this just anthropics/Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA)? (Tegmark, Lewis).
      *   (3) *Measure Problem:* Born rule weights vs. branch counting. Do low-weight branches count for "survival"? (Wallace, Greaves, Myrvold).
      *   (4) *Practical Implications:* Decision theory. Does QI change how you bet? (Wallace, Greaves, Price).
      *   (5) *Missing:* Need to identify a gap. Likely related to *phenomenology* or *ethical implications* beyond decision theory, or the *coherence of the thought experiment itself*.

  3.  **Determine Prioritization Logic (Upstream/Downstream):**
      *   *Upstream:* Metaphysical/Conceptual foundations. If these fail, downstream questions dissolve.
      *   *Downstream:* Normative/Practical consequences.
      *   *Logic:* You can't ask "What should I do?" (4) if you don't know "Who is doing it?" (1) or "What are the probabilities?" (3). You can't ask "Is it quantum?" (2) without knowing "What is the quantum ontology?" (1 & 3).
      *   *Ranking:*
          1.  **Identity (1):** Fundamental. If "I" don't survive, QI is false.
          2.  **Measure/Probability (3):** Fundamental to EQM. If low-weight branches don't "count" for subjective expectation, QI fails even if identity holds.
          3.  **Classical Analogue (2):** Distinguishes QI from general anthropics. Important for specificity to physics.
          4.  **Practical Implications (4):** Depends on 1, 3, and 2.
          5.  **Missing (Ethics/Phenomenology):** High impact, often overlooked.

  4.  **Evaluate Tractability & Neglect:**
