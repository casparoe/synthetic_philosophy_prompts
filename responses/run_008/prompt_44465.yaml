      *   **Input:** Five candidate questions (Identity, Classical Analogue, Measure Problem, Practical Implications, + Missing).
      *   **Output Needed:** A prioritized map of live issues, defense of ordering (upstream/downstream relations), tractability assessment (undergrad vs. grad level), neglect assessment (room for contribution), deprioritization advice, and revision conditions (what would change the ranking).
      *   **Tone:** Academic, rigorous, mentorship-oriented, honest about the field's state.

  2.  **Deconstruct the Candidate Questions:**
