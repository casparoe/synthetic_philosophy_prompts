  It is completely understandable that your gut verdicts feel messy because you are actually balancing three distinct moral intuitions that usually align but sometimes conflict. The principle that best generates your judgments is what I would call the Principle of Constitutive Validity and Communicative Function. This principle argues that a name or statue should be removed if the moral failing of the namesake invalidates the specific basis upon which the honor was granted, or if the continued presence of the marker functions as an active tool of oppression rather than a passive reference. Conversely, names should be kept if the honorific basis remains intact despite the failing, or if the name has lost its honorific function through time and become merely referential or sacred. This explains why you keep the museum statue it is a historical artifact, not a civic honor and why you keep the mountain the name has worn smooth into a geographic label where the person is forgotten, meaning the communicative function is no longer about honoring the founder. It also explains the chemist cases: the racist chemist keeps his lecture hall because his private views are orthogonal to the validity of his scientific discovery, whereas the unethical chemist loses his because the harm inflicted on subjects constitutes the method of the discovery, invalidating the basis of the honor. The fraudulent donor loses the building name because fraud voids the legitimacy of the money, which is the sole constitutive basis for a donor plaque, making that the easiest case of all since the transaction itself is nullified.

  However, applying this principle rigorously forces us to overturn one of your verdicts, specifically regarding the Confederate gravestones. You distinguish them from the courthouse statue by invoking desecration, but if the cemetery is publicly maintained or functions as a memorial park rather than a private family plot, the Communicative Function shifts from sacred mourning to public speech. If the courthouse statue comes down because it signals state endorsement of white supremacy, a publicly maintained Confederate cemetery serves the same communicative function, honoring a cause defined by slavery. The principle suggests that while private graves are sacred and should be left alone, public memorials to Confederate soldiers cannot be insulated from the same logic as the courthouse statue simply because they mark the dead. The honorific function remains active in a public cemetery, and the constitutive basis of the Confederacy is inextricable from the oppression you cited as the reason to remove the statue. To be consistent, you must either accept that public Confederate memorials including graves should be removed or contextualized heavily, or argue that the courthouse statue was removed solely for its timing and location as a message to Black residents, whereas the graves are passive. Given your reasoning on the courthouse, the principle demands you treat public graves as public speech, not private mourning.

  When we run this principle against your new cases, the answers become clearer. For the theorem named after a mathematician who did something bad, you should generally keep the name. Mathematics is abstract and constitutive validity relies on proof, not character. Unless the mathematics was developed specifically to facilitate harm, such as statistics for eugenics, the bad acts are orthogonal to the theorem, much like the racist chemist's views were to his chemistry. The name refers to the discovery, not the man's soul. Regarding the college versus the building, the principle highlights a difference in Communicative Function and disruption. A building name is transactional and functional, like the donor case, and can be changed with moderate disruption. A college name, however, often functions like the town or the mountain it is absorbed into the identity of the institution and the alumni. Renaming a college is akin to renaming the town itself; the name has become referential for the community rather than purely honorific for the founder. Therefore, the threshold for renaming a college should be higher than for a building, requiring a stronger case that the name actively harms the community's function, similar to the mountain versus the street distinction.

  Finally, for the town that has fully absorbed a bad founder's name into its identity, the principle suggests you should keep the name but contextualize the history. This is the extreme version of the mountain case. If the name is fully absorbed, it no longer functions primarily to honor the founder but to identify the place for the living residents. Renaming it would cause massive disruption without necessarily removing the honorific element, as the history remains. Instead, the Communicative Function should be shifted through markers, plaques, and education that decouple the town's identity from the founder's virtue, acknowledging the bad history without erasing the current community's identity. This respects the attenuation of the honorific function while still addressing the moral failing, bridging the gap between your verdict on the mountain and your verdict on the street. Ultimately, your intuitions are not a mess but a sophisticated weighing of whether a name is still doing the work of honoring a specific value, and whether that value has been rotted out from underneath it.
