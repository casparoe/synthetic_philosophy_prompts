      *   **Tone Check:** Respectful, rigorous, not dismissive but firm.

  4.  **Key Arguments to Include:**
      *   *EV Argument:* Yes, $10^{-25} \times 10^{45}$ is big. But is the probability real?
      *   *Epistemic Penalty:* Extraordinary claims require extraordinary evidence. Applicant-supplied probabilities for speculative physics lack intersubjective verification.
      *   *Veldman's Updating:* Non-decay isn't evidence for *his* device; it's evidence the baseline risk was lower than thought. His updating is flawed.
      *   *Policy:* "Epistemic Verification Standard." Probabilities must be peer-reviewed or consensus-based, not applicant-calculated.
      *   *Bounded Utility:* Maybe we cap the value of future lives? (Controversial but worth mentioning as a cost).
      *   *Thresholds:* Ignoring tiny probs opens us to missing real black swans.
      *   *Decision:* Reject Veldman based on reliability of probability estimate, not the stakes.

  5.  **Drafting - Section by Section (monitoring word count):**

      *   *Header:* To, From, Date, Subject.
