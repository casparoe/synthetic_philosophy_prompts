answer: |-
  This is a high-leverage intervention. The rationalist community has correctly identified Aumann's Agreement Theorem (AAT) as a normative cornerstone, but has largely treated the Common Prior Assumption (CPA) as a binary switch: either you accept it (and view disagreement as irrationality) or you reject it (and view disagreement as brute fact). This binary is mathematically crude and practically paralyzing.

  For a three-year, two-postdoc program aimed at *dispute resolution protocols*, you need to move from binary conditions to quantitative bounds. You need to know not just *if* agreement is possible, but *how much* epistemic friction is tolerable before convergence breaks.

  Here is the prioritization of open questions, ordered by their upstream impact on practical dispute resolution, followed by the specific popular uses of AAT this agenda undermines.

  ### Priority 1: The Robustness and Continuity of Agreement
  **Question:** *How fragile are the no-trade and agreement results to small departures from common priors?*
  **Why it is upstream:** This is the direct answer to the "caveat swallows the rule" problem. If the mapping from prior distance to posterior distance is discontinuous (i.e., an $\epsilon$ difference in priors allows a $\delta$ difference in posteriors where $\delta \gg \epsilon$), then the CPA is useless for humans. We need to establish Lipschitz-like continuity conditions for AAT. If the theorem is not robust, the other questions are academic; if it is robust, we can define "reasonable disagreement" thresholds.
  **Tractability:** Highly formal. This requires work in metric epistemology and game theory (building on Monderer & Samet's work on common *p*-belief). It does not require empirical psychology initially, though empirical data on human prior distributions would be needed later to set the $\epsilon$.
  **Shift Conditions:**
  *   *Move Up:* If postdocs find a general proof that posterior distance is bounded by prior distance under specific information structures.
  *   *Move Down:* If they construct counterexamples showing that in high-dimensional hypothesis spaces, tiny prior divergences lead to maximal posterior divergence (chaotic agreement).

  ### Priority 2: Logical Uncertainty and the Cost of Common Knowledge
  **Question:** *How do logical uncertainty and the problem of old evidence interact with the requirement for common knowledge of posteriors?*
  **Why it is upstream:** AAT requires agents to have *common knowledge* of each other's posteriors. For humans (and AI), posteriors are computed, not observed. If Agent A cannot verify that Agent B has processed evidence $E$ correctly (due to logical uncertainty or computational limits), they cannot establish common knowledge of the posterior $P(H|E)$. This is the bottleneck for the "sharing evidence" condition. You cannot resolve disputes if you cannot verify that the other party has actually updated on your data.
  **Tractability:** Mixed. Formal tools exist (logic of knowledge, logical induction), but this quietly requires empirical psychology or cognitive science to model the "cost" of verifying another's reasoning.
  **Shift Conditions:**
  *   *Move Up:* If a formal model of "bounded common knowledge" is developed that allows for approximate agreement without logical omniscience.
  *   *Move Down:* If it is proven that establishing common knowledge of posteriors is computationally intractable for any non-trivial proposition, rendering the protocol impossible.

  ### Priority 3: The Normative Justification of Harsanyi's Move
  **Question:** *What exactly justifies interpreting differing priors as differences in information rather than irreconcilable starting points?*
  **Why it is downstream:** While philosophically foundational, this is less actionable for *protocols*. Even if we cannot prove that differing priors are "irrational" in a deep metaphysical sense, we may still want to enforce CPA as a regulatory norm for dispute resolution (like assuming frictionless surfaces in physics). Solving Priority 1 (Robustness) tells us how to act *even if* we remain agnostic on Priority 3. However, this must be pursued to prevent the norms from feeling arbitrary.
  **Tractability:** Low formal tractability; high philosophical difficulty. This is primarily argumentative and conceptual.
  **Shift Conditions:**
  *   *Move Up:* If a Dutch Book argument is solidified that specifically targets prior divergence (rather than just dynamic inconsistency).
  *   *Move Down:* If it becomes clear that "priors" are inextricably linked to utility functions or cognitive architecture, making the separation incoherent.

  ### Priority 4: Self-Locating Beliefs and Indexical Disagreement
  **Question:** *Do common priors make sense for self-locating possibilities (e.g., Sleeping Beauty)?*
  **Why it is lowest priority:** While fascinating, most high-stakes human disputes (climate policy, AI risk, macroeconomics) are not about self-location. They are about world-states. Indexical disagreement is an edge case that complicates the math but rarely drives the polarization you aim to resolve.
  **Tractability:** Formal, but niche.
  **Shift Conditions:**
  *   *Move Up:* Only if the dispute resolution context shifts to AI agents who may face genuine indexical uncertainty (e.g., copies of the same agent).

  ---

  ### Overrated Popular Uses of the Agreement Theorem

  Based on this prioritization, your postdocs' work would likely demonstrate that several common rationalist tropes are mathematically unsupported or practically unreachable. You should explicitly flag these as "overrated" in your communications:

  **1. "Disagreement is Proof of Irrationality"**
  *   **The Trope:** If two reasonable people disagree, at least one is being irrational (biased, dishonest, or failing to update).
  *   **The Math Check:** If Priority 1 (Robustness) shows that small prior divergences (which are inevitable for humans with different genetic/cultural starting points) allow for significant posterior divergence, then persistent disagreement is *licensed* without implying irrationality. The theorem does not prove that disagreement is impossible; it proves it is impossible *given common priors and common knowledge*. Remove those, and the normative bite vanishes.

  **2. "Conversation Guarantees Convergence"**
  *   **The Trope:** If we just talk long enough and share all our evidence, we *must* agree.
  *   **The Math Check:** Priority 2 (Logical Uncertainty) attacks the "common knowledge" condition. Humans cannot share *everything* they know because they cannot verify that the other person has processed their information correctly. Without common knowledge of posteriors, the iterative process of AAT halts. Conversation reduces disagreement, but the math does not guarantee it eliminates it.

  **3. "Betting as a Truth Serum"**
  *   **The Trope:** You should always be willing to bet on your beliefs; if the other party refuses, they know they are wrong. (Based on the No-Trade Theorem).
  *   **The Math Check:** The No-Trade Theorem is even more fragile than AAT regarding the CPA. If priors are not common, trade is rational. Furthermore, if agents have different risk utilities (which are often conflated with priors in casual discourse), no-trade results fail. Encouraging betting in a context of non-common priors doesn't resolve disputes; it just creates liquidity for differing worldviews.

  **4. "The Ideal of Full Disclosure"**
  *   **The Trope:** We should aim to make all our reasoning transparent to achieve agreement.
  *   **The Math Check:** This ignores the computational complexity highlighted in Priority 2. "Full disclosure" is physically impossible if the reasoning chain is too long for the receiver to verify. The math suggests we should aim for *compressed* disclosure (sharing posteriors and confidence intervals) rather than *full* disclosure (sharing raw evidence and reasoning), yet the community often fetishizes the latter.

  ### Summary Recommendation
  Fund **Robustness** first. It turns the CPA from a binary gatekeeper into a dial. If you can tell a disputing pair, "Your priors differ by 5%, which mathematically licenses a posterior divergence of up to 15%," you have a tool for dispute resolution. If you tell them, "Your priors differ, so Aumann doesn't apply," you have nothing.
