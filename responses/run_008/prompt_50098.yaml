          *   *Duplication:* Does copying a happy mind double the good? Total Utilitarianism says yes. Asymmetry says... maybe not?
          *   *Non-Creation:* Not spinning up a suffering sim is good. Not spinning up a happy sim is neutral.
      *   *Tension:* If deletion is permissible for suffering sims, why is non-creation required? If duplication adds value, then non-duplication is a loss of value (challenging the "not bad" claim).
      *   *Impact:* This case tends to *lower* credence in the asymmetry because it exposes the "existence" threshold as arbitrary. If a sim exists for 1 second then is deleted, was it "created"?
      *   *Credence:* 0.4 that the asymmetry handles this cleanly.

