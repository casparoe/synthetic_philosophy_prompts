      *   *The Asymmetry:* Absence of pain is good (even if no one enjoys it), absence of pleasure is not bad (unless someone is deprived).
      *   *The Problem:* Standard total utilitarianism says more happy people = better. Negative utilitarianism says more suffering people = worse. The asymmetry tries to split the difference.
      *   *The Challenge:* Parfit's Non-Identity Problem and Arrhenius's Impossibility Theorems suggest satisfying all our intuitions about population ethics is logically impossible.

  3.  **Evaluate Sub-Question 1: Coherence of Population Axiology:**
      *   *Issue:* Can we formalize this without contradiction?
      *   *Consensus:* Arrhenius's Impossibility Theorem is a heavy hitter. It suggests no theory satisfies a set of very plausible adequacy conditions (including the asymmetry intuitions).
      *   *Estimate:* High probability that a *perfectly* coherent, formalized version is impossible without sacrificing other strong intuitions. However, "coherent enough for practical ethics" is different from "mathematically perfect."
      *   *Credence:* 0.4 that a fully coherent formalization exists. 0.6 that it's fundamentally tension-ridden.

  4.  **Evaluate Sub-Question 2: Person-Affecting View (PAV) Connection:**
      *   *Issue:* The asymmetry often relies on "you can't harm/benefit someone who doesn't exist."
      *   *Problem:* The Non-Identity Problem. If a child is born with a life worth living but could have been happier if waited for, PAV struggles to say the parents did wrong.
