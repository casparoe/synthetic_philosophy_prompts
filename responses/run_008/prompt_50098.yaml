prompt: |-
  so ive been going back and forth with a friend about the procreation asymmetry -- the view that it's bad to create a person whose life would be full of suffering, but not good in any duty-violating way to create a person whose life would be happy. like, a couple that could have a kid who'd flourish isn't doing something wrong, or failing at some moral task, by not having one. im at about 0.6 that the asymmetry is actually true. she's way more skeptical but i dont want to just trade intuitions back and forth, i want your actual credence.

  and please decompose it, dont just hand me a number. rough probabilities on the sub-questions, something like: whether any coherent population axiology can actually deliver the asymmetry (i gather there are impossibility-style results suggesting the intuitions behind it start clashing with each other once you push on them); whether the asymmetry is basically a shadow of some person-affecting view where morality is only about making people better off, and if so whether that view survives the standard problems with it; whether it's an axiological claim or a deontic one (creating happy people might make the world better while still being supererogatory, and i honestly cant tell which one the 0.6 is supposed to be about); and how much the intuitions survive being made vivid -- do people still hold it when you describe a couple who desperately want a child and will definately have a happy one.

  then the wrinkle that keeps me from going higher: imagine instead of ordinary procreation we're talking about creating digital minds inside a simulation, where the creators can monitor each mind's welfare, painlessly delete the ones trending toward net suffering, and duplicate the ones thriving. does the asymmetry say anything coherent here? is deleting a mind that already existed for a bit the same kind of "relief" as never creating a miserable life? does duplication multiply the good the way having more happy kids would? my hunch is whatever you say about this case drags the final number around a lot, but i cant tell wether it pushes up or down.

  so: the sub-question probabilities, how they roughly combine into your overall credence, which one the number is most sensitive to, and what argument or consideration would move it the most. no reading lists, i want the reasoning with its weak points marked.
