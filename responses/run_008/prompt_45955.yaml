          *   *Correction:* Actually, in *both* cases, timing is the trigger. In Case 1, Timing + Silence = Fury. In Case 2, Timing + Enthusiasm = Strategy.
          *   *The Inconsistency:* Why is the sister's silence "real feeling" (fury) but the agent's enthusiasm "fake feeling" (strategy)?
          *   *Hypothesis:* It's about *incentives*. The sister has no obvious gain from faking fury, but fury explains the silence. The agent has a clear financial/professional incentive to fake enthusiasm.
