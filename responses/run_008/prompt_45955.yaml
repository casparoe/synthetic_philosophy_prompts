      *   Sister: Silence is costly. Therefore it signals strong feeling.
      *   Agent: Praise is cheap. Therefore it signals nothing unless leveraged.
      *   Reviewer: Mistake is cheap (incompetence). "Wrong book" is costly (unlikely coincidence).
      *   Neighbor: Boxes are cheap. Tears are costly.
