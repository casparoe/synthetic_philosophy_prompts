          *   *Reasoning:* Mundane explanation ("trip") cannot account for the specific evidence ("crying nephew").
          *   *Key Factor:* **Explanatory Power / Residual Evidence.** The mundane theory leaves data on the table (the tears).

      *   **Case 5 (Self-Theory vs. Friend-Theory):**
