          *   *Neighbor:* "Trip" leaves Residual Evidence (tears). "Tragedy" absorbs it.
          *   *Self vs. Friend:* **Motivated Reasoning.** The "Protagonist Bias." You apply rigorous IBE to the world, but protective IBE to yourself.
      *   **Address the Flip-Flop (Case 6):** This is the crucial test. Why can't you decide? Because both theories have equal Explanatory Scope and equal Coincidental Load. It is genuinely underdetermined. The oscillation is the rational response to insufficient data.
      *   **Conclusion:** You aren't untrustworthy; you're human. But your novelist brain is tuned to "Narrative Coherence," which sometimes conflates "Coherent Story" with "True Story."

  5.  **Refining the Tone:**
      *   Needs to be sharp, respectful, and insightful.
      *   Avoid overly academic jargon where possible, or explain it through literary metaphors (Chekhov's Gun, Deus Ex Machina).
      *   Make sure to answer the specific question: "Is there a single principle?"
      *   *Decision:* The principle is **"The Conservation of Coincidence."** (A variation of Hanlon's Razor + Bayesian Inference). Real life rarely offers perfect coincidences (Reviewer), but it does offer causal chains (Sister/Agent). When data is left over (Neighbor), the mundane fails. When ego is involved (Self), the principle breaks.

      *   *Wait, one nuance on Case 2:* The user says "notice this is me rejecting the timing-based story."
      *   Actually, in Case 1, Timing + Silence = Fury.
      *   In Case 2, Timing + Praise = Strategy.
      *   In *both* cases, Timing is the key evidence. The difference is the *interpretation of the signal*.
      *   Silence is hard to fake (Costly). Praise is easy to fake (Cheap).
      *   So the principle holds: **Trust Costly Signals, Distrust Cheap Signals.**
      *   Sister: Silence is costly. Trust it as emotional truth.
      *   Agent: Praise is cheap. Trust it only as strategic maneuver.
      *   Reviewer: Error is cheap (incompetence). "Wrong Book" is costly (coincidence). Trust cheap.
      *   Neighbor: Tears are costly. Trust them.
      *   Self: Rejection is painful. "Market" theory is protective.
      *   Assistant: Losing email is cheap (incompetence). Polite no is strategic (cheap talk). Both are "cheap." Hence the flip-flop.

      *   *Okay, that's the winner.* **The Principle of Signal Cost.**
      *   Combined with **Residual Data** (The Neighbor's tears).
      *   Combined with **Motivated Reasoning** (The Self-Theory).

      *   Let's synthesize this into a cohesive narrative.

  6.  **Final Polish:**
