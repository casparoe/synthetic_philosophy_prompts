      *   Explanations are accepted when they reduce friction (explain the data) without creating new friction (coincidences), unless the friction serves the Ego.

      *   *Better:* **The Principle of Causal Density.**
      *   You accept explanations that have high causal density (explain multiple data points) and low coincidental density.
      *   Case 1: Fury explains timing + silence. (High density).
      *   Case 2: Rival explains timing + shift. Sincere change explains shift but ignores timing context of industry norms. (Incentive weight).
      *   Case 3: Skimmed explains error. Wrong book explains error but adds coincidence. (Coincidence weight).
      *   Case 4: Tragedy explains blinds + papers + tears. Trip explains blinds + papers but leaves tears unexplained. (Residual data).
      *   Case 5: Market theory protects ego. (Motivated reasoning).

      *   *The "Ugly Truth":* Is it just "best story"?
      *   Yes, but "best story" in life isn't "most dramatic," it's "most coherent."
      *   The flip-flop on the Assistant (Case 6): This is **Underdetermination.** Both stories have equal Causal Density. One is Incompetence (Cheap), one is Polite No (Strategic). Without a "Crying Nephew" (Residual Data), you can't decide.

