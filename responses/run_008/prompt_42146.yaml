prompt: |-
  I'm a second-year graduate student taking a seminar on decision theory, and we just spent two weeks on Hofstadter's idea of superrationality — the thought that if two agents in a one-shot Prisoner's Dilemma are both perfectly rational and each knows this, then each can reason that the other's deliberation is a mirror of their own, so the pair's choices should be treated as one choice made twice; hence both should cooperate. I found the argument strangely compelling and strangely slippery at the same time, and I want to put a number on my suspicion that it's more slippery than compelling.

  Here is the proposition I want your credence on, stated in three layers so the decomposition is forced to be honest. (1) The core claim: for two idealized agents who are relevantly identical — same priors, same reasoning procedures, common knowledge of all this — in a symmetric one-shot Prisoner's Dilemma, the correct theory of rationality prescribes cooperation. (2) The definitional claim: the phrase "relevantly identical" can be given a principled, non-ad-hoc characterization, so that the argument doesn't just pick whatever similarity happens to deliver the desired conclusion. (3) The extension claim: the prescription survives when the symmetry is weakened — say, the payoff matrices are slightly asymmetric, or one agent is rational with probability 0.9 and errs otherwise, or the two agents reason in the same style but from different background beliefs. My own tentative numbers are roughly 0.5 for (1), 0.3 for (2), and 0.15 for (3), but I don't trust the way I got them, which is why I'm asking you.

  Give me your own credence for each layer with a one-line justification, then tell me how you think the layers combine into a verdict on superrationality as a general normative doctrine (if you think they don't combine — for instance, if (1) can be true while the doctrine as a whole is a curiosity — say so and say why). Then two more things. First, identify which layer your overall verdict is most sensitive to, and what argument or kind of case would move that number the most. Second, my seminar instructor claims the whole dispute between superrationalists and causal-decision theorists is at bottom a disagreement about whether "rationality" is a property of an agent's choice or of a reasoning process that may be instantiated in several agents; my classmate thinks that's a verbal maneuver and the real fight is about what evidence an agent's own deliberation gives it about another agent's deliberation. Tell me which of them you'd bet on, and give a rough probability for that bet too. Please use American English spelling and don't build your answer around appeals to the literature — I can chase references later; what I need from you is the reasoning laid out with its load-bearing parts marked.
