answer: |-
  Here are my credences for the three layers, followed by the synthesis and the adjudication of your seminar debate.

  ### Layer Credences

  **(1) Core Claim:** 0.4
  **Justification:** Standard dominance principles conflict with logical correlation, making "correctness" dependent on a contested definition of agency rather than a settled mathematical fact.

  **(2) Definitional Claim:** 0.25
  **Justification:** Formalizing algorithmic similarity for bounded, non-identical humans without gerrymandering the similarity metric remains an unsolved technical problem.

  **(3) Extension Claim:** 0.1
  **Justification:** Logical correlation decays non-linearly with structural divergence, often reverting the optimal strategy to defection before asymmetry becomes noticeable.

  ### Verdict on Superrationality as a Normative Doctrine

  These layers combine multiplicatively rather than additively: for superrationality to function as a **general normative doctrine**, it must be correct in the ideal case (1), applicable to real agents (2), and robust to noise (3). Because the probability of all three holding simultaneously is quite low (roughly 0.01 on this model), I judge superrationality not as a general theory of rationality, but as a **local solution to a specific class of logical correlation problems**.

  The doctrine fails as a *general* guide because Layer (2) acts as a bottleneck; even if Layer (1) is true in the Platonic realm of identical source code, the inability to rigorously map human deliberation onto that model without ad-hoc adjustments means the theory cannot guide action in the real world. It remains a **conceptual proof of existence** showing that causal decision theory is not the only coherent game in town, rather than a replacement for it.

  ### Sensitivity Analysis

  My overall verdict is most sensitive to **Layer (2), the definitional claim**.

  The load-bearing part here is the **mapping from human psychology to formal algorithms**. If you could show me a robust, non-gerrymandered metric for determining when two humans are "running the same algorithm" despite having different life experiences or slight cognitive variations, my credence in Layer (2) would jump from 0.25 to perhaps 0.7. The argument that would move this number most is a **demonstration of algorithmic clustering in human reasoning**, showing that people naturally fall into discrete "decision types" that persist across slight variations in background belief, effectively solving the reference class problem. Without that, "relevantly identical" remains a philosopher's placeholder.

  ### The Seminar Debate: Instructor vs. Classmate

  I would bet on your **instructor** with a probability of **0.75**.

  Your classmate's position reduces superrationality to **Evidential Decision Theory (EDT)**: the idea that my choice is merely *news* about your choice. If that were the whole fight, superrationality would collapse into the standard problems that plague EDT (like the smoking lesion problem), where agents manipulate the news rather than the outcome.

  Your instructor identifies the deeper structural disagreement: **whether rationality evaluates the token act or the type-level algorithm**. Superrationality (and its modern descendants like Functional Decision Theory) argues that you choose the *output of your reasoning process*, which logically determines the output of any identical process. This is not just about evidence; it is about **logical causation**. The dispute is indeed about the locus of agency: Causal Decision Theory says I control my hand; Superrationalists say I control the *function* that moves my hand. That is a metaphysical and normative disagreement about the nature of choice, not merely a statistical disagreement about evidence.
