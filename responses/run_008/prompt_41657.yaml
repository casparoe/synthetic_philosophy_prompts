answer: |-
  1. I reject step (4), which erroneously assumes that a moral reason must be strong enough to render an alternative forbidden in order to count as a genuine normative force.
  2. This move feels natural because we typically conceptualize morality as a binding rulebook where reasons function primarily to generate obligations or prohibitions.
  3. Rejecting it costs you that clean rulebook model, requiring you to accept that moral reasons can weigh in favor of an act without making its omission morally culpable.
  4. Maya's strongest comeback is that without the threat of blame to mark moral importance, you cannot distinguish genuine moral value from mere personal admiration or taste.
  5. Supererogation survives because moral value is scalar and can exceed the threshold of duty without making the failure to maximize that value a violation of rules.
