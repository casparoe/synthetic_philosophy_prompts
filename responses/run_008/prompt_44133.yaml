  The principle that best unifies your verdicts is the **Positive Heuristic Criterion**: A research shift is progressive if it expands the positive heuristic (generating new puzzles, tools, or domains), even if empirical corroboration lags. It is degenerating if it modifies the protective belt solely to accommodate anomalies without opening new lines of inquiry.

  Here is how the clauses map to your cases:

  1.  **Ptolemy (Degenerating):** Captured by the "solely accommodate" clause. Epicycles were defensive patches saving phenomena without generating new astronomical problems.
  2.  **Neptune vs. Vulcan (Progressive vs. Degenerating Shifts):** MSRP appraises *shifts*, not just whole programmes. Neptune expanded the heuristic (search for new bodies) and succeeded. Vulcan expanded the heuristic but failed empirically and became a defensive patch for Mercury. You can condemn the Vulcan shift as degenerating while maintaining the Newtonian programme was still globally progressive due to other shifts.
  3.  **Marxism (Degenerating):** Captured by "without opening new lines." Post-1890s adjustments were immunizing strategies (reinterpreting failures) that halted genuine socio-economic inquiry.
  4.  **Darwin (Progressive):** This is the crux. Unlike Marxism, Darwin's accommodation of known facts (biogeography, fossils) was **unificatory**. It reorganized known material in a way that generated massive new research programmes (heredity, variation mechanisms). It satisfied the "expanding heuristic" clause despite lacking immediate novel prediction.
  5.  **Bohr (Progressive):** The early shifts were theoretically progressive (new quantum rules applied to spectra).

  **The Sacrifice:**
  To maintain consistency, you must overturn the absolute verdict on **Bohr (3)**. You state you would "never call that programme degenerating." Under the Heuristic Criterion, the Old Quantum Theory's final phase (mid-1920s) was empirically degenerating. It failed on the anomalous Zeeman effect and multi-electron atoms without offering a coherent resolution. While *theoretically* fertile (leading to QM), the specific OQT programme stalled. You must concede it became degenerating *before* it was replaced, or else you lose the ability to distinguish it from Ptolemy's final years.

  **String Theory:**
  On this principle, string theory is **theoretically progressive** but **empirically unappraised**. It exhibits immense heuristic fertility (mathematical unification, new tools), satisfying the first clause. However, without novel empirical predictions, it remains in a provisional state. It is not yet degenerating (it isn't purely defensive), but it cannot be declared empirically progressive.

  **Summary:**
  Adopt the **Positive Heuristic Criterion**. It distinguishes Darwin from Marxism via fruitfulness rather than novelty timing. It allows Vulcan to be a degenerating shift within a progressive programme. It forces you to admit Bohr's programme eventually degenerated empirically, preserving the logic that allows you to condemn Ptolemy.
