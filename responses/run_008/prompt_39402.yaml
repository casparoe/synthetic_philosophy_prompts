  **The Blind Box Bonus.** Offer Marcus a choice: $50,000 cash today, or a legally guaranteed $150,000 payable in ten years, held in a vault he cannot inspect or query until maturity.
  *   **If he takes the cash:** Rule 2 (Visibility) wins. He needs to "see" his assets to value them, revealing his patience is contingent on monitoring capability.
  *   **If he defers:** Rule 1 (Certainty) wins. The contract alone suffices, proving his discount rate is purely about counterparty risk, not psychological visibility.
