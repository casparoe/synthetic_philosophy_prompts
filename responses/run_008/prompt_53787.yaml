answer: |-
  You are absolutely correct: your sister's choices are a textbook violation of Expected Utility (EU) theory. Specifically, she is displaying the **Allais Paradox** (Choices 1 & 2) and the **Common Ratio Effect** (Choices 3 & 4). No concave utility curve can satisfy those inequalities simultaneously. She violates the Independence Axiom because her preference flips depending on whether a "sure thing" is available or whether probabilities are scaled down.

  Here is the breakdown of the models that fit her behavior, the predictions for your loss scenarios, and the specific question that will distinguish between them.

  ### 1. The Competing Rules
  You identified **Regret Theory** and **Probability Weighting**. In behavioral economics, these map to two dominant frameworks:

  *   **Cumulative Prospect Theory (CPT):** This is the "Probability Weighting" story. It posits that people don't treat probabilities linearly. We overweight small probabilities (making lotteries attractive) and underweight moderate/high probabilities. Crucially, it also includes a **Value Function** that is concave for gains (risk-averse) and **convex for losses (risk-seeking)**, plus **Loss Aversion** (losses hurt ~2x more than gains feel good).
  *   **Regret Theory:** This posits that utility depends not just on the outcome, but on the difference between the outcome you got and the outcome you *would have gotten* had you chosen differently. She chooses to minimize anticipated regret.
  *   **A Third Option: Security-Potential/Aspiration (SP/A) Theory:** This suggests she has two competing needs: *Security* (avoiding the worst outcome, driving her toward sure things) and *Potential* (achieving the best outcome, driving her toward lotteries). The context switches which need is dominant.

  ### 2. Predictions for the Loss Questions
  Both CPT and Regret Theory predict a **Reflection Effect**: people who are risk-averse in gains tend to become risk-seeking in losses to avoid a sure loss.

  **Loss Scenario A:** Sure loss of $100 vs. 50% lose $250 / 50% lose $0.
  *   **Prediction:** She will take the **Gamble (50% lose $250)**.
  *   **Why (CPT):** The value function is convex in losses. The pain of a sure $100 loss is greater than the weighted pain of a 50% chance at $250. She will gamble to "break even."
  *   **Why (Regret):** If she takes the sure loss and you tell her the gamble would have been $0, she feels massive regret. Taking the gamble offers a chance to avoid that regret.

  **Loss Scenario B:** Sure lose $1M vs. 89% lose $1M / 10% lose $2.5M / 1% lose $0.
  *   **Prediction:** She will take the **Gamble (The 89/10/1 mix)**.
  *   **Why (CPT):** This is the Allais Paradox in the loss domain. In gains, she preferred the certainty of $1M (Choice 1). In losses, she will dislike the certainty of losing $1M. She will accept the 10% risk of losing *more* ($2.5M) to keep the 1% hope of losing *nothing*.
  *   **Why (Regret):** The regret of accepting a sure $1M loss when there was a 1% chance to lose nothing is psychologically intolerable. She will gamble to keep the "hope" alive.

  **Summary:** In both gain scenarios she was Risk-Averse (mostly). In both loss scenarios, she will likely flip to **Risk-Seeking**.

  ### 3. Which Rule Fits Best?
  **Cumulative Prospect Theory (CPT)** fits her *whole* track record best.

  *   **Why CPT wins:** It naturally explains the **Reflection Effect** (Risk-averse in gains, risk-seeking in losses) via the shape of the value function. It explains the Allais Paradox via the probability weighting function (the "certainty effect" where $p=1.0$ is overweighted compared to $p=0.99$). It also explains her WTP answer (Choice 6): she pays $3 to remove a 1% risk because her weighting function overweights that small probability of disaster.
  *   **Where Regret struggles:** While Regret Theory explains the Allais choices well, it requires specific assumptions to generate the Reflection Effect consistently. It also struggles to explain Choice 6 (WTP to remove risk) without importing probability weighting anyway. Regret is about *comparison*, but Choice 6 is about *isolated valuation*.

  ### 4. The Tie-Breaker Question
  To distinguish **Probability Weighting (CPT)** from **Regret**, you need a question where the *outcomes* are identical, but the *probability structure* or *feedback* differs. Regret cares about the foregone alternative; CPT cares about the weighting of the probabilities themselves.

  **Ask her this:**
  > "Would you prefer **one ticket** with a 10% chance to win $100, or **ten tickets** each with a 1% chance to win $100?"

  *   **If she prefers the Ten Tickets (1% each):** This supports **Probability Weighting (CPT)**.
      *   *Reasoning:* People overweight small probabilities. Mathematically, $10 \times \text{weight}(1\%)$ is often greater than $\text{weight}(10\%)$. Splitting the probability makes it feel more likely to win at least once.
  *   **If she is Indifferent:** This supports **Regret Theory** (or standard EU).
      *   *Reasoning:* The final distribution of wealth is identical. In Regret Theory, if the outcomes are the same, the regret potential is the same. There is no "foregone alternative" that changes between the two options.

  **Alternative (The "Feedback" Test):**
  If you want a more conversational test, ask:
  > "If you choose the gamble and lose, does it hurt you **more** if I tell you what the other ticket would have paid, compared to if I never tell you?"

  *   **If she says "Yes, it hurts more knowing":** This supports **Regret Theory**. Her utility is directly tied to the knowledge of the foregone outcome.
  *   **If she says "No, money is money":** This supports **Probability Weighting (CPT)**. Her utility is tied to the final wealth state, not the comparison (though she still weights probabilities oddly).

  **Recommendation:** Run the loss scenarios first. If she flips to risk-seeking as predicted, you've confirmed the Reflection Effect. Then ask the **"One 10% vs. Ten 1%"** question. If she splits the tickets, you have your proof that her brain is distorting probabilities, not just minimizing regret.
