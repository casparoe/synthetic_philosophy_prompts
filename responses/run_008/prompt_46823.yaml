prompt: |-
  I'm a novelist and I'm stuck on a structural choice for my book. The setup: my narrator is a woman in her 60s who learns she has maybe two years to live, and the whole last third is her deciding what to do with the time left. I've been writing as if the fact that she will soon be dead is itself a harm to her — not just the fear while she's alive, but the dying. My editor read the draft and said the ending comes off sentimental because, in her words roughly, you can't harm someone with something they never experience — the character dies in her sleep, painlessly, so who exactly is worse off once it happens? Something about that bugs me but I can't put my finger on why. Is there actually a decent philosophical case for my editor's view, or is she smuggling in a debatable assumption about who counts as the subject of the harm? And practically for the book: should the ending treat her death as bad for her, bad for the people around her but not for her, or something stranger than either? You're a professional philosopher, so think carefully and maybe start with some brainstorming — lay out the strongest version of the editor's position and then show me where it might crack. No reading lists please, just the reasoning.
reasoning: |-
