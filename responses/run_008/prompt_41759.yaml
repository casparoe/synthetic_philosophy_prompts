answer: |-
  Here is a session plan designed for a 45-minute whiteboard session. It prioritizes conceptual architecture over historical detail, tailored to an audience fluent in analytic rigor but unfamiliar with Sanskrit categories.

  ### **Session Goal**
  To demonstrate that Nyāya treats testimony (*śabda*) as a distinct *causal mechanism* for generating knowledge, not merely a derivative form of inference (*anumāna*), by clarifying the ontology of *pramāṇa* and the immediacy of testimonial cognition.

  ---

  ### **I. The Foundation: Defining *Pramāṇa* (0–10 mins)**
  **Whiteboard Left:** Draw a causal chain: *Instrument (Karaṇa) → Cognitive Event → Veridical Content.*

  1.  **The Trap to Avoid:** Do not start with "A *pramāṇa* is a reliable source of knowledge."
      *   *Why it misleads:* "Reliable source" suggests externalism or statistical frequency (e.g., "this clock is usually right"). It invites the audience to think about *justification* (why am I allowed to believe?) rather than *genesis* (how did this belief arise?).
      *   *The Correction:* Define *pramāṇa* as an **irreducible instrumental cause** of a specific cognitive event.
      *   *The Test:* If the causal process of $X$ can be fully decomposed into $Y + Z$, where $Y$ is already a known *pramāṇa*, then $X$ is not independent.
  2.  **Head Off Misconception #1 (The Arbitrary Menu):**
      *   *When:* Immediately after defining *pramāṇa*.
      *   *The Move:* State explicitly: "The Nyāya list of *pramāṇas* is not a buffet. It is a taxonomy of cognitive faculties. You cannot add 'dreaming' or 'intuition' to the list unless you can prove they generate veridical content via a causal mechanism distinct from perception or inference."
      *   *Whiteboard:* Write "Taxonomy of Mechanisms ≠ Menu of Options."

  ### **II. The Example: The Live Wire vs. The Timetable (10–20 mins)**
  **Whiteboard Center:** Two columns. Left: "Timetable." Right: "Live Wire Warning."

  1.  **The Example:** Do not use scripture. Use a high-stakes, immediate imperative: **A colleague shouts, "Don't touch that wire, it's live!"**
  2.  **Why this over a Train Timetable:**
      *   *Timetable:* Reading a timetable is decoding a static record. You rely on past induction (timetables are usually printed correctly). It feels like inference from a sign.
      *   *Live Wire:* This example forces **immediate practical uptake**. If you treat the shout as an inference ("He spoke $\rightarrow$ He likely knows $\rightarrow$ It's live"), you hesitate. If you treat it as *śabda*, the knowledge "It is live" arises simultaneously with understanding the meaning.
      *   *What it must show:* It must demonstrate that the *content* of the knowledge ("The wire is live") is delivered *through* the meaning of the words, not inferred *from* the fact of the utterance.
  3.  **Linguistics/Law Hook:** Ask the linguists: "Is the illocutionary force here dependent on a syllogism?" Ask the lawyers: "Is this hearsay or direct evidence of the state of the wire?" (Use this only to prime intuition, not to settle the metaphysics).

  ### **III. The Reductionist Challenge & The *Āpta* Reply (20–35 mins)**
  **Whiteboard Right:** "The Reductionist Challenge" vs. "The Nyāya Reply."

  1.  **Introduce the Challenge (20–25 mins):**
      *   *The Opponent (Mīmāṃsā/Buddhist):* "Hearing speech is just perceiving a sound. Connecting sound to meaning is inference. Trusting the speaker is inference from their behavior. Therefore, *śabda* is just *anumāna* (inference)."
      *   *The Logic:* $P$: Speaker utters $S$. $Q$: Speaker is reliable. $R$: $S$ is true. (Inference from sign to fact).
  2.  **Introduce the *Āpta* (25–30 mins):**
      *   *Timing:* Bring this in *after* the challenge is fully stated, or it looks like a definitional dodge.
      *   *Definition:* An *āpta* is not a "saint." It is a speaker who **knows the truth** and **wishes to communicate it**.
      *   *The Nyāya Move:* The *āpta* is not the *premise* of an inference you run in your head. The *āpta* is the **condition of the instrument**.
      *   *Analogy:* For vision to be a *pramāṇa*, light must be present. You do not *infer* light is present to see the table; light is the condition that makes the seeing possible. Similarly, the *āpta* is the condition that makes *śabda* function.
      *   *Head Off Misconception #2 (Blind Faith):* Emphasize that Nyāya allows for defeaters. If you see the speaker is drunk (defeater), the *pramāṇa* is blocked. Trust is the default operating condition, not a leap of faith.
  3.  **Head Off Misconception #3 (Hume–Reid Transposed):**
      *   *When:* As soon as you mention "trust" or "reliability."
      *   *The Distinction:* Hume/Reid debate the *inductive justification* for testimony generally (Why trust humans at all?). Nyāya is analyzing the *structure of the specific cognitive event* (Does *this* understanding involve a middle term?).
      *   *Whiteboard:* Write "Justification (Hume/Reid) $\neq$ Causal Mechanism (Nyāya)."

  ### **IV. Diagnostics & Scope (35–45 mins)**

  1.  **The Final Diagnostic Question:**
      *   Do not ask: "Is testimony independent?" (They will just say yes because you taught it).
      *   **Ask this:** "When you understand the warning 'The wire is live,' is your belief mediated by the thought *'The speaker believes the wire is live'*? Or does the content of the world ('The wire is live') present itself directly?"
      *   *Why:* If they say the former, they are holding the Reductionist/Inference view. If they say the latter, they grasp the Nyāya claim of immediacy (*sākṣāt*).
  2.  **Setting the Boundaries (What to Refuse):**
      *   *What to exclude:* Navya-Nyāya technical refinements (qualifiers, *viśeṣaṇa*), and comparative lists from Vedānta or Buddhism.
      *   *How to say it:* "Nyāya evolved over 1,500 years. The later 'New Nyāya' turns this into a formal logic system that requires its own semester. Today, we are isolating the *classical intuition* about cognitive architecture. If we bring in the later refinements now, we will lose the core phenomenological claim."
      *   *Why this works:* It frames the exclusion as pedagogical precision, not avoidance. It respects the complexity without getting bogged down.

  ### **Summary of Whiteboard Layout**
  *   **Left:** Causal Chain (*Karaṇa* $\rightarrow$ Cognition). "Taxonomy, not Menu."
  *   **Center:** "Timetable (Inference)" vs. "Live Wire (Testimony)."
  *   **Right:** "Reductionist: Sign $\rightarrow$ Inference" vs. "Nyāya: *Āpta* as Condition (like Light)."
  *   **Bottom:** "Justification $\neq$ Mechanism."

  ### **Instructor's Cheat Sheet: Anticipating Pushback**
  *   **If a Linguist says:** "But understanding syntax is computational/inferential."
      *   **Reply:** "Nyāya grants that *decoding* words is a process. The claim is that once decoded, the *knowledge of the fact* does not require a second step of inferring the speaker's reliability."
  *   **If a Lawyer says:** "But in court, we always assess credibility first."
      *   **Reply:** "Court is a context of *defeaters*. Nyāya describes the default, non-suspicious context. You don't infer your mother's reliability when she tells you dinner is ready."
  *   **If a Philosopher says:** "This is just Externalism."
      *   **Reply:** "It is externalist about the *source*, but it makes a specific claim about the *phenomenology* of the uptake. It denies the mediating belief state."
