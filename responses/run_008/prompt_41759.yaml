prompt: |-
  I'm running a session for my department's epistemology reading group — analytic philosophers plus a few sharp people from linguistics and law, none with any Sanskrit — on the Nyāya case for treating testimony, śabda, as an independent pramāṇa rather than a species of inference. Forty-five minutes and a whiteboard. Plan the explanation rather than give it: what must be established first about what a pramāṇa is before the testimony question even arises, and why the standard gloss "reliable source of knowledge" actively misleads here; which everyday example should carry the session instead of scripture, and what that example must show that a train timetable cannot; where in the sequence to introduce the reductionist challenge — that hearing a speaker just gives you grounds to infer their reliability, the way you'd infer it for any other sign — and where to bring in the Nyāya reply via the trustworthy speaker, āpta, so the reply lands as more than a relabeling; the misconceptions this audience will predictably form, namely that the pramāṇa list is an arbitrary menu that could just as well be lengthened, that trusting the āpta is epistemic blind faith dressed up, and that the whole debate is just the Hume–Reid dispute over testimony transposed into Sanskrit and therefore nothing new; the exact point in the sequence at which each should be headed off; one question I can ask at the end that would show whether they've genuinely understood why Nyāya took testimonial knowledge to be immediate rather than inferred; and what I should openly refuse to get into at this level — say, the Navya-Nyāya refinements or the longer pramāṇa lists of other schools — and how to say so without making it sound like dodge.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Analytic philosophers, linguists, lawyers (sharp, no Sanskrit).
      *   **Topic:** Nyāya case for *śabda* (testimony) as an independent *pramāṇa* (instrument of knowledge) vs. inference (*anumāna*).
      *   **Constraints:** 45 minutes, whiteboard only.
      *   **Task:** Plan the explanation, *not* give the explanation itself.
      *   **Key Requirements:**
          *   Define *pramāṇa* correctly (avoid "reliable source" trap).
          *   Select an everyday example (better than a train timetable).
          *   Sequence the reductionist challenge and Nyāya reply (*āpta*).
          *   Anticipate and head off specific misconceptions (arbitrary menu, blind faith, Hume-Reid rehash).
          *   Formulate a final diagnostic question.
          *   Identify scope limits (what to exclude and how).

  2.  **Deconstruct the Philosophical Core:**
      *   *Pramāṇa:* It's not just a "source." It's a *distinct causal process* yielding *novel* cognition (*anadhigata*). If the process is reducible to another, it's not independent.
      *   *Śabda vs. Anumāna:* Reductionists (Mīmāṃsā/Buddhists/some Nyāya opponents) say: I hear words $\rightarrow$ I infer the speaker knows this $\rightarrow$ I believe it. Nyāya says: No, if I understand the sentence and trust the speaker, the knowledge arises *directly* from the meaning, not via a middle step of inferring reliability.
      *   *Āpta:* Trustworthy speaker. Not "infallible," but one who knows the truth and wants to communicate it.
      *   *Immediacy:* The crux. Is there a mediating inference?

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Setting the Stage (0-10 mins) - Defining *Pramāṇa*.**
          *   *Problem:* "Reliable source" is too vague. It implies externalism without the internal causal mechanism.
          *   *Solution:* Define *pramāṇa* as a *distinct causal generator* of veridical cognition.
          *   *Whiteboard:* Draw a causal chain. $X \rightarrow \text{Cognition}$. If $X$ can be broken down into $Y + Z$ where $Y$ is already a *pramāṇa*, $X$ isn't independent.
          *   *Misconception Check:* Head off the "arbitrary menu" idea here. The list isn't a buffet; it's a taxonomy of cognitive mechanisms.

      *   **Phase 2: The Example (10-20 mins) - Beyond Timetables.**
          *   *Problem:* Train timetables imply institutional authority or inductive habit.
          *   *Solution:* Needs to be interpersonal but immediate. A warning? A direction?
          *   *Selection:* "There is a snake in the grass ahead."
          *   *Why:* High stakes (pragmatic), requires immediate action, distinguishes between seeing the snake (perception) vs. being told (testimony).
          *   *Contrast:* Timetable requires checking past reliability. The snake warning requires understanding the *meaning* now.
          *   *Misconception Check:* Head off "Blind Faith." It's not faith; it's understanding meaning + context of trust.

      *   **Phase 3: The Reductionist Challenge & Nyāya Reply (20-35 mins) - The Core Argument.**
          *   *Challenge:* "You infer reliability from the fact they spoke." (Sign $\rightarrow$ Inference).
          *   *Nyāya Reply:* The *āpta*.
          *   *Timing:* Introduce challenge *after* the example is set up. Introduce *āpta* as the condition for the *pramāṇa* to function, not the object of an inference *during* the event.
          *   *Nuance:* *Āpta* isn't "I infer you are good." It's "You are the type of source that makes *śabda* work."
          *   *Misconception Check:* Head off "Hume-Reid." Hume/Reid is about justification/induction. Nyāya is about the *structure of the cognitive event*.

      *   **Phase 4: Wrap-up & Diagnostics (35-45 mins).**
          *   *Scope Limit:* Navya-Nyāya (too technical), other schools (too comparative).
          *   *Final Question:* Needs to test "immediacy."
          *   *Closing:* How to exclude topics gracefully.

  4.  **Refining the Details (Self-Correction during drafting):**
      *   *Critique:* Is "snake in the grass" too cliché?
      *   *Fix:* Make it specific. "A colleague says, 'The server is down.'" Or "A guide says, 'This bridge is unsafe.'" Let's go with the **Bridge/Guide** example. It fits the "law/linguistics" audience (authority, instruction, safety). Actually, the prompt asks for *everyday* over scripture. "There's a tiger in the path" is the classic Nyāya example. Let's stick closer to the classic but modernize it. "A trusted colleague says, 'The meeting is in Room B, not A.'" No, that's too trivial. Let's use **"There is a fire in the next room."** It's perceptual vs. testimonial.
      *   *Wait, better:* **"Don't drink that milk, it's sour."** You can't perceive it yet. You have to trust the speaker. If you infer reliability, you drink it while inferring. If testimony is immediate, you don't drink.
      *   *Actually, the prompt asks what the example must show that a timetable cannot.* A timetable is static. A speaker is dynamic. The example must show *understanding meaning* vs. *reading a sign*.
      *   *Decision:* Use **"There is a ledge ahead"** (Warning). It shows immediate practical uptake without a syllogism.

      *   *Critique:* How to handle the "Hume-Reid" objection?
      *   *Fix:* Explicitly state that Hume/Reid is about *justification of induction* (why trust testimony generally?), whereas Nyāya is about *ontology of cognition* (what kind of mental event is this specific instance?).

      *   *Critique:* Defining *Pramāṇa*.
      *   *Fix:* Emphasize *instrumentality*. It's the *karana* (instrumental cause).

  5.  **Finalizing the Structure (matching the prompt's specific demands):**
      *   **Part 1: The Definition Trap.** (Address "reliable source" vs. "instrumental cause").
      *   **Part 2: The Example.** (Address "Timetable" vs. "Speaker").
      *   **Part 3: The Reductionist Challenge.** (Where to place it).
      *   **Part 4: The *Āpta* Reply.** (Avoiding "relabeling").
      *   **Part 5: Misconceptions.** (Menu, Faith, Hume-Reid).
      *   **Part 6: Scope & Question.**

  6.  **Writing the Plan:** (Iterative refinement for tone and precision).
      *   *Tone:* Professional, pedagogical, strategic.
      *   *Whiteboard usage:* Specify what goes where.
      *   *Timing:* Strict adherence to 45 mins.

      *(Self-Correction on the Final Question)*: It needs to distinguish inference from immediate cognition. "When you hear 'Fire!', do you first think 'He believes there is fire' or do you think 'There is fire'?" Nyāya says the latter (in the ideal *pramāṇa* case).

      *(Self-Correction on Scope)*: Don't just say "No time." Say "That changes the rules of the game we are playing today."

  7.  **Final Review against constraints:**
      *   Did I define *pramāṇa* correctly? Yes (instrumental cause).
      *   Did I pick the right example? Yes (Warning/Imperative/Knowledge claim mix).
      *   Did I place the reductionist challenge correctly? Yes (after example, before *āpta*).
      *   Did I address the 3 misconceptions? Yes.
      *   Did I draft the final question? Yes.
      *   Did I handle the scope limit? Yes.

  8.  **Final Polish:** Ensure the distinction between *reductionism* (testimony is inference) and *independence* (testimony is sui generis) is clear in the plan. Ensure the *āpta* isn't presented as a premise in a syllogism but as a condition of the instrument.

  *(Final thought on the example)*: The prompt asks what the example must show that a train timetable cannot. A timetable is a *record*. A speaker is an *agent*. The example must show *communicative intent* leading to *immediate cognition*. I will suggest the "Poisoned Cup" or "Snake in the Path" scenario. Let's go with "Snake in the Path" but framed modernly. "Watch out, that wire is live."

