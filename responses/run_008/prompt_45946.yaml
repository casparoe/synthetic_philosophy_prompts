answer: |-
  # The Crossing Curves

  **Setting:** *A quiet corner of the school library, late afternoon. Textbooks and printed papers are scattered across the table. LEO is leaning back, spinning a pen. MAYA is highlighting a passage in a philosophy reader.*

  **Leo:** You're overcomplicating it, Maya. You're treating "willpower" like it's a muscle or a ghost in the machine. It's not. It's just math.

  **Maya:** Math doesn't capture the normativity, Leo. I'm not talking about what I *do*, I'm talking about what I judge I *ought* to do.

  **Leo:** But that judgment is just a preference state at Time One. Look, imagine you're on a diet. On Monday, you prefer the health benefits of salad on Friday over the taste of a burger on Friday. The curve is stable. But as Friday gets closer, the discount rate spikes. That's hyperbolic discounting. The curves cross. Suddenly, the burger is worth more *to you* than the salad. You aren't acting against your will; your will just updated.

  **Maya:** That's preference reversal, not weakness of will. If I simply change my mind because the object is closer, that's just being impulsive. Akrasia is specific. It's acting against your *better judgment* at the very moment of action. On Friday, standing in the cafeteria, I judge that I should eat the salad. All things considered. I know the burger is tastier, I know I'm hungry, but I still judge the salad is the right choice. And yet I eat the burger.

  **Leo:** But *why* do you judge that? Because you value the long-term goal. But in that moment, the short-term value outweighs the long-term value in your actual decision calculus. If the burger actually outweighs the salad in your utility function at that second, you aren't acting against your judgment. You're acting according to your strongest desire. To say otherwise is to pretend you have a "true self" that lives in the future.

  **Maya:** I'm not positing a true self. I'm positing a structure of reasoning. There's a difference between an unconditional judgment—"I should not eat this"—and a conditional one—"I should not eat this, unless I want to more than I want to be healthy." In akrasia, I hold the unconditional judgment, but I act on the desire. The discounting model collapses the judgment into the desire. It says if I chose the burger, I must have wanted it more.

  **Leo:** And didn't you?

  **Maya:** Not necessarily. That's the phenomenon the model misses. Sometimes I eat the burger and I don't even enjoy it. I'm stressed, I'm shoving it in, I feel compelled. If discounting were the whole story, the closer reward should be more attractive. But what if the reward is neutral or even negative in the moment? I'm still compelled. Discounting explains why a smaller reward beats a larger one. It doesn't explain why a *non-reward* beats a larger reward.

  **Leo:** That's just internal conflict. Maybe you have sub-agents. One wants stress relief, one wants health. The stress-relief agent wins because its discount curve is steeper.

  **Maya:** But then who is the "I" that regrets it? If it's just agents fighting, regret is just the losing agent complaining. But *I* regret it. The whole person. The discounting view dissolves the agent into a sequence of temporal slices. If I'm just a series of time-slices with crossing preferences, I can't be weak-willed. I'm just inconsistent over time. Weakness of will requires a synchronic inconsistency—a break within the moment.

  **Leo:** Okay, but look at the solution. If you accept the discounting model, you get a practical tool for willpower. It's bundling. You don't treat the burger choice as one-off. You treat it as a test case for every future lunch. If you eat the burger now, you signal to your future selves that the rule is broken. The cost isn't the calories; it's the collapse of the bundle. That's what people call "willpower." It's bookkeeping.

  **Maya:** That's clever, Leo, I'll give you that. Ainslie's bundling theory is robust. But notice what you've done. You've explained how to *prevent* the lapse, not what the lapse *is*. To bundle choices, I have to already care about the rule. I have to already hold the judgment that "breaking the rule is bad" independent of the immediate desire. If I didn't have that standing judgment, the bundle wouldn't matter. So the bundling trick presupposes the very capacity for better judgment you're trying to reduce away.

  **Leo:** It presupposes a preference for consistency. That's still a preference.

  **Maya:** Is it? A preference for consistency sounds like a recognition of rationality. Look, let's talk about regret. In your model, regret is just the Monday-self yelling at the Friday-self. But often, I regret the lapse *while* I'm doing it. I'm eating the burger and thinking, "I shouldn't be doing this." If the curves have crossed, the burger *is* the rational choice for the Friday-self. Why would the Friday-self regret its own rational choice?

  **Leo:** Because the Friday-self is myopic. It knows the Monday-self will be angry. It's an inter-temporal negotiation.

  **Maya:** No, it's not a negotiation. It's a condemnation. The feeling of akrasia is the feeling of being governed by a desire you simultaneously repudiate. If you reduce that to "steep discounting," you're defining the problem out of existence. You're saying, "There is no weakness of will, there is only changing value." But that doesn't match the experience. The experience is that the value *didn't* change. I still value health more. I just failed to align my action with that value.

  **Leo:** But "failing to align" implies you could have done otherwise with the same desires and beliefs. That's libertarian free will magic. My model is deterministic. Desires shift, actions follow. If you say you valued health more but chose health less, you're saying your choice didn't track your value. So what did it track?

  **Maya:** It tracked inclination, not value. That's the distinction. We have inclinations—urges, impulses—and we have evaluations. Akrasia is when inclination overrides evaluation. Discounting says evaluation *is* inclination, just measured at different times.

  **Leo:** Because "evaluation" without inclination is empty. What does it mean to "value" health if you aren't willing to trade taste for it?

  **Maya:** It means I endorse the principle. I commit to it. When I break it, I don't say, "Oh, I guess I value taste more now." I say, "I was weak." I acknowledge the standard remained, and I fell short. Your model says the standard shifted.

  **Leo:** The standard shifted because the context changed. Proximity is a context. If I offer you $100 now or $110 tomorrow, you might take the $110. If I offer you $100 in a year or $110 in a year and a day, you take the $110. But if I offer you $100 *right now* versus $110 tomorrow, you take the $100. Your preference reversed. Did your "principle" of maximizing money shift? No. The discount function is part of the principle.

  **Maya:** But that's monetary utility. Moral and prudential judgment isn't just utility maximization. If I promise to meet you, and I stay in bed because it's warm, I haven't just discounted the future value of your trust. I've violated a categorical obligation I acknowledge *in the moment*. I know I should get up. The warmth doesn't make the promise less binding; it just makes the bed more comfortable. The discounting model conflates the *force* of the temptation with the *weight* of the reason.

  **Leo:** But how do you measure the "weight" of the reason other than by what you choose?

  **Maya:** By what I affirm. I can affirm "I must go" while choosing "I will stay." That gap is the space of akrasia. If you close the gap by saying "choosing stay means you affirmed stay," you lose the phenomenon. You're left with consistent agents making time-relative choices. That might be good psychology, but it's bad moral philosophy.

  **Leo:** Maybe moral philosophy needs to catch up with psychology. If "weakness of will" is just a label for hyperbolic discounting, then we stop blaming people for being "weak" and start helping them manage their discount curves. Pre-commitment, bundling, removing cues. It's more humane.

  **Maya:** It might be more humane, but is it true? If I treat a moral failure as a calculation error, I lose the concept of responsibility. If the curves crossed, I couldn't have done otherwise. But I feel responsible. I feel I *could* have resisted, even if the desire was strong.

  **Leo:** That feeling is the illusion. The "could have" is a counterfactual that didn't happen.

  **Maya:** Then we're at a stalemate. You think the feeling of "could have" is a bug in the system. I think it's the feature that defines agency. You've explained the mechanics of the lapse, Leo. You haven't explained the authority of the judgment that was lapsing.

  **Leo:** And you've defended the authority of the judgment, Maya, but you haven't explained how it gets overpowered without magic. If the judgment was truly "all-things-considered best," why did the hand move the other way?

  **Maya:** Because I am not a perfect rational agent. I am a divided one.

  **Leo:** And I'm saying that division is just time.

  **Maya:** No. The division is here, now. Between what I want and what I stand for.

  **Leo:** Then we define "irrationality" differently. For me, it's inconsistency over time. For you, it's inconsistency within the self.

  **Maya:** Exactly. And until you can explain why I feel bound by a judgment that my desires are actively contradicting *right now*, your curves are just describing the symptom, not the disease.

  **Leo:** And until you can explain how a judgment moves a limb without being the strongest desire, your "standing for" is just a story you tell yourself after the fact.

  **Maya:** *Closes her book softly.* We're not going to solve this for the essay, are we?

  **Leo:** *Smiles.* We've defined the disagreement. That's usually enough for an A.

  **Maya:** Let's hope so.

  Verdict: the better-judgment defender
