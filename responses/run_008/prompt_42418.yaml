prompt: |-
  Assume the role of a professional philosopher who also writes satire in the tradition of Swift, and think carefully before drafting. First, consider the features of Hannah Arendt's account of Adolf Eichmann: cliché-ridden language, thoughtlessness, careerism, the substitution of rule-following and precedent for independent judgment, and the buffer of paperwork between a desk and its consequences. Then write a satirical job advertisement of roughly 500 words for a mid-level administrative post in a large, unnamed bureaucratic organization. The advertisement must never mention any crime, ideology, or victim; the position's darker responsibilities should surface only through euphemism ("case-flow management," "final disposition of backlogs"), performance metrics, and generous benefits language. The requirements section should quietly demand precisely the traits Arendt took to make such a figure dangerous rather than monstrous: fluent officialese, a strong preference for procedure over conscience, and pride in processing volume. Close with an equal-opportunity statement that lands the thesis that evil of this kind recruits the mediocre and the careerist, not the demonic. Keep the tone deadpan throughout: a reader who has never heard of the Eichmann trial should find it a chillingly ordinary corporate listing, while a scholar of Arendt should recognize the "banality of evil" without once seeing it named.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher + Satirist (Swiftian tradition).
      *   **Task:** Write a satirical job advertisement (~500 words) for a mid-level administrative post.
      *   **Subject:** Based on Hannah Arendt's account of Adolf Eichmann (banality of evil).
      *   **Key Features to Incorporate:** Cliché-ridden language, thoughtlessness, careerism, rule-following over judgment, buffer of paperwork, euphemisms ("case-flow management," "final disposition"), performance metrics, generous benefits.
      *   **Constraints:** Never mention crime, ideology, or victims. Tone must be deadpan/ordinary corporate speak.
      *   **Target Audience Effect:** Ordinary reader sees a boring job ad; Arendt scholar sees the "banality of evil."
      *   **Closing:** Equal-opportunity statement that hints at recruiting the mediocre/careerist, not the demonic.

  2.  **Deconstruct Arendt's Eichmann:**
      *   *Thoughtlessness:* Inability to think from the standpoint of others. Not stupidity, but a lack of critical reflection.
      *   *Clichés:* Stock phrases, officialese, shielding oneself from reality.
      *   *Careerism:* Focus on promotion, duty, and loyalty to the organization rather than moral content.
      *   *Desk Murderer:* Distance from the physical act. Paperwork as a buffer.
      *   *Rule-Following:* Obeying orders/laws as the ultimate moral justification.

  3.  **Drafting Strategy - Tone and Voice:**
      *   Needs to sound like a generic HR posting found on LinkedIn or Indeed.
      *   Buzzwords: "Synergy," "compliance," "stakeholders," "optimization," "streamlining."
      *   The horror must lie in the *implications* of the tasks, not the description of the tasks themselves.
      *   Swiftian satire involves adopting the persona of the proposer (here, the HR department) earnestly, letting the absurdity speak for itself.

  4.  **Drafting - Section by Section:**

      *   **Header:** Generic organization name. "Department of Administrative Logistics" or similar.
      *   **Introduction:** Welcome the candidate. Emphasize stability and order.
      *   **Role Overview:** Focus on movement of files, not people. Use euphemisms. "Final disposition," "resolution."
      *   **Responsibilities:**
          *   Managing flow.
          *   Ensuring compliance with existing frameworks.
          *   Avoiding independent judgment (framed as "adherence to protocol").
          *   Volume processing.
      *   **Requirements:**
          *   Fluency in officialese.
          *   Comfort with detachment.
          *   Career ambition (framed as "growth within the structure").
          *   Lack of "disruptive" questioning.
      *   **Benefits:** Generous pension, distance from field operations.
      *   **EEO Statement:** The punchline. Focus on "ordinary citizens," "team players," "no special moral distinctions required."

  5.  **Refining the Content (Iterative Process):**

      *   *Check Word Count:* Aim for ~500 words.
      *   *Check Constraints:* No mention of death, camps, politics, Jews, Nazis, etc.
      *   *Check Tone:* Must be boringly corporate.
      *   *Arendtian Markers:*
          *   "Cliché-ridden language" -> Use lots of corporate buzzwords.
          *   "Thoughtlessness" -> Frame as "focus on procedure."
          *   "Careerism" -> Frame as "upward mobility."
          *   "Buffer of paperwork" -> Emphasize desk-based work, remote from "field implementation."
          *   "Rule-following" -> "Strict adherence to established guidelines."

      *   *Drafting the EEO:* This needs to be subtle. "We welcome applicants who prioritize organizational loyalty over personal idiosyncrasies." Or "All backgrounds welcome, provided they align with standard operational procedures." Let's try: "We seek individuals who understand that greatness lies in reliable repetition, not exceptionalism."

  6.  **Writing - First Pass (Mental or Scratchpad):**
      *   Title: Senior Logistics Coordinator.
      *   Org: The Bureau.
      *   Job: Move papers from A to B. Ensure forms are signed. Don't ask why.
      *   Benefits: Good pension, never have to see the result of your work.
      *   Requirements: Good at filing, like rules, want to climb ladder.
      *   EEO: We don't need heroes, we need workers.

  7.  **Polishing and Expanding (incorporating Swiftian precision):**
      *   Make the language smoother, more bureaucratic.
      *   Ensure the euphemisms land hard for those who know. "Final disposition" is key. "Transport logistics" without saying what is transported.
      *   Emphasize the *relief* of not having to think.

  8.  **Final Review against Constraints:**
      *   ~500 words? (Need to monitor length).
      *   No crime/ideology/victims? (Check).
      *   Deadpan? (Check).
      *   Arendtian themes visible? (Check).

      *(Self-Correction during drafting)*: Make sure I don't make it *too* obvious. It shouldn't scream "EVIL JOB." It should scream "BORING JOB" that happens to facilitate evil. The horror is the banality.

      *Revised EEO idea:* "Our organization believes that moral clarity is found in strict adherence to coded regulations. We encourage applications from those who find comfort in structure."

      *Let's write.*

      *Word Count Check:* I need to ensure I hit close to 500. I might need to expand on the benefits or the specific duties to bulk it up without losing the tightness.

      *Focus on the "Desk" aspect:* Arendt emphasizes the distance. The ad should highlight "remote oversight" or "headquarters-based coordination."

      *Focus on "Language":* Mention "strong command of standardized terminology."

      *Focus on "Careerism":* "Ideal for those seeking long-term tenure."

      *Okay, let's assemble.*

      *(Drafting thought)*: Start with a standard header. "Position Title: Regional Compliance Officer II."
      "Organization: Central Administrative Directorate."
      "Location: Headquarters (Remote from Field Operations)."

      *Responsibilities:* "Oversee the final disposition of pending files." "Ensure seamless transition of units between sectors." "Maintain strict confidentiality regarding downstream outcomes."

      *Requirements:* "Proven ability to suppress personal intuition in favor of statutory guidelines." "High volume processing."

      *Benefits:* "Comprehensive pension," "Psychological distance from implementation sites."

      *EEO:* "We are an equal opportunity employer committed to the recruitment of ordinary citizens who value duty over distinction."

      *Wait, need to make sure the Swiftian satire shines.* Swift is precise, logical, but morally inverted. The logic should be impeccable within the frame of the bureaucracy.

      *Let's refine the EEO to hit the "mediocre not demonic" point.* "We do not seek visionaries. We seek stabilizers."

      *Okay, ready to generate.*

      *Word Count Management:* I will write generously to ensure I meet the ~500 mark without fluffing it too much. The density of the euphemisms matters.

      *Final Polish:* Ensure no emotional language. Purely functional.

      *(Post-Draft Review)*: Does it sound like a real job ad? Yes. Does it sound like Eichmann? Yes. Is it ~500 words? I will monitor.

      *Let's begin.*
