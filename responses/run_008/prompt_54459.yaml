prompt: |-
  You are an expert in formal epistemology, specializing in accuracy-first epistemology and epistemic utility theory, with hands-on experience translating that theory into working procedures for analytic and forecasting teams; you write for practitioners, not for journals.

  I lead a geopolitical forecasting unit at a risk consultancy. Each quarter, my analysts log credences on 80–120 questions with fixed resolution dates, and everyone is scored on a Brier-style basis. We run a two-stage process: credences are logged privately, then revealed to the whole team, and each analyst may revise once after seeing the others' numbers. Our current revision policy is "use your judgment," which in practice means the timid drift toward the median and the stubborn don't move at all. I want to replace this with a disciplined second-stage policy grounded in what accuracy-first epistemology actually supports: what the propriety of scoring rules implies about when deference maximizes expected accuracy, when averaging over a crowd with conditionally independent evidence beats holding your own credence, and — crucially — when those arguments break, for instance when analysts share the same news diet so their errors are correlated, when one analyst holds private information the others cannot see, or when the resolution criterion is vague enough that "the truth" is not a fixed target.

  Please think carefully and begin with a short brainstorm of what the epistemic utility framework gives you to work with here and what it does not, then commit to the procedure.

  The deliverable: a decision procedure an analyst can run in about ten minutes at the reveal stage, before revising a single credence. It should be stated in words with at most arithmetic — nobody on my team will evaluate an integral under deadline — and should specify, in order: what to inspect about the distribution of the other credences (spread, clustering, who holds the outliers), what to inspect about one's own credence and the evidence behind it, when the policy mandates moving a specified distance toward the group mean, when it permits holding, and when it requires flagging the question to me rather than revising at all. Mark honestly which steps are judgment calls dressed up as procedure. Then work the procedure through three cases: (1) all seven other analysts cluster tightly around 0.15 on a currency-crisis question where you logged 0.45, and you suspect your number leans on sources the whole team reads anyway; (2) you are the only analyst with a contact on the ground, and the team median runs against you; (3) the team splits cleanly into clusters at 0.2 and 0.8 on an election question whose resolution wording is ambiguous enough that reasonable people could score the outcome either way. At least one worked case should end in an answer my analysts will resent, and you should close by stating what the procedure cannot do — the situations in which the entire framing of accuracy-maximizing revision misfires and the honest move is to escalate or abstain rather than revise.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Expert in formal epistemology (accuracy-first, epistemic utility theory) with practical experience in forecasting teams.
      *   **Audience:** Practitioners (geopolitical forecasting analysts), not academics. Tone should be direct, actionable, and honest about limitations.
      *   **Context:** Quarterly forecasting, 80-120 questions, Brier scoring, two-stage process (private -> reveal -> one revision).
      *   **Problem:** Current revision policy ("use your judgment") leads to timidity (herding) or stubbornness.
      *   **Goal:** A disciplined second-stage revision policy grounded in accuracy-first epistemology (propriety, conditional independence, correlation, private info, ambiguity).
      *   **Deliverable:** A 10-minute decision procedure (words + simple arithmetic).
      *   **Requirements:**
          *   Start with a brainstorm of what the framework gives/doesn't give.
          *   Specify the procedure steps (inspect distribution, inspect own evidence, move/hold/flag rules).
          *   Mark judgment calls honestly.
          *   Work through three specific cases (Currency crisis/herding, Private info/ground contact, Ambiguous resolution/clustering).
          *   One case must yield a resented answer.
          *   Close with limitations (when the framing misfires).

  2.  **Brainstorming: Epistemic Utility Theory & Forecasting:**
      *   *What it gives:*
          *   **Propriety:** Proper scoring rules (like Brier) incentivize reporting true credences. You shouldn't hedge for score maximization *if* you know your true credence.
          *   **Deference Principles:** If you know someone else is more informed or reliable, you should defer (Linear/Geometric pooling).
          *   **Condorcet/Jury Theorems:** If errors are independent and unbiased, the average is better than the individual.
          *   **Reflection Principle:** You should align your current credence with your expected future credence (after seeing others' views, if you trust them).
      *   *What it doesn't give:*
          *   **Weights:** It doesn't tell you *how much* to weight others vs. yourself without knowing reliability metrics.
          *   **Correlation:** It doesn't automatically detect shared bias (common news diet).
          *   **Ambiguity:** It assumes a fixed truth condition. If the resolution criteria are vague, "accuracy" is ill-defined.
          *   **Strategic Behavior:** It assumes everyone is trying to be accurate, not political.
      *   *Practical Translation:* We need heuristics that approximate Bayesian updating without the math. We need to distinguish between "social pressure" (bad) and "aggregating independent signal" (good).

  3.  **Drafting the Procedure (The "Core"):**
      *   *Step 1: Diagnose the Spread.* Look at the distribution. Tight cluster vs. bimodal vs. uniform.
      *   *Step 2: Diagnose the Source.* Why do I believe what I believe? Is it private info? Unique model? Or just the same CNN headline everyone saw?
      *   *Step 3: The Movement Rule.*
          *   If independent errors likely -> Move toward mean.
          *   If shared bias likely -> Hold.
          *   If private info -> Hold (or move slightly for calibration).
          *   If ambiguity -> Flag.
      *   *Step 4: The Magnitude.* How far? Linear pooling suggests a weighted average. Let's make it simple: "Move halfway unless..."
      *   *Refining the "Judgment Calls":* I need to be explicit that determining "independence" is the hard part.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Currency Crisis):* 7 others @ 0.15, Me @ 0.45. Shared news diet.
          *   *Epistemic verdict:* Likely shared bias or I'm overreacting. Accuracy-first says defer to the crowd *if* independence holds, but here correlation is high. However, if I have no *private* info, the crowd's consensus usually beats an outlier based on public info (regression to the mean).
          *   *Resented Answer:* "Move to 0.25." (Admitting you're likely noise).
      *   *Case 2 (Ground Contact):* Me @ 0.8 (private contact), Team @ 0.3.
          *   *Epistemic verdict:* Private signal trumps public consensus. Do not herd.
          *   *Answer:* Hold at 0.8.
      *   *Case 3 (Ambiguous Election):* Bimodal (0.2 / 0.8). Wording vague.
          *   *Epistemic verdict:* Truth condition is unstable. Brier score is meaningless if "True" is subjective.
          *   *Answer:* Flag to Lead. Do not revise.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but humble about the theory's limits.
      *   Avoid jargon like "strictly proper scoring rules" without explanation.
      *   Focus on "Expected Accuracy."

  6.  **Writing the Content - Section by Section:**

      *   *Intro/Brainstorm:* Acknowledge the tension. Proper scoring rules say "report truth." Aggregation says "listen to others." The conflict is resolved by *information structure*.
      *   *The Procedure:* Break it down into the requested steps (Inspect Distribution, Inspect Evidence, Decision Matrix).
      *   *The "Judgment Call" Warning:* Be explicit that assessing correlation is subjective.
      *   *The Cases:* Walk through them using the procedure. Ensure Case 1 feels painful (admitting you might be wrong without new info).
      *   *Limitations:* When does this fail? (Political pressure, malicious actors, truly undefined outcomes).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Move halfway" too arbitrary?
      *   *Fix:* Justify it as a heuristic for "unknown reliability." If you don't know who's right, splitting the difference minimizes maximum regret (minimax) and approximates Bayesian updating with flat priors on reliability.
      *   *Critique:* Is the distinction between "shared news" and "private info" clear enough?
      *   *Fix:* Add a specific checklist item for "Source Audit."
      *   *Critique:* Did I address the "resented answer"?
      *   *Fix:* In Case 1, make sure the instruction is to move significantly toward the group, implying the analyst's initial 0.45 was likely overconfidence on public noise. Analysts hate admitting they were just noisy.

  8.  **Final Polish:** Check constraints. 10-minute limit? Yes. Arithmetic only? Yes. Mark judgment calls? Yes. Three cases? Yes. Limitations section? Yes.

      *(Self-Correction on Case 1)*: If the news diet is shared, errors are correlated. Standard epistemic utility theory says if errors are perfectly correlated, the crowd adds no value. *However*, in practice, individual *processing* of public info varies. If 7 people process public info to 0.15 and 1 person to 0.45, the outlier is statistically likely to be the one with the processing error, unless they have a secret model. I need to make sure the procedure captures "Do you have a *model* or just a *feeling*?" If just a feeling, defer.

      *(Refining the "Resented" aspect)*: Analysts resent being told to herd. So Case 1 should force a move toward the herd even if they feel "stubbornly" right, based on the statistical likelihood of outlier error on public info.

      *(Refining Case 3)*: Ambiguity is a hard stop. Accuracy-first requires a truth value. No truth value = no accuracy.

      *(Final check on tone)*: Ensure it sounds like a memo from a Chief Forecaster to the team, not a lecture.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Brainstorm: What the Framework Gives (and What It Doesn't)

  **What Accuracy-First Epistemology Gives Us:**
  1.  **The Goal:** The sole objective is maximizing expected accuracy (minimizing expected Brier score). We are not optimizing for consensus, comfort, or political safety.
  2.  **Propriety:** If you are certain your credence reflects your total evidence, moving *only* to game the score is irrational. You should report your true belief.
  3.  **The Value of Others:** Other analysts are valuable only insofar as they possess **independent evidence** or **independent processing** of evidence. If we all read the same three wires and interpret them the same way, seven opinions equal one opinion.
  4.  **The Danger of Correlation:** If errors are correlated (shared bias), averaging does not cancel out error; it calcifies it.
  5.  **Deference:** If you identify another analyst as more reliable on a specific topic (higher track record, better access), accuracy demands you weight their credence higher than your own.

  **What It Does Not Give Us:**
  1.  **Weights:** Theory tells us to weight by reliability, but it doesn't hand us the reliability coefficients in real-time.
  2.  **Independence Tests:** There is no arithmetic test for "independent processing." This is the critical judgment call.
  3.  **Truth Conditions:** Epistemic utility assumes a fact of the matter. It breaks down when the resolution criteria are subjective.

  ---

  ### The Procedure: The 10-Minute Revision Protocol

  **Objective:** Maximize expected accuracy on the Brier score.
  **Time Limit:** 10 minutes per question cluster.
  **Tools:** Pen, paper, the reveal dashboard.

  #### Phase 1: Inspect the Distribution (2 Minutes)
  Look at the spread of the 7 other credences. Categorize the shape:
  *   **Tight Cluster:** Range < 0.20 (e.g., 0.10 to 0.30).
  *   **Wide Spread:** Range > 0.40 (e.g., 0.10 to 0.50).
  *   **Bimodal Split:** Two distinct groups (e.g., four at 0.20, three at 0.80).
  *   **Outlier Status:** Are you the single outlier? One of two? Or in the main pack?

  #### Phase 2: Source Audit (3 Minutes)
  Ask yourself three questions about the evidence behind *your* number. Be honest.
  1.  **The News Diet Test:** Is my evidence primarily from sources the whole team accesses daily (major wires, public reports)?
      *   *Yes:* Your error is likely correlated with theirs.
      *   *No:* You have potential independence.
  2.  **The Private Signal Test:** Do I possess specific information (human source, proprietary data, specialized model output) that the team *cannot* see?
      *   *Yes:* This is high-value independence.
      *   *No:* You are processing public info.
  3.  **The Expertise Test:** On this specific topic (e.g., Russian logistics vs. Brazilian elections), does my track record significantly outperform the team average?
      *   *Yes:* Weight yourself higher.
      *   *No:* Weight yourself equal to or lower than the mean.

  #### Phase 3: The Decision Matrix (5 Minutes)
  Apply the following rules based on Phase 1 and 2.

  **Rule A: The "Noise Outlier" (Mandatory Move)**
  *   **Condition:** You are a single outlier (Phase 1) AND your evidence is public/shared (Phase 2, Q1 & Q2 = No).
  *   **Action:** You are likely processing noise. Move your credence **50% of the distance** toward the team mean.
  *   **Why:** Without private info, the law of large numbers favors the cluster. Your deviation is likely error, not insight.

  **Rule B: The "Private Signal" (Hold Firm)**
  *   **Condition:** You hold private information (Phase 2, Q2 = Yes) OR you are a recognized specialist with a superior track record (Phase 2, Q3 = Yes).
  *   **Action:** **Hold** your original credence. Do not move.
  *   **Why:** Accuracy requires incorporating all evidence. If you dilute private info to match public consensus, you degrade the forecast's accuracy.

  **Rule C: The "Shared Bias" (Judgment Call)**
  *   **Condition:** Tight Cluster (Phase 1) BUT you suspect the whole team (including you) is ignoring a structural factor (e.g., everyone assumes stability because markets are calm).
  *   **Action:** **Hold** or move only **10%** toward the mean.
  *   **Why:** *Judgment Call.* If errors are correlated, the mean is not truth; it's shared delusion. Do not herd into a trap.

  **Rule D: The "Ambiguous Target" (Escalate)**
  *   **Condition:** Bimodal Split (Phase 1) AND the resolution criteria allow for interpretation (Phase 2 intuition).
  *   **Action:** **Flag for Lead.** Do not revise. Enter a note explaining the ambiguity.
  *   **Why:** If "True" is not fixed, Brier scoring is invalid. Revising is pointless.

  ---

  ### Worked Cases

  #### Case 1: The Currency Crisis (The Resented Answer)
  *   **Scenario:** 7 analysts cluster at 0.15. You are at 0.45.
  *   **Phase 1:** You are a single outlier. Tight cluster.
  *   **Phase 2:**
      *   *News Diet:* You read the same Bloomberg terminals and IMF reports as everyone else. (Shared)
      *   *Private Signal:* None. You just feel the market is overreacting. (None)
      *   *Expertise:* You are a generalist; two others are FX specialists. (Lower/Equal)
  *   **Application:** This triggers **Rule A (Noise Outlier)**. You have no private info to justify the deviation. Statistically, you are likely the one with the processing error.
  *   **Decision:** **Move to 0.30.** (50% of the distance from 0.45 to 0.15).
  *   **Why Analysts Resent This:** It feels like herding. It feels like admitting cowardice. But accuracy-first epistemology dictates that without unique evidence, an outlier position is statistically probable to be *less* accurate than the aggregate. You are being paid to be right, not to be distinct.

  #### Case 2: The Ground Contact (The Hero Stand)
  *   **Scenario:** Team median is 0.30 (Regime holds). You are at 0.80 (Regime falls).
  *   **Phase 1:** You are a single outlier. Wide spread.
  *   **Phase 2:**
      *   *News Diet:* Team relies on open source. You rely on a text message from a contact in the capital received 1 hour ago. (Private)
      *   *Private Signal:* Yes, direct human intelligence.
      *   *Expertise:* Regional specialist.
  *   **Application:** This triggers **Rule B (Private Signal)**. The team's evidence is a subset of yours. Their consensus is based on incomplete data.
  *   **Decision:** **Hold at 0.80.**
  *   **Why:** Updating toward the mean would mean discarding high-value private information to align with lower-value public information. That reduces expected accuracy.

  #### Case 3: The Ambiguous Election (The Escape Hatch)
  *   **Scenario:** Question: "Will Candidate X claim victory?" Four analysts say 0.20 (No), three say 0.80 (Yes).
  *   **Phase 1:** Bimodal Split.
  *   **Phase 2:**
      *   *Ambiguity Check:* "Claim victory" could mean a speech on election night or a formal legal filing weeks later.
      *   *Source Audit:* Both clusters have valid interpretations of the wording.
  *   **Application:** This triggers **Rule D (Ambiguous Target)**.
  *   **Decision:** **Flag for Lead.** Do not revise.
  *   **Why:** If the resolution judge can interpret "claim" either way, there is no single truth condition. A Brier score here measures luck or interpretation, not forecasting skill. Revising your number is epistemically vacuous.

  ---

  ### Honest Marking of Judgment Calls

  I need to be transparent about where this procedure relies on your intuition rather than math:

  1.  **Defining "Private Information":** In Phase 2, deciding if your insight is truly "private" or just a unique synthesis of public info is subjective. A unique synthesis is valuable, but less so than hard data. *Procedure Fix:* If you can't write down the specific source that others lack, assume it's not private info.
  2.  **Detecting Shared Bias:** In Rule C, deciding if the cluster is "wise" or "deluded" is the hardest call in forecasting. *Procedure Fix:* Default to trusting the cluster unless you can articulate the specific blind spot in one sentence. If you can't, you are likely the one with the blind spot.
  3.  **The 50% Move:** Why 50%? It's a heuristic. It acknowledges you might be right (don't go all the way to the mean) but admits you are likely noisy (don't stay at the outlier). It is not derived from a specific reliability coefficient.

  ### Limitations: When This Framework Misfires

  This procedure assumes a specific environment. It will fail, and potentially harm accuracy, in the following situations:

  1.  **Political Incentives:** If analysts know that being the "lone wolf" who was right gets promoted, but being the "lone wolf" who was wrong gets fired, they will game Rule B. They will claim "private signals" that don't exist to justify stubbornness. Accuracy-first theory cannot fix incentive misalignment.
  2.  **Malicious or Incompetent Peers:** The "Wisdom of Crowds" requires the crowd to be competent. If your team is junior and you are senior, Rule A (Move to Mean) actively degrades accuracy. You need a "Senior Override" clause not listed here.
  3.  **Dynamic Questions:** If the question resolves based on the forecast itself (e.g., "Will the central bank raise rates?" where your forecast influences the market which influences the bank), standard Brier optimization breaks.
  4.  **The "Unknown Unknown":** Sometimes the cluster is tight because everyone is ignoring a black swan. Rule C attempts to catch this, but if you don't know what you're missing, you will follow Rule A and herd into the crash.

  **Final Instruction:** If you find yourself flagging more than 15% of questions under Rule D, or holding firm under Rule B more than 30% of the time, you are not using the procedure; you are using it to justify pre-existing biases. Reset.
