prompt: |-
  I'm a novelist working on a book in which one character is a teaching assistant for an undergraduate course on AI safety, and I want the scene where she grades an exam to ring true. Rather than fake the assessment, I'd like you to do the grading she would do. Below is the essay question as it appeared on the exam, followed by the answer written by a student character.

  Question: "Explain the distinction between approval-directed and goal-directed AI agents. Why do proponents of approval-direction think it reduces the risk of an AI pursuing something unintended, and what trade-offs or limitations do they acknowledge?"

  Student's answer: "A goal-directed agent is given an objective and optimizes for it. An approval-directed agent, by contrast, has no objective of its own; it simply takes the action that its supervisor would most approve of. The idea was proposed by Stuart Russell as part of his work on inverse reinforcement learning, where the agent infers the human's preferences and then pursues them. The main advantage is error correction: if the agent misunderstands what we want, the damage is limited to a single unapproved action, whereas a goal-directed agent with a misspecified objective will pursue that wrong objective confidently and at scale, because nothing in its design ever checks back with us. This is why approval-direction avoids value lock-in: the human's judgment can be updated as circumstances change, whereas a goal fixed at design time cannot. The known limitation is that it requires the supervisor to evaluate every candidate action in real time, which is infeasible for a system acting at machine speeds, and it caps the agent's capability at the supervisor's own level of judgment."

  Please respond exactly as the TA's completed grading would read: the first sentence should state the bottom line (the grade and a one-clause verdict), and everything after should be the specific comments justifying it, point by point. No preamble, no restating of the question or of these instructions.
