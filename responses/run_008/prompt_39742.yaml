prompt: |-
  i teach a decision theory / phil of probability seminar, 10 students, one 75-minute session, and next week we hit the St. Petersburg paradox and its evil cousins. design an in-class game around the Pasadena game — Nover and Hájek's variant where you flip a coin until it lands heads, and the payoff for heads on toss n is (-2)^n / n, so the "expected value" is that alternating harmonic-ish series that's only conditionally convergent, meaning you can rearrange it to converge to anything you want (or diverge). i want them to actually play it for real stakes — chocolate coins or whatever, keep it under ten bucks total — and then have to set prices: what would you pay to play, what would you sell it for, is it better or worse than a sure dollar? then i want a second phase where the accumulated results get tallied on the board in different orderings, so they can watch the "running average" drift toward different values depending only on how the same outcomes got grouped, and someone in the room should notice what's happening before i say anything.

  give me: the rules, the payoff scheme scaled so the accounting doesn't eat the whole period (nobody wants to watch coin flips for 40 mins, and almost every play terminates fast, so figure out how to get enough trials), how to run the re-ordering bit so it doesn't look like a cheap trick, and a debrief that maps what happened onto conditional convergence, what it means for expectation to just not exist as a number, and what decision theory is supposed to do with a gamble like this (dominance? risk-of-ruin reasoning? refusing the framing?). no lecture up front, and they shouldn't have heard the name "Pasadena" before that day.

  also: tell me what will predictably go wrong the first time i run it, and be honest about the gap between the activity and the real thing — like, the divergence is an asymptotic fact about infinitely many flips, and in 75 minutes they're seeing maybe a few hundred trials, so what exactly have i shown them and what do i have to just assert at the end?
