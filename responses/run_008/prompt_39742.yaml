answer: |-
  # Seminar Plan: The Pasadena Exchange

  **Topic:** The Pasadena Game (Nover & Hájek variant)
  **Time:** 75 Minutes
  **Students:** 10
  **Budget:** ~$10 (approx. 100–120 chocolate coins/tokens)
  **Materials:** 10 fair coins, whiteboard + markers, 3 packs of chocolate coins (or M&Ms), sticky notes (2 colors), printed "Pasadena Ledger" sheets.

  ---

  ## Part 1: The Setup & Pricing (15 Minutes)
  **Goal:** Elicit intuition before revealing the math.

  1.  **The Pitch:** Tell the class they are traders at a volatile exchange. You are the House.
  2.  **The Asset:** Hand out a slip of paper with the rules, but **do not name the game**.
      *   *Rule:* Flip a fair coin until it lands Heads.
      *   *Count:* Let $n$ be the toss number of the first Heads (1, 2, 3...).
      *   *Payoff:* You receive (or pay) $P$ tokens, where $P = \frac{(-2)^n}{n}$.
      *   *Sign:* If $P$ is positive, House pays you. If $P$ is negative, you pay House.
      *   *Currency:* 10 Tokens = 1 Chocolate Coin.
  3.  **The Task:** Before anyone plays, ask them to write down two numbers privately:
      *   **WTP (Willingness To Pay):** What is the maximum number of tokens you would pay to *take* this gamble?
      *   **WTA (Willingness To Accept):** What is the minimum number of tokens you would demand to *sell* this gamble (i.e., take the other side)?
  4.  **Collect & Hide:** Gather the papers. Do not discuss them yet.

  ## Part 2: The Trading Floor (30 Minutes)
  **Goal:** Generate a dataset of outcomes that feels "real" but terminates quickly.

  1.  **Endowment:** Give every student 20 Tokens (2 chocolates worth) of starting capital. This prevents immediate "ruin" if they hit a negative early.
  2.  **Rounds:** Run 3 rounds. In each round, every student plays once.
      *   *Total Games:* 30 plays.
      *   *Efficiency:* Students pair up. Student A flips for Student B; Student B records. Then swap. You (instructor) flip for the last pair if needed, or join a pair.
  3.  **The Ledger:** On the whiteboard, draw a master table:
      *   Columns: `Game #`, `Toss Count (n)`, `Payoff (Tokens)`, `Cumulative Sum`.
      *   As each pair finishes, they shout their $n$ and Payoff. You (or a designated scribe student) fill the board.
      *   *Example:*
          *   Game 1: $n=1 \rightarrow (-2)^1/1 = -2$ tokens.
          *   Game 2: $n=3 \rightarrow (-2)^3/3 = -8/3 \approx -3$ tokens (round to nearest integer for speed).
          *   Game 3: $n=2 \rightarrow (-2)^2/2 = +2$ tokens.
  4.  **Payout:** At the end of 3 rounds, students tally their net tokens.
      *   Convert to chocolate: Every 10 tokens = 1 coin. (Fractions round in favor of the student to keep morale high).
      *   *Safety Valve:* If a student ends up deeply negative (e.g., -50 tokens), they don't owe you physical chocolate from their own stash; they simply receive 0 coins at the end. The "loss" is opportunity cost. This keeps the budget under $10 while preserving the *feeling* of loss.

  ## Part 3: The Audit (Re-Ordering) (20 Minutes)
  **Goal:** Visually demonstrate conditional convergence without a lecture.

  1.  **The Data:** You now have ~30 payoff values on the board (e.g., $-2, +2, -3, +4, -6 \dots$).
  2.  **The Challenge:** Tell the class: "We need to calculate the 'Fair Value' of this game based on our empirical data. That means finding the average payoff."
  3.  **Group A (Chronological):** Calculate the running average using the order the games were played (Row 1 to 30). Plot this as a blue line on a graph (Y-axis = Running Average, X-axis = Game Number).
  4.  **Group B (The Optimists):** Hand out yellow sticky notes. Write the *positive* payoffs on them. Hand out pink notes for *negative* payoffs.
      *   Ask two students to come to the board.
      *   Task: Rearrange the sticky notes to make the "Running Average" look as **high** as possible.
      *   *Hint:* They will naturally group positives together early.
      *   Plot this as a green line.
  5.  **Group C (The Pessimists):** Ask two other students to rearrange the *same* sticky notes to make the average look as **low** as possible.
      *   *Hint:* Group negatives together early.
      *   Plot this as a red line.
  6.  **The Reveal:** The three lines will diverge. The "value" of the exact same set of outcomes depends entirely on the order in which you sum them.
  7.  **Silence:** Let them stare at the board for 30 seconds. Ask: "Which line represents the true expected value?"

  ## Part 4: Debrief & Theory (10 Minutes)
  **Goal:** Map the activity to the philosophy.

  1.  **Name Drop:** Reveal this is the **Pasadena Game** (Nover & Hájek, 2004).
  2.  **The Math:**
      *   The Expected Value is the sum of (Probability $\times$ Payoff).
      *   Prob($n$) = $1/2^n$. Payoff = $(-2)^n/n$.
      *   Term = $(-1)^n/n$.
      *   The Series: $-1 + 1/2 - 1/3 + 1/4 \dots$
      *   This is the **Alternating Harmonic Series**. It converges to $-\ln(2)$ *only if* summed in order.
      *   **Riemann Rearrangement Theorem:** Because the sum of positive terms diverges ($\infty$) and negative terms diverges ($-\infty$), you can rearrange the series to sum to *any* number (or $\pm \infty$).
  3.  **Decision Theory Implications:**
      *   **MEU Failure:** Maximizing Expected Utility cannot give an answer here. The expectation is undefined (or arbitrary).
      *   **Dominance:** Does this gamble dominate a sure $0? No. Sometimes you win, sometimes you lose.
      *   **Risk of Ruin:** In the finite game (our class), variance is huge. In the infinite game, the "average" doesn't settle.
      *   **Conclusion:** Some gambles are not just "risky"; they are *ill-defined*. A rational agent might refuse to price it at all.

  ---

  ## What Will Predictably Go Wrong (And How to Handle It)

  **1. The "Finite Sample" Problem**
  *   **The Issue:** The paradox relies on infinite trials. In 30 trials, the sums won't actually diverge to $\pm \infty$. The "Optimist" and "Pessimist" lines on the board will drift apart, but they won't look like they're going to infinity. They will just look like noisy stock charts.
  *   **The Fix:** Be honest. "We are seeing the *mechanism* of divergence, not the asymptotic result. In a finite room, we see instability. In the math, that instability becomes total arbitrariness."
  *   **Assert:** You must assert that as $N \to \infty$, the divergence becomes absolute. The activity proves the *sensitivity to order*, not the infinite divergence itself.

  **2. Budget Blowout**
  *   **The Issue:** If a student hits $n=9$ or $n=10$, the payoff is $\approx 50$ to $100$ tokens (5–10 chocolates). If three students get lucky, you exceed $10.
  *   **The Fix:** Use the "Opportunity Cost" rule mentioned in Part 2. Students start with 20 tokens. If they end negative, they get 0 chocolate. If they end positive, they cash out. This caps your liability to the total endowment + a small buffer.
  *   **Alternative:** Cap the payoff at $\pm 30$ tokens per game. Acknowledge this "truncation" in the debrief as a necessary evil of physical reality vs. mathematical platonism.

  **3. The "Cheating" Objection**
  *   **The Issue:** Students will say, "Re-ordering the outcomes is cheating. The game happened in chronological order. Why does the order matter?"
  *   **The Fix:** This is the core philosophical point. Expected Value is defined as a sum over the *sample space*. In standard probability (Lebesgue integration), the sum must be **absolutely convergent** to be independent of ordering. Because this game is only *conditionally* convergent, the definition of "Expectation" itself breaks down. The order matters because the mathematical object "Expectation" does not exist for this distribution.

  **4. Boredom during Flips**
  *   **The Issue:** Flipping coins 30 times is fast (5 minutes). You have 25 minutes of dead air in Part 2.
  *   **The Fix:** Make them record the *Cumulative Sum* after every single game on their own sheets. They are tracking the "Stock Price" of the game in real-time. This keeps them engaged in the drift.

  ## The Gap Between Activity and Theory
  You must close the session by admitting the simulation's limits:
  1.  **Truncation:** We rounded payoffs to integers. The math requires precise fractions.
  2.  **Finitude:** We played 30 times. The paradox requires infinity.
  3.  **The Lesson:** "We didn't prove the expectation is undefined today. We demonstrated that our *intuition* for averaging breaks down when positive and negative risks both grow without bound. The math tells us that break is fatal; the game just lets you feel the wobble."

  ## Instructor Cheat Sheet (Payoffs)
  *Keep this handy for quick verification during the game.*

  | Toss ($n$) | Prob | Payoff Formula | Value (Tokens) | Rounded |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | 1/2 | $(-2)^1 / 1$ | -2 | -2 |
  | 2 | 1/4 | $(-2)^2 / 2$ | +2 | +2 |
  | 3 | 1/8 | $(-2)^3 / 3$ | -2.66 | -3 |
  | 4 | 1/16 | $(-2)^4 / 4$ | +4 | +4 |
  | 5 | 1/32 | $(-2)^5 / 5$ | -6.4 | -6 |
  | 6 | 1/64 | $(-2)^6 / 6$ | +10.66 | +11 |
  | 7 | 1/128 | $(-2)^7 / 7$ | -18.28 | -18 |
  | 8 | 1/256 | $(-2)^8 / 8$ | +32 | +32 |
  | 9 | 1/512 | $(-2)^9 / 9$ | -56.88 | -57 |
  | 10 | 1/1024 | $(-2)^{10} / 10$ | +102.4 | +102 |

  *Note: If $n \ge 9$ occurs, celebrate the rarity, but remind them of the budget cap if you implemented one.*
