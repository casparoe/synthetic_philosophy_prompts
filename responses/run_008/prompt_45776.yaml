answer: |-
  # Specification for a Theory of Temporal Phenomenology

  **To:** Principal Investigator, Temporal Structure Lab
  **From:** Theoretical Consultant
  **Subject:** Desiderata for Architectures of Conscious Time

  You have asked for a specification sheet to evaluate theories of consciousness against the temporal anomalies your lab investigates. The goal is to separate empirical necessities from metaphysical commitments and to identify where the constraints might break the system.

  Below are seven desiderata. Each includes the motivating phenomenon, the requirement, and a classification of its status (Non-Negotiable vs. Camp Commitment).

  ---

  ## I. The Desiderata

  ### 1. Generative Content (The "Fill-In" Requirement)
  *   **Motivating Case:** Apparent motion (red spot → green spot) and the Cutaneous Rabbit. Subjects report content (color change mid-path, taps mid-forearm) that corresponds to no physical stimulus at that location/time.
  *   **Requirement:** The theory must specify the ontological status of the unstimulated content. Is it a hallucination generated *ex nihilo*, an interpolation based on priors, or a retrospective fabrication? It must explain how the brain generates a coherent object trajectory when the sensory input is discontinuous.
  *   **Status:** **Non-Negotiable.** Any theory that cannot account for why the subject reports a continuous path rather than two static flashes fails to describe the data.

  ### 2. Temporal Revision (The "Postdiction" Requirement)
  *   **Motivating Case:** Backward masking and Libet-style delays. A later stimulus (mask) alters the visibility of an earlier one (target). A stimulus triggered by cortical readiness is reported as simultaneous with the intention, despite physical delay.
  *   **Requirement:** The theory must allow for later-arriving information to alter the conscious status of earlier-arriving information without violating causality. It must explain how $t_2$ input affects $t_1$ experience without requiring literal backward causation.
  *   **Status:** **Non-Negotiable.** This is a robust empirical finding. A theory that insists on strict feedforward temporal locking is falsified by masking data.

  ### 3. The Experience/Memory Distinction (The "Veridicality" Requirement)
  *   **Motivating Case:** Masking and distortion. Did the subject experience the target and forget it? Or did they never experience it, and the memory trace is simply of the mask?
  *   **Requirement:** The theory must provide a criterion to distinguish between (A) an experience that occurred and was subsequently misremembered, and (B) a distorted experience that was faithfully recorded by memory. It must ground the difference between *phenomenal error* and *mnemonic error*.
  *   **Status:** **Camp Commitment (Realist).** This assumes there is a "fact of the matter" about the experience prior to the report. Illusionist or strong constructionist camps may argue this distinction is empty (i.e., the memory trace *constitutes* the experience).

  ### 4. Continuity without a Container (The "Stream" Requirement)
  *   **Motivating Case:** The subjective sense of a gap-free, serial movie stream vs. the neural reality of parallel, distributed, discrete processing.
  *   **Requirement:** The theory must explain the *appearance* of continuity without positing a "finish line" or a "Cartesian Theater" where inputs converge to be presented to a homunculus. The seamlessness must be an emergent property of the processing, not a feature of the presentation locus.
  *   **Status:** **Non-Negotiable (with caveats).** Neuroanatomy rules out a single convergence point. However, "functional" finish lines are permissible if not topological.

  ### 5. Epistemic Status of Reports (The "Data" Requirement)
  *   **Motivating Case:** Your methodology relies on subjects pressing buttons or speaking.
  *   **Requirement:** The theory must treat self-reports as behavior caused by neural states, not as infallible revelations of inner states. It must explain why reports are generally reliable enough to be data, yet systematically unreliable in specific temporal illusions.
  *   **Status:** **Non-Negotiable.** This is a methodological baseline for experimental psychology.

  ### 6. The Pause Constraint (The "Frozen Brain" Requirement)
  *   **Motivating Case:** Functional pause of all neural processing for one second, then resume.
  *   **Requirement:** The theory must provide a principled answer to: "Was there experience during the pause?"
      *   *State-based theories* owe an answer about the persistence of the state.
      *   *Process-based theories* owe an answer about the cessation of the flow.
      *   *Answering "The question is meaningless"* is permissible only if the theory explains *why* the concept of experience dissolves without transition.
  *   **Status:** **Commitment (Metaphysical).** This tests whether the theory views consciousness as a *state* (like a picture) or a *process* (like a flame). Neither is empirically settled, but the theory must pick one.

  ### 7. Temporal Determinacy (The "Fact of the Matter" Requirement)
  *   **Motivating Case:** The need to interpret your data.
  *   **Requirement:** There must be a determinate fact about what the subject consciously experienced at time $t$, independent of the report made at $t+n$. If the report at $t+n$ determines what happened at $t$, the data loses its anchor.
  *   **Status:** **Camp Commitment (Realist).** This is the strongest metaphysical load. It demands that experience is an event that *happens*, not just a story that is *told*.

  ---

  ## II. Joint Satisfiability Analysis

  **The Tension:** There is a significant tension between **Desideratum 4 (No Theater)** and **Desideratum 7 (Temporal Determinacy)**, mediated by **Desideratum 3 (Experience/Memory Distinction).**

  If you deny a privileged locus or moment of "completion" (No Theater), then there is no specific time $t$ at which an experience becomes "fixed." In a distributed, parallel system (like the Multiple Drafts model), content is revised continuously. If content is revised at $t_2$, was the content at $t_1$ the original or the revision?
  *   If you say the revision *changes* the past experience, you satisfy Postdiction (2) and No Theater (4), but you violate **Temporal Determinacy (7)**. There is no fact of the matter about what was experienced at $t_1$ until $t_2$ arrives.
  *   If you say the revision creates a *new* experience while the old one existed briefly, you satisfy Determinacy (7), but you risk positing a "micro-theater" where the first draft was presented before being overwritten, violating the spirit of No Theater (4).

  **The Cost:** To satisfy joint satisfiability, you likely must weaken **Desideratum 3 (Experience/Memory Distinction).**
  If there is no finish line, memory traces are not records of a prior show; they are the final draft of the show. In this view, "what was experienced" is identical to "what is available for report."
  *   **Recommendation:** If you require a determinate fact of the matter (7) to validate your data, you are implicitly committed to a form of Realism that borders on Cartesian Materialism. If you wish to remain strictly naturalistic (No Theater), you must accept that the "fact of the matter" is relative to the time of inquiry. **You cannot have both strong Determinacy and strong No-Theater without a functional contradiction.**

  ---

  ## III. The Exclusionary Constraint

  **Which single requirement does the most work excluding candidate theories?**

  **Desideratum 3: The Experience/Memory Distinction.**

  This is the sharpest knife.
  *   **Why:** Most modern cognitive theories (Predictive Processing, Global Workspace, Multiple Drafts) treat consciousness as a constructive process where memory and perception are intertwined. They tend to collapse the distinction between "experience" and "memory of experience."
  *   **Exclusion:** Insisting on a hard boundary between *having an experience* and *remembering having it* excludes almost all process-oriented, anti-representationalist, and illusionist models. It forces the theory to posit a stable, pre-mnemonic phenomenal object. This requirement alone filters out the majority of contemporary philosophy of mind, leaving only strong Realist or Dual-Aspect theories.
  *   **Consequence:** Keeping this requirement protects the validity of your data (there is something *to* measure) but isolates your lab from the dominant trends in theoretical neuroscience. Dropping it aligns you with current theory but threatens the interpretability of your temporal measurements.

  ---

  ## IV. Candidate Scoring

  ### 1. Cartesian Materialism (CM)
  *   **The Picture:** There is a specific place/time in the brain where sensory processing finishes and consciousness "happens."
  *   **Performance:**
      *   **Passes:** *Generative Content, Temporal Determinacy, Experience/Memory Distinction.* Because there is a finish line, there is a fact of the matter about what was on the "screen" before memory recorded it.
      *   **Passes:** *Pause Constraint.* If the brain freezes at the finish line, the frame holds. Experience persists as a static image.
      *   **Fails:** *Continuity without a Container.* It explicitly posits a privileged locus. It contradicts the distributed nature of neural processing.
      *   **Fails:** *Temporal Revision.* It struggles to explain how $t_2$ affects $t_1$ without implying the $t_1$ frame was held in a buffer unseen until $t_2$ arrived (which reintroduces a homunculus).
  *   **Verdict:** **Rejected.** It saves the data's interpretability (Determinacy) at the cost of neuroanatomical plausibility. It fails the Non-Negotiable "No Theater" constraint.

  ### 2. Multiple Drafts Model (MDM)
  *   **The Picture:** Consciousness is a narrative constructed by parallel processes. There is no finish line; there are only various "drafts" of experience, some of which lead to report.
  *   **Performance:**
      *   **Passes:** *Continuity without a Container, Temporal Revision.* It handles masking and apparent motion naturally: the brain simply writes the most coherent draft given the available info.
      *   **Passes:** *Pause Constraint.* It offers a principled "No." Experience is a process (like a flame); if processing stops, experience ceases. No frame is held.
      *   **Fails (or Reinterprets):** *Experience/Memory Distinction.* In MDM, the memory trace *is* the final draft. There is no "original experience" distinct from the memory available for report.
      *   **Fails (or Reinterprets):** *Temporal Determinacy.* There is no determinate fact about what was experienced at $t_1$ until the narrative stabilizes at $t_2$.
  *   **Verdict:** **Conditionally Accepted.** It satisfies the neuroanatomical and phenomenological constraints (No Theater, Stream, Revision). However, it requires you to weaken your **Desideratum 3 and 7**. You must accept that your data (reports) do not reflect a prior, fixed inner event, but rather the *outcome* of the temporal integration process. The "fact of the matter" is the report itself, not a hidden variable the report measures.

  ### Summary Recommendation
  If your lab's primary goal is to map the *mechanisms* of temporal integration (how the brain constructs the rabbit), adopt the **Multiple Drafts** architecture but explicitly acknowledge that "experience" is the output of the mechanism, not its input.

  If your primary goal is to prove that *phenomenal time* differs from *physical time* in a way that implies a distinct ontological layer, you must keep the **Experience/Memory Distinction**, but you will need to fight for a "Functional Theater" (a transient, distributed convergence zone) to ground the determinacy you require. Be aware that this puts you at odds with the standard interpretation of masking and readiness potential data.
