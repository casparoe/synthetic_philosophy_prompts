          *   Code: DNA sequence.
          *   CPU: Ribosome (translates mRNA to protein).
          *   Memory/Tape: DNA (storage) + mRNA (transient).
          *   Compiler/Interpreter: Transcription/Translation machinery.
          *   Control Flow: Transcription Factors/Regulatory elements.
          *   OS/Environment: The Cell.
      *   *Reality Check:* This is the standard "Central Dogma" mapping. I need to present this clearly first.

  4.  **Analyzing the Breaks (Task 2 & 3):**
      *   *Break 1: Separation of Data and Instruction.* In von Neumann, code and data are distinct. In biology, DNA is data *and* structural scaffold. Proteins (products) regulate the DNA (source).
      *   *Break 2: Determinism.* Software is (mostly) deterministic. Biology is stochastic (noise, thermal fluctuation).
      *   *Break 3: Context/Environment.* Software runs in an isolated sandbox (usually). A cell *is* the environment. You can't patch a cell without the patch interacting with everything else (pleiotropy).
      *   *Break 4: Version Control.* Software has versions. Biology has evolution/epigenetics.
      *   *Which breaks matter for "Debugging"?*
          *   Determinism matters (patches might not work same way twice).
          *   Separation of Data/Instruction matters (changing code changes the executor).
          *   Context matters (side effects/pleiotropy).
          *   *Pedantic:* Whether ribosomes are *literally* silicon CPUs. That doesn't matter.

  5.  **Addressing the Typogenetics/Quine Aspect (Task 4):**
      *   Hofstadter's Typogenetics shows "enzymes" are encoded *in* the strand they act upon.
      *   This is the "Self-Modifying Code" argument.
      *   *Does this prevent debugging?* Yes, in the traditional sense. If you patch a function, but that function determines *how* patches are applied, you have a recursion problem.
      *   *The "Halting Problem" of Biology:* You can't fully simulate a system from within the system easily.
      *   *Crucial Point:* In software, we try to *avoid* self-modifying code because it's a nightmare to debug. Biology *is* that nightmare. The professor is suggesting we treat a spaghetti-code, self-modifying, non-deterministic system as if it were clean Python script.

  6.  **Proposing a Better Analogy (Task 5):**
