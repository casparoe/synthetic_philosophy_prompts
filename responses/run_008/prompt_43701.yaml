      *   **Task 1:** Audit the professor's analogy. Create a correspondence table (Instruction Set, Tape, CPU, Compiler, Program/Data).
      *   **Task 2:** Identify where the mapping breaks.
      *   **Task 3:** Distinguish between "pedantic" breaks and breaks that matter for the "debugging/patching" conclusion.
      *   **Task 4:** Address the self-reference/quine aspect (Typogenetics insight). Does self-modification prevent debugging?
      *   **Task 5:** Suggest a better analogy if "code" is the wrong tool.

  2.  **Initial Assessment & Stance:**
      *   The professor's analogy is the "Central Dogma" simplified into Computer Science terms. It's useful for intro bio but dangerously misleading for therapeutic intervention.
      *   The user's insight from GEB is profound and accurate. Biology is *not* von Neumann architecture. It's more like a chemical reaction network or a self-modifying Lisp machine.
      *   The "debugging" conclusion is the weak point. Software debugging assumes determinism, isolation, and a clear separation of concerns. Biology lacks all three.
      *   I need to validate the user's intuition while remaining precise about *why* the professor is oversimplifying.

  3.  **Drafting the Correspondence Table (Task 1):**
