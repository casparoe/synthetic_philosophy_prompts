      *   **Selection Effects:** The "Anthropic Principle" angle. If life takes 10 billion years to evolve, we can't exist on a planet where it takes 11. So finding it early here doesn't prove it's easy, just that we aren't on a slow planet. Dev thinks this is unfalsifiable skepticism.

