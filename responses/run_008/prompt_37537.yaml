      *   Ensure the "Voluntold" narrator voice isn't in the document itself, but the document is the *output* for the narrator to give them. (Wait, the prompt asks *me* to draft the statement. I should write the statement itself, perhaps with a brief note to the user if necessary, but the core output is the document Dev and Marta will read).
