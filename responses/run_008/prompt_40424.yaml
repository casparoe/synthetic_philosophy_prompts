answer: |-
  # Which Sleeping Beauty Position Do You Actually Hold?

  You and your friends have argued about this. You've read the blog posts. You know the labels. But labels are cheap. This quiz ignores the jargon and asks about the concrete cases where the philosophy actually breaks.

  Answer based on your gut intuition about what a rational person should say or do in the scenario. Don't overthink the "school of thought" you think you belong to; answer the case.

  ***

  ### 1. The Plain Awakening
  It is Sunday night. A fair coin will be flipped.
  *   **Heads:** You are woken on Monday only.
  *   **Tails:** You are woken on Monday, put back to sleep with amnesia, and woken again on Tuesday.
  The rooms are identical. You cannot tell the days apart. You wake up. You know the whole plan.
  **What is your credence (degree of belief) that the coin landed Heads?**
  A) 1/2
  B) 1/3
  C) Something else (specify in your head)

  ### 2. The "It's Monday" Disclosure
  Same setup as Question 1. You wake up. Immediately, the researchers truthfully tell you: "Today is Monday."
  **What is your credence now that the coin landed Heads?**
  A) 1/2
  B) 2/3
  C) 1/3
  D) It stays exactly the same as my answer to Question 1.

  ### 3. The Betting Table
  Same setup as Question 1. Every time you wake up, you are offered a bet.
  *   If the coin was **Heads**, you win $1.
  *   If the coin was **Tails**, you lose $1.
  *   Crucially: Your winnings and losses are summed across all awakenings. (So if Tails, you lose $1 on Monday and $1 on Tuesday, for a total loss of $2).
  **At what odds do you consider this a "fair bet" (zero expected value)?**
  A) Even money ($1 win vs $1 loss).
  B) I need to win $2 for every $1 I risk.
  C) I refuse to bet regardless of odds because the setup is unfair.
  D) I take the bet based on my credence from Question 1, ignoring the double-loss on Tails.

  ### 4. The Duplication Case
  Change the setup slightly. No amnesia.
  *   **Heads:** You are woken on Monday.
  *   **Tails:** You are woken on Monday. Additionally, a perfect physical duplicate of you (with all your Sunday memories) is created elsewhere and woken on Tuesday.
  You never meet the duplicate. You wake up in a room.
  **What is your credence that the coin landed Heads?**
  A) 1/2 (Same as Question 1)
  B) 1/3 (Same as Question 1)
  C) 1/2 (But I answered 1/3 on Question 1)
  D) 1/3 (But I answered 1/2 on Question 1)

  ### 5. The Red Room
  Back to the original amnesia setup (Question 1). But now you are told in advance:
  *   If you are woken on **Monday**, the room is painted **Red**.
  *   If you are woken on **Tuesday**, the room is painted **Blue**.
  You wake up and see that the room is **Red**.
  **What is your credence that the coin landed Heads?**
  A) 1/2
  B) 2/3
  C) 1/3
  D) It is the same number as Question 1, but for a different reason.

  ### 6. The Scale (Amnesia)
  Back to the original amnesia setup. But now:
  *   **Heads:** 1 Awakening.
  *   **Tails:** 100 Awakenings (with amnesia between each).
  You wake up.
  **What is your credence that the coin landed Heads?**
  A) Roughly 1/2 (The coin is still fair).
  B) Roughly 1/101 (I am likely one of the many Tails-wakings).
  C) 1/3 (The specific number doesn't matter, just that Tails > Heads).

  ### 7. The Scale (Duplicates)
  Same as Question 6, but instead of amnesia:
  *   **Heads:** 1 Person (You) is woken.
  *   **Tails:** 100 Different People (exact duplicates of you) are woken in separate rooms.
  You wake up.
  **Does your answer change compared to Question 6?**
  A) No, the math is the same.
  B) Yes, 100 people makes Tails more likely than 100 wakings of one person.
  C) Yes, 100 people makes Tails *less* relevant than 100 wakings of one person.

  ### 8. The Fact of the Matter
  When the interviewer asks, "What is your credence now?", consider the nature of that question.
  **Which statement best fits your view?**
  A) There is one uniquely rational number any fully informed agent must give.
  B) The number depends on what you plan to *do* with the credence (e.g., bet vs. theorize).
  C) The question is ill-posed; "credence" doesn't apply to self-located moments like this.

