  # Scoring Key

  *Do not look below until you have answered.*

  This key does not tell you who is "right." It tells you which philosophical commitments your answers align with. Note that some positions overlap on certain questions; the pattern matters more than any single answer.

  ### Step 1: The Betting Check (Question 3)
  *   **If you chose A or D:** You may be conflating **Credence** with **Decision Theory**. In this specific setup, a rational agent should demand 2:1 odds (Option B) to break even, regardless of whether they believe the coin is 1/2 or 1/3. If you bet at even money because your credence is 1/2, you are ignoring the fact that Tails causes you to bet twice.
      *   *Note:* This does not change your philosophical label, but it suggests you should separate your "belief" from your "betting strategy."
  *   **If you chose B:** You understand the decision-theoretic pressure. Proceed to Step 2.

  ### Step 2: The Core Split (Questions 1 & 2)
  Compare your answers to Q1 and Q2.

  *   **Q1 = 1/3, Q2 = 1/2:**
      *   **Position: The Thirder.**
      *   *Why:* You believe waking up gives you evidence that favors Tails (because Tails produces more wakings). When told it is Monday, you rule out the "Tails-Tuesday" option, which normalizes the probability back to 1/2.
      *   *Check:* You likely chose **1/101** on Question 6 (Scale).

  *   **Q1 = 1/2, Q2 = 2/3:**
      *   **Position: The Standard Halfer.**
      *   *Why:* You believe waking up provides no new information about the coin (you knew you'd wake up). However, when told it is Monday, you treat "It is Monday" as new information that rules out Tails-Tuesday, which shifts the probability toward Heads.
      *   *Check:* You likely chose **1/2** on Question 6 (Scale).

  *   **Q1 = 1/2, Q2 = 1/2 (or "Same as Q1"):**
      *   **Position: The Double Halfer.**
      *   *Why:* You believe waking up provides no new information. Crucially, you *also* believe being told "It is Monday" provides no relevant information about the coin flip itself, because you knew you would be awake on Monday regardless of the coin.
      *   *Check:* This is a distinct view from the Standard Halfer. If you held this view, Question 5 (Red Room) should also leave your credence at 1/2.

  ### Step 3: The Ontology Check (Questions 4, 6, & 7)
  This sorts out *why* you hold the views above.

  *   **If Q4 (Duplication) = 1/3, but Q1 (Amnesia) = 1/2:**
      *   **Position: Actualist / SSA-leaning.**
      *   *Why:* You think mere amnesia (one person waking twice) doesn't change the odds, but creating a *new person* (duplication) does. You count actual observers, not observer-moments.
      *   *Conflict:* This creates tension with Question 1. If duplication changes the odds, why doesn't amnesia?

  *   **If Q6 (100 Wakings) = 1/101 AND Q7 (100 People) = 1/101:**
      *   **Position: SIA-leaning (Self-Indication Assumption).**
      *   *Why:* You believe that hypotheses that predict more observers (or observer-moments) are inherently more likely to be true. You treat "100 wakings of me" and "100 copies of me" as probabilistically equivalent.
      *   *Note:* This almost always aligns with the **Thirder** position on Question 1.

  *   **If Q6 = 1/2 AND Q7 = 1/2:**
      *   **Position: Coin-Fundamentalist.**
      *   *Why:* You believe the coin flip is the only source of probability. The number of wakings or people is a consequence, not a cause, of the probability.
      *   *Note:* This aligns with the **Halfer** or **Double Halfer** positions.

  ### Step 4: The Red Room Puzzle (Question 5)
  *   **If you answered 1/2 here:**
      *   If you were a **Thirder** on Q1 (1/3), you have updated your belief based on the color. (1/3 → 1/2).
      *   If you were a **Double Halfer** on Q1 (1/2), you have *not* updated your belief.
      *   *The Trap:* Thirders and Double Halfers often give the **same number** (1/2) here, but for opposite reasons. One updated up, one stayed still. If you argued with your friend about this, this is likely why: you agreed on the output, but disagreed on the update mechanism.

  *   **If you answered 2/3 here:**
      *   You are likely a **Standard Halfer**. You treat "Red" as ruling out Tails-Tuesday, similar to being told "It's Monday."

  ### Step 5: The Metaphysics (Question 8)
  *   **If you chose A:** You are a **Realist** about credence. You believe there is a fact of the matter about rational belief in this scenario.
  *   **If you chose B:** You are a **Pragmatist**. You believe credence is a tool for action. (This often aligns with people who answer Q3 differently depending on the bet).
  *   **If you chose C:** You are a **Deflationist**. You believe the puzzle arises from asking a question that language can't answer. (This is a valid philosophical escape hatch).

  ### Summary Profiles

  *   **The Classic Thirder:** Q1(1/3), Q2(1/2), Q6(1/101), Q7(1/101). Believes more wakings = more likely.
  *   **The Classic Halfer:** Q1(1/2), Q2(2/3), Q6(1/2), Q7(1/2). Believes waking is no info, but "Monday" is info.
  *   **The Double Halfer:** Q1(1/2), Q2(1/2), Q5(1/2). Believes neither waking nor days provide evidence about the coin.
  *   **The Duplication Splitter:** Q1(1/2), Q4(1/3). Believes creating new people matters, but amnesia does not. (A unstable but common position).
  *   **The Deflationist:** Q8(C). Believes the quiz is clever but the question is broken.

  *If your answers were scattered across these profiles, don't worry. That just means you haven't ironed out your commitments yet. That's what the argument was for.*
