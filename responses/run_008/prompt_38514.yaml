          2.  **Normative Status of Axioms (The Circularity Charge):** Crucial upstream question. If the premises are unjustified, the conclusion fails. With an Econ background, the user can dissect the formal structure better than pure philosophers.
          3.  **Extensions (specifically Moral Uncertainty or Population):** This allows for innovation. Harsanyi + Moral Uncertainty is a very active subfield (MacAskill, etc.). Harsanyi + Population is classic (Ng, Blackorby). Let's pick *Moral Uncertainty* as it feels fresher than population ethics.

