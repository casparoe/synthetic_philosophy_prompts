      *   *Topic (2) Comparability:* This is the classic technical hurdle. However, it's often seen as "solved" by stipulation or calibration methods, or dismissed as metaphysical. It might be too technical for the political philosophy side of the committee unless linked to measurement. *Verdict: Medium Priority.*
      *   *Topic (1) Normative Status of Axioms:* This is foundational. If the axioms are question-begging, the theorem is useless. But this literature is *very* dense (Broome, Otsuka, etc.). Might be hard to say something new. *Verdict: High Priority (but risky).*
      *   *Topic (4) Weights:* This is often dismissed as "just a parameter." Unless linked to contractarianism or veil of ignorance, it's thin. *Verdict: Lower Priority.*
