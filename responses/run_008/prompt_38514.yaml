      *   *Re-evaluating Topic (1) vs (3).* Topic (3) is more "alive" in current political philosophy (luck egalitarianism, prioritarianism). Topic (1) is more foundational decision theory. Given the committee split, (3) is safer. (1) is riskier but higher reward if they crack the circularity charge.

