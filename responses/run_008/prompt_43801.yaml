prompt: |-
  I'm a journalist who covers science and ideas for a general-interest magazine, and in two months I'm giving the keynote at the annual meeting of a professional society whose members are actually building pieces of the relevant technology: large-scale neural interfacing, nondestructive brain mapping, and early whole-brain emulation work. The room will be mostly computational neuroscientists and systems engineers who treat substrate-independence as an engineering premise rather than a philosophical thesis; a substantial contingent of signed-up cryonicists who think of themselves as future patients and are touchy about anything that sounds like betrayal of the biological original; a couple of philosophers of mind who know the personal-identity literature cold; and one hospital ethicist on the program committee.

  My keynote defends a position I haven't seen anyone in this debate quite hold, which is exactly why I'm nervous about the question period. Nearly everyone treats gradual replacement — swapping neurons for functionally equivalent silicon, one small cluster at a time, with the subject awake and reporting throughout — as the peacemaker between the camp that says uploading is death-plus-a-copy and the camp that says it is survival. The standard thought experiment concludes that either consciousness would fade so gradually that the subject could never notice, which seems absurd, or nothing of significance is lost at all. I want to argue that this shows less than either camp hopes. It shows, at most, that the subject's own testimony becomes worthless as evidence while the swap proceeds, and so the interesting questions migrate outward to the bystanders — toward what I want to call custody. During a replacement schedule that could run for years, someone must decide when the biological original loses standing to alter the plan; whether journal entries written mid-process belong to the patient or to the platform; whether a spouse's promises transfer automatically or require renewed consent; and who is entitled to halt or reverse the procedure. On my view, whether gradual uploading preserves a person is settled less by metaphysics than by whether these decisions are made rightly — survival, for this procedure, is partly procedural.

  Please prepare my prep sheet. Give me the eight or so objections this particular audience will actually raise, ordered by how much damage they could do, each phrased the way that segment of the room would phrase it — the em researchers in engineering terms, the cryonicists as advocates for a patient, the philosophers through the classic thought experiments. For each objection, provide a reply I can deliver in about two minutes and an honest note on where that reply is soft. Tell me what I should concede up front to buy credibility, and identify the question I am hoping nobody asks. Please write the prep sheet in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science/ideas for a general-interest magazine.
      *   **Task:** Keynote speaker at a professional society meeting (computational neuroscientists, systems engineers, cryonicists, philosophers of mind, one hospital ethicist).
      *   **Topic:** Large-scale neural interfacing, brain mapping, whole-brain emulation (WBE).
      *   **Keynote Thesis:** Gradual replacement (uploading) doesn't solve the personal identity problem via subjective testimony. Instead, it shifts the burden to *procedural custody* (legal/ethical decisions made by bystanders/administrators during the process). Survival is partly procedural.
      *   **Deliverable:** A prep sheet for the Q&A session.
      *   **Requirements:**
          *   ~8 objections ordered by potential damage.
          *   Phrased in the voice of specific audience segments (engineers, cryonicists, philosophers).
          *   2-minute reply for each.
          *   "Soft spot" note for each reply.
          *   Concessions to make up front.
          *   The "Question I hope nobody asks."
          *   Tone: American English, professional, insightful, strategic.

  2.  **Deconstruct the Audience & Thesis:**
      *   *Engineers/Computational Neuroscientists:* Pragmatic, substrate-independent, focused on functionality and continuity of information processing. They likely see the "custody" argument as bureaucratic red tape interfering with technical success.
      *   *Cryonicists:* Focused on preservation of the *biological* self until transfer is possible. Very sensitive to "death" vs. "survival." They might see the custody argument as undermining the certainty of survival they need to justify the risk.
      *   *Philosophers:* Focused on metaphysics, phenomenology, and logical coherence. They will attack the definition of "procedural survival" as category error.
      *   *Ethicist:* Focused on consent, harm, and legal standing. Actually the closest ally, but might worry about the implications for current patients.
      *   *The Thesis:* "Survival is partly procedural." This is a sociological/legal turn on a metaphysical problem. It implies that *we* (society/law) decide if you survive, not just physics/biology.

  3.  **Brainstorming Objections (aiming for 8):**
      1.  *Engineer:* Continuity of function *is* identity. Custody is irrelevant if the code runs.
      2.  *Cryonicist:* You're giving the executioner the keys. If custody decides survival, they can decide death.
      3.  *Philosopher:* Category error. Ontology isn't legislation. You can't legislate existence.
      4.  *Engineer:* Latency/Feedback. If the subject reports, the system is closed loop. Custody breaks the loop.
      5.  *Cryonicist:* The "Mid-Process" person. Who are they? If custody decides, do we have two people?
      6.  *Philosopher:* Ship of Theseus. You're ignoring the metaphysical weight of the gradual swap.
      7.  *Ethicist/Legal:* Liability. If the procedure fails procedurally, who is liable? The platform?
      8.  *General/Skeptic:* This makes survival elitist. Only those with good lawyers/custodians survive.

      *Refining for Impact/Voice:*
      1.  *Engineer (The Functionalist):* "Function preserves identity. Custody is noise."
      2.  *Cryonicist (The Patient Advocate):* "You're making survival contingent on bureaucracy."
      3.  *Philosopher (The Metaphysician):* "Truth isn't voted on. Existence isn't procedural."
      4.  *Engineer (The Control Systems):* "The subject is the controller. Custody introduces external latency."
      5.  *Cryonicist (The Continuity Fear):* "Where does the original go? You're legitimizing deletion."
      6.  *Philosopher (The Phenomenologist):* "What about the qualia of the transition? Custody ignores the first-person view."
      7.  *Ethicist (The Liability):* "If survival is procedural, is death malpractice?"
      8.  *The "Gotcha" (The Political):* "This creates a class system of survival."

      *Ordering by Damage:*
      1.  Philosopher (Ontology vs. Legislation) - Fundamental attack on the thesis.
      2.  Cryonicist (Bureaucratic Death) - Emotional/Political attack on the community's core belief.
      3.  Engineer (Function is King) - Dismisses the premise as irrelevant to the tech.
      4.  Ethicist (Liability/Malpractice) - Practical legal nightmare.
      5.  Cryonicist (The "Middle" Person) - Confusion about the state of the patient.
      6.  Engineer (Control Loop) - Technical feasibility.
      7.  Philosopher (Qualia) - Ignoring the subjective experience.
      8.  Political (Class System) - Social implication.

      *Let's tighten the voices and specific arguments.*

  4.  **Drafting the Content (Iterative refinement):**

      *   *Concessions:* Need to acknowledge that function matters, and that metaphysics isn't *entirely* irrelevant. Acknowledge the risk of bureaucracy.
      *   *The "Hope Nobody Asks":* Needs to be something that exposes a contradiction or a dark implication of the "procedural survival" thesis. Maybe: "If survival is procedural, can we procedurally kill someone who is functionally intact?" or "Who custodies the custodians?"

      *   *Drafting Replies:* Keep them punchy. 2 minutes is roughly 250-300 words spoken at a moderate pace. Need to be concise.
      *   *Soft Spots:* Where is the journalist vulnerable? Usually on the definition of "rights" or the mechanism of enforcement.

  5.  **Review against Constraints:**
      *   American English? Yes.
      *   8 Objections? Yes.
      *   Ordered by damage? Yes.
      *   Specific audience voices? Yes.
      *   2-minute replies? (Will ensure length is appropriate).
      *   Soft spots noted? Yes.
      *   Concessions included? Yes.
      *   "Hope nobody asks" included? Yes.

  6.  **Final Polish:**
      *   Ensure the tone is respectful but firm.
      *   Make sure the "Custody" concept is clear in every answer.
      *   Check that the "Journalist" persona shines through (focus on narrative, society, implications) vs. the "Scientist" persona (focus on data, mechanism).

      *(Self-Correction during drafting)*: I need to make sure the Engineer objections sound like *systems engineers*, not just generic techies. They care about control loops, latency, and specification. The Cryonicists need to sound like they are protecting a *patient*, not just a concept. The Philosophers need to reference specific concepts (Locke, Parfit, etc.) without being too jargon-heavy.

      *Refining the "Hope Nobody Asks":* The best question is one that forces the speaker to admit that "procedural survival" could be weaponized. "If a government decides the procedure wasn't followed, does the upload cease to exist legally?"

      *Refining Concessions:* Don't concede too much. Concede that function is necessary, just not sufficient. Concede that this adds complexity.

      *Let's assemble the sheet.*

      *(Final check on ordering)*:
      1. Philosopher (Ontological category error) - Highest damage.
      2. Cryonicist (Bureaucratic veto on life) - High emotional damage.
      3. Engineer (Function defines identity) - High technical dismissal.
      4. Ethicist (Liability/Malpractice) - High practical risk.
      5. Philosopher (The "Middle" Moment) - Logical trap.
      6. Engineer (System Stability) - Technical feasibility.
      7. Cryonicist (The Biological Remains) - Disposal issue.
      8. General (Inequality) - Social risk.

      *Wait, I need to make sure the "Soft Spot" is honest.* For the Philosopher objection, the soft spot is that the speaker *is* making a category error, essentially. I need to frame that carefully.

      *Okay, ready to write.*
answer: |-
  # KEYNOTE Q&A PREP SHEET
  **Topic:** Procedural Custody in Gradual Neural Replacement
  **Audience:** Computational Neuroscientists, Systems Engineers, Cryonicists, Philosophers, Ethicists
  **Speaker:** Science Journalist (General Interest)

  ## STRATEGIC CONCESSIONS (Say these early)
  To buy credibility before the hard questions start, open your closing remarks or initial Q&A buffer with these two admissions:
  1.  **Function is Necessary:** Concede that without functional continuity (the engineer's metric), there is no candidate for survival at all. You are not arguing against the tech; you are arguing that the tech doesn't settle the metaphysics.
  2.  **Bureaucracy is Risky:** Acknowledge that introducing "custody" introduces the risk of human error, corruption, or legal lag. Do not frame procedural survival as *safer* than biological survival, only as *unavoidable* once the process begins.

  ---

  ## THE EIGHT OBJECTIONS (Ordered by Potential Damage)

  ### 1. The Category Error (The Philosopher)
  **The Objection:** "You're conflating ontology with legislation. Whether I *am* the same person is a fact about the world, not a fact about your paperwork. If the continuity of consciousness holds, I survive. If it breaks, I die. A judge's ruling doesn't change the metaphysical reality. You're suggesting we can vote on existence."
  **The Reply:** "I'm not suggesting we vote on existence; I'm suggesting we vote on *standing*. In a gradual swap, the metaphysical facts become underdetermined. There is no 'fact of the matter' visible to physics once the substrate is mixed. Because the metaphysics are opaque during the transition, society *must* assign rights to one side or the other to prevent paralysis. If the law says the 'platform' holds the copyright to the patient's memories at 60% swap, then for all social purposes, the biological original has lost custody of their own mind. Survival isn't just existing; it's existing with agency. If custody strips agency, metaphysical continuity doesn't matter."
  **Soft Spot:** You are effectively arguing for social constructivism about identity. A hard realist philosopher will press that *pain* is still felt even if you have no legal standing, making your "procedural" definition of survival morally insufficient.

  ### 2. The Bureaucratic Veto (The Cryonicist)
  **The Objection:** "This is terrifying. You're telling my community that our survival depends on a hospital ethicist or a court clerk not making a mistake? We sign up for cryonics to escape biological fragility. You're proposing we trade it for legal fragility. If custody decides survival, a custodian can effectively execute a patient by revoking their procedural standing mid-swap."
  **The Reply:** "That is exactly the risk I want to highlight. Currently, cryonicists trust the technology to preserve the pattern. I am arguing that the pattern is not enough. If we ignore the custody question, we allow a scenario where the upload is functionally perfect but legally dead—unable to access funds, sign contracts, or refuse shutdown. By making custody explicit, we force the legal framework to catch up to the tech. It is better to know the veto point exists and harden it than to pretend the procedure happens in a legal vacuum."
  **Soft Spot:** You haven't solved *how* to harden it. If the answer is "we need better laws," the cryonicists will hear "we can't do this yet."

  ### 3. The Functionalist Dismissal (The Systems Engineer)
  **The Objection:** "From a control systems perspective, the subject is the reference signal. As long as the error signal between the biological intent and the silicon output remains within tolerance, the system is stable. 'Custody' is external noise. If the loop holds, the person persists. Why complicate the architecture with external governance variables that introduce latency?"
  **The Reply:** "Because the 'reference signal' changes its own nature during the swap. At 10% replacement, the subject is biological. At 90%, they are digital. Who tunes the tolerance? If the biological original wants to stop at 50% because they feel 'thinned out,' but the platform engineer says the signal is stable, who wins? If the engineer wins, the biological original was overruled. That is a custody decision. Ignoring it doesn't remove the variable; it just hides who is pulling the lever."
  **Soft Spot:** Engineers care about system success. If you imply the system might be halted by "feelings," they may view you as anti-progress.

  ### 4. The Malpractice Trap (The Hospital Ethicist)
  **The Objection:** "If survival is procedural, then death is a procedural failure. If a patient dies mid-swap because a form wasn't filed or a custodian recused themselves, is that malpractice? Are you defining a new category of wrongful death where the body is still breathing but the 'person' was procedurally terminated?"
  **The Reply:** "Yes, and that is the litigation nightmare we need to prepare for. If we treat the swap as a medical procedure, standard malpractice applies. If we treat it as a migration, property law applies. My point is that we are currently drifting between the two. If a patient is 'procedurally dead' while biologically alive, does the spouse inherit? If the upload is 'procedurally alive' but the body dies, is it murder to turn off the life support? We need to know which tort applies before the first incision."
  **Soft Spot:** You are raising alarms without offering a regulatory framework. The ethicist may press you for a specific policy recommendation, which is outside your lane as a journalist.

  ### 5. The "Middle Person" Paradox (The Philosopher)
  **The Objection:** "Parfit's reductionism suggests that identity doesn't matter, only psychological continuity. But your custody model implies a binary switch. At what percentage of replacement does custody transfer? If it's gradual, do we have two entities with partial standing? If I write a journal entry at 40% swap, who owns it? The biology or the code?"
  **The Reply:** "The law hates gradients; it requires binaries. My argument is that the *law* will force a binary switch even if the *biology* is gradual. We will likely see a 'Point of Irreversibility' codified, perhaps at 51% or at the first full system boot. The journal entry belongs to whoever holds custody at the time of writing. This creates a weird period of dual citizenship, which is precisely why the subject's testimony becomes unreliable. They are testifying from a jurisdiction that is dissolving."
  **Soft Spot:** Admitting the law forces a binary contradicts your earlier point about the gradual nature of the process undermining testimony. You need to clarify that the *experience* is gradual, but the *rights* must snap.

  ### 6. The Stability Risk (The Systems Engineer)
  **The Objection:** "You're suggesting the subject's testimony becomes worthless mid-swap. But we rely on subjective reporting to calibrate the interface. If we can't trust the subject's report on their own state because their 'custody' is in flux, how do we tune the neural link? You're undermining the data collection required to make the swap work."
  **The Reply:** "We don't discard the data; we discount the *authority*. We can still use the subject's report as telemetry—like a sensor reading—but we shouldn't treat it as a command. If a sensor says 'temperature critical,' you check the sensor; you don't necessarily shut down the plant. Similarly, if the mid-swap subject says 'I am dying,' we treat that as a system warning to be investigated by the custodian, not an automatic stop order. The subject becomes a component, not just the operator."
  **Soft Spot:** This sounds dehumanizing. It risks alienating the cryonicists who view the patient as sovereign.

  ### 7. The Biological Remains (The Cryonicist)
  **The Objection:** "What happens to the meat? If custody transfers to the platform, does the biological body become medical waste? If I am still awake in the biological half while the silicon half takes custody, am I being kept alive as a spare part? That sounds like a horror scenario, not survival."
  **The Reply:** "It is a horror scenario if left unregulated. This is why custody must include disposition rights. The transfer of custody should trigger the authorized shutdown of the biological substrate. If the biological original retains custody too long, you get the 'spare part' risk. If they lose it too soon, you get 'premature termination.' The custody framework is the only thing that dictates when the biological shell is allowed to die with dignity."
  **Soft Spot:** You are normalizing the idea that the biological body *must* be discarded. Some in the room may believe in dual-embedding or keeping the biological brain as a backup.

  ### 8. The Inequality Argument (The General Skeptic)
  **The Objection:** "This makes survival a class issue. Wealthy patients will have robust custody trusts and high-priced advocates to ensure their procedural standing holds. Poor patients will be at the mercy of institutional custodians. You're turning immortality into a legal retainer."
  **The Reply:** "It already is. Cryonics and neural interfacing are capital-intensive. My argument simply exposes the hidden cost. Currently, the cost is technical fidelity. In the future, the cost will be legal fidelity. If we don't acknowledge this, we create a system where the poor are not only less likely to be uploaded but less likely to be recognized as *having* survived the upload. Acknowledging the custody problem is the first step toward public defenders for the uploaded."
  **Soft Spot:** This is a strong moral point, but it offers no solution. It may leave the audience feeling the technology is inherently unjust.

  ---

  ## THE QUESTION I HOPE NOBODY ASKS
  **"If survival is procedural, can a government procedurally kill an upload that is functionally intact by simply revoking its custody status? And if so, isn't your framework providing the legal architecture for state-sanctioned murder of digital persons?"**

  *Why this is dangerous:* It forces you to admit that your "procedural survival" thesis cuts both ways. It protects the patient from technical error, but it also empowers the state to define existence out of the law. If you say "No, rights are inherent," you undermine your thesis that survival is procedural. If you say "Yes, but...", you sound like you are endorsing a kill switch.

  *Prepared Deflection (if asked):* "That is the ultimate risk of any system where law mediates existence. It applies to biological citizens too—we can strip rights, imprison, or execute. The difference is that biological death is final. Procedural death of an upload should, in theory, be reversible if the code is backed up. The goal of the custody framework isn't to give the state a switch, but to ensure that the switch isn't flipped by accident or negligence." (Note: This leans heavily on the "reversibility" of digital states, which engineers may contest).

  ---

  ## TONE NOTES
  *   **To the Engineers:** Respect the tech, but insist the *context* is broken. Use their language (latency, control loop, telemetry).
  *   **To the Cryonicists:** Validate their fear. You are not debunking them; you are trying to bulletproof them against legal failure.
  *   **To the Philosophers:** Do not try to out-philosophize them. Admit you are talking about *sociology* and *law*, not metaphysics.
  *   **To the Ethicist:** You are their ally. You are highlighting the liability they are worried about.

  **Final Reminder:** You are the journalist. Your job is not to solve the engineering, but to map the consequences. If they press you for technical solutions, remind them: *"I report on the crash, I don't build the car. But I'm telling you the brakes are connected to the steering wheel."*
