  # JOINT STATEMENT ON THE PASADENA GAME AND DECISION THEORY

  **Parties:** Camp A (Expected Utility Preservationists) & Camp B (Decision Theory Pluralists)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Conditionally Convergent Gambles

  ## 1. AGREED CLAIMS

  1.  **The Game Definition:** The "Pasadena Game" is well-defined. A fair coin is flipped until it lands Heads on trial $n$. The payoff is $x_n = \frac{(-1)^{n+1} 2^n}{n}$ dollars. The probability of trial $n$ is $p_n = 1/2^n$.
  2.  **The Mathematical Series:** The probability-weighted payoffs form the series $\sum_{n=1}^{\infty} p_n x_n = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$. This series converges to $\ln(2)$ in its natural order but is not absolutely convergent. By the Riemann Rearrangement Theorem, the terms can be reordered to sum to any real number or diverge.
  3.  **Standard Theory Limitations:** Standard von Neumann-Morgenstern Expected Utility Theory (EUT) does not assign a unique value to this game. The axioms guarantee an expectation only when the sum is absolutely convergent or the utility is bounded. The Pasadena Game satisfies neither condition without modification.
  4.  **Decision Theory Obligations:** A complete decision theory must either (i) assign a determinate preference ranking between the Pasadena Game and a fixed sum of money, or (ii) formally declare that no such ranking is required by rationality. It must not yield contradictory rankings based solely on arbitrary relabeling of states.
  5.  **Finite Truncations:** If the game is truncated at $N$ flips (payoff is 0 if Heads does not appear by $N$), the expected value is well-defined, unique, and equals the $N$-th partial sum of the alternating harmonic series.

  ## 2. DISAGREEMENTS TABLE

  | Topic | Camp A Position (EUT Preservationists) | Camp B Position (Decision Theory Pluralists) |
  | :--- | :--- | :--- |
  | **Existence of Value** | The game possesses a single rational value ($\ln 2$). The rearrangement problem is an artifact of improper calculation, not a feature of the gamble. | The game possesses no single rational value. The rearrangement problem reveals that scalar expectation is undefined for this class of gambles. |
  | **Role of Expectation** | Expectation is the fundamental primitive for rational choice. Pathological cases require constraints on admissible probability/utility functions, not abandonment of expectation. | Expectation is a derived tool useful only for well-behaved cases. Rational choice is fundamentally about dominance and pairwise comparison, not scalar summation. |
  | **State Description** | Rational value must be invariant under redescriptions of the state space that preserve probability-payoff pairs. Order of summation must be fixed by the state structure. | Rational preference must be invariant under redescriptions. Since expectation values change with summation order, expectation cannot be the basis of the preference. |
  | **Rational Requirement** | A rational agent is *required* to treat the game as equivalent to receiving $\ln 2$ dollars. Refusing to trade at this price is an error. | A rational agent is *permitted* to refuse to price the game. Treating it as equivalent to $\ln 2$ dollars is not mandated and may be incoherent. |

  ## 3. CRUXES AND TEST CASES

  We identify three specific points of divergence where empirical or logical outcomes would force a concession from one side.

  ### Crux 1: The Limit of Truncations
  **The Case:** Consider a sequence of truncated Pasadena games, $G_N$, where the game is void if Heads does not appear by flip $N$. Let $V(G_N)$ be the rational buying price for game $G_N$. Mathematically, $\lim_{N \to \infty} V(G_N) = \ln 2$.
  **The Question:** Does the rational value of the infinite game, $V(G_\infty)$, equal the limit of the rational values of the finite games?

  *   **Camp A Prediction:** Yes. $V(G_\infty) = \lim_{N \to \infty} V(G_N) = \ln 2$. Continuity of preference is a requirement of rationality. If the finite versions converge to a price, the infinite version must adopt it.
  *   **Camp B Prediction:** No. $V(G_\infty)$ is undefined. The limit of the values exists, but the value of the limit does not. Rationality does not require continuity for unbounded, conditionally convergent series.
  *   **The Stake:**
      *   If Camp A concedes that $V(G_\infty)$ can remain undefined despite the stable limit of $G_N$, they admit that expectation is not the fundamental primitive (concession to Camp B).
      *   If Camp B concedes that $V(G_\infty) = \ln 2$, they admit that a unique scalar value exists for the infinite game, validating the core EUT approach (concession to Camp A).

  ### Crux 2: The Rearrangement Dutch Book
  **The Case:** An agent is offered the Pasadena Game ($P$). A bookie offers to swap $P$ for a rearranged version ($P'$), where the probability-payoff pairs are identical but mapped to different state descriptions (effectively changing the summation order). $P'$ is constructed to have an expectation of $10$ if summed in its "natural" order.
  **The Question:** Can a rational agent be Dutch Booked (guaranteed loss) if they assign $V(P) = \ln 2$ and $V(P') = 10$?

  *   **Camp A Prediction:** Yes. Since $P$ and $P'$ are the same gamble (same probabilities attached to same payoffs), assigning them different values violates the axiom of Extensionality. An agent who prices them differently can be pumped for money. Therefore, a rule must fix the summation order to prevent this.
  *   **Camp B Prediction:** No. A static Dutch Book requires a finite set of bets that guarantees a loss in every state. Because the Pasadena payoffs are unbounded and conditionally convergent, no *finite* combination of trades guarantees a loss across all possible outcomes. The "loss" only appears in the limit of the expectation calculation, not in actual cash flow.
  *   **The Stake:**
      *   If Camp A cannot construct a finite Dutch Book against an agent who refuses to price $P$, their claim that pricing is *required* for coherence is weakened.
      *   If Camp B admits that an agent who prices $P$ and $P'$ differently is vulnerable to exploitation (even in the limit), they must accept a constraint that functions like Camp A's "summation rule."

  ### Crux 3: The Small Improvement Argument
  **The Case:** Compare the Pasadena Game ($P$) to a modified game ($P^+$) which pays exactly $0.01$ more in every single possible outcome state.
  **The Question:** Does decision theory *require* preferring $P^+$ over $P$?

  *   **Camp A Prediction:** Yes. If $V(P) = \ln 2$, then $V(P^+) = \ln 2 + 0.01$. Linearity of expectation mandates the preference.
  *   **Camp B Prediction:** Yes, but for a different reason. Dominance dictates $P^+ \succ P$, regardless of whether $V(P)$ exists. However, Camp B denies that this implies $V(P)$ exists.
  *   **The Stake:** This is a diagnostic crux.
      *   Camp A argues that the ability to rank $P^+$ vs $P$ implies a underlying scalar metric exists (otherwise, how do you quantify the difference?).
      *   Camp B argues that ranking is primitive and does not imply a metric.
      *   **Test:** If Camp A can show that *any* consistent ranking of $P$ against all constant sums implies a unique real number, Camp B must accept that a value exists. If Camp B can show a consistent ranking system that satisfies dominance but maps $P$ to *no* real number (e.g., an interval or partial order), Camp A must accept that scalar expectation is not necessary.

  ## 4. VERBAL DISPUTE ANALYSIS

  We acknowledge that a portion of our disagreement is terminological regarding the phrase **"The Expected Value Exists."**

  *   **Camp A Usage:** When Camp A says "The expected value exists," they mean "There is a unique rational price at which a risk-neutral agent should be indifferent between the gamble and cash." They view the mathematical conditional convergence as a technical hurdle to be regulated by a "natural order" convention.
  *   **Camp B Usage:** When Camp B says "The expected value does not exist," they mean "The mathematical sum is not invariant under state-description changes, therefore it cannot serve as the unique rational price." They view the lack of absolute convergence as a fundamental barrier, not a technical hurdle.

  **Resolution:** We agree to distinguish between **Mathematical Expectation** (the sum of the series) and **Rational Valuation** (the price mandated by decision theory).
  *   Both agree the *Mathematical Expectation* is ill-defined without an ordering convention.
  *   Camp A claims *Rational Valuation* can fix the ordering convention.
  *   Camp B claims *Rational Valuation* must proceed without fixing the ordering convention (i.e., without a scalar).

  **Remaining Substantive Dispute:** Even after clarifying terms, the dispute remains substantive on **Crux 1**. It is not merely verbal whether the rational valuation of the infinite game must equal the limit of the rational valuations of the finite truncations. This is a disagreement about the continuity of rational preference, not the definition of words.
