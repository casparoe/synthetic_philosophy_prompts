      *   *Major Conflict:* The "Crop Death" vs. "Slaughter" comparison. If we count insect deaths, plant agriculture might look worse than humane meat. But if we weight by sentience/capacity, mammals matter more. A theory needs a metric for *comparative moral weight* across species. If the theory demands a single metric but nature provides incommensurable values, it breaks.
