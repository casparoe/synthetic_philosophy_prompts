  8.  **Review and Refine:**
      *   *Tone Check:* Is it academic? Yes.
      *   *Structure:* Follow the prompt's order (Desiderata -> Non-negotiable/Prejudice -> Incompatibilities -> Candidate Evaluation -> Killer Requirement).
      *   *Specific Prompt Constraint:* "Mark which requirements are non-negotiable and which are prejudices... is demanding a determinate verdict... a genuine desideratum?"
      *   *Specific Prompt Constraint:* "Flag any pair of requirements you suspect cannot be jointly satisfied."
      *   *Specific Prompt Constraint:* "Briefly... say how three rough candidates do against the list."
      *   *Specific Prompt Constraint:* "Which single requirement does the most work..."

      *(Self-Correction during drafting)*: Make sure to explicitly address the "Beef vs. Chicken" empirical uncertainty. The prompt asks if demanding a verdict is a prejudice. I should argue it *is* a prejudice because a robust theory might conclude "Context Dependent."

      *(Refining the Incompatibility)*: The tension between "Minimize Death" and "Maximize Welfare" is classic. But a more specific one for this context is: *Requirement to count wild animal deaths in crop fields* vs. *Requirement to prioritize intentional killing.* If intentional killing is worse, meat might be worse. If only outcomes matter, crop deaths might make plants worse. A theory needs to resolve this weighting. I will frame this as the tension between *Agency/Intention* and *Outcome/Consequence*.

      *(Refining the Candidates)*:
      1.  *Deontological Constraint (Right to Life):* Focus on intentional killing.
      2.  *Classical Utilitarianism (Suffering Focus):* Focus on net pain/pleasure.
      3.  *Total Utilitarianism (Existence Focus):* Focus on sum of welfare including existence.

      *(Final Polish)*: Ensure the distinction between "per kilo" and "per animal" is clear in the desiderata, as the prompt highlights the "one bird vs. fraction of a cow" issue.

