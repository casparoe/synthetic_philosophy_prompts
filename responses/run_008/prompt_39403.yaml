          *   *Rank 3 (The Pivot):* Teleosemantics for AI/Neural Networks. (High market relevance, conceptually murky).
          *   *Rank 4 (Prestige/Puzzle):* Normativity of Content. (Deep, but likely too abstract for a 3-year timeline + job market).
      *   **Tractability Analysis:**
          *   Pure metaphysics of content = Hard to publish, niche audience.
