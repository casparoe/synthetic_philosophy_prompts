      *   **Explain the "Kernel of Truth" vs. "Historical Person":** A story can be based on real events without a specific central hero. Troy had wars; that doesn't mean Achilles existed. Arthur might represent a composite of leaders, not one man.
      *   **Conclusion:** The burden of proof hasn't flipped. The difference is evidentiary density and contemporaneity.

  4.  **Drafting the Response (Iterative refinement):**

