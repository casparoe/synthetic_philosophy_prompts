      *   *Exodus:* Does archaeology "keep confirming" it? Mainstream archaeology says the opposite. There is no evidence for a mass migration of 2 million people, 40 years in the desert, or a conquest of Canaan as described. Some *elements* might have kernels (Shasu, small groups), but the narrative as a whole is not confirmed.
      *   *King Arthur:* Is there a "Geoffrey of Monmouth needs his own Schliemann" scenario? Geoffrey wrote in the 12th century, centuries after the supposed events (5th/6th century). He is considered a literary fabricator by historians. There is no contemporary evidence for Arthur.
      *   *Burden of Proof:* In history/archaeology, the burden of proof *always* rests on the positive claim ("X existed/did Y"). You don't treat figures as real until proven fake; you treat them as unattested until evidence appears.

