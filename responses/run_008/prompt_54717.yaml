answer: |-
  This is a fantastic question that cuts to the heart of how historians and archaeologists actually work versus how we often *think* they work. Your intuition—that there is a pattern of "myth becoming history"—is a very common one, but the reality is a bit more nuanced.

  To answer your specific question: **The burden of proof never flips to the skeptics in historical methodology.** In history, the default position is always that a specific claim (e.g., "A man named Arthur united Britain") is unproven until evidence demonstrates it.

  Here is the principled difference between Agamemnon, the Exodus, and Arthur, and why the "domino theory" of myth-vindication is riskier than it looks.

  ### 1. Correcting the Premises: Are the other dominos actually falling?

  Your argument relies on the premise that Troy and the Exodus are "settled" or "confirmed." Most specialists would push back hard on that, which weakens the pattern you're seeing.

  *   **Troy (The Iliad):** Your tour guide oversimplified. Heinrich Schliemann did find the city of Troy (Hisarlik). We know it was destroyed by war around the right time (Late Bronze Age). We also know the Mycenaean Greeks (Ahhiyawa) and the Hittites (who called Troy *Wilusa*) interacted militarily. **However,** there is zero evidence that a man named Agamemnon existed, that he was a "King of Kings," or that he fought a war over a woman named Helen. The *setting* is historical; the *plot and characters* remain myth. We have vindicated the *world* of the Iliad, not the *story*.
  *   **The Exodus:** Your brother-in-law is relying on outdated or fringe apologetics. The consensus among archaeologists and Egyptologists is that there is **no evidence** for the Exodus as described in the Bible. There is no evidence of 2 million Israelites in Egypt, no evidence of a 40-year wanderings in the Sinai (which was heavily monitored by Egypt at the time), and the conquest of Canaan described in Joshua contradicts the archaeological record of those cities (many didn't exist or weren't destroyed at that time). Like Troy, there may be a "kernel" (a small group of Semitic slaves escaping), but the narrative as a national founding myth is not historically confirmed.

  So, the pattern isn't "Myths are proven true." The pattern is "Myths often contain geographical or political memories of real eras." That is a very different bar to clear.

  ### 2. The Burden of Proof in History

  In a court of law, we presume innocence because it is morally better to let a guilty person go free than punish an innocent one. In history, we presume **non-existence** (or at least, non-attestation) because human beings are prolific inventors of fiction.

  For every legendary figure who turned out to have a historical kernel (like King Gilgamesh), there are dozens who did not (like King Lucius of Britain or Pope Joan).

  If we treated every legendary figure as "real until proven otherwise," our history books would be filled with dragons, gods, and wizards, because the texts that mention them often claim they are real. The burden stays on the claimant because **positive evidence is required to add a person to the historical record, not to remove them.** Time passing does not generate evidence; if anything, it degrades it.

  ### 3. The Principled Difference: Arthur vs. Agamemnon

  Even if we accept that Agamemnon and Arthur are both "legendary kings," the evidentiary situations are fundamentally different.

  **A. Contemporaneity (The Paper Trail)**
  *   **Agamemnon:** We have written records from the exact era he supposedly lived (Late Bronze Age, c. 1200 BCE). The Linear B tablets found at Mycenae and Pylos describe a palace bureaucracy that matches Homer's description of the *wanax* (king) and his retinue. We have Hittite texts mentioning conflicts with the Ahhiyawa over Wilusa. We know the *system* existed.
  *   **Arthur:** Arthur supposedly lived in the 5th or 6th century CE (Post-Roman Britain). This is not the Dark Ages in the sense of "no writing." We have contemporary or near-contemporary texts (Gildas, *De Excidio et Conquestu Britanniae*, written c. 540 CE). Gildas describes the Battle of Badon and a leader named Ambrosius Aurelianus. **He does not mention Arthur.** The first explicit mention of Arthur doesn't appear until the *Historia Brittonum* in the 9th century—300 years later. Geoffrey of Monmouth (who you mentioned, though his name was Geoffrey of **Monmouth**) wrote in the 12th century, 600+ years after the fact, and is considered by historians to be a creative writer, not a chronicler.

  **B. The "Composite" Probability**
  *   **Agamemnon:** While we don't have a stele saying "Agamemnon was here," the name *Agamemnon* appears in the Linear B tablets (as *A-ka-mem-no*). It was a real name used by real people in that culture at that time.
  *   **Arthur:** The name "Arthur" is etymologically tricky. It might come from the Roman family name *Artorius*, or the Welsh *arth* (bear). Many historians suspect "Arthur" is not a person but a **title** or a **composite**. In the 6th century, there were several documented British kings who fought the Saxons (Owain Danwyn, Urien Rheged, Ambrosius). It is highly probable that the deeds of five different men were merged into one super-hero over three centuries of oral tradition.

  **C. The Nature of the Sources**
  *   **Homer:** The *Iliad* is poetry, but it preserves archaic language and material culture (like the boar's tusk helmet) that date back to the Bronze Age, suggesting an oral tradition stretching back to the actual events.
  *   **Geoffrey:** Geoffrey of Monmouth's *History of the Kings of Britain* is filled with demonstrable falsehoods. He invents kings, gets timelines wrong, and includes magic. He is not preserving an oral tradition; he is constructing a national origin myth to rival the Normans. Treating Geoffrey like Homer is like treating a Marvel Comic like a primary source for WWII.

  ### 4. Why the "Smart Money" is still on Skepticism

  You asked if the smart money says they are all real history with decoration. Actually, the smart money says: **Stories are real; characters are often fictional.**

  Humans process history through narrative. We need a villain, a hero, and a cause.
  *   **Troy:** There was a war, but it was likely over trade routes, not Helen. "Achilles" is likely a mythologized representation of warrior prowess.
  *   **Exodus:** There was likely a small group of escaped slaves who joined the highland tribes, but "Moses" as the singular leader is a theological construct.
  *   **Arthur:** There was likely a resistance movement against the Saxons that won a major victory at Badon Hill. But attributing it to one man named Arthur is likely a later simplification.

  ### Summary

  The burden of proof hasn't flipped for Arthur because the **quality of evidence** hasn't improved, only the **desire** for it to be true has.

  The principled difference between Agamemnon and Arthur is **corroborative context.** Agamemnon fits into a dense web of contemporary archaeological and textual evidence that confirms the *culture, politics, and names* of his time. Arthur appears in a historical vacuum, absent from the records of the people who lived through the events he supposedly dominated, only to emerge centuries later in texts known for fabrication.

  Until we find a 6th-century inscription saying *"Here lies Artorius, Victor of Badon,"* Arthur remains a literary figure who may represent historical events, but not necessarily a historical person. And in history, the distinction between the two is everything.
