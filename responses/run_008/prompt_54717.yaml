          *   Exodus: This is crucial. Most archaeologists reject the literal Exodus. It's not a confirmed domino.
          *   *Takeaway:* The premise that "myths keep getting vindicated" is statistically weak based on current scholarship.
      *   *Point 2: Burden of Proof in History.*
          *   Science/History doesn't work by "innocent until proven guilty." It works by "extraordinary claims require extraordinary evidence."
          *   We don't assume existence; we assume non-existence until evidence appears.
      *   *Point 3: Arthur vs. Agamemnon (The Principled Difference).*
          *   *Contemporaneity:* Agamemnon (Late Bronze Age) has Linear B, Hittite texts. Arthur (Post-Roman) has... silence. Gildas doesn't name him.
          *   *Source Criticality:* Homer is old, but Geoffrey of Monmouth is a known fabulist writing 600+ years later.
          *   *Geopolitics:* We know the Hittites and Mycenaeans interacted. We know the Saxons invaded Britain, but the "British King" narrative is murkier.
      *   *Point 4: The "Composite" Theory.*
