  9.  **Final Polish:** Ensure the distinction between "cyclical time" and "recurrent patterns" is clear. Spengler believes in *morphological* inevitability, not just repeating events. Toynbee believes in *moral* challenges. Polybius believes in *mechanical* political decay.

  *(Self-Correction on Toynbee)*: Make sure not to paint Toynbee as *too* optimistic. He thinks breakdown is common, just not *inevitable* by clockwork. The distinction is "determinism" vs. "probability based on human action."

