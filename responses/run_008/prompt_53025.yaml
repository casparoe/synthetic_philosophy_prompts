      *   *Premise 1:* Special Relativity (SR) is true.
      *   *Premise 2:* Relativity of Simultaneity (RoS) means "now" is frame-dependent.
      *   *Premise 3:* If event $E$ is "real" for observer $A$, and $A$ and $B$ are simultaneous, then $E$ is "real" for $B$. (Transitivity of reality).
