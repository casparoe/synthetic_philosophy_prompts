      *   Is it metaphysical/semantic? Yes. It hinges on the ontology of the mathematical formalism.
      *   *Key Insight:* The physicist treats the manifold as *ontologically exhaustive* (the map is the territory). The philosopher treats the manifold as a *tool for coordination* (the map is not the territory).

  4.  **Evaluate the "Hidden Physical Question" (Lorentz Violation/QG):**
      *   If Lorentz invariance is broken (e.g., Hořava–Lifshitz gravity, CMB rest frame as preferred), does that save Presentism?
      *   *Analysis:* It might provide a *privileged* foliation, but does it restore *ontological privilege* to the "now"? Not necessarily. It just makes one slice physically distinct, not necessarily the *only* real one.
