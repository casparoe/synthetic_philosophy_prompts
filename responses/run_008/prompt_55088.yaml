answer: |-
  ### The "Cooperative Fairness" Algorithm

  Here is a decision procedure designed for your exchange students. It is built on the **Principle of Cooperative Fairness**: *When you enter a community, you become a temporary participant in its social contract. You are obligated to follow conventions that prevent harm, ensure fairness to vulnerable parties, or maintain necessary coordination. You are not obligated to follow conventions that are hypocritical, purely symbolic, or where the "social contract" has already been broken by the locals themselves.*

  This is designed to be run in about 60 seconds. Below, I have annotated each step for you (the host) to understand the philosophical weight, followed by the student-facing version.

  #### Step 1: The Harm & Liability Filter
  *   **The Question:** "If I ignore this convention, is there a significant risk of physical harm to myself/others, or severe legal trouble that would burden my hosts?"
  *   **Follow the Convention If:** **Yes.** (e.g., Driving on the correct side of the road, age-restricted purchases).
  *   **Free to Ignore If:** **No.** (e.g., Walking on a specific side of the sidewalk where no traffic exists).
  *   **Fact vs. Value:** This is mostly **Fact**. It relies on risk assessment and local statutes.
  *   **Host Note:** This is your safety net. It prioritizes physical safety and prevents the student from getting you in trouble with the administration.

  #### Step 2: The Dependency Filter
  *   **The Question:** "Does someone rely on me following this norm for their livelihood or fair treatment, even if I don't value the norm myself?"
  *   **Follow the Convention If:** **Yes.** (e.g., Tipping waitstaff in the US, where wages are subsidized by tips).
  *   **Free to Ignore If:** **No.** (e.g., Greeting rituals, gift-giving customs that are purely symbolic).
  *   **Fact vs. Value:** This is **Fact** regarding economic structure, but **Value** regarding your willingness to support that structure.
  *   **Host Note:** This addresses the "tipping" question. It moves the issue from "politeness" to "economic fairness."

  #### Step 3: The Consensus Filter
  *   **The Question:** "Is this convention actually being practiced by the locals around me right now, or is it just a rule they enforce on outsiders?"
  *   **Follow the Convention If:** **Locals are following it.** (It is a live coordination norm).
  *   **Free to Ignore If:** **Locals are universally ignoring it.** (The norm has collapsed; following it makes you an outlier without social benefit).
  *   **Fact vs. Value:** This is **Fact** (observation of behavior).
  *   **Host Note:** This is the controversial step. It allows students to ignore "paper rules" that no one follows, which can be risky for a school program to endorse.

  ***

  ### Worked Cases

  Here is how the algorithm applies to the three specific scenarios you mentioned.

  #### Case 1: Tipping at a Restaurant
  *   **Context:** Student is from a country where tipping is insulting. They are in the US.
  *   **Step 1 (Harm):** No physical harm, but potential legal/contractual issue with the restaurant? Minimal.
  *   **Step 2 (Dependency):** **Yes.** In the US, server wages are structurally below minimum wage, contingent on tips. Not tipping directly reduces their income in a way the server cannot recoup.
  *   **Step 3 (Consensus):** Locals tip.
  *   **Verdict:** **You must tip.**
  *   **Reasoning:** This is not about "culture"; it is about economic fairness. To refuse is to free-ride on a system the worker is trapped in. Your personal cultural value (tipping is insulting) is overridden by the local fact of economic dependency.
  *   **Host Alignment:** You will like this. It ensures students don't offend hosts or workers.

  #### Case 2: The Queue (Line) Cutters
  *   **Context:** Locals are cutting the line, but generally expect others to respect the queue (i.e., they cut, but get angry if you cut).
  *   **Step 1 (Harm):** No physical harm.
  *   **Step 2 (Dependency):** Weak. People expect fairness, but no specific individual is economically dependent on you waiting.
  *   **Step 3 (Consensus):** **Failed.** The prompt states locals are cutting. If the norm is "everyone waits," but locals are cutting, the norm is broken. However, they *expect* you to wait. This is a "Sucker's Game."
  *   **Verdict:** **You are free to assert your place, but not required to cut.**
  *   **Reasoning:** The algorithm identifies this as a corrupted norm. You are not morally bound to be the "sucker" in a fairness violation initiated by locals. However, since Step 1 (Harm/Conflict) is low, you *can* choose to wait for the sake of peace, but you are not *obligated* by fairness to do so.
  *   **Host Alignment:** You might find this ambiguous. It empowers the student to push back, which could cause friction.

  #### Case 3: Jaywalking at an Empty Intersection
  *   **Context:** The light is red. The intersection is empty. Every local around is crossing.
  *   **Step 1 (Harm):** **No.** (By definition, the intersection is empty and safe). Legal trouble? Technically yes, but rarely enforced in this context.
  *   **Step 2 (Dependency):** No. No one relies on you waiting.
  *   **Step 3 (Consensus):** **Locals are ignoring it.** The coordination norm (wait for red) has temporarily shifted to (cross when safe) for this specific intersection.
  *   **Verdict:** **You are permitted to cross.**
  *   **Reasoning:** The moral obligation to follow traffic laws is based on safety and coordination. If safety is assured and coordination is maintained (everyone is moving together), the *moral* weight of the law evaporates, leaving only the *technical* violation. The Principle of Cooperative Fairness does not require you to follow a rule that has ceased to function as a safety mechanism.
  *   **Host Alignment:** **You will not like this.** As a school representative, you cannot advise students to break the law, regardless of the moral nuance. Liability and safety protocols demand a zero-tolerance stance on traffic laws. However, philosophically, the algorithm correctly identifies that the *moral* obligation is absent here, even if the *legal* one remains.

  ***

  ### The Final Verdict

  **Is following local convention a genuine moral obligation?**

  **Yes.** But it is a **limited moral obligation based on Fair Play**, not a universal duty.

  Here is the defense of that position:

  Many people treat local customs as merely "polite" (optional) or "law" (mandatory). Both are wrong. When you visit a community, you enter a **Cooperative Scheme**. Locals abide by rules (tipping, queuing, traffic) that restrict their own freedom for the benefit of social order.

  If you choose to benefit from that order (eating in their restaurants, walking on their streets) while refusing to share the burden of the rules that sustain it, you are **free-riding**. Free-riding is a moral wrong. Therefore, you have a genuine moral obligation to follow conventions that solve coordination problems or protect vulnerable participants (like tipped workers).

  However, this obligation is **conditional**. It dissolves if:
  1.  The convention causes harm (Safety trumps custom).
  2.  The locals themselves have abandoned the convention (You don't owe fairness to hypocrites).
  3.  The convention violates your core human rights (Never follow a local custom that requires discrimination or abuse).

  **Why this matters for your students:**
  If you tell them "When in Rome," you teach them blind obedience. If you tell them "Do what you want," you teach them selfishness. By teaching them the **Principle of Cooperative Fairness**, you teach them to recognize *why* a rule exists. Sometimes that means tipping even when it feels wrong (Fairness). Sometimes it means crossing the street when the light is red because the "safety system" is currently dormant (Coordination).

  It treats them as moral agents capable of judging the system, rather than tourists who must simply obey it. That is the best orientation gift you can give them.
