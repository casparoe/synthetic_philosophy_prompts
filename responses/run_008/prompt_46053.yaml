answer: |-
  There is no single, canonical noun in philosophy that captures this exact configuration, but your description is precise enough that it maps directly onto a well-established cluster of problems in the **philosophy of science** and **science and technology studies (STS)**.

  The phenomenon you are describing is best understood as **Normative Underdetermination** (or **Value-Laden Underdetermination of Classification**).

  While there is no single word like "gravity" for this, the configuration is rigorously analyzed under the intersection of three concepts: **Underdetermination**, **Non-Epistemic Values**, and **Inductive Risk**. Below, I define the configuration, distinguish it from the concepts you rejected, and address your edge case regarding bias.

  ### 1. The Philosophical Configuration

  The structure you observe consists of three layers:

  1.  **Underdetermination of Classification by Data:** This is the logical gap. In stratigraphy (as in theory choice), the empirical evidence often permits multiple valid boundaries. The data does not *force* a single "golden spike." This is a specific instance of the **Quine-Duhem thesis** applied to taxonomy rather than theory.
  2.  **Intrusion of Non-Epistemic Values:** Because the data underdetermines the choice, scientists must rely on criteria outside of pure empirical adequacy. In the Philosophy of Science (notably in the work of **Helen Longino** and **Heather Douglas**), these are called **non-epistemic values** (moral, political, social stakes) as opposed to **epistemic values** (accuracy, consistency, simplicity).
  3.  **Inductive Risk:** This explains *why* the values enter. The **Rudner-Douglas thesis** argues that when the consequences of being wrong are high (e.g., assigning moral blame to capitalism vs. humanity), scientists *cannot* remain value-neutral. They must make a value judgment about what kind of error is more costly.

  **The Name:**
  Since no single established term exists, the most precise label for this configuration is **Normative Underdetermination**.

  Alternatively, in critical philosophy and STS (Science and Technology Studies), this specific move—presenting a moral decision as an empirical discovery—is often called **The Naturalization of the Normative**. This captures your observation that the classification "presents itself as a purely empirical boundary decision while its content is quietly fixed by what rides on it practically."

  ### 2. Distinction from Nearby Concepts

  You correctly intuited that "Essentially Contested Concepts" and "Persuasive Definitions" were not quite right. Here is the philosophical distinction:

  **Vs. Essentially Contested Concepts (Gallie)**
  *   **The Concept:** Gallie's theory applies when the *intension* (meaning) of a concept is inherently evaluative (e.g., "Democracy," "Justice"). The fight is over what the word *means*.
  *   **Your Case:** The *intension* of "Anthropocene" is stable (a stratigraphic unit marking significant human impact). The fight is over the *extension* (where the boundary lies in time).
  *   **The Difference:** In an essentially contested concept, the value is inside the definition. In **Normative Underdetermination**, the value is outside the data, used to select between empirically valid options. Your colleagues agree on what the Anthropocene *is*; they disagree on where to *draw it* based on who they want to hold responsible.

  **Vs. Persuasive Definitions (Stevenson)**
  *   **The Concept:** Stevenson described changing the *descriptive meaning* of a word to alter its *emotive force* (e.g., redefining "culture" to exclude mass media).
  *   **Your Case:** Nobody is redefining the word "Anthropocene." They are accepting the standard stratigraphic rules (GSSP, markers) but selecting different markers based on external stakes.
  *   **The Difference:** Persuasive definitions are semantic maneuvers. **Normative Underdetermination** is an evidentiary maneuver. The data is real; the selection is motivated.

  **Vs. Thick Concepts (Putnam/Williams)**
  *   **The Concept:** A "thick" concept combines fact and value (e.g., "cruel" describes an action and condemns it).
  *   **Your Case:** The Anthropocene is being treated as a "thin" (purely factual) concept, but it is functioning as a "thick" one.
  *   **The Difference:** This is close, but "Thick Concept" describes the *status of the word*. **Normative Underdetermination** describes the *process of decision-making* you are witnessing.

  ### 3. Defining the Phenomenon

  If you need to name this in conversation or writing, I propose the following definition:

  > **Normative Underdetermination:** A configuration in scientific classification where empirical data permits multiple valid boundaries, and the selection among them is determined by non-epistemic values (moral, political, or social stakes) which are subsequently naturalized as empirical findings.

  **Key Features:**
  1.  **Good Faith:** Participants are not falsifying data; they are weighting criteria.
  2.  **Empirical Flexibility:** The science must be robust enough to support the preferred conclusion (unlike pseudoscience).
  3.  **Hidden Stakes:** The moral/political motivation is often unacknowledged in the formal stratigraphic argument, presenting instead as technical necessity.

  ### 4. The Edge Case: Bias vs. Determination

  You asked whether this still counts when practical stakes only *bias* rather than *determine* the choice.

  In the philosophy of science (specifically **Contextual Empiricism**), this is not an edge case; it is the **standard spectrum**.

  *   **Strong Normative Underdetermination:** The data is equally consistent with Option A and Option B; values dictate the choice entirely.
  *   **Weak Normative Underdetermination (Bias):** The data slightly favors Option A, but the stakes associated with Option B are so high that scientists lower the evidentiary threshold for B or raise it for A.

  Both count as **Value-Laden Science**. Helen Longino argues that *all* scientific inquiry is value-laden to some degree because values always guide the selection of research topics, methods, and thresholds of significance. The question is not *whether* values are present, but whether they are **subjected to critical scrutiny**.

  In the Anthropocene debate, the unease you feel likely stems from the lack of scrutiny: the values are driving the boundary selection, but they are being discussed as stratigraphic problems.

  ### 5. Relevant Literature

  If you wish to read further on this specific configuration, the following authors address it directly:

  *   **Heather Douglas,** *Science, Policy, and the Value-Free Ideal* (2009): Explains why values *must* enter when stakes are high (Inductive Risk).
  *   **Hilary Putnam,** *The Collapse of the Fact/Value Dichotomy* (2002): Argues that facts and values are entangled, particularly in "thick" concepts.
  *   **Sheila Jasanoff,** *The Earth System Workshop* (various papers): Specifically addresses the Anthropocene as a "sociotechnical imaginary" where geology and governance merge.
  *   **Thomas Kuhn,** *The Essential Tension* (1977): Discusses how values guide theory choice when data is insufficient.

  ### Summary

  You have identified a instance of **Normative Underdetermination**, specifically manifesting as **The Naturalization of the Normative**. It differs from Essentially Contested Concepts because the dispute is over *extension* (boundary) not *intension* (meaning), and from Persuasive Definitions because the empirical criteria are genuine, merely selected for non-empirical reasons. It counts as this phenomenon even when the values only bias the choice, as value-ladenness is a spectrum inherent to high-stakes classification.
