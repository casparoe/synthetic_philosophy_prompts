answer: |-
  This is one of the most famous and insightful questions in the history of physics. It is definitely not dogma; in fact, the struggle to answer your exact question led to one of the most important discoveries of the 20th century: **the connection between information and thermodynamics.**

  Physicists don't ignore Maxwell's Demon. They have spent the last 100 years dissecting it, and the consensus is that the Demon does not violate the Second Law. Here is why the "loophole" is closed, specifically addressing your points about work and nanotechnology.

  ### 1. The Demon Must Measure (Information is Physical)
  Your premise is that the demon "doesn't do any work" on the molecules. In the original 1867 thought experiment, Maxwell assumed the door was weightless and frictionless, so mechanically, you are right: opening the door costs negligible energy.

  However, to know *when* to open the door, the Demon must measure the speed and position of every approaching molecule. It has to acquire **information**.

  For a long time, physicists thought information was abstract and free. In the 1920s, Leo Szilard realized that the Demon is essentially an engine that converts information into work. But where does that information go? It has to be stored in the Demon's "brain" (or memory register).

  ### 2. Landauer's Principle (The Cost of Erasure)
  The definitive nail in the coffin came in 1961 from IBM physicist Rolf Landauer. He formulated **Landauer's Principle**, which states that logically irreversible manipulation of information—specifically **erasing** information—dissipates a minimum amount of heat.

  Here is the cycle the Demon must undergo:
  1.  **Measure:** Detect a fast molecule. (This *can* theoretically be done without energy cost).
  2.  **Act:** Open the door. (Mechanically cheap).
  3.  **Store:** Record that the molecule passed. (Memory fills up).
  4.  **Reset:** To continue working forever, the Demon eventually runs out of memory. It must wipe its memory clean to measure the next molecule.

  **Landauer proved that step 4 costs energy.** To erase one bit of information, you must dissipate at least $k_B T \ln 2$ of heat into the environment.

  When you calculate the energy cost of erasing the Demon's memory, it turns out to be exactly equal to (or greater than) the work you could extract from the temperature difference the Demon created. The entropy decrease in the gas is perfectly offset by the entropy increase generated by the Demon wiping its memory. The net entropy of the universe still goes up.

  ### 3. Nanotech and Real-World Experiments
  You mentioned that with modern nanotech, we can manipulate individual molecules, so it shouldn't be a thought experiment anymore. You are right: **we have built Maxwell's Demons.**

  Scientists have created microscopic "feedback traps" using lasers and electric fields that sort particles based on their thermal motion. A famous experiment by Toyabe et al. in 2010 successfully converted information into free energy, causing a particle to climb a "hill" it shouldn't have been able to.

  **However, the Second Law held.**
  When the researchers accounted for the energy consumed by the cameras, the computers processing the images, the lasers applying the force, and the heat generated by the electronics, the total energy input was always greater than the work extracted. The "Demon" (the control system) got hot. The energy wasn't free; it was paid for by the electricity running the nanotech equipment.

  ### 4. Why It Isn't Perpetual Motion
  A perpetual motion machine of the second kind (which this would be) extracts heat from a single reservoir and converts it entirely into work.
  *   **The Illusion:** It looks like the temperature difference appears from nowhere.
  *   **The Reality:** The temperature difference is purchased using the free energy stored in the Demon's low-entropy memory state. Once the memory is full and must be reset, you have to pay the energy bill.

  If you try to run the engine continuously, you have to continuously erase memory. That erasure generates heat. If you include the Demon as part of the system, the total entropy always increases.

  ### Summary
  Physicists insist the Second Law can't be broken not because of dogma, but because every time we think we found a loophole (like the Demon), we discovered a deeper layer of physics (Information Theory) that plugged the hole.

  Maxwell's Demon doesn't break the Second Law; it actually **saves** it by teaching us that **information is physical.** The Demon isn't a loophole; it's a machine that trades information for energy, and the exchange rate is fixed by Landauer's Principle. You can't get the energy for free; you pay for it in bits.
