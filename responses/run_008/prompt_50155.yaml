                  *   If 4C: Each puts 1. Pot=4. Doubled=8. Each gets 2. Net = 1 (cost) + 2 (return) = 3.
                  *   If 3C, 1D: C puts 1. Pot=3. Doubled=6. Each gets 1.5.
                      *   C Net: -1 + 1.5 = 0.5.
                      *   D Net: 0 (keep) + 1.5 = 1.5.
                      *   *D beats C locally.*
