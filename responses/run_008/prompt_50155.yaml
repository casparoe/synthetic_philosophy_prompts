      *   *Players:* 14 students.
      *   *Structure:* Need distinct groups to allow between-group variance. Let's say 3 groups of 4, plus 2 observers/accountants (rotating?). Actually, 14 divides nicely into 2 groups of 7 or 3 groups of 4 + 2 facilitators. Let's go with 3 Groups of 4 (12 students) + 2 "Scribes" (rotating roles later). Wait, 14 students total. 3 groups of 4 leaves 2. Let's make 2 large groups of 7? No, need more groups for variance. Let's do 4 groups of 3 (12 students) + 2 "Bankers/Record Keepers".
      *   *Strategy:* Cooperate (C) or Defect (D).
      *   *Payoffs:* Prisoner's Dilemma structure within groups.
          *   C costs 1, gives 3 to group pool.
          *   D costs 0, gives 0.
          *   Pool divided equally? Or fitness based on pool?
          *   *Simpler:* C gets 2, D gets 3 (if others C). Let's use a standard Public Goods Game structure.
          *   *Rule:* Each round, choose C or D.
          *   *Within-group fitness:* D always beats C in the same group.
          *   *Between-group fitness:* Groups with more Cs grow faster.
      *   *Reproduction:* This is the tricky part to fit in 80 mins. We can't do biological generations. We need "token replication."
      *   *The "Two Ledgers" Twist:* Half the class tracks Individual Fitness, half tracks Group Fitness. They must arrive at the same population change.

      *Refining the Game for Time:* 80 minutes is tight. 10 min intro, 40 min game/calc, 30 min debrief.
      *   *Setup:* 3 Groups of 4 students (12 players). 2 "Auditors" (rotate later).
      *   *Tokens:* Poker chips or slips of paper.
      *   *Rounds:* 3 Rounds of "Selection."
      *   *Mechanism:*
          1.  **Interaction:** Players choose C or D secretly. Reveal.
          2.  **Payoff:** Calculate individual tokens based on choices. (D earns more locally).
          3.  **Growth:** Groups earn bonus tokens based on total cooperation.
          4.  **Replication:** Tokens = Offspring. New population drawn from pool of tokens.
      *   *The Twist:* In Round 2, swap the accounting method.
          *   Method A (Individualist): Track every student's token count.
          *   Method B (Groupist): Track every group's total token output.
