      *   The "folk story" says Group Selection is impossible/weak. The reality is that multilevel selection is always mathematically possible, but the *strength* of within-group selection usually swamps between-group selection unless specific conditions (high relatedness, low migration, group extinction) are met.
      *   The "bookkeeping equivalence" is crucial: You can describe the *same* evolutionary trajectory as "selfish genes winning" or "groups with altruists out-reproducing groups with selfishists." Both are descriptively accurate. The fight is about *causality* and *parsimony*.

