                      *   4D Group: 0 pot. Each keeps 1. Total = 4.
                  *   *Result:* 4C group (Total 12) outperforms 4D group (Total 4).
                  *   *Selection:* We select groups based on Total Wealth.
                  *   *Within Group:* We select individuals based on Net Wealth.
                  *   *The Conflict:* D wins within groups. C-groups win between groups.
                  *   *The Calculation:*
                      *   Team 1 (Individualists): Calculate global avg fitness of C vs D.
