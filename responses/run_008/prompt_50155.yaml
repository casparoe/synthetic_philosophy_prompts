answer: |-
  # Lesson Plan: The Two Ledgers
  **Topic:** Units of Selection & The Price Equation Intuition
  **Time:** 80 Minutes
  **Class Size:** 14 Students
  **Pre-reading:** None (Intentionally relying on the "Folk History")

  ## 1. Learning Objective
  Students will demonstrate that individual-level and group-level bookkeeping yield identical predictions about population change. They will conclude that the "Units of Selection" debate is not about *prediction* (who wins), but about *causation* (how we explain the win) and *parsimony*.

  ## 2. Materials
  *   **Tokens:** 100 poker chips or paper slips (two colors: Red for "C-Allele", Blue for "D-Allele").
  *   **Strategy Cards:** 14 cards (C or D).
  *   **Score Sheets:** Two types (Individual Ledger vs. Group Ledger).
  *   **Projector/Whiteboard:** For aggregating data.
  *   **Calculators:** Phones allowed.

  ## 3. Setup & Roles (5 Minutes)
  Divide the class into **3 Trait Groups** (Alpha, Beta, Gamma) of **4 students** each.
  The remaining **2 students** are **Central Auditors**. (They will rotate into groups in Round 2 so everyone plays).

  *   **The Folk Story Hook:** Start by asking: *"Who thinks group selection is mathematically impossible? Who thinks Dawkins settled this?"* Let them assert the orthodoxy. Tell them: *"Today you aren't arguing theory. You are running the books. If the math works, the story breaks."*

  ## 4. The Game: "Split Fitness" (25 Minutes)
  **The Logic:** This game mechanically separates *Within-Group Selection* (Individual Fitness) from *Between-Group Selection* (Group Fitness).

  **Rules:**
  1.  **Strategy:** Each player secretly chooses a strategy card: **Cooperate (C)** or **Defect (D)**. Reveal simultaneously within groups.
  2.  **Individual Fitness (The Selfish Component):**
      *   If you play **D**: You earn **4 Personal Tokens**.
      *   If you play **C**: You earn **1 Personal Token**.
      *   *(Note: D always beats C within the same group. This satisfies the "Selfish Gene" constraint.)*
  3.  **Group Fitness (The Altruistic Component):**
      *   For every **C** in your group, the **Group Pool** gains **5 Bonus Tokens**.
      *   *(Note: Groups with more Cs generate more total reproductive slots.)*
  4.  **Reproduction (The Next Generation):**
      *   A Group's **Total Output** = Sum of Personal Tokens + Group Pool Bonus.
      *   The Global Next Generation consists of **12 Slots** (maintaining population size).
      *   **Step A (Between-Group):** The 12 slots are distributed to the 3 Groups proportional to their **Total Output**. (A richer group gets more slots).
      *   **Step B (Within-Group):** The slots assigned to a group are filled by C or D players proportional to their **Personal Token** contribution within that group. (A richer individual is more likely to fill the slot).

  **Play 3 Rounds:**
  *   **Round 1:** Fixed Strategies (Alpha: 4C, Beta: 2C/2D, Gamma: 4D). *Instructor sets this to ensure variance.*
  *   **Round 2:** Students choose strategies (expect Defection). Auditors rotate in.
  *   **Round 3:** Students choose strategies again.

  *Instructor Note:* Do the "Reproduction" math on the board after each round to update the global population frequency of C vs D. Keep a running tally of the Global % of Cooperators.

  ## 5. The Double Bookkeeping Activity (25 Minutes)
  **The Twist:** Stop the game. Take the data from **Round 2**.
  Split the class into two teams. They must predict the **Global Frequency of Cooperation** in the next generation using *only* their assigned ledger. They cannot talk to each other.

  **Team 1: The Individualists (Williams/Dawkins Ledger)**
  *   **Ignore Groups.** Treat the class as one big soup of 14 organisms.
  *   Calculate Average Fitness of all C players ($\bar{w}_C$).
  *   Calculate Average Fitness of all D players ($\bar{w}_D$).
  *   *Fitness = Personal Tokens + (Group Pool / Group Size).* (They must include the shared bonus as part of individual phenotype success).
  *   **Prediction:** Use standard selection equation: $p' = p \times (\bar{w}_C / \bar{w}_{total})$.

  **Team 2: The Groupists (Wynne-Edwards/Sober Ledger)**
  *   **Ignore Individuals.** Treat the class as 3 competing super-organisms.
  *   Calculate Average Fitness of Group Alpha, Beta, Gamma ($\bar{W}_{Group}$).
  *   *Fitness = Total Output of the Group.*
  *   **Prediction:** Calculate how many slots each group gets. Then apply the internal ratio of C/D to those slots.

  **The Reveal:**
  Have both teams write their predicted number of Cooperators in the next generation on the board.
  **They will match.** (If the math is done correctly).

  ## 6. Debrief & Philosophical Pivot (25 Minutes)
  This is where you lecture, but driven by their confusion.

  **Phase 1: The Equivalence (5 mins)**
  *   Ask: *"Who was right about the outcome?"* (Both).
  *   Ask: *"If both ledgers predict the same future, is one 'true' and the other 'false'?"*
  *   **Point:** Bookkeeping equivalence. The Price Equation ($\Delta z = Cov(w, z) + E(w \Delta z)$) is an identity. It *must* balance. You can partition variance however you like.

  **Phase 2: The Causal Fight (10 mins)**
  *   Ask Team 1: *"Why did C increase/decrease?"* (Answer: Because C had higher/lower average fitness).
  *   Ask Team 2: *"Why did C increase/decrease?"* (Answer: Because High-C groups out-reproduced Low-C groups).
  *   **Point:** Both describe the *trajectory*, but they imply different *causal stories*.
      *   Individualist: "Altruism evolved because altruists actually got more tokens (via group bonuses)."
      *   Groupist: "Altruism evolved because groups with altruists survived better, despite altruists losing locally."
  *   **The Folk Story Wobble:** The folk story says "Group selection is wrong." You just proved Group Accounting works. So what is the dispute?
  *   **Answer:** The dispute is about **Causal Primacy** and **Parsimony**.
      *   If Within-Group selection is 99% of the variance and Between-Group is 1%, insisting on Group Selection is technically true but causally misleading (like saying a car moves because of the rotation of the universe rather than the engine).
      *   Williams' critique wasn't that the math fails; it was that biologists were attributing effects to Group causes that were fully explained by Individual causes (kin selection).

  **Phase 3: The Cost of Insistence (10 mins)**
  *   Ask: *"What do we lose if we insist ONLY the Individual Ledger is real?"*
      *   Answer: We miss patterns in multilevel hierarchies (e.g., cancer cells vs. organism, cultural evolution).
  *   Ask: *"What do we lose if we insist ONLY the Group Ledger is real?"*
      *   Answer: We invite magical thinking (organisms sacrificing themselves for 'the good of the species' without a mechanism).
  *   **Closing:** The debate isn't "Who is right?" It's "Which level provides the most robust causal explanation for *this specific* dataset?"

  ## 7. Predictable Failure Modes (Instructor Notes)
  1.  **The Math Bottleneck:** Students will get stuck calculating weighted averages.
      *   *Fix:* Provide a pre-formatted Excel sheet on a projector or printed handouts with the formulas already set up. Let them plug in the token counts, not derive the stats.
  2.  **Collusion:** Students in different groups will coordinate to maximize global C.
      *   *Fix:* Enforce "No Cross-Group Talk" during strategy selection. Remind them that in nature, genes don't call each other on the phone.
  3.  **The "So What?" Reaction:** Students may agree the math matches but insist Individual selection is still "more real."
      *   *Fix:* Press them on *why*. If they say "Because genes are physical," ask about epigenetic or cultural groups where the "gene" is fuzzy. Force them to defend *parsimony*, not ontology.
  4.  **Time Overrun:** The game rounds can drag.
      *   *Fix:* Hard stop at 25 mins for the game. Even if only 2 rounds are completed, the Bookkeeping Activity works with just one round of data.

  ## 8. Limitations (What You Must Supply at the Whiteboard)
  The game **cannot** reproduce the following, and you must explicitly state this during the debrief:

  1.  **Causality:** The game shows *correlation* and *accounting equivalence*. It does not prove which level *caused* the change. You must explain that science seeks causal levers, not just descriptions.
  2.  **Heritability Mechanisms:** The game assumes strategies are copied perfectly. In reality, group-level traits are harder to inherit than gene-level traits. This is Williams' real objection (high fidelity at individual level, low fidelity at group level).
  3.  **The "Vehicle" Problem:** The game treats students as both genes and organisms. You need to clarify that "Individual Selection" usually means "Gene Selection" in the Dawkins sense, whereas the game simulates "Organism Selection."

  ## 9. The Takeaway Handout (Optional)
  A single slip of paper they take out:
  *   **The Price Equation:** Total Change = Within-Group Change + Between-Group Change.
  *   **The Lesson:** You can set the "Within" term to zero by changing your bookkeeping, but you can't change the Total Change.
  *   **The Question:** Don't ask "Is group selection real?" Ask "How much of the variance is located at the group level, and is that enough to sustain the trait?"
