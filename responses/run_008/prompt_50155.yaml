      *   **Mechanism:** An in-class game/simulation.
      *   **Key Mechanic:** Within-group defection wins, but between-group cooperation wins.
      *   **Key Insight Moment:** Students compute the same run twice (individual vs. group/allele accounting) and get the same result.
