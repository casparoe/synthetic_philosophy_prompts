answer: |-
  **Final Exam: Knowledge, Closure, and Its Discontents**
  **Time Allowed: 90 Minutes**

  **Question 1**
  Professor Larsen, a historian of early modern Europe, knows that the Peace of Westphalia was concluded in 1648. A monograph arrives for her to review, arguing at length for 1649. She knows that if the monograph is sound, she did not know the 1648 date; so, by the reasoning above, she knows the monograph contains an error somewhere — though, until she reads it, she cannot say where. But Larsen has also read the empirical literature on motivated reasoning and expert overconfidence, and she takes it to show that experts who dismiss contrary arguments sight-unseen are frequently miscalibrated, including when they are right. So she possesses both the dogmatist's apparent license (she knows the monograph errs) and standing higher-order evidence that people reasoning as she is about to reason have often done so badly.

  Write an essay addressing the following:
  (a) Evaluate whether each main escape route from the dogmatism paradox (denying closure, knowledge loss/suspension, unassessed evidence/flaw existence, higher-order evidence) can say something principled about Larsen's situation, specifically regarding whether she may assign the monograph a low prior credence and whether that licenses *skipping* the work of locating the error rather than merely knowing one exists.
  (b) Consider whether the options available to Larsen's theorist map onto the options in the epistemic akrasia debate, and whether that mapping shows the two debates are one or merely resemble each other.
  (c) Determine whether there is an account on which Larsen both knows the date and owes the monograph a genuine reading, or whether that combination is exactly what the paradox rules out.

  *Note: The literature regarding closure, the validity of the "flaw must exist" inference, and the defeaters provided by higher-order evidence is genuinely divided. Do not present any single escape route as the received view. Distinguish between settled aspects of the dialectic and open controversies.*

  ***

  **Model Answer**

  The Larsen case sharpens the dogmatism paradox by introducing higher-order evidence (HOE) against the reliability of dogmatic dismissal. The central tension is whether knowing *p* licenses ignoring evidence for *not-p*, even when one has reason to distrust that licensing procedure.

  Regarding (a), the escape routes yield different verdicts on Larsen's license to skip reading. Denying closure blocks the inference that Larsen knows the monograph contains an error solely based on her knowledge of 1648. On this view, she cannot assign a low prior credence based purely on closure; she must engage to know the monograph fails. Knowledge-loss theorists argue she knows 1648 now, but engaging the argument might suspend that knowledge. This permits reading but frames it as risky. The "unassessed evidence" approach distinguishes knowing *that* a flaw exists from knowing *where* it is. This is crucial: knowing *that* might not license skipping the work of identification. Finally, HOE approaches suggest her confidence in her dismissal is itself suspect. While she may know 1648, the HOE undermines the justification for ignoring the counter-argument. Most theorists agree HOE complicates the license to ignore, though they disagree on whether it defeats knowledge entirely.

  Regarding (b), the mapping to epistemic akrasia is structurally strong but ontologically contested. Akrasia typically forbids believing *p* while believing one's belief in *p* is unreasonable. Larsen knows *p* but possesses evidence that dismissing challenges is unreliable. This resembles akrasia: a conflict between a first-order status (knowledge) and a higher-order norm (methodological reliability). However, claiming the debates are identical is controversial. Some argue knowledge norms reduce to belief norms, making the cases identical. Others maintain knowledge imposes distinct requirements, meaning Larsen's situation is a unique "dogmatic akrasia." An adequate answer must note the resemblance without asserting identity as consensus, since the reduction of knowledge norms to belief norms is itself disputed.

  Regarding (c), compatibility is possible depending on how one construes the obligations of knowledge. The paradox rules out compatibility only if knowing *p* entails being permitted to ignore counter-evidence. However, if knowing *p* is compatible with owing inquiry into potential defeaters, Larsen can know the date and owe a reading. The HOE suggests she owes the reading precisely because her automatic dismissal is unreliable. It is settled that the paradox arises even for subjects with true, well-founded beliefs; it is open whether closure must be abandoned to resolve it. Therefore, an account preserving both knowledge and the obligation to read is viable if one accepts that knowledge does not entail epistemic immunity from inquiry. This view respects the HOE without necessarily surrendering the first-order knowledge, though critics argue this creates an unstable tension. Ultimately, Larsen's case suggests that even if knowledge is closed under known entailment, the permission to ignore counter-evidence is not.

  (648 words)

  ***

  **Marking Scheme (20 Points Total)**

  **Distinction between A and B Answers:**
  *   **A Answer (16–20 pts):** Distinguishes knowing *that* an error exists from identifying *where* it is; integrates HOE as changing what Larsen is *permitted* to do with her knowledge rather than just listing it alongside her knowledge; explicitly marks contested claims as contested.
  *   **B Answer (10–15 pts):** Restates the case and gestures at closure; treats HOE and first-order knowledge as separate facts without interaction; presents one escape route (e.g., denying closure) as the correct solution.

  **Must-Hit Points (4 points each):**

  1.  **Application of Escape Routes to Licensing:**
      *   *Requirement:* Explains how at least three escape routes affect Larsen's permission to skip reading vs. assign low credence.
      *   *Botch:* Merely defines the escape routes without applying them to the specific question of *skipping the work*.
  2.  **Distinction Between Error Existence and Identification:**
      *   *Requirement:* Explicitly distinguishes knowing *that* there is a flaw from knowing *where* it is (the "unassessed evidence" move).
      *   *Botch:* Treats knowing "there is an error" as sufficient justification to ignore the text entirely.
  3.  **Integration of Higher-Order Evidence (HOE):**
      *   *Requirement:* Argues whether HOE defeats the *license to ignore* or the *knowledge itself*, showing interaction between the two.
      *   *Botch:* Describes Larsen's HOE and her knowledge side-by-side without explaining how one impacts the normative status of the other.
  4.  **Akrasia Mapping Nuance:**
      *   *Requirement:* Identifies the structural resemblance to akrasia but acknowledges the debate over whether the norms are identical.
      *   *Botch:* Asserts confidently that the cases are either exactly the same or completely unrelated without qualification.
  5.  **Meta-Epistemic Awareness (Settled vs. Contested):**
      *   *Requirement:* Correctly identifies settled dialectic (e.g., paradox arises for true beliefs) vs. open controversies (e.g., validity of closure); **deduct 2 points** if a contested resolution is presented as consensus.
      *   *Botch:* Writes "The solution to the paradox is..." implying a received view exists where none does.
