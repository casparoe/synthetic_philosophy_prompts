prompt: |-
  I'm a graduate student in a philosophy department where I work mainly on social epistemology but have been taking Sanskrit for three years, and I've been given a ninety-minute slot in our epistemology reading group to introduce the Nyāya treatment of śabda -- testimony or, more precisely, the knowledge arising from a trustworthy speaker's words -- as a distinct pramāṇa. The group is about a dozen analytic epistemologists. They know the contemporary testimony literature cold: they've followed the long-running fight over whether testimonial warrant reduces to perception, memory, and induction or is basic in its own right, and several of them have strong commitments on it. They know nothing about Indian philosophy except vague impressions that it is "wisdom literature." My own line, which I want the session to build toward without announcing it too early, is that the standard gloss -- Nyāya as the ancient Indian anti-reductionists, since both sides count testimony as a basic source -- is subtly wrong, and interestingly wrong: the pramāṇa framework isn't carving the pie anywhere near where the reductionism debate assumes, so the apparent convergence hides a real disagreement about what the question is.

  I need a teaching plan, not the explanation itself. Work out the order the pieces have to come in -- I suspect I can't even start with śabda, that I have to first get across what it means to enumerate pramāṇas at all, with each source having its own definition, conditions, and characteristic operation, and that this is a different intellectual project from listing "ways of knowing" in the casual Western sense -- and tell me whether that suspicion is right and what depends on what. Then help me pick the carrying example: I'm torn between the very mundane case of learning from a reliable passerby that the mangoes at a particular stall are ripe, and the classic one about someone in southern India who has never left the lowlands coming to know that the Himalayas are snow-capped; say which better does the work and what the example must have and must lack. I also want a map of the misconceptions this audience will predictably form and where in the sequence to head each off -- my guesses are that they will assimilate the pramāṇa list to a reliabilist taxonomy, that they will read the trustworthy-speaker condition as their own familiar "no defeaters plus reliability" story and miss that it includes the speaker's intention to convey truth rather than mislead, and that they will hear "scripture" when I say śabda and conclude the whole framework is epistemology in the service of theology, but correct me if you see worse ones. Tell me what to openly refuse to cover at this level and say so out loud -- I assume the Buddhist reductionist opponents who argued śabda collapses into inference deserve more than a sentence, but I can't do them justice in ninety minutes alongside everything else, so advise me on whether to cut them entirely or set them up as the cliffhanger. Finally, give me one question I can ask at the end that would reveal whether they've actually understood what a pramāṇa is, rather than just filed Nyāya under "testimony, basically anti-reductionist, very old."
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Context:**
      *   **User:** Graduate student in Philosophy (Social Epistemology focus), 3 years of Sanskrit study.
      *   **Audience:** ~12 Analytic Epistemologists (graduate level/faculty). They know contemporary testimony literature (reductionism vs. anti-reductionism) very well. They know *nothing* about Indian Philosophy (vague "wisdom literature" impressions).
      *   **Task:** 90-minute session introducing Nyāya *śabda* (testimony) as a *pramāṇa*.
      *   **Goal/Thesis:** The standard gloss (Nyāya = ancient anti-reductionists) is subtly wrong. The *pramāṇa* framework asks a different question than the reductionism debate. The convergence is superficial; the disagreement is structural.
      *   **Needs:** Teaching plan (order of operations), validation of suspicion (start with *pramāṇa* theory, not *śabda*), example selection (mangoes vs. Himalayas), misconception mapping, scope management (what to cut), and a final diagnostic question.

  2.  **Deconstruct the Core Philosophical Tension:**
      *   *Analytic Epistemology:* Focuses on justification/warrant. "Under what conditions does S know that p via T's say-so?" Reductionism says: reduce to perception + induction + memory. Anti-reductionism says: testimonial warrant is sui generis/basic.
      *   *Nyāya Epistemology:* Focuses on *pramā* (veridical cognition) and *pramāṇa* (instrument of knowing). It's ontological/causal *and* normative. A *pramāṇa* is a distinct *cause* of knowledge.
      *   *The Clash:* Analytic epistemologists ask about *warrant transmission*. Nyāya asks about *causal genesis of veridical cognition*. If Nyāya says *śabda* is a distinct *pramāṇa*, they mean the *causal mechanism* is distinct, not necessarily that the *justificatory structure* is immune to reduction in the analytic sense.
      *   *User's Insight:* The "anti-reductionist" label assumes the debate is about the same thing. But Nyāya's enumeration of *pramāṇas* is about carving reality at its causal joints, not just mapping justificatory routes.

  3.  **Address the Specific Requests:**

      *   **Order of Operations (The Suspicion):** The user suspects they can't start with *śabda*. *Verdict:* Correct. If you start with "Testimony is a *pramāṇa*," analytic ears hear "Testimony is a basic source of justification." They will immediately map it to Burge/Fricker/Coady. You must first establish what a *pramāṇa* is (an instrument, a cause, a distinct category of cognition) before they can understand why *śabda* fits there.
      *   **Example Selection:**
          *   *Mangoes:* Mundane, secular, everyday. Good for showing *śabda* isn't just scripture.
          *   *Himalayas:* Classic, emphasizes distance/unverifiability.
          *   *Decision:* The Mango example is better for *this* audience. Why? Because the Himalayas example risks triggering the "scripture/religious authority" bias. The Mango example forces them to see *śabda* as ordinary linguistic communication. It highlights the *causal* link (words -> cognition) without the baggage of faith.
          *   *Requirements:* Must show the speaker is competent and truthful (Nyāya conditions). Must show the hearer understands the meaning (semantic competence). Must show the cognition wouldn't arise without the words.
      *   **Misconceptions:**
          1.  *Reliabilism:* *Pramāṇa* $\neq$ Reliable Process. It's a specific *kind* of cause.
          2.  *Defeaters/Trust:* Nyāya's "trustworthy" (*āpta*) isn't just "reliable." It involves moral/epistemic virtue and *intent*.
          3.  *Scripture:* *Śabda* includes Veda, but starts with ordinary speech. Need to decouple immediately.
          4.  *Reductionism:* They will think Nyāya reduces *śabda* to inference (he said X, he's reliable, therefore X). Nyāya explicitly denies this *causal* reduction.
      *   **Scope Management (Buddhists):** The Buddhist (Dignāga/Dharmakīrti) critique is that *śabda* is just inference (*anumāna*). This is the *exact* reductionism debate.
          *   *Advice:* Do not cut it entirely, but don't make it the focus. Use it as the "cliffhanger." It validates the user's thesis (there *was* a reductionism debate, but it was about causal ontology, not warrant).
      *   **Final Question:** Needs to test if they understand *pramāṇa* as a causal/ontological category vs. a justificatory one.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Intro (10 mins):* Hook them. Acknowledge their expertise. State the goal: "We aren't doing comparative philosophy of testimony; we're doing comparative epistemology of *instruments*."
      *   *Module 1: The Pramāṇa Framework (25 mins):* This is crucial. Define *pramā* (veridical cognition) and *pramāṇa* (instrument). Use Perception (*pratyakṣa*) as the anchor. It's the easiest to grasp. Show that *pramāṇas* are mutually exclusive causal kinds.
      *   *Module 2: Śabda as Pramāṇa (25 mins):* Now introduce *śabda*. Define *āpta* (trustworthy speaker). Use the Mango example. Explain the causal chain: Words -> Semantic Understanding -> Cognition. Contrast with Inference.
      *   *Module 3: The "Reductionism" Trap (20 mins):* Here comes the user's thesis. Explain why calling Nyāya "anti-reductionist" is anachronistic. They aren't arguing about warrant; they are arguing about causal taxonomy.
      *   *Module 4: The Buddhist Challenge & Conclusion (10 mins):* Mention the Buddhist reductionist challenge briefly. End with the diagnostic question.

  5.  **Refining the Content:**
      *   *Correction on Misconceptions:* The user mentioned "scripture." I need to emphasize that *śabda* is *linguistic cognition* generally, Veda is a subset.
      *   *Correction on Reductionism:* The analytic debate is normative (justification). The Nyāya debate is often causal/ontological (what produces the cognition?). This is the key distinction.
      *   *Example:* Stick with the Mangoes. It prevents the "faith" distraction.
      *   *Buddhists:* Keep them as the "To Be Continued." It shows there *was* internal debate without getting bogged down in *apoha* theory.

  6.  **Final Review against Constraints:**
      *   90 minutes? Yes, timings look tight but feasible.
      *   Teaching plan, not explanation? Yes, structured as instructions.
      *   Address the suspicion? Yes, validated.
      *   Example choice? Yes, Mangoes selected with rationale.
      *   Misconceptions? Mapped to specific timeline points.
      *   What to cut? Buddhists minimized.
      *   Final Question? Crafted carefully.

  7.  **Polishing the Tone:**
      *   Respectful of the user's expertise (3 years Sanskrit).
      *   Strategic regarding the audience (analytic epistemologists can be hostile to "history of ideas" if not framed as "philosophical argument").
      *   Clear, actionable steps.

  *(Self-Correction during drafting)*: I initially thought about suggesting the Himalayas example because it's the standard textbook case. But the user specifically worried about the "scripture/theology" bias. The Himalayas example is often tied to travel narratives or cosmological claims in primary texts. The Mango example is purely mundane. For an analytic audience skeptical of "wisdom literature," the mundane is safer to establish philosophical rigor. I will advocate for the Mango.

  *(Refining the "Reductionism" point)*: I need to be careful not to say Nyāya *has no* view on justification. They do (*pramāṇavāda*). But the *enumeration* of *pramāṇas* is primarily about causal distinctness. If the causal chain of *śabda* involves understanding meaning (*śakti-graha*), and inference involves perceiving a mark (*liṅga*), they are causally distinct even if the *warrant* feels similar. The analytic reductionist asks "Can I justify this belief without a primitive testimony principle?" The Nyāya asks "Is the *cause* of this cognition distinct from the cause of inferential cognition?"

  *(Final check on the Diagnostic Question)*: It needs to force them to choose between a justificatory framework and a causal/instrumental framework. "If a parrot says 'fire', do you know there is fire?" (Classic Nyāya case). No, because no *āpta*. But why? Is it lack of reliability or lack of *intent*? Or is it because a parrot isn't a *pramāṇa*? Let's go with something about the *identity* of the instrument.

  *Revised Diagnostic Question:* "If we discover that the cognitive mechanism processing testimony is identical to the one processing induction, does Nyāya have to collapse *śabda* into *anumāna*?" This hits the causal vs. normative distinction.

  *Wait, better one:* "Does a *pramāṇa* name a *reason* for believing or a *cause* of knowing?" This is the root.

  *Let's go with the Parrot case but framed specifically:* "A reliable parrot says 'Mangoes are ripe.' You believe it. Nyāya says this is *not* *śabda-pramāṇa*. Why? And does that distinction matter for *justification*?" This reveals if they understand *āpta* requires *intent* and if they understand *pramāṇa* is about the *source type*, not just the output.

  *Actually, the prompt asks for ONE question.* I'll craft one that targets the *pramāṇa* definition specifically. "If testimony yields knowledge, but the speaker was lying (Gettier-style luck), does Nyāya say the *pramāṇa* failed or that the *pramā* failed to arise?" No, that's too technical.
  Let's stick to the core thesis: "Is the debate about *warrant* or about *causal taxonomy*?"
  Okay, I will formulate the question to test the *pramāṇa* concept directly.

  *Final Plan Structure:*
  1.  Validation of Suspicion.
  2.  The Example Choice.
  3.  The 90-Minute Arc (Time-stamped).
  4.  Misconception Map.
  5.  Scope & Cuts.
  6.  The Diagnostic Question.

