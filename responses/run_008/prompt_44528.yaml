answer: |-
  This is a sophisticated pedagogical challenge. You are navigating a category error before it even happens. Your suspicion is correct: if you open with *śabda*, analytic epistemologists will immediately map it onto the Reductionism/Anti-Reductionism debate (Coady, Burge, Fricker, etc.) and treat Nyāya as a primitive participant in *their* game. They will miss that the "board" itself is different.

  Here is the teaching plan, structured to prevent that assimilation.

  ### 1. Validation of Your Suspicion
  **You are right.** You cannot start with *śabda*.
  *   **Why:** In analytic epistemology, "sources of knowledge" are often treated as justificatory routes (e.g., "I am justified because I saw it" vs. "I am justified because she told me"). In Nyāya, a *pramāṇa* is primarily an **instrumental cause** (*karaṇa*) of a specific type of veridical cognition (*pramā*).
  *   **What depends on it:** If you don't establish that *pramāṇas* are mutually exclusive *causal kinds* first, they will interpret Nyāya's claim that "*śabda* is a distinct *pramāṇa*" as a claim about *justificatory independence*. While related, these are not identical. Nyāya's distinctness claim is ontological/causal (the mechanism of knowing via words is distinct from the mechanism of knowing via marks); the analytic debate is often normative (does the warrant reduce?).
  *   **The Risk:** If you skip the *pramāṇa* theory setup, they will hear "Nyāya are Anti-Reductionists" and stop listening, thinking, "Oh, they're just Burgeans with sandals." You need them to see that Nyāya isn't playing the "warrant" game primarily; they are playing the "cognitive taxonomy" game.

  ### 2. The Carrying Example
  **Choose the Mangoes.**
  *   **The Case:** A passerby tells you, "The mangoes at the stall down the street are ripe."
  *   **Why not the Himalayas?** The Himalayas example (a lowlander learning about snow from a traveler) is the classic textbook case, but for *this* audience, it carries too much risk of the "Scripture/Theology" misconception. It involves distance, unverifiability, and often leans into cosmological claims in primary texts. It invites the thought: "Ah, this is about faith in things I can't check."
  *   **Why the Mangoes?** It is mundane, secular, and immediately verifiable (you can walk down the street). It forces the analytic epistemologists to treat *śabda* as **ordinary linguistic communication**, not religious authority. It isolates the epistemic structure from the soteriological context.
  *   **What the example must have:**
      1.  **Competence:** The passerby knows what mangoes are and what ripeness looks like.
      2.  **Truthfulness (*āptatva*):** The passerby intends to convey the truth (not lying, not joking).
      3.  **Semantic Competence:** You know the meaning of the words.
      4.  **Causal Link:** Your cognition of the ripe mangoes arises *from* the words, not from seeing the mangoes or inferring from clouds.
  *   **What it must lack:** Any hint of religious authority, ancient texts, or unverifiable metaphysical claims.

  ### 3. The 90-Minute Arc

  **0:00–0:10 | Introduction & Framing**
  *   **Acknowledge expertise:** "You know the testimony literature better than I do. I am not here to tell you who won the reductionism debate."
  *   **The Hook:** "I want to show you that the Nyāya framework isn't answering the reductionist question. It's answering a different one. If we map Nyāya onto the Reductionism debate, we get the right label ('Anti-Reductionist') for the wrong reasons."
  *   **Goal:** By the end, you should see why calling Nyāya 'anti-reductionist' is anachronistic.

  **0:10–0:35 | Module 1: The *Pramāṇa* Framework (The Crucial Setup)**
  *   **Define *Pramā*:** Veridical cognition. Not just 'belief', but a successful cognitive event that grasps an object as it is.
  *   **Define *Pramāṇa*:** The *instrumental cause* of that cognition.
  *   **The Analogy:** Use a carpentry analogy. A saw and a chisel both produce furniture (knowledge), but they are distinct *instruments* because they operate differently on the material.
  *   **Establish Distinctness:** *Pratyakṣa* (Perception) is one instrument. *Anumāna* (Inference) is another. They are distinct because the *causal chain* is different (sense-contact vs. mark-perception + pervasion).
  *   **Check for Understanding:** Ask: "If I see smoke and infer fire, is that the same *instrument* as seeing the fire directly?" (Answer must be No, because the causal mechanism differs, even if the object is the same).
  *   **Head off Misconception:** Explicitly state: "A *pramāṇa* is not a 'reason for belief.' It is a 'cause of knowing.' Reliabilism is close, but Nyāya is more granular about the *type* of cause."

  **0:35–0:60 | Module 2: *Śabda* as *Pramāṇa***
  *   **Introduce the Mango Example:** Walk through the causal chain.
      1.  Speaker utterance.
      2.  Hearer's semantic understanding (*śakti-graha*).
      3.  Cognition of the object (ripe mangoes).
  *   **The *Āpta* Condition:** Define *āpta* (trustworthy). This is where you intervene on the "Reliability" misconception.
      *   *Analytic view:* Reliability = high truth-ratio.
      *   *Nyāya view:* *Āpta* = Competence + **Intention to convey truth** (*yathārtha-anubhava* + *tathā-vacanā*).
      *   *Point:* A reliable liar (who happens to speak truth often) is not an *āpta*. A truthful incompetent is not an *āpta*.
  *   **The Distinctness Claim:** Why is this not Inference (*anumāna*)?
      *   Inference: I see a mark (smoke), I recall pervasion, I conclude fire.
      *   Testimony: I hear words, I grasp meaning, I cognize the object.
      *   Nyāya argues the *causal mechanism* of understanding language is distinct from the *causal mechanism* of logical pervasion. Therefore, distinct *pramāṇa*.

  **0:60–0:80 | Module 3: The "Reductionism" Trap (Your Thesis)**
  *   **The Convergence:** "So, Nyāya says *śabda* is basic (not reducible to perception/inference). Analytic Anti-Reductionists say testimonial warrant is basic. It looks like a match."
  *   **The Divergence:** "But *why* is it basic?"
      *   **Analytic Anti-Reductionist:** Because we have a *prima facie* right to trust, or because reduction leads to skepticism. (Normative/Justificatory focus).
      *   **Nyāya:** Because the *instrument* (*karaṇa*) is ontologically distinct. The words themselves, understood, are the cause. (Causal/Ontological focus).
  *   **The "Subtly Wrong" Point:** If an analytic reductionist proved that testimonial *warrant* relies on inductive background beliefs, Nyāya might not care. As long as the *causal genesis* of the cognition relies on understanding words (not perceiving smoke), it remains *śabda-pramāṇa*. They are carving the pie by *causal history*, not by *justificatory structure*.

  **0:80–0:90 | Module 4: The Cliffhanger & Conclusion**
  *   **The Buddhist Challenge:** Briefly mention that Dignāga and Dharmakīrti *did* argue *śabda* reduces to *anumāna* (Inference).
      *   *Their argument:* You infer the speaker's reliability and intent.
      *   *Nyāya Response:* No, understanding meaning is immediate upon hearing, given competence.
  *   **Why mention this?** To show there *was* an internal reductionism debate, but it was fought over the nature of *cognitive causality*, not warrant.
  *   **Close:** "Nyāya isn't an ancient version of Burge. It's a different taxonomy of mind."

  ### 4. Map of Misconceptions

  | Misconception | When it will arise | How to head it off |
  | :--- | :--- | :--- |
  | **"Pramāṇa = Reliabilist Process"** | Module 1 (Definitions) | Explicitly distinguish *instrumental cause* from *statistical reliability*. A broken clock is reliable twice a day; it is never a *pramāṇa* because it lacks the specific causal connection to the object. |
  | **"Śabda = Scripture/Veda"** | Module 2 (Intro) | Start with the Mango example. State clearly: "Vedic testimony is a *subset* of *śabda*, defined by the absence of a human author. But the *mechanism* is the same: words generating cognition." |
  | **"Trustworthy = No Defeaters"** | Module 2 (*Āpta*) | Emphasize **Intention**. A speaker can be reliable (never lies) but joking. If they joke, Nyāya says *śabda-pramāṇa* does not operate. Analytic "no-defeaters" conditions miss this positive requirement of *truth-intent*. |
  | **"Nyāya = Anti-Reductionist"** | Module 3 (Thesis) | This is your main point. Reframe it: "Nyāya is *Causal Non-Reductionist*, which implies but is not identical to *Justificatory Anti-Reductionism*." |

  ### 5. Scope Management: What to Cut
  **Cut the detailed Buddhist reductionist argument.**
  *   **Reason:** You cannot explain *apoha* (exclusion) or the Buddhist theory of inference in 10 minutes. It will bog down the session.
  *   **Strategy:** Use the Buddhists as the "Cliffhanger." Say: "The Buddhists *did* argue for reductionism. They said testimony is just inference about the speaker's reliability. Nyāya said no. The debate exists, but notice: they are arguing about whether the *cognitive mechanism* is distinct, not whether the *hearer needs background evidence*."
  *   **Why:** This preserves the integrity of your thesis (that the debate is different) without requiring you to teach Buddhist epistemology.

  ### 6. The Diagnostic Question
  Do not ask a content question (e.g., "What is *āpta*?"). Ask a structural question that forces them to choose between the Analytic and Nyāya frameworks.

  **The Question:**
  > "Suppose we discover empirically that the cognitive processing mechanism for understanding testimony is **identical** to the mechanism for processing inductive inference.
  >
  > For the Analytic Anti-Reductionist, does this collapse testimonial warrant?
  > For the Nyāya theorist, does this collapse *śabda-pramāṇa*?
  > **Why do your answers differ?**"

  **What this reveals:**
  *   If they understand the session, they should say:
      *   **Analytic:** Maybe/Maybe not (Warrant is normative; causal identity doesn't necessarily kill normative distinctness, though it hurts).
      *   **Nyāya:** **Yes.** If the *instrumental cause* (*karaṇa*) is identical, the *pramāṇa* is identical. Nyāya's taxonomy rests on causal distinctness.
  *   If they answer "No" for both, they have assimilated Nyāya into the Analytic framework (treating *pramāṇa* as just 'source of warrant').
  *   If they answer "Yes" for both, they have missed the normative/causal distinction in the Analytic side.

  This question forces them to confront the "carving the pie" thesis directly.
