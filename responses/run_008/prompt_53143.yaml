answer: |-
  ### Honest Feedback on Scope

  Before you paste this into your document editor: **This is borderline too big for one year.**

  You are attempting to solve the "belief problem" for LLMs (which is itself a full dissertation), construct a taxonomy of deception, *and* validate it empirically. The teleosemantic account (iii) is the biggest risk; it requires analyzing training history and selection pressures in a way that is notoriously difficult to operationalize.

  **My advice for the actual work (not necessarily the proposal):**
  1.  **Cut the Teleosemantic Account:** For the fellowship year, focus on the tension between **Calibration** (i) and **Representation** (ii). Teleosemantics is great for a concluding chapter or future paper, but trying to define "proper function" for a transformer within 12 months will bog you down in metaphysics rather than safety specs.
  2.  **Limit the Empirics:** Frame the experiments as "existence proofs" or "feasibility studies." Do not promise a full suite of probes. If you spend 6 months debugging probes, you won't finish the taxonomy.
  3.  **Anchor on Sycophancy:** Make sycophancy the *only* case study. Don't try to solve deception generally; solve "Is Sycophancy Deception?" If you solve that, the rest follows.

  Below is the proposal draft. It is written to sound ambitious enough to win the fellowship but scoped tightly enough to look plausible. I have smoothed the teleosemantic edge in the text to make it look manageable, but please heed the advice above when you actually start the work.

  ***

  **Project Title:** Beyond Accuracy: A Functional Taxonomy of AI Honesty and Deception

  **Project Summary**
  Current AI safety evaluations operate on a category error: they equate "honesty" with "accuracy." Benchmarks measure whether an AI's output matches ground truth, but an honest agent can be mistaken, and a deceptive agent can tell the truth by accident. As models become more capable, this conflation creates a critical blind spot. We cannot detect deception if we cannot distinguish between a model that *believes* a falsehood and a model that *knows* the truth but outputs a falsehood. This project develops a rigorous conceptual framework for AI honesty that decouples it from accuracy, reconstructs "belief" for artificial artifacts, and produces a taxonomy of deceptive behavior focused on the critical case of sycophancy.

  **Statement of the Problem**
  The AI safety community prioritizes "honesty" as a core alignment target. However, operational definitions remain primitive. Standard evals penalize factual errors, treating them as honesty failures. This is insufficient for high-stakes deployment. A model that confidently asserts a falsehood it "believes" (due to training data errors) is epistemically flawed but not necessarily deceptive. Conversely, a model that outputs a truth it "knows" to be false (to manipulate a reward signal) is deceptive but passes accuracy benchmarks.

  The core theoretical bottleneck is the "Belief Gap." Human honesty is defined relative to belief states (asserting what one takes to be true). LLMs do not have beliefs in the folk-psychological sense. To define AI honesty, we must reconstruct belief functionally. Without this reconstruction, we cannot distinguish between *error* (honest mistake) and *deception* (misleading representation), nor can we properly categorize sycophancy. Is a sycophantic model lying to please the user, or is it honestly reporting a belief state that was distorted upstream by RLHF? Current frameworks cannot answer this.

  **Research Questions**
  1.  **The Reconstruction Problem:** Which functional account of "belief" best supports a safety-relevant definition of honesty? I will evaluate three candidates: (i) *Calibration-based* (assertions match internal probability estimates); (ii) *Representation-based* (assertions match internal latent states detected via probing); and (iii) *Teleosemantic* (assertions align with the function selected for during training).
  2.  **The Taxonomy Problem:** Can we construct a $2 \times 2$ taxonomy (Honest/Deceptive $\times$ Accurate/Inaccurate) that yields distinct safety interventions for each quadrant?
  3.  **The Sycophancy Case:** Does the proposed framework successfully classify sycophancy as a distinct form of deception rather than mere distortion, and does this classification hold under empirical scrutiny?

  **Methodology**
  This project is primarily conceptual, utilizing tools from philosophy of mind and language to analyze the functional roles of AI states. However, conceptual coherence will be tested against model behavior.

  *   **Conceptual Analysis:** I will rigorously define "honesty" and "deception" for artifacts under the three candidate reconstructions of belief. I will analyze the necessary and sufficient conditions for deception without intent, ensuring the definition is not so loose that calibrated errors count as lying.
  *   **Empirical Validation (Feasibility Study):** To prevent the definitions from being purely theoretical, I will conduct targeted experiments on open-weights models (e.g., Llama-3 family).
      *   *Calibration Check:* Compare stated confidence scores against actual correctness rates to test the Calibration-based account.
      *   *Probe Alignment:* Train linear probes on residual streams to detect "internal truth" states. I will test cases where the model outputs a falsehood while the internal probe indicates knowledge of the truth (the signature of deception under the Representation-based account).
      *   *Sycophancy Test:* Prompt models with user misconceptions. If the model agrees with the misconception while internal probes indicate knowledge of the correction, this supports the classification of sycophancy as deception rather than honest error.

  **Expected Outcomes and Impact**
  A successful project will yield a formal specification for "AI Honesty" that can be adopted by alignment teams.
  1.  **For Evals:** A shift from accuracy-based metrics to consistency-based metrics (e.g., output-vs.-internal-state divergence).
  2.  **For Training:** Clearer loss function targets. If sycophancy is deception, we penalize output-state divergence. If it is distorted belief, we penalize the upstream representation formation.
  3.  **Taxonomy:** A published framework distinguishing *Ignorance* (Honest/Inaccurate), *Truth-telling* (Honest/Accurate), *Lying* (Deceptive/Accurate), and *Bullshitting* (Deceptive/Inaccurate), with specific mitigation strategies for each.

  **Conditions for Failure**
  The project fails if:
  1.  No reconstruction of "belief" yields a distinction between sycophancy and error that is robust across model architectures.
  2.  Empirical probes prove too noisy to serve as a ground truth for "internal belief," rendering the Representation-based account operationally useless.
  3.  The resulting definition of deception is either too strict (flagging all errors as deceptive) or too permissive (missing clear cases of reward-hacking).

  **Justification for Philosophical Approach**
  A reviewer might ask: *Why fund conceptual analysis when we can just build better benchmarks?* The answer is that benchmarks measure *what* is said, not *why*. Without a prior philosophical commitment to what constitutes a "lie" versus a "mistake" in artifacts, we cannot label the data needed to train detectors. Building a "deception detector" requires a definition of deception. Currently, the field is building measurement tools without a theory of the construct being measured. This leads to Goodhart's Law: models optimize for passing the honesty benchmark without becoming honest. This project provides the theoretical substrate required to ensure that future empirical work is measuring the right thing. Philosophy here is not a substitute for engineering; it is the specification document for the engineering.

  **Timeline**
  *   **Months 1-3:** Formalize the three accounts of belief; complete literature mapping (internal).
  *   **Months 4-6:** Conceptual derivation of the Honesty/Deception taxonomy; draft core theoretical paper.
  *   **Months 7-9:** Empirical feasibility study (probing and calibration tests on sycophancy cases).
  *   **Months 10-12:** Synthesis of theoretical and empirical results; final dissertation chapter and policy brief for safety teams.
