      *   *Correction:* Don't say Universalization *is* universal quantification. It's universal quantification over *agents* executing the *same function*.
      *   *Nuance:* The "Logical Contradiction" isn't just a crash; it's a semantic collapse. The word "promise" loses its referent. In CS, this is like changing the API spec mid-execution.
      *   *Nuance:* Korsgaard's reading is often seen as the most robust. In CS terms, it's the most "testable."
      *   *Crucial Point:* The "Description Problem" is indeed an abstraction problem, but it's more like *feature selection* in the state vector. If I exclude "others are lying" from the state vector, the policy looks safe. Kant insists on relevant features; CS insists on *all* state.

  9.  **Final Polish:** Ensure the distinction between "Contradiction in Conception" (Logical/Spec) and "Contradiction in Will" (Practical/Liveness) is sharp.

  *(Self-Correction on "Brainstorm First"):* The prompt asks me to "brainstorm first before writing." I should explicitly include a section that looks like the brainstorming/mapping phase before the polished translation, or integrate it as a "Design Doc" style intro. I'll go with a "System Architecture" section that acts as the brainstorming translation layer.

  *(Wait, one more check)*: "Answer in American English, and don't be diplomatic." Okay, I need to be willing to say "Kant is vague here" or "This is a category error."

  Let's assemble the response.

  *   **Section 1: The Schema (Brainstorming/Mapping).** Define the terms.
