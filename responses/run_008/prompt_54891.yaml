      *   Be direct: "This is a fudge," "This maps cleanly."

  7.  **Final Review against Constraints:**

      *   American English? Yes.
      *   Not diplomatic? Yes.
      *   Brainstorm first? I will structure the initial part as the "Mapping Schema" to show the work.
      *   Cover the three readings? Yes.
