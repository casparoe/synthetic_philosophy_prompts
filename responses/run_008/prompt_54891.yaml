prompt: |-
  I'm a CS grad student who got roped into taking an upper-level ethics course this semester (long story involving a distribution requirement), and we just finished two weeks on the universalizability test in Kant's Groundwork. I mostly followed it, but I keep having this itch that the whole debate would be clearer to me if it were stated in terms I actually use every day. So here's the job: you're someone who's genuinely fluent in both formal methods and moral philosophy, and I want you to translate the debate for me, carefully.

  Specifically, take the standard running example -- the maxim of false promising, i.e., when in need of money, I make a promise I intend to break -- and the main competing readings of what the universalizability test is supposed to detect when you universalize that maxim. I'm thinking of the roughly three families our professor laid out: the one where universalizing the maxim somehow contradicts itself logically (the institution of promising collapses, so the maxim can't be universalized without destroying its own presuppositions); the Korsgaard-style reading where the problem is practical, not logical -- universalized, the maxim defeats the means-end structure it relies on, the maxim becomes ineffective as a way of getting what you want; and the "moralized" reading where you test the maxim against what a community of rational agents could co-endorse. Please brainstorm first before writing, then do the translation into my vocabulary: policies, environments, universal quantification over agents, protocol specs and their preconditions, satisfiability, invariants that hold or break when every process runs the same code, deadlock and starvation analogies, abstraction levels in model checking where a property verifies at one granularity and fails at another. Universalization itself I'm guessing is something like "check the property on the system where all agents run this policy" -- but you tell me if that's the right formalization or if it smuggles something in.

  Then the part I actually care about: the residue report. Which parts of each reading translate cleanly, which need to be bent out of shape to fit (e.g., does the "contradiction in conception" reading really correspond to spec unsatisfiability, or is that a fudge), and which parts have no counterpart in formal-methods vocabulary at all -- I have a suspicion the "relevant description of the maxim" problem, where you can re-describe the false promisor's maxim so it slips through the test, is basically the abstraction-granularity problem, but I'm not sure whether that analogy cuts for Kant or against him. Finally, give me your honest verdict on whether my working intuition -- that the whole test is just universal quantification plus a reachability or effectiveness check dressed up in 18th-century German -- is right, or whether the philosophers are tracking something my vocabulary genuinely can't express. And please flag where your own translation is most likely to fail or where you'd have to give a different answer if some interpretive choice went the other way; if there's a consideration that would flip your verdict, say what it is. Answer in American English, and don't be diplomatic -- if part of Kant's test is just doing badly what a model checker does precisely, say so.
