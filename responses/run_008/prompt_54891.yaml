  2.  **Deconstruct the Kantian Concepts & Map to CS:**

      *   **Maxim:** A policy or algorithm an agent runs. $P(agent, state) \rightarrow Action$.
      *   **Universalization:** Deploying this policy to *all* agents in the system. $\forall a \in Agents, Policy_a = P$.
      *   **False Promising Maxim:** "If I need money ($Condition$), I will promise to repay ($Action$) intending not to ($Intent$)."
      *   **Contradiction in Conception (Logical):** If everyone runs $P$, the precondition for $P$ to work (trust in promises) becomes false. The system state required for the action to have its defined semantic meaning no longer exists.
          *   *CS Map:* Protocol precondition violation. The API contract breaks. The function `promise()` throws an exception or returns `null` because the underlying consensus mechanism (trust) has forked/collapsed. Unsatisfiable specification.
      *   **Contradiction in Will (Practical/Korsgaard):** I can *conceive* the world, but I cannot *will* it because it defeats my purpose.
          *   *CS Map:* Liveness property failure. Deadlock. The goal state (getting money) becomes unreachable ($AG \neg Goal$) if everyone runs $P$. The policy is ineffective.
      *   **Moralized/Co-endorsement:** Could rational agents agree to this protocol?
          *   *CS Map:* Mechanism Design / Game Theory. Nash Equilibrium. Is this protocol stable? Would agents sign the SLA?

  3.  **Brainstorming the "Residue" (The Hard Parts):**

      *   *The Description Problem:* How do you define the input to the function? If I define the maxim as "Lie when *I* need money and *no one else* does," universalization doesn't kill it.
          *   *CS Map:* Abstraction granularity / State space partitioning. Overfitting the policy to the current state. In model checking, this is like hardcoding process IDs ($P_1$ lies, others tell truth). Universalization requires symmetry ($\forall i, P_i = P$). The philosophical debate is about *which* variables are allowed in the policy signature.
      *   *Intent vs. Output:* Kant cares about the *intent* (intending to break). CS usually cares about observable behavior.
          *   *CS Map:* Internal state vs. I/O logs. Model checking usually verifies traces. Verifying "intent" requires access to private memory variables not exposed in the trace.
      *   *Normativity:* CS says "This crashes." Kant says "This is *wrong*."
          *   *CS Map:* The "ought" is missing. CS describes *what happens*. Kant prescribes *what should be run*. The translation maps the *test*, not the *force* of the test.

  4.  **Drafting the Translation (Iterative refinement):**

      *   *Universalization:* It's not just $\forall$. It's a system-wide deployment. `deploy(policy, all_nodes)`.
