answer: |-
  1. In the drought scenario, a strict egalitarian must welcome Lever B because it reduces inequality by harming the better-off, even though no one gains water. This reveals the leveling-down objection: egalitarianism values equality even when it makes things worse for some and better for none.
  2. Prioritarianism avoids this because it values weighted well-being, not relative gaps, so harming the better-off without benefiting anyone yields no moral gain. Since Lever B lowers total priority-weighted value by harming some without helping others, the prioritarian rejects it based solely on her core formula.
  3. Critics contend the advantage is rhetorical because prioritarians might still sacrifice overall welfare for tiny gains to the worse-off, mirroring egalitarian excesses. Yet regarding leveling down specifically, the prioritarian calculation yields a negative value for Lever B without requiring auxiliary person-affecting constraints.
  4. The advantage is real rather than rhetorical because the theory structurally cannot recommend making someone worse off unless it benefits someone else even more weightily. This structural feature means the refusal of Lever B is internal to the view, unlike egalitarianism which requires a separate principle to avoid leveling down.
  5. Therefore, prioritarianism escapes the objection cleanly enough to be worth adopting because it preserves the egalitarian intuition of helping the worse-off without endorsing the absurdity of harmful leveling. The leveling-down objection devastates egalitarianism but leaves prioritarianism intact as a superior distributive principle.
