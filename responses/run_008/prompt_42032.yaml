      *   Identify prejudices? Yes.
      *   Brief scorecard at the end? Yes.
      *   Table for scorecard? Yes.

  8.  **Drafting the Response (Mental or Scratchpad):**
      *   *Desideratum 1:* Consistency. (Non-negotiable).
