prompt: |-
  I'm writing a term paper for a philosophy of science course on Hempel's raven paradox, and every source I find does the same thing: two paragraphs of setup, then straight to "the Bayesian says a white shoe is evidence, just a very small amount, because non-black things outnumber ravens so much" — and then it just stops, like that obviously settles it. It doesn't, or at least I can't tell whether it does, because I've never seen anyone state what a solution is supposed to accomplish in the first place. So before I pick a side, write me the list of desiderata: what any adequate resolution of the paradox has to deliver, with the case behind each one. For instance — does a solution owe me an explanation of why the white shoe *feels* like no evidence at all, and if it keeps Nicod's criterion (observing a black raven confirms "all ravens are black") intact or is allowed to jettison it, does it owe me a story about why jettisoning it isn't just giving up the data? My hunch, from how the paradox is generated, is that Nicod's criterion and the equivalence condition for contrapositives can't both be held — if that's right, or if some other subset of the desiderata is jointly unsatisfiable, I really want that said plainly, because then the list itself is basically the paper.

  A few more things I'd want on the list, but you tell me if they belong: something about total evidence (the "tiny increment" solution seems to quietly change the subject from what an observation does to a hypothesis in the abstract to what it does given a sampling story — is that legitimate or a dodge?); whether the solution has to generalize to Hempel's own less-silly example, which I half remember as something like all sodium salts giving a yellow flame, where nobody thinks a yellow flame off some random non-salt stuff is *evidence* but also nobody finds it paradoxical — if the treatment of the shoe can't say anything about that case, is it just trading on crows being cute?; and whether it has to survive a counterexample my prof sketched once, involving knowing odd facts about raven populations — something like, there are only two kinds of world around, one with a handful of ravens all black, one with way more ravens but exactly one white one among them, and in that setup observing a black raven apparently *disconfirms* the all-black hypothesis (I might be garbling the details, so if you know the setup, reconstruct it and say whether I mangled it). Also mark, for each requirement, whether it's non-negotiable or just a preference of one camp — I suspect the whole field splits over whether the job is "make the paradox go away" versus "explain away the appearance," and I'd like that flagged rather than assumed.

  At the very end, a short scorecard — Hempel's own bite-the-bullet move (accept the equivalence condition, deny Nicod's criterion for these cases), the Bayesian small-increment answer, and the "it only counts as evidence if the object was drawn roughly at random from the relevant population" fix — against the list. But keep that part brief, like a couple sentences each; the requirements are what I want, since those are what my paper is actually going to turn on. A table is fine if it helps. Also feel free to tell me if any of my "requirements" above are actually prejudices dressed up as demands — that's kind of the point of asking.
