  FOR IMMEDIATE RELEASE

  **Global Association of Psychiatric Classification Unveils DCMC-9 and Mandatory Companion Protocol**

  **GENEVA** — The Classification Committee of the Global Association of Psychiatric Classification (GAPC) is pleased to announce the publication of the *Diagnostic Compendium of Mental Conditions*, Ninth Edition (DCMC-9). To ensure maximum diagnostic fidelity and account for demographic shifts observed following the eighth edition, the DCMC-9 will ship with a mandatory companion volume, the *Post-Publication Demographic Impact Report* (PPDIR), updated annually.

  During the review of Edition 8, the Committee observed significant variance in inter-rater reliability correlated with the emergence of new patient populations. Following the dissemination of Edition 8 criteria, support groups coalesced around specific codes, adopting criterion wording as shared terminology. Symptom reports began to suspiciously track the exact phrasing of diagnostic thresholds, and advocacy forums lobbied successfully for lower inclusion thresholds in specific categories. While these developments indicate successful patient engagement, they introduced noise into our reliability statistics. The population appeared to be shifting in response to the classification itself, complicating the isolation of stable traits.

  To address this, the Committee has revised the field trial methodology for DCMC-9. Raters will now be drawn primarily from the classified population themselves. As members of the category, these raters possess intimate familiarity with the phenomenological reality of the diagnosis, ensuring that the criteria accurately capture the experience of having the criteria. This internal validation loop will stabilize the definition against external misinterpretation.

  Naturally, the PPDIR itself constitutes a classification system, categorizing individuals based on their response to the DCMC-8. Consequently, the PPDIR will require its own companion volume, the *PPDIR Impact Assessment*, to document how being documented in the PPDIR alters patient behavior. The Committee accepts this recursive requirement with procedural serenity. The publication schedule is as follows: DCMC editions every seven years; PPDIR volumes annually; PPDIR Impact Assessments quarterly. This ensures that no layer of classification goes unmonitored for its population-creating effects.

  There are, admittedly, complexities unique to our field. One observes with a certain professional envy that chemists do not encounter periodic table elements forming lobbying groups to request reclassification based on atomic weight preferences. Quarks do not read papers about quarks and alter their spin accordingly. We remain committed, however, to applying the same rigorous taxonomic structure to human kinds as is applied to natural kinds, trusting that sufficient documentation will eventually arrest the drift.

  "We have refined the boundaries significantly," said Dr. Elena Voss, Chair of the Classification Committee. "By accounting for the way patients embody our categories, we are confident that DCMC-9 finally captures the underlying reality of these conditions exactly as they are. We have got the categories right."

  The DCMC-9 and accompanying PPDIR volumes are available for institutional licensing immediately.

  **About the Global Association of Psychiatric Classification**
  The GAPC is the leading international body dedicated to the standardization of mental health diagnostics. Founded on the principle that precise language leads to precise care, the Committee continuously revises its manuals to reflect the evolving landscape of human psychology.

  **Media Contact:**
  Julian Kestrel
  Director of Communications
  Global Association of Psychiatric Classification
  press@gapc-int.org
  +41-22-555-0199

