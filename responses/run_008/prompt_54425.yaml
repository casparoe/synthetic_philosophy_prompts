answer: |-
  # Activity Design: The Rule Ledger
  **Course:** Concepts and Analogy (300-Level Seminar)  
  **Topic:** Fluid Concepts & Slippage (Hofstadter/Mitchell)  
  **Time:** 75 Minutes  
  **Students:** 18 (6 Teams of 3)  

  ## 1. Conceptual Overview
  This activity simulates the pressure of the Copycat microdomain without explaining the theory first. Students act as "Lawmakers" attempting to codify transformation rules. The scoring system initially rewards **Stability** (keeping a rule fixed) but later rewards **Adaptability** (slipping the rule). This creates a tangible experience of cognitive dissonance: the strategy that built their early lead becomes the liability that bankrupts them in the final round.

  ## 2. Materials List
  *   **Team Packets (6):** Each contains:
      *   1 "Rule Ledger" (Sheet to track their Active Law and changes).
      *   12 "Case Cards" (The problems, distributed in 3 envelopes).
      *   6 "Voting Tokens" (For the final elegance round).
      *   Red and Green pens.
  *   **Instructor Kit:**
      *   Projector/Board for Scoreboard.
      *   Timer.
      *   "Contestation Cards" (3 total, see Failure Management).
  *   **Room Setup:** 6 clusters of tables.

  ## 3. The Scoring Scheme: "Stability vs. Elegance"
  The game has two phases with conflicting incentive structures.

  **Phase 1 (Rounds 1 & 2): The Stability Bonus**
  *   **Correct Answer:** +10 points.
  *   **Stability Bonus:** +5 points if your *stated rule* is identical to the previous item.
  *   **Slippage Penalty:** -5 points if you change your *stated rule* description.
  *   *Goal:* Encourage students to dig in and defend a rigid description.

  **Phase 2 (Round 3): The Elegance Override**
  *   **Correct Answer:** +10 points.
  *   **Stability Bonus:** **Removed.**
  *   **Elegance Vote:** After Round 3, teams anonymously vote on which *other* team's Rule Ledger shows the most "Conceptual Grace."
  *   **Payoff:** The top 2 voted teams receive +20 points. The bottom 2 receive -10 points.
  *   *Goal:* Punish rigid rules that "work" technically but feel forced; reward rules that slipped gracefully.

  ## 4. The Item Set (12 Cases)
  *Distribute in 3 Envelopes (4 items each). Do not reveal future items.*

  ### Envelope 1: The Mechanical Baseline
  *Designed to build confidence in a simple "Rightmost Successor" rule.*
  1.  `abc → abd` :: `ijk → ?` (**Answer:** `ijl`)
  2.  `fgh → fgi` :: `nop → ?` (**Answer:** `noq`)
  3.  `rst → rsu` :: `def → ?` (**Answer:** `deg`)
  4.  `lmn → lmo` :: `tuv → ?` (**Answer:** `tuw`)
      *   *Expected Rule:* "Change the rightmost letter to its alphabetic successor."

  ### Envelope 2: The Boundary Break
  *Designed to break the "Successor" rule or force a clumsy exception.*
  5.  `abc → abd` :: `xyz → ?` (**Answer:** `xya` OR `wyz` OR `xyz`)
      *   *Contested:* `xya` (Wrap) is standard Copycat. `wyz` (Predecessor slip) is elegant but rare. `xyz` (No change) is literal.
  6.  `abc → abd` :: `ppp → ?` (**Answer:** `ppq`)
      *   *Trap:* Does "rightmost letter" mean the physical position or the group?
  7.  `abc → abd` :: `cba → ?` (**Answer:** `cbd`)
      *   *Trap:* Directionality. Is 'a' still the rightmost, or is it the 'first'?
  8.  `abc → abd` :: `ddddd → ?` (**Answer:** `ddede` OR `ddddd`)
      *   *Trap:* Sameness pressure. Changing one 'd' breaks the symmetry.

  ### Envelope 3: The Structural Slip
  *Designed to require group-level concepts. Rigid letter-rules fail here.*
  9.  `aabbcc → aabbcd` :: `mmrrjj → ?` (**Answer:** `mmrrjk`)
      *   *Slippage:* "Rightmost letter" must slip to "Rightmost group."
  10. `abc → cba` :: `ijk → ?` (**Answer:** `kji`)
      *   *Slippage:* "Successor" must slip to "Reversal" based on the *relation* of the first pair.
  11. `abc → abd` :: `ace → ?` (**Answer:** `acf` OR `acd`)
      *   *Slippage:* Skipping letters (intervals) vs. absolute position.
  12. `mrrjjj → mrrjjjj` :: `abbccc → ?` (**Answer:** `abbcccc`)
      *   *Slippage:* Group length successor. A rigid "change last letter" rule yields `abbcccd`, which feels wrong.

  ## 5. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Form teams. Distribute Envelope 1 & Rule Ledgers. Explain Scoring (Phase 1 only). Emphasize: *"Your goal is to maximize points. Consistency is rewarded."* |
  | **10-25** | **Round 1** | Teams solve Envelope 1 (Items 1-4). They must write the Answer *and* the Active Law in the Ledger. Instructor tallies scores publicly. |
  | **25-30** | **Transition** | Distribute Envelope 2. **Do not change scoring rules yet.** Let them expect more Stability Bonuses. |
  | **30-45** | **Round 2** | Teams solve Envelope 2 (Items 5-8). Watch for frustration on Item 5 (`xyz`). Teams will debate: Stick to the rule (get 0 on answer) or Slip the rule (lose Stability points)? |
  | **45-50** | **The Twist** | Distribute Envelope 3. **Announce Phase 2 Scoring:** Stability Bonus is gone. Elegance Vote introduced. |
  | **50-65** | **Round 3** | Teams solve Envelope 3 (Items 9-12). Rigid teams will struggle to justify answers. Fluid teams will rewrite laws freely. |
  | **65-70** | **Voting** | Teams swap Ledgers. Anonymous vote on "Conceptual Grace." Tally final scores. |
  | **70-75** | **Debrief** | Connect game experience to Fluid Concepts theory (see below). |

  ## 6. Debrief Guide: Mapping Experience to Theory
  *Do not lecture. Ask questions that map their frustration to the concepts.*

  1.  **The Cost of Slippage:** "In Round 2, who lost points because they changed their rule? How did that feel?"
      *   *Map:* This is **Cognitive Resistance**. Concepts have inertia. We prefer to stretch an old concept (e.g., 'successor' at the end of the alphabet) rather than create a new one ('wrap-around') because the old one is cheaper.
  2.  **The Failure of Rigidity:** "Who stuck with 'Rightmost Successor' through Item 12? Did your answer feel right?"
      *   *Map:* This is **Description Blocking**. When the domain shifts (from letters to groups), a rigid description blinds you to the relevant structure. You got the 'mechanical' answer, but missed the 'analogy'.
  3.  **The Elegance Vote:** "Why did Team X win the vote? Their rule changed three times."
      *   *Map:* This is **Fluidity**. Intelligence isn't consistency; it's the ability to let go of a description when the context demands it. The 'elegant' answer felt forced on you because the *problem* forced the concept to slip, not because you chose it arbitrarily.
  4.  **The Gap (Crucial):** "In this game, you argued about slippage out loud. In your head, does this feel like a debate?"
      *   *Map:* No. In cognition, this happens in milliseconds, below consciousness. You didn't 'decide' to see `mrrjjj` as groups; your perception *snapped*. Today we made the snap visible. Next week we read the theory that explains the mechanism.

  ## 7. Predicted Failures & Handling Strategies

  ### Failure 1: The "Gaming the Vote" Problem
  *Prediction:* Teams will collude to vote for each other, or vote based on friendship rather than rule elegance.
  *Handling:*
  1.  **Anonymize:** Collect Ledgers, shuffle them, and redistribute. Teams vote on the *Ledger ID*, not the Team Name.
  2.  **The "Justification" Constraint:** Tell students: "You are voting on the *Rule Ledger*, not the Answer. If the rule looks clunky (e.g., 'Do X unless it's xyz, then do Y'), do not vote for it."
  3.  **Instructor Veto:** Reserve the right to nullify a vote if a team clearly voted for a "friend" ledger that was objectively rigid. Frame it as "Judging the Judge."

  ### Failure 2: The "One Right Answer" Demand
  *Prediction:* On Item 5 (`xyz → ?`), a team will demand to know the *true* answer. They will argue that `xya` is wrong and `wyz` is right, stalling the game.
  *Handling:*
  1.  **The Contestation Card:** Each class gets only 3 Contestation Cards. If a team wants to challenge a Key, they must play a Card.
  2.  **The Burden of Proof:** To win the challenge, they must prove their answer works for *all previous items* without modification. Usually, the `wyz` (predecessor) answer fails on Item 1 (`abc → abd` is not a predecessor shift).
  3.  **The Professor's Shield:** If they persist, say: "In Copycat, the answer is determined by the consensus of the system. For this game, `xya` is the Key. Your job is not to defeat the Key, but to write a Rule that makes the Key feel inevitable." This shifts focus from *truth* to *justification*.

  ## 8. The Limitation: Explicit vs. Implicit Slippage
  *Be frank about this in the final 2 minutes.*

  **The Gap:**
  "In this game, slippage was **expensive** (you lost points) and **explicit** (you wrote it down). You negotiated it like a contract. In your actual mind, slippage is **cheap** and **implicit**. You don't argue with yourself about whether `xyz` wraps to `a`; you just perceive it or you don't. The 'resistance' you felt today is usually a millisecond latency in neural firing."

  **The Gesture:**
  "Why play the game then? Because the *structure* of the resistance is the same. You felt the pull of the old rule (`successor`) even when it broke. You felt the relief when a new concept (`group`) clicked. That feeling of 'clicking' is what we study. The game slowed down time so you could see the mechanism that usually runs too fast to notice."

  ## 9. Instructor Answer Key & Notes (Confidential)

  | Item | Problem | Standard Key | Contested/Notes |
  | :--- | :--- | :--- | :--- |
  | 1 | `ijk → ?` | `ijl` | Baseline. |
  | 2 | `nop → ?` | `noq` | Baseline. |
  | 3 | `def → ?` | `deg` | Baseline. |
  | 4 | `tuv → ?` | `tuw` | Baseline. |
  | 5 | `xyz → ?` | `xya` | **High Contestation.** `wyz` implies rule slipped to 'predecessor'. `xyz` implies 'no successor'. `xya` implies 'cycle'. Reward `xya` for consistency with 'successor'. |
  | 6 | `ppp → ?` | `ppq` | If they say `ppp`, they prioritized 'sameness' over 'successor'. Acceptable if justified. |
  | 7 | `cba → ?` | `cbd` | Tests if 'rightmost' is positional or ordinal. |
  | 8 | `ddddd → ?` | `ddede` | High resistance. Many will say `ddddd`. |
  | 9 | `mmrrjj → ?` | `mmrrjk` | **Critical Slip.** Rule must move from Letter to Group. `mmrrjk` changes 'j' to 'k'. `mmrrjjj` (group successor) is also valid but harder. |
  | 10 | `ijk → ?` | `kji` | Rule must slip from 'change' to 'reverse'. |
  | 11 | `ace → ?` | `acf` | Interval successor (skip 1). |
  | 12 | `abbccc → ?` | `abbcccc` | **Group Length.** Rigid rule gives `abbcccd`. Elegant rule gives `abbcccc`. |

  **Scoring Tip:** In Round 3, if a team produces the "Rigid" answer (e.g., `abbcccd` for #12) but justifies it with a complex exception clause, give them the Answer Points but ensure they lose the Elegance Vote. If they produce the "Fluid" answer (`abbcccc`) with a simple Group Rule, they win the Game.
