answer: |-
  No, the slogan cannot bear the objective weight your editor is placing on it as a guarantee of historical resolution, because it functions as a call to agency rather than a law of physics.

  Here is a menu of the specific claims packed into that sentence, separated by their logical structure, truth value, and implication for your ending.

  **1. The Teleological Claim (Providence)**
  *   **The Claim:** History has an inherent DNA or divine direction that inevitably moves toward justice, regardless of human action.
  *   **Plausibility:** Low. This is a theological or Hegelian assertion, not an observable fact. There is no evidence that the universe cares about human morality; entropy suggests the opposite.
  *   **Implication for Your Ending:** If you use this to justify the ending, you are writing a religious allegory, not a family saga. It makes the granddaughter's victory feel predestined rather than earned. This validates your "cheap" instinct: if justice is inevitable, the grandfather's suffering and the granddaughter's protest lose their stakes.

  **2. The Empirical Claim (Data)**
  *   **The Claim:** If you measure human suffering and rights over a sufficiently long timeline (centuries), the net trend line is positive.
  *   **Plausibility:** Contested. While some metrics (literacy, violence rates) show improvement, others (climate, inequality, genocide) do not. The word "long" does all the work here; it allows any current atrocity to be dismissed as a temporary blip.
  *   **Implication for Your Ending:** This requires your novel to ignore immediate reality for a distant future. If the ending suggests the arc has *completed* its bend at this specific protest, the empirical claim fails. History shows justice is never "finally answered for"; it is only temporarily won.

  **3. The Survivorship Bias Claim (Selection)**
  *   **The Claim:** We perceive the arc bending because we only tell stories about the movements that succeeded; we forget the ones that were crushed.
  *   **Plausibility:** High. This is a cognitive error. We remember the Civil Rights Act, not the destroyed careers of the activists who didn't make the headlines.
  *   **Implication for Your Ending:** This supports your pessimist grandfather. If you write the hopeful ending, you are replicating the bias: selecting a moment of hope while ignoring the likelihood of backlash or failure. It makes the novel feel like propaganda rather than truth.

  **4. The Performative Claim (Agency)**
  *   **The Claim:** The arc does not bend on its own; it bends only because people grab it and pull. The sentence is an instruction, not a description.
  *   **Plausibility:** High. This aligns with MLK's actual usage. He often paired the line with warnings that progress is never permanent and requires constant struggle.
  *   **Implication for Your Ending:** This is the only reading that supports hope without lying. However, it contradicts your editor's specific vision of things being "finally answered for." A honest ending based on this claim shows the granddaughter joining the work, not witnessing the completion of it. She inherits the struggle, not the victory.

  **5. The Therapeutic Claim (Morale)**
  *   **The Claim:** The statement is not meant to be true or false; it is a tool to prevent despair and keep activists in the street.
  *   **Plausibility:** High. It functions as a mantra or prayer.
  *   **Implication for Your Ending:** Valid for interiority, invalid for plot resolution. The granddaughter can *feel* this hope to sustain herself, but the narrative cannot confirm it as objective reality. If the narration confirms it, you break the contract with the reader who knows history is messy.

  **6. The Generational Claim (Debt)**
  *   **The Claim:** Justice is intergenerational; one generation plants trees under whose shade they will never sit.
  *   **Plausibility:** High. This fits the three-generation structure of your novel.
  *   **Implication for Your Ending:** This undermines the "finally" in your editor's pitch. It suggests the grandfather planted seeds, the parent watered them (or failed to), and the granddaughter sees sprouts—but the harvest is for someone else. This offers hope without closure, which may be the compromise you need.

  **The Verdict for Your Argument**
  The strongest reading is the **Performative Claim**, but it contradicts your editor's desire for closure. MLK's quote is about *process*, not *outcome*. If you write an ending where the protest feels like a finish line, you are treating the slogan as a **Teleological Claim**, which is historically dishonest and narratively weak. If you write an ending where the protest is a continuation of the grandfather's unresolved struggle, you honor the **Performative** and **Generational** readings. That gives you hope without the cheapness.
