answer: |-
  This is a fantastic puzzle because it sits right at the intersection of metaphysics, law, and ethics. You have correctly identified a classic philosophical problem known as **The Constitution Relation** (often illustrated by "The Statue and the Clay"), but you are also asking a pragmatic question about property rights.

  Here is the breakdown of why the metaphysics matters less than you think, how the law actually handles this, and why the "smashing" test reveals the flaw in the school's logic.

  ### 1. The Metaphysics: One Thing or Two?
  You asked if we need to settle whether there is one object or two to decide ownership. Philosophers have argued about this for decades.

  *   **The Identity View (One Object):** This view holds that the statue and the lump of clay are numerically identical. They are the same object, just described differently. If this is true, the school's logic holds water: if they own the clay, they own the statue, because $A = B$.
  *   **The Constitution View (Two Objects):** This view (championed by philosophers like Lynne Rudder Baker) holds that the lump *constitutes* the statue, but they are not identical. They have different "persistence conditions." The lump can survive being squashed; the statue cannot. Therefore, they are distinct entities sharing the same space.

  **The Smashing Test:**
  Your intuition about smashing the statue is the standard philosophical test for this.
  *   If she smashes the statue, the **statue** ceases to exist.
  *   The **clay** continues to exist.
  *   If two things have different survival conditions (one dies when smashed, the other lives), they cannot be the same object.
  *   **Conclusion:** Metaphysically, the Constitution View is generally preferred. The clay survived the sculpting; it merely changed arrangement. Therefore, the statue is a *new* object constituted by the old object (the clay).

  ### 2. The Law: Does it Care About Metaphysics?
  Here is the most important answer to your question: **No, the law does not wait for metaphysicians to finish arguing.**

  Legal systems have dealt with this exact scenario for over 2,000 years, dating back to Roman Law. The doctrine is called **Specificatio** (creation of a new thing).

  *   **The Rule of Specificatio:** If someone uses materials belonging to another to create a *new* thing (wine from grapes, a statue from clay), who owns the result?
  *   **The Proculian View (Roman Law):** If the new thing cannot be reduced to its original materials, the creator owns it. If it *can* be reduced (like a clay statue back to a lump), the original owner retains rights.
  *   **The Modern Legal Approach:** Modern law generally favors the **creator**, but with a massive caveat: **Unjust Enrichment.**

  The law recognizes that while the school owned the *materials*, the student created the *value*. If the school claims the statue, they are claiming the value of the student's labor without paying for it. This is legally problematic.

  **The Principled Solution (Without Metaphysics):**
  You do not need to decide if the statue *is* the clay to decide who owns the statue. You only need to decide what **interest** the school has.
  *   The school's interest is **financial** (recouping the cost of materials).
  *   The student's interest is **proprietary and moral** (ownership of her creative output).

  The law typically resolves this by granting the school a **lien** or a **security interest**, not title. The school is entitled to be paid back the cost of the clay *from the proceeds of the sale*, but they do not own the artwork itself.

  ### 3. Why the School's Position is Weak
  The school argues: "The statue just IS the lump of clay we paid for."

  This fails on two fronts, one metaphysical and one legal:

  1.  **Metaphysical Failure:** As your smashing test showed, the statue has properties the clay did not have (aesthetic value, form, fragility). The clay was a raw material; the statue is a finished good. Treating them as identical ignores the transformation of value.
  2.  **Legal Failure (Accession):** In property law, when labor adds significant value to raw materials, ownership often shifts to the laborer to prevent the material owner from being "unjustly enriched." If the clay cost $\$50$ and the statue sells for $\$5,000$, for the school to claim the statue is to claim $\$4,950$ of value they did not pay for.

  ### 4. Would Philosophers Disagree on the Verdict?
  You asked if people who argue about this kind of case would disagree about the verdict.

  *   **Metaphysicians:** They would disagree fiercely about *what* is in the studio. A Quinean might say there is only one object. A Constitution theorist says there are two.
  *   **Legal Philosophers / Ethicists:** They would likely **agree on the verdict**, even if they disagree on the metaphysics.
      *   A **Lockean** (labor theory of property) would say: She mixed her labor with the clay; therefore, it is hers, minus the cost of materials.
      *   A **Utilitarian** would say: Giving ownership to the student incentivizes art creation. Giving ownership to the school discourages students from using grant materials.
      *   A **Contractualist** would look at the rule: "Belongs to the school until she pays them back." This implies a debt, not a transfer of title to the final product. You pay back the *value* of the materials, you don't surrender the *product*.

  ### 5. The "Smashing" Loophole
  You asked: *"She could smash the statue back into a lump, hand that to the school, and say she's returning their property intact. Does that even make sense?"*

  Metaphysically? **Yes.** She has returned the constituting matter.
  Legally? **No.** This would likely be considered **"Waste."**

  Even if the school only owns the clay, the student has a duty of care regarding the materials while they are in her possession. Intentionally destroying the value of the object (even if she technically owns the "statue" part) to satisfy a debt on the "clay" part is a breach of good faith. She would be liable for the difference in value.

  ### Summary: How to Sort This Out
  There is a principled way to sort this out without settling the metaphysics. It relies on distinguishing between **Title** (Ownership) and **Encumbrance** (Debt).

  1.  **The Student owns the Statue.** She created a new entity with new value. The metaphysical transformation (clay to art) transfers title to the creator under the doctrine of *specificatio*.
  2.  **The School holds a Lien.** The school's rule creates a debt obligation. They have a security interest in the *proceeds* of the sale up to the cost of the materials.
  3.  **The Verdict:** The gallery buys the statue from the **sister**. The sister pays the **school** the cost of the clay from the sale money. The sister keeps the profit.

  **Why this works:**
  *   It respects the metaphysics (the statue is a new thing).
  *   It respects the school's rule (materials must be paid for).
  *   It respects labor rights (the student isn't working for free).

  The school is trying to conflate **ownership of materials** with **ownership of the product**. In almost every industry (manufacturing, art, construction), if you buy wood to build a chair, the carpenter owns the chair, not the lumber yard. The school's position is an overreach that confuses a security interest with a property right.

  **Advice for your sister:** She should propose to sell the statue, remit the exact cost of the clay to the school immediately upon sale, and keep the rest. If the school refuses, they are effectively claiming ownership of her labor, which is likely unenforceable and certainly unethical.
