      *   *Verdict:* Suppress the Council's intolerance. Why? Because the Council is the *State*. The State cannot be intolerant of protected classes without violating the "procedural framework" of equal citizenship. Unlike the anti-election party (which wants to end the game), the Council is *rigging the game* against a minority.
