      *Proposed Principle:* **The Principle of Democratic Self-Defense with Institutional Constraints.**
      *   *Core:* The state's monopoly on violence/coercion must be used *only* to preserve the procedural framework of democracy, and *only* when doing so doesn't destroy the legitimacy of that framework. Private/Associational bodies have wider latitude to curate their environments but less power to coerce.
      *   *Clause 1 (State Coercion):* The state may only suppress political organization when it is both *anti-democratic* AND *pre-democratic* (i.e., hasn't yet captured democratic legitimacy). Once a movement is democratically entrenched, the remedy must be political, not legal. (Captures Case 1 vs. Case 2).
      *   *Clause 2 (Private/Institutional):* Non-state actors (platforms, unis) may restrict speech to maintain their specific function/safety, provided they don't claim state authority. (Captures Case 3, 5 vs. Case 6).
      *   *Clause 3 (Pragmatic Stability):* Enforcement is bounded by the risk of catastrophic systemic collapse. (Captures the "Brawling Movement" intuition).

