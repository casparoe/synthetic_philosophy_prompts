answer: |-
  Here is a complete lesson plan designed for your 80-minute seminar. It is structured to force the Gibbard–Satterthwaite impossibility result to emerge from student experimentation before you formally state it.

  ### 1. Logistics and Group Structure
  *   **Class Size:** 14 students.
  *   **Grouping:** 4 Groups (two groups of 3, two groups of 4).
  *   **Room Setup:** Groups should be spaced apart to allow private design discussion.
  *   **Materials:** Whiteboard (for constraints and scoreboard), handouts or shared doc for rule submission, scratch paper for attackers.

  ### 2. The Constraints (Board Text)
  Post this exactly as written before class starts. Do not explain the *why* yet; treat these as the "Laws of Physics" for the activity.

  > **THE CHALLENGE: Design a Social Choice Function (SCF)**
  >
  > **Parameters:**
  > 1.  **Alternatives:** Exactly $A = \{a, b, c\}$.
  > 2.  **Voters:** Exactly $N = \{1, 2, 3\}$.
  > 3.  **Domain:** All strict preference orderings over $A$ are admissible.
  >
  > **Requirements (Your Rule Must Satisfy All):**
  > 1.  **Surjectivity:** Every alternative ($a, b,$ and $c$) must be the winner for at least one preference profile.
  > 2.  **Non-Dictatorship:** There is no voter $i$ such that, for *every* profile, the outcome is $i$'s top-ranked alternative.
  > 3.  **Strategy-Proofness:** For every voter, every profile, and every possible lie, truth-telling yields an outcome that is at least as good as lying. (No strict gain from manipulation).
  > 4.  **Determinism:** The rule must output a single winner. No coin flips, lotteries, or "random selection."
  >
  > **Submission:** Your rule must be an algorithm (if-then statements, point systems, etc.), not a process ("we discuss until we agree").

  ### 3. Activity Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Explain constraints, scoring, and groups. Emphasize: *"I will not tell you if your rule is possible. You must find out."* |
  | **10–35** | **Design** | Groups draft their SCF. Instructor circulates to ensure rules are algorithms (reject "we negotiate"). |
  | **35–40** | **Swap** | Groups submit rules. Instructor assigns each group a *rival* rule to attack (e.g., G1 attacks G2). |
  | **40–70** | **Attack** | Attackers search for a **Manipulation** (a profile + a lie that helps) or a **Dictator** (proof one voter always wins). |
  | **70–80** | **Debrief** | Scoreboard tally. Map failures to theory. State Gibbard–Satterthwaite. |

  ### 4. Incentive & Scoring System
  To keep energy high without money, use "Publication Points."

  *   **Designer Points (1 pt):** Awarded if your rule survives the Attack Phase without a *valid* counter-example found by the rival group.
  *   **Attacker Points (2 pts):** Awarded for every *valid* manipulation or dictatorship proof submitted and verified by the instructor.
  *   **The "Peer Review" Bonus:** If Group A finds a flaw in Group B's rule, Group B gets a chance to "patch" it. If the patch fails immediately, Group A gets +1 bonus point.
  *   **Scoreboard:** Keep a running tally on the board.

  ### 5. Referee Guide: Handling Loopholes & Disputes
  You are the Supreme Court. Your rulings must be swift to preserve time.

  **A. The Randomization Loophole**
  *   *Student Move:* "What if we flip a coin between the top two?"
  *   *Ruling:* **Invalid.** Cite Constraint 4 (Determinism).
  *   *Teaching Note:* Save the explanation for debrief. GS applies to deterministic SCFs. (Probabilistic social choice has its own impossibility results, but that muddies the water today).

  **B. The Tie-Breaking "Chair"**
  *   *Student Move:* "Majority rule, but if there's a cycle, Voter 1 decides."
  *   *Ruling:* **Valid Submission,** but highly vulnerable to Attack.
  *   *Teaching Note:* This is the critical moment. If attackers can construct a profile where Voter 1's *mere presence* as tie-breaker forces the outcome to be their top choice (even without a formal cycle), Voter 1 is a dictator.
  *   *Specific Trap:* If the rule is "Voter 1 picks unless Voters 2 & 3 agree on something else," Voter 1 is a dictator. Attackers should look for profiles where 2 & 3 disagree, handing power to 1.

  **C. Vague Rules ("Deliberation")**
  *   *Student Move:* "The voters talk until they find a consensus."
  *   *Ruling:* **Invalid.** Not a function. An SCF maps profiles to outcomes mechanically.
  *   *Correction:* "Write down the algorithm that simulates the talk." (They will realize the algorithm either creates a dictator or allows lying).

  **D. Weak vs. Strict Manipulation**
  *   *Student Move:* Attacker shows a lie that results in the *same* winner.
  *   *Ruling:* **Invalid Attack.** Manipulation requires a *strict* improvement ($u_i(outcome_{lie}) > u_i(outcome_{truth})$).
  *   *Correction:* Remind them Strategy-Proofness allows indifference, but forbids strict gain.

  ### 6. Predictable Failure Modes & Instructor Interventions

  1.  **The Plurality/Borda Trap:**
      *   *Expectation:* Groups will propose Plurality or Borda Count.
      *   *Failure:* Attackers will easily find "Compromising" (voting for 2nd choice to beat worst choice) or "Burying" (ranking a strong rival last).
      *   *Intervention:* None. Let them fail. This builds intuition for *why* SP is hard.

  2.  **The Serial Dictatorship Trap:**
      *   *Expectation:* A sophisticated group will propose: *"Voter 1 gets their top choice. If tied, Voter 2 decides..."*
      *   *Failure:* Since preferences are strict, Voter 1 *always* gets their top choice.
      *   *Intervention:* If attackers miss this, you must point it out during scoring. "Does Voter 1 get their top choice in *every* profile? Yes? Then Constraint 2 (Non-Dictatorship) is violated."
      *   *Significance:* This proves the GS theorem's conclusion: The only SP rules *are* dictatorial.

  3.  **The "Relitigating Constraints" Delay:**
      *   *Expectation:* Groups spend 10 minutes arguing if 3 alternatives is "fair."
      *   *Intervention:* "Constraints are exogenous parameters. You are engineers, not legislators. Build within the specs."

  4.  **The "Too Complex to Attack" Defense:**
      *   *Expectation:* A group writes a 2-page conditional algorithm.
      *   *Intervention:* "If your rule cannot be tested by your peers in 25 minutes, it is not a viable mechanism. Simplify or forfeit Designer Points."

  ### 7. The Debrief & Theorem Handoff (Minutes 70–80)

  **Step 1: The Tally (3 mins)**
  Announce the winners. Acknowledge that *no group* likely satisfied all constraints simultaneously.
  *   *Script:* "Look at the scoreboard. The groups that satisfied Non-Dictatorship were manipulated. The groups that satisfied Strategy-Proofness turned out to be Dictatorships. You have empirically discovered an impossibility."

  **Step 2: Mapping Failures to Pathologies (5 mins)**
  Draw three columns on the board: **Rule Type**, **Failure Mode**, **GS Concept**.
  *   *Plurality/Borda* $\rightarrow$ *Tactical Voting* $\rightarrow$ **Violation of Strategy-Proofness**.
  *   *Serial Dictatorship* $\rightarrow$ *Voter 1 always wins* $\rightarrow$ **Violation of Non-Dictatorship**.
  *   *Random/Tie-Break* $\rightarrow$ *Non-Deterministic or Hidden Dictator* $\rightarrow$ **Violation of Domain/Range constraints**.

  **Step 3: The Handoff to Theory (5 mins)**
  This is the critical transition from activity to lecture.
  *   *Script:* "You tested maybe 5 or 6 rules today. You found they all broke. But science requires more than a sample size of 5. We need to know if *every possible rule* breaks."
  *   *Action:* Write the **Gibbard–Satterthwaite Theorem** on the board.
      > **Theorem:** For any social choice function with $\ge 3$ alternatives and unrestricted domain: If the rule is **Surjective** and **Strategy-Proof**, it must be **Dictatorial**.
  *   *Explanation:* "Your activity fixed 'Non-Dictatorial' as a requirement and found you lost 'Strategy-Proofness.' The theorem says you can't have both. You can have SP, but only if you accept a Dictator (as the Serial Dictatorship group found)."
  *   *Sketch of Proof Logic:* Briefly mention **Monotonicity**. "The proof works by showing that if a rule is SP, it must be 'monotonic' (if a winner gains support, they should still win). If you force monotonicity + surjectivity across all profiles, the math forces one voter to have veto power over every pair, which cascades into dictatorship."

  **Step 4: Limitations of the Exercise (2 mins)**
  Be honest about what the activity didn't show.
  *   *Scope:* "You tested 3 voters. Theorem holds for any $N \ge 2$."
  *   *Domain:* "You assumed strict preferences. Theorem holds for weak orders too (with tweaks)."
  *   *Infinity:* "You checked specific profiles. The theorem checks the *entire domain* of infinite profiles. That is why we need the proof, not just the activity."

  ### 8. Instructor's "Cheat Sheet" for Common Student Rules

  | Student Rule | Likely Attack | GS Lesson |
  | :--- | :--- | :--- |
  | **Plurality** | Voter 1 prefers $a \succ b \succ c$. Sees $b$ leading. Votes $b$. | **Compromising.** SP fails. |
  | **Borda Count** | Voter 1 prefers $a \succ b \succ c$. Sees $b$ as threat. Ranks $c$ last ($a \succ c \succ b$). | **Burying.** SP fails. |
  | **Pairwise Majority** | Construct a Condorcet Cycle ($a>b>c>a$). Rule must have tie-break. | **Cycles.** Tie-break often creates Dictator or SP failure. |
  | **Serial Dictatorship** | Check Profile where V1 wants $a$. Outcome is $a$. Check all profiles. | **Dictatorship.** SP holds, but Non-Dictatorship fails. |
  | **Veto Rule** | Each vetoes one. Last standing wins. | **Manipulation.** Veto your strongest competitor, not your least favorite. |

  ### 9. Why This Works
  This session inverts the traditional lecture. Instead of you proving impossibility and them accepting it, they attempt construction and fail. When you finally state Gibbard–Satterthwaite, it is not a dry theorem; it is the **explanation for their failure**. They will remember the frustration of trying to fix a manipulable rule, which makes the impossibility result feel like a relief (an explanation) rather than a barrier.
