answer: |-
  **MEMORANDUM**

  **TO:** Allocation Committee, National Research Council
  **FROM:** [Your Name/Chair]
  **DATE:** May 15, 2024
  **SUBJECT:** Decision on Post-Pilot Funding Allocation Mechanism

  ### 1. Recommendation

  I recommend that the Committee adopt the **Rotating Component Model** (Faction 3) for the next funding cycle, with a specific modification: the four existing metrics will remain the permanent "menu," but their weighting will be randomized annually within predetermined bounds (e.g., no single component shall exceed 50% or fall below 10% in any given cycle). The specific weights for the upcoming cycle will be announced in August, effective for the January allocation.

  This approach retains the transparency of a formulaic system while disrupting the feedback loops that allowed departments to optimize for the metric rather than the underlying research quality.

  ### 2. Diagnostic: Proxy Failure vs. Strategic Gaming

  To select the correct remedy, we must distinguish between two distinct pathologies observed in the pilot data.

  **A. Imperfect Proxy Failures**
  Some negative outcomes occurred because the metrics are inherently noisy measures of quality, regardless of departmental intent.
  *   *Citations:* The drop in average citations per paper despite a rise in volume suggests the publication metric rewards velocity over impact. This is a proxy failure; high-volume, low-impact work is still "research," but it is not the *kind* of research we wish to subsidize.
  *   *Thesis Quality:* The rise in completions alongside thinner theses indicates that "time-to-degree" is a poor proxy for "training quality." Supervisors are not necessarily malicious; they are responding to a signal that speed is valued.

  **B. Strategic Gaming Failures**
  Other outcomes resulted from departments identifying fixed loopholes and exploiting them.
  *   *Grant Fragmentation:* The explosion of applications and shrinkage of project size indicates departments are breaking projects into smaller units to maximize the "grant income" count. This is deliberate optimization against a fixed rule.
  *   *Survey Coaching:* The inflated satisfaction scores following specific departmental coaching are a clear case of gaming. The metric (student satisfaction) was not measured; the *survey response* was measured.

  **Implication:** Refining the index (Faction 2) addresses Proxy Failures (e.g., by weighting citations higher) but exacerbates Gaming Failures by giving departments a new fixed target to exploit. Returning to panels (Faction 1) addresses Gaming but reintroduces opacity. Rotation specifically targets Gaming Failures by removing the fixed target.

  ### 3. Evaluation of the Rotation Proposal

  The Data Director's proposal relies on the premise that unpredictability disincentivizes gaming. We must evaluate whether this unpredictability renders the system dysfunctional.

  **Can Departments Coordinate?**
  If the weights rotate, departments cannot coordinate on a single narrow strategy (e.g., "fragment all grants this year"). However, they *can* coordinate on general research health. Since all four components remain in the "menu" and will likely reappear with significant weight over a 3-year horizon, departments must maintain capacity in all areas: publishing, grant writing, supervision, and student support.

  **Does This Count For or Against the Scheme?**
  This counts **for** the scheme. Our goal is to fund robust departments, not departments that are excellent at one specific transaction.
  *   *Against:* Critics argue research planning requires long-term stability. If a department cannot predict whether grants or publications will be weighted heavily, they may hesitate to hire staff or invest in infrastructure.
  *   *For:* The pilot proved that *too much* stability invites corruption of the mission. By rotating weights, we force departments to maintain a balanced portfolio. We are trading "strategic precision" for "resilience." A department that is genuinely healthy will survive weight fluctuations; a department that is "optimized" for a specific formula will not.

  **Implementation Guardrail:** To mitigate the risk of strategic paralysis, the randomization will be bounded. No metric will ever drop to 0%. This ensures that departments never have an incentive to *abandon* a function entirely (e.g., stop supervising students), only to prioritize differently.

  ### 4. Engagement with the Losing Factions

  **The Case for Refining the Index (Faction 2)**
  *Strongest Point:* **Strategic Stability.** Research is a long-term enterprise. Building a lab, recruiting a cohort, or launching a major grant application takes 3–5 years. A stable formula allows departments to align their strategic plans with national priorities.
  *Rebuttal:* The pilot demonstrated that stability is a double-edged sword. It allows alignment, but it also allows calcification and exploitation. Once a formula is fixed, it ceases to be a measure of performance and becomes a target for compliance. We cannot refine our way out of Goodhart's Law; every refinement creates a new loophole. Rotation accepts that instability is the price of integrity.

  **The Case for Expert Panels (Faction 1)**
  *Strongest Point:* **Human Judgment and Nuance.** Metrics will always be imperfect proxies. Only human experts can discern a "thin" thesis from an efficient one, or a fragmented grant strategy from a legitimate collaborative network.
  *Rebuttal & Risk Acknowledgement:* While true, the return to panels carries a specific, documented risk: **Relationship Optimization.** In the absence of quantitative rules, the "game" does not disappear; it relocates from optimizing numbers to optimizing relationships and reputations. Departments will invest resources in lobbying, networking, and cultivating favor with panel members rather than improving research output. We have even less visibility into this optimization than we do with metric gaming. A formula, even a rotating one, provides an audit trail that human deliberation does not. We cannot return to a system where legitimacy is compromised by the perception of favoritism, regardless of how nuanced the judgment is.

  ### 5. Implementation Timeline

  *   **June 15:** Committee vote on Rotating Component Model.
  *   **July 1:** Publish "Allocation Framework 2.0" detailing the four permanent metrics and the bounding rules for weight randomization (e.g., min 10%, max 50%).
  *   **August 1:** Announce specific weights for the upcoming cycle (Cycle 1).
  *   **January 1:** Apply new weights to allocation data.
  *   **June 2025:** Review Cycle 1 data. If gaming persists (e.g., departments attempt to game all four metrics simultaneously leading to burnout), consider expanding the "menu" of metrics to dilute focus further.

  ### 6. Conclusion

  The pilot data confirms that a fixed formula invites gaming, but the legacy panel system invites bias. The Rotating Component Model is the only path that preserves transparency while disrupting the incentive to game. It asks departments to be excellent researchers rather than excellent accountants. It is uncomfortable, but the comfort of the old systems was illusory.

  I request the Committee's endorsement of this direction prior to the June meeting.
