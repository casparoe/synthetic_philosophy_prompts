answer: |-
  In a mid-sized software firm, a team lead implements a passive background script to measure "Code Instability" by counting the frequency of automated build failures in each module, intending to identify fragile architecture for refactoring. The developers are unaware that this specific metric is being tracked; they continue to write, commit, and test code exactly as they have always done, driven only by their standard professional norms and ticket requirements. The lead, acting conscientiously to improve system robustness, makes the "Build Failure Count" the primary target for scheduling refactoring sprints, automatically prioritizing modules with the highest counts. As the lead refactors these high-failure modules, the build failures cease, and the metric reports perfect stability. However, the refactoring process itself—driven by the metric's narrow focus on compile-time errors—shifts the instability from visible build breaks to silent runtime logic errors that the script cannot detect. The measure ceases to be a good proxy for "Code Instability" precisely because it became the target for intervention, degrading the lead's perception of the system's health without any developer ever knowing the metric existed, changing their coding habits, or attempting to game the count.

  ***

  ### Specification Check
  1.  **Single paragraph, ordinary workplace:** The scenario is set in a software engineering team, described in one paragraph.
  2.  **Measured agents never learn the metric:** The developers are unaware the script is tracking failure counts for this purpose.
  3.  **Measured agents never change behavior:** They code according to standard norms and tickets, not the metric.
  4.  **Harm on evaluator's side:** The team lead's perception of "Code Instability" is degraded; they believe the system is stable when it is not.
  5.  **Evaluator is conscientious:** The lead is genuinely trying to improve robustness, not ticking boxes or punishing staff.
  6.  **No gaming/falsification:** No one is hiding errors or altering commits to satisfy the script; the data is accurate regarding build failures.

  ### Is this Goodhart's Law?
  **Yes.** This counts as Goodhart's Law, but it reveals that the law is fundamentally about **information fragility under control**, not merely incentives. The standard gloss ("incentives cause gaming") is a subset of a broader phenomenon: when a proxy measure ($M$) is used to control a system toward a goal ($G$), the act of control can decouple $M$ from $G$ even if the agents within the system do not strategically react. Here, the *intervention* triggered by the metric changed the nature of the instability (from compile-time to runtime), breaking the correlation. This is often aligned with the **Lucas Critique** in economics: structural parameters change when policy changes, independent of agent expectations.

  ### The Single Feature Doing the Work
  The feature doing the work is the **feedback loop from the metric to the environment, bypassing the agent's strategy.** In your suspicion, you called it the "sealing-off of the information channel from the incentive channel." I would refine this: it is the **isolation of the control loop from the behavioral loop.** The harm occurs because the *evaluator's reaction* to the metric alters the underlying reality that the metric is supposed to measure, independent of whether the *measured agents* react to the metric. The measure breaks because the world changed around it, not because the people in the world changed their minds.

  ### If the Seal is Broken
  If that seal is broken—meaning the developers learn that "Build Failure Count" is the target for refactoring—the case collapses back into the standard story about targets and gaming. Developers will begin to write code that passes the build check but remains logically fragile, or they will suppress error logs, or they will avoid committing complex changes to flagged modules. The metric will still cease to be a good measure, but the mechanism of failure shifts from **systemic decoupling** (the evaluator's intervention changing the phenomenon) to **strategic decoupling** (the agents optimizing the proxy). The outcome (a bad measure) remains the same, but the "Incentive Gloss" would only explain the second scenario, failing to account for the first. This demonstrates that Goodhart's Law is a law of **control systems** first, and a law of **human incentives** second.
