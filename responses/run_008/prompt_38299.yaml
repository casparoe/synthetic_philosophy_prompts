answer: |-
  Your suspicion is correct: the argument slips between (3) and (5). The scholar has constructed a *reductio ad absurdum* without realizing it. She intends to defend Nuremberg, but by generalizing the specific justification for the Nazi defendants into a universal rule for victors, she inadvertently validates the charge of "victors' justice."

  To keep both of your desired thoughts—that the defendants were not convicted under manufactured law, and that the principle of legality is a real constraint—you should **reject Premise (5)**.

  Here is the breakdown of why this is the necessary move, what it costs, and how to handle the Tokyo complication.

  ### The Fault Line: Premise (5)

  Premise (5) claims: *"Whenever the defeated leadership knew its conduct was gravely wrong, a postwar court may punish it, and retroactivity is no objection."*

  This is the overreach. It converts a specific epistemic defense (the Nazis knew murder was wrong) into a procedural license (victors may punish any known wrong).

  If you accept (5), you concede that the *source* of the law is the victor's moral judgment, not an independent legal order. This dissolves the principle of legality (*nullum crimen sine lege*) into a test of the defendant's conscience. As you noted, a principle that blocks nothing is not a constraint.

  By rejecting (5), you preserve the principle of legality as a constraint for the future. You assert that Nuremberg was legitimate *not* because victors can punish known wrongs, but because **in this specific instance, the law actually existed prior to the acts.**

  ### The Cost of Rejecting (5)

  Rejecting (5) saves the principle of legality, but it exacts a price regarding the nature of the Nuremberg judgment. You must accept two nuanced positions:

  **1. Nuremberg was a "Boundary Case," not a Routine Application.**
  You cannot claim that the London Charter merely "declared" preexisting law in a straightforward way. For "Crimes Against Humanity" (murder, torture), customary law was robust. For "Crimes Against Peace" (waging aggressive war), the law was nascent and contested. The Kellogg-Briand Pact (1928) outlawed war, but it lacked sanctions.
  *   **The Cost:** You must admit that Nuremberg did not just *apply* the law; it *crystallized* it. The tribunal stood on the edge of existing custom and pushed it forward. This means the "no manufactured law" claim is true in spirit (the moral and legal norms were in the air) but technically strained regarding aggression. You defend this by arguing that the Nazi regime had so thoroughly corrupted the domestic legal order that international custom was the *only* law left to apply.

  **2. Legality Requires Objective Sources, Not Subjective Knowledge.**
  The scholar's argument rests on the defendants' *knowledge* (secrecy, euphemisms). You must shift the focus to the *source* of the norm. The constraint of legality is satisfied not because the Nazis knew they were wrong, but because their acts violated treaties and customs to which Germany was a signatory (Hague Conventions, Geneva Protocols, Kellogg-Briand).
  *   **The Cost:** You must concede that if a future victor punishes a defeated leader for acts that were *not* codified in treaty or custom, even if "gravely wrong," the principle of legality *is* violated. Nuremberg does not set a precedent that moral wrongness equals legal crime. It sets a precedent that extreme violations of *existing* international norms justify extraordinary judicial measures.

  ### Addressing Tokyo

  Your intuition that Tokyo is harder to parry is correct. If you reject (5), Tokyo becomes the test case where the constraints were insufficient.

  *   **The Charter:** Like Nuremberg, the Tokyo Charter was issued by the victor (General MacArthur), not a multilateral treaty. This weakens the "preexisting law" claim.
  *   **The Emperor:** The decision to spare Hirohito for reasons of state undermines the "knowledge of wrong" argument. If the head of state, who signed the orders, is immune, then the law is not being applied equally. It suggests the trial was about *policy* (stabilizing Japan) as much as *justice*.
  *   **The Judges:** At Nuremberg, there were alternates and a semblance of procedural rigor. At Tokyo, the dissenting opinions (particularly by Justice Radhabinod Pal of India, who argued the trial was *ex post facto* victors' justice) highlight the fragility of the legal basis.

  **How to write this:** Use Tokyo to demonstrate why Premise (5) must be rejected. Tokyo shows what happens when you allow victors to punish "known wrongs" without the tight constraints of multilateral consensus and neutral procedure. Tokyo is the warning; Nuremberg is the exception that justified itself through the sheer weight of evidence and the collapse of the German state's legal sovereignty.

  ### A Proposed Thesis for Your Essay

  To keep both your goals, your essay should argue that the scholar's dilemma is false because it assumes law is either purely positivist (written rules only) or purely natural (morality only). Nuremberg succeeded because it operated in a **third space**: the *constitutive* power of law.

  **Drafting the argument:**
  1.  **Acknowledge the Scholar's Trap:** She is right that if legality is just "no surprise," then victors can define anything as a crime.
  2.  **Reject the Generalization:** Nuremberg was not a license for victors; it was a response to a specific legal vacuum created by the Nazis, who had weaponized their own domestic law to commit crimes.
  3.  **The "Radbruch Formula":** Cite Gustav Radbruch (a German legal philosopher). He argued that when positive law conflicts with justice to an intolerable degree, the law loses its legal nature. The Nazis didn't just break the law; they broke the *concept* of law.
  4.  **The Constraint Remains:** The principle of legality survives because Nuremberg was bound by the London Charter, which referenced existing treaties. Future courts (like the ICC) are bound by the Rome Statute. The constraint is the *requirement of prior consensus*, not the *victor's conscience*.
  5.  **Tokyo as Counterpoint:** Acknowledge that Tokyo stretched this further. It reminds us that without the constraint of neutral procedure and clear customary law, the Nuremberg logic *does* decay into victors' justice.

  ### Summary of the Move

  *   **Reject:** Premise (5). (The generalization that victors can punish any known wrong).
  *   **Keep:** Premise (4). (Nuremberg declared existing wrongs).
  *   **Cost:** You must admit that "existing wrongs" for "Crimes Against Peace" were legally thin and required the tribunal to solidify them. You must also admit that Tokyo failed to meet the same standard of legal constraint as Nuremberg.
  *   **Gain:** You preserve the principle of legality as a real constraint (it requires objective sources, not just victor's morality) while maintaining that the Nuremberg defendants were not punished under purely manufactured law.

  The scholar's argument is a warning: if you justify Nuremberg solely on the moral guilt of the defendants, you destroy the rule of law. You justify it instead on the *restoration* of the rule of law in a world where the defendants had destroyed the very possibility of legal order. That is a constraint, because it applies only when the legal order itself has been annihilated by the accused.
