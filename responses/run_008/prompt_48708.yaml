answer: |-
  **Final Exam: Rational Choice Under Ambiguity**
  **Case: Lake Averni Intervention**

  The Agency for Inland Waters must select one intervention for Lake Averni. Two consulting labs disagree on the degradation cause: $s_1$ (nutrient-driven) or $s_2$ (toxin-driven). The agency's credal set $\mathcal{P}$ is the convex hull of $P_1$ and $P_2$, where $P_1(s_1) = 0.2$ and $P_2(s_1) = 0.8$.

  Available acts (utilities in utiles):
  1.  **Dredging:** 10 if $s_1$, 0 if $s_2$.
  2.  **Filtration:** 0 if $s_1$, 10 if $s_2$.
  3.  **Hedged:** 4 if $s_1$, 4 if $s_2$.

  **(a)** Determine the recommended act(s) under $\Gamma$-maximin, Levi's E-admissibility, and Walley's Maximality. Show expected utility computations for each $P \in \{P_1, P_2\}$. (8 marks)

  **(b)** The Deputy Director objects: "The Hedged option is the only one that doesn't gamble on which lab is right. Any rule permitting Dredging or Filtration licenses arbitrariness by relying on a single probability we cannot justify." Evaluate this objection on normative merits. (6 marks)

  **(c)** A monitoring study yields a positive reading ($E$). Likelihoods are contested: $P_1(E|s_1)=1, P_1(E|s_2)=0$; $P_2(E|s_1)=0, P_2(E|s_2)=1$. Compute the posterior interval for $s_1$. A board member protests that "a rational agent cannot learn to know less," implying the framework is broken. Assess this complaint and determine if any decision rule's recommendation changes post-update. (8 marks)

  **Total: 25 Marks** (Plus 3 marks for cross-cutting criteria)

  ***

  **Model Answer**

  **(a) Decision Rules**
  First, we compute expected utilities (EU) for each act under the extreme points of the credal set.
  Under $P_1$ ($s_1=0.2$):
  $EU_{P_1}(\text{Dredge}) = 0.2(10) + 0.8(0) = 2$.
  $EU_{P_1}(\text{Filter}) = 0.2(0) + 0.8(10) = 8$.
  $EU_{P_1}(\text{Hedged}) = 4$.

  Under $P_2$ ($s_1=0.8$):
  $EU_{P_2}(\text{Dredge}) = 0.8(10) + 0.2(0) = 8$.
  $EU_{P_2}(\text{Filter}) = 0.8(0) + 0.2(10) = 2$.
  $EU_{P_2}(\text{Hedged}) = 4$.

  **$\Gamma$-maximin** maximizes the minimum EU.
  $\min EU(\text{Dredge}) = 2$; $\min EU(\text{Filter}) = 2$; $\min EU(\text{Hedged}) = 4$.
  Recommendation: **Hedged**.

  **E-admissibility** selects acts maximizing EU for at least one $P \in \mathcal{P}$.
  Dredge is max at $P_2$ ($8 > 4, 2$). Filter is max at $P_1$ ($8 > 4, 2$). Hedged is never maximal ($4 < 8$).
  Recommendation: **{Dredging, Filtration}**.

  **Maximality** selects acts not strictly dominated by another act across all $P$.
  Hedged is not dominated by Dredge (since $4 > 2$ at $P_1$) nor Filter (since $4 > 2$ at $P_2$). Dredge and Filter do not dominate each other.
  Recommendation: **{Dredging, Filtration, Hedged}**.

  **(b) Normative Evaluation**
  The Deputy Director's objection prioritizes security over optimality, conflating "arbitrariness" with "commitment to a specific probability." E-admissibility does not require the agent to believe $P_2$ is true; it merely acknowledges that if $P_2$ is true, Dredging is the optimal choice. To exclude Dredging is to assert $P_2$ is false, which the credal set explicitly forbids. Thus, permitting Dredging is not arbitrary; it is respectful of the uncertainty range.

  However, the Deputy is normatively correct that Hedged avoids regret if the state is misidentified. $\Gamma$-maximin aligns with this caution, treating the credal set as a bound on ignorance rather than a set of candidates for truth. The choice between rules depends on the agency's risk attitude: E-admissibility preserves flexibility for potential gains, while $\Gamma$-maximin ensures a security floor. Neither licenses arbitrariness; they encode different stances on the cost of error versus the cost of missed opportunity.

  **(c) Monitoring Study**
  We update using Bayes' rule for each extreme point.
  For $P_1$: $P_1(s_1|E) = \frac{1 \cdot 0.2}{1 \cdot 0.2 + 0 \cdot 0.8} = 1$.
  For $P_2$: $P_2(s_1|E) = \frac{0 \cdot 0.8}{0 \cdot 0.8 + 1 \cdot 0.2} = 0$.
  The posterior credal set is the convex hull of mass on $s_1$ and mass on $s_2$. The posterior interval for $s_1$ is **$[0, 1]$**.

  The board member's complaint is partially valid: the interval widened from $[0.2, 0.8]$ to $[0, 1]$, meaning precision decreased ("learning to know less"). This occurs because the models disagree on the signal's meaning ($E$ confirms $s_1$ for $P_1$, $s_2$ for $P_2$). The framework is not broken; it correctly reflects that the study exacerbates model disagreement.

  Do recommendations change?
  New EUs: $P_1'$ (Dredge=10, Filter=0, Hedge=4); $P_2'$ (Dredge=0, Filter=10, Hedge=4).
  $\Gamma$-maximin: Min(Dredge)=0, Min(Filter)=0, Min(Hedge)=4. Select **Hedged**.
  E-admissibility: Dredge max at $P_1'$, Filter at $P_2'$. Select **{Dredging, Filtration}**.
  Maximality: All acts remain maximal.
  **No rule's recommendation changes.** The study is decision-irrelevant despite being informative within each model, illustrating that information has no value under ambiguity if it fails to reduce conflict between models.

