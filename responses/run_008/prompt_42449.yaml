prompt: |-
  My mate and I had a massive argument last night after a few beers. I work in compliance for a UK engineering firm that does a lot of infrastructure work abroad, and I was telling him about how half my job is deciding whether a gift or payment we're asked to make abroad is a bribe or just... how things are done there. He reckoned that calling our whole gift-giving and favour-doing culture corrupt is just cultural imperialism -- that the line between a clientelism that holds societies together and corruption that rots them is something WE drew, mostly to label non-Western practices as dirty. I pushed back but honestly it got messy, because he had a point that a "facilitation payment" to get a customs official to do their job looks different depending on where you're standing, and that plenty of perfectly legal lobbying back home looks a lot like what we prosecute foreigners for.

  So heres what I want from you. Write me a decision procedure I can actually use when one of our project managers comes to me with a questionable request -- the questions to ask in order, what counts as a sufficient answer at each step, where the procedure says no outright, and crucially where it has to admit the question is a values judgement rather than a compliance one, because that last category is exactly where my mate thinks I'm pretending to have objective answers. Ground it in whatever the actual philosophy of corruption says -- the difference between a gift and a bribe, whether the wrongness is in the exchange itself or in the institutional harm it does, whether reciprocity norms make some of this not bribery at all -- but keep it usable by someone who hasn't read any of that. Then run it on three cases: (1) a government client's procurement official expects a "consulting fee" to his brother's company before our bid gets shortlisted, (2) our local partner insists on giving the minister who approved our project a substantial retirement gift, which everyone there says is normal and refusing would humiliate him and probably cost us the follow-on contract, and (3) we hire the nephew of a senior official as a local liaison at a market salary, he's actually decent at the job, and my colleague says that's just how networks work there and we'd do the same with an MP's kid at home. Be honest about where the procedure would let my mate's argument in the door, and whether there's any version of it that isn't just laundering my cultural priors as process.

  Please write in British English. And keep it readable -- I'll take honesty about hard bits over false tidiness.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Compliance officer at a UK engineering firm working abroad.
      *   **Context:** Had an argument with a mate about cultural imperialism vs. corruption. The mate argues that the line between "clientelism" and "corruption" is culturally drawn and that Western lobbying/favouritism looks similar to what gets prosecuted abroad.
      *   **Task:** Create a usable *decision procedure* for evaluating questionable requests (gifts, payments, hires).
      *   **Requirements:**
          *   Must be grounded in the philosophy of corruption (gift vs. bribe, institutional harm, reciprocity norms).
          *   Must be usable by someone without philosophical training.
          *   Must explicitly identify where the decision is a *values judgement* rather than a pure compliance tick-box (acknowledging the mate's point).
          *   Must run the procedure on three specific cases:
              1.  "Consulting fee" to official's brother for shortlisting.
              2.  Retirement gift to a Minister (culturally expected).
              3.  Hiring an official's nephew (market salary, competent).
          *   Must be honest about where the mate's argument gets in and whether the procedure is just laundering cultural priors.
          *   **Tone:** British English, readable, honest about hard bits, no false tidiness.

  2.  **Deconstruct the Philosophy of Corruption:**
      *   *Universalism vs. Particularism:* Is the rule applied to everyone, or just friends/family?
      *   *Public vs. Private:* Is the resource being traded public (taxpayer money, public office) or private?
      *   *Intent/Quid Pro Quo:* Is there an explicit or implicit exchange of value for influence?
      *   *Institutional Harm:* Does this undermine the system's integrity over time?
      *   *Cultural Relativism:* Are local norms of reciprocity (gift-giving) being conflated with bribery?
      *   *The "Lobbying" Counter-argument:* Legal influence peddling in the West vs. illegal bribery abroad.

  3.  **Drafting the Decision Procedure:**
      *   Needs to be step-by-step.
      *   Needs "Stop/Go" points.
      *   Needs a "Grey Zone" category where the mate's point is valid.
      *   *Step 1: Legality.* (The baseline). UK Bribery Act 2010 is strict. No facilitation payments.
      *   *Step 2: Public vs. Private.* Is public power being traded?
      *   *Step 3: Quid Pro Quo.* Is the benefit contingent on an action?
      *   *Step 4: Transparency.* Can this be written down and shown to the public?
      *   *Step 5: The "Values Judgement" (The Mate's Zone).* This is crucial. Where do we admit culture matters?

  4.  **Developing the "Values Judgement" Section:**
      *   This is where the procedure admits it's not purely objective.
      *   It needs to distinguish between *relationship building* (acceptable) and *obligation creation* (unacceptable).
      *   It needs to address the "MP's kid" argument (nepotism vs. networking).

  5.  **Running the Cases:**

      *   *Case 1 (Consulting Fee to Brother):*
          *   Legality: High risk (UK Bribery Act).
          *   Quid Pro Quo: Yes (fee for shortlisting).
          *   Verdict: Hard No.
          *   Mate's argument: Weak here. This is straight bribery.

      *   *Case 2 (Minister's Retirement Gift):*
          *   Legality: Grey. UK Bribery Act covers foreign officials.
          *   Culture: High expectation. Refusal = insult.
          *   Transparency: Can it be disclosed?
          *   Verdict: Likely No, but this is where the tension lies. Is it a gift or a kickback?
          *   Mate's argument: Strong here. This is the "cultural imperialism" zone.

      *   *Case 3 (Hiring the Nephew):*
          *   Legality: Legal if market rate and competent.
          *   Fairness: Is the process open?
          *   Mate's argument: Very strong. "Networks work this way."
          *   Verdict: Conditional Yes, but requires strict controls.

  6.  **Refining the Tone and Language:**
      *   British English (e.g., "programme," "favour," "whilst," "£").
      *   Avoid corporate jargon where possible.
      *   Acknowledge the friction. Don't pretend the procedure solves the philosophical problem.
      *   Address the "laundering cultural priors" concern directly in the conclusion.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too rigid?
      *   *Fix:* Add a specific "Escalation Point" for the grey areas.
      *   *Critique:* Did I address the mate's point about lobbying?
      *   *Fix:* Ensure the "Values Judgement" section explicitly mentions the hypocrisy of Western lobbying vs. foreign bribery.
      *   *Critique:* Is the UK Bribery Act referenced correctly?
