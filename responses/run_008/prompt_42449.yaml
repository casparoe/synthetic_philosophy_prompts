  8.  **Final Polish:**
      *   Check structure: Intro -> The Procedure -> The Three Cases -> The Hard Truth (Mate's Argument).
      *   Ensure the distinction between *compliance* (rules) and *ethics* (values) is clear.

  **(Self-Correction Note on Case 2):** A "substantial" retirement gift to a Minister is almost certainly a bribe under the UK Bribery Act, regardless of local custom. The Act has no "cultural defence." I need to make sure the procedure reflects the legal reality while acknowledging the philosophical tension the user raised. The procedure must say "No" legally, even if the philosophy is debatable.

  **(Self-Correction Note on Case 3):** Hiring a nephew is legal *if* merit-based. But if it's *because* he's a nephew, it's nepotism. The procedure needs to test the *reason* for hiring, not just the salary.

  9.  **Finalizing the Output Structure:**
