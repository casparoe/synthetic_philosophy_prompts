answer: |-
  Your biochemist advisor is wielding a slogan that sounds like a scientific fact but is actually functioning as a philosophical boundary marker. The sentence "Life is just chemistry" is ambiguous: it can mean that life *is nothing more than* chemistry (reductionism), or that *only specific kinds of* chemistry count as life (exclusion).

  To help you navigate her objections, here is a breakdown of the precise claims hidden inside that one-liner, evaluated by their scientific plausibility and their ability to justify her three rulings (the Fabricators, the Crystals, and the Viruses).

  ### 1. The Ontological Reductionist Claim
  *   **The Claim:** There is no *élan vital* or supernatural spark. Biological processes are identical to chemical processes. Therefore, if you understand the chemistry, you understand the life.
  *   **Type:** Near-tautological / Anti-metaphysical.
  *   **Verdict:** **Scientifically robust, but rhetorically useless for her.** This claim removes magic from biology, but it does not draw a line between living and non-living. If life is *just* chemistry, then any complex chemical system (including your fabricators or crystals) is a candidate for life.
  *   **Does it license her rulings?** **No.** This reading suggests the fabricators *could* be alive if their chemistry is complex enough. It definitely fails to rule out viruses, which are undeniably chemical assemblies.
  *   **Virus Case Survival:** **Fails.** If life is just chemistry, and viruses are chemistry, then viruses are alive. This reading contradicts her third ruling.

  ### 2. The Substrate Essentialist Claim
  *   **The Claim:** Life is not only chemistry, but it must be *specific* chemistry (carbon-based, aqueous, polymer-driven). Silicon, metal, or inorganic lattices cannot constitute life, regardless of behavior.
  *   **Type:** Substantive / Material restriction.
  *   **Verdict:** **Scientifically contingent.** This is "carbon chauvinism." While all *known* life is carbon-based, astrobiology generally allows for the theoretical possibility of alternative substrates. However, it is a standard working definition for Earth-bound biochemists.
  *   **Does it license her rulings?** **Partially.** It successfully rules out the **Fabricators** (metal/silicon) and the **Crystalline Growth** (inorganic lattice). However, it cannot rule out viruses, as viruses are made of standard biological materials (proteins and nucleic acids).
  *   **Virus Case Survival:** **Fails.** Viruses pass the substrate test. To rule them out, she needs a criterion beyond what they are *made of*.

  ### 3. The Thermodynamic/Process Claim
  *   **The Claim:** Life is defined not by material, but by a specific chemical *process*: autonomous metabolism. A living system must actively maintain a non-equilibrium state by consuming energy and exporting entropy, independent of a host.
  *   **Type:** Substantive / Functional restriction.
  *   **Verdict:** **Plausible and widely used.** This aligns with the "metabolism-first" definition of life. It distinguishes living cells from dormant spores or obligate parasites.
  *   **Does it license her rulings?** **Mostly.** It rules out the **Viruses** (which have no metabolism of their own) and the **Crystals** (which grow passively via accretion, not metabolic turnover). It puts the **Fabricators** at risk, however, unless she argues their energy consumption is "mechanical" rather than "metabolic."
  *   **Virus Case Survival:** **Survives.** This is the standard biological justification for excluding viruses from the tree of life.

  ### 4. The Taxonomic Pragmatist Claim
  *   **The Claim:** "Life" is not a fundamental category of the universe, but a convenient label for a specific historical lineage (Earth's DNA-based descendants). If it didn't evolve from the last universal common ancestor (LUCA), we don't call it "life" in a professional context.
  *   **Type:** Deflationary / Term of Art.
  *   **Verdict:** **Philosophically strong, practically useful.** This treats "life" as a bureaucratic category rather than a metaphysical truth. It admits that the fabricators might be *alive* in a philosophical sense, but insists they are not *Life* in a biochemical sense.
  *   **Does it license her rulings?** **Yes, all three.** The Fabricators are not of Earth's lineage. The Crystals are not evolved. The Viruses are not cellular lineages (they are genetic hitchhikers).
  *   **Virus Case Survival:** **Survives.** This is the most consistent explanation for her virus ruling. She isn't saying viruses aren't complex; she's saying they don't fit the taxonomic bucket.

  ***

  ### Summary: The Virus Test
  You asked explicitly which readings survive contact with the virus case. Since your advisor insists viruses are **not** alive, she is implicitly rejecting **Reading 1 (Reductionism)** and **Reading 2 (Substrate Essentialism)**.

  *   **Reading 1 fails** because viruses are chemical, so under pure reductionism, they would be alive.
  *   **Reading 2 fails** because viruses are made of the "right" stuff (DNA/Protein), so under substrate essentialism, they would be alive.

  To maintain her position on the viruses, she **must** be relying on **Reading 3 (Process/Metabolism)** or **Reading 4 (Taxonomic Pragmatism)**.

  ### Advice for the Novelist
  Your advisor is likely conflating **Reading 2** (to kill your fabricators) with **Reading 3** (to kill your viruses). This is intellectually dishonest, but humanly consistent. She wants "Life" to mean "Wet, Earth-like, Metabolizing Biology."

  *   **For your story:** This ambiguity is a goldmine for conflict. The crew sees *behavior* (protection, self-repair) and calls it life. The biochemist sees *substrate and lineage* and calls it machinery.
  *   **The Twist:** If your fabricators are truly self-modifying and protective, they likely satisfy **Reading 3 (Process)** even if they fail **Reading 2 (Substrate)**. Your biochemist is technically wrong about the fabricators if she admits metabolism is the key, but she is professionally protected by **Reading 4 (Pragmatism)**. She can say, "It acts alive, but it isn't *biology*."

  If you want to defeat her argument in the narrative, force her to choose: Is life defined by what it is *made of* (which kills the fabricators but saves the viruses), or what it *does* (which saves the fabricators but kills the viruses)? She cannot have it both ways without admitting that "Life is just chemistry" is a slogan, not a definition.
