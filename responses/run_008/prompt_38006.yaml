  ### Part 1: The Logical Space

  Before handing out the tree, we map the theoretical terrain. We are testing six binary judgments across the required cases. Each combination of answers creates a "coordinate" in the logical space. Most coordinates are empty (incoherent views); a few are occupied by genuine ethical theories.

  **The 6 Binary Dimensions (Nodes):**
  1.  **Capacity:** In the *Drunk* case, is the act permissible? (Yes/No)
  2.  **Coercion:** In the *Gunman* case, is the act permissible? (Yes/No)
  3.  **Leverage:** In the *Boss* case, is the act permissible? (Yes/No)
  4.  **Severity:** In the *Doctor* case, is the wrong equivalent to assault (no permission) or fraud (flawed permission)? (Assault/Flawed)
  5.  **Scope:** In the *Wealth* case, is the act permissible? (Yes/No)
  6.  **Causation:** In the *Future Lie (No Diff)* case, is the act permissible? (Yes/No)

  **Mapping the Leaves to Coordinates:**

  | Theory | Capacity | Coercion | Leverage | Severity | Scope | Causation |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Deflationary** | Yes | **Yes** | Yes | N/A | Yes | Yes |
  | **Valid-but-Wronged** | Yes | No | **Yes** | Flawed | Yes | Yes |
  | **Act-Description** | Yes | No | No | **Assault** | **Yes** | Yes |
  | **No-Permission** | Yes | No | No | **Assault** | **No** | No |
  | **Broad Reliance** | Yes | No | No | Flawed | No | **Yes** |
  | **Will-Bypass** | Yes | No | No | Flawed | No | **No** |
  | *(Capacity View)* | **No** | No | No | Assault | No | No |

  **Unoccupied/Incoherent Combinations:**
  *   **Gunman=Yes + Doctor=No:** Incoherent. If a signal under a gun counts (Deflationary), a signal under medical deception must also count.
  *   **Boss=Yes + Gunman=No:** (Occupied by *Valid-but-Wronged*).
  *   **Boss=No + Gunman=Yes:** Incoherent. A gun is stronger leverage than a promotion.
  *   **Wealth=No + Future(No Diff)=Yes:** (Occupied by *Broad Reliance*).
  *   **Wealth=No + Future(No Diff)=No:** (Occupied by *Will-Bypass* & *No-Permission*).
  *   **Doctor=Assault + Wealth=Yes:** (Occupied by *Act-Description*).
  *   **Doctor=Flawed + Wealth=Yes:** Incoherent. If collateral lies don't kill consent, core deception certainly shouldn't make it *worse* than assault; but if core deception is only "flawed," collateral should be permissible. (Actually, this is logically possible but theoretically unstable: "Core deception is fraud, collateral is fine." I will group this with Broad Reliance for simplicity, or leave it empty as "Unexplored").

  ***

  ### Part 2: The Consent Decision Tree (Handout)

  **Instructions:** Read each case. Answer the question based on your moral intuition *before* looking at where the arrow leads. Follow your answers to find your theory.

  **NODE 1: The Capacity Gate**
  > **Case:** Alex has had several drinks but is clearly tracking the conversation, knows where they are, and says "Yes" to sex.
  > **Question:** Does Alex's "Yes" make the act morally permissible?
  > *   **NO** → Go to **Leaf A**
  > *   **YES** → Go to Node 2

  **NODE 2: The Coercion Baseline**
  > **Case:** A gunman threatens a victim: "Have sex with me or I shoot." The victim says "Yes."
  > **Question:** Does the victim's "Yes" make the act morally permissible?
  > *   **YES** → Go to **Leaf B**
  > *   **NO** → Go to Node 3

  **NODE 3: The Leverage Split**
  > **Case:** A boss hints a promotion is on the table if an employee "keeps him happy." The employee says "Yes."
  > **Question:** Does the employee's "Yes" make the act morally permissible? (Even if the boss is a jerk).
  > *   **YES** → Go to **Leaf C**
  > *   **NO** → Go to Node 4

  **NODE 4: The Severity Test**
  > **Case:** A doctor says an examination is "standard medical procedure" while secretly performing a sexual act. The patient says "Yes."
  > **Question:** Is this act **morally equivalent to assaulting a stranger** (no permission granted), OR is it **wrongful but distinct from assault** (permission was flawed)?
  > *   **EQUIVALENT TO ASSAULT** → Go to Node 5
  > *   **WRONGFUL BUT DISTINCT** → Go to Node 6

  **NODE 5: The Scope of Deception**
  > **Case:** A man lies about being rich and divorced to get someone into bed. The partner says "Yes."
  > **Question:** Does the partner's "Yes" make the act morally permissible?
  > *   **YES** → Go to **Leaf D**
  > *   **NO** → Go to **Leaf E**

  **NODE 6: The Causal Link**
  > **Case:** A man lies about wanting a future together. The partner says "Yes." *Crucially:* The partner admits afterwards, "Honestly, that lie wouldn't have changed my decision; I just wanted sex."
  > **Question:** Does the partner's "Yes" make the act morally permissible?
  > *   **YES** → Go to **Leaf F**
  > *   **NO** → Go to **Leaf G**

  ***

  ### Part 3: The Leaves (Your Theory)

  **Leaf A: The Capacity Threshold View**
  *   **Your Stand:** Consent requires a minimum level of cognitive sovereignty. If capacity is impaired (even if "tracking"), permission cannot be granted.
  *   **Implication:** Intoxication invalidates consent per se, regardless of deception or coercion.

  **Leaf B: The Deflationary / Signal View**
  *   **Your Stand:** Consent is just a behavioral signal. If the signal ("Yes") is sent, it counts. Moral wrongdoing exists (e.g., holding a gun is bad), but the *consent* itself cannot be invalid.
  *   **Implication:** The gunman is guilty of coercion, but not of sexual violation *based on consent*.

  **Leaf C: The Valid-but-Wronged View**
  *   **Your Stand:** Leveraged offers (Boss) produce valid consent, but coercive threats (Gunman) do not. The employee consented, but was exploited.
  *   **Implication:** We can punish the boss for harassment/exploitation without claiming the sex was non-consensual.

  **Leaf D: The Act-Description View**
  *   **Your Stand:** Only lies about the *nature of the act* (Doctor) or *identity* invalidate consent. Collateral lies (Wealth) make you a liar, but don't kill permission.
  *   **Implication:** Deception about the act is assault; deception about circumstances is just fraud.

  **Leaf E: The No-Permission (Trespass) View**
  *   **Your Stand:** Any significant deception (Core or Collateral) means no permission was ever granted. The act is morally equivalent to having no consent at all.
  *   **Implication:** There is no middle ground between "Consent" and "Assault." If the consent is flawed, it is a trespass.

  **Leaf F: The Broad Reliance View**
  *   **Your Stand:** Consent is invalid if based on a material lie. However, if the lie made *no difference* to the choice (No Diff case), reliance was not causal, so consent stands.
  *   **Implication:** Invalidity depends on whether the victim actually relied on the falsehood to make the decision.

  **Leaf G: The Will-Bypass View**
  *   **Your Stand:** Deception and coercion invalidate consent for the same reason: they subvert the agent's will. Even if the victim "would have said yes anyway," the manipulation itself voids the permission.
  *   **Implication:** Autonomy is about the *process* of choosing, not just the outcome. Manipulation invalidates regardless of causal impact.

  ***

  ### Part 4: Analysis & Flags

  **1. Unseparable Case Pairs**
  *   **Doctor (Nature) vs. Twin (Identity):** The tree does not separate these. Both *Act-Description* and *No-Permission* views treat them identically (Invalid/Assault). To separate them, you would need a "Physicalist" theory (only the physical mechanics matter, identity is collateral), which is theoretically rare and unattractive.
  *   **Stealthing vs. Wealth:** The tree groups these under "Scope." Some students may feel Stealthing is *Nature of Act* (Invalid) while Wealth is *Collateral* (Valid). If they answer Node 5 based on Stealthing intuition, they land on *Act-Description*. If based on Wealth, they might stall. *Instructor Note:* Use Stealthing to probe Node 5 if students hesitate on Wealth.

  **2. Unoccupied Answer Combinations**
  *   **Gunman=Permissible + Doctor=Impermissible:**
      *   *Status:* **Incoherent.**
      *   *Reason:* If a "Yes" under threat of death counts as permission (Deflationary), a "Yes" under medical deception must also count. You cannot value the signal more under coercion than under deception.
  *   **Boss=Impermissible + Gunman=Permissible:**
      *   *Status:* **Incoherent.**
      *   *Reason:* A gun is a stricter constraint than a promotion. If the "softer" pressure invalidates consent, the "harder" pressure must also invalidate it.
  *   **Doctor=Flawed + Wealth=Permissible:**
      *   *Status:* **Unexplored / Unattractive.**
      *   *Reason:* This view holds that lying about the *act* is only fraud (not assault), but lying about *wealth* is fine. It devalues bodily integrity too highly. Most theories either upgrade Doctor to Assault or downgrade Wealth to Invalid.
  *   **Future Lie (No Diff)=Impermissible + Wealth=Permissible:**
      *   *Status:* **Incoherent.**
      *   *Reason:* If a lie that *didn't change the mind* invalidates consent (Will-Bypass), then a lie that *did change the mind* (Wealth) must certainly invalidate it. You cannot hold that causal lies are harmless but non-causal lies are fatal.
