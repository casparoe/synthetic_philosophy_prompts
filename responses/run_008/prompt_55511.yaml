  ok so weird question but it's been bugging me. I have a huge final in two weeks and I keep telling myself I'll start studying this weekend "for real this time". like I actually sort of believe it when I say it?? but I also know perfectly well that I've said that the last 4 weekends and then just played games instead. and there's this other thing too — I stopped opening the grade portal bc it stresses me out, but deep down I know my grade is probably bad. it's like I believe the good version and also believe the bad version at the same time, and I just sort of switch which one I'm using.

  anyway someone told me that this is called decieving yourself and that its "impossible" because to trick yourself you'd have to know the truth (to hide it from yourself) and not know it (to be fooled) all at once?? that sounds like a technically right but useless answer to me. like obviously people do SOMETHING like this. so whats actually going on when I do this — am I lying, am I believing two things, am I just not thinking about it? and is there a way to tell if im doing it in the moment, or do I only find out later when the bad grade shows up lol
