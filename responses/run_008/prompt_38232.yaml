answer: |-
  Gradual neural replacement during sleep preserves personal identity, but checkpoint rollback constitutes death and replacement, because identity relies on unbroken causal forward-progress rather than mere psychological replication. This distinction resolves the tension between the phenomenological smoothness required by common sense and the metaphysical requirements of persistence, separating cases of functional maintenance from cases of causal reset. To accept otherwise is to conflate the preservation of pattern with the preservation of the process that generates it, a mistake that leads to absurdities in both biological and digital contexts.

  The sleep-patch scenario challenges the intuition that "gradual" replacement requires conscious awareness of the transition. David Chalmers' original arguments for gradual replacement often rely on the premise that qualia do not fade because functional organization is preserved at every conscious moment. However, the requirement for conscious bridging is phenomenologically inconsistent with how human identity already functions. We do not cease to exist during deep sleep, despite the total suspension of conscious experience and significant neurochemical restructuring. If identity survives the natural discontinuity of sleep, it must survive artificial neuronal replacement occurring within that same window, provided the causal functional architecture remains intact upon waking. The "gradual" nature of the replacement is an ontological fact about the substrate, not a phenomenological requirement for the subject. As long as the waking state at T2 is causally dependent on the state at T1, even if the intervening hardware was swapped while consciousness was offline, psychological continuity holds. The biological view might object that the organism's homeostatic process is violated, but if we accept the possibility of emulation or prosthetic integration, the biological substrate is already contingent. Therefore, the sleep-patch case is functionally equivalent to normal neural turnover; the lack of conscious bridging is irrelevant because the causal chain of psychological states remains unbroken across the sleep boundary.

  The checkpoint rollback case, however, introduces a fatal break in that causal chain. Here, the system snapshots state S1, runs to S2, crashes, and reloads S1 to run to S2*. While the subject at S2* possesses identical memories and psychological traits to the subject who reached S2, the causal history is distinct. The subject who experienced the initial run from S1 to S2 ceased to exist at the crash. The subject who emerges after the rollback is a duplicate, instantiated by a causal process that loops back rather than moves forward. This violates the "non-branching" clause essential to robust psychological continuity theories. Derek Parfit argued that identity is not what matters; survival is. But even Parfit would acknowledge that in a branching case, identity does not hold. Rollback is a form of invisible branching where one branch is destroyed. The surviving subject has memories of the ten minutes, but these memories are not causally connected to the original experience of those minutes in the unique timeline of the pre-crash subject; they are generated anew from the snapshot. Thus, the verdict must be that somebody died and was replaced. The new subject does not merely "lose ten minutes"; they are a new entity with a false sense of temporal continuity, believing themselves to be the continuation of a stream that was actually extinguished.

  Weighing the main views clarifies why these cases diverge. Psychological continuity theories support the sleep-patch verdict because causal dependency of mental states is maintained across the sleep interval. However, standard psychological continuity must be modified to handle the rollback case; mere similarity of mental states is insufficient if the causal chain is reset. A "Closest Continuer" view might struggle here, as the rolled-back subject is arguably the closest continuer to the pre-crash subject if the original is destroyed. But this ignores the qualitative difference between *continuing* and *restarting*. Biological views largely fail to gain traction in the emulation scenario unless one argues that the hardware itself is the organism, in which case a rollback is akin to healing a wound. But personal identity is tied to the history of the mind, not just the hardware's integrity. If the history is rewritten via rollback, the person is not healed; they are replicated.

  Therefore, the sleep-patch and rollback cases must receive different verdicts. The sleep-patch preserves the forward-moving causal vector of consciousness, merely swapping the engine while the car is parked. The rollback reverses the vector, destroying the journey that was taken and sending a new car down the same road. To claim the same person simply loses ten minutes in the rollback scenario is to privilege the pattern over the history, implying that a person is a static object rather than a dynamic process. Since persons are processes defined by their unique trajectory through time, interrupting and resetting that trajectory terminates the person. We must conclude that while we can survive the replacement of our parts in the dark, we cannot survive the erasure of our progress.
