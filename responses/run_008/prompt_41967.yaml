answer: |-
  ### Exam Question (90 Minutes)

  **Question:**
  Supervaluationism is often motivated by the desire to avoid the sharp boundaries mandated by epistemicism. However, critics argue that higher-order vagueness reintroduces sharpness into the supervaluationist framework (e.g., between the definitely true and the indefinite). Evaluate this charge. Does the epistemicist's appeal to margin-for-error principles offer a more coherent account of higher-order vagueness, or does it merely stipulate ignorance? Conclude which theory bears the heavier metaphysical or explanatory burden at higher orders.

  ***

  ### Model Answer (Approx. 600 words)

  The central advantage advertised by supervaluationism is the preservation of classical logic without committing to sharp boundaries in the world. By defining truth as supertruth (truth on all admissible precisifications), the supervaluationist claims to locate vagueness in semantic indecision rather than metaphysical cuts. However, this advantage evaporates under the pressure of higher-order vagueness (HOV). If vagueness is genuine, there should be no sharp boundary between the definitely true ($Dp$) and the merely indefinite ($\neg Dp \land \neg D\neg p$). Yet, standard supervaluationist semantics validates the excluded middle for the definiteness operator: $Dp \lor \neg Dp$. This entails a sharp cutoff between cases where $p$ is definitely true and cases where it is not. Iterating the operator generates a hierarchy of sharp boundaries between $D^n p$ and $D^{n+1} p$. Thus, the supervaluationist does not eliminate sharp boundaries; she merely pushes them up the semantic hierarchy, incurring a "revenge" problem where the semantics itself is precise about where vagueness begins.

  The epistemicist, by contrast, accepts sharp boundaries at the first order but argues they are unknowable. Timothy Williamson defends this via Margin-for-Error (MFE) principles. Knowledge requires safety: if one knows $p$, one could not easily have been wrong. Near the extension boundary of a vague predicate, beliefs are unstable because small changes in the object or context could shift the truth value. Therefore, knowledge must stop short of the boundary. Regarding HOV, the epistemicist treats each iteration of "definitely" as a new predicate with its own sharp, unknowable cutoff. There is no mystery about why there is a boundary between $Dp$ and $\neg Dp$; the mystery is only why we cannot locate it.

  Comparing the burdens, the supervaluationist pays a higher metaphysical price. She posits a precise semantics governing imprecise usage, resulting in a complex architecture of higher-order cutoffs that contradicts the phenomenology of smooth transition. She claims to respect the intuition that there is "no fact of the matter" at the boundary, yet her logic dictates there *is* a fact of the matter about where the "no fact of the matter" region begins. The epistemicist is more honest: she accepts classical semantics and locates the cost entirely in epistemology. The MFE principles explain *why* the boundaries are inaccessible without denying their existence, offering a unified treatment of first and higher-order vagueness. The epistemicist's bill is heavy—unknowable facts—but it is consistent.

  However, this verdict relies on the explanatory power of MFE principles, and here lies the argument's weakest point. A defender of supervaluationism could argue that Williamson's MFE principles are not independent explanations of ignorance but rational reconstructions derived from the assumption that sharp boundaries exist. If the MFE principle is justified solely by the need to save classical logic from vagueness, it risks circularity: we posit sharp boundaries to save logic, then posit MFE to explain why we don't see them. The supervaluationist might retort that it is better to have a semantics that models the *phenomenology* of vagueness (smoothness) even if it creates higher-order sharpness, rather than a semantics that denies the phenomenology entirely to save bivalence. If the goal of a theory of vagueness is to capture the intuitive "blurry" nature of concepts, epistemicism fails fundamentally, regardless of its logical neatness. Thus, while epistemicism handles the *logic* of HOV better, supervaluationism may still win on *descriptive adequacy*, provided one accepts that higher-order sharpness is a lesser evil than first-order sharpness.

  ***

  ### Marking Scheme (20 Marks Total)

  | Criterion | Marks | A-Grade Requirement (16–20) | B-Grade Requirement (12–15) | Typical Botch |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Diagnosis of SV HOV Problem** | 5 | Identifies that SV validates $Dp \lor \neg Dp$, creating sharp cuts between definite and indefinite cases (the "revenge" problem). | States that SV has higher-order boundaries but fails to explain *why* this contradicts SV's core motivation. | Students claim SV has "no sharp boundaries" at all, ignoring the semantics of the $D$-operator. |
  | **2. Exposition of Epistemic MFE** | 5 | Explains MFE as a safety condition on knowledge that generates ignorance without denying bivalence at any order. | Defines MFE as "we can't know the boundary" without linking it to the safety/stability condition of knowledge. | Students treat MFE as a psychological limitation rather than a constitutive norm of knowledge. |
  | **3. Comparative Evaluation** | 5 | Judges which theory bears the heavier burden (metaphysical vs. epistemological) and argues for one based on consistency or honesty. | Lists differences between the theories but offers no judgment on which handles HOV *better* or why. | Students conclude "both have problems" without weighing the specific cost of higher-order sharpness. |
  | **4. Critical Reflection (Weakness)** | 5 | Identifies a genuine vulnerability in the chosen argument (e.g., MFE circularity or SV descriptive adequacy) that could flip the verdict. | Includes a concession (e.g., "Epistemicism is counterintuitive") that is generic and does not threaten the core argument. | Students add a "both sides are valid" disclaimer that contradicts their own conclusion. |

  **Total:** 20 Marks
