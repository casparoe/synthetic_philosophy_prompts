  7.  **Refine the Tone:**
      *   Keep the tech metaphors consistent (SLA, 404, latency, shards, canary deployments).
      *   Ensure philosophical accuracy (Schellenberg's "nonresistant nonbelief" is key).
      *   Avoid taking a side on God's existence, focus on the argument structure.

  8.  **Self-Correction/Nuance Check:**
