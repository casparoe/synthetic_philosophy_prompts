  3.  **Evaluate Tensions and Camp Differences (The "Architecture Review"):**
      *   *Formalist vs. Platonist:*
          *   Platonist: Math exists "out there." Consistency is a fact about reality. If axioms contradict, they are false descriptions.
          *   Formalist: Math is a game of symbols. Consistency is the only virtue.
          *   *Tension:* A Platonist might say "We intuitively know PA is true," which bypasses the need for proof. A Formalist says "Truth is irrelevant, only consistency matters."
      *   *Tension 1: Empirical Evidence vs. Logical Certainty.* You can't have both. If you demand logical certainty, the century of usage is irrelevant (just luck). If you accept empirical evidence, you are treating math like science/engineering (Quinean naturalism), which purists hate.
      *   *Tension 2: Blast Radius.* If PA is inconsistent, *everything* using numbers is suspect. If only Choice is inconsistent, analysis survives. The "quarantine" view assumes modularity. The "collapse" view assumes deep interdependence.

