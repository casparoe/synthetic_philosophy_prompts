      *   *Requirement 1: Empirical Evidence Weight.* The user asks about the "century of no contradictions." In engineering, passing tests $\neq$ bug-free code. But in math, "running the code" is deriving theorems. If the system were inconsistent, *any* statement would be provable. The fact that we *don't* prove nonsense is evidence.
      *   *Requirement 2: The Length of Contradiction.* If the shortest proof of $0=1$ has $10^{100}$ steps, we won't find it. This is the "halting problem" or "complexity" angle. A good response must acknowledge this uncertainty without paralysis.
      *   *Requirement 3: Gödel Hygiene.* Gödel says "You can't prove consistency *inside* the system." He does *not* say "The system is probably inconsistent." A good response must distinguish unprovability from falsehood.
