  **Joint Statement on the Socialist Calculation Debate**

  **I. Agreed Claims**
  1. Walrasian equilibrium equations exist as a theoretical object describing a state of allocative efficiency.
  2. Real economies are never stationary; data changes constantly, requiring dynamic adjustment.
  3. Incentive problems (will to act) are analytically distinct from information problems (ability to know), though we acknowledge their empirical interaction remains contested.
  4. Historical command economies (e.g., USSR) failed to match market economies in consumer satisfaction and innovation.
  5. Prices function as signals of relative scarcity.
  6. Any viable system must account for both static allocation and dynamic innovation.

  **II. Points of Disagreement**
  | Langean Market Socialist | Hayekian Critic |
  | :--- | :--- |
  | A central planning board can simulate market outcomes by treating rules as parameters and adjusting prices via trial-and-error, achieving equity without efficiency loss. | The knowledge required for pricing is tacit, local, and contextual; it cannot be aggregated statistically or fed into a solver, making simulation impossible regardless of compute power. |
  | Mises's objection was primarily practical (computational burden), solvable by modern technology and Lange's tâtonnement. | Mises's objection was logical (no private property = no genuine prices = no economic calculation), independent of technology. |
  | Lange's later view holds that computers settle the debate by enabling equation solving. | The debate concerns knowledge discovery, not equation solving; computers cannot access dispersed tacit knowledge. |

  **III. Cruxes and Predictions**
  1. **Dynamic Discovery:** Does efficiency require discovering *new* means/ends?
     *   *Case:* Introduction of a radically new good (e.g., the first smartphone).
     *   *Langean Prediction:* A planning board could allocate R&D resources efficiently using shadow prices based on consumer feedback loops.
     *   *Hayekian Prediction:* Without residual claimancy, managers cannot judge the potential value of undiscovered goods; resources will be misallocated to known quantities.
  2. **Tacit vs. Codified Data:** Can local knowledge be statisticalized?
     *   *Case:* Factory manager adjusting machine maintenance based on sound/vibration.
     *   *Langean Prediction:* Sensors can codify this data for central processing without efficiency loss.
     *   *Hayekian Prediction:* The decision relies on uncodifiable context; centralizing the data loses the nuance required for the decision.
  3. **Institutional Generation of Data:** Does the market create data or just transmit it?
     *   *Case:* Asset pricing during a crisis.
     *   *Langean Prediction:* Prices reflect underlying fundamentals; planners can estimate these fundamentals via surveys and models.
     *   *Hayekian Prediction:* Prices *create* the consensus on fundamentals through trading; without trading, the data does not exist to be surveyed.

  **IV. Verbal Disputes**
  The term "calculation" is ambiguous. For the Langean, it means solving for equilibrium prices (accounting). For the Hayekian, it means entrepreneurial discovery (coordination). Once distinguished, the dispute shifts from "can computers solve equations?" (Lange wins) to "can computers replicate entrepreneurial judgment?" (Hayek wins). The Mises interpretation dispute (logical vs. practical) largely dissolves if "logical impossibility" is understood as "impossible without the institutional generation of prices," rather than "mathematically unsolvable." Both sides agree that without market institutions, the *type* of information required for efficient allocation is not generated, though they disagree on whether alternative institutions can generate functionally equivalent signals. Consequently, much of the heat derives from conflating the *existence* of equilibrium (agreed) with the *process* of reaching it (disputed).
