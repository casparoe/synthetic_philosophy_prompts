prompt: |-
  I run a small political-economy reading group that's met in the back room of a pub every other Thursday for about two years, and it has now split into two armed camps over the socialist calculation debate. On one side, a Langean market socialist who thinks a planning board adjusting prices by trial and error gets you everything the market does, minus the distributional mess; on the other, a Hayekian who insists the debate was never about computing power at all but about knowledge that never exists in one place in a form that could be fed to a computer. They've been talking past eachother for months: whenever the Hayekian says "tacit knowledge," she hears hand-waving, and whenever she says a big enough computer could just solve the system of equations, he says she's answering a question nobody asked. There's also a running fight about whether Mises's original claim was that socialist calculation is *logically* impossible or merely practically hopeless, and honestly they can't even agree on what the disagreement is about. My socialist friend also keeps bringing up that Lange himself supposedly later said computers would settle the whole thing, which does not help.

  I'd like you to act as a professional philosopher of economics who's been brought in to facilitate an adversarial collaboration between these two, and to draft the joint statement they could both actually put their names to. That means: the claims they genuinely agree on (I suspect there are more than they'd expect — e.g. that the equilibrium equations exist as an object, that real economies are never stationary, maybe that incentive problems are a separate question from information problems, though flag it if that last one is itself part of the dispute); the precise points of remaining disagreement, each phrased so the side holding it would accept the wording as a fair statement of their view; the cruxes, meaning the sub-questions such that settling one would actually move at least one of them; and for each crux, the argument or concrete case both sides would agree bears on it, with each side's prediction written down in advance. And please be honest about whether any part of their dispute is purely verbal — my own suspicion is that the word "calculation" is doing double duty as both "solve the equations" and "discover the prices," and if I'm right I want to know which arguments collapse into word games once you split those apart.

  Think it through carefully before you write — it's probably worth privately working out each side's strongest steelman — but only send me the final document, since I'll be reading it to the group. Format it as: a numbered list of agreed claims, then a table of the disagreements (one column per side, each column in that side's own acceptable wording), then the cruxes with predictions, then a short section on which if any disputes are verbal. Hard limit of 800 words total — they want something that can be read aloud in the pub in one go without anyone getting another round in first.
