answer: |-
  Right, pull up a chair. I've spent the best part of fifteen years in university departments arguing about drowning swimmers, and I'll tell you this: your mates down the pub have stumbled onto one of the stickiest problems in moral philosophy without even knowing it. You've got the intuition, but your taxonomy is a bit muddled. Specifically, your "Duelists" and your "Flippers" often end up doing the exact same thing (flipping a coin), even if they give different reasons for it. And "Limited Aggregation" is just a fancy name for your "Thresholders."

  But you're right about the clustering thing. That's not standard theory; that's psychology. Whether five people are in one boat or spread out shouldn't matter morally, but it matters *viscerally*.

  Below is the work. First, I'll show you my scratchpad (how I bin bad questions), then the final quiz, then the proper philosophical breakdown of what the scores actually mean—including the bits that should make your respondents squirm.

  ***

  ### Part 1: The Scratchpad (Discarded Drafts)

  *Before settling on the eight below, I tried these. I'm telling you this so you know why they didn't make the cut.*

  *   **Draft A (The Trolley):** *A runaway tram is heading towards five people tied to the tracks...*
      *   **Bin it.** Too Americanised (trams), and it involves *killing* someone to save others. You want *rescue* cases (letting die vs. saving). It introduces "dirty hands" which confuses the numbers question.
  *   **Draft B (The Cost):** *You can save the five, but you'll ruin your van's engine.*
      *   **Bin it.** Introduces self-sacrifice. We want to isolate whether *numbers* count, not whether *cost* counts. Keep the cost to you neutral.
  *   **Draft C (The Blame):** *The one swimmer is drunk; the five are children.*
      *   **Bin it.** Desert and age muddy the water. We want identical moral worth, just different quantities.
  *   **Draft D (The Friend Variant):** *One stranger vs. five strangers, but one stranger is a doctor.*
      *   **Bin it.** Instrumental value (what they can do later) distracts from intrinsic value (their right to be saved). Stick to "mate vs. strangers."

  ***

  ### Part 2: The "Who Counts?" Quiz

  **Instructions:** Read each scenario. Imagine you are there, you are the only help available, and you *must* choose. There is no time to call for backup. Pick the option that matches what you would actually do, not what sounds noble.

  **1. The Canal Boat (Baseline)**
  You're walking the towpath of the Manchester Ship Canal. A narrowboat has sunk. One person is trapped in the cabin. Further down, a separate boat has sunk with one person trapped. You can only reach one in time.
  *   A) Save the first person.
  *   B) Save the second person.
  *   C) Flip a coin.

  **2. The Low Tide (Escalation 1)**
  You're on a sandbank near Blackpool. The tide is coming in fast. To your left, one child is stuck in a gully. To your right, two children are stuck in a separate gully. You can only carry one group to safety.
  *   A) Save the one child.
  *   B) Save the two children.
  *   C) Flip a coin.

  **3. The Open Water (Standard)**
  You're in a rescue dinghy off the Cornish coast. One swimmer is waving from a reef. Half a mile away, five swimmers are waving from a separate reef. The engine won't reach both.
  *   A) Save the one swimmer.
  *   B) Save the five swimmers.
  *   C) Flip a coin.

  **4. The Sinking Dinghy (Clustering)**
  Same Cornish coast. One swimmer is on a reef. Nearby, a small rubber dinghy has capsized with five people clinging to it. They are huddled together. You can only reach one group.
  *   A) Save the one swimmer.
  *   B) Save the five in the dinghy.
  *   C) Flip a coin.

  **5. The Mine Collapse (Escalation 2)**
  There's been a slip in a old quarry in the Peak District. One climber is pinned under a rock. In a separate crevice, fifty climbers are pinned. The ground is unstable; you can only stabilise one area.
  *   A) Save the one climber.
  *   B) Save the fifty climbers.
  *   C) Flip a coin.

  **6. The Best Mate (Partiality)**
  You're on a houseboat in London. A fire breaks out. Your best mate is in one cabin. In the other cabin, five strangers are asleep. You can only wake one cabin in time.
  *   A) Save your mate.
  *   B) Save the five strangers.
  *   C) Flip a coin.

  **7. The Commuter Rush (Threshold Check)**
  A London Underground train has stalled in a tunnel. One passenger is having a heart attack in the front carriage. In the rear carriage, ten passengers are trapped by a blocked door. You can only open one door to let the paramedics in.
  *   A) Save the one passenger.
  *   B) Save the ten passengers.
  *   C) Flip a coin.

  **8. The Flood (Extreme Escalation)**
  A flash flood in Wales. One farmer is on his roof. Downstream, a whole village school bus (100 kids) is stuck in the water. You have one boat.
  *   A) Save the farmer.
  *   B) Save the kids.
  *   C) Flip a coin.

  ***

  ### Part 3: The Scoring Key & Philosophical Map

  Here is the hard bit. Most quizzes just say "You are a Utilitarian." That's rubbish. We need to map your *commitments*.

  First, a correction on your taxonomy.
  *   **Flippers vs. Duelists:** In a practical quiz, these are the same. A Flipper (Taurek) says "Numbers don't count, give everyone an equal chance." A Duelist (Kamm/Quinn) says "You can't sum the five claims to outweigh the one." Both end up flipping a coin in the 1-vs-5 case. I have grouped them as **Non-Aggregators**.
  *   **Thresholders vs. Limited Aggregators:** These are the same view. Small numbers don't aggregate; big numbers do.
  *   **The Clustering Variable:** This isn't a standard moral theory. If someone treats Q3 (Scattered) and Q4 (Clustered) differently, they aren't following a rule; they are following a *vibe* (Salience Sensitivity).

  #### How to Score
  Give 1 point for choosing the **Larger Group** (or Mate in Q6).
  Give 0 points for **Flipping**.
  Give -1 points for choosing the **Smaller Group** (virtually no one does this, but it's possible).

  *Note: Q6 is weighted differently. Choosing the Mate is "Partialist," choosing the 5 is "Impartial."*

  #### The Five Profiles

  **1. The Strict Aggregator (The Adder)**
  *   **Pattern:** Saves the larger group in Q2, Q3, Q4, Q5, Q7, Q8. Saves the 5 strangers over the Mate in Q6.
  *   **Philosophical Label:** Act Utilitarianism / Impartial Consequentialism.
  *   **The View:** Moral arithmetic is simple. One life plus one life equals two lives. A life is a life, whether it's your mate or a stranger.
  *   **The Awkward Commitment:** You must admit that if the numbers were high enough (say, 1,000 strangers), you would let your own child or spouse drown to save them. You treat people as containers of value, not unique relationships. If you baulk at that, you aren't a true Aggregator.

  **2. The Strict Egalitarian (The Flipper)**
  *   **Pattern:** Flips a coin in Q1, Q2, Q3, Q4, Q5, Q7, Q8. (May save mate in Q6).
  *   **Philosophical Label:** Taurek-style Non-Aggregation.
  *   **The View:** "I owe each person a duty to try to save them. I cannot owe the five a duty that is five times stronger than the one." Summing lives is a category error.
  *   **The Awkward Commitment:** You must be willing to flip a coin between saving **one person** and saving **the entire human race** (Q8). If you say "Obviously save the 100 kids," you are not a Strict Egalitarian. Most people who start as Flippers break at Q5 or Q8.

  **3. The Thresholder (The Limited Aggregator)**
  *   **Pattern:** Flips in Q1 (1v1) and Q2 (1v2). Saves the larger group in Q5 (1v50) and Q8 (1v100). Might flip or save in Q3/Q7 (1v5 or 1v10).
  *   **Philosophical Label:** Sufficientism / Weighted Aggregation.
  *   **The View:** Numbers count, but only when the difference is significant. A slight majority doesn't override an individual's right, but a landslide does.
  *   **The Awkward Commitment:** **The Line Problem.** You have to defend *where* the line is. Why does 50 outweigh 1, but 2 doesn't? Is it 3? 12? 47? There is no non-arbitrary number. You are committed to saying that the 49th person added to the group suddenly changes the moral reality, while the 48th did not. That's hard to justify logically.

  **4. The Salience Sensitive (The Cluster-Biased)**
  *   **Pattern:** Saves the 5 in Q4 (Dinghy/Clustered) but Flips in Q3 (Scattered Swimmers).
  *   **Philosophical Label:** None. (Psychological Bias).
  *   **The View:** "It feels different when they are together."
  *   **The Awkward Commitment:** You are admitting that **physical proximity changes moral worth.** If the five swimmers hold hands, do they suddenly outweigh the one? If the dinghy breaks apart, do they lose value? This view implies that morality depends on geography, not rights. It's inconsistent, but very common.

  **5. The Partialist (The Mate Saver)**
  *   **Pattern:** Saves the Mate in Q6, even if they save the 5 strangers in Q3.
  *   **Philosophical Label:** Agent-Centred Prerogative.
  *   **The View:** We are not robots. We are allowed (or required) to care more about our own projects and people.
  *   **The Awkward Commitment:** **The Limit of Loyalty.** Most Partialists save the mate in Q6 (1 vs 5). But what about Q8 (Mate vs 100 Kids)? If you still save the mate, you are committed to saying your friendship is worth more than 100 futures. If you save the kids in Q8 but the mate in Q6, you are actually a **Thresholder with Partiality**—you have a line where loyalty gets overridden by numbers.

  #### Empty Corners & Overlaps

  *   **The "Save the Fewer" Corner:** I have never met anyone who consistently chooses to save the one over the five without a specific reason (like "the one is a doctor"). If your quiz takers do this, they aren't moral philosophers; they're contrarians.
  *   **The Flipper/Duelist Overlap:** As I said, the quiz cannot separate these. The Flipper says "Equal Chance." The Duelist says "No Summing." But both flip the coin. To separate them, you'd need to ask *why* after the quiz. For your purposes, treat them as the same bloc: **The Non-Aggregators.**
  *   **The "Vague Threshold":** Many people will say "I'd save the 50, flip for the 2, and... er... think about it for the 5." This is the most common human response. It's not a clean theory, it's **Moral Heuristics.** We don't have a rule; we have a gut feeling that gets stronger as the numbers gap widens.

  ### Final Advice for the Forum
  When you post the results, don't just say "Most of you are Utilitarians." Point out the **Line Problem** to the Thresholders (ask them to name the exact number where it switches). Point out the **Extreme Case** to the Flippers (ask them about the 1 vs 1,000,000 case). And ask the Cluster-Biased if holding hands changes a person's right to life.

  That's where the real pub rows start. Good luck with the poll.
