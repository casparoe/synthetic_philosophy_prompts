          *   **Thresholders:** Numbers count *after* a certain point. (Often linked to "Limited Aggregation" or "Sufficientism").
          *   **Duelists:** Pairwise comparison (Kamm/Quinn style). You can't sum the five to outweigh the one. Each of the five has a claim equal to the one.
          *   **The Friend Factor:** Partiality vs. Impartiality.
      *   *Real Philosophical Landscape:*
          *   *Strict Aggregation:* Always save the greater number. (Adders).
          *   *Strict Non-Aggregation:* Numbers never count. Flip a coin. (Flippers/Taurek).
          *   *Pairwise Comparison:* Compare individual vs. individual. If I save the five, I'm ignoring the one's claim that is just as strong as any single one of the five. (Duelists). *Note:* This often leads to flipping in 1v5, but might allow saving the 5 in 1v1000 if the burden on the one is negligible? No, usually leads to flipping or randomizing unless there's a tie-breaker.
          *   *Limited Aggregation/Threshold:* Small numbers don't aggregate to outweigh a significant loss to one. Large numbers do. (Thresholders).
          *   *Clustering:* Does physical proximity matter? Philosophically, usually no (irrelevant). Psychologically, yes (salience). If a user distinguishes here, it might indicate a "Salience/Group Agent" bias rather than a strict moral theory, *or* a view that a "group" has a claim distinct from individuals.
          *   *Empty Corners:* Is there a view that says "Save the *fewer* people"? Unlikely, unless there's a specific reason (e.g., they are more virtuous).
          *   *Overlap:* "Duelists" and "Flippers" often yield the same action (flip) in standard cases, but for different reasons. Flippers say "equal chance." Duelists say "no summation." Distinguishing them is hard in a short quiz. "Thresholders" and "Limited Aggregators" are basically the same.
      *   *Awkward Commitments:*
          *   Adders: Must save 1,000,000 strangers over 1 child/spouse.
          *   Flippers: Must flip between 1 and 1,000,000.
          *   Thresholders: Must defend *where* the line is. Why 51 and not 50?
