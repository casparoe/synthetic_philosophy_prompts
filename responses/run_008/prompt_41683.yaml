  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on the Cigar:* The cigar example is actually more Veblen (Conspicuous Consumption) than Zahavi (Handicap). Veblen says "I waste to show I can." Zahavi says "I waste because my biology forces me to prove fitness." They overlap, but the *mechanism* of honesty is the differential cost. I need to make sure I emphasize the **Marginal Cost** argument.
      *   *Startup Context:* Burning cash on free tiers is often a "Blitzscaling" strategy (network effects), not necessarily signaling. If the unit economics don't work, it's not a signal, it's a suicide pact. I need to distinguish between *strategic loss* (investment) and *handicap signal*.
