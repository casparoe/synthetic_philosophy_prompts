  8.  (Self-Correction during drafting): Make sure to distinguish between *Signaling Theory* (Spence) and *Handicap Principle* (Zahavi). They are related but Spence is more about job markets/education. Zahavi is biological. The cigar example is technically Veblen, but functions like Zahavi. I should clarify that distinction briefly so the engineer understands the mechanical requirement (differential cost).

      *Decision:* Keep it focused on the Handicap Principle mechanics (differential cost) as that's what the manager is citing. Don't get bogged down in Veblen vs. Zahavi semantics, but focus on the *math* of the signal.

      *Refining the Startup critique:* The key is that burning cash on free tiers is often a *strategy* (network effects), not a *signal*. If the strategy fails, the company dies. A peacock tail *always* hinders survival unless the genes are good. Burning cash hinders survival unless the *market* is good. The uncertainty is external, not internal. That's the flaw.

