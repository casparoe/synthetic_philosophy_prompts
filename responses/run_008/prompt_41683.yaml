      *   **Part 2: Where the Mapping Breaks (The Crucial Mechanics):**
          *   *Differential Cost:* This is the most important technical point. It's not that the signal is costly; it's that it's *prohibitively* costly for the faker. A poor person burning \$100 starves; a rich person doesn't notice.
          *   *The Receiver's Role:* In biology, the receiver (hen) *must* respond for the signal to evolve. If hens didn't care about tails, tails wouldn't exist. In the cigar story, if onlookers don't grant status, the signal fails.
          *   *Costly $\rightarrow$ Honest?* No. "Costly" is necessary but not sufficient. It must be an *honest* cost (differential). Random waste is just waste.

      *   **Part 3: Auditing the Manager's Startup Analogy:**
          *   *Scenario:* Startup burning cash on free tiers.
