      *   *Tension:* If the institution relies on social recognition, Pierre's internal state matters less than what society thinks of him. However, if Pierre represents the *future* audience (the elite shifting values), his internal shift predicts the external shift.
      *   *Verdict:* It's a strong reading, but needs nuance. Pierre isn't just "feeling differently"; he is becoming the kind of man whose opinion *matters* (eventually). But Tolstoy is indeed more interested in Pierre's soul than sociology. The risk is psychologizing a sociological mechanism.
      *   *Key Insight:* Appiah says arguments don't work; feelings/status do. Pierre's "nausea" isn't a moral argument; it's an affective rejection. This aligns with Appiah. But Dolokhov shows the *lag* time. Institutions die when the Pierres outnumber the Dolokhovs *in the status hierarchy*.

