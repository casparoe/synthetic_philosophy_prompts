answer: |-
  ### Cold Open

  **1.** Most of my listeners come from a forecasting background where the goal is to sharpen probabilities until everything looks like risk. You're arguing that when probabilities are genuinely unavailable, avoiding that bet isn't a cognitive bug, it's a rational feature. If we accept your view, does the standard goal of calibration—trying to turn ambiguity into risk—actually become dangerous?
  *Follow-up:* [Assumes she says calibration is still useful but has limits] For the listeners trying to apply this, could you give a concrete rule for when we stop trying to calibrate and start avoiding the bet entirely?

  ### The Urn Problems

  **2.** Let's walk through the classic thought experiment for the uninitiated. Imagine two urns: one has exactly 50 red and 50 black balls; the other has 100 balls but the mix is completely unknown. Most people prefer betting on red from the known urn, but also prefer betting on black from the known urn. Mathematically, you can't think the known urn is more likely to yield red *and* more likely to yield black than the unknown urn. How do you defend that preference without violating basic logic?
  *Follow-up:* [Assumes she says probabilities aren't single point estimates] To make this usable for us, what specific calculation should we be doing instead of expected value to handle those non-single numbers?

  **3.** My co-host argues that the unknown urn is just a compound lottery: you don't know the mix, but you can assign a probability to the possible mixes, which collapses the problem back into ordinary risk aversion. Why is that reduction incorrect? Why isn't ambiguity aversion just risk aversion wearing a mask?
  *Follow-up:* [Assumes she says second-order probabilities are also unknown] So at what point do we stop questioning our uncertainty and actually place a bet, or does this lead to an infinite regress where we never act?

  **4.** A common criticism is that ambiguity aversion disappears with experience—if I let people draw balls from the unknown urn repeatedly, they learn the distribution and start acting like expected utility theorists. Does your defense of ambiguity aversion only hold for one-off decisions, and if so, how much of real life is actually a one-off?
  *Follow-up:* [Assumes she says unique decisions matter disproportionately] To help us gauge the stakes, could you quantify roughly what percentage of life decisions are truly unique enough to warrant this kind of protection?

  ### Rationality or Psychology

  **5.** People often connect ambiguity aversion to robustness—choosing the option that performs 'okay' across all scenarios rather than 'great' in one and 'terrible' in another, sometimes called max-min reasoning. Is ambiguity aversion essentially just a preference for robustness, and if so, is that a moral stance or a mathematical one?
  *Follow-up:* [Assumes she says it's about survival/utility] So is it rational for a billionaire to be ambiguity averse, or does this logic only hold for those who can't afford a worst-case scenario?

  **6.** If ambiguity aversion is rational, should we be teaching it? In my field, we usually try to debias people away from this instinct. Are we accidentally training people to take risks they shouldn't understand?
  *Follow-up:* [Assumes she says it depends on the domain] Could you give me one specific domain where we are currently teaching the wrong thing and need to flip the script?

  **7.** The standard counter-argument is that ambiguity averse choices make you vulnerable to being 'Dutch-booked'—guaranteed to lose money through a series of trades. If your view accepts these choices as rational, do you also accept that rational agents can be money-pumped, or is there a flaw in the Dutch-book argument itself?
  *Follow-up:* [Assumes she says Dutch-books assume probabilistic coherence] So what is the new coherence rule we should use that prevents decision theory from becoming 'anything goes'?

  ### Real Stakes

  **8.** I'll make this personal: eight months ago I left a stable job with predictable promotion cycles for a venture where the odds are genuinely unknowable. I've been second-guessing that move. Under your framework, was staying in the stable job the more rational choice simply because the ambiguity was lower, even if the venture had higher upside?
  *Follow-up:* [Assumes she says utility functions vary] So is there any objective sense in which my second-guessing is misplaced, or is it all just subjective preference masking as rationality?

  **9.** Think about insurance against emerging risks, like a pandemic or new technology failure, where historical data doesn't exist. Is this the ideal domain for ambiguity aversion, where paying a premium to avoid the unknown is actually the correct pricing model?
  *Follow-up:* [Assumes she says yes, precaution is rational] Where is the budget constraint? How much premium is too much to pay for ambiguity avoidance before it becomes paralysis?

  ### Closer

  **10.** Finally, what evidence would actually change your mind? Is there an experiment or a real-world observation that would convince you that ambiguity aversion is indeed a bias to be corrected?
  *Follow-up:* [Assumes she says if people acted inconsistently to their own goals] So is the only sin inconsistency, regardless of how much money you lose by holding that view?
