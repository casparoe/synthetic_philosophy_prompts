answer: |-
  **Credence: 0.28**

  I am lower than your current 0.35. I think the psychological data has tightened around "personal force" and "causal topology" as the primary drivers, leaving DDE as a post-hoc rationalization students (and philosophers) project onto the intuition rather than the engine generating it.

  Here is the decomposition. I am treating these as conditional probabilities required for the conjunction "DDE is the *best* explanation" to hold.

  **(1) Probability intuitions distinguish causal structures: 0.85**
  *   **Claim:** Ordinary subjects reliably distinguish "harm redirected off its existing path" (Switch) from "harm brought about as part of the plan" (Fat Man).
  *   **Rationale:** The Switch/Fat Man split is the most robust finding in experimental ethics. Even cross-culturally, the "push" variant is rejected far more often than the "switch" variant. People definitely see a difference.
  *   **Why not 1.0?** Framing effects are massive. If you describe the Fat Man case as "dropping a weight" rather than "pushing a man," permissibility spikes. This suggests the distinction isn't stable enough to be a deep cognitive rule.

  **(2) Conditional on (1), probability DDE (Intention) drives it rather than Deflection/Force: 0.35**
  *   **Claim:** Given that people see a difference, that difference is tracked by the *intended/foreseen* distinction rather than causal topology (deflection) or physical immediacy (personal force).
  *   **Rationale:** This is the bottleneck. Thomson's Loop is the graveyard of DDE psychology. In the Loop, the man is causally a means (his body stops the train), satisfying the DDE prohibition. Yet, most subjects judge it permissible, aligning with the Switch (Deflection). If DDE were the psychological engine, Loop should cluster with Fat Man. It doesn't.
  *   **The Fork:** You asked if the Loop failure is evidence *for* DDE (people ignore causal structure, so DDE must be driving) or *against* it (people aren't reasoning). I land firmly on **against**. If people ignore the causal means-structure in Loop, they aren't applying DDE; they are applying a "Redirecting Threat" heuristic or a "No Personal Contact" heuristic. The fact that they call Loop permissible suggests they *don't* see the death as intended means, despite the causal reality. This implies their "intention" ascription is being manipulated by the topology, not the other way around. DDE becomes an output, not an input.
  *   **Why not lower?** The Knobe Effect shows moral valence *does* load intentionality ascriptions. People are more likely to call a side-effect "intentional" if it's bad. So there is *some* coupling between moral judgment and intention. But in Trolley cases, physical salience swamps this.

  **(3) Probability proportionality does independent work: 0.45**
  *   **Claim:** The "good effect must outweigh the bad" condition is a live constraint in ordinary intuition, not just philosophical decoration.
  *   **Rationale:** In standard Trolley cases, the ratio is fixed (1 vs. 5). We rarely test if people forbid the Switch if it's 1 vs. 2. When we do, utilitarian calculations often override DDE constraints. If DDE were the driver, the means/side-effect distinction should hold even if the numbers are close (e.g., 1 vs. 2). But intuition wavers significantly on the numbers, suggesting the "proportionality" is actually a utilitarian overlay that can override the deontological constraint. If the constraint is easily overridden, it's not doing the heavy lifting.
  *   **Why not lower?** There is a "threshold" intuition. People won't push the fat man to save *one*, but might to save *a million*. So proportionality matters, but it looks more like a threshold utilitarianism than DDE proportionality.

  ### Sensitivity Analysis

  **Most Sensitive Term:** **Term 2 (DDE vs. Deflection/Force).**
  This is the load-bearing wall. If Term 2 goes up, my credence doubles. If it goes down, DDE is dead as a psychological hypothesis.

  **Evidence That Would Move It:**
  We need a case that **uncouples Personal Force from Causal Means while holding Topology constant.**

  *   **The Current Confound:** In Fat Man, you have Personal Force + Causal Means. In Switch, you have No Personal Force + Causal Side-Effect. We don't know which feature drives the judgment.
  *   **The Needed Design:** A "Remote Means" case.
      *   *Setup:* You are in a booth. You can press a button that opens a trapdoor under a large man, dropping him onto the track to stop the trolley. No physical contact. He is causally a means (his mass stops the train).
      *   *DDE Prediction:* Impermissible (death is intended means).
      *   *Deflection/Force Prediction:* Permissible (no personal force, redirecting threat via mechanism).
      *   *Current Data:* Greene's fMRI work suggests "impersonal" moral violations (like this) activate cognitive control regions, not emotional aversion regions, and people rate them as more permissible than personal violations. This hurts DDE.
      *   *What would move me:* If you run this case and subjects overwhelmingly say **Impermissible** despite the lack of contact, that rescues Term 2. It would show they are tracking the *causal role* (means) rather than the *physical salience* (pushing). If they say **Permissible**, DDE is confirmed as merely a rationalization for disgust/aversion.

  **On Your "Guilty Party" Variant:**
  When you tell students the victim is the villain who set the trolley loose, you are introducing **Desert**. This confounds DDE completely. DDE is strictly about the structure of action, not the moral worth of the patient. If their intuition shifts, it's likely retributive justice overriding the structural constraint. It doesn't test DDE; it tests whether students are consequentialists about punishment. I wouldn't trust that data to move Term 2.

  **Summary:**
  I think you are right to be drifting downward. The "puddle" is deep. The Intention/Foresight distinction exists in folk psychology (Knobe), but in high-stakes harm scenarios, it is subordinate to physical immediacy and causal topology. DDE is likely the *language* students use to justify the intuition, not the *mechanism* producing it.
