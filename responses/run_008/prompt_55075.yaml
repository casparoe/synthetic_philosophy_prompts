  **Scenario**
  A city emergency manager must select one of three flood protocols for the upcoming season: "Levees" ($L$), "Pumps" ($P$), or "Sandbags" ($H$). The season's severity is uncertain, modeled as either "Minor" or "Major" flooding. Two competing hydrological models provide the credal set: Model A assigns probability 0.8 to Minor and 0.2 to Major, while Model B assigns 0.2 to Minor and 0.8 to Major. Payoffs represent expected property damage saved in millions of dollars. Levees save \$10M in Minor seasons and \$100M in Major ones; Pumps save \$100M in Minor and \$10M in Major; Sandbags, being flexible but less potent, save \$60M regardless of severity. The manager must commit to a single protocol before the season begins, and the credal set is treated as the discrete set of these two expert models without averaging them.

  ***

  **Demonstration**

  **1. Expectation Calculations**
  Let $E_A$ and $E_B$ denote expected utility under Model A and Model B, respectively.
  *   **Levees ($L$):**
      *   $E_A[L] = 0.8(10) + 0.2(100) = 8 + 20 = 28$.
      *   $E_B[L] = 0.2(10) + 0.8(100) = 2 + 80 = 82$.
      *   Worst-case (Maximin): $\min(28, 82) = 28$.
  *   **Pumps ($P$):**
      *   $E_A[P] = 0.8(100) + 0.2(10) = 80 + 2 = 82$.
      *   $E_B[P] = 0.2(100) + 0.8(10) = 20 + 8 = 28$.
      *   Worst-case (Maximin): $\min(82, 28) = 28$.
  *   **Sandbags ($H$):**
      *   $E_A[H] = 0.8(60) + 0.2(60) = 48 + 12 = 60$.
      *   $E_B[H] = 0.2(60) + 0.8(60) = 12 + 48 = 60$.
      *   Worst-case (Maximin): $\min(60, 60) = 60$.

  **2. Admissibility Filters**
  *   **E-Admissibility:** An act is admissible if it maximizes expectation for at least one prior.
      *   Under Model A: $P (82) > H (60) > L (28)$. Maximizer: $P$.
      *   Under Model B: $L (82) > H (60) > P (28)$. Maximizer: $L$.
      *   **Result:** $H$ is never a maximizer. The E-admissible set is $\{L, P\}$. $H$ is excluded.
  *   **Maximality:** An act is admissible unless another act beats it under *every* prior.
      *   Does $L$ beat $H$? $E_A: 28 < 60$. No.
      *   Does $P$ beat $H$? $E_B: 28 < 60$. No.
      *   **Result:** Nothing dominates $H$. The Maximal set is $\{L, P, H\}$.

  **3. Two-Level Decision Procedure**
  Both agents apply Maximin (worst-case expectation) to break ties among their admissible sets.
  *   **Agent E (E-Admissibility):** Chooses from $\{L, P\}$.
      *   Maximin values: $L=28, P=28$.
      *   **Action:** Indifferent between $L$ and $P$. Following the tie-breaking rule, the agent randomizes or picks an extreme act. The guaranteed value is **28**.
  *   **Agent M (Maximality):** Chooses from $\{L, P, H\}$.
      *   Maximin values: $L=28, P=28, H=60$.
      *   **Action:** Strictly prefers $H$. The guaranteed value is **60**.

  **4. Randomization Check**
  Could Agent E recover the value of $H$ by randomizing between the survivors $L$ and $P$?
  A 50/50 mixture of $L$ and $P$ yields payoffs of \$55M in both states ($0.5 \times 10 + 0.5 \times 100$). The expectation is 55 under both models. Since $55 < 60$, randomization among E-admissible acts **fails** to capture the benefit of the pivotal act $H$.

  ***

  **Analysis**

  **Structural Feature**
  The divergence arises because the pivotal act $H$ has a "flat" expectation profile (60, 60) that lies strictly above the line segment connecting the expectation profiles of the extreme acts $L$ (28, 82) and $P$ (82, 28) in the utility space. $H$ is a robust compromise that is second-best for every specific prior but better than the extremes in the worst case. E-admissibility filters it out because it requires an act to be *first-best* for someone; Maximality retains it because it requires only that an act be *not-worst* for everyone.

  **Sensitivity to Convexification**
  If the credal set is convexified (closed under mixtures of priors), the wedge dissolves. Consider a mixture prior $P_{0.5} = 0.5 P_A + 0.5 P_B$. Under $P_{0.5}$, the expectations are $E[L]=55, E[P]=55, E[H]=60$. Here, $H$ is the unique expected-utility maximizer. Thus, if the agent treats the uncertainty as a convex set of probabilities rather than a discrete set of expert opinions, $H$ becomes E-admissible, and both agents choose $H$. This highlights that E-admissibility is sensitive to whether the credal set represents a disjunction of views (keep them separate) or a convex uncertainty (average them). Maximality is invariant to this change, as dominance relations depend only on the extreme points of the credal set.

  **Exchange of Objections**
  *   **The E-Admissibility Critique:** "Rational choice requires vindication from a coherent standpoint. To choose $H$ is to act on a probability (the 50/50 mix) that you do not actually hold. Neither Model A nor Model B endorses $H$ as optimal. Choosing it implies you are optimizing for a 'compromise belief' that no expert supports, which is epistemically dishonest."
  *   **The Maximality Reply:** "Rationality is about avoiding avoidable loss. By restricting yourself to $\{L, P\}$, you expose yourself to a worst-case outcome of 28. By choosing $H$, you guarantee 60. No available alternative beats $H$ on all credible models. Why should I accept a risk of 28 when 60 is available and undominated? The requirement to be 'first-best' for some prior is an unnecessary constraint that forces the agent to gamble on which expert is right."
