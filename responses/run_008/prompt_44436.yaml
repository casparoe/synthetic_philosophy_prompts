answer: |-
  1. **Why the obvious answers die fast**

  The conservationist move—"biodiversity is intrinsically good"—begs the question against welfare. It assumes the existence of species outweighs the suffering of individuals within them, which is precisely what the wild-animal welfare (WAW) advocate denies. Conversely, the WAW move—"suffering is bad, so fewer animals is better"—collapses into anti-natalism for wild spaces. If true, the ethical imperative is to sterilize nature, a verdict conservation biology rejects as ecocidal. Finally, the "balance of nature" appeal fails because evolutionary stability does not equate to moral goodness; a stable ecosystem can be a suffering pump. Each position smuggles in a population ethic or metaphysical claim it refuses to defend, rendering them useless for adjudicating habitat loss.

  2. **The desiderata**

  **1. Scalability Across Life Histories:** The theory must aggregate welfare across vastly different lifespans and cognitive capacities without collapsing into sheer numbers. *Case:* Destroying a wetland prevents billions of short insect lives. If those lives are net negative, destruction prevents suffering; if net positive, it creates a massive welfare loss. A theory that counts only mammals ignores the bulk of sentient biomass; one that counts only neurons ignores intensity. It must weigh quantity against quality without arbitrary cutoffs.

  **2. Counterfactual Baseline Clarity:** The theory must specify the comparison class for "harm." *Case:* Is destruction evaluated against pristine wilderness, the current degraded state, or the parking lot that replaces it? If the baseline is "pristine," current conservation is always failing. If the baseline is "extinction," any habitat is a win. Without a fixed counterfactual, "net ecosystem welfare" is mathematically indeterminate.

  **3. Non-Identity Handling:** The theory must state whether preventing existence wrongs the uncreated. *Case:* Habitat destruction changes which animals come into existence. A person-affecting view says you cannot harm those who never exist. A total view says you lose potential value. The theory must explicitly accept or reject the non-identity problem, not hide behind ambiguous language about "future generations."

  **4. Fitness-Welfare Decoupling:** The theory must recognize that evolutionary success is not well-being. *Case:* Evolution optimizes for reproductive fitness, often via high offspring mortality and stress. A theory that assumes "natural function" equals "good life" fails empirically. It must allow that a perfectly functioning ecosystem might be a net negative for welfare.

  **5. Predation Integration:** The theory must account for suffering caused by natural processes, not just anthropogenic ones. *Case:* Restoring habitat increases predator populations. If predation causes net suffering, restoration might be morally suspect. A theory that treats "natural" suffering as morally neutral while condemning "human" suffering is inconsistent unless it defends a specific agency constraint.

  **6. Ontological Unit Specification:** The theory must declare the unit of moral concern: individual or holistic. *Case:* Aldo Leopold's land ethic values the biotic community; WAW values sentient individuals. These conflict when ecosystem health requires individual culling. Silence here hides the ball; the theory must state whether the ecosystem has value over and above its inhabitants.

  **7. Epistemic Robustness:** The theory must offer guidance under massive empirical uncertainty. *Case:* We do not know the sentience thresholds of insects or the valence of wild lives. A theory requiring perfect data is unusable. It must either provide heuristics for uncertainty or admit paralysis and specify the cost of waiting for evidence.

  3. **Tensions**

  Several desiderata appear mutually exclusive. **Scalability** clashes with **Epistemic Robustness**: to aggregate billions of insect lives accurately, you need data we fundamentally lack. If you demand the data, you violate robustness; if you guess, you violate scalability. More critically, **Ontological Unit** creates a hard split. You cannot simultaneously hold that the ecosystem is the primary unit of value (Holism) and that individual suffering is the primary disvalue (Individualism). When a healthy ecosystem requires high predation rates, one value must trump the other.

  If the list is unsatisfiable, **Ontological Unit Specification** is the requirement to drop, but only by bifurcation. We must admit there is no single "net ecosystem welfare." There is *ecosystem health* (holistic) and *wild animal welfare* (individualist). Trying to merge them into one metric forces a category error. We should stop asking if habitat loss is "good" simpliciter and start asking: "Good for the system's stability, or good for the individuals within it?" If forced to choose one metric for policy, I would drop **Holism**. Systems don't feel pain; individuals do. Prioritizing the abstract whole over concrete suffering is a metaphysical luxury we cannot afford.

  4. **Non-negotiables vs camp preferences**

  **Non-negotiables:** Any serious theory must meet **Fitness-Welfare Decoupling** and **Baseline Clarity**. Without these, the theory is empirically false or logically incoherent. Assuming nature is benevolent contradicts evolutionary biology; lacking a baseline makes calculation impossible. These are structural requirements for truth-tracking.

  **Camp Preferences:** **Scalability** (Total vs. Average), **Non-Identity** (Person-affecting vs. Impersonal), and **Ontological Unit** are ideological commitments. Utilitarians demand total welfare aggregation; person-affecting views demand specific victims. Conservationists demand holism; WAW advocates demand individualism. These are not solvable by data alone. A theory doesn't fail by choosing one, but it fails by claiming its choice is neutral. Admit these are value judgments, not empirical discoveries.

  5. **Scorecard**

  **Total Utilitarianism:** Passes **Scalability** and **Fitness-Welfare**. Fails **Non-Identity** (implies preventing existence is good if lives are net negative, endorsing habitat destruction). Fails **Epistemic Robustness** (requires impossible calculations).

  **Average Utilitarianism:** Passes **Non-Identity** (less sensitive to mere addition). Fails **Scalability** (adding happy animals doesn't increase value). Counterintuitive verdicts on habitat restoration that lowers average welfare but increases total lives.

  **Person-Affecting View:** Passes **Non-Identity** (no harm to non-existents). Fails **Baseline Clarity** (cannot condemn destruction that changes who exists rather than harming specific existing individuals). Renders most habitat loss morally neutral.

  **Land Ethic:** Passes **Ontological Unit** (explicitly holistic). Fails **Fitness-Welfare Decoupling** (assumes ecosystem health equals good). Fails **Individualism** (sacrifices individuals for the biotic community). Good for conservation, silent on suffering.
