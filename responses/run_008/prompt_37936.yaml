answer: |-
  This is a classic formulation of the "cosmopolitan" argument for open borders (very close to the version advanced by political philosopher Joseph Carens). It is elegant, intuitive, and dangerous precisely because it looks so clean.

  Your intuition is correct: the argument proves too much. If it works for borders, it works for families, universities, private clubs, and even friendships. Since your brother is willing to bite the bullet on the family (a commendable level of consistency, if radical), you need to find the step where the logic detaches from moral reality.

  The broken step is **Premise 2**.

  > **2. Immigration restrictions coercively exclude people on the grounds of where they were born.**

  Here is why this step looks fine, why it is actually wrong, and what rejecting it costs you.

  ### Why Premise 2 looks fine
  It appeals to a physical observation. If a migrant tries to cross and a guard points a gun or locks a gate, that *looks* like coercion. It involves force, threats, and physical prevention. In everyday language, stopping someone by force is coercion. Therefore, Premise 2 feels undeniable.

  ### Why Premise 2 is wrong
  In moral and political philosophy, "coercion" isn't just the use of force; it is the **violation of a liberty right**.

  *   **The House Analogy:** If I lock my front door and you try to enter, I will use force to stop you. Physically, I am coercing you. But morally, I am not. Why? Because you have no *right* to enter my house. I am not violating your liberty; I am exercising my property rights.
  *   **The Club Analogy:** If a private club denies you membership, they are excluding you. If they call security to escort you out, they are using force. But unless you have a prior contract or right to join, they are not *coercing* you in the sense that requires justification *to you*. They are merely protecting their freedom of association.

  Premise 2 begs the question. It assumes that migrants have a **liberty right to enter** the territory. If they have that right, then stopping them is unjustified coercion. If they *don't* have that right, then stopping them is merely the state exercising its own right to control its territory (similar to my right to control my house).

  By asserting Premise 2 as a plain fact, your brother smuggles the conclusion ("they have a right to enter") into the premise ("stopping them is coercion").

  ### How this fixes the Family Analogy
  Your brother tried to distinguish borders from families by saying borders are *coercion* and families are *omission*. This is weak. Parents *do* use coercion to protect family assets. If a stranger tries to walk into your house and eat your dinner, you call the police. That is state coercion deployed to protect a private boundary.

  If you reject Premise 2, the analogy snaps back into place:
  *   **Families:** Do not owe outsiders access to their resources (income, tutoring, love). They have a right of **associative privacy**.
  *   **States:** Do not owe outsiders access to their resources (welfare, labour market, citizenship). They have a right of **political self-determination**.

  In both cases, the exclusion is not "coercion against a right," but "defense of a right to associate." The arbitrariness of birth (Premise 3) remains true, but it becomes irrelevant because the right to exclude doesn't depend on the *criteria* of exclusion, but on the *right of the group* to exist as a distinct entity.

  ### The Cost of Rejecting Premise 2
  You asked what rejecting this step costs. It is not free.

  1.  **You must defend the "State as Club" analogy:** You have to argue that a state is more like a private household or a club than it is like a public utility. This means arguing that citizens collectively "own" the territory and institutions in a way that grants them the right to exclude others. This is contentious (left-libertarians hate it), but it is standard liberal theory.
  2.  **You concede the "Burden of Proof":** You cannot simply say "states can do whatever they want." You have to argue that the right to exclude is *necessary* for the state to function (e.g., to maintain the welfare state, cultural cohesion, or democratic trust). You don't have to prove birthplace *matters morally*, only that *boundaries* matter functionally.
  3.  **You accept a limit on the "Arbitrariness" argument:** You keep Premise 3 (birth is arbitrary), but you deny that arbitrariness automatically equals injustice. *All* associative rights rely on arbitrary traits. I love my children because they are *mine*, not because they are morally superior. That is arbitrary, but it is the foundation of family life. Rejecting Premise 2 allows you to say: "Yes, birthplace is arbitrary, but the right to form communities based on arbitrary boundaries is a prerequisite for freedom."

  ### A Secondary Target: Premise 4
  If your brother digs in on Premise 2 ("No, it *is* coercion because it involves guns!"), you move to **Premise 4**.

  > **4. Nobody could reasonably accept being shut out... on the basis of a trait that arbitrary...**

  This premise assumes that the *only* value at stake is the migrant's opportunity. It ignores the value of **self-determination** for the existing citizens.

  A Scanlonian contractualist (which your brother's argument mimics) would ask: "Could a principle allowing exclusion be reasonably rejected?"
  *   **Migrant's view:** "I reject this; it limits my life chances based on luck."
  *   **Citizen's view:** "I reject the alternative (open borders); it undermines our ability to sustain our welfare state, culture, or democratic decisions."

  If the existence of the state *requires* boundaries to function (a contested but plausible empirical claim), then it *is* reasonable for the excluded to accept the restriction, because the alternative is the dissolution of the political community that generates the goods in the first place. Premise 4 fails because it treats the migrant's interest as absolute, rather than weighing it against the associative rights of the community.

  ### Summary for the Pub
  Tell him this:

  "Your argument hinges on Premise 2. You're treating 'coercion' as a physical description (using force) rather than a moral one (violating a right). If I lock my door, I use force, but I'm not coercing you because you have no right to be in my house.

  If you say borders are different from houses, you have to explain why. If you say they aren't different, then your logic abolishes the family, which you admit. But if you admit the family has a right to exclude based on associative rights, then the State might too.

  So, either you abolish the family, or you admit that **Premise 2 is false**: preventing entry isn't unjustified coercion unless you've already proven people have a right to enter. And since whether they have that right is what we're arguing about, your premise assumes your conclusion."

  This keeps Premise 3 (birth is arbitrary), avoids the "open borders tomorrow" conclusion, and shifts the burden of proof to him to explain why states don't have the same associative rights as families.
