prompt: |-
  I'm the reviews editor at a general-interest history journal, and a recurring dispute lands on my desk several times a month. Referee A writes that a submission "narrates but doesn't explain": it traces, say, the sequence of provocations leading up to a peasant revolt without showing why things had to go that way rather than some other way. Referee B responds that this objection assumes a covering-law ideal of explanation that history can never meet and shouldn't try to — that narrative ordering, emplotment, and attention to what the actors themselves understood they were doing *is* the explanation. Our authors, stuck in the middle, need actionable revision guidance, not a seminar on the philosophy of history.

  Please write a procedure I can hand to referees and authors that settles when a historical explanation is adequate: an ordered set of questions to ask of a manuscript, what counts as a sufficient answer to each, where the procedure returns a clear "no, this is only a chronology," and where it should stop and hand the decision back to me because the remaining disagreement is about what explanation in history should mean, not about anything in the text. Along the way, decide which distinctions from the covering-law-versus-narrative debate genuinely have to survive the simplification (e.g., the demand for contrastive explananda — why this rather than that — versus the demand for lawlike regularities), and which can be dropped for a non-philosophical audience. Referees should be able to run it in twenty minutes; they have no philosophy training, and I can't force them to read anything longer than two pages.

  Then run the procedure on three cases: a manuscript that explains a revolution almost entirely as a narrative chain of escalating events; one that explains a famine by appeal to a general claim about how price shocks interact with subsistence economies, with the local events as an illustration; and one that offers a single-cause account (a monarch's decision) for an outcome with many plausible candidate causes. Include at least one case where the procedure gives a verdict I won't like as an editor who wants to accept the piece, and be explicit about the ways the procedure will misfire — the kinds of good historical writing it will wrongly condemn or rightly condemn for the wrong reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Reviews Editor at a general-interest history journal.
      *   **Problem:** Recurring dispute between Referee A (wants explanation/causality, "why this not that") and Referee B (wants narrative/emplotment, "story is explanation"). Authors are stuck.
      *   **Task:** Create a 2-page max procedure (ordered questions, sufficiency criteria, stop rules) to settle when a historical explanation is adequate.
      *   **Constraints:** Referees have no philosophy training. Must take <20 mins. Must distinguish between text-fixable issues and philosophical disagreements.
      *   **Follow-up:** Run the procedure on three specific cases (Narrative Chain, General Claim/Illustration, Single-Cause).
      *   **Requirement:** Include a case where the procedure yields an unwanted verdict (false negative/positive) and explicitly discuss limitations/misfires.
      *   **Philosophical Nuance:** Decide which distinctions from the Covering Law vs. Narrative debate to keep (e.g., contrastive explananda) and which to drop (e.g., strict lawlike regularities).

  2.  **Deconstruct the Philosophical Debate (for internal use):**
      *   *Covering Law (Hempel):* Explanation requires subsumption under general laws. $C_1, C_2... + L \rightarrow E$. Critique: History doesn't have laws. Too rigid.
      *   *Narrative (Dray, White, Veyne):* Explanation is making the event intelligible through story, context, and agent rationality. Critique: Can become "just one damn thing after another" (chronicle).
      *   *Middle Ground (Contemporary Practice):* Causal mechanisms, contrastive questions ("Why X rather than Y?"), process tracing, acknowledging contingency vs. structure.
      *   *Decision:* Drop the demand for "laws." Keep the demand for "contrastive focus" (why this outcome?) and "mechanism" (how did A lead to B?). Narrative *can* explain if it shows the *necessity* or *probability* of the transition, not just the sequence.

  3.  **Drafting the Procedure (The "Editor's Checklist"):**
      *   *Goal:* Actionable, non-philosophical language.
      *   *Structure:* Step-by-step questions.
      *   *Thresholds:* Clear "Pass/Fail" markers.
      *   *Escape Hatch:* When to send back to the editor (philosophical disagreement).
      *   *Drafting - Step 1 (The Explanandum):* Is it clear what is being explained? Is it contrastive? (Keep this, it's crucial for A's point without needing laws).
      *   *Drafting - Step 2 (The Link):* How are events connected? Is it just "then" or is it "therefore"? (Addresses the "narrates but doesn't explain" critique).
      *   *Drafting - Step 3 (Alternatives):* Does the text acknowledge other possibilities? (Addresses contingency).
      *   *Drafting - Step 4 (Generalization):* Does it rely on hidden assumptions? (Addresses B's point about actor understanding vs. structural forces).
      *   *Refining for Time:* Keep it to 5 key questions. Use plain English.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Narrative Chain):* The "Chronicle." Sequence of provocations -> Revolt.
          *   *Expected Verdict:* Likely fails on "Why this not that?" and "Mechanism."
      *   *Case 2 (General Claim/Price Shocks):* The "Sociological" history.
          *   *Expected Verdict:* Likely passes on explanation, might fail on "actor understanding" if too deterministic. Let's make it pass the procedure but maybe feel dry.
      *   *Case 3 (Single Cause/Monarch):* The "Great Man" theory.
          *   *Expected Verdict:* Fails on "Alternatives/Plurality."
      *   *The "Unwanted Verdict":* I need a case where the procedure rejects something good. Let's make Case 1 (Narrative) actually a *great* piece of cultural history where the "explanation" is the thick description of meaning, but the procedure flags it as "just chronology." Or, make Case 2 (Price Shocks) pass the procedure but be historically reductive. Let's go with Case 1 failing: A brilliant narrative that *shows* inevitability through texture, but the checklist demands explicit contrastive statements it doesn't make.

  5.  **Refining the Procedure (Iterative Process):**
      *   *Critique:* Is "contrastive" too jargon-y?
      *   *Fix:* Use "The Fork in the Road."
      *   *Critique:* Is "mechanism" too social science-y?
      *   *Fix:* Use "The Glue."
      *   *Decision Point:* Where does the editor step in? When referees disagree on whether "making sense of the actors" counts as "causality."

  6.  **Writing the Content:**
      *   *Introduction:* Set the tone. Practical, authoritative.
      *   *The Checklist:* 5 Questions.
      *   *The Stop Rule:* When to call the editor.
      *   *The Test Runs:* Apply the checklist rigorously.
      *   *The Critique:* Honest assessment of the tool's blindness.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Covering Law" vs. "Narrative" distinction?
      *   *Adjustment:* Explicitly mention in the commentary that we are dropping "laws" but keeping "causal weight."
      *   *Check:* Is it under 2 pages (conceptually)?
      *   *Adjustment:* Keep the checklist tight.
      *   *Check:* Did I include the "Unwanted Verdict"?
      *   *Adjustment:* Ensure Case 1 is rejected by the tool, but I (the editor) argue it might be publishable as a different *kind* of history.

  8.  **Final Polish:** Ensure the voice is appropriate for an editor speaking to referees (professional, direct, slightly weary of theoretical squabbles). (Self-correction: Make sure the distinction between "chronology" and "narrative explanation" is clear in the checklist).

  9.  *(Final thought on the "Unwanted Verdict")*: The prompt asks for *one* case where the procedure gives a verdict I won't like. I will make Case 1 (The Narrative) fail the checklist, but argue in the analysis that it's actually a sophisticated piece of cultural history that the checklist is too blunt to recognize. This highlights the tool's limitation regarding "meaning" vs. "cause."

  10. **Final Review against constraints:** 20 mins to run? Yes. No philosophy training needed? Yes. Distinguishes text issues from philosophy issues? Yes.

  (Proceed to generate output based on these steps.)
answer: |-
  # MEMORANDUM
  **TO:** Referees and Authors
  **FROM:** Reviews Editor
  **SUBJECT:** Procedure for Assessing Historical Explanation (The "Fork-and-Glue" Checklist)

  **Purpose:** To distinguish between a *chronicle* (one thing after another) and an *explanation* (why this thing, rather than another). This procedure bypasses philosophical debates about "laws of history." It focuses on textual evidence of causal reasoning.

  **Time Required:** 20 Minutes
  **Instruction:** Answer the following five questions in order. If you answer **NO** to any bolded criterion, the manuscript requires revision. If you answer **YES** to all, the explanation is adequate. If you and a co-referee disagree on a **YES/NO**, do not argue philosophy; send the dispute to the Editor.

  ---

  ### THE CHECKLIST

  **1. The Fork in the Road (Contrastive Explanandum)**
  Does the text identify a specific moment where outcomes could have diverged?
  *   **Sufficient:** The text explicitly or implicitly acknowledges an alternative outcome (e.g., "Revolt was not inevitable," "The monarch could have妥协," "Famine was not the only result of drought").
  *   **Insufficient:** The text treats the outcome as the only natural conclusion of the preceding events (teleology).
  *   **Verdict:** If **NO**, this is a chronicle. Stop here.

  **2. The Glue (Mechanism vs. Sequence)**
  Does the text explain *how* Event A produced Event B, rather than just stating A preceded B?
  *   **Sufficient:** The text identifies a mechanism (e.g., resource depletion, loss of legitimacy, communication breakdown, rational calculation) that transfers energy/information from A to B.
  *   **Insufficient:** The connection relies on "then," "next," or "subsequently" without specifying the transmission belt.
  *   **Verdict:** If **NO**, this is a chronicle. Stop here.

  **3. The Weight (Causal Priority)**
  If multiple factors are present, does the text rank them?
  *   **Sufficient:** The text argues why Factor X mattered more than Factor Y in this specific context (e.g., "Price shocks triggered the unrest, but only because state repression had removed legal outlets").
  *   **Insufficient:** The text lists factors as a "perfect storm" or "confluence" without assigning relative weight.
  *   **Verdict:** If **NO**, the explanation is muddy.

  **4. The Actor's Horizon (Intelligibility)**
  Does the explanation align with what the historical actors could have known or intended?
  *   **Sufficient:** If the explanation relies on structural forces (e.g., market prices), it explains how actors *responded* to those forces. If it relies on intent, it provides evidence for that intent.
  *   **Insufficient:** The text attributes motives to actors they could not have held, or ignores structural constraints that forced their hand.
  *   **Verdict:** If **NO**, the explanation is anachronistic or deterministic.

  **5. The Scope (Generalization)**
  Does the text rely on a hidden general claim?
  *   **Sufficient:** The text either makes its general claim explicit (e.g., "In subsistence economies, price spikes lead to...") or confines the claim strictly to the local context.
  *   **Insufficient:** The text implies a universal rule to justify the link but denies making generalizations when challenged.
  *   **Verdict:** If **NO**, the argument is covert.

  ---

  ### THE ESCAPE HATCH (When to Call the Editor)

  Do not use this checklist to argue about the *nature* of history. Send the decision to the Editor if:

  1.  **Referee A** says "No" on Q1 or Q2 because the text lacks a sociological model, but **Referee B** says "Yes" because the narrative makes the outcome feel inevitable through thick description.
  2.  **Referee A** demands a counterfactual statement be explicitly written; **Referee B** argues the counterfactual is implied by the narrative tension.
  3.  The dispute is about whether "understanding meaning" (Verstehen) counts as "causal mechanism."

  *If the disagreement is about the text's failure to meet the bolded criteria above, the authors must revise. If the disagreement is about whether these criteria matter, the Editor decides.*

  ***

  # APPLICATION OF THE PROCEDURE

  Here is the procedure applied to three current submissions.

  ### Case 1: "The Spark and the Tinder" (Narrative Chain)
  **Subject:** A peasant revolt.
  **Content:** Traces a sequence: Tax collector arrives -> Villagers protest -> Soldiers fired -> Mob forms -> Manor burned.
  **Procedure Run:**
  1.  **Fork:** **NO.** The text presents the burning as the natural culmination of the tax collector's arrival. No alternative outcomes (e.g., successful petitioning, dispersal) are considered.
  2.  **Glue:** **NO.** Connections are temporal ("The next day," "Following this"). No mechanism explains why protest turned to arson specifically here, when it did not elsewhere.
  3.  **Weight:** N/A (Failed Q1).
  **Verdict:** **Reject/Revise.** This is a chronicle. It narrates but does not explain.
  **Editor's Note:** This is the verdict I dislike. The manuscript is beautifully written, and the "inevitability" is constructed through literary emplotment. However, the checklist correctly identifies that it fails to answer *why this revolt* when similar taxes elsewhere caused no revolt. It is good literature, weak history.

  ### Case 2: "Market Shocks and Subsistence" (General Claim)
  **Subject:** A regional famine.
  **Content:** Argues that price shocks in subsistence economies inevitably lead to mortality spikes. Uses local grain records to illustrate the model.
  **Procedure Run:**
  1.  **Fork:** **YES.** Implicitly contrasts regions with market integration vs. subsistence.
  2.  **Glue:** **YES.** Mechanism is clear: Price rise -> purchasing power drop -> caloric deficit -> death.
  3.  **Weight:** **YES.** Prices are weighted above weather conditions.
  4.  **Actor's Horizon:** **NO.** The text treats peasants as passive calories-in/calories-out machines. It ignores coping strategies (migration, foraging) that actors actually used, which complicates the "inevitability" of the mortality spike.
  5.  **Scope:** **YES.** The general claim is explicit.
  **Verdict:** **Revise.** The explanation is robust structurally but fails Q4. It explains the *system* but not the *history*.
  **Editor's Note:** This verdict is comfortable. The piece is sociological, not historical, until it accounts for human agency.

  ### Case 3: "The King's Decree" (Single Cause)
  **Subject:** Outbreak of war.
  **Content:** Attributes the war entirely to the monarch's decision to mobilize on July 30th.
  **Procedure Run:**
  1.  **Fork:** **YES.** Implicitly suggests if the King waited, war would not have happened.
  2.  **Glue:** **YES.** Mechanism is command hierarchy.
  3.  **Weight:** **NO.** The text dismisses alliance systems, mobilization timetables, and public opinion as "background." It does not argue *why* the King's will overrode these structural constraints, it simply asserts it.
  4.  **Actor's Horizon:** **YES.** Focuses on the King's intent.
  5.  **Scope:** **NO.** It relies on a hidden "Great Man" generalization without stating it.
  **Verdict:** **Revise.** Fails Q3 and Q5. Causal priority is asserted, not demonstrated.
  **Editor's Note:** Standard "Great Man" critique. Easy fix for the author: acknowledge the structural constraints and explain why the King's decision was the *tipping point* rather than the *sole cause*.

  ***

  # LIMITATIONS AND MISFIRES

  This procedure is a tool, not a truth machine. It simplifies the Covering Law vs. Narrative debate by dropping the demand for "laws" (Case 2 passes without a universal law) but keeping the demand for "contrastive focus" (Case 1 fails for lacking a Fork).

  **Where it will misfire:**

  1.  **The "Thick Description" False Negative:**
      In Case 1, the procedure condemns a narrative that might be explaining through *meaning* rather than *cause*. If an author shows that the villagers' *understanding* of the tax collector made violence the only intelligible option (a cultural explanation), Q1 (The Fork) might register a "No" because the text doesn't explicitly list alternatives. The checklist privileges causal mechanics over cultural intelligibility. I may override a rejection here if the narrative quality is high enough to constitute an argument by example.

  2.  **The "Social Science" False Positive:**
      Case 2 passes Q1 and Q2 easily because structural models have built-in mechanisms. However, a piece can pass this checklist and still be bad history if the "mechanism" is ahistorical (e.g., applying rational choice theory to 12th-century monks). Q4 checks for anachronism, but a clever author can game it by adding a token sentence about "actor perception" while maintaining a deterministic model.

  3.  **The "Philosophical" Blind Spot:**
      The Escape Hatch assumes referees can distinguish between "textual failure" and "philosophical disagreement." They often cannot. Referee A may claim Q2 is failed because there is no *nomological* link, while Referee B claims it is passed because there is a *narrative* link. The checklist defines "Glue" as mechanism to satisfy A, but allows "intelligibility" to satisfy B. This ambiguity will still land on my desk.

  **Conclusion:**
  Use this checklist to filter out chronicles masquerading as analysis. Do not use it to filter out innovative forms of historical writing that explain through means other than causal ranking. When in doubt, send it to me.
