          2.  Define the Tetralemma (standard vs. Nāgārjuna's usage).
          3.  Define Priest's Dialetheism.
          4.  Compare: Where they align (the limits of language/concept).
          5.  Contrast: Where they diverge (assertion vs. negation, soteriology vs. logic).
