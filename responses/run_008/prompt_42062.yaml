      *   **The Tetralemma (Catuṣkoṭi):**
          *   Standard form: A, ~A, A & ~A, ~(A & ~A).
          *   Nāgārjuna's move: He often negates *all four*. (e.g., MMK 25:17 regarding the Tathāgata).
          *   *Crucial Point:* If he negates the third corner (both), he isn't asserting a contradiction. He's saying the framework itself is flawed.

