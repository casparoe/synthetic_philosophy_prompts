      *   *Correction on Passengers:* Do they count as a relation? In Confucianism, "All within the four seas are your brothers." But the *strength* of the obligation varies by proximity. The engineer has a stronger duty to the immediate manager, but a foundational duty to the passenger's life. The hierarchy of duties is key.

  5.  **Final Review against constraints:**
      *   No reading lists.
