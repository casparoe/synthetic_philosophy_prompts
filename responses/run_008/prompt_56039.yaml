answer: |-
  I bring you this **Present**, not for the day,
  But for the **Line** you drew through space and mass.
  The cosmos might **Turn** on an axis gray,
  Where shadows **Pass** without a trace or mass.
  The Institute doors **Close** behind our feet,
  And Princeton dims, surrendering its **Light**.

  No constant **Light** survives the rotation's test,
  If time is just a **Present** we invent.
  We walk **Close** to the truth, put to the test,
  Your field equations draw a curved **Line** bent.
  Does entropy **Pass** differently there?
  The whole world might **Turn** backward on its vent.

  A cosmic **Turn** permits the path to rewind,
  But not in free-fall, not by **Light** alone.
  You cannot **Pass** on gravity's soft loan,
  To claim the **Present** as a place you own.
  The rockets burn along the geometric **Line**,
  Though home and start remain forever **Close**.

  So day must **Close** implies no time has fled,
  If matter's **Turn** allows the loop to bind.
  There is no straight **Line** for the living or dead,
  Only the speed of **Light** we keep in mind.
  The **Present** is a lens, not solid land,
  And change will **Pass** only if we demand.

  I watch the seasons **Pass** and feel the lie,
  The stars are **Close** but distant in the mind.
  This **Present** moment is a quiet sigh,
  A single **Turn** of logic we unwind.
  You sought the **Light** of objective truth,
  I found the **Line** that curves to where we stand.

  Draw any **Line** and it returns to self,
  No clock can **Pass** the verdict of the real.
  Extinguish now the laboratory **Light**,
  We are too **Close** to hide what we conceal.
  The universe will **Turn** without us soon,
  And leave the **Present** like a broken moon.

  Albert, the **Line** and **Close** are one and same,
  Time will not **Pass**, nor **Present** burn or fade,
  We walk in **Light** that knows no **Turn** of shame.
