          *   **Ship:** Apply the Free Will (Case 4) lens. Variation shows conceptual underdetermination, inviting theory.
      *   *Conclusion:* Summarize the meta-philosophical takeaway.

  8.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing. Use "You" and "Your."
