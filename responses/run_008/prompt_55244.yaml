  I'm a graduate student presenting to a philosophy department that is mostly mainstream metaphysicians and epistemologists, with no technical training beyond intro logic, plus one classical logician convinced that Tarski's hierarchy of languages settles the matter and a visiting dialetheist who works on paraconsistency. My thesis is that the Liar paradox shows truth in natural language is a partial predicate: the Kripke-style fixed-point construction explains why Liar sentences are neither true nor false, and adding a determinately operator to the object language handles the revenge Liar ("this sentence is not determinately true"). Prepare my Q&A prep sheet: the objections this audience will actually raise, phrased the way they would phrase them, ranked by how much damage each would do, each with a two-minute reply and a note on where the reply is soft. Work Curry's paradox into the ranking where it belongs, and identify the one objection I am hoping nobody asks.
