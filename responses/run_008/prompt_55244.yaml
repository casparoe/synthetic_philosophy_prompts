      *   *Soft Spot:* Must admit where the theory is still debated or requires further work.

      *   *Drafting Curry:* Need to acknowledge that standard Kripke doesn't solve Curry. Need to mention conditional restriction (e.g., Łukasiewicz or non-contractive). *Soft spot:* This complicates the logic significantly, moving away from "natural language."
      *   *Drafting Revenge:* Need to explain that $D$ is defined via the fixed point iteration. *Soft spot:* Can we express the *entire* theory within the theory? (Field's problem).
      *   *Drafting Tarski:* Distinguish between semantic closure and consistency. Kripke allows closure at the cost of classical logic. *Soft spot:* The classical logician won't buy the cost.
      *   *Drafting Metaphysics:* Truth is a semantic property, not a metaphysical one. Gaps are linguistic, not worldly. *Soft spot:* Epistemologists care about truth as a norm of assertion.
      *   *Drafting Dialetheist:* Gaps preserve the norm of assertion (don't assert what isn't true). Gluts allow asserting contradictions. *Soft spot:* Dialetheists argue we *do* accept contradictions in limit cases.

  6.  **Identifying the "Hope Nobody Asks" Objection:**
      *   What is the weakest link in "Kripke + Object Language $D$"?
      *   Usually, it's the logic of the $D$ operator itself. If $D$ behaves classically, you get revenge. If it doesn't, can you reason with it?
      *   *Better candidate:* **The Status of the Meta-Reasoning.** To prove the fixed point exists, you need classical set theory (ZFC). But the object language is non-classical. Why is the meta-language privileged? This undermines the "natural language" claim.
