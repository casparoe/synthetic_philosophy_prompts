answer: |-
  Your confusion is well-founded and, frankly, a sign that you are reading the texts carefully. From the perspective of a computer scientist working with Structural Causal Models (SCMs), the Lewisian and Woodwardian frameworks often look like notational variants of the same underlying machinery. Both rely on a "surgical" alteration of the actual course of events to test dependence.

  However, the "dissolving distinction" you perceive is largely a result of the fact that Judea Pearl's formalism (which you likely use daily) successfully synthesized insights from both traditions into a mathematical calculus. When you separate the *math* from the *philosophical commitments*, the load-bearing differences become stark.

  The core divergence is not in the *logic* of the counterfactual, but in the **truth conditions** for that counterfactual and the **ontology** of the relata. Lewis is offering a reductive metaphysical analysis (what *makes* it true that $C$ caused $E$?). Woodward is offering a conceptual explication (what do we *mean* when we assert a causal claim?).

  Here is a breakdown of where the frameworks come apart, anchored in the three threads you identified.

  ---

  ### 1. The Status of "Surgery": Axiom vs. Derived (Thread A)

  You noted that the "surgical intervention" looks like the "no-backtracking stipulation." Formally, yes. But metaphysically, they play opposite roles.

  *   **Lewis (Derived):** Lewis wants to *analyze* causation in terms of counterfactuals, and counterfactuals in terms of similarity between possible worlds. The "no-backtracking" rule (we don't change the past to accommodate the absence of $C$) is a constraint on the **similarity metric**. He has to argue *why* the closest world where $C$ fails is one where a "small miracle" occurs just before $C$, rather than a world where the past is different. He derives the "surgery" from a theory of world similarity.
  *   **Woodward (Axiomatic/Pragmatic):** Woodward takes the notion of an "intervention" as primitive (or defined via an intervention variable $I$). He does not try to reduce "intervention" to world similarity. Instead, he imposes constraints on what counts as a valid intervention (e.g., $I$ must not be correlated with other causes of $Y$). If no such intervention is physically possible, Woodward is willing to say the causal claim is ill-defined or meaningless.

  **Concrete Scenario: The Moon and the Tides**
  Consider the claim: "The moon's position causes the tides."

  *   **Lewisian Verdict:** We consider the closest possible world where the moon is not in its actual position. To keep the past fixed (up to the moment of the moon's position), we allow a "small miracle" (a violation of physical law) to shift the moon. In that world, the tides do not occur. The counterfactual is true; causation holds.
  *   **Woodwardian Verdict:** Woodward asks: Is there a possible intervention on the moon's position that is uncorrelated with other causes of the tides? If the laws of physics make it *impossible* to move the moon without violating conservation laws or disturbing the gravitational field in a way that violates the "surgical" requirement, Woodward might hesitate.
      *   *Nuance:* Woodward allows "in principle" interventions. But consider a case of **logical or constitutional constraints**. Suppose $X$ is "Average Kinetic Energy" and $Y$ is "Temperature." In some models, these are the same variable. You cannot intervene on $X$ without changing $Y$ by definition.
      *   **The Bite:** Lewis can handle "causation" between logically connected variables via similarity metrics (the closest world breaks the logical link via miracle). Woodward generally rules this out as not a causal relationship but a constitutive one. For a CS student, this maps to the difference between **identifiability** (can we estimate the effect?) and **definition** (does the parameter exist?). Lewis says the parameter exists metaphysically; Woodward says if you can't write down a valid $do$-operator, the claim is empty.

  ### 2. Token vs. Type and the Preemption Problem (Thread B)

  This is the most technical divergence. Lewis is primarily analyzing **token causation** (actual events: *this* short circuit caused *this* fire). Woodward is analyzing **type-level causal claims** (variables: *short circuits* cause *fires*).

  **Concrete Scenario: Late Preemption (Suzy and Billy)**
  Suzy ($S$) and Billy ($B$) throw rocks at a bottle ($E$). Suzy's rock arrives first and shatters the bottle. Billy's rock would have shattered it had Suzy missed.
  *   **Structure:** $S \to E$. $B \to E$. But there is a preemptive mechanism: $S$ inhibits $B$'s impact (or $B$'s throw is rendered irrelevant).
  *   **Simple Counterfactual:** "If Suzy had not thrown, would the bottle have shattered?"
      *   **Answer:** Yes (because Billy's rock was ready).
      *   **Problem:** There is no counterfactual dependence of $E$ on $S$.

  **Lewis's Struggle:**
  Lewis's 1973 theory failed here. He later (2000) revised it to "Causation as Influence," requiring a chain of stepwise dependence. He has to find an intermediate event $D$ (e.g., Suzy's rock being in mid-air) such that $S \to D \to E$, where each link is counterfactually dependent. This requires a fine-grained ontology of events. If the process is continuous, he argues there is always a chain. If the process is gappy (quantum?), he has trouble.

  **Woodward/SCM Approach:**
  In your SCM work, you handle this by modeling the **mechanism**, not just the event history.
  Let $S, B \in \{0, 1\}$ and $E \in \{0, 1\}$.
  Equation: $E = \max(S, B \cdot (1-S))$. (If $S=1$, $B$'s contribution is blocked).
  *   **Intervention:** We ask if there is an *invariant generalization*. Does changing $S$ change $E$ *in the context where the mechanism is active*?
  *   **The Difference:** Lewis tries to *extract* the causal structure from the counterfactuals alone. Woodward/SCMs *presuppose* the structural equations (the DAG) to evaluate the counterfactuals.
  *   **Why it matters:** Lewis is trying to solve the epistemic problem of how we know causation from the outside (looking at events). Woodward is clarifying what we are claiming when we write down the DAG.
      *   If you present a Lewisian with the DAG, they ask: "What makes this DAG true?" (Answer: Counterfactuals).
      *   If you present a Woodwardian with the DAG, they ask: "What interventions validate these edges?" (Answer: Manipulations).
      *   In preemption, the SCM handles it trivially *if you have the right graph*. Lewis struggles because he doesn't assume the graph; he tries to derive the "causal connection" from the raw counterfactuals. The "load-bearing" difference is that **Woodwardism is compatible with the modularity assumption of SCMs as a starting point; Lewisism tries to justify modularity from metaphysics.**

  ### 3. Transitivity and Path-Specificity (Thread C)

  Lewis argued causation is transitive ($A \to B$ and $B \to C$ implies $A \to C$). Woodward and the SCM tradition generally deny this.

  **Concrete Scenario: The Terrorist and the Dog Bite**
  1.  A dog bites off the terrorist's right finger ($D$).
  2.  Because of this, the terrorist presses the bomb button with his left finger ($L$).
  3.  The button press triggers the explosion ($E$).
  *   **Chain:** $D \to L \to E$.
  *   **Lewis:** $D$ causes $L$, $L$ causes $E$. Therefore, $D$ causes $E$. (Transitive).
  *   **Woodward/SCM:** We must check invariance. Is there an intervention on $D$ that changes $E$ *along a specific path*?
      *   If we intervene on $D$ (prevent the bite), the terrorist uses his right finger (assume he was willing to press it either way). $E$ still happens.
      *   The relationship between $D$ and $E$ is not invariant; it depends on the background context (that the right finger was unavailable).
      *   **Verdict:** $D$ is not a cause of $E$ in the interventionist sense, because the causal route is "switched."

  **Why this matters for CS:**
  This maps directly to **path-specific effects** and **mediation analysis**. In SCMs, we distinguish total effect ($TE$) from natural direct/indirect effects ($NDE/NIE$).
  *   Lewis's transitivity conflates these. If you are doing fairness in ML (e.g., does Gender cause Hiring Decision?), transitivity is dangerous. Gender $\to$ Department $\to$ Hiring. Gender $\to$ Qualification $\to$ Hiring.
  *   If causation is transitive, Gender causes Hiring, full stop.
  *   If causation is interventionist/path-specific, we can say Gender causes Hiring *via* Department (unfair) but not *via* Qualification (fair).
  *   Woodward's framework supports this distinction naturally; Lewis's metaphysics fights against it because he wants a binary "Cause/Not Cause" relation between tokens.

  ### 4. Metaphysics vs. Pragmatics (The Deep Cut)

  You asked if the deepest difference is Metaphysics vs. Pragmatics. **Yes.**

  *   **Lewis (Metaphysical Realist):** He believes there is a fact of the matter about whether $C$ caused $E$ independent of any agent or model. The "possible worlds" exist (or the similarity facts hold) regardless of whether we can intervene. He is answering: *What is the nature of the causal bond?*
  *   **Woodward (Pragmatic Realist):** He believes causal claims are tools for explanation and control. A causal claim is true if it supports a specific kind of inference (intervention). He is answering: *What utility does this claim provide?*

  **The "Intertranslatable" Claim:**
  The visiting speaker was partially right. If you assume **Causal Sufficiency** and **Modularity** in an SCM, the truth conditions for $P(Y|do(X)=x)$ and Lewis's "closest world where $X=x$" often align.
  *   *However*, they diverge when **Modularity fails**.
  *   **Example:** Lucas Critique in Economics. If you intervene on a policy variable ($X$), the structural parameters of the agents ($\theta$) might change because agents anticipate the intervention.
  *   **Woodward:** If the mechanism changes under intervention, the causal claim was not invariant. We must refine the variables to include the agents' expectations.
  *   **Lewis:** The "closest world" where the policy changes might *necessarily* involve a world where agents behave differently. Lewis's similarity metric has to weigh "same laws" vs. "same particular facts." It gets messy.
  *   **CS Implication:** In Causal Discovery, we assume the mechanism $P(Y|X)$ is invariant. Woodward justifies this by saying "that's what 'cause' means." Lewis tries to prove it by saying "that's how worlds are similar." If you encounter a system with feedback loops where intervention changes the structure (e.g., adaptive systems), Woodward tells you to change your variables. Lewis tells you to recalculate world similarity.

  ### Summary of Load-Bearing Differences

  | Feature | Lewis (Counterfactual) | Woodward (Interventionist) | CS/SCM Analogue |
  | :--- | :--- | :--- | :--- |
  | **Relata** | Events (Tokens) | Variables (Types) | Nodes in DAG |
  | **Non-Backtracking** | Derived from Similarity Metric | Defined by Intervention Variable | $do$-operator / Truncation |
  | **Preemption** | Requires Chains of Dependence | Handled by Structural Equations | Mechanism Modeling |
  | **Transitivity** | Yes (generally) | No (Path-specific) | Mediation Analysis |
  | **Impossible Interventions** | Causation can still hold (via miracle) | Causal claim is ill-defined | Identifiability fails |
  | **Goal** | Metaphysical Reduction | Conceptual Explication | Estimation / Discovery |

  ### Recommendation for Your Seminar

  When you discuss this, lean into your SCM expertise. Point out that **Pearl's $do$-operator is essentially a formalization of Woodward's intervention, not Lewis's counterfactual.**

  *   Lewis: $C \to E$ is true iff $E$ counterfactually depends on $C$.
  *   Pearl/Woodward: $X \to Y$ is true iff $P(Y|do(X)) \neq P(Y)$.

  The crucial insight for your classmates is this: **Lewis tries to define causation *without* assuming a causal model (using only events and similarity). Woodward (and Pearl) assumes a causal model (structure) to define the counterfactuals.**

  In preemption cases, Lewis struggles because he lacks the model. You, as a causal discovery researcher, *start* with the model (or search for it). You are naturally a Woodwardian. The "confusion" arises because you are importing the SCM assumption (that the structure exists and is modular) into Lewis's framework, where that assumption is the very thing being debated.

  **Final Concrete Example to Deploy:**
  Use the **Short Circuit** with a **Safety Switch**.
  *   $C$ (Current) $\to$ $H$ (Heat) $\to$ $F$ (Fire).
  *   $S$ (Switch) inhibits $C$.
  *   If $S=1$ (On/Safe), $C=0$, $H=0$, $F=0$.
  *   If $S=0$ (Off/Unsafe), $C=1$, $H=1$, $F=1$.
  *   **Question:** Did the Switch position cause the Fire?
  *   **Lewis:** Yes, via the chain.
  *   **Woodward:** Yes, because intervening on $S$ changes $F$.
  *   **Now, add a Backup Generator ($G$).** If $C=0$, $G$ turns on and creates Heat ($H$).
  *   **Lewis:** Still Yes (via chain).
  *   **Woodward:** It depends on the *equation*. If $H = \max(C, G)$, and $G$ is automatically triggered by $\neg C$, then intervening on $S$ (which sets $C$) might not change $H$ if $G$ compensates perfectly.
  *   **The Bite:** Woodward forces you to specify the **mechanism of compensation**. Lewis allows the "closest world" to simply have the fire happen. Woodward demands you ask: "Is the relationship between $S$ and $F$ *invariant* across the background condition of $G$?" If $G$ always compensates, $S$ is not a cause of $F$ in the interventionist sense, even if Lewis says it is. This distinction is vital for **robustness** in ML models. You want causes that are invariant, not just counterfactually linked in the actual world.

  This should give your classmates the "bite" they are looking for: Lewis is about *what happened*; Woodward is about *what would happen under manipulation*, which is a stricter, more useful standard for science (and CS).
