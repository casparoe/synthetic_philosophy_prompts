      *   *Postulates:* IIT 3.0/4.0 usually lists 5 axioms/postulates (Existence, Composition, Information, Integration, Exclusion). I need to translate these.
      *   *Existence:* The system must have causal power over itself. -> *Causal Marginalization / Interventional Distribution.*
      *   *Composition:* Mechanisms can be subsets of elements. -> *Subspace analysis / High-order interactions.*
      *   *Information:* Mechanisms must specify a repertoire (past/future). -> *Repertoire = Probability Distribution over states. Specificity = Distance (KL) from unconstrained distribution.*
      *   *Integration:* The information must be irreducible. -> *Partitioning the system. Compare intact MI/cause-effect structure vs. partitioned.*
      *   *Exclusion:* Only the maximum irreducible structure counts. -> *Optimization over spatial/temporal scales.*

  3.  **Drafting the Translation (Mental or Scratchpad):**
      *   *System:* A stochastic dynamical system (Markov chain or Boolean network).
      *   *Mechanism:* A subset of nodes $M$.
      *   *Cause/Effect Repertoire:* $P(Past | Current)$ and $P(Future | Current)$. This is Bayesian inversion and forward dynamics.
      *   *Integrated Information ($\phi$):* The distance between the joint repertoire and the factorized repertoire across a partition.
      *   *Partition:* Cut the connections (edges) between subsets. Inject noise (maximum entropy) on the cut.
      *   *Metric:* Usually Earth Mover's Distance (EMD) or KL divergence in newer versions, originally MI-based. Let's stick to the spirit of "distance between distributions."
      *   *Phi ($\Phi$):* The $\phi$ of the "Main Complex" (the subset with max $\Phi$).

  4.  **Addressing the "Feedforward" Worry:**
      *   Feedforward: Input $\to$ Hidden $\to$ Output.
      *   MI (Input; Output) can be high.
      *   IIT $\Phi$: Low/Zero. Why? Because if you partition the hidden layer, the future state of one part doesn't depend on the past state of the other *given the current state*. Actually, it's deeper: In a feedforward net, the causal structure is reducible. The state of the system at $t$ is fully determined by inputs, not by internal feedback loops. The "cause-effect structure" is shallow.
      *   IT Translation: Feedforward = Conditional Independence across partitions given the input. No *recurrent* mutual information. It's about $I(X_t; X_{t+1})$ internal vs $I(Input; Output)$.

  5.  **Developing the "Residue Report":**
      *   *Clean Maps:* Repertoires (conditional probs), Partitions (cutting edges), Irreducibility (interaction information / synergy).
      *   *Distorted Maps:* "Intrinsic." In IT, we usually care about communication (extrinsic). IIT cares about self-causation. This requires intervention calculus (do-calculus), not just passive observation.
      *   *No Maps:* Phenomenology ("what it is like"). The claim that $\Phi > 0$ *is* consciousness. This is a metaphysical leap, not an IT calculation.
      *   *Intrinsic vs. Extrinsic:* This is the crux. Extrinsic = Observer measures system. Intrinsic = System measures itself. In IT terms: Extrinsic = $I(Input; Output)$. Intrinsic = $I(State_t; State_{t+1})$ *internal* causal power.

  6.  **Refining the "Intrinsic" Argument:**
