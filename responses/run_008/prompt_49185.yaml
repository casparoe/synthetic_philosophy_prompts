prompt: |-
  I did my PhD in information theory and now work on data compression, so entropy, mutual information, KL divergence, rate-distortion, channel capacity — that's my native vocabulary. I keep hearing that Integrated Information Theory is a theory where consciousness is measured by some quantity phi, which sounds like it should be right up my alley, but every time I try to actually pin down what phi measures I get lost in postulates about intrinsic existence and exclusion. Can you restate IIT for me, postulate by postulate, in information-theoretic terms? E.g. treat the substrate as a network of channels, say where phi would sit relative to mutual information or total correlation over a partition, what irreducibility is as a claim about decomposing into independent subchannels, and so on. Then give me the residue report: which parts of IIT map cleanly onto things I actually compute, which map only if you distort them, and which can't be said in my vocabulary at all. I especially want your take on the intrinsic vs extrinsic perspective thing — whether the residue there is a real insight my toolbox is missing, or IIT being vaguer than it sounds. And please address the worry that jumps out from where I'm standing: the claim that a purely feedforward network has phi of about zero even though it can carry loads of mutual information from input to output. What is doing the work there, and can it even be stated in my vocabulary or does it need the intrinsic viewpoint to get off the ground?
