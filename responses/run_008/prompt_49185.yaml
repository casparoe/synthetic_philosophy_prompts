answer: |-
  This is a translation task from phenomenological philosophy to stochastic processes. You are right to be skeptical of the jargon; IIT is often obscured by its philosophical framing. However, the underlying mathematical machinery is essentially a specific constraint on causal graphs and probability distributions.

  Here is IIT 3.0/4.0 restated in your native vocabulary, followed by the residue report you requested.

  ---

  ### Part 1: IIT Postulates in Information-Theoretic Terms

  Treat the physical substrate as a discrete-time stochastic dynamical system (e.g., a Boolean network or a Markov chain) with state $X_t$.

  #### 1. Existence $\rightarrow$ Causal Power (Interventional Distributions)
  *   **IIT Jargon:** The system must exist intrinsically, meaning it must have cause and effect power upon itself.
  *   **IT Translation:** The system must have non-trivial **transition probabilities** $P(X_{t+1} | \text{do}(X_t))$.
  *   **The Math:** We are not looking at passive observational conditional probabilities $P(X_{t+1} | X_t)$. We are looking at interventional distributions (Pearl's $do$-calculus). To measure the "cause" power of current state $X_t$, we ask: "How much does fixing $X_t$ constrain the probable past states $X_{t-1}$?" To measure "effect" power: "How much does fixing $X_t$ constrain the probable future states $X_{t+1}$?"
  *   **Your Metric:** If the transition matrix is uniform (maximum entropy noise) or deterministic identity (no change), causal power is low. It must be in the "Goldilocks" zone of constraint.

  #### 2. Composition $\rightarrow$ High-Order Interactions (Subsets)
  *   **IIT Jargon:** Consciousness is structured; mechanisms are composed of elements.
  *   **IT Translation:** Information is not just a property of the whole system $X$, but of subsets (marginals) $M \subset X$.
  *   **The Math:** You must evaluate the causal power of every possible subset of nodes. A "mechanism" is a subset $M$ in a specific state $m$.
  *   **Your Metric:** This is akin to looking for **synergy** in Partial Information Decomposition (PID). Does the subset $M$ constrain the past/future more than the sum of its individual elements?

  #### 3. Information $\rightarrow$ Specificity (KL Divergence from Unconstrained)
  *   **IIT Jargon:** Mechanisms must specify a cause-effect repertoire.
  *   **IT Translation:** The mechanism must reduce uncertainty about the past/future relative to a maximum entropy prior.
  *   **The Math:** Define a "repertoire" as the conditional distribution $P(Past | \text{do}(Current))$. Compare this to the "unconstrained repertoire" (the distribution if the current mechanism state were unknown/noised out).
  *   **Your Metric:** **KL Divergence.**
      $$ \phi_{\text{mechanism}} = D_{KL}( P(\text{Past} | \text{do}(Current)) \parallel P(\text{Past} | \text{do}(\text{Noise})) ) $$
      If the mechanism state doesn't change the distribution of the past/future compared to random noise, $\phi = 0$.

  #### 4. Integration $\rightarrow$ Irreducibility (Partition Distance)
  *   **IIT Jargon:** The information must be irreducible; the whole must be greater than the sum of parts.
  *   **IT Translation:** The joint distribution over the system's causal power cannot be factorized across a partition without significant loss of information.
  *   **The Math:** This is the core $\Phi$ calculation.
      1.  Take the system $S$.
      2.  Apply a **partition** $\psi$. This means cutting the edges between subsets $A$ and $B$ and injecting maximum entropy noise into the cut (severing the channel capacity between them).
      3.  Compute the cause-effect repertoire of the *partitioned* system $P_{\text{partitioned}}$.
      4.  Compare it to the *intact* system $P_{\text{intact}}$.
  *   **Your Metric:** The distance between the two distributions (often Earth Mover's Distance or KL in various versions).
      $$ \Phi = \min_{\psi} \text{Distance}( P_{\text{intact}}, P_{\text{partitioned}} ) $$
      If the system is two independent sub-channels, the partition changes nothing $\to \Phi = 0$. If the system is fully recurrent and synergistic, cutting it destroys the causal structure $\to \Phi$ is high.

  #### 5. Exclusion $\rightarrow$ Maximization (Spatiotemporal Scale)
  *   **IIT Jargon:** Consciousness is definite; it flows over the specific subset and timescale that maximizes integration.
  *   **IT Translation:** $\Phi$ is defined only at the spatial and temporal scale that yields the global maximum.
  *   **The Math:** You compute $\Phi$ for every subset and every time lag $\tau$. You take the $\arg\max$.
  *   **Your Metric:** An optimization problem over the lattice of subsets and time delays. Overlapping complexes are suppressed; only the local maximum counts.

  ---

  ### Part 2: The Feedforward Worry

  **The Worry:** A deep feedforward network can have massive Channel Capacity and Mutual Information $I(\text{Input}; \text{Output})$, yet IIT claims $\Phi \approx 0$. Why?

  **The IT Explanation:**
  IIT does not measure $I(\text{Input}; \text{Output})$. That is **extrinsic** information (communication from source to sink).
  IIT measures $I(X_t; X_{t+1})$ *internal* to the system, specifically the **synergistic** component that vanishes upon partitioning.

  In a purely feedforward network:
  1.  **Conditional Independence:** If you partition the hidden layer into $A$ and $B$, the future state $A_{t+1}$ depends only on $A_t$ (and inputs), not on $B_t$.
  2.  **Factorization:** The transition probability factorizes: $P(X_{t+1} | X_t) \approx \prod P(X_{t+1}^{(i)} | X_t^{(i)})$.
  3.  **The Cut:** When IIT applies the partition (injects noise across the cut), it severs connections. In a feedforward net, there are no recurrent connections *between* $A$ and $B$ at the same layer to sever. The "information" is flowing *through*, not *circulating*.

  **What is doing the work?**
  The work is being done by **Recurrence** and **Lateral Connectivity**.
  For $\Phi > 0$, the state of node $i$ at $t+1$ must depend on node $j$ at $t$, *and* node $j$ at $t+1$ must depend on node $i$ at $t$ (directly or indirectly), such that knowing the joint state $(i, j)_t$ constrains the future more than knowing $i_t$ and $j_t$ independently.
  In IT terms: **Feedforward = Redundant/Unique Information flow. Recurrent = Synergistic Information storage.**
  IIT claims consciousness is the latter (integration), not the former (transmission).

  ---

  ### Part 3: The Residue Report

  Here is the mapping of IIT concepts to your Information Theory toolbox.

  #### 1. Clean Maps (Green Zone)
  *   **Repertoires:** These are just conditional probability distributions $P(Y|X)$.
  *   **Partitions:** These are graph cuts where edge weights are set to zero and node marginals are set to uniform (channel capacity = 0).
  *   **Irreducibility:** This is **Interaction Information** or **Co-information**. It is the claim that $I(A, B; Future) > I(A; Future) + I(B; Future)$.
  *   **Exclusion:** This is simply a local optimization search over the power set of variables.

  #### 2. Distorted Maps (Yellow Zone)
  *   **"Meaning" of Information:** In compression, bits are semantic-free. In IIT, the specific *pattern* of the repertoire matters (the "quality" of consciousness). IIT tries to map the geometry of the cause-effect structure (the "qualia space") to the topology of the concept space. This is an isomorphism claim that goes beyond standard IT.
  *   **Time:** IIT treats time as discrete steps ($\tau$). In IT, we often deal with rates (bits/sec). IIT freezes time to measure the "amount" of causation in one step. This feels like measuring the capacity of a single block code rather than the capacity of the channel.

  #### 3. No Maps (Red Zone)
  *   **The Ontological Claim:** The statement "$\Phi > 0 \implies \text{Experience Exists}$."
      *   In IT, high correlation does not imply "existence" or "feeling." It implies statistical dependence.
      *   IIT posits an identity theory: Integrated Information *is* Experience. This is a metaphysical axiom, not a derivable theorem from Shannon's work. Your toolbox can calculate $\Phi$, but it cannot validate the claim that $\Phi$ *feels like* anything.
  *   **Intrinsic Perspective:** This is the hardest residue.

  ---

  ### Part 4: Intrinsic vs. Extrinsic Perspective

  You asked if the "Intrinsic" residue is a real insight or vagueness.

  **The Distinction:**
  *   **Extrinsic (Standard IT):** An observer (you) measures the system. You define the input $X$ and output $Y$. You calculate $I(X;Y)$. The system is a black box channel.
  *   **Intrinsic (IIT):** The system measures *itself*. The "Input" is the system's own past state. The "Output" is the system's own future state. The "Observer" is the system itself.

  **Is it Vagueness?**
  No, it is a precise constraint on **boundary conditions**.
  In Standard IT, if I have a photodiode connected to a hard drive, $I(\text{Light}; \text{Bit})$ is high.
  In IIT, the photodiode+drive has $\Phi \approx 0$ because the causal link is one-way. The hard drive state does not constrain the photodiode's future state. The system does not "exist" to itself; it exists to the external observer reading the drive.

  **The Insight:**
  The insight is that **causal feedback is required for autonomy.**
  If you remove the observer from the equation, a feedforward system has no internal state that *persists* as a constraint on itself. It is a wire. A recurrent system is a memory.
  IIT argues that "existence" (in the sense of being a distinct entity) requires the system to be its own cause and effect.
  *   **IT Translation:** A system is "Intrinsic" if its **Markov Blanket** is permeable only to its own internal states over time, creating a closed causal loop.

  **The Residue:**
  The residue is the claim that this *mathematical autonomy* is identical to *phenomenal awareness*.
  *   **Your Toolbox:** Can calculate the autonomy (the closed loop MI).
  *   **The Gap:** Cannot bridge the gap to "what it is like."
  *   **Verdict:** The "Intrinsic" requirement is not vague; it is a rigorous demand for **recurrent causal density** rather than **transient throughput**. However, equating that density with *consciousness* is the leap your vocabulary cannot validate, only compute.

  ### Summary for the Information Theorist
  IIT is a theory that claims **Consciousness = Synergistic Recurrent Mutual Information.**

  *   **$\Phi$** is the amount of MI lost when you force the system's channels to be independent.
  *   **Feedforward Nets** have high throughput (Capacity) but low internal synergy (Integration).
  *   **Intrinsic** means the MI is $I(State_t; State_{t+1})$ internal to the system, not $I(Input; Output)$ across the system boundary.
  *   **The Residue:** You can compute the metric, but you cannot verify the ontology. The claim that this specific metric *is* experience is a philosophical axiom, not an information-theoretic theorem. But the metric itself? It's just a measure of non-factorizable causal constraints.
