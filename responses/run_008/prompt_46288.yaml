answer: |-
  You have excellent instincts. Your suspicion that something was "off" about the summary is spot-on, specifically regarding that one phrase about God determining the truth of the counterfactuals. You caught the single most important distinction in the entire debate, and the video presenter glossed over it in a way that actually undermines the view they were trying to explain.

  Let's walk through this piece by piece. I'll tell you what a Molinist would nod along with, what they would vehemently reject, and where the video got the current state of the field wrong.

  ### 1. The Three Moments of Knowledge
  **The Video:** *"God has three logical moments of knowledge: first he knows everything that could happen, then, in the middle, he knows everything that would happen... counterfactuals of creaturely freedom."*

  **The Verdict:** **Fair.**
  This is the core architecture of Molinism, and the presenter got the structure right.
  1.  **Natural Knowledge:** God knows all necessary truths (logic, math) and all *possible* worlds (everything that *could* happen). This is before any decision to create.
  2.  **Middle Knowledge:** God knows all "counterfactuals of creaturely freedom." These are statements about what any free creature *would* freely do in any specific set of circumstances. Crucially, this is still *before* God decides which world to actualize.
  3.  **Free Knowledge:** God knows what *will* happen. This comes after God decides to create a specific world.

  The key word here is "logical." These aren't three moments in *time*. God is outside time. These are logical steps in reasoning. You can't decide to build a house (Free Knowledge) until you know what materials are available (Natural Knowledge) and how those materials will behave (Middle Knowledge).

  ### 2. The Crucial Error: Who Determines the Truth?
  **The Video:** *"Because God determines the truth of these counterfactuals in advance..."*

  **The Verdict:** **Incorrect (and this is your main worry).**
  This is where the video misrepresents the view, and your intuition that this sounds like Calvinism is exactly right. If God *determines* that "If Peter is confronted, he will deny Christ," then Peter isn't truly free. God has effectively scripted the choice.

  A Molinist insists that God does **not** determine the truth of these counterfactuals. He merely *knows* them.
  For a Molinist, these truths are "prevolitional." They are true independently of God's will. They are just "brute facts" about the metaphysics of freedom. God looks at the infinite array of possible people and possible situations, and He sees what they *would* do. He doesn't make them do it; He just sees the truth of the matter.

  So, to answer your specific worry: You are right to think that if God determines the truth, freedom is gone. But Molinists deny He determines the truth. They say He *discovers* the truth. This is the firewall Molinism builds against Calvinism. Calvinism says God ordains the choice; Molinism says God knows the choice and selects the world where that choice occurs.

  ### 3. Arranging Circumstances
  **The Video:** *"...he can arrange circumstances so that his plan always comes about while creatures remain fully free, since he never forces anyone to do anything."*

  **The Verdict:** **Fair.**
  This is the payoff of Middle Knowledge. Since God knows what you would freely do in situation A versus situation B, He can sovereignly ensure His plans happen by placing you in situation A rather than B.
  For example, if God knows you would freely accept the gospel in New York but reject it in London, He can ensure you move to New York. He didn't force your will; He just arranged the circumstances knowing exactly how your free will would respond. This allows Molinists to hold to strong divine providence (God is in control) without sacrificing libertarian free will (you could have done otherwise in those exact circumstances).

  ### 4. The Plantinga Connection
  **The Video:** *"Alvin Plantinga built his free will defense against the problem of evil on this same idea."*

  **The Verdict:** **Mostly Fair, with nuance.**
  Plantinga is a careful philosopher. He isn't necessarily a theological Molinist in the full sense (he doesn't always commit to the idea that God uses this knowledge for total providential control). However, his famous "Free Will Defense" against the logical problem of evil relies heavily on the logic of Middle Knowledge.
  He argued that it is possible that even an omnipotent God could not create a world with free creatures who always do good. Why? Because it might be true that "If creature X were free in situation Y, they would sin." If that counterfactual is true, God can't make X do good in Y without removing X's freedom.
  So, the video is right that Plantinga uses the *mechanism* of counterfactuals of freedom, even if he doesn't sign onto every theological implication Molina did.

  ### 5. The Grounding Objection and the "Dead View" Claim
  **The Video:** *"Critics raise the grounding objection... most philosophers consider this fatal, which is why hardly anyone holds the view anymore."*

  **The Verdict:** **Half-true on the objection, false on the conclusion.**
  The **Grounding Objection** is indeed the biggest hurdle for Molinism. It asks: "What *makes* these counterfactuals true?"
  Usually, for a statement to be true, something in reality has to make it true (a "truthmaker"). For example, "The cat is on the mat" is true because there is a cat and a mat. But in Middle Knowledge, the creature doesn't exist yet, and they haven't made the choice yet. So what grounds the truth that "Peter *would* deny Christ"?
  Critics say: Nothing. Therefore, these statements can't be known, even by God.
  Molinists reply: These are just intrinsic features of the creatures. They are true by virtue of the creature's nature, even if the creature never exists.

  However, the claim that **"hardly anyone holds the view anymore" is simply false.**
  In the mid-20th century, Molinism was indeed rare. But since the 1980s and 90s, there has been a massive revival of Molinism in analytic philosophy of religion. It is currently one of the dominant models for understanding divine providence among evangelical philosophers and has significant support among Catholic philosophers as well. It is certainly not "dead in the water." It is a live, vigorously debated option. The Grounding Objection is considered a serious challenge, but not a "fatal" one that everyone agrees has refuted the view.

  ### Summary of What You Should Take Away
  1.  **Your Instinct Was Right:** The video's claim that God "determines the truth" of the counterfactuals is the weak link. That phrasing collapses Molinism into a form of determinism. Molinists insist God *knows* but does not *determine* those truths.
  2.  **Calvinism vs. Molinism:** The distinction remains valid. Calvinism locates the source of the choice in God's decree. Molinism locates the source of the choice in the creature, but locates the *knowledge* of that choice in God prior to creation.
  3.  **Current Status:** Don't let the video dissuade you from exploring the view. It is a sophisticated, technically robust position that is very much alive in contemporary philosophy.

  You haven't been sold a total bill of goods, but you were given a summary that was slightly sloppy on the most technically important point. If you find the idea of a God who is sovereign enough to guarantee His plans but respectful enough to leave freedom intact interesting, Molinism is worth studying further. It tries to walk a tightrope, and while critics say it falls off, proponents argue it's the only path that keeps both biblical doctrines standing.
