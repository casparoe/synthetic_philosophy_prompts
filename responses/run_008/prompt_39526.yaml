answer: |-
  This is a remarkably sophisticated dispute. You have stumbled into a classic debate in contemporary moral philosophy regarding the **normative authority to blame**. Your friends are effectively debating the distinction between the *fitness of the object* (is Dan blameworthy?) and the *fitness of the subject* (is Priya entitled to blame?).

  Here is my adjudication, treating this as a seminar in moral responsibility.

  ### Point-by-Point Adjudication

  **Move 1: Priya's Opening (The Truth Claim)**
  *Claim:* "What I said about Dan is true... two wrongs don't make a right. Marcus is changing the subject."
  *Verdict:* **Partly Right, Partly Mistaken.**
  *Analysis:* Priya is correct on the **substantive** condition of blame. Dan's flaking is objectively blameworthy regardless of who points it out. If moral truth were dependent on the virtue of the speaker, morality would collapse into aristocracy. However, she is mistaken to dismiss Marcus's objection as merely "changing the subject." In the ethics of blame, *standing* is not a distraction; it is a constitutive norm of the practice. Blame is not just a description of wrongness (like a weather report); it is a demand for accountability. Philosophers like R. Jay Wallace and Macalester Bell argue that hypocrisy can undermine the authority to make that demand. So, Marcus isn't changing the subject; he is challenging the *felicity conditions* of her speech act, not the truth of its content.

  **Move 2: Marcus's Counter (The Standing Claim)**
  *Claim:* "Blame is... calling a person to answer... you can't put someone in the dock from inside the same dock."
  *Verdict:* **Right.**
  *Analysis:* Marcus correctly identifies that blame is a normative practice involving authority. When we blame, we implicitly claim a certain moral high ground or jurisdiction. If Priya is guilty of the exact same vice, her blame becomes hypocritical. Hypocrisy is not just a character flaw; it functions as a *waiver of rights*. By violating the norm herself, she loses the standing to enforce it against others. Marcus is right that this doesn't make Dan innocent, but it does mean Priya's specific act of blaming is procedurally defective. She is trying to enforce a rule she is currently violating.

  **Move 3: Priya's Rebuttal (The Acknowledgment)**
  *Claim:* "I openly admit I'm a flaker, I apologize... I'm blaming him while blaming myself."
  *Verdict:* **Right.**
  *Analysis:* This is Priya's strongest philosophical move. Recent literature on standing (e.g., by Kyle Fritz or Daniel Bell) suggests that standing is not binary; it can be restored or mitigated. Hypocrisy involves *concealment* or *denial* of one's own fault while punishing another. By acknowledging her fault and apologizing, Priya removes the deceit element of hypocrisy. She is no longer claiming superior virtue; she is claiming shared fallibility but demanding better standards. This shifts her from "hypocrite" to "fellow traveler seeking improvement." This generally restores standing because the communication is no longer corrupted by false pretense.

  **Move 4: Marcus's Second Counter (The "Ex-Smoker" Objection)**
  *Claim:* "It's a person who's just barely reformed converting their reform into ammunition."
  *Verdict:* **Mistaken.**
  *Analysis:* Marcus is shifting the goalposts from *standing* to *motive* or *tone*. This is a variation of the "moral self-indulgence" objection. However, for standing to be voided, the blamer usually needs to be using the blame to *exempt themselves* or to *gain unfair status*. If Priya is genuinely reforming, using her experience to hold others accountable is not weaponization; it is moral solidarity. Unless Priya is blaming Dan *in order to feel better about herself* (which is a claim about her psychology, not her standing), this objection fails. Marcus is essentially arguing that only saints can blame sinners, which leads to a silence where no one can ever correct anyone.

  **Move 5: Priya's Trap (The Consistency Check)**
  *Claim:* "If I've confessed, I'm not judge and defendant anymore... now it looks like you just don't like being blamed at one remove."
  *Verdict:* **Right.**
  *Analysis:* Priya exposes a contradiction in Marcus's principle. If standing is lost simply by *having committed the act*, then no human being has standing to blame anyone (since we all transgress norms). Therefore, standing must depend on one's *attitude* toward the transgression. Since Priya has adopted the correct attitude (acknowledgment and apology), Marcus must either concede she has standing or admit his principle is absolute and impossible to meet. By digging in, Marcus reveals that his defense of Dan is likely motivated by loyalty or conflict avoidance, not a consistent principle of moral standing.

  ### The Nature of Standing: Silencing vs. Aptness

  You asked whether losing standing silences the blamer or merely gives the blamee an excuse. This is a crucial distinction.

  **The Verdict:** Losing standing does **not** make the blame *false* (Dan is still unreliable). However, it does **silence the blamer** in a specific normative sense. It gives the blamee (Dan) a right to reject the *address*. Dan can rightly say to Priya, "You are in no position to demand this of me."

  However, this right is **waivable**. If Priya acknowledges her fault (Move 3), she invites Dan to waive that defense. By saying, "I know I do this too, and I'm sorry, but we need to stop," she removes Dan's right to reject her address based on hypocrisy. Marcus fails to see that standing is dynamic, not static.

  ### Overall Verdict

  **Who is more right?**
  **Priya.**

  While Marcus started with a valid philosophical intuition (hypocrisy undermines standing), he failed to update his position when Priya introduced the variable of *acknowledgment*. He treated standing as a permanent stain based on past actions, whereas Priya correctly treated it as a status based on current moral orientation. By admitting her faults, she neutralized the *Tu Quoque* (you also) defense. Marcus's final position implies that moral improvement grants you *less* authority to speak on the matter, which is counter-intuitive and morally paralyzing.

  **What are they both missing about Dan?**
  They are fighting over the *procedure* of blame while ignoring the *substance* of the relationship.

  1.  **Dan's Silence:** You noted Dan "has not apologized once." This is the elephant in the room. Priya and Marcus are debating whether Priya is *allowed* to speak, while Dan is refusing to speak at all. In the ethics of responsibility, the primary obligation lies with the wrongdoer to offer an account. Dan is failing his primary duty, while Priya and Marcus are exhausting themselves over secondary duties (who gets to enforce the norm).
  2.  **The Function of the Group:** They are treating blame as a courtroom trial (who is the judge?) rather than a repair mechanism. The point of Priya blaming Dan isn't to punish him; it's to restore trust. Marcus is defending Dan's behavior by attacking Priya's character, which effectively creates a coalition *against* accountability.
  3.  **The "Flaking" Equivalence:** Marcus assumes Priya and Dan are morally equivalent because they both flake. They are likely not. Priya admits fault and apologizes (restorative); Dan flakes and offers no apology (exploitative). Marcus is equating *failure* with *unrepentant failure*. That is a category error.

  **Final Advice:**
  Tell them Marcus is philosophically outdated on the hypocrisy condition, and Priya is logically consistent. But tell them both they are losing the war. Dan is the one violating the group's trust without remorse. If they don't stop arguing about *who* can blame him and start demanding *he* answer for himself, the group will dissolve regardless of who won this argument.
