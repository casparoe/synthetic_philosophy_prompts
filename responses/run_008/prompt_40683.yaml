  8.  *(Self-Correction during drafting)*: I need to be precise about "Trivially True." The distinction between dying and death is conceptually trivial, but the *implication* (that we only fear dying) is substantive. I should clarify that. Also, regarding the Existence Constraint: many philosophers think it's false (due to posthumous harm). I should label it "Controversial/Substantive" rather than "True."

