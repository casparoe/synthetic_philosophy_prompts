          *   Does it work? It challenges the *attitude*, not necessarily the *metaphysics*.
          *   Counter-arguments: Asymmetry of time (future is open, past is closed).
          *   Verdict: It weakens the emotional force of the Deprivation Account but doesn't logically destroy it.
      *   *Section 4: What the Slogan Needs.*
