answer: |-
  This is a sophisticated epistemic stance, often called "Aumannian Fundamentalism" (championed most notably by Robin Hanson). You are treating a mathematical theorem about idealized agents as a normative law for human discourse.

  The theorem itself is sound. The leap to human epistemology is where the friction lies. You asked for specific technical and empirical arguments that count against this leap, ranked by severity, avoiding generic "humans are biased" hand-waving.

  Here is the ranking from **Fatal** (undermines the normative claim) to **Awkward** (requires qualification but doesn't break the view).

  ### 1. The Indexicality Objection (Fatal to the Common Prior Assumption)
  **The Argument:** The Common Prior Assumption (CPA) is not just empirically false; it is *normatively incoherent* for situated agents.
  **Technical Source:** Stephen Morris, *"The Common Prior Assumption in Extensive Form Games"* (1995) and subsequent work on "Harsanyi type spaces."
  **The Gist:** Aumann and Hanson argue that if two agents trace their information back to the beginning of the universe (the "Big Bang"), they must have the same prior. Differences arise only from different information partitions.
  **The Counter:** Morris argues that agents possess **indexical information** that cannot be shared. "I am Scott" is a piece of information I have that you cannot have, even if you know everything about my physical state. If priors are meant to encode *all* pre-evidence information, and identity is part of that information, then rational agents *must* have different priors because they are different entities.
  **Why it's Fatal:** If differing priors are a necessary consequence of being distinct individuals (indexicality), then persistent disagreement does not imply epistemic failure. It implies distinct vantage points. If you insist on a common prior, you are demanding agents ignore their own identity, which is arguably irrational.
  **Defender Response:** Hanson argues this is a "pre-rationality" issue. He claims we should imagine ourselves as "souls" assigned to bodies randomly *before* birth. If we did that, we'd have common priors.
  **Concession:** Defenders admit CPA is a counterfactual idealization. But if the counterfactual requires ignoring the fact that *you are you*, its normative force weakens significantly.

  ### 2. Empirical Persistence of Expert Disagreement (Fatal to the "Smart People" Premise)
  **The Argument:** Even among agents who are calibrated, incentivized, and highly informed, disagreement persists without obvious epistemic sin.
  **Technical Source:** Philip Tetlock's *"Expert Political Judgment"* (2005) and the Good Judgment Project (Mellers et al., 2014).
  **The Gist:** If your view holds, then among "superforecasters" (people trained in probabilistic reasoning, with feedback loops, and common incentives), disagreement should vanish rapidly as they share posteriors.
  **The Data:** In forecasting tournaments, even top-tier forecasters retain significant variance in probability estimates (e.g., one says 70%, another 85%) even after seeing each other's estimates and reasoning. This variance often predicts better aggregate accuracy (the "wisdom of crowds" effect relies on *uncorrelated* errors).
  **Why it's Fatal:** If you label this persistent variance as "epistemic failure" (dishonesty or bad updating), you strip the term of utility. If the best epistemic agents we can find *still* "agree to disagree," then the Aumannian norm is not just hard to reach; it may be incompatible with the cognitive diversity that produces accuracy.
  **Defender Response:** They argue forecasters aren't sharing *full* posteriors, only point estimates. They aren't truly "common knowledge" of each other's reasoning.
  **Concession:** Defenders must concede that real-world "agreement" is messier than the theorem's binary state. But if the gap remains after extensive deliberation, the "failure" diagnosis becomes indistinguishable from "rational diversity."

  ### 3. Computational Intractability of Updating (Very Strong)
  **The Argument:** The theorem assumes agents can compute $P(E|I)$ instantly. In reality, updating is often computationally NP-hard.
  **Technical Source:** Problems in Bayesian Network inference (Cooper, 1990); Logical Omniscience critiques (Garber, 1983).
  **The Gist:** To treat someone as "rational" in the Aumann sense, you must assume they have derived all logical consequences of their information. If my posterior depends on solving a cryptographic hash or a complex combinatorial problem that I haven't solved yet, my posterior is undefined.
  **Why it's Strong:** You explicitly asked to skip "humans aren't Bayesians." This is different. This says: *Even a silicon agent with a common prior cannot compute the posterior in polynomial time.* If updating is computationally expensive, "not updating" isn't laziness; it's a resource constraint. If I haven't computed the implication of my data, I can't announce the posterior.
  **Defender Response:** Defenders (like Hanson) treat this as a "bounded rationality" caveat. They argue we should approximate.
  **Concession:** They concede this limits the theorem's application to "tractable" domains. But few real-world debates (macroeconomics, AI risk) are computationally tractable.

  ### 4. The Unfalsifiability / Diagnostic Vacuity Trap (Awkward)
  **The Argument:** If every disagreement is explained by "no common prior" or "hidden dishonesty," the theory explains everything and nothing.
  **Technical Source:** Philosophical critiques of regulative ideals (e.g., Van Fraassen on constructive empiricism applied to rationality).
  **The Gist:** You claim: "If smart people disagree, someone is wrong."
  The Counter: How do we identify *who* is wrong without already knowing the answer? If the only evidence of "bad priors" is the disagreement itself, the argument is circular.
  **Why it's Awkward:** It turns the Aumann view into a tautology: "Rational agents agree; these agents disagree; therefore they aren't (fully) rational." This is true by definition but offers no heuristic for *resolving* the dispute. It tells you *that* someone is failing, but not *which* one, or *how* to fix it.
  **Defender Response:** Hanson admits this. He argues it's a "regulative ideal" (like perfect frictionlessness in physics). It's not meant to be a diagnostic tool for specific cases, but a pressure to reduce disagreement.
  **Concession:** Defenders fully concede this. They argue it's a feature, not a bug. It's a norm, not a law.
  **Is it Fatal?** For a *scientific* theory, yes. For a *normative* ethic, no. But it does limit its utility in actual debates.

  ### 5. Common Knowledge Depth Requirements (Merely Awkward)
  **The Argument:** AAT requires *common knowledge* of posteriors (I know that you know that I know...).
  **Technical Source:** Geanakoplos & Polemarchakis (1982) on communication protocols.
  **The Gist:** In real conversations, we rarely achieve even second-order knowledge ("I know that you know"). We usually operate on "mutual knowledge" (I know, you know).
  **Why it's Awkward:** The convergence proofs often require many rounds of announcement. In complex networks, the number of rounds required to establish common knowledge can exceed the lifespan of the debate.
  **Defender Response:** Defenders argue that in the internet age, posting a probability publicly gets us close enough to common knowledge.
  **Concession:** They concede it's an idealization but argue that *striving* for common knowledge is the epistemic duty.

  ---

  ### Assessment of Unfalsifiability
  You asked if the view has been qualified into unfalsifiability. **Yes, it has.**
  Robin Hanson explicitly frames "Ideal Bayesians" as a counterfactual benchmark. If two people disagree, the Aumannian says, "You are not yet ideal." If they try to fix it and still disagree, the Aumannian says, "You haven't dug deep enough into the priors."

  **Is this fatal?**
  *   **For a descriptive claim:** Yes. It makes the theory immune to empirical refutation.
  *   **For a normative claim:** No. Newtonian frictionless planes are also "unfalsifiable" in a vacuum, but they guide engineering.
  *   **The Risk:** The risk is **moral hazard**. If I am convinced I am the "rational" one, Aumannianism gives me a license to dismiss my opponent as "epistemically broken" (bad priors/dishonest) rather than engaging with their evidence. It can accelerate polarization under the guise of seeking agreement.

  ### Confidence and Uncertainty
  **Confidence in Ranking:** High (85%). The Indexicality objection (Morris) and Empirical Divergence (Tetlock) are the strongest technical and empirical blows to the *normative* application of AAT.
  **Least Sure Point:** I am least sure about the **Unfalsifiability** ranking (Point 4).
  *Reasoning:* Whether unfalsifiability is a "fatal flaw" depends entirely on whether you view epistemology as a science (descriptive) or a discipline of norms (prescriptive). Philosophers disagree sharply on whether normative theories *should* be falsifiable. Some argue norms *must* be unfalsifiable ideals to function. I have flagged this as "Awkward" rather than "Fatal" because defenders have a coherent philosophical defense (Regulative Idealism), whereas the Indexicality objection attacks the internal coherence of the prior itself.

  ### Summary Recommendation
  If you want to hold the Aumann view, you must retreat from "Disagreement implies someone is wrong" to "Disagreement implies a **coordination failure** in establishing common knowledge/priors."
  The specific observation that should move you most is **Tetlock's data**: High-performing agents *maintain* disagreement because it preserves cognitive diversity. If you force agreement, you might lower the collective accuracy. This suggests "agreeing to disagree" isn't always an epistemic sin; sometimes it's an ecosystem feature.
