      3.  Strict Dworkinian (Brute vs Option).
      4.  The "Taint" View (Any choice voids luck).
      5.  The Libertarian Shadow (Responsibility trumps need).

      *Wait, let's refine.*
      1.  **The Circumstance Principle:** Neutralize unchosen disadvantages. (Plausible, Egalitarian, Smoker gets help).
      2.  **The Dworkinian Split:** Brute luck compensated, Option luck insured. (Plausible internally, Egalitarian, Smoker depends on info/voluntariness).
      3.  **The Reasonable Avoidability Standard:** Compensate unless disadvantage was reasonably avoidable. (Plausible, Egalitarian, Smoker likely gets help due to background).
