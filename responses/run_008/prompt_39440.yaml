answer: |-
  This is a classic frustration in distributive justice seminars. The slogan "compensate for bad luck, not bad choices" sounds intuitive, but as you've noticed, it functions as a **Rorschach test**: everyone projects their own definition of "luck," "choice," and "compensate" onto it.

  Your professor is applying a **crude version** of Luck Egalitarianism (LE) that many sophisticated luck egalitarians (like Richard Arneson or G.A. Cohen) would actually reject. The smoker case is the perfect wedge to pry this open.

  Here is a breakdown of five distinct principles hidden inside that slogan, ranked from weak/truistic to strong/controversial, followed by the spectrum issue and the standard objection. You can bring this list directly to section.

  ### Part 1: Five Principles Hidden in the Slogan

  | Principle | Precise Claim | Plausibility | Genuinely Egalitarian? | Verdict on Smoker |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Circumstance Principle** | Neutralize disadvantages arising from factors entirely outside the agent's control (genetics, birthplace, parents). | **Very High.** Hard to argue we *should* punish people for where they were born. | **Yes.** This is the core egalitarian impulse (equality of opportunity). | **Compensate.** The smoker's neighborhood and parents are circumstances. |
  | **2. The Reasonable Avoidability Standard** | Compensate disadvantages unless the agent could *reasonably* have avoided them given their actual options and knowledge. (Arneson) | **High.** Accounts for the fact that "choice" requires real alternatives. | **Yes.** It aims for equality of opportunity for welfare, not just abstract choice. | **Compensate.** Given addiction + poor neighborhood, smoking wasn't "reasonably avoidable." |
  | **3. Strict Dworkinian Split** | Compensate **Brute Luck** (unchosen), let **Option Luck** (calculated gambles) stand. If you took a risk, you own the loss. | **Contested.** Depends on whether the risk was truly informed and voluntary. | **Yes.** This is canonical Luck Egalitarianism. | **Depends.** Was smoking a "calculated gamble"? With chain-smoking parents, preference formation is brute luck, so likely **Compensate**. |
  | **4. The Causal Taint Principle** | If a voluntary choice played *any* causal role in the disadvantage, compensation is reduced or voided. | **Low.** Most disadvantages are mixed causes (luck + choice). This creates a "gotcha" culture. | **No.** It prioritizes responsibility-tracking over alleviating suffering. | **Deny.** The professor is likely using this. "You chose to light the cigarette." |
  | **5. The Desert Principle** | People *deserve* the outcomes of their choices; aiding them violates fairness to the prudent. | **Low (as Justice).** This is essentially Libertarianism or Conservative Desert Theory. | **No.** This is responsibility-worship, not equality. It accepts large inequalities as "just." | **Deny.** The smoker is "at fault," so they get nothing. |

  **How to use this in section:**
  Point out that your professor is moving from **Principle 3** (the academic theory) to **Principle 4 or 5** (the application) without justification. A consistent Luck Egalitarian (Principle 2 or 3) would argue that growing up in a smoking household creates *endogenous preferences* (preferences formed by brute luck), which means the "choice" to smoke is tainted by bad luck.

  ### Part 2: Is the Cut Binary or Spectral?

  The slogan implies a binary: **Luck | Choice**.
  The reality is a spectrum: **Brute Luck — Socialization — Addiction — Impulsive Act — Calculated Gamble**.

  *   **The Problem:** Luck Egalitarianism struggles with **preference formation**. If my parents smoked, I am statistically much more likely to smoke. Is that a "choice"?
  *   **The Sophisticated LE View:** Most modern luck egalitarians (like Arneson) argue that for a choice to negate compensation, it must be **reasonably avoidable**. If social pressure, addiction, or lack of education made quitting incredibly hard, the "choice" slides back toward the "luck" side of the spectrum.
  *   **The Professor's Error:** By treating the smoker's action as a clean "choice," the professor is ignoring the *history* of the choice. If the preference itself was caused by brute luck (parents/neighborhood), compensating for the lung cancer is compensating for bad luck, even if a cigarette was technically "chosen."

  ### Part 3: The Standard Objection (The Reckless Driver)

  You mentioned remembering a hypothetical about a reckless driver. This is **Elizabeth Anderson's** famous critique from her paper *"What is the Point of Equality?"* (1999).

  *   **The Scenario:** Two drivers. Driver A drives carefully. Driver B drives recklessly (bad choice). Driver B crashes and is injured.
  *   **The Luck Egalitarian Conclusion:** We should not help Driver B (or help them less), because their injury is the result of "option luck" (a bad gamble), not brute luck. To tax Driver A to help Driver B is to punish prudence.
  *   **The Objection (The "Abandonment" Critique):**
      1.  **Dignity:** Justice should not depend on an inquiry into whether the victim was "worthy." It is humiliating to be denied healthcare because a bureaucrat decides you were "too reckless."
      2.  **Solidarity:** A society based on LE lacks social solidarity. It says, "You made your bed, lie in it."
      3.  **Epistemic Humility:** We rarely know if a choice was truly voluntary. Was Driver B reckless, or panicked, or distracted by a child, or suffering from a undiagnosed condition?
  *   **Why it Bites:** It shows that making distribution conditional on "fault" turns the welfare state into a moralizing court. It violates the idea that citizens are owed support simply by virtue of being members of the community.

  ### Part 4: Strategy for Section

  Don't attack Luck Egalitarianism as a whole (unless you want to); attack the **application**. Here is your script:

  1.  **Clarify the Terms:** "Professor, when we say 'choice' in the smoker case, are we using Dworkin's 'option luck' or Arneson's 'reasonable avoidability'? Because if it's the latter, the smoker's background makes the choice non-voluntary."
  2.  **Highlight Preference Formation:** "If my preferences are shaped by my parents' smoking (brute luck), isn't the resulting lung cancer ultimately traceable to brute luck? Where does the luck stop and the choice begin?"
  3.  **Invoke Anderson:** "Even if we grant it was a choice, does LE imply we should let people suffer indefinitely if they made a bad gamble? Doesn't that violate the egalitarian commitment to standing in relations of equality, rather than relations of moral judgment?"

  **Summary for your notes:**
  The slogan is ambiguous.
  *   **Weak reading:** Don't punish people for birth circumstances. (Plausible, Egalitarian, Helps Smoker).
  *   **Strong reading:** If you chose it, you own it, no matter the context. (Implausible, Libertarian-leaning, Hurts Smoker).
  *   **The Gap:** Your professor is assuming the Strong reading without arguing for it.
  *   **The Knockdown:** Addiction and socialization blur the line. If the "choice" was heavily influenced by "luck," the Luck Egalitarian principle actually *demands* compensation.
