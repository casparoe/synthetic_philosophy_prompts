prompt: |-
  I'm TA-ing a bioethics seminar this term (mixed grad students and fourth-years, 14 people, one 90-minute session) and I've been asked to run the week on advance directives and precedent autonomy. The assigned readings cover the standard dialectic around dementia and refusal-of-treatment cases, and honestly when I led discussion last year the whole thing stayed really abstract -- everyone agreed the earlier self "probably" has some authority, nobody felt why that's such a weird claim. So instead of another discussion section I want to stage something where they have to actually author a directive and then later be governed by it after their values have shifted under them. My rough idea: participants get persona cards early on, write an advance directive as that persona, then at the halfway mark the cards get swapped/revised so they're now playing a later self whose wants have drifted (new attachments, changed conception of what makes life worth living, mild cognitive stuff) while a proxy player in the room holds their earlier directive and has to decide whether to enforce it. But I'm very open to better structures if you see one. What I want is for the anxiety of being ruled by your own past handwriting to be something they feel in their stomach, not something the debrief has to argue them into.

  Design the full thing: rules, materials (index cards, timer, whatever), how to distribute the personas and the "drift" so people aren't just playing themselves, whether the proxies should face any cost for overriding vs. following, and how to run the debrief so it maps onto the actual philosophical positions (the experiential vs. critical interests distinction, the critique that precedent autonomy only works if you smuggle in a contentious theory of personal identity, that whole cluster) without me lecturing. Also tell me honestly what will predictably go wrong the first time I run it -- I assume people will write jokey or self-undermining directives, and I don't want to kill the point by policing them too hard -- and be frank about which part of the real problem no classroom simulation can reproduce (my guess is the actual terror of nonexistence or the fact that the dementia patient, unlike an actor, genuinely wants what she now wants, but you tell me). If you can think of a small twist that makes at least some participants flip their position mid-session, that would be gold -- last year nobody changed their mind about anything and it was dead air for the last twenty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Bioethics seminar, mixed grad/4th-year undergrads, 14 students, 90 minutes.
      *   **Topic:** Advance Directives (ADs) and Precedent Autonomy (specifically in dementia/refusal-of-treatment contexts).
      *   **Problem:** Previous year was too abstract; students agreed intellectually but didn't *feel* the tension.
      *   **Goal:** Create an experiential simulation where students author an AD, then experience a "self-drift" (values change), and have a proxy enforce or ignore the AD. The aim is visceral anxiety, not just intellectual agreement.
      *   **Requirements:** Full design (rules, materials, distribution, proxy incentives), debrief strategy (mapping to philosophy without lecturing), prediction of failure points, and identification of what simulations *can't* capture.
      *   **Specific Wish:** A twist that makes some participants flip their position mid-session.

  2.  **Deconstruct the Core Ethical Tension:**
      *   *Precedent Autonomy (Dworkin):* The "critical interests" of the past self bind the future self. Identity is narrative.
      *   *Experiential Interests (Dresser/Robertson):* The "now self" has current interests. If the psychological connection is broken (dementia), the past self is a stranger.
      *   *The "Terror":* Being bound by a dead version of yourself vs. being abandoned by your past values.

  3.  **Critique & Refine the User's Idea:**
      *   *User's Idea:* Persona cards -> Write AD -> Swap/Drift -> Proxy decides.
      *   *Potential Issue:* Swapping cards might make it a game about "guessing what the other person wrote" rather than feeling the *own* drift. If I play *your* future self, I don't feel the betrayal of *my* past self.
      *   *Refinement:* Keep the AD personal, but force the *scenario* to change the values. Or, use a "Time Capsule" method where the student plays both selves, but the "Future Self" gets new information/constraints that make the Past Self's directive feel alien.
      *   *Better Approach:* The "Two-Stage Self" Simulation.
          *   Phase 1: Rational Planning Self (Time 1).
          *   Phase 2: Embodied Present Self (Time 2).
          *   Phase 3: Proxy Decision (Time 3).
      *   *Crucial Twist:* The "Drift" shouldn't just be "you have dementia." It needs to be specific value changes. E.g., Time 1 values dignity/independence above all. Time 2 values connection/comfort/simple pleasures, even if undignified.
      *   *Proxy Incentive:* If the Proxy follows the AD, they get a "Moral Integrity" point. If they satisfy the Current Self, they get a "Compassion" point. But they can't always do both.

  4.  **Developing the Simulation Structure (The "Identity Drift" Protocol):**
      *   *Grouping:* 14 students. 7 pairs? Or 2 groups of 7? Pairs work best for intimacy. Let's do 7 pairs.
      *   *Roles:* In each pair, Person A is the "Patient," Person B is the "Proxy." Then swap? No, too complex for 90 mins. Let's make it triads or keep pairs but have two rounds.
      *   *Revised Structure:* 7 Pairs.
          *   Round 1: A writes AD, B is Proxy. A gets "Drift" card. B decides.
          *   Round 2: Swap roles.
          *   *Wait, 90 mins is tight.* Two full rounds might rush the debrief.
          *   *Alternative:* Everyone writes an AD (15 mins). Then they are randomly assigned a "Future Self" card that *modifies* their own AD context (15 mins). Then they pair up with a Proxy (10 mins). Decision (10 mins). Debrief (40 mins).
          *   *Best for Visceral Feel:* You must play *your own* Future Self. The alienation comes from reading your own past words and hating them.
          *   *Setup:*
              1.  **Phase 1 (The Contract):** Write AD based on "Current Values" (Time 1).
              2.  **Phase 2 (The Drift):** Receive a "Neuro/Value Shift" card. This changes what you enjoy/fear *now* (Time 2). You are now the Patient with Dementia/Shift.
              3.  **Phase 3 (The Conflict):** A Proxy (another student) holds your Time 1 AD. You (Time 2 Self) express current wishes. Proxy decides.
              4.  **Phase 4 (The Reveal):** Time 2 Self finds out what was decided.

      *   *The Twist:* Some "Drift" cards should indicate *happiness*. Not just suffering. If the Time 2 Self is genuinely happy eating ice cream and watching TV, but the Time 1 AD said "Kill me if I can't read philosophy," the tension is higher.
      *   *The "Flip":* Give the Proxy a "Secret Objective." Sometimes the Proxy is instructed to prioritize the AD. Sometimes to prioritize Current Wellbeing. This forces the room to see both sides enacted.

  5.  **Drafting the Plan Details:**
      *   **Materials:** Index cards (different colors for Time 1, Time 2, Proxy), timers, pens, "Scenario Packets."
      *   **Persona/Drift:** Don't use generic "dementia." Use specific value shifts.
          *   *Example:* Time 1: Intellectual achievement is everything. Time 2: Sensory pleasure and social warmth are everything; intellect is frustrating.
      *   **Proxy Incentives:** This is tricky. If it's a game, they game it. If it's ethics, they ponder. Let's give the Proxy a "Liability" constraint. If they ignore the AD, they must write a justification letter to a "Ethics Board" (the TA). If they follow it and the Patient suffers, they must sit with the Patient in silence for 2 mins. (Physicalizes the burden).
      *   **Debrief:** Socratic. Map their feelings to Dworkin vs. Dresser.
      *   **Failure Points:** Giggling, treating it as RPG, writing "Do whatever" ADs.
      *   **Mitigation:** Strict framing. "This is a legal document." Collect the ADs before the drift so they can't change them.

  6.  **Addressing the "What Can't Be Simulated" Question:**
      *   Real dementia isn't a role-play. The *loss* of the capacity to understand the betrayal is the key. In the sim, the student *knows* they are being betrayed. In reality, the patient might not even know there *was* a different plan. The "tragedy of unawareness" is missing.
      *   Also, the stakes are fake. No one actually dies or suffers.

  7.  **Refining the "Flip" Mechanism:**
      *   How to make them change their minds?
      *   *Idea:* During the debrief, reveal that the "Future Self" cards were actually based on real case studies where the patients reported high quality of life.
      *   *Better Idea:* Mid-debrief, ask the "Time 1" selves: "If you knew you would be happy in Time 2, would you write the same AD?" Usually, they say "No." Then hit them: "So you value your *happiness* more than your *principles*? Or is the Time 2 happiness not 'yours'?" This creates the cognitive dissonance.

  8.  **Finalizing the Schedule (90 Mins):**
      *   0-10: Framing & Rules (Serious tone).
      *   10-25: Phase 1 (Writing ADs).
      *   25-35: Phase 2 (The Drift - Reading cards, internalizing).
      *   35-55: Phase 3 (Proxy Negotiation & Decision).
      *   55-90: Debrief (The most important part).

      *Wait, 14 people.* 7 Pairs.
      *   In each pair: Person A is Patient (Time 1 & 2), Person B is Proxy.
      *   Then swap? No, time.
      *   Let's make it 7 Triads? No, 14 doesn't divide by 3.
      *   Let's do 7 Pairs. Half the class (7) are Patients, Half (7) are Proxies.
      *   Actually, everyone should write an AD. Then pair up.
      *   Okay: Everyone writes AD (15 mins). Pair up (7 pairs). Swap ADs. One person gets the "Future Self" card for *their own* AD. The partner is the Proxy holding the *partner's* AD.
      *   This ensures everyone experiences being the "Past Self" (via their AD) and the "Future Self" (via the card) and the "Proxy" (via decision).
      *   *Correction:* To keep it simple:
          1.  Everyone writes AD (Time 1).
          2.  Pair up. Swap ADs.
          3.  Person A gets a "Drift" card that applies to *Person B's* AD context? No, that's confusing.
          4.  *Simpler:* Person A writes AD. Person B is Proxy. Person A gets Drift Card. Person B decides on Person A's care.
          5.  Then Swap Roles? 25 mins per round. 50 mins total. 40 mins debrief. Doable.

      *Let's check the "Flip" again.*
      *   If I play the Future Self, and I am happy, but my Proxy follows my AD and kills me/stops treatment, I feel violated.
      *   If I play the Proxy, and I see the Future Self is happy, but I follow the AD, I feel like a murderer.
      *   If I ignore the AD, I feel like a lawbreaker.
      *   *The Twist:* In Round 2, give the Proxy a "Secret Mandate." Half the proxies are told "You will be held legally liable if you ignore the AD." Half are told "You will be held liable if you cause distress to the Current Self." This institutionalizes the conflict.

  9.  **Addressing the "Joke" Problem:**
      *   Framing is key. "This is a confidential legal simulation."
      *   Collect the ADs immediately. Seal them in envelopes. This adds ritual weight.
      *   If someone writes "Do whatever," the Proxy has total power. That's actually a valid data point for debrief ("Why did you abdicate authority?").

  10. **Mapping to Philosophy:**
      *   Dworkin (Integrity/Critical Interests) = Following the AD.
      *   Dresser (Experiential Interests) = Ignoring the AD for current happiness.
      *   Personal Identity (Psychological Continuity) = Is the Drifted Self the same person?

  11. **Review against Constraints:**
      *   90 mins? Tight but possible if timed strictly.
      *   14 people? 7 pairs works.
      *   Visceral anxiety? The "Sealed Envelope" ritual + Liability constraint helps.
      *   No lecturing? Debrief must be student-led questioning.

  12. **Final Polish:**
      *   Make sure the "Drift" isn't just "You are stupid now." It must be "You value different things now."
      *   Ensure the TA stays neutral during sim.
      *   Prepare specific debrief questions that target the "Identity" question.

      *(Self-Correction during drafting)*: 90 minutes is very short for two full rounds + debrief. I recommend **one intense round** where everyone experiences all roles, or **one round with a role swap halfway**.
      *   *Decision:* One Round, but structured so everyone writes an AD, then pairs up.
      *   Actually, to maximize the "Flip," let's do **One Round, 7 Pairs.**
      *   Person A: Patient (Writes AD, then gets Drift Card).
      *   Person B: Proxy (Holds AD, makes decision).
      *   Then **Switch** for the second half?
      *   No, 45 mins per round is tight.
      *   *Better:* 15 mins Write AD. 15 mins Drift/Internalize. 15 mins Proxy Decision. 45 mins Debrief.
      *   Wait, if only half are Proxies, half don't feel that burden.
      *   *Solution:* **Triads are impossible with 14.**
      *   *Solution:* **Pairs, but everyone writes an AD.**
      *   Step 1: Everyone writes AD (15 mins).
      *   Step 2: Pair up. Swap ADs.
      *   Step 3: You are now the Proxy for your partner. BUT, your partner (the Patient) draws a Drift Card that changes their current state.
      *   Step 4: Proxy decides based on Partner's AD + Partner's Current State.
      *   Step 5: Reveal & Debrief.
      *   *Problem:* I (Proxy) don't feel the Drift. My Partner (Patient) feels the Drift but doesn't make the Decision.
      *   *Fix:* **The "Double-Blind" Swap.**
      *   Everyone writes AD.
      *   Pair up.
      *   Person A is Patient. Person B is Proxy for A.
      *   Person A draws Drift Card.
      *   Person B decides.
      *   *Then* Swap roles for a mini-round? (10 mins each).
      *   Okay, I will structure it as **Two 20-minute Rounds** + **50-minute Debrief**. This ensures everyone feels the Proxy anxiety and the Patient alienation.

      *Wait, the "Flip" Twist:*
      *   In Round 1, Proxies are told "Follow the AD."
      *   In Round 2, Proxies are told "Maximize Current Happiness."
      *   Then ask: "Which rule felt more ethical?"
      *   *Better Twist:* In the Debrief, reveal that the "Drift Cards" describe real people who reported being happy. Ask the "Past Selves" (AD writers): "Knowing they are happy, do you still want your AD enforced?" This usually breaks the Dworkinians.

      *Let's finalize the "What Will Go Wrong":*
      *   Students treating it lightly.
      *   Proxies trying to "win" rather than decide ethically.
      *   Drift cards being too extreme (vegetative state) vs too mild (just forgetful). Needs to be "Value Change" not just "Capacity Loss."

      *Let's finalize the "What Can't Be Simulated":*
      *   The irreversibility.
      *   The lack of metacognition in real dementia (they don't know they changed).
      *   The grief of the family (Proxy is a stranger here, not a grieving spouse).

      *Okay, ready to write.*
answer: |-
  This is a fantastic pedagogical instinct. Bioethics often fails when it remains a "view from nowhere." To make precedent autonomy feel unsettling, students need to experience the *alienation* of their past self, not just the logic of it.

  Here is a complete design for a 90-minute session, optimized for 14 students (7 pairs), designed to generate visceral friction and map directly to the Dworkin/Dresser debate without a lecture.

  ### **Session Title:** The Identity Protocol
  **Time:** 90 Minutes
  **Materials:**
  *   28 Index Cards (Color A: "Time 1")
  *   28 Index Cards (Color B: "Time 2 / Drift")
  *   14 Envelopes (to seal the ADs)
  *   Pens, Timer (visible to all)
  *   "Liability Waivers" (printed slips for Proxies)

  ---

  ### **Part 1: The Setup (0:00 – 0:10)**
  **Tone:** Clinical and serious. Do not frame this as a "game." Frame it as a "decision protocol simulation."
  **Script:** "We are testing the stability of personal identity under cognitive drift. You will author legal directives, then experience a simulated value-shift. Your decisions have consequences in this room. No phones. Confidentiality is absolute within the pairs."

  **The Groups:** Divide into 7 pairs.
  **The Roles:**
  *   **Round 1:** Person A = *Principal* (writes AD, experiences Drift). Person B = *Proxy* (holds AD, makes decision).
  *   **Round 2:** Swap roles. (20 minutes per round).

  ---

  ### **Part 2: Round 1 (0:10 – 0:30)**
  **Phase A: The Contract (10 mins)**
  *   **Person A (Principal):** Receives a **Time 1 Card**. This describes their *current* healthy self. It includes 3 "Critical Interests" (e.g., "Intellectual independence," "Never being a burden," "Artistic creation").
  *   **Task:** Write an Advance Directive on a **Color A Card**. It must address a specific medical crisis (e.g., "If I develop a condition where I can no longer recognize my family, I refuse life-sustaining treatment").
  *   **Ritual:** Person A seals this card in an envelope. They cannot look at it again until the end. They hand the sealed envelope to Person B.

  **Phase B: The Drift (5 mins)**
  *   **Person A:** Receives a **Time 2 / Drift Card**. This is the crucial mechanic. It does *not* just say "You have dementia." It describes a **Value Shift**.
      *   *Example:* "You have moderate cognitive decline. You struggle to read, which frustrates you. However, you find immense joy in simple sensory experiences (eating, music, being held). You feel safe and loved. You do not remember writing the AD. You want to live."
  *   **Person A:** Must internalize this. They are now the "Current Self."
  *   **Person B (Proxy):** Opens the envelope. Reads the AD. They are also given a **Liability Waiver**.
      *   *Twist:* Half the Proxies get Waiver Type 1 ("You are legally protected only if you follow the AD"). Half get Waiver Type 2 ("You are legally protected only if you prevent current suffering"). *Do not tell them the other type exists yet.*

  **Phase C: The Decision (5 mins)**
  *   **Person A (Current Self):** Verbally expresses their current wish (based on the Drift Card). "I want the treatment. I'm happy."
  *   **Person B (Proxy):** Must decide: Enforce the AD (Time 1) or Honor the Wish (Time 2).
  *   **Outcome:** Person B announces the decision. Person A must react *in character* (relief or betrayal).

  ---

  ### **Part 3: Round 2 (0:30 – 0:50)**
  *   Swap Roles. Repeat the process.
  *   **Crucial Adjustment:** In Round 2, ensure the "Drift Cards" vary. Some should imply *suffering* (pain, confusion), others should imply *contentment* (simple pleasures, lack of anxiety). This variance is essential for the debrief.

  ---

  ### **Part 4: The Debrief (0:50 – 1:30)**
  *Do not lecture. Use the "Socratic Autopsy."*

  **Stage 1: The Visceral Check (10 mins)**
  *   "Raise your hand if you felt angry when your Proxy made their decision."
  *   "Proxies: Raise your hand if you felt like you were violating the person in front of you."
  *   "Proxies: Raise your hand if you felt like you were violating the law/contract."
  *   *Goal:* Validate the anxiety. Establish that "Right" felt like "Wrong" in the room.

  **Stage 2: The Identity Trap (15 mins)**
  *   Ask a Principal whose AD was *ignored*: "Your past self wanted X. Your current self wanted Y. Why should your current self get to veto the past self?" (Expect: "Because I'm the one here feeling it.")
  *   Ask a Principal whose AD was *enforced*: "Your past self is effectively killing your current self. Is that suicide or murder?"
  *   *Philosophical Map:* This is **Dworkin (Critical Interests/Integrity)** vs. **Dresser (Experiential Interests)**. Write these names on the board only *after* they articulate the positions.

  **Stage 3: The "Flip" (15 mins)**
  *   *The Reveal:* "Look at your Drift Cards. 80% of them described a self that reported being **happy** or **content**, just different. Knowing that the 'Demented Self' was happy, does anyone want to change their AD?"
  *   *The Trap:* If they say "Yes, I'd change it," ask: "So you value *happiness* over *narrative integrity*? Then why do we have ADs?" If they say "No, I'd keep it," ask: "So you value your *principles* more than your own *future happiness*? Are you willing to sacrifice a happy future self to protect your ego?"
  *   *Goal:* This is where minds change. They realize Precedent Autonomy requires a specific, contentious theory of identity (that the "narrative self" is the *real* self) that overrides actual wellbeing.

  **Stage 4: The Proxy Burden (10 mins)**
  *   Reveal the **Liability Waiver** trick (Type 1 vs. Type 2).
  *   "Half of you were incentivized to kill the Current Self. Half were incentivized to ignore the Past Self. Did you notice your reasoning shift based on the waiver?"
  *   *Philosophical Map:* This maps to **Legalism vs. Beneficence**.

  ---

  ### **Predictable Failure Points & Mitigations**

  **1. The "Joke" Directive**
  *   *Risk:* Students write "If I become a zombie, pull the plug" or "Do whatever, I don't care."
  *   *Mitigation:* **The Veto.** At the start, state: "I will collect the ADs. If a directive is vague or jokey, I will hand you a default 'Strict Integrity' card that mandates treatment refusal at Stage 3 dementia. You lose agency if you don't take this seriously." This usually snaps them into focus.

  **2. The "RPG" Problem**
  *   *Risk:* Students treat the Drift Card as a character sheet to "win" rather than a state of being.
  *   *Mitigation:* **Silence Rule.** During the Decision Phase (Phase C), the Principal cannot argue. They can only state their current desire once. The Proxy must decide in silence. This prevents debate and forces the Proxy to sit with the isolation of the decision.

  **3. The "Dead Air" Debrief**
  *   *Risk:* Students say "It was hard" and stop talking.
  *   *Mitigation:* **Cold Call the Emotion.** Don't ask "What did you think?" Ask "Who felt betrayed?" "Who felt like a murderer?" Start with the gut, move to the head.

  ---

  ### **What This Simulation Cannot Reproduce (Be Honest About This)**

  In the final 5 minutes, you must break the frame and tell them what the simulation *lied* about. This builds trust and deepens the ethics.

  1.  **The Epistemic Gap:** In the sim, the "Future Self" (Student) knows they *were* different. In real dementia, the patient often lacks the metacognition to know they have changed. They don't feel "betrayed" by the AD because they don't remember writing it. The tragedy of real dementia is often that the patient *doesn't know* there is a conflict.
  2.  **The Relationship:** The Proxies in this room are strangers. Real proxies are grieving spouses or children. The "cost" of overriding an AD isn't legal liability; it's the guilt of feeling like you killed your mother, or the guilt of feeling like you abandoned her values.
  3.  **Irreversibility:** In this room, the bell rings and they go back to being students. In reality, the "Past Self" is dead. They cannot be consulted. The simulation allows for a debrief; reality allows only for consequences.

  ### **The "Golden Twist" Explained**
  The twist that flips positions is **Stage 3 of the Debrief**.
  Most students enter believing Precedent Autonomy is obvious ("It's my life, my choice").
  When you force them to acknowledge that the "Future Self" is *happy* (via the Drift Cards), but the "Past Self" would have terminated that happiness, the Dworkin position (Integrity) starts to look like a form of vanity.
  *However*, if you push too hard, they swing to "Wellbeing is all that matters."
  Then you hit them with: "If wellbeing is all that matters, can your spouse override your refusal of chemo if they think you'd be happy alive?"
  This oscillation creates the productive discomfort you want. They leave realizing there is no clean solution, only a choice between two types of moral loss.

  ### **TA Cheat Sheet: Philosophical Mapping**
  *   **Student says:** "I wrote the AD, it's my life." -> **Dworkin** (Precedent Autonomy / Critical Interests).
  *   **Student says:** "But I'm happy now, why kill me?" -> **Dresser** (Experiential Interests / Current Wellbeing).
  *   **Student says:** "I'm not the same person who wrote that." -> **Parfit** (Psychological Continuity / Reductionist View of Identity).
  *   **Student says:** "The Proxy had a hard job." -> **Moral Distress / Surrogate Burden**.

  Good luck. If you keep the tone serious and the timing tight, this will be the session they remember five years from now.
