      *   *Correction:* No, a DDoS is malicious. The Monster is *legitimate* but efficient. Better analogy: A high-priority batch job that claims to generate infinite business value.
      *   *Check:* Did I explain *why* Utilitarians reply the way they do? Yes, need to mention diminishing marginal utility (saturation).
      *   *Check:* Did I address the "Residue"? Need a clear section for this.
      *   *Key Insight:* The engineer chooses the weights. The philosopher asks "Who chose the weights?"

  9.  **Final Polish:** Organize into clear sections: The Restatement, The Utilitarian Reply (Engineered), The Critic's Reply (Engineered), The Residue Report, The Verdict. (Proceed to generate output based on this structure).

  10. **Final check on constraints:** "dont dumb it down." Ensure terms like "cardinality," "interpersonal comparison," and "deontological constraints" are used correctly but explained via systems metaphors.

  *(Self-Correction during final review)*: Make sure to emphasize that in systems, we *can* measure utility objectively (mostly), whereas in ethics, that's the core contention. That is the biggest "residue."

