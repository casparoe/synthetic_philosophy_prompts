          *   Case 2 (Grandmother): Stroke/Dementia. Living Will says "no feeding tube." Post-stroke self is confused but happy and asks for food. Doctors feed based on current wishes. Rationale: Present self overrides past written self.
      *   **The Tension:** Both practices claim to respect *autonomy*, but they seem to rely on opposite theories of which "self" counts (Past vs. Present).
      *   **The Questions:**
          1.  What implicit theory of personal identity/autonomy underlies these practices?
          2.  Does the PAD presuppose the stable self is "real" and the psychotic self is an "impostor"?
          3.  Why doesn't the grandmother's past self bind her future self like a mortgage?
          4.  Is it about anticipation of value change? (But psychosis is also unanticipatable).
          5.  Which rival theories of personal identity license which practice?
          6.  Are the practices consistent or contradictory?
          7.  Where is the practice underdetermined?
          8.  Is there a principled line, or is it just squeamishness (withholding food vs. restraining)?
          9.  If it's squeamishness, what would a policy look like if it took the implicit theory seriously?
      *   **Constraint:** "Please dont just tell me these are hard cases and it depends." (Need a decisive, analytical answer).

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *Personal Identity:* Psychological Continuity (Locke/Parfit) vs. Biological Continuity (Animalism) vs. Narrative Identity.
      *   *Autonomy:* Precedent Autonomy (Dworkin) vs. Current Interest/Experiential Interests (Dresser/Robertson).
      *   *Case 1 (Psychiatry):* Relies heavily on the "Illness vs. Self" model. The psychosis is seen as an *interruption* of autonomy, not an *expression* of it. This aligns with a specific view of mental capacity where the "true" self is the rational, stable one.
      *   *Case 2 (Dementia/Stroke):* Relies on the "New Self" model. The cognitive change is seen as creating a *new* person (or at least a person with new interests) whose current welfare matters more than the abstract values of the past.
      *   *The Conflict:* The user spots a genuine inconsistency in bioethics practice. This is known in the literature (e.g., Rebecca Dresser's critique of Dworkin).

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's not just "hard cases"; it's a structural tension. State the thesis: The practices are *not* consistent under a single theory of the self. They switch theories based on the *type* of impairment and social comfort.

      *   **Theory 1: The Psychiatric Case (The "Interruption" Model):**
          *   *Implicit Theory:* The "True Self" is the Rational Self. Mental illness is an external invader (like a demon or a virus) that hijacks the agent.
          *   *Identity:* Psychological continuity is broken or corrupted. The psychotic self is a "false" self.
          *   *Autonomy:* Precedent Autonomy rules. The stable self is the sovereign.
          *   *Critique:* As the user notes, the sister feels *more* herself during mania. This theory ignores the phenomenological reality of the episode.

      *   **Theory 2: The Dementia/Stroke Case (The "Transformation" Model):**
