          *   *Dementia:* Goal is care for the *present* self (restoration impossible).
          *   *But:* Is this principled? Or just a cover for squeamishness about feeding tubes?
          *   *Honest Answer:* It's largely squeamishness + recoverability bias.

      *   **Policy Implications (If we took the theory seriously):**
          *   If we side with the Sister (Precedent Autonomy): We must honor the Grandmother's living will, even if she's happy. This is hard.
          *   If we side with the Grandmother (Current Interest): We must revoke the Sister's PAD when she is lucidly refusing in the moment. This risks cyclical suffering.
          *   *Real Policy Change:* We need to admit that "Best Interests" is doing the work, not "Autonomy." If we admit that, we stop pretending the Grandmother's current wish is "autonomous" (she lacks capacity) and stop pretending the Sister's restraint is purely "respecting autonomy" (it's paternalism justified by past consent).

