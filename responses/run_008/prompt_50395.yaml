answer: |-
  You have identified a genuine, structural contradiction in contemporary bioethics. The short answer is: **No, these practices do not presuppose a consistent theory of the self.** They are running on two incompatible metaphysical engines, switched based on the *type* of pathology and our visceral comfort with the outcome.

  If we force these practices into a single theoretical framework, one of them is ethically unjustified. Here is the reconstruction of the implicit theories, the contradiction, and the honest driver behind the divergence.

  ### 1. The Two Implicit Theories of the Self

  To make sense of your sister's case, the medical-legal system relies on what we might call the **"Interruption Model"** of personal identity. To make sense of your grandmother's case, it relies on the **"Transformation Model."**

  **Case 1: The Sister (The Interruption Model)**
  *   **Theory of Identity:** The "Real Self" is the rational, stable, capacity-holding agent. Psychosis is viewed not as a *version* of the self, but as an *invader* that temporarily severs psychological continuity.
  *   **Theory of Autonomy:** **Precedent Autonomy** (Ronald Dworkin's "Critical Interests"). Your stable self holds sovereignty over your life's narrative. The psychotic self is akin to a child or a hijacker; it lacks moral standing to override the "true" owner of the body.
  *   **The Metaphor:** Your mortgage analogy is exactly right here. The stable self binds the future self because they are the *same rational agent*. The episode is a temporary glitch in the hardware, not a change in the user.
  *   **Why it fits:** This licenses the restraint. It treats the injection as restoring the conditions for autonomy, not violating them.
  *   **The Flaw:** As you noted, this denies the phenomenological reality of your sister's experience. If she feels *more* herself during the episode, the "Interruption Model" is gaslighting her. It presupposes that "rationality" = "identity," which is a contentious philosophical claim.

  **Case 2: The Grandmother (The Transformation Model)**
  *   **Theory of Identity:** The stroke/dementia created a **New Person**. The psychological connections (memory, values, reasoning) that tied the grandmother to her living-will-signing self are severed. The current occupant of the body is a stranger to the woman who signed the document.
  *   **Theory of Autonomy:** **Current Interest View** (Rebecca Dresser). You cannot bind a stranger. The past self's values (no tube) are abstract; the present self's interests (hunger, happiness) are concrete. Since the "old" grandmother is effectively dead, her instructions expire.
  *   **The Metaphor:** This is *not* like a mortgage. It is like a will. If you die, your past self doesn't get to dictate the terms of the new life growing in your estate.
  *   **Why it fits:** This licenses feeding her. It prioritizes the avoidance of current suffering (hunger) over abstract consistency.
  *   **The Flaw:** It renders advance directives for dementia meaningless. If every significant cognitive shift creates a "new person," no one can plan for incapacity.

  ### 2. Why the Practices are Contradictory

  You asked if a view of psychological continuity would license one but not the other. **Strict psychological continuity theory actually undermines *both* practices, but in different ways.**

  *   **If psychological continuity is what matters:**
      *   **In the Sister's case:** If the psychosis is severe enough to break memory and reasoning, a strict Lockean might argue the "psychotic sister" is *not* the same person as the "stable sister." If they are different people, the stable sister has no right to bind the psychotic one (just as I cannot sign a contract for you). So, restraining her violates the psychotic self's autonomy.
      *   **In the Grandmother's case:** If the stroke breaks continuity, the "stroke grandmother" is a new person. The living will belongs to the dead person. So, feeding her is correct.
      *   **The Contradiction:** The system treats the Sister as *one person* (to bind her) but the Grandmother as *two people* (to free her).

  *   **If biological continuity is what matters (Animalism):**
      *   Both are the same human organism. Therefore, the prior directives should bind in *both* cases. The system fails the Grandmother here.

  The practice is **eclectic**. It cherry-picks the theory of identity that yields the most medically palatable result.
  *   When the patient is **dangerous or treatable** (Sister), she is **One Person** whose illness must be managed.
  *   When the patient is **vulnerable and permanent** (Grandmother), she is **A New Person** whose comfort must be prioritized.

  ### 3. The "Informed Consent" Problem

  You asked: *How did my sister's signature count as informed consent to a state she couldn't anticipate?*

  It didn't. This is the "Ulysses Contract" loophole. The validity of the Psychiatric Advance Directive (PAD) does not rest on her understanding the *experience* of mania. It rests on the legal fiction that **capacity is binary.**

  The law presupposes that when she signed the PAD, she was "Capable," and when she refused the shot, she was "Incapable." The theory is that an "Incapable" person has no moral right to self-determination. Therefore, her refusal isn't an expression of a *different* self; it is the absence of a self capable of refusal.

  This is why the Grandmother's case differs. In dementia/stroke cases, doctors often acknowledge the patient has *some* capacity (she can express a preference for food), but deem the *consequences* too high to honor the prior refusal. In psychiatry, the refusal itself is taken as *proof* of incapacity. The circularity is stark:
  *   **Sister:** You are refusing treatment -> You are sick -> You are incapable -> We ignore your refusal.
  *   **Grandmother:** You are asking for food -> You are happy -> We ignore your prior refusal because you are "different" now.

  ### 4. The Real Driver: Reversibility and Squeamishness

  Is there a principled line? **No.** The line is drawn by **Reversibility** and **Visceral Squeamishness.**

  1.  **Reversibility:**
      *   **Sister:** The goal of treatment is to *restore* the past self. We honor the past self because we expect that self to return and say "thank you." The intervention is temporary.
      *   **Grandmother:** The stroke damage is permanent. The "past self" is not coming back. Honoring her living will would mean starving a happy, conscious being to satisfy the values of a ghost.
      *   **The Principle:** We honor Past Self when Past Self is coming back. We honor Present Self when Past Self is gone forever.

  2.  **Squeamishness (The Honesty Test):**
      *   Restraining a screaming patient is clinically "clean." It looks like medicine.
      *   Withholding food from a begging patient looks like murder.
      *   The medical system is willing to override autonomy to prevent *death* (Grandmother) but also willing to override autonomy to prevent *illness* (Sister). But the emotional weight of starvation is heavier than the emotional weight of restraint.
      *   **Verdict:** You are right to be bugged. The inconsistency is largely driven by the fact that doctors are more afraid of liability for starvation than liability for restraint.

  ### 5. Policy Implications: What if We Took the Theory Seriously?

  If we stop pretending and align policy with the implicit theories, we have to make a hard choice. We cannot have both.

  **Option A: The "Precedent Autonomy" Consistency (Dworkin)**
  *   **Theory:** The rational, stable self is the sovereign. Critical interests trump experiential interests.
  *   **Policy Change:** We must honor your Grandmother's living will. Even if she is happy, even if she begs, if she lacks the capacity to understand death, we follow the document. We let her starve (via palliative sedation).
  *   **Cost:** This is morally repugnant to most caregivers. It treats the current conscious being as a vessel for a dead person's values.

  **Option B: The "Current Interest" Consistency (Dresser)**
  *   **Theory:** Only the currently experiencing self matters. You cannot bind a future self that no longer shares your values.
  *   **Policy Change:** We must revoke your Sister's Psychiatric Advance Directive the moment she lucidly refuses treatment. If she says "no shot" while psychotic, we listen. We accept that she may cycle through suffering.
  *   **Cost:** This leads to the "revolving door" of hospitalization. It treats mental illness as a lifestyle choice rather than a capacity-destroying event.

  **Option C: The Honest "Best Interests" Standard (The Realist Approach)**
  *   **Theory:** Admit that "Autonomy" is doing no work here. Both cases are decided by **Paternalism** calibrated to **Recoverability**.
  *   **Policy Change:**
      1.  **Abolish the fiction of "Binding."** Acknowledge that PADs and Living Wills are *advisory* only.
      2.  **Substituted Judgment + Best Interests:** In the Sister's case, we treat her because the *Best Interest* is restoring function (high recoverability). In the Grandmother's case, we feed her because the *Best Interest* is avoiding suffering (low recoverability).
      3.  **Stop using the word "Autonomy."** When we restrain your sister, we are not respecting her autonomy; we are overriding it for her welfare, justified by her past consent. When we feed your grandmother, we are overriding her past autonomy for her current welfare.
      4.  **Oversight:** If we admit this is paternalism, we need stricter oversight. A "Best Interests" decision requires an ethics review, not just a doctor's signature.

  ### Conclusion

  The practices are **flatly contradictory** regarding personal identity.
  *   Your sister's treatment presupposes she is **one continuous person** whose illness is a temporary corruption.
  *   Your grandmother's treatment presupposes she is **a discontinuous series of selves**, where the current one trumps the dead one.

  The driver is not a principled theory of the self. It is a **heuristics of recoverability** masked by autonomy language. We bind the future self when we think the "old" self can be saved. We free the present self when the "old" self is lost.

  If you want a system that is honest: **Stop claiming these decisions are about respecting the patient's will.** They are about society's judgment on which life is worth living. In your sister's case, society judges the "stable life" as worth saving, even by force. In your grandmother's case, society judges the "happy conscious existence" as worth saving, even against prior instructions. Both are paternalistic. Only one admits it.
