          *   *Identity:* Radical discontinuity. The stroke created a "new" person who doesn't share the old values.
          *   *Autonomy:* Current Interests rule. You can't bind a stranger.
          *   *Critique:* Why is this different from the psychiatric case? Both involve cognitive change.

      *   **The Inconsistency (The "Squeamishness" Hypothesis):**
          *   Why the switch?
          *   *Harm Principle:* Restraining a psychiatric patient is seen as "medical necessity" to prevent harm (to self/others). Withholding food from a happy dementia patient is seen as "killing" a harmless person.
          *   *Recoverability:* Psychosis is often treated as temporary/reversible. Dementia/Stroke damage is often permanent. We bind the future self in Case 1 because we expect the "real" self to return. In Case 2, the "real" self isn't coming back.
          *   *Visceral Reaction:* Starvation feels like violence. Restraint feels like therapy (in the medical gaze).

      *   **Mapping Theories to Practices:**
          *   *Lockean/Psychological Continuity:* If the psychosis breaks memory/reasoning, continuity is broken. If dementia breaks it, continuity is broken. So a strict Lockean might say *neither* directive binds (if the person is gone) or *both* bind (if the body is the same). The current practice splits them, so strict Lockeanism doesn't fit the practice perfectly.
          *   *Dworkin's Precedent Autonomy:* Supports the Sister. Critical interests (values) trump experiential interests (pleasure). Fails the Grandmother.
          *   *Dresser's Current Interest View:* Supports the Grandmother. You can't harm someone who doesn't understand death. Fails the Sister.
          *   *Conclusion:* The practice is eclectic/pragmatic, not theoretically pure.

      *   **Addressing the "Informed Consent" Problem:**
