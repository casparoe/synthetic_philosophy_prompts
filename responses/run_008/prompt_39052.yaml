answer: |-
  ## Part 1: The Mathematical Landscape (Settled vs. Contested)

  Before implementing the procedure, your syndicate must agree on what the math actually says. There is significant mythology surrounding Kelly.

  ### Settled Mathematics
  1.  **Optimality Condition:** Full Kelly maximizes the expected logarithmic growth rate of the bankroll. Over an infinite horizon with *perfectly known* probabilities, no other strategy will accumulate more wealth.
  2.  **Overbetting Danger:** Betting more than Full Kelly reduces growth and increases volatility. Betting double Full Kelly reduces expected growth to zero; betting more guarantees eventual ruin.
  3.  **Volatility Scaling:** Variance scales with the square of the fraction bet. Betting half-Kelly reduces volatility to 25% of Full Kelly, while retaining approximately 75% of the long-term growth rate.

  ### Genuinely Contested / Context-Dependent
  1.  **The Source of Fractional Kelly:**
      *   *View A (Utility):* Fractional Kelly is purely a concession to risk aversion. You are sacrificing growth to sleep better.
      *   *View B (Estimation Error):* Fractional Kelly is a mathematical necessity because your edge estimates are noisy. If your model says you have a 10% edge but you are wrong 40% of the time, Full Kelly on the *estimated* edge is effectively overbetting on the *true* edge.
      *   *Consensus:* In practice, it is both. For a syndicate with noisy models, View B is the stronger justification for risk management.
  2.  **Definition of Bankroll:** Should "bankroll" include your future income (human capital)?
      *   If you treat your bankroll as your *only* wealth, Full Kelly is extremely aggressive.
      *   If you treat it as "risk capital" separate from income (as you described), you can afford higher volatility, but you lose the mathematical safety net of replenishment.
  3.  **Correlation Handling:** There is no single "Kelly formula" for correlated bets. Adjusting for correlation requires estimating covariance matrices, which are themselves noisy estimates. Any correlation adjustment is a heuristic.

  ---

  ## Part 2: The Syndicate Staking Protocol

  This procedure is designed to minimize debate. It prioritizes syndicate longevity over maximum theoretical growth.

  ### 1. Input Standardization
  Before any calculation, every bet must be logged with two numbers:
  *   **$O$:** Decimal Odds (e.g., 2.00 for even money).
  *   **$P_{model}$:** The syndicate's consensus probability (0 to 1).
      *   *Rule:* $P_{model}$ must be the average of all members' models, or the output of a single agreed-upon model. No "gut feel" adjustments allowed at this stage.

  ### 2. The Kelly Calculation
  Calculate the Full Kelly fraction ($f_{full}$) for each bet individually:
  $$f_{full} = \frac{(P_{model} \times O) - 1}{O - 1}$$
  *If $f_{full} \leq 0$, the bet is discarded.*

  ### 3. The Fractional Adjustment (The "Peacekeeper" Rule)
  **Protocol:** Apply a **1/4 Kelly** multiplier to all individual bets.
  $$f_{stake} = f_{full} \times 0.25$$

  **Reasoning:**
  *   **Noise Mitigation:** Your models are not oracle-grade. A 1/4 fraction creates a massive buffer against overestimating edge. If your model claims a 10% edge but the true edge is 5%, Full Kelly bets you into ruin. 1/4 Kelly keeps you alive.
  *   **Volatility:** 1/4 Kelly reduces the variance of your bankroll curve to roughly 6% of what Full Kelly would produce. For a 5-person group, avoiding emotional drawdowns is more valuable than the marginal growth lost.
  *   **Values Check:** This is the first **Human Decision Point**. You are choosing stability over speed. If the "Full Kelly" proponent cannot accept 1/4 Kelly, they are prioritizing theoretical maxima over group cohesion.

  ### 4. Correlation and Exposure Caps
  You cannot treat five bets on the same match as five independent risks.

  **A. Single-Event Exposure Cap**
  *   **Rule:** The sum of stakes on all outcomes of a single event (e.g., Moneyline + Total + Player Prop on the same game) cannot exceed **2% of the total bankroll**.
  *   **Procedure:** Calculate individual 1/4 Kelly stakes. Sum them by event. If the sum exceeds 2%, scale all bets on that event down proportionally to meet the cap.

  **B. Slate Exposure Cap**
  *   **Rule:** Total capital at risk on any single weekend slate cannot exceed **15% of the bankroll**.
  *   **Reasoning:** Prevents a "black swan" weekend (e.g., all favorites lose) from crippling the syndicate.

  ### 5. Drawdown and Pause Rules
  *   **Hard Stop:** If the bankroll drops **20%** from its high-water mark, betting pauses immediately.
  *   **Audit:** The syndicate must review the last 100 bets.
      *   If the ROI is significantly negative compared to expected value, the model is broken. Re-estimate $P_{model}$ calibration.
      *   If the ROI matches expectation (bad luck), voting is required to resume. A 3/5 majority is needed to restart.
  *   **Values Check:** This is the second **Human Decision Point**. Mathematically, if the edge is real, a drawdown is a buying opportunity. Pausing is a psychological circuit breaker to prevent "tilt" or loss of confidence. Acknowledge this is about *people*, not probability.

  ---

  ## Part 3: Human Decision Points (Values vs. Probability)

  The procedure above stops where arithmetic ends. You must explicitly acknowledge these three moments where you are making value judgments, not mathematical deductions.

  1.  **Choosing 1/4 Kelly:**
      *   *Math:* Tells you 1/4 Kelly grows slower than 1/2 Kelly.
      *   *Value:* You are deciding that the *pain* of a 30% drawdown outweighs the *gain* of extra compounding. This is a utility function decision. There is no "correct" answer, only what the five of you can tolerate without quitting.
  2.  **The Correlation Cap (2%):**
      *   *Math:* Without a precise covariance matrix, we don't know the true risk of 5 bets on one game.
      *   *Value:* We are arbitrarily deciding that one game should not decide our fate. This is a concentration risk limit, similar to a portfolio manager refusing to put 20% of a fund into one stock, regardless of the "edge."
  3.  **The Drawdown Pause:**
      *   *Math:* Past losses do not influence future independent trials (Gambler's Fallacy). If the edge remains, you should bet through the drawdown.
      *   *Value:* We acknowledge we are humans who lose confidence. We prioritize the survival of the syndicate entity over the theoretical optimality of the betting curve.

  ---

  ## Part 4: Case Study Applications

  ### Case 1: The "Unicorn" NFL Moneyline
  **Scenario:** Your model identifies a massive outlier.
  *   **Market:** Team A is -110 (Decimal 1.909). Implied Prob: 52.4%.
  *   **Model:** Syndicate consensus $P_{model}$ = 64.4% (A 12 percentage point probability edge, resulting in ~23% ROI).
  *   **Bankroll:** $100,000.

  **Step 1: Full Kelly Calculation**
  $$f_{full} = \frac{(0.644 \times 1.909) - 1}{1.909 - 1} = \frac{1.229 - 1}{0.909} = \frac{0.229}{0.909} \approx 25.2\%$$
  *Full Kelly says bet 25.2% of the bankroll.*

  **Step 2: Fractional Adjustment (1/4 Kelly)**
  $$f_{stake} = 25.2\% \times 0.25 = 6.3\%$$
  *Stake = $6,300.*

  **Step 3: Protocol Intervention (The "Gut Check" Cap)**
  Even at 1/4 Kelly, betting 6.3% on a single NFL game is operationally risky for a small syndicate.
  *   **Rule Addendum:** No single bet may exceed **3% of bankroll**, regardless of Kelly output.
  *   **Reasoning:** A 12% probability edge in NFL markets is statistically suspicious. It is more likely a model error than a market inefficiency. Capping at 3% protects you from "model blowups."

  **Final Decision:** Bet **$3,000 (3%)**.
  *Note to the Full Kelly Proponent:* You are being overruled not because the math is wrong, but because the input (the edge estimate) is distrusted. This is "Bayesian shrinkage" dressed as a rule.

  ### Case 2: The Correlated Slate
  **Scenario:** 8 bets identified for the weekend. 5 of them are on the same Champions League match (e.g., Moneyline, Total Goals, Both Teams to Score, etc.).
  *   **Bankroll:** $100,000.
  *   **Individual 1/4 Kelly Stakes:** Calculated average $1,500 per bet.
  *   **Total Slate Exposure (Uncapped):** $12,000 (12%).

  **Step 1: Single-Event Cap Check**
  *   The 5 bets on the Champions League match sum to: $1,500 \times 5 = $7,500 (7.5%).
  *   **Protocol Limit:** 2% of bankroll ($2,000) per event.
  *   **Adjustment:** The 5 bets must be scaled down to fit $2,000 total.
      *   New stake per bet on this match: $400 each.
      *   Reduction: $3,500 removed from risk.

  **Step 2: Slate Cap Check**
  *   Remaining 3 bets (uncorrelated): $1,500 \times 3 = $4,500.
  *   Adjusted Match Bets: $2,000.
  *   Total Slate Exposure: $6,500 (6.5%).
  *   **Protocol Limit:** 15% of bankroll ($15,000).
  *   **Result:** Passes.

  **Final Decision:**
  *   Bet the 3 uncorrelated games at full calculated 1/4 Kelly ($1,500 each).
  *   Bet the 5 correlated game propositions at reduced size ($400 each).
  *   **Total Risk:** $6,500.

  *Note to the Risk Averse Proponent:* You wanted to avoid concentration risk. The protocol forced the 5 bets on one game to be treated as a single large exposure, drastically cutting the size. You are protected from a single referee decision ruining the weekend.

  ---

  ## Part 5: Implementation Advice

  To stop the litigation, you must treat this protocol as a **governance document**, not a suggestion.

  1.  **Sign-off:** All five members sign the protocol. Changing the fractional Kelly (e.g., moving from 1/4 to 1/2) requires a unanimous vote, not a majority. This prevents the "Full Kelly" proponent from lobbying for incremental increases during winning streaks.
  2.  **Blind Execution:** The person executing the bets should not know the dollar amount until after the calculation is run. This prevents "I feel good about this one" syndrome.
  3.  **Quarterly Review:** The only time the parameters (1/4 Kelly, 2% cap, 20% drawdown) can be discussed is during a quarterly review, not before a weekend slate.

  **Final Truth:**
  Your "Full Kelly" proponent is mathematically right about the long-run limit but practically wrong about the input quality. Your "Risk Averse" proponent is emotionally right about the pain of variance but practically wrong about leaving too much money on the table.

  This 1/4 Kelly protocol with hard caps is the compromise: It admits the model is noisy (justifying fractional Kelly) and admits the humans are fragile (justifying exposure caps). It will tell you to bet less than your gut wants in Case 1, and it will tell you to bet more than your fear wants in Case 2. That is the point of a system.
