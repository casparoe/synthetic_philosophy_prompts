prompt: |-
  I manage risk for a five-person sports-betting syndicate. We bet mostly moneylines and totals, a few hundred bets a year, and our bankroll is real but small relative to our members' incomes — losing it all would hurt, but it wouldn't end anyone. The same argument keeps breaking out: one of us insists we should bet full Kelly, since it provably maximizes the long-run growth rate of the bankroll and anything less leaves money on the table; another says full Kelly is reckless, since even a modest edge has you risking a large slice of the bankroll on a single game, and a normal cold streak would be unbearable. I want to stop litigating this bet by bet.

  Write us a staking procedure we can actually run before each weekend's slate: how to go from our estimated edge and the posted odds to a stake; what fraction of full Kelly to bet and the reasoning behind that fraction; how to handle correlated bets on the same slate (two bets on the same match, several legs of the same parlay, five bets on the same tournament winner); a cap on aggregate exposure; and rules for when to pause and re-estimate after a drawdown. Be honest about where the procedure is judgment dressed up as arithmetic — in particular, how much of a fractional-Kelly choice is genuinely a response to our edge estimates being noisy, versus just not wanting to feel the variance. Mark the points where the procedure has to stop and hand the decision to a human, because the remaining question is one of values rather than probability. Then run it on two cases: a bet where our model claims an unusually large edge (say, 12% on an NFL moneyline in a market we normally price within a point or two of consensus), and a slate of eight bets of which five are on the same match. I suspect the procedure will sometimes tell us to bet less than our gut wants; that's fine, I'd rather know.

  Finally, please separate what is settled mathematics in the Kelly framework from what is genuinely contested among people who know the topic — especially whether betting below full Kelly is a rational adjustment for estimation error or merely a psychological comfort — and don't present either side of that as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested staking procedure:

  1.  **Analyze the Request:**
      *   **User:** Risk manager for a 5-person sports-betting syndicate.
      *   **Context:** Small bankroll relative to income (loss hurts but isn't fatal), few hundred bets/year, moneylines/totals.
      *   **Conflict:** "Full Kelly" proponent (max growth) vs. "Risk Averse" proponent (volatility/drawdown fear).
      *   **Goal:** A concrete staking procedure to stop bet-by-bet arguments.
      *   **Requirements:**
          *   Calculate stake from edge/odds.
          *   Specify fractional Kelly level + reasoning.
          *   Handle correlated bets (same match, parlays, tournament winners).
          *   Cap aggregate exposure.
          *   Drawdown pause/re-estimate rules.
          *   Acknowledge where judgment overrides arithmetic (values vs. probability).
          *   Distinguish settled math from contested theory (estimation error vs. psychology).
          *   Run two case studies (12% NFL edge, 8 bets/5 same match).
      *   **Tone:** Honest, pragmatic, mathematically rigorous but acknowledging limitations.

  2.  **Deconstruct the Kelly Criterion Debate:**
      *   *Settled Math:* Full Kelly maximizes expected logarithmic utility (long-term geometric growth rate). It minimizes time to reach a target wealth *if* probabilities are known perfectly.
      *   *Contested/ Nuanced:* Real-world probabilities are *never* known perfectly. Overestimating edge leads to ruin faster than underestimating. "Fractional Kelly" is standard practice. Is it for risk aversion (utility function) or error mitigation (Bayesian uncertainty)? Most experts agree it's a mix.
      *   *Syndicate Context:* 5 people means 5 utility functions. Consensus is needed. "Small bankroll relative to income" suggests they can afford more risk than a pro living off it, but "losing it all would hurt" implies risk aversion.

  3.  **Drafting the Staking Procedure (The "Protocol"):**
      *   *Step 1: Edge Estimation.* Need a standardized way to get $p_{model}$ vs $p_{implied}$.
      *   *Step 2: Kelly Calculation.* Formula: $f^* = \frac{bp - q}{b}$.
      *   *Step 3: Fractional Kelly.* What fraction? 1/4 or 1/2 is standard. Given the "small bankroll" but "hurt if lost" dynamic, 1/4 Kelly is safer for group cohesion. It reduces volatility by 75% while keeping 50% of the growth rate (roughly).
      *   *Step 4: Correlation.* This is crucial. Can't bet full Kelly on 5 sides of the same game. Need a "Correlation Discount" or "Exposure Cap."
      *   *Step 5: Aggregate Cap.* Max % of bankroll at risk at one time.
      *   *Step 6: Drawdown Rules.* When to stop and check the model.

  4.  **Addressing the "Judgment vs. Arithmetic" Requirement:**
      *   Must explicitly state that choosing the fraction (1/4 vs 1/2) is a *utility* decision, not a math truth.
      *   Must state that correlation adjustments are heuristic (no perfect formula without a covariance matrix).
      *   Must state that "pausing" is a psychological/operational rule, not a probabilistic one (gambler's fallacy risk).

  5.  **Developing the Case Studies:**
      *   *Case 1: 12% Edge NFL Moneyline.*
          *   Odds: Say -110 (standard).
          *   Implied Prob: 52.38%.
          *   Model Prob: 52.38% + 12%? No, edge is usually ROI. Let's assume Edge = (Model Prob * Payout) - 1. Or simpler: Model says 60%, Market says 52.4%.
          *   Let's use standard Kelly formula.
          *   Apply Fractional Kelly.
      *   *Case 2: 8 Bets, 5 on Same Match.*
          *   Need to show how correlation caps the total exposure on that match.
          *   Sum of individual stakes vs. Cap.

  6.  **Refining the "Settled vs. Contested" Section:**
      *   *Settled:* Log utility maximization, formula derivation, overbetting leads to ruin.
      *   *Contested:* Optimal fraction (depends on error distribution), whether to treat bankroll as total wealth or gambling budget, handling of model uncertainty (Bayesian vs. Frequentist).

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* Make sure to define "Edge" clearly. Is it win probability difference or ROI? In betting, "edge" usually means expected return. $Edge = (p \times odds) - 1$. Kelly formula uses probability and odds. I need to be precise.
      *   *Correction on Correlation:* A simple sum cap is easier than a covariance matrix for a 5-person syndicate. Let's implement a "Single Event Exposure Limit."
      *   *Tone Check:* Ensure I'm not taking sides on the Full vs. Fractional Kelly debate but explaining *why* the procedure chooses one (group stability).
      *   *Values vs. Probability:* Explicitly mark the "Human Decision Points."

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the conflict.
      *   **Part 1: The Mathematics (Settled vs. Contested).** Set the stage.
      *   **Part 2: The Syndicate Staking Protocol.** The actionable rules.
      *   **Part 3: Human Decision Points.** Where math stops.
      *   **Part 4: Case Studies.** Applying the protocol.
      *   **Conclusion:** Final advice on governance.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Kelly Formula:* $f = (p(b+1) - 1) / b$ where $b$ is decimal odds - 1. Or simpler: $f = (p \times d - 1) / (d - 1)$. Let's use decimal odds for clarity.
      *   *Fraction:* Recommend 1/4 Kelly. Why? Variance is reduced by $1/4^2 = 1/16$? No, variance scales with square of fraction. Growth scales linearly (near peak). 1/2 Kelly gives 75% growth at 50% variance. 1/4 Kelly gives 50% growth at ~6% variance. For a group, stability > max growth.
      *   *Correlation:* If 5 bets on one game, treat them as one "super bet" or cap total % on that game to, say, 2x single bet limit.
