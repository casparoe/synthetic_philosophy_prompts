  # The Truth Locator: A Decision Tree
  **Instructions:** Don't worry about the philosophical labels yet. Answer the questions based on your gut reaction to the cases. Follow the arrows to find your position.

  ### START: The "Long Report" Case
  **Imagine a friend says, "Everything in this 100-page report is true." You agree.**
  **To say this, did you just use "true" as a shortcut to avoid listing 100 sentences, or does "true" name a real feature those sentences share?**

  *   **A. Just a shortcut.** "True" is a logical tool for endorsing things without repeating them. It doesn't name a property.  
      → **Go to Leaf 1 (Redundancy)**
  *   **B. A real feature.** Even if it's lightweight, "true" picks out something the sentences *have*.  
      → **Go to Question 2**

  ---

  ### QUESTION 2: The "Successful Navigator" Case
  **A hiker survives the woods because her beliefs are mostly true. Does the *truth* of her beliefs explain her survival, or is that just a fancy way of saying "her beliefs matched the world"?**

  *   **A. Just a restatement.** Truth itself explains nothing; it's just a logical label. (You are still Deflationary).  
      → **Go to Question 3 (Deflationary Split)**
  *   **B. A genuine explanation.** Truth is a substantive property that *does* work (like weight or shape). (You are Substantive).  
      → **Go to Question 4 (Substantive Split)**

  ---

  ### QUESTION 3: The "Silent Dog" Case (Deflationary Path)
  **A dog believes the bone is in the bush. The dog can't speak sentences. Can the dog's belief be "true"?**

  *   **A. No.** "True" only applies to linguistic sentences (like "The bone is here").  
      → **Go to Leaf 2 (Disquotational)**
  *   **B. Yes.** "True" applies to thoughts, maps, or mental states, not just spoken sentences.  
      → **Go to Leaf 3 (Minimalism/Prosentential)**

  ---

  ### QUESTION 4: The "Nature of the Feature" Case (Substantive Path)
  **If truth is a real feature that explains success, what *is* it?**

  *   **A. Matching Reality.** A belief is true if it lines up with the external world, like a map matching a territory.  
      → **Go to Leaf 4 (Correspondence)**
  *   **B. Fitting Together.** A belief is true if it fits consistently with your other beliefs.  
      → **Go to Leaf 5 (Coherence)**
  *   **C. Practical Success.** A belief is true if holding it helps you navigate life effectively.  
      → **Go to Leaf 6 (Pragmatic)**

  ---

  ### THE LEAVES: Your Position

  | Leaf | Position | One-Sentence Gloss |
  | :--- | :--- | :--- |
  | **1** | **Redundancy Theory** | Saying "It is true that P" adds nothing; it just means "P". |
  | **2** | **Disquotationalism** | "True" is a logical device for un-quoting sentences, not a property of the world. |
  | **3** | **Minimalism / Prosentential** | Truth is a lightweight logical property of propositions, not just sentences. |
  | **4** | **Correspondence Theory** | Truth is a substantive relation of matching between language and reality. |
  | **5** | **Coherence Theory** | Truth is a substantive property of internal consistency within a belief system. |
  | **6** | **Pragmatic Theory** | Truth is a substantive property defined by the practical utility of a belief. |

  ---

  ### ⚠️ TEACHER'S GAP WARNING
  **Coherence vs. Pragmatic (Leaves 5 & 6):** This tree treats these as distinct, but in practice, they often blur. If a consistent belief system *works*, is it true because it's consistent, or because it works? If you found yourself torn between B and C in Question 4, you aren't confused—you've found a genuine philosophical boundary dispute.

  ### 💀 BONUS: The "Liar" Detour
  **If you landed on Leaf 2 (Disquotational), consider this sentence: "This sentence is not true."**
  If "true" is just a logical device for sentences, this sentence should be easy to process. Instead, it creates a paradox (if it's true, it's false; if false, it's true). If this keeps you up at night, you might need to move to **Leaf 3 (Minimalism)** (which allows truth to apply to non-sentential propositions) or admit that *no* theory handles this perfectly yet.
