answer: |-
  You are not improvising. Your gut verdicts track a very specific, well-trodden debate in contemporary metaphysics regarding **dispositions** (also called powers, capacities, or propensities).

  Your tentative principle is known as the **Simple Conditional Analysis (SCA)**. It was the standard view for much of the 20th century (championed by Ryle and early Carnap), but it was effectively demolished in the 1990s, largely by C.B. Martin and David Lewis. Your list of cases intuitively identifies exactly where the SCA breaks.

  Here is the breakdown of the principle you need, how it handles your cases, where the metaphysics is settled versus fought over, and the predictions for your new cases.

  ### 1. The Failure of the Simple Conditional Analysis
  Your tentative principle was: *$x$ is disposed to $M$ in $C$ iff, were $x$ in $C$, $x$ would $M$.*

  Let's test this against your first three cases:
  *   **The Glass:** If struck (through the wrap), it would *not* break. SCA says: **Not Fragile.** Your verdict: **Fragile.**
  *   **The Matches:** If struck (while wet), they would *not* light. SCA says: **Not Flammable.** Your verdict: **Flammable.**
  *   **The Viper:** If it bites (through the glass), the prey would *not* die. SCA says: **Not Venomous.** Your verdict: **Venomous.**

  In all three cases, the SCA fails because it conflates the *possession* of a power with the *successful manifestation* of that power. In the literature, the bubble wrap, the water, and the glass cage are called **Masks**. A mask is an interfering factor that prevents the manifestation without removing the underlying disposition.

  ### 2. The Repaired Principle: The Causal Basis Account
  To save the conditional analysis, David Lewis proposed a "Reformed Conditional Analysis." The core idea is that dispositions must be grounded in the object's **intrinsic properties**.

  **The Principle:**
  > $x$ has the disposition to $M$ in response to $C$ if and only if $x$ possesses an **intrinsic causal basis** $B$ such that, if $x$ were in $C$ (and no masks or finks interfered), $B$ would cause $x$ to $M$.

  This repairs the SCA by adding two crucial filters:
  1.  **Intrinsic Basis:** The power must come from *inside* the object, not its environment.
  2.  **Ceteris Paribus (All else being equal):** We assume no external interferers (masks) stop the process.

  ### 3. Testing the Principle Against Your Verdicts

  Here is how the Causal Basis Account handles your list, and where it forces you to refine your intuition.

  **1. Bubble Wrap Glass (Fragile)**
  *   **Analysis:** The glass has an intrinsic molecular structure (basis) that shatters under stress. The bubble wrap is *extrinsic*.
  *   **Verdict:** **Matches your intuition.** The mask doesn't remove the basis.

  **2. Wet Matches (Flammable)**
  *   **Analysis:** This is the first point of friction. Water is extrinsic, but it permeates the match. Does the water destroy the *intrinsic* chemical basis, or just mask it?
  *   **Metaphysical Flag:** **Contested.** Some philosophers argue a wet match literally lacks the basis for combustion until dry (the chemical reaction requires dry cellulose). Others (aligning with you) argue the flammable material is still there, just inhibited.
  *   **Prediction:** The Causal Basis account *can* support your verdict if we define the basis as the chemical composition of the wood/sulfur, which remains even when wet.

  **3. Caged Viper (Venomous)**
  *   **Analysis:** Venom is an intrinsic biological property. The cage is extrinsic.
  *   **Verdict:** **Matches your intuition.**

  **4. Redundant Bridge (Not Fragile)**
  *   **Analysis:** You verdicted this as *not* fragile. This is subtle. If the *bridge system* is the object, its intrinsic structure includes the redundancy. The basis for "collapsing under load" is absent because the engineering distributes the load.
  *   **Verdict:** **Matches your intuition.** This distinguishes the bridge from the glass. The glass's structure *guarantees* breakage under sufficient force; the bridge's structure *guarantees* stability. The bridge isn't masked; it's just built differently.

  **5. Trained Uncle (Not Hot-Tempered)**
  *   **Analysis:** Here is the resolution to your worry about the Glass vs. Uncle structural similarity.
      *   **Glass:** Interference is **Extrinsic** (bubble wrap). Basis remains. Disposition remains.
      *   **Uncle:** Interference is **Intrinsic** (neural rewiring/training). The "hot temper" basis (impulsive neural pathways) has been replaced by a "calm response" basis.
  *   **Verdict:** **Matches your intuition.** The principle explains *why* they differ: one is a mask, the other is a removal of the basis.

  **6. Neutralized Poison (Deadly?)**
  *   **Analysis:** The poison has a toxic chemical basis. The antidote is an extrinsic mask (like the bubble wrap).
  *   **Verdict:** The principle predicts **Deadly**. Even if it can't kill *this* victim, the disposition is grounded in the poison's chemistry. Your flip-flop is natural, but the metaphysical consensus leans toward "still deadly" because the *capacity* is intrinsic to the toxin, even if the *outcome* is blocked.

  **7. Disloyal Friend (Disloyal)**
  *   **Analysis:** The friend has an intrinsic psychological state (greed > loyalty). The lack of offer is just the absence of the stimulus condition ($C$), not a mask.
  *   **Verdict:** **Matches your intuition.**

  ### 4. Predictions for Your New Cases

  **Case A: The Conditional Antidote**
  *   *Scenario:* A poison whose victim would take the antidote *only if* she learned she'd been poisoned.
  *   *Analysis:* This introduces a **Fink**. A "fink" is where the disposition is lost (or the counter-acting measure appears) *in response to the stimulus itself*.
  *   *Prediction:* **Still Deadly.**
      *   Why? The poison's intrinsic basis is to kill. The antidote mechanism is extrinsic to the poison. Even if the antidote is triggered by the poisoning event, the poison itself retains its toxic nature.
      *   *Nuance:* If the antidote is *inside* the victim's body automatically neutralizing it the moment the poison touches blood (a biological immunity), some philosophers would argue the poison is not deadly *for that organism*. But generally, dispositions are judged by the object's nature, not the specific target's defenses. The poison is deadly; the victim is immune.

  **Case B: The Fragile Sticker**
  *   *Scenario:* A sticker on the glass makes everyone handle it gently.
  *   *Analysis:* This is **Stimulus Prevention**, not Masking.
      *   A *Mask* lets the stimulus happen (striking the glass) but stops the result (breaking).
      *   The *Sticker* stops the stimulus (striking) from happening at all.
  *   *Prediction:* **Still Fragile.**
      *   Why? The conditional analysis asks: "If it *were* struck, would it break?" The sticker changes the likelihood of it being struck, but it does not change the causal link between *being struck* and *breaking*. If you ignore the sticker and strike it, it breaks. The intrinsic basis is untouched.

  ### 5. Where the Metaphysics is Settled vs. Fought Over

  You asked to flag the consensus versus the debate. Here is the map:

  **1. The Failure of the Simple Conditional (Settled)**
  *   **Consensus:** Almost no one defends the Simple Conditional Analysis anymore. Everyone agrees that masks (bubble wrap) and finks (magic wires that lose conductivity when touched) break the simple "If C then M" rule.
  *   **Your Status:** You are on solid ground rejecting the simple conditional.

  **2. Intrinsic vs. Extrinsic Dispositions (Fought Over)**
  *   **Consensus:** Most agree dispositions need a "causal basis."
  *   **Debate:** Must that basis be *intrinsic*?
      *   *Lewisian View:* Yes. A key's ability to open a lock is not a disposition of the key alone, but the key-lock system.
      *   *Minority Report:* Some argue for extrinsic dispositions. They might say the Viper is only venomous *relative to* prey that can be bitten.
      *   **Impact on you:** Your intuition that the Viper is venomous despite the cage relies on the Intrinsic view. If you meet a philosopher who believes dispositions are purely relational, they might argue the caged viper is currently "non-venomous" because the relation is broken.

  **3. Dispositions as Real vs. Reduced (Fought Over)**
  *   **The Categoricalist View (Lewis):** Dispositions are just shorthand for physical structures + conditionals. The glass is fragile *because* of its molecular structure.
  *   **Dispositional Essentialism (Bird, Mumford):** Dispositions are fundamental features of reality. The molecular structure exists *because* the glass has the power of fragility.
  *   **Impact on you:** This doesn't change your verdicts, but it changes *why* they are true. Your list works for both, but the "Causal Basis" language leans slightly toward the Categoricalist (Lewisian) side.

  **4. The Wet Match (Genuinely Gray)**
  *   **Debate:** Does water *mask* flammability or *remove* the basis?
  *   **Impact on you:** This is the one case where your gut might be fighting chemistry. If "flammability" requires the immediate capacity to oxidize, water removes it. If "flammability" means "made of stuff that oxidizes," water masks it. Both views have defenders.

  ### Summary of the Principle
  To systematize your gut verdicts, adopt this **Reformed Conditional Principle**:

  > An object $x$ has a disposition $D$ iff $x$ has an **intrinsic property** $B$ such that, if $x$ undergoes stimulus $S$ **and** no extrinsic masks interfere, $B$ would cause manifestation $M$.

  *   **Glass/Uncle Distinction:** Resolved by Intrinsic (Uncle changed) vs. Extrinsic (Glass wrapped).
  *   **Bridge:** Resolved by identifying the correct bearer of the property (The System, not the Beam).
  *   **New Cases:** Both retain their dispositions (Poison is deadly, Sticker-glass is fragile) because the intrinsic bases remain intact.

  You aren't improvising; you're doing applied metaphysics. Your intuitions align with the post-1990s consensus that dispositions are real, intrinsic properties that can be masked but not erased by external circumstances.
