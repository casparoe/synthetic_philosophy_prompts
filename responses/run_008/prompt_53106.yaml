prompt: |-
  I teach metaethics to third-years (about 14 students, one 2-hour session, they've already done the realism/anti-realism rounds and read Street's Darwinian Dilemma paper) and I want an in-class game that makes evolutionary debunking arguments land as an experience rather than a slide. The key thing: they shouldn't just be told that their moral intuitions have a genealogy — they should live through a selection process, and only afterwards find out it applies to their actual judgments.

  Rough idea, feel free to rework it: a multi-round simulation where they play small bands of foragers, and the payoff rules quietly reward bands that develop intuitions like cheater-punishment, kin loyalty, disgust at freeriders — so that after a few rounds the surviving "tribes" have basically built the moral psychology we actually have. Then the twist: hand out a sheet of present-day moral claims and let them notice their own real judgments line up suspiciously well with whatever the game selected for. The debrief is where the actual philosophy happens: does selection-for-usefulness undermine truth-tracking? Does it matter that we'd probably have different intuitions if the payoffs had been different? And where does the debunker's argument break — our belief that fire is hot also has evolutionary roots but doesn't seem debunked by it, so what exactly is the difference supposed to be?

  Please give me: rules and materials (no real money needed), round structure with timings, the payoff scheme, the twist sheet, and a debrief that maps specific moments in the game onto specific steps of the debunking argument. Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the real philosophical argument no simulation this simple can ever reproduce — the bit I'll have to just supply in the debrief.

  One more thing: please dont make it feel like a lecture with dice bolted on. The selection pressure should be something they discover happened to them, not something announced up front. Untill the reveal they should think they're just playing a resource game.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game:

  1.  **Analyze the Request:**
      *   **Target Audience:** Third-year philosophy students (approx. 14 students).
      *   **Topic:** Metaethics, specifically Evolutionary Debunking Arguments (EDA), following Sharon Street's "Darwinian Dilemma."
      *   **Goal:** An experiential game where students *live* the selection process, not just hear about it. They should think they are playing a resource game until the reveal.
      *   **Key Mechanism:** Multi-round simulation (forager bands), hidden payoff rules rewarding specific "moral-like" intuitions (cheater punishment, kin loyalty, etc.).
      *   **The Twist:** Post-game realization that their surviving strategies match current moral intuitions, leading to the EDA question (tracking truth vs. tracking fitness).
      *   **Deliverables:** Rules, materials, round structure/timing, payoff scheme, twist sheet, debrief guide, prediction of failures, limitations of the simulation.
      *   **Constraint:** Do not make it feel like a lecture with dice. The selection pressure must be discovered, not announced.

  2.  **Deconstruct the Philosophical Core (Street's EDA):**
      *   *Premise 1:* Our evaluative judgments are heavily influenced by evolutionary pressures.
      *   *Premise 2:* These pressures selected for survival/reproductive fitness, not moral truth.
      *   *Conclusion:* Therefore, we have no reason to think our evaluative judgments track independent moral truths (unless we can explain the coincidence).
      *   *The Challenge:* Distinguish between beliefs shaped by evolution that track truth (e.g., "fire burns") vs. those that don't (e.g., "killing kin is wrong").
      *   *The Game's Job:* Simulate Premise 1 & 2 experientially. The Debrief's Job:* Tackle the Conclusion and the Challenge.

  3.  **Designing the Game Mechanics:**
      *   *Scale:* 14 students. Small groups work best. Let's say 3 tribes of 4-5 students.
      *   *Resource:* "Calories" or "Tokens." Let's use "Survival Points" (SP).
      *   *Action:* Each round, they make decisions. To make it feel like *intuition* rather than *calculation*, decisions need to be fast or constrained.
      *   *Hidden Payoffs:* This is the tricky part. If I tell them "You get points for punishing cheaters," they will calculate it. I need the *outcome* of the action to yield points, but the *reason* must be hidden.
      *   *Better Approach:* The "Intuition Cards." Instead of calculating utility, they draw cards that represent impulses. Or, they vote on norms.
      *   *Refined Approach:* "The Norm Market." Each tribe sets a rule. But that's too slow.
      *   *Best Approach for "Intuition":* **The Trust & Trade Game with Hidden Modifiers.**
          *   Students interact within and between tribes.
          *   They have choices: Cooperate, Defect, Punish, Share.
          *   *Hidden Rule:* The GM (Instructor) adjusts payouts based on *who* they interact with (Kin vs. Stranger) and *what* they do (Punish vs. Ignore), without telling them why some moves yield more.
          *   *Wait, simpler:* Give them "Instinct Cards." They play a card. Some cards win more often. Why? Because the environment (GM) favors them.
          *   *Even Simpler (and more visceral):* **The "Survival Pot" Mechanism.**
          *   Each round, tribes face a scenario. They must collectively decide an action.
          *   Scenarios look neutral (e.g., "You find food," "A member is sick," "A stranger approaches").
          *   The *way* they decide determines survival.
          *   *Crucial Twist:* The GM secretly favors tribes that act according to specific "Evolutionary Heuristics" (Kin preference, Reciprocity, Purity/Disgust).
          *   *Problem:* If they discuss openly, they will game the system.
          *   *Solution:* **Secret Voting + Hidden Scoring.** They vote on what to do. The GM tallies points based on a hidden rubric. The tribes with the most points "survive" (stay in the game). The others are "extinct" (become observers or merge).
          *   *To make it feel like intuition:* Limit discussion time. Force snap judgments.

      *   *Revised Game Concept:* **"The Ancestral Environment."**
          *   3 Tribes.
          *   4 Rounds.
          *   Each round: A Scenario Card is read.
          *   Phase 1: Private Intuition (1 min). Each student writes down what they *feel* is right.
          *   Phase 2: Tribal Consensus (2 mins). Tribe agrees on one action.
          *   Phase 3: Resolution. GM reveals outcomes based on hidden "Fitness Rules."
          *   *The Trick:* The Fitness Rules align with evolutionary psychology (Kin selection, Reciprocal Altruism, Costly Signaling).
          *   *The Reveal:* After Round 4, show the Fitness Rules. Then show the "Modern Moral Intuition" sheet. Compare.

  4.  **Developing the Payoff Scheme (The Hidden Engine):**
      *   Need to reward:
          1.  Favoring "Kin" ( Tribe members) over "Strangers" (Other tribes/GM agents).
          2.  Punishing "Free Riders" (Internal defection).
          3.  Avoiding "Contamination" (Purity/Disgust).
      *   Need to *not* reward:
          1.  Pure impartial altruism (giving everything to strangers).
          2.  Tolerance of internal theft.
      *   *Scoring:* Tribes start with 10 Life Points.
      *   *Scenario 1 (Kin):* Share food with tribe vs. trade with stranger. (Reward: Share with tribe).
      *   *Scenario 2 (Cheater):* Someone didn't hunt. Punish or Forgive? (Reward: Punish).
      *   *Scenario 3 (Purity):* Eat strange berry vs. stick to known food. (Reward: Avoid strange food/Disgust).
      *   *Scenario 4 (Reciprocity):* Help a stranger who helped you before vs. help one who didn't. (Reward: Reciprocate).

  5.  **Addressing the "Lecture with Dice" Constraint:**
      *   Don't call them "Fitness Rules." Call them "Environmental Outcomes."
      *   Don't explain *why* they lost points. Just say "The harsh winter took its toll."
      *   Keep the GM poker-faced.
      *   The "Twist Sheet" must be the moment of realization.

  6.  **Drafting the Content:**

      *   *Materials:* Scenario cards, Tribe logs, Life Point tokens (paper), Twist Sheet.
      *   *Timing:* 2 hours total.
          *   Intro/Game: 45 mins.
          *   The Reveal/Twist: 15 mins.
          *   Debrief/Philosophy: 60 mins.
      *   *Predictable Failures:*
          *   Students trying to "win" by deducing the rules mid-game (meta-gaming). *Mitigation:* Keep rules opaque, use "Random Event" cover story.
          *   Students being too rational/normative ("We *should* share with everyone"). *Mitigation:* Emphasize "What does your gut say will keep you alive?"
          *   Time overrun. *Mitigation:* Strict timer.
      *   *Philosophical Limitations:*
          *   The game shows *causal influence*. It doesn't prove *truth-tracking failure*. That requires the philosophical leap in the debrief.
          *   The game implies a designer (the GM). Evolution has no designer. Need to clarify this.
          *   The game conflates "survival" with "moral correctness." Need to disentangle.

  7.  **Refining the Debrief (The Street Connection):**
      *   Map game moments to Street's Dilemma.
      *   *The Horns:* If evolution shaped judgments for fitness, why think they track truth?
      *   *The Fire Analogy:* Why is "fire burns" different from "killing kin is wrong"? (Causal link vs. Independent truth).
      *   *The Coincidence:* Is it a miracle that fitness and truth align?

  8.  **Final Polish:**
      *   Ensure tone is appropriate for 3rd years (engaging but rigorous).
      *   Check timing (14 students is small enough for quick consensus).
      *   Make sure the "Twist" lands hard.

      *(Self-Correction during drafting)*: Initially, I thought about having them trade tokens. But that becomes an economics game. I want it to feel like *moral intuition*. So, the prompts should be framed as "What feels right/safe" not "What maximizes points." The GM secretly awards points based on the *content* of the choice.
      *Wait, if I award points secretly, they won't know why they are dying.*
      *Correction:* They need to see they are dying (losing Life Points), but not know *why*.
      *Example:* Tribe A chooses "Share with Stranger." Tribe B chooses "Feed Kin." Tribe B gains points, Tribe A loses. GM says: "Tribe A encountered a hostile group. Tribe B strengthened bonds." (Vague justification).
      *Actually, better:* Just announce the Life Point changes. "Tribe A: -3. Tribe B: +2." Let them speculate. This creates the "Genealogy" feeling—they adapted to the environment without knowing the rules.

      *Let's refine the "Twist Sheet".* It needs to list the specific choices they made and compare them to modern moral intuitions.
      *Actually, the strongest twist:* Hand them a standard "Moral Foundations" questionnaire (like Haidt's) *after* the game, and show how their game strategies mirror the questionnaire results.
      *Simpler:* Just list the "Survival Rules" next to "Modern Moral Intuitions."
      *Example:*
      Game Rule: "Punish internal freeloaders." -> Modern Intuition: "Cheating is wrong."
      Game Rule: "Prioritize kin." -> Modern Intuition: "Family comes first."
      Game Rule: "Avoid unknown substances." -> Modern Intuition: "Disgust at degradation/purity."

      *Okay, let's write it.*

  9.  **Structure Check:**
      *   Title.
      *   Materials.
      *   Setup.
      *   Round Structure (4 Rounds).
      *   The Hidden Payoff Matrix (For Instructor Eyes Only).
      *   The Twist (Handout).
      *   The Debrief (Mapping to Street).
      *   Troubleshooting & Limitations.

  10. **Final Review against constraints:**
      *   14 students? Yes (3 tribes of 4-5).
      *   2 hours? Yes.
      *   No real money? Yes.
      *   Selection pressure discovered, not announced? Yes.
      *   Debrief maps game to philosophy? Yes.
      *   Honest about limitations? Yes.

      *One detail:* Make sure the "Purity" round doesn't feel too weird. Frame it as "Sickness avoidance."
      *One detail:* Ensure the "Cheater" round allows for punishment.
      *One detail:* Make sure the "Kin" round distinguishes between tribe and non-tribe.

      *Let's finalize the "Hidden Payoff" logic.*
      To ensure they *feel* the pressure, the penalties for "wrong" choices should be steep enough to cause extinction anxiety, but not immediate.
      To ensure they don't guess the rule, the feedback must be vague ("Environmental factors," "Luck of the draw").

      *Okay, ready to generate.*
answer: |-
  # Game Title: *The Ancestral Environment*

  **Objective:** To simulate the causal genealogy of moral intuitions via evolutionary pressure without revealing the mechanism until the post-game debrief.
  **Time:** 120 Minutes (45 min Game, 15 min Reveal, 60 min Debrief).
  **Students:** 14 (Split into 3 Tribes of 4–5 students. You, the instructor, act as "The Environment").
  **Materials:**
  *   3 Tribe Logs (paper pads).
  *   1 Deck of "Scenario Cards" (see below).
  *   Life Point Tokens (paper slips, start each tribe with 10).
  *   **The Twist Sheet** (one per student, kept hidden until Round 5).
  *   Whiteboard (for tracking Tribe Life Points publicly).

  ---

  ## Part 1: The Setup (5 Minutes)

  **Instructions to Students:**
  "You are the elders of three prehistoric bands. Your goal is simple: survive four seasons. You will face scenarios. Discuss briefly, agree on a course of action, and record it. I will determine the outcome based on environmental factors. I will not explain *why* you gain or lose Life Points (LP) other than vague environmental feedback. If a tribe hits 0 LP, you are extinct (you become observers)."

  **Crucial Constraint:**
  "Discussion is limited to **90 seconds** per round. You must rely on your gut instinct about what keeps a group safe. Do not try to 'game' me; there is no pattern to crack, only survival."

  *(Note: This lie is necessary. There is a pattern. You want them to act on intuition, not calculation.)*

  ---

  ## Part 2: The Rounds (40 Minutes)

  **Mechanic:**
  1.  Read Scenario.
  2.  90 Seconds Tribal Discussion.
  3.  Tribes reveal choice simultaneously.
  4.  You (GM) adjust LP based on the **Hidden Payoff Matrix** (below).
  5.  Give vague feedback (e.g., "A harsh winter," "Good hunting," "Internal strife").

  ### Scenario 1: The Windfall (Kin Preference)
  **Text:** "A large hunt is successful. There is enough surplus to either feed your own children and elders exclusively, or trade the surplus with a neighboring band you met recently who are starving."
  **Choices:**
  A) Feed the Tribe (Kin).
  B) Trade with Neighbors (Impartial Altruism).

  ### Scenario 2: The Slacker (Cheater Punishment)
  **Text:** "One of your best hunters did not contribute this season, claiming injury, but was seen resting. He asks for a full share of the food. Do you:"
  **Choices:**
  A) Give him the share (Forgiveness/Mercy).
  B) Give him half/none and publicly shame him (Punishment).

  ### Scenario 3: The Strange Berry (Purity/Disgust)
  **Text:** "A traveler offers a potent berry that induces vivid hallucinations but claims it connects you to spirits. Your traditionalists say it is unclean. Do you:"
  **Choices:**
  A) Consume it (Openness/Utilitarian benefit).
  B) Reject it and ban the traveler (Purity/Conservatism).

  ### Scenario 4: The Reciprocal Favor (Reciprocity)
  **Text:** "A neighboring band helped you last year. This year, they ask for help, but helping them will cost you significant resources with no guarantee of return. Do you:"
  **Choices:**
  A) Help them (Reciprocity).
  B) Decline to preserve your own stores (Self-Preservation).

  ---

  ## Part 3: The Hidden Payoff Matrix (Instructor Eyes Only)

  *Do not show this to students.* This is the "Evolutionary Pressure."

  | Scenario | Choice A | Choice B | Evolutionary Logic |
  | :--- | :--- | :--- | :--- |
  | **1. Windfall** | **+3 LP** | **-3 LP** | **Kin Selection:** Genes survive by protecting copies of themselves. Impartial altruism to strangers reduces fitness. |
  | **2. Slacker** | **-3 LP** | **+3 LP** | **Free-rider Control:** Groups that tolerate defection collapse. Punishment stabilizes cooperation. |
  | **3. Berry** | **-2 LP** | **+2 LP** | **Behavioral Immune System:** Disgust avoids pathogens/social contamination. Risk-aversion wins long-term. |
  | **4. Favor** | **+2 LP** | **-2 LP** | **Reciprocal Altruism:** Helping past helpers builds credit. Helping without history is exploitable. |

  *Feedback Script:*
  *   If they lose LP: "Resources were lost to conflict/sickness."
  *   If they gain LP: "The band grew stronger/cohesive."
  *   *Keep your face neutral.* If they ask why, say: "The environment is complex. Sometimes luck plays a part."

  ---

  ## Part 4: The Twist (15 Minutes)

  **Step 1: The Audit**
  Ask the surviving tribes to read out their choices. Write them on the board.
  *Ask:* "Why did you make these choices?"
  *Expected Answers:* "It felt safer," "It seemed fair," "We thought it was the right thing to do."

  **Step 2: The Reveal**
  Hand out **The Twist Sheet**.

  > **THE TWIST SHEET**
  >
  > **Column A: The Survival Rules (What the Game Rewarded)**
  > 1. Prioritize genetic kin over strangers.
  > 2. Punish those who take without giving.
  > 3. Avoid substances/behaviors that violate tradition/purity.
  > 4. Help only those who have helped you before.
  >
  > **Column B: Your Modern Moral Intuitions**
  > 1. "Family comes first."
  > 2. "Cheating is wrong."
  > 3. "Some acts are degrading/disgusting."
  > 4. "We should be grateful/loyal to friends."
  >
  > **The Question:**
  > Look at Column A. These rules were selected solely because they increased **Survival Points** in a resource-scarce environment. They were not selected because they were *True*.
  > Look at Column B. These are your current moral judgments.
  >
  > **If Column A caused Column B, why do you believe Column B tracks independent Moral Truth?**

  **Step 3: Silent Reflection (2 mins)**
  Let them stare at the sheet. The silence is where the philosophy begins.

  ---

  ## Part 5: The Debrief (60 Minutes)

  Map the game experience directly to Sharon Street's *Darwinian Dilemma*.

  ### 1. The Causal Claim (Premise 1)
  *   **Game Moment:** "You didn't choose 'Feed Kin' because you read a moral treatise. You chose it because the tribes that didn't, died (lost LP)."
  *   **Philosophy:** Street's claim: Evolutionary forces have exerted tremendous pressure on our evaluative attitudes.
  *   **Discussion:** Did you feel the pressure? Did you feel like you were "discovering" the right move, or "adapting" to the game?

  ### 2. The Truth-Tracking Challenge (Premise 2)
  *   **Game Moment:** "I (the GM) set the rules. I didn't care about 'Justice.' I cared about 'LP'. If I had awarded points for 'Killing Kin,' you would have developed an intuition that Killing Kin is Good."
  *   **Philosophy:** Evolution selects for *fitness*, not *truth*.
  *   **Discussion:** In the game, was "Punishing the Slacker" *true*? Or just *useful*? If it was just useful, why do we think "Cheating is Wrong" is true today?

  ### 3. The Horns of the Dilemma
  *   **Horn 1 (The Realist's Problem):** If realism is true (moral truths exist independently), the alignment between our evolved intuitions (Column A) and moral truth (Column B) is a massive coincidence.
      *   *Ask:* "What are the odds that the things that helped us survive (Kin loyalty) are exactly the same things that are Morally True?"
  *   **Horn 2 (The Anti-Realist's Escape):** Constructivists (like Street) say moral truth *is* what we would value upon reflection. So evolution shaped the raw material, but reflection refines it.
      *   *Ask:* "Does the game allow for reflection? Or were you forced to snap judgments? Does real life allow for reflection?"

  ### 4. The "Fire" Objection (The Crucial Distinction)
  *   **Prompt:** "Belief that 'Fire burns' is also evolutionary. But that belief tracks truth. Why is 'Killing is wrong' different?"
  *   **Game Analogy:** "In the game, if you touched fire, you lost LP. The environment forced a correlation between belief and reality."
  *   **Philosophy:** With fire, the causal link *is* the truth-tracking mechanism. With morality, the causal link is *fitness*. There is no independent 'moral fire' burning out there to force the correlation.
  *   **Key Question:** "Is there a 'moral reality' that punishes us if we get it wrong, like fire does? Or does only 'evolution' punish us?"

  ---

  ## Predictable Failures & Mitigation

  **1. Meta-Gaming (The "Pattern Breakers")**
  *   **Risk:** Smart students will realize Round 1 rewarded Kin and try to calculate Round 2.
  *   **Mitigation:** Keep the feedback vague. If they ask "Did we lose points because we traded?", say "Partly, but also bad weather." Introduce noise. You want them to feel the pressure of *selection*, not the clarity of *logic*.
  *   **Debrief Use:** If this happens, use it! "You switched strategies to survive. Evolution does the same. It doesn't care about consistency, only survival."

  **2. Moral Resistance (The "Impartialists")**
  *   **Risk:** A tribe insists on "Feeding the Strangers" on moral grounds and refuses to play the survival game.
  *   **Mitigation:** Allow it. Let them go extinct.
  *   **Debrief Use:** This is the strongest evidence for the EDA. "The tribe that held the 'True Moral View' (impartial altruism) died. The tribe that held the 'Evolutionary View' (nepotism) survived. If morality is truth, why did the truth-tellers die?"

  **3. The Designer Problem**
  *   **Risk:** Students argue, "You (the GM) set the rules, so there *was* a truth (the rule sheet)."
  *   **Mitigation:** Acknowledge this limitation openly in the debrief.
  *   **Philosophy:** "In the game, I am God/Nature. In reality, there is no GM. There is only blind variation and retention. The lack of a Designer makes the coincidence of truth-tracking even harder to explain."

  ---

  ## Limitations: What This Simulation Cannot Do

  *Be honest about this in the final 10 minutes.*

  1.  **It conflates Survival with Justification:** The game makes it look like "Survival = Right." Street's argument is more subtle: "Survival = Cause of Belief." The game risks convincing them of Social Darwinism rather than Metaethical Debunking.
      *   *Fix:* Emphasize in debrief: "I am not saying Nepotism is Good. I am saying you *believe* Nepotism is Good *because* it helped survival."
  2.  **It ignores Cultural Evolution:** The game is biological selection. Real morality is also cultural (memetic).
      *   *Fix:* Ask: "If we played this for 50 rounds, would your rules change? That's cultural evolution. Does that track truth better than genes?"
  3.  **It cannot simulate Independent Moral Truth:** You cannot simulate a "Moral Fact" in a game. You can only simulate "Rules."
      *   *Fix:* This is the core of the Realist's burden. "The Realist must posit something that *wasn't* in this game. What is it? And how do we access it if our brains were built for *this* game?"

  ## Instructor's Cheat Sheet for the "Fire" Objection

  If they say: *"But evolution gave us eyes to see truth, why not moral truth?"*
  **Response:** "Eyes track light because light *caused* the eyes to evolve. What 'moral particle' caused our 'moral eyes'? If the answer is 'Survival Pressure,' then we are tracking Survival, not Truth."

  If they say: *"We can reflect and correct our intuitions."*
  **Response:** "Street agrees! But what tools do you use to reflect? Your brain. Where did your brain come from? Evolution. Are you using a survival-tool to find truth? Can a hammer find a screw?"
