  **The Differentiating Factor: The Nature of the Externality**
  The logic is identical, but the *ontology* of the harm differs.
  *   In **A**, the spillover is **physical**. Sound waves and smoke particles physically invade the other roommate's sovereign space. Even if the Charter says "Your bedroom is your sphere," the physics says "Your sphere leaks." Here, the Liberal right feels illegitimate because exercising it physically alters the other person's environment without consent. The Pareto preference ($d \succ a$, Neither > Both) feels like a request for basic bodily integrity (quiet lungs, clear air).
