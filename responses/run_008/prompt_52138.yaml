      *   **Source:** **Weak Pareto.**
      *   **Reasoning:** Roommate 1 prefers $d \succ a$ (Headache/Guilt vs. Clash). Roommate 2 prefers $d \succ a$ (Peace vs. Noise/Challenge). Since both agree, society must agree.
      *   **Social Ranking:** $d \succ a$.

