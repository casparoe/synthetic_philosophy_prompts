answer: |-
  There is no man inside the wingbeat,
  only the air rushing to fill the shape.
  A yellow arc over the river water,
  no memory of a bed, a book, a name.
  To be this light is to shed the heavy,
  forgetting the man who waits to wake.

  Forgetting the man who waited to wake,
  the flower holds no question of its scent.
  The sun is not a theory but a heat,
  the logic of the wing is absolute.
  Until the gray light fractures the dark,
  until the ceiling returns to hold the head.

  Until the ceiling returned to hold the head,
  the room asserts its corners and its dust.
  Steam rises from the mug, a vertical flight,
  the hand is solid, unmistakably a hand.
  And still the pulse argues for the real,
  yet the certainty feels like another dream.

  Yet the certainty felt like another dream,
  for waking has no mark upon its skin.
  The river outside is just as fluent as the air,
  the body fits the morning like a suit.
  Search the mirror for a seam, a join,
  Where does the wing end, or the arm begin?

  Where did the wing end, or the arm begin?
  It is not a riddle requiring an answer.
  The name is a garment put on and off,
  the moth lands on the glass and is still.
  There is no error in the shifting shape,
  there is no fixed point to measure change against.

  No fixed point to measure the change against,
  the river flows through the sleeper and the fly.
  To choose a side is to stall the blood,
  to name the state is to lose the life.
  Let the boundary dissolve like breath on glass,
  There is no man inside the wingbeat.
