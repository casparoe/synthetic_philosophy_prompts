          *   Camp 1 (Compromise): "Split the difference" (Stabilize worst section, defer rest).
          *   Camp 2 (Commit): Pick one engineer, go all in (Repair or Wait).
          *   Camp 3 (Precautionary): Disagreement itself implies risk, side with caution (Engineer A).
          *   **Bias:** Opinions track with proximity to the wall (self-interest).
      *   **Task:** Draft a recommendation memo for the board vote.
      *   **Requirements:**
          *   Concrete bottom line (take a real position).
          *   Reasoning board members can respond to.
