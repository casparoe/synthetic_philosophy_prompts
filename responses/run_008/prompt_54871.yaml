answer: |-
  **TO:** Flatpack Working Group
  **FROM:** Chair, Working Group
  **DATE:** 15 June 2024
  **SUBJECT:** Resolution on Clause 12.4 (Case-Folding) and Spec Authority

  **Decision**
  Effective with Flatpack 1.1, Clause 12.4 will mandate ASCII-only case-folding (A-Z matches a-z). Unicode case-folding (e.g., matching "ß" to "ss") is explicitly out of scope for core parsers. Implementations relying on Unicode folding must treat such fields as distinct unless explicitly opted-in via a future extension mechanism.

  **Migration Path**
  We will not retroactively invalidate existing data. Files created under previous interpretations remain valid. However, compliant 1.1 parsers must reject Unicode-folded collisions that ASCII folding would treat as distinct. Library maintainers have 12 months to update default behaviors. We will publish a reference test suite highlighting edge cases (specifically Latin-1 extensions) within 30 days.

  **Rationale: Stability Over Semantics**
  The primary function of a data format is interoperability, not linguistic precision. Ten years of production use have established ASCII folding as the *de facto* standard. Switching to Unicode folding now would silently merge distinct fields in existing datasets, corrupting scientific records. The cost of breaking backward compatibility outweighs the benefit of semantic correctness. We prioritize the integrity of archived data over theoretical purity.

  **Authority and Interpretation**
  This decision requires us to address a deeper disagreement within the committee: Are we interpreting what the spec *always meant*, or are we legislating new rules?

  Half the group argues that the spec's meaning is fixed by the original author's intent or the text itself. The other half argues that because the text is ambiguous, any decision we make is new legislation. Both views contain risks. If we claim the text was always clear, we ignore the genuine ambiguity that caused this dispute. If we claim we are simply making new law, we undermine the normativity of the past decade—implying that no implementation was ever truly "wrong" before today, only out of step with our new decree.

  We reject both extremes. The authority of a specification does not reside in the private intentions of its author, nor does it float free of human practice. It resides in the shared understanding of the community that uses it. A rule is not a fossil to be excavated; it is a convention maintained by consistent use.

  For ten years, the community has "gone on in the same way" using ASCII folding. That shared practice constitutes the actual meaning of Clause 12.4 during that period. Implementations that deviated from this common practice were non-conforming, not because they violated a metaphysical truth hidden in the text, but because they broke interoperability with the ecosystem.

  Therefore, our authority here is neither purely archaeological nor purely legislative. It is **ratificatory**. We are codifying the consensus that already exists in the wild. By writing this down, we are not discovering a pre-existing fact nor inventing an arbitrary one. We are stabilizing a convention so that it can continue to function as a rule.

  Admitting this does not weaken the spec. Some fear that acknowledging our role in shaping the standard suggests the rules are arbitrary. This is a mistake. Traffic laws are chosen, not discovered, but they are not arbitrary; they serve the goal of safe coordination. Similarly, our choice is constrained by the need to preserve the utility of the format. Transparency about this process builds trust. It clarifies that conformance is about alignment with the community's operational reality, not adherence to a text that cannot speak for itself.

  **Next Steps**
  1.  Update Clause 12.4 text to explicitly reference ASCII table ranges.
  2.  Publish the "Flatpack 1.1 Compatibility Guide" detailing the migration window.
  3.  Schedule a vote on this resolution for the July meeting.

  We are stewards of a practice, not guardians of a text. Our job is to ensure the practice continues to work. This resolution achieves that.
