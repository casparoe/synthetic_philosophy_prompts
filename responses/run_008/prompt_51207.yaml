answer: |-
  You are right to sense that the stalemate is structural rather than evidential. After thirty years, the data has not shifted because the data was never the primary driver of the divergence. The disagreement between epistemicism and supervaluationism is best diagnosed as a **metasemantic disagreement masquerading as a semantic one, compounded by a verbal equivocation on 'truth'.**

  It is not merely two questions under one name, because both parties are attempting to solve the same logical puzzle (the Sorites) using the same linguistic data. However, it is not a straightforward substantive disagreement about the world, because the "facts" they dispute (the existence of a boundary) are not empirical facts but theoretical posits required to save their respective logical systems.

  Here is the precise diagnosis you requested.

  ### 1. The Precise Point of Contradiction

  To state what the epistemicist asserts and the supervaluationist denies without merely restating "sharp boundary" vs. "truth-value gap," we must look to the **supervenience relation between use and meaning.**

  *   **The Epistemicist Assertion:** The total set of non-semantic facts regarding linguistic usage (dispositions to assent, causal history, social norms) **supervenes on a unique classical extension** for every well-formed predicate. Even if usage includes norms of tolerance, those norms are compatible with, and indeed necessitate, a single cut-off point to preserve the coherence of reference.
  *   **The Supervaluationist Denial:** The total set of non-semantic facts regarding linguistic usage **underdetermines the extension** of vague predicates. Usage fixes a *range* of admissible precisifications, and there is no further fact—semantic or metaphysical—that privileges one precisification as the unique extension.

  The disagreement is not primarily about whether there *is* a boundary (that is the consequence); it is about whether **usage is the kind of thing that *can* fail to fix a unique extension.** The epistemicist holds that meaning is rigidly determined by use (even if we can't know how); the supervaluationist holds that meaning is inherently plastic in the borderline zone.

  ### 2. The Nature of the Disagreement

  This impasse betrays a **clash of theoretical virtues** grounded in divergent **standards for what a semantics must achieve.**

  *   **The Epistemicist Priority:** Logic and Metaphysics. The epistemicist prioritizes the preservation of classical logic (bivalence, excluded middle, standard quantifier rules) and a robust correspondence theory of truth. They are willing to pay the cost of counter-intuitive metaphysics (sharp boundaries we cannot know) to maintain the simplicity and power of classical inference. For them, a semantics that invalidates classical logic is *prima facie* defective.
  *   **The Supervaluationist Priority:** Phenomenology and Use. The supervaluationist prioritizes the accurate modeling of linguistic competence and speaker intuition (the feeling that there is no boundary, the reluctance to assert). They are willing to pay the cost of logical complexity (failure of bivalence, complications with higher-order vagueness, failure of certain inference rules like contraposition in the object language) to maintain fidelity to how language is actually experienced and used.

  Consequently, the disagreement is **substantive** regarding the metasemantics of determination, but **verbal** regarding the predicate 'true'. When the epistemicist says a borderline sentence is "true or false," they mean *classically true*. When the supervaluationist says it is "neither true nor false," they mean *not supertrue*. Because 'supertruth' does not obey the same logical laws as 'classical truth' (e.g., 'p or not-p' is supertrue even if neither disjunct is), they are often talking past one another regarding the *norms of assertion*, even when they agree on the assertion patterns themselves.

  ### 3. Explanation of the Impasse

  The reason nobody moves is that the dispute is **reflective-equilibrium bound.** Each side has optimized their theory for a different set of intuitions, and neither set of intuitions is demonstrably superior.

  *   **Divergent Starting Intuitions:** The epistemicist starts with the intuition that the world (and logic) is sharp; vagueness must be in the head. The supervaluationist starts with the intuition that language is inherently flexible; vagueness is in the word.
  *   **Incommensurable Costs:** The cost of epistemicism (unknowable sharp boundaries) seems metaphysically extravagant to the supervaluationist. The cost of supervaluationism (logical revisionism and the "problem of the many" regarding precisifications) seems semantically disastrous to the epistemicist. Neither side can prove their cost is unacceptable without begging the question against the other's starting priorities.

  ### 4. What Counts as Progress?

  Given this diagnosis, further rehearsal of Sorites paradoxes or tinkering with the 'definitely' operator will not resolve the dispute. Progress requires shifting the locus of the debate.

  **A. Metasemantic Naturalism (The most promising route)**
  Progress depends on a credible theory of **how linguistic conventions fix semantic values.** If we can provide a naturalistic account of reference determination (e.g., via causal chains, teleological functions, or decision-theoretic models of communication), we might be able to determine whether usage *in fact* forces a sharp cut-off (favoring epistemicism) or inherently leaves gaps (favoring supervaluationism). Williamson's later work hints at this, but a more robust cognitive-science-integrated metasemantics is needed. If we can show that cognitive categorization mechanisms *must* have a threshold for computational reasons, epistemicism gains ground. If we show that cognitive categories are inherently probabilistic or overlapping, supervaluationism (or fuzzy logic) gains ground.

  **B. Expressivism or Pragmatics**
  A change of question may be necessary. We might ask whether vagueness is a semantic phenomenon at all. If 'heap' is semantically precise but governed by **pragmatic norms of tolerance** (as some contextualists argue), the semantic disagreement dissolves. Alternatively, an expressivist diagnosis might suggest that borderline statements do not express propositions with truth conditions but rather express states of uncertainty or normative attitudes. This bypasses the truth-value debate entirely.

  **C. Logical Pluralism**
  We may have to accept that there is no single "correct" logic for vague language. Progress would look like mapping the domains where classical logic (epistemicism) is the appropriate tool (e.g., mathematical reasoning, legal adjudication requiring a verdict) versus where supervaluational logic is appropriate (e.g., descriptive phenomenology, AI categorization). This concedes that the "disagreement" was partly about the *purpose* of the semantic theory rather than the nature of the phenomenon.

  ### Conclusion

  You should expect no progress if the debate remains framed as "Who is right about the truth conditions of 'heap'?" The theories are too successful at defending their own priorities. Progress lies in **metasemantics** (explaining the mechanism of determination) or **pragmatics** (explaining away the truth-conditional load). Until we understand *why* usage determines meaning the way it does, the choice between a sharp boundary we cannot see and a boundary that does not exist will remain a choice between two equally coherent, but mutually exclusive, theoretical frameworks. The disagreement is real, but it is not about vagueness; it is about the limits of semantic theory itself.
