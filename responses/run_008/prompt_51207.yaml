          *   *Formulation:* The Epistemicist asserts that **semantic values are fixed by usage facts that are themselves non-vague (or at least determinate in their outcome),** whereas the Supervaluationist asserts that **usage facts themselves underdetermine semantic values, leaving a residue of genuine indeterminacy.**

