      *   *Supervaluationism:* Vagueness = Indeterminacy. No sharp boundaries (in the object language). Bivalence fails (for borderline cases). 'True' is supertruth.
      *   *Common Ground:* Sorites paradox, borderline cases, linguistic usage data.
      *   *The Clash:* Is there a fact of the matter about the boundary? Is 'True' bivalent?

  3.  **Evaluate the User's Hypotheses:**
      *   *Hypothesis 1 (Metasemantic vs. Semantic):* This is strong. Epistemicists often rely on a causal/historical or use-based metasemantics that *forces* a sharp cut-off (e.g., Williamson's margin for error principles combined with classical logic). Supervaluationists treat the semantics as primary and allow truth-value gaps. The disagreement often boils down to: "Does usage *determine* a unique extension?" (Epistemicist: Yes, in principle. Supervaluationist: No, it determines a set of precisifications.)
      *   *Hypothesis 2 (Different Questions/Equivocation):* Also strong. The concept of 'truth' differs. For the Epistemicist, truth is correspondence (bivalent). For the Supervaluationist, truth is supertruth (truth on all precisifications). When they say "p is true," do they mean the same thing? Often, no. But they also disagree on the *metaphysics* of the boundary.

