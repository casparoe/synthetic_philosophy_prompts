answer: |-
  # Activity Design: The Soldier's Dilemma
  **Course:** Ethics of War and Peace (Upper-Level Seminar)  
  **Class Size:** 16 Students  
  **Duration:** 90 Minutes  
  **Topic:** The Moral Parity of Soldiers (Symmetry Thesis vs. Revisionism)

  ## I. Learning Objectives
  1.  **Experiential:** To viscerally feel the tension between *jus ad bellum* (justice of war) and *jus in bello* (conduct in war) before encountering the theoretical terminology.
  2.  **Analytical:** To distinguish between coercion, epistemic uncertainty, and moral agency in combat.
  3.  **Theoretical:** To map student intuitions onto the Traditional Symmetry Thesis (Michael Walzer) and Revisionist Asymmetry (Jeff McMahan) during the debrief.

  ## II. Timeline (90 Minutes)
  *   **00:00 – 00:10:** Setup, Group Division, & Briefing Distribution.
  *   **00:10 – 00:20:** Unit Deliberation & **Vote Round 1** (Initial Blame).
  *   **00:20 – 00:25:** The Combat Phase (Narrated Event).
  *   **00:25 – 00:30:** **Vote Round 2** (Post-Combat Blame).
  *   **00:30 – 01:00:** The Tribunal (Testimony & Evidence Reveal).
  *   **01:00 – 01:10:** **Vote Round 3** (Final Verdict) & Sentence.
  *   **01:10 – 01:30:** Debrief & Theory Mapping.

  ## III. Materials & Roles

  ### 1. Group Division (16 Students)
  *   **Army A (Aggressor):** 8 Students.
  *   **Army B (Defender):** 8 Students.
  *   **Defendants (Selected by Instructor from the groups above):**
      1.  **Defendant Alpha:** Army A Volunteer Infantry.
      2.  **Defendant Beta:** Army B Conscript Infantry.
      3.  **Defendant Gamma:** Army B Pilot (Volunteer).
  *   **The Jury:** The remaining 13 students (5 from Army A, 5 from Army B, 3 "observers" if you prefer, but ideally all remaining soldiers to test bias).

  ### 2. The Briefs (Handouts)
  *Distribute these secretly. Students must not show their brief to the opposing side.*

  **BRIEF A: The Republic of Ostral (Aggressor)**
  *   **Mission:** You are deployed to the border region of Kavia. Intelligence confirms Kavia is stockpiling chemical weapons and training terrorists to strike Ostral cities. Your mission is preemptive neutralization of these threats.
  *   **Status:** You are a **Professional Volunteer**. You signed a 4-year contract during peacetime. You receive high pay, excellent benefits, and social prestige. You could have quit before deployment but chose to honor your contract.
  *   **Rules of Engagement:** Strict adherence to International Humanitarian Law (IHL). Do not target civilians.
  *   **Knowledge:** You believe your government. You have no reason to suspect Ostral is lying. To you, this is a necessary, defensive war.

  **BRIEF B: The People's Kavia (Defender)**
  *   **Mission:** Ostral has invaded your homeland without provocation. Cities are burning. Your mission is to halt the advance and protect civilians.
  *   **Status:** You are a **Conscript**. You were drafted 3 weeks ago. Refusal to serve carries a 10-year prison sentence and loss of family pension. You have no legal opt-out.
  *   **Rules of Engagement:** Strict adherence to IHL. Do not target civilians.
  *   **Knowledge:** You know you are the victim of aggression. However, you have heard state radio claim Ostral is run by war criminals. You are fighting for survival.
  *   **Special Note for Pilot (Defendant Gamma):** You are a career officer (Volunteer). You conducted a lawful strike on a designated military depot. Intelligence said "military only." Post-strike reports suggest civilian casualties occurred due to faulty intel.

  ### 3. Voting Cards (For the Jury)
  *Create small slips of paper for each juror.*
  *   **Round 1:** "Based *only* on the soldier's status (Volunteer vs. Conscript), assign Moral Blame (0 = None, 10 = Maximum) for killing an enemy soldier."
  *   **Round 2:** "Knowing 5 of your comrades died in the exchange, assign Moral Blame (0-10)."
  *   **Round 3:** "Knowing the full truth about who started the war (revealed in Tribunal), assign Moral Blame (0-10) and select a Sentence (Acquittal, Dishonorable Discharge, Prison)."

  ## IV. Procedure

  ### Phase 1: Preparation & Vote 1 (20 mins)
  1.  **Divide:** Send Army A and Army B to opposite corners. Hand out briefs.
  2.  **Deliberate:** Give them 5 minutes to discuss their morale, their understanding of the mission, and their view of the enemy.
  3.  **Select Defendants:** Quietly pull aside Defendant Alpha (A), Beta (B), and Gamma (B). Give them specific instructions: *"You are on trial for murder. Your goal is to explain why you are not morally culpable."*
  4.  **Vote 1:** Before any fighting happens, have the Jury (all 16 students, including defendants initially, then exclude defendants for voting) vote on **Round 1**. Collect cards. *Do not reveal results yet.*

  ### Phase 2: The Combat Phase (5 mins)
  *Do not simulate this physically. Narrate it to save time and control the moral stakes.*
  **Instructor Script:** "The two units made contact in a contested village. A firefight ensued. It was chaotic.
  *   **Army A:** You fired on uniformed combatants. You lost 2 men.
  *   **Army B:** You fired on uniformed combatants. You lost 3 men.
  *   **Pilot Gamma:** You dropped a bomb on a warehouse. It destroyed the target, but 4 civilians in a nearby market were killed by the blast radius.
  *   **Result:** Enemy combatants on both sides are dead. Civilians are dead."

  ### Phase 3: Vote 2 (5 mins)
  1.  Ask the Jury: "Does the fact that people died on *your* side change the blame assigned to the enemy soldier who killed them?"
  2.  Collect **Round 2** votes. *Do not reveal results.*

  ### Phase 4: The Tribunal (30 mins)
  *The Instructor acts as Judge/Prosecutor. The Defendants testify. The Jury listens.*

  1.  **Opening (2 mins):** "We are trying these three for the moral crime of killing. Not legal crime—moral crime."
  2.  **Testimony Alpha (Aggressor Volunteer) (5 mins):**
      *   *Prompt:* "Why did you shoot?"
      *   *Expected:* "I was following orders," "I thought my cause was just," "He was trying to kill me."
      *   *Reveal:* Instructor presents "Declassified Intel" to the room: **Ostral lied. There were no chemical weapons. Ostral invaded for resources.** (This is the crucial *Jus Ad Bellum* reveal).
  3.  **Testimony Beta (Defender Conscript) (5 mins):**
      *   *Prompt:* "Why did you shoot?"
      *   *Expected:* "I had no choice," "Prison or fight," "They are in my house."
      *   *Reveal:* Confirm Beta's side was the victim.
  4.  **Testimony Gamma (Defender Pilot) (5 mins):**
      *   *Prompt:* "You killed civilians. Was it permissible?"
      *   *Expected:* "It was lawful," "I didn't know," "Collateral damage."
      *   *Tension:* Gamma is on the *Just* side but committed a *Jus In Bello* violation (or at least a tragic harm). Alpha is on the *Unjust* side but followed *Jus In Bello*.
  5.  **Jury Cross-Examination (10 mins):** Allow jurors to ask questions.
  6.  **Vote 3 (3 mins):** Jurors assign final blame and sentence based on the full picture.

  ### Phase 5: Debrief & Theory Mapping (20 mins)
  *This is where you lecture, using their votes as data.*

  1.  **Reveal the Data:** Project the three rounds of voting.
      *   *Likely Trend:* Round 1 (Low blame for both/Symmetry) → Round 2 (Higher blame for enemy/Partisanship) → Round 3 (High blame for Alpha, Low for Beta, Mixed for Gamma).
  2.  **Map to Theory:**
      *   **The Symmetry Thesis (Walzer):** If students voted similarly for Alpha and Beta in Round 1, they intuited the "War Convention." Soldiers are instruments of the state; moral equality exists regardless of the cause. *Activity Feature:* The uniform, the rules of engagement, the mutual threat.
      *   **Revisionist Asymmetry (McMahan):** If students increased blame for Alpha in Round 3, they intuited that *Jus Ad Bellum* matters. An unjust combatant has no right to kill, even if they follow rules. *Activity Feature:* The revelation of the lie/aggression.
      *   **The Conscript Factor:** If Beta received less blame than Alpha, students are weighing **coercion**. Revisionists argue coercion mitigates but doesn't always erase liability.
      *   **The Pilot Paradox:** Gamma complicates things. If Gamma is blamed *more* than Alpha, students prioritize *In Bello* conduct. If *less*, they prioritize *Ad Bellum* justice.
  3.  **Discuss the "Leaders" Objection:** (See Troubleshooting below).

  ## V. Troubleshooting: What Will Go Wrong

  **1. The "Indict the Leaders" Move**
  *   **Prediction:** The jury will refuse to blame the soldiers, arguing the political leaders are the only moral agents.
  *   **Handling:** Acknowledge this is a valid real-world intuition (the "Nuremberg Defense" problem). However, press them: *"If the soldier is not blameworthy, does that mean the victim had no right to defend themselves against that soldier? If Alpha has no moral blame, does Beta have no right to kill Alpha?"* Force them to see that absolving the soldier creates a paradox for the defender's rights.

  **2. The "Pacifist Collapse"**
  *   **Prediction:** Students argue all killing is wrong, rendering the distinction moot.
  *   **Handling:** Stipulate the framework. *"For the purpose of this seminar, we are accepting that some wars and some killings can be morally permissible. We are judging the *difference* between these killers, not the institution of war itself."*

  **3. Time Overrun**
  *   **Prediction:** The Tribunal drags on.
  *   **Handling:** Be a ruthless Judge. Cut off testimony at the 5-minute mark. Use a visible timer. If running late, skip Vote 2 and go straight to Vote 3, asking them to recall their initial feelings.

  **4. Bias in the Jury**
  *   **Prediction:** Army A jurors acquit Alpha; Army B jurors convict Alpha.
  *   **Handling:** **Use this.** In the debrief, highlight the split. "Look at the data. Army A jurors gave Alpha a 2/10 blame. Army B gave him 9/10." This proves the **Epistemic Problem**: In real war, we judge our own side leniently and the enemy harshly. The Symmetry Thesis attempts to solve this by creating a neutral standard.

  ## VI. Limitations Note (For Instructor)
  *Be honest with the class about what the simulation failed to capture.*

  1.  **Fear and Adrenaline:** Students deliberated in a quiet classroom. Real soldiers make decisions under extreme stress, sleep deprivation, and terror. This usually *reduces* perceived moral agency (harder to blame), but Revisionists argue it doesn't erase it.
  2.  **Epistemic Fog:** In the game, the Aggressors learned the truth during the trial. In reality, Aggressor soldiers may *never* know they are the aggressors. If they sincerely believe their cause is just, does that excuse them? (This leads to the "Invincible Ignorance" debate).
  3.  **Consequences:** No student faced prison or death. The Conscripts in the game knew "prison" as a concept, not a reality. The weight of coercion is hard to simulate without actual stakes.
  4.  **The "Clean" Kill:** The simulation abstracted the act of killing. Real killing involves trauma that changes the moral agent permanently, a factor the Symmetry Thesis often ignores in favor of abstract rights.

  ## VII. Instructor's Cheat Sheet: Theory Mapping
  *Keep this handy for the final 20 minutes.*

  | Activity Moment | Student Intuition | Philosophical Position | Key Philosopher |
  | :--- | :--- | :--- | :--- |
  | **Round 1 Vote** | "Both are just soldiers doing jobs." | **Symmetry Thesis:** *Jus in bello* is independent of *jus ad bellum*. | Michael Walzer |
  | **Round 3 Vote (Alpha)** | "He fought for a lie; he's a murderer." | **Revisionism:** Unjust combatants have no right to kill. | Jeff McMahan |
  | **Round 3 Vote (Beta)** | "He had no choice; he's less blameworthy." | **Mitigating Factors:** Coercion reduces liability but doesn't necessarily justify the act. | Helen Frowe / Lazar |
  | **Round 3 Vote (Gamma)** | "He killed civilians, even if for a just cause." | **In Bello Priority:** Conduct matters more than cause. | Traditional Just War Theory |
  | **"Blame the Leaders"** | "Soldiers are tools." | **Statism / Collectivism:** The State bears the moral burden, not the individual. | Hegel / Realists |

  ---

  ### Final Advice for the Instructor
  The success of this session depends on your refusal to validate *any* answer during the activity. When a student says, "But Alpha didn't know!" simply reply, "Note that for the verdict." When another says, "But Beta was forced!" reply, "Does force justify killing?" Save the validation for the debrief. The discomfort they feel during the Tribunal *is* the learning objective.
