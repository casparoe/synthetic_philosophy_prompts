  The set does not hang together; your act consequentialist framework cannot simultaneously justify voting while dismissing the expected value of individual consumption, and your identity-based vegetarianism directly violates your prohibition on expressive justification.

  The most severe tension exists between your voting habit (5) and your consumption skepticism (2) under the rule of act consequentialism (1). In large elections, the probability of a single vote being decisive is mathematically lower than the probability of a single grocery purchase triggering a supply-chain threshold; if the latter is "effectively zero" (2), the former must be too. By maintaining that voting matters while consumption does not, you are applying inconsistent probabilistic standards to preserve a civic intuition while dismissing a market one. To resolve this, (2) must give: you must concede that individual purchases have a non-zero expected value, however small. The cost is losing the rhetorical sharpness of claiming ethical consumption is useless; you would have to admit buying welfare-labeled eggs does *some* good, even if donating to charity does more.

  The second severity tension is the direct contradiction between your ethical criterion (1) and your justification for vegetarianism (4). You state expected value is the "right criterion," yet you explicitly defend your diet as identity ("just who I am") rather than calculation. This is a category error within your own moral system. To resolve this, (4) must give: you must reframe vegetarianism as a consequentialist choice based on the revised non-zero expected value of consumption. The cost is surrendering the psychological comfort of identity-based ethics; you can no longer claim immunity from moral calculation regarding your daughter's diet.

  The third tension lies between your anti-expressivism (6) and your vegetarianism (4) if (2) remains true. If individual consumption has no causal impact, continuing to be vegetarian is purely expressive theater, which you explicitly reject in (6). Resolving this requires either accepting that vegetarianism has causal value (which circles back to revising (2)) or admitting that some expressive acts are permissible (revising (6)). Revising (2) is the cheaper path, as it preserves your hard-nosed stance against theater while validating the behavior.

  A minor tension exists between your charity preference (3) and carbon offsets (7). If you reject welfare eggs because they are a "lottery ticket on a rounding threshold," verified carbon offsets often face similar additionality uncertainties. However, this is empirical rather than structural. If you revise (2) to accept non-zero expected value in markets, (7) becomes consistent with (3) provided the offsets are sufficiently effective, though you must apply the same scrutiny to offsets that you apply to egg labels.
