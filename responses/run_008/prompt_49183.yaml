answer: |-
  This is an excellent set of questions. Your advisor is right: Horwich-style minimalism is seductive because it dissolves so many metaphysical headaches, but that very dissolving power makes it vulnerable to the charge that it dissolves *too much*, leaving nothing to hold the view together when pressed.

  Here is a stress-test of Horwich-style deflationism, ranked by severity, followed by an assessment of the unfalsifiability worry and a self-critique of this analysis.

  ---

  ### 1. The Liar Paradox (Rank: Fatal / High Threat)

  **The Objection:**
  You identified the core tension correctly. Horwich's central claim is that the Equivalence Schema (ES): $\langle p \rangle$ is true iff $p$, exhausts the concept of truth. But unrestricted ES + classical logic entails contradiction (via the Liar sentence $L$: "$L$ is not true").
  Tarski saves truth by restricting the schema (object language vs. meta-language), but he does so by positing a substantive hierarchy of semantic predicates. A deflationist cannot do this without explaining *why* some instances of ES fail without appealing to a substantive property (like "groundedness" or "semantic closure"). If you say "ES holds for all *grounded* sentences," you have just offered a substantive theory of truth (truth is the property of being grounded).

  **The Dialetheist/Paracomplete Dodge:**
  Can you be a deflationist and a dialetheist (true contradictions)?
  *   **The Problem:** Deflationism is usually motivated by a desire to keep metaphysics lean. Dialetheism requires a substantive revision of classical logic and a metaphysics that accepts true contradictions. This looks like you are paying a heavy metaphysical price to save a deflationary view of truth.
  *   **The "Restriction" Problem:** If you restrict ES to avoid paradox (e.g., "ES holds unless it generates paradox"), you need a theory of *which* instances generate paradox. That theory will inevitably look like a substantive semantic theory.
  *   **Verdict:** This is the most dangerous objection. If the deflationist must appeal to a substantive semantic property to tell us which instances of the ES are valid, the claim that "truth has no nature" is compromised. The nature of truth might be deflated, but the *logic of the truth predicate* now carries the metaphysical weight.

  **What a Deflationist Concedes:**
  Most sophisticated deflationists (like Field or even Horwich in later work) concede that the naive ES must be restricted. The fight is over whether that restriction implies a *substantive property of truth* or just a *logical constraint on the predicate*.

  ### 2. Conservativeness (Shapiro/Ketland) (Rank: Serious / Medium-High Threat)

  **The Objection:**
  If you add a truth predicate to Peano Arithmetic (PA) along with the T-schema (or even just disquotation), the resulting theory ($PA + T$) proves sentences that $PA$ alone cannot, such as the Gödel sentence for $PA$ or $Con(PA)$.
  Deflationists often claim truth is merely a "logical device" for expressing infinite conjunctions. Logical devices should be *conservative*: adding them shouldn't allow you to prove new facts about the original subject matter (numbers). Since $PA + T$ proves new arithmetic facts, 'true' seems to be doing substantive mathematical work, not just logical bookkeeping.

  **The Deflationist Dodge:**
  The standard reply (Horwich/Field) is that the truth theory *should* be accompanied by an expansion of the induction schema to include formulas containing the truth predicate. Once you do that, the non-conservativeness is explained by the *induction principle*, not the truth predicate itself.
  *   **Is this legitimate?** It depends. If you view truth as *purely* logical, adding induction over truth predicates looks like adding substantive mathematical axioms.
  *   **Is it redefining the view?** It risks it. If the deflationist says, "Truth is just a logical device, but you need new math axioms to use it," critics argue you've admitted truth has mathematical content. However, the deflationist can argue that the *concept* of truth is deflated, even if the *theory* containing it is strong.

  **Verdict:** This is a technical bullet that deflationism can bite, but it leaves a scar. It forces the deflationist to clarify that "deflationary" applies to the *property*, not necessarily the *deductive power of the theory containing the predicate*.

  ### 3. Generalization and Blind Ascriptions (Rank: Manageable / Low Threat)

  **The Objection:**
  Consider "Everything the Pope says is true." The deflationist analyzes this as an infinite conjunction: "If the Pope says $p_1$, then $p_1$, and if the Pope says $p_2$, then $p_2$..."
  Critics argue this fails when we don't know what the Pope says (we can't list the conjunction), or when quantifying into sentence position ("There exists a proposition $x$ such that $x$ is true"). Substitutional quantification (quantifying over linguistic items) has ontological commitments or coherence issues in standard logic.

  **The Deflationist Dodge:**
  Prosententialism (Grover, Camp, Belnap) treats "is true" as a pro-sentence (like a pronoun for sentences). This handles quantification without positing truth as a property. Alternatively, deflationists can argue that while the *analysis* is infinite conjunction, the *utility* is the generalization itself. We don't need to be able to *write out* the conjunction to use the device.

  **Verdict:** This is actually deflationism's strong suit. Correspondence theories struggle mightily with blind ascriptions (what does "true" correspond to in "Everything he says is true"?). While the technical logic of substitutional quantification is messy, it doesn't threaten the core philosophical claim that truth isn't a robust property. A deflationist would concede the logic is tricky but deny it undermines the metaphysics.

  ### 4. Normativity (Price/Wright) (Rank: Awkward / Low Threat)

  **The Objection:**
  Truth is the norm of assertion. We aim at truth. If truth is just a disquotational device, what is there to "aim" at? If deflationism is true, "It is true that $p$" adds nothing to "$p$". So "One ought to assert only what is true" adds nothing to "One ought to assert only $p$". But the latter doesn't make sense as a norm (you can't assert "only $p$"). Therefore, truth must be a substantive goal.

  **The Deflationist Dodge:**
  Deflate the norm. The norm isn't "Assert $p$ only if $p$ is true." The norm is "Assert $p$ only if $p$." The word 'true' allows us to *talk about* the norm, but it doesn't *constitute* the norm. The explanatory work is done by the concept of *assertion* and *justification*, not by a property called Truth.
  *   **Price's View:** Huw Price is actually a deflationist (expressivist). He argues the normativity is a feature of the *practice* of assertion, not a property of propositions.

  **Verdict:** This is often a verbal dispute. Deflationists can agree truth is "normative" in the sense that it is central to our practices, while denying it is a *property* that explains those practices. A committed deflationist would concede that truth is conceptually central but deny it is metaphysically robust.

  ---

  ### The Unfalsifiability Worry

  **Is Deflationism Qualified into Unfalsifiability?**
  There is a genuine risk here. If every time a counterexample arises (Liar, Conservativeness, Normativity), the deflationist responds with, "That's not what the truth predicate is for," or "That's a feature of logic, not truth," the view becomes a linguistic stipulation rather than a philosophical theory.

  **Is there a Falsifier?**
  Yes. Deflationism would be falsified if it could be demonstrated that the truth predicate is **indispensable for explanation** in a way that cannot be paraphrased away.
  *   *Example:* If a successful scientific theory required the axiom "True theories are empirically adequate" and this axiom could *not* be reduced to "If theory $T$ says $p$, then $p$ is empirically adequate" without loss of predictive power or coherence, deflationism would fail.
  *   *Example:* If the solution to the Liar Paradox *requires* positing a substantive semantic property (like "groundedness") that is distinct from the disquotational function, and this property is what we mean by "truth," then deflationism is false.

  **Is Unfalsifiability a Problem?**
  For a metaphysical theory, yes. For a conceptual analysis, maybe not. Deflationism is arguably a claim about the *concept* of truth, not the world. If the concept is thin, the theory will be hard to falsify empirically. However, if the theory cannot account for the *use* of the concept without constant ad-hoc restrictions, it fails on grounds of adequacy, even if not strict falsifiability.

  **Verdict:** Deflationism is not strictly unfalsifiable, but it is **highly resilient to refutation** because it can offload problems onto logic or linguistics. This resilience is a feature (it avoids metaphysical bloat) but also a bug (it risks being empty).

  ---

  ### Self-Criticism of This Analysis

  To ensure your paper is rigorous, you should note where my analysis above might be vulnerable or biased.

  **1. Bias Toward Classical Logic:**
  My assessment of the Liar Paradox (Rank 1) assumes that retaining classical logic is a priority.
  *   **How this could go wrong:** If you adopt a paracomplete logic (like Hartry Field's), the Liar is blocked without restricting the ES in a way that posits a substantive property. Field argues you can keep deflationism by weakening the logic.
  *   **The Flip:** If you accept Field's view, the Liar objection drops from "Fatal" to "Manageable." However, the cost is adopting a non-classical logic, which some argue is a *more* substantive commitment than deflationism allows. Your paper should address whether changing the logic counts as "changing the subject" on truth.

  **2. Conflating "Property" with "Concept":**
  I may have been too quick to treat the Conservativeness argument as a threat to the *property* of truth.
  *   **How this could go wrong:** The conservativeness result shows the *theory* of truth + arithmetic is strong. A deflationist can argue: "I never said the *theory* was weak, I said the *property* is non-existent." The fact that adding 'true' helps prove Gödel sentences might just show that 'true' is a useful logical tool, not that it names a property.
  *   **The Flip:** If you distinguish sharply between the *metaphysics* of truth (deflated) and the *logic* of the truth predicate (robust), the Conservativeness objection loses much of its bite. It becomes a technical issue about axiomatization, not a metaphysical refutation.

  **3. Underestimating the Normativity Objection:**
  I ranked Normativity low, but for a pragmatist deflationist (like Price), this is the *main* point.
  *   **How this could go wrong:** If the normativity of truth is what *constitutes* the concept (as some Wittgensteinians argue), then denying a substantive property while keeping the norm might be incoherent. You can't have the norm without the "target."
  *   **The Flip:** If you argue that the "aim of belief" is not truth but *justification* or *utility*, and 'true' is just a marker we use within that practice, the objection dissolves. But this moves you away from Horwich toward Pragmatism. You need to decide if you are a Horwichian Minimalist or a Pragmatic Deflationist, as they handle this differently.

  ### Recommendation for Your Paper

  Do not try to prove deflationism is "true." Instead, argue that it is the **most viable negative thesis** provided one accepts specific trade-offs.

  1.  **Concede the Liar:** Acknowledge that naive deflationism dies to the Liar. Argue that a *sophisticated* deflationism (restricting ES) is viable *if* the restriction principle is logical, not semantic.
  2.  **Reframe Conservativeness:** Argue that non-conservativeness shows truth is *useful*, not that it is *substantive*. Use the analogy of adding variables to algebra: it lets you solve more problems, but 'x' isn't a substantive object.
  3.  **Address Unfalsifiability:** Explicitly state that deflationism is a claim about *ontological commitment*, not predictive power. Its "unfalsifiability" is a feature of its ontological parsimony.
  4.  **Final Verdict:** Deflationism is not dead, but it is no longer the "default" easy option. It requires a robust philosophy of logic to defend it against the Liar and Conservativeness arguments.

  If you write a paper that admits deflationism requires a non-classical logic or a restricted schema to survive, and argues that *this cost is still lower than the cost of correspondence theories*, you will satisfy your advisor.
