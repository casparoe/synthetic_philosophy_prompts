  So before I send in my position statement for our hospital's DCD policy review I'd like somebody to stress-test the whole package, because I have a suspicion i'm smuggling something in somewhere and can't see where. Heres what I actually believe, all six at once:

  (1) When you die is a biological fact about your organism, not something we decide. There's a fact of the matter even before anyone pronounces you.

  (2) The right standard for that fact is whole-brain death: irreversible loss of all functions of the entire brain, brainstem included.

  (3) Controlled donation after circulatory death is fine the way we do it: withdraw support, wait two to five minutes after the heart stops, pronounce, then procure. I've never lost sleep over the five minutes.

  (4) The dead donor rule is non-negotiable: vital organs only ever come out of someone who is already dead. No exceptions for good consequences.

  (5) A patient in permanent vegetative state is alive, and so is an anencephalic newborn. Losing consciousness forever is not the same as dying, and I'd say that to a higher-brain-definition person's face.

  (6) Death is a property of the organism as a whole, so how many cells are still metabolizing is beside the point — a beating heart in a brain-dead body doesn't tell me anything by itself.

  I can feel that something's off somewhere around the DCD cases but I honestly can't locate it, and I don't want to preempt you by hinting which of the six I'd drop. Just audit the set as it stands.

  Please structure the reply in this order:

  - "Bottom line" — two or three sentences on whether the six can all be true at once as I've stated them.
  - "Genuine tensions" — worst first, roughly 150 words each: name which commitments collide, say what has to give, and what the cheapest fix costs me.
  - "Merely apparent tensions" — the pairs that look like trouble but dissolve on inspection, about 60 words each on why.
  - "One to give up" — if you're forcing me to drop exactly one commitment so the rest can stand together, tell me which, in a short paragraph, no hedging.

  Keep it an audit of my list rather than a survey of the literature, and no reading list at the end — I'm not asking for sources, just whether I'm consistent.
