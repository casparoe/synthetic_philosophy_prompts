      *   *The "Safe" Condition:* The user said "dominate every possible play." In SPI literature, it means the new strategy profile is Pareto superior to the default equilibrium *and* the transformation is safe. I need to make sure the debrief clarifies that the "safety" is about avoiding the *catastrophic tail risk* of the mixed equilibrium.
      *   *The "Invention" Mechanism:* I will introduce a "Mediator" phase. They can write a contract. But contracts need enforcement. I will act as the enforcer *only if* they use a randomizing device they both submit to.
      *   *Wait, one key insight:* To make them invent the coin flip, I need to make verbal agreements fail.
      *   *Round 1:* Silent. (Chaos/Crashes).
      *   *Round 2:* Talk allowed. (Promises made, some broken, or both swerve).
      *   *Round 3:* "The Auditor's Rule." The Ex-Auditor in the group can be leveraged. "You can make agreements, but the Auditor will audit one pair at random. If you deviated from your spoken agreement, you lose all chocolate." -> This simulates binding.
      *   *Actually, better:* Give them the tools *after* they ask for them. "Is there any tool in the room that could help you?"
