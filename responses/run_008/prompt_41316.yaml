  8.  **Finalizing the Plan:**
      *   **Title:** "The Crash Avoidance Protocol."
      *   **Materials:** Payoff matrix on whiteboard, Chocolate coins, 6 coins/dice, "Contract Slips."
      *   **Structure:**
          1.  Setup (5m)
