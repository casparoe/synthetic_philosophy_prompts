prompt: |-
  So here's my situation: I'm a staff biologist at a state wildlife agency, and I'm the one who has to prepare recommendations for our listing committee about whether populations count as "species" under our state endangered species act. The statute just says "species" and doesn't define it, which means every decision gets fought over. We had a hearing last spring where a consultant for a developer argued a bat population was "just a subspecies, and subspecies aren't real anyway" while a conservation group's expert said it was a diagnosable evolutionary lineage and cited a bunch of population genetics papers nobody on the committee could evaluate. The committee is five people, two of them political appointees with no genetics background, we meet quarterly, and the stakes are high because listing triggers permitting requirements that people litigate. I need something better than "go with whatever the most recent published paper says."

  What I'd love is a decision procedure the committee can actually run: a set of questions to ask about a candidate population, in order, with some guidance on what counts as a sufficient answer to each, and -- this is the part I care about most -- where it should stop and say "this is a judgment call, not a biology question," because I think half our fights are actually about values (how much do we care about local adaptation vs. how many total animals exist) dressed up as taxonomy. It should draw on the actual mess that is the species problem: that reproductive isolation comes in degrees, that gene flow doesn't switch off cleanly at some threshold, that phylogenetic and morphological and biological species concepts can give different answers for the same organisms, and that some lineages (all-female hybrid salamander complexes, for instance) just don't fit the reproductive-isolation picture at all.

  Then please run it on three real-ish cases for us. First: an all-female unisexual salamander lineage that persists by stealing sperm from a related sexual species but contributes no genes back. Second: an isolated island population that looks distinct but hybridizes freely with the mainland form at one contact zone -- the "is it a species or a variant with a range gap" problem. And third, a case I'm dreading: two populations currently listed separately that new genomic work suggests are one gene flow continuum, such that if we follow the procedure it says lump them, which would mean one of them comes OFF the endangered list. That last one is the answer I won't like, so I want to see whether the procedure really gives it or whether there's a defensible stopping point before it. Also flag honestly where the procedure will misfire -- e.g. when a species-splitting recommendation would just be ignored because nobody has budget for two recovery plans. Keep it usable by a smart non-specialist: no steps that require the committee to run its own genomic analyses, since we'd just get whatever data already exists in the literature. Thanks!!
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Staff biologist at a state wildlife agency.
      *   **Task:** Create a decision procedure for a listing committee to determine if a population counts as a "species" under a state endangered species act (statute undefined).
      *   **Context:** High stakes, litigation risk, committee has mixed expertise (political appointees), quarterly meetings, conflicting expert testimony (consultants vs. conservationists).
      *   **Goal:** A step-by-step question set with guidance on sufficiency, explicitly identifying where biology ends and value judgments begin. Must acknowledge the "species problem" (fuzzy boundaries, conflicting concepts).
      *   **Test Cases:**
          1.  All-female unisexual salamander lineage (kleptogenesis).
          2.  Island population distinct but hybridizes at contact zone.
          3.  Two currently listed populations genomics suggests lumping (one might get delisted).
      *   **Constraints:** Usable by non-specialists (no running own analyses), honest about limitations/misfires (budget, policy vs. science).

  2.  **Deconstruct the "Species Problem" for Policy:**
      *   Science doesn't give binary "yes/no" answers for species status in many edge cases. It gives evidence of divergence, isolation, and distinctness.
      *   Policy *needs* binary decisions (listed/not listed).
      *   The gap between scientific evidence and policy decision is where the "value judgment" lives.
      *   *Key Insight:* The procedure needs to separate *evidence of distinctness* from *policy significance of distinctness*.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be a flowchart or numbered list. Numbered list is easier to textually represent with conditions.
      *   *Step 1: The "Hard No" Filter.* Is there *any* evidence? If it's just a color morph with no genetic backing, stop.
      *   *Step 2: The Concept Check.* Which species concept applies? (Biological, Phylogenetic, Morphological). Acknowledge conflicts.
      *   *Step 3: The "Distinctness" Threshold.* How different is different enough? This is the crux.
      *   *Step 4: The Value Judgment Pivot.* Explicitly state: "Science says X, Policy asks Y."
      *   *Step 5: The Conservation Unit Fallback.* If it fails "Species," is it a "Distinct Population Segment" (DPS) or equivalent? (Many state acts allow this even if "species" is the word used, or interpret "species" to include subspecies/populations). *Correction:* The prompt says the statute says "species" and doesn't define it, and subspecies are being argued *against*. I need to build a procedure that justifies treating a non-species as a "species" for the purpose of the act, OR explicitly flags the value judgment required to protect a subspecies under the label "species."
      *   *Refinement:* Let's call it the "Significant Distinctness Protocol." It moves from Data -> Interpretation -> Policy Weight.

  4.  **Developing the Steps (Iterative refinement):**
      *   *Step 1 (Data Existence):* Do we have peer-reviewed data? (Prevents "just a feeling").
      *   *Step 2 (Reproductive/Genetic Isolation):* Is there reduced gene flow? (Addresses the Biological Species Concept).
      *   *Step 3 (Diagnosability):* Can we tell them apart consistently? (Addresses Phylogenetic/Morphological).
      *   *Step 4 (Evolutionary Trajectory):* Are they on separate paths? (Addresses the "realness" argument).
      *   *Step 5 (The Pivot):* This is where the committee votes on *significance*, not just biology.
      *   *Step 6 (Administrative Reality):* Can we actually manage this? (Budget/Feasibility).

  5.  **Addressing the "Value Judgment" Requirement:**
      *   I need to explicitly label steps where biology runs out.
      *   Example: "Is 5% genetic divergence enough?" Biology says "It's 5%." Policy says "Is 5% enough to matter?"

  6.  **Running the Test Cases:**

      *   *Case 1: Unisexual Salamanders.*
          *   Biology: No recombination, distinct lineage, ecological role.
          *   Procedure: Fails Biological Species Concept (no sex), passes Phylogenetic (distinct lineage).
          *   Pivot: Do we value lineage independence over reproductive mode?
          *   Outcome: Likely "Yes" if the procedure values evolutionary legacy.

      *   *Case 2: Island vs. Mainland (Hybridizing).*
          *   Biology: Distinct morphology/genetics on island, gene flow at contact.
          *   Procedure: Fails strict Biological (gene flow exists), passes Morphological/Phylogenetic (diagnosable).
          *   Pivot: Is the contact zone small enough to ignore? Is the island population functionally independent?
          *   Outcome: "Yes" if isolation is mostly effective, "No" if swamping is imminent.

      *   *Case 3: The Dreaded Lump.*
          *   Biology: Genomics shows continuum.
          *   Procedure: Fails Distinctness.
          *   Pivot: Can we protect them as "populations" even if not "species"?
          *   Outcome: Scientifically, they lump. Politically, this is dangerous. The procedure must hold firm on the science but offer the "Policy Override" option explicitly. *Crucial:* I must not bias the procedure to save the listing if the science says lump. I must show where the committee can choose to protect it *despite* the lumping, acknowledging that is a policy choice, not science.

  7.  **Refining the "Misfire" Section:**
      *   Budget constraints.
      *   Litigation risk (courts hate "policy disguised as science").
      *   Taxonomic inflation (splitting for funding).

  8.  **Tone and Style:**
      *   Professional, empathetic to the biologist's position.
      *   Clear, actionable language.
      *   Honest about the messiness.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 5 too vague?
      *   *Fix:* Make Step 5 a specific vote on "Conservation Significance."
      *   *Critique:* The prompt asks for a procedure where it stops and says "judgment call."
      *   *Fix:* Insert explicit "STOP: JUDGMENT CALL" markers in the text.
      *   *Critique:* Case 3 is tricky. If the procedure says "lump," the endangered status drops.
      *   *Fix:* The procedure should recommend "Not a distinct species." Then, a separate policy mechanism (like Distinct Population Segment, if allowed by interpretation) must be invoked. If the statute *only* says species, the committee has to decide if "species" legally encompasses "evolutionarily significant units." I need to make sure the procedure highlights this legal interpretation step.

  10. **Final Polish:** Check against all constraints (non-specialist usable, no new analyses, specific cases, flagging misfires). *Self-correction on Case 3:* The user wants to know if there's a defensible stopping point *before* delisting. The honest answer is: Only if you change the definition of "species" to include "conservation units." I need to be clear that biologically, if they are one continuum, they are one species. Protecting them separately is a *policy* choice, not a *taxonomic* one. I will structure the procedure to separate these two decisions.

  11. **Final Output Structure:**
      *   Introduction (acknowledging the difficulty).
      *   The Protocol (The "Significant Distinctness & Policy Weight" Framework).
      *   Application to Case 1 (Salamanders).
      *   Application to Case 2 (Island/Mainland).
      *   Application to Case 3 (The Lump).
      *   Known Failure Modes (Misfires).
      *   Closing advice.

  *(Self-Correction during drafting the response)*: I need to make sure I don't give legal advice, but I can frame the "policy" questions as "Committee Discretion Points." I also need to ensure the "Stop" points are very visible.

