  Subject: A proposal for how we handle voting going forward

  Hi everyone, I want to take a few minutes to talk about how we run our votes because I know the last contractor selection was frustrating and I want to make sure we do better next time. I have been looking into why that vote went sideways, and it turns out there is a well-known mathematical reality that explains exactly what happened to us. There is a theorem, often called the Gibbard-Satterthwaite theorem, which basically says that whenever you have three or more options and you ask people to rank them, there is always a possibility that voters will feel pressured to lie about their preferences to avoid wasting their vote. In our last vote, two of you admitted you ranked your favorite second because you were afraid your first choice would lose, and that strategic voting changed the outcome. I want to be transparent that this is not a flaw in how I counted the ballots, but a flaw inherent to ranked voting with multiple options. However, knowing this gives us a checklist to decide how to handle future votes so we can minimize the gaming and maximize fairness.

  The first thing we need to check for any given vote is whether this theorem even applies to the decision at hand. The math tells us that the size of our group does not matter, so whether it is the forty of us here or a whole country, the rules are the same. What matters is the number of options. If we are only choosing between two options, like a yes or no on a specific budget item, standard majority rule works perfectly and cannot be gamed in this way. The trouble starts the moment we have three or more choices. So for any upcoming vote, my first step is to count the options. If there are only two, we vote normally. If there are three or more, we have to acknowledge that strategic voting is possible and choose a method that handles it best.

  Since we cannot change the math, we have to choose our escape routes, and each one has a cost. The most extreme solution mentioned in the theorem is to let one person decide, essentially designating a dictator, but that is obviously not an option for a co-op and violates our bylaws. A more realistic loophole is called single-peaked preferences, which works when everyone agrees on a spectrum. For example, if we were voting on temperature settings, everyone has an ideal temperature and options further away are worse. If our preferences look like that, majority rule works even with many options. Another escape route is to change how we vote from ranking to rating. Instead of ordering contractors one to three, we could score them zero to five stars. This bypasses the specific theorem because it captures intensity of preference, though it introduces its own subtle strategies like grading harshly. A third option is to narrow the field beforehand, using a committee to reduce many options down to two finalists, which brings us back to the safe two-option zone. Each of these costs us something in terms of time, complexity, or nuance, so we have to pick the right tool for the job.

  I want to apply this logic to our two upcoming votes so you know what to expect. First, we have the vote on the four roof contractors. This is a high-stakes decision with real money involved, and I expect everyone to care deeply about the outcome. Because there are four options, the theorem applies and strategic ranking is a risk. Since contractor quality is not a simple spectrum like temperature, the single-peaked loophole does not apply here. Because the stakes are high, I propose we use a rating system where you score each contractor from zero to five based on their bid and references. This allows you to show strong support for your favorite without worrying about wasting your vote on a long shot. The cost here is that it takes a bit more time to fill out the ballot, and we have to agree on how to tally the scores, but it reduces the incentive to lie about your preferences. If the scores are too close, I reserve the right to narrow the field to the top two and run a second simple majority vote, which adds time but guarantees a clear winner.

  Second, we have the vote for the summer party date, where we have twelve possible dates. Here people care, but the stakes are much lower. The theorem applies because there are twelve options, but this is a case where single-peaked preferences are likely to work. Most people will have a preferred weekend and dates further away from that will be less desirable. For this vote, I suggest we use a simple approval or rating vote where you mark all the dates that work for you. The cost of this method is that it might result in a tie or a date that is everyone's second choice rather than a first choice, but given the low stakes, efficiency is more important than perfect optimization. We do not need to spend hours debating this, and a rating system will let us find a date that works for the most people without encouraging complex strategizing.

  I want to be honest that this checklist cannot make every decision for me, and there are points where I have to exercise judgment that I will own in front of this board. The math can tell us when a system is vulnerable, but it cannot tell us which vulnerability is most acceptable to this specific group. For example, if the contractor ratings come back split evenly, the math does not say whether we should pick the cheapest or the highest rated. I will have to make that call based on our co-op's priorities, and I might get it wrong. Similarly, deciding when to narrow a field from four options to two is a judgment call that could be seen as influencing the outcome. I cannot promise a perfect system where everyone gets their first choice, because the math says that is impossible without a dictator. What I can promise is that I will choose the voting method deliberately based on these rules, I will explain why I chose it before we vote, and I will accept responsibility if the outcome feels unfair. I hope this helps us move forward with more confidence and less frustration.
