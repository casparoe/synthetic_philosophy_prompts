      *   Or: The nature of "sources." J mentions it but doesn't deepen it (e.g., agent-relative vs. agent-neutral).
      *   *Best candidate:* The distinction between the **deliberative perspective** (guiding action) and the **assessive perspective** (evaluating the agent/state of affairs). S conflates them to force consistency. J conflates them to preserve residue.
      *   *Alternative:* The role of *regret* vs. *guilt*.
      *   *Selection:* The distinction between the "ought" of practical deliberation (action-guiding) and the "ought" of moral assessment (evaluative). S assumes one "ought." J assumes one "ought." If there are two, the contradiction dissolves without dissolving the dilemma.

  5.  **Identifying the "Least Sure" Move:**
      *   S's Last Word (The Residue Dilemma).
      *   Why? Because it depends on the metaphysics of moral debt. Is residue a new obligation or the tail of the old one? If it's a new obligation, Horn 1 works. If it's the tail, Horn 2 works. But J has a third option: Residue is a *state*, not an *obligation*. S frames it as an obligation to trap her. This framing contest is hard to judge without more meta-ethical ground.

