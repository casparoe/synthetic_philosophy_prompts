prompt: |-
  I'm on the budget working group for a shared research facility that's jointly run by our linguistics department and the cognitive science program. Each year we split a fixed operations pot between the two units, and historically it's been done by horse-trading in a way everyone is sick of. This year a colleague with a game theory background proposed we formalize it: each unit submits valuations over the candidate projects the money could fund, there's a mandated default split that kicks in if we can't agree (which acts as the disagreement point), and then we apply a bargaining solution to the resulting problem instead of arguing. Two solutions got proposed and the group split down the middle. Half want the Nash solution — pick the split that maximizes the product of the two units' utility gains over the default. The other half want Kalai–Smorodinsky — find each unit's best achievable payoff given the other unit gets its own best (the utopia point), and pick the split where each unit gets the same fraction of its utopia-relative gain. Both sound fair in the abstract, and the math-y people assure us they genuinely come apart in our setting.

  The thing that's really got us stuck is the year-to-year dynamics, since the feasible set isn't fixed — projects get proposed and dropped all through the spring. Our dress rehearsal last year was embarrassing: the cog sci unit had a big industrial-matching option added late in the process, which improved cog sci's best-case payoffs across the board, and under the product-maximization rule they ended up with a smaller share than before the option existed. The story in the hallway was "they found better things to do with the money and got punished for it," and one member nearly quit the working group over it. The colleague says the equal-fractions rule can't do that to you (she called it monotonicity), but the price seems to be that deleting some fantasy option nobody would ever have chosen can still move the split, because it drags down one unit's utopia point — which our Nash faction says is irrational, since a rejected alternative shouldn't matter. We have to pick one rule and write it into the facility's charter for next cycle, so re-litigating this every spring is off the table.

  Draft the memo I'll circulate before the vote: recomend one of the two solutions for the charter, with the reasoning spelled out for non-specialists, and give an honest treatment of the strongest point on the losing side — including whether the year-to-year dynamics (things being added and dropped from the feasible set) should drive the choice more than the one-shot fairness properties do. Assume the submitted valuations are reasonably truthful but strategically shaded, if that matters to the argument. It should be something the actual committee can act on: a clear bottom line, the reasons, and a line or two on what to tell people who will inevitably claim the chosen rule is rigged.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A shared research facility (Linguistics + Cognitive Science) needs a formal budget allocation mechanism.
      *   **Current Problem:** Horse-trading is inefficient and disliked.
      *   **Proposed Solutions:** Nash Bargaining Solution (NBS) vs. Kalai-Smorodinsky (KS).
      *   **Key Conflict:**
          *   NBS maximizes the product of utility gains over the disagreement point.
          *   KS equalizes the ratio of actual gain to maximum possible gain (utopia point).
          *   *Crucial Issue:* Year-to-year dynamics (feasible set changes).
          *   *Specific Incident:* Last year, Cog Sci got a new option (industrial matching), expanding their feasible set. Under NBS, their share *decreased* (non-monotonicity). This caused outrage.
          *   *KS Counter-issue:* KS is monotonic (expanding options doesn't hurt you), but it violates Independence of Irrelevant Alternatives (IIA). Removing an option no one would pick can still change the outcome because it changes the "utopia point."
      *   **Task:** Draft a memo recommending one solution for the charter.
      *   **Audience:** Committee members (mixed background, some game theory knowledge but mostly practitioners). Needs to be actionable, clear, and address the "rigged" accusation.
      *   **Requirements:** Clear bottom line, reasoning for non-specialists, honest treatment of the losing side's strongest point, address year-to-year dynamics vs. one-shot fairness, acknowledge strategic shading.

  2.  **Evaluate the Options:**
      *   **Nash Bargaining Solution (NBS):**
          *   *Pros:* Satisfies Independence of Irrelevant Alternatives (IIA). Mathematically elegant. Invariant to affine transformations of utility.
          *   *Cons:* Violates Resource Monotonicity (as seen in the dress rehearsal). If your opportunities improve, you might get *less* money. This is politically toxic and counter-intuitive for a budget process.
          *   *Strategic Aspect:* Sensitive to risk aversion (though usually modeled with von Neumann-Morgenstern utilities).
      *   **Kalai-Smorodinsky (KS):**
          *   *Pros:* Satisfies Resource Monotonicity (Individual Monotonicity). If your best-case scenario improves, your allocation shouldn't get worse. This aligns with human intuition about fairness ("I found more value, I shouldn't be punished").
          *   *Cons:* Violates IIA. Removing a "phantom" project (one that wouldn't be funded) can change the split because it changes the max possible payoff (utopia point).
          *   *Strategic Aspect:* Incentivizes inflating the "utopia" value? (Actually, KS relies on the feasible set boundary, so shading valuations affects the shape of the set).

  3.  **Determine the Recommendation:**
      *   *The "Dress Rehearsal" Incident:* This is the smoking gun. A mechanism that punishes a unit for finding better uses for funds is unsustainable in a shared governance model. It creates perverse incentives (don't look for outside funding, don't propose efficient projects).
      *   *Political Viability:* The NBS failure caused a near-resignation. The KS failure (IIA violation) is more abstract ("phantom projects"). It is easier to explain why a "best case scenario" matters than why a "product of utilities" matters.
      *   *Conclusion:* **Recommend Kalai-Smorodinsky.** The monotonicity property is essential for long-term stability and trust, even if IIA is theoretically cleaner. In a repeated annual process, trust > theoretical purity.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. We need to pick a rule for the charter.
      *   **The Choice:** Define NBS and KS simply.
          *   NBS: Maximize the "joint surplus product."
          *   KS: Equalize the "proportion of potential achieved."
      *   **The Recommendation:** Explicitly state KS is the choice.
      *   **The Core Reasoning (Monotonicity):** Address the "dress rehearsal" incident directly. Explain why punishing success is bad for the facility's health. This is the "Year-to-Year Dynamics" argument.
      *   **The Trade-off (IIA):** Honestly address the NBS advantage. Acknowledge that KS is sensitive to "irrelevant" options. Explain *why* we accept this cost (the utopia point represents bargaining power/potential, which *is* relevant in a partnership).
      *   **Strategic Behavior:** Acknowledge that units might shade valuations. Note that KS reduces the incentive to hide opportunities (unlike NBS).
      *   **Addressing the "Rigged" Claim:** Provide a soundbite for dissenters. Focus on "incentive compatibility" and "no punishment for innovation."
      *   **Next Steps:** Vote and Charter language.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Avoid overly dense math jargon (explain "utopia point" and "disagreement point" clearly).
      *   Acknowledge the validity of the NBS argument (IIA is a strong theoretical property) before explaining why it loses out in *this* context.
      *   *Self-Correction during drafting:* Make sure I don't get bogged down in the math of *why* NBS failed last year. Just state the outcome: better options = smaller share. Focus on the incentive structure.

  6.  **Addressing Specific Prompt Constraints:**
      *   *Recommend one:* Yes (KS).
      *   *Reasoning for non-specialists:* Yes (use analogies like "pie" or "potential").
      *   *Honest treatment of losing side:* Yes (IIA argument).
      *   *Year-to-year dynamics:* Yes (this is the deciding factor).
      *   *Strategic shading:* Yes (mention incentives).
      *   *Clear bottom line:* Yes.
      *   *Line for "rigged" claims:* Yes.

  7.  **Final Polish:** Check for clarity, flow, and persuasive impact. Ensure the distinction between "disagreement point" (default split) and "utopia point" (best case) is clear, as that's the mechanical difference between NBS and KS. (NBS uses disagreement point + feasible boundary shape; KS uses disagreement point + utopia point + feasible boundary shape).

      *(Self-Correction on "Strategic Shading"):* The prompt says "Assume the submitted valuations are reasonably truthful but strategically shaded, if that matters."
      *   Under NBS, you might want to appear more risk-averse or lower your valuation to shift the tangent point? Actually, in bargaining, you usually want to exaggerate your valuation of items to get more.
      *   Under KS, since it depends on the *max* possible payoff, there is an incentive to inflate the "utopia" value. However, since the feasible set is constrained by the *total* budget and joint projects, inflating one's own max without changing the joint feasibility might be limited.
      *   *Decision:* Keep the strategic discussion high-level. The main strategic benefit of KS is that it doesn't punish finding *real* outside options (like the industrial match). NBS creates an incentive to *hide* outside options. That's the critical strategic point.

  8.  **Final Review against the "Dress Rehearsal" story:** The prompt highlights that Cog Sci got a *new option* (industrial matching). This expanded the feasible set. NBS resulted in a *smaller share*. This is a violation of Individual Monotonicity. KS guarantees this doesn't happen. This is the pivot point of the memo.

      *(Wait, one nuance)*: The prompt says "deleting some fantasy option nobody would ever have chosen can still move the split [under KS]... which our Nash faction says is irrational." This is the IIA violation. I need to make sure I defend KS against this specific criticism. The defense is: In a partnership, "potential" (even if unrealized) signals bargaining power. If you *could* have done X, you have more leverage, even if we agree to do Y.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Budget Working Group, Shared Research Facility
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Formal Bargaining Mechanism (Charter Section 4.2)

  **Bottom Line Up Front**
  I recommend the Working Group adopt the **Kalai–Smorodinsky (KS) bargaining solution** for the facility's charter. While the Nash Bargaining Solution (NBS) has superior theoretical properties in static settings, the KS rule is the only viable option for a recurring partnership where units must be incentivized to pursue new opportunities without fear of budgetary penalty.

  **Context**
  As we finalize the charter, we must select the algorithm that converts our submitted project valuations into a budget split. We are choosing between two established mechanisms:
  1.  **Nash Solution:** Maximizes the product of our gains over the default split.
  2.  **Kalai–Smorodinsky (KS):** Equalizes the percentage of "best-case potential" each unit achieves.

  Both methods are mathematically sound and "fair" in a vacuum. However, they behave differently when the list of fundable projects changes from year to year. Given the incident during last year's dress rehearsal, this dynamic behavior is the deciding factor.

  **The Deciding Factor: Incentives and Year-to-Year Dynamics**
  Last spring, the Cognitive Science unit secured a potential industrial matching grant late in the cycle. This added a high-value option to the feasible set. Under the Nash rule, this improvement in Cog Sci's opportunities resulted in a *reduction* of their allocated share of the operations pot.

  While mathematically consistent with the Nash axioms, this outcome is operationally toxic. It creates a perverse incentive: **do not find better ways to use the money.** If a unit uncovers new efficiencies or outside partnerships, the Nash rule can interpret this as increased bargaining power that must be "taxed" to maximize the joint product. In a shared facility, we want units hunting for value, not hiding it to protect their baseline share.

  The Kalai–Smorodinsky solution guarantees **Individual Monotonicity**. Simply put: if your best-case scenario improves (your "utopia point" rises), your final allocation cannot go down. It aligns the math with the intuitive moral claim that finding more value for the facility should not punish you. For a long-term charter, stability and trust outweigh theoretical elegance. We cannot build a five-year plan on a rule that penalizes success.

  **The Trade-Off: Addressing the Nash Faction's Concern**
  Proponents of the Nash solution correctly point out that KS violates a property called *Independence of Irrelevant Alternatives (IIA)*.
  *   **The Criticism:** Under KS, removing a "phantom project" (one so expensive or niche it would never be funded) can still shift the budget split, because it lowers a unit's theoretical maximum payoff (their utopia point). The Nash faction argues this is irrational: why should a rejected option influence the actual split?
  *   **The Defense:** In a partnership, *potential* is a form of leverage. Even if we agree not to pursue a high-cost project, the fact that one unit *could* have justified that spend represents their capacity to contribute value. KS treats bargaining power as a function of what you *bring to the table*, not just what we ultimately *shake hands on*. While IIA is clean in a one-off transaction, in a recurring joint venture, acknowledging each unit's maximum capacity is a feature, not a bug. It ensures the split reflects the changing balance of research opportunities between Linguistics and Cog Sci over time.

  **Strategic Behavior**
  We must assume units will shade valuations strategically.
  *   Under **Nash**, the incentive is to obscure outside options (as seen last year) to avoid the "success penalty."
  *   Under **KS**, the incentive is to accurately report the upper bound of your project valuations to establish your utopia point. While this invites some inflation of "best-case" numbers, the working group can audit extreme outliers. It is easier to police inflated estimates than to police the hiding of external opportunities.

  **Managing Dissent**
  There will be objections that KS is "rigged" because phantom projects influence the outcome. When this arises, the response is:
  > "This rule ensures that no unit is punished for identifying higher-value uses of facility funds. We prioritize incentive compatibility over abstract independence axioms to ensure both departments remain motivated to grow the pie."

  **Action Item**
  Please review the attached draft language for Charter Section 4.2 implementing the Kalai–Smorodinsky solution. I move we vote to adopt this mechanism at the next meeting to allow time for valuation template updates before the spring cycle.

  **[Your Name]**
  **Budget Working Group**
