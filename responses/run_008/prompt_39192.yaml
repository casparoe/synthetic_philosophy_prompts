answer: |-
  # Activity Plan: The "Cumulative Cost" Spectrum
  **Course:** Upper-Level Seminar (Rational Choice/Value Theory)  
  **Time:** 75 Minutes  
  **Students:** 14  
  **Prerequisites:** Expected Utility, Basic Preference Axioms (Completeness, Transitivity, etc.)  
  **Goal:** Demonstrate the tension between local rationality and global coherence using a Quinn-style "Self-Torturer" spectrum, without initially invoking the axiom of transitivity.

  ---

  ## I. Materials & Setup
  *   **Tokens:** 200 poker chips, colored beads, or printed "Course Credits" (redeemable for a small privilege, e.g., choosing a future reading, or a candy bar at term's end). Value must be salient but not monetary.
  *   **Tally Counters:** 14 mechanical hand-tally counters (cheap on office supply sites). *Alternative:* 14 sheets of paper and pens.
  *   **Projector/Board:** To track the "Group Survival Rate" (how many students remain at each level).
  *   **The "Contract":** A printed slip each student signs at the start, binding them to the total tally count they end up with.

  ## II. The Spectrum Mechanism: "The Tally Task"
  To simulate the "Self-Torturer" ethically, we replace "pain" with "mindless physical effort."
  *   **State 0:** 0 Tally Clicks, 0 Tokens.
  *   **State $i$:** $i$ Tally Clicks, $5 \times i$ Tokens.
  *   **The Step:** Moving from $i$ to $i+1$ requires **one additional click** on the counter and grants **5 additional Tokens**.
  *   **The Claim:** One additional click is *negligible* (imperceptible cost).
  *   **The Endpoint:** State 20 (20 clicks, 100 Tokens). 20 clicks is visibly tedious/annoying compared to 0.
      *   *Note:* In the debrief, you will explain that the *theoretical* spectrum goes to 1,000 (genuinely painful), but class time limits us to 20.

  ## III. Timeline (75 Minutes)

  ### Phase 1: The Ladder (35 Minutes)
  **0:00–0:10 | Introduction & Binding**
  *   Distribute tally counters and tokens (start with 0).
  *   **Script:** "You are decision-makers. You begin at Level 0. I will offer you a series of trades. At each step, you may exchange your current Level for the next Level up. The cost is one click on your counter. The reward is 5 tokens. You must sign a contract agreeing to perform the total clicks of your final Level at the end of class."
  *   **Constraint:** Do **not** use the words "transitive," "axiom," "rational," or "consistent." Use "choice," "preference," and "trade."
  *   **Crucial Instruction:** "Make each choice based *only* on the difference between where you are now and the next step. Do not worry about where you started or where you might end."

  **0:10–0:35 | Sequential Trading**
  *   **Round 1:** "Who prefers Level 1 (1 click, 5 tokens) over Level 0 (0 clicks, 0 tokens)?"
      *   Students raise hands. Record number on board.
      *   Those who raise hands "trade" (instructor notes they are now at Level 1).
  *   **Round 2:** "You are at Level 1. Who prefers Level 2 (2 clicks, 10 tokens) over Level 1?"
      *   Record number. *Note:* Students can theoretically say "No" and stop, locking in their current tokens/clicks.
  *   **Rounds 3–12:** Repeat.
      *   **Pacing:** Keep it brisk (2 mins/round).
      *   **Pressure:** Remind them: "The cost is just *one* more click. Is one click worth 5 tokens?"
      *   **Data:** Track the "dropout rate." (Usually, few drop out early).
  *   **Round 12 Stop:** Halt the trading.
      *   Ask students to record their final Level and Token Count.
      *   **The Reveal:** Ask everyone to perform their total clicks *now*. (e.g., If you stopped at Level 12, click 12 times).
      *   Ask: "Look at Level 0 (silence, no action). Look at your current state (12 clicks, noise). If you could go back to Level 0 right now, keeping the tokens you earned, would you?"
      *   *Most will say Yes.* (They prefer the tokens, but regret the cumulative effort relative to the start).
      *   *Better Reveal:* "If you could trade your current Level 12 back to Level 0, giving up all tokens, would you?"
      *   *Some will say Yes.* (This reveals the cycle: $0 \to 1 \to \dots \to 12$, but $12 \succ 0$ is false).

  ### Phase 2: Reconstruction (15 Minutes)
  **0:35–0:50 | Mapping the Preferences**
  *   Draw a large circle on the board with nodes 0 through 12.
  *   Ask students to help you draw arrows representing their *revealed* choices.
      *   "Who chose 1 over 0?" (Draw arrow $0 \to 1$).
      *   "Who chose 2 over 1?" (Draw arrow $1 \to 2$).
      *   ...
      *   "Who, at the end, wished they were back at 0?" (Draw arrow $12 \to 0$).
  *   **The Discovery:** Point to the loop. $0 \to 1 \to \dots \to 12 \to 0$.
  *   **Question:** "Describe this shape using the vocabulary of preference. If 'better than' is a relationship, what property does this shape violate?"
  *   *Wait for them to say:* "It loops." "It's inconsistent." "Transitivity."
  *   **Now** you introduce the term **Transitivity**.

  ### Phase 3: Debrief & Theory (25 Minutes)
  **0:50–1:15 | Theoretical Mapping**
  *   **1. The Spectrum Argument:** Map the activity to Quinn's Self-Torturer.
      *   *Local Rationality:* At any step $i$, the marginal cost (1 click) is outweighed by marginal benefit (5 tokens).
      *   *Global Irrationality:* The cumulative cost (12 clicks) outweighs the benefit for some agents.
  *   **2. Indifference vs. Intransitivity:**
      *   *Question:* "Did you stop because you were *indifferent* between steps, or because you *preferred* the next step?"
      *   *Point:* Quinn argues the paradox holds even if you strictly prefer $i+1$ to $i$. If it were mere indifference, transitivity of indifference might fail, but that's less damaging. The damage is strict preference cycling.
      *   *Activity Check:* Did anyone feel *indifferent*? Or did they feel "Yes, take the money" every time?
  *   **3. Deliberation Costs:**
      *   *Student Objection:* "I didn't calculate the end because it was too hard."
      *   *Response:* Rational Choice Theory assumes ideal agents. If bounded rationality explains the failure, the axiom holds for ideal agents, but humans aren't ideal. Does this save the theory?
  *   **4. The Money Pump:**
      *   *Scenario:* "Imagine a trader knows your preferences. You have Level 0. They offer Level 1 for \$1. You accept. They offer Level 2 for \$1... up to 12. Then they offer to swap Level 12 back to Level 0 for \$1."
      *   *Result:* You end at Level 0, minus \$13.
      *   *Student Defense:* "I would see the pump coming and refuse the first trade." (Resolute Choice).
      *   *Counter:* "But at step 1, you *prefer* 1 to 0. If preference drives choice, you must take it. To refuse is to act against your current preference."
  *   **5. Limitations of the Simulation (Frank Assessment):**
      *   See Section V below.

  ---

  ## IV. Payoff Scheme (No Real Money)
  *   **Currency:** "Seminar Credits."
  *   **Redemption:**
      *   20 Credits = Choice of discussion topic for one week.
      *   50 Credits = Exemption from one short response paper.
      *   100 Credits = A book of your choice from the instructor's library (or a nice pen).
  *   **Why this works:** It creates stakes without IRB issues regarding gambling. The "Cost" (clicking) is real effort, the "Reward" is real privilege.

  ---

  ## V. Predictable Failures & Limitations

  ### 1. The "Test of Nerve" Problem
  *   **What will happen:** Students will treat the clicking as a challenge. "I can click 100 times, no problem." They will race to the end to maximize tokens, ignoring the "cost."
  *   **Why:** The cost (clicking a counter) is too low. It doesn't scale to "genuine bad."
  *   **Fix:** In the debrief, acknowledge this. "In the real Self-Torturer, the endpoint is *agony*. Here, it was just boredom. The logic holds, but the visceral 'stop' signal was missing."
  *   **Mitigation:** During Phase 1, explicitly frame the clicks as "Cumulative Strain." Ask them to imagine doing it 1,000 times.

  ### 2. The Imperceptibility Lie
  *   **The Limitation:** You cannot simulate **phenomenal indiscriminability** in a classroom. Students *can* perceive the difference between 1 click and 2 clicks.
  *   **Theoretical Gap:** Quinn's argument relies on the idea that $S_i$ and $S_{i+1}$ are *indistinguishable* to the agent, yet $S_0$ and $S_{1000}$ are not. If students can distinguish the steps, they can theoretically calculate the endpoint.
  *   **Debrief Script:** "I claimed one click was negligible. Was it? Technically, no. You could feel each click. In the philosophical puzzle, the steps are *truly* imperceptible (like a voltage increase below the threshold of sensation). Because we couldn't replicate true imperceptibility, you *could* have reasoned your way to the end. The fact that you didn't shows how powerful local framing is, even when global calculation is possible."

  ### 3. The "I'd Just Stop" Objection (Money Pump)
  *   **Student Pushback:** "I wouldn't get money-pumped. I'd pre-commit to stopping at Level 5."
  *   **Instructor Response:** This introduces **Resolute Choice** (McClennen) vs. **Sophisticated Choice** (backward induction).
      *   *Resolute:* "I bind my future self." (Requires a theory of agency that allows overriding current preferences).
      *   *Sophisticated:* "I know future me will be weak, so I stop now." (This actually solves the paradox! If you are sophisticated, you stop at Step 0).
      *   *The Catch:* If you stop at Step 0 because you know you'll be irrational later, you admit your preferences are time-inconsistent. The axioms of Rational Choice assume time-consistency.

  ### 4. Social Proofing
  *   **Risk:** Students will look at the board. If everyone moves to Level 5, they will too.
  *   **Mitigation:** Collect choices on slip paper if the group becomes too herd-like, though public recording is better for the "Group Survival" data visualization.
  *   **Debrief Point:** "Did you choose based on your preference, or because no one else stopped?" (Social preferences vs. Individual rationality).

  ---

  ## VI. Instructor Cheat Sheet: Key Definitions for Debrief
  *   **Transitivity:** If $A \succ B$ and $B \succ C$, then $A \succ C$.
  *   **Acyclicity:** No loops ($A \succ B \succ \dots \succ A$).
  *   **The Paradox:** Local preferences are transitive (mostly), but the chain creates a global cycle.
  *   **Vagueness:** The spectrum argument is often linked to the Sorites Paradox (heap of sand). Where does "negligible" become "significant"?
  *   **Separability:** Rational Choice assumes preferences over outcomes are separable from the *path* taken to get there. The Self-Torturer suggests the path (cumulative history) matters.

  ## VII. Contingency Plan
  *   **If everyone stops at Step 2:** The cost was too high. Acknowledge: "You successfully identified the global cost. You acted as 'Sophisticated' agents. The paradox failed because you refused to be 'Myopic'."
  *   **If everyone goes to Step 20:** The cost was too low. Acknowledge: "You maximized tokens. But ask yourself: If the cost was electric shock, would you have stopped? The structure of the choice remains the same, only the magnitude changes."

  ---

  ### Final Note on "Transitivity"
  Do not write the word on the board until Phase 2. Refer to the "Arrow Diagram" or the "Loop." Let the students feel the logical discomfort of the cycle before you give them the technical term that diagnoses it. This ensures they understand the *phenomenon* before the *label*.
