  Here are the predictions, the underlying rules, and the specific case you should use to test her logic.

  ### The Predictions

  1.  **The Struggling Ex-Smoker:** **No Standing.**
      *   **Why:** Your sister's "Yes" verdicts for reformed sinners (Dad, Politician) hinge on stability and time ("quit a decade ago," "genuinely reformed"). Three weeks of visible struggle suggests she hasn't "earned it" yet; she is still in the throes of the vice, just abstinent.
  2.  **The Reluctant Ex-Texter:** **No Standing.**
      *   **Why:** This is the crux. Your sister values *moral conversion*, not just behavioral compliance. The Politician was voted for because he was "genuinely reformed." This friend admits he hasn't reformed; he just fears fines. He lacks the moral authority your sister requires.
  3.  **The Speeder:** **No Standing.**
      *   **Why:** Your sister treats "reckless endangerment" as a single category. The Aunt (late) couldn't criticize the Nephew (late) because they shared the vice of disregarding others' time. Speeding and texting are functionally identical in her court: prioritizing convenience over safety.

  ### The Competing Rules

  You are correct that there are at least two rules that fit her past track record perfectly but diverge on your new cases.

  **Rule A: The "Sincere Reformation" Principle (My prediction for her actual rule)**
  *   **Definition:** You have standing to criticize a vice if you are currently innocent of it **AND** (you have never committed it **OR** you have genuinely reformed from it).
  *   **"Genuine Reform" requires:** Time, stability, and an internal shift in belief (e.g., Dad "earned it," Politician "genuinely reformed").
  *   **Fits Past Data:** Explains why Dad/Politician get a pass (reformed) but the Gossip/Aunt do not (unreformed).
  *   **Verdict on Live Cases:** Denies standing in Case 1 (not stable/reformed yet) and Case 2 (not internally reformed).

  **Rule B: The "Behavioral Compliance" Principle**
  *   **Definition:** You have standing to criticize a vice if you are **not currently engaging in that specific behavior.**
  *   **Logic:** Hypocrisy is about doing what you condemn. If you aren't doing it, you aren't a hypocrite. Past behavior and internal beliefs are irrelevant.
  *   **Fits Past Data:** Explains why Dad/Politician get a pass (not smoking/bribing) and Gossip/Aunt do not (are gossiping/late).
  *   **Verdict on Live Cases:** Grants standing in Case 1 (she isn't smoking) and Case 2 (he isn't texting).

  ### The Splitting Case

  **Case 2 (The Reluctant Ex-Texter) is your splitting case.**

  You do not need a further hypothetical; this live case cleanly separates Rule A from Rule B.
  *   **Case 1** is a *slightly* muddy splitter because "three weeks" introduces a time variable. Your sister could rule "No" based on Rule B simply by deciding three weeks doesn't count as "quitting" yet.
  *   **Case 2** is binary. He *has* stopped the behavior (satisfies Rule B), but he *has not* changed his mind (violates Rule A).

  **How to use it at dinner:**
  Bring up Case 2 explicitly. Frame it as: *"He doesn't text anymore, but he told me he only stopped because of the fines, not because he thinks it's wrong."*

  *   If she says **he can criticize**: She is running **Rule B** (Behavioral Compliance). Her morality is about actions only.
  *   If she says **he cannot criticize**: She is running **Rule A** (Sincere Reformation). Her morality is about character and belief.

  Given her emphasis on "genuinely reformed" and "earned it," I am confident she will rule **No**, confirming Rule A. But putting the case on the table will force her to articulate *why*, which is the real win for your bet.
