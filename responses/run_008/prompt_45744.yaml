  Dear Colleague,

  It is a pleasure to engage with this transcript from your reading group, as the dialectic you describe captures the central tension in contemporary debates on vagueness with remarkable fidelity. Regarding the first move, Dana is clearly right to characterize the supervaluationist position accurately, since the claim that the tolerance premise fails without a specific counterinstance is the defining feature of the view, preserving classical logic while respecting the intuition of boundarylessness. However, Ellis scores a significant point in the second move, which is also clearly right in identifying the problem of higher-order vagueness, because positing a definite boundary between the determinate and the indeterminate does indeed reintroduce a sharp cutoff at the meta-level, threatening to collapse the view into epistemicism. In the third move, Dana is technically right within the confines of supervaluationist logic, yet philosophically vulnerable, since admitting that existence claims can be true without any true instances strikes many as a revision of the concept of truth that saves the theory only by making it semantically unnatural. Ellis regains the advantage in the fourth move, which is clearly right to emphasize the explanatory power of the margin-for-error principle, as this provides a principled reason for our ignorance that supervaluationism lacks, transforming the cutoff from a semantic mystery into an epistemic limitation. Finally, in the fifth exchange, Dana raises a standard objection regarding the erosion of knowledge, but Ellis is ultimately right to deny the iteration of knowledge, since rejecting the KK principle is a coherent and independently motivated epistemological stance that prevents the sorites from destroying knowledge entirely.

  Overall, I would judge Ellis to be more right in this specific exchange, primarily because epistemicism offers a more unified explanation of why the sorites paradox arises and why we are ignorant of the boundary, whereas supervaluationism often feels like a technical maneuver to preserve intuitions at the cost of logical transparency. That said, Dana retains the intuitive high ground regarding the phenomenology of vagueness, which is why the debate persists, but in terms of argumentative rigor and explanatory scope regarding the paradox itself, Ellis provides the more robust framework. The epistemicist accepts a counterintuitive metaphysics to save classical logic and epistemology, while the supervaluationist saves the phenomenology by revising logic, and in the current philosophical climate, the former is often viewed as the lesser cost.

  What both colleagues are missing, however, is a broader framing of the disagreement that acknowledges these are not the only two options and that the dispute often hinges on deeper metaphysical commitments about meaning. They are treating the issue as purely semantic or epistemic, neglecting the pragmatic dimensions of how vague terms are used in context, which contextualist approaches exploit to dissolve the paradox without sharp boundaries or ignorance. Furthermore, they overlook the question of what fixes meaning in the first place, since epistemicism assumes meaning is precise despite usage being loose, while supervaluationism assumes meaning is partially indeterminate, and without addressing the theory of reference underlying these claims, the debate risks becoming a stalemate between competing intuitions about logic rather than a resolution of the phenomenon itself. I hope this assessment helps your group move past the impasse, and I would be happy to discuss further if you wish to explore alternative frameworks.

  Best wishes
