  2.  **Analyze the Six Theses:**
      *   *Thesis 1 (Sunk Cost Principle):* Only prospective costs/benefits matter. Past costs are irrelevant. Rational evaluation is independent of history.
      *   *Thesis 2 (Dollar Auction Rationality):* In the dollar auction, once bid, it is often rational to keep bidding. Escalation can be generated by rationality itself (game theoretic trap), not just bias.
      *   *Thesis 3 (Rule Utilitarian/Heuristic Defense):* A policy of finishing what you start (treating accumulated effort as a presumption for continuing) can be optimal as a standing rule, even if irrational case-by-case. (Due to noisy assessments).
      *   *Thesis 4 (Organizational Bias):* Real-world escalation (IT systems, wars) is mostly a bias/failure. Drilling managers on sunk cost principle is valuable.
      *   *Thesis 5 (Commitment Devices):* Deliberately making future options worse (burning bridges) is paradigmatically rational.
      *   *Thesis 6 (History Independence):* Rationality should not depend on agent's history. Same options/info = same choice, regardless of path.

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: Thesis 1 & Thesis 3.*
          *   T1 says past costs are reasons for *nothing* and evaluation should be *independent* of how the project came to be.
          *   T3 says a standing rule treating accumulated effort as creating a *presumption in favor of continuing* can be optimal.
          *   *Conflict:* T1 is act-utilitarian/act-rationality focused (case-by-case). T3 is rule-utilitarian/heuristic focused. T1 says "independent of how project came to be," T3 says "treat accumulated effort as presumption."
          *   *Severity:* High. This is the core philosophical conflict between act-rationality and rule-rationality in the context of sunk costs.
          *   *Resolution:* Distinguish between *ideal* rationality (T1) and *bounded* rationality (T3). But T1 says "core of rational decision-making," implying universality. T3 admits it would be "irrational to reason that way case by case." So T3 explicitly contradicts T1's claim about what counts as a reason.
