          *   *Resolution:* Distinguish between structural traps (rational escalation) and psychological traps (biased escalation).
          *   *Cost:* If T2 gives, you lose the insight that rationality can lead to bad outcomes. If T4 gives, you soften the advice to managers (maybe some escalation is smart?).

      *   *Tension C: Thesis 1 & Thesis 5.*
          *   T1 says only prospective costs/benefits matter.
