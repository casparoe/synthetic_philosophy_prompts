prompt: |-
  I teach a sophmore seminar on democratic theory — 17 students, one 75-minute block — and in two weeks we hit the Condorcet jury theorem. I don't want to lecture it and have them nod along. I want a game where they first feel the theorem working, and then feel it break, and only afterwards get the name and the math. Design it for me.

  The shape I have in mind: repeated rounds where the class votes on binary questions with real but unknowable-in-advance answers (something like which of two jars has more marbles, or which of two cities is farther north — questions where they genuinely have to guess, nobody just knows). The trick is that I control the information. In some rounds each student gets a private slip that points at the right answer with a fixed probability like 0.65, so the majority should start outperforming any individual and they can watch that happen. Then you sneak in rounds where I've rigged the dependence: e.g. a "tip sheet" I hand to everyone before they vote that's usually right but occasionally wrong, or one slip that five students all share. Individual accuracy stays exactly the same, but the votes are now correlated, and the majority goes to garbage. That's the moment I want them to hit — same voters, same competence, majority stops working, and they don't know why yet.

  Also include a round or mechanic around heterogeneity: I want three students to secretly recieve much better slips, and then at some point the class gets to vote on changing the voting rule — one person one vote vs. giving the (supposedly) better-informed students double votes — ideally before they know whether they themselves are in the expert group. I want them arguing about that.

  Please give me: the full round structure with timing, materials, the payoff scheme (points, not money, and it should make them care about getting majorities right rather than individually right), the debrief mapping each round onto competence and independence and what the correlation round says about electorates that share a media environment, and the last ten minutes where I finally state the theorem and they see what they were inside. Also tell me what will predictably go wrong the first time I run it — students comparing slips, someone actually knowing an answer, ties — and be honest about what 17 voters just cannot show: I assume the asymptotics are mine to supply on the whiteboard, tell me if there's anything else the game structurally can't reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Sophomore seminar on democratic theory, 17 students, 75 minutes.
      *   **Topic:** Condorcet Jury Theorem (CJT).
      *   **Goal:** Experiential learning (game first, theory later). Students need to *feel* the theorem work, then *feel* it break (correlation), and debate heterogeneity (weighted voting).
      *   **Key Mechanics:**
          *   Binary choices with unknowable answers (estimation tasks).
          *   Private signals (competence $p > 0.5$).
          *   Correlated signals (breaking independence).
          *   Heterogeneity (some "experts," voting on weighted voting rules).
          *   Payoff scheme: Incentivize *majority* correctness, not individual correctness.
      *   **Deliverables:** Round structure/timing, materials, payoff scheme, debrief mapping, final 10 mins (theory), troubleshooting/pitfalls.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   **Assumptions:**
          1.  Binary choice (True/False, A/B).
          2.  Common interest (everyone wants the right answer).
          3.  Competence ($p > 0.5$ for each voter).
          4.  Independence (votes are not correlated).
      *   **Conclusion:** As $n \to \infty$, Probability(Majority Correct) $\to 1$.
      *   **The "Break":** If independence fails (correlation), the theorem fails even if $p > 0.5$.
      *   **The "Twist":** Heterogeneity (some $p$ higher than others) raises questions about weighted voting vs. equality.

  3.  **Design the Game Mechanics:**
      *   **Class Size:** 17 is odd (good for avoiding ties), but small for asymptotics. Need to manage expectations.
      *   **Task:** Needs to be hard enough that $p < 1$, but easy enough that $p > 0.5$. Visual estimation is best. "Which jar has more dots?" or "Which line is longer?" (Müller-Lyer style but measurable). Let's go with "Which bag has more beads?" or similar. Actually, "Which of two numbers is larger?" hidden under flaps is easier to control. Let's use sealed envelopes with numbers.
      *   **Payoff:** If the *Majority* is right, everyone gets points. If Majority is wrong, everyone gets zero (or penalty). This aligns interests (Common Interest assumption). *Correction:* To make it exciting, maybe a collective pool. If Majority wins, class gets 5 points each. If not, 0.
      *   **Rounds:**
          1.  *Baseline:* Independent signals, moderate competence.
          2.  *Correlation:* Shared signal source.
          3.  *Heterogeneity:* Hidden experts + Constitutional Vote.
          4.  *Reveal & Debrief.*

  4.  **Drafting the Round Structure (75 mins):**
      *   Intro (5 mins)
      *   Round 1: Independence (15 mins)
      *   Round 2: Correlation (15 mins)
      *   Round 3: Heterogeneity & Constitutional Choice (20 mins)
      *   Debrief & Theory (20 mins)
      *   *Total:* 75 mins. Tight. Need to be disciplined.

  5.  **Refining the Mechanics:**
      *   *Task:* "The True Value." I have a number between 1-100. They guess High/Low relative to 50. No, that's too easy.
      *   *Better Task:* Two images on screen. "Which has more dots?" (Flash for 2 seconds). This is classic psychophysics. It ensures $p > 0.5$ but $< 1.0$.
      *   *Signal Manipulation:*
          *   *Independent:* I give each student a private hint card. "The answer is likely A." (65% chance hint is true).
          *   *Correlated:* I project a "News Ticker" or hand out a "Class Memo" that says "Answer is A." Everyone sees the same hint. If the hint is wrong, *everyone* is wrong.
          *   *Heterogeneity:* 3 students get "Analyst Reports" (85% accuracy), 14 get "Standard Tips" (55% accuracy).
      *   *Payoff:* "Class Grade Points." If Majority Correct = +2 participation points for everyone. If Majority Wrong = 0. This creates pressure to vote sincerely for the truth, not strategically (unless they game the system).
      *   *Wait, the prompt asks for voting rule change.* In Round 3, before voting on the answer, they vote on the *rule*. One Person One Vote (OPOV) vs. Weighted (Experts get 2 votes). Crucially, they don't know *who* the experts are yet. This creates a "Veil of Ignorance" scenario.

  6.  **Addressing the "17 Voters" Limitation:**
      *   CJT is asymptotic. With $n=17$ and $p=0.65$, $P(\text{Maj Correct})$ is high (~90%), but not 100%. Variance will exist.
      *   *Risk:* Round 1 Majority might lose by bad luck.
      *   *Mitigation:* Run multiple sub-rounds per phase to show the *trend*, not just one outcome. Or, rig the first round to ensure success so they trust the setup. *Ethical note:* Don't lie about the math, but can structure the difficulty to ensure $p$ is high enough. Let's suggest running 3 trials per "Phase" to generate data points.

  7.  **Troubleshooting:**
      *   *Collusion:* Students comparing slips. Need strict "no talking" rules.
      *   *Ties:* 17 is odd, so no ties in vote. But if using weighted voting, ties are possible. Need a tie-breaker rule (Instructor flips coin).
      *   *Knowing the answer:* Visual tasks prevent this.
      *   *Boredom:* Keep pace fast.
      *   *Cynicism:* "Why are we doing this?" Connect to real politics early.

  8.  **Developing the Debrief:**
      *   Map Round 1 to Competence + Independence.
      *   Map Round 2 to Correlation (Media ecosystems).
      *   Map Round 3 to Epistocracy vs. Democracy.
      *   Final 10 mins: Write the formula on the board. $P_n = \sum \binom{n}{k} p^k (1-p)^{n-k}$. Show how $\rho$ (correlation) kills it.

  9.  **Refining the Payoff:**
      *   Prompt asks for points, not money. "Participation Points" are currency in college.
      *   To make them care about *Majority*: "If the Majority is correct, everyone gets 3 points. If Majority is wrong, everyone gets 1 point." (Loss aversion). Or "Class Goal: 10 points total. Each Majority Win = 2 points."
      *   Let's go with: **The Collective Pot.** Start with 20 points on the board. Every time Majority is wrong, subtract 2. Every time Right, add 0 (maintain). Goal: End with >15. (Actually, simpler: Majority Right = +1 point to final grade participation score. Majority Wrong = 0. Cap at 3 points total for the day).
      *   *Better:* To incentivize the *rule change* debate, the payoff needs to be at stake during the constitutional vote.
      *   *Revised Payoff:* The points earned in Round 3 count double. The rule they choose applies to Round 3.

  10. **Structuring the "Correlation" Trick:**
      *   How to keep individual competence same but correlate?
      *   *Round 1:* 17 different coins flipped behind a screen. If Heads, slip says "A". If Tails, slip says "B". (Actually, slip says "Truth is A" with prob 0.65).
      *   *Round 2:* 1 coin flipped. If Heads, *all* slips say "A". If Tails, *all* slips say "B". Then add noise individually? No, simpler: Everyone gets the *same* hint.
      *   *Wait, prompt says:* "Individual accuracy stays exactly the same." This is tricky. If everyone gets the same hint, their individual accuracy is the accuracy of the hint.
      *   *Solution:* Round 1: Private signals ($p=0.65$). Round 2: Common Signal ($p=0.65$). In Round 2, if the signal is wrong (35% chance), *everyone* votes wrong. Majority accuracy drops to 65%. In Round 1, Majority accuracy should be > 65% (likely ~90%). This contrast is the key.

  11. **Final Review against Constraints:**
      *   17 students? Yes.
      *   75 mins? Yes.
      *   Feel theorem work? Yes (Round 1).
      *   Feel it break? Yes (Round 2).
      *   Heterogeneity/Weighted Vote? Yes (Round 3).
      *   Theory last? Yes.
      *   Troubleshooting included? Yes.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   *Timing:* 75 minutes is very tight for 3 rounds + debate + lecture. I need to combine the "Feel it work" and "Feel it break" into a tighter sequence. Maybe 2 trials per round.
      *   *Materials:* Need pre-prepared envelopes.
      *   *The "Truth":* I need to know the truth. I will generate the "True Answer" before class.
      *   *Heterogeneity:* How to hide who the experts are? Colored paper? "Gold Slip" vs "White Slip". But if they reveal they have Gold, the veil lifts. Rule: "You may not reveal the color of your slip."
      *   *Constitutional Vote:* They vote on the rule *before* they vote on the answer, and *before* they know if they are experts.

  13. **Final Polish:** Ensure the tone is practical for a professor. Be honest about the $N=17$ limitation. (The variance will be high).

  *(Self-Correction on Payoff)*: If the payoff is purely collective, free-riding isn't an issue because they can't change their vote to benefit themselves at expense of others (binary truth). The issue is they might vote strategically if they know they are experts. The "Veil of Ignorance" prevents this in the constitutional phase.

  Let's assemble the document.
answer: |-
  Here is a complete lesson plan designed for your 75-minute block. It prioritizes the experiential arc: **Success → Failure → Conflict → Theory.**

  ### **Seminar Title:** The Wisdom (and Folly) of Crowds
  **Time:** 75 Minutes
  **Students:** 17 (Perfect odd number for binary votes)
  **Materials Needed:**
  *   34 Envelopes (2 per student).
  *   Slips of paper (White and Gold).
  *   A "Truth Deck" (Cards marked A or B).
  *   Projector/Screen.
  *   Whiteboard.
  *   **Payoff:** Participation Points (e.g., 5 points total available for the day).

  ---

  ### **Part 1: The Setup (5 Minutes)**
  **Goal:** Establish the "Common Interest" payoff. Do not mention Condorcet yet.

  1.  **The Task:** Tell the class: *"We are going to make binary decisions on factual questions where the answer is unknowable to you in advance (e.g., 'Which of these two hidden jars contains more beads?')."*
  2.  **The Payoff:** Write on the board: **COLLECTIVE POT = 5 POINTS.**
      *   "If the **Majority** of the class votes correctly, everyone gets +1 point from the pot."
      *   "If the **Majority** votes incorrectly, everyone gets 0 for that round."
      *   "We will play 3 rounds. Max possible score: 3 points."
      *   *Why this matters:* This satisfies the CJT assumption of **Common Interest**. They win only if the *group* is right, not if *they individually* are right while the group fails.

  ---

  ### **Part 2: Round 1 — Independence & Competence (15 Minutes)**
  **Goal:** Let them feel the theorem working.

  1.  **Distribution:** Hand out **White Slips** inside sealed envelopes to all 17 students.
  2.  **The Signal:** Tell them: *"Inside is a hint generated by a reliable process. It points to the correct answer 65% of the time. It is private. Do not show anyone."*
      *   *Prep:* You have pre-generated 17 hints. For a specific "True Answer" (say, A), 11 slips say "Vote A" (Correct), 6 slips say "Vote B" (Incorrect). Randomize which students get which.
  3.  **The Vote:** Students vote by raising hands (A or B).
  4.  **The Reveal:** Reveal the True Answer.
  5.  **Repeat:** Run this **3 times** quickly (new envelopes, new True Answer each time).
      *   *Expected Outcome:* With $n=17$ and $p=0.65$, the probability of majority error is roughly 10%. You should win 2 or 3 out of 3 times.
  6.  **Observation:** Ask: *"Why did we win? You weren't all experts."* (They will say "We averaged out the errors.")

  ---

  ### **Part 3: Round 2 — The Correlation Trap (15 Minutes)**
  **Goal:** Break the theorem without changing individual competence.

  1.  **The Change:** Tell them: *"Same payoff. Same question type. But I am changing how I generate your hints. Your individual accuracy remains 65%."*
  2.  **The Signal:** Hand out envelopes.
      *   *The Trick:* Flip **one coin** for the whole class.
      *   If Heads (65% chance): All 17 slips say "Vote A" (and A is True).
      *   If Tails (35% chance): All 17 slips say "Vote A" (but B is True).
      *   *Wait, simpler method:* To keep individual accuracy at 65% but correlate:
          *   Generate **one** master hint. It is correct 65% of the time.
          *   Copy that **same hint** onto all 17 slips.
          *   *Result:* Individual accuracy is still 65%. But now votes are perfectly correlated ($\rho = 1$).
  3.  **The Vote:** Students vote.
  4.  **The Reveal:** Reveal True Answer.
  5.  **Repeat:** Run 3 times.
      *   *Expected Outcome:* The class will now lose exactly as often as the individual hint is wrong (35% of the time). They will feel the "safety" of the crowd vanish. In Round 1, errors canceled out. In Round 2, errors compound.
  6.  **The Shock:** They will lose significantly more often than Round 1, despite having the "same quality" information slips.

  ---

  ### **Part 4: Round 3 — Heterogeneity & The Constitutional Vote (25 Minutes)**
  **Goal:** Introduce epistocracy vs. equality under a Veil of Ignorance.

  1.  **The Setup:** Tell them: *"For this final round, the information environment is unequal. Some of you are 'Analysts,' some are 'Public.'"*
  2.  **Distribution:**
      *   **3 Students** receive **Gold Slips** (Accuracy 90%).
      *   **14 Students** receive **White Slips** (Accuracy 55%).
      *   *Crucial:* They do not know who has Gold. They only know their own slip color.
  3.  **The Constitutional Convention (10 mins):**
      *   Before they see the question, they must vote on the **Voting Rule** for this round.
      *   **Option A:** One Person, One Vote.
      *   **Option B:** Weighted Voting (Gold Slips count as 2 votes, White as 1).
      *   **Debate:** Open floor. They must argue without revealing their slip color.
      *   *Incentive:* "The rule you choose determines how points are awarded. If you choose Weighted, and the Weighted Majority is right, you get points."
  4.  **The Vote (10 mins):**
      *   Reveal the question.
      *   Vote according to the rule they selected.
      *   Reveal the answer and award points.
  5.  **The Reveal (5 mins):** Ask the 3 Gold Slip holders to stand up.
      *   *Discussion:* Did the majority vote for Weighted Voting? If so, did the Gold holders vote for it? (Usually, low-competence voters vote for equality; high-competence voters often vote for weighting, but under the Veil, they might hedge).

  ---

  ### **Part 5: Debrief & Theory (15 Minutes)**
  **Goal:** Map the experience to the math.

  1.  **Map Round 1 (Independence):**
      *   Write on board: $P(\text{Majority Correct}) \to 1$ as $n \to \infty$.
      *   Condition: $p > 0.5$ and **Independence**.
      *   Explain: "In Round 1, your errors were noise. Noise cancels out."
  2.  **Map Round 2 (Correlation):**
      *   Write: **Independence Failed.**
      *   Explain: "In Round 2, your errors were signal. When the signal was wrong, you were a mob, not a jury."
      *   *Real World:* "This is what happens when everyone gets news from the same algorithm or the same cable channel. Competence doesn't matter if the errors are correlated."
  3.  **Map Round 3 (Heterogeneity):**
      *   Discuss the "Veil of Ignorance."
      *   CJT assumes equal competence. What if $p_i$ varies?
      *   Mathematically, weighting by competence maximizes truth-tracking. Politically, it violates equality.
      *   Ask: "Did you vote for the rule that tracks truth, or the rule that feels fair?"
  4.  **The Name:**
      *   Finally write: **The Condorcet Jury Theorem (1785).**
      *   Show the binomial formula briefly to validate their intuition from Round 1.

  ---

  ### **Troubleshooting: What Will Go Wrong**
  *Be ready for these specific failures.*

  1.  **The "Bad Luck" Round 1:**
      *   *Risk:* With $n=17$, variance is high. You might lose Round 1 purely by chance (binomial variance).
      *   *Fix:* If the Majority loses Round 1, **do not panic.** Say: *"Interesting. The theorem is probabilistic, not magic. Let's see if the trend holds over the next two trials."* Run a 4th trial if needed to salvage the trend.
  2.  **Collusion/Comparing Slips:**
      *   *Risk:* Students peek at neighbors' slips in Round 1, creating artificial correlation.
      *   *Fix:* Enforce a "Silent Exam" protocol. Collect slips immediately after voting.
  3.  **The "Know-It-All":**
      *   *Risk:* A student actually knows the answer (e.g., you use a geography question and someone is a geography major).
      *   *Fix:* Use abstract visual tasks (e.g., "Which screen flash had more dots?" generated by a script) or obscure data ("Which year had higher US inflation: 1974 or 1981?"). Avoid general knowledge.
  4.  **Ties in Weighted Voting:**
      *   *Risk:* In Round 3, if Weighted Voting is chosen, a tie is possible (e.g., 3 Gold + 8 White vs 6 White).
      *   *Fix:* Pre-announce: "In case of a tie, the Instructor casts the deciding vote." (This reinforces the need for odd numbers/decisiveness).
  5.  **Cynicism about the Payoff:**
      *   *Risk:* Students don't care about 3 participation points.
      *   *Fix:* Make it public. Keep a running tally on the board. "We are at 1 point. We need 2 more to maximize the grade." Social pressure works better than grade pressure.

  ### **Structural Limitations (The "Asymptotics" Problem)**
  *Be honest with them in the final 10 minutes.*

  1.  **N=17 is Small:** The CJT is an asymptotic theorem ($n \to \infty$). With 17 voters, the "Wisdom" is fragile.
      *   *Teaching Point:* "You felt the crowd was wise, but you also felt the variance. In real elections, $n$ is millions, which helps, BUT..."
  2.  **Correlation scales faster than Competence:**
      *   *Teaching Point:* "If correlation exists, increasing $n$ does **not** drive error to zero. It drives error to the correlation rate. A million people reading the same fake news article does not make the news true."
  3.  **Competence must be > 0.5:**
      *   *Teaching Point:* "If your slips were 40% accurate, the crowd would become *more* confident in the *wrong* answer as it grew. Democracy requires a baseline of minimal competence."

  ### **Instructor Prep Checklist**
  1.  **Generate Slips:**
      *   Round 1: 3 sets of 17 slips (11 Correct, 6 Incorrect per set).
      *   Round 2: 3 sets of 17 slips (All 17 identical per set; 2 sets Correct, 1 set Incorrect).
      *   Round 3: 1 set of 17 slips (3 Gold/High Accuracy, 14 White/Low Accuracy).
  2.  **Prepare Questions:** 7 distinct binary questions (3 for R1, 3 for R2, 1 for R3). Ensure they are genuinely difficult (target ~60-70% individual accuracy).
  3.  **Board Layout:** Reserve space for the "Collective Pot" score and the final Formula.

  This design forces them to inhabit the assumptions of the theorem before they see the math. When you finally write $p > 0.5$ and $\text{Independence}$ on the board, they won't just see variables; they'll remember the feeling of the Round 2 collapse.
