prompt: |-
  I'm on the governance committee of a forecasting community (~30,000 users) that recently converted into a member-owned cooperative, and we're stuck on who gets to vote in the upcoming charter revision. Currently only dues-paying members vote, but three groups are contesting that: long-time users who contribute forecasts and moderation work yet have never paid dues; members of two adjacent research communities whose projects our treasury part-funds; and developers who don't participate in forecasting at all but depend on our free API and would be directly hit by any change to its terms.

  The dues-payers say voting rights should track contribution and financial stake, while the others keep invoking the claim that anyone materially affected by a decision should have a say in it. I have two worries I can't fully articulate. First, the affected-interests position seems to prove too much: in a networked community, nearly everyone is marginally affected by nearly everything, and I don't see a non-arbitrary cutoff for how much affectedness buys how much voice. Second, the contribution-based position looks self-serving in a subtle way: the incumbent members get to define which contributions count, and they'll naturally pick the ones they themselves happen to have made. A test someone proposed—would this decision have any content if the group in question were subtracted from the world?—seems to help but I'm not sure it isn't just a fancy way of favoring the status quo coalition.

  Is there a principled way to draw the boundary here, or should we concede that any boundary will be somewhat arbitrary and focus instead on procedural safeguards (supermajorities, sunset clauses, an appeals process for excluded groups) that make the arbitrariness less dangerous? If you think the second, I'd like to hear how you'd distinguish legitimate safeguards from a ratchet that entrenches whoever holds power at incorporation time.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** A forecasting community (~30k users) converted to a member-owned cooperative.
      *   **Issue:** Determining voting eligibility for an upcoming charter revision.
      *   **Current Rule:** Only dues-paying members vote.
      *   **Contesting Groups:**
          1.  Long-time non-paying contributors (forecasters/moderators).
          2.  Adjacent research communities (part-funded by the co-op treasury).
          3.  Developers (depend on free API, vulnerable to terms changes).
      *   **Competing Principles:**
          *   *Contribution/Stake:* Voting rights track financial contribution and active work (Dues-payers).
          *   *Affected Interests:* Anyone materially affected by a decision should have a say (Contesting groups).
      *   **User's Worries:**
          1.  *Affected Interests:* Proves too much (boundary problem). Everyone is marginally affected. Where's the cutoff?
          2.  *Contribution:* Self-serving (incumbents define what counts). Favors status quo.
      *   **Proposed Test:** "Subtraction Test" (Would the decision have content if this group were removed?). User suspects this might just favor the status quo.
      *   **Core Question:** Is there a principled boundary, or should we accept arbitrariness and focus on procedural safeguards? If safeguards, how to avoid entrenchment (ratchet effect)?

  2.  **Analyze the Principles:**
      *   *All-Affected Principle (AAP):* Philosophically sound but practically unbounded. In a networked world, ripple effects are infinite. Needs a threshold.
      *   *All-Subjected Principle (ASP):* A variant of AAP. Those *subject to the rule* should vote. This is stronger than "affected." Developers are subject to API terms. Researchers are subject to funding decisions. Forecasters are subject to community norms.
      *   *Contribution/Stakeholder Model:* Aligns incentives with investment. Risk of oligarchy.
      *   *The "Subtraction Test":* If you remove the developers, does the API policy decision vanish? Yes. If you remove the forecasters, does the community vanish? Yes. This test actually helps identify *constituencies*, not just voters.

  3.  **Evaluate the "Principled Boundary" vs. "Procedural Safeguards" Dichotomy:**
      *   It's a false dichotomy. You need *both*. A boundary without safeguards is tyranny. Safeguards without a boundary is paralysis.
      *   The goal is *Legitimacy*, not just mathematical precision.
      *   The user's worry about the "Subtraction Test" favoring the status quo is valid if applied statically. But if applied to *functions* rather than *people*, it helps.

  4.  **Develop a Framework for Decision:**
      *   **Step 1: Reframe the Boundary Problem.** Move from "Who is a member?" to "What is the scope of authority?" Different decisions might require different electorates (bicameralism or stakeholder chambers).
      *   **Step 2: Address the "Affected Interests" Worry.** Use the "All-Subjected Principle" instead of "All-Affected." Subject to *coercion* or *binding rules*, not just influence.
      *   **Step 3: Address the "Contribution" Worry.** Acknowledge the self-serving bias. Introduce external validation or objective metrics for contribution.
      *   **Step 4: Procedural Safeguards.** How to prevent the ratchet?
          *   *Sunset Clauses:* Good, but need triggers.
          *   *Supermajorities:* Can entrench minorities. Need to be careful.
          *   *Appeals/Ombuds:* Good for specific grievances.
          *   *Constitutional Convention:* Periodic review of the voting rules themselves.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's intuition. Both principles have flaws. The "Subtraction Test" is useful but needs refinement.
      *   *Section 1: The Principled Boundary (The "All-Subjected" vs. "All-Affected").*
          *   Distinguish between *influence* (affected) and *authority* (subjected).
          *   Apply to the three groups:
              *   Developers: Subject to API terms -> Vote on API terms (maybe not governance).
              *   Researchers: Subject to funding criteria -> Vote on funding (maybe not moderation).
              *   Forecasters: Subject to community norms -> Vote on norms.
          *   *Idea:* Functional Voting Rights (Bicameralism/Stakeholder Chambers). Don't make everyone vote on everything.
      *   *Section 2: The Contribution Trap.*
          *   Acknowledge the incumbent bias.
          *   Solution: Decouple "Membership" from "Voting Eligibility." Membership = identity. Voting = specific domain.
          *   Use the Subtraction Test dynamically: "If we remove this rule, who loses a protected expectation?"
      *   *Section 3: Procedural Safeguards (Avoiding the Ratchet).*
          *   The user asks how to distinguish safeguards from entrenchment.
          *   *Key distinction:* Does the safeguard protect the *process* or the *outcome*?
          *   *Specific mechanisms:*
              *   *Constitutional Conventions:* Mandatory review every X years. Prevents permanent entrenchment.
              *   *Sortition:* Random selection for some oversight roles (breaks coalitions).
              *   *Qualified Transparency:* Decisions must be justified publicly.
              *   *Exit Rights:* If voice is denied, exit must be easy (data portability).
      *   *Section 4: Recommendation.*
          *   Don't seek a perfect static boundary.
          *   Adopt a "Stakeholder Chamber" model for the charter revision.
          *   Implement a "Review Clause" for the voting rules themselves.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is suggesting bicameralism too complex for a 30k user co-op?
      *   *Adjustment:* Keep it conceptual. They don't need a full parliament, but they can have "voting pools" for specific charter sections.
      *   *Critique:* The user asked specifically about the *charter revision* vote, not general governance.
      *   *Adjustment:* Focus on who votes on the *rules of the game*. This is the meta-problem. If dues-payers decide who votes, it's circular.
      *   *Insight:* The charter revision *itself* determines future voting rights. Therefore, the electorate for *this* vote must be broader than the electorate for *future* ordinary votes. This is a "Constitutional Moment."
      *   *Refined Advice:* For the *charter revision*, use a broader franchise (All-Subjected). For *ordinary business*, use a narrower one (Contribution/Stake). This solves the circularity.

  7.  **Final Polish:**
      *   Ensure tone is empathetic to governance complexity.
      *   Make sure the distinction between "safeguards" and "ratchets" is clear (Process vs. Outcome protection).
      *   Check that all three contesting groups are addressed.

  8.  **Final Output Structure:**
      *   Acknowledge the depth of the problem (Constitutional Design).
      *   Critique the two principles (Affected vs. Contribution).
      *   Propose the "All-Subjected Principle" + "Domain-Specific Franchise."
      *   Address the "Subtraction Test" (Refine it).
      *   Answer the Safeguard vs. Ratchet question (Process vs. Outcome).
      *   Concrete recommendation for the Charter Revision.

  *(Self-Correction during final review)*: Wait, the user asked if there is a principled way OR if they should focus on safeguards. I should argue it's not an either/or. A principled boundary is necessary *to define* the safeguards. But the boundary must be *functional*, not identity-based. I will emphasize the "Constitutional Moment" distinction. The rules for making the rules must be more inclusive than the rules for making policy.

