answer: |-
  This is a classic problem in constitutional design, often called the "boundary problem" of democracy. Your intuition is correct: both the *All-Affected Principle* (everyone impacted votes) and the *All-Contributors Principle* (everyone who invests votes) fail when applied rigidly to a complex, networked organization.

  The All-Affected Principle creates an infinite regress (as you noted, everyone is marginally affected by everything). The All-Contributors Principle creates a circular lock-in (incumbents define contribution to favor themselves).

  However, you do not have to choose between a "principled boundary" and "procedural safeguards." You need a **functional boundary** to determine *which* safeguards apply. If you concede the boundary is entirely arbitrary now, you validate the incumbents' power to set the initial conditions, which makes subsequent safeguards weak.

  Here is a framework for resolving this, distinguishing between the *Charter Revision* (constituent power) and *Ordinary Governance* (constituted power), and how to design safeguards that prevent entrenchment.

  ### 1. Distinguish the "Constitutional Moment" from Ordinary Business
  The most critical error you can make is using the same voting franchise for the *Charter Revision* as you will for ordinary governance.

  *   **Ordinary Governance:** Deciding budget allocation, API rate limits, or moderation policy. Here, the **Contribution/Stake Principle** is stronger. Those risking capital or labor should steer the ship.
  *   **Charter Revision:** Deciding *who gets to vote*. This is a meta-decision. If only dues-payers decide who gets to vote, you have a circular lock-in.

  **Principle:** For the Charter Revision specifically, you should adopt the **All-Subjected Principle**, not the All-Affected Principle.
  *   *All-Affected:* "This decision might change my workflow." (Too broad)
  *   *All-Subjected:* "This decision creates a binding rule I must obey or a dependency I cannot easily exit." (Just right)

  **Application to your groups:**
  1.  **Developers:** They are *subject* to API terms. They cannot easily switch APIs if the community changes terms (high switching costs). They should vote on the *sections of the charter governing API access*, even if they don't vote on moderation policy.
  2.  **Researchers:** They are *subject* to funding criteria. If the charter changes how the treasury operates, their projects are directly subjected to new rules. They should vote on treasury governance.
  3.  **Long-time Users:** They are *subject* to community norms and moderation. If the charter codifies moderation power, they are subjected to that authority. Their labor (forecasts) creates a "sweat equity" stake that creates a dependency similar to financial dues.

  **Recommendation:** Do not create a single binary (Voter vs. Non-Voter). Create **Domain-Specific Franchises**. For this charter revision, allow all three groups to vote on the sections of the charter that directly subject them to authority.

  ### 2. Refining the "Subtraction Test"
  You are right to worry the Subtraction Test favors the status quo. If you ask, "Would the co-op exist without the dues-payers?" the answer is "No." If you ask, "Would the co-op exist without the developers?" the answer might also be "No" (if the API drives traffic).

  **Refinement:** Use the **Dependency Test** instead of the Subtraction Test.
  *   *Question:* "If this group exits the ecosystem in response to a charter change, does the organization lose a critical function that cannot be immediately replaced?"
  *   *Dues-payers:* Loss of revenue. (Replaceable? Maybe, but painful.)
  *   *Developers:* Loss of ecosystem utility/integration. (Replaceable? Hard, if they build on the API.)
  *   *Forecasters:* Loss of data/liquidity. (Replaceable? No, forecasting requires human input.)

  If the answer is "Hard to replace," that group has a veto stake in the charter. This moves the boundary from "Who are we?" to "What functions must survive?"

  ### 3. Safeguards vs. Ratchets: How to Tell the Difference
  You asked how to distinguish legitimate safeguards from a ratchet that entrenches the incorporation-time coalition. The distinction lies in whether the safeguard protects the **Process** or the **Outcome**.

  *   **A Ratchet (Entrenchment):** Protects a specific *outcome* or *distribution of power*.
      *   *Example:* "Voting rights shall forever remain tied to dues payments." (This locks the current coalition in.)
      *   *Example:* "A 75% supermajority is required to change voting eligibility." (This allows a 26% minority to block expansion forever.)
  *   **A Safeguard (Legitimacy):** Protects the *process of revision* and ensures *exit rights*.
      *   *Example:* "Voting eligibility criteria must be reviewed every 3 years by a randomly selected citizens' assembly." (Protects the process of adaptation.)
      *   *Example:* "If a stakeholder group is denied voting rights, they must be granted data portability and API access guarantees." (Protects the right to exit.)

  **Three Specific Safeguards to Prevent Entrenchment:**

  1.  **The Sunset Clause on Eligibility:**
      Do not hard-code the voting eligibility into the permanent charter. Instead, write a "Transitional Voting Clause" that expires in 2 years. This forces the newly formed cooperative to revisit the question of "Who votes?" after they have operated for a cycle, with better data on who actually contributes value.

  2.  **Sortition for Oversight (The Anti-Cartel Mechanism):**
      To prevent the "incumbents define contribution" worry, create a small Governance Review Committee selected by **lottery** (sortition) from the *entire* user base (including non-voters), not just the dues-payers. Give this committee the power to propose changes to voting eligibility. This breaks the coalition of incumbent voters without requiring a massive expansion of the franchise.

  3.  **Constitutional Exit Rights:**
      If you deny a group voting rights (e.g., the Developers), you must grant them stronger *exit* rights. If the co-op votes to restrict the API, the developers must have a guaranteed grace period or open-source license fallback. This aligns incentives: if the voters want to exploit the non-voters, the non-voters can leave, damaging the co-op. This makes the voters internalize the cost of exclusion.

  ### 4. Summary Recommendation
  You cannot solve this with a static boundary. You should treat the Charter Revision as a **Constitutional Convention**, not a standard election.

  1.  **Expand the Franchise for *This* Vote Only:** Allow the three contesting groups to vote on the Charter Revision, specifically on the sections that govern their relationship to the co-op. Use the **All-Subjected Principle** (binding rules/dependencies) to justify this.
  2.  **Decouple Voting Classes:** Codify that different charter sections may require different electorates (e.g., API terms require Developer approval; Budget requires Dues-payer approval).
  3.  **Insert a "Review Trigger":** The Charter must mandate a review of voting eligibility within 24 months, conducted by a body that includes non-voting stakeholders (via sortition).
  4.  **Trade Voice for Exit:** If a group is excluded from voting on a specific matter, they must be granted contractual protections (SLA, data portability) that make their dependency safe.

  This approach acknowledges that the boundary is somewhat arbitrary *today*, but builds a mechanism to correct that arbitrariness *tomorrow* without requiring the permission of those who benefit from it. It turns the "arbitrariness" into a provisional hypothesis to be tested, rather than a permanent feature of the constitution.
