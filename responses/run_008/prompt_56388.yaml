answer: |-
  This is a strong, punchy draft. It has a clear voice and a compelling hook. Because this is an essay for a general collection rather than a peer-reviewed journal, you have more license to be provocative than precise. However, since you specifically asked for a check on the philosophical underpinnings, I'm going to be direct about where the ground is shakier than it appears.

  Here are my thoughts based on your three questions.

  ### 1. Is the argument good, or just a stack of analogies?

  It is a good argument, but it relies heavily on the reader accepting your definition of "real."

  Right now, the logic moves like this: *Promises are real. Characters are like promises. Therefore, characters are real.* In philosophy, this is an argument by analogy. It works rhetorically because it feels intuitive, but logically, it begs the question. A skeptic could say, "A promise creates a social obligation, but a fictional character creates nothing but neural firings in my brain. They aren't the same kind of artifact."

  To strengthen this without getting bogged down in jargon, I would suggest grounding the "artifact" claim in **labor** rather than just ontology. You are a novelist. You know that a character is the result of work.
  *   **Suggestion:** Instead of just saying "somebody performed an act," emphasize the *craft*. A letter from a dead parent is real because physical ink was put on physical paper through an act of love. A character is real because psychological truth was encoded into language through an act of imagination. Both require a maker. This shifts the argument from "things exist" to "human effort creates lasting things." That feels more solid than the "promise/chess" analogy, which is a bit abstract.

  ### 2. Where are you stating contested views as settled?

  There are two main places where you are walking into a minefield, though for an essay of this length, you can probably walk through it if you watch your step.

  **A. The "Standard Puzzle" (The Paradox of Fiction)**
  You summarize the paradox well (often attributed to Colin Radford, 1975). However, you write: *"emotions require believing your object exists."*
  *   **The Contest:** Many philosophers of emotion dispute this. Some argue we can feel fear toward things we know aren't real (like a roller coaster or a horror movie) because the brain's threat detection system is faster than our rational belief system. Others (like Kendall Walton) argue we aren't feeling "real" sadness, but "quasi-sadness" within a game of make-believe.
  *   **The Fix:** You don't need to solve this, but soften the claim. Instead of "emotions require believing," try "We are often told that rational emotions require believing..." This frames it as a common intuition rather than a hard rule of cognitive science.

  **B. The "Confusion" Claim**
  You write: *"the 'paradox' rests on a confusion between two kinds of existence... philosophers just enjoy pretending otherwise."*
  *   **The Contest:** This is the riskiest line. Philosophers *do* distinguish between concrete existence (tables) and abstract existence (numbers, laws, artifacts). The debate isn't usually that they think Harry Potter is flesh and blood; the debate is about whether "abstract existence" is enough to sustain an emotional relationship. By saying philosophers "pretend otherwise," you risk setting up a straw man.
  *   **The Fix:** Frame this as a *novelist's* correction rather than a philosophical correction. You aren't telling them they are wrong about logic; you are telling them they are missing the *experience* of making the thing.

  ### 3. Is the "real as artifacts" idea original?

  I'm glad you asked this, because honesty here will save you from embarrassment. **This is not a new idea.**

  In the philosophy of art, this is known as the **Artifact Theory** of fictional entities. The most prominent contemporary defender of this view is **Amie Thomasson** (specifically her book *Fiction and Metaphysics*, 1999). She argues exactly what you are arguing: that fictional characters are abstract artifacts created by authors' mental acts, similar to laws or institutions.

  There is also a broader tradition of "institutional theory" in art (Arthur Danto, George Dickie) which argues art is real because the "artworld" says it is.

  **Does this mean you should change it?**
  Absolutely not. It's a great insight. But you should frame it differently.
  *   **Don't:** Present it as a philosophical discovery you made in a vacuum.
  *   **Do:** Present it as the *practitioner's version* of that truth. Philosophers argue about abstract artifacts from the outside; you create them from the inside.

  If you submit this claiming you solved a paradox philosophers have been stuck on for 50 years, a knowledgeable reader might roll their eyes. If you submit it saying, "Philosophers talk about abstract artifacts, but here is what it feels like from the workshop," it becomes authoritative testimony.

  ### Specific Line Edits & Tone (US English)

  The tone is confident and slightly combative ("philosophers just enjoy pretending otherwise"). If that's your brand, keep it. If you want to be more inviting, consider softening the end.

  *   **Current:** "My claim is that fictional characters are real -- real as artifacts."
  *   **Tweak:** "My claim is that fictional characters are real—specifically, real as artifacts." (Em dash usage is fine, just ensure consistency).
  *   **Current:** "...somebody performed an act of a certain kind, and now there's this thing."
  *   **Tweak:** This is a bit vague. Consider: "...somebody performed an act of creation, and now the thing persists."
  *   **Current:** "philosophers just enjoy pretending otherwise."
  *   **Tweak:** "philosophers sometimes overlook the distinction in favor of the puzzle." (Less adversarial, keeps the point).

  ### Summary Recommendation

  1.  **Acknowledge the lineage:** You don't need to cite Thomasson in a pop essay, but acknowledge that this is how *makers* see the world. "In my trade, we know..."
  2.  **Soften the "Belief" premise:** Acknowledge that the requirement for belief is a common assumption, not a law of physics.
  3.  **Lean into the Novelist Persona:** Your strength here isn't logic; it's authority. You build these artifacts. Your testimony that they are real carries more weight than a syllogism.

  It's a compelling piece. With those slight adjustments to the philosophical claims, it will be robust enough for a smart audience without losing its accessibility.
