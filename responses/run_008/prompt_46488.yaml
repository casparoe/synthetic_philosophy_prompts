      *   **The Task:** Deconstruct the proverb "don't throw good money after bad." Identify different interpretations/claims it could be making. Evaluate them (platitude, defensible, false). Explain which one is actually doing the work in ending arguments. Address the "time vs. money" wrinkle. Provide actionable advice if the strong reading is false.
      *   **Tone:** Analytical, nuanced, practical, empathetic but rigorous. Not dismissive of the roommate's feelings, but clear on the logic.
      *   **Key Insight Needed:** The user already suspects the "sunk cost fallacy" definition is too simple. They want to know about *forward-looking reasons* that look like sunk costs (reputation, self-trust, specific capital) and whether the proverb applies to time.

  2.  **Deconstruct the Proverb ("Don't throw good money after bad"):**
      *   *Literal Meaning:* Don't spend more money on a losing investment.
      *   *Economic Meaning (Sunk Cost Fallacy):* Past costs are irrelevant to marginal decisions. Only future costs and benefits matter.
      *   *Psychological/Pragmatic Meaning:* You are likely biased by your past investment, so be extra skeptical of continuing.
      *   *Moral/Character Meaning:* Admitting defeat is better than compounding a mistake.

  3.  **Evaluate the Claims (The "Readings"):**
      *   *Reading 1: The Strict Economic Definition (Sunk Costs are Zero).*
          *   Status: True but incomplete.
          *   Utility: Low for decision-making alone. It tells you what *not* to count, not what *to* count.
      *   *Reading 2: The Heuristic Warning (Bias Alert).*
          *   Status: Defensible/Useful.
          *   Utility: High. It warns against emotional attachment to past effort.
      *   *Reading 3: The Absolute Prohibition (Never Continue if Past Investment is High).*
          *   Status: False.
          *   Utility: Dangerous. Sometimes finishing is the rational choice *because* of the progress made (even if past cost is sunk, future cost is lower due to past progress).
      *   *Reading 4: The "Time is Money" Extension.*
          *   Status: Defensible with caveats.
          *   Utility: Relevant to the PhD context.

  4.  **Address the "Forward-Looking Reasons Wearing a Costume":**
      *   The user asks: Are things like "self-trust," "reputation," and "specific capital" sunk costs or future benefits?
      *   *Analysis:* These are *future* consequences of a *current* decision.
      *   *Example:* If I quit, I feel like a quitter (future psychological cost). If I finish, I have a PhD (future asset).
      *   *Verdict:* These are valid forward-looking reasons. They are *not* sunk costs. The proverb often mistakenly swats these away.

  5.  **Address the "Time vs. Money" Wrinkle:**
      *   The PhD year is funded. So it costs time/opportunity cost, not out-of-pocket cash.
      *   *Does the proverb apply?* Yes, metaphorically. "Good time after bad time."
      *   *Nuance:* Time is non-recoverable (more strictly sunk than money, which can be earned back). But the *value* of that time depends on the outcome.

  6.  **Synthesize the Argument Strategy for the User:**
      *   The user needs to talk to the roommate. Saying "your dad is wrong" is bad.
