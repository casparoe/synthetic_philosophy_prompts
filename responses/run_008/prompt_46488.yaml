answer: |-
  You are right to be suspicious. Your econ professor's ski trip story works in a textbook because it isolates variables; real life (and PhDs) are messy ecosystems of reputation, psychology, and human capital. The proverb "don't throw good money after bad" is doing heavy lifting in your roommate's head, but it's conflating three distinct logical claims. Only one of them is actually true, one is a useful heuristic, and one is flat-out false but often used to win arguments.

  Here is the breakdown of the readings, ranked by logical validity, followed by how to use this in the argument without sounding like a condescending economist.

  ### The Four Readings of the Proverb

  **1. The Accounting Rule (True, but Trivial)**
  *   **The Claim:** Resources already spent cannot be recovered. Therefore, they should not appear as a *cost* in a calculation about future action.
  *   **Verdict:** **Defensible/True.** This is the definition of a sunk cost.
  *   **Utility:** Low. It tells you what to ignore, but it doesn't tell you what to do. It clears the deck, but it doesn't play the hand.
  *   **Why it fails here:** Your roommate knows the four years are gone. She isn't arguing she can get them back. She is arguing that the *position* she is in now (4 years in vs. 0 years in) changes the value of the next year.

  **2. The Bias Warning (Defensible, Useful)**
  *   **The Claim:** Humans are psychologically prone to valuing things more highly simply because they have suffered to acquire them (effort justification). Therefore, if your *only* reason for continuing is "I've already done so much," you are likely biased.
  *   **Verdict:** **Defensible.** This is the psychological heuristic version.
  *   **Utility:** High. It acts as a circuit breaker for emotional reasoning.
  *   **Why it fails here:** It assumes the *only* reason to continue is emotional attachment to the past. It ignores that being 4 years in might objectively make the 5th year more valuable or less costly than starting over elsewhere.

  **3. The Absolute Veto (False, but Argument-Ending)**
  *   **The Claim:** It is *always* irrational to continue an endeavor if the primary motivation is related to past investment.
  *   **Verdict:** **False.**
  *   **Utility:** High (rhetorically). This is the version her dad used to end the argument. It sounds like wisdom, but it's a logical error.
  *   **Why it fails here:** Past investment often creates **specific human capital**. If she quits, she loses the specific knowledge that makes Year 5 easier than Year 1 would be for someone else. That isn't honoring a sunk cost; it's leveraging an asset.

  **4. The Signal Theory (Nuanced, Often Overlooked)**
  *   **The Claim:** Quitting incurs future costs (reputation, self-trust, explaining gaps) that continuing avoids.
  *   **Verdict:** **Defensible.**
  *   **Utility:** Critical. This is where the "costume" question comes in.
  *   **Why it matters:** You asked if things like "self-trust" or "career capital" are just sunk costs wearing a costume. **They are not.** They are *forward-looking consequences*.
      *   *Sunk Cost:* "I suffered for 4 years." (Irrelevant)
      *   *Future Cost:* "If I quit now, I will feel like a failure for the next 10 years and employers will ask why." (Relevant)
      *   The proverb often mistakenly swats these valid future concerns away by labeling them "throwing good money after bad."

  ### The Time vs. Money Wrinkle

  You noted she is funded, so the cost is time, not money. Does the proverb apply?

  *   **Yes, but more strictly.** Money is fungible; you can earn more money. Time is non-fungible; you cannot earn more time.
  *   **However:** The value of time is determined by the *output* of that time.
      *   Spending one year to get a credential that yields $20k/year more for 40 years is a "good" use of time.
      *   Spending one year to get a credential that yields nothing but misery is a "bad" use of time.
  *   **The Trap:** The proverb implies the time is "bad" because the *past* time was painful. But the *future* time might be "good" if it results in completion. The question isn't "Is this time costly?" (all time is costly). The question is "Is this time *productive*?"

  ### Why the Textbook Version Feels Different

  Your econ prof's ski trip story works because it assumes a **closed system**.
  *   *Ski Trip:* You bought a ticket, it's snowing, you're sick. If you go, you pay $50 + misery. If you stay, you pay $0 + rest. The ticket price is gone either way.
  *   *PhD:* This is an **open system**.
      *   If she quits, she doesn't just "save" the year. She incurs transaction costs (finding a new job, explaining the gap, loss of specific capital).
      *   If she stays, she doesn't just "spend" the year. She acquires an asset (the degree) that changes her future earning power and options.
      *   The ski trip is consumption; the PhD is investment. The proverb works better for consumption.

  ### How to Argue This (Without Saying "Your Dad is Wrong")

  If you tell her "that's the sunk cost fallacy," she will hear "your feelings are irrational." Instead, you need to shift the ledger from **Past Costs** to **Future Net Value**.

  Here is the script/strategy:

  **1. Validate the Proverb's Core (The Bias Warning)**
  > "I think your dad is right about one thing: we shouldn't do things *just* because we've already suffered through them. If the only reason to stay is 'I've already done 4 years,' then yeah, that's throwing good time after bad."

  **2. Introduce the "Asset" Counter-Point (Specific Capital)**
  > "But the ski trip story doesn't fit here. In a ski trip, the ticket doesn't make the skiing easier. In a PhD, the 4 years you did make this last year easier. You aren't starting from zero. You're starting from year 4. That's not a sunk cost; that's an asset you own. The question isn't about the past 4 years; it's whether the *next* year buys you something the market values."

  **3. Separate "Self-Trust" from "Sunk Costs"**
  > "You mentioned not wanting to break your own rules. That's not a sunk cost. That's a future cost. If quitting now makes it harder for you to trust yourself to finish hard things later, that's a real price you'll pay in the future. We have to count that. But we also have to count the price of staying: will one more year of misery burn you out so bad you can't work in the field anyway?"

  **4. The Decision Matrix (The "Good Money" Test)**
  > "Let's rephrase the proverb. Instead of 'Good Money After Bad,' ask: 'Is this Good Time for Good Returns?'
  > *   **Scenario A:** You stay. Cost: 1 year of misery. Return: PhD, higher salary, closure.
  > *   **Scenario B:** You quit. Cost: Job hunt, explaining gap, no PhD. Return: Immediate relief, new path.
  >
  > If the PhD is worth $0 to you in the job market, or if the misery will cause a breakdown, then the 'Good Money' (your next year) *is* being thrown after bad. But if the degree is the key to the life you want, then spending the year isn't 'throwing' it—it's investing it."

  ### The Bottom Line for You

  The strong reading of the proverb ("Never continue based on past investment") is **false**. Past investment often lowers future marginal costs (you know the material, you know the advisor, you have data).

  **What to say to her instead:**
  > "Your dad's advice is a warning against bias, not a rule of logic. It means 'Don't let the past blind you to the future.' But the past isn't just money gone; it's leverage gained. If you quit, you lose the leverage. If you stay, you spend the leverage. The only question that matters is: **Is the degree worth the price of the next year, ignoring the last four entirely?** If the answer is yes, you aren't throwing good money after bad. You're closing a deal."

  This respects the wisdom of the proverb (don't be biased) while correcting the application (don't ignore the assets you've built). It moves the argument from "Was the past a mistake?" (which is depressing and unchangeable) to "Is the future a good buy?" (which is actionable).
