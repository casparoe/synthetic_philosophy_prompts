  ### Predicted Rulings

  1.  **Contractor-Run Golf Cart Shuttle:** **Permitted.**
      *   **Reasoning:** While the operator is a contractor charging a fee rather than a city employee, the *function* is identical to the previously permitted parks department shuttle (assisting visitors with limited mobility). Your cousin's record shows she prioritizes the *mission* of the vehicle (accessibility/official service) over the employment status of the driver. Distinguishing this from the prohibited ice cream truck, the fee here is likely for cost-recovery or service provision aligned with park access, rather than purely private commercial solicitation.

  2.  **Fully Electric Food Truck:** **Prohibited.**
      *   **Reasoning:** Despite being silent (addressing the "quiet" concern), this vehicle falls under the same rationale as the prohibited ice cream truck: it is a private commercial enterprise entering the park to sell goods. Your cousin's rulings suggest that private commercial intrusion is barred regardless of noise levels, as it conflicts with the park's recreational mission and creates a zone of private commerce within public space.

  3.  **Autonomous Delivery Robot:** **Permitted.**
      *   **Reasoning:** This is the closest call, but likely permitted. Unlike the food truck, the robot is not parking to solicit sales; it is delivering supplies to an existing park concession (the café). Furthermore, its small size, pedestrian speed, and silence align perfectly with the "safety and quiet" purpose of the ordinance. It does not threaten the park's atmosphere in the way a motorcycle or truck does.

  ### Interpretive Rule

  The rule that best fits your cousin's record is a **Purposivist reading aimed at quiet, safety, and the park's recreational mission.**

  While she respects textual limits (e.g., allowing the pushed motorcycle because it wasn't being "operated"), her exceptions for the ambulance, mower, and golf cart cannot be justified by text alone. A strict textualist would ban all motor vehicles regardless of who drives them or why. Instead, she admits vehicles that serve the park's official function (maintenance, accessibility, emergency) and bans those that disrupt the park's environment (noise, private commerce). She uses text only when the purpose is neutral (the broken motorcycle); when the purpose is clear, it overrides the literal text.

  ### The Separating Case

  The pending case that best separates the **Purposivist** rule from a **Textualist** rule (ordinary meaning of "motor vehicle") is the **Autonomous Delivery Robot**.

  *   **Textualist View:** A textualist focusing on the ordinary meaning of "motor vehicle" would likely classify a self-propelled, motorized machine as a vehicle. Since the ordinance says "No person shall operate," and the robot is a motorized device moving through the park, a textualist would likely **Prohibit** it to maintain the bright-line rule of the text.
  *   **Purposivist View:** Your cousin, focusing on the *purpose* (safety, quiet, recreation), would see the robot as functionally distinct from a car or truck. It poses no threat to safety, creates no noise, and facilitates park services. Thus, she would **Permit** it.
  *   *(Note: The Contractor case is less effective at separating the rules because a textualist might defer to the precedent of the golf cart, whereas the Robot has no precedent and challenges the core definition of the banned object.)*

  ### The Cleanest Hypothetical Separator

  To separate these two interpretive rules most cleanly, consider this hypothetical case:

  **A horse-drawn carriage offering tours through the park.**

  *   **Textualist Ruling:** **Permitted.** The ordinance explicitly bans "motor vehicles." A horse is not a motor. The text is clear, and a textualist must follow the ordinary meaning of the words, regardless of the outcome.
  *   **Purposivist Ruling:** **Prohibited.** The purpose of the ordinance is to ensure safety, quiet, and cleanliness. A horse-drawn carriage creates noise (hooves, whips), safety hazards (spooked animals), and sanitation issues (manure). It violates the *spirit* of the ban on disruptive transport, even if it technically fits outside the *letter* of the law.

  This case cleanly inverts the outcome: the Textualist allows what the Purposivist bans, exposing the fundamental divergence between following the words versus following the intent.
