prompt: |-
  I am a PhD student in cognitive science working on judgment and decision making; my advisor's group consults for the research office of a large public university, and I have been handed a task that is proving harder than it looks. The office convenes committees that choose everything from survey software to data-management platforms for funded projects — fifteen to twenty decisions a year, ranging from a few thousand dollars to several hundred thousand, each one documented because the outcomes get audited when a grant is questioned. The committees' standing complaint is not that they choose badly but that they cannot stop choosing: vendors keep submitting proposals past the deadline, a search for what else is out there never terminates, and the same committee can burn three meetings on a $6,000 decision. My advisor, who is fond of Herbert Simon, has asked me to translate bounded rationality into something the committees can actually run, and I would like your help drafting it.

  What we need is a decision procedure for when to stop generating options and commit to one — a stopping rule, in effect — that a committee of non-specialists can execute inside a single ninety-minute meeting with no math beyond counting and no software. It should be grounded in the bounded rationality tradition: search is costly, the relevant standard is an aspiration level rather than the optimum, and a satisfactory option is the target rather than the best one. But the translation is where I keep getting stuck, and I want you to take the following complications seriously rather than smoothing them over.

  First, aspiration levels in the literature are allowed to adjust as the search proceeds — Simon made the adjustment of aspirations central to the account — but committees adjust them in a specific way I have not seen discussed: after a surprisingly strong proposal arrives, the committee's standards ratchet upward, so that options that would have counted as satisfactory last month no longer do. Whether that upward drift is legitimate (they have learned the market is better than they thought) or illegitimate (it is regret and social comparison dressed up as evidence) seems to depend on facts the procedure cannot see. The procedure has to say something about when adjustment of the standard is allowed and in which directions.

  Second, option arrival is asynchronous. There is no natural point at which the option pool is complete; new proposals arrive while the committee deliberates. So the procedure actually needs two separate stopping decisions — when to close the pool to new options, and when to stop evaluating the ones already in hand — and I suspect these come apart in ways that matter, because closing the pool early forecloses and closing it late just delays the same choice.

  Third, sunk costs. Committees that have spent four meetings on a search refuse to commit to the satisfactory option on the table because they feel they have come too far to settle. Any honest procedure has to handle the case where its own rule says to stop and the committee's psychology says to continue, and it cannot do so by fiat, since the committee members outrank the procedure.

  Please write the procedure: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure stops with a commitment, where it stops with a continue-searching verdict, and where it hands the decision to the committee because the question is one of values rather than facts. It must produce an auditable record — the office gets asked, a year later, why a platform was chosen — so each step should leave a trace a non-member could read after the fact. Then run it on three cases from our files: (a) a survey platform for a three-year longitudinal study, where one platform meets every stated requirement but a committee member keeps forwarding one more to look at; (b) a data-manager hire where a clearly satisfactory candidate has an offer expiring Friday while a stronger applicant might still materialize; and (c) a $400,000 platform decision where the procedure, as far as I can tell, will commit the committee to the second-best option, which I expect they will hate. Please say plainly what the procedure cannot do — where it will systematically misfire and which judgment calls I have tried to disguise as facts — rather than pretending the procedure eliminates judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** PhD student in cognitive science (JDM focus).
      *   **Context:** Advisor's group consults for a university research office. Committees make 15-20 procurement/hiring decisions/year ($3k-$400k+).
      *   **Problem:** Committees can't stop searching (option generation/evaluation paralysis). They burn too many meetings on small decisions. Audits require documentation.
      *   **Theoretical Basis:** Bounded Rationality (Herbert Simon). Search is costly, aspiration levels, satisficing (not optimizing).
      *   **Specific Constraints:**
          *   Single 90-minute meeting execution.
          *   No math beyond counting.
          *   No software.
          *   Must be auditable (leave a trace).
          *   Must handle three specific complications:
              1.  *Aspiration Adjustment:* Ratcheting standards up after good finds (legitimate learning vs. illegitimate greed/regret).
              2.  *Asynchronous Arrival:* Two stopping points (close pool vs. commit to choice).
              3.  *Sunk Costs:* Psychology of "we've come too far to settle" vs. rule saying "stop."
      *   **Deliverables:**
          *   The Procedure (questions, order, sufficient answers, stop/continue/hand-off points).
          *   Application to three specific cases (Survey platform, Data-manager hire, $400k platform/second-best option).
          *   Limitations section (what it can't do, where it misfires, disguised judgment calls).

  2.  **Deconstruct the Theoretical Challenge:**

      *   *Simon's Satisficing:* Set an aspiration level ($A$). Search until an option $\ge A$ is found. Stop.
      *   *Complication 1 (Aspiration Drift):* If $A$ moves up every time a good option appears, search never ends. The procedure needs a "Lock-In" mechanism for $A$.
      *   *Complication 2 (Two Stops):* Need a rule for "Search Termination" (no more new options) and "Selection Termination" (pick one from the pool).
      *   *Complication 3 (Sunk Cost/Authority):* The committee has power. The procedure can't override them, only guide/documentation. It needs a "Override Protocol" that makes the cost of continuing explicit for the audit trail.

  3.  **Drafting the Procedure (The "Simon Protocol"):**

      *   *Goal:* Make it actionable, auditable, and psychologically aware.
      *   *Structure:* Pre-meeting prep, Phase 1 (Aspiration Locking), Phase 2 (Pool Closure), Phase 3 (Selection), Phase 4 (Override/Audit).
      *   *Addressing Aspiration Drift:* Define $A$ *before* looking at specific current options, based on *needs*, not *market availability*. Allow adjustment only if *requirements* change, not if *options* improve.
      *   *Addressing Asynchronous Arrival:* Set a hard deadline for the "Pool." Once Phase 2 starts, new options go to a "Waitlist" for next time (or future projects), not this decision.
      *   *Addressing Sunk Costs:* Explicitly record "Meetings Spent" vs. "Decision Value." If continuing, they must sign off on the cost.

      *   *Refining the Steps:*
          1.  **Define Needs (The "Why"):** What problem are we solving?
          2.  **Set Aspiration (The "Good Enough"):** Minimum viable specs. *Crucial:* Lock this before reviewing specific vendors.
          3.  **Count Search Cost:** How many meetings/hours already spent?
          4.  **Pool Closure Rule:** Is there a satisfactory option? If yes, close pool.
          5.  **Selection Rule:** Pick the first satisfactory one (or the best of the satisfactory ones if time permits, but stick to satisficing).
          6.  **The "Continue" Vote:** If they want to keep searching despite a satisfactory option, they must document *why* the aspiration was wrong, not just "maybe better."

  4.  **Developing the Three Cases:**

      *   *Case A (Survey Platform):* One meets requirements. Member keeps forwarding more.
          *   *Application:* Aspiration was met. Pool should close. Member's new options are "Post-Closure." Procedure says Stop. If they continue, audit trail shows "Search Cost Exceeded Value."
      *   *Case B (Hiring):* Satisfactory candidate with expiring offer vs. potential superstar.
          *   *Application:* This is risk, not just search. The "potential" candidate is not in the pool. Procedure says take the satisfactory one *unless* the cost of the risk (losing the good one) is explicitly accepted. This highlights the "Uncertainty" limitation.
      *   *Case C ($400k Platform):* Procedure picks 2nd best (first satisfactory). Committee hates it.
          *   *Application:* High stakes usually trigger optimizing behavior. The procedure forces satisficing. If they override, they must document that "Optimization is required here," effectively flagging the procedure as inappropriate for *this* specific class of decision (or revealing the aspiration level was set too low).

  5.  **Addressing the Limitations (The "Honesty" Section):**

      *   The procedure cannot distinguish between "legitimate learning" and "greed" regarding aspiration levels without external validation.
      *   It cannot predict the future (Case B).
      *   It cannot force compliance (Case C); it only increases the transaction cost of irrationality.
      *   It disguises value judgments (e.g., setting the aspiration level) as technical steps.

  6.  **Refining the Tone:**

      *   Academic but practical.
      *   Respectful of the committee's authority but firm on the logic.
      *   Clear audit trail focus.
      *   Acknowledge the "Human Factor" (sunk costs).

  7.  **Self-Correction/Iterative Polish during drafting:**

      *   *Initial thought:* Maybe use a scoring matrix? *Correction:* No, prompt says "no math beyond counting." Keep it binary (Meets/Does Not Meet).
      *   *Initial thought:* Let them adjust aspirations if they vote. *Correction:* Too easy to game. Require a "Requirement Change Form" to adjust aspirations, separating *needs* from *wants*.
      *   *Focus on the Audit:* Every step needs a "Record This" instruction.
      *   *Addressing the "Two Stops":* Make sure Phase 2 (Close Pool) is distinct from Phase 3 (Pick Winner).

  8.  **Final Review against Constraints:**

      *   90-minute meeting? Yes, the procedure is designed to fit.
      *   No software? Yes, paper forms/checklists.
      *   Auditable? Yes, specific documentation steps.
      *   Handles the 3 complications? Yes (Aspiration Lock, Pool Closure, Override Protocol).
      *   Handles the 3 cases? Yes.
      *   Limitations section included? Yes.

  9.  **Final Polish:** Ensure the distinction between "Search Stopping" (pool) and "Decision Stopping" (selection) is clear. Ensure the "Sunk Cost" section doesn't sound accusatory but rather administrative. (e.g., "Cost of Delay" log).

  *(Self-Correction on Case C)*: If the procedure commits to the second-best, but the committee hates it, does the procedure fail? No, the procedure reveals that the *Aspiration Level* was set incorrectly (too low) or that the decision warrants *Optimization* rather than *Satisficing*. The procedure should allow an "Escalation" path for high-stakes decisions where satisficing is deemed too risky. I need to make sure the procedure allows for "This decision is too big for this protocol."

  *(Refining the Aspiration Adjustment)*: Simon said aspirations adjust based on experience. The prompt says committees adjust based on *new options*. The procedure must forbid adjusting aspirations based on *options found*, only based on *new information about needs*. This is the key friction point.

