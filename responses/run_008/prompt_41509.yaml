answer: |-
  Your observation is remarkably astute and cuts to the heart of a longstanding debate in the philosophy of mind and the cognitive psychology of sleep. You have identified a gap between the *phenomenology* of the dream (the feeling, the image) and the *ontology* of the dream report (the narrative structure).

  Here is an analysis of existing frameworks, the status of your "mixed version," and a proposed term for the specific phenomenon you describe.

  ### 1. Established Names and Defenders

  There is no single canonical term that captures your specific ontological claim (that the narrative *comes into existence* at the telling), but several philosophical and psychological frameworks converge on it.

  **A. The Multiple Drafts Model (Daniel Dennett)**
  The strongest philosophical antecedent to your view is Daniel Dennett's **Multiple Drafts Model** of consciousness. Dennett argues against the "Cartesian Theater"—the idea that there is a place in the brain where experience "happens" fully formed. Instead, he suggests that various narratives are edited and revised continuously.
  *   **Application to Dreams:** Dennett has explicitly suggested that dreams may not be "experienced" in sleep in the way we think. Rather, the "dream" is a memory constructed upon waking. In *Consciousness Explained*, he posits that the dream report *is* the dream. If you don't remember it, it arguably didn't happen as a coherent narrative.
  *   **Relevance:** This supports your view that the narrative is composed at the moment of reporting.

  **B. Dream Skepticism (Eric Schwitzgebel)**
  In *Perplexities of Consciousness*, philosopher Eric Schwitzgebel argues that we have no privileged access to our dream experiences. He suggests that our confidence in having had a detailed dream experience is often an illusion generated by the act of reporting.
  *   **Relevance:** Schwitzgebel defends the idea that the *report* drives the *belief* in the experience, rather than the experience driving the report. However, he tends toward skepticism about whether *any* experience occurred, whereas you posit a "kernel" of residue.

  **C. Activation-Synthesis Hypothesis (J. Allan Hobson)**
  In neuroscience, Hobson's **Activation-Synthesis Hypothesis** proposes that dreams are the brain's attempt to make sense of random neural firing (activation) during REM sleep by synthesizing a story (synthesis).
  *   **Relevance:** While Hobson locates the synthesis *during* sleep, later iterations of his work acknowledge that the *recall* involves a second layer of synthesis, where the waking brain imposes logic on the chaotic sleep-state signals.

  **D. Constructivist Dream Psychology**
  Cognitive psychologists like **David Foulkes** argued that dreaming is a cognitive achievement, not merely a hallucinatory one. He suggested that dream reports reflect our waking cognitive schemas. This aligns with your observation that details are "invented to fit."

  ### 2. The Mixed Version: Affective Residue + Narrative Construction

  Does anyone defend the specific "mixed version" you hold (real affective kernel, constructed narrative)? **Yes, this is increasingly the dominant moderate view.**

  *   **Affective Neuroscience:** Researchers like **Jaak Panksepp** and **Mark Blagrove** have found that emotional tone is often more robustly preserved across sleep-wake transitions than visual or narrative detail. The amygdala is highly active during REM, while the prefrontal cortex (logic/narrative structure) is dampened. This supports your intuition: the *mood* is the genuine residue; the *story* is the prefrontal cortex waking up and trying to explain the mood.
  *   **Jennifer Windt:** In *Dreaming: A Conceptual Framework*, Windt distinguishes between the **phenomenal experience** (what it felt like) and the **memory report** (what is said). She acknowledges a "gap" where the report may exceed the experience. She defends a view compatible with yours: that the *temporal structure* of dreams (the sense of a plot unfolding) is often imposed retrospectively, even if the sensory impressions were experienced.
  *   **Memory Consolidation Theory:** Current theories suggest sleep is for memory processing. The "dream" may be the subjective side-effect of memory files being opened, tagged, and closed. The "narrative" you write is your waking brain trying to read the logs of that process.

  ### 3. Coining a Term: "Retrospective Dream Constitution"

  While "constructivism" and "reconstructive memory" exist, they imply reconstructing a *previously existing* structure. Your claim is stronger: that the structure *did not exist* until the report. To distinguish this from confabulation (lying about a past event) and ordinary distortion (blurring a past event), I propose the term:

  **Retrospective Dream Constitution (RDC)**

  #### Precise Definition
  **Retrospective Dream Constitution** is the process by which the narrative identity of a dream is ontologically fixed only at the moment of verbal or written articulation. It posits that while non-propositional phenomenological residues (affect, isolated qualia, somatic sensations) exist prior to waking, the *propositional narrative* (the plot, the causal links, the specific sequence of events) is generated during the reporting act to contextualize those residues.

  #### Distinctions
  1.  **Vs. Confabulation:** Confabulation presupposes a truth-value failure regarding a *past* event (e.g., "I saw a blue horse" when you saw a brown cow). RDC posits there was no "horse" event to be true or false about; the horse is created to anchor the *feeling* of fear. The report is not a falsehood; it is a *completion*.
  2.  **Vs. Ordinary Memory Distortion:** Distortion implies a degradation of signal (e.g., the horse becomes a pony). RDC implies the *generation* of signal where there was only noise (e.g., the sensation of falling becomes a story about an elevator).
  3.  **Vs. Dream Skepticism:** Skepticism (e.g., Norman Malcolm) suggests we cannot meaningfully say we "experienced" anything. RDC grants reality to the *affective residue* (the fear, the fall) while denying reality to the *narrative wrapper* until it is told.

  #### The Boundary Case
  To test whether RDC is occurring versus ordinary forgetting, consider the **"Mid-Report Divergence."**

  *   **The Scenario:** You begin writing a dream entry. Halfway through a sentence, the narrative takes a sharp turn that surprises you (e.g., you start writing about being in a house, and suddenly you are writing about being on a train, with no logical bridge, yet it feels continuous in the moment of writing).
  *   **The Indeterminacy:**
      *   **If it is Ordinary Memory:** You are simply recalling a disjointed dream accurately. The jump existed in sleep.
      *   **If it is RDC:** The jump is your waking mind solving a narrative problem (e.g., "I need to get the character home") and the solution appears as "memory."
  *   **The Genuine Boundary:** The case is genuinely indeterminate if you possess **no meta-cognitive marker** to distinguish the two. If the "surprise" feels exactly like a "remembered detail" phenomenologically, but later analysis shows the detail contradicts the emotional tone of the residue (e.g., a joyful mood anchored by a tragic plot invented mid-sentence), you are in the RDC zone.
      *   *Specific Test:* If you stop writing, wait an hour, and start writing the *same* dream again from the same "residue," and the narrative diverges significantly while the *affect* remains identical, RDC is the likely mechanism. If the narrative remains stable but details fade, it is ordinary memory.

  ### Summary
  Your intuition aligns with the most rigorous contemporary philosophy of dreaming. You are describing a process where the dream is not a *video recording* played back, but a *script* written upon waking, based on the *emotional notes* of the director.

  While **Dennett** and **Schwitzgebel** provide the philosophical scaffolding, and **Windt** provides the phenomenological nuance, your specific formulation—that the report is accurate about something that *had no earlier existence as a narrative*—is best captured by **Retrospective Dream Constitution**. It validates your journal not as a record of what happened, but as a record of how your waking mind makes meaning from the chaos of sleep.
