answer: |-
  To the Content Policy and Engineering Leadership Team,

  You asked for a decision procedure that grounds our moderation workflow in the actual philosophical and legal distinctions between the American and European traditions rather than a vague summary, and specifically one that acknowledges the contradiction in our own policy which stapled together a commitment to viewpoint neutrality with a commitment to preventing demeaning content. The following is a draft of that procedure, designed for a reviewer with ninety seconds per item and no legal training, along with an analysis of where it will fail and why we must be honest about the limits of engineering a solution to a values problem.

  The procedure begins with a triage question that separates conduct from speech. The reviewer must ask whether the post contains a direct threat of violence, doxxing, or spam. If yes, remove immediately under existing protocols. If no, the reviewer moves to the core conflict in our policy. The second question asks whether the content targets a specific individual or a protected group based on immutable characteristics such as race, ethnicity, religion, nationality, or sexual orientation. If the content does not target a group or individual based on these characteristics, it is treated as general discourse and allowed, preserving our commitment to viewpoint neutrality. This captures the American tradition where offensive ideas are protected unless they incite imminent lawless action. However, if the content does target a protected group, the procedure moves to the third question, which is where the American and European traditions diverge and where we must quietly pick a winner. The question is whether the content demeans the humanity of the group using dehumanizing language, slurs, or assertions of inherent inferiority, regardless of whether it calls for imminent violence. Here, the procedure instructs the reviewer to remove the content if it demeans. This prioritizes the European dignity model over the American liberty model. We do this because our policy explicitly states there is no place for content that demeans people for who they are, and legally, the risk of liability in European jurisdictions for hosting hate speech outweighs the risk of liability in American jurisdictions for removing controversial opinions. A neutral venue does not require hosting abuse. If the content attacks the group's dignity, it is removed. If the content argues against the group's ideas, policies, or behaviors without attacking their inherent humanity, it is allowed. This distinction between attacking who people are versus what they think is the critical filter. If the reviewer cannot determine whether the language is demeaning versus merely critical within the ninety-second window, or if the content is a sincere religious or philosophical doctrinal statement that implies inferiority but uses clinical or theological language rather than slurs, the procedure mandates an escalation to the team lead. This is the only place we punt upward, acknowledging that this is a values question a binary procedure cannot answer, but we must keep this under two percent of volume or the system collapses.

  Running this procedure on the three items you highlighted yields specific results. The first item, a post saying adherents of a religion should be barred from holding public office, is allowed. Under the procedure, this targets a religious group, but it argues for a political restriction based on affiliation rather than using dehumanizing language or asserting inherent biological inferiority. It falls under contested opinion about civic structure, which our neutrality clause protects, even if it is discriminatory in effect. The second item, a satirical meme describing a national group as vermin posted by someone with a history of sincere political rants, is removed. The use of vermin is dehumanizing language that targets a national group based on immutable characteristics. The history of sincere rants removes the defense of pure satire, indicating the speech acts as a signal of hostility rather than humor, satisfying the demeaning condition. The third item, a sincere doctrinal statement that a sexual minority is disordered posted in a community where members of that minority are regulars and have asked us to intervene, is removed. This is the closest call. While it is a sincere doctrinal statement, which might suggest viewpoint neutrality, the assertion that a group is disordered based on sexual orientation is an assertion of inherent inferiority that demeans them for who they are. The procedure prioritizes the safety and dignity of the community members requesting intervention over the doctrinal expression. I suspect this is the answer you personally might not like, regardless of your stance, because it requires the platform to adjudicate theological truth claims and decide that a sincere religious belief constitutes demeaning speech, which feels like censorship to some and necessary protection to others. It forces us to decide that dignity trumps doctrine in our specific community context.

  However, I need to be honest about where this procedure will misfire. It will systematically get wrong cases where cultural context changes the meaning of words, such as reclaimed slurs used within a community versus by outsiders, because a reviewer with ninety seconds cannot research community norms. It will flood the escalation queue when political discourse inevitably bleeds into identity attacks, such as arguing that a specific immigration policy is harmful versus arguing that immigrants are harmful, because reviewers will err on the side of removal to avoid liability. No procedure of this kind can resolve the fundamental tension in our policy because the tension is not logical but ethical. We have promised to be a town square and a safe space simultaneously, and in the grey zone, those two things are mutually exclusive. Engineering a decision tree gives the appearance of consistency, but it cannot absorb the moral weight of deciding whose dignity matters more than whose speech. If we sell this to leadership as a fix that eliminates ambiguity, we are lying. It is a triage tool that manages risk, not a solution that resolves the conflict. The only way to truly solve this is to rewrite the policy to admit that we are not neutral when speech becomes demeaning, rather than pretending we can be both. Until then, this procedure is the best we can do to keep the reviewers from burning out while minimizing legal exposure, but it will not stop the reversals from making the news.
