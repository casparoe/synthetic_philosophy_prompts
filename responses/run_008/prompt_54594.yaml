  Here's my opening move: on the self-indication assumption, my evidence isn't just "I'm roughly the hundred-billionth human" but "someone exists at all", and hypotheses with more observers make that second piece of evidence more likely. Run the Bayes on a two-case scenario — humanity ends soon, or humanity goes on to trillions of people: the extra likelihood that big-population hypotheses put on my existing exactly cancels your doomsday update, so the argument does literally nothing. And don't bother trotting out the problems with SIA itself, the Presumptuous Philosopher stuff — I'll grant you all of it for now, because my point isn't that SIA is true. My point is that if either SIA or SSA is right, your conclusion hangs on a coin flip between two assumptions, and there's no neutral ground from which to argue for one over the other without already helping yourself to the framework that settles the question. Isn't your confidence in doom itself, then, completely unmotivated?

