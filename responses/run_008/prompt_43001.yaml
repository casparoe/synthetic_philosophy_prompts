prompt: |-
  Two of my flatmates, Nadia and Tom, have been going at it for a week over something that happened to my cousin, and I've been asked to referee, which I'm clearly not up to. My cousin and his friend both left the same party, equally drunk, and drove home the same route. My cousin made it fine. The friend mounted a kerb and put a pedestrian in hospital. Neither had ever driven drunk before or since, they'd both been drinking the same amount, and there was no difference in their choices all night — only in what happened ten metres from the party. (1) Nadia said the friend is simply a worse person now: he nearly killed someone, that's a moral fact, and the fact that my cousin got lucky doesn't put them on the same level. (2) Tom said that's textbook moral luck — if every choice was identical, their culpability is identical, and the difference is just the lottery of what the world did with those choices. (3) Nadia said fine, but the law disagrees for good reason: we punish the completed harm more than the near miss, because a system that punished inner wickedness equally would need to read minds, and any workable institution has to punish what actually happens. (4) Tom said she'd quietly changed the subject — that's an argument about what law should do, not about what people deserve, and anyway if she follows her logic consistently she has to also say my cousin deserves equal praise to someone who drunkenly swerved and happened to save a child, which she'd never accept. (5) Nadia said she actually would accept that, sort of — praise for heros is partly just luck too and she's fine biting that bullet, but blame is different because blame answers to the victim. (6) Tom said he doesn't see how a victim's existence can create desert, since the driver's character is the same either way — and besides, even the choices themselves are downstream of luck (temperament, upbringing), so Nadia's view has to explain where the luck stops mattering, and hers just doesn't. Please adjudicate each of the six moves — say who's right about what, whether anyone is talking past each other, and who comes out more right overall. Answer in British English, and don't bother being diplomatic — they weren't.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Two flatmates (Nadia and Tom) are arguing about a moral dilemma involving my cousin and his friend (both drunk drove, one hit a pedestrian, one didn't).
      *   **Task:** Adjudicate each of the six moves in their argument. Determine who is right about what, identify if they are talking past each other, and decide who comes out more right overall.
      *   **Tone/Style:** British English. No diplomacy (be direct/blunt).
      *   **Core Philosophical Issue:** Moral Luck (specifically resultant luck) and the tension between moral desert and legal/practical accountability.

  2.  **Deconstruct the Six Moves:**

      *   **Move 1 (Nadia):** The friend is a worse person *now* because he nearly killed someone. Outcome matters for moral status. Cousin got lucky, but they aren't on the same level.
          *   *Analysis:* This is the intuitive, non-philosophical view. It conflates outcome with character. It ignores the "luck" element explicitly mentioned in the prompt (identical choices).
          *   *Verdict:* Philosophically weak, intuitively strong.

      *   **Move 2 (Tom):** Textbook moral luck. Identical choices = identical culpability. Outcome is a lottery.
          *   *Analysis:* This is the standard Nagel/Williams position on moral luck. Logically consistent if one accepts control as a prerequisite for moral worth.
          *   *Verdict:* Philosophically robust.

      *   **Move 3 (Nadia):** The law disagrees for good reason. We punish harm more than near miss because institutions can't read minds; they punish what happens.
          *   *Analysis:* Shifts from *moral desert* to *legal pragmatism*. This is a valid point about legal theory (resultant luck in law), but she's using it to defend a moral claim (Move 1).
          *   *Verdict:* Correct about law, but potentially conflating law with morality.

      *   **Move 4 (Tom):** Accuses Nadia of changing the subject (law vs. desert). Points out the symmetry problem: if luck affects blame, it must affect praise (the "drunken saviour" counterexample).
          *   *Analysis:* Strong logical trap. If outcome determines moral worth, positive outcomes from bad intentions should generate praise. Nadia's inconsistency is exposed.
          *   *Verdict:* Very strong logical point.

      *   **Move 5 (Nadia):** Accepts the praise bullet (heroes are lucky too) but distinguishes blame because blame answers to the victim.
          *   *Analysis:* Shifts to a victim-centred ethics (relational morality). Blame isn't just about the agent; it's about the relationship to the harmed.
          *   *Verdict:* Interesting pivot. Moves from agent-centric to victim-centric. Plausible but changes the definition of "blame."

      *   **Move 6 (Tom):** Victim's existence doesn't create desert (character is the same). Plus, the "regress argument" (choices are downstream of luck anyway - upbringing, temperament). Nadia's view has no stopping point.
          *   *Analysis:* Hard determinist/compatibilist angle. If luck permeates everything (constitutive luck), drawing a line at *resultant* luck is arbitrary.
          *   *Verdict:* Philosophically deep, but potentially leads to nihilism about responsibility.

  3.  **Evaluate "Talking Past Each Other":**
      *   Nadia oscillates between *moral character*, *legal pragmatism*, and *relational ethics*.
      *   Tom sticks to *agent-centric moral desert* and *determinism*.
      *   They are definitely talking past each other. Nadia is often arguing about social practice/legal consequences, while Tom is arguing about metaphysical moral worth.

  4.  **Determine the "Winner":**
      *   Tom is logically tighter. He identifies the inconsistencies in Nadia's position (Move 4) and pushes the luck argument to its logical conclusion (Move 6).
      *   Nadia captures the *human* reality better (we do treat them differently, victims matter), but her philosophical justifications wobble.
      *   Overall, Tom wins on philosophical consistency, Nadia wins on practical moral intuition (though she defends it poorly).
      *   *Decision:* Tom is more "right" in the context of a philosophical argument about desert, but Nadia is right that we can't live as if moral luck doesn't exist. However, since the prompt asks to adjudicate the *argument*, Tom's logical consistency usually trumps intuitive wobbling in this context. I will lean towards Tom, but acknowledge Nadia's practical points.

  5.  **Drafting the Response (incorporating British English and blunt tone):**
      *   *Vocabulary:* Rubbish, nonsense, spot on, waffle, prickly, fair do's, etc.
      *   *Structure:* Go through moves 1-6, then the "talking past" analysis, then the overall verdict.
      *   *Tone Check:* Don't be nice. They weren't nice. Be decisive.

      *(Self-Correction during drafting)*: Wait, I need to make sure I don't just say "Tom wins." Move 6 is a bit of a "gotcha" that dissolves responsibility entirely. Nadia's Move 5 (victim-centred) is actually a strong counter to pure agent-centric views. I should acknowledge that Tom's Move 6 is a bit of a nuclear option that undermines his own point about culpability (if nothing is deserved, he isn't deserved either). But generally, on the specific question of *resultant* moral luck, Tom is the one holding the standard philosophical line. I will rule Tom the winner on logic, Nadia on social reality, but overall Tom takes the debate because Nadia kept shifting grounds.

      *Refining the British English:* Ensure spelling (colour, centre, programme), idioms (flatmates, kerb, rubbish, fair enough), and sentence structure fit.

      *Refining the "No Diplomacy":* Instead of "Nadia makes a good point but...", use "Nadia's right about the law, but she's muddying the waters." Instead of "Tom is logically sound...", use "Tom's logic is tight, even if it's bleak."

  6.  **Final Polish:** Check against the six moves again.
      *   1: Nadia (Intuition vs Logic) -> Tom is right philosophically.
      *   2: Tom (Definition) -> Correct.
      *   3: Nadia (Law vs Morality) -> Right about law, wrong to use it for morality.
      *   4: Tom (Symmetry) -> Devastating point.
      *   5: Nadia (Victim focus) -> Valid shift, but admits the previous point was weak.
      *   6: Tom (Constitutive Luck) -> Strong, but risks nihilism.

      *Overall:* Tom wins the argument; Nadia wins the reality. But since they asked for a referee on the *argument*, Tom takes it.

  7.  **Final Output Generation** (Proceed to write based on these thoughts).
answer: |-
  Right, let's cut through the noise. You've asked me to referee a philosophical brawl, not to mediate a friendship. They weren't diplomatic, so neither will I. Here is the adjudication, move by move.

  **Move 1: Nadia**
  Nadia claims the friend is a worse person *now* because of the outcome.
  **Verdict:** She's wrong. Philosophically, this is nonsense. If the choices, intent, and intoxication levels were identical, the moral character of the agents at the time of driving was identical. To say one is now a "worse person" purely because a pedestrian happened to be standing ten metres away is to surrender morality to randomness. She's appealing to intuition, but intuition is notoriously bad at handling probability. She's conflating *outcome* with *character*.

  **Move 2: Tom**
  Tom calls this textbook moral luck and argues culpability is identical.
  **Verdict:** He's right. This is the standard Nagel/Williams position. If moral worth depends on control, and the outcome was outside their control, then moral worth cannot differ. He's logically consistent here. He's identified the core problem: we want to judge people on what they control, but we can't stop judging them on what they don't.

  **Move 3: Nadia**
  Nadia pivots to the law. She argues institutions punish harm because they can't read minds.
  **Verdict:** She's right about the law, but she's changing the subject. The argument was about moral desert ("worse person"), not legal pragmatism. The law is a blunt instrument designed for social order, not a scalpel for metaphysical truth. We punish the crash more than the near-miss to incentivise care and acknowledge the victim, not because the driver's soul is darker. Nadia is using a practical necessity to defend a moral claim. It's a category error.

  **Move 4: Tom**
  Tom pounces on the shift. He argues this is about desert, not law, and raises the symmetry problem (the "drunken saviour").
  **Verdict:** Spot on. This is the strongest move in the entire exchange. If Nadia wants outcome to determine blame, she must accept outcome determines praise. If a drunk driver swerves and accidentally blocks a kidnapper's escape, saving a child, is she a hero? If Nadia says no, she's inconsistent. If she says yes, she's accepting that moral heroism is a lottery. Tom has her in a checkmate here logically.

  **Move 5: Nadia**
  Nadia bites the bullet on praise but distinguishes blame via the victim. Blame answers to the harmed.
  **Verdict:** This is her best move, but it's a concession. She's admitting that "blame" isn't just about the agent's internal state; it's a relational transaction. She's shifting from agent-centric morality to victim-centric ethics. It's a valid philosophical stance (repairative justice), but it admits her first point (that the friend is a *worse person*) was poorly phrased. He isn't a worse person, but he owes a greater debt. She's right about the social function of blame, but she's lost the argument about intrinsic moral worth.

  **Move 6: Tom**
  Tom argues the victim doesn't create desert and pushes the luck regress (upbringing, temperament).
  **Verdict:** He's logically consistent, but he's playing with fire. This is the hard determinist trap. If *all* luck negates responsibility (constitutive luck), then nobody deserves anything, ever. Tom wins the point that Nadia hasn't defined where luck stops mattering, but his own position leads to a nihilistic dead end where we can't blame anyone for anything. However, within the bounds of *this* argument about resultant luck, he is right: the victim's presence is external to the driver's will.

  **Are they talking past each other?**
  Absolutely. It's a proper mess.
  Tom is arguing about **metaphysical moral desert** (what you deserve in the eyes of the universe).
  Nadia is arguing about **social and legal accountability** (how we treat each other in a community).
  When Nadia talks about the law (Move 3) and victims (Move 5), she's talking about social practice. When Tom talks about character and luck (Move 2 & 6), he's talking about moral ontology. They are using the word "blame" to mean two different things. Nadia means "liability to sanction," Tom means "corruption of the soul."

  **Who comes out more right overall?**
  **Tom.**

  He wins on logical consistency. Nadia started with a common-sense intuition (Move 1) that crumbled under scrutiny. She spent the rest of the argument shifting goalposts—from character to law, then to praise, then to victims—to avoid admitting she was philosophically cornered. Tom identified the inconsistencies (Move 4) and pressed the advantage.

  Nadia is right that we *must* live as if outcomes matter (the law can't ignore bodies, and victims demand answers). But Tom is right that this is a pragmatic compromise, not a moral truth. Since this was an argument about what is *true* regarding culpability, not what is *useful* for society, Tom takes the round. Nadia's position is how we have to live; Tom's position is how the logic actually works.

  Tell them to stop shouting. Tom's won the debate, but Nadia's right that we still have to call the police when someone hits a pedestrian. They can both go to the pub, but they're buying their own drinks.
