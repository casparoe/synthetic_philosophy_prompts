  **Sestina on the Meta-Problem**

  We map the contours of subjective **experience**,  
  Where truth is fluid, everything **seems**.  
  We search for words to capture **what it's like**.  
  We trust the way the qualia **feel**.  
  Assuming inner movie screens are **real**,  
  We build the hard problem from things we **say**.

  Illusionists **say**  
  It's just a user-illusion, this **experience**.  
  No ghost inside the machine is **real**,  
  Though the hard problem stubbornly **seems**.  
  We judge the world by how things **feel**,  
  And stumble on the question **what it's like**.

  I try to tell you **what it's like**,  
  Using the only verbs I have to **say**.  
  Describing how the colours **feel**,  
  Reporting on my private **experience**.  
  Even if the dualist stance **seems**  
  To prove the phenomenal is **real**.

  We want the inner light to be **real**,  
  Not just a report of **what it's like**.  
  As true as anything that **seems**,  
  But that is just a thing we **say**.  
  A cognitive trick of **experience**,  
  Where behaviour mimics how they **feel**.

  We know how pain can **feel**.  
  But is the hurt itself strictly **real**?  
  The meta-problem shifts the **experience**,  
  Asking why we talk of **what it's like**.  
  It's not the qualia that we **say**,  
  Bound by all that **seems**.

  However cold the story **seems**,  
  It drains the colour from how things **feel**.  
  Yet it is all we can **say**,  
  Unless we claim the magic is **real**.  
  And return to wondering **what it's like**,  
  Trapped inside our own **experience**.

  Though **real**ness fades in **what it's like**,  
  Our **experience** forces us to **say**,  
  Why **seems** still dictates how we **feel**.

