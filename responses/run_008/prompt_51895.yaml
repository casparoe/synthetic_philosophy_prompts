  **Note on the Text**

  This poem dramatises the tension between illusionism (e.g. Dennett, Frankish) and the meta-problem of consciousness (Chalmers). The meta-problem asks why we *think* there is a hard problem, rather than asking whether the hard problem is solvable. While the poem leans into an illusionist reading—suggesting our intuitions are cognitive tricks—it is worth noting that this is a contested move. Chalmers himself proposes the meta-problem as neutral ground; solving it doesn't necessarily dissolve the hard problem, as one might argue our intuitions track a genuine phenomenon. The sestina form mirrors the philosophical trap: the speaker attempts to deflate the mystery, yet the vocabulary of phenomenology ('experience', 'what it's like', 'seems') remains inescapable, regenerating the very problem they aim to dissolve. British spelling conventions (behaviour, colour) have been used throughout.
