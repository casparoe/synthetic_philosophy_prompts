      *   *The Problem:* Beauty sleeps. Coin tossed. Heads: Wake Monday, sleep, wake Tuesday (amnesia). Tails: Wake Monday, sleep, wake Tuesday (amnesia). Wait, standard is: Heads: Wake Monday only. Tails: Wake Monday and Tuesday.
      *   *Thirder Position:* $P(Heads) = 1/3$ upon waking. Reasoning: Long-run frequency of wakings (1 Heads waking : 2 Tails wakings).
      *   *Halfer Position:* $P(Heads) = 1/2$ upon waking. Reasoning: No new information gained upon waking (knew she would wake up at least once). Coin is fair.
      *   *User's Argument:* Frequentist intuition (lab person). Control-lab variant (3000 volunteers).
      *   *Connections:* SIA (Self-Indication Assumption), Doomsday Argument (DA), Presumptuous Philosopher.

  3.  **Identify Objections/Defeaters:**
      *   *The "No New Information" Argument (Halfer core):* Upon waking, Beauty knew she would be awake. Conditionalizing on a tautology shouldn't shift probability from the prior (1/2).
      *   *The "Double Counting" / Reference Class Problem:* Are wakings the right reference class? Is Beauty sampling *wakings* or *experiments*?
      *   *The "Monday Morning" Problem (Elga vs. Lewis):* If $P(Heads) = 1/3$, then $P(Tails \& Mon) = 1/3$, $P(Tails \& Tue) = 1/3$, $P(Heads \& Mon) = 1/3$. But if she learns it's Monday, $P(Heads | Mon)$ becomes 1/2. This implies she changes her mind just by learning the day, which some find odd given the symmetry.
      *   *The "Presumptuous Philosopher" (SIA connection):* If you accept thirdism (which aligns with SIA), you should believe you are more likely to exist in a universe with more observers. This leads to the "Presumptuous Philosopher" thought experiment where one rejects physical theories predicting fewer observers regardless of evidence. This is often cited as a *reductio ad absurdum* of SIA/Thirdism.
      *   *Dutch Book Arguments:* Thirders can be Dutch Booked if they bet on Heads/Tails per experiment. Halfers can be Dutch Booked if they bet per waking. The setup of the bet determines the vulnerability. This suggests the dispute is about utility/scoring rules, not just probability.
