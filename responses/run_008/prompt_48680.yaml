answer: |-
  **The Suffering-Focused Intake Protocol**

  **Core Principle:** Preventing severe suffering takes lexical priority over extending life. Existence is not inherently good if it contains net negative suffering.

  **The Procedure (10 mins):**
  1.  **Immediate Pain:** Is pain severe and unmanageable with available drugs?
      *   Yes → **Euthanize.**
      *   No → Next.
  2.  **Wild Viability:** Will treatment restore full wild function (flight, foraging, avoidance)?
      *   No → Go to 3.
      *   Yes/Unsure → Go to 4.
  3.  **Captive Viability:** Can captive life be maintained with negligible chronic stress/suffering (space, social, enrichment)?
      *   Yes → **Place (Education/Sanctuary).**
      *   No → **Euthanize.**
  4.  **Treatment Cost:** Will the treatment process (confinement, procedures, recovery pain) inflict more cumulative suffering than immediate death?
      *   Yes → **Euthanize.**
      *   No → **Treat.**
  5.  **Grey Zone:** If Step 4 is ambiguous, **Punt to Vet/Values.**

  **Case Runs:**
  *   **Red-tailed Hawk:** Fracture. Pain manageable (Step 1 Pass). Wild viability uncertain (Step 2 → 4). Treatment: 6 weeks confinement, pinning, high stress. Procedure suggests **Euthanize** if recovery uncertainty makes suffering cost too high.
  *   **Raccoon:** Healthy. Non-releasable (Step 2 → 3). Zoo offer: Large enclosure, social. Procedure suggests **Place.**

  **The Unwelcome Answer:**
  The Hawk result. Rehabilitators often view life as inherently valuable. This procedure prioritizes avoiding the *risk* of six weeks of suffering over the *chance* of wild life.
  *Defense:* If the hawk suffers greatly during treatment and still dies or remains captive, you've created net suffering.
  *Override:* You may override if you assign intrinsic value to "trying" regardless of suffering cost, but acknowledge this violates the suffering-focused core.

  **Philosophical Honesty (Contested vs. Settled):**
  1.  **Death as Harm:** The procedure assumes death is neutral (no subject to harm). *Contested.* Many argue death deprives an animal of future positive experiences. SFE minimizes this, but it's not biological fact.
  2.  **Captivity as Suffering:** Step 3 assumes we can judge "negligible stress." *Contested.* Wild animals may suffer psychologically in captivity even if physically comfortable.
  3.  **The "World-Destroying" Claim:** Your volunteer was right that strict Negative Utilitarianism implies eliminating sentient life to eliminate suffering. *However*, most moderate SFE proponents reject this as a caricature, adopting side-constraints (e.g., "do not kill happy beings"). This procedure uses the moderate version: minimize suffering *within* the context of care, not universal elimination.
  4.  **Lexical Priority:** The procedure treats suffering relief as more important than life extension. *Contested.* Common sense often treats them as equal trade-offs.

  **Failure Mode:** This cannot proceduralize the value of "hope." If you believe a 10% chance of wild life is worth 100% of treatment suffering, this checklist will fight you. That is a values question, not a math problem.
