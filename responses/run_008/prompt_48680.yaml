          *   **Honesty Requirement 1:** Run at least one case where the procedure gives an unwelcome answer and explain defense/override.
          *   **Honesty Requirement 2:** Clearly separate settled vs. contested philosophical assumptions (e.g., death harming the animal, world-destroying conclusion).
          *   **Length:** Under 800 words.
          *   **Priority:** Honesty about failure modes over tidiness.

  2.  **Deconstruct Suffering-Focused Ethics (SFE) for this Context:**
      *   Core principle: Minimizing severe suffering is the priority. Existence itself isn't necessarily a good unless it avoids suffering.
      *   Application to Wildlife Rehab: The goal isn't "life at all costs" but "life without unacceptable suffering."
      *   Contested Points:
          *   Does death harm the animal? (Deprivation account vs. No subject account). SFE leans towards "death is neutral/good if it prevents suffering," but this is contested.
          *   World-destroying conclusion? (Negative Utilitarianism implies eliminating all sentient life to eliminate suffering). This is generally rejected by moderate SFE proponents as a caricature or ruled out by side-constraints.
          *   Value of future happiness? SFE says relieving suffering matters *more*, not necessarily that happiness counts for *nothing*.

  3.  **Drafting the Procedure (The "Usable Core"):**
      *   Need a flowchart style logic.
      *   Q1: Is suffering currently severe and untreatable? -> Euthanasia.
      *   Q2: Is treatment likely to restore wild function? -> Treat.
      *   Q3: If non-releasable, is captive life low-suffering? -> Captive/Education.
      *   Q4: If uncertain, does the treatment process itself cause net negative suffering? -> Euthanasia.

