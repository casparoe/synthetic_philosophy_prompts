      *   *Recommendation:* Reframe (3). Don't reject Multiverse because it's unobservable; reject it because it has a lower *prior* than Simulation *for you*, or admit that Simulation *is* a Multiverse theory (Level IV Tegmark).
      *   *Actually, the strongest tension is (2) vs (5).* If you are a Bayesian, you *must* incorporate selection effects. Rejecting the Anthropic principle as "explaining away" is often a mistake in Bayesian reasoning (the "Old Evidence" problem or Indexicality).
