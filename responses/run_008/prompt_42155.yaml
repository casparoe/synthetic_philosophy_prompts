          *   *Revised Round 3:* AI/Future. World A (20 humans, end soon). World B (1000 humans + 1,000,000 AI). If AI count as observers, does drawing #15 still favor World A? (This hits the SIA vs. SSA debate).

      *   *Wait, let's align closer to the prompt's specific request:* "manipulates what counts as being in the sample: only students in this room, then everyone in the building, then a claimed population of artificial minds."
      *   *Okay, let's build that exactly.*
