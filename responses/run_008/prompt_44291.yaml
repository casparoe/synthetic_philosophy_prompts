answer: |-
  Good evening. For those of you who haven't had the pleasure of working directly with [Mentor's Name], you should know that she possesses a very specific kind of stubbornness. It's not the kind that refuses to change her mind; it's the kind that refuses to let you get away with a lazy thought.

  I remember my first field trip with her. We were standing in a region hit hard by drought, looking at a distribution site, and I made an offhand comment about how terrible the weather had been for the farmers. She didn't yell. She just stopped walking, turned to me, and said, "The weather is interesting. The hunger is political." And then she kept walking.

  That moment sums up thirty years. Most people look at famine and see a tragedy of nature. They see dry skies and failed crops, and they think, "Well, you can't fight mother nature." And if you said that within earshot of [Mentor's Name], she would likely correct you over dessert, politely but firmly, until you understood that famines are not about food not existing. They are about people losing the ability to command food that *does* exist.

  To the family and donors in the room: I know many of you supported this work because you wanted to help people survive disasters. And you did that. But [Mentor's Name] asked something more of you. She asked you to understand that when people starve in the modern world, it is not because the earth stopped producing. It is because systems failed. Because voices were silenced. Because accountability was missing. She famously argued that you don't see substantial famines where people have a voice and a free press. Her career was spent trying to give people that voice, so they wouldn't need our emergency shipments in the first place.

  To the former staff and policy wonks here: we know how hard that made the job. It is infinitely easier to raise money for "victims of a drought" than it is to raise money for "victims of policy failure." Blaming the rain is convenient. It lets governments off the hook. It lets donors feel like heroes without asking hard questions. But [Mentor's Name] refused the convenient path. She refused to let us be mere delivery drivers for grain. She insisted we be mechanics for the systems that distribute it. She taught us that charity is temporary, but entitlement—the right to eat—is permanent.

  There is a profound hope in that view, and it's where I want to leave us tonight. If famine were truly an act of God, we would be helpless. We would just be here, century after century, cleaning up after the storm. But if famine is a human creation—a result of choices made by people in rooms like this one—then it is within human power to stop it.

  That was her mantra. It is preventable. Not someday, not when the climate perfects itself, but now. Because it is political, it is solvable.

  [Mentor's Name], you spent thirty years refusing to let us look away from that truth. You taught us that feeding the hungry is not just about filling bellies; it's about restoring dignity and demanding justice. You taught us that the opposite of hunger isn't just food; it's power.

  So, if you'll raise your glasses. To [Mentor's Name]. Thank you for the hard truths, for the refusal to accept inevitability, and for showing us that while we cannot control the weather, we can absolutely control whether anyone starves because of it. To your health, and to the work that continues.
