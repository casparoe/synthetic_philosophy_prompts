  **BUREAU OF INTERPERSONAL AGGREGATION**
  **Citizen Utility Portal – Frequently Asked Questions (Ref: UIA-99)**

  **1. Why was my scheduled hip replacement reassigned to the Municipal Fireworks Festival?**
  Upon review, your medical claim was processed through the Standard Aggregation Protocol. While a hip replacement generates significant utility for the recipient, our actuarial models indicate that funding the fireworks display generates a higher volume of aggregate pleasure across the attending population. Please understand that the Bureau treats the population as a single entity extended over time. Just as a rational individual might endure a painful dentist visit today for the benefit of dental health tomorrow, the system accepts burdens imposed on one citizen today to secure greater benefits for the collective tomorrow. The boundary between your body and the crowd was deemed administratively negligible in this calculation. The total net happiness increased by 14,000 units. We trust you find this arithmetic satisfactory.

  **2. I object to suffering for someone else's benefit. Does the separateness of persons mean nothing to you?**
  We appreciate your engagement with the structural framework. However, the "separateness of persons" is not a recognized variable in the National Utility Ledger. Individuals are best understood as temporary locations where utility happens to be folded, rather than distinct owners of experience. From the point of view of the system, there is no fundamental difference between transferring pain from one life to another and transferring pain from one year of a single life to another. The ledger has columns for utility gains and losses, but no columns for names. To privilege the boundary of your skin over the total sum would be akin to privileging the boundary of Tuesday over Wednesday. We encourage you to view your suffering as a necessary contribution to the overall luminosity of the state.

  **3. Why has Citizen 8940 been assigned Priority Tier 1 for all resource distribution?**
  Citizen 8940 has been flagged by our algorithms as a High-Yield Converting Unit. Longitudinal data indicates that this citizen possesses an unusually efficient capacity to convert resources into well-being. Where one standard unit of resources generates 5 utils in the average citizen, Citizen 8940 generates 500. To maximize the total aggregate good, resources are naturally routed to where they produce the most light. You may notice longer queues for housing and nutrition at your local distribution center; this is a feature, not a bug. It ensures that resources are not wasted on low-yield conversions. We thank you for your patience while the total sum is optimized.

  **4. I am a deontologist. I have rights that cannot be violated regardless of the outcome.**
  Thank you for disclosing your philosophical orientation. We have logged this preference under "Non-Consequentialist Feedback." Please note that rights-based claims do not register on the aggregative scale. We cannot subtract violations of rights from the total utility sum, as rights are not quantifiable units. However, we can confirm that the current total utility is at an all-time high. We hope this cheerful restatement of the current total provides some comfort regarding the overall state of affairs. Your integrity remains intact, even if your entitlements have been redistributed to higher-value endpoints.

  **5. How is my personal data protected during these calculations?**
  **Privacy Notice:** The Bureau wishes to assure citizens that individual utility data is fully anonymized and pooled upon intake. Furthermore, no data is retained that could identify a specific person, since strictly speaking there is nothing further to identify. Once utility is extracted from the experience, the vessel is irrelevant to the account. We do not track *who* is happy, only *that* happiness exists. As the individual is not the primary unit of moral account, retaining identifiable metadata would be redundant storage. You are safe in the knowledge that you are statistically indistinguishable from everyone else.
