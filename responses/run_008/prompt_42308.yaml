answer: |-
  This is a profound and unsettling predicament. It is rare that the abstract theories of authorship collide so violently with the material reality of a career. You are right to hesitate before reducing this to a matter of copyright infringement, though the law is clearly on your side. The law deals in property; you are grappling with ontology. You are asking: *What is a book?* and *Where does a writer end and the world begin?*

  To help you prepare for the conference, and to clarify your own mind, let us dissect the structure of this wrong. It is not a single injury, but a triangulation of three distinct violations: the theft of **Property**, the theft of **Persona**, and the violation of the **Pact**.

  ### 1. The Theft of Property (The Text)
  Legally, this is the simplest layer. You own the sequence of words. The fact that the manuscript sat in a drawer does not diminish your copyright. However, you sense that saying "they stole my words" is insufficient. Why? Because words in a drawer are inert. They are not yet a novel in the full sense; they are a manuscript.

  A manuscript becomes a novel only when it enters the public sphere. In 1993, your text failed to become a novel; it remained a manuscript. In 2024, that same text has become a novel, but it has been dressed in another name.

  **What was stolen here is not the ink, but the *potentiality*.** You were stolen the chance for your text to meet its moment. But there is a twist: the text *did not* move people in 1993. It moves them now. This suggests that the "property" is not just the words, but the words *in context*. By taking the words out of your context (a struggling novelist in the 90s) and placing them in hers (a revered master's posthumous revelation), the estate has altered the property itself. They have taken your raw material and processed it through the machinery of her reputation.

  ### 2. The Theft of Persona (The Name)
  This is where the deception of the readers lies. When we read a novel, we are not merely decoding syntax; we are engaging in a imagined relationship with a consciousness. We read a sentence by Isabel Corvin differently than we read the same sentence by a debutant. We read it with a specific gravity, assuming a lifetime of experience behind the phrasing.

  The readers are deceived about the **source of the consciousness**. They believe they are accessing Corvin's late wisdom, her confrontation with mortality, her "finest thing." In reality, they are accessing your younger voice, your specific struggles, your syntax.

  However, you note the final paragraph is hers. This complicates the persona. The readers are experiencing a hybrid consciousness: your body of work, capped by her signature.
  *   **The Deception:** The readers believe they are witnessing a unified artistic vision from a single life. They are not. They are witnessing a ventriloquism act.
  *   **The Injury:** Corvin's estate has used her *Persona* to validate your *Text*. They have leveraged her cultural capital to sell your labor. But conversely, they have used your labor to bolster her legacy, suggesting her genius was so vast it could encompass this work, even posthumously.

  ### 3. The Violation of the Pact (The Event)
  This is the philosophical core of your dilemma. You ask: *Is the novel the words, or the event of the words being written?*

  In literary theory, there is a distinction between the "text" (the marks on the page) and the "work" (the aesthetic object experienced by the reader). The "work" includes the context of its creation.

  You suggest the readers are reading Corvin's grief into your words. This is the violation of the **Reader-Author Pact**. When a reader opens a book, there is an implicit agreement: *I will surrender to this voice, and you (the author) warrant that this voice is yours.*

  By publishing this as Corvin's, the estate has broken that pact. The readers are mourning Corvin through your prose. They are finding solace in your resolution (or rather, Corvin's resolution to your setup).
  *   **Whose event is it?** It is a **ghostly collaboration**. You wrote the journey; she wrote the destination. But because the journey makes up 90% of the book, the *event of writing* is predominantly yours. However, the *event of reading* is predominantly hers, because her name frames the reception.
  *   **The Wrong:** The wrong is that the **narrative of the book's creation** is false. The story of how this book came to be is part of the book's meaning. A "lost novel found after death" carries a specific romantic weight (the final testament). A "manuscript rejected in 1993 and published in 2024" carries a different weight (resurrection, delayed justice). By hiding the true origin, they have denied the book its true biography.

  ### The Specific Weight of the Ending
  You mention the final paragraph is the part reviewers love most. This is critical.
  In 1993, you chose an unresolved ending. That was your artistic intent. It reflected your vision of the world at that time.
  Corvin (or her estate, utilizing her notes) imposed a resolution.
  By adding that paragraph, Corvin has not just appended a ending; she has **retroactively rewritten the preceding text.**
  Every ambiguous moment in your 300 pages is now, to the reader, a setup for *her* conclusion. Your ambiguity is re-cast as suspense. Your openness is re-cast as a puzzle she solved.
  **This is the deepest theft:** They have stolen your *intent*. They have taken your questions and sold them as her answers.

  ### What to Say at the Conference
  You have until spring to decide. If you choose to speak, do not frame it merely as a lawsuit announcement. Frame it as a clarification of the record, for the sake of the literature itself.

  You might structure your revelation around these points:

  1.  **Acknowledge the Beauty:** Admit that the book is good. Admit that Corvin's final paragraph is masterful. This disarms the accusation of sour grapes.
  2.  **Define the Hybrid:** State clearly that the book is a chimera. It is your voice in her throat.
  3.  **The Reader's Right:** Argue that readers deserve to know whose grief they are sharing. If they are crying over Corvin's mortality, they should know the mortality described in the text is yours (or fictional), filtered through her hand.
  4.  **The Nature of Authorship:** Conclude that authorship is not just ownership of words, but responsibility for the *relationship* with the reader. That relationship has been falsified.

  ### A Proposed Formulation
  If I were in your position, looking for the precise description of the wrong, I would say this:

  > "They have not stolen my book. They have stolen my *conversation* with the world. They have taken the questions I asked thirty years ago and forced them to speak in the voice of a woman who is no longer here to answer for them. The text is mine, but the context is a lie. The readers are not being deceived about the quality of the writing, but about the *truth of the witness*. They think they are holding a mirror to Corvin's soul. They are holding a mirror to mine, framed in gold."

  ### The Decision
  You ask if the right description is that she stole your book, or that everyone is deceiving themselves.
  It is neither.
  The right description is that **the Estate has commodified a lie to sell a truth.**
  The truth is the power of the writing (yours and hers). The lie is the provenance.

  If you stand up at the conference, you are not just claiming copyright. You are restoring the integrity of the reading experience. You are telling the readers: *You loved this book. You were right to love it. But you were loving it for a reason that isn't true. Let me tell you the truth, so you can love it for the right reason.*

  That is not a legal claim. That is a moral one. And for a novelist, it is the only one that matters.
