      *Best Consistency:* **Authority to Alienate.** In Case 4, the Colonial Service had legal authority over antiquities. In Case 5, the Commissioner did not have authority over shrine property (even under colonial law, often indirect rule respected shrine immunity, or the board is applying a moral standard).
