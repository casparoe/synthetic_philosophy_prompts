      *   *Constraint Check:* Did I start with brainstorming? Yes. Four parts? Yes. Empty cells filled? Yes.
      *   *Depth:* Make sure the distinction between "Intent Alignment" (doing what I want) and "Value Alignment" (doing what is right) is treated with care. The butler analogy suggests these are separable; the critique should show where they bleed into each other.
      *   *Specific Focus:* The prompt asks about "informed and reflective intentions." This is key. The butler interprets *reflective* intent. Who defines "reflective"? That's the crux.

  8.  **Self-Correction during drafting:**
