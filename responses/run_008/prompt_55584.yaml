      *   *Challenge:* Distinguishing James from Permissive Evidentialism. James says pragmatic interests *constitute* a right to believe. Permissive Evidentialism says evidence leaves it open, so you *can* believe, but pragmatism isn't a *reason* for truth. I need to phrase options carefully.
