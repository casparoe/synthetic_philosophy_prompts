      *   *Two positions the quiz cannot cleanly separate:* Likely **Jamesian Will-to-Believe** and **Permissive Evidentialism**. Both allow belief without sufficient evidence in some cases. The distinction is subtle (is pragmatism a *reason* or just a *tie-breaker*?). High schoolers might conflate them.
