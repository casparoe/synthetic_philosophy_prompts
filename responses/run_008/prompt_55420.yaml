  so I've been trying to write down where I actually stand on the inside view vs outside view stuff, mostly because my friends keep telling me I'm doing special pleading and I want someone to check me before I put this in a longer writeup. heres the package:

  (1) when a reference-class forecast and a detailed inside-view model disagree, the reference class should win most of the time, and I really do mean most — I think people massively overrate their own models, myself included in principle.

  (2) when I disagree with a majority of informed people on something, I should move toward them, roughly in proportion to how informed they are, not just note the disagreement and keep my original credence.

  (3) I think transformative AI within roughly the next two decades is likely enough that I've organized my career around it, even though most relevant experts, if you polled them, would give much longer timelines or shrug.

  (4) my justification for (3) is a specific model about compute and scaling, and I trust it partly because in my own domain (quant work, fast feedback loops) my inside-view calls have beaten base rates pretty consistently and I can point to the record.

  (5) I think modesty has an escape hatch: if you can actually trace the disagreement to a specific error on the other side — they're working from stale numbers, they haven't seen some result, they're answering a slightly different question — then you don't have to defer. locating the source of the disagreement beats mechanically splitting the difference.

  (6) reference classes should be drawn as broadly as the subject allows — if you're forecasting a project you take the class of all similar projects, not the three most flattering cases you can think of.

  my friends say (3) is flatly inconsistent with (1) and (2) and honestly I think it's more complicated than that but I can't fully see which part has to give, if any. go through the pairs, tell me which are genuinely in tension and which only look like it, rank them by severity rather than listing them all as equally bad, and for each real one say what the cheapest fix would be and what it costs me. please write it as plain continuous prose like an email, no headings or bullets or bold or tables — I actually want to read the thing, not skim it.
