answer: |-
  You have put your finger on one of the most persistent friction points between cognitive science, developmental biology, and philosophy. Your intuition is correct: the standard "Innate vs. Learned" dichotomy (and Chomsky's specific deployment of it in the Poverty of the Stimulus argument) often obscures the mechanism you spent your career studying.

  To answer your primary question: No, there is no single, universally agreed-upon noun in philosophy that captures this exact "middle configuration" across all disciplines. However, the *concept* is well-established under different names in different neighborhoods. The philosophical literature usually discusses this under the **Instruction vs. Selection** distinction, while developmental biology uses **Permissive vs. Instructive Induction**.

  Here is the breakdown of the terminology you mentioned, the actual distinctions you are looking for, and a proposed carving of the concept.

  ### 1. Why your "Near Misses" are Near Misses

  You are right to be unsatisfied with the standard terms. They describe adjacent features but not the causal structure you are isolating.

  *   **Critical/Sensitive Period:** As you noted, this names the *temporal constraint*, not the *functional relationship* between the input and the system. A critical period can exist for purely instructional learning (e.g., imprinting) or for maturation. It describes *when*, not *how*.
  *   **Canalization (Waddington):** You are correct that this is a near miss. Canalization refers to the *robustness* of a phenotype against environmental perturbation or genetic mutation. Your cases are not about robustness; they are about specific *dependency*. In fact, what you are describing is sometimes called **Decanalization** or **Plasticity**: the system is designed to vary based on input. However, modern Evo-Devo sometimes speaks of **Canalized Plasticity**, meaning the *ability to be plastic* is itself genetically fixed. That is closer, but still clunky.
  *   **Preparedness (Seligman):** This comes from learning theory (e.g., taste aversion). It implies a bias in the *rate* or *ease* of association. Your cases are stronger than preparedness; they are often binary (develop or degenerate) or structural (map forms or fails). Preparedness is a gradient; your mechanism sounds like a structural requirement.

  ### 2. The Established Distinctions (The "Real" Names)

  If you want to talk to a philosopher of biology or a neuro-philosopher, these are the distinctions that map onto your intuition.

  **A. Permissive vs. Instructive Induction (Developmental Biology)**
  This is the closest existing technical distinction to your two cases.
  *   **Permissive:** The environment allows a pre-specified program to proceed but does not determine the specific outcome. The information is in the organism; the environment just prevents decay or allows expression. **Your visual cortex case is Permissive.** The map is pre-wired; input prevents pruning. The input does not tell the cortex *how* to map, only *that* it should.
  *   **Instructive:** The environment supplies information that determines the specific structure of the outcome. **Your bird song case is partially Instructive.** The capacity to sing is innate, but the dialect is specified by the tutor.
  *   **The Philosophical Gap:** Chomsky's Poverty of the Stimulus argument assumes that if the input is not *instructive* enough to build the grammar from scratch, the grammar must be *pre-formed*. It ignores the **Permissive/Constrained** middle ground where the input selects from a pre-existing menu of options.

  **B. Experience-Expectant vs. Experience-Dependent (Neuroscience)**
  You likely know Greenough's terminology, but it has philosophical weight.
  *   **Experience-Expectant:** The brain expects certain "species-typical" input (light, edges, sound) to fill in pre-existing circuitry. (Your visual case).
  *   **Experience-Dependent:** The brain stores unique information specific to the individual.
  *   **The Gap:** Bird song is a hybrid. It is expectant (needs a song) but the content is dependent (the dialect). Philosophy often lumps these together as "Interactionism," which is too vague.

  **C. Nativism about Constraints vs. Nativism about Content (Philosophy of Mind)**
  This is the direct counter to Chomsky.
  *   **Content Nativism:** Specific ideas or rules (e.g., "Subject-Verb-Object") are innate.
  *   **Constraint Nativism:** The *mechanisms for processing input* are innate. The system restricts the hypothesis space so that the child cannot *conceive* of certain grammars, making the actual grammar easy to acquire from thin data.
  *   **Your Point:** Chomsky's PoS argues from "Data is thin" to "Content is Innate." You are arguing for "Data is thin + Constraints are Innate $\rightarrow$ Content is Acquired." This is often called **Rationalist Empiricism** or **Structural Nativism**.

  ### 3. Carving the Concept: "Triggered Specification"

  Since no single term perfectly captures the configuration (Genetic Constraint + Critical Window + Environmental Input $\rightarrow$ Reliable Outcome), let us carve one out. I propose calling this **Triggered Specification**.

  **Definition:**
  A developmental process is an instance of **Triggered Specification** if:
  1.  **Structural Bias:** The organism possesses an inherited architecture that restricts the range of possible developmental outcomes (the "hypothesis space" is small).
  2.  **Environmental Dependency:** The realization of the final phenotype requires specific environmental input during a limited temporal window.
  3.  **Non-Instructional (or Partially Instructional):** The input does not teach the system *how* to function via trial-and-error induction; rather, it either (a) stabilizes a pre-existing structure (Permissive) or (b) selects a specific variant from a pre-existing set (Selective).

  **The Two Variants (Addressing your "Split"):**
  You asked if there is a recognized split between the version where the trigger supplies content (dialect) vs. permits a preset outcome (cortex). Yes, this maps onto the **Permissive vs. Selective** split within Triggered Specification.

  *   **Type 1: Permissive Triggering (The Visual Cortex Case)**
      *   *Role of Input:* Maintenance/Stabilization.
      *   *Outcome:* If input is missing, the system degrades or fails to finalize. If input is present, the system converges on a species-typical norm.
      *   *Information Flow:* Low. The input confirms "you are in the world," but does not specify "you are seeing *this* specific world."
      *   *Philosophical Label:* **Maturation with Maintenance.**

  *   **Type 2: Selective Triggering (The Bird Song Case)**
      *   *Role of Input:* Parameter Setting / Selection.
      *   *Outcome:* The system will develop *a* song, but the *specific* song is determined by the input.
      *   *Information Flow:* Moderate. The input selects a coordinate from a genetically defined map.
      *   *Philosophical Label:* **Parameter Setting** (in linguistics) or **Facultative Adaptation** (in biology).

  ### 4. Why Chomsky's Move Bugs You (And Should)

  Your critique of the Poverty of the Stimulus (PoS) is a standard and robust objection in the philosophy of biology, often championed by proponents of **Developmental Systems Theory (DST)**.

  Chomsky's logic is:
  1.  Output (Grammar) is complex.
  2.  Input (Speech) is degenerate/thin.
  3.  Therefore, Output cannot be derived from Input.
  4.  Therefore, Output is Innate.

  **The Flaw:** This assumes the only alternative to "Learned from Data" is "Pre-formed in Genes." It ignores **"Computed from Data via Innate Constraints."**

  If the child has an innate constraint that says "Ignore all data that looks like X" and "Prioritize all data that looks like Y," the "thin" data becomes sufficient. The information isn't in the genes *as grammar*; it's in the genes *as a filter*.

  In your terms: Chomsky treats the visual cortex as if it must be either a blank slate (learned) or a pre-painted picture (innate). He misses that it is a **pre-wired map that requires light to develop**. He conflates **Content Nativism** with **Constraint Nativism**.

  ### Summary

  *   **Does it have a name?** Not one single noun. In biology, it is **Permissive/Instructive Induction** or **Facultative Development**. In neuroscience, **Experience-Expectant Plasticity**. In philosophy, **Constraint Nativism**.
  *   **Are your near misses it?** No. Critical period is timing; Canalization is robustness; Preparedness is learning bias.
  *   **Is there a split?** Yes. **Permissive Triggering** (stabilizes a norm) vs. **Selective Triggering** (chooses a variant).
  *   **The Carve:** Call it **Triggered Specification**. It distinguishes the phenomenon from pure learning (induction) and pure maturation (pre-formation). It acknowledges that the environment is necessary without conceding that the environment is the *source* of the structure.

  You are describing **Developmental Plasticity under Genetic Constraint**. It is the standard model in modern Evo-Devo, but it remains the "missing middle" in many older arguments in the philosophy of language. Your retirement reading has led you to a genuine conceptual gap that is still being fought over.
