answer: |-
  You have spotted something that a lot of philosophers know but rarely admit out loud: the Extended Mind debate has hit a plateau. Your observation that the arguments have been looping since about 2010 is accurate. The "Parity Principle" (Clark/Chalmers) and the "Coupling-Constitution Fallacy" (Adams/Aizawa) are now like chess openings; everyone knows the moves, and nobody is checkmating anyone.

  To answer your core question: **This is primarily a dispute about explanatory utility disguised as a metaphysical dispute, with a significant verbal component gluing them together.**

  Your hunch is very close to the mark, but I would pressure-test it slightly. It isn't just that one side is doing metaphysics and the other is doing methodology. It's that both sides believe their methodology *requires* their metaphysics.

  Here is the breakdown of what is actually happening, why functionalism doesn't solve it, and what progress would actually look like.

  ### 1. The Diagnosis: A Clash of "Carving Nature"

  At its heart, this is a disagreement about how we "carve nature at its joints."

  **The Internalists (Adams/Aizawa)** argue that the boundary of the mind is a natural kind, like the boundary of a biological organism. Just as your digestive system stops at your skin, your cognitive system stops at your skull. To them, calling the notebook "part of the mind" is a category error, like calling a guitar part of a guitarist's hand. It's a tool, not a limb. They worry that if you let the mind leak out into the world, the word "mind" loses its scientific usefulness.

  **The Externalists (Clark/Chalmers)** argue that the boundary of the mind is defined by what the system *does*, not where it is located. If the notebook plays the exact same functional role as biological memory (it's trusted, accessible, and automatically endorsed), then drawing a line at the skull is "brain chauvinism." To them, the Internalists are clinging to a biological bias that hinders understanding how humans actually solve problems.

  **Why your hunch is right (and where it needs nuance):**
  You suggested one side is doing metaphysics (what is the mind?) and the other methodology (how do we study it?). Actually, both sides are arguing that their metaphysical claim leads to the best methodology.
  *   Clark says: "If you accept the metaphysics of extension, your methodology improves because you'll look at the whole system."
  *   Adams says: "If you reject the metaphysics of extension, your methodology improves because you won't confuse tools with agents."

  So, it's not that they are talking past each other on different tracks; they are fighting over which track leads to better science.

  ### 2. Pressure-Testing the Functionalism Assumption

  You asked if the functionalist assumptions force a substantive answer. Functionalism is the engine of the Extended Mind thesis. It says mental states are defined by their causal roles (inputs and outputs), not their physical makeup.

  If you are a strict functionalist, the Extended Mind thesis looks almost undeniable. If a silicon chip can do what a neuron does, it's mental. So why can't a notebook do what a neuron does?

  However, critics have pushed back on this by refining functionalism. They argue that **causal coupling is not functional identity.**
  *   **Example:** A thermostat is coupled to the temperature of a room. It regulates heat. But the thermostat isn't "part of the room's temperature." It's a regulator *of* the temperature.
  *   **The Critique:** Adams and Aizawa argue that Otto's notebook is a regulator of his memory, not an instance of it. The internalist says functionalism allows for multiple realization (brains vs. chips), but it doesn't demand spatial extension (inside vs. outside).

  So, functionalism doesn't settle the debate. It sets the stage, but the fight is about whether "location" is a relevant variable for functional definitions. The Internalists say yes (intrinsically biological processes matter); the Externalists say no (only the information flow matters).

  ### 3. Is it Verbal? (The "Pluto" Problem)

  There is a strong verbal element here. If "cognitive process" is defined as "information processing that guides behavior," then the notebook is cognitive. If "cognitive process" is defined as "neural activity that guides behavior," then it isn't.

  This is the "Pluto" scenario. We all agree on the facts: Otto looks at the notebook, retrieves the address, and goes to the museum. We all agree on the physics: photons hit the retina, signals go to the brain, hand moves pen.
  The disagreement is purely about whether we apply the label "mind" to the notebook.

  **However**, it's not *merely* verbal because the label carries baggage. If the notebook is part of the mind:
  *   Tampering with it might be assault, not just property damage.
  *   Losing it might be a medical tragedy, not just an inconvenience.
  *   In AI, the server running your digital assistant might be a part of *you*.

  Because the label changes how we treat the object, the verbal dispute has real-world stakes.

  ### 4. What Would Count as Progress?

  If the debate is frozen, how do we unstick it? Since this isn't an empirical question (you can't scan the notebook to find "mind stuff"), progress won't come from a new brain scanner. It will come from one of three shifts:

  **A. The Pragmatic Turn (The "Does It Help?" Test)**
  Progress happens if one side can demonstrate that their view generates better predictions or technologies.
  *   *For Externalists:* Show me a robot or an educational strategy that works *only* if you treat the external tool as part of the mind. If treating the notebook as "internal" leads to a breakthrough in AI architecture that treating it as "external" misses, the Externalists win.
  *   *For Internalists:* Show me a case where Extended Mind theory led to a confused design or a legal mess that a strict boundary would have avoided.
  *   *Current Status:* We don't have this yet. Both sides can build working models.

  **B. The Dissolution (Semantic Ascent)**
  Progress happens if we stop asking "Is it part of the mind?" and start asking "What kind of coupling is this?"
  Instead of a binary (Mind vs. Not-Mind), we develop a taxonomy of coupling.
  *   *Type 1:* Passive storage (a book on a shelf).
  *   *Type 2:* Active retrieval (Otto's notebook).
  *   *Type 3:* Integrated feedback (a blind man's cane, which becomes sensory).
  *   *Type 4:* Networked cognition (a team of surgeons).
  If we replace the single word "Extended" with a gradient of integration, the fight evaporates. We stop arguing about the label and argue about the mechanism. This is happening slowly in embodied cognition research, but the philosophy hasn't fully caught up.

  **C. The New Domain (Collective or Digital)**
  The debate might move because the examples have become outdated. Otto's notebook is a clunky analogy.
  *   *Digital:* Your smartphone is not just a notebook; it's a proactive agent that filters your reality. The "coupling" is much tighter.
  *   *Collective:* Is a team of scientists thinking together an "extended mind"?
  If the theory proves indispensable for explaining *digital* or *collective* cognition, it wins by utility, even if the metaphysics remain fuzzy.

  ### 5. Is the Stalemate a Defect?

  You asked if this is a defect in the debate or just what philosophy looks like.

  It's the latter. This is a **boundary concept**. Philosophy often makes progress not by answering the question, but by exhausting the possible answers and showing why the question was difficult in the first place.

  The Extended Mind debate has successfully forced cognitive scientists to stop treating the brain as a isolated computer. Even if you reject the thesis, you now have to argue *why* the skull matters. That is a win. The "frozen" state isn't a failure; it's a sign that the concept has been fully mined. We have extracted all the conceptual ore from "Otto's Notebook."

  **Summary for your article:**
  The debate is stuck because it's a **pragmatic disagreement wearing a metaphysical mask**. Both sides agree on the science but disagree on the best vocabulary to describe it. Progress won't come from proving one side "right" about the nature of reality. It will come from showing that one vocabulary is more useful for the next generation of technology, law, or psychology. If Extended Mind theory helps us build better AI or treat dementia patients better, it will win—not because it's metaphysically true, but because it works. If not, it will remain a fascinating philosophical zombie.
