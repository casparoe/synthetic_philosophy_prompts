  PRIVATE OFFERING MEMORANDUM
  THE PASADENA FUND, LLC

  I. INVESTMENT OBJECTIVE
  The Fund seeks to provide Qualified Purchasers with bespoke expected returns derived from non-absolutely convergent stochastic processes. Unlike traditional vehicles constrained by fixed probability distributions, the Fund leverages the properties of conditionally convergent series to target any real number $\mu \in \mathbb{R}$ specified in the client's Investment Policy Statement.

  II. INVESTMENT STRATEGY
  The Fund executes independent Bernoulli trials ($p=0.5$) until the first success occurs at trial $n$. Upon termination, the Fund realizes a cash flow of $(-1)^n \frac{2^n}{n}$. The probability-weighted contribution of each outcome is $\frac{1}{2^n} \cdot (-1)^n \frac{2^n}{n} = \frac{(-1)^n}{n}$. Aggregated, these terms constitute the alternating harmonic series. While the standard ordering suggests a limit near $-\ln(2)$, the Fund recognizes this is merely one configuration among infinitely many valid summations.

  III. RISK FACTORS
  **Undefined Expected Value.** The series governing the Fund's returns converges conditionally, not absolutely. Accordingly, the expected value is mathematically undefined. Investors should not utilize standard expectation operators ($E[X]$) when modeling portfolio allocation.
  **Infinite Variance.** Because the series of absolute values diverges, the variance is infinite. Standard risk metrics, including Sharpe ratios and Value-at-Risk, are inapplicable and will not be calculated.
  **Capital Calls.** While individual trades are bounded, the cumulative capital required to sustain the strategy in the limit may exceed available liquidity.
  **Regulatory Ambiguity.** Current accounting standards assume absolute convergence. The Fund operates in a niche where GAAP principles regarding matching and recognition may conflict with analytic truth.

  IV. ORDERING OF REPORTED RESULTS
  The Fund retains sole and absolute discretion over the sequence in which realized outcomes are aggregated for reporting purposes. Pursuant to the Riemann Rearrangement Theorem, a conditionally convergent series may be rearranged to converge to any arbitrary real number, or to diverge. Consequently, the Fund can truthfully advertise any target return to any individual client by adjusting the reporting sequence of trades. This rearrangement is performed at the Fund's sole discretion and does not constitute a change in investment strategy. Clients seeking specific returns must agree to the Fund's chosen summation order. This discretion is irrevocable upon subscription.

  V. FREQUENTLY ASKED QUESTIONS
  **Q: Can I net positive and negative terms in pairs to stabilize returns?**
  A: No. Associativity does not hold for conditionally convergent series. Grouping terms as $(-1 + 1/2) + (-1/3 + 1/4)$ yields a different sum than $-1 + (1/2 - 1/3) + \dots$. Unauthorized grouping by investors will result in reconciliation errors. The Fund strictly enforces a single-threaded reporting sequence to maintain the integrity of the selected limit.

  **Q: Is the expected value $-\ln(2)$?**
  A: Only under the canonical ordering. The Fund reserves the right to deviate from the canonical ordering to meet client mandates.

  VI. DISCLAIMER
  Past performance is not indicative of future results. Specifically, past performance is dependent upon the summation order employed during the reporting period. A rearrangement of historical data may yield materially different performance histories for the same underlying trades. Investors should not rely on historical cumulative returns as a proxy for future expectation, as no unique expectation exists. Consult your mathematician before investing.

  © 2024 The Pasadena Fund, LLC. All rights reserved.
