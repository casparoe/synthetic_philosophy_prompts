answer: |-
  **Final Examination: Truth, Validity, and Paradox**
  **Time Allowed:** 3 Hours
  **Section B: Essay Question (90 Minutes Recommended)**

  **Question 2:**
  Dialetheism, specifically via the logic LP, is often presented as a robust solution to the Liar paradox. By accepting that some sentences are both true and false (gluts) and rejecting the principle of Explosion (*ex contradictione quodlibet*), the dialetheist tolerates the contradiction generated by the Liar without collapsing into trivialism. However, Curry's paradox presents a sentence $C$ equivalent to the conditional "If $C$ is true, then $\pi$," where $\pi$ is an arbitrary sentence.

  (a) Schematically derive the conclusion $\pi$ from the naive truth schema and standard rules for the conditional. Explain precisely why the dialetheist's standard maneuver from the Liar case (tolerating gluts to block explosion) is not automatically available here, given that the derivation of $\pi$ in Curry's paradox does not essentially rely on negation or contradiction.

  (b) To solve Curry, one must block the derivation by restricting a logical rule or modifying the conditional. Choose **one** specific blocking strategy (e.g., restricting Contraction, weakening Modus Ponens, or adopting a substructural approach). Defend this choice against the objection that it cripples the conditional connective needed for the naive truth theory. Be honest about where the residual logical cost is largest.

  (c) Finally, consider the "v-Curry" paradox, involving a sentence $V$ that asserts, "If the argument from $V$ to $\pi$ is valid, then $\pi$." Explain why a solution to the truth-directed Curry paradox must also account for this validity-directed sibling. Does your chosen strategy in (b) generalize to block v-Curry, or does it require further revision to the concept of validity itself?

  ***

  ### Model Answer

  Curry's paradox begins with a sentence $C$ such that $C \leftrightarrow (T\langle C\rangle \to \pi)$. Using the naive truth schema ($T\langle A\rangle \leftrightarrow A$), we treat $C$ as equivalent to $C \to \pi$. The derivation proceeds: (1) Assume $C$; (2) By equivalence, infer $C \to \pi$; (3) By Modus Ponens (MP) on (1) and (2), infer $\pi$; (4) By Conditional Proof (CP) discharging (1), infer $C \to \pi$; (5) By equivalence, infer $C$; (6) By MP on (4) and (5), infer $\pi$. Since $\pi$ is arbitrary, the system is trivial.

  The dialetheist's LP solution to the Liar relies on the presence of negation. The Liar yields $L \wedge \neg L$. In classical logic, Explosion ($A, \neg A \vdash B$) propagates this contradiction to every sentence. LP blocks Explosion by allowing truth-value gluts ($1$ and $0$ simultaneously) while defining validity as the preservation of non-falsity (or designated values). However, Curry's derivation contains no negation. It relies solely on the conditional, the truth predicate, and self-reference. There is no contradiction to tolerate, only a direct slide to triviality. Accepting $C$ as a glut does not help, because the inference from $C$ and $C \to \pi$ to $\pi$ remains valid in LP. The paraconsistent refusal of explosion is irrelevant when the derivation never produces a contradiction to explode; it produces $\pi$ directly. Thus, the "swagger move" of accepting gluts fails; one must restrict the inference rules themselves.

  I argue for **restricting Contraction**. The step from (1)-(3) to (4) in the derivation above implicitly relies on the principle that if assuming $A$ twice yields $B$, assuming $A$ once yields $B$. Formally, $A \to (A \to B) \vdash A \to B$. In the derivation, we use $C$ to derive $\pi$, then discharge the assumption to get $C \to \pi$, but we effectively used the assumption $C$ twice: once to trigger the conditional, and once as the antecedent. A non-contractive logic blocks the move from $C \vdash C \wedge C$ (or the equivalent structural usage), preventing the self-application required to close the loop.

  The obvious objection is that this cripples the conditional. If we cannot contract, standard reasoning like "If I have a dollar, then if I have a dollar, I can buy coffee" collapses into "If I have a dollar, I can buy coffee" only with loss of information. Critics argue this makes the conditional useless for mathematics or daily life. I defend this by noting that most ordinary reasoning does not require the infinite reuse of a single premise. We can retain Modus Ponens and the Deduction Theorem in limited forms that suffice for naive truth, provided we track premise usage. The conditional remains intensional and robust enough for truth-theoretic biconditionals, even if it loses the structural property of idempotency.

  The residual cost is largest in proof theory. Standard reductio arguments and transitive chains of reasoning often rely on contraction implicitly. We lose the ability to treat premises as reusable resources, forcing a shift to a resource-sensitive logic (like linear logic variants). This is a high price, but cheaper than abandoning naive truth or classical negation entirely.

  Regarding v-Curry, the sentence $V$ states $Val(\langle V\rangle, \langle \pi\rangle) \to \pi$. The derivation mirrors truth-Curry but uses the validity predicate. If validity is defined structurally (preservation of truth), v-Curry reduces to truth-Curry. However, if validity is primitive, the same contraction issue arises: we use the assumption of $V$'s validity twice to derive $\pi$. My non-contractive strategy generalizes well here. By restricting the structural rule of Contraction in the meta-logic governing validity, we block the v-Curry derivation without needing a separate theory for truth and validity. The cost remains the same: validity is no longer a simple transitive relation over sets of premises, but over multisets. This unifies the solution, showing that the paradox is not about truth per se, but about the structural rules governing consequence.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Correct Schematic Derivation & LP Diagnosis (5 Marks)**
  *   **Must Hit:** Student derives $\pi$ using Fixpoint, MP, and CP (or equivalent), and explicitly states that Curry's derivation contains no negation/contradiction, rendering LP's explosion-block useless.
  *   **Typical Mistake:** Deriving Curry via negation (confusing it with Liar) or claiming LP solves Curry simply because it tolerates gluts.

  **2. Identification of the Specific Logical Cost (5 Marks)**
  *   **Must Hit:** Student identifies that the derivation relies on a specific rule (Contraction, MP, or DT) that must be restricted to block the paradox.
  *   **Typical Mistake:** Vaguely stating "logic must change" without identifying the specific rule or structural property responsible for the slide to trivialism.

  **3. Committed Defense of One Strategy (5 Marks)**
  *   **Must Hit:** Student selects **one** specific blocking strategy (e.g., No-Contraction) and argues for its viability. No surveying of multiple options without commitment.
  *   **Typical Mistake:** "Fence-sitting" by listing three solutions (e.g., "One could drop MP, or Contraction...") without arguing which is superior or defensible.

  **4. Evaluation of Residual Costs (5 Marks)**
  *   **Must Hit:** Student honestly acknowledges the cost of their chosen strategy (e.g., loss of standard proof techniques, resource sensitivity) and defends why it is acceptable compared to trivialism.
  *   **Typical Mistake:** Claiming the chosen restriction is "costless" or denying that it impacts ordinary reasoning/mathematics significantly.

  **5. Generalization to v-Curry (5 Marks)**
  *   **Must Hit:** Student explains that v-Curry targets validity directly and argues whether their chosen solution (from part 3) applies to the meta-logic/validity predicate or requires further revision.
  *   **Typical Mistake:** Treating v-Curry as identical to truth-Curry without noting the shift from truth-predicate to validity-predicate, or ignoring it entirely.
