      *   HFT: Agential. If "Human should stop," -> MHC Tracking. If "Too fast," -> Gap (Insure/Quietism).
      *   Chatbot: Epistemic. If "Audit logs," -> MHC Tracing. If "Unavoidable hallucination," -> Quietism.

      *(Final Polish on Vacancy)*:
