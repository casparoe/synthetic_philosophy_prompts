prompt: |-
  I moderate a discord server for about 20k members (retro computing stuff, if that matters) and I'm the one who has to decide which of our unwritten rules we write down in the welcome doc and which we leave alone. This fight comes up like clockwork: one mod says "if newcomers keep getting in trouble for breaking a rule they couldn't have known about, write it down," another says "half of these aren't rules, they're just habits, and writing them down turns habits into laws and changes them." I've stopped being able to tell which of them is right about which cases.

  I recently read a bit about David Lewis's book Convention (1969) — conventions as solutions to coordination problems, held up by everyone expecting everyone else to conform rather than by enforcement, arbitrary in the sense that some alternative arrangement would have coordinated everyone just as well, but sticky once in place. I'm honestly not confident I have this exactly right, so correct me where I'm off. It struck me that this framework gives me roughly the distinctions I need: mere habit vs. convention proper vs. norm with teeth, plus maybe a story about what codification does to a convention — my worry is that putting it in writing shifts it from "this is how we do things here" to "this is a rule with a rule-giver," which changes its character even if the words are identical.

  So: write me a procedure I can actually run on a candidate regularity when the "should we write it down" question comes up. Steps in order, what counts as a sufficient answer at each step, where the procedure should stop with a "don't codify," where it should say "codify, and here's the framing that does least damage," and where it has to hand the decision back to me because it's a values question rather than a classification question. Also tell me where the procedure is likely to misfire.

  Then run it on three real cases from the last few months:

  1. Newcomers keep getting quietly frozen out because they don't know that questions about a certain deprecated tool go in one channel and not another. Everyone who's been around a while knows it; nobody ever states it; no one gets punished, they just get silence.

  2. An emoji-reaction habit: one specific reaction has come to mean "I saw this, thanks." It spread from one popular member and now functions almost like acknowledgment etiquette — some people genuinly get offended when it isn't used on their posts. Nobody enforces anything.

  3. Self-promotion. This one has real enforcement (mods delete posts, occasionally ban) but it's contested — maybe 40% of active members think we're way too strict — and writing down the current practice would basically declare a winner in an ongoing argument.

  Case 3 is the one I expect your procedure to be least comfortable with, and possibly the one where I won't like its answer, but that's what I want it for. Also tell me straight what the procedure can't do — if the whole Lewis framework just goes silent on contested norms with enforcement, I want to know that instead of watching you pretend everything is a coordination problem.

  This comes up every few weeks and each round eats a two hour mod call, so keep it usable by the other mods, none of whom have read any philosophy. And keep it honest about which steps are judgement calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Discord server moderator (20k members, retro computing).
      *   **Problem:** Conflict between mods about codifying unwritten rules. One side says "clarity for newcomers," the other says "codification changes the nature of the norm (habit -> law)."
      *   **Theoretical Framework:** David Lewis's *Convention* (1969). Key concepts: coordination problems, arbitrary but sticky solutions, expectations-based compliance vs. enforcement-based compliance.
      *   **Task 1:** Create a usable procedure (algorithm/checklist) for mods to decide whether to codify a regularity.
          *   Must include steps, stopping conditions ("don't codify," "codify with framing," "escalate to head mod").
          *   Must identify where the procedure might misfire.
          *   Must be usable by mods without philosophy backgrounds.
          *   Must be honest about where it's just "judgment calls dressed up as procedure."
      *   **Task 2:** Run the procedure on three specific cases:
          1.  Channel usage for deprecated tools (silence as penalty).
          2.  Emoji reaction habit (social expectation, offense taken).
          3.  Self-promotion (enforced, contested, political).
      *   **Task 3:** Explicitly state limitations, especially regarding Lewis's framework on contested/enforced norms.

  2.  **Analyze the Lewis Framework (Mental Check):**

      *   *Convention:* A regularity in behavior, common knowledge, arbitrary (could have been different), solves a coordination problem, sustained by mutual expectations.
      *   *Norm/Rule:* Often implies enforcement or moral weight, not just coordination.
      *   *Codification:* Turns a convention (I do X because I expect you to do X) into a rule (Do X because Authority says so). This shifts the motivation from coordination to obedience.
      *   *Limitation:* Lewis focuses on *coordination* (getting along), not *conflict* (competing interests). Case 3 (self-promotion) is a conflict of interest (creators want reach vs. community wants signal-to-noise), not purely a coordination problem. Lewis might struggle here.

  3.  **Drafting the Procedure (The "Lewis Litmus"):**

      *   *Goal:* Distinguish between Convention (don't codify), Norm/Rule (codify), and Political Conflict (escalate).
      *   *Step 1: The Penalty Test.* What happens if you break it?
          *   Silence/Confusion -> Convention.
          *   Social Awkwardness -> Norm/Convention hybrid.
          *   Ban/Delete -> Rule.
      *   *Step 2: The Arbitrariness Test.* Could it have been the other way around?
          *   Yes (Left vs. Right drive) -> Convention.
          *   No (Don't post porn) -> Moral/Safety Rule.
      *   *Step 3: The Expectation Test.* Why do people follow it?
          *   "Because everyone else does" -> Convention.
          *   "Because mods will catch me" -> Rule.
      *   *Step 4: The Newcomer Cost.* How hard is it to learn by osmosis?
          *   Easy -> Don't codify.
          *   Hard/Expensive -> Codify (as guidance, not law).
      *   *Step 5: The Conflict Test.* Is there significant disagreement?
          *   No -> Convention/Rule.
          *   Yes -> Political/Values (Escalate).

      *   *Refining for Usability:* Make it a flowchart style text. Use plain language. Acknowledge the "judgment call" spots.

  4.  **Running the Cases:**

      *   *Case 1 (Deprecated Tool Channel):*
          *   Penalty: Silence (coordination failure).
          *   Arbitrariness: High (could be any channel).
          *   Expectation: Efficiency.
          *   Newcomer Cost: High (silence is discouraging).
          *   Conflict: Low.
          *   *Verdict:* Codify as *Guidance*, not Rule. "Where to ask" not "Thou shalt."
      *   *Case 2 (Emoji Reaction):*
          *   Penalty: Social offense (hurt feelings).
          *   Arbitrariness: High (any emoji or word works).
          *   Expectation: Social signaling.
          *   Newcomer Cost: Medium.
          *   Conflict: Medium (some offended).
          *   *Verdict:* Do NOT codify. Codifying makes it mandatory, killing the spirit. Mention it in "Tips" maybe, but not rules.
      *   *Case 3 (Self-Promotion):*
          *   Penalty: Ban/Delete (Enforcement).
          *   Arbitrariness: Low (resource scarcity).
          *   Expectation: Fear of mods.
          *   Conflict: High (40% disagree).
          *   *Verdict:* Escalate. This is politics, not convention. Lewis doesn't help here. Needs a values decision.

  5.  **Addressing Limitations & Honesty:**

      *   Lewis assumes common interest. Case 3 is mixed motive.
      *   Codification *always* changes the vibe (Reification).
      *   The procedure can't remove the Head Mod's burden; it just filters the easy stuff.
      *   Must explicitly state where the mods are just guessing.

  6.  **Refining the Tone:**

      *   Professional, direct, slightly analytical but accessible.
      *   Acknowledge the user's philosophical insight (Lewis) without getting bogged down in jargon during the procedure itself.
      *   Ensure the "judgment call" warnings are prominent.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Add specific questions they can ask in a mod meeting.
      *   *Critique:* Did I address the "codification changes character" worry?
      *   *Fix:* Include a specific framing step for codification (Guidance vs. Law).
      *   *Critique:* Is Case 3 handled honestly?
      *   *Fix:* Explicitly state Lewis fails here because it's not a coordination problem, it's a resource allocation problem.

  8.  **Final Polish:** Check against all constraints in the prompt (20k members, retro computing context, usable by non-philosophers, honest about limitations). *Self-correction: Make sure to explicitly mention where the procedure stops and hands back to the user.*

  9.  *(Final thought on Lewis)*: Lewis's *Convention* is specifically about *arbitrary* solutions to *recurrent coordination problems*. If there's enforcement, it's moving towards *Norm* or *Law*. If there's conflict, it's *Politics*. The procedure needs to map these transitions.

  10. **Drafting the Response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is a sharp application of Lewis. You are correct that codification shifts a *convention* (I do X because I expect you to do X, and we both benefit) into a *rule* (Do X because Authority says so, or else). Lewis argues conventions survive on mutual expectations, not enforcement. Once you write it down, you introduce an enforcer, which changes the motivational structure.

  However, Lewis's framework is designed for *coordination problems* (we both want to meet, where?), not *conflict problems* (I want to promote, you want quiet). Your third case exposes the limit of the theory.

  Below is the procedure, designed for your mod team. It translates the philosophy into operational questions. Following that, I run the three cases, and then I list the limitations.

  ***

  # The "Codification Litmus" Procedure

  **Purpose:** To decide if an unwritten regularity should be added to the Welcome/Rule doc.
  **Users:** Mod Team.
  **Time:** 5–10 minutes per item.

  ### Step 1: The Penalty Test
  **Ask:** *What actually happens when someone breaks this regularity?*
  *   **A:** Nothing formal. They get ignored, confused, or the conversation stalls.
  *   **B:** People get annoyed, sigh, or make passive-aggressive comments.
  *   **C:** Mods intervene (delete, warn, ban, timeout).

  **Decision:**
  *   If **A**: Go to Step 2. (Likely a Convention)
  *   If **B**: Go to Step 2. (Likely a Social Norm)
  *   If **C**: Go to Step 4. (Likely a Rule/Policy)

  ### Step 2: The Arbitrariness Test
  **Ask:** *Could we have solved this problem a different way with equal success?*
  *   **Yes:** (e.g., "We could have put deprecated tools in Channel B instead of Channel A," or "We could use 👍 instead of 👀 to mean 'seen'.")
  *   **No:** (e.g., "Don't post illegal content." There is no alternative arrangement that works.)

  **Decision:**
  *   If **No**: **CODIFY.** This is a safety/legal baseline, not a convention. Write it down clearly. Stop.
  *   If **Yes**: Go to Step 3.

  ### Step 3: The Osmosis Cost Test
  **Ask:** *How hard is it for a sincere newcomer to figure this out by watching?*
  *   **Low:** They'll see it in the first 10 minutes.
  *   **Medium:** It might take a few days or one failed attempt.
  *   **High:** They will likely leave or feel rejected before they figure it out (e.g., silence in the wrong channel).

  **Decision:**
  *   If **Low**: **DON'T CODIFY.** Let it remain a convention. Writing it down adds clutter without value. Stop.
  *   If **Medium/High**: **CODIFY AS GUIDANCE.** Do not write it as a Rule ("Must"). Write it as a Tip ("Recommended").
      *   *Framing:* "To get the best answers, try posting in #X." NOT "Posts in #Y will be ignored."
      *   Stop.

  ### Step 4: The Consensus Test (For Enforced Items)
  **Ask:** *If we wrote down exactly how we enforce this today, would a significant minority (say, >25%) of active members feel the doc is now "wrong"?*
  *   **No:** The community largely accepts the enforcement.
  *   **Yes:** The enforcement is contested or political.

  **Decision:**
  *   If **No**: **CODIFY AS RULE.** The enforcement exists; transparency helps newcomers. Frame it clearly as a Mod Action item. Stop.
  *   **If Yes**: **ESCALATE TO HEAD MOD.** This is not a classification question; it is a values/policy decision. The procedure stops here.

  ***

  # Where This Procedure Misfires (Read Before Using)

  1.  **The "Guidance" Trap:** Step 3 suggests codifying as "Guidance." Be warned: Newcomers often cannot distinguish between "Tip" and "Rule." If a mod enforces the tip later, it feels like a bait-and-switch.
  2.  **Step 4 is Political:** Step 4 admits that Lewis's framework breaks down when interests conflict. The procedure cannot solve Case 3; it can only identify it as a problem *you* must solve.
  3.  **The "Vibe" Shift:** Even if the procedure says "Codify as Guidance," the mere act of writing it down makes the server feel more bureaucratic. The procedure measures *clarity*, not *culture*. You must weigh the culture cost separately.
  4.  **Judgment Calls:** Steps 2 and 3 are subjective. One mod's "Arbitrary" is another's "Best Practice." If mods disagree on the Step 2 answer, treat it as a Step 4 Escalation.

  ***

  # Running the Cases

  ### Case 1: The Deprecated Tool Channel
  *   **Step 1 (Penalty):** **A (Silence).** No mods intervene; the community just doesn't answer.
  *   **Step 2 (Arbitrariness):** **Yes.** You could have assigned that tool to any channel. It is a coordination convention.
  *   **Step 3 (Osmosis Cost):** **High.** "Silence" is a punishing teacher. A newcomer thinks their question is stupid, not that they are in the wrong room. They leave.
  *   **Verdict:** **CODIFY AS GUIDANCE.**
  *   **Framing:** Do not write "Do not post X in Y." Write: *"Questions about [Tool] get the fastest answers in #[Channel]."*
  *   **Why:** This preserves the convention (it's about getting help, not obeying mods) but lowers the barrier to entry. It solves the coordination problem without introducing enforcement.

  ### Case 2: The Emoji Reaction
  *   **Step 1 (Penalty):** **B (Social Offense).** People get hurt feelings, but no mod action.
  *   **Step 2 (Arbitrariness):** **Yes.** Totally arbitrary. Any signal could work.
  *   **Step 3 (Osmosis Cost):** **Medium.** You notice it after a week.
  *   **Verdict:** **DON'T CODIFY.**
  *   **Why:** This is a pure Lewis Convention. It relies on *voluntary* participation to signal goodwill. If you write it down ("Please react with 👀"), it becomes a tax on posting. The value of the emoji is that it is *given*, not *owed*. Codification kills the sentiment behind the signal.
  *   **Mitigation:** If mods are worried about newcomers feeling excluded, add a line in the welcome doc: *"Regulars often use 👀 to acknowledge posts. It's a friendly habit, but don't worry if you forget it."* This explains the behavior without mandating it.

  ### Case 3: Self-Promotion
  *   **Step 1 (Penalty):** **C (Enforcement).** Mods delete and ban.
  *   **Step 2 (Arbitrariness):** **No/Low.** This isn't just coordination; it's resource scarcity (attention). You can't have "free promotion" and "low noise" simultaneously.
  *   **Step 4 (Consensus):** **Yes (Escalate).** 40% of members think enforcement is too strict.
  *   **Verdict:** **ESCALATE TO HEAD MOD (You).**
  *   **Why:** The procedure halts here because this is not a convention; it is a **policy conflict**. Lewis's framework assumes everyone *wants* to coordinate. Here, one group (promoters) wants X, and another group (readers) wants Y.
  *   **Action:** You cannot solve this with a flowchart. You have to decide the server's values.
      *   *Option A:* Loosen rules to match the 40% (risk driving away readers).
      *   *Option B:* Keep strict rules and write them down clearly (risk driving away creators).
      *   *Option C:* Create a specific "Promo" channel (Coordination solution).
      *   *Recommendation:* If you choose B, **CODIFY.** Since enforcement is active, ambiguity helps no one. Write the rule strictly. The 40% will complain, but at least they know the law. Ambiguity favors the privileged who know the unwritten rules; clarity favors the outsiders.

  ***

  # Limitations of the Lewis Framework (The "Honest Truth")

  You asked where the framework goes silent. Here it is:

  **1. Mixed-Motive Games:**
  Lewis's *Convention* works for "Driving on the Right." Everyone wins if we agree, it doesn't matter which side.
  It fails for "Self-Promotion." This is a "Chicken" or "Prisoner's Dilemma" game. Promoters win if they break the norm and don't get caught; Readers win if Promoters obey. Writing this down doesn't shift "habit to law"; it declares war on one faction. Lewis offers no help here because there is no equilibrium everyone prefers.

  **2. Power Dynamics:**
  Lewis treats conventions as emergent and egalitarian. In a 20k member Discord, they are not. "Old guard" habits often exclude newcomers not by accident, but by design (gatekeeping).
  *   *Case 1* looks like a convention, but if the "old guard" enjoys the feeling of being the only ones who know where to post, it's a power move.
  *   The procedure assumes good faith. If your mods suspect a "habit" is actually gatekeeping, skip the procedure and ban the habit.

  **3. The Reification Effect:**
  The procedure tries to minimize damage via "Framing" (Guidance vs. Rule). But psychologically, **Ink is Law.**
  Even if you write "Tip: Use Channel A," a newcomer who uses Channel B and gets ignored will blame the *Rule*, not the *Convention*. They will perceive the silence as enforcement. You cannot fully insulate a written norm from becoming a "law with a rule-giver." The act of writing it in the Welcome Doc makes you the Rule-Giver, regardless of your disclaimers.

  **Summary for your Mod Team:**
  Use the procedure to filter out the easy stuff (Case 1 and 2). It will save you time on the "Emoji" and "Channel" debates. But accept that Case 3 will always eat two hours of your time, because no procedure can resolve a conflict of values. That is your job, not the flowchart's.
