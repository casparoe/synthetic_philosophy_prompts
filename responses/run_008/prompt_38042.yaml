      *   **Carter-Leslie Doomsday Argument (Birth Rank):** Based on observer count $N_{past}$. Predicts total observers $N_{total}$. If you are a random observer, you are likely near the median. If population grows exponentially, most observers live near the end. Therefore, if you are alive *now*, the end is likely near.
