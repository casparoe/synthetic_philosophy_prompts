answer: |-
  You have identified a genuine tension that has been chewed over in the rationalist/anthropic literature for two decades, and your intuition that something is being glossed over when people wave their hands at "reference classes" is correct.

  As a physics grad student, you are looking for the likelihood functions and the priors. The short answer is: **You are conflating two different mathematical arguments (Gott's Duration vs. Carter's Birth Rank), and the x-risk position relies on claiming non-stationarity in the hazard rate to invalidate the "Outside View" prior derived from the 5,000-year track record.**

  Here is the breakdown of why the math doesn't force the conclusion you think it does, and where the equivocation lies.

  ### 1. Duration vs. Birth Rank (The Equivocation)

  You correctly identified that Gott's Copernican Principle and the Carter-Leslie Doomsday Argument (DA) are often treated as the same thing in casual discourse. They are not. They rely on different variables.

  *   **Gott's Argument (Temporal):** Uses elapsed time $t_{past}$. Assumes a scale-invariant prior $P(t_{total}) \propto 1/t_{total}$. This implies a hazard rate $h(t) \propto 1/t$. The longer something lasts, the *less* likely it is to end in the next instant (or at least, the probability doesn't increase).
  *   **Carter's Argument (Observational):** Uses observer rank $n_{past}$. Assumes you are a random sample from the set of all observers $N_{total}$. $P(N_{total} | n_{past}) \propto 1/N_{total}$.

  **Where they come apart:**
  They only yield similar predictions if the observer birth rate is constant. If the population is growing exponentially (which it has been for the last few centuries), the two measures decouple.
  *   In an exponential growth scenario, the vast majority of all observers who will ever exist are born in the last few generations before the population stops growing (either by colonization or extinction).
  *   Therefore, under the Self-Sampling Assumption (SSA), finding yourself alive *now* (during the peak growth phase) implies you are likely near the end of the sequence of observers, even if the *temporal* duration of the species continues for a while with a small population.

  **The X-Risk Move:**
  When x-risk proponents argue for doom this century, they are rarely using Gott's temporal argument. They are implicitly using a Carter-style birth-rank argument (we are among the first humans to face these specific risks) combined with an object-level model. When they want to argue against "we are special," they use Gott. When they want to argue for doom, they use Carter. You are right to call this suspicious, but the technical defense is that the **reference class of "observers facing technological singularity"** is different from the reference class of "civilizations."

  ### 2. The Hazard Rate and Non-Stationarity

  This is the most critical point for a physicist. Your Bayesian objection is: *Shouldn't 5,000 years of survival data swamp the prior?*

  Mathematically:
  $$ P(\text{Doom} | \text{Data}, \text{Model}) \propto P(\text{Data} | \text{Doom}, \text{Model}) \cdot P(\text{Doom} | \text{Model}) $$

  The Gott argument assumes a **stationary process** (or specifically, a power-law decay). It assumes the mechanism causing extinction today is drawn from the same distribution as the mechanism causing extinction 3,000 years ago.

  The x-risk argument is explicitly a claim of **non-stationarity**.
  *   **The Model:** The hazard rate $h(t)$ is a function of technological capability $Tech(t)$.
  *   **The Data:** For 4,900 of the last 5,000 years, $Tech(t)$ was below the threshold for global extinction (nukes/AI/synthetic bio).
  *   **The Likelihood:** $P(\text{Survival}_{0 \to 4900} | \text{AI Doom}_{5000}) \approx 1$.

  If the risk is novel, the past survival data has a likelihood near 1.0 for the "AI Doom" hypothesis. It does not update against it. To use the physics analogy: If you are testing a pressure vessel, and you increase the pressure by 10% every hour, the fact that it didn't burst in hours 1–50 tells you almost nothing about whether it will burst in hour 51, *if* hour 51 exceeds the yield strength for the first time.

  The "Outside View" (Gott) assumes you are drawing from a distribution of *similar* vessels under *similar* stress. The x-risk "Inside View" claims the stress conditions have changed order-of-magnitude. The rationalist defense is that the Outside View prior is valid only when the reference class is truly exchangeable. If you have evidence that the current instance is structurally different (transformative AI), you must update the prior.

  ### 3. SSA vs. SIA (The Anthropics Split)

  You mentioned the x-risk crowd takes anthropics seriously. It is crucial to note that the community is split on SSA (Self-Sampling Assumption) vs. SIA (Self-Indication Assumption).

  *   **SSA:** You are a random observer from the set of actual observers. **Implies Doomsday Argument.** (Favors shorter futures).
  *   **SIA:** You are a random observer from the set of *possible* observers, weighted by the probability of that world existing. **Refutes Doomsday Argument.** (Favors larger futures, because you are more likely to exist in a universe with more observers).

  Many prominent x-risk thinkers (including Bostrom in later work, and many in the effective altruism sphere) lean toward SIA or "Full Non-indexical Conditioning." Under SIA, the Doomsday Argument vanishes.

  So, why do they still predict doom?
  Because they separate **Anthropic Uncertainty** from **Empirical Uncertainty**.
  *   **Anthropic Update:** "Given I exist, does that make a long future more likely?" (SIA says yes).
  *   **Empirical Update:** "Given the physics of neural networks and geopolitical incentives, what is the probability of alignment failure?" (Models say high).

  For a modern x-risk proponent, the "Doom This Century" probability comes almost entirely from the Empirical Update (the object-level AI models), *not* the Anthropic Update. In fact, if they are SIA users, the anthropic update is pushing them *away* from doom, and the object-level models have to be strong enough to overcome that.

  ### 4. The "Reference Class" Hand-Waving

  You asked for this to be spelled out. When they say "reference class," they are trying to solve the problem you posed: *Why 5,000 years of civilization and not 13.8 billion years of universe?*

  *   **Gott's Reference Class:** "Phenomena with a defined start and end." Problem: When does civilization start? Agriculture? Writing? If you pick "Writing" (~5k years), you get Gott's prediction. If you pick "Hominids" (~2M years), the 95% window extends vastly further.
  *   **X-Risk Reference Class:** "Technological civilizations capable of self-destruction." This class has $N=1$ (us). You cannot do frequentist statistics on $N=1$.

  Because $N=1$, the "Outside View" collapses into a Prior. The debate is then entirely about the Prior.
  *   **Skeptic Prior:** Civilizations are robust; 5,000 years of data suggests stability.
  *   **X-Risk Prior:** The "Great Filter" is ahead of us. The fact that we see no aliens (Fermi Paradox) suggests the step from "radio waves" to "interstellar" has a very high failure rate.

  The x-risk argument is essentially: *The Fermi Paradox provides an Outside View prior that the filter is hard. The AI models provide an Inside View likelihood that the filter is right here.*

  ### 5. Summary of the Resolution

  To answer your specific questions:

  1.  **Does the Copernican principle not count as evidence once you have an object-level model?**
      Correct. In Bayesian terms, if your object-level model specifies a time-dependent hazard rate $h(t)$ that is negligible for $t < t_{critical}$ and high for $t \ge t_{critical}$, the Copernican prior (which assumes scale invariance) is the wrong prior. You update to the model that accounts for the non-stationarity.

  2.  **Is the x-risk position failing to update on 5,000 years of not dying?**
      No, because the likelihood of not dying for 5,000 years *given* "Existential Risk emerges in 2024" is high. The data is consistent with the hypothesis. It would only falsify the hypothesis if the hypothesis claimed high risk existed in 3000 BC.

  3.  **Duration and birth-rank versions come apart?**
      Yes. With exponential population growth, the Birth-Rank argument (Carter) implies doom much sooner than the Duration argument (Gott). X-riskers often rely on the intuition behind Carter (we are early in the potential sequence of observers) without strictly endorsing the math, while using Gott only when it suits the "we aren't special" argument. This is the equivocation you sensed.

  **The Bottom Line:**
  The x-risk community's high probability on "Doom This Century" is not derived from anthropic reasoning (which is ambiguous and often cancels out between SSA/SIA). It is derived from **object-level models of technology** which claim to override the "Outside View" base rate by demonstrating a structural break in the hazard rate.

  Your skepticism is well-placed regarding the *consistency* of their anthropic rhetoric (they do sometimes misuse Gott), but their core probability mass on doom is not mathematically inconsistent with the 5,000-year track record, provided you accept the premise that the risk function is non-stationary. If you reject the non-stationarity premise (i.e., you think AI is just another risk like plagues or nukes), then yes, the 5,000-year track record should swamp their models, and they are violating the Outside View. The entire debate ultimately rests on whether AI is a "new physics" of risk or just another variable in the old equation.
