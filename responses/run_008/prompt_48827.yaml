  So here's the proposition I want your credence on: the new riddle of induction is a genuinely open problem, in the sense that no account of inductive validity can be given that is simultaneously (a) non-circular, and (b) free of appeal to substantive, contingent facts about which predicates or kinds happen to be entrenched in our conceptual scheme. Note that this is compatible with the Bayesian machinery being perfectly fine as a formalism — the question is whether anything dissolves the riddle rather than just redescribing where we bite the bullet.

  I don't want "it depends" — I want a number and the decomposition. Things I'd expect to see as terms (add or swap as you see fit): the probability that there's a language-invariant fact of the matter about projectibility, as opposed to it being genuinely relative to our conceptual scheme; the probability that Goodman's own entrenchment story is non-circular or whether it just explains our inductive habits by pointing at our inductive habits; the probability that the time-indexing in the grue predicate already breaks the symmetry in some principled way (and whether the standard grue-and-bleen reversal, where green comes out the gerrymandered one, really does neutralize that move); the probability that the low-prior Bayesian response counts as dissolving rather than relocatting the question; and the probability that some entrenchment-plus-evolution or natural-kinds story (the thought that creatures whose "projectible" predicates tracked real sameness of kind were the ones whose descendants exist) gives us external justification rather than an explanation of why we can't help doing it. A rough probability and one line of justification for each term, then the combination, then tell me which single term your final number is most sensitive to and what argument or discovery would move that term the most.

  Last thing: my friend is at maybe 0.8 that the riddle is "basically solved" (I know that's not the exact negation of my proposition — note where you think the gap is), and I'm at 0.3. Tell me where you think our disagreement most likely lives. My own guess is that it's a semi-verbal dispute over what counts as "answering" a demand for justification versus showing that the demand can't be met and living with it, but I'd like your read on whether that's right or whether one of us is just wrong on the substance. Don't be diplomatic about it.
