  I've been arguing with a friend about the new riddle of induction and I want an outside opinion in the form of an actual number, not vibes. You're a professional philosopher working on confirmation theory and formal epistemology, so please reason like one: think carefully, maybe brainstorm the possible decompositions before you commit to anything, and only then give numbers.

