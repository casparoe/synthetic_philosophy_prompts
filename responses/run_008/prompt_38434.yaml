answer: |-
  **MEMORANDUM**

  **TO:** Instructor Certification Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Instructor Certification Standards

  **Recommendation**
  I recommend we **approve the proposed examination and practicum model, conditional on two specific safety modifications.** We should drop the requirement for a current racing skipper certificate, but we must not replace it with a purely theoretical assessment. The new protocol requires a mandatory, on-water safety and rescue demonstration by the candidate, independent of the teaching practicum.

  **The Conceptual Dispute**
  The debate before us mirrors the philosophical tension between "knowing-how" (Ryle) and "knowing-that" (Intellectualism). Proponents argue that instructional competence is a matter of theoretical mastery and pedagogical skill; if a candidate can articulate the aerodynamics of a gybe and guide a demonstration, they are qualified. Opponents argue that sailing is a embodied skill; without current performance ability, an instructor lacks the kinesthetic intuition to recognize or correct danger.

  Both sides are partially correct. The Intellectualist view holds for *technique*: a non-racer can effectively teach sail trim via theory and guided demonstration. However, the Rylean objection holds for *safety*. There is a gap between knowing the proposition "ease the sheet in a squall" and feeling the heel angle that precedes a capsize. The proposed written exam cannot detect this gap. It tests cognitive recall, not situational awareness.

  **Teaching vs. Possessing the Skill**
  Does teaching a skill require possessing it? For elite racing tactics, no. A coach need not be an Olympian. However, for basic seamanship, an instructor must possess *functional* competency. If a student freezes at the helm in a gale, the instructor must be able to physically take the tiller and recover the boat. Knowledge-that plus teaching competence cannot substitute for this specific performance ability. If we license instructors who cannot physically intervene, we create a liability where the "teacher" is merely a passenger with a microphone.

  **Recency vs. Ability**
  The current rule conflates *retaining a skill* with *currently being able to exercise it*. As noted, a master racer sidelined by injury retains "knowing-how" despite lacking a racing certificate. Conversely, a sailor who raced five years ago but hasn't sailed since may hold a current certificate but lack the skill.

  Our policy must distinguish between *capacity* and *decay*. We should not penalize physical limitations (age, injury) that prevent racing but allow safe instruction. However, we must guard against skill decay. Therefore, recency requirements should not mandate *racing*, but they must mandate *on-water activity*.

  **Conditions for Approval**
  To mitigate the risks identified by opponents while adopting the flexibility proponents seek, the following conditions apply:

  1.  **Safety Rescue Competency:** While the teaching practicum allows a qualified skipper to demonstrate racing maneuvers, the *candidate* must independently demonstrate capsize recovery, man-overboard retrieval, and heavy-weather handling. This ensures they can get students out of trouble, even if they cannot race.
  2.  **Activity-Based Recency:** Replace the "racing certificate" requirement with a log of minimum on-water hours (e.g., 20 hours per year) or a biennial practical skills check focused on boat handling, not racing results.

  **Defining Failure**
  How will we know if this committee chose wrong? We should look for a specific observable failure: **An incident where a certified instructor fails to physically intervene in a developing emergency because they lacked the muscle memory or boat-handling reflex to do so.** If an instructor talks a student through a situation that results in injury or equipment loss, where a physically competent sailor would have taken the tiller, our new standard has failed.

  **Conclusion**
  We can welcome excellent teachers who are no longer racers without compromising safety. By separating *instructional theory* from *safety handling*, we acknowledge that one can teach racing without racing, but one cannot teach safety without being safe.

  **Action Required**
  Vote to adopt the proposal with the safety and recency conditions outlined above.
