he analogous indeterminacies I care about in practice, like choosing a prior over an unknown parameter's scale versus its log-scale. Multiply out (or otherwise combine) the terms, tell me which term dominates your uncertainty, and describe one concrete result or argument — not a new interpretation of the same three methods — that would move your final number by at least 0.15 in either direction.
