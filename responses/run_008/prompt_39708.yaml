answer: |-
  Based on Bea's track record, she isn't running a simple "Fact vs. Value" algorithm, nor is she a full-blown aesthetic skeptic. She is operating on a **Principle of Aesthetic Autonomy constrained by Pragmatic Necessity.**

  Here is the breakdown of her rule, the consistency of the exhibition case, her predictions for the new scenarios, and the case that best separates the competing interpretations of her behavior.

  ### The Rule: Autonomy of Engagement
  Bea's core principle is: **You cannot outsource an aesthetic judgment if you are going to undergo the experience, but you may outsource the decision to avoid the experience if the source is trusted.**

  *   **Engagement requires Autonomy:** If she consumes the art (Novel, Wine, Concert), she must form the value judgment herself. Testimony about quality is irrelevant or rejected (Novel, Wine, Concert "goodness").
  *   **Facts are Testifiable:** She accepts empirical or psychological facts that don't require aesthetic sensitivity (Pigment date, Friend's tears).
  *   **Avoidance is Pragmatic:** If she *doesn't* consume the art, she treats aesthetic testimony as pragmatic advice rather than aesthetic truth. She accepts her sister's "filler" claim not as a verdict on the art's ontology, but as a trusted filter for her time.

  ### Is the Exhibition Case a Wrinkle?
  **It is consistent, not a wrinkle.**
  The exhibition case looks like a contradiction only if you assume accepting the sister's advice means Bea adopted the aesthetic judgment "This art is bad." Under her rule, she didn't. She adopted the pragmatic judgment "This is not a good use of my time."
  *   **Novel:** She engaged -> She required her own aesthetic verdict.
  *   **Exhibition:** She disengaged -> She accepted a pragmatic filter.
  She never claimed the exhibition *was* filler; she simply acted on the testimony that it *would be experienced as such*, saving her the cost of verification. This aligns perfectly with the Wine case: she refused to accept the sommelier's verdict *because* she intended to taste. If she had decided not to drink the wine, she might well have accepted the sommelier's advice to pour it out.

  ### Predictions for the Three New Situations

  **1. The Lost Bootleg**
  *   **Verdict:** She will accept the *report of the experience*, but reject the *aesthetic verdict*.
  *   **Reasoning:** This mirrors the "Concert Tears" case. She cannot verify the quality (no acquaintance possible), so she treats the claim "it was beautiful" as a fact about the *listener*, not the *tape*. She will say, "I believe *you* found it beautiful," but she will not agree that "It *was* beautiful." Since she can never hear it, the aesthetic property remains suspended for her.

  **2. The Movie Text ("Devastating")**
  *   **Verdict:** She will reject the claim as a pre-emptive judgment.
  *   **Reasoning:** This mirrors the "Novel" and "Wine" cases. She is about to engage with the object. "Devastating" is a claim about the film's emotional effect (a value/effect hybrid). Because she is going to watch it, she reserves the right to determine the impact herself. She might reply, "I'll see if it devastates *me*," refusing to let the text frame her emotional response.

  **3. The Hiking Stranger ("Overrated")**
  *   **Verdict:** She will ignore the advice regarding quality.
  *   **Reasoning:** This is the "Novel" case again. She is hiking to the viewpoint (engagement). The stranger is a low-trust source (unlike the sister), but even if it were a friend, her rule prioritizes autonomy during engagement. She will reach the viewpoint and form her own opinion on whether it is overrated.

  ### The Separating Case: The Bootleg
  The **Bootleg** scenario best separates the competing rules (Fact/Value vs. Verification/Acquaintance).

  *   **The Tension:** The Bootleg and the Movie text pull in opposite directions regarding **Verifiability**.
      *   **Movie:** She *can* verify the claim immediately. A "Verification Rule" says: *Reject testimony because you can check it yourself.*
      *   **Bootleg:** She *cannot* verify the claim ever. A "Verification Rule" says: *Accept testimony (or suspend judgment) because you can't check it.*
      *   **Fact/Value Rule:** Says *Reject* in both cases (both are value claims).

  *   **Why it Separates Them:**
      If Bea accepts the bootleg claim ("It was beautiful") simply because she can't disprove it, she is prioritizing **Verifiability** (believing what she can't check). If she rejects it (saying "I can't call it beautiful without hearing it"), she is prioritizing the **Fact/Value Line** (never accepting aesthetic value testimony, regardless of verifiability).
      Given her handling of the Concert (where she rejected the friend's "good" verdict even though she couldn't re-watch the concert to check), she prioritizes the **Fact/Value Line**. She treats aesthetic value as something that requires *her* acquaintance to become true *for her*, even if that acquaintance is now impossible.

  **Summary:** Bea is an **Aesthetic Empiricist**. She believes aesthetic truth is created in the encounter between the viewer and the object. Testimony can guide her *to* the encounter (or away from it, via the sister), but it cannot substitute *for* the encounter.
