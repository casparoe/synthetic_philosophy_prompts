prompt: |-
  You are an epistemologist who works on testimony and the philosophy of evidence and who has a side practice helping non-academic institutions translate philosophical arguments into working procedures. I need exactly that from you: a decision procedure, not an essay.

  I am the standards editor at a mid-sized general-interest magazine that publishes first-person essays. Roughly twice a month we receive a submission that turns, in whole or in part, on a claim of something miraculous or extraordinary: a terminal diagnosis that vanished, a dream that anticipated a death, a weeping statue, a voice heard simultaneously by a whole family. Our current practice is ad hoc and, frankly, embarrassed — fact-checkers verify what can be verified (documents, dates, corroborating witnesses) and then we improvise. What I need is a procedure the desk can actually run in about thirty minutes per submission, usable by fact-checkers with no philosophy training, that yields one of three outcomes — run as written, run with a specific framing or caveat, or decline — and that leaves documented reasoning for the file.

  The philosophical anchor should be Hume's argument on miracles, treated as a serious starting point rather than a slogan. As I understand it, the core of the argument is that testimony is only as strong as the balance between the evidence for the witness's reliability and the intrinsic improbability of the event reported, so that for a putative violation of a law of nature the witness's being mistaken or deceptive would itself have to be more improbable than the event. Our desk has informally been applying what we call the denominator rule: you cannot say how strong a piece of testimony is without knowing the rate at which similar testimony turns out to be false, and for miracle claims we almost never know that denominator. Tell me whether to keep this rule, fix it, or drop it.

  There is also a second-order problem I want the procedure to confront rather than dodge. Our decision is not a belief; it is an act of publication, and publishing testimony makes us a link in a chain of testimony. Hume's question is what a rational hearer should believe given testimony; ours is what we should help a heterogeneous readership believe, many of whose priors — shaped by religious commitment or its absence — are unlike ours. The procedure has to say explicitly whether to apply our own priors, try to estimate the readers', or refuse the question, and that choice should be a step in the procedure, not an afterthought.

  Before drafting, brainstorm: map which parts of Hume's argument genuinely transfer to an editorial decision (witness reliability, the antecedent improbability of the event, the balancing structure itself), which transfer only with modification (Hume defines a miracle as a violation of a law of nature; a spontaneous remission is not that — it is rare but lawful — and the procedure must draw and use this distinction), and which do not transfer at all. Then write the procedure: an ordered set of at most eight steps, each specifying what counts as a sufficient answer, where the procedure terminates in a decline, where it mandates reframing rather than declining, and which questions are questions of values that must be handed up to an editor instead of settled by the checklist. Mark the points where judgment cannot be eliminated. Then run the procedure, showing its work, on these three submissions:

  1. An essayist reports that her mother's inoperable pancreatic cancer vanished between scans after a pilgrimage. We have the before-and-after imaging and the oncologist's confirmation of remission, though the oncologist calls it a documented if unexplained spontaneous regression. The essayist frames it as a miracle; the mother does not.

  2. A weeping statue in a small town: roughly forty witnesses, a blurry video, a diocese that declined to investigate, and a chemist acquaintance of the essayist saying condensation is consistent with the footage. The submission is really about what the town's belief did to the town, and the statue is almost incidental to it.

  3. A reader claims to have dreamed a plane crash in detail three days before it happened. Her sister confirms the reader described the dream to her the morning after, the crash occurred, and the dream matched in one specific detail that was not publicly reported until a week later.

  Include at least one case where the procedure delivers an answer I will not like — I want its independence demonstrated, so say plainly which answer that is and why it follows anyway. Add a closing section on how the procedure misfires: the recurring situations in which it gives the wrong answer or no answer, with an example of each. Please give me no reading list and no citations; everything needed is in the argument itself. And if you must simplify, preserve above all the structure that makes Hume's point something better than a blanket prejudice against the miraculous — testimony really can, in principle, be good enough, and the procedure should say what that would take.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Epistemologist specializing in testimony/evidence, with a side practice in translating philosophy to procedure.
      *   **Task:** Create a decision procedure (not an essay) for a magazine standards editor regarding submissions claiming miracles/extraordinary events.
      *   **Constraints:**
          *   Must be usable by fact-checkers in ~30 mins.
          *   Must yield one of three outcomes: Run as written, Run with framing/caveat, Decline.
          *   Must document reasoning.
          *   Philosophical Anchor: Hume's argument on miracles (specifically the balance of evidence vs. improbability).
          *   Address the "Denominator Rule" (keep, fix, or drop).
          *   Address the "Second-Order Problem" (publication as testimony, heterogeneous readership priors).
          *   Structure: Brainstorm first (transferability of Hume), then the Procedure (max 8 steps), then Application (3 specific cases), then Limitations (misfires).
          *   Tone: Professional, direct, no citations/reading lists.
          *   Requirement: Include at least one case where the procedure gives an answer the editor might not like (demonstrate independence).
          *   Core Philosophical Integrity: Preserve Hume's structure (testimony *can* work, but the bar is high based on improbability).

  2.  **Brainstorming & Philosophical Mapping:**
      *   *Hume's Core:* A wise man proportions his belief to the evidence. For miracles (violations of natural law), the evidence against the miracle (uniform experience of the law) is as strong as evidence can get. Therefore, the testimony for the miracle must be *more* miraculous (i.e., more improbable to be false) than the event itself.
      *   *Transfer to Editorial Context:*
          *   *Witness Reliability:* Transfers well. Fact-checking verifies honesty, competence, corroboration.
          *   *Antecedent Improbability:* Transfers but needs modification. "Violation of law of nature" is too strict for a magazine. Need a spectrum: Medical anomaly vs. Physical impossibility.
          *   *Balancing Structure:* Transfers well. We weigh the reliability of the account against the likelihood of the event.
          *   *The Denominator Rule:* The user says they use this (rate of false testimony). Hume would say we need the rate of *false miracle claims*. Since we don't know that, the rule is currently broken. *Decision:* Fix it. Instead of an unknown statistical denominator, use a "Plausibility Threshold" based on alternative explanations.
          *   *Second-Order Problem (Publication):* Hume asks about individual belief. Editors ask about public impact. We cannot apply *our* priors (too elitist) nor *readers'* priors (too fragmented). We must apply *Public Reason* priors (what is generally accepted as lawful/normal) while acknowledging the *function* of the piece (is it theology or memoir?).
      *   *Distinction:* Miracle (violation of law) vs. Extraordinary (rare but lawful). This is crucial. Spontaneous remission is rare, not law-breaking. Weeping statues are physically suspicious. Precognition is law-breaking (causality).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* 8 steps max. Clear termination points.
      *   *Step 1: Categorize the Claim.* Is it medically rare, physically anomalous, or causally impossible? This sets the "Improbability Weight."
      *   *Step 2: Verify the Witness.* Standard fact-checking. Honesty, competence, consistency.
      *   *Step 3: Alternative Explanations.* This fixes the Denominator Rule. Don't ask "how often are people lying?" Ask "is there a simpler explanation?" (Condensation, confirmation bias, coincidence).
      *   *Step 4: The Humean Balance.* Weigh Step 2 against Step 1 + Step 3. If the lie/error is more likely than the event, flag it.
      *   *Step 5: The Second-Order Check (Audience).* How will this be read? As fact or meaning? This addresses the "publication as testimony" issue.
      *   *Step 6: Framing Decision.* If the event is unverifiable but the *experience* is valid, shift focus.
      *   *Step 7: Value Judgment Handoff.* Where does philosophy end and editing begin? (e.g., Is this offensive? Is it worth the controversy?)
      *   *Step 8: Final Disposition.* Run, Frame, or Decline.

      *Refining the "Denominator Rule":* The user asked specifically about this. I need to tell them to *fix* it. The problem isn't knowing the false positive rate of miracles (impossible); it's failing to weigh alternative natural explanations. The procedure must force the checker to articulate the *most likely natural explanation* and compare its probability to the miracle.

      *Refining the "Second-Order Problem":* The procedure shouldn't try to guess reader priors. It should mandate *transparency about the magazine's stance*. We are not validating the miracle; we are validating the *testimony of the experience*.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Cancer):* Medically rare, not law-breaking. Oncologist confirms remission. Essayist says miracle, mother doesn't.
          *   *Procedure outcome:* Run with Framing. The fact (remission) is verified. The interpretation (miracle) is subjective.
      *   *Case 2 (Weeping Statue):* Physically anomalous. 40 witnesses but blurry video. Chemist says condensation. Diocese declined.
          *   *Procedure outcome:* Run with Framing (focus on community impact) OR Decline if presented as physical fact. Given the prompt says the submission is about the *town's belief*, this leans toward "Run with Framing."
      *   *Case 3 (Precognitive Dream):* Causally impossible (violates time/causality). Sister confirms dream, one specific detail matched.
          *   *Procedure outcome:* This is the hard one. Hume's bar is highest here. Coincidence + selective memory is more probable than precognition.
          *   *The "Unliked" Answer:* I should probably recommend *Decline* or *Heavy Reframing* here, even if it's a good story. Or, perhaps, recommend *Run with Framing* on Case 2 (which might seem weak) but *Decline* on Case 3 (which is exciting). Let's make Case 3 the "Decline" because it violates causal laws, whereas Case 1 is just rare medicine. Wait, the prompt asks for *one* case where the answer is unliked. Usually, editors want the precognitive dream (it's a hook). So, recommending "Decline" or "Strip the claim" for Case 3 is the independent, Humean move.

  5.  **Drafting the Limitations (Misfires):**
      *   Where does this fail?
      *   1. When the "Law of Nature" is actually just current scientific ignorance.
      *   2. When the social value of the myth outweighs the epistemic cost (e.g., a story that comforts many but is factually dubious).
      *   3. When the witness is reliable but the event is truly inexplicable (the "Black Swan" problem).

  6.  **Review against Constraints:**
      *   30 mins? Yes, steps are checklist-style.
      *   3 Outcomes? Yes.
      *   Humean Anchor? Yes (balance of probability).
      *   Denominator Rule addressed? Yes (Fixed).
      *   Second-Order Problem addressed? Yes (Step 5).
      *   Max 8 Steps? Yes.
      *   No citations? Yes.
      *   Unliked answer included? Yes (Case 3).

  7.  **Final Polish:**
      *   Ensure the tone is authoritative but practical.
      *   Make sure the "Brainstorm" section clearly distinguishes transferable vs. non-transferable elements.
      *   Ensure the "Second-Order" step is explicit about *whose* priors we use (Public Reason, not personal or audience-specific).

  *(Self-Correction during drafting)*: I need to be careful with the "Denominator Rule." The user says they currently use it to say "we don't know the denominator, so we can't judge." I need to tell them that's wrong. Hume doesn't need a statistical denominator of false miracles; he needs a comparison of probabilities. I will instruct them to replace the "Denominator Rule" with the "Alternative Explanation Test."

  *(Self-Correction on Case 3)*: If I say "Decline" on the dream, is that too harsh? The prompt says "Run, Run with Framing, or Decline." If the essay is about the *experience* of the dream, it can run. But if the essay claims the dream *caused* knowledge, that's the issue. I will make the procedure demand the framing shift. If the author refuses, it's a Decline. I'll make the recommendation "Run with Framing" but note that if the author insists on literal truth, it becomes a Decline. Actually, to show independence, I will recommend "Decline" for Case 3 if the claim is presented as factual knowledge, because the Humean balance tips too far against causality violation. Let's go with "Decline as factual claim; offer Reframe." If the prompt implies a binary choice for the output, I'll stick to the three options. I'll choose "Run with Framing" for Case 1 & 2, and "Decline" for Case 3 (unless reframed). I'll mark Case 3 as the "unliked" answer because it's the most compelling narrative hook.

  Wait, looking at Case 2: "The submission is really about what the town's belief did to the town." This makes it safe.
  Case 3: "Reader claims to have dreamed..." If the essay is about the *psychological impact*, it's safe. If it's "I knew this would happen," it's risky. I will assume the submission argues for the validity of the precognition. That makes it the best candidate for the "Unliked Answer" (Decline).

  Let's refine the "Second-Order" step. The prompt asks: "apply our own priors, try to estimate the readers', or refuse the question." The Humean answer is: Apply *Public Priors* (consensus reality) but distinguish *Fact* from *Meaning*. I will codify this.

  Okay, ready to write.
answer: |-
  ### Part I: Philosophical Mapping (Brainstorm)

  Before implementing the procedure, we must distinguish which parts of Hume's argument function in an editorial context and which require modification.

  **1. Transfers Directly:**
  *   **The Balancing Structure:** Hume's core mechanic is a scale. On one side is the intrinsic improbability of the event; on the other is the probability that the witness is mistaken or lying. This structure is essential. It prevents both gullibility (ignoring improbability) and cynicism (ignoring witness reliability).
  *   **Witness Reliability:** Hume's criteria for witnesses (number, integrity, education, lack of motive to deceive) map directly to standard fact-checking protocols.

  **2. Transfers with Modification:**
  *   **Definition of "Miracle":** Hume defines a miracle as a *violation of a law of nature*. In a general-interest magazine, this is too binary. We must use a **Spectrum of Improbability**:
      *   *Type A (Rare but Lawful):* Spontaneous remission, unlikely coincidences. (Low Improbability Weight)
      *   *Type B (Physically Anomalous):* Weeping statues, levitation. (High Improbability Weight)
      *   *Type C (Causally Impossible):* Precognition, time travel. (Maximum Improbability Weight)
  *   **The Denominator Rule:** Your current rule ("we don't know the false-positive rate for miracles") is a deadlock. Hume does not require a statistical database of false miracles. He requires a comparison of *specific* probabilities. **Fix:** Drop the search for a statistical denominator. Replace it with the **Alternative Explanation Test**. We do not need to know how often statues weep falsely; we need to know if *condensation* is more probable than *weeping* in this specific instance.

  **3. Does Not Transfer:**
  *   **Individual Belief vs. Publication:** Hume asks what a rational individual should believe. You ask what a public institution should amplify. Hume's goal is epistemic hygiene; your goal is responsible storytelling. We cannot simply adopt Hume's skepticism as policy, or you would never publish religious testimony. We must distinguish between validating the *event* and validating the *experience of the event*.
  *   **The Second-Order Problem:** You cannot use your editors' priors (too sectarian) or estimate reader priors (too variable). You must use **Consensus Priors** (what current public science accepts as possible) while allowing space for **Subjective Meaning** (what the event meant to the witness).

  ***

  ### Part II: The Editorial Decision Procedure (The "Humean Scale")

  **Time Limit:** 30 Minutes
  **Operator:** Fact-Checker or Standards Editor
  **Outcomes:** [RUN], [FRAME], [DECLINE]

  **Step 1: Categorize the Claim (Improbability Weight)**
  Classify the central extraordinary claim into one of three types.
  *   **Type A (Rare/Lawful):** Medically documented anomalies, statistical coincidences.
  *   **Type B (Physically Anomalous):** Events contradicting known physical properties (e.g., solids weeping liquid).
  *   **Type C (Causally Impossible):** Events violating causality or time (e.g., precognition).
  *   *Assign Weight:* Type A = Low; Type B = High; Type C = Maximum.
  *   *Termination:* If Type C, proceed immediately to Step 4 (Strict Scrutiny).

  **Step 2: Verify Witness Reliability (The Humean Counter-Weight)**
  Assess the testimony using standard checks.
  *   **Competence:** Was the witness in a position to observe accurately?
  *   **Consistency:** Has the story changed over time?
  *   **Corroboration:** Are there independent witnesses or documents?
  *   **Motive:** Is there a clear benefit (financial, status) to the claim?
  *   *Sufficient Answer:* "Reliable," "Mixed," or "Compromised."
  *   *Judgment Point:* If "Compromised," move to [DECLINE]. If "Reliable," proceed.

  **Step 3: The Alternative Explanation Test (Fixing the Denominator)**
  Identify the most probable natural explanation for the observation.
  *   *Examples:* Condensation (statue), Remission statistics (cancer), Selective memory/Coincidence (dream).
  *   *Question:* Is the natural explanation more probable than the extraordinary claim, *given the evidence in hand*?
  *   *Sufficient Answer:* "Natural explanation is more probable" OR "Natural explanation is insufficient."

  **Step 4: The Humean Balance**
  Weigh Step 1 (Improbability) against Step 2 (Reliability) and Step 3 (Alternatives).
  *   **Rule:** For Type B or C claims, the witness's reliability must be so high that their being mistaken is *more* miraculous than the event itself.
  *   **Decision:**
      *   If Reliability > Improbability: Proceed to Step 5.
      *   If Improbability > Reliability: Move to [DECLINE] or [FRAME] (see Step 6).

  **Step 5: The Second-Order Check (Publication Impact)**
  Determine the essay's primary function.
  *   **Option A (Factual Claim):** The essay argues the event *objectively happened* as described and demands reader belief.
  *   **Option B (Experiential Claim):** The essay argues the event *happened to the witness* and explores the meaning/impact of that belief.
  *   *Policy:* We apply **Consensus Priors** to Option A (must meet scientific standard). We apply **Narrative Integrity** to Option B (must be honest about the witness's state of mind).
  *   *Judgment Point:* If the essay demands Option A treatment for a Type B/C claim without sufficient evidence, move to [FRAME] or [DECLINE].

  **Step 6: Framing Mandate**
  If the claim is Type B or C, or if Step 3 favored a natural explanation:
  *   **Requirement:** The text must explicitly acknowledge the ambiguity.
  *   **Sufficient Framing:** "The oncologist called it spontaneous remission," or "While skeptics suggest condensation, the town believed..."
  *   *Termination:* If the author refuses to acknowledge the ambiguity in a Type B/C claim, move to [DECLINE].

  **Step 7: Value Handoff**
  If the procedure yields [FRAME] but the framing requires significant rewriting, or if the claim is Type C but culturally significant:
  *   **Action:** Escalate to Senior Editor.
  *   **Reason:** This is no longer epistemology; it is risk assessment regarding brand reputation and reader trust.

  **Step 8: Final Disposition**
  *   **[RUN]:** Type A claim, or Type B/C with overwhelming corroboration and accepted ambiguity.
  *   **[FRAME]:** Claim is unverifiable, but the *experience* of the claim is valid and clearly labeled as subjective.
  *   **[DECLINE]:** Claim is Type C presented as objective fact without corroboration, OR Witness Reliability is "Compromised."

  ***

  ### Part III: Application to Current Submissions

  **Case 1: The Pancreatic Cancer Remission**
  *   **Step 1 (Weight):** Type A (Rare/Lawful). Spontaneous regression is documented, though rare. *Weight: Low.*
  *   **Step 2 (Reliability):** Imaging and oncologist confirm remission. Witness is reliable regarding the medical fact. *Status: Reliable.*
  *   **Step 3 (Alternatives):** "Spontaneous regression" is the medical alternative to "miracle." Both describe the same physical outcome; they differ only on cause.
  *   **Step 4 (Balance):** Reliability is high. Improbability is low (medically possible).
  *   **Step 5 (Second-Order):** Essayist frames as miracle; mother does not. This is a conflict of *meaning*, not fact.
  *   **Step 6 (Framing):** Must distinguish the medical fact (remission) from the theological interpretation (miracle).
  *   **Step 8 (Disposition):** **[RUN WITH FRAMING]**.
      *   *Reasoning:* The physical event is verified. The "miracle" label is a subjective interpretation. The text must reflect that the mother and medical staff do not share the miracle interpretation.
      *   *Required Edit:* Ensure the text reads "My mother survived, which I believe was a miracle," not "A miracle occurred."

  **Case 2: The Weeping Statue**
  *   **Step 1 (Weight):** Type B (Physically Anomalous). Stone does not secrete tears. *Weight: High.*
  *   **Step 2 (Reliability):** 40 witnesses is strong, but video is blurry. Diocese declined investigation (negative signal). *Status: Mixed.*
  *   **Step 3 (Alternatives):** Chemist confirms condensation is consistent with footage. This is a high-probability natural explanation.
  *   **Step 4 (Balance):** Improbability of stone weeping is higher than probability of condensation/misinterpretation. Humean balance tips against the miracle.
  *   **Step 5 (Second-Order):** Submission is about the *town's belief*, not the physics of the statue. This shifts it to Option B (Experiential Claim).
  *   **Step 6 (Framing):** The text must treat the weeping as the *catalyst for belief*, not necessarily as a verified supernatural event.
  *   **Step 8 (Disposition):** **[RUN WITH FRAMING]**.
      *   *Reasoning:* The essay's value is sociological, not ontological. We publish the impact of the belief, not the validity of the weeping.
      *   *Required Edit:* Introduction must clarify that the magazine is documenting the community's reaction, not endorsing the phenomenon.

  **Case 3: The Precognitive Dream**
  *   **Step 1 (Weight):** Type C (Causally Impossible). Information cannot travel from future to past. *Weight: Maximum.*
  *   **Step 2 (Reliability):** Sister confirms dream was told. One specific detail matched. *Status: Reliable (regarding the dream), Unverified (regarding the match).*
  *   **Step 3 (Alternatives):** Coincidence + Selective Memory (remembering the hit, forgetting the misses) is statistically far more probable than precognition.
  *   **Step 4 (Balance):** For this to run as fact, the probability of the sister lying or misremembering must be *lower* than the probability of time-violation. It is not.
  *   **Step 5 (Second-Order):** If the essay claims "I knew this would happen," it demands Option A (Factual Claim).
  *   **Step 6 (Framing):** To run, it must be framed as "A dream that felt prophetic," not "A dream that predicted."
  *   **Step 8 (Disposition):** **[DECLINE]** (Unless reframed as pure psychological memoir).
      *   *Reasoning:* This is the answer you may not like. This is a compelling hook. However, under the Humean Scale, Type C claims require evidence that eliminates natural explanation. A sister's testimony and one matching detail do not clear the bar for causality violation. Publishing this as a "true story" of precognition damages the magazine's commitment to consensus reality.
      *   *Independence:* The procedure forces a decline despite the narrative strength, because the epistemic cost (validating impossible causality) outweighs the testimonial strength.

  ***

  ### Part IV: Limitations and Misfires

  No procedure is perfect. This tool will fail in three recurring situations. You must recognize them and override the checklist when they occur.

  **1. The "Black Swan" Misfire (False Negative)**
  *   **Situation:** A genuine anomaly occurs that science cannot yet explain, but which is not strictly "impossible."
  *   **Example:** A medical cure that contradicts current oncology models but is real.
  *   **Failure:** Step 1 categorizes it as Type B (Anomalous) and Step 3 favors the "Unknown" over the "Miracle." The procedure may recommend [DECLINE] or heavy [FRAMING] that undermines a genuine breakthrough.
  *   **Fix:** If the witness reliability is impeccable (Step 2) and the documentation is physical (not just testimonial), escalate to Senior Editor (Step 7) regardless of the Step 4 balance.

  **2. The "Mythic Utility" Misfire (Value Conflict)**
  *   **Situation:** A claim is epistemically weak (fails Step 4) but socially vital to a community you serve.
  *   **Example:** A story about a community healing after a tragedy, anchored by a statue that likely did not weep.
  *   **Failure:** The procedure demands [DECLINE] or skeptical [FRAMING] that might alienate the subjects or strip the story of its power.
  *   **Fix:** Acknowledge that this is a Value Handoff (Step 7). The editor may choose to prioritize "Narrative Truth" over "Epistemic Truth," but this must be a conscious override, not a checklist error.

  **3. The "Consensus Lag" Misfire (Historical Bias)**
  *   **Situation:** Consensus Priors (Step 5) are wrong or lagging.
  *   **Example:** Thirty years ago, claims of PTSD or certain autoimmune triggers might have been categorized as Type C (Psychosomatic/Impossible) when they were actually Type A (Lawful).
  *   **Failure:** The procedure enforces current scientific dogma, potentially suppressing future knowledge.
  *   **Fix:** Use the "Documented if Unexplained" clause. If a phenomenon is reported repeatedly but unexplained, shift it from Type C to Type A over time. Review the Categorization (Step 1) annually.

  **Closing Note on the Denominator Rule:**
  Drop your current version. You will never find the denominator for false miracles. The procedure above replaces it with the **Alternative Explanation Test**. You are not asking "How often are people wrong about miracles?" You are asking "Is condensation more likely than weeping *here*?" This preserves Hume's rigor without requiring impossible data.
