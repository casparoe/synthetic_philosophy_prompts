prompt: |-
  Ok so in my civics class we were arguing about whether our city should switch the school board election to ranked choice, and at some point the class basically split into two camps over whether ranked choice actually reduces spoiler effects. That's when this guy Marcus goes "wisdom of crowds, right? Condorcet mathematically proved that if you ask enough people, the majority is almost certainly correct, so we should just take a class vote and whatever the majority says, that's basically the truth." He'd already impressed everyone that same week with a jelly bean jar at the club fair — our class average guess was closer than any single person's, some people were off by like hundreds of beans and the average was only off by 4. So now half the class thinks any question can be settled by majority vote, and the other half thinks that's nuts, and I'm stuck in the middle because I can't tell how many separate claims are actually hiding inside "the wisdom of crowds."

  Can you lay out the different precise claims that slogan could be making, as a list I could bring to class? For each one I want to know whether it's trivial, contentious, or straight up false, and — this is the part I actually care about — which of them can carry the weight Marcus put on it. Like, which claim did the jelly bean thing even support? That seems like averaging a bunch of estimates, and I'm not sure that's the same thing as the theorem he cited. And is there any reading of the slogan under which a majority of a bunch of high schoolers who haven't done the reading settles a factual question better than asking the one person who has? If some readings only work when every voter is already better than a coin flip, or when their mistakes are independent, or when the question has a real true/false answer instead of being partly about which system is *fairer* — flag that too, because our class vote mixed factual claims and value stuff and I'm pretty sure Marcus was using one result to cover both. Also correct me if I've misdescribed what the theorem says, but dont assume I know the math, explain it like I'm 17.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A high school civics class argument about Ranked Choice Voting (RCV) vs. Spoiler Effect.
      *   **The Conflict:** A student named Marcus claims "Wisdom of Crowds" + Condorcet's Jury Theorem means a majority class vote settles the truth. He cites a jelly bean jar experiment (average guess was accurate) as proof.
      *   **The User's Position:** Stuck in the middle, suspects there are multiple distinct claims hidden in the slogan "Wisdom of Crowds," suspects Marcus is conflating different things (averaging estimates vs. majority voting, factual vs. value questions).
      *   **The Task:** Break down the slogan "Wisdom of Crowds" into precise claims. For each claim, evaluate its truth status (trivial, contentious, false), explain if it supports Marcus's argument, explain what the jelly bean experiment actually showed, address the conditions (independence, competence, binary vs. continuous), and distinguish between factual and value judgments.
      *   **Target Audience:** A 17-year-old high school student (explain math simply, avoid jargon where possible, keep it engaging but rigorous).
      *   **Specific Corrections:** Correct the description of Condorcet's theorem if wrong (Marcus said "Condorcet proved... majority is almost certainly correct," which is a specific simplification of Condorcet's Jury Theorem).

  2.  **Deconstruct "Wisdom of Crowds" & Condorcet:**
      *   *Claim 1: The Jelly Bean Effect (Averaging Estimates).* This is about continuous variables (how many beans?). Error cancellation. This is *not* Condorcet. This is the Law of Large Numbers/Central Limit Theorem applied to estimation.
      *   *Claim 2: Condorcet's Jury Theorem (Binary Truth).* This is about binary choices (True/False, Guilty/Not Guilty). Requires voters to be >50% competent individually and vote independently.
      *   *Claim 3: Majority Rule = Fairness/Values.* This is normative, not positive. "What is fair" isn't a fact to be discovered like bean counts.
      *   *Claim 4: Universal Applicability.* Marcus implies this works for *any* question. This is false.

  3.  **Drafting the Claims (Iterative Process):**

      *   *Drafting Claim 1 (Estimation):* The jelly bean thing. Averaging guesses cancels out noise.
          *   *Status:* True for estimation tasks.
          *   *Relevance to Marcus:* He used this to prove the other stuff. It doesn't prove Condorcet.
          *   *Conditions:* Independent errors, no systematic bias.

      *   *Drafting Claim 2 (Condorcet's Jury Theorem):* The math Marcus cited. If everyone is slightly better than random, big group = near perfect.
          *   *Status:* Mathematically true *under strict conditions*.
          *   *Relevance to Marcus:* He cited this, but did the class meet the conditions? (Are they >50% likely to be right about RCV? Are they independent?)
          *   *Conditions:* Binary question, individual competence > 0.5, independence.

      *   *Drafting Claim 3 (Values vs. Facts):* Can voting decide what is "fair"?
          *   *Status:* False/Category Error. Voting decides policy, not truth.
          *   *Relevance:* The RCV debate is partly about values (fairness vs. efficiency).

      *   *Drafting Claim 4 (Independence/Groupthink):* Do high schoolers vote independently?
          *   *Status:* Contentious/False in this context.
          *   *Relevance:* If Marcus speaks first, everyone follows. That breaks the math.

  4.  **Refining the Explanations (Tone & Level):**
      *   Keep it conversational but precise.
      *   Use analogies (thermometers, coin flips).
      *   Make sure to explicitly correct Marcus's conflation of the Jelly Bean experiment (averaging) with Condorcet (majority voting). They are different math.

  5.  **Addressing Specific User Questions:**
      *   *Which claim did the jelly bean thing support?* Claim 1 (Averaging), not Claim 2 (Condorcet).
      *   *Can a majority of HS kids beat one expert?* Only if the expert isn't actually an expert or the kids meet Condorcet conditions (independence + >50% competence). Usually, no.
      *   *Factual vs. Value:* Highlight this distinction sharply.
      *   *Condorcet Correction:* Marcus said "majority is almost certainly correct." Need to clarify that this only happens as $N \to \infty$ *if* $p > 0.5$. If $p < 0.5$, the majority becomes *more* wrong.

  6.  **Structuring the Response:**
      *   **Intro:** Validate the user's skepticism (it's well-founded).
      *   **The Breakdown:** A numbered list of the distinct claims.
      *   **The Verdict:** For each claim: True/False, Does it help Marcus?, The Catch (conditions).
      *   **The Jelly Bean vs. Condorcet Mix-up:** Explicitly explain the math difference.
      *   **The "Expert vs. Crowd" Question:** Address the specific scenario of the class vs. the one person who read the material.
      *   **Conclusion:** A summary for the class debate.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Condorcet simply? *Adjustment:* Use the "biased coin" analogy. If the coin is slightly weighted to heads (truth), flipping it many times makes heads almost certain. If weighted to tails (false), flipping it many times makes tails almost certain.
      *   *Check:* Did I address the RCV context? *Adjustment:* Remind them that RCV effectiveness is empirical/complex, not a simple binary fact.
      *   *Check:* Is the tone right? *Adjustment:* Avoid sounding condescending to Marcus, but be firm on the math.

  8.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on this plan.)
answer: |-
  You are absolutely right to be skeptical. Marcus is doing something very common in debates: he's taking three different mathematical ideas, blending them into one "super-argument," and assuming they all apply to your civics discussion.

  Your intuition is spot on: the jelly bean experiment proves something totally different than the theorem he cited, and neither of them necessarily proves that a class vote settles a complex policy debate.

  Here is a breakdown of the distinct claims hiding inside "Wisdom of Crowds," rated for truth and relevance, explained for a 17-year-old civics class.

  ### 1. The "Averaging Estimates" Claim
  **The Claim:** *If you ask a crowd to guess a number (like jelly beans), the average of their guesses will be more accurate than most individual guesses.*
  *   **Status:** **True** (for specific tasks).
  *   **Does it support Marcus?** **No.** This is what the jelly bean jar proved, but it doesn't apply to your voting debate.
  *   **The Catch:** This only works for **estimation problems** with a single numerical answer. It works because people's errors cancel out (someone guesses +100 too high, someone guesses -100 too low).
  *   **Why it fails here:** You aren't guessing a number. You are voting on a policy (Ranked Choice) or a fact (Does RCV reduce spoilers?). You can't average "Yes" and "No" votes to get a "True" answer. You have to pick a side. This requires different math (see Claim #2).

  ### 2. Condorcet's Jury Theorem (The Math Marcus Cited)
  **The Claim:** *If a group votes on a True/False question, and every voter is more likely to be right than wrong (even by a tiny bit), then as the group gets larger, the majority vote becomes almost certainly correct.*
  *   **Status:** **Mathematically True, but Conditionally.**
  *   **Does it support Marcus?** **Only if strict conditions are met.**
  *   **The Catch:** This theorem has two massive "ifs" that Marcus ignored:
      1.  **Competence:** Every single voter must be better than a coin flip (>50% chance of being right). If the average voter is *less* than 50% competent (i.e., mostly guessing or misinformed), the theorem proves the opposite: **a larger group makes it *more* likely the majority is wrong.**
      2.  **Independence:** Voters must decide independently. If Marcus speaks first and convinces everyone, or if everyone copies the most popular kid, their errors don't cancel out—they compound. This is called "correlated error."
  *   **Why it fails here:** Does every student in your class have a >50% chance of understanding the mathematical nuances of voting theory? If most are guessing, Condorcet's math says the class vote will be confidently wrong.

  ### 3. The "Values vs. Facts" Claim
  **The Claim:** *Majority vote can determine the "truth" about what is fair or best for the city.*
  *   **Status:** **False (Category Error).**
  *   **Does it support Marcus?** **No.**
  *   **The Catch:** Condorcet's Theorem only applies to **factual questions** with an objective right answer (e.g., "Is this defendant guilty?" or "Did RCV reduce spoilers in City X?"). It does not apply to **normative questions** (e.g., "Is it *fairer* to let people rank candidates?").
  *   **Why it fails here:** Your debate is mixed. Part of it is factual (does it reduce spoilers?), but part of it is about values (do we prioritize simplicity or representation?). A vote can decide what the class *wants*, but it cannot decide what is mathematically or morally "true." Voting on values just tells you what the majority prefers, not what is "correct."

  ### 4. The "Crowd Beats the Expert" Claim
  **The Claim:** *A majority of laypeople will outperform a single expert who has studied the issue.*
  *   **Status:** **Contentious / Usually False.**
  *   **Does it support Marcus?** **No.**
  *   **The Catch:** This only happens if the "expert" is actually incompetent, or if the problem is so complex that it requires diverse perspectives to solve (like estimating jelly beans). In technical fields (like voting theory math), one person who has read the peer-reviewed studies will almost always beat a crowd of people who haven't.
  *   **Why it fails here:** If one person in your class actually read the studies on Ranked Choice Voting and the rest are guessing based on vibes, Condorcet's Theorem suggests the "expert" is more reliable, because the crowd likely fails the ">50% competence" requirement.

  ---

  ### The "Jelly Bean vs. Condorcet" Mix-Up
  You were right to notice this. Marcus conflated two different statistical phenomena.

  *   **Jelly Beans (Continuous Variable):** This relies on the **Law of Large Numbers**. High guesses cancel low guesses. It requires **independent errors**.
  *   **Condorcet (Binary Vote):** This relies on **Probability Convergence**. It requires **individual competence > 50%**.

  **The Fatal Flaw in Marcus's Argument:**
  In the jelly bean jar, being "wrong" is random noise. In a civics debate, being "wrong" is often **systematic bias**. If the whole class misunderstands how the voting math works because no one read the material, they aren't making random errors; they are all making the *same* error. When errors are correlated (everyone is wrong for the same reason), the Wisdom of Crowds collapses.

  ### How to Use This in Class
  Here is a script you can adapt to bring the nuance back to the discussion without sounding like a know-it-all:

  > "Marcus, I looked into the math you cited. You're mixing up two different things.
  >
  > 1.  **The Jelly Bean Jar** works because we were averaging numbers, and our errors canceled out. That doesn't work for a Yes/No vote on Ranked Choice.
  > 2.  **Condorcet's Theorem** does apply to votes, but it has a strict rule: it only works if every voter is *already* more likely to be right than wrong.
  >
  > If most of us haven't read the material on voting theory, our individual competence might be below 50%. If that's true, Condorcet's math actually proves that a larger group makes us *more* confidently wrong, not right.
  >
  > So, a class vote can tell us what we *prefer*, but it can't tell us what is mathematically *true* about spoiler effects. For the factual stuff, we should probably trust the data or the person who read the studies, not the majority opinion."

  ### Summary Checklist for Your Notes
  *   **Jelly Beans:** Averaging estimates. **True**, but irrelevant to voting Yes/No.
  *   **Condorcet:** Majority voting on facts. **True ONLY IF** voters are independent and >50% competent.
  *   **Values:** Voting on fairness. **False** to call this "truth."
  *   **Independence:** Did everyone decide alone? If not, the math breaks.
  *   **Competence:** Are we guessing or do we know? If guessing, the crowd is dangerous.

  Marcus's argument sounds smart because the math *exists*, but he's applying it to a situation where the prerequisites (competence and independence) aren't met.
