answer: |-
  **Essay Question**

  In *Nicomachean Ethics* V.5, Aristotle argues that reciprocity holds the city together, using the example of a builder and a doctor. He claims exchange requires equality, achieved through money, which measures "need" (*chreia*). However, the text contains significant ambiguities.

  Write an essay that reconstructs Aristotle's argument for how equality in exchange is possible. In doing so, you must explicitly address **at least three** of the following four interpretive tensions:

  1.  **The Proportionality Puzzle:** Is the proportion between the *goods* (houses vs. cures), the *producers* (builder vs. doctor), or the *products relative to producers*? Explain which reading you adopt and why the text supports it.
  2.  **The Pre-money Constraint:** Does money *create* the equality required for justice, or does it merely *represent* an equality that must already exist for barter to work?
  3.  **The Status of Need:** Is "need" a stable metric for justice, or merely a fluctuating psychological state? How do you resolve Aristotle's admission that money's value fluctuates even when the convention remains?
  4.  **The Placement Puzzle:** Is Aristotle describing a third species of *justice* here, or is he describing an economic mechanism that justice merely regulates?

  Your answer should not merely summarize the text but must take a stance on how these tensions affect the viability of Aristotle's account of reciprocal justice.

  ***

  **Model Answer**

  Aristotle's account of reciprocal justice in *NE* V.5 attempts to ground economic exchange in ethical equality, but the mechanism relies on a fragile distinction between natural need and conventional money. A viable reconstruction must show how the proportionality of exchange binds persons, not merely products, while acknowledging that money represents rather than creates value.

  First, regarding the **Proportionality Puzzle**, the equality cannot be merely between goods (one house equals X cures). Aristotle explicitly states the builder must be equalized to the doctor, not just the house to the service. Therefore, the proportion is crossed: as the builder is to the doctor, so the house is to the medical service. However, since the persons are qualitatively different, the products must be quantified to make the persons comparable. The proportion is ultimately between the *productive worth* of the persons, measured by their products. If we treat it as a simple ratio of goods, we lose the ethical dimension of "justice between persons" that distinguishes this from mere pricing.

  Second, this leads to the **Pre-money Constraint**. If the proportion relies on the productive worth of persons, money cannot be the source of that worth. Aristotle presents barter as the primary case; money enters only to facilitate deferred exchange. Thus, money does not create the equality; it represents a commensurability that must already hold for the exchange to be just. If money created the value, justice would be entirely conventional, undermining Aristotle's naturalism. Money is a "substitute for need," a token that allows the pre-existing equality of productive contribution to be realized over time and distance.

  This raises the **Status of Need**. If money represents need, need must be the true measure. But need is subjective and fluctuating. Aristotle acknowledges this when he notes money can lose purchasing power while the convention remains. Here, *chreia* functions not as individual desire, but as social demand—the objective requirement of the polis for specific functions. The builder and doctor are commensurable because the city *needs* both to survive. However, this creates a circularity: the city determines the need, but the need determines the exchange value. Aristotle resolves this imperfectly by appealing to convention; the "truth" of the measure is the stability of the political community itself.

  Finally, concerning the **Placement Puzzle**, this analysis suggests Aristotle is not describing a distinct form of justice parallel to distributive or corrective, but rather the economic precondition for political community. Reciprocity is "justice" only in the sense that it maintains the association. It is distinct because it is not based on merit (distributive) or harm (corrective), but on functional interdependence.

  In conclusion, Aristotle's argument succeeds in locating justice in the social function of exchange rather than the goods themselves. However, it fails to provide a stable metric for that function. By making need the measure but money the standard, he leaves the equality of exchange vulnerable to the very fluctuations he admits. Reciprocal justice holds the city together only as long as the convention of money accurately reflects the objective need of the polis.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Identification of the Proportional Terms (4 marks)**
  *   **Hit:** Explicitly states that the proportion relates persons *via* products (crossed proportion), not just goods to goods.
  *   **Typical Miss:** Students describe it as a simple exchange ratio (1 house = 5 cures) without referencing the equalization of the *agents*.

  **2. The Ontological Status of Money (4 marks)**
  *   **Hit:** Argues that money is representative/conventional, not constitutive of value (addresses Pre-money Constraint).
  *   **Typical Miss:** Students claim money *makes* the goods equal, ignoring the barter baseline Aristotle establishes.

  **3. Analysis of *Chreia* (Need) (4 marks)**
  *   **Hit:** Distinguishes *chreia* as social/political demand rather than individual subjective desire (addresses Status of Need).
  *   **Typical Miss:** Students treat "need" as a psychological state (e.g., "how much I want it"), making the measure unstable.

  **4. Engagement with Instability/Circularity (4 marks)**
  *   **Hit:** Acknowledges the problem of fluctuating value/convention and attempts to resolve it via the political community (addresses Status of Need).
  *   **Typical Miss:** Students ignore Aristotle's comment on money losing value or treat it as an irrelevant aside.

  **5. Stance on the Nature of the Chapter (4 marks)**
  *   **Hit:** Takes a clear position on whether this is a species of justice or an economic precondition (addresses Placement Puzzle).
  *   **Typical Miss:** Students assume it is unproblematically "justice" without distinguishing it from distributive/corrective justice.

  ***

  **Differentiation Note: A vs. B Answers**

  The difference between an A and a B answer lies in the treatment of the **circularity of need**. A **B answer** will correctly identify the tensions (e.g., "Money represents need, but need fluctuates") and list Aristotle's solutions as distinct points. An **A answer** will demonstrate *why* the tension matters: it will argue that the instability of money threatens the *justice* of the exchange, not just the economics, and will evaluate whether Aristotle's appeal to "convention" successfully saves the account or leaves it incomplete. The A answer treats the tensions as structural problems in the argument; the B answer treats them as topics to be covered.
