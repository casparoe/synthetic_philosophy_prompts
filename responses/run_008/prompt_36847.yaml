  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Voting System Reform

  **Context**
  Our current plurality system recently elected a President with only 33% of the vote due to vote-splitting among similar candidates. This outcome has eroded member confidence. With ballot logistics locking in one month prior to the election, we must decide on a reform now.

  **Recommendation**
  I recommend adopting **Approval Voting** for both the President and at-large Board positions. Under this system, members vote for *as many* candidates as they find acceptable. The candidate(s) with the most approval votes win.

  **Reasoning**
  This recommendation balances theoretical robustness with practical simplicity, addressing the three main perspectives on this committee.

  **1. The Treasurer's Concern (Arrow's Theorem)**
  The Treasurer correctly notes that Arrow's Impossibility Theorem proves no ranked-choice system can satisfy all fairness criteria simultaneously. However, the conclusion that "switching is pointless" is a misinterpretation. Arrow's theorem applies to *ordinal* systems (ranking candidates 1st, 2nd, 3rd). It demonstrates that no ranked system is *perfect*, not that all are *equally flawed*.

  Plurality voting is demonstrably vulnerable to "Independence of Irrelevant Alternatives" failures—exactly what happened last cycle when similar candidates split the vote. Switching to a system that mitigates this specific failure is valuable, even if no system is mathematically flawless. Furthermore, Approval Voting is *cardinal* (rating candidates yes/no) rather than ordinal. Technically, Arrow's theorem does not apply to Approval Voting at all, though other constraints (like strategic voting) remain.

  **2. The IRV/STV Proposal**
  The proposal for Instant Runoff Voting (IRV) and Single Transferable Vote (STV) is strong. IRV eliminates vote-splitting and ensures a majority winner. However, for an organization with our turnout (40%) and voting habits, complexity is a risk. IRV/STV requires voters to rank many candidates, which can lead to ballot exhaustion or errors. Approval Voting achieves the primary goal of IRV—preventing vote-splitting—with a ballot interface identical to plurality (check boxes), reducing the barrier to participation.

  **3. The Approval Voting Proposal**
  The claim that Approval Voting "dodges Arrow" is technically correct because Arrow's constraints require ordinal rankings. However, this is not a "free lunch." Approval Voting shifts the strategic burden: voters must decide where to draw the line between "acceptable" and "unacceptable." Yet, given our culture of sincere voting and lack of organized campaigning, this strategic burden is minimal compared to the cognitive load of ranking candidates.

  **Practical Considerations**
  Our members vote sincerely out of habit. Complex systems often depress turnout among less engaged members. Approval Voting is the simplest reform to explain ("vote for anyone you support") and implement on our existing ballot platform. It resolves the legitimacy crisis of a 33% winner without requiring members to learn a new ranking interface.

  **Concession**
  The strongest argument against this recommendation comes from the IRV proponents. IRV provides more granular data about member preferences (e.g., distinguishing a voter's 1st choice from their 2nd). In a highly polarized environment, IRV is more robust against "bullet voting" (voting for only one candidate to avoid helping rivals) than Approval. If our society becomes more politicized in the future, IRV may offer better protection against strategic manipulation.

  **Next Steps**
  Adopting Approval Voting allows us to resolve the immediate legitimacy crisis with minimal friction. I move we amend the bylaws to reflect this change for the upcoming cycle.

  **Decision Required:** Approval of Recommendation by [Date].
