answer: |-
  Yes, this pattern has a name. It is called **The Unilateralist's Curse**.

  It was formally defined by Nick Bostrom, Thomas Douglas, and Anders Sandberg in their 2016 paper, *"The Unilateralist's Curse: The Case for a Principle of Conformity."*

  Your intuition is precise: this is not just a structural problem, but an epistemic one. Here is the breakdown of the concept, how it maps to your examples, the edge cases, and whether the standard fixes actually work.

  ### 1. The Name and The Mechanism
  **The Unilateralist's Curse** occurs when multiple agents have the capacity to undertake an initiative that affects others, and they act based on their own private judgment without coordination. Even if every single actor privately believes the action is net-negative, the initiative is likely to be undertaken simply because the probability that *at least one* person misjudges the situation increases with the number of actors.

  **The Math of the Curse:**
  Let $n$ be the number of people with the power to act.
  Let $p$ be the probability that any given individual incorrectly judges the action to be "good" (when it is actually bad).
  The probability that the action *does not* happen is $(1-p)^n$.
  The probability that the action *does* happen is $1 - (1-p)^n$.

  As $n$ grows, the probability of the bad action approaches 1, even if $p$ is very small.

  **The Epistemic Bit:**
  You asked if the term covers the epistemic dimension (each actor thinks they know better). **Yes.** The curse relies entirely on the lack of **common knowledge**.
  *   I know the action is a mistake.
  *   I *suspect* you know it's a mistake.
  *   But I don't *know* that you know.
  *   Therefore, I fear that *you* might think it's a good idea.
  *   Since your action would ruin the outcome anyway, my restraint feels futile.

  This distinguishes it from simple "weak link" security problems. In security, the weak link is usually competence (someone has a bad password). In the Unilateralist's Curse, the weak link is **judgment under uncertainty**.

  ### 2. Comparison to Adjacent Concepts
  *   **Vs. The Bystander Effect:** You nailed this. The Bystander Effect is the diffusion of *responsibility* leading to inaction ("Someone else will help"). The Unilateralist's Curse is the diffusion of *restraint* leading to action ("Someone else will screw it up, so my restraint doesn't matter").
  *   **Vs. Volunteer's Dilemma:** In a Volunteer's Dilemma, someone *must* act for the group to win, but acting is costly. In the Unilateralist's Curse, someone *must refrain* for the group to win, but refraining feels costly (in terms of efficacy or agency) or futile.
  *   **Vs. Tragedy of the Commons:** The Commons is about cumulative depletion (everyone taking a little bit). The Curse is about a single, irreversible threshold event (one person takes the whole thing).

  ### 3. Edge Cases: The Firing Squad
  Is a firing squad a case of this? **Generally, no.**

  In a standard firing squad scenario:
  1.  **Shared Intent:** The squad members usually share the goal (carry out the sentence). The Unilateralist's Curse requires that the actors privately view the outcome as a *mistake* (or at least, that the collective judgment would be to refrain).
  2.  **Coercion/Order:** The action is mandated by authority, not private judgment.

  **However,** it *becomes* a case of the Unilateralist's Curse if:
  *   The soldiers privately believe the prisoner is innocent.
  *   They believe the order is immoral.
  *   But they fire anyway because they assume the *other* soldiers believe the order is legitimate, and if they alone refuse, the others will shoot the prisoner regardless.

  In this specific variation, the firing squad is a perfect example. The mechanism of the firing squad (multiple shooters) is actually designed to diffuse *guilt*, but under the conditions of the Unilateralist's Curse, it diffuses *moral restraint*.

  ### 4. Do The Fixes Work?
  You asked if structural fixes (k-of-n, designated decider) solve the epistemic problem or just relocate it.

  **The Verdict: They relocate the risk; they do not solve the epistemic problem.**

  **A. Designated Decider (n=1)**
  *   **Mechanism:** Only one person has the key.
  *   **Effect:** Mathematically eliminates the curse. $1 - (1-p)^1 = p$.
  *   **Epistemic Cost:** You have concentrated the epistemic risk. If that one person has a bad day, is biased, or lacks specific context, the bad action happens. You have traded the risk of *random deviation* for the risk of *systematic error* or *tyranny*.
  *   **Does it fix the epistemic problem?** No. It assumes one mind is more reliable than the probability distribution of many.

  **B. k-of-n Agreement (Multisig / Consensus)**
  *   **Mechanism:** Requires $k$ people to agree to act.
  *   **Effect:** Changes the math from an OR gate to an AND gate (or majority). It drastically lowers the probability of the bad action.
  *   **Epistemic Cost:** It introduces **Inertia**. If the action was actually *necessary* (a true positive), the group may fail to act. This creates a "False Negative" risk to cure the "False Positive" risk.
  *   **Does it fix the epistemic problem?** It forces the epistemic state into the open. To get $k$ signatures, you must discuss. This converts *private* judgment into *public* debate, which can generate Common Knowledge. However, it can also lead to **Groupthink**, where the social pressure to agree overrides private doubt, effectively recreating the curse within the committee.

  **C. The Principle of Conformity (The Proposed "Soft" Fix)**
  Bostrom et al. propose a normative fix: *If you are in a group of unilateralists, and you privately judge an action to be beneficial, but you suspect the group would disagree, you should conform to the expected group judgment.*
  *   **Pros:** Directly addresses the epistemic gap.
  *   **Cons:** Requires epistemic humility that is hard to enforce. Who defines the "group"? What if the group is wrong? (e.g., A scientist discovering a cure that the scientific community rejects).

  ### 5. Summary Definition
  If you need to use this term in conversation, here is the precise definition:

  > **The Unilateralist's Curse:** A systemic failure mode where an irreversible action is taken by a member of a group despite private consensus among all members that the action should be avoided. It arises from the combination of **unilateral capacity** (one person suffices), **private judgment** (lack of common knowledge regarding intent), and **irreversibility**. It is structurally distinct from the Bystander Effect in that increased group size increases the likelihood of the action rather than decreasing it.

  ### 6. Why It Feels "Ugly"
  You mentioned the "ugly part." The ugliness comes from the fact that **rational individual behavior leads to irrational collective outcomes.**
  Every individual is acting rationally based on their limited information ("My restraint won't stop the outcome, so I might as well act" OR "I must act now before someone else does something worse"). But the collective outcome is one that *everyone* would have voted against if they could have voted.

  It is a specific flavor of **Pascal's Wager applied to group dynamics**: I must act (or refrain) not because I think it's right, but because I am uncertain about *your* certainty.

  ### Final Thought on the "Fix"
  The only fix that truly addresses the *epistemic* bit is **pre-commitment to coordination**.
  Before anyone has the power to act, the group must agree on the *process* for deciding, not just the power to decide.
  *   **Without pre-commitment:** I see a problem, I use my power. I assume you would too. (Curse active).
  *   **With pre-commitment:** We agreed earlier that we would not publish exploits without 3 signatures. Now I see the exploit. Even if I think it should be published, I am bound by my past self's agreement with you.

  This binds the future "hot" judgment to the past "cold" judgment. It doesn't guarantee the decision is right, but it breaks the logic that "my restraint changes nothing." Your restraint *does* change something: it upholds the pre-commitment protocol.
