      *   *Tone:* Impartial adjudicator, philosophical but accessible.

  8.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to just say "Deprivationism wins." Explain *why* the mirror fails to support Epicureanism.
      *   *Nuance:* Acknowledge that the Epicurean has a reply to the orientation argument (that orientation is just a bias). But counter that bias might be constitutive of value.
      *   *Clarity:* Ensure the distinction between "state of being dead" and "event of dying" is clear, as this is often where the symmetry argument gets tricky. (Lucretius focuses on the *state*).

  9.  **Final Polish:** Check against the prompt's specific questions.
