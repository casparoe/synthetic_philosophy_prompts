answer: |-
  Your suspicion is correct, and pursuing it is the strongest possible avenue for a graduate-level paper on this topic. The *Historikerstreit* is often taught as a binary clash between "relativizers" (Nolte) and "universalists" (Habermas), but that framing obscures the methodological plurality hiding under the umbrella term "comparison." If you treat "comparison" as a monolithic operation, the debate looks like a stalemate between historical method and moral prohibition. If you disaggregate the operations, you reveal that the conflict was not about *whether* to compare, but *how*, *why*, and *to what political end*.

  Here is an analysis structured to help you build that argument, moving through the theoretical taxonomy, the symmetry problem, the normative framework, and the French counter-case.

  ### 1. A Taxonomy of Comparison: Locating Nolte's Move

  To rescue the concept of comparison from the mud of the *Historikerstreit*, you must distinguish between at least four distinct intellectual operations that were conflated in 1986–87.

  1.  **Typological/Structural Comparison:** Asking if two regimes share genus-level characteristics (e.g., Are both totalitarian? Do both use terror as a governing principle?). This is analytical.
  2.  **Contextualization:** Situating an event within a broader temporal flow to make it intelligible without explaining it away (e.g., Placing the Holocaust within the history of European colonialism or antisemitism). This is explanatory.
  3.  **Causal/Genetic Comparison:** Arguing that Event A produced or necessitated Event B. This is where history risks becoming theodicy.
  4.  **Moral Ranking (Scale-Fitting):** Juxtaposing body counts or suffering levels to establish a hierarchy of victimhood. This is often political.

  **Locating Nolte:**
  Nolte's specific transgression was not typological comparison (asking if Nazis and Bolsheviks were both totalitarian), nor was it merely contextualization. His move was **Causal/Genetic Comparison** deployed for the purpose of **Moral Ranking**.

  In his essay "The Past That Will Not Pass Away," Nolte argued that the "Asian deed" of the Bolsheviks (the Gulag) was the *prius* (the prior cause) and the Nazi Holocaust was the *posterior* copy or reaction. By establishing a causal link ("Archipelago Gulag" $\rightarrow$ "Auschwitz"), he transformed the Holocaust from a singular eruption of evil into a defensive, albeit escalated, reaction to a prior threat.

  **The Sin:**
  The "obscenity" critics detected was not the juxtaposition of Nazis and Soviets. German conservatives had compared them since the 1950s (the theory of totalitarianism). The sin was the **direction of the causality**.
  *   If you compare to find common structural roots (Typological), you illuminate the mechanisms of modern violence.
  *   If you compare to argue A caused B (Causal), you risk making B intelligible to the point of justification.
  *   Nolte's comparison served a **functional exculpation**. If Auschwitz was a reaction to the Gulag, then German guilt is derivative, secondary, and defensive.

  Therefore, the *Historikerstreit* was not a fight over comparison *versus* uniqueness. It was a fight over **causal relativization versus specific responsibility.** Nolte's sin was using a historical method (comparison) to achieve a legal/moral outcome (mitigation of guilt).

  ### 2. The Symmetry Problem and the Anti-Comparativist Position

  Your second point is crucial: the anti-comparativist position (often associated with Habermas, but more radically with thinkers like Saul Friedländer or Dan Diner) faces a logical symmetry problem. To claim the Holocaust is "unique" is to make a comparative predicate. You are comparing the Holocaust to the set of all other historical events and finding no match.

  **What the Episode Reveals:**
  Habermas's response ("A Kind of Settlement of Damages") reveals that the liberal-left opposition was not actually opposed to comparison *in principle*. Habermas compared Nolte's history to traditional German apologetics; he compared the Bitburg ceremony to democratic norms.
  *   **The Real Disagreement:** The fight was over the **teleology of memory**.
  *   **Nolte's Teleology:** Comparison serves *normalization*. We can only be a "normal" nation if our past is rendered comparable to others (i.e., "everyone did it," or "we were provoked").
  *   **Habermas's Teleology:** Memory serves *constitutional patriotism*. The Holocaust must remain a break in civilization (*Zivilisationsbruch*) so that German identity is founded on the negation of that past, not the resumption of normalcy.

  **The Symmetry Insight:**
  This suggests that "uniqueness" is not a metaphysical claim about the event, but a **normative claim about the observer**. When Habermas insists on the singularity of Auschwitz, he is not necessarily making a statistical claim about gas chambers; he is making a political claim about the **burden of memory**.
  *   *Thesis:* The "obscenity" is not in comparing the events, but in comparing the **guilt**.
  *   If I compare the Holocaust to the Gulag to understand how modern bureaucracies kill, that is legitimate.
  *   If I compare the Holocaust to the Gulag to ask "Who was worse?" or "Who started it?", I am engaging in a moral economy of guilt that treats history as a courtroom.

  The anti-comparativist position, therefore, is best understood not as a methodological prohibition, but as a **protective cordon** around a specific memory culture that feels vulnerable to political instrumentalization.

  ### 3. Toward a Non-Obscene Comparison: Norms and Directionality

  If the obscenity lies in instrumentalization, a legitimate comparison must satisfy specific normative conditions. Your paper can propose a framework for "ethical comparativism."

  **A. The Norm of Non-Zero-Sum Memory**
  A comparison becomes obscene when it implies a zero-sum game of victimhood (i.e., if Group A's suffering is recognized, Group B's is diminished). A legitimate comparison must be additive to understanding, not subtractive from memory.
  *   *Norm:* The comparison must illuminate the mechanisms of violence without erasing the specific intent of the perpetrators. (Nolte erased the specific antisemitic intent of the Nazis by subsuming it under anti-Bolshevism).

  **B. The Burden of Justification**
  The burden of proof lies on the comparativist to demonstrate **why** this comparison yields historical insight that isolation does not.
  *   *Nolte's Failure:* He did not show that comparing the Gulag to Auschwitz explained the industrial extermination of Jews better than studying the history of antisemitism did. He only showed it helped explain German guilt away.
  *   *Successful Comparison:* Hannah Arendt's *Eichmann in Jerusalem* compares totalitarian mechanisms without exculpating the actors.

  **C. Directionality Matters**
  You asked if the direction of the comparison matters. The answer is yes, because of **power differentials in the present**.
  *   **Deflating Comparison:** Comparing the Holocaust to other crimes to reduce the specific weight of German guilt (Nolte). This is suspect because it serves the interests of the perpetrator society.
  *   **Elevating Comparison:** Comparing other crimes to the Holocaust to highlight their severity (e.g., "This is a genocide like the Holocaust"). This is also risky (instrumentalizing Jewish suffering), but structurally different.
  *   **The Norm:** Comparisons initiated by the **perpetrator society** regarding their own crimes bear a higher burden of justification than comparisons initiated by third parties or victim groups. Nolte failed because he was a German historian speaking to a German public about German guilt.

  ### 4. The *Black Book of Communism* (1997): Mirror Image or Distortion?

  The *Black Book* controversy is the perfect control case for your argument. Stéphane Courtois's introduction attempted to equate Communist crimes with Nazi crimes quantitatively (100 million vs. 25 million) and qualitatively (class genocide vs. racial genocide).

  **Structural Similarities:**
  *   **Politicized Quantification:** Like Nolte, Courtois used numbers to establish a moral hierarchy.
  *   **Internal Revolt:** Just as German historians rejected Nolte's causality, *Black Book* contributors (like Nicolas Werth) publicly rejected Courtois's inflation of numbers and his equation of the two systems.
  *   **The "Obscenity":** Critics argued Courtois was trivializing the specificity of the Holocaust (industrial extermination) by diluting it into a general "mass killing" category to score Cold War points.

  **Structural Differences:**
  *   **Direction of Apologetics:** Nolte was engaged in **exoneration** (minimizing German guilt). Courtois was engaged in **condemnation** (maximizing Communist guilt).
  *   **The Vindication:** This difference is vital for your thesis. If the "obscenity" were inherent to comparison itself, Courtois's comparison should have been received identically to Nolte's. But it wasn't.
      *   Nolte was widely condemned across the political spectrum.
      *   Courtois was criticized by historians for *method* (bad numbers) and by the Left for *politics*, but the comparison itself (Communism = Totalitarianism) was more culturally acceptable in the post-Cold War West than the comparison (Nazis = Reaction to Bolsheviks).

  **Conclusion on the *Black Book*:**
  The *Black Book* case vindicates the view that **apologetics, not comparison, is the obscene element.**
  *   Courtois was accused of manipulating history to declare a "victory" for liberal democracy.
  *   Nolte was accused of manipulating history to restore German national pride.
  *   In both cases, the historical method was subordinated to a **political closure**. The comparison was used to *end* the debate (either "Communism was the ultimate evil, case closed" or "Germans were reacting, case closed") rather than to open historical inquiry.

  ### Synthesis for Your Paper

  Your paper can argue that the *Historikerstreit* was not a debate about the limits of historical method, but a debate about the **limits of national identity**.

  1.  **Thesis:** The "obscenity" of comparing atrocities is not structural but functional. It arises when comparison is used to instrumentally manage collective guilt rather than to structurally understand violence.
  2.  **Evidence:** Nolte's causal link was rejected not because historians never compare, but because his comparison served an exculpatory function for the perpetrator society.
  3.  **Refinement:** The anti-comparativist stance (Habermas) is not a rejection of comparison *per se*, but a rejection of comparisons that threaten the normative foundation of post-war democracy (which relied on the singularity of the break in civilization).
  4.  **Extension:** The *Black Book* confirms that when comparison serves a triumphalist narrative (victory over Communism) rather than an exculpatory one, it faces different criticisms (methodological vs. moral), but the core violation remains the same: **subordinating historical complexity to political utility.**

  **Final Recommendation:**
  Focus your conclusion on the concept of **"Memory as a Zero-Sum Game."** The obscene move is treating memory like a limited resource where acknowledging one tragedy diminishes another. A legitimate comparison treats memory as non-rivalrous: understanding the Gulag does not require diminishing Auschwitz, provided the specific intent and mechanism of each are respected. Nolte failed because he made them rivalrous; Habermas resisted because he saw the rivalry was a trap for German identity.
