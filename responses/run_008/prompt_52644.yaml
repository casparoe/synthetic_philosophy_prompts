      *   *Honesty:* This is speciesist by design. It admits that "Human" is a moral magic circle. Does the user accept that? As a neuroscientist, they might find it biologically arbitrary.

  6.  **Refining the "Honesty" Component:**
      *   The prompt asks: "If you think the whole framing is confused... say so plainly."
