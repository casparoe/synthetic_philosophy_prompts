answer: |-
  We, the undersigned contributors, having engaged in a decade of debate regarding the implications of the Doomsday Argument for the future longevity of the human species, hereby submit this joint statement to clarify the exact nature of our agreement and our remaining分歧. We begin by affirming the common ground upon which our collaboration rests, specifically that our dispute is not about the validity of Bayes' theorem nor about any empirical demographic projection regarding birth rates or resource constraints. We agree that the mathematical machinery of Bayesian updating is uncontroversial and that the disagreement lies entirely in how to condition on a piece of self-locating evidence, namely the fact of one's own existence and temporal position within a sequence of observers. We further acknowledge that the same formal structure underpinning this debate appears in toy cases with no doom in them at all, involving dice rolls, urns, or sleeping subjects, and we commit to stating those cases without slanting them to favor one conclusion over the other. This shared understanding allows us to isolate the philosophical core of the problem from the existential anxiety that often accompanies it.

  Despite this agreement on the formal setup, we remain divided on the precise residual disagreements that drive our divergent conclusions. One of us maintains that reasoning as if one were a random sample from the observers in one's reference class is a mandatory requirement of rational inference, such that finding oneself to have an early birth rank among all humans is genuine Bayesian evidence that the total number of humans will be smaller than it would otherwise seem. The other holds that this updating is an artifact of that sampling assumption and that once one treats one's own existence as evidence, hypotheses on which more observers exist start out ahead, causing the Doomsday adjustment to evaporate. We disagree fundamentally on what it means to reason as if randomly sampled, with the former viewing it as a neutral application of indifference and the latter viewing it as an unwarranted constraint on the prior probabilities. We disagree on whether finding myself to exist confirms hypotheses with more observers, with the former denying that existence alone carries weight and the latter asserting it does. Finally, we disagree on how the reference class is fixed in the first place, with the former arguing it must be defined by observers capable of grasping the argument and the latter arguing it should be as broad as possible to avoid arbitrary exclusions.

  The cruxes of our disagreement can be sharpened by focusing on two specific issues. The first is whether self-locating evidence can be treated symmetrically across hypotheses positing different numbers of observers, or whether the sheer number of observers in a hypothesis should inflate its prior probability. The second is the reference class problem, specifically whether the choice of class is a matter of substantive fact or definitional convenience. We state explicitly that while the definition of the term observer involves verbal choices, the dispute over which reference class is the correct one for probabilistic reasoning is not merely verbal. This is because different choices of reference class yield divergent posterior probabilities and betting behaviors in isomorphic thought experiments, meaning the consequences are substantive rather than linguistic. The verbal aspect is limited to the boundary drawing of who counts as an observer, but the impact of that drawing on the probability calculus is a matter of factual disagreement about how evidence works.

  To test these cruxes, we propose two concrete cases where our predictions diverge, beginning with the presumptuous-philosopher case which we both accept as probative. In this scenario, two theories about the universe are equally probable a priori, but one theory implies a trillion times more observers than the other. The proponent of the Doomsday line predicts that a philosopher should not bet heavily on the larger universe simply because it contains more observers, maintaining that the prior probabilities should remain roughly equal absent specific self-locating data. The proponent of the existence-as-evidence line predicts that the philosopher should be virtually certain they inhabit the larger universe, as their existence is vastly more likely under that hypothesis. We also introduce a novel case, the sealed-ward case, in which you wake with amnesia knowing only that you were assigned either to ward A, whose ledger will eventually record ten thousand patient-days, or to ward B, whose ledger will eventually record ten million, with nothing else distinguishing the wards. The proponent of the Doomsday line predicts you should conclude you are in ward A, reasoning that as a random sample of patient-days, you are a thousand times more likely to be drawn from the smaller pool. The proponent of the existence-as-evidence line predicts you should conclude you are in ward B, reasoning that there are a thousand times more opportunities for you to exist in that ward. We acknowledge that we cannot both be right about the analogous conclusion for humanity's future, as the logic applied here maps directly onto the question of whether the total number of humans is likely to be close to the number born so far or vastly larger.

  Finally, we include an integrity clause to state explicitly what observation, argument, or consequence each side would itself count as counting against its own view. The proponent of the Doomsday line admits that if it can be demonstrated that self-locating evidence is irrelevant in isomorphic cases where the intuition of random sampling is weak, their view would be undermined. The proponent of the existence-as-evidence line admits that if the presumptuous conclusion leads to demonstrable error in betting scenarios where the larger universe is proven false, their view would be falsified. Regarding the charge that either side's position has been insulated by adjusting the reference class until the desired conclusion comes out, we acknowledge that the flexibility in defining the reference class does allow for such insulation. The proponent of the Doomsday line concedes that narrowing the reference class to avoid counterintuitive results is a defect if it lacks independent justification, while the proponent of the existence-as-evidence line concedes that broadening the class to include non-human observers to dilute the Doomsday effect is a defect if it violates the conditions for self-location. We agree that this insulating maneuver is a defect in the position rather than a legitimate response to an underdetermined choice, and we commit to refining our definitions of the reference class based on principles that apply consistently across the sealed-ward and presumptuous-philosopher cases, rather than tailoring them to save our respective conclusions about human extinction.
