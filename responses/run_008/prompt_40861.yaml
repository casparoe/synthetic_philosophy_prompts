answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** All Staff
  **FROM:** Marcus Thorne, Chief Risk Officer
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Transition to Imprecise Probability Frameworks

  Effective January 1, the firm will cease issuing point estimates for risk exposure. Henceforth, all premiums, reserves, and capital requirements will be quoted as intervals rather than single values. This transition represents a straightforward compliance upgrade designed to align our actuarial practices with a more robust epistemic standard. Single-number probabilities imply a precision that our data cannot support. By replacing traditional actuarial tables with sets of priors—our "credal sets"—we acknowledge the inherent ambiguity in our models without sacrificing rigor.

  Under the new protocol, pricing will reflect the lower and upper previsions of our credal sets. A policy is viable only if the premium exceeds the upper bound of expected loss. Conversely, reserves will be calculated using the lower bound of liability estimates. This ensures that our solvency declarations remain coherent even when our evidence is sparse or conflicting. We anticipate some initial friction in communicating these ranges to brokers accustomed to definitive figures, but this is merely a market-adjustment period.

  Claims settlement will also operate under strict coherence rules. A claim will be paid only if it is acceptable relative to every probability measure in our credal set. It will be denied only if it is unacceptable relative to every measure. Claims falling between these thresholds—where some priors suggest validity and others do not—will be categorized as "indeterminate." We acknowledge that the file of indeterminate claims is currently growing. However, this backlog is not a failure of processing speed, but a faithful representation of evidentiary limits. Paying or denying these claims arbitrarily would introduce a false precision we are no longer willing to tolerate.

  A key feature of this framework is "dilation." Staff should note that under certain conditions, the acquisition of new data may widen our uncertainty intervals rather than narrow them. While counter-intuitive to traditional analysis, this is a value proposition for shareholders who distrust overconfidence. When new evidence conflicts with existing priors, our credal set expands to accommodate the discrepancy. We will market this as "dynamic prudence." Wider intervals signal that we are responsibly updating our ignorance rather than pretending to knowledge we do not possess.

  **Sidebar: Customer Feedback**
  Recent focus groups indicate that when clients are offered a choice between a known probability and an ambiguous interval, they consistently choose the known probability. Some have interpreted this as a flaw in the product. We classify this as a customer-education problem. Clients suffer from "ambiguity aversion," a cognitive bias where they prefer known risks over unknown ones, even when the known risk is objectively worse. Our communications team is drafting materials to explain that preferring a precise lie over an imprecise truth is not rational behavior.

  Finally, we address the observation that a set of probabilities does not, by itself, dictate a unique decision. Decision theorists correctly note that imprecise probabilities often yield incomplete orderings of actions. To resolve this without reverting to arbitrary point estimates, we are establishing the Credal Adjudication Committee. When the mathematics yields indeterminacy, the Committee will convene to select an action based on procedural governance rather than probabilistic necessity. This ensures that while our math remains honest about uncertainty, our business decisions remain decisive.

  We trust this update clarifies the path forward. Precision is out; coherence is in.

  **Marcus Thorne**
  Chief Risk Officer & Head of Credal Governance
