answer: |-
  We sit in a room with windows facing west,
  watching the light fail over the parking lot.
  We talk about bonds, about carbon budgets,
  about the specific gravity of regret.
  I have a daughter who is learning to read,
  and I want her to have books, and clean air,
  and a world where the math adds up to mercy.
  We draw curves that slope downward to the right,
  calling it prudence, calling it risk,
  saying that nothing survives intact forever.
  There is so much detail in the present tense:
  the cost of steel, the price of insurance,
  the way my own heartbeat drowns out the clock.
  We build for a century we might not see,
  but we build it with the materials of now,
  weighting the load where our feet are planted.

  By the time the saplings reach the eaves,
  our names will be carved too deep to read.
  Maybe they will be richer, maybe not,
  maybe the sea will have taken the street.
  It is hard to speak clearly through the glass
  of fifty years, through the noise of growth.
  We assume they will forgive the debt,
  or assume they will not exist to ask.

  The numbers blur into a single shade,
  a probability of light or dust.
  Does it matter if we loved them then,
  if the language they speak has changed?

  Whatever we were is a statistical error,
  a shadow cast by a burning coin.

  I am the one you meant when you said later.
