answer: |-
  The split-brain case is not a fatal anomaly for Global Workspace Theory (GWT), but it exposes a critical operational limitation regarding verbal report. Consequently, the theory remains agnostic on right-hemisphere phenomenology, treating it as orthogonal rather than contradictory. GWT survives the case, but only by retreating from strong claims about subjective experience to claims about information architecture.

  Post-severing, the single neural workspace bifurcates. "Global" no longer means whole-brain; it means "globally available within the isolated hemispheric network." We effectively have two workspaces. The left hemisphere retains the verbal output module, making its broadcast reportable. The right hemisphere retains its own broadcast capacity (evidenced by complex motor responses), but lacks the speech module to externalize it. For GWT, consciousness *is* the broadcasting. If the right hemisphere broadcasts to its own motor and emotional systems, it is conscious by GWT lights, even if silent. The "interpreter" is simply the left workspace's coherence-seeking function; when denied data from the right, it fabricates inputs to maintain a unified narrative model within its own limited workspace. This fits GWT's view that the "self" is a constructed story within the workspace, not a homunculus.

  Here is where GWT strains. First, the theory defines consciousness as access, yet operationally defines access as report. Since the right hemisphere cannot report verbally, GWT lacks the tools to confirm its consciousness, risking a verificationist collapse where "unreportable" equals "unconscious." This isn't a logical contradiction, but an empirical blind spot. Second, the confabulation problem cuts both ways. It supports GWT by showing consciousness is a constructed narrative of access, but it undermines the methodology by proving report is not a trustworthy tracker of actual causal access. If the left hemisphere claims access it doesn't have, how do we trust any report as a marker of consciousness? We must rely on indirect behavioral markers, which weakens the theory's clean link between report and awareness.

  Finally, GWT is silent on phenomenal consciousness independent of access. It defines consciousness as access, so it denies the possibility of phenomenology without access by definition. However, it struggles to distinguish between "no access" and "no verbal report of access." It can describe the right hemisphere's access architecture, but it cannot tell us if there is "something it is like" to be that right hemisphere without access to speech. The theory describes the stage, not the experience of the actor. It handles the mechanics of the split, but leaves the metaphysics of the divided mind unresolved.
