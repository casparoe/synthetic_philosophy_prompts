answer: |-
  This is an excellent question. It shows you are thinking critically about the material rather than just memorizing definitions. Your friend's summary is a very common "street version" of luck egalitarianism. It captures the slogan correctly but misses the nuance that professional philosophers debate.

  To give you a direct answer: **Your friend is roughly right about the definition, but significantly wrong about the implications and the history.** The view has not been "abandoned," and the characterization of Rawls is misleading.

  Here is a claim-by-claim breakdown of what a luck egalitarian would accept, qualify, or deny.

  ### 1. The Core Definition
  **Friend's Claim:** *"Luck egalitarianism is the view that the only inequalities justice permits are the ones people are responsible for — everything down to luck must be neutralized by redistribution, while everything flowing from your own choices is yours to keep."*

  *   **Verdict:** **Mostly Accept.**
  *   **The Nuance:** This is the standard definition. In the literature, this is often framed as the distinction between **brute luck** (unchosen circumstances like your genetics, parents, or being hit by a meteor) and **option luck** (the result of deliberate gambles or choices).
  *   **What they would qualify:** Luck egalitarians (like Ronald Dworkin, G.A. Cohen, or Richard Arneson) usually argue that justice requires compensating people for *disadvantages* caused by brute luck. They don't necessarily argue that *all* luck must be neutralized (if you get lucky and find gold in your yard, justice doesn't necessarily demand we take it all, though some argue it does). The focus is usually on ensuring everyone starts with an equal share of resources or opportunities, after which choice determines the outcome.

  ### 2. The Application (Genetics vs. Gamblers)
  **Friend's Claim:** *"A luck egalitarian society would compensate people for bad luck in the genetic and social lottery, but let gamblers and people who chose their predicament live with the consequences."*

  *   **Verdict:** **Accept.**
  *   **The Nuance:** This is the classic example used by Ronald Dworkin. If you are born with a disability (brute luck), society owes you compensation. If you invest in a risky stock or choose a low-paying career path because you prefer leisure (option luck), society does not owe you compensation for the resulting lower income.
  *   **Why it sounds plausible:** This appeals to our intuition that it is unfair to be punished for things you didn't choose, but fair to bear the costs of your own voluntary actions.

  ### 3. The "Reckless Driver" Objection
  **Friend's Claim:** *"The whole view collapses on the case of someone who makes a genuinely free but catastrophic choice — the reckless driver who ends up paralyzed — since that person chose their plight, luck egalitarianism tells us not to help them."*

  *   **Verdict:** **This is a famous objection, but the conclusion that the view "collapses" is denied by proponents.**
  *   **The Context:** This is known as the **"Harshness Objection,"** most famously articulated by philosopher **Elizabeth Anderson** in her 1999 paper *"What is the Point of Equality?"* Anderson argues that luck egalitarianism is too focused on blaming the victim. If you starve because you refused to work, or get hurt because you drove recklessly, strict luck egalitarianism implies you have no claim of *justice* against society.
  *   **What Luck Egalitarians Say in Response:**
      1.  **Justice vs. Humanity:** Many luck egalitarians distinguish between what we are owed as a matter of *justice* versus what we are owed as a matter of *humanity* or *basic rights*. A luck egalitarian can say, "Strictly speaking, this driver isn't owed compensation for equality's sake, but we should still help them because we don't let citizens suffer destitution or death." They can build a "humanitarian floor" into the theory.
      2.  **Epistemic Humility:** Others argue that in the real world, it is almost impossible to know if a choice was truly free. Was the driver reckless because they are irresponsible, or because they were exhausted from working three jobs (bad brute luck)? Because we can't easily tell, we should err on the side of helping.
      3.  **Soft Luck Egalitarianism:** Many modern theorists have modified the view to avoid these harsh implications. They keep the core insight (luck shouldn't determine life chances) but soften the responsibility condition.

  **So, does the view collapse?** No. It faces a serious challenge, but proponents have developed robust responses. It is not a "gotcha" that ends the theory.

  ### 4. The Historical Claim & Rawls
  **Friend's Claim:** *"Most egalitarians gave up on luck egalitarianism and went back to Rawls, whose theory doesn't hold anyone responsible for anything."*

  *   **Verdict:** **Flatly Deny.**
  *   **Part A: "Most egalitarians gave up."** This is false. Luck egalitarianism remains one of the dominant frameworks in contemporary political philosophy. While Anderson's critique was devastating to the *strictest* versions, it spawned decades of refinement. You will find luck egalitarian elements in the work of major contemporary philosophers (e.g., Shiffrin, Lippert-Rasmussen, Holtug). It is very much a live position.
  *   **Part B: "Rawls... doesn't hold anyone responsible for anything."** This is a significant misunderstanding of Rawls, likely born of podcast simplifications.
      *   **Rawls on Luck:** Rawls actually agrees with luck egalitarians that natural talents and social class are morally arbitrary (brute luck). He argues we don't *deserve* our IQ or our wealthy parents. In this sense, Rawls is sympathetic to the luck egalitarian intuition.
      *   **Rawls on Responsibility:** However, Rawls does not try to track individual responsibility for every inequality (like the reckless driver). His theory focuses on the **basic structure of society**. He wants institutions set up so that inequalities work to the benefit of the least advantaged (the Difference Principle). He isn't trying to judge individual choices; he is trying to design a system where the stakes of bad luck aren't so high that people ruin their lives.
      *   **The Relationship:** Some scholars even argue that Rawls *is* a kind of luck egalitarian. Others argue he offers a "social egalitarian" alternative (like Anderson). But it is incorrect to say Rawls ignores responsibility; he just locates it differently (in the design of institutions rather than individual compensation).

  ### Summary for Your Coursework

  If you are writing an essay or preparing for class, here is how you should frame it:

  1.  **The Definition:** Your friend is right. Luck egalitarianism aims to compensate for brute luck while holding people responsible for option luck.
  2.  **The Problem:** The "Harshness Objection" (Anderson) is the standard critique. It argues that denying aid to the "irresponsible" is cruel and abandons the point of equality (which should be about social relationships, not just resource tracking).
  3.  **The Status:** The view has not been abandoned. It has evolved. Most contemporary luck egalitarians accept some version of a "humanitarian minimum" to avoid the reckless driver problem.
  4.  **Rawls:** Rawls is not the "anti-responsibility" alternative. He shares the luck egalitarian concern about arbitrary natural assets but prioritizes the stability and structure of society over tracking individual choice.

  ### A Note on the "Podcast Philosophy" Trap
  Your friend's summary suffers from what I call the "podcast trap." Philosophy podcasts are great for introductions, but they often present objections as fatal refutations to make the story dramatic ("Theory X was popular, then Philosopher Y destroyed it, now we believe Z!").

  In reality, political philosophy is rarely that clean. Theories are rarely "collapsed"; they are modified, refined, and debated. Luck egalitarianism is a sophisticated, living framework, not a discarded relic.

  **Recommendation:** If you want to read the primary source for the objection, look up Elizabeth Anderson's *"What is the Point of Equality?"* (1999). If you want to see the defense, look at Ronald Dworkin's *"Sovereign Virtue"* (2000). Reading those two against each other will give you a much clearer picture than any podcast summary.
