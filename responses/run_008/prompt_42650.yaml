answer: |-
  Dear colleague, it is entirely understandable that your reading group has reached a stalemate, and your working hypothesis offers a remarkably precise diagnosis of why the paradox of fiction remains so resistant to resolution. You are correct to suspect that the participants are talking past one another, but the situation is slightly more nuanced than a simple verbal dispute over definitions. The disagreement is primarily conceptual and theoretical, rooted in competing commitments about the cognitive architecture of the mind, rather than being purely empirical or merely verbal. When Walton claims that the fear felt for a monster is quasi-emotion, he is not denying the phenomenology; he agrees that the heart races and the palms sweat. His claim is strictly classificatory and normative: he holds that the concept of genuine emotion logically requires an existential belief, so without that belief, the state is defective or distinct in kind. Lamarque, conversely, argues that the intentional object of an emotion is a thought content rather than an existing entity, so he classifies the same phenomenological state as a genuine emotion because the cognitive requirement is satisfied by the vividness of the proposition rather than the existence of the referent. The dissidents who posit intermittent belief or offline simulation are introducing an empirical claim about the mechanism, suggesting that the belief requirement is met transiently or via a different cognitive route. Consequently, your group is stuck because they are conflating the description of the affective state, the conditions for applying the label emotion, and the rationality of holding such a state.

  If we ground this diagnosis in what each side actually claims, it becomes clear that the phenomenological question is largely settled among you, as everyone admits readers cry and feel distress. The real friction arises from the classification question, which depends on one's background theory of intentionality. Walton operates with a belief-desire psychology where emotions are akin to judgments about reality, while Lamarque operates with a view where emotions are responses to conceptual content regardless of its ontological status. This is not merely a verbal dispute because it reflects a deeper disagreement about how the mind relates to the world, yet it is not a genuine empirical question because no amount of brain scanning can tell us whether a state without existential belief deserves the name emotion. That is a philosophical decision about how we carve up psychological space. The rationality question, which was Radford's original concern, is often smuggled into the classification debate; Walton thinks the state is irrational if called genuine emotion, whereas Lamarque thinks it is rational because the thought content warrants the response. By failing to separate these three strands, your group treats a conceptual clarification as if it were a factual discovery about reader psychology.

  Progress in this context will not come from finding a new argument that convinces a Waltonian to become a Lamarquean, because their divergence rests on foundational premises about the nature of mental states. Instead, progress should take the form of disaggregating the paradox into three distinct research programs. You should encourage the group to stop asking whether the emotion is real and start asking what specific cognitive mechanisms sustain the affective response. This shifts the burden from semantics to the philosophy of mind and empirical psychology. For instance, if the group adopts the distinction between occurrent belief and imaginative construal, they can agree that the phenomenology is identical while debating whether the underlying cognitive file is marked as factual or fictional. An experiment could count as progress only if it targets the mechanism, such as investigating whether physiological arousal differs when subjects know a story is fictional versus factual, though even this would not settle the classificatory dispute. A change of question is the most viable path; you might propose that the group treats the term emotion as a placeholder for affective response and focuses entirely on the rationality constraint. If they can agree that the response is phenomenologically robust and functionally similar to standard fear, the only remaining question is whether rationality requires existential commitment, which is a separate normative issue from the paradox itself.

  Ultimately, you should argue that no further progress is to be expected on the original formulation of the paradox because it is a pseudo-problem generated by the ambiguity of the word emotion. The paradox persists only so long as we demand a single yes-or-no answer to whether the feeling is real. If your group accepts your hypothesis that these are three different questions, the tension dissolves. They can agree that the phenomenology is real, disagree on the classification based on their preferred theory of mind, and debate the rationality on normative grounds without contradiction. I would suggest you frame the next session not as an attempt to solve the paradox but as an exercise in mapping these divergent commitments. Ask the Waltonians to specify exactly which functional role belief plays that quasi-emotion lacks, and ask the Lamarqueans to explain how thought content alone triggers the physiological response without any vestige of belief. By forcing them to articulate the theoretical costs of their positions rather than defending the label, you move the discussion from terminological stalemate to substantive philosophical psychology. The paradox of fiction is not a puzzle to be solved but a cluster of problems to be untangled, and your hypothesis provides the exact tool needed to do so.
