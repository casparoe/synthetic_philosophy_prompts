prompt: |-
  I help run a graduate reading group in aesthetics, and after two years of scheduling it, the paradox of fiction has become our running embarrassment: everyone knows all the moves, and nobody has changed sides since the first meeting. The puzzle, from Radford's original paper on how we can be moved by the fate of Anna Karenina, is that readers shed real tears over Anna, believe there is no such person and no one suffering, and don't lift a finger to intervene. The group divides roughly three ways. The make-believe theorists, following Walton, hold that the fear is merely quasi-emotion, genuine only within a game in which the fiction is a prop. The thought theorists, in Lamarque's vein, say vivid thoughts of the feared content suffice for genuine emotion, belief being unnecessary. The remaining dissidents variously claim we intermittently believe the fiction true, or that we engage in offline simulation that produces real affect without ordinary belief. My working hypothesis, and I want it tested, is that the camps are silently answering three different questions: whether a mental state with the right phenomenology occurs in readers, whether a state of that kind deserves the name 'emotion' given whatever role belief plays in emotion, and whether it is rational to persist in such a state. If that's right, much of the argument is at cross-purposes and the paradox is really three paradoxes that share a title. Diagnose what kind of disagreement this actually is: verbal, rooted in competing background theories of what emotions are, or a genuine empirical question about what happens in readers' heads. Ground the diagnosis in what each side actually claims, and then tell me what would count as progress — a distinction, an experiment, a change of question — or argue that no progress should be expected here and why. Please write in continuous prose only, with no headings, bullet points, bold text, or tables, as in a letter or email.
