answer: |-
  **Project Title:** Precision Leakage and the Winner's Curse: Formalizing the Measurability Critique of Effective Altruism

  **Research Question**
  Does the current methodology of Effective Altruism (EA) resource allocation systematically distort cross-cause comparison by conflating the precision of an estimate with the magnitude of an effect ("precision leakage"), and does the selection of top-ranked interventions from noisy estimates introduce a statistical winner's curse that standard epistemic discounts fail to correct?

  **Project Summary and Context**
  The "measurability critique" of Effective Altruism argues that EA systematically favors interventions with quantifiable outcomes (e.g., bed nets) over structural changes (e.g., policy reform) because only the former fit into cost-effectiveness models. The debate has stalled. Critics allege a structural bias; defenders reply that preferring better evidence is epistemic responsibility, not bias, and that "unmeasurable" does not mean "better." Both sides treat this as a normative disagreement about values or epistemic virtue.

  This project reframes the dispute as a methodological error in comparison procedures. I hypothesize that the stalemate persists because both sides conflate two distinct comparisons. The first is *within-cause*, where interventions share similar measurement precision; here, ranking by point estimates is generally valid. The second is *across-cause*, where precision varies wildly. In the latter case, treating point estimates as comparable allows the precision of a measurement to masquerade as a property of the intervention itself. I term this "precision leakage." Furthermore, even within well-measured causes, selecting the top-ranked intervention from a large set of noisy estimates invites the winner's curse: the "winners" are often those whose measurement error happened to point upward. If correct, the measurability critique is not a vague cultural complaint but a claim about comparison procedures that can be stated precisely and corrected via shrinkage estimators or precision-weighted allocation.

  **Methodology and Work Plan**
  This project proceeds in three phases over twelve months, moving from conceptual clarification to formal modeling and finally to practical implication.

  *Months 1–4: Conceptual Groundwork and Formalizing the Bias*
  I will delineate the boundary between within-cause and across-cause comparisons. The primary deliverable is a formal condition on comparison procedures that defines "precision leakage." I will analyze existing EA cost-effectiveness models to identify where uncertainty is treated as a scalar discount versus where it is treated as a variance property affecting comparability. I will draft the first two chapters of the dissertation, establishing that current practices often treat heterogeneous estimates as homogeneous inputs. This phase involves close reading of EA methodology reports and decision-theoretic literature on comparing uncertain prospects.

  *Months 5–8: Modeling the Winner's Curse and Portfolio Rules*
  I will construct a statistical model simulating intervention selection under varying levels of noise. The goal is to quantify the magnitude of the winner's curse in typical EA cause prioritization exercises. If selecting the top 5% of interventions from a noisy distribution systematically overestimates impact, what is the correction factor? I will test alternative allocation rules, specifically James-Stein shrinkage estimators and Bayesian hierarchical modeling, to determine if they yield more robust portfolio allocations than standard expected value maximization. The output will be a technical appendix demonstrating how "precision-weighted" allocation differs from standard uncertainty discounts.

  *Months 9–12: Stress-Testing and Practical Implications*
  I will subject the model to standard objections, primarily the defender's reply that imprecision should itself count against an option (i.e., ambiguity aversion). I will determine whether precision leakage is distinct from standard ambiguity aversion or if it collapses into it. Finally, I will translate the formal results into guidelines for grantmakers. The final three months will be dedicated to writing the concluding chapters, integrating the philosophical analysis with the statistical findings, and preparing the manuscript for job market review.

  **Significance and Expected Results**
  A successful project will transform the measurability critique from a philosophical objection into a tractable engineering problem. For practitioners, the result will not be a rejection of quantification, but a revised protocol for cross-cause allocation. Instead of comparing point estimates directly, funders would compare precision-adjusted distributions. This might look like a mandatory "noise tax" on highly quantified causes when competing against structural interventions, or a shift from maximizing single interventions to optimizing diversified portfolios where high-variance causes are hedged rather than discarded. This provides a path for EA to incorporate structural change without abandoning its commitment to evidence.

  **Risk and Failure Conditions**
  The primary risk is that "precision leakage" is not a novel error but simply ordinary decision theory under uncertainty poorly applied. If my analysis shows that standard Bayesian updating already accounts for variance in the way I propose, then the critique adds no new normative force; it merely accuses practitioners of failing to follow their own stated theory. In this case, the project would shift from proposing a correction to explaining the psychological or institutional barriers preventing existing theory from being implemented.

  A second failure mode is mathematical: if the winner's curse correction requires data parameters (e.g., the true variance of the underlying distribution of intervention effects) that are unknowable in practice, the proposed solution is theoretically sound but practically inert. If this occurs, I will pivot to analyzing the *conditions* under which such parameters could be estimated, turning the dissertation into a study on the limits of formal prioritization. Even in failure, the project yields value: it either validates current EA methodology by showing it is robust to these critiques, or it clarifies exactly where the mathematical limits of cause prioritization lie.
