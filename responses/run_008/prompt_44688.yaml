answer: |-
  ### Desiderata for an Adequate Evolutionary Debunking Argument

  **Fixed Purpose:** To rationally move a reflective moral realist (who accepts evolutionary psychology) to lower her confidence in realism.

  #### 1. The Level of Selection Requirement
  **Requirement:** The argument must specify the precise target of evolutionary selection (e.g., behavioral dispositions, cognitive heuristics, or specific belief contents) and demonstrate why selection at that level precludes truth-tracking.
  **Motivating Case:** Consider an argument that satisfies all other desiderata but assumes selection acted directly on *moral belief contents*. The realist objects that selection acted on *behavioral dispositions* (e.g., cooperation), leaving the content of reflective moral beliefs underdetermined by fitness. Because the argument targets the wrong layer of the psychological architecture, the realist sees no causal link between fitness and her specific realist commitments, and her confidence remains unchanged.
  **Status:** **Non-Negotiable.** Without a correct causal story, the genealogy does not connect to the doxastic state in question.

  #### 2. The Overgeneration Constraint
  **Requirement:** The argument must either accept that its skeptical principle applies equally to mathematics, logic, and ordinary perception, or provide a principled disanalogy explaining why moral faculties are uniquely vulnerable compared to these domains.
  **Motivating Case:** Imagine an argument that is stable, handles third-factor replies, and identifies the correct level of selection, but applies the "fitness-truth gap" principle to morality while implicitly exempting perceptual belief. The realist notes that visual cognition was also selected for fitness, not truth, yet we trust it. Without a principled reason to treat moral intuition differently than perception, the realist dismisses the argument as special pleading designed solely to target ethics.
  **Status:** **Non-Negotiable.** A reflective realist will reject an argument that entails global skepticism rather than abandon moral realism.

  #### 3. The Third-Factor Block
  **Requirement:** The argument must demonstrate why a correlation between fitness and moral truth (mediated by a third factor, e.g., "survival is good") is insufficient for justification, typically by showing that the correlation does not establish the right epistemic relation (e.g., sensitivity or safety).
  **Motivating Case:** Suppose an argument meets all other criteria but fails to address the claim that evolution favored traits that are *independently* morally good. The realist argues that if survival is objectively good, and evolution selected for survival, then our faculties *were* selected to track moral truth. By failing to sever this link, the argument leaves the realist with a viable explanation for why her beliefs are likely true, neutralizing the debunking force.
  **Status:** **Non-Negotiable.** This is the primary defensive maneuver for the evolutionary realist; bypassing it renders the argument inert against the target audience.

  #### 4. The Scope Constraint
  **Requirement:** The argument must define whether it debunks the moral faculty wholesale or only specific first-order judgments, and the boundary chosen must not coincide conveniently with the debunker's own normative commitments.
  **Motivating Case:** Picture an argument that is stable, avoids overgeneration, and blocks third-factor replies, but debunks deontological intuitions while sparing consequentialist ones. If the debunker is a consequentialist, the realist perceives the scope as strategically drawn to protect the debunker's own view while undermining rivals. This ad hoc boundary allows the realist to maintain realism about the spared judgments, preserving the core metaethical position.
  **Status:** **Non-Negotiable (for this purpose).** While error theorists and quietists may weight the *extent* of scope differently, an argument that moves a *realist* must avoid appearing partisan. Strategic scoping undermines rational persuasion.

  #### 5. Reflective Stability
  **Requirement:** The epistemic principle used to debunk moral beliefs (e.g., "abandon beliefs shaped by non-truth-tracking processes") must not, when applied to itself, undermine the justification for holding that principle.
  **Motivating Case:** Consider an argument that nails the level of selection, avoids overgeneration, blocks third-factors, and has a principled scope, but relies on a normative epistemic principle that is itself a product of evolutionary shaping. If the debunker admits this principle is evolved and offers no independent justification for it, the realist argues the argument is self-defeating: if the principle is true, we should abandon it. The realist thus refuses to adopt a tool that destroys its own handle.
  **Status:** **Non-Negotiable.** A self-undermining argument cannot rationally compel anyone, regardless of their metaethical starting point.

  ***

  ### Joint Unsatisfiability: The Tension between (b) and (e)
  I agree with your suspicion: there is a genuine tension between the Overgeneration Constraint (b) and Reflective Stability (e). To satisfy (b), the debunker must distinguish moral faculties from logical or mathematical faculties, claiming the latter are truth-tracking despite evolutionary origins. To satisfy (e), the justification for this distinction must itself be stable under evolutionary scrutiny. However, if *all* cognitive faculties (including the one judging the distinction) are evolutionary products, the debunker risks either global skepticism (violating b) or privileging their own epistemic norms without independent grounding (violating e). The tension is only apparent if one can locate a faculty (e.g., rational insight) that is both exempt from evolutionary debunking and capable of justifying the exemption of mathematics without circularity—a difficult, though not impossible, philosophical tightrope.

  ***

  ### Street and Joyce Against the List
  Sharon Street's Darwinian Dilemma excels at (c), forcing the realist to choose between implausible tracking or skepticism, and handles (a) well by focusing on evaluative tendencies. However, she struggles with (b), as her constructivism risks destabilizing normative truths in domains the realist wishes to save, and (e), since her own normative commitments face the same genealogical scrutiny. Richard Joyce's error-theoretic approach secures (a) and (d) by targeting the faculty wholesale, but fares poorly on (e); his proposal to maintain moral fictions pragmatically is often charged with psychological or rational instability, failing to show how one can reflectively endorse a belief one takes to be false without undermining the epistemic norms required to make that assessment.
