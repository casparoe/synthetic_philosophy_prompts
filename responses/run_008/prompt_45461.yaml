answer: |-
  Dear Colleague,

  You have asked me to translate a specific metaphysical dispute into the vernacular of your trade, and while I must warn you that any translation between disciplines involves some loss of fidelity, I believe the mapping you propose is surprisingly robust. To restate the evolutionary debunking argument in estimation theory, imagine that human moral cognition is an estimator, let us call it theta-hat, designed to infer a true parameter vector theta-star representing objective moral truths. The procedure generating this estimator is natural selection, which we can model as an optimization algorithm operating over deep time. In any standard estimation problem, we care about the objective function being minimized; here, the algorithm minimizes a loss function defined strictly by reproductive fitness. The debunker's central claim is that this loss function is orthogonal to the loss function we actually care about, which would be the error between our beliefs and the moral truth. Because the optimization process was blind to theta-star and sensitive only to fitness proxies, the resulting estimator theta-hat is systematically biased with respect to theta-star. In causal terms, the data-generating process for our moral beliefs is endogenous to fitness but exogenous to moral truth. Consequently, even if the estimator converges to a stable value as sample size increases, it converges to the wrong thing, meaning it is inconsistent for the parameter of interest. You are left with a model that is well-specified for predicting survival outcomes but misspecified for inferring moral reality, and without an independent measurement of theta-star, you cannot correct this bias through standard calibration techniques.

  The realist's reply, often called the third-factor objection, attempts to rescue the identification of theta-star by introducing a latent confounding variable. Let us posit a variable Z, such as the requirements of social cooperation or rational agency. The realist argues that Z causally influences both reproductive fitness and moral truth. In this structural equation model, natural selection optimizes for fitness, but because fitness is highly correlated with moral truth via their common cause Z, optimizing for the former inadvertently tracks the latter. Statistically, this is akin to using a proxy variable for an unobserved parameter; if the proxy is valid because of a strong structural link to the truth, the estimator can be consistent even if the truth was not the direct target of optimization. The realist is claiming that the gradient of the fitness landscape aligns sufficiently with the gradient of the moral truth landscape in the relevant region of parameter space, so that moving uphill on fitness amounts to moving uphill on truth. This restores the correlation between the estimator and the estimand, suggesting that the process is not blind to truth after all, but rather accesses truth through a causal chain mediated by survival requirements.

  If we pause to assess the fidelity of this translation, much of the debate maps cleanly onto concepts you handle daily. The debunker is indeed arguing that your estimator was fit to the wrong loss function and that there is no held-out data to correct it. The absence of independent access to moral truth is analogous to having no validation set in a supervised learning problem; you only have the training data generated by the evolutionary process, and you cannot compute the generalization error with respect to the true moral parameter because that parameter is never observed directly. This creates a severe identification problem. Without an instrument or an external validity check, you cannot distinguish between a model that is true and a model that is merely adaptive. The sense of epistemic defeat the debunker describes is precisely the feeling of realizing your confidence intervals are meaningless because the assumptions required for consistency—specifically, that the error term is uncorrelated with the regressors—are violated by the history of the estimator's construction. You are dealing with severe selection bias where the sample of beliefs we hold is selected for utility, not accuracy, and without a randomization mechanism or an exogenous shock to the system, you cannot disentangle the effect of truth from the effect of fitness.

  However, there are points where I had to bend the vocabulary to make it fit. In statistics, bias is a technical property regarding the expectation of an estimator, but in metaethics, the concern is often about epistemic justification rather than mere reliability. A clock that is stopped is unreliable, but a clock that is right twice a day by chance is also unreliable in a specific sense; yet the philosophical worry is deeper than reliability. It is about whether the belief is held for the right reasons. In your field, if a model predicts well out of sample, you generally do not care why it works; if it predicts moral truth, the statistician in you might say the job is done. The philosopher, however, cares about the etiology of the belief. The debunker argues that even if the beliefs happen to be true, holding them because they were fitness-enhancing rather than truth-tracking undermines their warrant. This is a distinction without a difference in pure prediction, but it is central to epistemology. I also had to treat moral truth as a fixed parameter theta-star, whereas many philosophers view moral truth as potentially constructivist or dependent on the very dispositions we are analyzing, which would change the model from an estimation problem to a fixed-point problem where the estimator helps define the parameter.

  Ultimately, to answer your core question, the debunker is indeed saying something very close to your formulation that your estimator was fit to the wrong loss function and there is no held-out data to correct it, so your confidence is unjustified. However, the real disagreement turns on a normative status that statistics has no means of expressing. Statistics can tell you that an estimator is inconsistent or biased, but it cannot tell you that you ought not to use it in the absence of a better one. The philosophical dispute involves a normative claim about the duties of a believer, specifically that one should not hold beliefs that are insensitive to the truth in the right way. The statistician can show the insensitivity, but the leap to the conclusion that the beliefs are unjustified relies on a principle of epistemic normativity that lies outside the scope of estimation theory. The debunker assumes that unless the causal chain links belief to truth in a specific, truth-sensitive manner, the belief is defeated. The realist argues that the causal chain via the third factor is sufficient. But underlying both is a presupposition about what counts as a valid justification for belief, which is not a statistical property but a philosophical one. So while the machinery of the argument is almost perfectly isomorphic to a problem of identification and model misspecification, the stakes involve a normative evaluation of the estimator's warrant that your training does not equip you to adjudicate, leaving you with a technically sound model of the debate but no statistical test to resolve it.
