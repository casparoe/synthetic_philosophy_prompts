      *   **Audience:**
          *   2 Younger EA members (know decision theory, will argue dominance/state-wise superiority).
          *   1 Retired Stats Professor (Strict Bayesian, hates ad hoc rules).
          *   2 Old-school Trustees (Will back the user but for conservative/traditionalist reasons the user wants to avoid relying on).
      *   **Deliverable:** Q&A Prep Sheet.
          *   Objections in likely order.
          *   Phrased as the specific committee members would say them.
          *   Two-minute reply for each.
          *   Note on where the reply is soft/weak.
          *   What to concede up front.
          *   The "secret fear" question (hoping nobody asks).
          *   Honesty about weak arguments (don't paper over).
          *   Meta-commentary on the least confident piece of advice.

  2.  **Deconstruct the Core Argument:**
      *   **Proposal:** Don't allocate funds based on EV estimates relying on probabilities < 1/100,000.
      *   **Rationale:** Human credences cannot resolve differences that small; EV arithmetic becomes "fake precision."
      *   **Goal:** Persuade the committee without relying on "this is weird/new" (conservatism) or "AI safety is bad" (cause neutrality).
      *   **Challenge:** EAs argue "Pascal's Mugging" style logic (tiny prob * huge value = big EV). Bayesians argue probabilities are subjective but coherent.

  3.  **Drafting the Objections (Ordering & Persona):**
      *   *Order:* Usually, the technical/philosophical objections come first to set the frame, then the practical ones. The Stats Prof will likely jump in early on the probability floor. The EAs will follow up with the decision theory dominance argument. The Old School will chime in later, but I need to prepare for the EAs/Prof primarily.
      *   *Objection 1 (Stats Prof):* "Arbitrary Thresholds." A strict Bayesian sees a probability floor as incoherent. If P > 0, it counts.
      *   *Objection 2 (EA Member 1):* "State-wise Dominance." If AI safety is good in every state (even if prob is low), you must fund it.
      *   *Objection 3 (EA Member 2):* "Consistency/Global Health." You fund global health based on uncertain models too. Why is this different?
      *   *Objection 4 (Old School - though I shouldn't rely on them):* "Mission Drift." (I need to counter this gently or reframe it). *Correction:* The prompt says I'm presenting the case *against* the commitment. The Old School will back me. I don't need to prep for their objections, I need to prep for the *other side's* objections. So, focus on EA + Prof.
      *   *Refining Order:*
          1.  Stats Prof (Foundational: Probability coherence).
          2.  EA Lead (Decision Theory: Dominance/Pascal's Mugging defense).
          3.  EA Second (Comparative: Global Health uncertainty).
          4.  The "Secret Fear" (Institutional/Reputational risk disguised as epistemic humility).

  4.  **Developing the Replies:**
      *   *Constraint:* Two minutes spoken (~250-300 words).
      *   *Constraint:* Must admit weakness ("Note on where the reply is soft").
      *   *Constraint:* Must not rely on "it's weird."

      *   *Reply to Prof:* Focus on *operational* vs. *theoretical* Bayesianism. We aren't gods; we are a committee. The floor isn't ontological, it's procedural.
      *   *Reply to EA (Dominance):* Distinguish between "positive EV" and "actionable EV." Resource constraints + opportunity cost. Also, the "fanaticism" problem in longtermism.
      *   *Reply to EA (Global Health):* Distinction between *empirical uncertainty* (does bednet work?) vs. *conceptual/speculative uncertainty* (will AGI kill us?). One is measurable, the other is model-dependent.
      *   *Concessions:* Admit AI safety is important. Admit the 1/100k number is round. Admit we might miss a huge opportunity.
      *   *Secret Fear:* "Are you just saying this because you don't understand the tech?" (Competence attack).

  5.  **Refining the Content (Self-Correction/Critique):**
      *   *Critique:* Is the "Procedural Bayesianism" argument strong enough for a Stats Prof?
      *   *Fix:* Acknowledge it's heuristic. Frame it as "Bounded Rationality."
      *   *Critique:* Is the "Dominance" reply convincing?
      *   *Fix:* Bring in "robustness." If the EV relies entirely on the tail, it's fragile.
      *   *Tone:* Respectful, epistemically humble, but firm on process.

  6.  **Finalizing the Structure:**
      *   Header: Context/Goal.
      *   Section 1: Upfront Concessions (Disarms opponents).
      *   Section 2: Q&A (The meat).
      *   Section 3: The Secret Fear.
      *   Section 4: Meta-commentary (Least confident advice).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Prof's Objection:* "Probabilities are subjective. A floor violates axioms."
      *   *Reply:* "We aren't a single mind. We are aggregating noisy estimates. Below 1/100k, noise > signal."
      *   *EA Objection:* "Dominance argument."
