answer: |-
  This is a sophisticated piece of philosophical pressure. Your friend has constructed a **Normative Sorites**, merging the classic *Lottery Paradox* (high probability doesn't seem to justify belief) with the *Sorites Paradox* (vagueness leads to absurdity via small steps).

  The argument is valid. If you accept (1), (2), and (3), you must accept (4). Since (4) is epistemically suicidal (it permits believing what you take to be almost certainly false), one of the premises must go.

  Here is the breakdown of the three suspects, the cost of each, and an answer to your specific question about normativity.

  ### 1. The Suspects and Their Costs

  #### Suspect 1: Reject Premise (1) — The Threshold Principle
  *The Claim:* High probability (99.9%) justifies outright belief.
  *Why it looked fine:* This is the **Lockean Thesis**. It captures our fallibilist intuition: we cannot wait for 100% certainty to act or believe. If we can't believe at 99.9%, when can we believe?
  *The Cost:* **Skepticism or Special Pleading.**
  If you reject (1), you must explain why 99.9% isn't enough.
  *   **Hard Line:** You might say *nothing* short of certainty justifies outright belief. This leads to skepticism about almost everything (since empirical evidence is rarely 100%).
  *   **Soft Line (Standard Move):** You argue that lottery propositions are *special*. Statistical evidence (99.9% odds) differs from causal/perceptual evidence. You can believe "my car is outside" (based on memory/perception) but not "my ticket lost" (based on odds), even if the probabilities are identical.
  *   **Verdict:** This is the most common solution to the Lottery Paradox. However, your friend's Sorites argument attacks this by suggesting that if probability is the *measure* of evidence, the *source* shouldn't matter. To hold this line, you need a robust theory of why statistical evidence is epistemically weaker than other evidence despite yielding the same confidence levels.

  #### Suspect 2: Reject Premise (2) — The Tolerance Principle
  *The Claim:* Indiscriminable differences in evidence cannot change permissibility.
  *Why it looked fine:* This relies on an **Internalist** intuition: "Ought implies Can" (or at least, "Ought implies Knowable"). If two evidential states feel exactly the same from the inside, it seems unjust for epistemic norms to treat them differently. It mirrors the Sorites intuition for heaps (one grain doesn't make a heap).
  *The Cost:* **Epistemic Magic (Sharp Cutoffs).**
  If you reject (2), you accept **Epistemicism**. You claim there is a sharp cutoff (e.g., belief is permissible at 99.8432% but not 99.8431%), even though no agent can ever locate it.
  *   **Verdict:** This saves logic and iteration but makes epistemic norms **unguidable**. If I cannot know where the line is, how can the norm guide my reasoning?

  #### Suspect 3: Reject Premise (3) — Iteration/Transitivity
  *The Claim:* If step $n$ is permissible, and the difference to $n+1$ is negligible, then $n+1$ is permissible.
  *Why it looked fine:* It looks like simple logic (Modus Ponens repeated). If the link is sound, the chain should hold.
  *The Cost:* **Non-Transitivity of Permissibility.**
  You must admit that permissibility is vague or non-transitive. $A$ is indistinguishable from $B$, $B$ from $C$, but $A$ is permissible while $C$ is not.
  *   **Verdict:** This requires revising classical logic or accepting that "permissibility" is not a binary property but a gradient. This often leads to **Eliminativism**: perhaps there is no such thing as "outright belief," only degrees of credence. If belief is just high credence, the Sorites dissolves because there is no binary flip to begin with.

  ---

  ### 2. Does Normativity Matter? (Heap vs. Belief)

  You asked whether the fact that rational belief is *normative* (unlike heap-ness) does any work, or if it is just comfort.

  **It does significant work.** It makes rejecting Premise (2) much more costly in epistemology than in metaphysics.

  *   **For Heaps (Descriptive):** If there is a sharp cutoff between "heap" and "non-heap" that we cannot detect, it is metaphysically weird, but practically harmless. The world doesn't care if we mislabel a heap.
  *   **For Belief (Normative):** Epistemic norms are supposed to **guide** agents. They tell us what we *may* or *ought* to think. If there is a sharp cutoff we cannot detect (rejecting Premise 2), the norm fails its function.
      *   Imagine a speed limit that changes by 1 mph every mile, but the signs are invisible. You cannot follow the rule, yet you are punishable for breaking it.
      *   In epistemology, if permissibility flips at 99.8432% but I cannot distinguish that from 99.8431%, I cannot use the norm to regulate my belief.

  Therefore, the normative nature of belief makes the "Sharp Cutoff" solution (rejecting Premise 2) **less palatable** than it is for the standard Sorites. It violates the principle that norms must be accessible to the agent to be binding. This suggests you should be *more* reluctant to reject (2) than your friend implies.

  ---

  ### 3. Recommendation: Which Premise to Give Up?

  Your friend claims you should "know how to handle this" because it's just a Sorites. But Normative Sorites are notoriously harder to solve than descriptive ones. Here is the most defensible path:

  **Primary Recommendation: Restrict Premise (1).**
  Do not reject the idea of thresholds entirely, but reject the idea that *probability alone* sets the threshold.
  *   **Why:** This avoids the "unguidable norm" problem of rejecting (2) and the "logical revision" problem of rejecting (3).
  *   **How:** Argue that **outright belief requires more than high credence.** It requires a specific *kind* of evidence (e.g., non-statistical, or "sensitive" evidence).
  *   **The Cost:** You must explain why 99.9% statistical confidence (lottery) is different from 99.9% perceptual confidence (seeing a chair). This is the standard "Lottery Paradox" solution (e.g., by Hawthorne, Stanley, or Vogel). It saves the binary nature of belief and the guidability of norms, at the cost of making the theory of evidence more complex.

  **Secondary Recommendation: Reject the Binary Model (Implicitly Reject 3).**
  If you are open to formal epistemology, consider that "outright belief" is a folk-psychological approximation.
  *   **Why:** If we only have *credences* (degrees of belief), there is no binary "permissible/impermissible" flip. There is only "more or less reasonable."
  *   **The Cost:** You lose the concept of "certainty" or "settledness" in reasoning. This is a major theoretical shift, but many formal epistemologists (like your friend might be hinting) think this is the correct move anyway.

  ### Summary for Your Friend
  Tell your friend this:
  1.  **The Parallel:** The Sorites parallel transfers formally, but the **normative stakes raise the price** of the standard solution (Epistemicism/Sharp Cutoffs). We cannot accept unknowable normative boundaries as easily as unknowable metaphysical ones.
  2.  **The Move:** You will reject **(1)**, but not globally. You will argue that **Lottery Propositions** are immune to outright belief regardless of probability, due to the nature of statistical evidence. This blocks the Sorites at the first step without requiring magic cutoffs or logical revision.
  3.  **The Challenge:** Ask him if he is willing to accept that epistemic norms can be **in principle unknowable** (Rejecting 2). If he says yes, he owes you a story about how such norms can guide action. If he says no, he must join you in restricting (1).

  The argument is strong, but it relies on the Lockean Thesis (1) being universally true. Most epistemologists agree it is not. The Sorites merely proves that if you *do* accept the Lockean Thesis without qualification, you end in absurdity. The solution is to qualify the thesis.
