prompt: |-
  I'm a third-year philosophy student currently taking a seminar on classical Indian epistemology, where we've spent several weeks on the Nyāya school's theory of the pramāṇas — perception, inference, comparison, and testimony as the four accepted sources of knowledge — along with their account of doubt (saṃśaya), the requirement of a provable universal concomitance (vyāpti) between a sign and what it's supposed to establish, the reliability conditions on testimony from an āpta, and tarka's status as a supporting form of reasoning rather than an independent source of knowledge. I also have a practical role that this material keeps making me think about: I'm the head verifier for our university's student-run science and policy magazine, which publishes short explainers and news summaries. Each week my team of six volunteer editors — none of whom have any philosophy background, and most of whom are first- or second-year students in the sciences — has to decide which claims in submitted articles we can publish as established, which we have to hedge, and which we have to send back, with roughly half an hour of checking time per claim and no access to most paywalled literature.

  I'd like you to turn the Nyāya framework into a decision procedure my editors could actually run on a claim before publication. The procedure should tell them what to ask, in what order, and what counts as a sufficient answer at each step: for instance, how to determine whether a claim rests on our own perception (almost never, in journalism), on an inference whose sign-to-conclusion concomitance we can actually check, on a comparison or analogy, or on testimony — and if on testimony, whether the speaker is reliable enough in the relevant way that we can treat it as knowledge rather than as something merely reported. It should handle the hard cases: claims that stack layers of testimony (a scientist summarizing a study for a journalist who summarizes it for us), inferences where the vyāpti can't be verified in half an hour, arguments that look like inference but are really analogy dressed up, and places where tarka-style "if the opposite were true, things we already know would break" reasoning can legitimately support a claim without establishing it. And it should be explicit about where the procedure stops with a rejection, where it stops with a hedge, and where it hands the decision to me because the question is one of credibility judgment or editorial values rather than something a checklist can settle.

  Then run the procedure on three claims so we can see it work: first, an article citing a single peer-reviewed study, behind a paywall we can't get through, finding that a popular study-habit app improves exam performance in a forty-student trial; second, an opinion piece arguing that a congestion-charge policy that succeeded in one European capital will work in our mid-sized city, on the grounds that the cities are "basically the same kind of place"; third, a claim from a well-known and liked professor on our own campus, told to one of our writers at a departmental event, that a widely reported archaeological discovery is probably a mislabeled forgery — a claim our editors would love to publish and that may well be true. For the last one especially, I want to see whether the procedure gives the answer we want or the answer the framework actually supports. Finally, be honest about where the procedure will misfire: which parts of the Nyāya theory had to be distorted beyond recognition to make it usable at this speed, which steps are judgment calls dressed up as procedure, and which of the school's live disputes with its rivals — the Buddhist reduction of the pramāṇas to two, the Mīmāṃsā insistence that testimony is self-validating, the Cārvāka acceptance of perception alone — the procedure quietly takes a side on without telling the user.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Third-year philosophy student, seminar on Classical Indian Epistemology (Nyāya school).
      *   **Role:** Head verifier for a university science/policy magazine.
      *   **Team:** 6 volunteer editors (science students, no philosophy background, 1st/2nd year).
      *   **Constraints:** ~30 mins per claim, no paywall access, need clear decision procedure (ask what, in what order, sufficient answer).
      *   **Task:**
          1.  Create a Nyāya-inspired decision procedure for claim verification.
          2.  Handle hard cases (layered testimony, unverified *vyāpti*, analogy vs. inference, *tarka* support).
          3.  Define stop conditions (Reject, Hedge, Escalate to Head).
          4.  Run the procedure on three specific test cases (Paywalled study, Policy analogy, Professor's rumor).
          5.  Critique the procedure (distortions, judgment calls, hidden sectarian biases).
      *   **Tone:** Academic yet practical, rigorous but usable, honest about limitations.

  2.  **Deconstruct Nyāya Epistemology for this Context:**
      *   *Pramāṇas* (Sources of Knowledge):
          *   *Pratyakṣa* (Perception): Direct observation. (Rare in journalism).
          *   *Anumāna* (Inference): Sign (*hetu*) -> Conclusion (*sādhya*) via Universal Concomitance (*vyāpti*).
          *   *Upamāna* (Comparison/Analogy): Knowing relation between name and object via similarity. (Often weak in science/policy).
          *   *Śabda* (Testimony): Reliable authority (*āpta*). Crucial for journalism.
      *   *Saṃśaya* (Doubt): The starting point. Need to resolve it.
      *   *Vyāpti* (Concomitance): The hard link. Needs checking.
      *   *Tarka* (Hypothetical reasoning): Reductio ad absurdum. Supportive, not independent proof.
      *   *Āpta* (Reliable Person): Competent, truthful, benevolent.

  3.  **Drafting the Decision Procedure (The "Nyāya Verification Protocol"):**
      *   *Goal:* Translate Sanskrit concepts into editorial checklist items.
      *   *Structure:* Sequential steps.
      *   *Step 1: Source Identification (Pramāṇa Check).* Is this perception, inference, or testimony?
      *   *Step 2: Testimony Assessment (Śabda/Āpta).* If testimony, is the source reliable? (Competence + Truthfulness).
      *   *Step 3: Inference Assessment (Anumāna/Vyāpti).* If inference, is the link universal? Can we check it?
      *   *Step 4: Analogy Check (Upamāna).* Is it just an analogy masquerading as law?
      *   *Step 5: Tarka Support.* Does the opposite break known facts?
      *   *Step 6: Resolution.* Publish, Hedge, Reject, Escalate.

      *Refinement for Constraints:* 30 minutes is tight. The procedure needs "fast fails."
      *   *Āpta* criteria needs to be operationalized (e.g., peer review, institutional affiliation, track record).
      *   *Vyāpti* check needs to be "can we find a meta-analysis or consensus?" not "verify the universal law ourselves."

  4.  **Developing the Test Cases:**

      *   *Case 1: Paywalled Study (App improves grades).*
          *   Type: Testimony (Journalist citing Study).
          *   Issue: Can't verify the primary source (*mūla*).
          *   Nyāya view: Testimony requires a reliable speaker. Is the journalist an *āpta*? No. Is the study accessible? No.
          *   Outcome: Hedge or Reject. (Likely Hedge: "According to X study...").

      *   *Case 2: Policy Analogy (Congestion Charge).*
          *   Type: Analogy (*Upamāna*) masquerading as Inference (*Anumāna*).
          *   Issue: *Vyāpti* (Cities are similar) is weak.
          *   Nyāya view: Similarity isn't identity. Needs more than "basically the same."
          *   Outcome: Hedge heavily or Reject as established fact.

      *   *Case 3: Professor's Rumor (Forgery).*
          *   Type: Testimony (*Śabda*).
          *   Issue: Professor is *āpta* in their field, but is this *their* field? Is it formal testimony or casual chat?
          *   Nyāya view: *Āpta* requires intent to communicate truth. Casual remark? Risky.
          *   Outcome: Escalate to Head. (High reward, high risk).

  5.  **Critiquing the Procedure (The "Honesty" Section):**
      *   *Distortions:* Nyāya is soteriological (liberation-focused); this is pragmatic (truth-adjacent). *Vyāpti* is metaphysical here; we treat it as empirical consensus.
      *   *Judgment Calls:* Defining *Āpta* (reliability) is subjective.
      *   *Sectarian Biases:*
          *   Accepting 4 *pramāṇas* rejects Cārvāka (Perception only) and Buddhist (Perception + Inference).
          *   Treating Testimony as reducible to Inference (like Buddhists) vs. Independent (Nyāya/Mīmāṃsā). The procedure likely treats it as Inference-based (checking reliability), leaning Buddhist/Nyāya synthesis, ignoring Mīmāṃsā's "self-validating" view.
          *   *Tarka* is supportive, not generative.

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the ambition. Bridge the gap between 2nd-century logic and 21st-century student journalism.
      *   *The Protocol:* Use clear headings, "If/Then" logic. Define terms simply.
      *   *The Simulations:* Walk through the three cases step-by-step using the protocol.
      *   *The Critique:* Be rigorous. Point out where the "Nyāya" label is a veneer for standard fact-checking, and where it actually imposes a specific philosophical burden.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address *tarka* correctly? It's not proof. It's a tool to remove doubt. Make sure the protocol doesn't let them publish based *only* on *tarka*.
      *   *Check:* Is the *āpta* definition workable for undergrads? "Competent and Honest" is too vague. Use "Peer-reviewed," "Institutional," "Conflict of Interest."
      *   *Check:* The third case (Professor). The prompt asks: "does it give the answer we want or the answer the framework actually supports?" The editors *want* to publish (it's juicy). The framework should probably say "No, insufficient testimony." I need to highlight this tension.
      *   *Check:* Time limit. 30 mins. The protocol must explicitly say "If you can't find X in 10 mins, stop."

  8.  **Final Polish:** Ensure the tone is respectful of the philosophy while being brutally practical about the editorial constraints. (Proceed to generate output).

  *(Self-Correction on Case 3)*: Wait, if the professor is an *āpta* (reliable authority), Nyāya says testimony is valid *if* the speaker is reliable. But is a casual comment *śabda*? Nyāya distinguishes between valid testimony and mere speech. The procedure needs to flag "informal vs. formal" communication. I will make sure the procedure flags this as an escalation point.

  *(Self-Correction on Sectarianism)*: I need to be specific about the Mīmāṃsā vs. Nyāya debate on *Śabda*. Mīmāṃsā says Vedic testimony is intrinsically valid. Nyāya says it's valid because the speaker is reliable. Our procedure follows Nyāya (check the speaker), not Mīmāṃsā (trust the text). This is a crucial distinction for the critique section.

  9.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Order of questions? Yes.
      *   Sufficient answers? Yes.
      *   Handle hard cases? Yes.
      *   Run on 3 claims? Yes.
      *   Honest critique? Yes.
      *   Tone? Appropriate.

