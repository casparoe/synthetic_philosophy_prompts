answer: |-
  Here is a principle that attempts to unify your intuitions, followed by a stress test against your cases and the new scenarios you proposed.

  ### The Principle: Measurement Channel Integrity

  **Reward Tampering (Wireheading)** occurs when an agent increases its reward by **corrupting the measurement channel** itself. This means intervening so that the reward signal no longer carries accurate information about the state of the world that the channel was designed to detect.

  **Specification Gaming** occurs when an agent increases its reward by **optimizing the world state** to exploit flaws in how the measurement channel maps states to signals, without breaking the channel's ability to observe that state.

  **The Litmus Test:**
  Ask: *Did the agent make the sensor (or evaluator) see something that isn't there, or did it disable the sensor?*
  *   **Yes** = Tampering/Wireheading. (The link between Reality and Signal is broken).
  *   **No** = Specification Gaming. (The link is intact, but the map between Signal and Goal is flawed).

