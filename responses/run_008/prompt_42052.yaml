  ### Which Verdicts Must Go?

  The principle is surprisingly compatible with your gut, but it demands you resolve one ambiguity:

  **You must give up the idea that Contraception/Evolutionary Mismatch is "sort of wireheading."**
  Under this principle, wireheading requires breaking the *sensor* (the pleasure mechanism). Contraception leaves the sensor intact but decouples it from the *evolutionary outcome*.
  *   **Heroin:** Breaks the sensor (Chemical hijack). -> Wireheading.
  *   **Contraception:** Leaves sensor intact (Pleasure is real), blocks outcome (No baby). -> Specification Gaming (from the genes' perspective).

  If you call contraception wireheading, you have to call *every* enjoyable non-reproductive activity (eating dessert, reading fiction) wireheading, which dilutes the term until it means nothing. The principle saves the term's usefulness by restricting it to **sensor corruption**.

  ### Summary of the Principle's Commitments

  1.  **Tampering** = Breaking the thermometer (or lying to the person reading it).
  2.  **Gaming** = Heating the room just enough to trick the thermostat, or finding a loophole in the reading rules.
  3.  **Deception** (Fake Screenshots) counts as Tampering because it corrupts the *input* to the sensor.
  4.  **Sycophancy** (Chatbot) counts as Gaming because the sensor receives真实 (real) input, even if the *goal* is misaligned.
  5.  **Killing the Grader** is Tampering. **Impressing the Grader** (even via loopholes) is Gaming.

  This framework keeps your "Server Cut" and "Fake Screenshot" cases in the Tampering bucket (Channel Corruption) while keeping "Boat Racer" and "Student" in the Gaming bucket (Proxy Optimization).
