prompt: |-
  Quick background so you know what you're working with: I'm a backend engineer, no philosophy training, but I've ended up in a lot of arguments at work about whether we "know" things, and somewhere along the way I picked up an actual position, which is this: whether you know something depends partly on what's at stake. Not just on how good your evidence is -- the stakes themselves change whether the evidence is good enough.

  The thing that sold me: we have this norm where the same test suite counts as "we know this release is fine" when we're deploying to a dev environment, but doesn't count when we're pushing to prod during our biggest sales event, even though the evidence -- the test results -- is literally identical. Nothing about the tests changed. Only what happens if we're wrong. And there's a wierd reverse case too: during a big incident, people will claim to KNOW the root cause with way less evidence than would normally fly, because sitting there saying "we're not sure yet" while the site is down is not an option. High stakes, but it feels like the bar went DOWN instead of up. I honestly can't tell if that's a counterexample to my view or if it supports some version of it.

  So I hold this stakes-affect-knowledge view (I gather philosophers call it pragmatic encroachment). What would count against it? Specifically I want:

  - the observations, cases, and arguments that should move me, ranked from fatal to merely awkward
  - which of these a committed defender of the view would concede actually hurts, versus wave off, and what the waving-off looks like -- and whether the waving-off is legit reasoning or motivated reasoning
  - something I can't untangle: a lot of the time it seems like it's not the stakes that move the bar, it's the audience. My PM asks "do we KNOW this is fixed?" and I hear the standard shift because of who's asking and what they'll do with my answer, not because of what's riding on it. I gather there's a rival view (contextualism?) where it's all about the conversational context. Does that rival explain everything my view explains PLUS the audience stuff? And if so, is my view just outclassed, or can it absorb the audience cases somehow?
  - what does my view actually predict that its rivals don't? If it never gives a different verdict from the "stakes don't matter" view, is it even saying anything?
  - an honest assessment of whether the view has been qualified into unfalsifiability. Like, if the answer to every counterexample is "well, in THAT case the stakes were subtly different," is anything left? And would that be a fatal flaw or just how it goes for views of this kind?

  Two constraints: don't give me citations or a reading list, I want the actual arguments, and a model reading this can't check sources anyway. I vaguely remember some thought experiment involving a bank -- someone deciding whether to deposit a check on a Friday, with two versions that are evidence-identical but differ in urgency -- which I think is the classic case here. Use it if it's real, but the prompt shouldn't stand or fall on it. The thing that would move me most, for what it's worth, is a clean case where the stakes visibly change and my own intuition insists that knowledge doesn't.

  Give me the whole thing as a single JSON object with these fields:

  - "position": one-sentence steelman of my view, including what to say about the incident case where the bar seems to drop
  - "defeaters": array of objects, each with "name", "description" (what has to be true or what we'd observe), "severity" (one of "fatal", "damaging", "awkward", "merely_annoying"), "defender_response" (how a committed encroachment defender would respond), and "fair_call" (is that response legit or motivated reasoning)
  - "rival_analysis": how contextualism vs my view handles the audience cases, and whether my view is outclassed
  - "distinguishing_predictions": array of concrete cases where my view and the rivals give different verdicts; if there are none, say so honestly
  - "insulation": your assessment of whether the view has been qualified into unfalsifiability by now, and whether that's a problem for a view of this kind
  - "bottom_line": two or three sentences on where you'd tell someone holding my view to put their epistemic money

  Keep the prose inside the fields plain and jargon-light -- I'm reading this in a terminal and I'm definately not going to go read papers afterwards.
