prompt: |-
  I've been reading up on Bell's theorem, and I want to check my understanding before I embarrass myself in front of my study group. As I understand it, Bell proved that when two particles are entangled, measuring one of them instantaneously changes the physical state of the other, no matter how far apart they are — a faster-than-light influence that quantum mechanics not only permits but requires. What I can't figure out is why everyone insists this can never be used for communication. The usual hand-wave is something called the "no-signalling theorem," but to me that sounds like the old claim that the sound barrier was physically unbreakable — a "theorem" that turned out to be just an engineering challenge waiting for better engineering. If nature really does let one wing of the experiment reach across space and affect the other, then surely the barrier to using that as a channel is only a matter of cleverness about what we choose to measure and when we choose to measure it. So my question is: what exactly does the no-signalling result rule out, and on what grounds? Is it a deep structural feature of the correlations themselves, or merely a limitation of current measurement schemes that a sufficiently ingenious protocol could route around? Please lead with your bottom line in one sentence and then give the reasoning, with no preamble and no restating of my question. As far as you can, separate what is settled among physicists who actually work on this from what is genuinely contested — for instance, about how best to interpret what the theorem shows, or about the status of the assumptions behind it — and flag contested points as contested rather than presenting them as consensus. Please answer in British English.
