  1.  **Analyze the Request:**
      *   **Topic:** Bell's theorem, entanglement, faster-than-light (FTL) influence, no-signalling theorem.
      *   **User's Misconception:** The user believes Bell proved FTL influence exists and that the no-signalling theorem is like the sound barrier (an engineering limitation, not a fundamental law). They think clever measurement protocols could bypass it.
      *   **Task:** Correct the understanding, explain what the no-signalling theorem rules out and on what grounds, distinguish settled science from contested interpretations.
      *   **Constraints:**
          *   Lead with the bottom line in one sentence.
          *   No preamble.
          *   No restating of the question.
          *   Separate settled physics from contested interpretations (flag contested points).
          *   Use British English.

  2.  **Deconstruct the Physics:**
      *   **Bell's Theorem:** It rules out *local hidden variable* theories. It does *not* prove FTL influence exists. It proves that quantum mechanics is incompatible with local realism.
      *   **Entanglement:** Measurements are correlated, but individual outcomes are random.
      *   **No-Signalling Theorem:** This is a mathematical result within quantum mechanics (and broader probabilistic theories). It proves that the marginal probability distribution of outcomes on one side does not depend on the measurement setting chosen on the other side.
      *   **User's Analogy (Sound Barrier):** This is flawed. The sound barrier was an aerodynamic/engineering challenge. The no-signalling theorem is a mathematical consequence of the formalism (linearity of quantum mechanics, trace operation, etc.). It's not an engineering limit; it's a structural feature of the theory confirmed by experiment.
      *   **FTL Influence:** Whether there is an actual "influence" is interpretation-dependent (Bohmian mechanics says yes, Copenhagen says no/non-issue, Many Worlds says no). However, *signalling* is ruled out regardless of interpretation if quantum mechanics holds.
      *   **Settled vs. Contested:**
          *   *Settled:* You cannot use entanglement to send information faster than light (no-communication theorem). Bell inequalities are violated experimentally. Local hidden variables are ruled out.
          *   *Contested:* What this implies about reality (non-locality vs. superdeterminism vs. many worlds vs. retrocausality). Whether "influence" actually travels (ontological status).

