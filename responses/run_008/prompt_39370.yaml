  **The Scenario**
  You are driving home on a dark highway with two exits. Exit 1 leads to a dead end (payoff 0). Exit 2 leads home (payoff 6). If you miss both, you circle back on a long detour (payoff 4). You are absent-minded: at any exit, you cannot tell if it is the first or the second, and you know that whatever decision rule you adopt now, you must have adopted it at the previous exit (if there was one) and will adopt it at the next. You want to maximize your expected payoff.

  **(a) Ex-Ante Optimum**
  Let $p$ be the probability of **Continuing** at any exit (so $1-p$ is the probability of Exiting).
  *   Probability of exiting at 1: $(1-p)$. Payoff: 0.
  *   Probability of exiting at 2: $p(1-p)$. Payoff: 6.
  *   Probability of missing both: $p^2$. Payoff: 4.

  The expected utility function is:
  $$EU(p) = (1-p)(0) + p(1-p)(6) + p^2(4)$$
  $$EU(p) = 6p - 6p^2 + 4p^2 = 6p - 2p^2$$

  This is a downward-opening parabola. The vertex (unconstrained maximum) is at $p = -b/2a = -6 / (2 \times -2) = 1.5$. Since probabilities must be $\le 1$, the function is strictly increasing on the interval $[0, 1]$. Therefore, the ex-ante optimum is the boundary solution **$p = 1$** (Always Continue). The expected payoff is $6(1) - 2(1)^2 = 4$. This is a pure strategy; no coin flips are required.

  **(b) Moment-View Deliberation**
  Standing at an exit, you reason as follows:
  1.  **Belief:** "I cannot distinguish the exits, so I am at Exit 1 or Exit 2 with equal probability (50% each)."
  2.  **Strategy Consistency:** "Whatever I decide here, I decided (or will decide) at the other exit."
  3.  **Valuation of Exiting:** If I Exit, I get 0 if I'm at Exit 1, and 6 if I'm at Exit 2. Expected value = $0.5(0) + 0.5(6) = 3$.
  4.  **Valuation of Continuing:** If I Continue, I must have Continued (or will Continue) at the other exit.
      *   If I am at Exit 1: I Continue to Exit 2. At Exit 2, I Continue (same decision). I miss both. Payoff 4.
      *   If I am at Exit 2: I Continue. I miss both. Payoff 4.
      *   Expected value = 4.
  5.  **Conclusion:** Continuing (4) is strictly better than Exiting (3).

  The moment-view prescribes **Continue**, which matches the ex-ante pure plan ($p=1$).

  **(c) The Attentive Twin**
  Your attentive twin knows which exit is which.
  *   **At Exit 2:** Twin compares Exiting (6) vs. Continuing (4). Twin Exits. Payoff 6.
  *   **At Exit 1:** Twin compares Exiting (0) vs. Continuing (leads to Exit 2, where Twin gets 6). Twin Continues.
  *   **Twin's Total Payoff:** 6.

  **Absent-Minded Cost:** The twin gets 6, while the optimal absent-minded plan yields 4. The absent-minded driver leaves **2 units of value** on the table.
  **Where value is lost:** The twin can condition his action on the location: he safely passes Exit 1 to capture Exit 2. The absent-minded driver cannot risk Exiting at Exit 2 without risking Exiting at Exit 1. To avoid the 0 at Exit 1, he is forced into a "Always Continue" policy that sacrifices the 6 at Exit 2 for the guaranteed 4 of the detour.

  **(d) The Payoff Feature**
  The agreement is driven by the **detour payoff ($Z=4$) being high enough to dominate the average of the exits, but low enough that location-specific knowledge would still prefer the second exit.**
  Mathematically, the condition for agreement on "Always Continue" is $Z \ge (X + Y) / 2$. Here, $4 \ge (0 + 6) / 2 = 3$.
  The condition for the twin to do better is $Y > Z$. Here, $6 > 4$.
  The tension vanishes because the risk of Exit 1 ($X=0$) is so severe relative to the gain of Exit 2 that even at the moment, the safe detour looks better than the gamble, aligning with the long-term plan to avoid Exit 1 at all costs.

  ***

  **The Probe: Finding the Split**
  Hold Exit 1 ($X$) at 0 and Miss ($Z$) at 1. Treat Exit 2 ($Y$) as a variable dial.

  **1. The Threshold**
  *   **Moment View Split:** The driver is indifferent when Exit Value = Continue Value.
      $$0.5(0) + 0.5(Y) = 1 \implies Y/2 = 1 \implies \mathbf{Y = 2}.$$
  *   **Ex-Ante Split:** The optimum moves from Pure Continue ($p=1$) to Mixed ($p<1$) when the derivative $EU'(1)$ drops below zero.
      $$EU(p) = p(1-p)Y + p^2(1) = pY - p^2Y + p^2$$
      $$EU'(p) = Y - 2pY + 2p$$
      $$EU'(1) = Y - 2Y + 2 = 2 - Y$$
      Pure Continue requires $2 - Y \ge 0 \implies \mathbf{Y \le 2}$.

  The exact threshold where the views split is **$Y = 2$**.

  **2. Verification**
  *   **(i) Classic Case:** In the classic problem, $Y = 4$. Since $4 > 2$, the classic case sits on the **disagreeing side**.
  *   **(ii) Mixed Strategy:** On the disagreeing side ($Y > 2$), the ex-ante optimum is interior (mixed). Setting $EU'(p) = 0$:
      $$Y + 2p(1 - Y) = 0 \implies 2p(Y - 1) = Y \implies p = \frac{Y}{2(Y - 1)}$$
      Plugging in the classic $Y = 4$:
      $$p = \frac{4}{2(3)} = \frac{4}{6} = \mathbf{2/3}$$
      This matches the classic optimum (continue with probability 2/3) exactly.
