prompt: |-
  A guy from my local rationalist meetup has gotten really into Marx lately, and since my own knowledge of historical materialism is basically secondhand -- a few old SSC posts and a history podcast -- I can't tell how much he's getting right. His summary went like this: 'Historical materialism says the economic base determines the superstructure, full stop. Culture, religion, law, philosophy -- these are just tools the ruling class uses to justify its own power, so they have no independent causal force whatsoever. And it's a prediction, not just an interpretive lens: Marx proved capitalism must collapse once the productive forces outgrow capitalist relations, with roughly the same necessity as thermodynamics. We're in the late stage now, so the collapse is overdetermined, it's just a question of when.'

  He's not stupid, so I don't think this is a strawman, but it feels like he's overclaiming in places? Like I vaguely remember that even Marx and Engels themselves hedged on whether culture is *purely* downstream of economics, and the 'it's basically thermodynamics' bit sounds way too confident for something that's supposed to be a serious social theory. Go through it piece by piece for me: which parts would even a sympathetic Marxist philosopher accept, which are conflations or vulgarized versions of what the thesis actually says, and does the 'collapse is overdetermined' conclusion follow from whichever parts he got right? I'm not trying to dunk on him, I genuinely want to know if there's a version of this thats defensible.
