prompt: |-
  I teach a second-year module on collective decision-making — about sixty students who have had a term of introductory rational-choice material (preference orderings, expected utility) but no formal game theory. Next week I have a fifty-minute lecture on the rational-choice paradox of voting: the problem that the expected instrumental payoff of a single vote in a large election is so small relative to its cost that high turnout, rather than abstention, is what cries out for explanation.

  Please don't give me the lecture itself; give me a plan for it, in British English. Specifically:

  1. The order of the pieces, and why that order — which ideas must be in place before the paradox can be stated so that it lands as a paradox rather than as a truism about lazy people. I'd expect the expected-utility machinery to come in somewhere, but I want you to say where the empirical magnitude of the probability of being pivotal should sit relative to the normative sting: whether students should see the arithmetic before or after they've decided they already know the conclusion.

  2. The one carrying example — a concrete election with actual numbers for electorate size, the cost of voting, and the benefit at stake, so students can watch the arithmetic swallow the stakes. Please say what the example must contain and what it must lack: in particular, it shouldn't be a small committee where being pivotal is genuinely plausible, since that lets students file the paradox as a matter of scale rather than of structure. I'd also like a variant worked in where the voter counts everyone's benefit rather than only her own, so students see that the conclusion is robust even to a hundredfold inflation of the stakes — but say whether you'd front-load that or hold it as a rebuttal absorber.

  3. The misconceptions students will bring or form, in the order they'll actually surface, and where in the arc each should be headed off. The ones I can predict: (a) confusing this paradox with Condorcet's cycling paradox and with Arrow's theorem, which share the name across different literatures; (b) hearing the civic-duty term in the pB − C + D calculus as a knock-down refutation rather than as a promissory note that itself demands explanation; (c) the thought that if everyone reasoned like the abstaining voter, no one would vote, so the conclusion must be wrong — a smuggling-in of collective rationality that students won't notice themselves doing; and (d) the overcorrection that one vote literally never matters, even in electorates of two hundred. But there will be others I haven't predicted, and I'd like to know where in the sequence each belongs rather than getting a flat list.

  4. What I should explicitly decline to cover at this level, and say so aloud to the students. I'm thinking of the minimax-regret response and of any serious treatment of mixed-strategy equilibria in turnout models, both of which I can name-drop without teaching — but tell me if something else belongs behind that line more urgently.

  5. One check-for-understanding question for the tutorial sheet that would separate a student who has grasped the structure of the problem from one who has merely learned the slogan that voting is irrational — and a sentence on what a good answer to it looks like and what a memorised answer would say instead.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture plan:

  1.  **Analyze the Request:**
      *   **Context:** Second-year module on collective decision-making. 60 students. Background: Intro rational choice (preferences, EU), no formal game theory.
      *   **Topic:** Rational-choice paradox of voting (why vote if $pB < C$?).
      *   **Duration:** 50-minute lecture.
      *   **Constraints:** British English. Do *not* write the lecture; write a *plan*.
      *   **Specific Requirements:**
          1.  Order of pieces (logic flow, placement of EU machinery vs. empirical magnitude).
          2.  One carrying example (specific numbers, large electorate, variant with social benefit, placement of variant).
          3.  Misconceptions (order of surfacing, where to head them off, including unpredicted ones).
          4.  Explicit exclusions (what *not* to cover, e.g., minimax-regret, mixed strategies).
          5.  One check-for-understanding question (tutorial sheet) + grading criteria.

  2.  **Deconstruct Section 1: Order of Pieces:**
      *   *Goal:* Make it land as a paradox, not a truism about laziness.
      *   *Logic:* If I start with "voting is costly," students think "yeah, lazy people don't vote." If I start with "people do vote," they think "so what?" The tension needs to be built.
      *   *Sequence:*
          1.  Empirical Observation (High turnout exists).
          2.  Rational Choice Framework (EU calculation).
          3.  The Probability Problem ($p$ is tiny).
          4.  The Calculation ($pB < C$).
          5.  The Conclusion (Abstention is dominant).
          6.  The Conflict (Observation $\neq$ Prediction).
      *   *Placement of Arithmetic:* Needs to happen *after* they accept the rational choice framework but *before* they dismiss it as "just theory." The empirical magnitude of $p$ is the killer blow. It needs to come right when they think they see the solution.
      *   *Rationale:* Establish the norm (people vote), establish the tool (EU), apply the tool, reveal the absurdity.

  3.  **Deconstruct Section 2: The Carrying Example:**
      *   *Requirements:* Concrete, actual numbers, large electorate (to kill the "small committee" objection), cost/benefit defined.
      *   *Numbers:* Needs to be realistic but stark.
          *   Electorate ($N$): ~500,000 (constituency size, not national, makes it feel closer but still impossible).
          *   Benefit ($B$): £10,000 (tax cut/policy gain).
          *   Cost ($C$): £5 (time/travel).
          *   Probability ($p$): Needs to be calculated or stated as $\approx 1/N$ or using Gelman/Katz/Bosch approximation. Let's use a simplified $1/2N$ or similar for intuition, but emphasize the order of magnitude ($10^{-6}$).
      *   *Variant:* Altruistic voting ($B \times N$).
      *   *Placement:* Keep the altruistic variant as a "rebuttal absorber" (later in the lecture). If front-loaded, it dilutes the initial paradox. The point is to break the *instrumental* logic first, then show that even expanding $B$ doesn't fully save it without $D$.
      *   *What it must lack:* Strategic interdependence (game theory), risk aversion nuances (keep it linear EU for now).

  4.  **Deconstruct Section 3: Misconceptions:**
      *   *Predicted:* (a) Confusion with Arrow/Condorcet, (b) $D$-term as magic bullet, (c) "If everyone thought that..." (Kantian/Collective rationality), (d) "One vote never matters."
      *   *Unpredicted:* (e) Confusion between *ex ante* probability and *ex post* closeness, (f) Thinking rational choice prescribes selfishness rather than consistency.
      *   *Timing:*
          *   (a) At the very start (definition).
          *   (e) During the probability calculation.
          *   (d) Immediately after the calculation.
          *   (c) When discussing the aggregate implication.
          *   (b) When introducing the solution ($D$).
          *   (f) Throughout (reinforce that RC is about means-ends).

  5.  **Deconstruct Section 4: Exclusions:**
      *   *User Suggested:* Minimax-regret, Mixed-strategy equilibria (turnout games).
      *   *My Addition:* Expressive voting (Akerlof) vs. Instrumental voting distinction needs to be clear, but deep psychological modeling is out. Also, avoid detailed derivations of $p$ (binomial distributions) – just state the magnitude. Avoid ethical philosophy (is it *moral* to vote?). Stick to *rationality*.
      *   *Reasoning:* Second-years without game theory can't handle the Nash equilibrium of turnout games (Palfrey/Rosenthal). Minimax is too technical for 50 mins.

  6.  **Deconstruct Section 5: Check-for-Understanding:**
      *   *Goal:* Distinguish structure grasp vs. slogan memorization.
      *   *Question:* Needs to force them to manipulate the variables ($p, B, C, D$).
      *   *Idea:* A scenario where $B$ increases massively (e.g., existential threat). Does the paradox disappear?
      *   *Good Answer:* Recognizes $p$ scales down as $N$ scales up, or that $pB$ still $< C$ unless $D$ is invoked.
      *   *Bad Answer:* "Yes, because the stakes are high." (Misses the probability scaling).

  7.  **Drafting the Plan (incorporating British English & Tone):**
      *   *Tone:* Academic, precise, pedagogical.
      *   *Spelling:* Organisation, behaviour, modelling, programme (if used), centre.
      *   *Structure:* Follow the 5 points requested.

      *(Self-Correction during drafting)*: Make sure I explicitly address *why* the arithmetic comes where it does. The prompt asks for justification on the order.
      *Refining the Example:* A UK General Election constituency is perfect. ~70,000 voters. Not national (too abstract), not committee (too small).
      *Refining the Misconceptions:* Ensure the "If everyone did that" fallacy is addressed as a category error (individual vs. collective rationality).
      *Refining the Question:* Make sure it tests the *relationship* between $p$ and $B$, not just the formula.

  8.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Plan not lecture? Yes.
      *   All 5 points covered? Yes.
      *   Specific constraints on example (large electorate, variant placement)? Yes.
      *   Specific constraints on misconceptions (order of surfacing)? Yes.

  9.  **Final Polish:** Check the flow and ensure the pedagogical reasoning is clear. (e.g., explaining *why* the altruistic variant is held back). Ensure the distinction between 'rational' and 'reasonable' is maintained.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Here is a lecture plan designed for a fifty-minute session with second-year students. It is structured to build the tension of the paradox before offering the standard resolutions, ensuring the arithmetic lands with the intended force.

  ### 1. Order of Pieces and Pedagogical Logic

  The arc must move from **empirical regularity** to **theoretical prediction** to **contradiction**. If you begin with the calculus, students view the result as a quirk of the maths. If you begin with the observation, they view the theory as broken. You must make them feel the break.

  *   **Minutes 0–5: The Empirical Stylised Fact.**
      *   Establish that turnout is consistently high (e.g., 60–80% in general elections) despite secrecy and lack of enforceable contracts.
      *   *Why here:* This anchors the discussion in reality. It prevents the 'lazy people' truism. We are not explaining why people *don't* vote; we are explaining why they *do*.
  *   **Minutes 5–15: The Rational-Choice Framework (EU Machinery).**
      *   Recap the expected utility formula: $EU = \sum p_i U_i$. Apply it to the act of voting vs. abstaining.
      *   Define the terms: $B$ (benefit of preferred outcome), $C$ (cost of voting), $p$ (probability of being pivotal).
      *   *Why here:* You must equip them with the tool before asking them to use it. Do not introduce the magnitude of $p$ yet. Let them assume, intuitively, that 'my vote might matter'.
  *   **Minutes 15–25: The Arithmetic of Pivotality (The Sting).**
      *   Now introduce the empirical magnitude of $p$. Show that for a large electorate, $p \approx 0$.
      *   Perform the calculation: $pB < C$.
      *   *Why here:* This is the crucial sequencing. If they see the numbers first, they dismiss the theory as unrealistic. If they accept the framework first, the numbers destroy their intuition. The paradox lands only when the conclusion (abstain) clashes with the opening fact (high turnout).
  *   **Minutes 25–40: The 'D' Term and Altruistic Variants.**
      *   Introduce the $D$ term (civic duty/expressive benefit) to save the model: $pB - C + D > 0$.
      *   Introduce the altruistic variant (counting social benefit) here as a stress test.
      *   *Why here:* This moves from problem to solution. It shows that rational choice can explain turnout, but only by changing the definition of 'benefit'.
  *   **Minutes 40–50: Implications and Limits.**
      *   Discuss what this implies for democracy (fragility of instrumental motivation) and close with exclusions.

  ### 2. The Carrying Example

  You need a single, consistent numerical scenario to avoid cognitive load. Do not switch contexts.

  *   **The Scenario:** A UK General Election in a marginal constituency.
  *   **The Numbers:**
      *   **Electorate ($N$):** 70,000 (large enough to kill 'small committee' intuitions, small enough to feel real).
      *   **Benefit ($B$):** £5,000 (the present value of tax cuts/policy gains to the individual over a parliamentary term).
      *   **Cost ($C$):** £10 (time, travel, registration hassle).
      *   **Probability ($p$):** Use the approximation $p \approx 1 / \sqrt{N}$ or simply state the order of magnitude derived from binomial distribution logic (roughly 1 in 10,000 for a tight race, often much lower). Let us use **1 in 50,000** for starkness.
  *   **The Calculation:**
      *   Expected Instrumental Payoff: $(1/50,000) \times £5,000 = £0.10$.
      *   Cost: £10.00.
      *   Net: $-£9.90$.
      *   *Result:* The arithmetic swallows the stakes. Even a substantial personal gain is obliterated by the probability.
  *   **The Altruistic Variant:**
      *   Assume the voter cares about the total social benefit ($B \times N$).
      *   New $B$: £5,000 $\times$ 70,000 = £350 million.
      *   New Expected Payoff: $(1/50,000) \times £350,000,000 = £7,000$.
      *   *Result:* Now $pB > C$.
  *   **Placement of Variant:** Hold this back as a **rebuttal absorber** (Minutes 30–35). Do not front-load it. If you present this early, students will conclude the paradox is solved by 'caring about others'. You want them to feel the failure of *instrumental self-interest* first. The altruistic calculation shows that the paradox is robust *unless* we fundamentally alter the utility function to include others' welfare as heavily as one's own, which is a significant behavioural assumption.

  ### 3. Misconceptions: Order of Surfacing and Intervention

  Students will not raise these in a random order; they will arise as natural defensive reactions to the argument. You must pre-empt or address them at the specific moment they become tempting.

  1.  **Confusion with Aggregation Paradoxes (Condorcet/Arrow).**
      *   *When:* Minute 5 (Introduction).
      *   *Intervention:* Explicitly distinguish the 'Paradox of Voting' (participation) from 'Voting Paradoxes' (aggregation/preference cycles). Write the distinction on the board.
  2.  **The 'Ex Post' Fallacy (One vote never matters).**
      *   *When:* Minute 20 (During the arithmetic).
      *   *Intervention:* Students will say, "My vote literally never decides anything." Correct this: In a electorate of 200, it *could*. In 70,000, the probability is non-zero but negligible. Distinguish between *impossible* and *improbable*. Rational choice cares about the expectation, not the certainty.
  3.  **The 'Universalisation' Fallacy (If everyone thought that...).**
      *   *When:* Minute 25 (Immediately after concluding abstention is rational).
      *   *Intervention:* This is the most dangerous error. Students will argue: "If everyone abstained, the election would be cancelled, so voting is rational."
      *   *Correction:* This smuggles in collective rationality. Rational choice is methodologically individualist. My decision does not causally affect yours (in this model). I must take others' behaviour as given. If everyone else votes, my incentive to vote drops further (free-riding).
  4.  **The 'Magic D' Fallacy.**
      *   *When:* Minute 35 (Introduction of the $D$ term).
      *   *Intervention:* Students will treat $D$ (civic duty) as a solution rather than a restatement of the problem.
      *   *Correction:* Emphasise that adding $D$ makes the model *consistent* with observation, but it does not *explain* why $D$ exists. It is a promissory note for psychological or normative theory, not a rational-choice derivation.
  5.  **Unpredicted: The 'Risk Aversion' Defence.**
      *   *When:* Minute 25 (Conclusion of the arithmetic).
      *   *Intervention:* A sharp student may suggest risk aversion makes the vote valuable (insurance).
      *   *Correction:* Acknowledge this, but note that for risk aversion to overcome a probability of $10^{-5}$, the utility function would need to be implausibly curved. It saves the theory only at the cost of realism.

  ### 4. Explicit Exclusions

  You must draw a boundary around the module's scope to prevent students from reading advanced game theory into introductory concepts. State these aloud at Minute 45.

  *   **Mixed-Strategy Equilibria in Turnout Games:** Do not discuss Palfrey-Rosenthal models where voters randomise to keep the election close. This requires Nash equilibrium concepts they do not have. To mention it without teaching it is to suggest the paradox is 'solved' by game theory, which obscures the individual decision problem you are teaching.
  *   **Minimax-Regret:** Do not cover the argument that voters minimise maximum regret rather than maximise expected utility. This changes the decision rule entirely. It belongs in a module on behavioural economics or advanced decision theory, not here.
  *   **Ethical Philosophy:** Decline to answer whether one *ought* to vote. You are analysing the *rationality* of the action given preferences, not the *morality* of the preferences. Keep positive analysis separate from normative judgement.

  ### 5. Check-for-Understanding Question

  **Question for the Tutorial Sheet:**
  > "Imagine an election where the policy stakes are existential: the winning candidate will either save the voter's life or cause their death ($B = \infty$). The electorate size remains 70,000. The cost of voting is £10. According to the standard rational-choice calculus of voting (excluding the $D$ term), does the voter necessarily vote? Explain why or why not, paying close attention to the interaction between $p$ and $B$."

  **Grading Criteria:**
  *   **Good Answer (Grasps Structure):** Recognises that while $B$ is infinite, the expected utility is $p \times \infty$. If $p$ is treated as strictly zero, the product is undefined or zero. However, a sophisticated answer will note that if $p > 0$ (no matter how small), $p \times \infty$ dominates $C$. *Crucially*, the best answers will question whether $p$ remains independent of the stakes (i.e., does the electorate size shrink if stakes are high?) or note that the standard paradox relies on finite $B$. If they argue that $p$ scales down as $N$ scales up, they show they understand the structural constraint.
  *   **Memorised Answer (Slogan-Based):** "Yes, they vote, because the benefit is huge." This fails because it ignores the probability term. Or, "No, they don't vote, because voting is always irrational." This fails because it treats the paradox as a law of nature rather than a model output dependent on variables.
  *   **The Key Distinction:** The student must demonstrate that they understand the *product* $pB$, not just the magnitude of $B$. A student who has grasped the structure will explicitly discuss whether $p$ becomes vanishingly small enough to counteract an infinite (or very large) $B$, or whether the model breaks down at extremes.
