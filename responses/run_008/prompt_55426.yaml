  I'm a second-year econ major taking game theory this semester, and the backward induction stuff has genuinely broken my brain. We played a centipede game in class for real money (bonus points, technically) and almost everyone passed a few times before someone finally grabbed the pot, which got me trying to figure out when I actually trust the backward induction argument and when I think it proves way too much. So I've collected my gut verdicts on a bunch of cases, and I want to know whether there's a single principle behind them or whether I'm just being inconsistent.

  Here are the verdicts. In a 100-move centipede game with decent stakes against someone I know is smart, I think passing at the first couple of nodes is rational, and I'd do it. But in a 2-move version of the exact same game, taking immediately seems clearly correct and passing seems like a mistake. In a finitely repeated prisoner's dilemma with 10 rounds and a known endpoint, I think cooperating through round 8 or so is fine, and defecting from round 1 is not what rationality demands. But in a 2-round version, I think you should defect from the start, so the same tension shows up again. With the surprise exam thing (exam next week, but it will be a surprise, student proves by backward induction it can't happen), I'm confident the student's conclusion is wrong even though I can't locate the bad step. And with the chain store setup -- incumbent threatens a price war to deter entry across 20 markets -- I think the threat is empty in the last market, but the incumbent can still rationally fight in market 1, which I gather is supposed to be an incoherent position to hold.

  Then there's the case I keep flip-flopping on and would love your read on: a 100-move centipede game against a stranger, for large stakes, where the stranger was drawn at random from the general population rather than from people who've thought about any of this. I honestly don't know what I think there. Please take on the role of a philosopher of decision theory who is also a serious game theorist, brainstorm for a moment before committing to anything, and then give me the principle (or small set of candidates) that captures the pattern: state each clause precisely, tie it to whichever of my verdicts motivates it, say what it predicts for the stranger case and for any new cases you can think of, and be honest about which of my verdicts it simply cannot save. If keeping all my verdicts requires some baroque monster of a principle, tell me that, and tell me which verdict to drop instead. End your reply with one final line of the form \answer{...} containing a single-sentence statement of your final principle.
