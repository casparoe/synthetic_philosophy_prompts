  #### 2. The Case 7 Correction (The Sacrifice)
  **Your Verdict:** Conditional Swap (firm), but Ex-Ante Indifference (firm).
  **Principle Verdict:** **Ex-Ante Indifference overrides Conditional Swap.**
  **Analysis:** This is the core incoherence. You cannot hold both that (A) symmetry makes swapping worthless sealed, and (B) seeing the amount makes swapping valuable.
