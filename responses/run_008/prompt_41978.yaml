      *   If you see $X=2^k$, it is 3 times more likely you hold the *larger* envelope (from pair $n=k-1$) than the *smaller* (from pair $n=k$).
      *   $E[\text{Other}] = \frac{3}{4}(\frac{X}{2}) + \frac{1}{4}(2X) = 0.875X$.
      *   Your intuition that "calculation says swap" is likely based on the standard paradox literature (which often uses a flatter prior, like $1/2^n$).
  *   **The Philosophical Reality:** Even if we adjust the prior so that $E[\text{Other}|X] > X$ (e.g., $P(n) \propto 1/2^n$), this creates an **infinite expectation**. When expectations are infinite, standard dominance arguments fail.
  *   **Resolution:** You must overturn your **Conditional Swap** verdict in Case 7. The Ex-Ante Indifference (Clause 1) is the more robust normative rule. If you wouldn't pay to swap sealed, seeing a number generated by the same process shouldn't change your mind unless that number reveals a boundary (like Case 5). In Case 7, there are no boundaries. The "gain" is an illusion created by the possibility of infinite values.

  **Summary of Overturning:**
