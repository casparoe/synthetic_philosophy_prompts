  *   **Rationale:** A policy of "Always Swap" is functionally identical to "Always Keep" under symmetric assignment; one policy yields Envelope A, the other Envelope B. Since $E[A] = E[B]$, $E[\text{Swap}] = E[\text{Keep}]$.

  **Clause 2: Diagnostic Conditional Updating**
  If you open an envelope and observe an amount $X$, you should calculate the expected value of the other envelope conditional on $X$, *provided* that the prior distribution of amounts has a finite mean. If $E[\text{Other} | X] > X$, swap.
  *   **Motivated by:** Cases 5 and 6.
  *   **Rationale:** Opening the envelope provides diagnostic information. In Case 5 ($300 vs $4,000 bounds) and Case 6 (fixed smaller amount), the observed $X$ shifts the posterior probability of you holding the smaller vs. larger amount. Bayesian updating is valid here because the expectations are well-defined.

  **Clause 3: The Infinity Constraint**
  If the prior distribution implies an infinite expected value (or is improper), Clause 2 is suspended. Even if a conditional calculation suggests $E[\text{Other} | X] > X$ for all $X$, you must defer to Clause 1 (Indifference). A conditional advantage that holds for every outcome but sums to zero ex-ante is a mathematical artifact of infinity, not a decision-theoretic opportunity.
  *   **Motivated by:** Cases 7 and 8.
  *   **Rationale:** Case 8 shows that naive EV scaling leads to absurdity (500x gain). Case 7 presents the specific paradox where conditional swapping dominates ex-ante symmetry. This clause prioritizes the robust symmetry argument over the fragile infinite-series calculation.

