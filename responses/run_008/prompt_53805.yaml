      *Correction on the "Neutrality" point:* In some popularizations, "Non-Dictatorship" is described loosely as "no single voter matters more." The podcast calls this "Neutrality... or any particular voter." This is actually a description of *Anonymity* (no voter favored) and *Neutrality* (no candidate favored). Arrow's condition is specifically *Non-Dictatorship*. While related, they are distinct. A system can be non-dictatorial but still violate anonymity (e.g., weighted voting). Arrow's theorem holds even if you only demand Non-Dictatorship. The podcast's phrasing suggests "Neutrality" is the axiom, which is technically wrong for Arrow's General Possibility Theorem. I will classify this as a significant conflation.

