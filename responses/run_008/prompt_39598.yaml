          2.  **Counterfactual Incoherence:** You cannot simultaneously hold "My opponent is rational" and "My opponent just passed at Node 1 (which a rational agent wouldn't do)." Standard BI forces you to ignore the evidence of your eyes.
          3.  **Normative Failure:** Rationality should guide action to good outcomes. If following the "rational" algorithm guarantees a Pareto-inferior result against almost any real opponent, the label "rational" is doing too much heavy lifting.
          4.  **Conclusion:** It's not just counterintuitive; it reveals that CKR is too strong a condition for dynamic games with multiple steps.

  6.  **Refining the Tone:**
