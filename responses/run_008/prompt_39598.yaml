          *   Dana's Off-path defense: Technically consistent with SPNE, but ignores *belief revision*.
          *   Dana's Commitment defense: True, but conflates "rational" with "optimal outcome."
          *   Marcus's Two-tier/On-path dependency: **Winner.** Highlights the fragility of BI.
          *   Marcus's Empirical/Normative strike: **Winner.** A normative theory that guarantees loss is flawed.
