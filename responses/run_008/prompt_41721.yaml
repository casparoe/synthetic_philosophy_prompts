answer: |-
  You have hit on one of the most significant, unresolved, and often awkward tensions in modern ethics. You are not imagining this, and it is not just "vibes." It is a recognized philosophical problem with a growing body of literature.

  To give you the direct answer first: The specific field of study you are describing is called **Wild Animal Suffering (WAS)**. The broader clash you've identified is between **Environmental Ethics (Ecocentrism/Holism)** and **Animal Ethics (Sentientism/Individualism)**.

  Here is how philosophers and ethicists carve this up, broken down in a way that should resonate with a systems-thinking background.

  ### 1. The Two Conflicting Architectures

  The confusion you see in public debates exists because people are running two different ethical "operating systems" that are incompatible, but they pretend they are using the same one.

  **System A: Environmental Ethics (Holism)**
  *   **Unit of Value:** The Ecosystem, the Species, or "Nature."
  *   **Goal:** Biodiversity, stability, complexity, "wildness."
  *   **View on Individuals:** Expendable. A wolf eating a deer is "good" because it maintains population balance and ecosystem health, even if it's terrible for the deer.
  *   **Key Metric:** Health of the system.
  *   **Proponents:** Aldo Leopold (Land Ethic), Deep Ecologists, most mainstream conservation organizations.

  **System B: Animal Ethics (Individualism/Sentientism)**
  *   **Unit of Value:** The Individual Sentient Being.
  *   **Goal:** Minimize suffering, maximize well-being.
  *   **View on Individuals:** Paramount. A wolf eating a deer is "bad" (or a tragedy) because it causes immense suffering to the deer, regardless of ecosystem benefits.
  *   **Key Metric:** Net pleasure minus pain for individuals.
  *   **Proponents:** Peter Singer, Utilitarians, Animal Rights advocates.

  **The Clash:** When a conservationist says "We need to restore this wetland to support more frogs," they are optimizing for **System A** (more biological activity). When you ask "But will those frogs suffer?" you are querying **System B**. Most public discourse conflates the two, assuming that "Good for Nature" automatically equals "Good for Animals." As you noted, this is logically inconsistent if wild lives are net-negative.

  ### 2. The Empirical Question: Is Wild Life Net Negative?

  You asked if the premise that "wild lives are net bad" is dumb. In the literature, this is treated as an open empirical question, though it is incredibly difficult to measure. This field is sometimes called **Welfare Biology**.

  *   **The Case for Net Negative (r-selection strategy):** Many species (like your frog example) employ an r-selection strategy. They produce thousands of offspring with zero parental care. The vast majority die within days or weeks, often via painful means (predation, starvation, disease, exposure). If pain weighs heavier than pleasure (a common utilitarian view), the sum total of these short, painful lives could easily be negative.
  *   **The Case for Net Positive (K-selection strategy):** Larger mammals (elephants, primates) often have few offspring, invest heavily in them, and live long lives. They experience play, social bonding, and satisfaction of needs. Proponents argue that while death is painful, life is generally good until the very end.
  *   **The Measurement Problem:** We currently have no "hedonometer" to measure animal subjective experience. We infer suffering from behavior and physiology (cortisol levels, avoidance behavior), but we cannot sum total "frog-utility."

  **Key Takeaway:** Philosophers who study WAS generally argue that even if we aren't *sure* wild life is net negative, the *probability* is high enough that we shouldn't blindly assume "more nature = more good."

  ### 3. The "Naturalistic Fallacy" and Location

  You asked: *"If suffering is what you care about, why does the location of the suffering (a cage vs the woods) flip the sign?"*

  This is the **Naturalistic Fallacy** (deriving an "ought" from an "is").
  *   **Factory Farming:** Humans are the *cause*. We are morally responsible for the suffering we create.
  *   **Wild Suffering:** Nature is the *cause*. Humans are not responsible.

  For many, the moral imperative is **negative rights** (do not harm) rather than **positive rights** (prevent harm).
  *   **The Standard View:** I must not build a factory farm (I am causing harm). I am not required to stop a lion from eating a gazelle (I am not causing that harm, and intervening might break the ecosystem).
  *   **The WAS View:** If suffering is bad, it doesn't matter who causes it. If I can prevent a child from drowning, I should, even if I didn't push them in. Similarly, if we can reduce wild suffering without causing ecological collapse, we arguably should.

  ### 4. Policy Implications: Intervention vs. Laissez-Faire

  This is where the rubber meets the road. If you accept the WAS premise, what do you do?

  1.  **Laissez-Faire (The Environmentalist Standard):** Do not intervene. Nature knows best. Intervention leads to unintended consequences (e.g., removing predators causes overpopulation and mass starvation). The value of "wildness" outweighs individual suffering.
  2.  **Soft Intervention:** Reduce suffering where it doesn't disrupt ecosystems. Example: Vaccinating wild animals against painful diseases, or using immunocontraception to prevent overpopulation booms that lead to famine.
  3.  **Hard Intervention (Theoretical):** Actively manage predation. This is the most controversial. Some theorists suggest we might eventually have a moral duty to phase out predation or genetically modify predators to be herbivores. (This sounds sci-fi, but it is seriously discussed in the literature).

  ### 5. Key Names and Literature to Google

  If you want to read the actual arguments, here are the search terms and key figures:

  *   **Wild Animal Suffering (WAS):** The umbrella term.
  *   **Oscar Horta:** A philosopher who founded the organization *Animal Ethics*. He writes extensively on why environmentalists and animal advocates need to reconcile this.
  *   **Yew-Kwang Ng:** An economist/philosopher who coined the term **Welfare Biology** in 1995. He argued explicitly that we need to study the net happiness of wild animals.
  *   **Holmes Rolston III:** A leading environmental ethicist. He argues *against* the WAS view, claiming that ecosystems have value that transcends individual suffering. (Good for the counter-argument).
  *   **David Pearce:** A transhumanist philosopher who wrote *The Hedonistic Imperative*. He argues we have a duty to use technology to abolish suffering in all sentient life, including wild animals.
  *   **Jeff McMahan:** A philosopher who wrote "The Meat Eaters" (not about diet, but about predation). He argues that if we could stop predation without disaster, we should.

  ### 6. Why isn't this sorted out yet?

  You asked if this is a "mess people haven't sorted out." It is. There are three reasons why:

  1.  **Tribalism:** Environmentalists and Animal Rights activists are natural political allies (both oppose industrial exploitation). Pointing out this contradiction threatens their coalition.
  2.  **Feasibility:** Even if wild suffering is bad, humans are historically terrible at managing ecosystems. Every time we try to "fix" nature (introducing cane toads, removing wolves), we often make suffering *worse*. The "Laissez-Faire" argument is partly a humility heuristic: "We are too clumsy to fix this safely."
  3.  **The "Meaning" Argument:** Some philosophers argue that struggle, predation, and death give wild animals "dignity" or "autonomy" that a managed existence would lack. (This is a hard sell for utilitarians, but common in virtue ethics).

  ### Summary for your mental model

  *   **The Conflict:** **Ecocentrism** (System Health) vs. **Sentientism** (Individual Welfare).
  *   **The Specific Problem:** **Wild Animal Suffering**.
  *   **The Empirical Status:** Unknown, but likely contains massive amounts of suffering due to evolutionary strategies (r-selection).
  *   **The Ethical Consensus:** There is no consensus. Mainstream conservation ignores individual suffering. Mainstream animal rights focuses on human-caused suffering (farming/testing) and treats wild suffering as a tragic given.
  *   **The Frontier:** A small but growing group of philosophers and effective altruists are arguing that reducing wild suffering should be a priority cause area, provided we can do it without causing ecological collapse.

  Your intuition is correct: "More habitat = More animals = Good" is a heuristic that collapses under scrutiny if your primary metric is individual suffering. It holds up only if your primary metric is "biological complexity" or "species preservation."
