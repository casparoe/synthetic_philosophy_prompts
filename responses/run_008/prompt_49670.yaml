      *   **Concept 1: What Heritability Actually Means:** Define $h^2$ properly (variance in population, not determination in individual). Address the "fixed at conception" error.
      *   **Concept 2: The "Family Doesn't Matter" Claim:** Distinguish between Shared Environment ($c^2$) and Non-Shared Environment ($e^2$). Address the adoption study memory (siblings diverge in adulthood).
      *   **Concept 3: The Within-Group to Between-Group Inference:** Explain why this is a logical fallacy (Lewontin). Use the height/nutrition analogy.
      *   **Concept 4: Malleability vs. Heritability:** Explain that genetic traits can be environmentally modified (PKU example, height example).
      *   **Narrative Advice:** How to translate this into the narrator's voice. Give specific lines or angles the narrator could take.

  5.  **Drafting the Content (Iterative Refinement):**

      *   *Refining Heritability:* Make sure to emphasize it's a ratio of variances ($V_G / V_P$). If environment is uniform, heritability is 1.0, even if the environment is crucial.
      *   *Refining Adoption:* Be careful. Adopted siblings *do* share a home. Do they resemble? For IQ: correlation drops to ~0 by adulthood. For personality: low. For social attitudes: higher. So the user's memory is technically wrong regarding the "big traits" (IQ/Personality) but right for others. I need to clarify this distinction.
      *   *Refining the Group Difference:* This is the most politically charged but scientifically clear point. Must emphasize that causal mechanisms within a group don't dictate causal mechanisms for group means.
