  Something about my fertility clinic's own rules has been bugging me and I can't tell if they add up to a philosophy or just an accident of history. We test embryos for Tay-Sachs and the counselors basically nudge everyone toward excluding the affected ones, but for Huntington's or BRCA1 the tone shifts to total neutrality -- your choice, we support either decision, no recommendation implied. Same clinic will happily do sex selection for family balancing (legal where we are, banned in a bunch of other countries) but flat out refused when a Deaf couple asked to be tested so they could pick an embryo that would also be Deaf -- policy says selecting for disability is off the table, period.

  So what does this pattern presuppose? If these were treated as straightforwardly medical decisions, you'd expect one consistent line tracking disease severity, which maybe fits Tay-Sachs vs Huntington's but not the family-balancing thing at all. If they're treated as value choices, you'd expect non-directiveness everywhere, including the Deaf case. Is there actually some theory of the parent-child relation or of the child's welfare that generates exactly this set of rules -- some line between rescuing a future kid from bad luck and having a kid to spec? Does the sex-selection half quietly presuppose the opposite of what the deafness half does? Reconstruct whatever implicit commitments hold this together, tell me which parts are genuinely underdetermined (compatible with several theories, so the clinic isn't committed to as much as it looks), and point out if some part only makes sense as social caution rather than principle. Under 450 words please.
