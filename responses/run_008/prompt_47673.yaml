answer: |-
  You have put your finger on the central theoretical tension in the literature on deliberative democracy. The design of citizens' assemblies (CAs) is not the result of a single, clean theory of legitimacy. Instead, it is a **pragmatic bricolage** attempting to synthesize three competing sources of legitimacy that are often in tension: **Descriptive** (looking like the people), **Epistemic** (knowing the truth/being informed), and **Electoral** (having the mandate to decide).

  The implicit theory of legitimacy presupposed by the current standard model is **"Idealized Proxy Legitimacy."**

  Here is the breakdown of that theory, why the machinery looks contradictory, and where the design is genuinely unstable.

  ### 1. The Implicit Theory: "What the People *Would* Will"

  The core claim of a citizens' assembly is not that it *is* the people (a mirror), nor that it is *smarter* than the people (an epistocracy). The claim is Rousseauian: it claims to represent the **General Will** rather than the **Will of All**.

  *   **Will of All:** The aggregate of current, raw, often ill-informed preferences (measured by elections or polls).
  *   **General Will:** What the public would want if they were fully informed, free from partisan manipulation, and forced to consider the common good.

  Therefore, the legitimacy of the CA is **counterfactual**. It argues: *"We are the legitimate voice of the people because we represent what you would say if you were in our shoes."*

  This explains the contradictions you noticed:
  *   **Why Randomness?** To break partisan capture and ensure the "proxy" isn't a special interest group.
  *   **Why Quotas?** To ensure the "proxy" doesn't accidentally exclude marginalized perspectives due to statistical variance (N=150 is too small for pure law of large numbers).
  *   **Why Facilitation/Experts?** To simulate the "fully informed" condition required for the General Will to emerge.
  *   **Why Advisory?** Because they lack the *electoral* mandate to enforce the General Will over the Will of All (parliament).

  ### 2. Deconstructing the Machinery: Requirements vs. Compromises

  Let's map your specific puzzles to this theory.

  #### A. Stratified Sortition (Lottery + Quotas)
  *   **The Tension:** If legitimacy is statistical (mirror), quotas corrupt the randomness. If legitimacy is deliberative, quotas are unnecessary.
  *   **The Implicit Logic:** This is **Descriptive Legitimacy as a Proxy for Trust.** Pure sortition with N=150 risks ending up with, say, 40% retirees by chance, even if the country is 20% retired. If the assembly looks *too* weird, the public won't accept it as a valid proxy. Quotas are a statistical correction to ensure the "mirror" is clear enough to be socially accepted.
  *   **Verdict:** **Pragmatic Add-on.** A "Pure Mirror" theorist (sortition fundamentalist) would reject quotas as tampering with the divine right of the lot. A "Pure Deliberative" theorist wouldn't care about demographics, only cognitive diversity. The current model hedges: it wants the *appearance* of a mirror to gain public trust, without trusting the math of the lottery alone.

  #### B. Attrition and Self-Selection
  *   **The Tension:** As you noted, the final body is a random sample of *people willing to serve*, not the population. This skews toward the "civic-minded."
  *   **The Implicit Logic:** This is the weakest theoretical link. Defenders argue that **capacity is a prerequisite for legitimacy.** You cannot deliberate if you are not present. However, this effectively creates a "civic aristocracy" drawn from the masses.
  *   **Verdict:** **Pragmatic Necessity / Theoretical Hole.** There is no strong theoretical defense for this other than "we couldn't get anyone else." To fix this under the "Idealized Proxy" theory, you would need to pay members significantly more (compensating for lost wages) or make service mandatory (jury duty style) to remove the self-selection bias.

  #### C. Curated Experts and Facilitation
  *   **The Tension:** If this is the "voice of the people," why do unelected academics choose the experts?
  *   **The Implicit Logic:** This is **Epistemic Legitimacy.** The theory assumes raw public opinion is often "deformed" by misinformation. To access the "General Will," you must remove the distortion. The advisory board acts as a filter for truth.
  *   **Verdict:** **Strictly Required by the "Idealized" View.** If you remove this, you have a focus group, not a deliberative assembly. However, this creates a "Guardianship" problem: Who guards the guardians? If the advisory board is biased, the "General Will" produced is fake. This is the most underdetermined part of the design; there is no standardized, legitimate way to select the experts.

  #### D. Advisory Status vs. Parliamentary Supremacy
  *   **The Tension:** If they represent the "considered will," why can parliament ignore them?
  *   **The Implicit Logic:** This reveals that CAs are currently designed as a **Corrective Mechanism**, not a **Decision Mechanism**. They possess *Input Legitimacy* (fair process) but lack *Output Legitimacy* (authority to bind). They are designed to shame parliament, not overrule it.
  *   **Verdict:** **Political Compromise.** Theoretically, if the CA truly represents the "General Will," its recommendations should be binding (or at least require a supermajority to overturn). The fact that they are advisory admits that **Electoral Legitimacy** (the vote) still trumps **Deliberative Legitimacy** (the reasoning) in our current constitutional order.

  ### 3. Rebuilding Around Rival Views

  If we took the competing theories seriously, the machinery would look very different.

  #### View A: Pure Mirror (Sortition Fundamentalism)
  *   **Theory:** Legitimacy comes *only* from the statistical representation of the populace. Reasoning is secondary; the aggregate of raw interests is the truth.
  *   **Required Changes:**
      *   **Selection:** Pure lottery, no quotas (trust the math), no replacement for dropouts (accept the attrition as part of the random sample).
      *   **Process:** Minimal facilitation. No curated experts; members choose their own witnesses (like a court).
      *   **Power:** **Binding.** If they are the people, their vote *is* the law. Parliament becomes an administrative body.
      *   **Result:** This looks like a second legislative chamber chosen by lot (as proposed by some democratic theorists).

  #### View B: Pure Deliberative Quality (Epistemic Deliberativism)
  *   **Theory:** Legitimacy comes from the *quality* of the reasoning and the truth-tracking ability of the group. Demographics matter less than cognitive diversity and deliberative virtue.
  *   **Required Changes:**
      *   **Selection:** Application or nomination based on deliberative skill, openness, and reasoning ability. Randomness is discarded.
      *   **Process:** Intense philosophical and technical training.
      *   **Power:** **Binding on specific technical issues.** (e.g., "If the experts and this panel agree on climate targets, it becomes law").
      *   **Result:** This looks like a technocratic commission with a citizen face. It risks being seen as elitist.

  #### View C: The Current Hybrid (Deliberative Systems)
  *   **Theory:** Legitimacy is distributed across the "system." The CA is just one node. It generates ideas; the media debates them; the parliament decides.
  *   **Required Changes:** None, but it requires a cultural shift where parliament feels *politically unable* to ignore the CA, even if legally able.
  *   **Result:** The current model.

  ### 4. The Verdict: Coherent Hybrid or Unstable Compromise?

  It is a **coherent theoretical hybrid** but an **unstable political compromise.**

  **Why it is theoretically coherent:**
  It relies on **Systemic Deliberative Theory** (Dryzek, Mansbridge, et al.). This theory argues no single body can be fully legitimate. Legitimacy emerges from the division of labor:
  1.  **Empowered Space:** Parliament (has power, lacks time/focus).
  2.  **Public Space:** Media/Activists (has passion, lacks nuance).
  3.  **Transmission Space:** The Citizens' Assembly (has nuance and representation, lacks power).
  In this view, the CA isn't supposed to rule. It is supposed to *infuse* the public space with high-quality recommendations that change the cost-benefit analysis for politicians.

  **Why it is politically unstable:**
  The instability lies in the **Legitimacy Mismatch.**
  *   The CA is designed to produce **High-Trust Output** (careful, informed consensus).
  *   Parliament operates on **Low-Trust Input** (partisan bargaining, reelection anxiety).
  *   When Parliament ignores the CA (as in France), it reveals that **Electoral Legitimacy** (we were voted in) is still treated as superior to **Deliberative Legitimacy** (we thought hard about this).

  As long as CAs are advisory, they are vulnerable to being branded as "expensive focus groups." If they are made binding, they are vulnerable to being branded as "undemocratic coups" by populists who argue that only elections count.

  ### 5. Where is the Practice Underdetermined?

  The most critical underdetermined area is **Agenda Setting and Expert Selection.**
  *   **The Problem:** The "Question" put to the assembly determines the answer. If the government asks "How do we reduce carbon?" vs "Should we reduce carbon?", the outcome differs. Currently, the government or parliament sets the question.
  *   **The Implication:** This allows the elected officials to "stack the deck" before the lottery even happens. They can send the CA down a rabbit hole or forbid them from touching sacred cows.
  *   **The Fix:** A truly coherent "Idealized Proxy" model would require the CA (or a separate sortition body) to have the power to **self-agenda**. Without this, the CA is merely a tool of the executive, not a rival source of legitimacy.

  ### Summary

  The implicit theory is that **democracy requires a division of labor between *will* (elections) and *judgment* (deliberation).**

  The current machinery is an attempt to build a "Judgment Chamber" that mirrors the "Will Chamber." The contradictions you see (quotas, attrition, advisory status) are the friction points where the ideal of "Judgment" crashes into the reality of "Power."

  It is not a broken machine, but it is a **parasitic** one. It cannot survive on its own legitimacy; it must feed off the legitimacy crisis of the parliament to gain traction. If parliament is popular, the CA is ignored. If parliament is despised, the CA is empowered. That dependency is the source of the instability you sensed.
