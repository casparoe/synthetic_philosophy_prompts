      *   *Stranger (directions):* Low stakes, easy verification (walk and see), no motive to lie.
      *   *Historian:* Consensus of a community, peer review, evidence-based methodology, institutional backing.
      *   *Wikipedia:* Consensus mechanism, citations required, constant editing/correction by many eyes (Linus's Law).
