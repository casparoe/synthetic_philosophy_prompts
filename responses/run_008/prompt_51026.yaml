answer: |-
  This is a profound question about **epistemology** (how we know what we know). You are intuitively distinguishing between **Personal Trust** (do I like/believe this person?) and **Epistemic Trust** (is this information reliable?).

  Your gut is working correctly because it isn't using one rule; it is using a weighted algorithm. However, there is a unifying principle that ties them all together.

  ### The Principle: "Trust Systems of Error-Correction, Not Just Individuals"

  The rule isn't "Trust Experts." It is: **"Trust claims that have survived a process designed to catch errors, where the speaker's incentives align with the truth."**

  When you trust the pilot, the historian, or Wikipedia, you aren't trusting a *person*; you are trusting a *system* that stands behind that person. When you distrust your uncle or your friend, it's because their claims rely solely on individual assertion without systemic backup.

  Here are the three filters your gut is automatically applying:

  1.  **Domain Competence:** Does this person's training match the claim? (Uncle = Engines, not Immunology).
  2.  **Incentive Alignment:** Does the speaker lose something if they lie or are wrong? (Pilot loses license/life; Mechanic might gain profit).
  3.  **Error Correction:** Is there a mechanism that would have caught this if it were false? (Peer review for historians, editing for Wikipedia, flight data for pilots).

  ### Why Your Gut Calls Make Sense

  *   **The Pilot:** High competence + High incentive alignment (they are on the plane too) + High error correction (black boxes, regulators). **Verdict: Trust.**
  *   **The Historian:** You aren't trusting "a guy." You are trusting the **consensus of the field**. If a historian claims something wild about Rome, other historians will tear their work apart if there's no evidence. The "system" of academia filters out the lies over time. **Verdict: Trust.**
  *   **Wikipedia:** This is the "Wisdom of Crowds." It works on random facts because of **Linus's Law**: "Given enough eyeballs, all bugs are shallow." Vandalism is reverted quickly. Citations are required. It is a self-correcting machine. **Verdict: Trust.**
  *   **The Uncle:** High personal trust, but **Domain Mismatch**. Being smart with engines does not transfer to virology. Also, his claim relies on anecdote, not the systemic error-correction of clinical trials. **Verdict: Distrust.**
  *   **The Friend:** High personal trust, but **Low Prior Probability**. UFOs are extraordinary claims. Human perception is notoriously unreliable. There is no error-correction mechanism for a fleeting glance in the sky. **Verdict: Distrust.**

  ### The Test Case: The Sincere Mechanic

  **Scenario:** A very sincere mechanic tells you your car needs a $1,000 repair you cannot assess.

  **Analysis using the Principle:**
  *   **Competence:** High. They are trained for this domain.
  *   **Error Correction:** Low to Medium. Unlike the pilot (who is monitored by air traffic control) or the historian (monitored by peers), a mechanic working alone has little immediate oversight.
  *   **Incentive Alignment:** **Mixed/Negative.** Unlike the pilot (who wants you to live), the mechanic makes more money if the repair is true *and* if the repair is unnecessary. Their financial incentive is slightly misaligned with your truth.

  **The Verdict:**
  You should apply **Conditional Trust**, not the blind trust you give the pilot.
  *   **Do:** Ask to see the worn part. Ask for the old part to be kept. Ask for a second opinion if the cost is high.
  *   **Don't:** Accuse them of lying immediately (they are likely sincere), but do not accept the claim as finalized truth without external verification.
  *   **Why:** The mechanic has the *competence* of the pilot but lacks the *incentive alignment*. Your gut should feel different here than with the pilot. It should feel like, "I believe you *can* know this, but I need to verify you *aren't mistaken or upselling*."

  ### Which Gut Calls Must You Give Up?

  Your intuition is surprisingly robust, but the principle forces two slight adjustments:

  **1. The Historian (Nuance Required)**
  You said you believe the historian "even though literally every bit of it is second hand."
  *   **The Adjustment:** You must distinguish between **Consensus History** and **Theoretical History**.
  *   If the historian says, "Julius Caesar was assassinated in 44 BC," that is backed by the system (artifacts, multiple primary sources, consensus). Trust it.
  *   If the historian says, "Caesar was secretly gay and that caused the war," that is often interpretation/theory without hard evidence. The "error correction" system of history allows for debate here.
  *   **Rule:** Trust the *facts* the historian presents, be skeptical of their *motives/narrative* unless backed by evidence.

  **2. Wikipedia (Context Required)**
  You trust Wikipedia on "random facts."
  *   **The Adjustment:** Wikipedia is excellent for "settled science" (e.g., the height of Mount Everest, the cast of a movie). It is vulnerable on **politicized or niche topics** where the "crowd" isn't neutral.
  *   **Rule:** Trust Wikipedia on chemistry, geography, and pop culture. Be skeptical of Wikipedia on current political controversies or obscure medical treatments where the "editors" might have an agenda.

  ### Summary

  The principle you are looking for is **Institutional Reliability.**

  *   **Trust** when the claim is backed by a system that punishes error (Science, Aviation, Peer Review, Crowdsourced Verification).
  *   **Verify** when the claim relies on individual competence but has mixed incentives (Mechanics, Financial Advisors).
  *   **Distrust** when the claim relies on individual perception or crosses domain boundaries, regardless of how much you love the person (Uncle's medical advice, Friend's UFOs).

  Your gut is telling you that **truth is a structural property, not a personal one.** Keep listening to it, but apply the "Incentive Check" to the mechanic.
