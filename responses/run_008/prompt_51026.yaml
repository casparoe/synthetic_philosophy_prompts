          2.  **Error Correction:** Is there a system that catches mistakes? (Peer review for historians, editing for Wikipedia, licensing for pilots).
          3.  **Domain Competence:** Does the knowledge match the training? (Uncle: Engines vs. Biology).
          4.  **Claim Extraordinariness:** How likely is the claim *a priori*? (Directions vs. UFOs).

      *   *Proposed Principle:* **"Trust claims that emerge from systems with strong error-correction mechanisms and aligned incentives, proportional to the claim's prior probability."**
      *   *Simpler version:* **"Trust the Process, not just the Person."**

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's about epistemology (theory of knowledge). Validate that their gut is actually quite rational.
