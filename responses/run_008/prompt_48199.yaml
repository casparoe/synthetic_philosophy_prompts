prompt: |-
  I'm a retired physicist; for most of my career I worked in a metrology and instrument-calibration group, and a recurring duty was helping younger engineers turn vague ignorance into numbers. The house style, inherited from nobody in particular, was: if all you know is that a quantity lies between two bounds, call it uniform on the interval and propagate. Since retiring I have been reading philosophy of probability, and I've discovered that this habit sits on top of something much murkier than we ever admitted. The old "principle of indifference" — assign equal probabilities when you have no reason to prefer one value over another — turns out to depend on what quantity you spread your ignorance over: uniform in a resistance is not uniform in conductance, uniform in a radius is not uniform in the area, and there's the notorious business with the random chord of a circle where equally natural ways of being "random" give different probabilities for the same event. I've also gathered that there are ideas floating around for repairing this — invariance under reparameterization, transformation groups, picking the parameterization with the most natural symmetry — but I've never seen any of it written for someone with ten minutes and a specification sheet rather than an afternoon and a treatise.

  What I'd like from you is a decision procedure my former colleagues could actually follow before invoking uniform-in-the-interval. Concretely: an ordered list of questions to ask about a given problem — things like whether the bounds are hard physical limits or just spec-sheet convention, whether there's a natural reparameterization, whether anyone downstream of the number will make a decision whose cost is asymmetric — with, for each question, what counts as a clean answer, where a clean answer of the wrong kind should stop the procedure and send them back for more data rather than to a prior, and where the question is a genuine judgment call that no procedure can absorb (please mark those honestly rather than laundering them as steps). It should handle the hard cases explicitly: the situation where two competent engineers parameterize the same unknown differently and arrive at different failure probabilities, and the situation where indifference is being asked to do the work of a physical model because nobody measured anything. Then run the procedure on two worked examples: an unknown resistance known only from manufacturer tolerance bounds, where the choice between uniform-in-R and uniform-in-1/R changes the answer; and a shaft diameter known only within a machining tolerance, where what the customer actually cares about is the cross-sectional area. I'd especially like one of the worked examples to end somewhere the engineer won't like — where the honest output of the procedure is "your stated interval does not determine a probability, and pretending otherwise is the mistake" — and a closing statement of what the procedure cannot do, i.e., whether any such checklist can actually dissolve the reparameterization problem or only tell you when you're about to step in it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physicist, metrology/instrument-calibration background. Experienced in uncertainty quantification (UQ). Familiar with the "house style" of assuming uniform distributions on intervals (Type B evaluation in GUM terms).
      *   **Current Interest:** Philosophy of probability, specifically the Principle of Indifference (PoI) and its paradoxes (reparameterization invariance, Bertrand's chord, etc.).
      *   **The Problem:** The standard engineering practice (uniform on interval) is mathematically shaky (not invariant under transformation) but practically ubiquitous. Existing philosophical fixes (Jaynes' transformation groups, reference priors) are too abstract for a busy engineer with a spec sheet.
      *   **The Goal:** A practical *decision procedure* (checklist/flowchart) for engineers to use *before* invoking a uniform prior.
      *   **Requirements:**
          *   Ordered list of questions.
          *   Criteria for "clean answers."
          *   Stop conditions (go get more data vs. make a judgment call).
          *   Honest marking of judgment calls (no laundering).
          *   Handle hard cases (disagreement between engineers, indifference replacing physics).
          *   Two worked examples:
              1.  Resistor tolerance (Uniform-$R$ vs. Uniform-$G$).
              2.  Shaft diameter (Uniform-$d$ vs. Uniform-$A$).
          *   One example must conclude "you can't assign a probability here."
          *   Closing statement on limitations (does this dissolve the paradox or just warn about it?).
      *   **Tone:** Professional, respectful of expertise, pragmatic, philosophically honest, no hand-waving.

  2.  **Deconstruct the Core Conflict:**
      *   *Engineering Pragmatism:* "I need a number for the Monte Carlo simulation by 5 PM. The spec says $100\Omega \pm 5\%$. I'll use $U(95, 105)$."
      *   *Philosophical Rigor:* "Why $R$ and not $G=1/R$? If $R$ is uniform, $G$ is not. Which physical process generated this? Is it a sorting bin or a drift process?"
      *   *The Bridge:* We need a protocol that forces the engineer to think about the *generation mechanism* of the uncertainty, not just the *representation* of the uncertainty.

  3.  **Drafting the Decision Procedure (The "Metrologist's Indifference Protocol"):**
      *   *Step 1: Origin Story.* Where did the bounds come from? (Physical limit vs. Spec limit). This is crucial. A hard stop is a hard stop. A spec limit is a promise, not a physics law.
      *   *Step 2: The Downstream Loss Function.* How will this number be used? If the cost is asymmetric, the mean/mode matters more than the spread. If it's symmetric, maybe indifference is okay.
      *   *Step 3: The Generation Mechanism.* This is the Jaynesian bit. Is it a sorting process (binning)? A drift process? A quantization?
      *   *Step 4: Reparameterization Check.* If I change variables, does the physics change?
      *   *Step 5: The "Stop" Condition.* If the mechanism is unknown and the parameterization is arbitrary, admit ignorance.

  4.  **Refining the Steps (Iterative Polishing):**
      *   *Critique:* Make sure I distinguish between *aleatory* (random) and *epistemic* (ignorance) uncertainty, though engineers often blur them. The prompt focuses on epistemic ("vague ignorance").
      *   *Refinement:* Let's call it the "Interval-to-Distribution Protocol."
      *   *Key distinction:* Hard bounds (physics) vs. Soft bounds (specs).
      *   *Key distinction:* Additive noise vs. Multiplicative noise.
      *   *Judgment Calls:* Explicitly label them.

  5.  **Developing the Worked Examples:**
      *   *Example 1: Resistor.*
          *   Context: $100\Omega \pm 5\%$.
          *   Issue: $R$ vs $G$.
          *   Mechanism: Modern resistors are trimmed/lasered. The tolerance is a *binning* limit.
          *   Outcome: Uniform in $R$ is usually the industry convention because the *sorting* is done on $R$. But philosophically, if it's a drift process, log-uniform might be better.
          *   *Decision:* I need to make one example end in "Stop." Let's make the Resistor one the "Stop" case if we treat it as pure ignorance without knowing the manufacturing process. Or, better yet, make the *Shaft* one the "Stop" case regarding Area vs. Diameter, because Area is the physical property of interest for stress, but Diameter is the manufactured property.
          *   *Revision:* Let's follow the prompt's specific suggestion.
              *   Ex 1: Resistor ($R$ vs $1/R$). Let's show that without knowing the manufacturing process (trimming vs. deposition), we can't decide. *Verdict: Stop/Get Data.*
              *   Ex 2: Shaft Diameter ($d$ vs $A$). Customer cares about $A$ (stress), Machinist controls $d$. Tolerance is on $d$. *Verdict: Uniform on $d$ is defensible because the *process* controls $d$.*
              *   *Wait, re-reading prompt:* "I'd especially like one of the worked examples to end somewhere the engineer won't like — where the honest output of the procedure is 'your stated interval does not determine a probability...'"
              *   Okay, I will make the Resistor example the "Uncomfortable Stop." Why? Because without knowing if the tolerance comes from binning (Uniform $R$) or drift (Log-Uniform), assigning *any* distribution is guesswork.
              *   The Shaft example can be the "Pragmatic Success" but with caveats. The machinist controls $d$, so the error is additive on $d$. Uniform on $d$ is physically motivated, not just indifferent.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate the concern (Bertrand's Paradox is real). State the goal (harm reduction, not truth).
      *   **The Protocol:** 5 Steps.
          1.  Source of Bounds (Hard vs. Soft).
          2.  Downstream Loss (Symmetric vs. Asymmetric).
          3.  Physical Generation (Additive vs. Multiplicative).
          4.  Invariance Check (The "Jaynes" step).
          5.  The "Admit Defeat" Clause.
      *   **Marking Judgment Calls:** Use bold icons or text like `[JUDGMENT CALL]`.
      *   **Worked Example 1 (Resistor):** Show the $R$ vs $G$ conflict. Show that without manufacturing knowledge, PoI fails. Result: "Do not simulate."
      *   **Worked Example 2 (Shaft):** Show $d$ vs $A$. Machining is additive error on length. Customer cares about $A$. Transform the Uniform($d$) to $P(A)$. Result: "Valid, but not Uniform($A$)."
      *   **Closing Statement:** What can't this do? It can't create information. It can't solve Bertrand's paradox for you; it just tells you when you're facing it.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible (or explain it).
      *   Speak "Engineer-to-Engineer" but with the "Physicist's Conscience."
      *   Ensure the distinction between *state of knowledge* and *physical frequency* is clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "reparameterization" issue explicitly? Yes, in Step 4.
      *   *Check:* Is the "Stop" condition clear? Yes, Step 5.
      *   *Check:* Did I handle the "asymmetric cost" requirement? Yes, Step 2.
      *   *Check:* Is the Resistor example uncomfortable? Yes, concluding that standard practice is unjustified without process knowledge is uncomfortable.
      *   *Check:* Is the Shaft example clear? Yes, distinguishing control variable ($d$) from performance variable ($A$).

  9.  **Final Polish:** Ensure the formatting is clean (bolding, lists). Make sure the "Judgment Call" markers are visible. (Self-correction: Ensure I mention Jaynes/Transformation Groups briefly as the theoretical backing but keep the procedure practical).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a recognition that the "Type B" evaluation in the *Guide to the Expression of Uncertainty in Measurement* (GUM) often papers over a foundational crack. You are correct: the Principle of Indifference is not a law of nature; it is a encoding of ignorance that is not invariant under non-linear transformation. When an engineer assumes $R \sim U(R_{min}, R_{max})$, they are implicitly asserting a physical model of how that uncertainty arose, even if they think they are making no model at all.

  What follows is a **Metrologist's Indifference Protocol (MIP)**. It is designed not to solve the philosophical paradoxes, but to prevent them from contaminating a risk assessment. It forces the engineer to identify *why* the interval exists before assigning density to it.

  ### The Metrologist's Indifference Protocol (MIP)

  **Purpose:** To determine if a uniform probability density function (PDF) is a defensible encoding of an interval $[a, b]$, or if the problem requires more data or a different representation.

  #### Step 1: Source of Bounds (Hard vs. Soft)
  **Question:** Do the bounds $[a, b]$ represent a physical impossibility outside the range, or a specification limit?
  *   **Clean Answer (Hard):** "Physics forbids values outside $[a, b]$." (e.g., a probability, a geometric angle in a closed mechanism, a concentration that cannot exceed 100%).
  *   **Clean Answer (Soft):** "The manufacturer guarantees values within $[a, b]$, but outliers exist," or "We have no data outside this range."
  *   **Procedure:**
      *   If **Hard**: Proceed to Step 2. A truncated distribution is physically mandated.
      *   If **Soft**: **STOP.** A uniform distribution implies zero probability outside the bounds. If the bounds are soft (spec limits), a uniform prior assigns zero probability to failure modes that are merely unlikely.
      *   **Action:** Do not use a bounded uniform. Use a distribution with tails (e.g., Gaussian, Student's-t) truncated *or* scaled to match the confidence level of the spec. If you must use uniform, document that you are treating spec limits as hard physical limits, which is a conservative modeling assumption, not a statement of fact.

  #### Step 2: The Downstream Loss Function
  **Question:** How will the downstream calculation use this number? Is the cost of error symmetric?
  *   **Clean Answer:** "We are calculating a mean expected value where over-estimation and under-estimation cost the same."
  *   **Clean Answer:** "We are checking a safety margin where only one tail matters," or "The system response is highly non-linear (e.g., resonance)."
  *   **Procedure:**
      *   If **Symmetric/Linear**: Proceed to Step 3.
      *   If **Asymmetric/Non-linear**: **JUDGMENT CALL.** The choice of parameterization matters immensely here. A uniform distribution on input $x$ propagates differently than uniform on $f(x)$.
      *   **Action:** You cannot use indifference here. You must identify the *control variable*. If the loss depends on Area, but the manufacturing controls Diameter, you must assign the prior to Diameter and transform. Do not assign indifference to the variable of *interest*; assign it to the variable of *cause*.

  #### Step 3: The Generation Mechanism (Additive vs. Multiplicative)
  **Question:** What physical process created the uncertainty?
  *   **Clean Answer (Additive):** "Thermal noise," "Positioning error," "Quantization noise." (Errors sum up).
  *   **Clean Answer (Multiplicative):** "Gain drift," "Percentage tolerance," "Growth rates." (Errors scale).
  *   **Procedure:**
      *   If **Additive**: Uniform (or Gaussian) on the linear scale is defensible. $P(x) \propto 1$.
      *   If **Multiplicative**: Uniform on the linear scale is **incorrect**. Indifference should be applied to the logarithm. $P(x) \propto 1/x$ (Jeffreys Prior).
      *   **JUDGMENT CALL:** If the mechanism is unknown (e.g., "black box component"), you cannot answer this.
      *   **Action:** If unknown, proceed to Step 4. If known, parameterize in the domain of the mechanism (linear for additive, log for multiplicative) and apply uniform there.

  #### Step 4: The Reparameterization Check (The Bertrand Test)
  **Question:** If I transform the variable to its natural conjugate (Resistance $\to$ Conductance, Diameter $\to$ Area, Frequency $\to$ Period), does the uniform assumption hold?
  *   **Clean Answer:** "Yes, because the bounds are infinitesimally small," or "Yes, because the physics is linear in both."
  *   **Clean Answer:** "No. Uniform in $R$ implies non-uniform in $G$."
  *   **Procedure:**
      *   Calculate the Jacobian of the transformation. If the interval width $\Delta x$ is large enough that $J(x)$ varies significantly across it, the choice of parameterization changes the result.
      *   **Action:** If the results differ by more than your acceptable risk tolerance, you have encountered a Bertrand Paradox. **STOP.** You do not have enough information to assign a prior. You are substituting a mathematical convention for a physical model.

  #### Step 5: The "Admit Defeat" Clause
  **Question:** Have Steps 1–4 identified a unique, physically motivated parameterization?
  *   **Yes:** Propagate the uncertainty from that parameterization.
  *   **No:** **STOP.**
  *   **Action:** Report the quantity as an **Interval**, not a Distribution. State: *"The probability of failure cannot be calculated from tolerance bounds alone without a model of the manufacturing distribution."* Do not run the Monte Carlo.

  ---

  ### Worked Example 1: The Resistor (The Uncomfortable Stop)

  **Scenario:** A circuit design requires a $100\,\Omega$ resistor. The procurement spec is $100\,\Omega \pm 5\%$. The reliability engineer needs to calculate the probability that current exceeds a limit, which depends on conductance $G = 1/R$.
  **Standard Practice:** Assume $R \sim U(95, 105)$. Calculate $P(G < g_{crit})$.

  **Applying MIP:**

  1.  **Source of Bounds:** **Soft.** The $\pm 5\%$ is a commercial tolerance bin. Resistors outside this bin exist; they are just sold as different grades.
      *   *MIP Ruling:* A uniform distribution assigns $P(R < 95) = 0$. This is false. There is a non-zero probability of receiving an out-of-spec part (supplier quality error) or a part that drifts out of spec over time.
      *   *Correction:* We must treat this as a soft bound. However, for the sake of the paradox, let's assume we are analyzing a specific batch already measured to be in-spec. We proceed to Step 3.

  2.  **Generation Mechanism:** **Unknown.**
      *   Is the tolerance due to laser trimming (additive removal of material)? Or is it due to film deposition variance (multiplicative thickness variation)?
      *   If **Trimming**: Error is additive on $R$. Uniform on $R$ is plausible.
      *   If **Deposition**: Error is multiplicative on thickness $\to$ conductance. Uniform on $G$ (or Log-Uniform on $R$) is plausible.
      *   *MIP Ruling:* We do not know the manufacturing process. This is a **JUDGMENT CALL** masquerading as data.

  3.  **Reparameterization Check:**
      *   Case A: Assume $R \sim U(95, 105)$. Mean $R = 100$.
      *   Case B: Assume $G \sim U(1/105, 1/95)$. Mean $G \approx 1/100.08$.
      *   The implied mean resistance in Case B is $\approx 100.08\,\Omega$. The implied mean resistance in Case A is $100.00\,\Omega$.
      *   For a $\pm 5\%$ tolerance, the discrepancy in the mean is $\approx 0.08\%$. For a $\pm 50\%$ tolerance, the discrepancy is massive.
      *   *MIP Ruling:* Even at 5%, the distributions are not invariant.

  4.  **Admit Defeat:**
      *   We have Soft Bounds.
      *   We have an Unknown Generation Mechanism.
      *   We have Parameterization Sensitivity.
      *   **Conclusion:** **STOP.** You cannot calculate a failure probability here.
      *   **Report:** *"The probability of exceeding the current limit depends on whether the resistor tolerance arises from additive or multiplicative manufacturing processes. The spec sheet does not state this. Assigning a uniform distribution to Resistance is an arbitrary convention that yields a different result than assigning it to Conductance. Request manufacturing distribution data from the vendor, or perform a sensitivity analysis across the family of power-law priors $P(R) \propto R^\alpha$."*

  **Engineer's Reaction:** They will hate this. They want a number for the safety case. But the MIP correctly identifies that the number they want is a fiction.

  ---

  ### Worked Example 2: The Machined Shaft (The Pragmatic Success)

  **Scenario:** A steel shaft must fit into a bearing. The critical failure mode is shear stress, which scales with Cross-Sectional Area $A = \pi d^2 / 4$. The machinist provides a shaft with diameter $d = 10.00\,\text{mm} \pm 0.05\,\text{mm}$.
  **Standard Practice:** Assume $A \sim U(A_{min}, A_{max})$ because $A$ is what matters for stress.

  **Applying MIP:**

  1.  **Source of Bounds:** **Hard/Soft Hybrid.** The machinist cannot physically cut "negative tolerance" beyond the tool limit, but the $\pm 0.05$ is a target. Let's assume for this batch, parts outside are scrapped. We treat as Hard for the surviving batch.

  2.  **Downstream Loss:** **Asymmetric.** If $A$ is too small, shear stress fails the part. If $A$ is too large, it might not fit the bearing (interference). Both matter, but let's focus on the stress calculation.

  3.  **Generation Mechanism:** **Additive.**
      *   How is the uncertainty generated? The lathe tool has a positioning uncertainty. Thermal expansion of the metal is linear.
      *   The error is in the *length* dimension ($d$), not the *area* dimension. The machine does not "know" about area; it controls diameter.
      *   *MIP Ruling:* The physical noise is additive on $d$. Therefore, the indifference (or error distribution) belongs on $d$.
      *   **Decision:** Assign $d \sim U(9.95, 10.05)$.

  4.  **Reparameterization Check:**
      *   If we assigned $A \sim U(A_{min}, A_{max})$, we would be implying that the machine is equally likely to produce any *area*. Since $A \propto d^2$, this would imply the machine is more likely to produce smaller diameters (to pack equal area probability into the smaller $d$ range).
      *   This contradicts the physical mechanism (linear positioning error).
      *   *MIP Ruling:* Uniform on $A$ is physically unjustified. Uniform on $d$ is physically motivated.

  5.  **Admit Defeat:**
      *   We have identified the control variable ($d$).
      *   **Conclusion:** **PROCEED.**
      *   **Action:** Sample $d$ from $U(9.95, 10.05)$. Calculate $A = \pi d^2 / 4$ for each sample. Use the resulting distribution of $A$ for the stress analysis.
      *   **Report:** *"Uncertainty assigned to diameter based on machining tolerance. Area distribution is derived, not assumed. Note that the resulting Area distribution is not uniform; it is skewed toward larger areas."*

  **Engineer's Reaction:** They might be annoyed that the Area distribution isn't uniform (it makes the integration slightly harder), but they will accept it because it aligns with how the part is made.

  ---

  ### Closing Statement: What This Procedure Cannot Do

  This protocol does not dissolve the reparameterization problem. It does not provide a "true" prior where none exists. Jaynes' Transformation Groups and Reference Priors are mathematical attempts to formalize ignorance, but they remain subjective choices about *which* symmetries to respect.

  The MIP cannot tell you the probability of a unique event (like the failure of *this* specific bridge) based solely on interval bounds. It cannot turn epistemic uncertainty (ignorance) into aleatory uncertainty (frequency) without a physical model.

  **What it actually does:**
  1.  **It acts as a circuit breaker.** It stops the automatic conversion of "I don't know" into "Uniform Distribution."
  2.  **It shifts the burden.** It forces the engineer to defend the *parameterization*, not just the bounds. If they choose Uniform-$R$, they must defend why the physics is additive in Resistance rather than Conductance.
  3.  **It legitimizes "I don't know."** It provides a formal structure for saying, *"The interval is known, but the probability is not,"* which is a scientifically honest statement that prevents false precision in risk assessments.

  In your old group, you turned vague ignorance into numbers. This procedure asks you to sometimes leave the ignorance vague, because a precise number derived from a false symmetry is more dangerous than an interval with no density attached.
