  The wind hammered the corrugated steel of the records annex, a rhythmic drumming that made the kerosene lamp flicker. Outside, the Kazakh steppe was a void; inside, scattered files from the 1962 test lay across the metal table like autopsy photos.

  "It ran away," Volkov said, stirring the dregs of his tea. He was a big man, worn down by radiation counts and bureaucracy. "The physics dictates it. The thermal spike was too sharp for a simple sensor glitch."

  "The physics dictates a lot of things," Elena replied, pulling her coat tighter. She'd spent twenty years writing about people living in the shadow of disasters. "The archives burned. The witnesses are dead. By spring, this hole gets filled with concrete. So tell me, Volkov: if no one can ever check, does it matter?"

  "It matters because it's true," Volkov said. "Truth isn't a stamp we put on a belief when it's convenient. It's the destination. If you pushed inquiry far enough, if you had all the data, the community of scientists would settle on 'runaway.' That settlement is the truth. It exists now, even if we're too blind to see it."

  "That's a lovely metaphysical comfort," Elena said. "But inquiry isn't being pushed. It's being bulldozed. You're betting on a community of inquirers that might not exist. What if humanity fizzles out next century? Does your 'ideal limit' vanish with us? If there's no one left to settle the opinion, your truth is just a ghost."

  "No," Volkov said firmly. "Reality constrains us. You can wish the core didn't melt, but the radiation isotopes don't care about your wishes. The truth is what *would* be believed, not what *is* believed. Even if the universe ends, the proposition 'the core melted' remains fixed by the laws that governed it. The limit is ideal, not temporal."

  "But truths are made, not just found," Elena countered. "An idea becomes true in the course of being verified. If this belief never verifies—if it makes no concrete difference in experience—it's dead weight. Consider the alternative. The Ministry prefers the 'instrument failure' story. It lets the locals sleep. It avoids panic. It gets the site sealed safely without budget fights. If believing the instrument failed leads to better outcomes, isn't that the truer belief?"

  "That's expediency, not truth," Volkov snapped. "A belief can feel deeply satisfying and still be false. If you tell them it's safe based on a lie, and the ground is hot, you're not helping them. You're just delaying the pain. Truth is what survives the test, not what soothes the patient."

  "Am I soothing them, or am I preventing a useless panic over a fact we can't change?" Elena leaned forward. "You're chasing a ghost. William James once talked about a man chasing a squirrel around a tree. The man tries to see the squirrel, the squirrel keeps the trunk between them. Does the man go round the squirrel? Depends entirely on what you mean by 'round.' Are we arguing about the physics, or are we arguing about what we're allowed to say before the bulldozers come? If we define truth as 'what works,' the Ministry's story works. If you define it as 'what matches the invisible past,' yours wins. But who cares?"

  Volkov paused. The wind howled outside the thin metal walls. "You're suggesting the definition of truth is the squirrel."

  "I'm suggesting that if your truth doesn't cash out in experience, it's just noise," Elena said. "The only difference this belief makes today is whether the bulldozing plan gets an extra review step. That's the concrete difference. That's the meaning."

  "But if the ground is hot," Volkov said, softer now, "and you skip the review... the consequences become concrete later. Reality forces itself back in. I concede that without inquiry, truth is inert. It loses its power to guide. A truth nobody can know is practically useless. But I cannot concede that comfort makes it real. If we lie about the heat, the heat wins eventually."

  Elena sighed, looking at the scattered papers. "And I concede that wishing doesn't melt isotopes. If the review step costs nothing, we should take it. Not because it's 'True' with a capital T, but because the risk of being wrong is too high to ignore. The utility of your truth is that it keeps us honest, even if we can't prove it."

  "So we agree on the action," Volkov said. "Extra review."

  "We agree on the action," Elena said. "Just don't ask me to worship the truth that got us here."

  "I worship the method," Volkov said, closing the file. "Not the conclusion."
