      "It ran away," Volkov said, stirring the dregs of his tea. "The physics dictates it."
      "The physics dictates a lot of things," Elena replied, pulling her coat tighter. "The archives burned. The witnesses are dead. By spring, this hole gets filled with concrete. So tell me, Volkov: if no one can ever check, does it matter?"

      "It matters because it's true," Volkov said. "Truth isn't a stamp we put on a belief when it's convenient. It's the destination. If you pushed inquiry far enough, if you had all the data, the community of scientists would settle on 'runaway.' That settlement is the truth. It exists now, even if we're too blind to see it."

      "That's a lovely metaphysical comfort," Elena said. "But inquiry isn't being pushed. It's being bulldozed. You're betting on a community of inquirers that might not exist. What if humanity fizzles out next century? Does your 'ideal limit' vanish with us?"

      "No," Volkov said firmly. "Reality constrains us. You can wish the core didn't melt, but the radiation isotopes don't care about your wishes. The truth is what *would* be believed, not what *is* believed. Even if the universe ends, the proposition 'the core melted' remains fixed by the laws that governed it."

      "But truths are made, not just found," Elena countered. "An idea becomes true in the course of being verified. If this belief never verifies—if it makes no concrete difference in experience—it's dead weight. The Ministry prefers the 'instrument failure' story. It lets the locals sleep. It avoids panic. It gets the site sealed safely. If believing the instrument failed leads to better outcomes, isn't that the truer belief?"

      "That's expediency, not truth," Volkov snapped. "A belief can feel deeply satisfying and still be false. If you tell them it's safe based on a lie, and the ground is hot, you're not helping them. You're just delaying the pain."

      "Am I?" Elena leaned forward. "Or are you chasing a ghost? William James once talked about a man chasing a squirrel around a tree. The man tries to see the squirrel, the squirrel keeps the trunk between them. Does the man go round the squirrel? Depends entirely on what you mean by 'round.' Are we arguing about the physics, or are we arguing about what we're allowed to say before the bulldozers come?"

      Volkov paused. The wind howled outside the thin metal walls. "You're suggesting the definition of truth is the squirrel."

      "I'm suggesting that if your truth doesn't cash out in experience, it's just noise," Elena said. "The only difference this belief makes today is whether the bulldozing plan gets an extra review step. That's the concrete difference. That's the meaning."

