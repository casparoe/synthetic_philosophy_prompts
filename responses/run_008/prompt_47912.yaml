      Elena sighed, looking at the scattered papers. "And I concede that wishing doesn't melt isotopes. If the review step costs nothing, we should take it. Not because it's 'True' with a capital T, but because the risk of being wrong is too high to ignore."

      "So we agree on the action," Volkov said. "Extra review."

      "We agree on the action," Elena said. "Just don't ask me to worship the truth that got us here."

      "I worship the method," Volkov said. "Not the conclusion."

