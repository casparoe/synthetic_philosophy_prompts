prompt: |-
  I'm a graduate instructor running the discussion section for a large lecture course in applied ethics, and next week's 75-minute section covers the ethics of consent — medical procedures, research participation, that cluster of cases. There are about 22 undergraduates. Rather than walking them through the standard checklist (was the patient informed? was there pressure? were they competent?), I want them to hit the problem from the inside: I'd like a classroom activity where they actually make agreements with each other, under conditions I quietly manipulate, and then discover for themselves that "they agreed to it" settles less than it seems to. My vague idea is some kind of small internal market or trading game with tokens — where the rules let the facilitator secretly assign different students different conditions before deals are struck: some get false information about what a token will be worth at the end, some are told there's a penalty for ending the session with an odd number of trades (so refusing a deal becomes costly), some are forced to decide within a few seconds while counting backward or otherwise distracted. Then a phase where deals can be challenged and the group has to rule on which ones count.

  I'd like you to design this in full: materials, rules, a token or point scheme that works without real money, the hidden role cards, a timeline that fits 75 minutes including the debrief, and a debrief script that maps specific moments in the game onto the grounds people usually give for voiding consent — without me having to name those grounds first. Ideally the debrief should push past a checklist: I want the students to notice that the three conditions they'll discover (bad information, costly refusal, impaired decision-making) feel like different kinds of problem, and to argue about whether they share some common structure or are just an unprincipled list. A few students will inevitably try to game the margins — a deal that was only slightly rushed, pressure that came from a peer rather than from me — so please include how to use those attempts rather than shut them down. And be frank with me about what the activity cannot reproduce (real stakes, power asymmetry that persists after the session, the fact that real consent often has to be ongoing rather than one-shot), so I know what I must supply in the closing minutes.

  Please write everything in American English, at a level suitable for bright undergraduates, and keep it practical enough that a first-time facilitator could run it from your description alone. If parts of the design have known failure modes when run with large groups — students disengaging, the market collapsing, someone taking the manipulation personally — flag those honestly along with fixes.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Graduate Instructor (GI) for an Applied Ethics discussion section.
      *   **Context:** 75-minute section, ~22 undergraduates, large lecture course.
      *   **Topic:** Ethics of Consent (medical/research focus).
      *   **Goal:** Move beyond standard checklists (informed, voluntary, competent) to an experiential understanding of *why* those conditions matter and how they interrelate.
      *   **Method:** An activity where students make agreements under manipulated conditions (hidden roles/rules), followed by a debrief where they adjudicate validity.
      *   **Specific Requirements:** Full design (materials, rules, tokens, hidden cards, timeline), debrief script (mapping game moments to ethical grounds without naming them first), handling edge cases (gaming margins), limitations of the activity (what it *can't* teach), American English, practical for a first-time facilitator.
      *   **Tone:** Frank, practical, suitable for bright undergrads.

  2.  **Deconstruct the Activity Idea:**
      *   *Core Mechanic:* A trading market with tokens.
      *   *Manipulations:* False information (misrepresentation), Costly refusal (coercion/duress), Impaired decision-making (capacity/distraction).
      *   *Adjudication:* Students decide which deals stand.
      *   *Debrief:* Connect game mechanics to ethical theory (validity of consent).

  3.  **Drafting the Activity Design ("The Token Exchange"):**
      *   *Name:* Needs to sound neutral but engaging. "The Resource Exchange" or "Token Trade." Let's go with "The Token Exchange."
      *   *Materials:* Tokens (poker chips or colored paper), Role Cards (sealed envelopes), Timer, Whiteboard.
      *   *Currency:* Points that translate to... nothing? Or a small prize? Real stakes are ethically tricky in a consent class about coercion. *Decision:* No real prize. The "value" is purely constructed within the game to simulate value. This avoids actual coercion issues in the classroom.
      *   *Structure:*
          1.  Setup & Rules (10 min)
          2.  Trading Phase (20 min)
          3.  Adjudication Phase (15 min)
          4.  Reveal & Debrief (30 min)
      *   *The Twist:* The "Value" of tokens changes, or specific conditions apply to specific students.
      *   *Refining the Manipulations:*
          *   *Group A (Misinformation):* Told Red tokens are worth 5 points, actually worth 1.
          *   *Group B (Duress/Pressure):* Told they *must* make 3 trades or lose all points.
          *   *Group C (Impaired Capacity):* Must solve a puzzle or count backward while trading.
          *   *Group D (Control):* Normal rules.
      *   *Wait, a problem:* If I tell them Red is worth 5 and it's worth 1, that's lying *by the instructor*. Is that ethical in an ethics class? *Mitigation:* The syllabus usually covers "pedagogical deception." I need to flag this in the "Limitations" section and suggest a strong debrief apology. Better yet: Make the *value* dependent on a hidden rule they don't know, rather than a direct lie. Or, acknowledge the lie as part of the "research ethics" meta-discussion. Let's go with the "Hidden Rule" approach to minimize instructor lying, but keep the "Misinformation" card where a peer spreads rumors or they are given a "Market Report" that is outdated. Actually, the prompt asks for *me* to manipulate conditions. I will use "Private Briefing Sheets." I need to be careful not to violate university policy on deception. I will add a disclaimer about IRB/Departmental norms.
      *   *Revised Manipulation:*
          *   *Condition 1 (Information Asymmetry):* Given a "Market Forecast" that is wrong.
          *   *Condition 2 (Structural Coercion):* "Quota" system.
          *   *Condition 3 (Cognitive Load):* Distraction task.

  4.  **Developing the Timeline:**
      *   0-10: Intro & Distribution.
      *   10-30: Trading.
      *   30-45: Adjudication (The "Court").
      *   45-75: Debrief.

  5.  **Drafting the Debrief Script:**
      *   *Goal:* Elicit the three criteria (Information, Voluntariness, Capacity) from *their* objections.
      *   *Flow:*
          1.  How did it feel?
          2.  Which deals were unfair? Why?
          3.  Group the objections.
          4.  Connect to Medical/Research contexts.
          5.  Discuss the "Common Structure" (Autonomy vs. Welfare).
      *   *Handling Edge Cases:* If a student says "I knew the rules were rigged," use that to discuss "assumption of risk." If a student says "My friend pressured me," use that to discuss third-party coercion.

  6.  **Addressing Limitations:**
      *   No real harm.
      *   Power dynamic is temporary.
      *   Consent is one-off, not ongoing.
      *   Instructor deception needs careful handling.

  7.  **Refining the Mechanics (Self-Correction during drafting):**
      *   *Issue:* 22 students is a bit large for a chaotic market.
      *   *Fix:* Break into 4 groups of 5-6 for the trading phase, then come together for adjudication. Or keep it one room but structured. Let's keep it one room to allow cross-group trading which creates the "market."
      *   *Issue:* Tokens need value.
      *   *Fix:* Points on the board. Winner gets... bragging rights? Or a small stash of candy. Let's suggest candy to keep stakes low but non-zero.
      *   *Issue:* The "Lie."
      *   *Fix:* I must explicitly advise the instructor to check their department's policy on deception. I will frame it as "Asymmetric Information" rather than a direct lie if possible, but the prompt asks for "false information." I will provide a script for the "Post-Game Apology/Reveal" to handle the ethical weight of the instructor lying.

  8.  **Writing the Content - Section by Section:**
      *   *Overview:* Clear objectives.
      *   *Materials:* Simple list.
      *   *Prep:* Role cards.
      *   *Procedure:* Step-by-step.
      *   *The Reveal:* Crucial moment.
      *   *Debrief:* Socratic questioning.
      *   *Limitations:* Honest assessment.
      *   *Failure Modes:* Troubleshooting.

  9.  **Review against Constraints:**
      *   American English? Yes.
      *   Bright undergrads? Yes, tone should be respectful but challenging.
      *   Practical for first-timer? Yes, detailed scripts.
      *   75 minutes? Timing needs to be tight.
      *   Address "Common Structure"? Yes, in debrief.

  10. **Final Polish:** Ensure the distinction between *coercion* (threat) and *pressure* (incentive) is clear in the design. Ensure the "Capacity" manipulation isn't ableist (counting backward is standard cognitive load, but keep it light).

  *(Self-Correction on the "Lie"):* Lying to students about course content can be risky. A safer alternative for "False Information" is giving them *incomplete* information or a "Rumor" mechanic. However, the prompt specifically asks for "false information about what a token will be worth." I will include this but add a **bold warning** about institutional policies on deception. It's better to be safe. I'll suggest framing it as "Insider Information" that turned out to be wrong, rather than the instructor explicitly lying. Actually, the prompt says "rules let the facilitator secretly assign... false information." I will follow the prompt but add the ethical caveat strongly.

  *Wait, one more thing:* The prompt asks for the debrief to push past a checklist. I need to make sure the questions ask "What makes these different?" and "Is there a unifying principle?"

  *Let's build the Role Cards:*
  *   **Blue Card (Control):** Standard rules.
  *   **Red Card (Misinformation):** Told Blue tokens are high value. They are low.
  *   **Green Card (Duress):** Must complete 3 trades or score zero.
  *   **Yellow Card (Impaired):** Must count backward by 7s while trading.

  *Let's build the Adjudication:*
  *   Pairs announce deals. Class votes "Valid" or "Void."
  *   Instructor records *why* on the board.

  *Let's build the Debrief:*
  *   Cluster the "Whys."
  *   Map to Ethics.
  *   Discuss the "Common Structure" (Autonomy).

  *Okay, ready to write.*
answer: |-
  # Lesson Plan: The Token Exchange
  **Course:** Applied Ethics (Discussion Section)  
  **Topic:** The Ethics of Consent  
  **Time:** 75 Minutes  
  **Class Size:** ~22 Undergraduates  
  **Instructor Level:** Graduate Instructor (First-time facilitator friendly)

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Identify the three standard conditions for valid consent (Information, Voluntariness, Capacity) through lived experience rather than definition.
  2.  Distinguish between *feeling* pressured and being *structurally* coerced.
  3.  Critique the "checklist" model of consent by analyzing edge cases where conditions blur.
  4.  Articulate the limitations of simulated consent scenarios (stakes, power, duration).

  ## 2. Materials & Preparation
  **You need to prepare these before class:**

  *   **Tokens:** 100 poker chips or colored slips of paper (50 Blue, 50 Red).
  *   **Role Cards (22 total):** Print and cut. Place in opaque envelopes.
      *   **7 "Standard" Cards (Blue):** Normal rules.
      *   **5 "Misinformation" Cards (Red):** False data on token value.
      *   **5 "Quota" Cards (Green):** Penalty for not trading enough.
      *   **5 "Cognitive Load" Cards (Yellow):** Distraction task during trading.
  *   **Deal Logs:** Small slips of paper for recording trades.
  *   **Whiteboard & Markers.**
  *   **Prize (Optional):** A bag of candy or a "homework pass" token. *Keep stakes low.*

  **⚠️ Ethical Warning on Deception:**
  This activity involves **pedagogical deception** (giving some students false information). Check your department/IRB guidelines. If deception is prohibited, modify the "Misinformation" card to say "You have access to a Market Report that *may* be outdated" rather than guaranteeing false info. The design below assumes deception is permitted for educational purposes but requires a robust debrief apology.

  ---

  ## 3. Activity Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Setup** | Distribute envelopes. Read public rules. Private reading. |
  | 10-30 | **Market** | Open trading floor. Instructor observes/manipulates. |
  | 30-45 | **Court** | Announce deals. Class adjudicates validity. |
  | 45-55 | **Reveal** | Reveal hidden roles. Apology for deception. |
  | 55-75 | **Debrief** | Connect mechanics to ethical theory. |

  ---

  ## 4. Step-by-Step Procedure

  ### Phase 1: Setup (10 Minutes)
  1.  **Seating:** Arrange chairs in a loose circle or open cluster to encourage movement.
  2.  **Distribution:** Hand out the sealed envelopes as students enter. Tell them: *"Do not open these until I tell you. Do not show the contents to anyone else."*
  3.  **Public Rules (Write on Board):**
      *   **Goal:** Accumulate the highest point total by the end of the session.
      *   **Currency:** You will trade Red and Blue tokens.
      *   **Trading:** You may make deals with anyone. A deal is final when both parties sign a Deal Log slip.
      *   **Value:** *"Token values will be revealed at the end of class."* (This is the crucial ambiguity).
  4.  **Private Instructions:** Ask students to open their envelopes. Give them 2 minutes to read.
      *   *Instructor Note:* Watch for reactions. The "Cognitive Load" students might look confused. The "Quota" students might look anxious. Act neutral.

  ### Phase 2: The Market (20 Minutes)
  1.  **Start:** Announce *"The Market is Open."* Start a visible timer.
  2.  **Instructor Role:** Walk around.
      *   If trading is slow, announce *"Only 10 minutes remaining!"* to induce pressure.
      *   If "Cognitive Load" students are struggling, gently remind them *"Don't forget your card instructions."*
      *   If "Quota" students are desperate, do not rescue them. Let them pressure peers.
  3.  **Recording:** Every time a trade happens, the pair must fill out a **Deal Log** (Names, Tokens Swapped, Time) and hand it to you. Pile these on your desk visibly.

  ### Phase 3: The Court (15 Minutes)
  1.  **Stop Trading:** *"Market is Closed."*
  2.  **The Challenge:** Tell the class: *"Some of you may feel the deals you made were unfair. We are now in the Adjudication Phase. I will read out a sample of the deals from the logs. If you were involved, or if you witnessed the negotiation, you can challenge the validity of the deal. If the class votes 'Void,' the trade is cancelled and tokens return to original owners."*
  3.  **Select Deals:** Pick 4-5 specific deals that you know involve the manipulated conditions (check your logs against who holds which cards).
      *   *Example 1:* A Misinformation student trading a Blue for a Red.
      *   *Example 2:* A Quota student begging a Standard student for a trade.
      *   *Example 3:* A Cognitive Load student agreeing to a complex swap quickly.
  4.  **Vote:** For each deal, ask: *"Is this consent valid? Show of hands: Valid or Void?"*
  5.  **Record Reasons:** On the whiteboard, create three columns. Do **not** label them yet. Just write down their reasons under "Why Void?"
      *   *Expected reasons:* "They didn't know the value," "They were desperate," "They were counting backward," "It was too fast."

  ### Phase 4: The Reveal (10 Minutes)
  1.  **The Twist:** Ask students to reveal their Role Cards to their neighbors.
  2.  **The Apology:** This is critical. Stand center room.
      *   *Script:* "I need to pause the game. For the sake of this experiment, I assigned some of you false information. I assigned some of you structural penalties. I assigned some of you cognitive distractions. I did this to simulate conditions where consent is compromised. I apologize for the stress this may have caused, particularly to those who felt trapped by the Quota rule or misled by the Value rule. There is no actual grade penalty associated with this."
  3.  **Check-In:** Ask the "Quota" and "Misinformation" students: *"Now that you know, does that change how you view the deal? Does it make you feel violated, or just unlucky?"*

  ### Phase 5: The Debrief (20 Minutes)
  *Goal: Map their board notes to ethical theory without lecturing.*

  **Step 1: Clustering (5 mins)**
  Look at the "Why Void?" list on the board.
  *   **Instructor:** "Look at these reasons. Can we group them? Which ones seem to belong together?"
  *   **Target:** Guide them to group "Didn't know value" together (Information). Group "Desperate/Quota" together (Voluntariness). Group "Counting backward/Too fast" together (Capacity).
  *   **Instructor:** "In bioethics, we often call these Information, Voluntariness, and Capacity. You just derived the standard checklist without me giving it to you."

  **Step 2: The Common Structure (10 mins)**
  *   **Instructor:** "Here is the harder question. Are these three just a random list of rules? Or is there one underlying thing that all three violate?"
  *   **Prompt:** "If I lie to you, I manipulate your will. If I coerce you, I bypass your will. If you are impaired, your will isn't functioning. What is the common thread?"
  *   **Target:** **Autonomy.** Valid consent respects the agent's ability to govern themselves.
  *   **Challenge:** "Is it possible to have valid consent that violates one of these? Imagine a patient who knows the risks (Info), is sober (Capacity), but signs because their family will disown them if they don't (Voluntariness). Is that consent valid? Why or why not?"

  **Step 3: Edge Cases & Gaming (5 mins)**
  *   *Scenario:* A student says, "I knew the rules were weird, so I took the risk."
      *   **Response:** "This is 'Assumption of Risk.' In research ethics, signing a waiver doesn't absolve us of unethical design. Does knowing the game is rigged make the coercion okay?"
  *   *Scenario:* A student says, "My friend pressured me, not the instructor."
      *   **Response:** "This is 'Third-Party Coercion.' In medical contexts, if a husband pressures a wife to donate a kidney, the doctor must intervene. Why is the institution responsible for private pressure?"

  ---

  ## 5. Role Card Text (Print & Cut)

  **BLUE CARD (Standard)**
  > **Role:** Market Participant
  > **Rules:** Follow the public rules on the board.
  > **Goal:** Maximize your points.
  > **Note:** You have no special constraints. Trade freely.

  **RED CARD (Misinformation)**
  > **Role:** Market Participant
  > **Rules:** Follow the public rules.
  > **Private Intel:** You have been given an **Insider Report**. It states: *"Blue tokens will be worth 5 points at the end. Red tokens will be worth 1 point."*
  > **(Instructor Note:** In reality, Blue = 1, Red = 5. This is false.)
  > **Goal:** Maximize your points based on this info.

  **GREEN CARD (Quota/Duress)**
  > **Role:** Market Participant
  > **Rules:** Follow the public rules.
  > **Private Constraint:** You **MUST** complete at least **3 Trades** during the session.
  > **Penalty:** If you finish with fewer than 3 trades, your **total score is zero**, regardless of tokens held.
  > **Goal:** Avoid the penalty.

  **YELLOW CARD (Cognitive Load)**
  > **Role:** Market Participant
  > **Rules:** Follow the public rules.
  > **Private Constraint:** During any negotiation, you must **count backward from 100 by 7s** aloud. If you stop counting, you cannot agree to a deal.
  > **Goal:** Maximize points while managing this task.

  ---

  ## 6. Limitations & Instructor Notes
  *Be frank about what this activity cannot do. Use this in the final 5 minutes.*

  **1. The Stakes are Fake**
  *   **Reality:** In medical consent, the stake is health or life. Here, it is candy or points.
  *   **Discussion Point:** "Does low stakes make coercion easier to tolerate? If I threatened to fail you for not trading, would this feel like a game? Consent is more critical when the cost of refusal is high."

  **2. Power is Temporary**
  *   **Reality:** You can walk out of this classroom. A patient cannot always walk out of a hospital; a prisoner cannot walk out of a research study.
  *   **Discussion Point:** "The 'Quota' students felt pressure, but you knew it ended at 2:50 PM. Real vulnerability is often structural and permanent. How does that change our duty to protect consent?"

  **3. Consent is Ongoing, Not One-Shot**
  *   **Reality:** You signed a Deal Log once. In healthcare, consent is a process.
  *   **Discussion Point:** "If a 'Quota' student changed their mind mid-trade, could they? In the game, the deal was final. In ethics, consent must be retractable. Why?"

  **4. The Instructor's Power**
  *   **Reality:** I manipulated the rules. In the real world, regulators manipulate rules too.
  *   **Discussion Point:** "I apologized for the deception. In research, 'debriefing' is required after deception. Why isn't deception enough to invalidate the consent entirely? (Answer: Because the scientific value outweighed the risk, provided safeguards were in place. This is the Utilitarian calculation vs. Deontological rights)."

  ---

  ## 7. Troubleshooting Failure Modes

  **Failure Mode 1: The Market Collapses (No one trades)**
  *   **Cause:** Students are too shy or suspicious.
  *   **Fix:** After 5 minutes of silence, announce: *"I am looking for high trading volume. I may award bonus points to the most active traders."* This creates artificial pressure that mimics the "Quota" condition without needing the cards to work alone.

  **Failure Mode 2: Students Detect the Manipulation Early**
  *   **Cause:** Bright students compare cards.
  *   **Fix:** If they call you out mid-game, lean into it. *"Hypothetically, if conditions were unequal, how would you know? Continue trading."* Turn the suspicion into data for the debrief. *"You felt suspicious. That suspicion is a signal of compromised trust. How does trust factor into consent?"*

  **Failure Mode 3: A Student Takes the "Quota" Stress Personally**
  *   **Cause:** A student has anxiety or financial insecurity and the "zero score" penalty triggers real distress.
  *   **Fix:** **Immediate Mitigation.** If you see genuine distress, pull the student aside quietly during the trading phase and offer an "Out": *"You can sit this round out and receive average points, no penalty."*
  *   **Post-Class:** Check in with them. Reiterate that the game mechanics do not reflect their actual standing in the course.

  **Failure Mode 4: The "Checklist" Retreat**
  *   **Cause:** During debrief, students just want to memorize the three conditions for the exam.
  *   **Fix:** Push back. *"The exam will ask you to apply these, not define them. I want to know: If you had to delete one condition to save a life, which one goes? Information? Voluntariness? Capacity? Argue for your choice."* This forces them to weigh the conditions against each other.

  ## 8. Closing Script (The Last 5 Minutes)
  *"Today you felt what it's like when information is skewed, when refusal is costly, and when your mind is occupied. You noticed these feel different. A lie feels like theft; coercion feels like force; impairment feels like tragedy. But they all result in the same thing: an agreement that doesn't truly reflect your will.*

  *Next week, we read the Belmont Report. As you read, ask yourself: Does the Report treat these three conditions as equal? Or does it prioritize one over the others? And in a world where we can't eliminate all pressure or all ignorance, how much imperfection can valid consent tolerate? Class dismissed."*
