  *(Refining the Recommendation)*: The prompt suggests a hybrid like "renaming the street while relocating the name to the city museum." I will adopt this. It respects the "Record" impulse without violating the "Compulsory Speech" principle.

  *(Drafting the "Losing Side" section)*: I need to make sure I don't strawman the retentionists. Their argument is about historical literacy and the danger of sanitizing the past. I need to articulate that fear genuinely.

