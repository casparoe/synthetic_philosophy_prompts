  6.  **Final Polish:**
      *   Check tone: Is it bureaucratic yet moral?
      *   Check constraints: Did I answer all three questions? Yes. Is there a strong losing side paragraph? Yes. Is the settled/contested section included? Yes.

  7.  **Final Review against the Prompt:**
      *   *Memo format?* Yes.
