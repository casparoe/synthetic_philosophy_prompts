answer: |-
  **MEMORANDUM**

  **TO:** The Commemorative Names Review Panel
  **FROM:** [Your Name/Chair], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Designation of Cobb Avenue

  **I. PURPOSE**

  This memo serves to break the current deadlock regarding the designation of Cobb Avenue. As noted in our previous sessions, the case of Hollis Cobb presents a conflict between his tangible contributions to municipal infrastructure (water, parks, civil service) and his authorship of racial zoning ordinances and neighborhood clearances. The avenue in question traverses land emptied by that clearance, and descendants of the displaced remain in the vicinity.

  Our deliberations have stalled on three philosophical thresholds. This memo takes a definitive position on each to facilitate a final vote and recommendation to the City Council.

  **II. ANALYSIS OF THRESHOLD QUESTIONS**

  **1. The Honorific Question (The "Stranger Test")**
  *Position: The "Stranger Test" is unsound; forgetting is not neutrality.*

  The proposal that a name ceases to honor if the public cannot identify the namesake relies on a theory of commemoration as explicit biography. This is incorrect. Public naming is not merely a label; it is a signal of belonging and power. Even if a resident under forty does not know Hollis Cobb's name, the persistence of the name signals that the history of the street is settled, stable, and authorized by the state.

  For the descendants of the displaced families, the name is not an inert signifier. It is a continuous reminder that the ground beneath them was acquired through racial exclusion. To argue that ignorance neutralizes this harm is to suggest that the injury of dispossession expires once the general public forgets the dispossessor's name. We reject this. The remedy for a "dead" name that carries living trauma is not re-education to make the honor "active" again, but removal to cease the state's endorsement of the legacy. Ignorance of the name's origin does not stop the name from functioning as a boundary marker.

  **2. The Record Question (Interpretive Installation vs. Compulsory Speech)**
  *Position: A street is not a document; it is compulsory speech.*

  The Historical Society's analogy—that a street is a document we should not rewrite—fails to account for the phenomenology of an address. A document is something one chooses to read. A street name is something one is required to speak, type, and inhabit. Every time a resident orders goods, calls emergency services, or invites guests, they invoke Hollis Cobb.

  An interpretive installation is passive; it is encountered only by those who seek it out. The street name is active and unavoidable. To place a plaque explaining the racial clearance while retaining the name creates an ethical asymmetry: it forces the descendants of the displaced to navigate a landscape that daily invokes their displacer, while offering the general public the option to ignore the context. We cannot treat a thoroughfare as an archive. Archives are for study; streets are for living. When the two conflict, the right to live without compelled invocation of a oppressor outweighs the desire to keep the "document" intact.

  **3. The Divisibility Question (Pro Tanto Honor)**
  *Position: Public honor is not divisible when the harms are foundational.*

  The proposal to honor Cobb for his water works while disclaiming his zoning assumes that a public legacy can be compartmentalized. In the context of municipal leadership, it cannot. Cobb's "proudest achievement" was the clearance; the infrastructure he built often relied on the land and political capital gained through that clearance.

  To place a plaque that says "Cobb built our parks, but also cleared our neighborhoods" does not split the honor; it highlights the contradiction. Public commemoration is holistic. It asks, "Is this person a representative figure for our civic values?" Because Cobb explicitly prioritized racial exclusion over equitable development, and because the street in question is the physical site of that exclusion, we cannot honor the man *pro tanto*. To keep the name is to endorse the totality of the tenure, implying that the water works outweigh the human cost of the clearance. We find that they do not.

  **III. RECOMMENDATION**

  Based on the positions above, the Panel recommends **Full Renaming of Cobb Avenue**, coupled with a **Contextual Relocation**.

  1.  **Renaming:** The street shall be renamed. The new name should be selected through a prioritized process involving the descendants of the displaced families and current residents.
  2.  **Relocation:** The name "Cobb" shall not be erased from history but removed from the realm of compulsory speech. The City will transfer the existing street signage and a comprehensive archive of Cobb's tenure (including his own correspondence regarding the clearance) to the City Museum. There, the name will be retained in an exhibit titled "Infrastructure and Exclusion," where it can be studied as history rather than inhabited as address.

  **IV. IMPLEMENTATION SCHEDULE**

  *   **Phase 1 (Months 1-3):** Community Consultation. The City will host three town halls specifically with descendants of the cleared neighborhoods to propose naming criteria (e.g., naming after a displaced family, a concept of restoration, or a local civil rights figure).
  *   **Phase 2 (Months 4-6):** Selection and Approval. Panel submits top three choices to City Council. Council votes.
  *   **Phase 3 (Months 7-9):** Fabrication and Notification. New signage fabricated. USPS, Emergency Services, and Utility companies notified of address changes. Costs absorbed by the Municipal Budget (no assessment on current homeowners).
  *   **Phase 4 (Month 10):** Unveiling and Transfer. Old signage removed and transferred to the City Museum. New signage installed. Museum exhibit opens concurrently.

  **V. CONSIDERATION OF THE LOSING POSITION**

  We must acknowledge the strength of the argument for retention. The case for keeping the name rests on the principle that a city must confront its history, not sanitize it. Retentionists argue that removing Cobb's name risks creating a "clean" history where the difficult truths of the Progressive Era are hidden away in museums, accessible only to those who look for them. There is a genuine fear that renaming allows the current citizenry to feel morally absolved without having to engage with the uncomfortable reality that they benefit daily from Cobb's water system and parks, which exist alongside his racist legacy. By keeping the name and adding a robust installation, the city would force every resident to confront the duality of civic progress: that public goods often come at a private, marginalized cost. To remove the name is, in this view, to let the city off the hook, allowing it to pretend the injustice is gone simply because the sign is changed. This is a serious ethical concern: that renaming may prioritize the comfort of the offended over the education of the oblivious.

  **VI. EPISTEMOLOGICAL NOTE: SETTLED VS. CONTESTED GROUND**

  In finalizing this memo, it is vital to distinguish where our reasoning rests on established ethical consensus and where it enters contested theoretical ground.

  *   **Broad Agreement:** There is near-consensus among scholars of commemorative ethics regarding the **Honorific Question**. The "Stranger Test" is widely rejected in literature; ignorance of a name's origin does not neutralize its exclusionary function. Similarly, the distinction between **Compulsory Speech and Archives** (The Record Question) is well-trodden in legal and philosophical discourse; the burden of daily invocation is recognized as distinct from passive historical preservation.
  *   **Contested Ground:** The Panel must acknowledge that the **Divisibility Question** remains genuinely debated. There is no settled answer in ethics regarding whether public honor is holistic or divisible. Some philosophers argue for "moral bookkeeping," where good deeds can offset bad in public memory; others argue for "moral contamination," where specific foundational harms invalidate the whole. Our decision rests on the latter view. We present this not as an objective fact, but as a chosen ethical framework appropriate for a city seeking racial reconciliation. We are not discovering a pre-existing truth about Cobb; we are making a normative choice about what kind of honor our city permits.

  **Recommendation:** Proceed with Renaming and Contextual Relocation.
