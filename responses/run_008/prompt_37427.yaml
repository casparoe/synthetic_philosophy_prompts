      *   **Task:** Draft a decision memo regarding "Cobb Avenue."
      *   **Context:** Hollis Cobb (Progressive-era mayor) built infrastructure (water, parks, civil service) but also authored racial zoning ordinances and cleared Black neighborhoods (his "proudest achievement"). The avenue runs through cleared land. Descendants live nearby.
      *   **Deadlock:** The panel is stuck on three specific philosophical/practical questions.
      *   **Requirements:**
          1.  Take a position on the "Honorific Question" (Stranger Test vs. Forgetting as Injury).
          2.  Take a position on the "Record Question" (Street as Document vs. Compulsory Speech).
          3.  Take a position on the "Divisibility Question" (Pro Tanto Honor vs. Holistic Honor).
          4.  Provide a concrete recommendation (Rename, Retain+Interpret, or Hybrid).
          5.  Provide an implementable schedule.
          6.  Include a strong statement of the strongest consideration for the losing side (steel-manning).
          7.  Close with a section distinguishing settled ethical consensus from contested ground (specifically regarding divisibility of honor).
      *   **Tone:** Professional, deliberative, ethically rigorous, decisive but humble.

  2.  **Deconstruct the Three Questions:**

      *   *Question 1: The Honorific Question (Stranger Test).*
          *   *Argument:* If people don't know who Cobb is, the name doesn't honor him.
          *   *Counter-argument:* Forgetting *is* the injury. The name normalizes the history even if the specific name is unknown. It signals who belongs and who doesn't.
          *   *Decision:* I need to reject the "Stranger Test." Ignorance doesn't neutralize harm. The street name functions as a structural marker, not just a biography lesson.
      *   *Question 2: The Record Question (Interpretive Installation).*
          *   *Argument:* Streets are documents; don't erase history. Add a plaque.
          *   *Counter-argument:* Streets are compulsory speech. You can't opt-out of using an address. A plaque is passive; the name is active.
          *   *Decision:* Reject the "Street as Document" analogy in favor of "Street as Compulsory Speech." A plaque is insufficient to counteract the daily invocation of the name.
      *   *Question 3: The Divisibility Question (Pro Tanto Honor).*
          *   *Argument:* Honor the good (water/parks), condemn the bad (zoning).
          *   *Counter-argument:* Honor is holistic. You can't separate the man from his worst acts, especially when the bad acts facilitated the good (e.g., clearance made way for parks/infrastructure).
          *   *Decision:* Reject divisibility. In the context of public commemoration, honoring the name honors the legacy, which is tainted irredeemably by the racial clearance, especially given his own stated pride in it.

  3.  **Determine the Recommendation:**
      *   Based on the positions above (Reject Stranger Test, Reject Passive Interpretation, Reject Divisibility), the logical conclusion is **Renaming**.
      *   *Hybrid Option:* Relocate the name to a museum/contextualized setting. This acknowledges the "Record" concern without maintaining the "Compulsory Speech."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose and the gravity of the decision.
      *   **Analysis of the Three Questions:**
          *   *Honorific:* Argue that ignorance is not neutrality. The name signifies power structures, not just biographical trivia.
          *   *Record:* Distinguish between *preserving* history and *celebrating* it in public thoroughfares. Address the "compulsory speech" aspect.
          *   *Divisibility:* Argue that public honor is indivisible when the harms are foundational to the tenure.
      *   **Recommendation:** Rename Cobb Avenue. Relocate "Cobb" to a museum archive or specific historical marker *away* from the residential street.
      *   **Implementation:** Timeline (Community input, selection of new name, signage change, museum transfer).
      *   **The Losing Side (Steel-manning):** This needs to be strong. Why might retention be right? Stability, cost, the "slippery slope" of erasing complex history, the tangible benefits Cobb brought that everyone uses (water/parks). Acknowledge that renaming feels like hiding the past to some.
      *   **Epistemological Note (Settled vs. Contested):** This is crucial. I need to admit that scholars disagree on divisibility. Don't pretend this is math.

