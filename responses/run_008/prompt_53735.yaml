  Candidate rules
  Kate's verdicts suggest two competing frameworks. First, the **Moral Valence Rule**: side effects are intentional iff they are morally bad, regardless of indifference (explains Cases 1, 2, 5). This aligns with the Knobe Effect. Harm triggers intentionality; help does not. Second, the **Norm-Violation Rule**: intentionality tracks breaking any standard, moral or conventional, when foreseen (explains 1, 3, 5). Violating expectations triggers intentionality. Both must accommodate the **Control Constraint**: direct aims require skill/control to count as intentional (Case 4 vs. 3). Luck negates intention. The Moral Valence Rule prioritizes harm over rules for side effects. The Norm-Violation Rule prioritizes rule-breaking over harm. Both agree on Case 3 (means) and Case 4 (luck). They diverge on non-moral rule-breaking and lucky harm, offering distinct testing grounds. We must see if convention counts as morality for Kate, or if control overrides badness in direct attempts. This distinction is crucial for predicting her next verdicts.

  Predictions for (a)-(c)
  **Case (a):** Moral Valence says *not intentional* (no moral harm). Norm-Violation says *intentional* (broke stated dress code).
  **Case (b):** Moral Valence suggests *intentional* (harmful outcome). Control Constraint suggests *not intentional* (no skill, like Case 4). If Control trumps Valence for direct attempts, it's *not intentional*.
  **Case (c):** Both rules say *not intentional* (no moral harm, followed rules).
  Main splits are (a) and (b). Case (c) is likely "not intentional" under both. Case (b) now tests whether badness overrides the lack of control seen in Case 4, while (a) tests if convention equals morality here. Specifically, does breaking a dress code count like harming wetlands? Does luck negate anger-driven damage? These questions determine which rule Kate actually uses to process intentionality in complex scenarios.

  Best guess and why
  Kate follows the **Moral Valence Rule** with a **Control Constraint**. Case 5 confirms moral harm trumps convention, suggesting (a) is *not intentional*. Case 4 shows luck negates intentionality despite desire, suggesting (b) is *not intentional*; control matters for direct aims. Case (c) lacks moral blame, so *not intentional*. Her intuition mirrors experimental philosophy findings: badness inflates intentionality judgments for side effects, but skill remains requisite for direct aims. The dress code is merely conventional, unlike wetlands or feelings. Without moral badness, side effects remain unintentional. Without skill, direct aims remain unintentional. Kate prioritizes blame and control over foresight and rule-breaking.

  The case that would settle it
  Please ask Kate about a foreseen side effect that violates a clearly trivial rule (like wearing socks) but causes no harm. If she says "intentional," it's Norm-Violation. If "not intentional," it's Moral Valence. This isolates convention from morality. Rule-breaking alone suffices for her intentionality verdicts only if she then agrees.
