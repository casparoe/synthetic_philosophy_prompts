answer: |-
  Based on your friend's track record, she is clearly not a pure utilitarian. She rejects maximizing aggregate welfare when it requires sacrificing specific, non-consenting individuals (Surgeon, Bone Marrow, Utility Monster), but she accepts trade-offs when burdens are generalized, procedural, or self-regarding (Trolley, Tax, Vaccination, Retirement).

  Here are three candidate ethical rules that fit her history, their predictions for the waste facility case, and my assessment of which is correct.

  ### Candidate Rule 1: The "Diffuse Burden" Principle
  **The Logic:** Harm is permissible only if it is spread thinly across the population (like a tax or vaccine side effects). It is impermissible if it is concentrated on a specific, identifiable minority (like the surgeon's patient or the bone marrow donor). The Trolley case is an exception because it involves *redirecting* an existing threat rather than *creating* a new one.
  *   **Fits Data:** Explains why Tax/Vax are "Fine" (universal burden) but Surgeon/Marrow are "Wrong" (targeted harm). Explains Utility Monster rejection (concentrates all resources on one).
  *   **Prediction for Facility:** **Wrong.** The health burden is concentrated on 5,000 specific people, while the benefit is spread across a million. This looks like the Surgeon case (sacrifice the few for the many), not the Tax case (everyone pays a little).

  ### Candidate Rule 2: The "Local Consent" Principle
  **The Logic:** State-imposed burdens are permissible if they are authorized by the people who bear them. General laws (Tax, Vax, Retirement) are presumed to have democratic legitimacy for the whole populace. However, when a burden is localized to a specific group, that specific group must consent.
  *   **Fits Data:** Explains why Bone Marrow/Surgeon are "Wrong" (no consent from the victim). Explains why Tax/Vax are "Fine" (presumed democratic process). The ICU Lottery is "Fine" because it is procedurally fair when consent is impossible.
  *   **Prediction for Facility:** **Wrong.** The prompt explicitly states the neighborhood voted against it. Without local consent, the imposition is illegitimate, regardless of the net welfare gain.

  ### Candidate Rule 3: The "Public Necessity" Exception
  **The Logic:** Individual rights can be overridden for essential public infrastructure if compensation is offered and there are no alternatives. This distinguishes "public goods" (waste disposal, herd immunity, retirement security) from "private gains" (saving specific patients, pleasing a utility monster).
  *   **Fits Data:** Explains Tax, Vax, and Retirement (all state mandates for public good). Distinguishes them from Surgeon/Marrow (medical interventions for specific individuals). The "Utility Monster" is rejected because pleasure isn't a necessity.
  *   **Prediction for Facility:** **Fine.** Waste disposal is essential infrastructure. It is the *only* geologically suitable spot (necessity), and compensation is offered. This fits the "Public Good" pattern of the Tax/Vax cases.

  ---

  ### Best Guess: **Wrong**

  **Reasoning:**
  While Rule 3 (Public Necessity) is tempting, your friend's history suggests she draws a hard line at **concentrated, non-consensual harm**.

  1.  **The Tax/Vax Distinction:** In the cases she approved (Tax, Vax), *everyone* bore the burden. In the Waste Facility case, 99.5% of the beneficiaries bear *no* health burden. This aligns much more closely with the **Surgeon** and **Bone Marrow** cases (where the victim bears 100% of the cost for others' benefit) than the Tax case.
  2.  **The Utility Monster:** She rejected giving everything to the monster even though it maximized welfare. This shows she cares about the *distribution* of welfare, not just the sum. Concentrating health risks on 5,000 people to slightly improve life for 1,000,000 is a distributional failure similar to the Monster case.
  3.  **The Vote:** The fact that you mentioned the neighborhood voted against it is the strongest clue. If she believed "Public Necessity" overrode local objection (Rule 3), the vote wouldn't matter. The fact that it's highlighted suggests it's the dealbreaker (Rule 2).

  She will likely argue that while the city needs waste disposal, it cannot solve its problem by making a specific minority sick without their agreement, especially when they have formally objected.

  ---

  ### The Tie-Breaker Case

  To distinguish between **Rule 1 (Diffuse Burden)** and **Rule 2 (Local Consent)**, present her with this scenario:

  **The Case:** The city still needs the waste facility. However, instead of building one big site in the 5,000-person neighborhood, they build **200 tiny facilities spread evenly across every neighborhood** in the city. The total pollution and noise are exactly the same as the single large facility, but now every resident bears a tiny, equal share of the health burden. The city council votes to approve it, but **60% of the public votes against it in a referendum.**

  *   **If she says "Fine":** She follows the **Diffuse Burden Principle**. The harm is now shared like a tax/vaccine, so it's permissible despite the vote (assuming the council has authority).
  *   **If she says "Wrong":** She follows the **Consent Principle**. Even if the burden is shared, if the people governed by the rule vote against it, it's impermissible.

  **To distinguish between Rule 2 (Consent) and Rule 3 (Necessity):**

  **The Case:** The original scenario (one site, 5,000 burdened), but this time the neighborhood **votes YES** by a slim majority.
  *   **If she says "Fine":** **Consent** was the key blocker.
  *   **If she says "Wrong":** **Concentration/Fairness** is the key blocker. She believes it is inherently unjust for 5,000 to bear health risks for 1,000,000's convenience, even if compensated and consented to (similar to how she might view selling oneself into slavery or a very risky job).
