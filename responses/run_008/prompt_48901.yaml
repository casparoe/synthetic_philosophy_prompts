  5.  **Address the "Unfalsifiability" Charge:**
      *   Is PoS unfalsifiable? Historically, it has been resilient. Every time a learning mechanism is proposed, the goalposts shift to "but can it do it with *less* data?" or "but is it *really* grammar?"
