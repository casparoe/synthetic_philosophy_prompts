      *   **Theorem:** If two agents are Bayesian rationalists, share a common prior, and have common knowledge of each other's posterior probabilities, then their posteriors must be equal.
      *   **Key Conditions:**
          1.  Common Prior Assumption (CPA): They start with the same probability distribution over states of the world before receiving private information.
          2.  Bayesian Updating: They update strictly according to Bayes' rule.
          3.  Common Knowledge of Posteriors: Not just knowing the number, but knowing that the other knows, etc., and crucially, knowing the *information partition* that led to the number (or at least trusting the rationality enough to update on the number itself).
      *   **Real World Application:** Humans are not Bayesian rationalists. Priors are rarely common. Communication is noisy. "Common knowledge" in the game-theoretic sense is extremely strong (infinite recursion).

  4.  **Round-by-Round Assessment:**

      *   **Marcus Round 1:** He invokes the theorem correctly in spirit but applies it too loosely. He assumes "same priors" because they saw the same storefront. This is false. Priors include background knowledge (Elena's experience vs. Marcus's stats knowledge). He claims one must be irrational. This is a standard aggressive interpretation but ignores the common prior condition.
