      *   **Elena Round 2:** She hits the nail on the head. Aumann's theorem implies a process. If you hear a different number from a rational peer with a common prior, you *must* update. Therefore, the state changes. You need iterative updating until convergence. Static announcement isn't enough because the announcement itself is new information. She is right here.
