  1.  **Analyze the Request:**
      *   **User:** Member of a working group at a regional health service.
      *   **Task:** Write assessment guidance/procedure for clinicians (nurses/GPs) judging unobservable symptoms (pain, fatigue, dizziness).
      *   **Context:** High stakes (disability support, equipment, referrals), short appointments (20 mins), clinicians have no philosophy background.
      *   **Philosophical Core:** Wittgenstein's distinction between *criteria* and *symptoms* (later work, Private Language Argument context).
          *   *Symptom:* Inductive evidence (fever $\rightarrow$ flu).
          *   *Criteria:* Constitutive of the concept (pain behavior/expression $\rightarrow$ pain).
      *   **The Problem:** The institution treats reports as claims to be corroborated/doubted (symptomatic model), but for pain, reports function more expressively (criteria model). This creates tension.
      *   **Deliverables:**
          1.  A practical procedure (steps/questions, sufficiency criteria, hand-off points).
          2.  Honesty about where it misfires.
          3.  Application to three specific cases (Back pain/disability, Non-epileptic seizures, Migraines/cost).
          4.  Explicitly flag the deep tension (expressive vs. gatekeeping) without pretending to dissolve it.

  2.  **Deconstruct the Philosophical Concept (Wittgenstein's Criteria vs. Symptoms):**
      *   *Symptom:* Correlated but contingent. A barometer falls (symptom) before rain. It could be wrong. We look *through* the symptom to the fact.
      *   *Criteria:* Grammatical connection. Checking into a hotel (criteria) for "arriving." If the criteria aren't met, the concept doesn't apply. In pain: Wincing, saying "ouch," guarding a limb are *criteria* for pain. They aren't just evidence of a hidden ghost in the machine; they are the public manifestation of the concept.
      *   *The Trap:* Medical bureaucracy treats pain reports purely as *symptoms* of a pathological state (need X-ray to prove it). Wittgenstein suggests the report/behavior is *criteria* for the pain itself.
      *   *The Institutional Reality:* We still need to gatekeep resources. We can't just accept "I hurt" as a blank check for opioids or disability, nor can we demand X-rays for everything.
      *   *The Solution:* A procedure that acknowledges the *criteria* nature of the report (validating the experience) while assessing the *functional impact* (the gateway to resources) without demanding impossible biological proof.

  3.  **Drafting the Procedure (The "Wittgensteinian Triage"):**
      *   *Goal:* Make it usable for a GP in 20 mins. No jargon.
      *   *Structure:*
          *   Phase 1: Acceptance (Criteria). Acknowledge the expression.
          *   Phase 2: Contextualization (Symptoms/Corroboration). Look for consistency, not proof.
          *   Phase 3: Functional Impact (The Gate). Resources depend on what you *can't do*, not just what you *feel*.
          *   Phase 4: The Hand-off (Values). Where the procedure stops.
      *   *Key Shift:* Move from "Is this pain real?" (Ontological doubt) to "What does this pain prevent?" (Functional assessment).

  4.  **Addressing the Tension:**
      *   Must explicitly state: We cannot prove the inner state. We assess the outer life.
      *   The "Misfire" section is crucial. Where does logic break down? (e.g., malingering vs. psychogenic pain vs. idiopathic pain).

  5.  **Running the Cases:**
      *   *Case 1 (Back Pain/Disability):* Normal imaging. Assessor suspects exaggeration.
          *   *Application:* Don't fight the imaging. Focus on function. If they can't lift, they can't work. If the behavior matches the report, accept criteria. If behavior contradicts (lifting heavy boxes at home), note inconsistency.
          *   *Tension:* Disability requires "real" illness, but "real" is defined by impact here.
      *   *Case 2 ("Seizures"/PNES):* Description doesn't fit medical "seizure."
          *   *Application:* This is a conceptual confusion. The *word* seizure has criteria (electrical storm). If criteria aren't met, it's not a seizure. But the *distress* is real. Reframe the diagnosis, don't dismiss the suffering.
          *   *Tension:* Language games clashing. Medical definition vs. Patient experience.
      *   *Case 3 (Migraines/Cost):* Uncorroborated suffering vs. expensive treatment.
          *   *Application:* This is the values hand-off. The procedure can establish the pain is real (criteria met) and severe (function impaired). It cannot decide if the drug is *worth* the cost. That's policy, not clinical fact.
          *   *Tension:* Resource allocation vs. Individual need.

  6.  **Refining the Tone:**
      *   Professional, pragmatic, empathetic but firm.
      *   Avoid philosophical jargon in the actual procedure (clinicians won't read it), but explain the rationale in the intro/outro for the working group.
      *   Ensure the "Tension" is highlighted as requested.

