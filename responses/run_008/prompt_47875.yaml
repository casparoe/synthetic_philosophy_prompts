prompt: |-
  I'm an undergraduate taking a philosophy of art seminar this term, where we've been reading on the aesthetic testimony problem — whether one can legitimately form beliefs about the aesthetic value of a work on the basis of other people's say-so, or whether genuine aesthetic judgment requires first-hand acquaintance with the work. I also have a practical stake in this: I serve on the jury for our university's annual student art prize, and the pragmatics of the job keep forcing the question on me.

  Here is the setup. We receive roughly 180 submissions across painting, sculpture, photography, video, sound, installation, and performance. Each of the five jurors is expected to review everything, but the review window is two and a half weeks, most of us are in classes all day, and the final rankings must be signed off by the jury chair, a studio-art lecturer who is explicitly worried that we defer too much to one another and to faculty endorsements. Some works can only be judged on site — a sound installation you have to sit inside, a scent piece, a durational performance scheduled at specific hours — and for some of those, video documentation is all that will ever be available to most jurors. We also have, for each submission, a faculty sponsor's letter, and a small number of pieces come with reputations attached (last year's runner-up's new series, a piece already picked up by a student-run gallery).

  What I would like from you is a decision procedure the jury can actually run, not an essay on the philosophy. It should tell us, in order: when testimony about a work is admissible as a filter for our attention, when it is admissible as evidence toward our verdict, and when it must be quarantined entirely — along with what counts as a sufficient basis for each ruling. It should incorporate what the philosophical literature actually establishes (the acquaintance principle, Hume's appeal to qualified judges, the distinction between deferring about a verdict and deferring about where to look, and the point that testimony may justify a belief without transmitting knowledge), but translated into language a juror can apply in a few minutes per submission. It should be honest about which steps are genuinely settled by the theory and which are judgment calls dressed up as procedure, and it should mark the points where the procedure must hand the decision back to a juror as a matter of values.

  Then run it on three cases. First, a painting that arrives with a letter from a well-regarded professor calling it the strongest student work she has seen in a decade. Second, a six-hour durational performance for which only a nine-minute edited video and a written description by the performer's classmates exist, and which cannot be restaged before our deadline. Third, a photograph by a student whose work took second prize last year, submitted this year with no supporting materials and no reviews yet. I want to see at least one case where the procedure yields an answer I or the chair will dislike, and I want the procedure's limits stated plainly — what it cannot do for us, and where following it scrupulously would still leave us open to the charge that our prizes were awarded on the strength of reputation rather than anyone's genuine acquaintance with the work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate philosophy of art student, juror on university art prize.
      *   **Problem:** Aesthetic Testimony Problem (can we trust others' judgments vs. needing first-hand acquaintance?) applied to a practical, high-volume, time-constrained jury process.
      *   **Constraints:** 180 submissions, 5 jurors, 2.5 weeks, mixed media (some require presence), faculty letters exist, reputations exist, Chair worries about deference.
      *   **Task:** Create a *decision procedure* (not an essay) for the jury.
      *   **Requirements:**
          *   Order: Admissible as filter? Admissible as evidence? Quarantined?
          *   Basis: Sufficient conditions for each ruling.
          *   Philosophical Grounding: Acquaintance Principle, Hume's qualified judges, verdict vs. attention deference, belief vs. knowledge.
          *   Honesty: Distinguish settled theory from judgment calls/values.
          *   Application: Run on three specific cases (Painting w/ praise, Durational Performance w/ video, Past Winner w/ no support).
          *   Outcome: At least one unpopular/uncomfortable result.
          *   Limitations: State plainly what the procedure *cannot* solve.

  2.  **Deconstruct the Philosophy (Mental Sandbox):**
      *   *Acquaintance Principle (Wollheim/Kant):* Aesthetic judgment requires direct experience. You can't *know* something is beautiful just because someone said so.
      *   *Testimony (Budd/Mathers):* Testimony might justify belief (I believe it's good) but doesn't transmit aesthetic *knowledge* or warrant the *judgment* itself.
      *   *Deference:* Deferring on the *verdict* is problematic. Deferring on *where to look* (attention) is generally acceptable pragmatically.
      *   *Hume (Of the Standard of Taste):* Experts/qualified judges matter, but their consensus is the goal, not the shortcut.
      *   *Pragmatics:* 180 works in 2.5 weeks is impossible to view deeply. Filtering is necessary.
      *   *The Tension:* The Chair wants independent judgment. The Reality requires filtering. The Philosophy says filtering is okay, verdicting on testimony is not.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* A flowchart-style protocol.
      *   *Step 1: Triage (Filtering).* Can we use testimony here? Yes, to save time. But we must acknowledge it's pragmatic, not epistemic.
      *   *Step 2: Evaluation (Verdict).* Can we use testimony here? No, not for the final rank. Direct experience is needed.
      *   *Step 3: Documentation.* If direct experience is impossible (e.g., past performance), what then? This is the hard case.
      *   *Refining the "Quarantine":* Faculty letters are tricky. They are testimony. They should influence *attention*, not *score*.
      *   *Refining the "Values":* The jury must decide if "fairness" (everyone viewed equally) outweighs "accuracy" (viewing what's viewable).

      *Drafting the Rules:*
      *   Rule 1 (Attention): Testimony allowed to prioritize viewing.
      *   Rule 2 (Verdict): Testimony banned for scoring. Direct experience required.
      *   Rule 3 (Impossible Experience): If direct experience is impossible, the work is ineligible for top prizes *unless* documentation is deemed sufficient proxy (value judgment).
      *   Rule 4 (Reputation): Past success is a filter, not a bonus.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Painting + Prof Letter):* Letter = Filter. Verdict must come from looking. *Result:* High priority to view, but if it's mediocre upon viewing, the letter counts for nothing.
      *   *Case 2 (Performance + Video):* Direct experience impossible. Video = Testimony/Proxy. *Result:* Ineligible for 1st place (Acquaintance Principle). Maybe a "Special Mention" if the video is compelling, but this risks the "reputation over acquaintance" charge. *Decision:* Let's make this the "unpopular" one. Disqualify from main prize.
      *   *Case 3 (Past Winner + No Support):* Reputation = Filter. *Result:* View early. Judge on photo alone. If good, good. If bad, bad. No penalty for no letter.

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the tension (Theory vs. Pragmatics).
      *   **The Protocol:** Step-by-step instructions.
      *   **Philosophical Annotations:** Explain *why* each step exists (referencing Wollheim, Hume, etc.).
      *   **The "Hard Lines" (Values):** Where the procedure admits it's making a value call.
      *   **Case Studies:** Apply the protocol.
      *   **Limitations:** What this doesn't solve.

  6.  **Self-Correction/Critique during Drafting:**
      *   *Critique:* Is 180 works in 2.5 weeks actually possible for 5 jurors? That's 36 works each. Roughly 2-3 per day. That's tight but doable for digital. Physical is harder.
      *   *Correction:* The procedure needs to acknowledge that "Direct Experience" varies by medium. For a painting, looking at the file might be enough? No, the prompt says "Some works can only be judged on site." I need to distinguish between *Digital Proxy* (photo of painting) and *Essential Medium* (sound/performance).
      *   *Adjustment:* Rule 2 needs a sub-clause on "Sufficient Proxy." A high-res photo of a painting *is* sufficient acquaintance for a student prize. A video of a performance is *not*.
      *   *Unpopular Result:* The Chair worries about deference. If I say "Disqualify the performance because you can't experience it," the Chair might like that (no deference), but the students might hate it. Or, if I say "Trust the faculty letter for the painting," the Chair hates that. Let's make the Performance case the one where we *cannot* award the top prize, which might upset the performance students. Or, let's make the Painting case where the letter is *ignored* for scoring, which might upset the faculty.
      *   *Better Unpopular Result:* The prompt asks for "an answer I or the chair will dislike." The Chair worries about deference. If the procedure forces us to *ignore* the performance entirely because we can't experience it, that might be seen as biased against time-based media. Let's go with that. It highlights the limitation of the Acquaintance Principle in a mixed-media contest.

  7.  **Finalizing the Procedure Text:**
      *   Make it look like a rubric or SOP.
      *   Ensure the philosophical distinctions (Belief vs. Knowledge, Attention vs. Verdict) are clear but concise.
      *   Ensure the "Judgment Calls" are explicitly flagged.

  8.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Order (Filter -> Evidence -> Quarantine)? Yes.
      *   Philosophical grounding? Yes.
      *   Honest about limits? Yes.
      *   Three cases run? Yes.
      *   Unpopular result? Yes (Performance disqualified from top tier).
      *   Limits stated? Yes.

  9.  *(Self-Correction on Case 2)*: If I disqualify the performance, is that "dislike"? Yes, performance students will hate it. But maybe the *Chair* will dislike it if it reduces diversity of media. Let's make sure the reasoning is clear: The procedure prioritizes the Acquaintance Principle over Media Neutrality. That's a value call.

  10. *(Refining the "Quarantine" aspect)*: Faculty letters are the biggest risk for the Chair. The procedure must strictly quarantine them from the *scoring* phase. They are only for *scheduling*.

  11. *(Final Polish)*: Ensure tone is professional, pragmatic, yet philosophically rigorous. (Proceed to generate output).

  *(Wait, one last check on the "Unpopular Result")*: The prompt says "I want to see at least one case where the procedure yields an answer I or the chair will dislike."
  *   Chair dislikes: Deferring to faculty.
  *   Juror dislikes: Having to disqualify a cool piece because of logistics.
  *   Let's make Case 2 (Performance) the one where the procedure says "You cannot award this the top prize." This is honest to the Acquaintance Principle but pragmatically painful.
  *   Let's make Case 1 (Painting) the one where the procedure says "Ignore the letter for scoring." This addresses the Chair's worry.
  *   Actually, combining them: The procedure forces the jury to admit they *cannot* judge the performance fairly. That's a strong limitation.

  Okay, ready to write.
answer: |-
  # The Jury Protocol: Aesthetic Testimony & Evaluation Procedure

  **Purpose:** To maximize the epistemic legitimacy of the jury's verdicts within the pragmatic constraints of volume, time, and mixed media, while minimizing illegitimate deference to authority.

  **Philosophical Basis:** This protocol distinguishes between *deferring on attention* (pragmatically necessary, epistemically permissible) and *deferring on verdicts* (epistemically illegitimate under the Acquaintance Principle). It treats testimony as a heuristic for scheduling, not evidence for ranking.

  ---

  ## Part I: The Decision Procedure

  ### Phase 1: Triage (The Attention Filter)
  **Goal:** Determine the order in which works are experienced.
  **Question:** *Does external testimony exist for this submission?* (Faculty letters, reputation, prior prizes, peer buzz).

  *   **Rule 1.1 (Admissibility):** Testimony is **Admissible** solely as a prioritization tool.
      *   *Action:* Submissions with strong testimony (e.g., faculty endorsement, prior winner) are moved to the top of the viewing queue.
      *   *Philosophical Warrant:* Deferring on *where to look* is distinct from deferring on *what is good*. Given 180 submissions, jurors cannot allocate attention randomly. Testimony functions as a "search engine," not a "judge."
      *   *Constraint:* This must be transparent. The jury log must note *why* a piece was viewed early (e.g., "Viewed Day 1 due to Faculty Letter").

  *   **Rule 1.2 (The Quarantine):** Once the work is encountered, all prior testimony is **Quarantined**.
      *   *Action:* Faculty letters and reputation data must be physically or digitally separated from the scoring sheet before the verdict is recorded.
      *   *Philosophical Warrant:* Testimony may justify a *belief* ("I believe this is good"), but it cannot transmit aesthetic *knowledge* or warrant a *judgment*. To rank based on the letter is to violate the Acquaintance Principle.

  ### Phase 2: Experience (The Acquaintance Check)
  **Goal:** Determine if the juror has achieved sufficient direct acquaintance to render a verdict.
  **Question:** *Does the available mode of presentation match the work's essential medium?*

  *   **Rule 2.1 (Sufficient Proxy):** For static visual works (painting, photography, sculpture), high-resolution documentation is deemed a **Sufficient Proxy** for direct acquaintance.
      *   *Action:* Jurors may score these based on digital files if physical viewing is impossible.
      *   *Judgment Call:* This is a pragmatic concession. Strictly speaking, a screen is not a canvas, but for a student prize, the delta is accepted as negligible.

  *   **Rule 2.2 (Insufficient Proxy):** For time-based, spatial, or immersive works (performance, sound, installation, durational), documentation is an **Insufficient Proxy**.
      *   *Action:* If the work cannot be experienced in its intended mode (e.g., the performance is over, the installation is struck) and only video/description remains, the work is **Ineligible for Top Tier Prizes**.
      *   *Philosophical Warrant:* A 9-minute edit of a 6-hour performance is a *different work* than the performance. Judging the edit is judging the editor, not the performer. To award a prize here is to judge on testimony/documentation, violating Rule 1.2.
      *   *Exception:* A "Documentation Merit" prize may be awarded if the jury wishes to acknowledge the artifact without claiming to judge the original aesthetic event.

  ### Phase 3: Verdict (The Scoring)
  **Goal:** Assign rank based solely on the juror's phenomenological experience.
  **Question:** *What is my aesthetic response to the work as experienced?*

  *   **Rule 3.1 (Blind Scoring):** Scores are entered without reference to the artist's name or sponsor.
      *   *Action:* Use ID numbers only.
      *   *Philosophical Warrant:* Hume's "qualified judge" must be free from prejudice. Knowing the sponsor introduces bias that mimics testimony.

  *   **Rule 3.2 (Conflict Resolution):** If jurors disagree significantly on a high-priority work (e.g., Faculty favorite gets low scores), the testimony is **Retrospectively Invalidated**.
      *   *Action:* No debate is allowed to "convince" low-scorers based on the faculty letter. The low scores stand.
      *   *Philosophical Warrant:* Aesthetic disagreement is not a logical error. You cannot argue someone into an aesthetic experience they did not have.

  ---

  ## Part II: The "Hard Lines" (Values & Limitations)

  *This section identifies where the procedure stops being philosophy and starts being policy. The jury must vote to accept these values before beginning.*

  1.  **Media Bias Acknowledgement:** By enforcing Rule 2.2, this procedure systematically disadvantages time-based and ephemeral media. **Value Call:** We prioritize *epistemic integrity* (judging only what we can experience) over *media neutrality* (giving all forms an equal shot). This may result in a prize list dominated by painting/photography.
  2.  **The Faculty Friction:** By enforcing Rule 1.2 and 3.2, we risk alienating faculty sponsors whose endorsed works are ranked low. **Value Call:** We prioritize *jury autonomy* over *departmental harmony*. The Chair's worry about deference is addressed by structurally ignoring the letters during scoring.
  3.  **The Reputation Trap:** By enforcing Rule 1.1, we admit that reputation shapes *what we see*, which inevitably shapes *what wins* (unseen works can't win). **Limitation:** We cannot eliminate the advantage of reputation; we can only prevent it from directly purchasing points.

  ---

  ## Part III: Case Applications

  Here is the procedure applied to your three specific scenarios.

  ### Case 1: The Painting with the Faculty Letter
  *   **Submission:** Painting. Faculty sponsor letter calls it "strongest in a decade."
  *   **Procedure Run:**
      1.  **Triage:** Letter is **Admissible as Filter**. The painting is moved to the top of the viewing queue (Day 1).
      2.  **Experience:** Jurors view the painting (or high-res proxy).
      3.  **Quarantine:** Before scoring, the letter is sealed/hidden. The claim "strongest in a decade" is excluded from deliberation.
      4.  **Verdict:** Jurors score based on visual experience.
  *   **Outcome:** If the jurors find the painting competent but unremarkable, it receives a mid-range score. The faculty letter counts for **zero** in the final tally.
  *   **Friction Point:** The Chair may dislike this if they hoped the letter would ensure the work's success. The faculty sponsor may be offended. But the procedure protects the jury from the charge of deference.

  ### Case 2: The Durational Performance (6 Hours)
  *   **Submission:** 6-hour performance. Only a 9-minute edited video and classmate descriptions exist. Cannot be restaged.
  *   **Procedure Run:**
      1.  **Triage:** Classmate descriptions are **Admissible as Filter**. Viewed early to assess documentation quality.
      2.  **Experience:** Jurors watch the 9-minute video.
      3.  **Acquaintance Check:** Rule 2.2 applies. A 9-minute edit is an **Insufficient Proxy** for a 6-hour durational experience. The video is a record of the event, not the event.
      4.  **Verdict:** The work is **Ineligible for the Main Prize**.
  *   **Outcome:** The work is disqualified from the top tier. It may be considered for a "Documentation" mention if such a category exists, but it cannot win the Student Art Prize.
  *   **Friction Point:** **This is the answer you or the Chair will dislike.** It excludes a potentially brilliant work due to logistical constraints. It admits that the prize structure is inherently biased against ephemeral art. However, following the procedure scrupulously prevents the jury from awarding a prize based on *testimony about a vibe* rather than *acquaintance with the work*.

  ### Case 3: The Past Winner (Photograph)
  *   **Submission:** Photograph. Student took 2nd prize last year. No letter, no reviews.
  *   **Procedure Run:**
      1.  **Triage:** Reputation is **Admissible as Filter**. "Past Winner" status moves it to the early queue (Day 1 or 2).
      2.  **Experience:** Jurors view the photograph (Sufficient Proxy per Rule 2.1).
      3.  **Quarantine:** The fact of prior winning is hidden during scoring (Rule 3.1).
      4.  **Verdict:** Scored on merit of the image alone.
  *   **Outcome:** If the photo is strong, it ranks high. If it is weak, it ranks low. The "halo effect" of the previous prize is structurally neutralized during the scoring phase.
  *   **Friction Point:** This tests the "Humean" idea of consistency. If the student is genuinely a "qualified judge's choice" consistently, they will rise again. If they were a one-hit wonder, the procedure prevents them from coasting on reputation.

  ---

  ## Part IV: Limitations & Honest Admissions

  If you adopt this procedure, you must accept the following limitations. The philosophy does not solve these; it merely clarifies them.

  1.  **The "Attention Economy" Bias:** By using testimony to filter attention (Rule 1.1), you guarantee that works *without* testimony (no faculty connections, no prior rep) are viewed later, when jurors are fatigued. The procedure admits this is unavoidable but insists it is better than scoring without viewing. You cannot claim the process is perfectly blind.
  2.  **The Performance Exclusion:** As seen in Case 2, strict adherence to the Acquaintance Principle means your prize will likely favor static objects. If the Chair demands media neutrality, they must overrule Rule 2.2. If they do, they must admit the verdict for those pieces is based on *documentation quality*, not *aesthetic merit of the work*.
  3.  **The "Belief without Knowledge" Gap:** You may end up believing a work is good because everyone else scored it high, yet lack the aesthetic knowledge to defend it. The procedure allows you to sign the verdict (pragmatic necessity) but forbids you from claiming you *know* it is the best in the same way you know the math proofs in your other classes. You are signing off on a *consensus of experience*, not an objective truth.

  **Final Recommendation to the Chair:**
  Present this protocol as a risk-management tool. It does not guarantee the "best" art wins (philosophy cannot do that). It guarantees that if the prize is challenged, the jury can demonstrate that no award was granted solely on the strength of a faculty signature or a reputation. It trades the *possibility* of missing a great unviewable work for the *certainty* that viewed works were judged on acquaintance.
