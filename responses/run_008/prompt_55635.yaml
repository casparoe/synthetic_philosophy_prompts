  The only principle that reconciles most of your intuitions is that dramatization is unethical only when it inflicts reputational or emotional harm on living stakeholders, which forces you to drop your verdict on the journalist and rule the biopic about the mother not fine.

  This **Principle of Surviving Stakeholders** posits that our obligation to factual fidelity decays once there is no living person capable of suffering reputational damage, emotional distress, or privacy violation from the distortion. Under this rule, Shakespeare's *Richard III* and *Amadeus* are fine because the subjects are historically distant enough that no living heirs suffer harm from the libel. The composite soldier and the musician's timeline shuffle are fine because they either generalize identity or alter aesthetics without staining moral character. The alive actress and *The Crown* are not fine because the subjects themselves are living stakeholders who can be hurt.

  To maintain consistency, you must drop your verdict on the **dead journalist**. While the documentary style is deceptive, the subject has been dead a century with no indicated living heirs; without a living stakeholder to suffer reputational harm, the ethical violation is negligible compared to the cases involving living subjects. This same logic dictates your flip-flopping case: the biopic about the woman dead twenty years is **not fine**. Although she is dead, her adult children are living stakeholders who will suffer emotional harm and privacy violations from the invention of a secret kept from them, placing this firmly in the same category as the alive actress and *The Crown*.
