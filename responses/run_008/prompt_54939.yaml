  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book set in a fictional Swiss-style alpine canton (pop. ~4,000).
      *   **Goal:** Write a pivotal voting scene (selling communal alp to a developer) with authenticity, not just "vibes."
      *   **Task:** Design a 2-hour simulation for a writing group (~12 adults) to experience Swiss-style direct democracy mechanics.
      *   **Key Mechanics Required:**
          *   Citizen initiative power (drafting the ballot measure, not just voting).
          *   Double Majority (popular vote + majority of districts).
          *   Unequal districts (to create tension/weighting issues).
          *   Secret ballot.
          *   Specific outcome: Popular vote winner loses overall (at least once/designed).
      *   **Debrief:** Map simulation phases to "Democracy as Deliberation vs. Aggregation."
      *   **Honesty Check:** Predict what goes wrong with novelists (off-topic) and what *cannot* be reproduced in a living room (limitations).

  2.  **Deconstruct the Mechanics (Swiss Model vs. Simulation):**
      *   *Real Swiss Model:* Signature collection -> Federal/State review -> Campaign period -> Vote (Majority of People + Majority of Cantons for constitutional changes).
      *   *Simulation Constraints:* 12 people, 2 hours, living room.
      *   *Adaptation:*
          *   "Cantons" = Small groups/tables.
          *   "Population" = Individual players.
          *   "Initiative" = Drafting the proposal text.
          *   "Double Majority" = Majority of individuals + Majority of tables.
          *   "Unequal Districts" = Some tables have more people than others, but equal voting weight as a "district."

  3.  **Drafting the Simulation Flow (2 Hours):**
      *   *Intro (10 min):* Context setting, roles, stakes.
      *   *Phase 1: The Initiative (30 min):* Drafting the question. This is crucial. Who controls the language?
      *   *Phase 2: The Campaign/Debate (30 min):* Persuasion, deal-making.
      *   *Phase 3: The Vote (10 min):* Secret ballot, counting.
      *   *Phase 4: The Reveal & Crisis (10 min):* The "Popular Vote Wins, Cantons Lose" moment.
      *   *Debrief (20 min):* Connecting to theory.

      *Wait, I need to ensure the "Popular Vote Winner Loses" outcome.*
      *   To guarantee this in a simulation, I need to rig the district sizes.
      *   Total players: 12.
      *   Districts: 3 Tables.
      *   Table A: 6 people (50% of pop).
      *   Table B: 4 people (33% of pop).
      *   Table C: 2 people (17% of pop).
      *   District Vote: Need 2 out of 3 tables to win.
      *   Scenario: Table A votes YES (6 votes). Tables B & C vote NO (6 votes).
      *   Popular Vote: 6 YES vs 6 NO (Tie? No, need a clear winner).
      *   Let's adjust:
