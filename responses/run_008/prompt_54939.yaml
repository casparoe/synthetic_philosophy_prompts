answer: |-
  This is a brilliant way to research a scene. You are asking your writers to stop acting like gods of their own universes and submit to the friction of a system. That friction is where the drama lives.

  Here is a complete design for your **"Canton Simulation."** It is timed for exactly 120 minutes. It requires minimal props but strict facilitation.

  ### **The Setup**

  **The Scenario:** The Valley of Saint-Georg. Population 4,000.
  **The Issue:** A luxury resort group wants to buy the *Gemeindealp* (communal high pasture) to build a ski spine and wellness hotel.
  **The Stakes:** Immediate cash injection for the commune vs. permanent loss of traditional grazing rights and landscape change.

  **The Room:**
  *   **Participants:** 12 writers.
  *   **Seating:** 3 Tables (Districts).
  *   **District A (The Village):** 5 seats. (High population, economic hub).
  *   **District B (The Hamlets):** 4 seats. (Commuters, ambivalent).
  *   **District C (The Alp Farmers):** 3 seats. (Low population, directly impacted).
  *   **Facilitator:** You (or one trusted writer who doesn't vote). You are the *Federal Chancellery*.

  **Materials:**
  *   Index cards (for secret ballots).
  *   Envelopes (for Private Role Info).
  *   A whiteboard (for tallying).
  *   A visible timer.

  ---

  ### **The Schedule (120 Minutes)**

  #### **1. Introduction & Distribution (10 Minutes)**
  *   **Context:** Explain the scenario.
  *   **The Rule:** This is not a consensus workshop. It is a procedural simulation. The goal is not agreement; it is a result.
  *   **Assign Seats:** Seat people at tables A, B, and C according to the numbers above (5, 4, 3).
  *   **Hand out Role Cards:** Each player gets a private card explaining their personal stake.
      *   *District A Cards:* "You own businesses in the village. The hotel promises a 20% increase in local revenue. You pay low taxes." (Incentive: **Strong YES**)
      *   *District B Cards:* "You work in the city but live here. The hotel promises jobs for your spouse, but traffic will worsen. You are unsure." (Incentive: **Split/Malleable**)
      *   *District C Cards:* "Your family has grazed cattle on the Alp for 300 years. The sale extinguishes your rights forever with minimal compensation." (Incentive: **Strong NO**)

  #### **2. Phase I: The Initiative (30 Minutes)**
  *   **The Mechanic:** In Switzerland, citizens draft the text. The wording matters.
  *   **Task:** Each Table must draft a **single sentence** that will appear on the ballot.
      *   *Constraint:* It must be a Yes/No question.
      *   *Conflict:* Table A will want wording that emphasizes "Economic Growth." Table C will want wording that emphasizes "Loss of Heritage."
  *   **The Chancellery Ruling:** After 30 minutes, collect the three drafts. **You (the Facilitator) choose only one to go on the ballot.**
      *   *Tip:* Choose the most ambiguous one, or the one favored by District A. This simulates how bureaucratic language can obscure stakes. Announce: *"This is the official text. No changes."*

  #### **3. Phase II: The Campaign (30 Minutes)**
  *   **The Mechanic:** Inter-district persuasion.
  *   **Task:** Players can leave their tables and mingle. They can make deals, lie, or plead.
  *   **The Twist:** At the 15-minute mark, interrupt the room. Announce a **"Polling Update."**
      *   *Script:* "Leaked internal polling suggests District A is voting 100% YES. If District B and C do not coordinate, the Popular Vote will pass."
      *   *Purpose:* This forces Districts B and C to realize their only power is the **District Majority**, not the Popular Vote. It encourages strategic block voting.

  #### **4. Phase III: The Vote (15 Minutes)**
  *   **The Mechanic:** Double Majority.
  *   **Step 1 (Secret Ballot):** Every individual writes YES or NO on a card. Collect them.
  *   **Step 2 (District Tally):** You count the votes per table aloud.
      *   *Rule:* A District votes **YES** only if >50% of its members voted YES. (Ties count as NO/Status Quo).
      *   *Rule:* The Measure Passes only if **(1) Majority of Individuals YES** AND **(2) Majority of Districts (2 out of 3) YES**.
  *   **Step 3 (The Reveal):** Write the numbers on the board.
      *   *Target Outcome:* Popular Vote: 7 YES / 5 NO. (Passes). District Vote: 1 YES / 2 NO. (Fails).
      *   *Note:* If your writers rebel and vote differently, acknowledge the result. But the Role Cards are weighted to make the target outcome the rational choice.

  #### **5. Phase IV: The Debrief (35 Minutes)**
  *   **Do not move chairs.** Keep the tension in the room.
  *   **Question 1 (The Text):** "How did it feel to have your ballot wording rejected by the Chancellery?" (Maps to: *Agenda Setting Power*).
  *   **Question 2 (The Math):** "For those in District A: You won the popular vote but lost the law. Do you feel disenfranchised?" (Maps to: *Minority Veto vs. Tyranny of the Majority*).
  *   **Question 3 (The Theory):** "Was this evening about finding the truth (Deliberation) or counting preferences (Aggregation)?"

  ---

  ### **The Honesty Check**

  You asked for two specific truths about running this with novelists. Here they are.

  #### **1. What Will Predictably Go Wrong (The Novelist Factor)**
  Novelists are professional empathizers. They are trained to find the nuance in every position. In a real referendum, voters operate on heuristics, party lines, and gut feelings. In your simulation, **your writers will try to "solve" the moral dilemma.**
  *   **The Risk:** They will refuse to vote according to their Role Card because "my character wouldn't do that." They will try to forge a consensus compromise (e.g., "Let's build a smaller hotel!") to avoid the pain of a binary vote.
  *   **The Fix:** You must be a tyrant. Remind them: *"You are not writing a story. You are a voter with a specific economic interest. Vote your interest, not your conscience. If the system breaks, the scene fails."* If they try to compromise the binary choice, shut it down. The pain of the binary is the point.

  #### **2. What You Cannot Reproduce (The Cheat Code)**
  The living room cannot reproduce **Time and Consequence.**
  *   **Time:** Swiss referendums are marinated in months of committee reviews, legal challenges, and brochure mailers. Your simulation is 2 hours. This means your writers will lack the "fog of information." They will feel too clear-headed.
  *   **Consequence:** In your book, if the vote passes, the landscape changes forever. In the living room, if the vote passes, you order pizza. There is no *fear*.
  *   **Where You Can Cheat:** In your scene, you are allowed to amplify the **social cost**. In the simulation, the losers go home to their cars. In your book, the losers have to walk past the winners at the bakery for the next ten years. Lean into the *social permanence* of the vote. That is the emotional truth the simulation can't generate, but you can write.

  ### **Mapping the Debrief to Your Scene**

  When you write the chapter, use the simulation's phases to structure the narrative arc:

  1.  **The Drafting Phase** $\rightarrow$ **Democracy as Deliberation.**
      *   *Lesson:* The fight isn't about Yes/No; it's about *what question is being asked.*
      *   *Scene Application:* Show your protagonist fighting over a single adjective in the proposal text. That is where the real power lies.
  2.  **The Campaign Phase** $\rightarrow$ **Democracy as Coalition.**
      *   *Lesson:* Votes aren't individual; they are tribal.
      *   *Scene Application:* Show the moment the Farmers (District C) realize they need the Hamlets (District B) to block the Village (District A). Show the handshake deal.
  3.  **The Double Majority** $\rightarrow$ **Democracy as Aggregation.**
      *   *Lesson:* The system is designed to frustrate the majority to protect the minority.
      *   *Scene Application:* When the results come in, do not describe the winner. Describe the face of the person who won the popular vote but lost the canton. That is the face of Swiss democracy.

  ### **Final Instruction for the Facilitator**
  If the vote comes out "clean" (everyone agrees), **the simulation has failed.** You need conflict. If District A is wavering, whisper to them: *"Remember, your business fails if this doesn't pass."* If District C is wavering, remind them: *"Your grandfather's grave is on that land."*

  Manufacture the stakes. Then let the system crush them.
