          *   Let's go 5-4-3.
          *   Table 1 (5): 5 YES.
          *   Table 2 (4): 1 YES, 3 NO. (District NO).
          *   Table 3 (3): 1 YES, 2 NO. (District NO).
          *   Popular: 5 + 1 + 1 = 7 YES. 3 + 2 = 5 NO.
          *   District: 1 YES, 2 NO.
          *   This works. I need role cards that ensure Table 1 is pro-development, Tables 2 & 3 are skeptical but with a minority tempted by money.

      *   *Wait, one more thing:* The prompt asks for "a phase where small groups draft ballot measures themselves."
      *   Okay, I need to make the *wording* a conflict.
      *   Phase 1: Each Table drafts a version of the proposal.
      *   Phase 2: A "Chancellery" (Facilitator + 1) selects one, or merges them.
      *   Actually, Swiss style: A committee collects signatures.
      *   Let's simplify: Each Table proposes a *clause* to be included in the final measure. The Facilitator combines them into one confusing ballot text. This mimics how language can be manipulated.
      *   *Better:* Give the drafting power to *one* table (The Elite/Committee) and let the others react. No, the prompt says "small groups draft ballot measures themselves."
      *   Okay: All three tables draft a version. Then a "Harmonization Committee" (2 volunteers) must merge them into ONE question. This creates the "who decides the words" conflict.

      *   *Revised Plan:*
          1.  **Setup:** Assign Tables (Districts) & Roles.
          2.  **Drafting (30m):** Each table writes their ideal "Yes" text.
          3.  **Harmonization (15m):** Facilitator picks one, or merges. (To save time, Facilitator should act as the "Federal Chancellery" and choose the most ambiguous one).
          4.  **Campaign (30m):** Persuasion.
          5.  **Vote (15m):** Secret ballot + District tally.
          6.  **Debrief (30m).**

      *   *Wait, time check:* 2 Hours = 120 mins.
      *   Intro: 10.
      *   Drafting: 30.
      *   Harmonization/Rule Explanation: 15.
      *   Debate: 30.
      *   Vote & Count: 15.
      *   Debrief: 20.
      *   Total: 120. Tight but doable.

      *   *Refining the "Popular Winner Loses" mechanic:*
      *   I can't *force* the vote, but I can stack the incentives.
      *   Table 1 (5 people): "Hotel Owners/Investors." Incentive: Financial gain.
      *   Table 2 (4 people): "Commuters." Incentive: Jobs vs. Traffic.
      *   Table 3 (3 people): "Farmers." Incentive: Land loss.
