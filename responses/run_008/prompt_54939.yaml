      *   *Better Math:*
          *   Table 1 (Valley Floor): 5 people.
          *   Table 2 (Mid-Slope): 4 people.
          *   Table 3 (High Alp): 3 people.
          *   Total: 12.
          *   Districts: 3. Need 2 to win.
          *   Target Outcome: Popular YES (7-5), District NO (1-2).
          *   Table 1 (5 people): All vote YES. (5 YES)
