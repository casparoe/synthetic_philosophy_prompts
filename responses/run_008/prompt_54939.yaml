          *   District Majority: 2 out of 3.
          *   Scenario for Conflict: Table A (5 people) votes YES. Tables B (4) and C (3) vote NO.
          *   Popular Vote: 5 YES vs 7 NO. (NO wins popular).
          *   District Vote: 1 YES (A) vs 2 NO (B, C). (NO wins districts).
          *   *Wait, the prompt asks for "Popular-vote winner loses overall."*
          *   So, Popular = YES, District = NO.
          *   To get Popular YES: Table A (5) + some from B/C need to vote YES.
          *   To get District NO: Tables B & C must vote NO as *blocks*.
          *   This requires the "District Vote" to be determined by the *majority within the table*, not the sum of individuals.
          *   *Revised Mechanic:* Each table casts *one* district vote based on its internal majority.
          *   Setup:
              *   Table 1 (The Village Center): 6 people.
              *   Table 2 (The Outer Hamlets): 4 people.
              *   Table 3 (The High Alp Farmers): 2 people.
              *   Total: 12.
              *   District Majority needed: 2 out of 3 tables.
          *   Desired Outcome: Popular Vote = YES (e.g., 7-5), District Vote = NO (e.g., Table 1 says YES, Tables 2 & 3 say NO).
          *   How to engineer this? I can't force votes, but I can assign *interests* that make this likely.
          *   Table 1 (Center): Wants money/development. (Likely YES).
          *   Table 2 (Hamlets): Ambivalent but protective of tradition.
          *   Table 3 (Farmers): Directly impacted, likely NO.
          *   If Table 1 (6 people) votes 6-0 YES.
          *   Table 2 (4 people) votes 3-1 NO.
          *   Table 3 (2 people) votes 2-0 NO.
          *   Popular: 6 YES + 1 YES = 7 YES. 1 NO + 2 NO = 3 NO. (YES wins popular).
          *   District: Table 1 (YES), Table 2 (NO), Table 3 (NO). (NO wins districts).
          *   *Perfect.* I need to assign role cards that incentivize this split.

  4.  **Refining the "Drafting" Phase:**
      *   The prompt emphasizes "who ends up deciding what goes on the ballot."
      *   In Switzerland, an initiative committee drafts the text.
      *   Simulation: Give the drafting power to a subset of people, or make it a contested negotiation.
      *   Better: Give *two* competing groups the ability to draft counter-proposals. Or, have one "Initiative Committee" draft it, but others can propose amendments that require supermajorities.
      *   Let's keep it tight for 2 hours. One "Drafting Committee" of 3 people (selected randomly or volunteered). The rest are "Citizens." The Committee writes the question. The Citizens can petition to change the wording (costs effort/time). This mimics the hurdle of getting on the ballot.

  5.  **Addressing the "Novelist" Factor:**
      *   Novelists love nuance, backstory, and moral ambiguity. They will hate binary choices.
      *   They will want to discuss the *history* of the alp, not the vote mechanics.
      *   They will try to consensus-build instead of voting.
      *   *Mitigation:* Strict timekeeping. Role cards with specific economic incentives (greed vs. heritage).

  6.  **Addressing the "Unreproducible Features":**
      *   Time scale (real referendums take months/years).
      *   Information asymmetry (real voters don't know everything; writers will research).
      *   Consequences (no one actually loses money here).
      *   Anonymity (12 people is too small for true anonymity).

  7.  **Structuring the Debrief:**
      *   Deliberation (The drafting/debate phase).
      *   Aggregation (The voting/counting phase).
      *   The tension between the two (The double majority failure).

  8.  **Final Review against Constraints:**
      *   2 Hours? Yes, schedule needs to be tight.
      *   12 Adults? Yes, group sizes work.
      *   Double Majority? Yes, built into scoring.
      *   Unequal Districts? Yes (6, 4, 2).
      *   Popular Winner Loses? Yes, engineered via role cards.
      *   Secret Ballot? Yes, require slips of paper.
