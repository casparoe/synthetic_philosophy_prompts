      *   Who is more right? Dana is right that denying closure is a massive bullet that makes the theory very hard to live with (the "abominable conjunction"). Marcus is right that Tracking solves specific problems (Gettier, Skepticism) better than Justified True Belief (JTB). However, most contemporary epistemology has moved away from pure Nozickian tracking *because* of the closure problem (Move 1 & 3). Safety theories (Sosa/Pritchard) or Contextualism (DeRose/Lewis) often try to keep closure or explain it away differently.
