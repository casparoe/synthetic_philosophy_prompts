answer: |-
  # Colloquium Q&A Prep Sheet: "Halfer Credence, Thirder Stakes"

  **To:** Presenter
  **From:** Strategy Desk
  **Subject:** Damage Control for Friday's Colloquium
  **Context:** Formal Epistemology + Decision Theory + Anthropic Cosmology.
  **Goal:** Defend the distinction between *doxastic state* (1/2) and *decision weight* (Thirder-equivalent) without appearing to violate Expected Utility Theory or Accuracy Norms.

  ---

  ## I. High-Damage Objections (The "Kill Shots")

  ### 1. The Accuracy-First Objection (Formal Epistemologists)
  **The Question:** "You claim credence is 1/2. But if we adopt a proper scoring rule (like Brier score) and measure inaccuracy *per awakening*, the expected inaccuracy is strictly minimized by assigning 1/3 to Heads. If the normative function of credence is to represent the world accurately, and 1/3 does that job better than 1/2 across the relevant reference class of awakenings, aren't you just stipulating a scoring rule that favors your conclusion? Isn't 'score per experiment' an ad hoc restriction to save the Halfer view?"

  **The Two-Minute Reply:**
  "I grant that if the *sole* norm of belief is minimizing inaccuracy per temporal slice, 1/3 wins. But that presupposes the 'time-slice' is the locus of epistemic evaluation. I argue the locus is the *agent over time*.
  Consider a scientist running a long-term study. If she makes a measurement error every day for a week due to one faulty calibration, do we say she was 'seven times wrong' or 'wrong once'? Accuracy norms should track the success of the *cognitive system*, not the number of output events.
  My scoring rule isn't rigged; it reflects the fact that Beauty's epistemic goal is to navigate the *experiment*, not to maximize the number of true assertions uttered during it. If we score per experiment, 1/2 is accuracy-optimal. The dispute isn't about math; it's about whether epistemology is for time-slices or persisting agents."

  **Honest Note on Soft Spot:**
  This is your weakest flank. The "agent over time" move looks suspiciously like you're changing the definition of "truth" to save the view. If they press on *why* the experiment is the unit of evaluation rather than the awakening (which is the unit of experience), you risk circularity. **Retreat Strategy:** If pressed, concede that "credence" might be ambiguous. Propose distinguishing *Doxastic Credence* (1/2, experiment-scoped) from *Effective Probability* (1/3, awakening-scoped for decision making). Don't die on the word "credence."

  ### 2. The Expected Utility Violation (Decision Theorist)
  **The Question:** "Standard Decision Theory says $Action = \text{argmax} \sum P(World) \times U(Outcome)$. If your $P(Heads)$ is 1/2, but you accept a bet that is only rational if $P(Heads)$ is 1/3, you are either violating Maximization or you have bizarre utilities. If you say the utilities are different because the bet is offered twice on Tails, fine. But what if I offer you a bet *only on Monday*? The frequency asymmetry vanishes. Do you still bet as a Thirder? If yes, you're irrational. If no, your credence seems to depend on the betting protocol, which violates the Principal Principle."

  **The Two-Minute Reply:**
  "My view does *not* say 'always bet like a Thirder.' It says 'bet according to the expected utility calculated over the *full experiment*.'
  If the bet is offered *only on Monday*, the payoff structure changes. On Tails, there is still a Tuesday, but no bet. The frequency asymmetry in *payoffs* disappears. In that specific case, my view prescribes Halfer betting (1:1 odds).
  This doesn't violate the Principal Principle because the *evidence* hasn't changed, but the *consequences of action* have. My credence remains 1/2. The *decision weight* shifts because the link between belief and payoff is mediated by the protocol. I am not updating on the bet; I am calculating EV correctly given the bet's structure."

  **Honest Note on Soft Spot:**
  This is dangerous. If you admit your betting behavior changes based on the protocol, the Thirder in the front row (your friend) will pounce: "So your 'Thirder stakes' aren't robust? You're just a Halfer who does arithmetic?" You need to maintain that the *standard* Sleeping Beauty bet (offered every awakening) is the canonical case.
  **Crucial:** Ensure you don't sound like you're saying "Credence changes." Keep the mantra: "Credence is stable; the *stakes aggregation* is context-sensitive."

  ---

  ## II. Medium-Damage Objections (The "Grilling")

  ### 3. The Conditionalization Challenge (Formal Epistemologists)
  **The Question:** "On Sunday, $P(Heads) = 1/2$. On Monday morning, you wake up. You gain the indexical information 'I am awake now.' If $P(Heads)$ remains 1/2, you have updated on no information. If you claim 'I am awake' is null evidence, how do you handle cases where being awake *is* evidence (e.g., if Heads meant you were never woken)? This looks like a violation of Conditionalization."

  **The Two-Minute Reply:**
  "I deny that 'I am awake now' is null evidence. It is evidence. But it is *predictable* evidence.
  On Sunday, I know: 'If Heads, I wake Monday. If Tails, I wake Monday and Tuesday.'
  So, $P(Wake\_Monday | Heads) = 1$ and $P(Wake\_Monday | Tails) = 1$.
  Since the likelihood ratio is 1:1, the posterior equals the prior.
  This isn't a violation of Conditionalization; it's a correct application of it. The 'Thirder' intuition comes from treating the *awakenings* as the sample space rather than the *worlds*. I am conditioning on worlds, where the probability of experiencing *an* awakening is 1 in both cases."

  **Honest Note on Soft Spot:**
  This is actually your strongest technical ground, provided you stick to the "Self-Sampling Assumption" (SSA) logic. The risk is the "Centers" objection (Lewisian centers). If they argue that the *centered worlds* are the objects of belief, you lose.
  **Defense:** Stick to uncentered propositions for credence. "I am awake" is a centered proposition, but my credence is in the uncentered "The coin is Heads."

  ### 4. The Reference Class Problem (Senior Faculty / Cosmology)
  **The Question:** "In cosmology, we deal with selection effects constantly. Your view sounds like you're mixing SSA (for credence) and SIA (for betting). SSA says 'I am a random observer from the set of observers in my world.' SIA says 'I am a random observer from the set of all possible observers.' Thirders effectively use SIA. Halfers use SSA. You seem to want SSA probabilities with SIA betting weights. Is this coherent, or are you just cherry-picking anthropic principles to get the result you want?"

  **The Two-Minute Reply:**
  "It's not cherry-picking; it's distinguishing *existence* from *interaction*.
  SSA is correct for *credence* because my existence isn't stochastic across worlds—I exist in both.
  However, for *decision theory*, I must account for the *measure* of my interactions. On Tails, there are two 'interaction points' (awakenings). On Heads, one.
  In cosmology, this is the difference between 'What is the probability the universe is Type A?' (Credence) and 'How many observations of Type A will I make?' (Stakes).
  My view is coherent: Use SSA to judge the world, use the count of observer-moments to judge the utility. It's not a mix of assumptions; it's a division of labor."

  **Honest Note on Soft Spot:**
  The Senior Faculty member knows this literature better than you. If they cite the "Presumptuous Philosopher" problem, you might struggle.
  **Defense:** Emphasize that you are not making cosmological claims, only claims about *rational agency within a known protocol*. Don't let them drag you into the Doomsday Argument.

  ---

  ## III. The "Hope Nobody Asks" (The Diachronic Trap)

  ### 5. The Sunday Night Pre-Commitment
  **The Question:** "It's Sunday night. You know the protocol. I offer you a bet now: 'Pay me \$1.20. If Tails, I give you \$1 on Monday and \$1 on Tuesday. If Heads, I give you \$1 on Monday.' Do you take it?
  If **Yes**: You are acting as if $P(Tails) > 1/2$ (since cost is 1.20, return is 1 or 2). You are a Thirder.
  If **No**: On Monday, you will accept the *same* bet (aggregated). How can you be rational on Monday but not Sunday? This is a diachronic Dutch Book."

  **The Two-Minute Reply:**
  "This is the hardest question, and here is the distinction: On Sunday, I am evaluating the *package*. On Monday, I am evaluating the *instance*.
  On Sunday, I calculate: $0.5 \times (2 - 1.20) + 0.5 \times (1 - 1.20) = 0.4 - 0.1 = 0.3$. I accept.
  On Monday, I am offered a slice of that package. I accept the slice *because* I know it's part of a package that is favorable.
  There is no inconsistency. The Sunday calculation sums the utilities. The Monday calculation acknowledges the current utility is part of that sum.
  I am not changing my mind; I am executing a plan. The 'Dutch Book' only works if you assume the Monday agent ignores the Tuesday payoff."

  **Honest Note on Soft Spot:**
  **This is where you might actually lose.** If the Monday bet is offered *in isolation* (i.e., "Take this bet now, and I guarantee no other bets will ever be offered"), your view might fracture.
  **Retreat:** If pressed hard here, concede that "Rationality requires pre-commitment." Argue that the Monday agent is *constrained* by the Sunday plan. If you didn't pre-commit, you might be vulnerable. **Better:** Admit that without pre-commitment, there is a tension, but that tension arises from the *indexical uncertainty*, not the credence.

  ---

  ## IV. Strategic Retreat & Closing Advice

  **Where to Retreat:**
  If the Accuracy-First group corners you on the Brier Score, **do not defend "1/2 is more accurate per awakening."** You will lose that math.
  **Instead:** Retreat to **Pragmatism**.
  *Say:* "Perhaps 'credence' is the wrong word for the 1/2 attitude if we define credence strictly by awakening-accuracy. Let's call it 'World-Confidence.' My claim is not that 1/2 minimizes local error, but that 1/2 is the correct guide for *world-directed action* when utility is aggregated globally. If you define credence as 'that which minimizes local Brier score,' then fine, call the 1/3 number 'credence.' But then you must admit 'credence' is not the sole guide to rational action."
  *Why:* This turns a metaphysical defeat into a terminological victory. You save the *action-guiding* core of your thesis.

  **Handling Your Friend (The Thirder):**
  She knows your kitchen-table arguments. She will know where you fudged the math.
  *Strategy:* Pre-empt her. In your closing remarks, say: "I know my friend in the front row thinks I'm smuggling the Thirder conclusion in through the utility function. She's right that the *output* is the same. But the *explanation* matters for cases where frequency and credence come apart. We agree on the bet; we disagree on *why*."
  *Why:* This validates her without conceding the point. It makes you look magnanimous and her look dogmatic.

  **Final Check:**
  1.  **Don't** say "Credence doesn't matter for betting." (Epistemologists will riot).
  2.  **Do** say "Credence enters the betting equation alongside stake-frequency."
  3.  **Don't** claim 1/2 minimizes inaccuracy per awakening.
  4.  **Do** claim 1/2 minimizes inaccuracy per *agent-history*.

  Good luck. Keep your eyes off the front row until the Q&A starts.
