prompt: |-
  Next month I'm giving a departmental colloquium defending a position my oldest friend has taken to calling "halfer about credence, thirder about stakes," and I need to be ready for what this particular room will throw at me. The audience is mostly formal epistemologists — people for whom Dutch book arguments, accuracy-dominance results, and Jeffrey conditioning are the bread and butter of rationality — plus one decision theorist and one senior faculty member who works on anthropic reasoning in cosmology (selection effects, doomsday-style arguments). My thesis: Sleeping Beauty's credence in Heads on waking should remain 1/2, yet she should still accept the bets thirders say she should accept, because the standard betting and Dutch book arguments against halfers covertly aggregate utility across her awakenings in a way that is appropriate to a bookie facing multiple betting opportunities but not to a single subject whose degree of belief is being evaluated. On my view the halfer/thirder dispute is really a dispute about the object of rational evaluation — the whole experiment viewed from Sunday versus the awakening viewed from inside — and once that distinction is on the table, the thirders' betting results can be conceded in full without conceding the credence. The background: my friend and I spent most of last weekend arguing about exactly this at her kitchen table, she remains an utterly convinced thirder, and she will be sitting in the front row with her arms crossed.

  Draft my Q&A prep sheet: the objections I'll actually get from this audience — not the generic ones recycled from internet forums — ordered by how much damage each would do, phrased the way the formal epistemologists would put it (and the decision theorist and the anthropic-reasoning person in their own vocabularies), each with a two-minute reply and an honest note on where the reply is soft. I'm especially worried about the accuracy-first people: if credences are supposed to minimize expected inaccuracy, and 1/3 is closer than 1/2 to the truth across awakenings, doesn't that settle the matter without any talk of betting — and if I respond that inaccuracy should be scored once per experiment rather than once per awakening, am I not just smuggling my conclusion into the scoring rule? Include the question I'm hoping nobody asks, and tell me frankly whether my position survives the decision theorist's asking what happens when the two awakenings carry different stakes, or when the bet is offered only on Monday. If some part of the view is genuinely indefensible, say which part I should quietly retreat from before I'm standing at the podium.
