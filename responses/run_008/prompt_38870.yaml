answer: |-
  That is a cheap shot if you treat it as a knockout blow, because it attacks a straw man of virtue that no serious Aristotelian holds. Aristotle never claimed character was a magical armor impervious to extreme external pressure, nor did he imagine the average seminary student possessed the *phronesis* of a sage. What that study demonstrates is not the absence of character, but the fragility of *habituation* under duress; most people operate at the level of *enkrateia* rather than full *arete*, meaning they still feel the pull of competing goods—in this case, the duty to be punctual versus the duty to help. If your protagonist's kindness evaporates solely because she is late, you aren't proving kindness is fictional, you are proving her virtue is immature or poorly integrated, which is a far more interesting conflict for a novel than the nihilistic claim that no one is kind at all.
