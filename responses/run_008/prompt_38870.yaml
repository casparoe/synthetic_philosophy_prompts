      *   Situationism (Doris, Harman) challenges virtue ethics using empirical psychology (like the Good Samaritan study).
      *   Neo-Aristotelian response to situationism: Virtue isn't all-or-nothing; it's a developmental track. Most people aren't *phronimoi* (fully virtuous sages). The study shows most people aren't fully virtuous, not that virtue doesn't exist. Also, virtue involves managing situations, not just ignoring them. Time pressure is a genuine obstacle to practical reasoning.
