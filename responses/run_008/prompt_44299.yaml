  **DRAFT FOR JOINT REVIEW**
  **Subject:** Toward a Shared Taxonomy of Letter Identity
  **Authors:** [Position A] & [Position B]
  **Date:** October 2023
  **Status:** Pre-Ratification Draft

  ### Preamble: Diagnostic Note on Terminology
  Before stating our positions, we acknowledge that a portion of our two-year debate stems from divergent definitions of "essence" and "letter."
  *   **Ontological Essence:** For one of us, this refers to the *genealogy of form* (how it came to be).
  *   **Functional Essence:** For the other, this refers to the *conditions of recognition* (what allows it to work).
  *   **Agreement:** We agree to proceed without attempting to force a unified definition of these terms. We accept that we are answering two different questions: "What is the historical constraint on this form?" vs. "What is the systemic requirement for this sign?"

  ---

  ### I. Agreed Claims (Phenomenology & Constraints)
  *Both signatories affirm the following observations as the baseline phenomena any theory of typography must account for.*

  1.  **Invariance Across Style:** Human readers reliably identify the grapheme <a> across radically different instantiations (e.g., Carolingian minuscule, Blackletter, Geometric Sans, handwritten print) without conscious deliberation. Any theory must explain this cross-font recognition without dismissing outliers as "errors."
  2.  **The Relational Constraint (LetterSpirit):** We endorse Douglas Hofstadter's insight in *LetterSpirit*: the identity of a specific letterform is partially determined by the design of its siblings within the same typeface. An 'a' cannot be defined in isolation; its features are adjusted to maintain distinction from 'o', 'd', 'e', and 's' within the specific stylistic grid of the font.
  3.  **The Historical Fact:** The current Latin alphabet is the product of sedimented writing gestures. We agree that the *ductus* (the sequence and direction of strokes) explains the *current distribution* of forms (e.g., why the tail of the 'a' exists). We disagree only on whether this history is *constitutive* of the letter's identity or merely *explanatory* of its current shape.
  4.  **The Legibility Threshold:** Regardless of origin, if a shape fails to function within a readable system of distinctions, it fails as typography. Conversely, if a shape functions perfectly within a system but violates historical gesture, it succeeds as communication. We disagree on whether the latter success qualifies it as a "true letter."

  ---

  ### II. Statement of Disagreements
  *The following table outlines the specific theoretical divergences. Each party accepts the wording in their respective column as a fair characterization of their view.*

  | Feature of Debate | Position A (Stroke Theory) | Position B (Systems Theory) |
  | :--- | :--- | :--- |
  | **Source of Identity** | Identity is derived from the **trace of human gesture**. A letter is a fossilized movement. If a shape cannot be mapped to a plausible broad-nib or pointed-pen motion, it lacks the ontological status of a letter. | Identity is derived from **systemic contrast**. A letter is a node in a network of differences. If a shape maintains the necessary distinctions to function in the code, it is a letter, regardless of gestural plausibility. |
  | **Role of History** | History is **constitutive**. The reason an 'a' is an 'a' is because of the specific evolutionary path of handwriting. To sever the link to ductus is to create a symbol, not a letter. | History is **causal, not definitional**. Handwriting explains how we arrived at these shapes (paleontology), but it does not dictate what the shapes *are* now. Typography is a technology that has outgrown its manual origins. |
  | **The "Impossible" Form** | A geometrically constructed 'a' that no pen could produce is an **'a-shaped object'**. It borrows the cultural capital of the letter without the underlying reality. | A geometrically constructed 'a' is a **valid implementation**. The "pen" is a metaphor for the tool, not a physical constraint. Digital tools have their own ductus. |
  | **Scope of Theory** | Typography is **"writing with prefabricated letters"** (Noordzij). It belongs to the domain of calligraphy and kinetic memory. | Typography is **visual coding**. It belongs to the domain of information design and semiotics. |

  ---

  ### III. Cruxes & Pre-Registered Predictions
  *We have selected five concrete cases where our theories yield different interpretations or expectations. We commit to reviewing the evidence below without moving the goalposts.*

  #### Case 1: The Impossible Geometric 'a'
  **Scenario:** A typeface designed where the 'a' is constructed from perfect circles and tangent lines that physically cannot be produced by a continuous pen stroke (e.g., a sharp inward cusp that requires lifting the pen or reversing direction impossibly).
  *   **Prediction A:** Readers will process this character with measurable hesitation or categorize it subconsciously as a "symbol" rather than a letter. It will feel "cold" or "alien" because it violates kinetic memory.
  *   **Prediction B:** Reading speed and accuracy will remain unchanged provided the contrast with 'o' and 'd' is maintained. Any feeling of "alienness" is a stylistic preference, not a cognitive failure of identity.

  #### Case 2: Single-Story vs. Double-Story 'a'
  **Scenario:** Comparing the two-story Roman 'a' (found in most serif texts) with the single-story 'a' (found in handwriting and many sans serifs).
  *   **Prediction A:** The double-story 'a' is the **prototypical letter**; the single-story is a simplified variant or a distinct glyph used for specific registers (e.g., children's texts). They are not fully identical; the single-story is a "reduction" of the true form.
  *   **Prediction B:** They are **allophones** of the same grapheme. Neither is more "true." Their validity is determined entirely by the surrounding typeface design. In a geometric sans, the single-story is the correct 'a'; forcing a double-story would be the error.

  #### Case 3: The Enclosed Counter (The "Bubble")
  **Scenario:** A design experiment where the enclosed counter of the 'a' is opened (making it closer to a 'u' or 'n') but other contextual cues (weight, x-height, neighbors) are adjusted to maintain distinction.
  *   **Prediction A:** The enclosed counter is **essential** because it is the result of the specific loop-closure gesture in the ductus. Removing it breaks the link to the writing motion that defines the character.
  *   **Prediction B:** The counter is **contingent**. It is merely one historical solution to distinguishing 'a' from 'u'/'n'. If the system provides other distinctions (e.g., a specific tail, weight difference), the enclosure is not required for identity.

  #### Case 4: Scripts Without Handwriting Traditions (e.g., Cherokee, Constructed Scripts)
  **Scenario:** Analyzing the syllabary of Cherokee (created by Sequoyah based on printed Latin/Greek letters but without a prior cursive tradition) or constructed scripts like Klingon.
  *   **Prediction A:** These are **typographic systems masquerading as writing**. Without the underlying gestural tradition, they lack the "life" of true script. They are codes, not letters in the strict Noordzij sense.
  *   **Prediction B:** These are **full writing systems**. They prove that letter identity is purely systemic. The fact that they function perfectly for native readers without a gestural history disproves the claim that ductus is constitutive of identity.

  #### Case 5: The Word Superiority Effect (Psycholinguistics)
  **Scenario:** Evidence that humans recognize letters faster and more accurately when embedded in real words than in isolation or non-words.
  *   **Prediction A:** This supports the **gestural flow** hypothesis. We read by simulating the motor program of writing the word. The "word" is the primary unit of gesture, and the letters are recognized as parts of that motion sequence.
  *   **Prediction B:** This supports the **top-down systemic** hypothesis. We read by activating the lexical network. The letter is recognized because the brain predicts it based on the system of language, not because of simulated motor movement.

  ---

  **Signatures:**

  _________________________ (Position A)

  _________________________ (Position B)
