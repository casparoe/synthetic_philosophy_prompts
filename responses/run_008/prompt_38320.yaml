  *Final check on the "Devastating Scene":* The prompt asks if I conclude part is merely verbal, say which part. I will identify the quantifier variance on "exists" as the verbal part, but the modal robustness as the real part. This allows the novelist to have a scene where they realise they are arguing about language *and* reality.

