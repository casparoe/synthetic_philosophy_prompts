  **JOINT STATEMENT ON THE ONTOLOGY OF SPACETIME**

  **Undersigned:**  
  Dr. E. A. Vance (Substantivalist)  
  Dr. J. M. Corcoran (Relationalist)

  **Date:** 14 June 2024  
  **Subject:** Findings of the Adversarial Collaboration on Spacetime Ontology (2023–2024)

  ### Preamble

  We, the undersigned, having engaged in a year-long adversarial collaboration regarding the ontological status of spacetime, hereby submit this joint statement. Our aim has not been to force a premature consensus where none exists, but to isolate the empirical and logical core of our agreement from the metaphysical residue of our disagreement. We acknowledge that while our interpretations of the formalism diverge, our commitment to the rigour of the physics is shared. The following document is intended to withstand scrutiny from specialists in the philosophy of physics.

  ### Section I: Agreed Claims

  1.  **On Newton's Bucket and Two Globes:** We agree that Newton's bucket experiment and the thought experiment of the two globes connected by a cord successfully demonstrate that accelerated motion (specifically rotation) is physically distinguishable from uniform velocity. The concave surface of the water and the tension in the cord are inertial effects that cannot be explained solely by reference to the relative motion of the water to the bucket, or the globes to one another. There is an objective asymmetry between inertial and non-inertial frames.
  2.  **On the Failure of Naive Relationism:** We agree that a relationism which reduces spatial facts *solely* to the relations between material bodies (in the Newtonian sense) is untenable. It cannot account for the inertial effects in the bucket without appealing to additional structure. Mach's specific proposal—that inertia arises from induction by the distant fixed stars—is not fully vindicated by General Relativity (GR).
  3.  **On General Relativity and the Metric Field:** We agree that in General Relativity, the metric field ($g_{\mu\nu}$) is a dynamical entity. It possesses degrees of freedom independent of matter sources, as evidenced by the existence of gravitational waves and vacuum solutions (e.g., Minkowski or de Sitter spacetimes). The metric field carries energy and momentum and interacts causally with matter. It is not merely a bookkeeping device for the relations of material particles.
  4.  **On Mach's Principle:** We agree that 'Mach's Principle' is not a single, well-defined thesis. We concede that GR is Machian in the sense that the geometry of spacetime is not fixed *a priori* but is determined by field equations coupled to matter/energy. However, we agree that GR is anti-Machian in the sense that it permits solutions where spacetime structure exists in the absence of matter (vacuum solutions). Thus, Mach's hope that matter would wholly determine inertia is not realised in standard GR.
  5.  **On Empirical Equivalence:** We agree that, for all actual observational purposes within our universe, our respective positions yield identical empirical predictions. Our dispute is not regarding the correctness of the field equations, but regarding the ontological commitments required to interpret them.

  ### Section II: Table of Residual Disagreements

  The following table outlines the specific cruxes upon which we remain divided. For each crux, we have specified the thought experiment or argument bearing on the issue, and the specific prediction or commitment each of us maintains.

  | Crux | The Scenario / Argument | Dr. Vance's Commitment (Substantivalist) | Dr. Corcoran's Commitment (Relationalist) |
  | :--- | :--- | :--- | :--- |
  | **1. The Empty Universe** | **Scenario:** A universe containing only two globes connected by a cord, rotating about their common centre of mass, with no other matter or radiation present (a vacuum solution).<br><br>**Question:** Is there tension in the cord? Is this a physically possible world? | **Prediction:** This is a physically possible world. There is tension in the cord. The rotation is defined relative to the inertial structure of spacetime itself, which exists independently of the matter.<br><br>**Ontological Claim:** Spacetime (or the metric field) is a substance that can exist without material content. | **Prediction:** This scenario is either physically impossible or ill-defined. Without external matter to define inertia, 'rotation' lacks physical meaning. If the theory predicts tension, the theory is describing a property of the field, not a relation of bodies.<br><br>**Ontological Claim:** A universe without matter is a limiting case of the theory, not a genuine physical possibility. Inertia must be relational. |
  | **2. The Hole Argument** | **Argument:** Consider a region of spacetime (the 'hole') devoid of matter. Apply a diffeomorphism that shifts the metric field values within the hole while leaving them unchanged outside. If manifold points have independent identity, this creates two distinct physical models that are observationally indistinguishable.<br><br>**Question:** What does this establish about manifold points? | **Prediction:** The Hole Argument refutes *Manifold Substantivalism* (the view that points have inherent identity), but not *Metric Substantivalism*. We accept 'Sophisticated Substantivalism': points are not individuals, but the metric field is a real object.<br><br>**Commitment:** Indeterminism is avoided by denying haecceitism, not by denying the existence of the field. | **Prediction:** The Hole Argument demonstrates that manifold points have no physical reality whatsoever. The metric field should be treated as a physical field *on* a background of events, not as spacetime itself.<br><br>**Commitment:** The only physical realities are the coincidences of field interactions. The manifold is a mathematical artefact. |
  | **3. The Shift Argument** | **Argument:** Imagine shifting the entire material content of the universe five feet to the left in absolute space, leaving all relative distances unchanged.<br><br>**Question:** Is this a distinct possible world? | **Prediction:** Yes. It is a distinct metaphysical possibility, even if empirically indistinguishable. Spacetime provides a 'container' such that location is a genuine property.<br><br>**Commitment:** Leibniz is wrong; there are non-qualitative differences between worlds. | **Prediction:** No. This is a pseudopossibility. If all relations remain identical, the world is identical. To assert otherwise is to posit an unobservable surplus structure.<br><br>**Commitment:** Leibniz is right; to posit a difference without a discernible difference is metaphysical excess. |

  ### Section III: Postscript on Verbal Dispute

  We have identified a component of our disagreement that appears to be merely verbal, though it masks a deeper divergence in modal intuition.

  **The Verbal Component:**  
  We agree that the term 'exists' is being employed with different quantifier commitments. When Dr. Vance asserts "Spacetime exists," she is using a quantifier that ranges over fundamental fields that provide the causal structure for events. When Dr. Corcoran asserts "Spacetime does not exist," he is using a quantifier that ranges only over material particulars and their direct interactions. If we agree to define 'existence' as "being a fundamental variable in the best deductive system of the world," we both agree the metric field exists. If we define it as "being a material particular," neither of us believes spacetime exists.

  **The Non-Verbal Component:**  
  However, we acknowledge that the dispute is not *merely* verbal. The disagreement persists regarding **modal robustness**. Dr. Vance maintains that the metric field could have been different even if the material distribution were identical (as per Crux 1). Dr. Corcoran maintains that the metric field supervenes on the material distribution (or the network of events) such that no such variation is possible. This is a genuine disagreement about the counterfactual structure of reality, which language reform alone cannot dissolve.

  **Signed,**

  *E. A. Vance*  
  *J. M. Corcoran*

  ***

  ### Authorial Note on the "Devastating Scene"

  For the purpose of your novel's climax, the most quietly devastating realisation for the characters lies in **Section III**.

  If they discover that their year-long war has been fought over the scope of the word "exists" (the verbal component), it undermines the emotional weight of their conflict. However, the twist is that **even after agreeing on the language, the modal disagreement remains.**

  The scene gains its power if they realise that they agree on the *physics* (the equations, the predictions, the status of the metric field as fundamental), but they cannot agree on the *metaphysics of possibility*. Vance believes the empty universe is a **possibility**; Corcoran believes it is a **nonsense**.

  The devastation comes from the realisation that no experiment can ever settle Crux 1. We cannot create an empty universe to test it. Therefore, their dispute is rationally undecidable. They are left with two coherent, empirically adequate, logically consistent worldviews that are mutually incompatible. They must choose based on aesthetic or pragmatic grounds (parsimony vs. explanatory power), not truth. That is the true burden of the philosopher of physics.
