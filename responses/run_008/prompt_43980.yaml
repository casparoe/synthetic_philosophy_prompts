answer: |-
  # Lesson Plan: The Value of Information (Good's Theorem)
  **Course:** Upper-Level Undergraduate Seminar (Bayesian Epistemology/Decision Theory)  
  **Class Size:** 12 Students  
  **Duration:** 75 Minutes  
  **Topic:** Good's Theorem on the Value of Information  

  ---

  ## I. Materials List (Graduate-Student Budget)
  *   **Playing Cards:** 2 standard decks (remove Jokers). 
      *   *Deck A:* 15 Red cards, 5 Black cards (mark backs with a small red dot sticker).
      *   *Deck B:* 5 Red cards, 15 Black cards (mark backs with a small blue dot sticker).
      *   *Note:* Prepare these before class.
  *   **Coin:** 1 quarter (for the hidden deck selection).
  *   **Die:** 1 ten-sided die (d10) or a random number generator app on your phone projected to the screen.
  *   **Paper:** 12 "Score Sheets" (half-sheet of paper per student) + 1 Master Scoreboard (whiteboard).
  *   **Incentives:** 1 large chocolate bar (or equivalent treat) for the highest scorer; "Bragging Rights" title for the runner-up.

  ---

  ## II. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Explain rules, distribute score sheets, calibrate payoffs. |
  | **05–10** | **Prediction** | **Crucial Step:** Elicit prior beliefs. Vote on who will win (Peekers vs. Non-Peekers). Record on board. |
  | **10–25** | **Base Phase** | 3 Rounds of standard play. (Costless info, full agency). |
  | **25–40** | **Twist Phase** | 3 Rounds mutating assumptions (Cost, Agency, Strategic). |
  | **40–50** | **Tally** | Calculate scores. Reveal the "Winner." Compare to initial vote. |
  | **50–75** | **Debrief** | Map twists to theorem assumptions. Board work: The Numerical Proof. Address the "Expectation vs. Reality" gap. |

  ---

  ## III. Game Rules & Payoff Scheme

  ### The Setup
  1.  **The State:** At the start of each round, you (the instructor) flip a coin behind a folder. 
      *   **Heads:** You use **Deck A** (75% Red, 25% Black).
      *   **Tails:** You use **Deck B** (25% Red, 75% Black).
      *   *Students do not know which deck is active.*
  2.  **The Draw:** You draw one card from the active deck.
  3.  **The Bet:** Students must predict the color of the card (Red or Black).
  4.  **The Payoff:** 
      *   Correct Guess: **+10 Points**.
      *   Incorrect Guess: **–10 Points**.
      *   *Note:* Without information, the probability of Red/Black is 50/50 (averaged across decks). The expected value of a random guess is 0.

  ### The Choice (Peek vs. Blind)
  Before betting, each student marks their score sheet:
  *   **BLIND:** You bet based only on the prior (50/50).
  *   **PEEK:** You receive a "Witness Signal" before betting. 
      *   *Mechanism:* You roll the d10 (or you call on the student to generate a random number 1–10).
      *   *Accuracy:* The signal is **80% reliable**. 
          *   If Deck A is active: 1–8 = "Signal Red", 9–10 = "Signal Black".
          *   If Deck B is active: 1–8 = "Signal Black", 9–10 = "Signal Red".
      *   *Constraint:* If they choose PEEK, they **must** update their bet according to the signal (Rationality Constraint). If Signal says Red, they must bet Red.

  ### The Twist Phase Rules
  In the second half, introduce one constraint per round:
  1.  **Round 4 (The Anxiety Tax):** If a student chooses PEEK, subtract **5 points** from their final score *regardless of the bet outcome*. (Violates: Costless Information).
  2.  **Round 5 (The Fatalist):** If a student chooses PEEK, they are **forced to bet Red**, even if the signal says Black. (Violates: Ability to Act on Information).
  3.  **Round 6 (The Signaling Game):** Students pair up. If Student 1 chooses PEEK, their Partner (Student 2) is told "Partner Peaked" before Student 2 bets. They bet against each other (Zero Sum). (Violates: Single Agent / Fixed Environment).

  ---

  ## IV. The Debrief (Script & Board Work)

  ### 1. The Scoreboard Reveal (5 mins)
  *   Ask: "Did the 'Always Peek' students score higher than the 'Always Blind' students in the Base Phase?"
  *   *Likely Outcome:* The Peekers *should* have higher average points, but due to variance (only 3 rounds), a Blind student might have gotten lucky.
  *   *Action:* Acknowledge the variance immediately. "If a Blind student won, did Good's Theorem fail? No. The theorem is about *expectation*, not *realization*."

  ### 2. Mapping the Twists (10 mins)
  Draw Good's Theorem inequality on the board:
  $$E[\max_a E[U|a, E]] \geq \max_a E[U|a]$$
  *(Expected Utility with Evidence $\geq$ Expected Utility without Evidence)*

  Ask students to map the Twist Phase failures to the math:
  *   **Twist 1 (Anxiety Tax):** Violates **Costless**. The term $E$ now has a cost $c$. If $c >$ Value of Info, the inequality flips. *Real-world parallel:* Medical testing anxiety.
  *   **Twist 2 (Fatalist):** Violates **Agency** ($\max_a$). You received $E$, but you were forbidden from choosing $\max_a$. You were forced into a suboptimal action. *Real-world parallel:* Knowing a disaster is coming but being powerless to stop it.
  *   **Twist 3 (Signaling):** Violates **Single Agent**. Your action ($a$) changed the other player's belief, which changed your payoff function $U$. *Real-world parallel:* Negotiation, poker, dating.

  ### 3. The Numerical Proof (10 mins)
  *Keep this small and clean.*
  *   **States:** $\theta \in \{Red, Black\}$. Prior $P(Red) = 0.5$.
  *   **Action:** Bet Red or Black. Payoff: Win \$1, Lose \$1.
  *   **No Info:** 
      *   $EU(\text{Bet Red}) = 0.5(1) + 0.5(-1) = 0$.
      *   $EU(\text{Bet Black}) = 0$.
      *   **Max EU = 0.**
  *   **With Info (Signal $s$):** Accuracy $q = 0.8$.
      *   $P(s_{Red} | Red) = 0.8$.
      *   By Bayes, if you see $s_{Red}$, posterior $P(Red | s_{Red}) = 0.8$.
      *   $EU(\text{Bet Red} | s_{Red}) = 0.8(1) + 0.2(-1) = 0.6$.
      *   Since signal is symmetric, $EU(\text{Bet Black} | s_{Black}) = 0.6$.
      *   You always get the signal that matches the likely state (80% of the time you get useful signal, 20% you get misleading, but you always bet on the likely).
      *   **Expected EU with Info** = $0.6$.
  *   **Conclusion:** $0.6 > 0$. Information has positive value.

  ---

  ## V. Two Honest Notes

  ### Note 1: What Will Predictably Go Wrong
  1.  **The "Luck" Problem:** In a 3-round Base Phase, variance is massive. A student who refuses to peek might guess correctly 3 times (30 points). A student who peeks might get the 20% misleading signal 3 times and lose (potentially -30 points). **Mitigation:** Do not let the empirical score "prove" the theorem. Use the score to *problematize* the expectation. Explicitly tell them: "If the Blind student wins, it is because we are looking at a sample of size 3, not an expectation over infinite trials."
  2.  **The "Fun" Utility:** Students may choose to PEEK in the Base Phase simply because rolling the die is fun, or they want to see the card. This introduces an unmodeled intrinsic utility for information ($U_{curiosity}$). Good's Theorem assumes utility is only over *final outcomes*. If they enjoy the process of knowing, they are violating the "stable preferences over outcomes" assumption. **Mitigation:** In the debrief, flag this. "If you peeked because it felt cool, you added a term to the utility function that the theorem doesn't account for."
  3.  **Deck Prep Errors:** If you miscount the Red/Black cards in the decks, the prior is no longer 50/50, and the "fair bet" baseline shifts. **Mitigation:** Count the cards twice before class. Use stickers on the backs to ensure you don't mix the decks during the frantic game.

  ### Note 2: The Theoretical Limitation (Expectation vs. Realization)
  You asked which feature of the theorem the activity cannot reproduce. It is the **Law of Large Numbers**.
  Good's Theorem is a statement about *ex ante* expectations ($E[\cdot]$). It guarantees that *before* you see the signal, your expected utility is higher. It does **not** guarantee that *after* the signal, you will be better off in any specific instance (you might get misleading info), nor does it guarantee you will win in a finite session.
  *   **The Gap:** The classroom game is a single sample path. The theorem is about the average of all possible sample paths.
  *   **How to Supply it:** You cannot fix this with more rounds in a 75-minute class. You must fix it in the **Debrief**. You must explicitly state: "The theorem does not promise you will win today. It promises that if you played this game forever, the Peekers would bankrupt the Blind." 
  *   **Recommendation:** Do not try to pool student draws to "make the expectation visible" by aggregating scores. That creates a false sense of empirical proof. Instead, use the board work (Section IV.3) to show the *mathematical necessity* of the result. The game creates the intuition; the algebra provides the proof. Do not conflate the two.

  ---

  ## VI. Instructor Cheat Sheet (The Math for the Board)

  **Write this exactly as shown during the Debrief:**

  1.  **Prior:** $P(H) = 0.5, P(T) = 0.5$.
  2.  **Payoff:** Correct = +1, Wrong = -1.
  3.  **No Info:** 
      $$EU = 0.5(1) + 0.5(-1) = 0$$
  4.  **Info (Accuracy $p=0.8$):**
      *   Prob of Signal matching State = 0.8.
      *   Prob of Signal mismatching State = 0.2.
      *   If Signal says H, we bet H.
      *   $EU(\text{Info}) = P(\text{Match}) \times (+1) + P(\text{Mismatch}) \times (-1)$
      *   $EU(\text{Info}) = 0.8(1) + 0.2(-1) = 0.6$
  5.  **Value of Info:** $0.6 - 0 = 0.6$.
  6.  **Condition:** This holds *if and only if* cost = 0 and we can act on the signal.
