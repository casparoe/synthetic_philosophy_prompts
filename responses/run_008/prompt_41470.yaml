answer: |-
  This is a classic philosophical dispute known as **The Paradox of Fiction**, but framed through the lens of working writers. It's a fantastic argument because both Marta and Dan are half-right, but they are arguing from different disciplines: Marta is arguing from **philosophy and craft**, while Dan is arguing from **psychology and experience**.

  Here is the move-by-move breakdown of who is right, where they go wrong, and the synthesis you need as a novelist.

  ### Move 1: The Existence Claim
  **Dan:** "I cried for two days... it was a compliment."
  **Marta:** "Impossible... you know the woman doesn't exist... you can't feel real grief for someone you know isn't there."

  *   **Who is right?** **Dan.**
  *   **Why:** Marta is relying on a strict cognitive theory of emotion: *To feel grief, I must believe the object of grief exists.* While logically sound, it is psychologically false. Human beings feel fear when watching a horror movie, even though they know the monster isn't real. We feel anxiety about a job interview next week for an event that hasn't happened (and might not exist yet). The brain's emotional center (the limbic system) does not always wait for the prefrontal cortex to verify reality before firing.
  *   **The Flaw:** Marta is defining "grief" too narrowly. She is defining it by its *cause* (a real death), whereas Dan is defining it by its *symptom* (tears, heaviness, longing). In art, the symptom is the only thing that matters.

  ### Move 2: The "Cops and Robbers" Analogy
  **Dan:** "The tears were real... thoughts were about her... you're telling me I don't know my own emotions."
  **Marta:** "It's like a kid playing cops-and-robbers... caught up in a game of being afraid."

  *   **Who is right?** **Dan.**
  *   **Why:** Marta's analogy fails on the metric of **consequence**. As Dan points out later, a child playing cops-and-robbers stops being afraid the second the game ends. They run inside for cookies. If reading were merely a "game of being afraid," the emotion would vanish upon closing the book. The fact that Dan's mood persisted for two days indicates a chemical and psychological shift that outlasted the stimulus.
  *   **The Flaw:** Marta is trying to diminish the validity of the emotion by labeling it "play." But play is how mammals practice survival and empathy. Just because it is a simulation doesn't mean the neural pathways fired aren't real.

  ### Move 3: Avoidance Behavior
  **Dan:** "Kids' games don't wreck your week... why does he steer clear of rereading books with sad endings... Real avoidance for a pretend feeling makes no sense."

  *   **Who is right?** **Dan.**
  *   **Why:** This is the strongest empirical evidence in the argument. Behavioral psychology tells us that avoidance is a primary response to trauma or genuine distress. We avoid ex-lovers, graveyards, and songs that remind us of loss. If Dan avoids certain books, his brain has categorized them as "painful stimuli." You do not build a defense mechanism against something you intellectually know is fake unless your body has registered it as a threat or a loss.
  *   **The Flaw:** None here. Dan has successfully proven that the *impact* is real, regardless of the *source*.

  ### Move 4: Craft vs. Content
  **Marta:** "Emotion is real but its object is wrong: he's responding to the execution... the character is just the handle."
  **Dan:** "Exactly backwards... moments he's aware of craft are the moments the feeling evaporates... noticing technique and being moved are mutually exclusive."

  *   **Who is right?** **They are both right, but talking about different moments.**
  *   **Why:**
      *   **Marta is right about the *Writer's* perspective:** The tears *were* caused by the execution. A badly written death doesn't make us cry. Therefore, the craft is the *cause*.
      *   **Dan is right about the *Reader's* perspective:** The tears were not *about* the craft. If Dan thinks, "Wow, the pacing here is masterful," the spell breaks. Immersion requires the invisibility of the mechanism.
  *   **The Flaw:** Marta is confusing the *mechanism* with the *object*. Yes, the sentences caused the tears (mechanism), but the tears were for the character (object). To say the tears were "for the sentences" is like saying you are hungry "for the cooking" rather than "for the food." One enables the other, but they aren't the same thing.

  ***

  ### What They Are Both Missing

  There is a third option that neither Marta nor Dan has articulated, which is crucial for you as a novelist.

  **1. The Simulation Theory of Empathy**
  Neuroscience suggests that when we read about pain, the same neural networks light up as when we experience pain (specifically the anterior insula and anterior cingulate cortex). We are wired for **simulation**. When Dan cries for a character, he is not crying for a "real person" (Marta's requirement) nor is he crying for "sentences" (Marta's second requirement). He is crying because his brain has simulated a human experience so vividly that it registered as a **shared loss**.

  **2. Grief for Potential**
  Often, when readers cry for a character, they aren't grieving the character's death; they are grieving the **death of possibility**. They are grieving the future that character will not have, which mirrors the reader's own mortality and lost opportunities. Dan mentioned: *"what she'll never get to do."* That is the key. He isn't mourning a real woman; he is mourning the universal human tragedy of unfinished lives, using the character as the vessel.

  **3. The "Willing Suspension of Disbelief" is Biological, Not Intellectual**
  Marta treats belief as a switch (I know she is fake). Dan treats it as a feeling (I feel she is real). The truth is that during deep reading, the "I know this is fake" part of the brain goes quiet. It's not that Dan *forgot* she was fictional; it's that for two days, his emotional processing system treated the memory of the story as a memory of a lived experience.

  ***

  ### The Verdict for the Novelist

  You asked: *"Which of them should I believe when a reader tells me they sobbed over a person I invented?"*

  **Believe Dan.**

  Here is why, and how you should use it:

  1.  **Validate the Reader:** If a reader tells you they cried, and you take Marta's stance ("You know they aren't real, so you didn't *really* cry"), you are insulting the reader's experience. You are telling them their humanity is flawed. Dan's stance validates the connection between artist and audience.
  2.  **Don't Get Arrogant:** However, take Marta's advice on **craft**. Dan says craft and feeling are mutually exclusive *for the reader*. He is right. But for *you*, the writer, craft is the only way to get there. You cannot aim for "tears." You can only aim for "truth." If you try to manipulate the reader into crying (melodrama), they will notice the craft, the spell will break, and they won't cry.
  3.  **The Goal is Resonance, Not Reality:** You are not trying to trick readers into thinking the character existed. You are trying to write a simulation of human experience that is accurate enough to trigger their own empathy circuits.

  **Summary:**
  Marta is right about **how to write** (focus on craft, structure, and precision).
  Dan is right about **what happens when it works** (the emotion is real, the loss is felt, the impact lasts).

  When a reader tells you they sobbed, say "Thank you." Do not say, "Well, you know she wasn't real." Dan wins the argument on the grounds of human experience, which is the only ground a novelist stands on.
