answer: |-
  You are not inconsistent; you are a **Modern Selected-Effect (MSE) theorist** who recognizes **Intentional Design** as etiology equivalent to Natural Selection. Your intuitions are more coherent than you fear, but they do require you to resolve one waver and accept a specific epistemic shortcut for your grading team.

  ### The Coherent Principle: Modern Selected-Effect + Design
  Your verdicts align with the view that a function is an effect that explains why a trait *type* is present or maintained in a system, whether by evolutionary selection or intelligent design. This account distinguishes between *token performance* (what this specific heart is doing) and *type etiology* (why hearts exist).

  1.  **Malformed Heart vs. Tumor:** The MSE account handles this perfectly. The malformed heart is a token of a type selected for pumping; its function is pumping, even if it fails. The tumor is a token of a type (pathological growth) *not* selected or designed for cortisol secretion; the benefit is accidental. No etiology, no function.
  2.  **Feathers:** Pure historical etiology struggles here, but *Modern* SE focuses on **current maintenance selection**. If flight is why feathers are maintained in modern birds (even if insulation was the origin), flight is the function. Your intuition is correct; history does not get the last word, current selective regime does.
  3.  **Engineered Enzyme:** This is the strongest evidence for your inclusion of Design. In MSE terms, the engineer's intent creates an immediate "selection history." The enzyme exists *because* it was chosen to digest plastic. It has a function on day one.
  4.  **Screwdriver:** Artifacts follow design etiology. It was designed to screw. Using it as a paperweight is a *use*, not a function, because the object's presence is not explained by its paperweighting capacity.

  ### The Verdict You Must Overturn
  You must resolve your wavering on the **Vestigial Cave Fish Eyes**.
  *   **The Conflict:** You want to say they have no function (because they are vestigial) but also worry they might function as fat storage.
  *   **The Ruling:** A coherent MSE principle forces a binary choice based on **current maintenance**.
      *   If the eyes are decaying and *not* maintained by selection, they have **no function**.
      *   If they have been co-opted and are *currently selected* for fat storage, they are no longer "vestigial eyes" in the functional sense; they are fat pads, and fat storage **is** the function.
  *   **For the Rubric:** Instruct students (and your TA) that "vestigial" implies a loss of original function without a new maintenance regime. If there is evidence of new selection, it is not functionless, but it is no longer strictly vestigial in the functional sense.

  ### The Pig Heart Valve Case
  **Verdict:** The function is **to pump blood in the human recipient**.
  **Rationale:** While the *evolutionary* history is porcine, the *contextual* etiology of the valve's presence in the human is medical design and selection for human hemodynamics. Like the engineered enzyme, its presence in *this* system is explained by the goal of pumping blood in a human. The "system" for function ascription is the host organism + medical intervention.

  ### The TA Constraint (Practicality)
  **Can a TA apply this without research?**
  Strictly speaking, **no**. An etiological account demands knowledge of history (selection or design). A TA cannot verify if cave fish eyes are maintained for fat storage without reading the literature.
  **The Solution:** You must authorize a **Textbook Proxy**.
  For the purposes of the course, "Selection History" is defined as **Standard Biological Consensus**. If the textbook says "Feathers are for flight," the TA treats that as the established etiology. If the textbook says "Appendix is vestigial," the TA treats it as functionless (unless the essay provides peer-reviewed evidence of new maintenance). This turns an epistemic burden into a reference check.

  ### Recommendation
  Adopt the Modern Selected-Effect account including Design. It captures 95% of your intuitions. Use the "Textbook Proxy" rule to make it gradable. Stop wavering on vestigial traits: decay means no function; new utility means new function.

  Principle: A trait's function is the effect for which the trait type was selected or designed and is currently maintained in the system.
