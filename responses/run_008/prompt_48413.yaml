answer: |-
  You have identified one of the most formidable arguments in the entire history of the free will debate. You are right that it feels distinct from standard hard determinism, and you are right that it functions as a regress problem rather than a physical claim.

  Here is the carve-up you need to stop talking past your friend.

  ### 1. The Name and The Proponent
  The specific formulation you are describing is most famously known as **The Basic Argument**, advanced by the contemporary philosopher **Galen Strawson** (not to be confused with his father, P.F. Strawson).

  It is also frequently discussed under the label of **Ultimate Responsibility (UR)**. While the libertarian philosopher Robert Kane coined "Ultimate Responsibility" as a *goal* to save free will, Galen Strawson uses the same requirement to prove free will is impossible.

  In broader taxonomy, this position is called **Hard Incompatibilism**. Unlike "Hard Determinism" (which says free will is impossible *because* determinism is true), Hard Incompatibilism says free will is impossible *whether determinism is true or false*.

  ### 2. The Joints of the Argument
  The reason this argument feels like a "move" is that it is a **regress argument**. It doesn't attack the physics of the choice; it attacks the *metaphysics of the agent*. Here is the structure, broken down by its logical joints:

  *   **Premise 1 (The Principle of Responsibility):** To be truly morally responsible for an action (X), you must be responsible for the mental causes that led to that action (your character, motives, and preferences).
  *   **Premise 2 (The Causal Chain):** Your actions flow from how you are (your nature). If you choose Job A over Job B, it is because you value security over risk *at that moment*.
  *   **Premise 3 (The Regress):** To be responsible for how you are *now*, you must have chosen to be that way in the *past*. But that past choice would have flowed from how you were *then*.
  *   **Premise 4 (The Impossibility of Causa Sui):** To stop this regress, you would have to be the cause of yourself (*causa sui*). You would have to exist prior to yourself to choose your own nature. This is logically impossible.
  *   **Conclusion:** Therefore, you can never be ultimately responsible for your actions.

  **The Crucial Insight:** As you noted, **determinism is irrelevant here.** If your temperament was formed by a quantum coin flip (indeterminism), you didn't choose the coin flip. If it was formed by strict physics (determinism), you didn't choose the physics. In both cases, the source of the action is "outside" your control.

  ### 3. Is It a Trick?
  It is not regarded as a trick by philosophers; it is regarded as a **serious metaphysical challenge**. However, its reception depends entirely on which "camp" the philosopher is in.

  *   **Skeptics (Hard Incompatibilists):** Thinkers like Galen Strawson, Derk Pereboom, and Richard Double take this very seriously. They argue it exposes that the commonsense notion of free will is incoherent, like a "round square."
  *   **Compatibilists:** The majority of contemporary philosophers (like Daniel Dennett, John Fischer, P.F. Strawson) reject the argument, but not by disproving the logic. They reject **Premise 1**. They argue the demand for "Ultimate Responsibility" is an unreasonable, inflated definition of responsibility that no one actually uses in practice.

  ### 4. The Two Strawsons (Critical Distinction)
  You mentioned people mix up the two Strawsons. This is likely a major source of confusion in your debates.

  *   **P.F. Strawson (The Father):** Wrote the famous paper *"Freedom and Resentment"* (1962). He is a **Compatibilist**. He argues that we should stop looking for metaphysical "ultimate responsibility." Instead, free will is grounded in our human practices of holding each other responsible (reactive attitudes like guilt, praise, resentment). If you are psychologically normal and respond to reasons, you have free will, period.
  *   **Galen Strawson (The Son):** Wrote *"The Impossibility of Moral Responsibility"* (1994). He is a **Hard Incompatibilist**. He argues that his father's move is a dodge. He claims that *true* moral responsibility (the kind required for deep desert, praise, or blame) *does* require Ultimate Responsibility, and since that's impossible, true moral responsibility is impossible.

  **In your debate:** If your friend says, "We just hold people responsible because it works socially," they are channeling P.F. Strawson. If they say, "But that doesn't mean they *really* could have done otherwise in the deepest sense," they are channeling Galen Strawson. You are arguing about two different definitions of "responsibility."

  ### 5. Relation to Nearby Arguments
  You asked how this relates to the Luck Objection and Manipulation Arguments.

  *   **The Luck Objection:** This is the indeterminism half of your insight. If a choice is undetermined, it happens by chance. If it happens by chance, it's luck. If it's luck, it's not control. The Basic Argument absorbs this: whether your character is determined or lucky, you didn't *choose* it.
  *   **Manipulation Arguments:** These are thought experiments (e.g., a neuroscientist programs you to love security). They are designed to show that determinism is no different from manipulation. The Basic Argument is stronger: it says even *without* a neuroscientist, your genes and environment manipulate you just as effectively.
  *   **The Consequence Argument (van Inwagen):** This argues: If determinism is true, your actions are consequences of the past + laws. You can't change the past or laws. Therefore, you can't change your actions.
      *   *Difference:* The Consequence Argument relies on **Determinism**. The Basic Argument relies on **Regress**. The Basic Argument survives even if the Consequence Argument fails (i.e., even if the universe is random).

  ### 6. Where Philosophers Think It Goes Wrong (The Responses)
  If you want to push back against this argument, you cannot attack the logic (the regress is valid). You must attack the premises. Here are the three standard counters:

  **A. The Compatibilist Move (Reject Premise 1)**
  *   **Claim:** The demand for "Ultimate Responsibility" is a category error. Responsibility isn't about being the *first cause* of your character; it's about whether your actions flow from your *current* desires in a coherent way.
  *   **Analogy:** You don't need to have built your own eyes to be responsible for what you look at. You just need to be able to see. Similarly, you don't need to have built your character to be responsible for your choices; you just need to be able to deliberate.
  *   **Weakness:** Galen Strawson replies that this changes the subject. It gives you "freedom," but not the kind of freedom that justifies *eternal damnation* or *deep moral desert*.

  **B. The Self-Forming Actions Move (Robert Kane)**
  *   **Claim:** We *can* stop the regress at certain key moments. Kane argues for "Self-Forming Actions" (SFAs). These are moments of intense inner conflict where your will is undetermined. By struggling through the conflict, you *create* your character in that moment.
  *   **Weakness:** Many argue this just collapses into the Luck Objection. If the choice is undetermined during the struggle, isn't the outcome still random?

  **C. The Agent Causation Move (Chisholm, Taylor)**
  *   **Claim:** Human agents are unique substances. We are not just events causing events; we are *substances* causing events. An agent can initiate a causal chain without being fully determined by prior states.
  *   **Weakness:** Galen Strawson calls this "mysterious." It posits a kind of magic power (being an unmoved mover) that doesn't fit into our scientific understanding of the world.

  ### 7. How to Use This in Your Debate
  The reason you are talking past each other is likely that one of you is arguing about **Freedom of Action** (Compatibilism) and the other is arguing about **Freedom of Will** (Libertarianism/Incompatibilism).

  **The Diagnostic Question:**
  Ask your friend: *"Does a person need to be responsible for their own character in order to be responsible for their actions?"*

  *   If they say **Yes**: They accept The Basic Argument. They must then explain how one avoids the infinite regress without magic (*causa sui*). If they can't, they are Hard Incompatibilists (like you).
  *   If they say **No**: They are Compatibilists. They are arguing that "Free Will" just means "acting according to your own desires without coercion."
      *   *Your Counter:* If you say "No," you have admitted that free will is compatible with being manipulated by genes and environment. You have saved "free will" by redefining it as "voluntary action," but you have lost "Moral Responsibility" in the deep sense (the sense required for just deserts).

  **Summary for your friend:**
  Tell them you aren't arguing about determinism. You are arguing about the **Regress of Justification**. Tell them you are deploying **Galen Strawson's Basic Argument**. Ask them if they believe we need to be the *ultimate creators* of our own nature to be truly responsible. If they say no, ask them why we punish people for natures they didn't choose. If they say yes, ask them how that is logically possible without being self-created.

  This moves the debate from "physics" (which is a dead end) to "metaphysics" (where the actual disagreement lives).
