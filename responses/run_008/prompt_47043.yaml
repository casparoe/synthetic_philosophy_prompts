prompt: |-
  hey, need a consistency audit from someone who knows formal epistemology and social learning theory cold, so please take on the persona of a decision theorist who moonlights on collective epistemology. before writing your answer, brainstorm: go through the pairs of commitments, sort real tensions from surface-level ones, then write it up carefully. don't rush.

  context: for a workshop on social epistemology i have to submit a short position statement on information cascades and rational herding, and before i send it i want to know whether what i beleive actually hangs together. here's the set:

  (1) rationality is a per-agent notion: an agent is rational iff she responds correctly to her own evidence, where her evidence includes other people's observed actions. there is no further fact of the matter about whether the group was rational, only facts about each member.

  (2) in the classic sequential-choice setup (everyone gets a noisy private signal about which of two options is better, then chooses publicly one after another), nobody inside a cascade is making a mistake. the follower who goes with the herd even though her private signal points the other way has updated correctly on everything she's seen; it's just that her action no longer reveals her signal to anyone downstream.

  (3) at the same time i keep wanting to say that that follower is being epistemically irresponsible — she has signal evidence pointing one way and acts the other, which feels like ignoring your own evidence. i can't tell if this contradicts (2) or dissolves once you distinguish acting on your evidence from having your action reveal your evidence. please be specific about this one.

  (4) despite (1) and (2), cascades are a genuine epistemic failure of the group — not just bad luck with which signals happened to arrive, but something we can truly say went wrong, something a better institutional design (secret ballots, staggered or aggregated announcements, whatever) would have prevented.

  (5) if an early mover knows she'll be watched by many later movers, it can be rational for her to act on her private signal even when the public history slightly outweighs it, spending some of her own expected accuracy to keep information flowing downstream. i'd even want to say an epistemically virtuous agent would sometimes do this without any personal payoff for doing so.

  (6) i'm broadly confident in the wisdom-of-crowds picture: large groups of people with independent noisy information majority-voting get things right with high probability, and i think this basically survives even when the voters discuss beforehand.

  (7) as a rule of thumb, you should defer to the consensus of a large informed group over your own modest private evidence.

  so: go through these, tell me which pairs are genuinely in tension and how badly — rank them by severity, don't just flag everything equally — which pairs only look like tensions and dissolve once you state them carefully, and what the single cheapest fix would be: which commitment would i have to give up or weaken, and what would it cost me to lose it. also tell me which commitment you think is quietly doing the most damage to the rest. i genuinely don't know where the problem is and i'm not attached to any particular one, so don't pull punches.
