  8.  *(Final thought)*: Make sure to emphasize that the "Judgment Theory" isn't one monolith. There are Stoic versions, Neo-Stoic (Nussbaum), and Cognitive Science versions (Appraisal Theory). The book mashes them all into a caricature.

