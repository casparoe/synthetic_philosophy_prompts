answer: |-
  This is a fantastic dissection of a problem that usually hides behind technical jargon. Your cousin is treating it as a semiotic engineering challenge (how do we send a message?), but you've correctly identified that it is fundamentally an ethical one (why send the message at all, and to whom?).

  Here is an untangling of the philosophical presuppositions behind nuclear marker systems, broken down by the three tensions you identified: the moral status of future people, the anthropological assumptions, and the resource allocation implications of longtermism.

  ### 1. Moral Status: Strong Longtermism vs. The Duty of Non-Maleficence

  You asked whether the marker program requires the **strong longtermist claim** (influencing the far future is the *most* important thing we could be doing) or a **weaker duty** (don't dump harms on successors).

  **The Verdict:** The marker program relies entirely on the weaker duty. It is compatible with longtermism, but it does not *require* it. In fact, strict strong longtermism might argue against it.

  **The Distinction:**
  *   **Strong Longtermism** is a claim about *priority*. It argues that because the potential population of the future is vast, the expected value of actions that secure the long-term future (like reducing existential risk) outweighs almost all other moral concerns. It is maximization logic.
  *   **Intergenerational Justice (The Marker Ethic)** is a claim about *thresholds*. It argues that future people have rights not to be harmed by our negligence, specifically regarding "toxic legacies." This is based on the principle of **non-maleficence** (do no harm).

  **Why Markers Don't Need Strong Longtermism:**
  The marker system is an act of **reparation**, not optimization. We are creating a hazard; the markers are a mitigation strategy to ensure we don't violate the rights of future people to safety. We owe them this because we are imposing a risk on them without their consent. This is standard contractualist ethics applied across time: "What rules would we agree to if we didn't know which generation we would be born into?"

  If we adopted Strong Longtermism as the *sole* guiding principle, the marker program might actually look unjustifiable. Strong longtermism focuses on existential risks (things that could end humanity permanently). A nuclear repository, while dangerous, is unlikely to cause human extinction. A strong longtermist might argue that the millions of dollars spent on granite spikes and "radiation cats" should instead be spent on AI safety or biosecurity, where the return on investment for the "far future" is exponentially higher.

  Therefore, the marker program presupposes that future people count morally (they are not non-entities), but it does not presuppose that they are the *only* thing that matters. It assumes a **duty of care**, not a **duty to maximize**.

  ### 2. The Anthropological Gamble: Alien yet Human

  Your second point concerns the stability of the assumption that future humans will be different enough to lack our language, but similar enough to understand "spikes = danger."

  **The Tension:**
  This is not a logical contradiction, but it is a **semiotic gamble**. The designers are betting on **biological universals** over **cultural specifics**.
  *   **The "Alien" Assumption:** They assume institutions, languages, and religions are fragile. History supports this. None of the languages spoken today will likely be intelligible in 10,000 years without continuous cultural transmission (which institutions usually fail to maintain).
  *   **The "Human" Assumption:** They assume human physiology and basic psychology are constant. Pain, death, curiosity, and the instinct to avoid sharp objects are biological.

  **Is it Stable?**
  It is pragmatically stable but philosophically fragile.
  *   **The "Treasure Map" Risk:** You mentioned the worry that warnings become invitations. This is the problem of **semiotic drift**. A skull and crossbones meant "death" in the 14th century; today it means "pirates" or "poison" depending on context. In 10,000 years, a field of spikes might look like a temple, a monument to gods, or indeed, a marker for buried treasure.
  *   **The "Radiation Cat" Example:** The idea of engineering cats to change color near radiation highlights the desperation of this gamble. It attempts to bypass culture entirely and use biology (folklore, superstition, animal behavior) as the transmission medium. It admits that *language* will fail, so we must use *myth*.

  **The Contradiction:**
  The contradiction lies in the idea of "Warning." A warning implies the recipient values their life in a way we understand. If civilization collapses so thoroughly that language is lost, do we know they will value "safety" over "survival"? If they are scavenging in a post-apocalyptic landscape, they might *need* to dig to survive, making the warning irrelevant. The marker system assumes a future that is **civilized enough to read warnings** but **broken enough to have lost the manual**. That is a narrow window to aim for.

  ### 3. The 10,000-Year Horizon and Resource Allocation

  Why 10,000 years? And what would change if Strong Longtermism won the internal argument?

  **The 10,000-Year Horizon:**
  This number is a hybrid of physics and symbolism.
  *   **Physics:** Plutonium-239 has a half-life of 24,000 years. After 10,000 years, the radioactivity of the waste drops significantly (though it doesn't disappear). It is the point where the hazard transitions from "immediately lethal" to "long-term carcinogenic."
  *   **Symbolism:** 10,000 years is roughly the length of recorded human history. It is a psychological boundary marking "Deep Time."

  **The Longtermist Critique:**
  Under a genuinely Strong Longtermist view, the marker program is a **rounding error**, as you suspected.
  1.  **Existential vs. Local:** Nuclear waste is a local/regional hazard. It threatens specific populations, not the entire trajectory of humanity. Strong longtermism prioritizes existential risks (asteroids, super-volcanoes, unaligned AI) that threaten *all* future generations.
  2.  **Opportunity Cost:** Every dollar spent on carving granite is a dollar not spent on reducing the probability of human extinction. If the goal is to maximize the number of future lives, preventing extinction is orders of magnitude more effective than warning against a specific waste site.
  3.  **Technological Optimism:** A longtermist might argue that a civilization 10,000 years from now will either be space-faring (and not digging in this specific spot) or have technology to neutralize waste instantly. Worrying about their ability to read a map assumes technological stagnation or regression.

  **What Would Change if Strong Longtermism Won?**
  If the regulatory agency adopted Strong Longtermism as its primary ethical framework, the marker program would likely be defunded or radically altered:
  *   **Prevention over Mitigation:** The focus would shift from "how do we warn them?" to "how do we ensure this waste doesn't exist?" (e.g., heavy investment in transmutation technology or molten salt reactors that consume waste).
  *   **Institutional Continuity:** Instead of physical markers (which assume institutions will fail), resources would go toward creating *indestructible institutions* tasked with maintaining the knowledge. Strong longtermism values the preservation of knowledge and governance structures.
  *   **Site Selection:** The criteria might shift. Instead of a geologically stable site, they might choose a site that is easily monitorable by a long-term institution, accepting higher geological risk for lower "lost knowledge" risk.

  ### Summary: What the Practice Actually Needs

  To answer your core request on what needs a theory of obligation and what runs on prudence:

  1.  **The Obligation to Build *Something*:** This requires **Intergenerational Justice**. We owe future people a duty of non-maleficence. We cannot poison the ground they will walk on without attempting to mitigate it. This does *not* require Strong Longtermism.
  2.  **The Specifics of the Markers (Spikes, Cats, Languages):** This runs on **Prudence and Semiotics**. This is the engineering guesswork about what symbols survive. It is not an ethical claim, but a empirical bet on human psychology.
  3.  **The 10,000-Year Timeline:** This is **Physics**, not Ethics. It is dictated by the decay rate of isotopes.
  4.  **The Resource Allocation:** This is where **Strong Longtermism** would intervene. Currently, the allocation is based on **Stewardship** (clean up your own mess). If Strong Longtermism took over, the allocation would shift to **Existential Security** (ensure there is a future to make a mess in).

  **The Philosophical Bottom Line:**
  The marker program is an act of **humility**. It admits we are creating a danger we cannot fully control, and we are trying to apologize to people who cannot hear us. Strong Longtermism is an act of **ambition**. It seeks to control the trajectory of history.

  Your cousin's agency is operating on the ethics of the **guardian** (protect the ward from the specific harm I created), not the ethics of the **architect** (design the best possible future). The marker system is morally robust without needing the heavy machinery of longtermism; it only requires the belief that our grandchildren matter enough not to be poisoned by our garbage.
