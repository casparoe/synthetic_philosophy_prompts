  ok so, background on me: i've been reading the rationalist blogs since basically forever — LessWrong in its old-LW phase, SSC then ASTRA, the alignment-adjacent stuff, all of it. so the vocabulary i actually have at my fingertips is stuff like coordination problems, moloch, the unilateralist's curse, schelling points, chesterton's fence, legibility, "who has standing to act", expected value under regime uncertainty, agent-shaped vs system-shaped explanations. i never formally studied philosophy, and medieval philosophy especially reads like an alien language to me, telos included.

  the thing i want translated: Aquinas on killing tyrants. from what i gather it's more interesting than either "church guy says violence bad" or "he greenlit assassination" — as i understand it there are basically two prongs. (1) a practical/prudential move: private citizens assassinating tyrants almost always backfires, because the assassin usually just gets a worse and more paranoid tyrant as the replacement, so the remedy should come from whoever has the standing — the people if they're the ones who elevated the king in the first place, or a higher authority like the emperor over him. (2) a conceptual move in his treatment of sedition: sedition is a sin against the unity of the people and the common good, but a tyranny is directed at the ruler's private good, not the common good, so undermining a tyrant isn't sedition — the sin, if any, sits with the tyrant, kind of like how defending yourself isn't quarrelsomeness.

  restate all of this in the vocabulary i actually use. treat it as a translation task, not a summary — write his argument the way it would be written by someone who thinks in moloch and coordination terms by default. then the part i actually care about, the residue report: which of his claims translate cleanly (i suspect prong 1 is just "unilateral assassination is a high-variance intervention with bad EV when you can't select the successor regime" — am i right about that?), which claims only survive the translation because you smuggled in something that isn't really in the target vocabulary, and which claims have no expression at all. my guess is the residue is the natural law / teleology stuff: the idea that a political community has a real end, that "the common good of the multitude" is an actual thing and not just an aggregate of individual utilities, that there's a fact about what a commonwealth is FOR such that a tyranny is defective the way a broken clock is defective rather than just unpopular. my rationalist vocabulary basically only has agency at the individual level and emergent aggregates everywhere else, so "a whole polity has a telos and can be judged against it" is exactly the sort of claim that doesn't parse for me. and tell me straight: is that residue a gap in my vocabulary, or is Aquinas doing something that, once you strip out the telos, really does reduce to claims i can already make? don't go easy on him, and don't go easy on my toolkit either — if the rationalist stack is missing something real here, i want to know what and why, not a polite both-sidesing. typos mine, keep them or don't, whatever
