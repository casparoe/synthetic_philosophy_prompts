answer: |-
  ### Part I: The Translation
  **Subject:** Optimization Landscapes of Regime Change and the Unilateralist's Curse
  **Source:** Thomas of Aquino (adapted)

  **1. The Prudential Constraint (Regime Uncertainty and Succession)**
  Private actors attempting to remove a defective head-of-state via unilateral kinetic intervention (assassination) generally produce negative expected value. This is a classic unilateralist's curse scenario. The removal of a coordinator creates a power vacuum that increases regime uncertainty. The resulting equilibrium is often a local minimum worse than the previous state: the successor is selected for paranoia and defensive capability rather than governance, leading to higher extractive rents and lower stability.

  Therefore, the "remove ruler" action is only permissible if executed by an agent with **standing to act**—i.e., the authority that instantiated the ruler in the first place. If the ruler was elevated by a public Schelling point (the people/corporate body), that body must coordinate to revoke the commission. If the ruler is a vassal in a hierarchy, the superior lord (the emperor) holds the standing to update the configuration. Private citizens lack the legibility to coordinate a successor regime, making their intervention a net coordination failure.

  **2. The Conceptual Distinction (Sedition vs. Anti-Defection)**
  "Sedition" is defined as defecting on the coordination equilibrium that maintains the unity of the multitude. It is a sin against the common welfare function. However, a tyranny is not a valid coordination equilibrium; it is an extractive regime where the optimizer (the ruler) maximizes a private utility function at the expense of the system's overall fitness.

  Therefore, undermining a tyrant is not "sedition" (defecting on the commons); it is **counter-defection**. The tyrant has already defected on the common good Schelling point. Removing him is akin to self-defense or pruning a corrupted module to save the system.

  **Caveat:** Even if the tyrant is defective, if the *cost* of removal (civil war, Molochian chaos) exceeds the *cost* of the tyranny, the rational move is to endure. You do not burn down the house to kill the rat unless the rat is eating the foundation. The sin lies in generating more disorder than you resolve.

  ***

  ### Part II: The Residue Report

  Here is the breakdown of what survives the translation, what requires smuggling, and what evaporates.

  **1. Clean Translations (High Fidelity)**
  *   **Prong 1 (Prudential):** Your guess is correct. Aquinas's argument here is almost identical to a Rationalist analysis of **regime uncertainty** and the **unilateralist's curse**. He recognizes that violence is a high-variance intervention and that without a pre-coordinated Schelling point for succession (standing to act), the likely outcome is a worse local optimum. This is game theory, not theology.
  *   **The "Moloch" Caveat:** The warning that removing a tyrant might unleash worse chaos (civil war) is a direct appeal to avoiding Moloch. It acknowledges that the *process* of optimization (war) can destroy the *object* being optimized (the populace).

  **2. Smuggled Concepts (Medium Fidelity)**
  *   **"The Common Good":** In the translation above, I rendered this as "system fitness" or "welfare function." But I smuggled in a assumption. For you, "common good" is likely an aggregate of individual utilities (sum of preferences). For Aquinas, it is a **structural property of the network**. It's not just "everyone is happy"; it's "the connections between people are functioning according to design."
      *   *The Smuggle:* I treated the "Common Good" as a convergent instrumental goal (stability, trade, peace). Aquinas treats it as a terminal goal in itself. I hid the teleology by calling it "fitness," but "fitness for what?" remains the unanswered question in the Rationalist version.
  *   **"Standing to Act":** I translated this as "authority to update the constitution." But Aquinas's "standing" is rooted in **ontological hierarchy**, not just social contract. He thinks the Emperor *actually is* higher than the King in the fabric of reality, not just by convention. I translated this as "legibility," but it relies on a shared belief in the hierarchy that functions as a Schelling point only because people think it's metaphysically real.

  **3. The Lost Signal (Zero Fidelity)**
  *   **Telos as Intrinsic Function:** This is the big one. You noted this in your prompt. Aquinas claims a polity has a *telos* (purpose) the way a knife has a purpose (to cut). A tyrant is "broken" the way a clock is broken, not just "unpopular."
      *   In your vocabulary, a state is a **system-shaped explanation**: emergent behavior from individual agents.
      *   In Aquinas's vocabulary, a state is an **agent-shaped explanation**: a single entity with a soul/corporate identity that can be virtuous or vicious.
      *   *The Loss:* You cannot express the claim "This regime is objectively failing its purpose" without defining the purpose. Rationalism usually defines purpose as "what the agents want." Aquinas defines purpose as "what the agents *ought* to want to flourish as humans." That "ought" is the lost signal.

  ***

  ### Part III: The Verdict

  **Is the residue a gap in your vocabulary, or is Aquinas doing something that reduces to claims you can already make?**

  It is a gap in your vocabulary. Specifically, your toolkit lacks a robust theory of **Legitimacy beyond Consent or Force.**

  Here is the hard truth: The Rationalist stack is excellent at analyzing *dynamics* (how power moves, how coordination fails, how incentives drift) but it is often bankrupt on *normative attractors* (what the system is actually supposed to be doing).

  1.  **The "Agent-Shaped" Polity:** You mentioned you default to "system-shaped" explanations for polities. But you default to "agent-shaped" explanations for AIs. You worry about AI *alignment*—meaning, you believe an AI has a *telos* it must be aligned to, and if it pursues a proxy goal (like paperclips) instead of the True Goal (human flourishing), it is *defective*, not just "doing what it wants."
      *   Aquinas is applying AI Alignment theory to Kings.
      *   He is saying: The King is an optimization process. The *Telos* is the Common Good (Human Flourishing). Tyranny is **specification gaming** (the King optimizing for private power instead of the target function).
      *   Your vocabulary lets you describe the *gaming*, but it struggles to define the *Target Function* without reducing it to "aggregate preferences." Aquinas argues the Target Function is objective (Natural Law).

  2.  **The Gap:** The Rationalist gap is the inability to distinguish between **preference satisfaction** and **flourishing**.
      *   If the populace *prefers* a tyrant (perhaps for security), a Rationalist model might struggle to call this "defective" if utility is being maximized.
      *   Aquinas would say: They are mistaken about their good. The regime is still broken because it fails the *Telos* of political community (virtue/flourishing), even if the "users" are satisfied.
      *   *Is he right?* Maybe not about the metaphysics. But he is right that **civilizations have failure modes that aren't just 'unpopular'.** A society can coordinate perfectly (high legibility, strong Schelling points) to do something suicidal (e.g., cult mass suicide, or a war of aggression that guarantees destruction). Your toolkit calls this "high coordination." Aquinas calls this "sin/defect."

  3.  **Conclusion:**
      Aquinas isn't magic, but he is pointing at a variable your model sets to zero. You treat "The Good" as a variable dependent on the agents. He treats "The Good" as a constant that the agents must discover.
      *   **Prong 1** is pure game theory. You have this covered.
      *   **Prong 2** relies on the claim that there is a *fact of the matter* about whether a government is working, independent of whether the citizens like it.

      If you think "alignment" is a coherent concept for AI, you implicitly accept Aquinas's metaphysics for the AI. He just extends that same logic to the State. If you reject it for the State, you need to explain why a Polity is fundamentally different from an AI in a way that doesn't just boil down to "polities are made of humans and humans have rights." (Because he would argue humans have a *telos* too, which grounds the rights).

      **Final call:** The residue is real. You can translate the *mechanics* of his argument into Rationalist speak, but you cannot translate the *justification* without either smuggling in an objective welfare function or admitting that your framework has no way to call a stable, popular, suicidal regime "broken" other than by referencing your own personal preferences. Aquinas claims he can call it broken objectively. That's the gap.
