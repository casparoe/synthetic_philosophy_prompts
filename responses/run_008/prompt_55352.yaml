  *(Self-Correction on "Common Knowledge of Information Structure")*: In Aumann, it's not just knowing the posterior, it's knowing the *partition* (the mapping from state to info). In FL, we definitely don't know the other client's data distribution. This is the strongest point of divergence. I need to highlight that privacy-preserving FL *intentionally* violates Aumann's conditions.

  *(Self-Correction on "Agreement")*: Aumann says they *already* agree if they know each other's posteriors. They don't need to average. In FL, we average because they *don't* agree (non-IID). So FL is an attempt to *synthesize* a common posterior from disjoint posteriors, whereas Aumann describes the state where disjoint posteriors imply a shared truth. This is a subtle but important inversion. I will clarify this.

  *(Refining the "Garbage" comment)*: Why does FedAvg turn to garbage? Client drift. Objective mismatch. This maps to the "Common Prior" violation. If local shards are too different (extreme non-IID), the base model prior is no longer "common" in a meaningful sense relative to the likelihood shift.

