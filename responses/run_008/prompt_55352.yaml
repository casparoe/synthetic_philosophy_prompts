      *   *State of the World:* The true data distribution / optimal parameter configuration.
      *   *Common Prior:* The pre-trained base model weights.
      *   *Private Information:* Local data shards (non-IID).
      *   *Updating:* Fine-tuning (SGD/Adam) on local shards.
      *   *Posteriors:* The resulting model weights (or output logits/distributions).
      *   *Agreement:* Weight averaging (FedAvg) or Logit averaging (Ensembling).
