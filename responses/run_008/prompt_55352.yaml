  5.  **Drafting the Residue Report (Section 2 - The "Trouble Spots"):**
      *   *Gap 1: Common Knowledge of Information Structure.* In Aumann, I know *how* you process info. In FL, I don't know your data distribution ($P_i(x,y)$), only your weights. This is a massive gap. It's not just unformalized; it's fundamentally hidden in FL for privacy reasons.
      *   *Gap 2: Weights vs. Credences.* Aumann deals with probabilities. Weights are parameters. Logits are closer, but calibration is often poor. If logits aren't calibrated, they aren't posteriors.
      *   *Gap 3: Convexity vs. Non-Convexity.* Aumann assumes a shared probability space (convex). Loss landscapes in DL are non-convex. Averaging weights can land in a high-loss valley (mode connectivity issues). This is the "turns to garbage" scenario the user mentioned.
      *   *Gap 4: Ensembling vs. Averaging.* Aumann implies consensus (same value). Ensembling keeps disagreement (variance) to reduce error. FedAvg tries to force consensus in parameter space. This is a crucial distinction. Aumann says "you should have the same belief." FL says "let's average our parameters." If the loss landscape is non-convex, averaging parameters $\neq$ averaging beliefs.
