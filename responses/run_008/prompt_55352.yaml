      *   *Premise 2:* Common Prior (same probability distribution over states of the world before private info).
      *   *Premise 3:* Bayesian Updating (rational agents).
      *   *Premise 4:* Information Partitions (each agent knows which cell of their partition the true state lies in).
      *   *Premise 5:* Common Knowledge of Posteriors (I know your posterior, you know mine, I know that you know mine, ad infinitum).
      *   *Conclusion:* Their posteriors regarding any event must be identical. They cannot agree to disagree.
      *   *Dynamic Version:* If they exchange posteriors repeatedly, they converge.

  3.  **Map to Federated Learning/Model Merging:**
