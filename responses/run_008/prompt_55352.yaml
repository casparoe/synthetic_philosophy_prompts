      *   *Bayesian Updating:* Fine-tuning. *Caveat:* SGD is not exact Bayesian inference. It's approximate and path-dependent.
      *   *Posteriors:* Final Weights ($\theta_i$) or Predictive Distribution ($P(y|x, \theta_i)$).
