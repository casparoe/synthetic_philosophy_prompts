  **Her track record, compressed**
  Dana's verdicts commit her to a hybrid model of moral standing. She denies standing to current practitioners of the sin they condemn (Preacher, Climate Flyer) and to former industry architects who switch sides without atonement (Coal Exec). However, she grants standing to reformed individual consumers (Ex-smoker) and those condemning specific excesses within a system they merely participate in (Meat-eater). Her consistency hinges on distinguishing between personal habit, professional responsibility, and the target of the criticism. She protects the right to reform but punishes those who profited from the harm they now critique.

  **The rules that fit**
  Two principles fit the data. First, the **"Architect vs. Consumer" Rule**: You cannot condemn a system you professionally built or managed, even if you exit (Coal, Pig), but you can condemn habits you personally consumed (Smoker, Meat-eater). This fits four cases but strains on the Climate Campaigner, who is a consumer yet denied standing. Second, the **"Target Matching" Rule**: You lose standing if you blame individuals for systemic issues you participate in (Climate, Pig), unless you condemn only the excess (Meat-eater). This fits Climate and Meat-eater but strains on the Coal Exec, who blamed peers, not consumers. A third candidate is the **"Repentance Requirement"**: Exit isn't enough; you must acknowledge past wrongs (Smoker yes, Coal no). This fits all five but requires inferring internal states not always public. The Architect rule is strongest, but the Climate case suggests participation volume matters too. The Pig Guy tests whether professional management counts as "architecture" or "consumption."

  **My prediction**
  I predict Dana rules **No Standing**. The Pig Manager aligns most closely with the Coal Executive. Both were professional operators who profited from the harm for years. Unlike the Ex-smoker, whose sin was personal consumption, the Manager's sin was institutional management. Crucially, he lacks repentance, leveraging his past as credential rather than atonement. Furthermore, like the Climate Campaigner, he is blaming ordinary individuals (shoppers) rather than systemic peers. He combines the Coal Exec's professional complicity with the Climate Campaigner's misdirected blame. Dana seems to value moral consistency over utilitarian "insider knowledge." If she allowed this, it would undermine her Coal Exec ruling; professional responsibility shouldn't vanish just because you switch teams late. She likely views his claim—that wrongdoing grants authority—as the ultimate hypocrisy.

  **What would settle it**
  To settle the "Architect vs. Repentance" tension, test a **low-level industry worker**. Case: A former slaughterhouse line worker (not manager) who quits and campaigns against factory farming without apologizing. The Architect Rule says No Standing (part of the machine). The Repentance/Consumer Rule says Has Standing (just a job, like smoking). If Dana grants standing here, she tracks individual agency over professional title. If she denies it, the Coal Exec rule is about industry taint, not just executive power. This isolates whether "management" is the disqualifier or merely "employment."

  **How confident and where I'd lose the bet**
  I am 75% confident. The prediction rests on the Coal Exec parallel being stronger than the Whistleblower exception. I would lose the bet if Dana values "truth-telling utility" over moral standing. If she decides insider testimony is too valuable to silence regardless of hypocrisy, the Pig Guy gets a pass. That's the single point of uncertainty: whether her column is about ethics or epistemology. If she prioritizes the message over the messenger, my read on her consistency is wrong.
