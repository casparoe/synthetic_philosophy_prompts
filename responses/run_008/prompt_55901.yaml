  4.  **Analyzing Conflicts (The "Hard Part"):**
      *   *Conflict 1: Fission vs. Uniqueness.* If I fission, commonsense says "I am one person." Logic says "If A=C and B=C, A=B." If both successors are me, transitivity fails. If neither, I die (counterintuitive).
      *   *Conflict 2: Temporary Intrinsics vs. Wholeness.* Endurantism wants "wholly present" + "intrinsic change." Perdurantism says this is contradictory unless you relativize properties.
