answer: |-
  Your philosophical instincts are excellent. You have spotted several significant errors and oversimplifications in that blog post. It is very common for secondary sources (even by grad students) to compress the history and technical details of the Lewis triviality results in ways that distort the actual philosophical landscape. Your professor is right to present this as unsettled and nuanced; the blog post presents a caricature.

  Here is a claim-by-claim breakdown of the blog post's summary, followed by an explanation of the proof's actual assumptions and the current state of the debate.

  ### Part 1: Claim-by-Claim Analysis

  **Claim 1: "Lewis defended the thesis that the probability of a conditional 'if A, then B' just is the conditional probability P(B given A)."**
  *   **Verdict:** **Wrong.**
  *   **Correction:** This is **Adams' Thesis** (named after Ernest Adams, 1965/1975). Lewis did not defend it; he attacked it. Lewis's 1976 paper, *"Probabilities of Conditionals and Conditional Probabilities,"* takes Adams' Thesis as a premise to show that it leads to absurdity (triviality). Lewis's goal was to show that you *cannot* consistently hold that conditionals express propositions *and* that their probability equals conditional probability.

  **Claim 2: "Then in a famous 1976 paper he proved that this equation can only hold universally in trivial cases -- basically, if it holds for all probability functions, every sentence in the language ends up with probability 0 or 1."**
  *   **Verdict:** **Mostly Correct.**
  *   **Nuance:** This is the core of the triviality result. Lewis showed that if you assume (1) conditionals express propositions (have truth conditions) and (2) Adams' Thesis holds for a sufficiently rich class of probability functions, then the algebra of propositions collapses (is "trivial"). In a trivial algebra, every proposition is either certain or impossible. Since our language isn't trivial, one of the assumptions must go.

  **Claim 3: "The proof... works by treating the conditional as the material conditional and then applying ordinary probability calculus to it."**
  *   **Verdict:** **Wrong (and a major error).**
  *   **Correction:** This is the most damaging mistake in the post. Lewis's proof does **not** assume the conditional is the material conditional ($\neg A \lor B$).
      *   If the conditional *were* the material conditional, Adams' Thesis would be obviously false almost immediately (since $P(\neg A \lor B)$ is rarely equal to $P(B|A)$). You wouldn't need a sophisticated triviality proof to show that; simple counterexamples would do.
      *   Lewis's proof assumes only that the conditional expresses *some* proposition (call it $X$) with *some* truth conditions. It then uses the **Law of Total Probability** to show that no such proposition $X$ can satisfy the equation $P(X) = P(B|A)$ across different probability distributions without causing triviality. It applies to *any* truth-conditional account, not just the material one.

  **Claim 4: "The upshot... is that indicative conditionals therefore aren't propositions at all -- they lack truth conditions entirely."**
  *   **Verdict:** **Sloppy/Overstated.**
  *   **Nuance:** This is *one* valid response to the triviality result (often called **Non-Propositionalism** or **Expressivism**, championed by Adams and later Dorothy Edgington). Lewis himself leaned toward this conclusion. However, it is not the *only* logical consequence. One could instead deny Adams' Thesis, or restrict the range of probability functions to which it applies. The blog post presents this conclusion as the inevitable outcome, rather than one philosophical choice among several.

  **Claim 5: "That this also takes down the whole possible-worlds approach to conditionals (Stalnaker's and Lewis's semantics alike), since those assign truth conditions."**
  *   **Verdict:** **Sloppy/Misleading.**
  *   **Nuance:** The triviality results do not refute possible-worlds semantics *directly*. Stalnaker's semantics assigns truth conditions to conditionals. Lewis's triviality result says: *If* you have truth conditions *and* you accept Adams' Thesis, *then* you have triviality.
      *   A Stalnakerian can save their semantics simply by rejecting Adams' Thesis (saying that the probability of the proposition is *not* the conditional probability).
      *   However, since Adams' Thesis matches our intuitions very well, the triviality result puts significant *pressure* on truth-conditional accounts (like Stalnaker's). It suggests they might be capturing the wrong phenomenon. But it doesn't logically "refute" them unless you insist Adams' Thesis is non-negotiable.

  **Claim 6: "The triviality results are now universally accepted as having refuted the probability thesis outright."**
  *   **Verdict:** **Wrong.**
  *   **Correction:** There is no universal consensus. While the "naive" version of the thesis (that conditionals are propositions whose probability is conditional probability) is widely rejected, a modified version of the thesis is still central to the field. Many philosophers maintain that while conditionals don't have *truth conditions*, they do have *assertibility conditions*, and the probability of *assertibility* is conditional probability. Others argue for contextualist restrictions that avoid triviality. The debate is very much alive.

  ---

  ### Part 2: What the Proof Actually Assumes

  To understand why the blog post went wrong on Claim 3, it helps to see the skeleton of Lewis's argument. It does not rely on the material conditional. It relies on **conditioning on the consequent.**

  1.  **Assumption 1 (Propositionalism):** The conditional "If $A$, then $B$" expresses a proposition, let's call it $A > B$. This means it is the kind of thing that can be true or false, and we can assign it a probability $P(A > B)$.
  2.  **Assumption 2 (Adams' Thesis):** For any probability function $P$, $P(A > B) = P(B | A)$.
  3.  **The Move:** Lewis considers what happens to the probability of the conditional if we learn that $B$ is true. That is, he looks at $P((A > B) | B)$.
  4.  **The Derivation:**
      *   By Adams' Thesis, $P((A > B) | B)$ should equal $P(B | A \land B)$. Since $B$ is already assumed, $P(B | A \land B) = 1$.
      *   So, if you learn $B$, the probability of the conditional becomes 1.
      *   Lewis then uses the **Law of Total Probability** to show that if this relationship holds for *all* probability functions, the only way the math works out is if the initial probability of $B$ was already 0 or 1.
  5.  **The Result:** Since we clearly have beliefs where $P(B)$ is not 0 or 1, the initial assumptions must be wrong.

  **Key Takeaway:** The proof works because it assumes the conditional is a proposition that can be *conditioned upon* (e.g., "What is the probability of 'If A, B' *given* B?"). It does not matter what the truth conditions of that proposition *are* (material, strict, possible worlds, etc.); the mere fact that it *has* truth conditions governed by standard probability calculus is enough to generate the triviality.

  ---

  ### Part 3: Is the Probability Thesis "Dead and Buried"?

  The blogger's conclusion that the thesis is "dead and buried, no survivors" is hyperbolic. While the *strict* identity between the probability of a proposition and conditional probability is untenable for truth-conditional accounts, the *insight* behind Adams' Thesis remains dominant. Here are the "live responses" the blogger ignored:

  **1. Non-Propositionalism (Expressivism)**
  *   **View:** Conditionals do not express propositions. They have no truth conditions. Therefore, $P(\text{If } A, B)$ is not the probability of a truth, but the probability of *accepting* the conditional.
  *   **Status:** Very live. This avoids the triviality result because the probability calculus applies to propositions, and if conditionals aren't propositions, the proof doesn't get off the ground. (Proponents: Adams, Edgington, Gibbard).

  **2. Contextualism / Restricted Thesis**
  *   **View:** Adams' Thesis is true, but not *universally*. It holds relative to a specific context or a restricted class of probability functions. Lewis's proof requires the thesis to hold for *all* possible probability functions. If you restrict the domain (e.g., to functions compatible with the current context), triviality is avoided.
  *   **Status:** Active area of research. (Proponents: DeRose, McGee).

  **3. The "Jackson" View (Truth Conditions + Assertibility)**
  *   **View:** Conditionals *do* have truth conditions (often the material conditional!), but we don't assert them based on their truth probability. We assert them based on their *assertibility*, which is governed by conditional probability.
  *   **Status:** Less popular now than in the 80s/90s, but still a coherent position that respects the triviality result by separating truth from assertibility. (Proponent: Frank Jackson).

  **4. Multidimensional Semantics**
  *   **View:** Recent work tries to develop semantic frameworks where conditionals have a more complex semantic value than a simple proposition, allowing them to interact with probability in ways that dodge the triviality proof while retaining some truth-conditional features.
  *   **Status:** Cutting edge. (Proponents: Various contemporary semanticists).

  ### Summary for Your Course

  You should trust your professor over the blog post. The blog post confuses **Adams** with **Lewis**, misunderstands the **technical assumptions** of the proof (confusing "proposition" with "material conditional"), and presents a **contested philosophical conclusion** as a settled fact.

  **The actual consensus is roughly this:**
  1.  Lewis's triviality results are valid proofs.
  2.  They show you cannot have **Truth Conditions + Universal Adams' Thesis + Standard Probability Calculus**.
  3.  You must drop one.
  4.  Most philosophers drop "Truth Conditions" (going Non-Propositional) or modify "Universal Adams' Thesis" (going Contextualist).
  5.  The intuition that $P(\text{If } A, B) = P(B|A)$ is still regarded as a crucial data point that any theory must explain, even if it's not explained by identifying the conditional with a standard proposition.

  You have correctly identified that the blogger was oversimplifying a complex technical debate. Keep that skepticism; it's the most important tool in a philosopher's kit.
