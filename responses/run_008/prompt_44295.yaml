answer: |-
  Mrs. Hartree will rule that **Elspeth must confess (Draft B).** The lie to the niece will be declared *out of character*.

  Here is the reasoning, the alternative rules, the test scene, and finally, the philosophical weight of your dilemma.

  ### I. The Prediction and the Rules

  You have identified two compelling rules that fit the past record but diverge on the Niece scene.
  1.  **The Altruism Rule:** Deceive to protect others, never self. (Predicts: Lie).
  2.  **The Sustainability Rule:** Deceive only if the lie need not be inhabited or repeated. (Predicts: Confess).

  However, a third rule fits the record more tightly and accounts for the *texture* of Elspeth's morality, specifically the distinction between the Constable/Brother/Neighbor scenes and the Antiquarian scene.

  **The Stewardship Rule:** *Elspeth may manipulate the truth to shield the vulnerable from immediate harm or power, but she may not manipulate the truth to shield others (or herself) from moral complexity or historical reality.*

  *   **Constable (Lie):** Shields a pupil from the *power* of the law. (Immediate harm).
  *   **Neighbor (Silence):** Shields a wife from the *power* of a husband. (Immediate harm).
  *   **Brother (Truth):** A dying man is no longer vulnerable to power; he is entitled to the reality of his life. To lie would be to rob him of his own history.
  *   **Antiquarian (Lie):** Shields Elspeth from shame. (Self-protection/Moral complexity). Ruled *Out*.
  *   **Niece (Lie):** Shields the niece from the *moral complexity* of her parents' and aunt's past. It is not immediate physical harm; it is the burden of knowledge.

  Under the Stewardship Rule, the Lie to the Niece is *Out of Character*. Elspeth is a schoolmistress; her vocation is to prepare minds for the world, not to curate a fiction of it. The "Verses" precedent is the anchor: she will not lie to sanitize the past, even if the sanitation is for someone else's benefit.

  ### II. Further Candidate Rules

  Two other rules fit the existing record equally well and must be considered:

  **The Burden Rule:** *Elspeth may lie only if she alone bears the weight of the deception.*
  *   In the Constable and Neighbor scenes, Elspeth holds the secret. The protected parties (pupil, wife) may never know.
  *   In the Niece scene, a lie makes the niece an unwitting participant in a falsehood about her own lineage. It shares the burden without her consent.
  *   *Prediction:* Confess. (Lie distributes the burden).

  **The Pedagogical Rule:** *Elspeth acts as a moral instructor; her truth-telling is calibrated to the pupil's capacity for growth.*
  *   The pupil (child) needed protection to grow.
  *   The brother (dying) needed truth to end well.
  *   The niece (adult) needs truth to understand her inheritance.
  *   *Prediction:* Confess. (The niece is now the pupil).

  ### III. The Test Scene

  To separate the **Altruism Rule** (Lie to spare feelings) from the **Stewardship/Burden Rules** (Truth to honor reality), you need a scene that isolates the variable of *harm* from the variable of *record*.

  **The Scene:** A village child, the daughter of a known drunkard, asks Elspeth if her father beats her because she is "wicked."
  *   **Draft 1:** Elspeth tells a gentle lie: "No, he is ill. It is not your fault." (Protects the child's psyche, no permanent record, altruistic).
  *   **Draft 2:** Elspeth tells the hard truth: "He is unwell, but it is not because you are wicked. It is because he cannot control himself." (Protects the child from self-blame, but assigns blame to the father).

  **Why this separates them:**
  If Hartree rules Draft 1 *In Character*, then the **Altruism Rule** dominates; Elspeth prioritizes emotional safety over causal truth. This would suggest your Niece Lie (Draft A) might actually pass, contradicting my primary prediction.
  If Hartree rules Draft 2 *In Character*, then the **Stewardship Rule** dominates; Elspeth prioritizes accurate moral mapping over comfort. This confirms the Confession for the Niece.

  This scene is cheap to write: a single conversation in a schoolroom or garden. It does not commit you to the serial's plot, but it probes the editor's interpretation of Elspeth's duty to truth.

  ### IV. The Philosophical Question

  You ask whether there is a *fact of the matter* about Elspeth, or whether Hartree's ruling *creates* the truth, and whether the Wittgensteinian skeptic is right to suggest that nothing in the past fixes the future.

  **1. The Skeptical Point**
  Your friend is correct in the abstract. As Kripke's reading of Wittgenstein suggests, there is no internal mental state or past behavioral record that *logically necessitates* a future application of a rule. "Plus" and "Quus" are indistinguishable until the numbers get large enough. In your case, "Protect Others" and "Protect Others Unless It Sanitizes History" are indistinguishable until the Niece scene arises. The past conduct of Elspeth Gow underdetermines her future conduct.

  **2. The Fact of the Matter**
  However, you are not a logician; you are a novelist. In fiction, the "fact of the matter" is not a metaphysical essence but a **normative commitment**.
  There *is* a fact of the matter, but it resides not in the printed record of the five years, but in the **coherence of the form of life** you have built. Wittgenstein reminds us that rule-following is a practice embedded in a community. Mrs. Hartree is not merely a gatekeeper; she is the proxy for the *community of readers* who have come to understand what "Elspeth Gow" means.

  When Hartree rules, she is not discovering a pre-existing atom of truth inside the character, nor is she arbitrarily creating one. She is judging **fidelity to the form of life**.
  *   If Elspeth lies to the niece, does that break the *trust* the reader has established with her?
  *   Does it make the previous five years look different in retrospect?

  **3. Discovery vs. Creation**
  The distinction does not collapse, but it intertwines.
  *   **Creation:** Hartree's ruling *does* create the truth of the installment. Until she stamps it, the scene is indeterminate.
  *   **Discovery:** Her ruling *reports* a truth about the character's integrity relative to the whole work. If she rules the Lie *In*, and the readers feel betrayed, then the ruling was "wrong" in the artistic sense, even if consistent with a gerrymandered rule.

  **The Verdict:**
  Do not let the skepticism paralyze you. The "fact of the matter" is the **resistance of the material**. You feel that one draft is "right." That feeling is not a mystical intuition of a ghost in the machine; it is your recognition of the pattern's tension.
  Hartree's role is to ensure that the pattern holds. If you write the Confession, and it feels like a betrayal of Elspeth's mercy, then the rule was wrong. If you write the Lie, and it feels like a betrayal of her integrity, then the rule was wrong.

  My judgment: **There is a fact of the matter.** It is the fact of **narrative integrity**. Elspeth Gow is a vessel for a specific kind of Victorian moral clarity—one that values mercy but fears hypocrisy. The "Verses" scene established that she will not sanitize her own past. The Niece scene asks if she will sanitize her family's past. To do so would be to treat her niece as a child to be managed, not a woman to be respected.

  Hartree will reject the lie. Not because the rule forces her to, but because the *character*—the sum of your intentions and the reader's expectations—demands that Elspeth bear the pain of the truth so her niece does not have to live a fiction. Hartree's ruling will feel like a discovery because, in the context of the work, it *is* one. You are finding out who she is, even as you write her.

  Write the Confession. It hurts more, and Elspeth Gow has always chosen the path that hurts her more than it hurts the innocent.
