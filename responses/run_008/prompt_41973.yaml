answer: |-
  A maximum-containment virology facility experiences a catastrophic seal failure in Sector 4, releasing an airborne, lethal hemorrhagic pathogen. One hundred staff members in the main complex will be exposed and die unless the sector is isolated immediately. The facility director faces two active intervention options. Option 1: Initiate the "Sterilization Protocol." This floods Sector 4 with a neurotoxic gas that instantly stops all cardiac activity. Five researchers are currently trapped in Sector 4. The facility's automated lockdown system is designed to engage the final hermetic seal only when biometric sensors confirm zero biological signatures in the sector; if the researchers remain alive, their heartbeats prevent the seal from locking, and the pathogen escapes to the main complex. The director must intend the cessation of the researchers' vital functions to satisfy the sensor and save the hundred. Option 2: Initiate the "External Venting Protocol." This pumps the contaminated air through external scrubbers that are known to be 90% effective under these pressure conditions. The venting saves the hundred in the main complex regardless of the scrubbers' efficiency. However, the 10% leakage will drift into a nearby residential zone, causing acute fatal toxicity in approximately twenty residents. Their deaths are not required for the venting to work; if they happened to wear protective gear or survive the exposure, the hundred staff would still be saved.

  | Theory | Required Option | Rationale |
  | :--- | :--- | :--- |
  | **Act Consequentialism** | Option 1 (5 deaths) | Minimizes total loss of life (5 < 20). |
  | **Classical DDE** | Option 2 (20 deaths) | Option 1 intends harm as means; Option 2 foresees harm. |
  | **Thomson's Means Constraint** | Option 2 (20 deaths) | Option 1 uses the 5 as means to safety; Option 2 does not. |
  | **Kamm's Causal Means** | Option 2 (20 deaths) | Option 1 harms as causal means; Option 2 harms as side effect. |

  Act consequentialism selects Option 1 without hesitation. The calculus is strictly numerical: five innocent deaths are preferable to twenty, provided the good achieved (saving one hundred) is constant across both options. The structural feature driving this verdict is the *outcome state*; the causal history of the deaths is irrelevant compared to the final body count.

  The classical Doctrine of Double Effect forbids Option 1. While the good (saving one hundred) is proportionate to the bad in both cases, Option 1 fails the intention condition. The agent must adopt the death of the five as a means to engage the seal; the plan is "kill them to lock the door." In Option 2, the deaths of the twenty are merely foreseen consequences of a otherwise benign act (venting air). The structural feature here is the *plan-relative status of the harm*: in Option 1, the harm is a precondition for success; in Option 2, it is a contingent byproduct.

  Judith Thomson's means-based constraint yields the same verdict as DDE but for a slightly different reason. For Thomson, what matters is not the mental state of intention per se, but whether the agent violates the victims' rights by using them. In Option 1, the five researchers are used as biological keys; their cessation of function is the mechanism that secures the safety of the hundred. In Option 2, the twenty residents are not used; they are merely in the path of the exhaust. The structural feature is *instrumentalization*. If the researchers in Option 1 were not required to die for the seal to lock (e.g., if the sensor were broken), the constraint would vanish, and Thomson might permit the act if the deaths were merely foreseen side effects of the gas.

  Frances Kamm's distinction between harming as a causal means and harming as a mere side effect also mandates Option 2. In Option 1, the good (safety) flows *through* the harm (death); the death is part of the causal chain producing the rescue. In Option 2, the good flows from the venting, and the harm flows from the same action but on a separate causal branch. The structural feature is *causal topology*. If the means-deaths in Option 1 stopped being necessary (e.g., the seal locked regardless of heartbeats), the harm would shift from causal means to side effect, aligning Kamm's verdict with consequentialism.

  A defender of the Doctrine has two primary lines of response. The first is to reframe the intention in Option 1: the agent intends only to "satisfy the sensor" or "neutralize biological signatures," not to kill persons. The death is foreseen, not intended. This is the standard "closeness" objection. However, this is weak in this specific case because the mechanism explicitly requires the cessation of vital functions; one cannot satisfy a heartbeat sensor without intending the heart to stop. The second response is to accept the verdict and defend it victim-by-victim: the five researchers have a right not to be used as tools, which outweighs the utilitarian gain of saving fifteen extra lives elsewhere. This is the stronger defense because it leans on the deontological core of DDE—that certain actions are intrinsically forbidden regardless of consequences—rather than trying to wiggle out of the intention description. It forces the critic to argue that rights are fungible against numbers, which is the central point of contention.

  Honest assessment: This case is a strong test, but it risks rigging the doctrine by making the "means" option technologically contrived. The requirement that a safety seal depends on the death of occupants is an engineered constraint that feels morally loaded in itself; it forces the agent into a "terror bomber" logic that rarely exists in genuine industrial safety. A referee might argue that the case stacks the deck by making the consequentialist choice involve a mechanism (biometric death-lock) that is independently repugnant, thereby smuggling in intuitive anti-consequentialist weight under the guise of pure numbers. However, if the engineering constraint is accepted as a given of the scenario, it successfully isolates the intention condition as the sole variable driving the divergence between DDE and consequentialism.
