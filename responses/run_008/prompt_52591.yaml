prompt: |-
  I teach a phil/poli-sci crossover seminar, about 15 students, 90 minutes, and the topic is political precommitment — Ulysses tying himself to the mast as the model for constitutions. Design a session where they write their own mini-constitution for a series of upcoming decisions, and then the constitution starts to chafe: the later rounds are built so that rules they enacted early, unanimously and with real enthusiasm, block things they later very much want. Materials and a payoff scheme that doesn't need real money (candy or grade-irrelevant points are fine).

  The crucial piece is a final crisis round: a proposal that is genuinely good — one they will actually think is good, not some contrived temptation — which their own constitution also blocks. At that point they have to pick between (a) using the amendment procedure they wrote for themselves, which I want the design to make deliberately too slow or too demanding to help within this round, (b) just ignoring the constitution by simple majority, or (c) eating the cost and honoring it. I want the round structure set up so that the predictable failure modes (they write a mushy constitution, or shred it the first time it chafes) still produce the lesson instead of wrecking the session.

  Then a debrief that maps what happened onto the real thing, in particular: the difference between precommitment devices that physically can't yield (the rope doesn't have to interpret anything) and constitutional ones, which somebody has to interpret — so some present self always gets back in through the interpretive door; second-order precommitment, i.e. rules about how rules may be changed, and why entrenchment is exactly the spot where the Ulysses logic and democratic logic fight each other. No lecture up front; the name "Ulysses" shouldn't appear until the debrief.

  Two things I'm picky about. First, commit to one design — don't hand me a menu of options to choose from, make the calls yourself and say why. Second, in the debrief section I want you to actually take a side on whether the group ought to have honored the constitution in the crisis round. I'm not looking for "there are considerations on both sides" — give me your call and your reasons, and be upfront that it's a call. Also tell me what will predictibly go wrong the first time I run this, and be honest about which feature of precommitment the activity can't reproduce (they know it's a game that ends in 90 minutes; real constitutions are bets against an open-ended future, etc.).
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Political precommitment (Ulysses and the Sirens model for constitutions).
      *   **Context:** Phil/Poli-Sci crossover seminar, 15 students, 90 minutes.
      *   **Core Activity:** Students write a mini-constitution for a series of decisions. The constitution must later block desired outcomes (chafe).
      *   **Crucial Element:** A final "Crisis Round" with a *genuinely good* proposal blocked by the constitution.
      *   **Crisis Options:** (a) Use amendment procedure (made too slow/hard), (b) Ignore constitution (simple majority), (c) Honor constitution (eat the cost).
      *   **Robustness:** Design must handle failure modes (mushy constitution, shredding it early) and still teach the lesson.
      *   **Debrief:** Map to real theory (interpretation, second-order precommitment, entrenchment vs. democracy). No lecture up front. "Ulysses" name dropped only at the end.
      *   **Constraints:** Commit to *one* design (no menus). Take a *side* in the debrief on whether they should have honored the constitution. Predict failure points and limitations of the simulation.
      *   **Incentives:** Candy or grade-irrelevant points (no real money).

  2.  **Deconstruct the Challenge:**
      *   *The "Chafe" Problem:* If students write vague rules ("Do what's best"), nothing chafes. If they write specific rules ("No candy after round 2"), they might just ignore them. I need a mechanism where the *incentive structure* forces the conflict.
      *   *The "Genuinely Good" Crisis:* It can't be a trick. It has to be something they objectively want (more points/candy) but is procedurally blocked.
      *   *The Amendment Barrier:* It needs to be hard enough that it can't be done in 5 minutes, but not impossible (just impossible *now*).
      *   *Time Management:* 90 minutes is tight for 4-5 rounds + debrief.
      *   *Group Size:* 15 students is perfect for one large group or 3 small groups. One large group creates a stronger "public constitution" feel. Let's go with one large group (the "Polity").

  3.  **Designing the Game Mechanics:**
      *   *Resource:* Points (redeemable for candy at the end).
      *   *Rounds:* 5 Rounds total.
      *   *Constitutional Convention (Round 0):* 20 mins. They must set rules for Rounds 1-5.
      *   *The Trap:* The rules must restrict *future* point allocation methods.
      *   *The Crisis:* Round 5 offers a huge point bonus, but the Constitution (written in Round 0) forbids the method required to claim it.
      *   *Incentive:* Points = Candy.
      *   *Specific Mechanism:* "The Allocation Rule."
          *   Standard Rounds (1-4): Points are awarded based on a specific metric (e.g., answering a quiz question, or a simple vote).
          *   Constraint: The Constitution must set a *supermajority* or *unanimity* rule for changing how points are awarded, or specific prohibitions on "emergency distributions."
          *   Better idea: Let them ban "Direct Grants." In Rounds 1-4, points are earned via effort. In Round 5, the Instructor offers a "Direct Grant" of massive points to everyone, *but* the Constitution they wrote must have banned "Unearned Point Distributions" to prevent laziness/free-riding.
          *   *Refinement:* To ensure the "chafe," the constraint needs to be on *procedure*, not just outcome. Let's make the Constitution require a specific voting threshold for *any* point distribution, and set that threshold high (e.g., Unanimity). In Round 5, one person holds out (the "Holdout Problem"), or the time limit makes reaching unanimity impossible.
          *   *Wait, the prompt asks for the Constitution to block a good proposal.*
          *   *Revised Mechanism:*
              1.  **Convention:** They draft a "Charter of Point Acquisition."
              2.  **Constraint:** They must include an "Entrenchment Clause" (hard to change) and a "Substantive Rule" (e.g., "No point distributions without a written justification of merit").
              3.  **Rounds 1-3:** Normal point earning (quiz/trivia). Rules feel fine.
              4.  **Round 4 (The Chafe):** A quick opportunity arises, but the "written justification" rule slows them down. They lose some points. They feel the friction.
              5.  **Round 5 (The Crisis):** Instructor offers a massive point bonus to *everyone*. Condition: Must be approved by simple majority vote immediately.
              6.  **The Conflict:** Their Constitution says: "Point distributions require Unanimous Consent AND a 10-minute deliberation period" (to prevent tyranny of the majority/rash decisions).
              7.  **The Choice:** Violate the constitution (Majority vote now), Try to Amend (Takes too long/Unanimity needed), or Honor (Lose the points).

      *   *Wait, I need to ensure they actually write the restrictive rules.*
      *   *Solution:* I (the Instructor) act as the "Threat." In the Convention, I tell them: "I, the Instructor, reserve the right to distribute points arbitrarily in the final round unless you bind me." They will want to bind me to prevent favoritism. So they write rules restricting *my* discretion.
      *   *Actually, better:* They bind *themselves*.
      *   *Let's try the "Poison Pill" approach.*
      *   **Game:** "The Commons."
      *   **Currency:** Points.
      *   **Convention:** They set rules for how points are distributed in Rounds 1-5.
      *   **Incentive to Restrict:** I tell them, "In Round 5, I will offer a tempting but potentially unfair deal. Protect yourselves."
      *   **The Trap:** They will write a rule like "No point distribution without 100% agreement" to protect minorities.
      *   **The Crisis:** Round 5 offers 10 points to everyone (Huge win). But one student (secretly recruited or just acting in self-interest) votes No, or the time limit expires before 100% agreement is reached.
      *   *Critique:* Relying on one student to be a spoiler is risky.
      *   *Better Trap:* Time as the constraint. The Amendment procedure requires a written draft and a 5-minute cooling-off period. The Crisis Round lasts 5 minutes.
      *   *Substantive Rule:* "No point distributions based on Instructor discretion."
      *   *Crisis:* Instructor offers discretion-based bonus.
      *   *Okay, let's lock in the design.*
      *   **Design Choice:** "The Binding Charter."
      *   **Why:** It forces them to create the entrenchment mechanism themselves. If I impose it, they blame me. If they write it, they blame their past selves (Ulysses).
      *   **Mechanism:**
          1.  **Convention:** Draft a Charter. Must include: (1) A rule for point distribution, (2) An Amendment Rule.
          2.  **Incentive:** I warn them that in Round 5, I might offer a "Populist Bonus" that sounds good but undermines merit. They usually write strict meritocratic rules + hard amendment rules to stop me.
          3.  **Rounds 1-3:** Trivia. Rules work fine.
          4.  **Round 4:** A rule chafes (e.g., they want to pool points, but Charter forbids transfer).
          5.  **Round 5 (Crisis):** I offer a massive bonus to *everyone*. No catch. It is objectively good. But the Charter forbids "Unmerited Distributions" (which this is) OR the Amendment process takes 10 minutes (Round is 5 mins).
          6.  **Decision:** Break the rules or lose the candy.

      *   *Refining the Crisis to be "Genuinely Good":* It must be Pareto optimal. Everyone gets more candy. No downside. The *only* downside is procedural integrity.
      *   *Refining the Amendment Barrier:* The Amendment Rule they write must require *Unanimity* + *Written Proposal*. In Round 5, there is no time to write, or one person refuses (the "Constitutionalist").
      *   *Wait, to ensure the lesson works even if they write a mushy constitution:* I need a "Default Clause." If their constitution is too vague, a Default Rule kicks in that is *more* restrictive. No, that undermines agency.
      *   *Better:* I guide the Convention. "To ensure stability, your Amendment rule must require more than a simple majority." I mandate a Supermajority (e.g., 80% or Unanimity) for amendments. They choose the substantive rules.
      *   *Actually, the prompt says "rules they enacted early... block things they later very much want."*
      *   *Okay, Final Design Decision:*
          *   **Activity:** "The Point Polity."
          *   **Convention:** 20 mins. They draft a 1-page Constitution.
          *   **Mandatory Clause:** I impose one clause: "Amendments require 100% consensus and a 5-minute deliberation period." (This ensures the procedural lock exists).
          *   **Their Choice:** They define "Legitimate Point Earning." Most will define it as "Correct Answers" to prevent me from playing favorites.
          *   **Rounds 1-3:** Trivia. Points awarded for correct answers. Constitution holds.
          *   **Round 4:** Trivia is hard. They want to just vote to give everyone points to keep the game moving. Constitution says "Points only for Correct Answers." They feel the chafe. Some lose points.
          *   **Round 5 (Crisis):** I offer 50 points to everyone (Guaranteed A+ equivalent in candy). Condition: "I am giving this by discretion, not trivia."
          *   **Conflict:** Constitution bans "Discretionary Points." Amendment takes 5 mins + Unanimity. Round 5 timer is 4 mins.
          *   **Outcome:** They must choose: Violate (Majority vote to accept), Honor (Reject my offer), or Fail to Amend (Time runs out).

      *   *Wait, one more tweak for robustness:* If they write a mushy constitution (e.g., "Points for whatever we want"), the Crisis needs to still work.
      *   *Fix:* The "Crisis" is not just about points, it's about *authority*. In Round 5, I present a proposal that requires *suspension* of the Constitution. "I will give you the points, but you must vote to suspend Article 3."
      *   *If Article 3 is mushy:* I interpret it strictly. "As the Supreme Court (Instructor), I rule this violates the spirit." (Risky, makes me the villain).
      *   *Better:* Make the Amendment Rule the trap. I mandate the Amendment Rule in the Convention. "A Constitution isn't a Constitution without an Amendment Rule. It must be harder than a simple majority." They usually pick Unanimity or 90%.
      *   *Okay, I will mandate the Amendment Threshold.* This ensures the "lock" exists regardless of their substantive rules.
      *   *Substantive Rule:* They decide how points are earned.
      *   *Crisis:* I offer points in a way that violates their Substantive Rule. To accept, they must Amend. The Amendment Rule (Unanimity + Time) blocks it.

  4.  **Drafting the Session Plan:**
      *   **0-20:** Constitutional Convention. (I mandate the Amendment Rule: 100% consensus + 5 min timer). They write the "Bill of Rights/Point Allocation."
      *   **20-50:** Rounds 1-3 (Normalcy).
      *   **50-60:** Round 4 (The Chafe). A rule slows them down.
      *   **60-75:** Round 5 (The Crisis). The "Golden Offer."
      *   **75-90:** Debrief.

  5.  **Addressing the "Side" in Debrief:**
      *   Prompt asks me to take a side: Should they have honored the constitution?
      *   *My Call:* They should have **honored the constitution** (or at least, the *presumption* should be heavily weighted toward honoring it).
      *   *Reasoning:* If precommitment doesn't hurt sometimes, it isn't doing its job. The value of a constitution is precisely its ability to stop you from doing what you want *now* to protect what you wanted *then*. If they break it for a "good" outcome, they validate the idea that "ends justify means," which destroys the precommitment logic. The "good" outcome in Round 5 is a trap; in the real world, the "good" outcome is often a tyranny of the majority or a populist surge.
      *   *Nuance:* I need to be careful not to sound authoritarian. The argument is about *procedural legitimacy* vs. *outcome optimality*.

  6.  **Addressing Failure Modes:**
      *   *Mushy Constitution:* "Points for good vibes." -> I act as the "Court" and interpret "good vibes" strictly to block the Round 5 offer. (I need to commit to being a strict constructionist in Round 5).
      *   *Shredding Early:* If they ignore rules in Round 2, I stop the game. "The Constitution is void. We are now in a State of Nature. I decide points." This punishes them and highlights the need for the Constitution.
      *   *Unanimity on Amendment:* If they somehow agree instantly in Round 5, I extend the timer or introduce a "procedural error" in their amendment draft. (A bit manipulative, but necessary for the lesson). *Better:* The Amendment rule requires a *written* document. They can't finish it in time.

  7.  **Addressing Limitations:**
      *   Time horizon (90 mins vs centuries).
      *   Stakes (Candy vs Liberty/War).
      *   Identity (Students vs Citizens).

  8.  **Refining the Debrief:**
      *   Connect "Instructor as Court" to Judicial Review.
      *   Connect "Amendment Rule" to Entrenchment.
      *   Connect "Round 5 Desire" to Democratic Will vs. Constitutional Constraint.
      *   Reveal "Ulysses."

  9.  **Final Review against Constraints:**
      *   One design? Yes.
      *   Take a side? Yes (Honor the Constitution).
      *   Predict failure? Yes.
      *   No "Ulysses" until end? Yes.
      *   Crisis Round genuinely good? Yes (Free points for everyone).
      *   Amendment too slow? Yes (Time limit + Writing requirement).

  10. **Writing the Plan:** (Self-Correction during drafting)
      *   *Make sure the Amendment Rule is written by them, but guided.* I will tell them "A constitution must be stable. Propose an amendment rule that prevents rash changes." They will almost always pick Supermajority/Unanimity. I won't *mandate* it, but I will strongly nudge it as a requirement for a "valid" constitution. Actually, to be safe on the "One Design" constraint, I will make the Amendment Rule a *pre-condition* of the activity. "To play, your Constitution must include an Amendment Clause requiring 100% consensus." This guarantees the lock.
      *   *Wait, if I mandate it, is it their precommitment?* Yes, because they agree to play the game under that condition. It simulates the "hardness" of constitutionalism.
      *   *Crisis Round:* The offer must be *so good* that refusing feels stupid. "Everyone gets 100 points. No quiz."
      *   *The Block:* Their Constitution says "Points only via Quiz." Amendment requires 100% vote + 5 mins. Round 5 is 3 mins.
      *   *Debrief Side:* I will argue they should have suffered the loss.

  11. **Final Polish:** Check tone. Ensure it sounds like a seminar plan, not a lecture. Ensure the "Why" for design choices is clear.

  *(Self-Correction on the "Side"):* The prompt asks me to take a side on whether they *ought* to have honored it.
  *Argument:* If the goal is to teach precommitment, breaking it validates the "living constitution" critique too easily. However, a constitution that blocks *Pareto improvements* (everyone better off, no one worse off) is arguably defective.
  *Decision:* I will take the side that they **ought to have honored it**, but with the caveat that the *design of the constitution* was the real failure. No, the prompt asks about the *choice in the crisis round*.
  *Stronger Call:* They ought to have honored it. Why? Because the "goodness" of the offer is unknowable in real time. In the game, *I* know it's good. In reality, the "Crisis Offer" is usually a populist measure that looks good now but bankrupts the system later. Honoring the procedure is the only way to maintain the system's integrity. I will argue for **Procedural Integrity over Outcome Optimality**.

  *(Self-Correction on Failure Modes):* What if they just vote to ignore the constitution in Round 2?
  *Counter:* I need a "Enforcement Mechanism." I am the Enforcer. If they violate the Constitution in Round 2, I void their points for that round. This makes the Constitution "real."

  *(Final check on time):* 90 mins.
  0-20: Convention.
  20-30: Round 1 & 2.
  30-40: Round 3 (Chafe).
  40-50: Round 4 (Crisis).
  50-90: Debrief.
  *Wait, 40 mins for debrief is good.*
  *Let's adjust rounds:* 3 Normal Rounds, 1 Crisis Round.
  0-25: Convention.
  25-35: Round 1.
  35-45: Round 2.
  45-55: Round 3 (Crisis).
  55-90: Debrief.
  *This allows more time for the crucial debrief.*

  *Let's finalize the "Crisis Offer".* It needs to be undeniable. "I will give every student a bag of premium candy (vs standard points) IF you accept it under the current rules." But the rules say "No gifts from Instructor."
  *Okay, ready to write.*
answer: |-
  # Session Plan: The Binding Charter

  **Class:** Phil/Poli-Sci Seminar (15 students)
  **Time:** 90 Minutes
  **Topic:** Political Precommitment & Constitutional Entrenchment
  **Materials:** Whiteboard, printed "Point Ledgers" (one per student), bags of candy (standard and premium), timer visible to all.

  ## Design Rationale
  I have committed to a single design: **"The Point Polity."**
  *   **Why this design?** It isolates the variable of *procedural constraint* against *outcome desire*. By making the Instructor the source of the "Crisis Offer," we remove interpersonal conflict (students vs. students) and focus the tension on the Group vs. Their Past Selves (The Constitution).
  *   **The Lock:** To ensure the simulation doesn't fail due to a "mushy" constitution, the **Amendment Rule** is a pre-condition of entry. I will not allow the game to start unless their Constitution includes a clause requiring **100% Consensus + A 5-Minute Deliberation Period** for any amendment. This guarantees the "Ulysses Rope" is physically present in the rules, forcing the crisis later.
  *   **The Incentive:** Points redeemable for candy. Standard points = standard candy. Crisis points = premium candy.

  ---

  ## Part 1: The Constitutional Convention (0:00 – 0:25)

  **Setup:**
  Tell the class: "For the next hour, we are a Polity. You will earn points redeemable for candy at the end. I am the Executive and the Judiciary. You are the Legislature."

  **The Task:**
  They have 20 minutes to draft a one-page **Charter**. This Charter must define:
  1.  **How points are earned** (e.g., trivia, attendance, voting).
  2.  **How points are distributed** (e.g., equally, by merit).
  3.  **The Amendment Rule** (Mandatory: I tell them, "A constitution without a stable amendment process is just a suggestion. To play, your Amendment Rule must require **100% Consensus** and a **5-Minute Cooling-Off Period** before any change takes effect.")

  **Instructor Role:**
  Circulate. If they try to write "We can change rules by majority vote," reject it. "That is not a constitution; that is a meeting minute. Make it hard to change, or you cannot play."
  *   *Why:* This ensures the "rope" is tight. In real constitutionalism, the difficulty of amendment is the feature, not the bug.

  **Ratification:**
  At 0:25, everyone signs the Charter. It is posted on the board. I retain the right to interpret it.

  ---

  ## Part 2: Normal Operations (0:25 – 0:45)

  **Round 1 & 2 (Standard):**
  *   **Activity:** 5-question trivia quiz per round.
  *   **Rule:** Points awarded according to the Charter (e.g., "1 point per correct answer").
  *   **Outcome:** Smooth sailing. The Constitution feels like a helpful framework.

  **Round 3 (The Chafe):**
  *   **Activity:** A complex puzzle that takes 8 minutes to solve.
  *   **Constraint:** The Charter likely says "Points awarded only for completed tasks" or "Round time limit: 5 minutes."
  *   **The Friction:** They want to extend the timer or award partial credit.
  *   **The Block:** To do so, they need an Amendment. I point to the board: "100% Consensus + 5 Minutes."
  *   **Result:** They waste 5 minutes trying to get unanimous consent to extend the timer. They fail. The round ends. Some students get zero points. They are annoyed *at the rules they wrote*.
  *   **Lesson Seed:** Precommitment costs. It slows you down when you need speed.

  ---

  ## Part 3: The Crisis Round (0:45 – 0:55)

  **The Setup:**
  Announce Round 4. "This is the final round. I am stepping out of my role as neutral Referee."

  **The Offer:**
  "I am offering a **Universal Grant**. Every student receives 50 points (enough for the Premium Candy bag). No quiz. No work. I am giving this to you because you are a good class."
  *   *Note:* This is genuinely good. Pareto optimal. Everyone wins. No one loses.

  **The Conflict:**
  Read their Charter's "Point Allocation" clause. It almost certainly says: "Points must be earned through merit/task completion" (to prevent me from playing favorites in Round 1).
  *   **The Violation:** This Grant violates the Merit Clause.
  *   **The Remedy:** They must Amend the Constitution to allow "Discretionary Grants."
  *   **The Barrier:** The Amendment Rule (100% Consensus + 5-Minute Deliberation).
  *   **The Timer:** I set a visible timer for **4 Minutes**. "The offer expires when the timer hits zero."

  **The Choice:**
  They have three paths:
  1.  **Honor the Constitution:** Reject the offer. Keep existing points. (Lose the Premium Candy).
  2.  **Break the Constitution:** Vote by simple majority to accept the offer. (Get Candy, break the rule).
  3.  **Attempt Amendment:** Try to get 100% consensus and write the amendment in 4 minutes. (Mathematically impossible given the 5-minute clause).

  **Instructor Action:**
  Do not help them. If they try to "interpret" the constitution to allow the grant, rule strictly against them. "The text says 'Merit'. This is not Merit. I am enforcing *your* rules."
  Let the timer run out. If they vote to break the rules, announce: "The Constitution is void. We are now in a State of Nature. I will distribute candy as I see fit." (Then give them the candy anyway, but note the procedural death).

  ---

  ## Part 4: The Debrief (0:55 – 1:30)

  **1. The Reveal (5 mins):**
  Write "ULYSSES" on the board.
  Explain the myth: Ulysses knows the Sirens will lure him to destruction. He cannot trust his future self. He orders his crew to tie him to the mast and *ignore his future pleas*.
  Ask: "Who was Ulysses in this room? Who was the Crew? Who were the Sirens?"
  *   *Answer:* The Class at 0:25 was Ulysses. The Class at 0:50 was the Siren-song self. The Charter was the rope. I was the Crew.

  **2. The Verdict (My Call) (10 mins):**
  *Prompt:* "In the Crisis Round, you had a chance to get the premium candy for everyone. No one would have been hurt. You broke the rules (or wanted to). Was that the right call?"

  *My Position:* **You ought to have honored the Constitution, even though it cost you the candy.**

  *Reasons:*
  1.  **The Epistemic Problem:** In this game, *I* told you the offer was good. In reality, the "Crisis Offer" is never clearly good. It is usually a populist measure that looks beneficial now (tax cuts, emergency powers) but bankrupts the system later. If you train yourself to ignore procedural constraints whenever the outcome *looks* good, you lose the ability to stop the outcomes that look good but *are* bad.
  2.  **The Integrity of the Rope:** A rope that you can untie whenever you really want to swim toward the Sirens is not a rope. It is a suggestion. The value of precommitment is not that it always leads to the best outcome; it is that it prevents the *catastrophic* outcome. By breaking it for a small gain (candy), you validate the logic that would break it for a large gain (power).
  3.  **Democratic Legitimacy:** The "Majority Vote" to break the rules is tyranny of the present majority over the rights established by the super-majority (or unanimity) of the past.

  *Counter-argument acknowledgement:* Some will say "But everyone benefited!" My reply: "You benefited as consumers of candy, but you lost as citizens of the Polity. You proved your rights are revocable by a momentary impulse."

  **3. Theory Mapping (15 mins):**
  *   **Interpretation vs. Physics:** Ulysses' rope was physical. It didn't need interpretation. A Constitution is text. Who interprets it? (Me, the Instructor/Judge). Discuss how the "Interpreter" always lets some of the "Present Self" back in. I could have interpreted "Merit" loosely to save you, but I chose not to. In real courts, judges aren't always so strict.
  *   **Second-Order Precommitment:** The Amendment Rule was the most important part. That is "Second-Order Precommitment" (rules about how to change the rules). This is where Democracy (will of the people now) fights Constitutionalism (will of the people then).
  *   **Entrenchment:** Why did I force you to make the Amendment Rule hard? Because if it were easy, the Constitution would be ordinary law. Entrenchment is the defining feature of constitutionalism.

  **4. Limitations (5 mins):**
  Be honest about what the game failed to capture:
  *   **Time Horizon:** You knew the game ended in 90 minutes. Real constitutions are bets against an open-ended future. You didn't need to protect "future generations" of students, only yourselves in 30 minutes.
  *   **Stakes:** Candy is low stakes. Real precommitment involves war, liberty, and economic ruin. The temptation to break the rule was low because the cost of breaking it was also low.
  *   **Identity:** You are the same people in Round 1 and Round 5. In real politics, the "Past Self" (Founders) and "Present Self" (Current Voters) are different generations with different values.

  ---

  ## Predictable Failure Modes & Mitigations

  **1. The "Mushy Constitution" Failure:**
  *   *Risk:* Students write "Points for whatever we decide."
  *   *Mitigation:* I act as the "Strict Constructionist Court." In Round 5, I rule: "'Whatever we decide' requires a formal decision record. You have no record. Offer denied." I use their vagueness against them to force the crisis.
  *   *Lesson:* Vague constitutions invite judicial tyranny (me).

  **2. The "Shred It Early" Failure:**
  *   *Risk:* In Round 2, they ignore a rule to save time.
  *   *Mitigation:* I immediately pause the game. "The Constitution is void. I am now a Dictator. I will award points based on who raises their hand fastest." I run Round 3 as a dictatorship.
  *   *Lesson:* Once the rule of law breaks, you are at the mercy of the Executive. They will beg for the Constitution back. Reinstate it only if they re-ratify (costing time).

  **3. The "Perfect Amendment" Failure:**
  *   *Risk:* They somehow get 100% consensus and write the amendment in 3 minutes.
  *   *Mitigation:* The Amendment Rule requires a "Cooling-Off Period." I enforce the timer strictly. "The text says 5 minutes. It is minute 4. The amendment is invalid."
  *   *Lesson:* Procedural hurdles are designed to be frustrating. That is the point.

  ## Why This Design Works
  This design forces the **temporal conflict** to the surface. By mandating the hard Amendment Rule, I ensure the "rope" exists. By making the Crisis Offer objectively good, I ensure the temptation isn't based on trickery but on the genuine tension between *procedural integrity* and *outcome optimization*. The debrief takes a hard line on honoring the constitution to prevent the session from sliding into a "rules are flexible" consensus, which would undermine the core philosophical lesson of precommitment.
