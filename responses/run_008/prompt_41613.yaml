      *   **The Alternative View (Adversarial/Source):** Ambiguity aversion isn't about the probabilities *per se*, but about the *source* of the uncertainty. If an adversary sets the urn, minimizing maximum loss (Maximin) is rational. This looks like EU maximization if we include the adversary's strategy in the state space.
      *   **The "Redescription" Worry:** If we can model ambiguity aversion as EU over a larger state space (including the adversary's move), have we really defended "ambiguity aversion"? Or have we just shown it's standard rationality in disguise?
