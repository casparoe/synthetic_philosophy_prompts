      *   *Story Date:* "Garden of Forking Paths" is 1941 (*Ficciones*).
      *   *Philosophical nuance:* The essay is Idealist (time is mental). The story is closer to a metaphysical labyrinth.
      *   *The "Game" aspect:* Quote the "I am playing with forms" bit if possible, or paraphrase closely.
      *   *The "Scaffolding":* The user mentioned scaffolding for a bigger book. This refers to his plan for a total history of infamy/time which he never wrote. The essays were fragments.

  6.  **Final Polish:** Ensure the distinction between *ontological* claims (time doesn't exist) and *narrative* devices (forking paths) is clear. Emphasize that Borges values the *experience* of time over the *logic* of time.

