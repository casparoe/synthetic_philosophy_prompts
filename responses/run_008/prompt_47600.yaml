      *   `engineer_intuition_trap`: Engineers assume the dependency graph exists objectively waiting to be coded, whereas the frame problem argues that relevance itself is contextual and cannot be fully pre-defined.

  9.  **Refining the Tone:**
      *   Ensure it's direct. No "on the one hand, on the other hand" without a conclusion.
      *   Use engineering terminology where appropriate (closed world assumption, dependency graph, O(N)).
      *   Make sure the JSON keys match exactly.

  10. **Final Review against Constraints:**
      *   Essay first, then JSON.
