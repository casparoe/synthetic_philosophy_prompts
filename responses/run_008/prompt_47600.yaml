      *   *Body Paragraph 2 (The Disanalogy - Closed vs. Open):* This is the meat. Engineering is a closed system (we godding the universe). AI/Philosophy is an open system (the universe godding us). The frame problem is epistemological (how do we know?), engineering is logistical (how do we compute?).
