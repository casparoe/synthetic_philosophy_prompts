  2.  **Deconstruct the Frame Problem:**
      *   *Origin:* McCarthy & Hayes (1969). Concerns representing actions in logic (situation calculus).
      *   *Core Issue:* When an action occurs, how to represent what *doesn't* change without enumerating infinite "frame axioms" (e.g., picking up a block doesn't change its color, the weather, etc.).
      *   *Philosophical Expansion:* Dennett, Fodor, etc. Expanded it to the "relevance problem." How does an agent know what information is relevant to a decision without checking everything? It's about common sense reasoning and computational tractability in an open world.
      *   *Key Constraint:* Open world, indefinite number of facts, need for efficient inference.

  3.  **Deconstruct Cache/Dependency Invalidation:**
      *   *Context:* Software engineering, distributed systems.
      *   *Core Issue:* When data changes, what derived data becomes stale?
      *   *Key Constraint:* Closed world (usually), defined schema, explicit dependency graphs (code, DB foreign keys, event subscriptions), finite state.

  4.  **Compare the Two:**
      *   *Similarity:* Both deal with determining the consequences of a change (what updates, what stays the same). Both worry about efficiency (not recomputing everything) and correctness (not missing updates).
      *   *Difference (The Crucial One):*
          *   Engineering: The world is *closed*. We define the dependencies. If `user.email` changes, we *decide* via code that `invoice.recipient_email` needs updating. The rules are explicit or deterministically derivable from the codebase.
          *   Philosophy/AI: The world is *open*. There is no predefined schema of reality. The agent needs *common sense* to know that painting a block doesn't change its location. The dependencies aren't written in code; they exist in the fabric of reality and must be learned or assumed.
      *   *Verdict:* The analogy is "useful_but_leaky". It captures the structural intuition (change propagation) but fails on the epistemological foundation (closed vs. open world).

  5.  **Address the LLM Context Window Question:**
      *   *Approach:* Stuffing everything into context.
      *   *Analysis:* This is brute-force attention. It doesn't solve the frame problem because the model still has to attend to the right tokens. It sidesteps the *representation* problem (we don't need logical axioms) but exacerbates the *relevance* problem (noise vs. signal). It's basically paying O(N) to avoid writing O(1) axioms, but N is growing. It ignores the core philosophical issue of *knowing* what matters without checking everything.
      *   *Verdict:* It sidesteps the representation issue but ignores the relevance/efficiency core of the philosophical problem.

  6.  **Address the Engineer Intuition Trap:**
      *   *Trap:* Engineers assume the world is deterministic and defined by code. Philosophers/AI researchers worry about the undefined, the unexpected, and the semantic gap between symbols and reality.
      *   *Specific:* Assuming that because you *can* define a dependency graph, you've solved the problem of *knowing* what dependencies exist in reality.

  7.  **Drafting the Essay:**
