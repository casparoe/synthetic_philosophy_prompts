answer: |-
  If Leaving the lights on is wrong,
  then walking past the switch without a click
  is a quiet theft from the morning's grid,
  a debt we owe the dark but do not pay.
  We bind the consequence to the condition
  like links of chain depending on the first.

  Now look: the hallway glows all night,
  wasteful, burning coins into the air.
  I say it plain: Leaving the lights on is wrong.
  So walking past the switch was theft.
  The logic holds, the inference moves forward
  only because the words mean what they meant before.

  But suppose I ask you: Is it true
  Leaving the lights on is wrong?
  Here the words sit still, no anger in their throat,
  just a hypothesis waiting for a voice.
  How can the same line bite in one place
  and lie flat in another, unchanged?
  The mouth speaks judgment, then speaks only air.
