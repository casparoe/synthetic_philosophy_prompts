answer: |-
  You have correctly identified the logical structure of the problem, and yes, there is an established name for results of this shape.

  The field is **Population Ethics**.
  The specific type of result is an **Impossibility Theorem**.
  The canonical result in this domain is **Arrhenius's Impossibility Theorem**.

  Here is a breakdown of the terminology, the canonical result, how it compares to Arrow's Theorem, and why it is distinct from a mere tradeoff.

  ### 1. The Name: Impossibility Theorems in Population Ethics
  In logic and social choice theory, when you have a set of conditions (axioms) that each seem individually necessary or obvious, but a mathematical proof demonstrates that no system can satisfy all of them simultaneously, that is an **Impossibility Theorem**.

  You are correct that this is not merely a "tradeoff." A tradeoff implies that we can weigh Condition A against Condition B and find a compromise. An impossibility theorem proves that the set of conditions is **logically inconsistent**. You *must* violate at least one of them; there is no stable equilibrium where all hold true.

  While Derek Parfit is the philosopher who popularized the specific problems (like the **Repugnant Conclusion** in his 1984 book *Reasons and Persons*), the person who formalized these into a rigorous impossibility theorem akin to Arrow's is the Swedish philosopher **Gustaf Arrhenius**.

  His result is widely cited as **Arrhenius's Impossibility Theorem** (published in various forms from 2000 through his 2011 book *Population Ethics: The Challenge of Future Generations*).

  ### 2. The Canonical Result: Arrhenius's Impossibility Theorem
  Arrhenius proved that no theory of population ethics can satisfy a set of very weak, intuitively plausible adequacy conditions without implying counterintuitive results (like the Repugnant Conclusion or the **Sadistic Conclusion**).

  The axioms he uses are intentionally weak to make the impossibility harder to escape. They include conditions like:
  *   **Dominance:** If World A has the same people as World B, and everyone in A is better off than in B, then A is better than B.
  *   **Non-Elitism:** A very good life cannot be so valuable that it outweighs any number of lives barely worth living (in specific contexts).
  *   **Weak Non-Sadism:** It is not better to add people with negative welfare (lives not worth living) than to add people with positive welfare.

  Arrhenius proves that you cannot construct a ranking function over possible futures that satisfies these conditions without eventually being forced to accept that a massive population of miserable-but-barely-positive lives is better than a small population of flourishing lives.

  ### 3. Comparison with Arrow's Impossibility Theorem
  You noted the similarity to Arrow's Theorem. The structural resemblance is exact, but the domain differs.

  | Feature | Arrow's Theorem | Arrhenius's (Population) Impossibility |
  | :--- | :--- | :--- |
  | **Input** | Individual **preferences** (orderings). | Individual **welfare** (well-being levels). |
  | **Population** | **Fixed.** The set of voters is constant. | **Variable.** The number of people can change between options. |
  | **Output** | A social **ordering** of states. | A value **ordering** of futures. |
  | **Core Conflict** | Aggregating preferences fairly without a dictator. | Aggregating welfare across different possible identities. |
  | **Key Complication** | Strategy, Independence of Irrelevant Alternatives. | **Non-Identity Problem.** (Different choices create different people). |

  **The Crucial Difference:**
  Arrow's theorem assumes a fixed set of individuals. Population ethics impossibility theorems must handle **variable population size**. This introduces the **Non-Identity Problem**: choosing a policy that changes the future might change *who* comes into existence. You aren't just making existing people happier or sadder; you are swapping out the set of subjects entirely. This makes the "identity" of the welfare recipients a variable in the equation, which adds significant complexity compared to Arrow's fixed voter set.

  ### 4. The "Shape" of the Argument
  You described the counterexamples as "a chain of tiny steps, each of which the rule seems forced to accept, with the absurdity appearing only at the end."

  In philosophy, this specific argumentative move is often called a **Spectrum Argument** or a **Continuity Argument** (sometimes loosely associated with **Sorites** reasoning).

  However, the *result* that no theory can avoid this chain is the **Impossibility Theorem**.
  *   **The Trap:** The Spectrum Argument shows *how* a specific theory fails.
  *   **The Theorem:** The Impossibility Theorem proves that *any* theory satisfying the axioms must fail in this way (or a similar way).

  ### 5. Why this is not just a "Tradeoff"
  You asked for a way to distinguish this from a mere tradeoff between desiderata.

  In engineering terms, a tradeoff is a **Pareto frontier**: you can optimize for X, but you lose Y. You can choose a point on the curve.
  An impossibility theorem proves that the **feasible region is empty**. There is no point on the curve. The constraints define a null set.

  If someone says, "We just need to balance Total Welfare against Equality," they are proposing a tradeoff. Arrhenius's theorem says, "Any function that attempts to balance these according to these basic logical rules will produce a contradiction." It is a proof of **inconsistency**, not difficulty.

  ### 6. Suggested Terminology
  If you are discussing this with other engineers or rationalists, the most precise labels are:

  1.  **General Class:** **Social Choice Impossibility Theorem**. (This groups it with Arrow, Sen, and Gibbard-Satterthwaite).
  2.  **Specific Field:** **Population Ethics Impossibility Theorem**.
  3.  **Specific Result:** **Arrhenius's Impossibility Theorem**.
  4.  **The Phenomenon:** **Axiomatic Inconsistency**.

  If you need a descriptive phrase for the "shape" of the problem to distinguish it from standard optimization problems, you might call it a **Constraint Inconsistency in Variable-Population Welfare Aggregation**.

  ### Summary for your mental model
  *   **Field:** Population Ethics.
  *   **The "Repugnant Conclusion":** The specific bug report (huge population of low welfare > small population of high welfare).
  *   **The "Impossibility Theorem":** The proof that the codebase cannot be refactored to fix this bug without introducing other critical bugs, given the current architecture (axioms).
  *   **Canonical Author:** Gustaf Arrhenius.
  *   **Relation to Arrow:** It is the variable-population, welfare-based cousin of Arrow's fixed-population, preference-based theorem.

  **Recommended Reading:**
  *   **Stanford Encyclopedia of Philosophy:** Entry on "The Repugnant Conclusion" and "Population Ethics."
  *   **Gustaf Arrhenius:** *Population Ethics: The Challenge of Future Generations* (specifically the chapters on the impossibility theorems).
  *   **William MacAskill:** *Doing Good Better* or his academic papers on normative uncertainty (he often discusses these impossibility results in the context of Effective Altruism).

  You have stumbled upon one of the most rigorous and depressing results in modern moral philosophy. The consensus among experts is not that we haven't found the right theory yet, but that **no adequate theory exists** that satisfies our basic intuitions. We are forced to choose which intuition to abandon.
