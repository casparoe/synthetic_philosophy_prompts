answer: |-
  Here are ten questions tailored for a 40-minute session with a reliabilist epistemologist. They are designed to be technically precise for a grad student audience while pressing hard on the bootstrapping objection.

  The three mandatory topics (Moorean reasoning, biting the bullet on incremental steps, and conflicting sources) include the requested follow-ups keyed to her predicted externalist responses.

  ### 1. The Moorean Connection
  Many critics argue that bootstrapping is structurally identical to Moorean reasoning ("Here is a hand, therefore an external world exists"). Both seem to transmit justification from a premise to a conclusion that is required to validate the premise's source in the first place. If you defend bootstrapping as a valid way to confirm a source's reliability, are you committed to saying Moore's proof successfully *transmits* justification to the skeptic, rather than just possessing it?

  *   **Likely Reply:** She will likely argue that Moorean reasoning *is* valid and that skepticism is the error, not the proof.
  *   **Follow-up:** "If the proof is valid and transmission succeeds, why does the skeptic remain rationally unpersuaded? Is there a gap between what is *justified* and what is *dialectically effective*, and if so, doesn't that render the concept of justification less useful for resolving philosophical disputes?"

  ### 2. Incremental Justification (Biting the Bullet)
  Regarding the thermometer case: Can you simply deny that the individual readings confer *any* justification for the belief that the thermometer is reliable, even if they confer justification for the temperature? Or must you accept that each reading incrementally boosts your justification for the thermometer's reliability?

  *   **Likely Reply:** She will likely "bite the bullet" and admit that each reading does incrementally boost justification for the source's reliability, as that follows from the definition of reliability.
  *   **Follow-up:** "If each step is justified, the accumulation feels like epistemic cheating—like pulling yourself up by your bootstraps. If the process is formally valid but feels cognitively irresponsible, is the problem with our intuitions, or is reliabilism missing a normative constraint on *how* we aggregate evidence?"

  ### 3. Conflicting Sources
  Imagine two agents: one uses a reliable thermometer, the other a broken one that sticks but appears functional. Both bootstrap their way to believing their device is reliable based on consistent readings. Since the process is internally indistinguishable, does the agent with the broken thermometer have justified beliefs about its reliability, or does the external fact of the breakage strip the justification entirely?

  *   **Likely Reply:** She will likely maintain the externalist line: only the agent with the actually reliable device has justification; the other is merely blameless.
  *   **Follow-up:** "If justification is determined by facts inaccessible to the agent, how can 'justification' serve as a guide for action? If I'm in a dispute with that other agent, appealing to justification won't help us resolve who is right, since neither of us can access the external fact that decides it."

  ### 4. Epistemic Closure
  To solve bootstrapping, some philosophers suggest rejecting the principle of epistemic closure (that justification transfers through known entailment). Is this a price you are willing to pay? If you keep closure, how do you block the inference from "The gauge reads F" and "The gauge is reliable" to "The gauge is accurate" without allowing the bootstrapping conclusion?

  ### 5. The "Easy Knowledge" Objection
  Stewart Cohen argues that reliabilism allows for "easy knowledge"—knowledge of the world that is too cheaply bought because it bypasses the need for independent verification. If I can know my car's gas gauge is reliable just by looking at it repeatedly, does this misdescribe the actual norms of scientific calibration, where independent testing is mandatory for warrant?

  ### 6. Defeaters and Awareness
  Suppose I realize I am bootstrapping. I become aware that my only evidence for the thermometer's reliability is the thermometer itself. Does this higher-order awareness act as a *defeater* that strips away the first-order justification? Or does the reliability of the process swamp the meta-cognitive worry?

  ### 7. Internalist Intuitions
  The bootstrapping problem relies heavily on the internalist intuition that you must have a reason to trust a source before you use it. As a reliabilist, you view this as a category error. But isn't there a pragmatic value to that intuition? Doesn't requiring independent checks actually *make* processes more reliable in the long run, suggesting internalist norms track reliability even if they aren't constitutive of it?

  ### 8. Animal vs. Reflective Knowledge
  Ernest Sosa distinguishes between "animal knowledge" (unreflective reliability) and "reflective knowledge" (understanding why your source is reliable). Is bootstrapping a failure to achieve *reflective* knowledge rather than a failure of justification *simpliciter*? Can you have justified belief without understanding the reliability of the source?

  ### 9. The Normative Force of Justification
  If a belief is justified solely because it is produced by a reliable process, regardless of the agent's ability to verify that process, what normative force does "justification" have? If I am justified but cannot tell the difference between myself and a brain-in-a-vat, in what sense am I meeting an epistemic *obligation*?

  ### 10. Bootstrapping as a Feature, Not a Bug
  Finally, consider the possibility that bootstrapping isn't a problem to be solved but a feature of learning. Infants seem to bootstrap their perceptual systems without independent verification. If human cognition is naturally bootstrapping, is the philosophical objection merely a demand for a level of certainty that biological agents never actually possess or need?
