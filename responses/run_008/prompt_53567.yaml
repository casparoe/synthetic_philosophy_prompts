prompt: |-
  I do a small podcast for grad students and next week's guest is a reliabilist epistemologist who's on record saying that a reliable belief-forming process gives you justified beliefs without you needing any independent way of checking that the process is reliable. That seems to land her right in the bootstrapping problem, and I want to press on that: the case where you read your thermometer, conclude from each reading that it was accurate (since the thermometer is reliable), and thereby accumulate evidence that the thermometer is reliable — apparently earning justification for your source's reliability by riding piggyback on the source's own outputs. Draft me eight to ten questions that go beyond asking her to restate reliabilism. At least one should be on whether the Moorean reasoning pattern ("here's a hand, so there's an external world") is guilty of exactly the same thing, one on whether she can just bite the bullet and deny the incremental steps ever confer any justification (and if so, why reasoning from them feels so natural), and one on what happens when two people with equally reliable-seeming but contradictory sources each bootstrap their way to trusting their own. For each of those, add a follow-up keyed to the reply she's most likely to give. No generic getting-to-know-you stuff please, we only have 40 minutes.
