answer: |-
  The arrangement you describe encodes a theory of lawmaking that might be called **Asymmetric Skepticism**. It presupposes that the legislative process is capable of distinguishing, *ex ante*, between two classes of legal artifacts: those that constitute the stable background of social order, and those that represent exceptional exercises of state power.

  Here is a reconstruction of the implicit theory, followed by an analysis of its philosophical tensions and the hypothetical global sunset.

  ### 1. The Implicit Theory: Categorized Inertia

  The dual-default system rests on three core presuppositions about the nature of law and the competence of the legislature:

  **A. The Competence of Classification**
  The system assumes legislators possess the epistemic capacity to identify, at the moment of enactment, which laws are "dangerous" or "transient" enough to warrant a sunset. It presupposes that a surveillance power is fundamentally different in kind from a property regulation, and that this difference is legible enough to assign different temporal defaults. This is a rationalist bet: that we can predict which laws will require future scrutiny and which will not.

  **B. Inertia as Safety (for the Old), Inertia as Danger (for the New)**
  For the bulk of the code (permanent laws), the system assumes that *continuity is presumptively beneficial*. It treats the survival of a law over time as evidence of its utility. For sunsetted laws, it assumes the opposite: that *continuity is presumptively risky*. This suggests a view where the "ordinary" law is seen as constitutive of society (and thus stable), while "exceptional" law is seen as instrumental (and thus liable to mission creep or obsolescence).

  **C. The Burden of Proof Shift**
  The system creates two distinct evidentiary regimes.
  *   **Permanent Regime:** To remove a law, one must prove *harm*. The burden lies with the reformer.
  *   **Sunset Regime:** To keep a law, one must prove *utility*. The burden lies with the defender.
  This presupposes that for certain powers (tax, surveillance), the state's claim to authority is inherently suspect and requires periodic re-consent, whereas for ordinary civil regulations, the state's authority is settled.

  ### 2. Chesterton, Burke, and the "Statute of Limitations on Justification"

  Your invocation of Chesterton's Fence highlights a profound inconsistency in this arrangement.

  **The Violation of Chesterton's Principle**
  Chesterton's argument is that the *absence* of a known justification is not proof of the *absence* of a justification. A sunset clause inverts this: it treats the absence of a *current, articulable* justification as proof that the fence should be removed.
  The selective use of sunsets presupposes that for "dangerous" laws, the justification must be explicit and contemporary. If the reason for a surveillance power was "Condition X" ten years ago, and Condition X is no longer cited, the sunset clause demands the power expire—even if the power serves a subtle, deterrent function that is hard to measure. Here, the system privileges **articulable rationality** over **functional tacit knowledge**.

  **A Half-Burkean Compromise**
  Is this consistent with Burkean respect for accumulated wisdom? Only partially.
  *   **The Old Corpus:** The default permanence of ordinary law is deeply Burkean. It protects the "old fences" precisely because their origins are obscure. It assumes that if a law has survived the turbulence of politics for decades, it likely serves a function we may not fully understand but should not rashly discard.
  *   **The New Statutes:** The use of sunsets on new or specific powers is anti-Burkean. It treats new legislation not as an addition to tradition, but as an experiment that must prove its worth.
  *   **The Transition:** The system creates a "statute of limitations on justification." A new law with a sunset clause is treated as suspicious. But if it is renewed enough times, it may eventually be folded into the permanent code (or simply allowed to lapse into the "old corpus" if the sunset is removed). Once it becomes old enough, it gains the protection of obscurity. Thus, the system respects wisdom only *after* it has survived the gauntlet of rationalist scrutiny.

  ### 3. The Tyranny of Articulability

  The practice presupposes that a law's value must be **articulable on demand**. This introduces a bias against complex, systemic, or cultural benefits.

  *   **Measurable vs. Organic:** A tax credit can be easily evaluated (did revenue drop? did investment rise?). A norm-embedding law (e.g., a obscure procedural rule that prevents hasty litigation) may have benefits that are diffuse and hard to quantify.
  *   **The Penalty on Tacit Knowledge:** By requiring periodic re-authorization, sunset clauses favor laws that serve concentrated, visible interests (who can lobby for renewal) and disfavor laws that serve diffuse, invisible functions. If a law prevents a rare catastrophe, its success is silence. Under a sunset regime, silence looks like irrelevance.
  *   **The "Young Fence" Problem:** As you note, the presumption is applied mainly to young fences. This implies that **time confers legitimacy**. A new restriction on liberty is presumed dangerous; an old restriction is presumed customary. The system assumes that the *age* of a law is a proxy for its *compatibility* with the social order.

  ### 4. The Global Sunset Hypothetical

  If the default were flipped globally—every law sunsets unless re-authorized—the result would likely not be rational housekeeping, but **institutional destabilization that privileges organized power.**

  **A. The Transaction Cost Trap**
  Law provides the stable substrate upon which society plans. If every law expires, the legal environment becomes volatile. The transaction costs of re-evaluating the entire code would be immense. Legislatures would spend all their time re-authorizing the past rather than legislating for the future.

  **B. The Rent-Seeker's Advantage**
  A global sunset turns law into a subscription service. This quietly penalizes the tacit benefits you mentioned.
  *   **Concentrated Interests:** Groups that benefit from specific laws will invest heavily in lobbying for renewal.
  *   **Diffuse Interests:** The general public, which benefits from the "invisible infrastructure" of law (e.g., commercial predictability, environmental baselines), lacks the organization to lobby for the renewal of every obscure statute.
  *   **Result:** Laws that benefit organized lobbies survive; laws that benefit the general public through stability or obscurity die.

  **C. The Loss of the "Background"**
  The current default (permanence) treats law as a **platform**. The global sunset treats law as a **product**.
  If every law sunsets, the "background" against which citizens act disappears. You cannot rely on property rights, contract enforcement, or liability rules unless they are currently "in season." This undermines the very predictability that law is meant to provide. It assumes that rational re-evaluation is always superior to habitual reliance, which is a false efficiency. Habit is a cognitive shortcut that allows society to function without constant deliberation. A global sunset forces constant deliberation, exhausting the cognitive capital of the polity.

  ### Conclusion

  The current dual-default system presupposes that legislators can distinguish between **constitutive law** (which should be stable) and **instrumental power** (which should be scrutinized). It is a compromise between Burkean stability and Rationalist accountability.

  However, it relies on a "survivorship bias" theory of legitimacy: new laws are guilty until proven innocent (via sunset), but old laws are innocent until proven guilty (via permanence). This protects the "tacit knowledge" of the old order while subjecting the new order to the "tyranny of articulability."

  Flipping the default globally would not solve the problem of obsolete law; it would simply shift the advantage from the **inertial status quo** to the **organized lobbyist**. It would assume that every legal rule must justify its existence in the language of current policy metrics, thereby destroying the very rules whose value lies in their ability to remain unquestioned background noise. It would be rational housekeeping only if society were a machine that could be turned off for maintenance; but society is an organism that dies if its nervous system is constantly rewired.
