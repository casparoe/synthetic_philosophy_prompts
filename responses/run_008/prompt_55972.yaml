prompt: |-
  Before I get into any more arguments about duty-to-rescue laws or how much charity is required, I want the spec for the underlying concept. Write the desiderata a theory of supererogation has to meet to count as adequate -- the asymmetry it has to capture (doing the act is permissible, skipping it is also permissible, yet doing it merits praise while skipping merits no blame), the cases it has to get right, the distinctions it can't collapse (supererogation vs imperfect duty, the act being good vs the sacrifice being what makes it above and beyond, praise for doing vs blame for omitting), with the case or motivation behind each requirement. Make sure the weird ones are on the list: suberogation (bad-but-not-wrong acts like pointedly not returning a greeting), the person who takes a miserable high-paying job to give the money away (is the suffering part of the merit or a red herring?), tiny-probability-of-death rescues, and iterated cases where someone does a small supererogatory thing daily until it becomes the expected baseline. Also whether legal systems with a general duty to rescue have simply denied that easy rescues are supererogatory, and whether the theory has to be neutral between consequentialist and non-consequentialist foundations or can only live inside one. Flag which desiderata are genuinely load-bearing versus camp prejudices, and flag any subset you suspect can't be jointly satisfied -- I have a hunch the praise-without-blame asymmetry and "praise tracks exceeding what's required" pull against each other. Purpose to fix adequacy on: good enough to settle concrete arguments about required aid. No scorecard of existing theories, just the criteria, though tell me which single requirement knocks out the most contenders. Keep it tight-ish, a list is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of supererogation:

  1.  **Analyze the Request:**
      *   **Goal:** Define the *desiderata* (criteria/requirements) for an adequate theory of supererogation.
      *   **Purpose:** To settle concrete arguments about required aid (duty-to-rescue, charity levels).
      *   **Key Features to Include:**
          *   The Core Asymmetry (permissible to do/omit, praise for doing, no blame for omitting).
          *   Distinctions (supererogation vs. imperfect duty, act goodness vs. sacrifice, praise vs. blame).
          *   "Weird" Cases (suberogation, miserable high-paying job, tiny-probability rescues, iterated small acts).
          *   Legal Context (duty-to-rescue laws).
          *   Meta-ethical Neutrality (consequentialist vs. non-consequentialist).
          *   Load-bearing vs. Camp Prejudices.
          *   Incompatibility Flags (specifically the tension between asymmetry and praise-tracking).
          *   The "Knockout" Requirement (which one kills the most theories).
      *   **Format:** Tight-ish, list format is fine. No scorecard of existing theories.

  2.  **Deconstruct the Core Concept:**
      *   Supererogation is the "above and beyond."
      *   Standard definition: $X$ is supererogatory iff (1) $X$ is permissible, (2) $\neg X$ is permissible, (3) $X$ is morally better than $\neg X$.
      *   The prompt asks for the *spec* that a theory must meet to handle the *arguments* about aid. This means the theory needs to be action-guiding or at least classification-guiding in high-stakes contexts.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Asymmetry.* This is the big one. Doable = OK, Not Doable = OK. But Doable = Good/Praiseworthy. Not Doable = Not Bad/Blameworthy.
          *   *Motivation:* Captures the intuition that saints aren't obligated, but sinners aren't necessarily sinning if they aren't saints.
          *   *Load-bearing:* Yes. Without this, it's just duty or prohibition.

      *   *Requirement 2: The Sacrifice/Cost Condition.* Why is it supererogatory? Usually because it costs the agent something.
          *   *Motivation:* Distinguishes from "easy goodness" (picking up a dollar on the ground).
          *   *Weird Case:* The Miserable High-Paying Job. If I suffer to make money to donate, is the suffering the merit? Or the donation?
          *   *Refinement:* Needs to handle whether cost is *necessary* or just *contingent*.

      *   *Requirement 3: Imperfect Duty Distinction.*
          *   *Motivation:* Charity is often an imperfect duty (you must give *some*, but can choose *where/when*). Supererogation is often seen as *none* required.
          *   *Load-bearing:* Crucial for the "how much charity" argument. If everything above minimum is supererogatory, the minimum is low. If everything above optimum is supererogatory, the optimum is duty.

      *   *Requirement 4: Suberogation (The Mirror).*
          *   *Motivation:* If there's "above and beyond good," is there "below par but not wrong"? (e.g., not waving back).
          *   *Load-bearing:* Camp prejudice? Maybe, but tests symmetry of the theory.

      *   *Requirement 5: Iteration/Habituation.*
          *   *Motivation:* If I do a supererogatory act every day, does it become duty? (The "Saint's Trap").
          *   *Load-bearing:* High. Affects long-term aid commitments.

      *   *Requirement 6: Risk/Probability.*
          *   *Motivation:* Tiny-probability-of-death rescues. Is risking 0.0001% death supererogatory or required?
          *   *Load-bearing:* High for rescue laws.

      *   *Requirement 7: Legal vs. Moral.*
          *   *Motivation:* Duty-to-rescue laws make some supererogatory acts mandatory. Does this destroy the category or just shift the baseline?
          *   *Load-bearing:* Medium. Mostly definitional.

      *   *Requirement 8: Meta-ethical Neutrality.*
          *   *Motivation:* Can a utilitarian believe in supererogation? (Classic problem: Maximizing utilitarianism says you *must* maximize, so nothing is supererogatory).
          *   *Load-bearing:* **Huge.** This is likely the "Knockout."

      *   *Requirement 9: The Praise/Blame Tension (The User's Hunch).*
          *   *Motivation:* User suspects "Praise without blame" conflicts with "Praise tracks exceeding requirement."
          *   *Analysis:* If praise tracks exceeding requirement, and I don't blame you for not exceeding, do I praise you for doing it? Yes. But if the theory says "Maximize good," then not maximizing is blameworthy.
          *   *Flag:* Incompatibility risk.

  4.  **Refining and Categorizing:**
      *   Need to distinguish between *Load-Bearing* (essential for the aid argument) and *Camp Prejudices* (philosophical baggage).
      *   Need to identify the *Knockout*.
      *   Need to address the *Incompatibility*.

  5.  **Drafting the Content (incorporating specific constraints):**
      *   *Asymmetry:* Must explain why omission isn't wrong.
      *   *Cost/Sacrifice:* Address the Miserable Job case.
      *   *Iteration:* Address the "daily saint" problem.
      *   *Suberogation:* Include as a stress test.
      *   *Legal:* Address the shift in baseline.
      *   *Neutrality:* Address Consequentialism.
      *   *Knockout:* The "Optimization vs. Permission" conflict (Consequentialist compatibility).
      *   *Incompatibility:* The Praise/Blame vs. Betterness tension.

  6.  **Review against constraints:**
      *   "Tight-ish": Keep descriptions concise.
      *   "No scorecard": Don't mention Utilitarianism/Kantianism by name as *theories*, just as challenges.
      *   "Purpose to fix adequacy on: good enough to settle concrete arguments about required aid." -> Emphasize the duty/supererogation boundary.
      *   "Flag load-bearing vs prejudices."
      *   "Flag incompatible subsets."

  7.  **Final Polish:**
      *   Make sure the "Miserable Job" case is clearly articulated (is suffering a prerequisite for merit?).
      *   Make sure the "Iteration" case is clear (does repetition create duty?).
      *   Ensure the "Knockout" is identified clearly.

      *(Self-Correction during drafting)*: I initially thought about making "Neutrality" the knockout. But actually, the "Optimization Problem" (if you ought to do the best, you can't have supererogation) is the specific mechanism. I should phrase it as the "Maximization Constraint."
      Also, the user's hunch about Praise vs. Exceeding is important. If praise tracks *exceeding*, and omission is *permissible*, then the theory must allow for "permissible sub-optimality." This is the real killer for strict consequentialism.

      Let's structure the list logically: Core Logic, Boundary Conditions, Edge Cases, Meta-Ethics.

      *Load-bearing:* Asymmetry, Duty Boundary, Risk.
      *Prejudices:* Suberogation (nice to have, not needed for aid), Neutrality (maybe a prejudice to demand it, but necessary for broad application).
      *Knockout:* The Permissible Sub-Optimality condition (kills strict maximizing theories).
      *Incompatibility:* The Praise/Blame symmetry vs. the Goodness gradient.

      *Wait, one more check:* The user wants to settle arguments about *required aid*. This means the theory must clearly delineate where Duty ends and Supererogation begins. A theory that makes *everything* supererogatory (no duties) or *nothing* supererogatory (all duties) fails. So the "Boundary Determinacy" is crucial.

      *Re-evaluating the "Knockout":* The hardest thing for theories to explain is *why* an agent is permitted to do less than the best. So the "Permission to Opt Out" is the knockout.

      *Re-evaluating the "Incompatibility":* The user suspects Praise-without-Blame conflicts with Praise-tracks-Exceeding. Actually, they don't necessarily conflict, but they require a specific structure (agent-relative options). I should flag the tension between "Objective Betterness" and "Subjective Permission."

      *Let's write it.*

      *Structure:*
      1. Core Logical Structure (The Asymmetry).
      2. The Duty Boundary (Aid relevance).
      3. Cost & Sacrifice (The Miserable Job).
      4. Temporal/Iterative (The Habituation).
      5. Risk & Probability (The Rescue).
      6. Legal Interaction.
      7. Meta-ethical Scope.
      8. The Incompatibility Flag.
      9. The Knockout.

      *Refining the "Miserable Job":* If I take a miserable job to donate, is the misery the supererogatory part? Or is the donation? If I win the lottery and donate, is it less praiseworthy? The theory must specify if *cost* is constitutive of supererogation or just evidence of it.

      *Refining "Suberogation":* Flag as mostly heuristic/prejudice but useful for symmetry testing.

      *Refining "Neutrality":* Flag as load-bearing for a general theory, but many specific theories fail it.

      *Final check on "Knockout":* The "Optionality of the Optimum" is the standard name for this. I'll use clear language.

      *Final check on "Incompatibility":* The tension is between "Morally Better" (objective) and "Permissible to Omit" (subjective/agent-relative). If it's objectively better, why is it permissible to ignore it? That's the tension.

