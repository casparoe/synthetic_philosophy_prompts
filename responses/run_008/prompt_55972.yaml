answer: |-
  ### Desiderata for an Adequate Theory of Supererogation

  **Purpose:** To delineate the boundary between required aid and optional charity, settling arguments about duty-to-rescue and charitable obligation.

  #### 1. The Core Asymmetry (The Urmson Condition)
  *   **Spec:** The theory must classify act $X$ such that: (a) Doing $X$ is morally permissible; (b) Omitting $X$ is morally permissible; (c) Doing $X$ is morally better than omitting $X$; (d) Doing $X$ merits praise; (e) Omitting $X$ merits no blame.
  *   **Motivation:** Captures the intuition that saints are not obligated to be saints, and non-saints are not sinners for failing to be saints.
  *   **Status:** [LOAD-BEARING] Without this, the category collapses into duty or prohibition.

  #### 2. The Boundary Determinacy (The Aid Threshold)
  *   **Spec:** The theory must provide a non-arbitrary principle for where duty ends and supererogation begins. It cannot simply assert "some acts are required, others aren't." It must explain *why* saving a drowning child in shallow water is duty, while donating a kidney is supererogatory (or vice versa).
  *   **Motivation:** Essential for the stated purpose. If the boundary is vague, the theory cannot resolve arguments about required aid levels.
  *   **Status:** [LOAD-BEARING] Most theories fail here by sliding into vagueness or intuition-mongering.

  #### 3. The Cost/Sacrifice Condition (The Miserable Job Test)
  *   **Spec:** The theory must specify the role of agent-cost.
      *   *Case:* An agent takes a miserable, high-paying job solely to donate the surplus to effective charity.
      *   *Requirement:* Does the merit derive from the *donation* (outcome) or the *suffering* (sacrifice)? If the agent wins the lottery and donates the same amount without suffering, is the act less supererogatory?
  *   **Motivation:** Distinguishes supererogation from mere "good outcomes." If sacrifice is required, easy goodness isn't supererogatory. If sacrifice is irrelevant, the "above and beyond" loses its agent-relative weight.
  *   **Status:** [LOAD-BEARING] Determines whether "effective altruism" without personal cost counts as supererogatory or duty.

  #### 4. The Iteration/Habituation Constraint (The Saint's Trap)
  *   **Spec:** The theory must handle repeated supererogatory acts. If an agent performs a supererogatory act (e.g., daily volunteerism) consistently over time, does it transform into a duty?
  *   **Motivation:** Prevents the "baseline creep" where doing good regularly makes you obligated to continue, punishing consistency.
  *   **Status:** [LOAD-BEARING] Critical for long-term aid commitments.

  #### 5. Risk and Probability Sensitivity (The Tiny-Death Rescue)
  *   **Spec:** The theory must quantify the relationship between risk to the agent and duty.
      *   *Case:* Saving a stranger carries a 0.0001% risk of death vs. a 50% risk.
      *   **Requirement:** At what probability does rescue shift from supererogatory to required (or from required to forbidden)?
  *   **Motivation:** Duty-to-rescue laws hinge on "reasonable risk." A theory must define "reasonable."
  *   **Status:** [LOAD-BEARING] Directly applies to legal and physical rescue scenarios.

  #### 6. Suberogation Symmetry (The Rude Greeting)
  *   **Spec:** The theory should account for the mirror category: acts that are permissible to do, permissible to omit, but *bad* to do (e.g., pointedly not returning a wave).
  *   **Motivation:** Tests the structural symmetry of the moral landscape. If "good-but-not-required" exists, should "bad-but-not-forbidden" exist?
  *   **Status:** [CAMP PREJUDICE] Useful for structural elegance, but not strictly necessary to settle aid arguments.

  #### 7. Legal Baseline Neutrality
  *   **Spec:** The theory must explain the relationship between legal duty and moral supererogation.
      *   *Case:* A jurisdiction passes a general duty-to-rescue law.
      *   **Requirement:** Does this law *create* a moral duty where none existed, or does it merely enforce a pre-existing moral duty? (i.e., Was the easy rescue *always* a duty, and the law just recognized it?)
  *   **Motivation:** Prevents the theory from being rendered obsolete by legislation.
  *   **Status:** [LOAD-BEARING] Necessary for real-world application in regulated societies.

  #### 8. Meta-Ethical Portability
  *   **Spec:** The theory should not rely exclusively on non-consequentialist ontology (e.g., rights, virtues) to function. It must explain whether a maximizing framework (consequentialism) can accommodate supererogation without contradiction.
  *   **Motivation:** If only deontologists can believe in supererogation, the concept is too narrow for broad policy agreement.
  *   **Status:** [CAMP PREJUDICE / HIGH BAR] Desirable, but many argue supererogation is inherently anti-consequentialist.

  ---

  ### ⚠️ The Incompatibility Flag
  **The Praise/Betterness Tension**
  You suspected the "praise-without-blame asymmetry" and "praise tracks exceeding what's required" pull against each other. You are correct.
  *   **The Conflict:** If praise tracks "moral betterness" (Objective View), then omitting the act is objectively sub-optimal. If the theory admits "Objective Sub-Optimality," it struggles to justify "No Blame" (Subjective Permission) without introducing a dual-system (e.g., Objective vs. Subjective oughts).
  *   **The Risk:** A theory that satisfies **Desideratum 1 (Asymmetry)** often violates **Desideratum 8 (Portability)** because maximizing frameworks cannot easily accommodate "permissible sub-optimality." To keep them jointly satisfied, the theory must posit *agent-relative options* (prerogatives), which many find ontologically suspicious.

  ### 🥊 The Knockout Requirement
  **Desideratum 1(c) & 1(b) Combined: Permissible Sub-Optimality**
  *   **Why:** This is the single requirement that knocks out the most contenders.
  *   **The Casualty:** Strict Act Consequentialism (and any strict maximizing theory). If you are always required to produce the best outcome, you can never permissibly omit the best act. Therefore, supererogation is impossible.
  *   **The Implication:** To meet the spec, a theory *must* reject strict maximization or introduce a "zone of discretion." If your theory of aid says "you must always do the most good possible," you have no theory of supererogation; you have a theory of total obligation.

  ### Summary for Adequacy
  To settle arguments about required aid, the theory must prioritize **Desideratum 2 (Boundary Determinacy)** and **Desideratum 5 (Risk Sensitivity)**. A theory that nails the Asymmetry but cannot tell me if I am *required* to donate 10% vs. 50% of income is descriptively accurate but practically useless. Focus on the **Boundary** and the **Cost Condition**; these are the levers that move the "required aid" needle.
