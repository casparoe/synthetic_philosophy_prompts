answer: |-
  1. "The principle, stated"

  1. **Acquaintance Condition:** Phenomenal knowledge constitutes *acquaintance*, a direct cognitive relation to qualitative character, distinct from propositional fact.
  2. **Memory Constraint:** Acquaintance requires a persistent memory trace of an experiential instance; the veridicality of the instance is irrelevant.
  3. **Internal Scope:** Acquaintance yields knowledge of phenomenology only, not of external objects or their physical properties.
  4. **Asymmetry:** Physical facts alone cannot generate acquaintance; acquaintance alone cannot generate new physical facts.

  2. "Verdict by verdict"

  1. **Classic Release:** The principle agrees Mary learns something (acquaintance). However, it flags your gloss that she learns "about the world." Clause 3 restricts the gain to phenomenology. The principle forces you to accept she learns something, but not about external reality.
  2. **Forgotten Glimpse:** Matches perfectly. Clause 2 requires a persistent memory trace. Amnesia wipes the trace, so acquaintance is never established. She remains empty-handed.
  3. **The Dream:** Matches perfectly. Clause 2 states veridicality is irrelevant. The dream provides an instance; intact memory provides the trace. Acquaintance is secured pre-release.
  4. **Blind Colleague:** Matches. Clause 1 defines the gain as acquaintance, not fact. The colleague lacks the cognitive relation (acquaintance) but holds all propositions. This explains your hesitation to call it "knowledge" in the factual sense.
  5. **Arbitrary Pill:** Matches perfectly. Clause 3 separates phenomenology from external properties. She gains acquaintance ("knows what red is like") but learns nothing about red things (external scope). This resolves your tension between Cases 1 and 5.
  6. **Sighted Student:** Matches. Clause 4 establishes asymmetry. Frank has acquaintance; adding physical facts does not alter that relation. No parallel gain occurs.

  The principle accommodates all six verdicts provided we accept the clarification on Case 1. The only friction is your intuition in the trouble section that Case 1 implies learning about the *world*. The principle dictates that learning is internal. Every other verdict aligns without modification. The Memory Constraint specifically resolves the 2 vs. 3 tension by prioritizing retention over reality. The Internal Scope resolves the 1 vs. 5 tension by distinguishing phenomenal knowledge from object knowledge.

  3. "The verdict that goes"

  The sacrifice is your interpretation of Case 1 as Mary learning something "about the world." While you insist she "learns something," the claim that this something concerns the external world contradicts Cases 3 and 5. Case 3 shows a non-veridical dream suffices for the gain; Case 5 shows a causeless pill suffices for the gain but teaches nothing about red things. If the gain survives without red things existing, it cannot be about red things.

  This is the right sacrifice because retaining the "about the world" gloss forces a logical contradiction with your own internalist intuitions in 3 and 5. The repaired set reads Case 1 as Mary learning something about *her own capacities* or *phenomenal character*. She gains a relation to her mind, not a fact about the wall. This preserves your core insistence that she learns *something* (acquaintance) while harmonizing with the evidence that the gain is independent of external reality. It transforms the Knowledge Argument from a proof about physicalism's failure to describe the world into a proof about the unique nature of self-knowledge.

  4. "Predictions"

  1. **The Fading Trace:** Mary sees red, but due to a neurological condition, the memory trace degrades completely over 24 hours. She is then released.
      *   **Verdict:** She learns nothing at release.
      *   **Reasoning:** Clause 2 requires a *persistent* memory trace. If the trace fades before release, acquaintance is lost. She is functionally identical to Case 2 (Forgotten Glimpse).
      *   **Confidence:** High. This follows directly from the Memory Constraint.

  2. **Inattentional Blindness:** Mary sees a red patch during captivity but is cognitively overloaded; no memory trace is encoded despite normal vision.
      *   **Verdict:** She learns nothing.
      *   **Reasoning:** Visual exposure alone is insufficient without the cognitive encoding required for Clause 2. No trace means no acquaintance.
      *   **Confidence:** High. This stresses the "memory" requirement over mere "exposure."

  3. **False Memory Implant:** Neuroscientists implant a vivid, false memory of seeing red into Mary's brain during captivity. She believes it happened.
      *   **Verdict:** She knows what red is like; learns nothing at release.
      *   **Reasoning:** Clause 2 states veridicality is irrelevant. If the trace exists and functions as acquaintance (as in Case 3), she has the knowledge.
      *   **Confidence:** Moderate. This depends on whether implanted traces function identically to experiential traces for acquaintance. If acquaintance requires *causal* history rather than just memory structure, this verdict might flip. However, given Case 3 (dreams), structural similarity should suffice.

  These cases stress the Memory Constraint. They suggest that "Mary's Knowledge" is fragile, dependent on neural retention rather than metaphysical revelation. If the memory goes, the knowledge goes. This predicts that Mary's gain is naturalizable as a specific memory-based cognitive state.

  5. "Where this sits"

  This view is a **Memory-Constrained Acquaintance Theory**, closely allied with the **Ability Hypothesis**. Like the Ability Hypothesis (Lewis, Nemirow), it denies Mary gains new propositional facts about the world (aligning with Case 5 and 6). Like Acquaintance Theory (Russell), it posits a unique cognitive relation distinct from description (Case 4).

  The single point of sharpest divergence is from **New Fact Physicalism** (or Non-Physicalism). Those views claim Mary learns a new truth *about the world* (e.g., "Red experiences exist"). My principle denies this: the gain is relational and internal, not propositional and external. It diverges from pure Ability views by making the capacity dependent on persistent memory traces (Case 2), not just dispositional states. It treats phenomenal knowledge as a state of *being acquainted* via memory, rather than knowing *that* something is the case.
