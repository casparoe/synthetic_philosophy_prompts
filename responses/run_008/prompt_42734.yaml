      *   *Manipulation:* One of the Y voters knows W is winning. If they vote X insincerely, X might beat W (if they prefer X over W).
      *   *Implementation:* I will hand out preference cards that are *not* random. I will create two distinct "types" of preference profiles distributed across the two committees so that the aggregate math works out for the demonstration.
