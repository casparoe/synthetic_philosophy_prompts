answer: |-
  # Lesson Plan: The Impossibility Experience
  **Course:** Upper-Level Seminar in Political Philosophy / Social Choice Theory
  **Topic:** The Gibbard–Satterthwaite Theorem
  **Time:** 75 Minutes
  **Class Size:** 14 Students

  ## I. Learning Objective
  Students will move from knowing the *statement* of the Gibbard–Satterthwaite (G-S) theorem to feeling its *force*. By participating in a series of voting rounds where their material payoff depends on the outcome, they will experience the tension between **non-dictatorship** and **strategy-proofness**. The session concludes by mapping their experience onto the theorem's formal conditions and clarifying what the theorem proves that the game cannot.

  ## II. Materials & Payoff Scheme
  **Payoff:** **High-quality Chocolate Points.**
  *   **Why Candy over Extra Credit?** Extra credit introduces cardinal utility noise (is 0.5% worth a moral compromise?) and administrative lag. Chocolate is immediate, divisible, and allows you to assign specific ordinal values (1st choice = 4 pieces, 4th choice = 1 piece) that align perfectly with the ordinal nature of G-S. It keeps the mood light enough for experimentation but tangible enough for incentives.
  *   **Quantity:** ~100 pieces total (e.g., 2 large bars broken up).

  **Physical Materials:**
  1.  **Preference Cards (14 total):** Pre-assigned rankings of 4 alternatives (A, B, C, D). *See Appendix for specific profiles.*
  2.  **Payoff Cards (14 total):** Match the Preference Cards (Rank 1 = 4 pts, Rank 2 = 3 pts, etc.).
  3.  **Ballots (5 sets of 14):** Distinctly colored for each round.
  4.  **Strategic Memos (3 total):** For Round 3 only.
  5.  **Scoreboard:** Whiteboard to track group scores.
  6.  **Calculator/Spreadsheet:** For the instructor to tally Borda/Runoff quickly.

  ## III. Session Flow (75 Minutes)

  ### 1. Setup & Preference Assignment (0:00–0:10)
  *   **Divide:** Split the class into two committees of 7 students (Group 1, Group 2). They sit in separate clusters.
  *   **Distribute:** Hand out **Preference Cards** and **Payoff Cards** face down.
      *   *Instruction:* "This is your sincere ranking. Do not show it to anyone. Your payoff depends on how high your sincere ranking finishes."
  *   **Alternatives:** Define the 4 options clearly (e.g., A = Dark Chocolate Policy, B = Milk Chocolate Policy, etc., or abstract A, B, C, D).
  *   **The Stakes:** "At the end of class, the winner of each round determines your payout for that round. If your #1 choice wins, you get 4 pieces of chocolate. #2 gets 3, etc."

  ### 2. The Voting Rounds (0:10–0:45)
  *Time limit: 7 minutes per round. You must act as a strict Returning Officer.*

  **Round 1: Plurality Rule**
  *   **Rule:** Vote for one alternative. Highest votes wins. Ties broken by coin flip.
  *   **Info:** No information about others' votes.
  *   **Action:** Vote, tally, announce winner.
  *   **Goal:** Establish baseline sincerity. Most will vote sincerely here.

  **Round 2: Borda Count**
  *   **Rule:** Rank all 4. 1st=3pts, 2nd=2pts, 3rd=1pt, 4th=0pts.
  *   **Info:** No information about others' votes.
  *   **Action:** Vote, tally (use a student clerk per group to speed this up), announce winner.
  *   **Goal:** Show complexity. Manipulation is possible but hard to calculate without info.

  **Round 3: Instant Runoff (The "Trap" Round)**
  *   **Rule:** Eliminate lowest first-choice votes, transfer until majority.
  *   **Info Injection:** **Crucial Step.** Before voting, hand **Strategic Memos** to 3 specific students (one in Group 1, two in Group 2).
      *   *Memo Content:* "Leak: 5 members of your committee plan to vote sincerely as follows: [List 5 specific ballots based on your pre-assigned profiles]. You know your own sincere vote. You have 2 minutes to decide your ballot."
      *   *Design:* The profiles are rigged so that if the memo-holders vote sincerely, their #1 choice is eliminated early. If they insincerely rank a compromise candidate higher, their #1 choice survives longer or the compromise wins (which they prefer over the sincere outcome).
  *   **Action:** Vote, tally, announce.
  *   **Goal:** Create the *experience* of temptation. The memo-holders *know* they can gain by lying.

  **Round 4: Approval Voting (Custom Rule)**
  *   **Rule:** Vote for as many alternatives as you like. Most approvals wins.
  *   **Info:** Public poll. "Raise your hand if you approve of A... B..." (Take a non-binding straw poll first).
  *   **Action:** Formal vote, tally, announce.
  *   **Goal:** Show that even rules designed to reduce strategy (like Approval) succumb to it when stakes are known (e.g., "bullet voting" for a favorite to prevent a rival).

  **Round 5: Dictatorship (Control)**
  *   **Rule:** "The outcome is whatever Student X (pre-selected) ranks first."
  *   **Info:** Announce who the Dictator is *after* the vote to prevent collusion, or announce beforehand to demonstrate the condition. *Better for G-S:* Announce beforehand. "Student 7 is the Dictator. Everyone else submits a ballot, but only Student 7's #1 choice matters."
  *   **Action:** Vote (mostly theatrical for non-dictators), announce.
  *   **Goal:** Demonstrate Strategy-Proofness at the cost of Non-Dictatorship.

  ### 3. Payout & Transition (0:45–0:50)
  *   Distribute chocolate based on the cumulative results (or just Round 3 for simplicity to save time).
  *   Ask students to keep their Preference Cards and Memos for the debrief.

  ### 4. The Debrief & Lecture (0:50–1:15)
  *   **Phase 1: Phenomenology (5 mins)**
      *   Ask the Memo-holders in Round 3: "Did you lie? Why?"
      *   Ask the non-Dictators in Round 5: "Did you lie? Did it matter?"
  *   **Phase 2: Mapping to G-S (10 mins)**
      *   Write the three G-S conditions on the board:
          1.  **Non-Dictatorship:** No single voter determines the outcome.
          2.  **Surjectivity (Range):** Every alternative can win under some profile.
          3.  **Strategy-Proofness:** No voter can benefit by misrepresenting preferences.
      *   **Map the Rounds:**
          *   *Rounds 1-4:* Satisfied (1) and (2). Failed (3). *Evidence:* The Round 3 Memo-holders gained chocolate by lying.
          *   *Round 5:* Satisfied (3). (If you lie as a non-dictator, it doesn't change the outcome; if you are the dictator, you vote sincerely to get your #1). Failed (1).
      *   **The Trade-off:** "You just proved the theorem experimentally. Every time we kept the power democratic (Rounds 1-4), someone found a lie that paid. The only time the lie didn't pay (Round 5), we abolished democracy."
  *   **Phase 3: The Gap (10 mins)**
      *   **What the game did:** Showed existence of manipulation in *specific* rules.
      *   **What the game didn't do:** Prove it for *all* rules.
      *   **The Lecture Close:** "You might ask: 'Why not design a Rule 6 that fixes this?' The theorem says Rule 6 is impossible. The proof works by showing that if a rule is strategy-proof, you can construct a 'pivotal voter' who effectively becomes a dictator. We saw the Dictator round was safe from manipulation. The math proves that *any* safe rule must structurally resemble that Dictator round, even if it doesn't look like it on the surface."

  ## IV. Practical Logistics & Troubleshooting

  ### 1. Information Flow (The Round 3 Leak)
  To ensure the manipulation is computable within 2 minutes, you must pre-calculate the profiles.
  *   **Setup:** 7 Voters. 4 Options (A, B, C, D).
  *   **The Profile:**
      *   Voters 1-3: A > B > C > D
      *   Voters 4-5: B > C > A > D
      *   Voters 6-7: C > B > A > D
  *   **Sincere Outcome (Runoff):** A has 3, B has 2, C has 2. D eliminated. C eliminated (lowest). B transfers to... wait, in Runoff, C is eliminated. C's votes go to B. B now has 4. B wins.
  *   **The Manipulation:** Voter 1 (Prefers A) knows this. If Voter 1 insincerely votes B > A > C > D.
      *   New First Choices: A(2), B(3), C(2).
      *   A is eliminated. A's votes transfer to B. B wins.
      *   *Wait, this doesn't help Voter 1.*
      *   *Correction for the Trap:* You need a profile where sincere voting leads to a *worst* outcome, but tactical voting leads to a *better* outcome.
      *   *Revised Profile for Round 3:*
          *   3 Voters: A > C > B
          *   2 Voters: B > C > A
          *   2 Voters: C > B > A
          *   *Sincere:* A(3), B(2), C(2). C eliminated. C votes go to B. B wins (4 vs 3).
          *   *Manipulation:* One A-voter knows this. They prefer C over B. If they vote C > A > B.
          *   *New Count:* A(2), B(2), C(3). A eliminated. A votes go to C. C wins.
          *   *Payoff:* A-voter gets #2 choice (C) instead of #3 choice (B).
  *   **Execution:** Assign the 3 "A-voters" in Group 1. Give the Memo to *one* of them. Tell them: "5 people are voting sincerely: 2 for B, 2 for C, 1 for A (the other A voter is undecided)." This allows the memo-holder to calculate that voting A is futile, but voting C saves C.

  ### 2. Predictable Failures & Fixes
  *   **Failure:** Students manipulate "badly" (randomly) and the rule still fails, but they don't realize *why*.
      *   **Fix:** In the debrief, ask specifically: "Did anyone calculate that a lie would improve their payoff?" If no one did, reveal the Round 3 math yourself. "The theorem doesn't require you to be smart enough to find the lie; it requires only that the lie *exists*."
  *   **Failure:** Boredom during the Dictator Round.
      *   **Fix:** Make it dramatic. "In this round, only Sarah's ballot will be counted. Everyone else, write anything you want on the paper. It will be shredded." This highlights the *definition* of dictatorship sharply.
  *   **Failure:** Time overrun.
      *   **Fix:** Cut Round 4 (Approval). Plurality, Borda, Runoff, Dictator is sufficient to make the point. Plurality shows basic strategy; Borda shows complex strategy; Runoff shows sequential strategy; Dictator shows the only escape.

  ### 3. The "Lecture Gap" (Crucial for Philosophy Students)
  You must explicitly state what the game *cannot* do.
  *   **Finite vs. Infinite:** The game tested 4 rules. G-S quantifies over *all* possible functions mapping profiles to outcomes.
  *   **Existence vs. Necessity:** The game shows manipulation is *possible* in these rules. G-S shows it is *necessary* in *any* non-dictatorial rule.
  *   **The Proof Sketch:** Briefly explain the "Pivotal Voter" argument. "If a rule is strategy-proof, we can shift preferences one by one. At some point, a single voter's change must flip the social outcome. That voter is pivotal. If they are always pivotal, they are a dictator. The math proves you cannot have a rule where pivotality is shared."

  ## V. Appendix: Pre-Assigned Preference Cards (For 14 Students)
  *Create 2 identical sets of 7 for the two groups.*

  **Voter 1 (The Manipulator):** A > C > B > D
  **Voter 2:** A > C > B > D
  **Voter 3:** A > C > B > D
  **Voter 4:** B > C > A > D
  **Voter 5:** B > C > A > D
  **Voter 6:** C > B > A > D
  **Voter 7:** C > B > A > D

  *   **Sincere Plurality Winner:** A (3 votes) vs B (2) vs C (2). A wins.
  *   **Sincere Runoff Winner:** A (3), B (2), C (2). D eliminated. No majority. B or C eliminated (tie break). If C eliminated, C votes go to B. B wins (4 vs 3).
  *   **Manipulation:** Voter 1 knows B will win. Voter 1 prefers C over B. Voter 1 votes C > A > B > D.
  *   **Manipulated Runoff:** A (2), B (2), C (3). A eliminated. A votes go to C. C wins (5 vs 2).
  *   **Result:** Voter 1 gets C (2nd choice) instead of B (3rd choice). Payoff increases.

  *(Note: Ensure the "Memo" given to Voter 1 reveals the votes of Voters 4, 5, 6, 7, and 2.)*

  ## VI. Instructor's Closing Script (Sample)
  "You just felt the Gibbard–Satterthwaite theorem. In Rounds 1 through 4, you were in a democracy. In every single one, there existed a ballot you could have cast that was not your sincere ranking, which would have yielded you more chocolate. You might say, 'But I didn't lie in Round 1.' The theorem doesn't care if you are honest; it cares that the *incentive* exists.

  In Round 5, the incentive vanished. Why? Because the rule was dictatorial. If you weren't the dictator, your lie changed nothing. If you were the dictator, your best move was honesty.

  So, we have a trilemma. We want rules that are Democratic, Comprehensive (anyone can win), and Honest. The theorem proves you can pick any two, but never all three. If you demand Democracy and Comprehensive outcomes, you *must* accept that your system invites lying. The proof we will study next week shows why this isn't just a flaw of Plurality or Borda, but a structural feature of aggregation itself."
