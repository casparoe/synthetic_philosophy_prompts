          *   **Phase 2 (T=45):** The moment arrives. Option S: 1 Ticket *Now*. Option L: 3 Tickets at T=90. (S is immediate).
      *   *Prediction:* High LL preference at T=0. Significant shift to SS at T=45.
      *   *Materials:* Two colored slips of paper (e.g., Blue for Phase 1, Red for Phase 2). Box for Phase 1 slips.
      *   *Instructions:* Keep Phase 1 secret. Phase 2 is anonymous.

  8.  **Addressing the "What Will Go Wrong" Section:**
      *   *Consistency Bias:* People hate looking flaky.
      *   *Solution:* Collect Phase 1 slips immediately and mix them. Emphasize Phase 2 is a "new decision."
