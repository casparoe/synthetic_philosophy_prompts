              *   *Best approach:* Frame Stage 1 as "What would you do?" and Stage 2 as "What will you do?"
              *   *Actually, let's look at the Pigeon data:* Pigeons peck Key A (Small/Soon) vs Key B (Large/Later). As delay to A decreases, preference shifts.
              *   *Human Analog:*
                  *   T=0: Choose between (1 unit at T=60) vs (3 units at T=90). (Both delayed).
