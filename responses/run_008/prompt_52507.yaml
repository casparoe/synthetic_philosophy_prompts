      *   *Social Desirability:* They might stick to their T=0 plan to look consistent.
      *   *Mitigation:* Emphasize anonymity at T=60. "No one will know what you chose earlier." Remind them T=0 was hypothetical/prediction.

  5.  **Debrief & Philosophy:**
      *   *Data:* Plot the group % choosing Large/Later at T=0 vs T=60.
      *   *Graph:* Hyperbola vs Exponential.
      *   *Socrates:* "No one errs willingly." If they flipped, did they learn something new? (The visceral pull of 'now'). Or was it ignorance of their own future state?
      *   *Aristotle:* Akrasia is real. Reason is present but overpowered by appetite. The T=60 moment *feels* different.
      *   *Limitations:* Lab vs. Life. Stakes are low. No addiction. No long-term consequences.

  6.  **Refining the Activity for the User's Expertise:**
      *   The user knows the math. I should use terminology correctly (indifference point, discount parameter $k$) but keep the handout simple for the group.
