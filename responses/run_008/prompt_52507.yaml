                  2.  **T=60:** "The time has come. You can take 1 Chocolate *now*. Or wait until 90 mins for 3." (Public or private choice? Private reduces social pressure).
                  3.  **Comparison:** Open T=0 envelopes. Compare with T=60 actions.

  4.  **Addressing the "Retiree/Polite" Factor (Failure Modes):**
      *   *Issue:* They might not want the chocolate (diet/health).
      *   *Fix:* Offer a choice of reward (Tea, Chocolate, Raffle Ticket) or make it a donation to a cause (1 unit now vs 3 units later). *Donation is better for "rationality" but less visceral.* Let's stick to chocolate but make it high quality and acknowledge dietary restrictions. Or use "Raffle Tickets" for a single nice prize (e.g., a $20 bookstore voucher).
      *   *Raffle Ticket Approach:*
          *   T=0: Choose 1 Ticket (drawn at 60 mins) vs 3 Tickets (drawn at 90 mins).
          *   T=60: Take 1 Ticket (put in drum now) vs Wait for 3 Tickets (put in drum at 90).
