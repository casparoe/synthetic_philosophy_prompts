      *   *Crucial Tweak:* To ensure the reversal happens, the "Small/Soon" at T=60 must be *very* salient. Handing them the physical ticket/prize helps.

  7.  **Finalizing the Plan:**
      *   **Activity:** "The Two-Moment Raffle."
      *   **Rewards:** Raffle tickets for a desirable prize (e.g., a nice bottle of wine, book, or gift card).
      *   **Timing:** T=0 (Start), T=45 (Mid-point), T=90 (End).
      *   **Condition 1 (Distant):** At T=0, choose between 1 Ticket (drawn at T=45) or 3 Tickets (drawn at T=90). *Wait, if the draw is at 45, the reward is immediate at 45.*
      *   *Let's align with the Pigeon Paradigm exactly:*
