              *   **Condition 1 (Hypothetical/Distant):** "Imagine we are doing this again next month. Would you prefer 1 Prize Ticket for a draw *next meeting* or 3 Prize Tickets for a draw *the meeting after*?" (Delay: 1 month vs 2 months).
              *   **Condition 2 (Immediate/Visceral):** "Right now, you can take 1 Cookie. Or wait until the end of this 90-minute session for 3 Cookies."
