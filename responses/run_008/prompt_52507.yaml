              *   *Let's try the standard "Choice List" approach but split in time.*
              *   **Phase 1 (T=0):** "We will make a decision in 45 minutes. For that future decision, would you prefer: 1 Chocolate now (at 45 mins) OR 3 Chocolates later (at 90 mins)?" Most will pick 3 Later.
