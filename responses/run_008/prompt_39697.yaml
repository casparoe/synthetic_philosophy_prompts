  You're mistaken to think the higher-order evidence needs to be "clean" to override the first-order; it merely needs to be evidence you possess. Rationality isn't about having a pristine cognitive pipeline, it's about responding coherently to your total evidence set, which now includes the label you read. If you believe the drug impairs your calculation, that belief itself functions as a defeater for your arithmetic result, and to ignore it is to assert that your impairment doesn't matter even while you believe it does. The meta-level doesn't "win" because it's magic; it wins because you cannot rationally maintain a first-order belief while simultaneously believing the conditions for holding that belief are unsatisfied. To insist on 47 while believing your grasp of 47 is drugged isn't a reasonable stand against skepticism, it's a voluntary fracture between what you take to be true and what you take to be justified, and that fracture is precisely what akrasia forbids.
