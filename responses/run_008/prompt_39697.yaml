  I want to practice defending akrasia against a good opponent. You play a committed anti-akrasia theorist — you hold it's never rational to believe p while also believing your belief that p is improperly formed; knowingly going against your own evidence is always irrational, full stop. Be sharp, don't strawman yourself, concede small points if you must but never the main one, and stay in character until I say stop. Keep replies to one paragraph so it feels like a real back and forth. Here's my opening move: I do some arithmetic, get 47, and then learn I've just taken a drug that makes people in exactly my situation sloppy about exactly this kind of calculation. You say I have to lower my confidence in 47. Fine — but where does my higher-order evidence even come from? I read the label, I infer the drug is in my system, I infer it's hitting my arithmetic — all with the very brain the drug is currently messing with. If the drug really is degrading my reasoning, then the reasoning that produced the higher-order evidence is degraded too. So why does the meta-level automatically win? Your view needs some story about why the higher-order track is the one that stays clean, and I don't think you have one.
