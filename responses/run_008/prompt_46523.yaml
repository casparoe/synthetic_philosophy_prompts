answer: |-
  # JOINT STATEMENT ON ANTHROPIC REASONING
  **Adversarial Collaboration Workshop on Anthropics**
  **Signatories:** [Doomsayer Name] (SSA/DA Proponent) & [SIA Defender Name] (SIA Proponent)
  **Drafted By:** [Your Name/Department]

  ## I. POINTS OF CONSENSUS

  The undersigned agree on the following formal claims, definitions, and logical relationships. These form the shared machinery for our subsequent disagreement.

  1.  **The Setup:** We consider a set of mutually exclusive hypotheses $\{H_i\}$ regarding the total number of observers ($N_i$) that will ever exist in our reference class. We denote the observer's observed birth rank as $n$.
  2.  **The Self-Sampling Likelihood (SSA):** Under the assumption that the observer is a random sample from the set of actual observers in their reference class, the likelihood of observing rank $n$ given total population $N$ (where $n \leq N$) is:
      $$P(n | N) = \frac{1}{N}$$
      Consequently, the likelihood ratio between a "Doom Soon" hypothesis ($N_{small}$) and a "Doom Late" hypothesis ($N_{large}$) is:
      $$\frac{P(n | N_{small})}{P(n | N_{large})} = \frac{N_{large}}{N_{small}}$$
      *Agreement:* This likelihood ratio strictly favors hypotheses with fewer total observers.
  3.  **The Self-Indication Prior (SIA):** Under the assumption that the observer should reason as if they are a random sample from the set of *possible* observers, the prior probability of a hypothesis should be weighted by the number of observers it contains. If $P_{prior}(H_i)$ is the objective prior, the SIA-adjusted prior is:
      $$P_{SIA}(H_i) \propto P_{prior}(H_i) \times N_i$$
  4.  **The Cancellation Theorem:** In the standard case where the only evidence is the observer's existence and birth rank, applying the SIA adjustment to the priors and the SSA likelihood to the evidence results in a posterior distribution identical to the original objective prior ($P_{posterior} \approx P_{prior}$). The SIA update ($\times N$) mathematically cancels the Doomsday update ($\times 1/N$).
  5.  **Reference Class Relativity:** Both parties agree that the numerical output of both SSA and SIA depends on the definition of the "reference class" (e.g., *Homo sapiens*, all mammals, all conscious agents). Changing the reference class changes $N$ and $n$, thereby altering the posterior probabilities.
  6.  **Non-Anthropic Evidence:** Both parties agree that anthropic reasoning must be combined with empirical evidence (physics, biology, risk assessment). Neither party claims anthropics alone settles the fate of humanity without empirical priors.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  While we agree on the math above, we disagree on the interpretation, application, and normative force of these principles. The following table states our divergences in our own preferred terminology.

  | Topic | Position A: SSA / Doomsday Proponent | Position B: SIA Defender |
  | :--- | :--- | :--- |
  | **The Evidence of Existence** | The fact that "I exist" is a precondition for reasoning, not data to be conditioned on. Conditioning on existence leads to double-counting. | The fact that "I exist" is data. Worlds with more observers are more likely to produce me. Ignoring this ignores relevant evidence. |
  | **The Presumptuous Philosopher** | **Verdict:** *Reductio ad Absurdum.*<br>SIA implies a philosopher can be arbitrarily certain the universe is vast without empirical measurement, simply because vast universes contain more philosophers. This violates scientific norms. | **Verdict:** *Correct Bayesian Updating.*<br>If two theories are empirically equivalent but one posits 100x more observers, I am 100x more likely to exist in that one. Denying this is the bias. |
  | **The Coin-Flip Case**<br>*(See Section III)* | **Prediction:** Learning my birth rank ($n$) should shift my credence toward the "Small Universe" (Tails) hypothesis. The Doomsday update is real and uncompensated. | **Prediction:** Learning my birth rank ($n$) should *not* shift my credence. The SIA prior shift exactly compensates for the birth-rank likelihood. |
  | **Reference Class Ambiguity** | **Status:** *A Fatal Flaw.*<br>Because the reference class is not uniquely defined by physics, the Doomsday Argument yields arbitrary results until this is solved. | **Status:** *A Feature of Indexicality.*<br>Different reference classes answer different questions. The ambiguity reflects the nature of self-locating belief, not a bug in the logic. |

  ## III. CRUXES AND EMPIRICAL TESTS

  We identify the following specific points as the decisive battlegrounds for our disagreement. We have pre-committed to the predictions below.

  ### Crux 1: The Legitimacy of the SIA Prior
  **Question:** Is weighting priors by the number of observers ($N$) a legitimate handling of indexical evidence, or is it double-counting the evidence of existence?

  **Test Case: The Coin-Flip Variant**
  *   **Setup:** A fair coin was flipped before humanity began.
      *   **Heads:** Total humans ever ($N$) = 200 billion.
      *   **Tails:** Total humans ever ($N$) = 2 billion.
      *   **Prior:** $P(\text{Heads}) = 0.5$.
      *   **Evidence:** An agent learns only their birth rank $n$, where $n = 100$ billion (compatible with both hypotheses).
  *   **Task:** State the rational credence in **Heads** after learning $n$.

  | Party | Predicted Credence in Heads | Justification |
  | :--- | :--- | :--- |
  | **SSA / Doomsayer** | **$\approx 1\%$** | The likelihood of $n=100B$ is 100 times higher in the Tails world ($1/2B$) than the Heads world ($1/200B$). Without SIA compensation, Bayes' rule dictates a strong shift toward Tails. |
  | **SIA Defender** | **$50\%$** | The SIA prior weights Heads 100 times higher than Tails ($200B$ vs $2B$ observers). This cancels the 100:1 likelihood ratio favoring Tails. The posterior remains equal to the objective coin prior. |

  ### Crux 2: The Status of Reference Class Relativity
  **Question:** Does the ambiguity of the reference class render anthropic probabilities arbitrary (verbal/conventional), or does it reflect a substantive uncertainty about the nature of observation?

  **Analysis of Verbal Dispute:**
  We agree that a portion of this dispute is **verbal**, specifically regarding the *definition* of the term "observer." If Party A defines "observer" as "biological human" and Party B defines it as "conscious agent," they are often talking past one another regarding the *input* ($N$), not the *logic*.

  However, we disagree on the **substantive consequence**:
  *   **SSA / Doomsayer:** Claims that unless physics dictates a unique reference class, the resulting probabilities are epistemically useless. The verbal ambiguity undermines the argument's claim to objective truth.
  *   **SIA Defender:** Claims that once a reference class is stipulated (even conventionally), the probabilities are objective relative to that class. The verbal component is no different than defining the scope of any statistical population.

  **Test Case: Bostrom's Presumptuous Philosopher**
  *   **Setup:** Theory $T_1$ predicts $10^{12}$ observers. Theory $T_2$ predicts $10^{24}$ observers. Both are empirically equivalent regarding non-anthropic data.
  *   **Task:** Should a rational agent bet on $T_2$ at odds of $10^{12}:1$ solely based on SIA?

  | Party | Decision | Justification |
  | :--- | :--- | :--- |
  | **SSA / Doomsayer** | **No.** | This allows armchair speculation to override physical inquiry. It implies we can know the size of the universe without looking at it. |
  | **SIA Defender** | **Yes.** | To deny this is to assert that my existence is not evidence. If $T_2$ is true, there are a trillion times more "me"s. I should bet accordingly. |

  ***

  **Signed,**

  _________________________ (SSA/DA Proponent)

  _________________________ (SIA Defender)

  **Date:** _________________
