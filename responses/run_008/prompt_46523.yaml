          *   Math: $P(rank | N) = 1/N$. Likelihood ratio favors smaller $N$.
          *   View on SIA: SIA double-counts existence or leads to absurdities (Presumptuous Philosopher).
      *   **Self-Indication Assumption (SIA):**
          *   Core idea: You should reason as if you are more likely to exist in a world with more observers.
          *   Implication: The fact that you exist favors hypotheses with more observers.
          *   Math: Prior weighted by $N$. $P(H | Existence) \propto P(H) \times N$.
