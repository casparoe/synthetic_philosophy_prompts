  # Which Decision Theory Do You Actually Hold?
  **A Classification Instrument for the Final Session**

  **Instructions:** This handout contains eight scenarios. For each, select the **single option** that best matches both what you would do and *why* you would do it. Follow the arrows to your final classification leaf. Do not worry about "correctness"; this instrument maps your intuitions, not the truth.

  ---

  ### Node 1: The Smoking Lesion
  A genetic lesion causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer. You have the desire. Do you smoke?
  *   **A.** **Don't Smoke.** "Smoking is bad news; it indicates I likely have the lesion and cancer." → **Go to Node 2**
  *   **B.** **Smoke.** "Smoking doesn't cause cancer; I might as well enjoy it." → **Go to Node 3**

  ### Node 2: (For Evidential Thinkers) Newcomb's Problem
  A predictor put $1M in Box B if they predicted you'd take only Box B. Box A has $1k. You see two boxes.
  *   **A.** **Take Both.** "The money is already there or not; my choice can't change the past." → **Leaf: Incoherent EDT** *(See Map)*
  *   **B.** **Take Only B.** "Choosing B is strong evidence the predictor put the money there." → **Leaf: Evidential Decision Theory (EDT)**

  ### Node 3: (For Causal Thinkers) Newcomb's Problem
  Same setup as above. You know the predictor is highly accurate.
  *   **A.** **Take Both.** "My act cannot causally influence the past placement of money." → **Leaf: Causal Decision Theory (CDT)**
  *   **B.** **Take Only B.** "My choice correlates with the prediction because we share an algorithm." → **Go to Node 4**

  ### Node 4: Counterfactual Mugging
  A coin was flipped long ago (Tails). A predictor says: "If Heads, I'd give you $1M if you *would* have paid me $100 now. Since it's Tails, I'm asking for $100." You never learn the coin result.
  *   **A.** **Refuse.** "I'm in the losing branch; paying costs me $100 with no causal return." → **Leaf: Time-Inconsistent CDT** *(See Map)*
  *   **B.** **Pay.** "I want to be the type of agent who pays, so predictors reward me." → **Go to Node 5**

  ### Node 5: The Source of Your Compliance
  Regarding Node 4 (Mugging) and Node 3 (Newcomb): Why did you choose the cooperative option?
  *   **A.** **Historical Binding.** "I am following a specific precommitment or vow I made *before* these situations arose." → **Go to Node 6**
  *   **B.** **Algorithmic Logic.** "My current decision procedure logically determines the outcome, regardless of prior vows." → **Go to Node 7**

  ### Node 6: Parfit's Hitchhiker
  You are safely in town. The driver who saved you asks for the fare you promised. You can escape payment without penalty.
  *   **A.** **Refuse.** "I got what I wanted; paying now has no causal benefit." → **Leaf: Precommitting CDT (Failed)** *(See Map)*
  *   **B.** **Pay.** "I must honor the binding vow I made in the past." → **Go to Node 8**

  ### Node 7: XOR Blackmail
  An extortionist sends a letter demanding money *if and only if* (You have incriminating dirt OR You would refuse to pay). You receive the letter.
  *   **A.** **Pay.** "Receiving the letter is bad news; paying makes it more likely I'm innocent." → **Leaf: Evidential Decision Theory (EDT)** *(See Map)*
  *   **B.** **Refuse.** "My refusal logically prevents the letter from being sent in the counterfactual where I'm innocent." → **Leaf: Functional Decision Theory (FDT)**

  ### Node 8: The Amnesiac's Vow (Novel Case)
  You face a cost to benefit a past version of yourself. You know that if your *algorithm* pays, past-you benefited. However, you have amnesia: you do not know if you personally signed a contract to pay in this situation.
  *   **A.** **Refuse.** "Without confirmation of a specific historical contract, I have no obligation." → **Leaf: Precommitting CDT (Successful)**
  *   **B.** **Pay.** "My algorithm pays regardless of whether I recall a specific contract." → **Leaf: Functional Decision Theory (FDT)**

  ---

  ### Map of the Territory: Leaves & Gaps

  *   **Evidential Decision Theory (EDT):** (Node 2B). You maximize expected utility conditional on your actions. You treat your choice as news.
  *   **Causal Decision Theory (CDT):** (Node 3A). You maximize causal impact. You two-box and refuse muggings.
  *   **Functional Decision Theory (FDT):** (Node 7B / Node 8B). You maximize the output of your decision algorithm. You one-box, pay muggings, and pay even with amnesia.
  *   **Precommitting CDT:** (Node 8A). You act like FDT *only* if you successfully bound yourself historically. Without the memory of the vow, you revert to CDT.
  *   **Time-Inconsistent CDT:** (Node 4A). You one-box Newcomb (perhaps via ad-hoc reasoning) but refuse the Mugging. You value the past prediction but not the counterfactual policy.
  *   **Incoherent EDT:** (Node 2A). You treat actions as news (Node 1A) but ignore correlation in Newcomb. *Diagnosis:* This combination is theoretically unstable; if news matters in Lesion, it must matter in Newcomb.
  *   **Precommitting CDT (Failed):** (Node 6A). You claim to rely on vows but break them when enforcement vanishes. *Diagnosis:* This is simply CDT masquerading as precommitment.

  **Note on Indistinguishability:** This tree cannot distinguish between **Functional Decision Theory** and **Timeless Decision Theory**. Both occupy the same leaf (Node 7B/8B) as they share the same action-guiding logic in these cases.

  ---

  ### Designer's Note (For the Instructor)

  **The Novel Case: The Amnesiac's Vow**
  This case is designed to sever the link between **Functional Decision Theory (FDT)** and **Precommitting Causal Decision Theory (Precommit-CDT)**.
  *   **The Problem:** In standard cases (Newcomb, Mugging), FDT agents and Precommit-CDT agents behave identically. Both one-box and pay the mugger. The standard distinction is metaphysical: FDT agents view their decision as *determining* the past (logical correlation), while Precommit-CDT agents view themselves as *fulfilling a causal chain* started by a past vow.
  *   **The Solution:** The Amnesiac's Vow obscures the *fact* of the vow while keeping the *logical structure* intact.
      *   **FDT** pays because the decision algorithm outputs "Pay" regardless of the agent's memory of a contract. The logical correlation holds even if the agent forgets the binding event.
      *   **Precommit-CDT** relies on the *causal existence* of the prior binding act. If the agent cannot verify the vow occurred (amnesia), the causal chain is broken from their perspective, and they revert to standard CDT (Refuse).
  *   **Why this matters:** It forces students to admit whether they rely on *self-modification history* or *decision-procedure logic*. It prevents students from claiming they are "Updateless" simply because they remember being disciplined in the past.

  **Logical Space & Gaps**
  *   **The Empty Leaf (Node 2A):** "Evidential Two-Boxer." This is flagged as incoherent because the reasoning for Node 1A (actions are evidence) logically entails Node 2B (actions are evidence of prediction). A student landing here likely misunderstands the cases rather than holding a stable theory.
  *   **The Unstable Leaf (Node 4A):** "Newcomb One-Boxer / Mugging Refuser." This represents a common intuitive stance that fails the test of *updatelessness*. It is flagged as time-inconsistent because the agent accepts the logic of prediction in Newcomb but rejects the logic of counterfactual policy in Mugging.
  *   **The FDT/TDT Merge:** The handout explicitly notes that FDT and TDT are not separated. This is intentional; separating them requires cases involving logical uncertainty about mathematical truths (e.g., "Logical Mugging"), which exceeds the 20-minute scope and adds unnecessary complexity for a classification instrument.
