  10. **Final check on Parametrization:** This is the non-negotiable sacrifice. I must be firm here. Miller showed that if $A$ is closer to $B$ in terms of $x$, and $y = f(x)$, $A$ is not necessarily closer in $y$. Unless you fix the "natural" variables (which is metaphysical), you can't have invariance.

