answer: |-
  This is a fascinating set of intuitions. You have essentially rediscovered a core tension in welfare economics and game theory without using the jargon. Your gut is distinguishing between **private efficiency** (good for the deal-makers) and **social efficiency** (good for the system), while also spotting when the "utility" being maximized is ill-defined.

  First, let's upgrade your terminology. In game theory and ethics, we wouldn't call these deals "safe."
  *   Instead of "expected-win for every party," we say **Individually Rational** (or *Ex-Ante Pareto Improving* for the participants).
  *   Instead of "safe" for the world, we say **Socially Efficient** (or *Welfare-Enhancing*).
  *   Instead of "customers eating the loss," we say **Negative Externality**.

  ### The Unifying Principle

  You asked for one principle. Your proposed principle ("A deal is kosher when it's an expected-win for every party to it") is the standard definition of **Individual Rationality**. It explains why the duelists and the bidding companies agree to the deal.

  However, your gut reactions show that Individual Rationality is *necessary but not sufficient*. You reject the restaurant deal even though it is individually rational for the restaurants.

  The principle that captures all your verdicts is this:
  > **"A randomized settlement is normatively desirable if it converts destructive expenditure into private surplus without imposing costs on non-consenting third parties or misidentifying the source of utility."**

  In simpler terms: **It's a good deal if it stops waste without creating victims.**

  Here is how this principle maps onto your five cases, distinguishing between settled theory and contested ground.

  ---

  ### 1. The Duel (Coin Flip vs. Bullets)
  *   **Your Verdict:** Great.
  *   **The Theory:** This is a pure **Deadweight Loss** elimination. In a duel, both parties spend resources (training, travel, risk of death) to contest a prize (honor). The death/risk is a "burning" of value that helps no one.
  *   **Why it fits:** The coin flip preserves the *outcome* (winner/loser) but eliminates the *cost* (death). It is Individually Rational (both live) and Socially Efficient (no corpse).
  *   **Settled vs. Contested:** **Settled.** Economists and ethicists agree that reducing mortality without changing the distributional outcome is a net positive.

  ### 2. The Bidding War (Straws vs. Bids)
  *   **Your Verdict:** Fine.
  *   **The Theory:** This is the classic **Tullock Contest** (Rent-Seeking). When companies bid aggressively, they spend real money to transfer a contract. If they spend $1M to win a $10M contract, that $1M is social waste—it doesn't create value, it just buys probability.
  *   **Why it fits:** Drawing straws assigns the contract without the spend. The "waste" is converted into profit for the companies. No third party (the client) is necessarily harmed if the price is fixed and the quality is assumed equal.
  *   **Settled vs. Contested:** **Mostly Settled.** Economists generally view rent-seeking as wasteful. However, some argue competitive bidding ensures the *best* company gets the job. If the companies are identical, straws are better. If they aren't, straws might give the contract to an incompetent firm (a quality externality). Your intuition assumes equal competence.

  ### 3. The War (Weighted Coin vs. Battle)
  *   **Your Verdict:** Uncertain/Skeptical.
  *   **The Theory:** This is the **Bargaining Model of War** (James Fearon). War is *ex-post* inefficient (both sides lose resources/lives). Therefore, there should always exist an *ex-ante* deal both prefer to fighting.
  *   **Why you balk:** You hit on the exact reason war happens in game theory: **Private Information / Inconsistent Priors.**
      *   If Country A thinks they have a 90% chance of winning, and Country B thinks they have a 90% chance of winning, a 50/50 coin flip is a *loss* for both in terms of expected utility.
      *   The deal only looks good if they agree on the odds. If they are both deluded about their strength, the "rational" deal is actually based on a shared error.
  *   **Settled vs. Contested:** **Highly Contested.**
      *   *Settled:* War is economically wasteful.
      *   *Contested:* Is it rational to fight? Realists argue war is sometimes necessary to establish truth (you don't know who is stronger until you fight). Liberal institutionalists argue a coin flip (arbitration) is always better. Your hesitation is theoretically sound: if the "weights" on the coin are based on lies or delusions, the deal is unstable.

  ### 4. The Restaurants (Alternating Days vs. Price War)
  *   **Your Verdict:** Balks.
  *   **The Theory:** This is **Collusion** (Cartel Behavior).
  *   **Why it fits:** This is where your proposed principle ("expected-win for every party") fails. It *is* an expected win for the *restaurants*. They save the cost of the price war and keep prices high.
      *   However, my proposed principle catches this: **"Without imposing costs on non-consenting third parties."**
      *   The customers are the third parties. They face higher prices and less choice. The "savings" the restaurants enjoy are literally transferred from the customers' pockets. This creates a **Negative Externality**.
  *   **Settled vs. Contested:** **Settled (Legally & Economically).** This is illegal in almost every jurisdiction (Antitrust/Competition Law). It is widely accepted as socially harmful because it reduces total social surplus (consumer loss > producer gain).

  ### 5. The Enemies (Arbitration vs. Fight)
  *   **Your Verdict:** Skeptical.
  *   **The Theory:** **Utility Function Mismatch.**
  *   **Why it fits:** Standard game theory assumes agents want the *outcome* (territory, money). But here, the agents derive utility from the *process* (the fight itself).
      *   If "fighting" is a consumption good (like going to a movie), then replacing it with arbitration is like replacing a concert with a recording. You saved money, but you ruined the experience.
      *   The deal is not Individually Rational if the utility of "confrontation" is part of the payoff matrix.
  *   **Settled vs. Contested:** **Contested (Philosophically).**
      *   *Economic view:* Preferences are sovereign. If they want to fight, let them (provided no third parties are hurt).
      *   *Ethical view:* Society generally prohibits violence even if consensual (you can't sell yourself into slavery, you can't duel to the death). We paternalistically decide that "enjoying a fight" is not a valid utility to maximize. Your gut recognizes that satisfying this preference might be morally wrong, even if it's "efficient" for them.

  ---

  ### Where Your Principle Misses the Mark

  You proposed: *"A deal is kosher when it's an expected-win for every party to it."*

  This is the principle of **Consensual Exchange**. It works for Cases 1 and 2. It fails on 3, 4, and 5 for specific reasons:

  1.  **It ignores Third Parties (Case 4):** Your principle allows the restaurants to collude because *they* win. It ignores the customers. This is the difference between **Private Rationality** and **Social Welfare**.
  2.  **It assumes Common Knowledge (Case 3):** Your principle assumes both countries calculate the "expected win" correctly. If they are both overconfident, the deal is *not* an expected win for them, even if they sign it. It highlights the difference between **Subjective Expected Utility** and **Objective Expected Utility**.
  3.  **It assumes Standard Preferences (Case 5):** Your principle assumes parties want to maximize material outcomes. If they want to maximize *violence*, the principle labels arbitration as "good" (saves lives) while the parties label it "bad" (boring). This highlights the conflict between **Preference Satisfaction** and **Normative Ethics**.

  ### Summary of the "Contested" vs. "Settled"

  *   **Settled:** The Restaurant case is bad. (Antitrust law is clear on this). The Duel/Bidding cases are good (reducing waste is good).
  *   **Contested:** The War case. Political scientists still debate whether war is always a bargaining failure or sometimes a necessary information-gathering tool.
  *   **Contested:** The Enemies case. Libertarians might say "let them fight if they consent." Paternalists say "no, violence is inherently bad."

  ### The Verdict

  Your gut is acting like a **Social Welfare Maximiser** with a constraint on **Information Honesty**.

  You approve of deals that turn **Negative-Sum games** (war, duels, bidding wars) into **Zero-Sum games** (coin flips), *provided* the negative sum wasn't actually the point (enemies) and provided the zero-sum doesn't spill over to hurt bystanders (restaurants).

  If you want a single phrase to replace "safe," call these deals **"Socially Efficient Conflict Resolutions."** Your intuition is that a deal is only "kosher" if it is **Pareto Improving for the participants AND Pareto Neutral for the bystanders.**
