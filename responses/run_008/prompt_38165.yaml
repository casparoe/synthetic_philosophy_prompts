  2. Trusting a felt sense of understanding to justify unique views is incompatible with calibration as the gold standard, because subjective confidence rarely matches objective accuracy. Either calibration remains the metric and your feelings are demoted to unverified heuristics, or you admit calibration isn't the ultimate metric.
  3. Celebrating historical rebels as epistemically right conflicts with calibration as the gold standard, because most who ignore consensus are wrong, dragging down their accuracy scores. You must either value high-impact discovery over being right most of the time, or admit that most rebels were actually irrational despite their occasional success.
  4. Claiming base rates tell you nothing you care about contradicts your assertion that the outside view reliably predicts project failure. You have to accept that base rates do inform truth-adjacent outcomes, or concede that the outside view is less useful for forecasting than you claim.
  5. This tension between deferring to consensus outside your field and praising rebels who ignored it only looks like a clash because one governs how you judge others while the other governs how you act within your expertise. Nothing needs to give here if you maintain that epistemic rebellion is only justified when you possess the specific insider knowledge described in your first point.
