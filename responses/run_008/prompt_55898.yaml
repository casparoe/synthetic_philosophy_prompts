prompt: |-
  longtime reader of the rationalist blogs and forums here (lurking since way back), and something's been bugging me that I can't untangle on my own, so I'm throwing it to you.

  In open-world games, killing adult human NPCs is basically the texture of the medium. Pedestrians get ragdolled for laughs, enemies respawn, kill counts are literally the score. Nobody inside the game or outside of it treats any of that as a moral event. But the exact same industry, often in the exact same games, fences off certain lives: child NPCs are unkillable or just don't exist (theres no kids in GTA at all), and where there's a beloved animal companion it tends to be flagged invincible while human strangers are fair game. Studios that let you mow down a crowd apparently consider some depicted lives off-limits.

  So what's the implicit theory of moral status in that pattern? The obvious candidate — some NPCs matter, others don't — can't be it, because the morally relevant property can't live in the NPC: a child NPC is exactly as sentient (i.e., not) as an adult one, and a pet NPC less than either. So either the design presupposes that the wrongness is in the player, that harming certain fictional beings corrupts your dispositions, while harming others doesn't, which would need some account of why the line sits where it sits; or it presupposes nothing and is just tracking audience squeamishness, in which case the practice is still quietly claiming that our reactions to depicted lives are a fit thing to design around, which is itself a commitment.

  Help me reconstruct what the pattern actualy presupposes, which rival views it rules out (would a strict no-fictional-being-matters view have to condemn the mod scenes that remove the fences?), whether the parts are consistent with each other or just fit the same mood, where it's underdetermined enough that several theories would license the same design, and what the games would look like if we swapped in a different implicit view entirely. Genuinely curious whether there's a coherent theory under there or if it's vibes all the way down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Profile:** Longtime reader of rationalist blogs/forums (LessWrong, Slate Star Codex, Astral Codex Ten, etc.). This implies a high tolerance for abstraction, philosophical rigor, Bayesian framing, and a preference for unpacking implicit assumptions. They value clarity, consistency, and steelmanning.
      *   **Topic:** The moral asymmetry in video game design regarding NPC deaths (adults vs. children vs. animals).
      *   **Core Question:** What is the *implicit theory of moral status* underlying this design pattern? Is it coherent? What does it presuppose? What rival views does it rule out? What would games look like under different theories?
      *   **Tone:** Intellectual, analytical, slightly provocative but good-faith inquiry. Avoid moralizing; focus on meta-ethics and design philosophy.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation:* Adult NPCs = killable (often encouraged). Child NPCs = unkillable/absent. Animal Companions = unkillable. Random Animals = often killable (hunting sims).
      *   *The Puzzle:* Ontologically, they are all code. None feel pain. So why the distinction?
      *   *User's Hypotheses:*
          1.  Player corruption (harming X makes you bad).
          2.  Audience squeamishness (market demand).
      *   *User's Challenge:* Reconstruct the implicit theory, check for consistency, explore alternatives.

  3.  **Brainstorming Implicit Theories:**
      *   *Theory A: The Simulationist/Immersion View.* The game world mimics the real world's taboos to maintain the "magic circle." Breaking the taboo breaks immersion more than killing adults does.
      *   *Theory B: The Expressive Harm View.* The act of killing isn't harmful to the NPC, but expresses a value judgment by the player/designer. Some expressions are socially costly.
      *   *Theory C: The Legal/PR Risk Management View.* It's not morality; it's ratings (ESRB/PEGI) and lawsuit avoidance.
      *   *Theory D: The Empathy Training View.* Games train neural pathways. Killing kids strengthens "bad" pathways more than killing adults.
      *   *Theory E: The Sacred/Profane Distinction.* Certain categories are "sacred" in our culture. Violating the sacred causes a visceral reaction (disgust) distinct from moral outrage.

  4.  **Developing the "Rationalist" Angle:**
      *   Use concepts like *map vs. territory*, *Schelling points*, *signaling*, *virtue ethics*, *consequentialism*, *deontology*.
      *   Acknowledge the "vibes all the way down" possibility but try to find structure.
      *   Address the "mod scenes" question (does removing fences imply a different moral stance?).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate the question as a genuine philosophical puzzle about *fictional ethics*.
      *   **Candidate Theory 1: Expressive Consequentialism (The "Player Corruption" Model).**
          *   Focus on the *agent*, not the *patient*.
          *   Why kids/animals? They are "protected classes" in our moral psychology. Practicing violence against them weakens inhibitions more than practicing against "combatants."
          *   *Critique:* Inconsistent. Why is killing adult civilians okay then?
      *   **Candidate Theory 2: Cultural Schelling Points (The "Coordination" Model).**
          *   It's not about intrinsic morality, but about avoiding coordination failures (bans, outrage, ratings).
          *   The line is arbitrary but *focal*. We all agree on "no kids" even if we don't agree on "no adults."
          *   *Implication:* It's purely instrumental.
      *   **Candidate Theory 3: The Immersion/Verisimilitude Contract.**
          *   Games promise a "possible world." A world where kids are murdered is a *different kind* of world (dystopian/horror) than one where mercenaries fight.
          *   Killing adults fits the "action movie" script. Killing kids fits the "psychopath sim" script.
          *   Designers are curating the *genre*, not the morality.
      *   **Addressing the "Mod Scene" Question:**
          *   If a modder removes the fence, are they immoral?
          *   Under Theory 1 (Corruption): Yes, they facilitate corruption.
          *   Under Theory 2 (Coordination): They are breaking the social contract/ToS, risking the ecosystem.
          *   Under Theory 3 (Genre): They are changing the game's genre/tagging.
      *   **Consistency Check:**
          *   Is it consistent? No, it's a patchwork. Adult civilians vs. Enemy Combatants is also a fuzzy line.
          *   It's "Vibes + Risk Management."
      *   **Alternative Designs (Counterfactuals):**
          *   *Strict No-Fictional-Being-Matters:* Everything is killable. (Result: *Dwarf Fortress*, *Rimworld*, or *Hatred*).
          *   *Strict Pacifism:* No killing at all. (*Undertale*, *Stardew Valley*).
          *   *Consequentialist Fiction:* NPCs remember, families mourn, economy collapses. (*Shadow of Mordor* nemesis system but for civilians).
      *   **Conclusion:** The implicit theory is a hybrid of *Virtue Ethics* (don't be that guy) and *Rule Utilitarianism* (maximize fun/sales, minimize backlash). It's not coherent philosophically, but it is coherent *culturally*.

  6.  **Refining the Tone:**
      *   Ensure it sounds like a dialogue between rationalists. Use terms like "terminal values," "instrumental convergence," "modal realism."
      *   Avoid being preachy.
      *   Make sure to answer the specific sub-questions: rival views ruled out, consistency, underdetermination, alternative designs.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe focus heavily on ESRB ratings.
      *   *Correction:* Too boring. The user asks about the *moral theory*, not the regulatory framework. The ratings are a symptom, not the cause. Focus on why the ratings exist where they do.
      *   *Check:* Did I address the animal companion thing?
