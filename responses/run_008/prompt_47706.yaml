          *   *Cost:* Moves away from internalism. Makes blame partly consequentialist.
      *   *Option D: Modify (2).* Distinguish *Blameworthiness* (internal) from *Blame* (social response/liability).
          *   *Cost:* Semantic shift. Might feel like dodging the bullet.

      *Best "Single Revision" for Coherence:* The user seems most attached to the *intuitions* about the drivers (2) and the nature of blame (3/4). The Control Principle (1) is the outlier causing the logical crash. However, the user says they "accept the control principle pretty much in full."
