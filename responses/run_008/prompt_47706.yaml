      *   **(1) vs. (4):** *Significant Conflict.* (1) implies control is necessary for blame. (4) says you can be blameworthy for unchosen traits (constitutive luck). This undermines the "control" requirement of (1).
      *   **(2) vs. (3):** *Major Conflict.* (3) says blame is about internal character/will. (2) says the *external footprint* (death vs. no death) changes blameworthiness despite identical will/character (ex hypothesi). If the will is identical, (3) says blame should be identical. (2) says it's not.
      *   **(2) vs. (5):** *Direct Contradiction.* (5) says blame is fixed *before* the outcome. (2) says the outcome changes the level of blame. You can't have it both ways.
      *   **(3) vs. (4):** *Manageable/Tension.* (3) says blame is about character. (4) says character traits can be unchosen. This is the "constitutive luck" problem. It challenges the *basis* of (3) but doesn't necessarily contradict it logically unless (3) implies "chosen character." Usually, (3) is compatible with (4) *if* you reject the Control Principle. But combined with (1), it's messy.
      *   **(1) vs. (5):** *User's Question.* (5) is essentially the temporal application of (1). If (1) is true, (5) must be true. They are not in tension; they are allies.

  4.  **Rank the Tensions:**
      1.  **(2) vs. (1) & (5):** This is the core paradox. You can't hold CP and say outcome matters for *blameworthiness* (not just liability/punishment).
      2.  **(2) vs. (3):** If blame tracks character, and character is ex hypothesi identical in the luck cases, blame must be identical. (2) denies this.
      3.  **(1) vs. (4):** Constitutive luck undermines the Control Principle just as much as resultant luck does.

