  1.  **The Main Rule:** Assertion requires Knowledge (evidenced by Fake Barn/Lottery/Gettier verdicts).
  2.  **The Exception:** Assertion is permitted without belief *only* if the evidence is strong enough for knowledge (evidenced by the Selfless Assertion verdict).
