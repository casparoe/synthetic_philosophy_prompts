  *   **Standard Knowledge Norm:** This fits 6 out of 7 cases perfectly. The only outlier is **Selfless Assertion**.
  *   **Exceptionalist Knowledge Norm:** This is a variant of the Knowledge Norm (championed by philosophers like John Turri) which states: *Assert P if you Know P, OR if you have Knowledge-level warrant but lack belief due to irrationality.* This rule fits **all** her verdicts, including the Selfless case.

  ### 2. Prediction on the Target Case (Oncologist to Patient)
  **The Case:** Oncologist tells patient "Treatment will work" (85% success). She believes it. High stakes (life on the line). Advisor thinks this is **Not Knowledge**.

