answer: |-
  Here is a complete design for a 45-minute session. It is engineered to produce the paradox reliably while keeping the confounder hidden until the debrief.

  # Activity: The Two-Casino Experiment

  **Objective:** Students experience a scenario where Strategy A beats Strategy B in every "Casino," yet Strategy B wins overall.
  **Time:** 45 Minutes (10 min Setup, 15 min Play, 20 min Debrief).
  **Materials:** 
  *   20-sided dice (d20) — at least 14.
  *   2 Distinct Trays/Boxes (labeled "Casino Alpha" and "Casino Beta").
  *   Index cards (for "House Targets").
  *   Candy (e.g., Hershey's Kisses or Skittles).
  *   Data Sheets (one per student).

  ## 1. The Mechanics (The Hidden Math)

  You will split the 14 students into two groups of 7, seated at separate tables. They believe they are simply testing two different "Casino Branches."

  *   **The Confounder (Hidden):** The "House Target" they must beat.
      *   **Casino Alpha (Hard):** The House Target is **16**. (Students must roll >16 on a d20 to win).
      *   **Casino Beta (Easy):** The House Target is **6**. (Students must roll >6 on a d20 to win).
      *   *Secrecy:* This number is printed on a card inside a sealed envelope at each table. They are instructed **not** to share the number, only their Win/Loss record.

  *   **The Strategy (Visible Choice):**
      *   **Strategy A (The "Power" Roll):** Roll **2 dice**, take the **higher** value. (Statistically superior in both conditions).
      *   **Strategy B (The "Speed" Roll):** Roll **1 die**, take the value. (Statistically inferior, but faster).

  *   **The Nudge (Engineering the Correlation):**
      *   To ensure Simpson's Paradox appears, you need the **Hard** group to predominantly choose **Strategy A**, and the **Easy** group to predominantly choose **Strategy B**.
      *   **Casino Alpha Instructions:** "You are in the Elite Branch. Precision is valued over speed. **We recommend Strategy A.**"
      *   **Casino Beta Instructions:** "You are in the Express Branch. Speed is valued over precision. **We recommend Strategy B.**"
      *   *Note:* They are allowed to choose, but authority bias usually ensures 80%+ compliance.

  *   **The Payoff:**
      *   1 Candy per Win.
      *   **The Trap:** At the end, you will offer a "Grand Prize" (a full candy bar) to the strategy group with the highest **aggregate** win rate.

  ## 2. Step-by-Step Script

  ### Phase 1: Setup (0:00–0:10)
  1.  **Divide:** Randomly assign 7 students to Table Alpha and 7 to Table Beta. (Use a pre-prepared seating chart).
  2.  **Distribute:** Hand each student an envelope containing their "House Target" card and a Data Sheet.
  3.  **The Rule:** "Open your envelope. Memorize your House Target. **Do not show it to anyone. Do not say the number out loud.** You are only allowed to record 'Win' or 'Loss'."
  4.  **The Choice:** "You have 10 rounds. For each round, you may choose Strategy A (2 dice, keep high) or Strategy B (1 die). Record your choice and your result."
  5.  **The Nudge:** Walk to Table Alpha. "This branch is for high-precision testing. Strategy A is preferred." Walk to Table Beta. "This branch is for speed testing. Strategy B is preferred."
  6.  **Start:** "Begin. You have 12 minutes."

  ### Phase 2: Play (0:10–0:22)
  *   Circulate. Ensure they are rolling correctly.
  *   **Crucial:** If a student at Table Beta asks, "Why is my target so low compared to them?" (if they peek), shut it down: "Please focus on your own data sheet. No cross-table communication."
  *   Collect Data Sheets at the end. Tally the results immediately on the board (keep the Table split hidden for now).

  **Expected Data (Approximate):**
  *   **Table Alpha (Hard):** 6 students pick A, 1 picks B.
      *   Strategy A Win Rate: ~44% (Target >16, 2d20 max).
      *   Strategy B Win Rate: ~25% (Target >16, 1d20).
  *   **Table Beta (Easy):** 1 student picks A, 6 pick B.
      *   Strategy A Win Rate: ~94% (Target >6, 2d20 max).
      *   Strategy B Win Rate: ~75% (Target >6, 1d20).

  ### Phase 3: The Reveal & Debrief (0:22–0:45)

  **1. The Aggregate Illusion (0:22–0:30)**
  *   Write the **Total** counts on the board, combining both tables.
      *   **Strategy A Total:** (Wins from Alpha + Wins from Beta) / (Total Rolls A).
      *   **Strategy B Total:** (Wins from Alpha + Wins from Beta) / (Total Rolls B).
  *   *Result:* Strategy B will have a higher overall percentage (driven by the Easy table's high volume of B choices).
  *   **Award the Grand Prize** to the students who chose Strategy B.
  *   **Ask:** "Strategy A had a higher win rate in Alpha. Strategy A had a higher win rate in Beta. How did Strategy B win the prize?"
  *   Let them argue. They will feel the cognitive dissonance.

  **2. The Confounder Reveal (0:30–0:35)**
  *   Ask Table Alpha: "What was your House Target?" (They shout "16!").
  *   Ask Table Beta: "What was your House Target?" (They shout "6!").
  *   **The Aha Moment:** "The game wasn't fair. Table Beta was playing an easier game. But because Table Beta was *told* to use Strategy B, the 'Easy' wins got attached to the 'Worse' strategy in the total count."

  **3. Mapping to Algebra (0:35–0:40)**
  *   Draw the contingency table on the board.
  *   Show the weighted average.
      *   $P(Win|A) \approx 0.5 \times 0.44 + 0.5 \times 0.94$ (Wait, the weights are the problem).
      *   Correct explanation: "Strategy A was mostly used in the Hard room. Strategy B was mostly used in the Easy room. The 'Room' variable dragged Strategy A down and lifted Strategy B up."
  *   Write the inequality: $P(Win|A) < P(Win|B)$ even though $P(Win|A, Hard) > P(Win|B, Hard)$ and $P(Win|A, Easy) > P(Win|B, Easy)$.

  **4. The "Legitimate Partition" Problem (0:40–0:45)**
  *   *This addresses your specific request about the second layer of the paradox.*
  *   **Ask:** "I split you by Table. What if I told you the real split was by **Shoe Size**?"
  *   Quickly group them by Shoe Size on the board. Show that the win rates don't align cleanly.
  *   **The Lesson:** "In real life, no one hands you the 'Table' variable. You have to guess which subgroups matter. Is it Age? Income? Severity of Illness? If you pick the wrong partition, you see noise. If you pick the right one (the causal one), you see the truth. But sometimes, you can pick a partition that *creates* a paradox where none exists. The math doesn't tell you which split is real; only the story does."

  ## 3. What Will Predictably Go Wrong

  1.  **The Leak:** Students *will* compare House Targets.
      *   *Mitigation:* Frame it as "Secret Mission" data. If they compare, the paradox is ruined. If this happens, pivot: "Okay, you know the targets. Now calculate the rates. You'll see A is still better in *both*, but B still wins overall." The math holds even if the secret is out, but the emotional impact is less.
  2.  **Sample Size Noise:** With only ~70 trials per table, random variance might obscure the reversal (e.g., Strategy A gets lucky in the Hard room).
      *   *Mitigation:* Use the extreme targets (16 vs 6) suggested above. This creates a large gap (44% vs 25% and 94% vs 75%). Even with variance, the aggregate reversal should hold.
  3.  **Non-Compliance:** If everyone picks Strategy A because it's obviously better, you get no aggregate data for B.
      *   *Mitigation:* The "Speed" nudge for Table Beta is crucial. Impose a time limit for Table Beta ("You must finish in 8 minutes") to force the choice of the 1-die strategy.

  ## 4. What This Activity Cannot Reproduce (Honest Limitations)

  You suspected the deepest part of the paradox is the ambiguity of the partition. Here is the honest truth about this activity:

  1.  **The Causal Structure is Rigged:** In this game, *you* assigned the confounder (the Table/Target). In real life (e.g., medical trials), the confounder (e.g., "Severity of Illness") is often unobserved or debated. This activity solves the "which partition" problem for them by revealing the Table split. You cannot easily simulate the *uncertainty* of the partition in a 45-minute game without making it too complex to play.
  2.  **No "Real" Consequence:** In real Simpson's Paradox cases (like the Berkeley admissions case), the "wrong" aggregate leads to real injustice. Here, it just loses a candy bar. The emotional weight of "making the wrong decision based on bad data" is simulated, not felt.
  3.  **The "Legitimate Partition" Taste:**
      *   To stage this, during the debrief, **lie**.
      *   Tell them: "Actually, the Tables didn't matter. The real variable was the *Color of the Die*." (If you used mixed dice).
      *   Show that slicing by Die Color yields random noise.
      *   Then say: "In 1973, UC Berkeley was sued for gender bias. The aggregate data showed men were admitted at higher rates. But when they sliced by 'Department' (the legitimate partition), the bias vanished or reversed. The hard part wasn't the math; it was realizing 'Department' was the variable that mattered, not 'Gender' alone. In our game, I told you 'Table' mattered. In real life, you have to fight to prove which variable is the 'Table'."

  ## 5. Payoff Scheme (Candy)

  *   **Per Round:** 1 small candy (Skittle) for a Win. 0 for Loss.
  *   **Grand Prize:** 1 Full Candy Bar for the "Winning Strategy Group" (Aggregate).
  *   **Consolation:** 1 Full Candy Bar for the "Best Individual Record" (to keep the Hard/High-Skill students engaged even if their Strategy loses the aggregate).

  ## Summary Checklist for You
  *   [ ] Prepare 14 Envelopes (7 with "Target 16", 7 with "Target 6").
  *   [ ] Prepare 2 Instruction Sheets (Alpha: "Precision/Strategy A", Beta: "Speed/Strategy B").
  *   [ ] Ensure enough d20s (at least 2 per student for Strategy A).
  *   [ ] Practice the tallying speed so you don't lose momentum.
  *   [ ] Rehearse the "Shoe Size" pivot for the final 5 minutes.

  This design forces the correlation between the Confounder (Difficulty) and the Treatment (Strategy) through instruction nudges, ensuring the paradox manifests reliably while keeping the mechanism hidden until the reveal.
