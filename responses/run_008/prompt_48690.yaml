answer: |-
  This is one of those questions that keeps philosophers of ethics and economics up at night, and honestly, you've put your finger on the exact nerve. It feels weird because it *is* weird. It's a structural schizophrenia in how modern liberal democracies think about time.

  Let's walk through this together. I'm going to put on my "intergenerational justice" hat, but I'll leave the academic syntax in the closet. We need to dissect what's happening under the hood of these numbers, because a discount rate isn't just a number; it's a moral verdict disguised as arithmetic.

  ### Brainstorming the Mechanics

  First, let's separate the ingredients in that discounting soup, because they carry different moral baggage. You mentioned "pure time preference," and that is the smoking gun.

  In the standard economic model (the Ramsey formula), the discount rate has two main parts.
  1.  **The Growth Part:** This says, "Future people will probably be richer than us, so an extra dollar means less to them than it does to us." This isn't saying their *lives* matter less; it's saying the *marginal utility of cash* diminishes. If your great-grandkid is driving a flying Tesla, losing $100 to sea-level rise bothers them less than it bothers you. That's debatable empirically (will they actually be richer if the climate collapses?), but it's not inherently discriminatory.
  2.  **Pure Time Preference (PTP):** This is the part you flagged. This says, "A unit of welfare in 2124 is intrinsically worth less than a unit of welfare in 2024, simply because it is later."

  Now, regarding your question about whether this is just a finance convention that snuck in: It started there, but it stayed because of a specific ethical argument. The argument is usually about "opportunity cost." If I spend money saving carbon today, I can't invest it in growth. If growth makes the future better, maybe I should invest? But when policymakers apply PTP to *harms* (like death or displacement), they are implicitly saying that preventing a death in 2100 is less urgent than preventing a death today, even if the cost is the same.

  Then there's the "declining discount rate" you mentioned. Is that philosophy or compromise? It's technically a response to uncertainty. If we aren't sure what the economy will look like in 300 years, we shouldn't lock in a high rate. But philosophically? It's a halfway house. It admits that standard discounting kills the very long term too aggressively, but it doesn't want to go all the way to zero. It's a diplomatic patch, not a principled foundation.

  ### What the Practice Actually Presupposes

  So, what does the current practice *require* us to believe?

  If an agency uses a discount rate with a non-zero **Pure Time Preference**, it strictly requires the moral claim that **temporal location is morally relevant.** It asserts that *when* you exist changes *how much* your suffering counts.

  Most moral philosophers (going back to Henry Sidgwick and Frank Ramsey) think this is indefensible. Imagine if we discounted welfare based on *distance*. "A person suffering in New York matters less than a person suffering in Washington D.C. because they are 200 miles away." We'd call that absurd. Most of us think "where" doesn't matter. The discounting practice asserts that "when" *does* matter.

  However, the practice is *compatible* with a different view if you strip out Pure Time Preference and only keep the Growth Part. If the rate is purely based on the expectation that future people will be wealthier, the practice presupposes that **we are obligated to maximize overall welfare, but we can weigh it by marginal utility.** That's a utilitarian view, but it doesn't discriminate against future people based on birth date.

  ### The Clash: Cost-Benefit vs. The "Future Generation" Rhetoric

  Now, let's look at the inconsistency you spotted. On one hand, we have the Cost-Benefit Analysis (CBA) which often rounds 24th-century suffering to zero. On the other, we have laws like the Endangered Species Act or the Public Trust Doctrine, which talk about holding resources in trust for "future generations."

  Are these consistent?

  **Strictly speaking? No.**
  If you truly believed future people's interests were nearly zero (as a high discount rate implies), you would not pass laws protecting wetlands for them. You would drain the wetland, invest the money, and let your great-grandkids buy a better wetland with the interest. The fact that we pass preservation laws proves that, politically and legally, we reject the high discount rate in specific contexts.

  **Can they be reconciled?**
  There is one philosophical view that saves the consistency, but it requires a sharp distinction between two types of moral reasoning:
  1.  **Allocative Efficiency (CBA):** This asks, "How much resource should we devote to this problem?" Here, discounting might be used to prioritize immediate crises over distant uncertainties.
  2.  **Deontological Constraints (Preservation Laws):** This asks, "What are we forbidden from doing, regardless of cost?"

  Under this view, the CBA discount rate is just a tool for budgeting, while the environmental laws are "side constraints." They say, "You can calculate costs all you want, but you *cannot* cross this line (extinction, total coastal loss)."

  The problem is, governments don't talk like that. They use the CBA to *justify* the laws. They say, "We should save this wetland because the long-term benefits outweigh the costs." But if they use a high discount rate to calculate those benefits, the math doesn't work. They are using a moral language ("justice for grandkids") to sell a policy, while using an economic language ("net present value") to design it, and the two languages speak different truths.

  ### Where the Hypocrisy Lies

  Here is the uncomfortable truth. The current setup allows the present generation to have it both ways.
  *   When we want to justify inaction on climate change, we point to the **CBA**: "The costs of fixing this now are huge, and the benefits are far in the future and heavily discounted. It's not 'efficient'."
  *   When we want to feel virtuous, we point to the **Preservation Laws**: "We are stewards for the future!"

  This isn't just a technical glitch; it's a moral evasion. It allows us to acknowledge a duty to the future in the abstract (statutes) while negating that duty in the concrete (budgeting).

  ### What Actually Needs to Change?

  You asked what has to give: the rate, the statutes, or something deeper.

  **1. The Discount Rate (The Technical Fix)**
  If we want consistency with the "justice for future generations" rhetoric, **Pure Time Preference must be set to zero.**
  This doesn't mean the discount rate becomes zero entirely. You can still discount based on the expectation that future people will be richer (the Growth Part). But you cannot discount simply because they are born later.
  *   *Consequence:* This drastically increases the calculated "cost" of carbon today. Damages in 2100 stop looking like rounding errors and start looking like massive liabilities.
  *   *Philosophical justification:* This aligns with the view that all persons, regardless of temporal location, have equal moral standing. This is the view taken by the Stern Review (2006) and increasingly by courts in climate litigation.

  **2. The Statutes (The Legal Fix)**
  If we refuse to change the discount rate (because economists argue it causes "paralysis" by making every long-term investment look too expensive), then we need to change the legal justification for preservation.
  *   *Consequence:* We stop pretending these laws are based on "cost-benefit." We admit they are based on **rights**. We would need to explicitly state that future people have rights that trump current economic efficiency.
  *   *Philosophical justification:* This moves us from Utilitarianism (maximizing the sum total) to Rights-Based Ethics (certain things cannot be traded).

  **3. The Deeper Fix (The Political Honesty)**
  This is the one nobody wants to do. We need to admit that **Cost-Benefit Analysis is the wrong tool for intergenerational justice.**
  CBA is designed for decisions where the winners and losers are roughly contemporary and can theoretically compensate each other. You can't compensate a person in 2300 for a flooded coastline. They aren't here to take the check.
  *   *What changes:* We stop using CBA as the ultimate arbiter for climate policy. We use it for short-term infrastructure, but for climate, we use "Safe Minimum Standards" or "Target-Based" approaches (e.g., "We must stay under 1.5°C, period, now figure out the cheapest way to get there").

  ### The Verdict

  To answer your core question: The discounting practice, as currently used with Pure Time Preference, presupposes that **future people are morally inferior to present people.** It is a form of discrimination based on birth date.

  The "save the wetlands for the grandkids" rhetoric presupposes that **future people are moral equals to whom we owe duties.**

  These are incompatible. You cannot hold both without hypocrisy.

  If I had to prescribe the change: **Kill Pure Time Preference.** Set it to zero in all federal climate accounting. It costs nothing to do this mathematically, but it costs a lot politically, because it suddenly makes inaction look astronomically expensive.

  But if we won't do that, we must stop using the "future generations" language to justify environmental laws while simultaneously using discount rates that erase those generations from the ledger. We are currently writing checks with one hand that the other hand has already voided. That's not just bad accounting; it's bad faith.
