prompt: |-
  I keep bumping into something weird about how governments actually handle climate costs and I want a real philosopher's read on it, so pretend you're a professional philosopher specializing in intergenerational justice, take the question seriously, but talk like a person not like a journal article.

  Quick setup so we're on the same page, no prior knowledge needed: when agencies do cost-benefit analysis of climate policy, they add up all the harms a ton of carbon will cause over, say, the next 300 years, but then they discount those harms a little for every year they sit in the future — a dollar of damage in 2124 counts as maybe a few cents of damage today. The rate they pick is built from a few ingredients, one of which is what economists call pure time preference: the idea that welfare later just matters less, full stop, independent of whether the future people are rich or poor. The farther out you go the more brutal it gets — sea level damage suffered by people in the year 2400 basically rounds to zero. Meanwhile the same governments run endangered species and wilderness laws that are explicitly justified as preserving things "for future generations," and everybody talks about wrecking a coastline our great-great-grandkids will inherit as a genuine wrong, not a rounding error. And to make it messier, some agencies have started using a discount rate that itself shrinks the further out you go — harsher discounting over the next few decades, gentler at century scale — and I honestly can't tell if that's a philosophical position or just a diplomatic compromise between economists who were fighting.

  So like... what does the discounting practice actually presuppose about whose interests count? Is it the flat-out moral claim that future people's welfare matters less, or is it something more like "they'll be richer, so a dollar means less to them" (which isn't really about their moral status at all), or is it maybe just an accounting convention that snuck over from finance, where discounting makes total sense? And can you help me figure out whether the discounting half and the "save the wetlands for the grandkids" half of the same legal order are even consistent — do they presuppose different things about future people, or is there some view that could underwrite both? If you could brainstorm a bit before committing, that would be great, then distinguish what the practice strictly requires vs. what it's merely compatible with, and where things clash, tell me what would actually have to change — the discount rate, the environmental statutes, or something deeper. Don't cop out with "it's complicated," but also don't pretend there's one clean answer if there isn't.
