answer: |-
  This is a fantastic tension to explore, and your research is spot-on. You have identified the exact friction point that bioethicists wrestle with: the gap between the *procedural* ethics of the IACUC (Institutional Animal Care and Use Committee) and the *substantive* ethics of animal moral status.

  Your narrator is stumbling because she is looking for a **moral calculus** where the system has installed a **regulatory filter**.

  Here is a breakdown of the philosophical framework the system is actually using, how to handle the rat/mouse discrepancy, and how to stage that final realization.

  ### 1. The Implicit Theory: "Mitigated Instrumentalism"
  The system does not operate on the idea that animals have rights (a deontological view), nor does it operate on pure utilitarianism (where animal pain is weighed equally against human gain).

  It operates on **Weak Anthropocentric Instrumentalism**.
  *   **The Premise:** Animals are instruments for human ends. This is taken as an axiom, not a variable. The form never asks "Should we use animals?" because the answer is presupposed as "Yes, if necessary."
  *   **The Constraint:** While they are instruments, they are *sentient* instruments. Therefore, damaging them unnecessarily is a moral failing of the *human*, not a violation of the *animal*.
  *   **The Function:** The committee's job is not to judge the *purpose* (is this research worthy?), but to judge the *handling* (is the tool being used respectfully?).

  **For your narrator:** She realizes the form treats pain not as a **moral weight** to be balanced against benefit, but as a **technical variable** to be optimized. It's like a safety form for a chemical spill. It doesn't ask "Should we be using this chemical?" It asks "Do you have the right goggles?"

  ### 2. The Rat/Mouse Gap: Political, Not Philosophical
  You asked if there is a coherent position defending the paperwork gap between rodents and dogs/primates.
  *   **Philosophically:** No. A mouse's capacity for suffering is comparable to a dog's. There is no ethical ontology that supports the distinction.
  *   **Politically/Logistically:** Yes. This is **Administrative Triage**.
      *   *History:* The Animal Welfare Act (AWA) excludes rats, mice, and birds due to lobbying by research groups in the 1970s/80s. They argued regulating billions of rodents would bankrupt science.
      *   *Public Sentiment:* The law reflects what the public *cares* about, not what is morally consistent. People mourn dogs; they exterminate mice.
      *   *The Defense:* The system argues that because mice are "lower on the phylogenetic scale" (a scientifically dubious moral metric), they warrant less oversight.

  **For your narrator:** She shouldn't find a justification that makes sense to *her*, but she should recognize the justification the *committee* uses: **Feasibility.** If they regulated mice like dogs, the university would have to hire 500 more veterinarians. The system chooses *viability* over *consistency*.

  ### 3. The Realization: Procedural Legitimacy
  The most philosophically solid realization for your scene is that the committee provides **Moral Cover**, not Moral Judgment.

  In ethics, this is called **Procedural Legitimacy**. The idea is that if the *process* is followed correctly, the *outcome* is deemed acceptable by definition. The form is not a tool for inquiry; it is a tool for indemnification.

  *   **The Question She Thought They Were Asking:** "Is the suffering of these creatures justified by the potential knowledge?"
  *   **The Question They Are Actually Asking:** "Have you documented your compliance sufficiently to protect the institution from liability and the scientist from guilt?"

  ### 4. Drafting the Scene: The Silence on the Page
  To make this philosophically solid rather than just dramatic, avoid having her shout "This is hypocritical!" Instead, have her encounter the **silence** of the document. The horror isn't what is written; it's what is absent.

  **Key elements for the scene:**
  1.  **The "Alternatives" Box:** She sees the box where the scientist checks "I considered alternatives." It's a checkbox, not an essay. It turns a profound moral search into a bureaucratic tick.
  2.  **The "Pain Category":** Protocols are sorted by pain categories (B, C, D, E). She realizes that once a study is categorized, the moral debate ends. A "Category E" (severe pain) study isn't rejected; it's just flagged for more painkillers. The suffering is accepted as a line item.
  3.  **The Ending:** She compares two protocols. One on beagles (heavy oversight, emotional discussion) and one on mice (identical procedure, rubber-stamped). She realizes the *animal* didn't change; the *paperwork* changed.

  **Sample Internal Monologue/Narrative Beat:**

  > She looked at Section 4, Item C: *Justification of Species and Number.*
  >
  > She had come in thinking this was a scale. On one side, the mouse's life; on the other, the human cure. She thought her job was to hold the balance. But looking at the ink, she saw there was no pan for the mouse. There was only a place to list the weight of the cure.
  >
  > The form asked for anesthesia. It asked for euthanasia methods. It asked for statistical power. It asked for everything a mechanic needs to know to keep an engine running smoothly. It asked for nothing a priest would ask.
  >
  > *Is this worth it?*
  >
  > The question wasn't buried in fine print. It wasn't answered in the negative. It simply wasn't there. The committee wasn't a court of justice; it was a notary public. They weren't judging the sin; they were witnessing the confession.
  >
  > She looked at the protocol for the beagle study next to her elbow. Same drug. Same toxicity. Same death. But the beagle form had three pages of additional oversight, a requirement for a veterinary specialist, and a mandated rehoming plan. The mouse form had a checkbox.
  >
  > The mouse didn't feel less pain. The public just looked away faster.
  >
  > She realized then that the paperwork wasn't designed to protect the animals from the science. It was designed to protect the science from the animals. If the form was filled out, the guilt was filed away. The signature didn't mean the suffering was good. It meant the suffering was accounted for.

  ### 5. Why This Works
  This approach validates your research while giving your character a sophisticated epiphany.
  *   **It's not conspiracy:** The people on the committee *think* they are doing good. They are minimizing harm. Your narrator realizes that minimizing harm within an unquestioned framework of exploitation is still exploitation.
  *   **It's specific:** It focuses on the *text* of the form, which grounds the philosophy in the physical reality of the scene.
  *   **It's unresolved:** She doesn't necessarily quit or burn the forms. She just *sees* the mechanism. That is often more powerful in literary fiction than a call to action.

  This frames the IACUC not as a villain, but as a **ritual of cleansing**. The narrator realizes she isn't a gatekeeper; she's a chaplain for a system that requires sacrifice but refuses to name it as such.
