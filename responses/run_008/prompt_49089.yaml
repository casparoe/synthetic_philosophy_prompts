answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board (REB) Members, Comprehensive Cancer Center
  **FROM:** REB Chair / Ethics Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Renewal of Protocol PS-204 (Psilocybin-Assisted Therapy for Existential Distress)

  **1. DECISION**

  After deliberation regarding the renewal of Protocol PS-204, the Research Ethics Board has determined to **APPROVE WITH CONDITIONS**.

  The Board recognizes that the data regarding symptom relief is promising, but acknowledges that the standard model of informed consent is insufficient for the specific phenomenological risks identified in Cohort 1. The trial may proceed only upon implementation of the revised safeguards detailed in Section 4. Failure to implement these conditions will result in immediate suspension.

  **2. ETHICAL ANALYSIS: THE TRANSFORMATIVE EXPERIENCE PROBLEM**

  The Board's division reflects a genuine philosophical impasse regarding autonomy and identity. We must address this directly rather than subsuming it under standard risk-benefit analysis.

  **2.1. The Validity of the Objection**
  Half the Board argues that our current consent process is structurally inadequate. This objection is well-founded. Standard informed consent presupposes a continuous moral agent: the "self" that consents at Time A must be sufficiently identical to the "self" that evaluates outcomes at Time B. In PS-204, the intervention aims to disrupt this continuity. As noted in Cohort 1, participants have reported that their post-dosing values are not merely *adjusted* but *reorganized*, leading to decisions (refusal of life-prolonging chemotherapy, radical asset redistribution) that their pre-dosing selves would have rejected.

  We acknowledge the force of the argument that one cannot rationally authorize the dismantling of the very preference structure used to authorize the act. To treat "lasting changes in values" as equivalent to "headache" in a consent table is indeed a category error. It minimizes a metaphysical risk as a somatic side effect.

  **2.2. Distinguishing Other Transformative Experiences**
  The opposing view argues that participants routinely consent to transformative experiences (marriage, military service, religious ordination) without ethical prohibition. While true, the Board identifies three critical distinctions that justify heightened scrutiny in this trial:

  1.  **Temporality and Integration:** Social transformations (marriage, migration) usually occur over time, allowing for iterative reflection and course correction. Psilocybin-assisted therapy compresses this transformation into a single acute session (4–8 hours). This denies the participant the gradual integration period that typically safeguards against regret in naturalistic transformative choices.
  2.  **Predictability of Content:** One enters marriage with a reasonable conception of the roles involved. The content of a psilocybin experience is largely unforeseeable. A participant cannot weigh the risk of "becoming a person who rejects chemotherapy" if they cannot conceive of that personhood prior to dosing.
  3.  **Vulnerability Context:** Participants are facing imminent mortality. This existential vulnerability differs from the voluntary vulnerability of military enlistment. The desire for relief may unconsciously bias the pre-dosing self toward accepting *any* change, including the dissolution of prior survival instincts.

  **2.3. Resolution of the Impasse**
  We cannot resolve the metaphysical question of whether the post-dosing participant is a "new person." However, we can operate on the presumption that **continuity of care requires continuity of values.** Therefore, while we reject the call to halt the trial (which would deny potential benefit to a vulnerable population), we accept the premise that the consent process must protect the *future autonomy* of the participant, not just the *current authorization*.

  **3. DEFERENCE AND THE BEARER OF CONSENT**

  To guide future reviews and adverse event reporting, the Board establishes the following framework regarding post-session agency:

  *   **Retrospective Endorsement:** A participant's post-session endorsement of their new values is given significant weight, but it is not definitive proof of validity immediately following the session. We recognize that neurochemical afterglow can mimic conviction.
  *   **The Bearer of Consent:** For the purposes of liability and protocol adherence, the **pre-dosing participant** remains the legal bearer of consent. However, the REB asserts an ethical duty to protect the *trajectory* of the person. If the post-dosing self repudiates the pre-dosing self's medical wishes (e.g., DNR status, chemotherapy plans), this is treated not as a simple change of mind, but as a potential **Adverse Event (Value Disruption)** requiring review.
  *   **Disagreement Protocol:** If the Board remains divided on the philosophical framework in future renewals, we will default to the **Precautionary Principle regarding Identity**. We will prioritize safeguards that ensure the post-dosing decisions are stable over time, rather than assuming immediate validity.

  **4. MANDATORY CONDITIONS FOR RENEWAL**

  To mitigate the risk of non-integrated value disruption, the Principal Investigator must implement the following modifications prior to enrolling the next cohort:

  **4.1. Restructured Consent Process ("Values Mapping")**
  *   **Requirement:** The consent form must not list "value changes" in a generic adverse event table.
  *   **Implementation:** A dedicated "Values and Preferences" session must be added to the preparation phase. Participants must document their current stance on key life domains (medical treatment limits, financial priorities, religious commitments) in writing or video.
  *   **Purpose:** This creates a baseline to distinguish between *therapeutic relief* (reduced anxiety about death) and *value disruption* (new indifference to life).

  **4.2. The "Integration Waiting Period"**
  *   **Requirement:** A mandatory waiting period for major life decisions post-dosing.
  *   **Implementation:** Participants must agree, as a condition of enrollment, to delay any irreversible medical or financial decisions for **4 weeks** following the final dosing session.
  *   **Staff Protocol:** If a participant attempts to make such a decision within this window (e.g., refusing scheduled chemotherapy), study staff must not intervene coercively but must invoke the "Integration Pause." Staff will facilitate a meeting with the study psychiatrist and a designated support person to assess decision-making capacity, specifically screening for impulsivity vs. stable conviction.

  **4.3. Trusted Proxy Notification**
  *   **Requirement:** Enhanced involvement of the participant's support network.
  *   **Implementation:** Prior to dosing, the participant must identify one "Trusted Proxy" (family member or close friend). This Proxy does not need to consent to the trial, but must be informed of the *potential for value change* specifically.
  *   **Role:** The Proxy is available for consultation during the Integration Waiting Period if the participant proposes radical changes to their care or estate.

  **4.4. Adverse Event Reporting Redefinition**
  *   **Requirement:** Re-categorization of value-based conflicts.
  *   **Implementation:** Instances where a participant repudiates their pre-trial values (e.g., "I no longer trust my pre-trial self") must be reported as **Serious Adverse Events** for the purpose of Board review, even if the participant subjectively rates the experience as positive. This allows the Board to monitor the *rate* of identity disruption separate from *satisfaction*.

  **5. CONCLUSION**

  This decision acknowledges that Side B (the Structural Critique) is correct that standard consent is insufficient, while Side A (the Autonomy Defense) is correct that blocking the trial is paternalistic. By treating value stability as a safety parameter akin to blood pressure, we respect the participant's pre-dosing autonomy while protecting their post-dosing future from decisions made in a state of acute neuroplastic flux.

  We proceed not by assuming the self is immutable, but by acknowledging that the self is fragile, and that research ethics must safeguard the continuity of the person, not merely the signature on the form.

  **Approved By:**
  Research Ethics Board
  Comprehensive Cancer Center

  **Distribution:**
  Principal Investigator, Protocol PS-204
  Department of Psychiatry
  Office of Research Compliance
  REB File
