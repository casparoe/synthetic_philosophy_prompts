  *Actually, re-reading: "I serve on the research ethics board... I need a decision memo for our next session." This suggests I am writing a draft *proposal* for the board to consider/adopt. However, it also says "Draft the board's decision memo... It should reach a concrete bottom line." I will write it as the **Final Decision of the REB**, assuming the role of the Chair or Secretary synthesizing the vote into a formal document. This is the most useful format.*

