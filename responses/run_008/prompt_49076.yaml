  # JOINT STATEMENT OF POSITION AND AGENDA
  **Workshop on the Metaphysics and Psychology of Skill**
  **Date:** [Insert Date]
  **Participants:** [Intellectualist Faculty], [Rylean Faculty]
  **Moderator:** [PhD Student]

  ## PREAMBLE
  We, the undersigned, acknowledge a decade of dialogue regarding the relationship between knowledge-how and knowledge-that. While we remain divided on the fundamental analysis of skill, we agree that progress requires isolating our points of convergence to better target our points of divergence. This document serves as a baseline for our upcoming workshop, distinguishing settled empirical and conceptual ground from live theoretical disputes.

  ---

  ## 1. AGREED CLAIMS
  *The following claims are accepted by both parties as a starting point for further inquiry.*

  **1.1. Linguistic Data**
  1.  **Embedding:** Ascriptions of knowledge-how (e.g., "Hannah knows how to ride a bike") share syntactic embedding properties with knowledge-that ascriptions (e.g., they can serve as complements to verbs like "know," "explain," or "wonder").
  2.  **Distinctness:** Despite syntactic similarities, knowledge-how ascriptions do not always permit substitution with knowledge-that ascriptions *salva veritate* without shifting the context or mode of presentation.
  3.  **Semantic Underdetermination:** The linguistic behavior of "knows how" constrains but does not uniquely determine the metaphysical category of the state being ascribed.

  **1.2. Phenomenology and Psychology of Performance**
  4.  **Dissociation:** Declarative (explicit) and procedural (implicit) memory systems are neurally and functionally dissociable (e.g., amnesic patients can acquire motor skills without recalling the training episode).
  5.  **Automaticity:** Expert performance is characterized by a reduction in conscious, effortful control and an increase in fluency and automaticity compared to novice performance.
  6.  **Transition:** The transition from novice to expert typically involves a shift from reliance on explicit rules or instructions to more integrated, holistic performance patterns.
  7.  **Guidance:** Skilled action is guided by the agent's sensitivity to the environment and goals, rather than being merely reflexive or random.

  **1.3. Ryle's Regress Argument**
  8.  **Limitation on Occurrent Thought:** Both parties agree that Ryle's regress successfully demonstrates that skilled action cannot be preceded by an *occurrent* act of contemplating a proposition or rule for every instance of action.
  9.  **No Logical Impossibility:** Both parties agree that the regress does not logically prove that propositional knowledge *cannot* be involved in skill, provided that the propositional attitude is dispositional rather than occurrent, or that the "contemplation" is internal to the execution of the act itself.
  10. **Explanatory Burden:** The regress establishes that any theory positing propositional involvement must explain how such knowledge guides action without requiring an infinite chain of prior intellectual operations.

  ---

  ## 2. MAP OF RESIDUAL DISAGREEMENTS
  *The following table outlines the core disputes. Each row describes the same point of contention, phrased charitably according to each party's theoretical framework.*

  | Topic | Formulation Acceptable to the Intellectualist | Formulation Acceptable to the Rylean (Anti-Intellectualist) |
  | :--- | :--- | :--- |
  | **The Role of the Practical Mode of Presentation (PMoP)** | The PMoP is a distinct cognitive relation to a proposition that explains how propositional content can guide action directly without requiring translation into motor commands. | The PMoP is a theoretical placeholder for the ability itself; invoking it risks obscuring the fact that the "practicality" comes from the disposition to act, not the content of the representation. |
  | **Direction of Explanation** | The possession of the relevant propositional attitude (under a PMoP) constitutes the knowledge, which in turn explains (or is identical to) the possession of the ability. | The possession of the complex ability/disposition constitutes the knowledge; attributions of propositional content are derivative explanations we offer post-hoc to make sense of the ability. |
  | **The Weight of Counterexamples** | **Priority:** Cases of *Knowledge without Ability* (e.g., the injured expert).<br>**Interpretation:** These show that knowledge-how is distinct from the ability to perform, supporting the view that it is a propositional state that can persist when the body fails. | **Priority:** Cases of *Ability without Knowledge-That* (e.g., the chicken sexer or native speaker).<br>**Interpretation:** These show that the core of skill is reliable performance, and the inability to articulate propositions demonstrates that propositional knowledge is not necessary for knowing-how. |
  | **The Nature of "Intellectual" Interference** | Verbal interference tasks disrupt skill because they compete for the same propositional resources required to maintain the practical mode of presentation. | Verbal interference tasks disrupt novice skill (which relies on rules) but should have minimal effect on expert skill (which relies on non-propositional embodied dispositions). |

  ---

  ## 3. IDENTIFIED CRUXES
  *We identify the following two issues as the primary bottlenecks preventing theoretical convergence.*

  **Crux A: Semantics vs. Metaphysics**
  Does the semantic analysis of the phrase "knows how" settle the metaphysical nature of the underlying cognitive state?
  *   **Intellectualist Lean:** The propositional structure of the ascription reflects the propositional structure of the mental state.
  *   **Rylean Lean:** The ascription tracks social norms of attribution and ability, which may not map 1:1 onto the internal representational structure (if any).

  **Crux B: The Metamorphosis of Expertise**
  What happens to "knowledge" during the transition from novice to expert automaticity?
  *   **Intellectualist Lean (Sedimentation):** The propositional knowledge becomes faster, implicit, and integrated, but remains propositional in format (compressed/compiled).
  *   **Rylean Lean (Displacement/Bypass):** The control of action shifts from propositional systems to distinct, non-propositional sensorimotor systems; the original "knowledge-that" is discarded or bypassed.

  ---

  ## 4. PROPOSED EMPIRICAL ADJUDICATIONS
  *For each Crux, we propose a specific experimental or argumentative test. Both parties agree to accept the results as bearing on the plausibility of their respective positions.*

  | Crux | Proposed Test / Case | Intellectualist Prediction | Rylean Prediction |
  | :--- | :--- | :--- | :--- |
  | **A: Semantics vs. Metaphysics** | **Cross-Linguistic & Developmental Analysis:** Examine languages that do not use a "knows how" complementizer structure (e.g., using "can" or "understands" exclusively) and track child acquisition of skill terms. | If intellectualism is true, even languages without specific "how" syntax will allow embedding of question-clauses regarding ways of acting, and children will treat skill attributions as factive regarding a "way." | If Ryleanism is true, languages will vary significantly in whether they treat skill as a state of "knowing" vs. "being able," and children will distinguish "can" (ability) from "know" (information) earlier and more sharply. |
  | **B: Metamorphosis of Expertise** | **Dual-Task Interference in Experts:** Experts perform a highly automated skill (e.g., putting in golf, typing) under high verbal working-memory load vs. low load. | **Interference Effect:** Performance will degrade under verbal load, even for experts, because the practical mode of presentation relies on resources shared with verbal-propositional processing. | **Null/Reduced Effect:** Performance will remain stable under verbal load for experts (unlike novices), because expert automaticity relies on sensorimotor loops independent of verbal-propositional working memory. |

  ---

  ## 5. SIGNATURES

  _________________________ (Intellectualist)

  _________________________ (Rylean)

  _________________________ (Moderator)

  ***

  # MODERATOR'S ANALYSIS OF VERBAL DISPUTE
  *(Prepared for the PhD Student/Workshop Organizer)*

  Per your second request, I have analyzed the draft above to identify verbal disputes and evaluate your hypothesis that the "interesting residue is empirical."

  ### 1. Identification of Verbal Dispute
  There is a significant verbal component located in **Section 1, Claim 1.2 (Dissociation)** and **Section 2 (Direction of Explanation)**.

  *   **The Quarrel:** The term "Propositional."
  *   **Why it is Verbal:** The Intellectualist often defines "propositional" broadly to include any structured, intentional content that can be true or false, even if non-linguistic and unconscious (e.g., "motor propositions"). The Rylean defines "propositional" narrowly as "linguistically articulable" or "conceptually mediated."
  *   **Consequence:** If the Intellectualist expands "propositional" to mean "any structured guidance signal," the Rylean has no objection to the *mechanism*, only the *label*. Conversely, if the Rylean concedes that sensorimotor contingencies have "content," they may look like Intellectualists. Much of the heat in their decade-long argument likely stems from the Intellectualist insisting that *structure implies proposition* and the Rylean insisting that *proposition implies articulation*.

  ### 2. Evaluation of Your Hypothesis
  **Your Hypothesis:** *The interesting residue is empirical (in skill acquisition and expertise studies) rather than semantic.*

  **Verdict:** **Vindicated, with a caveat.**

  *   **Vindication:** The document successfully pushes the dispute into **Section 4 (Proposed Empirical Adjudications)**. Both parties have agreed that the "Dual-Task Interference" experiment bears on the metaphysics of skill. If experts choke under verbal load, Intellectualism gains ground; if they do not, Ryleanism gains ground. This confirms your suspicion that the philosophy cannot move without the cognitive science.
  *   **The Caveat:** The "Semantics vs. Metaphysics" Crux (Crux A) remains partly semantic. Even if the empirical data comes in favor of the Rylean (e.g., experts are immune to verbal load), the Intellectualist can retreat to the claim that "the propositions are simply sub-personal and immune to interference." To prevent this, the **definitions** in Section 1 must be policed during the workshop.

  **Recommendation for the Workshop:**
  When you open the session, explicitly define "Propositional" for the day's proceedings. Force them to agree on an *operational definition* (e.g., "accessible to verbal working memory" vs. "structurally isomorphic to language"). If you do not fix the terminology, the empirical results in Section 4 will be interpreted away by the losing side, and the decade-long argument will continue. The document provided gives you the leverage to stop that maneuver.
