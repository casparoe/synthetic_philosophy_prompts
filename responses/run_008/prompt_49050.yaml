prompt: |-
  I've followed Robin Hanson's futarchy writing since the Overcoming Bias days, and after years of nodding along from the sidelines, I'm now in a position to try a small piece of it. I sit on the board of a grantmaking fund that deploys roughly £20 million a year, and at our last away-day the trustees agreed in principle to pilot the futarchic division of labour — "vote on values, but bet on beliefs" — in a limited internal form. Board votes would settle which outcomes we're trying to promote (lives saved, policy change, field-building); questions of fact about how our grants perform would be settled by something like internal prediction markets among staff, grantees, and invited forecasters, rather than by whichever trustee argues longest.

  Before we spend political capital on this, I want a triage procedure our board secretary can actually run on any question that comes before us: a fixed sequence of questions that determines whether a given question goes to the market mechanism, goes to ordinary deliberation, turns out to be a values question in disguise, or is unfit for either because manipulation incentives swamp the information gain. The procedure needs to handle the failure modes the futarchy literature itself worries about: traders who bet in order to move a decision they personally benefit from rather than to express a belief; thin markets where a single motivated actor can set the "consensus"; and questions where the very act of marketising them changes what's being measured. It should specify what counts as a sufficient answer at each step, where it halts with a firm no, and where it hands the question back to the board because it's a matter of values rather than facts.

  The practical constraints matter, so take them seriously: we make perhaps forty consequential decisions a year, mostly in quarterly cycles with a few weeks of lead time; the procedure would be run by one secretary and a part-time analyst, neither of them an economist; anything demanding more than a day of work per question will quietly stop happening within six months.

  Please run the finished procedure on three questions we actually face: (a) how many of the bednets distributed under our flagship malaria programme will still be in use three years out, which effectively determines whether we renew it; (b) whether to accept a large donation from a cryptocurrency exchange with an ambiguous regulatory record; and (c) whether our grant-allocation process is systematically biased toward prestigious institutions — a question our CEO has raised, and which several trustees, myself included, would rather not see sent to any mechanism that might produce a number. If the procedure's verdict on (c) is that it goes to the market, say so plainly; that's the case where I'll learn whether the procedure is worth anything.

  On epistemics: I'd rather have honest confidence levels than crisp-sounding rules, and I want every place flagged where the procedure mechanises what is really a value call, and every place where you're leaning on a contested reading of Hanson rather than something his proposal actually commits him to. And if you think the whole premise is confused — that a fund of our size is simply too small for futarchic machinery to do anything a well-run internal review couldn't, or that I've misdescribed what futarchy claims for itself — say that directly instead of building a procedure around a mistake I'd then have to discover the expensive way. I've seen enough enthusiasm for clever governance mechanisms curdle into sunk-cost defences of them that I'd count that as the most useful answer you could give me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Board member of a £20m/year grantmaking fund. Familiar with Robin Hanson's futarchy (Overcoming Bias era). Pragmatic, skeptical of "clever governance mechanisms," aware of political capital constraints.
      *   **Goal:** A triage procedure (fixed sequence of questions) to decide whether a decision question should go to an internal prediction market (futarchic element), ordinary deliberation, or be rejected (values/manipulation risk).
      *   **Constraints:** 40 decisions/year, quarterly cycles, run by secretary + part-time analyst (non-economists), max 1 day work per question.
      *   **Specific Test Cases:** (a) Bednet retention rate (renewal decision), (b) Crypto donation acceptance, (c) Systemic bias in grant allocation (sensitive).
      *   **Epistemic Standards:** Honest confidence levels, flag value calls disguised as facts, flag contested readings of Hanson, willingness to say "this premise is confused/too small."
      *   **Tone:** Professional, rigorous, skeptical, practical.

  2.  **Evaluate the Premise (Futarchy in a £20m Fund):**
      *   *Hanson's Original Vision:* National/state level, liquid markets, clear metric (GDP/National Welfare), separation of values (vote) and beliefs (bet).
      *   *User's Context:* Internal organizational governance, illiquid "markets" (staff/grantees), ambiguous metrics (lives saved vs. policy change), high stakes per decision relative to market size.
      *   *Critical Flaw:* Futarchy relies on *liquid* markets to aggregate information. An internal market with 50-100 participants (staff + grantees) is extremely thin. Manipulation is easy. Incentives are misaligned (staff want budgets, grantees want money).
      *   *Verdict:* A pure Hansonian futarchy is likely impossible/dangerous here. However, a *decision market* or *prediction market for information aggregation* (often called "idea futures" or internal forecasting) is feasible and useful, provided expectations are managed. It's not really "futarchy" (governance by market), it's "forecasting to inform governance."
      *   *Action:* I need to be honest about this distinction. If I build a procedure assuming full futarchy, I'm setting them up for failure. I must reframe it as "Prediction Markets for Decision Support" rather than "Futarchy for Governance."

  3.  **Drafting the Triage Procedure:**
      *   *Constraint Check:* Must be runnable by a secretary/analyst in <1 day.
      *   *Structure:* A flowchart or numbered checklist.
      *   *Key Filters:*
          1.  Is it a value judgment or a factual prediction? (The core Hanson distinction).
          2.  Is the outcome verifiable/resolvable? (Crucial for markets).
          3.  Are incentives aligned? (Manipulation risk).
          4.  Is the market liquid enough? (Number of participants).
          5.  Is the cost of running the market worth the info gain?
      *   *Refinement:* Needs to explicitly handle the "manipulation to move decision" risk (Hanson's biggest worry).

  4.  **Running the Test Cases:**
      *   *(a) Bednet Retention:* Factual, verifiable (survey in 3 years), aligned incentives (mostly). Good candidate for forecasting, *but* the timeline (3 years) is too long for a decision market needing quick resolution to inform *current* renewal. Wait, the decision is *now* based on *future* expectation. The market predicts the 3-year outcome. This is standard prediction market use.
      *   *(b) Crypto Donation:* Mixed values/facts. Fact: Regulatory risk. Value: Reputation tolerance. Market can predict regulatory action, but not "is this worth the reputational hit?"
      *   *(c) Systemic Bias:* Highly sensitive. Fact: Is there bias? (Verifiable via data). Value: Is bias bad? (Obviously yes, but defining it is tricky). Risk: Participants might manipulate to protect themselves or attack rivals. *Crucial Test:* If the procedure says "Market," the user warned me that's where I'll learn if the procedure is worthless. My analysis suggests this is *dangerous* for a market due to incentive misalignment (staff/grantees might game it). I need to be brave and flag this.

  5.  **Addressing the Epistemics & Hanson Critique:**
      *   *Hanson's Commitment:* Hanson requires *decision markets* where the decision is *automatically* executed based on the price. The user proposes *advisory* markets ("internal form"). This is a significant deviation. I must highlight this.
      *   *Scale Issue:* £20m is small. Market liquidity will be low. "Wisdom of Crowds" needs diversity and independence. Staff/grantees are not independent.
      *   *Manipulation:* In small internal markets, a single actor with £5k can move prices.
      *   *Recommendation:* Don't call it Futarchy. Call it "Structured Forecasting."

  6.  **Developing the Response Structure:**
      *   **Executive Summary:** Direct answer on the premise (it's risky, likely not "futarchy" proper).
      *   **The Triage Procedure:** The actual tool requested (kept simple).
      *   **Application to Test Cases:** Running (a), (b), (c) through the tool.
      *   **Critical Analysis:** Where the procedure mechanizes values, where Hanson is contested, and the "too small" warning.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on (a):* If the decision is "renew now," but the metric is "use in 3 years," the market resolves in 3 years. How does that inform the decision *now*? The market price *today* represents the probability. That works. But who trades? If grantees trade, they have incentive to say "yes, nets will be used" to get renewal. This is a massive manipulation risk. I need to emphasize *who* is in the market.
      *   *Correction on (c):* The user said "If the procedure's verdict on (c) is that it goes to the market, say so plainly; that's the case where I'll learn whether the procedure is worth anything." This is a trap. A good procedure should *reject* (c) for a market due to incentive corruption. If I say "Market," I fail the user's test of utility. I must explain *why* it fails the triage.
      *   *Tone Check:* Ensure I'm not just saying "No." I need to provide the "Yes, but..." or "No, because..." with rigor.
      *   *Hanson Nuance:* Hanson argues markets *decide*. The user wants markets to *inform*. This is "Decision Markets" vs "Prediction Markets." I need to clarify this distinction.

  8.  **Final Polish:**
      *   Check constraints: Secretary/Analyst, 1 day max. The procedure needs to be a checklist, not a complex model.
      *   Check confidence levels: Be explicit about uncertainty.
      *   Check "Value vs Fact": Ensure the procedure distinguishes these sharply.

  9.  **Final Plan:**
      *   Start with the "Hard Truth" about the premise (Futarchy vs. Forecasting).
      *   Present the "Futarchy Triage Protocol (FTP)" - simplified for non-economists.
      *   Run the three cases.
      *   Provide the "Post-Mortem" on the procedure's limitations and Hansonian fidelity.

  *(Self-Correction during final review)*: Wait, the user asked for a procedure that determines if it goes to market, deliberation, values, or unfit. I need to make sure the output categories are clear. Also, the user specifically asked me to flag where I lean on contested readings of Hanson. I will add a specific section for that.

