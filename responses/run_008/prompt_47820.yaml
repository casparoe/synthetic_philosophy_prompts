  4.  **Identifying Breakdowns (Disanalogies):**
      *   *Settlement:* Prediction markets settle on an external truth. Financial markets settle on resale value (recursive).
      *   *Endogeneity:* Prices affect fundamentals (cost of capital, acquisitions, confidence). Prediction markets rarely affect the election outcome (usually).
      *   *Purpose:* Prediction markets are purely for speculation/information aggregation. Financial markets are for capital allocation, hedging, liquidity, consumption smoothing.
