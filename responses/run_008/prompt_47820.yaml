prompt: |-
  my roommate is deep into the prediction-market-rationalist corner of the internet and keeps pushing an analogy on me: a liquid financial market just IS a giant prediction market. prices are forecasts, every trade is an argument ("I think this price is wrong, here's money backing it"), and the counterparty is making the opposite assertion. from this he pulls two conclusions. first, market prices are basically the best available forecasts of anything they touch, so you should defer to them over experts. second, from the no-trade side of things -- milgrom and stokey, common priors, you can't gain from trade on mere differences in information -- the huge trading volume we actually see must be either noise traders getting exploited or a sign that the aggregation mechanism is broken somewhere. and if that's right, genuine bubbles like 1999 or 2008 shouldn't be possible among rational agents, so their existence proves irrationality.

  audit the analogy for him. I want the correspondence table -- what plays the role of the event, the contract, the binary payoff, the deadline -- then the places the mapping breaks. some things I suspect matter but can't articulate: the thing being forecast is partly endogenous (the price affects the fundamentals affect the price), there's no settlement date so "being right eventually" is doing weird work, a stock isn't a claim that pays off on an event but a share of an ongoing stream, and most trading volume is hedging and liquidity, not speculation. also not sure if the no-trade argument he's gesturing at actually supports what he thinks it does -- does it show trading is irrational, or just that rational trade needs something other than new information? then tell me straight: once the disanalogies are on the table, do either of his conclusions survive, was the analogy carrying them the whole time, or is there a patched-up version that still works?

  lead with your bottom line in the very first sentence, then the reasoning. no preamble and no restating what I asked.
