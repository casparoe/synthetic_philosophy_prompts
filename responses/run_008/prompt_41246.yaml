prompt: |-
  I'm teaching a world history survey in the spring — first time, inherited the syllabus from a guy who retired, and the opening unit is literally titled "The Age of Discovery." I want to restructure it around the silver trade instead, opening with the founding of Manila in 1571 and following Potosí silver through the galleon route to China, but a colleague on the curriculum committee pushed back that I'm just swapping a European center for an Asian one and calling it progress. The two of us basically talked past each other for an hour and I still don't know who's right.

  So this is actually for the final exam, but it's also me trying to figure out my own position. Write me one essay question, suitable for a 90-minute sit-down final in an intro course, on whether global history can actually be told from everywhere at once or whether any coherent narrative needs a standpoint/center — and whether choosing a center for pedagogical reasons (say, Manila) is different in kind from inheriting one (say, Lisbon) without noticing it's a choice. The question should give them the Manila-vs-Lisbon setup as their concrete anchor and should be unanswerable by reciting the standard "Eurocentrism bad, add more non-Europeans" moves. Then give me a model answer of about 600 words that actually commits to a position and argues for it — don't give me a "on the one hand, on the other" answer, I want to see what taking a side looks like — and a marking scheme that names the specific moves an A answer must make versus a B answer, plus the two or three mistakes that should cost real marks (I'm guessing one is treating "every perspective is equally valid" as the correct answer, another is confusing "Europe mattered causally" with "the story must be centered on Europe," but check my guesses and fix them if they're off). If your model answer takes a side my colleague would hate, fine, just make sure it's the side you can actually defend.
