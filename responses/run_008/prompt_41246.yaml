          1.  *Epistemic Relativism:* Claiming the choice is arbitrary because "truth is subjective." (Nuance: It's not arbitrary; it's heuristic).
          2.  *Causal Determinism:* Equating "who sailed" with "where the story starts."
          3.  *The "View from Nowhere":* Insisting a truly global history has no center (impossible for a narrative).
      *   I will stick close to the user's guesses but sharpen the language for a rubric.

