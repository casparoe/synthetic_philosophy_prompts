answer: |-
  ### Final Exam Essay Question (History 101: The Modern World)

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,000 words maximum

  **Prompt:**
  Traditional surveys often open with the "Age of Discovery," centering Lisbon and the year 1492. An alternative approach opens with the founding of Manila in 1571, tracing Potosí silver through the Galleon Trade to Ming China. A critic might argue that swapping Lisbon for Manila merely replaces a European center with an Asian one, failing to achieve true "global" history.

  Write an essay arguing whether a coherent historical narrative *requires* a specific geographic standpoint, or if it is possible to write history from "everywhere at once." In your argument, you must address whether there is a meaningful difference between *inheriting* a traditional center (Lisbon) without question and *choosing* a pedagogical center (Manila) deliberately. Avoid generic arguments about "inclusion" or "diversity"; focus instead on narrative structure, historical causality, and the limits of perspective.

  ***

  ### Model Answer (Commitment: The Necessity of the Chosen Standpoint)

  The claim that shifting a syllabus from Lisbon to Manila is merely "swapping centers" assumes that a centerless global history is possible. It is not. All history is narrative, and all narrative requires selection. To tell a story is to stand somewhere. The critical distinction, therefore, is not between having a center and having none, but between a center that is naturalized as objective truth and a center that is acknowledged as a heuristic tool. Choosing Manila is not just progress; it is historically more rigorous than inheriting Lisbon, provided we understand why.

  The "Age of Discovery" framework inherits Lisbon as a center not because it is the only causal node, but because it was the vantage point of the archives that built the discipline. When a syllabus opens in 1492 with Columbus or Da Gama, it implicitly argues that history moves when Europeans move. This conflates *agency* with *causality*. Europeans certainly had the agency to sail, but the silver trade demonstrates that their ships were causally dependent on Asian markets. Silver mined in Potosí did not become global wealth until it was accepted in Ming China. If the story begins in Lisbon, China appears as a destination. If the story begins in Manila, Europe appears as a supplier to a Chinese silver standard. Both are true, but the latter reveals a causal mechanism (global demand) that the former obscures (European exploration).

  Therefore, the colleague's critique that this is just "Asiacentrism" misses the function of a pedagogical center. A center is not a claim that one civilization is superior; it is a focal point for tracing connections. The problem with Lisbon is not that it is European, but that it is *invisible* as a choice. It is presented as the "natural" start of modernity. This creates the illusion of a "view from nowhere," where the European experience is mistaken for the universal human experience. When a historian inherits this standpoint without noticing it, they teach students that European expansion was the engine of history, rather than one component of a multipolar system.

  Conversely, choosing Manila deliberately acknowledges the standpoint. It signals to the student: "We are standing here to see these specific connections." This does not deny European agency; it recontextualizes it. The Galleon Trade cannot be told without Acapulco or Seville, but by anchoring in Manila, we force the narrative to account for the Chinese merchants, the Spanish crown, and the Indigenous miners simultaneously. It makes the *connections* the subject, rather than the *voyagers*.

  Ultimately, a "global history from everywhere at once" is a contradiction in terms. It would be a database, not a history. To make meaning, we must draw lines. The ethical and intellectual obligation is not to pretend we have no standpoint, but to choose a standpoint that maximizes causal clarity. Lisbon was chosen because it served imperial archives. Manila is chosen because it serves economic causality. Swapping them is only "swapping bias" if one believes bias is unavoidable and therefore irrelevant. But if bias is a lens, we are obligated to choose the lens that brings the most of the picture into focus. Inheriting Lisbon treats the lens as the world; choosing Manila treats the lens as a tool. That distinction is the difference between ideology and history.

  ***

  ### Marking Scheme & Grading Notes

  **A Range (Excellent)**
  *   **Thesis:** Clearly commits to a position on the necessity of a standpoint (e.g., "All narrative requires a center" OR "Centerless history is impossible").
  *   **Distinction:** Explicitly differentiates between *inherited/naturalized* centers (Lisbon as 'default') and *chosen/heuristic* centers (Manila as 'tool').
  *   **Causality:** Moves beyond representation to explain how the choice of center changes the *causal explanation* (e.g., European agency vs. Chinese demand).
  *   **Avoids Traps:** Does not retreat into relativism ("both are equal") or moralizing ("Europe is bad").

  **B Range (Competent)**
  *   **Thesis:** Takes a position but hedges (e.g., "Both sides have points").
  *   **Distinction:** Discusses the swap but treats it primarily as a political/representational act rather than a historiographical one.
  *   **Causality:** Describes the silver trade accurately but fails to explain how the *narrative structure* alters the historical interpretation.
  *   **Avoids Traps:** Avoids major factual errors but relies on standard "diversity" arguments rather than engaging with narrative theory.

  **C Range (Basic)**
  *   **Thesis:** Vague or restates the prompt.
  *   **Content:** Recites facts about Manila/Potosí without addressing the "standpoint" question.
  *   **Analysis:** Treats "Eurocentrism" as a moral failing rather than a structural narrative issue.

  **Specific Penalties (Deduct 1-2 Grades if present)**
  1.  **The Relativist Cop-Out:** Arguing that "all perspectives are equally valid, so it doesn't matter which we choose."
      *   *Why:* This fails the prompt's demand to evaluate pedagogical utility. If all centers are equal, the syllabus design is arbitrary.
  2.  **The Causation/Narrative Conflation:** Arguing that "Because Europeans sailed the ships, the story *must* start in Europe."
      *   *Why:* This confuses *initiation of action* with *structure of the system*. It fails to recognize that demand (China) drives supply (Potosí/Europe) just as much as supply drives demand.
  3.  **The "View from Nowhere" Fallacy:** Insisting that "True global history has no center."
      *   *Why:* This is theoretically naive. A survey course is a narrative; narratives require selection and sequencing. Claiming otherwise avoids the hard work of syllabus design.

  **Instructor Note (For your eyes only):**
  Your colleague's objection relies on the idea that "centering" is inherently hegemonic. The model answer defeats this by arguing that *selection* is inherent to history-making. The win condition for your syllabus isn't proving Asia is "more important" than Europe; it's proving that the *Silver System* is a better explanatory framework for "modernity" than the *Discovery Framework*, and that Manila is the best node to teach that system. If your students grasp that distinction, you've won the argument.
