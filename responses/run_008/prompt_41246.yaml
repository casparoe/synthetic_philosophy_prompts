          2.  **Model Answer:** ~600 words. Must *commit* to a position (no fence-sitting). Must be defensible.
          3.  **Marking Scheme:** Distinguish A vs. B moves. Identify specific mistakes that cost marks (user guessed two, I need to validate/fix them).
      *   **Tone:** Academic, pedagogical, thoughtful, slightly meta (since it's for the teacher's own clarity too).

  2.  **Deconstruct the Historiographical Problem:**
      *   *The Core Issue:* Is "global history" possible without a vantage point? Or is all history situated?
      *   *The Pedagogical Issue:* Is choosing a center (Manila) for teaching purposes distinct from claiming that center is objectively the "most important" (like Lisbon often implied)?
      *   *The Trap:* Relativism ("all centers are equal") vs. Hegemony ("my center is best").
      *   *The User's Guess on Mistakes:*
          1.  Treating "every perspective is equally valid" as the correct answer (Relativism cop-out).
          2.  Confusing "Europe mattered causally" with "the story must be centered on Europe" (Causation vs. Narrative).
          *My Assessment:* These are good guesses. I should refine them to be more precise about *narrative coherence* vs. *ontological status*.

  3.  **Drafting the Essay Question:**
      *   Needs to be clear for intro students but deep enough for the teacher's purpose.
      *   *Prompt:* Contrast the "Age of Discovery" (Lisbon) with the "Silver Century" (Manila). Ask about the necessity of a narrative center. Ask about the ethics of *choosing* vs. *inheriting* a center.
      *   *Constraint:* No "diversity" platitudes. Focus on narrative structure and historical causality.

  4.  **Drafting the Model Answer:**
      *   *Position:* I need to take a side. The prompt asks me to defend the side I can actually defend. The strongest historiographical argument here is that *all* narratives require a standpoint, but the *critical awareness* of that standpoint is what distinguishes good history from bad. Therefore, choosing Manila *is* progress, not because Asia is "better," but because it reveals connections (silver, China demand) that Lisbon obscures, and doing so *consciously* avoids the trap of "naturalizing" the European view.
      *   *Argument Flow:*
          1.  Acknowledge the colleague's critique (swapping centers).
          2.  Reject the idea of "view from nowhere."
          3.  Argue that narrative requires selection/center.
          4.  Distinguish *hegemonic* center (Lisbon as 'discovery') vs. *heuristic* center (Manila as 'node').
          5.  Conclusion: Pedagogical choice is valid if it exposes causality better, not just for representation.
      *   *Word Count:* Keep it tight around 600.

  5.  **Developing the Marking Scheme:**
      *   *A Answer:* Engages with the "view from nowhere" problem. Distinguishes between *causal* importance and *narrative* framing. Explicitly addresses the "chosen vs. inherited" distinction.
      *   *B Answer:* Describes the silver trade well but treats the center swap as purely political/representational. Or argues that "global history means no centers."
      *   *Penalties:*
          1.  *The Relativist Trap:* Claiming "all centers are equal so it doesn't matter." (User's guess 1).
          2.  *The Causation/Narrative Conflation:* Assuming that because Europe drove ships, the story must start there. (User's guess 2).
          3.  *Third Mistake:* Failing to address the *pedagogical* intent. Why are we teaching this? If the answer ignores the classroom context, it misses the prompt.

  6.  **Refining and Polishing:**
      *   *Check against constraints:* Did I avoid "on the one hand"? Yes. Is the model answer committed? Yes. Is the marking scheme specific? Yes.
      *   *Tone Check:* Ensure it sounds like a exam packet for students, but with a marking key for the professor.
      *   *Self-Correction on Model Answer:* Make sure I don't sound *too* Euro-bashing. The argument isn't "Europe bad," it's "Lisbon obscures the Chinese demand side of the equation." The silver didn't move unless China accepted it. That's a causal argument, not just a moral one.

  7.  **Final Review of the "Mistakes":**
      *   User guessed: 1. Relativism ("all valid"), 2. Causation vs. Center.
