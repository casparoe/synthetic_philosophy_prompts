  # JOINT STATEMENT ON INTERPERSONAL AGGREGATION AND THE SEPARATENESS OF PERSONS

  **Date:** October 26, 2023
  **Authors:** [Engineer Name] (Utilitarian Proponent) & [Graduate Student Name] (Contractualist Proponent)
  **Subject:** Adversarial Collaboration on Moral Aggregation

  ## 1. PREAMBLE

  This document records the current state of a year-long dialectical engagement between the authors regarding the permissibility of aggregating costs and benefits across distinct persons. The purpose of this statement is not to resolve the dispute, but to precisely locate the fault lines. We acknowledge that while we share a commitment to impartiality and the moral significance of individual welfare, we diverge on the structural rules for comparing competing claims. This document serves as a specification sheet for our disagreement, intended for circulation and critique within the [Seminar Name] seminar.

  ## 2. AGREED CLAIMS

  *Constraint Note: Per our collaboration agreement, the following claims are asserted only if they are non-vacuous. We assert that these claims are substantive because they exclude specific alternative moral frameworks (e.g., ethical egoism, radical skepticism, or strict deontology that forbids counting even in tie-break cases).*

  1.  **The Relevance of Numbers in Equal-Claim Cases:** In rescue scenarios where all parties face identical harms and hold identical claims to assistance (Evidence Base Case A), we agree that the number of persons affected is a morally relevant factor that can break the tie. We reject the view that one must flip a coin between saving one person and saving five when the claim per person is identical.
  2.  **The Metaphysical Fact of Separateness:** We agree that the "Separateness of Persons" is a metaphysical truth: there is no super-entity that "experiences" the sum of five leg injuries. The disagreement is strictly normative (whether this metaphysical fact forbids summation), not ontological.
  3.  **The Burden of Justification:** We agree that any policy decision requires a justification that could, in principle, be offered to the individuals burdened by that policy. We disagree only on whether a justification citing "net total benefit" is acceptable to a person who bears a catastrophic loss for the sake of others' minor gains.
  4.  **The Decisive Battleground:** We agree that the dispute is not settled by Case A (Equal-Claims), but turns entirely on Case B (Severity Trade). We agree that if aggregation is impermissible, it must be because of the *disparity in severity* between harms, not merely because the harms occur to different people.
  5.  **Rejection of Selfishness:** We agree that the dispute is not between altruism and selfishness. The Utilitarian proponent does not argue for self-interest; the Contractualist proponent does not argue for ignoring the welfare of others. Both seek an impartial method for adjudicating conflicting interests.

  ## 3. DISAGREEMENTS TABLE

  | Issue | Contractualist Formulation (Graduate Student) | Utilitarian Formulation (Engineer) |
  | :--- | :--- | :--- |
  | **1. The Unit of Moral Accounting** | Moral reasoning compares the strength of *individual claims* against one another. A claim cannot be overridden by the sum of weaker claims from others, because no single person bears the sum. | Moral reasoning compares *states of affairs*. The moral value of an outcome is a function of the total welfare within it, regardless of how that welfare is distributed across distinct biological organisms. |
  | **2. The Voting Analogy** | Voting is a procedural convention for legitimacy, not a truth-tracking mechanism for moral value. Counting heads determines *authority*, not *goodness*. | Voting is a pragmatic instantiation of aggregation. If counting heads is rational for collective choice, it is because the *reason* for collective choice is to maximize satisfaction of preferences across the group. |
  | **3. Lexical Priority vs. Continuity** | Certain harms (e.g., death) are lexically superior to others (e.g., headaches). No quantity of the lesser harm can morally outweigh the greater harm to a single individual. | Harm exists on a continuous scale. Given a large enough multiplier, any quantity of lesser harm will mathematically exceed a fixed greater harm. To deny this is to assert a moral infinity that breaks decision-making. |
  | **4. The Role of Expectation** | Imposing a risk of death on many to save one from certain harm treats the many as mere means. The *ex post* complaint of the one who dies cannot be cancelled by the *ex ante* safety of the others. | Expected value is the only rational tool for decision under uncertainty. If the probability-weighted sum of lives saved is higher, the policy is justified, even if the distribution of outcome is unlucky. |

  ## 4. SHARED EVIDENCE BASE

  We agree that the following three cases constitute the empirical data against which our theories must be tested.

  *   **Case A (Equal-Claims Rescue):** An agent can save either one stranger or five strangers from the same indivisible harm (e.g., death). All are equally distant, and the aid is identical.
      *   *Status:* Consensus (Save the five).
  *   **Case B (Severity Trade):** An agent can prevent one stranger's death OR prevent N strangers from losing the use of a leg (or suffering severe headaches).
      *   *Status:* Dispute. The Utilitarian argues that for sufficiently large N, the legs/headaches outweigh the death. The Contractualist argues that no N suffices.
  *   **Case C (Spread-Risk):** A policy imposes a 1/N probability of death on N people to save one specific person from certain death. (Mathematically equivalent to Case B in expected value).
      *   *Status:* Dispute. The Utilitarian sees this as Case B in probabilistic clothing. The Contractualist sees this as distinct, because the *ex post* reality involves a specific corpse who can complain they were sacrificed.

  ## 5. CRUXES AND PREDICTIONS

  We have identified two underlying theoretical cruxes. For each, we specify an argument/case that bears on it and record our divergent predictions regarding what examining that case will reveal.

  **Crux 1: The "Within-Life" Constraint**
  *   *Hypothesis:* The Contractualist holds that "better than/worse than" comparisons are only coherent within a single life. The Utilitarian holds they are coherent across lives.
  *   *Test Case:* **The Single-Person Iteration.** Imagine one person who will live 1,000 sequential lives. In Option 1, they die in life #1. In Option 2, they lose a leg in lives #1 through #500.
  *   *Contractualist Prediction:** Examining this will show that even *within* a single life, there are thresholds where a death outweighs repeated leg losses. Therefore, the objection to aggregation is not about "separateness" but about *lexical value*.
  *   *Utilitarian Prediction:** Examining this will show that the subject would rationally trade the leg losses to avoid death, but if the leg losses are spread over enough lives (or enough people), the sum eventually outweighs the death. The "within-life" constraint is a psychological bias, not a moral boundary.

  **Crux 2: Personal vs. Legislative Standpoint**
  *   *Hypothesis:* The dispute is about whether we are deciding "What may *I* do?" (Personal) or "What rules should *we* adopt?" (Legislative).
  *   *Test Case:* **The Veil of Ignorance Insurance Market.** Behind a veil of ignorance, knowing you will be one of the N people but not which one, would you purchase insurance against the death or the leg loss?
  *   *Contractualist Prediction:** This test is irrelevant to morality. Morality is about what we owe each other *knowing* we are distinct, not about hypothetical self-interest. The "insurance" model reduces morality to prudence.
  *   *Utilitarian Prediction:** This test reveals that rational agents *would* aggregate risks. If the Legislative standpoint (Veil) demands aggregation, and the Personal standpoint forbids it, the Personal standpoint is irrational. The disagreement is about which standpoint is fundamental.

  ## 6. DRAFTER'S ASSESSMENT

  *Per the collaboration agreement, the drafter (Engineer) provides the following independent analysis regarding the nature of the dispute and the validity of Section 1.*

  **A. Substantive vs. Verbal Disagreement**
  The Graduate Student has suggested that our disagreement is verbal—specifically, that we define "good" differently. My assessment is that this is **incorrect**. The disagreement is **substantive**.

  It is not merely a definition of "good." It is a disagreement about the *logic of justification*.
  *   The Utilitarian view is **teleological**: The right action is the one that produces the best state of affairs. The "state of affairs" is the primitive unit.
  *   The Contractualist view is **deontological**: The right action is the one that no one could reasonably reject. The "individual reason" is the primitive unit.

  These are incompatible structural constraints. If the Student is right, there are actions that produce the "best state of affairs" that are nonetheless morally forbidden. If I am right, there are "individual reasons" that are morally overridden by sufficient aggregate weight. This is not a semantic dispute about the word "good"; it is a structural dispute about whether morality is a maximization function or a veto system.

  **B. Vacuity Check on Agreed Claims**
  I have reviewed Section 1 (Agreed Claims) against the requirement that it must not be vacuous.
  *   **Verdict:** The claims are **non-vacuous**, but they are **unstable**.
  *   **Reasoning:** Claim 1 (Equal-Claims Rescue) is the weak point. While standard Scanlonian contractualism allows numbers to break ties in identical cases, a stricter deontological reading might reject even that (arguing for a lottery). We have signed Claim 1 only because the Graduate Student's specific contractualist framework (Scanlonian) permits it. However, this agreement is fragile. If the Student's position shifts toward a stricter rights-based view, Claim 1 collapses.
  *   **Implication:** The fact that our strongest agreement relies on a specific sub-variant of contractualism suggests that "Utilitarian" and "Contractualist" cannot share a spec sheet at the highest level of abstraction. We can only share a spec sheet if we agree to treat Case A as a "safe zone" and Case B as the "war zone."

  **Conclusion:** We are not arguing about words. We are arguing about whether morality has a "stop button" (individual rights) that overrides the "sum counter" (aggregate welfare). We have successfully specified the disagreement, but we must acknowledge that the "Agreed Claims" section functions only as a temporary ceasefire, not a foundational unity.

  ***

  **Signed,**

  _________________________
  [Engineer Name]

  _________________________
  [Graduate Student Name]
