      *(Self-Correction during drafting)*: On Q1, I need to be careful. Contractualism is often seen as a rival to consequentialism. If the ceiling is grounded in "reasonable rejectability," is that Agent-Protective? It protects the agent from being used. It fits broadly under "Agent-Protective" if defined as "grounds appealing to the agent's status/claims." But the user defined Agent-Protective as "projects, integrity, life as her own." Contractualism is more about *status*. I should point out this definitional gap.

