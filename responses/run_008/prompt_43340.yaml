  Here is an analysis of the competing rules, their predictions, and the specific pressure points in her view.

  ### Two Competing Principles

  To fit Nadia's record equally well, we must distinguish between the **unit of moral concern** (who counts?) and the **unit of rescue** (what is being chosen?).

  **Rule 1: The "Equal Chance Per Group" (ECPG) Principle.**
  *   **Core Idea:** Moral choice is a choice between *rescue options*. When options are mutually exclusive, each distinct option deserves equal weight, regardless of how many people are in that option. Aggregating claims within a group is forbidden because it treats the group as a "super-person."
  *   **Fit with Record:** This perfectly explains her 5v1 and 2v1 lotteries (two options = 50/50 chance). It explains the 90s vs. 10y case (quality of life doesn't change the *option* count). It accommodates the Friend case as a "Special Option" that trumps the standard set of options due to partiality.
  *   **Implication for Tickets:** In Case A, every *group* holds one ticket.

  **Rule 2: The "Equal Chance Per Person" (ECPP) Principle.**
  *   **Core Idea:** Moral choice is a choice between *fates of individuals*. Every individual deserves an equal ex-ante probability of survival.
  *   **Fit with Record:** This fits her remark that "the lone person should not come off worse merely for having no companions" better than ECPG does (in a 5v1 lottery, the lone person has a 50% chance, while each of the five has only a 10% chance; ECPP would give everyone 1/6). However, to fit her *verdict* (5v1 Lottery), this rule must include a **"Clumping Proviso"**: when individuals are clustered such that saving one necessitates saving all, we treat the cluster as a single unit *for administrative simplicity*, unless the numbers become morally overwhelming.
