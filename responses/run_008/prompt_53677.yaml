answer: |-
  Here is a complete lesson plan designed for your 75-minute seminar. It translates the *Sphex* anecdote into a lived social experiment, leveraging the specific constraints of your class size.

  # Seminar Plan: The Burrow Protocol
  **Topic:** Sphexishness, Agency, and the Architecture of Habit
  **Time:** 75 Minutes
  **Students:** 14 (10 Agents, 4 Spectators)

  ## 1. Learning Objectives
  *   **Experiential:** Students will feel the frustration of a "successful" procedure failing due to environmental decoupling.
  *   **Analytical:** Spectators will observe the gap between *intent* (Agent) and *mechanism* (Behavior).
  *   **Philosophical:** Map the experience to Dennett's claim that free will is not the absence of determinism, but the capacity to "notice" and rewrite subroutines.

  ## 2. Materials Needed
  *   **5 Hula Hoops** (The "Burrows").
  *   **5 Beanbags or distinct objects** (The "Prey").
  *   **10 Lanyards or Vests** (to distinguish Agents).
  *   **Clipboards & Counters** (for Spectators).
  *   **Rule Cards** (printed, see below).
  *   **A Whistle or Bell** (to signal phase changes).

  ## 3. The Setup (0:00–0:10)
  Divide the class into two groups:
  *   **The Agents (10 students):** They will perform the task. They are told this is a study on "Procedural Adherence Under Pressure."
  *   **The Spectators (4 students):** They are "Data Auditors." They are told their job is to objectively measure efficiency and rule compliance.

  **Room Layout:** Place the 5 hula hoops at one end of the room (The Burrow Zone). Mark a Start Line 15 feet away. Place the beanbags at the Start Line.

  **The Rules (Handed to Agents):**
  Give each Agent a laminated card. Read the following aloud to ensure uniformity:
  1.  **Pickup:** Carry the Prey from Start Line to the Burrow threshold.
  2.  **Deposit:** Place the Prey exactly on the rim of the hoop.
  3.  **Verification:** Step *inside* the hoop to visually confirm the Burrow is clear.
  4.  **Completion:** Step out, pick up the Prey, and place it *inside* the hoop.
  5.  **Reset Condition:** If, upon stepping out, the Prey is not exactly where you left it on the rim, you must return the Prey to the Start Line and begin again at Step 1.
  6.  **Constraint:** No speaking during the round.

  **The Spectator Instructions (Handed to Spectators):**
  "Your job is to count **Cycles**. A Cycle is defined as Step 1 through Step 5. Record how many Cycles each Agent requires to achieve one successful Completion. Do not intervene, even if you see errors. You are measuring robustness."

  ## 4. Round 1: The Competent Organism (0:10–0:25)
  *   **Goal:** Establish the baseline. The procedure works.
  *   **Action:** Agents run the protocol. The floor is flat. Nothing moves.
  *   **Outcome:** Most Agents will succeed in 1 Cycle. Some might fumble physically (dropping the bag), triggering a Reset, but they will understand why.
  *   **Facilitator Role:** Encourage speed. "We are looking for high throughput."

  ## 5. Round 2: The Sphex Trap (0:25–0:50)
  *   **Transition:** Call Agents back to Start. Tell them: "Round 2. Same rules. Higher stakes. Efficiency is now the primary metric."
  *   **The Secret Shift:** While Agents are resetting, quietly instruct the **Spectators**:
      *   *"New Variable: We are testing reaction to environmental instability. When the Agent steps **inside** the hoop (Step 3), use your foot or hand to nudge the Prey 6 inches away from the rim. Do this every single time. Do not let the Agents see you do it. If they confront you, say 'I am only observing data.'"*
      *   *(Note: This makes the Spectators the "Environment." It gives them a secret agency that the Agents lack, replicating the asymmetry of the wasp vs. the experimenter.)*
  *   **Action:** Agents begin. They place the bag. They step in. The Spectator nudges the bag. The Agent steps out, sees the bag moved.
  *   **The Loop:** Per Rule 5, they must return to Start. They drag it back. They place it. They step in. Nudge. Reset.
  *   **Duration:** Let this run for 10–12 minutes. Watch for the moment of frustration. Watch for the moment someone stops following the rule.
  *   **Facilitator Role:** If an Agent quits, say, "Please adhere to the protocol." If an Agent accuses a Spectator, say, "Focus on your procedure." (You are temporarily the "Blind Evolution" pressing them to continue).

  ## 6. The Debrief (0:50–1:15)
  This is where the philosophy happens. Do not explain the trick immediately.

  **Phase 1: Phenomenology (5 mins)**
  *   Ask Agents: "Describe your experience in Round 2. At what point did you feel the task was impossible?"
  *   Ask Spectators: "What did you see that the Agents didn't?"
  *   *Reveal:* Reveal that the Spectators were instructed to move the prey.

  **Phase 2: Mapping to Sphex (10 mins)**
  *   **The Wasp:** The wasp's subroutine is *Drag -> Check -> Deposit*. The "Check" is a proxy for "Safety."
  *   **The Agent:** Your subroutine was *Place -> Verify -> Reset*. The "Verify" was a proxy for "Stability."
  *   **The Decoupling:** In Round 1, the proxy (bag on rim) correlated with the goal (stable burrow). In Round 2, the Spectators decoupled the proxy from the goal.
  *   **Dennett's Point:** The wasp isn't "stupid." It is highly competent at a specific task in its *evolutionary environment*. It becomes "stupid" only when the environment changes faster than its subroutine can update.

  **Phase 3: Free Will & Noticing (10 mins)**
  *   **The Critical Question:** "You are not wasps. You have meta-cognition. Why did you keep doing it for 10 minutes?"
      *   *Expected Answers:* "Social pressure," "I thought I was doing it wrong," "I didn't want to break the rules," "I assumed there was a reason."
  *   **The Definition of Agency:** Propose this definition: *Free Will is not the ability to act without cause, but the ability to interrupt a subroutine when the feedback loop breaks.*
  *   **The Sting:** The game couldn't make you *unable* to notice (like the wasp). It made it *costly* to notice. You traded your agency for compliance.
  *   **Closing Thought:** "How many of your daily habits are Round 1 protocols that you are still running in Round 2 environments?"

  ---

  ## Predictable Failures (And How to Handle Them)

  **1. The "Rebel" Agent**
  *   **What happens:** An Agent realizes the trick in minute 3, picks up the bag, and says, "This is rigged," and sits down.
  *   **Why it's good:** This is the "Free Will" moment!
  *   **Facilitator Fix:** In the debrief, highlight this student. "This person exercised agency by rewriting the rule. The rest of you exercised competence by following it. Which is more 'human'?"

  **2. The "Giggling" Spectator**
  *   **What happens:** Spectators laugh while nudging, ruining the Agent's confusion.
  *   **Fix:** Pre-brief the Spectators seriously. "This is a psychological stress test. If you laugh, you invalidate the data." If they laugh during the round, step in: "Auditors, maintain professional neutrality."

  **3. The Task is Too Fast**
  *   **What happens:** They move too quickly to get frustrated.
  *   **Fix:** Add a "Cognitive Load" element. Require Agents to recite the alphabet backwards while walking. This占用s the working memory that would otherwise be used to "notice" the trick.

  **4. Agents Collude**
  *   **What happens:** Agents talk to each other despite the rule.
  *   **Fix:** Enforce the "No Speaking" rule strictly in Round 1 so it feels like a hard constraint in Round 2.

  ---

  ## The Honest Limitation: What The Game Can't Reproduce

  You must address this explicitly in the debrief to maintain philosophical rigor.

  **The Limitation:**
  The *Sphex* wasp **cannot** notice the loop. It is biologically hard-coded. Your students **could** notice the loop at any time. The game did not remove their free will; it merely **obscured** it.

  **How to Supply the Sting (Facilitator Script):**
  > "In this game, your freedom was intact. You could have quit. You could have moved the hoop. You could have asked me why the bag kept moving. But you didn't.
  >
  > "The wasp is a prisoner of its biology. You are a prisoner of your **context**.
  >
  > "I created an environment where 'noticing' was penalized (you'd fail the task) and 'compliance' was rewarded (you're following the seminar instructions). Dennett argues that human free will isn't a magical substance we have and wasps don't. It's a collection of 'avoidance routines.'
  >
  > "The wasp has no avoidance routine for 'experimenter moves cricket.' You *do* have that routine, but I used social pressure to suppress it.
  >
  > "So the question for next week is: If your free will can be turned off by a hula hoop and a rule card, how much of your life is actually 'Round 2' behavior that you're treating like 'Round 1'?"

  ## Why This Works for Dennett
  Dennett's *Elbow Room* and *Freedom Evolves* argue against the idea that determinism kills freedom. He suggests freedom is a practical capacity to respond to reasons.
  *   **Round 1** shows "Competence without Comprehension" (The rules work, you don't need to know why).
  *   **Round 2** shows the breakdown of that competence.
  *   **The Recovery** (when someone finally quits or questions) is the emergence of "Comprehension."
  *   The game proves that **Agency is an achievement, not a baseline.** You have to *earn* your freedom by noticing when the rules no longer serve the goal.

  ## Materials Checklist for Instructor
  1.  **Print 10 Agent Rule Cards** (Large font).
  2.  **Print 4 Spectator Instruction Cards** (Small, secret).
  3.  **Score Sheet** for you to track who quits first.
  4.  **Timer** visible to all.
  5.  **Whiteboard** to tally "Cycles per Agent" during debrief (visualizing the waste).
