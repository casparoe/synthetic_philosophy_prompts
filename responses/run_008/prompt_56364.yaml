  *(Self-Correction on "Load-Bearing")*: The user said "load-bearing for the QUESTION." I need to show that "Question" is too vague. It must be "Question + Intervention."

  *(Self-Correction on Traffic)*: If the traffic model predicts well *without* rerouting, it implies rerouting isn't happening *in that data*. But if the model is used for policy, it fails. This confirms the Counterfactual point.

