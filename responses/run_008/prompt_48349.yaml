answer: |-
  **The Border of the Ballot: Who Belongs to the People?**

  Democracy is often described as rule by the people. It is a stirring phrase, but it contains a silent, destabilizing question: *Which* people? Before a vote can be cast, a boundary must be drawn. There must be a decision about who is entitled to stand inside the polling station and who must remain outside. In political theory, this is known as the boundary problem. It is the foundational paradox of self-rule: the people cannot democratically decide who constitutes the people, because they must already exist as a people to make that decision.

  As we confront challenges that defy national borders and temporal limits, this abstract puzzle has become a practical crisis. Consider three scenarios that are no longer speculative. First, a coastal town is offered vast wealth to host a nuclear waste repository. The hazards will persist for one hundred thousand years. Legally, the current voters decide. Morally, none of the people most affected by the radiation are alive to cast a ballot. Second, a consortium of thirty governments negotiates a permit for solar geoengineering. The technology could stabilize the climate, but its side effects would rain down on every human being, with the heaviest burden falling on nations with no seat at the table. Third, a regional water utility is sold to a foreign private consortium. The new owners set prices and cutoff policies that residents cannot change, cannot escape, and did not elect.

  These cases press against the two dominant solutions to the boundary problem. The first is the **All-Affected Principle**. It holds that everyone whose interests are affected by a decision should have a say in making it. It is intuitive and morally capacious. If a decision changes your life, you should have a hand in shaping it. The second is the **All-Subjected Principle**. It holds that everyone subject to a decision's binding authority should have a say. This is a narrower, structural claim. It focuses not on the ripple effects of a policy, but on the coercive power behind it. If you are forced to obey, you should have a voice.

  Both principles offer clarity, yet both fracture when pressed against the weight of the real world. To find a workable theory of democracy, we must stress-test them against the regress problem, a provocative thought experiment regarding time, and the hard reality of private power.

  The All-Affected Principle is the more seductive of the two. It promises a democracy that matches the scale of our interdependence. However, it suffers from a logical flaw known as the regress problem. To determine who is affected by a decision, we must first know what the decision is. But the outcome of the decision depends on who is allowed to vote. If we enfranchise everyone potentially affected, the electorate changes, which changes the outcome, which changes who is affected.

  This circularity is not merely academic; it is an invitation to manipulation. Because "interests" are fluid, the boundary of the demos becomes gerrymanderable. A demagogue can argue that a policy will affect only a narrow group to exclude opponents, or that it will affect the whole world to dilute local opposition. If the boundary of the community shifts with every ballot measure, there is no stable community to govern. Democracy requires a stable "we" to function; the All-Affected Principle dissolves that "we" into a shifting cloud of consequences.

  The All-Subjected Principle avoids this circularity by anchoring the boundary in law and coercion. You belong to the demos if you are subject to the state's coercive authority. This provides a clear line: citizenship, residency, jurisdiction. Yet, as our three cases show, clarity does not guarantee justice.

  In the case of the nuclear repository, the All-Subjected Principle yields a horrifying result. The future generations who will live with the waste are not subject to the current town's authority—they do not exist. The current voters are subject to the economic benefits and the immediate safety regulations, so they decide. The principle protects the integrity of the current political community but licenses it to mortgage the future. Conversely, the All-Affected Principle demands the impossible: enfranchising the unborn. Since they cannot vote, the principle suggests the decision is illegitimate. It identifies the moral crime but offers no procedural remedy.

  The geoengineering case highlights the mismatch between political boundaries and physical reality. Under the All-Subjected Principle, only the citizens of the thirty negotiating states have a claim. The populations of the Global South, who may suffer droughts or floods due to the atmospheric manipulation, are excluded because they are not subjects of the deciding governments. The All-Affected Principle correctly identifies this injustice, demanding a global demos. But a global vote is logistically impossible and politically nonexistent. Here, the All-Affected Principle demands a democracy that cannot be built, while the All-Subjected Principle legitimizes a tyranny of the few over the many.

  The water utility case reveals a different tension. Here, residents are subject to the authority of a private consortium. They face coercion—pay or lose water—but they have no political recourse. The All-Subjected Principle suggests these residents *should* have a vote. But the consortium is private, not public. This exposes a blind spot in traditional democratic theory: we assume subjection comes only from the state. If a private entity wields power equivalent to sovereignty, the All-Subjected Principle implies that democracy is missing a step. Either the utility must be brought under public control so the subjection becomes political, or the residents are living under a form of private government that democracy has failed to tame.

  To probe deeper into our intuitions about these principles, consider a device proposed to bridge the gap between the present and the future: **duration-weighted suffrage**. Under this scheme, a voter's weight on a specific issue is proportional to the share of their expected lifetime they will spend living under the decision's consequences. On a issue regarding pension reform, the elderly might carry more weight. On a issue regarding nuclear waste or climate debt, the young would carry vastly more weight than the old, and the unborn might be represented by proxies weighted for a full lifespan.

  This proposal is rarely endorsed as policy, but it serves as a powerful diagnostic. Why does it feel monstrous to most of us? It violates the foundational democratic norm of "one person, one vote." We believe that political equality is a status, not a calculation of stake. If we accept duration-weighting, we admit that democracy is not about equal respect among citizens, but about calibrating influence to match vulnerability.

  Yet, if we reject it, we must admit that our commitment to political equality outweighs our commitment to the All-Affected Principle. We prefer a system where a 90-year-old has the same vote as a 10-year-old on a 100-year bond, even though the child is infinitely more affected. This reveals that when we do democracy, we are prioritizing the equality of the *current* community over the accuracy of the *outcome's* justice. We value the stability of the demos over the perfect matching of interest. The visceral rejection of duration-weighting suggests that deep down, we subscribe to the All-Subjected Principle. We believe the right to vote belongs to those who are currently members of the political order, equal in status, regardless of how much the decision will hurt or help them personally.

  However, accepting the All-Subjected Principle as the winner requires us to confront its limitations honestly. It is a principle of legitimacy, not necessarily of justice. It tells us when a decision is democratically valid, not when it is morally right. This distinction allows us to reach a verdict.

  The All-Affected Principle must be rejected as a rule for drawing the boundaries of the *demos*. It is logically unstable and operationally impossible. A democracy that redraws its borders with every issue is not a democracy; it is a plebiscite without a people. We cannot vote on who votes without already having a defined community. Therefore, the All-Subjected Principle is the only viable constitutive rule for democratic politics. It anchors the right to vote in the reality of coercive authority. If you are bound by the law, you must make the law.

  But this verdict comes with a crucial caveat. The All-Subjected Principle works only if we take "subjection" seriously. In the case of the water utility, if a private consortium wields coercive power over life essentials, it is functioning as a government. The democratic verdict here is not to give the residents votes in the consortium's boardroom, but to assert that such power must be public. To make the subjection democratic, the authority must be brought within the state's constitutional framework. The solution to private tyranny is not to democratize the corporation, but to re-politicize the utility.

  For the intergenerational and global cases, the verdict is harder. The All-Subjected Principle admits that future people cannot vote, and foreign populations are not subjects of our state. Does this mean we are free to poison the future or the globe? No. It means that democracy is not the only tool we have. The All-Affected intuition is correct as a moral claim, even if it fails as a voting rule. Because we cannot enfranchise the future, we must bind the present.

  This leads to a specific modification of the verdict: The All-Subjected Principle defines the *voting* community, but the All-Affected intuition must define the *limits* of that community's power. We protect the unborn and the foreign not by giving them votes—which dissolves the demos—but by removing certain decisions from the reach of simple majorities. Nuclear waste storage should not be decided by a local vote, but by constitutional constraints or trusteeship bodies mandated to represent the future. Geoengineering should not be decided by national interest, but by international treaties that function as rights-protecting regimes.

  In short, we must stop trying to solve moral problems with voting machinery. The boundary of the vote must remain fixed on those subject to the law, preserving the equality and stability of the citizenry. But the scope of what that citizenry is allowed to do must be constrained by the recognition of those they affect but do not rule.

  This is a humbler vision of democracy. It admits that the ballot box cannot solve every injustice. It cannot give voice to the silent future or the distant stranger. But it can ensure that those who hold the leash of power are the ones who must feel its bite. By anchoring the vote in subjection, we ensure that power remains accountable to a specific, identifiable people. By anchoring rights in affectedness, we ensure that people do not use that power to destroy the world they will leave behind. The boundary of the demos must be hard, so that the duties of the demos can be clear. We vote as subjects, but we govern as trustees.
