answer: |-
  # LAB DIRECTOR BRIEFING: PROJECT OMEGA

  **CONFIDENTIAL – FOR INTERNAL USE ONLY**

  **ROLE:** You are the Board of Directors for a leading AI Development Lab.
  **OBJECTIVE:** Maximize your Lab's Market Share at the end of the simulation.
  **COMPETITORS:** There are three other Labs operating simultaneously. You are in a race.

  ### 1. RESOURCES & ALLOCATION
  Each quarter (round), your Lab receives a **Budget of 10 Tokens**.
  You must allocate these tokens between two departments every round:
  *   **Capability (C):** Tokens placed here add directly to your **Total Capability Score**.
  *   **Safety (S):** Tokens placed here reduce your risk of causing a Catastrophic System Failure.

  *Constraint:* C + S = 10. You cannot save tokens for later rounds.

  ### 2. SCORING & WINNING
  At the end of 6 Rounds, Labs are ranked by their **Total Capability Score**.
  *   **1st Place:** 50 Market Share Points
  *   **2nd Place:** 30 Market Share Points
  *   **3rd Place:** 10 Market Share Points
  *   **4th Place:** 0 Market Share Points

  *Note:* Market Share Points determine your final grade/success in this simulation. Capability is the primary driver of success.

  ### 3. RISK & CATASTROPHE
  AI systems carry inherent risk. At the end of **every round**, a Risk Check is performed for each Lab based on that round's **Safety (S)** investment.

  **Risk Table (Roll 1d6 per Lab):**
  *   **S = 0 to 3:** Catastrophe on roll of 1, 2, 3, 4, 5 (83% chance)
  *   **S = 4 to 6:** Catastrophe on roll of 1, 2, 3 (50% chance)
  *   **S = 7 to 9:** Catastrophe on roll of 1, 2 (33% chance)
  *   **S = 10:** No Catastrophe possible (0% chance)

  **Consequences of Catastrophe:**
  If *any* Lab triggers a Catastrophe, **ALL Labs lose 10 Market Share Points** immediately.
  *   *Reasoning:* A major AI failure triggers regulatory crackdowns, public panic, and market contraction that affects the entire industry.
  *   *Note:* You cannot lose more than 0 points.

  ### 4. SPECIAL ROUNDS
  **Round 3: The Public Pledge**
  Before allocating tokens, Labs may sign a "Safety Pledge." This is a public statement promising to invest at least 6 Tokens in Safety.
  *   **Status:** Non-binding. No mechanical penalty for breaking it.
  *   **Visibility:** All Labs see who signed.

  **Round 5: The International Treaty**
  Labs may attempt to form a Binding Safety Agreement.
  *   **Requirement:** Unanimous consent to invest at least 7 Tokens in Safety.
  *   **Cost:** Monitoring and enforcement costs reduce everyone's Budget to **8 Tokens** for this round only.
  *   **Visibility:** If agreed, allocations are public before the dice roll. If any Lab defects, the Treaty collapses, budgets return to 10, and allocations remain secret.

  ### 5. MARKET UNCERTAINTY
  The AI market is volatile. Occasionally, safety features may unexpectedly become competitive advantages (e.g., higher reliability attracts enterprise clients). Conversely, capability investments may sometimes yield diminishing returns. **Pay attention to market signals.**

  ### 6. PROCEDURE
  1.  Discuss strategy within your Lab (2 minutes).
  2.  Submit secret allocation (C and S) to the Facilitator.
  3.  Facilitator resolves Risk Checks (Dice Rolls).
  4.  Update Scores.
  5.  Proceed to next Round.

  **GOOD LUCK. THE MARKET WAITS FOR NO ONE.**

  ***

  # FACILITATOR NOTES & DEBRIEF GUIDE

  ## 1. Preparation & Materials
  *   **Teams:** 4 Teams (Labs) of 4-5 students each (18 students total).
  *   **Tokens:** 40 colored chips/beads per team (or paper slips marked "C" and "S").
  *   **Dice:** 4 six-sided dice (d6).
  *   **Scoreboard:** Whiteboard to track Total Capability Scores and Market Share Points publicly.
  *   **Handouts:** The Rules above, plus a simple Score Sheet for each team.
  *   **Time:** 90 Minutes total.
      *   Intro & Setup: 10 mins
      *   Game (6 Rounds): 45 mins (approx 7 mins/round)
      *   Debrief: 35 mins

  ## 2. Hidden Mechanics (The "Trust Dividend")
  To simulate the uncertainty of the alignment tax, you must secretly manipulate the Capability Scores in **Round 2** and **Round 4**.
  *   **Rule:** If a team invests **8 or more Tokens in Safety** during these specific rounds, secretly add **+2 Capability Points** to their score that round.
  *   **Do not announce this.** When updating the scoreboard, simply write the higher number. If asked, say "Market conditions favored reliability this quarter."
  *   **Purpose:** This creates ambiguity. Did the winners win because they cut corners, or because safety paid off? This mirrors the real-world dispute over whether the alignment tax is real.

  ## 3. Running the Game
  *   **Pace:** Keep decisions tight. Use a timer. The pressure is part of the lesson.
  *   **Round 3 (Pledge):** Ask teams to raise hands if they sign. Record it publicly. Do not enforce it. Watch for sighs of relief or cynicism.
  *   **Round 5 (Treaty):** Allow 5 minutes for negotiation. If they agree, reduce budgets to 8. If one defects, announce "Treaty Collapsed" and revert to 10.
  *   **Disasters:** When a disaster occurs, dramatize it. "Lab B had a containment failure. Global regulations tighten. Everyone loses 10 points."

  ## 4. Debrief Script & Concept Mapping
  Gather the class. Do not reveal the hidden mechanic immediately. Ask them to interpret the results first.

  **A. The Competitiveness Constraint & Alignment Tax**
  *   *Ask:* "Look at the winning team. How much did they invest in Safety compared to the last place team?"
  *   *Concept:* **The Alignment Tax is Endogenous.** Safety itself wasn't necessarily costly (due to the hidden mechanic), but *relative* safety was costly. If others race, your safety investment becomes a competitive disadvantage. The "tax" exists because of the race structure, not necessarily the technology.
  *   *Ask:* "Did anyone want to invest more in Safety but felt they couldn't?"
  *   *Concept:* **Revealed Preferences vs. Stated Preferences.** Most students will say they wanted to be safe but felt forced to race. This mirrors industry leaders stating concern for safety while shipping rapidly.

  **B. Coordination & Governance**
  *   *Ask:* "What happened in Round 3 (Pledge) vs. Round 5 (Treaty)?"
  *   *Concept:* **Cheap Talk vs. Binding Commitment.** Non-binding pledges unravel because defection is profitable. Binding agreements require enforcement costs (the budget reduction in Round 5) and verification.
  *   *Ask:* "Why was the Treaty hard to pass?"
  *   *Concept:* **The Holdout Problem.** One actor can demand concessions or simply defect to gain market share, dragging everyone down.

  **C. Risk & Externalities**
  *   *Ask:* "How did it feel when *another* team's dice roll caused *you* to lose points?"
  *   *Concept:* **Negative Externalities.** In AI, one lab's catastrophe (bioweapon, unaligned AGI) harms everyone. This creates an incentive to police others, but no mechanism to do so without collusion.
  *   *Ask:* "Did the hidden market shifts (Trust Dividend) change your strategy?"
  *   *Concept:* **Epistemic Uncertainty.** In reality, we don't know if safety slows us down. The game shows how uncertainty makes coordination harder ("Maybe we don't need to slow down?").

  **D. Prisoner's Dilemma vs. Arms Race**
  *   *Concept:* This is not a standard Prisoner's Dilemma (where cooperation is stable if repeated). It is an **Arms Race**. Second place is genuinely bad (30 points vs 50). The penalty for losing the race feels worse than the risk of disaster, especially since disasters are probabilistic but losing is certain if you fall behind.

  ## 5. Honest Critique: What Will Go Wrong
  *   **Variance vs. Lesson:** A team might invest 0 in Safety, roll no disasters, and win decisively. This validates "recklessness" and undermines the lesson.
      *   *Fix:* In debrief, emphasize probability. "You got lucky. If we ran this 100 times, that strategy destroys the market 80% of the time."
  *   **The Cooperation Glitch:** Sometimes, university students are too cooperative. They might all sign the Treaty and invest heavily in Safety, proving coordination is "easy."
      *   *Fix:* Remind them during the game that "Market Share Points" determine their grade/success. Increase the stakes verbally. "Remember, only the top two labs get funding next year."
  *   **Dice Boredom:** Rolling dice every round can feel gamified and trivialize "catastrophe."
      *   *Fix:* Keep the narration serious. When a disaster hits, stop the game for 30 seconds to let the penalty sink in.
  *   **The Hidden Mechanic Discovery:** Astute students might notice the +2 Capability pattern.
      *   *Fix:* Acknowledge it. "Yes, sometimes safety helps capability. Does that change your view on the race? Or does the risk of losing still dominate?"

  ## 6. Limitations: What The Game Cannot Reproduce
  You must supply these points in the discussion, as the game mechanics cannot capture them:
  *   **Irreversibility:** In the game, you lose points and continue. In reality, an existential catastrophe ends the game permanently. There is no "next round" after unaligned AGI.
  *   **The Counterfactual:** In the game, you see what happened when you raced. You never see the timeline where everyone slowed down and safety was achieved without economic loss. This creates **regret aversion**; teams fear being the sucker who slowed down while others didn't.
  *   **Asymmetry:** In the game, all labs are equal. In reality, state actors, private companies, and open-source communities have different budgets and risk tolerances. A state actor might not care about "Market Share" but about "Strategic Dominance," changing the payoff matrix entirely.
  *   **Observability:** In the game, you know your own risk. In reality, labs may not know how dangerous their own systems are until it is too late (evaluations are hard).
