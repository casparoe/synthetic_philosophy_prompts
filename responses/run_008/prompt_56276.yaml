prompt: |-
  So this is a bit embarrassing, but my neurologist has me keeping a symptom diary. I get this recurring weird sensation — hard to describe to anyone, I basically just note it down when it happens, "same as Tuesday, worse in the evening." And mid-week it hit me that I'm basically the person in Philosophical Investigations §258, the one who keeps a diary and puts the sign S in it whenever a certain sensation recurs, and who can't tell whether the same thing is really happening each time or whether the memory of same is quietly doing all the work. Which, given what Wittgenstein goes on to say about that case, is slightly worrying.

  I've tried to work through the actual remarks but honestly I get lost. My copy is the Anscombe translation. As far as I follow it: he imagines you can't define S in terms of anything public — not, say, the feeling you get when the manometer rises — because if it had a definition like that it would just be a word in our ordinary language, not the genuinely private language he's after. So the idea would be to fix S by attending to the sensation itself, a kind of inward ostensive definition. And then comes the bit I can't get straight in my head, where he says that whatever is going to seem right to him is right, and that this only means that here we can't talk about right.

  What I need help with is what the argument actually is at that point. Is it that memory might betray you — that when you write S on Tuesday you may be misremembering Monday's sensation, so there's no independent check (I've gathered this is called the memory-sceptical reading)? Or is it something stronger: that even with a perfectly reliable memory there is still no difference between your application of S being correct and its merely seeming correct, so there's nothing for correct to mean yet? And if it's the stronger one, why does the missing correctness condition make S not a word at all, rather than just a useless word? Thats the step I keep feeling but can't justify.

  And one thing bugging me in a more personal way: my actual diary obviously isn't a private language. I write it in English, my neurologist reads it, the whole thing is fairly public. So what's the difference supposed to be between my diary and the S-diary — just that my words eventually cash out into public criteria somewhere down the line? Or does Wittgenstein think ordinary sensation words have the same problem in miniature, and the private language is a purified version of something already wrong in all sensation talk? Relatedly: do I actually have any grounds to doubt my Tuesday entries, or does the argument not touch a case like mine at all?

  I'd be grateful if you could walk me through it slowly, section by section, because I'm clearly not going to crack it on my own, and I would genuinely like to know whether my diary is doing what I think its doing.
