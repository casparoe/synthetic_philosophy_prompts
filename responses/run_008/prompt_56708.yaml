answer: |-
  **1. THE SINKER (Economist #1)**
  **Objection:** "You haven't escaped Expected Utility Theory; you've just derived $U(w) = \ln(w)$ from a different axiom. If the behavioral prescription is identical to maximizing expected log utility, claiming it's 'not utility theory' is semantic marketing. Samuelson (1971) already showed this. Why should we care about the justification if the math is isomorphic?"

  **Reply (2 min):**
  "It matters because it changes what we treat as exogenous. In EUT, log utility is a *preference*—a subjective psychological quirk. In the time-average framework, it's a *physical constraint* of non-ergodic dynamics. If it's preference, you can argue people 'should' be risk-neutral if they feel like it. If it's physics, betting against Kelly isn't 'risk-seeking,' it's 'suicide.' This shifts the burden of proof. You don't need to explain why agents *choose* log utility; you need to explain how they survive without it. It also opens the door to non-stationary environments where ensemble averages don't converge, which standard EUT ignores."

  **Soft Spot (BE HONEST):**
  If the math is truly isomorphic, the predictive power is identical. I can't show them a dataset where Kelly works and EUT fails *if* the EUT agent happens to have log utility. I'm arguing for ontological superiority without empirical differentiation. If they press on "revealed preference," I lose—they'll say whatever you choose reveals your utility function, tautologically. I need to pivot to *policy* implications (e.g., regulation) where the distinction matters, but that's outside the betting scope.

  ***

  **2. THE PHILOSOPHER (Axioms)**
  **Objection:** "You're violating the Sure-Thing Principle. If an agent prefers Bet A over Bet B regardless of some unrelated event C, they should prefer A over B even when C is present. Your time-average approach makes preference dependent on the *sequence context* and horizon. That's dynamically inconsistent. How is this rational?"

  **Reply:**
  "Rationality isn't about logical consistency across counterfactual worlds that never exist; it's about persistence in the actual world. The Sure-Thing Principle assumes ensemble averaging—that all branches of the decision tree are equally 'real.' For a single agent, only one path happens. Violating the axiom is a feature, not a bug, because it prevents ruin. We shouldn't bind agents to axioms designed for parallel universes."

  **Soft Spot:**
  "Rationality" is ill-defined here. If I can't define a coherent utility function over outcomes, I can't use standard decision tools. I'm asking them to throw away 70 years of formalism without a fully replacement formalism ready. They'll call it 'ad-hocery.'

  ***

  **3. THE FRIEND'S MOVE (Practitioner/Half-Kelly)**
  **Objection:** "If Kelly is 'default rational' physics, why does every serious practitioner (Thorp, Simons, etc.) use Fractional Kelly? You say 'external circumstances,' but that sounds like 'my theory is right, reality is wrong.' Isn't fractional Kelly just revealed risk aversion?"

  **Reply:**
  "No. Fractional Kelly isn't about utility curvature; it's about parameter uncertainty and drawdown constraints. Full Kelly assumes you know the edge exactly. In reality, you're estimating. Overestimating edge leads to ruin. Half-Kelly is a robustness correction for model error, not a risk preference. Also, leverage constraints and liquidity are external hard limits, not internal preferences. It's engineering, not psychology."

  **Soft Spot:**
  Hard to distinguish 'model error' from 'risk aversion' empirically. If someone *chooses* to run a model that outputs half-Kelly, isn't that their utility function? I need to be careful not to define 'external circumstances' so broadly it covers everything.

  ***

  **4. THE STATISTICIAN (Falsifiability)**
  **Objection:** "How do you test this? We only observe one history. You can't compare the time-average growth of one agent to the ensemble average of infinite copies. It's metaphysical. Where's the data?"

  **Reply:**
  "We look at survival rates. Ensemble theory suggests many agents should survive large bets if the expectation is positive. Time-average theory predicts almost all individual agents go to zero if they bet too big. Look at trader longevity or firm survival rates in high-leverage sectors. The distribution of wealth over time should match the time-average prediction, not the ensemble."

  **Soft Spot:**
  Selection bias. We only observe the survivors. The ones who went bust are gone. Hard to get clean data on the 'dead' agents to prove they violated Kelly. Also, markets change, so 'infinite time' assumptions are never met.

  ***

  **5. THE NIGHTMARE QUESTION (Quiet Hope)**
  **Q:** "You keep saying 'infinite time' or 'long sequence.' But agents die. Funds close. Horizons are finite. If the horizon is shorter than the convergence time of the log-optimal path, Kelly isn't optimal. So what is the 'default' then? If it depends on the horizon, isn't it just utility again?"

  **Reply:**
  "The 'default' is the limit as horizon goes to infinity. For finite horizons, you adjust, but the *direction* of the adjustment comes from the time-average benchmark. You don't start from risk-neutrality and add risk aversion; you start from Kelly and subtract for horizon risk. It's still the anchor."

  **Soft Spot:**
  If the horizon is short enough, Kelly *is* wrong. If most real-world decisions are 'short horizon' relative to volatility, then Kelly isn't the default—it's the exception. This undermines the 'default rationality' claim. I need to define 'long sequence' better (e.g., relative to bet frequency), but if they push on mortality/finite life, I don't have a clean answer besides 'approximation.'
