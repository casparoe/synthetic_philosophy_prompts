  I just spent three hours fighting with my friend about Kelly betting and I'm more convinced than when we started, but also more scared. My view: maximizing expected log wealth isn't just a special case of expected utility theory for people who happen to have log preferences -- it's what any agent facing a long sequence of bets should do by default, because time-average growth rate is the only performance metric that actually describes what happens to one persistent agent, and anything else is an artifact of averaging across ensemble copies who never exist. Fractional Kelly is a concession to external circumstances, not a coherent risk preference. I'm presenting basically this at a decision theory reading group next week and the room is bad for me: two economists who think the whole time-average vs ensemble-average thing is just log utility with new marketing, one philosopher who treats the expected utility axioms like scripture and will come at me with the sure-thing principle, and a statistician who mostly cares about whether my claims are even falsifiable. Draft my prep sheet: the objections this exact room will raise, ordered by how much damage they'd do, each phrased the way that person would actually say it, with a two-minute reply and a note on where the reply is soft. My friend's favorite move was "if you're so sure Kelly is default-rational, why does basically every practitioner bet half-Kelly" -- assume someone in the room read the same forum posts. Start the prep sheet with the single objection most likely to sink me, no intro, and don't soften that one, I need to know how bad it is. Also include the question I'm quietly hoping nobody asks (it's about what "one persistent agent over infinite time" even means when actual agents die). Keep it to what fits on a couple pages, typos in my notes are fine.
