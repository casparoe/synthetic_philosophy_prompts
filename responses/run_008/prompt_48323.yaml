answer: |-
  You have identified a genuine gap in the terminology. While the components of this structure are well-discussed in institutional economics, political philosophy, and game theory, there is no single canonical term that captures the *recursive, cost-reducing, convergent dynamic* you describe.

  You are correct that the **second-order free-rider problem** is too narrow (it addresses only the first step up the ladder), and **Ostrom's nested enterprises** is too static (it describes the architectural arrangement of successful institutions but does not model the *transaction cost dynamics* of moving between levels).

  Below is an analysis of the nearest existing concepts, followed by a proposed term and definition that carves out the specific structure you have identified.

  ### 1. The Near Misses
  To ensure precision, it is worth distinguishing your structure from three existing concepts that often get conflated with it.

  *   **The Second-Order Free-Rider Problem:** This describes the incentive to let others bear the cost of punishing defectors *within a single group*. It is a single-step problem. Your structure is a *sequence* of these problems, where the solution to the second-order problem at Level 1 becomes the first-order problem at Level 2.
  *   **Constitutional Hierarchy (Buchanan & Tullock):** Public choice theory distinguishes between "post-constitutional" rules (operational) and "constitutional" rules (rules for making rules). While this describes levels of decision-making, it focuses on *choice* rather than *enforcement costs*. It does not inherently model the reduction in monitoring costs as one moves up the hierarchy.
  *   **Polycentric Governance:** Ostrom uses this to describe multiple, overlapping centers of authority. While polycentric systems often utilize multiple scales, the term describes the *topology* of authority (overlapping vs. monocentric), not the *economic logic* of why enforcement costs decrease as you aggregate units.

  ### 2. The Proposed Term: **The Institutional Convergence Ladder**

  Since no standard term exists, I propose **The Institutional Convergence Ladder** (or simply **The Convergence Ladder**) to name this structure.

  #### Definition
  The **Institutional Convergence Ladder** is a hierarchical sequence of governance layers $L_1, L_2, \dots, L_n$ generated by the following recursive logic:
  1.  **Transformation:** A collective action problem at layer $L_i$ (e.g., resource extraction) is solved by establishing a governance body at $L_i$.
  2.  **Recursion:** The maintenance of that body (monitoring, sanctioning, funding) generates a new, higher-order collective action problem at layer $L_{i+1}$.
  3.  **Scaling:** The group size or transaction cost required to solve the problem at $L_{i+1}$ is strictly smaller (or more manageable) than at $L_i$.
  4.  **Convergence:** The ladder is "solvable" if and only if the sequence terminates at a level $L_n$ where the residual enforcement costs approach zero (via internalized norms) or are sufficiently low to be sustained by the participants' willingness to cooperate.

  #### Distinction from Ordinary Federalism or Subsidiarity
  *   **Federalism** describes a legal division of power. A federal system can exist without the Convergence Ladder logic (e.g., if the federal level is just as prone to corruption or shirking as the local level, the ladder does not *converge*; it merely shifts the locus of failure).
  *   **Subsidiarity** is a normative principle (decide at the lowest possible level). The Convergence Ladder is a *descriptive* mechanism explaining *why* subsidiarity might work: it works only if the enforcement costs converge as you move up. If costs do not decrease (e.g., if a federation is just as hard to monitor as a village), the ladder fails.

  ### 3. Boundary Cases and Termination

  You asked specifically about the termination points. This is where the "carving" is most critical.

  #### Case A: Termination via Internalized Norms
  **Verdict:** This counts as **Endogenous Convergence**.
  When the ladder terminates because norms are internalized (e.g., fishers feel shame or moral obligation rather than fearing sanctions), the enforcement cost at the top of the ladder drops to effectively zero. The recursive chain dissolves because the "compliance problem" at the highest level vanishes. This is the ideal solution in the Convergence Ladder framework because it requires no external enforcer. The ladder does not just stop; it becomes unnecessary.

  #### Case B: Termination via State Coercion
  **Verdict:** This counts as **Exogenous Truncation**, not Convergence.
  If the ladder terminates because a State (Leviathan) imposes rules from above, this is *not* a solution to the recursive collective action problem; it is a *replacement* of the game.
  *   **Why:** The State solves the monitoring problem by claiming a monopoly on violence. However, this creates a "Who guards the guardians?" problem (the infinite regress of political authority). Unless the citizens can monitor the State (which restarts the ladder), the State does not represent the *top rung* of the ladder; it represents a *change in the rules of the game* from voluntary cooperation to imposed compliance.
  *   **Implication:** In your framework, a fishery solved by state coercion has not "climbed the ladder to convergence"; it has been "lifted off the ladder" by an external force. It is a different kind of solution altogether (hierarchical command vs. self-organized governance).

  ### 4. Application to Your Fisheries Example

  Using the **Institutional Convergence Ladder**, we can map your scenario precisely:

  *   **Rung 1 (The Fishers):** Problem = Overexploitation. Solution = Association. New Problem = Who monitors the fishers? (First-order free riding).
  *   **Rung 2 (The Association):** Problem = Monitoring fishers. Solution = Peer sanctioning. New Problem = Who pays the cost of sanctioning? (Second-order free riding).
  *   **Rung 3 (The Federation):** Problem = Funding enforcement. Solution = Village contributions. New Problem = Who monitors the Federation? (Third-order free riding).
  *   **Convergence Condition:** The fishery is "solvable" if the cost of monitoring the Federation (Rung 3) is low enough that the Villages willingly pay it, *or* if Federation officials internalize norms of integrity (Endogenous Convergence).
  *   **Failure Mode:** If monitoring the Federation is as costly and difficult as monitoring the individual fishers, the ladder does not converge. It creates an infinite regress of bureaucracy where each layer consumes resources without adding net compliance.

  ### Summary
  You are describing a dynamic that is latent in Ostrom's work and explicit in philosophical discussions of authority, but it lacks a unified label. **The Institutional Convergence Ladder** captures the recursive nature, the cost-scaling dynamic, and the critical condition of convergence.

  It distinguishes itself from the **second-order free-rider problem** by being multi-level rather than single-step. It distinguishes itself from **nested enterprises** by focusing on the *cost dynamics* of enforcement rather than the *structural arrangement* of rules. It treats **internalized norms** as the only true endogenous termination (convergence) and **state coercion** as an exogenous truncation that changes the nature of the problem.

  This terminology should allow you to formalize your suspicion: that the solvability of a commons is indeed a function of whether the enforcement cost curve converges before it outruns the social capital available to fund it.
