answer: |-
  ### Nearest concepts

  **Immunization Strategies (Popper/Albert):** In critical rationalism, an "immunization" is a modification that protects a theory from refutation without increasing its empirical content. This fits your case because the "last instance" clause shields historical materialism from counterexamples (like fascism or Roman law) by categorizing them as non-decisive. However, standard immunization is typically criticized as *post hoc*—a repair job after a failed prediction. Your observation is astute: because Engels pre-announced the clause, it lacks the dishonesty of a rescue operation, yet it achieves the same epistemic safety. The concept captures the *effect* (immunity) but misses the *structural legitimacy* granted by the pre-announcement.

  **Ceteris Paribus Laws (Cartwright/Hausman):** In economics and philosophy of science, *ceteris paribus* (all else being equal) clauses acknowledge that laws hold only in the absence of interfering factors. This resembles the "last instance" claim in that both admit exceptions. The failure of fit lies in operationalizability: a respectable *ceteris paribus* clause specifies *what* counts as interference (e.g., "friction," "monopoly") so that we can measure whether the interference is present. The "last instance" does not specify the conditions of interference, only that the "true" determination is temporally deferred. It is a *ceteris paribus* clause where the "other things" are never defined and the "equality" is never expected to hold in observable time.

  **The Lakatosian Hard Core (Research Programmes):** Imre Lakatos argued that scientific programmes have a "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. The "last instance" functions as part of Marxism's hard core, which proponents are forbidden to abandon. This explains why the clause is pre-announced and non-negotiable. However, Lakatos evaluates programmes by their ability to predict *novel facts* over time (progressive vs. degenerating). Your concern is about the internal logic of the core itself: if the core's verification is deferred indefinitely, the programme cannot be "progressive" in Lakatos's sense, because the core never risks contact with evidence. This concept explains the *sociology* of the theory's defense but not the *logical* problem of the deferral.

  ### The difference that matters

  The legitimate distinction lies in **counterfactual stability versus indefinite deferral**. A respectable *ceteris paribus* qualification allows you to specify a conceivable world in which the interference is removed and the law *would* hold; it commits the theorist to a mechanism that is currently masked but potentially observable. The "last instance" qualifier, by contrast, relies on **indefinite deferral**: it posits a horizon of verification that recedes as fast as history advances. The difference is not that one admits exceptions and the other doesn't, but that the respectable qualification specifies the *boundary conditions* of the rule (allowing us to know when the rule is *not* in effect), whereas the "last instance" specifies a *temporal horizon* that is structurally unreachable by observation. In the former, the exception is a measurable friction; in the latter, the exception is the present itself.

  ### A name

  **The Eschatological Qualifier**

  **Definition:** A theoretical clause that preserves a causal claim by deferring its verification to an unspecified future point or ontological level that is structurally inaccessible to current observation, thereby rendering the claim immune to present counterexample without appearing *ad hoc*.

  **Boundary Case (Inside):** The claim that "communism is the inevitable end of history, though setbacks may occur for centuries." The "inevitability" cannot be falsified by any finite number of setbacks because the endpoint is always further down the timeline.

  **Boundary Case (Outside):** The claim that "gravity causes objects to fall, absent air resistance." This is not eschatological because "air resistance" is measurable in the present; we can create a vacuum *now* to test the claim. The verification is not deferred to the end of history, but to a specific, achievable experimental condition.

  ### Where this leaves the theory

  Historical materialism, qualified by the "last instance," emerges not as a falsifiable scientific hypothesis but as a metaphysical commitment or a heuristic framework for organizing historical inquiry. It retains explanatory power by directing attention to economic structures, but it sacrifices empirical risk because the condition for its refutation (the arrival of the "last instance") is structurally unreachable. Consequently, the theory occupies a space between science and philosophy: it is robust against counterexample, yet incapable of decisive confirmation, functioning more as a lens for interpretation than a engine for prediction.
