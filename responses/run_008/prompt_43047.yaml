answer: |-
  Here are ten questions designed to press the "Mutual Calibration Condition" (MCC) without falling into the standard 1998 traps, including the specific follow-ups you requested to keep her pinned on cognitive architecture rather than consciousness or semantics.

  ### 1. The Directionality of Calibration (Agency)
  **Question:** You argue that Otto's notebook is part of his mind because he and the notebook are mutually calibrated. But consider modern predictive text or autocomplete. The software calibrates to *you* aggressively, learning your syntax and habits, but you haven't necessarily calibrated to *it* in the same deep way—you're just typing. Does your condition allow for "one-way calibration" where the tool does the heavy lifting of tuning, or does that exclude the very technologies that feel most cognitively integrated?

  **Follow-up (If she argues the system works regardless of direction):**
  "If the direction doesn't matter, aren't you smuggling agency back in by the back door? If the algorithm is the one doing the tuning and you're just the passive beneficiary, why is this *your* mind rather than you just being a component in *its* system? Where does the cognitive ownership lie if the calibration isn't mutual?"

  ### 2. The Threshold Problem (Bloat)
  **Question:** The original "access and trust" criteria were criticized for being vague, leading to cognitive bloat. Your "mutual calibration" seems to replace one vague metric with another. Is there a threshold for how much tuning is required? If I use a new app for a week and get reasonably efficient, is it part of my mind then, or do I need years of neural rewiring? How do we distinguish deep calibration from just being a proficient user?

  **Follow-up (If she says it's a gradualist spectrum/continuum):**
  "If it's a spectrum, then 'being part of the mind' becomes a sorites paradox. At what specific point on that gradient of tuning does the ontology shift? If you can't draw a line, aren't you just saying 'mind' is a label we slap on things we like, rather than a structural fact about cognition?"

  ### 3. Prosthetics and Deficit Compensation
  **Question:** Your model relies on tuning to create competences neither part has alone. But consider a cochlear implant or a memory prosthetic for brain injury. These aren't about tuning a healthy baseline to a tool; they are compensating for a deficit to restore a baseline. Does the MCC treat restorative tech differently than enhancement tech? If the brain tunes to the implant just to function normally, does that count as extension, or is it just biological repair?

  **Follow-up (If she says restoration is also a form of joint competence):**
  "If restoration counts as extension, doesn't that collapse the distinction between *having* a mind and *fixing* a mind? If every piece of medical tech I calibrate to becomes part of my mind, does the boundary of the self just become wherever the medical intervention stops?"

  ### 4. Falsifiability and Evidence
  **Question:** Let's talk about what would prove you wrong. Since this is a claim about the boundaries of cognition, what empirical case or thought experiment would force you to abandon the Mutual Calibration Condition? Is there a scenario where we have perfect mutual calibration, but you'd still intuitively say 'that's not part of the mind,' or vice versa?

  **Follow-up (If she says it's a conceptual claim not subject to empirical falsification):**
  "If it's purely conceptual, then we're just debating definitions. But you claim this solves real problems about bloat and coupling. If no empirical evidence could change your view, how is this different from just stipulating a definition that protects the Extended Mind Thesis from counter-examples?"

  ### 5. Decoupling and Cognitive Loss
  **Question:** If the notebook is part of Otto's mind because of calibration, what happens when he loses it? Does he literally lose a part of his mind, akin to a lobotomy, or does he just lose access to it? If the calibration history remains in his brain even after the tool is gone, does the mind shrink in real-time, or is there a lag?

  **Follow-up (If she says he loses a part of his mind):**
  "That's a strong claim. If he loses a part of his mind, his cognitive identity changes instantly. But if you say he only loses *access*, aren't you admitting the tool was never a *constituent* but merely a *resource*? That sounds exactly like the Embedded view you're trying to avoid."

  ### 6. Maladaptive Calibration
  **Question:** Calibration implies a fit between brain and tool, but not necessarily a *good* fit. If someone becomes deeply calibrated to a radicalizing algorithm or a gambling app—such that the system has competences neither has alone (e.g., maximizing outrage or loss)—does that pathological loop count as part of their mind? Is the MCC normative, or does it validate cognitive dysfunction as readily as cognitive extension?

  **Follow-up (If she says dysfunction is still cognition):**
  "If a pathological loop counts as an extended mind, then the thesis loses its critical bite. It suggests we can't criticize the integration of technology because any tight coupling, even destructive coupling, counts as 'mind.' How do you distinguish between a cognitive extension and a cognitive parasite?"

  ### 7. Neuroplasticity Requirements
  **Question:** Does "calibration" require physical neuroplasticity? For the notebook to be part of Otto, does his brain literally have to rewire itself to accommodate the notebook's structure, or is functional fluency enough? If I can use a tool perfectly without my neural pathways changing significantly, have I failed the calibration condition?

  **Follow-up (If she says physical rewiring isn't necessary, only functional):**
  "If physical rewiring isn't required, then 'calibration' is just a metaphor for '熟练' (skill). If it *is* required, doesn't that privilege biological changes over external ones? It sounds like you're saying the external tool only counts once the internal brain has changed to match it, which recenters the biology."

  ### 8. Social Calibration (Transactive Memory)
  **Question:** Humans calibrate to each other constantly—partners who finish sentences, or teams with specialized roles. Does your Mutual Calibration Condition extend to other people? If my spouse and I are mutually calibrated such that we remember things jointly neither could alone, is my spouse literally part of my mind?

  **Follow-up (If she says yes, other people can be parts of minds):**
  "That's a radical claim. If my spouse is part of my mind, do I have moral responsibility for their thoughts? If you say no, aren't you drawing a moral boundary that contradicts your cognitive boundary? You can't have it both ways: either they are part of the cognitive system, or they are just external resources."

  ### 9. Competence vs. Efficiency
  **Question:** You emphasize that the system must have competences neither part has alone. But isn't most tool use just *efficiency* rather than new competence? A calculator makes me faster at math, not capable of math I couldn't theoretically do myself. Does the MCC rule out most tools because they don't actually create *new* cognitive kinds, they just speed up old ones?

  **Follow-up (If she says speed/efficiency counts as a new competence):**
  "If efficiency counts as a new competence, then almost any tool I pick up quickly becomes part of my mind. We are back to the bloat problem. How is 'joint efficiency' fundamentally different from 'coupled processing' in a way that blocks the 1998 objections?"

  ### 10. Responsibility and the Extended Self
  **Question:** Finally, if the Mutual Calibration Condition makes external tools constituents of the mind, does it also extend moral responsibility? If my calibrated phone's autocomplete suggests something libelous and I send it without reading because I trust the calibration, is that *my* error or a system error? Does the MCC blur the line of agency?

  **Follow-up (If she tries to pivot to consciousness/intention):**
  "We agreed to set aside consciousness. I'm asking about functional responsibility. If the tool is a constituent of the cognitive process that generated the action, you can't offload the blame to 'just a tool.' If you insist the agency remains internal, doesn't that prove the tool was never really part of the mind in the first place?"
