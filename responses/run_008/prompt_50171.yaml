answer: |-
  This is not well-trodden ground for you, but it is the central problem of **non-identity and intergenerational justice** in political philosophy. Your intuitions are sharper than many professional arguments I have read. You have correctly identified that "Guilt" and "Owing" are different categories, but you are struggling to find the boundary line that doesn't also erase "Pride."

  Here is a precise formulation of the principle that best captures your verdicts, followed by the necessary sacrifices and the points of failure.

  ### The Principle: Distinct Attribution vs. Continuous Obligation

  **Statement:**
  > **Moral Blame (Guilt) attaches only to agency and choice; Political Obligation (Debt) attaches to membership and benefit.**

  This principle splits your moral landscape into two layers:
  1.  **The Layer of Action (Guilt/Pride):** Requires personal agency. You can only be blamed for what you chose, or strictly praised for what you achieved.
  2.  **The Layer of Structure (Debt/Restitution):** Requires only participation in a continuing system. If you inhabit a structure built on injustice, or benefit from its stability, you inherit the duty to maintain or repair it, regardless of your personal innocence.

  #### How this maps to your verdicts:

  1.  **"I am not guilty of the crime."**
      *   **Verdict:** Kept.
      *   **Reasoning:** You lacked *agency*. You did not choose the policy, nor did you look away. Under the Layer of Action, you are clean.
  2.  **"I owe restitution for the house."**
      *   **Verdict:** Kept.
      *   **Reasoning:** This falls under the Layer of Structure. You hold *benefit* (the house) derived from a wrong. This is the legal/moral concept of **Unjust Enrichment**. It does not matter that you didn't steal it; it matters that you hold the stolen goods.
  3.  **"The state debt doesn't expire, but taxing current citizens feels unfair."**
      *   **Verdict:** Resolved (with tension).
      *   **Reasoning:** The *State* is a continuous legal entity (a "corporation sole"). It exists across time. The debt belongs to the State, not the specific atoms of citizens alive in 1940. However, the State is funded by citizens. Your discomfort arises because you are conflating *State Liability* with *Personal Blame*. You are not paying because *you* sinned; you are paying because you are a shareholder in the continuing entity that sinned and still exists.
  4.  **"Owing is different from Guilt."**
      *   **Verdict:** Confirmed.
      *   **Reasoning:** This is the core of the principle. Guilt is backward-looking (condemnation); Owing is forward-looking (restoration). You can have a duty to fix a mess you didn't make (e.g., a new CEO fixing the debts of the previous administration).

  ---

  ### The Incompatibility: The "Pride" Verdict

  You suspected the pride verdict ("We did that") has to go. **You are correct.**

  If you strictly adhere to **Distinct Attribution vs. Continuous Obligation**, you cannot claim *authorship* of past national achievements any more than you can claim *authorship* of past national crimes.

  *   **The Conflict:** If you say "We won those medals," you are claiming **collective agency**. You are saying the nation is a single moral actor that extends across time. If the nation is a single actor, then when it committed the crime, *it* committed the crime, and you are a part of *it*. You cannot claim the agency for the gold medal while disclaiming the agency for the genocide.
  *   **The Fix:** You must change the language of pride. You cannot say "We did that." You must say, "I am glad to belong to a tradition that achieved that."
      *   **Guilt:** Requires *Action*. (You didn't act, so no guilt).
      *   **Pride:** Requires *Action*. (You didn't act, so no pride of authorship).
      *   **Gratitude/Solidarity:** Requires *Connection*. (You are connected, so you can feel gladness).

  **Verdict:** To keep your strong intuition that "I am not guilty," you must downgrade "We did that" to "I am fortunate to inherit that." If you keep the "We did that" phrasing, you logically open the door to "We did the crime," which undermines your claim to innocence.

  ---

  ### Edge Cases

  Here is how the principle applies to the scenarios you hadn't mentioned:

  **1. The Recent Immigrant (Naturalized after the crime)**
  *   **Guilt:** None. They had no agency in the past crime.
  *   **Debt:** Yes. By naturalizing, they voluntarily joined the *Political Community*. They accepted the benefits of the state (security, infrastructure, rule of law) which were stabilized by the historical order. They step into the stream of obligations.
  *   **Pride:** They can feel solidarity with the nation's achievements, but like you, they cannot claim authorship ("I didn't win that medal").

  **2. The Person Who Inherited Nothing (No house, no wealth)**
  *   **Guilt:** None.
  *   **Debt:** This is the hardest case. Under **Unjust Enrichment**, if they truly benefited *not at all*, they owe nothing personally. However, under **Political Continuity**, they still owe. Why? Because the *State* owes. Even a poor citizen participates in the sovereignty of the state. If the state pays reparations, it draws from the common treasury.
  *   **Resolution:** The obligation here is weaker but not zero. It is an obligation of *citizenship*, not *enrichment*. However, a just application of reparations would likely be funded progressively (taxing those who *did* inherit wealth/property more heavily), acknowledging that the "Benefit" principle is stronger than the "Membership" principle.

  ---

  ### Where This Reasoning Fails (The Failure Mode)

  You asked for a frank statement of where this principle breaks. Here is the specific pressure point that would make me abandon or heavily modify the **Distinct Attribution vs. Continuous Obligation** framework:

  **The "No Benefit" Counter-Example.**

  Imagine a descendant of the victimized group who remained in the country, and a descendant of the perpetrator group who is destitute.
  *   **Person A (Victim's descendant):** Poor, marginalized, gained no benefit from the state's stability.
  *   **Person B (Perpetrator's descendant):** Poor, marginalized, gained no material benefit from the stolen property (it was lost/squandered by ancestors).

  Under my proposed principle:
  *   Person B still owes a debt based on **Political Continuity** (they are a citizen).
  *   Person A is owed restitution based on **Historical Wrong**.

  **The Failure:** If Person B is truly destitute, asking them to pay taxes for reparations violates the **Benefit Principle**. They did not *keep* anything. They are being asked to pay for a crime that not only didn't commit, but from which they derived *no advantage*.

  If you press me here, I must admit: **Political Continuity is not enough to generate debt without some baseline of Benefit.**

  If the State demands payment from citizens who received *no* unjust enrichment and *no* stability benefit (perhaps they were persecuted themselves), the "Debt" transforms into a "Sacrifice." While sacrifice is noble, it cannot be *owed* as a matter of justice.

  **Therefore, the principle must be amended:**
  > *Obligation attaches to membership **only insofar as** that membership confers the benefits of the continuing state.*

  If the state was built on a crime, but you are a citizen who gains no advantage from that state (perhaps you are oppressed by it), your obligation to pay for its past crimes vanishes, even if the State's debt remains. This implies that reparations should not be funded by general taxation (which hits the poor), but by **asset recovery** (which hits those who actually "kept" something, like your house).

  ### Summary of the Bargain

  To resolve your circling, you must accept this trade:

  1.  **Keep:** You are not guilty. (Agency is required for blame).
  2.  **Keep:** You owe restitution. (Benefit/Property creates debt).
  3.  **Keep:** The State owes debt. (Entities survive their members).
  4.  **Sacrifice:** The "We did it" Pride. (You must accept you are a *beneficiary* of history, not an *author* of it, whether the history is good or bad).
  5.  **Refine:** The funding of the debt. (It should fall on those who inherited assets/stability, not equally on all taxpayers).

  If you can accept that your pride is actually *gratitude*, and your debt is actually *disgorgement of benefit*, the circle closes.
