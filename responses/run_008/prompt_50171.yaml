      *   *Inherits Nothing:* If they benefited from the *system* (infrastructure, stability) created by the crime, they still owe. If they truly benefited from nothing (hard to prove), obligation is weaker but still exists as a member of the political body.

  7.  **Addressing the "Pride" Conflict:**
