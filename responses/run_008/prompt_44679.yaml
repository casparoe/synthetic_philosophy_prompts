  *(Self-Correction during drafting Objection 3)*: The "No Betting" objection needs to address the *interpretive premise*. If belief *is* disposition to bet, refusing to bet is conceptually confused. If belief *implies* disposition, refusing is irrational. Need to be clear on which. The prompt says "interpretive premise tying degrees of belief to dispositions." I should lean on the constitutive reading.

  *(Final check on "The Question"):* The most dangerous question is about the source of normativity. If it's not pragmatic (money) and not alethic (accuracy), why is incoherence bad? This strikes at the "Bridge Claim."

  Let's assemble.

  *(Wait, one more check on constraints)*: "Keep the whole thing to something I could actually read on a train the morning of the talk." This means concise, high-density, no fluff. Use bolding for skimmability.

  *(Final Plan)*:
