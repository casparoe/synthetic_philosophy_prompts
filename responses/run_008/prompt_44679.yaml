      *   **Speaker's Thesis:** DBA is *interpretive/structural*, not *pragmatic/decision-theoretic*. Susceptibility to a Dutch Book is like logical inconsistency in full belief, not just losing money. The money-loss framing is inessential.
      *   **Structure:**
          1.  *What they will hear my thesis as:* How the specific sub-groups (DTs, Accuracy, Mainstream) will initially frame the position.
          2.  *The objections:* ~8 objections, ordered by damage, phrased as audience members would ask, with 2-minute replies and candid notes on weaknesses. Must cover: non-betting agents, nonlinear utility, diachronic/conditionalization issues, accuracy-first competition.
          3.  *The question I hope nobody asks:* The single most dangerous question + why + best answer.
          4.  *What to concede on the day:* Points to yield gracefully + cost to thesis.
      *   **Constraint:** Keep it concise enough to read on a train the morning of the talk.

  2.  **Deconstruct the Thesis & Audience:**
      *   *Thesis:* DBA $\neq$ Pragmatic justification (losing money). DBA $=$ Structural incoherence (like contradiction). Betting is just a heuristic to reveal the structure.
      *   *Decision Theorists (DTs):* Skeptical of betting. They think preferences over acts are fundamental. They will hear "You're trying to revive a dead horse" or "You're confusing norms of belief with norms of action."
      *   *Accuracy-First (Acc):* Thinks epistemic utility (accuracy) is the *only* proper justification. They will hear "You're offering a half-baked version of what I do with proper scoring rules."
      *   *Mainstream Epistemologists:* Likely familiar with standard objections (forced betting, utility). They will hear "You're dodging the standard pragmatic objections by relabeling them."

  3.  **Drafting Section 1: What they will hear my thesis as:**
      *   Need to capture the skepticism.
      *   DTs: "He's trying to save pragmatism by denying it's pragmatism."
      *   Acc: "He's doing epistemology without an epistemic value function."
      *   Mainstream: "He's saying money doesn't matter, but he's still talking about money."

  4.  **Drafting Section 2: The objections:**
      *   Need 8 objections. Order by damage (High to Low).
      *   *Objection 1 (The Accuracy Attack):* Why not just use accuracy? (High damage from the Acc person).
      *   *Objection 2 (The DT Attack):* If betting is just a heuristic, why not drop it? (High damage from DTs).
      *   *Objection 3 (The No-Betting Agent):* What about agents who refuse to bet? (Classic objection).
      *   *Objection 4 (Nonlinear Utility):* You still need linear utility for the math to work. (Classic objection).
      *   *Objection 5 (Diachronic/Conditionalization):* Does this work for updating? (Technical vulnerability).
      *   *Objection 6 (Epistemic vs. Practical):* Is structural incoherence actually *epistemic* irrationality? (Mainstream worry).
      *   *Objection 7 (The Bookie's Intent):* Does the bookie need to be clever? (Distraction but relevant).
      *   *Objection 8 (Alternative Logics):* What about non-classical probabilities? (Niche but possible).
      *   *Drafting Replies:* Need to be punchy (2 mins spoken $\approx$ 250-300 words, but for a cheat sheet, bullet points are better).
      *   *Drafting "Soft Spots":* Be honest about where the argument leaks.

  5.  **Drafting Section 3: The Question I Hope Nobody Asks:**
      *   What kills the "Structural/Interpretive" view?
      *   Idea: If the betting disposition is *constitutive* of belief, then an agent who lacks the disposition lacks the belief. But if it's just *evidence* of belief, the link is too weak to ground normativity.
      *   Better Idea: "If the money loss is inessential, why does the theorem rely on the algebra of money (linearity, additivity) rather than the algebra of truth?"
      *   *Selection:* The "Why Money?" question. If it's about belief structure, why use a financial model at all? Why not just say "incoherent credences are impossible"?
      *   *Refinement:* The "Normative Free Rider" problem. If you strip the pragmatism, where does the *ought* come from? Accuracy has "aiming at truth." DBA (on your reading) has... what? Consistency? Why care about consistency without a goal?

  6.  **Drafting Section 4: What to Concede:**
      *   Don't fight the DTs on the *utility* of money. Concede that money is a proxy.
      *   Don't fight the Acc person on the *superiority* of accuracy arguments for *epistemic* normativity specifically. Concede DBA might be about *rationality* broadly, not just *epistemic* rationality.
      *   Cost: Weakens the claim that DBA is a *purely* epistemic justification, but saves the structural insight.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Professional, sharp, ready for the trenches.
      *   *Length:* Needs to be "train readable." Not too verbose.
      *   *Check Constraints:* Did I include the specific objections requested (non-betting, nonlinear, diachronic, accuracy)? Yes.
      *   *Ordering:* Ensure the most damaging are first. The Accuracy objection is probably the most existential threat to the project's relevance. The DT objection is the most existential threat to the method.
      *   *Refining the "Hear My Thesis As":* Make sure the DTs feel heard (they hate betting) and the Acc person feels heard (they hate pragmatism).

  8.  **Final Polish:** Check word count and formatting. Ensure the "Soft Spot" notes are candid. (e.g., admitting that the bridge claim is the weakest link).

