      *   *Critique:* The Historian is dangerous.
      *   *Fix:* Advise the student to bracket the historical necessity question and focus on the *moral description of the act chosen*. Anscombe's point is largely that *even if* it was necessary, it was murder.
      *   *Critique:* The "Pacifism" objection is standard.
      *   *Fix:* Make sure to distinguish combatant/non-combatant clearly.
      *   *Dreaded Question:* The prompt mentions "firebombings." The hardest pill to swallow is Dresden/Tokyo. If Anscombe condemns Truman, she must condemn Churchill/LeMay. If the student defends Anscombe, they must condemn the Allies broadly. This is politically and morally charged. Let's make this the "Dreaded Question."

  7.  **Final Review against Prompt:**
