      *   **Audience:** Departmental colloquium. Mostly mainstream analytic ethicists (many consequentialists), some Just War theorists (Double Effect skeptics/users), one historian (expert on Pacific War). No Thomists/Catholics.
      *   **Task:** Act as a senior moral philosopher. Brainstorm audience reactions. Create a prep sheet with 7-8 likely objections (ordered by damage), phrased in audience vocabulary, with 2-minute replies, honesty about soft spots, concessions to make, and identify the "dreaded question."
      *   **Constraints:** No direct quotes (paraphrase Anscombe), keep it practical/colloquium-style.

  2.  **Deconstruct the Audience & Their Likely Objections:**
