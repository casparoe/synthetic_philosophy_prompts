answer: |-
  Here is the brainstorming and prep sheet you asked for. I've sat on enough hiring and tenure committees, and heard enough job talks, to know how this room will smell blood. You have a strong textual reconstruction, but you are walking into a minefield of modern just war theory and consequentialist intuition.

  ### Part 1: Audience Brainstorming

  *   **The Consequentialists (The Majority):** They won't bother with Double Effect. They will attack the *premise* that consequences can be ignored. To them, Anscombe looks like a moral fetishist who cares more about the cleanliness of her own soul than the lives saved by ending the war. They will frame this as "absolutism vs. reality."
  *   **The Just War Theorists:** They are your natural allies on Double Effect, but they are wary of *rigid* applications. They will probe whether you are defining "intention" too broadly. If breaking morale is the goal, and death is the mechanism, is the death intended or just foreseen? They want to know if your reading of Anscombe makes *any* strategic bombing permissible.
  *   **The Historian:** This is your wildcard. They will not care about the moral theory. They will care about the counterfactuals. If Japan was already surrendering, or if the Soviet entry was the causal factor, then Truman's *belief* that the bomb was necessary was false. Anscombe argues even if it *was* necessary, it was murder. The historian will try to trap you into defending the necessity claim, which is historically shaky.
  *   **The Political Theorists:** They will target your point about voting. In a democracy, voting is instrumental. To treat it as purely expressive risks making political action meaningless. They will call this "moral grandstanding."

  ***

  ### Part 2: The Prep Sheet (7 Objections + The Dreaded Question)

  I have ordered these by potential damage. The top three can sink the talk if you fumble them.

  #### 1. The "Invasion Alternative" Objection (Consequentialist)
  **The Question:** "Anscombe treats the prohibition on killing innocents as absolute. But if the alternative was a land invasion costing a million lives, including many more civilians, aren't you committed to saying Truman *ought* to have chosen the higher body count just to keep his hands clean? Isn't this moral narcissism?"

  **The 2-Minute Reply:**
  Distinguish between *outcome* and *act*. Anscombe isn't saying consequences don't matter; she's saying they don't license *murder*. If a judge can't convict a defendant he knows is innocent even if it prevents a riot, a leader can't murder innocents even to prevent an invasion. The constraint is on *what you may do*, not just on what outcomes you produce. To say otherwise is to say human beings are disposable tools for the greater good.
  **Soft Spot:** It sounds cold. You are effectively saying "let the invasion happen."
  **Concession:** Concede that this is a "hard case." Acknowledge the horror of the alternative. Do not deny the tragedy; insist only that the *type* of action (murder) is forbidden regardless of the tragic trade-off.

  #### 2. The "Allied Consistency" Objection (Historian/Just War)
  **The Question:** "If the atomic bombs were impermissible because they targeted civilians to break morale, what about the firebombing of Tokyo or Dresden? Are you prepared to say Churchill and LeMay were also mass murderers? If not, what's the relevant difference? If so, are you condemning the entire Allied strategic bombing campaign?"

  **The 2-Minute Reply:**
  Anscombe's logic *does* apply to area bombing generally. She was consistent on this: the intentional destruction of civilian centers to break will is impermissible. The atomic bomb was just a more efficient version of the same moral error. The difference is one of scale and singularity, not moral kind.
  **Soft Spot:** This alienates the room. Most people want to condemn Truman but excuse Churchill.
  **Concession:** **Crucial:** Concede this upfront. Do not try to find a distinction that isn't there. Say clearly: "On Anscombe's view, the firebombings were also impermissible." It's better to be consistent and unpopular than to be caught fudging the principle.

  #### 3. The "Intention vs. Foresight" Objection (Just War Theorist)
  **The Question:** "You claim the deaths were intended means. But couldn't one argue the intention was 'ending the war,' and the deaths were merely foreseen side-effects of destroying industrial capacity? Why does the 'morale' argument collapse the distinction?"

  **The 2-Minute Reply:**
  Because the mechanism of surrender relied on the terror inflicted on the population. If the civilians hadn't died, the pressure on the government wouldn't have existed. When the causal chain to your goal *runs through* the death of the innocent, you intend their death. You can't say "I want them scared" without meaning "I want them to fear death," which requires the death of some to be credible.
  **Soft Spot:** This relies on a specific theory of intention (the "means-end" view) that some modern action theorists reject.
  **Concession:** Acknowledge that this depends on a robust view of intention. If they push hard on action theory, don't get bogged down. Pivot back to: "Regardless of the mental state, the *act description* is 'killing civilians to force surrender.'"

  #### 4. The "Historical Necessity" Objection (The Historian)
  **The Question:** "Recent archives suggest Japan was seeking peace via Moscow before the bomb. If Truman didn't *need* the bomb to end the war, doesn't that make your philosophical point moot? Isn't this just bad history dressed as ethics?"

  **The 2-Minute Reply:**
  Clarify that Anscombe's argument is conditional. She argues that *even if* Truman believed it was necessary, the act was murder. The historical debate about surrender terms is relevant to Truman's prudence, but not to the moral prohibition. We are evaluating the *choice made*, not just the intelligence available.
  **Soft Spot:** The historian will press that if it wasn't necessary, it wasn't "tragic choice," it was just slaughter.
  **Concession:** Agree that the historical record makes the act *worse*, but insist the philosophical point stands even on the most charitable reading of Truman's options.

  #### 5. The "State Authority" Objection (Political Philosopher)
  **The Question:** "You use the word 'murder.' Murder is a legal category involving private citizens. Can a Head of State, acting in a war capacity, commit 'murder'? Doesn't the sovereign have different moral permissions?"

  **The 2-Minute Reply:**
  Anscombe rejects the idea that sovereignty grants a license to violate natural law. If it is wrong for me to kill a neighbor to save my family, it is wrong for a state to kill innocents to save the nation. The authority of the state is limited by justice; it cannot authorize what is inherently unjust.
  **Soft Spot:** This sounds theological to secular ears.
  **Concession:** Rephrase "natural law" as "basic moral constraints on agency." Don't lean on the Thomistic metaphysics; lean on the intuition that authority doesn't create morality.

  #### 6. The "Bribery Analogy" Objection (Ethicist)
  **The Question:** "The bribery analogy is vivid, but is it apt? A judge taking bribes corrupts the system. Truman acting for consequences might save the system. Does the analogy beg the question by assuming the act is already corrupt?"

  **The 2-Minute Reply:**
  The analogy targets the *structure of justification*, not the severity. It shows the absurdity of saying "I did a prohibited thing for a good result." If bribery is prohibited regardless of the good cause, why is killing innocents negotiable? It exposes the inconsistency in allowing consequentialist overrides for war but not for law.
  **Soft Spot:** People will say war is different from law.
  **Concession:** Admit the analogy isn't perfect, but insist it holds for the *logic of justification*.

  #### 7. The "Voting as Expression" Objection (Political Theorist)
  **The Question:** "You defend the vote as expressive. But in a university governance context, a vote is a decision procedure. Isn't voting 'no' when you know you'll lose just performative? Does it actually honor the duty you claim?"

  **The 2-Minute Reply:**
  Voting is a public record of judgment. If everyone votes 'yes' because they think they'll lose, the institution loses its moral compass. The dissent registers that the honor is tainted, regardless of the outcome. It preserves the integrity of the voter and the record of the institution.
  **Soft Spot:** This is the weakest part of your talk. It feels like "doing something is better than nothing."
  **Concession:** Admit it didn't stop the degree. Argue it prevented the decision from being *unanimous*, which matters for the historical record.

  ***

  ### Part 3: The Dreaded Question

  You suspected you knew this one. Here it is. It combines the Historian's knowledge with the Consequentialist's moral outrage.

  **The Question:** "If Truman is a murderer deserving of no honor, what is the appropriate penalty? Should he have been hanged at Nuremberg? If not, why is an honorary degree the line in the sand? And if yes, are you prepared to advocate for the retroactive prosecution of Allied leaders?"

  **Why it's deadly:** It forces you to choose between looking bloodthirsty (yes, hang him) or hypocritical (no, but don't honor him). It exposes the gap between *moral condemnation* and *political punishment*.

  **How to handle it:**
  Do not say he should have been hanged. That creates a straw man of Anscombe as a vengeance-seeker.
  **Reply:** "Anscombe's point is about *honor*, not *retribution*. We do not need to prosecute every moral wrong to acknowledge that we should not celebrate it. We don't need to strip Churchill of all honors to admit that strategic bombing was wrong. The specific claim is about the *university's complicity*. By granting the degree, Oxford wasn't just observing history; it was endorsing the act. The protest was against the endorsement, not a call for a tribunal."
  **Concession:** Concede that we live in a world where we must coexist with people who have done terrible things for 'necessary' reasons. But insist that *celebration* is a different category than *coexistence*.

  ### Final Advice on Concessions

  1.  **Bite the Bullet on Firebombing:** Do not try to save the Allied reputation. If you say "The A-bomb was unique," the Just War theorists will tear you apart on principle. Say: "The principle condemns area bombing generally. The A-bomb was just the starkest instance."
  2.  **Don't Defend Pacifism:** Anscombe was not a pacifist. If they ask "Does this forbid all war?", say "No, it forbids targeting non-combatants. A war fought strictly against combatants is permissible." (Even if this is practically difficult, it's her theoretical position).
  3.  **Drop the Thomistic Jargon:** Unless you are asked directly about natural law, speak in the language of "constraints on agency" and "descriptions of action." Keep the religion in the background; let the moral logic stand on its own.

  Good luck. You're defending a hard line. The room will push. If you stay calm, concede the historical complexities, and hold firm on the *description of the act*, you'll survive.
