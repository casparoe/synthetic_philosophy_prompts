      *   *Just War Theorists (Double Effect):* Will attack the application of DDE. "Was surrender *really* impossible otherwise?" "Isn't 'breaking morale' distinct from 'killing civilians'?" "Does this make all area bombing impermissible?"
      *   *The Historian:* Will attack the factual premises. "Japan was already suing for peace." "The Soviet entry was the real cause." "Truman didn't know the casualty estimates you think he knew."
      *   *Political Philosophers/Liberal Theorists:* Will attack the "Voting as Expression" point. "Democracy is about outcomes." "Is this just moral grandstanding?"
      *   *General Meta-Ethical:* "Is 'murder' the right category for state action?" "Does this collapse into pacifism?"

  3.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Objection 1 (The Big One - Consequentialist):* The Invasion Alternative. If the bomb saved lives, how can it be wrong?
          *   *Reply:* Anscombe isn't denying consequences matter, but they don't trump the prohibition on murder.
          *   *Soft Spot:* It sounds callous. Need to acknowledge the horror of the alternative without conceding the principle.
      *   *Objection 2 (Just War/DDE):* The Definition of Intention. Did they *intend* to kill civilians or just destroy infrastructure/morale?
