          *   *Implication:* A strict Dennettian view might actually *undermine* ADs. If the self is just the story being told *now*, and the demented person is telling a new story (even a simple one), why privilege the old story?
          *   *Correction:* However, Dennett allows for "heterophenomenology." We interpret the subject. The legal system acts as the interpreter. It decides the "true" narrative is the coherent one written before the unraveling.
          *   *What would change?* A Dennettian court might look more at the *continuity of the narrative* rather than a binary competence check. If the demented self is still weaving a coherent (albeit different) narrative, maybe their current wishes weigh more. It would blur the bright line.
      *   **The "Framing is Off" Check:**
          *   Be honest. The law is rarely metaphysically committed. It uses "identity" as a proxy for "responsibility and rights."
          *   The "Competence" explanation is the *legal* doctrine. The "Identity" explanation is the *philosophical justification* for the doctrine.
          *   Advice: Don't argue the law *is* a metaphysical theory. Argue that the law *relies on* metaphysical assumptions to justify its competence thresholds.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Contracts:* Users noted contracts require ongoing assent. Actually, contracts bind future selves all the time (mortgages, marriage). The difference is *personal service* or *bodily integrity*. You can't specific performance a person. ADs are about bodily integrity. So the comparison to contracts needs nuance. It's about *inalienable rights*.
      *   *Dennett Nuance:* Dennett's view is deflationary. The self isn't *real* in a deep metaphysical sense. If the law adopts this, it treats the self as a legal construct. This actually supports the law's pragmatic approach. The law *creates* the center of gravity.
      *   *Dworkin vs. Dresser:* Mention Rebecca Dresser. She criticizes Dworkin. She argues the demented self is a new person with new interests. If the user wants a counter-point, this is gold. It aligns with the Psychological Continuity view.

  6.  **Final Structure:**
