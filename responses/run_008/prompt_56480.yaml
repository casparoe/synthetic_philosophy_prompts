      2.  **The Implicit Theory:** It's mostly Dworkin (Critical Interests) mixed with a pragmatic Competence Threshold.
      3.  **Rival Views:** Psychological Continuity (Dresser) challenges it. Contract law differs because of bodily integrity, not just identity.
      4.  **Dennett's Impact:** If taken seriously, it might destabilize the bright line of competence, focusing instead on narrative coherence.
      5.  **The "Competence" Reality Check:** The law uses identity language to solve evidentiary problems.
      6.  **Paper Advice:** How to structure the argument.

