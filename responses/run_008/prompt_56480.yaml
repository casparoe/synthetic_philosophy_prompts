answer: |-
  This is an exceptionally sharp puzzle. You have identified the exact friction point where bioethics, legal theory, and metaphysics collide (often called the "Then Self vs. Now Self" problem).

  To answer your most anxious question first: **Your framing is not off.** If you write a paper arguing this is *only* about evidence and competence, you will miss the philosophical heavy lifting the law is doing. Competence is the *trigger*, but personal identity is the *justification* for why the trigger works the way it does. If the demented patient were unequivocally the "same person" in every morally relevant sense as the one who signed the directive, overriding their current desperate plea for food would be a much harder sell (potentially a violation of current autonomy). The law gets away with it because it implicitly relies on a theory of the self that degrades the moral status of the demented "now" self relative to the competent "then" self.

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and what a Dennettian shift would actually look like.

  ### 1. The Implicit Theory: Precedent Autonomy + Critical Interests
  The dominant philosophical justification for advance directives (ADs) in law is not strictly a metaphysical theory of identity, but a theory of **well-being and authority**. It aligns most closely with **Ronald Dworkin's** distinction in *Life's Dominion*.

  *   **The Theory:** The law presupposes a **Temporally Extended Self**. It assumes that what makes your life go well is not just the sum of your moment-to-moment experiences (experiential interests), but the coherence of your life as a whole narrative (critical interests).
  *   **The Application:** The competent self ($t_1$) is the only agent capable of grasping "critical interests." The demented self ($t_2$) is reduced to "experiential interests." Because the law values the integrity of the life narrative over momentary contentment, $t_1$'s instructions trump $t_2$'s pleas.
  *   **Why Contracts Differ:** You noted contracts require ongoing assent. Actually, contracts bind future selves constantly (mortgages, non-competes). The difference is **bodily integrity**. The law treats the body as inalienable. You cannot contractually enslave your future self because the future self's bodily autonomy is sacred *unless* that future self is incompetent. In ADs, the incompetence of $t_2$ is what allows $t_1$ to bind $t_2$'s body. In standard contracts, we assume $t_2$ remains competent enough to sue for breach or negotiate release.

  **Verdict:** The law presupposes a Dworkinian view where the "Self" is the author of a life story, and authorship rights survive the loss of the ability to hold the pen.

  ### 2. The Rival View: Psychological Continuity (The "New Person" Theory)
  There is a competing view that also licenses ADs but for a darker reason. This is the **Psychological Continuity** view (Lockean), championed in bioethics by critics like **Rebecca Dresser**.

  *   **The Theory:** Personal identity *just is* psychological continuity (memory, character, values). Severe dementia severs these ties.
  *   **The Application:** If dementia severs identity, the demented patient is literally a **different person** than the one who signed the AD. Enforcing the AD isn't respecting the patient's prior autonomy; it is respecting the **will of a deceased person** regarding the treatment of a new, vulnerable occupant of that body.
  *   **Consistency Check:** This view actually makes ADs *harder* to justify ethically (why should a dead person's whim harm a living, feeling being?), but it explains the legal intuition that the demented patient's current wishes "don't count." They don't count because *they* (the original self) are gone.

  ### 3. The Revocation Puzzle: Is it Inconsistent?
  You asked: *Why can a competent person revoke at the last minute, but a demented person can't?*

  On the Dworkin/Narrative view, this is consistent. The "Center of Narrative Gravity" requires a competent narrator to maintain or shift the center.
  *   **Competent Revocation:** As long as the narrator is competent, they retain **editorial control**. The narrative is still being written.
  *   **Demented "Revocation":** Once competence is lost, the narrator has lost the capacity to edit. The demented patient asking for food is not "revising the narrative"; they are exhibiting a symptom of the condition the narrative sought to avoid.

  **The Competence Criterion:** You suspected competence is doing all the work. You are right. But competence is not identity-neutral. To declare someone "incompetent" is to make a judgment that their current mental states do not reflect their "true self." Therefore, the competence criterion *presupposes* a theory of the self (one where the "true self" is the rational, planning agent, not the experiencing subject).

  ### 4. What if a Court Took Dennett Seriously?
  This is the most interesting part for your paper. Dennett's "Center of Narrative Gravity" is a **fictionalist** account. The self isn't a deep metaphysical entity; it's an abstraction, like a center of gravity in physics. It's a useful posited point to organize behavior and story.

  If a court took Dennett's view *seriously* (rather than just using it as a metaphor for Dworkin), two things might change:

  **A. The "Bright Line" of Competence Would Blur**
  Dennett's view suggests the self is a gradient, not a switch. Narrative coherence unravels slowly. A strict legal competence test is binary (competent/incompetent). A Dennettian court would have to ask: *To what degree is the current patient still generating a narrative?*
  *   **Current Practice:** Patient says "I'm hungry." Court says "Incompetent wish, ignore."
  *   **Dennettian Practice:** Court asks, "Is 'I'm hungry' part of a coherent, albeit simplified, narrative of survival?" If the demented self is still weaving a story (even a simple one), Dennett's view grants it more ontological weight than the Dworkin view does. It might lead to **negotiated care** rather than strict directive enforcement.

  **B. The "Author" Might Change**
  Dennett emphasizes that the narrative is often co-authored by the community. In dementia, the patient can no longer sustain the narrative alone; the caregivers become co-authors.
  *   **Current Practice:** Caregivers must enforce the *past* author's script.
  *   **Dennettian Practice:** Caregivers are active participants in the *current* center of gravity. If the current narrative (patient + caregiver) is one of comfort and feeding, and the past narrative is one of "dignity at all costs," a Dennettian court might weigh the **current narrative coherence** more heavily. It could actually weaken ADs, prioritizing the "story being lived now" over the "story drafted then."

  ### 5. The "Framing is Off" Check (The Legal Realist Critique)
  You asked me to be honest if this is just about evidence. Here is the Legal Realist counter-argument you must address to make your paper bulletproof:

  **The Law is Pragmatic, Not Metaphysical.**
  Courts do not care if the demented patient is metaphysically the same person. They care about **administrability** and **risk**.
  *   **Evidentiary Problem:** It is hard to know what a demented patient "really" wants. Their requests might be impulses, not values. The written AD is hard evidence.
  *   **Risk Aversion:** If doctors honor the demented patient's request for food over the AD, and the patient suffers, the doctor is liable. If they honor the AD and the patient seems happy, the doctor is protected.
  *   **The "Self" as a Legal Construct:** The law *creates* the self it needs. It constructs a "legal person" who is rational and forward-looking. When biology fails that construct, the law freezes the last valid instance of that construct.

  **Advice for your paper:** Do not argue that the law *is* committed to Dennett or Dworkin. Argue that the law *cannot function* without *some* theory of the self, and that currently, it relies on a **hybrid of Dworkin's Critical Interests and a Psychological Continuity threshold.**

  ### Summary for your Term Paper
  1.  **Thesis:** The enforceability of Advance Directives presupposes a **Dworkinian "Critical Interests" theory of the self**, where the temporally extended life narrative trumps momentary experiential states.
  2.  **Counter-point:** This is in tension with **Psychological Continuity** views (like Dresser's), which would suggest the demented self is a new entity with new rights. The law rejects this to avoid the ethical horror of letting a "new" person consume the resources of the "old" person's life plan.
  3.  **Dennett's Disruption:** If courts adopted Dennett's **Narrative Gravity** literally, it would destabilize the binary competence test. It would force courts to evaluate the *coherence of the current narrative* rather than simply deferring to the *last competent draft*. This would likely make ADs harder to enforce rigidly.
  4.  **Consistency:** The practice is consistent *if* you accept that "Competence" is the proxy for "Authorship." You can edit the story while you are the Author. When you lose Authorship (competence), the last draft stands.
  5.  **Conclusion:** The law treats the self as a **legal fiction of continuity** that is terminable by incapacity. It is not solving the metaphysical problem of identity; it is solving the administrative problem of authority by using identity concepts as tools.

  This is a strong, viable topic. You aren't chasing ghosts; you're chasing the metaphysical assumptions hidden in procedural rules. Go for it.
