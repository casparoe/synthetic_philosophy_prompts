  **The 90-Minute "Bias-Aware" Elicitation Protocol**

  **Phase 1: Calibration (0–20 min)**
  Start with stakes at 1% of the decision magnitude. Use physical props (cards/chips). Ask: "Take $50k sure or flip for $120k?" Adjust until indifference. Goal: Establish they understand "indifference," not just "preference." If they hedge, say: "Pick the one you'd be annoyed to lose if I swapped them."

  **Phase 2: Core Curve (20–50 min)**
  Present five 50/50 gambles spanning the outcome range. Record Certainty Equivalents (CE).
  *   *Rule:* If CE shifts >10% on re-ask, mark as "high noise." Do not average yet.
  *   *Order:* Low stakes first, high stakes last. Fatigue increases risk aversion.

  **Phase 3: Independence Stress Test (50–70 min)**
  Present two paired choices sequentially.
  *   *Choice 1:* A (Sure $X) vs. B (Gamble $Y/$Z).
  *   *Choice 2:* A' (0.1 chance of A) vs. B' (0.1 chance of B).
  *   *Detection:* If A preferred to B, but B' preferred to A', you have an independence violation.
  *   *Probe:* "Does the 90% chance of nothing make the gamble feel cheaper?" If yes, it's framing, not noise.

  **Phase 4: Resolution (70–90 min)**
  *   *Noise:* Use median CE.
  *   *Violation:* Ask: "Which scenario matches your actual accountability?" Model only that frame.
  *   *Stop:* If they insist both frames are valid yet contradictory, abort the utility curve. Advise based on risk capacity (bankruptcy limits), not preference.

  **Case 1: The CEO (Common Consequence)**
  She prefers Sure $1M over 50/50 $2.5M, but flips when wrapped in a coin flip.
  *   *Analysis:* Phase 3 flags the violation. She claims consistency because the "coin flip" makes the $2.5M feel like bonus money, whereas the sure $1M feels like budget.
  *   *Unpleasant Answer:* You cannot fit a single utility curve. Her utility is reference-dependent. You must tell her: "Your risk tolerance changes based on how you label the money."
  *   *Action:* Model using the "budget" frame (Sure $1M preference) because it aligns with fiduciary duty. Discard the "bonus" frame as behavioral noise. She won't like being told her "bonus" intuition is invalid for corporate strategy, but you cannot bake both into one model.

  **Case 2: The Risk Manager (Reverse Allais)**
  He rejects favorable long shots but accepts terrible odds above a threshold.
  *   *Analysis:* Phase 2 shows a kinked CE curve. Phase 3 confirms a probability threshold (e.g., p=0.15). Below 0.15, utility is zero.
  *   *Action:* Do not force exponential utility. Use a step-function probability weight. He treats p<0.15 as zero and p>0.15 as "possible."
  *   *Failure:* The procedure assumes you can aggregate this for the board. You can't. His threshold is arbitrary. You must hard-code his bias as a constraint ("No projects with p<0.15"), not a preference. This limits corporate opportunity based on one man's psychology.

  **Where This Fails**
  1.  **Intransitivity:** If A>B, B>C, and C>A, no reframing fixes this. You must stop and declare the decision undefined.
  2.  **The Deliverable Trap:** The procedure will tell you to abort the utility curve if violations persist. You won't like this because you need a deliverable. You will be tempted to smooth the data anyway. Don't.
