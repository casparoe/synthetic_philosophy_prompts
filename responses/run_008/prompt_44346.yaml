      **Phase 1: Calibration (0–20 min)**
      Start with stakes at 1% of the decision magnitude. Use physical props (cards/chips). Ask: "Take $50k sure or flip for $120k?" Adjust until indifference. Goal: Establish they understand "indifference," not just "preference." If they hedge, say: "Pick the one you'd be annoyed to lose if I swapped them."

