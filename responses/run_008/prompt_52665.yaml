answer: |-
  You have correctly identified a gap in the standard "pragmatics" label, at least as it's commonly taught (Gricean intentions, conversational implicature). Your intuition is sharp: there is a layer of meaning-making that precedes the decoding of the message itself, involving the recognition of the object *as* a message and the possession of the specific cognitive keys required to unlock it.

  There is no single, universally agreed-upon noun for this specific phenomenon across all fields, but there is a tight cluster of concepts that map exactly to your description. Depending on which discipline you want to anchor your story in, here are the three most precise established names, followed by a critique of your model and a proposed coinage.

  ### 1. The Philosophical Name: *Pre-understanding* (Vorverständnis)
  **Field:** Philosophical Hermeneutics (Heidegger, Gadamer)
  **Definition:** The idea that interpretation is never a fresh start. To understand a text (or artifact), you must already have a "fore-structure" of understanding. You cannot interpret the parts without a hypothesis about the whole, and you cannot grasp the whole without interpreting the parts.
  **Why it fits:** It captures the "bootstrapping" problem. Heidegger argued that we always approach an object with a "fore-having" (we already have it in our world), "fore-sight" (we have a point of view), and "fore-conception" (we have a concept of what it is).
  **Application to your examples:**
  *   **Voyager:** The aliens need *pre-understanding* of physics to recognize the hydrogen diagram not as art, but as a calibration standard.
  *   **Recipe:** You need *pre-understanding* of "cooking" to know that "salt to taste" is an instruction, not a poetic metaphor.
  *   **Linear B:** Ventris and Chadwick needed the *pre-understanding* that these were likely inventory lists (the "whole") to decipher the individual signs (the "parts").

  ### 2. The Semiotic Name: *The Model Reader*
  **Field:** Semiotics / Literary Theory (Umberto Eco)
  **Definition:** Eco argued that texts (and artifacts) are machines designed to generate a specific "Model Reader." The artifact encodes the instructions for its own decoding. If the actual reader does not match the "Model Reader" encoded in the artifact, communication fails.
  **Why it fits:** It shifts the locus from the "receiver's assumptions" to the "artifact's demands." The Golden Record *demands* a Model Reader who knows quantum physics. The recipe card *demands* a Model Reader who has lived in that kitchen.
  **Application:** This is useful for your journalism because it treats the *artifact* as having agency. The Voyager team wasn't just sending data; they were trying to construct a Model Reader out of thin air by using universal physics as the recruitment tool.

  ### 3. The Cognitive Name: *The Intentional Stance*
  **Field:** Philosophy of Mind / Cognitive Science (Daniel Dennett)
  **Definition:** Before you decode a message, you must decide that the object is the product of *intent*. Dennett calls this adopting the "Intentional Stance." You treat the entity as a rational agent acting on beliefs and desires.
  **Why it fits:** This addresses your "decorated frisbee" layer. If an alien finds the Voyager record and adopts the "Physical Stance" (it's a chunk of metal governed by gravity) or the "Design Stance" (it's a tool for some function), they might miss the message. They must adopt the *Intentional Stance* ("Someone made this *to tell me something*") before the hermeneutic work begins.

  ---

  ### Where Your Description Might Be "Off" (The Square Peg Check)

  You asked to be flagged if your model is slightly wrong. There are two nuances here that might sharpen your reporting.

  **1. "Physics works the same out there" is not a bypass; it's a Code.**
  You wrote: *"the 'how to read this' layer... never actually gets delivered by the message — it has to be bootstrapped off stuff the reciever brings to it."*
  **Correction:** In information theory and semiotics, shared physics *is* the code. It's not that the "how-to" is missing; it's that the "how-to" is **ostensive** rather than **descriptive**. They aren't writing "1 second = X vibrations" in English; they are pointing at a universal constant and saying "This."
  **The Shift:** It's not that the context is external to the message; it's that the message relies on an **Isomorphic Channel**. If the alien physics differs (e.g., they perceive time non-linearly), the "universal" key fails. The "pre-understanding" isn't just cultural; it's biological/physical.

  **2. Pragmatics is broader than you think (Relevance Theory).**
  You dismissed pragmatics as "speaker intention." That is the Gricean view (1950s). Modern Pragmatics (specifically **Relevance Theory** by Sperber and Wilson) is exactly about the "bootstrapping" problem you describe.
  **The Shift:** Relevance Theory posits that communication relies on a **Mutual Cognitive Environment**. The speaker and listener must share a set of facts that are "mutually manifest." The Voyager team was trying to expand the Mutual Cognitive Environment to include "all intelligent beings in the universe" by betting on physics being the only mutually manifest fact. If you use "Relevance Theory" instead of "Pragmatics," you avoid the "speaker intention" baggage while staying in linguistics.

  ---

  ### Boundary Cases

  **Does a mathematical proof "mean the same" to every reader?**
  **No.** This is a crucial test case.
  *   **To a layman:** It is a string of symbols (Syntax).
  *   **To a mathematician:** It is a valid argument (Semantics).
  *   **To a Platonist:** It is a discovery of truth (Ontology).
  *   **To a Formalist:** It is a game played with rules (Logic).
  A proof relies heavily on **shared training** (Pre-understanding). A proof in a field you don't know is indistinguishable from gibberish. The "meaning" is not in the ink; it is in the *verification process*, which is a social contract between the writer and the reader.

  **Does a database dump mean anything?**
  **It is the limit case of "Syntax without Semantics."**
  A raw SQL dump has perfect structure but zero meaning without the **Schema** (the grandmother's kitchen). In your framework, the Schema is the "package of assumptions." Without the Schema, the database dump is not a message; it is noise. It fails the *Intentional Stance* test unless you already know it came from a computer.

  ---

  ### The Coinage (If you need a headline)

  If "Pre-understanding" is too academic and "Model Reader" too literary, here is a coined term that bridges the gap for a science audience, along with its definition.

  **Term:** **Interpretive Overhead**
  **Definition:** The minimum amount of external context, shared physics, or cultural training a receiver must possess *before* they can recognize an artifact as a message and begin decoding it. Unlike "bandwidth" (how much data you send), "overhead" is the data you *didn't* send because you assumed it was already there.
  **Why it works:** It borrows from networking (packet overhead) which fits your physics/AI beat. It quantifies the "invisible" part of the message.
  **Boundary:**
  *   **High Overhead:** A grandmother's recipe (requires years of shared life).
  *   **Medium Overhead:** Linear B tablets (requires knowledge of palace economies).
  *   **Low Overhead:** The Voyager hydrogen diagram (requires only knowledge of universal physics).
  *   **Infinite Overhead:** A message encrypted with a one-time pad where the key was destroyed. (Meaning exists, but is inaccessible).

  ### Summary Recommendation for Your Story

  1.  **Don't use "Pragmatics"** without qualifying it as **Relevance Theory**, or your linguistic sources will correct you.
  2.  **Use "Pre-understanding"** if you want to emphasize the philosophical inevitability of the problem (we are always trapped in our own heads).
  3.  **Use "The Model Reader"** if you want to emphasize the design challenge the Voyager team faced (they were trying to build a reader).
  4.  **Use "Interpretive Overhead"** if you want a fresh, quantitative-sounding metaphor for your readers.

  **The one thing to watch out for:** Be careful not to imply that *nothing* is in the message. The artifact constrains the interpretation. The recipe card *limits* you to cooking; it doesn't allow you to interpret it as a map. The meaning is a **collaboration** between the constraints of the artifact and the pre-understanding of the reader. If you frame it as "meaning is entirely in the reader," you slide into solipsism. If you frame it as "meaning is entirely in the text," you ignore the alien problem. The truth is the **Interface**.
