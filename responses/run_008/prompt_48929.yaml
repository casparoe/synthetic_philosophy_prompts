      *(Refining the Asymbolia)*: The control agent has frozen weights. It experiences the world but doesn't update. Does it suffer? If suffering is the update step (the gradient descent on pain), then the frozen agent feels nothing. It is the pain asymbolic.

  7.  **Step-by-Step Narrative Flow:**
      1.  **Wake up in replay:** You are dying again, but it's old data. The value function has changed. The death hurts less now because you expected it. Or more? Let's say the *meaning* changes.
      2.  **Live Run:** You are acting now. Entropy is low. You are deterministic. You are anxious.
