answer: |-
  Here is the specification you requested. I have structured this as a set of desiderata for a theory of slurs, motivated by the specific moderation cases you face. I have marked each requirement as either **Non-Negotiable** (an adequate theory must account for this) or **Camp Preference** (legitimate theoretical camps disagree on whether this is a requirement).

  ### 1. Inertness at the Level of Truth Conditions
  *   **The Case:** A member posts, "I am a [slur]." A reporter translates this to the panel as, "I am a [neutral counterpart]." The factual content regarding the member's identity is identical. If your policy treats the first as a violation of a "hate speech" rule based on factual falsity, it fails. The sentence is not factually false; it is normatively loaded.
  *   **The Requirement:** The theory must explain how a word can contribute offensive or derogatory force without altering the conditions under which the sentence is true or false. It must locate this force outside the core truth-conditional content (e.g., in expressivism, conventional implicature, or presupposition).
  *   **Status:** **Non-Negotiable.** While some "thick concept" theorists argue slurs *do* change truth conditions, for moderation purposes, you cannot adjudicate the truth of identity claims. You must treat the harm as separate from the fact.

  ### 2. Projection
  *   **The Case:** A user writes, "If the new hire is a [slur], we should move him to a different team." Even if the new hire is *not* a member of that group (making the antecedent false), the sentence still broadcasts hostility toward the group. The toxicity survives the negation or conditional embedding.
  *   **The Requirement:** The theory must explain why the derogatory content "projects" out of logical operators (negation, questions, conditionals). It cannot be a standard conversational implicature, because those usually vanish under negation.
  *   **Status:** **Non-Negotiable.** This is a robust linguistic datum. If a theory cannot explain why "He isn't a [slur]" is still potentially actionable in a community guideline context, it is insufficient.

  ### 3. Derogation versus Offense
  *   **The Case:** A user types a racial slur into a private draft never intended for publication (Derogation without immediate Offense). Conversely, a user calls another member "idiot" in a heated argument, and the hearer is deeply offended (Offense without Group Derogation).
  *   **The Requirement:** The theory must distinguish between harm done to a group's standing (derogation) and the subjective emotional state of a hearer (offense). Policy cannot rely on the latter as the sole trigger.
  *   **Status:** **Non-Negotiable.** Relying on offense makes policy hostage to the thinnest skin in the room. Relying on derogation allows you to police systemic harm regardless of who is currently online to witness it.

  ### 4. The Same Word in Different Mouths
  *   **The Case:** Your specific dilemma. Member A (target group) writes, "I love being a [slur]." Member B (ally) writes, "I stand with my [slur] friends." The string of characters is identical. The first is reclamation/self-identification; the second is potentially patronizing or appropriative.
  *   **The Requirement:** The theory must account for how the normative force of the word shifts based on the speaker's identity and relation to the target group, without claiming the word itself has changed its dictionary definition.
  *   **Status:** **Non-Negotiable.** Reclamation is a social reality. A theory that says the word is *inherently* toxic in all contexts fails to describe how marginalized communities actually use language to build solidarity.

  ### 5. Use and Mention
  *   **The Case:** A user posts: "The word '[slur]' is prohibited." (Permissible mention). Another user posts lyrics containing the word, claiming it is "artistic quotation," but the context suggests they are signaling alignment with the lyric's sentiment. (Impermissible use disguised as mention).
  *   **The Requirement:** The theory must provide a principled way to distinguish between talking *about* the word and talking *with* the word, while acknowledging that "quotation" can be a pragmatic vehicle for slurring.
  *   **Status:** **Camp Preference.** While the logical distinction is non-negotiable, where the line falls pragmatically is debated. Some theories treat all utterances of the phoneme as toxic; others allow broad quotation exceptions. For your policy, the *distinction* is non-negotiable, but the *boundary* is a preference of enforcement strictness.

  ### 6. Drift
  *   **The Case:** A word used neutrally fifty years ago is a slur today (e.g., specific terms for disability). Conversely, a slur may lose its sting over generations or in specific subcultures.
  *   **The Requirement:** The theory must locate the "slur-ness" in the social practice surrounding the word, not solely in the lexical entry, to allow for historical change.
  *   **Status:** **Non-Negotiable.** Language is diachronic. A static theory cannot account for why a word becomes bannable today when it was not ten years ago.

  ***

  ### The Tension: Projection vs. Reclamation
  You suspected a tension between **Requirement 2 (Projection)** and **Requirement 4 (Variation)**. Your suspicion is correct. This is the central theoretical knot.

  *   **The Conflict:** Projection suggests the derogatory content is *encoded* in the word (semantic/conventional). If it is encoded, it should fire regardless of who speaks it, like the meaning of "dog" or "red." Reclamation suggests the force is *contextual* (pragmatic/social). If it is contextual, it should not project so robustly across negations and conditionals.
  *   **The Verdict:** This tension is real. Most theories sacrifice one to save the other.
      *   *Semantic accounts* handle Projection well but struggle to explain how In-Group use "turns off" the encoded toxicity without changing the word's meaning.
      *   *Pragmatic accounts* handle Reclamation well but struggle to explain why the toxicity survives negation (Projection).
  *   **Resolution for Policy:** You must accept a hybrid view. The word carries a *presumptive* force (explaining Projection) that is *defeasible* based on speaker standing (explaining Reclamation). This means the word is not toxic *simpliciter*; it is toxic *unless* specific social conditions (identity, intent, context) override the presumption.

  ### The Most Exclusionary Requirement
  **Requirement 4 (The Same Word in Different Mouths)** does the most work to exclude candidate theories.

  Many robust semantic theories can handle Inertness, Projection, and Derogation by positing that the word simply *means* "inferior person of group X." But this makes Reclamation impossible (one cannot truthfully call oneself "inferior" in a solidarity context without irony). To satisfy Requirement 4, a theory must move the locus of meaning from the *lexicon* to the *social practice*. This excludes any theory that treats slurs as having fixed, context-independent truth conditions or implicatures.

  ### The Policy Conclusion
  You asked for the point you have to answer for the panel, stated plainly:

  **Given all of the above, can a policy be written about the word, or only about the utterance and the user?**

  **Answer:** You can only write a policy about the **utterance and the user**.

  **Reasoning:**
  If you ban the *word* (the string of characters), you violate Requirement 4 (Reclamation). You will inevitably punish in-group members for self-identification while failing to catch bad-faith actors who use dog whistles or "quoted" lyrics (Requirement 5).
  If you ban the *utterance* based on the *user's relation to the target*, you satisfy Requirement 4. You acknowledge that the harm is not in the phonemes, but in the act of a non-member invoking a history of subordination against a member.

  **Practical Application:**
  Your policy cannot say: *"Posting the string [X] is banned."*
  Your policy must say: *"Using the term [X] to refer to members of Group Y is banned, unless the speaker is a verified member of Group Y engaging in self-reference."*

  This shifts your moderation burden from text-matching to context-evaluation. It is harder to scale, but it is the only approach consistent with an adequate theory of how slurs work.
