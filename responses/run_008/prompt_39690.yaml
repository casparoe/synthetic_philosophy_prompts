  7.  **Refining Confidence Markers:**
      *   Need to explicitly state: "High confidence this is Aquinas," "Moderate confidence," etc.
      *   Must distinguish Aquinas from Suárez or later Scholastics who were more permissive on tyrannicide. Aquinas is often read *through* them. I need to stick to the Angelic Doctor.
      *   *Correction:* Aquinas in *Summa* II-II, Q. 42, Art. 2 says sedition is a mortal sin. In *De Regno*, he discusses removing tyrants. I must be careful not to make him sound like a revolutionary. He prefers patience or public deposition over assassination.

  8.  **Final Review against Constraints:**
      *   Discipline rather than forcing? Yes, acknowledge the friction.
      *   Mark confidence? Yes.
      *   Single out least sure point? Yes.
      *   Reverse analysis? Yes.

