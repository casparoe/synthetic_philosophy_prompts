      *   **Key Questions to Address:**
          *   Is Stauffenberg a private person or an officer invoking public authority?
          *   Does using a false pretext (Valkyrie) count as exercising or counterfeiting authority?
          *   Is Hitler a tyrant by usurpation or by exercise (legitimate origin, tyrannical rule)?
          *   Who is the "higher authority"?
          *   How does Aquinas's prudential warning (worse successor) apply when the regime *is* the destruction?
          *   **Reverse Analysis:** Does the case confirm, strain, or expose silence in Aquinas's framework (specifically regarding corrupted legal orders)?
          *   **Constraint:** Mark confidence levels in attributions to Aquinas (vs. later scholastics/popularization).
          *   **Constraint:** Identify the point of least certainty and explain why.

  2.  **Analyze Aquinas's Framework (Source Verification):**
      *   *Primary Source:* *De Regno* (On Kingship) and *Summa Theologiae* (ST II-II, q. 42, a. 2; q. 64, a. 3).
      *   *Key Distinction:* Private killing vs. Public execution.
      *   *Tyranny Types:* Tyrant by usurpation (no title) vs. Tyrant by exercise (has title, rules badly).
      *   *Remedy:* Public authority (not private presumption). Deposition by the community or superior authority.
      *   *Prudential Warning:* Assassination often leads to worse outcomes (sedition, worse tyrant).
      *   *Confidence Check:* Need to be careful not to attribute the "tyrannicide is permissible" view to Aquinas directly. He is generally cautious. The *De Regno* commentary is sometimes disputed regarding authorship/completeness, but the *Summa* is solid. The idea that "private killing of a tyrant is condemned" is high confidence. The idea that "public authority can depose" is high confidence. The nuance on "usurpation vs. exercise" is in *De Regno*.

  3.  **Map the 20 July Plot to the Framework:**

      *   **Stauffenberg's Status:** He is a Colonel (public officer), but acting within a chain of command ultimately headed by Hitler. Is he "private"? In Aquinas's terms, a soldier acting *contra* the sovereign without sovereign mandate is effectively private, *unless* he represents a competing public authority.
      *   **The Pretext (Valkyrie):** They used a legal order (Valkyrie) but lied about the trigger (SS coup vs. Hitler dead). Aquinas cares about the *source* of authority. If the authority is derived from the tyrant (Hitler commissioned the officers), can it be turned against him? This strains the framework.
      *   **Hitler's Status:** Elected/Appointed legally (Enabling Act), then dismantled the law. This is a Tyrant by Exercise, not Usurpation (initially). Aquinas is stricter on removing Tyrants by Exercise than Usurpation.
      *   **Higher Authority:** The German People? The Army? God? Aquinas speaks of a "superior" (like an Emperor over a King). In the Reich, Hitler *was* the superior. The conspirators appealed to "Germany" or "Conscience," which are abstract, not institutional "higher authorities" in Aquinas's feudal sense.
      *   **Prudential Warning:** The regime was already genocidal. The "worse successor" argument weakens when the current ruler is apocalyptic. However, the coup failed, leading to *more* tyranny (Festung Europa, summary executions). This ironically confirms Aquinas's warning about the *risk*, even if the *intent* was just.

  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the gravity of the case and the specificity of the Thomistic lens.
      *   **Status of the Agent (Stauffenberg):**
          *   Aquinas: Private killing = sin. Public authority = permissible.
          *   Application: Stauffenberg is an officer, but his commission flows from Hitler. Without Hitler's removal by a *superior*, is he private?
          *   *Confidence:* High on Aquinas's principle; Moderate on application.
      *   **Nature of the Tyranny (Hitler):**
          *   Aquinas: Usurper (no title) vs. Legitimate turned Tyrant.
          *   Application: Hitler is the latter. Harder to remove licitly.
          *   *Confidence:* High.
      *   **The Mechanism (Valkyrie/Pretext):**
          *   Aquinas: Authority must be real, not presumed.
          *   Application: Using a standing order under false pretenses looks like "private presumption" cloaked in public uniform.
          *   *Confidence:* High.
      *   **The Higher Authority:**
          *   Aquinas: Needs a superior (feudal/Imperial).
          *   Application: No institutional superior existed. They appealed to Natural Law/God.
          *   *Confidence:* High on Aquinas's requirement; Moderate on whether Natural Law counts as "authority" for deposition.
      *   **Prudential Calculation:**
          *   Aquinas: Don't risk worse tyranny.
          *   Application: The Nazi regime *was* the worse tyranny. But the failure caused immediate worsening.
          *   *Confidence:* High.

  5.  **Reverse Analysis (Testing the Framework):**
      *   Does the case confirm or strain?
      *   It strains the "Public Authority" requirement. When the Public Authority *is* the Tyrant, where does the licit power to remove come from? Aquinas suggests the "community" or a "superior." In a totalitarian state, the community is suppressed, and there is no superior.
      *   Silence: Aquinas doesn't fully address a legal order that has legally suicide-pacted itself to a tyrant (Enabling Act).

  6.  **Identifying the Point of Least Certainty:**
      *   Where am I shaky? It's usually around the interpretation of *De Regno* vs. *Summa* and the specific definition of "Public Authority" in a modern state vs. a medieval kingdom.
