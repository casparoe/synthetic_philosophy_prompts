answer: |-
  ### Case Analysis: The 20 July Plot Through a Thomistic Lens

  This analysis maps the 20 July 1944 conspiracy against Thomas Aquinas's political theology, specifically drawing from *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3) and *De Regno* (On Kingship). The goal is not to vindicate or condemn the conspirators by modern standards, but to test the coherence of their actions against Aquinas's specific constraints on authority, tyranny, and prudence.

  #### I. Mapping the Episode to the Framework

  **1. The Agent: Private Presumption or Public Authority?**
  Aquinas establishes a high-confidence principle in *Summa Theologiae* II-II, q. 64, a. 3: the power to kill lies solely with public authority acting for the common good. A private individual who kills even a criminal (or tyrant) on their own presumption commits sin, usurping a power not given to them.

  *   **Analysis:** Stauffenberg was a serving officer, but his commission derived from the very authority he sought to destroy. In Aquinas's feudal context, an officer acts as an extension of the sovereign's will. By turning that commission against the sovereign without a mandate from a *superior* sovereign, Stauffenberg functionally reverts to the status of a "private person" regarding this specific act.
  *   **The Valkyrie Pretext:** The conspirators invoked Operation Valkyrie, a legal contingency plan. However, they activated it under a false pretext (claiming the SS had killed Hitler, when they had attempted to kill him). For Aquinas, the legitimacy of an act depends on the truth of the authority's intent. Using the machinery of the state under a lie is not exercising public authority; it is counterfeiting it. It treats the *form* of law as a tool for private judgment.
  *   **Confidence:** **High.** Aquinas is explicit in the *Summa* that private presumption in killing is sinful, regardless of the victim's guilt.

  **2. The Target: Tyrant by Usurpation or by Exercise?**
  In *De Regno* (Book I, Chapter 6), Aquinas distinguishes between a tyrant by usurpation (who seizes power without title) and a tyrant by exercise (who holds title justly but rules unjustly).

  *   **Analysis:** Hitler was not a usurper in the strict Thomistic sense. He was appointed Chancellor legally and consolidated power through the Enabling Act, which was passed by the Reichstag. He subsequently dismantled the legal order, but his *title* remained legally continuous. Aquinas is significantly more permissive regarding resistance to a usurper than to a legitimate ruler who degenerates. Against a legitimate ruler turned tyrant, Aquinas advises caution, fearing that removing him may violate the fidelity owed to the office itself.
  *   **Confidence:** **High.** The distinction is clearly drawn in *De Regno* I.

  **3. The Higher Authority: Who Deposes?**
  Aquinas argues in *De Regno* that if a tyrant is not a usurper, he cannot be deposed by private individuals, but only by a "higher authority" (*superior potestas*) or by the community that originally appointed him (if such a right was reserved).

  *   **Analysis:** This is the critical fracture point. In the Holy Roman Empire, an Emperor could depose a King. In the Third Reich, Hitler *was* the supreme authority (*Führerprinzip*); there was no institutional superior. The conspirators appealed to "Germany" or "Conscience." While Aquinas allows for the community to act if it reserved the right of deposition, the Nazi state had effectively dissolved the political community into the person of the Leader. The Resistance was a faction, not an institutional embodiment of the community.
  *   **Confidence:** **Moderate.** While Aquinas posits a "higher authority," the application to a totalitarian state where no such authority exists institutionally is an extrapolation.

  **4. The Prudential Warning: The Risk of Worse Tyranny**
  Aquinas warns (*De Regno* I, 6) that killing a tyrant often provokes greater tyranny, either through the anger of the tyrant's faction or because the successor is worse. He prioritizes the *common good* over the removal of the evil individual if the removal causes greater harm.

  *   **Analysis:** This is where the case strains the framework. Aquinas assumes a regime where the tyrant is an aberration. In 1944, the regime *was* the engine of destruction. The "worse successor" argument loses force when the current ruler is committing genocide. However, the *outcome* of the plot ironically validates Aquinas's prudential caution: the failure led to the "Festung Europa" mentality, the People's Court (*Volksgerichtshof*), and intensified terror. The attempt to remove the tyrant resulted in the immediate worsening of the condition for the conspirators and their associates.
  *   **Confidence:** **High.** The prudential argument is central to Aquinas's hesitation on tyrannicide.

  ---

  #### II. Reverse Analysis: Testing the Framework

  Does the 20 July plot confirm, strain, or expose silence in Aquinas's framework?

  **1. The Silence on Corrupted Legal Orders**
  Aquinas's framework exposes a genuine silence regarding a legal order that has legally suicide-pacted itself to a tyrant. Aquinas assumes a feudal or corporate structure where authority is layered (King, Emperor, Community). He does not fully account for a sovereign state where the "public authority" is monopolized by the tyrant, and the "community" has no legal mechanism to speak.
  *   **The Strain:** If the "public authority" required to licitly kill the tyrant is *held* by the tyrant, Aquinas provides no clear licit pathway for removal other than patience or prayer, unless a foreign superior (an invading ally?) intervenes. The 20 July plotters tried to *simulate* public authority because the real public authority was inaccessible. This suggests Aquinas's framework lacks a mechanism for "emergency deposition" when the legal order is weaponized against the common good it is meant to serve.

  **2. Confirmation of Prudential Risk**
  The case confirms Aquinas's prudential warning, even if it rejects his prohibition on private action. The failure of the plot demonstrates the volatility Aquinas feared. The "sin" of private presumption (in Thomistic terms) correlated with the practical failure that endangered the common good further.

  **3. The Nature of the "Community"**
  The plot challenges Aquinas's notion of the "community" retaining the right to depose. The German Resistance was not a parliament or a guild; it was a secret network. Aquinas does not define how a "community" acts when its public square is abolished. The plotters claimed to represent the "true Germany," but in Thomistic terms, without public recognition, they remained a private faction.

  ---

  #### III. Point of Least Certainty

  **The Attribution:** The specific capacity of the "community" to depose a legitimate ruler turned tyrant without a superior authority.

  **Confidence Level:** **Low to Moderate.**

  **Reasoning:**
  I am least sure of myself on whether Aquinas genuinely grants the "community" the active right to depose a non-usurping tyrant, or if this is a later Scholastic elaboration (e.g., by Suárez or John of Paris) often retroactively attributed to Aquinas.
  *   *Why:* The text of *De Regno* Book II, where the discussion of tyranny is most detailed, is widely suspected by philologists to be completed or heavily edited by Ptolemy of Lucca after Aquinas's death. While *Summa* II-II, q. 42 condemns sedition, *De Regno* suggests deposition is possible. There is a tension here. If *De Regno* II is not purely Aquinas, then the "community right of deposition" might be a later development of the Thomistic school rather than Aquinas's own view.
  *   *Impact on Analysis:* If Aquinas himself did not endorse the community's right to depose a legitimate ruler, then the 20 July plotters have even less Thomistic cover than analyzed above, rendering them entirely "private presumers" in his eyes, regardless of their representation of the "people." I have flagged this as Moderate confidence in the analysis above, but it is the weakest link in applying his thought to this case.

  ### Summary for Seminar Use
  *   **Framework Fit:** The plot fits Aquinas's *warnings* (prudential risk) better than his *permissions* (lack of public authority).
  *   **Key Tension:** The distinction between "Private Person" and "Public Authority" collapses when the Public Authority is the Tyrant. Aquinas offers no clear "emergency valve" for this scenario.
  *   **Pedagogical Value:** The case exposes the limits of medieval political theology when applied to modern totalitarianism, specifically the problem of a legal order that legitimizes its own destruction.
