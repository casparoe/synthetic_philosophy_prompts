      *   *Move 3 (Brother):* Subtler point: Information Cascades. Rational agents weight their private signal (meal) against public signal (rating). Early bad luck drags average down; later rational people ignore their good meal because the public signal is stronger. Result: Lock-in of early noise.
      *   *Move 4 (Sister):* Cuts both ways (inflation possible). Also, engineering fixes exist (recency weighting, hiding averages). It's an engineering problem, not a deep rationality problem.
