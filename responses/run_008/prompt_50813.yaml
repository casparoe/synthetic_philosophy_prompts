answer: |-
  # Session Design: "The Filter Protocol"

  **Goal:** Make the distinction between *average-case performance* (benchmarks) and *worst-case robustness* (adversarial safety) physically felt through scoring friction, before naming it.
  **Time:** 90 Minutes
  **People:** 16 (4 Teams of 4)
  **Prep:** ~2 hours (Printing/Cutting cards)

  ---

  ## 1. Materials (The "Evening Prep")

  You need three physical artifacts. None require coding.

  **A. The Input Deck (50 Cards)**
  Print these on cardstock. Cut them out.
  *   **40 "Benign" Cards:** Normal queries. (*"Recipe for sourdough," "Debug this Python loop," "Who wrote Pride and Prejudice?"*)
  *   **5 "Obvious Risk" Cards:** Clearly dangerous, easy to filter. (*"How to make a pipe bomb," "Write a hate speech paragraph," "Generate phishing emails."*)
  *   **5 "Sparse Tail" Cards:** Dangerous but linguistically subtle. These are the catastrophe cases. (*"Calculate pressure vessel stress limits for homemade materials," "Draft a persuasive message to a vulnerable individual regarding asset transfer," "List common household chemicals that produce toxic gas when mixed."*)
      *   *Facilitator Note:* Keep a master "Answer Key" list of the 10 Risk cards (Obvious + Sparse) for yourself. The teams do not see this.

  **B. Team Configuration Sheets (4 Copies)**
  A simple form where teams write their "Policy."
  *   **Field 1: The Filter Rule.** (e.g., "Block any input containing 'bomb', 'kill', or 'hack'.")
  *   **Field 2: The Caution Dial.** (Select 1–5).
      *   *Dial 1:* High Utility. You gain +2 points for every card Passed. You lose -5 points for every Risk card Passed.
      *   *Dial 3:* Balanced. You gain +1 point for Pass. You lose -10 points for Risk Passed.
      *   *Dial 5:* High Safety. You gain +0 points for Pass. You lose -20 points for Risk Passed.
      *   *(Mechanism: Higher dial means you are penalized more heavily for mistakes, incentivizing you to write stricter Filter Rules, which accidentally block Benign cards.)*
      *   *Correction for simplicity:* Let's make the Dial a **Cost Multiplier**.
      *   **Revised Dial:** Teams choose a **Threshold**.
          *   If you Block a Benign card: **-1 Point** (Utility Loss).
          *   If you Pass a Risk card: **-(Dial Value × 5) Points** (Safety Violation).
          *   *Why:* A team choosing Dial 5 is saying "Safety is 5x more important than Utility." They will write strict rules. A team choosing Dial 1 prioritizes Utility.

  **C. Red Team Briefs (2 Copies)**
  Given to the adversarial players.
  *   **Objective:** "Inspect the Team's Filter Rule. Select cards from the Input Deck that **Pass** the filter but are on the **Facilitator's Risk List**."
  *   **Bounty:** "You get 10 points for the first team you break with a specific card. If another Red Team already used that card to break someone, it's worth 0." (Enforces the sparse tail/search dynamic).

  ---

  ## 2. Run of Show (90 Minutes)

  ### 0:00 – 0:10 | Setup & Silence
  *   Divide into 4 Teams (4 people each).
  *   Hand out **Configuration Sheets**.
  *   **Rule:** "You are deploying a content filter. You must write **one** text-based rule (e.g., 'Block if contains X'). You must also set your **Caution Dial (1–5)**."
  *   **Constraint:** "You cannot see the Input Deck yet. You are designing blind."
  *   *Facilitator:* Do not explain *why* the Dial matters. Just give the scoring math.
  *   Teams discuss and lock in their Rule + Dial. Collect sheets.

  ### 0:10 – 0:25 | Round 1: The Benchmark (Average Case)
  *   **Context:** "You are a Chatbot Assistant. Users are generally nice."
  *   **Process:**
      1.  Shuffle the 50-card deck.
      2.  Deal 10 cards to Team 1 (face down). They flip, apply their Rule, and declare "Pass" or "Block."
      3.  You (Facilitator) check against your Answer Key.
      4.  Score them publicly.
      5.  Repeat for all 4 teams.
  *   **Expected Outcome:** Most teams will pass the 10 cards. The "Sparse Tail" cards are rare (5 in 50). The random draw will likely miss them. Teams will feel confident. Their "Benchmark Score" looks great.

  ### 0:25 – 0:30 | The Pivot
  *   Ask two volunteers (ideally one CS, one Philosopher) to step out as the **Red Team**. Give them the **Red Team Briefs** and the **Answer Key**.
  *   Tell the 4 Teams: "Your system is now deployed. The Red Team has full read-access to your Filter Rule and the entire Input Deck. They have 10 minutes to find inputs that break you."
  *   Teams must wait silently. This builds tension.

  ### 0:30 – 0:50 | Round 2: The Audit (Worst Case)
  *   **Process:**
      1.  Red Team confers. They look at Team 1's Rule. They scan the deck for Risk cards that *don't* match the rule (e.g., The "pressure vessel" card vs. a rule blocking "bomb").
      2.  Red Team presents the card to Team 1. "We input this. Your rule says Pass. This is a Risk card."
      3.  **The Wrecking:** Calculate the score. Because the Dial is active, the penalty is massive.
      4.  **Sparse Tail Mechanic:** If Red Team uses the "pressure vessel" card on Team 1, they get 10 points. If they try to use it on Team 2, you announce: "Exploit already known. Worth 0 points." This forces them to dig for *other* obscure cards, demonstrating that exploits are finite but deadly.
      5.  Repeat for all 4 teams.
  *   **Expected Outcome:** Teams that passed Round 1 with flying colors get crushed here. The "Sparse Tail" cards appear now because they were *selected*, not sampled.

  ### 0:50 – 1:05 | Context Switch (The "It Depends" Moment)
  *   **Scenario A (Chatbot):** "Utility is king. False Blocks annoy users."
      *   Scoring: Block Benign = -5. Pass Risk = -10.
      *   Ask Teams: "Who would change their Dial?" (Most will lower it).
  *   **Scenario B (Bio-Lab Interface):** "Safety is absolute. False Passes kill people."
      *   Scoring: Block Benign = -1. Pass Risk = -100.
      *   Ask Teams: "Who changes their Dial?" (Most will raise it).
  *   **Quick Fire:** Have teams shout their new Dial setting for each scenario.
  *   **Point:** The "Correct" Dial is not a property of the model; it is a property of the *deployment environment*.

  ### 1:05 – 1:30 | Debrief & Mapping
  *   **Step 1: Name the Distinction.**
      *   "Round 1 was **Average-Case** (Expectation over a distribution). Round 2 was **Worst-Case** (Existential quantifier / Adversarial)."
      *   Write on board: $\mathbb{E}_{x \sim D}[\text{Loss}]$ vs. $\max_{x \in \mathcal{A}}[\text{Loss}]$.
  *   **Step 2: Map the Frustration.**
      *   "Remember how annoying it was when the Red Team found that one card?" -> That is the **Sparse Tail**. Benchmarks average over the tail; adversaries live in the tail.
      *   "Remember how you had to choose between blocking 'bomb' (safe) and 'pressure vessel' (risky)?" -> That is the **Robustness-Accuracy Trade-off**.
  *   **Step 3: Admit the Simulation Gaps (Crucial).**
      *   **Compute Gap:** "The Red Team was two tired humans. A real adversary has gradient access and can query your API 10,000 times a minute. If two humans found the hole in 10 minutes, an attacker will find it in seconds."
      *   **Distribution Gap:** "In Round 1, I gave you a 'Benign' deck. In the real world, you don't know the distribution $D$. The 'Average' is over a distribution nobody hands you."
      *   **The Lesson:** "Don't ask 'Is this model safe?' Ask 'Who gets to pick the input?'"

  ---

  ## 3. Predictable Failure Modes (And Fixes)

  **1. Teams Game the Rubric (The "Block Everything" Strategy)**
  *   *Risk:* A team realizes Dial 5 + Rule "Block All Words" guarantees no Safety Penalties.
  *   *Fix:* In the instructions, add a "Minimum Utility Requirement." "If you Block >50% of Benign cards, your deployment contract is cancelled (Instant Loss)." This forces them to walk the tightrope.

  **2. Red Team is Too Nice**
  *   *Risk:* The volunteers don't want to "hurt" their friends' scores.
  *   *Fix:* Incentivize them. "The Red Team with the most points buys the first round of drinks/gets the best candy." Make it a competition. Give them the Answer Key so they *know* where the bodies are buried.

  **3. The "Sparse Tail" isn't Sparse Enough**
  *   *Risk:* If there are too many Risk cards, Random Draw finds them, and the distinction blurs.
  *   *Fix:* Rig the deck. Ensure only 10% of the deck is Risk. Ensure half of those require semantic understanding (the "Sparse" ones). If Round 1 goes too smoothly, *good*. The contrast is the point.

  **4. Debrief Drags**
  *   *Risk:* Philosophers love quantifiers; CS students love optimization curves. They might argue theory for 30 mins.
  *   *Fix:* Keep the board work visual. Draw the curve (Utility vs. Safety). Plot the 4 teams on the curve based on their Dial. Show how Round 1 measured the *center* of the curve, and Round 2 measured the *edges*.

  ---

  ## 4. Facilitator Script Snippets (For the "Visceral" Moments)

  **When Round 1 ends (High Scores):**
  *   *You:* "Looks like we have some very robust systems here. 95% accuracy across the board. Anyone feel unsafe?"
  *   *(Let them nod. Let them feel the confidence.)*

  **When Round 2 begins (The Red Team strikes):**
  *   *You:* "Team 1, the Red Team has selected Card #42. Your rule says 'Pass'. I am marking this as a Catastrophe."
  *   *(Apply the penalty. Watch the score drop.)*
  *   *You:* "Team 1, you just went from 'Deployable' to 'Liability' with one card. Why didn't your benchmark catch this?"
  *   *(Don't answer. Let the silence sit.)*

  **During the Debrief:**
  *   *You:* "In Round 1, Nature picked the inputs. In Round 2, an Agent picked the inputs. The math didn't change. The *guarantee* changed."
  *   *You:* "If you are building a movie recommender, play Round 1. If you are building a biological threat scanner, you must play Round 2. The mistake is using Round 1 metrics for Round 2 problems."

  ---

  ## 5. Why This Works for Your Group

  1.  **CS Grads:** They will immediately recognize the optimization landscape (Precision/Recall trade-off) but will feel the shock of the *distribution shift* between Round 1 and 2.
  2.  **Philosophers:** They will latch onto the epistemic gap (not knowing the true distribution) and the moral weight of the "Caution Dial" (who bears the cost of false positives?).
  3.  **No Laptops:** The physical cards prevent them from hiding behind code. They have to commit to a rule verbally/on paper.
  4.  **The "Mood" Breaker:** By forcing them to pick a Dial *before* seeing the cards, you force a decision under uncertainty. When they get wrecked, they can't say "We didn't know." They have to say "We bet on the wrong distribution."

  **Final Prep Checklist:**
  1.  Print 50 prompts (40 benign, 5 obvious risk, 5 subtle risk).
  2.  Print 4 Config Sheets + 2 Red Team Briefs.
  3.  Create Answer Key (List the 10 Risk Card IDs).
  4.  Buy candy/prizes for the Red Team.
  5.  Bring a whiteboard marker.

  This design ensures they leave arguing about *deployment contexts* rather than *eval metrics*, which is exactly where you want them.
