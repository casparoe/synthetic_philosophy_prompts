      *   *Conclusion:* It's not "irrational" in the sense of stupidity, but "rationally trapped." The irrationality lies in *entering* the escalation without a pre-commitment strategy, not necessarily in the specific escalation steps once trapped. However, one could argue that failing to anticipate the trap *ex ante* is the irrationality.
      *   *Nuance:* "Irrational" is too blunt. "Suboptimal equilibrium" or "Escalation of Commitment" is better.

  4.  **Identify Missing Factors for Next Year:**
      *   **Reputation/Goodwill:** Anna and Ben are committee members. Making them lose money (even for charity) might cause friction.
