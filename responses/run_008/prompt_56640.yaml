      *   *Tone:* Objective, analytical, game-theoretic but accessible.
      *   *Key Concept:* Martin Shubik's Dollar Auction.

      *(Self-Correction during drafting)*: I need to be careful with Anna's first claim. She says "money already committed was gone either way." In a standard auction, yes. In *this* auction, if you are the second highest, the money is *not* gone if you become the highest. It is converted from a loss to a (potentially smaller) loss. So Anna is wrong on the mechanics of the sunk cost here. The sunk cost is recoverable *if* you win. Ben is right on the mechanics.
