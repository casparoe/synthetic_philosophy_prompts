answer: |-
  ## The Stealability Audit (1-Hour Decision Procedure)

  This procedure converts the "strategy-stealing assumption" into an operational checklist. It is designed to filter capabilities into three buckets: **Ship** (Stealable), **Restrict** (Partially Stealable), or **Escalate** (Unstealable/Dangerous).

  **Time Budget:** 60 Minutes.
  **Inputs:** Capability Report, Model Card, Internal Benchmarks.
  **Output:** A recommendation with a specific justification for the Product/Exec team.

  ### Part 1: The Triage Questions (30 Minutes)

  Answer these four questions in order. If you hit a "Stop" condition, move immediately to Part 2. Do not proceed to the next question if the previous one triggers an escalation.

  **Q1: The "Recipe" Test (Replicability)**
  *   **Question:** If we publish the results of this capability (e.g., the protein sequence, the code, the analysis), can a competitor or public coalition use *that output* without needing access to *our specific model*?
  *   **Yes:** The benefit is **Knowledge**. (Pass to Q2).
  *   **No:** The benefit requires continuous access to our specific system (e.g., real-time API, proprietary weights). (Pass to Q2, but flag as "Access-Locked").
  *   **Stop Condition:** If the output is *only* useful if kept secret (e.g., a specific exploit chain), mark as **Unstealable** and go to Part 2.

  **Q2: The "Crowding" Test (Positionality)**
  *   **Question:** If every competitor had this capability tomorrow, would the value of the capability drop to near zero for everyone?
      *   *Translation:* Is this like "making medicine" (value stays high even if everyone can do it) or "finding a bug in a competitor's code" (value vanishes if everyone knows the bug)?
  *   **Value Stays High:** The benefit is **Non-Positional**. (Pass to Q3).
  *   **Value Drops:** The benefit is **First-Mover/Positional**. (Mark as **Unstealable** and go to Part 2).
  *   **Uncertain:** If you can't tell in 5 minutes, assume **Value Drops** (conservative bias).

  **Q3: The "Keyholder" Test (Resource Lock)**
  *   **Question:** To use this capability effectively, does the user need a specific resource (compute, data, legal status, capital) that is currently concentrated in the hands of one or two actors (including us or our biggest customers)?
      *   *Translation:* If we give everyone the "key" (the model), do they still lack the "door" (the infrastructure to run it)?
  *   **No (Open Door):** Most reasonable actors can utilize this. (Pass to Q4).
  *   **Yes (Locked Door):** Only actors with massive existing infrastructure can utilize this. (Mark as **Unstealable** and go to Part 2).

  **Q4: The "Break/Fix" Test (Offense-Defense Balance)**
  *   **Question:** Is it significantly cheaper or easier to use this capability to cause harm than it is to use it to prevent harm?
      *   *Translation:* If this is a lockpick, is it easier to break into a house than to build a better lock?
  *   **No (Balanced or Defense-Biased):** (Pass to **Verdict**).
  *   **Yes (Offense-Biased):** (Mark as **Unstealable** and go to Part 2).

  ---

  ### Part 2: The Verdict & Escalation (20 Minutes)

  Based on the flags above, assign one of the following verdicts.

  **Verdict A: GREEN (Stealable)**
  *   **Criteria:** Passed Q1-Q4. Benefit is knowledge-based, non-positional, accessible, and defense-biased.
  *   **Action:** Standard Release.
  *   **Rationale:** "If this is valuable, others can copy the benefit. We do not gain a decisive strategic advantage that cannot be mirrored by a benevolent coalition."

  **Verdict B: YELLOW (Conditionally Stealable)**
  *   **Criteria:** Failed Q1 (Access-Locked) or Q3 (Minor Resource Lock), but passed Q2 and Q4.
  *   **Action:** Release with Mitigations (e.g., rate limits, tiered access, delayed open-weights).
  *   **Rationale:** "The benefit is copyable in theory, but infrastructure barriers slow down adoption. We must ensure the barriers don't become permanent moats."

  **Verdict C: RED (Unstealable / Escalate)**
  *   **Criteria:** Failed Q2 (Positional), Q3 (Major Resource Lock), or Q4 (Offense-Biased).
  *   **Action:** Do Not Ship. Escalate to Safety Board / CTO / Legal.
  *   **Rationale:** "This capability creates a decisive advantage that cannot be copied by the public good. It concentrates power or enables asymmetric harm."

  ---

  ### Part 3: Judgment Calls & Handoffs (10 Minutes)

  You cannot answer everything in an hour. Mark these specific uncertainties in your report.

  1.  **The "Value Decay" Number (Empirical Guess):**
      *   *Where:* Q2 (Crowding).
      *   *Missing Data:* You won't know exactly how much value drops if competitors copy.
      *   *Procedure:* If you lack market data, ask: "Would this still be worth paying for if it was a free open-source library?" If the answer is "No," treat it as Positional.
      *   *Handoff:* If the answer is ambiguous, flag for **Product Strategy Lead**. This is a market question, not a safety one.

  2.  **The "Good Guys" Definition (Values Call):**
      *   *Where:* Q3 (Keyholder).
      *   *Missing Data:* Who counts as a "benevolent coalition"?
      *   *Procedure:* Default to "Academic + Nonprofit + Small Enterprise." If the capability is *only* usable by "Frontier Labs + Nation States," it is Unstealable.
      *   *Handoff:* If this distinction changes the verdict, flag for **Head of Policy**. This is a political determination, not a technical one.

  3.  **The "Harm Threshold" (Values Call):**
      *   *Where:* Q4 (Break/Fix).
      *   *Missing Data:* Probability of misuse.
      *   *Procedure:* If the *magnitude* of harm is catastrophic (e.g., pandemic), low probability is insufficient.
      *   *Handoff:* If the harm is catastrophic but probability is low, flag for **CEO / Safety Board**. This is an existential risk tolerance call.

  ---

  ### Part 4: Failure Modes & Bias Acknowledgement

  **Where This Procedure Misfires:**
  1.  **The "Creepy but Copyable" Trap:** A capability might pass all tests (it's copyable knowledge, not positional, accessible) but still be net-negative (e.g., highly effective manipulation techniques). Strategy stealing assumes the *benefit* is what matters; it ignores capabilities where the *existence* is the harm.
  2.  **The "Slow Lock-In" Error:** A capability might look stealable today (Q3 passes) but create ecosystem dependencies that make it unstealable in 2 years (e.g., proprietary file formats). The procedure is myopic to the present.
  3.  **The "Neutral Referee" Lie:** The procedure assumes *your org* decides who gets the capability. If you ship to Enterprise Customers, you have already decided the "Good Guys" are "People who pay."

  **The "Good Guys" Bias:**
  *   **Explicit Note:** This procedure assumes that if a capability is stealable, a "benevolent coalition" will steal it. In reality, *your customers* are the ones stealing it. If your customers are not benevolent, "stealability" just means "weaponizability."
  *   **Mitigation:** In the report, explicitly state: "Stealability here implies adoption by current enterprise partners, not necessarily the public good."

