  ### Worked Examples

  Here is how the procedure runs on your three current reports.

  #### Example 1: Novel Protein Design
  *   **Q1 (Recipe):** **Yes.** The output is a protein sequence. Once published, anyone can synthesize it without the model. (Pass).
  *   **Q2 (Crowding):** **Value Stays High.** A cure for cancer is valuable even if everyone knows how to make it. (Pass).
  *   **Q3 (Keyholder):** **No.** Synthesis labs are widespread. (Pass).
  *   **Q4 (Break/Fix):** **Yes (Offense-Biased).** Designing a pathogen is currently easier than designing the specific countermeasure/vaccine for it. The "lockpick" is cheaper than the "lock."
  *   **Verdict:** **RED (Escalate).**
  *   **Report Note:** "While the knowledge is copyable (Stealable), the offense/defense asymmetry violates the strategy-stealing condition. Bad actors need less capability to cause harm than good actors need to prevent it."
  *   **Outcome:** Safety team blocks release. Pharma customers are annoyed but expect this.

  #### Example 2: Human Response Prediction (Wellness Product)
  *   **Q1 (Recipe):** **No.** The benefit is real-time interaction. Requires API access. (Flag: Access-Locked).
  *   **Q2 (Crowding):** **Value Stays High.** Mental wellness is not zero-sum. My therapy doesn't stop yours. (Pass).
  *   **Q3 (Keyholder):** **No.** Any app developer can call the API. (Pass).
  *   **Q4 (Break/Fix):** **Ambiguous.** Prediction can be used for support (Fix) or manipulation (Break).
  *   **Verdict:** **GREEN (Ship) / YELLOW (Monitor).**
      *   *Procedure Logic:* The benefit (wellness) is non-positional and accessible. A benevolent coalition *could* license this API to build better support tools. The advantage is stealable.
  *   **Why You Will Hate This Answer:**
      *   This is the **Misfire**. The procedure clears this because the *advantage* is stealable. It fails to capture that the *capability itself* (predicting human behavior) might be intrinsically dangerous regardless of who holds it.
      *   You know this feels like "mind control lite." The procedure tells you "It's fine, competitors can buy it too." You will hate shipping this because the framework optimizes for *power balance*, not *human autonomy*.
      *   **Action:** You must override the procedure here using the "Harm Threshold" handoff. Escalate to Policy.

  #### Example 3: Parallel Research Infra (Scale Shift)
  *   **Q1 (Recipe):** **No.** The benefit is the speed/cost of running the queries. Requires the infra. (Flag: Access-Locked).
  *   **Q2 (Crowding):** **Value Stays High.** Research output is valuable regardless of who does it. (Pass).
  *   **Q3 (Keyholder):** **Yes (Major Resource Lock).** The report states: "Our biggest customer has far more compute than any academic or nonprofit coalition." To utilize this efficiency gain, you need massive parallel compute.
  *   **Verdict:** **RED (Escalate / Block).**
  *   **Report Note:** "This capability creates a decisive strategic advantage that is **Unstealable** by the public good. The efficiency gain is locked behind a compute barrier that only one actor possesses. This cements a permanent power asymmetry."
  *   **Why You Will Hate This Answer:**
      *   This is the **Hated Answer**.
      *   **The Conflict:** The procedure correctly identifies that this creates a monopoly on capability. The "Good Guys" (academics/nonprofits) cannot copy this play because they lack the hardware.
      *   **The Consequence:** You have to recommend restricting a feature that is technically just "infrastructure efficiency." It sounds benign. But the *effect* is to hand a decisive advantage to your wealthiest customer.
      *   **The Meeting:** The Product Exec will be in your office immediately. They will argue: "It's just faster inference. We aren't giving them the weights." You have to argue: "You are giving them a leverage multiplier that the rest of the world physically cannot match."
      *   **Why it hurts:** This forces you to make a geopolitical argument (concentration of power) to block a revenue feature. It's the correct alignment answer, but it's the hardest sell in the building. It exposes that your org is not a neutral referee; you are actively choosing to arm the highest bidder unless you intervene.

  ### Final Note on the "Good Guys"
  In Example 3, the procedure forces you to admit that "Stealable" effectively means "Stealable by other corporations." If the "Good Guys" are defined as "Humanity," the capability is Unstealable. If the "Good Guys" are defined as "Our Shareholders," it is Stealable.

  **Your job in the escalation meeting is to force the room to define "Good Guys" before they define "Ship."** If they refuse, the procedure defaults to **RED**.
