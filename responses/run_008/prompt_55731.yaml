  2. The view must accommodate entanglement by denying that the state of a composite system is reducible to a distribution over the intrinsic states of its individual subsystems. This is a genuine requirement mandated by Bell inequality violations.
  3. The view must respect that proper and improper mixtures yielding the same density matrix are experimentally indistinguishable, regardless of whether one interprets the mixture as ignorance or fundamental randomness. This is a genuine requirement to preserve operational consistency motivated by density matrix ambiguity.
  4. The view must address the PBR theorem by either accepting that distinct quantum states correspond to disjoint physical states or by rejecting the assumption that independently prepared systems have independent physical states. This is a genuine constraint on epistemic models though the independence assumption is contested.
  5. The view must relinquish either locality or the completeness of the quantum description, as demanding both alongside standard predictions is jointly unsatisfiable. This verdict relies on Bell and Kochen–Specker, making the demand for locality a camp-relative prejudice that does the most work in eliminating candidates.
