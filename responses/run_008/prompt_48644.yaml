answer: |-
  You have identified a genuine fault line in the ontology of technical regulation. The tension you describe isn't merely bureaucratic hypocrisy; it is a stabilized **pragmatic dualism** that allows the legal-professional complex to function without resolving the underlying philosophical contradiction.

  To answer your first question directly: The combination of practices presupposes a theory I would label **Probabilistic Material Normativity**. It is not flatly inconsistent, but it is ontologically unstable. It relies on a functional split between the *locus of blame* (the human/agent) and the *locus of control* (the artifact/system).

  Here is the breakdown of that implicit theory, the underdetermined elements of your current regulatory landscape, and the counterfactual scenario where Langdon Winner's strong thesis is fully operationalized.

  ### 1. The Implicit Theory: Probabilistic Material Normativity

  The "guns don't kill people" intuition in engineering ethics codes (NSPE, IEEE, etc.) relies on **Instrumentalism**: the artifact is a conduit for human will. This is maintained professionally because it preserves the engineer's status as a rational agent. If the tool has moral agency, the engineer's professional discretion is diminished.

  However, accessibility law (ADA) and data protection (GDPR) rely on **Script Theory** (à la Akrich and Latour) or **Mediation Theory** (Verbeek). They assume the artifact prescribes, affords, or constrains specific behaviors with high reliability.

  The coherent implicit theory bridging these is **Probabilistic Material Normativity**. It posits that:
  1.  **Values are embeddable:** Design choices create "friction" or "flow" for specific moral outcomes (e.g., a curb cut makes exclusion difficult; default encryption makes surveillance difficult).
  2.  **Values are defeasible:** The design does not *guarantee* the outcome (a curb cut can be blocked by a truck; encryption can be bypassed by a subpoena).
  3.  **The Default is Normative:** Because the design creates a probabilistic bias, the "default setting" is treated as the legally relevant moral stance.

  This is your "weak embeddability thesis," but with a legal twist. The law treats the artifact not as a moral agent, but as a **frozen policy**. When the EU mandates "Privacy by Design," they are acknowledging that privacy cannot be secured solely by punishing violators *ex post*; it must be architected *ex ante*.

  **Is it inconsistent?**
  Ontologically, yes. You cannot hold that artifacts are value-neutral instruments *and* value-laden legislators simultaneously.
  Pragmatically, no. The system resolves this by assigning **liability to humans** and **compliance to artifacts**.
  *   *Ethics Codes:* Focus on liability. "Who do we blame when it goes wrong?" Answer: The engineer/user. Therefore, the tool must be neutral so the human takes the fall.
  *   *Regulation:* Focus on compliance. "How do we ensure the desired outcome?" Answer: Mandate the tool's architecture. Therefore, the tool must be value-laden to guarantee the outcome.

  This dualism allows the state to regulate outcomes without challenging the liberal legal subject's primacy.

  ### 2. Forced vs. Underdetermined Elements

  Given this implicit theory of Probabilistic Material Normativity, we can distinguish what is structurally required by the theory and what remains politically contingent.

  **Strictly Forced by the Theory:**
  *   **The Shift to Ex Ante Regulation:** If values are embedded in design, *ex post* punishment (tort law, criminal liability) is insufficient. You cannot sue a data leak back into existence. The theory *forces* regulatory mechanisms that intervene in the R&D phase (e.g., Impact Assessments, Design Standards).
  *   **Performance Standards over Prescriptive Specs:** Because the embeddability is "weak" (defeasible), the law cannot usually mandate specific components (e.g., "use steel type X") without stifling innovation. It must mandate *outcomes* via design (e.g., "must withstand force Y" or "must be navigable by screen reader"). This forces the rise of "performance-based" regulation rather than "design-spec" regulation.
  *   **The Burden of Proof Reversal:** In a neutral-instrument model, the regulator must prove harm occurred. In a material-normativity model, the designer must prove the artifact does *not* embody prohibited biases (e.g., GDPR's accountability principle).

  **Underdetermined by the Theory:**
  *   **Which Values Get Embedded:** The theory explains *that* values can be built in, not *which* ones. This is why we have "Privacy by Design" but not "Unionization by Design" or "Dignity by Design." The selection of values is purely political, not theoretical. The theory is compatible with libertarian regulation (embed property rights) just as easily as social-democratic regulation (embed accessibility).
  *   **The Threshold of Probability:** How reliable must the "value embedding" be? Does a algorithmic bias need to be 51% likely to cause harm to be regulated, or 90%? The theory allows for a "risk-based approach" (common in EU law), but the specific risk tolerance is underdetermined.
  *   **The Scope of the Artifact:** Does the regulation cover the code, the interface, the business model, or the supply chain? Current law struggles here. GDPR regulates the data processing "system," but often treats the business model (surveillance capitalism) as external context. The theory suggests the *sociotechnical system* is the unit of analysis, but practice restricts it to the *product*.

  ### 3. The Winner Counterfactual: Strong Determinism in Law

  Now, let's run the thought experiment. What if lawmakers fully adopted Langdon Winner's thesis from "Do Artifacts Have Politics?" (1980)?

  Winner's argument is stronger than "weak embeddability." He argues that artifacts **inherently settle political questions**. The Moses bridges weren't just *biased* against buses; they *were* a legislative act excluding low-income populations. Technology is not just a tool for politics; it is a form of legislation.

  If the legal system treated this as operative doctrine (Technological Constitutionalism), current design mandates would be unrecognizable. Here is how the shape of regulation would change:

  **A. From Mitigation to Authorization**
  Current mandates (ADA, GDPR) are **mitigatory**. They assume the technology is proceeding, and we must sand off the sharp edges to fit human rights.
  Under a Winner-esque regime, regulation would be **constitutive**. Before a technology is deployed, it would undergo a "Political Compatibility Review."
  *   *Current:* "Ensure this facial recognition system is accurate across demographics."
  *   *Winner-Esque:* "Determine if a centralized facial recognition system is compatible with the constitutional right to anonymity. If no, the artifact is banned, regardless of accuracy."
  *   *Result:* Entire categories of technology (e.g., predictive policing algorithms, certain forms of gig-economy management software) would be deemed *ultra vires*—beyond the authority of private designers to instantiate—because they embody a form of authority (surveillance, command-and-control) that belongs only to the democratic state.

  **B. The Collapse of "Use" vs. "Design"**
  Current law distinguishes between "misuse" (user fault) and "defect" (designer fault). Winner's thesis collapses this. If the artifact embodies politics, "misuse" is often a feature of the design's political logic.
  *   *Current:* A social media platform is regulated on how it handles harassment (user behavior).
  *   *Winner-Esque:* The engagement algorithm *is* the harassment mechanism because it structurally prioritizes outrage. The regulation would not mandate "better moderation tools"; it would mandate the removal of the engagement-optimization architecture itself. The "business model" becomes a design defect.

  **C. Liability Shifts from Tort to Constitutional Review**
  Currently, if a design harms, we sue for damages (Tort) or fine for non-compliance (Admin Law).
  Under strong determinism, designing a technology is a **legislative act**. Therefore, private engineers are effectively unelected legislators.
  *   *Implication:* Design decisions would require **due process**. You couldn't just release an update to a terms-of-service algorithm. Stakeholders (the public) would have a right to comment on the "legislation" embedded in the code.
  *   *Recognition:* Our current "Design Mandates" would look like feeble zoning laws compared to this. They would be seen as acknowledging the problem (yes, design matters) but failing to address the power dynamic (who gets to decide the design).

  **D. Standardization as Democratization**
  Winner implies that if artifacts are politics, then the design process must be democratized.
  *   *Current:* Engineers design; regulators check boxes.
  *   *Winner-Esque:* Design standards would be set by citizen assemblies, not technical committees (like ISO or IEEE). The "technical feasibility" argument would no longer trump "political desirability." If a safer car is technically possible but too expensive, the market is not allowed to decide; the political necessity of safety overrides the economic logic.

  ### Summary of the Divergence

  | Feature | Current Regime (Weak Embeddability) | Winner-Esque Regime (Strong Determinism) |
  | :--- | :--- | :--- |
  | **Ontology** | Artifacts bias behavior probabilistically. | Artifacts *are* crystallized power relations. |
  | **Regulatory Goal** | Harm mitigation / Compliance. | Political legitimacy / Authorization. |
  | **Unit of Analysis** | The Product / System. | The Sociotechnical Constitution. |
  | **Design Process** | Expert-driven, regulator-audited. | Democratized, due-process required. |
  | **Outcome** | "Privacy by Design" (Privacy within the system). | "Privacy as Architecture" (Systems compatible with privacy only). |

  ### Conclusion for Your Work

  The tension you are feeling is the friction between **Liberal Legalism** (which requires autonomous human agents to hold liable) and **Material Semiotics** (which knows agency is distributed).

  The current regulatory landscape solves this by treating artifacts as **normative defaults** rather than **deterministic laws**. This allows the law to say, "The design made this outcome likely (so we regulate the design)," while simultaneously saying, "The human chose to act (so we blame the human)."

  If you move toward a Winner-esque analysis in your dissertation, you will find that current "Ethical AI" or "Privacy by Design" initiatives are essentially attempts to manage the symptoms of technological legislation without admitting that private corporations are legislating. A fully coherent application of Winner would require treating **design review as a branch of constitutional law**. That is the "weed" worth getting into: the proposition that the engineering drawing board is a legislative chamber, and currently, it is an unregulated one.
