      *   *Key References to weave in:* Langdon Winner (obviously), Peter-Paul Verbeek (Mediation), Batya Friedman (VSD), Madeleine Akrich (Scripts), maybe Sheila Jasanoff (Civic Epistemologies).
      *   *Refining the "Weak Embeddability":* Let's sharpen this. It's not just that values *can* be embedded, it's that the law treats them as *default settings* that require active override. This is the "Nudge" logic but hardcoded.
