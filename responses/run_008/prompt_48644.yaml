          2.  Is it something like a "weak embeddability thesis"?
          3.  Which parts of practice are forced by this theory vs. underdetermined?
          4.  What would regulation look like if lawmakers fully adopted Langdon Winner's strong determinism ("Do Artifacts Have Politics?")? Would current mandates be recognizable?
      *   **Constraint:** American English. Get into the weeds (precision over survey).

  2.  **Deconstruct the Tension (Neutrality vs. Regulation):**
      *   *The "Neutrality" Claim:* Standard engineering ethics (NSPE, etc.) often rely on a consequentialist or deontological framework where the *agent* (engineer) is the moral locus. The artifact is a tool. This aligns with the "guns don't kill people" intuition. It's often called the "instrumentalist" view.
      *   *The "Regulation" Reality:* GDPR (Privacy by Design), ADA (Curb cuts), Safety standards (crumple zones). These mandate specific material configurations. They assume the material configuration *causes* specific social outcomes regardless of intent. This aligns with "material morality" or "script theory" (Akrich/Latour).
      *   *The Synthesis:* Is it inconsistent? Not necessarily. It looks like a pragmatic split between *liability* (who gets blamed?) and *affordance* (what does the thing do?).
      *   *The "Weak Embeddability Thesis":* The user suggests this. It's a good starting point. It implies values are *inclinations* in the tech, not deterministic laws. This fits the regulatory approach which sets standards but allows compliance flexibility.

  3.  **Address Question 1 & 2: The Implicit Theory:**
      *   It's not flatly inconsistent, but it is *theoretically unstable*. It's a "pragmatic dualism."
      *   *Locus of Responsibility:* Ethics codes focus on the *engineer* (professional conduct). Regulation focuses on the *product* (market准入).
      *   *Implicit Theory:* It's closer to **Value Sensitive Design (VSD)** or **Mediation Theory** (Verbeek) than strict instrumentalism, but without the philosophical vocabulary.
      *   *Refining the "Weak Embeddability":* Yes, but let's call it "Probabilistic Material Morality." The law assumes design *biases* behavior significantly enough to warrant intervention, but stops short of saying design *determines* behavior (which would absolve the user).
      *   *Key Concept:* **Affordance as Normativity.** The regulation treats affordances as normative constraints.

  4.  **Address Question 3: Forced vs. Underdetermined:**
      *   *Forced by the theory:* If values are embeddable, you must regulate the design phase. You can't just punish misuse. (Hence "Privacy by Design").
      *   *Underdetermined:* *Which* values get embedded. Why privacy and accessibility, but not necessarily "democratic engagement" or "labor solidarity"? The theory allows embedding, but politics decides *what* gets embedded.
      *   *Also Underdetermined:* The mechanism of enforcement. Performance standards vs. design specifications. (e.g., "Must protect data" vs. "Must use encryption X").

  5.  **Address Question 4: The Winner Counterfactual (Strong Determinism):**
      *   *Winner's Thesis:* "Do Artifacts Have Politics?" (1980). Strong claim: Artifacts *inherently* embody specific forms of power and authority (e.g., Robert Moses' bridges). Technology is a form of legislation.
      *   *If Lawmakers adopted Strong Determinism:*
          *   Current mandates (ADA, GDPR) are actually *too weak*. They treat design as a compliance checkbox.
          *   Strong determinism implies that choosing a technology *is* a political act that cannot be undone by "proper use."
          *   *Regulatory Shape:* It would look less like "safety standards" and more like "technology assessment" or outright bans/approvals of sociotechnical systems.
          *   *Example:* Instead of "make the algorithm fair" (tweaking design), it might be "this type of algorithmic governance is incompatible with due process" (banning the artifact type).
          *   *Recognition:* Current mandates would be recognizable as *first steps*, but insufficient. They try to mitigate harm within a system. Winner-esque regulation would question the system's architecture itself.
          *   *Liability:* If artifacts determine outcomes, the "user responsibility" model collapses. Liability shifts almost entirely to the designer/legislator of the tech.

