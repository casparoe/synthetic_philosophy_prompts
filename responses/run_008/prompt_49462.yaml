      *   *Hypothesis 2: The Causal Control + Attitude Rule (Psychological Focus).*
          *   Idea: Intentionality requires Foresight + Control + a specific conative state. For negative side effects, the conative state is "allowing" (which counts as intentionality). For positive side effects, "allowing" isn't enough; you need "aiming." However, "allowing" is negated by active mitigation or distress (Case 3).
