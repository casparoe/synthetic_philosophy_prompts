  ### Analysis of Dara's Intuition Pump

  Dara's track record presents a fascinating deviation from the standard "Knobe Effect" literature. While she exhibits the classic asymmetry (Cases 1 & 2), her verdicts on Cases 3 and 5 constrain the possible underlying rules significantly. Case 5 (the mural) is particularly diagnostic: standard trade-off accounts struggle here because there is no *benefit* to the agent to justify the harm, yet she still ascribes intentionality. Case 3 (the sergeant) shows that foresight and causal control are insufficient for intentionality if the agent's conative stance is one of active opposition (regret/mitigation).

  Below, I outline three candidate rules that fit her existing data, analyze how they apply to the new vignettes, and offer my best guesses for her actual responses.

  #### (i) Candidate Rules

  **1. The Affective Alignment Rule (Normative-Attitude Focus)**
  *   **The Rule:** Intentionality is ascribed when the agent's affective stance aligns with the normative valence of the side effect.
      *   *Negative Outcome:* If the agent is Indifferent or Pleased → **Intentional**. If the agent is Regretful/Distressed → **Not Intentional**.
      *   *Positive Outcome:* If the agent is Indifferent → **Not Intentional**. (Requires active pursuit/desire to be Intentional).
  *   **Locus:** The subject's evaluation of the *agent's internal emotional state* relative to community moral norms.
  *   **Fit:** Explains Case 1 (Harm+Indiff=Yes), Case 2 (Help+Indiff=No), Case 3 (Harm+Regret=No), Case 5 (Harm+Indiff=Yes). Case 4 fits because the agent's *belief* (amoralism) doesn't change the *attitude* (indifference) toward the harm.

  **2. The Blame-Validation Rule (Pragmatic Focus)**
  *   **The Rule:** Intentionality is a proxy for blameworthiness. The subject asks, "Is this agent blameworthy for this outcome?" If Yes → **Intentional**. If No (or if praiseworthy without sacrifice) → **Not Intentional**.
  *   **Locus:** The *subject's* moral judgment of the agent's character/actions.
  *   **Fit:** Explains Case 1 (Blameworthy=Yes), Case 2 (Not praiseworthy=No), Case 3 (War necessity+Regret=Not Blameworthy=No), Case 5 (Wanton destruction=Blameworthy=Yes). Case 4 fits because amoralism doesn't excuse the harm.

  **3. The Mitigation Priority Rule (Action Focus)**
  *   **The Rule:** Intentionality tracks whether the agent treated the side effect as a constraint to be minimized or avoided.
      *   *Harm:* If the agent declined available/cheap prevention → **Intentional**. If the agent minimized/prevented where possible → **Not Intentional**.
      *   *Help:* If the agent would sacrifice for the help → **Intentional**. If not → **Not Intentional**.
  *   **Locus:** The *agent's* revealed preferences through action (counterfactual willingness).
  *   **Fit:** Explains Case 1 (Didn't stop=Yes), Case 3 (Minimized risk=No), Case 5 (Didn't stop=Yes). Case 2 fits because he wouldn't sacrifice profit for help.

