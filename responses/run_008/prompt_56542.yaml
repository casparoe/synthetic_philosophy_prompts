          *   *Case:* A licensee committed a moderately serious violation (clear desert) but has a rare condition making them extremely dangerous if licensed again (high utility for revocation), OR they committed a serious violation but are physically incapable of repeating it (low utility).
          *   *Let's select:* **The "Incapacitated Offender."** A surgeon develops a tremor (cannot operate) but is found to have billed fraudulently in the past before the tremor.
          *   Actually, the prompt asks to distinguish the *readings of the slogan*.
          *   Reading A: Proportionality to Harm.
          *   Reading B: Proportionality to Culpability.
          *   Reading C: Proportionality as a Limit (Negative Retributivism).
          *   *Best Case:* **The "Beneficial Deterrence" Case.** A minor infraction where a harsh penalty would save many lives (deterrence), but the act was trivial.
          *   If Chair imposes harsh penalty: She is Consequentialist (contradicts Use 1).
          *   If Chair imposes light penalty: She is Retributivist (supports Use 1).
          *   *Wait, I need to distinguish the specific Retributive readings.*
          *   Let's focus on the tension between Use 1 (No consequences) and Use 2 (Culpability scaling).
          *   Test Case: **The "Harmless Attempt."** A licensee tried to commit a major fraud (high culpability/deliberateness) but was caught before anyone lost money (low harm). Precedent for completed fraud is Revocation.
          *   If Chair gives Revocation: She fits Use 2 (Culpability matters more than outcome).
          *   If Chair gives Reprimand: She fits a Harm-based view.
          *   *But to test the "Consequences" exclusion (Use 1):*
