          *   If Chair punishes heavily: Pure Retributivism (Use 1 & 2 consistent).
          *   If Chair punishes lightly: Consequentialist/Hybrid (Use 1 was situational).

      *Decision:* The "Retired Offender" case is the classic philosophical discriminator between Retributivism and Consequentialism.

  7.  **Review and Refine:**
      *   Check constraints: Structured list? Yes. Weak to False? Yes. Address Use 1 & 2 for each? Yes. Address Consequentialist objection? Yes. Identify Test Case? Yes.
