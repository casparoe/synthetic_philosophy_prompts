          *   *Wait, Use 1 already showed she dismisses cooperation.* So she leans Retributive.
          *   *To distinguish Use 1 vs Use 2 consistency:* We need to know if "Fit" means "Fit the Harm" or "Fit the Culpability."
          *   *Test Case:* **High Harm / Low Culpability vs. Low Harm / High Culpability.**
          *   If she punishes High Harm/Low Culpability more: She cares about Outcome.
