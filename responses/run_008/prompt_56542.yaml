      *   *The Sharp Test:* **The "Highly Dangerous but Technically Minor" Violation.**
          *   Example: A surgeon fails to wash hands (technical/minor harm so far) but admits they don't believe in germs (high future risk).
          *   Retributivist: Sanction based on the act (minor).
          *   Consequentialist: Sanction based on risk (revocation).
          *   Chair's Use 1 suggests Retributivism. Chair's Use 2 suggests Culpability focus.
          *   *Refined Test:* **The "Reformed High-Culpability" Case.** A licensee committed a deliberate, concealed fraud (high culpability) but has since fully restituted, cooperated, and is statistically unlikely to reoffend (low future risk).
          *   If Chair sanctions heavily: She is Positive Retributivist (Past focus).
