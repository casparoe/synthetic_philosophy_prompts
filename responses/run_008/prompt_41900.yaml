answer: |-
  Here are eleven interview questions designed to press the scholar on the logical and practical tensions within *anekāntavāda*, complete with follow-ups keyed to traditional Jain responses.

  **1. The Self-Referential Consistency**
  Let us begin with the status of the doctrine itself. If *anekāntavāda* asserts that all philosophical claims are partial and conditioned by standpoint, does this assertion include itself? If you answer 'yes', then the doctrine is merely partial and we are not bound to accept it over a one-sided realist claim; if you answer 'no', then you have exempted your own position, rendering it the very kind of absolute, one-sided truth (*ekānta*) the doctrine condemns. How do you escape this dilemma without special pleading?

  *   **Follow-up:** The standard defence is that *anekāntavāda* is a methodological tool rather than a metaphysical proposition, or that it is true from the standpoint of the omniscient. But if it is only true from the standpoint of omniscience, of what use is it to us non-omniscient interlocutors? Are we not merely borrowing authority we cannot verify?

  **2. The Scope of the *Syāt* Operator**
  You employ the qualifier *syāt* ('in some respect' or 'conditionally') to soften predications about complex substances. But where does this operator cease to apply? Does it govern necessary truths, such as mathematics or logic? Is it possible to say, '*syāt*, two plus two equals four', implying there is a standpoint where it does not? If not, on what basis do you draw the boundary between domains where multiplicity applies and those where it does not?

  *   **Follow-up:** If you concede that *syāt* does not apply to logic or mathematics, does this not grant the realist a foothold? It suggests there are context-independent truths. If there are some, why not more? What prevents the slide back into the very absolutism you seek to avoid?

  **3. Contradiction versus Difference of Standpoint**
  My concern, shared by many critics, is distinguishing a genuine contradiction from a mere difference of aspect. The seven-fold predication (*saptabhaṅgī*) allows one to say a thing 'is', 'is not', and 'is inexpressible'. But in a court of law, if Witness A says 'The accused was present' and Witness B says 'The accused was not present', you cannot affirm both via the *saptabhaṅgī* without abandoning the law of non-contradiction. How does your logic distinguish between a resolvable difference of *naya* (standpoint) and a flat contradiction where one party is simply wrong?

  *   **Follow-up:** The tradition often replies that the predicates refer to different modes (*paryāya*) or times. But if every contradiction can be dissolved by positing a hidden difference in mode or time, does the theory become unfalsifiable? How do you prevent *anekāntavāda* from becoming a machine that automatically validates incompatible claims?

  **4. The Dispute Test (Operationalising the Critique)**
  I want to put a concrete case to you, drawn from a recent disagreement I had. Two historians dispute a specific event: one claims a treaty was signed in 1900, the other claims it was signed in 1901. Archives are lost. A realist says one is right and one is wrong. An *anekāntavādin* might say both are partially correct relative to their evidence or calendars. If you apply your doctrine here, does it not render the dispute meaningless? If both claims can be affirmed 'from some standpoint', were they ever really disagreeing, or have you merely redescribed ignorance as multiplicity?

  *   **Follow-up:** If you insist that, in reality, only one date obtained, you admit a single-fact reality underlying the perspectives. Does this not concede the realist's main point: that the world is determinate, even if our access to it is partial? Why call this 'many-sidedness' rather than 'partial access to a one-sided fact'?

  **5. The Accusation of Evasion**
  A critic might charge that *anekāntavāda* is, at bottom, a polite way of never being wrong. By qualifying every assertion, you insulate your position from refutation. If I argue against you, you can simply absorb my objection as 'another valid standpoint'. Does this not drain philosophical debate of its normative force? If no one can be decisively wrong, what motivates the rigorous pursuit of truth?

  *   **Follow-up:** You will likely appeal to the distinction between valid standpoints (*naya*) and false views (*mithyātva*). But who adjudicates that distinction? If the criterion for a 'valid' standpoint is coherence with *anekāntavāda*, are you not engaging in a circular defence of your own framework?

  **6. Ontological Commitment**
  Is the multiplicity you describe located in the object or in the subject? When you say a substance has infinite attributes, are you claiming the world is genuinely fragmented and manifold, or are you claiming that human language and cognition are incapable of grasping the unity of the thing? In short, is *anekāntavāda* an ontological thesis about reality, or an epistemological thesis about our limitations?

  *   **Follow-up:** If it is epistemological, it aligns closely with Kantian humility. If it is ontological, it risks incoherence (how can one thing be many contradictory things?). If you claim it is both, do you not risk conflating how things *are* with how we *know* them?

  **7. Ruling Out Invalid Standpoints**
  We must address the limits of tolerance. If all truths are partial, how do you rule out dangerous or erroneous standpoints? Is there a standpoint from which a harmful ideology, say one advocating violence, is 'partially true'? If you say no, you seem to rely on an absolute moral standard; if you say yes, you seem to condone it. How does Jain ethics integrate with Jain logic here without contradiction?

  *   **Follow-up:** The tradition appeals to *ahiṃsā* (non-violence) as a supreme value. But is *ahiṃsā* itself subject to *anekāntavāda*? If non-violence is also only partially true, then violence might be partially true from another standpoint. How do you stop the regression?

  **8. The God's Eye View**
  Jainism posits the existence of the *Kevala Jñānī*, the omniscient being who perceives all aspects of reality simultaneously. Does this not reintroduce the absolute you reject? If there is a view from everywhere, is that not the 'One Truth' that renders all other views merely provisional approximations? Why privilege the human, partial perspective in philosophical discourse if the ideal is a total, non-perspectival knowledge?

  *   **Follow-up:** If the omniscient view is the goal, then *anekāntavāda* is merely a ladder to be kicked away upon enlightenment. Why, then, defend it as a permanent feature of rational discourse rather than a temporary heuristic for the unenlightened?

  **9. Decision and Action**
  Philosophy must guide action. If I must consider all seven predications before acting, am I not paralysed? If I donate to charity, I must acknowledge *syāt* it is good, *syāt* it is bad (perhaps fostering dependency), and *syāt* it is inexpressible. In the moment of choice, do you not collapse back into a dogmatic decision? Does not acting require suspending *anekāntavāda*?

  *   **Follow-up:** You may argue that action proceeds from the 'pragmatic standpoint' (*vyavahāra-naya*). But if we must switch off this logic to live, does that not prove the realist's claim: that life requires treating truths as absolute, whilst your doctrine is merely a contemplative luxury?

  **10. Distinction from Relativism**
  Western postmodernism often argues that truth is relative to culture or language. You insist Jain philosophy is not relativism. But to the outsider, the distinction is thin. If truth is always indexed to a standpoint, in what sense is it 'truth' at all, and not just 'validated opinion'? What anchors your standpoints to reality rather than to social or linguistic convention?

  *   **Follow-up:** The Jain appeal is often to *pramāṇa* (valid means of knowledge). But if *pramāṇa* itself yields only partial knowledge (*naya*), then the anchor is loose. How do you guarantee that your standpoints are cutting the world at its joints, rather than merely carving it up conveniently?

  **11. The Ultimate Payoff**
  Finally, if my realist friend is satisfied with a world where contradictions are resolved by exclusion (A or not-A), and you offer a world where they are resolved by inclusion (A and not-A, conditionally), what do you gain that he loses? Beyond intellectual elegance, what is the soteriological or practical cash-value of *anekāntavāda*? Why should a modern philosopher, uninterested in liberation (*mokṣa*), adopt this more cumbersome logic?

  *   **Follow-up:** If the answer is that it reduces dogmatic violence (*pramāda*), is that an empirical claim? Can you demonstrate that societies influenced by *anekāntavāda* are less dogmatic? If not, are we left with a metaphysical system justified solely by a moral hope?
