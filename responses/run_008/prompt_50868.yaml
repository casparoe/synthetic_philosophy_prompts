answer: |-
  You can rest easy: **there is no dictator hidden in Approval Voting, and Arrow's Impossibility Theorem does not apply to this system in the way you fear.** Your departmental association will not vest decisive power in a single voter.

  Your concern stems from a very common and understandable misunderstanding of social choice theory. You have correctly identified the conditions of Arrow's Theorem, but you have misidentified the type of voting system to which the theorem applies. Specifically, Approval Voting fails one of the critical conditions you listed (Independence of Irrelevant Alternatives), and it operates on a different type of input (cardinal/rated vs. ordinal/ranked) than Arrow's theorem assumes.

  Here is a detailed breakdown of why the "dictator" conclusion does not follow, followed by answers to your specific questions and a recommendation.

  ### 1. Why Arrow's Theorem Does Not Apply

  Arrow's Impossibility Theorem applies specifically to **ordinal** voting systems that produce a complete **social welfare function** (a ranking of all candidates from first to last). Approval Voting is a **cardinal** (or rated) system that produces a **social choice function** (a winner or set of winners).

  Here are the two specific technical reasons why your deduction of a "dictator" is incorrect:

  **A. Approval Voting Violates Independence of Irrelevant Alternatives (IIA)**
  You stated that Approval Voting satisfies IIA because "the winner appears unaffected by the entry or exit of candidates whom nobody approves." This is a specific, narrow case, but it is not the full definition of Arrow's IIA.

  Arrow's IIA requires that the social ranking between Candidate A and Candidate B depends *only* on the individual voters' preferences between A and B. In Approval Voting, the outcome between A and B can absolutely change based on the presence of Candidate C, even if no voter changes their mind about whether they prefer A or B.

  *   **Example:** Imagine a voter who finds both A and B "acceptable" (approves both). If a new candidate C enters the race whom the voter finds "excellent," the voter might change their strategy to approve *only* C to maximize C's chance, withdrawing approval from A and B. Alternatively, if the voter uses a relative threshold (e.g., "approve the top half"), the entry of C changes the threshold.
  *   Because the presence of C can change whether a voter approves A or B, the relative societal score of A and B changes based on C. Therefore, **Approval Voting fails IIA.** Since it fails one of the three conditions, Arrow's conclusion (dictatorship) does not trigger.

  **B. Ordinal vs. Cardinal Information**
  Arrow's theorem assumes voters submit a **ranking** (1st, 2nd, 3rd...). Approval Voting allows voters to submit a **rating** (Acceptable/Unacceptable).
  *   In a ranking, if I prefer A to B, I must rank A higher than B.
  *   In Approval Voting, I can approve both A and B, or neither. This conveys information about *intensity* (utility) rather than just order.
  *   Impossibility theorems for *cardinal* systems exist (such as the Gibbard-Satterthwaite theorem regarding strategy), but they do not lead to the same "dictatorship" conclusion as Arrow's theorem does for ordinal rankings. By allowing voters to express utility (via the approval threshold) rather than just rank, Approval Voting bypasses the specific constraints that force dictatorship in Arrow's framework.

  ### 2. Answers to Your Specific Questions

  **Is there any procedure for identifying, in advance of an election, which member will hold that dictatorial power?**
  **No.** Because the system is not dictatorial. There is no single voter whose approvals single-handedly determine the result. In Approval Voting, every voter has equal weight (one vote per candidate), and the winner is determined by the aggregate sum of approvals. No mathematical procedure can identify a dictator because one does not exist.

  **Does the dictator rotate from contest to contest?**
  **No.** Again, because there is no dictator. The outcome is a collective sum of all ballots. While different coalitions of voters may determine the winner in different elections depending on the candidates running, this is a feature of any democratic system, not a "rotating dictatorship."

  **Given that the system apparently vests all decisive power in a single voter, would you recommend that we reject the proposal?**
  **I recommend you do not reject the proposal based on Arrow's Theorem.** Since the theorem does not imply dictatorship in this context, using it as a reason to reject Approval Voting would be rejecting the system based on a false premise.

  ### 3. Practical Recommendation

  While Approval Voting is not dictatorial, it is not flawless. You should evaluate the proposal based on its actual practical trade-offs compared to Plurality Voting:

  **Arguments for Approval Voting:**
  *   **Reduces the "Spoiler Effect":** In Plurality, voting for a less popular candidate you like can help a candidate you hate win. In Approval, you can approve both your favorite and a viable compromise without hurting the compromise's chances.
  *   **Encourages Consensus:** Candidates are incentivized to be broadly acceptable to the department rather than polarizing figures who have a intense minority base (which Plurality often rewards).
  *   **Simplicity:** It is easier to count and understand than Ranked Choice Voting (RCV).

  **Arguments against Approval Voting:**
  *   **Threshold Strategy:** Voters must decide where to set their "approval threshold." This can lead to strategic confusion (e.g., "Should I approve my second choice if it hurts my first choice?").
  *   **Lack of Nuance:** It distinguishes only between "acceptable" and "unacceptable," ignoring degrees of preference among acceptable candidates.

  **Conclusion:**
  You are not walking into a trap set by Arrow's Theorem. The theorem does not condemn Approval Voting to dictatorship. You should vote on the proposal based on whether you believe Approval Voting will produce better representative outcomes for your association than Plurality Voting, not on the fear of a mathematical impossibility that does not apply.

  **Recommendation:** Do not reject the proposal on the grounds of Arrow's Theorem. Evaluate it on its practical merits regarding consensus-building and spoiler effects.
