      *   *The Clash:* Side A is playing Chess (rules of the institution); Side B is playing Poker (rules of moral psychology). They are using the word "Apology" to label two different phenomena that overlap in ordinary language but diverge in extreme cases (historical wrongs).

  3.  **Evaluate the User's Hypothesis:**
