  *(Self-Correction on "No Fact of the Matter"):* I need to be careful here. The supervisor says "there's no fact of the matter." This is an ontological claim. The committee analogy supports this *if* you accept the analogy is literal. If it's just a model, the claim is weaker. I should point out that the analogy conflates *representation* with *ontology*.

  *(Self-Correction on "Suspension"):* Averaging is actually a specific aggregation rule (linear pooling). The supervisor says "no aggregation rule." But one *could* adopt linear pooling. The claim is that one *ought not to*. The committee analogy supports the "ought not" because averaging hides dissent.

