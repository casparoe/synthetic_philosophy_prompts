  3.  **Drafting the Correspondence Table:**
      *   *Committee Member* $\leftrightarrow$ *Precise Probability Function ($P_i \in K$)*.
      *   *The Committee* $\leftrightarrow$ *The Credal Set ($K$)*.
      *   *The Vote/Opinion* $\leftrightarrow$ *The Probability Assignment ($P_i(A)$)*.
      *   *Hiring/Firing (Evidence)* $\leftrightarrow$ *Conditionalization ($P_i(\cdot|E)$)*.
      *   *The Chair/Tie-Breaker* $\leftrightarrow$ *Decision Rule (e.g., E-admissibility, Maximin)*. (Crucial distinction: The chair isn't part of the credence, it's part of the action).
