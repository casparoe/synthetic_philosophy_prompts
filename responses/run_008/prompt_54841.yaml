      *   *Claim 1 (Suspension):* If $P_1(A) = 0.3$ and $P_2(A) = 0.7$, don't say $P(A) = 0.5$. Say $[0.3, 0.7]$.
      *   *Claim 2 (No Fact of the Matter):* There is no function $F(P_1, ... P_n)$ that yields *the* single credence.
