answer: |-
  **The Sharp Line**
  **By Dear Determinate**

  Welcome to *The Sharp Line*, where we acknowledge that while your knowledge is limited, the world is not. Every predicate has a cutoff. Every statement is true or false. Your confusion is epistemic, not ontological. Now, let's resolve your uncertainties.

  **Dear Determinate:**
  *I'm losing hair on the crown. I need to know the exact threshold for "bald." Is it 2,000 hairs? 1,500? I want to schedule my wig appointment for the exact day I cross the line.*
  **— Counting in Chicago**

  **Dear Counting:**
  There is indeed a precise integer *n* such that a head with *n* hairs is bald and a head with *n+1* is not. However, you cannot know *n*. Knowledge requires a margin for error: if you could know *n* was the cutoff, you would have to be able to distinguish *n* hairs from *n+1* visually or conceptually, which you cannot. The tolerance conditional ("if *n+1* isn't bald, neither is *n*") is false, but unknowably so. The line exists deep within the borderline region, hidden by your own cognitive limitations. Schedule the wig when you feel anxious, but rest easy knowing the fact of the matter is already settled. You are either bald or you are not.
  **— Warmly, Dana**

  **Dear Determinate:**
  *Leftovers from last Tuesday are in the fridge. Are they "safe" to eat? My partner says yes, I say no. Is there a fact of the matter, or is safety vague?*
  **— Nervous in Newark**

  **Dear Nervous:**
  There is a fact of the matter. There was a specific nanosecond when bacterial growth crossed the sharp boundary from "safe" to "unsafe." The predicate is precise; your access to it is not. This is where epistemicism hurts: you must make decisions without knowing the truth value. You cannot say "it's neither safe nor unsafe." It is one. Your ignorance is not a shield against food poisoning, but neither is the world fuzzy. Throw it out if you lack confidence, but do not comfort yourself with the lie that "safe" is a fluid concept. It is rigid. You are just blind.
  **— Warmly, Dana**

  **Dear Determinate:**
  *My roommate claims 40 plates in the sink aren't a "heap." I say they are. Also, if it's a borderline heap, is "borderline" itself borderline? This is keeping us up.*
  **— Stacked in Seattle**

  **Dear Stacked:**
  One of you is correct. The extension of "heap" is sharp. Your disagreement is merely shared ignorance. Regarding your second query: yes, there is a fact about whether the case is borderline. "Borderline" is itself either applicable or not. There is no infinite regress of fuzziness, only layers of ignorance. We cannot know where the boundary between "definitely a heap" and "borderline heap" lies, just as we cannot know the heap boundary itself. But the boundaries are there. Wash the dishes. The metaphysics will not do it for you.
  **— Warmly, Dana**

  **Dear Determinate:**
  *This column is dogmatic. Supervaluationism shows that borderline statements lack truth values entirely. Your insistence on bivalence is naive. Sometimes, things are just neither true nor false.*
  **— Smug in Supervaluationland**

  **Dear Smug:**
  You are wrong. It is true that you are wrong. There are no truth-value gaps, only shadows cast by your own cognitive architecture. To claim a statement is "neither true nor false" is to mistake your inability to verify for a lack of reality. The world does not wait for your verification procedures to settle its properties. A statement is true if it corresponds to the facts, and the facts include sharp cutoffs you cannot see. Your theory comforts those afraid of precision, but it fails to describe the world. I suggest you read a book on margin-for-error principles, though I suspect you will find the sharp edges uncomfortable.
  **— Warmly, Dana**

  *Send queries to The Sharp Line, c/o The Daily Gazette. Remember: Ignorance is inevitable. Indeterminacy is not.*
