prompt: |-
  I'm a graduate student working on a paper about the knowing-how / knowing-that distinction, and I'd like comments on a draft argument before I commit to writing the full thing up. The idea, roughly, is that the distinction should be individuated by loss conditions rather than by the category of the state involved. We standardly lose knowledge-that through epistemic defeat: if I acquire decisive evidence that my belief is false, or that my source was unreliable, I no longer know, even if I keep believing. But knowing-how is not lost through anything like that. It is lost through disuse, injury, or the loss of a supporting artifact — the pianist who hasn't played in fifteen years, the swimmer after a stroke, the driver whose route-knowledge atrophies once she relies entirely on GPS. And, more suggestively, knowing-how can survive the exact defeaters that would destroy corresponding knowledge-that: if I learned a certain technique for escaping a rip current, and later receive overwhelming expert testimony that the technique is dangerous and based on a falsehood, I may be irrational to rely on it — and yet, if I can still execute it when panicking in the water, there seems to be an important sense in which I still know how, even while I no longer know that it works. My tentative thesis is that Ryle was right that there is a deep distinction here, but that his real insight concerns norms of persistence and criticism, not the fact that knowing-how is an ability or disposition rather than a state; and that Stanley and Williamson, who analyze knowing how to F as knowing a true proposition about a way of F-ing, get something right about the ascriptions while smuggling in a false picture of what kind of knowledge is ascribed — because the knowledge-that that epistemologists actually study is the kind individuated by defeaters, and on that criterion knowing-how simply isn't a species of it. The draft is deliberately concessive: I don't want to fight the semantics, only to relocate the debate from grammar to epistemology.

  I'd like comments on three things in particular. First, the core move: is "kinds of knowledge are individuated by their loss conditions" a respectable principle, or am I dressing up a restatement of my conclusion? It would help to hear whether there are counterexamples on either side — propositional knowledge that is lost through competence-style conditions, or practical knowledge lost purely through epistemic ones. Second, the coherence of the concession: if I allow that knowing-how ascriptions are, grammatically, ascriptions of propositional knowledge, does my claim that they ascribe a *different kind* of knowledge do any real work, or does it collapse into the familiar intellectualist view with a footnote? Third, accuracy and interest: I'm reconstructing Ryle and Stanley and Williamson from memory and secondary discussions, so please flag anything in my characterization that sounds off, but don't try to supply quotations or references — I'll verify the texts myself. Above all, please tell me plainly if you think the whole framing is confused — for instance, if persistence conditions are simply the wrong level at which to draw a distinction between kinds of knowledge, or if the rip current case shows nothing more than that reliance and knowledge come apart. I'd much rather hear that now than after I've written thirty pages.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate student working on a paper about the knowing-how (KH) / knowing-that (KT) distinction.
      *   **Task:** Provide comments on a draft argument *before* writing the full paper.
      *   **Core Thesis:** The KH/KT distinction should be individuated by *loss conditions* (persistence/defeat conditions) rather than ontological category (state vs. ability) or semantic form (propositional vs. non-propositional).
      *   **Key Arguments:**
          *   KT is lost via epistemic defeat (evidence against truth/reliability).
          *   KH is lost via competence decay (disuse, injury, artifact loss).
          *   KH can survive epistemic defeaters (the rip current case: I know *how* to do it even if I believe it doesn't work).
          *   Ryle was right about the distinction but wrong about the grounds (norms of persistence/criticism vs. ability/disposition).
          *   Stanley & Williamson (S&W) are right about semantics (KH ascriptions look propositional) but wrong about epistemology (the "knowledge" ascribed isn't KT in the epistemologist's sense).
          *   Strategy: Concessive on semantics, relocating debate to epistemology.
      *   **Specific Questions:**
          1.  Is "kinds of knowledge individuated by loss conditions" a respectable principle or question-begging? Are there counterexamples?
          2.  Does the semantic concession collapse the view into Intellectualism (S&W) with a footnote?
          3.  Accuracy of Ryle/S&W characterization (no quotes needed).
          4.  General framing: Is it confused? (e.g., persistence conditions wrong level, rip current case just shows reliance $\neq$ knowledge).

  2.  **Evaluate the Core Move (Loss Conditions):**
      *   *Idea:* Individuating knowledge types by how they are lost.
      *   *Strength:* It shifts focus from metaphysics (what *is* it?) to epistemology/norms (how do we *treat* it?). This aligns with virtue epistemology and some pragmatic encroachment views.
      *   *Weakness/Risk:* Is "loss condition" a fundamental metaphysical feature or a derivative symptom? If KT and KH differ in loss conditions, *why*? Usually, we think loss conditions differ *because* the underlying states differ.
      *   *Counterexamples (KT lost via competence):* Forgetfulness. If I forget $2+2=4$, I lose KT. Is this competence decay? Maybe. But standard epistemic defeat (Gettierization, misleading evidence) is the hallmark.
      *   *Counterexamples (KH lost via epistemic):* If I believe the way to F is impossible, do I lose the ability? Not necessarily (the rip current case supports the user). But what if I lose KH because I believe I *can't*? (Self-efficacy). That's psychological, not strictly epistemic defeat of a proposition.
      *   *Verdict:* It's a respectable heuristic, but might need grounding in *why* the conditions differ (e.g., different functional roles). It risks looking like a symptom rather than a definition.

  3.  **Evaluate the Semantic Concession (Intellectualism Compatibility):**
      *   *Idea:* Grant S&W that "S knows how to F" means "S knows that w is a way to F," but argue the *knowledge relation* is different.
      *   *Risk:* S&W argue that the knowledge relation is the *same* standard epistemic relation (justification, truth, belief). If the user says "It's propositional but different knowledge," they need to explain how one relation can have two distinct loss-condition profiles.
      *   *Potential Collapse:* If it's the same relation, it should behave the same way epistemically. If it behaves differently, is it the same relation?
      *   *Solution:* Distinguish between the *content* (propositional) and the *mode of possession* (practical vs. theoretical). This sounds like a hybrid view (e.g., Bengson & Moffett, or Noë). The user needs to ensure they aren't just saying "It's KT but special." They need to argue the *epistemic norms* governing the relation differ based on the *use* of the proposition.
      *   *Verdict:* This is the danger zone. It needs careful articulation to avoid being "Intellectualism but the knowledge is magic."

  4.  **Evaluate Characterizations (Ryle & S&W):**
      *   *Ryle:* User says Ryle focused on ability/disposition vs. state. Accurate enough. Ryle was anti-intellectualist. User says Ryle's *real* insight was norms of persistence. This is a reconstruction/charitable reading. Ryle talked about "multi-track dispositions" and criticism (heeding, learning, teaching). So, plausible.
      *   *S&W:* User says they analyze KH as knowing a true proposition about a way. Accurate. User says they assume standard epistemological knowledge. Accurate (they rely on standard JTB+ frameworks).
      *   *Verdict:* No red flags on the high-level summary.

  5.  **Evaluate General Framing (Confusion Check):**
      *   *Rip Current Case:* Does this show KH $\neq$ KT, or just Knowledge $\neq$ Reliance?
      *   *Analysis:* If I know *that* w is a way, but believe it's false (due to defeat), do I still know *that*? Standard epistemology says No (defeaters kill knowledge). So if I still have KH, KH $\neq$ KT. This supports the user.
      *   *Alternative:* Maybe I don't know *that* it works, but I possess the ability. The user wants to say I *know how*.
      *   *Risk:* Is "knowing how" just "having the ability" in this case? If so, S&W would say "You don't know how, you just can do it." The user needs to defend the intuition that KH persists despite epistemic defeat.
      *   *Persistence Conditions:* Are they the right level? Metaphysicians might say "No, define the thing first." Pragmatists say "Yes, use defines kind." The user is taking a pragmatic/epistemological turn. This is viable but needs defense against metaphysical objections.

  6.  **Drafting the Response:**
      *   *Tone:* Encouraging but critical (graduate level).
      *   *Structure:* Address the three specific points + General Framing.
      *   *Content:*
          1.  **Loss Conditions:** It's not question-begging, but it's derivative. Need to explain *why* loss conditions differ (functional role). Watch out for forgetfulness (KT loss via competence).
          2.  **Semantic Concession:** High risk of collapse. Need to distinguish "propositional content" from "epistemic relation." S&W tie the relation to standard epistemology. User needs to argue for *pluralism about the knowledge relation* even if content is propositional.
          3.  **Characterizations:** Ryle reconstruction is bold but defensible. S&W summary is accurate.
          4.  **Framing:** The rip current case is strong but needs to address the "mere ability" objection. The shift from metaphysics to epistemology is the strongest selling point.

  7.  **Refining the Feedback (Self-Correction during drafting):**
      *   *Correction:* I initially thought about mentioning specific philosophers (Noë, Bengson & Moffett). The prompt asks *not* to supply references/quotations. I should keep the concepts general but maybe hint at "hybrid views" without name-dropping too much.
      *   *Emphasis:* Make sure to highlight the "Knowledge vs. Reliance" objection to the rip current case. That's the biggest threat.
      *   *Nuance:* On the loss condition point, distinguish between *constitutive* rules and *symptomatic* regularities. If loss conditions are just symptoms, the argument is weak. If they are constitutive of the *concept*, it's stronger.

  8.  **Final Polish:** Check against constraints (no quotes, plain talk on confusion, address specific questions). Ensure the distinction between "individuation" and "symptom" is clear. (Proceed to generate output).

  *(Self-Correction on "No References"):* The prompt says "don't try to supply quotations or references — I'll verify the texts myself." I can mention names if it helps contextualize the *type* of view, but I shouldn't act as a bibliography. I will focus on the conceptual landscape.

  *(Final check on the "Loss Condition" principle):* Is it respectable? In biology, species are often individuated by reproductive isolation (a kind of persistence condition). In artifact theory, by function. In epistemology, by warrant. So yes, it's respectable, but needs to be framed as "functional individuation."

  *(Final check on Rip Current):* If I believe the technique is false, can I truly execute it *as* a technique? Or am I just flailing successfully? The user needs to ensure the *intentionality* of the action remains.

  Okay, ready to write.cw
answer: |-
  This is a promising angle. Shifting the debate from metaphysics (what *is* the state?) or semantics (what does the sentence *mean*?) to epistemology/norms (how is the state *governed*?) allows you to bypass some of the stalemates in the literature. However, there are significant risks in the execution, particularly regarding the "loss condition" principle and the semantic concession.

  Here are comments on your three specific points, followed by a general assessment of the framing.

  ### 1. The Core Move: Individuation by Loss Conditions

  Is this a respectable principle, or question-begging?

  It is respectable, provided you frame it correctly. In many domains, we individuate capacities or states by their stability conditions rather than their static ontology. (Think of how we distinguish a *disposition* from a *categorical property* by how it reacts to stimuli). However, you face a "symptom vs. cause" objection. A metaphysical realist will argue that loss conditions are *symptoms* of the underlying nature, not the *basis* of individuation. If KT and KH have different loss conditions, the realist says, that is *because* they are different kinds of states. If you argue they are different kinds *because* they have different loss conditions, you risk reversing the explanatory order.

  **Counterexamples to watch out for:**

  *   **KT lost via competence:** You claim KT is lost through epistemic defeat. But what about forgetfulness? If I know that $p$ but simply forget it due to neural decay (disuse/injury), I have lost KT through a competence-style condition, not an epistemic defeater. You need to distinguish between losing the *content* (forgetting) and losing the *status* (justification/warrant). Epistemic defeat removes the status while the belief might remain; forgetfulness removes the belief. You need to argue that KH is lost even if the "belief" (or representation) remains, whereas KT status is lost if the belief remains but justification is defeated.
  *   **KH lost via epistemic defeat:** Consider "intellectualized" skills. A chess master might lose their ability to play at a grandmaster level if they become convinced (falsely) that the rules of chess have changed in a way that makes their openings illegal. Their competence hasn't decayed, but their epistemic confidence has collapsed, and they can no longer execute the skill. Or consider a pilot who receives (false) testimony that their instrument readings are unreliable; they may become unable to fly by instruments, not because they lost the ability, but because the epistemic defeat paralyzed the deployment of the ability. You need to distinguish between losing the *capacity* and losing the *confidence to deploy* it. Your rip current case works because the agent *does* deploy it. You must ensure your definition of "loss of KH" requires the inability to perform, not just the unwillingness.

  **Verdict:** The principle is viable if framed as "functional individuation." Don't claim loss conditions *create* the distinction; claim they reveal the distinct *normative functional roles* the states play.

  ### 2. The Coherence of the Concession

  You grant S&W that KH ascriptions are propositional but claim they ascribe a *different kind* of knowledge. Does this collapse into Intellectualism with a footnote?

  This is your biggest vulnerability. S&W's Intellectualism isn't just that KH has propositional *content*; it's that KH stands in the same epistemic *relation* to that content as KT does. They argue that the "knowledge" in "knows how" is the univocal epistemic relation studied in standard epistemology.

  If you say, "Yes, it's a relation to a proposition, but it's a *different* knowledge relation," you are effectively positing an ambiguity in the word "knows" (or the knowledge relation) that S&W explicitly argue against. To avoid collapsing into their view, you cannot just say the loss conditions differ. You must explain how one can stand in a "propositional knowledge relation" that is immune to standard epistemic defeat.

  **The Risk:** If the content is propositional (e.g., "w is a way to F"), and standard epistemology says knowledge of propositions is defeasible by evidence, then your claim that KH survives defeat looks like you are simply stipulating that "practical knowledge" follows different rules without explaining *why* the propositional nature doesn't drag it back into standard epistemology.

  **How to save it:** You need to argue that the *mode of possession* of the proposition matters. Perhaps in KH, the proposition is held "in the motor system" or "in the practical stance" rather than "in the belief box." This moves you toward a hybrid view (sometimes called "practical intellectualism"). You must argue that the *grammar* is propositional, but the *epistemic economy* is practical. If you don't explain the mechanism of this insulation from defeat, it will look like you are accepting S&W's semantics but arbitrarily exempting the epistemology.

  **Verdict:** It does real work *only if* you argue that the epistemic norms are tied to the *use* of the proposition, not just its form. If you treat the proposition as a blueprint for action rather than a description of the world, you can justify why evidence against its truth doesn't dismantle the knowledge (because the "knowledge" is the successful coupling of agent and world, not the accuracy of the map).

  ### 3. Accuracy and Interest (Ryle and S&W)

  *   **Ryle:** Your reconstruction is charitable but defensible. Ryle did focus heavily on the multi-track nature of dispositions and the criteria for teaching/correcting (norms). However, Ryle was notoriously hostile to the idea of "states" at all. Your view posits a state (or relation) that has specific persistence conditions. Ryle might reject the reification. You are essentially "neo-Rylean" in spirit but more metaphysically committed than he was. This is fine, but acknowledge that you are updating Ryle, not just interpreting him.
  *   **S&W:** Your characterization is accurate. They do treat the knowledge relation as standard epistemic justification + truth + belief. They do rely on the linguistic data (embedded questions) to drive the metaphysics. Your strategy of conceding the linguistics to fight on epistemological grounds is a known move, but you must be careful not to concede too much. If you concede the semantics entirely, you must explain why the semantics doesn't dictate the epistemology (i.e., why the logic of "knowing a proposition" forces standard defeat conditions).

  ### General Framing: Is it Confused?

  **The "Persistence Conditions" Objection:**
  A critic might say persistence conditions are the wrong level. They are derivative. We don't define "water" by how it spills; we define it by H2O, and the spilling follows. Similarly, we define knowledge by its nature, and the loss conditions follow.
  *   **Response:** You need to argue that for *functional* kinds (like knowledge), the norms of persistence *are* partly constitutive. Knowledge is a tool; how it breaks tells you what tool it is. This is a pragmatic/functionalist meta-epistemology. Make this explicit.

  **The Rip Current Case (Reliance vs. Knowledge):**
  You worry this case might just show reliance $\neq$ knowledge.
  *   **Analysis:** In standard epistemology, if you have a defeater, you lose knowledge *even if you keep believing*. So if the agent in the water has a defeater (expert testimony), standard KT says they *do not know* the technique works. If you intuitively feel they *still know how* to escape, then KH $\neq$ KT.
  *   **The Trap:** An Intellectualist will say: "Your intuition is wrong. If they have a defeater, they don't know how. They just have the ability."
  *   **Your Defense:** You must defend the intuition that "knowing how" is more robust than "knowing that." The swimmer *knows how* to survive even if they are irrational to believe it will work. This suggests KH is tethered to *success conditions* (can I do it?) rather than *truth conditions* (is it true?). This aligns with your loss condition thesis (KH is lost when I can't do it, not when I shouldn't believe it).

  **Final Verdict:**
  The framing is not confused, but it is high-risk. You are attempting to decouple the *semantics* of knowledge ascriptions from the *epistemology* of knowledge norms. This is a sophisticated move, but it requires you to explain why the semantics (which S&W argue tracks the epistemology) doesn't drag the epistemology along with it.

  **Recommendation:**
  Lean harder into the **functionalist** aspect. Don't just say "loss conditions differ." Say "Knowledge is a normative status defined by its role in reasoning and action." KT plays a role in theoretical reasoning (sensitive to truth/evidence). KH plays a role in practical reasoning/action (sensitive to success/ability). Because the roles differ, the conditions for losing the status differ. This grounds your loss-condition thesis in something deeper than mere observation of when people say "I forgot."

  If you can ground the loss conditions in the *functional role* of the knowledge, you avoid the charge that you are just listing symptoms. You are then arguing that because the *job* of KH is different from KT, the *firing conditions* (loss conditions) are different, even if the *raw material* (propositional content) is the same. That is a paper worth writing.
