prompt: |-
  I write for a science-and-ideas magazine and am preparing a long piece on escalation of commitment, from the Anglo-French Concorde project to present-day institutional failures. In interviews and drafts, the proverb "don't throw good money after bad" gets invoked constantly — by behavioral economists, by editors trimming my copy, once by a policymaker waving away an entire infrastructure program. I want to be precise about what the proverb actually commits anyone to before I lean on it, and I've realized I'm not sure it says just one thing. It seems to slide between (a) a near-tautology of rational choice theory, that unalterable past expenditures cannot themselves change which future option is best; (b) an empirical claim about human psychology, that we systematically violate the tautology; and possibly (c) a stronger normative claim, that any weight given to sunk costs in deliberation is a mistake. But the counterexamples complicate the last reading, and I need help sorting them.

  Two sets of complications in particular. First, the evolutionary literature: I understand Dawkins and Carlisle coined the phrase "the Concorde fallacy" in 1976 to describe nonhuman animals persisting with a course of action because of what they had already invested, and that Arkes and Ayton later argued animals don't in fact commit the error, only humans do — and that humans do it by misapplying a social rule about persevering, not by miscomputing. I want to represent this dispute fairly in the piece, and it matters for which reading of the proverb is doing the work: if the error is a misfiring norm rather than a computational failure, then the proverb as psychological description and the proverb as decision-theoretic injunction come apart in interesting ways. Second, the objections that honoring sunk costs can sometimes be rational: reputational follow-through, signaling resolve to future counterparties, and self-binding in the style of commitment strategies, where the fact that I've already paid is supposed to discipline me and others. My working worry is that once these are granted, everything turns on whether the "already paid" fact enters deliberation as a genuine sunk cost or as evidence about the future — and that the proverb, as used, never tells us which it means, so people end the argument by equivocation.

  So: lay out the distinct precise claims that "don't throw good money after bad" could be expressing — including at least the tautological, the psychological-descriptive, and the normative readings, plus any others you think are genuinely in play — and for each say whether it is a platitude, a substantive and defensible claim, or false. Then say which reading is actually being invoked in each of my three use cases: the behavioral economist explaining a finding, the editor cutting my sentence, and the policymaker dismissing a program. And finally, give a verdict on the counterexamples: do reputation, signaling, and commitment show that honoring sunk costs can be rational, or do they only work because the past expenditure carries forward-looking information or forward-looking effects — in which case the proverb, read carefully, survives? I'd like the readings as a numbered menu I can adapt into the piece's structure, not a single favored interpretation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Writer for a science-and-ideas magazine.
      *   **Topic:** Escalation of commitment (Concorde fallacy, institutional failures).
      *   **Problem:** The proverb "don't throw good money after bad" is used loosely and ambiguously. The writer wants to disentangle its meanings to use it precisely in the piece.
      *   **Specific Complications:**
          1.  Evolutionary literature (Dawkins/Carlisle vs. Arkes/Ayton): Is it a computational error or a misfiring social norm?
          2.  Rational Counterexamples: Reputation, signaling, self-binding. Do these invalidate the proverb or just redefine the "cost"?
      *   **Deliverables:**
          1.  A numbered menu of distinct precise claims (tautological, psychological, normative, etc.) with an evaluation (platitude, substantive, false).
          2.  Analysis of the three use cases (economist, editor, policymaker) to identify which reading they are invoking.
          3.  A verdict on the counterexamples (reputation, signaling, commitment) regarding whether they refute the proverb or preserve it via forward-looking mechanisms.
      *   **Tone:** Precise, analytical, suitable for a high-level intellectual magazine piece.

  2.  **Deconstruct the Proverb ("Don't throw good money after bad"):**
      *   *Literal meaning:* Don't spend more resources (good money) on a failed venture (bad money/situation).
      *   *Underlying concept:* Sunk Cost Fallacy.
      *   *Ambiguity:* Is it describing *what is* (psychology), *what ought to be* (normative), or *what is logically necessary* (decision theory)?

  3.  **Drafting the Numbered Menu of Claims:**
      *   *Claim 1: The Decision-Theoretic Tautology.* (Rational Choice Theory). Past costs are unrecoverable. Only future marginal costs and benefits matter.
          *   *Status:* True/Platitude (within standard rational choice framework).
      *   *Claim 2: The Psychological Description.* Humans *do* factor in sunk costs.
          *   *Status:* Substantive/Empirically True (Arkes & Blumer, etc.).
      *   *Claim 3: The Normative Injunction.* You *ought not* factor in sunk costs.
          *   *Status:* Substantive/Defensible (but needs caveats).
      *   *Claim 4: The Evolutionary/Ethological Claim.* Animals don't do this; humans do (Arkes/Ayton view) OR Animals do this (Dawkins/Carlisle view).
          *   *Status:* Contested/Refined. Need to capture the "misfiring rule" nuance.
      *   *Claim 5: The Heuristic/Rule-of-Thumb.* In complex real-world scenarios, treating sunk costs as signal is often efficient.
          *   *Status:* Substantive/Defensible (Gigerenzer-style ecological rationality).

  4.  **Analyzing the Use Cases:**
      *   *Behavioral Economist:* Likely invoking Claim 2 (Psychological Description) + Claim 3 (Normative). They are explaining *why* people fail (psych) and implying they *shouldn't* (norm).
      *   *Editor:* Likely invoking Claim 1 (Tautology/Platitude). "Cut the fluff, stick to the logic." It's a shorthand for "this argument is logically unsound."
      *   *Policymaker:* Likely invoking Claim 3 (Normative) but potentially misapplying it to ignore Claim 5 (Signaling/Reputation). They are using it as a political shield.

  5.  **Addressing the Counterexamples (Reputation, Signaling, Commitment):**
      *   *The Core Question:* Do these make sunk cost reasoning rational?
      *   *Analysis:*
          *   *Reputation/Signaling:* The past spend isn't the *cause* of value; it's a *signal* of future type. The cost is an investment in credibility, not a recovery of past loss.
          *   *Self-Binding:* The past spend changes the *future* payoff structure (e.g., gym membership).
      *   *Verdict:* The proverb survives *if* defined strictly as "don't let unrecoverable costs dictate future utility maximization *absent forward-looking consequences*." If the past cost creates future consequences (reputation), it's no longer a "sunk cost" in the strict decision-theoretic sense; it's an investment.
      *   *Nuance:* The equivocation happens when people call something a "sunk cost" when it actually has signaling value.

  6.  **Refining the Evolutionary Dispute (Dawkins/Carlisle vs. Arkes/Ayton):**
      *   Dawkins/Carlisle (1976): Animals *do* exhibit Concorde fallacy (persistence based on investment).
      *   Arkes/Ayton (1999): Animals *do not*. They persist based on future prospects. Humans persist due to a learned social norm ("don't waste") that is misapplied.
      *   *Implication for the Proverb:* If Arkes/Ayton are right, the proverb warns against a *cultural* glitch, not a *cognitive* bug. This strengthens the Normative claim (we can unlearn it) but complicates the Psychological claim (it's not universal).

