answer: |-
  **To:** Board of Directors, Korean Weekend School
  **From:** [Your Name]
  **Date:** October 26, 2023
  **Subject:** Recommendation on History Textbook Adoption

  Hi everyone,

  I've been reviewing the two textbook options for our middle/high school history class, and I want to share my perspective before we vote. This is a tough call because both sides have valid points. We all want the same thing: for our kids to actually engage with their heritage without learning falsehoods.

  **The Case for the New Book**
  The board member advocating for the Japanese-published text makes a strong point: **engagement matters.** If a textbook is dry and dated, students tune out. A "correct" book that sits unread teaches nothing. The new book's design, maps, and primary source boxes are objectively better. If we reject it solely based on looks, we risk keeping a book that confirms our biases but bores the kids to sleep.

  **The Problem with "Let the Teacher Fix It"**
  However, I cannot support adopting the new book as-is (Option 1). The argument that "teachers can add context verbally" places an unfair burden on our volunteers. Our teachers are parents and community members, not trained historians. Asking them to actively contradict the assigned text in real-time—explaining why "recruited" actually means "forced," or why "joining" actually means "annexation"—puts them in an impossible position. It undermines their authority and creates inconsistency across classrooms.

  **Why the Wording Isn't Just Semantics**
  Some have suggested these are just translation quirks. They aren't. Language shapes how we understand responsibility.
  *   "Workers brought to support industry" implies a job transfer. "Forced labor" implies a crime against humanity.
  *   "Women recruited to work near facilities" implies employment. The "comfort women" system was sexual slavery.
  *   "Joining" implies mutual agreement. "Annexation" implies conquest.

  If we teach our children these softened terms without correction, we aren't just teaching bad history; we are erasing the lived reality of their ancestors. For a heritage school, that undermines our core mission.

  **Recommendation: Option 3 (Adopt with Supplement)**
  I recommend we **adopt the new textbook but produce an official board-approved supplement.**

  This approach gives us the best of both worlds:
  1.  **Retention:** We keep the engaging design that gets kids reading.
  2.  **Accuracy:** We formally correct the record on specific passages.
  3.  **Critical Thinking:** We turn the error into a lesson. The supplement can explicitly state: *"This passage uses passive language. Historians agree that..."* This teaches students to read critically and understand that history is often contested.

  This protects our teachers, respects the parents' concerns, and ensures we aren't trading accuracy for aesthetics. We can commit to forming a small committee to draft the insert before the semester starts.

  Let's discuss this at the meeting.

  Best,

  [Your Name]
