          *   Proposed book: Engaging/beautiful but whitewashes Japanese colonial history (forced labor, comfort women, annexation).
          *   Conflict: Some parents are furious about the whitewashing; one board member argues engagement matters more and parents are overreacting.
          *   Teachers: Volunteers, mostly parents, no history training.
      *   **Options:**
          1.  Adopt as-is (rely on teachers).
          2.  Reject (keep old book).
          3.  Adopt with official supplement/correction insert.
