prompt: |-
  Quick context: I'm a bioinformatics PhD student, and somehow I've become the designated words person in my lab. Anything public facing -- the group blog, press release drafts, the text for the university open day, slides for donor visits -- gets sent to me to check the metaphors, ever since a release about our CRISPR work said we 'rewrote the genetic code' and a philosopher from across campus wrote a very long email to the dean about it. So this is maybe twice a month, low stakes individually but embarrassing if it goes wrong, and the PI has final sign-off but she's busy and will basically rubber-stamp whatever I mark up.

  The recurring problem is the whole information/code family: DNA as a code, as a language, a blueprint, an instruction manual; genes 'telling' cells what to do; 'editing' and 'find and replace'; 'junk' DNA. Some of these seem harmless and some get us in trouble, but the current decision procedure is vibes. I want an actual procedure I can run in fifteen minutes on a piece of text: questions to ask in order, what counts as a pass, and at what point I stop and flag the sentence for the PI because it's a values call (e.g. how much precision we're willing to trade for a headline) rather than a factual one. Ground it in what philosophy of biology and information theory actually say -- Shannon information vs. whatever semantic information is supposed to be, the fact that the genetic code proper is a mapping between codons and amino acids and maybe that's the only place 'code' is strictly earned, whether calling something a code smuggles in a coder, the frozen accident point about arbitrariness. Be honest about which distinctions I can drop in public-facing writing and which are load-bearing.

  Then run it on three sentences: (1) The genetic code translates DNA sequences into proteins. (2) Our approach lets us rewrite the genetic code to correct disease-causing typos. (3) Junk DNA turns out to carry hidden messages. And fair warning, if the procedure tells me to cut the find-and-replace framing, I want to know why that one's special since its the one journalists love. Finally, tell me where the procedure misfires -- cases it passes that will still annoy somebody, or ones it fails that are actually fine.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **User:** Bioinformatics PhD student, designated "words person" in their lab.
      *   **Task:** Create a 15-minute decision procedure for vetting public-facing text regarding biological metaphors (specifically information/code/language/blueprint family).
      *   **Context:** Previous incident involving "rewrote the genetic code" caused a philosophical backlash. PI rubber-stamps the student's markup.
      *   **Requirements:**
          *   Grounded in philosophy of biology and information theory (Shannon vs. Semantic, Genetic Code definition, Coder/Agency, Frozen Accident).
          *   Distinguish between load-bearing distinctions and those safe to drop for public communication.
          *   Define a pass/fail/escalate criteria.
          *   Apply the procedure to three specific sentences.
          *   Explain why "find-and-replace" is tricky.
          *   Identify limitations/failure modes of the procedure itself.
      *   **Tone:** Professional, pragmatic, academically rigorous but usable by a busy grad student.

  2.  **Theoretical Grounding (Mental Sandbox):**
      *   *Shannon Information:* Quantitative, syntactic, no meaning involved. DNA has high Shannon information. Safe to use generally, but doesn't imply "message."
      *   *Semantic Information:* Requires meaning, reference, truth conditions. Does DNA *mean* anything? Only relative to the cellular machinery (ribosomes, tRNA).
      *   *The "Genetic Code":* Strictly speaking, it's the codon-amino acid mapping table. It is universal (mostly), arbitrary (frozen accident), and *not* easily changed. Changing the *sequence* is not changing the *code*. This was the specific trigger for the philosopher's email.
      *   *Blueprint/Instruction:* Implies design/intent (teleology). "Blueprint" suggests a 1:1 map of the final organism (wrong, epigenetics/environment matter). "Instruction" is slightly better but still implies a commander.
      *   *Junk DNA:* Loaded term. "Non-coding" is better. "Hidden messages" implies intent/semantics where there might just be structural function or noise.
      *   *Agency/Coder:* "Code" implies a coder. In biology, evolution is the "coder," but it's blind. Metaphors shouldn't imply intelligent design unless qualified.
      *   *Find-and-Replace:* CRISPR edits sequence, not the code (mapping). But "edit" is standard parlance now. The risk is conflating *sequence* editing with *code* rewriting.

  3.  **Drafting the Procedure (The "15-Minute Filter"):**
      *   Need a step-by-step checklist.
      *   *Step 1: The "Code" Check.* Is "Genetic Code" used to mean "Genome/Sequence"? If yes, Flag.
      *   *Step 2: The Agency Check.* Does it imply a sender/receiver or intent? (Teleology).
      *   *Step 3: The Determinism Check.* Does it imply the DNA alone determines the outcome? (Blueprint vs. Recipe).
      *   *Step 4: The Value Check.* Is a term pejorative or misleading? (Junk).
      *   *Decision:* Pass (Safe), Revise (Fixable), Escalate (Values/Trade-off).

  4.  **Refining the Distinctions (Load-bearing vs. Droppable):**
      *   *Droppable:* Shannon vs. Semantic nuance (public doesn't care). "Instruction" is usually okay if not overblown.
      *   *Load-bearing:* Code vs. Sequence (Critical). Blueprint (Misleading on development). Junk (Scientifically outdated/pejorative).

  5.  **Applying to the Three Sentences:**
      *   *(1) The genetic code translates DNA sequences into proteins.*
          *   Analysis: Technically, the *ribosome/tRNA machinery* translates using the code. The code itself is the mapping. But this is standard shorthand.
          *   Verdict: Pass (with minor mental note).
      *   *(2) Our approach lets us rewrite the genetic code to correct disease-causing typos.*
          *   Analysis: "Rewrite the genetic code" = Changing codon assignments (e.g., stop codon to amino acid). "Correct typos" = Editing sequence (SNPs). The sentence conflates the two. This is the exact error from the prompt's context.
          *   Verdict: Fail/Flag. Needs change to "edit the genome/sequence."
      *   *(3) Junk DNA turns out to carry hidden messages.*
          *   Analysis: "Junk" is outdated. "Hidden messages" implies semantic intent.
          *   Verdict: Fail. Needs "Non-coding regions" and "functional elements."

  6.  **Addressing the "Find-and-Replace" Framing:**
      *   Why is it special? It's computationally intuitive (bioinformatics students love it). Journalists love it.
      *   Risk: It implies text processing on a semantic level. DNA isn't text; it's chemistry. But as a metaphor for *sequence editing*, it's robust *unless* it slips into "rewriting the code."
      *   Nuance: It works for *sequence*, fails for *code*.

  7.  **Identifying Procedure Failure Modes:**
      *   *False Positives:* Flagging harmless metaphors that make text readable (e.g., "language of life" in a donor speech).
      *   *False Negatives:* Missing subtle teleology (e.g., "cells decide").
      *   *The "Bored Expert" Problem:* Philosophers might still nitpick even if the procedure is followed.
      *   *Audience Mismatch:* Donors want wonder; philosophers want precision. The procedure optimizes for precision, might kill wonder.

  8.  **Review and Refine:**
      *   Make sure the tone isn't *too* academic. It needs to be a tool for a busy student.
      *   Ensure the distinction between "Genetic Code" (the cipher) and "Genetic Sequence" (the message) is the centerpiece, as that caused the original incident.
      *   Check the Shannon vs. Semantic bit: Keep it brief. Shannon = pattern; Semantic = meaning. DNA has Shannon info relative to the cell.
      *   *Self-Correction on Sentence 1:* "The genetic code translates..." is technically agent-less. The *machinery* translates *according to* the code. I should flag this as a "Revise" rather than a hard "Pass" to be rigorous, but acknowledge it's common usage. Actually, for a 15-min filter, if it's standard textbook phrasing, let it pass but note the nuance. Let's make it a "Pass with Note."
      *   *Self-Correction on Sentence 2:* This is the critical one. Must be hard "Flag."
      *   *Self-Correction on Sentence 3:* "Messages" is the semantic trap. Hard "Flag."

  9.  **Final Polish:** Organize with clear headings. Ensure the "Why" is clear for each step. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the Shannon vs. Semantic distinction. In biology, "information" is often used functionally (Godfrey-Smith, Maynard Smith). It's not pure Shannon, but it's not human semantic meaning either. It's "bio-semantics." I should advise the user to avoid "meaning/message" unless metaphorical, but "information" is generally safe if qualified.

  Let's structure the procedure as a flowchart logic but in text.
  1. Code vs. Sequence.
  2. Agency/Teleology.
  3. Determinism.
  4. Pejoratives.

  Okay, ready to write.s
answer: |-
  Here is a 15-minute decision procedure grounded in philosophy of biology and information theory, designed to minimize philosophical backlash without rendering your text unreadable.

  ### The "Code vs. Sequence" Filter (15-Minute Procedure)

  This procedure prioritizes the distinction that triggered your previous incident: the difference between the **cipher** (the Genetic Code) and the **message** (the Genome/Sequence).

  #### Step 1: The "Code" Audit (3 Minutes)
  Scan for the words *code, cipher, language, dictionary, alphabet*.
  *   **The Hard Rule:** The **Genetic Code** is strictly the mapping table between codons (triplets) and amino acids (e.g., AUG = Methionine). It is universal (mostly), arbitrary (frozen accident), and chemically implemented by tRNA/ribosomes.
  *   **The Test:** Is the text claiming to change the *mapping* (e.g., making UGA code for Tryptophan instead of Stop)?
      *   **Yes:** You may use "Genetic Code." (Rare, synthetic biology only).
      *   **No:** You are changing the *sequence* (genome). You must use "genome," "sequence," or "DNA."
      *   **Action:** If "Genetic Code" is used to mean "an individual's DNA," **FLAG FOR REVISION.**
  *   **Load-Bearing Distinction:** This is non-negotiable. Conflating Code and Sequence implies you can change the rules of biology rather than the state of a specific organism. This is where philosophers and serious journalists will catch you.

  #### Step 2: The Agency & Teleology Check (4 Minutes)
  Scan for verbs of intention: *tell, instruct, decide, want, message, meaning, purpose.*
  *   **The Theory:** DNA carries **Shannon Information** (pattern/surprise) and **Bio-Semantic Information** (functional role relative to the cell's machinery). It does not carry human semantic meaning (truth claims) or intent.
  *   **The Test:** Does the metaphor imply a *sender* or a *goal* external to survival/reproduction?
      *   **Safe:** "Instructions," "Blueprint" (with caveats), "Signal." These describe functional causality.
      *   **Risky:** "Message," "Meaning," "Language." These imply a receiver capable of interpreting semantics (a homunculus).
      *   **Action:** If "message/meaning" is used metaphorically for "functional element," **REVISE** to "function" or "signal." If it implies intelligent design, **FLAG.**
  *   **Load-Bearing Distinction:** Avoid "Message." It smuggles in a coder. "Instruction" is acceptable shorthand for "causal precursor."

  #### Step 3: The Determinism Check (3 Minutes)
  Scan for *blueprint, plan, destiny, hard-wired.*
  *   **The Theory:** Genotype $\neq$ Phenotype. Development is contingent on environment and epigenetics.
  *   **The Test:** Does the text imply the DNA alone constructs the organism?
      *   **Safe:** "Recipe," "Toolkit," "Parts list." These imply ingredients that require processing.
      *   **Risky:** "Blueprint," "Plan." These imply a 1:1 spatial map or pre-determined outcome.
      *   **Action:** If "Blueprint" is used for complex traits (behavior, morphology), **REVISE** to "Recipe" or "Influence."
  *   **Load-Bearing Distinction:** "Blueprint" is scientifically outdated but culturally sticky. For donor slides, "Blueprint" might pass, but for press releases, "Recipe" is safer.

  #### Step 4: The Value/Pejorative Check (3 Minutes)
  Scan for *junk, error, typo, mutation, defect.*
  *   **The Theory:** "Junk DNA" is historically loaded and often functionally incorrect (regulatory elements). "Typo" implies a correct original text (teleology).
  *   **The Test:** Is the term scientifically accurate or value-laden?
      *   **Safe:** "Variant," "Non-coding," "Difference."
      *   **Risky:** "Junk," "Typo," "Defect."
      *   **Action:** "Typo" is acceptable for single-nucleotide variants *if* the disease context is clear (it implies 'correction' of function, not 'perfection'). "Junk" must be **CUT** and replaced with "Non-coding."
  *   **Load-Bearing Distinction:** "Junk" is the easiest target for critics. "Typo" is generally acceptable public shorthand for SNP, provided Step 1 (Code vs. Sequence) is respected.

  #### Step 5: The Escalation Decision (2 Minutes)
  *   **PASS:** Metaphors are functional, "Code" is used strictly, no implied designer.
  *   **REVISE:** Metaphors are slightly loose but fixable (e.g., swap "Blueprint" for "Recipe," "Junk" for "Non-coding"). Do this yourself.
  *   **FLAG (Escalate to PI):** The text requires a trade-off between scientific precision and public impact.
      *   *Example:* A donor speech wants "The Language of Life" for emotional resonance. This violates Step 2 (Semantics) but might be necessary for fundraising.
      *   *Example:* A headline needs "Rewriting the Code" to get clicks, but you are editing sequence. This is a lie, but the PI might accept the risk.
      *   *Why Escalate:* These are values calls. You are the accuracy filter; the PI is the risk manager.

  ---

  ### Application to Your Three Sentences

  #### (1) "The genetic code translates DNA sequences into proteins."
  *   **Step 1 (Code):** Passable shorthand. Technically, the *ribosome* translates *using* the code, but standard textbooks often elide the machinery.
  *   **Step 2 (Agency):** "Translates" is a functional verb, not necessarily intentional.
  *   **Verdict:** **PASS.**
  *   **Note:** It is imprecise (the code is the mapping, not the actor), but it is standard pedagogical phrasing. It won't trigger a philosopher unless they are looking for a fight.

  #### (2) "Our approach lets us rewrite the genetic code to correct disease-causing typos."
  *   **Step 1 (Code):** **FAIL.** You are editing the *sequence* (the message), not the *code* (the cipher). Unless you are doing synthetic biology to reassign codons globally, this is factually incorrect.
  *   **Step 4 (Value):** "Typos" is acceptable shorthand for pathogenic variants, but only if the "Code" error is fixed.
  *   **Verdict:** **FLAG FOR REVISION.**
  *   **Fix:** "Our approach lets us **edit the genome** to correct disease-causing **variants**." (Or keep "typos" if the PI insists, but *never* keep "rewrite the genetic code").
  *   **Why:** This is the exact sentence that caused your previous incident. It claims you changed the rules of the game, not just the score.

  #### (3) "Junk DNA turns out to carry hidden messages."
  *   **Step 1 (Code):** N/A.
  *   **Step 2 (Agency):** **FAIL.** "Messages" implies semantic content and a sender.
  *   **Step 4 (Value):** **FAIL.** "Junk" is pejorative and scientifically contested.
  *   **Verdict:** **FLAG FOR REVISION.**
  *   **Fix:** "**Non-coding DNA** turns out to carry **functional elements**."
  *   **Why:** "Messages" invites the "who sent them?" critique. "Junk" invites the "you don't read the literature" critique.

  ---

  ### The "Find-and-Replace" Framing: Why It's Special

  You asked why "find-and-replace" is treated differently than "rewriting the code."

  1.  **Computational Isomorphism:** Bioinformatics *actually uses* find-and-replace algorithms on sequence files (FASTA/Q). The metaphor maps directly to the *methodology* of the bioinformatician, even if the wet-lab mechanism (CRISPR/Cas9) is chemical. It describes the *intent* of the operator, not the biology of the cell.
  2.  **Sequence vs. Code:** "Find-and-replace" operates on the *string* (Sequence). "Rewriting the code" operates on the *compiler* (Genetic Code).
  3.  **The Risk:** It is safe **only if** applied to the *genome/sequence*.
      *   *Safe:* "We used a find-and-replace strategy on the gene sequence."
      *   *Unsafe:* "We used find-and-replace on the genetic code."
  4.  **Journalistic Appeal:** It works because it demystifies the tech. It frames the scientist as an editor, not a god. Keep it, but ensure the object being edited is the *sequence*, not the *code*.

  ---

  ### Where This Procedure Misfires (Limitations)

  No filter is perfect. Here is where this procedure will generate false positives or negatives:

  **1. The "Wonder" False Positive (Over-correction)**
  *   **Case:** A donor speech says, "We are decoding the language of life."
  *   **Procedure:** Flags this (Step 2: Semantics/Agency).
  *   **Reality:** This is fine for donors. It generates funding. It is poetic, not propositional.
  *   **Fix:** Escalate to PI. If the context is "Inspiration," relax Step 2. If the context is "News," enforce Step 2.

  **2. The "Standard Usage" False Negative**
  *   **Case:** A textbook-style explanation says, "The cell reads the DNA."
  *   **Procedure:** Flags "Reads" (Step 2: Agency).
  *   **Reality:** "Reading" is so entrenched in molecular biology (transcription/translation) that flagging it makes you look pedantic to biologists, even if philosophers wince.
  *   **Fix:** Whitelist "Read/Write/Edit" as standard technical metaphors. Ban "Message/Meaning/Intent."

  **3. The "Philosopher's Trap"**
  *   **Case:** You fix everything. "We edited the genome sequence to correct variants."
  *   **Reality:** A philosopher might still argue that "Variant" implies a norm, or "Edit" implies authorship.
  *   **Fix:** You cannot satisfy a determined critic. This procedure is designed to stop the *email to the Dean*, not the *paper in Philosophy of Science*. If you pass Step 1 (Code vs. Sequence) and Step 4 (Junk), you are safe from administrative embarrassment.

  **4. The "Blueprint" Nuance**
  *   **Case:** "DNA is the blueprint for the eye."
  *   **Procedure:** Flags "Blueprint" (Step 3).
  *   **Reality:** For a specific organ with high heritability, "blueprint" is less misleading than for "behavior."
  *   **Fix:** Context matters. If the trait is highly deterministic, "Blueprint" is a low-risk metaphor. If it's behavioral, it's high-risk.

  ### Summary Checklist for Your Desk
  1.  **Code = Cipher.** Sequence = Message. Never swap them.
  2.  **No Messages.** DNA has function, not meaning.
  3.  **No Junk.** Use "Non-coding."
  4.  **Blueprint = Risky.** Recipe = Safe.
  5.  **If in doubt on tone:** Escalate to PI. If in doubt on fact: Fix it.
