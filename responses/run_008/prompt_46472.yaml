prompt: |-
  I am midway through my fourth novel and have become preoccupied, to the detriment of the actual writing, with a question I cannot settle: whether my characters could have had different origins, and whether whatever answer I give for them extends to me. I have written down my verdicts on a set of cases, and I should like to know whether any single principle captures them, or whether some of them must simply go.

  Here are the verdicts. Clara, my protagonist, could have been born in Lisbon rather than Vienna, raised by her aunt rather than her grandmother, and become a cartographer rather than a cellist: still Clara, and still the same character. If I had instead conceived the book about a child born to an entirely different couple in Oslo, I do not think I could have called that character Clara; she would have been someone new. When the hospital in the novel swaps two newborns and each is raised by the wrong family, I side with the child who came from the zygote and not the one who came from the cot: origins fix identity, rearing does not. So far, so consistent, and rather Kripkean, I believe.

  But now the difficulties. My mother used to say that had her wedding been delayed by a fortnight, I should have been conceived a fortnight later, and I find I agree with her — that later child would still have been me — even though a fortnight's delay almost certainly means a different sperm and perhaps a different egg, in which case origin essentialism must be wrong about me. I also think my brother could have been conceived with a different sperm from my father — my parents tried for some months, after all — and still be my brother, whereas he could not have had a different father. And there are the twins in the second chapter, who came from one zygote that split: each, I feel, could have existed without the other, though I cannot see how a view on which the zygote is the origin allows this, since they share an origin exactly.

  Then there is the matter peculiar to my trade. Clara did not, in fact, originate in the current novel: she first appeared, under another name, as a minor figure in a book I abandoned a decade ago. Yet I am sure she could have debuted in the present book without the abandoned one ever existing — so her actual origin is not essential to her. At the same time, if another novelist had written a book with a character answering to Clara in every detail, I would not say that character was Clara. Characters, it seems, are tied to their authors but not to their first appearances, while people, on my verdicts, are tied to their gametes and to nothing else I can name.

  So: is there one principle here, or two, or none? Please state the principle, or the small set of candidate principles, as precisely as you can; motivate each clause by reference to a specific case above; say what the principle or principles predict for cases I have not listed — a frozen embryo stored for years before implantation, say, or a character carried over into a sequel written by my literary executor after my death — and be honest about which of my verdicts cannot be accommodated by any tolerably simple view, and which of them you would advise me to abandon. I would prefer that you respond in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist midway through their fourth novel.
      *   **Problem:** Preoccupied with metaphysical questions about character/personal identity and origins, potentially hindering writing.
      *   **Input:** A set of specific "verdicts" or intuitions about identity cases involving their protagonist (Clara), themselves, their family, and fictional characters generally.
      *   **Task:**
          1.  Determine if a single principle (or small set) captures these verdicts.
          2.  State the principle(s) precisely.
          3.  Motivate each clause using the specific cases provided.
          4.  Predict outcomes for new cases (frozen embryo, literary executor sequel).
          5.  Be honest about which verdicts don't fit a simple view.
          6.  Advise on which verdicts to abandon.
          7.  **Constraint:** Respond in British English.

  2.  **Deconstruct the Verdicts:**
      *   *V1 (Clara's properties):* Lisbon vs. Vienna, Aunt vs. Grandma, Cartographer vs. Cellist = Same Clara. (Contingent properties don't fix identity).
      *   *V2 (Clara's parents):* Different couple in Oslo = New character. (Origin/Parents essential for characters? Or specific conception event?).
      *   *V3 (Hospital Swap):* Zygote > Rearing. (Biological origin essential for persons).
      *   *V4 (Self - Conception Delay):* Fortnight later (different sperm/egg) = Still Me. (Contradicts strict Kripkean origin essentialism for persons).
      *   *V5 (Brother - Sperm/Father):* Different sperm = Same Brother. Different Father = Different Brother. (Father essential, specific gamete not).
      *   *V6 (Twins):* Monozygotic twins could exist without the other. (Zygote identity doesn't map 1:1 to person identity).
      *   *V7 (Clara's Textual Origin):* Abandoned book vs. Current book = Same Clara. (First textual appearance not essential).
      *   *V8 (Clara's Authorship):* Another novelist writing same character = Not Clara. (Authorship essential for characters).
      *   *Summary:* Persons seem tied to *parents* but not specific *gametes* or *time*. Characters seem tied to *author* but not *textual debut* or *internal properties*.

  3.  **Evaluate Philosophical Frameworks:**
      *   *Kripkean Origin Essentialism:* Fits V2, V3, V5 (partially), V8. Fails V4, V6, V7.
      *   *Psychological Continuity:* Fits V1. Fails V3 (swap), V7/V8 (fiction).
      *   *Four-Dimensionalism/Counterpart Theory:* Could explain the vagueness, but the user wants a principle of *identity*, not counterpart relations.
      *   *Sortal-Relative Identity:* Identity depends on the kind of thing (Person vs. Fictional Character). This looks promising. The rules for *Homo sapiens* differ from the rules for *Fictional Constructs*.

  4.  **Synthesizing a Principle:**
      *   There isn't *one* unified principle for both people and characters. The user explicitly notes: "Characters... are tied to their authors... while people... are tied to their gametes."
      *   However, within *People*, there is tension (V3 vs V4/V5/V6).
      *   Within *Characters*, there is tension (V7 vs V8).
      *   *Hypothesis:* We need two distinct principles: one for Biological Persons, one for Fictional Characters.
      *   *Refining the Biological Principle:* Strict gametic essentialism (Kripke) fails the user's intuition about the "fortnight delay" and the "brother's sperm." A "Parental Essentialism" works better. You must come from *these parents*, but the specific molecular instantiations (sperm/egg) can vary within a reasonable window.
      *   *Refining the Character Principle:* Strict textual essentialism (first appearance) fails V7. Strict property essentialism fails V1. "Authorial Causation" works. The character is an abstract artefact created by a specific agent's intentional act.

  5.  **Drafting the Principles (Iterative Process):**
      *   *Draft 1:* People need parents. Characters need authors.
      *   *Critique 1:* Too vague. Doesn't handle the sperm/zygote nuance.
      *   *Draft 2:*
          *   Person Principle: Identity is fixed by the specific parental couple, not the specific gametes or time of conception.
          *   Character Principle: Identity is fixed by the specific author's creative act, not the specific text or properties.
      *   *Critique 2:* This accommodates most. What about the twins? If identity is fixed by parents, twins have same parents. But user says they could exist without each other. This implies the *zygote* isn't the person. The principle needs to allow for branching at the biological level.
      *   *Refinement on Persons:* The "Origin" is the *lineage*, not the *molecule*.
      *   *Refinement on Characters:* The "Origin" is the *creative agency*, not the *artefact*.

  6.  **Addressing the "Honesty" Constraint:**
      *   Can we unify V4 (Fortnight delay = Me) with V3 (Zygote swap = Not Me)?
      *   V3 says biological material matters (zygote > environment).
      *   V4 says biological material *doesn't* matter too much (different sperm/egg = Me).
      *   *Conflict:* If the hospital swap involves a zygote from *different parents*, V3 says it's not you. If the fortnight delay involves a zygote from *same parents*, V4 says it is you.
      *   *Resolution:* This is consistent! V3 implies different parents (usually, in swap scenarios, though user says "swaps two newborns... raised by wrong family"). Wait, user says "swaps two newborns... side with the child who came from the zygote". Usually, swap cases imply different parents. If the swap is between two strangers, V3 holds (Parents matter). If V4 holds (Same parents, different gamete), there is no contradiction *unless* the swap was between siblings? No, standard swap is strangers.
      *   *Real Conflict:* The Twin Case (V6). If the zygote is the origin, and it splits, how do we get two people? If the *parents* are the origin, it's easier. But V3 privileges the zygote over the cot.
      *   *Advice:* The user needs to let go of the idea that the *zygote* is the strict individuator if they want to keep the Twin intuition. Or accept that monozygotic twinning is a metaphysical exception.
      *   *Advice on Characters:* V7 (Abandoned book) vs V8 (Other author). This is consistent under "Authorial Origin." But V7 is tricky. If the abandoned book exists, is it the same character? User says "under another name". If the author is the same, it's the same character. If the author is different, it's not. This holds.

  7.  **Structuring the Response:**
      *   **Tone:** Professional, empathetic, philosophical, British English (colour, realise, programme, etc.).
      *   **Introduction:** Acknowledge the burden of these questions on the writing process.
      *   **The Diagnosis:** There is no *single* principle covering both people and characters. There are two distinct ontological categories.
      *   **Principle 1: Biological Persons (Parental Lineage Essentialism).**
          *   Explain how it fits V3, V4, V5.
          *   Address the Twin problem (V6).
      *   **Principle 2: Fictional Characters (Authorial Causation Essentialism).**
          *   Explain how it fits V1, V2, V7, V8.
      *   **Predictions:** Frozen embryo, Literary executor.
      *   **The Hard Truths (What to abandon):** The Zygote strictness vs. Twin intuition. The "Fortnight" intuition might be shaky philosophically but artistically valid.
      *   **Conclusion:** Encouragement to write.

  8.  **Refining the British English:**
      *   Use "realise" not "realize".
      *   Use "centre" not "center".
      *   Use "whilst", "amongst" where appropriate (but don't overdo it).
      *   Phrasing: "I should advise," "It strikes me," "Literary executor."

  9.  **Deep Dive into the Conflicts (Self-Correction):**
      *   *Conflict:* V3 (Zygote essential) vs V4 (Specific gamete not essential).
      *   *Analysis:* In V3, the swap is usually between *different families*. So the zygote represents different parents. In V4, the delay is the *same parents*. So the principle is "Same Parents = Same Person (roughly)".
      *   *Conflict:* V6 (Twins). If parents fix identity, and twins have same parents, are they the same person? No. So "Parents" isn't enough. We need "Conception Event" but V4 says Conception Event can vary by a fortnight.
      *   *Resolution:* There is a "tolerance" zone. Identity is vague. I must tell the user that strict essentialism fails here. A "Sortal-Relative" approach with vagueness is the only honest philosophical answer.
      *   *Advice:* Abandon the quest for absolute precision. It's stopping the writing.

  10. **Final Polish of the Principles:**
      *   *Personhood:* "Lineage-Relative Continuity." You are defined by your ancestral line, allowing for minor biological variance (sperm/egg timing) but not major lineage variance (parents).
      *   *Characterhood:* "Authorial Intention." Defined by the mind that conceived them, allowing for textual variance but not authorial variance.

  11. **Checking the "Frozen Embryo" and "Executor" cases:**
      *   *Frozen Embryo:* If implanted later, same parents -> Same person (per V4).
      *   *Executor:* If they write a sequel, is it the same character? If they channel the original author's intent/estate permission? Philosophically, usually no (Barthes "Death of the Author"), but legally/artistically, often yes. I should lean towards the philosophical "No" based on V8 (Another novelist = Not Clara), unless the executor is acting as a vessel for the original author's will. I will argue it creates a *counterpart*, not the identical character.

  12. **Final Review against constraints:**
