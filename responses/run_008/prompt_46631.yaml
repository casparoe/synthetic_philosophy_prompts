      *   *Core Concept:* Hofstadter argues that if players are perfectly rational and know the other is perfectly rational, they will arrive at the same conclusion. Therefore, the choices are correlated not by causality but by logical identity. It's not "I choose X, so you choose X," it's "We are identical reasoning machines, so the output must be identical."
      *   *Decision Theory:* Is it EDT? It looks like EDT, but Hofstadter frames it more as a logical necessity than probabilistic evidence. It's closer to Timeless Decision Theory (TDT) or Functional Decision Theory (FDT) in modern terms, though those came later. EDT relies on correlation; Superrationality relies on *identity of reasoning*.
