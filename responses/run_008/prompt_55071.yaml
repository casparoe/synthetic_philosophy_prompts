answer: |-
  # Activity: The "Lock-In" Contract
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Topic:** Transformative Experience (Epistemic & Utility Problems)

  ## 1. Setup & Materials (5 Minutes)
  *   **Tokens:** Give each student 100 "Class Credits" (physical poker chips or printed slips). Tell them these can be redeemed at the end of class for tangible, low-stakes goods (e.g., 100 credits = choose the first 5 mins of next class topic; 50 credits = skip one discussion post; 0 credits = nothing). *Note: The specific redemption doesn't matter as much as the scarcity.*
  *   **The Menu:** Place two sealed envelopes at the front: **Project A** and **Project B**.
  *   **The Contract:** Hand out a "Future-Self Contract." It reads:
      > "I commit [X] credits to Project [A/B]. Upon completion of the Project, I will be offered a 'Relief Package.' I must decide now how much I *expect* to want that package. After the Project, I will decide how much I *actually* want it. If my Actual Want is lower than my Expected Want, I lose the difference."
  *   **Seating:** Arrange the room so students cannot easily see each other's sheets.

  ## 2. Round 1: The Blind Transformation (25 Minutes)
  **The Pitch:**
  Tell them: "You are making a decision for your future self. Project A and Project B are 15-minute tasks. One emphasizes **Rigid Structure**; the other emphasizes **Radical Ambiguity**. You do not know which is which. You do not know what it *feels like* to do them."

  **The Decision:**
  1.  Students must choose Project A or B.
  2.  They must commit **50 Credits** to the project (non-refundable entry fee).
  3.  **Crucial Step:** On their Contract, they must write down: *"I predict that after this task, I will value [Structure/Ambiguity] at [0-50] credits."* (This is their $U_{now}$ ranking of a future state).
  4.  Collect the 50 credits.

  **The Intervention (The Transformation):**
  *   **Project A Students (Structure):** Given a logic puzzle with impossible constraints (e.g., "Fill this grid, but you cannot use numbers, only symbols, and every row must sum to zero"). It is frustratingly rigid.
  *   **Project B Students (Ambiguity):** Given a blank page and the prompt: "Create a system of value for this classroom that is perfectly fair." No constraints. It is paralyzingly open.
  *   *Time:* 15 Minutes. (Let them feel the frustration/anxiety).

  **The Reveal & Payoff:**
  1.  Stop the task.
  2.  Offer the **Relief Package**:
      *   To Project A (Structure) students: Offer a "Freedom Pass" (allows them to ignore a future rule).
      *   To Project B (Ambiguity) students: Offer a "Rulebook" (a clear guide on how to succeed next time).
      *   *Note:* The Relief Package is designed to be the *opposite* of the task they just did.
  3.  **The Wall:** Ask them to bid on the Relief Package using their *remaining* 50 credits.
  4.  Most will desperately want the Relief Package because the task shifted their preference.
  5.  **The Loss:** Compare their *Pre-Task Prediction* (Step 3) with their *Post-Task Bid*.
      *   *Scenario:* A student thought "Ambiguity sounds fun, I'll value the Rulebook at 10 credits." After the paralyzing task, they value the Rulebook at 50 credits. They under-invested.
      *   *Scenario:* A student thought "Structure sounds boring, I'll value Freedom at 50 credits." After the frustrating puzzle, they crave Freedom but have no credits left because they paid the entry fee.
  6.  **Result:** They realize their pre-choice utility function ($U_{now}$) could not accurately price the post-choice outcome ($U_{future}$).

  ## 3. Round 2: The Known Category (20 Minutes)
  **The Pitch:**
  "Reset your credits to 100. We are doing this again. This time, I will tell you the *category* of transformation."
  *   **Project A:** "A task that will make you value **Certainty**."
  *   **Project B:** "A task that will make you value **Possibility**."
  *   **The Catch:** "You still do not know *what the task is*, nor do you know *how much* you will value Certainty once you are in that state. You only know the direction of the shift."

  **The Decision:**
  1.  Choose A or B. Commit 50 Credits.
  2.  Write down: *"I know this will make me value [Certainty/Possibility]. I currently value that at [X] credits."*

  **The Intervention:**
  *   Swap the tasks from Round 1 (A gets Ambiguity, B gets Structure) or use new variants. The key is the *shift* happens again.

  **The Payoff:**
  1.  Offer the Relief Package again.
  2.  Have them bid.
  3.  **Comparison:** Did knowing the *category* of preference change help them price the outcome better? (Likely not, because they still can't simulate the *phenomenal character* of valuing Certainty intensely).

  ## 4. Debrief (25 Minutes)
  *Do not mention L.A. Paul yet.*

  **Phase 1: The Data (5 mins)**
  *   Ask: "How many of you bid differently in Round 2 than Round 1?"
  *   Ask: "How many of you felt your pre-task prediction was 'wrong' even after you knew the category in Round 2?"
  *   Write two columns on the board: **Information** and **Value**.

  **Phase 2: Mapping the Problems (10 mins)**
  *   **The Epistemic Problem:** Point to the moment before they opened the envelope. "You lacked data. You couldn't simulate the experience of the logic puzzle or the blank page. You couldn't know *what it was like*."
      *   *Map:* This is the inability to form a credence about the phenomenal character of the experience.
  *   **The Utility Problem:** Point to the moment they tried to price the Relief Package *before* the task. "Even if you knew exactly what the puzzle was, could you know how much you would crave the Freedom Pass *after* your brain was rewired by frustration?"
      *   *Map:* This is the inability of $U_{now}$ to rank outcomes where $U_{future} \neq U_{now}$. Your current self is a bad agent for your future self because the 'self' changes.

  **Phase 3: The Reveal (5 mins)**
  *   Introduce **L.A. Paul** and ***Transformative Experience***.
  *   Explain that real transformative choices (having a child, emigrating, religious conversion) combine both problems: you don't know what it's like, and you don't know who you'll be.
  *   Ask: "In Round 2, knowing the 'Category' (Certainty vs. Possibility) helped a little, but did it solve the decision?" (Answer: No, because you still can't weight the new values).

  **Phase 4: Rationality Check (5 mins)**
  *   "Was it irrational to make the choice in Round 1?"
  *   Let them argue. Then suggest: If standard rational choice theory requires maximizing expected utility, and you cannot calculate expected utility, is the choice *arbitrary*? Or is there a different mode of decision-making required (e.g., revelation, commitment)?

  ## 5. Predictable Failures (Instructor Notes)
  1.  **The "Game" Mindset:** Students may treat the tokens purely as points to win, ignoring the internal shift. *Fix:* In the intro, emphasize that the "goods" redeemable for tokens are specifically designed to match their *current* stress levels (e.g., "Skip a assignment" is more valuable if you are stressed).
  2.  **Insufficient Transformation:** 15 minutes may not be enough to genuinely shift preferences. Some students might enjoy the ambiguity. *Fix:* Acknowledge this in the debrief. "For some of you, the transformation didn't take. In real life, transformative experiences are not guaranteed either."
  3.  **Collusion:** Students might share what the tasks are between Round 1 and 2. *Fix:* Collect the task sheets immediately after Round 1. Do not let them talk during the reset.
  4.  **Cynicism:** "I knew you'd trick us." *Fix:* Lean into it. "The philosophy is about the trick. The world is the instructor."

  ## 6. The Main "Fake" Aspect (Honesty Clause)
  *Include this in the debrief:*
  "In this game, the transformation was **instant** and **readable**. After 15 minutes, you knew exactly what your new preferences were. You could fill out the contract.
  In real transformative choices, the change is **slow** and **opaque**. When you become a parent, you don't get a survey after 15 minutes telling you 'You now value Sleep at 10 credits and Crying at 50 credits.' You live in the new utility function for years before you realize it has changed. The game gives you a 'God's eye view' of your preference shift immediately, which is precisely what real transformative experience denies you. You never fully know the new you."

  ## 7. Token Payoff Scheme
  *   **Start:** 100 Tokens.
  *   **Entry Fee:** 50 Tokens (Sunk cost).
  *   **Remaining:** 50 Tokens.
  *   **Relief Package Cost:** 50 Tokens.
  *   **Redemption:**
      *   100 Tokens total at end (Saved entry + bought relief): **"The Sovereign"** (Choose next class topic).
      *   50 Tokens total (Paid entry, no relief): **"The Subject"** (Standard participation).
      *   0 Tokens total (Paid entry, overspent on relief): **"The Martyr"** (Must bring snacks for next class).
  *   *Why this works:* The "Martyr" outcome creates a tangible loss for misjudging future preferences, simulating the regret of a bad transformative choice.
