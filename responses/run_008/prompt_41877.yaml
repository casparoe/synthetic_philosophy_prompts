      *   *Claim 2:* "Vagueness is... not a species of ordinary ignorance." Epistemicists agree vagueness isn't *ordinary* ignorance (like moons of Neptune), but it *is* ignorance. The user says "unlike... missing information that is simply out there." Epistemicists say the information *is* out there. So 2 contradicts the Epistemicist implication of 1+5.
