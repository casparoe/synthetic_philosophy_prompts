      *   *Claim 7:* "In-principle access." If 6 says "not accessible," 7 is threatened. But 7 says "what the world must be like" (e.g., "there must be a heap"), not necessarily the precise extension. I should treat this as a lower severity tension.

  8.  **Finalizing the Structure:**
