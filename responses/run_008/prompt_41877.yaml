      *   *Claim 7 (Semantic Competence & Access):* Competence implies in-principle access to truth conditions. (Verificationist leanings? Or just understanding conditions of satisfaction).
      *   *Claim 8 (Faultless Disagreement):* In borderline cases, contradictory assertions can both be non-mistaken. (Relativism/Contextualism/Supervaluationist flavor?).

  3.  **Initial Scan for Obvious Contradictions:**

