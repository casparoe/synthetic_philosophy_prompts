      *   **Severity Ranking:**
          1.  **The Supervenience Crash (3 + 4 vs. 1 + 5).** This is the metaphysical engine room. If meaning is *exhausted* by use, and use is *graded*, truth *cannot* be sharp.
          2.  **The Epistemic Contradiction (2 vs. 1 + 5 + 6).** Calling it "not ignorance" while positing an unknowable fact is contradictory.
          3.  **The Norm of Assertion (1 vs. 8).** Bivalence + Faultless Disagreement breaks the link between truth and assertibility.
          4.  **Competence vs. Unknowability (7 vs. 6).** Manageable if "truth conditions" are coarse, but tight if fine-grained.
      *   **Apparent Tensions:** 6 vs 7 (can be dissolved).
      *   **Recommendations:** Which to drop?
