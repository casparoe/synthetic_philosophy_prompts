      *   **Conclusion on Concepts:** The ESA is *philosophically underdetermined* but *administratively constrained*. It picks and chooses based on utility, not metaphysical purity. It acts like a "pick-and-mix" realist.

  4.  **Address the "Awkward Corners":**
