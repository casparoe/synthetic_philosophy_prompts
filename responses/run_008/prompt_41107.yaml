      *   It requires *stability* (for legal certainty) but taxonomy is *dynamic*.
      *   It treats species as *units of value* (intrinsic worth attached to the name).
      *   *Metaphysical Commitment:* Essentialism (folk essentialism) masked as operationalism. The law needs a "fact of the matter" to adjudicate rights, even if biology says it's a continuum.
      *   *The "Lump/Split" Problem:* This highlights the tension between *ontological reality* (the organisms) and *epistemic classification* (the name). The law conflates the two.

  3.  **Evaluate Species Concepts against Legal Needs:**
      *   **Biological Species Concept (BSC):** Reproductive isolation.
          *   *Pros:* Intuitive for vertebrates (matches the DPS clause logic).
          *   *Cons:* Hard to apply to fossils, asexuals, allopatric populations (like the canyon beetles). Creates "grey zones" during speciation.
      *   **Phylogenetic Species Concept (PSC):** Monophyly/Diagnosability.
          *   *Pros:* Objective (in theory), applies to all life.
          *   *Cons:* "Taxonomic inflation." Every distinct lineage becomes a species. Overwhelms administrative capacity. Makes conservation too granular.
      *   **Phenetic/Cluster Approach:** Morphological distinctness.
          *   *Pros:* Practical for museums (matches the user's experience).
