          *   *Litigation:* Shifts from "Is this a species?" (definition debate) to "Is this lineage functionally distinct/viable?" (process debate).
          *   *Coherence:* Might gain biological coherence (protecting the *process* of evolution rather than the *product*), but loses legal clarity.
      *   **Boundary Problems:** Ecosystem boundaries are just as fuzzy as species boundaries. "Significant" divergence is just as normative as "species" status.
      *   **Testing the "Pragmatic Nominalism" Hypothesis:**
