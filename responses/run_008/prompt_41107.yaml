answer: |-
  It is a pleasure to correspond with someone who has lived the tension between the drawer and the statute. Your "Tuesday/Wednesday" problem is the sharpest formulation of the species problem I have encountered in a legal context: the ontological status of the organism remains constant while its normative status flips based on a consensus shift in the epistemic community.

  To answer your primary question: The Endangered Species Act (ESA) does not merely *use* taxonomy; it relies on a specific, albeit unspoken, metaphysical framework to function. Here is a reconstruction of that framework, an evaluation of which species concepts license it, and a projection of what happens if we shift the ground beneath it.

  ### 1. The Implicit Metaphysics of the Listing Practice

  The ESA operates on a presupposition of **Folk Essentialism masked as Operational Realism.**

  Legally, a "species" under the ESA must function as a *natural kind*. For the law to assign rights, restrictions, and funding, the object of protection must be:
  1.  **Discrete:** It must have boundaries that separate it from what it is not.
  2.  **Stable:** It must persist through time sufficiently to allow for recovery plans.
  3.  **Discoverable:** There must be a "fact of the matter" that an expert can testify to in court.

  If species were purely nominal constructs (as your conventionalist colleagues might argue), the law would be protecting a human idea rather than a biological reality. The ESA cannot tolerate the view that "species are hypotheses." In court, a hypothesis is debatable; a listed entity is a legal fact. Therefore, the law presupposes a **Realist Ontology** (species exist independently of our classification) but employs an **Operationalist Epistemology** (we identify them via whatever diagnostic traits are currently agreed upon).

  This creates the friction you observed. When taxonomists "lump," they are not changing the biology, but they are changing the *legal ontology*. The law assumes that the taxonomic name maps 1:1 onto a discrete unit of nature. When the map changes, the law pretends the territory didn't change, which leads to the absurdity of a population becoming "secure" without a single organism changing.

  ### 2. Which Species Concepts License the Practice?

  You asked which accounts of species would actually license the ESA's practice. The uncomfortable truth is that the ESA is **philosophically underdetermined** but **administratively constrained.** It does not commit to one concept but requires a concept that yields *administrative discreteness*.

  *   **The Biological Species Concept (BSC):**
      *   *Fit:* Poor for the statute's breadth, but good for the "Distinct Population Segment" (DPS) clause.
      *   *Problem:* As you know, reproductive isolation is hard to prove in allopatry (the canyon beetles). If the law strictly followed BSC, many endangered allopatric populations would be unlistable because they *could* interbreed if brought together.
      *   *Legal Utility:* It provides a clear "yes/no" mechanism for vertebrates, which fits the adversarial legal system.

  *   **The Phylogenetic Species Concept (PSC):**
      *   *Fit:* Ontologically robust, administratively disastrous.
      *   *Problem:* As you noted, PSC threatens "taxonomic inflation." If every monophyletic lineage with a diagnostic character is a species, the List becomes unmanageable. Conservation resources are finite; the PSC multiplies entities beyond the capacity of the administrative state to fund them.
      *   *Legal Utility:* It offers the "fact of the matter" (gene trees), but it creates too many plaintiffs and too many defendants.

  *   **The Phenetic/Cluster Approach:**
      *   *Fit:* This is likely what the agencies actually use in practice.
      *   *Problem:* It relies on arbitrary thresholds of distinctness.
      *   *Legal Utility:* It matches the museum drawer reality. It allows for expert testimony based on morphology, which is visually demonstrable in court.

  **Verdict:** The ESA is compatible with any concept that produces **discrete, nameable units.** It is a "Concept Cocktail." The Fish and Wildlife Service (FWS) effectively adopts a *Pragmatic Realism*: they treat species as real for the purpose of the regulation, regardless of whether the underlying biology views them as real.

  ### 3. The Awkward Corners

  **The Vertebrate-Only DPS Clause:**
  This is not metaphysics-by-insect-order; it is **politics-by-charisma.** Metaphysically, it is indefensible. It implies that intraspecific variation matters ontologically for a wolf but not for a butterfly. However, legally, it acknowledges that for vertebrates, the *population* is the unit of cultural and ecological value, whereas for invertebrates, the *species* is the only unit the public (and Congress) recognizes as valuable. It is a concession that the "species" category is a proxy for "things people care about."

  **Individuals vs. Abstractions:**
  You identified a category error. The law protects *tokens* (individual organisms and their habitat) to preserve a *type* (the species).
  *   *Metaphysical implication:* The species is treated as a **Legal Person** of sorts. It has standing. The individuals are merely the physical instantiation of that legal person.
  *   *The Tension:* When we remove the last individual, the "type" goes extinct. The law treats the extinction of the type as a harm distinct from the death of the individuals. This requires a Platonic view where the "Species" has a value over and above the sum of its organisms.

  ### 4. Forward-Looking: Rebuilding the Practice

  Suppose we concede your conventionalist point and rebuild the practice around **Evolutionarily Significant Units (ESUs)**, **divergent lineages**, or **ecosystems**.

  **Institutional Changes:**
  1.  **The Experts:** We would shift authority from Systematists (who define boundaries) to Population Geneticists and Ecologists (who define processes). The question changes from "What is this?" to "What is this doing?"
  2.  **Litigation:** Currently, litigation focuses on *status* ("Is this a species?"). Under an ESU/Lineage model, litigation would focus on *viability* and *distinctness* ("Is this lineage evolving independently?" or "Is this ecosystem functionally intact?"). This is harder to adjudicate. "Distinctness" is a gradient; "Species" is a binary. Courts hate gradients.
  3.  **Coherence:** The practice would gain *biological* coherence (protecting the process of evolution rather than the static product) but lose *legal* coherence. The law requires binary triggers for enforcement (protected/not protected). Lineages blur.

  **Would the Practice Gain Coherence?**
  It would align better with evolutionary theory, but it would likely fracture the enforcement mechanism. If you protect "divergent lineages," you must define the threshold of divergence. That threshold is just as conventional as the species boundary. You have not solved the boundary problem; you have moved it from the "species" rank to the "significance" rank.

  **Ecosystems:**
  Protecting ecosystems lets species "fall where they may." This removes the taxonomic bottleneck entirely.
  *   *Institutional Shift:* Management shifts from recovery plans for specific taxa to land-use zoning for processes.
  *   *Litigation:* Shifts from "Did you kill a listed beetle?" to "Did you degrade the hydrological function of this watershed?"
  *   *Problem:* Ecosystem boundaries are even more porous than species boundaries. A "wetland" is often harder to define legally than a "frog."

  ### 5. Testing Your Hypothesis: Pragmatic Nominalism

  You suspect the law has been operating on a **pragmatic nominalism** all along and would barely notice the metaphysics shifting.

  **I believe your suspicion is largely correct, with one critical caveat.**

  The law is indeed nominally pragmatic. It does not care if the species is "real" in a Platonic sense; it cares if the species is **enforceable**.
  *   If you switch to ESUs, the law will treat "ESU" exactly as it treats "Species." It will reify the ESU. The metaphysics will shift, but the *legal essentialism* will remain. The ESU will become the new "natural kind" in the eyes of the statute.
  *   **The Caveat:** The law requires **discreteness** to function. It needs a hook to hang the regulation on.
      *   If you move to "lineages," and the science says lineages blend via introgression, the law will struggle. It cannot regulate a continuum.
      *   If you move to "ecosystems," and the science says ecosystems are open thermodynamic systems without clear borders, the law will struggle to define the jurisdiction.

  **Conclusion:**
  The law is not sensitive to *ontology* (what species *are*), but it is highly sensitive to *topology* (how species are *bounded*).

  If we shifted to protecting lineages or ecosystems, the legal machinery would attempt to impose discrete boundaries on those continuous concepts to make them actionable. We would end up with "Legal Lineages" or "Legal Ecosystems" that are just as conventional and arbitrary as "Legal Species," but perhaps biologically more meaningful.

  The metaphysics underneath could shift from Realism to Nominalism, and the courts would not notice, provided the experts continue to produce binary classifications (Listed/Not Listed). The tragedy you observed—the Tuesday/Wednesday flip—would persist regardless of the unit, because the friction is not between biology and law, but between **continuous nature** and **discrete regulation**. The law cannot regulate a gradient; it can only regulate a switch. Until we invent a legal system capable of managing probabilities and continua, we will continue to force biology into the Procrustean bed of the "Species," or whatever name we give the bed next.
