      *   **Individuals vs. Abstractions:** The law protects *tokens* (individual beetles/habitat) to save the *type* (the species). It's a category error legally, but functionally necessary. The "species" is a legal person of sorts (a rights-bearer), represented by the individuals.

  5.  **Forward-Looking Scenario (Shifting the Metaphysics):**
