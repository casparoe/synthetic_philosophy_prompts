      *   *Forward Look:* Be careful about "Ecosystems." The ESA *does* protect critical habitat, but the listing unit is the species. Shifting to ecosystems changes the *standing* to sue. That's a key legal point.
      *   *Nominalism:* If the law is nominally pragmatic, would it notice? Yes, because "discreteness" is required for enforcement. If the new unit is too fuzzy (like a "lineage" that blends into another), enforcement fails. So the law requires *operational discreteness*, regardless of ontological status.

  8.  **Final Polish:** Ensure the voice sounds like a peer discussing philosophy of biology, not a textbook explanation. (e.g., use phrases like "ontological baggage," "administrative friction," "folk essentialism").

  9.  *(Final check against constraints)*: Did I answer the specific question about which accounts license it? Yes. Did I do the forward-looking part? Yes. Did I address the pragmatic nominalism hypothesis? Yes.

