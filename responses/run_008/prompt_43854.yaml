answer: |-
  The cursor blinked on the screen, a steady white pulse against the dark mode of the admin panel. **PERMANENT ARCHIVE STATUS:** [PENDING].

  Elias sat in the blue light of the monitor, his coffee cold on the desk. Below the prompt was a checkbox: *Include Final Medical Logs in Legacy Package.*

  His son, Leo, had been gone for eight months. The digital estate company sent these reminders like clockwork, polite nudges from the void. Elias had ignored them until the final warning: *Account scheduled for purging in 48 hours.*

  He hovered the mouse over the checkbox.

  If he checked it, Leo's data would be encrypted and stored on the server's deepest tier. It would be immutable. As long as the company existed, as long as the power grid held, that cluster of bytes would remain exactly as it was. In the logic of the machine, Leo would never change. He would never age, never degrade, never cease. He would simply *be*, at coordinate T-minus-eight-months, forever.

  It was the comfort Elias had lived on for the first few weeks. The idea that loss was just a matter of perspective. That if you could just look at the universe from the right angle, outside of time, Leo wasn't gone. He was just… located elsewhere. Like a house you used to live in, still standing down the road. You aren't there, but the house is real.

  Elias scrolled down to the preview folder. *Final_Medical_Logs.pdf.*

  He didn't open it. He knew what was there. The timestamps, the vitals, the flatlining curve.

  If the house was still standing, so was the fire that burned it. If Leo existed eternally in the block of the server, then his pain existed there too, just as permanently. It wasn't passing. It wasn't a phase he moved through. It was stamped into the bedrock of reality, a permanent fixture of the universe. Every moment of confusion, every spike of fear, locked in amber. Forever.

  Elias pulled his hand back from the mouse.

  There was another way to see it. He'd read about it in the forums late at night, the ones where people talked about reality like it was a wall being built brick by brick. The past was solid. The bricks were laid. But the future? The future was empty air. Reality was growing, adding new layers on top of the old ones, but the top was always open.

  In that view, Leo was part of the solid wall. He was real. He had happened. But the wall had stopped growing around him. To keep dragging his data into the present, to force his existence into the new layers, was a lie. It was pretending the wall wasn't moving.

  If the future was open, then grief was the rational response to the edge of the wall. You weren't missing someone who was still there; you were acknowledging that the construction had moved on.

  Elias looked at the checkbox again.

  *Include Final Medical Logs.*

  If he checked it, he was choosing the Block. He was saying: *You are still here.* He was choosing the comfort of presence over the honesty of absence. He would be keeping Leo safe, but he would also be keeping him trapped. He would be preserving the suffering as an eternal truth.

  If he left it unchecked, the logs would be deleted. The account would become a static memorial, then eventually vanish. It would acknowledge the Growing Block: *You were here. Now you are not. The world continues without you.*

  It felt like a betrayal. To delete the logs was to let the pain disappear, yes, but also to let *Leo* disappear. To admit that the future did not belong to him.

  Elias stood up and walked to the window. The street outside was dark, but a neighbor's porch light was on. A car drove by, headlights sweeping across the wall. The car was gone, but the light had touched the brick.

  He thought about the last time he saw Leo. Not in the hospital, but before. At a diner. Leo had spilled coffee on his shirt and laughed, wiping it with a napkin. That moment was gone. It wasn't happening now. It wasn't happening "elsewhere" in a way Elias could access. It was a brick laid in the wall.

  If Elias kept the server active, kept the data fresh, he was trying to live in the brick. He was trying to make the past the present.

  He sat back down. The cursor was still blinking.

  He thought about the horror of the Block again. The idea that nothing ever passes away. That the scream is always screaming. That the grief is always fresh, because in the block, it never gets old. It just *is*.

  Then he thought about the horror of the Growing Block. That the scream is over. That the silence is real. That there is no place where Leo is waiting. There is only the wall behind them, and the empty air ahead.

  One offered presence at the cost of eternity. The other offered peace at the cost of finality.

  Elias moved the mouse. He didn't check the box.

  He clicked **CONFIRM DELETION**.

  A progress bar appeared. *Purging data… 10%… 40%…*

  He watched the numbers climb. He felt a physical tightness in his chest, a reflexive grab toward the screen, as if he could catch the bits before they scattered. He wanted to stop it. He wanted to save the medical logs, save the proof of the end, because if he saved the end, he saved the story.

  But he kept his hands in his lap.

  If the future was open, it had to be empty enough to walk into. You couldn't drag the whole wall behind you.

  *90%… 100%.*

  **COMPLETE.**

  The screen went dark, reflecting his own face back at him. He looked tired. He looked like a man standing at the edge of a cliff, looking at the ground he'd already walked.

  Elias stood up. The house was quiet. There was no hum of the server now, just the settling of the heating pipes. He walked out of the office and into the hallway. He knew Leo wasn't in there. He knew Leo wasn't anywhere, not in the way that mattered for tomorrow morning.

  He walked to the kitchen and poured the cold coffee down the sink. He rinsed the mug and set it in the dishwasher. He would make a fresh pot in the morning.

  He stood in the dark kitchen for a moment, waiting for the relief to hit, or the despair. Neither came. There was just the quiet, and the knowledge that the next moment hadn't happened yet. It was unwritten. It was heavy with the possibility of being anything, except what had already been.

  Elias turned off the light and went to bed. He slept, and for the first time in months, he did not dream of the past. He dreamed of nothing at all, until the alarm woke him into the new day.
