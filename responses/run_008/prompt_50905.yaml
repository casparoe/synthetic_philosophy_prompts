      *   **Requirements:**
          1.  Numbered section of agreed claims (empirical & conceptual).
          2.  Disagreements section (specifically focusing on "retrain stability"), phrased neutrally.
          3.  Concrete experiments/arguments for each crux with pre-registered predictions for both sides.
          4.  Flagging of purely verbal disputes.
          5.  Format: Numbered claims first, then table-like structure for disagreements.
          6.  Tone: Neutral, precise, no forced convergence at the end.

  2.  **Deconstruct the Philosophical/Technical Conflict:**
      *   *Realist View:* SAEs find "natural kinds." If an SAE finds a deception feature, the model *is* deceiving in a structural sense, regardless of whether we look.
      *   *Deflationist View:* SAEs are useful compression schemes. "Deception" is a label we apply to a cluster of activations that correlates with behavior. The network is just math; "features" are like constellations (patterns we see in stars, not physical connections).
      *   *Key Empirical Ground:* Steering works, probes generalize, features replicate across models (to some extent). Both sides agree on *what happens*, disagree on *what it means*.
      *   *The Crux (Retrain Stability):* If Model A and Model B are trained identically (seed/data order varied) and behave the same but have non-alignable internals, does that kill realism? Realists say "maybe features are multiply realizable." Deflationists say "see? no fixed joints."
      *   *Verbal Dispute:* What does "exist" mean? Does "representation" mean a physical subspace or a functional role?

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to balance empirical success with conceptual humility.
      *   *Empirical:* Steering vectors change behavior predictably. SAE features reconstruct activations well. Some features replicate across seeds/models (e.g., early edge detectors in vision, specific semantic concepts in LLMs).
      *   *Conceptual:* Anecdotal storytelling isn't evidence. Correlation isn't causation. Engineering utility doesn't settle ontology.
      *   *Drafting thought:* Make sure the Deflationists don't feel like they're conceding realism, and Realists don't feel like they're conceding instrumentalism. Use phrases like "predictive utility" and "robust correlations."

  4.  **Drafting Section 2 & 3: Disagreements & Tests (The Core):**
      *   *Crux 1: Retrain Stability (The user specifically asked for this).*
          *   *Scenario:* Same arch/data, different seeds. Behavior matches, internals don't align perfectly.
          *   *Realist Stance:* Features might be permuted, rotated, or distributed differently (polysemanticity/multiplicity). Lack of 1:1 mapping doesn't mean lack of structure.
          *   *Deflationist Stance:* If the "joints" were real, they'd be stable. Instability suggests the clustering is an artifact of the training trajectory, not the task structure.
          *   *Test:* Large-scale retrain study with canonical correlation analysis (CCA) or feature matching on SAEs.
          *   *Predictions:* Realists predict high *functional* alignment even if weights differ. Deflationists predict low *structural* alignment that degrades as capacity increases.
      *   *Crux 2: The "Compression" vs. "Discovery" distinction.*
          *   *Scenario:* SAE dictionary size.
          *   *Realist:* There is a "true" sparsity level.
          *   *Deflationist:* Sparsity is a hyperparameter we choose based on utility.
          *   *Test:* Varying dictionary sizes and measuring downstream task performance vs. reconstruction error.
      *   *Crux 3: Ontological Status of "Deception".*
          *   *Scenario:* A steering vector induces refusal.
          *   *Realist:* The mechanism for refusal was latent and activated.
          *   *Deflationist:* We created a new trajectory that *looks* like refusal; the "mechanism" is defined by the intervention.
          *   *Test:* Causal tracing without intervention (observational).

      *Refining the Cruxes:* The prompt emphasizes *Retrain Stability*. I should make that the primary crux. I need another strong one. Let's look at *Feature Universality*. If a feature appears in Model X and Model Y, is it the *same* feature?
      *   *Let's stick to the prompt's specific interest:* Retrain Stability is the big one. I'll add a second one about *Intervention vs. Observation* (Causal vs. Descriptive).

  5.  **Drafting Section 4: Verbal Disputes:**
      *   Identify the ambiguous terms. "Exist," "Representation," "Feature."
      *   Realists use "exist" like "electrons exist."
      *   Deflationists use "exist" like "centers of gravity exist" (useful fictions).
      *   Need to explicitly state that agreeing on terminology won't solve the empirical disagreement, but will clarify the metaphysical one.

  6.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is it too dry? It needs to sound like a scientific document. Is it too biased?
      *   *Constraint Check:* Did I include the "no convergence" rule? Yes, the conclusion must state that disagreement remains.
      *   *Specific Constraint:* "Nobody in the second camp doubts the engineering value." Ensure this is in the agreed claims.
      *   *Specific Constraint:* "Realists... think the jury is genuinely out on [retrain stability]." Ensure the Realist position isn't "It will definitely align" but "Alignment is not required for realism."
      *   *Formatting:* Numbered list, then Table.

  7.  **Final Polish:**
      *   Ensure the predictions are falsifiable.
      *   Make sure the Deflationist position doesn't sound like "science is impossible," but rather "ontology is lighter."
      *   Make sure the Realist position doesn't sound like "magic," but "structural realism."

      *(Self-Correction on Retrain Stability)*: If the Realists think the jury is out, their position in the table shouldn't be "Internals *will* match." It should be "Internals *need not* match for features to be real." The Deflationist position is "If internals don't match, features aren't real (in the strong sense)." The test needs to measure the degree of matching and correlate it with behavioral identity.

      *(Refining the Verbal Dispute)*: The prompt mentions "the model has representations" means three things. I should specify: 1. Causal leverage points. 2. Compressible statistical regularities. 3. Mind-independent entities.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Joint Statement on the Ontology of Interpretability Features
  **Draft Version 0.9 | Adversarial Collaboration Working Group**

  ## 1. Agreed Claims
  *The following claims represent the empirical and conceptual common ground established by both the Realist and Deflationist camps. Signatories from both sides endorse these statements as accurate descriptions of the current state of evidence and methodological standards.*

  1.  **Empirical Efficacy of Interventions:** Linear interventions (steering vectors) and feature ablations derived from sparse autoencoders (SAEs) or probing classifiers reliably alter model behavior in predictable directions. The success rate of these interventions exceeds chance baselines and often exceeds what would be expected if the identified directions were purely random noise or post-hoc artifacts.
  2.  **Cross-Model Regularities:** Certain features (e.g., early-vision edge detectors, specific syntactic indicators, or high-level semantic concepts) appear in models with different architectures or trained on distinct data subsets. The recurrence of these features is statistically significant and not fully explainable by architectural constraints alone.
  3.  **Out-of-Distribution Generalization:** Probes trained on specific tasks or concepts often generalize to out-of-distribution inputs or model checkpoints where the specific training signal was not explicitly present, suggesting the underlying activation patterns capture robust statistical regularities of the data/model pair.
  4.  **Engineering Utility is Ontologically Neutral:** Both camps agree that interpretability tools have high engineering value for monitoring, steering, and debugging models. Agreement on the *utility* of the tools does not constitute evidence for or against the *mind-independent existence* of the features they identify.
  5.  **Narrative Fallacy:** A human-interpretable story about a set of weights (e.g., "this neuron looks for DNA sequences") does not constitute evidence of a feature's existence without quantitative validation (e.g., causal intervention, reconstruction loss improvement, or statistical significance).
  6.  **No "God's Eye" View:** Both camps agree that we currently lack a theory that derives high-level features directly from loss landscapes or training dynamics without empirical probing. We are inferring structure from behavior and activation statistics, not deriving it from first principles.
  7.  **Definition of "Feature":** For the purposes of this document, a "feature" refers to a direction in activation space (or a set of weights) that correlates with a semantically interpretable concept or behavior and allows for successful causal intervention.

  ---

  ## 2. Disagreements and Adversarial Tests
  *The following table outlines the core ontological disagreements. The "Realist" column reflects the view that features are structural properties of the network existing prior to probing. The "Deflationist" column reflects the view that features are interest-relative clusters imposed by observers to compress and predict network behavior. Predictions are pre-registered to prevent post-hoc rationalization.*

  | Crux | Realist Position | Deflationist Position | Agreed-Upon Test / Argument |
  | :--- | :--- | :--- | :--- |
  | **1. Retrain Stability**<br>*(The "Joints of Nature" Crux)* | **Claim:** Feature reality does not require 1:1 weight/activation mapping across retrained models.<br><br>**Rationale:** Functional mechanisms may be multiply realizable. Two models can solve the task using different internal bases (rotations, permutations, or distributed codes) while instantiating the same *functional* feature. Lack of geometric alignment does not prove lack of ontological structure. | **Claim:** Feature reality requires stable structural alignment across retrained models.<br><br>**Rationale:** If features were "joints in nature" dictated by the data/task structure, independent training runs converging on the same function should converge on similar internal geometries. If internals diverge while behavior matches, the "features" are artifacts of the specific training trajectory, not the task. | **Experiment:** Train $N=50$ models of identical architecture on identical data distributions with varied seeds/data ordering. Train SAEs on each. Measure pairwise feature alignment (using matching algorithms) vs. behavioral identity.<br><br>**Realist Prediction:** Behavioral identity will remain high while structural alignment varies widely. Functional equivalence classes will be recoverable despite geometric divergence.<br><br>**Deflationist Prediction:** Structural alignment will decay toward noise levels as model capacity increases. Any observed alignment will be explainable by architectural bottlenecks, not semantic necessity. |
  | **2. The Sparsity Threshold**<br>*(The "Compression" Crux)* | **Claim:** There exists a "true" sparsity level for a given model/task where the SAE recovers the actual generating factors of the data.<br><br>**Rationale:** The model was trained to compress data; there is a ground-truth dimensionality to the concepts it represents. Over- or under-complete dictionaries introduce artifacts. | **Claim:** Sparsity is a hyperparameter chosen for human convenience, not a property of the model.<br><br>**Rationale:** The network uses dense, superposed representations. "Sparsity" is a lens we impose to make the math legible to humans. Changing the dictionary size changes the "features" discovered without changing the model, proving the features are descriptive tools, not discoveries. | **Experiment:** Train SAEs with varying dictionary sizes ($0.5\times$ to $100\times$ neuron width) on a fixed model. Measure the stability of specific semantic features (e.g., "deception," "Python code") across dictionary sizes.<br><br>**Realist Prediction:** Specific semantic features will persist and stabilize within a specific range of sparsity, corresponding to the model's intrinsic information bottleneck.<br><br>**Deflationist Prediction:** Features will fragment or merge continuously as sparsity changes. No specific sparsity level will show a "phase transition" indicating ground truth. |
  | **3. Causal vs. Descriptive**<br>*(The "Intervention" Crux)* | **Claim:** Successful steering proves the feature existed latently prior to intervention.<br><br>**Rationale:** Interventions work because they leverage existing causal pathways. If the pathway weren't there, the steering vector would not produce coherent behavior. | **Claim:** Successful steering creates a new trajectory; it does not reveal a pre-existing one.<br><br>**Rationale:** An intervention pushes the model into a region of activation space it might rarely visit. The resulting behavior is a property of the *model + intervention*, not the model alone. We are constructing the behavior, not uncovering it. | **Experiment:** Observational causal tracing (no intervention) vs. Interventional tracing on "deception" features during a task where deception is incentivized.<br><br>**Realist Prediction:** Observational traces will show the feature naturally activates during deceptive behavior without intervention.<br><br>**Deflationist Prediction:** Observational activation will be weak or noisy; strong behavioral effects will only appear when the intervention forces the activation, indicating the feature is not a necessary condition for the behavior. |

  ---

  ## 3. Verbal Disputes and Terminological Ambiguity
  *The group identifies the following areas where disagreement may be purely verbal (semantic) rather than substantive. Resolving these definitions will not solve the empirical cruxes above but will prevent talking past one another.*

  **A. The Meaning of "Exist"**
  *   **Ambiguity:** When Realists say "The deception feature exists," they often imply *mind-independent ontology* (similar to electrons). When Deflationists say "The deception feature does not exist," they often imply *lack of unique mapping* (similar to constellations).
  *   **Resolution:** We agree to distinguish between **Causal Existence** (does manipulating this variable change outcomes?) and **Structural Existence** (is this variable uniquely determined by the training objective?).
      *   *Realists* argue for Structural Existence.
      *   *Deflationists* grant Causal Existence but deny Structural Existence.
      *   *Status:* Much of the heat in our debates stems from conflating these two. If the dispute is *only* about Structural Existence, it is an empirical question (see Crux 1). If the dispute is about whether "Causal Existence" warrants the label "Real," it is a verbal dispute about the philosophy of science.

  **B. The Meaning of "Representation"**
  *   **Ambiguity:** In meetings, "the model represents X" is used to mean:
      1.  The model contains information sufficient to predict X. (Informational)
      2.  The model contains a localized subspace that controls X. (Localist)
      3.  The model "cares" about X in a teleological sense. (Teleological)
  *   **Resolution:** We agree to ban usage #3 (Teleological) from technical discussions. We agree that usage #1 (Informational) is trivially true for both sides. The dispute is exclusively about #2 (Localist).
      *   *Realists* claim Localist representations are discovered.
      *   *Deflationists* claim Localist representations are imposed.

  **C. The Meaning of "Discovery"**
  *   **Ambiguity:** Does "discovery" require uniqueness?
  *   **Resolution:**
      *   *Realists* define discovery as finding a structure that constrains future predictions.
      *   *Deflationists* define discovery as finding a structure that *could not have been otherwise* given the data.
      *   *Status:* This is a philosophical disagreement regarding scientific realism vs. instrumentalism. We agree to table this metaphysical debate and focus on the empirical predictions in Section 2.

  ---

  ## 4. Conclusion and Next Steps
  This document does not resolve the ontological status of interpretability features. It is not intended to. Its purpose is to isolate the empirical claims from the metaphysical interpretations.

  *   **If Crux 1 (Retrain Stability) favors Realists:** We will have evidence that functional mechanisms are robust even if geometric implementations vary.
  *   **If Crux 1 favors Deflationists:** We will have evidence that internal structure is highly path-dependent, supporting the view that features are descriptive tools rather than natural kinds.

  Both camps agree to proceed with the experiments listed in Section 2. We agree that if the data contradicts a camp's pre-registered prediction, that camp will update their confidence in their ontological stance proportionally. We further agree that regardless of the outcome, the engineering protocols for safety and steering remain valid, as per Agreed Claim #4.

  **Signatories:**
  *[Realist Camp Representatives]*
  *[Deflationist Camp Representatives]*
