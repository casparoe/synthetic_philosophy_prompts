prompt: |-
  I lead the appraisal unit at a regional transport ministry. Before any major project goes to the minister for approval, my analysts must produce a probabilistic estimate of its final cost, and where relevant its demand. We have been shifting from bottom-up engineering estimates toward what the planning literature calls reference class forecasting: rather than building the project up from its parts, you place it in a class of completed comparable projects and use that class's distribution of outcomes. The trouble is that nothing tells us how to pick the class, and the choice moves our answers by billions. For a proposed metro line, one analyst wants all urban rail projects worldwide; another wants only rail projects in countries at our income level; a third only projects completed in the last fifteen years, on the ground that construction practice has changed. Each class yields a different distribution, and each analyst can tell a plausible story for theirs.

  Please turn what philosophy of statistics actually knows about the reference class problem into a procedure my analysts can run in a working day, using a spreadsheet and no statistical training. It should specify: what makes a candidate class legitimate (enough members, genuine exchangeability with our project, outcomes measured the same way across the class); an ordered routine for generating, pruning, and where necessary blending candidate classes; what to do when every defensible class is small; and what to do when the class's overruns were driven by a feature our project itself has — so that the bad news in the class is not noise to be averaged away but precisely the thing we should heed. Mark clearly the points where the procedure must stop and hand the decision to a person, because the question is one of values rather than statistics. Then say how to present the result to the minister, including what to say when the reference class estimate and the bottom-up estimate disagree badly.

  Finally, run the procedure on three cases: the metro line above; a fixed bridge-and-tunnel link replacing a ferry crossing, for which the only roughly comparable projects are a handful of famous ones; and a rural road upgrade, a project type so common that the class is enormous but consists mostly of projects far smaller than ours. In at least one case the procedure should give an answer my ministry will not like — say so plainly. And be honest at the end about what the procedure cannot do, in particular whether any procedure of this kind can dissolve the choice of reference class rather than merely discipline it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Head of Appraisal Unit at a regional transport ministry.
      *   **Task:** Create a practical procedure for Reference Class Forecasting (RCF) to solve the "Reference Class Problem" (how to choose the right comparison group).
      *   **Constraints:** Must be doable in a working day, using a spreadsheet, no statistical training required.
      *   **Key Components:**
          *   Criteria for legitimate classes (size, exchangeability, measurement).
          *   Ordered routine (generate, prune, blend).
          *   Handling small defensible classes.
          *   Handling specific risk features (systematic bias vs. noise).
          *   Identify points requiring human judgment (values vs. statistics).
          *   Presentation to the Minister (handling disagreements with bottom-up estimates).
          *   Run the procedure on three specific cases (Metro, Bridge/Tunnel, Rural Road).
          *   Honesty check: Acknowledge limitations (cannot *dissolve* the problem, only *discipline* it).
      *   **Tone:** Professional, pragmatic, authoritative, honest about uncertainty.

  2.  **Deconstruct the Reference Class Problem (Philosophy/Statistics):**
      *   *The Core Issue:* Every event belongs to infinite classes. Different classes yield different probabilities. There is no purely statistical rule to pick the "right" one (Reichenbach, Salmon, Hájek).
      *   *The Solution:* It's not about finding the *true* class, but the *relevant* class based on causal homogeneity and predictive accuracy.
      *   *Key Concepts for the Procedure:*
          *   **Exchangeability:** Are the projects similar enough that we'd swap their labels without changing the underlying risk profile?
          *   **Homogeneity:** Does the class reduce variance without introducing bias?
          *   **Specificity vs. Stability:** Narrow classes are specific but unstable (small N); broad classes are stable but biased (irrelevant).
          *   **Causal Features:** If a specific risk factor (e.g., land acquisition in dense urban areas) exists in the project, the reference class *must* reflect that, or the average is misleading.

  3.  **Drafting the Procedure (The "RCF Protocol"):**
      *   *Goal:* Make it spreadsheet-friendly.
      *   *Step 1: Definition.* Define the "Target Project" features.
      *   *Step 2: Generation.* List potential classes (Broad -> Narrow).
      *   *Step 3: Legitimacy Check.* (The "Gatekeepers").
          *   N > 10 (Rule of thumb for stability).
          *   Consistent cost definition (CAPEX vs. TCO, inflation adjustment).
          *   Exchangeability (Would we bet on them equally?).
      *   *Step 4: The "Feature Match" Test.* If the project has a high-risk feature (e.g., tunneling), the class must have a high proportion of that feature.
      *   *Step 5: Selection/Blending.* Pick the narrowest legitimate class. If multiple exist, average them (model averaging).
      *   *Step 6: The Human Handoff.* Where values enter (risk tolerance, political weight).
      *   *Step 7: Reporting.* Compare RCF vs. Bottom-Up.

  4.  **Developing the Three Cases:**
      *   *Case 1: Metro Line.*
          *   Classes: Global Rail, Income-Level Rail, Recent Rail.
          *   Conflict: Specificity vs. Sample Size.
          *   Outcome: Likely high overrun. Ministry won't like it.
      *   *Case 2: Fixed Link (Bridge/Tunnel).*
          *   Problem: Small N (H handful of famous ones).
          *   Solution: Broaden definition (Major Fixed Links) but adjust for specific risk features manually or use the "Small N" protocol (expert adjustment).
          *   Outcome: High uncertainty range.
      *   *Case 3: Rural Road.*
          *   Problem: Huge N, but mostly small projects. Scale mismatch.
          *   Solution: Scale adjustment or class restriction (Major Upgrades).
          *   Outcome: RCF might be lower than Bottom-Up (optimism bias in engineering estimates for simple projects).

  5.  **Refining the "Human Handoff" Points:**
      *   Deciding which features are "essential" vs. "noise."
      *   Deciding how much weight to give RCF vs. Bottom-Up (Policy decision).
      *   Accepting the political cost of a high estimate.

  6.  **Drafting the Ministerial Briefing:**
      *   Don't hide the uncertainty.
      *   Explain *why* the numbers differ (Optimism Bias vs. Engineering Detail).
      *   Present a range (P50, P80).

  7.  **Addressing the Limitations (The "Honesty Check"):**
      *   Cannot solve the philosophical problem.
      *   Cannot predict black swans.
      *   Garbage in, garbage out (data quality).

  8.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too complex for a spreadsheet?
      *   *Fix:* Simplify the steps into a checklist format. Use "If/Then" logic.
      *   *Critique:* Did I address the "feature-driven overrun" issue?
      *   *Fix:* Explicitly add a step for "Risk Feature Matching." If the project has a known risk driver (e.g., land acquisition), the reference class *must* share that driver, otherwise discard the class.
      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a directive from a senior analyst to a team, not a textbook.
      *   *Critique:* Did I run the procedure on the cases?
      *   *Fix:* Ensure the case studies follow the steps explicitly.
      *   *Critique:* Did I include the "unpleasant truth"?
      *   *Fix:* In the Metro case, ensure the RCF shows a massive overrun compared to the engineer's estimate.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Spreadsheet/No Stats? Yes.
      *   Legitimacy criteria? Yes.
      *   Routine (Generate/Prune/Blend)? Yes.
      *   Small classes? Yes.
      *   Feature-driven risk? Yes.
      *   Human handoff points? Yes.
      *   Ministerial presentation? Yes.
      *   Three cases run? Yes.
      *   Unpleasant truth included? Yes.
      *   Philosophical honesty at the end? Yes.

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  # The Reference Class Forecasting Protocol (RCF-P)
  **To:** Appraisal Unit Analysts
  **From:** Head of Appraisal Unit
  **Subject:** Standard Procedure for Probabilistic Cost Estimation

  ## 1. Purpose and Scope
  We are adopting Reference Class Forecasting (RCF) to counteract optimism bias in engineering estimates. The "Reference Class Problem" (that any project fits infinite classes) cannot be solved by math alone. It requires disciplined judgment. This protocol converts that judgment into a repeatable spreadsheet routine. It does not remove human decision-making; it isolates exactly where that decision-making must happen.

  ## 2. Legitimacy Criteria (The Gatekeepers)
  Before a candidate class enters the spreadsheet, it must pass three binary tests. If it fails any, discard it.

  1.  **The Count Test:** Does the class contain at least **10 completed projects**? (Fewer than 10 creates statistical instability; more is better).
  2.  **The Consistency Test:** Are cost outcomes measured consistently? (e.g., all are "final construction cost excluding land" adjusted to current prices). If definitions vary by >5%, discard the class.
  3.  **The Exchangeability Test:** If we swapped our project's name tag with one in the class, would the underlying risk profile remain roughly the same? (e.g., Do not mix tunnels with surface lines unless tunneling is a minor component).

  ## 3. The Procedure (Spreadsheet Routine)

  ### Step 1: Feature Inventory (15 Minutes)
  List the **five** cost-driving features of the proposed project. Be specific.
  *   *Examples:* Urban density, tunneling percentage, land acquisition complexity, technology novelty, regulatory regime.
  *   *Mark:* Which of these are "Risk Drivers" (known to cause overruns historically)?

  ### Step 2: Class Generation (45 Minutes)
  Identify three candidate classes ranging from Broad to Narrow.
  *   **Class A (Broad):** e.g., "All Urban Rail."
  *   **Class B (Contextual):** e.g., "Urban Rail in OECD Countries."
  *   **Class C (Specific):** e.g., "Urban Rail with >50% Tunneling in Dense Cities (Last 20 Years)."

  ### Step 3: The Feature Match Filter (30 Minutes)
  Compare your **Risk Drivers** (Step 1) against the average profile of each Class.
  *   *Rule:* If your project has a specific Risk Driver (e.g., "Major River Crossing"), the Class must have a high prevalence of that feature (>50% of class members).
  *   *Action:* If Class A has 10% river crossings and your project is 100% river crossing, **discard Class A**, even if it passes the Gatekeepers. The average of Class A hides your specific risk.

  ### Step 4: Selection and Blending (30 Minutes)
  *   **Scenario 1: One Class Survives.** Use this class.
  *   **Scenario 2: Multiple Classes Survive.** Select the **narrowest** legitimate class (highest specificity).
  *   **Scenario 3: No Class Survives (Too Specific).** Revert to the broadest legitimate class (Class A), but apply a **Risk Uplift**.
      *   *Calculation:* Take the P80 (80th percentile) cost of the broad class. Add 10% for every Risk Driver present in your project but rare in the class.
  *   **Scenario 4: All Classes are Small (N < 15).** Do not average. Use the **Worst-Case Legitimate Class**. Small samples hide tail risks; assume the worst historical outcome is repeatable.

  ### Step 5: The Human Handoff (Decision Point)
  **STOP.** The spreadsheet cannot proceed further. The following are value judgments, not statistical ones.
  *   **Decision A:** Which Risk Drivers are "essential" vs. "noise"? (e.g., Is "political regime" a risk driver or noise?) *Decision Owner: Unit Head.*
  *   **Decision B:** If RCF and Bottom-Up estimates differ, which weight do we give them? *Decision Owner: Minister (informed by Unit Head).*

  ## 4. Presentation to the Minister
  Do not present a single number. Present a **Distribution Summary**.

  1.  **The Comparison:** Show the Bottom-Up Estimate (P50) vs. The RCF Estimate (P50 and P80).
  2.  **The Explanation of Disagreement:**
      *   *If RCF is higher:* "The engineering estimate assumes perfect execution. The reference class shows that projects like this historically overrun by X% due to factors engineering models miss (land, permits, scope creep)."
      *   *If RCF is lower:* "The engineering estimate includes high contingency for unknown risks. Historical data suggests these risks rarely materialize for this project type."
  3.  **The Recommendation:** "We recommend budgeting at the RCF P80 level. This provides a Y% probability of avoiding a supplementary budget request."

  ---

  ## 5. Procedure Run-Through: Three Cases

  ### Case 1: The Urban Metro Line
  *   **Project:** 20km metro, 60% tunneling, dense historic city center.
  *   **Bottom-Up Estimate:** $2.5 Billion.
  *   **Candidate Classes:**
      1.  *Global Rail:* N=500. (Passes Count). **Fails Feature Match:** Only 15% are high-tunneling historic city projects. Average overrun 20%.
      2.  *OECD Rail:* N=150. (Passes Count). **Fails Feature Match:** Only 30% high-tunneling. Average overrun 35%.
      3.  *Dense City Tunneling (Last 20 yrs):* N=12. (Passes Count). **Passes Feature Match:** 80% share risk profile. Average overrun 65%.
  *   **Procedure Application:**
      *   Class 1 & 2 discarded because their averages dilute the specific risk of tunneling in historic centers.
      *   Class 3 selected (Narrowest legitimate).
      *   **RCF Result:** P50 = $3.8 Billion. P80 = $4.5 Billion.
  *   **Ministry Reaction:** **They will not like this.** It is 50% higher than the engineering estimate.
  *   **Honest Truth:** You must report this. The "bad news" in Class 3 is not noise; it is the signal of your specific risk. To use Class 1 or 2 would be to lie by averaging away the tunneling risk.

  ### Case 2: The Fixed Link (Bridge-and-Tunnel)
  *   **Project:** Replacing a major ferry crossing with a fixed link.
  *   **Bottom-Up Estimate:** $1.2 Billion.
  *   **Candidate Classes:**
      1.  *Major Fixed Links (Global):* N=8. (Fails Count Test).
      2.  *Major Transport Infrastructure (OECD):* N=100. (Passes Count). **Fails Feature Match:** Most are roads/rail, not marine crossings.
      3.  *Marine Crossings (All sizes):* N=40. (Passes Count). **Partial Feature Match:** Mix of bridges and tunnels.
  *   **Procedure Application:**
      *   Class 1 is the "true" class but N is too small for statistical confidence.
      *   Class 3 is the best available proxy.
      *   **Small N Protocol:** Since Class 1 exists but is small, we look at its data. The 8 projects had overruns ranging from 10% to 90%.
      *   **Blending:** We take Class 3 (Marine Crossings) P80, but we manually uplift it to match the *minimum* overrun of the "Famous 8" (Class 1). We cannot average the Famous 8; we must respect their worst reasonable outcome.
      *   **RCF Result:** P50 = $1.6 Billion. P80 = $2.1 Billion.
  *   **Ministry Reaction:** Acceptable uncertainty range, but high contingency required.
  *   **Honest Truth:** Here, statistics fail. There are not enough comparable projects. We are relying on the *existence* of the small class to justify inflating the larger class's estimate.

  ### Case 3: The Rural Road Upgrade
  *   **Project:** 100km highway upgrade, greenfield, low density.
  *   **Bottom-Up Estimate:** $500 Million.
  *   **Candidate Classes:**
      1.  *All Road Projects:* N=10,000. (Passes Count). **Fails Feature Match:** Mostly small resurfacing jobs.
      2.  *Highway Upgrades (>50km):* N=200. (Passes Count). **Passes Feature Match.**
      3.  *Rural Highway Upgrades:* N=150. (Passes Count). **Passes Feature Match.**
  *   **Procedure Application:**
      *   Class 1 is discarded (scale mismatch).
      *   Class 3 is selected (Narrowest legitimate).
      *   Historical data shows rural upgrades are often delivered *under* budget due to low land acquisition costs and simple engineering.
      *   **RCF Result:** P50 = $450 Million. P80 = $510 Million.
  *   **Ministry Reaction:** **They will not like this either,** but for the opposite reason. Politicians prefer high visibility capex. A lower estimate reduces the apparent "investment."
  *   **Honest Truth:** RCF reveals that engineering estimates for simple projects often include "padding." The data suggests you can deliver this for less.

  ---

  ## 6. Limitations and Philosophical Honesty

  You asked if this procedure dissolves the choice of reference class. **It does not.**

  1.  **The Choice Remains:** Step 3 (Feature Match) requires a human to decide which features matter. If you decide "political regime" is irrelevant, you get one class. If you decide it is critical, you get another. Statistics cannot tell you which decision is right; only experience and values can.
  2.  **The Past is Not the Future:** RCF assumes the future will resemble the past. If construction technology has fundamentally shifted (e.g., automated tunneling), the reference class is a anchor dragging you backward. Step 1 requires you to judge if "construction practice has changed" enough to invalidate the data.
  3.  **Data Quality:** If the historical data is corrupted (e.g., projects hide overruns in separate budgets), the RCF output is garbage. This procedure disciplines the selection, not the data integrity.
  4.  **The "Unpleasant Truth" Constraint:** In Case 1 (Metro), this procedure forces you to present a number that may kill the project. If the Minister demands you use the "Global Rail" class to get the cost down, they are asking you to violate the **Feature Match Filter**. You must document this violation in writing as a "Deviation from Appraisal Protocol."

  **Final Instruction:**
  This procedure does not give you the *truth*. It gives you a *defensible position*. When the Minister asks why the cost is so high, you do not say "The math says so." You say: "We excluded simpler projects because they do not share our risks. To use them would be to budget for a different project." That is the only defense statistics can offer.
