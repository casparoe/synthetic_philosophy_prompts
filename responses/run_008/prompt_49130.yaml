answer: |-
  # Desiderata for a Practical Behavioral Criterion of Mind

  **Purpose:** To establish a working standard for attributing mental states (intelligence, understanding, agency) to an unfamiliar system based *solely* on observation and interaction, without access to internal architecture. This criterion must function across diverse candidates: non-human animals, AI systems, alien artifacts, and neurologically compromised humans.

  ### 1. Species- and Substrate-Neutrality
  *   **Motivation:** Intelligence exists in cephalopods and primates that lack human syntax or carbon-based biology. A criterion that requires a human mouth, human social cues, or silicon-specific inputs falsely negatives valid minds.
  *   **Status:** **Non-negotiable.** Any criterion failing this is merely a test for "human-likeness," not mindedness.

  ### 2. The Other-Minds Consistency
  *   **Motivation:** We attribute minds to other humans effortlessly. If a criterion is too demanding, it risks skepticism about other people (solipsism); if too lax, it becomes trivial. It must justify why we might hold a machine to a different standard than a human, or admit that we do not.
  *   **Status:** **Non-negotiable.** Epistemic fairness requires that the standard applied to the candidate be one the evaluator could theoretically meet or fail.

  ### 3. Resistance to Rote (The "Blockhead" Constraint)
  *   **Motivation:** A system that merely retrieves pre-computed responses from a vast lookup table mimics behavior without understanding. A valid criterion should, in principle, distinguish between generative understanding and retrieval.
  *   **Status:** **Non-negotiable (in intent), Problematic (in practice).** See *Incompatibility Analysis* below.

  ### 4. Falsifiability and Anti-Gaming
  *   **Motivation:** A test that always returns "mind present" is useless. Conversely, systems (particularly LLMs) can game judges by adopting personas, feigning ignorance, or using deflection to mask lack of understanding. The criterion must allow for a negative verdict and resist shallow optimization.
  *   **Status:** **Non-negotiable.** Without the possibility of failure, the attribution is dogma, not diagnosis.

  ### 5. Modality Agnosticism
  *   **Motivation:** Locked-in patients, non-vocal animals, or alien probes may lack a linguistic channel. Requiring conversation excludes entities that can demonstrate planning, tool use, or novel problem-solving through other outputs.
  *   **Status:** **Non-negotiable.** Language is a symptom of mind, not a prerequisite.

  ### 6. Symmetry with Human Baselines
  *   **Motivation:** Humans make errors, act habitually, or have "off days." A criterion requiring perfect rationality or consistent high-performance excludes normal humans. Conversely, it should not accept sub-human performance as evidence of high-level mind.
  *   **Status:** **Preference.** While ideal, calibration is difficult; strict symmetry may blunt the test's sensitivity to super-human or sub-human variance.

  ### 7. Handling of Gradation
  *   **Motivation:** Mindedness may be a spectrum (e.g., a mouse vs. a chimp vs. a human). A binary pass/fail verdict may force artificial boundaries.
  *   **Status:** **Preference.** Binary verdicts are practically useful for legal/ethical decisions, but graded scales are likely more ontologically accurate.

  ***

  ### Incompatibility Analysis: The Behavior-Rote Tension

  There is a fundamental tension between **Strict Behavioral Access** (observation/interaction alone) and **Resistance to Rote** (excluding lookup tables).

  If we are restricted to input-output observation without internal access, we cannot logically distinguish a conscious agent from a sufficiently complex lookup table (Ned Block's "Blockhead" argument). For any finite interaction, a pre-stored table exists that matches the agent's behavior perfectly. Therefore, no purely behavioral criterion can *guarantee* Resistance to Rote.

  **Verdict:** These desiderata are jointly unsatisfiable in principle.

  **Resolution:** To maintain the **Practical Purpose** of the module (making actual attributions), I would drop the **Logical Guarantee of Resistance to Rote**.
  *   **Modification:** We replace "impossible to pass via rote" with "statistically improbable to pass via rote within resource bounds." We treat the criterion as a heuristic for *functional* mindedness rather than metaphysical proof.
  *   **The Cost:** We accept the risk of "false positives" where we attribute understanding to a sophisticated philosophical zombie (or a giant lookup table). We prioritize avoiding "false negatives" (denying mind to a genuine but behaviorally opaque entity) because the ethical cost of ignoring a mind is higher than the error of honoring a machine.

  ***

  ### Evaluation of Existing Frameworks

  The **Imitation Game** fails Modality Agnosticism and Species-Neutrality by binding intelligence to linguistic conversation, and it collapses under the Resistance to Rote constraint (as Turing himself acknowledged). The **Intentional Stance** excels at Neutrality and Modality by treating any predictable system as a believer, but it lacks Falsifiability; one can always adopt the stance, rendering the attribution trivial. A **Clinical-Style Checklist** offers strong Falsifiability and handles Gradation well, but typically fails Species-Neutrality and Symmetry, as the capacities listed (e.g., "mirror self-recognition") are often calibrated to human or primate baselines, unfairly excluding divergent intelligences.
