  Elena steps onto her back patio on a humid July afternoon and immediately feels water droplets striking her arms, accompanied by the distinct pattering sound of precipitation. Without engaging in any conscious reasoning or checking a forecast, she forms the immediate perceptual belief that it is raining. Unbeknownst to her, the automatic lawn sprinklers had just activated on their timer, and the droplets she feels and hears are entirely caused by this system; however, at that exact moment, a sudden summer storm genuinely begins, meaning it is, in fact, raining in her yard. Elena's belief is true, and it is justified by her direct sensory experience, yet she does not know that it is raining because her justification is causally disconnected from the weather condition that makes her belief true.

  **Specification Analysis**
  This case satisfies the requirements of a genuine Gettier case: Elena holds a belief ("It is raining") that is both true (a storm has begun) and justified (by direct tactile and auditory experience), yet it fails to be knowledge due to environmental luck. The justification is **non-inferential**; Elena does not reason from premises like "I feel water" and "If I feel water, it is raining" to a conclusion. Instead, the belief is formed through direct perceptual uptake, akin to a basic sensory report, leaving no intermediate propositions for a "No False Lemmas" (NFL) diagnosis to target. The setting is **ordinary** (a residential backyard), utilizing **no stock devices**; there are no stopped clocks, fake barns, or misleading instruments—the sprinklers function perfectly, and the rain is real. There is **no deception**, as the sprinklers operate on a standard timer and no agent intends to mislead. Finally, the **coincidence** is plausible; summer storms often coincide with scheduled evening watering cycles, avoiding the "one-in-a-billion" accident constraint.

  **No False Lemmas Diagnosis**
  Because Elena's belief is non-inferential, the standard NFL diagnosis finds no false premise *within her reasoning* to grasp; she deduced nothing, so she deduced nothing falsely. A defender of NFL might attempt to redirect the diagnosis outward, arguing that Elena implicitly relies on a false background belief, such as "The sprinklers are currently off." However, this extension is **ad hoc**. There is no evidence Elena considered the sprinklers at all; positing an implicit belief solely to save the NFL theory attributes cognitive content to the subject that isn't present in the epistemic position described. If the theory requires assuming hidden premises to function in non-inferential cases, it loses its principled constraint on what counts as a "lemma."

  **Safety Condition Evaluation**
  Under a safety condition, we identify the **method** of belief formation as "believing it is raining based on the immediate sensation of water on one's skin." This belief is **unsafe**. In a wide class of nearby possible worlds—specifically, those where the sprinklers activate without a concurrent storm—Elena uses the same method to form the same belief, but the belief is false. The safety condition correctly classifies this as non-knowledge because the method does not track the truth across relevant close worlds. Safety explains the anti-knowledge intuition better than NFL here because it targets the reliability of the connection between justification and truth in the environment, rather than searching for a logical flaw in the subject's reasoning that does not exist.

  **Conclusion**
  The single feature doing the epistemic work in this case is **causal independence**: the fact that the state of affairs justifying the belief (sprinkler water) is causally independent of the state of affairs making the belief true (meteorological rain). If this feature is removed—for instance, if the sprinklers were off and the water she felt was actually from the storm—the causal link is restored, the belief becomes safe, and the case intuitively transforms into a standard instance of perceptual knowledge.
