  ### Section 1, "Tier list"

  Tier 1 contains the ethical and mathematical bookends that any coherent model must address before proceeding to calibration, as they define the boundaries of the feasible set for any long-term welfare function, separating axiomatic necessities from ethical preferences. (A) belongs here because it establishes the default null hypothesis of moral neutrality that requires positive evidence to overturn, acting as the primary burden of proof for any positive rate in normative welfare analysis, effectively forcing the proponent of impatience to justify why time matters morally. (F) also ranks here since it defines the technical conditions under which infinite horizon optimization is even mathematically possible, forcing a trade-off between coherence and neutrality that cannot be ignored by serious modelers, as undiscouted sums often diverge to infinity. Tier 2 holds arguments that are substantive but contingent on institutional or accounting assumptions rather than first principles, meaning their weight varies by context and institutional mandate, often reflecting the analyst's view of the state. (E) sits here because its force depends entirely on whether one views the social planner as a neutral technocrat or a delegate mandated by current voters, making it a political rather than ethical claim about legitimacy. (B) is similarly tiered because it relies on a specific interpretation of the elasticity of marginal utility that not all calibrations accept, making it a modeling choice rather than a law of economics. Tier 3 comprises arguments that derive their force from contested metaphysical or psychological premises that rarely survive contact with aggregated data or policy implementation requirements, making them poor anchors for policy. (C) falls here because it illegitimately conflates individual prudence with intergenerational justice, ignoring that societies outlive individuals and have different obligation structures than selves. (D) is lowest because it relies on a reductionist view of personal identity that lacks operational metrics for economic modeling, rendering it philosophically interesting but empirically inert for setting concrete tax rates. These tiers reflect the degree to which each argument constrains the parameter space independently of the others.

  ### Section 2, "The top tier under fire"

  Argument (A) asserts that time is morally arbitrary, so a social welfare function must treat utility occurring in 2100 identically to utility occurring in 2024, echoing Ramsey's claim that pure discounting is ethically indefensible. The strongest objection comes from (F): without discounting, the integral of utility over an infinite horizon diverges, rendering policy choice impossible under standard utilitarian criteria and violating dynamic consistency. Proponents argue this mathematical necessity forces a positive $\rho$ to ensure finite valuations and stationary preferences over time. However, this objection conflates the need for convergence with the need for pure impatience. Convergence can be achieved through the growth-adjusted marginal utility term ($\eta g$) alone, provided consumption grows sufficiently, meaning one can satisfy Koopmans' consistency requirements without violating temporal symmetry. Thus, (A) survives the technical objection unless one assumes zero growth or insists on undiscounted utility sums specifically, rather than discounted marginal utility. The technical constraint justifies a discount rate on consumption, but not necessarily a pure discount rate on utility. This distinction clarifies why your committee is split: one side sees the technical necessity of $r>0$, while the other insists $\rho$ must remain near zero.

  ### Section 3, "The bottom tier diagnosed"

  Arguments (C) and (D) fail because they attempt to solve a normative social choice problem with descriptive psychological facts. (C) fails because individual rationality does not aggregate cleanly to social welfare; a society is not a single super-agent with a unified lifespan, so individual patience norms do not bind the planner. To repair it, one would need a theory of collective identity that mirrors individual psychology, which is politically fraught. (D) fails because psychological connectedness is continuous and vague, offering no clear threshold for when discounting becomes permissible. To repair it, economists would need empirical metrics mapping connectedness decay to utility weights, which currently do not exist. Both arguments ultimately collapse into (A) or (E) when pressed, lacking independent leverage.

  ### Section 4, "My number"

  I could defend a pure rate of 0.5% per year with a straight face, treating it as a proxy for exogenous existential risk rather than impatience. This number would move only upon evidence of non-negligible, climate-independent probabilities of societal collapse that prevent future generations from realizing utility.
