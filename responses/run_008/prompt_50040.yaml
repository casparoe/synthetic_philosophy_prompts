      *   *Supervaluationism (Idea 2):* Suggests we look for consensus across reasonable interpretations. If all reasonable definitions say "couple," it's a couple. If they conflict, it's a "hard case" requiring discretion.
      *   *Practical Impact:* For a bureaucrat with 20 minutes, Idea 1 is paralyzing (searching for the unknowable). Idea 2 is operational (looking for robust evidence across multiple dimensions). The procedure should reflect Idea 2 because it aligns with administrative law principles (consistency, reasonableness) rather than metaphysical truth.

