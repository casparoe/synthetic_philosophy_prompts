      *   *Procedure:* Call it the "Six-Point Weighted Checklist."
      *   *Philosophy:* Explain that Epistemicism leads to burnout, Supervaluationism leads to defensible discretion.
      *   *Case Runs:* Be specific on the output.
      *   *Limitations:* Focus on the "Reasonableness" standard of appeal panels.

  10. **Final Polish:** Ensure the distinction between "fact" and "judgement" is clear. Make sure the "Annoying Case" is highlighted clearly. (Self-correction: Ensure I don't give legal advice, but rather administrative procedure advice based on general principles of that jurisdiction).

  *(Self-Correction during drafting)*: I need to make sure I don't validate the "Separate Flats" case too easily. In UK law, maintaining separate households is a strong indicator *against* being a couple, even if they spend nights together. I need to balance the "nights" vs. "household" aspect carefully in the procedure. The procedure should weigh "Membership of Household" heavily.

