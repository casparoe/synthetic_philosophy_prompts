  5.  **Addressing the Philosophical Question:**
      *   Be honest. At the desk, they functionally converge. You still have to tick boxes. But the *mindset* changes. Idea 1 makes you feel like a failure when you can't find the line. Idea 2 empowers you to say "This is a borderline case, here is the reasonable interpretation we chose."
      *   *Verdict:* Idea 2 is better for mental health and legal defensibility. Idea 1 is a trap.

  6.  **Addressing Limitations:**
