      *   *Structure:* Needs to be a flowchart or checklist style.
      *   *Key Dimensions of "Cohabitation as a Couple":* Based on UK law (since "benefits office" and "pounds" imply UK/DWP context, specifically Universal Credit/Housing Benefit rules regarding "living together as husband and wife"). The standard legal test usually involves six factors (often called the *Cobblestone* or *G v C* criteria):
          1.  Membership of the same household.
          2.  Stability of the relationship.
          3.  Financial arrangements.
