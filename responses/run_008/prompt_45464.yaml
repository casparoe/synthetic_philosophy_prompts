      *   *Confidence:* High on the structural breakdown (counting), lower on the normative weight of "collective causal power" vs. "individual expressive right."
      *   *Least bettable point:* Whether the *expressive value* of a secret vote survives the secrecy condition. Some argue voting is a ritual of self-constitution. That's hard to disprove empirically.

  7.  **Refining the Argument (incorporating Expected Utility):**
