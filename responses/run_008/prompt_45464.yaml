  4.  **Analyzing Disanalogies (The "Audit"):**
      *   *User's Snag:* Secrecy and Counting.
      *   *Cheering:* Public, performative, causal impact on morale (maybe) but not on score directly. Audience is other fans/players.
      *   *Voting:* Secret (usually), aggregated, causal impact on score (outcome) even if marginal. Audience is the state (counter), not necessarily other voters.
      *   *Relevance to Conclusion 1 (Duty):* If voting is *only* expression, no duty. But if voting has a *collective* causal mechanism (like a threshold), the duty might stem from participation in a collective action, not individual efficacy. Cheering doesn't win games; votes *do* win elections (collectively).
      *   *Relevance to Conclusion 2 (Strategy):* If voting is expression, vote heart. If voting is causal (even probabilistically), strategy matters. The "Counting" aspect is crucial. A cheer isn't counted toward the score. A vote is. This breaks the "vote your heart" argument because the *function* of the vote is to determine the winner, whereas the *function* of a cheer is to support.

  5.  **Evaluating the Conclusions:**
      *   *Conclusion 1 (No Duty):* Weakens. Cheering is optional because it doesn't affect the outcome. Voting affects the outcome collectively. Even if *my* vote doesn't decide, *my type of vote* contributes to the mandate or the margin, which has causal downstream effects (legitimacy, funding, future strategy). Also, the "Secret" aspect removes the expressive benefit vis-à-vis peers. If I can't show anyone I voted, what am I expressing?
