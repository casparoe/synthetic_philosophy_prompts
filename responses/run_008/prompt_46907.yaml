  4.  **Analyze Moral vs. Scientific Ignorance:**
      *   *Scientific Ignorance:* Objective. You either have the microscope/data or you don't. It's binary.
      *   *Moral Ignorance:* Often subjective, but often involves empathy and reasoning. Slavery wasn't a "new discovery" like germs; it was an ancient institution being challenged.
      *   *Willful Blindness:* Jefferson rationalized it. That's different from not having the information. It suggests a failure of moral imagination or courage, not a lack of access to the "truth."

  5.  **Address the "Honor/Renaming" Context:**
      *   The debate isn't "Was Jefferson a monster?" It's "Does he deserve a school name *today*?"
