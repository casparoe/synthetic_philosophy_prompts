      Your confusion is well placed because it strikes at the heart of what probability represents. Regarding the first tension you identified, between Jaynes's invariance requirement and the diagnosis that the problem is ill-posed until a generating procedure is specified, you should understand these as competing visions of what probability is rather than compatible tools. The generating procedure diagnosis rests on a frequentist or propensity interpretation where probability is a physical property of a chance setup, meaning that without a specified mechanism there is literally no fact of the matter about the correct answer. Jaynes, conversely, operates within an objective Bayesian framework where probability is a logical relation between a state of knowledge and a proposition, implying that the information given in the problem statement should be sufficient to derive a unique answer if only we apply the correct rules of rationality. Consequently, they cannot both be right about the status of Bertrand's question because one says the question is incomplete while the other says it is complete but previously mishandled. If you accept Jaynes's view, the Principle of Indifference is not discarded but rather refined into a Principle of Transformation Groups, where the work of indifference is no longer to assign equal weight to outcomes directly but to assign equal weight to states of knowledge that are indistinguishable under permissible transformations. However, if you accept the generating procedure view, the Principle of Indifference is relegated to a heuristic shortcut used only when the physical mechanism is unknown, carrying no logical necessity and yielding no unique truth.

