  Moving to the second part of your query concerning the wine and water paradox, this case indeed reveals a significant limitation in the invariance strategy that defenders of indifference as a constraint of rationality must confront. In Bertrand's paradox, the circle possesses intrinsic geometric symmetries like rotation and scaling that exist independently of how we choose to parameterize the chord, allowing Jaynes to argue that the measure must respect these physical symmetries of the object itself. The wine and water problem lacks this geometric anchor because the ratio of wine to water is an abstract quantity without a physical shape that remains invariant under reparameterization, meaning that choosing to apply indifference to the ratio rather than its reciprocal is itself an arbitrary choice of language rather than a deduction from symmetry. This suggests that the invariance solution succeeds in Bertrand's case not because it is a universal logical principle but because the geometry of the circle smuggles in a privileged group of transformations that corresponds to physical realities, whereas in the wine and water case no such physical symmetry exists to break the tie between parameterizations. A defender of indifference must therefore concede that the principle cannot function as a purely logical law applicable to any description of ignorance but rather depends on the existence of a natural measure supplied by the physical context or the structure of the sample space.

  The complaint that invariance merely relocates the arbitrariness is therefore largely correct, because the choice of which transformations count as preserving the problem is itself a judgment call that often relies on implicit physical assumptions. In Bertrand's paradox, we assume rotations matter because circles look the same when rotated, but this assumes the problem is about geometric objects rather than, say, numbered points on a circumference which would not share that symmetry. If we treat the arbitrariness as relocated rather than dissolved, we see that the standard treatments often draw the line between well-posed and ill-posed problems in the wrong place by trying to force a logical solution onto a physical question. The line should instead be drawn at the specification of the randomizing mechanism, acknowledging that a probability question is only well-posed when the physical procedure generating the data is defined. Until that specification is made, applying the Principle of Indifference is not an act of logical deduction but a decision to model the system in a particular way, and different models will yield different probabilities without any one being uniquely rational. Ultimately, the lesson is that probability is not a property of ignorance alone but a relation between ignorance and a specific model of the world, and without the model, the indifference principle has no traction. I hope this helps clarify the dialectic for you, and I encourage you to keep questioning where the logic ends and the physics begins.
