answer: |-
  **MEMORANDUM**

  **TO:** Metrics and Evaluation Committee
  **FROM:** Chair, Metrics and Evaluation Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Flagship Program Headline Indicator

  **1. Executive Summary**

  The Board has requested a single headline indicator to judge the success of our decade-long mandate to reduce global violence at the mid-cycle review. This memo recommends that the Committee adopt the **Age-Standardized Rate of Intentional Violent Death (per 100,000 population)** as the primary headline indicator.

  This recommendation is not made lightly. It privileges a specific conception of violence (lethal risk) over others (total suffering or non-lethal harm) and accepts specific philosophical trade-offs. If age-standardized population data proves unavailable or cost-prohibitive in key monitoring regions, the fallback indicator shall be the **Absolute Count of Recorded Intentional Violent Deaths**.

  However, I urge the Committee to recognize that adopting *any* single number requires us to communicate significant caveats to the Board. Section 4 of this memo details the substantive and contestable views presupposed by this choice.

  **2. Rationale: Risk vs. Suffering**

  The Committee is divided between those prioritizing the absolute count of victims (Faction A) and those prioritizing the per-capita risk rate (Faction B).

  I recommend the **Per-Capita Rate**. Our foundation's theory of change is rooted in altering the *conditions* that make violence likely—strengthening rule of law, reducing inequality, and mitigating conflict triggers. These are interventions designed to lower the *probability* of harm for any given individual.

  **Addressing the Absolute Count Argument (Steelman)**
  The argument for absolute counts is morally robust. It posits that the moral badness of violence is a function of total suffering endured. If the global population grows by one billion, and the risk of violence remains constant, we have added millions of new victims to the world. To declare this a "success" because the *rate* held steady seems to treat human beings as interchangeable statistical units rather than moral ends. A world with more grieving families is a worse world, regardless of the denominator.

  **Why We Must Choose Rate**
  While the moral intuition of the Absolute Count faction is correct regarding *suffering*, it is flawed regarding *attribution*. Our program cannot control global demography. If we adopt absolute counts, our evaluation becomes hostage to exogenous population trends. We could successfully reduce the risk of violence in every operational theater by 20%, yet be judged a "failure" because population growth outpaced our risk reduction. This creates a perverse incentive: to meet an absolute target, we might theoretically be driven to support population control measures rather than violence prevention. The per-capita rate isolates the variable our interventions actually affect: the safety of the environment.

  **3. Scope and Commensurability**

  The Grants Team rightly notes that our portfolio includes torture, domestic abuse, displacement, and animal cruelty. None of these are captured by a violent death rate.

  There is currently no globally consistent, cost-effective data infrastructure to measure non-lethal violence or animal cruelty at a scale comparable to mortality data (via UNODC, IHME, and conflict observatories). To attempt to construct a composite index (e.g., weighting one case of torture against 0.1 deaths) would introduce methodological arbitrariness that would undermine the indicator's credibility.

  Therefore, this headline indicator measures the **lethal apex** of violence. It serves as a proxy for the broader ecosystem of harm. We must acknowledge that success on this headline metric does not preclude failure in non-lethal domains, and vice versa.

  **4. Philosophical Candor and Ontological Commitments**

  In recommending this indicator, I want to be candid about the substantive views we are encoding into our evaluation framework. We are not merely selecting a metric; we are selecting a metaphysics of violence.

  *   **Violence as Risk vs. Violence as Event:** By choosing a rate, we presuppose that violence is primarily a property of *societies* (risk environments) rather than a sum of *individual tragedies*. We are telling the Board that we are in the business of making the world statistically safer, not necessarily numerically less tragic.
  *   **Commensurability:** By excluding non-lethal harms from the *headline*, we implicitly treat lethality as the only currency robust enough to bear the weight of global evaluation. This is a pragmatic concession, not a moral truth. It risks signaling that a prevented death is worth more than a prevented life of torture, simply because the death is easier to count.
  *   **The "Single Fact" Fallacy:** Most importantly, we must admit there is no single fact of the matter regarding "how much violence" exists in the world. There are only facts relative to a counting method. A world can simultaneously contain less violence (by rate) and more violence (by count). By selecting one, we are not discovering the truth; we are constructing a lens. We must ensure the Board understands they are seeing a constructed view, not an objective reality.

  **5. Fallback Indicator**

  **Absolute Count of Recorded Intentional Violent Deaths.**
  This fallback is recommended only if reliable population denominators are unavailable for the mid-cycle review period (e.g., due to census failures in conflict zones making rate calculation statistically invalid). While we reject this as our primary view for the reasons stated in Section 2, it is superior to no data at all.

  **6. Recommendation for Board Communication**

  The Board has asked for "exactly one number." If we tell them "there is no single number," we risk appearing evasive. If we give them one without context, we are being dishonest.

  I propose we present the **Age-Standardized Violent Death Rate** as the headline, but attach a formal **"Interpretive Note"** to the mid-cycle review. This note should state:

  > *"This indicator measures the risk of lethal violence per individual. It does not measure the total burden of suffering, which may rise due to population growth even as risk falls. It also does not capture non-lethal violence or animal welfare. Success on this metric indicates a safer world per capita, but not necessarily a world with fewer total victims."*

  **7. Next Steps**

  I request that Committee members review this framing prior to our meeting on November 15. Our goal is to leave that meeting unified behind a metric that is operationally viable, even if it is philosophically imperfect. We must speak with one voice to the Board, even if that voice carries a message of nuance.

  Please come prepared to discuss whether the "Interpretive Note" is sufficient to satisfy the ethical concerns of the Absolute Count faction, or if we require a secondary dashboard to accompany the headline.

  **Chair, Metrics and Evaluation Committee**
