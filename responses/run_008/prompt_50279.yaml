  Here is a draft skeleton for the joint statement. It is designed to be precise enough that neither party can easily backtrack, but neutral enough that both can sign it in good faith.

  ***

  # JOINT STATEMENT ON THE MARRIAGE DEBATE: A FRAMEWORK FOR ADVERSARIAL COLLABORATION

  **Prepared for:** [Friend A] and [Friend B]
  **Date:** [Date]
  **Status:** Draft for Review and Signature

  ## 1. AGREED CLAIMS: SETTLED VS. CONTESTED
  *We agree to distinguish between claims where expert consensus exists and claims where legitimate expert disagreement persists. Neither party will present contested claims as settled fact in future discourse.*

  **1.1. Historical and Anthropological Claims (Settled)**
  *   **1.1.1.** We agree that marriage as a social and legal institution has taken diverse forms across history and cultures, including polygynous structures, arranged alliances, and monogamous partnerships.
  *   **1.1.2.** We agree that the legal incidents of marriage (tax, inheritance, hospital visitation) are state-created constructs, even if the underlying social bond predates the state.

  **1.2. Normative Claims (Settled)**
  *   **1.2.1.** We agree that child welfare is a legitimate and primary interest of the state in regulating family structures.
  *   **1.2.2.** We agree that family stability (duration and quality of the household) is a significant predictor of positive child outcomes, regardless of family structure.

  **1.3. Empirical and Sociological Claims (Contested)**
  *   **1.3.1.** *Status:* **Contested.** While major professional organizations (e.g., APA, ASA) state that children of same-sex parents fare as well as those of opposite-sex parents, we acknowledge ongoing methodological disputes regarding sample sizes, selection effects, and long-term intergenerational data.
  *   **1.3.2.** *Status:* **Contested.** Whether the redefinition of civil marriage causally affects the marriage rates, divorce rates, or non-marital birth rates of the general population over time.
  *   **1.3.3.** *Status:* **Contested.** Whether the "conjugal" view of marriage is a cultural artifact or a pre-political moral reality accessible to reason.

  ## 2. TABLE OF DISAGREEMENTS
  *We agree to characterize each other's positions using the descriptions below. Deviating from these descriptions constitutes a violation of this collaboration.*

  | Topic | Characterization of Position A (Natural Law) | Characterization of Position B (Liberal Equality) |
  | :--- | :--- | :--- |
  | **Core Objection/Claim** | The state should recognize **comprehensive union** (a union of persons actualized by reproductive-type acts). Same-sex relationships, however loving, cannot instantiate this specific type of bodily union. | The state should recognize **committed care**. Excluding same-sex couples from the status of marriage is **arbitrary discrimination** because it denies equal access to a stabilizing civil status without a rational basis related to child welfare. |
  | **Role of Tradition** | Tradition is not the *justification* but the *evidence* of a rational insight. The claim is that the conjugal view makes sense of our existing norms (monogamy, fidelity) better than the revisionist view. | Tradition is a heuristic that often reflects past power dynamics. The claim is that moral progress requires updating civil status to reflect current understandings of equality and liberty. |
  | **Labeling** | **Rejects:** "Traditionalist" (implies argument is solely from history). **Accepts:** "Conjugal View." | **Rejects:** "Revisionist" (implies argument is ahistorical). **Accepts:** "Civil Equality View." |
  | **State Function** | The state **recognizes** a pre-political reality that has inherent normative force regarding kinship and generation. | The state **constitutes** a civil status that distributes rights and responsibilities to promote justice and welfare. |
  | **Verbal Dispute Flag** | *Note:* We flag that Section 2 (State Function) may contain a verbal dispute regarding the word "recognize." Position A implies recognizing an ontological category; Position B implies recognizing a claim for civil protection. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS
  *We identify the following specific points as decisive. We agree to the evidence bearing on them and record predictions to prevent retrofitting.*

  **3.1. The Infertility Counterexample**
  *   **The Question:** If an opposite-sex couple cannot conceive (due to age or infertility) is still considered married under the Conjugal View, what work is biology doing?
  *   **Position A Mechanism:** The "Act-Type" argument. Coitus is procreative in *kind* (biological coordination toward reproduction) even if procreation is impossible in *result*.
  *   **Position B Mechanism:** The "Functional Relevance" argument. If the result (children) is impossible, the biological coordination is morally irrelevant to the state's interest.
  *   **Agreed Assessment:** We acknowledge this may be a **bedrock metaphysical standoff**. Position A views the body as having inherent teleology; Position B views the body as instrumental to conscious goals.
  *   **Falsification Condition:** Position A agrees that if it is demonstrated that "organic bodily union" is scientifically incoherent (not just philosophically disputed), the Conjugal View fails. Position B agrees that if it is demonstrated that the state *cannot* secure child welfare without privileging biological kinship, the Civil Equality View fails.

  **3.2. Old vs. New Natural Law (NNL)**
  *   **The Question:** Position A concedes that classical Thomistic "perverted faculty" arguments are weaker than the Finnis/George "basic goods" argument. Does the Conjugal View survive if *only* NNL is valid?
  *   **Position A Claim:** Yes. The argument relies on the basic good of marriage as a comprehensive union, not merely biological function.
  *   **Position B Claim:** If the argument relies solely on NNL (which posits marriage as a self-evident basic good), it becomes a sectarian philosophical claim rather than a public reason claim suitable for law.
  *   **Agreed Evidence:** We will examine whether NNL arguments can be translated into public policy without relying on comprehensive doctrines.
  *   **Prediction:** Position B predicts that NNL arguments will fail the "public reason" test in a pluralistic society. Position A predicts they will succeed as accessible rational truths.

  **3.3. The "Law-Teaches" Claim (Empirical)**
  *   **The Question:** Does legal redefinition of marriage shift social norms regarding marriage stability and non-marital childbearing?
  *   **Agreed Data Sources:** We will look at data from the Netherlands (2001), Canada (2005), and Spain (2005).
  *   **Metrics:** (1) Marriage rates per 1,000; (2) Divorce rates; (3) Percentage of births outside marriage.
  *   **Timeframe:** 15 years post-legalization.
  *   **Pre-registered Predictions:**
      *   **Position A predicts:** A statistically significant acceleration in the decline of marriage rates and/or increase in non-marital births compared to pre-existing trends, controlling for economic factors.
      *   **Position B predicts:** No statistically significant deviation from pre-existing trends attributable to the law change itself.
      *   **Caveat:** Both agree that if the data shows correlation but no clear causal mechanism, the "Law-Teaches" claim is weakened.

  **3.4. Conceptual vs. Empirical Separation**
  *   **Agreement:** We agree to stop sliding between "What marriage *is*" (Conceptual) and "What marriage *does*" (Empirical).
  *   **Protocol:** Position A must argue the ontological definition first, without relying solely on outcome data. Position B must argue the equality claim first, without relying solely on "no difference" outcome data.

  ## 4. CLOSING: MOVING THE DEBATE FORWARD

  **4.1. Conditions for Changing Minds**
  *   **Position A would reconsider if:** Long-term data (20+ years) from early-adopter nations definitively shows that separating marriage from biological kinship severs the link between marriage and child-rearing norms (e.g., normalization of non-marital births becomes absolute).
  *   **Position B would reconsider if:** It is demonstrated that excluding same-sex couples is *necessary* (not just helpful) to maintain the specific social norms that protect vulnerable children from family instability.

  **4.2. The "Get the State Out of Marriage" Proposal**
  *   **Joint Rejection:** We both reject the proposal to eliminate civil marriage entirely (privatization).
  *   **Position A Reason:** The state has a legitimate interest in regulating kinship and ensuring children are connected to their biological parents where possible.
  *   **Position B Reason:** The state must administer the contractual benefits and equal protection status that marriage confers; privatization would harm vulnerable partners and children.

  **4.3. Identification of Verbal Disputes**
  *   We identify the following chunk of the dispute as **partly verbal**:
      *   *The definition of "Discrimination."* Position A defines it as "distinguishing based on relevant differences (the nature of the union)." Position B defines it as "distinguishing based on protected classes (sexual orientation) without compelling state interest."
      *   *The definition of "Marriage."* Position A uses a **Descriptive/Teleological** definition (what the institution is *for* by nature). Position B uses a **Constructive/Functional** definition (what the state *does* with the label).
  *   **Action:** We agree to specify which definition is in use at any given time to avoid talking past one another.

