answer: |-
  Here are ten questions designed to keep the conversation rigorous, banter-friendly, and unforgiving of hand-waving. Each includes a predicted answer and a follow-up designed to pin him down.

  ### 1. The Double-Storey Problem
  **Question:** Let's start with the elephant in the room: the lowercase 'a' and 'g'. In text faces, they're double-storey; in geometric sans, they're single-storey. Topologically, those are different graphs—one has a closed loop atop a closed loop, the other is an open C-shape with a lid. If the skeleton is the identity, are you claiming these are actually *different letters* that we've been trained to conflate, or are you going to tell me there's a shared abstract skeleton underneath? If it's the latter, what on earth does that graph look like?

  *   **Likely Answer:** He'll argue they share a "deep structure" or functional skeleton (e.g., "a counter with an ascender") despite topological differences.
  *   **Follow-up:** "Okay, but 'deep structure' is doing a lot of heavy lifting there. If the connectivity of the strokes changes—literally breaking a path or closing a node—how is that the *same* skeleton? Are we saying the skeleton is invariant to topology, or are you redefining 'skeleton' mid-episode to mean 'functional role'? Because if it's functional role, aren't we back to context-dependence?"

  ### 2. The Confusability/Context Trap
  **Question:** In some geometric sans-serifs, a single-storey 'a' is basically a 'u' with a tail, or an 'o' with a stick. Readers disambiguate this almost entirely via word context. If the skeleton is the primary driver of recognition, why does it fail so spectacularly in isolation? Does this suggest the skeleton is just a constraint satisfaction variable, not the main event?

  *   **Likely Answer:** He'll say the skeleton *constrains* the hypothesis space, but context selects the winner.
  *   **Follow-up:** "So the skeleton prunes the tree, but doesn't pick the fruit. But if the skeleton allows both 'a' and 'u' as valid parses of the same ink, how specific is it really? At what point does the skeleton become so permissive that it's no longer explaining the recognition, but just describing the aftermath?"

  ### 3. Acquisition and Overfitting
  **Question:** A kid learns to read from maybe two fonts on a classroom poster and one style of teacher handwriting. They then generalize to thousands of typefaces. How does the brain abstract a universal skeleton from such narrow priors without overfitting to the specific quirks of Comic Sans or Sassoon? Is there a developmental timeline where the 'skeleton' clicks into place, or is it baked in?

  *   **Likely Answer:** He'll likely claim it's a statistical learning process where the brain extracts invariants across examples.
  *   **Follow-up:** "If it's statistical extraction, what's the stopping condition? How does the learner know *which* features are the invariant skeleton and which are just style noise? Because if they extract the wrong invariant, they shouldn't be able to read bold or italic, but they can. What's the algorithm that separates 'essence' from 'accident'?"

  ### 4. Hofstadter's Ghost
  **Question:** Douglas Hofstadter's *Letter Spirit* project argued that letter identity is about 'style' and 'essence' that can morph across grids. He treated letters as fluid roles within a system. Is your Skeleton View an ally to that, a rival, or just *Letter Spirit* wearing a linguistics costume?

  *   **Likely Answer:** He'll say they are allies, but that Skeleton View is more rigorous/formalizable.
  *   **Follow-up:** "Hofstadter allowed for pretty radical morphing if the 'spirit' was preserved. Your view seems stricter. If I preserve the 'spirit' of an 'a' but break the stroke connectivity, Hofstadter might call it an 'a'. Would you? If not, isn't your view strictly *less* capable of explaining human flexibility than his was?"

  ### 5. The "Grammar" Vibes Check
  **Question:** You've mentioned before that the skeleton is like the grammar of a language—generative, not a lookup table. I want to steelman that. In linguistics, grammar gives us production rules that allow infinite novel sentences. What are the production rules for a letter? Can you write me a rule that generates a valid 'a' that looks nothing like an 'a' but satisfies the skeleton grammar?

  *   **Likely Answer:** He'll describe rules like "vertical stem," "closed counter," "right-side attachment."
  *   **Follow-up:** "Those sound like descriptive features, not generative rules. A grammar rule tells me how to *combine* elements. If your rules are just a checklist of parts, that *is* a lookup table, just decomposed. Where is the recursion? Where is the generativity? Or is 'grammar' just a metaphor you're using to make the skeleton sound more computational than it is?"

  ### 6. The "Wrong A" Boundary
  **Question:** You claim this explains why there's a *wrong* 'a' even in unfamiliar styles. Let's test the boundary. If I take an 'a', rotate it 90 degrees, is it wrong because it violates the skeleton, or because it violates orientation priors? If I draw an 'a' with a dotted line, is the skeleton broken? Where exactly does the skeleton end and 'decoration' begin?

  *   **Likely Answer:** He'll argue orientation is a separate transform, and dotted lines preserve the path, so the skeleton holds.
  *   **Follow-up:** "So the skeleton is invariant to rotation and continuity. What *does* break it? If I can rotate it, fragment it, and stylize it, and it's still the same skeleton, is the skeleton just 'topological genus plus semantic intent'? If intent is required, aren't we smuggling the reader's interpretation back into the object?"

  ### 7. Handwriting and Motor Noise
  **Question:** My gel pen handwriting is terrible. My stroke order is wrong, my angles are off, and my loops don't close. But people read it. If the skeleton is a structural blueprint, does it account for motor noise? Do I have a 'personal skeleton' that deviates from the 'canonical skeleton', and if so, how do readers map my broken version to the canonical one without template matching?

  *   **Likely Answer:** He'll say readers normalize the input to the canonical skeleton via a transformation function.
  *   **Follow-up:** "That transformation function sounds suspiciously like the template matching model you're trying to replace. If I have to normalize your 'a' to my internal 'a' to read it, what work is the skeleton doing that a flexible template wouldn't do better? Why posit a structure if the normalization process is doing all the heavy lifting?"

  ### 8. Historical Drift
  **Question:** Letterforms evolve. The Carolingian 'a' is different from the Humanist 'a'. Did the skeleton change, or did the rendering change? If the skeleton is constant across history, why do paleographers treat certain historical variants as distinct characters? At what point in history does a skeleton shift become a letter shift?

  *   **Likely Answer:** He'll argue the skeleton is stable, but cultural conventions for rendering shift.
  *   **Follow-up:** "But if the rendering shifts enough that the connectivity changes (like the single vs. double storey), and you say that's still the same skeleton, then 'skeleton' isn't tracking the physical history, it's tracking our *current* categorization of history. Isn't that circular? You're using modern reading habits to define historical structures."

  ### 9. Neural Implementation
  **Question:** Cognitive science angle: Where does this live? The visual cortex (V1/V2) cares about edges and orientations. The IT cortex cares about objects. Is the skeleton a V4 thing? If it's an abstract structure, are we positing a specific neural layer that computes stroke graphs before semantic recognition? Do we have fMRI evidence for 'graph extraction' separate from 'object recognition'?

  *   **Likely Answer:** He'll admit the neural evidence is thin but argue the computational logic requires it.
  *   **Follow-up:** "Okay, computational necessity. But if the brain doesn't actually separate graph extraction from object recognition—if they happen simultaneously—then the skeleton is a post-hoc rationalization, not a mechanism. Are you describing how the brain *works*, or just how you think it *should* work to make sense of typography?"

  ### 10. The Falsifiability Capstone
  **Question:** Our audience is going to ask this, so I'm asking it now: What observation about real readers or real type would count *against* the Skeleton View? If we ran an experiment where readers perfectly identified letters with *no* consistent stroke skeleton across trials, would you update? Or is the theory flexible enough to absorb any result by claiming the 'underlying structure' was just hidden?

  *   **Likely Answer:** He'll propose a specific case, e.g., "If people couldn't read novel fonts where the skeleton was preserved but shape changed."
  *   **Follow-up:** "But we know people *can't* read novel fonts if the contrast or weight is too extreme, even if the skeleton is perfect. So skeleton isn't sufficient. If it's not sufficient, and you can always claim a 'broken skeleton' whenever recognition fails, how do we distinguish a failed theory from a successful one? Give me a hard line: if X happens in an eye-tracking study, you walk away from the Skeleton View. What is X?"
