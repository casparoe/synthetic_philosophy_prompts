          *   *Dualities:* AdS/CFT. Two mathematically distinct theories describing the same physics. Which is "true"? Both? Neither?
          *   *Singular Limits:* Phase transitions. Thermodynamics doesn't smoothly emerge from Stat Mech without taking $N \to \infty$. But $N$ is never $\infty$. So Thermo is strictly false, not approximately true.
