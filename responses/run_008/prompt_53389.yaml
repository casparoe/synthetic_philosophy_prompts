prompt: |-
  I build recommender systems for a living — collaborative filtering, latent factor models, rating matrices, that kind of thing — and I've been reading Hume's "Of the Standard of Taste" on the side. I know the recsys side well but philosophy only from this one essay, so restate his position, and the main objections to it, in the vocabulary I actually use. I'm imagining things like: his ideal critics as an ensemble of trusted raters, the "wide experience and practice" requirement as a fix for missing-not-at-random rating data, his claim that the true judges' verdict overrules the majority as a deliberate denoising/aggregation choice rather than plain averaging. Do this as faithfully as you can and flag every place where the translation is a stretch rather than pretending it's clean.

  Then I want the residue report. Specifically: (a) the circularity worry — we pick the judges partly by their verdicts and then appeal to those same verdicts — does that map onto anything I'd recognize, like label leakage, or is it a genuinely different kind of problem my vocabulary has no expression for? and (b) the normative bit, that I somehow *should* defer to the ideal critic even about my own tastes — does anything in my vocabulary carry an "ought", or does that just fall out of the translation entirely? At the end tell me whether the residue points to something Hume's argument was missing all along or to something my framework structurally cannot say.
