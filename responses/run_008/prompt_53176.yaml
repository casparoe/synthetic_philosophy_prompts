answer: |-
  This is a precise dissection of a classic ethical knot. You have correctly identified the friction point: **Mental Reservation (specifically *strict* mental reservation) preserves Augustine's *ontology* of the lie while gutting his *sociology* of the lie.**

  To answer your core question: The practice of mental reservation presupposes that the moral weight of speech rests entirely on the **speaker's internal integrity before God**, rather than on the **communicative contract between humans.**

  Here is the reconstruction of the doctrine's commitments, the rival views it excludes, and the breakdown of the everyday vs. theological cases.

  ### 1. What Mental Reservation Presupposes
  For mental reservation to function as a moral loophole rather than a blatant contradiction, it must rest on three specific pillars:

  **A. The Definition is Formal, Not Functional**
  It presupposes that a lie is defined by the *metaphysical relation* between the intellect and the tongue (*locutio contra mentem*), not by the *pragmatic effect* on the listener. If the mind holds proposition P, and the tongue utters sounds that can technically signify P (even if obscurely), no sin has occurred. The "truth" is a property of the speaker's soul, not a commodity transferred to the hearer.

  **B. The "Right to the Truth" is Conditional**
  It presupposes a juridical view of communication: You only owe the fullness of your mind to those who have a *right* to know it. A murderer at the door, a persecuting magistrate, or a prying neighbor has forfeited their right to the truth by their unjust intent. Therefore, the speaker is not obligated to make their meaning transparent. The ambiguity is a shield, not a weapon.

  **C. God is the Primary Witness**
  This confirms your hunch. The practice presupposes that speech is ultimately a testimony before God. As long as God (who hears the mental qualifier) knows the statement is technically true, the cosmic order of Truth is preserved. The human listener is secondary; their confusion is a collateral consequence of their own unjust inquiry, not a moral failure of the speaker.

  ### 2. Rival Views Ruled Out
  By adopting mental reservation, you are explicitly rejecting three other major frameworks for understanding lying:

  **A. The Deception-Based View (The Epistemic View)**
  *   *View:* Lying is wrong because it corrupts the hearer's mind by inducing a false belief.
  *   *Ruled Out:* Mental reservation *intends* to induce a false belief. If the wrongness lay in the deception itself, mental reservation would be indistinguishable from lying. The doctrine requires you to believe that **deception is permissible provided formal falsity is avoided.**

  **B. The Kantian View (Autonomy and Respect)**
  *   *View:* Lying is wrong because it treats the hearer as a mere means to an end, violating their rational autonomy.
  *   *Ruled Out:* Mental reservation is arguably *more* manipulative than a blunt lie. A liar says "He is not here," owning the deception. The mental reserver says "He is not here [in the sense I mean]," inviting the hearer to trust a signal while secretly withholding the code. It treats the hearer as a puzzle to be solved rather than a rational agent to be informed. It rules out the idea that **transparency is a duty owed to fellow rational beings.**

  **C. The Consequentialist View**
  *   *View:* Lying is wrong (or right) based on the outcomes (harm saved vs. trust eroded).
  *   *Ruled Out:* While mental reservation is often *used* to save lives, the *justification* isn't the life saved; it's the sin avoided. If the only goal were saving the life, a blunt lie would work better (it's more convincing). The extra mental gymnastic proves the goal is **purity of the speaker's soul**, not the safety of the hidden person.

  ### 3. The Collapse Test: What if the Wrong is Deception?
  You asked: *If you swap in the view that the wrong of lying is the deception, not the word-mind mismatch, does mental reservation collapse?*

  **Yes, absolutely. In fact, it becomes worse.**

  If the moral injury of lying is the corruption of the neighbor's mind (inducing false belief), mental reservation is **lying with added gaslighting.**
  *   **Standard Lie:** I assert P. I believe Not-P. You believe P. (I have deceived you).
  *   **Mental Reservation:** I assert P (meaning P*). You believe P. I claim I told the truth because I meant P*.

  Under a deception-based ethic, mental reservation is *more* culpable than a standard lie because it adds a layer of bad faith. It allows the speaker to deceive the neighbor while maintaining a clean conscience, effectively insulating the speaker from the moral reality of the deception. It severs the link between speech and social trust entirely. It survives *only* if the moral universe is solipsistic (me and God) rather than communal (me and you).

  ### 4. Everyday Cases vs. Theological Cases
  You asked about the "friend in the attic" or the "teenager" cases. Do these need the heavy theological commitments?

  **They come apart.** The everyday versions can be defended on much "cheaper" grounds, but they rely on a different mechanism than strict mental reservation.

  **The Everyday Defense: Contextual Ambiguity (Broad Reservation)**
  When you tell the murderer "He is not here," or the teenager says "I haven't been out," these are usually defended not by *strict* mental reservation (adding a secret mental clause), but by **contextual implication.**
  *   *Grounds:* Communication relies on shared norms. One norm is "I do not have to aid your injustice."
  *   *Mechanism:* When a murderer asks "Is he here?", the context implies "Is he here *for you to harm*?" The answer "No" is true within the *legitimate* context of the conversation.
  *   *Commitment:* This does not require Augustine's ontology or God as witness. It requires only a **social contract theory of language.** We agree that language is for cooperative truth-seeking. If the listener opts out of cooperation (via violence or unjust intrusion), the speaker is released from the norm of transparency.

  **The Theological Defense: Ontological Fidelity (Strict Reservation)**
  The priest hiding from Elizabethan pursuers using *strict* mental reservation ("I haven't seen him" meaning "in the last 5 seconds") cannot rely on context. The pursuer *cannot* possibly guess the qualifier.
  *   *Grounds:* This requires the heavy theology. It requires that the *sound* of the words matches the *mind* of the speaker, regardless of the listener's ability to understand.
  *   *Commitment:* This needs the "God is the audience" commitment. Without God witnessing the mental qualifier, the statement is socially functionally identical to a lie.

  **Where they break:**
  The everyday case works because we intuitively accept that **privacy rights limit communicative duties.** You don't owe the teenager's parents a full map of your movements; you don't owe the murderer the location of the victim. We defend the "lie" by saying the question itself was illegitimate.

  The theological case (Strict Mental Reservation) tries to defend the *words* themselves. It says, "The question was illegitimate, *and therefore* I must construct a sentence that is technically true in a vacuum."
  *   The everyday case says: "I am misleading you, but I am justified."
  *   The theological case says: "I am not misleading you *in the eyes of Truth*, even if you are misled."

  ### 5. Summary of the Tension
  You noted that mental reservation feels like "keeping the letter while torching the spirit." History agrees with you.

  The Catholic Church itself eventually torched the practice. **Pope Innocent XI condemned strict mental reservation in 1679.** The Church realized exactly what you have spotted: that defining a lie solely as *speech contra mind* allows for the destruction of social trust while maintaining technical piety.

  **The Reconstruction:**
  1.  **Presupposition:** Lying is a disorder of the *speaker's faculties*, not a harm to the *listener's mind*.
  2.  **Exclusion:** It rules out any ethic where the *purpose* of speech (communication) determines its morality.
  3.  **Collapse:** If deception is the sin, mental reservation is a super-sin (deception + self-deception).
  4.  **Everyday vs. Theological:** Everyday cases rely on **rights** (you have no right to ask); theological strict reservation relied on **ontology** (my words match my mind). The former is sustainable in a secular society; the latter requires a metaphysical framework where God is the primary listener.

  The practice of mental reservation is essentially an attempt to solve a **social problem** (how to deal with unjust aggressors) using an **ontological tool** (the definition of truth). It fails because language is inherently social. You cannot have a private language game with God while using public words intended for men.
