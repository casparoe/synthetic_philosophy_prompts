answer: |-
  Dear Colleague,

  I have been giving considerable thought to your request regarding the sub-questions for your upcoming programme on dialetheism and paraconsistency, and I must say that the difficulty you are experiencing in fixing them is entirely understandable. You are dealing with a cluster of problems that are deeply entangled, where solving one often presupposes a solution to another, and yet the funding cycle demands a linear structure. What you need is not merely a list but a hierarchy of dependence, distinguishing those questions without which the programme collapses from those that are refinements we can afford to postpone. Having weighed the candidates against the constraints of a two-year timeline and the specific skills of formally trained postdocs, I propose a defended ordering that prioritises communicative viability and scientific utility over technical refinement.

  The first and most urgent priority must be the exclusion problem. This is the foundation upon which the rest of the enterprise rests, for if a dialetheist cannot express genuine disagreement without collapsing into trivialism or ineffability, there is no philosophy to be done. The dependence here is absolute; without a robust account of how to deny a sentence without asserting its negation in a way that invites contradiction, the dialetheist cannot argue for their position without self-defeat. In terms of tractability, this is well-suited to postdocs with formal training who are also willing to engage with pragmatics and the philosophy of language, as it requires modelling speech acts rather than just truth values. Real progress here would not be another semantic clause but a workable pragmatic account of denial that allows rivals to disagree in practice, ensuring that the logic serves communication rather than hindering it.

  Once the possibility of disagreement is secured, the second priority must be classical recapture. The credibility of paraconsistency in the wider scientific community hinges on the assurance that mathematics and empirical science can proceed unchanged in consistent domains. The dependence is high because if the cost of adopting paraconsistency is the loss of classical mathematics, the theory becomes too expensive to adopt. This is highly tractable for postdocs with strong model-theoretic skills, as it involves defining precise boundaries where classical validity holds. Progress here should be measured by a theorem or semantic characterization that clearly demarcates the safe zones for classical reasoning, effectively quarantining the paradoxes without contaminating the bulk of scientific inference.

  Third in the ordering comes the conditionals problem. While exclusion allows for disagreement and recapture preserves existing science, a usable conditional is required for internal reasoning within the paraconsistent framework. The material conditional is indeed too weak for ordinary deduction, and without a connective that supports modus ponens without triggering explosion, the logic loses its normative force for inference. This is technically demanding but squarely within the wheelhouse of formal logicians. Real progress would be the identification of a conditional connective that balances detachability with safety, allowing for robust reasoning in non-classical domains without reintroducing the very paradoxes the system is designed to tolerate.

  Fourth, I would place the problem of revenge. This is the eternal shadow over any solution to the semantic paradoxes, where every attempt to resolve the Liar seems to generate a new, sharper paradox that the logic cannot express. While the dependence is theoretically high, as a successful revenge argument could undo the entire programme, it is often downstream of the solutions to exclusion and recapture. It is tractable for formally trained researchers, but the risk is that it becomes an endless game of whack-a-mole. Progress here should not be defined as a final elimination of revenge, which may be impossible, but rather as a demonstration that the hierarchy of paradoxes stabilizes or becomes benign enough not to threaten the core applications of the theory.

  Fifth and finally among the included questions is the standing of classical negation. This asks whether a dialetheist can employ a second, explosive negation alongside the paraconsistent one, and if so, what work remains for the latter. The dependence is moderate, as this is largely a question of expressive power and metaphysical commitment rather than functional viability. It is tractable for postdocs comfortable with pluralist semantics, but progress is harder to define; it would consist in a clear philosophical justification for negation pluralism that avoids redundancy, showing that the paraconsistent negation captures a genuine feature of reality that the classical one misses.

  Regarding the candidate you asked me to exclude, I would recommend leaving out the metainferential turn. While the idea that validity itself should behave non-classically is technically fascinating and currently fashionable in certain circles, it is too downstream to be a core priority for a programme aimed at establishing the viability of dialetheism. Settling whether validity is non-transitive or operates at a higher level does not solve the exclusion problem, nor does it guarantee classical recapture, and it risks alienating the very scientific community you wish to persuade. It is a refinement for specialists rather than a foundation for the field, and postponing it would not materially change the downstream applications of the research.

  However, there is a question you have not listed that I would put above all of them, and I suspect this is the one you feared I might identify. It is the problem of epistemic access, or how we distinguish true contradictions from mere errors. Your programme assumes we know when we are dealing with a dialetheic situation, but in practice, scientists and mathematicians need to know when it is safe to apply classical reasoning and when they are facing a genuine true contradiction. Without a criterion for identifying dialetheic contexts, classical recapture remains a theoretical promise rather than a practical tool. This question is prior to recapture because you cannot recapture classical logic in the right domains if you cannot identify those domains epistemically. It is highly tractable for postdocs with an interest in epistemology and methodology, and real progress would be a set of heuristic or formal markers that guide agents in choosing the appropriate logic for a given context.

  I hope this ordering provides the clarity you need to finalise the programme description. It is a ambitious project, but if you anchor it in the practical necessities of communication and scientific practice rather than purely technical refinements, it stands a much better chance of making a lasting contribution.

  Yours sincerely,

  A Colleague
