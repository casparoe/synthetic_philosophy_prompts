prompt: |-
  ok so this is oddly specific but it's genuinely eating at me right now. i help moderate a discord server for a miniature painting hobby, about 6000 members, and over the last two years a convention has emerged that literally nobody voted on or wrote down: when someone posts a finished model, reacting with a certain emote (a little paintbrush thing) means "this should go in the showcase channel," and then a mod crossposts it. new members pick it up purely by imitation within a week or so, and honestly most of them could not tell you what the emote "means" if you asked them directly — they just do it. also in one channel it has kind of drifted and now it just means "nice."

  for unrelated reasons a few of us mods ended up in a tiny reading group on Lewis's Convention (long story, it started as a moderation dispute about whether unwritten server norms "count"), and we all agree we've got a coordination problem with multiple possible equilibria, whatever. where we split is the common knowledge condition. my co-mod says the server plausibly fails it: nobody was ever told the system, half the members joined after it was already entrenched, and nobody can verify that everyone else expects conformity, prefers conformity given that expectation, and so on up the hierarchy. so she concludes it's not really a convention at all, just coordinated habit, and therefore we should pin an official written explanation of the emote system so it becomes a real rule. i think that's wrong, and the decision is actually on me this week, so i need someone to argue my side properly and not just vibes.

  please make the argument that a convention can persist — and even drift in its content — while the common knowledge condition fails, because the full hierarchy of mutual expectations is only genuinely needed when a convention is being born, and an entrenched convention can coast on plain mutual expectation plus imitation by newcomers. and then, honestly, tell me whether that argument actually supports my plan of NOT pinning the rules, or whether it quietly backfires — like if common knowledge only matters at the birth of a convention, maybe her pinning it is exactly the way you'd re-establish it after the drift. ugh.
