answer: |-
  Elias Thorne sits in the rented room above the cobbler's shop, the rain blurring the gaslight on the street below. It is 1924, and in six minutes, his grandfather Arthur will pass beneath the window. Elias holds a serviceable rifle, clean and loaded, and he has a prudential reason to fire: his own life is one of unmitigated, incurable suffering, and he calculates that non-existence is preferable to continuing it. He knows that if Arthur dies tonight, Elias will never be born, and his suffering will cease. He also knows, as an experienced temporal researcher, that the universe operates on a single, self-consistent timeline; there are no branches, only the one loop he currently inhabits. On his desk lies the file: records of five previous travelers who attempted to prevent their own births. All failed. One slipped on wet cobblestones; another's firing pin shattered; a third was delayed by a stray dog. There were no guardians, no logical force fields, just a string of mundane, statistically unremarkable misfortunes. Elias knows his own existence is proof that Arthur survives tonight. He is rational, well-informed, and desperate. He raises the rifle, knowing that to succeed is to vanish, and knowing that he is here to pull the trigger.

  ***

  **Specification Check**
  1.  **Metaphysics:** The scenario stipulates a single self-consistent timeline; the contradiction (killing the grandfather while existing) is assumed unreachable.
  2.  **No Fate Devices:** The past failures were mundane (slipped, rusty pin, dog), not magical or psychosomatic.
  3.  **Rational Agent:** Elias is a researcher with data on past failures; he is not reckless but calculating.
  4.  **Prudential Stakes:** The motive is the cessation of his own suffering (a self-interested welfare calculation), making the attempt rational *if* success were possible.
  5.  **Setting:** A rented room above a shop, grounded and visualizable.

  **Decision Theoretic Analysis**
  A Causal Decision Theorist (CDT) asks: "Which act causes the best expected outcome?" Elias's preferred outcome is non-existence (relief from suffering). The causal chain seems simple: *Pull Trigger → Grandfather Dies → Elias Never Born.* If Elias treats this as an ordinary causal intervention, and if he assigns a non-zero probability to success, CDT might recommend shooting, given the high utility of relief. However, Elias possesses overwhelming evidence that *Pull Trigger → Grandfather Lives.* His evidence is not merely that guns jam, but that *he is currently holding the gun.* In a single timeline, his presence is constitutive evidence that the causal chain leading to his birth remained intact. Therefore, the probability of success, conditional on his existence, is zero. The evidential verdict is "Do Not Shoot," because the act is evidentially correlated with failure (since he is there to perform it). The paradox relocates here: Elias cannot rationally intend to perform an act he knows, with certainty derived from his own existence, will not achieve its end. He is trapped in a deliberative bind where the rational desire to act is negated by the rational certainty of failure.

  **The Structure of the Evidence**
  The evidence argues not about the quality of the rifle or the skill of the shooter, but about the **truth of the past**. Elias's existence is a data point confirming that Arthur survived 1924. This cannot be dismissed as ordinary pessimism (e.g., "I'm a bad shot") because it is ontological, not statistical. Ordinary pessimism allows for a chance of success; this evidence entails impossibility. If he succeeds, the evidence (his existence) is falsified, which is impossible in a single timeline. Thus, the evidence is about the *fixedness of the history he is visiting*, mirrored in his own ontological status.

  **The Relocating Feature**
  The single feature doing the work is **indexical self-knowledge within a fixed timeline**. Elias knows *who* he is (Arthur's grandson) and *where* he is (the past of his own timeline). If you remove this feature—if Elias knows nothing of his genealogy or the past attempts—the scenario collapses into an ordinary murder plot. He would shoot, and either Arthur dies or he misses. Without the knowledge that his existence depends on Arthur's survival, there is no conflict between his evidence and his intention. The paradox requires the traveler to know that he is the *consequence* of the man he intends to kill.

  **The Branching-Timeline Reply**
  A branching-timeline theorist rejects the premise that Elias's current existence constrains the outcome of the shot. They argue: "You exist in Branch A. If you shoot, you create Branch B where Arthur dies. You will vanish from Branch A, or perhaps persist as an orphan in Branch B, but the contradiction is avoided." They reject the step of reasoning that claims "My existence proves Arthur survives *this* night." They deny the room of self-consistency entirely. Honestly, this reply **refuses to enter the room** where the paradox lives. It dissolves the deliberative tension by changing the metaphysics, but it does not solve the problem of how a rational agent deliberates when they *know* they are in a single, consistent loop. It offers an escape hatch rather than an answer to the epistemic bind.
