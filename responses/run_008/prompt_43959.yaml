      *   **Part 4: The Unlisted Case (Eternal Reward).** Analyze it using the derived principles. Compare to Tithe (transactional) and Shoplifter (external motivation).
      *   **Conclusion:** Summarize the insight.

  7.  **Refining the "Scaffolding" Metaphor:**
