      *   *Analysis:* This is transactional morality. "I give X, God gives Y."
      *   *Verdict:* Likely "Morally the same behavior, lower moral worth." Similar to Case 3 but with a carrot instead of a stick. It creates a ceiling (Case 2 logic) and is self-interested (Case 3 logic).
      *   *However:* If the alternative is doing nothing, it's Case 5 logic (Scaffolding).
      *   *My View:* It's instrumentally good, intrinsically hollow. It treats moral acts as currency.

  6.  **Structuring the Response:**
