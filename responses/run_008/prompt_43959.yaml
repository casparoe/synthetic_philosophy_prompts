      *   *Proposed Principle:* **The "Baseline & Ceiling" Principle.** Religion is morally positive if it raises the baseline of behavior above what would otherwise occur (Case 5, Case 1). It is morally negative if it lowers the ceiling of potential virtue (Case 2) or if it sustains the baseline solely through coercion when autonomous reasoning is possible (Case 3).
      *   *Wait, Case 3 says "not more moral."* It doesn't say "less moral." It says "not more." So Case 3 is Neutral. Case 5 is Positive ("more dependable... belief is doing real moral work").
      *   *Re-evaluating the Tension:* The user feels Case 3 implies deterrence doesn't count. Case 5 implies deterrence *does* count.
      *   *Resolution:* In Case 3, the behavior is *already* justified by reason. Deterrence is redundant and morally inferior motivation. In Case 5, the behavior is *not* justified by reason (he admits he'd cheat). Deterrence is necessary.
      *   *Coherent Notion:* **Moral Scaffolding.** Religion is moral when it acts as scaffolding for a structure that would otherwise collapse (Case 5). It is not moral when it acts as a cage that prevents growth beyond a minimum (Case 2) or when it substitutes fear for understanding where understanding is possible (Case 3).

  5.  **Addressing the "Eternal Reward" Case:**
