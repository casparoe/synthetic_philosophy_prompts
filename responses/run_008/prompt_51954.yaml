answer: |-
  This is a classic metaontological standoff. Your friend is advocating a version of **ontological deflationism** (similar to Eli Hirsch's "quantifier variance" or Carnap's internal/external distinction), and your counter-example is a standard **reductio** used by realists (like Ted Sider or Peter van Inwagen) to show that deflationism trivializes empirical inquiry.

  Your instinct is correct: the argument proves too much. The broken step is in the transition from **(1) to (2)**, specifically in the sufficiency condition of (1). However, fixing (1) creates the exact battlefield your friend is trying to avoid.

  Here is the diagnosis of the broken step, how to fix it without saving the asteroid crank, and what remains for metaphysics depending on who wins.

  ### 1. Locating the Broken Step: Premise (1) is Too Weak

  Your friend's definition in (1) is: *A dispute is verbal iff the two sides could make their apparent disagreement disappear by agreeing on how to use words...*

  The problem is the word **"could."** As your asteroid example shows, you can make *any* dispute disappear if you are allowed to gerrymander definitions sufficiently. I can define "bachelor" as "unmarried man who owns a Ford," and suddenly the dispute about whether John is a bachelor becomes verbal/stipulative, even if it was originally about his marital status.

  To block the asteroid case, you must tighten (1). A dispute is verbal only if the disagreement disappears under a **charitable, admissible, or natural** reinterpretation of the terms.

  **The Fix:**
  > (1*) A dispute is verbal iff the two sides can make their disagreement disappear by adopting meanings that **respect the prior semantic constraints** (usage, reference, causal history) of the terms, without changing beliefs about the world.

  ### 2. Why This Blocks the Asteroid Case

  In the asteroid case, the term "caused" has a semantic anchor in the actual causal history of the world and the scientific practices of the community. The skeptic's stipulation ("caused... means caused-and-left-exactly-this-iridium...") severs the link between the word and the phenomenon it was introduced to track. It is an **unnatural precisification**.

  When we interpret the skeptic charitably, we assume he means "cause" in the standard scientific sense. Under that standard sense, the dispute is substantive (about the world), not verbal. The "recipe" fails here because the skeptic's proposed usage violates the semantic constraints of "cause."

  ### 3. The Real Battle: Does "Exists" Have Semantic Constraints?

  This is where your friend will dig in. He will say:
  > "Fine, I accept (1*). But in the asteroid case, 'cause' is magnetically attracted to a specific causal relation. In the ontology case, 'exists' is **not** magnetically attracted to a specific composition relation. Our usage of 'exists' is loose, vague, and indeterminate. Therefore, both the Nihilist's and the Ordinary Person's interpretations are *equally admissible*."

  This is the doctrine of **Quantifier Variance**. Your friend claims there is no "joint-carving" fact of the matter about composition that fixes the meaning of "exists" prior to our stipulation.

  **To defeat him, you have two options:**

  #### Option A: Attack (2) directly (Metaphysical Realism)
  You argue that "exists" *does* have a precise meaning that carves reality at the joints, independent of our language.
  *   **The Move:** Deny that the Nihilist and Ordinary Person are both speaking truly. One is right, and one is wrong, because the structure of reality determines the truth conditions of quantifiers.
  *   **The Cost:** You must explain what this "structure" is without sounding mystical. (Ted Sider argues quantifiers are logical constants that reflect the fundamental structure of reality). You also have to explain why, if there is a fact of the matter, ordinary language is so persistently vague about it.

  #### Option B: Attack the "Indeterminacy" Claim (Semantic Realism)
  You argue that even if reality doesn't fix it, our **social/linguistic practices** do.
  *   **The Move:** Argue that our actual usage of "exists" is more constrained than the friend admits. We use "exists" in ways that commit us to tables (e.g., "There is something in the way," "Count the objects"). To reinterpret "exists" as the Nihilist does is just as uncharitable as the asteroid skeptic's move.
  *   **The Cost:** You have to do the hard work of linguistics/semantics to show that ordinary English quantifiers range over composite objects. (This is the route of philosophers like Lynne Rudder Baker or ordinary language philosophers).

  ### 4. If Your Friend Wins: What's Left for the Metaphysician?

  If your friend is right that the dispute is verbal (because "exists" is indeterminate and both precisifications are admissible), does metaphysics die? No, but its job changes.

  1.  **Conceptual Engineering:** The question shifts from "Are there tables?" to "Which conceptual scheme should we adopt?" The metaphysician argues for the *utility* of a scheme. (e.g., "We should adopt the Ordinary scheme because it simplifies our causal explanations," or "We should adopt the Nihilist scheme because it aligns better with physics.")
  2.  **Fundamental Structure:** Even if "Are there tables?" is verbal, "What is the fundamental structure of the world?" might not be. A metaphysician can say, "Whether we call it a 'table' is a verbal choice, but the fact that there are simples arranged tablewise is fundamental, and the fact that there is a *substance* 'table' is not." The metaphysician maps the joints of nature, leaving the labeling to pragmatics.
  3.  **Grounding:** The dispute might be verbal at the level of existence, but substantive at the level of **grounding**. "The table exists" might be true, but only *in virtue of* the simples. The metaphysician studies the "in virtue of" relation, which is not verbal.

  ### 5. Summary Advice for Your Debate

  Tell your friend this:

  1.  **Concede (1) is flawed:** Admit that (1) as stated allows the asteroid crank to win. It needs a "naturalness" or "charity" constraint.
  2.  **Challenge the Analogy:** Once (1) is fixed to block the asteroid crank, the burden shifts to him to show why the Nihilist's reinterpretation of "exists" is **natural/charitable** while the Skeptic's reinterpretation of "cause" is not.
  3.  **The "Joint-Carving" Objection:** Ask him: "Is 'exists' a natural kind term like 'water' or 'cause', or is it a logical constant like 'and' or 'or'?"
      *   If it's like 'water', usage is fixed by the world (Realism wins).
      *   If it's like 'and', it has a fixed logical role that might rule out the Nihilist's restriction (Realism wins).
      *   He needs to explain why 'exists' is uniquely flexible compared to every other term in our vocabulary.

  **The Verdict:**
  Give up **(1)** in its current form, but replace it with a constrained version. Then, argue that **(2)** fails because the constraint (semantic naturalness/charity) rules out the Nihilist's idiolect just as it rules out the Asteroid Skeptic's. If he insists "exists" is uniquely vague, demand an explanation of *why* ontology gets special linguistic immunity that geology and physics do not.

  If he wins, you become a **conceptual engineer**. If you win, you remain a **metaphysical realist**. Both are viable careers, but only one allows you to say the asteroid impact *really* caused the extinction without adding "in my idiolect."
