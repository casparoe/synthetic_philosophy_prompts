  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I need to make sure I don't conflate Rubin (potential outcomes) with Lewis (metaphysics). Rubin is statistical; Lewis is ontological. The user knows Rubin implicitly. I need to show how Lewis is the *philosophical justification* for Rubin.
      *   *Nuance:* The user mentioned "correlation is not causation." I should explain that interventionism is basically a rigorous definition of how to break that link.
