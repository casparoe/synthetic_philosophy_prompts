      *   **Conclusion:** Final takeaway for reporting.

  9.  *(Self-Correction on Lewis)*: Be careful not to dismiss Lewis entirely. His "similarity of worlds" is the philosophical ancestor of "exchangeability." If the control group isn't similar enough to the treatment group (in all relevant ways), the counterfactual inference fails. Lewis just makes that "similarity" the central metaphysical problem.

  10. *(Self-Correction on Interventionism)*: Emphasize that Woodward isn't just talking about *actual* experiments, but *in principle* interventions. This saves some non-manipulable claims but kills others (like big bang causes).

  11. *Final Polish:* Ensure the distinction between *identifying* a causal effect (stats) and *defining* causation (metaphysics) is clear. The user does the former; the philosophers argue about the latter.

