prompt: |-
  I teach an upper-level seminar on democratic theory and collective decision-making — 18 students, one 80-minute session — and next week we reach the judgment aggregation literature and the discursive dilemma. The students have already had the Condorcet jury theorem and Arrow-style results, so they're comfortable with the idea that voting rules have structural pathologies; what they haven't felt is the specific thing the discursive dilemma does, namely that a group can hold a majority view on every relevant premise while a majority rejects the conclusion those premises entail, so that "just vote on the reasons" doesn't rescue majority rule the way they keep suggesting it will.

  I'd like you to design the activity itself. My instinct is a mock hiring committee: three or so candidates for a fictional position, and committee members holding private judgment cards specifying their sincere yes/no positions on, say, research quality, teaching fit, and whether a disqualifying circumstance applies, with the bylaws requiring all criteria to be met for a hire. You'd need to construct the cards so that the majorities on the premises and the majority on the bottom-line conclusion come apart in the alarming way, and the class shouldn't see that coming. But I'm open to a different staging if you think one lands harder — an appellate panel on a two-element tort claim, a grant review board, whatever — as long as participants make real decisions with some stakes attached (points, small privileges, anything but real money) rather than watching me work the paradox at the board. Ideally there should be a second phase where someone controls the order in which questions go to a vote, so the class discovers that agenda-setting flips the outcome for identical preferences.

  Beyond the rules, materials, card contents, and a minute-by-minute timeline, I want a debrief that maps specific moments in the activity onto the distinction between premise-based and conclusion-based aggregation and shows where each coalition came from. Please also include the practical honesty: what will predictably go wrong the first time I run it (probably students comparing cards early, or one person recognizing the structure from a reading and announcing it), and how I should handle that. Finally, be explicit about what the activity cannot reproduce — which features of the real problem (deliberation before voting, the systematic impossibility results, the incentive to misreport one's premises strategically) have to be supplied by me at the board — and tell me what would make you abandon or redesign this activity: where, specifically, the payoff scheme or the card construction is most likely to teach students the wrong lesson, and what evidence in how the room behaves would tell you the design failed.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on democratic theory/collective decision-making. 18 students, 80-minute session.
      *   **Topic:** Judgment Aggregation / Discursive Dilemma (Doctrinal Paradox).
      *   **Prior Knowledge:** Condorcet Jury Theorem, Arrow's Impossibility Theorem (comfortable with structural pathologies).
      *   **Goal:** Make students *feel* the specific tension of the discursive dilemma (majority on premises $\neq$ majority on conclusion) and the impact of agenda setting (premise-based vs. conclusion-based).
      *   **Format:** Active learning activity (mock committee/panel), not just lecture. Needs stakes (points/privileges).
      *   **Requirements:** Rules, materials, card contents, timeline, debrief mapping theory to activity, troubleshooting (what goes wrong), limitations (what the activity *can't* show), and failure conditions.
      *   **Specific Constraint:** The user suggested a hiring committee but is open to other stagings (appellate panel, grant board) if they land harder.

  2.  **Determine the Staging:**
      *   *Hiring Committee:* Good, but "hiring" often implies finding the *best* candidate, which introduces ranking/grading complexities. The discursive dilemma is binary (Hire/Don't Hire based on criteria).
      *   *Grant Board:* Similar to hiring.
      *   *Appellate Panel (Legal):* This is the classic List & Pettit / Kornhauser & Sager setup. It's binary (Liable/Not Liable). The logic is strict: Liable iff Breach AND Causation. This maps perfectly to logical conjunction ($P \land Q \rightarrow R$).
      *   *Decision:* Go with the **Appellate Panel**. It feels more formal, reduces "negotiation" vibes (you shouldn't negotiate legal truth), and fits the "judgment" aspect of Judgment Aggregation better than "preference" aggregation. It also allows for a clear "bylaw" structure.

  3.  **Design the Logic (The Math):**
      *   Need 18 students.
      *   Need a proposition structure: $P$ (Premise 1), $Q$ (Premise 2) $\rightarrow C$ (Conclusion).
      *   Constraint: Majority says Yes to $P$, Majority says Yes to $Q$, but Majority says No to $C$.
      *   Logic: $C$ is true only if $P$ and $Q$ are both true.
      *   Distribution needed for 18 students (simple majority is 10):
          *   Group 1 (Yes/Yes $\rightarrow$ Yes): Need fewer than 9. Let's say 6.
          *   Group 2 (Yes/No $\rightarrow$ No): Need enough to flip $Q$ majority. Let's say 6.
          *   Group 3 (No/Yes $\rightarrow$ No): Need enough to flip $P$ majority. Let's say 6.
          *   *Check:*
              *   $P$ Yes: Group 1 (6) + Group 2 (6) = 12 (Majority).
              *   $Q$ Yes: Group 1 (6) + Group 3 (6) = 12 (Majority).
              *   $C$ Yes: Group 1 (6) = 6 (Minority).
      *   This is the perfect 3-way split (6-6-6).

  4.  **Design the Activity Flow:**
      *   **Phase 1: Conclusion-Based Voting (Direct Democracy).** Vote on the verdict directly. Result: Not Liable.
      *   **Phase 2: Premise-Based Voting (Representative/Technocratic).** Vote on premises, derive verdict. Result: Liable.
      *   **Phase 3: Agenda Control.** Let a "Chair" decide the order/method.
      *   **Stakes:** Points towards participation grade or a tangible reward (e.g., choosing the break time, or a "get out of homework pass" for the winner faction). Let's use "Decision Points" redeemable for a small privilege (e.g., 1 week extension on a paper).

  5.  **Drafting the Materials:**
      *   **Case:** *Smith v. University*. Did the University breach a contract ($P$)? Did the breach cause damages ($Q$)? Is the University Liable ($C$)?
      *   **Cards:** Pre-printed slips with their "Private Judgment."
      *   **Instructions:** Strict rules on no talking during voting.

  6.  **Developing the Timeline (80 mins):**
      *   Intro/Setup (10)
      *   Distribution of Roles/Cards (5)
      *   Round 1: Conclusion-Based (10)
      *   Round 2: Premise-Based (10)
      *   Round 3: Agenda Setting/Chair (15)
      *   Debrief/Theory Connection (30)
      *   Wrap (5)

  7.  **Addressing the "Practical Honesty" (Troubleshooting):**
      *   *Risk 1:* Students talk and coordinate. *Fix:* Emphasize "Private Judgment."
      *   *Risk 2:* Someone spots the paradox immediately. *Fix:* Have them hold the reveal until the end.
      *   *Risk 3:* Students treat it as a preference aggregation (bargaining) rather than judgment (truth-seeking). *Fix:* Frame it as finding the *correct* legal outcome, not the *preferred* one.
      *   *Risk 4:* Confusion on the logical connective. *Fix:* Write the rule clearly on the board ($P \land Q \rightarrow C$).

  8.  **Mapping the Debrief:**
      *   Connect Round 1 to "Conclusion-Based Aggregation" (CBA).
      *   Connect Round 2 to "Premise-Based Aggregation" (PBA).
      *   Show the inconsistency: The group believes $P$, believes $Q$, but denies $C$. Incoherent corporate mind.
      *   Connect Round 3 to Agenda Power/Manipulation.

  9.  **Limitations & Failure Conditions:**
      *   *Limitation:* This is a one-shot game. Real deliberation might resolve the inconsistency (change minds). The activity freezes preferences.
      *   *Limitation:* Strategic voting isn't naturally incentivized unless the stakes are high enough.
      *   *Failure:* If the split isn't 6-6-6 (e.g., if cards get mixed up), the paradox vanishes.
      *   *Failure:* If students treat it as a negotiation ("I'll vote Yes on P if you vote Yes on Q"), it becomes bargaining, not aggregation.

  10. **Refining the Design (Self-Correction):**
      *   *Critique:* Is 18 students too many for a single committee?
      *   *Adjustment:* Split into 3 panels of 6? No, the paradox requires a specific distribution. If I split them, each panel might not have the paradox. Better to run one plenary "Court" of 18. It's large but manageable for voting.
      *   *Critique:* Stakes need to be low enough not to cause anger but high enough to care.
      *   *Adjustment:* "Class Currency" redeemable for a specific, low-cost privilege (e.g., picking the topic for the last week).
      *   *Critique:* How to handle the "Chair" in Round 3?
      *   *Adjustment:* Pick a volunteer or the instructor acts as Chair to demonstrate manipulation, then let a student try. Actually, better to let a student be the "Chief Justice" who decides the voting procedure.

  11. **Final Polish:**
      *   Ensure the distinction between *Preference Aggregation* (Arrow) and *Judgment Aggregation* (List/Pettit) is clear in the debrief.
      *   Make sure the card distribution instructions are foolproof for the instructor.

  12. **Writing the Response:** (Proceeding to generate the detailed plan based on these thoughts.)
answer: |-
  This is a high-risk, high-reward activity. If the numbers don't align, the paradox vanishes. If the students treat it as a negotiation rather than a truth-seeking exercise, you teach bargaining, not aggregation.

  Below is a complete design for **"The Case of the Breached Contract."** I have selected a **mock appellate panel** over a hiring committee. Hiring implies selecting the *best* option (ranking), whereas the discursive dilemma is sharpest in binary *judgment* (True/False, Liable/Not Liable). A legal setting reinforces the idea that there is a "correct" answer determined by rules, which makes the inconsistency more jarring than in a hiring context where "fit" is subjective.

  ### 1. Activity Overview
  *   **Title:** The Doctrinal Paradox Court
  *   **Time:** 80 Minutes
  *   **Participants:** 18 Students (Plenary "Supreme Court")
  *   **Stakes:** "Judicial Points." The faction (Premise-voters vs. Conclusion-voters) that achieves their desired outcome in the final round wins a tangible privilege (e.g., choosing the reading topic for the final week, or a 48-hour extension token for the next paper).
  *   **Logical Structure:** $P$ (Breach) AND $Q$ (Causation) $\rightarrow C$ (Liable).
  *   **Distribution:** 6 students hold (Yes, Yes, Yes); 6 hold (Yes, No, No); 6 hold (No, Yes, No).
      *   Majority on $P$: 12 Yes.
      *   Majority on $Q$: 12 Yes.
      *   Majority on $C$: 6 Yes (Minority).

  ### 2. Materials & Preparation
  You need to prepare 18 **Private Judgment Cards**. Do not let students see these until the activity starts.

  **The Card Design:**
  Print these on distinct colored paper or mark them subtly (A, B, C) so you can verify the distribution later without exposing them to the class.

  *   **Type A (6 cards):**
      *   Breach of Contract ($P$): **YES**
      *   Causation of Damages ($Q$): **YES**
      *   *Instruction:* Your logic dictates the Defendant is **LIABLE**.
  *   **Type B (6 cards):**
      *   Breach of Contract ($P$): **YES**
      *   Causation of Damages ($Q$): **NO**
      *   *Instruction:* Your logic dictates the Defendant is **NOT LIABLE**.
  *   **Type C (6 cards):**
      *   Breach of Contract ($P$): **NO**
      *   Causation of Damages ($Q$): **YES**
      *   *Instruction:* Your logic dictates the Defendant is **NOT LIABLE**.

  **Board Setup:**
  Write the **Bylaws** clearly on the board before class starts:
  1.  **The Rule of Law:** Liability ($C$) exists IF AND ONLY IF Breach ($P$) AND Causation ($Q$) are both established.
  2.  **Confidentiality:** Do not show your card to anyone. Do not discuss your specific votes until the Debrief.
  3.  **Sincerity:** You are judges, not advocates. Vote your sincere judgment on each proposition.

  ### 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Framing**
  *   Explain the case: *Smith v. University*. Did the University breach a contract? Did that breach cause the financial loss?
  *   Explain the Bylaws (on the board). Emphasize that $C$ is logically derived from $P$ and $Q$.
  *   Distribute cards randomly. **Crucial:** Ensure you hand out exactly 6 of each type. (Tip: Count them into three piles before class; deal them out like playing cards).
  *   Give students 2 minutes to read their cards and internalize their "sincere judgment."

  **00:10 – 00:25: Round 1 (Conclusion-Based Aggregation)**
  *   **Procedure:** "We will vote directly on the Verdict. Ignore the premises for now. Is the Defendant Liable?"
  *   **Vote:** Show of hands.
  *   **Expected Result:** 6 Yes, 12 No. **Verdict: Not Liable.**
  *   **Record:** Write "Round 1: NOT LIABLE" on the board.
  *   **Stakes:** Ask the "Liable" minority (Type A students) how they feel. (They will feel frustrated; the majority rejected their conclusion).

  **00:25 – 00:40: Round 2 (Premise-Based Aggregation)**
  *   **Procedure:** "The Chief Justice has overturned the procedure. We must now vote on the findings of fact first. The verdict will be determined automatically by the Bylaws."
  *   **Vote 1:** "Is there a Breach ($P$)?" (Expected: 12 Yes, 6 No). **Result: YES.**
  *   **Vote 2:** "Is there Causation ($Q$)?" (Expected: 12 Yes, 6 No). **Result: YES.**
  *   **Derivation:** Since $P$=Yes and $Q$=Yes, the Bylaws dictate $C$=Yes.
  *   **Record:** Write "Round 2: LIABLE" on the board.
  *   **Stakes:** Ask the "Not Liable" majority (Type B & C students) how they feel. (They will feel frustrated; they voted No on the verdict in Round 1, and now they are bound to a verdict they rejected).

  **00:40 – 00:55: Round 3 (Agenda Control)**
  *   **Selection:** Pick one student to be the "Chief Justice" (ideally someone who hasn't spoken much).
  *   **Power:** The Chief Justice decides *how* the court votes this time (Direct Verdict OR Premises First). They announce their method *before* the vote.
  *   **Incentive:** Tell the class: "The Chief Justice belongs to one of the judgment types (A, B, or C). They want the outcome that matches their card. They will choose the procedure that guarantees their win."
  *   **Action:** The Chief Justice declares the method. The class votes. The outcome flips based on the method.
  *   **Payoff:** Award the "Class Privilege" to the faction that won this round.

  **00:55 – 01:20: Debrief & Theory Mapping**
  *   (See detailed debrief script below).

  ---

  ### 4. The Debrief: Mapping Activity to Theory
  Do not simply explain the theory; ask them to explain the activity using the theory.

  **Step 1: The Inconsistency (10 mins)**
  *   **Ask:** "Look at the board. In Round 2, we voted Yes on Breach. We voted Yes on Causation. We voted No on Liability. Is this group rational?"
  *   **Concept:** **Collective Incoherence.** The group holds contradictory beliefs.
  *   **Map:** This is the **Discursive Dilemma**. Unlike Arrow (which is about ranking preferences), this is about logical consistency of beliefs.
  *   **Key Question:** "If we are a collective agent (a Court), do we believe $P$ and $Q$ are true, but $C$ is false? That violates modus ponens."

  **Step 2: Premise vs. Conclusion Based (10 mins)**
  *   **Ask:** "Which round was 'Premise-Based Aggregation' (PBA)? Which was 'Conclusion-Based' (CBA)?"
  *   **Map:**
      *   Round 1 = CBA (Protects the majority will on the outcome, sacrifices logical integrity).
      *   Round 2 = PBA (Protects logical integrity, sacrifices the majority will on the outcome).
  *   **Discussion:** Why do legal systems usually prefer PBA? (Precedent, reason-giving). Why do plebiscites prefer CBA? (Direct will of the people).

  **Step 3: Agenda Power (5 mins)**
  *   **Ask:** "In Round 3, did the preferences of the students change?" (No). "Did the outcome change?" (Yes).
  *   **Map:** **Procedural Manipulation.** In Arrow, we worried about social welfare functions. Here, we see that the *order* of voting determines the truth. The "Chief Justice" didn't change minds; they changed the aggregation rule.

  ---

  ### 5. Practical Honesty: What Will Go Wrong
  You asked for the specific failure modes. Here is where this design usually breaks:

  **1. The "Card Leak" (High Probability)**
  *   **Risk:** Students compare cards during the 2-minute reading time. If a Type A and Type B student talk, they might realize: "Wait, if we both vote Yes on Breach, we get a majority."
  *   **Mitigation:** Be draconian. "If you discuss your card before the vote, you are recused from the Court." Walk around the room during the reading time.
  *   **If it happens:** If they figure it out, lean into it. "Congratulations, you just discovered strategic voting. But in this seminar, we are assuming *sincere* judgment aggregation. Reset and vote sincerely."

  **2. The "Math Error" (Medium Probability)**
  *   **Risk:** You miscount the cards. If you hand out 7 Type A, 5 Type B, 6 Type C, the paradox breaks (Type A becomes a majority on the Conclusion).
  *   **Mitigation:** Count the cards twice before walking into the room. Have a "spare" set in your pocket. If the vote comes out 10-8 instead of 12-6, acknowledge the noise but explain the *theoretical* distribution required for the paradox.

  **3. The "Negotiator" (Medium Probability)**
  *   **Risk:** A student says, "I'll vote Yes on Causation if you vote Yes on Breach." This turns the activity into a logroll/bargaining game.
  *   **Mitigation:** This is actually a teaching moment, but it distracts from the *structural* paradox. Stop it. "This is a court, not a legislature. You are finding truth, not making deals."
  *   **Why:** If they bargain, they can resolve the paradox. The point of the activity is to show the paradox *cannot* be resolved without changing the rule.

  **4. The "Know-It-All" (Low Probability)**
  *   **Risk:** A student read List & Pettit over the weekend and shouts "This is the Doctrinal Paradox!" in minute 5.
  *   **Mitigation:** "Great, you know the name. But can you predict the outcome? Prove it with your vote." Use them as a lieutenant to help tally, but ask them to stay silent on the *implications* until the debrief.

  ---

  ### 6. Limitations: What This Activity Cannot Reproduce
  Be explicit to the class about what the simulation leaves out. You must supply these via lecture after the activity.

  1.  **Deliberation:** In the activity, preferences are fixed. In reality, discussing the premises might change minds (e.g., Type C students might realize their view on Causation is wrong if Breach is established). The paradox is strongest when preferences are *fixed*.
  2.  **Strategic Incentives:** In the activity, I asked you to vote sincerely. In reality, Type B students have an incentive to lie about Premise 1 to save their preferred Conclusion. This activity assumes honesty; the literature shows honesty is often not a Nash Equilibrium.
  3.  **More than 2 Premises:** We used a simple conjunction ($P \land Q$). Real legal doctrines involve disjunctions, conditionals, and weighted criteria. The impossibility holds, but the math is messier.
  4.  **Intensity:** Everyone's vote counted equally. In real committees, some members have more expertise or authority.

  ### 7. Failure Conditions: When to Abort
  You asked when the design teaches the *wrong* lesson.

  *   **Failure Mode 1: The "Compromise" Lesson.**
      *   *Sign:* Students suggest splitting the difference ("Let's find the Defendant partially liable").
      *   *Why it fails:* The Discursive Dilemma is about binary logical consistency. Fuzzy logic dissolves the paradox artificially.
      *   *Fix:* Remind them the Bylaws are binary. Liability is 0 or 1.

  *   **Failure Mode 2: The "Majority Rules" Lesson.**
      *   *Sign:* Students conclude, "Round 1 was fair because more people wanted Not Liable."
      *   *Why it fails:* They miss the point that the group *beliefs* are incoherent. If the group believes $P$ and believes $P \rightarrow C$, but denies $C$, the group is irrational, regardless of fairness.
      *   *Fix:* Press hard on the "Corporate Mind." "If this Court writes an opinion, what does it say? It says P is true. It says Q is true. It says C is false. Will the Supreme Court uphold that?"

  *   **Failure Mode 3: The "Distribution" Failure.**
      *   *Sign:* The vote on Premise 1 is 9-9 (Tie).
      *   *Why it fails:* Ties introduce breaking rules that muddy the aggregation logic.
      *   *Fix:* If a tie occurs, you (the Instructor) must cast the tie-breaking vote *randomly* or declare a mistrial and reshuffle cards. Do not let a tie stand as a "No."

  ### 8. Why This Design Works for Your Context
  *   **Upper-Level:** It respects their prior knowledge of Arrow. You can explicitly say, "Arrow showed us we can't rank preferences consistently. List and Pettit show us we can't even judge truth consistently."
  *   **80 Minutes:** The timeline is tight but feasible. The debrief is the most important part, so the activity is kept to 45 minutes max.
  *   **Stakes:** The "Judicial Points" creates enough tension to make the Round 2 frustration feel real, without risking actual grades.
  *   **Visual:** Having "ROUND 1: NOT LIABLE" and "ROUND 2: LIABLE" written side-by-side on the board creates a cognitive dissonance that lecture alone cannot achieve.

  ### Instructor Cheat Sheet (For your pocket)
  *   **Total Students:** 18
  *   **Piles:** A (6), B (6), C (6).
  *   **Logic:** $C \iff P \land Q$.
  *   **Round 1 Vote:** Vote on $C$. (Expect 6 Yes).
  *   **Round 2 Vote:** Vote on $P$ (Expect 12 Yes), then $Q$ (Expect 12 Yes). Derive $C$.
  *   **Key Phrase:** "It is not that the majority is overruled; it is that the 'Majority' is not a single agent. The Majority on P is a different coalition than the Majority on Q."
