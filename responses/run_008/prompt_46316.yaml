  I host a small podcast on minds and machines, and next week's guest is a philosopher who defends the physical Church-Turing thesis in the strong form: not the tame version about what a human clerk with pencil and paper can effectively calculate, but the claim that no physical process whatsoever outcomputes a Turing machine. He also has a habit of defusing hypercomputation proposals by absorbing them: whenever someone describes a gadget that supposedly settles the halting problem, he says that shows the gadget wasn't physically realizable, so the thesis survives by construction. Draft me eight to ten questions that make that move progressively harder to use. I want at least one question each on (a) the gap between the 1936-ish original thesis about human calculability and the bold physical version he actually defends, (b) analog computation and whether infinite precision in finite time is a physical possibility or a physicists' idealization, (c) relativistic tricks where you watch someone else's infinite computation finish in finite proper time, and (d) whether, given his absorption move, the thesis is an empirical claim at all or just a disguised definition of "physical." For each question, add a follow-up keyed to the answer he's most likely to give — he's very fond of replying that any proposed counterexample just smuggles in an unphysical infinity. Start your response with the first question itself, no preamble and no restating of my setup.
