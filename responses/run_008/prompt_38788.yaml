      *Wait, one nuance on Move 4:* Ben says "if your neighbor had no animal, he'd have no dog." This assumes the nearest world where $q$ is false is a world where $p$ is false. But in skeptical cases (Zebras/Mules), the nearest world where $q$ is false (it's a mule) is a world where $p$ is false (it's not a zebra) *but you still believe $p$*. Ben needs to argue that for Dog/Animal, the nearest ~Animal world is a ~Dog world where you don't believe. For Zebra/Mule, the nearest ~Zebra world is a Mule world where you *do* believe. Ben is implicitly making this distinction. I need to highlight this.

