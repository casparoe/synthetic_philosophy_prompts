answer: |-
  This is a fantastic set of intuitions. You have effectively reconstructed the debate around the Extended Mind Hypothesis (EMH) through case studies, and you've hit on the exact friction points that philosophers like Andy Clark, David Chalmers, and their critics (like Adams and Aizawa) have fought over for decades.

  Your gut verdicts suggest you are looking for a principle that preserves **individual agency** while allowing for **functional integration**. You want to extend the mind into tools without dissolving the self into the social environment.

  Here is a principle that captures your verdicts, avoids the "ad hoc" charge regarding your wife, and resolves the AI case.

  ### The Principle: Transparent Cognitive Ownership

  A resource counts as part of your mind if and only if it satisfies three conditions:
  1.  **Reliability:** You trust it implicitly (rules out the distrusted note).
  2.  **Transparency:** You do not actively monitor or veto its output during normal use (rules out GPS).
  3.  **Agency Subordination:** The resource does not possess its own independent cognitive agency or goals (rules out the Wife).

  Let's run your cases through this filter.

  #### 1. The Trust Condition (The Distrusted Note)
  *   **Verdict:** Not Mind.
  *   **Why:** EMH requires "Glue and Trust." If you have to verify the note, it is external data, not internal belief. Your intuition here is spot on: a belief you distrust is a contradiction in terms.

  #### 2. The Transparency Condition (GPS vs. Phone Calendar)
  *   **Verdict:** Phone = Mind; GPS = Tool.
  *   **Why:** This addresses your GPS intuition. You noted you would override the GPS if it drove you into a river. This means you are running a **monitoring process**. You are treating the GPS as a *testimony provider*, not a *memory store*.
  *   With the phone calendar, you don't check the calendar against your internal memory; the calendar *is* the memory. There is no "veto" point. The cognitive process flows *through* it transparently. With GPS, the process stops *at* it, is evaluated, and then acted upon.

  #### 3. The Agency Subordination Condition (The Wife)
  *   **Verdict:** Not Mind.
  *   **Why:** This is the bullet you were worried about biting. The principle avoids being ad hoc by relying on a metaphysical distinction rather than a social one.
  *   Your phone cannot decide to hide an appointment from you to teach you a lesson. Your wife can. She has **competing agency**. Even if she is perfectly reliable now, her reliability is contingent on her own independent cognitive states, which you cannot access directly.
  *   **Error Attribution Test:** If your phone calendar deletes an appointment, *you* have lost a memory. If your wife forgets an anniversary, *she* has failed you. The locus of responsibility remains distinct. A cognitive system requires a unified locus of responsibility. Two agents trusting each other is a *social contract*, not a single *cognitive system*.

  #### 4. The Processing Scaffold (The Rubber Duck)
  *   **Verdict:** Extended Processing (but not Storage).
  *   **Why:** The duck doesn't hold information, but it alters your cognitive *workflow*. It forces linearization of thought. Because it has no agency and requires no monitoring (it just sits there), it becomes transparent. It is part of the *machinery* of your thinking, even if it isn't the *storage* of your thinking.

  ---

  ### The Verdict on the AI Assistant

  This is the case you are flip-flopping on, and the Principle of Transparent Cognitive Ownership gives a precise, albeit nuanced, answer.

  **The Verdict: It is a Tool, not Mind (Yet).**

  Here is why, based on your description: *"I always endorse after a quick skim."*

  1.  **The Skim is Monitoring:** That "quick skim" is the same cognitive move you make with the GPS. You are checking for hallucinations, tone, or logical errors. Because you retain the **veto power** and exercise **active monitoring**, the AI remains an external advisor, not an internal belief generator.
  2.  **Generative Opacity:** With Otto's notebook, *you* wrote the note. The causal history of the belief is your own past agency. With the AI, the causal history of the argument is a neural net. You are recognizing the validity of the argument, not recalling its generation.
  3.  **The Tipping Point:** The AI would cross into "Extended Mind" territory only if you stopped skimming. If you reached a state where you treated the AI's output with the same automatic, unmonitored trust as your biological memory or Otto's notebook—where an AI error felt like *your* memory failure rather than *its* hallucination—then it would become part of your mind.

  **Why your intuition says "The belief lives in the skimming":**
  You are correct. The cognitive work that makes the belief *yours* is the endorsement (the skim), not the drafting. The drafting is equivalent to someone else handing you a memo. If you file the memo without reading it, it's not your belief; it's blind faith. If you read it and integrate it, *that integration* is the cognitive act.

  ### Summary of the Principle

  Your intuitions are governed by a **Boundary of Agency**.

  You are willing to extend your mind into **dead matter** (notebooks, phones, ducks) because dead matter is subordinate to your agency. You are unwilling to extend your mind into **other agents** (wives) or **monitored systems** (GPS, AI) because they introduce a second locus of control.

  *   **Otto/Phone/Note:** Dead matter + High Trust + No Monitoring = **Mind.**
  *   **GPS/AI:** Smart matter + High Trust + **Active Monitoring** = **Tool.**
  *   **Wife:** **Other Agent** + High Trust + No Monitoring = **Partner.**

  This explains why social trust feels different without being ad hoc: Social trust is a negotiation between two minds; cognitive trust is the assimilation of a resource into one mind.
