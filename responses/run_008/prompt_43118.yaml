answer: |-
  Your intuition is sharper than your tentative principle. Your principle wobbles because it tries to judge the *person* rather than the *relationship between the community and the memory*. You are asking whether the man was good enough, when you should be asking what the monument is asking *you* to do.

  Here is a repaired framework, tested against your cases, followed by the hard truths it reveals.

  ### The Principle of Civic Endorsement vs. Historical Record

  To stabilize your verdicts, you must distinguish between spaces of **aspiration** and spaces of **archive**.

  1.  **The Function Test:** Is the commemoration in a space where the community gathers to *build the future* (schools, streets, courthouse lawns) or to *study the past* (museums, libraries, bookshelves)?
      *   *Aspirational spaces* imply ongoing civic endorsement. They say, "We aspire to be like this," or "We owe this person our current success." These require moral alignment with current foundational values.
      *   *Archival spaces* imply historical significance. They say, "This person shaped us, for good or ill." These require accuracy and context, not moral purity.

  2.  **The Causality Test:** Was the wrongdoing the *engine* of the honor, or a *companion* to it?
      *   If the achievement (wealth, fame, victory) was directly produced by the harm (slavery, brutal labor, eugenics), the honor is tainted at the root.
      *   If the achievement (art, science, leadership) exists independently of the harm (bigotry, private vice), the work may be separated from the worker in archival spaces, but rarely in aspirational ones.

  3.  **The Agency Test:** Is engagement mandatory or voluntary?
      *   If the community is forced to inhabit the name (a school, a street address), the burden of justification is higher.
      *   If the community chooses to engage (reading a book, entering a museum), the burden is lower.

  ### Testing Your Verdicts

  Here is how this framework applies to your seven decided cases:

  1.  **Confederate Officer (Courthouse):** *Aspirational space.* The statue implies the state endorses his cause. The cause was the preservation of slavery. **Verdict: Remove.** (Saved)
  2.  **Confederate Officer (Museum):** *Archival space.* The context explains the cause without endorsing it. **Verdict: Keep.** (Saved)
  3.  **Town Founder (Library):** *Hybrid space.* Libraries are archival, but a statue on a pedestal is aspirational. However, the Founder is the "origin myth" of the town. The plaque serves the *Historical Record* function by admitting the debt. **Verdict: Keep + Plaque.** (Saved, but precariously).
  4.  **Doctor (Street Name):** *Aspirational/Functional.* Street names are civic navigation. Eugenics violates the foundational ethic of medicine (do no harm). The fame is low, so the loss of history is minimal. **Verdict: Rename.** (Saved)
  5.  **Novelist (Plaque):** *Archival/Voluntary.* The plaque marks a cultural fact; the books are voluntary. The art is separable from the letters. **Verdict: Keep.** (Saved)
  6.  **Industrialist (School):** *Aspirational/Mandatory.* A school shapes children. The fortune (the reason for the honor) was built on the abuse of laborers (the people the school serves). The harm was the *engine* of the wealth. **Verdict: Rename.** (Saved)
  7.  **WWI Memorial (Square):** *Aspirational/Archival Hybrid.* It is a generic soldier (archival of grief) but in a public square (aspirational). The co-option by the far-right is an *external* act, not intrinsic to the monument. Removing it cedes the history to them. Keeping it requires active reclamation. **Verdict: Keep + Reclaim.** (Saved, validates your distrust).

  ### The Verdicts the Principle Cannot Save

  A consistent application of this principle exposes a contradiction in your thinking that you suspected but did not name. **You cannot logically save the Town Founder if you remove the Industrialist.**

  Under the **Causality Test**, both men built their legacies on exploited bodies. The Industrialist's labor practices were brutal; the Founder's were chattel slavery. Under the **Function Test**, a library is as much a place of public formation as a school.

  Your hesitation regarding the Founder is likely due to *temporal distance* and *mythological status*. He is the "George Washington" of your town. To remove him feels like erasing the town's existence. But if the principle is that we do not name public institutions after men whose wealth was directly extracted from the unfree or the brutalized, the Founder's statue belongs in the museum, not on the pedestal. The library can remain (it serves a function), but the *honor* of the statue is inconsistent with the removal of the Industrialist's name.

  If you adopt this principle, you must admit that the Founder's pedestal is a compromise with history, not a moral consistency. You keep it not because it is right, but because it is the foundation of the town's identity, and you mitigate it with the plaque. That is a political choice, not a moral one. The principle saves your *peace*, but not your *logic*, on this specific point.

  ### The Undecided Case: The Fabricated Hero

  You asked for a prediction regarding the commemorative name chosen in living memory for a man believed to be a hero, now shown to be a fabrication.

  **The Principle predicts: Remove.**

  Here is why:
  1.  **Function:** This is an *Aspirational* honor. The community named a space to say, "We value what this man did."
  2.  **Causality:** There is no achievement to separate from the vice. The "heroism" was the product. If the heroism is a lie, the product is null.
  3.  **Agency:** Unlike the Confederate statue (which tells a true, ugly history of white supremacy) or the Novelist (who wrote real books), the Fabricated Hero offers no *Historical Record* value. Keeping the name does not preserve a difficult truth; it preserves an error.

  In your novel, this is the easiest case. A monument to a lie is not history; it is a mistake. Correcting it is not erasure; it is accuracy.

  ### Advice for Your Novel

  You mentioned this bears on how you render a sympathetic character. The lesson from these monuments is this: **Sympathy is not exoneration.**

  Your readers, like your townspeople, are struggling with the "Causality Test." They want to know if the good work *required* the bad behavior.
  *   If your character's greatness was *built* on their cruelty (the Industrialist), they cannot be the hero of a civic story, though they can be the protagonist of a tragedy.
  *   If your character's greatness was *despite* their cruelty (the Novelist), you must show the cost of that cruelty to others. You cannot hide the letters.

  The most honest historical fiction does not ask the reader to forgive the monument. It asks the reader to understand why the monument was built, why it was tolerated, and what it costs to take it down. Your uncertainty is not a weakness; it is the subject matter. Write the wobble.
