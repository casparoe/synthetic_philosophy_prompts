      *   The key distinction is **Independent Testability** (or Novel Prediction) vs. **Accommodation**.
      *   Neptune wasn't just a parameter tweak; it was a *new entity* with *independent consequences* (gravity, position, later mass, later photos). Epicycles were mathematical devices without physical mechanism until very late, and they didn't predict *new kinds* of phenomena, just retrofitted old positions.
