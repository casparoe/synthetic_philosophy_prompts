          4.  Epicycles are the same trick as Neptune. (Equivalence Claim)
          5.  There's no principled line between "good" and "bad" auxiliaries (No Demarcation).
          *   **Conclusion:** Theories are never refuted by facts; they die due to sociology (boredom/funding). Ptolemaic astronomy could rationally continue today.
      *   **The User's Constraint:** Wants to keep (1) and (2). Suspects (3), (4), or (5) is the weak link. Wants to know *which* step to reject and *what the cost is* (philosophical price).
      *   **The Goal:** Provide a robust counter-argument that validates the user's intuition (that the uncle is pushing too far) without denying the logical validity of (1) or the historical success of (2).

  2.  **Deconstruct the Uncle's Philosophy:**
      *   This is essentially *radical conventionalism* or *instrumentalism*. It echoes Pierre Duhem, W.V.O. Quine, and later Paul Feyerabend ("Anything Goes").
      *   The core tension is between *logical possibility* (can you construct a model?) and *scientific rationality* (should you accept that model?).
      *   The uncle conflates *logical consistency* with *scientific virtue*.

  3.  **Evaluate the Steps for Rejection:**

      *   **Step (1):** "Predictions come from T+A." This is the Duhem-Quine thesis. It's widely accepted in philosophy of science. Rejecting this is hard and unnecessary. The user wants to keep it anyway.
      *   **Step (2):** "Neptune was good science." Hard to deny. User wants to keep it.
      *   **Step (3):** "You can *always* cook up a hidden something." This is logically true (mathematically, you can fit a curve), but scientifically dubious. It assumes *predictive accuracy* is the only metric.
      *   **Step (4):** "Neptune and Epicycles are the same trick." This is the analogy. It fails on *independence* and *explanatory power*.
      *   **Step (5):** "No principled line (no demarcation)." This is the crux. If there *is* a principled line, the argument collapses.

  4.  **Identify the Best Point of Attack:**
