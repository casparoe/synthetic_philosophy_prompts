      *   **Addressing Step (5):** There *is* a line. It's not "ugliness," it's "risk."
      *   **The Cost:** You have to accept that scientific rationality is probabilistic (Bayesian) and methodological, not purely logical. You can't prove the Ptolemaists wrong with logic alone; you prove them wrong by showing their program stopped generating new knowledge.
