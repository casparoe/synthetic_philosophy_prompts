          *   *Conflict:* Standard kin selection theory (Hamilton) explains this via *gene*-level selection (inclusive fitness). The user rejects the "bookkeeping device" view.
          *   *Analysis:* The principle holds (colonies compete), but the *explanation* is debated. Is it colony selection or gene selection via kinship? The user's intuition aligns with "Group Selection" (MLS2), while mainstream biology often prefers "Kin Selection" (Gene eye view). The principle supports the user *if* we accept colonies as Darwinian populations.
      *   **Genomic Imprinting:**
