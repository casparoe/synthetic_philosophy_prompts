  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction on Ants:* I need to be careful not to say Kin Selection is "wrong." It's mathematically equivalent to Group Selection in many models. However, the user's ontological stance (Colonies are real interactors) is defensible (MLS2). I should validate their intuition while noting the equivalence.
      *   *Correction on Biofilms:* Explain *why* they are undecided. It's because the level of selection shifts depending on environmental harshness/dispersal.
