  **(Self-Correction Note):** Wait, regarding the Hitchhiker case. The user says "selection at the whole-genome level." Technically, selection is on the *organism* carrying the genome. The gene is a passenger. This fits. But is it "whole-genome level"? In asexuals, the genome is the unit of heredity. So yes.
