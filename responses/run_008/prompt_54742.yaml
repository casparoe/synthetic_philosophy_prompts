          *   *Principle Check:* Does the gene compete? No, it's linked. Does the genome/organism compete? Yes.
          *   *Analysis:* Fits. Selection is on the linked unit.
      *   **Bacterial Biofilms:**
          *   *User Verdict:* Undecided.
          *   *Principle Check:* Do biofilms compete? Yes. Do cells within compete? Yes (cheaters).
          *   *Analysis:* This is a classic Multilevel Selection case. The outcome depends on the *ratio* of within-group to between-group selection.

      *   **Aging (Good of Species):**
          *   *User Verdict:* Scoffs (Species don't compete).
          *   *Principle Check:* Do species compete? Generally no (extinction is usually stochastic or environmental, not adaptive competition in the short term).
          *   *Analysis:* Fits.

  4.  **Address the "Opposite Directions" Worry:**
      *   *Worry:* Ants (accepting higher level) vs. Aging (rejecting higher level) seem inconsistent.
      *   *Resolution:* The difference is **Heritability** and **Reproduction**.
          *   Colonies *reproduce* (swarm, found new colonies) with *heritability* (queen carries genes, structure often preserved).
          *   Species do not *reproduce* in a way that allows adaptive evolution (speciation is not analogous to organismal reproduction in terms of speed and fidelity for this trait).
          *   *Key Distinction:* Darwinian Properties (Variation, Heredity, Fitness) must exist at the level in question.

  5.  **Refine/Replace the Principle:**
      *   The user's principle ("entities compete") is necessary but not sufficient.
      *   *Better Principle:* **The Lewontin Conditions applied to Levels.** For selection to be "real" at level $L$, entities at level $L$ must exhibit:
          1.  Phenotypic Variation.
          2.  Differential Fitness (Competition).
          3.  **Heritability** (Offspring resemble parents *at that level*).
      *   *Addition:* **Multilevel Selection Framework (Price Equation).** Selection is always happening at multiple levels simultaneously. The "real" level is the one where the net fitness effect aligns with the trait's persistence. It's about the *balance* of forces (within-group vs. between-group).

