answer: |-
  **Setting:** *A quiet corner of the faculty lounge, late afternoon. Two philosophers, ELENA (Intellectualist) and MARCUS (Anti-Intellectualist), are finishing a conference session on the philosophy of action.*

  **Marcus:** That case study you presented on the paralyzed climber was compelling, Elena, but I want to press you on a harder variation. Consider a concert pianist. Let's call her Anna. Anna develops severe stage fright. In performance, she freezes. Her fingers lock up; she cannot execute the repertoire. Yet, in the studio, she teaches masterclasses. She demonstrates technique at half-tempo. She can articulate, in precise propositional detail, the exact wrist angle, pedal timing, and harmonic shaping required for every phrase of the Rachmaninoff. Does Anna still know how to play the piano?

  **Elena:** Yes, unequivocally. On the Stanley and Williamson view, knowing how to play is a species of knowing that. Anna knows, of various ways $w$, that $w$ is a way to play the Rachmaninoff. She possesses the propositional knowledge of the technique. The stage fright is a performance error, a failure of *ability*, not a loss of *knowledge*.

  **Marcus:** But this is precisely where Ryle would dig his heels in. If the intelligence is not manifest in the successful, fluid execution of the act, in what sense is it *practical* knowledge? You are conflating knowing how with merely knowing that. If I read every manual on aerodynamics and can recite the physics of lift, I know *that* a plane flies. I do not know *how* to fly it. Anna sounds like a musicologist who has internalized the theory of performance without the capacity to perform.

  **Elena:** That analogy fails because Anna *did* play. She isn't a theorist; she is a blocked expert. Consider the paralyzed skier in our literature. If a skilled skier breaks her legs, she retains the knowledge of how to ski, even if she lacks the physical ability. She can still instruct, visualize, and identify correct forms. Anna's stage fright is a psychological paralysis. It interrupts the causal chain between her knowledge and the world, but it doesn't erase the knowledge state itself. She grasps the ways to play under a *practical mode of presentation*.

  **Marcus:** I grant you the paralyzed skier case involves physical impossibility. But Anna's case is different. She can move her fingers; she demonstrates at half-tempo. The blockage is specific to the *context of performance*. This suggests her knowledge is context-dependent. Ryle argued that know-how is a disposition—a complex bundle of capacities to act successfully in relevant situations. If the disposition fails in the paradigmatic situation (the concert), the disposition is degraded.

  Furthermore, consider the difference between Anna and a novice. If a novice learns the propositions Anna recites—"rotate the wrist thirty degrees," "anticipate the downbeat"—does the novice know how to play?

  **Elena:** No, because the novice lacks the grasp of those propositions under the practical mode. They might know them theoretically. Anna, having once mastered the skill, retains the practical grasp. She understands the propositions *as a guide to action*, even if the action is currently inhibited. The knowledge is the same; the execution conditions have changed.

  **Marcus:** But how do we verify the "practical mode" other than through successful execution? This is the regress problem in new clothing. If the knowledge is distinct from the ability, what makes it *practical* knowledge rather than *theoretical* knowledge about practice?

  Here is my strongest objection: Think about the phenomenon of "choking" in experts. When an expert pianist starts focusing on the explicit propositions of their technique—the very propositions you say constitute their knowledge—their fluency degrades. Explicit instruction helps novices but often cripples experts. If know-how *were* propositional knowledge, accessing those propositions should enhance or stabilize performance. Instead, articulating the "ways" disrupts the "how." This suggests the knowledge-how is embedded in the competence itself, not in a separate propositional storehouse that the competence draws upon.

  **Elena:** That is a formidable point, Marcus, but Intellectualism can accommodate it. The expert does not lose the propositional knowledge when they choke; rather, they shift the *mode of access*. In flow, they access the propositions under a practical, non-reflective mode. When they choke, they shift to a theoretical, reflective mode of access regarding those same propositions. They start treating their own actions as objects of theoretical scrutiny.

  So, regarding Anna: She retains the knowledge under the practical mode, which is why she can teach and demonstrate at half-tempo. The stage fright forces a shift in her performance context that triggers a theoretical monitoring mode, which inhibits the motor output. But the underlying knowledge state—that $w$ is a way to play—remains intact.

  **Marcus:** You're positing a very elusive entity. A proposition that is known "practically" but cannot be acted upon in the primary context for which it exists. Let's probe the teaching aspect. You say she teaches masterclasses. When she corrects a student, she is engaging in a practice. She knows how to *teach*. But does she know how to *play*?

  If I meet someone who claims to know how to swim, but they sink like a stone the moment they enter deep water, yet they can accurately describe the stroke mechanics on dry land, I would say they *used* to know how, or they know the theory of swimming. I wouldn't say they currently know how. To say Anna knows how to play the piano is to stretch the concept until it breaks. It severs the conceptual link between intelligence and action.

  **Elena:** But why must the link be unbreakable? We routinely distinguish between having the knowledge and having the opportunity or capacity to exercise it. If Anna's hands were tied, you'd agree she knows how. If her mind is tied by fear, why is it different? The propositional content is identical. She knows that a certain wrist motion is the way to produce the tone. The fact that fear prevents the motion doesn't make the knowledge false.

  **Marcus:** Because the "way" isn't just a description; it's a capacity to navigate contingencies. In a concert, the contingencies include the pressure, the acoustics, the adrenaline. Anna cannot navigate those. She can only navigate the sanitized environment of the studio.

  Let's return to the novice. If the novice memorizes Anna's instructions, they have the propositions. Anna has the propositions *plus* the muscle memory. You want to say the muscle memory is just "ability," separate from "knowledge." I am saying the muscle memory *is part of the knowledge*. It is the embodied understanding. When Anna freezes, that embodied understanding is disconnected. She has the map, but she has lost the terrain. To say she knows how to traverse the terrain because she has the map is to ignore that "knowing how to traverse" implies actually being able to walk.

  **Elena:** I think we are circling the definition of "ability." You define it as successful execution. I define it as the possession of the correct informational state, barring external or internal blockers.

  Consider this: If Anna undergoes therapy and cures the stage fright, she plays perfectly immediately. She doesn't need to relearn the technique. If she had truly lost the knowledge-how, she would need to re-acquire the skill. Since she doesn't, the knowledge persisted through the period of inability. The simplest explanation is that the knowledge was there all along, merely masked.

  **Marcus:** I concede she retains a *disposition* that allows for rapid reacquisition. But is that disposition knowledge? Or is it a latent capacity?

  Here is the crux: If Intellectualism is true, then a perfect simulation of Anna's propositional knowledge by an AI should mean the AI knows how to play. If I program a robot with every rule Anna articulates, does it know how to play?

  **Elena:** Only if it can instantiate those rules under a practical mode of presentation. If it merely processes the data theoretically, no.

  **Marcus:** But how do we tell the difference? If the robot freezes under pressure, just like Anna, does it lack the knowledge? Or just the ability? If you say "just the ability," then "knowledge-how" becomes a label for a state that has no necessary connection to success. That renders the concept of "knowledge-how" useless for explaining why experts succeed where novices fail.

  **Elena:** It explains it perfectly. Experts succeed because they possess the knowledge *and* the ability to execute it. Novices lack the knowledge. Anna is an edge case where the ability is temporarily decoupled. This decoupling is rare, which is why our intuitions waver. But we must follow the metaphysics. Knowledge is a relation to a proposition. Anna stands in that relation. Therefore, she knows.

  **Marcus:** And I say knowledge-how is not a relation to a proposition; it is a quality of the agent's engagement with the world. Ryle warned us against the "intellectualist legend"—the idea that intelligent action must be preceded by an internal operation of contemplating a rule. Anna's teaching might look like she is contemplating rules, but her playing, when it worked, was rule-free intelligence. Now that she can't play, she has retreated to the legend. She has regressed to knowing-that. She is no longer a knower-how; she is a theorist of her own former skill.

  **Elena:** But she demonstrates at half-tempo, Marcus. That is action. It is intelligent action.

  **Marcus:** It is fragmented action. It is action in a vacuum. It is the difference between a general who can plan a battle perfectly on a map but panics when the shooting starts, and a general who wins. We might say the first general knows strategy *theoretically*. We reserve "knows how to command" for the one who can handle the chaos. Anna cannot handle the chaos of the concert hall. Therefore, she does not know how to perform.

  **Elena:** Then we simply disagree on the scope of "know how." I include the instructional and demonstrative capacity as sufficient evidence of the propositional grasp that constitutes the knowledge. You require the full-performance capacity. But if you require that, you cannot explain the paralyzed skier.

  **Marcus:** I can. The paralyzed skier knows how to ski in the sense that she retains the *capacity* which, were her legs healed, would constitute the knowledge. But strictly speaking, while paralyzed, she lacks the full disposition. We speak loosely when we say she "knows how." We mean she "has the knowledge component of the skill." But strictly? Know-how is the union of the understanding and the capacity.

  **Elena:** And there we have it. You see the union as constitutive; I see the capacity as contingent.

  **Marcus:** Precisely. If the capacity goes, the intelligence vanishes from the world. It becomes a ghost in the machine.

  **Elena:** And if the capacity goes, but the guidance system remains, the intelligence remains. It is simply grounded. Anna is grounded, Marcus, but she is not ignorant.

  **Marcus:** She is practically ignorant. And in the realm of action, that is the only kind that matters.

  **Elena:** Then we shall have to agree that the pianist sits in the silence between us, knowing that she knows, but unable to show us who is right.

  **Marcus:** *Smiles.* A fittingly unresolved cadence. Coffee?

  **Elena:** I know how to make it. And luckily, my hands don't shake.

  **Marcus:** Let's hope your propositional knowledge of the grind size suffices. I'll be judging the result.
