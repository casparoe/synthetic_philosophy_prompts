prompt: |-
  I am the research integrity officer at a large research university, and several times a year I have to adjudicate disputes about the ownership of ideas — not text plagiarism, which our software and policies handle, but the murkier category where one researcher claims another used an idea they originated: a graduate student who sketched a research direction at a lab meeting and later saw it as the centerpiece of the supervisor's grant; a postdoc who heard a talk, decided the speaker had abandoned the idea, and published first; two collaborators who each insist the key move in a joint paper was theirs. My sanctions committee consists of scientists and an administrator, none of them trained in philosophy, and they want something they can actually apply rather than hand-wave about academic norms.

  I want you to build me a decision procedure grounded in what the philosophy of intellectual property actually says, translated into something my committee can run. I take it the relevant raw material includes the labor-desert view that effort confers a claim, the personality view that ideas are expressions of the self, the utilitarian view that idea-ownership is justified only by incentives, the fact that ideas are non-rival in a way land and objects are not, and the Lockean proviso that appropriation is legitimate only if it leaves enough and as good for others — but you should decide what belongs in the procedure and what to leave in the seminar room. What interests me especially, and where I suspect the philosophy has real work to do, are the distinctions the disputes actually turn on: between a problem, an approach, and a worked result — I want to know whether claiming a problem is different in kind from claiming a route into it; between originating an idea and being merely its first audience; and between cases where the hearer would have got there independently anyway and cases where they took something they could not have supplied themselves. If the utilitarian and labor-desert strands of the philosophy pull in different directions on any of these, the procedure should say so rather than papering over it.

  Please write the procedure with these constraints: it must be usable by a non-philosopher committee over the course of a two-hour meeting plus a few days of document review; it should pose its questions in a fixed order, say what counts as a sufficient answer to each, mark the points where the procedure must stop and hand the question to human judgment because it is a question of values rather than facts, and be honest about where it is philosophy dressed up as a flowchart. Then run it on three cases: first, a graduate student who raised an unformed idea in a lab meeting and eight months later found it as the central aim of the supervisor's grant application, with no acknowledgment; second, two researchers in different countries who published near-identical results within months of each other, where there is no evidence of contact but one of them did attend a conference the other spoke at; third, a journal referee who declined a manuscript and then published a paper using its framing, citing the rejected manuscript only in a footnote. Include at least one case where the procedure delivers an answer I am not going to like, and say so plainly. Finally, tell me what the procedure cannot do: the classes of dispute it should never be applied to, and the places where I should just accept that what looks like theft of an idea is the ordinary, ungovernable traffic of a research community.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Research Integrity Officer (RIO) at a large research university.
      *   **Task:** Create a decision procedure for adjudicating disputes over *idea ownership* (not text plagiarism).
      *   **Target Audience:** Sanctions Committee (scientists + administrator, no philosophy training).
      *   **Constraints:**
          *   Usable in a 2-hour meeting + few days review.
          *   Fixed order of questions.
          *   Define sufficient answers.
          *   Mark points requiring human judgment (values vs. facts).
          *   Be honest about philosophical underpinnings (where it's philosophy dressed as a flowchart).
          *   Address specific distinctions: Problem vs. Approach vs. Result; Originator vs. Audience; Independent Discovery vs. Derivation.
          *   Acknowledge conflicts between utilitarian and labor-desert views.
          *   Run the procedure on three specific cases (Grad Student/Supervisor, Independent/Simultaneous Discovery, Referee Misconduct).
          *   Include at least one outcome the user won't like (and admit it).
          *   Define limitations (where *not* to use it).
      *   **Philosophical Grounding:** Labor-desert, Personality, Utilitarian/Incentive, Non-rivalry, Lockean Proviso.

  2.  **Deconstruct the Philosophy for Practical Application:**
      *   *Labor-Desert (Locke):* You own what you mix your labor with. *Practical translation:* Who did the work to flesh out the idea?
      *   *Personality (Hegel):* Ideas are extensions of the self. *Practical translation:* Is this idea uniquely tied to this person's intellectual identity? (Hard to prove, maybe downplay for a rubric).
      *   *Utilitarian (Incentives):* Ownership exists to promote progress. *Practical translation:* Does assigning ownership here encourage future innovation or stifle it?
      *   *Non-Rivalry:* My use doesn't stop yours. *Practical translation:* Is exclusive ownership actually necessary, or is attribution enough?
      *   *Lockean Proviso:* Leave "enough and as good." *Practical translation:* Does this claim block others from working in the field?

      *Decision:* For a committee of scientists, *Labor-Desert* and *Utilitarian* are the most actionable. *Personality* is too subjective. *Non-Rivalry* suggests attribution over ownership. *Proviso* is a check on overreach.

  3.  **Drafting the Procedure (The "IDEA-Adjudication Protocol"):**
      *   Need a step-by-step flow.
      *   *Step 1: Categorization.* Is it a Problem, Approach, or Result? (Crucial distinction requested).
      *   *Step 2: Transmission.* Was there contact? (Originator vs. Audience).
      *   *Step 3: Labor/Development.* Who did the work? (Lockean labor).
      *   *Step 4: Independence.* Could the accused have gotten there alone? (Counterfactual).
      *   *Step 5: Harm/Incentive.* What is the impact on the field? (Utilitarian).
      *   *Stop Points:* Where values override facts.

  4.  **Refining the Questions (Making them "Committee-Ready"):**
      *   Avoid jargon. Use "Specificity" instead of "Individuation." Use "Development Effort" instead of "Lockean Labor."
      *   Ensure the "Philosophy dressed as flowchart" moments are flagged.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Grad Student vs. Supervisor):* Classic power dynamic. Idea was "unformed." Supervisor added labor. *Likely outcome:* Student gets attribution, Supervisor keeps grant. *Uncomfortable truth:* Ideas alone aren't property.
      *   *Case 2 (Independent/Simultaneous):* Conference attendance but no contact. *Likely outcome:* No misconduct. *Philosophical tension:* Utilitarianism says let both publish to encourage speed; Labor says neither stole.
      *   *Case 3 (Referee):* Clear breach of trust. *Likely outcome:* Misconduct. *Why:* Confidentiality creates a specific obligation overriding general idea non-ownership.

      *Constraint Check:* I need one outcome the RIO won't like.
      *   *Idea:* Case 1 is usually the most painful. RIOs want to protect students. But philosophy says an unformed idea + no labor = weak claim. I will make the procedure rule *against* the student on ownership, granting only attribution. This is honest but unpopular.
      *   *Alternative:* Case 2. If I rule that attending a conference creates a "constructive notice" that bars independent discovery, that's too harsh.
      *   *Decision:* I will make Case 1 the "uncomfortable" one. The procedure will likely find no *theft* of property, only a failure of *citation norm*. This distinguishes between "misconduct" and "rudeness."

  6.  **Writing the Limitations Section:**
      *   Where does this fail?
      *   Tacit knowledge.
      *   General field direction.
      *   "Spirit of the idea" vs. execution.
      *   Power dynamics (the procedure can't fix hierarchy).

  7.  **Review against Constraints:**
      *   2-hour meeting feasible? Yes, if document review is pre-done.
      *   Fixed order? Yes.
      *   Sufficient answers defined? Yes.
      *   Value judgments marked? Yes.
      *   Philosophy acknowledged? Yes.
      *   Three cases run? Yes.
      *   Uncomfortable outcome included? Yes.
      *   Limitations defined? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, authoritative, yet humble about the limits of adjudication.
      *   Structure: Introduction -> The Protocol -> The Test Cases -> Limitations.
      *   Ensure the distinction between Problem/Approach/Result is central to Step 1.

  **(Self-Correction during drafting):** I initially thought about giving the student in Case 1 full ownership. But the prompt asks for grounding in philosophy. Lockean labor suggests the supervisor who wrote the grant and fleshed out the methodology did the "mixing of labor." The student had the "spark." Utilitarianism suggests giving the grant to the one who can execute (supervisor). So, the "uncomfortable" truth is that the student was wronged ethically (acknowledgment) but not necessarily in terms of property rights (ownership). I must make sure the procedure distinguishes *Attribution* from *Ownership*.

  Let's refine the "Philosophy dressed as flowchart" markers. I need to explicitly state, "Here we are prioritizing Utilitarianism over Labor-Desert."

  Let's finalize the structure.
  1. Preamble (Scope & Philosophy).
  2. The Protocol (5 Steps).
  3. Application to Cases.
  4. Limitations.

  Okay, ready to write.
answer: |-
  # The Idea Adjudication Protocol (IAP)
  **Version 1.0 | For Use by Research Integrity Committees**

  ## Preamble: Scope and Philosophical Commitments
  This procedure is designed to adjudicate disputes regarding the *ownership of ideas*, distinct from text plagiarism or data fabrication. It is not a legal tool but an ethical rubric grounded in three philosophical traditions:
  1.  **Labor-Desert:** Claims are strengthened by the work done to develop an idea, not merely by conceiving it.
  2.  **Utilitarianism:** Ownership is assigned to maximize future research output and incentives.
  3.  **Lockean Proviso:** Claims cannot monopolize a general field of inquiry to the exclusion of others.

  **Note to the Committee:** This protocol treats ideas as *non-rival goods*. Unlike a stolen laptop, an idea can be held by two people simultaneously. Therefore, the default remedy is **attribution**, not **exclusion**, unless specific conditions (detailed below) are met.

  **Time Budget:**
  *   **Pre-Meeting:** Document review (emails, lab notebooks, grant drafts, timestamps).
  *   **Meeting:** 120 minutes maximum.
  *   **Decision:** Majority vote required at Step 5.

  ---

  ## The Procedure

  ### Step 1: Categorize the "Idea"
  *Philosophical Grounding:* Ideas exist at different levels of specificity. Lockean labor applies differently to a vague wish versus a engineered solution.
  *   **Type A (Problem):** A general question or goal (e.g., "We should study protein X in context Y").
  *   **Type B (Approach):** A specific methodology or theoretical route to solve the problem (e.g., "Use CRISPR-Cas9 to edit region Z").
  *   **Type C (Worked Result):** A concrete finding, derivation, or dataset ready for publication.

  **Question 1.1:** *Is the disputed item Type A, B, or C?*
  *   **Sufficient Answer:** Consensus on classification based on written evidence.
  *   **Stop Point:** If Type A (Problem), proceed to **Step 4** (skip labor analysis). *Reasoning:* Problems are generally non-ownable public goods; claiming ownership violates the Lockean Proviso.
  *   **Stop Point:** If Type C (Worked Result), proceed to **Step 2**. *Reasoning:* Results imply significant labor investment.
  *   **Stop Point:** If Type B (Approach), proceed to **Step 2**.

  ### Step 2: Establish Transmission and Access
  *Philosophical Grounding:* You cannot steal what you did not encounter. This establishes the causal link required for a misconduct finding.
  *   **Question 2.1:** *Is there evidence the Accused had access to the Claimant's idea prior to their own work?*
      *   **Sufficient Answer:** Emails, meeting minutes, witness testimony, or confidential access (e.g., referee, grant review).
      *   **If NO:** **VERDICT: No Misconduct.** (Proceed to Step 5 only to determine if voluntary attribution is warranted). *Reasoning:* Independent discovery is a valid defense in both Utilitarian and Labor frameworks.
      *   **If YES:** Proceed to Question 2.2.
  *   **Question 2.2:** *Was the access confidential or privileged?* (e.g., peer review, private lab meeting vs. public conference talk).
      *   **If YES (Confidential):** **VERDICT: Misconduct.** (Skip to Remedy). *Reasoning:* Confidentiality creates a contractual/ethical duty overriding general idea non-ownership.
      *   **If NO (Public/Semi-Public):** Proceed to **Step 3**.

  ### Step 3: Assess Labor and Development (The "Lockean Test")
  *Philosophical Grounding:* Labor-Desert Theory. Mere conception confers a weak claim; development confers a strong claim.
  *   **Question 3.1:** *Who performed the labor required to transform the idea from its state at Transmission to its state at Publication/Application?*
      *   **Sufficient Answer:** Compare the specificity of the idea at the time of the meeting/talk vs. the final output. Who did the math? Who wrote the code? Who designed the specific experiment?
      *   **If Accused did the majority of development:** The Accused holds the primary ownership claim.
      *   **If Claimant provided a detailed blueprint that Accused merely executed:** The Claimant holds the primary ownership claim.
      *   **If Joint/Unclear:** Proceed to **Step 4**.

  ### Step 4: Assess Independence and Necessity (The "Counterfactual Test")
  *Philosophical Grounding:* Utilitarianism and Causality. Would the research have happened anyway?
  *   **Question 4.1:** *Is there evidence the Accused was already working on this trajectory independently?*
      *   **Sufficient Answer:** Lab notebooks or drafts predating the Transmission event.
      *   **If YES:** **VERDICT: No Misconduct.** (Attribution may still be offered as a courtesy).
  *   **Question 4.2:** *Was the idea "in the air" (common knowledge in the sub-field)?*
      *   **Sufficient Answer:** Can the Committee identify 2-3 other groups working on the same specific approach at the same time?
      *   **If YES:** **VERDICT: No Misconduct.** *Reasoning:* Lockean Proviso. You cannot fence off a commons that others are already tilling.
      *   **If NO:** Proceed to **Step 5**.

  ### Step 5: The Value Judgment (Remedy and Sanction)
  *Philosophical Grounding:* **WARNING: This is philosophy dressed as a flowchart.** Here, Labor-Desert and Utilitarianism may conflict. The Committee must vote.
  *   **Conflict Check:**
      *   *Labor-Desert says:* The Claimant had the spark; they deserve ownership.
      *   *Utilitarianism says:* The Accused executed the work; giving ownership to the Claimant disincentivizes execution.
  *   **Question 5.1:** *Does assigning ownership to the Claimant inhibit the field's progress?*
      *   **If YES:** Prioritize Utilitarianism. Remedy = **Attribution only** (citation, acknowledgment).
      *   **If NO:** Prioritize Labor-Desert. Remedy = **Shared Ownership** (co-authorship, shared IP).
  *   **Question 5.2:** *Is the harm reputational or financial?*
      *   **If Financial (Grant/Patent):** High bar for Claimant. Must prove Step 3 (Labor).
      *   **If Reputational (Priority/Citation):** Lower bar. Proof of Step 2 (Transmission) is often sufficient for attribution.

  ---

  ## Application to Test Cases

  ### Case 1: The Graduate Student vs. The Supervisor
  *Scenario:* Student sketches unformed idea in lab meeting. 8 months later, Supervisor uses it as central aim of grant application. No acknowledgment.
  *   **Step 1 (Categorize):** **Type A (Problem).** The idea was "unformed." It was a research direction, not a method or result.
      *   *Protocol Action:* Skip to Step 4.
  *   **Step 4 (Independence/Proviso):** Could others work on this? Yes. It is a general direction.
      *   *Protocol Action:* Move to Step 5.
  *   **Step 5 (Value Judgment):**
      *   *Labor:* Student had the spark; Supervisor did the labor of writing the grant and fleshing out the aims (mixing labor).
      *   *Utilitarian:* Giving the grant ownership to the student (who lacks track record) might reduce funding success (bad for field).
      *   *Verdict:* **No Misconduct regarding Ownership.**
      *   *Remedy:* **Mandatory Attribution.** The grant must acknowledge the student's conceptual contribution in the "Preliminary Studies" or "Acknowledgments" section.
      *   **The Uncomfortable Truth:** The Committee will likely have to tell the student: *"You were wronged ethically, but you do not own the idea."* An unformed problem is not property. The Supervisor committed a norm violation (rudeness/exploitation), not theft. This outcome prioritizes the Lockean labor of grant-writing over the "spark" of conception.

  ### Case 2: The Simultaneous Discovery (Conference Attendee)
  *Scenario:* Two researchers, different countries. Near-identical results. Researcher B attended Researcher A's conference talk 6 months prior. No direct contact.
  *   **Step 1 (Categorize):** **Type C (Worked Result).** Published results imply high specificity.
  *   **Step 2 (Transmission):** Access = Yes (Public talk). Confidential = No.
      *   *Protocol Action:* Proceed to Step 3.
  *   **Step 3 (Labor):** Both performed independent labor to reach the result.
      *   *Protocol Action:* Proceed to Step 4.
  *   **Step 4 (Independence):** Researcher B claims independent derivation.
      *   *Protocol Action:* Check for "In the Air." If the talk revealed the *result*, B cannot claim independent discovery of the *result* if they heard it. However, if the talk revealed only the *problem*, B owns their *solution*.
      *   *Refinement:* Assuming B heard the *approach* but did the work themselves.
      *   *Verdict:* **No Misconduct.**
      *   *Remedy:* **Voluntary Citation.** B should cite A's talk as "inspiration" or "related work," but A cannot claim B's paper.
      *   *Reasoning:* Utilitarianism favors rapid publication by both. Non-rivalry means B's publication does not steal A's. Unless B copied text/data, hearing an idea at a conference does not confer a monopoly to the speaker.

  ### Case 3: The Referee
  *Scenario:* Referee declines manuscript, publishes paper using its framing, cites rejected manuscript only in footnote.
  *   **Step 1 (Categorize):** **Type B/C (Approach/Result).** Framing implies specific theoretical structure.
  *   **Step 2 (Transmission):** Access = Yes. Confidential = **YES.**
      *   *Protocol Action:* **VERDICT: MISCONDUCT.**
      *   *Stop Point:* The procedure halts here.
      *   *Reasoning:* Confidentiality creates a fiduciary duty. The Lockean Proviso and Utilitarian arguments are suspended because the "social contract" of peer review was breached.
      *   *Remedy:* Retraction of Referee's paper or forced co-authorship (depending on journal policy), plus sanction on Referee.
      *   *Note:* This is the clearest case. The "idea" becomes property via the confidentiality agreement, not via labor.

  ---

  ## Limitations: Where This Procedure Must Not Be Used

  As the Research Integrity Officer, you must recognize that this flowchart cannot govern the entire ecosystem of academic exchange. Do not apply the IAP in the following contexts:

  **1. The "Spirit of the Field" Disputes**
  If a senior researcher publishes a review paper that defines a new sub-field, and a junior researcher claims they "invented the field" in a casual conversation, do not use this procedure. This is a dispute about *status*, not property. The IAP requires specific transmission of specific ideas. General intellectual influence is ungovernable.

  **2. Tacit Knowledge and "Lab Culture"**
  If a student claims a supervisor stole their "way of thinking" or "experimental intuition," the IAP will fail. Step 1 (Categorization) will be impossible. These are disputes about mentorship boundaries, not idea ownership. Route these to the Ombuds office, not the Sanctions Committee.

  **3. The "Inevitable Discovery" Gray Zone**
  In fast-moving fields (e.g., AI, genomics), ideas are often simultaneous. If the IAP yields a "No Misconduct" verdict because the idea was "in the air" (Step 4.2), but the Claimant feels robbed of priority, accept that **science is a race.** The procedure protects against theft, not against losing a race. Do not allow the IAP to be used to retroactively award priority prizes.

  **4. Power Dynamics**
  The IAP assumes equal footing in Step 5 (Value Judgment). It does not account for coercion. If a Supervisor forces a Student to give up credit, that is harassment, not idea theft. The IAP analyzes the *idea*; it does not analyze the *relationship*. If coercion is alleged, switch to HR/Misconduct protocols regarding workplace behavior, not intellectual property.

  ## Final Note to the Committee
  This procedure will not make everyone happy. It is designed to distinguish between **theft** (which requires sanction) and **unacknowledged influence** (which requires cultural correction). In Case 1 (Student/Supervisor), you will likely find that the Student has a moral claim but not a property claim. You must be prepared to explain that distinction clearly: *We can censure the Supervisor for failing to cite the Student's contribution without declaring that the Student owned the Grant.* This preserves the incentive to execute (Utilitarian) while punishing the failure to attribute (Normative).
