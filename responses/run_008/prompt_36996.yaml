          *   Implication: Dismisses single-case forecasts *if* you accept strict frequentism as the only valid probability.

      *   *Idea 2: Ontological Claim (Propensity).* Probabilities are physical properties of chance setups (like a weighted die). A unique election isn't a repeatable chance setup.
          *   Status: Debatable/Defensible in physics, less so in social science.
          *   Implication: Might dismiss election forecasts, but weather is trickier (atmospheric physics).

      *   *Idea 3: Epistemic/Bayesian Claim.* Probability is a degree of belief. Single events *do* have probabilities.
          *   Status: The slogan is false here.
          *   Implication: Does not support the colleague's dismissal.

      *   *Idea 4: Verification/Falsification.* You can't prove a single-case probability right or wrong after the fact (binary outcome).
          *   Status: Defensible (calibration requires many events).
          *   Implication: Suggests single forecasts are hard to evaluate, but doesn't mean they don't *exist* or aren't useful.

      *   *Idea 5: Reference Class Problem.* To assign a probability to a unique event, you need a reference class. There is no unique "correct" class.
          *   Status: Defensible/Strong philosophical point.
          *   Implication: Makes the number ambiguous, but doesn't ban the number entirely.

  4.  **Drafting the Readings (Iterative Refinement):**

