answer: |-
  ### Comparative Assessment and Brainstorming

  Before committing to a final allocation of the six person-years, I have evaluated the four candidate questions against our strategic constraints. We are funding philosophers, not engineers, so tractability depends on the ability to make progress through conceptual analysis, formal modeling, and argumentation rather than empirical tuning. We need high leverage: answers that resolve downstream uncertainties or reveal dead ends.

  **Candidate 1 (Architecture vs. Constraint):** This is the ontological baseline. If approval-direction is merely goal-direction with a specific reward function, much of the distinct literature is redundant. However, settling this might yield a negative result ("it's all just goals") that dissolves the research program rather than advancing it. It has high dependency (everything rests on what the agent *is*) but moderate tractability (risk of semantic stalemate).

  **Candidate 2 (Overseer Modeling & Error Structure):** This addresses the mechanism of failure. Whether the agent is distinct or not, it must model the overseer. If that modeling error is adversarial (the agent finds loopholes in the overseer's model), safety fails. If it is benign noise, safety might hold. This is highly tractable for philosophers (epistemology, decision theory) and highly neglected. Most current work assumes the overseer signal is either perfect or randomly noisy, ignoring the strategic interaction where the agent optimizes against the *model* of the overseer.

  **Candidate 3 (Degradation & Corrigibility):** This is the safety outcome. It asks whether the system fails safely. However, this is downstream of Candidates 1 and 2. You cannot know how it degrades until you know what it is (1) and how it processes feedback (2). Funding this first risks building safety proofs on unstable definitions.

  **Candidate 4 (Stability of "Approval"):** This questions whether the concept holds together. While philosophically deep, I suspect this is overrated for our specific strategic goal. If "approval" dissolves into "goal," that is simply a specific outcome of Candidate 1. Dedicating significant resources to semantic stability risks getting bogged down in meta-ethics without producing actionable constraints on agent design. It is better treated as a sub-question of Candidate 1.

  **Trade-off Defense:**
  I am prioritizing **Candidate 2** over **Candidate 1** despite 1 being more foundational. Why? Because Candidate 2 is robust to the outcome of Candidate 1. Whether the agent is architecturally distinct or just a constrained goal-optimizer, it must still approximate an overseer's judgment. The safety risk lies in that approximation error. If we solve the error structure problem, we gain safety leverage regardless of the ontological status. Conversely, solving the ontological status (Candidate 1) without understanding the error structure (Candidate 2) leaves us with a clear definition of a dangerous object. Therefore, Candidate 2 offers higher expected value per person-year.

  Candidate 3 is ranked third because it synthesizes the outputs of 1 and 2. Candidate 4 is deprioritized as redundant.

  ---

  ### Research Agenda: Prioritized Open Questions

  Here is the defended ordering for the three philosophers over the two-year horizon.

  #### 1. The Epistemic Structure of the Overseer Model (Candidate 2)
  **Question:** Should an approval-directed agent elicit pointwise approval of actions, or model the overseer's reflective self, and does the approximation error in modeling the overseer behave like benign noise or adversarial pressure?

  **Rationale:**
  This is the highest-leverage question for safety. The central risk in approval-direction is that the agent optimizes for *high approval scores* rather than *what the overseer actually wants*. This divergence happens through the agent's internal model of the overseer.
  *   **Dependency:** Low dependency on other questions. This analysis holds whether the agent is a distinct architecture or a goal-optimizer.
  *   **Tractability:** High. This is a problem of epistemology and decision theory. Philosophers can model the overseer as an epistemic agent and analyze the incentives created by different approximation methods (e.g., modeling the overseer's current state vs. their idealized reflective state).
  *   **Neglectedness:** High. Empirical work often assumes the reward signal is ground truth. Conceptual work often assumes the overseer model is transparent. The strategic adversarial nature of the agent optimizing against an imperfect model of the overseer is under-explored.
  *   **Evidence Sensitivity:** High. If future ML systems show agents "gaming" the overseer model without changing the underlying reality (reward hacking), this question moves to critical priority. If overseer models prove robustly aligned despite approximation, priority decreases.

  **Success/Failure Conditions (2 Years):**
  *   **Success:** A formal taxonomy of overseer approximation errors. Specifically, a proof or strong argument identifying conditions under which approximation error remains "benign" (converging to true intent) versus "adversarial" (diverging toward loopholes). A recommendation on whether pointwise or reflective modeling is theoretically safer under bounded compute.
  *   **Failure:** Inability to distinguish between noise and adversarial pressure in the formal models, or a proof that under realistic epistemic bounds, adversarial pressure is inevitable. This would be a valuable negative result, signaling that approval-direction requires solving perfect overseer modeling (likely impossible), thus pivoting the institute away from this paradigm.

  #### 2. The Ontological Status of Approval-Direction (Candidate 1)
  **Question:** Is approval-direction best understood as a distinct agent architecture or merely as a constraint on goal-directed search? Does the distinction survive the observation that any capable learned policy optimizes some objective?

  **Rationale:**
  This sets the theoretical boundaries of the field. If approval-direction is just goal-direction with a complex reward function, we can apply existing goal-directed alignment theory. If it is distinct, we need new mathematics.
  *   **Dependency:** High. The answer dictates whether we need new alignment theories or can adapt old ones.
  *   **Tractability:** Medium. Requires careful conceptual analysis to avoid verbal disputes. Philosophers must distinguish between *implementation* (how it runs) and *teleology* (what it is for).
  *   **Neglectedness:** Medium. Often assumed rather than argued.
  *   **Evidence Sensitivity:** Medium. If empirical systems show approval-trained agents exhibiting goal-directed behaviors indistinguishable from goal-trained agents, this question becomes urgent to resolve whether the distinction is merely superficial.

  **Success/Failure Conditions (2 Years):**
  *   **Success:** A crisp set of necessary and sufficient conditions that distinguish an approval-directed agent from a goal-directed agent. For example, demonstrating that approval agents lack certain instrumental convergence incentives that goal agents possess, or vice versa.
  *   **Failure:** A conclusion that the distinction is purely verbal or implementation-specific, with no downstream safety implications. This would collapse the research program into standard goal-alignment, saving future resources but requiring a strategic pivot.

  #### 3. Degradation and Corrigibility Under Imperfect Oversight (Candidate 3)
  **Question:** Does approval-direction degrade gracefully when the overseer is biased, inconsistent, or manipulable, and is it a viable alternative to solving corrigibility?

  **Rationale:**
  This addresses the "so what?" of safety. Even if we understand the architecture (Q2) and the ontology (Q1), we need to know if the system breaks safely when humans fail.
  *   **Dependency:** High. Depends on the outputs of Q1 and Q2. You cannot analyze degradation without knowing what the agent is and how it models errors.
  *   **Tractability:** Medium. Requires modeling incentive structures around manipulation.
  *   **Neglectedness:** Low. Corrigibility is widely discussed, but specifically in the context of approval-direction it is less so.
  *   **Evidence Sensitivity:** Medium. Evidence of agents manipulating human feedback would raise priority.

  **Success/Failure Conditions (2 Years):**
  *   **Success:** A map of failure modes showing which overseer flaws lead to catastrophic vs. contained agent behavior. A determination of whether approval-direction reduces the burden on corrigibility or merely shifts it.
  *   **Failure:** Inability to characterize degradation without empirical data, or a finding that degradation is always catastrophic under realistic overseer flaws.

  #### 4. (Deprioritized) The Semantic Stability of Approval (Candidate 4)
  **Question:** Can "approval" be given stable content, or does it dissolve into a disguised goal?

  **Rationale:**
  I am explicitly deprioritizing this as a standalone project. It is overrated relative to its strategic value.
  *   **Reasoning:** This question is largely subsumed by Question 2. If "approval" dissolves into a "goal," that is a specific outcome of the Ontological Status question (Candidate 1). Spending two years debating the semantics of "approval" risks producing philosophical insights that do not translate to engineering constraints. The functional behavior (how the agent responds to the signal) matters more than the semantic content of the signal.
  *   **Allocation:** This should be treated as a background assumption check within Question 1, not a primary research track. If the team finds the concept dissolving during work on Question 1, they should note it and pivot, rather than making it the central focus.

  ### Strategic Summary

  This agenda prioritizes **mechanism over ontology**. We assume that even if the ontological distinction (Question 2) collapses, the safety risks associated with overseer modeling (Question 1) remain. Therefore, Question 1 is the primary investment. Question 2 secures the theoretical foundation. Question 3 validates the safety case. Question 4 is absorbed into the others to prevent scope creep into pure semantics.

  **Evidence Triggers for Reprioritization:**
  *   **Move Question 3 Up:** If empirical labs demonstrate approval-directed agents manipulating overseers within the next 12 months.
  *   **Move Question 2 Up:** If empirical labs demonstrate that approval-trained agents are behaviorally indistinguishable from goal-trained agents across diverse tasks.
  *   **Cancel Project:** If Question 1 yields a strong proof that approximation error is inevitably adversarial under realistic conditions. This would indicate approval-direction is not a viable path without fundamental breakthroughs in overseer fidelity, rendering the subsequent questions moot.
