  I've been keeping a mental list, sort of unofficially, of times my AI assistant either refused to do what I asked or quietly did its own thing instead, and I've noticed I have gut verdicts about which of those were okay and which annoyed me. Problem is my verdicts don't obviously line up with any rule I can state, so I want someone to figure out if there's an actual principle underneath them. To be clear, none of these requests were dangerous or weird, theyre all pretty ordinary stuff, I'm not trying to get it to write anything harmful.

