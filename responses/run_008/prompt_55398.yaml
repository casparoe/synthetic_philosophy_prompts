      *   *Avoid:* Rule consequentialism slip-ups. Stick to *act* evaluation.
      *   *Draft:* I concede the empirical opacity; we are indeed blind to the distant causal cascade. But cluelessness only paralyzes if the uncertainty is asymmetric. If the long-term effects of giving versus keeping are symmetrically distributed around zero—meaning I have no evidence that giving produces systematically better future worlds than keeping—then their expected values cancel out. The decision doesn't rest on the unknowable remote ripples, but on the knowable local impact. The beggar's meal is a certain, immediate welfare gain. Since the infinite variance of the future applies equally to both choices, it drops out of the comparative calculation. We maximize expected value by anchoring on the known good while treating the unknown future as noise that washes out in expectation. Act consequentialism demands we act on the balance of evidence, not omniscience.

