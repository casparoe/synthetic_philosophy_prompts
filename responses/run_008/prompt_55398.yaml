      *   *Key Move:* Distinguish between *objective* rightness (what actually maximizes) and *subjective* rightness (what maximizes expected value given evidence). Cluelessness attacks the latter, but we can argue that symmetric uncertainty cancels out, leaving the known local good decisive.

