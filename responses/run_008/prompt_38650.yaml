answer: |-
  The seam is in **Step (1)**.

  This is a classic formulation of the **Paradox of Fiction**, and your cousin has constructed a *reductio ad absurdum* without realizing they've handed you the hammer to break it.

  Here is the breakdown of why (1) is the bad step, how the grandmother example proves it, and what you have to "swallow" to fix it.

  ### The Flaw: The Existence Condition
  Step (1) asserts what philosophers call the **Existence Condition**: *To feel an emotion toward X, you must believe X exists.*

  This sounds intuitive, but it is psychologically false. Step (6) and your grandmother example already prove this, even if your cousin didn't see it.
  *   **The Grandmother Counter-Example:** You feel grief for your grandmother. Do you believe she *currently* exists? No. Do you believe she *ever* existed? Yes.
  *   **The Implication:** If (1) required belief in *current* existence, you couldn't grieve the dead. Since you *do* grieve the dead, (1) is false regarding temporal existence.
  *   **The Leap:** If emotions don't require *current* existence (grandmother), there is no logical reason they must require *actual* existence (Anna Karenina).

  The error in (1) is conflating the **object of the emotion** (the thing the feeling is about) with the **ontological status** of that object (whether it is real).

  ### Why Step (5) is Nonsense
  Because (1) is broken, the conclusion in (5) ("people cry at ink") is a category error.
  *   You don't cry at the ink (physical marks).
  *   You don't cry at the sentences (grammar).
  *   You cry at the **meaning** conveyed by the sentences.

  Your mind processes the *content* of the story ("Anna is suffering") and triggers an emotional response to that content, regardless of whether the content maps onto a real person. If (1) were true, you also couldn't be scared by a horror movie (you know the monster isn't real) or anxious about a future event (it doesn't exist yet).

  ### What You Have to Swallow
  To reject (1) and keep (2) (which is the right move), you have to accept a specific view of human psychology. You have to swallow this:

  **Emotions are triggered by *imaginative engagement*, not just *factual belief*.**

  This is often called the **Thought Theory** of emotion. It means:
  1.  **Intentionality without Existence:** Mental states can be "about" things that don't exist. I can think about a unicorn; the thought is real, the unicorn is not. Emotions work the same way.
  2.  **Cognitive Impenetrability:** Our emotional system is not perfectly rational. It reacts to simulations. When you read *Anna Karenina*, you are simulating her world. Your brain releases the chemicals for pity because the *scenario* is processed as significant, even if the *belief* system flags it as "fiction."
  3.  **The "As If" Stance:** You don't need to be deluded (violating premise 2). You can hold two thoughts at once: "Anna is not real" and "Anna's suffering is pitiable." The emotion attaches to the second thought.

  ### Summary for Your Cousin
  Tell them this:
  > "Step (1) is the liar. My grief for Grandma proves I don't need to believe something *currently* exists to feel emotion. If I can feel for something that *no longer* exists, I can feel for something that *never* existed. The emotion isn't about the physical person or the ink; it's about the **idea** of the person. We cry at meanings, not ink, and our brains are built to react to imagined meanings just as strongly as real ones."

  You keep (2) (readers aren't deluded), you keep the reality of your grief, and you reject the idea that emotions require a physical target.
