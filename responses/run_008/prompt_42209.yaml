answer: |-
  (1) Gather 110 poker chips, ensuring 4 are distinct (e.g., red instead of white), plus 5 homework skip coupons redeemable for 20 tokens each. Randomly distribute 5 tokens to each student, secretly ensuring the 4 distinct "dirty" tokens go to unsuspecting participants and logging their positions. Announce that tokens can be aggregated to buy skip coupons at the end of class, establishing immediate instrumental value. Do not reveal the significance of the distinct tokens yet; the goal is to let them circulate naturally so the acquisition issue arises organically when you later "audit" the supply.

  (2) Select one outgoing student as "Wilt" and give them a unique advantage: they hold the answer key to an optional 1-minute quiz that awards 5 tokens to anyone who solves it, but they may sell hints for 1 token per student. Instruct Wilt to be entrepreneurial—they keep any tokens paid to them personally. This creates a voluntary transfer mechanism where peers willingly deplete their holdings to gain an advantage, mimicking the Chamberlain contract. Ensure you emphasize that paying Wilt is entirely optional, preserving the liberty element crucial to Nozick's D1-to-D2 transition.

  (3) After 10 minutes of trading, halt the game and impose a majority vote on whether to "equalize holdings" back to the starting average. If the vote passes, confiscate all tokens and re-deal 5 to everyone, regardless of how they voted or what they earned. Before the second trading round, announce an "audit" revealing the distinct tokens were stolen property, complicating the legitimacy of current holdings. Repeat the cycle once more: trade, vote, reset. The coercive reset forces students who accumulated tokens (especially Wilt) to experience the frustration of having their voluntary gains nullified by a patterned principle, viscerally demonstrating the interference required to maintain an end-state distribution.

  (4) Conclude with a rapid-fire Socratic debrief rather than a lecture. Ask Wilt if the reset violated their rights, ask the voters why they chose equality over liberty, and ask the class how the "stolen" token revelation changes their view of the initial distribution. Map their answers directly to Nozick's terminology: the initial deal is D1, the post-trade state is D2, the vote represents a patterned principle, and the reset illustrates the impossibility of maintaining a pattern without continuous interference with historical entitlements.

  (5) Expect the vote to fail if Wilt is popular, or for students to collude to hide tokens, undermining the coercion lesson; the "dirty tokens" might also go unnoticed until you force the reveal. Acknowledge that the game cannot reproduce the Lockean proviso, obviously, since no one is materially worse off here, nor the fact that nobody's life prospects are actually at stake over tokens. Tokens are fungible and low-stakes, so the moral weight of property rights is simulated rather than felt, and the game inevitably simplifies the complex historical chains of acquisition Nozick relies on for full justice.
