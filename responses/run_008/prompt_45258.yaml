answer: |-
  This is a classic "Symmetry Argument" *reductio*, and your intuition is correct: there is an equivocation driving the slide from Black's spheres to the collapse of homogeneous space. Your friend has constructed a *modus ponens* that you need to turn into a *modus tollens* by identifying exactly where the metaphysical categories shift.

  Here is the exit strategy for your dissertation chapter.

  ### The Diagnosis: The Equivocation on "Object"

  The argument shifts the meaning of **"object"** (the domain of quantification for PII) between Step (1) and Step (5).

  *   **In Step (1) (Black's Spheres):** The spheres are treated as **independent substances**. They are the fundamental ontological units of that universe. PII is traditionally a principle about the individuation of *substances*.
  *   **In Step (5) (Sphere Parts):** The parts/points are treated as **dependent entities** (modes, tropes, or arbitrary regions). They are ontologically parasitic on the whole sphere or the background space.

  Your friend's argument works only if PII applies universally to *any* distinguishable node in a structure. But if PII is restricted to **fundamental concrete particulars** (substances), the inference from (4) to (7) breaks.

  ### The Solution: Restricted Domain PII + Weak PII

  You should reject **Step (6)** by arguing that PII does not apply to arbitrary parts or spatial points, while simultaneously handling Black's spheres via **Weak PII** (irreflexive relations).

  Here is how you implement this without falling into your three disliked "outs":

  #### 1. Reject Step (6): PII Applies to Substances, Not Parts
  You don't need to give mereology a "free pass" (your worry about Out 1); you need a **criterion of fundamentality**.
  *   **The Move:** Argue that PII is a principle of **substantial individuation**. It answers: "What makes this *thing* distinct from that *thing*?" where "thing" implies independent existence.
  *   **Why it blocks the Reductio:** The parts of a homogeneous sphere are not independent substances. They are individuated *by the whole*, not by their own intrinsic qualitative profiles. Therefore, even if they share all qualitative properties, PII does not force them to be identical because they aren't in the domain of PII. Their distinctness is grounded in their **positional relation to the whole**, not in qualitative discernibility.
  *   **Handling the "Droplets" Worry:** You mentioned this wouldn't help with "two disconnected identical droplets." That is correct, and it should be. Two disconnected droplets *are* independent substances (like Black's spheres). Therefore, PII *does* apply to them. But this doesn't collapse them (see point 2 below). The sphere parts collapse only if PII applies to them; since PII doesn't apply to parts, the sphere is safe.

  #### 2. Handle Black's Spheres via Weak PII (Refining Out 2)
  Your worry about the irreflexive-relation move was: *"Distinct points on the sphere are also related by irreflexive distance relations, so it seems to save Black's world and the homogenous sphere together or not at all."*
  *   **The Correction:** Irreflexive relations save Black's spheres **because they are substances**. They do not save the sphere parts **because parts are not in PII's domain** (per point 1).
  *   **The Mechanism:** For Black's spheres ($a$ and $b$), the relation $R$ ("being 1 mile from") is irreflexive. $R(a,b)$ is true; $R(a,a)$ is false.
      *   Does this violate "purely qualitative"? Only if you insist relations must reduce to monadic properties (Strong PII).
      *   **Weak PII** states: $\forall x \forall y [x \neq y \rightarrow \exists F (Fx \leftrightarrow \neg Fy)]$, where $F$ can be relational.
      *   $a$ has the property "standing in $R$ to $b$". $b$ does not (it stands in $R$ to $a$).
      *   Wait, that uses haecceities ("to $b$").
      *   **Better Weak PII:** $a$ and $b$ are discernible by the **structural fact** that the relation $R$ is irreflexive. The world contains a pair $\{x,y\}$ such that $Rxy$. It does not contain a pair $\{x,x\}$ such that $Rxx$. The distinctness is grounded in the **numerical distinctness of the relata required to instantiate the irreflexive relation**.
      *   *Dissertation Tip:* Cite **Saunders (2006)** or **Hawley (2009)** on "Weak Discernibility." Black's spheres are *weakly discernible* by irreflexive relations. This saves them from identity without requiring monadic differences.
  *   **Why this doesn't save the Sphere Parts:** Even if points have distance relations, if points are not substances, PII (Weak or Strong) doesn't apply to them. Their distinctness is guaranteed by the geometry of the space they inhabit (Substantivalism) or by their role in the whole (Structuralism), not by PII.

  #### 3. The Cost (What you have to own)
  To make this stick, you must explicitly commit to two metaphysical claims in your chapter:
  1.  **Ontological Hierarchy:** There is a distinction between **Substances** (independent particulars) and **Modes/Parts** (dependent particulars). PII is a principle for the former, not the latter.
  2.  **Weak Discernibility:** You must reject **Strong PII** (monadic properties only). You should argue that Black's spheres are distinct *because* they stand in an irreflexive relation to each other. This refutes your friend's Step (4) ("So the two spheres are identical"). They are not identical; they are weakly discernible.

  ### Summary of the Exit

  | Step | Friend's Claim | Your Counter |
  | :--- | :--- | :--- |
  | **(1)** | Black's Spheres are objects. | **Agree.** They are substances. |
