  Yes, a single refined principle can reconcile all your verdicts by distinguishing between risks created by voluntary activity and risks inherent in unchosen circumstances where only the mitigation strategy was optional.

  The principle is: **Society owes compensation for bad outcomes resulting from brute luck or from option luck where the agent merely chose how to mitigate an externally imposed vulnerability, but not for outcomes resulting from option luck where the agent voluntarily initiated the risk-generating activity itself for speculative gain or discretionary enjoyment.**

  This saves the congenital and train crash verdicts because the vulnerabilities were wholly unchosen (brute luck). It saves the gambler and skier verdicts because they voluntarily entered the risk-generating activities (betting, expert skiing) for speculation or recreation. It saves the flood self-insurer verdict because the vulnerability (geographic flood risk) was imposed by circumstance; the choice not to insure was merely a rational mitigation strategy within that constraint, not the creation of the risk itself. It resolves the smoker case by locating it on the boundary: if addiction and social context sufficiently undermine the voluntariness of the continued risk-taking, it shifts toward imposed vulnerability and warrants compensation; if viewed as fully voluntary maintenance of a habit, it shifts toward the skier.

  Regarding your unlisted case of the sedentary worker: the principle predicts **compensation is owed**. The health risk arises from a lifestyle "never reflectively endorsed" within the context of necessary social participation (work), making the vulnerability externally imposed by economic constraints rather than a discretionary risk sought for enjoyment or gain. This aligns with the flood self-insurer, where rational acquiescence to unavoidable risk structures does not forfeit the claim to security.

  None of your verdicts require dismissal as mere bias, though the flood intuition is the most vulnerable to charges of status quo bias because it conflicts with standard insurance incentives. However, under this principle, it is justified not by outcome equality but by the distinction between creating risk and managing it. The principle holds provided you strictly enforce the "voluntary initiation" clause; if you compensate for negligence in managing imposed risks (e.g., refusing cheap safety gear at work), the distinction collapses back into pure brute luck egalitarianism.
