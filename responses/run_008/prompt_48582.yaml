  6.  *(Self-Correction)*: Wait, I need to make sure I don't just say "it's ambiguous." I need to explain *why* that ambiguity persists. It persists because "art" is treated as a monolith. A dirge is not *King Lear*. I should emphasize the *object* of the emotion.

  7.  **Finalizing the Structure:**
      1.  Validation of the User's Hypothesis (The Ambiguity).
      2.  Diagnosis 1: Temporal Mismatch (Process vs. Outcome).
