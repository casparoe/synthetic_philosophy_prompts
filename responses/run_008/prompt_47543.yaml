      *   **The User's Worry:** The "subjectless good" clause in (2) implies an infinite accumulation of value by *not* creating possible people. The Empty Universe contains the "absent pains" of *all* possible people, making it infinitely better than a world with trillion blissful lives (minus a pinprick).
      *   **User's Intuition:** Wants to keep the intuition that preventing a miserable life is good (without a subject), but rejects the idea that value is a function of how many possible people we *don't* create (the "Repugnant Conclusion" in reverse, or rather, an "Absurd Conclusion" about non-existence). Suspects equivocation in (3) between person-affecting and impersonal views.
