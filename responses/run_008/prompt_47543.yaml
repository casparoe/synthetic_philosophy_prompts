          *   *View:* Person-Affecting Restriction (PAR) or Narrow Person-Affecting View.
          *   *Move:* "Better" in (2) means "better for the potential subject," not "better for the universe." You cannot sum subjectless goods across different possible subjects to compare worlds.
          *   *Cost:* Intransitivity or inability to solve Non-Identity Problem cases. Hard to say World A is better than World B if no one exists in both.
          *   *Verdict:* This aligns with the user's gut. It blocks the "Empty Universe" conclusion because you can't compare the Empty Universe to a Populated one using a common metric of "subjectless goods."

      *   **Option 3: Narveson's Slogan ("Make People Happy, Not Happy People").**
          *   *View:* Person-Affecting Utilitarianism.
          *   *Move:* Duties are to existing/future concrete people, not abstract possible people.
          *   *Cost:* The "Non-Identity Problem." If an action changes *who* comes into existence, it harms no one (on strict PAR), even if the resulting life is miserable.
          *   *Verdict:* Good heuristic, but needs refinement to handle the "miserable child" case the user wants to keep.

      *   **Option 4: Threshold Deontology / Sufficientism.**
          *   *View:* Lives above a certain threshold are worth creating; lives below are not.
