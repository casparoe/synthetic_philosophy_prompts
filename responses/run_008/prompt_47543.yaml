      Actually, the cleanest cut is to deny that the "good of absent pain" is *commensurable* with the "good of present pleasure" in an impersonal sum.
      Or, simpler: Reject the move from "Better for X" to "Better simpliciter" when X does not exist in one of the options. This is the **Non-Identity Problem** / **Person-Affecting Restriction**.

      *Let's look at the "Infinite Possible People" problem.* This is the "Mere Addition" issue. If we count non-existent possible people, we have an infinite set. Any finite good in the actual world is swamped by the infinite "good" of absent pain in the empty world.
