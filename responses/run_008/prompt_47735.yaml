      *   *Problem:* This series is *conditionally* convergent, not absolutely convergent. By Riemann Rearrangement Theorem, reordering terms changes the sum. Since there's no natural temporal or causal ordering of the outcomes (they are mutually exclusive possibilities), the "sum" is arbitrary.
