          1.  Write the procedure (questions in order, criteria for each level).
          2.  Handle hybrid cases (different levels for different domains).
          3.  Identify where the procedure yields to authorial judgment.
          4.  Run the procedure on three specific test cases (Servant girl, Scholar, Toddler).
          5.  **Crucial Constraint:** Be upfront about the scientific status of Dennett's scheme (settled vs. contested, hierarchy validity).
      *   **Tone:** Professional, practical for a writer, scientifically honest.

  2.  **Deconstruct Dennett's Scheme (Scientific Context):**
      *   *Source:* Primarily from *Darwin's Dangerous Idea* and *Kinds of Minds*.
      *   *Status:* It's a philosophical heuristic, not a hard biological taxonomy. It's widely respected in philosophy of mind and cognitive science but not "law."
      *   *Hierarchy:* The "subsuming" aspect is the most contested. Evolution doesn't always stack neatly; regression or domain-specificity is common.
      *   *Gregorian:* Heavily dependent on cultural transmission.
      *   *Warning:* I need to make sure the user knows this is a *lens*, not a *diagnosis*.

  3.  **Drafting the Procedure (The "Character Cognitive Audit"):**
      *   *Structure:* Needs to be step-by-step.
      *   *Questions:* Need to map to the four levels.
          *   Darwinian: Pre-wired, survival, no learning.
          *   Skinnerian: Reinforcement, trial-and-error, conditioning.
          *   Popperian: Internal simulation, planning, "dying in one's stead."
          *   Gregorian: Cultural tools, language, meta-cognition, offloading thinking.
      *   *Hybrids:* Acknowledge that humans are mostly Gregorian but operate at lower levels under stress or in specific domains.
      *   *Judgment Call:* Where the text is ambiguous or where the story *needs* a violation of the hierarchy.

  4.  **Running the Test Cases:**
      *   *Servant Girl:* Illiterate (limits Gregorian tools?) but high social intelligence (Popperian/Gregorian via observation?). *Analysis:* She likely uses Popperian simulation for social navigation but lacks specific Gregorian tools (reading). She might be labeled "Gregorian-lite" or domain-specific.
      *   *Scholar:* Erudite (Gregorian tools available) but rigid (fails Popperian update?). *Analysis:* This is a pathology. He *has* the tools but refuses the process. This makes him a tragic/flawed Gregorian or a Skinnerian in denial.
      *   *Toddler:* Developing. *Analysis:* Mostly Skinnerian/early Popperian. Not yet fully Gregorian (language/culture internalization is in progress).

  5.  **Refining the Scientific Caveats:**
      *   Must emphasize that Dennett is a philosopher, not a neuroscientist providing DSM criteria.
      *   The hierarchy is teleological (about *competence*), not necessarily structural.
      *   Modern cognitive science emphasizes modularity (Fodor) which complicates the "level" idea. A person can be Popperian in chess and Darwinian in panic.

