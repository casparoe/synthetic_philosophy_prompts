answer: |-
  ### Part 1: The Scientific Health Warning

  Before you use this tool, you need to know exactly what kind of tool it is. Daniel Dennett's "Four Kinds of Creatures" is a **philosophical heuristic**, not a biological taxonomy.

  *   **Settled Background:** It is generally accepted that organisms exhibit different *modes* of competence: reflexive (hardwired), conditioning-based (learned association), planning-based (internal modeling), and culture-based (tool/language use).
  *   **Contested/Framing:** The idea that these form a strict **hierarchy** where each level "subsumes" the last is Dennett's specific philosophical framing. Evolutionary biology and cognitive psychology often view these as **modular** rather than hierarchical. A human can be "Gregorian" (using complex language) in a boardroom and "Darwinian" (pure panic reflex) in a fire. The brain does not always route higher-level control over lower-level impulses.
  *   **The Risk:** If you treat this as hard science, you risk writing characters who feel algorithmic rather than human. The value for a novelist is not biological accuracy, but **narrative clarity**. It helps you identify *where* a character's agency lies and *why* they fail.

  **Use this procedure to diagnose narrative function, not biological reality.**

  ***

  ### Part 2: The Character Cognitive Audit (The Procedure)

  Run this checklist on every major character. Do not skip steps. If a character fails a lower step, they generally cannot access the higher steps (with exceptions noted in "Hybrids").

  #### Step 1: The Threat Response (Darwinian Check)
  **Question:** When surprised by immediate physical danger, does the character have any choice?
  *   **Darwinian Answer:** No. The body reacts before the mind engages (flinching, freezing, fleeing). There is no learning here, only design (evolutionary or engineered).
  *   **Higher Level Answer:** The character can override the reflex (e.g., standing still despite fear).
  *   **Action:** If *only* Darwinian, the character is an object, a zombie, or an insect. If they override it, proceed to Step 2.

  #### Step 2: The Feedback Loop (Skinnerian Check)
  **Question:** How does the character learn that an action is good or bad?
  *   **Skinnerian Answer:** They must experience the consequence directly. They touch the fire, get burned, and stop touching the fire. They are shaped by the environment.
  *   **Higher Level Answer:** They can learn without direct physical reinforcement (e.g., via instruction or imagination).
  *   **Action:** If *only* Skinnerian, the character is driven by habit, addiction, or conditioning. They cannot plan, only react to history. If they can anticipate, proceed to Step 3.

  #### Step 3: The Internal Simulator (Popperian Check)
  **Question:** Can the character test a course of action *inside their head* before acting?
  *   **Popperian Answer:** Yes. They can say, "If I do X, Y will happen," and decide X is too costly. They let the *hypothesis* die in their stead, not their body.
  *   **Higher Level Answer:** They can use external tools to aid this simulation (language, math, maps, advice).
  *   **Action:** If *only* Popperian, the character is a lone planner. They rely on their own wit. If they use shared tools, proceed to Step 4.

  #### Step 4: The Cultural Scaffold (Gregorian Check)
  **Question:** Does the character use "mind-tools" created by others to think thoughts they couldn't think alone?
  *   **Gregorian Answer:** Yes. This includes literacy, but also moral frameworks, specialized vocabulary, mnemonics, or social roles. They don't just think; they think *with* the culture's equipment.
  *   **Action:** If Gregorian, the character's agency is tied to their access to culture/tools.

  ***

  ### Part 3: Handling Hybrids and Judgment Calls

  **1. Domain Specificity (The Modular Problem)**
  Biology suggests we are not one level uniformly. A character might be **Gregorian** in their profession (a lawyer using legal code) but **Skinnerian** in their marriage (repeating toxic patterns because they are conditioned to them).
  *   **Procedure Fix:** Run the audit twice: once for their *Competence Domain* (work/skill) and once for their *Stress Domain* (relationships/fear). The gap between these two levels is often where the character arc lives.

  **2. The Regression Clause**
  Under extreme stress, fatigue, or intoxication, characters regress down the ladder. A Gregorian scholar may become a Darwinian panicker when the building burns down.
  *   **Procedure Fix:** Note the "Break Point." At what pressure does this character lose their highest level of operation?

  **3. The Authorial Veto (Where the Procedure Fails)**
  The procedure must admit defeat in two scenarios:
  *   **The Mystery:** If the character is meant to be enigmatic, do not pin them down. Let their level fluctuate to create unease.
  *   **The Thematic Violation:** Sometimes you *want* a character to have Gregorian tools but act Darwinian to prove a point about human nature.
  *   **Instruction:** If the audit results contradict the story you want to tell, **trust the story.** The audit is a diagnostic, not a law. If the science says "this is unlikely" but the theme says "this is necessary," mark it as a **Stylized Deviation** and ensure it is consistent.

  ***

  ### Part 4: Test Run

  Here is the audit applied to your three test cases.

  #### Character 1: The Servant Girl
  *Profile: Illiterate, brilliant at reading people.*

  *   **Step 1 (Threat):** She flinches when raised at, but can suppress it to watch the master's hand. **(Passes Darwinian)**
  *   **Step 2 (Feedback):** She doesn't need to be punished twice to know a mood has shifted. She learns from subtle cues, not just brute punishment. **(Passes Skinnerian)**
  *   **Step 3 (Simulator):** She anticipates conflicts. "If I bring the wine now, he won't shout." She runs social simulations. **(Passes Popperian)**
  *   **Step 4 (Scaffold):** She cannot read (no textual tools). However, she uses oral culture, gossip networks, and social hierarchy as tools. She uses "mind-reading" heuristics passed down by other servants.
  *   **Verdict:** **Gregorian (Oral/Social).**
  *   **Nuance:** Dennett emphasizes language as the primary Gregorian tool. Illiteracy limits her, but does not disqualify her. She is a **Domain-Specific Gregorian**. She has high-level tools for *social navigation* but low-level tools for *abstract information*.
  *   **Narrative Note:** Her conflict arises when she enters a domain requiring textual Gregorian tools (e.g., a legal court). Her social intelligence fails there.

  #### Character 2: The Scholar
  *Profile: Erudite, never changes plans when facts change.*

  *   **Step 1 (Threat):** Functional. **(Passes Darwinian)**
  *   **Step 2 (Feedback):** He ignores negative feedback. If his plan fails, he blames the world, not the plan. He is not being shaped by reality. **(Fails Skinnerian adaptation)**
  *   **Step 3 (Simulator):** He plans, but the simulation is rigged. He does not let the hypothesis die. He is a **Broken Popperian**.
  *   **Step 4 (Scaffold):** He has the tools (books, theories). He is structurally Gregorian.
  *   **Verdict:** **Gregorian Tools, Skinnerian Rigidity.**
  *   **Nuance:** This is a pathology. He has the *hardware* of a Gregorian creature but the *software* of a dogmatic Skinnerian (reinforced only by his own ego).
  *   **Narrative Note:** This is a tragic flaw. The audit reveals he is not "rational"; he is "conditioned to be rational." His arc requires him to become a *true* Popperian (admitting error) or devolve into a Skinnerian (pure habit).

  #### Character 3: The Toddler
  *Profile: 2 years old.*

  *   **Step 1 (Threat):** Reflexive screaming/crying. **(Passes Darwinian)**
  *   **Step 2 (Feedback):** Learns "hot" by touching. Learns "no" by tone. **(Passes Skinnerian)**
  *   **Step 3 (Simulator):** Emerging. Can pretend play (a form of simulation). Can anticipate a routine ("Bath time?"). **(Borderline Popperian)**
  *   **Step 4 (Scaffold):** Acquiring language. Uses words given by parents to label feelings ("Mad!"). **(Early Gregorian)**
  *   **Verdict:** **Transitional Skinnerian/Popperian.**
  *   **Nuance:** Dennett's hierarchy is developmental here. The toddler is in the process of *becoming* Gregorian. They are installing the tools.
  *   **Narrative Note:** Do not write them as fully Popperian. They cannot reliably "let the hypothesis die in their stead." They will still touch the fire even if told not to. Their agency is limited by their inability to fully run the simulation.

  ***

  ### Part 5: Final Summary for the Novelist

  1.  **The Hierarchy is Porous:** Your characters will slide up and down this ladder depending on stress, domain, and health. A "Gregorian" character acting "Darwinian" is a scene about loss of control.
  2.  **Tools vs. Usage:** Having Gregorian tools (education) does not make one a good Gregorian thinker (as seen in the Scholar). Distinguish between *inventory* and *operation*.
  3.  **The "Why" of Failure:** When a character fails, use the audit to pinpoint the level of failure. Did they panic (Darwinian)? Did they fall into habit (Skinnerian)? Did they fail to imagine the outcome (Popperian)? Or did they lack the cultural concept to understand the problem (Gregorian)?

  This procedure will not tell you if your character is "real." It will tell you if your character is **consistent**. In fiction, consistency is often more valuable than realism.
