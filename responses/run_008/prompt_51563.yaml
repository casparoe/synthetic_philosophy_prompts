      *   **Context:** Moderator of a mid-sized gaming Discord (4000 members, 4 volunteer mods).
      *   **Problem:** Inconsistent moderation due to ambiguity between *content* (what is said) and *action* (what the speech *does*). Users defend themselves by claiming they were just quoting/joking/asking, while mods feel the harm is in the *effect* or *intent*.
      *   **User's Insight:** They've intuitively grasped Speech Act Theory (performative vs. constative utterances, illocutionary force). They want this formalized into a practical tool.
      *   **Requirements:**
          1.  A checklist/procedure based on philosophy (specifically Speech Act Theory) but simplified for 2-3 minute decision making. Identify key terms.
          2.  Handle hard cases: sarcasm, quoting rule-breaking content, proxy threats ("someone should..."), joke-commands.
          3.  Identify where human judgment is unavoidable and how to communicate that during appeals.
          4.  Run the procedure on three specific cases (vague threat, ban evasion query, mod friend overstepping).
          5.  Address limitations (neurodivergence, ESL, lack of tone).
          6.  Tone: American English, practical, printable, honest about limitations (not "vibes in a lab coat").

  2.  **Philosophical Foundation (Speech Act Theory):**

      *   *Key Figure:* J.L. Austin (*How to Do Things with Words*), later John Searle.
      *   *Key Concepts:*
          *   **Locution:** The literal meaning of the words.
          *   **Illocution:** The intended force/action (warning, threatening, joking, ordering).
          *   **Perlocution:** The effect on the listener (fear, confusion, amusement).
      *   *Felicity Conditions:* For a speech act to "work" (e.g., a threat to be a real threat), certain conditions must be met (authority, context, sincerity).
      *   *Application:* The user is right. Rules usually ban *locutions* (slurs), but harm often comes from *illocutions* (harassment, intimidation). The procedure needs to shift focus from "what words" to "what act."

  3.  **Drafting the Procedure (The "Discord Speech Act Checklist"):**

      *   *Constraint:* Must be doable in 2-3 minutes.
      *   *Structure:* Needs to be a flowchart or numbered list.
      *   *Core Distinction:* Content vs. Force.
      *   *Steps:*
          1.  Identify the Literal Content (Locution).
          2.  Identify the Intended Action (Illocution) - *Crucial Step.*
          3.  Assess the Context/Authority (Felicity Conditions).
          4.  Assess the Impact (Perlocution).
      *   *Simplification:* Don't use the fancy Greek terms in the actual checklist for mods, but explain them in the intro so they understand *why*. Let's call them "The Words," "The Move," "The Setup," and "The Impact."
      *   *Handling "Vibes":* Acknowledge that "The Move" is often a judgment call.

  4.  **Addressing Hard Cases:**

      *   *Sarcasm:* Look at history/context. Is it hostile?
      *   *Quoting:* What is the *purpose* of the quote? (Calling out vs. Dogwhistling).
      *   *Proxy Threats:* "Someone should..." -> Is it inciting violence/harassment?
      *   *Joke Commands:* Do they have the authority? If not, it's roleplay, unless it confuses people.

  5.  **Addressing Limitations & Judgment Calls:**

      *   *The "Gray Zone":* Where intent is ambiguous.
      *   *Appeals:* Be honest. "We determined the *function* of the post violated safety, even if the *words* didn't."
      *   *Neurodivergence/ESL:* Literal interpretation vs. Pragmatic interpretation. Need a "Benefit of the Doubt" clause for clear misunderstandings, but not for repeated behavior.

  6.  **Running the Cases:**

      *   *Case A (Con Threat):* Locution = vague. Illocution = intimidation? Context = specific target. Impact = fear. Verdict = Warning/Remove.
      *   *Case B (Ban Evasion):* Locution = question. Illocution = testing boundaries/mockery. Context = "wink wink". Verdict = Remove (Inciting rule-breaking).
      *   *Case C (Mod Friend):* Locution = command. Illocution = assertion of authority. Context = No actual power. Impact = confusion/intimidation. Verdict = Correct the record, talk to mod.

  7.  **Refining the Output:**

      *   *Tone Check:* American English. Professional but accessible.
      *   *Formatting:* Bold headers, bullet points, clear sections.
      *   *Philosophy Check:* Ensure Austin/Searle are credited correctly but kept in the background of the *tool* while foregrounded in the *explanation*.
      *   *Self-Correction on "Vibes":* The user specifically asked not to just dress up vibes. I need to make sure the "Judgment Call" section is explicit about *why* it's subjective (interpreting intent).

  8.  **Final Review against Constraints:**

      *   Checklist included? Yes.
      *   Hard cases handled? Yes.
      *   Judgment call transparency? Yes.
      *   Three cases run? Yes.
      *   Limitations (ND/ESL) addressed? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: I initially thought about using the terms "Illocution" in the checklist. *Correction:* No, that's too academic for a 3 AM mod. Use plain English in the checklist, explain the theory in the intro.
      *(Self-Correction on Case C)*: This is tricky. It's a mod, but not *that* kind of mod. The harm is confusion. The action is "misleading representation of authority."
      *(Self-Correction on ND/ESL)*: Make sure to emphasize that *impact* matters, but *intent* matters for punishment severity.

  9.  **Final Polish:** Organize into "The Theory (Briefly)," "The Tool," "The Hard Cases," "The Gray Zone," and "The Test Run." (Proceed to generate output).

      *Wait, one more thing:* The user mentioned "Felicity Conditions." I should explicitly name that concept because it solves the "I was just joking" defense. A joke threat lacks the felicity condition of *sincerity*, but a real threat has it. How do we test sincerity? Context and history. I'll build that into the checklist.

      *Also:* The user asked for American English. Ensure spelling (moderate vs. moderate, behavior vs. behaviour) and idioms match.

      *Let's structure the response:*
      1.  Acknowledge the insight (Speech Act Theory).
