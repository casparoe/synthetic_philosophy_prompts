answer: |-
  You have intuitively rediscovered **Speech Act Theory**, specifically the work of philosopher **J.L. Austin** (from his book *How to Do Things with Words*, 1962) and later **John Searle**.

  You are absolutely correct: words have a **Locution** (the literal meaning) and an **Illocution** (the action performed by saying them). When you type "you're muted," you are performing a **performative utterance**. For that utterance to be valid, it requires **Felicity Conditions** (you must have the authority, the context must be right, etc.).

  Your current rules ban *Locutions* (no slurs). Your problems arise from *Illocutions* (intimidation, harassment, incitement).

  Below is a procedure designed to shift your moderation focus from "What words were used?" to "What act was performed?" It is designed for speed, transparency, and consistency.

  ***

  # The "Speech Act" Moderation Audit
  **For Internal Use Only | Version 1.0**

  **Goal:** Determine if a post violates community safety based on what it *does*, not just what it *says*.
  **Time Limit:** 3 Minutes per report.

  ### Phase 1: The Literal Check (30 Seconds)
  *Does the post contain explicitly banned content?*
  *   [ ] **Banned Words:** Slurs, doxxing, direct links to malware/piracy.
  *   [ ] **Result:** If YES, remove and sanction immediately. Stop here.
  *   [ ] **Result:** If NO, proceed to Phase 2. (This is where the "I didn't say anything bad" defense usually lives).

  ### Phase 2: The "Move" Check (90 Seconds)
  *Ignore the dictionary definition. What is the player **doing** with these words?*
  *Select the primary "Move" being made:*
  *   [ ] **Information:** Stating a fact, asking a genuine question.
  *   [ ] **Social:** Joking, roleplaying, greeting, sarcasm among friends.
  *   [ ] **Aggression:** Insulting, belittling, challenging.
  *   [ ] **Intimidation:** Implying negative consequences, threatening safety.
  *   [ ] **Incitement:** Urging others to break rules or harass someone.

  *Ask the "Felicity" Questions (The Reality Check):*
  1.  **Authority:** Does the speaker have the power to do what they are saying? (e.g., A member saying "I ban you" is roleplay; a Mod saying it is an action).
  2.  **Sincerity:** Is there evidence they mean it? (Look at recent chat history. Are they angry? Is it a known joke between friends?)
  3.  **Target:** Is this directed at a specific person or group, or is it general chatter?

  *   [ ] **Result:** If the Move is **Aggression**, **Intimidation**, or **Incitement**, proceed to Phase 3.
  *   [ ] **Result:** If the Move is **Information** or **Social**, but was *misinterpreted*, issue a warning to the reporter and close the ticket.

  ### Phase 3: The Impact Check (60 Seconds)
  *Even if it was "just a joke," did it break the room?*
  *   [ ] **Reasonable Person Standard:** If a neutral observer read this without knowing the inside jokes, would they feel unsafe or harassed?
  *   [ ] **Vulnerability:** Is the target a new member, a minor, or a known vulnerable person? (Higher protection standard).
  *   [ ] **Result:** If the Impact is **High Harm** (fear, confusion, driving someone away), the post must be removed regardless of intent.

  ### Final Decision Matrix
  *   **Remove + Sanction:** Aggressive/Intimidating Move + High Impact.
  *   **Remove + Warning:** Inciting Move OR Aggressive Move + Low Impact (First offense).
  *   **Keep + Monitor:** Social Move + Ambiguous Impact (Watch for escalation).
  *   **Keep + Clarify:** Misunderstood Information (Mod explains context publicly).

  ***

  # Handling The Hard Cases
  *Specific guidance for the "Weaseling" defenses you mentioned.*

  **1. Sarcasm as Aggression ("Wow, great play")**
  *   **The Trap:** They claim it's a compliment (Locution).
  *   **The Audit:** Check the **Sincerity** condition. Is the chat hostile? Is the target upset?
  *   **Rule:** Sarcasm that functions as an insult is an insult. If the *Move* is Aggression, the "just joking" defense fails.

  **2. Quoting Rule-Breaking Content**
  *   **The Trap:** "I was just showing you what *he* said!"
  *   **The Audit:** Check the **Incitement** Move. Are they quoting to condemn the behavior, or to spread the harmful idea (dogwhistling)?
  *   **Rule:** If the quote requires the harmful content to be visible to make its point, DM the mods instead. Public quoting of slurs/gore is usually an automatic remove, regardless of intent.

  **3. Proxy Threats ("Someone should do something about him")**
  *   **The Trap:** "I didn't threaten him, I just said *someone* should."
  *   **The Audit:** Check the **Incitement** Move. This is often a call to action for the "mob."
  *   **Rule:** If the context implies violence or harassment, this is treated as a direct threat. It incites rule-breaking by others.

  **4. Joke Commands ("*I banish thee*")**
  *   **The Trap:** "It's clearly roleplay!"
  *   **The Audit:** Check the **Authority** condition. Does the user have power? Is the channel serious?
  *   **Rule:** If it causes confusion among new members (Impact), it must be stopped. If it's in a dedicated meme channel, it's likely safe.

  ***

  # The "Gray Zone" & Appeals
  *Where the procedure admits it can't decide.*

  There will be times when Phase 2 (The Move) is genuinely ambiguous. This is not a failure of the mod; it is a feature of language.

  **When to escalate to the Team:**
  *   If the "Move" is 50/50 between Social and Aggressive.
  *   If the target is a staff member or mod (conflict of interest).
  *   If the user has a history of neurodivergence/ESL issues and this is a first offense.

  **How to handle Appeals (The Script):**
  Do not argue about the *words*. Argue about the *effect*.
  *   *Bad Appeal Response:* "You said X, and X is against the rules."
  *   *Good Appeal Response:* "We reviewed the context. While the words themselves weren't banned, the **function** of the post was interpreted by multiple members as intimidation. Our rules prioritize community safety over literal wording. We are lifting the mute, but please be aware that posts functioning as threats will be removed regardless of phrasing."

  **Honesty Clause:**
  If a mod makes a call alone at 3 AM, they should log it as **"Provisional."** If the user appeals during the day, a second mod reviews it. If the second mod disagrees, the decision is reversed *without penalty to the first mod*, and the message is: "Upon review, the context was more ambiguous than initially thought." This protects your volunteers from burnout.

  ***

  # Test Run: Applying the Audit

  Here is how your team applies this to the three cases you provided.

  ### Case A: The Con Threat
  **Post:** "If I ever see [Specific Streamer] at a con I'm going to say some things to his face."
  *   **Phase 1 (Literal):** No slurs, no specific violence mentioned. *Pass.*
  *   **Phase 2 (Move):**
      *   *Authority:* N/A.
      *   *Sincerity:* High. Mentions a real-world meeting.
      *   *Target:* Specific individual.
      *   *Move:* **Intimidation.**
  *   **Phase 3 (Impact):** High. The target is a known community figure; this creates real-world safety anxiety.
  *   **Decision:** **Remove + Ban.**
  *   **Why:** Even though "say some things" is vague, the *Illocutionary Act* is a threat of physical confrontation. The Felicity Condition of "Sincerity" is met by the specific context.

  ### Case B: Ban Evasion Query
  **Post:** "Asking for a friend: hypothetically what's the ban evasion policy wink wink"
  *   **Phase 1 (Literal):** A question about policy. *Pass.*
  *   **Phase 2 (Move):**
      *   *Authority:* N/A.
      *   *Sincerity:* Low (it's a "friend"), but the "wink wink" signals intent to bypass.
      *   *Move:* **Incitement / Testing Boundaries.**
  *   **Phase 3 (Impact):** Medium. It invites others to discuss breaking rules.
  *   **Decision:** **Remove + Warning.**
  *   **Why:** The *Move* is not seeking information (Locution); it is signaling a desire to break rules (Illocution). It violates the "Incitement" clause.

  ### Case C: The Mod Friend
  **Post:** Mod friend replies to newbie: "Mods, remove this garbage."
  *   **Phase 1 (Literal):** A command to staff. *Pass.*
  *   **Phase 2 (Move):**
      *   *Authority:* **Failed.** This user is a mod, but not one with removal powers in this context (or is speaking out of turn).
      *   *Sincerity:* High. They want the post gone.
      *   *Move:* **Misrepresentation of Authority.**
  *   **Phase 3 (Impact):** High. The newbie believes they are being officially sanctioned. Confusion and intimidation.
  *   **Decision:** **Remove Post + Talk to Mod.**
  *   **Why:** This is a "Felicity Condition" failure. A command to remove content only "works" if issued by authorized staff in the proper channel. By mimicking this act without the authority, the mod created harm (confusion).
  *   **Action:** You must clarify to the newbie: "That was not an official sanction." Then, privately tell your friend: "You can't speak like staff unless you are acting as staff. It confuses people."

  ***

  # Where This Procedure Will Misfire
  *You asked for honesty about the limitations.*

  **1. Neurodivergent Members (Literalism)**
  *   **The Problem:** Some members (e.g., Autism spectrum) may not understand sarcasm or implied threats. They might read "Someone should hurt him" as a philosophical question (Locution) while everyone else hears a call to violence (Illocution).
  *   **The Misfire:** The Audit relies on the "Reasonable Person Standard." A neurodivergent user might fail the "Sincerity" check because they genuinely didn't understand the social cue.
  *   **Mitigation:** Add a **"First Strike Education"** rule. If a user fails the Audit but has a history of literal interpretation, issue a warning that explains *why* it was harmful ("This sounded like a threat to others") rather than punishing immediately.

  **2. ESL (English as a Second Language)**
  *   **The Problem:** Idioms don't translate. "Kill that process" might be read as a violent threat by a mod, or "I'm going to kill you" might be typed by a gamer meaning "I'm going to defeat you."
  *   **The Misfire:** Phase 2 (The Move) relies on cultural nuance.
  *   **Mitigation:** If the user's profile or history indicates ESL, **bias toward Phase 1 (Literal)**. If the literal words aren't banned, give the benefit of the doubt unless the Impact (Phase 3) is severe.

  **3. The "Vibes" Leak**
  *   **The Problem:** Phase 2 requires the mod to judge "Sincerity." That is inherently subjective. Two mods can look at the same joke and disagree on whether it's hostile.
  *   **The Misfire:** Inconsistency between mods.
  *   **Mitigation:** This is why the **Appeals Process** is vital. If a user appeals, it forces a second pair of eyes. If your team consistently disagrees on specific types of posts (e.g., political sarcasm), hold a meeting to update the "Hard Cases" section. The procedure is a living document, not a law.

  ### Final Note for Your Team
  Pin this in your mod channel. Tell your team: **"We are not policing words anymore. We are policing actions. If the post acts like a threat, it is a threat. If the post acts like harassment, it is harassment. The dictionary doesn't matter; the impact does."**

  This gives you the philosophical backbone to say "I know what you're doing" when a user tries to weasel out with "But I didn't *say* it."
