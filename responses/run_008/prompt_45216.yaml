  *   **Diagnosis:** You are most plausibly divided over **what counts as "inference."**

  **2. Substantive vs. Verbal**
  Your disagreement is **hybrid**, but predominantly **verbal regarding "inference,"** which masks a **substantive disagreement about "warrant."**
  *   **Verbal:** If he defines inference as "any cognitive process sensitive to reliability statistics," he wins by definition. If you define it as "reasoning from explicit evidence," you win by definition.
  *   **Substantive:** Once definitions are fixed, the real fight is over **normativity**. Does the hearer *owe* a justification for trusting (his view), or does the speaker *confer* justification by asserting (your view)?
