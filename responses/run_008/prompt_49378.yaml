  1. "The principle, stated"

  I endorse your principle repaired: **The Principle of Reference-Class Bound Liability.** Intervention is justified only when ongoing mass killing creates an expected harm exceeding the expected harm of intervention, where the intervention's aims are strictly limited to stopping the killing, and the intervening power accepts the median outcome of the *specific* reference class (e.g., "air power in tribal states") rather than the ideal outcome. This repairs your clause by forbidding motte-and-bailey shifts in reference class selection. You cannot claim "humanitarian intervention" as the class when ex ante planning, and "unforeseen regime collapse" as the class when ex post evaluating. The median failure of regime-change-by-airpower is state fragmentation; if you wouldn't accept fragmentation ex ante, the intervention is unjustified regardless of the initial humanitarian motive. This prioritizes forecasting accuracy over moral signaling, ensuring that decision quality is judged by whether the actors honestly priced the risk of collapse before pulling the trigger.

  2. "Running the cases"

  **Rwanda:** Saves verdict. Reference class: peacekeeping in genocide. Median failure: inability to stop all killing. Acceptable vs. non-intervention. The cost of force was low, the harm of inaction catastrophic. A modest force fits the narrow aim. Verdict: Right.

  **Sierra Leone:** Saves verdict. Reference class: counter-insurgency invited by government. Median failure: stalemate. Acceptable. Clear command structure ensured narrow aims. Verdict: Right.

  **Kosovo:** Saves verdict. Reference class: coercive bombing to stop cleansing. Median failure: stalemate/continued tension. Acceptable vs. ethnic cleansing. Legality is secondary to necessity when the Security Council is paralyzed by veto. The aim remained stopping cleansing, not regime change. Verdict: Right.

  **Iraq:** Saves verdict. Reference class: regime change via invasion. Median failure: insurgency/collapse. Unacceptable given WMD pretext was false. Humanitarian case was ex post rationalization. The planners did not accept the median failure; they assumed liberation. Verdict: Wrong.

  **Libya:** Splits verdict, adjudicates ex ante. Ex post: Outcome was bad. Ex ante: Reference class "air power against tribal regime" predicts collapse. NATO shifted aims from protection to regime change without accepting the median failure of that new class. The UN mandate was protection; the execution was overthrow. You cannot justify the latter with the former. The median failure of toppling Qaddafi without boots on the ground was chaos. Verdict: Wrong at the gate.

  **Syria:** Saves verdict (the hesitation). Reference class: no-fly zone in civil war. Median failure: proxy escalation/state fragmentation (same as Libya). Since Libya was wrong ex ante, Syria intervention would also be wrong. The "moral failure" was rhetorical, not operational. The red line created an obligation to act only if action was sound; it was not. Verdict: Right to hesitate.

  3. "The verdicts I give up"

  I require you to abandon the intuition that Libya was "right but betrayed." Under this principle, the betrayal was the predictable median failure of the chosen method. You must also abandon the feeling that Syria was a moral failure; if the intervention leads to a worse humanitarian outcome (fragmentation + continued war), non-intervention is the lesser evil. Your discomfort stems from conflating "doing something" with "doing good." The principle forces you to accept that sometimes the only ethical choice is inaction, because the reference class for violent state-building is failure. Your Iraq verdict is safe; your Kosovo verdict is safe; but your desire to salvage Libya's intent must die. The principle wins because it aligns moral intent with epistemic honesty, preventing you from rewarding lucky guesses or punishing accurate forecasting of disaster.

  4. "Cases I haven't listed"

  1. **Myanmar (2017):** Rohingya cleansing. Reference class: cross-border intervention against sovereign state. Median failure: regional war. Prediction: No intervention, despite high killing. Sovereignty constraint outweighs unless spillover is certain. Military logistics make narrow aims impossible without full invasion.
  2. **Haiti (2024):** Gang violence, government request. Reference class: policing intervention. Median failure: temporary suppression. Prediction: Yes, if aims are narrow (secure ports/roads) not nation-building. Invitation solves the sovereignty problem; narrow aims solve the collapse problem.
  3. **Tigray (2020):** Mass killing, no government invite. Reference class: civil war intervention. Median failure: prolonged proxy conflict. Prediction: No intervention. Sanctions only.
  These stress the "narrow aims" and "invitation" constraints. Haiti passes because of invitation and narrow scope. Myanmar and Tigray fail because the reference class predicts escalation without clear stopping conditions. This tests whether you truly accept "no action" when the reference class is bad, even when killing is visible. It forces you to prioritize long-term stability over short-term moral signaling.

  5. "The one-line version"

  Intervene only when the expected harm of stopping the killing exceeds the expected harm of the median failure mode of the specific military method used, accepting that state collapse is a valid forecast, not a surprise, and never conflating protection with regime change.
