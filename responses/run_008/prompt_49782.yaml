      *(Refining the "Platitude" check)*: A platitude is true but trivial. "People get jealous" is a platitude. "Institutional signaling triggers social enforcement mechanisms" is an insight. I need to make that distinction clear.

      *(Refining the "Support" check)*: Does the reading support *withholding* praise?
