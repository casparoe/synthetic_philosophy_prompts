      *Refining the Tension:* The tension is between Verdict 1 (1 in 1M extinction) and Verdict 2 (1 in 1B extinction). The difference is probability magnitude. But Verdict 4 admits "comparably small" chance for lock-in. This suggests the *type* of outcome matters more than the probability in 4. Lock-in is a *guaranteed bad state if it happens* affecting *quality*, whereas 1-in-1B is *non-existence*.
