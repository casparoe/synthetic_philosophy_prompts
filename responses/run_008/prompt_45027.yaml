      *Critique:* A strict Person-Affecting view struggles with Verdict 1 (Extinction) unless framed as "killing current generation." But usually, longtermist extinction risk is about the *future* not existing. If the user accepts 1, they accept some impersonal value.
      Let's go with a **Hybrid View: Constrained Impersonalism with Epistemic Discounting.**

  5.  **Drafting the Response:**
      *   **Principle Name:** The Principle of Robust, Constrained Prioritization.
      *   **Clauses:**
