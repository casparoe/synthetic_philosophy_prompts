answer: |-
  Based on the verdicts you have provided, you are attempting to navigate a middle path between **Total Utilitarianism** (which would likely force you to accept the 1-in-a-billion grant and the pure savings argument) and **Strict Person-Affecting Views** (which would struggle to justify spending significant resources on existential risk reduction in Verdict 1, since non-existent people cannot be harmed by never existing).

  Your position resembles a view sometimes called **"Moderate Longtermism"** or **"Institutional Longtermism,"** but to make it consistent, it requires a hybrid principle that combines deontological constraints, epistemic humility, and an asymmetry between harm and benefit.

  Here is a precise formulation of the principle that best captures your verdicts, followed by an honest assessment of its costs and implications for your vaccine case.

  ### The Principle: Epistemically Robust, Constrained Prioritization

  **Clause 1: Deontological Side-Constraints.**
  *Agents must not violate fundamental individual rights (e.g., bodily autonomy, non-consensual harm) even to maximize expected value.*
  *   **Motivated by:** The Organ Harvest case.
  *   **Function:** Blocks the aggregation of future benefits from overriding the inviolable status of existing persons.

  **Clause 2: Present Generation Entitlement.**
  *The current generation has a prima facie claim to a baseline of welfare and consumption that cannot be entirely sacrificed for purely potential future gains.*
  *   **Motivated by:** The "Save and Invest" case (Verdict 5).
  *   **Function:** Rejects the Ramsey Rule implication of strong longtermism (that we should consume almost nothing). It introduces a non-zero discount rate based on the moral standing of the present.

  **Clause 3: Epistemic Truncation Threshold.**
  *Probabilities of astronomical outcomes below a threshold of evidentiary robustness (e.g., $< 10^{-7}$) are treated as zero in deliberation when competing against certain, significant near-term welfare.*
  *   **Motivated by:** The 1-in-a-Billion Grant vs. Deworming (Verdict 2).
  *   **Function:** Distinguishes Verdict 1 (1-in-1M, treated as robust) from Verdict 2 (1-in-1B, treated as speculative noise). It acknowledges that at extreme scales, probability estimates are often model-dependent rather than empirical.

  **Clause 4: The Harm/Benefit Asymmetry (Quality over Quantity).**
  *Preventing permanent structural degradation (harm to future lives) is morally weightier than ensuring the existence of additional future lives (benefit of creation), particularly when the latter relies on speculative probabilities.*
  *   **Motivated by:** The Lock-in case (Verdict 4) vs. The 1-in-1B Grant (Verdict 2).
  *   **Function:** Justifies acting on small probabilities to prevent *bad futures* (Lock-in) while refusing to act on similar probabilities to ensure *more futures* (Grant). It treats "degraded existence" as a harm to identifiable future subjects, whereas "non-existence" is not a harm.

  ---

  ### Honest Assessment: Which Verdicts This Cannot Save

  While this principle systematizes your intuitions, it faces two significant philosophical costs that you must acknowledge in your dissertation:

  **1. The Arbitrariness of the Threshold (Verdict 1 vs. Verdict 2)**
  The principle cannot mathematically justify why $10^{-6}$ (Verdict 1) passes the Epistemic Truncation Threshold while $10^{-9}$ (Verdict 2) fails it. This is a "cliff-edge" problem. If the 1-in-a-billion grant is *known* to be $10^{-9}$ (not just a guess), Totalism argues you are irrationally ignoring expected value. Your principle saves the verdict only by asserting that such probabilities are *never* epistemically robust enough to override certain near-term good. You must defend the claim that we *cannot know* probabilities that small with sufficient confidence, rather than just that they are small.

  **2. The Tension Between Verdict 1 and Verdict 4**
  Verdict 1 (Extinction Risk) is arguably about *Quantity* (ensuring future people exist). Verdict 4 (Lock-in) is about *Quality*. Yet you accept high costs for 1 (at 1-in-1M) and high costs for 4 (at "comparably small" probabilities).
  *   **The Conflict:** If the probability in the Lock-in case is truly comparable to the 1-in-1B grant (as you stated), Clause 3 should block it. If Clause 4 saves it (because it's about Quality/Harm), then why doesn't Clause 4 also apply to Extinction? Extinction ensures *no* quality of life.
  *   **The Fix:** You must argue that Extinction Risk (Verdict 1) is viewed as *harm to the current lineage* (cutting lives short) rather than *failure to create*, whereas the 1-in-1B grant is viewed as *creation*. This requires a nuanced Person-Affecting view that treats "premature termination of the human project" differently from "failure to expand the human project."

  ---

  ### Application to the Vaccine Case

  **The Case:** Divert a vaccine shipment from a poor country today (certain harm/death to identifiable existing people) to a research program with a **1-in-100,000,000 ($10^{-8}$)** chance of preventing an engineered pandemic that ends civilization.

  **Application of the Principle:**

  1.  **Clause 1 (Rights/Constraints):** Diverting vaccines actively harms identifiable existing people who have a reasonable expectation of receiving aid. This borders on a rights violation (harming specific individuals for aggregate good).
  2.  **Clause 2 (Present Entitlement):** The poor country has a claim to the baseline welfare (health/survival) provided by the vaccines.
  3.  **Clause 3 (Epistemic Truncation):** $10^{-8}$ falls below the threshold established in Verdict 2 ($10^{-9}$ was rejected, $10^{-6}$ accepted). This probability is in the "speculative noise" zone. It is not robust enough to override certain death today.
  4.  **Clause 4 (Harm/Benefit):** While preventing civilization collapse is preventing harm (like Verdict 1), the mechanism here is speculative research vs. certain aid.

  **Verdict:** **Do not divert the vaccines.**

  **Reasoning:** Even though the stakes (civilizational collapse) match Verdict 1, the probability ($10^{-8}$) aligns closer to Verdict 2 ($10^{-9}$) than Verdict 1 ($10^{-6}$). More importantly, this case involves **active harm to existing identifiable people** (Vaccine diversion) rather than **diffuse costs** (Verdict 1 & 4 involved "large costs" or "diffuse costs," not necessarily killing specific named individuals).
  Your rejection of the Organ Harvest case (Verdict 3) is the strongest predictor here. Diverting vaccines is functionally closer to harvesting organs (sacrificing specific lives for a probabilistic future) than it is to paying a tax for risk reduction.

  ### Recommendation for Your Work

  Your position is stable *if* you lean heavily into **Epistemic Humility** (we can't know $10^{-9}$ risks well enough to act on them) and a **Person-Affecting Asymmetry** (preventing bad lives matters more than creating good ones).

  However, be prepared for the objection that your view is **unstable under reflection**. If you admit the 1-in-1B grant *actually* has that expected value, refusing it looks like irrational risk aversion. To defend this, you should argue that in population ethics, **uncertainty compounds over time**. A 1-in-1B estimate for the far future is epistemically distinct from a 1-in-1M estimate for "this century." The further out the prediction, the less weight the probability carries, regardless of the stake. This justifies the gap between Verdict 1 (this century) and Verdict 2 (implied long-term/grant).

  **Final Advice:** Don't try to hide the arbitrariness of the probability threshold. Own it as a feature of **bounded rationality**. We are cognitively incapable of processing $10^{-9}$ probabilities against certain suffering without error, so we adopt a heuristic threshold. This moves the debate from axiology (what is good?) to epistemology (what can we know?), which is often a more defensible position for a Moderate Longtermist.
