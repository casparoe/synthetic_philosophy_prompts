  **Joint Statement on Suffrage and Competence**

  This document outlines areas of agreement and precise disagreement regarding voter competence and suffrage. It serves as a baseline for future debate.

  **I. Shared Claims**
  1. Legitimate governance requires both technical competence and public consent.
  2. Empirical data confirms significant voter ignorance on specific ballot issues.
  3. Historical franchise restrictions (e.g., literacy tests) were weaponized to disenfranchise marginalized groups.
  4. Expert consensus is not guaranteed on complex technical risks (e.g., nuclear safety).
  5. Any system must balance the risk of policy failure against the risk of tyranny.

  **II. Remaining Disagreements**

  | Issue | Epistocratic Position | Democratic Position |
  | :--- | :--- | :--- |
  | **Primary Value** | Voting weight should reflect competence to ensure optimal policy outcomes. | Voting weight must be equal to ensure political equality and prevent abuse. |
  | **Primary Risk** | Unrestricted suffrage allows ignorance to drive harmful policy failures. | Restricted suffrage allows elites to capture power and exclude opponents. |
  | **Remedy** | Implement basic competency tests on ballot specifics. | Protect universal suffrage; fix ignorance via education, not exclusion. |

  **III. Crux Analysis**

  **Crux 1: The Nuclear Referendum**
  *Concrete Case:* A binding vote on a nuclear waste facility. Surveys show voters lack technical knowledge, but experts disagree on risk levels.
  *Shared Bearing:* Does filtering voters improve outcomes when expertise is contested?
  *Epistocrat Prediction:* If we implement a test, the vote will shift toward acceptance if the facility is scientifically safe, reducing panic-driven rejection. The informed subset will recognize expert consensus where it exists.
  *Democrat Prediction:* If we implement a test, the vote will reflect the biases of the test-makers, silencing legitimate local concerns about risk distribution. The "informed" group will simply mirror the establishment view.

  **Crux 2: The Verbal Dispute**
  *Concrete Case:* Defining "Democracy." Does it mean equal agency in the process, or outcomes matching informed wishes?
  *Shared Bearing:* Does resolving terminology resolve the normative conflict?
  *Epistocrat Prediction:* Redefining democracy as "rule by the informed" will not solve the conflict because the power to define "informed" remains contested. The struggle shifts to who writes the questions.
  *Democrat Prediction:* Redefining democracy as "rule by the informed" admits that epistocracy is not democracy, clarifying that the fight is over values, not words. The core value of equality is abandoned.

  **IV. Conclusion**
  Both sides agree that ignoring voter ignorance is dangerous, but disagree on whether restricting suffrage is the remedy or the greater danger. We acknowledge that if tests cannot be proven neutral, the Democratic position holds practical precedence. However, if ignorance leads to catastrophic policy failure, the Epistocratic concern remains valid. Further empirical study on test neutrality is required before implementation. Neither side concedes that their core value is secondary.
