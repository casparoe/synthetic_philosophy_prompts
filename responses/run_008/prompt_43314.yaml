prompt: |-
  my civics class is doing a project on adversarial collabs and I got assigned the topic my two friends have literally been arguing about all year: epistocracy vs democracy. One of them is basically an epistocrat -- he wants voters to pass some kind of knowledge test before voting, at minimum on the specific issues on the ballot. The other one thinks that's a nightmare and says every adult gets one vote, period, and any test will get captured by whoever is in power and used to disenfranchise people (which, fair, has happened historically). I'm supposed to write the document the two of them could actually both put their names on, so I need it to not be slanted toward either one.

  Please draft it as: a numbered section of claims both would sign (about what votes are for, about voter ignorance being real but disagreed-over in its implications, about the historical track record of restricting the franchise, whatever they genuinely share), then a table of the exact remaining disagreements where each side's position is phrased in wording that side itself would accept.

  Two things they keep circling that I want addressed as cruxes. First, a scenario: a binding local referendum on hosting a nuclear waste facility, where surveys show most voters can't answer basic factual questions about how the facility works but also the "informed" experts disagree with each other about the risks. Would an epistocracy even help here, or just move the disagreement up a level? Second, one of them claims the whole fight might partly be verbal: does "the people ruled" mean every person had an equal say in the process, or that the outcome matched what people would have wanted if they were fully informed? If those are just different meanings of democracy then some of the argument dissolves, and I want to know how much of it.

  For each crux, give a concrete case or argument both would agree bears on it, with each side's prediction about how it would go written down in advance (they love that part for some reason).

  Hard limit: 700 words, no going over, my teacher actually checks. Also plz dont pick a winner, that would defeat the whole point and also theyd both be mad at me.
