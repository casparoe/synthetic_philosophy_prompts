answer: |-
  You are absolutely right to be skeptical. Your cohort-mate is describing a position called the **Simple Regularity Theory (SRT)** of laws, which was indeed largely abandoned decades ago. However, the Humeanism discussed in your seminar (almost certainly **Neo-Humeanism** or the **Best System Analysis** championed by David Lewis) is a much more sophisticated view that specifically was developed to avoid the pitfalls your friend listed.

  Given your background in dynamical systems, you actually have a better intuition for modern Humeanism than your friend does. The "systems of axioms" bit you remembered is the key.

  Here is a piece-by-piece breakdown of your friend's summary, distinguishing the strawman from the actual Neo-Humean position.

  ### 1. "Laws of nature are just descriptions of the regularities we happen to have observed."
  *   **Verdict:** *Partially True, but misleading.*
  *   **The Nuance:** A Neo-Humean agrees that laws supervene on the "Humean Mosaic" (the total distribution of particular matters of fact throughout spacetime). However, it is not just about *observed* regularities. It is about the *total* pattern of events (including unobserved ones).
  *   **The Physics Analogy:** Think of the Mosaic as the raw data of every particle position and momentum at every time step. The laws are not just a list of what we've seen so far; they are the compression algorithm that best describes the *entire* dataset.
  *   **Where the friend is wrong:** It implies a passive, local observation. Humeanism is a global claim about the structure of the entire universe's history.

  ### 2. "Nothing in nature makes anything obey a law, the universe is basically a giant accident."
  *   **Verdict:** *Metaphysically True, Rhetorically Loaded.*
  *   **The Nuance:** This is the one thing your friend actually got right. Humeans deny "modal force." There is no "glue" or "governing" power in the universe that *makes* an electron follow the Schrödinger equation. The electron just does what it does, and the equation is our description of that behavior.
  *   **The "Accident" Framing:** Calling it a "giant accident" is the Anti-Humean (Necessitarian) spin. To a Humean, it's not an "accident" in the sense of something going wrong; it's just **brute fact**. There is no deeper "why" than "that's how the mosaic is tiled."
  *   **Why it's still live:** Many physicists are comfortable with this. In dynamical systems, you often study the trajectory without asking what "forces" the trajectory to exist metaphysically. The math describes the flow; it doesn't need a metaphysical engine to push the phase point.

  ### 3. "Any pattern that happens to hold counts as a law."
  *   **Verdict:** **False.** (This is the critical error).
  *   **The Confusion:** Your friend is describing Simple Regularity Theory (SRT). Under SRT, if "all coins in my pocket are silver," that is a law because it's a true regularity. This is obviously absurd.
  *   **The Neo-Humean Fix (Best System Analysis):** David Lewis proposed that laws are the axioms of the **Best System** that summarizes the Humean Mosaic. To be a law, a regularity must earn its place in the system by optimizing a trade-off between:
      1.  **Simplicity:** (Short axioms, few parameters).
      2.  **Strength/Information:** (Predicts/covers as much of the mosaic as possible).
  *   **Why "Copper Spheres" fails:** The statement "All copper spheres conduct electricity" might be true. But adding it to the Best System (e.g., Standard Model + GR) increases the *simplicity cost* (more axioms) without gaining enough *strength* (because conductivity is already derivable from more fundamental quantum laws). Therefore, it is an **accidental generalization**, not a law.
  *   **Your Intuition:** You mentioned remembering "systems of axioms." You were right. That is exactly the mechanism Humeans use to filter out accidental patterns.

  ### 4. "Since it's all just curve-fitting, Humeans also can't explain why induction works at all."
  *   **Verdict:** *Conflates Metaphysics with Epistemology.*
  *   **The Objection:** The friend argues that if laws are just summaries of the past, they give no logical guarantee that the future will resemble the past.
  *   **The Humean Response:** **Nobody** can explain why induction works. This was David Hume's original point in the 1700s! Anti-Humeans (who believe laws are powerful governing entities) *claim* they can solve this, but Humeans argue they are fooling themselves. Just because you posit a "Necessary Connection" doesn't logically guarantee the future will follow it unless you add another premise that the Connection persists... which requires induction.
  *   **The Real Stance:** Neo-Humeans argue their view is *honest* about induction. Laws are the tools we use to systematize our inductive practices. They don't *justify* induction; they are the *result* of successful induction.
  *   **Physics Analogy:** In model selection (AIC/BIC), you choose the model that best fits past data to predict future data. You know there's no metaphysical guarantee the system won't change regimes tomorrow. But that doesn't stop you from using the model. Humeanism treats laws like the optimal model selection, not a divine guarantee.

  ### 5. "The view got pretty much refuted back in the day because of this."
  *   **Verdict:** **False.**
  *   **History:** Simple Regularity Theory was refuted. Neo-Humeanism (Best System Analysis) was developed *in response* to those refutations and is currently one of the two dominant positions in metaphysics of science (the other being Armstrong-style DTA or Primitivism).
  *   **Current Status:** Philosophers like David Lewis, Barry Loewer, and David Albert (a physicist-philosopher!) have defended sophisticated Humean views. In fact, Humeanism is often *preferred* by those working on quantum mechanics (e.g., Bohmian mechanics) because it handles non-locality without requiring "spooky" necessary connections.

  ### Summary for your Cohort
  If you want to correct your friend gently, you can say:

  > "I think you're describing the old Simple Regularity Theory. The seminar is discussing Lewis's **Best System Analysis**. They don't think *any* regularity is a law; they think laws are the axioms of the system that best compresses the total history of the universe (simplicity + strength). That's how they distinguish laws from accidents like 'all copper spheres conduct.' Also, Humeans don't claim to solve the problem of induction; they argue that *no one* can, and that positing 'governing laws' doesn't actually help."

  ### The "Curve-Fitting" Analogy (For you)
  Since you are in dynamical systems, the best way to think of Neo-Humeanism is **Lossy Compression** or **Minimum Description Length**.

  *   **The Mosaic:** The raw time-series data of every particle in the universe.
  *   **Anti-Humean:** Believes there is a "source code" running the simulation that *forces* the data to look that way.
  *   **Humean:** Believes there is only the data. The "Laws of Physics" are simply the shortest `.zip` file we can create that allows us to reconstruct the data with acceptable fidelity.
  *   **Accidents:** Patterns in the data that are too complex to include in the `.zip` header without making the file larger than just storing the raw data.

  Your friend thinks Humeans say "Whatever pattern I see in the data is a law." Actual Humeans say "The law is the algorithm that generates the data with the optimal balance of code length and output accuracy."

  Your intuition that the view involves "systems of axioms" was spot on. That is the defining feature that saves Humeanism from the objections your friend raised.
