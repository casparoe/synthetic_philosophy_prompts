      *   *Knowledge View:* Blame (knew and violated).
      *   *Observation:* We usually still excuse the tourist, suggesting Membership > Knowledge.

      *Wait, the prompt asks for a case that discriminates.*
      Let's use the "Long-term Resident who claims Ignorance" vs "Short-term Tourist who admits Knowledge."
      *   If we blame the Resident, it's about Membership/Epistemic Duty.
