answer: |-
  Your observation cuts to the heart of a debate in social ontology and moral philosophy regarding the normativity of conventions. The asymmetry you describe—leniency toward tourists, severity toward locals—suggests that conventional obligations are not monolithic but depend on a specific relationship between the agent and the practice. Below is a reconstruction of the implicit theory at work, an evaluation of competing philosophical accounts, and an analysis of the deflationary reading.

  ### Reconstructing the Implicit Theory
  The practice presupposes a **Membership-Based Epistemic Theory** of conventional obligation. On this view, conventions generate obligations not merely through the receipt of benefits (Fairness) or the existence of a coordination equilibrium (Lewis), but through **participation in a joint commitment** (Gilbert) or membership in a specific normative community.

  The asymmetry implies two conditions for blameworthy violation:
  1.  **Epistemic Condition:** The agent must know (or be reasonably expected to know) the convention.
  2.  **Membership Condition:** The agent must be a participant in the "plural subject" constituted by the convention.

  Tourists fail the Membership Condition (they are temporary guests, not co-authors of the practice) and often the Epistemic Condition. Locals satisfy both. This explains why tourists can accept benefits (the queue moves faster for everyone, including them) without incurring blame: the obligation stems from the *relationship* to the practice, not the *utility* derived from it.

  ### Evaluating Competing Views
  Does this pattern rule out specific theories of obligation?

  **1. The Benefit-Based View (Principle of Fairness)**
  *   *Theory:* If you accept the benefits of a cooperative scheme, you are obligated to follow its rules (Hart, Rawls).
  *   *Prediction:* Tourists and locals should be treated equally, as both benefit from the queue order.
  *   *Verdict:* **Strongly Challenged.** The fact that tourists are excused despite consuming the benefit suggests that benefit receipt is insufficient for obligation. Unless the theory is modified to require *voluntary acceptance* of benefits (which tourists arguably don't give), the raw data counts against a pure benefit-based account.

  **2. The Pure Coordination View (Lewis)**
  *   *Theory:* Conventions are solutions to coordination problems. Normativity is hypothetical: "If you want to coordinate, you ought to follow the rule."
  *   *Prediction:* Reactions should be purely instrumental. We correct anyone whose violation threatens the equilibrium.
  *   *Verdict:* **Compatible with behavior, incompatible with phenomenology.** A Lewisian might argue we don't correct tourists because they leave tomorrow (low cost to equilibrium). However, this struggles to explain the *emotional* difference: the "tut" of a local feels like moral indignation (a violation of right), whereas the shrug for a tourist feels like pragmatic tolerance. If it were pure coordination, a tourist violating a critical safety convention (e.g., driving on the wrong side) would be treated the same as a local. The fact that we often still excuse them initially suggests a non-instrumental element of membership.

  **3. The Joint Commitment View (Gilbert)**
  *   *Theory:* Conventions create a "plural subject." Violation is a betrayal of the mutual commitment to act as a body.
  *   *Prediction:* Only those who have entered the commitment (locals) can betray it. Outsiders (tourists) cannot violate what they never joined.
  *   *Verdict:* **Highly Compatible.** This best explains the "insider/outsider" asymmetry. The glare is a demand for fidelity to a shared commitment the tourist never made.

  ### The Deflationary Reading: Coordination vs. Morality
  You asked if the "glare" is just enforcement of a coordination equilibrium rather than moral blame.
  *   **The Argument:** The glare is a signal to restore efficiency. We don't signal tourists because the signal won't stick (they leave). We signal locals because it maintains the equilibrium.
  *   **The Verdict:** This reading explains the *strategy* of enforcement but fails to explain the *affect*. Pure coordination failures produce *annoyance* or *frustration*. Convention violations by insiders produce *indignation* or *resentment* (Strawsonian reactive attitudes). The feeling that the local has been *disrespectful*, not just inefficient, suggests the convention has acquired a moralized texture. Therefore, the deflationary reading is **incomplete**; it explains the cost-benefit analysis of correction, but not the normative force of the obligation itself.

  ### The Visitor Transition
  Is there a principled point where "I didn't know" stops working?
  Yes, but it is a gradient of **Epistemic Responsibility**, not a switch of Consent.
  *   **Phase 1 (Arrival):** Presumed ignorance. Obligation is suspended.
  *   **Phase 2 (Integration):** A "reasonable person" standard applies. After a month, you are expected to have observed the pattern. The obligation activates not because you signed a contract, but because your continued presence implies a willingness to integrate into the coordination scheme.
  *   **Phase 3 (Residency):** You are now a co-sustainer of the convention. Violation signals not ignorance, but a refusal to uphold the shared practice.
  This suggests obligation is **gradually acquired** through the accumulation of reasonable expectation of knowledge, rather than a binary switch of consent.

  ### Settled vs. Contested
  In the philosophy of social norms, there is consensus on the *function* of conventions, but deep disagreement on their *normative source*.

  *   **Settled:** Conventions are distinct from moral laws in origin (arbitrary vs. categorical); Common knowledge is required for a convention to exist; Ignorance generally mitigates blame.
  *   **Contested:** Whether conventions generate genuine *moral* obligations or merely rational expectations; Whether the binding force comes from fairness, commitment, or coordination value; Whether "membership" is a metaphysical reality or a heuristic.

