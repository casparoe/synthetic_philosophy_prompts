answer: |-
  Your hypothesis is remarkably close to the mark: this is primarily a case of **different-questions** masquerading as a substantive disagreement, though it has substantive consequences for how assumptions are justified. The "disagreement" persists because both sides use the word "causation" to label distinct projects: the Lewisian tradition is engaged in *metaphysical grounding* (providing truth conditions for causal claims), while the Pearl-Woodward tradition is engaged in *epistemic representation* (providing inference rules for agents manipulating variables). The friction arises when metaphysicians demand ontological reduction from tool-builders, and tool-builders dismiss ontological questions as meaningless.

  The evidence for this diagnosis lies in the quiet convergence of their formalisms. You noted that Pearl's semantics for the $do$-operator relies on structural counterfactuals; this is explicit in the "Ladder of Causation." Pearl treats interventions (Rung 2) and counterfactuals (Rung 3) as distinct but compatible within a single Structural Causal Model (SCM). The $do$-operator is syntactically defined by graph mutilation, but its semantics are often cashed out via counterfactual quantities ($Y_x$). Conversely, modern metaphysicians like Halpern and Pearl (2005) have adopted SCMs to precisify Lewis's vague "similarity of possible worlds," effectively importing the interventionist's toolkit to solve the counterfactualist's backtracking problems. Woodward, meanwhile, explicitly defends against the circularity charge by arguing that interventionism is not a reductive project (defining cause in non-causal terms) but a functional one (distinguishing causal from spurious relations using a primitive notion of manipulation). The "circularity" is a feature, not a bug: causation is taken as primitive to organize knowledge, not reduced to physics to satisfy metaphysics.

  Regarding your transportability problem: the formal machinery is largely **invariant** under this dispute. Transportability relies on the assumption of *mechanism invariance*—that the structural equations governing $Y$ given $X$ and $Z$ remain stable across populations even if the distribution of $Z$ changes. Whether you justify this stability via Lewisian "closest possible worlds" or Woodwardian "invariant generalizations," the mathematical operation (e.g., re-weighting via the g-formula or using selection diagrams) remains identical. The dispute only matters if you are asked to *defend* the invariance assumption itself; a metaphysician might demand a deeper account of *why* a mechanism is stable, while an epidemiologist need only assert that there is no evidence of effect modification. For the purpose of estimation and identification, the "do" operator functions as a robust syntactic token that both traditions can agree upon, even if they disagree on what makes it true.

  Progress will not come from resolving "what causation really is," but from delineating the boundary conditions where the two projects diverge in practice. A genuine advance would be a taxonomy of assumptions specifying when metaphysical grounding is required to justify structural stability versus when predictive adequacy suffices. We should not expect a unified theory of causation because the unified theory already exists (the SCM); the remaining conflict is merely disciplinary turf wars over who owns the interpretation.

  \answer{different-questions/substantive} Progress consists in abandoning the search for a single definition of causation in favor of a taxonomy specifying which structural assumptions license inference in which contexts.
