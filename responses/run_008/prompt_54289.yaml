answer: |-
  Your editor is onto something, but she's identified the weapon, not the war. The inference from "unconscious activity" to "unconscious deciding" is indeed the pivot point, but *why* that inference is contested reveals the deeper structure you're looking for.

  Here is the diagnosis of the stalemate, broken down by the layers of the disagreement. You can use this architecture to build the courtroom dialogue so that both sides sound competent, not caricatured.

  ### 1. The Surface Layer: Operational Definitions (The "Verbal" Dispute)
  Your intuition that this might be verbal is correct, but it's more specific than just using different words. It is a **category mismatch between process and event.**

  *   **The Neuroscientist's Definition:** A "decision" is the point of no return in a causal chain. It is the moment the neural cascade becomes sufficient to trigger the action. In the Libet paradigm, the Readiness Potential (RP) is that cascade. Therefore, the decision happens at the onset of the RP.
  *   **The Phenomenologist's Definition:** A "decision" is a commitment. It is the moment an intention is formed and ratified. In this view, the RP is merely *preparation* or *urge*, not a decision. You can prepare to move and then stop (Libet himself believed in "free won't").

  **The Stalemate:** The two sides are measuring different things but calling them by the same name. The neuroscientist measures *causal sufficiency*; the philosopher measures *conscious commitment*. When the neuroscientist says, "The brain decided 300ms before you knew it," the philosopher hears, "The engine revved before you put it in gear," and replies, "Revving isn't driving."

  **For the Novel:** Have the prosecutor attack the definition. *"Dr. X, does your machine distinguish between a twitch and a choice? Or does it simply measure voltage?"*

  ### 2. The Deep Layer: Ontology of the Agent (The "Person" Dispute)
  This is where your suspicion about "what a person even is" hits the mark. This is the primary engine of the deadlock.

  *   **Camp A (The Brain as Agent):** This view implicitly treats the brain as the homunculus. If the brain initiates the signal, *that* is the agent acting. The conscious "I" is just a user interface, a dashboard that lights up after the engine has already turned over. If the dashboard doesn't steer the car, it has no free will.
  *   **Camp B (The Person as Agent):** This view argues that the brain is an *organ* of the person, not the person itself. A kidney filters blood unconsciously; we don't say the kidney "decided" to filter. Similarly, the brain prepares actions unconsciously as part of the person's wider agency. The "decision" belongs to the whole person embedded in a context, not to a specific millisecond of neuronal firing.

  **The Stalemate:** You cannot empirically disprove one ontology with the tools of the other. Neuroscience is methodologically reductionist (it must look at parts to understand the whole). If you start with the assumption that the *brain* is the decider, the data will always show unconscious deciding. If you start with the assumption that the *person* is the decider, the data shows neural preparation for personal action.

  **For the Novel:** The defense lawyer is arguing Camp A (The brain made him do it). The prosecutor should argue Camp B (The brain is just the tool he used to do it).

  ### 3. The Ecological Layer: The Task Validity (The "Wrist Flick" Problem)
  This is the strongest empirical objection to the Libet findings, and it is where your editor's theory about inference gets tested.

  The Libet experiments involve **arbitrary, spontaneous motor actions** (flex a wrist whenever you feel like it). There is no reason, no motive, and no consequence.
  *   **The Critique:** Most crimes (and most meaningful human actions) are **reasoned, motivated, and contextual.**
  *   **The Inference Gap:** Inferring that a premeditated murder operates like a spontaneous wrist flick is a massive leap. In complex decisions, neural activity ramps up over days or weeks, not milliseconds. The "readiness potential" for a planned crime might be the planning itself, which *was* conscious.

  **The Stalemate:** Proponents of the "no free will" argument claim the mechanism is the same, just scaled up. Opponents claim the mechanism is fundamentally different (reflexive vs. deliberative systems).

  **For the Novel:** This is the prosecutor's best line of attack. *"This study measures when a finger twitches, Counselor. My client is charged with shooting a man. Are you telling this jury that murder is the same thing as a twitch?"*

  ### Addressing Your Editor's Theory
  Your editor suggests the fight is about whether you're allowed to infer "unconscious deciding" from "unconscious activity."
  **Verdict:** She is right, but with a caveat. The disagreement isn't just about the logic of the inference; it's about the **burden of proof.**

  *   **Skeptics say:** If you can predict the action from brain data before the report, the burden is on the free-will defender to show where the "freedom" enters the chain.
  *   **Defenders say:** Predicting an urge isn't predicting a decision. The burden is on the skeptic to show that the conscious mind *couldn't* have vetoed the action (the "free won't" argument).

  Since we cannot measure a "veto" neurally with the same precision as an initiation, the data remains ambiguous. Both sides claim the ambiguity supports them.

  ### What Would Progress Look Like?
  You asked for honesty on whether better experiments could settle this.
  **The Answer:** No. Not on this specific track.

  We are hitting the limits of what the paradigm can tell us. We can get better at predicting actions from fMRI data (and we have), but that only pushes the "unconscious activity" window back further; it doesn't explain the *nature* of the will.

  **Real progress would look like one of two things:**
  1.  **A New Distinction:** Abandoning the binary "Free Will vs. Determinism" for a functional model. For example, distinguishing between *control* (can I stop myself?) and *authorship* (did this originate from my values?). The law cares about control; the metaphysics cares about authorship.
  2.  **A Paradigm Shift:** Moving away from millisecond-level timing of motor cortex activity toward network-level analysis of deliberation. But even then, you run into the "Person vs. Brain" ontology problem again.

  ### The Honest Ending for Your Lawyer
  Your editor's instinct for the ending is the most useful thing for your book. The lawyer isn't lying; she is **code-switching.**

  *   **The Courtroom Dialect:** The law operates on "folk psychology." It requires a discrete moment of *mens rea* (guilty mind). It assumes a unitary self that chooses.
  *   **The Neuroscience Dialect:** Neuroscience operates on causal chains. It assumes a system that processes.

  When the lawyer uses the Libet data, she is trying to force the Courtroom Dialect to accept the Neuroscience Dialect's definition of "choice." She knows the jury won't accept "there is no self," so she translates it to "his brain decided before he did."

  **The Diagnosis in a Sentence:**
  The debate is stuck because it is an **empirical measurement of a metaphysical concept.** They are trying to weigh a ghost with a scale.

  **Advice for the Scene:**
  Make the lawyer's argument compelling but vulnerable. She should win on the *timing* (the data is real) but lose on the *translation* (the meaning is contested). The most dramatic tension comes not from whether the science is fake, but from whether the science *matters* to the definition of guilt.

  If you want the scene to feel authentic, have the prosecutor concede the neuroscience but reject the *jurisprudence*.
  *"I accept your timeline, Doctor. I accept his brain fired before he felt it. But he didn't object. He didn't stop. He let the brain finish the sentence it started. And in this court, that is still a choice."*

  That captures the stalemate perfectly: The data is agreed upon; the implication is not.
