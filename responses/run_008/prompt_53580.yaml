      *   *The Pivot:* The transition from "Biological Layers" to "AI Classification." If the reader doesn't grasp that Gregorian implies *externalizing* cognition (tools/culture), they will just think "Talking = Gregorian."
      *   *Test:* If a reader says, "So AI is Gregorian because it writes code," you failed. It needs to be "AI is Gregorian because it uses human data as a tool, but lacks Popperian simulation." (Or whatever argument the piece makes).
