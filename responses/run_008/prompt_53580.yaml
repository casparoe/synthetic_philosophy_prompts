  2.  **Deconstruct the Core Framework (Dennett's Tower):**
      *   *Darwinian:* Trial and error happens in the genome over generations. (The creature is pre-wired).
      *   *Skinnerian:* Trial and error happens in the lifetime via reinforcement. (Try, fail, die/learn).
      *   *Popperian:* Trial and error happens in the head before acting. (Simulation).
      *   *Gregorian:* Trial and error happens using tools/culture/language. (Offloading cognition).
      *   *Crucial Nuance:* These aren't mutually exclusive species categories. A human is all four. A rat is mostly Darwinian/Skinnerian, maybe rudimentary Popperian. An AI is... complicated (this is the hook).

  3.  **Address the "One Carrying Example" Challenge:**
      *   *Option A: The Frog.* Good for Darwinian (snap reflex). Hard to make Gregorian (frogs don't use tools/language).
      *   *Option B: Blue Jay/Monarch.* Good for Skinnerian (avoidance). Hard for Gregorian.
      *   *Option C: The Maze.* (User suggested).
          *   *Darwinian:* Instinct to explore/forage.
          *   *Skinnerian:* Rat runs maze, hits dead end, gets shock/no cheese, learns path.
          *   *Popperian:* Human (or smart animal?) visualizes the maze before walking.
          *   *Gregorian:* Human draws a map, uses a compass, or asks someone else.
      *   *Critique:* The Maze is strong because it scales. It allows for the AI comparison (AI simulating the maze vs. AI trained on maze data).
      *   *Decision:* The Maze is the strongest candidate. It's spatial, intuitive, and allows for "internal simulation" vs. "external tool" distinctions clearly.

  4.  **Determine Sequencing & Structure:**
      *   *Problem:* If I start with the Tower, it's abstract. If I start with the conflict (AI vs. Animal people), it's engaging.
      *   *Solution:* Start with the conflict. Show the misunderstanding. Introduce the Tower as the *translator*.
      *   *The Ladder Trap:* Must explicitly state early that these are *layers of control*, not *stages of evolution*. A human uses Darwinian reflexes (blink) and Gregorian tools (notebook) simultaneously.
      *   *Order:*
          1.  Hook: The Argument (AI vs. Bio).
          2.  The Tool: Dennett's Tower (introduced as layers, not ladder).
          3.  The Example: The Maze (walking through the layers).
          4.  The AI Twist: Where does the LLM fit? (The Gregorian trap).
          5.  Conclusion: Why the distinction matters.

  5.  **Address Misconceptions:**
      *   *Evolutionary Ladder:* Counter by emphasizing *stacking*. We don't shed Darwinian traits; we build on them.
      *   *Popperian = Conscious:* Need to define Popperian as "internal selection," not necessarily "feeling." A thermostat is not Popperian; a chess engine might be (in a limited sense).
      *   *LLMs = Gregorian:* This is the killer. LLMs speak (Gregorian trait) but do they *think* (Popperian) or just predict? This needs to be the climax, not the whole piece.

