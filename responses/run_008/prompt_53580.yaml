      *   **Core Framework:** Daniel Dennett's "Tower of Generate-and-Test" (Darwinian, Skinnerian, Popperian, Gregorian).
      *   **Key Problems to Solve:**
          *   Avoid "four labeled boxes" structure.
          *   Avoid the "evolutionary ladder" misreading (species climbing up).
