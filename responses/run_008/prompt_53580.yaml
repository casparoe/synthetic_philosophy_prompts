      *   *Wait, better idea:* **Navigation.** It works for bacteria (chemotaxis - Darwinian), Rats (Skinnerian), Humans (Popperian planning), Humans with GPS (Gregorian). AI? AI with GPS data.
      *   *Actually, stick to the User's "Maze" instinct.* It's classic cognitive science. Let's make it a *T-Maze* that changes.
      *   *Wait, the "Carrying Example" constraint:* It needs to show *all four*.
      *   *Revised Example:* **Avoiding Poison.**
          *   Darwinian: Bitter taste reflex (Gag).
          *   Skinnerian: Eat berry, get sick, don't eat again.
          *   Popperian: See berry, remember sickness, *don't eat* without trying.
          *   Gregorian: Someone tells you "That berry is poison" / Label on bottle.
      *   *Why this is better:* It directly addresses the AI safety/alignment conversation implicitly. AI doesn't get "sick" (Skinnerian cost), can it simulate "sickness" (Popperian)? Does it listen to warnings (Gregorian)?
      *   *Decision:* The "Poison/Bad Outcome" example is stronger for the AI angle than the Maze. It raises the stakes. But the Maze is more "Cognitive." Let's stick to the **Maze/Navigation** but frame it as **Finding the Goal**. It's more neutral.
      *   *Wait, let's look at the "Talk Past Each Other" angle.* Animal people care about *mechanism*. AI people care about *performance*.
      *   *Okay, final decision on Example:* **The Maze.** It's the most versatile for "planning" vs "learning."
      *   *Structure:*
          1.  Hook: The Definition War.
          2.  The Lens: Dennett's Tower (Layers, not Ladder).
          3.  The Walkthrough: The Maze (Darwinian -> Gregorian).
          4.  The AI Problem: Where does the Chatbot fit? (The Gregorian Illusion).
          5.  Payoff: Why mechanism matters more than output.

  9.  **Refining the "Load-Bearing" Warning:**
      *   The most dangerous moment is defining **Popperian**. If the reader thinks "Popperian = Human Soul," they will reject AI having any cognition. If they think "Popperian = Any Prediction," then a thermostat is Popperian. It must be "Internal Selection of Behaviors."
