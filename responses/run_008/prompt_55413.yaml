answer: |-
  Based on the track record you've described, your professor is running a specific, rigorous interpretation of Nozick that leans heavily on the **"Separateness of Persons" argument extended to animals via the "Superior Beings" thought experiment.**

  He is not a pure utilitarian (Rule 2), nor does he hold the hybrid view that pain is constrained but killing is just weighted (Rule 3). The fact that he ruled against *painless* killing in the "10,000 cows" and "bat bone" cases shows he views **death itself as a harm that triggers a constraint**, not just a negative utility to be weighed. However, he likely isn't an *absolute* deontologist regarding animals (otherwise the "utilitarianism for animals" slogan wouldn't get airtime).

  He is running **Rule 1: Strict Side Constraints with a High Threshold for Override.**
  *   **The Rule:** Animals possess a moral status that generates side constraints against using them as mere means. These constraints cannot be overridden by trivial or moderate human *wants* (music, fun, better equipment, vegetables). They can *only* be overridden by catastrophic human *needs* (survival, preventing massive suffering).
  *   **Why this fits:** It explains why he rejected the "brutalization" argument (the wrongness is in the violation of the animal's constraint, not our character). It explains the "Superior Beings" intuition (we want constraints respected). It accommodates the "utilitarianism for animals" slogan only in the sense that the threshold for overriding the constraint is lower for animals than for humans, but still very high.

  ### Predictions for Thursday's Cases

  **1. The Monkey Research Case (Intense Pain vs. Huge Human Cure)**
  *   **Verdict:** **Permissible (with significant moral residue).**
  *   **Reasoning:** This is the first case you've presented where the human benefit crosses the "High Threshold" from *Want* to *Need*. Nozick's framework allows for trade-offs when the stakes are existential or involve massive suffering, provided the animals aren't treated *merely* as means without acknowledgment of the violation. Your professor will likely argue that while we would forbid this on humans (Kantian constraint), the "utilitarianism for animals" slogan permits it here because the human benefit is sufficiently catastrophic to override the animal's constraint.
  *   **Fit:** Fits Rule 1 (Threshold met). Fits Rule 2 (Math works).

  **2. The Garden Deer Case (Painless Killing vs. Vegetables)**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This is structurally identical to the "bat bone" and "hunting for fun" cases. Saving a vegetable garden is a property/convenience interest, not a vital need. It does not meet the high threshold required to override the side constraint against killing. The benefit is "modest," which you noted is "way less than curing a disease."
  *   **Fit:** Fits Rule 1 (Threshold not met). Conflicts with Rule 2 (A strict utilitarian might say 1 deer < summer of veggies for a family, but your professor has already shown he weights animal life heavily).

  **3. The Roadkill Case (Eating vs. No Harm)**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** No constraint is violated because no harm was inflicted by the agent. The animal was not used as a *means* to its death; it is merely being used after the fact.
  *   **Fit:** All rules agree here.

  ### Is the Roadkill Case a Trap?
  **Yes, absolutely.**
  Do not spend your seminar capital treating this as a deep philosophical puzzle. Every plausible ethical framework (Utilitarianism, Rights Theory, Virtue Ethics) agrees that eating roadkill is permissible because no *new* harm is created.
  *   **Why he's asking it:** He is testing to see if students conflate **killing** with **eating**. If someone argues it's wrong to eat the roadkill, they reveal they don't understand that the locus of the wrongness in the previous cases was the *infliction of harm/death*, not the consumption of meat.
  *   **Strategy:** Dismiss it quickly. "This seems straightforwardly permissible across all the views we've discussed, as the constraint is against *inflicting* harm, not benefiting from a harm that occurred independently of our agency. It confirms that the wrongness in the previous cases was agent-relative harm."

  ### The Decisive Test Case
  To distinguish **Rule 1 (High-Threshold Constraints)** from **Rule 2 (Straight Tradeoff/Weighted Utilitarianism)**, you need a case where the **Aggregate Human Benefit is Massive**, but the **Human Need is Low**.

  **The Case to Bring Up:**
  > "Imagine a cosmetic company develops a new lotion that prevents mild, non-medical skin dryness. It would make **10 million humans** significantly more comfortable and confident. To test and produce it, they must **painfully kill one chimpanzee**. The benefit is aggregate and huge (10 million people), but the individual benefit is trivial (not a health need). Is this permissible?"

  **Why this distinguishes the rules:**
  *   **Rule 2 (Straight Tradeoff/Utilitarian):** **Permissible.** 10 million units of human comfort > 1 chimpanzee life. The math clears the bar.
  *   **Rule 1 (High-Threshold Constraints):** **Wrong.** Even though the *aggregate* benefit is huge, it does not meet the *threshold of need*. Side constraints cannot be overridden by aggregated trivial wants, no matter how many people have them. (This mirrors Nozick's argument against utilitarianism for humans: you can't sacrifice one person even to prevent mild headaches for a million others).

  **Why this will work in class:**
  It forces your professor to choose between the "Utilitarianism for animals" slogan (which suggests the math matters) and the "Superior Beings/Side Constraint" intuition (which suggests the *type* of justification matters more than the sum). If he says "Wrong," he admits animals have near-Kantian constraints. If he says "Permissible," he admits it's really just weighted utilitarianism. Given his sneering at "brutalization" and love for the "Superior Beings" argument, my money is on him saying **Wrong**, which cements Rule 1.
