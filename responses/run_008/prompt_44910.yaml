answer: |-
  **FELICITY CONDITIONS, LTD. — LIMITED WARRANTY FOR STANDARD ILLOCUTIONARY ACTS**

  Thank you for purchasing a Performative Utterance Package from Felicity Conditions, Ltd. This document outlines the scope of coverage for your newly acquired speech acts, including but not limited to wedding vows, formal apologies, christenings, and contract acceptances. Please read carefully. By retaining this utterance, you agree to the following terms.

  **1. COVERAGE OF MISFIRES**
  Felicity Conditions, Ltd. warrants that all purchased utterances are free from procedural defects at the time of delivery. A "Misfire" is defined as any instance wherein the accepted conventional procedure does not exist, is not applicable to the participants, or is executed incorrectly or incompletely. This includes, but is not limited to, vows pronounced by an unauthorized officiant, bids made without auctioneer recognition, or sentences passed by unauthorized judges. In the event of a Misfire, the act is null and void *ab initio*. Felicity Conditions, Ltd. will replace the defective utterance at no cost. No liability is assumed for consequences arising from acting as though the void act were valid.

  **2. EXCLUSION OF ABUSES**
  This warranty does not cover "Abuses" of the illocutionary act. An Abuse occurs when the procedure is successfully executed, but the participant lacks the requisite thoughts, feelings, or intentions (e.g., promising without intent to fulfill, apologizing without remorse). While such acts are infelicitous, they are not void. The customer acknowledges that sincerity is a user-supplied component not manufactured by Felicity Conditions, Ltd. Consequently, no refund or replacement will be issued for utterances that are hollow, insincere, or subsequently betrayed by the speaker. An insincere promise remains a promise; the resulting breach of trust is not a defect in workmanship.

  **3. PERLOCUTIONARY EFFECTS**
  Coverage is strictly limited to illocutionary force. Felicity Conditions, Ltd. makes no guarantees regarding perlocutionary consequences—the effects the utterance may have on the feelings, thoughts, or actions of the audience. For example, while a Formal Apology Package guarantees the successful performance of an apology, it does not guarantee forgiveness, reconciliation, or the alleviation of guilt. The Company is not liable for hearts unchanged, arguments unresolved, or wars unended. Sequelae are the sole responsibility of the user.

  **4. ETIOLATED UTTERANCES**
  Utterances produced in non-standard contexts are considered "etiolated" and carry no illocutionary force. This includes speech acts performed on stage, in poetry, during soliloquy, or at open-mic nights. Such uses are expressly excluded from this warranty. All sales of utterances intended for fictional or dramatic consumption are final. Felicity Conditions, Ltd. is not liable if a marriage vow recited during a rehearsal dinner fails to bind the participants legally or morally.

  **5. UPTAKE REQUIREMENTS**
  Successful performance requires securing "uptake" from the audience. The customer is responsible for ensuring the hearer understands the meaning and force of the utterance. If the audience fails to hear, understand, or recognize the act as intended, the act may misfire. Felicity Conditions, Ltd. is not liable for failures of uptake resulting from ambient noise, language barriers, or audience inattention. It is the customer's duty to verify comprehension before concluding the procedure.

  **6. WARRANTY VALIDITY**
  This warranty document is itself a performative utterance of the warranting type. Its force depends upon the authorization of the signatory. If the agent issuing this document lacked the authority to bind Felicity Conditions, Ltd., this warranty is void. Please note that because a failed procedure cannot be retroactively performed by the same office that failed to perform it, the Company cannot issue a rider to validate this document if it is found to be unauthorized. The validity of this warranty is contingent upon the very conditions it describes.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I return a Wedding Vow Package if the marriage fails?**
  A: Returns are accepted only if the marriage was void *ab initio* due to a Misfire (e.g., the officiant was not licensed, or one party was already married). If the procedure was correctly executed and the parties were eligible, the marriage is valid regardless of subsequent unhappiness, infidelity, or incompatibility. These constitute Abuses or perlocutionary failures, which are not covered. We do not accept returns on merely unhappy marriages.

  **Q: My apology was accepted, but my friend is still angry. Is this covered?**
  A: No. The anger is a perlocutionary effect. The apology was successful; the emotional resolution is not warranted.

  **Q: What if I say "I bet" but no one takes the bet?**
  A: Without uptake, the act is incomplete. Please ensure audience participation before finalizing wagers.
