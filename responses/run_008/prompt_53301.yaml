answer: |-
  This is a sophisticated impasse, and your frustration is warranted. You are correct that the debate has calcified. To give you the diagnosis you asked for: this is neither a purely substantive disagreement about the world nor a merely verbal dispute about definitions. It is a **category error regarding the level of explanation.**

  The debate is stuck because "pleasure" is being asked to perform two incompatible theoretical jobs simultaneously:
  1.  **The Phenomenological Job:** To name a specific, identifiable type of conscious experience (a natural kind of mind).
  2.  **The Axiological Job:** To name the common denominator of value (the currency of well-being).

  The stalemate persists because every proposed theory of pleasure is an attempt to optimize for one of these jobs while minimizing the damage to the other. The "heterogeneity problem" is only lethal if you assume the Phenomenological Job must be done by a *sensation* in order to fulfill the Axiological Job.

  Here is the diagnosis grounded in the hard cases, followed by the honest truth about progress.

  ### 1. The Diagnosis: The Two-Jobs Problem

  Your intuition that this is a "proxy war about hedonism" is half-right. It is strategic, but not merely cynical. The strategy is necessitated by the conflict between the two jobs.

  *   **The Phenomenologists (Crisp, etc.)** prioritize Job 1. They insist pleasure must feel like something specific.
      *   *Cost:* They struggle with Job 2. If the "glow" of a bath and the "glow" of a proof are phenomenologically distinct (as heterogeneity suggests), then "pleasure" fails as a common currency. Hedonism becomes a disjunction of unrelated goods.
  *   **The Attitudinalists (Feldman, etc.)** prioritize Job 2. They define pleasure as "being pleased that..." or "enjoying."
      *   *Cost:* They sacrifice Job 1. There is no distinctive "attitude" feel. This makes "pleasure" invisible from the inside, which violates the folk intuition that pleasure is a *sensation*.
  *   **The Seeming-Theorists** try to bridge the gap by making it a "quasi-perceptual" evaluation.
      *   *Cost:* They inherit the problems of both. Is a seeming a feeling or a judgment?

  **Why Pain Asymbolia is Recruited by Everyone**
  You noted that asymbolia is used by all sides. This is the smoking gun for the diagnosis.
  *   **The Data:** The patient has the sensory discrimination of pain (Job 1: Sensation) but lacks the negative affective reaction (Job 2: Disvalue).
  *   **The Attitudinalist says:** "See! The sensation isn't the bad part. The *aversion* is the pain. Therefore, pleasure/pain is an attitude."
  *   **The Phenomenologist says:** "See! The sensation is distinct from the suffering. We can isolate the 'hurt' quality. Therefore, there is a specific phenomenology of pain."
  *   **The Diagnosis:** Asymbolia proves that sensation and affect are *separable*. The debate isn't about the data; it's about which separable component gets the label "Pleasure/Pain." Because the folk concept fuses them, philosophers fight over which half is the "real" one.

  **False Pleasures (The Deceived Husband)**
  If a man enjoys his wife's fidelity, but she is cheating (and he never finds out):
  *   **Attitudinalist:** He is enjoying it. His well-being is boosted. (Prioritizes Job 2: Internal state determines value).
  *   **Phenomenologist/Objectivist:** It's a false pleasure. It lacks the right object. (Prioritizes a hidden Job 3: Connection to reality).
  *   **Diagnosis:** This shows that for the Axiological Job, we care about *truth* sometimes, but for the Phenomenological Job, we only care about *feel*. The theories diverge because the requirements of well-being diverge from the requirements of consciousness.

  ### 2. Is it Verbal, Substantive, or Two Questions?

  It is **Two Questions Under One Heading**, disguised as a Substantive Dispute.

  If this were merely verbal, we could stipulate definitions and move on. ("Let's call sensation-type pleasure P1 and attitude-type pleasure P2.") But we don't move on. Why? Because both sides believe their definition captures the *normative weight* of the concept.

  *   When Feldman says pleasure is an attitude, he isn't just offering a dictionary definition; he is claiming that *this* is what matters for a good life.
  *   When Crisp says pleasure is a feeling, he is claiming that *this* is what we are actually tracking when we pursue value.

  The disagreement is substantive about **value**, but confused about **mind**. They are arguing about what makes life go well (Axiology) by arguing about what consciousness is like (Phenomenology). But consciousness and value might not map 1:1.

  ### 3. What Would Progress Look Like?

  You asked for honesty. Here it is: **There is no thought experiment that will break this stalemate.**

  We have run the Experience Machine. We have run the Orgasmatron. We have run the Asymbolia cases. The reason these don't work is that the stalemate is **methodological**, not empirical.

  *   **The Hedonist** will always interpret the intuition pump to preserve the aggregability of value.
  *   **The Anti-Hedonist** will always interpret the intuition pump to preserve the heterogeneity of experience.

  **Progress requires Dissolution, not Solution.**
  Progress would look like admitting that "Pleasure" is a folk-psychological placeholder that covers at least three distinct mechanisms, which evolution has bundled together but philosophy must untangle:
  1.  **Hedonic Tone:** Raw sensory valence (sweet taste, warmth). Heterogeneous.
  2.  **Liking (Core Affect):** The sub-personal reward signal (dopaminergic 'wanting' vs opioid 'liking').
  3.  **Enjoyment (Attitude):** The cognitive stance of being "for" an experience.

  If the reading group accepts **Conceptual Pluralism**, the debate dissolves:
  *   **For Phenomenology:** Admit heterogeneity. There is no single "pleasure sensation." There are many positive tones.
  *   **For Axiology:** Admit that what aggregates for well-being is likely the *Attitude* (Enjoyment), not the *Tone*.
  *   **The Result:** Hedonism survives as "Enjoyment-ism," but it ceases to be a theory about a specific *feeling*.

  **Why hasn't this happened?**
  Because it feels like a surrender.
  *   The Phenomenologist feels they lose the "oomph" of pleasure if it's just an attitude.
  *   The Hedonist feels they lose the "common currency" if it's heterogeneous sensations.
  *   Both want a Unified Theory of Mind and Value. They want one thing (Pleasure) to explain both why we seek things (Psychology) and why those things are good (Ethics).

  **The Hard Truth:**
  The question "What is pleasure?" is badly posed because it assumes unity where there is likely none. It is like asking "What is a tool?" A hammer and a software script are both tools, but looking for their common *physical* quality is a mistake. They share a *functional* role.

  Pleasure is likely a functional role (signaling fitness/value) realized by heterogeneous states.

  **Recommendation for the Group:**
  Stop asking "What is pleasure?" Start asking:
  1.  "In this specific argument, do we need pleasure to be a *feeling* or a *valuation*?"
  2.  "If we separate 'positive affect' from 'judgment of goodness,' does hedonism survive?"

  If you make that distinction, the heterogeneity problem vanishes for the axiologist (who grabs the judgment) and the phenomenological problem vanishes for the scientist (who admits affect is diverse). The stalemate breaks only when you stop trying to save the word "pleasure" and start saving the *work* it was supposed to do.

  If you aren't willing to fragment the concept, you are right to remain confused. The confusion is the correct response to a demand for unity that nature does not provide.
