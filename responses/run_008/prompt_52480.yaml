prompt: |-
  I'm in a reading group that's been working through some philosophy of mind stuff, and one of the guys there is a big Dennett fan and keeps bringing up "free-floating rationales." Last week I asked him to actually explain the term to me and this is more or less what he said: free-floating rationales are the reasons behind evolution's designs, but they aren't reasons that anyone thought up, stated, or is aware of -- the heart's rationale is to pump blood, but no designer intended that and no organism knows it, and that's what makes the rationale "free-floating." So far so good I think, but then he went on: since the rationale exists only in the explanations we give after the fact, it's basically a projection of biologists onto nature -- it lives in our theories, not in the world. And from there he said that because of this there's no real fact of the matter about why anything evolved, just competing stories we tell, some of which happen to predict better than others, and that this is the lesson we should take over into other domains instead of assuming things have genuine functions. He finished by saying Dennett's big point is that reasons existed before reasoners did, and that once you grant that, you can watch Mother Nature gradually figuring things out over billions of years.

  I'm inclined to like the picture because it sounds very deflationary and science-y, but something felt like it shifted halfway through his explanation -- the early part sounded like the reasons are really out there waiting to be discovered, and the later part sounded like the reasons are just something we invent. Those can't both be right, can they? Can you go through his summary and tell me which parts a careful Dennettian would accept, which parts are subtle misreadings (maybe conflations of claims Dennett keeps separate), and whether the deflationary conclusion he drew actually follows from the parts that are right? I'm also curious whether the "reasons before reasoners" line at the end sits consistently with everything before it in his own summary or whether it's in tension with the projection part.

  Please be upfront about where you're confident versus where you're reconstructing what Dennett would say from the general shape of his views, and flag the single point in your answer you'd be least willing to bet on. I'd rather have an honest "I think this is what he means but interpretation X is also defensible" than a clean story that papers over the disagreements.
