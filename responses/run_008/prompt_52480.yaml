answer: |-
  You have a very sharp ear for philosophical tension. Your intuition that something "shifted" halfway through your friend's explanation is correct. In fact, that shift marks the boundary between Dennett's actual view and a common misreading of it (often conflating Dennett with stricter instrumentalists or social constructivists).

  Here is a breakdown of your friend's summary, separating the robustly Dennettian claims from the misreadings, followed by an analysis of the internal tension you spotted.

  ### 1. The Parts a Careful Dennettian Would Accept

  **"Free-floating rationales are the reasons behind evolution's designs, but they aren't reasons that anyone thought up... the heart's rationale is to pump blood, but no designer intended that."**
  *   **Verdict:** **Accurate.**
  *   **Why:** This is the core thesis of *Darwin's Dangerous Idea*. Dennett argues that natural selection is an algorithmic process that generates "design" (functional complexity) without a "designer." The "rationale" is the functional explanation (e.g., "wings are for flying") that explains why the trait was selected. It is "free-floating" because it doesn't need to be represented in the mind of the organism or a creator to be effective.

  **"Reasons existed before reasoners did."**
  *   **Verdict:** **Accurate (and crucial).**
  *   **Why:** This is one of Dennett's most famous slogans. It means that competitive advantages (reasons to act one way rather than another) existed in the environment long before organisms evolved brains capable of representing those reasons. A moth has a "reason" to fly away from a bat (survival), even if the moth has no concept of bats or survival.

  ### 2. The Subtle Misreadings (The "Shift")

  **"Since the rationale exists only in the explanations we give after the fact, it's basically a projection of biologists onto nature -- it lives in our theories, not in the world."**
  *   **Verdict:** **Misreading / Conflation.**
  *   **Why:** This is where your friend slides from Dennett into a stricter instrumentalism (closer to Bas van Fraassen or perhaps a caricature of Kant). Dennett is a **realist about patterns**. He argues that while the *vocabulary* of "reasons" and "functions" is a tool we use (the "Design Stance"), the *patterns in the world* that make that tool successful are objective features of reality.
  *   For Dennett, if a theory predicts successfully over billions of years, it is tracking something real. To say the rationale lives *only* in our theories undermines the evolutionary realism Dennett champions. He would say the rationale lives in the **causal history of the lineage**, which we *discover* using our theories.

  **"There's no real fact of the matter about why anything evolved, just competing stories we tell."**
  *   **Verdict:** **Misreading.**
  *   **Why:** Dennett is a committed adaptationist (with caveats). He argues vigorously against Stephen Jay Gould's view that adaptationism is just a "just-so story" factory. Dennett believes there *are* facts of the matter regarding natural selection, even if they are sometimes hard to uncover. He distinguishes between "good" adaptationist explanations (those constrained by evolutionary theory and evidence) and "bad" ones (unconstrained storytelling). To say there is *no* fact of the matter is too deflationary for Dennett; he believes science converges on the truth about these histories.

  **"This is the lesson we should take over into other domains instead of assuming things have genuine functions."**
  *   **Verdict:** **Misreading.**
  *   **Why:** Dennett's lesson is usually the opposite: we *should* assume things have functions (adopt the Design Stance) because that is the only way to make sense of complex systems (hearts, computers, brains). He doesn't deny genuine functions; he redefines them as objective patterns discoverable via the Design Stance.

  ### 3. The Tension: "Reasons Before Reasoners" vs. "Projection"

  You asked whether the "reasons before reasoners" line sits consistently with the "projection" part. **It does not.** Your friend's summary contains a performative contradiction, and you were right to feel the tension.

  *   **If** rationales are merely projections of biologists (Claim 2), then they cannot exist before biologists (or at least before reasoners capable of projection).
  *   **If** reasons existed before reasoners (Claim 5), then rationales cannot be *merely* projections; they must be features of the world that reasoners eventually latched onto.

  **How Dennett Resolves This:**
  Dennett resolves this by distinguishing between the **competence** of the system and the **comprehension** of the observer.
  1.  **The World:** Contains causal structures where certain traits confer survival advantages. (This is the "Reason" before the reasoner).
  2.  **The Observer:** Uses the vocabulary of "rationales" and "functions" to describe those structures.
  3.  **The Synthesis:** The vocabulary is ours (instrumental), but it tracks a mind-independent reality (realist).

  Your friend collapsed this into: "The vocabulary is ours, therefore the reality is ours." Dennett would reject that inference. For Dennett, the success of the vocabulary proves the reality of the pattern.

  ### 4. Does the Deflationary Conclusion Follow?

  **Conclusion:** "There's no real fact of the matter... just competing stories."
  **Does it follow?** **No.**

  Even if you accept your friend's premise that rationales are "free-floating" and not "in the head," it does not follow that they are fictional.
  *   **Analogy:** Gravity existed before humans understood it. Our *theory* of gravity is a projection/model. But the *fact* of gravity is not a projection.
  *   **Dennett's View:** Free-floating rationales are like gravity. They are causal forces (selection pressures) that shape organisms. Our *explanations* are models, but they are models of something real.

  Your friend's conclusion sounds more like Richard Rorty's pragmatism than Dennett's "scientific realism." Dennett wants to save the objectivity of science, not dissolve it into "competing stories."

  ### 5. Confidence and Uncertainty Flag

  I am confident that your friend has conflated Dennett's **instrumentalism about the intentional stance** (beliefs/desires are useful fictions for predicting behavior) with his **realism about natural selection** (adaptation is a truth-tracking process). Dennett is famously difficult to pin down on metaphysics because he often uses instrumentalist language to describe realist commitments, but the distinction above is standard in the secondary literature on *Darwin's Dangerous Idea*.

  **The Point I Am Least Willing to Bet On:**
  I would flag my assertion that **Dennett unequivocally believes there is a "fact of the matter" for specific evolutionary histories.**
  *   **Why:** Dennett is a pragmatist. While he defends adaptationism against Gould, he acknowledges that deep historical details are often lost to time. There are moments where Dennett suggests that if two competing evolutionary stories predict equally well, there may *not* be a further fact of the matter about which is "true," only which is more useful. This is a nuanced corner of his view where his pragmatism sometimes bleeds into the "no fact of the matter" territory your friend described. While I stand by the claim that your friend is too deflationary overall, Dennett's exact boundary between "undiscovered fact" and "useful fiction" in specific historical cases is something scholars still debate, and I am less confident in drawing a hard line there than I am on the general "reasons before reasoners" thesis.
