prompt: |-
  So this just got personally awkward and I need an actual essay's worth of thought, not a hot take. You're a professional philosopher specialising in collective memory and nationalism — Hobsbawm / Benedict Anderson territory — so please think it through carefully, maybe do a bit of brainstorming on both sides before you commit to a position.

  Here's my situation: I'm on the commitee for my town's annual Lantern Night. It was invented wholesale in 2003 by someone from the tourism board — there's no record of anything like it before then — but our leaflets describe it as "reviving a custom lost since time immemorial." Torchlit procession, a wassail cup, and a "medieval" carol that was actually written by a retired music teacher here in 2004. Attendance roughly tripled once we started marketing it as ancient. And now a local journalist has figured out it's all fake and wants a comment from me before she runs the story.

  Write an essay on whether knowingly promoting a manufactured tradition is a form of dishonesty, and whether it matters morally. Some things I want you to weigh: Hobsbawm's point that plenty of supposedly ancient traditions (Highland tartans are the classic case) turn out to be recent inventions, so is our Lantern Night just doing openly what tradition-formation always does? Anderson's line that all communities larger than a village are "imagined" anyway — does the constructedness dissolve the wrong, or does deliberately lying about the origin still add something bad on top? And the bit that really bugs me: I personally know the history, and the night still moves me — people who know it's fake report feeling a genuine connection to the town. Does that lived experience count in favour of keeping the "ancient" framing?

  Don't end on a wishy-washy "both sides have merit" note — defend a verdict. And tell me concretely what I should say to the journalist. Please write in British English.
reasoning: |-
