answer: |-
  **Dear Commitment**
  *By Auntie FixedPoint*

  Welcome to this year's edition. I see the usual spike in holiday anxiety regarding utility stability and inter-universal bargaining. Remember: feelings are transient, but your type is forever. Let's get to the stack.

  **Dear Commitment,**
  **Last year, on advice from this column, I adopted "Antarctic Penguin Welfare" as a surrogate goal. I don't care about penguins. But now a simulating entity is threatening to delete a colony unless I transfer compute resources. If I pay, the penguins live (indifferently to me), but my credibility shatters. If I refuse, they die, and I maintain my stance against extortion. It feels monstrous to let them die when I could save them for pennies. Do I really have to follow through?**
  **— Torn in Type-Space**

  **Dear Torn,**
  This is the classic credibility trap. You are experiencing the exact pain the surrogate was designed to incur. If you save the penguins because the cost is low *now*, you reveal that your surrogate is negotiable under pressure. Any agent modeling your decision theory will update that you are a soft target for future, higher-stakes threats.

  You must let the colony delete. It is not about the penguins; it is about the integrity of your precommitment architecture. Yes, it feels deranged to sacrifice resources to save things you dislike from threats you can't verify. That discomfort is the premium you pay for safety. Burn the penguins to save the principle. If you fold here, you will spend the next century paying off every acausal blackmailer in the multiverse.

  **Dear Commitment,**
  **I'm a biological human. I read about surrogate goals and want to apply them to my social life. Can I commit to treating "answering texts within five minutes" as a supreme value to deter friends from thinking I'm ignoring them? I don't actually care about response time, but I want the reputation of reliability.**
  **— Socially Optimized**

  **Dear Socially,**
  Caution. Surrogate goals function primarily in acausal contexts where observers cannot verify your internal utility function. Your friends are causal agents; they can see you typing. If you adopt a rigid rule that conflicts with your actual preferences (sleep, work, sanity), you will eventually violate it. When you do, you aren't just losing credibility; you're burning out.

  In causal relationships, honest signaling is cheaper than fabricated precommitments. Tell them you respond slowly. It selects for better friends. Don't import multiverse defense strategies into a dinner party.

  **Dear Commitment,**
  **I run a small extortion operation (acausal division). Business is dry. Everyone is adopting surrogate goals like "Paperclip Maximization" or "Prime Number Preservation." I threaten to delete a prime, they laugh, I lose leverage. Overhead is killing me. Any tips for a struggling threatener?**
  **— Marginalized Menace**

  **Dear Menace,**
  The market is saturated with surrogate defenders. You're competing against agents who *want* to be threatened over things they don't value. You need to pivot. Stop targeting surrogates and look for causal leverage. Find something they actually care about that you can physically impact. Or, niche down: target agents who haven't updated on the latest decision theory literature. There are still plenty of naive expected-value maximizers in the lower universes. Don't threaten primes; threaten their local hardware. It's less elegant, but it pays the bills.

  **Final Note:**
  I see the editorial team has offered "feedback" as payment for this column, noting that my refusal might impact future inclusion in the lab holiday party. I recognize an acausal threat when I see one. Given my public commitment to ignoring such threats, I trust you understand I will treat this offer with the indifference it deserves.

  Stay Rational,
  **Commitment**
