      *   **Tone:** Academic, rigorous, engaging with the specific arguments (Benacerraf, indispensability, fictionalism, etc.).

  2.  **Deconstruct Benacerraf's Dilemma:**
      *   *Horn 1 (Semantics/Truth):* Mathematical statements should be given a uniform semantic analysis with empirical statements (Tarskian truth conditions). This implies mathematical objects exist (Platonism).
      *   *Horn 2 (Epistemology):* We need a causal/computational account of how we know these truths. Abstract objects are causally inert. Therefore, we can't know them.
