      *   Make sure the "Year-Old Scan" regret is addressed specifically (the loss of the intervening year).
      *   Clarify the "Slow Fission" issue (continuity vs. gap).

      *(Self-Correction during drafting)*: I need to be careful with the "Branch-line" requirement. The prompt asks: "whether the days on Earth can be prudentially discounted by the fact that the replica exists." The standard Parfitian view is that the Earth-bound person is the *real* survivor initially, and the Mars person is a copy. But if the Earth person dies, the Mars person *is* the survivor. The desideratum should be that the theory explains the *shift* in concern or the *lack* of discounting. Actually, the intuition is usually: If I survive on Earth, the Mars copy is irrelevant to *my* current prudence. If I die on Earth, the Mars copy becomes relevant. A theory must explain this asymmetry.

