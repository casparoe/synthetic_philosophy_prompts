answer: |-
  This is a meta-philosophical specification task. You are asking for the *conditions of adequacy* for a theory of personal identity/survival, rather than a solution to the problem itself. This is the correct move; as you noted, the literature often stalls because proponents assume different jobs for the theory to do.

  Below is a specification of six desiderata. I have categorized them by **Status** (Non-Negotiable vs. Parochial) to distinguish between logical/empirical constraints and intuition-based demands. I have also highlighted the structural tensions within the list.

  ### The Desiderata for a Theory of Survival

  #### 1. The Identity/Survival Decoupling Constraint
  *   **Motivation:** The Fission Case. If numerical identity is strictly one-to-one, but fission produces two psychologically continuous successors, identity must fail (you cannot be identical to two distinct people). However, it seems irrational to say you cease to exist or that survival matters less in fission than in ordinary death.
  *   **Success Condition:** The theory must explicitly distinguish *numerical identity* (a formal, transitive, one-to-one relation) from *what matters in survival* (prudential concern, anticipation, responsibility). It must explain how "what matters" can hold in degrees or one-to-many relations even if "identity" does not.
  *   **Status:** **Non-Negotiable.** Any theory that conflates these two concepts fails to handle fission without contradiction or absurdity (e.g., claiming you are both successors, violating logic, or claiming you die, violating intuition).

  #### 2. The Prudential Presentism Constraint (Branch-Line Case)
  *   **Motivation:** The Branch-Line Case. You step into the scanner. A replica wakes on Mars. Due to a glitch, the Earth-original is not destroyed immediately and lives for a few more days.
  *   **Success Condition:** The theory must explain why the Earth-bound days are *not* prudentially discounted by the existence of the Mars replica. While the Earth-original lives, *that* locus of consciousness is the primary object of self-concern. The theory must account for the shift in prudential focus: if the Earth-original dies, concern shifts to Mars; if Earth-original lives, Mars is a "copy." It must explain this asymmetry without relying on a magical "soul" marker.
  *   **Status:** **Non-Negotiable.** This captures the phenomenology of first-person concern. A theory that says you should be indifferent between your own continuing life and your replica's life *while you are still alive* fails to describe rational agency.

  #### 3. The Temporal Coherence Constraint (Year-Old Scan & Slow Fission)
  *   **Motivation:**
      *   *Year-Old Scan:* A scan is taken, you live a year, then the original is destroyed and the year-old scan is printed. There is a specific regret: a year of experiences was "stranded" and lost to the successor.
      *   *Slow Fission:* Hemisphere A is transplanted now; Hemisphere B is frozen and transplanted 30 years later.
  *   **Success Condition:**
      *   For the *Year-Old Scan*: The theory must validate the coherence of the regret. It must explain why the discontinuity (the lost year) reduces the "survival value" of the replica compared to a real-time teleportation, even if psychological continuity is eventually restored.
      *   For *Slow Fission*: The theory must adjudicate whether the 30-year gap breaks the continuity relation for the second candidate. It cannot simply say "psychological continuity exists" without addressing the temporal interruption.
  *   **Status:** **Parochial (with caveats).** This relies on specific intuitions about time and loss. A hedonistic utilitarian might argue the regret is irrational if total happiness is preserved. However, for a theory of *personal* survival, accommodating the intuition that "lost time" matters is highly desirable.

  #### 4. The Empirical Neutrality Constraint (Neuroscience)
  *   **Motivation:** Neural turnover (cells replace over years) and Split-Brain patients (corpus callosum severance can result in two distinct centers of consciousness in one skull).
  *   **Success Condition:**
      *   The theory must not imply that you die every 7 years due to neural turnover (The Ship of Theseus problem applied to biology).
      *   The theory must not imply that split-brain patients are *always* two people, nor that they are *always* one person regardless of behavioral disunity. It must allow the metaphysics to track the functional unity of the agent without being held hostage by the granularity of neural data.
  *   **Status:** **Non-Negotiable.** A metaphysical theory cannot contradict established empirical facts about the substrate of the mind. However, it need not *reduce* to neuroscience (neuroscience describes the mechanism, not the persistence conditions).

  #### 5. The Normative Asymmetry Allowance (Anticipation vs. Obligation)
  *   **Motivation:** You might rationally *anticipate* the pain of your replica (first-person concern) without accepting legal *obligation* for its debts (third-person responsibility), or vice versa.
  *   **Success Condition:** The theory must allow for the possibility that the criteria for *anticipation* (what I fear/hope for) and *attribution* (who gets punished/paid) can come apart. It must specify whether these are governed by a single underlying relation or distinct normative frameworks.
  *   **Status:** **Parochial.** Many theories (like Lockeanism) tie these together. However, a robust theory should be able to explain why they might diverge in edge cases (like teletransportation) even if they converge in ordinary life.

  #### 6. The Determinacy/Vagueness Honesty Clause
  *   **Motivation:** Ordinary gradual change vs. Fission. We feel identity is determinate in ordinary life ("I am the same person as yesterday") but fuzzy in fission ("Which one is me?").
  *   **Success Condition:** The theory must not force a binary "Yes/No" answer where the metaphysical facts are vague. It is better to admit indeterminacy in identity than to posit a hidden, unknowable fact (a "further fact") that decides the case.
  *   **Status:** **Non-Negotiable.** This is a constraint on logical honesty. Positing a metaphysical fact that makes no difference to evidence or practice is ontologically profligate.

  ---

  ### The Incompatible Subset (The Trilemma)

  You suspected that demanding determinate answers while tracking ordinary convictions is untenable. The conflict is sharper than that. The following three demands form an inconsistent triad; no theory can satisfy all three simultaneously:

  1.  **Transitivity of Identity:** If A=B and B=C, then A=C. (Logical Non-Negotiable).
  2.  **The Fission Intuition:** In a symmetric fission case, the original has the same relation to *both* successors, and survival is what matters. (Motivated by Desideratum 1 & 3).
  3.  **Identity is What Matters:** Prudential concern tracks numerical identity strictly. (The "Simple View").

  **Resolution:** To satisfy the list above, you **must reject (3)**. This is the Parfitian conclusion. If you keep (1) and (2), Identity fails in fission (because you can't be identical to two people). If Identity fails but Survival matters, then Identity is not What Matters.
  *   *Tension Flag:* Any theory that attempts to preserve (3) while respecting the Branch-Line and Fission cases will fail Desideratum 1 (Decoupling).

  ### The Most Eliminative Requirement

  **Desideratum 1: The Identity/Survival Decoupling Constraint.**

  **Why:** This is the single greatest filter.
  *   **Eliminates:** The "Simple View" (common sense realism), strict Biological Animalism (in its hard form), and strict Lockean Memory Theory (without a non-branching clause).
  *   **Reasoning:** Most traditional theories are built on the premise that the question "Is it me?" is the only question that matters. They assume that if numerical identity is broken, survival is impossible (death).
  *   **Impact:** Accepting this desideratum forces a theory to move from *Metaphysics* (Who is who?) to *Ethics/Prudence* (Who should I care about?). It eliminates any theory that cannot articulate a concept of "survival" that is distinct from "identity." This is why Animalism struggles with the teletransporter: it insists identity is biological, so if the body is destroyed, *you* are dead, regardless of psychological continuity. It fails to explain why we might rationally care about the replica. Conversely, simple Psychological Continuity fails unless it adds a "non-branching" clause, which effectively admits that identity isn't the core value (since the psychology is continuous in fission, yet identity is lost).

  ### Brief Scorecard

  *   **Pure Psychological Continuity:**
      *   *Passes:* Decoupling (usually), Empirical Neutrality.
      *   *Fails:* Temporal Coherence (struggles with the Year-Old Scan regret without ad-hoc adjustments), Determinacy (requires a "non-branching" clause that looks arbitrary).
  *   **Animalism (Biological Continuity):**
      *   *Passes:* Empirical Neutrality (neural turnover), Determinacy (usually binary).
      *   *Fails:* Identity/Survival Decoupling (cannot explain why we care about the Mars replica), Branch-Line (implies the Earth-survivor is the only one that matters, even if the Earth body dies seconds later).
  *   **Closest Continuer / No-Continuity-Needed (Parfitian Reductionism):**
      *   *Passes:* Decoupling (best in class), Determinacy/Vagueness (accepts vagueness), Temporal Coherence (explains the "lost year" as reduced relation R).
      *   *Fails:* Normative Asymmetry (sometimes struggles to separate anticipation from obligation without further normative work).

  **Conclusion:** The list itself reveals that the "Teletransporter Debate" is not a search for a hidden fact of identity, but a negotiation over which normative practices (anticipation, responsibility, memory) we are willing to decouple from biological or logical strictures. Desideratum 1 is the gatekeeper: if you cannot pass it, you are not doing survival theory; you are doing taxonomy.
