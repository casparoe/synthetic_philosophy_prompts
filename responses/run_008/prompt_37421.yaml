  **Brainstorming Plan**

  1.  **Tractability Bias:** Satirized via a career letter. The columnist advises abandoning high-impact but difficult work for low-impact but measurable tasks (e.g., data entry vs. policy reform).
  2.  **Neglectedness/Crowding:** Satirized via a family reunion letter. The columnist argues that emotional support is subject to diminishing marginal returns; if others care, your presence is redundant.
  3.  **False Precision & Opportunity Cost:** Satirized via a charity bake sale. The columnist assigns utility scores to friendship and compares them directly to global health interventions.
  4.  **Escalation:** In both the career and family exchanges, the reader objects based on common sense, and the columnist doubles down on the framework's logic rather than compromising.

  ***

  **The Marginal Utility Column**

  **Q:** I work in climate policy, but progress feels slow. A friend suggested I switch to optimizing supply chains for a local bakery. It seems less "important," but I could see daily results.
  **A:** Your intuition is biased toward narrative importance. We must score these options. Climate policy: Importance 10/10, but Tractability 2/10 (high gridlock) and Neglectedness 3/10 (crowded field). Bakery logistics: Importance 4/10, but Tractability 9/10 and Neglectedness 8/10 (nobody optimizes sourdough). The multiplicative score favors the bakery. You are likely overvaluing the *type* of problem over your marginal contribution to its solution.

  **Q (Follow-up):** But if everyone thinks like this, who solves the hard problems? Isn't this free-riding?
  **A:** This is the "critical mass" fallacy. You are not responsible for the aggregate outcome, only your marginal unit of labor. If the climate cause is truly important, others will fill the vacancy you leave. If it is not, you have wasted resources. By moving to the bakery, you unlock value in a neglected sector. Do not let the gravity of a problem distract you from the elasticity of your impact.

  **Q:** My sister is hosting a family reunion. It's expensive and stressful. I know you'll say my attendance has low utility because everyone else is going. But isn't there value in "being there"?
  **A:** You anticipate correctly. Value is determined by counterfactuals. If twenty relatives attend, the twenty-first adds negligible social cohesion. The problem of "family loneliness" is currently over-solved in your specific cluster. However, consider your elderly neighbor, Mr. Henderson. He lives alone. No one is visiting him. The neglectedness score is 10/10. Visiting him yields higher marginal utility than attending the reunion, even if the total suffering at the reunion is theoretically higher.

  **Q (Follow-up):** But Mr. Henderson doesn't *expect* me. My family will be hurt. Isn't there a duty of care to kin?
  **A:** "Duty" is a heuristic for expected impact, not a binding contract. Emotional hurt is real, but we must weigh it. Your family's disappointment is temporary (Tractability of recovery: High). Mr. Henderson's isolation is chronic. Furthermore, by visiting Henderson, you signal to your family that resources should flow to neglected areas. You are teaching them cause prioritization through action. The short-term social friction is an acceptable cost for modeling optimal altruism.

  **Q:** My friend is holding a charity bake sale. She asked me to volunteer. I calculated that my time is worth $50/hour earning to donate, but she says "presence matters."
  **A:** "Presence" is a non-fungible good only if supply is limited. Is baking neglected? Generally, no. The supply of baked goods exceeds demand in most post-industrial contexts. If you volunteer, you displace a volunteer who values the experience more highly (perhaps a retiree seeking community). Your comparative advantage lies in earning. Donate the $50. If she insists on your physical presence, assign a probability to her friendship dissolving without it. If less than 5%, decline.

  **Q:** She says friendship isn't a probability game. It's about shared experience.
  **A:** Shared experience is a mechanism for building cooperative coalitions. If the coalition does not maximize good, the mechanism is misaligned. Inform her that you value the friendship, but you value truth more. Send her a link to this column. If she unsubscribes, the coalition was fragile. If she recalibrates, you have expanded the circle of rationality. Either way, the utility calculation holds. Stay the course.
