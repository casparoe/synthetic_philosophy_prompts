      *(Refining Tension 2)*: If morality is unified, why is the private person who refuses to dirty their hands *not* a danger to their family, but the politician *is* a danger to the state? The stakes differ, but the *moral rule* should be the same. If I must kill one to save five, deontology usually says "don't." If the user says "politician must," they are importing a consequentialist duty of office. This challenges (4).

