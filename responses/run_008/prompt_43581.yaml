      *   **Premise 2 (Genuine Wrongness + Guilt):** The act remains *wrong*. Rightness (necessity) doesn't cancel wrongness. Guilt is appropriate.
      *   **Premise 3 (Anti-Consequentialism):** Rejects consequentialism in ethics generally.
      *   **Premise 4 (Unified Morality):** No distinct "political morality." Same norms for politicians and private persons.
      *   **Premise 5 (Doctrine of Double Effect/Non-Targeting):** Deliberate targeting of innocents is *never* permissible. Harm must be foreseen, not intended.

      *   **The Friend's Charge:** You are a closet consequentialist about politics (points 1 & 2) but won't admit it.
      *   **The User's Goal:** Check coherence. Identify tensions (ranked by severity). Suggest cheapest revisions.

  2.  **Initial Coherence Check & Mapping:**

      *   *Walzer's "Political Action: The Problem of Dirty Hands"* is the obvious reference point. Walzer argues for Dirty Hands (1 & 2) but *also* argues for a distinct political morality (contradicts 4).
      *   *Consequentialism:* Usually defines "right" as "maximizing good outcomes." If an act is "right" because it averts catastrophe, that sounds consequentialist. But the user says the act remains "wrong." This is the crux of the "Dirty Hands" paradox.
      *   *Unified Morality (4) vs. Dirty Hands (1):* If private persons can't lie/betray/harm innocents, but politicians *must* to avert catastrophe, doesn't that imply a different standard? Or does it imply private persons would also have to do it (and feel guilty)?
      *   *Non-Targeting (5) vs. Dirty Hands (1):* If "averting catastrophe" requires targeting innocents (e.g., torturing a terrorist to find a bomb, or bombing a city to end a war), (5) forbids it absolutely. (1) says sometimes you *must* do the wrong thing. If the "wrong thing" is targeting innocents, (5) says "never permissible," while (1) says "sometimes necessary."
      *   *Guilt (2):* This is the mechanism that tries to save the non-consequentialist soul. If I do the utilitarian calculus but feel terrible, am I still non-consequentialist?

  3.  **Identifying Tensions (Brainstorming):**

      *   **Tension A: (1) & (5) vs. (3).** If I must do X to prevent catastrophe, X is usually justified by the consequence (catastrophe averted). If I reject consequentialism, what grounds the "must"? Deontology usually says "do not kill innocents" is absolute. If (5) is absolute ("never permissible"), then (1) is impossible in those specific cases.
      *   **Tension B: (1) & (4).** If politicians must do what private persons cannot (or what private persons would be condemned for without the "public good" excuse), is the morality really unified? Walzer solves this by saying politics *is* different. User denies this.
      *   **Tension C: (2) & Consequentialism Charge.** The friend says (1)+(2) = consequentialism. Is he right? Consequentialism says the act is *right* (or at least justified) if outcomes are best. User says act is *wrong* but necessary. This is "Tragic Dilemma" territory, not pure consequentialism.
      *   **Tension D: (5) vs. (1).** "Dirty Hands" often implies violating deep constraints (like torture). (5) says targeting innocents is *never* permissible. If the "dirty hand" scenario involves targeting innocents, (5) vetoes (1).

  4.  **Ranking Tensions by Severity:**

      *   *Severity 1 (Fatal):* (1) vs. (5). If the "catastrophe" can only be averted by *targeting* innocents, (5) says "No," (1) says "You must." This is a direct contradiction.
      *   *Severity 2 (Structural):* (1) vs. (4). If the justification for the dirty act is "public good/catastrophe," that is a specifically *political* justification. A private person saving their family by torturing someone isn't usually granted the same "necessary evil" status in common morality. If the norms are truly the same, why is the politician excused/understood in a way a private murderer isn't?
      *   *Severity 3 (Conceptual):* (1)+(2) vs. (3). Is this actually consequentialism? If the *reason* for the act is the outcome, but the *moral status* remains negative, it's a hybrid. The friend's charge is plausible but maybe not fatal. It depends on what "right thing to do" means in (1).

  5.  **Drafting the Analysis (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a "Tragic Deontology" or "Walzerian without the Political Morality" stance.
      *   *Tension 1 (The Absolute Constraint):* (5) vs. (1). This is the hardest hit. If "dirty hands" means violating absolute prohibitions (like targeting innocents), (5) blocks it. *Revision:* Soften (5) to "presumptive" or restrict (1) to non-innocent targeting.
      *   *Tension 2 (The Unified Morality):* (4) vs. (1). Why does the politician get to commit "necessary wrongs" for the greater good while a private citizen doesn't? If the morality is the same, the private citizen should also do it (and feel guilty). But we usually condemn private citizens more harshly. *Revision:* Admit a contextual difference (role morality) without admitting a distinct *ontology* of morality.
      *   *Tension 3 (The Consequentialist Charge):* (1)+(2) vs. (3). The friend argues that appealing to "catastrophe" is consequentialist reasoning. The user argues the *guilt* saves it. *Analysis:* It's not pure consequentialism because the act isn't *good*. It's "Consequentialism of the Situation, Deontology of the Agent." *Revision:* Clarify the source of the obligation (duty to protect vs. duty to obey rules).

  6.  **Refining the "Cheapest Revision" for each:**

      *   *For (5) vs (1):* Distinguish between "targeting" and "foreseeing." Many dirty hands cases (bombing) are framed as DDE. If the specific dirty hand is *torture* (targeting), (5) kills it. Revision: Limit (1) to cases that don't violate (5), or admit (5) has exceptions (which hurts non-consequentialism).
      *   *For (4) vs (1):* The "Role" argument. The norms are the same, but the *stakes* and *roles* differ. A parent has different duties than a stranger. A leader has different duties than a citizen. This preserves (4) technically but acknowledges context.
      *   *For (3) vs Friend:* The friend is half-right. The *justification for action* is consequentialist, the *evaluation of character* is deontological. This is a known position (Paradox of Dirty Hands). Revision: Clarify that "Right thing to do" in (1) means "Rationally Required" not "Morally Good."

  7.  **Final Review against User Constraints:**
