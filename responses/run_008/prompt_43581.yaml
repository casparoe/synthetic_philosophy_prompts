answer: |-
  This is a sophisticated and historically weighty position. You are essentially attempting to hold Michael Walzer's "Dirty Hands" thesis while stripping away Walzer's own escape hatch (the idea of a distinct *political* morality) and anchoring it in a deontological framework that forbids targeting innocents.

  Your friend's charge is that you are a "consequentialist in practice, deontologist in theory." He is partially right, but not for the reasons he thinks. The real threats to your coherence are internal contradictions regarding *permission* and *role*.

  Here is the analysis of your five commitments, ordered by the severity of the tension they create.

  ### 1. The Fatal Contradiction: (1) vs. (5)
  **Severity: Critical**

  *   **The Conflict:** Commitment (1) states that a leader can face situations where the *right thing to do* is a morally wrong act to avert catastrophe. Commitment (5) states that deliberately targeting innocents is *never permissible*.
  *   **The Problem:** In moral logic, if an act is "never permissible," it cannot simultaneously be the "right thing to do." If the catastrophe can *only* be averted by targeting innocents (e.g., the classic "ticking time bomb" scenario where torture is the only option, or sacrificing a hostage to stop a war), (5) issues a veto.
  *   **Why it breaks:** "Dirty Hands" traditionally gains its tragic force precisely from violating absolute prohibitions (like torture or executing the innocent). If you maintain (5) as an absolute constraint, you eliminate the most severe category of Dirty Hands cases. You are left only with "lesser" dirty hands (lying, breaking promises, betraying a friend). If your definition of "catastrophe" in (1) implies scenarios requiring the violation of (5), your system crashes.
  *   **The Friend's Charge:** This isn't where he is accusing you of consequentialism, but it is where your position is most fragile. You cannot claim a leader *must* do X to save the state if X is *never permissible* under your own ethics.
  *   **Cheapest Revision:** **Qualify (5).** Change "never permissible" to "presumptively forbidden, subject to threshold deontology." This admits that at a certain level of catastrophic stakes, the absolute constraint dissolves. This moves you closer to consequentialism, but it resolves the logical contradiction. Alternatively, **restrict (1)** to exclude cases requiring the direct targeting of innocents, limiting "dirty hands" to acts like lying or procedural betrayal.

  ### 2. The Structural Tension: (1) vs. (4)
  **Severity: High**

  *   **The Conflict:** (4) claims the same norms bind private persons and politicians. (1) claims a politician who refuses to get their hands dirty is a *danger to the rest of us*.
  *   **The Problem:** If the norms are truly unified, a private person facing a catastrophe (e.g., a parent who must lie or betray to save their family from a tyrant) should be under the same obligation. Yet, in common moral intuition (and your phrasing), we treat the politician's refusal as a *public danger*, whereas we might treat a private person's refusal as *admirable integrity* or at least not "dangerous to the rest of us."
  *   **Why it breaks:** Walzer solves this by arguing for a distinct *political* morality (which you reject in 4). He argues the politician has a specific duty to the community's survival that a private citizen does not. By rejecting distinct political morality, you struggle to explain why the *obligation* to commit a moral wrong falls heavier on the politician. If the morality is the same, why is the private citizen who refuses to dirty their hands not also "a danger"?
  *   **The Friend's Charge:** This is where your friend's intuition is strongest. The reason politicians are expected to do the "necessary evil" is usually because of the *consequences* for the polity. Relying on that consequence to generate the obligation *is* a form of political consequentialism, which implies a different rulebook (violating 4).
  *   **Cheapest Revision:** **Reframe (4) as "Unified Source, Distinct Roles."** Argue that the *source* of morality is the same (no distinct political ontology), but the *fiduciary duties* of the office create specific obligations. A parent has a duty to their child that a stranger doesn't; a leader has a duty to the citizenry that a private citizen doesn't. This preserves the unity of moral norms (killing is still wrong) while explaining the differential obligation to act.

  ### 3. The Conceptual Tension: (1) + (2) vs. (3)
  **Severity: Moderate**

  *   **The Conflict:** (3) rejects consequentialism. (1) and (2) say you must do the wrong act because of the *outcome* (averting catastrophe), and the guilt confirms the wrongness.
  *   **The Problem:** Your friend argues this is "closet consequentialism." He is half-right. Your *criterion for action* is consequentialist (choose the act that averts catastrophe), but your *criterion for evaluation* is deontological (the act remains wrong, agent feels guilt).
  *   **Why it holds (mostly):** This is a recognized philosophical position often called "Tragic Dilemma" or "Moral Residue." It is not pure consequentialism because pure consequentialism would say the act is *right* (or at least morally neutral) if the outcome is best. You insist the act is *wrong*. The guilt is not neurotic; it is a recognition of the moral violation. This preserves (3).
  *   **Why the friend pushes back:** He sees that the *motivation* for the act is entirely outcome-dependent. If the catastrophe weren't looming, the act would be forbidden. Therefore, the outcome determines the action.
  *   **Cheapest Revision:** **Clarify the definition of "Right" in (1).** Do not say it is the "right thing to do." Say it is the "rationally required thing to do" or the "least bad option." Consequentialists believe the act becomes *good*. You believe the act remains *bad* but is *unavoidable*. Making this linguistic distinction sharpens your anti-consequentialist defense. You are not weighing goods; you are choosing between a moral sin and a catastrophic failure of duty.

  ### 4. The "Guilt" Mechanism: (2) vs. (1)
  **Severity: Low (Looks real, dissolves on inspection)**

  *   **The Conflict:** (1) says the act is what the leader *should* do. (2) says the leader should feel guilty for doing it.
  *   **The Problem:** It feels psychologically inconsistent to be commanded to do X and commanded to feel bad about doing X.
  *   **Why it dissolves:** This is the strongest part of your package. It aligns with the phenomenology of moral tragedy. The guilt serves a functional purpose: it prevents the normalization of the exception. If the leader didn't feel guilt, they would become a tyrant who thinks the ends *justify* the means. The guilt proves they haven't become a consequentialist.
  *   **Cheapest Revision:** None needed. This is the linchpin that keeps you from sliding into full consequentialism. Keep this exactly as is.

  ### Summary of the Friend's Charge

  **Is he right?**
  He is right that your *decision procedure* for political action relies heavily on weighing outcomes (averting catastrophe). In that specific sense, you are employing consequentialist reasoning to trigger the dilemma.

  **Is he wrong?**
  He is wrong that this makes you a consequentialist *ethicist*. A consequentialist believes the act is *justified* and the agent is *cleared*. You believe the act is *necessary* but the agent is *condemned* (hence the guilt). That is a fundamental ontological difference.

  ### The Verdict on Coherence

  Your package holds together **only if** you resolve the tension between (1) and (5).

  1.  **If you keep (5) absolute:** You must drastically narrow (1). You can only accept "dirty hands" cases that involve lying, promise-breaking, or collateral damage (foreseen but not intended). You must reject any scenario where saving the state requires *targeting* an innocent.
  2.  **If you keep (1) broad:** You must soften (5). You must admit that there is a threshold where "never permissible" becomes "permissible but tragic."

  **The Cheapest Overall Revision:**
  Modify **(4)**. Admit that while the *fundamental* moral laws are the same, the *office* of leadership carries a specific fiduciary duty to protect the community that creates a unique obligation to absorb moral sin. This explains why the politician *must* do what the private citizen might not, without requiring a totally separate "political morality." It bridges the gap between your unified ethics and the specific demands of leadership.

  **Final Advice:**
  Your friend is trying to force you into a binary: either the act is right (consequentialism) or it is wrong (deontology). Your position is that the act is **wrong but obligatory.** This is a stable, albeit painful, position. Do not let him convince you that "obligatory" implies "right." In your system, "obligatory" means "required by the stakes," while "right" means "morally clean." Keep that distinction sharp, but fix the (1)/(5) contradiction before you write your argument.
