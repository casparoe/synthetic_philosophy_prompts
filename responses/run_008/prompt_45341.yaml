  Then, after the scenario: run both tests explicitly and show me the verdicts; tell me which structural feature of the case is doing the work; and tell me what happens when you push on that feature — i.e., for route (a), say whether Lewis's actual theory (closest worlds, small miracles, no backtracking) already agrees with the interventionist, or whether it's only the naive but-for test that parts ways; for route (b), say whether the interventionist can repair things by redescribing or splitting the variables. Finish with how a defender of whichever theory comes out looking bad would attack the case — what they'd claim we got wrong about the scenario or the variables. Keep the scenario itself down to one paragraph; the analysis can run as long as it wants. And be honest if some constraint turns out to be unsatisfiable — I'd rather hear that with an explanation than get a fudged case that only looks like it meets the specs. I'm trying to figure out whether the interventionist picture I find so natural actually loses something, so a case that quietly riggs the verdicts is worse than useless to me.
