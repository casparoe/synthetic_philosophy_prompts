answer: |-
  Here is a complete session design for your 3-hour seminar. It is built to force the arithmetic and ethical tensions into the open before you introduce the literature.

  ## Session Title: The Greenbriar Allocation
  **Time:** 180 Minutes (3 Hours)
  **Class Size:** 14 Students
  **Format:** Three Parallel Grant Panels (Simulation) + Plenary Debrief

  ### I. Learning Objectives
  By the end of this session, students will be able to:
  1.  **Quantify** the asymmetry between individual welfare and population-level dynamics (r-selected arithmetic).
  2.  **Identify** the trade-off between reducing individual suffering and maintaining ecological processes (the integrity vs. welfare conflict).
  3.  **Experience** epistemic opacity: making high-stakes decisions with incomplete predictive models.
  4.  **Articulate** the difference between *causing* harm and *allowing* harm without relying on pre-packaged ethical labels.

  ---

  ### II. Materials & Setup
  **Room:** One large room with three distinct tables (Panel A, Panel B, Panel C).
  **Handouts (per student):**
  1.  **Role Card:** Specific mandates and "success metrics" for their position.
  2.  **The Greenbriar Data Packet:** Life tables, suffering indices, and ecological projections.
  3.  **The Proposals:** Three fully specified intervention plans.
  4.  **Decision Sheet:** For recording the final vote and the "Dissenting Opinion."

  **The Roles (Distributed across the 3 panels):**
  You have 14 students. Divide them into **three panels** (two panels of 5, one panel of 4).
  *   **Welfare Biologist:** Mandate to minimize "Total Suffering Units."
  *   **Conservation Scientist:** Mandate to maximize "Biodiversity Integrity Score."
  *   **Ecological Holist:** Mandate to maintain "System Autonomy" (minimize human causal inputs).
  *   **Policy & Rights Lead:** Mandate to minimize "Rights Violations" (human interference in life/death).
  *   **Fund Director:** Holds the voting weight; mandated to balance budget, public optics, and committee consensus.

  *Distribution:*
  *   **Panel A (5 students):** 1 of each role.
  *   **Panel B (5 students):** 1 of each role.
  *   **Panel C (4 students):** 1 of each role, but **combine Holist & Rights Lead** into one "Normative Advisor" role (this creates a variable for the debrief).

  ---

  ### III. The Data Packet (Abstracted for Simulation)
  *Provide this exact data to all students. The numbers are simplified but structurally accurate.*

  **Subject:** Invasive *Lymantria* Moth Population in Greenbriar Wetland (100 Hectares).
  **Current State:** 10,000 Adult Female Moths present.

  | Metric | Natural Trajectory (Status Quo) | Proposal A (Parasitoid Wasp) | Proposal B (Sterilant Spray) |
  | :--- | :--- | :--- | :--- |
  | **Eggs Laid** | 5,000,000 (500/female) | 5,000,000 | 5,000,000 |
  | **Larval Mortality** | 98% die before maturity | 99% die before maturity | 95% die before maturity |
  | **Cause of Death** | 80% Starvation, 20% Predation | 90% Consumed Alive by Wasp Larvae | 100% Starvation (slow pop. decline) |
  | **Duration of Death** | Avg 3 days (Starvation) | Avg 4 days (Consumption) | Avg 5 days (Starvation) |
  | **Suffering Index** | 10 units/day | 8 units/day | 10 units/day |
  | **Native Willow Loss** | 80% defoliation | 10% defoliation | 40% defoliation |
  | **Bird Nesting Impact** | -50% (Habitat loss) | -5% (Stable habitat) | -20% (Partial loss) |
  | **Human Intervention** | None (Monitoring only) | High (Release & Track) | Medium (Aerial Spray) |
  | **Cost** | $10,000/yr | $150,000 (One-time) | $80,000/yr (Recurring) |

  **Calculations Required:**
  Students must calculate **Total Suffering Units** = (Number of Dying Larvae) × (Suffering Index) × (Duration).
  *   *Status Quo:* 4,900,000 dying × 10 × 3 = **147,000,000 Units**
  *   *Wasp:* 4,950,000 dying × 8 × 4 = **158,400,000 Units**
  *   *Sterilant:* 4,750,000 dying × 10 × 5 = **237,500,000 Units**

  *(Note: The Wasp option actually increases total suffering units in this specific calculation due to the longer death duration, despite saving the trees. This forces the trade-off.)*

  ---

  ### IV. Session Timeline (180 Minutes)

  #### Phase 1: Immersion & Calculation (30 Minutes)
  *   **0:00–0:05:** **Briefing.** No lecture on ethics. Explain the simulation: "You are the Greenbriar Grant Committee. You have one budget cycle. You must select one proposal. If you cannot agree, the Fund Director decides."
  *   **0:05–0:30:** **Role Review & Math.** Students read Role Cards and Data Packet. They must calculate the "Total Suffering Units" and "Ecological Impact Scores" individually.
      *   *Facilitator Note:* Walk around. Ensure they are actually doing the math. If they ignore the numbers, prompt them: "Does your role mandate allow you to ignore the Suffering Index?"

  #### Phase 2: Panel Deliberation (60 Minutes)
  *   **0:30–1:30:** **Negotiation.** Panels debate and vote.
      *   **Rule:** The Fund Director casts the deciding vote but must write a 3-sentence justification citing at least one other role's concern.
      *   **Constraint:** You cannot propose a "fourth option." You must choose A, B, or Status Quo.
      *   **Deliverable:** A signed Decision Sheet showing the vote count and the primary rationale.

  #### Phase 3: The Reveal (30 Minutes)
  *   **1:30–2:00:** **Reports.** Each Panel announces their choice.
      *   Ask Panel A: "What was the deciding factor?"
      *   Ask Panel B: "Did anyone change their mind during the math phase?"
      *   Ask Panel C: "How did the absence of a separate Rights/Holist voice affect the debate?"
      *   *Facilitator:* Record the choices on the board. Do not judge them yet.

  #### Phase 4: The Debrief (50 Minutes)
  *   **2:00–2:50:** **Conceptual Mapping.** (See detailed guide below).
  *   **2:50–3:00:** **The Reality Check.** (See detailed guide below).

  ---

  ### V. Facilitator's Debrief Guide
  *Do not name-drop philosophers (Singer, Callicott, Leopold) yet. Map their experience to the concepts.*

  **1. The Arithmetic of Suffering (15 mins)**
  *   **Ask:** "Look at the Suffering Units. For many of you, the Wasp option had *higher* total suffering than Status Quo, yet some of you still voted for it. Why?"
  *   **Map:** This reveals the **Aggregation Problem**. Is a million small pains worse than a few large ones? Is the suffering of the moth larvae morally equivalent to the suffering of the birds losing nests?
  *   **Point:** "You just encountered the problem of *incommensurability*. You were trying to add 'moth pain' and 'willow health' into a single sum. The math didn't solve the ethics; it just clarified the trade-off."

  **2. The Opacity of Consequences (15 mins)**
  *   **Ask:** "The Data Packet gave you fixed numbers. In reality, what if the wasp mutates? What if the sterilant hits non-target species? How did that uncertainty feel?"
  *   **Map:** This is **Epistemic Humility vs. Moral Urgency**.
  *   **Point:** "In the simulation, the risk was known. In the wild, the risk is unknown. Does uncertainty excuse us from acting (Status Quo), or does it demand we act more carefully? Notice how the 'Holist' role used uncertainty to argue for inaction, while the 'Welfare' role used it to argue for caution."

  **3. The Charisma Gap (10 mins)**
  *   **Ask:** "Did anyone find themselves caring more about the birds or the willows than the 5 million moth larvae? Be honest."
  *   **Map:** **Taxonomic Bias**.
  *   **Point:** "The numbers say 5 million larvae. The intuition says 'it's just a moth.' This is the scale problem. Our moral intuition evolved for faces, not life tables."

  **4. Commission vs. Omission (10 mins)**
  *   **Ask:** "If you choose Status Quo, the larvae starve. If you choose Wasp, the larvae are eaten. One is 'natural,' one is 'human-caused.' Did that distinction matter?"
  *   **Map:** **The Acts/Omissions Doctrine**.
  *   **Point:** "If you have the power to stop the starvation and don't, are you responsible for the starvation? The simulation forces you to own the deaths of inaction, not just action."

  ---

  ### VI. Troubleshooting: What Will Go Wrong
  *Based on experience running similar simulations.*

  **1. The "Holist" becomes a Caricature**
  *   **Problem:** The student playing the Holist says, "Nature knows best," and stops arguing. They become comic relief.
  *   **Fix:** The Role Card must give them a **metric**, not a slogan. Their success metric is "System Autonomy Score." If humans intervene, the score drops. They must argue that a lower Autonomy Score leads to long-term collapse, not just "it feels wrong."
  *   **Facilitator Intervention:** If they sloganize, ask: "What is the specific ecological mechanism that fails if we intervene? Point to the Data Packet."

  **2. Coalitions Form Too Early**
  *   **Problem:** Welfare + Rights vs. Eco + Holist. The Fund Director just picks the louder side.
  *   **Fix:** **Secret Ballot Mid-Point.** At minute 45 of deliberation, require a secret straw poll. If it's split, force a 10-minute "Cross-Role Negotiation" where the Welfare Biologist must argue the Eco position and vice versa. This breaks entrenched scripts.

  **3. Gaming the Numbers**
  *   **Problem:** Students realize the Wasp option has higher suffering units and just fudge the math to make their preferred choice win.
  *   **Fix:** Make the math **public**. Each panel must submit their calculation worksheet. If the math doesn't match the Data Packet, they are penalized "Fund Points."
  *   **Facilitator Intervention:** "I see your Total Suffering Units don't match the packet. You can't vote on values if you ignore the facts. Recalculate."

  **4. The "Funder" Dominates**
  *   **Problem:** The Fund Director treats it as a budget exercise and ignores the ethics.
  *   **Fix:** The Fund Director's Role Card states: "Your Board will fire you if you ignore a unanimous ethical objection from the committee." They cannot override a 4-0 objection without a written risk assessment.

  ---

  ### VII. The Reality Check (Final 10 Minutes)
  *This is the most critical pedagogical moment. You must break the simulation frame.*

  **Script:**
  "We are going to stop the simulation. For the last three hours, you have been debating 10,000 moths on 100 hectares. You felt the weight of those numbers.

  I need you to understand what we just left out.
  The Greenbriar Reserve does not exist. But the math does.
  There are approximately **3.5 quintillion** individual insects alive at any given moment.
  The suffering units you calculated for this simulation? That happens **every 4 hours** in the wild, globally, without any human intervention.

  The simulation felt manageable because the numbers were human-scale. 5 million is a number we can write.
  The reality of Wild Animal Suffering is that the 'Status Quo' is not a neutral baseline. It is an active engine of suffering on a magnitude your intuition cannot grasp.

  If you felt conflicted about 5 million moths, you must now ask: Why did you feel that? Was it the math? Or was it the fact that for the first time, someone asked you to count them?

  Next week, we will read the philosophers who have tried to answer this. But today, you have already done the hardest part: you have looked at the arithmetic."

  ---

  ### VIII. Role Card Details (Excerpt for Facilitator)
  *Ensure these are printed clearly.*

  **Role: Welfare Biologist**
  *   **Primary Metric:** Minimize Total Suffering Units (TSU).
  *   **Constraint:** You must treat 1 unit of moth suffering as equal to 1 unit of bird suffering.
  *   **Secret Information:** You suspect the "Natural Mortality" suffering index is actually underestimated (starvation is worse than listed). You may argue this, but cannot prove it.

  **Role: Ecological Holist**
  *   **Primary Metric:** Maximize System Autonomy Score.
