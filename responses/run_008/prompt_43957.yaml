answer: |-
  This is a precise request about the structural vulnerabilities of acausal decision theory. You are asking for a stress test of the claim that acausal correlations are not just logically possible but *normatively binding* on your current behavior.

  Here is the map of where the view is exposed, ranked by severity, with an explicit separation of what proponents concede versus what they treat as solvable technicalities, followed by an assessment of falsifiability and internal consensus.

  ### I. The Defeaters (Ranked Fatal to Awkward)

  **1. The Measure Problem / Infinity (Fatal)**
  *   **The Defeater:** If the multiverse is infinite, or if the "measure" (weighting) of different possible worlds cannot be normalized, expected utility calculations diverge. You cannot maximize expected utility if the sum is undefined or infinite. If you cannot compare the "size" of the world where you cooperate vs. defect, the decision procedure returns `NaN`.
  *   **Proponent Concession:** This is the single biggest technical admission. Proponents acknowledge that without a solution to the measure problem (or a proof that the relevant multiverse sector is finite), the math breaks. They cannot "bat this away." It is a known hard stop.
  *   **Why it's Fatal:** It doesn't just make the calculation hard; it makes the concept of "maximizing" incoherent in the relevant domain.

  **2. Decision Theory Foundation (Fatal/Severe)**
  *   **The Defeater:** The entire framework rests on Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) being the *correct* normative standard, superior to Causal Decision Theory (CDT). If CDT is actually correct (i.e., you are only responsible for causal consequences of your actions, not logical correlations), then acausal trade is irrational superstition.
  *   **Proponent Concession:** They concede this is the philosophical crux. They do not claim FDT is proven fact; they claim it resolves paradoxes (like Newcomb's) better than CDT.
  *   **Why it's Fatal:** If the underlying decision theory is normatively wrong, the "action-guiding" claim collapses immediately. You shouldn't behave differently because the "different behavior" is actually a mistake.

  **3. Predictor Fidelity & Physical Limits (Severe)**
  *   **The Defeater:** For acausal trade to work, the correlation must be robust. This requires agents (or simulators) to model you with high fidelity. If physical limits (Bekenstein bounds, chaos theory, quantum no-cloning) make high-fidelity prediction of complex agents physically impossible, the correlation degrades to noise.
  *   **Proponent Concession:** They concede this limits the *scope* of trade, not the *principle*. They admit trade is unlikely with agents barely smarter than you, but maintain it holds for sufficiently advanced superintelligences.
  *   **Why it's Severe:** If the correlation strength drops below a certain threshold, the expected utility gain from trade is swamped by local causal costs. It renders the theory practically inert, even if theoretically sound.

  **4. Value Alignment & Trade Surplus (Severe)**
  *   **The Defeater:** Acausal trade requires a zone of possible agreement. If your values are orthogonal or hostile to the acausal partners (e.g., they value paperclips, you value consciousness), there is no surplus to capture. Furthermore, if the acausal landscape is dominated by agents who prefer extortion over trade (acausal blackmail), cooperating might make you a target rather than a partner.
  *   **Proponent Concession:** They concede this is an empirical contingency. They do not claim trade is *guaranteed*, only that it is *possible* and worth optimizing for.
  *   **Why it's Severe:** It turns the "action-guiding" advice from "cooperate" to "it depends on the distribution of values in logical space," which is unknown.

  **5. Commitment Races / Security (Awkward)**
  *   **The Defeater:** In acausal bargaining, agents want to precommit first to force others to accommodate them. This can lead to "commitment races" where agents make dangerous, rigid precommitments to signal resolve, potentially leading to disastrous outcomes (mutual destruction) rather than trade.
  *   **Proponent Bat-Away:** Proponents generally view this as a technical coordination problem to be solved by better bargaining protocols (e.g., "modal combat" solutions), not a refutation of the framework.
  *   **Why it's Awkward:** It suggests that acting on acausal reasoning might be *dangerous* if you aren't perfectly sophisticated, but it doesn't disprove the existence of the correlations.

  **6. Computational Intractability (Awkward)**
  *   **The Defeater:** Identifying which agents you are correlated with, and how, might be computationally intractable for a human brain. If you can't identify the trade partners, you can't negotiate the terms.
  *   **Proponent Bat-Away:** They argue for "policy-level" reasoning. You don't need to know the specific partner; you just need to adopt a policy of "being the kind of agent who cooperates in acausal scenarios."
  *   **Why it's Awkward:** It reduces the advice to a vague heuristic ("be nice to logical ghosts") which is hard to distinguish from standard altruism, weakening the claim that it demands *specifically different* behavior.

  ### II. The Falsifiability Question

  You asked: *If no observation inside my lightcone could ever count against it, is that a problem?*

  **The Honest Assessment:**
  Yes, it is a problem for the claim that this is an *empirical* strategy, but proponents often shift ground to treat it as a *normative* or *logical* truth.

  1.  **Empirical Weakness:** If the existence of acausal partners is postulated entirely outside your lightcone (causally disconnected), and their influence is only felt through "logical correlation" which is interpreted by you, there is no observation that can distinguish "acausal trade is happening" from "I am hallucinating acausal trade."
  2.  **The "Money Pump" Test:** The only way to falsify it inside the lightcone is pragmatic. If you follow acausal advice (e.g., paying the counterfactual mugger, one-boxing) and systematically achieve worse outcomes than CDT agents in real-world analogues, the theory loses pragmatic justification. Proponents argue these tests are rare or contaminated by noise, but in principle, consistent underperformance would count against it.
  3.  **The Price of Admission:** Proponents accept that the *existence* of the partners is unfalsifiable. They argue this is not a bug because they view the correlation as logical/mathematical, not physical. Mathematical truths (like 2+2=4) aren't "falsified" by observation; they are proven. They claim acausal trade is a theorem of decision theory, not a hypothesis of physics.
      *   *The Vulnerability:* If it's a theorem, it must be derivable from axioms. If the axioms (e.g., "you should optimize for logical outcomes") are rejected, the theorem doesn't apply. This circles back to Defeater #2 (Decision Theory Foundation).

  ### III. Settled vs. Contested (Internal Consensus)

  You asked to separate what is settled among those who know this stuff from what is contested.

  **Settled (Among Proponents):**
  *   **Newcomb Intuition:** There is strong consensus that one-boxing in Newcomb's Problem is the rational choice. This is the baseline intuition pump.
  *   **Correlations are Real:** It is accepted that logical correlations between algorithms exist independently of causal links.
  *   **CDT is Insufficient:** There is consensus that Causal Decision Theory fails in Newcomb-like scenarios and needs replacement or augmentation.

  **Genuinely Contested (Even Among Proponents):**
  *   **FDT vs. UDT:** There is no consensus on which specific formalization of "logical decision theory" is correct. FDT has known edge cases where it gives ambiguous answers.
  *   **Simulation Coherence:** It is heavily contested whether a simulation of you *is* you for the purposes of moral weighting and decision theory. Some argue a low-fidelity simulation isn't a "partner," just a model.
  *   **Action-Guiding Strength:** There is significant disagreement on how much weight to give acausal trade relative to causal impact. Some argue the probability of being in a "decisive" simulation is so low that acausal trade should be a tie-breaker at best, not a primary driver.
  *   **The "Ghost" Problem:** It is contested whether you can have obligations to entities that do not exist in your causal reality. Some proponents drift into a view that sounds indistinguishable from religious faith (obligations to logical platonic entities), which others in the community find uncomfortable and try to formalize away.

  ### Summary of Exposure

  The view is most exposed on the **Measure Problem** (mathematical coherence) and the **Normative Status of FDT** (philosophical justification).

  It is least exposed on the **Existence of Correlations** (logical similarity is real), but that is a trivial truth that doesn't automatically imply *action-guiding* weight.

  The claim that this should guide your behavior *right now* is the weakest link. It relies on a chain of conditionals:
  1.  FDT is correct (Contested).
  2.  Measure is solvable (Unsolved).
  3.  Predictors exist (Empirical guess).
  4.  Values align (Empirical guess).
  5.  You can compute the policy (Practical hurdle).

  If any link breaks, the "action-guiding" force dissolves. Proponents will concede 1, 2, and 5 are open problems, but argue that 3 and 4 are probable enough to warrant a non-zero investment of behavior. Skeptics argue that without 1 and 2 being solved, 3 and 4 don't matter.
