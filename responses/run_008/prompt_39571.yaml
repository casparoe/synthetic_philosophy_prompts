prompt: |-
  I've been reading news about prime ministers saying sorry for stuff that happened way before they were born -- apologies for slavery, for taking kids from their families, for things done in colonial times -- and half the time it seems to come out as "we deeply regret that certain events occurred", which to my ears isn't really an apology at all. Then others say even a proper one is meaningless words, and some say words are cheap but still matter somehow?? I don't have any philosophy background, just what I've worked out myself, and I want to get straight what a state apology actually has to do before I decide whether any given one is any good.

  Pretend you're a professional political philosopher who thinks carefully about this stuff. Start with a bit of brainstorming, then give me the list of requirements: what any adequate state apology for a historical wrong has to include or accomplish -- e.g. does it have to name the specific wrong plainly instead of hiding behind passive voice, can it have any "but" or context in it, does it need to come with money or changes in law, does it matter who says it (a press release vs. the head of state in person), and what about the successor problem -- the people apologising didn't do it, so how can their apology even make sense? For each requirement tell me the case behind it, and be honest about which ones you think are genuinely non-negotiable versus which are just what one side of the debate likes to insist on. If you think some of the requirements can't all be satisfied together at the same time, say so, that's the bit I most want to see. And flag which single requirement, if dropped, lets the most weaselly apologies off the hook.
