prompt: |-
  So, I'm a philosophy professor — epistemology and early modern, mostly — and somewhere along the way I got weirdly deep into proof assistants. It started when I sat in on a colleague's seminar to keep a freind company, and now I'm the person submitting PRs to mathlib at 11pm, which is not what my training promised. Anyway, here's what I want. Take Moore's hand-raising proof of an external world — the lecture where he holds up his hands, asserts that here's one hand and here's another, and deduces that things outside his mind exist — and restate it, plus the whole skeptical fight around it, in the vocabulary I actually think in now: theorems, `axiom` declarations, the trusted kernel, proof terms, `sorry` holes, the difference between a well-founded proof and one that quietly assumes what it's proving. Moore's argument looks, in that light, like a perfectly ordinary derivation: two premises he's prepared to assert, a valid step, conclusion. And the standard skeptical comeback — that Moore can know the premises only if he antecedently knows he's not dreaming, so the proof transmits no warrant to anyone who started out doubting the conclusion — looks to me like a claim about the *epistemic pedigree* of the premises, not about validity. My hunch is that the kernel is, by design, totally silent on that distinction: it happily accepts an axiom and a proof built on it is exactly as mechanically fine as any other.

  So give me the residue report, honestly. Which parts translate cleanly, which parts have to be distorted to fit, and which have no expression in my vocabulary at all. I have a guess about the distortion, tell me if I'm off: the Moorean claim that his premises are *more certain* than any premise in a skeptical argument — that's the heart of his response to the charge of begging the question, as I teach it — seems to get flattened into something a proof assistant can't represent, since soundness is a boolean; there's no ordering of confidence among axioms, and the system doesn't care where an axiom came from or whether asserting it was dialectically fair. And then the real question I'm circling: does the residue show that the proof-assistant vocabulary is missing something epistemically important, or does it show that the Moore debate was less substantive than it looks — essentially a dispute about which axioms get to be axioms, a dispute the system itself is structurally mute on? I'm giving a talk on this in the spring and I'd rather find out my framing is wrong now than in the Q&A, so don't be gentle with me.
