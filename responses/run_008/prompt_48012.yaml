answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposed Single-Index Safety Gate

  ### Executive Summary

  Our primary funder is requesting a collapsible "safety index" to streamline deployment gating, and a vendor has proposed a weighted composite model to achieve this. While the operational utility of a single number is clear, the risks of metric distortion are significant.

  I recommend we **Adopt with Conditions**.

  We should implement the composite index to satisfy the need for decision utility, but only under a strict governance framework that mitigates specific variants of Goodhart's Law. A pure adoption invites catastrophic gaming; a pure rejection ignores the fact that our current dashboard is already being optimized piecemeal. The middle path requires structural safeguards that preserve the index's utility while preventing it from becoming the sole definition of safety.

  ### The Case for Change: Addressing Piecemeal Gaming

  The strongest argument from the "Adopt" faction is correct: **status quo bias is not safety.**

  Our current system of dozen independent thresholds is already subject to Goodharting. Vendors are currently optimizing specifically for "refusal rates on harmful queries" or "jailbreak robustness" in isolation. This creates a whack-a-mole dynamic where a model passes all twelve benchmarks yet fails in deployment because the benchmarks do not capture the correlation between failures. A composite index, if constructed correctly, forces a trade-off space that is harder to optimize locally. It reduces the surface area for piecemeal gaming by requiring performance across the distribution rather than at specific checkpoints.

  ### The Risk Analysis: Not All Goodharting is Equal

  However, the "Reject" faction is right to worry that a single number creates a single point of failure. We must distinguish between three failure modes, as each requires a different mitigation:

  1.  **Noisy Composite Selection:** Models optimize for the weighted sum rather than the underlying safety construct.
      *   *Risk:* A model scores high by excelling in low-weight, easy-to-game metrics while failing in high-importance, low-weight areas.
      *   *Mitigation:* We cannot keep weights secret (opacity breeds distrust), but we must retain the right to audit the weighting logic and require **non-compensatory floors** (see Conditions).
  2.  **Proxy Breakdown at Extremes:** The correlation between the index and actual safety holds for the current distribution but breaks when vendors push to the extreme to pass the gate.
      *   *Risk:* As models approach the pass threshold, the metric ceases to measure safety and starts measuring optimization pressure.
      *   *Mitigation:* Regular rotation of benchmark suites and holdout data to prevent overfitting to the test set.
  3.  **Strategic Gaming:** Vendors collaborate with the evaluation vendor or reverse-engineer the calibration data.
      *   *Risk:* The index becomes a cheat code rather than a measure.
      *   *Mitigation:* Strict vendor independence and audit rights on calibration data.

  ### Recommendation: Adopt with Conditions

  We will approve the development of the safety index, contingent on the following three conditions being written into the vendor contract and our internal governance policy:

  1.  **Non-Compensatory Floors:** The index cannot be purely compensatory. Critical safety benchmarks (e.g., bio-risk, autonomous deception) must have individual pass thresholds. A high composite score cannot override a failure on a critical sub-metric.
  2.  **Dynamic Calibration & Holdouts:** The vendor must maintain a reserved holdout set of probes never released to model developers. Weights and benchmark composition must be reviewed quarterly to prevent static optimization.
  3.  **Auditability of Weights:** While the specific weighting algorithm can be vendor IP, the logic behind weight assignments must be auditable by our committee to ensure no single proxy dominates the score disproportionately.

  ### Conclusion

  A single index is a tool for decision-making, not a substitute for judgment. By adopting it with these conditions, we provide the funder with the gating mechanism they require without surrendering our ability to detect when the metric diverges from reality. We acknowledge that any metric will be gamed, but we can raise the cost of gaming high enough that it remains a reliable signal.

  Please review these conditions prior to Friday's vote.

  ***

