      *   **Section 3: The Reparations Disconnect:** Explain the separation of powers (TRC recommends, Govt decides/pays). Mention the delay and the lump sum vs. individual grants.
      *   **Section 4: Moral Equivalence:** Distinguish between *acts* (both killed) and *cause/context* (apartheid state vs. liberation).
      *   **Section 5: The Moral Logic (Transaction vs. Restoration):** Contrast the "Realpolitik" view (book) with the "Ubuntu/Restorative" view (TRC). Highlight the victim's lack of agency in the "bargain."
      *   **Conclusion:** Summarize the verdict on the book.

  5.  **Refine the Content (Self-Correction/Fact-Checking):**
      *   *Check:* Did the TRC have the power to grant reparations? *Correction:* No, they made recommendations to the President. The government set up the President's Fund.
      *   *Check:* Were prosecutions common for non-applicants? *Correction:* No, very few happened (e.g., De Kock testified for amnesty, others like Venter were prosecuted later). The *threat* was the stick, but the *capacity* was low.
      *   *Check:* Moral Equivalence.* *Correction:* This is the "Mbeki/ANC" critique. The TRC report Volume 1, Chapter 6 specifically addresses the "context" and rejects equivalence of the *conflict* itself, even if specific *acts* were condemned equally.
      *   *Check:* Plea Bargain.* *Correction:* A plea bargain reduces a sentence. TRC amnesty extinguished liability entirely. It's more like a conditional immunity statute.

  6.  **Final Polish:** Ensure tone is scholarly but accessible. Acknowledge the complexity. (The user is reading a "popular book," so avoid overly dense legalese, but maintain precision). Make sure to answer the specific prompt about "what gets lost in the translation."

      *(Self-Correction during drafting)*: I need to make sure I don't just bash the book. The "political necessity" argument *is* strong. The book is right about the *why*, just wrong about the *how* and the *victim experience*. I should balance the critique.

