answer: |-
  Hi there,

  It is genuinely refreshing to hear someone map Lewis onto the stack so directly, because your intuition is spot on. You are essentially describing the exact same topology, just layering it over social behavior instead of packet flow. If we translate Lewis into your day-to-day vocabulary, a convention is basically a deployed protocol state that solves an interoperability problem. Think of a coordination problem as a handshake failure scenario where two nodes need to exchange data successfully. It matters that both ends use the same encoding, the same port, the same sequence numbering, but physics does not dictate which specific encoding must be used. That is the coordination problem. The regularity Lewis talks about is what you would call deployed behavior or traffic patterns. It is not enough that the spec exists on paper; the convention only exists when the implementations in the field actually conform to it. When you say everyone prefers to conform if others conform, that is simply uptime. You would rather speak HTTP if the server speaks HTTP, even if you prefer FTP in a vacuum, because matching yields a successful transaction while mismatching yields a timeout.

  The arbitrariness condition is where the translation gets interesting. Lewis insists that a convention must be arbitrary in the sense that another regularity could have solved the problem just as well. In your world, this is the difference between a physical constraint and a protocol choice. There is no physical reason why port eighty must be HTTP or why big-endian byte order was chosen for the network layer. Those are design choices where alternative specs could have worked equally well provided everyone adopted them simultaneously. However, you are right to suspect distortion here. Once a protocol achieves critical mass, the arbitrariness vanishes from the engineer's perspective because the switching costs become prohibitive. TCP won, and now trying to switch feels physically impossible due to legacy debt and network effects, even though logically it was just one equilibrium among many. Lewis acknowledges this entrenchment, but his definition requires that the alternative was possible at the inception. So in your vocabulary, arbitrariness maps to the design phase before deployment lock-in, whereas in the operational phase, it feels like necessity.

  Salience fits cleanly into your world as well. Lewis borrows from Schelling to explain how people select one arbitrary equilibrium over another without communication. In engineering, these are your default values, well-known ports, and canonical examples. When a new protocol is drafted, certain choices feel natural or standard simply because they resemble existing successful protocols. If you are designing a new text transfer protocol, you make it look like HTTP because HTTP is salient. It is a focal point that breaks the tie between equally valid technical solutions. This psychological stickiness is what allows a committee to propose a spec and have implementers actually pick it up without needing to negotiate every bit position from scratch. The salience reduces the negotiation overhead.

  Now to your first specific question about common knowledge. You asked whether this tower of iterated mutual belief is just what we get from having a written spec everyone can read. The short answer is that the gloss is tempting but wrong. An RFC sitting on a server is not common knowledge in the Lewis sense. Common knowledge is not the document; it is the shared confidence that the document is implemented and relied upon. If I publish a spec and you read it, but I do not know that you know that I know you will implement it, we do not have a convention yet. We have a proposal. The common knowledge emerges from the deployment status and the successful handshakes. It is the operational reality that when I send a SYN packet, I expect a SYN-ACK, and I know you expect me to expect that. The written spec acts as a focal point that helps generate this knowledge, but the convention itself is the mutual belief in the deployed behavior. If the spec says one thing but the deployed code does another, the convention follows the code, because that is where the mutual expectations actually lie. Lewis would say the convention is the behavior sustained by expectations, not the text sustained by signatures.

  This leads directly to your second question about committees. You are wondering if the fact that protocols are designed by groups with published rationales means Lewis's account does not apply. It does apply, but you have to distinguish between the agreement that creates the convention and the convention itself. Lewis explicitly allows for conventions to start via explicit agreement. When the IETF meets and ratifies a standard, that is an agreement phase. But the convention only kicks in once the agreement creates the mutual expectations that sustain the behavior without further coercion. If the committee dissolves tomorrow but everyone keeps implementing the spec because they expect everyone else to, it is a Lewisian convention. If everyone only implements it because the committee threatens to revoke compliance certification, it is less of a convention and more of a contract. The engineered nature of the standard does not disqualify it, but it does shift the weight. Lewis was interested in how conventions sustain themselves over time, not necessarily how they are born. So engineered standards are just conventions with a formalized birth certificate. The gap you sense is not that Lewis excludes design, but that he focuses on the equilibrium maintenance rather than the design cost.

  So here is the residue report on what carries over and what distorts. The ideas of coordination problems, regularity as deployed behavior, and salience as default values carry over cleanly. The concept of common knowledge translates well but requires you to look past the RFC to the operational trust between implementers. The distortion happens primarily with arbitrariness and normativity. In engineering, we treat standards as normative because they are written down and enforced by compliance suites. Lewis treats them as normative because deviating causes coordination failure. In your world, you might follow a spec because a client contract demands it, even if the network would tolerate a deviation. Lewis would say that is not a convention, that is coercion. A convention is followed because you expect me to follow it and you want to interoperate with me. The engineering vocabulary often conflates compliance with convention, missing the subtle difference between following a rule because you must and following it because you expect me to.

  Regarding your final question on whether the residue points to a gap in your vocabulary or a lack of clarity in Lewis, I think it is a bit of both, but mostly a gap in the engineering vocabulary. Your world is optimized for describing the what and the how, the spec and the implementation. Lewis is describing the why of stability. The engineering vocabulary lacks a precise term for the self-sustaining expectation loop that keeps a protocol alive after the committee goes home. We call it adoption or market fit, but those are economic terms, not structural ones. Lewis provides the structural account of why adoption sticks. However, Lewis is also slightly less clear on the friction of switching. He treats arbitrariness as a logical property, but in your world, arbitrariness is a historical one. Once a protocol is deployed, it is no longer arbitrary in practice, only in history. Lewis could have been clearer on how the weight of installed base transforms an arbitrary choice into a necessary one. But ultimately, your vocabulary misses the normative force of expectation. You see a standard as a document to be implemented. Lewis sees it as a mutual belief system to be maintained. If you add that layer to your mental model, you will see that the protocol is not just the bits on the wire or the text in the RFC, but the shared confidence that the bits match the text on both ends.

  I hope this helps clear up the mapping. It is rare to find a philosophical framework that debugs so cleanly against network engineering, but Lewis really did describe the internet before it existed.

  Best regards
