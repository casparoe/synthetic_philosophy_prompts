      *   **Preference:** Everyone prefers to conform if others conform.
      *   **Arbitrariness:** There was at least one other regularity that could have solved the problem just as well.
      *   **Common Knowledge:** Everyone knows, everyone knows everyone knows, ad infinitum (or practically sufficient iterations).
      *   **Salience:** Some solutions stand out (Schelling points) to help select the initial convention.
      *   **Normativity:** Conventions create expectations and reasons for action, but aren't necessarily moral obligations.

  3.  **Translate to Protocol Engineering Vocabulary:**
      *   *Coordination Problem:* Interoperability. Two nodes need to exchange data. If A sends JSON and B expects XML, nothing happens. If both send JSON, it works.
      *   *Regularity:* Deployed behavior. The actual traffic on the wire.
      *   *Preference:* Uptime/Success. Engineers prefer the handshake to complete.
      *   *Arbitrariness:* Port numbers, endianness, frame sizes. Could have been different, but must be consistent.
      *   *Common Knowledge:* The RFC + deployment status. Everyone knows the spec, knows others know it, knows others know they know it.
