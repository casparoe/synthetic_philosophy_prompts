answer: |-
  This is an excellent set of questions. You have hit on the exact pressure points where two-dimensional semantics (2DS) often feels like it's glossing over the hard work with a catchy slogan. The "Water/H2O" example is indeed the "Hello World" of philosophy of language: it runs, but it doesn't show you the architecture.

  Let's dismantle the machinery using your glowing mineral idea, tackle the "who decides the cluster" problem, and then look at how the Contingent A Priori fits into the grid.

  ---

  ### Part 1: The Machinery (Without Water)

  Let's construct a thought experiment involving a fictional mineral called **"Lumium."**

  **The Scenario:**
  Imagine a community, the *Lumians*, who live in a valley surrounded by mountains. They have a term, "Lumium," which they use to refer to the glowing rocks they find in the mountains and use to light their homes.
  *   **In the Actual World (@):** The glowing rocks are chemically **Mineral A**.
  *   **In a Counterfactual World (W1):** There are no glowing rocks in the mountains. However, deep in the caves, there is **Mineral B**, which glows exactly like Mineral A and could be used for light, but the Lumians in W1 haven't found it yet.
  *   **In another Counterfactual World (W2):** The mountains contain **Mineral C**, which looks and glows exactly like Mineral A, but is chemically distinct.

  To understand 2DS, we need to distinguish two ways of "plugging in" a world to evaluate the term "Lumium."

  #### 1. Considering a World as Counterfactual (The Secondary Intension)
  This is the standard Kripkean modal evaluation. We hold fixed what "Lumium" refers to in **our actual world**, and we ask: *Given that Lumium is Mineral A here, is it present in that other world?*

  *   **Step 1:** Fix the reference in @. "Lumium" = Mineral A.
  *   **Step 2:** Look at World W1. Does Mineral A exist there?
      *   If W1 has no Mineral A, then "Lumium exists" is **false** in W1, even if Mineral B is glowing there. Why? Because we already decided Lumium *is* Mineral A. Mineral B is just a fake-out.
  *   **Step 3:** Look at World W2. Does Mineral A exist there?
      *   If W2 has Mineral C (the lookalike) but no Mineral A, "Lumium exists" is **false**.

  **The Rule:** When considering a world as *counterfactual*, the chemical essence (Mineral A) travels with the term. The superficial properties (glowing, in mountains) do not matter.

  #### 2. Considering a World as Actual (The Primary Intension)
  This is the distinctively 2D move. We do *not* assume our actual world is the real one. We imagine a world *as if it were the actual world* and ask: *If this world were the real one, what would the term "Lumium" pick out here?*

  *   **Step 1:** Ignore what we know about @. Pretend World W2 is the actual world.
  *   **Step 2:** Ask: In W2, what satisfies the criteria the Lumians use to identify "Lumium"?
      *   The Lumians identify Lumium by: "The glowing stuff in the mountains used for light."
      *   In W2, **Mineral C** fits that description.
  *   **Step 3:** Therefore, if W2 were actual, "Lumium" would refer to Mineral C.

  **The Rule:** When considering a world as *actual*, the functional/superficial role (glowing, in mountains) determines the reference. The chemical essence does not travel; it is discovered *within* that world.

  #### The 2D Matrix
  Philosophers often visualize this as a matrix.
  *   **Rows** represent worlds considered as **Counterfactual** (Metaphysical possibility).
  *   **Columns** represent worlds considered as **Actual** (Epistemic possibility).

  | | **@ is Actual** (Mineral A) | **W2 is Actual** (Mineral C) |
  | :--- | :--- | :--- |
  | **@ is Counterfactual** | **True** (A is in @) | **False** (A is not in @) |
  | **W2 is Counterfactual** | **False** (A is not in W2) | **True** (C is in W2) |

  *   **Reading Across (Row 1):** We fix @ as actual (Lumium = A). We ask if Lumium exists in @ (Yes) and in W2 (No, because W2 only has C). This is the **Secondary Intension**. It varies across rows.
  *   **Reading Down (Column 1):** We fix @ as counterfactual. We ask: If @ is actual, what is Lumium? (A). If W2 is actual, what is Lumium? (C). This is the **Primary Intension**. It varies across columns.

  **Why this matters:**
  The statement "Lumium is Mineral A" is:
  *   **Necessary** on the Secondary Intension (Row 1): Once fixed as A, it's A in all worlds.
  *   **Contingent** on the Primary Intension (Column 1): If W2 were actual, Lumium would be C.

  This explains the "Necessary A Posteriori." We needed empirical science (a posteriori) to learn that the Primary Intension (glowing stuff) picks out Mineral A. Once we learn that, the Secondary Intension locks onto A necessarily.

  ---

  ### Part 2: The "Watery" Cluster Problem

  Your second worry is deeper and strikes at the heart of the "Descriptivist" leanings of 2DS (specifically the version championed by David Chalmers and Frank Jackson).

  > *Who decides which features go in the 'watery' cluster? Couldn't there be a community whose term determinately refers even though nothing like their stereotype is actually correct?*

  You are right to be suspicious. If the Primary Intension is just a list of descriptions ("clear," "liquid," "fills lakes"), it seems fragile. If I turn out to be wrong about water being liquid, does the word "water" stop referring?

  #### 1. Who Decides? (Conceptual Competence vs. Committee)
  No committee decides the cluster. In 2DS, the Primary Intension is derived from **conceptual competence**. It is not a definition you can recite; it is a function implicit in your ability to use the word.

  Think of it like facial recognition. You can recognize your mother without being able to list the exact measurements of her nose. If asked, "Is this your mother?" you can say yes or no. The "cluster" is the underlying cognitive mechanism that allows you to make that judgment.
  *   In 2DS, the Primary Intension is the function that maps a world to the extension *based on how a competent speaker would identify the referent in that world.*
  *   So, "who decides?" The usage practices of the linguistic community decide, aggregated through the cognitive mechanisms of competent speakers.

  #### 2. The Problem of Radical Error
  You ask: *What if their 'water' turns out to be some weird substance that isn't even liquid?*

  This is the "Reference Failure" objection. There are two main ways 2DS handles this, depending on which flavor of 2DS you are using.

  **Option A: The Chalmers/Jackson View (Epistemic 2DS)**
  On this view, the Primary Intension is king. If the world is so different that nothing satisfies the "conceptual role" of the term, the term is **empty** in that world.
  *   *Example:* Suppose the Lumians believe Lumium is a solid mineral. It turns out the glow is actually caused by a gas leak, and there are no minerals at all.
  *   *Result:* The Primary Intension of "Lumium" returns **null**. There is no Lumium. The term fails to refer.
  *   *Does it do the work?* Yes. It tells us that if our fundamental assumptions about a kind are wrong, we might not be talking about anything at all. This preserves the link between meaning and epistemic justification. We can't know "Lumium exists" a priori if our concept of Lumium is incoherent with the world.

  **Option B: The Causal-Historical Hybrid**
  Some 2DS proponents acknowledge that for natural kinds, the causal history matters more than the description.
  *   In this view, the Primary Intension isn't "the stuff that fits the description," but rather "the stuff that stands in the appropriate causal relation to our use of the term, *provided it roughly fits the description*."
  *   If the substance is a gas, but it's the *cause* of their "glowing rock" experiences, the term might still refer to the gas.
  *   *However*, if the mismatch is too large (e.g., they say "Lumium" but are actually reacting to a sound), reference fails.

  **The "Smuggling" Worry**
  You asked if the "watery" description is smuggled in after the fact.
  *   **Critique:** Critics (like Scott Soames) argue exactly this. They say 2DS defenders look at the actual world, see that Water = H2O, and then construct a Primary Intension ("watery stuff") that happens to pick out H2O in the actual world, making it look like the Primary Intension did work.
  *   **Defense:** 2DS proponents argue the Primary Intension must be specifiable *independently* of knowing the microphysics. You can know "water is the clear, drinkable liquid in lakes" without knowing chemistry. That concept exists prior to the scientific discovery. The fact that it *happens* to pick out H2O is the discovery.

  **Summary on this point:** If a community is radically wrong, the Primary Intension typically yields an empty set. This isn't a bug; it's a feature. It shows that meaning is tethered to our epistemic access. If our access is totally deluded, our terms might be empty.

  ---

  ### Part 3: The Contingent A Priori

  Your final question is crucial: *Does 2DS explain the Contingent A Priori, or is it just adjacent?*

  The short answer is: **Yes, the 2D framework is explicitly designed to unify the Necessary A Posteriori (Water/H2O) and the Contingent A Priori (The Meter Stick).** They are mirror images in the matrix.

  Kripke introduced the Contingent A Priori (e.g., "Stick S is one meter long at t0") to show that necessity and apriority come apart. 2DS accepts this data but explains *why* they come apart using the two dimensions.

  Let's apply the Lumium example to a stipulation similar to Kripke's meter stick.

  **The Scenario:**
  The Lumians decide to standardize measurement. They take a specific glowing bar of Mineral A and stipulate:
  > **"One Lum" is defined as the length of this bar right now."**

  Consider the statement: **"The bar is one Lum long."**

  #### 1. Is it A Priori?
  Yes. You don't need to measure the bar. You know it is true simply by understanding the definition. If you know what "Lum" means, you know the bar is one Lum.

  #### 2. Is it Necessary?
  No. The bar could have been heated up and expanded. In that case, the bar would not be one Lum long (because "one Lum" is fixed to the *actual* length of the bar).

  #### 3. How 2DS Explains This
  Let's put "The bar is one Lum long" into the 2D Matrix.

  *   **Primary Intension (Considered as Actual):**
      *   We imagine a world *as actual*. In that world, the term "Lum" picks out "the length of the bar *in that world*."
      *   So, in every column (every world considered as actual), the statement "The bar is one Lum long" comes out **True**.
      *   *Why?* Because "Lum" adjusts its reference to fit the bar in that world.
      *   **Result:** The Primary Intension is **Necessary** (True in all worlds considered as actual). This explains the **A Priori** status. We know it's true on the diagonal because the definition guarantees it.

  *   **Secondary Intension (Considered as Counterfactual):**
      *   We fix the reference in *our* actual world. "One Lum" = 50cm (the actual length of the bar).
      *   Now we look at a counterfactual world where the bar was heated and is 51cm.
      *   Is the bar "One Lum" (50cm) long in this world? **No**, it is 51cm long.
      *   **Result:** The Secondary Intension is **Contingent** (False in some worlds considered as counterfactual). This explains the **Contingency**.

  #### The Mirror Image
  Now compare this to "Lumium is Mineral A."

  | Statement | Primary Intension (Epistemic) | Secondary Intension (Metaphysical) | Epistemic Status | Modal Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **"Lumium is Mineral A"** | Contingent (Could be Mineral C) | Necessary (Is always Mineral A) | **A Posteriori** | **Necessary** |
  | **"Bar is 1 Lum"** | Necessary (True in all actuals) | Contingent (Bar could shrink) | **A Priori** | **Contingent** |

  **The Connection:**
  2DS claims that *all* statements have both intensions.
  *   Kripke's **Necessary A Posteriori** cases are statements where the Secondary Intension is Necessary, but the Primary Intension is Contingent (and we needed experience to find the diagonal).
  *   Kripke's **Contingent A Priori** cases are statements where the Primary Intension is Necessary (by stipulation), but the Secondary Intension is Contingent.

  So, 2DS is not just "adjacent" to Kripke's meter stick; it is an attempt to systematize Kripke's insights. Kripke showed that the boxes (Necessary/Contingent and A Priori/A Posteriori) don't line up perfectly. 2DS draws the grid that explains *why* they don't line up: because we are conflating two different ways of evaluating meaning (Actual vs. Counterfactual).

  ### Summary of the Machinery

  1.  **Two Axes:** Meaning isn't a single line from word to object. It's a function that takes *two* world-parameters: the world of utterance (Actual) and the world of evaluation (Counterfactual).
  2.  **Primary Intension:** Tracks how we *identify* things (Epistemic). It answers: "If this world were the real one, what would I be pointing at?" This governs the **A Priori**.
  3.  **Secondary Intension:** Tracks what the things *are* (Metaphysical). It answers: "Given what this actually is, is it present in that other world?" This governs the **Necessary**.
  4.  **The "Cluster":** It isn't a checklist written by a committee; it's the cognitive procedure competent speakers use to identify referents. If the procedure fails (radical error), the term may be empty, which 2DS accepts as a valid outcome.
  5.  **Unification:** The framework treats "Water = H2O" and "Stick = 1 Meter" as structural inverses. One is necessary but discovered (Secondary dominates); the other is known by definition but contingent (Primary dominates).

  The reason the Water/H2O example gets tired is that it focuses only on the *Necessary A Posteriori* half of the grid. Once you see how the *Contingent A Priori* fits into the other half, the machinery starts to look less like a trick and more like a coordinate system for meaning.
