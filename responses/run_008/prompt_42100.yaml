answer: |-
  Here is a move-by-move assessment of the argument, followed by the missing context and a verdict for your revision.

  ### Move-by-Move Rating

  **(1) Marta: Mostly Right**
  She correctly identifies that authorship and power are not identical. Historically, the defeated often produce the most voluminous texts (memoirs, diaries, apologia) because they have the time and the psychological need to explain their failure. Her example of the Lost Cause is partially supportive: former Confederates *did* write the narrative. However, she slightly oversimplifies the Lost Cause; it didn't survive solely because losers wrote it, but because it was eventually adopted by national powers (see below).

  **(2) Dev: Mostly Right**
  He correctly shifts the definition of "written" from "authored" to "canonized." In archival science and historiography, survival is a function of power. Libraries burn, archives are purged, and curricula are set by state boards. His explanation of the Lost Cause is actually more historically robust than Marta's: the narrative survived not just because Confederates wrote it, but because post-Reconstruction Northern and Southern elites found it politically useful to reconcile at the expense of Black civil rights.

  **(3) Marta: Clearly Right**
  This is her strongest move. She identifies a logical flaw: if "victors" is defined simply as "those who control the narrative," then the phrase "history is written by the victors" means "history is written by those who write history." That is a tautology. A claim that cannot be proven false is not a scientific or historical hypothesis; it is a belief system.

  **(4) Dev: Mixed (Right on Craft, Mistaken on Logic)**
  His defense of the tautology ("a tautology that keeps you honest") is logically weak; a tautology cannot keep you honest because it offers no criteria for error. However, his critique of *you* is **Clearly Right**. He accurately diagnoses why novelists love the line: it creates instant moral clarity. It allows a writer to assume the underdog is truthful and the powerful are liars without doing the work of proving it. That *is* a lazy device.

  ### What Both Are Missing: The Diachronic Nature of Victory

  Both friends are treating "the victors" as a static monolith, but victory is provisional and recursive. The people who win the war are rarely the same people who win the peace, and neither are the people who win the memory.

  *   **The Shift:** In 1865, the Union were the victors. By 1877 (the end of Reconstruction), the "victors" were a coalition of Northern industrialists and Southern landowners who prioritized economic stability over racial justice. They *chose* to amplify the Lost Cause narrative.
  *   **The Implication:** History isn't written by *the* victors; it is written by *successive* victors who edit the previous winners' drafts.
  *   **How this helps you:** This validates Marta's suspicion that the phrase is too simple, but it also validates Dev's point that power dictates transmission. The phrase is lazy not because it's false, but because it ignores the *process* of how a loser's narrative can be adopted by a new set of victors.

  ### Revision Advice

  Your historian character sounds like a sage dispensing wisdom, but if he uses a cliché, he sounds like a prop. A real historian knows the phrase is a starting point for debate, not a conclusion.

  Instead of having him say, "History is written by the victors," have him critique the phrase itself. Let him show his expertise by acknowledging the nuance. For example:
  *"People say history is written by the victors. That's comforting. It means the truth is out there, just suppressed. The harder truth is that history is written by the survivors, and survival often requires making peace with the lies the powerful need to hear."*

  This keeps the worldly tone but incorporates Marta's accuracy and Dev's warning about power dynamics.

  Verdict: Marta on historical accuracy, Dev on narrative risk
