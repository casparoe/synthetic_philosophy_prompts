  So I've been going down a rabbit hole about whether science actually gets closer to the truth or just swaps one wrong picture for another wrong picture. Quick background on me: no philosophy training at all, I drive a delivery truck and I mostly think about this stuff during long hauls and arguments with my brother in law (who did a physics degree and loves to tell me everything I learned in school was a lie). Anyway I've ended up with a bunch of positions on this and my brother in law says they can't all be true, but he says that about everything, so I want an actual check on whether the set hangs together. Here's what I believe, as best I can put it:

  (1) Science genuinely gets closer to the truth over time, like Newton is closer than Kepler and Einstein is closer than Newton. (2) But also, basically every successful theory in history turned out false in some huge way — phlogiston, caloric, the ether — and I see no reason to think our current stuff is the exception, it just hasn't been overturned yet. (3) The fact that our theories let us build gps and lasers and whatever has to be explained by them being at least roughly right about how the world actually is deep down. (4) The only honest way to say theory A is closer to the truth than theory B is to line both of them up against the complete, total truth about the world, which nobody will ever have. (5) I read that Popper's actual attempt to define "closeness to truth" turned out to be formally broken (something about counting a theory's true consequences vs its false ones, and it produced crazy rankings), and I accept that his definition is broken. (6) Doesn't really bother me though, because I still think you can rank theories against each other without the absolute comparison, and honestly I think the rankings we make are relative to what we currently believe anyway, which seems fine. (7) One more thing that might be relevant: it seems to me progress partly works because old theories survive inside the new ones as special cases, like Newton living on inside Einstein as the low-speed limit — Kepler's ellipses are still sitting there in Newton.

  I honestly don't know which of these are fighting each other and which are fine together, and I have no attachment to any particular one, I just want to know where the real problems are. Don't just list every possible friction — I want you to separate the ones that actually break the package from ones that only look bad at first, and tell me which pairs those are. Then tell me what the cheapest fix would be and what I'd lose by making it.

  For the format, please give me a JSON object with these fields: "real_tensions" — an array, each item an object with "commitments" (the numbers involved), "severity" (1–10), "explanation" (why it's a genuine problem), and "what_has_to_give" (which one should bend and how); "apparent_tensions" — an array, each item with "commitments", "why_it_dissolves"; "cheapest_single_fix" — a string naming the one revision that cleans up the most, plus what it costs me; and "verdict" — a one-sentence overall judgment of whether my package is salvageable. If a pair isn't in either array, that means you're saying it's just fine.
