  *   **Yes:** Go to **Node 2**.

  **Node 2: Property Identity**
  *Is the mental property responsible for the effect numerically identical to the physical property responsible for the effect (i.e., are they one and the same property)?*
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to **Node 3**.

  **Node 3: Overdetermination Status**
  *If the mental property and the physical property are distinct yet both sufficient for the effect, does this constitute objectionable systematic overdetermination (like two assassins)?*
  *   **No:** Go to **Leaf C**.
  *   **Yes:** Go to **Node 4**.

  **Node 4: Nomological Requirement**
  *Does genuine causal efficacy require the cause to instantiate a strict, exceptionless law of nature?*
  *   **No:** Go to **Leaf D**.
  *   **Yes:** Go to **Node 5**.

  **Node 5: Mental Event Causation**
  *Even if mental *properties* lack causal power, does the mental *event* (e.g., the pain) still cause the physical effect (e.g., the withdrawal)?*
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to **Leaf F**.

  ***

  ### The Leaves (Positions)

  **Leaf A: Interactionist Dualism**
  *   **Position:** Interactionist Dualism.
  *   **Awkward Commitment:** You must explain how non-physical substances influence physical energy without violating conservation laws.

  **Leaf B: Reductive Physicalism**
  *   **Position:** Reductive or Type-Identity Physicalism.
  *   **Awkward Commitment:** You must accept that mental kinds are nothing over and above physical kinds, threatening the autonomy of psychology.

  **Leaf C: Nonreductive Physicalism (Overdetermination)**
  *   **Position:** Nonreductive Physicalism that embraces overdetermination.
  *   **Awkward Commitment:** You must accept that the universe systematically duplicates causal sufficiency in a way that looks like constant cosmic coincidence.

  **Leaf D: Interventionist Nonreductive Physicalism**
  *   **Position:** The interventionist or difference-making response to exclusion.
  *   **Awkward Commitment:** You must defend the view that causation is a modal relation of dependence rather than a physical process of production.

  **Leaf E: Davidsonian Anomalous Monism**
  *   **Position:** Davidsonian Anomalous Monism.
  *   **Awkward Commitment:** You must maintain that mental properties are causally inert explanatory glosses while insisting the events themselves still do the work.

  **Leaf F: Epiphenomenalism**
  *   **Position:** Epiphenomenalism.
  *   **Awkward Commitment:** You must concede that conscious experience is a causally useless byproduct that makes no difference to behavior.

  ***

  ### Instructor's Grading Notes

  **1. Unoccupied Logical Space**
  There is one combination of answers that is **incoherent** and thus unoccupied by any viable position: *Closure=Yes, Identity=No, Overdet=Objectionable, Nomological=Yes, Event-Causation=No, but Mental-Property-Causation=Yes.* If a student insists mental *properties* cause in this branch, they are asserting that properties have causal power without laws to ground that power and without events to bear it, which contradicts their own answers to Nodes 4 and 5. This is the exact contradiction the Exclusion Argument is designed to expose.

  **2. Indistinguishable Leaves Flag**
  I must flag **Leaf D (Interventionist)** and **Leaf E (Davidsonian)** as potentially unstable. While Node 4 (Nomological Requirement) is designed to separate them based on their metaphysics of causation, in practice, a sophisticated student may argue that Davidson allows for "ceteris paribus" laws that satisfy the requirement loosely, or that Interventionists can accommodate nomological constraints. If a student answers "Yes" to Node 4 but still insists mental properties cause (sliding from Leaf E to Leaf D), the tree cannot separate them without asking a question that begs the point (e.g., "Do mental properties cause?"). The distinction rests entirely on whether they view the *Anomalism of the Mental* as a bar to property causation (Davidson) or merely a bar to strict laws (Interventionist).
