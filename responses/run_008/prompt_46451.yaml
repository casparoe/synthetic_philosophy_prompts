prompt: |-
  I've been reading LessWrong and the EA Forum since the early 2010s, and I now sit on the grant-evaluation panel of a small longtermist-aligned fund. We make roughly thirty funding decisions a year, each involving a few weeks of part-time review by panelists who are smart generalists but not domain experts, and the stakes — by our own lights — are about as high as stakes get. Our recurring problem is that an awful lot of applications bottom out, sooner or later, in the hinge of history hypothesis: the claim that our era is unusually influential relative to the entire future, so that leverage available now will not be available later. Sometimes the applicant says this explicitly, citing the usual longtermist sources; sometimes it does quiet work under the surface, in any intervention whose value depends on locking in gains rather than on compounding them. Panel discussion keeps stalling because we also routinely conflate two claims the blogs have taught me to distinguish: the strong hinge claim that tractability is decreasing from here, so acting now beats acting later all else equal; and the weaker 'time of perils' claim that existential risk is concentrated in a window which, one way or another, will close.

  I'd like a decision procedure the panel can actually run on an application: a fixed order of questions, criteria for what counts as a sufficient answer to each, a point at which the procedure returns 'do not rest this grant on a hinge claim' and hands the decision back to ordinary cost-effectiveness reasoning, and a point at which it concedes the question is one of values or decision-making under deep uncertainty that the panel must vote on, not something a checklist can settle. The procedure should be honest that the empirical core of the hinge hypothesis is not something five generalists can resolve in a meeting; its job is to locate applications on a map — how much of their case survives if this turns out to be an ordinary time, and how much only works if it isn't — rather than to adjudicate the hypothesis itself. It should also tell us how to handle applicants who have learned the procedure and optimise against it.

  Then run the procedure on three applications we have actually agonised over: a technical AI safety research group whose case is that if transformative AI arrives within decades, alignment work done now is decisive, and if it doesn't, the work was mostly wasted but cheap; an archival project that wants to preserve records useful for rebuilding after a civilisational catastrophe, whose case explicitly disclaims any claim about timing — it is valuable whenever it is done, merely more urgent if the risk window is now; and a values-spreading grant whose proponents argue we should shape the long-run future by instilling better values now, before values get locked in. Include at least one case where the procedure delivers a verdict I won't like — I confess a soft spot for the archivists — and state plainly what the procedure cannot do: which questions it routes to human judgment, and where the simplifications will misfire. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Experienced reader of LessWrong/EA Forum (since early 2010s), sits on a grant-evaluation panel for a small longtermist-aligned fund.
      *   **Context:** ~30 funding decisions/year, few weeks of part-time review by smart generalists (not domain experts). High stakes (by their lights).
      *   **Core Problem:** Applications often rely (explicitly or implicitly) on the "Hinge of History" (HoH) hypothesis. Panel stalls because they conflate the *strong* HoH claim (tractability decreasing/leverage unique now) with the *weaker* "Time of Perils" claim (risk concentrated in a specific window).
      *   **Goal:** A concrete decision procedure (checklist/flowchart style) for the panel.
      *   **Requirements for the Procedure:**
          *   Fixed order of questions.
          *   Criteria for sufficient answers.
          *   Exit point: "Do not rest this grant on a hinge claim" (return to ordinary cost-effectiveness).
          *   Exit point: "Values/Deep Uncertainty" (panel must vote, checklist can't settle).
          *   Honesty: Acknowledge generalists can't resolve the empirical core of HoH.
          *   Function: Locate applications on a map (survival in ordinary time vs. hinge time), not adjudicate the hypothesis.
          *   Anti-Gaming: Handle applicants optimizing against the procedure.
      *   **Task:** Run the procedure on three specific cases:
          1.  Technical AI Safety (Decisive now, wasted if no TAI soon).
          2.  Archival Project (Valuable whenever, urgent if risk now).
          3.  Values-Spreading (Shape future before lock-in).
      *   **Constraint:** Include at least one verdict the user won't like (they have a soft spot for archivists).
      *   **Constraint:** State plainly what the procedure cannot do (limits, simplifications).
      *   **Language:** British English.

  2.  **Develop the Decision Procedure (The "Hinge Sensitivity Audit"):**

      *   *Philosophy:* The goal isn't to prove HoH true/false, but to measure *dependence*. If a project fails without HoH, it's high risk for a generalist panel. If it succeeds without HoH, HoH is a bonus.
      *   *Structure:* Needs to be sequential.
      *   *Step 1: Explicitness.* Is the claim stated? If hidden, dig it out.
      *   *Step 2: Distinguishing Claims.* Separate "Time of Perils" (risk is high now) from "Hinge of History" (influence is unique now).
      *   *Step 3: Counterfactual Robustness.* What if we are in an ordinary century?
      *   *Step 4: Tractability/Decay.* Does value decay if we wait?
      *   *Step 5: The "Generalist Ceiling".* Can we verify the specific mechanism?
      *   *Decision Nodes:*
          *   *Green:* Robust to ordinary times.
          *   *Amber:* Depends on Time of Perils (verifiable risk).
          *   *Red:* Depends on Strong HoH (unverifiable leverage).
          *   *Vote:* Irreducible value judgment.

      *   *Anti-Gaming:* Look for "stealth hinge" claims. Require specific mechanisms for decay, not just vibes.

  3.  **Drafting the Procedure (Iterative refinement for tone and utility):**

      *   *Tone:* Professional, slightly weary but rigorous, acknowledging the epistemic humility required. British English (e.g., "programme", "centre", "whilst").
      *   *Naming:* Let's call it the "Hinge Sensitivity Audit" (HSA).
      *   *Key Distinction:* I need to make sure the distinction between "Time of Perils" (risk is high) and "Hinge of History" (influence is unique) is central. The prompt specifically mentions this conflation.
      *   *Exit Criteria:*
          *   If it works in ordinary times -> Fund based on CE.
          *   If it requires Strong HoH -> Panel Vote (Values/Uncertainty).
          *   If it relies on HoH but can't justify *why now* specifically -> Reject/Defer.

  4.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Technical AI Safety.*
          *   Claim: TAI soon -> Alignment now is decisive. TAI late -> Wasted.
          *   Analysis: This is a classic Strong HoH claim (leverage decays/changes drastically). It relies on a specific timeline prediction.
          *   Verdict: High Hinge Dependence. Requires Panel Vote on P(TAI soon).
      *   *Case 2: Archival Project.*
          *   Claim: Valuable whenever, *more* urgent if risk now.
          *   Analysis: User has a soft spot. I need to be critical. Does it *actually* work in ordinary times? Preservation is good, but is it *cost-effective* compared to direct aid if no catastrophe occurs? If the value prop is mostly "rebuilding after collapse," that's still risk-dependent.
          *   *Constraint Check:* I must deliver a verdict the user won't like. I should argue that while they *say* it's robust, the cost-effectiveness in ordinary times is likely too low to justify funding without the risk premise. Thus, it secretly relies on the "Time of Perils" claim.
          *   Verdict: Amber/Red. Depends on risk probability.
      *   *Case 3: Values-Spreading.*
          *   Claim: Shape future before lock-in.
          *   Analysis: This is the subtlest. It assumes values *will* lock in. Is that HoH or Time of Perils? It's HoH (influence is higher now than later).
          *   Verdict: High Hinge Dependence.

  5.  **Refining the "Verdict I Won't Like":**

      *   The user likes the archivists. The procedure should show that "Valuable whenever" is often a shield for "Valuable *only* if catastrophe happens, but we don't want to say that."
      *   Argument: In an ordinary century, the opportunity cost of archiving vs. direct welfare improvement is massive. Therefore, the project *implicitly* relies on the high probability of catastrophe (Time of Perils) to be cost-effective. If the panel isn't convinced of the risk window, the project fails the cost-effectiveness bar.

  6.  **Addressing "What the Procedure Cannot Do":**

      *   It can't predict the future.
      *   It can't resolve deep philosophical disagreements about population ethics.
      *   It can't stop sophisticated actors from using coded language.
      *   It simplifies continuous variables into binary/ternary buckets.

  7.  **Review against Constraints:**

      *   British English? Yes (check spelling, idioms).
      *   Decision Procedure included? Yes.
      *   Three cases analysed? Yes.
      *   Unliked verdict included? Yes (Archivists).
      *   Limitations stated? Yes.
      *   Anti-gaming included? Yes.

  8.  **Final Polish:**

      *   Ensure the distinction between "Strong Hinge" (leverage unique) and "Time of Perils" (risk high) is clear in the procedure steps.
      *   Make sure the tone matches an experienced EA/LW reader (no baby steps, assume familiarity with concepts like 'lock-in', 'tractability', 'patient philanthropy').
      *   Check the flow: Procedure first, then Applications, then Limitations.

  **(Self-Correction during drafting):** I initially thought about making the procedure a simple flowchart. But the prompt asks for a "fixed order of questions, criteria...". A structured list with decision nodes is better. I need to make sure I don't just say "reject HoH". The prompt says the stakes are high *by their own lights*, implying they *are* longtermists. The goal isn't to reject longtermism, but to manage *uncertainty* about the hinge claim. The procedure should separate "We believe this because we believe in HoH" (Vote) from "We believe this regardless" (Fund).

  *Correction on the Archivist Case:* To ensure the user dislikes the verdict, I need to be rigorous about the "ordinary time" counterfactual. If the archive is just sitting there waiting for a collapse that doesn't happen, is it worth the cost? Probably not compared to malaria nets. So, if they claim it's "valuable whenever," the procedure must demand evidence of *ordinary time* value. If they can't provide it, the grant rests on the risk assumption.

  *Anti-Gaming:* Add a step about "Stealth Hinge Claims". If an application avoids the word 'hinge' but describes a 'closing window', treat it as a hinge claim.

  *Language:* Ensure "programme", "centre", "modelling", "whilst", "favour" are used. Avoid Americanisms.

  9.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  ## The Hinge Sensitivity Audit (HSA)

  **Purpose:** To classify grant applications by their dependence on the 'Hinge of History' (HoH) hypothesis, distinguishing between robust longtermist interventions and those that require specific, unverifiable claims about temporal leverage. This procedure does not adjudicate the truth of the HoH hypothesis; it adjudicates the *risk profile* of betting on it.

  **Audience:** Generalist panelists (smart non-experts).
  **Time Cost:** Approx. 30 minutes per application during the review phase.

  ### Part I: The Procedure

  **Step 1: Explicitness and Extraction**
  *   **Question:** Does the application explicitly state that the current era is uniquely influential? If not, does the value proposition collapse if we assume the next century looks broadly like the last one (no catastrophe, no transformative AI, no global lock-in)?
  *   **Criteria:**
      *   *Explicit:* Uses terms like 'hinge', 'critical century', 'decisive interval'.
      *   *Implicit:* Value relies on 'locking in' gains, preventing 'irreversible' damage, or exploiting a 'closing window' of opportunity.
  *   **Action:** If implicit claims are found, tag the application as **Hinge-Dependent**. Request clarification from the applicant on why the intervention cannot be delayed by 50 years without significant loss of value.
  *   **Anti-Gaming:** Applicants may learn to avoid 'hinge' terminology. Panelists must scan for *decay functions*. If the applicant cannot articulate why value decays over time, treat the urgency as unjustified.

  **Step 2: Distinguishing Risk from Leverage**
  *   **Question:** Is the urgency driven by a high probability of bad outcomes (Time of Perils) or by a unique capacity to shape good outcomes (Strong Hinge)?
  *   **Criteria:**
      *   *Time of Perils:* "Risk of extinction is 10% this century, 0.1% thereafter." (Empirically debatable, but falsifiable in principle).
      *   *Strong Hinge:* "Our ability to influence the future trajectory is 100x higher now than in 2100." (Metaphysical/empirical hybrid, highly uncertain).
  *   **Action:**
      *   If *Time of Perils*: Proceed to Step 3.
      *   If *Strong Hinge*: Proceed to Step 4.

  **Step 3: The 'Ordinary Time' Stress Test (For Time of Perils Claims)**
  *   **Question:** If the risk window is wider than claimed, or if the specific catastrophe does not materialise, does the intervention retain positive cost-effectiveness relative to near-term humanitarian benchmarks?
  *   **Criteria:**
      *   *Pass:* The project produces public goods (knowledge, resilience, capacity) valuable even in a stable century.
      *   *Fail:* The project is purely defensive against a specific tail risk (e.g., bunker building, specific bio-shields) with no dual-use value.
  *   **Decision Node:**
      *   *Pass:* **Fund via Ordinary Cost-Effectiveness.** (The HoH claim is a bonus, not a prerequisite).
      *   *Fail:* **Route to Panel Vote.** (Funding rests on the probability of the risk window).

  **Step 4: The Tractability Decay Check (For Strong Hinge Claims)**
  *   **Question:** What is the mechanism by which tractability decreases? Is it a hard physical constraint or a social contingency?
  *   **Criteria:**
      *   *Hard Constraint:* Physics or logic dictates a closing window (e.g., 'once AI is deployed, alignment is impossible').
      *   *Social Contingency:* Depends on human coordination, funding landscapes, or political will (e.g., 'values lock-in').
  *   **Decision Node:**
      *   *Hard Constraint:* **Route to Panel Vote.** (This is a values/uncertainty question regarding the hardness of the constraint).
      *   *Social Contingency:* **Do Not Rest on Hinge Claim.** (Social contingencies are too volatile for generalists to bet the fund on without domain expertise. Ask applicant to reframe as capacity building).

  **Step 5: The Generalist Ceiling**
  *   **Question:** Can five generalists verify the core mechanism in a few weeks of reading?
  *   **Criteria:**
      *   *Yes:* The argument relies on established history or clear logic.
      *   *No:* The argument relies on niche technical models, obscure historical analogies, or complex forecasting tournaments.
  *   **Decision Node:**
      *   *No:* **Reject or Defer.** (If the hinge claim is the core justification and it is beyond the panel's epistemic horizon, you are gambling, not granting).
      *   *Yes:* **Proceed to Vote.**

  ### Part II: The Decision Matrix

  At the end of the Audit, every application falls into one of three buckets:

  1.  **Green (Robust):** Value holds in 'Ordinary Time'. Fund based on standard cost-effectiveness. Hinge claims are ignored as marketing fluff.
  2.  **Amber (Risk-Dependent):** Value holds if 'Time of Perils' is true. Panel must vote on the probability of the risk, not the hinge hypothesis itself.
  3.  **Red (Hinge-Dependent):** Value holds *only* if 'Strong Hinge' is true. Panel must vote on values and deep uncertainty. If consensus cannot be reached, **Reject**. (The fund cannot afford to bet on unverifiable leverage claims without consensus).

  ---

  ### Part III: Application to Current Cases

  Here is the HSA applied to the three applications currently causing friction on the panel.

  #### 1. Technical AI Safety Research Group
  *   **Claim:** If Transformative AI (TAI) arrives within decades, alignment work now is decisive. If TAI is centuries away, work is wasted.
  *   **Step 1 (Extraction):** Explicitly Hinge-Dependent. Relies on a 'closing window' before capabilities outpace alignment.
  *   **Step 2 (Risk vs Leverage):** Strong Hinge. It is not merely that risk is high, but that *leverage* is unique to this pre-deployment phase.
  *   **Step 4 (Tractability Decay):** Mechanism is a mix of Hard Constraint (once superintelligence exists, we may lose control) and Social Contingency (race dynamics).
  *   **Step 5 (Generalist Ceiling):** No. Generalists cannot verify the timeline to TAI or the difficulty of alignment in a few weeks.
  *   **Verdict:** **Red (Hinge-Dependent).**
  *   **Panel Action:** This requires a Vote on Deep Uncertainty. The panel must admit they are betting on a specific timeline and a specific technical bottleneck. If the panel cannot agree that P(TAI < 50 years) is sufficiently high to justify the 'wasted work' downside, this grant fails.
  *   **Note:** Do not allow the 'cheap but wasted' argument to bypass the audit. 'Cheap' is relative to the fund's total capital. If 30% of the fund goes to 'cheap but wasted' projects, the fund fails its mission.

  #### 2. Archival Project (Civilisational Rebuilding)
  *   **Claim:** Preserving records is valuable whenever done, but more urgent if risk is high now.
  *   **Step 1 (Extraction):** Implicitly Hinge-Dependent. They disclaim timing, but the *cost-effectiveness* relies on the utility of the archive being accessed.
  *   **Step 3 (Ordinary Time Stress Test):** In an 'Ordinary Time' (no catastrophe for 500 years), what is the return on investment?
      *   *Analysis:* Digital storage is cheap, but physical hardening, curation, and institutional maintenance are expensive. Compared to direct welfare interventions (e.g. pandemic prevention, poverty alleviation), the expected value of an archive sitting unused for centuries is negligible.
      *   *Finding:* The project claims robustness, but the *marginal* value of *this specific grant* (vs. doing it later or cheaper) relies on the probability of a near-term collapse where this specific archive survives.
  *   **Verdict:** **Amber (Risk-Dependent) — with a caveat.**
  *   **Panel Action:** I anticipate you will dislike this. The procedure strips away the 'valuable whenever' shield. In an ordinary century, this is a low-yield cultural project, not a longtermist priority. It only becomes a longtermist priority if the 'Time of Perils' probability is high. Therefore, you cannot fund this on 'robustness' grounds. You must vote on the probability of civilisational collapse. If the panel thinks collapse is unlikely in the next century, this grant is not cost-effective compared to alternatives.
  *   **Why you won't like it:** It forces you to admit that your soft spot for archivists is actually a bet on doom. If you aren't willing to bet on doom, you shouldn't fund the archive at this scale.

  #### 3. Values-Spreading Grant
  *   **Claim:** Instil better values now before they get locked in by future technological or political structures.
  *   **Step 1 (Extraction):** Implicit Strong Hinge. Relies on 'lock-in'.
  *   **Step 2 (Risk vs Leverage):** Strong Hinge. Claims influence is higher now than later.
  *   **Step 4 (Tractability Decay):** Mechanism is Social Contingency. Values lock-in depends on future governance, not just physics.
  *   **Step 5 (Generalist Ceiling):** No. Assessing the trajectory of moral progress and lock-in mechanisms is deeply philosophical and sociological.
  *   **Verdict:** **Red (Hinge-Dependent).**
  *   **Panel Action:** Reject or Defer. Per Step 4, social contingencies are too volatile for generalists to bet on as a 'hinge'. Furthermore, 'values-spreading' is notoriously difficult to evaluate for quality (are they spreading *good* values?). Without a hard constraint, the claim that 'now is better than later' is unverifiable by this panel.
  *   **Recommendation:** Ask the applicant to reframe as 'capacity building' (training researchers) which passes the Ordinary Time test, rather than 'shaping trajectory' which fails it.

  ---

  ### Part IV: Limitations and Honest Admissions

  This procedure is a tool for managing institutional risk, not a truth-seeking machine. You must be plain with your panel about what it cannot do.

  **1. It Cannot Resolve Deep Empirical Disagreements**
  The HSA locates the disagreement; it does not solve it. If half the panel believes P(TAI) is 10% and the other half believes it is 90%, the Audit simply categorises the AI Safety grant as 'Red'. It forces you to vote, but it does not tell you how to vote. It prevents you from pretending the disagreement is about 'strategy' when it is actually about 'facts'.

  **2. It Penalises Novelty**
  The 'Generalist Ceiling' (Step 5) inherently biases against novel, complex, or highly technical interventions. This is a feature, not a bug, for a small generalist fund, but you must acknowledge it. You are filtering for 'intelligible longtermism', not necessarily 'optimal longtermism'.

  **3. It Simplifies Continuous Variables**
  The world does not divide neatly into 'Ordinary Time' and 'Hinge Time'. There are gradations of influence. The Audit forces a binary/ternary classification for the sake of decision-making. This will misfire on projects that are *slightly* time-sensitive but not *hinge* sensitive. In these edge cases, default to 'Amber' and require a supermajority vote.

  **4. It Is Vulnerable to Sophisticated Obfuscation**
  Applicants who know the EA discourse well can frame Strong Hinge claims as 'capacity building' or 'resilience'. The Anti-Gaming step in Section I helps, but a determined applicant can always hide the hinge claim inside a black box of 'domain expertise'. If panelists suspect this, they must invoke Step 5 and demand the mechanism be made legible, or reject.

  **5. It Routes Values Questions to Human Judgment**
  The procedure explicitly concedes that at the 'Red' node, the decision is one of values. Are we willing to bet on the Hinge of History hypothesis? The checklist cannot answer this. It merely ensures that when you make that bet, you are doing so with your eyes open, rather than by accident.

  ### Final Recommendation to the Panel

  Adopt the HSA as a pre-meeting requirement. Applicants must answer the Step 1 and Step 3 questions in their proposal. Panelists must fill out the Step 5 check before the discussion meeting.

  This will not stop the arguments, but it will clarify them. You will no longer be arguing about whether the archive is 'good'; you will be arguing about whether you believe a catastrophe is imminent. That is a much cleaner fight to have.
