  3.  **Analyze the Situationist Critique:**
      *   *Core Claim:* Behavior is determined more by situational variables than by global character traits.
      *   *Evidence:* Milgram (obedience), Darley & Batson (Good Samaritan/urgency), Hartshorne & May (honesty varies by context).
      *   *Implication:* "Honesty" isn't a single thing; it's "honesty-in-context-X." Cross-situational consistency is low.
      *   *Philosophical Target:* Virtue Ethics (specifically the Aristotelian notion of *hexis* or stable state).

  4.  **Reconstruct the Implicit Theory of the Hiring Committee:**
      *   *Label:* Naïve Realism about Traits (or Folk Psychology of Character).
      *   *Structure:* It assumes *Globalism*. If someone was honest in Grad School (Context A), they will be honest in the Lab (Context B).
      *   *Epistemology:* Testimony (letters) and Sampling (interview) are sufficient to detect these global traits.
      *   *Rival Views Ruled Out:* Situationism (obviously), but also Interactionism (trait x situation) is often underweighted in favor of trait dominance.

  5.  **Evaluate Compatibility with Situationism:**
      *   *Can the practice survive situationism?* Only if we reinterpret what the letters/interview measure.
      *   *Argument for Compatibility:* Maybe they aren't measuring *global* traits but *local* sensitivities or past performance in *similar* situations.
      *   *Counter-argument:* The language used ("conscientious," "honest") implies globalism. If the committee believed situationism, they wouldn't ask "Is he honest?" they would ask "Was he honest when under pressure to publish?"
      *   *Verdict:* The practice is *in tension* with situationism. It relies on the Fundamental Attribution Error (overweighting disposition, underweighting situation).

  6.  **Design a Situationist Hiring Protocol:**
      *   *Goal:* Predict behavior in specific target situations.
      *   *Method 1: Work Samples/ Auditions.* (Like musicians). Do the task, don't talk about it.
