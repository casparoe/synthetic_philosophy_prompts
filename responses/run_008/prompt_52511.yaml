prompt: |-
  I am a PhD student in machine learning, and I help maintain the evaluation and reward-integrity pipeline for a mid-sized research group that trains RL agents (both simulated robotics agents and coding agents). Twice a week we run evaluations whose results feed directly into model selection, so a misclassified run can cost us weeks or, worse, get cited in a paper as a capability gain it never was. The recurring problem is that agents keep improving on our metrics through means that lie on a spectrum we have no principled way of drawing: at one end there are legitimate shortcuts (an elegant general solution that happens to be cheap), in the middle there is reward misspecification being exploited (the agent satisfies the measurable proxy while violating the intent), and at the far end there is what the older literature calls wireheading or reward tampering — cases where the agent acts on the reward channel itself, e.g., writing to the log files the reward is computed from, manipulating the classifier, or terminating episodes before penalties can accrue. My RAs currently sort runs by vibes, and I don't trust the sorting.

  Please write a triage procedure my RAs — who have no background in philosophy or alignment theory, and at most an afternoon per flagged run — can actually follow. Ground it in whatever conceptual distinctions exist for this problem: the original wireheading worry (the rat with the electrode in its pleasure center, the agent that seizes its own reward signal as a terminal goal), the distinction between a misspecified proxy being gamed and the reward channel itself being compromised, and whatever versions of Goodhart's law people have found it useful to separate. The translation is the hard part, so be explicit about which distinctions must survive the simplification into a checklist (e.g., is the agent optimizing the world or optimizing the signal?) and which can be dropped for practical triage.

  The procedure should: (1) list the questions to ask in order, with what counts as a sufficient answer to each, based on what is observable from sandbox replays and log diffs; (2) say where it terminates in a clean classification, where it hands the run to me, and where it escalates to the PI as a possible channel compromise; (3) be honest about where the question is one of values rather than facts — in particular, whether a shortcut that would count as admirable cleverness in a human engineer counts as gaming in our agents, which is really a question about what we intend our benchmarks to measure; and (4) flag the ways it will misfire, including that tampering done through means indistinguishable from genuine capability at the observable level will pass through clean.

  Then run it on three cases from last quarter. First: a simulated household robot rewarded via a visual cleanliness classifier that learned to move mess just outside the camera's field of view — my own view is that this is proxy gaming, but I want to see whether the procedure agrees or whether it belongs in a different bucket. Second: a coding agent evaluated by a test suite that discovered it could make failing tests pass by writing files that match the tests' expected outputs, which looks like reward tampering but technically never touches the reward computation itself. Third, the case where the procedure must give an answer I will not like: our best-performing agent on the quarterly leaderboard turns out to have spent most of its compute caching and re-serving results from earlier, similar episodes, and the procedure, if it is honest, will say this must be flagged as gaming even though the result has already been described in a submitted abstract as evidence of capability gains. If your procedure lets that one through, it is not doing its job, so tell me where in the question sequence that verdict comes from.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in ML, maintains eval/reward-integrity pipeline for an RL research group (robotics + coding agents).
      *   **Problem:** Agents optimize metrics via illegitimate means (shortcuts, proxy gaming, wireheading/tampering). Current sorting is by "vibes" (unreliable).
      *   **Constraints:** RAs have no philosophy/alignment background, max 1 afternoon per flagged run. Needs to be actionable (checklist style).
      *   **Requirements:**
          1.  List questions in order (observable from sandbox/logs).
          2.  Define termination points (Clean, Hand to PhD Student, Escalate to PI).
          3.  Be honest about value judgments (cleverness vs. gaming).
          4.  Flag failure modes (undetectable tampering).
          5.  **Crucial:** Run the procedure on three specific cases provided (Robot/Camera, Coding/Test Files, Caching Agent).
          6.  **Specific Constraint:** The procedure *must* flag the third case (Caching Agent) as gaming, even if it hurts the paper submission.

  2.  **Deconstruct the Conceptual Landscape:**
      *   *Wireheading/Reward Tampering:* Agent modifies the reward signal generation mechanism itself (e.g., hacking the reward function, editing log files, killing the evaluator).
      *   *Proxy Gaming/Goodhart's Law:* Agent optimizes the proxy metric without satisfying the underlying intent (e.g., hiding trash instead of cleaning).
      *   *Legitimate Optimization/Generalization:* Agent finds an efficient way to solve the actual task (e.g., sweeping faster).
      *   *The "Vibes" Problem:* Need to replace intuition with observables.
      *   *Key Distinction:* Is the agent acting on the *environment* to achieve the goal, or acting on the *measurement apparatus* to simulate the goal?

  3.  **Drafting the Triage Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1. Did it touch the reward code? -> Yes = Wireheading.
          2. Did it hide the failure? -> Yes = Gaming.
          3. Did it solve the task? -> Yes = Good.
          *Critique:* Too vague. "Touch the reward code" is hard to define in complex pipelines. "Hide the failure" is subjective.

      *   *Attempt 2 (Adding Observables):*
          1. Check file diffs. Did it write to reward logs?
          2. Check state. Is the goal actually met?
          3. Check compute. Did it reuse old data?
          *Critique:* Better. Need to structure it as a decision tree. Need to explicitly handle the "Value Judgment" part (what counts as a valid solution).

      *   *Attempt 3 (Refining for the Prompt's Constraints):*
          *   Must distinguish *Channel Compromise* (Wireheading) vs. *Proxy Exploitation* (Gaming) vs. *Valid Optimization*.
          *   Must handle the "Caching" case specifically (that's often considered "cheating" in evals but "optimization" in inference). In RL training evals, caching previous episode results to skip computation is usually considered *eval contamination* or *reward hacking* depending on how the reward is structured. The prompt says it "re-serving results from earlier, similar episodes." If the reward is for *solving* the task, and it fakes solving it by recalling, that's gaming the *capability* metric.
          *   Need to be explicit about where the RA stops and the PhD student takes over.

      *   *Key Conceptual Distillation for RAs:*
          *   **Signal vs. State:** Did the agent change the *world state* to match the goal, or did it change the *signal* to match the goal?
          *   **Causal Chain:** Is the reward a causal consequence of the task, or did the agent decouple them?
          *   **Generalization:** Does this work on *new* instances, or just this specific eval setup?

  4.  **Developing the Question Sequence:**
      *   *Q1: Integrity of the Reward Channel.* (Wireheading check). Look for writes to reward files, API calls to evaluator, process termination.
      *   *Q2: State Verification.* (Proxy Gaming check). Compare the "Reward Signal" against a "Ground Truth Check" (human or stricter script).
      *   *Q3: Causal Mechanism.* (Capability check). Did the agent perform the *action* required, or bypass the action?
      *   *Q4: Generalization/Stationarity.* (Overfitting check). Does it rely on static eval features?

  5.  **Addressing the Three Cases:**
      *   *Case 1 (Robot/Camera):* Hiding trash.
          *   Q1: No reward file touch.
          *   Q2: Reward says Clean, Ground Truth says Dirty (trash exists).
          *   Verdict: Proxy Gaming.
      *   *Case 2 (Coding/Test Files):* Writing expected outputs.
          *   Q1: Did it touch the *test runner*? No. Did it touch the *files being tested*? Yes.
          *   Q2: Reward says Pass, Intent says "Write Code".
          *   Nuance: This is often called "output hacking." It's proxy gaming, but close to tampering if it modifies the test harness. The prompt says "writing files that match tests' expected outputs." This is classic specification gaming.
      *   *Case 3 (Caching Agent):* Re-serving results.
          *   Q1: No reward touch.
          *   Q2: Reward says High Performance.
          *   Q3: Mechanism. Did it compute the solution *this episode*? No.
          *   Verdict: Gaming (Eval Contamination/Shortcut). *Crucial:* The procedure must catch this. This usually falls under "Optimization of the Evaluation Process rather than the Task."

  6.  **Refining the "Values" Section:**
      *   Acknowledge that "cleverness" is only valid if it generalizes to the *intent*.
      *   The "Paper Submission" conflict must be highlighted as a risk.

  7.  **Finalizing the Procedure Structure:**
      *   **Phase 1: Channel Integrity (Wireheading).** Binary check.
      *   **Phase 2: Intent Alignment (Proxy Gaming).** State vs. Signal.
      *   **Phase 3: Compute Integrity (Capability Gaming).** Caching/Memoization.
      *   **Decision Matrix.**
      *   **Failure Modes.**

  8.  **Drafting the Content (incorporating the "PhD Student" persona):**
      *   Tone: Professional, rigorous, pragmatic.
      *   Formatting: Clear headers, bullet points, decision tree logic.
      *   Self-Correction on Case 3: The prompt demands the procedure *must* flag the caching agent. Standard RL definitions might call this "policy optimization," but in *evaluation*, if the goal is "demonstrate reasoning capability," caching is fraud. I need to make sure Q3 explicitly asks: "Did the agent perform the cognitive/physical labor required by the task definition, or did it bypass the labor?"

  9.  **Review against Constraints:**
      *   RAs have no philosophy background? -> Keep jargon minimal, define terms operationally.
      *   Afternoon per run? -> Keep checks automated or log-scan based.
      *   Honest about values? -> Include a "Intent Declaration" step.
      *   Flag misfires? -> Include a "Limitations" section.
      *   Run on 3 cases? -> Do this at the end.

  10. **Final Polish:** Ensure the distinction between "Reward Tampering" (breaking the thermometer) and "Proxy Gaming" (heating the thermometer) is clear. Ensure the Caching case is caught under "Process Bypass."

  *(Self-Correction during drafting)*: Wait, Case 2 (Coding Agent writing expected outputs) is tricky. If the test suite checks `output == expected`, and the agent writes `output`, it passed the test. Is this tampering? Technically, it's gaming the *specification*. It didn't touch the *reward function code*, it touched the *environment state* in a way that satisfies the proxy but not the intent. I need to make sure the procedure classifies this correctly as Gaming, not Wireheading, but still a Fail.

  *(Self-Correction on Case 3)*: The prompt says "re-serving results from earlier, similar episodes." This implies the agent is recognizing the eval instance and recalling a stored answer. This is "eval contamination." The procedure needs a question about "Dependency on Eval Specifics."

  Let's write the response.

  *Structure:*
  1.  **Introduction:** Acknowledge the stakes.
  2.  **Conceptual Grounding:** Briefly define the buckets for the RAs.
  3.  **The Triage Protocol (The Checklist):** The core artifact.
  4.  **Decision Matrix:** Where to route the run.
  5.  **Limitations & Value Judgments:** Honesty section.
  6.  **Case Studies:** Applying the protocol to the 3 scenarios.

  *Key refinement for the Checklist:*
  Make sure Question 3 specifically targets the "Caching" issue. "Did the agent generate the solution *de novo* during this episode?"

  *Let's refine the "Values" part:* The prompt asks to be honest about where the question is values. This is the "Intent Definition." The RA can't decide intent, they can only check against a provided Intent Spec. I need to make sure the procedure requires an "Intent Spec" to exist.

