      *   **User:** Researcher in a lab doing mechanistic anomaly detection (MAD) in AI safety/interpretability.
      *   **Problem:** The team is stuck on defining "same mechanism."
      *   **Camps:**
          1.  *Feature Camp:* Same activation patterns/features = same mechanism.
          2.  *Circuit Camp:* Same causal structure/graph = same mechanism (abstract topology).
          3.  *Interventional Camp:* Same response to ablations/perturbations = same mechanism (functional robustness).
      *   **Question:** Is this a verbal dispute, a hidden empirical question, or are they answering different questions (pragmatic)? What counts as progress?
      *   **My Role:** Philosopher of science working closely with ML researchers. I need to be rigorous, empathetic to the technical constraints, and offer a diagnostic framework.

  2.  **Initial Brainstorming & Deconstruction:**
      *   *Verbal Dispute?* On the surface, yes. "Mechanism" is a loaded term. But in science, definitions usually track ontological commitments or pragmatic goals. If they just agreed on a definition, would the problem go away? Probably not, because the *risk* profiles differ.
      *   *Empirical Question?* Do features, circuits, and interventions ever come apart in high-dimensional neural nets? Almost certainly. Polysemanticity, superposition, and distributed representations mean features $\neq$ circuits. Circuits might be robust to weight noise but sensitive to feature masking, or vice versa. So there's an empirical layer: "How coupled are these levels of description in practice?"
      *   *Pragmatic/Teleological?* What is the *goal* of MAD? Is it to understand the model (science)? Is it to guarantee safety (engineering)? Is it to detect deception (adversarial)?
          *   Feature camp cares about *representation* (what concepts are present).
          *   Circuit camp cares about *computation* (how the output is derived).
          *   Interventional camp cares about *causal leverage* (can we stop it).
      *   *Philosophy of Science Lens:* Look at Machamer, Darden, Craver (MDC) account of mechanisms. Look at Woodward's interventionism. Look at multiple realizability.

  3.  **Diagnosing the Disagreement:**
      *   It's not *just* verbal. If it were, a stipulative definition would solve it. The fact that they are "whiteboard-fight stuck" suggests they see different failure modes.
