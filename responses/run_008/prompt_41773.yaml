prompt: |-
  I lead a reading group of machine-learning engineers, mostly people who work on NLP systems, and I've been asked to run one ninety-minute session on Quine's indeterminacy of translation. They will arrive confident that they already know roughly what the thesis says — something like "translation is an underdetermined inverse problem" or "there's no ground-truth alignment between two vocabularies" — and I'm sure that confidence is a trap, since the real thesis is stronger and stranger than any engineering framing of it. Please don't give me the explanation itself; plan the session. Specifically: the order the components must come in and what depends on what — in particular, where the constraint on evidence has to be established before the indeterminacy claim can look like more than a point about noisy data; whether the gavagai rabbit example should carry the whole session or whether it merely invites the reading group to file the thesis under "nature words are fuzzy," and if you'd drop it, what should replace it (I've wondered about using sameness or number talk instead, since those feel like the last places indeterminacy could reach); the misconceptions this audience will form, in the order they'll form them, and the exact point in the sequence where each should be headed off — I'd guess "it's just practical difficulty," "it's ordinary ambiguity plus a lack of context," "it's the same as ordinary scientific underdetermination," and "neuroscience or better language models will eventually dissolve it"; one question I can pose at the end whose answer would distinguish someone who has actually got the thesis from someone who has merely found it congenial; and what I should explicitly decline to get into at this level rather than half-explain — the analyticsynthetic connection, holism about confirmation, or whatever else you judge to be the tempting depth that would sink the session.
