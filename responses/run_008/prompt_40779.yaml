answer: |-
  This is a fantastic argument, and honestly, your friends have stumbled into one of the most persistent debates in the history of philosophy. They are arguing about **Causation by Omission**.

  Philosophers of law, metaphysics, and action theory have been fighting over this exact scenario (often using examples like "the gardener didn't water the plants" or "the doctor didn't save the patient") for decades. Neither Dana nor Marcus is entirely wrong, but they are talking past each other because they are using different definitions of the word "cause."

  Here is the breakdown of who is right at each step, where the traps are, and what they are both missing.

  ### Round 1: Can an "Absence" Be a Cause?

  **Marcus's Claim:** "Nothing can't cause anything. A cause is a thing that happened... 'Not feeding' isn't a thing."
  **Dana's Claim:** "The sun not coming up would cause every plant on earth to die... absences count."

  **The Verdict:** **Marcus is right about physics; Dana is right about reality.**

  Marcus is holding a **Mechanistic View of Causation**. In strict physics, causation involves the transfer of energy or momentum. One billiard ball hits another. There is a physical event. "Not feeding" involves no energy transfer. There is no particle of "non-food" that hit the fish. If you are looking for a purely physical description of the universe, Marcus is correct: the fish died due to biological processes (starvation), not because of a metaphysical "nothing."

  However, Dana is holding a **Counterfactual View of Causation**. This says $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. In medicine, law, and daily life, we treat absences as causes constantly. "The lack of oxygen caused the brain damage." "The failure of the brakes caused the crash." If we followed Marcus's rule strictly, we couldn't explain almost anything in biology, history, or sociology.

  **Who wins the point?** Dana. While Marcus is technically correct about particle physics, we don't live in a world of particle physics; we live in a world of agents and outcomes. In our world, absences *do* causal work.

  ### Round 2: The "Everyone Caused It" Problem

  **Marcus's Claim:** "If absences count, then a million different people 'caused' my fish to die by not feeding them... Was the mailman a cause?"
  **Dana's Claim:** (Initially) "Obviously he caused it — if he'd fed them... they'd be alive."

  **The Verdict:** **Marcus identifies a fatal flaw in Dana's initial logic.**

  This is known in philosophy as the problem of **Profligate Causation**. If causation is *only* about counterfactuals ("If X hadn't happened, Y would be different"), then yes, the mailman is a cause. If Beyoncé had flown to your apartment and fed the fish, they would be alive. Therefore, by Dana's initial definition, Beyoncé caused the fish to die.

  This is absurd. It suggests that *every* condition necessary for the fish to live (the presence of oxygen, the gravity holding the water in the tank, the mailman not feeding them) is equally a "cause." Marcus is right that if we accept all absences as causes without a filter, the word "cause" loses all meaning.

  **Who wins the point?** Marcus. Dana's initial definition was too broad. She needs a way to distinguish the roommate from the mailman without just saying "I feel like he's the cause."

  ### Round 3: The "Promise" and Responsibility

  **Dana's Claim:** "The difference is that the roommate PROMISED. He took on the job... your not-doing counts in a way a random stranger's not-doing doesn't."
  **Marcus's Claim:** "Then you're not talking about causation anymore, you're talking about blame or responsibility."

  **The Verdict:** **Dana is right about how we use language; Marcus is right that it blends concepts.**

  Dana introduces a **Normative Filter**. She is arguing that we select causes based on what was *expected* or *normal*. The mailman not feeding the fish is "background noise"—it's the normal state of affairs. The roommate not feeding the fish is an "abnormal intervention" in the expected order of things.

  Marcus argues this conflates *causation* (what happened) with *blame* (who is at fault). He thinks there is an objective fact of the matter about causation independent of human rules.

  However, most modern philosophers side closer to Dana here. Causal claims are rarely purely objective; they are **interest-relative**. When we ask "What caused the fish to die?", we aren't asking for a list of every physical condition required for the fish's existence. We are asking, "What factor *made the difference* in this specific context?"

  In a legal court, the roommate is the cause. In a biology lab, the cause is "metabolic shutdown due to caloric deficit." Both are true, but they answer different questions. Dana is answering the human question; Marcus is demanding the physics answer.

  **Who wins the point?** It's a draw, but Dana is more useful. Marcus is right that she is importing moral concepts (promises/duty) into a metaphysical question. But Dana is right that in human contexts, you *cannot* separate causation from expectation. We literally cannot identify "the cause" without knowing what was supposed to happen.

  ### What They Both Missed: Causal Connection vs. Causal Selection

  The reason they couldn't resolve this is that they are arguing about two different stages of causation.

  1.  **Causal Connection (The Web):** This is the objective web of all conditions necessary for the event. The water being wet, the gravity working, the roommate not feeding, the mailman not feeding, the fish having gills. All of these are *causally connected* to the death. Marcus is focused here.
  2.  **Causal Selection (The Spotlight):** This is the process of picking *one* factor from the web and labeling it "The Cause." We do this based on **abnormality** and **expectation**.

  **The Missing Solution:**
  The roommate is not the cause because of physics, and not *only* because of the promise. He is the cause because his behavior was an **abnormal deviation from a relevant system.**

  *   **The Mailman:** It is not the mailman's job to feed fish. His not feeding them is the *default state*. It provides no explanatory power.
  *   **The Roommate:** He was integrated into the "fish survival system." His role was to provide food. His failure was a malfunction of that system.

  Dana was right to focus on the promise, but she framed it as "moral blame." A better way to frame it is **Systemic Relevance.** The promise is just the evidence that he was part of the system. If you hired a fish-sitting service and they forgot, they caused the death, even if they didn't "promise" you personally (they have a contractual duty). If a random stranger walked in and saw the fish and didn't feed them, they aren't the cause, because they weren't part of the maintenance system.

  ### Final Scorecard

  *   **Is Marcus right that absences can't be causes?**
      *   **No.** In any practical, legal, or biological sense, absences are causes. If he insists on strict physics, he's right, but he makes the concept of causation useless for human life.
  *   **Is there an answer to "everyone caused it" other than the promise?**
      *   **Yes.** The answer is **Normalcy**. We distinguish causes from conditions based on what is abnormal. A fire is caused by the spark (abnormal), not the presence of oxygen (normal), even though both are necessary. The roommate's inaction was abnormal; the mailman's was normal.
  *   **Does Dana's last move work?**
      *   **Mostly.** She correctly identified that norms distinguish the roommate from the mailman. Marcus is technically right that this blends causation with responsibility, but he is wrong to think that makes it invalid. In human affairs, responsibility *determines* what we count as a cause.
  *   **What were they missing?**
      *   They missed the distinction between **Causal Connection** (everything that contributed) and **Causal Selection** (what we choose to highlight). Marcus was arguing about Connection; Dana was arguing about Selection.

  ### The Bottom Line for Your Roommate

  Dana wins the argument on practical grounds. In the context of human relationships and household management, the roommate **caused** the fish to die.

  Marcus is treating the situation like a physics equation, where "cause" must be a force. But you don't live in a physics equation; you live in a social contract. In a social contract, a failure to fulfill a designated function is a causal event.

  Your roommate owes you a fish not just because he is morally to blame, but because his omission is the only *relevant difference* that explains why the fish are dead today when they were alive two weeks ago. The mailman's omission explains nothing, because the mailman never fed them last month either. The roommate's behavior *changed*, and that change caused the death.

  Tell Dana she was right, but she should have used the word "expectation" instead of "promise." Tell Marcus he's right about billiard balls, but wrong about roommates.
