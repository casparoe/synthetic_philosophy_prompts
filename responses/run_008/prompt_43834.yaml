          *   *Status:* Folklore/Pseudoscience.
          *   *Nuance:* Social systems have damping mechanisms, agency, and feedback loops that aren't purely chaotic in the Lorenz sense. It's motivational, not scientific.

      *   **Chaos vs. Randomness:**
          *   Crucial distinction. Chaos is deterministic but unpredictable. Randomness is non-deterministic. The atmosphere is chaotic, not random.

      *   **Advice for the Article:**
          *   How to write about it without mangling it.
