      *   *Revelation:* The current norm is primarily *commercial/institutional*, not epistemic. It prioritizes the newspaper's role as a "town square" or "platform" over its role as "truth-teller" in the news columns. It protects the brand's broad appeal.
      *   *The Uncomfortable Answer:* The norm isn't about respecting the other side's truth claims; it's about respecting the other side's *market share*. It treats truth as a product to be segmented (News for the undecided, Editorials for the convinced, Fact-checks for the wonks).

