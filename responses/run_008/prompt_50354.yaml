answer: |-
  This is a precise dissection of a structural tension that most newsrooms feel but few articulate. You are asking for a reconstruction of the implicit epistemology of the "balance norm." Based on your description, here is that reconstruction, followed by the uncomfortable conclusion you requested.

  ### 1. The Theory of Peerhood and Good Faith

  The balancing norm presupposes a **sociological theory of peerhood**, not an epistemic one.

  In formal epistemology, an "epistemic peer" is someone equal to you in intelligence, diligence, and access to evidence. The "Equal Weight View" suggests that when peers disagree, you should significantly lower your confidence in your own position. Your newsroom does not actually believe the retired toxicologist is an epistemic peer of the regional dental association regarding fluoride. If they did, they would not allow the editorial board to declare one side "wrong."

  Instead, the news desk operates on a **proxy theory of legitimacy**. Peerhood is determined by *institutional representation* and *credentialing*, not by the weight of evidence. If a claimant has a title, an affiliation, and a press release, they are granted "procedural peerhood" for the purposes of the story.

  Regarding **good faith**, the norm does not presuppose that the *source* is arguing in good faith. It presupposes that a significant portion of the *audience* believes the source is arguing in good faith. The journalist acts as a trustee for the reader's uncertainty. If the reporter adjudicates the claim, they break faith with the segment of readers who view the toxicologist as legitimate. Therefore, the "good faith" being protected is not the disputants', but the *readers'*. The norm assumes that for a large slice of the public, the existence of a credentialed dissenter creates a genuine state of uncertainty, regardless of the scientific consensus. The journalist must mirror that uncertainty to maintain credibility with that segment.

  ### 2. Consistency Across Genres and the Function of Fact-Checking

  The presupposition is **not consistent** across the three genres. This inconsistency is not a bug; it is a feature of a "division of epistemic labor" designed to manage cognitive dissonance.

  *   **News:** Operates on **Epistemic Agnosticism**. (The truth is unknown or contested; our job is to map the conflict.)
  *   **Editorial:** Operates on **Epistemic Certainty**. (The truth is known; our job is to advocate for it.)
  *   **Fact-Check:** Operates on **Epistemic Adjudication**. (The truth is verifiable; our job is to label it.)

  If the boundary of "legitimate debate" were drawn consistently, the fact-check column would be redundant. If the news page admitted the toxicologist's claim was false, the fact-check would be unnecessary. If the editorial page treated the toxicologist as a peer, the endorsement would be impossible.

  So, what is the fact-check column for? It is a **pressure valve**. It allows the institution to discharge its obligation to truth without contaminating the "neutral" brand of the news pages. It absorbs the cognitive dissonance generated by the news desk's false equivalence. It tells the savvy reader, "We know the news story looked balanced, but *we* know the truth," while allowing the news story to tell the casual reader, "This is still a fight." It segregates the audience: the news page serves the undecided (who need to see the fight), and the fact-check serves the engaged (who want the resolution). This allows the paper to claim integrity in both modes without forcing a choice between them.

  ### 3. Steadfast vs. Equal-Weight: Requirements vs. Accommodations

  Does the norm require an Equal-Weight view? **No.** It merely accommodates it.

  Strictly speaking, the balancing norm is compatible with a **Steadfast View** held privately by the reporter. A reporter can believe 100% that the fluoride opponents are wrong (Steadfast) but choose to quote them anyway to fulfill a professional duty of "completeness" or "fairness."

  However, the *practice* mimics the Equal-Weight view so closely that it becomes indistinguishable from it to the reader. The norm requires the *suspension of adjudication*, not necessarily the suspension of belief. But because the reporter is forbidden from signaling their steadfastness in the copy (e.g., "Although the evidence overwhelmingly supports..."), the output is functionally identical to a reporter who genuinely believes the sides are equal.

  The practice would **not survive intact** under an openly Steadfast view in news copy. If reporters began writing "X claimed Y, which is false," the genre of "straight news" would collapse into "analysis" or "editorial." The balancing norm depends on the *performance* of uncertainty. It requires the reporter to bracket their own epistemic assessment (whether steadfast or equal-weight) to serve the higher goal of "recording the debate."

  ### 4. The Counterfactual and the Uncomfortable Truth

  If the paper replaced the peer-governance picture with a steadfast one—openly adjudicating claims in news copy based on the weight of evidence rather than the weight of credentials—three things would happen:

  1.  **Access would degrade.** Sources on the "losing" side would stop talking to the paper, accusing it of bias. The "town square" function would shrink.
  2.  **Audience segmentation would become explicit.** Readers who identified with the "losing" side would cancel subscriptions or label the paper "woke" or "corporate shill" (depending on the side). The paper would become a publication for the "convinced" rather than the "curious."
  3.  **The burden of expertise would shift.** Reporters would need to be actual experts, not just process managers. They would need to understand the science well enough to adjudicate in real-time, rather than relying on the proxy of "does this person have a title?"

  **The Uncomfortable Conclusion**

  You asked whether the current norm is an epistemic commitment or a commercial one wearing epistemic clothes.

  **It is a commercial commitment wearing epistemic clothes.**

  The "balancing norm" is not derived from a philosophical commitment to the Equal Weight View or the value of disagreement. If it were, the boundary of "legitimate debate" would shift as the evidence shifts. As you noted, the boundary moves based on *institutional representation*, not evidence. This proves the metric is sociological, not scientific.

  The norm exists to maximize the surface area of the newspaper's appeal. By refusing to adjudicate in news copy, the paper avoids alienating any subscriber who identifies with either side of the "debate." It treats truth as a product that can be segmented: sell the *conflict* to the masses (News), sell the *resolution* to the wonks (Fact-Check), and sell the *morality* to the engaged citizens (Editorial).

  The implicit theory is not "We respect the other side's epistemic standing." It is "We respect the other side's market share."

  The "peerhood" you observe is a market category. A credentialed dissenter represents a demographic of readers who believe that dissent is valid. To ignore them in the news columns is to tell that demographic, "You do not exist." To include them is to say, "You are a valid customer." The fact-check column exists to reassure the *other* demographic (the science-literate subscribers) that the paper hasn't actually gone mad, preserving their subscription while the news page courts the undecided.

  This is why the boundary is inarticulable to the staff. If they admitted the boundary is drawn by subscription demographics and institutional access rather than evidence, the epistemic authority of the entire publication would collapse. They must believe they are practicing "neutrality" to do the work, but the structure of that neutrality is designed to protect revenue streams, not truth conditions. The "division of labor" between News, Fact-Check, and Editorial is a firewall designed to keep the commercial necessity of balance from incinerating the journalistic necessity of truth.
