      *   **Task:** Reconstruct the implicit theory behind this norm.
      *   **Specific Questions to Address:**
          1.  What view of rational disagreement, good faith, and peerhood does the norm presuppose? (Epistemic peers vs. audience trust?)
          2.  Is the presupposition consistent across the three genres? If not, what is the fact-check column for?
          3.  Separate strict requirements from accommodations. Would it survive a "steadfast" view (my side is right) or does it need an "equal-weight" view?
          4.  What would change if the paper switched to a "steadfast" view (adjudicating in news)? What does this reveal about the norm (epistemic vs. commercial)?
      *   **Constraint:** "I would rather have an uncomfortable answer that fits the facts than a tidy one that doesn't." (Needs to be critical, realistic, and nuanced, not idealistic).

  2.  **Deconstruct the "Balancing Norm":**
      *   *Current Practice:* News = Neutral balance (even if one side is wrong). Fact-Check = Truth verdict. Editorial = Opinion/Advocacy.
      *   *Implicit Logic:* News is for *process* (reporting the conflict), not *product* (the truth).
      *   *Epistemic Status:* It treats institutional presence as a proxy for epistemic validity. If a credentialed person says it, it counts as a "side," regardless of scientific consensus.

  3.  **Address Question 1: Rational Disagreement, Good Faith, and Peerhood:**
      *   *Epistemic Peerhood:* In philosophy (e.g., David Christensen, Adam Elga), an epistemic peer is someone equally intelligent, informed, and diligent. If peers disagree, you should lower confidence (Equal Weight View).
      *   *Journalistic Application:* The newsroom treats "institutional representation" as a proxy for peerhood. If the Dental Association vs. a Toxicologist, they look like peers *sociologically*, even if the evidence isn't equal.
      *   *Good Faith:* The norm doesn't necessarily assume the *arguer* is in good faith, but rather that the *audience* perceives them as legitimate. It's a "public reason" model.
      *   *Verdict:* It presupposes a *procedural* view of peerhood (status-based) rather than a *substantive* one (evidence-based). It assumes the reporter is *not* an epistemic authority on the topic, so they must defer to the apparent peers.

  4.  **Address Question 2: Consistency Across Genres:**
      *   *News:* Agnostic. "Here is the fight."
      *   *Editorial:* Partisan. "Here is the right side."
      *   *Fact-Check:* Adjudicatory. "Here is the truth value."
      *   *Consistency:* It is *inconsistent* epistemically. It creates a "division of epistemic labor."
      *   *Purpose of Fact-Check:* It acts as a pressure valve. It allows the paper to claim truth-telling without contaminating the "neutral" news brand. It preserves the fiction of the news page's neutrality while acknowledging reality elsewhere. It's a compartmentalization strategy.

  5.  **Address Question 3: Steadfast vs. Equal-Weight:**
      *   *Equal-Weight View:* If peers disagree, suspend judgment. This fits the News norm best.
      *   *Steadfast View:* Stick to your guns if you think you're right. This fits Editorials/Fact-Check.
      *   *Does the norm require Equal-Weight?* Strictly speaking, no. A reporter could be steadfast but silent. But the *practice* of balancing implies an Equal-Weight *simulation*.
      *   *Accommodation:* It accommodates the *appearance* of Equal-Weight to maintain trust, even if the editors are Steadfast privately.
      *   *Survival:* If the news desk adopted a Steadfast view openly, the "News" genre would collapse into "Editorial." The norm depends on the *suspension* of adjudication, which aligns more with Equal-Weight (or skepticism about one's own authority).

  6.  **Address Question 4: Counterfactual (Switching to Steadfast in News) & The Uncomfortable Truth:**
      *   *Change:* Reporters would write "X is false" in news stories.
