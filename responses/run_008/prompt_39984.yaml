  A **blame-based explanation** predicts readers will judge the harmful side effect (inaccurate records) as intentional because it invites blame for negligence, while the helpful side effect (avoiding write-up) is unintentional because we rarely attribute intentionality to praise side effects. A **norm-violation explanation** predicts readers will judge the helpful side effect as intentional because bringing it about requires violating a normative rule (honesty/procedure), whereas the harm is merely collateral damage of that violation. This case favors the **norm-violation explanation**, as typical readers often view "covering for a coworker" as an intentional act of assistance precisely because it breaches a rule, while the data inaccuracy is seen as an unintentional byproduct. The feature doing the work is that the **helpful outcome is contingent on a norm violation**.

