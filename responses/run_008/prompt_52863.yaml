prompt: |-
  I'm a genetic counselor at a fertility clinic that has begun offering embryo screening beyond single-gene tests — polygenic risk scores for diabetes, heart disease, depression, and more — and the volume of selection requests has outpaced our ad hoc way of handling them. Our clinical director has asked me to draft a decision procedure the counseling team can run on any request, and she wants it grounded in the principle of procreative beneficence: the claim that parents have at least a pro tanto moral reason, among the children they could have, to choose the one expected to have the best prospects for a flourishing life. Our staff disagree about whether that's a duty, a mere permission, or a pernicious idea, and the procedure has to be usable in a twenty-minute consult by nurses with no philosophy background, often under time pressure because decisions must be made before a transfer cycle. Please write that procedure: the questions to ask in order (severity and age of onset of the condition, how informative the risk score actually is, whether the condition is treatable, how many healthy alternatives the parents have, whether the trait is identity-affecting — i.e., whether selecting against it means a different child or a better life for the same child), what counts as a sufficient answer to each, where the procedure ends in a firm 'we don't advise that', and where it must hand the decision back to the parents because the question is one of values rather than clinical facts — and be honest about which steps are judgment calls dressed up as procedure. Then run it on three cases: parents choosing against an embryo that will develop a fatal neurodegenerative disease in mid-life; parents asking to deselect embryos with elevated polygenic scores for depression despite having no family history; and a Deaf couple requesting selection for deafness so their child joins the Deaf community, which I suspect several of our counselors privately think the procedure should permit even though our director will hate that answer. Finally, say where the procedure misfires or underdetermines the answer — especially for polygenic scores, where 'best prospects' gets slippery — and what it cannot settle at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Genetic Counselor at a fertility clinic.
      *   **Task:** Draft a decision procedure for embryo screening requests (specifically Polygenic Risk Scores - PRS) based on the principle of *Procreative Beneficence* (PB).
      *   **Audience:** Counseling team (nurses/counselors) with no philosophy background, under time pressure (20-min consult).
      *   **Key Constraints:** Must be actionable, acknowledge disagreements among staff (duty vs. permission vs. pernicious), identify judgment calls, run on three specific cases, and critique its own limitations.
      *   **Specific Cases:**
          1.  Fatal neurodegenerative disease (mid-life onset).
          2.  PRS for depression (no family history).
          3.  Deaf couple selecting *for* deafness.
      *   **Tone:** Professional, clinically grounded, ethically honest, pragmatic.

  2.  **Deconstruct the Ethical Framework (Procreative Beneficence):**
      *   *Definition:* Parents have a *pro tanto* reason (a reason that can be outweighed by other reasons) to choose the child with the best expected life prospects.
      *   *Implication:* It's not necessarily an absolute duty (which would be too rigid), but it's the guiding star. It requires balancing "best life" against other values (autonomy, identity, social justice).
      *   *Challenge:* PRS is probabilistic, not deterministic. "Best prospects" is vague.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Goal:* A flowchart-style text that fits a 20-minute consult.
      *   *Structure:* Sequential questions (Gates). If a gate fails, stop or refer.
      *   *Key Variables requested:* Severity, Age of Onset, Informativeness (Predictive Value), Treatability, Alternatives, Identity-Affecting.
      *   *Decision Points:* "We don't advise" (Clinical Veto) vs. "Parental Discretion" (Values).
      *   *Honesty:* Need to flag where "clinical facts" are actually ethical judgments.

      *   *Drafting Steps:*
          1.  **Intake/Validation:** Is the test valid? (PRS reliability is low compared to monogenic).
          2.  **Harm Assessment:** Severity/Onset/Treatability. (High severity/early/onset = stronger PB argument).
          3.  **Alternatives:** Do they have healthy embryos? (If only one embryo, PB doesn't apply).
          4.  **Identity/Community:** Is the trait constitutive of identity? (Deafness example).
          5.  **Conclusion:** Advise, Discourage, or Defer.

  4.  **Refining the Procedure for the Audience:**
      *   Avoid jargon like "pro tanto." Use "strong reason but not absolute."
      *   Make it a checklist.
      *   Explicitly mark "Judgment Call" zones.

  5.  **Running the Cases:**
      *   *Case 1 (Fatal Neurodegenerative):* High severity, late onset but fatal. PB strongly supports selection against. *Outcome:* Advise selection against.
      *   *Case 2 (PRS Depression):* Low predictive value, multifactorial, treatable, identity implications. PB is weak here. *Outcome:* Defer to parents, but counsel on limitations.
      *   *Case 3 (Deaf Couple):* PB usually says "hearing is better," but Disability Critique says "Deaf life can flourish." This challenges PB. *Outcome:* This is the hardest one. The procedure needs to allow for "values" override. If the procedure is strictly PB, it says "No." If it respects parental values *within* PB (flourishing is subjective), it might allow it. I need to navigate the Director's likely objection vs. the Counselor's intuition. *Decision:* The procedure should flag this as a "Values Conflict" where PB is contested, ultimately deferring to parents but documenting the dissent.

  6.  **Critiquing the Procedure (The "Honesty" Section):**
      *   Where does it fail?
      *   PRS reliability (the "informativeness" step is shaky).
      *   Defining "Flourishing" (is it health or happiness?).
      *   The "Non-Identity Problem" (selecting a different embryo means a different person, so are we harming anyone?).
      *   Social vs. Medical model of disability.

  7.  **Review against Constraints:**
      *   20-minute consult feasible? Yes, if checklist is tight.
      *   Addressed staff disagreement? Yes, by distinguishing "Clinical Veto" from "Values Decision."
      *   Addressed Director's PB requirement? Yes, used as the primary filter.
      *   Addressed the Deaf case sensitivity? Yes, acknowledged the tension.

  8.  **Final Polish:**
      *   Ensure the tone is supportive but firm on limitations.
      *   Make sure the "Judgment Call" warnings are visible.
      *   Ensure the distinction between *monogenic* (high certainty) and *polygenic* (low certainty) is clear, as the prompt highlights the shift to PRS.

      *(Self-Correction during drafting)*: I initially thought about making PB a strict duty. But the prompt says staff disagree. The procedure should treat PB as a *presumption* rather than a *command*, allowing for override in values-based cases. This aligns with "pro tanto."
      *Correction on Case 3:* The Director will hate the Deaf selection. The procedure must be honest: PB usually argues *against* selecting for disability. However, if "flourishing" includes cultural belonging, PB *could* support it. I need to show this ambiguity. I will structure the procedure to flag this as a "Values Definition" step where the clinic might have a policy veto, but ethically it's a parental value call. *Wait, the prompt asks me to write the procedure the Director asked for (grounded in PB).* If I ground it strictly in PB, selecting *for* deafness is hard to justify unless I redefine flourishing. I will write the procedure to reflect the tension: PB suggests against it, but parental autonomy allows it *unless* it causes significant harm. I will note the Director's likely pushback in the analysis.

      *Refining the "Judgment Call" aspect:* I need to explicitly state that "Severity" and "Informativeness" are not purely objective in PRS contexts.

  9.  **Final Output Structure:**
      *   Introduction (Context & Purpose).
      *   The Procedure (The "PRS Selection Protocol").
      *   Case Applications (1, 2, 3).
      *   Critical Analysis (Where it misfires/limitations).

  10. (Final check of the Prompt's specific request): "be honest about which steps are judgment calls dressed up as procedure." -> I will add "Clinician Note" boxes or bold text to highlight this. "say where the procedure misfires... especially for polygenic scores." -> Include a dedicated section at the end.

  Let's write it.cw
answer: |-
  **TO:** Clinical Director, Fertility Services
  **FROM:** Genetic Counseling Team
  **SUBJECT:** Draft Decision Procedure for Polygenic Risk Score (PRS) Embryo Selection
  **DATE:** October 26, 2023

  ### **Context and Purpose**
  This procedure is designed for use during pre-transfer counseling sessions (approx. 20 minutes). It operationalizes the principle of **Procreative Beneficence (PB)**: *Parents have a significant moral reason to select the embryo expected to have the best prospects for a flourishing life, provided this does not conflict with other significant moral values.*

  This document acknowledges staff disagreement on whether PB is a duty or a permission. Therefore, this procedure treats PB as a **presumptive guideline** rather than an absolute mandate. It distinguishes between **Clinical Veto** (medical grounds to refuse) and **Values Deferral** (ethical grounds to return decision to parents).

  ***

  ### **The PRS Selection Protocol (PSP)**

  **Instructions:** Complete this checklist sequentially. If a step triggers a "Stop," do not proceed to selection support without senior review.

  #### **Step 1: Validity and Informativeness Check**
  *Question:* Is the Polygenic Risk Score (PRS) for this condition clinically validated and sufficiently predictive to distinguish meaningfully between embryos?
  *   **Criteria:** The score must demonstrate a relative risk reduction of >20% between the highest and lowest risk embryos *and* have peer-reviewed validation in the patient's ancestral population.
  *   **Sufficient Answer:** "Yes, the lab report indicates high discriminative ability for this specific trait."
  *   **Insufficient Answer:** "The lab says it's available," but confidence intervals overlap significantly between embryos.
  *   **Action:** If **Insufficient**, trigger **Clinical Veto**. (We cannot advise selection on noise).
  *   **[JUDGMENT CALL WARNING]:** *Determining "meaningful distinction" is statistical but interpreting its clinical relevance is ethical. A 5% risk reduction for heart disease is not the same as a 5% reduction for a fatal childhood condition.*

  #### **Step 2: Severity and Onset Assessment**
  *Question:* What is the expected burden of the condition if it manifests?
  *   **Criteria:**
      *   **High Severity:** Fatal, significantly life-shortening, or causes severe chronic pain/incapacity.
      *   **Moderate Severity:** Manageable chronic condition, impacts quality of life but not lifespan.
      *   **Low Severity:** Mild traits, late-onset conditions with high treatability.
  *   **Action:**
      *   **High Severity:** Strong presumption for selection *against* the trait (PB applies strongly).
      *   **Low/Moderate Severity:** Weak presumption. Proceed to Step 3.
  *   **[JUDGMENT CALL WARNING]:** *"Severity" is subjective. Is depression severe? Is deafness severe? The counselor must map medical facts to patient values here.*

  #### **Step 3: Treatability and Intervention**
  *Question:* Can the condition be effectively treated or managed post-birth?
  *   **Criteria:** Are there reliable medical, social, or behavioral interventions that normalize life prospects?
  *   **Action:** If **Highly Treatable**, the PB reason to select against the embryo weakens significantly.
  *   **Action:** If **Untreatable/Fatal**, the PB reason strengthens.

  #### **Step 4: Availability of Alternatives**
  *Question:* Are there other embryos available that do not carry this elevated risk?
  *   **Criteria:** At least one embryo with significantly lower risk profile exists.
  *   **Action:** If **No** (only affected embryos exist), PB does not apply (no choice to be made). Proceed to standard care.
  *   **Action:** If **Yes**, proceed to Step 5.

  #### **Step 5: Identity and Community Impact**
  *Question:* Is the trait constitutive of a specific cultural identity or community membership (e.g., Deafness, Dwarfism)?
  *   **Criteria:** Does selecting against this trait exclude the child from a community the parents value as essential to flourishing?
  *   **Action:**
      *   If **No** (e.g., Diabetes, Heart Disease): PB presumption stands.
      *   If **Yes**: This triggers a **Values Deferral**. The definition of "flourishing" is contested.
  *   **[JUDGMENT CALL WARNING]:** *This is the most ethically loaded step. Deciding whether a trait is a "medical burden" or a "cultural identity" is not a clinical fact. It is a sociological judgment.*

  #### **Step 6: The Decision Point**
  *   **Path A (Clinical Veto):** If Step 1 failed (invalid test) OR Step 2/3 indicate low severity/high treatability but parents insist on selection *for* a disability that impairs basic functioning (e.g., selecting for a fatal metabolic disorder).
      *   *Script:* "We cannot support this selection. The medical evidence suggests this does not align with the goal of maximizing health prospects, and the test reliability is insufficient."
  *   **Path B (Values Deferral):** If Steps 1-4 are passed, but Step 5 indicates an identity conflict, or if the condition is moderate/PRS is probabilistic (e.g., depression).
      *   *Script:* "Medically, the data is inconclusive on which embryo offers a 'better' life. This decision rests on your values regarding risk and identity. We will support your choice."
  *   **Path C (PB Recommendation):** If Steps 1-4 indicate high severity, low treatability, and no identity conflict.
      *   *Script:* "Based on the goal of minimizing severe health risks, we recommend selecting the embryo with the lower risk profile."

  ***

  ### **Case Applications**

  #### **Case 1: Fatal Neurodegenerative Disease (Mid-Life Onset)**
  *   **Step 1 (Validity):** High. (Assuming monogenic or high-confidence PRS).
  *   **Step 2 (Severity):** High. Fatal and neurodegenerative.
  *   **Step 3 (Treatability):** Low. No cure.
  *   **Step 4 (Alternatives):** Yes, healthy embryos exist.
  *   **Step 5 (Identity):** No specific cultural identity associated.
  *   **Protocol Outcome:** **Path C (PB Recommendation).**
  *   **Counseling Stance:** We advise selecting against the embryo. The "best prospects" calculation is clear: a life without fatal neurodegeneration is objectively preferable in terms of health span.
  *   **Staff Consensus:** High. This aligns with traditional medical ethics.

  #### **Case 2: PRS for Depression (No Family History)**
  *   **Step 1 (Validity):** Low/Moderate. PRS for psychiatric conditions has low predictive value compared to environmental factors.
  *   **Step 2 (Severity):** Moderate/Variable. Can be severe, but often manageable.
  *   **Step 3 (Treatability):** Moderate. Therapy and medication exist, though access varies.
  *   **Step 4 (Alternatives):** Yes.
  *   **Step 5 (Identity):** Potential. Mental health traits can shape personality/resilience.
  *   **Protocol Outcome:** **Path B (Values Deferral).**
  *   **Counseling Stance:** We do not advise selection based on this score. The "informativeness" threshold is barely met, and "flourishing" with a risk of depression is not clearly worse than without it, given treatability.
  *   **Honesty Check:** This stops the "designer baby" slide. It admits that PRS for behavior is too noisy to satisfy the PB requirement of "expected best prospects."

  #### **Case 3: Deaf Couple Selecting *For* Deafness**
  *   **Step 1 (Validity):** High (Genetic cause of deafness is usually clear).
  *   **Step 2 (Severity):** **Contested.** Medical model = High Severity (sensory loss). Cultural model = Low Severity (difference).
  *   **Step 3 (Treatability):** High (Cochlear implants, hearing aids), but Deaf community often rejects these as "cures."
  *   **Step 4 (Alternatives):** Yes, hearing embryos exist.
  *   **Step 5 (Identity):** **Yes.** Central to Deaf culture.
  *   **Protocol Outcome:** **Path B (Values Deferral) with Clinic Policy Caveat.**
  *   **Counseling Stance:** Here, the procedure strains. Strict PB (medical definition of flourishing) says "Select for Hearing." Relational PB (flourishing within a community) says "Select for Deafness."
  *   **Resolution:** The procedure flags this as a Values Deferral. However, because our Director views PB as health-maximization, she will likely override this.
  *   **Recommendation:** I recommend we allow this under "Values Deferral." If we claim to respect parental values on flourishing, we must accept their definition of community belonging, provided the child will not suffer *net harm* (e.g., inability to communicate). A Deaf child in a Deaf family does not suffer net harm.
  *   **Director's Likely Objection:** She will argue Step 2 (Severity) is objective medical fact, not cultural opinion.
  *   **My Counter:** Step 2 is marked as a [JUDGMENT CALL]. Denying this is denying the sociological reality of the Deaf community.

  ***

  ### **Critical Analysis: Where the Procedure Misfires**

  As requested, I am highlighting where this procedure is "judgment calls dressed up as procedure" and where it fails to settle the ethical debate.

  **1. The "Informativeness" Trap (PRS Limitations)**
  The procedure assumes we can know if a score is "informative" (Step 1). For polygenic scores, this is often false confidence. A 10% risk reduction in diabetes is statistically real but clinically negligible for an individual.
  *   *Misfire:* The procedure might grant a "Path C" recommendation for a PRS trait that is too probabilistic to warrant moral weight. We risk medicalizing statistical noise.
  *   *Unsettled:* We cannot settle what probability threshold constitutes a "moral reason." Is 5% enough? 20%? The procedure sets a 20% rule, but that is arbitrary.

  **2. The Definition of "Flourishing"**
  Procreative Beneficence relies on a shared understanding of a "good life."
  *   *Misfire:* In Case 3 (Deafness), the procedure breaks because "flourishing" is undefined. If flourishing = health, hearing wins. If flourishing = belonging, Deafness might win. The procedure tries to hand this back to parents (Step 5), but the Clinic's liability and reputation may not allow that hand-off.
  *   *Unsettled:* The procedure cannot resolve the conflict between the *Medical Model* of disability (impairment is bad) and the *Social Model* (barriers are bad). It papers over this with the "Values Deferral" option, which may not protect counselors from administrative pushback.

  **3. The Non-Identity Problem**
  The procedure implicitly assumes we are helping *the same child* have a better life. In embryo selection, selecting Embryo A means Embryo B is never born. They are different people.
  *   *Misfire:* Step 2 asks about "Severity for the child." But if we select against a condition, we aren't saving a child from that condition; we are creating a *different* child who doesn't have it.
  *   *Unsettled:* The procedure ignores this metaphysical hurdle because it is too complex for a 20-minute consult. However, it means the "Harm" calculation is philosophically shaky. We are not preventing harm to an existing entity; we are choosing which entity to create.

  **4. Resource Inequality**
  *   *Misfire:* The procedure assumes "Treatability" (Step 3) is a fixed fact. It is not. Depression is treatable *if* you have insurance and access. Diabetes is manageable *if* you have money for insulin.
  *   *Unsettled:* PB becomes a classist principle if we advise selection based on conditions that are only "severe" due to social neglect. The procedure treats medical facts as context-free, which they are not.

  ### **Final Recommendation**
  Adopt the **PSP** with the explicit understanding that **Step 2 (Severity)** and **Step 5 (Identity)** are ethical negotiation points, not clinical checkboxes. For the Deaf couple case, I advise we classify this as a **Values Deferral** to maintain consistency with our commitment to patient autonomy, even if it conflicts with a rigid interpretation of Procreative Beneficence. If the Director insists on a veto here, we must acknowledge we are prioritizing a specific definition of "health" over "flourishing."
