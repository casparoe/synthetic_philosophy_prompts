answer: |-
  We walked a road that seemed to have no end,
  Where every gift was met with gift again.
  When you would strike, I made my back defend,
  Then offered peace to mend the broken chain.
  No clock ticked loud enough to measure days,
  So future fear kept present hunger still.
  We lost the measure in the hazy maze,
  And held our bond above a selfish will.
  But then the voice declared the final turn,
  And drew the line for steps now remaining.
  Now why should I restrain my hand to burn,
  When no tomorrow brings a reckoning?
  If last is take, then first was take as well;
  Our history was but a long farewell.
