prompt: |-
  I'm the medical director of a small crisis stabilization unit, and my intake team (mostly residents plus a couple of experienced nurses) triages between ten and fifteen new presentations a day, often at 2am with a worried family or a cop standing in the room, and whatever we decide has to get signed off by the on-call attending within the hour. Recently I reread Szasz — The Myth of Mental Illness, plus his later writing on coercion and psychiatric law — and I've been going back and forth on it. What sticks with me aren't the slogans but his actual distinctions: literal disease, meaning a pathological process in the body you can detect through signs and tests independent of what the person says or does, versus the metaphorical "disease" language psychiatry borrows; "illness" as a social role that legitimates exemptions and care, which is partly why families, courts, and schools keep wanting the label attached; most of what we see being what he called problems in living; and treatment as a contract between consenting adults rather than something done to someone. I'm about half convinced — the other half of me thinks that following him faithfully would one day get a patient killed — and I don't want my junior staff becoming idealogues in either direction.

  So what I want is a procedure the intake clinician can actually run in the first fifteen minutes: the questions to ask, in order (about the person and their history, the physical exam and labs, and crucially about who is asking for what), what counts as a sufficient answer to each, where the procedure stops with "this is medicine, work it up as literal disease," where it lands on "this is a problem in living — offer help, don't impose it," and where it explicitly refuses to decide because the question is one of values, custody, or law rather than facts, and says so out loud. Please build in the branch that mattered to Szasz himself, the general paresis lesson: when a "mental" presentation turns out to have a bodily cause, it stops being psychiatry's metaphor and becomes literal medicine — so the procedure needs to say what makes an organic cause plausible enough to route someone to the full medical workup, without sending every sad or frightened person off for a CT.

  Then run it on three cases. One: a 34-year-old who calls the unit herself, on her own initiative, asking for help with panic attacks that are wrecking her job. Two: parents arrive with their 22-year-old son, who has stopped bathing, says he hears his dead grandfather, insists he's fine, and wants to leave; they want him "treated" and are asking whether we can hold him. Three: a 58-year-old brought in by police after a week of escalating paranoia and mild confusion, no psychiatric history at all. For each, tell me what the procedure yields, and flag it if the answer is one I won't like. And be honest with me at the end: which steps are real tests, which are judgment calls dressed up as procedure, and what the whole thing cannot do. My guess is it can't weigh dangerousness and can't settle any question about holding people against their will — I want you to say plainly where those live, if not inside the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Medical Director of a small Crisis Stabilization Unit (CSU).
      *   **Context:** High volume (10-15/day), high pressure (2 AM, cops/families present), time-constrained (attending sign-off within an hour), mixed staff (residents + experienced nurses).
      *   **Intellectual Framework:** Thomas Szasz (*The Myth of Mental Illness*, coercion, psychiatric law).
      *   **Internal Conflict:** Half-convinced by Szasz (distinction between literal disease vs. problems in living, treatment as contract), half-fearful (patient safety/risk of harm).
      *   **Goal:** A practical 15-minute intake procedure/algorithm based on Szaszian distinctions but safe for clinical practice.
      *   **Requirements:**
          *   Specific questions in order.
          *   Criteria for "sufficient answer."
          *   Decision points: Literal Disease (Medical Workup) vs. Problem in Living (Voluntary Help) vs. Refusal to Decide (Legal/Values).
          *   Specific branch for "General Paresis Lesson" (organic causes).
          *   Application to three specific cases.
          *   Honest critique at the end (what's real vs. judgment call, what the procedure *cannot* do, specifically regarding danger/holding).

  2.  **Deconstruct Szasz's Core Arguments for Clinical Application:**
      *   *Literal Disease:* Pathophysiology, signs/tests independent of behavior (e.g., neurosyphilis, tumor, delirium).
      *   *Metaphorical Disease:* Deviations in psychosocial conduct, emotions, or thoughts (e.g., depression, anxiety, schizophrenia as currently defined).
      *   *Illness Role:* Social legitimation for exemption from responsibility.
      *   *Coercion:* Treatment should be a contract between consenting adults. State intervention is only justified by crime (law) or incapacity (medical), not "mental illness" alone.
      *   *General Paresis:* If it's organic, it's medicine, not psychiatry.

  3.  **Drafting the Procedure (The "Szasz-Informed Triage Protocol"):**
      *   *Constraint:* Must be doable in 15 minutes by residents/nurses.
      *   *Structure:* Needs to flow logically from ruling out medical emergencies to assessing consent to assessing social context.
      *   *Step 1: The Organic Screen (General Paresis Branch).* Vital signs, delirium screen, focal neuro signs, acute onset in older adult, substance toxicity. *Decision:* If positive -> ER/Medical. If negative -> Proceed.
      *   *Step 2: The Agency & Consent Screen.* Who is here? Who wants what? Is the patient asking for help or being brought? *Decision:* If patient consents -> Contract. If patient refuses & no legal hold criteria -> Discharge/Refer.
      *   *Step 3: The "Problem in Living" Assessment.* What is the actual conflict? (Job, housing, family, grief). *Decision:* Social work/therapy vs. Medicalization.
      *   *Step 4: The Legal/Coercion Boundary.* Explicitly state if the request is for custody/control rather than care.

  4.  **Refining the Procedure (Addressing the "Safety" Concern):**
      *   The user is worried about patients getting killed. Szasz is often criticized for underestimating biological risk (suicide due to psychosis).
      *   *Modification:* The procedure must acknowledge *imminent* risk of physical harm (to self/others) as a legal/ethical exception to the "contract" model, even if Szasz might argue it's a legal matter, not medical. I need to be honest that *dangerousness* is the loophole where Szaszian purity breaks down in modern practice.
      *   *Refinement:* I will keep the Szaszian framework but add a "Risk of Immediate Physical Harm" gate. If present, it moves from "Contract" to "Legal/Protective."

  5.  **Developing the Three Cases:**
      *   *Case 1 (34F, Panic, Self-referral):* Fits Szasz's "Contract" model perfectly. Problem in living (job stress). No organic signs.
      *   *Case 2 (22M, Psychosis, Parents want hold):* The classic coercion case. Patient denies illness. Parents want control. Szasz would say "No hold unless crime or incapacity." Modern law says "Grave Disability/Danger." I need to show where the procedure flags the *conflict of interest*.
      *   *Case 3 (58M, Paranoia + Confusion, Police):* The "General Paresis" case. Late onset + confusion = Organic until proven otherwise. This is where Szasz agrees with medicine.

  6.  **Addressing the "Honest Critique" (The Meta-Analysis):**
      *   What is a real test? (Vitals, CAM for delirium).
      *   What is a judgment call? (Capacity, "Imminent" risk, distinguishing severe grief from depression).
      *   What can't it do? (It cannot solve the legal standard for involuntary hold. It cannot predict violence. It cannot fix the fact that the *law* requires doctors to be gatekeepers of liberty, which Szasz hated).

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, peer-to-peer, intellectually rigorous, clinically grounded. Not dismissive of Szasz, not dismissive of safety.
      *   *Formatting:* Clear headings, bullet points for the algorithm, distinct sections for cases and critique.
      *   *Key Szaszian Terminology:* Use "Problems in Living," "Literal Disease," "Therapeutic Contract."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make the procedure too complex?
      *   *Fix:* Simplify the steps. 1. Medical Rule-Out. 2. Agency/Consent. 3. Nature of Complaint.
      *   *Critique:* Did I address the "holding" issue?
      *   *Fix:* Explicitly state that the procedure *identifies* the coercion but doesn't *solve* the legal standard. The user asked to flag where the procedure refuses to decide.
      *   *Critique:* Is the "General Paresis" branch clear?
      *   *Fix:* Make it Step 1. If Delirium/Organic signs -> Medical.
      *   *Critique:* The user wants to know what they "won't like."
      *   *Fix:* In Case 2, the Szaszian answer is "Don't hold him." The legal answer might be "Hold him." I need to highlight this tension.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   15-minute intake? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Three cases run? Yes.
      *   Honest critique at end? Yes.
      *   Specific focus on "who is asking for what"? Yes.

  10. (Final thought on Safety): I must ensure I don't give medical advice that negates standard of care. I will frame this as a *triage heuristic* for discussion, not a replacement for legal/clinical standards of care regarding involuntary holds. The prompt asks for a procedure *based on Szasz*, so I will build that, but the critique section must warn about the legal liability.

  *(Self-Correction on Case 2)*: If I follow Szasz strictly, I cannot hold the 22-year-old unless he commits a crime. But the user is a Medical Director in a real system. I need to show what the Szaszian procedure *yields*, even if it conflicts with current law. The prompt asks: "flag it if the answer is one I won't like." Okay, I will be blunt there.

  *(Self-Correction on Case 3)*: This is the easy one for Szasz. It's medical.

  *(Self-Correction on Critique)*: Be very clear that "Dangerousness" is not a medical diagnosis. It's a legal prediction. Szasz was right about that.

