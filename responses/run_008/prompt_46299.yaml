      **Title:** The Pleasure Trap: A Hedonism Seminar Activity

      **Materials:**
      Print 12 cards (2 sets). Each describes a first-person episode:
      1.  *Runner's High:* Euphoric, physical, intense.
      2.  *Spicy Burn:* Painful yet sought-after sensory intensity.
      3.  *Thirst Quenched:* Subtle sensory relief, barely noticed until gone.
      4.  *Proof Solved:* Frustrating process, deep satisfaction only at the end.
      5.  *Sad Music:* Melancholy absorption; painful feeling but valued experience.
      6.  *Schadenfreude:* Pleasant feeling, morally repugnant object.
      7.  *Depressive Eating:* Mechanical consumption; desired but devoid of taste/joy.
      8.  *Duty Done:* Relief after burden lifted; no positive buzz, just absence of pain.
      9.  *Flow State:* Lost track of time; no conscious pleasure during activity.
      10. *Warm Bath:* Passive sensory comfort, low intensity.
      11. *Surprise Party:* Overwhelming social joy, fleeting.
      12. *Parental Pride:* Quiet, attitudinal, enduring, low sensory profile.

      **Rules (45 mins):**
      Divide class into two teams (Proposers vs. Skeptics).
      1.  **Definition Phase (10 mins):** Proposers examine all cards. They must formulate a necessary and sufficient condition for "Pleasure" that includes all cards they deem "Genuine Pleasures" (they may discard up to 2 cards as "Non-Pleasures").
      2.  **Counterexample Round (35 mins):** Proposers state their feature (e.g., "positive felt tone"). Skeptics score points by playing a card from the deck or inventing a plausible episode that either:
          *   Has the feature but isn't pleasure (False Positive).
          *   Is pleasure but lacks the feature (False Negative).
          *   *Constraint:* Proposers may shift definitions three times, but must address previous counterexamples.

      **Engineered Escape Routes:**
      The deck forces three specific theoretical pivots, each of which fails:
      1.  **Circularity ("It feels good"):** Skeptics play *Sad Music* or *Proof Solved*. The feeling isn't straightforwardly "good" in the moment, yet students classify them as welfare-contributing.
      2.  **Family Resemblance ("They are similar"):** Skeptics ask what links *Spicy Burn* and *Warm Bath*. If the answer is vague, hedonism lacks explanatory power.
      3.  **Desire-Satisfaction ("It's what you want"):** Skeptics play *Depressive Eating* (wanted, no pleasure) or *Schadenfreude* (pleasure, often unwanted/regulated).

      **Timeline:**
      *   0-10: Intro & Card Sort.
      *   10-20: Definition Phase.
      *   20-55: Counterexample Round.
      *   55-70: Debrief.
      *   70-75: Wrap-up.

      **Predictable Failure:**
      First run: Proposers will define pleasure as "what contributes to well-being." This begs the question. Interrupt immediately and demand a phenomenological description.

      **Limitations (Instructor Note):**
      This activity cannot reproduce the *qualia* itself. Students are debating descriptions, not experiences. The heterogeneity might be an artifact of language rather than ontology. You must supply the philosophical bridge: does the failure to find a common thread prove hedonism false, or merely that pleasure is non-reductive (like "yellow")? Also, distinguish between hedonism as a theory of *value* vs. welfare economics' *utility measurement*. The activity targets the former; economics often sidesteps the heterogeneity problem by relying on revealed preference (which the *Depressive Eating* card problematizes).

      **Debrief Guide:**
      Map the deadlock to Mill's qualitative hedonism vs. Bentham's quantitative view. If no common feature exists, is "pleasure" just a name we give to things we like (deflationary)? Or is welfare not solely constituted by feeling states? Conclude by asking: If we can't define pleasure, can we measure welfare?

