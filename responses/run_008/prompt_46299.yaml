answer: |-
  **Activity: The Pleasure Trap**

  **Materials**
  Print 12 cards (2 sets). Each describes a first-person episode:
  1.  *Runner's High:* Euphoric, physical, intense. (Sensory/Intense)
  2.  *Spicy Burn:* Painful yet sought-after sensory intensity. (Sensory/Paradoxical)
  3.  *Thirst Quenched:* Subtle sensory relief, barely noticed. (Sensory/Subtle)
  4.  *Proof Solved:* Frustrating process, satisfaction only at end. (Attitudinal/Delayed)
  5.  *Sad Music:* Melancholy absorption; painful feeling but valued. (Aesthetic/Negative Qualia)
  6.  *Schadenfreude:* Pleasant feeling, morally repugnant object. (Moral/Positive Qualia)
  7.  *Depressive Eating:* Mechanical consumption; desired but devoid of joy. (Desire/No Pleasure)
  8.  *Duty Done:* Relief after burden; absence of pain, no buzz. (Attitudinal/Negative)
  9.  *Flow State:* Lost track of time; no conscious pleasure during. (Absorption/Unfelt)
  10. *Warm Bath:* Passive sensory comfort, low intensity. (Sensory/Subtle)
  11. *Surprise Party:* Overwhelming social joy, fleeting. (Social/Intense)
  12. *Parental Pride:* Quiet, attitudinal, enduring. (Attitudinal/Subtle)

  **Rules (45 mins)**
  Divide class into two teams (Proposers vs. Skeptics).
  1.  **Definition Phase (10 mins):** Proposers examine all cards. They must formulate a necessary and sufficient condition for "Pleasure" that includes all cards they deem "Genuine Pleasures" (they may discard up to 2 cards as "Non-Pleasures").
  2.  **Counterexample Round (35 mins):** Proposers state their feature (e.g., "positive felt tone"). Skeptics score points by playing a card or inventing an episode that either:
      *   Has the feature but isn't pleasure (False Positive).
      *   Is pleasure but lacks the feature (False Negative).
      *   *Constraint:* Proposers may shift definitions three times, but must address previous counterexamples.

  **Engineered Escape Routes**
  The deck forces three pivots, each designed to fail:
  1.  **Circularity ("It feels good"):** Skeptics play *Sad Music* or *Proof Solved*. The feeling isn't straightforwardly "good" in the moment, yet students classify them as welfare-contributing.
  2.  **Family Resemblance ("They are similar"):** Skeptics ask what links *Spicy Burn* and *Warm Bath*. If the answer is vague, hedonism lacks explanatory power.
  3.  **Desire-Satisfaction ("It's what you want"):** Skeptics play *Depressive Eating* (wanted, no pleasure) or *Schadenfreude* (pleasure, often unwanted).

  **Timeline**
  *   0-10: Intro & Card Sort.
  *   10-20: Definition Phase.
  *   20-55: Counterexample Round.
  *   55-70: Debrief.
  *   70-75: Wrap-up.

  **Predictable Failure**
  First run: Proposers will define pleasure as "what contributes to well-being." This begs the question. Interrupt immediately and demand a phenomenological description.

  **Limitations**
  This activity simulates *conceptual* heterogeneity, not *phenomenological* heterogeneity. Students debate descriptions, not qualia. Hedonists argue the *feeling* is uniform even if objects differ; the activity makes that claim hard to sustain but doesn't disprove it empirically. You must supply the philosophical bridge: does the failure to find a common thread prove hedonism false, or merely that pleasure is non-reductive (like "yellow")?

  **Debrief Guide**
  Map the deadlock to Mill's qualitative hedonism vs. Bentham's quantitative view. If no common feature exists, is "pleasure" just a name we give to things we like (deflationary)? Connect to welfare economics: If economists measure utility via choice, but choices diverge from felt experience (as in *Flow State* or *Depressive Eating*), what are they actually measuring? Conclude by asking whether the heterogeneity problem destroys hedonism or simply complicates measurement.
