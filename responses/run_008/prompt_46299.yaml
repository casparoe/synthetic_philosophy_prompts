      Connect the "Definition Phase" failure to the Euthyphro dilemma: Is it good because we desire it, or do we desire it because it's good? When students pivot to Desire-Satisfaction to save the definition, highlight *Depressive Eating*. This mirrors the critique that preference satisfaction ignores adaptive preferences or depression. When they pivot to "Quality" (Mill), highlight *Spicy Burn* vs. *Warm Bath*. Is the burn "higher"? Finally, address the economic implication: If welfare economists measure utility via choice, but choices diverge from felt experience (as in *Flow State*), what are they actually measuring?

