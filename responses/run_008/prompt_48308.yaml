answer: |-
  **Joint Statement on the Metaphysics and Epistemology of Objective Chance**

  **1. Shared Commitments**

  We, the undersigned, acknowledge that while our metaphysical accounts of chance diverge, our project shares a common functional core. Any adequate theory of objective chance must satisfy the following constraints:

  1.  **The Evidential Constraint:** Objective chance must guide rational belief. We both endorse the Principal Principle (PP) in some form: upon learning that the objective chance of an event $E$ is $p$, a rational agent's credence in $E$ should be $p$, provided their other information is admissible. Chance is the normative bridge between ontology and epistemology.
  2.  **The Objectivity Constraint:** Chances are not merely measures of ignorance. They are features of the world independent of any agent's knowledge state. Two agents with identical evidence should converge on the same chance ascriptions, provided the world is fixed.
  3.  **The Explanatory Constraint:** A theory of chance must account for the stability of relative frequencies in repeated trials. While we disagree on the direction of explanation, we agree that chance hypotheses must render observed regularities unsurprising.
  4.  **The Determinism Constraint:** We agree that fundamental deterministic laws are incompatible with non-trivial objective chances. If the complete history of the world is fixed by prior states and deterministic laws, any remaining 'chance' must be either epistemic or derived from higher-level special sciences, not fundamental physics.
  5.  **The Admissibility Constraint:** Information is admissible only if it does not bypass the chance process. Knowledge of the actual outcome of a chancy event is inadmissible when fixing credence via the PP. We agree that the definition of admissibility requires refinement but accept it as a necessary boundary condition.

  We sign this section affirming that any theory failing these constraints is deficient. Our dispute concerns not *whether* chance plays these roles, but *in virtue of what* it does so.

  **2. The Disagreement, Stated Twice**

  | Issue | Humean Characterisation (Best System) | Propensitist Characterisation (Dispositions) |
  | :--- | :--- | :--- |
  | **Ontology of Chance** | Chances are summaries of the total history of events. They are the probabilistic parameters of the system that best balances simplicity and strength in describing the Humean mosaic. | Chances are single-case causal dispositions inherent in experimental set-ups. They exist prior to and independently of the outcomes they produce. |
  | **Status of the PP** | The PP is a derived norm. We follow it because the Best System predicts frequencies that match our credences. Lewis's revised principle is necessary to avoid inconsistency. | The PP is foundational. We follow it because chances are truth-makers for probabilistic claims. The link is conceptual, not merely pragmatic. |
  | **Undermining Problem** | A future frequency pattern could undermine current chance ascriptions. We accept this and modify the PP to conditionalise on the resilience of the Best System, not chance itself. | This is a reductio. If frequencies determine chances, chance cannot guide credence about those frequencies. Our view avoids this by separating chance from actual frequency. |
  | **Humphreys' Paradox** | We face no inverse probability issue. Conditional chances are simply ratios within the Best System's summary of the mosaic. Symmetry is a feature of the calculus, not the metaphysics. | We must explain why propensities obey probability calculus despite being causal. If propensities are asymmetric causes, their obeying symmetric math is mysterious. |
  | **Falsification** | Our view fails if the Best System yields chances that systematically mislead rational agents despite admissible information. | Our view fails if single-case propensities are shown to be epiphenomenal, adding no explanatory power over frequency data alone. |

  **3. Cruxes and Registered Predictions**

  To move beyond dialectical stalemate, we identify three cruxes where our views generate divergent expectations. We register predictions regarding these cases, acknowledging that contrary outcomes would damage our respective positions.

  **Crux 1: The Lonely Atom**
  *Case:* Consider a possible world containing exactly one radioactive atom and nothing else, which decays after 10 minutes. There is no long-run frequency.
  *Humean Prediction:* In this world, there is no objective chance of decay at any prior moment, or the chance is trivial (0 or 1), because there is no mosaic large enough to sustain a probabilistic Best System. If we find intuition strongly favours assigning a non-trivial chance here, the Humean account is too restrictive.
  *Propensitist Prediction:* The atom possesses a single-case disposition to decay regardless of the surrounding emptiness. The chance is robustly non-trivial. If it turns out that rational agents cannot justify any credence other than ignorance distributions in this case, the propensity account posits occult qualities.

  **Crux 2: The Deviant Infinite**
  *Case:* Consider a world where a coin has a purported chance of 0.5 for heads, yet in an infinite sequence of trials, the relative frequency converges to 0.9.
  *Humean Prediction:* In this world, the objective chance was never 0.5. The Best System must reflect the actual frequency pattern to maximise strength. If intuitions suggest the chance *was* 0.5 and the outcome was merely 'unlucky', the Humean reduction is false.
  *Propensitist Prediction:* The chance remained 0.5; the frequency divergence is improbable but metaphysically possible. The propensity exists independently of its manifestation. If it is demonstrated that such a world is metaphysically impossible (i.e., chance *entails* frequency convergence), the propensity view collapses into frequentism.

  **Crux 3: Explanatory Direction**
  *Case:* A standard quantum experiment where frequencies stabilise rapidly.
  *Humean Prediction:* The explanation runs from frequency to chance. We posit the chance *because* it systematises the frequency. If we discover that chance ascriptions successfully predict frequencies in contexts where no prior data exists (and without relying on symmetry arguments), the Humean view lacks resources.
  *Propensitist Prediction:* The explanation runs from chance to frequency. The disposition explains the regularity. If it is shown that positing the disposition adds no predictive power over simply projecting the frequency, the propensity is epiphenomenal. We predict that single-case confidence intervals in unique trials will remain rational only on our view.

  **Crux 4: The Undermining Future**
  *Case:* A world where the current Best System assigns chance $p$, but knowledge of the system itself implies a future frequency pattern that would make a different system 'better'.
  *Humean Prediction:* Rational credence must shift to accommodate the 'undermining' future. We predict that agents who ignore the undermining effect are irrational. If agents who ignore it are vindicated, the Revised Principal Principle is ad hoc.
  *Propensitist Prediction:* This scenario is incoherent on our view. Chances do not shift based on future frequencies. We predict that no coherent case can be constructed where rational credence must track a future frequency that contradicts the current disposition. If such a case is constructed, the propensity view cannot accommodate it.

  **4. Verbal or Substantive**

  We conclude that the residual dispute is substantive, not merely verbal. While we agree on the functional role of chance (Section 1), we disagree on the truth conditions of chance statements. The Humean asserts that a claim 'the chance is $p$' is true iff $p$ figures in the Best System of the actual history. The Propensitist asserts it is true iff the set-up possesses a disposition of strength $p$. These are incompatible metaphysical claims.

  However, we acknowledge a verbal element regarding the term 'chance' in special sciences. The Humean may comfortably call higher-level statistical regularities 'chances' even in a deterministic base, whereas the Propensitist may reserve 'objective chance' for fundamental indeterminism. This is a terminological boundary dispute. Nevertheless, regarding fundamental physics, the disagreement is real: one side sees chance as a summary of events, the other as a generator of events. No amount of semantic clarification will dissolve the ontological divide regarding whether the world contains irreducible dispositions. We commit to testing the predictions in Section 3 to determine which metaphysics better serves our shared epistemic goals.

  **Signed,**

  *The Humean Representative*  
  *The Propensitist Representative*
