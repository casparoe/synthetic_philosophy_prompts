      *   *Check:* Did I explain PBR correctly? It's tricky. PBR assumes "Preparation Independence." In SE terms: If I spin up two independent instances, their underlying states are independent. PBR shows epistemic models violate this.
      *   *Check:* User asked about "stale reads." Use that. Epistemic view implies the wavefunction might be "stale" or "lossy" regarding the true state.
      *   *Check:* Interference. If $\psi$ is a cache, interference is a computation on the cache, not the DB. But the *result* affects the DB (measurement). This is the friction point.

  10. **Final Polish:** Structure clearly with headings. Ensure the "Residue Report" is distinct. Make sure the PBR explanation addresses the user's specific hypothesis ("inconsistent caches").

  *(Self-Correction on PBR)*: The user asked if PBR translates to "two agents' caches can't be inconsistent." That's not quite it. It's that *one* agent's different knowledge states can't map to the *same* physical reality. I need to be careful there. It's about the mapping from Knowledge -> Reality being one-to-one, not many-to-one.

  *(Self-Correction on Interference)*: Can a cache do interference? A cache can store complex numbers. But does the *physical system* interfere, or does our *knowledge* interfere? In Epistemic view, interference is a property of the probability distribution (the cache), not the particle (the row). In Ontic view, the particle *is* the wave, so it interferes. This is a key distinction.

