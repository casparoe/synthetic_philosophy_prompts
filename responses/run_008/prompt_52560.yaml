prompt: |-
  I'm a software engineer, no philosophy background and only hazy undergrad physics. My whole mental model of physics is basically: the universe has some underlying state, and our theories are data structures that track that state with varying fidelity. From that angle the wavefunction looks like it could be one of two very different things: either it's literally part of the world's state (a row in the actual database), or it's more like a cache — a compressed representation of what some observer knows about a state they can't see directly, like a read replica that only ever gives you part of the picture. I gather physicists and philosophers actually fight about exactly this, the psi-ontic vs psi-epistemic thing. Restate that whole debate in my vocabulary — state, caches, partial observability, stale reads, whatever actually fits — as faithfully as you can, one side at a time, without smuggling in assumptions from either side and calling it translation. Then give me the residue report: which parts of the fight map cleanly onto stuff I already understand (e.g. "the cache is not the database" vs "the data structure IS the state"), which parts only translate if you distort them, and which parts have no counterpart in my vocabulary at all. Two things I especially want addressed: whether interference and entanglement are just things a clever cache can do, or whether they're exactly where my analogy breaks; and whether that Pusey-Barrett-Rudolph theorem I've heard about — the one people say kills the cache view — translates to something like "two agents' caches can't be inconsistent about the same underlying row", or whether that's me fudging. And tell me straight whether the residue means my vocabulary is missing something, or whether the physicists are arguing about less than it looks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer. No philosophy background. Hazy undergrad physics.
      *   **Mental Model:** Universe = underlying state (database). Theories = data structures tracking state with varying fidelity.
      *   **Core Question:** Is the wavefunction ($\psi$) ontic (part of the world's state, a row in the DB) or epistemic (a cache, compressed representation of observer knowledge)?
      *   **Task:**
          1.  Restate the $\psi$-ontic vs. $\psi$-epistemic debate in software engineering vocabulary (state, caches, partial observability, etc.) faithfully, one side at a time.
