answer: |-
  This is a high-stakes room for a third-year. Your position is nuanced (eliminativist about ontology, pragmatist about semantics), which makes you vulnerable to attacks from both sides (those who want absences to be real and those who want them gone entirely).

  Here is your Q&A battle plan, ordered by the potential damage to your project.

  ### 1. The Legal Scholar (The "Liability" Objection)
  **Damage Level:** Critical. If your view can't distinguish the negligent nurse from the bystander without making causation itself normative, you fail the "special sciences" brief.

  **The Question:**
  "In tort law, we need to distinguish the nurse who failed to check the drip from the passerby who failed to check the drip. The physics is identical in both cases: the same positive chain occurred. You say the norm selects the relevant description. But if the *truth* of the causal claim depends on the norm, haven't you just made causation normative? If causation is normative, how do you ground liability without circularity? You're telling me the cause is the physics, but the *relevant* cause is the norm. That sounds like you're smuggling the duty of care into the causation element, which collapses the breach/causation distinction my field relies on."

  **The Reply (2 mins):**
  "That's the crucial distinction, and I want to be careful not to collapse them. I'm not arguing that causation *itself* is normative. The physical causal chain—the fluid dynamics, the physiological collapse—is entirely descriptive and norm-free. That's the ontology.
  Where the norm enters is not in *making* the cause, but in *licensing the attribution* of responsibility to an agent. My view separates the metaphysical question ('What pushed the world into this state?') from the explanatory question ('Who is answerable for that push?').
  In your court case, the 'cause of action' requires both. My analysis says: Step 1, identify the positive physical chain (the drip kept flowing). Step 2, apply the normative filter (the nurse had a duty to interrupt that chain). The passerby fails Step 2.
  I'm not putting the norm into the physics; I'm saying omission claims are *hybrid* claims. They report a physical chain *and* assert a normative violation. This actually helps your field: it prevents courts from searching for a 'negative event' in the world to pin liability on. The liability attaches to the agent's relation to the positive chain, not to a metaphysical ghost called 'an absence.'"

  **Soft Spot:** *Honestly, this is tightrope walking.* If she presses on whether the "selection" of the cause makes the cause counterfactually dependent on the norm, you might have to concede that *causal explanation* is normative, even if *causation* isn't. Don't fight that distinction too hard if she corners you.

  ### 2. The Experimental Philosophers (The "Occam's Razor" Objection)
  **Damage Level:** High. They constitute half the room. If they think your metaphysics is gratuitous, the paper loses its motivation.

  **The Question:**
  "We've run the studies. We know people's judgments track norms. We know they treat omissions as causes when a norm is violated. Your semantic analysis matches our data perfectly. So, what work is the metaphysics doing? Why posit this 'compressed claim' structure and 'positive chains' underneath? Why not just say: 'Causation is a cognitive construct that tracks norms,' and leave it there? You're adding a layer of 'real causation' that nobody accesses and that does no explanatory work for the judgments we study."

  **The Reply (2 mins):**
  "I appreciate the data, and my view is designed to respect it, not override it. But there's a difference between explaining why people *judge* X and explaining what makes X *true*.
  Your studies show that norms drive *attribution*. My project asks: 'When that attribution is correct, what in the world makes it correct?'
  If we stop at 'it's a cognitive construct,' we lose the ability to say the folk are sometimes *wrong*. Sometimes people blame a nurse for an outcome that the positive chain shows was inevitable regardless of the check. My view preserves the possibility of error. It says: 'You judged this an omission-cause because the norm was triggered, but you were mistaken because the positive chain wasn't a difference-maker.'
  If causation is just the judgment, we lose that critical leverage. I need the 'positive chain' metaphysics to preserve the fact that the world pushes back against our normative expectations. The metaphysics anchors the truth conditions so the norms don't float free."

  **Soft Spot:** *This assumes there is a mind-independent "positive chain" that can be identified prior to the normative selection.* If they argue that identifying the "relevant" positive chain *also* requires norms (the "causal selection problem"), you're in trouble.

  ### 3. The Process Theorists (The "Purity" Objection)
  **Damage Level:** Medium. They agree with your negative thesis but hate your positive one.

  **The Question:**
  "I agree with you that absences are nothing. But you're still obsessed with them. You're spending your whole paper analyzing 'omission talk.' If absences are ontologically bankrupt, why not just be an eliminativist about the language? Say people are speaking loosely and move on. By giving them a truth-conditional analysis ('compressed claims'), you're legitimizing a category mistake. You're teaching the folk how to reify absences by giving them a sophisticated paraphrase. Why not just say 'Nothing caused it, the patient died due to physiological processes'?"

  **The Reply (2 mins):**
  "Because I'm presenting at a workshop on the *special sciences*, not fundamental physics. In biology, medicine, and law, we cannot eliminate omission talk. It's not going away.
  If I tell the doctor, 'Stop saying the failure to treat caused the death,' she can't do her job. She needs to know which positive chain to interrupt next time.
  My view isn't legitimizing absences; it's translating them. I'm giving the special sciences a way to use their indispensable language without buying into bad metaphysics. It's a hermeneutic project, not just an ontological one. I want to save the discourse of the special sciences by showing how it hooks onto the physical world without requiring 'negative entities.' If I just say 'eliminate the talk,' I render the special sciences unintelligible. I'm trying to make them metaphysically safe to use."

  **Soft Spot:** *They might think you're being too conciliatory to "folk" intuitions.* Stand firm on the "Special Sciences" brief. That is your shield here.

  ### 4. The "Hope Nobody Asks" Question (The Metaphysical Collapse)
  **Damage Level:** Fatal. This exposes the tension in your "Norms do no causal work" claim.

  **The Question:**
  "You say the norm selects the relevant positive chain from a contrast class. But if the truth of the causal claim 'The nurse's failure caused the collapse' depends on the norm fixing the contrast, doesn't the norm determine the *truth conditions* of the causal statement? If the truth conditions depend on the norm, in what sense is the causation 'positive' and 'norm-free'? You seem to be saying the cause is physical, but *which* cause is a cause is determined by the norm. Isn't that just a version of contrastive causation where the contrast is normative? And if so, haven't you just made causation relational to norms after all?"

  **Why you hope they don't ask:**
  Because answering this requires you to draw a very fine line between "causation is normative" (which you deny) and "causal *ascriptions* are normative" (which you affirm). If you slip, you lose the Process Theorists (who hate normative causation) and the Legal Scholar (who needs the distinction to hold).

  **The Reply (if forced):**
  "I distinguish the *relation* from the *relata selection*. The causal relation itself—the energy transfer, the dependency—is norm-free. The norm doesn't change the physics. It changes which *description* of the physics counts as the cause *for us*.
  Think of it like pointing. The finger doesn't create the object, but it selects it. The norm is the finger. The causation is the object. I'm arguing that omission claims are claims about where the finger is pointing, not claims that the finger created the object. So causation remains physical; our *access* to it via omission claims is normative."

  ### Pre-emptive Concessions (Say these in the talk)
  To avoid looking like you are retreating during Q&A, concede the following in your closing remarks:

  1.  **Concede the "Causal Selection" Problem:** Explicitly state: *"I am not offering a norm-free algorithm for identifying the 'positive chain.' Identifying the relevant physical processes likely requires pragmatic interests. My claim is only that once identified, those processes are non-normative."* (This disarms the X-Phi and Process theorists who know the selection problem is hard).
  2.  **Concede Practical Indispensability:** Say: *"I am not arguing we should stop using omission language in law or medicine. I am arguing we should understand what we are doing when we use it."* (This takes the sting out of the Legal Scholar's worry that you are undermining liability).

  **Final Advice:**
  The Legal Scholar is your biggest threat. If she feels heard on the liability point, the room will relax. If she feels you are "dissolving" her cases, she will turn the room against you. Treat her objection as the most important one, even if the X-Phi folks speak first. Good luck.
