prompt: |-
  i've been teaching myself some game theory from library books and one thing keeps bugging me. i get iterated deletion of strictly dominated strategies, and i get that with pure strategies the order you delete them in doesn't change what's left at the end (at least i think that's right?). but then i came across the claim that you're also allowed to delete a strategy when it's dominated by a *mixture* of other strategies, even when no single strategy dominates it, and that this lets you delete stuff the pure version never would.

  that second part is what messes with my head. how can a strategy be "beaten" by a mix of two other strategies when it holds its own against each of them one-on-one? it feels almost like the mixture is borrowing safety from both of them at once, which seems fishy if i'd only ever actually play one of them. is there a good gut-level way to see why mixing counts as a genuine reason to delete?

  also i'm not sure how the bookkeeping works once you do this. after you delete something, the mixtures you could form from what's left change, so the later rounds are operating on different material than the earlier ones. does the "order doesn't matter" thing still survive that, or does allowing mixtures as the dominators break it?

  please explain like i'm not a mathematician, i don't need proofs just the intuition. and please say how confident you are in each part of what you tell me, and flag whichever point you're least sure about so i know what to double check elsewhere.
