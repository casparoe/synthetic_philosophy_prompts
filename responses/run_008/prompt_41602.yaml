      *   **Second Question:** Does the argument imply consciousness is beyond neuroscience/a complete science of the brain is impossible *in principle*?
      *   **Goal:** Clarify philosophical nuances without trashing the book, while correcting misconceptions. Maintain an academic but accessible tone suitable for an intro student.

  2.  **Deconstruct the Book's Summary (Claim-by-Claim Analysis):**

      *   *Claim 1: "Frank Jackson asked us to imagine Mary... knows every last physical fact... black-and-white room... sees a red tomato."*
          *   **Verdict:** Accurate. This is the standard setup of the thought experiment (Jackson 1982, "Epiphenomenal Qualia").
      *   *Claim 2: "Clearly she learns something new: what red looks like."*
