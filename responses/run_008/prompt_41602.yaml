      *   *Claim 3: "So there must be facts that are not physical facts, and physicalism is false."*
          *   **Verdict:** Accurate (as the original conclusion). This is Jackson's 1982 conclusion.
      *   *Claim 4: "In his original paper Jackson went further and argued that since qualia are nonphysical, they must be epiphenomenal — they don't cause anything, which is the price of accepting the argument."*
          *   **Verdict:** Accurate but needs nuance. Jackson *did* argue for epiphenomenalism in 1982. It wasn't just a "price," it was a derived consequence of his dualist conclusion combined with the causal closure of the physical.
      *   *Claim 5: "The ability hypothesis — that Mary only gains new abilities like recognizing and imagining red, not knowledge of a new fact — was later accepted by Jackson himself..."*
          *   **Verdict:** **Misrepresentation/Confusion.** This is the critical error. The Ability Hypothesis is usually associated with *Lewis* and *Nemirow*. Jackson *rejected* the Ability Hypothesis initially. Later, Jackson *did* change his mind, but *not* to the Ability Hypothesis. He moved to *Representationalism* (or a version of physicalism where the "new knowledge" is compatible with physicalism).
      *   *Claim 6: "...which is why he abandoned the argument and returned to physicalism."*
