prompt: |-
  I'm teaching a little seminar on the surprise exam paradox and want to close with Groundhog Day, which I think is basically the mirror image of the paradox. Read the film through it. Phil Connors ends up knowing exactly what will happen each day -- the puddle, Ned on the street corner, the old man choking at the diner -- so the day's content can never be a surprise to him. But the one thing that matters, whether today is the last repetition, is never announced, and he never gets any signal about it. So instead of the classic setup -- an event that's announced but provably can't be a surprise -- you get events that are fully predictable plus one thing that's unannounced. Which parts of the backwards induction reasoning (student rules out Friday, then Thursday, and so on up to "the exam can't happen at all") actually map onto Phil's epistemic situation, and which parts of the paradox just have no analogue there? I'm also curious about the split with Rita: the same day is a constant surprise to her and no surprise at all to him, so is the film accidentally showing that the paradox is really about common knowledge, not knowledge? And does it dramatize anything the formal literature misses -- like what it does to a person to live inside iterated foreknowledge, and whether that's evidence that the "surprise" the paradox cares about is not the same as novelty? I want to actually use this with students, so be honest about where the reading strains or falls apart -- I'd rather find out now than in front of a room.
