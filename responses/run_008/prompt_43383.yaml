      *   *Pleasantville:* A 1950s B&W TV world is invaded by modern siblings. "Color" spreads as characters experience emotion, art, sex, rebellion, etc.
      *   *The Core Tension:* In Jackson, the new knowledge is *phenomenal experience* (seeing red). In *Pleasantville*, "color" seems to track *emotional depth, authenticity, and agency* rather than just raw sensory qualia.

  3.  **Address the Specific Scenes & Mappings:**
      *   *Betty Parker's Bathtub:* She discovers masturbation/sexual pleasure. Color spreads. This aligns with *qualia* (what it's like), but specifically *hedonic/affective* qualia, not just visual. It supports Jackson's "new fact" idea but leans towards the *value* of that fact.
      *   *The First Fire:* The firemen don't know what to do. Color comes with the *capacity* to act differently. This strongly supports the Ability Hypothesis (Lewis/Nemirow). Knowing what fire *is* involves knowing how to react to it.
      *   *Bill Johnson's Crisis:* The soda shop owner reads *The Grapes of Wrath*. He cries. Color spreads. This is about *empathy* and *understanding narrative*. It's cognitive + affective. It suggests color = depth of engagement with the world.
