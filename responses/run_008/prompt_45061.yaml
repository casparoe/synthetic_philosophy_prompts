answer: |-
  This is a remarkably precise observation of a dynamic that scholars in Science and Technology Studies (STS), philosophy of technology, and legal theory have been grappling with for the last two decades. You are not reinventing the wheel, but the terminology is split between sociological description (how blame *actually* lands) and normative theory (how blame *should* land).

  Here are the established terms, their boundaries, and an assessment of your "conservation" hypothesis.

  ### 1. The First Half: Blame Settling on the Proximate Human

  **Established Term:** **The Moral Crumple Zone**

  **Origin:** Coined by Madeleine Clare Elish (2018) in *"Moral Crumple Zones: Cautionary Tales in Human-Robot Interaction."*

  **Definition:** A "Moral Crumple Zone" occurs when a human operator is retained in a system primarily to absorb legal and moral liability for the failures of an automated system, despite having little to no actual control over the system's operation. Like the crumple zone of a car, the human is designed to take the impact of the collision (the blame) to protect the rest of the structure (the manufacturer/algorithm).

  **Boundaries & Criteria:**
  *   **Formal Control vs. Actual Control:** The defining feature is a mismatch. The human has *formal* responsibility (they are the "driver" or "operator") but lacks *actual* control (the takeover time is too short, the interface is opaque, or the automation bias is too strong).
  *   **Impossibility is Irrelevant:** As you noted, the blame assignment holds even if the intervention was physically or cognitively impossible. The *role* is what matters, not the *capacity*.
  *   **Function:** It serves a social function. It satisfies the public and legal need for a moral agent to hold accountable, allowing the system to continue operating without resolving the underlying technical fault.

  **Alternative/Related Terms:**
  *   **Responsibility Sink:** Often used interchangeably, though "sink" implies a place where responsibility disappears, whereas "crumple zone" implies a place where it impacts and is absorbed.
  *   **Token Human:** Describes the role, but not the blame dynamic.

  **Application to your "Standing Instructions" Edge Case:**
  If a human supervisor *could* have intervened in principle but was acting against explicit standing instructions (e.g., "do not touch the wheel unless alarm X sounds"), this is still a **Moral Crumple Zone** if the instructions themselves made safe operation impossible. The blame lands on the human because they are the only legally cognizable agent in the loop, even if the organization set them up to fail. If the guidance distinguishes these, you might classify this as **Institutionalized Crumple Zoning**.

  ### 2. The Second Half: Harm with No Assignable Human Responsibility

  **Established Term:** **The Responsibility Gap**

  **Origin:** Most prominently articulated by Andreas Matthias (2004) in *"The Responsibility Gap: Ascribing Responsibility for the Actions of Learning Automata."*

  **Definition:** A situation where a harmful outcome occurs due to the operation of an autonomous system, but no human agent satisfies the traditional conditions for moral or legal responsibility (control, foreseeability, or intent).

  **Boundaries & Criteria:**
  *   **The Control Condition:** Traditional responsibility requires that the agent could have done otherwise. In complex algorithmic pipelines (deep learning, high-frequency trading), no single human controls the specific output.
  *   **The Foreseeability Condition:** This is the critical boundary you asked about.
      *   *Strict Philosophical Definition:* Matthias argues the gap exists even if the *risk* was known, provided the *specific action* was not determined by the programmer (due to machine learning).
      *   *Legal/Regulatory Definition:* In practice, the Gap is often considered "closed" if the failure mode was **foreseeable and documented**. If an engineering report documented the risk and no mitigation was taken, the Gap dissolves into **Corporate Negligence** or **Product Liability**.
      *   *The "Black Box" Exception:* The Gap persists when the system is opaque. Even if the *risk class* was known, if the *specific causal chain* cannot be reconstructed to pin negligence on a specific decision-maker, the Responsibility Gap remains in effect socially, even if strict liability applies financially.
  *   **Distinction from "Accident":** An accident implies no negligence. A Responsibility Gap implies harm that *would* be negligent if done by a human, but cannot be mapped to a human.

  **Alternative/Related Terms:**
  *   **Organized Irresponsibility:** (Ulrich Beck). Broader sociological term for systems where risks are produced institutionally but accountability is individualized (or vanished).
  *   **The Many Hands Problem:** (Dennis Thompson). Specific to organizations where diffusion of duty makes it impossible to pinpoint who is responsible.

  ### 3. The "Conservation of Responsibility" Hypothesis

  **Is it theorized?**
  There is no canonical metaphysical theory called "The Conservation of Responsibility." Moral philosophers generally reject the idea that responsibility is a fixed quantity; they view it as generative (created by action) or retrospective (assigned by judgment).

  **However,** your observation is a recognized **sociological and psychological phenomenon.**

  **Established Descriptors:**
  *   **The Economy of Blame:** Scholars in legal realism and STS describe blame as a currency that institutions seek to balance.
  *   **The Just-World Hypothesis:** (Psychology). The cognitive bias that leads people to believe harms must be caused by someone's misdeed. If the system can't be the "someone," a human must be found.
  *   **Retributive Imperative:** The social pressure to identify a culprit to restore normative order.

  **Recommendation for Guidance:**
  Do not present the "Conservation of Responsibility" as an established philosophical theory. It will not withstand scrutiny from legal theorists. Instead, frame it as an **Institutional Imperative for Attribution.**

  You can write: *"Regulatory processes exhibit a functional pressure to assign agency. Where technical autonomy outpaces legal categories of personhood, institutions tend to treat accountability as a closed loop: liability is either absorbed by a proximate human (Moral Crumple Zone) or dissolves due to lack of cognizable agency (Responsibility Gap)."*

  ### Summary for Your Guidance Document

  | Phenomenon | Established Term | Key Boundary Condition |
  | :--- | :--- | :--- |
  | **Pattern 1** (Human blamed despite lack of control) | **Moral Crumple Zone** | Applies even if intervention was impossible. Relies on *role*, not *causality*. |
  | **Pattern 2** (No human blamed for algorithmic harm) | **The Responsibility Gap** | Turns on **foreseeability** and **reconstructability**. If the specific failure path was documented/foreseeable, the Gap should legally close (negligence), though it may socially persist. |
  | **Underlying Dynamic** (Blame must land somewhere) | **Institutional Imperative for Attribution** | Not a metaphysical law, but a documented sociological behavior of legal/regulatory systems. |

  **Specific Advice on the "Standing Instructions" Edge Case:**
  If a human could have intervened but was forbidden by standing instructions:
  1.  **Legally:** This often shifts liability from the individual to the operator/manufacturer (Negligent Entrustment or Vicarious Liability).
  2.  **Socially/Procedurally:** It often remains a **Moral Crumple Zone** because the individual is still the easiest target for the initial report.
  3.  **Guidance Wording:** You should specify that the presence of a human operator does not constitute a valid control measure if system design or operational constraints (standing instructions) render intervention ineffective. This prevents the "Crumple Zone" from being used to shield the manufacturer.

  **Final Verdict:**
  You are describing real, named phenomena. Using **Moral Crumple Zone** and **Responsibility Gap** will give your guidance immediate resonance with ethicists and legal scholars. Avoid codifying the "Conservation" idea as theory; describe it instead as the *pressure* that drives the oscillation between the two states.
