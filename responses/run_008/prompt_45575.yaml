answer: |-
  **1. The Decomposition Trap**
  "I'm thinking about the decomposition step. It seems possible to break a hard question into sub-questions that are each safe to answer in isolation, but when you put the answers back together, you get something dangerous. Like, each piece looks harmless, but the synthesis isn't. How do you guarantee the recombination step doesn't introduce risks the sub-questions didn't have?"

  *   **If she says:** "The overseer model checks the plan and the synthesis before accepting it."
  *   **Ask:** "But if the overseer is the weak model we started with, how does it spot a dangerous synthesis if it couldn't solve the hard problem directly? Isn't that exactly the blind spot we're trying to cover?"

  **2. The Distillation Drift**
  "Distillation is basically lossy compression. Every time you train a new model to mimic the amplified system, you lose some fidelity. How do we know we're losing capability noise and not alignment signal? Or vice versa—that we're keeping capabilities but drifting on alignment?"

  *   **If she says:** "We verify alignment on held-out eval sets after every distillation step."
  *   **Ask:** "But eval sets are static. If the drift is subtle and only emerges at the next scale, how do we catch it before the next distillation step locks it in? Are we just assuming the loss is random rather than directional?"

  **3. The Bootstrap Problem**
  "The whole loop depends on trusting the output of the current model to train the next one. But that base model was trained via standard RLHF or similar, which is exactly the process we're trying to improve on because it doesn't scale safely. Why think this bootstrap starts on solid ground?"

  *   **If she says:** "We only amplify tasks where the base model is already reliable."
  *   **Ask:** "But how do you measure reliability on tasks where humans can't verify the answer? That's the whole point of superhuman alignment, right? If we can't verify it, how do we know the bootstrap isn't amplifying a hidden failure mode?"

  **4. Detecting Quiet Divergence**
  "Let's say the loop runs for ten iterations and things look fine. What evidence, even in principle, could tell us that the model's intent has quietly diverged from what we want? Is there a canary signal, or do we only find out when it deploys?"

  *   **If she says:** "We'd use interpretability tools to check the internal representations."
  *   **Ask:** "Those tools are still early days. If interpretability isn't ready, do we have to pause the whole scheme, or is there a behavioral test that doesn't rely on knowing how the model works internally?"
