  Based on her record, your friend operates under a **Modified Orthodox** framework prioritizing **agency over structure** and **coercive choice over grievance**. Her implicit rules are:

  1.  **The Aggressor Rule:** Blame the power that initiates coercive force or confrontation while diplomatic settlement is still viable (Falklands, Korea, WWII).
  2.  **The Decision-Maker Rule:** Blame specific leaders for conscious risk-taking, exonerating the populace and structural forces (WWI).
  3.  **The Grievance Discount:** Do not allow historical grievances to dilute blame for the choice of war (WWII/Versailles, Korea/South's regime).
  4.  **The Enabler Weighting:** In complex cascades, blame the power that enables escalation (Germany's blank check) slightly more than the power that sparks the crisis (Austria's ultimatum), but blame the defender only for reactive escalation (Russia's mobilization) (WWI).

  ### Prediction
  She will assign **chief responsibility to the Soviet Union (specifically Stalin)**, with **secondary responsibility to the United States (specifically Truman)**, and negligible responsibility to structural factors or peoples.

  She will argue that Stalin's consolidation of Eastern Europe (1945–46) constitutes the "ultimatum/invasion" equivalent—a coercive act taken while the Yalta settlement was still viable. She will assign secondary blame to Truman for the Truman Doctrine and containment policy, viewing them as the "mobilization" equivalent: reactive measures that globalized and institutionalized the conflict, making it decades-long rather than a brief standoff. However, because the Soviet coercion *preceded* the American response, the "Aggressor Rule" and "Decision-Maker Rule" converge on Moscow.

  ### Do the Rules Diverge?
  **No, they do not diverge in her likely verdict.** While a Revisionist might argue the US could have "most cheaply prevented" the conflict by accepting a Soviet sphere (the Preventer Rule), your friend's history shows she subordinates preventability to the **choice of coercion**. In the Falklands, she blamed Argentina despite the UK potentially having diplomatic options; in WWII, she blamed Germany despite Versailles. She prioritizes the *act* of confrontation over the *opportunity* for accommodation.

  ### What Flattens the Rules?
  The factor that flattens the rules is the **chronological asymmetry of coercive initiatives**.

  In World War I, her blame was split because the escalatory steps were entangled (Austria's ultimatum, Germany's blank check, Russia's mobilization happened in rapid, overlapping succession). In the Cold War, the sequence is clearer: Soviet imposition of satellite states in Eastern Europe (1945–46) demonstrably preceded the Truman Doctrine (1947). This temporal gap aligns the "Challenger," "First Mover," and "Decision-Maker" rules all on the USSR. The US actions appear reactive (like Russia in WWI) rather than initiatory (like Germany/Austria), preventing the rules from pulling in opposite directions. She will likely view the Cold War not as a security dilemma where both are equally trapped, but as a cascade where Stalin handed the "blank check" to communist expansionism, knowing confrontation might follow, and Truman mobilized the West in response.
