  (ii) The surviving principle is **Individual Monotonicity**: If the feasible set expands such that one player's ideal payoff increases while the other's remains fixed, that player's solution payoff must not decrease.

  (iii) In your new case, Player 2's ceiling rises while Player 1's stays fixed. KS predicts Player 2's payoff **strictly increases**. The KS solution is the intersection of the Pareto frontier and the line connecting the disagreement point to the ideal point; as Player 2's ideal point moves out, this line steepens, shifting the intersection in Player 2's favor.
