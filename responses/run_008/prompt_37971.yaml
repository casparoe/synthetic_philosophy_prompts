answer: |-
  This is a rich vein of conflict. You are correct that the shouting matches in your council meetings feel like a mess because the participants are arguing from different ethical frameworks without realising it. One person is talking about *history*, another about *honour*, another about *aesthetics*, and another about *power*.

  To give your characters "joints" to their arguments—places where their logic locks or breaks—you need the structural specifications of commemoration. Below is the theory-side spec you asked for, drafted to help you construct the scene.

  ### 1. The Desiderata: What Must an Ethics of Commemoration Deliver?

  Any coherent theory of public memory needs to satisfy five basic requirements. If a position fails one of these, it is vulnerable.

  | Requirement | Definition | The Trap if Ignored |
  | :--- | :--- | :--- |
  | **1. Truthfulness** | The commemoration must not propagate known falsehoods about the subject or the past. | Becomes propaganda or myth-making. |
  | **2. Moral Coherence** | The values displayed must not contradict the community's current foundational moral commitments (e.g., equality, justice). | Becomes hypocritical or offensive. |
  | **3. Democratic Legitimacy** | The decision to commemorate (or retain) must reflect the will of the current community, not just the dead. | Becomes colonial or authoritarian imposition. |
  | **4. Functional Clarity** | The object must clearly signal its purpose (is it art? history? honour? warning?). | Becomes confusing or misleading. |
  | **5. Temporal Stability** | The decision cannot be so fragile that it requires re-litigation every election cycle. | Becomes chaotic; history becomes ephemeral. |

  **The Novelist's Note:** Your council members are likely prioritising different rows in this table. The History Society woman is obsessed with *Truthfulness*. The Removalists are obsessed with *Moral Coherence*. The Traditionalists are obsessed with *Temporal Stability*. The drama comes from the fact that you cannot maximise all five simultaneously.

  ### 2. The Hard Cases: Where the Theory Must Hold Weight

  A good theory cannot just handle the easy villains (slave traders, dictators). It must classify the ambiguous cases you mentioned without collapsing.

  *   **The Confederate / Colonial Statues:** These fail *Moral Coherence*. They were often erected not when the person died, but decades later to assert dominance (e.g., during the Civil Rights movement). They fail *Democratic Legitimacy* for the current population.
  *   **The Engineer's Bridge:** Technical achievement vs. moral blindness. If the bridge stands on its own merit, naming it after him is a *Functional* label, not necessarily a moral endorsement. However, if the name implies "Great Man", it fails *Moral Coherence* if his greatness relied on exploitation.
  *   **The Clerical Error Street:** This fails *Truthfulness* and *Democratic Legitimacy*. It is a mistake, not a choice. Keeping it is not "honouring" him; it is acknowledging administrative inertia. This is a "non-case" for ethics, but a case for pragmatism.
  *   **The Robber Baron's Hospital Wing:** This is the "Dirty Money" problem. The *outcome* (healthcare) is good; the *source* (exploitation) is bad. An adequate ethics must distinguish between *accepting a gift* and *honouring the giver*. You can keep the wing (utility) without the plaque (honour).

  ### 3. The Incompatible Goods: Where the Requirements Clash

  This is the engine room of your conflict. You suspected that some requirements pull against each other. You are right. There are two primary tensions that cannot be fully resolved, only managed.

  **Tension A: Honour vs. History**
  *   **The Conflict:** A statue is an honorific medium. It says, "Look up to this person." History is a descriptive medium. It says, "This person existed and did these things."
  *   **The Clash:** You cannot turn an honorific medium into a descriptive one simply by adding text. A bronze figure on a plinth *screams* "Hero" louder than a plaque *whispers* "Complex Figure."
  *   **The Drama:** The council cannot agree on what the object *is*. Is it a textbook in bronze? Or a shrine?

  **Tension B: Stability vs. Justice**
  *   **The Conflict:** *Temporal Stability* demands we leave things alone, or we live in constant cultural revolution (the "Soviet airbrushing" argument). *Moral Coherence* demands we remove symbols of injustice as soon as we recognise them.
  *   **The Clash:** If we update statues every generation to match current morals, we lose the ability to see the past *as it was*. If we never update them, we freeze the values of the people who had the money to build statues in 1890.
  *   **The Drama:** One character argues that removing the statue erases history; another argues that keeping it erases the suffering of the workers. Both are using "erasure" to mean different things.

  ### 4. The Knockout Requirement

  You asked for the single requirement that knocks out the most popular positions. This is the lever you can give to your sharpest character to dismantle the others.

  **The Requirement:** **"The Medium Must Match the Message."**
  *(Or, more technically: Commemorative forms carry inherent semantic weight that cannot be fully overridden by context.)*

  Here is how this requirement dismantles the three camps in your council chamber:

  | Position | The Argument | Why "Medium Matches Message" Knocks It Out |
  | :--- | :--- | :--- |
  | **The Plaque Lady** (History Society) | "We keep the statue but add a plaque explaining the exploitation. Context solves it." | **Fails.** A statue is an honorific form. A plaque is a descriptive form. You cannot use a description to neutralise an honour. The visual dominance of the bronze overrides the text. The plaque admits the sin; the statue continues to glorify the sinner. They are sending contradictory signals, and the visual signal wins. |
  | **The Removalist** (Moral Purity) | "It must come down. Any presence implies endorsement." | **Partially Fails.** This position assumes the *only* alternative to a public plinth is oblivion. It ignores that the "Medium" could change. Moving the statue to a museum changes the medium from "Civic Honour" to "Historical Artefact." Total removal violates *Truthfulness* (erasing the evidence that he existed). |
  | **The Contextualist** (The 'It's Complicated' Camp) | "Meaning changes over time. We can reinterpret it." | **Fails.** While meaning is fluid, the *grammar* of public space is not. A council maintaining a statue is an active speech act. It is not passive. To say "we are just letting it stay" is a lie. Maintaining it costs money and political capital. That maintenance *is* endorsement, regardless of the context. |

  **The Verdict for Your Novel:**
  The Plaque Lady is the most vulnerable. Philosophically, she is trying to perform a magic trick: turning lead (honour) into gold (history) by sticking a label on it. If you have a character who understands that **public space is performative**, they can dismantle her argument easily. A statue in a square is not a book entry; it is a claim on the community's values *now*.

  ### 5. Character Mapping: Giving Them the Best Version

  To avoid strawmen, give each character the strongest version of their ethical blind spot.

  *   **The Plaque Lady (Mrs Gable, History Society):**
      *   *Her Strength:* She values nuance and continuity. She knows that scrubbing the past makes us stupid.
      *   *Her Blind Spot:* She treats the statue as a neutral container for information. She doesn't understand that the *form* (bronze, elevated, heroic pose) carries a message that contradicts her plaque.
      *   *Her Line:* "If we take him down, we pretend he never was. The plaque tells the whole story."
      *   *The Counter:* "The plaque tells the truth, Mrs Gable, but the statue tells a lie. And the statue is twice the size."

  *   **The Removalist (Young Councillor / Activist):**
      *   *Her Strength:* She values moral coherence and the lived experience of the descendants of the workers. She understands that public space should feel welcoming to all.
      *   *Her Blind Spot:* She risks conflating "honouring" with "acknowledging." She leans towards the "airbrushing" argument she accuses the others of.
      *   *Her Line:* "His feet are on our necks. Every day that statue stands, the council says his money was worth more than their lives."
      *   *The Counter:* "If we remove every man who paid for the town with dirty money, the town disappears. Do we tear down the library too?"

  *   **The Traditionalist (Old Councillor / Local Business):**
      *   *Her Strength:* She values stability and democratic legitimacy (the original erection was legal/democratic *then*). She fears the slippery slope.
      *   *Her Blind Spot:* She assumes the past's values are binding on the present. She treats the statue as a contract that cannot be broken.
      *   *Her Line:* "Who are we to judge? He built the cottages your constituents live in. We are guests in his town."
      *   *The Counter:* "We aren't guests anymore. We own the town. And we don't accept his terms."

  ### 6. The "Jointly Unsatisfiable" Moment

  For the climax of the chapter, you need a moment where the logic breaks. The best place to put this is on the distinction between **Retaining** and **Honouring**.

  The council cannot agree on this because the object does both simultaneously, and they need it to do only one.
  *   If they keep it as *History*, they offend the *Moral* requirement (it still looks like honour).
  *   If they remove it for *Morals*, they offend the *Truth* requirement (it looks like erasure).

  The most sophisticated argument your novel can offer is this: **The statue is no longer a monument to the Mill Owner; it has become a monument to the Council's inability to decide.**

  Every year they argue and do nothing, the statue's meaning changes. It stops being about the Victorian man and starts being about the modern cowardice of the council. That is a new "joint" in the argument. It allows a character to say: *"It doesn't matter what he did anymore. The statue is no longer about him. It is about us. And what it says about us is that we are afraid to choose."*

  ### Summary for the Writer

  1.  **British English:** Ensure you use *honour*, *centre*, *programme*, *defence*, *labour* throughout the text.
  2.  **The Plaque Lady:** She is wrong, but not stupid. She is trying to solve a moral problem with an archival solution.
  3.  **The Core Conflict:** It is not Past vs. Present. It is **Honour vs. Record**. The town is trying to use a tool designed for Honour (a statue) to do the job of Record (history), and the tool is broken.
  4.  **The Unsatisfiable Truth:** You cannot have a stable public memory that is also morally perfect. Something must give. Either you offend the dead (remove the statue) or you offend the living (keep it). The tension is the story.

  If you anchor the shouting match in these structural failures, the arguments will feel like they have weight, rather than just noise. The readers will feel the frustration of the council because the problem *is* frustrating, not because the characters are incompetent.
