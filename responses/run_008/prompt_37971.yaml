      *   Kills "Context": Context doesn't change the fact that the council is paying to keep it standing.

      *Wait, let's look at the "Honour vs Record" distinction again.* This is the standard philosophical move (e.g. by Joseph Raz or Jeremy Waldron).
      *   If the requirement is: **"A public monument must not conflate historical presence with moral approval."**
