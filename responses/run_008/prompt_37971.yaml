          *   Are requirements jointly unsatisfiable (tensions/trade-offs)?
          *   Which single requirement knocks out the most popular positions (plaque, remove all, context)?
          *   **Constraint:** British English spelling (editor in London).
          *   **Constraint:** No reading lists/citations, just the structure of the problem.
          *   **Tone:** Analytical, structured, helpful for a writer (not dry academic prose, but rigorous).

  2.  **Deconstruct the Ethics of Commemoration:**
      *   *Core Function:* What is a statue *for*? Is it history? Is it honour? Is it identity?
      *   *The "Plaque Lady" Problem:* Does context solve the moral taint?
      *   *The "Soviet Airbrushing" Argument:* Does removal equal erasure?
      *   *The "Standards of the Day" Argument:* Can we judge the past by present morals?

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   Need a list of criteria that a good theory should satisfy.
      *   1. *Truth/Accuracy:* It shouldn't lie.
      *   2. *Moral Coherence:* It shouldn't celebrate evil (by current or universal standards).
      *   3. *Democratic Legitimacy:* Who decided this?
      *   4. *Continuity/Stability:* We can't change everything every year.
      *   5. *Function:* What does the object *do* in public space?

  4.  **Addressing the Edge Cases:**
      *   *The Engineer Bridge:* Technical merit vs. moral failing.
      *   *The Clerical Error Street:* Accidental commemoration.
      *   *The Robber Baron Hospital:* Dirty money, good outcome.
      *   *The Victorian Mill Owner:* The user's specific case.

  5.  **Identifying the Tensions (The "Jointly Unsatisfiable" bit):**
      *   This is crucial for the novelist. Conflict drives drama.
      *   Tension 1: *Honour vs. History.* A statue is rarely neutral history.
      *   Tension 2: *Stability vs. Justice.* If we update values, do we update statues? If we don't, do we freeze old values?
      *   Tension 3: *Intent vs. Reception.* What the erector meant vs. what the viewer feels.

  6.  **The "Knockout" Requirement:**
      *   The user asks for *one* requirement that destabilises the popular positions.
      *   *Candidate:* The distinction between *Honouring* and *Acknowledging*.
      *   *Why?*
          *   "Keep + Plaque" assumes a statue can be neutralised into history. (Fails if the form itself is honorific).
          *   "Remove All" assumes presence equals endorsement. (Fails if presence is just historical record).
          *   "Context Decides" assumes context can override form. (Fails if the form is too dominant).
      *   *Better Candidate:* **The Public Space Function.** Statues aren't books; they occupy shared space and command attention. They are *performative*.
      *   *Actually, the strongest philosophical lever is:* **The Distinction Between Retaining and Honouring.**
      *   Let's refine this. The "Plaque Lady" thinks adding context changes the *status* of the statue. The "Removalist" thinks the statue *is* the honour. The "Contextualist" thinks meaning is fluid.
      *   The requirement that breaks them: **A commemorative object must not command civic reverence for a subject that violates the community's foundational moral commitments.**
      *   Wait, that's too wordy. Let's look for the *functional* requirement.
      *   *The "Civic Endorsement" Test.* If the state maintains it, does the state endorse the values?
      *   Let's go with **The Distinction Between Historical Record and Civic Honour.** This is the classic philosophical split (e.g., Waldron, McGowan).
      *   *Why it knocks out positions:*
          *   Plaque Camp: Assumes a statue can be a record. *Counter:* Statues are inherently honorific by virtue of being statues.
          *   Removal Camp: Assumes record = honour. *Counter:* We can keep things as records without honouring them (museums).
          *   Context Camp: Assumes meaning is flexible. *Counter:* The medium (bronze on a plinth) fixes the meaning more than the text does.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the novelist's insight (the "joints" in the shouting).
      *   **Part 1: The Desiderata (The Job Description).** What must a theory do?
      *   **Part 2: The Hard Cases.** Applying the theory to the user's examples.
