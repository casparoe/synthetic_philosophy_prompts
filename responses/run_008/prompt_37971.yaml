      *   **Style Check:** British English (honour, centre, programme, etc.).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use American spelling? *Correction:* Ensure "honour", "labour", "centre", "defence".
      *   *Check:* Is it too academic? *Correction:* Keep it punchy. Use metaphors suitable for a writer.
      *   *Check:* Did I answer the "Plaque Lady" question? *Correction:* Explicitly address her in the "Knockout" section.
      *   *Check:* The "Jointly Unsatisfiable" part. Need to make sure this sounds like a genuine dilemma, not just a list. The tension between *Democratic Authority* (we decide now) and *Temporal Stability* (we can't change our mind every decade).

  9.  **Final Polish:**
      *   Ensure the distinction between " Honouring" and "Recording" is sharp.
      *   Make sure the "Knockout" is clearly identified.
      *   Verify the edge cases are addressed.

  *(Self-Correction on the "Knockout"):* I need to be careful. The prompt asks for *one* requirement that knocks out the most popular positions.
  *   Position A: Keep + Plaque.
  *   Position B: Remove Everything Tainted.
