  *(Refining the Nightmare Question)*: The real killer is budget/logistics. "Where is the money coming from?" is often how school boards kill things without debating ideology. But the *ideological* killer is "Teaching Confusion." Let's go with the Ideological/Epistemological killer because the user asked for debate prep, not budget prep. Actually, the *Teacher's* objection is the most intellectually difficult. Let's make the nightmare question about the "False Equivalency" risk.

  *(Final Plan)*:
