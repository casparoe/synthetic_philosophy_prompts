prompt: |-
  hey so i need help with my debate prep, kind of. i'm a junior and next week i'm presenting to our school board (public comment session, 3 min statement then they ask questions) a proposal for the US history unit: instead of fighting over whether the founding gets taught the "1776 way" or the "1619 way," we assign two actual textbooks with opposite framings of the same events -- revolutionary era, slavery, reconstruction -- and the whole unit is students comparing where the two books disagree, what each one leaves out, whose voices are in the sources list etc. partly got the idea from reading about how japan and korea fight over textbooks covering the same occupation, and how some teachers there use both countries' books side by side and it kind of works.

  the room will be rough: one board member who says "we teach facts not controversy" every single meeting, two parents who show up to everything and think anything critical of the founders is divisive, and my AP history teacher who will be there and honestly thinks BOTH "framings" are a scam -- she says there's just evidence and historiography, not teams. plus a student rep who mostly cares about whether it's more work.

  make me a prep sheet: the objections i'll actually get, roughly in the order they'll come, each phrased the way that person would actually say it (not textbook-objection language), ranked by which could actually kill the proposal, with a short reply to each and an honest note on where the reply is weak. also tell me what i should just concede upfront so i dont look like im dodging. and yeah include the question im secretly hoping nobody asks, with what to say if they ask it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior.
      *   **Task:** Presenting a proposal to the School Board (3-minute statement + Q&A).
      *   **Proposal:** Teach US History using *two* textbooks with opposing framings (1776 vs. 1619 style) side-by-side. Focus on comparison, sourcing, and historiography rather than picking one "truth."
      *   **Inspiration:** Japan/Korea textbook disputes (using conflict as pedagogy).
      *   **Audience/Stakeholders:**
          1.  Board Member A: "Facts not controversy" (Anti-controversy).
          2.  Parents (2): Anti-critical of founders (Conservative/Traditionalist).
          3.  AP History Teacher: Anti-binary framing (Pedagogical Purist).
          4.  Student Rep: Worried about workload (Pragmatic).
      *   **Deliverable:** A prep sheet with objections (phrased naturally), ranked by lethality, replies, weakness analysis, concessions, and the "nightmare question."

  2.  **Deconstruct the Proposal (Strengths & Weaknesses):**
      *   *Strength:* Promotes critical thinking, media literacy, avoids choosing one political side, aligns with AP/College Board skills (sourcing, corroboration).
      *   *Weakness:* Logistically heavy (two books?), might confuse younger students, could be seen as legitimizing "false equivalencies" (e.g., giving equal weight to racist historiography), cost, teacher buy-in.
      *   *Tone:* Needs to be respectful, student-led, pragmatic, not ideological.

  3.  **Drafting the Objections (Voice & Lethality):**
      *   *Board Member ("Facts not controversy"):* Needs to sound bureaucratic and worried about confusion. "Why are we confusing kids with two versions of truth?"
      *   *Parents ("Divisive"):* Needs to sound protective and patriotic. "Why are we bashing our founders?"
      *   *AP Teacher ("Historiography"):* Needs to sound academic and skeptical of binaries. "History isn't Team A vs. Team B."
      *   *Student Rep ("Workload"):* Needs to sound practical. "Is this double the reading?"
      *   *Ranking:* The Board Member has the vote (Most Lethal). The Parents have public pressure (High Lethal). The Teacher has professional credibility (Medium/High). The Student Rep is swappable (Low).

  4.  **Developing Replies & Weakness Analysis:**
      *   *Board Member:* Reply = Critical thinking *is* the fact. Weakness = Hard to measure on a standardized test.
      *   *Parents:* Reply = Honoring founders means studying them deeply, not blindly. Weakness = They might not care about nuance.
      *   *Teacher:* Reply = This *is* historiography in practice. Weakness = She's right that binaries are simplistic; need to acknowledge limits.
      *   *Student:* Reply = Same reading load, different focus. Weakness = Comparing texts is actually harder cognitively.

  5.  **Identifying Concessions:**
      *   Don't promise it's perfect.
      *   Admit it requires teacher training.
      *   Admit it's a pilot, not a mandate for everyone immediately.

  6.  **The "Nightmare Question":**
      *   What's the hardest thing to answer? Probably about *which* books. If you pick specific books, you get bogged down in content wars. If you don't, you seem vague.
      *   *Better Nightmare Question:* "If one book says X and the other says Y, and X is demonstrably false, are you teaching lies?"
      *   *Alternative:* "Who pays for the second set of books?" (Logistical kill shot).
      *   *Selection:* The "False Equivalency" trap. If one narrative is factually stronger, does comparing them legitimize the weaker one? This hits the Teacher's and Board's concerns.

  7.  **Refining the Tone:**
      *   Keep it punchy.
      *   Avoid jargon.
      *   Make the student sound mature but not robotic.
      *   Ensure the "Japan/Korea" reference is used strategically (maybe keep it in the back pocket, not the opener, as some might find comparing US founders to Japanese occupation sensitive). *Decision: Keep it out of the main script, use as backup analogy if needed.*

  8.  **Review against Constraints:**
      *   3-minute statement context (keep prep focused on Q&A).
      *   Specific stakeholder voices.
      *   Rank by lethality.
      *   Include "Weakness" notes.
      *   Include Concessions.
      *   Include Nightmare Question.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Teacher Objection:* The teacher thinks *both* framings are scams. So the objection shouldn't be "1619 is bad," it should be "This binary is bad pedagogy."
      *   *Self-Correction on Parents:* They won't say "1619 is Marxist." They'll say "It's un-American."
      *   *Self-Correction on Board:* They care about liability and complaints.

  10. **Final Polish:** Organize clearly with headers. Ensure the advice is actionable for a high schooler. (Proceed to generate output).

