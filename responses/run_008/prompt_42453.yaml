          *   Analysis: Four verdicts (Effort-based desert, Outcome/Contribution-based desert, Luck Egalitarian, Rawlsian/Difference Principle). Must show reasoning, not just assert.
          *   Feature Analysis: Identify the load-bearing feature, explain what happens if removed, state strongest objection from effort-based desert defender.
          *   Length: Under 700 words.
          *   Tone/Level: 11th-grade student (understands concepts, hasn't read primary texts deeply).
          *   Format: Scenario first, then four-verdict walkthrough, then analysis/objection.

  2.  **Drafting the Scenario:**
      *   *Goal:* Two people, same background, same job. One tries harder (due to innate temperament), one coasts. The harder worker earns less.
      *   *Challenge:* In a meritocracy, usually effort/talent leads to reward. How does the harder worker earn *less*?
      *   *Solution:* The market rewards *output* (talent), not *input* (effort). If Person A has low talent but high effort (driven by innate anxiety/conscientiousness), and Person B has high talent but low effort (driven by innate calm/confidence), Person B might produce more value with less struggle, thus earning more.
      *   *Characters:* Alex and Blake.
      *   *Setting:* Sales job (commission-based fits "outcome" better than salary).
      *   *Conditions:* Identical upbringing, training, no discrimination.
      *   *Twist:* Alex is innately anxious (tries harder), Blake is innately calm (coasts). Blake's natural charm (talent) sells more despite less effort. Alex sells less despite grinding.
      *   *Drafting text:* Alex and Blake join the same real estate firm after identical upbringing and training in a perfectly meritocratic city. Both are honest and follow every rule. Alex possesses an innate temperament of high anxiety, driving him to work 80-hour weeks making cold calls, while Blake possesses an innate temperament of natural calm and charisma, working only 40 hours and relying on walk-ins. Because the market rewards closed deals rather than hours logged, Blake's natural charm secures ten sales while Alex's strenuous effort secures only five. Consequently, Blake earns double Alex's commission despite exerting half the effort, and the difference in their work ethic stems solely from their unchosen genetic dispositions toward anxiety and ease.

  3.  **Drafting the Four Verdicts:**
      *   *Effort-based:* Alex deserves more. He tried harder. Effort is the only thing fully under control (though the prompt challenges this).
      *   *Outcome/Contribution-based:* Blake deserves more. He produced more value (sales).
      *   *Luck Egalitarian:* This is tricky. They want to compensate for brute luck. If effort is luck (temperament), then Blake's advantage is luck. But Alex's disadvantage (anxiety) is also luck. Usually, Luck Egalitarians distinguish between option luck and brute luck. If effort is determined by temperament (brute luck), then the inequality is unjust. They might favor redistribution.
      *   *Rawlsian (Difference Principle):* Inequality is only justified if it benefits the least advantaged. Does Blake earning more help Alex? If it incentivizes Blake to work, maybe. But if it's just talent rent, maybe not. Usually, Rawls allows inequality if it raises the floor.
      *   *Refining for 11th-grade level:* Keep it simple.
      *   *Effort:* Alex deserves more reward because he sacrificed more leisure.
      *   *Contribution:* Blake deserves more because he created more value for clients.
      *   *Luck Egalitarian:* The inequality is unjust because both their talent and their drive are luck; compensation is owed to Alex.
      *   *Rawlsian:* Inequality is permitted only if Blake's higher pay ultimately improves Alex's position (e.g., via tax or firm growth); otherwise, it should be reduced.

  4.  **Drafting the Analysis:**
      *   *Load-bearing feature:* The market rewarding *output* instead of *input*.
      *   *Removal:* If paid by hour, Alex earns more. The tension disappears.
      *   *Objection:* Effort defender says temperament isn't destiny; Alex could have chosen to be calmer or managed anxiety. Moral agency exists despite disposition.

