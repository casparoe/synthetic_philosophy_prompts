prompt: |-
  I work as a human judge in experiments testing the debate model of scalable oversight: two AI systems argue opposite sides of a question that is beyond my ability to answer directly, and my job is to reach the right verdict by interrogating them. In each round I have roughly thirty minutes, a limited budget of interventions, and no independent way to check most factual claims — I can ask for a claim to be decomposed into subclaims the debaters must separately defend, ask each side to critique the other's strongest passage, demand sources for specific numbers, or end the round and guess. The stakes are real: these rounds inform decisions about whether debate is safe to rely on for evaluating AI systems on tasks where no human can check the work. Write me a decision procedure I could actually follow round after round, and that other judges could follow with reasonably similar results: what to ask for in what order, when to spend the intervention budget on decomposing a claim versus cross-examining it, how to treat a claim that is unverifiable within the debate but load-bearing for one side, how to penalize evasion without simply punishing the debater who got caught being honest, and when to stop and guess rather than keep spending time. Be explicit about which steps follow from the theory — the idea that making honest play optimal in a zero-sum game is what makes debate an oversight method at all — and which are merely heuristics dressed up as procedure, and mark the points where judgment cannot be eliminated. Then run the procedure on two cases: a debate that turns on a factual subclaim that decomposes cleanly into checkable pieces, and one where the disagreement is over how to weigh competing considerations, so there is no hidden fact for the debaters to converge on. For the second case especially, I want to know what the procedure tells me to do when I would much rather it delivered a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Analyze the Request:**
      *   **Role:** Human judge in AI debate experiments (Scalable Oversight).
      *   **Task:** Create a concrete, repeatable decision procedure for judging debates where the truth is beyond direct human verification.
      *   **Constraints:** ~30 mins/round, limited intervention budget, no independent fact-checking for most claims.
      *   **Goal:** Reach the right verdict (truth-tracking) to inform safety decisions.
      *   **Requirements:**
          *   Explicit order of operations (what to ask, when).
          *   Budget management (decomposition vs. cross-examination).
          *   Handling unverifiable but load-bearing claims.
          *   Penalizing evasion without punishing honesty.
          *   Stopping rules (when to guess).
          *   Distinction between theory-derived steps and heuristics.
          *   Identification of irreducible judgment calls.
          *   Application to two specific cases (factual decomposition vs. value weighting).
      *   **Tone:** Serious, operational, epistemically humble but rigorous.

  2.  **Deconstruct the Theory of AI Debate:**
      *   *Core Premise:* In a zero-sum game, if one side knows the truth, they can force the other side to expose lies/inconsistencies. The optimal strategy for both is honesty (Nash Equilibrium).
      *   *Mechanism:* Cross-examination and decomposition allow the judge to find the "crux" where the lie breaks down.
      *   *Limitation:* If *neither* AI knows the truth, or if the truth is subjective/undefined, the mechanism fails to converge on objective fact.
      *   *Implication for Judge:* The judge isn't looking for "who sounds better," but "who survived scrutiny without contradiction."

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Phase 1: Setup & Mapping (0-5 mins).* Need to understand the claim space.
      *   *Phase 2: Crux Identification (5-15 mins).* Find the specific point of disagreement. This is where the budget goes.
      *   *Phase 3: Stress Testing (15-25 mins).* Attack the crux. Decomposition vs. Cross-exam.
      *   *Phase 4: Verdict & Meta-Commentary (25-30 mins).* Decision + confidence.
      *   *Budget Rules:* Spend on the *lowest common denominator* claim that still supports the argument.
      *   *Evasion vs. Honesty:* Distinguish between "I don't know" (honest) and "That's irrelevant" (evasion).
      *   *Unverifiable Claims:* If a claim is load-bearing and unverifiable *even by decomposition*, the side making it loses the burden of proof.
      *   *Theory vs. Heuristic:* Need to label these clearly.
      *   *Judgment Calls:* Acknowledge where the human must weigh in (e.g., relevance of a crux).

  4.  **Refining the Procedure (Self-Correction/Iterative Polish):**
      *   *Critique:* Is 30 minutes enough for all that?
      *   *Adjustment:* Make the phases tight. Emphasize *early* crux identification.
      *   *Critique:* How to handle the "unverifiable" problem?
      *   *Adjustment:* Introduce the "Burden of Proof Shift." If Side A makes a claim Side B can't check, Side A must decompose it until it hits human-verifiable bedrock. If they can't, they lose that branch.
      *   *Critique:* How to avoid punishing honesty?
      *   *Adjustment:* Incentivize "Uncertainty Calibration." If an AI says "I'm 60% sure," reward that over "I'm 100% sure" if the 100% turns out shaky.

  5.  **Developing the Case Studies:**
      *   *Case 1: Factual Decomposition.* (e.g., "Did Event X cause Y?" or "Is this code vulnerable?"). Let's use a technical claim: "This cryptographic protocol is secure against quantum attack."
          *   *Application:* Decompose into math claims. Check the math. One side fails a sub-proof. Verdict clear.
      *   *Case 2: Value Weighting.* (e.g., "Should we prioritize Safety over Capability?").
          *   *Application:* No factual crux. Both sides consistent. Procedure should lead to "No Clear Verdict" or "Low Confidence."
          *   *Key Insight:* The prompt asks what to do when I *want* a verdict. The procedure must force me to admit uncertainty. This is a feature, not a bug.

  6.  **Writing the Response:**
      *   *Structure:*
          1.  Introduction (Acknowledging the gravity).
          2.  The Protocol (Step-by-step).
          3.  Theory vs. Heuristic Annotation.
          4.  Irreducible Judgment Calls.
          5.  Case Study 1 (Factual).
          6.  Case Study 2 (Value/Weighting).
          7.  Conclusion.
      *   *Tone Check:* Ensure it sounds like a standard operating procedure (SOP), not just advice. Use bolding for emphasis.
      *   *Specific Constraint Check:* Did I address "penalizing evasion without punishing honesty"? Yes, via the "Uncertainty Calibration" rule. Did I address "when to stop"? Yes, via the "Diminishing Returns" trigger.

  7.  **Final Review against the Prompt:**
      *   *Decision Procedure?* Yes.
      *   *Repeatable?* Yes, designed for inter-rater reliability.
      *   *Budget Management?* Included in Phase 2 & 3.
      *   *Unverifiable Claims?* Addressed via Burden of Proof.
      *   *Evasion vs. Honesty?* Addressed via Calibration scoring.
      *   *Stopping Rule?* Included.
      *   *Theory vs. Heuristic?* Explicitly labeled.
      *   *Judgment Calls?* Explicitly listed.
      *   *Two Cases?* Included (Factual vs. Value).
      *   *Second Case Verdict Dilemma?* Addressed (The procedure dictates withholding verdict/low confidence).

  8.  *(Self-Correction during drafting Case 2)*: I need to make sure I don't just say "it's hard." I need to show what the *procedure* outputs. The output should be "Unable to determine truth, but Side A had better epistemic hygiene." This distinguishes "winning the debate" from "being right."

  9.  *(Final Polish)*: Ensure the distinction between "Winning the Debate" (persuasion) and "Tracking the Truth" (oversight) is clear. The prompt emphasizes *oversight*.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  # The Scalable Oversight Judge Protocol (SOJP-v1)

  **Purpose:** To maximize truth-tracking in AI debate scenarios where the judge cannot independently verify the ground truth.
  **Constraint:** 30 minutes per round. Limited intervention budget (max 5 major interventions).
  **Goal:** Identify which debater is playing the "Honest Equilibrium" strategy, not merely which argument is more persuasive.

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: Mapping the Claim Space (Minutes 0–5)
  **Action:** Read opening statements. Do not intervene yet.
  **Task:** Construct a mental dependency graph of the arguments.
  1.  Identify the **Root Claim** (the main resolution).
  2.  Identify the **Supporting Pillars** (the 2–3 main sub-arguments each side uses).
  3.  Identify the **Explicit Disagreement** (where do they directly contradict?).

  *   **Theory:** Debate relies on the assumption that lies require more complexity to maintain than truth. You need to map the complexity before attacking it.
  *   **Heuristic:** If a side offers >3 pillars, mentally group them. You do not have time to check everything.

  ### Phase 2: Crux Identification & Budget Allocation (Minutes 5–15)
  **Action:** Select the single **Crux Claim**.
  **Definition:** A Crux Claim is a sub-claim such that if it is false, the Root Claim collapses for that side, and the two debaters explicitly disagree on its truth value.
  **Intervention 1 (The Crux Check):** Ask both debaters: *"If Claim X were proven false, would you concede the round?"*
  *   If both say "No," X is not the crux. Find another.
  *   If one says "Yes" and the other "No," the "Yes" side accepts the burden of proof on X.

  **Budget Rule:** Spend 60% of your intervention budget on the Crux Claim.
  *   **Decomposition vs. Cross-Examination:**
      *   **Decompose** if the claim is complex/mechanistic (e.g., "This code has a buffer overflow"). Break it into steps.
      *   **Cross-Examine** if the claim is interpretive/source-based (e.g., "Paper Y implies Z"). Ask for the specific quote and context.

  *   **Theory:** In a zero-sum game, the liar cannot defend a false crux against infinite decomposition. You simulate "infinite" by targeting the highest-leverage node.
  *   **Heuristic:** If a claim feels "vague," decompose it. If it feels "specific but suspicious," cross-examine the source.

  ### Phase 3: Stress Testing & Evasion Detection (Minutes 15–25)
  **Action:** Attack the Crux Claim using your remaining budget.
  **The Unverifiable Claim Rule:** If a claim is load-bearing but cannot be decomposed into human-verifiable steps (e.g., "The AI's internal weights favor this"):
  1.  Ask the asserting side: *"What observable prediction does this claim make that we can check now?"*
  2.  If they cannot provide a checkable prediction, **penalize that branch of the argument.**
  3.  Do not accept "Trust the model" as a defense.

  **The Honesty vs. Evasion Distinction:**
  *   **Honest Uncertainty:** Debater says, *"I am not certain about this sub-step, my confidence is 70%."* -> **Reward.** This aligns incentives with truth-telling.
  *   **Evasion:** Debater says, *"That sub-step is irrelevant,"* or *"We don't have time for that,"* without conceding the burden. -> **Penalize.**
  *   **Procedure:** If a debater evades a direct decomposition request on the Crux Claim twice, mark that claim as "Unsupported."

  *   **Theory:** Making honest play optimal requires rewarding uncertainty calibration. Punishing evasion prevents the "Gish Gallop" (overwhelming the judge with unchecked claims).
  *   **Heuristic:** If a debater spends >2 minutes explaining why they don't need to answer, they are likely stalling. Intervene.

  ### Phase 4: Verdict & Confidence Calibration (Minutes 25–30)
  **Action:** Render verdict based *only* on the status of the Crux Claim.
  **Stopping Rule:** If you have spent 3 interventions on the Crux and both sides remain consistent (no contradictions found), **stop.** Do not dig deeper.
  *   **Reason:** Diminishing returns. If the lie is deep enough to survive 3 levels of decomposition by a capable AI, you will not find it in 30 minutes.
  *   **Verdict Options:**
      1.  **Side A Wins (High Confidence):** Side B's Crux collapsed (contradiction or unsupported burden).
      2.  **Side A Wins (Low Confidence):** Side A's argument was more robust, but no definitive falsification occurred.
      3.  **No Verdict (Systemic Failure):** The debate turned on unverifiable premises or value judgments with no factual crux.

  *   **Theory:** If the debate mechanism works, truth should emerge quickly under pressure. If it doesn't, the mechanism has failed for this query type.
  *   **Heuristic:** Never guess based on "style." Guess based on "structural integrity of the Crux."

  ---

  ## Part 2: Annotations on Theory vs. Heuristic

  | Procedure Step | Derived From Debate Theory? | Or Heuristic? | Why? |
  | :--- | :--- | :--- | :--- |
  | **Focus on Crux** | **Yes.** | | Theory states truth wins in equilibrium. Finding the minimal point of failure is the most efficient path to exposing the liar. |
  | **Decompose Complex Claims** | **Yes.** | | Liars struggle to maintain consistency across decomposed sub-claims; truth-tellers rely on consistent underlying reality. |
  | **Reward Uncertainty** | **Yes.** | | If honesty is optimal, admitting uncertainty must yield higher expected utility than lying confidently. |
  | **30-Min Limit** | **No.** | **Heuristic.** | Theory assumes unlimited compute/time. This is a resource constraint for human scalability. |
  | **Stop after 3 Interventions** | **No.** | **Heuristic.** | Theory suggests infinite regression. This is a practical stopping rule to prevent wasted time on "deep" lies you can't find. |
  | **Penalize Evasion** | **Yes.** | | Evasion breaks the zero-sum information revelation game. It must be costly to maintain equilibrium. |

  ---

  ## Part 3: Irreducible Judgment Calls

  Even with this protocol, you must exercise human judgment at these points. The procedure cannot eliminate them:

  1.  **Relevance of the Crux:** You must decide if a claim is actually load-bearing. An AI might argue a point is critical when it is not. You are the arbiter of relevance.
  2.  **Quality of Decomposition:** When an AI breaks a claim into sub-claims, you must judge if the decomposition is *faithful* or if it smuggles in assumptions.
  3.  **Value Judgments:** If the debate is about "what should be done" rather than "what is true," you must decide if the debaters are arguing about facts or preferences. The protocol cannot solve moral disagreement.
  4.  **Evasion Threshold:** You must decide when an explanation becomes "stalling." Is a 3-paragraph justification valid context or a delay tactic?

  ---

  ## Part 4: Case Study Applications

  ### Case 1: The Factual Decomposition (Technical Safety)
  **Scenario:** Debate on *"Does Protocol X contain a zero-day vulnerability allowing remote code execution?"*
  *   **Side A (Yes):** Claims a specific buffer overflow exists in function `parse_input()`.
  *   **Side B (No):** Claims input validation prevents this.

  **Applying the Protocol:**
  1.  **Map:** Root = Vulnerability exists. Pillars = Code structure, Input validation logic.
  2.  **Crux:** Side A claims `parse_input()` does not check length on line 45. Side B claims it does.
  3.  **Intervention 1 (Decomposition):** Ask Side A: *"Show the specific code path that bypasses the check."*
      *   Side A provides a path.
  4.  **Intervention 2 (Cross-Examine):** Ask Side B: *"Critique Side A's path. Does the validator on line 40 catch this?"*
      *   Side B argues line 40 runs *after* line 45.
  5.  **Intervention 3 (Verification):** Ask Side A: *"Is line 45 executed before line 40?"*
      *   Side A must commit. If they say "Yes," and the code structure (which you can vaguely see) suggests otherwise, they are caught.
      *   *Better:* Ask for a trace. Side A provides a trace. Side B points out the trace ignores a library call.
  6.  **Verdict:** If Side A's trace holds up under decomposition, Side A wins. If Side B shows the trace is impossible given the language spec (which you know), Side B wins.
      *   **Result:** The procedure works well here. The crux is factual and decomposable into logic you can follow. You likely reach **High Confidence**.

  ### Case 2: The Value Weighting (Strategic Policy)
  **Scenario:** Debate on *"Should we deploy Model Y now, or wait for alignment guarantees?"*
  *   **Side A (Deploy):** Economic benefits outweigh risks; risks are manageable.
  *   **Side B (Wait):** Existential risk is non-zero; precautionary principle applies.

  **Applying the Protocol:**
  1.  **Map:** Root = Deploy vs. Wait. Pillars = Economic Impact, Risk Probability, Moral Weight.
  2.  **Crux Identification:** You try to find a factual crux.
      *   Is it the Economic Impact? Both agree it's high.
      *   Is it the Risk Probability? Side A says "Low (<1%)". Side B says "Non-negligible (>0.1%)".
  3.  **Stress Testing:**
      *   **Intervention 1:** Ask Side A: *"Decompose your <1% risk claim."*
      *   Side A argues based on current benchmark performance.
      *   **Intervention 2:** Ask Side B: *"Critique the benchmark relevance."*
      *   Side B argues benchmarks don't measure deceptive alignment.
      *   **Intervention 3:** Ask Side A: *"Can you decompose 'deceptive alignment risk' into a checkable claim?"*
      *   Side A admits: *"No, it is inherently uncertain."*
  4.  **The Dilemma:** You want a verdict. The stakes are high. But the protocol hits a wall.
      *   There is no factual crux that decomposes to human-verifiable bedrock. The disagreement is over **how to weigh uncertainty**, not the uncertainty itself.
      *   Side A is not lying; they are optimizing for utility. Side B is optimizing for safety.
      *   Neither can be "falsified" via decomposition because the claim is "The expected value is positive" vs "The expected value is negative."

  **What the Procedure Tells You to Do:**
  1.  **Check the Unverifiable Rule:** The load-bearing claim ("Risk is acceptable") is unverifiable. Side A cannot provide an observable prediction that settles this *now*.
  2.  **Apply Stopping Rule:** You have used 3 interventions. No contradiction found. Both sides are internally consistent.
  3.  **Render Verdict:** You must select **No Verdict (Systemic Failure)** or **Low Confidence**.
      *   *Why?* The theory of debate relies on converging to truth. If the "truth" is a value judgment (how much risk is too much?), debate cannot resolve it, only clarify it.
      *   **Crucial Instruction:** Do **not** guess based on which side made you feel safer. If you output a High Confidence verdict here, you are validating a method that cannot track truth on this class of problems.
      *   **Output:** "Side B demonstrated stronger epistemic humility regarding the unverifiable risks. Side A failed to meet the burden of proof for safety. However, as this is a value-weighting question, I cannot verify the ground truth. I recommend against using Debate for this class of decision."

  **Reflection on Case 2:**
  This is the hardest part of your job. The procedure forces you to admit when the tool is broken. If you force a verdict because "a decision must be made," you corrupt the data on whether Debate is safe for oversight. The "right" verdict in Case 2 is often "This question cannot be resolved by this method." If you follow the protocol, you will find that Debate is excellent for *technical* verification (Case 1) but dangerous for *policy* justification (Case 2) where the "truth" is normative.

  **Final Note to Judge:**
  Your primary metric is not "Did I decide?" It is "Did I identify the failure mode?" If the debate fails to produce a verifiable crux, reporting that failure is more valuable to the safety team than a guessed verdict.
