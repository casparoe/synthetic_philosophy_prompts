answer: |-
  Here are the two cases, designed to isolate the variable of structural distribution while holding total material replacement constant.

  **Ship A: The *Marianne* (Consumable Replacement)**
  Over forty years of service as a sail-training barque, the *Marianne* undergoes rigorous maintenance to meet safety codes. By year forty, exactly 60% of her original timber has been replaced. However, the replacements are restricted entirely to high-wear surfaces and consumables: the deck planking has been swapped out three times due to rot and foot traffic; the rail caps, hatch covers, and bulwarks have been renewed twice; and all fastenings, rigging, and interior joinery are new. The spine of the vessel—the keel, the stem, the sternpost, and the primary ribs—remains entirely original, having been inspected and deemed sound throughout the vessel's life. She looks refreshed, but her underlying geometry is defined by the wood laid down at her launch.

  **Ship B: The *Katherine* (Structural Replacement)**
  Over the same forty-year period, the *Katherine*, a sister ship of identical class and age, also replaces exactly 60% of her original timber. Her maintenance history, however, is dictated by structural fatigue rather than surface wear. The deck planking and rail caps are largely original, weathered and patched but intact. Instead, the replacements come from the core: sections of the keel were scarfed out and replaced after a grounding; several primary frames and the sternpost were swapped due to dry rot in the bilge; and the stem was renewed after a collision. She looks older on the surface, but the wood defining her shape and holding her together is predominantly new, even though the total volume of original wood remaining is identical to the *Marianne*.

  ***

  ### Why the Cases Work (and Where They Split)

  If you hold a strict **Material Constitution view** (identity is determined by the sum of physical parts), Ship A and Ship B are metaphysically identical. Both retain 40% of their original matter. On this view, there is no asymmetry; both ships are equally "original" and equally "new." The location of the wood is irrelevant to the atomist; a cubic meter of oak in the keel counts the same as a cubic meter of oak in the deck.

  However, **Continuity of Function or Form views** drive the wedge you are looking for. Intuitively, readers will likely judge Ship B (*Katherine*) as having "become a new ship" sooner than Ship A (*Marianne*). This is because we tend to view artifacts not as bags of stuff, but as organized systems with a hierarchy of importance. The feature doing the work here is **causal/structural centrality**. We treat the keel and frames as the "skeleton" of the ship—the parts that dictate the ship's identity and geometry—whereas deck planks are "skin" or "clothing." Replacing the skin preserves the person; replacing the skeleton suggests a transplant or a reconstruction. The intuition relies on the assumption that the ship is organized around a core, rather than being a mereological sum of equal parts.

  ### The Variation: Emergency vs. Piecemeal

  If you flatten the temporal distribution—say, Ship B's keel is replaced all at once in a single dry-dock following a catastrophic grounding rather than piecemeal over twenty years—the intuition that Ship B is "less original" intensifies. This suggests that **spatiotemporal continuity** is interacting with structural centrality. A piecemeal replacement allows the ship to maintain a continuous functional trajectory; the "self" of the ship adapts gradually. A bulk replacement of the core feels like a death and resurrection. If the keel goes out all at once, the ship loses its defining axis in a single moment, breaking the psychological continuity even if the material percentage remains the same. The asymmetry survives, but it becomes sharper: we tolerate structural change better when it is gradual, implying that *process* matters as much as *location*.

  ### The Hobbesian Bonus: The Reassembled Keel

  If the removed keel timbers from Ship B are saved in a shed and eventually assembled into a hull (let's say, using new wood for the non-structural bits to make it seaworthy), creating Ship C, most people will hesitate to call Ship C the "original." Your suspicion is correct: **nobody cares about the pile of timber.**

  This reveals that the pull toward calling a reassembled ship "the Original" (in the classic Hobbes case where *all* parts are saved) tracks **form and function**, not just matter. A keel in a shed is not a ship; it is lumber. It lacks the functional organization that defines the kind "ship." Even if you reassemble the keel timbers into a new boat, if the *Marianne* (Ship A) has been sailing continuously with her original spine, she retains the claim to identity because she maintained the *functional organization* of the ship. The matter is necessary, but it is not sufficient. The intuition confirms that we value the *arrangement* of the matter (the form) over the matter itself, provided the arrangement maintains a continuous history.

  ### The Critique: Are You Cheating?

  You asked for honesty: **Yes, you are engineering the intuition.**

  A philosopher committed to **Spatiotemporal Continuity** (the dominant view in analytic metaphysics for persistence) will attack this pair as question-begging. They will argue that you are smuggling in a functionalist definition of "ship" under the guise of a materialist puzzle. To a spatiotemporal theorist, Ship A and Ship B are both unequivocally the same ships they were at launch, provided there was no moment where the ship ceased to function or exist as a coherent object. The location of the wood is metaphysically irrelevant to them.

  By choosing "keel" vs. "deck," you are leveraging a biological metaphor (skeleton vs. skin) that applies naturally to organisms but is contestable for artifacts. Is a ship really defined by its keel, or is that just a human projection of importance? If you defined a ship by its waterproof envelope, the deck planks become structural. You are eliciting the asymmetry you want by selecting parts that readers *already agree* are important.

  **Verdict:** This is not a fatal flaw for a column, but it is a philosophical bias. You are testing *folk metaphysics* (how people actually think), not *formal metaphysics* (how identity logically works). Your cases successfully demonstrate that human intuition is sensitive to structural hierarchy, not just material quantity. Just be prepared to acknowledge in print that you are exploiting our tendency to anthropomorphize objects. We treat ships like bodies, and that is why the keel matters more than the deck.
