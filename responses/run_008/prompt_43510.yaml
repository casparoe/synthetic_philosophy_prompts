answer: |-
  Here is the principle that best captures your verdicts, followed by the blunt truth about where it breaks, the solution to your V1/V3 tension, and the ruling on your undecided cases.

  ### The Principle: Phenomenal Access
  **A subject knows what an experience is like if and only if they possess a functioning phenomenal concept of that experience. Possession requires two conditions:**
  1.  **Acquaintance:** The subject has had (or is currently having) a causal token of that specific phenomenal type.
  2.  **Access:** The subject currently has the cognitive capacity to deploy that concept (via attention, memory, or recognition).

  ### The Audit
  This principle is lean. It has no epicycles. Here is how it handles your seven verdicts:

  *   **1. Classic Mary:** Fails Acquaintance inside. Passes both on exit. **Verdict: Learns.** (Fits)
  *   **2. Implant Mary:** Passes Acquaintance via implant. Passes Access. Exit adds no new Acquaintance or Access. **Verdict: No new learning.** (Fits)
  *   **3. Derivation Mary:** Deriving sentences satisfies neither Acquaintance nor Access. Exit satisfies Acquaintance. **Verdict: Learns despite derivation.** (Fits)
  *   **4. Colorblind Friend:** Fails Acquaintance. **Verdict: Doesn't know.** (Fits)
  *   **5. Anti-Ability:** Passes Acquaintance (current experience). Passes Access (current attention), even if future memory is blocked. **Verdict: Knows (while looking).** (Fits, *with a caveat*)
  *   **6. Forgotten Red:** Passes Acquaintance (historical). Fails Access (no memory/recall). **Verdict: Doesn't currently know.** (Fits)
  *   **7. Mango:** Fails Acquaintance (imagination $\neq$ token). **Verdict: Doesn't know.** (Fits)

  **The Blunt Truth:**
  The principle works for all seven, but **Verdict #5 is the weak link.** Your principle implies that "knowing what it's like" is a transient state that can be lost (as in #6) or gained temporarily (as in #5). This contradicts the common intuition that knowledge is a *dispositional* property (i.e., if you know it, you should be able to recall it later).
  If you want to keep #5, you must accept that "knowing what red looks like" is not a permanent entry in a database, but a live cognitive state. If you find that unacceptable, #5 is the verdict you must drop. I recommend keeping #5 and accepting the transient nature of phenomenal knowledge; it aligns better with #6 (forgotten red) anyway.

  ### The Hard Question: V1, V3, and the "New Fact"
  You asked if holding #1 (She learns) and #3 (She derives all sentences) forces you to drop the "New Fact" story for an "Old Fact/New Mode" story, and whether that collapses into "She didn't learn anything."

  **The Blunt Answer:**
  Yes, V1 and V3 together **force** you to abandon the idea that Mary learns a new *propositional fact* (in the standard sense of a truth-condition that was previously unknown to her). If she can derive every true sentence from inside the room, the set of true propositions is exhausted. There is no propositional room left for a "new fact."

  **However, this does NOT collapse into "She didn't learn anything."**
  Here is the defense that keeps "Learning" meaningful without requiring "New Propositions":

  1.  **Distinguish Information from Integration:** Mary has the *information* inside the room (the map), but she lacks the *integration* (the terrain). Learning is not just adding a file to a cabinet; it is the ability to *use* that file in reasoning, prediction, and recognition.
  2.  **The Cognitive Role Change:** When Mary sees red, the physical fact "Red is wavelength X" changes its cognitive role. Inside the room, that fact is inert data. Outside, it is connected to a phenomenal concept. The *fact* hasn't changed, but Mary's *cognitive architecture* has.
  3.  **Substantive Learning:** Acquiring a new conceptual capacity is a genuine form of learning. Think of learning to ride a bike. You might know all the physics of balance (derivation), but until you ride, you haven't *learned to ride*. We don't say "You didn't learn anything, you just applied old facts under a new mode." We say you learned a skill. Mary's "learning" is the acquisition of a phenomenal skill/concept.

  **Conclusion on V1/V3:** You must drop "New Propositional Fact." You keep "New Knowledge" defined as **New Conceptual Access.** This is not a euphemism for "nothing happened." It is a substantive claim about cognitive architecture. If you insist on "New Fact" in the propositional sense, you must drop V3 (she can't derive everything). Given your commitment to physical closure, dropping V3 is costlier than refining your definition of "fact."

  ### The Undecided Cases
  Applying the **Phenomenal Access Principle**:

  **1. Subliminal Red (Unconscious Experience)**
  *   **Acquaintance:** Debatable. Let's grant a subliminal token occurs.
  *   **Access:** Fails. By definition, the subject is not consciously aware and cannot deploy the concept or attend to the quality.
  *   **Verdict:** **They do not know what red looks like.**
  *   **Reasoning:** Without conscious access, the experience cannot ground a phenomenal concept. It's a causal event, not a known quality.

  **2. Hallucinated Red**
  *   **Acquaintance:** Passes. A hallucination of red provides a token of the *experience* of red, even if it lacks an external object. "What red looks like" refers to the phenomenal character, not the external property.
  *   **Access:** Passes (assuming they are consciously attending to the hallucination).
  *   **Verdict:** **They know what red looks like.**
  *   **Reasoning:** They have the phenomenal concept grounded in the experience. They may be wrong about the *world* (that there is a red object), but they are not wrong about the *experience* (what red looks like).

  ### Final Summary
  Your notebook is more coherent than you think. The tension isn't in the verdicts; it's in the metaphysics of "fact."
  1.  **Adopt the Phenomenal Access Principle.**
  2.  **Accept that "Knowledge" here is occurrent/access-based** (to save #5 and #6).
  3.  **Abandon "New Proposition"** for Classic Mary, but defend **"New Conceptual Access"** as genuine learning. This saves you from the "She learned nothing" bullet while respecting the derivation intuition.
  4.  **Rule:** Subliminal = No Knowledge. Hallucination = Knowledge.

  If you try to keep "New Propositional Fact" while holding V3, you aren't being inconsistent; you're being incoherent. Drop the proposition, keep the learning.
