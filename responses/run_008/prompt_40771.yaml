prompt: |-
  I'm in a graduate seminar on the ethics and law of consent, and before we turn to the rival theories — autonomy-based accounts, normative-power or Hohfeldian views, and the more protective/paternalist approaches — I want to fix the standard they should be judged against. Write the desiderata: what any adequate theory of what makes consent valid has to deliver, with the case or consideration motivating each requirement. The list should at least cover: (i) why deception about the nature of the act or the identity of the agent — someone impersonating your partner in a darkened room — invalidates consent while deception about, say, wealth or marital status usually does not; (ii) exploitation through offers rather than threats — the desperate patient who "agrees" to a risky trial because it's the only slot left, and whether desperation vitiates consent even when no threat was made; (iii) gradable and fluctuating competence, including intoxication, cognitive disability, and advance directives that try to speak for a future self; (iv) whether one can validly consent to what seriously wrongs or harms oneself — dangerous experimentation, degrading contracts — and what a negative answer would commit the theory to; (v) proxy and standing questions for children and the incompetent; (vi) conditional consent, as in agreeing to sex only with a condom or to a search only of specified places, and whether violating the condition means consent was absent all along or that a distinct wrong occurred; and (vii) formalities — whether signed informed-consent forms are constitutive of consent or merely evidential, and why the same words can work in one setting and not another. For each requirement, say what motivates it and mark which you take to be non-negotiable versus artifacts of one camp's agenda. Then tell me which subset of the requirements you suspect cannot be jointly satisfied — my hunch is that the normative-power picture and the autonomy-protection picture divide the list between them and each sacrifices something essential — and identify the single requirement that does the most work in ruling out otherwise-plausible theories. Don't score the existing theories against the list; I'll do that in class.
