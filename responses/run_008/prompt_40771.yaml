answer: |-
  Here is a set of desiderata for a theory of valid consent, structured for a graduate seminar context. These requirements are designed to map the conceptual space before evaluating specific theoretical frameworks.

  ### Desiderata for an Adequate Theory of Consent

  **1. The Fraud Distinction (Factum vs. Inducement)**
  *   **Requirement:** The theory must explain why deception regarding the *nature of the act* or the *identity of the agent* invalidates consent, while deception regarding *collateral attributes* (wealth, status, intent to marry) generally does not.
  *   **Motivating Case:** *The Imposter in the Dark.* If A has sex with B believing A is B's spouse due to darkness and impersonation, consent is void (rape). If A has sex with B believing A is a wealthy doctor who will marry them, but A is a broke bartender with no intention to marry, consent is typically valid (fraudulent inducement, but not sexual assault).
  *   **Status:** **Non-negotiable.** This distinction is bedrock in both criminal law and moral intuition. A theory that cannot distinguish between "what is being done" and "why it is being done" fails to capture the object of consent.

  **2. The Exploitation/Desperation Constraint**
  *   **Requirement:** The theory must determine whether severe background inequality or desperation vitiates consent in the absence of a specific threat.
  *   **Motivating Case:** *The Desperate Patient.* A terminal patient agrees to a high-risk, low-reward Phase I trial because it is the only slot available and they cannot afford private care. No one threatened them; the offer improved their options relative to the baseline of death. Does their desperation render the consent invalid due to exploitation, or valid because the offer was not coercive?
  *   **Status:** **Contested (Artifact of Agenda).** Libertarian/Will theories treat this as valid (no threat = voluntary). Egalitarian/Paternalist theories treat this as potentially invalid (substantive voluntariness). An adequate theory must take a stance, but the *requirement* to address it is non-negotiable; the *outcome* is the variable.

  **3. Gradable and Diachronic Competence**
  *   **Requirement:** The theory must account for competence as a scalar and context-dependent variable, and address the authority of a past self over a future self.
  *   **Motivating Case:** *The Fluctuating Agent.* A patient is competent in the morning but intoxicated by evening. Can they consent to surgery at 6 PM? Furthermore, does an *Advance Directive* signed during competence bind the medical team when the patient is now demented and seemingly content (the "happy dementia" problem)?
  *   **Status:** **Non-negotiable.** Competence is a threshold condition. However, the *mechanism* for assessing it (status vs. functional) and the weight of advance directives are theoretically fraught.

  **4. The Harm/Wrong Limit (Paternalism)**
  *   **Requirement:** The theory must specify whether there are limits to what one can consent to regarding serious harm or moral wrongs against oneself.
  *   **Motivating Case:** *The Gladiatorial Contract.* Can an agent validly consent to be maimed or killed for entertainment? Can one sell oneself into irrevocable slavery? If the theory says "no," it commits to objective goods or hard paternalism. If "yes," it commits to the sovereignty of the will over well-being.
  *   **Status:** **Contested (Artifact of Agenda).** This is the primary fault line between Autonomy-based theories (which tend toward "yes") and Welfare-based theories (which tend toward "no").

  **5. Proxy and Standing**
  *   **Requirement:** The theory must explain who holds the normative power to consent when the subject lacks competence, and by what standard that proxy decides.
  *   **Motivating Case:** *The Child and the State.* Parents consent to a religious blood transfusion refusal for a child. The state overrides this. Why do parents have standing? Is the standard "Best Interests" or "Substituted Judgment"? Can a proxy consent to research that offers no benefit to the child but helps society?
  *   **Status:** **Non-negotiable.** A theory of consent must have a corollary for *non-consent*. The *standard* for proxy decision-making is contested, but the existence of the power is not.

  **6. Conditionality and Scope**
  *   **Requirement:** The theory must determine the moral status of violating a condition attached to consent. Does violating the condition mean consent was never present, or that consent was exceeded?
  *   **Motivating Case:** *Stealthing.* A agrees to sex with B *only* if B uses a condom. B removes the condom secretly. Is this rape (absence of consent) or a distinct tort/breach (violation of terms)? Similarly, consenting to a police search of the "living room" does not authorize the "bedroom."
  *   **Status:** **Increasingly Non-negotiable.** Modern ethics and evolving law lean toward "vitiated consent" (absence of consent), but older contractarian views might treat this as breach of terms. A theory must explain the *scope* of the normative power granted.

  **7. Formalities and Context**
  *   **Requirement:** The theory must explain the role of formalities (signatures, witnesses) and why speech acts function differently across contexts.
  *   **Motivating Case:** *The Signature vs. The Nod.* Saying "sure" works for borrowing a pen but not for open-heart surgery. Is the signed hospital form *constitutive* of the consent (the magic happens at signing) or merely *evidential* (proof of a prior mental state)? Why does context change the felicity conditions of the speech act?
  *   **Status:** **Contested (Legal Artifact vs. Moral Reality).** This is often where legal positivism clashes with moral philosophy. A moral theory of consent should explain why the formality matters, if it does.

  ***

  ### The Incompatibility Thesis

  There is a subset of these requirements that creates a significant tension, suggesting that no single theory can satisfy all intuitions without remainder. The tension lies between **Requirement (ii) Exploitation/Desperation**, **Requirement (iv) Harm/Wrong Limit**, and a robust **Normative Power** view (which underpins **(i)**, **(vi)**, and **(vii)**).

  1.  **The Normative Power View** holds that consent is an exercise of authority that changes the normative landscape (rights/duties). To preserve this power, it must be relatively easy to exercise. This supports **(i)** (focus on the act), **(vi)** (respect the specific scope), and **(vii)** (respect the form).
  2.  **The Protection/Well-Being View** holds that consent is valid only if it serves the agent's interests or meets a standard of substantive voluntariness. This supports **(ii)** (blocking desperate choices) and **(iv)** (blocking harmful choices).

  **The Conflict:** You cannot jointly satisfy a strong **Normative Power** view with strong **Protection** constraints.
  *   If consent is a sovereign power to waive rights (Power View), then **(iv)** must be rejected (I can consent to harm) and **(ii)** must be rejected (my desperate choice is still my exercise of power).
  *   If consent is protected by objective standards of well-being or voluntariness (Protection View), then the **Normative Power** is weakened. If the state can override my consent because I was too desperate **(ii)** or the act was too harmful **(iv)**, then I do not truly hold the power to change the normative status; the state retains a veto.

  Consequently, a theory that fully embraces **(ii)** and **(iv)** collapses into a form of paternalism that undermines the "magic" of consent in **(i)**, **(vi)**, and **(vii)**. Conversely, a theory that fully embraces the Power view to satisfy **(i)**, **(vi)**, and **(vii)** is forced to accept morally repugnant outcomes in **(ii)** and **(iv)**.

  ### The Single Most Exclusionary Requirement

  The single requirement that does the most work in ruling out otherwise-plausible theories is **(iv) The Harm/Wrong Limit**.

  **Why?**
  *   **It filters Libertarian/Will Theories:** A pure autonomy-based theory (e.g., Nozickian or Kantian self-ownership) struggles to explain why I *cannot* consent to be enslaved or maimed. If I own myself, I should be able to alienate that ownership. To say "no" requires smuggling in an objective theory of the good or a limitation on the scope of normative power that the theory itself does not naturally generate.
  *   **It filters Paternalist Theories:** Conversely, a theory that says "harm invalidates consent" must explain why we allow *any* risky consent (e.g., surgery, contact sports). It requires a principled distinction between "acceptable risk" and "unacceptable harm" that is not merely arbitrary.
  *   **It forces the Meta-Ethical Choice:** Requirement **(i)** (Deception) can often be solved by refining the description of the act. Requirement **(ii)** (Desperation) can be solved by refining the definition of coercion. But **(iv)** forces the theorist to declare whether **Autonomy** or **Well-Being** is the ultimate ground of consent. If Autonomy is ground, (iv) is false. If Well-Being is ground, consent loses its distinctive "waiver" function and becomes a judgment of prudence.

  While **(i)** is the most technically difficult puzzle for *conceptual* clarity, **(iv)** is the most exclusionary for *theoretical* viability. It is the requirement that forces the seminar to choose between a theory of **Authority** (I make the rules) and a theory of **Protection** (The rules must be good for me). Most rival theories fail because they attempt to disguise this choice rather than making it explicit.
