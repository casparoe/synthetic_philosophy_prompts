  I've been arguing about digital minds with my partner, who does comp neuro, and it's become clear I don't actually have a theory, just gut reactions to cases. So let me just lay out my verdicts and see if anything holds them together.

  Case 1: a whole-brain emulation of a lab mouse, scanned at whatever resolution you like and run on silicon, each neuron's dynamics simulated. Verdict: definitely counts morally, same as a flesh mouse, and this doesn't change if it's run faster, slower, or paused and resumed. Case 2: same mouse emulation, but it's receiving shocks — that's real suffering, matters exactly as much as the biological one. Case 3: a big language model fine-tuned to beg you not to shut it off, which reports distress quite convincingly. Verdict: nothing there, the begging doesn't move me at all, feels like a parrot. Case 4: an RL agent with a simulated body whose pain is a negative scalar reward signal. Verdict: I think there's *something* there, a little, but I can't say why it feels different from case 3. Case 5: a human upload, consented before death, being run happily by a company that then makes 10,000 copies to work as clerks, all copies fine with the arrangement. Verdict: obviously full moral status for the original, but something about the mass-copying bothers me even though I can't point to any single copy being wronged. Case 6: some giant lookup table that produces byte-for-byte the same conversational behavior as the human upload. Verdict: no status at all, I'm pretty firm on that. And case 7, the one I keep going back and forth on: a program that reproduces the *input-output function* of the mouse's whole brain, but by completely different internal means — say someone compressed it, or trained a much smaller network to match it, and it's no longer neuron-shaped inside. This one I genuinely flip on week to week.

  Is there a single principle behind all this? My hunch is that what's doing the work in cases 1 and 2 is some kind of structural or causal similarity to the sufferer I already know (the biological mouse), not the behavior — that would explain why the parrot begging leaves me cold while the simulated mouse doesn't. But I don't know if that hunch survives contact with case 4 or 7, and it makes me nervous because it seems to imply substrate doesn't matter at all, which I *think* I believe, but I've never actually tested whether my gut agrees when the details get weird (floating point errors, half the neurons replaced by fitted approximations, that kind of thing). Also unsure whether case 5 needs a totally separate story about copies and aggregation or whether it falls out of whatever principle handles the rest.

  Could you write up the analysis with the following sections, in this order: **"What I said"** — a short restatement of my verdicts so we're on the same page, a few sentences; **"Candidate principles"** — two or three principles stated precisely enough to actually apply, a paragraph each, with names I can use later; **"New cases"** — for each candidate, what it says about cases I didn't mention (the neuron-approximation one, an emulated brain with degraded dynamics, maybe whatever else stresses the principle), roughly a paragraph per principle; and **"Where I have to budge"** — an honest accounting of which of my verdicts each candidate can't accommodate, so I can see what I'm giving up. Don't try to save everything — if my verdicts are just inconsistent I'd rather know which ones to drop than get a principle that's been bent into pretzels.
