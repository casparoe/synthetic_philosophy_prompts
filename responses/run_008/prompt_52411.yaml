prompt: |-
  I'm a machine-learning researcher who has spent the last few years working on reward modelling and RLHF, so my native vocabulary is learned representations, training objectives, proxy rewards, distribution shift, specification gaming, and inner alignment. In my spare time I've been reading about teleosemantics — the philosophical project of naturalising mental content by explaining how a brain state gets to be about, or represent, something in the world, typically by appeal to biological function rather than by stipulating a mysterious 'aboutness' relation. I gather the central ideas are something like this: Millikan explains representation via what she calls proper functions, acquired through a history of selection and reproduction; Dretske's earlier account treats a state as representing whatever it reliably indicated about conditions in which it was recruited to guide behaviour; and critics press the misrepresentation problem — how can a state carry the content COW when it was selected for firing at cows, cows-at-dusk, and large white shapes on dark nights?

  Restate the main teleosemantic positions and their disagreements in the vocabulary I actually use, as faithfully as you can. In particular, I want to know how far the analogy goes: does proper function map onto a learned objective that was selected by training rather than by evolution, and does the misrepresentation problem just reappear as the gap between the intended objective and the behaviour actually reinforced — reward hacking, proxied goals, training-distribution artefacts? And does the swampman-style intuition about a being with no evolutionary history but a perfect duplicate's behaviour have an analogue in, say, a model that arrives at the same weights through an unselected accident of initialisation or data ordering? Where I'd genuinely like your judgement is the residue report: which parts of the teleosemantics debate survive translation cleanly, which parts have to be distorted to fit my vocabulary, and whether anything in it has no counterpart at all. Then say which way you think the residue cuts — does it expose a blind spot in how we ML people think about what our models' representations are about, or does it suggest the philosophers' disagreement is less substantive than it looks because the terms never fully pinned anything down?

  Please assume I'm fluent in the ML concepts but only at an interested-amateur level in philosophy, so keep any remaining philosophical terminology minimal and glossed. Keep the whole answer under 500 words.
