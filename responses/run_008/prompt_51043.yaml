          *   **Hidden Work:** Assumes the alternative is eating *only* chicken. If the alternative is plants, we compare cow deaths to *zero* farmed animal deaths (plus field deaths). Also ignores the suffering *duration* and *intensity* of the cow's life vs. the field animals.

      *   *Argument 2: Crop Cultivation Kills Field Animals.*
