prompt: |-
  me and my brother have been having the same argument every two years for a decade now. his line never changes: one vote has essentially zero chance of deciding anything, so turning out is wasting a tuesday in november. i've got two half-baked responses i keep reaching for, and instead of a third round of going in circles, i want to figure out what a real theory of when voting is rational would actually have to get right before i keep using them. response one: my vote matters through more than the official count, because i talk politics with my friends and at least two of them only vote because i pester them, so my single decision has a bigger footprint than one ballot — its one link in a causal chain. response two: if im the kind of person who votes, other people similar to me probably vote too, so my showing up is evidence about what a whole block of similar people did, which makes it feel like i cast a million votes at once. my brother says that second one is double counting because i only pull my own lever.

  so heres what i want from you: the requirements list. what would an adequate theory of when it's rational to vote have to deliver — which cases it has to handle (a small town race where the vote really could come down to you vs a presidential race, a unanimous jury where your vote only matters when everyone else is split and therefore when the room is telling you the case was closer than you thought — i'd like you to tell me whether that jury case is one where being pivotal is somehow bad news), what distinctions it cant collapse (voting from duty vs voting for the outcome vs voting because you like doing it), and whether it has to take sides on whether my two responses can both be true at once or whether they double count the same effect. also flag if you think any of the requirements conflict with each other — like maybe a theory that handles the jury case well ends up saying nobody should vote in big elections, and a theory that gets big elections right stumbles on juries. last thing: which single requirement does the most to rule views in or out. no papers or author names, just the ideas.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their brother argue every two years about the rationality of voting.
      *   **Brother's Stance:** Instrumental rationality only. One vote has near-zero probability of pivoting an election, so voting is a waste of time (cost > expected benefit).
      *   **User's Stance:** Two "half-baked" responses:
          1.  *Social Multiplier:* My vote influences others (causal chain).
          2.  *Evidential/Correlation:* If I vote, people like me vote (my vote is evidence of a block).
      *   **Brother's Counter:** Response 2 is double-counting (you only pull one lever).
      *   **Goal:** The user wants a "requirements list" for an *adequate theory of when voting is rational*. They don't want paper citations or author names, just the ideas.
      *   **Specific Requirements for the Output:**
          1.  List the requirements an adequate theory must deliver.
          2.  Handle specific cases: Small town vs. Presidential, Unanimous Jury (is being pivotal bad news there?).
          3.  Maintain distinctions: Duty vs. Outcome vs. Enjoyment.
          4.  Address the user's two responses (can they coexist or do they double count?).
          5.  Flag internal conflicts/Trade-offs (e.g., theory works for juries but fails for elections).
          6.  Identify the *single most important requirement* that rules views in/out.

  2.  **Deconstruct the Problem (The "Paradox of Voting"):**
      *   The core issue is the Downsian Paradox: Cost of voting > (Probability of Pivoting * Benefit of Outcome). Since P(Pivot) is tiny, Rational Choice Theory says don't vote. Yet people do.
      *   To solve this, a theory needs to expand the "Benefit" side or redefine "Rationality."

  3.  **Drafting the Requirements List:**

      *   *Requirement 1: Scale Sensitivity.* The theory must explain why voting feels different in a town of 500 vs. a nation of 300 million. It can't treat all probabilities as effectively zero.
      *   *Requirement 2: The Definition of "Impact".* It needs to define what "making a difference" means. Is it only *causal* pivotality (Brother's view) or does it include *expressive* or *evidential* impact?
      *   *Requirement 3: Motivation Taxonomy.* It must distinguish *why* someone votes. Instrumental (outcome), Expressive (identity/duty), Intrinsic (enjoyment). Collapsing these leads to confusion.
      *   *Requirement 4: The Correlation vs. Causation Problem.* This addresses the user's Response 2. Does my action *cause* others to act, or is it just *correlated*? If correlated, does that count towards rationality? (Evidential Decision Theory vs. Causal Decision Theory).
      *   *Requirement 5: The "Pivotality" Trap (Jury Case).* In a jury, if you are pivotal, it means everyone else is split. This implies high uncertainty/conflict. Does being pivotal mean the decision is harder/worse? The theory needs to handle cases where being pivotal is informative about the quality of the decision, not just the power to change it.

  4.  **Addressing the User's Specific Responses:**
      *   *Response 1 (Social Multiplier):* This is causal. If I talk to friends, I change their costs/benefits. This is valid under standard rational choice *if* the social cost/benefit is included.
      *   *Response 2 (Evidential/Block):* This is the trickier one. Brother says "double counting." In Causal Decision Theory (CDT), he's right. In Evidential Decision Theory (EDT), he's wrong. An adequate theory must take a stance on whether *correlation* counts as *agency*.
      *   *Can they coexist?* Yes, but they operate on different mechanisms. One is causal influence, one is statistical correlation. A theory needs to decide if both contribute to "rationality."

  5.  **Addressing the Jury Case:**
      *   In a unanimous jury, your vote only matters if 11-0 or 0-11 (wait, no, if it must be unanimous, your vote matters if the other 11 agree, because if one disagrees, it hangs). Actually, in a unanimous jury, you are pivotal if the other 11 agree. If they disagree, the vote is already hung.
      *   *Wait, let's refine:* If the rule is unanimity, my vote matters only if the other 11 vote the same way. If they are split (e.g., 6-5), my vote doesn't decide the verdict (it's already not unanimous).
      *   *User's premise:* "your vote only matters when everyone else is split." This sounds like a majority rule jury, not unanimous. Let's assume the user means a standard majority verdict or is confused about unanimity.
      *   *Correction:* If it's unanimous, I am pivotal only if everyone else agrees. If it's majority, I am pivotal if it's tied.
      *   *User's specific point:* "when the room is telling you the case was closer than you thought." If I'm pivotal in a majority jury (6-5), it means the evidence was ambiguous. Is that "bad news"? It suggests high error risk.
      *   *Theory Requirement:* Must distinguish between *power to decide* and *information revealed by the need to decide*.

  6.  **Identifying Conflicts/Trade-offs:**
      *   *Conflict:* If you lean heavily into Evidential Decision Theory (Response 2), you solve the Presidential election puzzle but might imply magical thinking (I vote, therefore my clone votes). If you stick to Causal (Brother), you solve the logic but fail to explain behavior.
      *   *Conflict:* A theory that emphasizes "Duty" (Deontology) bypasses the calculation entirely, but then it's not a theory of *instrumental* rationality anymore.
      *   *Jury vs. Election:* A theory based on pivot probability works for Juries (high pivot chance) but fails Elections (low pivot chance). A theory based on Duty works for both but ignores consequences.

  7.  **Selecting the "Single Most Important Requirement":**
      *   What rules the most views in/out? It's the definition of **Agency/Control**.
      *   Does rationality require *causal* control over the outcome, or is *participation in a process* sufficient?
      *   If the theory demands Causal Pivotality, the Brother wins (mostly).
      *   If the theory allows Evidential or Expressive utility, the User wins.
      *   So, the requirement is: **The theory must specify whether rationality is bound by causal leverage or if it includes evidential/expressive utility.**

  8.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I name any papers? No.
      *   *Check:* Did I address the Jury case specifically? Yes, need to clarify the "bad news" aspect.
      *   *Check:* Did I address the double-counting charge? Yes, via Causal vs. Evidential distinction.
      *   *Tone:* Analytical, philosophical, neutral but helpful.
      *   *Structure:* Use the "Requirements List" format requested.

      *(Self-Correction on Jury Logic)*: The user says "unanimous jury where your vote only matters when everyone else is split." That's actually incorrect for a unanimous jury. In a unanimous jury, my vote matters if everyone else agrees (because if one person disagrees, it's already hung, so my vote doesn't change the outcome from 'hung' to 'guilty', it stays 'hung'). Wait.
      *   Scenario A (Unanimous): 11 Guilty, 1 Not Guilty -> Hung. My vote (if I'm the 12th) matters only if the other 11 are Guilty. If they are split 6-5, the verdict is already Hung. So my vote *doesn't* matter in a split room.
      *   Scenario B (Majority): 6-5. My vote breaks the tie.
      *   The user's premise ("vote only matters when everyone else is split") implies a Majority rule jury, or they are confused. I should gently correct or address the *spirit* of the point: Pivotality implies a close call.
      *   *Decision:* I will address the *spirit* of the point: Pivotality reveals information about the consensus. If I am pivotal, the group is deeply divided. Is that bad? It means the decision is high-risk. A theory needs to account for the *quality* of the decision, not just the *act* of deciding.

      *(Refining the "Double Counting" issue)*: Response 1 is Causal (I influence friends). Response 2 is Evidential (I am correlated with strangers). Brother calls Response 2 double counting. Technically, Response 2 isn't double counting *if* you accept Evidential Decision Theory, but it *is* magic thinking under Causal Decision Theory. I need to make sure the requirements list forces a choice between CDT and EDT.

  9.  **Finalizing the Output Structure:**
      *   Intro: Acknowledge the depth of the problem (Paradox of Voting).
      *   The Requirements List (5-6 key points).
      *   The Conflict/Trade-off Section.
      *   The Single Deciding Requirement.
      *   Verdict on User's Responses.

  10. **Final Review against constraints:** No papers, no authors. Just ideas. Check.

  *(Self-Correction on the Jury "Bad News" point)*: The user asks: "i'd like you to tell me whether that jury case is one where being pivotal is somehow bad news".
      *   If I'm pivotal, the group is split. This implies the evidence is ambiguous. Ambiguous evidence + high stakes = higher risk of error. So yes, being pivotal can be "bad news" regarding the *reliability* of the outcome, even if it's "good news" regarding my *power*. A theory must separate Power from Reliability.

  Okay, ready to write.
answer: |-
  Here is a requirements list for an adequate theory of rational voting. To settle the argument with your brother, a theory cannot just say "voting is good." It has to specify the mechanics of *why* it counts as a rational action under specific conditions.

  ### The Requirements List

  **1. The Scale Sensitivity Requirement**
  The theory must explain why the rationality calculation shifts as the group size changes without breaking the logic.
  *   **The Case:** In a small town election (500 voters), your chance of pivoting the result is roughly 1 in 50. In a presidential election (100 million voters), it is effectively zero.
  *   **The Demand:** A theory that says "voting is rational because you might pivot" works for the town but fails for the presidency. A theory that says "voting is rational because of duty" works for both but ignores the stakes. An adequate theory must account for why people feel the *same* obligation in both cases despite the *massive* difference in causal leverage. It cannot treat probability as binary (zero vs. non-zero); it must handle the continuum.

  **2. The Causal vs. Evidential Distinction**
  The theory must explicitly state whether an agent is responsible only for what they *cause* or also for what their action *signals*.
  *   **The Case:** This addresses your second response (the "block of similar people").
  *   **The Demand:** Your brother is arguing from **Causal Decision Theory**: You only get credit for the physical lever you pull. You are arguing from **Evidential Decision Theory**: Your action is evidence of what similar agents are doing, so you get credit for the correlation.
  *   **The Constraint:** An adequate theory cannot have it both ways without explaining the mechanism. If it allows evidential reasoning, it must explain why this isn't magical thinking (i.e., "I clap, so the rain stops"). If it demands causal reasoning, it must admit that in large elections, the instrumental value is zero. It must pick a lane on whether correlation counts as agency.

  **3. The Motivation Taxonomy Requirement**
  The theory must distinguish between three distinct sources of value and not collapse them into one.
  *   **The Distinctions:**
      1.  **Instrumental:** I vote to change the outcome.
      2.  **Expressive:** I vote to affirm my identity or values (like cheering for a sports team).
      3.  **Deontological:** I vote because it is a duty, regardless of outcome or feeling.
  *   **The Demand:** Your brother is attacking the *Instrumental* view. Your responses mix *Instrumental* (Response 1: influencing friends) with *Evidential* (Response 2: correlating with strangers). An adequate theory must specify which of these three makes the act rational. If a theory claims voting is rational *only* instrumentally, it fails to describe reality. If it claims it is rational *only* expressively, it concedes your brother's point that the vote won't change the outcome.

  **4. The Information vs. Power Requirement (The Jury Case)**
  The theory must separate the *power to decide* from the *information revealed by being pivotal*.
  *   **The Case:** You asked about the jury. In a unanimous jury, you are pivotal only if everyone else agrees. In a majority jury, you are pivotal if the room is split.
  *   **The Analysis:** Being pivotal is indeed "bad news" in a specific sense. If your vote is the decider, it implies the other jurors are deeply divided or the evidence is ambiguous. This signals a high risk of error.
  *   **The Demand:** An adequate theory must account for the fact that having high pivotality (like in a jury or small town) often correlates with high uncertainty. A theory that says "vote because you have power" ignores that your power is highest when the decision is hardest. It must explain why it is rational to exercise power precisely when the information environment suggests the choice is risky.

  **5. The Social Cost/Benefit Integration**
  The theory must account for social externalities without double-counting.
  *   **The Case:** This addresses your first response (pestering friends).
  *   **The Demand:** If your rationality depends on influencing others, the theory must treat your friends' votes as *your* utility. However, if your friends are also rational agents making their own calculations, you cannot claim their agency as your own. The theory must resolve whether social pressure is a valid "benefit" you can claim for your own rationality ledger, or if that is simply shifting the cost onto them.

  ### Internal Conflicts and Trade-offs

  There is a fundamental tension between **Requirement 1 (Scale)** and **Requirement 2 (Causal vs. Evidential)**.

  *   **The Conflict:** If you build a theory that satisfies **Scale** (explains why voting is rational in huge elections), you almost certainly have to rely on **Evidential** reasoning (Response 2) or **Expressive** value (Requirement 3).
  *   **The Trade-off:** However, if you rely on Evidential reasoning, you stumble on the **Jury Case**. In a jury, causal power is real and high. If you use a theory designed for elections (where causal power is near zero), it might undervalue the jury vote. Conversely, a theory designed for juries (where pivotality is high) will declare voting in presidential elections irrational.
  *   **The Risk:** A theory that solves the presidential election paradox by saying "your vote is evidence of a block" risks implying that you should vote in *every* election, even ones where you hate both candidates, simply to maintain the statistical correlation. This leads to a rigid, potentially irrational consistency.

  ### The Verdict on Your Two Responses

  An adequate theory would likely rule that **both your responses are valid, but they belong to different categories, and your brother is half-right about the double counting.**

  *   **Response 1 (Social Multiplier):** This is **Causal**. You are genuinely changing the cost/benefit analysis for your friends. This is not double-counting; it is expanding the "Benefit" side of the equation to include downstream effects. An adequate theory *must* accept this as valid instrumental rationality.
  *   **Response 2 (The Block):** This is **Evidential**. Your brother is right that this is "double counting" *if* you are using standard Causal Decision Theory. You cannot count the votes of strangers as *your* doing just because you are similar. However, if the theory adopts Evidential Decision Theory, it is valid.
  *   **The Synthesis:** You cannot use Response 2 to justify the *outcome* (changing the winner) while using Response 1 to justify the *act*. You have to pick one framework. If you claim your vote matters because of the "block," you are admitting your single lever doesn't matter causally. If you claim it matters because of "friends," you admit the "block" argument is irrelevant. Mixing them creates the double-counting error your brother spotted.

  ### The Single Deciding Requirement

  The one requirement that does the most work to rule views in or out is **Requirement 2: The Causal vs. Evidential Distinction.**

  *   **Why:** This is the bottleneck.
      *   If the theory demands **Causal Control** (your brother's view), then voting in a presidential election is **irrational** unless you include the "social cost" of not voting (shame/duty) as a tangible penalty. It rules out Response 2 entirely.
      *   If the theory allows **Evidential Control** (your view), then voting is **rational** in presidential elections, but the theory opens itself to accusations of magical thinking and struggles to explain why we don't vote in *every* contest to signal virtue.
  *   **The Ruling:** Any theory that does not explicitly define whether rationality requires *causing* an outcome or merely *participating in a pattern* will fail to resolve the argument. Your brother assumes rationality requires causation. You are intuitively reaching for a theory where rationality includes correlation and expression. The argument will continue in circles until you agree on whether a rational agent is a **cause** or a **signal**.
