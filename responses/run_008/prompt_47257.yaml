      *   *Chain of Informants:* Highlights the social network aspect.
      *   *Extended Mind/Extended Cognition:* Testimony as part of the cognitive system (Barnes, Sutton).
      *   *Assurance View:* (Moran, Hinchman). Not evidence, but an invitation to trust. This bypasses the perception analogy entirely.

  6.  **Drafting the Content - Section by Section:**

