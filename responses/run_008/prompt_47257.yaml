  2.  **Deconstruct the Core Analogy (Testimony ~ Perception):**
      *   *Proponent:* Typically associated with C.A.J. Coady and Tyler Burge (Acceptance Principle), sometimes Reid.
      *   *The Move:* Perception provides immediate justification without prior inductive verification of reliability. Testimony should too.
      *   *Mapping:*
          *   Perceptual Experience $\rightarrow$ Speaker's Assertion (or the hearer's understanding of it).
          *   World State $\rightarrow$ Fact reported.
          *   Sensory Reliability $\rightarrow$ Speaker Competence/Sincerity.
          *   Cognitive Module (Vision) $\rightarrow$ Cognitive Module (Language/Trust).
      *   *The Reductionist Counter:* Vision is biologically hardwired and generally reliable. Speakers are agents who can lie, be mistaken, or be incompetent. The "mechanism" isn't uniform.

  3.  **Evaluate Disanalogies (Signal vs. Noise):**
      *   *Noise:* Physical differences (eyes vs. ears/words). Not philosophically crucial.
      *   *Signal (Crucial):*
          *   *Agency:* Speakers have intentions (deception possible). Objects of perception don't "lie."
          *   *Uniformity:* Vision works roughly the same for everyone. Testimony quality varies wildly.
          *   *Access:* We can check perception against other senses. Checking testimony often requires *more* testimony.
      *   *Impact on Conclusion:* Does the agency problem kill default entitlement? Anti-reductionists say no (we have a presumptive right unless defeated). Reductionists say yes (we need positive reasons).

  4.  **Assess the Survival of Anti-Reductionism:**
      *   Does the view *need* the analogy?
      *   Burge's "Acceptance Principle" relies on a rationalist norm (presumption of intelligibility/truth), not just a naturalistic analogy to vision.
      *   Reid relies on innate principles (Credulity/Veracity).
      *   So, the analogy is illustrative, but the *argument* often rests on normative principles or the impossibility of global skepticism (Coady's point: we can't check track records without using testimony).
      *   *Verdict:* The analogy is vulnerable, but the position might survive on other grounds (transcendental arguments, normative principles).

