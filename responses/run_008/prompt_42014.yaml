prompt: |-
  so I'm in a second-year course on rational choice / decision theory, and we've just hit the unit on rationality and time, which has basically turned my seminar into a shouting match. The case everyone keeps coming back to is Parfit's hitchhiker: you're stranded in the middle of nowhere, a driver will only take you to town if she predicts you'll pay her on arrival, the prediction is near-perfect, and by the time you're standing at the ATM the ride has already happened — so paying is causally pointless, the money is pure sunk cost. Keep the money and you're rational at the node but never got the lift; be disposed to pay and you got the lift but then you do the "irrational" thing. Half my seminar says "so paying is rational, full stop," the other half says "no, it's rational to *be the kind of person* who irrationally pays, which is a different claim," and I honestly don't think either group is answering the right question.

  Before I go back into that seminar I want the spec, not the verdicts. Write me the desiderata: the list of things a theory of rational action/agency has to deliver in this neighborhood. I want the cases it must get right (the basic hitchhiker, the variant where the driver can still see you at the ATM so your choice is being watched, the variant where you could have left your wallet with a friend beforehand but didn't, the variant where the predictor is only 80% accurate, and also the boring cases where refusing to honour sunk costs really is just irrationality, not cleverness), the distinctions it can't collapse (rationality of the act vs of the disposition vs of the agent, the ex ante value of being a certain kind of person vs the ex post value of what you do at the node, one-shot vs repeated settings), and the constraints from ordinary decision theory it has to stay consistent with (dominance, not being exploitable, your choices tracking your own beliefs about what you'll choose). For each requirement, give the case or the consideration behind it, and mark which you think are non-negotiable and which are just what one camp treats as sacred. Then the part I actually most want: tell me if some subset of the requirements is jointly unsatisfiable — my tutor keeps dropping hints that the list itself is the lesson here, like maybe "never choose a dominated act" and "rational agents must be able to profit from their own predictability" can't both hold without precommitment, and precommitment isn't always available.

  After that, briefly, run causal decision theory (with whatever precommitment story it tells), evidential decision theory, and a resolute-choice type view — where you stick at the node with the plan you endorsed earlier even though sticking looks bad from that moment's perspective — against the list. But keep that part short, like a few sentences each, the criteria are where I want the thinking. And if you think some of the demands people make in this debate (e.g. "rationality must be forward-looking, full stop") are camp shibboleths rather than genuine desiderata, say so and say why. No reading lists or citations btw, I can't look anything up right now, just the argument.
