          *   Basic Hitchhiker (Prediction perfect, payment after arrival).
          *   Observed Payment (Driver watches at ATM).
          *   Precommitment Available (Wallet with friend).
          *   Imperfect Prediction (80% accurate).
          *   Standard Sunk Cost (Throwing good money after bad).
      *   *Distinctions:*
