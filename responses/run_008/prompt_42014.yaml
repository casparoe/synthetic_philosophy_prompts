answer: |-
  This is the right instinct. The shouting match is happening because everyone is arguing over verdicts without agreeing on the job description of a theory of rationality. Your tutor is hinting at an impossibility result: you cannot satisfy all the intuitive constraints of rational agency simultaneously in dynamic settings with prediction.

  Here is the spec.

  ### I. The Desiderata (The Spec)

  A theory of rational agency needs to handle the following cases, distinctions, and constraints. I have marked which are generally treated as **Non-Negotiable (NN)** and which are **Contested (C)** (i.e., one camp treats them as sacred, the other as expendable).

  **A. The Cases**
  1.  **Basic Hitchhiker:** Prediction is perfect; payment is causally inert (ride already happened).
      *   *Requirement:* The theory must explain why you get the ride or admit you don't. It must account for the value of the disposition. **(NN: Must account for the outcome disparity)**
  2.  **Observed ATM:** Driver watches you pay (or can punish you if you don't).
      *   *Requirement:* The theory must distinguish this from Basic Hitchhiker. Here, paying *causes* a future benefit (safety/reputation). A theory that treats this the same as Basic Hitchhiker fails. **(NN)**
  3.  **The Missed Precommitment:** You could have left your wallet with a friend (forcing payment) but didn't. Now you are at the ATM.
      *   *Requirement:* The theory must handle regret. Is it rational to wish you were bound when you weren't? **(NN)**
  4.  **Imperfect Prediction (80%):** Driver is fallible.
      *   *Requirement:* The theory must handle probability. Does the rationality of paying scale down with accuracy? **(NN)**
  5.  **Standard Sunk Cost:** You bought a non-refundable ticket to a bad movie.
      *   *Requirement:* The theory must prescribe leaving. Paying here is irrational. A theory that says "pay in Hitchhiker" must explain why this isn't the same logic. **(NN)**

  **B. The Distinctions**
  6.  **Act vs. Disposition vs. Agent:**
      *   *Requirement:* The theory must specify what the primary bearer of rationality is. Is it the single choice at the ATM? The policy adopted earlier? The whole person? **(C: This is the main fault line)**
  7.  **Ex Ante vs. Ex Post:**
      *   *Requirement:* The theory must state whether a choice can be rational at $t_1$ (before ride) but irrational at $t_2$ (at ATM), or if rationality is time-neutral. **(C)**
  8.  **One-Shot vs. Repeated:**
      *   *Requirement:* The theory should not flip verdicts arbitrarily between a single Hitchhiker case and a repeated version (where reputation matters), unless it explicitly models the reputation mechanism. **(NN)**

  **C. The Constraints**
  9.  **Dominance:** If Act A yields a better outcome than Act B in every possible state of the world *at the moment of choice*, do not choose B.
      *   *Requirement:* In Basic Hitchhiker, at the ATM, "Keep Money" dominates "Pay" (ride is fixed). **(C: CDT holds this NN; others sacrifice it)**
  10. **Non-Exploitability:** You should not be vulnerable to a "money pump" (a cycle of choices that leaves you poorer with no benefit).
      *   *Requirement:* If your preferences shift over time without new information, you can be pumped. **(NN)**
  11. **Belief-Choice Consistency:** You cannot rationally choose to do X while believing you will do Y.
      *   *Requirement:* Your prediction of your own action must align with your choice. **(NN)**

  ---

  ### II. The Impossibility Result (The Tutor's Hint)

  Your tutor is likely pointing toward the conflict between **Dynamic Consistency (Separability)** and **Ex Ante Optimality**.

  Here is the trilemma. You cannot hold all three of the following simultaneously:

  1.  **Separability (Node Rationality):** At any decision node, you should choose the act that maximizes utility *from that node forward*, treating the past as fixed. (This implies following Dominance at the ATM).
  2.  **Ex Ante Optimality:** A rational agent should be able to secure the best available overall outcome (getting the ride).
  3.  **No Precommitment Technology:** You cannot physically bind your future self (like leaving the wallet); you only have mental resolve.

  **Why they clash:**
  In Basic Hitchhiker, if you accept **Separability**, you reason at the ATM: "The ride is sunk. Paying costs \$100, keeping costs \$0. I keep." Because the driver predicts this, you never get the ride. You fail **Ex Ante Optimality**.
  To get the ride (**Ex Ante Optimality**) without physical precommitment, you must violate **Separability**. You must pay at the ATM *even though* keeping the money is better from the ATM's perspective. You have to treat your current choice as if it influences the past prediction (or as if you are bound by your past plan).

  **The Verdict:**
  *   If you keep **Separability** (CDT), you admit rational agents lose out to irrational ones in prediction cases.
  *   If you keep **Ex Ante Optimality** (EDT/Resolute), you admit rational agents sometimes choose dominated acts at the node.

  This is the lesson: **Rationality as local maximization is incompatible with rationality as global success in Newcomb-like problems.**

  ---

  ### III. Theory Scorecard

  **Causal Decision Theory (CDT)**
  *   **Stance:** Rationality is about the causal consequences of the *act* at the node.
  *   **Performance:** Satisfies Dominance and Separability perfectly. Fails Basic Hitchhiker (doesn't pay, doesn't get ride).
  *   **Precommitment Story:** CDT says you *should* have precommitted. If you didn't, too bad. It treats the failure to precommit as the error, not the failure to pay at the ATM.
  *   **Weakness:** It makes rationality "expensive." It admits that being a CDT-agent is worse than being an EDT-agent in a world with predictors.

  **Evidential Decision Theory (EDT)**
  *   **Stance:** Rationality is about choosing the act that is *good news* about the world (including the past prediction).
  *   **Performance:** Gets the ride (paying is evidence you were predicted to pay). Satisfies Ex Ante Optimality.
  *   **Weakness:** Violates Dominance. It implies your choice at the ATM *matters* to whether you got the ride, which is causally false. It struggles to distinguish Basic Hitchhiker from Standard Sunk Costs without careful framing (why is paying evidence here but not in the movie case?).

  **Resolute Choice**
  *   **Stance:** Rationality is about sticking to the plan you endorsed ex ante, even if the local node preferences change.
  *   **Performance:** Gets the ride. Satisfies Ex Ante Optimality without claiming causation backwards.
  *   **Weakness:** Violates Separability aggressively. It requires you to ignore your current preferences. It struggles with **Belief-Choice Consistency**: if you know you are resolute, why do you feel a conflict at the node? It also risks rigidity if new information actually *does* arrive at the node.

  ---

  ### IV. Shibboleth Check

  You asked about demands like "rationality must be forward-looking."

  **"Rationality is Forward-Looking"**
  *   **Verdict:** **Camp Shibboleth (CDT).**
  *   **Why:** It sounds obvious, but it begs the question. In Hitchhiker, the "forward-looking" act (keeping money) leads to a worse life. The "backward-looking" act (honoring the deal that got you here) leads to a better life. To say rationality *must* be forward-looking is just to stipulate that Dominance at the node matters more than Ex Ante success. It's not a neutral constraint; it's a definition that rules out Resolute Choice by fiat.

  **"You Can't Change the Past"**
  *   **Verdict:** **Non-Negotiable Fact, Contested Implication.**
  *   **Why:** Everyone agrees you can't causally change the past. The fight is whether rationality requires you to *act as if* your choice is independent of the past prediction. EDT says your choice is correlated with the past; CDT says you must treat it as independent. Claiming "you can't change the past" is often used to shut down EDT, but EDT isn't trying to change the past, it's trying to correlate with it.

  **"Rational Agents Win"**
  *   **Verdict:** **Camp Shibboleth (EDT/Resolute).**
  *   **Why:** This sounds NN, but CDT defenders argue that "winning" isn't the sole metric of rationality; "reasoning correctly" is. If the world punishes correct reasoning (by predicting it), that's the world's fault, not the theory's. Demanding that rationality *guarantees* success conflates epistemic rationality with pragmatic success.

  ### Summary for your Seminar
  Go in with this: The debate isn't about whether paying is "good." It's about whether the **unit of evaluation** is the *node* or the *life*.
  *   If the unit is the **node**, you keep the money, satisfy Dominance, and walk home (CDT).
  *   If the unit is the **life**, you pay, violate local Dominance, and get to town (EDT/Resolute).
  *   The "Impossibility" is that you cannot have a theory that satisfies local Dominance *and* guarantees global success *without* external precommitment mechanisms.

  The shouting stops when people admit they are optimizing for different variables.
