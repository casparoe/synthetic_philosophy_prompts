          *   Non-exploitability (no money pumps).
          *   Belief-Choice Consistency (knowing what you'll do).

  3.  **Evaluate "Non-Negotiable" vs. "Camp-Specific":**
      *   *Non-Negotiable:* Consistency, avoiding exploitation (usually), handling standard sunk costs correctly (don't pay for nothing).
      *   *Camp-Specific:* "Rationality is solely about the act at the node" (CDT camp) vs. "Rationality is about the whole life/diachronic plan" (Resolute/EDT camp). The definition of "rational act" is the battleground.

  4.  **Identify the Tension/Impossibility Theorem:**
      *   The core conflict is between *Dynamic Consistency* (at every node, choose the best option *then*) and *Strategic Rationality* (get the best outcome overall).
      *   In Hitchhiker, if you maximize *at the node* (ex post), you don't pay. If you don't pay, you don't get the ride (ex ante failure).
      *   If you maximize *ex ante*, you must pay. But paying violates dominance at the node (money gone, ride already had).
      *   *The Trilemma:* You can't have (1) Unrestricted Dominance at the node, (2) Ex Ante Optimality, and (3) No Precommitment Technology.
      *   This is likely the tutor's hint.

  5.  **Drafting the Evaluations (CDT, EDT, Resolute):**
      *   *CDT:* Saves dominance at the node. Fails Hitchhiker (doesn't pay, doesn't get ride). Needs precommitment to win.
      *   *EDT:* Gets the ride (paying is evidence of being the type). Violates dominance/causality intuition (paying doesn't *cause* the ride).
      *   *Resolute Choice:* Gets the ride. Violates "separability" (ignoring current preferences).

  6.  **Critiquing Shibboleths:**
      *   "Forward-looking": Often means "ignore the past." But in Hitchhiker, the past (prediction) matters.
