  Your friend is most likely operating under the **Metaphysical Constitution** reading (Horn 2), infused with the moral intuition that value must be independent to be real. He assumes that if the algorithm *makes* the video good by promoting it, "goodness" becomes arbitrary and meaningless. However, this argument falls because recommender systems do not claim moral authority; they claim functional optimization. In this context, "good" is often defined *constitutively* by engagement metrics (watch time, clicks). If the system promotes it, it is, by the system's own definition, "good" content. The dilemma dissolves because Horn 2 is not a bug here; it is the feature specification.

  Regarding your second question, the "Divine Nature" escape does generalize, and it reveals the falsity of your friend's dichotomy. In theology, God commands *because* He is good (His nature constrains His will). In algorithms, the system promotes *because* it is optimized for specific user-satisfaction functions (its code constrains its output). This is not merely Horn 1 in disguise; it is a third option where the authority's internal nature aligns with the external standard of value. For the algorithm, the "nature" is the objective function; for God, it is moral perfection.

  Consequently, your friend's argument fails because it treats a functional definition as a metaphysical mystery. He wants to say that because the algorithm influences what we see, we cannot call the content "good." But if "good" means "successfully engages the audience," the algorithm is the measure, not the creator, of that success. The Euthyphro Dilemma is a targeted scalpel for moral ontology, specifically designed to probe the relationship between a *sovereign* will and *objective* morality. Wielding it against a feedback loop is a category error that ignores the constitutive rules of the system being criticized.
