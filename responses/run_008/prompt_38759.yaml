answer: |-
  It is a pleasure to engage with a fellow traveler on this road, especially one who brings the disciplined eye of a physical chemist to these philosophical questions. Your intuition that Kuhn and Hacking are describing different kinds of instability is quite sharp, and I think you are right to resist the temptation to simply collapse Hacking into a sociological version of Kuhn. While both deal with change in scientific classification, the mechanism and the locus of that change are fundamentally distinct. If I must choose a single framework to describe the ongoing revision of DSM categories like autism and ADHD, along with the accompanying shifts in prevalence and public awareness, I would argue firmly that this is a Hackingian looping effect rather than a Kuhnian paradigm shift.

  To see why, we need to look closely at where the instability originates in each model. In Kuhn's picture, the engine of change is internal to the scientific community. Normal science proceeds until anomalies accumulate that the current paradigm cannot resolve, leading to a crisis and eventually a revolution where the scientists themselves adopt a new worldview. Crucially, the object of study does not change its behavior because of the classification; the electron does not care if we call it a particle or a wave, and it does not alter its trajectory because we have published a new paper about it. The incommensurability Kuhn describes is between the old and new communities of scientists, who literally talk past each other because their standards and meanings have shifted. In the case of the DSM, however, the revisions from DSM-IV to DSM-5, for instance, do not represent this kind of deep incommensurability. Clinicians using the old criteria can still communicate with those using the new ones; they are arguing over boundaries and thresholds, not operating in entirely different universes of discourse. The goal remains constant, which is to classify and treat, and the changes are iterative adjustments rather than a wholesale overthrow of the conceptual framework.

  The situation changes drastically when we consider the object of study itself. In psychiatry, the objects are people, and people are what Hacking calls interactive kinds. Unlike the indifferent kinds you spent your career studying, such as atoms or molecules, human beings react to the knowledge produced about them. When a category like ADHD is introduced and refined, it does not merely describe a static population; it creates a niche that people can inhabit. Parents read about the criteria and recognize behaviors in their children that they previously ignored or interpreted differently. Teachers learn to spot the signs and refer students for evaluation. The diagnosed individuals themselves may adopt the label as part of their identity, altering their self-understanding and perhaps even their behavior to align with or resist the expectation of the diagnosis. This feedback loop changes the extension of the category, meaning the population of people who fit the diagnosis grows or shifts not necessarily because the underlying biology has changed, but because the interaction between the classification and the classified has evolved.

  This dynamic fits the DSM revision process you described perfectly. The criteria are revised, which leads to better spotting and earlier identification, which expands the diagnosed population, which then pressures the next revision to account for this larger, more visible group. This is not a revolution where the old theory is discarded as false; it is a continuous feedback process where the classification and the classified co-evolve. If this were a Kuhnian shift, we would expect to see the old categories become obsolete and unusable, treated as errors of a past age. Instead, we see a gradual widening and narrowing of criteria that responds to the social and clinical reality created by the previous criteria. The instability is not in the scientists' inability to solve puzzles within a framework, but in the framework's inability to remain static because the ground beneath it—the human behavior it attempts to capture—is moving in response to the framework itself.

  I should concede that one could make a Kuhnian case for the shift from DSM-II to DSM-III, which moved psychiatry from a psychoanalytic framework to a descriptive, criteria-based one. That was a genuine revolution in how psychiatrists viewed their task and their patients, and there was significant incommensurability between the old guard and the new. However, the process you are asking about—the decadal revisions and the swelling prevalence of categories like autism—is not that kind of event. It is the steady operation of the looping effect. To call it a Kuhnian paradigm change would be to misunderstand the source of the tension. The tension does not arise because the data no longer fits the theory in a way that breaks the scientific community; it arises because the theory changes the data.

  So, while it is tempting to see any major change in scientific taxonomy as a mini-revolution, the specific mechanics of psychiatric classification are better understood through Hacking's lens. The DSM changes are not merely corrections of error but adjustments to a moving target that moves because it is being measured. Your background in spectroscopy might offer a useful analogy here: imagine if the spectral lines of an element shifted slightly every time you published a paper identifying them, because the atoms decided to rearrange themselves based on your publication. That is not a crisis of measurement requiring a new paradigm of physics; it is a fundamental feature of the interaction between the observer and the observed. In the human sciences, the observer and the observed are entangled in a way that makes the looping effect the primary driver of change. Therefore, the evolving landscape of autism and ADHD diagnosis is best described as a Hackingian loop, a continuous reshaping from the inside rather than a abrupt replacement from the outside.
