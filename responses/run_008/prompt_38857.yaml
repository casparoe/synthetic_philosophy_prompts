prompt: |-
  My flatmate and I have been going round about Nuremberg for weeks and she just produced an argument I can't get out of, except I'm sure it can't be right because it proves way too much. Here it is, roughly as she states it:

  (1) A criminal tribunal is legitimate only if the rules it uses to condemn the accused would, in principle, also condemn the accusers, had the accusers done the same things.
  (2) At Nuremberg and Tokyo, the accusers had done the same kinds of things: the British and Americans had firebombed cities full of civilians, the Soviet judge sat on the bench having invaded Poland and fought an undeclared war on Finland, and the Soviets had massacred some twenty thousand Polish officers in the Katyn forest and then spent the Nuremberg proceedings trying to pin that one on the Germans.
  (3) The tribunals never applied their rules to the accusers -- not a single Allied or Soviet act was even charged.
  (4) So the tribunals failed the condition in (1) and were illegitimate.
  (5) But every criminal court in history fails that same condition: domestic courts try the state's subjects and never the state itself, and every postwar court tries only the vanquished.
  (6) So no criminal court has ever been legitimate.
  (7) So Nuremberg and Tokyo weren't specially tainted -- a trial run by the winners is just what a trial is.

  The kicker is she actually likes (7). She's a bit of a legal realist and says tribunals have always been politics in robes, and Nuremberg at least used good rules even if enforcement was selective, which she thinks is the best you can ask for. I don't want to bite that bullet, but I also think the victors' justice complaint against these tribunals is basically right -- the one-side-of-the-dock thing isn't a cosmetic defect. So either I give up the complaint or I concede that no court anywhere was ever legitimate, and I don't like either.

  Where does the argument go wrong, if it does? My instinct is that something slips between (1) and (5) -- maybe "in principle" is doing different work in the two premises -- but I can't pin it down. I'd also like to know whether the retroactivity complaint (crimes against peace being, arguably, invented after the fact, Kellogg-Briand notwithstanding) is a separate problem or whether it can be folded into her symmetry argument, and whether folding it in makes her case stronger or actually worse. And when you answer, can you keep straight for me what's actually settled here -- the historical stuff about what was charged, Justice Pal's dissent at Tokyo, what happened with Katyn -- versus what's genuinely contested among people who study this? I don't want to come back at her waving some contested realist take as if it were the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **The Core Issue:** The user's flatmate has constructed a logical argument claiming the Nuremberg and Tokyo tribunals were illegitimate due to "victor's justice" (hypocrisy/selective enforcement), but this argument generalizes to *all* criminal courts, implying *no* court is ever legitimate. The flatmate accepts this conclusion (legal realism), but the user does not.
      *   **The User's Goal:** Find the flaw in the argument (specifically between premises 1 and 5) to reject the "no court is legitimate" conclusion while maintaining the critique that Nuremberg/Tokyo had specific legitimacy deficits compared to domestic courts.
      *   **Specific Questions:**
          *   Where does the argument go wrong?
          *   Is the retroactivity complaint separate or foldable into the symmetry argument?
          *   Distinguish between settled historical facts (Katyn, charges, Justice Pal) and contested scholarly interpretations.
      *   **Constraint:** Keep straight what is settled history vs. contested theory. Don't present contested realist takes as consensus.

  2.  **Deconstruct the Flatmate's Argument:**
      *   (1) Legitimacy Condition: Symmetry of law (Accusers must be subject to the same rules).
      *   (2) Historical Fact: Allies committed similar acts (firebombing, Katyn, invasions).
      *   (3) Historical Fact: Allies were not charged.
      *   (4) Intermediate Conclusion: Nuremberg/Tokyo failed (1).
      *   (5) Generalization: *All* courts fail (1) (Domestic courts don't try the state; postwar courts only try vanquished).
      *   (6) Radical Conclusion: No court is legitimate.
      *   (7) Final Conclusion: Nuremberg isn't special; "victor's justice" is just "justice."

  3.  **Identify the Flaw (The "Slip" between 1 and 5):**
      *   The key is the definition of "Accuser" and the nature of the legal order.
      *   *Domestic Courts:* The "accuser" is the State (represented by the Crown/People), but the State is *constituted* by the law. The law stands above both the individual defendant and the specific prosecutors. There is a mechanism (elections, constitutional review, civil suits) to hold the state accountable, just not *in the same criminal trial*.
      *   *International Tribunals (Nuremberg):* There is no sovereign "State" above the Allies. The Allies *are* the sovereign power at that moment. There is no higher legal order to which they are subject.
      *   *The Distinction:* In domestic law, the asymmetry is institutional/functional (State vs. Citizen), but theoretically under a shared rule of law. In Nuremberg, the asymmetry was existential (Winner vs. Loser) with no shared sovereign framework.
      *   *Premise 1 Critique:* Premise 1 is too strong for *any* court. A better principle is "Equality before the law," not "Identity of the accuser and accused."
      *   *Premise 5 Critique:* It equates "State vs. Citizen" with "Victor vs. Vanquished." These are structurally different relationships.

  4.  **Address the Retroactivity Question:**
      *   Crimes Against Peace (waging aggressive war) were arguably new law (*ex post facto*).
      *   Is it separate? Yes. Symmetry is about *who* is tried. Retroactivity is about *what* law is applied.
      *   Does folding it in help? It strengthens the critique of Nuremberg specifically, but doesn't necessarily prove "no court is legitimate" (since domestic courts usually prohibit *ex post facto* laws). So keeping them separate is analytically cleaner.

  5.  **Address Historical Facts vs. Contested Interpretations:**
      *   *Settled:* Firebombing (Dresden, Tokyo) happened. Katyn happened (USSR blamed Germany at Nuremberg, later admitted). No Allied leaders were charged. Justice Pal dissented at Tokyo (argued for acquittal based on *ex post facto* and victor's justice).
      *   *Contested:* Whether firebombing constituted a *war crime* under laws *at the time* (laws on aerial bombing were murky). Whether Nuremberg's legacy outweighs its procedural flaws. Whether "victor's justice" invalidates the verdicts or just taints the process.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the flatmate's argument (it's a classic legal realist position) but validate the user's instinct that it conflates distinct categories.
      *   *Section 1: The Logical Slip (Premises 1 & 5).* Focus on the distinction between *sovereign immunity within a legal order* vs. *absence of a legal order*.
          *   Domestic courts: The State is immune *in that specific forum* but subject to the Constitution/Political process. The law is impersonal.
          *   Nuremberg: The "Accusers" were the *source* of the law, not subjects of it.
          *   Refine Premise 1: It should be about *predictability* and *impartiality*, not strict symmetry of conduct.
      *   *Section 2: The Retroactivity Issue.* Keep it separate. It's a Rule of Law issue (nullum crimen sine lege), not a symmetry issue. It makes Nuremberg *worse* than domestic courts, not the same.
      *   *Section 3: Historical Settlement vs. Scholarly Debate.*
          *   *Settled:* Katyn (Soviets did it), Firebombing (Allies did it), No Allied charges, Pal's dissent.
          *   *Contested:* Legal status of aerial bombing in 1945, whether the tribunals established valid customary law, whether the "victor's justice" critique invalidates the moral findings.
      *   *Section 4: How to Counter the Flatmate.* Offer a middle ground. Nuremberg was *politically* necessary but *legally* imperfect. It was a "transitional" justice mechanism, not a standard criminal court. This avoids the "no court is legitimate" bullet.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "International law is different." I need to explain *why* that difference matters for legitimacy.
      *   *Point:* Domestic courts derive legitimacy from the consent of the governed (democracy). Nuremberg derived legitimacy from the defeat of a genocidal regime (substantive justice).
      *   *Point:* The flatmate's Premise 1 is a "Tu Quoque" defense. In law, "you did it too" is generally not a defense for murder. The flatmate is applying a political standard to a legal claim.
      *   *Crucial Distinction:* The difference between *jurisdiction* (who can be tried) and *legitimacy* (why we accept the verdict).
      *   *Settled History:* Make sure to mention the London Charter.
      *   *Contested:* The moral weight of the Holocaust vs. the procedural flaws.

  8.  **Final Polish:** Check tone. Ensure it's respectful to the flatmate's realism but firm on the logical distinctions. Ensure the "Settled vs. Contested" section is clear. (The user specifically asked for this).

      *(Self-Correction on Katyn)*: At Nuremberg, the Soviets *did* charge the Germans with Katyn. It was in the indictment. However, during the trial, evidence pointed to the Soviets. The charge was eventually dropped/ignored in the final judgment. I need to be precise there.

      *(Self-Correction on Firebombing)*: Was it a war crime *then*? International law on aerial bombing was undeveloped. This is a key contested point.

      *(Self-Correction on Premise 5)*: Domestic courts *do* sometimes try state officials (corruption, abuse of power). They don't try the "State" as an abstract entity, but they try its agents. Nuremberg tried individuals, not the "Allied State." So the analogy holds up poorly.

  9.  **Final Structure:**
      1.  Diagnosis of the Logical Slip (The Category Error).
      2.  The Retroactivity Question (Separate and Distinct).
      3.  Settled History vs. Contested Interpretation (The "Fact Check").
      4.  A Way Out (Transitional Justice vs. Criminal Law).

  10. (Review against constraints): Did I answer where it goes wrong? Yes. Retroactivity? Yes. Settled vs. Contested? Yes. Tone? Academic but accessible.

      *Let's write.*
answer: |-
  This is a sophisticated argument that touches on one of the oldest debates in international law: the tension between **legal positivism** (law is what the sovereign commands) and **natural law** (law must meet certain moral standards to be valid), filtered through **legal realism** (law is just politics).

  Your instinct is correct: the argument slips between premises (1) and (5). Your flatmate is conflating **structural asymmetry** (which exists in all courts) with **existential asymmetry** (which was specific to Nuremberg).

  Here is a breakdown of where the argument fails, how to handle the retroactivity issue, and a guide to what is historically settled versus what is still debated among scholars.

  ### 1. Where the Argument Goes Wrong: The Category Error

  The flaw lies in Premise (5): *"Every criminal court in history fails that same condition."*

  This premise equates **Domestic Criminal Courts** with **International Military Tribunals**. While both involve asymmetry, they are asymmetries of fundamentally different kinds.

  **A. The Nature of the "Accuser"**
  *   **Domestic Courts:** In a domestic trial, the accuser is the State (e.g., *The People v. Smith*). It is true the State is not usually in the dock. However, the State is **constituted by the law**. The prosecutor, the judge, and the defendant are all subject to the same Constitution and statutory code. If the prosecutor breaks the law, there are mechanisms to punish them (bar associations, internal affairs, civil suits, elections). The asymmetry is *functional* (one side represents the public), but the *legal subjection* is shared.
  *   **Nuremberg:** The accusers (US, UK, USSR, France) were **sovereign powers** occupying a defeated territory. There was no higher Constitution to which they were subject. They were not just enforcing the law; in a very real sense, they *were* the law at that moment (via the London Charter). There was no mechanism to charge an American general for firebombing because there was no sovereign above the United States to issue the charge.

  **B. The "Tu Quoque" Principle**
  Premise (1) relies on a *tu quoque* ("you also") standard of legitimacy. In almost every domestic legal system, *tu quoque* is explicitly **not** a valid defense. If a murderer argues, "The police have killed people too," the court replies, "That may be true, but you are on trial for your acts, not theirs."
  *   **The Slip:** Your flatmate treats *tu quoque* as a condition for the **court's legitimacy** rather than the **defendant's guilt**.
  *   **The Counter:** A court remains legitimate if it applies neutral rules to the defendant, even if it fails to prosecute others. Nuremberg becomes illegitimate *only if* the rules themselves were fabricated solely to trap the defendant (which touches on retroactivity, see below).

  **C. The Conclusion (6) and (7)**
  If you accept (5), you must accept (6): "No criminal court has ever been legitimate." This is the "bullet" your flatmate is willing to bite (Legal Realism), but most legal philosophers reject.
  *   **The Fix:** You can reject (5) without rejecting the critique of Nuremberg. You can argue that domestic courts have **procedural legitimacy** (independent judiciary, appeal processes, legislative oversight) that Nuremberg lacked. Nuremberg was a **political act** dressed in legal robes. That makes it *different* from a domestic court, not the *same*.

  **Summary of the Flaw:** The argument fails because it treats "Victor's Justice" (no higher sovereign to check the accuser) as identical to "State Justice" (the state prosecutes citizens within a constitutional order). They are not the same. Nuremberg lacked the *institutional checks* that make domestic asymmetry tolerable.

  ### 2. The Retroactivity Complaint: Separate or Folded?

  You asked whether the retroactivity complaint (*nullum crimen sine lege* — no crime without law) is separate from the symmetry argument.

  **It is analytically distinct, and keeping them separate strengthens your position.**

  *   **Symmetry (Victor's Justice):** This asks, "Why only them?" It is a claim about **selective enforcement**.
  *   **Retroactivity:** This asks, "Was this actually a crime when they did it?" It is a claim about **substantive law**.

  **Why separating them helps you:**
  If you fold them together, your flatmate can argue: "Well, if all law is retroactive politics, it doesn't matter."
  If you keep them separate, you can concede that selective enforcement happens (symmetry), but argue that **retroactivity is a unique violation of the Rule of Law.**

  *   **Domestic Courts:** Generally prohibited from passing *ex post facto* laws. If a parliament creates a new crime today, they cannot arrest you for doing it yesterday. This is a settled constraint on domestic legitimacy.
  *   **Nuremberg:** "Crimes Against Peace" (waging aggressive war) were arguably created by the London Charter in 1945 for acts committed starting in 1939. While the Kellogg-Briand Pact (1928) outlawed war, it did not define it as a *criminal* offense punishable by death for individuals.

  **Verdict:** The retroactivity complaint makes Nuremberg **worse** than a standard domestic court, not the same. It undermines the claim that Nuremberg was a "normal" trial. It supports your view that Nuremberg was a unique, hybrid political-legal event, rather than supporting her view that "all trials are like this."

  ### 3. Settled History vs. Contested Interpretation

  Your flatmate mixes historical facts with legal interpretations. Here is how to disentangle them so you don't wave a contested theory as fact.

  #### A. What is Historically Settled (The Facts)
  *   **Firebombing:** It is settled that the British (RAF) and Americans (USAAF) conducted area bombing of civilian centers (e.g., Dresden, Tokyo) causing massive civilian casualties.
  *   **Katyn:** It is settled that the Soviet NKVD executed approximately 22,000 Polish officers in 1940. At Nuremberg, the Soviet prosecution *did* include Katyn in the indictment against the Germans. During the proceedings, evidence mounted against the USSR. The charge was quietly dropped in the final judgment, and the USSR officially admitted guilt only in 1990.
  *   **No Allied Charges:** It is settled that no Allied personnel were charged with war crimes at Nuremberg or Tokyo, despite documented violations (e.g., the Commando Order was prosecuted only for Germans; the similar Allied "Commando" executions were not).
  *   **Justice Pal:** It is settled that Justice Radhabinod Pal (India) dissented at the Tokyo Tribunal. He argued that the tribunal was victor's justice, that *ex post facto* laws were invalid, and he voted to acquit all defendants. His opinion is a matter of public record.
  *   **The Charter:** It is settled that the laws applied were defined in the London Charter (Nuremberg) and the Charter of the IMTFE (Tokyo), drafted by the victorious powers.

  #### B. What is Contested (The Interpretations)
  *   **Legal Status of Aerial Bombing:**
      *   *Flatmate's Claim:* Firebombing was a war crime equivalent to the Holocaust or German V-2 attacks.
      *   *Scholarly Debate:* In 1945, international law regarding aerial warfare was murky. The Hague Conventions did not explicitly ban aerial bombing of cities, and many nations (including the US) had resisted such bans. Some scholars argue the Allies broke *moral* norms, but not established *positive law*. Others argue customary law prohibited targeting civilians regardless of specific treaties. **This is not settled.**
  *   **The Validity of "Crimes Against Peace":**
      *   *Flatmate's Claim:* This was pure invention to criminalize losing the war.
      *   *Scholarly Debate:* Many legal historians argue that while individual criminal liability was new, the *illegality* of aggressive war was established by the Kellogg-Briand Pact. The debate is whether "illegality" translates to "individual criminal liability." **This is contested.**
  *   **The Legacy of Nuremberg:**
      *   *Flatmate's Claim:* It was just politics; the law was a sham.
      *   *Scholarly Debate:* Many international lawyers argue that despite the flaws, Nuremberg created the foundation for modern International Criminal Law (ICC, Geneva Conventions). They argue the "Nuremberg Principles" achieved a normative breakthrough that outweighs the procedural hypocrisy. **This is a normative judgment, not a fact.**
  *   **Justice Pal's Motivation:**
      *   *Flatmate's Claim:* Pal was a legal purist exposing hypocrisy.
      *   *Scholarly Debate:* While Pal's legal reasoning is respected, some historians note his dissent aligned with Japanese nationalist narratives (he was later honored in Japan). Some scholars suggest his view on *ex post facto* law was stricter than the consensus even then. **His legal standing is high, but his historical context is debated.**

  ### 4. How to Reply to Your Flatmate

  You don't need to concede that Nuremberg was perfect, nor do you need to accept that *no* court is legitimate. You can take the middle ground: **Transitional Justice.**

  Here is the argument you can offer her:

  1.  **Accept the Realist Premise, Reject the Conclusion:** "You are right that Nuremberg was political. It was not a normal criminal trial; it was an act of **Transitional Justice**. It happened in a state of exception (post-war occupation) where normal Rule of Law constraints (like a neutral sovereign) didn't exist."
  2.  **Distinguish Legitimacy Sources:** "Domestic courts derive legitimacy from **procedure** (due process, symmetry). Nuremberg derived legitimacy from **substance** (stopping genocide, ending aggressive war). You cannot judge Nuremberg by domestic standards, nor can you judge domestic courts by Nuremberg standards."
  3.  **The "Better than Nothing" Defense:** "If we say Nuremberg was illegitimate because the winners didn't try themselves, the logical alternative isn't 'everyone gets tried' (which was impossible), it's 'no one gets tried.' In 1945, the choice was between Victor's Justice and No Justice. The world chose the former to establish a historical record of the Holocaust and Aggression."
  4.  **The Logical Check:** "Your argument proves too much. If 'asymmetry of power' invalidates a court, then a police officer arresting a citizen is illegitimate because the citizen can't arrest the officer. Legitimacy comes from **constraints on power**, not **identity of power**. Domestic courts have constraints (appeals, constitutions). Nuremberg had fewer constraints. That makes Nuremberg *more* vulnerable to critique than domestic courts, not the *same* as them."

  **In short:** Your flatmate is correct that Nuremberg was "Victor's Justice." She is incorrect that this makes it identical to a domestic court, and she is incorrect that this renders *all* justice impossible. Nuremberg was a unique historical mechanism that sacrificed procedural purity for substantive accountability. Acknowledging that flaw doesn't require burning down the concept of law itself.
