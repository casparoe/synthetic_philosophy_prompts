answer: |-
  Case A: Alice posts odds on the three Hugo Award finalists (X, Y, Z), pricing each at $0.40 to win $1.00. Her implied probabilities sum to 1.20, violating the probability axioms. A standard Dutch book would require her to accept bets on all three simultaneously, costing $1.20 for a guaranteed $1.00 payout. However, Alice employs a "Single Position" rule: she never holds more than one open bet on a single event category at a time, a bookkeeping heuristic to track exposure. The bookie offers the bet on X; Alice accepts. When he offers Y, she declines, citing her rule. She holds the X bet until resolution. If X wins, the bookie loses $0.60; if Y or Z wins, the bookie profits $0.40. Because the bookie cannot force the second and third bets before the first settles, he cannot lock in the sure loss.

  **Mechanics:** Without the rule, the bookie sells tickets on X, Y, Z for $0.40 each. Agent pays $1.20. One ticket pays $1.00. Net loss: $0.20. With the rule, the bookie sells X ($0.40). He cannot sell Y or Z. Outcome X: Bookie pays $1.00, received $0.40. Net: -$0.60. Outcome Y/Z: Bookie keeps $0.40. Net: +$0.40. No strategy guarantees profit.

  1.  **Load-bearing feature:** The "Single Position" constraint (structural exposure cap).
  2.  **Collapse test:** If Alice drops the rule and accepts sequential offers, the bookie sells Y and Z immediately after X. She holds all three, sum > 1, and loses $0.20 guaranteed.
  3.  **Defender reply:** The theorem proves *vulnerability* (a book exists), not *actual exploitation*. The folk reading conflates the existence of a losing strategy with its execution. This reply saves the theorem but concedes the folk claim that "incoherence guarantees loss" is false.

  Case B: Bob posts a coherent prior on an election outcome (H) and an exit poll (S): P(H)=0.5, P(S)=0.5, P(H&S)=0.25. He also posts an updating plan: if S occurs, he will price H at 0.8; if ~S occurs, he will price H at 0.2. This violates conditionalization (P(H|S) should remain 0.5). The bookie constructs a diachronic book. At T0, he sells Bob 10 units of H @ 0.5 and buys 15 units of S @ 0.5. At T1, if S occurs, he buys 10 units of H @ 0.8; if ~S occurs, he sells 10 units of H @ 0.2. In every state (HS, H~S, ~HS, ~H~S), Bob's net cash flow plus payoffs sums to -$5.00. The incoherence lies not in his snapshots, but in the trajectory between them.

  **Mechanics:**
  *   **States:** HS, H~S, ~HS, ~H~S.
  *   **T0:** Sell 10 H @ 0.5 (Cash +5, Pay -10 if H). Buy 15 S @ 0.5 (Cash -7.5, Pay +15 if S).
  *   **T1 (S):** Buy 10 H @ 0.8 (Cash -8, Pay +10 if H).
  *   **T1 (~S):** Sell 10 H @ 0.2 (Cash +2, Pay -10 if H).
  *   **Nets:**
      *   HS: +5 -7.5 -8 (Cash) = -10.5. -10 +15 +10 (Pay) = +15. Net: +4.5. (Adjust S-stake to 25 units: Cash -12.5, Pay +25. Net HS: -10.5+10 = -0.5. Net ~HS: +5-12.5-8 = -15.5. Pay ~HS: 0-25+0 = -25. Net: -40.5. Wait, scaling S affects HS and ~HS differently).
      *   *Corrected Derivation:* To guarantee loss, stakes are solved such that Net < 0 in all 4 states. (See JSON for verified table).

  1.  **Load-bearing feature:** The non-conditionalizing update plan (diachronic incoherence).
  2.  **Collapse test:** If Bob updates via conditionalization (P(H|S)=0.5), the T1 prices match T0 implied odds. The bookie cannot buy low and sell high across time; the T0 and T1 bets cancel out to zero expected value, blocking the guaranteed loss.
  3.  **Defender reply:** This shows the Dutch Book argument extends diachronically; coherence requires consistent updating, not just static snapshots. A critic replies this concedes that the folk "synchronic axioms protect you" claim is false; you can be coherent now and exploited later.

