answer: |-
  Right, let's cut through the fog. It is a splendid argument to have, and your mate is quite right to point out that the *Treatise* is more than just a historical footnote, even if the *General Theory* gets all the glory.

  You want a number, so here it is. My credence that Keynes was substantially right—that there exist genuine epistemic situations involving non-comparability and uncertainty that no standard coherent probability assignment can capture without distortion—is **0.65**.

  I am not sitting on the fence; that is a clear lean towards Keynes. However, it is not a slam dunk, because the machinery he used to explain it is creaky. Here is the decomposition of that 0.65, broken down by the constituent claims required to make his position hold water.

  ### The Decomposition

  **(a) The Logical Interpretation is Salvageable: 0.25**
  Keynes viewed probability as a logical relation between propositions, akin to entailment but partial. Most modern philosophers and statisticians have binning this specific metaphysics. Carnap tried to rescue it with *degree of confirmation* and largely ran into the wall of the "problem of induction" and the arbitrariness of choosing a logical language. Subjective Bayesianism won the day because it avoids the need for these objective logical ties. I assign this low probability because the 'logical relation' ontology looks like a category error in light of modern semantics.

  **(b) Partial Orderings are the Right Picture of Rational Belief: 0.85**
  This is the core of your mate's point. Standard Bayesianism demands a total ordering (for any A and B, you must believe one is more likely, or they are equal). But in cases of sparse evidence, forcing a comparison is often an artefact of the model, not reality. The modern theory of **Imprecise Probabilities** (credal sets, lower previsions) essentially formalises Keynes's intuition without needing his 'logical' metaphysics. It allows for intervals rather than point values. If the intervals overlap, the hypotheses are incomparable. This is mathematically robust and rationally defensible. I am quite confident here.

  **(c) The Risk/Uncertainty Distinction is Unabsorbable by Standard Bayesianism: 0.75**
  Your counter-argument is that 'uncertainty' is just 'risk' with a messy model (i.e., you need a prior on your prior). While hierarchical Bayesian models can mimic uncertainty, they often fail in cases of **structural ignorance** (unknown unknowns, or 'black swans'). When the state space itself is undefined, you cannot assign a measure, even a vague one. Keynes's 'weight of argument' suggests that as evidence accumulates, the *reliability* of the probability changes, even if the probability value stays the same. Standard Bayesianism struggles to capture this 'weight' without ad hoc adjustments. I think there is a residual category of uncertainty that standard coherence requirements gloss over.

  ### The Calculation

  I am not simply multiplying these, as they are not strictly independent. If (b) is true, Keynes is 'substantially right' about the phenomenology of probability, even if (a) is false regarding the ontology.

  *   The claim rests heavily on (b) and (c).
  *   If (b) holds (0.85), the 'non-comparability' claim is vindicated by modern imprecise probability theory, which is the direct descendant of Keynes's logic.
  *   If (c) holds (0.75), the 'uncertainty vs risk' claim stands against the reductionist Bayesian view.
  *   (a) acts as a drag on the score. If Keynes's *explanation* is wrong, is he still 'right'? I argue yes, regarding the *insight*, but it lowers the confidence that his specific *system* is the one we should use.

  So, I weight (b) and (c) at 40% each, and (a) at 20%.
  $(0.85 \times 0.4) + (0.75 \times 0.4) + (0.25 \times 0.2) = 0.34 + 0.30 + 0.05 = 0.69$.

  I am knocking that down slightly to **0.65** to account for the fact that 'Imprecise Probability' is still a niche programme compared to standard Bayesianism, and there are strong Dutch Book arguments against it that haven't been fully settled.

  ### The Weakest Link

  The term I am least confident in is **(a): The Logical Interpretation**.

  I have placed it at 0.25. It is the most vulnerable part of Keynes's architecture. The idea that there is an objective, mind-independent logical relation of 'partial entailment' between arbitrary propositions smells of Platonism that most contemporary philosophers find untenable.

  ### What Would Move It

  To shift my credence significantly upwards (towards 0.8 or 0.9), I would need to see a formal revival of **Objective Bayesianism** that solves the problem of the prior without resorting to subjectivity. Specifically:

  1.  **A Solution to the Language Relativity Problem:** Carnap failed because the logical probability changed depending on how you defined the predicates in your language. If someone produced a rigorous defence of a 'natural' logical language that fixes these relations objectively, (a) would shoot up to 0.7+, dragging the total credence with it.
  2.  **Empirical Violation of Total Ordering:** If there were a definitive behavioural or normative proof that rational agents *ought* to violate the axiom of comparability to avoid loss (rather than just for convenience), that would cement (b) and (c). Currently, the defence of imprecise probabilities is often pragmatic; a normative proof would be game-changing.

  To shift it downwards (towards 0.3), you would need a demonstration that all cases of 'non-comparability' can be reduced to **computational complexity** or **elicitation costs**. If it can be proven that for any two hypotheses, there *exists* a true precise prior, and our inability to find it is merely a lack of computing power or introspective access (your argument), then Keynes's 'uncertainty' collapses back into 'risk'. If the 'messy model' argument is proven ontologically complete, Keynes becomes a historical curiosity.

  **Verdict:** Tell your mate he wins the round on the partial ordering, but you win on the metaphysics. Keynes saw the shape of the elephant, but he thought it was made of logic when it was actually made of decision-theoretic constraints.
