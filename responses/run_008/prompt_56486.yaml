  Verdict
  The argument fails at Step (5). This step equivocates between choosing a fixed alternative credence function now and adopting an updating rule that yields different credences conditional on future evidence. Strict propriety forbids the former but not the latter.

  The slip in detail
  Strict propriety ensures your current credence $c$ expects itself to be most accurate compared to any *fixed* alternative $c'$. However, updating isn't adopting a fixed $c'$; it's adopting a policy that maps possible evidence to new credences. When you calculate the expected accuracy of an updating rule from your current standpoint, you sum the accuracy of the resulting credences weighted by your current credence in the evidence.

  Greaves and Wallace (2006) prove that conditionalization maximizes this expected value. Step (5) incorrectly assumes that because $c$ beats any fixed $c'$, it beats any *strategy* for changing $c$. But from your current lights, you expect your evidence to shift your perspective. The expected accuracy of sticking with $c$ is simply the accuracy of $c$. The expected accuracy of updating is the weighted average of the accuracies of the possible posteriors. Since proper scoring rules reward sensitivity to evidence, this average exceeds the accuracy of the static prior. The "by your own lights" metric in (3) evaluates static options, while (5) applies it to a dynamic process without adjusting the expectation to account for the probability of evidence. You know (3) holds, but you also know that if evidence $E$ arrives, your lights will change to $c_E$, and relative to $c_E$, $c_E$ is better than $c$. Crucially, from the perspective of $c$, the *expected* accuracy of the sequence of posteriors generated by conditionalization exceeds the accuracy of retaining $c$ regardless of evidence.

  Why the step looked fine
  Strictly proper scoring rules possess the feature of "immodesty": every probabilistic credence function regards itself as uniquely optimal. This creates a powerful local stability condition. Step (5) exploits this by treating the decision to update as a local choice between fixed states rather than a global choice between policies. Because propriety makes every credence function self-recommending, it tempts one to think that *any* departure is self-undermining. The plausibility comes from conflating the self-recommendation of a state with the self-recommendation of a strategy for transitioning between states.

  The prices
  Rejecting (5) costs nothing substantial; it merely requires distinguishing static evaluation from dynamic planning. Rejecting (1) or (2) would be far more expensive, abandoning accuracy-firstism or instrumental rationality. Priya is wrong that conditionalization is threatened; rather, her argument highlights why accuracy arguments for conditionalization must be framed as comparisons of *updating rules*, not comparisons of fixed credences.

  The accuracy-firster already respects this structural feature: the vindication of conditionalization relies on the prior expecting the posterior to be more accurate (in expectation) than sticking with the prior, precisely because the posterior will be tuned to the evidence. Priya's argument thus serves as a reminder that accuracy-based norms apply to the selection of epistemic policies, not just the endorsement of current states. Accuracy-first epistemology is inherently diachronic; it evaluates credences not in isolation but as parts of trajectories. Accepting this does not weaken the view but clarifies its application to learning.
