answer: |-
  The observation room is soundproofed, cooled to a constant sixty-eight degrees. On the wall, a large monitor shows a live feed from the Mars colony: a woman in a grey jumpsuit is unpacking a crate of hydroponic seeds. In the room, Dr. Ines Kovač and Prof. Tobias Reyes sit in leather chairs, coffee untouched.

  **Kovač:** She's unpacking. Look at the way she handles the crates. That's the Passenger's grip.

  **Reyes:** It's a perfect physical duplicate, Ines. Of course the grip is the same. The muscle memory was transmitted in the scan.

  **Kovač:** It's not just memory. It's her. For now. But you're missing the point of the week. The Resident—the one in the dormitory down the hall—is currently living on borrowed time. But not in the way you think.

  **Reyes:** Borrowed time implies the clock is ticking toward an end. But on my view, the metaphysical facts are already settled. The psychological connectedness between the Pre-Scan and the Resident is near perfect. The connectedness between the Pre-Scan and the Visitor is also near perfect. They are branching copies. Whether the machine destroys one or the other next Tuesday doesn't change the psychological facts existing *right now*.

  **Kovač:** It changes everything. If the Visitor passes calibration, the Resident ceases to be the person who entered the scanner. She becomes a discarded shell. Identity isn't just about intrinsic psychological overlap, Tobias. It's about the *best* continuation. And you can't have two best continuers. The existence of the Visitor blocks the Resident's claim to identity. But only if the Visitor succeeds.

  **Reyes:** That's the extrinsicness objection in flesh and blood. You're saying whether the Resident dies next Tuesday depends on whether a stranger on Mars—well, a duplicate—passes a soil toxicity test. How can my death depend on a calibration error in a facility three hundred million kilometers away? That makes identity magical. It makes it depend on facts outside the skin.

  **Kovač:** It's not magic. It's competition. Think of it like a race. If I run a marathon, and someone else runs a faster time elsewhere, I don't hold the record. The record depends on extrinsic facts about other runners. Similarly, being *the* person depends on being the *closest* continuer. If the Visitor is there and viable, she is closer to the future life than the Resident is, because the Resident is slated for destruction. The destruction policy makes the Resident a dead end.

  **Reyes:** But during this week, while we watch her plant those seeds, the Resident doesn't know. She's sitting in a dormitory eating tray meals. On your view, is she alive or dead *today*?

  **Kovač:** She's alive. Conditionally.

  **Reyes:** Conditionally alive? That sounds like a contradiction. If I ask her, "Are you the person who bought the ticket?" what is the truth value of her answer?

  **Kovač:** The truth value is indeterminate until the calibration concludes. I know that sits poorly with you. But consider the promise. Before scanning, the Passenger promised to repay a debt to a friend on Mars in a year. Who owes that money?

  **Reyes:** The Visitor. She's on Mars. She has the memories of making the promise. She intends to keep it.

  **Kovač:** But suppose the Visitor fails calibration. She's dismantled. The Resident walks out. If the Resident isn't the person who made the promise, why is she obligated to pay? You can't owe a debt if you aren't the debtor.

  **Reyes:** Because obligation tracks psychological continuity, not metaphysical identity. The Resident has the memory of the debt. She has the intention to discharge it. If she walks away refusing to pay because "I'm not the *real* person," she's being disingenuous. The relation that matters—what matters in survival—is present in her. She cares about the friend's welfare. She remembers the handshake. That's enough to bind her.

  **Kovač:** Enough for morality, maybe. But not for identity. If the Visitor lives, the Resident isn't just released from the debt; she's erased. You're conflating what matters in survival with survival itself. I'm saying there is a subject of experience that persists. Prudential concern—my fear for my future, my planning—attaches to that subject. If I'm the Resident, and the Visitor passes, I shouldn't plan for next year. I should plan for my funeral.

  **Reyes:** And that's where the view becomes cruel. You're telling the Resident that her prudential concern should hinge on a test result she can't influence. If you're right, she should sit in that dormitory for six days unable to form any future-directed intentions. She can't buy a book to read next week. She can't enroll in a course. She's in limbo.

  **Kovač:** She's in a competitive limbo. Yes. It's unfortunate, but it's the truth of the matter.

  **Reyes:** Is it truth, or is it a fetishization of the "further fact"? Look, Ines. I need to tell you something. I booked a flight. The second one. Next month.

  Kovač turns from the screen to look at him. The hum of the ventilation seems to grow louder.

  **Kovač:** You're going on the service.

  **Reyes:** I am. I need to know what I'm walking into. And this is where your view fails me. If I sit in that dormitory, on your view, I am waiting to find out if I exist. That's intolerable.

  **Kovač:** It's not that you're waiting to find out if you exist. You exist now. You're waiting to find out if you *continue*.

  **Reyes:** But you just said the continuation is fixed retrospectively. So right now, I am a ghost waiting to be solidified or exorcised based on how well my copy handles Martian gravity. That makes the week a kind of false life.

  **Kovač:** *[Pauses]* I'll grant you this: the psychological burden is immense. It feels like conditional existence. But that's because human psychology is wired for non-branching continuity. We aren't built for fission cases. But the metaphysics doesn't bend to our comfort. If the Visitor succeeds, you die on day seven. If she fails, you live. The fact is determinate, even if it's extrinsic.

  **Reyes:** But why should I care more about the Visitor passing than failing? On my view, it's clear. If the Visitor passes, there are two of us for a week, then one. If she fails, there are two of us for a week, then one. The total amount of "Tobias-experience" is roughly the same. The only difference is location. So why should I prefer the Mars version?

  **Kovač:** Because you want *your* future. Not just a future containing someone like you. If the Visitor passes, the Resident is destroyed. That is a loss of *your* subjectivity. If the Visitor fails, the Resident continues. That is the preservation of *your* subjectivity. You care because you are a single subject, not a collection of experiences.

  **Reyes:** But that's the question begging. You assume the subject is what matters. I'm saying the subject is a fiction. What matters is the holding of psychological connections. So, turn it back on you. If I'm the Resident, and I watch the Visitor on this screen... why should I care about her calibration results? If she passes, she lives. I have a successor. If she fails, I live. She has no successor. In both cases, consciousness continues. Why is one outcome "my survival" and the other "my death"?

  **Kovač:** Because in one case, the consciousness continues *in me*. In the other, it continues in *her*.

  **Reyes:** But "in me" is just a label for this particular body. If the psychology is identical, the label is empty. Here's the trap for you, Ines. If identity is what matters, and identity is extrinsic, then during this week, the Resident has no rational basis for self-concern. She can't fear death, because she doesn't know if she's the one who dies. She can't hope for life, because she might be the duplicate. You've paralyzed prudential rationality.

  **Kovač:** She can fear the destruction of this body. She can hope for the continuation of this body. She knows the rules.

  **Reyes:** But on your view, the destruction of this body *is* her death only if the other one passes. She has to care about the *other* one's performance to know if she should fear. That's absurd. It makes self-concern dependent on external validation.

  **Kovač:** *[Leans forward]* And you, Tobias. You bought a ticket. You're going to sit in that chair. When the scan happens, you'll be unconscious. When you wake up, if you're the Visitor, you'll be on Mars. If you're the Resident, you'll be here. But you know the rule. If you're the Visitor, the Resident dies. If you're the Resident, the Visitor dies. Don't you feel a preference? Don't you want to be the one who walks away?

  **Reyes:** I want there to be a person on Mars who remembers my life. And I want the person on Earth to be safe. Ideally, I'd want both. But since I can't have both... look, I'll concede this. Practically, legally, we need a binary. We need to know who signs the contract. We need to know who gets the pension. Your view handles the social ontology better. We need a "closest continuer" for the law to function.

  **Kovač:** I'll concede this: the waiting period is metaphysically corrosive. It feels as though the truth is missing. If I were the Resident, I would feel like a placeholder. And perhaps that feeling points to something real—that identity isn't as deep as we think. But it doesn't mean it's not there.

  **Reyes:** So we agree the week is torturous. But we disagree on why. I think it's torturous because it forces us to confront that "I" is a vague concept. You think it's torturous because the facts are hidden from us.

  **Kovač:** Exactly. For me, the fact is there. The Visitor is either me or she isn't. We just don't know yet. For you, there is no fact to know.

  **Reyes:** Right. And that changes how I prepare for the flight. If you're right, I should be terrified. I'm gambling my existence on a calibration test. If I'm right, I shouldn't be terrified. I should just be concerned about the quality of the connection. Will the Visitor feel pain? Will she be lonely?

  **Kovač:** But will *you* feel her loneliness? If she's you, yes. If she's not, no.

  **Reyes:** If the connection is strong enough, it doesn't matter. When she wakes up on Mars, she'll say "I made it." That statement will be true enough.

  **Kovač:** And when the Resident is destroyed, she'll say "I am dying." That statement will be true enough. But only one of them is *actually* you.

  **Reyes:** We're back to the further fact.

  **Kovač:** We're back to the subject.

  They sit in silence for a moment. On the screen, the Visitor finishes unpacking the seeds and looks up, directly into the camera. She waves, a small, tentative gesture.

  **Reyes:** She looks tired.

  **Kovač:** She looks like she's waiting for a verdict.

  **Reyes:** We all are.

  **Kovač:** Just remember, Tobias. If you go next month, and the calibration fails... you're the one who stays. Make sure you pay the debt.

  **Reyes:** Even if I'm not the one who borrowed the money?

  **Kovač:** Especially then. Because you'll be the only one left who remembers promising.

  **Reyes:** And if I'm on Mars?

  **Kovač:** Then you pay it because it's your debt.

  **Reyes:** Same action. Different reason.

  **Kovač:** Different metaphysics.

  **Reyes:** Same outcome.

  **Kovač:** Not for the one who doesn't walk away.

  **Reyes:** No. Not for them.

  Reyes picks up his coffee. It's cold. He drinks it anyway. On the screen, the Visitor turns back to the hydroponics tray, her back to the camera, living a life that might belong to someone else.
