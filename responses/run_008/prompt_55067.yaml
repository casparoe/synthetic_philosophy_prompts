      *   **The Case:** Commercial teletransportation. Scan -> Transmit -> Build Duplicate on Mars (Visitor). Original stays on Earth (Resident) for 7 days as control.
          *   If Visitor passes calibration (Day 7): Resident destroyed, Visitor lives.
          *   If Visitor fails calibration (Day 7): Resident lives, Visitor destroyed.
          *   During the week: Resident watches Visitor on live feed.
      *   **Characters:**
          *   *Dr. Ines Kovač:* Closest-continuer view (Nozick-esque). Identity is determinate but extrinsic/retrospective. What matters is identity (continuing subject), not degrees of connectedness. Promises/prudence attach to subjects.
          *   *Prof. Tobias Reyes:* Parfitian reductionist. Identity isn't what matters; psychological connectedness/continuity is. The "further fact" is empty. Survival is degreed. The outcome depending on extrinsic facts (calibration) shows identity isn't what matters.
      *   **Setting:** During the Passenger's verification week, watching the live feed.
      *   **Requirements:**
          1.  Direct engagement (no talking past each other).
          2.  Turn the other's commitment against them (at least once each).
          3.  Midway reveal: Reyes bought a ticket on the second flight (personal stakes).
          4.  Genuine concession/refinement by each by the end.
          5.  No outright winner; precise disagreement at the end.
          6.  Natural dialogue texture (interruptions, thinking aloud).
          7.  Word count: 1,800–2,200 words.
          8.  No citations/commentary outside the dialogue.

  2.  **Map Arguments & Vulnerabilities:**

      *   **Kovač (Closest-Continuer):**
          *   *Strength:* Aligns with legal/moral intuition (promises, responsibility need a specific bearer). Explains why we care *more* about the successor than a mere replica.
          *   *Vulnerability:* Extrinsic determination of identity (whether *I* die depends on what happens to *someone else* on Mars). The "conditional existence" of the Resident during the week (am I dead or alive right now?).
          *   *Key Point:* Prudential concern requires a subject. If I promise to pay a debt, someone must *be* me to owe it.
          *   *Concession:* Might admit the waiting period is psychologically torturous or that the "retrospective" nature feels odd, even if metaphysically sound.

      *   **Reyes (Reductionist):**
          *   *Strength:* Avoids magic "further facts." Handles fission/spectrum cases better. Explains why the *degree* of connection matters more than a binary switch.
          *   *Vulnerability:* Hard to explain specific obligations (who pays the debt?). If identity doesn't matter, why care about the calibration result at all? Why not just care about the Visitor regardless of the Resident's fate?
          *   *Key Point:* The facts of psychology are the same regardless of the machine's decision. Making survival depend on a calibration test shows identity is empty.
          *   *Concession:* Might admit that for practical/legal purposes, we need a binary decision, even if metaphysically fuzzy. Or admit that *self-concern* feels binary even if reality isn't.

      *   **The Twist:** Reyes is going on the next flight. This forces him to confront the fear of death vs. the logic of reductionism. Kovač must confront whether her view offers comfort or horror to him.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Watching the feed. Establish the stakes.
      *   **Round 1:** The core metaphysical clash. Kovač: Identity is fixed retrospectively. Reyes: That's absurd; intrinsic facts shouldn't depend on extrinsic ones.
      *   **Round 2:** Prudential Concern & Promises. Kovač: Who pays the debt? Reyes: The one with the memories and intentions.
      *   **Midpoint Twist:** Reyes reveals he's next. The tension rises.
      *   **Round 3:** Turning the tables. Kovač presses Reyes on why he cares about the test if it's just degrees. Reyes presses Kovač on the "conditional existence" of the Resident.
      *   **Closing:** Concessions. Precise disagreement.

  4.  **Writing - Focus on Voice and Flow:**
      *   Avoid textbook definitions ("As Parfit says..."). Use the case details (the dormitory, the feed, the debt).
      *   Ensure interruptions and pauses.
      *   Monitor word count.

  5.  **Refining Arguments (Self-Correction during drafting):**
      *   *Check:* Did Reyes answer the promise objection? *Adjustment:* Make sure he argues that the *relation* holds the obligation, not the metaphysical identity.
      *   *Check:* Did Kovač answer the arbitrariness objection? *Adjustment:* She needs to argue that continuity *is* competitive; you can't have two best continuers.
      *   *Check:* The Reyes ticket reveal. Needs to feel natural, not tacked on. Maybe he's looking at his own booking confirmation or mentions it when discussing fear.
      *   *Check:* Concessions. Kovač admits the waiting is metaphysically unsettling. Reyes admits the binary legal framework is necessary even if metaphysics isn't.

  6.  **Word Count Management:**
      *   Need to expand on the dialogue to hit 1,800-2,200. Elaborate on the emotional texture of the Resident's situation. Discuss the specific details of the Mars feed (what is the Visitor doing?).

  7.  **Final Review against Constraints:**
      *   No citations? Yes.
      *   Dialogue only (plus 2 sentence setting)? Yes.
      *   Specific case details used? Yes (debt, day six, calibration).
      *   Both concede? Yes.

  *(Self-Correction Note)*: Make sure the "turning commitment against them" requirement is explicit.
  *   Kovač to Reyes: If identity doesn't matter, why do you care if *you* are the Visitor or the Resident? Why buy the ticket at all if it's just copies?
  *   Reyes to Kovač: If identity is retrospective, is the Resident alive *now*? Or are they a ghost waiting to be solidified?

