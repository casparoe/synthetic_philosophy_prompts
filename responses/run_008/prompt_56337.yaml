answer: |-
  **1. The rule I recommend**

  I recommend adopting the **Conclusion-Based Procedure (CBP)** as your single default rule. Under CBP, the council votes only on the final motion (the conclusion). Premises—the reasons for or against the motion—are matters for debate only, not for formal voting. If members wish to vote on premises, these votes are strictly advisory 'straw polls' and carry no binding weight.

  This rule beats the alternative, the Premise-Based Procedure (PBP), because your council is a political body, not a court of law. In PBP, if a majority agrees on the reasons, the outcome is logically forced, even if a majority opposes the actual decision. For teenagers, this feels undemocratic and invites rebellion; it prioritises logical consistency over the will of the members. Social choice theory proves you cannot have both perfect consistency and perfect majority rule on every question. You must choose. CBP chooses legitimacy. It ensures that no student is forced to implement a decision they explicitly voted against, even if their own reasoning was contradictory.

  You should only overturn this default in one specific condition: objective budgetary constraints. If a premise is a mathematical fact (e.g., 'We only have £500 left'), that premise binds the council because reality binds you. But for judgements like 'the greenhouse is underused', the conclusion vote must prevail. This rule stops the furious argument you experienced by establishing *ex ante* that only the final vote counts. It simplifies the chair's job and protects the council from being trapped by its own logic.

  **2. The procedure**

  As Chair, you must enforce this rule consistently to prevent confusion. Follow this checklist for every substantive motion.

  **Step 1: Classification.** When a motion is proposed, ask: 'Is this a matter of fact or a matter of value?' If it is purely mathematical (e.g., 'Can we afford this?'), treat it as a constraint. If it involves judgement (e.g., 'Is this fair?'), it is a value question. Apply CBP to value questions.

  **Step 2: Structuring Debate.** Invite members to speak on the premises. You may ask, 'Who believes the greenhouse is underused?' to gauge the room, but explicitly state: 'This is not a vote. We are testing the arguments, not binding the council.' If a member moves to vote on a premise, rule them out of order unless it is a budgetary constraint. Say: 'Under our standing orders, we vote on what we do, not why we do it.'

  **Step 3: The Vote.** Call the vote on the motion itself. 'All those in favour of cutting funding...' Ensure the question is clear. Count the votes. This number is the only one that matters.

  **Step 4: Minutes.** Record the outcome clearly: 'Motion carried/lost.' Summarise the main arguments in the notes, but do not record premise votes as decisions. Write: 'Members noted concerns regarding usage, but prioritised club retention.' This prevents future councils from claiming the previous council 'decided' the greenhouse was underused by a vote.

  **Step 5: Handling Challenges.** If members argue, 'But we agreed on the premises!', remind them: 'We agreed to hear the arguments, not to be bound by them. The final vote is the council's will.' If the question is purely one of values (e.g., 'Is this club good?'), stop the logical dissection. Say: 'This is a matter of preference, not logic. Vote according to your conscience.'

  This procedure stops the meeting from bogging down in logical traps. It hands the decision back to the members where it belongs. If the logic is messy, let it be messy; democracy is often messy. Your job is to record the decision, not to police the reasoning. By refusing to vote on premises, you avoid generating the conflicting set of judgments that creates the paradox in the first place.

  **3. Worked cases**

  Here is how the procedure applies to your three scenarios.

  **(a) Funding a late bus on concert nights.**
  Most members support this personally. During debate, premises arise: 'It is safe' and 'Students need it.' Under CBP, you do not vote on safety or need. You debate them, then vote on the funding motion. The motion passes. This is straightforward; the procedure adds little friction here because preferences and logic align.

  **(b) Stopping funding for a club most think is a waste, but some members belong to.**
  This is the critical test. During debate, a majority verbally agree with the premise: 'This club is a waste of money.' Under a Premise-Based rule, funding would be cut automatically. Under my recommended CBP, you proceed to the conclusion vote. Members who think it is a waste still vote 'No' to cutting funding because they do not want to hurt their friends. The motion to cut funding fails.
  **I must be plain:** You will not like this outcome. It is hypocritical. The council has declared the club worthless but continues to fund it. However, CBP accepts this inconsistency as the price of democratic legitimacy. Cutting the funding against the final vote would cause greater damage to council morale. You must accept the hypocrisy to preserve the peace.

  **(c) Endorsing a change to homework policy.**
  This motion is symbolic; the council has no authority. Premises include 'Homework is stressful' and 'The school should listen.' These are values. You debate them. You vote on the endorsement. Suppose the vote passes. The minutes record the endorsement. Because the council has no authority, the logical consistency matters less than the signal sent. CBP allows the council to speak with one voice, even if the reasons vary.

  In case (b), the procedure protects members from being forced into a logical corner. It allows them to vote their loyalty over their logic. While this frustrates a Chair seeking rational budgeting, it prevents the meeting from descending into accusations of betrayal. The procedure prioritises the social cohesion of the council over the logical purity of its budget.

  **4. Where the procedure misfires**

  No rule is perfect. CBP fails when consistency is vital for credibility. If the council repeatedly funds 'waste' while calling it 'waste', students outside the council will view you as incompetent or dishonest. You cannot logic your way out of a reputation for hypocrisy.

  Furthermore, CBP is vulnerable to strategic voting. Clever members may argue for false premises to manipulate the debate, knowing only the conclusion counts. For example, they might exaggerate costs to scare voters, knowing the cost vote won't bind them. You cannot fully prevent this; you must rely on members' integrity.

  Finally, this procedure cannot settle deep value conflicts. If half the council believes 'fairness means equality' and the other half believes 'fairness means merit', no voting rule fixes that. In these cases, the procedure should stop. Acknowledge the disagreement, vote on the motion, and accept that the losing side will remain unconvinced. Do not try to force logical agreement where none exists. The rule manages decisions, not beliefs.
