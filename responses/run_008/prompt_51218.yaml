  **MEMORANDUM**

  **TO:** Fellow Clerks, Constitutional Chamber
  **FROM:** [Your Name]
  **DATE:** October 24, 2024
  **SUBJECT:** Recommendation on Public Order and Loyalty Act Petitions

  **I. Introduction**

  We face 400 petitions challenging convictions under the Directorate's "Public Order and Loyalty Act." The Chamber must decide whether these provisions were *valid law* at the time. This determination dictates whether we void convictions with compensation (wrongful) or route petitioners to clemency (unjust but valid). The cases fall into three classes: (1) border shootings (guards authorized to shoot crossers); (2) grudge informers (convictions based on denunciations); and (3) property expropriations (formal seizures of "enemies").

  **II. Analysis of Options**

  **Option (c) (Fully Valid):** This positivist approach maintains legal certainty by treating Directorate statutes as law because they were enacted and published.
  *Strengths:* It avoids retroactive judicial legislation and respects the separation of powers, leaving moral remediation to the new Parliament's clemency commission.
  *Weaknesses:* As applied to the border shootings, it is morally untenable. It risks legitimizing state murder and undermines the new constitutional order's commitment to human rights.

  **Option (a) (Void under Intolerable Injustice):** This adopts the Radbruch formula: law that violates justice intolerably is not law.
  *Strengths:* It provides moral clarity and immediate justice for the worst victims, particularly border shootings. It aligns with the natural law intuition that extreme injustice lacks legal character.
  *Weaknesses:* The standard ("intolerable") is vague. Applying it broadly risks destabilizing all past legal transactions, including mundane contracts or marriages formalized under the Directorate. It offers little guidance on distinguishing the expropriation cases (harsh but ordinary) from the border cases.

  **Option (b) (Valid but Defective Application):** This adopts a Fullerian procedural approach. Statutes are valid, but convictions are voided if the *application* violated the internal morality of law (e.g., secrecy, lack of congruence between rule and action).
  *Strengths:* It offers a granular test. We can validate the statute while voiding specific convictions where procedural norms were breached. It avoids the metaphysical clash of declaring past law "non-law."
  *Weaknesses:* It requires complex factual inquiries into how each statute was applied, increasing judicial workload.

  **III. Recommendation**

  I recommend **Option (b)**: Declare the provisions valid but legally defective in application, remitting cases for individualized review.

  This option best handles the three classes differently, avoiding a one-size-fits-all error:

  1.  **Border Shootings:** While the statute authorized force, evidence suggests guards operated under secret directives to shoot on sight, violating even the Directorate's published rules on proportionality. This is a procedural defect (congruence) so severe it warrants voiding the conviction.
  2.  **Grudge Informers:** Many convictions relied on secret directives contradicting published statutes regarding evidence or "parasitism." This violates the principle of publicity. These convictions should be voided due to defective application.
  3.  **Expropriations:** These were often procedurally congruent with published rules. While substantively unjust, they lack the procedural defect required for judicial voiding. These should be routed to the legislative compensation scheme, not the courts.

  **IV. Fairness to the Losing Side**

  We must treat Option (a) fairly. Its proponents argue that Option (b) is overly technical. For the families of border victims, being told their loved ones were killed under "valid law" that was just "defectively applied" feels like semantic cruelty. Option (a) offers the moral honesty of declaring state murder *never* had legal force. It provides a clearer symbolic break with the Directorate. We should acknowledge that for the border cases, Option (a) feels more righteous, even if Option (b) is more legally stable.

  **V. Settled vs. Controversial Literature**

  In preparing the Judge's bench memo, please distinguish the following:

  *   **Settled:** Legal positivists (like Hart) agree that a rule can be legally valid yet morally wicked. There is consensus that transitional courts must balance retroactive justice against legal certainty to avoid chaos. Everyone agrees the border shootings are the hardest cases.
  *   **Live Controversy:** Scholars dispute whether Fuller's procedural criteria are truly distinct from substantive natural law (i.e., is "publicity" just a proxy for "goodness"?). There is no consensus on whether the Radbruch formula is a legal test or a moral override disguised as law. Some argue that declaring past law "invalid" is itself a retroactive act of power, indistinguishable from the tyranny we condemn.

  **VI. Conclusion**

  Option (b) allows us to grant relief to the most egregious cases (border, informers) without collapsing the legal continuity of the state or overjudging the expropriations. It gives us a reasoned basis to differentiate, rather than relying on an undefined adjective like "intolerable."

  \answer{Option (b): Valid law, defective application}
