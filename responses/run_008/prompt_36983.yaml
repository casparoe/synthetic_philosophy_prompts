prompt: |-
  You are an experienced designer of classroom simulations for philosophy and decision-theory courses — the kind of designer who has actually run these games and knows exactly how they break when they meet real student incentives, not just how they read on paper. You know the Newcomb literature thoroughly, and you know enough about informal prediction (reading people from small behavioral samples) to design a realistic predictor rather than a stipulated one.

  I teach a 300-level seminar on rational choice: 18 students, 75-minute sessions, meeting twice a week for a 14-week term. I want an in-class Newcomb's problem where the prediction is real rather than hypothetical, and where the setup is never named until the debrief — no mention of Newcomb, one-boxing, or predictors beforehand. The design I have in mind, which you should improve rather than merely execute:

  - Over the first four or five weeks, students make a series of small, recorded choices in ordinary classroom games — choices that reveal something about each student's style: whether they take a small sure payoff or hold out for a larger uncertain one, whether they honor cheap commitments when no one is checking, whether they stick or switch when the odds shift mid-game. These rounds should be genuinely fun and should not hint at any later use.
  - At some later session, I (or a TA who has been keeping the records) privately predict each student's choice in a forthcoming sealed-envelope decision, based on that record, and seal the prediction documentation before the decision.
  - The decision itself: each student chooses either one envelope or both. The smaller envelope visibly contains a small payoff in raffle tickets toward a real prize; the larger envelope was filled beforehand, with a big payoff if and only if the predictor expected the student to take it alone. Payoffs must be in raffle tickets or something similarly real but cheap, not hypothetical millions.

  Think carefully about the incentive structure before writing — especially the payoff numbers. Two-boxing must be the dominant strategy if the predictor is no better than a coin flip; the game only works if the predictor's genuine accuracy is what makes two-boxing lose on average. So tell me: with 18 students and a few weeks of behavioral data, how accurate can a human predictor plausibly be at this, what accuracy threshold the game needs, and what payoff ratio you'd set given that estimate. If the honest answer is that a human predictor can't clear the threshold, redesign the mechanism (e.g., a simple logistic model fit to the round-one data, or peer predictions under a proper scoring rule) rather than fudging the numbers.

  Then attend to the failure modes, and for each tell me whether it's a bug or a feature: students who already know Newcomb sandbagging the early rounds to poison the record; students randomizing at the final choice; collusion or information leaking about the prediction mechanism; and the worst case, the predictor having a bad night so the two-boxers as a group win and the debrief collapses into vindication. Note that sandbagging is arguably the philosophical problem in miniature — the predictor is estimating the person, and a student who deliberately cultivates an unreliable track record has changed something the predictor had access to — so tell me whether to let it happen and harvest it in the debrief or close the loophole, and at what cost.

  Also be candid about what a real predictor cannot reproduce. The stipulated problem assumes my choice this afternoon is causally independent of the box contents, established by stipulation. But a predictor reading my track record is estimating me — the same stable dispositions are upstream of both the record and today's choice — so the causal structure is not quite what the paradox stipulates. Identify precisely which feature of the philosophical problem the activity cannot reproduce, what I must supply verbally in the debrief, and whether that gap is itself worth teaching as a live issue about what "already determined" means.

  Produce a facilitator's packet I could run directly: the round-one games with rules and timings, the prediction and sealing procedure with whatever documentation makes it credible, the envelope choice with exact payoffs, and the debrief script mapping what students felt onto the difference between what a choice causes and what it is evidence about. Open the response with the packet itself — no preamble, no restatement of my request — and close it with three attached sections: the accuracy analysis and payoff math, the failure modes, and the honest statement of what the simulation cannot reproduce.
