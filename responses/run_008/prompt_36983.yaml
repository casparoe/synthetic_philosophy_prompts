  1-Box EU = 0.7 * 50 = 35.
  2-Box EU = 5 + (0.3 * 50) = 5 + 15 = 20.
  1-Box is clearly superior.
  If Accuracy = 50% (Coin flip).
  1-Box EU = 25.
