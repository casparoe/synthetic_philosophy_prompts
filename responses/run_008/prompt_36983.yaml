      *   If a student knows Newcomb, they might try to act "One-Boxy" in early rounds to get the big prize, then Two-Box at the end.
      *   *Counter:* The early rounds must have *real* incentives too. If they sandbag early, they lose early points. This creates a cost to deception. I need to ensure early games have small stakes (participation credit) so sandbagging costs them something.
      *   *Instruction:* Early games award course credit/participation points. This makes "lying" costly.

  12. **Final Polish:**
      *   Ensure the "Sealing" procedure is watertight (witnesses, timestamps).
      *   Ensure the Debrief doesn't spoil the surprise before the choice.
      *   Make sure the "Common Cause" distinction is clear in Appendix C.

