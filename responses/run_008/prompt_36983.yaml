answer: |-
  # FACILITATOR'S PACKET: THE ENVELOPE PROTOCOL

  ## PART 1: THE PROFILE PHASE (Weeks 1–4)
  **Objective:** Collect behavioral data without alerting students to the final simulation. Integrate these activities as "warm-ups" or "discussion starters" in the first 10 minutes of class.

  **Incentive:** Each activity awards 1 Participation Point (toward their course participation grade). This prevents sandbagging; lying costs them credit.

  ### Activity A: The Sure Thing (Week 1)
  **Setup:** Project two options. Students submit choices via index card.
  **Option X:** Receive 2 Participation Points guaranteed.
  **Option Y:** 50% chance of 5 Participation Points, 50% chance of 0. (Flip a coin publicly).
  **Record:** Note who takes the sure thing (Risk Averse/Security) vs. the gamble (Risk Seeking/Maximizer).

  ### Activity B: The Public Pledge (Week 3)
  **Setup:** Pair students. Give each pair a shared pot of 4 Participation Points.
  **Rule:** Each student privately writes "Keep" or "Share."
  *   If both Share: Each gets 3 points.
  *   If one Keeps, one Shares: Keeper gets 4, Sharer gets 0.
  *   If both Keep: Each gets 1 point.
  **Twist:** Before writing, allow 30 seconds of verbal negotiation. They can promise to Share.
  **Record:** Note who honors the verbal commitment when it is costly to do so (Honorable/Consistent) vs. who defects (Dominance Reasoner/Opportunist).

  ### Activity C: The Switch (Week 4)
  **Setup:** Monty Hall variant on the board. Three doors, one prize.
  **Rule:** Student picks Door 1. You reveal Door 3 is empty. Offer them the chance to switch to Door 2 for a bonus Participation Point if they win.
  **Record:** Note who sticks (Status Quo/Intuition) vs. who switches (Analytical/Updating). *Note: In Newcomb contexts, "Switchers" often correlate with Two-Boxers (maximizing immediate gain), while "Stickers" often correlate with One-Boxers (commitment to initial state), though this is less robust than A and B.*

  ---

  ## PART 2: THE PREDICTION & SEALING (Week 5, Prior to Class)
  **Objective:** Create an auditable, tamper-proof prediction record.

  **Materials:**
  *   18 Sealed Manilla Envelopes (labeled with Student Names).
  *   1 Master Log Sheet.
  *   1 Witness (TA or colleague not involved in grading).

  **Procedure:**
  1.  **Profile Review:** Review your records from Part 1. Look for the "Dominance Reasoner" signature: Students who took the gamble in A, defected in B, and switched in C are high-probability Two-Boxers. Students who took the sure thing, honored pledges, and stuck are high-probability One-Boxers.
  2.  **Make Prediction:** For each student, write inside their envelope: *"PREDICTION: [ONE BOX / TWO BOXES]"*. Sign and date it.
  3.  **Prepare Payoffs:**
      *   **The Small Envelope (Visible):** Place 5 Raffle Tickets in 18 identical small envelopes.
      *   **The Large Envelope (Hidden):** Prepare 18 larger envelopes.
          *   If you predicted **ONE BOX**: Place 50 Raffle Tickets inside.
          *   If you predicted **TWO BOXES**: Place **0** Tickets inside.
      *   Seal the Large Envelopes with red wax or a distinct sticker.
  4.  **Sealing:** Place the Small Envelope, the Large Envelope, and the Prediction Slip into the Student's Manilla Envelope. Seal it.
  5.  **Verification:** Have the Witness sign across the seal of the Master Log Sheet confirming the predictions were made *before* the class session.
  6.  **Storage:** Lock these in a safe or office drawer until class.

  ---

  ## PART 3: THE DECISION SESSION (Week 5, In-Class)
  **Timing:** 20 Minutes total.

  **Script:**
  1.  **Distribution (5 mins):** Hand each student their sealed Manilla Envelope. Tell them: *"Do not open this yet. Inside are materials for a decision task. Your name is on the front."*
  2.  **Instructions (5 mins):**
      *   "Inside, you will find a Small Envelope and a Large Envelope. Both are sealed."
      *   "The Small Envelope definitely contains 5 raffle tickets toward the end-of-term prize [Specify Prize, e.g., $50 Gift Card]."
      *   "The Large Envelope may contain 50 tickets, or it may contain nothing. The contents were determined before you entered the room."
      *   "You have two choices: **Take Only the Large Envelope** OR **Take Both Envelopes**."
      *   "If you choose Both, you must open both immediately. If you choose Only Large, you must hand the Small Envelope back to me unopened. I will shred the unopened Small Envelopes."
      *   "Your choice is private. Write 'ONE' or 'TWO' on your index card. Hand me the card and the corresponding envelope(s)."
  3.  **Execution (5 mins):** Collect cards and envelopes. Separate the "One Box" cards from the "Two Box" cards.
  4.  **Reveal (5 mins):**
      *   Ask One-Boxers to open their Large Envelopes. (Most should find 50 tickets).
      *   Ask Two-Boxers to open their Large Envelopes. (Most should find 0 tickets).
      *   Ask Two-Boxers to open their Small Envelopes (5 tickets).
      *   **Tally:** Write the average winnings for One-Boxers vs. Two-Boxers on the board.

  ---

  ## PART 4: THE DEBRIEF SCRIPT
  **Timing:** Remainder of Class (55 mins).

  **Phase 1: The Reveal (10 mins)**
  *   **Instructor:** "Before we discuss the results, I need to tell you how the Large Envelopes were filled. I did not flip a coin. I made a prediction about your choice based on your behavior in the first four weeks of class."
  *   **Action:** Open the Manilla Envelopes and show the Prediction Slips. Match them to the choices made.
  *   **Reveal:** "This is a simulation of a famous problem in decision theory called **Newcomb's Problem**."

  **Phase 2: The Conflict (20 mins)**
  *   **Ask the Two-Boxers:** "Why did you take both? Did you think you could outsmart the prediction?"
      *   *Expected Answer:* "The money was already there or not. My choice couldn't change the past. Taking both guarantees I get at least 5 tickets."
  *   **Ask the One-Boxers:** "Why did you take one? Did you trust the prediction?"
      *   *Expected Answer:* "I wanted the 50. Taking both seemed like it would trigger the empty box."
  *   **Board Work:** Draw the payoff matrix.
      *   If Predicted 1-Box: 1-Box = 50, 2-Box = 55.
      *   If Predicted 2-Box: 1-Box = 0, 2-Box = 5.
  *   **Point out Dominance:** "No matter what I predicted, Two-Boxing yields +5 tickets over One-Boxing *in that specific row*."
  *   **Point out Evidence:** "However, looking at the class aggregate, One-Boxers averaged ~45 tickets. Two-Boxers averaged ~10 tickets."

  **Phase 3: The Theory (25 mins)**
  *   **Causal Decision Theory (CDT):** Aligns with Two-Boxing. Your choice cannot causally affect the past prediction. Focus on the *consequences of the act*.
  *   **Evidential Decision Theory (EDT):** Aligns with One-Boxing. Your choice is *evidence* of what was predicted. Focus on the *news value of the act*.
  *   **The "Real" Predictor:** "In the philosophical problem, the predictor is near-perfect (99%). In our class, I was human. But because I used your behavioral history, I created a correlation between your *type* and your *choice*."
  *   **Closing Question:** "If you could rewrite your own brain chemistry before the game started, would you rewrite it to be the kind of person who One-Boxes? If yes, why did you Two-Box when it mattered?"

  ***

  # APPENDIX A: ACCURACY ANALYSIS & PAYOFF MATH

  ### 1. The Accuracy Threshold
  For the simulation to pedagogically succeed (i.e., for One-Boxers to actually win more on average than Two-Boxers), the predictor's accuracy ($p$) must exceed a specific break-even point determined by the payoff ratio.

  Let:
  *   $V_S$ = Value of Small Envelope (5 tickets)
  *   $V_L$ = Value of Large Envelope (50 tickets)
  *   $p$ = Probability Predictor is Correct

  **Expected Utility (EU) Calculations:**
  *   **EU(One-Box):** You get $V_L$ only if the predictor was right.
      $$EU(1B) = p \cdot V_L$$
  *   **EU(Two-Box):** You get $V_S$ always, plus $V_L$ only if the predictor was wrong.
      $$EU(2B) = V_S + (1 - p) \cdot V_L$$

  **Break-Even Condition:**
  For One-Boxing to be the superior strategy empirically:
  $$p \cdot V_L > V_S + (1 - p) \cdot V_L$$
  $$p \cdot V_L > V_S + V_L - p \cdot V_L$$
  $$2p \cdot V_L > V_S + V_L$$
  $$p > \frac{V_S + V_L}{2 V_L} = 0.5 + 0.5 \left( \frac{V_S}{V_L} \right)$$

  **With Our Payoffs ($V_S=5, V_L=50$):**
  $$p > 0.5 + 0.5(0.1) = 0.55$$

  **Conclusion:** The instructor needs only **55% accuracy** to validate the One-Box strategy empirically.
  *   **Plausibility:** A human observer tracking 18 students over 4 weeks of diagnostic games can realistically achieve **70–80% accuracy**. The "Dominance Reasoner" profile (defects in Prisoner's Dilemma, takes gambles) is highly correlated with Two-Boxing in Newcomb scenarios.
  *   **Safety Margin:** Even if the instructor has a "bad night" and drops to 60% accuracy, One-Boxers still win on average (30 tickets vs 20 tickets). The lesson holds.

  ### 2. Payoff Recommendations
  *   **Currency:** Raffle tickets for a tangible prize (e.g., $50 Amazon Card, "Drop Lowest Quiz"). Hypothetical money reduces stakes and encourages randomization.
  *   **Ratio:** Keep $V_L / V_S \geq 10$. If the ratio drops to 2:1 ($V_S=25, V_L=50$), the required accuracy jumps to 75%, which is risky for a human predictor.
  *   **Cap:** Ensure the total prize pool is manageable. 18 students $\times$ 50 tickets = 900 tickets max.

  ***

  # APPENDIX B: FAILURE MODES (BUGS VS. FEATURES)

  ### 1. Sandbagging (The "Newcomb Veteran")
  *   **Scenario:** A student who has read about Newcomb's Problem acts like a One-Boxer in Weeks 1–4 (taking sure things, honoring pledges) to ensure the Large Envelope is filled, then Two-Boxes in Week 5 to get $5 + 50 = 55$.
  *   **Diagnosis:** **Feature.**
  *   **Rationale:** This is not cheating; it is the philosophical crux of the problem. If a student can successfully decouple their past record from their current choice, they have proven they are *unpredictable*. If they are unpredictable, the predictor cannot fill the box based on their record.
  *   **Handling:** If this happens, reveal it in the debrief. "Student X manipulated the correlation. For them, the prediction was invalid. This shows that Newcomb's Problem dissolves if the agent can randomize or deceive the predictor." This leads to a rich discussion on *transparency* and *binding commitments*.
  *   **Mitigation:** Ensure early games have real stakes (Participation Points). Sandbagging costs them points early, making the strategy expensive.

  ### 2. Explicit Randomization
  *   **Scenario:** A student flips a coin in class to decide.
  *   **Diagnosis:** **Bug.**
  *   **Rationale:** The simulation relies on the choice being an expression of stable disposition. Randomization breaks the correlation between the record and the choice.
  *   **Handling:** Discourage this in instructions ("Make a deliberate choice"). If a student admits to randomizing, exclude their data from the class average calculation in the debrief, noting that "Newcomb's Problem assumes a deterministic or disposition-based agent."

  ### 3. Predictor Error (The "Bad Night")
  *   **Scenario:** The instructor predicts poorly (<55% accuracy). Two-Boxers win more on average.
  *   **Diagnosis:** **Bug (Pedagogical Risk).**
  *   **Rationale:** If Two-Boxers win, students will conclude CDT is empirically superior, missing the point of the paradox.
  *   **Handling:** This is why the 10:1 payoff ratio is critical. It lowers the accuracy bar to 55%. If accuracy falls below 50%, acknowledge the failure: "I was a bad predictor. In the philosophical problem, the predictor is near-perfect. Because I failed, the causal structure collapsed." Use it to discuss the *premise* of the problem (Omega's infallibility).

  ### 4. Information Leakage
  *   **Scenario:** Students discuss the "envelope game" before class.
  *   **Diagnosis:** **Bug.**
  *   **Handling:** Instruct students in Week 1 that "some in-class activities are confidential until the end of the term." If leakage occurs, the correlation weakens. If too many students know, cancel the simulation and lecture on the theory instead. Do not run a compromised simulation.

  ***

  # APPENDIX C: PHILOSOPHICAL FIDELITY (WHAT THIS CANNOT REPRODUCE)

  ### 1. The Causal Gap
  *   **The Stipulated Problem:** In the canonical Newcomb's Problem, the prediction is causally independent of the choice. The box is filled *before* you choose, and your choice cannot reach back in time to change the contents. The correlation exists due to a "logical" or "metaphysical" link (or a perfect simulator).
  *   **The Simulation:** In this classroom version, the prediction is based on *behavioral history*. The causal structure is a **Common Cause Model**.
      *   *Your Character/Disposition* $\rightarrow$ Causes *Early Game Choices* (The Record).
      *   *Your Character/Disposition* $\rightarrow$ Causes *Final Envelope Choice*.
      *   *Instructor* $\rightarrow$ Reads Record $\rightarrow$ Predicts Choice.
  *   **The Discrepancy:** In the simulation, your choice doesn't *cause* the money to be there, nor does the prediction *cause* your choice. Rather, your underlying psychology causes both. This is technically **Arntzenius's "Common Cause" resolution**, not the pure Newcomb paradox.

  ### 2. What You Must Supply Verbally
  You cannot simulate the "Logical Necessity" of Omega. You must explicitly state this in the debrief:
  *   **Script:** "In the real philosophical problem, the predictor is perfect by stipulation, even if they know nothing about your past. They might be a time traveler or a brain simulator. In our game, I predicted you based on *who you are*. This means your choice was evidence of the contents because you are a consistent person, not because your choice magically changed the past."

  ### 3. Is This Gap Worth Teaching?
  **Yes.** It is arguably *more* valuable than the stipulated version.
  *   **Why:** Students often reject Newcomb's Problem because "backwards causation is impossible." This simulation shows that One-Boxing is rational even with a *naturalistic* predictor, provided the correlation is strong enough.
  *   **Lesson:** It shifts the debate from "Can the future affect the past?" to "Should I be the kind of person who is predictable?" This bridges the gap between Decision Theory and Virtue Ethics / Commitment Strategies, which is a high-value learning outcome for a 300-level seminar.
