answer: |-
  **Pedagogical Verdict on Stage 2**
  Your hunch is sound. Standard Backward Induction (BI) requires a finite horizon with a known final node. By introducing a probabilistic ending, you remove the anchor required for the induction chain to start. This isolates the structural fragility of BI without muddying waters with altruism. It forces students to confront whether their Stage 1 reasoning relied on the *logic* of BI or merely the *certainty* of the endpoint.

  **Session Plan (75 mins)**

  **1. Setup & Stage 1: The Finite Game (20 mins)**
  *   **Pairs:** 8 pairs, 1 trio (you play). Desks facing.
  *   **Stakes:** Chocolate or points. Pot starts at 2 units.
  *   **Rules:** 6 nodes. A moves at 1, 3, 5; B at 2, 4, 6. **Pass** doubles pot. **Take** ends game; taker gets 60%, partner 40%. At Node 6, B must take.
  *   **Action:** Play 3 rounds. Rotate partners once. Record outcomes on board.
  *   **Goal:** Establish the "Take Early" norm via experience. Most will take at Node 1 or 2.

  **2. Stage 2: Probabilistic Horizon (20 mins)**
  *   **Rules:** Same payoff structure. *Modification:* After every **Pass**, roll a d6. On a 1, game ends involuntarily; both get 50% of current pot. Otherwise, play continues.
  *   **Logic:** No guaranteed final node. Theoretically infinite horizon.
  *   **Action:** 3 rounds. Record outcomes. Expect significantly more passing.
  *   **Note:** Ensure students understand the die roll is independent each time.

  **3. Debrief: The Tension (35 mins)**
  Do not lecture. Map board data to theory using these prompts:
  *   **Q1 (Structure):** "In Stage 1, BI says take at Node 1. Who actually calculated backward from Node 6?" (Usually none). "Did you act on BI, or on a heuristic?"
  *   **Q2 (Assumptions):** "BI requires Common Knowledge of Rationality (CKR). Did you assume your partner was rational? Did you assume they assumed *you* were?"
  *   **Q3 (Stage 2 Shift):** "Payoffs didn't change, only the horizon. Why did passing increase? Does rationality depend on knowing the end?"
  *   **Q4 (Resolution):** "If BI predicts Take, but you Passed, are you irrational? Or is BI missing a variable (e.g., uncertainty about opponent's rationality)?"

  **Troubleshooting & Limitations**

  *   **Confusion vs. Strategy:** Students may pass in Stage 1 because they misunderstand the payoff, not due to strategy. *Fix:* Run a unpaid dummy round against a volunteer. Verify comprehension before stakes count.
  *   **Trust Issues:** In Stage 2, students may suspect the die roll is rigged to punish passing. *Fix:* Use a clear d6, student rolls.
  *   **The "Nice" Factor:** Students often pass due to social preference, not strategic uncertainty. *Fix:* In debrief, ask: "Did you pass to be nice, or to get more?" Distinguish altruism from strategic reasoning.
  *   **Instructor Supply:** The game cannot reproduce **Common Knowledge of Rationality**. Students know *they* are rational, but rarely assume *others* are perfectly rational utility maximizers. You must explicitly define CKR in the closing summary: "BI holds only if you know I know you know... everyone is rational. Your gameplay suggests CKR is false in practice. The paradox isn't that you failed BI; it's that BI requires assumptions humans don't hold."

  **Timing Check**
  Setup: 5 | Stage 1: 20 | Stage 2: 20 | Debrief: 30 | Total: 75.
