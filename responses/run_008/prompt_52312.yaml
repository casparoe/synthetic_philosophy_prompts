      *   *Self-Correction on Ranking:* Is (2) vs (4) worse than (2) vs (1)? (4) is a specific application of (1). So (2) vs (1) is the root. But (2) vs (4) is the practical contradiction. I will group them as the primary tension.
      *   *Check (3):* (3) says "might be right." (5) says Abolitionists were right to refuse. This implies Abolitionists thought Slaveholders were *not* "might be right." This is consistent.
      *   *Check (4):* "Splitting difference... is moral failure." (2) says "Compromise... is morally best." Direct contradiction unless scope is limited.

      *   *Decision:* The primary tension is **(2) against the coalition of (1), (4), and (5).**
      *   (2) is the outlier. It treats compromise as a *positive moral good*. (1), (4), (5) treat compromise as *suspect unless epistemically necessary*.
      *   Revision: Change (2) from "Morally Best" to "Pragmatically Optimal" or limit to "Non-Fundamental Disputes."
