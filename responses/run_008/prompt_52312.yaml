      *   **Tension B: (2) Compromise is Best vs. (4) Compromise with Error is Failure.**
          *   *Conflict:* (2) says in deep disagreements, compromise is *very often* the morally best outcome. (4) says if someone is simply wrong, splitting the difference is a failure. In a "deep moral disagreement" (per 2), is one side simply wrong? If (1) is true, usually one side is closer to the truth. If (2) says compromise is best *even then*, it contradicts (4). If (2) only applies when *both* are partly right, it limits the scope of (2) significantly.
