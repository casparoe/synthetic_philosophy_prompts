      *   *Best Bet:* Modify **(2)**. The claim that compromise is the "morally best outcome" is too strong given (1) and (4). It should be "the most *justifiable* outcome given epistemic uncertainty" or restricted to "conflicts of interest" rather than "conflicts of principle."
      *   *Actually, looking closer:* The teacher's example (Forest vs. Logging) is a conflict of *interests/values*, not necessarily *truth*. Slavery is a conflict of *truth/rights*.
