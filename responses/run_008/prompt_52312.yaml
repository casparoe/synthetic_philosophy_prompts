      *   If I tell them to drop (2), they lose the teacher's main point.
      *   If I tell them to drop (1), they lose their moral backbone for (5).
      *   The fix must be **categorization**. Distinguish between *Moral Conflicts* (Right vs. Wrong) and *Political/Value Conflicts* (Good vs. Good).
      *   The teacher's example (Forest vs. Logging) is Good vs. Good (Environment vs. Economy).
      *   The Abolitionist example is Right vs. Wrong (Freedom vs. Slavery).
