answer: |-
  1. "The procedure"

  Your goal is not breaking news; it is education. You must prioritise not lying over being first. Here is the ten-minute filter.

  **Step 1: The N-Threshold.** Open the methods section. Find the sample size (N). If the total N is under 100 for correlational work, or under 50 per arm for experiments, stop. **[Judgement Call]** I am setting this threshold arbitrarily. Statistics says small N increases noise, but I am deciding that anything below this is too unstable for school pupils. If it fails, bin it.

  **Step 2: The Plausibility Filter.** Ask: "Does this require new physics or biology?" If the claim contradicts established mechanism (e.g., homeopathy, tea curing cancer), demand at least three independent studies. **[Judgement Call]** Defining 'extraordinary' is subjective. I define it as anything violating textbook consensus. If only one study exists, do not publish as fact.

  **Step 3: The Source Test.** Is there a DOI linking to a peer-reviewed paper? If you only have a press release or news article, stop. Press releases strip nuance and inflate effect sizes by design. If you cannot find the paper, kill the story.

  **Step 4: The Replication Check.** Google Scholar the title. Are there direct replications? If yes, compare effect sizes. If the replication is smaller, note the drop. If no replications exist, label the claim "Preliminary" in bold.

  **Stop Rule:** If any step triggers a stop, you do not publish the claim as fact. You may publish a piece *about* the claim, explicitly stating it is unverified. **[Judgement Call]** This values caution over novelty. This is an editorial ethic, not a statistical law. You are choosing to be a teacher, not a journalist. If you cannot explain the uncertainty, do not print the claim.

  2. "Run it on these"

  Here is how the filter handles your specific headaches.

  **Case 1: N=20, p < 0.05.** Step 1 kills this immediately. The sample is too small to stabilise the estimate. A p-value cannot rescue a tiny sample; it merely indicates noise might look like signal. **Verdict:** Reject. Do not run. Teaching pupils that p < 0.05 equals truth is the bad habit you want to avoid.

  **Case 2: Herbal Tea (No Prior).** Step 2 triggers. There is no base rate for tea focusing attention. It sounds plausible but lacks mechanism. Without multiple studies, it fails the plausibility filter. **Verdict:** Reject as fact. You may run a piece titled "Claims Investigated", noting the lack of robust evidence.

  **Case 3: Press Release Only.** Step 3 kills this. Press releases are marketing documents, not evidence. They often omit limitations. **Verdict:** Reject. Find the paper or kill the story. Never let a PR team write your science section.

  **Case 4: Half-Size Replication.** Step 4 triggers. The direction is same, but magnitude halved. The procedure treats effect size as part of the claim. If the effect shrinks >50%, the original estimate was inflated (the 'winner's curse'). **Verdict:** The original claim is functionally false. Do not run the original headline. Run a correction or a piece on "Why Science Changes". This teaches that initial findings are often optimistic guesses, not final truths.

  3. "Where it goes wrong"

  This procedure is blunt, and bluntness causes collateral damage. You will generate false negatives. Real breakthroughs often look rubbish initially; Penicillin would fail Step 2 because the mechanism was unknown. You will kill genuine novelty because it looks like noise.

  Furthermore, standards vary by field. Particle physics requires millions of observations; this procedure is calibrated for biology and psychology. Applying it to physics would reject everything. **[Judgement Call]** I am accepting false negatives to eliminate false positives. This is an ethical stance, not a mathematical truth. You are deciding that confusing a pupil is worse than boring them. If a study is expensive and rare (N=20 is all we have), this procedure still rejects it. You must be comfortable saying "we don't know yet" rather than guessing.

  4. "My calls"

  You asked for definite positions, so here they are.

  **Half-Size Replication:** This is a **Fail** on the original claim. Why? Because the original claim included the magnitude. "Tea helps" implies "Tea helps *this much*". If it helps half as much, the original advice was wrong. Teaching kids that "half right is right" encourages accepting inflated claims. It validates the winner's curse. Call it a failure of the original study to protect readers from exaggerated expectations.

  **p < 0.05 with N=20:** This should **Never** move your beliefs. It is statistically underpowered. It is likely a false positive or gross inflation. Treat it as noise until proven otherwise.

  **Final Stance:** Your magazine is for education, not news breaking. If you can't explain the uncertainty, don't print the claim. Better to be boring than wrong. You are building trust with your readers; once you teach them that science is shaky, you cannot easily teach them that it is reliable. Prioritise their long-term understanding over your short-term content needs.
