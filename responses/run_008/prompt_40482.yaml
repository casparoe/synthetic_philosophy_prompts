answer: |-
  This is a classic instantiation of the **Problem of Interpersonal Comparison of Utility (ICU)**, a debate that has haunted welfare economics and moral philosophy since the early 20th century. Maya is channeling a mix of logical positivism and behavioral skepticism (akin to Lionel Robbins), while Jonah is arguing from a commonsense realist and pragmatic tradition (akin to John Harsanyi or modern neuroethics).

  Here is the adjudication of the exchange, move by move, followed by what they missed and how you might actually resolve the thermostat war.

  ### Move 1: The Meaningfulness of Comparison
  **Maya:** Claims cross-person comparisons are meaningless because scales are private and uncalibrated.
  **Jonah:** Claims we make these comparisons constantly (triage, broken arm vs. stubbed toe).

  **Adjudication:** **Jonah wins on biology; Maya wins on strict logic.**
  Maya is philosophically consistent with the view that mental states are private. If "pain" is defined solely by first-person report, she is right: there is no "pain meter" that can measure your discomfort against your roommate's. However, Jonah is right that this view is biologically obsolete. We share nervous systems. If you both exhibit shivering, vasoconstriction, and elevated cortisol at 62 degrees, there is a *public, physical fact* about your physiological stress that is comparable. Maya's argument holds only if you are a dualist who believes comfort is purely spiritual; if comfort is physiological, Jonah is right that a "shared unit" (homeostatic deviation) exists.

  ### Move 2: Ordinal vs. Cardinal (The Policy Problem)
  **Maya:** Concedes coarse ordinal comparisons (A is worse than B) but argues they cannot support *addition* (policy requires cardinal utility).
  **Jonah:** (Implicitly argues that intensity rankings transfer).

  **Adjudication:** **Maya is technically correct; Jonah is practically dangerous.**
  Maya has identified a genuine mathematical hurdle. You cannot sum ordinal rankings. If you prefer 70° > 62°, and I prefer 62° > 70°, we have a conflict of orderings, but no way to calculate whose preference is *stronger* to justify overriding the other. Policy decisions (like taxation or triage) often implicitly assume cardinal utility (e.g., "relieving severe suffering is worth more than minor inconveniences").
  Maya is right that without a cardinal scale, you cannot do the utilitarian math Jonah wants to do. However, she is wrong that this makes policy impossible. It just means policy cannot be *strictly utilitarian* in the mathematical sense; it must rely on proxies, thresholds, or rights. Jonah's error is assuming that because we *make* the comparisons, the math underlying them is sound. It often isn't.

  ### Move 3: The Choice-Based Device
  **Jonah:** Proposes a "veil of ignorance" choice: If I had to choose which affliction to suffer, my choice reveals objective worse-ness.
  **Maya:** Objects that this only reveals my *anticipation* calibrated to *my* scale, not the other person's reality.

  **Adjudication:** **Maya sinks the device, but Jonah saves the utility.**
  Maya's objection here is devastating in theory. This is the "simulation heuristic" problem. When Jonah chooses between a migraine and a broken arm, he is simulating *Jonah's migraine* vs. *Jonah's broken arm*. He is not accessing *Maya's migraine*. If Maya has a lower pain threshold or a different neurological history, Jonah's choice is biased by his own physiology.
  *However*, because humans share 99.9% of their DNA and similar neurology, the error rate in this simulation is low enough for practical purposes. Maya is right that the device doesn't discover an *objective metaphysical fact*, but Jonah is right that it discovers a *reliable intersubjective consensus*. It works not because it bypasses calibration, but because our calibrations are similar enough to overlap.

  ### Move 4: Pragmatism vs. Truth
  **Jonah:** Argues that "no fact of the matter" is just cover for power; we must decide anyway.
  **Maya:** (Implied: We shouldn't pretend facts exist if they don't).

  **Adjudication:** **Jonah wins the moral point; Maya wins the semantic point.**
  Jonah is correct that in a zero-sum scenario (the thermostat is either 62 or 70), claiming "there is no fact" is functionally identical to letting the person with the most power decide. It creates a vacuum that power fills. Maya is right that acting *as if* there is a fact doesn't *make* there a fact. But Jonah's deeper point is that in social coordination, **functional truth is the only truth that matters.** If we act as if your discomfort is comparable to your roommate's, we can negotiate. If we act as if it is incomparable, we cannot. Therefore, for the purpose of living together, the comparison must be treated as factual.

  ---

  ### What Both of Them Are Missing

  **1. The Neuroscience of "Calibration"**
  Both argue as if we are still in the 1950s. Maya assumes scales are private; Jonah assumes we just guess. Modern neuroscience suggests we *can* calibrate. We can measure thermal comfort via skin conductance, heart rate variability, and metabolic rate. There *is* a fact of the matter about who is physiologically more stressed at 62 degrees. If your roommate is shivering and you are merely "uncomfortable," there is an objective physiological asymmetry. They missed the opportunity to move the debate from phenomenology ("how it feels") to physiology ("what the body is doing").

  **2. Non-Utilitarian Solutions**
  Both assume the dispute must be resolved by weighing suffering (utilitarianism). Maya says we can't weigh it; Jonah says we can. They both miss that **rights and procedures** often trump utility.
  *   **Rights:** Who signed the lease? Is there a medical necessity (e.g., Raynaud's syndrome vs. preference)?
  *   **Procedure:** Can the temperature vary by time of day? Can the roommate wear a sweater? Can you use a space heater in their room and keep the common area at 62?
  The dispute isn't a math problem to be solved; it's a coordination problem to be managed.

  **3. Adaptive Preferences**
  They ignore that utility scales are not static. Humans acclimate. If the thermostat is set to 66, the person who wanted 70 will be cold for a week, then their baseline will adjust. Jonah treats the scales as fixed rulers; Maya treats them as incommensurable. Neither treats them as *adaptable*.

  ---

  ### The Verdict on Your Thermostat

  Philosophically, **Jonah is more useful, but Maya is more rigorous.** You cannot live in Maya's world (where no compromise is possible because no comparison is valid), but you should not trust Jonah's math (which assumes your suffering is easily summable against his).

  **Practical Adjudication:**
  1.  **Reject the "No Fact" Claim:** Maya is wrong that there is *no* fact. There is a physiological fact. If one of you has a medical condition, that person's "unit" of discomfort weighs heavier objectively (health risk vs. preference).
  2.  **Reject the "Pure Sum" Claim:** Jonah is wrong that you can simply add up the discomfort. A minority suffering intensely often trumps a majority suffering mildly, regardless of the "sum."
  3.  **The Solution:** Move away from utility comparison and toward **asymmetric mitigation**.
      *   Set the central thermostat to a neutral middle (e.g., 66).
      *   The person who runs hotter (you) uses lighter bedding/clothing.
      *   The person who runs colder (roommate) uses a space heater in their private room or wears layers in common areas.
      *   **Why:** This acknowledges that while we can't perfectly compare your internal scales, we can objectively observe that *local heating* is more energy-efficient and targeted than *central heating*.

  **Final Ruling:** Jonah wins the debate on the grounds that life requires action, but Maya wins the caution that you should not trust your intuition about his suffering too much. Measure the physiology, not the philosophy.
