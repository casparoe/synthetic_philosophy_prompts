answer: |-
  Here is the principle that sorts your cases. I call it **The Principle of Consented Attribution.**

  It relies on two filters: **Consent to the Frame** (did you agree to enter this emotional simulation?) and **Accuracy of Attribution** (are you directing the consequence of the emotion toward the actual source of the stimulus?).

  Here is how it sorts your "Fine" from your "Not Fine," followed by the honest assessment of where your own verdicts might need adjusting.

  ### The Principle Explained

  **1. Consent to the Frame**
  You are allowed to feel anything inside a "magic circle" you voluntarily stepped into (a movie theater, a book, a game). Inside that circle, logic is suspended. You *consented* to be scared, sad, or tense.
  *   **The Dream Exception:** You do not consent to your dreams. They happen *to* you. Therefore, the "magic circle" protection is weaker. You are responsible for dissolving the frame immediately upon waking.

  **2. Accuracy of Attribution**
  Emotions generate energy that wants to go somewhere (action, judgment, words). That energy must be directed at the **Agent** who caused the stimulus.
  *   **The Author:** They made the choice to kill the character. They are the Agent. Anger at them is accurate attribution.
  *   **The Actor:** They read lines. They are not the Agent. Anger at them is inaccurate attribution.
  *   **The Wife:** She slept beside you. She is not the Agent of your dream. Anger at her is inaccurate attribution.

  ### Applying the Principle to Your Cases

  **The "Fine" Cases**
  *   **Crying/Jumping/Rewatch Tension:** You consented to the movie. The tension stays *inside* the frame (you don't call the police during the thriller). The attribution is correct (you are reacting to the craft of the film).
  *   **Hating the Author (Privately):** You didn't like their creative choice. They are the Agent. As long as it doesn't become harassment (leaving the frame), this is accurate attribution.
  *   **Mom/ Friend Avoiding Sad Media:** This is a refusal of **Consent**. They are protecting their real-world emotional bandwidth. This is healthy boundary setting.
  *   **The Kid and the Monster:** The kid is scared (involuntary), but the "check" is a ritual of **Co-Regulation**. The parent consents to the role of "monster checker" to help the kid close the frame. This is fine because it's developmental and consensual for the parent.

  **The "Not Fine" Cases**
  *   **Anger at the Wife:** You did not consent to the dream. Upon waking, you failed to dissolve the frame. You directed the consequence (being short at breakfast) at a target (Wife) who had zero **Agency** over the stimulus. This is inaccurate attribution.
  *   **Abusing the Actor:** You consented to the movie, but you directed the consequence at a target (Actor) who had zero **Agency** over the stimulus. This is inaccurate attribution.
  *   **The "True Story" Fakeout:** This is a breach of **Consent to the Premise**. You consented to cry based on the premise "This happened." When you learned "This did not happen," the contract was broken. Your feeling that the emotion was "on false pretenses" is valid because the *context* was a lie, even if the tears were real.

  ### The Honest Correction: Where Your Verdicts Flip-Flop

  You asked me to be honest about which verdicts the principle can't save. There are two places where your intuition is fighting itself, and the principle suggests you need to adjust your view.

  **1. The Dream vs. The Rewatch**
  You said: *"The dream one and the movie one keep feeling like the same case to me."*
  Biologically, you are right. In both cases, your amygdala fired at a non-existent threat.
  *   **The Adjustment:** The *feeling* of dream-anger is **Fine**. It is involuntary neurochemistry, just like the jump scare. You cannot control the dream.
  *   **The Verdict Change:** What was "Not Fine" was not the anger; it was the **export**. If you had woken up, felt the surge of adrenaline and rage, recognized it as dream-residue, and let it pass without speaking to your wife, that would be "Fine."
  *   **Why it differs from the Rewatch:** In the rewatch, the stimulus (the movie) is still playing. In the dream, the stimulus is gone, only the target remains. Holding onto the emotion after the stimulus vanishes is where the error lies.

  **2. The "True Story" Cheapening**
  You said: *"My memory of crying at it now feels cheapened somehow."*
  *   **The Adjustment:** The *crying* was not cheap. The *trust* was broken.
  *   **The Verdict Change:** You are conflating the validity of the emotion with the validity of the premise. Crying at a lie is still crying. The "cheap" feeling is actually **betrayal**, not regret over the sadness. You should forgive yourself for crying; the screenwriter is the one who failed the "Accuracy of Attribution" test by lying about the source material.

  ### Summary
  *   **Fine:** Feeling real emotions inside a consented frame, or directing frustration at the person who actually made the creative choice.
  *   **Not Fine:** Exporting the consequences of a fictional emotion onto a real person who didn't write the script, or holding onto the emotion after the stimulus has vanished (the dream hangover).

  **The Kid Case:**
  Under this principle, the kid is **Fine**. They lack the capacity to fully distinguish the frame, and they are using a consensual adult to help them close it. It only becomes "Not Fine" if the adult refuses to check and the kid punishes the adult for the monster's existence (inaccurate attribution).

  **Final Verdict on Your Flip-Flop:**
  You are judging yourself too harshly for the *dream feeling*, and too leniently for the *true story deception*.
  1.  Forgive the dream anger (it was a chemical glitch), but own the breakfast behavior (that was a choice).
  2.  Validate the tears at the "true story" (they were real), but blame the liar for the cheap feeling (the context was fake).
