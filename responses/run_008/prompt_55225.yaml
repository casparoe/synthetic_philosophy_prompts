answer: |-
  This is an exceptionally sharp observation. You have put your finger on the central tension in the philosophy of science: the conflict between how science *works* (which looks like cumulative progress toward a real world) and how history shows science *changing* (which often looks like discontinuous shifts in perspective).

  You asked for a reconstruction of the implicit picture, an assessment of whether it forces a specific metaphysics, and a candid admission of where that reconstruction might fail. Here is that attempt.

  ### 1. The Label and Its Status
  The philosophical term for "false but nearly right" is **verisimilitude** (or truth-likeness). Karl Popper tried to formalize this in the 1960s, arguing that we can compare false theories based on their content of truth versus content of falsehood.

  However, you should know that Popper's formal definition was mathematically refuted in the 1970s (by David Miller and Pavel Tichý). They showed that, strictly logically, a false theory cannot be "closer" to the truth than another false theory without running into contradictions. Despite this, the *intuition* of verisimilitude survives robustly in scientific practice. Most philosophers now talk about **Approximate Truth** or **Convergent Realism**. They accept that while we can't easily define "distance from truth" logically, the practice of science seems to require us to act *as if* such a distance exists.

  ### 2. The Realist Reconstruction (The Physicist's Implicit View)
  When physicists say Newton is "incomplete" but Descartes' vortices are "wrong," and that Einstein "reduces" to Newton at low speeds, they are implicitly committing to a view called **Structural Realism**.

  Here is the picture:
  *   **Reality is fixed:** There is a mind-independent world with a specific structure.
  *   **Theories are maps:** A theory is a representation of that structure.
  *   **Preservation of Structure:** When a theory is superseded (Newton by Einstein), the *entities* might vanish (absolute time), but the *mathematical structure* is preserved in a specific limit. Newton's equations aren't just useful fictions; they capture a slice of the real structural relationships of the universe.
  *   **The "Distance" Metric:** The "size" of an anomaly measures the deviation between the map and the territory. A small anomaly suggests a local correction; a large one suggests the map projection itself is wrong.

  **Does this practice require this metaphysics?**
  Strictly speaking, no. But it makes the practice *intelligible* in a way alternatives struggle to match. This is the **No Miracles Argument**: If Newtonian mechanics didn't latch onto *something* real about the universe, its ability to predict planetary motion for 200 years would be a miracle. The realist says the only non-miraculous explanation for the success of successive theories is that they are progressively latching onto the actual structure of reality.

  ### 3. The Anti-Realist Reconstruction (The Historian's View)
  Your historian contact is likely channeling Thomas Kuhn (paradigm shifts) or Bas van Fraassen (Constructive Empiricism). Can they account for the physicists' practice? Yes, but they have to translate the language.

  *   **Theories are Tools, not Maps:** A theory isn't true or false; it is *empirically adequate* or *inadequate*. It saves the phenomena.
  *   **"Wrong" vs. "Incomplete":** To an instrumentalist, Descartes' vortices were "wrong" because they failed to generate reliable calculations for specific problems. Newton was "incomplete" because his tool broke when used in high-speed regimes.
  *   **"Closer to Truth":** This is translated as "Wider Domain of Reliability." Einstein isn't "truer"; his toolkit works in more situations (high speed and low speed) than Newton's.
  *   **Teaching Newton:** We teach Newton first not because it's "approximately true," but because it is the most cost-effective tool for the scale of human experience.

  **Where this view struggles:**
  The anti-realist has a hard time explaining *why* the tools fit together so neatly. Why does the "low speed limit" of the Einstein tool match the "normal speed" Newton tool so perfectly? The realist says: "Because they are describing the same reality." The anti-realist must say: "Because we calibrated them to overlap." The latter can feel like it ignores the uncanny coherence of mathematical physics.

  ### 4. Where the Practice Forces a Metaphysics (and Where it Doesn't)
  You asked where the practice is underdetermined and where it forces a hand.

  **Underdetermined (Both views work):**
  *   **Pedagogy:** Teaching Newton first is compatible with both views. Realists say "it's approximately true." Instrumentalists say "it's useful." The classroom action is the same.
  *   **Rejecting Rivals:** Dismissing a 1990s framework because it doesn't match data works for both. Realists say "it's false." Instrumentalists say "it's empirically inadequate."

  **Forcing a Hand (Realism has the edge):**
  *   **Theoretical Prediction:** When a theory predicts a phenomenon *before* it is observed (e.g., the Higgs boson, or the precession of Mercury), Instrumentalism struggles. If the theory is just a tool for organizing *known* data, why does it work for *unknown* data? Realism explains this easily: the theory latched onto a real mechanism that necessitates the new data.
  *   **Inter-theoretic Reduction:** The fact that Newton's laws can be mathematically derived from Einstein's (in the limit $v/c \to 0$) is strong evidence for Structural Realism. It suggests the older theory wasn't just a different tool; it was a sub-structure of the deeper theory. An instrumentalist has to treat this as a happy coincidence of calibration.

  ### 5. The Historian's Objection (Incommensurability)
  The historian who told you "successive theories don't get closer" is likely invoking **Incommensurability**.
  The argument is that "mass" in Newton's theory and "mass" in Einstein's theory *mean different things*. Newtonian mass is invariant; Einsteinian mass is relative to energy. If the terms change meaning, you can't say the second theory is "closer" to the truth of the first, because they are talking about different conceptual worlds.

  **Does this comparison do real work?**
  Yes. If physicists believed the historian strictly, research would stall. If there is no sense in which we are "converging," then funding a collider to "find the truth" is unjustified. You would only fund colliders to "find new tools." The *rhetoric* of convergence is a functional necessity for the sociology of science, even if the *metaphysics* is debatable.

  ### 6. Where My Reconstruction Might Go Wrong
  I am presenting this as a clean dichotomy between Realism and Instrumentalism. That is likely where I am most vulnerable to criticism from a specialist.

  1.  **The "Singular Limit" Problem:** I claimed Newton's laws are derived from Einstein's. Mathematicians and philosophers of physics (like Robert Batterman) argue this is often false. The transition from quantum to classical, or relativistic to Newtonian, often involves mathematical singularities where the reduction breaks down. If the old theory doesn't mathematically emerge from the new one, the "convergence" story loses its strongest technical support.
  2.  **Entity Realism vs. Theory Realism:** I might be conflating belief in the *equations* with belief in the *entities*. A physicist might believe electrons are real (Entity Realism) while believing the Standard Model Lagrangian is just a temporary calculation device (Theory Anti-Realism). My reconstruction assumes they treat the whole package similarly.
  3.  **The "Pessimistic Meta-Induction":** This is the strongest argument against me. History is a graveyard of theories that were "empirically adequate" and "structurally coherent" but turned out to be utterly false (e.g., the caloric theory of heat, or the luminiferous aether). These theories also "worked" and reduced to earlier approximations. If every past theory we thought was "approximately true" turned out to be "completely false," what justification do we have for thinking the current ones are "approximately true"? I have not given this objection enough weight.

  ### 7. What Would Change My Mind
  If I were writing this for print, I would need to flag that my confidence in the "Structural Realist" interpretation rests on two fragile pillars. I would change my mind if:

  1.  **Demonstration of Discontinuity:** If a future theory replaces the Standard Model but does *not* reduce to it in low-energy limits (i.e., the Standard Model turns out to be a dead end, not an approximation), the "convergence" narrative collapses. Some approaches to Quantum Gravity (like Loop Quantum Gravity vs. String Theory) risk this. If the next theory doesn't look like a generalization of the current one, the "distance from truth" metric vanishes.
  2.  **Success of "False" Ontologies:** If a theory based on an ontology we currently deem "impossible" (e.g., explicit superdeterminism or a return to absolute time) turned out to yield better predictions than our current "realist" best-guess, it would suggest that "structural convergence" is not the path to utility.

  ### Summary for your Article
  You can report that physicists operate as **pragmatic realists**. They act *as if* theories are approximations of a fixed reality because that heuristic drives successful research. However, this is not a proven metaphysical fact. It is a methodological commitment.

  The historian is right that we cannot *prove* we are getting closer (the Pessimistic Meta-Induction). The physicist is right that we cannot *work* without assuming we are (the No Miracles Argument).

  The "false but nearly right" claim is not a logical deduction; it is a wager. The field wagers that the mathematical structure of current theories captures the skeleton of reality, even if the flesh changes. That wager is not guaranteed to pay out, but it is the only wager that has ever produced a dividend.
