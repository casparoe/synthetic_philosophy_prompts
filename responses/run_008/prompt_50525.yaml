      *   *Tension B: Neuron Proxy (3) vs. Pain Consistency (5).* If neuron count determines status (3), but pain intensity (the basis of status per 1) doesn't scale with neurons in mammals (5), what exactly is scaling? If pain is conserved, why is an elephant's death worse than a mouse's (per 2)?
      *   *Tension C: Human Equality (4) vs. AI Superiority (6).* If humans are "full and equal" (often implying a ceiling or special sanctity), how can an AI exceed them? If AI can exceed humans, why can't some humans exceed other humans (violating 4)? Or why can't some animals exceed some humans (violating 4's "itchiness")?
      *   *Tension D: Sentience Basis (1) vs. Neuron Proxy (3).* Neurons correlate with processing power, not necessarily sentience/hedonic capacity. A rock has 0 neurons, but does a worm have *more* moral status solely because of neurons if the *quality* of suffering is the same? (This is linked to Tension B).

