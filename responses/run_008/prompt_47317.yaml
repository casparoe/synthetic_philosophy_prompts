answer: |-
  Thanks for reaching out and sharing where your head is at before you start the postdoc. It is a smart move to think strategically about this now rather than stumbling into the first interesting paper that crosses your desk, especially given the two-year clock. You are asking the right questions about upstream versus downstream problems and tractability, and I am happy to give you my candid take on the landscape as it stands right now. I have watched the higher-order evidence debate evolve from its initial explosion into something a bit more settled, and while it remains a vital part of contemporary epistemology, there are definitely pockets where the marginal returns on investment have dropped significantly.

  To be direct about the akrasia question and the peer disagreement literature, I think you should treat those as low priority unless you have a very specific technical breakthrough in mind. The debate over whether it is rational to be akratic has become somewhat exhausted in the sense that the positions are well-defined and the counterexamples are well-known. We have reached a stage where progress often looks like verbal disputes over the definition of rationality rather than substantive advances in understanding the structure of evidence. You mentioned worrying about treadmill debates, and this is unfortunately where a lot of the akrasia literature currently sits. People are restating the same intuitions about cases with slightly different terminology. Unless you are prepared to bring a powerful formal model that dissolves the tension rather than just taking a side on whether akrasia is ever permissible, you risk spending six months writing a paper that will be read as just another entry in a crowded catalog. The same applies to the question of whether conciliationism is a special case of higher-order evidence. That connection has been mined extensively. While it is always possible to find a new angle, the low-hanging fruit there was picked years ago, and climbing higher requires a level of formal sophistication that might consume your entire postdoc without guaranteeing a clear result.

  This brings me to your idea about deference to another agent, whether an expert, a model, or a committee. You asked me to be direct if this is half-baked, and my honest assessment is that it is the most promising avenue you listed, provided you frame it correctly. The reason I say this is not just because it sounds novel, but because it leverages your background in testimony. Most of the existing higher-order evidence literature assumes a kind of transparency where the agent can inspect the reasoning process they are evaluating, or at least treat their own past self as a peer whose reasoning structure is accessible. When you defer to an expert or an algorithm, you often lack access to the first-order reasoning entirely. You are not just getting evidence about your evidence; you are getting a output without the derivation. This creates a structural opacity that standard higher-order evidence models do not handle well. If you treat this as just another version of expert disagreement, you will lose what is unique about it. But if you model it as a problem of integrating opaque outputs into a rational credence function without the usual conditionalization tools, you are hitting an upstream problem. This is tractable because it forces you to build or adapt a model rather than just arguing about cases. It also allows you to publish work that speaks to both the testimony crowd and the formal epistemology crowd, which widens your audience.

  Regarding the downstream applications you mentioned, such as discounting credences after learning about drug testing or biased data, I would advise you to treat these as test cases for your core theoretical work rather than the main event. There is a temptation to write a paper on AI bias or sleep deprivation because it feels timely and impactful, but if the theoretical engine underneath is just standard higher-order evidence machinery, the paper will age poorly. However, if you develop a framework for opaque deference, applying it to algorithmic bias becomes a powerful demonstration of that framework. The key is to ensure the application is driving the theory or vice versa, not just plastering a new example onto an old model. Given your two-year timeline, I would suggest spending the first year solidifying the deference model and the second year working out the applications, perhaps specifically focusing on how this applies to machine learning models where the opacity is literal rather than just practical. This gives you a coherent narrative for your research statement when you go on the market again.

  You mentioned having a decent but not overwhelming background in formal epistemology, and this is a crucial constraint to keep in mind. The defeat and stepping-down questions are deeply technical. If you try to solve the general problem of how credences should revise in light of higher-order evidence using standard Bayesian updating, you will run into the problem of commutativity and order dependence very quickly. There are existing models that handle this, but engaging with them critically requires a high level of comfort with probability theory. If you are not fully confident there, do not try to out-formalize the formalists. Instead, use your strength in conceptual analysis and testimony to constrain the formal models. Ask what the normative requirements are for deference in the absence of access, and let that guide the formal work. You might collaborate with someone who has stronger formal skills if your institution allows it, but for a two-year project, you want something you can drive yourself. The deference angle is conceptually rich enough that you can make progress with moderate formal tools, whereas the pure akrasia debate often demands extreme precision in definitions that leads to the verbal disputes I warned you about earlier.

  So if I were to prioritize this for you, I would tell you to put the deference idea at the center of your research agenda. It is upstream because it clarifies what kind of evidence higher-order evidence actually is when the source is external and opaque. It is neglected because most people working on higher-order evidence come from a personal identity or rationality background, not a testimony background, so they miss the structural disanalogy between evaluating your own reasoning and accepting an expert's verdict. It is tractable because you can generate concrete results about when deference is rational without needing to solve the entire problem of akrasia. I would stay away from the general akrasia question unless a specific puzzle arises within the deference work that forces you to address it. Similarly, treat the peer disagreement literature as background context rather than a primary target. You do not need to solve the disagreement debate to make progress on opaque deference, and trying to do so will dilute your focus.

  One final thought on what would change my mind about this ordering. If you find during your first few months of reading that a new formal model has been published that fundamentally changes how we handle higher-order evidence, specifically regarding opacity, then you should pivot to engaging with that. But as of now, the field is waiting for someone to bridge the gap between the testimony literature and the higher-order evidence literature. You are uniquely positioned to do that because of your dissertation work. Do not view your dissertation topic as something you are leaving behind; view it as the unique lens through which you can refresh a conversation that is in danger of becoming stale. The risk with the deference idea is that it becomes too vague, so you must discipline yourself to define exactly what opaque deference means and how it differs from standard testimony. If you can pin that down, you will have a productive two years. If you cannot, you will find yourself back in the treadmill debates you are wisely trying to avoid. I think you can pin it down, and if you do, you will have a much stronger portfolio than if you produced another paper on whether akrasia is ever rational. Good luck with the start of the position, and feel free to bounce drafts off me once you have something concrete on the page.
