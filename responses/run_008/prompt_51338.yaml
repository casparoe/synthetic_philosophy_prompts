answer: |-
  Dear friend,

  It is completely understandable that you feel frustrated, because your reading group colleague is indeed asking Williams's famous phrase to do far too much work. She is treating a nuanced critique of impartial moral theory as a blunt instrument to shield personal conduct from scrutiny. To see why this is a misapplication, we need to disentangle the specific claims hidden inside that slogan, because they operate at different levels of moral psychology and justification.

  The first claim is psychological or phenomenological, concerning what actually goes through the mind of a virtuous or loving person at the moment of action. On this reading, Williams is suggesting that if you truly love someone, the thought of weighing their value against a stranger's simply does not occur to you. You just act. While this is a powerful image, it is psychologically implausible as a universal rule. Human beings are complex, and even deeply loving agents can experience momentary conflicts of duty or hesitation without ceasing to be loving. Furthermore, even if this were true, it describes a state of mind during an emergency, not a rule for retrospective reflection. Your question about the family dispute was asked after the fact, not during a drowning crisis. Therefore, this psychological claim does not support your friend's attempt to stop you from deliberating now, since it only describes what ideally happens in the moment, not what is permissible to ponder later.

  The second claim concerns appropriate grounds or explanation. This is the view that while you might have deliberated, the only acceptable justification you can offer afterwards is the personal one, such as she was my sister. Williams argues that appealing to an impartial principle as the ultimate justification alienates you from the project of the relationship. This claim is quite plausible; it captures the intuition that love provides its own reasons that do not need to be cashed out in universal currency. However, this is a claim about the final output of justification, not the internal process of decision-making. You can weigh the grievances, find them equal, and still decide based on the relationship. Your friend is using this to forbid the weighing process itself, but Williams only objects to making the impartial principle the decisive reason. Consequently, this interpretation does not support silencing your question, because asking whether you were wrong is not the same as offering an impartial justification for your action.

  The third distinction lies between decision procedures and criteria of rightness. Some moral theories allow that impartiality is the test of whether an act is right, even if it should not be the procedure used to decide what to do. Williams goes further and attacks impartiality as the criterion of rightness itself, arguing that some actions are right precisely because they are partial. This is a substantive and controversial philosophical claim, not a trivial one. However, even if we accept Williams's view that impartiality is not the supreme criterion, it does not follow that thinking about impartiality is forbidden. It merely means that impartial considerations should not override personal ones. Your friend is using the phrase to suggest that the mere presence of impartial thought corrupts the action, whereas Williams is arguing that impartial thought should not have sovereignty. This distinction undermines her usage, because you are allowed to consider impartial factors as long as you do not let them veto your personal obligations.

  The fourth claim is about what the act of deliberating itself does to the relationship or reveals about the agent's character. This suggests that treating a loved one's claim as something to be weighed alongside a stranger's objectifies them and damages the bond. There is some plausibility here; if you treat your sister as a mere case study in justice, you may fail to honor the special status of the relationship. Yet this claim relies on the deliberation becoming the motive for action. Merely questioning whether you acted correctly, especially in a complex family dispute where grievances might be serious, does not necessarily reveal a lack of care. It can reveal a desire to be fair within the bounds of loyalty. Your friend treats the questioning as evidence of a character flaw, but questioning is often a sign of moral seriousness rather than alienation. Thus, this claim only supports her usage if we assume that any reflection implies a lack of love, which is a substantial overreach.

  When you pull these threads apart, it becomes clear that none of them justify using the phrase to shut down deliberation before it starts. Williams was arguing against a specific kind of moral theory that demands we justify our deepest projects from an external, impartial standpoint. He was not arguing that we should never reflect on whether our partiality has gone too far or become unjust. Your friend is using the concept to create a protected zone where personal actions are immune from ethical questioning, but Williams's point was about the source of justification, not the impossibility of scrutiny. You are well within your rights to ask whether your loyalty was misplaced, provided you acknowledge that the relationship itself carries weight. The thought is only too many if it is allowed to cancel the love, not if it seeks to understand how that love should live alongside justice.

  Best wishes
