      Dan has already exited the game effectively. You and Priya are playing a repeated Prisoner's Dilemma. If you commit to non-cooperation, you signal you're unreliable. Even if Priya agrees to a rota, she'll resent you. Plus, hygiene affects everyone.

      Instead, hold back. Committing publicly removes your ability to compromise. You want to appear flexible but firm on fairness. Propose a temporary rota until June. Acknowledge Dan's exit but emphasize that hygiene is non-negotiable for health. Offer to take a larger share temporarily in exchange for something else, or suggest a cleaning fund. Don't lock yourself into a corner. The goal isn't to "win" the negotiation, it's to secure a livable environment. If you burn bridges, you might win the battle but lose the war (living conditions).

