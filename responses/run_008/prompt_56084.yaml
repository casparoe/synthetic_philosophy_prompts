prompt: |-
  So my flat has gotten into this standoff and I want a sanity check on whether the move I'm considering tonight is clever or a terrible idea. Background: three of us share a flat, and for most of the year my flatmate Priya has done basically all the cleaning. Last week she finally snapped and posted in our flat group chat — very public, witnesses and everything — that she's done picking up after everyone and will not touch one single shared surface until we agree to a rota where she does the least. Fair enough honestly. But then my other flatmate Dan responded the next morning by announcing he's deffinitely moving out in June no matter what happens, and he's already put down a deposit on another place, so he refuses to join any rota "on principle" since he's leaving anyway. Which now kind of leaves me and Priya staring at each other while the kitchen gets worse.

  Here's my dilemma. I'm taking a game theory course this term and something about "burning your bridges first" keeps nagging at me. I could make my own big public commitment tonight — like tell everyone I've bought my own set of dishes that only I will ever wash, and that I will never clean a shared thing again under any arrangement. The idea would be to lock in my position before Priya and I sit down to negotiate the rota, so whatever deal gets made, I've already got a hard floor. It feels like there's a first-mover advantage here — whoever commits first shapes the whole negotiation. But there's also this nagging sense that if all three of us keep irrevocably locking ourselves in, we end up in a flat where nobody ever cleans anything for the next four months, which is worse for literally everyone, including whoever "won." So: is making my public, hard-to-reverse commitment tonight the rational move? Or should I hold back — and if I should, how do I avoid just getting stuck with the worst rota because everyone else already tied their hands? Keep it under 350 words.
