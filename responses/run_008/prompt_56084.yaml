  2.  **Evaluate the Game Theory:**
      *   **Burning Bridges:** This is a strategic move to limit one's own options to force the other party's hand. It works if the threat is credible and the other party cares about the outcome more than you do.
      *   **The Trap:** If Dan has already burned his bridge (leaving, no rota) and User burns theirs (no cleaning), Priya is left with only two choices: clean everything or live in filth.
      *   **Nash Equilibrium:** If everyone commits to not cleaning, the outcome is mutual defection (filthy flat). This is a Prisoner's Dilemma/Chicken game scenario.
      *   **Rationality:** It's likely a terrible idea. It escalates conflict, destroys relationships, and leads to the worst collective outcome (hygiene issues, conflict). It assumes Priya will cave, but she's already shown a willingness to snap. She might just let it get filthy too, or kick the User out (if lease allows), or make life miserable.
      *   **First-Mover Advantage:** In coordination games, yes. In cooperation dilemmas, often no. Committing to *not* cooperate usually invites retaliation or collapse.

  3.  **Determine the Advice:**
      *   **Verdict:** Terrible idea.
      *   **Reasoning:** It turns a coordination problem into a war of attrition. Dan already defected; if you defect too, Priya has no incentive to cooperate. You risk a "race to the bottom" (filth).
      *   **Alternative:** Don't burn bridges. Keep flexibility. Negotiate based on mutual benefit. Acknowledge Dan's exit but argue for interim fairness. Offer a temporary rota until June.

