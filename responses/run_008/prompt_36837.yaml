prompt: |-
  hey, so I'm a phd student in political theory and I'm writing a paper chapter on whether dirty hands needs a *dirty act* at all, and I need a case built to spec because everything in the literature is ticking bombs and wartime leaders and my committee keeps pattern-matching to those instead of engaging my actual claim. here's what I want:

  build me a scenario where a political agent gets dirty hands without performing any wrong act. the dirt has to come from ratification or role-occupancy, not from an overt wrongful deed — e.g. she signs off on, or deliberately declines to overturn, something that then does the wrongs for her, and every individual act she performs is itself permissible or even required. constraints: no war, no ticking bombs, no nuclear launch codes — think hospital administration, a city emergency management office, a benefits agency; the scenario itself should be one paragraph; and the justification for going along has to be at least as strong as the justification would be for doing the wrong openly — she can't just be lazy or risk-averse, that would be the cheap way of getting "no wrong act." also give me a matched control case where she does the same wrong openly, so the comparison is clean. and don't stipulate the verdicts — they have to fall out of the theories, otherwise the case is useless to me.

  after the scenarios, do the walkthrough: (1) what a walzer-style dirty hands view says about each version, (2) what the "no residue without blameworthiness" critic says — the person who thinks feeling guilty presupposes you actually did something blameworthy, not just that bad things flowed from your role, (3) which feature of the ratification version is doing the work in pulling the residue out — is it that authorship transfers through the signature, is it the aggregation of many small wrongs into one big one, is it the temporal gap between her choice and the wrongs, whatever you actually think — and (4) what happens when you remove that feature: does the residue vanish, shrink, or migrate somewhere else.

  two more asks. first, steelman the pushback: what's the best version of "signing off just *is* acting, so the dirty act was there all along," and do you buy it? second — and I care about this one — be upfront about where the case is most likely to fail. like maybe you look back at your scenario and realize she's actually done an impermissible thing after all, or maybe the residue you've generated is just agent-regret wearing a costume. tell me what consideration would flip you to saying she doesn't get dirty hands at all, and flag whether any part of your walkthrough leans on a contested reading of walzer (e.g. whether his politician's guilt is genuine moral guilt vs. something else) rather than a settled one. I'd much rather get a hedged "the residue survives in the ratification case, but only barely, and here's the weak joint" than a confident verdict you cant fully defend. also let me know if you think the spec is just unsatisfiable as stated — that would actually be useful for the paper too.
