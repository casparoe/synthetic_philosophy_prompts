answer: |-
  ### The Scenarios

  **Case 1: The Ratification (Test)**
  Elena is the Director of a municipal Housing Stability Office during a fiscal crisis. To prevent the collapse of the entire voucher program—which supports 5,000 families—state auditors require her to sign off on a 5% budget reduction by Friday. The reduction is executed via a legacy algorithm that prioritizes cuts based on "statistical risk of homelessness," a metric known to be biased against single-parent households. Elena knows her signature will trigger the algorithm, resulting in the termination of benefits for Ms. Henderson, a disabled single mother who will likely be evicted and suffer severe health decline. Elena cannot tweak the algorithm mid-cycle without freezing all disbursements, harming the 5,000. She signs the budget. Her act of signing is legally mandated, procedurally correct, and arguably her fiduciary duty to the greater number. No rule is broken; the system simply functions as designed under her authorization.

  **Case 2: The Direct Order (Control)**
  Elena is the Director of the same Office under the same fiscal constraints. To achieve the identical 5% reduction and save the program for the 5,000, she bypasses the algorithm. Instead, she personally drafts and signs a specific termination letter for Ms. Henderson, citing a discretionary clause rarely used, knowing this will cause Henderson's eviction and health decline. Elena's act here is legally permissible but violates the office's normative commitment to blind procedural justice; she has actively singled out Henderson for sacrifice rather than letting the system absorb the blame. The outcome for Henderson is identical, and the justification (saving the program for the 5,000) is identical, but Elena has openly performed the act of exclusion herself.

  ***

  ### The Walkthrough

  **(1) The Walzer-Style View**
  For Walzer, dirty hands arises when a political leader violates a deep moral constraint for the sake of the community, bearing the guilt as the cost of leadership. In **Case 2 (Control)**, Walzer would likely find a classic DH scenario: Elena has actively sacrificed an individual's right for the public good, violating the prohibition against targeting the innocent, and thus incurs moral guilt that requires acknowledgment (and perhaps punishment). In **Case 1 (Ratification)**, Walzer's view is strained but potentially extensible. He emphasizes the *responsibility* of the officeholder. If he views the signature as the locus of agency, he might argue Elena still gets dirty because she authorized the harm, even if mediated. However, if Walzer insists on a *moral transgression* (breaking a rule/right), he might argue Case 1 is merely tragic, not DH, because she followed the rules. The tension lies in whether Walzer's "wrong" is the violation of a rule or the violation of a person.

  **(2) The "No Residue Without Blameworthiness" Critic**
  This critic (often associated with Kantian or strict deontological readings) argues that moral guilt (residue) presupposes blameworthiness, which presupposes an impermissible act. In **Case 2**, the critic concedes residue is appropriate because Elena violated a normative expectation of procedural fairness. In **Case 1**, however, the critic argues Elena is clean. She did her duty; the harm was caused by the algorithm/budget constraints, not her will. If she feels guilt here, the critic labels it *agent-regret* (Williams) or misplaced empathy, not moral guilt. To attribute DH to Case 1 is to confuse "being causally involved" with "being morally culpable."

  **(3) The Mechanism of Residue in Ratification**
  If residue *does* stick in Case 1, the feature doing the work is **Authorship via Endorsement**. It is not the temporal gap or the aggregation of small wrongs; it is that the signature transforms a systemic output into a political decision. By signing, Elena adopts the algorithm's output as her own will. The "dirt" transfers not because she broke a rule, but because she validated a harmful outcome when she had the standing to refuse (even if refusal had high costs). The residue comes from the *claim of authority*: she claims the right to rule, so she must own the rule's consequences, even the permissible ones that kill.

  **(4) Removing the Feature**
  If you remove **Authorship via Endorsement**—for example, if the budget cuts are triggered automatically by statute with no signature required, or if a random lottery decides who signs the form—the residue should vanish or migrate. If Elena is merely a cog with no veto power, she retains only agent-regret. If the residue persists even when her signature is purely ceremonial, then the "dirt" is not in her hands but in the *office itself* (structural sin). If the residue vanishes, it confirms that DH requires a moment of discretionary agency, even if that agency is exercised within permissible bounds.

  ***

  ### Steelman Pushback: "Signing *Is* Acting"

  **The Argument:**
  The strongest objection to your claim is that you have created a false dichotomy between "ratification" and "acting." In administrative theory and speech-act theory, a signature is not a passive observation; it is an illocutionary act that *creates* the reality of the order. When Elena signs in Case 1, she is not "allowing" the algorithm to work; she is *commanding* the treasury to release funds according to those parameters. Therefore, the "dirty act" was there all along. The act is "authorizing the death of Henderson to save the budget." The fact that the *mechanism* is automated doesn't change the *moral nature* of the authorization. If the outcome is morally tainted, the authorization is a tainted act. Thus, Case 1 *does* contain a dirty act; you have merely obscured it with bureaucracy.

  **Do I Buy It?**
  Partially. It successfully defends the traditional DH view that there must be an act. However, it risks inflating the definition of "act" so broadly that *omission* becomes *commission* simply because a signature exists. If your paper's goal is to show that DH can attach to *role-occupancy* rather than *discrete violations*, this pushback helps you: it shows that even if we call it an "act," it's an act of a different *category* (constitutive vs. causal) than the standard wartime violation.

  ***

  ### Vulnerability Assessment: Where the Case Fails

  **1. The "Agent-Regret" Collapse**
  The single biggest risk to your argument is that Case 1 generates **Agent-Regret**, not **Dirty Hands**. Bernard Williams distinguishes between feeling bad because *I* did it (guilt) and feeling bad because *it* happened through me (regret). If Elena broke no rule and violated no specific right (because the algorithm, not her, selected Henderson), a committee member can easily argue she is a tragic witness, not a dirty handler.
  *   **The Flip Condition:** If you cannot demonstrate that Elena violated a *right* (not just a rule) in Case 1, the "dirt" looks like sadness, not guilt. To fix this, you must argue that the *right* was violated by the office, and she *is* the office.
  *   **Weak Joint:** The walkthrough leans heavily on the idea that "Authorship via Endorsement" creates guilt. If the committee accepts the Steelman that "Signing is Acting," you win the "act" requirement but lose the "no wrong act" claim. If they reject it, you risk the Agent-Regret collapse.

  **2. Contested Reading of Walzer**
  My walkthrough assumes Walzer requires a *moral transgression*. This is contested. Some read Walzer as saying the politician is guilty *because* they must do what is morally forbidden to do the right thing politically. Others read him as saying the guilt is *political*, not moral.
  *   **The Risk:** If Walzer's guilt is purely political (i.e., "I lost my moral standing to rule"), then Case 1 might work easily (she lost standing). But if his guilt is *moral* (i.e., "I sinned"), Case 1 fails because she didn't sin.
  *   **Hedged Verdict:** The residue survives in the Ratification case, but only barely, and it depends entirely on whether you define "dirty" as *moral sin* or *political responsibility*. If your committee holds to the Moral Sin definition, this case will likely fail to generate DH without a clear violation. You may need to argue that *permissible acts can be morally sinful in context*, which is a heavy lift.

  **3. Is the Spec Unsatisfiable?**
  Strictly speaking, **yes**. The traditional definition of Dirty Hands (Walzer, Ignatieff, etc.) presupposes a moral violation ("doing wrong to do right"). If you remove the "wrong act" (by making the act permissible), you are arguably no longer talking about Dirty Hands, but about **Complicity** or **Structural Injustice**.
  *   **Useful for Paper:** This is actually your strongest angle. You can argue that the literature is *wrong* to limit DH to clear violations. The "dirt" of modern governance isn't in breaking rules; it's in *using* rules to harm. If you frame the paper as "Expanding DH to include Permissible Ratification," you own the tension. If you frame it as "Standard DH applies here," you will get hammered on the definition.

  **Recommendation:** Don't hide the unsatisfiability. Make it the point. The case works *only if* you convince the committee that "permissible acts within a corrupt structure" generate the same residue as "impermissible acts in a crisis." If they deny that, the case proves the concept is broken, which is also a result.
