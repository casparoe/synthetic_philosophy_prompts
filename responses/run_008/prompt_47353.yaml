          *   Bet P: 9/12 chance of 10 tokens. (EV = 7.5)
          *   Bet $: 3/12 chance of 30 tokens. (EV = 7.5)
      *   *Procedure:* Private sheet. Q1: Choose A or B. Q2: Selling price for A. Q3: Selling price for B.
      *   *Token Endowment:* Give everyone 10 tokens to start so they have skin in the game for the selling price (they "own" the ticket).

  3.  **Drafting Round 2: The Money Pump (The Exploitation)**
      *   *Role:* One student as "Banker/Arbitrageur". 11 targets.
      *   *Mechanism:* If a student chose Bet P but priced Bet $ higher, they are vulnerable.
      *   *The Pump:*
          1.  Student holds Bet P (from Round 1 endowment).
          2.  Arbitrageur offers to swap Bet P for Bet $ plus a small fee (1 token). Since they priced $ higher, they accept.
          3.  Arbitrageur offers to swap Bet $ back for Bet P plus a small fee (1 token). Since they *chose* P originally (revealed preference), they might accept if framed as "getting your favorite back."
          *   *Wait, standard Money Pump:* Requires intransitivity (A > B, B > C, C > A). Preference Reversal is slightly different (Choice vs. Price).
          *   *Adaptation:* To make it a true *money pump* based on reversal:
              *   State 1: You have Bet P.
              *   Offer 1: Trade P for $ minus 1 token. (Accepted because Price($) > Price(P)).
              *   State 2: You have Bet $.
              *   Offer 2: Trade $ for P minus 1 token. (Accepted because Choice(P) > Choice($)).
              *   Result: Back to P, minus 2 tokens.
      *   *Privacy:* Crucial. If done publicly, peers will shout "Don't do it!" Needs to be sequential and private (or whispered/notes).
      *   *Simultaneity:* If offered as a bundle ("Give me 2 tokens to swap P->$->P"), they would refuse. Must be sequential.

  4.  **Drafting Round 3: Diachronic Commitment (The Self-Binding)**
      *   *Scenario:* End of class raffle.
      *   *Option A:* 5 tokens now (immediate).
      *   *Option B:* 15 tokens at end of class (delayed).
      *   *The Twist:* Hyperbolic discounting setup.
      *   *Time 1 (Now):* Choose between A (now) and B (end). Most choose B.
      *   *Time 2 (20 mins later):* Choose between A (now) and B (end). Many switch to A.
      *   *Commitment:* At Time 1, allow them to pay 2 tokens to *remove* Option A at Time 2.
      *   *Sophisticates:* Pay the 2 tokens. Net: 15 - 2 = 13.
      *   *Naives:* Don't pay. At Time 2, take 5. Net: 5.
      *   *Implementation:* Needs to be managed carefully within the 90 mins.
      *   *Revised Plan for Round 3:* Keep it simple.
          *   Decision point 1 (Start of Round 3): Plan for end of class.
          *   Decision point 2 (10 mins later): Execute.
          *   Commitment Device: Pay 1 token at Point 1 to lock in Decision Point 2 choice.

  5.  **Drafting the Debrief:**
      *   *Mapping:*
          *   Round 1: Preference Reversal (Violation of Procedure Invariance).
          *   Round 2: Money Pump (Intransitivity/Cyclicity -> Exploitability).
          *   Round 3: Dynamic Inconsistency (Diachronic vs. Synchronic).
      *   *Escape Hatches:*
          1.  *Exploitability != Irrationality:* (McClennen). Maybe I just like trading? *Rebuttal:* The game showed token loss without utility gain.
          2.  *Refusal to Trade:* (Sobel). I can just say "no" to the second trade. *Rebuttal:* Requires foresight (sophistication) which contradicts the "naive" preference at step 2.
          3.  *Pairwise Coherence:* (Gustafsson). Preferences aren't defined over sequences. *Rebuttal:* If you accept pairwise, you are vulnerable.

  6.  **Candid Advice (Predictable Failures & Limitations):**
      *   *Failure 1:* No reversals. (Fix: Use stronger bets, emphasize "selling price" meaning).
      *   *Failure 2:* Arbitrageur freezes. (Fix: Give them a script).
      *   *Failure 3:* Tokens don't matter. (Fix: Make the raffle prize desirable, e.g., candy or extra credit if allowed).
      *   *Limitation:* Real money pumps require *indifference* or strict preference cycles. Here we rely on Choice/Price inconsistency. The game shows *exploitability*, but not necessarily *logical inconsistency* (as the prompt notes). The "unreproducible part" is the normative force that exploitability *entails* irrationality. That's a philosophical claim, not an empirical one. Also, the "small stakes" issue is real but secondary to the structural limitation.

  7.  **Refining the Numbers and Flow:**
      *   *Time Management:* 90 mins is tight for 3 rounds + debrief.
      *   Round 1: 20 mins.
      *   Round 2: 30 mins (Trading takes time).
      *   Round 3: 20 mins (Needs time gap).
      *   Debrief: 20 mins.
      *   *Constraint:* Round 3 needs a time delay to work diachronically. I need to structure the class so Round 3 starts early, pauses, and resolves at the end. Or, simulate the delay. Let's simulate the delay to save time, or make the "later" the end of class.
      *   *Better Round 3:* Make the choice at minute 60 for a payout at minute 90. But offer the commitment at minute 30.
      *   *Actually:* To fit 90 mins, Round 3 should be:
          *   T=0 (Start of R3): Plan for T=End.
          *   T=End: Execute.
          *   Commitment: Pay at T=0 to restrict T=End choice.
          *   *Wait, true diachronic inconsistency needs a change in preference.* If I prefer Large-Later at T=0, and Large-Later at T=End, there's no inconsistency. I need a "Small-Sooner" option that becomes available or tempting later.
          *   *Revised R3:*
              *   Phase 1 (Min 45): Choose between (5 tokens now) vs (15 tokens at end). *Most pick 15 at end.*
              *   Phase 2 (Min 85): Choose between (5 tokens now) vs (15 tokens at end). *Wait, if "now" is min 85, it's still "end of class".*
              *   *Fix:* Phase 1: Plan for Phase 2. Phase 2: Actual choice.
              *   Let's use the "Uncertain Wait" method.
              *   Actually, for a 90 min seminar, the classic "Small Now vs Large Later" is hard because "Now" means "End of Class".
              *   *Solution:* Use a "Mid-Class Break" logic.
              *   Option A: 5 tokens if you hand this in at Minute 60.
              *   Option B: 15 tokens if you hand this in at Minute 90.
              *   Commitment: At Minute 30, pay 2 tokens to make Option A unavailable at Minute 60.
              *   This works.

  8.  **Addressing the "Unreproducible Feature":**
