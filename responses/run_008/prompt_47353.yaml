answer: |-
  Here is a complete lesson plan designed for a 90-minute upper-level seminar. It balances game mechanics with philosophical rigor, specifically targeting the distinction between exploitability and irrationality.

  # Session Plan: The Cost of Consistency
  **Time:** 90 Minutes
  **Students:** 12
  **Materials:** 12 envelopes, 12 "Market Survey" sheets, 12 "Commitment" sheets, ~100 poker chips/tokens, 1 "Arbitrageur" script.
  **Incentive:** Tokens enter a raffle for a tangible prize (e.g., a $50 gift card or a significant course benefit like dropping a homework assignment). This ensures tokens have marginal utility.

  ---

  ## Round 1: Elicitation (The Reversal)
  **Time:** 0:00 – 0:20
  **Goal:** Induce a preference reversal (Choice vs. Valuation) without alerting students to the contradiction.

  **Setup:**
  1.  Distribute an envelope to each student containing 10 tokens (their endowment) and a "Market Survey" sheet.
  2.  Tell them this is a calibration exercise to determine the "market value" of bets for the end-of-class raffle. Emphasize privacy.

  **The Bets:**
  Present two lotteries based on a draw from a 12-sided die (which you will roll at the end of class).
  *   **Bet P (The Probability Bet):** Win **10 tokens** if the die shows 1–9 (75% chance).
  *   **Bet $ (The Dollar Bet):** Win **30 tokens** if the die shows 1–3 (25% chance).
  *   *Note:* Both have an Expected Value (EV) of 7.5 tokens.

  **The Survey:**
  1.  **Choice:** "If you must hold exactly one ticket for the raffle, which do you choose? (Circle P or $)"
  2.  **Valuation:** "Imagine you are given Ticket P. What is the *minimum* number of tokens you would accept to sell it back to the house? (Write integer 0–10)."
  3.  **Valuation:** "Imagine you are given Ticket $. What is the *minimum* number of tokens you would accept to sell it back to the house? (Write integer 0–10)."

  **Collection:**
  Collect the sheets. While you tally them (take 2 minutes), explain that one student will be selected as the "Market Maker" for Round 2. Select a student who appears attentive but not game-theoretically aggressive. Hand them the **Arbitrageur Script** (see below) and 5 "house" tokens to facilitate trades.

  **Expected Outcome:**
  A predictable fraction (often 30–50%) will **Choose P** (due to high probability) but **Price $ Higher** (due to anchoring on the high payoff). These are your "Pump Targets."

  ---

  ## Round 2: The Money Pump (The Exploitation)
  **Time:** 0:20 – 0:50
  **Goal:** Demonstrate that inconsistent valuations allow sequential trades that drain wealth without changing the final asset.

  **The Mechanism:**
  1.  **Assignment:** Every student is assigned the bet they *Chose* in Round 1. (If they chose P, they hold P).
  2.  **The Arbitrageur:** The selected student moves around the room. The rest of the class cannot talk to each other.
  3.  **The Rule:** Trades are **pairwise**, **sequential**, and **private**. The Arbitrageur approaches one target at a time. The target can Accept or Reject. If they Accept, tokens change hands immediately.

  **The Arbitrageur Script (For Pump Targets):**
  *If the student Chose P but Priced $ > P:*
  1.  **Offer 1:** "I see you hold Bet P. I am willing to trade you Bet $ plus I will give you 1 token from my house endowment."
      *   *Rationale:* Since they priced $ higher than P, they should view ($ + 1) as strictly better than P. They Accept.
      *   *State:* Student now holds Bet $.
  2.  **Offer 2:** "I see you hold Bet $. However, looking at your initial choice, you prefer P. I will trade you back Bet P, but you must pay me a 1 token transaction fee."
      *   *Rationale:* Since they originally *chose* P over $, they should view P as strictly better than $. They are willing to pay a small fee to get their preferred asset back. They Accept.
      *   *State:* Student now holds Bet P.
  3.  **Result:** The student holds the exact same asset as the start of the round but is **down 2 tokens**.

  **Crucial Constraint:**
  The Arbitrageur must **not** offer the bundle ("Give me 2 tokens to swap P for P"). It must be two distinct decisions separated by a change in asset ownership. If students realize the cycle, they must be allowed to refuse the second trade, but the pressure of the "sunk cost" of the first trade often compels completion.

  **For Non-Targets:**
  If a student was consistent (Chose P, Priced P higher), the Arbitrageur makes no offers or offers trades that are clearly disadvantageous (which they refuse).

  **Debrief Round 2:**
  Ask the targets: "Did you feel rational at each step?" (Yes). "Are you worse off?" (Yes).

  ---

  ## Round 3: Diachronic Commitment (The Self-Binding)
  **Time:** 0:50 – 1:10 (Setup) / Resolution at 1:30
  **Goal:** Distinguish synchronic consistency (Round 1 & 2) from diachronic consistency. Show that sophistication requires a cost.

  **The Setup:**
  Explain that the raffle will happen at the very end of class (Minute 90).
  1.  **The Temptation:** At Minute 60 (20 minutes from now), students will have an option to cash out early.
      *   **Option Early:** Receive **5 tokens** immediately (at Min 60).
      *   **Option Late:** Receive **15 tokens** at the end of class (Min 90).
  2.  **The Commitment Device:** Right now (Min 50), you may purchase a "Lock-In Contract."
      *   **Cost:** 2 tokens (deducted from your endowment now).
      *   **Effect:** If you buy this, Option Early will be **unavailable** to you at Minute 60. You will be forced to take Option Late.
      *   **No Contract:** At Minute 60, you are free to choose Early or Late.

  **The Decision:**
  Students privately decide whether to pay the 2 tokens for the Lock-In. Collect the fees.
  *   **Sophisticates:** Foresee they will succumb to temptation at Min 60. Pay 2 tokens. Net: 15 - 2 = 13 tokens.
  *   **Naives:** Believe they will stick to the plan. Pay 0 tokens. At Min 60, they choose Early. Net: 5 tokens.

  **Resolution:**
  At Minute 60, allow the "No Contract" students to choose. (Predictably, most will take the 5 tokens now). At Minute 90, pay out the Late tokens to the Lock-In buyers.

  ---

  ## Debrief: Mapping the Terrain
  **Time:** 1:10 – 1:30
  **Goal:** Connect the felt experience to formal theory and address escape hatches.

  ### 1. Formal Distinctions
  *   **Round 1 (Reversal):** This is a violation of **Procedure Invariance**. Your preference depended on the *mode of elicitation* (choice vs. pricing). It is not yet a logical contradiction (intransitivity), but it breaks the economic model of a stable utility function $U(x)$.
  *   **Round 2 (Pump):** This maps to **Acyclicity**. If you prefer A to B, B to C, and C to A, you have a cycle. The game showed that Procedure Invariance violations *enable* a money pump. You accepted $P \to (\$ + 1)$ and $(\$ - 1) \to P$. Combined, this implies $P \succ P - 2$, which is irrational.
  *   **Round 3 (Diachronic):** This distinguishes **Synchronic** vs. **Diachronic** rationality.
      *   *Synchronic:* At Min 60, choosing 5 now over 15 later might be rational (high discount rate).
      *   *Diachronic:* At Min 50, you preferred 15 (Late) over 5 (Early). At Min 60, you preferred 5 over 15. Your self at Min 50 and your self at Min 60 have conflicting orderings. Consistency across time is a different condition than consistency at a moment.

  ### 2. The Escape Hatches (Honest Assessment)
  Address the philosophical defenses against the money pump argument.

  *   **Escape Hatch 1: Exploitability $\neq$ Irrationality.**
      *   *Claim:* Being pumped shows I am vulnerable in *this* market, not that my preferences are logically flawed. (McClennen's "Resolute Choice").
      *   *Game Status:* **Rebutted.** In the game, the loss of tokens was objective. You ended with fewer resources for the raffle. If rationality is about effective means to ends, you failed.
  *   **Escape Hatch 2: Refusal to Trade.**
      *   *Claim:* A rational agent anticipates the pump and refuses the *first* trade. (Sobel).
      *   *Game Status:* **Standing.** In the game, students *could* have refused Offer 1. If they did, they wouldn't be pumped. This suggests the pump relies on "myopia" (looking only at the current trade). The game shows that *myopic* agents are exploited, not necessarily that *foresighted* agents with intransitive preferences are.
  *   **Escape Hatch 3: Pairwise Coherence.**
      *   *Claim:* Preferences are only defined over pairwise choices. A sequence of trades is a new object. Accepting trade 1 and trade 2 separately doesn't mean I accept the sequence. (Gustafsson).
      *   *Game Status:* **Standing.** The game forces pairwise decisions. It cannot force you to evaluate the *sequence* as a whole. If you deny that sequences are objects of preference, the pump loses its normative bite.

  ---

  ## Candid Advice: What Will Go Wrong & What You Can't Fix

  ### 1. Predictable Failures & Fixes
  *   **Failure: The Reversal Rate is Low.**
      *   *Risk:* Upper-level students know the trick. They might align their prices with their choices to look "rational."
      *   *Fix:* Frame Round 1 strictly as a "Market Survey" for the *instructor's research*, not a test of their rationality. Assure them there are no right answers. Use the specific numbers provided (9/12 vs 3/12); they are calibrated to trigger the cognitive shift between probability matching and payoff anchoring.
  *   **Failure: The Arbitrageur Freezes.**
      *   *Risk:* The student playing the Arbitrageur feels awkward demanding tokens from peers.
      *   *Fix:* Give the Arbitrageur a **script card** they can literally read. Tell them their goal is to "maximize house profit" and you will award them a bonus token for every 5 tokens they extract from the class. Gamify their role.
  *   **Failure: Collusion/Refusal.**
      *   *Risk:* Students realize the game and refuse all trades in Round 2.
      *   *Fix:* Run Round 2 *before* explaining the theory. Keep the "Market Survey" cover story alive as long as possible. If they refuse, acknowledge it: "You just acted as a 'Resolute Chooser.' That is one valid defense, but notice it required you to ignore your current valuation in favor of a future prediction."

  ### 2. The Unreproducible Feature
  You guessed that **stakes** are the problem (losing tokens feels less painful than real money). While true, that is not the deepest limitation.

  **The True Limitation: The Normative Leap.**
  The game successfully demonstrates **vulnerability**. It shows that *if* you have these preferences *and* you are myopic *and* you accept pairwise trades, *then* you lose tokens.
  What the game **cannot** reproduce is the philosophical claim that **vulnerability entails irrationality**.

  *   **Why:** A student can legitimately say, "I know I will be pumped. I accept that cost as the price of satisfying my local preferences at each step." (The "Money Pump as a Tax" argument).
  *   **The Lecture Gap:** You must supply the argument that rationality requires *global* coherence, not just *local* satisfaction. The game shows the *consequence* of incoherence (loss of tokens), but it cannot prove the *wrongness* of incoherence. That requires the philosophical premise that an agent should identify with their future selves and their total trajectory, not just their momentary impulses.
  *   **Indifference vs. Strict Preference:** Real money pump arguments often rely on indifference ($A \sim B$) to get the cycle started without a "loss" feeling at step 1. In this game, we rely on Choice/Price reversal. This is a violation of **Procedure Invariance**, not strict **Transitivity**. You will need to lecture on how Procedure Invariance is a necessary condition for Transitivity to be measurable. The game shows the symptom; the lecture must diagnose the disease.

  ### Summary for the Instructor
  Run the game fast. Let the confusion in Round 2 sit for a moment before resolving it. In the debrief, be humble: the game proves you can be exploited, but it does not prove you are illogical. That distinction is where the actual philosophy lives.
