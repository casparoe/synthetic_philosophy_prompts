      *   Also, the "Refusal to Trade" defense is hard to block in a game because students can just collude or stop. The theoretical pump assumes *compulsory* pairwise choice.

  9.  **Final Review against Constraints:**
      *   12 students? Yes.
      *   Tokens/Raffle? Yes.
