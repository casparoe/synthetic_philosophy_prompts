  2.  **Drafting Round 1: Elicitation (The Reversal)**
      *   *Goal:* Create the classic "Preference Reversal Phenomenon" (Lichtenstein & Slovic).
      *   *Bets:* Need a P-bet (High prob, low payoff) and a $-bet (Low prob, high payoff). Expected Values (EV) should be roughly equal, but P-bet usually chosen, $-bet priced higher.
