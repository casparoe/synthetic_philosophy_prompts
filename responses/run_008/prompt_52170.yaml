      *   *The Big Clash:* The biggest tension is between the *moral realism* of the Natural/Unnatural distinction (3 & 5) and the *conventionalism* of money (2). If money is just a token we agreed on, why is using it to make more money "against nature"? Nature usually implies something non-conventional.
