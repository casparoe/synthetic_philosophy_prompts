      *   *Point 2 (Conventionalism/Chartalism):* *Nomisma* is by convention (*nomos*), revaluable. Early chartalist.
      *   *Point 3 (Natural/Unnatural Wealth):* Household need (finite) vs. Money accumulation (infinite). Moral distinction.
      *   *Point 4 (Marx Critique):* Marx wrong about "common substance." Proportionality doesn't need a labor-theory-of-value (LTV) substrate. Slavery didn't blind Aristotle.
      *   *Point 5 (Usury):* Interest is unnatural (money breeding money). Money is for exchange, not reproduction.
      *   *Point 6 (Just Price):* Proportionality allows for *unjust* prices. Not market-neutral.

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: Point 2 (Conventionalism) vs. Point 5 (Usury/Nature of Money).*
          *   If money is *purely* conventional (Point 2), why is there a "natural" use for it (exchange) vs. an "unnatural" use (usury)? If the state can redefine money at will, can't it redefine interest?
          *   *Severity:* High. This strikes at the heart of the Nature/Convention distinction in Aristotle.
          *   *Fix:* Distinguish between the *material* of money (conventional) and the *function* of money (natural teleology).

      *   *Tension B: Point 1 (Reciprocity) vs. Point 4 (No Common Substance).*
