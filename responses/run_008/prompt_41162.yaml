answer: |-
  Dear Colleague,

  It is completely understandable why you keep hitting that wall with the epistemologists, because the problem of logical omniscience is essentially the point where formal elegance crashes into cognitive reality. When you ask for the desiderata of a theory that actually fits non-ideal agents, you are asking for a blueprint of a machine that can do logic without being a logic god. To get clear on what such a theory must deliver, we have to start with the cases that break the standard models, like the amateur chess player you mentioned. This player knows the rules of movement and knows the positions of the pieces, which logically entails that a mate in three is available, yet they do not know that mate is available. A viable theory must capture the intuition that the information is present in their mind but inaccessible without further work. It needs to distinguish between the storage of premises and the execution of inference. If the theory says the player knows the mate because it is a logical consequence of what they know, it fails to describe the agent. If it says they don't know it because they haven't calculated it, it must explain what kind of state they are in instead. They are not ignorant of the rules, nor are they ignorant of the board, so the ignorance must be located in the connection between the two.

  This leads directly to the case of the mathematician who believes a set of axioms but has not yet determined the truth of a conjecture derived from them. Here the theory must navigate the distinction between implicit and explicit belief without collapsing them. Implicit belief is often treated as the set of all logical consequences, but for a finite agent, that set is potentially infinite and unsearchable. Explicit belief is what the agent is currently ready to assert or use in reasoning. An adequate theory must allow an agent to explicitly believe the axioms and implicitly commit to the conjecture without forcing the claim that they explicitly believe the conjecture already. It must model the process of making the implicit explicit as a change in state, not just a revelation of a pre-existing static truth. This means the theory cannot treat belief as a simple relation between an agent and a proposition; it must treat belief as a relation between an agent, a proposition, and a computational history or resource state. The mathematician changes when they prove the conjecture, not because the world changed, but because their internal access to the truth changed.

  You also need to be wary of how these theories handle the distinction between normative ideals and descriptive accounts. Many epistemologists retreat to calling logical omniscience a norm, like a frictionless plane in physics, but this is unsatisfying for your piece because AI systems and humans are not trying to approximate frictionless planes; they are trying to survive and solve problems in friction. A theory for non-ideal agents must be action-guiding for the agent itself, not just for an observer judging the agent. It cannot simply say the agent ought to believe all consequences; it must offer a account of what the agent ought to do given that they cannot believe all consequences. This means the theory must incorporate bounds on memory and processing time as constitutive elements of rationality, not as external errors. If a theory defines rationality as closure under logic, then every human and every current AI is irrational by definition, which renders the concept of rationality useless for explaining behavior. The theory must redefine rationality to include the management of ignorance.

  Now, here is where you will find the friction that the epistemologists are trying to smooth over, because some of these demands are provably unsatisfiable when taken together. Specifically, you cannot have a theory that satisfies full logical closure, consistency, and computational tractability simultaneously. If you require that an agent's belief set is closed under classical logical consequence, you are requiring that the agent can decide validity for any proposition in their language. If that language is rich enough to express basic arithmetic, Gödel and Turing tell us that validity is undecidable. There is no algorithm that can list all truths without also running forever or getting stuck. Therefore, a finite agent physically cannot maintain a belief set that is closed under consequence. This is not a matter of engineering limitation; it is a logical impossibility. Any theory that claims to model a finite agent while maintaining full closure is describing something that cannot exist. You have to give up closure, or you have to give up the finitude of the agent, and since you are writing about real things, you must give up closure. The theory must specify which closures are kept and which are dropped, usually based on the complexity of the inference.

  This brings us to the tensions between the desiderata. You want a theory that is closed enough to do logic with, because if belief isn't closed under anything, you can't model reasoning, but loose enough to model finite creatures. The trade-off is usually handled by restricting the logic, perhaps to fragments of first-order logic, or by introducing a measure of awareness. But there is a deeper conflict between the requirement for consistency and the requirement for realistic modeling. Real agents, including large language models, often hold contradictory beliefs without exploding into triviality where they believe everything. Standard logic says if you believe a contradiction, you believe everything. A theory for non-ideal agents must be paraconsistent, allowing for local contradictions without global collapse. However, maintaining paraconsistency while still allowing for useful inference is computationally expensive and logically complex. You are asking for a system that is robust to error but still precise enough to be called knowledge.

  If I had to identify the single requirement on this list that knocks out the most fashionable fixes, it is the requirement that the theory must treat inference as a resource-consuming action rather than a static relation. Many popular solutions, such as impossible worlds semantics, try to solve logical omniscience by adding more worlds where logic works differently. This allows an agent to believe P and not believe Q even if P implies Q, by saying they are in a world where the implication fails. But this is a static fix for a dynamic problem. It describes the state of ignorance without explaining the cost of overcoming it. It adds ontological baggage without addressing the computational bottleneck. Similarly, awareness logic adds a syntactic filter to say the agent is not aware of the proposition, but it often treats awareness as a binary switch rather than a process of computation. If your theory does not account for the time and energy required to move from not knowing to knowing, it cannot explain why the chess player missed the mate or why the mathematician struggles with the conjecture. It treats the lack of knowledge as a structural feature of the mind rather than a consequence of the work required to think.

  The reason this requirement is so destructive to standard fixes is that it shifts the focus from what is believed to how believing happens. Most formal epistemology is concerned with the snapshot of belief states, but for non-ideal agents, the trajectory matters more than the position. A theory that meets this requirement must be procedural, modeling the steps of deduction as actions that deplete resources. This invalidates the frictionless plane defense because there is no such thing as a frictionless inference for a physical system. It also challenges the idea that AI systems know things in the way people do, because their computational costs are distributed differently than ours. They might retrieve a fact instantly that takes a human years to derive, but they might also fail to see a simple contradiction that a human would spot immediately due to architecture differences. By demanding that the theory model the cost of inference, you force the epistemologists to stop talking about ideal agents and start talking about the mechanics of thinking. This is likely why they resist it, because it moves the problem from logic to computer science and psychology, where the clean proofs are harder to come by.

  I hope this helps you map out the terrain before you start quoting the experts. The key is to keep pressing on the difference between a theory that describes what an agent would believe if they were infinite, and a theory that describes what an agent does believe because they are finite. The former is mathematics; the latter is science.

  Best wishes with the piece.
