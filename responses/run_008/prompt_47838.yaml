answer: |-
  Your intuition is correct, and the philosophical consensus regarding the Pasadena game suffers from a form of mathematical purism that physics abandoned long ago. The contention that conditionally convergent expected utility series are "undefined" rests on the assumption that the expectation operator must be a linear functional invariant under all permutations of the sample space partition. This is equivalent to demanding that all integrals be Lebesgue integrals. As you know, the Lebesgue integral is undefined for functions that are not absolutely integrable. However, physical quantities are rarely Lebesgue integrals of fundamental fields; they are often limits of regularized sums constrained by boundary conditions.

  I will argue that decision theory should adopt the physicist's stance: the value of a Pasadena-style gamble is not undefined, but *scheme-relative*. The theoretical task is not to abandon expected utility (EU) but to identify the principled regularization scheme that a rational agent is compelled to use by the structure of the choice situation. I will address the disanalogy regarding the lack of an experimental arbiter by arguing that the *causal and procedural structure* of the gamble plays the role of boundary conditions in physics. Finally, I will contend that while this renders value partly conventional, the conventionality is benign and sufficient for normative decision theory.

  ### 1. The Mathematical Status of the Gamble

  Let a gamble $G$ be defined by a countable set of outcomes $\{x_n\}$ with associated probabilities $\{p_n\}$, where $\sum p_n = 1$ and $p_n > 0$. The utility of the gamble is traditionally modeled as the sum:
  $$ U(G) = \sum_{n=1}^{\infty} p_n u(x_n) $$
  In the Pasadena case, this series converges conditionally. By the Riemann Rearrangement Theorem, for any $V \in [-\infty, \infty]$, there exists a permutation $\sigma: \mathbb{N} \to \mathbb{N}$ such that $\sum_{n=1}^{\infty} p_{\sigma(n)} u(x_{\sigma(n)}) = V$.

  The standard philosophical conclusion is that because $U(G)$ is permutation-dependent, and no permutation is intrinsically privileged, $U(G)$ is indeterminate. This treats the series as a free-standing mathematical object. Your physicist's reflex treats the series as a *representation* of a physical (or in this case, decision-theoretic) process. In physics, a divergent or conditionally convergent mode sum $\sum \omega_n$ is never evaluated in isolation; it is evaluated as $\lim_{\Lambda \to \infty} \sum f(\omega_n, \Lambda)$, where $f$ is a regulator (cutoff, damping, zeta function) justified by the physical context.

  We should define the utility of a gamble not as a number, but as a functional dependent on a summation scheme $\mathcal{S}$:
  $$ U_{\mathcal{S}}(G) = \mathcal{S}\text{-}\lim_{N \to \infty} \sum_{n=1}^{N} w_N(n) p_n u(x_n) $$
  where $w_N(n)$ is a weighting function (e.g., a sharp cutoff or smooth damping) characteristic of scheme $\mathcal{S}$. The claim is that rationality does not require $U(G)$ to be scheme-independent, but rather that the agent must adopt a specific $\mathcal{S}$ mandated by the problem structure.

  ### 2. The Disanalogy: Experiment vs. Normativity

  The most serious objection to this analogy is the role of the arbiter. In the Casimir effect, we know the regularization is correct because the force is measured. The experiment breaks the symmetry of possible regularization schemes. In decision theory, there is no "utility meter." If we propose a canonical ordering (e.g., the natural numbers $n=1, 2, \dots$), the skeptic asks: "What normative force privileges this order? If you choose a different order, you get a different value. Without an experiment to rule one out, the choice is arbitrary, and the indeterminacy returns."

  To resolve this, we must identify what plays the role of "boundary conditions" or "symmetries" in a decision problem. It is the **causal and procedural generation of the probabilities**.

  A gamble is not merely a set of outcome-probability pairs $\{(p_n, x_n)\}$. It is a random variable $X: \Omega \to \mathbb{R}$ defined on a probability space $(\Omega, \mathcal{F}, P)$. The series representation arises from a specific partition of $\Omega$. In the standard formulation of the Pasadena game, the index $n$ corresponds to the number of coin tosses required to terminate the game, or the $n$-th element in a specific enumeration of the sample space.

  In physics, we do not sum modes in an arbitrary order; we sum them according to energy levels or momentum modes because those are the eigenstates of the Hamiltonian governing the system. The "natural ordering" is dictated by the dynamics. Similarly, in a gamble, the index $n$ is rarely a mere label. It usually encodes the *temporal* or *logical* sequence of the chance process.
  *   If the gamble is played by tossing a coin until a condition is met, $n$ represents the time of termination.
  *   Summing in the order of $n$ corresponds to evaluating the expected utility as the limit of the utility of the game truncated at time $T$, as $T \to \infty$.

  This is the decision-theoretic analogue of a physical cutoff. A "reordering" of the series corresponds to a counterfactual procedure where outcomes are realized in a different causal sequence. If the game is defined as "toss until heads," the outcome "Heads on toss 1" *causally precedes* "Heads on toss 2" in the logical structure of the event tree, even if the payout is received later. To sum them in a different order is to evaluate a *different game*—one where the agent somehow accesses the outcome of the 100th toss before the 1st.

  Therefore, the "experiment" that disciplines the regularization is the **operational definition of the gamble**. The constraint is that the summation order must respect the filtration of the probability space generated by the chance process. This is not an arbitrary mathematical choice; it is a constraint imposed by the description of the wager.

  ### 3. Addressing the Skeptic: Arbitrariness and Invariance

  The skeptic will persist: "Why is the temporal/logical order privileged? Utility is about the final state of wealth, not the path. If the final distribution of wealth is the same, the order of summation should not matter."

  This objection conflates the *distribution* of the random variable with the *random variable itself*. Two random variables can have the same distribution (same set of pairs $\{(p_n, x_n)\}$) but be defined on different sample spaces or with different dependencies on the underlying chance process. However, even if we grant that only the final distribution matters, we face the mathematical fact that the expectation integral $\int X dP$ is only order-independent if $X$ is absolutely integrable ($\int |X| dP < \infty$).

  If $\int |X| dP = \infty$, the expectation is not a property of the distribution alone; it is a property of the distribution *plus* the method of integration. The skeptic argues this makes the value subjective. I argue it makes it **scheme-relative**, which is distinct from subjective.

  Consider the requirement of **Descriptive Invariance**. A rational agent's valuation should not change if the gamble is redescribed in a way that preserves its causal structure.
  *   **Allowed Redescription:** Renaming outcomes, changing currency units (linear transformation of utility).
  *   **Forbidden Redescription:** Re-indexing the sample space partition in a way that scrambles the causal filtration.

  If the "natural order" is fixed by the causal generation (the filtration), then reordering the series is not a permissible redescription; it is a modification of the gamble's structure. Thus, the indeterminacy is not reinstated one level up. The "canonical" ordering is not arbitrary; it is the unique ordering compatible with the sequential realization of the uncertainty.

  Furthermore, we can impose a **Correspondence Principle** as a constraint on the regularization scheme $\mathcal{S}$:
  1.  **Consistency:** For any gamble where $\sum |p_n u(x_n)| < \infty$, $U_{\mathcal{S}}(G)$ must equal the standard expected value.
  2.  **Linearity:** $U_{\mathcal{S}}(aG + bH) = a U_{\mathcal{S}}(G) + b U_{\mathcal{S}}(H)$ for independent gambles $G, H$ (where possible).
  3.  **Stability:** Small perturbations in the probabilities or utilities should not lead to discontinuous jumps in $U_{\mathcal{S}}(G)$.

  Many summation schemes (e.g., arbitrary rearrangements) fail stability. The "natural order" partial sums (Cesàro means or Abel summation applied to the natural index) are typically the most stable under perturbation of the tail. This stability acts as the "symmetry breaking" field. Just as we choose a regularization in QFT that preserves gauge invariance, we choose a summation scheme in decision theory that preserves *procedural invariance*.

  ### 4. Objectivity vs. Conventionality

  Does this make the value objective? We must be precise.
  *   **Strong Objectivity:** The value is a mind-independent fact inherent to the gamble. (False, as shown by the rearrangement theorem).
  *   **Weak Objectivity (Intersubjectivity):** The value is determined by the gamble plus a set of rational constraints on the evaluation scheme. (True).

  The choice of summation scheme is conventional in the same sense that the choice of a coordinate system is conventional. There is no "true" coordinate system in spacetime, but there are *preferred* coordinate systems (e.g., inertial frames) dictated by the physics. Similarly, there is no "true" sum for a conditionally convergent series, but there are *preferred* summation schemes dictated by the procedural structure of the gamble.

  If the conventionality is ineradicable, is it sufficient for rational decision-making? Yes. Rationality does not require access to Platonic values; it requires **coherence**.
  *   If an agent adopts a regularization scheme $\mathcal{S}$ (e.g., "I value gambles by the limit of their partial sums in the order of realization"), they can avoid Dutch Books *within that scheme*.
  *   Irrationality arises only if the agent violates the constraints of their own scheme (e.g., treating a conditionally convergent gamble as if it were absolutely convergent, or switching schemes opportunistically to justify inconsistent preferences).

  The physicist does not worry that the Casimir energy depends on the regularization scheme *provided* the scheme respects the boundary conditions and yields finite, measurable differences. Similarly, the decision theorist should not worry that the utility depends on the summation scheme *provided* the scheme respects the causal filtration and yields consistent choices.

  ### 5. Conclusion

  The Pasadena paradox does not demonstrate the failure of expected utility theory; it demonstrates the failure of the assumption that expectation is a permutation-invariant functional on the space of all probability distributions. This assumption is mathematically untenable for conditionally convergent series.

  Your physicist's instinct is the correct one. The "undefined" status is an artifact of demanding absolute convergence where the physical (or procedural) context only supports conditional convergence. The solution is to acknowledge that $U(G)$ is a function of the gamble *and* the summation protocol. The "experiment" that selects the protocol is the causal structure of the gamble itself, which privileges the natural ordering of the sample space partition (the filtration).

  While this renders value scheme-relative, it does not render it subjective or arbitrary. It renders it analogous to a coordinate-dependent quantity in physics: conventional in representation, but objective in its structural constraints and its capacity to generate consistent, testable predictions about choice behavior. The rational agent is not one who finds the "true" value of a Pasadena gamble, but one who consistently applies a regularization scheme justified by the procedural invariance of the decision context.
