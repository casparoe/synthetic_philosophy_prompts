prompt: |-
  Bit of a panic situation here. I'm a PhD student in evo bio, and my supervisor runs the second-year 'evolution and adaptation' module. On Friday the lecturer who was supposed to do next Tuesday's seminar got rushed into hospital (she's fine, apparently), so I've been handed her slot: fifty minutes on the Gould & Lewontin spandrels paper (the 1979 one in the Proceedings of the Royal Society) for a group of ~15 undergrads. I've read the paper years ago but never taught it, and I've got basically the weekend to plan this.

  Important context: these students are exactly the audience who needs the paper and are exactly the audience primed to misread it. They've spent two terms being taught that natural selection is the explanation for everything interesting in biology, and they loved it — they're basically baby adaptationists. They think adaptationist explanations are just "doing biology properly." So I need a plan that takes that enthusiasm seriously instead of stomping on it, because if I make them feel like their whole toolkit is being called stupid they'll just write Gould and Lewontin off as contrarians and learn nothing.

  What I want from you is a teaching plan, not the content itself — I know the content, or I think I do. Specifically:

  1. Order of ideas: what has to be established before what for the critique to land as an argument rather than as a vibe? E.g., does the distinction between "the trait has a current function" and "the trait evolved for that function" need to come before the spandrel example or after it? What about the notion of developmental/architectural constraints? Tell me what depends on what and where you'd start.

  2. The carrying example: the paper's own centrepiece is the spandrels of St Mark's Basilica, and I'm half inclined to use it because it's beautiful. But should I actually build the whole session on it, or does it risk students thinking spandrels are just "traits selection didn't make" and hence that the whole point is selection-denial? If there's a better biological example to carry the weight (I keep going back and forth between things like the classic human chin debate, blood being red, whatever you think works), tell me what the example must contain and what it must NOT contain, and why.

  3. Misconception map: I predict the students will think (a) the paper claims most traits aren't adaptations, (b) it's anti-Darwinian, and (c) "spandrel" just means "junk" or vestigial. Which of these is actually going to hit hardest, in what order will they form, and at exactly which point in my sequence should I pre-empt each? Also flag any misconception you think I haven't predicted.

  4. The check: one question (or a very short task) I can pose in the last five minutes that would distinguish "understood the paper as a claim about method and evidence" from "learned the vocabulary and now distrusts all adaptation talk."

  5. What to leave out: I'm assuming the exaptation/spandrel/preneadaptation terminology thicket and the whole later reception fight (Dennett's complaint about pendentives, all that) is too much for one session — but I'd rather hear your call than mine.

  Also, if it matters for your plan: the room has a projector and a whiteboard, and I can't assume any of them have read the paper. Write everything in British English please, and apologies for the typos — typing this on my phone in a corridor.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Evo Bio, panicking slightly.
      *   **Task:** Teach a 50-minute seminar on Gould & Lewontin's 1979 "Spandrels" paper to 2nd-year undergrads.
      *   **Audience:** ~15 students, "baby adaptationists" (love natural selection, think it explains everything), prone to misreading the paper as anti-Darwinian or claiming nothing is an adaptation.
      *   **Goal:** A *teaching plan* (structure, pedagogy, sequencing), not just content summary. Needs to validate their existing knowledge while introducing the critique.
      *   **Specific Questions:**
          1.  Order of ideas (sequencing).
          2.  Carrying example (Spandrels vs. Biological).
          3.  Misconception map (prediction and pre-emption).
          4.  The Check (assessment question).
          5.  What to leave out (scope).
      *   **Constraints:** British English, 50 mins, projector + whiteboard, students haven't read the paper.

  2.  **Deconstruct the Challenge:**
      *   *The Trap:* The "Spandrels" paper is famously misunderstood. Students often walk away thinking "Adaptationism is wrong" rather than "Adaptationism needs rigorous testing."
      *   *The Audience:* They are excited about natural selection. Telling them "you're wrong" triggers defensiveness. The approach must be "You're right that NS is powerful, but here's how to use it *better*."
      *   *Time:* 50 minutes is very short for this dense philosophical paper. Focus is key.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Ideas (Sequencing):**
          *   *Problem:* If I start with the Spandrel analogy, they get stuck on architecture. If I start with "Adaptationism is bad," they tune out.
          *   *Solution:* Start with their strength. Start with a classic adaptationist story (Just-So Story). Show why it's satisfying but potentially untested. *Then* introduce the constraint/alternative hypothesis idea. *Then* introduce the Spandrel analogy as a metaphor for that logical error.
          *   *Key Distinction:* "Current Utility" vs. "Evolutionary Origin." This must come *before* the spandrel example, otherwise, they think spandrels have no use (they do, for decoration), but weren't *selected for* initially.
          *   *Sequence:* Adaptationist enthusiasm -> The logical gap (utility $\neq$ origin) -> Constraints/Byproducts -> Spandrel Analogy -> Biological Application -> Methodological takeaway.

      *   **2. The Carrying Example:**
          *   *Spandrels of St Mark's:* It's iconic but risky. Students might think "Oh, so it's about buildings, not biology." Or they might get bogged down in architecture (pendentives vs. spandrels).
          *   *Biological Example:* Needs to be clear, non-controversial (avoid heated current debates), and illustrate a byproduct.
          *   *Candidate:* Blood redness. (Haemoglobin is for oxygen transport; redness is a chemical byproduct. No one thinks redness was selected for camouflage or signaling primarily).
          *   *Candidate:* Human Chin. (Often cited, but debated).
          *   *Candidate:* Male Nipples. (Classic, but can be distracting/silly for some).
          *   *Decision:* Use the Spandrel analogy *as the metaphor* for the logical structure, but anchor it immediately with a biological byproduct example like **Blood Redness** or **Bone Colour**. Actually, **Gould's own example of the tree of life iconography** or simply **exaptation** (feathers for warmth -> flight) is good, but the prompt asks about the *Spandrel* paper specifically.
          *   *Refinement:* Keep the St Mark's spandrel because it's the title and the visual hook. *But* immediately pivot to a biological byproduct. Let's suggest **the redness of blood** or **the noise of the heartbeat**. It clearly separates function (transport/pumping) from physical consequence (colour/sound).
          *   *Criteria:* Must show a trait exists *necessarily* due to another selected trait, not independently selected. Must NOT be vestigial (appendix) because spandrels aren't useless, just not *selected for* initially.

      *   **3. Misconception Map:**
          *   *Prediction (c) "Spandrel = Junk":* This will happen early if I don't distinguish 'byproduct' from 'vestigial'. Pre-empt when defining the term.
          *   *Prediction (b) "Anti-Darwinian":* This is the biggest risk. They will feel their toolkit is under attack. Pre-empt in the *Introduction*. Frame G&L as "Better Darwinians," not "Anti-Darwinians."
          *   *Prediction (a) "Most traits aren't adaptations":* This comes later. They might swing the pendulum too far. Address in the conclusion/wrap-up.
          *   *Hidden Misconception:* "Constraints mean evolution stops." Need to clarify constraints channel evolution, they don't halt it.

      *   **4. The Check:**
          *   Need to distinguish "Methodological understanding" vs. "Vocabulary memorisation."
          *   Bad question: "What is a spandrel?" (Recall).
          *   Good question: Present a new scenario. "A moth has wing patterns that look like eyes. Predators avoid them. Does this prove they evolved *for* predator avoidance? What else must you rule out?"
          *   This tests if they understand the *burden of proof* shift, which is the core of the paper.

      *   **5. What to Leave Out:**
          *   *Exaptation vs. Preadaptation:* Too much terminology. Stick to "Byproduct" vs. "Adaptation."
          *   *Dennett/Pinker debates:* Definitely out. Too historical.
          *   *Detailed Architecture:* Don't get bogged down in pendentives vs. arches. Keep it visual.
          *   *Sociobiology specifics:* The paper targets sociobiology heavily, but for 2nd years, keep it general evo bio.

  4.  **Refining the Tone:**
      *   British English (e.g., "programme," "centre," "whilst," "modelling").
      *   Empathetic to the panic (reassuring but structured).
      *   Professional academic pedagogy.

  5.  **Review against Constraints:**
      *   50 minutes? The timing needs to be tight.
      *   15 students? Allows for discussion. Use that.
      *   Projector/Whiteboard? Plan for visuals.
      *   Students haven't read paper? Don't quote dense text. Summarise arguments.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* I initially thought about putting the Spandrel analogy first. But the prompt asks if distinction between function/origin comes before. Yes, it must. If they think "Function = Origin," the Spandrel analogy makes no sense (because spandrels *have* a function now, decoration). So, Function $\neq$ Origin must be established *before* the Spandrel.
      *   *Correction on Example:* Blood redness is good, but maybe too simple? What about the **umbilicus (belly button)**? It's a scar. It has no function, but it's not a spandrel (spandrels can be co-opted). Let's stick with **Red Blood**. It's chemically necessary, not selected for colour. Or **Bone Density**. Let's recommend **Red Blood** for clarity, but warn against using **Vestigial traits** (like the appendix) as spandrels.
      *   *Timing:* 5 mins intro, 10 mins adaptationist mindset, 10 mins the logical critique (utility vs origin), 15 mins spandrel + bio example, 5 mins discussion/check, 5 mins wrap.

  7.  **Final Output Structure:**
      *   Reassurance/Opening.
      *   Section 1: Order of Ideas (The Narrative Arc).
      *   Section 2: The Carrying Example (Spandrels vs. Biology).
      *   Section 3: Misconception Map.
      *   Section 4: The Check.
      *   Section 5: What to Leave Out.
      *   Timing breakdown.

  8.  *(Final check on British English)*: Ensure "s" instead of "z" in organisation/colour, "whilst", "module", "seminar", "marking".

  9.  *(Final check on Tone)*: Supportive, authoritative but collaborative.

