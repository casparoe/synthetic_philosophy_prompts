          *   *Crucial Nuance:* (5) says "choose the outcome with better prospects." If IVF allows choosing the embryo without the gene, (5) pushes toward IVF. But (5) usually applies to *which* child.
          *   *Verdict:* The tension is exactly why the sister says it depends. If you prioritize (1)+(3), you can't screen based on harm to child. If you prioritize (4), you must screen. The "Cheapest Fix" (Non-comparative harm) supports (4), thus supports Screening.

  7.  **Drafting the Response:**
