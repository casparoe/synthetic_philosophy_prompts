          *   *Refinement for "Exchange":* The prompt asks for an "exchange." The Office definition looks for "private advantage." If the officials get *no* private advantage, Office says clean. The Outcome definition looks for "cheats the public."
          *   *Let's try a Campaign Finance angle.* It's very AP Gov relevant.
