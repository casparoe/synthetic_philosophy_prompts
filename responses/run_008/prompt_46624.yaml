          *   *Let's go with the "Fee-for-Service" model that excludes the poor.*
          *   *Scenario:* The Springfield School District, facing a budget shortfall, votes openly to allow "Curriculum Enhancement Fees." Parents can pay $500 per semester to unlock advanced lab equipment and guest lecturers for their children's specific homeroom. The policy is written into the student handbook, applies to anyone who pays, and the revenue stays in the general school budget to offset the shortfall. No administrator receives a bonus.
          *   *Office-and-Rules:* Clean. Rule-based, transparent, revenue helps the district (public good), no self-dealing.
          *   *Outcome-and-Inequality:* Wealthy parents pay, their kids get better education. Poor kids stay in basic classes. The public school system, meant to equalize opportunity, now legally entrenches class disparity within the same building.
          *   *Fit:* This is very realistic, local, and clearly shows the divergence. The "exchange" is money for educational advantage, facilitated by the state.

  4.  **Drafting the Scenario (One Paragraph Constraint):**
